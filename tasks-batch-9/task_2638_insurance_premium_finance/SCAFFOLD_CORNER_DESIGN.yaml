            - "no partial writes: GET /agreements filtered by state_rule_id returns total_count == 1 (only the legal setup agreement), GET /policies filtered by agreement_id returns total_count == 1, and GET /policies/${ve_pol}/verifications returns total_count == 0"

      - name: satisfaction_to_pass_every_statutory_limit_at_its_legal_extreme_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_25_ERR_TERM_EXCEEDS_STATE_MAXIMUM
          - validations.priority_27_ERR_SERVICE_FEE_ABOVE_CAP
          - validations.priority_31_ERR_INVALID_POLICY_TERM
          - validations.priority_33_ERR_INVALID_FIRST_DUE_DATE
          - validations.priority_38_ERR_PREMIUM_VARIANCE_EXCEEDED
        distinguishing_aspect: |
          The mirror image of the violation sweep: every one of the same five bounds is set to its
          EXTREME LEGAL value in a single request and the whole chain must succeed — installment_count
          exactly equal to max_term_months, service_fee exactly equal to the cap, first due exactly on
          clock + 60 days, min_earned_days exactly equal to the term length, and a corrected premium
          exactly on the +2500 bps tolerance. Because all five inclusive bounds are exercised at once,
          a single off-by-one comparison anywhere in §1.4 turns a 201/200 into a 422, and the final
          quote proves the accepted correction actually re-priced the note across a volume tier.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15, so clock + 60 days is exactly 2026-10-14"
            - "the canonical TX regime with an effective License, one Insured, one ProducerAgent, one Insurer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { sp_rule: "$.data.id", sp_max_term: "$.data.max_term_months", sp_max_fee: "$.data.max_service_fee_cents" }
            - call: "POST /state-rate-rules/${sp_rule}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { sp_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { sp_agent: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { sp_insurer: "$.data.id" }
          trigger:
            - call: "POST /agreements"
              payload: { insured_id: "${sp_insured}", producer_agent_id: "${sp_agent}", state_rule_id: "${sp_rule}", down_payment_cents: 150000, service_fee_cents: 2000, installment_count: 10, first_installment_due_date: "2026-10-14" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sp_agr: "$.data.id", sp_status: "$.data.status", sp_n: "$.data.installment_count", sp_fee: "$.data.service_fee_cents", sp_due: "$.data.first_installment_due_date" }
            - call: "POST /agreements/${sp_agr}/policies"
              payload: { insurer_id: "${sp_insurer}", policy_number: "MC-SP-1", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 365, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sp_pol: "$.data.id", sp_min_earned: "$.data.min_earned_days", sp_pol_status: "$.data.status" }
            - call: "POST /agreements/${sp_agr}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sp_sub_status: "$.data.status", sp_prov_af: "$.data.amount_financed_cents", sp_prov_rate: "$.data.effective_annual_rate_bps", sp_prov_fc: "$.data.finance_charge_cents" }
            - call: "POST /policies/${sp_pol}/verifications"
              payload: { decision: "CORRECTED", corrected_premium_cents: 750000, note: "audited payroll exposure raised the premium" }
              as: Insurer
              as_user_id: "${sp_insurer}"
              captures: { sp_v1_party: "$.data.party", sp_v1_prem: "$.data.effective_premium_cents" }
            - call: "POST /policies/${sp_pol}/verifications"
              payload: { decision: "CORRECTED", corrected_premium_cents: 750000, note: "agency agrees with the audited figure" }
              as: ProducerAgent
              as_user_id: "${sp_agent}"
              captures: { sp_v2_party: "$.data.party", sp_v2_prem: "$.data.effective_premium_cents" }
            - call: "GET /policies/${sp_pol}"
              payload: {}
              as: FinanceAnalyst
              captures: { sp_pol_verified: "$.data.status", sp_pol_vprem: "$.data.verified_premium_cents", sp_pol_fin: "$.data.financed_premium_cents" }
            - call: "POST /agreements/${sp_agr}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { sp_act_status: "$.data.status", sp_total: "$.data.total_premium_cents", sp_af: "$.data.amount_financed_cents", sp_rate: "$.data.effective_annual_rate_bps", sp_fc: "$.data.finance_charge_cents", sp_top: "$.data.total_of_payments_cents" }
            - call: "GET /agreements/${sp_agr}/installments"
              payload: { limit: 100 }
              as: FinanceAnalyst
              captures: { sp_i1_amt: "$.data[0].amount_cents", sp_i1_fc: "$.data[0].finance_charge_component_cents", sp_i1_pr: "$.data[0].principal_component_cents", sp_i1_due: "$.data[0].due_date", sp_i10_amt: "$.data[9].amount_cents", sp_i10_due: "$.data[9].due_date" }
          assert:
            - "${sp_n} == 10 == ${sp_max_term} and ${sp_fee} == 2000 == ${sp_max_fee}: both caps are inclusive, so the agreement is created (201) with ${sp_status} == 'DRAFT'"
            - "${sp_due} == '2026-10-14' == clock + 60 days exactly, accepted because the upper bound of priority 33 is inclusive"
            - "${sp_min_earned} == 365 exactly equals the term length days_between(2026-09-01, 2027-09-01), accepted because priority 31 forbids only EXCEEDING the term; ${sp_pol_status} == 'PENDING_VERIFICATION'"
            - "${sp_sub_status} == 'PENDING_VERIFICATION' with the provisional quote ${sp_prov_af} == 452000 == 600000 - 150000 + 2000, ${sp_prov_rate} == 1800 (tier 1, 452000 <= 500000) and ${sp_prov_fc} == 67800 == round_half_up(452000 * 1800 * 10 / 120000)"
            - "the down-payment ratio passes on the provisional basis because 150000 * 10000 == 1500000000 >= 600000 * 1500 == 900000000"
            - "the correction sits exactly on the tolerance: abs(750000 - 600000) * 10000 == 1500000000 == 600000 * 2500, and equality is accepted, so BOTH verifications are recorded with ${sp_v1_party} == 'INSURER', ${sp_v2_party} == 'PRODUCER_AGENT' and ${sp_v1_prem} == ${sp_v2_prem} == 750000"
            - "${sp_pol_verified} == 'VERIFIED' with ${sp_pol_vprem} == 750000 and ${sp_pol_fin} == 750000 because the two parties agree on both premium and effective date"
            - "${sp_act_status} == 'ACTIVE': the activation re-check of the down-payment ratio also passes on the FINAL basis, 150000 * 10000 >= 750000 * 1500 == 1125000000, and the service fee 2000 is still within the cap"
            - "the accepted correction moved the volume tier: ${sp_total} == 750000, ${sp_af} == 602000 == 750000 - 150000 + 2000, ${sp_rate} == 1500 (tier 2, because 602000 > 500000) and ${sp_fc} == 75250 == round_half_up(602000 * 1500 * 10 / 120000), so ${sp_top} == 677250"
            - "the ten-installment schedule divides evenly: ${sp_i1_amt} == 67725 == 677250 / 10 with ${sp_i1_fc} == 7525 and ${sp_i1_pr} == 60200, and ${sp_i10_amt} == 67725 as well because the remainder is zero"
            - "${sp_i1_due} == '2026-10-14' and ${sp_i10_due} == '2027-07-14'"

      - name: aggregate_validation_late_fee_count_cap_holds_across_successive_sweeps
        claim_type: aggregate_validation
        grounds:
          - calculations.late_fee_assessment.formula
          - entities.StateRateRule.fields.max_late_fees_per_agreement
          - entities.PremiumFinanceAgreement.fields.late_fee_count
        distinguishing_aspect: |
          Each individual assessment is perfectly legal — five distinct installments each go past due
          past their own grace period — but the COLLECTIVE count is capped at max_late_fees_per_agreement
          == 3, so sweeps four and five mark the installment PAST_DUE and assess nothing. The second
          half is the trap: waiving a fee drops late_fee_balance_cents but must NOT decrement
          late_fee_count, so the cap is permanently consumed and the sweep after the waiver still
          assesses nothing. An implementation that counts OUTSTANDING fees instead of lifetime
          assessments frees up headroom and issues a fourth fee here.
        test_recipe:
          setup:
            - "the canonical TX regime with max_late_fees_per_agreement 3, grace_period_days 10 and an effective License"
            - "the 600k note ACTIVE, so its six installments fall due 2026-10-01, 2026-11-01, 2026-12-01, 2027-01-01, 2027-02-01 and 2027-03-01, each for 89941 except the last"
            - "no payment is ever made, so every installment goes delinquent in turn"
