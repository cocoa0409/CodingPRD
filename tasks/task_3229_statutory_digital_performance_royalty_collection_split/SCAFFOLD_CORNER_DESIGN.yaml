        grounds: ["concurrency_rules[liability-compute-stale-report]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Compute with expected_usage_report_version one behind the current version (bumped by the first compute itself) returns 412 ERR_STALE_VERSION; the retry with the fresh version succeeds on the AMENDED report."
