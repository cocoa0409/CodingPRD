  # ==========================================================================
  # Validations (Table 4)
  # ==========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role headers fails priority 1 with ERR_MISSING_AUTH (400) before any other check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /card-accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_AUTH (trigger is sent WITHOUT auth headers; auth beats existence, so no 404)"
      - name: cardholder_dispute_other_account_forbidden
        claim_type: cross_entity_validation
        grounds: ["validations[priority=5]", "errors[ERR_FORBIDDEN]", roles.Cardholder]
        distinguishing_aspect: "Cardholder ownership: X-User-ID naming account A cannot file a dispute against a transaction owned by account B."
        test_recipe:
          setup: ["Two accounts A and B; txn 5000 posted to B on 2026-07-01; clock 2026-08-03"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "A", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { owa: $.data.id }
            - call: "POST /card-accounts"
              payload: { cardholder_name: "B", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { owb: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${owb}", merchant_name: "B", amount_cents: 5000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { owtx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
          trigger:
            - call: "POST /disputes"
              payload: { card_transaction_id: "${owtx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "${owa}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (ownership check at priority 5)"
      - name: sod_violation_on_resolve
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SOD_VIOLATION]", roles.DisputeInvestigator]
        distinguishing_aspect: "Segregation of duties: the same opaque operator id that intook the case (IntakeAgent ops-ia-1) cannot resolve it as DisputeInvestigator; a different investigator id succeeds."
        test_recipe:
          setup: ["Old account, txn 5000, dispute filed BY IntakeAgent ops-ia-1 on 2026-08-03, classified non-fraud"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "SoD", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { sodacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${sodacct}", merchant_name: "SOD", amount_cents: 5000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { sodtx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${sodtx}", error_type: "INCORRECT_AMOUNT", claim_amount_cents: 5000, claimed_report_delay_days: 5 }
              as: IntakeAgent
              as_user_id: "ops-ia-1"
              captures: { sodcase: $.data.id }
            - call: "POST /disputes/${sodcase}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 5 }
              as: DisputeInvestigator
              as_user_id: "ops-inv-7"
          trigger:
            - call: "POST /disputes/${sodcase}/resolve"
              payload: { outcome: "NO_ERROR" }
              as: DisputeInvestigator
              as_user_id: "ops-ia-1"
              captures: { err: $.data.error_id }
            - call: "POST /disputes/${sodcase}/resolve"
              payload: { outcome: "NO_ERROR" }
              as: DisputeInvestigator
              as_user_id: "ops-inv-7"
              captures: { st: $.data.status }
          assert:
            - "err == ERR_SOD_VIOLATION (resolver == intake agent)"
            - "st == RESOLVED_MERCHANT_FAVOR (different investigator passes SoD)"
      - name: intake_missing_required_field_returns_invalid_request
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Schema validation (priority 3) precedes existence (priority 4): a payload missing claim_amount_cents AND referencing a non-existent transaction returns ERR_INVALID_REQUEST, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /disputes"
              payload: { card_transaction_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", error_type: "INCORRECT_AMOUNT", claimed_report_delay_days: 5 }
              as: Cardholder
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (schema beats existence)"
      - name: network_filing_deadline_boundary
        claim_type: temporal_validation
        grounds: ["validations[priority=9]", "errors[ERR_NETWORK_DEADLINE_PASSED]", entities.Chargeback.fields.network_filing_deadline_at]
        distinguishing_aspect: "MASTERCARD 90-day filing deadline is inclusive: filing at 2026-09-29 (deadline day) succeeds; filing at 2026-09-30 fails with ERR_NETWORK_DEADLINE_PASSED."
        test_recipe:
          setup:
            - "Old account; two MASTERCARD ECOMMERCE txns 6000 posted 2026-07-01 (deadline 2026-09-29T23:59:59Z)"
            - "Two non-fraud disputes received 2026-09-20, both classified"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "MC", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { mcacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${mcacct}", merchant_name: "MC1", amount_cents: 6000, transaction_type: "ECOMMERCE", network: "MASTERCARD", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { mctx1: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${mcacct}", merchant_name: "MC2", amount_cents: 6000, transaction_type: "ECOMMERCE", network: "MASTERCARD", posted_at: "2026-07-01T11:00:00Z" }
              as: BankAdmin
              captures: { mctx2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${mctx1}", error_type: "SERVICE_NOT_RECEIVED", claim_amount_cents: 6000, claimed_report_delay_days: 60 }
              as: Cardholder
              as_user_id: "${mcacct}"
              captures: { mcc1: $.data.id }
            - call: "POST /disputes"
              payload: { card_transaction_id: "${mctx2}", error_type: "SERVICE_NOT_RECEIVED", claim_amount_cents: 6000, claimed_report_delay_days: 60 }
              as: Cardholder
              as_user_id: "${mcacct}"
              captures: { mcc2: $.data.id }
            - call: "POST /disputes/${mcc1}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 60 }
              as: DisputeInvestigator
            - call: "POST /disputes/${mcc2}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 60 }
              as: DisputeInvestigator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T12:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${mcc1}", reason_code: "M4853" }
              as: ChargebackAnalyst
              captures: { st1: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${mcc2}", reason_code: "M4853" }
              as: ChargebackAnalyst
              captures: { err2: $.data.error_id }
          assert:
            - "st1 == FILED (deadline day inclusive)"
            - "err2 == ERR_NETWORK_DEADLINE_PASSED (one second past)"
      - name: reason_code_mismatch_fraud_vs_nonfraud
        claim_type: conditional_validation
        grounds: ["validations[priority=10]", "errors[ERR_REASON_CODE_MISMATCH]"]
        distinguishing_aspect: "Reason-code validity is conditional on network AND fraud classification: a non-fraud code on a fraud case and a MASTERCARD code on a VISA transaction both fail; the matching fraud VISA code succeeds."
        test_recipe:
          setup: ["Old account, VISA POS_PIN txn 15000 posted 2026-07-01, fraud dispute classified fraud, clock 2026-08-05"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "RC", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { rcacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${rcacct}", merchant_name: "RC", amount_cents: 15000, transaction_type: "POS_PIN", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { rctx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${rctx}", error_type: "UNAUTHORIZED", claim_amount_cents: 15000, claimed_report_delay_days: 1 }
              as: Cardholder
              as_user_id: "${rcacct}"
              captures: { rccase: $.data.id }
            - call: "POST /disputes/${rccase}/classify"
              payload: { is_fraud_claim: true, verified_report_delay_days: 1 }
              as: DisputeInvestigator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BankAdmin
          trigger:
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${rccase}", reason_code: "V13_1" }
              as: ChargebackAnalyst
              captures: { err1: $.data.error_id }
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${rccase}", reason_code: "M4837" }
              as: ChargebackAnalyst
              captures: { err2: $.data.error_id }
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${rccase}", reason_code: "V10_4" }
              as: ChargebackAnalyst
              captures: { st: $.data.status }
          assert:
            - "err1 == ERR_REASON_CODE_MISMATCH (non-fraud code on fraud case)"
            - "err2 == ERR_REASON_CODE_MISMATCH (MASTERCARD code on VISA transaction)"
            - "st == FILED (matching fraud VISA code)"

