          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
          c1_v: $.data.version
      - call: POST /compliance/agent-scripts
        payload:
          name: CA VOICE Script
          channel: VOICE
          disclosure_blocks:
          - IDENTIFICATION
          - PURPOSE
          - OPT_OUT
          recording_consent_mode: ONE_PARTY
          covered_state_codes:
          - CA
        as: CampaignManager
        captures:
          scr_id: $.data.id
      - call: POST /compliance/agent-scripts/${scr_id}/submit-review
        payload: {}
        as: CampaignManager
      - call: POST /compliance/agent-scripts/${scr_id}/approve
        payload:
          approval_note: Disclosures cleared
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      - call: POST /compliance/consent-records
        payload:
          contact_id: ${c1_id}
          channel: VOICE
          consent_type: EXPRESS_WRITTEN
          capture_method: WEB_FORM
          disclosure_script_id: ${scr_id}
          disclosure_text_version: 1
          signature_evidence: evidence-c1
          expected_contact_version: ${c1_v}
        as: ComplianceOfficer
        captures:
          cons1_id: $.data.id
      trigger:
      - call: POST /compliance/revocation-requests
        payload:
          contact_id: ${c1_id}
          channel_received: EMAIL
          method: REPLY_STOP
          scope: ALL_CHANNELS
          received_note: STOP
        as: ComplianceOfficer
        captures:
