              payload: { vacate_reason: "Assessment issued against the wrong organization." }
              as: StateRegulator
          assert:
            - "EnforcementAction.${act_id}.status == VACATED"
            - "EnforcementAction.${act_id}.penalty_cents == 25000"
            - "EnforcementAction.${act_id}.settlement_total_cents == 36250"
            - "EnforcementAction.${act_id}.cure_deadline == 2026-08-31T00:00:00Z"
            - "Organization.${org_id}.penalty_outstanding_cents == 0"
            - "Organization.${org_id}.filing_posture == CURRENT"
            - "Organization.${org_id}.registered_state_count == 1"
            - "StateRegistration.${reg_id}.status == REGISTERED"

      - name: registered_state_count_conserved_when_filing_is_withdrawn
        grounds:
          - calculations.registered_state_count_conservation
          - state_machines.StateRegistration.REGISTERED_to_WITHDRAWN
          - endpoints[POST /state-registrations/{id}/withdraw]
          - state_machines.StateRegistration.SUBMITTED_to_REGISTERED
        invariant:
          statement: "Organization.registered_state_count == count(StateRegistration of this organization with status == REGISTERED)"
          forward_operation: "POST /state-registrations/{id}/review with decision APPROVE, which raises registered_state_count to 1"
          compensating_operation: "POST /state-registrations/{id}/withdraw, which returns registered_state_count to 0"
        distinguishing_aspect: |
          Withdrawal is a partial compensation, and the boundary between what it reverses and what
          it preserves is the point: registered_state_count returns to 0 and filing_posture stays
          CURRENT, while registered_at keeps its original 2026-08-01 stamp and every
          RegistrationDocument keeps review_status ACCEPTED from the approval. An implementation
          that clears registered_at, reverts documents to PENDING, or decrements the count from
          the DRAFT withdrawal path as well diverges. The withdraw is also only permitted because
          no OPEN, REMEDIATION_SUBMITTED or ESCALATED action exists on this filing.
        test_recipe:
          setup:
            - "StateProfile CA and an Organization with one REGISTERED CA fiscal_year 2026 filing, so registered_state_count is 1."
            - "Three ACCEPTED RegistrationDocuments on that filing."
            - "No enforcement action of any kind on the filing."
          setup_api_calls:
            - call: "POST /state-profiles"
