          - validations[priority=32]
          - state_machines.ConnectedUnit.PENDING_INSTALL_to_ACTIVE
          - state_machines.ServicePartner.APPLIED_to_PROVISIONAL
        distinguishing_aspect: |
          Pairs a STATE category rule (priority 23, ERR_UNIT_COVERAGE_NOT_ACTIVE, 409) against a
          BUSINESS_REFERENTIAL rule (priority 32, ERR_PARTNER_NOT_AUTHORIZED_FOR_CLAIMS, 422) on
          the same POST /warranty-claims call with both conditions live at once. The pair is
          proven by remediating only the higher-priority violation: activating coverage leaves the
          partner still PROVISIONAL, and the very next filing returns 32's error, so neither error
          was a false positive.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "EquipmentModel FRY-900 LISTED."
            - "ConnectedUnit SN-1 left at PENDING_INSTALL (coverage never activated) -- violates priority 23."
            - "ServicePartner SP-1 advanced only to PROVISIONAL, with two PASSED technician certifications on FRY-900 so priority 33 is satisfied -- violates priority 32."
