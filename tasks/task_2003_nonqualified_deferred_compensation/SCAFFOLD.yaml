# =============================================================================
# Task 2003 — Nonqualified Deferred Compensation (409A) Administration
# Seed tables: §1.0–§1.7 (difficulty design and corner design live in the
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  2003. Nonqualified Deferred Compensation (409A) Administration: deferral
  election window & irrevocability rules, distribution event definitions &
  separation-from-service determination, six-month delay for specified
  employees, notional investment crediting & account balance tracking, rabbi
  trust funding & informal financing, plan document compliance & documentary
  failure correction, operational failure identification & 409A income
  inclusion, change-in-control & acceleration rules

domain_name: nqdc-409a-administration
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan name" }
      - { name: effective_date, type: string, source: input, description: "Plan effective date, ISO date YYYY-MM-DD" }
      - { name: distribution_events_allowed, type: array, source: input, description: "Subset of SEPARATION | DEATH | DISABILITY | FIXED_TIME | UNFORESEEABLE_EMERGENCY | CHANGE_IN_CONTROL that this plan permits as distribution events", constraints: "non-empty array of the enum members" }
      - { name: six_month_delay_enabled, type: boolean, source: input, default: true, description: "Whether the six-month delay for specified employees applies to separation distributions" }
      - { name: rabbi_trust_required, type: boolean, source: input, default: false, description: "Whether the plan maintains a rabbi trust as informal funding" }
      - { name: accelerate_on_cic, type: boolean, source: input, default: false, description: "Whether a verified change in control accelerates distribution of vested balances" }
      - { name: separation_fraction_test, type: enum, source: input, default: DEFAULT_50, description: "Service-fraction presumption test for separation-from-service", constraints: "DEFAULT_50 | LIBERAL_20" }
      - { name: vesting_cliff_years, type: integer, source: input, default: 3, description: "Cliff vesting: 0% before cliff, 100% at or after cliff years of service", constraints: "1..10" }
      - { name: officer_comp_threshold_cents, type: integer, source: input, description: "Compensation threshold (cents) for the COMPENSATION_THRESHOLD specified-employee basis", constraints: "> 0" }
      - { name: processing_lag_days, type: integer, source: input, default: 30, description: "Administrative lag added to distribution base dates", constraints: "0..90" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATION_PENDING | TERMINATED" }
      - { name: document_posture, type: enum, source: computed, description: "Derived from DocumentFinding children: COMPLIANT (no findings in REPORTED/CORRECTION_FILED/LAPSED), FAILURE_OPEN (>=1 in REPORTED/CORRECTION_FILED, none LAPSED), LAPSED_FAILURE (>=1 LAPSED)", default: COMPLIANT }
      - { name: termination_effective_date, type: string, source: system, description: "Set at terminate: clock date + 12 calendar months; plan becomes TERMINATED when clock reaches it", constraints: "null until TERMINATION_PENDING" }
      - { name: open_findings_count, type: integer, source: computed, default: 0, description: "Count of DocumentFinding children in REPORTED or CORRECTION_FILED status" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; sponsoring plan" }
      - { name: employee_ref, type: string, source: input, description: "External HR reference string" }
      - { name: hire_date, type: string, source: input, description: "Most recent hire date, ISO date; vesting service measured from here" }
      - { name: initial_eligibility_date, type: string, source: input, description: "Date the participant first became eligible; anchors the 30-day newly-eligible election rule" }
      - { name: annual_compensation_cents, type: integer, source: input, description: "Annualized compensation in cents used for deferral caps", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SEPARATION_REVIEW | SEPARATED | DISABLED | DECEASED" }
      - { name: is_specified_employee, type: boolean, source: computed, default: false, description: "Set by SpecifiedEmployeeList finalize; reset to false on rehire" }
      - { name: separation_date, type: string, source: system, description: "Confirmed separation date (ISO date); null unless SEPARATED" }
      - { name: inclusion_liability_cents, type: integer, source: computed, default: 0, description: "Running 409A income-inclusion liability: += total_inclusion_cents on assess, -= same amount on correction of an assessed failure" }

  - name: ElectionWindow
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan this window belongs to" }
      - { name: plan_year, type: integer, source: input, description: "Calendar year the deferred compensation is earned in" }
      - { name: general_open_date, type: string, source: input, description: "First date (inclusive) GENERAL elections may be submitted" }
      - { name: general_close_date, type: string, source: input, description: "Last date (inclusive) GENERAL elections may be submitted; must fall inside calendar year plan_year - 1" }
      - { name: performance_period_start, type: string, source: input, description: "Start of performance period for PERFORMANCE elections; null when unused", constraints: "optional; if present performance_period_end required and period length >= 365 days" }
      - { name: performance_period_end, type: string, source: input, description: "End of performance period; PERFORMANCE elections lock 6 calendar months before this date", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED; OPEN when clock date >= general_open_date, CLOSED when clock date > general_close_date" }

  - name: DeferralElection
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; electing participant" }
      - { name: election_window_id, type: string, source: input, description: "FK -> ElectionWindow.id; window governing this election" }
      - { name: notional_fund_id, type: string, source: input, description: "FK -> NotionalFund.id; notional investment fund the deferrals are credited to" }
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id; denormalized from participant.plan_id at creation" }
      - { name: election_type, type: enum, source: input, description: "GENERAL | NEWLY_ELIGIBLE | PERFORMANCE" }
      - { name: deferral_percent_bp, type: integer, source: input, description: "Percent of eligible compensation to defer, in basis points", constraints: "1..7500" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | LOCKED | APPLIED | VOIDED | EXPIRED" }
      - { name: elected_cap_cents, type: integer, source: computed, description: "Maximum deferrable amount, computed at submit per deferral_cap calculation; null until SUBMITTED" }
      - { name: posted_cents, type: integer, source: computed, default: 0, description: "Sum of PENDING and POSTED DEFERRAL_CREDIT ledger entries tied to this election" }
      - { name: submitted_at, type: string, source: system, description: "Clock timestamp of submission; null until SUBMITTED" }
      - { name: locked_at, type: string, source: system, description: "Clock timestamp when the election became irrevocable; null until LOCKED" }

  - name: NotionalFund
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan offering this fund" }
      - { name: ticker, type: string, source: input, description: "Fund ticker symbol" }
      - { name: crediting_mode, type: enum, source: input, description: "FIXED_RATE | INDEX_LINKED" }
      - { name: annual_rate_bp, type: integer, source: input, description: "Annual crediting rate in basis points for FIXED_RATE funds; ignored for INDEX_LINKED (rate supplied per crediting run)", constraints: "-10000..10000" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; owning participant" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; must equal participant.plan_id" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FLAGGED_FOR_INCLUSION | CLOSED" }
      - { name: settled_balance_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over POSTED ledger entries for this account (replay order created_at ASC)" }
      - { name: provisional_balance_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over POSTED and PENDING ledger entries for this account" }
      - { name: vested_balance_cents, type: integer, source: computed, default: 0, description: "floor(settled_balance_cents * vested_bp / 10000); vested_bp is 10000 when service cliff met else 0" }

  - name: AccountLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: entry_type, type: enum, source: system, description: "DEFERRAL_CREDIT | CREDITING_GAIN | CREDITING_REVERSAL | DISTRIBUTION_DEBIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount: credits positive, debits negative" }
      - { name: fund_id, type: string, source: system, description: "FK -> NotionalFund.id; nullable — set on DEFERRAL_CREDIT, CREDITING_GAIN, CREDITING_REVERSAL entries" }
      - { name: crediting_run_id, type: string, source: system, description: "FK -> CreditingRun.id; nullable — set on CREDITING_GAIN and CREDITING_REVERSAL entries" }
      - { name: election_id, type: string, source: system, description: "FK -> DeferralElection.id; nullable — set on DEFERRAL_CREDIT entries" }
      - { name: distribution_request_id, type: string, source: system, description: "FK -> DistributionRequest.id; nullable — set on DISTRIBUTION_DEBIT entries" }
      - { name: entry_status, type: enum, source: system, description: "PENDING | POSTED; deferral credits enter PENDING, all other entry types enter POSTED; settle-entries flips PENDING to POSTED" }
      - { name: entry_date, type: string, source: system, description: "ISO date the entry is effective (clock date at creation)" }

  - name: CreditingRun
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan whose accounts are credited" }
      - { name: period_start, type: string, source: input, description: "Start of crediting period, ISO date; half-open interval [period_start, period_end)" }
      - { name: period_end, type: string, source: input, description: "End of crediting period (exclusive)" }
      - { name: index_rates, type: array, source: input, description: "Optional array of { fund_id, annual_rate_bp } supplying the period rate for each ACTIVE INDEX_LINKED fund of the plan", constraints: "each entry: fund_id string, annual_rate_bp integer -10000..10000" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED" }
      - { name: days_in_period, type: integer, source: computed, description: "(period_end - period_start) in days" }
      - { name: total_gain_cents, type: integer, source: computed, description: "Sum of per-(account, fund) CREDITING_GAIN entries posted by this run" }

  - name: RabbiTrust
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; exactly one trust per plan" }
      - { name: funding_target_bp, type: integer, source: input, description: "Target funding as basis points of total vested liability (10000 = 100%)", constraints: "0..20000" }
      - { name: assets_cents, type: integer, source: computed, default: 0, description: "Signed sum of funding_events.amount_cents" }
      - { name: cic_funding_required, type: boolean, source: computed, default: false, description: "True once a ChangeInControlEvent for the plan reaches VERIFIED; switches target basis to 12500 bp" }
      - { name: required_funding_cents, type: integer, source: computed, default: 0, description: "max(0, ceil(total_vested_liability_cents * effective_target_bp / 10000) - assets_cents); effective_target_bp = 12500 when cic_funding_required else funding_target_bp" }
      - { name: posture, type: enum, source: computed, description: "UNFUNDED (assets == 0) | UNDERFUNDED (assets > 0 and assets < target) | FUNDED (assets >= target_cents and target_cents > 0, or assets > 0 and target == 0)", default: UNFUNDED }
      - { name: funding_events, type: array, source: system, description: "Append-only array of { event_type: CONTRIBUTION | VALUATION_ADJUSTMENT | CIC_MANDATORY_FUNDING | TRUST_DISTRIBUTION, amount_cents: signed integer, recorded_at: datetime }" }

  - name: SeparationCase
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; participant under review" }
      - { name: alleged_separation_date, type: string, source: input, description: "Claimed separation-from-service date, ISO date" }
      - { name: trigger_reason, type: enum, source: input, description: "RESIGNATION | TERMINATION | RETIREMENT | SERVICE_REDUCTION" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the opener; segregation-of-duties anchor" }
      - { name: service_records, type: array, source: system, description: "Appended evidence: { period_start, period_end, service_fraction_bp }; half-open intervals, must tile contiguously with no gap/overlap, ending at alleged_separation_date, total >= 1095 days" }
      - { name: computed_avg_fraction_bp, type: integer, source: computed, description: "Coverage-weighted average service fraction: floor(sum(fraction_bp * days_i) / sum(days_i)); null until first record" }
      - { name: determination_threshold_bp, type: integer, source: system, description: "Snapshot of plan test threshold at determination: 5000 for DEFAULT_50, 2000 for LIBERAL_20; null until determined" }
      - { name: status, type: enum, source: system, description: "OPEN | EVIDENCE_SUBMITTED | DETERMINED_SEPARATED | DETERMINED_NOT_SEPARATED | REOPENED" }
      - { name: determined_by_user_id, type: string, source: system, description: "X-User-ID of determiner; null until determined" }
      - { name: determined_at, type: string, source: system, description: "Clock timestamp of determination; null until determined" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times reopened; hard cap 1" }

  - name: SpecifiedEmployeeList
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan this determination covers" }
      - { name: identification_date, type: string, source: input, description: "Identification date of the determination, ISO date" }
      - { name: effective_date, type: string, source: input, description: "Date the list takes effect; must be > identification_date and <= identification_date + 120 days" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUPERSEDED" }
      - { name: members, type: array, source: system, description: "Array of { participant_id, basis: OFFICER | FIVE_PERCENT_OWNER | COMPENSATION_THRESHOLD, annual_compensation_cents, is_specified (computed at finalize), exclusion_reason (null | OFFICER_CAP_EXCEEDED | BELOW_COMP_THRESHOLD) }" }
      - { name: officer_cap_count, type: integer, source: computed, description: "min(50, floor(eligible_participant_count * 0.10)) computed at finalize; eligible participants are those of the plan in status ACTIVE, SEPARATION_REVIEW, or SEPARATED" }

  - name: DistributionRequest
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account to distribute from" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; denormalized from account at creation" }
      - { name: separation_case_id, type: string, source: input, description: "FK -> SeparationCase.id; required when event_type == SEPARATION, else null" }
      - { name: change_in_control_event_id, type: string, source: input, description: "FK -> ChangeInControlEvent.id; required when event_type == CHANGE_IN_CONTROL, else null" }
      - { name: event_type, type: enum, source: input, description: "SEPARATION | DEATH | DISABILITY | FIXED_TIME | UNFORESEEABLE_EMERGENCY | CHANGE_IN_CONTROL; must be in plan.distribution_events_allowed" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Partial amount; omit for full vested balance. Required for UNFORESEEABLE_EMERGENCY", constraints: "> 0 when present" }
      - { name: fixed_date, type: string, source: input, description: "Required for FIXED_TIME (must be after creation clock date); null otherwise" }
      - { name: emergency_need_cents, type: integer, source: input, description: "Required for UNFORESEEABLE_EMERGENCY: the documented emergency need; null otherwise", constraints: "> 0 when present" }
      - { name: locked_amount_cents, type: integer, source: computed, description: "Amount locked at schedule: min(requested_amount_cents or vested_balance_cents, vested_balance_cents) at schedule time; null until SCHEDULED" }
      - { name: scheduled_payment_date, type: string, source: computed, description: "Computed at schedule per scheduled_payment_date calculation (six-month delay may apply); null until SCHEDULED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | EVENT_VERIFIED | SCHEDULED | PAYABLE | ON_HOLD | PAID | DENIED | CANCELLED" }
      - { name: denial_reason, type: string, source: system, description: "Set when DENIED" }
      - { name: verified_at, type: string, source: system, description: "Clock date at event verification; null until EVENT_VERIFIED" }
      - { name: paid_at, type: string, source: system, description: "Clock timestamp at payment; null until PAID" }

  - name: ChangeInControlEvent
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; affected plan" }
      - { name: event_type, type: enum, source: input, description: "OWNERSHIP_CHANGE | EFFECTIVE_CONTROL_CHANGE | ASSET_CHANGE" }
      - { name: effective_date, type: string, source: input, description: "ISO date the change in control is effective" }
      - { name: stake_change_bp, type: integer, source: input, description: "Ownership/control/asset stake changing hands, basis points; threshold per type: OWNERSHIP_CHANGE >= 5000, EFFECTIVE_CONTROL_CHANGE >= 3500, ASSET_CHANGE >= 4000" }
      - { name: status, type: enum, source: system, description: "REPORTED | VERIFIED | REJECTED" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of adjudicator; null until adjudicated" }

  - name: OperationalFailureCase
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account where the operational failure occurred" }
      - { name: distribution_request_id, type: string, source: input, description: "FK -> DistributionRequest.id; nullable — set when the failure involves a specific distribution" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; denormalized from account at creation" }
      - { name: failure_type, type: enum, source: input, description: "EARLY_PAYMENT | LATE_PAYMENT | EXCESS_DEFERRAL | IMPROPER_ACCELERATION" }
      - { name: failure_date, type: string, source: input, description: "ISO date the failure occurred; must be <= current clock date" }
      - { name: amount_cents, type: integer, source: input, description: "Erroneous payment/deferral amount", constraints: "> 0" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of reporter; segregation-of-duties anchor" }
      - { name: correction_credit_cents, type: integer, source: input, description: "Amount already repaid/corrected before quantification; supplied at quantify", constraints: "0 <= credit <= amount_cents" }
      - { name: includible_base_cents, type: integer, source: computed, description: "max(0, amount_cents - correction_credit_cents), computed at quantify" }
      - { name: premium_interest_cents, type: integer, source: computed, description: "round_half_up(includible_base_cents * 800 * days_outstanding / (10000 * 365)); days_outstanding = (quantify clock date - failure_date).days" }
      - { name: additional_tax_cents, type: integer, source: computed, description: "round_half_up(includible_base_cents * 2000 / 10000) (20% additional tax)" }
      - { name: total_inclusion_cents, type: integer, source: computed, description: "includible_base_cents + premium_interest_cents + additional_tax_cents" }
      - { name: correction_deadline, type: string, source: computed, description: "ISO date Dec 31 of (failure_date year + 2)" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | QUANTIFIED | INCLUSION_ASSESSED | CORRECTED" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of assessor; null until assessed" }

  - name: DocumentFinding
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan whose document is deficient" }
      - { name: description, type: string, source: input, description: "Description of the documentary failure" }
      - { name: failure_year, type: integer, source: input, description: "Calendar year the documentary failure occurred; must be <= current clock year" }
      - { name: correction_deadline, type: string, source: computed, description: "ISO date Dec 31 of (failure_year + 2)" }
      - { name: correction_text, type: string, source: input, description: "Amendment text supplied at file-correction; null until filed" }
      - { name: status, type: enum, source: system, description: "REPORTED | CORRECTION_FILED | CORRECTED | LAPSED" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of filer; null until filed" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of adjudicator; null until adjudicated" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plan
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/plans/{planId}/activate"
        actor: PlanSponsor
        preconditions:
          - "status == DRAFT (ERR_PLAN_STATE_INVALID)"
        side_effects:
          - "increments Plan.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/plans/{planId}/suspend"
        actor: PlanSponsor
        preconditions:
          - "status == ACTIVE (ERR_PLAN_STATE_INVALID)"
        side_effects:
          - "increments Plan.version by 1"
          - "While SUSPENDED, all child writes gated by ERR_PLAN_NOT_ACTIVE (election create/submit/void, post-deferral, account create, crediting run, distribution create, trust create, window create)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/plans/{planId}/resume"
        actor: PlanSponsor
        preconditions:
          - "status == SUSPENDED (ERR_PLAN_STATE_INVALID)"
        side_effects:
          - "increments Plan.version by 1"
      - from: ACTIVE
        to: TERMINATION_PENDING
        trigger: "POST /api/plans/{planId}/terminate"
        actor: PlanSponsor
        preconditions:
          - "status in {ACTIVE, SUSPENDED} (ERR_PLAN_STATE_INVALID)"
        side_effects:
          - "termination_effective_date = clock date + 12 calendar months"
          - "All DeferralElection of this plan in DRAFT or SUBMITTED -> VOIDED"
          - "increments Plan.version by 1"
      - from: SUSPENDED
        to: TERMINATION_PENDING
        trigger: "POST /api/plans/{planId}/terminate"
        actor: PlanSponsor
        preconditions:
          - "status in {ACTIVE, SUSPENDED} (ERR_PLAN_STATE_INVALID)"
        side_effects:
          - "termination_effective_date = clock date + 12 calendar months"
          - "All DeferralElection of this plan in DRAFT or SUBMITTED -> VOIDED"
          - "increments Plan.version by 1"
      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "system (POST /_clock/set_current_utc sweep when clock date >= termination_effective_date)"
        actor: system
        preconditions:
          - "clock date >= termination_effective_date"
        side_effects:
          - "increments Plan.version by 1"
    note: "document_posture is a computed posture dimension over DocumentFinding children (COMPLIANT | FAILURE_OPEN | LAPSED_FAILURE), recomputed on every finding transition; it evolves independently of lifecycle status and gates distribution payment (ERR_PLAN_DOCUMENT_LAPSED)."

  - entity: Participant
    initial_state: ACTIVE
    terminal_states: [DECEASED]
    transitions:
      - from: ACTIVE
        to: SEPARATION_REVIEW
        trigger: "system (POST /api/separation-cases creation for this participant)"
        actor: system
        preconditions:
          - "participant.status == ACTIVE"
        side_effects:
          - "increments Participant.version by 1"
      - from: SEPARATION_REVIEW
        to: SEPARATED
        trigger: "system (POST /api/separation-cases/{caseId}/determine with outcome CONFIRMED_SEPARATION)"
        actor: system
        preconditions:
          - "case determination outcome == CONFIRMED_SEPARATION"
        side_effects:
          - "separation_date = case.alleged_separation_date"
          - "All DeferralElection of this participant in DRAFT or SUBMITTED -> VOIDED (irrevocability: LOCKED elections persist)"
          - "increments Participant.version by 1"
      - from: SEPARATION_REVIEW
        to: ACTIVE
        trigger: "system (determine with outcome REBUTTED_CONTINUED_SERVICE)"
        actor: system
        preconditions:
          - "case determination outcome == REBUTTED_CONTINUED_SERVICE"
        side_effects:
          - "increments Participant.version by 1"
      - from: SEPARATED
        to: SEPARATION_REVIEW
        trigger: "system (POST /api/separation-cases/{caseId}/reopen on the case that separated this participant)"
        actor: system
        preconditions:
          - "case reopen succeeds"
        side_effects:
          - "separation_date = null"
          - "increments Participant.version by 1"
      - from: SEPARATED
        to: ACTIVE
        trigger: "POST /api/participants/{participantId}/rehire"
        actor: BenefitsAdministrator
        preconditions:
          - "status == SEPARATED (ERR_PARTICIPANT_STATE_INVALID)"
        side_effects:
          - "separation_date = null; is_specified_employee = false"
          - "increments Participant.version by 1"
      - from: ACTIVE
        to: DISABLED
        trigger: "PATCH /api/participants/{participantId} with status=DISABLED"
        actor: BenefitsAdministrator
        preconditions:
          - "status in {ACTIVE, SEPARATION_REVIEW, SEPARATED} (ERR_PARTICIPANT_STATE_INVALID)"
        side_effects:
          - "increments Participant.version by 1"
      - from: SEPARATION_REVIEW
        to: DISABLED
        trigger: "PATCH /api/participants/{participantId} with status=DISABLED"
        actor: BenefitsAdministrator
        preconditions:
          - "status in {ACTIVE, SEPARATION_REVIEW, SEPARATED} (ERR_PARTICIPANT_STATE_INVALID)"
        side_effects:
          - "increments Participant.version by 1"
      - from: SEPARATED
        to: DISABLED
        trigger: "PATCH /api/participants/{participantId} with status=DISABLED"
        actor: BenefitsAdministrator
        preconditions:
          - "status in {ACTIVE, SEPARATION_REVIEW, SEPARATED} (ERR_PARTICIPANT_STATE_INVALID)"
        side_effects:
          - "increments Participant.version by 1"
      - from: ACTIVE
        to: DECEASED
        trigger: "PATCH /api/participants/{participantId} with status=DECEASED"
        actor: BenefitsAdministrator
        preconditions:
          - "status != DECEASED (ERR_PARTICIPANT_STATE_INVALID)"
        side_effects:
          - "increments Participant.version by 1"
      - from: SEPARATION_REVIEW
        to: DECEASED
        trigger: "PATCH /api/participants/{participantId} with status=DECEASED"
        actor: BenefitsAdministrator
        preconditions:
          - "status != DECEASED (ERR_PARTICIPANT_STATE_INVALID)"
        side_effects:
          - "increments Participant.version by 1"
      - from: SEPARATED
        to: DECEASED
        trigger: "PATCH /api/participants/{participantId} with status=DECEASED"
        actor: BenefitsAdministrator
        preconditions:
          - "status != DECEASED (ERR_PARTICIPANT_STATE_INVALID)"
        side_effects:
          - "increments Participant.version by 1"
      - from: DISABLED
        to: DECEASED
        trigger: "PATCH /api/participants/{participantId} with status=DECEASED"
        actor: BenefitsAdministrator
        preconditions:
          - "status != DECEASED (ERR_PARTICIPANT_STATE_INVALID)"
        side_effects:
          - "increments Participant.version by 1"

  - entity: ElectionWindow
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system (POST /_clock/set_current_utc sweep when clock date >= general_open_date)"
        actor: system
        preconditions:
          - "clock date >= general_open_date"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system (POST /_clock/set_current_utc sweep when clock date > general_close_date)"
        actor: system
        preconditions:
          - "clock date > general_close_date"
        side_effects:
          - "All GENERAL DeferralElection referencing this window in DRAFT -> EXPIRED"
          - "All GENERAL DeferralElection referencing this window in SUBMITTED -> LOCKED (locked_at = clock timestamp); LOCKED is irrevocable"

  - entity: DeferralElection
    initial_state: DRAFT
    terminal_states: [APPLIED, VOIDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/deferral-elections/{electionId}/submit"
        actor: Participant
        preconditions:
          - "status == DRAFT (ERR_ELECTION_NOT_MODIFIABLE)"
          - "participant.status == ACTIVE (ERR_PARTICIPANT_NOT_ACTIVE)"
          - "plan.status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "GENERAL: window.status == OPEN and clock date <= general_close_date (ERR_ELECTION_DEADLINE_PASSED)"
          - "NEWLY_ELIGIBLE: clock date <= participant.initial_eligibility_date + 30 days (ERR_ELECTION_DEADLINE_PASSED)"
          - "PERFORMANCE: clock date <= window.performance_period_end - 6 calendar months (ERR_PERFORMANCE_ELECTION_TOO_LATE)"
        side_effects:
          - "submitted_at = clock timestamp; elected_cap_cents computed per deferral_cap calculation"
          - "increments DeferralElection.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /api/deferral-elections/{electionId}/void"
        actor: Participant
        preconditions:
          - "status in {DRAFT, SUBMITTED} (ERR_ELECTION_NOT_MODIFIABLE)"
        side_effects:
          - "increments DeferralElection.version by 1"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /api/deferral-elections/{electionId}/void"
        actor: Participant
        preconditions:
          - "status in {DRAFT, SUBMITTED} (ERR_ELECTION_NOT_MODIFIABLE)"
        side_effects:
          - "increments DeferralElection.version by 1"
      - from: SUBMITTED
        to: LOCKED
        trigger: "system (POST /_clock/set_current_utc sweep: GENERAL at window close; NEWLY_ELIGIBLE when clock date > initial_eligibility_date + 30 days; PERFORMANCE when clock date > performance_period_end - 6 calendar months)"
        actor: system
        preconditions:
          - "status == SUBMITTED and the type-specific deadline has passed"
        side_effects:
          - "locked_at = clock timestamp (irrevocable from this instant)"
          - "increments DeferralElection.version by 1"
      - from: DRAFT
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep at the type-specific deadline)"
        actor: system
        preconditions:
          - "status == DRAFT and the type-specific deadline has passed"
        side_effects: []
      - from: LOCKED
        to: APPLIED
        trigger: "system (POST /api/deferral-elections/{electionId}/post-deferral when posted_cents reaches elected_cap_cents)"
        actor: system
        preconditions:
          - "status == LOCKED and posted_cents == elected_cap_cents after the posting"
        side_effects:
          - "increments DeferralElection.version by 1"

  - entity: SeparationCase
    initial_state: OPEN
    terminal_states: [DETERMINED_SEPARATED, DETERMINED_NOT_SEPARATED]
    transitions:
      - from: OPEN
        to: EVIDENCE_SUBMITTED
        trigger: "system (first POST /api/separation-cases/{caseId}/service-records append)"
        actor: system
        preconditions:
          - "status in {OPEN, REOPENED}"
        side_effects:
          - "computed_avg_fraction_bp recomputed on every record append"
          - "increments SeparationCase.version by 1"
      - from: REOPENED
        to: EVIDENCE_SUBMITTED
        trigger: "system (first service-record append after reopen)"
        actor: system
        preconditions:
          - "status in {OPEN, REOPENED}"
        side_effects:
          - "computed_avg_fraction_bp recomputed"
          - "increments SeparationCase.version by 1"
      - from: EVIDENCE_SUBMITTED
        to: DETERMINED_SEPARATED
        trigger: "POST /api/separation-cases/{caseId}/determine with outcome=CONFIRMED_SEPARATION"
        actor: ComplianceOfficer
        preconditions:
          - "status in {EVIDENCE_SUBMITTED, REOPENED} and at least one service record present (ERR_CASE_STATE_INVALID)"
          - "determiner X-User-ID != opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "computed_avg_fraction_bp < determination_threshold_bp of the plan test (ERR_SERVICE_FRACTION_CONTRADICTS_OUTCOME)"
        side_effects:
          - "determination_threshold_bp snapshot = 5000 (DEFAULT_50) or 2000 (LIBERAL_20); determined_by_user_id, determined_at set"
          - "Participant -> SEPARATED (separation_date = alleged_separation_date); that mutation voids the participant's DRAFT/SUBMITTED DeferralElection rows"
          - "increments SeparationCase.version by 1"
      - from: EVIDENCE_SUBMITTED
        to: DETERMINED_NOT_SEPARATED
        trigger: "POST /api/separation-cases/{caseId}/determine with outcome=REBUTTED_CONTINUED_SERVICE"
        actor: ComplianceOfficer
        preconditions:
          - "status in {EVIDENCE_SUBMITTED, REOPENED} and at least one service record present (ERR_CASE_STATE_INVALID)"
          - "determiner X-User-ID != opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "computed_avg_fraction_bp >= determination_threshold_bp of the plan test (ERR_SERVICE_FRACTION_CONTRADICTS_OUTCOME)"
        side_effects:
          - "Participant SEPARATION_REVIEW -> ACTIVE"
          - "Linked DistributionRequest in ON_HOLD -> DENIED"
          - "increments SeparationCase.version by 1"
      - from: REOPENED
        to: DETERMINED_SEPARATED
        trigger: "POST /api/separation-cases/{caseId}/determine with outcome=CONFIRMED_SEPARATION"
        actor: ComplianceOfficer
        preconditions:
          - "status in {EVIDENCE_SUBMITTED, REOPENED} and at least one service record present (ERR_CASE_STATE_INVALID)"
          - "determiner X-User-ID != opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "computed_avg_fraction_bp < determination_threshold_bp of the plan test (ERR_SERVICE_FRACTION_CONTRADICTS_OUTCOME)"
        side_effects:
          - "determination_threshold_bp snapshot; determined_by_user_id, determined_at refreshed"
          - "Participant SEPARATION_REVIEW -> SEPARATED; linked ON_HOLD DistributionRequest -> SCHEDULED with recomputed scheduled_payment_date"
          - "increments SeparationCase.version by 1"
      - from: REOPENED
        to: DETERMINED_NOT_SEPARATED
        trigger: "POST /api/separation-cases/{caseId}/determine with outcome=REBUTTED_CONTINUED_SERVICE"
        actor: ComplianceOfficer
        preconditions:
          - "status in {EVIDENCE_SUBMITTED, REOPENED} and at least one service record present (ERR_CASE_STATE_INVALID)"
          - "determiner X-User-ID != opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "computed_avg_fraction_bp >= determination_threshold_bp of the plan test (ERR_SERVICE_FRACTION_CONTRADICTS_OUTCOME)"
        side_effects:
          - "Participant stays/returns ACTIVE (from SEPARATION_REVIEW)"
          - "Linked DistributionRequest in ON_HOLD -> DENIED"
          - "increments SeparationCase.version by 1"
      - from: DETERMINED_SEPARATED
        to: REOPENED
        trigger: "POST /api/separation-cases/{caseId}/reopen"
        actor: BenefitsAdministrator
        preconditions:
          - "status in {DETERMINED_SEPARATED, DETERMINED_NOT_SEPARATED} (ERR_CASE_STATE_INVALID)"
          - "reopen_count < 1 (ERR_CASE_REOPEN_LIMIT)"
          - "clock date <= date(determined_at) + 30 days (ERR_REOPEN_WINDOW_EXPIRED)"
          - "no linked DistributionRequest in PAID (ERR_CASE_HAS_PAID_DISTRIBUTIONS)"
        side_effects:
          - "reopen_count += 1"
          - "If was DETERMINED_SEPARATED: Participant SEPARATED -> SEPARATION_REVIEW, separation_date = null; linked DistributionRequest in SCHEDULED -> ON_HOLD"
          - "increments SeparationCase.version by 1"
      - from: DETERMINED_NOT_SEPARATED
        to: REOPENED
        trigger: "POST /api/separation-cases/{caseId}/reopen"
        actor: BenefitsAdministrator
        preconditions:
          - "status in {DETERMINED_SEPARATED, DETERMINED_NOT_SEPARATED} (ERR_CASE_STATE_INVALID)"
          - "reopen_count < 1 (ERR_CASE_REOPEN_LIMIT)"
          - "clock date <= date(determined_at) + 30 days (ERR_REOPEN_WINDOW_EXPIRED)"
          - "no linked DistributionRequest in PAID (ERR_CASE_HAS_PAID_DISTRIBUTIONS)"
        side_effects:
          - "reopen_count += 1"
          - "increments SeparationCase.version by 1"
    note: "Terminal states are soft: reopenable exactly once within 30 days. After a reopen + re-determination, reopen_count == 1 makes the determination final."

  - entity: DistributionRequest
    initial_state: REQUESTED
    terminal_states: [PAID, DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: EVENT_VERIFIED
        trigger: "POST /api/distribution-requests/{requestId}/verify-event"
        actor: ComplianceOfficer
        preconditions:
          - "status == REQUESTED (ERR_DISTRIBUTION_STATE_INVALID)"
          - "SEPARATION: linked SeparationCase.status == DETERMINED_SEPARATED and case.participant_id == account.participant_id (ERR_EVENT_NOT_CONFIRMED)"
          - "CHANGE_IN_CONTROL: linked ChangeInControlEvent.status == VERIFIED and cic.plan_id == account.plan_id (ERR_EVENT_NOT_CONFIRMED)"
          - "DEATH: participant.status == DECEASED; DISABILITY: participant.status == DISABLED (ERR_EVENT_NOT_CONFIRMED)"
          - "FIXED_TIME: fixed_date present (set at creation; always verifiable)"
          - "UNFORESEEABLE_EMERGENCY: requested_amount_cents <= emergency_need_cents (ERR_EXCEEDS_EMERGENCY_NEED)"
        side_effects:
          - "verified_at = clock date"
          - "increments DistributionRequest.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /api/distribution-requests/{requestId}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "status in {REQUESTED, EVENT_VERIFIED} (ERR_DISTRIBUTION_STATE_INVALID)"
        side_effects:
          - "denial_reason set from input"
          - "increments DistributionRequest.version by 1"
      - from: EVENT_VERIFIED
        to: DENIED
        trigger: "POST /api/distribution-requests/{requestId}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "status in {REQUESTED, EVENT_VERIFIED} (ERR_DISTRIBUTION_STATE_INVALID)"
        side_effects:
          - "denial_reason set from input"
          - "increments DistributionRequest.version by 1"
      - from: EVENT_VERIFIED
        to: SCHEDULED
        trigger: "POST /api/distribution-requests/{requestId}/schedule"
        actor: BenefitsAdministrator
        preconditions:
          - "status == EVENT_VERIFIED (ERR_DISTRIBUTION_STATE_INVALID)"
          - "account.status in {ACTIVE, FLAGGED_FOR_INCLUSION} (ERR_ACCOUNT_CLOSED)"
          - "vested_balance_cents of account > 0 (ERR_INSUFFICIENT_VESTED_BALANCE)"
        side_effects:
          - "locked_amount_cents = min(requested_amount_cents or vested_balance_cents, vested_balance_cents)"
          - "scheduled_payment_date computed per scheduled_payment_date calculation"
          - "increments DistributionRequest.version by 1"
      - from: SCHEDULED
        to: PAYABLE
        trigger: "system (POST /_clock/set_current_utc sweep when clock date >= scheduled_payment_date)"
        actor: system
        preconditions:
          - "clock date >= scheduled_payment_date"
        side_effects:
          - "increments DistributionRequest.version by 1"
      - from: SCHEDULED
        to: ON_HOLD
        trigger: "system (linked SeparationCase reopened)"
        actor: system
        preconditions:
          - "event_type == SEPARATION and linked case reopens"
        side_effects:
          - "increments DistributionRequest.version by 1"
      - from: ON_HOLD
        to: SCHEDULED
        trigger: "system (linked SeparationCase re-determined CONFIRMED_SEPARATION)"
        actor: system
        preconditions:
          - "case re-determination confirms separation"
        side_effects:
          - "scheduled_payment_date recomputed against the new separation_date"
          - "increments DistributionRequest.version by 1"
      - from: PAYABLE
        to: PAID
        trigger: "POST /api/distribution-requests/{requestId}/pay"
        actor: BenefitsAdministrator
        preconditions:
          - "status == PAYABLE (ERR_DISTRIBUTION_NOT_PAYABLE)"
          - "plan.document_posture != LAPSED_FAILURE (ERR_PLAN_DOCUMENT_LAPSED)"
          - "account.settled_balance_cents >= locked_amount_cents (ERR_INSUFFICIENT_VESTED_BALANCE)"
        side_effects:
          - "Post AccountLedgerEntry DISTRIBUTION_DEBIT amount = -locked_amount_cents (POSTED) [cascade link 1]"
          - "Account balances recomputed from ledger replay [cascade link 2]"
          - "If account.settled_balance_cents == 0 after recompute: Account -> CLOSED [cascade link 3]"
          - "On Account -> CLOSED: all sibling DistributionRequest of that account in REQUESTED/EVENT_VERIFIED/SCHEDULED/PAYABLE/ON_HOLD -> CANCELLED [cascade link 4]"
          - "If plan has a RabbiTrust with assets_cents > 0: append funding event TRUST_DISTRIBUTION amount_cents = -min(locked_amount_cents, assets_cents); trust assets/posture recomputed"
          - "paid_at = clock timestamp; increments DistributionRequest.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (account closed cascade, or plan termination... account-close only)"
        actor: system
        preconditions:
          - "account reached CLOSED via another payment"
        side_effects:
          - "increments DistributionRequest.version by 1"
      - from: PAYABLE
        to: CANCELLED
        trigger: "system (account closed cascade)"
        actor: system
        preconditions:
          - "account reached CLOSED via another payment"
        side_effects:
          - "increments DistributionRequest.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (account closed cascade)"
        actor: system
        preconditions:
          - "account reached CLOSED via another payment"
        side_effects: []
      - from: EVENT_VERIFIED
        to: CANCELLED
        trigger: "system (account closed cascade)"
        actor: system
        preconditions:
          - "account reached CLOSED via another payment"
        side_effects: []
      - from: ON_HOLD
        to: CANCELLED
        trigger: "system (account closed cascade)"
        actor: system
        preconditions:
          - "account reached CLOSED via another payment"
        side_effects: []

  - entity: SpecifiedEmployeeList
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /api/specified-employee-lists/{listId}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT (ERR_LIST_STATE_INVALID)"
        side_effects:
          - "officer_cap_count = min(50, floor(eligible_participant_count * 0.10)); eligible = plan participants in {ACTIVE, SEPARATION_REVIEW, SEPARATED}"
          - "OFFICER members ranked by annual_compensation_cents DESC, tie-break Participant.created_at ASC; top officer_cap_count kept is_specified=true; remainder is_specified=false, exclusion_reason=OFFICER_CAP_EXCEEDED"
          - "COMPENSATION_THRESHOLD members: is_specified = (annual_compensation_cents >= plan.officer_comp_threshold_cents); else exclusion_reason=BELOW_COMP_THRESHOLD"
          - "FIVE_PERCENT_OWNER members: is_specified = true"
          - "Each member with is_specified=true: Participant.is_specified_employee = true (mutation) [cascade link 1]"
          - "For each participant whose is_specified_employee flipped false->true: their SCHEDULED DistributionRequest with event_type==SEPARATION and six_month_delay_enabled plan gets scheduled_payment_date recomputed per scheduled_payment_date calculation [cascade link 2]"
          - "Any prior FINALIZED SpecifiedEmployeeList of the same plan -> SUPERSEDED; participants not on the new list get is_specified_employee = false"
          - "increments SpecifiedEmployeeList.version by 1"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (a newer SpecifiedEmployeeList of the same plan finalizes)"
        actor: system
        preconditions:
          - "another list of same plan finalizes"
        side_effects:
          - "increments SpecifiedEmployeeList.version by 1"

  - entity: ChangeInControlEvent
    initial_state: REPORTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /api/change-in-control-events/{cicId}/adjudicate with outcome=VERIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "status == REPORTED (ERR_CIC_STATE_INVALID)"
          - "stake_change_bp >= threshold for event_type: OWNERSHIP_CHANGE 5000 | EFFECTIVE_CONTROL_CHANGE 3500 | ASSET_CHANGE 4000 (ERR_CIC_THRESHOLD_NOT_MET)"
        side_effects:
          - "verified_by_user_id set"
          - "RabbiTrust of the plan (if exists): cic_funding_required = true; required_funding_cents recomputed at 12500 bp target; posture recomputed [cascade link 1]"
          - "If plan.accelerate_on_cic: system creates one DistributionRequest per Account of the plan in {ACTIVE, FLAGGED_FOR_INCLUSION} with vested_balance_cents > 0 (event_type=CHANGE_IN_CONTROL, status=EVENT_VERIFIED, change_in_control_event_id = this event, requested_amount omitted = full vested) [cascade link 2]"
          - "increments ChangeInControlEvent.version by 1"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /api/change-in-control-events/{cicId}/adjudicate with outcome=REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "status == REPORTED (ERR_CIC_STATE_INVALID)"
        side_effects:
          - "verified_by_user_id set"
          - "increments ChangeInControlEvent.version by 1"

  - entity: OperationalFailureCase
    initial_state: IDENTIFIED
    terminal_states: [CORRECTED]
    transitions:
      - from: IDENTIFIED
        to: QUANTIFIED
        trigger: "POST /api/operational-failures/{failureId}/quantify"
        actor: ComplianceOfficer
        preconditions:
          - "status == IDENTIFIED (ERR_FAILURE_STATE_INVALID)"
          - "0 <= correction_credit_cents <= amount_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "includible_base_cents, premium_interest_cents, additional_tax_cents, total_inclusion_cents computed per income_inclusion calculation"
          - "increments OperationalFailureCase.version by 1"
      - from: QUANTIFIED
        to: INCLUSION_ASSESSED
        trigger: "POST /api/operational-failures/{failureId}/assess-inclusion"
        actor: ComplianceOfficer
        preconditions:
          - "status == QUANTIFIED (ERR_FAILURE_STATE_INVALID)"
          - "assessor X-User-ID != reported_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "account.status in {ACTIVE, FLAGGED_FOR_INCLUSION} (ERR_ACCOUNT_CLOSED)"
        side_effects:
          - "Participant.inclusion_liability_cents += total_inclusion_cents [cascade: participant mutation]"
          - "If account.status == ACTIVE: account -> FLAGGED_FOR_INCLUSION [cascade: account mutation]"
          - "assessed_by_user_id set; increments OperationalFailureCase.version by 1"
      - from: QUANTIFIED
        to: CORRECTED
        trigger: "POST /api/operational-failures/{failureId}/correct"
        actor: ComplianceOfficer
        preconditions:
          - "status in {QUANTIFIED, INCLUSION_ASSESSED} (ERR_FAILURE_STATE_INVALID)"
          - "clock date <= correction_deadline (ERR_CORRECTION_WINDOW_EXPIRED)"
        side_effects:
          - "If prior status was INCLUSION_ASSESSED: Participant.inclusion_liability_cents -= total_inclusion_cents (compensating reversal; net drift zero)"
          - "If account has no other OperationalFailureCase in {QUANTIFIED, INCLUSION_ASSESSED}: account FLAGGED_FOR_INCLUSION -> ACTIVE"
          - "increments OperationalFailureCase.version by 1"
      - from: INCLUSION_ASSESSED
        to: CORRECTED
        trigger: "POST /api/operational-failures/{failureId}/correct"
        actor: ComplianceOfficer
        preconditions:
          - "status in {QUANTIFIED, INCLUSION_ASSESSED} (ERR_FAILURE_STATE_INVALID)"
          - "clock date <= correction_deadline (ERR_CORRECTION_WINDOW_EXPIRED)"
        side_effects:
          - "Participant.inclusion_liability_cents -= total_inclusion_cents (compensating reversal; net drift zero)"
          - "If account has no other OperationalFailureCase in {QUANTIFIED, INCLUSION_ASSESSED}: account FLAGGED_FOR_INCLUSION -> ACTIVE"
          - "increments OperationalFailureCase.version by 1"

  - entity: CreditingRun
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /api/crediting-runs/{runId}/reverse"
        actor: BenefitsAdministrator
        preconditions:
          - "status == POSTED (ERR_CREDITING_RUN_STATE_INVALID)"
          - "this run is the latest POSTED run for its plan (max period_end; tie-break created_at ASC picks the later-created run as latest) (ERR_CREDITING_RUN_NOT_LATEST)"
        side_effects:
          - "For each CREDITING_GAIN entry of this run: post CREDITING_REVERSAL entry with amount_cents = -gain.amount_cents, same account_id/fund_id/crediting_run_id (POSTED)"
          - "Account balances recomputed; settled balances return exactly to pre-run values (compensating invariant)"
          - "increments CreditingRun.version by 1"

  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FLAGGED_FOR_INCLUSION
        trigger: "system (OperationalFailureCase assess-inclusion on this account)"
        actor: system
        preconditions:
          - "account.status == ACTIVE"
        side_effects:
          - "increments Account.version by 1"
      - from: FLAGGED_FOR_INCLUSION
        to: ACTIVE
        trigger: "system (last open OperationalFailureCase of this account is corrected)"
        actor: system
        preconditions:
          - "no remaining OperationalFailureCase of this account in {QUANTIFIED, INCLUSION_ASSESSED}"
        side_effects:
          - "increments Account.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system (settled_balance_cents reaches 0 after a distribution payment)"
        actor: system
        preconditions:
          - "settled_balance_cents == 0 after payment recompute and at least one DISTRIBUTION_DEBIT exists"
        side_effects:
          - "All sibling DistributionRequest of this account in REQUESTED/EVENT_VERIFIED/SCHEDULED/PAYABLE/ON_HOLD -> CANCELLED"
          - "increments Account.version by 1"
      - from: FLAGGED_FOR_INCLUSION
        to: CLOSED
        trigger: "system (settled_balance_cents reaches 0 after a distribution payment)"
        actor: system
        preconditions:
          - "settled_balance_cents == 0 after payment recompute and at least one DISTRIBUTION_DEBIT exists"
        side_effects:
          - "All sibling DistributionRequest of this account in REQUESTED/EVENT_VERIFIED/SCHEDULED/PAYABLE/ON_HOLD -> CANCELLED"
          - "increments Account.version by 1"

  - entity: DocumentFinding
    initial_state: REPORTED
    terminal_states: [CORRECTED, LAPSED]
    transitions:
      - from: REPORTED
        to: CORRECTION_FILED
        trigger: "POST /api/document-findings/{findingId}/file-correction"
        actor: ComplianceOfficer
        preconditions:
          - "status == REPORTED (ERR_FINDING_STATE_INVALID)"
          - "clock date <= correction_deadline (ERR_CORRECTION_WINDOW_EXPIRED)"
        side_effects:
          - "correction_text, filed_by_user_id set"
          - "Plan.document_posture recomputed (remains FAILURE_OPEN while filed-but-open)"
          - "increments DocumentFinding.version by 1"
      - from: CORRECTION_FILED
        to: CORRECTED
        trigger: "POST /api/document-findings/{findingId}/adjudicate with outcome=CORRECTED"
        actor: PlanSponsor
        preconditions:
          - "status == CORRECTION_FILED (ERR_FINDING_STATE_INVALID)"
        side_effects:
          - "adjudicated_by_user_id set"
          - "Plan.document_posture recomputed: COMPLIANT if no other finding in {REPORTED, CORRECTION_FILED, LAPSED}"
          - "increments DocumentFinding.version by 1"
      - from: CORRECTION_FILED
        to: REPORTED
        trigger: "POST /api/document-findings/{findingId}/adjudicate with outcome=REJECTED"
        actor: PlanSponsor
        preconditions:
          - "status == CORRECTION_FILED (ERR_FINDING_STATE_INVALID)"
        side_effects:
          - "correction_text retained for audit; finding returns to REPORTED (cycle)"
          - "increments DocumentFinding.version by 1"
      - from: REPORTED
        to: LAPSED
        trigger: "system (POST /_clock/set_current_utc sweep when clock date > correction_deadline)"
        actor: system
        preconditions:
          - "clock date > correction_deadline"
        side_effects:
          - "Plan.document_posture recomputed -> LAPSED_FAILURE"
          - "increments DocumentFinding.version by 1"
      - from: CORRECTION_FILED
        to: LAPSED
        trigger: "system (POST /_clock/set_current_utc sweep when clock date > correction_deadline)"
        actor: system
        preconditions:
          - "clock date > correction_deadline"
        side_effects:
          - "Plan.document_posture recomputed -> LAPSED_FAILURE"
          - "increments DocumentFinding.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: plan-amend-stale-version
    parent_entity: Plan
    write_endpoint: "PATCH /api/plans/{planId}"
    occ_field: "expected_plan_version"
    description: |
      Amending a Plan whose version has advanced beyond the version the client
      last observed is rejected. A client that amended the plan in between has
      already advanced Plan.version, so the stale amendment would silently
      discard configuration it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: window-create-stale-plan
    parent_entity: Plan
    write_endpoint: "POST /api/election-windows"
    occ_field: "expected_plan_version"
    description: |
      Creating an ElectionWindow against a Plan whose version has advanced
      since the client last observed it is rejected. Another writer may have
      just created a window or amended window-relevant plan configuration, so
      the current writer's overlap and deadline view of the plan is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: crediting-run-stale-plan
    parent_entity: Plan
    write_endpoint: "POST /api/crediting-runs"
    occ_field: "expected_plan_version"
    description: |
      Posting a CreditingRun against a Plan whose version has advanced since
      the client last observed it is rejected. A run posts dated gain entries
      into every account of the plan; a stale view of the plan means the
      caller's picture of already-posted periods is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: specified-list-create-stale-plan
    parent_entity: Plan
    write_endpoint: "POST /api/specified-employee-lists"
    occ_field: "expected_plan_version"
    description: |
      Creating a SpecifiedEmployeeList against a Plan whose version has
      advanced since the client last observed it is rejected. Finalizing a
      list supersedes the prior FINALIZED list, so a create based on a stale
      plan version would build a new determination on an outdated baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: account_balances
    trigger: "every ledger mutation (post-deferral, settle-entries, crediting run, crediting reverse, pay) and every Account read/statement"
    algorithm: aggregation
    formula: |
      Replay the account's AccountLedgerEntry rows in chronological order
      (created_at ASC; ties cannot occur because the server stamps each entry
      with a distinct created_at):
        settled_balance_cents     = sum(amount_cents) over entries with entry_status == POSTED
        provisional_balance_cents = sum(amount_cents) over entries with entry_status in {POSTED, PENDING}
      Both are derived fields, recomputed on every mutation; the ledger is
      append-only (reversals are new entries, never edits).
    input_set: "AccountLedgerEntry of the account; REVERSED status does not exist — reversal is modeled as a compensating POSTED entry of opposite sign"
    precision: "integer cents; no rounding"
    variants:
      - name: settled
        when: "Distribution fiscal checks, vesting base, CLOSED auto-transition"
        difference: "counts POSTED entries only"
      - name: provisional
        when: "Statement display and deferral-cap enforcement (posted_cents)"
        difference: "counts POSTED + PENDING entries; identical ledger, different inclusion set, so the two balances diverge whenever PENDING entries exist"

  - name: vesting_determination
    trigger: "on every read/compute that needs vested_balance_cents (statement, distribution create/schedule), evaluated against the current clock date"
    algorithm: threshold
    formula: |
      service_days = (clock_date - participant.hire_date).days
      service_thousandths = floor(service_days * 1000 / 365)
      vested_bp = 10000 if service_thousandths >= plan.vesting_cliff_years * 1000 else 0
      vested_balance_cents = floor(settled_balance_cents * vested_bp / 10000)
      Boundary: exactly cliff years (service_thousandths == cliff*1000) IS vested (>= inclusive).
    input_set: "Participant.hire_date, Plan.vesting_cliff_years, current clock date"
    constants:
      THOUSAND: 1000
      DAYS_PER_YEAR: 365
    precision: "integer thousandths of a year, floor; cents floor"

  - name: notional_crediting
    trigger: "POST /api/crediting-runs (run creation posts all entries atomically)"
    algorithm: chronological
    formula: |
      For each Account of the plan with status in {ACTIVE, FLAGGED_FOR_INCLUSION},
      processed in account created_at ASC order:
        For each NotionalFund of the plan in which the account holds a positive
        settled balance B_f (sum of POSTED entries with that fund_id, replayed
        in created_at ASC as of run creation):
          rate_bp = fund.annual_rate_bp            (crediting_mode == FIXED_RATE)
          rate_bp = run.index_rates[fund.id]       (crediting_mode == INDEX_LINKED; missing entry -> ERR_INDEX_RATE_MISSING)
          days = days_in_period = (period_end - period_start).days   [half-open]
          raw   = B_f * rate_bp * days / (10000 * 365)
          gain  = round_half_up(raw)               [ROUND PER ENTRY, in cents]
          post AccountLedgerEntry CREDITING_GAIN amount_cents = gain (POSTED)
      run.total_gain_cents = sum of the posted per-(account, fund) gain entries
      PINNED ROUNDING ORDER: round each per-(account, fund) entry FIRST
      (round_half_up to integer cents), THEN sum entries into totals. The
      alternative order (sum raw fractional gains, then round) is forbidden —
      the two orders differ by cents on identical inputs.
    input_set: "Accounts of the plan in {ACTIVE, FLAGGED_FOR_INCLUSION}; their POSTED ledger entries as of run creation; funds of the plan"
    precision: "integer cents, round_half_up per entry, then sum"

  - name: deferral_cap
    trigger: "DeferralElection submit (computes elected_cap_cents); post-deferral (enforces remaining cap)"
    algorithm: threshold
    formula: |
      GENERAL and PERFORMANCE:
        elected_cap_cents = floor(participant.annual_compensation_cents * deferral_percent_bp / 10000)
      NEWLY_ELIGIBLE (prorated to remaining days of the plan year, two-step floor — order pinned):
        remaining_days   = (date(plan_year, 12, 31) - date(submitted_at)).days + 1
        prorated_comp    = floor(annual_compensation_cents * remaining_days / 365)
        elected_cap_cents = floor(prorated_comp * deferral_percent_bp / 10000)
      Enforcement at post-deferral: posted_cents + amount_cents <= elected_cap_cents
      else ERR_DEFERRAL_CAP_EXCEEDED; posted_cents == elected_cap_cents -> election APPLIED.
    input_set: "Participant.annual_compensation_cents, election deferral_percent_bp, window.plan_year, submitted_at"
    precision: "integer cents, floor at each pinned step"

  - name: service_fraction_average
    trigger: "service-records append (recompute); determine (validates outcome against the active variant threshold)"
    algorithm: weighted_scoring
    formula: |
      Records must tile a contiguous half-open coverage ending at
      alleged_separation_date: sorted by period_start, each next.period_start
      == prev.period_end (gap -> ERR_SERVICE_RECORD_GAP; any overlap ->
      ERR_SERVICE_RECORD_OVERLAP); sum(days) >= 1095.
      computed_avg_fraction_bp = floor( sum(service_fraction_bp_i * days_i) / sum(days_i) )
    input_set: "SeparationCase.service_records"
    precision: "integer basis points, floor"
    variants:
      - name: default_50_presumption
        when: "plan.separation_fraction_test == DEFAULT_50"
        difference: "separation presumed (CONFIRMED_SEPARATION valid) iff computed_avg_fraction_bp < 5000; exactly 5000 means NOT separated"
      - name: liberal_20_test
        when: "plan.separation_fraction_test == LIBERAL_20"
        difference: "separation presumed iff computed_avg_fraction_bp < 2000; identical service records can flip the valid determination between the two plan configurations"

  - name: scheduled_payment_date
    trigger: "DistributionRequest schedule; recompute on ON_HOLD -> SCHEDULED; recompute for SCHEDULED SEPARATION requests when a participant's is_specified_employee flips false->true at list finalize"
    algorithm: constraint_propagation
    formula: |
      base_date by event_type:
        SEPARATION               -> separation_case.alleged_separation_date + plan.processing_lag_days
        FIXED_TIME               -> fixed_date
        CHANGE_IN_CONTROL        -> cic.effective_date + plan.processing_lag_days
        DEATH | DISABILITY       -> date(verified_at) + plan.processing_lag_days
        UNFORESEEABLE_EMERGENCY  -> date(verified_at) + plan.processing_lag_days
      six-month delay (specified employees):
        applies iff event_type == SEPARATION AND plan.six_month_delay_enabled
                 AND participant.is_specified_employee (at schedule time)
        delay_floor = separation_date + 6 calendar months (same day-of-month;
                      clamp to month-end when the target month is shorter)
        Payment exactly ON delay_floor is permitted (not before).
      scheduled_payment_date = max(base_date, delay_floor) when delay applies, else base_date
      Inputs >= 3 with nested max and three-way conditional gating.
    input_set: "request fields, linked SeparationCase/ChangeInControlEvent, plan flags, participant.is_specified_employee"
    precision: "ISO dates; calendar-month arithmetic pinned"

  - name: income_inclusion
    trigger: "OperationalFailureCase quantify"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (the credit reduces the base BEFORE interest and
      tax are computed — computing interest on the gross and then subtracting
      the credit is a different, forbidden order):
        1. includible_base_cents  = max(0, amount_cents - correction_credit_cents)
        2. days_outstanding       = (date(clock at quantify) - failure_date).days
        3. premium_interest_cents = round_half_up(includible_base_cents * (UNDERPAYMENT_RATE_BP + PREMIUM_RATE_BP) * days_outstanding / (10000 * 365))
        4. additional_tax_cents   = round_half_up(includible_base_cents * EXCISE_TAX_BP / 10000)
        5. total_inclusion_cents  = includible_base_cents + premium_interest_cents + additional_tax_cents
    input_set: "failure amount, correction credit, failure_date, quantify clock date"
    constants:
      UNDERPAYMENT_RATE_BP: 700
      PREMIUM_RATE_BP: 100
      EXCISE_TAX_BP: 2000
      DAYS_PER_YEAR: 365
    precision: "integer cents; round_half_up at steps 3 and 4"

  - name: specified_employee_selection
    trigger: "SpecifiedEmployeeList finalize"
    algorithm: waterfall_allocation
    formula: |
      eligible_count   = count of plan Participants in {ACTIVE, SEPARATION_REVIEW, SEPARATED}
      officer_cap_count = min(50, floor(eligible_count * 0.10))
      OFFICER members ranked by annual_compensation_cents DESC,
        tie-break Participant.created_at ASC (UUID id NEVER used);
        ranks 1..officer_cap_count -> is_specified = true;
        beyond cap -> is_specified = false, exclusion_reason = OFFICER_CAP_EXCEEDED.
      COMPENSATION_THRESHOLD members -> is_specified = (annual_compensation_cents >= plan.officer_comp_threshold_cents)  [inclusive boundary]
      FIVE_PERCENT_OWNER members -> is_specified = true unconditionally.
      Empty members array finalizes cleanly: every plan participant gets is_specified_employee = false.
    input_set: "list members, plan participants, plan.officer_comp_threshold_cents"
    constants:
      OFFICER_CAP_MAX: 50
      OFFICER_CAP_RATIO: 0.10
    precision: "integer counts, floor"

  - name: rabbi_trust_funding_requirement
    trigger: "trust creation; every funding event; CIC VERIFIED; any account balance/vesting change"
    algorithm: threshold
    formula: |
      total_vested_liability_cents = sum(Account.vested_balance_cents) over accounts
        of the plan in {ACTIVE, FLAGGED_FOR_INCLUSION}
      effective_target_bp = 12500 if cic_funding_required else funding_target_bp
      target_cents = ceil(total_vested_liability_cents * effective_target_bp / 10000)
      required_funding_cents = max(0, target_cents - assets_cents)
      posture:  assets_cents == 0                                  -> UNFUNDED
                assets_cents > 0 and assets_cents < target_cents   -> UNDERFUNDED
                assets_cents >= target_cents and target_cents > 0  -> FUNDED
                assets_cents > 0 and target_cents == 0             -> FUNDED
      Boundary: assets_cents == target_cents IS FUNDED (>= inclusive).
    input_set: "Accounts of the plan, trust assets, funding_target_bp, cic_funding_required"
    constants:
      CIC_TARGET_BP: 12500
    precision: "integer cents, ceil for target"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request body well-formed: required fields present, types match, enum members valid, date strings parse, start < end for date ranges"
    error_id: ERR_INVALID_REQUEST / ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: all endpoints
  - priority: 2
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty; X-User-Role names a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints
  - priority: 3
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all endpoints
  - priority: 3.5
    category: auth
    check: "Ownership: when X-User-Role == Participant, X-User-ID must equal the id of the Participant that owns the target resource (election.participant_id, account.participant_id via account)"
    error_id: ERR_RESOURCE_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "Participant-role endpoints (election create/submit/void, distribution create)"
  - priority: 4
    category: existence
    check: "Resource ids in path exist, validated left-to-right; body-referenced ids (participant_id, election_window_id, notional_fund_id, account_id, separation_case_id, change_in_control_event_id, distribution_request_id, plan_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 5
    category: state
    check: "OCC: expected_plan_version (when required by §1.2.1) equals current Plan.version — checked before all business logic"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /api/plans/{planId}, POST /api/election-windows, POST /api/crediting-runs, POST /api/specified-employee-lists"
  - priority: 6
    category: state
    check: "Plan lifecycle gate: plan.status == ACTIVE required for child writes (window create, participant create, fund create, account create, election create/submit, post-deferral, crediting run, distribution create, trust create, specified-list create, cic create, finding create, failure create)"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "child-creation/action endpoints listed"
  - priority: 6.1
    category: state
    check: "Plan transition guards: activate requires DRAFT; suspend requires ACTIVE; resume requires SUSPENDED; terminate requires ACTIVE|SUSPENDED"
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /api/plans/{planId}/{activate,suspend,resume,terminate}"
  - priority: 6.2
    category: state
    check: "Participant guards: rehire requires SEPARATED; PATCH status transitions per Participant machine; account create / election create require participant ACTIVE"
    error_id: ERR_PARTICIPANT_STATE_INVALID / ERR_PARTICIPANT_NOT_ACTIVE
    http_status: 409
    applies_to: "participant endpoints, account create, election create"
  - priority: 6.3
    category: state
    check: "Account not CLOSED for post-deferral, distribution create, settle-entries"
    error_id: ERR_ACCOUNT_CLOSED
    http_status: 409
    applies_to: "account-scoped writes"
  - priority: 6.4
    category: state
    check: "Election modifiable: submit requires DRAFT; void requires DRAFT|SUBMITTED; post-deferral requires LOCKED"
    error_id: ERR_ELECTION_NOT_MODIFIABLE
    http_status: 409
    applies_to: "election action endpoints"
  - priority: 6.5
    category: state
    check: "Window status: GENERAL election create requires window.status == OPEN; NE/PERFORMANCE create exempt from window status but subject to their own deadlines"
    error_id: ERR_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /api/deferral-elections (GENERAL)"
  - priority: 6.6
    category: state
    check: "Distribution state guards: verify requires REQUESTED; deny requires REQUESTED|EVENT_VERIFIED; schedule requires EVENT_VERIFIED; pay requires PAYABLE"
    error_id: ERR_DISTRIBUTION_STATE_INVALID / ERR_DISTRIBUTION_NOT_PAYABLE
    http_status: 409
    applies_to: "distribution action endpoints"
  - priority: 6.7
    category: state
    check: "Workflow state guards: service-records require case OPEN|REOPENED|EVIDENCE_SUBMITTED; determine requires EVIDENCE_SUBMITTED|REOPENED with >= 1 record; reopen requires determined status; list member add / finalize require DRAFT; failure quantify requires IDENTIFIED; assess requires QUANTIFIED; correct requires QUANTIFIED|INCLUSION_ASSESSED; finding file-correction requires REPORTED; adjudicate requires CORRECTION_FILED; cic adjudicate requires REPORTED; crediting reverse requires POSTED"
    error_id: ERR_CASE_STATE_INVALID / ERR_LIST_STATE_INVALID / ERR_FAILURE_STATE_INVALID / ERR_FINDING_STATE_INVALID / ERR_CIC_STATE_INVALID / ERR_CREDITING_RUN_STATE_INVALID
    http_status: 409
    applies_to: "respective action endpoints"
  - priority: 7
    category: business_safety
    check: "Document compliance gate: distribution pay forbidden while plan.document_posture == LAPSED_FAILURE"
    error_id: ERR_PLAN_DOCUMENT_LAPSED
    http_status: 403
    applies_to: "POST /api/distribution-requests/{requestId}/pay"
  - priority: 7.1
    category: business_safety
    check: "Segregation of duties: separation determine requires determiner X-User-ID != case.opened_by_user_id; failure assess-inclusion requires assessor X-User-ID != reported_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/separation-cases/{caseId}/determine, POST /api/operational-failures/{failureId}/assess-inclusion"
  - priority: 8
    category: business_temporal
    check: "Election deadlines: GENERAL submit requires clock date <= general_close_date (inclusive); NEWLY_ELIGIBLE create+submit require clock date <= initial_eligibility_date + 30 days (inclusive); PERFORMANCE create+submit require clock date <= performance_period_end - 6 calendar months (inclusive)"
    error_id: ERR_ELECTION_DEADLINE_PASSED / ERR_PERFORMANCE_ELECTION_TOO_LATE
    http_status: 422
    applies_to: "POST /api/deferral-elections, POST /api/deferral-elections/{electionId}/submit"
  - priority: 8.1
    category: business_temporal
    check: "Correction deadlines: finding file-correction requires clock date <= correction_deadline (inclusive); failure correct requires clock date <= correction_deadline (inclusive)"
    error_id: ERR_CORRECTION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "file-correction, correct"
  - priority: 8.2
    category: business_temporal
    check: "Separation reopen requires clock date <= date(determined_at) + 30 days (inclusive)"
    error_id: ERR_REOPEN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/separation-cases/{caseId}/reopen"
  - priority: 8.3
    category: business_temporal
    check: "Date-shape rules: window general_close_date must fall in calendar year plan_year-1; performance period length >= 365 days when provided; specified-list effective_date in (identification_date, identification_date + 120d]; clock set_current_utc must be >= current logical clock (no regression); failure_date <= clock date; FIXED_TIME fixed_date > creation clock date"
    error_id: ERR_INVALID_WINDOW_DATES / ERR_INVALID_EFFECTIVE_DATE / ERR_CLOCK_REGRESSION / ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "window create, specified-list create, clock set, failure create, distribution create"
  - priority: 9
    category: business_constraint
    check: "Interval overlap: election windows of the same plan use CLOSED interval semantics — [open, close] conflict when NOT (a.close < b.open or b.close < a.open); touching dates (a.close == b.open) DO conflict. Crediting runs of the same plan use HALF-OPEN semantics — [start, end) conflict when start < other.end AND end > other.start; back-to-back (end == other.start) allowed. Service records within a case must tile contiguously: next.start == prev.end, no gap, no overlap"
    error_id: ERR_WINDOW_OVERLAP / ERR_CREDITING_PERIOD_OVERLAP / ERR_SERVICE_RECORD_GAP / ERR_SERVICE_RECORD_OVERLAP
    http_status: 409
    applies_to: "window create, crediting-run create, service-records append"
  - priority: 9.1
    category: business_constraint
    check: "Uniqueness: one election per (participant, window); one Account per (participant, plan); one RabbiTrust per plan; one OPEN/EVIDENCE_SUBMITTED/REOPENED SeparationCase per participant; one DRAFT SpecifiedEmployeeList per plan; one member row per participant per list"
    error_id: ERR_DUPLICATE_ELECTION / ERR_ACCOUNT_EXISTS / ERR_TRUST_EXISTS / ERR_OPEN_CASE_EXISTS / ERR_DRAFT_LIST_EXISTS / ERR_DUPLICATE_MEMBER
    http_status: 409
    applies_to: "respective create endpoints"
  - priority: 9.2
    category: business_referential
    check: "Cross-aggregate integrity: participant.plan_id, window.plan_id, fund.plan_id must all match on election create; account.plan_id must equal participant.plan_id; distribution links must belong to the account's participant/plan; list members must be participants of the list's plan; post-deferral requires an existing Account for the election's (participant, plan)"
    error_id: ERR_CROSS_PLAN_REFERENCE / ERR_ACCOUNT_REQUIRED
    http_status: 409
    applies_to: "election create, account create, distribution create/verify, member add, failure create, post-deferral"
  - priority: 9.3
    category: business_constraint
    check: "Event/world consistency: distribution event_type must be in plan.distribution_events_allowed; verify-event type conditions (case determined, cic verified, participant DECEASED/DISABLED); CIC adjudication stake threshold per type; determine outcome must match computed presumption; crediting reverse requires latest POSTED run; reopen_count < 1; no PAID distribution linked to a case being reopened; every ACTIVE INDEX_LINKED fund of the plan must appear in crediting run index_rates; CIC_MANDATORY_FUNDING requires a VERIFIED CIC for the plan"
    error_id: ERR_EVENT_TYPE_NOT_PERMITTED / ERR_EVENT_NOT_CONFIRMED / ERR_CIC_THRESHOLD_NOT_MET / ERR_SERVICE_FRACTION_CONTRADICTS_OUTCOME / ERR_CREDITING_RUN_NOT_LATEST / ERR_CASE_REOPEN_LIMIT / ERR_CASE_HAS_PAID_DISTRIBUTIONS / ERR_INDEX_RATE_MISSING / ERR_NO_VERIFIED_CIC
    http_status: 409
    applies_to: "respective endpoints"
  - priority: 10
    category: business_fiscal
    check: "Fiscal limits: post-deferral cumulative <= elected_cap_cents; distribution create requested_amount <= vested_balance_cents; schedule requires vested_balance_cents > 0; pay requires settled_balance_cents >= locked_amount_cents; emergency requested <= emergency_need; trust funding events must keep assets_cents >= 0; CIC_MANDATORY_FUNDING amount must equal required_funding_cents exactly"
    error_id: ERR_DEFERRAL_CAP_EXCEEDED / ERR_INSUFFICIENT_VESTED_BALANCE / ERR_EXCEEDS_EMERGENCY_NEED / ERR_NEGATIVE_TRUST_ASSETS / ERR_CIC_FUNDING_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "post-deferral, distribution create/schedule/pay, funding-events"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Plans ---
  - method: POST
    path: "/api/plans"
    description: "Create a plan in DRAFT with document_posture COMPLIANT"
    roles: [PlanSponsor]
    code: 201
    input: [name, effective_date, distribution_events_allowed, officer_comp_threshold_cents, "six_month_delay_enabled?", "rabbi_trust_required?", "accelerate_on_cic?", "separation_fraction_test?", "vesting_cliff_years?", "processing_lag_days?"]
    output: Plan
    side_effects: ["status = DRAFT", "document_posture = COMPLIANT"]
  - method: GET
    path: "/api/plans"
    description: "List plans (paginated)"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Plan[]"
    side_effects: []
  - method: GET
    path: "/api/plans/{planId}"
    description: "Get a plan"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: []
  - method: PATCH
    path: "/api/plans/{planId}"
    description: "Amend plan configuration (OCC-guarded). Forbidden once TERMINATION_PENDING or TERMINATED (ERR_PLAN_STATE_INVALID)"
    roles: [PlanSponsor]
    code: 200
    input: ["name?", "six_month_delay_enabled?", "rabbi_trust_required?", "accelerate_on_cic?", "separation_fraction_test?", "vesting_cliff_years?", "officer_comp_threshold_cents?", "processing_lag_days?", expected_plan_version]
    output: Plan
    side_effects: ["increments Plan.version by 1"]
  - method: POST
    path: "/api/plans/{planId}/activate"
    description: "Activate a DRAFT plan"
    roles: [PlanSponsor]
    code: 200
    input: []
    output: Plan
    side_effects: ["status -> ACTIVE", "increments Plan.version by 1"]
  - method: POST
    path: "/api/plans/{planId}/suspend"
    description: "Suspend an ACTIVE plan (blocks child writes)"
    roles: [PlanSponsor]
    code: 200
    input: []
    output: Plan
    side_effects: ["status -> SUSPENDED", "increments Plan.version by 1"]
  - method: POST
    path: "/api/plans/{planId}/resume"
    description: "Resume a SUSPENDED plan"
    roles: [PlanSponsor]
    code: 200
    input: []
    output: Plan
    side_effects: ["status -> ACTIVE", "increments Plan.version by 1"]
  - method: POST
    path: "/api/plans/{planId}/terminate"
    description: "Begin plan termination: status TERMINATION_PENDING, termination_effective_date = clock date + 12 calendar months"
    roles: [PlanSponsor]
    code: 200
    input: []
    output: Plan
    side_effects: ["status -> TERMINATION_PENDING", "termination_effective_date set", "DRAFT/SUBMITTED elections of the plan -> VOIDED", "increments Plan.version by 1"]

  # --- Election windows ---
  - method: POST
    path: "/api/election-windows"
    description: "Create an election window for a plan (OCC-guarded on Plan.version). Windows of the same plan use closed-interval overlap semantics."
    roles: [PlanSponsor]
    code: 201
    input: [plan_id, plan_year, general_open_date, general_close_date, "performance_period_start?", "performance_period_end?", expected_plan_version]
    output: ElectionWindow
    side_effects: ["status = SCHEDULED", "increments Plan.version by 1"]
  - method: GET
    path: "/api/election-windows"
    description: "List election windows, optionally filtered by plan"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: "ElectionWindow[]"
    side_effects: []
  - method: GET
    path: "/api/election-windows/{windowId}"
    description: "Get an election window"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: ElectionWindow
    side_effects: []

  # --- Participants ---
  - method: POST
    path: "/api/participants"
    description: "Enroll a participant into a plan (plan must be ACTIVE)"
    roles: [BenefitsAdministrator]
    code: 201
    input: [plan_id, employee_ref, hire_date, initial_eligibility_date, annual_compensation_cents]
    output: Participant
    side_effects: ["status = ACTIVE", "is_specified_employee = false", "inclusion_liability_cents = 0"]
  - method: GET
    path: "/api/participants"
    description: "List participants, optionally filtered by plan"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: "Participant[]"
    side_effects: []
  - method: GET
    path: "/api/participants/{participantId}"
    description: "Get a participant"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: PATCH
    path: "/api/participants/{participantId}"
    description: "Update compensation or set status to DISABLED/DECEASED per Participant state machine"
    roles: [BenefitsAdministrator]
    code: 200
    input: ["annual_compensation_cents?", "status?"]
    output: Participant
    side_effects: ["status transition per Participant machine", "increments Participant.version by 1"]
  - method: POST
    path: "/api/participants/{participantId}/rehire"
    description: "Rehire a SEPARATED participant (cycle back to ACTIVE)"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: Participant
    side_effects: ["status -> ACTIVE", "separation_date = null", "is_specified_employee = false", "increments Participant.version by 1"]

  # --- Notional funds ---
  - method: POST
    path: "/api/notional-funds"
    description: "Create a notional investment fund for a plan"
    roles: [PlanSponsor]
    code: 201
    input: [plan_id, ticker, crediting_mode, annual_rate_bp]
    output: NotionalFund
    side_effects: []
  - method: GET
    path: "/api/notional-funds"
    description: "List notional funds, optionally filtered by plan"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: "NotionalFund[]"
    side_effects: []
  - method: GET
    path: "/api/notional-funds/{fundId}"
    description: "Get a notional fund"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: NotionalFund
    side_effects: []

  # --- Deferral elections ---
  - method: POST
    path: "/api/deferral-elections"
    description: "Create a DRAFT deferral election (Participant acting for self). GENERAL requires window OPEN; NEWLY_ELIGIBLE and PERFORMANCE are gated by their own deadlines. One election per (participant, window)."
    roles: [Participant]
    code: 201
    input: [participant_id, election_window_id, election_type, deferral_percent_bp, notional_fund_id]
    output: DeferralElection
    side_effects: ["status = DRAFT", "plan_id denormalized from participant"]
  - method: GET
    path: "/api/deferral-elections"
    description: "List deferral elections with filters"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["participant_id?", "election_window_id?", "notional_fund_id?", "plan_id?", "limit?", "offset?"]
    output: "DeferralElection[]"
    side_effects: []
  - method: GET
    path: "/api/deferral-elections/{electionId}"
    description: "Get a deferral election"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: DeferralElection
    side_effects: []
  - method: POST
    path: "/api/deferral-elections/{electionId}/submit"
    description: "Submit a DRAFT election; computes elected_cap_cents; deadline rules per election_type"
    roles: [Participant]
    code: 200
    input: []
    output: DeferralElection
    side_effects: ["status -> SUBMITTED", "submitted_at set", "elected_cap_cents computed per deferral_cap", "increments DeferralElection.version by 1"]
  - method: POST
    path: "/api/deferral-elections/{electionId}/void"
    description: "Void an election before it locks (DRAFT or SUBMITTED only)"
    roles: [Participant]
    code: 200
    input: []
    output: DeferralElection
    side_effects: ["status -> VOIDED", "increments DeferralElection.version by 1"]
  - method: POST
    path: "/api/deferral-elections/{electionId}/post-deferral"
    description: "Post a payroll deferral against a LOCKED election; creates a PENDING DEFERRAL_CREDIT ledger entry on the participant's account"
    roles: [BenefitsAdministrator]
    code: 201
    input: [amount_cents, service_period_start, service_period_end]
    output: AccountLedgerEntry
    side_effects: ["AccountLedgerEntry DEFERRAL_CREDIT created (PENDING, fund_id = election.notional_fund_id, election_id = election)", "election.posted_cents += amount_cents", "if posted_cents == elected_cap_cents: election -> APPLIED", "account balances recomputed (provisional only until settled)"]

  # --- Accounts ---
  - method: POST
    path: "/api/accounts"
    description: "Open the participant's notional account in a plan; unique per (participant, plan)"
    roles: [BenefitsAdministrator]
    code: 201
    input: [participant_id, plan_id]
    output: Account
    side_effects: ["status = ACTIVE", "balances = 0"]
  - method: GET
    path: "/api/accounts"
    description: "List accounts, optionally filtered by participant or plan"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["participant_id?", "plan_id?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []
  - method: GET
    path: "/api/accounts/{accountId}"
    description: "Get an account (carries settled/provisional/vested balances)"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/api/accounts/{accountId}/statement"
    description: "Computed statement: dual-variant balances, vesting, entry counts, lifetime totals"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: { settled_balance_cents: integer, provisional_balance_cents: integer, vested_balance_cents: integer, vested_bp: integer, pending_entries_count: integer, posted_entries_count: integer, total_deferred_cents: integer, total_distributed_cents: integer }
    side_effects: []
  - method: POST
    path: "/api/accounts/{accountId}/settle-entries"
    description: "Payroll confirmation: flip all PENDING ledger entries of the account to POSTED"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: Account
    side_effects: ["PENDING entries -> POSTED", "settled_balance_cents recomputed", "vested_balance_cents recomputed", "increments Account.version by 1"]

  # --- Ledger (event log read) ---
  - method: GET
    path: "/api/ledger-entries"
    description: "Query the append-only ledger with filters; replay order is created_at ASC"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["account_id?", "fund_id?", "crediting_run_id?", "election_id?", "distribution_request_id?", "limit?", "offset?"]
    output: "AccountLedgerEntry[]"
    side_effects: []
  - method: GET
    path: "/api/ledger-entries/{entryId}"
    description: "Get a single ledger entry"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: AccountLedgerEntry
    side_effects: []

  # --- Crediting runs ---
  - method: POST
    path: "/api/crediting-runs"
    description: "Post a notional crediting run for a plan (OCC-guarded on Plan.version). Half-open period [period_start, period_end); overlap with an existing POSTED run of the same plan is rejected, back-to-back is allowed."
    roles: [BenefitsAdministrator]
    code: 201
    input: [plan_id, period_start, period_end, "index_rates?", expected_plan_version]
    output: CreditingRun
    side_effects: ["status = POSTED", "CREDITING_GAIN entries posted per notional_crediting calculation (round per entry, then sum)", "account balances recomputed", "increments Plan.version by 1"]
  - method: GET
    path: "/api/crediting-runs"
    description: "List crediting runs, optionally filtered by plan"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: "CreditingRun[]"
    side_effects: []
  - method: GET
    path: "/api/crediting-runs/{runId}"
    description: "Get a crediting run"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: CreditingRun
    side_effects: []
  - method: POST
    path: "/api/crediting-runs/{runId}/reverse"
    description: "Reverse the latest POSTED run of its plan by posting compensating CREDITING_REVERSAL entries"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: CreditingRun
    side_effects: ["status -> REVERSED", "CREDITING_REVERSAL entries posted (negative of each gain)", "account balances recomputed to exactly pre-run values", "increments CreditingRun.version by 1"]

  # --- Rabbi trusts ---
  - method: POST
    path: "/api/rabbi-trusts"
    description: "Establish the rabbi trust for a plan; one per plan"
    roles: [PlanSponsor]
    code: 201
    input: [plan_id, funding_target_bp]
    output: RabbiTrust
    side_effects: ["assets_cents = 0", "posture = UNFUNDED"]
  - method: GET
    path: "/api/rabbi-trusts"
    description: "List rabbi trusts, optionally filtered by plan"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: "RabbiTrust[]"
    side_effects: []
  - method: GET
    path: "/api/rabbi-trusts/{trustId}"
    description: "Get a rabbi trust (assets, required funding, posture, funding events)"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: RabbiTrust
    side_effects: []
  - method: POST
    path: "/api/rabbi-trusts/{trustId}/funding-events"
    description: "Append a funding event. CONTRIBUTION > 0; VALUATION_ADJUSTMENT signed non-zero; CIC_MANDATORY_FUNDING > 0 requires a VERIFIED CIC for the plan and amount == required_funding_cents exactly. Assets may never go negative."
    roles: [TrustOfficer]
    code: 201
    input: [event_type, amount_cents]
    output: RabbiTrust
    side_effects: ["funding_events appended", "assets_cents recomputed", "required_funding_cents recomputed", "posture recomputed", "increments RabbiTrust.version by 1"]

  # --- Separation cases ---
  - method: POST
    path: "/api/separation-cases"
    description: "Open a separation-from-service case; participant moves to SEPARATION_REVIEW; one open case per participant"
    roles: [BenefitsAdministrator]
    code: 201
    input: [participant_id, alleged_separation_date, trigger_reason]
    output: SeparationCase
    side_effects: ["status = OPEN", "opened_by_user_id = X-User-ID", "Participant ACTIVE -> SEPARATION_REVIEW"]
  - method: GET
    path: "/api/separation-cases"
    description: "List separation cases, optionally filtered by participant"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["participant_id?", "limit?", "offset?"]
    output: "SeparationCase[]"
    side_effects: []
  - method: GET
    path: "/api/separation-cases/{caseId}"
    description: "Get a separation case (service records, computed average, status)"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: SeparationCase
    side_effects: []
  - method: POST
    path: "/api/separation-cases/{caseId}/service-records"
    description: "Append a service-fraction evidence record; records must tile contiguously (half-open) with no gap or overlap and total >= 1095 days ending at alleged_separation_date"
    roles: [BenefitsAdministrator]
    code: 201
    input: [period_start, period_end, service_fraction_bp]
    output: SeparationCase
    side_effects: ["service_records appended", "computed_avg_fraction_bp recomputed", "status OPEN|REOPENED -> EVIDENCE_SUBMITTED", "increments SeparationCase.version by 1"]
  - method: POST
    path: "/api/separation-cases/{caseId}/determine"
    description: "Determine separation (segregation of duties: determiner != opener); outcome must match the computed presumption under the plan's fraction test"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: SeparationCase
    side_effects: ["status -> DETERMINED_SEPARATED | DETERMINED_NOT_SEPARATED", "determination_threshold_bp snapshot", "Participant SEPARATION_REVIEW -> SEPARATED (with election-void cascade) or -> ACTIVE", "linked ON_HOLD DistributionRequest -> DENIED on REBUTTED", "increments SeparationCase.version by 1"]
  - method: POST
    path: "/api/separation-cases/{caseId}/reopen"
    description: "Reopen a determined case once, within 30 days of determination, if no linked distribution is PAID"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: SeparationCase
    side_effects: ["status -> REOPENED", "reopen_count += 1", "if was DETERMINED_SEPARATED: Participant SEPARATED -> SEPARATION_REVIEW, separation_date = null; linked SCHEDULED DistributionRequest -> ON_HOLD", "increments SeparationCase.version by 1"]

  # --- Specified employee lists ---
  - method: POST
    path: "/api/specified-employee-lists"
    description: "Create a DRAFT annual specified-employee determination (OCC-guarded on Plan.version); one DRAFT per plan"
    roles: [ComplianceOfficer]
    code: 201
    input: [plan_id, identification_date, effective_date, expected_plan_version]
    output: SpecifiedEmployeeList
    side_effects: ["status = DRAFT", "increments Plan.version by 1"]
  - method: GET
    path: "/api/specified-employee-lists"
    description: "List specified-employee lists, optionally filtered by plan"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: "SpecifiedEmployeeList[]"
    side_effects: []
  - method: GET
    path: "/api/specified-employee-lists/{listId}"
    description: "Get a specified-employee list (members with per-member computed flags)"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: SpecifiedEmployeeList
    side_effects: []
  - method: POST
    path: "/api/specified-employee-lists/{listId}/members"
    description: "Add a member row to a DRAFT list; one row per participant"
    roles: [ComplianceOfficer]
    code: 201
    input: [participant_id, basis, annual_compensation_cents]
    output: SpecifiedEmployeeList
    side_effects: ["members appended", "increments SpecifiedEmployeeList.version by 1"]
  - method: POST
    path: "/api/specified-employee-lists/{listId}/finalize"
    description: "Finalize: compute officer cap selection, set Participant.is_specified_employee, supersede prior FINALIZED list, recompute delayed distribution dates"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SpecifiedEmployeeList
    side_effects: ["status -> FINALIZED", "officer_cap_count computed", "per-member is_specified computed per specified_employee_selection", "Participant.is_specified_employee updated", "SCHEDULED SEPARATION DistributionRequest dates recomputed for newly-specified participants", "prior FINALIZED list of the plan -> SUPERSEDED", "increments SpecifiedEmployeeList.version by 1"]

  # --- Distribution requests ---
  - method: POST
    path: "/api/distribution-requests"
    description: "Request a distribution against an account (Participant acting for self via account ownership). Type-specific linkage fields required; event_type must be permitted by the plan."
    roles: [Participant]
    code: 201
    input: [account_id, event_type, "requested_amount_cents?", "fixed_date?", "emergency_need_cents?", "separation_case_id?", "change_in_control_event_id?"]
    output: DistributionRequest
    side_effects: ["status = REQUESTED", "participant_id denormalized from account"]
  - method: GET
    path: "/api/distribution-requests"
    description: "List distribution requests with filters"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: ["account_id?", "participant_id?", "separation_case_id?", "change_in_control_event_id?", "limit?", "offset?"]
    output: "DistributionRequest[]"
    side_effects: []
  - method: GET
    path: "/api/distribution-requests/{requestId}"
    description: "Get a distribution request"
    roles: [PlanSponsor, BenefitsAdministrator, ComplianceOfficer, TrustOfficer, Participant, PlatformAdmin]
    code: 200
    input: []
    output: DistributionRequest
    side_effects: []
  - method: POST
    path: "/api/distribution-requests/{requestId}/verify-event"
    description: "Verify the distribution event per its type (REQUESTED -> EVENT_VERIFIED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DistributionRequest
    side_effects: ["status -> EVENT_VERIFIED", "verified_at set", "increments DistributionRequest.version by 1"]
  - method: POST
    path: "/api/distribution-requests/{requestId}/schedule"
    description: "Lock amount and compute scheduled_payment_date (six-month delay for specified employees on separation events)"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: DistributionRequest
    side_effects: ["status -> SCHEDULED", "locked_amount_cents and scheduled_payment_date computed", "increments DistributionRequest.version by 1"]
  - method: POST
    path: "/api/distribution-requests/{requestId}/pay"
    description: "Pay a PAYABLE request; posts the DISTRIBUTION_DEBIT and runs the account-close cascade"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: DistributionRequest
    side_effects: ["status -> PAID", "paid_at set", "DISTRIBUTION_DEBIT ledger entry (POSTED)", "account balances recomputed; Account -> CLOSED when settled reaches 0; sibling requests -> CANCELLED", "trust TRUST_DISTRIBUTION funding event when a funded trust exists", "increments DistributionRequest.version by 1"]
  - method: POST
