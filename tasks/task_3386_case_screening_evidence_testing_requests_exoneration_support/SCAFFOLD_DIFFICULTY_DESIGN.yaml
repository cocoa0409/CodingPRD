  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: lab_reserve_exact_remaining_equality_allowed
        grounds:
          - calculations.sample_ledger
          - endpoints.POST_/lab-analyses
          - entities.EvidenceItem.fields.remaining_sample_ng
        distinguishing_aspect: |
          Boundary on the sample-mass metric via POST /lab-analyses: reservation
          is allowed iff remaining_sample_ng >= required_sample_ng — exact
          equality (10 == 10) MUST succeed, and one nanogram more (11 > 10) MUST
          fail with ERR_INSUFFICIENT_SAMPLE; a failed reservation leaves the
          ledger untouched.
        test_recipe:
          setup:
            - "Case in TESTING with SIGNED agreement; evidence item initial_sample_ng 25; a first analysis has reserved 15, leaving remaining_sample_ng == 10."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /jurisdictions"
              payload: { state_code: "CO", name: "Colorado", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
