              as_user_id: "officer-B"
              captures: { md2: $.data.member_id }
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Ivy Harbor", applicant_dob: "1977-08-08", basis_type: "FAMILY_DERIVATION", sponsor_member_id: "${md2}", claimed_relationship: "SPOUSE" }
