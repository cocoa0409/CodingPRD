      - name: entitlement_denials_return_forbidden_for_tier_miss_and_offline_request
        claim_type: triggerable
        grounds:
          - errors[ERR_ENTITLEMENT_NO_RULE]
          - errors[ERR_OFFLINE_PLAYBACK_DENIED]
          - calculations.entitlement_decision
        distinguishing_aspect: "The two 403 denials are reached at different stages of one evaluation: a BASIC request against a PREMIUM-only rule never matches and is ERR_ENTITLEMENT_NO_RULE, whereas a PREMIUM request that DOES match is still ERR_OFFLINE_PLAYBACK_DENIED when it asks for offline on a non-persistent package — and the same PREMIUM request without offline is allowed at 720."
        test_recipe:
          setup:
            - "One Title with a QC_PASSED asset, a LOCKED 720p H264 ladder and a PACKAGED package (persistent_license_allowed left at its false default) carrying a single PREMIUM wildcard rule."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 40.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-DENIALS", title_name: "Denials Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/denials.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/wv" }
              as: DrmOperator
              captures: { pk_id: $.data.id }
            - call: "POST /drm-packages/${pk_id}/entitlement-rules"
              payload: { region_code: "*", subscription_tier: "PREMIUM", max_concurrent_streams: 2, max_playback_height_px: 720, hdcp_level: "NONE", priority: 30 }
              as: DrmOperator
              captures: { r_id: $.data.id }
            - call: "POST /drm-packages/${pk_id}/package"
              payload: {}
              as: DrmOperator
          trigger:
            - call: "POST /playback-entitlement-checks"
              payload: { title_id: "${t_id}", region_code: "US", subscription_tier: "BASIC", device_class: "MOBILE_HIGH", requested_streams: 1 }
              as: DeliveryEngineer
            - call: "POST /playback-entitlement-checks"
              payload: { title_id: "${t_id}", region_code: "US", subscription_tier: "PREMIUM", device_class: "MOBILE_HIGH", requested_streams: 1, offline_requested: true }
              as: DeliveryEngineer
            - call: "POST /playback-entitlement-checks"
              payload: { title_id: "${t_id}", region_code: "US", subscription_tier: "PREMIUM", device_class: "MOBILE_HIGH", requested_streams: 1 }
              as: DeliveryEngineer
          assert:
            - "DrmPackage.${pk_id}.state == PACKAGED and persistent_license_allowed == false"
            - "BASIC check: HTTP status == 403 and error_id == ERR_ENTITLEMENT_NO_RULE"
            - "PREMIUM offline check: HTTP status == 403 and error_id == ERR_OFFLINE_PLAYBACK_DENIED"
            - "PREMIUM online check: HTTP status == 200 and decision == ALLOW and matched_rule_id == ${r_id}"
            - "PREMIUM online check: package_id == ${pk_id} and effective_height_px == 720 and max_concurrent_streams == 2 and offline_granted == false"

      # ---- codes owned by §1.8 --------------------------------------------
      - name: asset_action_from_the_wrong_qc_state
        claim_type: triggerable
        grounds:
          - errors[ERR_ASSET_STATE_INVALID]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / mezzanine_qc_revision_cycle_terminates"
          rationale: "That instance drives the QC loop to the terminal QC_REJECTED and asserts the 409 ERR_ASSET_STATE_INVALID on the follow-up action; repeating it here would duplicate the same trigger."

      - name: ladder_action_from_the_wrong_state
        claim_type: triggerable
        grounds:
          - errors[ERR_LADDER_STATE_INVALID]
        excluded_because:
          difficulty_instance: "transitive_cascade / ladder_lock_supersede_chain"
          rationale: "The supersede chain asserts that a second lock of the SUPERSEDED ladder returns 409 ERR_LADDER_STATE_INVALID, which is exactly this code's condition."

      - name: reservation_action_from_the_wrong_state
        claim_type: triggerable
        grounds:
          - errors[ERR_RESERVATION_STATE_INVALID]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / reservation_failover_state_beats_capacity"
          rationale: "That instance triggers ERR_RESERVATION_STATE_INVALID on a failover from RESERVED and additionally proves it outranks the capacity check."

      - name: arm_without_a_packaged_package
        claim_type: triggerable
        grounds:
          - errors[ERR_PACKAGE_NOT_READY]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / live_arm_requires_packaged_drm"
          rationale: "The arm gate is that instance's whole subject: it asserts the 409 ERR_PACKAGE_NOT_READY and then the success after packaging."

      - name: lock_while_an_asset_awaits_remediation
        claim_type: triggerable
        grounds:
          - errors[ERR_ASSET_REMEDIATION_PENDING]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / ladder_lock_requires_passed_asset"
          rationale: "That instance pins ERR_ASSET_REMEDIATION_PENDING as the winner over ERR_NO_PASSED_ASSET when one asset has already passed."

      - name: rule_hdcp_below_the_package_floor
        claim_type: triggerable
        grounds:
          - errors[ERR_HDCP_FLOOR_VIOLATION]
          - errors[ERR_RULE_REGION_NOT_LICENSED]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / entitlement_rule_safety_beats_referential"
          rationale: "Both codes are triggered there: the safety violation first, then the referential one once the hdcp_level is fixed."

      - name: reservation_capacity_over_the_committed_ceiling
        claim_type: triggerable
        grounds:
          - errors[ERR_VENDOR_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: "boundary_precision_check / vendor_capacity_equality_admits_reservation"
          rationale: "The create arm of the capacity guard is that boundary instance's subject; the distinct PATCH arm is covered above by patch_lowering_committed_gbps_below_reserved_is_rejected_then_accepted_at_equality."

      - name: overlapping_availability_window
        claim_type: triggerable
        grounds:
          - errors[ERR_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / availability_window_half_open_adjacency"
          rationale: "That instance accepts the abutting window and rejects the one-second-overlapping window with ERR_WINDOW_OVERLAP."

  # ===========================================================================
  # SECTION 7 — From Table 7 (RBAC), role_model peer_roles
  # Seven peer roles, no hierarchy: PlatformAdmin is deliberately NOT a superset.
  # ===========================================================================
  - section: rbac
    instances:

      - name: roles_cannot_perform_a_peer_roles_exclusive_operation
        claim_type: peer_exclusive_denied
        grounds:
          - roles.ContentOps.exclusive_operations
          - roles.QcAnalyst.exclusive_operations
          - roles.EncodingEngineer.exclusive_operations
          - roles.DrmOperator.exclusive_operations
          - roles.DeliveryEngineer.exclusive_operations
          - roles.PlatformAdmin.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "peer_roles has no override path in either direction: the desk that registers a master cannot judge it, the desk that judges it cannot register one, and PlatformAdmin — which owns the device matrix and the clock — cannot create a Title or an encoding ladder, every attempt returning 403 ERR_ROLE_NOT_PERMITTED with no state change."
        test_recipe:
          setup:
            - "One Title with one INGESTED asset, one DRAFT ladder and one PENDING package, all created by the correct roles."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-RBAC-PEER", title_name: "Peer Roles Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/peer.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/wv" }
              as: DrmOperator
              captures: { pk_id: $.data.id }
          trigger:
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/qc-authored.mxf", duration_seconds: 600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, audio_language: "en" }
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: ContentOps
            - call: "POST /mezzanine-assets/${a_id}/remediation-request"
              payload: {}
              as: ContentOps
            - call: "POST /titles"
              payload: { external_ref: "TTL-RBAC-ADMIN", title_name: "Admin Authored Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: PlatformAdmin
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "HEVC", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: PlatformAdmin
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: DeliveryEngineer
            - call: "POST /drm-packages/${pk_id}/package"
              payload: {}
              as: EncodingEngineer
            - call: "POST /routing-policies"
              payload: { title_id: "${t_id}", region_code: "US", steering_mode: "COST" }
              as: DrmOperator
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_LOW", max_height_px: 480, supported_codecs: ["H264"], min_bitrate_kbps: 200, max_bitrate_kbps: 2000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 10.00, quality_normalization_factor: 0.60 }
              as: ContentOps
            - call: "GET /titles"
              payload: {}
              as: QcAnalyst
          assert:
            - "all ten calls return HTTP status 403 with error_id == ERR_ROLE_NOT_PERMITTED"
            - "exactly 1 Title, 1 MezzanineAsset, 1 EncodingLadder, 1 DrmPackage, 0 DeviceProfiles and 0 RoutingPolicies exist afterwards"
            - "MezzanineAsset.${a_id}.qc_state == INGESTED and qc_attempt_count == 0"
            - "EncodingLadder.${l_id}.state == DRAFT and DrmPackage.${pk_id}.state == PENDING"
            - "Title.${t_id}.version is still ${t_ver}"

      - name: shared_operations_work_for_every_role_that_lists_them
        claim_type: peer_roles
        grounds:
          - roles.ContentOps.shared_operations
          - roles.PlatformAdmin.shared_operations
          - roles.DeliveryEngineer.shared_operations
          - roles.QcAnalyst.shared_operations
        distinguishing_aspect: "The shared surface is genuinely shared rather than duplicated per role: GET /titles/{id} answers for all six opaque roles, POST /availability-sweep answers for both PlatformAdmin and ContentOps, POST /playback-metrics answers for both DeliveryEngineer and PlatformAdmin, and the QC report list answers for ContentOps, QcAnalyst and PlatformAdmin."
        test_recipe:
          setup:
            - "One Title with one INGESTED asset, one ACTIVE DeviceProfile and one US-serving vendor."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-RBAC-SHARED", title_name: "Shared Reads Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/shared.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 40.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "SHAREDCDN", regions: ["US"], committed_gbps: 60.00, cost_per_gb_usd: 0.0200 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
            - call: "GET /titles/${t_id}"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: EncodingEngineer
            - call: "GET /titles/${t_id}"
              payload: {}
              as: DrmOperator
            - call: "GET /titles/${t_id}"
              payload: {}
              as: DeliveryEngineer
            - call: "GET /titles/${t_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /mezzanine-assets/${a_id}/qc-reports"
              payload: {}
              as: QcAnalyst
            - call: "GET /mezzanine-assets/${a_id}/qc-reports"
              payload: {}
              as: ContentOps
            - call: "GET /mezzanine-assets/${a_id}/qc-reports"
              payload: {}
              as: PlatformAdmin
            - call: "POST /availability-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "POST /availability-sweep"
              payload: {}
              as: ContentOps
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${d_id}", vendor_id: "${v_id}", region_code: "US", window_start_at: "2026-07-01T00:00:00Z", window_end_at: "2026-07-01T01:00:00Z", play_attempts: 100, rebuffer_events: 0, startup_ms_p95: 1500, error_count: 0 }
              as: DeliveryEngineer
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${d_id}", vendor_id: "${v_id}", region_code: "US", window_start_at: "2026-07-01T01:00:00Z", window_end_at: "2026-07-01T02:00:00Z", play_attempts: 100, rebuffer_events: 0, startup_ms_p95: 1500, error_count: 0 }
              as: PlatformAdmin
          assert:
            - "all six Title reads: HTTP status == 200 with the same id ${t_id} and response_type == object"
            - "all three qc-report reads: HTTP status == 200 with exactly 0 reports"
            - "both sweeps: HTTP status == 200 with all nine counters == 0"
            - "both metric ingests: HTTP status == 201 with quality_index == 100.00 and breach_flag == false"
            - "after both ingests: CdnVendor.${v_id}.health_score_rolling == 100.00 and health_score_contract == 100.00 and breach_window_count == 0 and state == ACTIVE"

      - name: vendor_operator_with_an_unknown_identity_is_forbidden
        claim_type: peer_roles
        grounds:
          - roles.VendorOperator.identity
          - errors[ERR_VENDOR_IDENTITY_UNKNOWN]
        distinguishing_aspect: "VendorOperator is entity_backed: the X-User-ID header must itself be an existing CdnVendor id, so a syntactically valid but unissued id is 403 ERR_VENDOR_IDENTITY_UNKNOWN even when the addressed vendor row exists and even before any scope comparison happens."
        test_recipe:
          setup:
            - "One CdnVendor that exists, and a VendorOperator whose X-User-ID is a UUID that was never issued."
          setup_api_calls:
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "REALCDN", regions: ["US"], committed_gbps: 40.00, cost_per_gb_usd: 0.0200 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "GET /cdn-vendors/${v_id}"
              payload: {}
              as: VendorOperator
              as_user_id: "cccccccc-0000-4000-8000-000000000001"
            - call: "GET /playback-metrics"
              payload: { vendor_id: "${v_id}" }
              as: VendorOperator
              as_user_id: "cccccccc-0000-4000-8000-000000000001"
          assert:
            - "both calls: HTTP status == 403 and error_id == ERR_VENDOR_IDENTITY_UNKNOWN"
            - "neither call returns ERR_VENDOR_SCOPE_VIOLATION and neither returns 404"
            - "CdnVendor.${v_id}.version is still 1"

      - name: vendor_operator_cannot_read_another_vendors_row_or_an_unfiltered_list
        claim_type: peer_roles
        grounds:
          - roles.VendorOperator.shared_operations
          - errors[ERR_VENDOR_SCOPE_VIOLATION]
          - endpoints.PATCH_/cdn-vendors/{id}
        distinguishing_aspect: "Scope is enforced on both the path and the filter: vendor A reading or patching vendor B is ERR_VENDOR_SCOPE_VIOLATION, and so is listing playback metrics with no vendor filter at all, while the same three calls scoped to A's own id succeed — including the PATCH, which bumps only A's version."
        test_recipe:
          setup:
            - "Two CdnVendors, ALPHA and BRAVO; the caller acts as ALPHA throughout."
          setup_api_calls:
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "ALPHACDN", regions: ["US"], committed_gbps: 60.00, cost_per_gb_usd: 0.0200 }
              as: PlatformAdmin
              captures: { v_a: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "BRAVOCDN", regions: ["US"], committed_gbps: 60.00, cost_per_gb_usd: 0.0300 }
              as: PlatformAdmin
              captures: { v_b: $.data.id }
          trigger:
            - call: "GET /cdn-vendors/${v_b}"
              payload: {}
              as: VendorOperator
              as_user_id: "${v_a}"
            - call: "GET /playback-metrics"
              payload: {}
              as: VendorOperator
              as_user_id: "${v_a}"
            - call: "GET /playback-metrics"
              payload: { vendor_id: "${v_b}" }
              as: VendorOperator
              as_user_id: "${v_a}"
            - call: "PATCH /cdn-vendors/${v_b}"
              payload: { cost_per_gb_usd: 0.0900 }
              as: VendorOperator
              as_user_id: "${v_a}"
            - call: "GET /cdn-vendors/${v_a}"
              payload: {}
              as: VendorOperator
              as_user_id: "${v_a}"
            - call: "GET /playback-metrics"
              payload: { vendor_id: "${v_a}" }
              as: VendorOperator
              as_user_id: "${v_a}"
            - call: "PATCH /cdn-vendors/${v_a}"
              payload: { cost_per_gb_usd: 0.0250 }
              as: VendorOperator
              as_user_id: "${v_a}"
          assert:
            - "cross-vendor read, unfiltered metric list, cross-vendor metric list and cross-vendor patch: all four return HTTP status 403 with error_id == ERR_VENDOR_SCOPE_VIOLATION"
            - "own vendor read: HTTP status == 200 and id == ${v_a} and reserved_gbps == 0.00"
            - "own metric list: HTTP status == 200 and total_count == 0"
            - "own patch: HTTP status == 200 and cost_per_gb_usd == 0.0250 and version == 2"
            - "CdnVendor.${v_b}.cost_per_gb_usd is still 0.0300 and version is still 1"

  # ===========================================================================
  # SECTION 8 — From Cross-Cutting Complexity Layers
  # complexity_layers: [optimistic_concurrency, cascading_side_effects,
  #                     dual_variant_calculation, selector_policy]
  # The claim-extraction guide has rows for the first three only; selector_policy
  # has no row, so it contributes no claim_type here (its behaviour is asserted
  # in section calculations via routing_* and entitlement_* instances instead).
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_title_version_on_ladder_create_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.ladder-create-stale-title
          - errors[ERR_STALE_TITLE_VERSION]
          - endpoints.POST_/encoding-ladders
        distinguishing_aspect: "The §1.2.1 rule ladder-create-stale-title compares expected_title_version against the live Title.version, so a version captured before a PATCH is rejected with 412 ERR_STALE_TITLE_VERSION and no ladder is created, while re-reading the Title and resubmitting succeeds and bumps the version again."
        test_recipe:
          setup:
            - "One Title at version 1 whose version is captured before an intervening metadata edit."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-OCC-LADDER", title_name: "OCC Ladder Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id, t_ver_old: $.data.version }
            - call: "PATCH /titles/${t_id}"
              payload: { title_name: "OCC Ladder Cut (edited)" }
              as: ContentOps
              captures: { t_ver_new: $.data.version }
          trigger:
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver_old}" }
              as: EncodingEngineer
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver_new}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
          assert:
            - "${t_ver_new} == ${t_ver_old} + 1"
            - "stale create: HTTP status == 412 and error_id == ERR_STALE_TITLE_VERSION"
            - "stale create: no EncodingLadder exists for Title ${t_id} and Title.${t_id}.version is still ${t_ver_new}"
            - "fresh create: HTTP status == 201 and EncodingLadder.${l_id}.state == DRAFT and rung_count == 2"
            - "fresh create: Title.${t_id}.version == ${t_ver_new} + 1 and packaging_state == UNPACKAGED"

      - name: stale_expected_title_version_on_reprocess_create_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.reprocess-create-stale-title
          - errors[ERR_STALE_TITLE_VERSION]
          - endpoints.POST_/reprocess-jobs
        distinguishing_aspect: "The second §1.2.1 rule guards reprocess creation on the same field: a version captured before the lock cascade (which itself bumps Title.version) is 412 ERR_STALE_TITLE_VERSION, and the 412 is returned even though the source ladder is perfectly LOCKED and the budget is ample."
        test_recipe:
          setup:
            - "One ACTIVE H264 DeviceProfile, one Title with a QC_PASSED asset, a version captured BEFORE the ladder is created, and a LOCKED ladder."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 40.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-OCC-JOB", title_name: "OCC Job Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id, t_ver_old: $.data.version }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/occjob.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver_old}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver_new: $.data.version }
          trigger:
            - call: "POST /reprocess-jobs"
              payload: { title_id: "${t_id}", source_ladder_id: "${l_id}", trigger_reason: "STANDARD_UPDATE", target_codec_family: "HEVC", expected_title_version: "${t_ver_old}" }
              as: EncodingEngineer
            - call: "POST /reprocess-jobs"
              payload: { title_id: "${t_id}", source_ladder_id: "${l_id}", trigger_reason: "STANDARD_UPDATE", target_codec_family: "HEVC", expected_title_version: "${t_ver_new}" }
              as: EncodingEngineer
              captures: { j_id: $.data.id }
          assert:
            - "${t_ver_new} is strictly greater than ${t_ver_old}"
            - "stale create: HTTP status == 412 and error_id == ERR_STALE_TITLE_VERSION"
            - "stale create: no ReprocessJob exists for Title ${t_id} and encode_budget_remaining_usd == 5000.00"
            - "fresh create: HTTP status == 201 and ReprocessJob.${j_id}.state == QUEUED and committed_usd == 0.00"
            - "fresh create: Title.${t_id}.version == ${t_ver_new} + 1"

      - name: version_increments_on_every_successful_write_and_never_on_a_rejected_one
        claim_type: optimistic_concurrency
        grounds:
          - entities.Title.fields.version
          - entities.CdnVendor.fields.version
          - endpoints.POST_/titles/{id}/takedown
        distinguishing_aspect: "Title.version advances by exactly one per successful write regardless of which endpoint wrote it — PATCH, ladder create and takedown each bump it — while CdnVendor.version advances independently on its own PATCH, and a rejected write bumps neither."
        test_recipe:
          setup:
            - "One Title at version 1 and one CdnVendor at version 1."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-VER-CHAIN", title_name: "Version Chain Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id, t_ver1: $.data.version }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "VERCDN", regions: ["US"], committed_gbps: 30.00, cost_per_gb_usd: 0.0200 }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v_ver1: $.data.version }
          trigger:
            - call: "PATCH /titles/${t_id}"
              payload: { studio_code: "LUMEN" }
              as: ContentOps
              captures: { t_ver2: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "AV1", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 900 }, { label: "1080p", height_px: 1080, bitrate_kbps: 3600 }], expected_title_version: "${t_ver2}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver3: $.data.version }
            - call: "POST /titles/${t_id}/takedown"
              payload: { takedown_reason: "MANUAL_LEGAL" }
              as: ContentOps
              captures: { t_ver4: $.data.version }
            - call: "PATCH /cdn-vendors/${v_id}"
              payload: { cost_per_gb_usd: 0.0400 }
              as: PlatformAdmin
              captures: { v_ver2: $.data.version }
          assert:
            - "${t_ver1} == 1 and ${t_ver2} == 2 and ${t_ver3} == 3 and ${t_ver4} == 4"
            - "${v_ver1} == 1 and ${v_ver2} == 2 (the two version counters are independent)"
            - "EncodingLadder.${l_id} has no version of its own bump from the takedown; its state is still DRAFT"
            - "Title.${t_id}.availability_state == TAKEN_DOWN and takedown_reason == MANUAL_LEGAL"
            - "CdnVendor.${v_id}.cost_per_gb_usd == 0.0400 and reserved_gbps == 0.00"

      - name: cascade_skips_a_revoked_package_when_the_ladder_is_superseded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.EncodingLadder.transitions.lock
          - state_machines.DrmPackage.transitions
          - entities.Title.fields.packaging_state
        distinguishing_aspect: "Hop 3 of the lock cascade is conditional on the child's state: of two packages bound to the superseded ladder, only the PACKAGED one becomes STALE while the REVOKED one is untouched with stale_reason NONE — yet Title.packaging_state still becomes STALE because one STALE package now exists."
        test_recipe:
          setup:
            - "One ACTIVE H264 DeviceProfile, one Title with a QC_PASSED asset, a first LOCKED ladder carrying two PACKAGED packages of which one is then REVOKED, and a second VALIDATED ladder of the same codec family ready to lock."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 40.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-PARTIAL-CASCADE", title_name: "Partial Cascade Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/partial.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver1: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver1}" }
              as: EncodingEngineer
              captures: { l_one: $.data.id }
            - call: "POST /encoding-ladders/${l_one}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_one}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_one}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/wv" }
              as: DrmOperator
              captures: { pk_keep: $.data.id }
            - call: "POST /drm-packages/${pk_keep}/package"
              payload: {}
              as: DrmOperator
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_one}", drm_systems: ["PLAYREADY"], license_server_url: "https://lic.novapic.example/pr" }
              as: DrmOperator
              captures: { pk_gone: $.data.id }
            - call: "POST /drm-packages/${pk_gone}/package"
              payload: {}
              as: DrmOperator
            - call: "POST /drm-packages/${pk_gone}/revoke"
              payload: {}
              as: DrmOperator
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver2: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1500 }, { label: "720p", height_px: 720, bitrate_kbps: 3000 }], expected_title_version: "${t_ver2}" }
              as: EncodingEngineer
              captures: { l_two: $.data.id }
            - call: "POST /encoding-ladders/${l_two}/validate"
              payload: {}
              as: EncodingEngineer
          trigger:
            - call: "POST /encoding-ladders/${l_two}/lock"
              payload: {}
              as: EncodingEngineer
          assert:
            - "before the trigger: DrmPackage.${pk_keep}.state == PACKAGED and DrmPackage.${pk_gone}.state == REVOKED and Title.${t_id}.packaging_state == PACKAGED"
            - "HTTP status == 200 and EncodingLadder.${l_two}.state == LOCKED"
            - "EncodingLadder.${l_one}.state == SUPERSEDED with superseded_by_ladder_id == ${l_two}"
            - "DrmPackage.${pk_keep}.state == STALE with stale_reason == LADDER_SUPERSEDED"
            - "DrmPackage.${pk_gone}.state is still REVOKED with stale_reason == NONE"
            - "Title.${t_id}.packaging_state == STALE and availability_state is still DRAFT (hop 5 is a no-op on an unpublished Title)"
            - "Title.${t_id}.locked_ladder_count == 2"

      - name: five_hop_lock_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.EncodingLadder.transitions.lock
        excluded_because:
          difficulty_instance: "transitive_cascade / ladder_lock_supersede_chain"
          rationale: "That instance walks all five hops of the lock cascade on a PUBLISHED Title, including the takedown with PACKAGING_STALE and the window closure; the corner variant above only adds the conditional-child case."

      - name: three_hop_metric_breach_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/playback-metrics
        excluded_because:
          difficulty_instance: "transitive_cascade / metric_breach_resteer_chain"
          rationale: "The metric-ingest chain (window breach -> vendor health and state -> automatic policy resteer -> egress recompute) is asserted hop by hop there."

      - name: title_readiness_variant_divergence
        claim_type: dual_variant_calculation
        grounds:
          - calculations.title_readiness_score.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / title_readiness_provisional_vs_certified"
          rationale: "Both readiness variants are computed on identical data there, with the delta and the publish-gate consequence asserted."

      - name: vendor_health_variant_divergence
        claim_type: dual_variant_calculation
        grounds:
          - calculations.vendor_health_score.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / vendor_health_rolling_vs_contract"
          rationale: "The rolling-mean and attempt-weighted variants are asserted there over the same metric rows, including the routing-eligibility consequence."

  # ===========================================================================
  # SECTION 9 — From Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: lock_cascade_is_visible_in_the_same_response_and_the_next_read
        claim_type: immediate
        grounds:
          - consistency_model
          - state_machines.EncodingLadder.transitions.lock
          - entities.Title.fields.packaging_state
        distinguishing_aspect: "Nothing about the cascade is deferred: the lock response itself already reports LOCKED, and the very next reads — with no sweep, no second write and no delay — show the superseded ladder, the STALE package and the Title's STALE packaging_state."
        test_recipe:
          setup:
            - "One ACTIVE H264 DeviceProfile, one Title with a QC_PASSED asset, a LOCKED ladder carrying one PACKAGED package, and a second VALIDATED ladder of the same codec family."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 40.00, quality_normalization_factor: 0.90 }
