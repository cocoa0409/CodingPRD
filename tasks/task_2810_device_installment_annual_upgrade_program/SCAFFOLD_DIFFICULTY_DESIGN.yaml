  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: model_reservation_capacity_over_overlapping_fulfillment_windows
        grounds:
          - calculations.model_reservation_capacity
          - validations.priority_90_ERR_MODEL_CAPACITY_EXHAUSTED
          - entities.DeviceModel.fields.concurrent_reservation_capacity
          - entities.DeviceModel.fields.reserved_slot_count
          - entities.UpgradeRequest.fields.fulfillment_window_end
        distinguishing_aspect: |
          Interval semantics: AGGREGATE CAPACITY with half-open adjacency, on the DeviceModel
          resource. The seven-day fulfillment windows are compared as
          [start, start + 7 days), and the capacity of 1 is measured against the count of live
          requests whose window intersects the candidate — so a candidate starting 2027-07-03
          collides with the incumbent [2027-06-27, 2027-07-04) and is refused, while a
          candidate starting exactly 2027-07-04 merely touches its end and must be admitted.
          The closed-interval implementation (start <= x.end) rejects the touching window; a
          naive same-day-only check admits the 07-03 collision. The second acceptance also
          proves reserved_slot_count counts live reservations (2) rather than the overlap
          population of any one candidate (1).
        test_recipe:
          setup:
            - "Handset A published with concurrent_reservation_capacity 1; Handset B is the financed model for both customers."
            - "Customer A and Customer B each hold an ACTIVE Handset B loan originated 2026-08-01 with an ACTIVATED handset and 12 installments PAID (PAYMENT 56940), so both are eligible from 2027-06-27."
            - "Clock at 2027-06-27; Customer A already holds the single ELIGIBILITY_PASSED reservation on Handset A for [2027-06-27, 2027-07-04)."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
