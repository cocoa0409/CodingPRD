            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_gc}", raw_description: "contractor", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: { q1: "yes", q2: "yes" } }
              as: Policyholder
              as_user_id: "${ba_gc}"
              captures: { q_gc: $.data.id }
            - call: "GET /ins/quotes/${q_gc}/referral"
              payload: {}
              as: Underwriter
              captures: { ref_gc: $.data.0.id }
            - call: "POST /ins/referrals/${ref_gc}/approve"
              payload: {}
              as: Underwriter
              as_user_id: uw-1
            - call: "GET /ins/quotes/${q_gc}"
              payload: {}
              as: Underwriter
              captures: { q_gc_v: $.data.version }
          trigger:
            - call: "POST /ins/quotes/${q_gc}/bind"
              payload: { expected_quote_version: "${q_gc_v}" }
