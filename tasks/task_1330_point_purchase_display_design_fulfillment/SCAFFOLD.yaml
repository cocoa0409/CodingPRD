scenario: |
  Point-of-Purchase Display Design & Fulfillment (POP display house): creative & structural design approval, retailer compliance (size/material) rules, production run vs store count with overage, kitting & individual store shipment, in-store assembly instruction & field help, ship window & retailer receiving appointment, damage/replacement, program recap & ROI

domain_name: "pop-display-fulfillment"
api_prefix: "/pop"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        required: true
        description: "Brand / CPG company name"
      - name: contact_email
        type: string
        source: input
        required: true
        description: "Primary contact email"
      - name: status
        type: enum
        source: system
        description: "Lifecycle: ACTIVE, SUSPENDED"
        constraints: "enum: ACTIVE | SUSPENDED; default ACTIVE"

  - name: RetailerProgram
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        required: true
        description: "FK -> Client.id"
      - name: retailer_name
        type: string
        source: input
        required: true
        description: "Retail chain this program ships into"
      - name: program_name
        type: string
        source: input
        required: true
        description: "Marketing program name"
      - name: store_count
        type: integer
        source: input
        required: true
        description: "Number of stores receiving displays; must be >= 1"
      - name: program_revenue_cents
        type: integer
        source: input
        required: true
        description: "Contracted program revenue in cents; >= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle: DRAFT, DESIGN, PRODUCTION, FULFILLMENT, CLOSED, CANCELLED"
        constraints: "enum: DRAFT | DESIGN | PRODUCTION | FULFILLMENT | CLOSED | CANCELLED; default DRAFT"

  - name: ComplianceRule
    parent: RetailerProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        required: true
        description: "FK -> RetailerProgram.id"
      - name: dimension
        type: enum
        source: input
        required: true
        description: "Rule dimension"
        constraints: "enum: MAX_WIDTH_IN | MAX_HEIGHT_IN | MAX_DEPTH_IN | ALLOWED_MATERIAL | MAX_WEIGHT_LB"
      - name: limit_value
        type: string
        source: input
        required: true
        description: "Numeric limit (for MAX_*) or material token (for ALLOWED_MATERIAL)"
      - name: active
        type: boolean
        source: input
        description: "Whether the rule is enforced"
        default: true

  - name: DisplayDesign
    parent: RetailerProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        required: true
        description: "FK -> RetailerProgram.id"
      - name: design_code
        type: string
        source: input
        required: true
        description: "Human-readable design code, unique per program"
      - name: width_in
        type: number
        source: input
        required: true
        description: "Display width in inches; > 0"
      - name: height_in
        type: number
        source: input
        required: true
        description: "Display height in inches; > 0"
      - name: depth_in
        type: number
        source: input
        required: true
        description: "Display depth in inches; > 0"
      - name: weight_lb
        type: number
        source: input
        required: true
        description: "Unit weight in pounds; > 0"
      - name: material
        type: string
        source: input
        required: true
        description: "Primary structural material token (e.g. CORRUGATE, ACRYLIC, METAL)"
      - name: revision_number
        type: integer
        source: system
        description: "Starts at 1; increments on each REVISE loop"
      - name: compliance_result
        type: enum
        source: computed
        description: "PASS | FAIL recomputed whenever design dims/material or active rules change"
        constraints: "enum: PASS | FAIL"
      - name: status
        type: enum
        source: system
        description: "DRAFT, SUBMITTED, COMPLIANCE_REVIEW, APPROVED, REJECTED, LOCKED"
        constraints: "enum: DRAFT | SUBMITTED | COMPLIANCE_REVIEW | APPROVED | REJECTED | LOCKED; default DRAFT"

  - name: ProductionRun
    parent: RetailerProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        required: true
        description: "FK -> RetailerProgram.id"
      - name: design_id
        type: string
        source: input
        required: true
        description: "FK -> DisplayDesign.id; must reference an APPROVED design"
      - name: overage_pct
        type: number
        source: input
        required: true
        description: "Overage percentage applied over store_count; >= 0"
      - name: production_quantity
        type: integer
        source: computed
        description: "ceil(store_count * (1 + overage_pct/100)) at AUTHORIZE time"
      - name: unit_cost_cents
        type: integer
        source: computed
        description: "Tiered unit cost from production_quantity at AUTHORIZE time"
      - name: total_cost_cents
        type: integer
        source: computed
        description: "production_quantity * unit_cost_cents"
      - name: status
        type: enum
        source: system
        description: "PLANNED, AUTHORIZED, PRODUCED, CANCELLED"
        constraints: "enum: PLANNED | AUTHORIZED | PRODUCED | CANCELLED; default PLANNED"

  - name: Store
    parent: RetailerProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        required: true
        description: "FK -> RetailerProgram.id"
      - name: store_number
        type: string
        source: input
        required: true
        description: "Retailer store identifier, unique per program"
      - name: address
        type: string
        source: input
        required: true
        description: "Ship-to address"

  - name: Kit
    parent: ProductionRun
    common_fields: true
    fields:
      - name: production_run_id
        type: string
        source: input
        required: true
        description: "FK -> ProductionRun.id"
      - name: store_id
        type: string
        source: input
        required: true
        description: "FK -> Store.id; one kit per store per run"
      - name: status
        type: enum
        source: system
        description: "PENDING, KITTED, SHIPPED, DELIVERED, DAMAGED"
        constraints: "enum: PENDING | KITTED | SHIPPED | DELIVERED | DAMAGED; default PENDING"

  - name: Shipment
    parent: Kit
    common_fields: true
    fields:
      - name: kit_id
        type: string
        source: input
        required: true
        description: "FK -> Kit.id"
      - name: ship_window_start
        type: datetime
        source: input
        required: true
        description: "Retailer-mandated ship window open (ISO8601 UTC)"
      - name: ship_window_end
        type: datetime
        source: input
        required: true
        description: "Retailer-mandated ship window close (ISO8601 UTC); must be > ship_window_start"
      - name: appointment_at
        type: datetime
        source: input
        description: "Receiving appointment at retailer DC; must fall within [ship_window_start, ship_window_end]"
      - name: shipped_at
        type: datetime
        source: system
        description: "Set when shipment transitions to SHIPPED"
      - name: delivered_at
        type: datetime
        source: system
        description: "Set when shipment transitions to DELIVERED"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED, APPOINTMENT_SET, SHIPPED, DELIVERED, FAILED"
        constraints: "enum: SCHEDULED | APPOINTMENT_SET | SHIPPED | DELIVERED | FAILED; default SCHEDULED"

  - name: DamageClaim
    parent: Kit
    common_fields: true
    fields:
      - name: kit_id
        type: string
        source: input
        required: true
        description: "FK -> Kit.id; kit must be SHIPPED or DELIVERED"
      - name: reported_by
        type: string
        source: input
        required: true
        description: "Free-text reporter name"
      - name: replacement_quantity
        type: integer
        source: input
        required: true
        description: "Number of replacement units; >= 1"
      - name: replacement_cost_cents
        type: integer
        source: computed
        description: "replacement_quantity * parent ProductionRun.unit_cost_cents at approval"
      - name: status
        type: enum
        source: system
        description: "REPORTED, APPROVED, REJECTED, FULFILLED"
        constraints: "enum: REPORTED | APPROVED | REJECTED | FULFILLED; default REPORTED"

  - name: FieldServiceRequest
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        required: true
        description: "FK -> Store.id"
      - name: program_id
        type: string
        source: input
        required: true
        description: "FK -> RetailerProgram.id; cross-aggregate reference for program-level reporting"
      - name: issue_type
        type: enum
        source: input
        required: true
        description: "Kind of field help needed"
        constraints: "enum: ASSEMBLY_HELP | MISSING_PARTS | INSTRUCTION_CLARIFICATION"
      - name: status
        type: enum
        source: system
        description: "OPEN, DISPATCHED, RESOLVED"
        constraints: "enum: OPEN | DISPATCHED | RESOLVED; default OPEN"

  - name: ProgramRecap
    parent: RetailerProgram
    common_fields: false
    fields:
      - name: program_id
        type: string
        source: system
        required: true
        description: "FK -> RetailerProgram.id; one recap per program, minted at CLOSE"
      - name: total_produced
        type: integer
        source: computed
        description: "Sum of production_quantity over runs in PRODUCED status"
      - name: total_delivered
        type: integer
        source: computed
        description: "Count of Shipments in DELIVERED status for this program"
      - name: total_damaged
        type: integer
        source: computed
        description: "Count of DamageClaims in FULFILLED status for this program"
      - name: total_cost_cents
        type: integer
        source: computed
        description: "Final-variant cost: sum over runs (total_cost_cents) + sum over approved damage claims (replacement_cost_cents)"
      - name: roi_pct_provisional
        type: number
        source: computed
        description: "ROI using committed costs only (runs in PRODUCED + claims in FULFILLED) computed at first PRODUCED run"
      - name: roi_pct_final
        type: number
        source: computed
        description: "ROI using final actuals at program CLOSE"
      - name: generated_at
        type: datetime
        source: system
        description: "When the recap was generated"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RetailerProgram
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DESIGN
        trigger: "POST /pop/programs/{id}/start-design"
        actor: ProgramManager
        preconditions:
          - "program.status == DRAFT"
          - "at least one active ComplianceRule exists for the program"
        side_effects:
          - "program.version += 1"
      - from: DESIGN
        to: PRODUCTION
        trigger: "POST /pop/programs/{id}/authorize-production"
        actor: ProgramManager
        preconditions:
          - "program.status == DESIGN"
          - "at least one DisplayDesign with status == APPROVED exists for the program"
        side_effects:
          - "program.version += 1"
      - from: PRODUCTION
        to: FULFILLMENT
        trigger: "POST /pop/programs/{id}/start-fulfillment"
        actor: ProgramManager
        preconditions:
          - "program.status == PRODUCTION"
          - "at least one ProductionRun with status == PRODUCED exists for the program"
        side_effects:
          - "program.version += 1"
      - from: FULFILLMENT
        to: CLOSED
        trigger: "POST /pop/programs/{id}/close"
        actor: ProgramManager
        preconditions:
          - "program.status == FULFILLMENT"
          - "every Kit for the program is in a terminal state (DELIVERED or DAMAGED)"
        side_effects:
          - "create ProgramRecap with computed totals and both ROI variants"
          - "program.version += 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /pop/programs/{id}/cancel"
        actor: ProgramManager
        preconditions:
          - "program.status IN {DRAFT, DESIGN}"
        side_effects:
          - "all non-terminal DisplayDesigns -> REJECTED"
          - "program.version += 1"
      - from: DESIGN
        to: CANCELLED
        trigger: "POST /pop/programs/{id}/cancel"
        actor: ProgramManager
        preconditions:
          - "program.status IN {DRAFT, DESIGN}"
        side_effects:
          - "all non-terminal DisplayDesigns -> REJECTED"
          - "program.version += 1"

  - entity: DisplayDesign
    initial_state: DRAFT
    terminal_states: [LOCKED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pop/designs/{id}/submit"
        actor: Designer
        preconditions:
          - "design.status == DRAFT"
          - "parent program.status == DESIGN"
        side_effects:
          - "recompute compliance_result from active ComplianceRules"
          - "design.version += 1"
      - from: SUBMITTED
        to: COMPLIANCE_REVIEW
        trigger: "POST /pop/designs/{id}/begin-review"
        actor: ComplianceOfficer
        preconditions:
          - "design.status == SUBMITTED"
        side_effects:
          - "design.version += 1"
      - from: COMPLIANCE_REVIEW
        to: APPROVED
        trigger: "POST /pop/designs/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "design.status == COMPLIANCE_REVIEW"
          - "design.compliance_result == PASS"
        side_effects:
          - "design.version += 1"
      - from: COMPLIANCE_REVIEW
        to: REJECTED
        trigger: "POST /pop/designs/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "design.status == COMPLIANCE_REVIEW"
        side_effects:
          - "design.version += 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /pop/designs/{id}/revise"
        actor: Designer
        preconditions:
          - "design.status == REJECTED"
          - "parent program.status == DESIGN"
        side_effects:
          - "design.revision_number += 1"
          - "design.version += 1"
        note: "Revision loop REJECTED -> DRAFT makes this machine cyclic"
      - from: APPROVED
        to: LOCKED
        trigger: "POST /pop/designs/{id}/lock"
        actor: ProgramManager
        preconditions:
          - "design.status == APPROVED"
          - "at least one ProductionRun references this design"
        side_effects:
          - "design.version += 1"

  - entity: ProductionRun
    initial_state: PLANNED
    terminal_states: [PRODUCED, CANCELLED]
    transitions:
      - from: PLANNED
        to: AUTHORIZED
        trigger: "POST /pop/production-runs/{id}/authorize"
        actor: ProductionPlanner
        preconditions:
          - "run.status == PLANNED"
          - "parent program.status == PRODUCTION"
          - "referenced design.status == APPROVED"
        side_effects:
          - "compute production_quantity = ceil(program.store_count * (1 + overage_pct/100))"
          - "compute unit_cost_cents from tiered rate table over production_quantity"
          - "compute total_cost_cents = production_quantity * unit_cost_cents"
          - "run.version += 1"
      - from: AUTHORIZED
        to: PRODUCED
        trigger: "POST /pop/production-runs/{id}/mark-produced"
        actor: ProductionPlanner
        preconditions:
          - "run.status == AUTHORIZED"
        side_effects:
          - "create one Kit (status=PENDING) per Store of the parent program"
          - "run.version += 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /pop/production-runs/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "run.status == PLANNED"
        side_effects:
          - "run.version += 1"

  - entity: Kit
    initial_state: PENDING
    terminal_states: [DELIVERED, DAMAGED]
    transitions:
      - from: PENDING
        to: KITTED
        trigger: "POST /pop/kits/{id}/mark-kitted"
        actor: WarehouseOperator
        preconditions:
          - "kit.status == PENDING"
          - "parent run.status == PRODUCED"
        side_effects:
          - "kit.version += 1"
      - from: KITTED
        to: SHIPPED
        trigger: "POST /pop/shipments/{shipment_id}/ship (cascade)"
        actor: LogisticsCoordinator
        preconditions:
          - "kit.status == KITTED"
        side_effects:
          - "kit.version += 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /pop/shipments/{shipment_id}/deliver (cascade)"
        actor: LogisticsCoordinator
        preconditions:
          - "kit.status == SHIPPED"
        side_effects:
          - "kit.version += 1"
      - from: SHIPPED
        to: DAMAGED
        trigger: "POST /pop/damage-claims/{id}/approve (cascade when claim is full-loss)"
        actor: ClaimsAdjuster
        preconditions:
          - "kit.status == SHIPPED"
        side_effects:
          - "kit.version += 1"

  - entity: Shipment
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, FAILED]
    transitions:
      - from: SCHEDULED
        to: APPOINTMENT_SET
        trigger: "POST /pop/shipments/{id}/set-appointment"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.status == SCHEDULED"
          - "appointment_at within [ship_window_start, ship_window_end]"
        side_effects:
          - "shipment.version += 1"
      - from: APPOINTMENT_SET
        to: SHIPPED
        trigger: "POST /pop/shipments/{id}/ship"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.status == APPOINTMENT_SET"
          - "parent kit.status == KITTED"
          - "current logical time >= ship_window_start"
        side_effects:
          - "set shipped_at"
          - "parent kit.status -> SHIPPED (cascade up)"
          - "shipment.version += 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /pop/shipments/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.status == SHIPPED"
          - "current logical time <= ship_window_end + 7 days grace"
        side_effects:
          - "set delivered_at"
          - "parent kit.status -> DELIVERED (cascade up)"
          - "shipment.version += 1"
      - from: SHIPPED
        to: FAILED
        trigger: "POST /pop/shipments/{id}/fail"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.status == SHIPPED"
        side_effects:
          - "shipment.version += 1"

  - entity: DamageClaim
    initial_state: REPORTED
    terminal_states: [FULFILLED, REJECTED]
    transitions:
      - from: REPORTED
        to: APPROVED
        trigger: "POST /pop/damage-claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == REPORTED"
          - "parent kit.status IN {SHIPPED, DELIVERED}"
        side_effects:
          - "compute replacement_cost_cents = replacement_quantity * run.unit_cost_cents"
          - "if kit.status == SHIPPED then kit.status -> DAMAGED (cascade)"
          - "claim.version += 1"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /pop/damage-claims/{id}/reject"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == REPORTED"
        side_effects:
          - "claim.version += 1"
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /pop/damage-claims/{id}/fulfill"
        actor: WarehouseOperator
        preconditions:
          - "claim.status == APPROVED"
        side_effects:
          - "claim.version += 1"

  - entity: FieldServiceRequest
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /pop/field-service-requests/{id}/dispatch"
        actor: FieldServiceManager
        preconditions:
          - "fsr.status == OPEN"
        side_effects:
          - "fsr.version += 1"
      - from: DISPATCHED
        to: RESOLVED
        trigger: "POST /pop/field-service-requests/{id}/resolve"
        actor: FieldServiceManager
        preconditions:
          - "fsr.status == DISPATCHED"
        side_effects:
          - "fsr.version += 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: program-authorize-stale-version
    parent_entity: RetailerProgram
    write_endpoint: "POST /pop/production-runs"
    occ_field: "expected_program_version"
    description: |
      Creating a ProductionRun against a RetailerProgram whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. Captures the case where another writer has just
      transitioned the program (e.g. DESIGN -> PRODUCTION) and this writer's
      view of the program is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: design-approve-stale-version
    parent_entity: DisplayDesign
    write_endpoint: "POST /pop/designs/{id}/approve"
    occ_field: "expected_design_version"
    description: |
      Approving a DisplayDesign whose version has advanced since the client
      last observed it (e.g. a revise loop bumped revision_number and version)
      is rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: production_quantity_rule
    description: "Units to produce for a run: store_count scaled by overage, rounded up"
    trigger: "ProductionRun PLANNED -> AUTHORIZED"
    inputs: ["RetailerProgram.store_count", "ProductionRun.overage_pct"]
    algorithm: forward_looking
    formula: |
      production_quantity = ceil(store_count * (1 + overage_pct / 100))
    constants:
      ROUNDING: ceiling
    precision: "integer, ceiling"
    input_set: "single ProductionRun in PLANNED + its parent RetailerProgram"

  - name: unit_cost_tiered
    description: "Tiered unit cost (average-rate-on-whole-quantity, NOT marginal)"
    trigger: "ProductionRun PLANNED -> AUTHORIZED (after production_quantity_rule)"
    inputs: ["ProductionRun.production_quantity"]
    algorithm: tiered_pricing
    formula: |
      if production_quantity < 100:
          unit_cost_cents = 2500
      elif production_quantity < 500:
          unit_cost_cents = 2200
      else:
          unit_cost_cents = 1950
      total_cost_cents = production_quantity * unit_cost_cents
    constants:
      TIER1_MAX: 100
      TIER1_RATE_CENTS: 2500
      TIER2_MAX: 500
      TIER2_RATE_CENTS: 2200
      TIER3_RATE_CENTS: 1950
    precision: "integer cents"
    input_set: "single ProductionRun after production_quantity computed"
    variants:
      - name: average_rate_on_whole_quantity
        when: "default"
        difference: "entire production_quantity billed at the single applicable tier rate (not marginal split across tiers)"

  - name: program_roi
    description: "Program ROI in percent; dual variant (provisional vs final)"
    trigger: "roi_pct_provisional at first ProductionRun -> PRODUCED; roi_pct_final at RetailerProgram FULFILLMENT -> CLOSED"
    inputs:
      - "RetailerProgram.program_revenue_cents"
      - "ProductionRun.total_cost_cents"
      - "DamageClaim.replacement_cost_cents"
    algorithm: aggregation
    formula: |
      provisional_cost = sum(run.total_cost_cents for runs where status == PRODUCED)
      roi_pct_provisional = round_half_up((program_revenue_cents - provisional_cost) / provisional_cost * 100, 2)

      final_cost = sum(run.total_cost_cents for runs where status == PRODUCED)
                 + sum(claim.replacement_cost_cents for claims where status == FULFILLED)
      roi_pct_final = round_half_up((program_revenue_cents - final_cost) / final_cost * 100, 2)
    constants: {}
    precision: "2 decimal places, round_half_up"
    input_set: "runs filtered status==PRODUCED; claims filtered status==FULFILLED"
    variants:
      - name: provisional
        when: "first run reaches PRODUCED"
        difference: "uses committed production cost only, excludes damage replacement actuals"
      - name: final
        when: "program CLOSED"
        difference: "uses production cost plus approved-and-fulfilled damage replacement costs"

  - name: kit_component_rounding
    description: "Per-component rounding order for kit cost rollups (round-per-line then sum)"
    trigger: "on demand when a kit's component cost is rolled up"
    inputs: ["component unit prices"]
    algorithm: aggregation
    formula: |
      total = sum(round_half_up(component_price, 2) for each component)
      # NOT round(sum(...)); per-line rounding first, then sum — order is pinned
    constants: {}
    precision: "2 decimal places per line, round_half_up, then integer-sum of cents"
    input_set: "all components of one kit"

  - name: ship_window_appointment_fit
    description: "Appointment must fall inside the ship window; deliver has a 7-day grace after window end"
    trigger: "Shipment SCHEDULED -> APPOINTMENT_SET and SHIPPED -> DELIVERED"
    inputs: ["ship_window_start", "ship_window_end", "appointment_at", "current logical time"]
    algorithm: threshold
    formula: |
      appointment_valid = ship_window_start <= appointment_at <= ship_window_end
      deliver_valid = current_time <= ship_window_end + 7 days
    constants:
      DELIVERY_GRACE_DAYS: 7
    precision: "ISO8601 timestamps, inclusive bounds"
    input_set: "single Shipment"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resource exists (left-to-right: program, design, run, kit, shipment, claim, fsr)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Compliance gating: DisplayDesign.compliance_result == PASS before approve; program has >=1 active ComplianceRule before start-design"
    error_id: ERR_COMPLIANCE_FAILED
    http_status: 422
    applies_to: ["POST /pop/designs/{id}/approve", "POST /pop/programs/{id}/start-design"]
  - priority: 6
    category: business_constraint
    check: "Uniqueness: design_code unique per program; store_number unique per program; one Kit per (run, store)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: ["POST /pop/designs", "POST /pop/stores", "POST /pop/kits"]
  - priority: 7
    category: business_temporal
    check: "Temporal: appointment_at within [ship_window_start, ship_window_end]; ship before ship_window_start rejected; deliver after ship_window_end + 7d rejected"
    error_id: ERR_WINDOW_VIOLATION
    http_status: 422
    applies_to: ["POST /pop/shipments/{id}/set-appointment", "POST /pop/shipments/{id}/ship", "POST /pop/shipments/{id}/deliver"]
  - priority: 8
    category: business_referential
    check: "Cross-entity references: run.design_id -> APPROVED design; claim.kit_id -> SHIPPED/DELIVERED kit; fsr.program_id matches store's program"
    error_id: ERR_REFERENTIAL
    http_status: 422
    applies_to: ["POST /pop/production-runs", "POST /pop/damage-claims", "POST /pop/field-service-requests"]
  - priority: 9
    category: business_fiscal
    check: "Fiscal: overage_pct >= 0; program_revenue_cents >= 0; replacement_quantity >= 1; store_count >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create endpoints"
  - priority: 10
    category: state
    check: "OCC: expected_<parent>_version matches current parent version on concurrency-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /pop/production-runs", "POST /pop/designs/{id}/approve"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/pop/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: []

  # --- Client ---
  - method: POST
    path: "/pop/clients"
    description: "Create a client (brand/CPG)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, contact_email]
    output: Client
    side_effects: []
  - method: GET
    path: "/pop/clients/{id}"
    description: "Get one client"
    roles: [PlatformAdmin, ProgramManager, Designer, ComplianceOfficer, ProductionPlanner, WarehouseOperator, LogisticsCoordinator, ClaimsAdjuster, FieldServiceManager]
    code: 200
    input: []
    output: Client
    side_effects: []

  # --- RetailerProgram ---
  - method: POST
    path: "/pop/programs"
    description: "Create a retailer program under a client"
    roles: [ProgramManager]
    code: 201
    input: [client_id, retailer_name, program_name, store_count, program_revenue_cents]
    output: RetailerProgram
    side_effects: []
  - method: GET
    path: "/pop/programs/{id}"
    description: "Get one program"
    roles: [PlatformAdmin, ProgramManager, Designer, ComplianceOfficer, ProductionPlanner, WarehouseOperator, LogisticsCoordinator, ClaimsAdjuster, FieldServiceManager]
    code: 200
    input: []
    output: RetailerProgram
    side_effects: []
  - method: GET
    path: "/pop/clients/{id}/programs"
    description: "List programs for a client (reverse reachability for RetailerProgram.client_id)"
    roles: [PlatformAdmin, ProgramManager]
    code: 200
    input: []
    output: RetailerProgram[]
    side_effects: []
  - method: POST
    path: "/pop/programs/{id}/start-design"
    description: "Program DRAFT -> DESIGN"
    roles: [ProgramManager]
    code: 200
    input: []
    output: RetailerProgram
    side_effects: ["program.version += 1"]
  - method: POST
    path: "/pop/programs/{id}/authorize-production"
    description: "Program DESIGN -> PRODUCTION"
    roles: [ProgramManager]
    code: 200
    input: []
    output: RetailerProgram
    side_effects: ["program.version += 1"]
  - method: POST
    path: "/pop/programs/{id}/start-fulfillment"
    description: "Program PRODUCTION -> FULFILLMENT"
    roles: [ProgramManager]
    code: 200
    input: []
    output: RetailerProgram
    side_effects: ["program.version += 1"]
  - method: POST
    path: "/pop/programs/{id}/close"
    description: "Program FULFILLMENT -> CLOSED; mints ProgramRecap"
    roles: [ProgramManager]
    code: 200
    input: []
    output: RetailerProgram
    side_effects: ["create ProgramRecap", "program.version += 1"]
  - method: POST
    path: "/pop/programs/{id}/cancel"
    description: "Program DRAFT|DESIGN -> CANCELLED; cascades REJECTED to non-terminal designs"
    roles: [ProgramManager]
    code: 200
    input: []
    output: RetailerProgram
    side_effects: ["non-terminal DisplayDesigns -> REJECTED", "program.version += 1"]

  # --- ComplianceRule ---
  - method: POST
    path: "/pop/programs/{id}/compliance-rules"
    description: "Add a compliance rule to a program"
    roles: [ComplianceOfficer]
    code: 201
    input: [program_id, dimension, limit_value, "active?"]
    output: ComplianceRule
    side_effects: ["recompute compliance_result on all non-terminal designs in program"]
  - method: GET
    path: "/pop/programs/{id}/compliance-rules"
    description: "List compliance rules for a program (reverse reachability for ComplianceRule.program_id)"
    roles: [PlatformAdmin, ProgramManager, ComplianceOfficer, Designer]
    code: 200
    input: []
    output: ComplianceRule[]
    side_effects: []

  # --- DisplayDesign ---
  - method: POST
    path: "/pop/designs"
    description: "Create a design in a program"
    roles: [Designer]
    code: 201
    input: [program_id, design_code, width_in, height_in, depth_in, weight_lb, material]
    output: DisplayDesign
    side_effects: []
  - method: GET
    path: "/pop/designs/{id}"
    description: "Get one design"
    roles: [PlatformAdmin, ProgramManager, Designer, ComplianceOfficer, ProductionPlanner]
    code: 200
    input: []
    output: DisplayDesign
    side_effects: []
  - method: GET
    path: "/pop/programs/{id}/designs"
    description: "List designs for a program (reverse reachability for DisplayDesign.program_id)"
    roles: [PlatformAdmin, ProgramManager, Designer, ComplianceOfficer, ProductionPlanner]
    code: 200
    input: []
    output: DisplayDesign[]
    side_effects: []
  - method: POST
    path: "/pop/designs/{id}/submit"
    description: "Design DRAFT -> SUBMITTED; recompute compliance_result"
    roles: [Designer]
    code: 200
    input: []
    output: DisplayDesign
    side_effects: ["recompute compliance_result", "design.version += 1"]
  - method: POST
    path: "/pop/designs/{id}/begin-review"
    description: "Design SUBMITTED -> COMPLIANCE_REVIEW"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DisplayDesign
    side_effects: ["design.version += 1"]
  - method: POST
    path: "/pop/designs/{id}/approve"
    description: "Design COMPLIANCE_REVIEW -> APPROVED (OCC-guarded)"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_design_version]
    output: DisplayDesign
    side_effects: ["design.version += 1"]
  - method: POST
    path: "/pop/designs/{id}/reject"
    description: "Design COMPLIANCE_REVIEW -> REJECTED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DisplayDesign
    side_effects: ["design.version += 1"]
  - method: POST
    path: "/pop/designs/{id}/revise"
    description: "Design REJECTED -> DRAFT (revision loop); revision_number += 1"
    roles: [Designer]
    code: 200
    input: []
    output: DisplayDesign
    side_effects: ["revision_number += 1", "design.version += 1"]
  - method: POST
    path: "/pop/designs/{id}/lock"
    description: "Design APPROVED -> LOCKED once a production run references it"
    roles: [ProgramManager]
    code: 200
    input: []
    output: DisplayDesign
    side_effects: ["design.version += 1"]

  # --- ProductionRun ---
  - method: POST
    path: "/pop/production-runs"
    description: "Create a production run (OCC-guarded on parent program version)"
    roles: [ProductionPlanner]
    code: 201
    input: [program_id, design_id, overage_pct, expected_program_version]
    output: ProductionRun
    side_effects: ["program.version += 1"]
  - method: GET
    path: "/pop/production-runs/{id}"
    description: "Get one production run"
    roles: [PlatformAdmin, ProgramManager, ProductionPlanner, WarehouseOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: GET
    path: "/pop/programs/{id}/production-runs"
    description: "List runs for a program (reverse reachability for ProductionRun.program_id)"
    roles: [PlatformAdmin, ProgramManager, ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun[]
    side_effects: []
  - method: GET
    path: "/pop/designs/{id}/production-runs"
    description: "List runs referencing a design (reverse reachability for ProductionRun.design_id)"
    roles: [PlatformAdmin, ProgramManager, ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun[]
    side_effects: []
  - method: POST
    path: "/pop/production-runs/{id}/authorize"
    description: "Run PLANNED -> AUTHORIZED; computes production_quantity, unit_cost_cents, total_cost_cents"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["compute production_quantity", "compute unit_cost_cents", "compute total_cost_cents", "run.version += 1"]
  - method: POST
    path: "/pop/production-runs/{id}/mark-produced"
    description: "Run AUTHORIZED -> PRODUCED; creates one Kit per Store"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["create Kit per Store (status=PENDING)", "run.version += 1"]
  - method: POST
    path: "/pop/production-runs/{id}/cancel"
    description: "Run PLANNED -> CANCELLED"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["run.version += 1"]

  # --- Store ---
  - method: POST
    path: "/pop/stores"
    description: "Create a store in a program"
    roles: [ProgramManager]
    code: 201
    input: [program_id, store_number, address]
    output: Store
    side_effects: []
  - method: GET
    path: "/pop/stores/{id}"
    description: "Get one store"
    roles: [PlatformAdmin, ProgramManager, WarehouseOperator, LogisticsCoordinator, FieldServiceManager]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: GET
    path: "/pop/programs/{id}/stores"
    description: "List stores for a program (reverse reachability for Store.program_id)"
    roles: [PlatformAdmin, ProgramManager, WarehouseOperator, LogisticsCoordinator, FieldServiceManager]
    code: 200
    input: []
    output: Store[]
    side_effects: []

  # --- Kit ---
  - method: POST
    path: "/pop/kits"
    description: "Create a kit manually (run, store); normally cascaded from mark-produced"
    roles: [WarehouseOperator]
    code: 201
    input: [production_run_id, store_id]
    output: Kit
    side_effects: []
  - method: GET
    path: "/pop/kits/{id}"
    description: "Get one kit"
    roles: [PlatformAdmin, ProgramManager, WarehouseOperator, LogisticsCoordinator, ClaimsAdjuster]
    code: 200
    input: []
    output: Kit
    side_effects: []
  - method: GET
    path: "/pop/production-runs/{id}/kits"
    description: "List kits for a run (reverse reachability for Kit.production_run_id)"
    roles: [PlatformAdmin, ProgramManager, WarehouseOperator, ProductionPlanner]
    code: 200
    input: []
    output: Kit[]
    side_effects: []
  - method: GET
    path: "/pop/stores/{id}/kits"
    description: "List kits for a store (reverse reachability for Kit.store_id)"
    roles: [PlatformAdmin, ProgramManager, WarehouseOperator, LogisticsCoordinator]
    code: 200
    input: []
    output: Kit[]
    side_effects: []
  - method: POST
    path: "/pop/kits/{id}/mark-kitted"
    description: "Kit PENDING -> KITTED"
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: Kit
    side_effects: ["kit.version += 1"]

  # --- Shipment ---
  - method: POST
    path: "/pop/shipments"
    description: "Create a shipment for a kit with ship window"
    roles: [LogisticsCoordinator]
    code: 201
    input: [kit_id, ship_window_start, ship_window_end, "appointment_at?"]
    output: Shipment
    side_effects: []
  - method: GET
    path: "/pop/shipments/{id}"
    description: "Get one shipment"
    roles: [PlatformAdmin, ProgramManager, LogisticsCoordinator, WarehouseOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/pop/kits/{id}/shipments"
    description: "List shipments for a kit (reverse reachability for Shipment.kit_id)"
    roles: [PlatformAdmin, ProgramManager, LogisticsCoordinator, WarehouseOperator]
    code: 200
    input: []
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/pop/shipments/{id}/set-appointment"
    description: "Shipment SCHEDULED -> APPOINTMENT_SET"
    roles: [LogisticsCoordinator]
    code: 200
    input: [appointment_at]
    output: Shipment
    side_effects: ["shipment.version += 1"]
  - method: POST
    path: "/pop/shipments/{id}/ship"
    description: "Shipment APPOINTMENT_SET -> SHIPPED; cascades Kit -> SHIPPED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["set shipped_at", "kit.status -> SHIPPED", "shipment.version += 1"]
  - method: POST
    path: "/pop/shipments/{id}/deliver"
    description: "Shipment SHIPPED -> DELIVERED; cascades Kit -> DELIVERED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["set delivered_at", "kit.status -> DELIVERED", "shipment.version += 1"]
  - method: POST
    path: "/pop/shipments/{id}/fail"
    description: "Shipment SHIPPED -> FAILED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["shipment.version += 1"]

  # --- DamageClaim ---
  - method: POST
    path: "/pop/damage-claims"
    description: "Report damage on a kit"
    roles: [ClaimsAdjuster, WarehouseOperator]
    code: 201
    input: [kit_id, reported_by, replacement_quantity]
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/pop/damage-claims/{id}"
    description: "Get one damage claim"
    roles: [PlatformAdmin, ProgramManager, ClaimsAdjuster, WarehouseOperator]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/pop/kits/{id}/damage-claims"
    description: "List damage claims for a kit (reverse reachability for DamageClaim.kit_id)"
    roles: [PlatformAdmin, ProgramManager, ClaimsAdjuster, WarehouseOperator]
    code: 200
    input: []
    output: DamageClaim[]
    side_effects: []
  - method: POST
    path: "/pop/damage-claims/{id}/approve"
    description: "Claim REPORTED -> APPROVED; computes replacement_cost_cents; may cascade kit -> DAMAGED"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["compute replacement_cost_cents", "if kit SHIPPED then kit -> DAMAGED", "claim.version += 1"]
  - method: POST
    path: "/pop/damage-claims/{id}/reject"
    description: "Claim REPORTED -> REJECTED"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["claim.version += 1"]
  - method: POST
    path: "/pop/damage-claims/{id}/fulfill"
    description: "Claim APPROVED -> FULFILLED"
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["claim.version += 1"]

  # --- FieldServiceRequest ---
  - method: POST
    path: "/pop/field-service-requests"
    description: "Open a field service request for a store"
    roles: [FieldServiceManager, ProgramManager]
    code: 201
    input: [store_id, program_id, issue_type]
    output: FieldServiceRequest
    side_effects: []
  - method: GET
    path: "/pop/field-service-requests/{id}"
    description: "Get one FSR"
    roles: [PlatformAdmin, ProgramManager, FieldServiceManager]
    code: 200
    input: []
    output: FieldServiceRequest
    side_effects: []
  - method: GET
    path: "/pop/stores/{id}/field-service-requests"
    description: "List FSRs for a store (reverse reachability for FieldServiceRequest.store_id)"
    roles: [PlatformAdmin, ProgramManager, FieldServiceManager]
    code: 200
    input: []
    output: FieldServiceRequest[]
    side_effects: []
  - method: GET
    path: "/pop/programs/{id}/field-service-requests"
    description: "List FSRs for a program (reverse reachability for FieldServiceRequest.program_id)"
    roles: [PlatformAdmin, ProgramManager, FieldServiceManager]
    code: 200
    input: []
    output: FieldServiceRequest[]
    side_effects: []
  - method: POST
    path: "/pop/field-service-requests/{id}/dispatch"
    description: "FSR OPEN -> DISPATCHED"
    roles: [FieldServiceManager]
    code: 200
    input: []
    output: FieldServiceRequest
    side_effects: ["fsr.version += 1"]
  - method: POST
    path: "/pop/field-service-requests/{id}/resolve"
    description: "FSR DISPATCHED -> RESOLVED"
    roles: [FieldServiceManager]
    code: 200
    input: []
    output: FieldServiceRequest
    side_effects: ["fsr.version += 1"]

  # --- ProgramRecap ---
  - method: GET
    path: "/pop/programs/{id}/recap"
    description: "Get the recap for a closed program (reverse reachability for ProgramRecap.program_id)"
    roles: [PlatformAdmin, ProgramManager]
    code: 200
    input: []
    output: ProgramRecap[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a state that permits the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_COMPLIANCE_FAILED
    http: 422
    condition: "Design fails active compliance rules, or program lacks an active compliance rule when required"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation: design_code per program, store_number per program, or one kit per (run, store)"
  - id: ERR_WINDOW_VIOLATION
    http: 422
    condition: "Appointment outside ship window, ship before window start, or deliver after window end + 7d grace"
  - id: ERR_REFERENTIAL
    http: 422
    condition: "Cross-entity reference invalid: design not APPROVED, kit not SHIPPED/DELIVERED, or FSR program/store mismatch"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Field-level validation failure (negative numbers, bad enum, missing required field)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational superuser; manages clients and the logical clock"
    identity: "opaque"
    exclusive_operations: ["POST /pop/clients", "POST /pop/_clock/set_current_utc"]
    shared_operations: ["GET endpoints"]
  - name: ProgramManager
    description: "Owns the retailer program lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /pop/programs"
      - "POST /pop/programs/{id}/start-design"
      - "POST /pop/programs/{id}/authorize-production"
      - "POST /pop/programs/{id}/start-fulfillment"
      - "POST /pop/programs/{id}/close"
      - "POST /pop/programs/{id}/cancel"
      - "POST /pop/stores"
      - "POST /pop/designs/{id}/lock"
    shared_operations: ["GET endpoints", "POST /pop/field-service-requests"]
  - name: Designer
    description: "Creates and submits display designs; drives revision loops"
    identity: "opaque"
    exclusive_operations:
      - "POST /pop/designs"
      - "POST /pop/designs/{id}/submit"
      - "POST /pop/designs/{id}/revise"
    shared_operations: ["GET endpoints"]
  - name: ComplianceOfficer
    description: "Manages retailer compliance rules and approves/rejects designs"
    identity: "opaque"
    exclusive_operations:
      - "POST /pop/programs/{id}/compliance-rules"
      - "POST /pop/designs/{id}/begin-review"
      - "POST /pop/designs/{id}/approve"
      - "POST /pop/designs/{id}/reject"
    shared_operations: ["GET endpoints"]
  - name: ProductionPlanner
    description: "Authorizes and completes production runs"
    identity: "opaque"
    exclusive_operations:
      - "POST /pop/production-runs"
      - "POST /pop/production-runs/{id}/authorize"
      - "POST /pop/production-runs/{id}/mark-produced"
      - "POST /pop/production-runs/{id}/cancel"
    shared_operations: ["GET endpoints"]
  - name: WarehouseOperator
    description: "Kits displays and fulfills damage replacements"
    identity: "opaque"
    exclusive_operations:
      - "POST /pop/kits"
      - "POST /pop/kits/{id}/mark-kitted"
      - "POST /pop/damage-claims/{id}/fulfill"
    shared_operations: ["GET endpoints", "POST /pop/damage-claims"]
  - name: LogisticsCoordinator
    description: "Schedules appointments and moves shipments through the window"
    identity: "opaque"
    exclusive_operations:
      - "POST /pop/shipments"
      - "POST /pop/shipments/{id}/set-appointment"
      - "POST /pop/shipments/{id}/ship"
      - "POST /pop/shipments/{id}/deliver"
      - "POST /pop/shipments/{id}/fail"
    shared_operations: ["GET endpoints"]
  - name: ClaimsAdjuster
    description: "Adjudicates damage claims"
    identity: "opaque"
