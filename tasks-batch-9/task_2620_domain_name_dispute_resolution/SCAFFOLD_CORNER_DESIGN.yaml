              payload: { replacement_panelist_id: "${pan_b}", reason: "The sole panelist stepped down." }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { pred_status: "$.data.status", succ_id: "$.data.replaced_by_appointment_id" }
            - call: "POST /udrp/appointments/${succ_id}/conflict-screening"
              payload: { disclosed_prior_representation: false, disclosed_same_firm: false, disclosed_financial_interest: false, prior_appointments_with_complainant: 0 }
              as: Panelist
              as_user_id: "${pan_b}"
              captures: { succ_status: "$.data.status" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { status_reconstituted: "$.data.status", cv_reconstituted: "$.data.version" }
            - call: "POST /udrp/cases/${case_id}/decisions"
              payload: { expected_case_version: "${cv_constituted}", drafted_by_panelist_id: "${pan_b}", draft_summary: "A draft opened against the pre-replacement panel snapshot." }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { err_stale: "$.data.error_id" }
            - call: "GET /udrp/cases/${case_id}/decisions"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { dec_total_after_412: "$.meta.total_count" }
            - call: "POST /udrp/cases/${case_id}/decisions"
              payload: { expected_case_version: "${cv_reconstituted}", drafted_by_panelist_id: "${pan_b}", draft_summary: "The successor panelist drafts the decision." }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { dec_id: "$.data.id", dec_status: "$.data.status" }
          assert:
            - "The replacement moves the predecessor to REPLACED with replaced_by_appointment_id pointing at a NOMINATED successor for the same SOLE seat, and the case falls back to PANEL_APPOINTMENT"
            - "The successor's clean screening gives status ACCEPTED and the case returns to PANEL_CONSTITUTED with a version strictly greater than ${cv_constituted}"
            - "The draft carrying ${cv_constituted} returns HTTP 412 with data.error_id == 'ERR_STALE_CASE_VERSION' - the state gate at 40 is satisfied, so only the version check can catch it"
            - "GET /udrp/cases/${case_id}/decisions reports meta.total_count 0 right after the 412"
            - "The draft carrying the freshly read version succeeds with HTTP 201 and status DRAFT, naming the successor panelist as its drafter"

