            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p6}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t6: $.data.id } }
            - { call: "POST /closeout/projects/${p5}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p6}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p5}", trade_package_id: "${t5}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w5: $.data.id } }
