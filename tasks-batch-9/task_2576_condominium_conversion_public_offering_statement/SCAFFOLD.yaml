scenario: |
  Generate task harder than expert level!

  2576. Condominium Conversion & Public Offering Statement (condominium converter): building
  suitability analysis with engineering reports on remaining useful life of major components,
  declaration, bylaws and plat preparation with unit boundary definitions, public offering
  statement content requirements and pre-sale rescission periods, existing tenant notice periods,
  right of first refusal and relocation assistance obligations, reserve funding study and initial
  budget disclosure with developer deficit funding, lender warrantability considerations on
  owner-occupancy and investor concentration, unit sale sequencing with closings held until
  minimum thresholds, warranty obligations on common elements

domain_name: "condominium-conversion-offering"
api_prefix: ""           # top-level collections: /conversion-projects, /engineering-reports, /units, ...

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # PurchaseAgreement is a 4-way cross-aggregate junction (Unit x PublicOfferingStatement x
  # ClosingBatch x TenantHousehold); WarrantyClaim links ConversionProject x MajorComponent x Unit;
  # SuitabilityAssessment links EngineeringReport x ConversionProject. No strict ownership tree.

  state_machine_shape: parallel
  # ConversionProject (status x posture), TenantHousehold (notice_status x rofr_status x
  # relocation_status) and PurchaseAgreement (contract_status x escrow_status) each carry
  # independent state dimensions; EngineeringReport, PublicOfferingStatement, ClosingBatch and
  # WarrantyClaim each carry a cycle; ConversionProject.posture is compound over children.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # PeerReviewEngineer must not be the LicensedEngineer who submitted the report; EscrowAgent
  # (not ConverterSponsor) performs escrow funding, batch release and closing; StateRegulator
  # alone confers POS effectiveness.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ConversionProject
    parent: null
    common_fields: true
    fields:
      - name: building_address
        type: string
        source: input
        description: street address of the building being converted
        constraints: non-empty, max 200 chars
      - name: year_built
        type: integer
        source: input
        description: year of original construction
        constraints: 1800 <= year_built <= 2026
      - name: total_unit_count
        type: integer
        source: input
        description: number of dwelling units the plat will define
        constraints: 2 <= total_unit_count <= 400
      - name: sponsor_user_id
        type: string
        source: input
        description: opaque operator id of the ConverterSponsor that owns this project
      - name: max_overlapping_remediations
        type: integer
        source: input
        default: 2
        description: project-wide aggregate cap on how many WarrantyClaim remediation windows may
          overlap on any instant across all MajorComponents
        constraints: 1 <= max_overlapping_remediations <= 5
      - name: status
        type: enum
        source: computed
        description: workflow phase; see state_machines.ConversionProject
        default: FEASIBILITY
        constraints: one of {FEASIBILITY, SUITABILITY_REVIEW, DOCUMENTS_PREPARATION, REGISTRATION,
          PRESALE, CLOSINGS, COMPLETED}
      - name: posture
        type: enum
        source: computed
        description: independent gating dimension derived from children by
          calculations.project_posture_derivation
        default: RESTRICTED
        constraints: one of {OPEN, RESTRICTED, FROZEN}
      - name: suitability_gate
        type: enum
        source: computed
        description: latest non-SUPERSEDED SuitabilityAssessment verdict projected onto the project
        default: UNEVALUATED
        constraints: one of {UNEVALUATED, PASSED, FAILED}
      - name: suitability_score
        type: number
        source: computed
        description: score of the latest non-SUPERSEDED SuitabilityAssessment; 0.00 when none
        default: 0.00
        constraints: 0.00 <= suitability_score <= 100.00, 2 decimal places
      - name: included_unit_count
        type: integer
        source: computed
        description: count of Units of this project with declaration_status == INCLUDED
        default: 0
      - name: escrow_deposits_received_cents
        type: integer
        source: computed
        description: monotonic sum of PurchaseAgreement.deposit_cents ever moved to
          escrow_status FUNDED on this project
        default: 0
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: sum of PurchaseAgreement.deposit_cents where escrow_status == FUNDED
        default: 0
      - name: escrow_refunded_cents
        type: integer
        source: computed
        description: sum of PurchaseAgreement.deposit_cents where escrow_status == REFUNDED
        default: 0
      - name: escrow_disbursed_cents
        type: integer
        source: computed
        description: sum of PurchaseAgreement.deposit_cents where escrow_status == DISBURSED
        default: 0
      - name: relocation_obligation_accrued_cents
        type: integer
        source: computed
        description: monotonic sum of TenantHousehold.relocation_assistance_cents ever accrued
        default: 0
      - name: relocation_paid_cents
        type: integer
        source: computed
        description: sum of TenantHousehold.relocation_paid_cents across households
        default: 0
      - name: relocation_reversed_cents
        type: integer
        source: computed
        description: sum of TenantHousehold.relocation_reversed_cents across households
        default: 0
      - name: warranty_reserve_charge_cents
        type: integer
        source: computed
        description: accrued common-element warranty remediation charge from admissible claims
        default: 0
      - name: relocation_outstanding_cents
        type: integer
        source: computed
        description: sum of TenantHousehold.relocation_assistance_cents over households whose
          relocation_status == ACCRUED
        default: 0
      - name: escrow_reconciliation_delta_cents
        type: integer
        source: computed
        description: escrow_deposits_received_cents - (escrow_balance_cents + escrow_refunded_cents
          + escrow_disbursed_cents); MUST always be 0 per
          calculations.escrow_and_obligation_conservation
        default: 0
      - name: relocation_reconciliation_delta_cents
        type: integer
        source: computed
        description: relocation_obligation_accrued_cents - (relocation_paid_cents +
          relocation_reversed_cents + relocation_outstanding_cents); MUST always be 0 per
          calculations.escrow_and_obligation_conservation
        default: 0
      - name: bp_conservation_total
        type: integer
        source: computed
        description: sum of Unit.percentage_interest_bp over Units with declaration_status ==
          INCLUDED; MUST equal 10000 whenever included_unit_count >= 1
        default: 0
      - name: warrantability_verdict
        type: enum
        source: computed
        description: verdict of the most recent CONTRACT_BASIS run of
          calculations.warrantability_ratios
        default: UNEVALUATED
        constraints: one of {UNEVALUATED, WARRANTABLE, NON_WARRANTABLE}
      - name: warrantability_verdict_closed_basis
        type: enum
        source: computed
        description: verdict of the most recent CLOSED_BASIS run of
          calculations.warrantability_ratios
        default: UNEVALUATED
        constraints: one of {UNEVALUATED, WARRANTABLE, NON_WARRANTABLE}
      - name: owner_occupancy_pct_contract_basis
        type: number
        source: computed
        description: CONTRACT_BASIS owner-occupancy percentage, 2 decimal places
        default: 0.00
      - name: investor_concentration_pct_contract_basis
        type: number
        source: computed
        description: CONTRACT_BASIS investor concentration percentage, 2 decimal places
        default: 0.00
      - name: owner_occupancy_pct_closed_basis
        type: number
        source: computed
        description: CLOSED_BASIS owner-occupancy percentage, 2 decimal places
        default: 0.00
      - name: investor_concentration_pct_closed_basis
        type: number
        source: computed
        description: CLOSED_BASIS investor concentration percentage, 2 decimal places
        default: 0.00
      - name: single_investor_max_pct
        type: number
        source: computed
        description: largest share of total_unit_count held under one purchaser_tax_id across
          PurchaseAgreements with contract_status IN {SIGNED, HARD, CLOSED}, 2 decimal places
        default: 0.00
      - name: presale_sold_pct
        type: number
        source: computed
        description: percentage of INCLUDED Units whose sale_status IN {HARD_CONTRACT, SOLD}, 2
          decimal places
        default: 0.00
      - name: declaration_recorded_at
        type: datetime
        source: computed
        description: logical-clock instant at which this project's DeclarationPackage reached
          RECORDED; null before that
      - name: warranty_start_at
        type: datetime
        source: computed
        description: equals declaration_recorded_at; anchor for common-element warranty windows
      - name: last_posture_recalculated_at
        type: datetime
        source: system
        description: logical-clock instant of the last posture derivation run

  - name: EngineeringReport
    parent: ConversionProject
    common_fields: true
    fields:
      - name: conversion_project_id
        type: string
        source: input
        description: FK -> ConversionProject.id; the building this report covers
      - name: report_label
        type: string
        source: input
        description: sponsor-assigned label, unique per conversion_project_id
        constraints: non-empty, unique within (conversion_project_id, report_label)
      - name: inspection_date
        type: datetime
        source: input
        description: date the physical inspection was performed
      - name: submitted_by_user_id
        type: string
        source: computed
        description: opaque X-User-ID of the LicensedEngineer that most recently submitted this
          report; null while status == DRAFT and never submitted
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: opaque X-User-ID of the PeerReviewEngineer that recorded the last decision
      - name: status
        type: enum
        source: computed
        description: review lifecycle; see state_machines.EngineeringReport
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, ACCEPTED, REVISION_REQUESTED, SUPERSEDED}
      - name: revision_round
        type: integer
        source: computed
        description: number of completed DRAFT -> SUBMITTED submissions on this report
        default: 0
      - name: verified_component_count
        type: integer
        source: computed
        description: count of child MajorComponents with verification_status == VERIFIED
        default: 0
      - name: total_replacement_cost_cents
        type: integer
        source: computed
        description: sum of MajorComponent.replacement_cost_cents over children with
          verification_status == VERIFIED
        default: 0

  - name: MajorComponent
    parent: EngineeringReport
    common_fields: true
    fields:
      - name: engineering_report_id
        type: string
        source: input
        description: FK -> EngineeringReport.id; the report that inventories this component
      - name: component_type
        type: enum
        source: input
        description: which building system this row describes; unique per engineering_report_id
        constraints: one of {ROOF, ELEVATOR, HVAC, PLUMBING_RISERS, ELECTRICAL_SERVICE, FACADE,
          FOUNDATION, PARKING_DECK, FIRE_SUPPRESSION}; unique within
          (engineering_report_id, component_type)
      - name: remaining_useful_life_years
        type: integer
        source: input
        description: engineer's estimate of remaining useful life in whole years
        constraints: 0 <= remaining_useful_life_years <= 80
      - name: effective_age_years
        type: integer
        source: input
        description: consumed useful life in whole years; drives the fully-funded balance
        constraints: 0 <= effective_age_years <= 120
      - name: replacement_cost_cents
        type: integer
        source: input
        description: current cost to replace this component in cents
        constraints: replacement_cost_cents >= 0
      - name: funded_pct_bp
        type: integer
        source: input
        description: portion of this component's replacement cost already funded, in basis points
        default: 0
        constraints: 0 <= funded_pct_bp <= 10000
      - name: condition_rating
        type: enum
        source: input
        description: inspected condition class; drives the suitability condition penalty
        constraints: one of {EXCELLENT, GOOD, FAIR, POOR}
      - name: planned_remediation_gain_years
        type: integer
        source: input
        description: whole years of useful life the sponsor's planned remediation would add; used
          only by the POST_REMEDIATION variant of calculations.building_suitability_score
        default: 0
        constraints: 0 <= planned_remediation_gain_years <= 40
      - name: is_life_safety
        type: boolean
        source: input
        description: true when the component is a life-safety system subject to the critical cap
        default: false
      - name: is_structural
        type: boolean
        source: input
        description: true when the component is structural; selects the 60-month common-element
          warranty window instead of the 24-month window
        default: false
      - name: verification_status
        type: enum
        source: computed
        description: whether this row counts toward suitability and reserve math
        default: UNVERIFIED
        constraints: one of {UNVERIFIED, VERIFIED}

  - name: SuitabilityAssessment
    parent: EngineeringReport
    common_fields: true
    fields:
      - name: engineering_report_id
        type: string
        source: input
        description: FK -> EngineeringReport.id; the accepted report the score was computed from
      - name: conversion_project_id
        type: string
        source: computed
        description: FK -> ConversionProject.id; copied from the parent report at creation
      - name: variant
        type: enum
        source: input
        description: which variant of calculations.building_suitability_score was executed
        constraints: one of {AS_INSPECTED, POST_REMEDIATION}
      - name: score
        type: number
        source: computed
        description: 0.00-100.00 weighted score produced by the selected variant
        constraints: 2 decimal places, round_half_up
      - name: basis
        type: enum
        source: computed
        description: which input population produced the score
        constraints: one of {VERIFIED_COMPONENTS, NO_VERIFIED_COMPONENTS}
      - name: critical_cap_applied
        type: boolean
        source: computed
        description: true when the life-safety critical cap clamped the raw score
        default: false
      - name: verdict
        type: enum
        source: computed
        description: PASSED when score >= SUITABILITY_PASS_SCORE (62.50), else FAILED
        constraints: one of {PASSED, FAILED}
      - name: status
        type: enum
        source: computed
        description: EFFECTIVE until a newer assessment on the same report supersedes it, or the
          report leaves ACCEPTED
        default: EFFECTIVE
        constraints: one of {EFFECTIVE, SUPERSEDED, INVALIDATED}

  - name: DeclarationPackage
    parent: ConversionProject
    common_fields: true
    fields:
      - name: conversion_project_id
        type: string
        source: input
        description: FK -> ConversionProject.id; the project whose regime this package creates
        constraints: at most one DeclarationPackage per conversion_project_id
      - name: declaration_text_ref
        type: string
        source: input
        description: storage reference for the declaration instrument text
        constraints: non-empty
      - name: bylaws_text_ref
        type: string
        source: input
        description: storage reference for the bylaws text
        constraints: non-empty
      - name: plat_revision
        type: integer
        source: computed
        description: increments by 1 each time the package returns to DRAFT after plat certification
        default: 0
      - name: boundary_convention
        type: enum
        source: input
        description: unit boundary convention the plat uses for every Unit
        constraints: one of {PAINT_TO_PAINT, STUD_TO_STUD, CENTERLINE}
      - name: status
        type: enum
        source: computed
        description: recording lifecycle; see state_machines.DeclarationPackage
        default: DRAFT
        constraints: one of {DRAFT, PLAT_CERTIFIED, RECORDED}
      - name: recorded_at
        type: datetime
        source: computed
        description: logical-clock instant of recording; null until status == RECORDED
      - name: allocated_bp_total
        type: integer
        source: computed
        description: sum of Unit.percentage_interest_bp over child Units with
          declaration_status == INCLUDED; must equal 10000 to certify the plat
        default: 0

  - name: Unit
    parent: DeclarationPackage
    common_fields: true
    fields:
      - name: declaration_package_id
        type: string
        source: input
        description: FK -> DeclarationPackage.id; the plat that defines this unit's boundaries
      - name: conversion_project_id
        type: string
        source: computed
        description: FK -> ConversionProject.id; copied from the parent package at creation
      - name: unit_number
        type: string
        source: input
        description: plat unit designation, unique per declaration_package_id
        constraints: non-empty, unique within (declaration_package_id, unit_number)
      - name: floor_level
        type: integer
        source: input
        description: floor on which the unit sits
        constraints: -3 <= floor_level <= 80
      - name: heated_square_feet
        type: integer
        source: input
        description: heated area inside the declared boundary
        constraints: heated_square_feet >= 100
      - name: boundary_note
        type: string
        source: input
        description: narrative boundary definition for this unit under the package convention
        constraints: non-empty, max 500 chars
      - name: base_percentage_interest_bp
        type: integer
        source: input
        description: immutable as-declared undivided common-element interest in basis points; the
          sum over ALL sibling Units must equal 10000 for the plat to certify
        constraints: 1 <= base_percentage_interest_bp <= 10000
      - name: percentage_interest_bp
        type: integer
        source: computed
        description: effective interest recomputed by calculations.percentage_interest_reallocation
          over the current INCLUDED set; 0 while declaration_status == WITHDRAWN
        default: 0
      - name: unit_annual_assessment_cents
        type: integer
        source: computed
        description: annual assessment allocated by calculations.unit_assessment_allocation
        default: 0
      - name: unit_monthly_assessment_cents
        type: integer
        source: computed
        description: monthly assessment derived from unit_annual_assessment_cents
        default: 0
      - name: declaration_status
        type: enum
        source: computed
        description: whether the unit participates in the regime and in all allocations
        default: INCLUDED
        constraints: one of {INCLUDED, WITHDRAWN}
      - name: sale_status
        type: enum
        source: computed
        description: derived sale posture of this unit from its PurchaseAgreements
        default: UNSOLD
        constraints: one of {UNSOLD, UNDER_CONTRACT, HARD_CONTRACT, SOLD}

  - name: PublicOfferingStatement
    parent: ConversionProject
    common_fields: true
    fields:
      - name: conversion_project_id
        type: string
        source: input
        description: FK -> ConversionProject.id; the project this POS offers
        constraints: at most one PublicOfferingStatement per conversion_project_id
      - name: declaration_package_id
        type: string
        source: input
        description: FK -> DeclarationPackage.id; the package whose regime the POS discloses
      - name: reserve_study_id
        type: string
        source: input
        description: FK -> ReserveStudy.id; the reserve study disclosed in section RESERVES
      - name: initial_budget_id
        type: string
        source: input
        description: FK -> InitialBudget.id; the budget disclosed in section BUDGET
      - name: status
        type: enum
        source: computed
        description: disclosure lifecycle; see state_machines.PublicOfferingStatement
        default: DRAFT
        constraints: one of {DRAFT, SECTIONS_COMPLETE, EFFECTIVE, AMENDMENT_REQUIRED,
          AMENDMENT_FILED}
      - name: effective_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent transition into EFFECTIVE
      - name: amendment_count
        type: integer
        source: computed
        description: number of amendments filed on this POS
        default: 0
      - name: last_material_amendment_at
        type: datetime
        source: computed
        description: logical-clock effective instant of the last amendment with
          material_change == true; drives rescission restarts
      - name: complete_section_count
        type: integer
        source: computed
        description: count of child POSSections with content_status == COMPLETE
        default: 0

  - name: POSSection
    parent: PublicOfferingStatement
    common_fields: true
    fields:
      - name: public_offering_statement_id
        type: string
        source: input
        description: FK -> PublicOfferingStatement.id; the statement this section belongs to
      - name: section_code
        type: enum
        source: input
        description: statutory content requirement this section satisfies; unique per
          public_offering_statement_id
        constraints: one of {UNIT_BOUNDARIES, COMMON_ELEMENTS, PERCENTAGE_INTERESTS, BUDGET,
          RESERVES, ENGINEERING_CONDITION, TENANT_RIGHTS, WARRANTY, RESCISSION_RIGHTS}; unique
          within (public_offering_statement_id, section_code)
      - name: body_ref
        type: string
        source: input
        description: storage reference for the drafted section body
        constraints: non-empty
      - name: word_count
        type: integer
        source: input
        description: drafted length; sections below MIN_SECTION_WORD_COUNT (150) stay DRAFTED
        constraints: word_count >= 0
      - name: content_status
        type: enum
        source: computed
        description: COMPLETE when word_count >= 150 and attested_by_user_id is set, else DRAFTED
        default: DRAFTED
        constraints: one of {DRAFTED, COMPLETE}
      - name: attested_by_user_id
        type: string
        source: input
        description: opaque X-User-ID of the ConverterSponsor attesting the section content
      - name: last_attested_at
        type: datetime
        source: computed
        description: logical-clock instant of the last attestation write

  - name: TenantHousehold
    parent: ConversionProject
    common_fields: true
    fields:
      - name: conversion_project_id
        type: string
        source: input
        description: FK -> ConversionProject.id; the building this household occupies
      - name: occupied_unit_id
        type: string
        source: input
        description: FK -> Unit.id; the platted unit this household occupies; nullable until the
          plat defines units
      - name: household_label
        type: string
        source: input
        description: household identifier used in the notice register, unique per project
        constraints: non-empty, unique within (conversion_project_id, household_label)
      - name: tenancy_start_date
        type: datetime
        source: input
        description: first day of continuous occupancy; drives the notice-period tier
      - name: monthly_rent_cents
        type: integer
        source: input
        description: current contract rent per month in cents
        constraints: monthly_rent_cents >= 0
      - name: protected_class
        type: enum
        source: input
        description: statutory protection category claimed by the household
        default: NONE
        constraints: one of {NONE, HOUSEHOLD_WITH_MINOR, ELDERLY, DISABLED}
      - name: notice_status
        type: enum
        source: computed
        description: dimension 1 of state_machines.TenantHousehold
        default: PRE_NOTICE
        constraints: one of {PRE_NOTICE, NOTICE_SERVED, VACATE_DUE, VACATED, HOLDOVER,
          NOTICE_WITHDRAWN}
      - name: rofr_status
        type: enum
        source: computed
        description: dimension 2 of state_machines.TenantHousehold
        default: NOT_OFFERED
        constraints: one of {NOT_OFFERED, OFFERED, EXERCISED, WAIVED, EXPIRED}
      - name: relocation_status
        type: enum
        source: computed
        description: dimension 3 of state_machines.TenantHousehold
        default: NOT_OWED
        constraints: one of {NOT_OWED, ACCRUED, PAID, REVERSED}
      - name: notice_served_at
        type: datetime
        source: computed
        description: logical-clock instant the conversion notice was served
      - name: notice_period_days
        type: integer
        source: computed
        description: tiered notice length from calculations.tenant_notice_and_relocation
        default: 0
      - name: vacate_deadline_at
        type: datetime
        source: computed
        description: notice_served_at + notice_period_days * 86400 seconds
      - name: rofr_expires_at
        type: datetime
        source: computed
        description: notice_served_at + ROFR_WINDOW_DAYS (90) * 86400 seconds
      - name: relocation_assistance_cents
        type: integer
        source: computed
        description: obligation accrued at notice service by
          calculations.tenant_notice_and_relocation
        default: 0
      - name: relocation_paid_cents
        type: integer
        source: computed
        description: cents actually disbursed to this household
        default: 0
      - name: relocation_reversed_cents
        type: integer
        source: computed
        description: cents of accrued obligation reversed because the household exercised its ROFR
        default: 0

  - name: ReserveStudy
    parent: ConversionProject
    common_fields: true
    fields:
      - name: conversion_project_id
        type: string
        source: input
        description: FK -> ConversionProject.id; the project being studied
      - name: engineering_report_id
        type: string
        source: input
        description: FK -> EngineeringReport.id; the ACCEPTED report supplying component data
      - name: method
        type: enum
        source: input
        description: which variant of calculations.reserve_funding_requirement to execute
        constraints: one of {COMPONENT_METHOD, CASH_FLOW_METHOD}
      - name: opening_reserve_balance_cents
        type: integer
        source: input
        description: cash the sponsor will seed the reserve account with at recording
        default: 0
        constraints: opening_reserve_balance_cents >= 0
      - name: fully_funded_balance_cents
        type: integer
        source: computed
        description: component-wise fully funded balance
        default: 0
      - name: recommended_annual_contribution_cents
        type: integer
        source: computed
        description: annual reserve contribution the selected method requires
        default: 0
      - name: percent_funded_bp
        type: integer
        source: computed
        description: round_half_up(10000 * opening_reserve_balance_cents /
          fully_funded_balance_cents); 0 when fully_funded_balance_cents == 0
        default: 0
      - name: funding_status
        type: enum
        source: computed
        description: ADEQUATE when percent_funded_bp >= 7000, else UNDERFUNDED
        default: UNDERFUNDED
        constraints: one of {ADEQUATE, UNDERFUNDED}
      - name: adoption_status
        type: enum
        source: computed
        description: ADOPTED once an InitialBudget referencing this study is adopted
        default: PROPOSED
        constraints: one of {PROPOSED, ADOPTED, SUPERSEDED}

  - name: InitialBudget
    parent: ConversionProject
    common_fields: true
    fields:
      - name: conversion_project_id
        type: string
        source: input
        description: FK -> ConversionProject.id; the project this budget discloses
      - name: reserve_study_id
        type: string
        source: input
        description: FK -> ReserveStudy.id; the study supplying reserve_contribution_cents
      - name: fiscal_year_label
        type: string
        source: input
        description: label of the first fiscal year, unique per conversion_project_id
        constraints: non-empty, unique within (conversion_project_id, fiscal_year_label)
      - name: annual_operating_expense_cents
        type: integer
        source: input
        description: non-reserve, non-management annual operating expense
        constraints: annual_operating_expense_cents >= 0
      - name: reserve_contribution_cents
        type: integer
        source: computed
        description: copied from ReserveStudy.recommended_annual_contribution_cents at creation
        default: 0
      - name: base_expense_cents
        type: integer
        source: computed
        description: annual_operating_expense_cents + reserve_contribution_cents (step 1 of
          calculations.initial_budget_developer_deficit)
        default: 0
      - name: management_fee_bp
        type: integer
        source: computed
        description: tier selected from base_expense_cents in step 2 and never re-tiered
        default: 0
        constraints: one of {500, 650, 800}
      - name: management_fee_cents
        type: integer
        source: computed
        description: round_half_up(base_expense_cents * management_fee_bp / 10000)
        default: 0
      - name: total_annual_expense_cents
        type: integer
        source: computed
        description: base_expense_cents + management_fee_cents
        default: 0
      - name: assessment_income_cents
        type: integer
        source: computed
        description: sum of Unit.unit_annual_assessment_cents over Units with
          declaration_status == INCLUDED after calculations.unit_assessment_allocation
        default: 0
      - name: developer_deficit_funding_cents
        type: integer
        source: computed
        description: max(0, total_annual_expense_cents - assessment_income_cents)
        default: 0
      - name: developer_subsidy_flag
        type: boolean
        source: computed
        description: true when developer_deficit_funding_cents > 0
        default: false
      - name: status
        type: enum
        source: computed
        description: adoption lifecycle
        default: DRAFT
        constraints: one of {DRAFT, ADOPTED, SUPERSEDED}
      - name: adopted_at
        type: datetime
        source: computed
        description: logical-clock instant of adoption; null while status != ADOPTED

  - name: ClosingBatch
    parent: ConversionProject
    common_fields: true
    fields:
      - name: conversion_project_id
        type: string
        source: input
        description: FK -> ConversionProject.id; the project whose closings this batch sequences
      - name: batch_sequence_no
        type: integer
        source: input
        description: sponsor-assigned sequence position, unique per conversion_project_id
        constraints: 1 <= batch_sequence_no <= 50, unique within
          (conversion_project_id, batch_sequence_no)
      - name: window_start_at
        type: datetime
        source: input
        description: inclusive start of the half-open settlement window [window_start_at,
          window_end_at)
      - name: window_end_at
        type: datetime
        source: input
        description: exclusive end of the settlement window; must be strictly after window_start_at
      - name: min_presale_threshold_pct
        type: number
        source: input
        description: minimum presale percentage of INCLUDED units required before release
        constraints: 0.00 <= min_presale_threshold_pct <= 100.00, 2 decimal places
      - name: min_absolute_unit_count
        type: integer
        source: input
        description: minimum absolute count of qualifying agreements required before release
        default: 1
        constraints: min_absolute_unit_count >= 0
      - name: assigned_agreement_count
        type: integer
        source: computed
        description: count of PurchaseAgreements whose closing_batch_id equals this batch
        default: 0
      - name: qualifying_agreement_count
        type: integer
        source: computed
        description: count of assigned PurchaseAgreements with contract_status IN {SIGNED, HARD,
          CLOSED} and escrow_status IN {FUNDED, DISBURSED}
        default: 0
      - name: presale_pct
        type: number
        source: computed
        description: percentage from calculations.presale_threshold_evaluation
        default: 0.00
        constraints: 2 decimal places
      - name: status
        type: enum
        source: computed
        description: release lifecycle; see state_machines.ClosingBatch
        default: DRAFT
        constraints: one of {DRAFT, OPEN_FOR_ASSIGNMENT, THRESHOLD_SHORT, THRESHOLD_MET, RELEASED,
          SETTLED}
      - name: released_at
        type: datetime
        source: computed
        description: logical-clock instant of release; null until status == RELEASED
      - name: last_evaluated_at
        type: datetime
        source: computed
        description: logical-clock instant of the last threshold evaluation

  - name: PurchaseAgreement
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: FK -> Unit.id; the unit under contract
      - name: conversion_project_id
        type: string
        source: computed
        description: FK -> ConversionProject.id; copied from the unit at creation
      - name: public_offering_statement_id
        type: string
        source: computed
        description: FK -> PublicOfferingStatement.id; the EFFECTIVE POS at signing
      - name: closing_batch_id
        type: string
        source: computed
        description: FK -> ClosingBatch.id; set by POST /closing-batches/{id}/agreement-assignments;
          null while unassigned
      - name: tenant_household_id
        type: string
        source: input
        description: FK -> TenantHousehold.id; set when the purchaser is the sitting tenant
          exercising its right of first refusal; null otherwise
      - name: purchaser_name
        type: string
        source: input
        description: contracting purchaser name
        constraints: non-empty
      - name: purchaser_tax_id
        type: string
        source: input
        description: purchaser tax identifier used to aggregate single-investor concentration
        constraints: non-empty
      - name: purchaser_type
        type: enum
        source: input
        description: occupancy intent of the purchaser; drives rescission length and warrantability
        constraints: one of {OWNER_OCCUPANT, INVESTOR}
      - name: price_cents
        type: integer
        source: input
        description: contract sale price in cents
        constraints: price_cents >= 1
      - name: deposit_cents
        type: integer
        source: input
        description: earnest deposit the escrow agent will hold in cents
        constraints: 0 <= deposit_cents <= price_cents
      - name: signed_at
        type: datetime
        source: computed
        description: logical-clock instant of creation (contract signature)
      - name: pos_delivered_at
        type: datetime
        source: computed
        description: logical-clock instant the POS was delivered to the purchaser; null until then
      - name: rescission_deadline_at
        type: datetime
        source: computed
        description: instant from calculations.rescission_deadline; null until POS delivery
      - name: rescission_restart_count
        type: integer
        source: computed
        description: number of material POS amendments that extended rescission_deadline_at
        default: 0
      - name: contract_status
        type: enum
        source: computed
        description: dimension 1 of state_machines.PurchaseAgreement
        default: SIGNED
        constraints: one of {SIGNED, HARD, CLOSED, RESCINDED, VOID}
      - name: escrow_status
        type: enum
        source: computed
        description: dimension 2 of state_machines.PurchaseAgreement
        default: PENDING
        constraints: one of {PENDING, FUNDED, REFUNDED, DISBURSED}
      - name: closed_at
        type: datetime
        source: computed
        description: logical-clock instant of closing; null until contract_status == CLOSED

  - name: WarrantyClaim
    parent: ConversionProject
    common_fields: true
    fields:
      - name: conversion_project_id
        type: string
        source: input
        description: FK -> ConversionProject.id; the project whose common elements are warranted
      - name: major_component_id
        type: string
        source: input
        description: FK -> MajorComponent.id; the common-element component alleged to be defective
      - name: reported_by_unit_id
        type: string
        source: input
        description: FK -> Unit.id; the purchased unit whose owner reported the defect
      - name: defect_description
        type: string
        source: input
        description: narrative of the alleged common-element defect
        constraints: non-empty, max 500 chars
      - name: claimed_cost_cents
        type: integer
        source: input
        description: claimant's estimate of remediation cost in cents
        constraints: claimed_cost_cents >= 0
      - name: reported_at
        type: datetime
        source: computed
        description: logical-clock instant the claim was filed
      - name: warranty_expires_at
        type: datetime
        source: computed
        description: ConversionProject.warranty_start_at + warranty_months * 30 * 86400 seconds,
          where warranty_months is 60 when MajorComponent.is_structural else 24
      - name: status
        type: enum
        source: computed
        description: claim lifecycle; see state_machines.WarrantyClaim
        default: SUBMITTED
        constraints: one of {SUBMITTED, TRIAGED_ADMISSIBLE, DENIED, REMEDIATION_SCHEDULED,
          REMEDIATED, REOPENED, CLOSED}
      - name: triage_outcome
        type: enum
        source: computed
        description: branch taken at triage
        default: PENDING
        constraints: one of {PENDING, ADMISSIBLE, DENIED}
      - name: accrued_charge_cents
        type: integer
        source: computed
        description: cents added to ConversionProject.warranty_reserve_charge_cents when the claim
          became admissible; 0 for denied claims
        default: 0
      - name: remediation_start_at
        type: datetime
        source: input
        description: inclusive start of the closed remediation window [remediation_start_at,
          remediation_end_at] occupying the MajorComponent; null until scheduled
      - name: remediation_end_at
        type: datetime
        source: input
        description: inclusive end of the closed remediation window; must be >= remediation_start_at
      - name: reopen_count
        type: integer
        source: computed
        description: number of times the claim cycled REMEDIATED -> REOPENED
        default: 0

state_machines:
  # ---- ConversionProject carries TWO independent dimensions: status and posture. ----
  - entity: ConversionProject
    state_field: status
    initial_state: FEASIBILITY
    terminal_states: [COMPLETED]
    transitions:
      - from: FEASIBILITY
        to: SUITABILITY_REVIEW
        trigger: "POST /engineering-reports/{id}/submit (system bubble-up on the first submission)"
        actor: system
        preconditions:
          - "project.status == FEASIBILITY"
          - "the submitted EngineeringReport.conversion_project_id == project.id"
        side_effects:
          - "sets ConversionProject.status = SUITABILITY_REVIEW"
          - "recomputes ConversionProject.posture via calculations.project_posture_derivation"
          - "increments ConversionProject.version by 1"
      - from: SUITABILITY_REVIEW
        to: DOCUMENTS_PREPARATION
        trigger: "POST /engineering-reports/{id}/suitability-assessments yielding verdict PASSED"
        actor: system
        preconditions:
          - "project.status == SUITABILITY_REVIEW"
          - "the created SuitabilityAssessment.verdict == PASSED"
        side_effects:
          - "sets ConversionProject.suitability_gate = PASSED and suitability_score = assessment.score"
          - "sets ConversionProject.status = DOCUMENTS_PREPARATION"
          - "recomputes ConversionProject.posture via calculations.project_posture_derivation"
          - "increments ConversionProject.version by 1"
      - from: DOCUMENTS_PREPARATION
        to: SUITABILITY_REVIEW
        trigger: "POST /engineering-reports/{id}/peer-review-decisions with decision == REJECT
          (system, cascade hop 3 of transitive_cascade engineering_rejection_chain)"
        actor: system
        preconditions:
          - "project.status == DOCUMENTS_PREPARATION"
          - "every SuitabilityAssessment of the rejected report has status == INVALIDATED"
        side_effects:
          - "sets ConversionProject.suitability_gate = FAILED and suitability_score = 0.00"
          - "sets ConversionProject.status = SUITABILITY_REVIEW"
          - "recomputes ConversionProject.posture -> FROZEN"
          - "increments ConversionProject.version by 1"
      - from: DOCUMENTS_PREPARATION
        to: REGISTRATION
        trigger: "POST /declaration-packages/{id}/record"
        actor: system
        preconditions:
          - "project.status == DOCUMENTS_PREPARATION"
          - "DeclarationPackage.status transitioned to RECORDED in this request"
        side_effects:
          - "sets ConversionProject.declaration_recorded_at = current logical clock"
          - "sets ConversionProject.warranty_start_at = ConversionProject.declaration_recorded_at"
          - "sets ConversionProject.status = REGISTRATION"
          - "recomputes ConversionProject.posture via calculations.project_posture_derivation"
          - "increments ConversionProject.version by 1"
      - from: REGISTRATION
        to: PRESALE
        trigger: "POST /public-offering-statements/{id}/effectiveness"
        actor: system
        preconditions:
          - "project.status == REGISTRATION"
          - "PublicOfferingStatement.status transitioned to EFFECTIVE in this request"
        side_effects:
          - "sets ConversionProject.status = PRESALE"
          - "recomputes ConversionProject.posture -> OPEN when every clause of
            calculations.project_posture_derivation OPEN branch holds"
          - "increments ConversionProject.version by 1"
      - from: PRESALE
        to: REGISTRATION
        trigger: "POST /public-offering-statements/{id}/amendments with material_change == true"
        actor: system
        preconditions:
          - "project.status == PRESALE"
          - "PublicOfferingStatement.status left EFFECTIVE in this request"
        side_effects:
          - "sets ConversionProject.status = REGISTRATION"
          - "recomputes ConversionProject.posture -> RESTRICTED"
          - "increments ConversionProject.version by 1"
      - from: PRESALE
        to: CLOSINGS
        trigger: "POST /closing-batches/{id}/release"
        actor: system
        preconditions:
          - "project.status == PRESALE"
          - "the released ClosingBatch.status transitioned THRESHOLD_MET -> RELEASED"
        side_effects:
          - "sets ConversionProject.status = CLOSINGS"
          - "increments ConversionProject.version by 1"
      - from: CLOSINGS
        to: PRESALE
        trigger: "POST /purchase-agreements/{id}/rescission (system, cascade hop 4 of
          transitive_cascade rescission_threshold_chain)"
        actor: system
        preconditions:
          - "project.status == CLOSINGS"
          - "a ClosingBatch of this project moved RELEASED -> THRESHOLD_SHORT in this request"
        side_effects:
          - "sets ConversionProject.status = PRESALE"
          - "recomputes ConversionProject.posture -> RESTRICTED"
          - "increments ConversionProject.version by 1"
      - from: CLOSINGS
        to: COMPLETED
        trigger: "POST /purchase-agreements/{id}/closing (system bubble-up)"
        actor: system
        preconditions:
          - "project.status == CLOSINGS"
          - "every Unit of the project with declaration_status == INCLUDED has
            sale_status == SOLD"
        side_effects:
          - "sets ConversionProject.status = COMPLETED"
          - "sets every ClosingBatch of the project with status == RELEASED to SETTLED"
          - "increments ConversionProject.version by 1"

  - entity: ConversionProject
    state_field: posture
    initial_state: RESTRICTED
    terminal_states: []
    transitions:
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /conversion-projects/{id}/posture-recalculations, or any transition whose
          side_effects say 'recomputes ConversionProject.posture'"
        actor: system
        preconditions:
          - "calculations.project_posture_derivation evaluates to OPEN"
        side_effects:
          - "sets ConversionProject.posture = OPEN"
          - "sets ConversionProject.last_posture_recalculated_at = current logical clock"
          - "increments ConversionProject.version by 1"
      - from: OPEN
        to: RESTRICTED
        trigger: "any transition whose side_effects say 'recomputes ConversionProject.posture'"
        actor: system
        preconditions:
          - "calculations.project_posture_derivation evaluates to RESTRICTED"
        side_effects:
          - "sets ConversionProject.posture = RESTRICTED"
          - "sets ConversionProject.last_posture_recalculated_at = current logical clock"
          - "increments ConversionProject.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /engineering-reports/{id}/peer-review-decisions with decision == REJECT, or
          POST /conversion-projects/{id}/posture-recalculations"
        actor: system
        preconditions:
          - "calculations.project_posture_derivation evaluates to FROZEN"
        side_effects:
          - "sets ConversionProject.posture = FROZEN"
          - "sets ConversionProject.last_posture_recalculated_at = current logical clock"
          - "increments ConversionProject.version by 1"
      - from: OPEN
        to: FROZEN
        trigger: "POST /engineering-reports/{id}/peer-review-decisions with decision == REJECT, or
          POST /conversion-projects/{id}/posture-recalculations"
        actor: system
        preconditions:
          - "calculations.project_posture_derivation evaluates to FROZEN"
        side_effects:
          - "sets ConversionProject.posture = FROZEN"
          - "sets ConversionProject.last_posture_recalculated_at = current logical clock"
          - "increments ConversionProject.version by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "POST /engineering-reports/{id}/suitability-assessments yielding verdict PASSED,
          or POST /conversion-projects/{id}/posture-recalculations"
        actor: system
        preconditions:
          - "calculations.project_posture_derivation evaluates to RESTRICTED"
        side_effects:
          - "sets ConversionProject.posture = RESTRICTED"
          - "sets ConversionProject.last_posture_recalculated_at = current logical clock"
          - "increments ConversionProject.version by 1"
        note: "FROZEN -> OPEN is not a declared edge; a thawed project always lands in RESTRICTED
          first because the POS must be re-made EFFECTIVE before the OPEN branch can hold."

  - entity: EngineeringReport
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /engineering-reports/{id}/submit"
        actor: LicensedEngineer
        preconditions:
          - "report.status == DRAFT"
          - "count of child MajorComponents >= 1"
        side_effects:
          - "sets EngineeringReport.submitted_by_user_id = X-User-ID"
          - "increments EngineeringReport.revision_round by 1"
          - "sets verification_status = VERIFIED on every child MajorComponent"
          - "recomputes EngineeringReport.verified_component_count and total_replacement_cost_cents"
          - "bubbles up ConversionProject FEASIBILITY -> SUITABILITY_REVIEW when applicable"
          - "increments EngineeringReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /engineering-reports/{id}/peer-review-decisions with decision == ACCEPT"
        actor: PeerReviewEngineer
        preconditions:
          - "report.status == SUBMITTED"
          - "X-User-ID != EngineeringReport.submitted_by_user_id (segregation of duties)"
          - "EngineeringReport.verified_component_count >= 1"
        side_effects:
          - "sets EngineeringReport.reviewed_by_user_id = X-User-ID"
          - "sets every OTHER EngineeringReport of the same conversion_project_id whose status ==
            ACCEPTED to SUPERSEDED (ordered created_at ASC)"
          - "sets every SuitabilityAssessment of those superseded reports whose status == EFFECTIVE
            to INVALIDATED"
          - "increments EngineeringReport.version by 1"
        note: "ACCEPT branch accrues no project freeze; contrast with the REJECT branch below,
          whose side-effect set is disjoint (fork with divergent effects)."
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /engineering-reports/{id}/peer-review-decisions with decision == REJECT"
        actor: PeerReviewEngineer
        preconditions:
          - "report.status == SUBMITTED"
          - "X-User-ID != EngineeringReport.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "hop 1: sets EngineeringReport.status = REVISION_REQUESTED, reviewed_by_user_id =
            X-User-ID, and sets verification_status = UNVERIFIED on every child MajorComponent;
            recomputes verified_component_count = 0 and total_replacement_cost_cents = 0"
          - "hop 2: because no child component is VERIFIED any longer, every SuitabilityAssessment
            of this report whose status == EFFECTIVE moves to INVALIDATED"
          - "hop 3: because the project has no EFFECTIVE SuitabilityAssessment left,
            ConversionProject.suitability_gate = FAILED, suitability_score = 0.00 and
            ConversionProject.status DOCUMENTS_PREPARATION -> SUITABILITY_REVIEW"
          - "hop 4: because suitability_gate == FAILED, ConversionProject.posture -> FROZEN and the
            project's PublicOfferingStatement whose status == EFFECTIVE moves to
            AMENDMENT_REQUIRED (POS.status EFFECTIVE -> AMENDMENT_REQUIRED)"
          - "increments EngineeringReport.version by 1"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "PATCH /major-components/{id} on any child component"
        actor: LicensedEngineer
        preconditions:
          - "report.status == REVISION_REQUESTED"
          - "the patched component's engineering_report_id == report.id"
        side_effects:
          - "sets EngineeringReport.status = DRAFT"
          - "increments EngineeringReport.version by 1"
        note: "Closes the DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT revision cycle;
          revision_round increments again on the next submit."
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "POST /engineering-reports/{id}/peer-review-decisions with decision == ACCEPT on a
          sibling report of the same project (system)"
        actor: system
        preconditions:
          - "report.status == ACCEPTED"
          - "a sibling EngineeringReport with the same conversion_project_id reached ACCEPTED in
            this request"
        side_effects:
          - "sets EngineeringReport.status = SUPERSEDED"
          - "sets every SuitabilityAssessment of this report whose status == EFFECTIVE to
            INVALIDATED"
          - "increments EngineeringReport.version by 1"

  - entity: DeclarationPackage
    state_field: status
    initial_state: DRAFT
    terminal_states: [RECORDED]
    transitions:
      - from: DRAFT
        to: PLAT_CERTIFIED
        trigger: "POST /declaration-packages/{id}/plat-certification"
        actor: ConverterSponsor
        preconditions:
          - "package.status == DRAFT"
          - "count of child Units with declaration_status == INCLUDED >= 1"
          - "DeclarationPackage.allocated_bp_total == 10000 exactly"
          - "ConversionProject.suitability_gate == PASSED"
          - "no MajorComponent of the project's ACCEPTED EngineeringReport has
            verification_status == VERIFIED and is_life_safety == true and
            remaining_useful_life_years < CRITICAL_RUL_YEARS (5)"
          - "ConversionProject.posture != FROZEN"
        side_effects:
          - "sets DeclarationPackage.status = PLAT_CERTIFIED"
          - "runs calculations.percentage_interest_reallocation over the INCLUDED Unit set"
          - "increments DeclarationPackage.version by 1"
      - from: PLAT_CERTIFIED
        to: DRAFT
        trigger: "POST /units/{id}/withdraw or POST /units/{id}/reinstate (system)"
        actor: system
        preconditions:
          - "package.status == PLAT_CERTIFIED"
          - "the affected Unit.declaration_package_id == package.id"
        side_effects:
          - "sets DeclarationPackage.status = DRAFT"
          - "increments DeclarationPackage.plat_revision by 1"
          - "increments DeclarationPackage.version by 1"
      - from: PLAT_CERTIFIED
        to: RECORDED
        trigger: "POST /declaration-packages/{id}/record"
        actor: ConverterSponsor
        preconditions:
          - "package.status == PLAT_CERTIFIED"
          - "DeclarationPackage.allocated_bp_total == 10000 exactly"
          - "an InitialBudget of the project has status == ADOPTED"
          - "every TenantHousehold of the project has notice_status != PRE_NOTICE"
          - "ConversionProject.posture != FROZEN"
        side_effects:
          - "sets DeclarationPackage.status = RECORDED and recorded_at = current logical clock"
          - "sets ConversionProject.declaration_recorded_at and warranty_start_at to the same
            instant and moves ConversionProject.status DOCUMENTS_PREPARATION -> REGISTRATION"
          - "increments DeclarationPackage.version by 1"

  - entity: PublicOfferingStatement
    state_field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SECTIONS_COMPLETE
        trigger: "PUT /public-offering-statements/{id}/sections/{section_code} (system bubble-up)"
        actor: system
        preconditions:
          - "pos.status == DRAFT"
          - "after the write, complete_section_count == 9 (all nine section_code values have
            content_status == COMPLETE)"
        side_effects:
          - "sets PublicOfferingStatement.status = SECTIONS_COMPLETE"
          - "increments PublicOfferingStatement.version by 1"
      - from: SECTIONS_COMPLETE
        to: DRAFT
        trigger: "PUT /public-offering-statements/{id}/sections/{section_code} (system bubble-down)"
        actor: system
        preconditions:
          - "pos.status == SECTIONS_COMPLETE"
          - "after the write, complete_section_count < 9"
        side_effects:
          - "sets PublicOfferingStatement.status = DRAFT"
          - "increments PublicOfferingStatement.version by 1"
      - from: SECTIONS_COMPLETE
        to: EFFECTIVE
        trigger: "POST /public-offering-statements/{id}/effectiveness"
        actor: StateRegulator
        preconditions:
          - "pos.status == SECTIONS_COMPLETE"
          - "the DeclarationPackage at pos.declaration_package_id has status == RECORDED"
          - "the InitialBudget at pos.initial_budget_id has status == ADOPTED"
          - "ConversionProject.posture != FROZEN"
        side_effects:
          - "sets PublicOfferingStatement.status = EFFECTIVE and effective_at = logical clock"
          - "moves ConversionProject.status REGISTRATION -> PRESALE and recomputes posture"
          - "increments PublicOfferingStatement.version by 1"
      - from: EFFECTIVE
        to: AMENDMENT_REQUIRED
        trigger: "POST /engineering-reports/{id}/peer-review-decisions with decision == REJECT, or
          POST /units/{id}/withdraw (system)"
        actor: system
        preconditions:
          - "pos.status == EFFECTIVE"
          - "either ConversionProject.suitability_gate became FAILED in this request, or a Unit of
            the project moved declaration_status INCLUDED -> WITHDRAWN in this request"
        side_effects:
          - "sets PublicOfferingStatement.status = AMENDMENT_REQUIRED"
          - "increments PublicOfferingStatement.version by 1"
      - from: EFFECTIVE
        to: AMENDMENT_FILED
        trigger: "POST /public-offering-statements/{id}/amendments"
        actor: ConverterSponsor
        preconditions:
          - "pos.status == EFFECTIVE"
        side_effects:
          - "hop 1: sets PublicOfferingStatement.status = AMENDMENT_FILED, increments
            amendment_count by 1, and when material_change == true sets last_material_amendment_at
            = current logical clock"
          - "hop 2 (only when material_change == true, caused by the last_material_amendment_at
            write): every PurchaseAgreement of the project with contract_status == HARD moves HARD
            -> SIGNED; every PurchaseAgreement with contract_status == SIGNED and pos_delivered_at
            != null has rescission_deadline_at reset per calculations.rescission_deadline restart
            clause and rescission_restart_count incremented by 1"
          - "hop 3 (caused by hop 2 removing those agreements from the HARD population): every
            ClosingBatch of the project whose recomputed presale_pct <
            min_presale_threshold_pct or whose qualifying_agreement_count <
            min_absolute_unit_count and whose status IN {THRESHOLD_MET, RELEASED} moves to
            THRESHOLD_SHORT"
          - "hop 4 (caused by hop 3 for batches that left RELEASED): ConversionProject.status
            CLOSINGS -> PRESALE; and because the POS left EFFECTIVE, ConversionProject.status
            PRESALE -> REGISTRATION with posture recomputed to RESTRICTED"
          - "increments PublicOfferingStatement.version by 1"
      - from: AMENDMENT_REQUIRED
        to: AMENDMENT_FILED
        trigger: "POST /public-offering-statements/{id}/amendments"
        actor: ConverterSponsor
        preconditions:
          - "pos.status == AMENDMENT_REQUIRED"
        side_effects:
          - "sets PublicOfferingStatement.status = AMENDMENT_FILED and increments amendment_count
            by 1; when material_change == true, applies the same hop 2 / hop 3 / hop 4 chain
            described on the EFFECTIVE -> AMENDMENT_FILED edge"
          - "increments PublicOfferingStatement.version by 1"
      - from: AMENDMENT_FILED
        to: EFFECTIVE
        trigger: "POST /public-offering-statements/{id}/effectiveness"
        actor: StateRegulator
        preconditions:
          - "pos.status == AMENDMENT_FILED"
          - "complete_section_count == 9"
          - "ConversionProject.posture != FROZEN"
          - "the DeclarationPackage at pos.declaration_package_id has status == RECORDED"
        side_effects:
          - "sets PublicOfferingStatement.status = EFFECTIVE and effective_at = logical clock"
          - "moves ConversionProject.status REGISTRATION -> PRESALE and recomputes posture"
          - "increments PublicOfferingStatement.version by 1"
        note: "Closes the EFFECTIVE -> AMENDMENT_FILED -> EFFECTIVE amendment cycle; amendment
          rounds are unbounded and amendment_count records the round number."

  # ---- TenantHousehold carries THREE independent dimensions that evolve on the same row. ----
  - entity: TenantHousehold
    state_field: notice_status
    initial_state: PRE_NOTICE
    terminal_states: [VACATED, HOLDOVER, NOTICE_WITHDRAWN]
    transitions:
      - from: PRE_NOTICE
        to: NOTICE_SERVED
        trigger: "POST /tenant-households/{id}/notices"
        actor: ConverterSponsor
        preconditions:
          - "household.notice_status == PRE_NOTICE"
          - "the project's DeclarationPackage has status IN {PLAT_CERTIFIED, RECORDED}"
          - "household.occupied_unit_id is not null and that Unit.declaration_status == INCLUDED"
          - "ConversionProject.posture != FROZEN"
        side_effects:
          - "runs calculations.tenant_notice_and_relocation; sets notice_served_at,
            notice_period_days, vacate_deadline_at, rofr_expires_at and
            relocation_assistance_cents"
          - "sets rofr_status NOT_OFFERED -> OFFERED"
          - "sets relocation_status NOT_OWED -> ACCRUED"
          - "adds relocation_assistance_cents to
            ConversionProject.relocation_obligation_accrued_cents and to
            ConversionProject.relocation_outstanding_cents"
          - "increments TenantHousehold.version by 1"
      - from: NOTICE_SERVED
        to: VACATE_DUE
        trigger: "POST /conversion-projects/{id}/posture-recalculations (system sweep)"
        actor: system
        preconditions:
          - "household.notice_status == NOTICE_SERVED"
          - "current logical clock >= household.vacate_deadline_at"
        side_effects:
          - "sets notice_status = VACATE_DUE"
          - "increments TenantHousehold.version by 1"
      - from: VACATE_DUE
        to: VACATED
        trigger: "POST /tenant-households/{id}/occupancy-outcomes with outcome == VACATED"
        actor: ConverterSponsor
        preconditions:
          - "household.notice_status == VACATE_DUE"
          - "household.relocation_status IN {PAID, REVERSED}"
        side_effects:
          - "sets notice_status = VACATED"
          - "increments TenantHousehold.version by 1"
      - from: VACATE_DUE
        to: HOLDOVER
        trigger: "POST /tenant-households/{id}/occupancy-outcomes with outcome == HOLDOVER"
        actor: ConverterSponsor
        preconditions:
          - "household.notice_status == VACATE_DUE"
        side_effects:
          - "sets notice_status = HOLDOVER"
          - "recomputes ConversionProject.posture; a project with any household in HOLDOVER can
            never evaluate to OPEN"
          - "increments TenantHousehold.version by 1"
        note: "Branch sibling of VACATE_DUE -> VACATED with a disjoint side-effect set: HOLDOVER
          gates the project posture, VACATED does not, and VACATED additionally requires the
          relocation obligation to be settled first."
      - from: NOTICE_SERVED
        to: NOTICE_WITHDRAWN
        trigger: "POST /tenant-households/{id}/rofr-responses with response == EXERCISE (system)"
        actor: system
        preconditions:
          - "household.notice_status == NOTICE_SERVED"
          - "household.rofr_status moved OFFERED -> EXERCISED in this request"
        side_effects:
          - "sets notice_status = NOTICE_WITHDRAWN and vacate_deadline_at = null"
          - "increments TenantHousehold.version by 1"

  - entity: TenantHousehold
    state_field: rofr_status
    initial_state: NOT_OFFERED
    terminal_states: [EXERCISED, WAIVED, EXPIRED]
    transitions:
      - from: NOT_OFFERED
        to: OFFERED
        trigger: "POST /tenant-households/{id}/notices"
        actor: ConverterSponsor
        preconditions:
          - "household.rofr_status == NOT_OFFERED"
          - "household.notice_status moved PRE_NOTICE -> NOTICE_SERVED in this request"
        side_effects:
          - "sets rofr_status = OFFERED and rofr_expires_at = notice_served_at + 90 days"
          - "increments TenantHousehold.version by 1"
      - from: OFFERED
        to: EXERCISED
        trigger: "POST /tenant-households/{id}/rofr-responses with response == EXERCISE"
        actor: TenantOccupant
        preconditions:
          - "household.rofr_status == OFFERED"
          - "current logical clock <= household.rofr_expires_at"
          - "household.occupied_unit_id is not null and that Unit.declaration_status == INCLUDED"
          - "X-User-ID == household.id"
        side_effects:
          - "sets rofr_status = EXERCISED"
          - "sets notice_status NOTICE_SERVED -> NOTICE_WITHDRAWN"
          - "sets relocation_status ACCRUED -> REVERSED or PAID -> REVERSED (compensation), moving
            the household's obligation into ConversionProject.relocation_reversed_cents"
          - "increments TenantHousehold.version by 1"
      - from: OFFERED
        to: WAIVED
        trigger: "POST /tenant-households/{id}/rofr-responses with response == WAIVE"
        actor: TenantOccupant
        preconditions:
          - "household.rofr_status == OFFERED"
          - "current logical clock <= household.rofr_expires_at"
          - "X-User-ID == household.id"
        side_effects:
          - "sets rofr_status = WAIVED"
          - "leaves notice_status and relocation_status unchanged"
          - "increments TenantHousehold.version by 1"
        note: "Branch sibling of OFFERED -> EXERCISED whose side-effect set is disjoint: waiving
          preserves the notice clock and the relocation obligation, exercising cancels both."
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /conversion-projects/{id}/posture-recalculations (system sweep)"
        actor: system
        preconditions:
          - "household.rofr_status == OFFERED"
          - "current logical clock > household.rofr_expires_at"
        side_effects:
          - "sets rofr_status = EXPIRED"
          - "increments TenantHousehold.version by 1"

  - entity: TenantHousehold
    state_field: relocation_status
    initial_state: NOT_OWED
    terminal_states: [REVERSED]
    transitions:
      - from: NOT_OWED
        to: ACCRUED
        trigger: "POST /tenant-households/{id}/notices"
        actor: ConverterSponsor
        preconditions:
          - "household.relocation_status == NOT_OWED"
          - "household.notice_status moved PRE_NOTICE -> NOTICE_SERVED in this request"
        side_effects:
          - "sets relocation_status = ACCRUED and relocation_assistance_cents per
            calculations.tenant_notice_and_relocation"
          - "increments ConversionProject.relocation_obligation_accrued_cents and
            relocation_outstanding_cents by relocation_assistance_cents"
          - "increments TenantHousehold.version by 1"
      - from: ACCRUED
        to: PAID
        trigger: "POST /tenant-households/{id}/relocation-disbursements"
        actor: EscrowAgent
        preconditions:
          - "household.relocation_status == ACCRUED"
          - "request amount_cents == household.relocation_assistance_cents exactly"
          - "household.notice_status IN {NOTICE_SERVED, VACATE_DUE}"
        side_effects:
          - "sets relocation_status = PAID and relocation_paid_cents = amount_cents"
          - "adds amount_cents to ConversionProject.relocation_paid_cents and subtracts it from
            ConversionProject.relocation_outstanding_cents"
          - "increments TenantHousehold.version by 1"
      - from: ACCRUED
        to: REVERSED
        trigger: "POST /tenant-households/{id}/rofr-responses with response == EXERCISE (system)"
        actor: system
        preconditions:
          - "household.relocation_status == ACCRUED"
          - "household.rofr_status moved OFFERED -> EXERCISED in this request"
        side_effects:
          - "sets relocation_status = REVERSED and relocation_reversed_cents =
            relocation_assistance_cents"
          - "adds relocation_assistance_cents to ConversionProject.relocation_reversed_cents and
            subtracts it from ConversionProject.relocation_outstanding_cents"
          - "increments TenantHousehold.version by 1"
      - from: PAID
        to: REVERSED
        trigger: "POST /tenant-households/{id}/rofr-responses with response == EXERCISE (system)"
        actor: system
        preconditions:
          - "household.relocation_status == PAID"
          - "household.rofr_status moved OFFERED -> EXERCISED in this request"
        side_effects:
          - "sets relocation_status = REVERSED, relocation_reversed_cents =
            relocation_paid_cents, then relocation_paid_cents = 0"
          - "subtracts the recovered amount from ConversionProject.relocation_paid_cents and adds
            it to ConversionProject.relocation_reversed_cents"
          - "increments TenantHousehold.version by 1"
        note: "Compensating edge for the ACCRUED -> PAID disbursement; the conserved identity
          accrued == paid + reversed + outstanding must hold before and after."

  # ---- PurchaseAgreement carries TWO independent dimensions on the same row. ----
  - entity: PurchaseAgreement
    state_field: contract_status
    initial_state: SIGNED
    terminal_states: [CLOSED, RESCINDED, VOID]
    transitions:
      - from: SIGNED
        to: HARD
        trigger: "POST /purchase-agreements/{id}/hardening"
        actor: EscrowAgent
        preconditions:
          - "agreement.contract_status == SIGNED"
          - "agreement.pos_delivered_at is not null"
          - "current logical clock >= agreement.rescission_deadline_at (inclusive boundary)"
          - "agreement.escrow_status == FUNDED"
          - "ConversionProject.posture != FROZEN"
        side_effects:
          - "sets contract_status = HARD"
          - "sets Unit.sale_status UNDER_CONTRACT -> HARD_CONTRACT"
          - "recomputes the assigned ClosingBatch.qualifying_agreement_count and presale_pct via
            calculations.presale_threshold_evaluation; a batch with status == THRESHOLD_SHORT that
            now satisfies both thresholds moves to THRESHOLD_MET"
          - "increments PurchaseAgreement.version by 1"
      - from: HARD
        to: SIGNED
        trigger: "POST /public-offering-statements/{id}/amendments with material_change == true
          (system, hop 2 of the material_amendment_chain cascade)"
        actor: system
        preconditions:
          - "agreement.contract_status == HARD"
          - "agreement.closed_at is null"
          - "the project's PublicOfferingStatement recorded a new last_material_amendment_at in
            this request"
        side_effects:
          - "sets contract_status = SIGNED"
          - "sets rescission_deadline_at per the restart clause of
            calculations.rescission_deadline and increments rescission_restart_count by 1"
          - "sets Unit.sale_status HARD_CONTRACT -> UNDER_CONTRACT"
          - "increments PurchaseAgreement.version by 1"
        note: "Closes the SIGNED -> HARD -> SIGNED cycle: a material amendment revives the
          purchaser's statutory rescission right on an already-hardened contract."
      - from: SIGNED
        to: RESCINDED
        trigger: "POST /purchase-agreements/{id}/rescission"
        actor: Purchaser
        preconditions:
          - "agreement.contract_status == SIGNED"
          - "agreement.pos_delivered_at is not null"
          - "current logical clock < agreement.rescission_deadline_at (strict)"
          - "X-User-ID == agreement.id"
        side_effects:
          - "hop 1: sets contract_status = RESCINDED and moves escrow_status FUNDED -> REFUNDED
            (no-op when escrow_status == PENDING)"
          - "hop 2 (caused by escrow_status leaving FUNDED): subtracts deposit_cents from
            ConversionProject.escrow_balance_cents, adds it to
            ConversionProject.escrow_refunded_cents, and recomputes Unit.sale_status to UNSOLD
            because the unit has no PurchaseAgreement with contract_status IN
            {SIGNED, HARD, CLOSED} left"
          - "hop 3 (caused by hop 2 removing the agreement from the qualifying population): the
            assigned ClosingBatch recomputes qualifying_agreement_count and presale_pct; when
            presale_pct < min_presale_threshold_pct or qualifying_agreement_count <
            min_absolute_unit_count and batch.status IN {THRESHOLD_MET, RELEASED}, the batch moves
            to THRESHOLD_SHORT"
          - "hop 4 (caused by hop 3 for a batch that left RELEASED): ConversionProject.status
            CLOSINGS -> PRESALE and ConversionProject.posture -> RESTRICTED"
          - "increments PurchaseAgreement.version by 1"
      - from: SIGNED
        to: VOID
        trigger: "POST /units/{id}/withdraw (system)"
        actor: system
        preconditions:
          - "agreement.contract_status == SIGNED"
          - "agreement.unit_id == the withdrawn Unit.id"
        side_effects:
          - "sets contract_status = VOID and moves escrow_status FUNDED -> REFUNDED"
          - "subtracts deposit_cents from ConversionProject.escrow_balance_cents and adds it to
            ConversionProject.escrow_refunded_cents"
          - "increments PurchaseAgreement.version by 1"
      - from: HARD
        to: VOID
        trigger: "POST /units/{id}/withdraw (system)"
        actor: system
        preconditions:
          - "agreement.contract_status == HARD"
          - "agreement.unit_id == the withdrawn Unit.id"
        side_effects:
          - "sets contract_status = VOID and moves escrow_status FUNDED -> REFUNDED"
          - "subtracts deposit_cents from ConversionProject.escrow_balance_cents and adds it to
            ConversionProject.escrow_refunded_cents"
          - "increments PurchaseAgreement.version by 1"
      - from: HARD
        to: CLOSED
        trigger: "POST /purchase-agreements/{id}/closing"
        actor: EscrowAgent
        preconditions:
          - "agreement.contract_status == HARD"
          - "agreement.closing_batch_id is not null"
          - "the assigned ClosingBatch.status == RELEASED"
          - "ClosingBatch.window_start_at <= current logical clock < ClosingBatch.window_end_at"
          - "agreement.escrow_status == FUNDED"
          - "the project's DeclarationPackage.status == RECORDED"
          - "ConversionProject.posture != FROZEN"
        side_effects:
          - "sets contract_status = CLOSED and closed_at = current logical clock"
          - "moves escrow_status FUNDED -> DISBURSED, subtracting deposit_cents from
            ConversionProject.escrow_balance_cents and adding it to
            ConversionProject.escrow_disbursed_cents"
          - "sets Unit.sale_status = SOLD"
          - "bubbles up ConversionProject CLOSINGS -> COMPLETED when every INCLUDED Unit has
            sale_status == SOLD, which in turn sets every RELEASED ClosingBatch to SETTLED"
          - "increments PurchaseAgreement.version by 1"

  - entity: PurchaseAgreement
    state_field: escrow_status
    initial_state: PENDING
    terminal_states: [REFUNDED, DISBURSED]
    transitions:
      - from: PENDING
        to: FUNDED
        trigger: "POST /purchase-agreements/{id}/escrow-deposits"
        actor: EscrowAgent
        preconditions:
          - "agreement.escrow_status == PENDING"
          - "agreement.contract_status == SIGNED"
          - "request amount_cents == agreement.deposit_cents exactly"
        side_effects:
          - "sets escrow_status = FUNDED"
          - "adds deposit_cents to ConversionProject.escrow_balance_cents and to
            ConversionProject.escrow_deposits_received_cents"
          - "recomputes the assigned ClosingBatch.qualifying_agreement_count and presale_pct"
          - "increments PurchaseAgreement.version by 1"
      - from: FUNDED
        to: REFUNDED
        trigger: "POST /purchase-agreements/{id}/rescission or POST /units/{id}/withdraw (system)"
        actor: system
        preconditions:
          - "agreement.escrow_status == FUNDED"
          - "agreement.contract_status moved to RESCINDED or VOID in this request"
        side_effects:
          - "sets escrow_status = REFUNDED"
          - "subtracts deposit_cents from ConversionProject.escrow_balance_cents and adds it to
            ConversionProject.escrow_refunded_cents"
          - "increments PurchaseAgreement.version by 1"
      - from: FUNDED
        to: DISBURSED
        trigger: "POST /purchase-agreements/{id}/closing (system)"
        actor: system
        preconditions:
          - "agreement.escrow_status == FUNDED"
          - "agreement.contract_status moved HARD -> CLOSED in this request"
        side_effects:
          - "sets escrow_status = DISBURSED"
          - "subtracts deposit_cents from ConversionProject.escrow_balance_cents and adds it to
            ConversionProject.escrow_disbursed_cents"
          - "increments PurchaseAgreement.version by 1"

  - entity: ClosingBatch
    state_field: status
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: OPEN_FOR_ASSIGNMENT
        trigger: "POST /closing-batches/{id}/agreement-assignments (first assignment)"
        actor: EscrowAgent
        preconditions:
          - "batch.status == DRAFT"
          - "the assigned PurchaseAgreement.conversion_project_id == batch.conversion_project_id"
          - "the assigned PurchaseAgreement.closing_batch_id is null"
        side_effects:
          - "sets batch.status = OPEN_FOR_ASSIGNMENT"
          - "sets PurchaseAgreement.closing_batch_id = batch.id"
          - "increments batch.assigned_agreement_count by 1 and recomputes
            qualifying_agreement_count and presale_pct"
          - "increments ClosingBatch.version by 1"
      - from: OPEN_FOR_ASSIGNMENT
        to: THRESHOLD_MET
        trigger: "POST /closing-batches/{id}/threshold-evaluations"
        actor: EscrowAgent
        preconditions:
          - "batch.status == OPEN_FOR_ASSIGNMENT"
          - "ConversionProject.included_unit_count >= 1"
          - "calculations.presale_threshold_evaluation returns met == true"
        side_effects:
          - "sets batch.status = THRESHOLD_MET, presale_pct and last_evaluated_at"
          - "increments ClosingBatch.version by 1"
      - from: OPEN_FOR_ASSIGNMENT
        to: THRESHOLD_SHORT
        trigger: "POST /closing-batches/{id}/threshold-evaluations"
        actor: EscrowAgent
        preconditions:
          - "batch.status == OPEN_FOR_ASSIGNMENT"
          - "ConversionProject.included_unit_count >= 1"
          - "calculations.presale_threshold_evaluation returns met == false"
        side_effects:
          - "sets batch.status = THRESHOLD_SHORT, presale_pct and last_evaluated_at"
          - "recomputes ConversionProject.posture; a project with any ClosingBatch in
            THRESHOLD_SHORT can never evaluate to OPEN"
          - "increments ClosingBatch.version by 1"
      - from: THRESHOLD_SHORT
        to: THRESHOLD_MET
        trigger: "POST /closing-batches/{id}/threshold-evaluations, or
          POST /purchase-agreements/{id}/hardening (system)"
        actor: EscrowAgent
        preconditions:
          - "batch.status == THRESHOLD_SHORT"
          - "calculations.presale_threshold_evaluation returns met == true"
        side_effects:
          - "sets batch.status = THRESHOLD_MET, presale_pct and last_evaluated_at"
          - "recomputes ConversionProject.posture"
          - "increments ClosingBatch.version by 1"
      - from: THRESHOLD_MET
        to: THRESHOLD_SHORT
        trigger: "POST /purchase-agreements/{id}/rescission, POST /units/{id}/withdraw, or
          POST /public-offering-statements/{id}/amendments with material_change == true (system)"
        actor: system
        preconditions:
          - "batch.status == THRESHOLD_MET"
          - "calculations.presale_threshold_evaluation returns met == false after the triggering
            mutation"
        side_effects:
          - "sets batch.status = THRESHOLD_SHORT, presale_pct and last_evaluated_at"
          - "recomputes ConversionProject.posture -> RESTRICTED"
          - "increments ClosingBatch.version by 1"
        note: "Closes the THRESHOLD_MET -> THRESHOLD_SHORT -> THRESHOLD_MET cycle."
      - from: THRESHOLD_MET
        to: RELEASED
        trigger: "POST /closing-batches/{id}/release"
        actor: EscrowAgent
        preconditions:
          - "batch.status == THRESHOLD_MET"
          - "the project's DeclarationPackage.status == RECORDED"
          - "the project's PublicOfferingStatement.status == EFFECTIVE"
          - "every assigned PurchaseAgreement has contract_status IN {HARD, CLOSED}"
          - "ConversionProject.posture == OPEN"
          - "no other ClosingBatch of the project has status == RELEASED"
        side_effects:
          - "sets batch.status = RELEASED and released_at = current logical clock"
          - "moves ConversionProject.status PRESALE -> CLOSINGS"
          - "increments ClosingBatch.version by 1"
      - from: RELEASED
        to: THRESHOLD_SHORT
        trigger: "POST /purchase-agreements/{id}/rescission or
          POST /public-offering-statements/{id}/amendments with material_change == true (system)"
        actor: system
        preconditions:
          - "batch.status == RELEASED"
          - "calculations.presale_threshold_evaluation returns met == false after the triggering
            mutation"
        side_effects:
          - "sets batch.status = THRESHOLD_SHORT, released_at = null, presale_pct and
            last_evaluated_at"
          - "moves ConversionProject.status CLOSINGS -> PRESALE and posture -> RESTRICTED"
          - "increments ClosingBatch.version by 1"
      - from: RELEASED
        to: SETTLED
        trigger: "POST /purchase-agreements/{id}/closing (system, on project completion)"
        actor: system
        preconditions:
          - "batch.status == RELEASED"
          - "ConversionProject.status moved CLOSINGS -> COMPLETED in this request"
        side_effects:
          - "sets batch.status = SETTLED"
          - "increments ClosingBatch.version by 1"

  - entity: WarrantyClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, CLOSED]
    transitions:
      - from: SUBMITTED
        to: TRIAGED_ADMISSIBLE
        trigger: "POST /warranty-claims/{id}/triage with decision == ADMIT"
        actor: ConverterSponsor
        preconditions:
          - "claim.status == SUBMITTED"
          - "current logical clock <= claim.warranty_expires_at (inclusive boundary)"
          - "the Unit at claim.reported_by_unit_id has sale_status == SOLD"
        side_effects:
          - "sets claim.status = TRIAGED_ADMISSIBLE and triage_outcome = ADMISSIBLE"
          - "sets claim.accrued_charge_cents per calculations.warranty_charge_and_window and adds
            it to ConversionProject.warranty_reserve_charge_cents"
          - "increments WarrantyClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/triage with decision == DENY"
        actor: ConverterSponsor
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "sets claim.status = DENIED, triage_outcome = DENIED and accrued_charge_cents = 0"
          - "leaves ConversionProject.warranty_reserve_charge_cents unchanged"
          - "increments WarrantyClaim.version by 1"
        note: "Branch sibling of SUBMITTED -> TRIAGED_ADMISSIBLE with a disjoint side-effect set:
          DENY never touches the project's warranty charge ledger and requires no unit-sale check."
      - from: TRIAGED_ADMISSIBLE
        to: REMEDIATION_SCHEDULED
        trigger: "POST /warranty-claims/{id}/remediation-schedule"
        actor: ConverterSponsor
        preconditions:
          - "claim.status == TRIAGED_ADMISSIBLE"
          - "remediation_end_at >= remediation_start_at"
          - "no other WarrantyClaim on the SAME major_component_id with status IN
            {REMEDIATION_SCHEDULED, REMEDIATED} has a closed window that collides under
            calculations.warranty_charge_and_window overlap clause (closed intervals plus a
            REMEDIATION_COOLDOWN_HOURS buffer after each end)"
          - "at no instant inside the requested window does the count of project WarrantyClaims
            with status IN {REMEDIATION_SCHEDULED, REMEDIATED} whose closed windows contain that
            instant reach ConversionProject.max_overlapping_remediations"
        side_effects:
          - "sets claim.status = REMEDIATION_SCHEDULED, remediation_start_at and remediation_end_at"
          - "increments WarrantyClaim.version by 1"
      - from: REMEDIATION_SCHEDULED
        to: REMEDIATED
        trigger: "POST /warranty-claims/{id}/completion"
        actor: ConverterSponsor
        preconditions:
          - "claim.status == REMEDIATION_SCHEDULED"
          - "current logical clock > claim.remediation_end_at (strict; the closed window must be
            fully in the past)"
        side_effects:
          - "sets claim.status = REMEDIATED"
          - "increments WarrantyClaim.version by 1"
      - from: REMEDIATED
        to: REOPENED
        trigger: "POST /warranty-claims/{id}/reopening"
        actor: ConverterSponsor
        preconditions:
          - "claim.status == REMEDIATED"
          - "current logical clock <= claim.warranty_expires_at"
          - "claim.reopen_count < MAX_CLAIM_REOPENS (2)"
        side_effects:
          - "sets claim.status = REOPENED, increments reopen_count by 1, and clears
            remediation_start_at and remediation_end_at to null so the component's window
            occupation is released"
          - "increments WarrantyClaim.version by 1"
      - from: REOPENED
        to: TRIAGED_ADMISSIBLE
        trigger: "POST /warranty-claims/{id}/triage with decision == ADMIT"
        actor: ConverterSponsor
        preconditions:
          - "claim.status == REOPENED"
          - "current logical clock <= claim.warranty_expires_at"
        side_effects:
          - "sets claim.status = TRIAGED_ADMISSIBLE"
          - "adds the delta from calculations.warranty_charge_and_window reopen clause to
            claim.accrued_charge_cents and to ConversionProject.warranty_reserve_charge_cents"
          - "increments WarrantyClaim.version by 1"
        note: "Closes the TRIAGED_ADMISSIBLE -> REMEDIATION_SCHEDULED -> REMEDIATED -> REOPENED ->
          TRIAGED_ADMISSIBLE cycle, bounded at MAX_CLAIM_REOPENS reopen rounds."
      - from: REMEDIATED
        to: CLOSED
        trigger: "POST /conversion-projects/{id}/posture-recalculations (system sweep)"
        actor: system
        preconditions:
          - "claim.status == REMEDIATED"
          - "current logical clock > claim.warranty_expires_at"
        side_effects:
          - "sets claim.status = CLOSED"
          - "increments WarrantyClaim.version by 1"

concurrency_rules:
  - rule_id: agreement-create-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /units/{id}/purchase-agreements"
    occ_field: "expected_unit_version"
    description: |
      Recording a PurchaseAgreement against a Unit whose version has advanced since the client
      last read it is rejected with a stale-version error. A unit whose previous agreement moved to
      RESCINDED or VOID legitimately accepts a fresh agreement, so the operation itself is valid
      from the same observable unit state; the OCC check exists because the accepted supersede
      also rewrote Unit.sale_status, percentage_interest_bp and unit_annual_assessment_cents, and a
      writer holding the earlier version has not seen those rewrites.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: suitability-create-stale-report
    parent_entity: EngineeringReport
    write_endpoint: "POST /engineering-reports/{id}/suitability-assessments"
    occ_field: "expected_engineering_report_version"
    description: |
      Creating a SuitabilityAssessment against an EngineeringReport whose version has advanced
      since the client last read it is rejected with a stale-version error. A new assessment
      legitimately supersedes the prior EFFECTIVE assessment on the same report, so the create is
      valid from the same observable report state; the OCC check exists because the supersede also
      rewrote ConversionProject.suitability_gate and suitability_score off the superseded row.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

  - rule_id: budget-create-stale-project
    parent_entity: ConversionProject
    write_endpoint: "POST /conversion-projects/{id}/initial-budgets"
    occ_field: "expected_conversion_project_version"
    description: |
      Creating an InitialBudget against a ConversionProject whose version has advanced since the
      client last read it is rejected with a stale-version error. A new budget legitimately
      supersedes the prior DRAFT budget of the same project, so the create is valid from the same
      observable project state; the OCC check exists because the supersede re-derives
      assessment_income_cents from the current INCLUDED Unit set, which a stale writer has not
      seen.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: assignment-create-stale-batch
    parent_entity: ClosingBatch
    write_endpoint: "POST /closing-batches/{id}/agreement-assignments"
    occ_field: "expected_closing_batch_version"
    description: |
      Assigning a PurchaseAgreement to a ClosingBatch whose version has advanced since the client
      last read it is rejected with a stale-version error. Assigning a further agreement to the
      same batch is legitimate from the same observable batch state, so this is not a state
      precondition; the OCC check exists because each accepted assignment rewrites
      qualifying_agreement_count and presale_pct, and a stale writer is deciding batch composition
      from an outdated threshold picture.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

calculations:
  - name: building_suitability_score
    trigger: "POST /engineering-reports/{id}/suitability-assessments (writes
      SuitabilityAssessment.score, basis, critical_cap_applied, verdict and projects
      ConversionProject.suitability_gate / suitability_score)"
    algorithm: weighted_scoring
    formula: |
      # Population (pinned): child MajorComponents of the report with
      #   verification_status == VERIFIED. No other filter.
      C = [c for c in MajorComponent where c.engineering_report_id == report.id
                                       and c.verification_status == VERIFIED]

      # Empty-population fallback (pinned, no error):
      if len(C) == 0:
          basis = NO_VERIFIED_COMPONENTS
          score = 0.00
          critical_cap_applied = false
          verdict = FAILED            # 0.00 < SUITABILITY_PASS_SCORE
          return
      basis = VERIFIED_COMPONENTS

      cost_total = sum(c.replacement_cost_cents for c in C)

      # Zero-cost fallback (pinned): when cost_total == 0 every component carries equal weight.
      for c in C:
          if cost_total == 0:
              cost_weight_c = 1 / len(C)                       # exact rational, not rounded here
          else:
              cost_weight_c = c.replacement_cost_cents / cost_total

          rul_years_c = c.remaining_useful_life_years          # AS_INSPECTED variant
          rul_factor_c = min(1.0, max(0.0, rul_years_c / RUL_HORIZON_YEARS))
          penalty_c    = CONDITION_PENALTY[c.condition_rating]
          contribution_c = cost_weight_c * max(0.0, rul_factor_c - penalty_c)

      raw = sum(contribution_c for c in C)                     # exact rational accumulation

      # Life-safety critical cap (threshold branch, evaluated AFTER the sum, BEFORE rounding):
      critical_cap_applied = any(c.is_life_safety == true
                                 and c.remaining_useful_life_years < CRITICAL_RUL_YEARS
                                 for c in C)
      if critical_cap_applied:
          raw = min(raw, CRITICAL_CAP_RATIO)

      # Rounding order (pinned): accumulate contributions exactly, scale once, round once.
      score = round_half_up(raw * 100, 2)

      verdict = PASSED if score >= SUITABILITY_PASS_SCORE else FAILED
    input_set: "Child MajorComponents of the target EngineeringReport with verification_status ==
      VERIFIED. UNVERIFIED components are excluded entirely (they neither add weight nor
      denominator). Components of sibling or SUPERSEDED reports are never included."
    constants:
      RUL_HORIZON_YEARS: 30
      CRITICAL_RUL_YEARS: 5
      CRITICAL_CAP_RATIO: 0.40
      SUITABILITY_PASS_SCORE: 62.50
      CONDITION_PENALTY_EXCELLENT: 0.00
      CONDITION_PENALTY_GOOD: 0.05
      CONDITION_PENALTY_FAIR: 0.15
      CONDITION_PENALTY_POOR: 0.35
      POST_REMEDIATION_PENALTY_FLOOR: 0.05
    precision: "score: 2 decimal places, round_half_up, applied exactly once to raw * 100"
    variants:
      - name: AS_INSPECTED
        when: "request field variant == AS_INSPECTED"
        difference: "rul_years_c = c.remaining_useful_life_years and penalty_c =
          CONDITION_PENALTY[c.condition_rating]"
      - name: POST_REMEDIATION
        when: "request field variant == POST_REMEDIATION"
        difference: "rul_years_c = c.remaining_useful_life_years +
          c.planned_remediation_gain_years, and penalty_c =
          min(CONDITION_PENALTY[c.condition_rating], POST_REMEDIATION_PENALTY_FLOOR); the critical
          cap test also uses the extended rul_years_c, so a component remediated above
          CRITICAL_RUL_YEARS no longer triggers the cap. Identical component rows therefore yield a
          strictly higher score under POST_REMEDIATION whenever any component has
          planned_remediation_gain_years > 0 or condition_rating IN {FAIR, POOR}."

  - name: reserve_funding_requirement
    trigger: "POST /conversion-projects/{id}/reserve-studies (writes
      ReserveStudy.fully_funded_balance_cents, recommended_annual_contribution_cents,
      percent_funded_bp and funding_status)"
    algorithm: waterfall_allocation
    formula: |
      # Population (pinned): MajorComponents of the study's engineering_report_id with
      #   verification_status == VERIFIED, ordered created_at ASC for all per-component loops.
      C = [c for c in MajorComponent where c.engineering_report_id == study.engineering_report_id
                                       and c.verification_status == VERIFIED]
      if len(C) == 0:
          reject with ERR_NO_VERIFIED_COMPONENTS

      # ---- fully funded balance (shared by both methods) ----
      # Rounding order (pinned): round EACH component to whole cents, THEN sum.
      for c in C (created_at ASC):
          denom_c = c.effective_age_years + c.remaining_useful_life_years
          ffb_c = 0 if denom_c == 0 else round_half_up(
                      c.replacement_cost_cents * c.effective_age_years / denom_c)
      fully_funded_balance_cents = sum(ffb_c)

      # ---- COMPONENT_METHOD ----
      for c in C (created_at ASC):
          unfunded_c = c.replacement_cost_cents * (10000 - c.funded_pct_bp) / 10000
          years_c    = max(1, c.remaining_useful_life_years)
          annual_c   = ceil_to_cent(unfunded_c / years_c)     # ceiling per component, then sum
      recommended_annual_contribution_cents = sum(annual_c)

      # ---- CASH_FLOW_METHOD ----
      # Threshold floor the account must never breach at any year end in the horizon.
      threshold_floor_cents = CASH_FLOW_FLOOR_PER_UNIT_CENTS * project.total_unit_count
      # Expenditure schedule: each component is replaced at year y_c = max(1, RUL) at full
      # replacement_cost_cents; components with RUL > CASH_FLOW_HORIZON_YEARS are excluded.
      cum(y) = sum(c.replacement_cost_cents for c in C
                   where max(1, c.remaining_useful_life_years) <= y)
      required = 0
      for y in 1..CASH_FLOW_HORIZON_YEARS:                      # ascending, deterministic
          need_y = ceil_to_cent(
                     (threshold_floor_cents + cum(y) - study.opening_reserve_balance_cents) / y)
          required = max(required, need_y)
      recommended_annual_contribution_cents = max(0, required)

      # ---- shared tail ----
      if fully_funded_balance_cents == 0:
          percent_funded_bp = 0
      else:
          percent_funded_bp = round_half_up(
              10000 * study.opening_reserve_balance_cents / fully_funded_balance_cents)
      funding_status = ADEQUATE if percent_funded_bp >= PERCENT_FUNDED_ADEQUATE_BP else UNDERFUNDED
    input_set: "VERIFIED MajorComponents of the study's referenced EngineeringReport (which must be
      in status ACCEPTED). UNVERIFIED components and components of other reports are excluded.
      Only the CASH_FLOW_METHOD additionally excludes components whose
      max(1, remaining_useful_life_years) exceeds CASH_FLOW_HORIZON_YEARS."
    constants:
      CASH_FLOW_HORIZON_YEARS: 30
      CASH_FLOW_FLOOR_PER_UNIT_CENTS: 25000
      PERCENT_FUNDED_ADEQUATE_BP: 7000
    precision: "all cent amounts are whole integers; per-component amounts are rounded before
      summation (round_half_up for the fully funded balance, ceiling for annual contributions);
      percent_funded_bp is round_half_up to a whole basis point"
    variants:
      - name: COMPONENT_METHOD
        when: "ReserveStudy.method == COMPONENT_METHOD"
        difference: "Funds each component independently: unfunded replacement cost spread straight
          line over its own remaining useful life, ceiling-rounded per component then summed. It
          ignores the opening balance entirely and ignores the horizon, so a component with
          remaining_useful_life_years == 45 still generates an annual charge."
      - name: CASH_FLOW_METHOD
        when: "ReserveStudy.method == CASH_FLOW_METHOD"
        difference: "Solves for the single smallest level annual contribution that keeps the pooled
          account at or above threshold_floor_cents at every year end in the 30-year horizon; it
          consumes the opening balance and drops components maturing beyond the horizon. For the
          same component set these two methods return different
          recommended_annual_contribution_cents whenever any component's remaining useful life
          differs from another's or opening_reserve_balance_cents > 0."

  - name: initial_budget_developer_deficit
    trigger: "POST /conversion-projects/{id}/initial-budgets (writes InitialBudget.base_expense_cents,
      management_fee_bp, management_fee_cents, total_annual_expense_cents,
      assessment_income_cents, developer_deficit_funding_cents, developer_subsidy_flag)"
    algorithm: constraint_propagation
    formula: |
      # This is the circular-looking dependency of the scaffold: the management fee is a
      # percentage of the expense base, the tier of that percentage is keyed on the expense base,
      # and the disclosed total includes the fee. The evaluation order below is PINNED and is
      # executed exactly once - there is no re-tiering pass and no fixed-point iteration.

      step 1: reserve_contribution_cents = ReserveStudy(study_id).recommended_annual_contribution_cents
      step 2: base_expense_cents = annual_operating_expense_cents + reserve_contribution_cents
      step 3: tier selection on base_expense_cents ONLY (never on the total):
                base_expense_cents <  MGMT_TIER_1_CEILING_CENTS                -> management_fee_bp = 800
                MGMT_TIER_1_CEILING_CENTS <= base_expense_cents
                                          <  MGMT_TIER_2_CEILING_CENTS         -> management_fee_bp = 650
                base_expense_cents >= MGMT_TIER_2_CEILING_CENTS                -> management_fee_bp = 500
      step 4: management_fee_cents = round_half_up(base_expense_cents * management_fee_bp / 10000)
      step 5: total_annual_expense_cents = base_expense_cents + management_fee_cents
      step 6: NO RE-TIERING. Even when total_annual_expense_cents crosses a tier ceiling that
              base_expense_cents did not, management_fee_bp and management_fee_cents keep the
              step 3 / step 4 values.
      step 7: run calculations.unit_assessment_allocation with
              total_annual_expense_cents as its input total, then
              assessment_income_cents = sum(u.unit_annual_assessment_cents
                                            for u in Unit where u.conversion_project_id == project.id
                                                            and u.declaration_status == INCLUDED)
      step 8: developer_deficit_funding_cents = max(0, total_annual_expense_cents - assessment_income_cents)
      step 9: developer_subsidy_flag = (developer_deficit_funding_cents > 0)
    input_set: "The referenced ReserveStudy (any adoption_status; its
      recommended_annual_contribution_cents is copied at creation) plus Units of the project with
      declaration_status == INCLUDED. WITHDRAWN units contribute no assessment income."
    constants:
      MGMT_TIER_1_CEILING_CENTS: 12000000
      MGMT_TIER_2_CEILING_CENTS: 30000000
    precision: "management_fee_cents: whole cents, round_half_up, computed once in step 4;
      all other amounts are integer cents"
    variants:
      - name: SINGLE_PASS_BASE_TIERED
        when: "always - this is the only sanctioned evaluation order"
        difference: "The tier is read off base_expense_cents (step 3) and never revisited. The
          rejected alternative reading - selecting the tier from total_annual_expense_cents and
          iterating to a fixed point - is explicitly NOT the contract; at
          base_expense_cents == 11,900,000 the pinned order yields management_fee_bp 800 and
          total 12,852,000, whereas re-tiering on the total would yield 650."

  - name: unit_assessment_allocation
    trigger: "step 7 of calculations.initial_budget_developer_deficit, and re-run by
      POST /units/{id}/withdraw and POST /units/{id}/reinstate (writes
      Unit.unit_annual_assessment_cents and Unit.unit_monthly_assessment_cents on every INCLUDED
      unit, then InitialBudget.assessment_income_cents)"
    algorithm: waterfall_allocation
    formula: |
      # Population (pinned): Units of the project with declaration_status == INCLUDED,
      #   iterated in created_at ASC order everywhere below.
      U = [u for u in Unit where u.conversion_project_id == project.id
                             and u.declaration_status == INCLUDED]   # created_at ASC
      if len(U) == 0:
          set InitialBudget.assessment_income_cents = 0 and return    # empty-set fallback

      T = total_annual_expense_cents        # from step 5 of the budget calculation

      # ---- ROUNDING ORDER IS PINNED: ROUND PER UNIT FIRST, THEN SUM. ----
      # The rejected alternative ("sum the exact shares, round the total once") is NOT the
      # contract and produces a different per-unit cent split for the same inputs.
      step 1: for each u in U: raw_u = T * u.percentage_interest_bp / 10000   # exact rational
      step 2: for each u in U: annual_u = round_half_up(raw_u)                # per-unit rounding
      step 3: allocated = sum(annual_u)
      step 4: remainder = T - allocated                                      # may be negative
      step 5: if remainder != 0:
                  # Remainder selector (all four elements pinned):
                  #   eligibility filter : u in U (declaration_status == INCLUDED)
                  #   ranking expression : percentage_interest_bp DESC
                  #   tie-break          : created_at ASC among units tied on percentage_interest_bp
                  #   empty-set fallback : unreachable here because len(U) >= 1 at step 1
                  target = first unit of U sorted by (percentage_interest_bp DESC, created_at ASC)
                  target.annual_u = target.annual_u + remainder
      step 6: for each u in U: monthly_u = round_half_up(annual_u / 12)
              # Second, independent rounding. sum(monthly_u) * 12 need NOT equal T; that drift is
              # intentional and must not be corrected.
      step 7: write unit_annual_assessment_cents = annual_u and
              unit_monthly_assessment_cents = monthly_u on each u in U;
              set unit_annual_assessment_cents = 0 and unit_monthly_assessment_cents = 0 on every
              Unit of the project with declaration_status == WITHDRAWN
      step 8: assessment_income_cents = sum(unit_annual_assessment_cents for u in U)
              # invariant: assessment_income_cents == T exactly (steps 4-5 absorb all drift)
    input_set: "Units of the project with declaration_status == INCLUDED, using the effective
      percentage_interest_bp written by calculations.percentage_interest_reallocation. WITHDRAWN
      units are excluded from the allocation and zeroed."
    constants:
      MONTHS_PER_YEAR: 12
    precision: "annual per unit: whole cents, round_half_up, rounded BEFORE summation; the whole
      residual is then applied to exactly one unit; monthly: whole cents, round_half_up, applied
      independently to the already-rounded annual amount"
    variants:
      - name: PER_UNIT_THEN_SUM
        when: "always - this is the only sanctioned rounding order"
        difference: "Per-unit round-then-sum with a single-unit residual sweep. Example: T = 100003
          cents across three units with percentage_interest_bp 3333 / 3333 / 3334 gives raw shares
          33331.0, 33331.0 and 33341.0 -> annual 33331 / 33331 / 33341, allocated 100003,
          remainder 0. With T = 100000 the raw shares are 33330.0, 33330.0, 33340.0, allocated
          100000, remainder 0; with T = 100001 they are 33330.3, 33330.3, 33340.3 -> 33330 /
          33330 / 33340, allocated 100000, remainder 1, which lands entirely on the bp 3334 unit
          giving 33341."

  - name: percentage_interest_reallocation
    trigger: "POST /declaration-packages/{id}/plat-certification, POST /units/{id}/withdraw and
      POST /units/{id}/reinstate (writes Unit.percentage_interest_bp on every unit of the package
      and DeclarationPackage.allocated_bp_total and ConversionProject.bp_conservation_total)"
    algorithm: waterfall_allocation
    formula: |
      # base_percentage_interest_bp is immutable input; percentage_interest_bp is a pure function
      # of the CURRENT INCLUDED set, which makes withdraw / reinstate exactly compensating.
      U = [u for u in Unit where u.declaration_package_id == package.id
                             and u.declaration_status == INCLUDED]     # created_at ASC
      W = [u for u in Unit where u.declaration_package_id == package.id
                             and u.declaration_status == WITHDRAWN]

      for u in W: u.percentage_interest_bp = 0

      if len(U) == 0:
          allocated_bp_total = 0
          bp_conservation_total = 0
          return                                     # only reachable pre-certification
      base_sum = sum(u.base_percentage_interest_bp for u in U)

      step 1: for each u in U: raw_u = 10000 * u.base_percentage_interest_bp / base_sum  # exact
      step 2: for each u in U: bp_u = floor(raw_u)                     # truncate, never round
      step 3: residual = 10000 - sum(bp_u)                             # 0 <= residual < len(U)
      step 4: distribute residual in +1 bp increments over the units of U sorted by
              (fractional_part(raw_u) DESC, base_percentage_interest_bp DESC, created_at ASC),
              one increment per unit, walking the sorted list from the front and stopping when
              residual increments are exhausted; the list is never wrapped because
              residual < len(U)
      step 5: write percentage_interest_bp = bp_u on each u in U
      step 6: allocated_bp_total = sum(percentage_interest_bp for u in U)
              bp_conservation_total = allocated_bp_total
      # CONSERVED INVARIANT: allocated_bp_total == 10000 exactly whenever len(U) >= 1.
    input_set: "All Units of the DeclarationPackage. INCLUDED units share the full 10000 bp;
      WITHDRAWN units are pinned to 0 bp and excluded from base_sum."
    constants:
      TOTAL_INTEREST_BP: 10000
    precision: "basis points are whole integers; step 2 truncates and step 4 restores the residual
      so the INCLUDED set always sums to exactly 10000"
    variants:
      - name: FLOOR_THEN_RESIDUAL_SWEEP
        when: "always - this is the only sanctioned allocation order"
        difference: "Truncate-then-sweep, not round-then-fix. Example: base 3333 / 3333 / 3334
          with all three INCLUDED gives raw 3333.0 / 3333.0 / 3334.0, residual 0. Withdrawing the
          3334 unit leaves base_sum 6666, raw 5000.0 / 5000.0, residual 0, so bp becomes
          5000 / 5000. Reinstating it restores base_sum 10000 and bp 3333 / 3333 / 3334 exactly -
          the compensating pair leaves the conserved 10000 bp and every individual bp value
          unchanged."

  - name: tenant_notice_and_relocation
    trigger: "POST /tenant-households/{id}/notices (writes TenantHousehold.notice_period_days,
      vacate_deadline_at, rofr_expires_at, relocation_assistance_cents and accrues them onto
      ConversionProject.relocation_obligation_accrued_cents / relocation_outstanding_cents)"
    algorithm: tiered_pricing
    formula: |
      served_at = current logical clock

      # ---- notice length: tiered on completed whole months of tenancy ----
      tenancy_months = floor((served_at - household.tenancy_start_date) / (30 * 86400 seconds))
      base_notice_days = 120 if tenancy_months < TENANCY_TIER_1_MONTHS
                    else 180 if tenancy_months < TENANCY_TIER_2_MONTHS
                    else 270
      # protected-class extension: the single LARGEST applicable extension, never a sum
      extension_days = 0   if household.protected_class == NONE
                  else 45  if household.protected_class == HOUSEHOLD_WITH_MINOR
                  else 90  # ELDERLY or DISABLED
      notice_period_days = base_notice_days + extension_days
      vacate_deadline_at = served_at + notice_period_days * 86400 seconds
      rofr_expires_at    = served_at + ROFR_WINDOW_DAYS * 86400 seconds

      # ---- relocation assistance: ORDER OF OPERATIONS IS PINNED ----
      step 1 multiplier: amount = round_half_up(
                             household.monthly_rent_cents * RELOCATION_MONTHS_MULTIPLIER)
      step 2 cap:        amount = min(amount, RELOCATION_CAP_CENTS)
      step 3 uplift:     if household.protected_class IN {ELDERLY, DISABLED}:
                             amount = round_half_up(amount * PROTECTED_UPLIFT_NUMERATOR
                                                    / PROTECTED_UPLIFT_DENOMINATOR)
      step 4 cap again:  amount = min(amount, RELOCATION_CAP_CENTS)
      step 5 floor:      amount = max(amount, RELOCATION_FLOOR_CENTS)
      relocation_assistance_cents = amount
      # The cap is applied BEFORE the uplift and again after it, and the floor is applied LAST, so
      # the floor can raise a capped amount but the cap can never claw back the floor.
    input_set: "The single target TenantHousehold. No sibling households, no unit data and no
      project aggregates enter the formula; the project-level ledger fields are pure sums over
      household rows."
    constants:
      TENANCY_TIER_1_MONTHS: 12
      TENANCY_TIER_2_MONTHS: 60
      ROFR_WINDOW_DAYS: 90
      RELOCATION_MONTHS_MULTIPLIER: 3
      RELOCATION_CAP_CENTS: 1500000
      RELOCATION_FLOOR_CENTS: 250000
      PROTECTED_UPLIFT_NUMERATOR: 3
      PROTECTED_UPLIFT_DENOMINATOR: 2
      MONTH_SECONDS: 2592000
    precision: "cents are whole integers, round_half_up at step 1 and step 3 only; days are whole
      integers; all instants are computed as exact multiples of 86400 seconds from served_at"
    variants:
      - name: STANDARD_TIER
        when: "household.protected_class == NONE"
        difference: "extension_days = 0 and no uplift; a 60-month tenant at 900000 cents rent
          receives notice_period_days 270 and relocation_assistance_cents
          min(2700000, 1500000) = 1500000."
      - name: PROTECTED_TIER
        when: "household.protected_class IN {ELDERLY, DISABLED, HOUSEHOLD_WITH_MINOR}"
        difference: "extension_days is 90 for ELDERLY / DISABLED and 45 for HOUSEHOLD_WITH_MINOR;
          only ELDERLY / DISABLED receive the 3/2 uplift, and because step 2 already capped the
          amount the uplift is immediately re-capped, so an ELDERLY tenant at 900000 cents rent
          also receives exactly 1500000 - the uplift is observable only below the cap."

  - name: rescission_deadline
    trigger: "POST /purchase-agreements/{id}/pos-deliveries (initial computation) and
      POST /public-offering-statements/{id}/amendments with material_change == true (restart
      clause); writes PurchaseAgreement.rescission_deadline_at and rescission_restart_count"
    algorithm: interval_merge
    formula: |
      # ---- initial computation, at POS delivery ----
      pos_delivered_at = current logical clock
      period_days = OWNER_OCCUPANT_RESCISSION_DAYS if agreement.purchaser_type == OWNER_OCCUPANT
                    else INVESTOR_RESCISSION_DAYS
      rescission_deadline_at = pos_delivered_at + period_days * 86400 seconds

      # ---- restart clause, on a material POS amendment ----
      # Population (pinned): PurchaseAgreements of the amended POS's project with
      #   contract_status IN {SIGNED, HARD} and pos_delivered_at IS NOT NULL, created_at ASC.
      amendment_at = current logical clock
      candidate = amendment_at + MATERIAL_RESTART_DAYS * 86400 seconds
      rescission_deadline_at = max(rescission_deadline_at, candidate)   # never shortens
      rescission_restart_count = rescission_restart_count + 1
      # A HARD agreement additionally reverts contract_status to SIGNED (see
      # state_machines.PurchaseAgreement HARD -> SIGNED) so the revived right is exercisable.

      # ---- boundary semantics (pinned, and deliberately asymmetric) ----
      rescission permitted  iff  clock <  rescission_deadline_at     # strict
      hardening permitted   iff  clock >= rescission_deadline_at     # inclusive
      # At clock == rescission_deadline_at exactly, rescission is refused with
      # ERR_RESCISSION_PERIOD_CLOSED and hardening succeeds.
    input_set: "The single target PurchaseAgreement for the initial computation; for the restart
      clause, every PurchaseAgreement of the project with contract_status IN {SIGNED, HARD} and a
      non-null pos_delivered_at. Agreements with contract_status IN {CLOSED, RESCINDED, VOID} are
      never restarted."
    constants:
      OWNER_OCCUPANT_RESCISSION_DAYS: 15
      INVESTOR_RESCISSION_DAYS: 7
      MATERIAL_RESTART_DAYS: 5
    precision: "instants are exact multiples of 86400 seconds; no calendar or business-day
      adjustment is applied"
    variants:
      - name: OWNER_OCCUPANT_WINDOW
        when: "PurchaseAgreement.purchaser_type == OWNER_OCCUPANT"
        difference: "15-day window from pos_delivered_at"
      - name: INVESTOR_WINDOW
        when: "PurchaseAgreement.purchaser_type == INVESTOR"
        difference: "7-day window from pos_delivered_at; an investor contract therefore becomes
          hardenable 8 days earlier than an owner-occupant contract delivered at the same instant"

  - name: warrantability_ratios
    trigger: "GET /conversion-projects/{id}/warrantability-summary, and re-run as a side effect of
      POST /purchase-agreements/{id}/closing and POST /purchase-agreements/{id}/rescission (writes
      ConversionProject.owner_occupancy_pct_contract_basis,
      investor_concentration_pct_contract_basis, owner_occupancy_pct_closed_basis,
      investor_concentration_pct_closed_basis, single_investor_max_pct, presale_sold_pct,
      warrantability_verdict and warrantability_verdict_closed_basis)"
    algorithm: aggregation
    formula: |
      # ---- population depends on the basis (this is the divergence) ----
      if basis == CONTRACT_BASIS:
          A = [a for a in PurchaseAgreement where a.conversion_project_id == project.id
                                              and a.contract_status IN {SIGNED, HARD, CLOSED}]
      if basis == CLOSED_BASIS:
          A = [a for a in PurchaseAgreement where a.conversion_project_id == project.id
                                              and a.contract_status == CLOSED]
      # RESCINDED and VOID agreements are excluded from BOTH bases.

      denom = len(A)
      if denom == 0:                                  # empty-set fallback, pinned
          owner_occupancy_pct = 0.00
          investor_concentration_pct = 0.00
          single_investor_max_pct = 0.00
          verdict = NON_WARRANTABLE
          verdict_reason = NO_QUALIFYING_CONTRACTS
          return

      owner_occupancy_pct = round_half_up(
          100 * count(a in A where a.purchaser_type == OWNER_OCCUPANT) / denom, 2)
      investor_concentration_pct = round_half_up(
          100 * count(a in A where a.purchaser_type == INVESTOR) / denom, 2)

      # single-investor concentration is always measured against total_unit_count, never denom,
      # and always over the CONTRACT_BASIS population regardless of the requested basis
      groups = group [a for a in PurchaseAgreement where a.conversion_project_id == project.id
                                                    and a.contract_status IN {SIGNED, HARD, CLOSED}]
               by purchaser_tax_id
      single_investor_max_pct = round_half_up(
          100 * max(len(g) for g in groups) / project.total_unit_count, 2)

      included = [u for u in Unit where u.conversion_project_id == project.id
                                    and u.declaration_status == INCLUDED]
      presale_sold_pct = 0.00 if len(included) == 0 else round_half_up(
          100 * count(u in included where u.sale_status IN {HARD_CONTRACT, SOLD}) / len(included), 2)

      # ---- verdict: every clause must hold; boundaries are inclusive on the favourable side ----
      verdict = WARRANTABLE if (owner_occupancy_pct         >= OWNER_OCCUPANCY_MIN_PCT
                            and investor_concentration_pct  <= INVESTOR_CONCENTRATION_MAX_PCT
                            and single_investor_max_pct     <= SINGLE_INVESTOR_MAX_PCT
                            and presale_sold_pct            >= PRESALE_SOLD_MIN_PCT)
                else NON_WARRANTABLE
    input_set: "PurchaseAgreements of the project filtered by contract_status per the selected
      basis; Units of the project with declaration_status == INCLUDED for presale_sold_pct;
      project.total_unit_count (the as-declared count, NOT included_unit_count) as the
      single-investor denominator."
    constants:
      OWNER_OCCUPANCY_MIN_PCT: 50.00
      INVESTOR_CONCENTRATION_MAX_PCT: 25.00
      SINGLE_INVESTOR_MAX_PCT: 10.00
      PRESALE_SOLD_MIN_PCT: 51.00
    precision: "all percentages: 2 decimal places, round_half_up, computed once from exact integer
      counts (never from previously rounded percentages)"
    variants:
      - name: CONTRACT_BASIS
        when: "query parameter basis == CONTRACT_BASIS (default) - the lender's pre-closing view"
        difference: "Counts SIGNED, HARD and CLOSED agreements. Rescindable SIGNED contracts inflate
          the population, so an owner-occupant heavy SIGNED book can produce
          owner_occupancy_pct >= 50.00 and verdict WARRANTABLE."
      - name: CLOSED_BASIS
        when: "query parameter basis == CLOSED_BASIS - the lender's funded view"
        difference: "Counts only CLOSED agreements. For the identical agreement book the two bases
          disagree whenever the SIGNED/HARD subset has a different owner-occupant mix from the
          CLOSED subset; e.g. 2 CLOSED investors plus 3 SIGNED owner-occupants gives CONTRACT_BASIS
          owner_occupancy_pct 60.00 / investor 40.00 and CLOSED_BASIS 0.00 / 100.00, i.e. verdicts
          NON_WARRANTABLE (investor clause) and NON_WARRANTABLE (occupancy clause) for different
          reasons, while 3 CLOSED owner-occupants plus 3 SIGNED investors gives CONTRACT_BASIS
          50.00 / 50.00 and CLOSED_BASIS 100.00 / 0.00."

  - name: presale_threshold_evaluation
    trigger: "POST /closing-batches/{id}/threshold-evaluations, and re-run as a side effect of
      POST /purchase-agreements/{id}/hardening, /escrow-deposits, /rescission,
      POST /units/{id}/withdraw and POST /public-offering-statements/{id}/amendments (writes
      ClosingBatch.assigned_agreement_count, qualifying_agreement_count, presale_pct,
      last_evaluated_at and drives the batch state machine)"
    algorithm: threshold
    formula: |
      assigned = [a for a in PurchaseAgreement where a.closing_batch_id == batch.id]
      assigned_agreement_count = len(assigned)

      qualifying = [a for a in assigned where a.contract_status IN {SIGNED, HARD, CLOSED}
                                          and a.escrow_status   IN {FUNDED, DISBURSED}]
      qualifying_agreement_count = len(qualifying)

      included_unit_count = count(u in Unit where u.conversion_project_id == batch.conversion_project_id
                                             and u.declaration_status == INCLUDED)
      if included_unit_count == 0:
          reject with ERR_NO_INCLUDED_UNITS          # empty-denominator fallback is an error
      presale_pct = round_half_up(100 * qualifying_agreement_count / included_unit_count, 2)

      # BOTH clauses use inclusive comparisons; a batch at exactly the threshold is MET.
      met = (presale_pct >= batch.min_presale_threshold_pct
             and qualifying_agreement_count >= batch.min_absolute_unit_count)
      last_evaluated_at = current logical clock
    input_set: "PurchaseAgreements whose closing_batch_id equals the batch (any contract_status for
      assigned_agreement_count; contract_status IN {SIGNED, HARD, CLOSED} and escrow_status IN
      {FUNDED, DISBURSED} for qualifying_agreement_count). The denominator is the project's
      INCLUDED Unit count at evaluation time, not total_unit_count and not the assigned count."
    constants:
      PCT_SCALE: 100
    precision: "presale_pct: 2 decimal places, round_half_up, computed from exact integer counts;
      comparisons against min_presale_threshold_pct are made on the rounded value"
    variants:
      - name: INCLUSIVE_AT_THRESHOLD
        when: "always"
        difference: "presale_pct >= min_presale_threshold_pct (not >). With 26 qualifying
          agreements over 51 INCLUDED units presale_pct is 50.98 and a 51.00 threshold is NOT met;
          with 27 over 51 it is 52.94 and the threshold IS met; with exactly 51.00 computed (e.g.
          51 qualifying over 100 units) the threshold IS met."

  - name: project_posture_derivation
    trigger: "POST /conversion-projects/{id}/posture-recalculations and every transition whose
      side_effects say 'recomputes ConversionProject.posture' (writes ConversionProject.posture and
      last_posture_recalculated_at)"
    algorithm: aggregation
    formula: |
      # Evaluated top-down; the FIRST matching branch wins. No clause is fuzzy: each is an explicit
      # predicate over enum values.
      FROZEN if ANY of:
        - project.suitability_gate == FAILED
        - exists EngineeringReport e with e.conversion_project_id == project.id
                                     and e.status == REVISION_REQUESTED
      else RESTRICTED if ANY of:
        - project.suitability_gate == UNEVALUATED
        - no DeclarationPackage d with d.conversion_project_id == project.id and d.status == RECORDED
        - no PublicOfferingStatement p with p.conversion_project_id == project.id
                                       and p.status == EFFECTIVE
        - exists ClosingBatch b with b.conversion_project_id == project.id
                                 and b.status == THRESHOLD_SHORT
        - exists TenantHousehold h with h.conversion_project_id == project.id
                                    and h.notice_status == HOLDOVER
        - exists TenantHousehold h with h.conversion_project_id == project.id
                                    and h.relocation_status == ACCRUED
                                    and h.rofr_status IN {WAIVED, EXPIRED}
        - project.escrow_reconciliation_delta_cents != 0
        - project.relocation_reconciliation_delta_cents != 0
      else OPEN

      # ---- gating semantics (pinned endpoint sets) ----
      # posture == FROZEN rejects with ERR_PROJECT_FROZEN (409) every write endpoint EXCEPT:
      #   POST /_clock/set_current_utc, POST /conversion-projects,
      #   POST /conversion-projects/{id}/posture-recalculations,
      #   POST /conversion-projects/{id}/engineering-reports,
      #   POST /engineering-reports/{id}/major-components, PATCH /major-components/{id},
      #   POST /engineering-reports/{id}/submit,
      #   POST /engineering-reports/{id}/peer-review-decisions,
      #   POST /engineering-reports/{id}/suitability-assessments,
      #   POST /conversion-projects/{id}/warranty-claims and every
      #   POST /warranty-claims/{id}/... transition,
      #   and all GET endpoints.
      # posture == RESTRICTED rejects ONLY POST /closing-batches/{id}/release with
      #   ERR_PROJECT_RESTRICTED (409). Every other write is permitted.
      # posture == OPEN rejects nothing on posture grounds.

      # The sweep run by POST /conversion-projects/{id}/posture-recalculations also applies, in this
      # pinned order: (1) TenantHousehold NOTICE_SERVED -> VACATE_DUE for households with
      # clock >= vacate_deadline_at, created_at ASC; (2) TenantHousehold rofr_status
      # OFFERED -> EXPIRED for households with clock > rofr_expires_at, created_at ASC;
      # (3) WarrantyClaim REMEDIATED -> CLOSED for claims with clock > warranty_expires_at,
      # created_at ASC; (4) the posture branch above.
    input_set: "All EngineeringReports, DeclarationPackages, PublicOfferingStatements, ClosingBatches
      and TenantHouseholds whose conversion_project_id equals the project, plus the project's own
      reconciliation delta fields. SUPERSEDED reports and DENIED/CLOSED claims never contribute."
    constants:
      SWEEP_ORDER: "vacate_due, rofr_expiry, claim_closure, posture"
    precision: "posture is an enum; no numeric rounding"
    variants:
      - name: FIRST_MATCH_TOP_DOWN
        when: "always"
        difference: "A project satisfying both a FROZEN clause and a RESTRICTED clause is FROZEN;
          the branches are not combined and RESTRICTED is never reported for a frozen project."

  - name: warranty_charge_and_window
    trigger: "POST /conversion-projects/{id}/warranty-claims (writes
      WarrantyClaim.warranty_expires_at), POST /warranty-claims/{id}/triage (writes
      accrued_charge_cents and ConversionProject.warranty_reserve_charge_cents) and
      POST /warranty-claims/{id}/remediation-schedule (overlap admission test)"
    algorithm: interval_merge
    formula: |
      component = MajorComponent(claim.major_component_id)

      # ---- warranty window ----
      warranty_months = STRUCTURAL_WARRANTY_MONTHS if component.is_structural
                        else NONSTRUCTURAL_WARRANTY_MONTHS
      warranty_expires_at = project.warranty_start_at
                            + warranty_months * MONTH_SECONDS seconds
      # admissible iff clock <= warranty_expires_at  (INCLUSIVE at the exact expiry instant)

      # ---- charge accrual at ADMIT ----
      component_cap_cents = round_half_up(component.replacement_cost_cents
                                          * WARRANTY_CHARGE_CAP_BP / 10000)
      first admit:  accrued_charge_cents = min(claim.claimed_cost_cents, component_cap_cents)
      reopen admit: uplift = round_half_up(accrued_charge_cents * REOPEN_UPLIFT_BP / 10000)
                    new_total = min(accrued_charge_cents + uplift, component_cap_cents)
                    delta = new_total - accrued_charge_cents
                    accrued_charge_cents = new_total
                    ConversionProject.warranty_reserve_charge_cents += delta

      # ---- remediation window occupancy: CLOSED intervals plus a trailing cooldown ----
      # Per-component pairwise test (differs from the ClosingBatch half-open rule):
      #   existing windows are the closed intervals [s_e, e_e] of WarrantyClaims on the SAME
      #   major_component_id with status IN {REMEDIATION_SCHEDULED, REMEDIATED} and non-null
      #   remediation_start_at.
      #   The requested closed interval [s_n, e_n] COLLIDES with an existing one iff
      #       s_n <= e_e + COOLDOWN_SECONDS  AND  s_e <= e_n + COOLDOWN_SECONDS
      #   Touching endpoints collide, and a gap of exactly COOLDOWN_SECONDS still collides
      #   (s_n == e_e + COOLDOWN_SECONDS is a collision); the first non-colliding start is
      #   s_n == e_e + COOLDOWN_SECONDS + 1 second. -> ERR_REMEDIATION_WINDOW_OVERLAP
      # Project-wide aggregate capacity test (no cooldown, closed intervals):
      #   build the endpoint event list over the requested window plus every project window with
      #   status IN {REMEDIATION_SCHEDULED, REMEDIATED}; sort by (instant ASC, START before END)
      #   so that an instant shared by one window's end and another's start counts BOTH windows;
      #   depth must never reach project.max_overlapping_remediations + 1 at any instant inside
      #   [s_n, e_n]. -> ERR_REMEDIATION_CAPACITY_EXCEEDED
      # Ordering: the pairwise same-component test runs BEFORE the aggregate capacity test.
    input_set: "The claim's MajorComponent for the window length and cap; WarrantyClaims on the same
      major_component_id with status IN {REMEDIATION_SCHEDULED, REMEDIATED} for the pairwise test;
      all WarrantyClaims of the project with those statuses for the aggregate test. SUBMITTED,
      TRIAGED_ADMISSIBLE, REOPENED, DENIED and CLOSED claims occupy nothing."
    constants:
      NONSTRUCTURAL_WARRANTY_MONTHS: 24
      STRUCTURAL_WARRANTY_MONTHS: 60
      MONTH_SECONDS: 2592000
      WARRANTY_CHARGE_CAP_BP: 6000
      REOPEN_UPLIFT_BP: 2500
      COOLDOWN_SECONDS: 259200
      MAX_CLAIM_REOPENS: 2
    precision: "cents are whole integers, round_half_up; instants are whole seconds; the cooldown
      is exactly 259200 seconds (72 hours)"
    variants:
      - name: STRUCTURAL_WINDOW
        when: "MajorComponent.is_structural == true"
        difference: "60 * 2592000 = 155,520,000 seconds (1800 days) from warranty_start_at"
      - name: NONSTRUCTURAL_WINDOW
        when: "MajorComponent.is_structural == false"
        difference: "24 * 2592000 = 62,208,000 seconds (720 days) from warranty_start_at, so an
          identical defect reported on day 800 is admissible on a structural component and refused
          with ERR_WARRANTY_PERIOD_EXPIRED on a non-structural one"

  - name: escrow_and_obligation_conservation
    trigger: "recomputed at the end of every request that mutates a PurchaseAgreement.escrow_status
      or a TenantHousehold.relocation_status, and read by
      GET /conversion-projects/{id}/escrow-summary and
      GET /conversion-projects/{id}/relocation-summary"
    algorithm: aggregation
    formula: |
      # ---- conserved quantity 1: escrow cash ----
      escrow_balance_cents  = sum(a.deposit_cents for a in PurchaseAgreement
                                  where a.conversion_project_id == project.id
                                    and a.escrow_status == FUNDED)
      escrow_refunded_cents = sum(a.deposit_cents for a in PurchaseAgreement
                                  where a.conversion_project_id == project.id
                                    and a.escrow_status == REFUNDED)
      escrow_disbursed_cents= sum(a.deposit_cents for a in PurchaseAgreement
                                  where a.conversion_project_id == project.id
                                    and a.escrow_status == DISBURSED)
      escrow_reconciliation_delta_cents = escrow_deposits_received_cents
          - (escrow_balance_cents + escrow_refunded_cents + escrow_disbursed_cents)
      # INVARIANT E: escrow_reconciliation_delta_cents == 0 after every request, including the
      # compensating pair POST /purchase-agreements/{id}/escrow-deposits followed by
      # POST /purchase-agreements/{id}/rescission.

      # ---- conserved quantity 2: tenant relocation obligation ----
      relocation_outstanding_cents = sum(h.relocation_assistance_cents for h in TenantHousehold
                                         where h.conversion_project_id == project.id
                                           and h.relocation_status == ACCRUED)
      relocation_paid_cents        = sum(h.relocation_paid_cents for h in TenantHousehold
                                         where h.conversion_project_id == project.id)
      relocation_reversed_cents    = sum(h.relocation_reversed_cents for h in TenantHousehold
                                         where h.conversion_project_id == project.id)
      relocation_reconciliation_delta_cents = relocation_obligation_accrued_cents
          - (relocation_paid_cents + relocation_reversed_cents + relocation_outstanding_cents)
      # INVARIANT R: relocation_reconciliation_delta_cents == 0 after every request, including the
      # compensating pair POST /tenant-households/{id}/relocation-disbursements followed by
      # POST /tenant-households/{id}/rofr-responses with response == EXERCISE.

      # ---- conserved quantity 3: undivided ownership share ----
      bp_conservation_total = sum(u.percentage_interest_bp for u in Unit
                                  where u.conversion_project_id == project.id
                                    and u.declaration_status == INCLUDED)
      # INVARIANT B: bp_conservation_total == 10000 whenever included_unit_count >= 1, including
      # after the compensating pair POST /units/{id}/withdraw followed by
      # POST /units/{id}/reinstate, which must also restore every individual
      # Unit.percentage_interest_bp to its pre-withdrawal value.
    input_set: "All PurchaseAgreements, TenantHouseholds and Units of the project. Agreements with
      escrow_status == PENDING contribute to none of the three escrow buckets and are excluded from
      escrow_deposits_received_cents until they reach FUNDED."
    constants:
      TOTAL_INTEREST_BP: 10000
    precision: "all quantities are whole integers; the three deltas are exact integer identities
      and are never rounded"
    variants:
      - name: ESCROW_CASH_INVARIANT
        when: "any escrow_status mutation"
        difference: "Conserves a monetary quantity (cents received == held + refunded + disbursed)"
      - name: OWNERSHIP_SHARE_INVARIANT
        when: "any Unit.declaration_status mutation"
        difference: "Conserves a dimensionless allocation share (10000 basis points), a different
          kind of quantity from cash: it is redistributed rather than moved between buckets, and
          per-unit values must be restored exactly by the compensating action"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one
      of the nine role names declared in the RBAC matrix"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for entity_backed roles the ownership binding holds: TenantOccupant requires X-User-ID ==
      TenantHousehold.id of the path household; Purchaser requires X-User-ID ==
      PurchaseAgreement.id of the path agreement"
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /tenant-households/{id}/rofr-responses,
      POST /purchase-agreements/{id}/rescission"
  - priority: 4
    category: auth
    check: "segregation of duties: X-User-ID != EngineeringReport.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /engineering-reports/{id}/peer-review-decisions"
  - priority: 5
    category: existence
    check: "the {id} in /conversion-projects/{id} resolves to a ConversionProject"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "every path containing /conversion-projects/{id}"
  - priority: 6
    category: existence
    check: "the {id} in /engineering-reports/{id}, /major-components/{id} or
      /suitability-assessments/{id} resolves; and body fields engineering_report_id and
      major_component_id resolve"
    error_id: ERR_ENGINEERING_ARTIFACT_NOT_FOUND
    http_status: 404
    applies_to: "every /engineering-reports/{id}/... and /major-components/{id} path,
      POST /conversion-projects/{id}/reserve-studies,
      POST /conversion-projects/{id}/warranty-claims"
  - priority: 7
    category: existence
    check: "the {id} in /declaration-packages/{id} or /units/{id} resolves; and body fields
      declaration_package_id, occupied_unit_id, unit_id and reported_by_unit_id resolve"
    error_id: ERR_DECLARATION_ARTIFACT_NOT_FOUND
    http_status: 404
    applies_to: "every /declaration-packages/{id}/... and /units/{id}/... path,
      POST /conversion-projects/{id}/tenant-households,
      POST /conversion-projects/{id}/public-offering-statements,
      POST /conversion-projects/{id}/warranty-claims"
  - priority: 8
    category: existence
    check: "the {id} in /public-offering-statements/{id} resolves and, for the sections path, the
      {section_code} is one of the nine declared section_code enum values"
    error_id: ERR_DISCLOSURE_ARTIFACT_NOT_FOUND
    http_status: 404
    applies_to: "every /public-offering-statements/{id}/... path"
  - priority: 9
    category: existence
    check: "the {id} in /tenant-households/{id} resolves, and the body field tenant_household_id
      resolves when non-null"
    error_id: ERR_TENANT_NOT_FOUND
