          setup: ["Athlete SD has a canonical activity with idempotency_key sd-1"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "sd_d@x.com", display_name: "SD D", home_lat: 37.0, home_lng: -122.0 }
