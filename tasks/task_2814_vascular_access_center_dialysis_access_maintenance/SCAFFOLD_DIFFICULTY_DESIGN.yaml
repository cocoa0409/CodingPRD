              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${cath_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
              captures: { cath_v: $.data.version }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVF", laterality: "LEFT", site: "FOREARM", placed_on: "2026-06-01" }
              as: AccessCoordinator
              captures: { avf1_id: $.data.id }
            - call: "POST /vascular-accesses/${avf1_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${avf1_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${avf1_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVF", laterality: "RIGHT", site: "UPPER_ARM", placed_on: "2026-06-20" }
              as: AccessCoordinator
              captures: { avf2_id: $.data.id }
            - call: "POST /access-conversion-plans"
              payload: { patient_id: "${pat_id}", from_access_id: "${cath_id}", target_access_type: "AVF", target_conversion_date: "2026-08-15", expected_access_version: "${cath_v}", target_access_id: "${avf1_id}" }
              as: AccessCoordinator
              captures: { plan1_id: $.data.id }
            - call: "GET /vascular-accesses/${cath_id}"
              payload: {}
              as: AccessCoordinator
              captures: { cath_v2: $.data.version }
          trigger:
            - call: "POST /access-conversion-plans/${plan1_id}/activate"
              payload: {}
              as: AccessCoordinator
            - call: "POST /access-conversion-plans"
              payload: { patient_id: "${pat_id}", from_access_id: "${cath_id}", target_access_type: "AVF", target_conversion_date: "2026-09-01", expected_access_version: "${cath_v2}", target_access_id: "${avf2_id}" }
              as: AccessCoordinator
              captures: { plan2_id: $.data.id }
            - call: "POST /access-conversion-plans/${plan2_id}/activate"
              payload: {}
              as: AccessCoordinator
            - call: "POST /access-conversion-plans/${plan1_id}/activate"
              payload: {}
              as: AccessCoordinator
          assert:
            - "activating plan 1 returns 409 ERR_TARGET_ACCESS_NOT_CONVERTIBLE: VascularAccess.${avf1_id}.status is IN_USE, outside {PLANNED, PLACED, MATURING}"
            - "the rejection leaves AccessConversionPlan.${plan1_id}.status == DRAFT and writes no predecessor_access_id on ${avf1_id}"
            - "creating plan 2 on the same from_access supersedes plan 1: AccessConversionPlan.${plan1_id}.status == ABANDONED even though no call named plan 1"
            - "AccessConversionPlan.${plan2_id} is created as DRAFT with maturation_check_count 0, readiness_met false and readiness_failure_reasons []"
            - "activating plan 2 returns 200 with status ACTIVE, because VascularAccess.${avf2_id}.status is PLANNED"
            - "ERR_CONVERSION_NOT_INDICATED never fires for either plan: from_access ${cath_id} is a TUNNELED_CATHETER, which satisfies the gate regardless of its intervention_burden_score of 0"
            - "VascularAccess.${avf2_id}.predecessor_access_id == ${cath_id} and its version incremented on activation, while ${avf1_id}.predecessor_access_id is still null"
            - "the second activation of plan 1 returns 409 ERR_PLAN_STATE_INVALID - ABANDONED is terminal, so the superseded plan cannot be revived"
            - "GET /access-conversion-plans?from_access_id=${cath_id} returns total_count 2 ordered by created_at ASC, one ABANDONED and one ACTIVE"

  - rule_id: resource_temporal_overlap
    instances:
      - name: room_occupancy_is_pairwise_and_the_turnover_buffer_extends_both_intervals
        grounds:
          - validations.priority_18_ERR_ROOM_OCCUPIED
          - entities.ProcedureRoom.fields.turnover_buffer_min
        distinguishing_aspect: |
          The room rule compares [scheduled_start, scheduled_end + turnover_buffer_min) on BOTH
          sides, so the 30-minute buffer bites in two directions: a candidate starting 15 minutes
          after the incumbent ends is rejected, and so is a candidate that ENDS exactly when the
          incumbent starts, because the candidate's own trailing buffer runs into it. The only legal
          adjacency is a start at exactly existing.scheduled_end + 30 min, which the half-open upper
          bound admits. All bookings use sedation_level NONE so the RN and recovery-bay headrooms are
          treated as infinite and cannot mask the room verdict.
        test_recipe:
          setup:
            - "room ANGIO-14 with turnover_buffer_min 30, daily_case_cap 6, recovery_bay_count 3"
            - "one patient, one IN_USE AVG access with a single benign reading so every referral triages to ROUTINE (score 0) and priority 17 never constrains the slot"
            - "three TRIAGED referrals A, B, C on that access"
            - "procedure on referral A booked 13:00-14:00 UTC, sedation NONE, which occupies [13:00, 14:30)"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Westline Dialysis", facility_code: "WSL-01" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
