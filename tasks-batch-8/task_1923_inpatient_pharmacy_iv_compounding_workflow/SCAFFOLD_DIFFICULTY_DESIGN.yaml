              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p1}", drug_product_id: "${drug_id}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${p1v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o1: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p2}", drug_product_id: "${drug_id}", route: "IV", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${p2v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o2: $.data.id }
            - call: "POST /pharmacy/medication-orders/${o2}/verify"
              payload: {}
              as: Pharmacist
