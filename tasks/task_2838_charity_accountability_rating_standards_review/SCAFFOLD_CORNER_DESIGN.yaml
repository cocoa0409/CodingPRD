      - name: the_comment_window_is_inclusive_at_its_deadline_and_shut_by_either_cause
        claim_type: Temporal validation
        grounds:
          - validations[priority=23]
          - errors.ERR_COMMENT_PERIOD_CLOSED
          - endpoints.POST_/public-comments
          - entities.MethodologyVersion.fields.comment_deadline_at
          - state_machines.MethodologyVersion.COMMENT_OPEN_to_COMMENT_CLOSED
        distinguishing_aspect: |
          One rule guards two independent temporal facts - the version must be
          COMMENT_OPEN and the clock must not have passed comment_deadline_at - and
          the same error code is returned whichever fact is false, including for a
          DRAFT version whose deadline is still null. The 30-day window armed at
          2026-08-01 is probed one second either side of its inclusive close, so an
          implementation that treats the deadline as exclusive loses a legal comment
          on the final instant, and one that only checks the status keeps accepting
          comments for ever until an administrator happens to close the period.
        test_recipe:
          setup:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
