  # ===========================================================================
  - section: errors
    instances:

      - name: error_stale_version_is_412_on_a_superseded_store_token
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_VERSION
          - concurrency_rules[conversion-patch-stale-store]
          - endpoints.PATCH_/merchandise/conversion-projects/{id}
        distinguishing_aspect: "PATCH on a conversion project is the second guarded write, and it too advances Store.version — so patching with the pre-patch token is a 412 ERR_STALE_VERSION while patching with the freshly read token succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE 125-cent point, an ACTIVE 300-cent point, a CONVERTING store and a started conversion project."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/price-points"
              payload: { label: "THREE_DOLLAR_25", shelf_price_cents: 300, target_landed_cost_ratio: 0.40 }
              as: MerchandiseBuyer
              captures: { pp300_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp300_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp300_id}" }
              as: StoreOperationsManager
              captures: { store_v1: $.data.version }
            - call: "POST /merchandise/conversion-projects"
              payload: { store_id: "${store_id}", from_price_point_id: "${pp125_id}", to_price_point_id: "${pp300_id}", expected_store_version: "${store_v1}" }
              as: StoreOperationsManager
              captures: { project_id: $.data.id }
            - call: "POST /merchandise/conversion-projects/${project_id}/start"
              payload: {}
              as: StoreOperationsManager
            - call: "GET /merchandise/stores/${store_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { store_v2: $.data.version }
          trigger:
            - call: "PATCH /merchandise/conversion-projects/${project_id}"
              payload: { to_price_point_id: "${pp300_id}", expected_store_version: "${store_v1}" }
              as: StoreOperationsManager
              captures: { err_stale: $.data.error_id }
            - call: "PATCH /merchandise/conversion-projects/${project_id}"
              payload: { to_price_point_id: "${pp300_id}", expected_store_version: "${store_v2}" }
              as: StoreOperationsManager
              captures: { patched_target: $.data.to_price_point_id }
          assert:
            - "the stale patch returns 412 and err_stale == ERR_STALE_VERSION — ${store_v1} predates the project-create write"
            - "the fresh patch returns 200 and patched_target == ${pp300_id}"
            - "GET /merchandise/stores/${store_id} now reports a version strictly greater than ${store_v2} — the successful patch advanced it again"
            - "ConversionProject.${project_id}.status == IN_PROGRESS — the guarded write never changed the project's lifecycle"

      - name: error_item_not_found_is_reachable_on_a_nested_update_path
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ITEM_NOT_FOUND
          - endpoints.GET_/merchandise/items/{id}/break-even
          - validations[priority=3]
        distinguishing_aspect: "The nested read surface resolves its path id and reports the same entity-specific 404, so an unknown item id on /break-even and on /landed-costs both yield ERR_ITEM_NOT_FOUND rather than a generic not-found."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /merchandise/items/00000000-0000-4000-8000-000000000000/break-even"
              payload: {}
              as: MerchandiseAnalyst
              captures: { err_be: $.data.error_id }
            - call: "GET /merchandise/items/00000000-0000-4000-8000-000000000000/landed-costs"
              payload: {}
              as: MerchandiseAnalyst
              captures: { err_hist: $.data.error_id }
          assert:
            - "the break-even read returns 404 and err_be == ERR_ITEM_NOT_FOUND"
            - "the history read returns 404 and err_hist == ERR_ITEM_NOT_FOUND"
            - "both bodies carry response_type error with an error_id and a message"
            - "neither read returns a 200 with an empty payload"

      - name: error_cost_exceeds_price_point_on_a_cured_item
        claim_type: violation_to_error
        grounds:
          - errors.ERR_COST_EXCEEDS_PRICE_POINT
        excluded_because:
          difficulty_instance: freight_passthrough_three_regimes_same_freight
          rationale: "Asserted as the third call's failure path in that §1.8 instance, which pins the error_id on the item that is cured by an ACTIVE exclusive pack program."
        # NO test_recipe.

      - name: error_aisle_coverage_shortfall_on_conversion_completion
        claim_type: violation_to_error
        grounds:
          - errors.ERR_AISLE_COVERAGE_SHORTFALL
        excluded_because:
          difficulty_instance: conversion_completion_gated_on_season_window_and_line_states
          rationale: "The completion-edge failure path in that §1.8 instance reads the same completion precondition set; the coverage tolerance itself is pinned in boundary_precision_check / three_scalar_threshold_boundaries_first_true_at_k."
        # NO test_recipe.

