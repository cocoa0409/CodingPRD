      - name: zero_finding_graph_completion_requires_the_attestation
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=107]
          - errors.ERR_GRAPH_INCOMPLETE
          - entities.Inspection.no_findings_attested
        distinguishing_aspect: >-
          An empty graph is refused 422 unless the body explicitly attests no_findings_attested ==
          true; the flag is a system field set FROM the request, so the second attempt on the same
          DRAFT row both passes and persists the attestation — and a graph with even one finding
          needs no flag at all.
        test_recipe:
          setup:
            - "Two DRAFT graphs on one property: one empty, one carrying a single conducive cell."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995 }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { insb: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { insEmpty: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${insb}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T15:00:00Z", scheduled_end_at: "2026-08-01T17:00:00Z" }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { insOne: $.data.id }
            - call: "POST /inspections/${insOne}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "B2", conducive_code: "DEBRIS_UNDER_STRUCTURE", severity: 1 }
              as: FieldInspector
              as_user_id: "${insb}"
          trigger:
            - call: "POST /inspections/${insEmpty}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { e1: $.data.error_id }
            - call: "POST /inspections/${insEmpty}/graph-complete"
              payload: { no_findings_attested: false }
              as: FieldInspector
              as_user_id: "${insb}"
              captures: { e2: $.data.error_id }
            - call: "POST /inspections/${insEmpty}/graph-complete"
              payload: { no_findings_attested: true }
              as: FieldInspector
              as_user_id: "${insb}"
            - call: "POST /inspections/${insOne}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insb}"
          assert:
            - "the empty graph with an omitted flag returns 422 ERR_GRAPH_INCOMPLETE"
            - "the empty graph with the flag explicitly false returns 422 too — the default and an explicit false are indistinguishable here"
            - "the third attempt with the flag true returns 200 with status GRAPHED, no_findings_attested true, findings_count 0 and graph_completed_at 2026-08-01T00:00:00.000Z"
            - "the one-finding graph completes with an EMPTY body: findings_count 1 makes the attestation irrelevant and no_findings_attested stays false"
            - "the two refusals left the row in DRAFT with graph_completed_at null, so the third call is a first transition rather than a repeat"

