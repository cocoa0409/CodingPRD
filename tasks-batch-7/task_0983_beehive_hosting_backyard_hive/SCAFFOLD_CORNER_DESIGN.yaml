            - { call: "POST /api/agreements/${ag}/propose-amendment", payload: { proposed_host_share_base_bps: 2900, expected_agreement_version: "${v3}" }, as: PlatformOps, captures: { v4: $.data.version, pend: $.data.pending_host_share_base_bps, st: $.data.status } }
