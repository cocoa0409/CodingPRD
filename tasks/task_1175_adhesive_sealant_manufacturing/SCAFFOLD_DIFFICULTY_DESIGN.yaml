            - "Formulation.${res_form_id}.status == DRAFT AND code == TS-9001 AND spec_min_bond_strength_mpa == 15.0"

  # ---------------------------------------------------------------------------
  # Rule 4: transitive_cascade — depth-4 exposure chain vs depth-3 reorder
  # chain; different triggering transitions.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: moisture_exposure_run_lot_shipment_chain
        grounds:
          - state_machines.PackagingRun.SEALED_to_HOLD
          - state_machines.ProductionLot.hold_CLEAR_to_QUARANTINE_HOLD
          - state_machines.Shipment.PLANNED_to_EXCEPTION
        distinguishing_aspect: |
          Depth-4 chain triggered by POST exposure-events: event -> run
          SEALED->HOLD -> lot hold CLEAR->QUARANTINE_HOLD (units_quarantined
          += 3) -> PLANNED shipment containing the lot -> EXCEPTION. Each link
          is caused by the previous link, not by the original call.
        test_recipe:
          setup:
            - "RELEASED lot with 3 cartridge units (moisture-sensitive, packed in dry room); a PLANNED SALE shipment holds a 2-unit line for that lot"
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "EPX-CAS-1", name: "Epx Cas", chemistry_family: "EPOXY", moisture_sensitive: true, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/formulations/${form_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-CAS-1", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/dry-rooms"
              payload: { room_code: "DR-CAS-1", max_concurrent_runs: 2, humidity_limit_pct: 10.0 }
              as: PlantManager
              captures: { dr_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - call: "POST /api/batches/${bat_id}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 3, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z", dry_room_id: "${dr_id}" }
              as: BatchOperator
              captures: { run_id: $.data.id }
            - call: "POST /api/packaging-runs/${run_id}/complete"
              payload: {}
              as: BatchOperator
            - call: "POST /api/production-lots/${lot_id}/cure-tests"
              payload: { method: "FULL", specimens: [13.0, 12.5, 12.4, 12.3, 12.6] }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t1: $.data.id }
            - call: "POST /api/cure-tests/${t1}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/production-lots/${lot_id}/release"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/distributors"
              payload: { name: "Dist CAS", credit_limit_cents: 1000000, contact_email: "c@x.com" }
              as: CommercialManager
              captures: { dist_id: $.data.id }
            - call: "POST /api/shipments"
              payload: { shipment_kind: "SALE", distributor_id: "${dist_id}", transport_mode: "ROAD", ship_date: "2026-06-01" }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
            - call: "POST /api/shipments/${ship_id}/lines"
              payload: { lot_id: "${lot_id}", units: 2 }
