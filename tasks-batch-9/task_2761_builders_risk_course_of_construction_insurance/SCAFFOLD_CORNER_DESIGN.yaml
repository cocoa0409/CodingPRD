          setup:
            - "Three separate projects, each screened grade A and given its own DRAFT policy with a single MATERIALS_ON_SITE part, term 2026-09-01 .. 2027-03-20 (200 days, ceil(200/30) == 7 months so no duration load), STANDARD_25K (0 pct credit), no soft-cost or delay parts."
