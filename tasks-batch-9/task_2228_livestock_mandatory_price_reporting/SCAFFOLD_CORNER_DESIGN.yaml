        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/plants/{id}
          - entities.Plant.fields.wholesale_reporting_required
        distinguishing_aspect: |
          The only mutating non-action endpoint in the surface. Two successive
          partial updates prove three separate things: an omitted key is left
          alone (the second PATCH sends only status and the boxed volume
          survives), a computed field is re-derived on update rather than frozen
          at creation (boxed volume 1999999 -> 2000000 flips
          wholesale_reporting_required false -> true), and every accepted PATCH
          bumps version by exactly one (1 -> 2 -> 3) with updated_at advancing.
        test_recipe:
          setup:
            - "Alpha Packing owns plant EST-101 created with boxed_beef_volume_lbs_prior_year 1999999, one head short of the wholesale reporting floor."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 1999999, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id, pv_1: $.data.version }
          trigger:
            - call: "PATCH /plants/${plant_a}"
              payload: { boxed_beef_volume_lbs_prior_year: 2000000 }
              as: ProgramAdmin
              captures: { pv_2: $.data.version }
            - call: "PATCH /plants/${plant_a}"
              payload: { status: "CLOSED" }
              as: ProgramAdmin
              captures: { pv_3: $.data.version }
            - call: "GET /plants/${plant_a}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "At creation: wholesale_reporting_required == false and ${pv_1} == 1"
            - "After the first PATCH: boxed_beef_volume_lbs_prior_year == 2000000, wholesale_reporting_required == true, ${pv_2} == 2"
            - "After the second PATCH: status == CLOSED, ${pv_3} == 3, and boxed_beef_volume_lbs_prior_year is still 2000000 (the omitted key is untouched)"
            - "The final GET returns plant_code 'EST-101', species CATTLE, forward_commitment_cap_head 3000, annual_head_history exactly as created, reporting_entity_id ${ent_a}, version 3"
            - "ReportingEntity.${ent_a}.version is unchanged by the plant updates (no cascade upward)"

      - name: public_comment_creation_links_and_counts_on_the_docket
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/methodology-changes/{id}/comments
          - endpoints.GET_/methodology-changes/{id}/comments
          - entities.MethodologyChange.fields.comment_count
        distinguishing_aspect: |
          The one child-collection endpoint reachable by PublicUser, and the only
          place where a denormalised counter on the parent is maintained by a
          create on the child. Two comments from two different roles land on the
          same docket, comment_count moves 0 -> 1 -> 2 in the same responses, the
          child listing filters by stance, and a comment on a sibling docket does
          not disturb either counter.
        test_recipe:
          setup:
            - "Two COMMENT_OPEN methodology changes exist (MC-2026-A on LIVE_STEER_HEIFER, MC-2026-B on LIVE_COW_BULL) and one reporting entity exists to act as a ReporterAgent commenter."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /methodology-changes"
              payload: { change_code: "MC-2026-A", affected_category: "LIVE_STEER_HEIFER", proposed_weighting_variant: "WEIGHT_WEIGHTED", comment_period_end: "2026-08-31T00:00:00Z", effective_from: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { mc_a: $.data.id }
            - call: "POST /methodology-changes"
              payload: { change_code: "MC-2026-B", affected_category: "LIVE_COW_BULL", proposed_weighting_variant: "HEAD_WEIGHTED", comment_period_end: "2026-08-31T00:00:00Z", effective_from: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { mc_b: $.data.id }
          trigger:
            - call: "POST /methodology-changes/${mc_a}/comments"
              payload: { commenter_reference: "state-cattlemen", comment_text: "weight weighting reflects the carcass trade", stance: "SUPPORT" }
              as: PublicUser
              captures: { pc_1: $.data.id }
            - call: "POST /methodology-changes/${mc_a}/comments"
              payload: { commenter_reference: "alpha-packing-regulatory", comment_text: "transition cost is material for smaller plants", stance: "OPPOSE" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { pc_2: $.data.id }
            - call: "POST /methodology-changes/${mc_b}/comments"
              payload: { commenter_reference: "independent-economist", comment_text: "no position", stance: "NEUTRAL" }
              as: PublicUser
              captures: { pc_3: $.data.id }
            - call: "GET /methodology-changes/${mc_a}/comments"
              payload: { stance: "OPPOSE" }
              as: ProgramAdmin
            - call: "GET /methodology-changes/${mc_a}/comments"
              payload: { limit: 1, offset: 1 }
              as: PublicUser
          assert:
            - "MethodologyChange.${mc_a}.comment_count == 1 in the response to the first comment and == 2 in the response to the second"
            - "MethodologyChange.${mc_b}.comment_count == 1 — counters are per docket"
            - "PublicComment.${pc_1} and ${pc_2} carry methodology_change_id == ${mc_a}; ${pc_3} carries ${mc_b}; each has received_at set from the logical clock and no version field"
            - "The stance-filtered listing returns exactly one row (${pc_2}) with total_count == 1 and has_more == false"
            - "The paginated listing returns one row with total_count == 2 and has_more == false, and the unfiltered ${mc_a} listing never returns ${pc_3}"

      - name: transaction_listing_is_a_computed_read_of_line_values
        claim_type: computed_read
        grounds:
          - endpoints.GET_/submissions/{id}/transactions
          - calculations.submission_reported_totals
        distinguishing_aspect: |
          The read side of the filing: each listed line carries its own computed
          line_value_dollars, and the parent filing's reported_* totals equal the
          per-line figures summed after rounding (224000.00 + 113197.50 +
          522000.00 = 859197.50). Also the only place the purchase_type filter on
          this child listing is exercised, which is what lets a report consumer
          separate negotiated trade from formula trade within one filing.
        test_recipe:
          setup:
            - "Alpha Packing (ACTIVE 2026 registration) holds a DRAFT filing carrying three transactions: NEGOTIATED 100 head at 280.00 / 8.00 cwt, NEGOTIATED 50 head at 279.50 / 8.10 cwt, FORMULA 200 head at 290.00 / 9.00 cwt with base reference CME_LIVE_CATTLE_INDEX."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_1: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { sub_a: $.data.id }
            - call: "POST /submissions/${sub_a}/transactions"
              payload: { purchase_type: "NEGOTIATED", head_count: 100, avg_net_price_per_cwt: 280.00, avg_carcass_weight_cwt: 8.00 }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { t1: $.data.id }
            - call: "POST /submissions/${sub_a}/transactions"
              payload: { purchase_type: "NEGOTIATED", head_count: 50, avg_net_price_per_cwt: 279.50, avg_carcass_weight_cwt: 8.10 }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { t2: $.data.id }
            - call: "POST /submissions/${sub_a}/transactions"
              payload: { purchase_type: "FORMULA", head_count: 200, avg_net_price_per_cwt: 290.00, avg_carcass_weight_cwt: 9.00, formula_base_reference: "CME_LIVE_CATTLE_INDEX" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { t3: $.data.id }
          trigger:
            - call: "GET /submissions/${sub_a}/transactions"
              payload: {}
              as: MarketAnalyst
            - call: "GET /submissions/${sub_a}/transactions"
              payload: { purchase_type: "FORMULA" }
              as: MarketAnalyst
            - call: "GET /submissions/${sub_a}"
              payload: {}
              as: MarketAnalyst
          assert:
            - "The unfiltered listing returns three rows in creation order with total_count == 3 and has_more == false"
            - "line_value_dollars: ${t1} == 224000.00, ${t2} == 113197.50, ${t3} == 522000.00"
            - "${t3} carries formula_base_reference == 'CME_LIVE_CATTLE_INDEX' while ${t1} and ${t2} carry null for it, and all three carry null grid_premium_discount_per_cwt and null forward delivery bounds"
            - "The purchase_type-filtered listing returns exactly ${t3} with total_count == 1"
            - "Submission.${sub_a}: reported_head == 350, reported_cwt == 3005.00, reported_value_dollars == 859197.50, reported_load_count == 0, reported_pounds == 0.00"

      - name: correction_action_endpoints_return_updated_projection
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/submissions/{id}/open-correction
          - endpoints.POST_/submissions/{id}/resubmit
          - endpoints.POST_/submissions/{id}/review
        excluded_because:
          difficulty_instance: non_linear_state_machine / submission_correction_cycle_returns_to_accepted
          rationale: "That §1.8 instance drives open-correction, resubmit and review as actions through a full cycle and asserts the returned projection at every hop, including resubmission_count and the recomputed lateness fields."

      - name: publish_is_conditional_on_window_and_disclosure_state
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/market-reports/{id}/publish
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / report_publish_requires_locked_window
          rationale: "That §1.8 instance is exactly the conditional-action probe for publish: the same call is refused against an OPEN window and accepted once the window is LOCKED, with the report's own disclosure state held constant."

  # ===========================================================================
  # Section note: the catalog's 60 error ids are each triggered by at least one
  # instance across §1.8 and §1.9 — the id-by-id map is in this file's header
  # comment. The two instances below add what that map cannot express: the
  # uniform SHAPE of an error body across every status class, and the fact that
  # one endpoint peels its ladder off one rung at a time in priority order.
  - section: errors
    instances:

      - name: error_envelope_shape_uniform_across_status_classes
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors
        distinguishing_aspect: |
          The envelope contract itself, sampled once per status class the API can
          emit (400, 401, 403, 404, 409, 412, 422). Every failure carries
          response_type 'error', a data object with exactly error_id and message,
          and the same meta block as a success — no partial data, no field-level
          error arrays, no HTTP-status field inside the body.
        test_recipe:
          setup:
            - "Alpha Packing with plant EST-101 and one OPEN CATTLE / LIVE_ANIMAL window; the DRAFT filing needed for the 409 sample already exists."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_1: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { sub_a: $.data.id }
          trigger:
            - call: "GET /plants"
              payload: { limit: 0 }
              as: ProgramAdmin
              captures: { e400: $.data.error_id, m400: $.data.message }
            - call: "GET /plants/${plant_a}"
              payload: {}
              headers: { X-User-ID: "u-1" }
              captures: { e401: $.data.error_id, m401: $.data.message }
            - call: "GET /reporting-entities/${ent_a}"
              payload: {}
              as: PublicUser
              captures: { e403: $.data.error_id, m403: $.data.message }
            - call: "GET /submissions/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramAdmin
              captures: { e404: $.data.error_id, m404: $.data.message }
            - call: "POST /submissions/${sub_a}/submit"
              payload: {}
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { e409: $.data.error_id, m409: $.data.message }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1} - 1" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { e412: $.data.error_id, m412: $.data.message }
            - call: "POST /submissions/${sub_a}/transactions"
              payload: { purchase_type: "FORMULA", head_count: 100, avg_net_price_per_cwt: 290.00, avg_carcass_weight_cwt: 9.00 }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { e422: $.data.error_id, m422: $.data.message }
          assert:
            - "${e400} == ERR_INVALID_REQUEST (HTTP 400), ${e401} == ERR_UNAUTHENTICATED (401), ${e403} == ERR_UNAUTHORIZED (403), ${e404} == ERR_SUBMISSION_NOT_FOUND (404), ${e409} == ERR_EMPTY_SUBMISSION (409), ${e412} == ERR_STALE_WINDOW_VERSION (412), ${e422} == ERR_MISSING_PURCHASE_TYPE_ELEMENT (422)"
            - "Every one of the seven bodies has response_type == 'error' and data whose key set is exactly { error_id, message }"
            - "Every message (${m400}, ${m401}, ${m403}, ${m404}, ${m409}, ${m412}, ${m422}) is a non-empty human-readable string, and none of them is the error_id itself"
            - "Every one of the seven bodies carries meta.api_request_id and meta.api_request_timestamp, formatted exactly as on a 200 response"
            - "No error body contains a data payload of the target entity, a field-level error list, or a numeric status field"

      - name: submission_create_error_ladder_peels_off_one_rung_at_a_time
        claim_type: error_triggerable
        grounds:
          - validations
          - endpoints.POST_/submissions
        distinguishing_aspect: |
          A single endpoint walked down its whole ladder with exactly one defect
          repaired per call, which is the only way to prove the ORDER rather than
          the mere existence of each rung: 401, 403, 400, plant 404, window 404,
          foreign-entity 403, stale-version 412, and finally 201. Each call would
          also have failed on the next rung down had the previous defect not been
          repaired, so the sequence is monotonic — a shape no single-error
          instance can express.
        test_recipe:
          setup:
            - "Alpha Packing owns plant EST-101; Bravo Beef owns no plant in this window and acts as the foreign reporter. One OPEN CATTLE / LIVE_ANIMAL window exists."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /reporting-entities"
              payload: { legal_name: "Bravo Beef", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_b: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_1: $.data.version }
          trigger:
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1}" }
              headers: { X-User-ID: "u-1" }
              captures: { r1: $.data.error_id }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1}" }
              as: PublicUser
              captures: { r2: $.data.error_id }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", expected_window_version: "${wv_1}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { r3: $.data.error_id }
            - call: "POST /submissions"
              payload: { plant_id: "00000000-0000-0000-0000-0000000000aa", reporting_window_id: "00000000-0000-0000-0000-0000000000bb", expected_window_version: "${wv_1}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { r4: $.data.error_id }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "00000000-0000-0000-0000-0000000000bb", expected_window_version: "${wv_1}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { r5: $.data.error_id }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1}" }
              as: ReporterAgent
              as_user_id: "${ent_b}"
              captures: { r6: $.data.error_id }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1} - 1" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { r7: $.data.error_id }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1}" }
              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { sub_ok: $.data.id }
          assert:
            - "${r1} == ERR_UNAUTHENTICATED (401) — missing X-Role beats every other defect"
            - "${r2} == ERR_UNAUTHORIZED (403) — a valid identity without the role beats the payload checks"
            - "${r3} == ERR_INVALID_REQUEST (400) — the absent reporting_window_id is reported before any lookup"
            - "${r4} == ERR_PLANT_NOT_FOUND (404) — with BOTH ids unknown, the body-FK order in §1.4 rung 5 resolves plant_id first"
            - "${r5} == ERR_REPORTING_WINDOW_NOT_FOUND (404) once only the window id is unknown"
            - "${r6} == ERR_FOREIGN_REPORTING_ENTITY (403) — ownership is checked after existence and before concurrency"
            - "${r7} == ERR_STALE_WINDOW_VERSION (412) — the last rung before the write"
            - "The final call returns HTTP 201: Submission.${sub_ok}.status == DRAFT, is_late == false, resubmission_count == 0, and ReportingWindow.${win_1}.version is bumped exactly once across the whole sequence (only the successful write moved it)"

  # ===========================================================================
  - section: rbac
    instances:

      - name: every_role_exclusive_operation_denied_to_a_non_holder
        claim_type: denial_to_unauthorized
        grounds:
          - roles
          - validations.priority_2_ERR_UNAUTHORIZED
        distinguishing_aspect: |
          One denial per role that owns exclusive operations, chosen so the
          denying role is itself privileged elsewhere — a MarketAnalyst cannot
          create plants or move the clock, a ProgramAdmin cannot appeal on a
          firm's behalf or review a filing, a ComplianceAuditor cannot assess
          money, and a PenaltyOfficer cannot open an audit case. Proves the six
          role sets are disjoint where declared rather than nested, and that 403
          precedes every state and body-FK check (the referenced ids are real but
          the calls never reach them).
        test_recipe:
          setup:
            - "Alpha Packing with plant EST-101, a DETERMINED 2026 registration, one OPEN window and one DRAFT filing — enough for every denied call to name a real target."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_a}", determination_year: 2026, basis_variant: "FIVE_YEAR_AVERAGE" }
              as: ProgramAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /registrations/${reg_a}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
            - call: "GET /reporting-windows/${win_1}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_1: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_1}", expected_window_version: "${wv_1}" }
