    code: 201
    input: [defendant_id, violation_type, severity]
    output: ViolationEvent
    side_effects: ["status = REPORTED, reported_by_user_id = X-User-ID"]
  - method: POST
    path: "/violations/{id}/transition"
    description: "Review then adjudicate a violation (SANCTION or DISMISS); SANCTION drives the escalation cascade."
    roles: [JudicialOfficer]
    code: 200
    input: [to_status]
    output: ViolationEvent
    side_effects: ["per ViolationEvent state machine"]
  - method: GET
    path: "/violations/{id}"
    description: "Get a violation."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin]
    code: 200
    input: []
    output: ViolationEvent
    side_effects: []
  - method: GET
    path: "/defendants/{id}/violations"
    description: "List a defendant's violations (reverse lookup for ViolationEvent.defendant_id)."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "violation_type?", "limit?", "offset?"]
    output: ViolationEvent[]
    side_effects: []

  # ---- CourtEvent ----
  - method: POST
    path: "/court-events"
    description: "Schedule a court hearing; computes reminder_due_at."
    roles: [IntakeOfficer, SupervisingOfficer]
    code: 201
    input: [defendant_id, hearing_at, "reminder_lead_days?"]
    output: CourtEvent
    side_effects: ["compute reminder_due_at"]
  - method: POST
    path: "/court-events/{id}/transition"
    description: "Record appearance / FTA / continuance; FTA cascades a ViolationEvent."
    roles: [SupervisingOfficer]
    code: 200
    input: [to_status]
    output: CourtEvent
    side_effects: ["per CourtEvent state machine"]
  - method: GET
    path: "/defendants/{id}/court-events"
    description: "List a defendant's court events (reverse lookup for CourtEvent.defendant_id)."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin, Defendant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CourtEvent[]
    side_effects: []

  # ---- DrugTest ----
  - method: POST
    path: "/drug-tests"
    description: "Schedule a drug/alcohol test at a site; capacity-checked; requires the DRUG_TESTING condition."
    roles: [SupervisingOfficer]
    code: 201
    input: [defendant_id, site_id, test_kind, slot_start]
    output: DrugTest
    side_effects: ["compute slot_end", "capacity validation", "status = SCHEDULED"]
  - method: POST
    path: "/drug-tests/{id}/transition"
    description: "Collect / record result / mark-missed a drug test; RESULT_POSITIVE cascades a ViolationEvent."
    roles: [SupervisingOfficer]
    code: 200
    input: [to_status]
    output: DrugTest
    side_effects: ["per DrugTest state machine"]
  - method: GET
    path: "/defendants/{id}/drug-tests"
    description: "List a defendant's drug tests (reverse lookup for DrugTest.defendant_id)."
    roles: [IntakeOfficer, SupervisingOfficer, JudicialOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DrugTest[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID, or unknown role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role not permitted for this operation."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state permitting the requested transition/operation."
  - id: ERR_DEFENDANT_NOT_ACTIVE
    http: 409
    condition: "EM activation attempted while the enrollment's defendant is not in supervision_status ACTIVE."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Approver/rejecter equals assessment submitter, or adjudicator equals violation reporter."
  - id: ERR_CONDITION_NOT_ORDERED
    http: 409
    condition: "Required ordered condition absent (DRUG_TESTING for a test, GPS_MONITORING for EM activation)."
  - id: ERR_ASSESSMENT_NOT_APPROVED
    http: 409
    condition: "Release order ORDERED attempted while its linked assessment is not APPROVED."
  - id: ERR_CURFEW_WINDOW_OVERLAP
    http: 409
    condition: "New curfew window overlaps an existing window on the same enrollment and day_of_week."
  - id: ERR_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "Drug-test slot would exceed the site's slot_capacity of overlapping tests."
  - id: ERR_PRECONDITION_TIME_NOT_REACHED
    http: 409
    condition: "Time-gated transition attempted before its clock precondition (FTA/MISSED) is met."
  - id: ERR_NO_DEVICE_AVAILABLE
    http: 409
    condition: "EM activation attempted while the referenced device pool has available_units == 0."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version does not match the parent's current version."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, malformed value, or out-of-range numeric input."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "Enum field value is not a member of the declared set."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeOfficer
    description: "Books defendants and authors risk assessments."
    identity: opaque
    exclusive_operations:
      - "POST /defendants"
      - "POST /assessments"
      - "POST /assessments/{id}/transition {to_status: SUBMITTED}"
    shared_operations:
      - "POST /court-events"
      - "all GET reads"
  - name: SupervisingOfficer
    description: "Manages ongoing supervision: check-ins, EM, tests, violations, fees, level adjustments."
    identity: opaque
    exclusive_operations:
      - "POST /check-ins, POST /check-ins/{id}/transition {to_status: MISSED}"
      - "POST /em-enrollments and its transitions/curfew-windows/pings"
      - "POST /drug-tests and POST /drug-tests/{id}/transition"
      - "POST /violations"
      - "POST /court-events/{id}/transition"
    shared_operations:
      - "POST /defendants/{id}/level-adjustments (with JudicialOfficer)"
      - "POST /defendants/{id}/fees, POST /defendants/{id}/ledger-entries (with ProgramAdmin)"
      - "POST /defendants/{id}/transition (with JudicialOfficer)"
      - "all GET reads"
  - name: JudicialOfficer
    description: "Adjudicates assessments, release orders, and violations."
    identity: opaque
    exclusive_operations:
      - "POST /assessments/{id}/transition {to_status in APPROVED/REJECTED/DRAFT}"
      - "POST /release-orders and POST /release-orders/{id}/transition"
      - "POST /violations/{id}/transition"
    shared_operations:
      - "POST /defendants/{id}/level-adjustments (with SupervisingOfficer)"
      - "POST /defendants/{id}/transition (with SupervisingOfficer)"
      - "all GET reads"
  - name: ProgramAdmin
    description: "Configures sites, devices, the logical clock, and processes ledger payments."
    identity: opaque
    exclusive_operations:
      - "POST /testing-sites"
      - "POST /em-devices"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /defendants/{id}/fees, POST /defendants/{id}/ledger-entries (with SupervisingOfficer)"
      - "POST /em-enrollments/{id}/pings (with SupervisingOfficer)"
      - "all GET reads"
  - name: Defendant
    description: "Self-service actor; completes own check-ins and views own record."
    identity: "entity_backed:Defendant"
    exclusive_operations: []
    shared_operations:
      - "POST /check-ins/{id}/transition {to_status: COMPLETED} for own check-in"
      - "GET /defendants/{id}, GET /defendants/{id}/check-ins, GET /defendants/{id}/court-events for own record"
