      - name: fourth_exam_attempt_on_a_denied_applicant_is_rejected_with_the_attempt_cap_error
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Licensee.license_status.APPLICANT_to_DENIED
          - validations[priority=35]
          - errors.ERR_EXAM_ATTEMPTS_EXHAUSTED
        distinguishing_aspect: |
          DENIED is terminal, and it is the only reachable state with exam_attempt_count == 3. Priority
          9 deliberately excludes this endpoint/state pair so the answer is the attempt-cap error, not
          ERR_INVALID_STATE - an implementation that lets priority 9 win makes
          ERR_EXAM_ATTEMPTS_EXHAUSTED untriggerable, and one that records the attempt anyway drives
          exam_attempt_count to 4.
        test_recipe:
          setup:
            - "Sam Sales has failed three examinations (70, 72, 74) and is therefore DENIED with exam_attempt_count == 3 and exam_best_score == 74"
          setup_api_calls:
            - call: "POST /commission/licensees"
