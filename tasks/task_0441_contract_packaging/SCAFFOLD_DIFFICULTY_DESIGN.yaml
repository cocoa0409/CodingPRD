            - call: "POST /copack/recipes/${recipe_id}/bom-lines"
              payload: { component_id: "${pouch_id}", qty_per_unit: 1, expected_recipe_version: "${rv1}" }
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/submit"
              payload: {}
              as: Scheduler
            - call: "POST /copack/recipes/${recipe_id}/approve"
              payload: {}
              as: QAInspector
            - call: "POST /copack/production-lines"
              payload: { name: "Line A", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_a: $.data.id }
            - call: "POST /copack/production-lines"
              payload: { name: "Line B", rated_units_per_hour: 50 }
              as: Scheduler
              captures: { line_b: $.data.id }
            - call: "POST /copack/crews"
              payload: { name: "Day Crew", rest_buffer_minutes: 15 }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /copack/production-runs"
              payload: { recipe_id: "${recipe_id}", line_id: "${line_a}", crew_id: "${crew_id}", planned_units: 100, scheduled_start: "2026-06-01T08:00:00Z" }
              as: Scheduler
