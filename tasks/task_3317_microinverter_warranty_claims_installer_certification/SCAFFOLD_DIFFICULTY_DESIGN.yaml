scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: lot_defect_cumulative_vs_trailing_window
        grounds:
          - calculations.evaluate_lot_defect_rate
          - entities.ProductionLot.fields.lot_status
          - entities.ProductionLot.fields.defect_rate_window_pct
        distinguishing_aspect: |
          The cumulative variant decides lot_status while the trailing-window variant only
          reports; with four failed units of forty the cumulative rate is 10.00 percent
          (RECALL) while the window rate is 0.00 percent, so the two variants disagree on
          the same ProductionLot row.
        test_recipe:
          setup:
            - "one installer, one GOLD design project approved, clock at 2026-09-01T00:00:00Z"
            - "ProductionLot LOT-J with defect_threshold_pct 5.0 and replacement_model_code IQ8"
            - "ten units commissioned on SYS-1 at 2026-01-15, four of them later FAILED"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-DDV-1", company_name: "Delta Solar" }
              as: PlatformAdmin
              captures: { inst_ddv1: "$.data.id" }
            - call: "POST /warranty/installers/${inst_ddv1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /warranty/installers/${inst_ddv1}"
              payload: {}
              as: PlatformAdmin
              captures: { inst_ddv1_v: "$.data.version" }
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_ddv1}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_ddv1}", site_address: "1 Delta Way", site_postal_code: "94001", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_ddv1}"
              captures: { dpj_ddv1: "$.data.id" }
            - call: "POST /warranty/design-projects/${dpj_ddv1}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_ddv1}"
            - call: "POST /warranty/design-projects/${dpj_ddv1}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/production-lots"
              payload: { lot_code: "LOT-J", manufacture_month: "2025-06", embed_model_code: "IQ7", defect_threshold_pct: 5.0, replacement_model_code: "IQ8" }
              as: PlatformAdmin
              captures: { lot_j_ddv1: "$.data.id" }
            - call: "POST /warranty/system-registrations"
              payload: { installer_id: "${inst_ddv1}", design_project_id: "${dpj_ddv1}", site_address: "1 Delta Way", site_postal_code: "94001", homeowner_name: "D. Delta", homeowner_email: "d@delta.example", commissioned_at: "2026-01-15T00:00:00Z", units: [{ serial_number: "DDV1-U1", model_code: "IQ7", installed_at: "2026-01-15T00:00:00Z", production_lot_code: "LOT-J" }, { serial_number: "DDV1-U2", model_code: "IQ7", installed_at: "2026-01-15T00:00:00Z", production_lot_code: "LOT-J" }, { serial_number: "DDV1-U3", model_code: "IQ7", installed_at: "2026-01-15T00:00:00Z", production_lot_code: "LOT-J" }, { serial_number: "DDV1-U4", model_code: "IQ7", installed_at: "2026-01-15T00:00:00Z", production_lot_code: "LOT-J" }, { serial_number: "DDV1-U5", model_code: "IQ7", installed_at: "2026-01-15T00:00:00Z", production_lot_code: "LOT-J" }, { serial_number: "DDV1-U6", model_code: "IQ7", installed_at: "2026-01-15T00:00:00Z", production_lot_code: "LOT-J" }, { serial_number: "DDV1-U7", model_code: "IQ7", installed_at: "2026-01-15T00:00:00Z", production_lot_code: "LOT-J" }, { serial_number: "DDV1-U8", model_code: "IQ7", installed_at: "2026-01-15T00:00:00Z", production_lot_code: "LOT-J" }, { serial_number: "DDV1-U9", model_code: "IQ7", installed_at: "2026-01-15T00:00:00Z", production_lot_code: "LOT-J" }, { serial_number: "DDV1-U10", model_code: "IQ7", installed_at: "2026-01-15T00:00:00Z", production_lot_code: "LOT-J" }] }
              as: Installer
              as_user_id: "${inst_ddv1}"
              captures: { sys_ddv1: "$.data.id" }
            - call: "GET /warranty/system-registrations/${sys_ddv1}/units"
              payload: {}
              as: PlatformAdmin
              captures: { ddv1_u1: "$.data[0].id", ddv1_u2: "$.data[1].id", ddv1_u3: "$.data[2].id", ddv1_u4: "$.data[3].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /warranty/units/${ddv1_u1}/observations"
              payload: { performance_ratio: 0.0, observed_at: "2026-03-02T00:00:00Z" }
              as: MonitoringService
            - call: "POST /warranty/units/${ddv1_u2}/observations"
              payload: { performance_ratio: 0.0, observed_at: "2026-03-03T00:00:00Z" }
              as: MonitoringService
            - call: "POST /warranty/units/${ddv1_u3}/observations"
              payload: { performance_ratio: 0.0, observed_at: "2026-03-04T00:00:00Z" }
              as: MonitoringService
            - call: "POST /warranty/units/${ddv1_u4}/observations"
              payload: { performance_ratio: 0.0, observed_at: "2026-03-05T00:00:00Z" }
              as: MonitoringService
          assert:
            - "ProductionLot.${lot_j_ddv1}.failed_unit_count == 4"
            - "ProductionLot.${lot_j_ddv1}.window_failed_unit_count == 0"
            - "ProductionLot.${lot_j_ddv1}.defect_rate_cumulative_pct == 10.0"
            - "ProductionLot.${lot_j_ddv1}.defect_rate_window_pct == 0.0"
            - "ProductionLot.${lot_j_ddv1}.lot_status == RECALL"
            - "ProductionLot.${lot_j_ddv1}.units_registered_count == 10, so DECOMMISSIONED units would still sit in the denominator"

      - name: labor_per_component_vs_sum_then_round
        grounds:
          - calculations.compute_labor_reimbursement
          - entities.LaborReimbursement.fields.net_amount_cents
          - endpoints.[GET /warranty/labor-reimbursements/{id}/quote]
        distinguishing_aspect: |
          Per-component rounding persists net_amount_cents 10201 cents for a GOLD installer
          claiming 2.0 hours on a 130-month-old system, while the read-only sum-then-round
          variant reports blended_total_cents 10200 cents on the same row.
        test_recipe:
          setup:
            - "GOLD installer holds an approved design and a system commissioned 2015-11-01 (age 130 months at clock 2026-09-01)"
            - "one unit failed; its claim is DIAGNOSED and APPROVED by PlatformAdmin"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-DDV-2", company_name: "Echo Solar" }
              as: PlatformAdmin
              captures: { inst_ddv2: "$.data.id" }
            - call: "POST /warranty/installers/${inst_ddv2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_ddv2}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_ddv2}", site_address: "2 Echo Way", site_postal_code: "94002", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_ddv2}"
              captures: { dpj_ddv2: "$.data.id" }
            - call: "POST /warranty/design-projects/${dpj_ddv2}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_ddv2}"
            - call: "POST /warranty/design-projects/${dpj_ddv2}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/production-lots"
              payload: { lot_code: "LOT-E", manufacture_month: "2015-08", embed_model_code: "IQ7", defect_threshold_pct: 5.0, replacement_model_code: "IQ8" }
              as: PlatformAdmin
              captures: { lot_e_ddv2: "$.data.id" }
            - call: "POST /warranty/system-registrations"
              payload: { installer_id: "${inst_ddv2}", design_project_id: "${dpj_ddv2}", site_address: "2 Echo Way", site_postal_code: "94002", homeowner_name: "E. Echo", homeowner_email: "e@echo.example", commissioned_at: "2015-11-01T00:00:00Z", units: [{ serial_number: "DDV2-U1", model_code: "IQ7", installed_at: "2015-11-01T00:00:00Z", production_lot_code: "LOT-E" }] }
              as: Installer
              as_user_id: "${inst_ddv2}"
              captures: { sys_ddv2: "$.data.id" }
            - call: "GET /warranty/system-registrations/${sys_ddv2}/units"
              payload: {}
              as: PlatformAdmin
              captures: { ddv2_u1: "$.data[0].id", ddv2_u1_v: "$.data[0].version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warranty/units/${ddv2_u1}/diagnostics"
              payload: { performance_ratio: 0.0, observed_at: "2026-08-01T00:00:00Z" }
              as: MonitoringService
            - call: "POST /warranty/claims"
              payload: { unit_id: "${ddv2_u1}", installer_id: "${inst_ddv2}", claim_kind: "DEFECT", remote_diagnostic_ref: "DIAG-DDV2", expected_unit_version: "${ddv2_u1_v}" }
              as: Installer
              as_user_id: "${inst_ddv2}"
              captures: { clm_ddv2: "$.data.id" }
            - call: "POST /warranty/claims/${clm_ddv2}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_ddv2}"
            - call: "POST /warranty/claims/${clm_ddv2}/diagnose"
              payload: {}
              as: MonitoringService
            - call: "POST /warranty/claims/${clm_ddv2}/approve"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /warranty/labor-reimbursements"
              payload: { claim_id: "${clm_ddv2}", claimed_hours: 2.0 }
              as: Installer
              as_user_id: "${inst_ddv2}"
              captures: { lab_ddv2: "$.data.id" }
            - call: "GET /warranty/labor-reimbursements/${lab_ddv2}/quote"
              payload: {}
              as: PlatformAdmin
              captures: { q_ddv2_net: "$.data.net_amount_cents", q_ddv2_blended: "$.data.blended_total_cents", q_ddv2_age: "$.data.age_factor", q_ddv2_allowed: "$.data.allowed_hours", q_ddv2_labor: "$.data.labor_component_cents", q_ddv2_diag: "$.data.diagnostic_component_cents" }
          assert:
            - "LaborReimbursement.${lab_ddv2}.level_factor == 1.10"
            - "LaborReimbursement.${lab_ddv2}.age_factor == 0.375"
            - "LaborReimbursement.${lab_ddv2}.allowed_hours == 2.0"
            - "LaborReimbursement.${lab_ddv2}.cap_applied == false"
            - "LaborReimbursement.${lab_ddv2}.labor_component_cents == 7013"
            - "LaborReimbursement.${lab_ddv2}.diagnostic_component_cents == 3188"
            - "LaborReimbursement.${lab_ddv2}.net_amount_cents == 10201"
            - "GET quote blended_total_cents == 10200, so net_amount_cents minus blended_total_cents == 1"
  - rule_id: combinatorial_formula
    instances:
      - name: dc_ac_ratio_hard_gate_at_one_point_five
        grounds:
          - entities.DesignProject.fields.dc_ac_ratio
          - validations[priority=27]
          - calculations.compute_warranty_coverage
        distinguishing_aspect: |
          Mode (a) non-linear gated ratio: the DC/AC ratio gate compares >= 1.50 against a
          ratio that is itself computed from two inputs; 40 modules / 24600 W yields 1.5375
          and is rejected with ERR_DC_AC_RATIO_EXCEEDED while exactly 1.50 passes.
        test_recipe:
          setup:
            - "GOLD installer ACTIVE with design tool access; no systems yet"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-CF-1", company_name: "Foxtrot Solar" }
              as: PlatformAdmin
              captures: { inst_cf1: "$.data.id" }
            - call: "POST /warranty/installers/${inst_cf1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_cf1}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_cf1}", site_address: "3 Foxtrot Way", site_postal_code: "94003", module_count: 40, dc_capacity_watts: 24600 }
              as: Installer
              as_user_id: "${inst_cf1}"
              captures: { dpj_cf1: "$.data.id" }
            - call: "POST /warranty/design-projects/${dpj_cf1}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_cf1}"
          trigger:
            - call: "POST /warranty/design-projects/${dpj_cf1}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { cf1_err: "$.data.error_id" }
          assert:
            - "DesignProject.${dpj_cf1}.dc_ac_ratio == 1.5375"
            - "the approve call returns error_id ERR_DC_AC_RATIO_EXCEEDED with HTTP 422"
            - "DesignProject.${dpj_cf1}.status stays SUBMITTED"

      - name: replacement_limit_strictly_greater_than_zero
        grounds:
          - validations[priority=20]
          - entities.Unit.fields.replacement_window_position
          - endpoints.[POST /warranty/claims]
        distinguishing_aspect: |
          Mode (c) evaluation-order pin: replacement_window_position is seeded at 5 on
          commissioning and decremented by every INSTALLED replacement, and the claim gate uses
          the STRICT comparison > 0, so a system sitting at exactly 1 position admits a claim.
        test_recipe:
          setup:
            - "GOLD installer, approved design, one unit commissioned, unit failed, four replacements already installed on the system"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-CF-2", company_name: "Golf Solar" }
              as: PlatformAdmin
              captures: { inst_cf2: "$.data.id" }
            - call: "POST /warranty/installers/${inst_cf2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_cf2}", level: "GOLD" }
              as: PlatformAdmin
            - call: "POST /warranty/design-projects"
              payload: { installer_id: "${inst_cf2}", site_address: "4 Golf Way", site_postal_code: "94004", module_count: 20, dc_capacity_watts: 10000 }
              as: Installer
              as_user_id: "${inst_cf2}"
              captures: { dpj_cf2: "$.data.id" }
            - call: "POST /warranty/design-projects/${dpj_cf2}/submit"
              payload: {}
              as: Installer
              as_user_id: "${inst_cf2}"
            - call: "POST /warranty/design-projects/${dpj_cf2}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warranty/production-lots"
              payload: { lot_code: "LOT-GF", manufacture_month: "2025-02", embed_model_code: "IQ8", defect_threshold_pct: 5.0, replacement_model_code: "IQ8" }
              as: PlatformAdmin
              captures: { lot_cf2: "$.data.id" }
            - call: "POST /warranty/system-registrations"
              payload: { installer_id: "${inst_cf2}", design_project_id: "${dpj_cf2}", site_address: "4 Golf Way", site_postal_code: "94004", homeowner_name: "G. Golf", homeowner_email: "g@golf.example", commissioned_at: "2026-01-10T00:00:00Z", units: [{ serial_number: "CF2-U1", model_code: "IQ8", installed_at: "2026-01-10T00:00:00Z", production_lot_code: "LOT-GF" }] }
              as: Installer
              as_user_id: "${inst_cf2}"
              captures: { sys_cf2: "$.data.id" }
            - call: "GET /warranty/system-registrations/${sys_cf2}/units"
              payload: {}
              as: PlatformAdmin
              captures: { cf2_u1: "$.data[0].id", cf2_u1_v: "$.data[0].version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warranty/billing-entitlements"
              payload: { unit_id: "${cf2_u1}", entitlement_kind: "SERVICE_PLAN", effective_from: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warranty/billing-entitlements"
              payload: { unit_id: "${cf2_u1}", entitlement_kind: "SERVICE_PLAN", effective_from: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warranty/billing-entitlements"
              payload: { unit_id: "${cf2_u1}", entitlement_kind: "SERVICE_PLAN", effective_from: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /warranty/replacement-orders"
              payload: { unit_id: "${cf2_u1}", status: "INSTALLED" }
              as: PlatformAdmin
              captures: { cf2_ro1: "$.data[0].id", cf2_ro2: "$.data[1].id", cf2_ro3: "$.data[2].id" }
            - call: "POST /warranty/replacement-orders/${cf2_ro1}/install"
              payload: { replacement_serial_number: "CF2-R1", installed_at: "2026-04-02T00:00:00Z" }
              as: Installer
              as_user_id: "${inst_cf2}"
            - call: "POST /warranty/replacement-orders/${cf2_ro2}/install"
              payload: { replacement_serial_number: "CF2-R2", installed_at: "2026-04-03T00:00:00Z" }
              as: Installer
              as_user_id: "${inst_cf2}"
            - call: "POST /warranty/replacement-orders/${cf2_ro3}/install"
              payload: { replacement_serial_number: "CF2-R3", installed_at: "2026-04-04T00:00:00Z" }
              as: Installer
              as_user_id: "${inst_cf2}"
            - call: "GET /warranty/units/${cf2_u1}"
              payload: {}
              as: PlatformAdmin
              captures: { cf2_u1_v2: "$.data.version" }
            - call: "POST /warranty/billing-entitlements"
              payload: { unit_id: "${cf2_u1}", entitlement_kind: "SERVICE_PLAN", effective_from: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /warranty/replacement-orders"
              payload: { unit_id: "${cf2_u1}", status: "INSTALLED" }
              as: PlatformAdmin
              captures: { cf2_ro4: "$.data[3].id" }
            - call: "POST /warranty/replacement-orders/${cf2_ro4}/install"
              payload: { replacement_serial_number: "CF2-R4", installed_at: "2026-05-02T00:00:00Z" }
              as: Installer
              as_user_id: "${inst_cf2}"
            - call: "GET /warranty/units/${cf2_u1}"
              payload: {}
              as: PlatformAdmin
              captures: { cf2_u1_v3: "$.data.version" }
            - call: "POST /warranty/units/${cf2_u1}/diagnostics"
              payload: { performance_ratio: 0.0, observed_at: "2026-08-15T00:00:00Z" }
              as: MonitoringService
            - call: "GET /warranty/units/${cf2_u1}"
              payload: {}
              as: PlatformAdmin
              captures: { cf2_u1_v4: "$.data.version" }
          trigger:
            - call: "POST /warranty/claims"
              payload: { unit_id: "${cf2_u1}", installer_id: "${inst_cf2}", claim_kind: "DEFECT", remote_diagnostic_ref: "DIAG-CF2", expected_unit_version: "${cf2_u1_v4}" }
              as: Installer
              as_user_id: "${inst_cf2}"
              captures: { clm_cf2: "$.data.id" }
          assert:
            - "Unit.${cf2_u1}.replacement_count == 4"
            - "Unit.${cf2_u1}.replacement_window_position == 1"
            - "the claim is created, so the strict > 0 gate admits a system sitting at exactly 1 position"
            - "WarrantyClaim.${clm_cf2}.status == DRAFT"

  - rule_id: non_linear_state_machine
    instances:
      - name: unit_monitoring_cycle_failed_back_to_online
        grounds:
          - state_machines.Unit.OFFLINE_to_ONLINE
          - state_machines.Unit.FAILED_to_ONLINE
          - state_machines.Unit.ONLINE_to_UNDERPERFORMING
          - state_machines.Unit.UNDERPERFORMING_to_FAILED
        distinguishing_aspect: |
          The Unit monitoring machine is cyclic: it travels ONLINE -> UNDERPERFORMING ->
          FAILED and then back to ONLINE through a different trigger, so the same entity
          re-enters a state it has already held.
        test_recipe:
          setup:
            - "GOLD installer, approved design, one IQ7 unit commissioned, clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /warranty/installers"
