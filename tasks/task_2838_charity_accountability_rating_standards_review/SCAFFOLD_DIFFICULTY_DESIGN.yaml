              payload: { revocation_note: "waiver granted in error" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { se_result_restored: $.data.result }
          assert:
            - "${se_code} == CEO_COMP_REVIEW"
            - "${se_result_waived} == WAIVED and ${se_result_restored} == NOT_MET"
            - "Before the waiver: GovernanceProfile.${g1} had met 7, not_met 1, waived 0, not_applicable 0 (sum 8), the ACCOUNTABILITY row had raw_points 21 and normalized_score 87.50, and RatingCycle.${c1} had failed_standard_count 1, weighted_sum_provisional 84.63, standards_penalty_points 1.50, provisional_composite_score 83.13 and provisional_grade MEETS_STANDARDS"
