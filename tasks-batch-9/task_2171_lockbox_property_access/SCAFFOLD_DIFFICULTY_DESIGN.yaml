              captures: { m1_v3: $.data.version }
            - call: "POST /members/${m1_id}/membership-events"
              payload: { event_type: "REINSTATE", expected_member_version: "${m1_v3}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /access-credentials/${c1_id}/state"
              payload: { action: "ACTIVATE", expected_credential_version: "${c1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          assert:
            - "First ACTIVATE responds HTTP 409 with data.error_id == \"ERR_MEMBER_NOT_ELIGIBLE\""
            - "Immediately after the failed ACTIVATE, GET /access-credentials/${c1_id} returns status == \"PENDING_ACTIVATION\""
            - "After REINSTATE, the second ACTIVATE responds HTTP 200 and GET /access-credentials/${c1_id} returns status == \"ACTIVE\""
            - "GET /members/${m1_id} returns membership_status == \"ACTIVE\" and active_credential_count == 1"

