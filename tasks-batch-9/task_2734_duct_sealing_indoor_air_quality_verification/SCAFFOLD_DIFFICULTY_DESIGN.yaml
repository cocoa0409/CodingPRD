  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: abort_restores_duct_leakage_ledger_identity
        grounds:
          - state_machines.SealJob.INJECTING_to_ABORTED_MANUAL
          - state_machines.DuctSystem.SEALING_to_SEAL_PENDING
          - entities.DuctSystem.fields.working_leakage_cfm25
          - entities.DuctSystem.fields.sealed_leakage_reduction_cfm
          - calculations.sealing_run_curve_monitor
          - endpoints[POST /duct-sealing/seal-jobs/{id}/abort]
        distinguishing_aspect: |
          Conserved quantity #1: AIRFLOW on a single duct system. The invariant
          working_leakage_cfm25 + sealed_leakage_reduction_cfm == baseline_leakage_cfm25 holds mid-run
          (120.00 + 180.00 == 300.00) and must hold again after the manual abort compensation snaps the
          ledger back to its origin (300.00 + 0.00 == 300.00) with zero drift, while the three recorded
          LeakageSample rows are immutable history and are NOT deleted.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z"
            - "Certified technician, program, project, ELIGIBLE duct system"
            - "Accepted PRE test at 300.0 CFM @ 25 Pa -> baseline_leakage_cfm25 300.00, working 300.00, reduction 0.00"
            - "PASS PRE-phase combustion test; seal job masked and injecting"
            - "Three leakage samples recorded: 300.0 @ 0 s, 200.0 @ 240 s, 120.0 @ 480 s -> current_leakage_cfm 120.0"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
