              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 1, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a2@example.com", full_name: "Attendee Two", registration_id: "REG-2", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att2_id: $.data.id }
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a3@example.com", full_name: "Attendee Three", registration_id: "REG-3", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att3_id: $.data.id }
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att1_id}", check_in_date: "2026-09-14", check_out_date: "2026-09-16", occupants: 1 }
              as: Attendee
              as_user_id: "${att1_id}"
              captures: { resA_id: $.data.id }
          trigger:
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att2_id}", check_in_date: "2026-09-16", check_out_date: "2026-09-18", occupants: 1 }
              as: Attendee
              as_user_id: "${att2_id}"
              captures: { resB_id: $.data.id }
