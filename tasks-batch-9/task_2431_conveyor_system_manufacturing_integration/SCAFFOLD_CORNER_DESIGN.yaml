      - name: buffer_padded_window_overlap_on_one_zone_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_ZONE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / zone_window_buffer_padded_half_open_exclusion_boundary
          rationale: "That instance pins both the last rejected minute and the first accepted minute of the buffer-padded exclusion window."

      - name: aggregate_bay_occupancy_above_capacity_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_STAGING_BAY_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / staging_bay_closed_interval_aggregate_capacity_exceeded
          rationale: "That instance builds two individually legal lots and a third that pushes one instant above concurrent_capacity, which is the aggregate-validation claim."

  # =========================================================================
  # From Table 5 (Endpoints)
  # The Bulk action row of the guide is not applicable: §1.5 declares no bulk
  # endpoint (every write acts on a single resource), so no instance is emitted
  # for it.
  # =========================================================================
  - section: endpoints
    instances:
      - name: segment_patch_revises_the_rating_and_stales_the_current_simulation
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /segments/{id}]
          - state_machines.SimulationRun.COMPLETE_to_STALE
          - entities.Project.fields.design_version
        distinguishing_aspect: |
          PATCH /segments/{id} with only rated_capacity_cph 1200 rewrites that one field, bumps the segment's own
          version to 2 and the project's design_version to 5, and pushes the COMPLETE run to STALE without
          recomputing it — derated_capacity_cph still shows the pre-edit 1400.
        test_recipe:
          setup:
            - "Fixture A design with a COMPLETE DETERMINISTIC_STEADY_STATE run (effective_throughput_cph 1400)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-050"
              captures: { proj_e1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e1}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_e1a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e1}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_e1b: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_e1}", from_segment_id: "${seg_e1a}", to_segment_id: "${seg_e1b}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_e1}/simulations"
              payload: { method: "DETERMINISTIC_STEADY_STATE" }
              as: DesignEngineer
              captures: { sim_e1: $.data.id }
          trigger:
            - call: "PATCH /segments/${seg_e1b}"
              payload: { rated_capacity_cph: 1200 }
              as: DesignEngineer
          assert:
            - "the response is 200 and ConveyorSegment.${seg_e1b}.rated_capacity_cph == 1200"
            - "ConveyorSegment.${seg_e1b}.availability_pct == 95 and segment_code == 'TR-02' (untouched by the partial update)"
            - "ConveyorSegment.${seg_e1b}.version == 2 and ConveyorSegment.${seg_e1b}.derated_capacity_cph == 1400 (stale until the next run)"
            - "SimulationRun.${sim_e1}.status == STALE with effective_throughput_cph still 1400"
            - "Project.${proj_e1}.design_version == 5 and Project.${proj_e1}.delivery_status == DESIGN"

      - name: clock_set_endpoint_moves_the_logical_clock_without_mutating_entities
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - envelope.clock
        distinguishing_aspect: |
          Moving the clock from its 2026-08-01T00:00:00Z default to 2026-09-15T06:30:00Z leaves the existing
          project's created_at and version untouched, while the very next created project is stamped
          2026-09-15T06:30:00Z — proving the endpoint drives timestamps and mutates nothing itself.
        test_recipe:
          setup:
            - "One project created at the clock default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-051"
              captures: { proj_e2a: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T06:30:00Z" }
              as: ProjectDirector
              as_user_id: "pd-051"
            - call: "POST /projects"
              payload: { customer_name: "Vantage Parcel", facility_code: "DC-DEN-01", customer_rep_user_id: "cust-rep-90", required_throughput_cph: 600, contract_base_cents: 100000000, authorized_ceiling_cents: 120000000, spares_budget_cents: 1000000, service_tier: "BASIC" }
              as: ProjectDirector
              as_user_id: "pd-051"
              captures: { proj_e2b: $.data.id }
          assert:
            - "the clock call returns 200"
            - "Project.${proj_e2a}.created_at == '2026-08-01T00:00:00Z' and updated_at == '2026-08-01T00:00:00Z' and version == 1"
            - "Project.${proj_e2b}.created_at == '2026-09-15T06:30:00Z'"
            - "Project.${proj_e2a}.delivery_status == DESIGN and design_version == 1 (no entity was touched by the clock move)"

      - name: cutover_window_is_reachable_through_both_the_zone_and_the_lot_filter
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /cutover-windows]
          - endpoints[GET /cutover-windows]
          - entities.CutoverWindow.fields.site_zone_id
          - entities.CutoverWindow.fields.fabrication_lot_id
        distinguishing_aspect: |
          The window created against zone Z-INBOUND and lot LOT-1400 is returned by
          GET /cutover-windows?site_zone_id=... and by GET /cutover-windows?fabrication_lot_id=..., and both
          reverse lookups reach the same single row.
        test_recipe:
          setup:
            - "Fixture A project frozen with a PLANNED lot LOT-1400 in bay BAY-14 and a zone Z-INBOUND at 10000 bps."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-10", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-052"
              captures: { proj_e3: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e3}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_e3a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e3}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_e3b: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_e3}", from_segment_id: "${seg_e3a}", to_segment_id: "${seg_e3b}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_e3}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_e3}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-052"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-14", concurrent_capacity: 1 }
              as: ShopSupervisor
              captures: { bay_e3: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_e3}", lot_code: "LOT-1400", staging_bay_id: "${bay_e3}", segment_codes: ["IB-01", "TR-02"], occupancy_start_utc: "2026-08-02T00:00:00Z", occupancy_end_utc: "2026-08-05T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_e3: $.data.id }
            - call: "POST /site-zones"
              payload: { project_id: "${proj_e3}", zone_code: "Z-INBOUND", throughput_share_bps: 10000, protected_shift_start_minute: 480, protected_shift_end_minute: 1080, buffer_minutes: 60 }
              as: SiteManager
              as_user_id: "sm-052"
              captures: { zone_e3: $.data.id }
          trigger:
            - call: "POST /cutover-windows"
              payload: { project_id: "${proj_e3}", site_zone_id: "${zone_e3}", fabrication_lot_id: "${lot_e3}", start_utc: "2026-08-10T19:00:00Z", end_utc: "2026-08-10T23:00:00Z" }
              as: SiteManager
              as_user_id: "sm-052"
              captures: { win_e3: $.data.id }
          assert:
            - "the response is 201 and CutoverWindow.${win_e3}.site_zone_id == ${zone_e3} and fabrication_lot_id == ${lot_e3}"
            - "CutoverWindow.${win_e3}.status == SCHEDULED with started_at == null and closed_at == null"
            - "GET /cutover-windows?site_zone_id=${zone_e3} returns total_count == 1 containing ${win_e3}"
            - "GET /cutover-windows?fabrication_lot_id=${lot_e3} returns total_count == 1 containing ${win_e3}"
            - "GET /cutover-windows?project_id=${proj_e3}&status=SCHEDULED returns total_count == 1"
            - "FabricationLot.${lot_e3}.status == PLANNED (scheduling a window does not advance the lot)"

      - name: segment_list_exposes_the_flow_shares_of_the_latest_run
        claim_type: computed_read
        grounds:
          - endpoints[GET /projects/{id}/segments]
          - calculations.line_throughput_simulation
          - entities.ConveyorSegment.fields.flow_share_bps
        distinguishing_aspect: |
          After a DEGRADED_AVAILABILITY run over a 6000 / 4000 split, the segment list reports flow_share_bps
          10000 / 6000 / 4000 with derated capacities 1440 / 1330 / 855, and the bottleneck is the 1440-cph
          source rather than either downstream branch.
        test_recipe:
          setup:
            - "A project with required_throughput_cph 1250: IB-01 BELT 1500 / 96% source, splitting 6000 bps to TR-02 ROLLER 1400 / 95% and 4000 bps to TR-03 ROLLER 900 / 95%."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-11", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-053"
              captures: { proj_e4: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e4}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_e4a: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e4}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_e4b: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e4}", segment_code: "TR-03", equipment_class: "ROLLER", rated_capacity_cph: 900, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_e4c: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_e4}", from_segment_id: "${seg_e4a}", to_segment_id: "${seg_e4b}", split_share_bps: 6000 }
              as: DesignEngineer
            - call: "POST /flow-links"
              payload: { project_id: "${proj_e4}", from_segment_id: "${seg_e4a}", to_segment_id: "${seg_e4c}", split_share_bps: 4000 }
              as: DesignEngineer
          trigger:
            - call: "POST /projects/${proj_e4}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
              captures: { sim_e4: $.data.id }
          assert:
            - "the response is 201 and SimulationRun.${sim_e4}.effective_throughput_cph == 1440 with bottleneck_segment_code == 'IB-01'"
            - "SimulationRun.${sim_e4}.shortfall_cph == 0 and bottleneck_availability_pct == 96"
            - "ConveyorSegment.${seg_e4a}.flow_share_bps == 10000 and derated_capacity_cph == 1440"
            - "ConveyorSegment.${seg_e4b}.flow_share_bps == 6000 and derated_capacity_cph == 1330 (system rate floor(1330 * 10000 / 6000) == 2216)"
            - "ConveyorSegment.${seg_e4c}.flow_share_bps == 4000 and derated_capacity_cph == 855 (system rate floor(855 * 10000 / 4000) == 2137)"
            - "GET /projects/${proj_e4}/segments returns total_count == 3 and GET /projects/${proj_e4}/segments?equipment_class=ROLLER returns total_count == 2"

      - name: fabrication_lot_creation_before_design_freeze_returns_design_not_frozen
        claim_type: conditional_action
        grounds:
          - endpoints[POST /fabrication-lots]
          - errors[ERR_DESIGN_NOT_FROZEN]
          - validations[priority=8]
        distinguishing_aspect: |
          Planning a lot is conditional on the project having left DESIGN through design-freeze: with a valid bay,
          valid segment_codes and a legal occupancy interval the call still fails 409 ERR_DESIGN_NOT_FROZEN.
        test_recipe:
          setup:
            - "Fixture A project still in DESIGN (no freeze) with bay BAY-15 registered."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-12", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-054"
              captures: { proj_e5: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_e5}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_e5: $.data.id }
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-15", concurrent_capacity: 1 }
              as: ShopSupervisor
              captures: { bay_e5: $.data.id }
          trigger:
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_e5}", lot_code: "LOT-1500", staging_bay_id: "${bay_e5}", segment_codes: ["IB-01"], occupancy_start_utc: "2026-08-02T00:00:00Z", occupancy_end_utc: "2026-08-05T00:00:00Z" }
              as: ShopSupervisor
              captures: { err_e5: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_DESIGN_NOT_FROZEN"
            - "Project.${proj_e5}.delivery_status == DESIGN and design_frozen_at == null"
            - "GET /fabrication-lots?project_id=${proj_e5} returns total_count == 0"
            - "StagingBay.${bay_e5}.concurrent_capacity == 1 (the bay is untouched)"

  # =========================================================================
  # From Table 6 (Errors) — every catalog id must be triggerable
  # =========================================================================
  - section: errors
    instances:
      - name: unknown_path_ids_each_return_their_entity_specific_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_FLOW_LINK_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_WINDOW_NOT_FOUND]
          - errors[ERR_CHANGE_ORDER_NOT_FOUND]
          - errors[ERR_CERTIFICATE_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
        distinguishing_aspect: |
          The same syntactically valid but unknown UUID in seven different path positions yields seven distinct
          404 codes rather than one generic not-found, proving priority 4 resolves per entity type.
        test_recipe:
          setup:
            - "The store is empty of the id 22222222-2222-4222-8222-222222222222 in every entity table."
          setup_api_calls: []
          trigger:
            - call: "GET /projects/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-060"
              captures: { err_n1: $.data.error_id }
            - call: "GET /flow-links/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: DesignEngineer
              captures: { err_n2: $.data.error_id }
            - call: "GET /fabrication-lots/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: ShopSupervisor
              captures: { err_n3: $.data.error_id }
            - call: "GET /cutover-windows/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: SiteManager
              captures: { err_n4: $.data.error_id }
            - call: "GET /change-orders/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-060"
              captures: { err_n5: $.data.error_id }
            - call: "GET /acceptance-certificates/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-060"
              captures: { err_n6: $.data.error_id }
            - call: "POST /performance-disputes/22222222-2222-4222-8222-222222222222/joint-retest"
              payload: { retest_measured_cph: 1200 }
              as: SiteManager
              as_user_id: "sm-060"
              captures: { err_n7: $.data.error_id }
          assert:
            - "every call returns 404"
            - "the project read returns error_id ERR_PROJECT_NOT_FOUND"
            - "the flow-link read returns error_id ERR_FLOW_LINK_NOT_FOUND"
            - "the fabrication-lot read returns error_id ERR_LOT_NOT_FOUND"
            - "the cutover-window read returns error_id ERR_WINDOW_NOT_FOUND"
            - "the change-order read returns error_id ERR_CHANGE_ORDER_NOT_FOUND"
            - "the acceptance-certificate read returns error_id ERR_CERTIFICATE_NOT_FOUND"
            - "the joint-retest returns error_id ERR_DISPUTE_NOT_FOUND (the path id is resolved before the body is applied)"

      - name: unknown_body_ids_each_return_their_entity_specific_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=6]
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_STAGING_BAY_NOT_FOUND]
          - errors[ERR_ZONE_NOT_FOUND]
        distinguishing_aspect: |
          Priority 6 resolves body references per field: an unknown project_id, an unknown staging_bay_id and an
          unknown site_zone_id return ERR_PROJECT_NOT_FOUND, ERR_STAGING_BAY_NOT_FOUND and ERR_ZONE_NOT_FOUND
          respectively, and each is decided before any state gate of priority 8.
        test_recipe:
          setup:
            - "Fixture A project frozen with a PLANNED lot LOT-1600 in bay BAY-16."
            - "The id 33333333-3333-4333-8333-333333333333 exists in no table."
          setup_api_calls:
