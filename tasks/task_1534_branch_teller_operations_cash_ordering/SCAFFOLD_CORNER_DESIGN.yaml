      - name: cross_branch_account_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CROSS_BRANCH]"]
        distinguishing_aspect: "A transaction whose account belongs to a different branch than the drawer is rejected with ERR_CROSS_BRANCH (422)."
        test_recipe:
          setup: ["Branches B1 and B2; teller T on B1 with OPEN drawer; account A on B2"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B1", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
