    roles: [PlatformAdmin, PrivacyAgent, AccountOwner, Member, Auditor]
    code: 200
    input: []
    output: MonitoredProfile
    side_effects: []

  - method: PATCH
    path: "/monitored-profiles/{id}"
    description: "Edits the two mutable configuration fields; toggling two_factor_attested re-derives hygiene_score and hygiene_band immediately."
    roles: [AccountOwner, Member]
    code: 200
    input: ["two_factor_attested?", "rescan_cadence_days?"]
    output: MonitoredProfile
    side_effects:
      - "re-derives hygiene_score and hygiene_band under the newly selected variant"
      - "increments MonitoredProfile.version by 1"

  - method: POST
    path: "/monitored-profiles/{id}/activate"
    description: "Starts (or restarts) monitoring. From DRAFT it consumes a PROFILE unit; from PAUSED it consumes nothing."
    roles: [AccountOwner, Member]
    code: 200
    input: []
    output: MonitoredProfile
    side_effects:
      - "MonitoredProfile DRAFT -> ACTIVE (consumes one PROFILE unit) or PAUSED -> ACTIVE (consumes nothing)"
      - "increments MonitoredProfile.version by 1"

  - method: POST
    path: "/monitored-profiles/{id}/pause"
    description: "Pauses monitoring; the PROFILE unit stays held."
    roles: [AccountOwner, Member]
    code: 200
    input: []
    output: MonitoredProfile
    side_effects:
      - "MonitoredProfile ACTIVE -> PAUSED"
      - "QUEUED ScanRun rows on the profile -> CANCELLED, each releasing its SCAN unit"
      - "increments MonitoredProfile.version by 1"

  - method: POST
    path: "/monitored-profiles/{id}/retire"
    description: "Retires the profile and releases its PROFILE unit when one was held."
    roles: [AccountOwner, Member]
    code: 200
    input: []
    output: MonitoredProfile
    side_effects:
      - "MonitoredProfile -> RETIRED"
      - "appends a PROFILE RELEASE ledger entry when the profile was ACTIVE or PAUSED"
      - "increments MonitoredProfile.version by 1"

  - method: POST
    path: "/monitored-profiles/{id}/identifiers"
    description: "Adds an immutable monitored identifier. Guarded by OCC on the profile's version."
    roles: [AccountOwner, Member]
    code: 201
    input: [identifier_type, identifier_value, expected_profile_version]
    output: Identifier
    side_effects:
      - "creates an immutable Identifier row"
