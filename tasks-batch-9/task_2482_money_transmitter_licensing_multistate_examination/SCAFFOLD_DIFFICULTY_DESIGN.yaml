            - "Licensee.${lic_id}.consecutive_failed_test_count == 0"

  - rule_id: boundary_precision_check
    instances:
      - name: coverage_ratio_at_exactly_ten_thousand_bps_is_compliant
        grounds:
          - calculations.permissible_investment_coverage
          - calculations.licensee_coverage_posture
          - entities.Licensee.fields.coverage_ratio_bps
        distinguishing_aspect: |
          Metric: the integer basis-point coverage ratio on GET /licensees/{id}/coverage-summary.
          One cent of extra CASH moves the floored ratio from 9999 (WATCH) to exactly 10000
          (COMPLIANT), proving the comparison is >= COVERAGE_PASS_BPS and that the division floors
          rather than rounds.
        test_recipe:
          setup:
            - "Jurisdiction CA; licensee with one ACTIVE CA license carrying 85000000 cents of obligations."
            - "A single HELD CASH holding of 84999999 cents at BankA (no haircut, no cap for CASH)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
