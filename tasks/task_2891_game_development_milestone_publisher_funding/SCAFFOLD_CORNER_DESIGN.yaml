              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
          trigger:
            - call: "GET /studios/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
            - call: "GET /publishers/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlatformAdmin
            - call: "GET /publisher-users/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PlatformAdmin
            - call: "GET /milestone-builds/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: PlatformAdmin
            - call: "GET /publisher-reviews/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: PlatformAdmin
            - call: "GET /milestone-payments/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: PlatformAdmin
            - call: "GET /change-orders/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: PlatformAdmin
            - call: "GET /contractor-engagements/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: PlatformAdmin
            - call: "GET /contractor-invoices/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: PlatformAdmin
            - call: "GET /royalty-statements/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: PlatformAdmin
            - call: "GET /contractor-engagements/00000000-0000-4000-8000-00000000000b/invoices"
              payload: {}
              as: PlatformAdmin
            - call: "GET /milestones/00000000-0000-4000-8000-00000000000c/budget-summary"
              payload: {}
              as: PlatformAdmin
          assert:
            - "trigger call 1 -> HTTP 404 ERR_STUDIO_NOT_FOUND; call 2 -> 404 ERR_PUBLISHER_NOT_FOUND; call 3 -> 404 ERR_PUBLISHER_USER_NOT_FOUND"
            - "trigger call 4 -> HTTP 404 ERR_BUILD_NOT_FOUND; call 5 -> 404 ERR_REVIEW_NOT_FOUND; call 6 -> 404 ERR_PAYMENT_NOT_FOUND"
            - "trigger call 7 -> HTTP 404 ERR_CHANGE_ORDER_NOT_FOUND; call 8 -> 404 ERR_ENGAGEMENT_NOT_FOUND; call 9 -> 404 ERR_INVOICE_NOT_FOUND; call 10 -> 404 ERR_STATEMENT_NOT_FOUND"
            - "trigger call 11 -> HTTP 404 ERR_ENGAGEMENT_NOT_FOUND (a sub-collection route resolves the parent first, it does not answer 200 with an empty array)"
            - "trigger call 12 -> HTTP 404 ERR_MILESTONE_NOT_FOUND (the computed-read route resolves the milestone before computing anything)"
            - "every response body follows the §1.0 error envelope: response_type == error and data.error_id set, with no data payload of the missing entity"

      - name: corner_milestone_and_build_state_gates_each_report_their_own_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=30]
          - validations[priority=31]
          - validations[priority=33]
          - validations[priority=34]
          - validations[priority=37]
          - errors.ERR_FUNDING_POSTURE_RESTRICTED
          - errors.ERR_MILESTONE_NOT_OPEN_FOR_BUILD
          - errors.ERR_MILESTONE_NOT_UNDER_REVIEW
          - errors.ERR_BUILD_SUPERSEDED
          - errors.ERR_MILESTONE_NOT_AMENDABLE
        distinguishing_aspect: "ERR_BUILD_SUPERSEDED is only reachable in a narrow window: the milestone must be UNDER_REVIEW (or priority 33 fires first) while the targeted build is no longer the latest, which requires a reject-then-resubmit history. The same fixture then walks the milestone into ACCEPTED to reach the three codes that only a terminal-for-scope milestone can produce: NOT_OPEN_FOR_BUILD, NOT_UNDER_REVIEW, NOT_AMENDABLE, plus the agreement-level FUNDING_POSTURE_RESTRICTED once accepted_value_cents covers the whole pool."
