        distinguishing_aspect: "A newly created TaxProfile is DRAFT, and because it is not VERIFIED the resolved withholding_rate_bps is the 2400 backup rate even though the form is a W9 with a TIN."
        test_recipe:
          setup: ["One creator at version 1 with no tax profile."]
          setup_api_calls:
