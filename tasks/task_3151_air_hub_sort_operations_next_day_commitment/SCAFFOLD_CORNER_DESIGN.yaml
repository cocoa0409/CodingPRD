            - "at live 504100 the shift reads ${posture_red} == RED with ${var_red} == 0.3266"
            - "RED wins over SATURATED because the capacity rule (live > 504000) is evaluated first"
            - "LaborShift.${shift_id}.volume_variance_pct is a 4-decimal rounded figure, so 0.1497 and not 0.149736"

      - name: hub_thresholds_apply_the_declared_floor_to_a_non_round_window
        claim_type: Precision
        grounds:
          - calculations.hub_posture
          - constants.CONGESTED_GRAMS_PER_WINDOW_MINUTE
          - constants.LOCKDOWN_GRAMS_PER_WINDOW_MINUTE
          - endpoints.GET_/airhub/hubs/{hub_id}
        distinguishing_aspect: "A hub whose window is 181 minutes floors both thresholds to whole grams — 362000 and 905000 — so 362000 reads OPEN and 362100 reads CONGESTED, showing the floor is applied before the comparison rather than after."
        test_recipe:
          setup:
            - "Clock 1400. A hub with window 1380-1561 (181 minutes), BANK_A with N701UP landed and unloaded, lane P-01, shift N-1 (1380-1561), and a 362000-gram package live."
          setup_api_calls:
            - *c_clock
            - call: "POST /airhub/hubs"
              payload: { iata_code: "SDF", name: "Worldport Louisville", sort_window_open_minutes: 1380, sort_window_close_minutes: 1561 }
              as: HubOpsManager
              captures: { hub_id: $.data.id }
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1700 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - call: "POST /airhub/shifts"
              payload: { hub_id: "${hub_id}", shift_code: "N-1", start_minutes: 1380, end_minutes: 1561, headcount: 40, productivity_grams_per_operator_hour: 4200, forecast_volume_grams: 380000, certified_for_hazmat: true }
              as: SortSupervisor
              captures: { shift_id: $.data.id }
            - call: "POST /airhub/banks"
              payload: { hub_id: "${hub_id}", bank_code: "BANK_A", scheduled_start_minutes: 1400, scheduled_end_minutes: 1520, hydraulic_crew_available: true }
              as: HubOpsManager
              captures: { bank_id: $.data.id }
            - call: "POST /airhub/aircraft"
              payload: { bank_id: "${bank_id}", tail_number: "N701UP", origin_station_code: "LAX", scheduled_arrival_minutes: 1395, capacity_weight_grams: 700000 }
              as: GatewayCoordinator
              captures: { ac1_id: $.data.id }
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-PR-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 362000, dimension_weight_grams: 362000 }
              as: SortOperator
              captures: { pkg_pr1: $.data.id }
          trigger:
            - call: "GET /airhub/hubs/${hub_id}"
              payload: {}
              as: HubOpsManager
              captures: { posture_floored: $.data.posture }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-PR-0002", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 100, dimension_weight_grams: 100 }
              as: SortOperator
            - call: "GET /airhub/hubs/${hub_id}"
              payload: {}
              as: HubOpsManager
              captures: { posture_above: $.data.posture, total_above: $.data.live_planned_package_total }
          assert:
            - "the congestion threshold floors to floor(181 * 2000) == 362000, so a live total of exactly 362000 reads ${posture_floored} == OPEN"
            - "one 100-gram step later the hub reads ${posture_above} == CONGESTED at ${total_above} == 362100"
            - "the lockdown threshold floors to floor(181 * 5000) == 905000, not 905000.0 or 362000 * 2.5"
            - "Hub.${hub_id}.sort_window_close_minutes == 1561 and sort_window_open_minutes == 1380, so the window is 181 and not 180"

      - name: money_back_guarantee_tiers_and_perishable_surcharge_compose
        claim_type: Correct Result
        grounds:
          - calculations.money_back_guarantee_refund
          - constants.MBG_NEXT_DAY_CENTS_PER_KG
          - constants.MBG_PERISHABLE_SURCHARGE_CENTS
          - constants.MBG_PROVISIONAL_PCT
        distinguishing_aspect: "Four 100000-gram packages differing only in service_level and commodity_class collect four different provisional refunds — 38500, 21000, 9800 and 38675 — so the rate is keyed on service level while the surcharge is keyed orthogonally on commodity class."
        test_recipe:
          setup:
            - "Clock 1500. SDF hub, BANK_A with N701UP landed and unloaded, shift N-A, four 100000-gram packages: NEXT_DAY_AIR GENERAL, SECOND_DAY_AIR GENERAL, GROUND GENERAL and NEXT_DAY_AIR PERISHABLE."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-MB-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 100000, dimension_weight_grams: 100000 }
              as: SortOperator
              captures: { pkg_mb1: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-MB-0002", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "SECOND_DAY_AIR", planned_weight_grams: 100000, dimension_weight_grams: 100000 }
              as: SortOperator
              captures: { pkg_mb2: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-MB-0003", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "GROUND", planned_weight_grams: 100000, dimension_weight_grams: 100000 }
              as: SortOperator
              captures: { pkg_mb3: $.data.id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-MB-0004", commodity_class: "PERISHABLE", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 100000, dimension_weight_grams: 100000 }
              as: SortOperator
              captures: { pkg_mb4: $.data.id }
          trigger:
            - call: "POST /airhub/failures"
              payload: { hub_id: "${hub_id}", package_id: "${pkg_mb1}", cause_code: "SORT_MISS", failure_minutes: 1500 }
              as: RefundAdjuster
              captures: { amt_next: $.data.refund_amount_cents, role_next: $.data.attributed_role }
            - call: "POST /airhub/failures"
              payload: { hub_id: "${hub_id}", package_id: "${pkg_mb2}", cause_code: "SORT_MISS", failure_minutes: 1500 }
              as: RefundAdjuster
              captures: { amt_second: $.data.refund_amount_cents }
            - call: "POST /airhub/failures"
              payload: { hub_id: "${hub_id}", package_id: "${pkg_mb3}", cause_code: "SORT_MISS", failure_minutes: 1500 }
              as: RefundAdjuster
              captures: { amt_ground: $.data.refund_amount_cents }
            - call: "POST /airhub/failures"
              payload: { hub_id: "${hub_id}", package_id: "${pkg_mb4}", cause_code: "NO_SCAN", failure_minutes: 1500 }
              as: RefundAdjuster
              captures: { amt_perishable: $.data.refund_amount_cents }
          assert:
            - "the NEXT_DAY_AIR failure is ${role_next} == CARRIER and pays ${amt_next} == 38500 (gross round_half_up(100*550) == 55000, provisional 70%)"
            - "the SECOND_DAY_AIR failure pays ${amt_second} == 21000 (gross round_half_up(100*300) == 30000)"
            - "the GROUND failure pays ${amt_ground} == 9800 (gross round_half_up(100*140) == 14000) even though GROUND failures are refund-eligible when carrier-attributed"
            - "the PERISHABLE NEXT_DAY_AIR failure pays ${amt_perishable} == 38675 — gross round_half_up(55000 + 250) == 55250, provisional round_half_up(38675.0) == 38675"
            - "all four are attributed CARRIER with refund_eligible true, so the divergence comes only from service_level and commodity_class"

