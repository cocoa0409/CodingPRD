          multiple of 15, and a 255-minute interval exceeds the 240-minute ceiling), and the
          20-minute call is ALSO outside the authorization window yet still returns the
          lower-numbered ERR_INVALID_VISIT_DURATION. A legally scheduled future visit then cannot be
