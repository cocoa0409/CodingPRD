# =============================================================================
# PRD Benchmark Scaffold — Streaming Encoding & Content Delivery Operations
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2972. Streaming Encoding & Content Delivery Operations (streaming video platform operations):
  source mezzanine ingest with quality control checks for artifacts, audio levels and caption
  presence, encoding ladder configuration across resolutions, bitrates and codecs with device
  compatibility matrices, digital rights management packaging with license server configuration
  and playback entitlement rules, content delivery network multi-vendor routing with
  performance-based traffic steering, availability windowing with automated publish and takedown
  at contract dates, playback quality monitoring with rebuffer, startup time and error rate
  metrics by device and region, live event scaling with capacity reservation and failover
  streams, catalog reprocessing when codecs or standards change

domain_name: streaming-encoding-delivery-ops

# Flat topology: every entity is its own top-level collection. `/` means all
# collection paths hang directly off the API root (e.g. /titles, /encoding-ladders),
# with sub-resource reads only where a child has no own collection.
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["page", "page_size", "total_count", "has_more"]
  pagination_defaults: { page: 1, page_size: 20, page_size_min: 1, page_size_max: 100 }

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  difficulty_level: expert_plus
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  notes: |
    Flat peer entities linked by foreign keys, no nesting in URL paths. Title carries two
    independent state dimensions (availability_state x packaging_state); MezzanineAsset carries a
    QC revision cycle; EncodingLadder branches DRAFT -> {VALIDATED, REJECTED}; CdnVendor cycles
    ACTIVE -> DEGRADED -> ACTIVE from ingested playback metrics. Two selector policies (CDN vendor
    steering, entitlement rule matching) and two conserved quantities (vendor reserved bandwidth,
    title encode budget) supply the compensating-invariant surface.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Title
    parent: null
    common_fields: true
    fields:
      - name: external_ref
        type: string
        source: input
        description: "Studio-side catalog reference; unique across all Titles."
        constraints: "1-40 chars, uppercase letters/digits/hyphen, unique"
      - name: title_name
        type: string
        source: input
        description: "Human-readable title name."
        constraints: "1-200 chars"
      - name: content_type
        type: enum
        source: input
        description: "Kind of content, which gates live reservation eligibility."
        constraints: "MOVIE | EPISODE | LIVE_EVENT"
      - name: studio_code
        type: string
        source: input
        description: "Owning studio code, used for reporting only."
        constraints: "2-10 chars uppercase"
      - name: encode_budget_usd
        type: number
        source: input
        description: "Total reprocessing budget granted to this Title; conserved quantity B baseline."
        default: 5000.00
        constraints: ">= 0, 2 decimal places"
      - name: encode_budget_remaining_usd
        type: number
        source: computed
        description: "encode_budget_usd minus the sum of cost_estimate_usd over this Title's ReprocessJobs in state RUNNING or COMPLETED. See calculations.encode_budget_ledger."
        default: 5000.00
      - name: availability_state
        type: enum
        source: system
        description: "Publication dimension of the Title. Independent of packaging_state."
        default: DRAFT
        constraints: "DRAFT | SCHEDULED | PUBLISHED | TAKEN_DOWN | EXPIRED"
      - name: packaging_state
        type: enum
        source: system
        description: "Encode/DRM readiness dimension of the Title. Independent of availability_state."
        default: UNPACKAGED
        constraints: "UNPACKAGED | PACKAGING | PACKAGED | STALE"
      - name: takedown_reason
        type: enum
        source: computed
        description: "Why the Title left PUBLISHED; NONE while never taken down."
        default: NONE
        constraints: "NONE | CONTRACT_END | PACKAGING_STALE | MANUAL_LEGAL"
      - name: readiness_score_provisional
        type: number
        source: computed
        description: "Optimistic readiness, provisional variant of calculations.title_readiness_score."
        default: 0.00
      - name: readiness_score_certified
        type: number
        source: computed
        description: "Certified readiness, certified variant of calculations.title_readiness_score; gates automated publish at >= 80.00."
        default: 0.00
      - name: locked_ladder_count
        type: integer
        source: computed
        description: "Count of this Title's EncodingLadders in state LOCKED."
        default: 0
      - name: last_sweep_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the last availability sweep that evaluated this Title; null before the first sweep."
        default: null

  - name: MezzanineAsset
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the Title this source master belongs to."
      - name: source_uri
        type: string
        source: input
        description: "Storage URI of the mezzanine file."
        constraints: "1-300 chars"
      - name: duration_seconds
        type: integer
        source: input
        description: "Runtime of the master in whole seconds; drives reprocess cost."
        constraints: ">= 1"
      - name: frame_rate
        type: number
        source: input
        description: "Source frame rate."
        constraints: "one of 23.976, 24.0, 25.0, 29.97, 50.0, 59.94"
      - name: peak_audio_lufs
        type: number
        source: input
        description: "Measured program loudness in LUFS (negative); QC target is -24.0."
        constraints: "-60.0 .. 0.0"
      - name: artifact_defect_count
        type: integer
        source: input
        description: "Number of visual artifact defects detected by the ingest scanner."
        constraints: ">= 0"
      - name: caption_languages
        type: array
        source: input
        description: "Language codes with caption tracks present, e.g. [\"en\", \"es\"]."
        default: []
        constraints: "array of 2-char lowercase language codes, no duplicates"
      - name: audio_language
        type: string
        source: input
        description: "Primary audio language code; caption coverage is measured against it."
        constraints: "2-char lowercase language code"
      - name: qc_state
        type: enum
        source: system
        description: "QC lifecycle of this asset; cyclic through REMEDIATION_REQUESTED back to INGESTED."
        default: INGESTED
        constraints: "INGESTED | QC_PASSED | QC_FAILED | REMEDIATION_REQUESTED | QC_REJECTED"
      - name: qc_attempt_count
        type: integer
        source: computed
        description: "Number of QC runs executed against this asset; the 3rd failure sends it to QC_REJECTED."
        default: 0
      - name: latest_severity_index
        type: number
        source: computed
        description: "severity_index of the most recent QualityControlReport for this asset."
        default: 0.00
      - name: blocking_defect_code
        type: enum
        source: computed
        description: "Blocking defect from the most recent QualityControlReport; NONE when the last verdict was PASS or WARN."
        default: NONE
        constraints: "NONE | ARTIFACT_BURST | LOUDNESS_OUT_OF_SPEC | CAPTION_MISSING | MULTI_DEFECT"

  - name: QualityControlReport
    parent: null
    common_fields: false
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> MezzanineAsset.id; the asset this immutable report scores."
      - name: attempt_number
        type: integer
        source: computed
        description: "1-based QC attempt index this report records; equals the asset's qc_attempt_count after the run."
      - name: verdict
        type: enum
        source: computed
        description: "Outcome of the QC run per calculations.mezzanine_qc_verdict."
        constraints: "PASS | WARN | FAIL"
      - name: severity_index
        type: number
        source: computed
        description: "Weighted defect severity per calculations.mezzanine_qc_verdict."
      - name: artifact_penalty
        type: number
        source: computed
        description: "Artifact component of severity_index."
      - name: loudness_deviation_db
        type: number
        source: computed
        description: "abs(peak_audio_lufs - (-24.0)), rounded to 2 decimals."
      - name: caption_coverage_pct
        type: number
        source: computed
        description: "100.00 when audio_language is present in caption_languages, else 0.00."
      - name: blocking_defect_code
        type: enum
        source: computed
        description: "Single blocking defect that produced a FAIL verdict, or NONE."
        constraints: "NONE | ARTIFACT_BURST | LOUDNESS_OUT_OF_SPEC | CAPTION_MISSING | MULTI_DEFECT"
      - name: evaluated_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the QC run executed."

  - name: EncodingLadder
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the Title this ladder encodes."
      - name: codec_family
        type: enum
        source: input
        description: "Codec family every rung of this ladder uses."
        constraints: "H264 | HEVC | AV1"
      - name: rungs
        type: array
        source: input
        description: "Ordered rung list; each element is an object { label, height_px, bitrate_kbps }."
        constraints: "2-8 elements; height_px in 240..2160 strictly increasing in array order; bitrate_kbps in 200..40000; label unique within the array"
      - name: derived_from_ladder_id
        type: string
        source: input
        description: "FK -> EncodingLadder.id; ladder this one was cloned from (self-referential), null for hand-authored ladders."
        default: null
      - name: superseded_by_ladder_id
        type: string
        source: computed
        description: "FK -> EncodingLadder.id; ladder that superseded this one on lock, null while current."
        default: null
      - name: state
        type: enum
        source: system
        description: "Ladder lifecycle; DRAFT branches to VALIDATED or REJECTED."
        default: DRAFT
        constraints: "DRAFT | VALIDATED | REJECTED | LOCKED | SUPERSEDED"
      - name: rung_count
        type: integer
        source: computed
        description: "Number of elements in rungs."
      - name: peak_bitrate_kbps
        type: integer
        source: computed
        description: "Maximum bitrate_kbps over rungs."
      - name: peak_height_px
        type: integer
        source: computed
        description: "Maximum height_px over rungs."
      - name: device_compat_score
        type: number
        source: computed
        description: "Device coverage score per calculations.device_compat_score; recomputed on validate."
        default: 0.00
      - name: compatible_device_count
        type: integer
        source: computed
        description: "Number of ACTIVE DeviceProfiles this ladder can serve, per calculations.device_compat_score."
        default: 0
      - name: validation_reason_code
        type: enum
        source: computed
        description: "Why validate accepted or rejected this ladder."
        default: NONE
        constraints: "NONE | OK | NO_COMPATIBLE_DEVICE | BITRATE_NOT_MONOTONIC | DUPLICATE_HEIGHT"

  - name: DeviceProfile
    parent: null
    common_fields: true
    fields:
      - name: device_class
        type: enum
        source: input
        description: "Device family key; unique across DeviceProfiles."
        constraints: "SMART_TV_4K | SMART_TV_HD | MOBILE_HIGH | MOBILE_LOW | SET_TOP_LEGACY | BROWSER_HTML5, unique"
      - name: max_height_px
        type: integer
        source: input
        description: "Tallest rung this device can decode."
        constraints: "240..2160"
      - name: supported_codecs
        type: array
        source: input
        description: "Codec families this device can decode, e.g. [\"H264\", \"HEVC\"]."
        constraints: "1-3 members from H264 | HEVC | AV1, no duplicates"
      - name: min_bitrate_kbps
        type: integer
        source: input
        description: "Lowest rung bitrate this device will accept."
        constraints: "200..40000"
      - name: max_bitrate_kbps
        type: integer
        source: input
        description: "Highest rung bitrate this device will accept; must be >= min_bitrate_kbps."
        constraints: "200..40000"
      - name: hdcp_required
        type: boolean
        source: input
        description: "Whether this device enforces an HDCP output path."
        default: false
      - name: required_drm_system
        type: enum
        source: input
        description: "DRM system this device needs the Title packaged with; NONE means unencrypted playback is acceptable."
        default: NONE
        constraints: "WIDEVINE | PLAYREADY | FAIRPLAY | NONE"
      - name: market_share_pct
        type: number
        source: input
        description: "Share of the installed base, used as the device_compat_score weight."
        constraints: "0.00..100.00, 2 decimal places"
      - name: quality_normalization_factor
        type: number
        source: input
        description: "Penalty multiplier applied to playback quality of this device class; weaker devices get a smaller factor."
        constraints: "0.50..1.00, 2 decimal places"
      - name: state
        type: enum
        source: input
        description: "RETIRED profiles are excluded from device-compatibility scoring and from entitlement device scoping; historical PlaybackMetricWindows still read their quality_normalization_factor."
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

  - name: DrmPackage
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the Title this package protects."
      - name: ladder_id
        type: string
        source: input
        description: "FK -> EncodingLadder.id; the ladder whose renditions are encrypted. Must belong to title_id."
      - name: drm_systems
        type: array
        source: input
        description: "DRM systems provisioned on the license server, e.g. [\"WIDEVINE\", \"FAIRPLAY\"]."
        constraints: "1-3 members from WIDEVINE | PLAYREADY | FAIRPLAY, no duplicates"
      - name: license_server_url
        type: string
        source: input
        description: "HTTPS endpoint of the license server issuing keys for this package."
        constraints: "must start with https://, 8-300 chars"
      - name: key_rotation_hours
        type: integer
        source: input
        description: "Content-key rotation period in hours."
        default: 24
        constraints: "1..168"
      - name: persistent_license_allowed
        type: boolean
        source: input
        description: "Whether offline (persistent) licenses may be issued for this package."
        default: false
      - name: state
        type: enum
        source: system
        description: "Packaging lifecycle; STALE when the bound ladder is superseded, REVOKED is terminal."
        default: PENDING
        constraints: "PENDING | PACKAGED | STALE | REVOKED"
      - name: stale_reason
        type: enum
        source: computed
        description: "Why the package went STALE; NONE while never stale."
        default: NONE
        constraints: "NONE | LADDER_SUPERSEDED | CODEC_STANDARD_CHANGE"
      - name: hdcp_floor
        type: enum
        source: computed
        description: "Minimum HDCP level every EntitlementRule on this package must meet: TYPE_1 when the bound ladder peak_height_px >= 2160, TYPE_0 when >= 1080, else NONE."
        default: NONE
        constraints: "NONE | TYPE_0 | TYPE_1"
      - name: entitlement_rule_count
        type: integer
        source: computed
        description: "Number of EntitlementRules attached to this package."
        default: 0
      - name: packaged_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent successful package operation; null while never packaged."
        default: null

  - name: EntitlementRule
    parent: null
    common_fields: false
    fields:
      - name: package_id
        type: string
        source: input
        description: "FK -> DrmPackage.id; the package whose licenses this immutable rule governs."
      - name: region_code
        type: string
        source: input
        description: "ISO-3166 alpha-2 region this rule applies to, or \"*\" for any region."
        constraints: "2 uppercase letters or the single character *"
      - name: subscription_tier
        type: enum
        source: input
        description: "Subscriber tier this rule applies to; ANY matches every tier."
        constraints: "BASIC | STANDARD | PREMIUM | ANY"
      - name: device_class_scope
        type: enum
        source: input
        description: "Device families this rule applies to: TV_ONLY covers SMART_TV_4K, SMART_TV_HD, SET_TOP_LEGACY; MOBILE_ONLY covers MOBILE_HIGH, MOBILE_LOW."
        default: ALL
        constraints: "ALL | TV_ONLY | MOBILE_ONLY"
      - name: max_concurrent_streams
        type: integer
        source: input
        description: "Maximum simultaneous playback sessions permitted by this rule."
        constraints: "1..10"
      - name: max_playback_height_px
        type: integer
        source: input
        description: "Tallest rendition this rule licenses."
        constraints: "240..2160"
      - name: hdcp_level
        type: enum
        source: input
        description: "Output protection level this rule mandates; must be at or above the package hdcp_floor."
        constraints: "NONE | TYPE_0 | TYPE_1"
      - name: offline_playback_allowed
        type: boolean
        source: input
        description: "Whether this rule permits offline playback; requires the package persistent_license_allowed."
        default: false
      - name: priority
        type: integer
        source: input
        description: "Selector rank; higher priority wins in calculations.entitlement_decision."
        constraints: "1..100"

  - name: CdnVendor
    parent: null
    common_fields: true
    fields:
      - name: vendor_code
        type: string
        source: input
        description: "Short vendor key; unique across CdnVendors."
        constraints: "2-16 chars uppercase, unique"
      - name: regions
        type: array
        source: input
        description: "Region codes this vendor serves, e.g. [\"US\", \"CA\"]."
        constraints: "1-20 members, each 2 uppercase letters, no duplicates"
      - name: committed_gbps
        type: number
        source: input
        description: "Contracted egress capacity ceiling in Gbps for live reservations."
        constraints: "> 0, 2 decimal places"
      - name: cost_per_gb_usd
        type: number
        source: input
        description: "Egress unit price used by routing cost ranking and egress projection."
        constraints: "> 0, 4 decimal places"
      - name: state
        type: enum
        source: system
        description: "Vendor operating state; DEGRADED is reversible, DRAINED is terminal."
        default: ACTIVE
        constraints: "ACTIVE | DEGRADED | DRAINED"
      - name: reserved_gbps
        type: number
        source: computed
        description: "Sum of reserved_gbps over LiveEventReservations whose active_vendor_id is this vendor and whose state is RESERVED, ARMED, LIVE or FAILED_OVER; conserved quantity A."
        default: 0.00
      - name: health_score_rolling
        type: number
        source: computed
        description: "Rolling-window variant of calculations.vendor_health_score; drives ACTIVE/DEGRADED/DRAINED transitions."
        default: 100.00
      - name: health_score_contract
        type: number
        source: computed
        description: "Contract-period variant of calculations.vendor_health_score; drives routing eligibility and ranking."
        default: 100.00
      - name: breach_window_count
        type: integer
        source: computed
        description: "Count of ingested PlaybackMetricWindows for this vendor whose breach_flag is true."
        default: 0

  - name: RoutingPolicy
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the Title being steered."
      - name: region_code
        type: string
        source: input
        description: "Region this policy steers; unique together with title_id."
        constraints: "2 uppercase letters"
      - name: steering_mode
        type: enum
        source: input
        description: "Ranking mode used by calculations.routing_vendor_selection."
        constraints: "PERFORMANCE | COST | WEIGHTED"
      - name: primary_vendor_id
        type: string
        source: computed
        description: "FK -> CdnVendor.id; server-selected primary vendor, null when the policy is UNROUTABLE."
        default: null
      - name: backup_vendor_id
        type: string
        source: computed
        description: "FK -> CdnVendor.id; server-selected second-ranked vendor, null when only one candidate exists."
        default: null
      - name: state
        type: enum
        source: system
        description: "ACTIVE with a primary, STANDBY_ONLY with a primary but no backup, UNROUTABLE when no candidate remains."
        default: ACTIVE
        constraints: "ACTIVE | STANDBY_ONLY | UNROUTABLE"
      - name: excluded_vendor_ids
        type: array
        source: computed
        description: "Vendor ids excluded from the next selection because a resteer or auto-resteer moved off them."
        default: []
      - name: resteer_count
        type: integer
        source: computed
        description: "Number of times this policy re-ran the selector after creation."
        default: 0
      - name: selection_reason_code
        type: enum
        source: computed
        description: "Which ranking branch chose the current primary."
        default: NONE
        constraints: "NONE | PERFORMANCE_RANK | COST_RANK | WEIGHTED_RANK | NO_CANDIDATE"
      - name: projected_egress_cost_usd
        type: number
        source: computed
        description: "Projected monthly egress spend per calculations.egress_cost_projection."
        default: 0.00

  - name: PlaybackMetricWindow
    parent: null
    common_fields: false
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; Title the sessions played."
      - name: device_profile_id
        type: string
        source: input
        description: "FK -> DeviceProfile.id; device class the sessions ran on."
      - name: vendor_id
        type: string
        source: input
        description: "FK -> CdnVendor.id; vendor that delivered the sessions."
      - name: region_code
        type: string
        source: input
        description: "Region the sessions played in."
        constraints: "2 uppercase letters"
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the aggregation window."
      - name: window_end_at
        type: datetime
        source: input
        description: "Exclusive end of the aggregation window; must be strictly after window_start_at."
      - name: play_attempts
        type: integer
        source: input
        description: "Playback start attempts in the window."
        constraints: ">= 1"
      - name: rebuffer_events
        type: integer
        source: input
        description: "Rebuffer events observed in the window."
        constraints: ">= 0"
      - name: startup_ms_p95
        type: integer
        source: input
        description: "95th-percentile startup latency in milliseconds."
        constraints: "0..60000"
      - name: error_count
        type: integer
        source: input
        description: "Fatal playback errors in the window."
        constraints: ">= 0"
      - name: rebuffer_ratio
        type: number
        source: computed
        description: "rebuffer_events / play_attempts, rounded to 4 decimals."
      - name: error_rate
        type: number
        source: computed
        description: "error_count / play_attempts, rounded to 4 decimals."
      - name: quality_index
        type: number
        source: computed
        description: "Playback quality index per calculations.playback_quality_index."
      - name: breach_flag
        type: boolean
        source: computed
        description: "True when quality_index < 70.00 (strict less-than)."

  - name: LiveEventReservation
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; must be a Title with content_type LIVE_EVENT."
      - name: primary_vendor_id
        type: string
        source: input
        description: "FK -> CdnVendor.id; vendor holding the primary stream capacity."
      - name: failover_vendor_id
        type: string
        source: input
        description: "FK -> CdnVendor.id; vendor holding the standby stream, null when no failover is contracted."
        default: null
      - name: active_vendor_id
        type: string
        source: computed
        description: "FK -> CdnVendor.id; vendor currently charged with the reservation, equals primary_vendor_id until failover."
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the reserved broadcast window."
      - name: window_end_at
        type: datetime
        source: input
        description: "Inclusive end of the reserved broadcast window; must be strictly after window_start_at."
      - name: reserved_gbps
        type: number
        source: input
        description: "Egress capacity reserved on the active vendor for this event."
        constraints: "> 0, 2 decimal places"
      - name: buffer_minutes
        type: integer
        source: input
        description: "Setup/teardown buffer added to both ends of the window for capacity-overlap arithmetic."
        default: 15
        constraints: "0..60"
      - name: state
        type: enum
        source: system
        description: "Reservation lifecycle; ENDED and CANCELLED are terminal."
        default: RESERVED
        constraints: "RESERVED | ARMED | LIVE | FAILED_OVER | ENDED | CANCELLED"
      - name: failover_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the failover, null when never failed over."
        default: null
      - name: released_gbps
        type: number
        source: computed
        description: "Capacity released back to vendors when the reservation reached ENDED or CANCELLED; 0.00 while capacity is still held."
        default: 0.00

  - name: AvailabilityWindow
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; Title licensed by this contract window."
      - name: region_code
        type: string
        source: input
        description: "Region this window licenses."
        constraints: "2 uppercase letters"
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the half-open licensing interval."
      - name: window_end_at
        type: datetime
        source: input
        description: "Exclusive end of the half-open licensing interval; must be strictly after window_start_at."
      - name: license_tier
        type: enum
        source: input
        description: "Lowest subscriber tier licensed in this window."
        constraints: "BASIC | STANDARD | PREMIUM"
      - name: state
        type: enum
        source: system
        description: "Window lifecycle driven by the availability sweep; CLOSED and CANCELLED are terminal."
        default: SCHEDULED
        constraints: "SCHEDULED | ACTIVE | CLOSED | CANCELLED"
      - name: activated_at
        type: datetime
        source: computed
        description: "Logical-clock instant the sweep activated this window, null while SCHEDULED or CANCELLED."
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the sweep closed this window, null until CLOSED."
        default: null

  - name: ReprocessJob
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; Title whose catalog assets are re-encoded."
      - name: source_ladder_id
        type: string
        source: input
        description: "FK -> EncodingLadder.id; LOCKED ladder whose rung shape is re-encoded into the target codec."
      - name: result_ladder_id
        type: string
        source: computed
        description: "FK -> EncodingLadder.id; ladder created by a successful run, null until COMPLETED."
        default: null
      - name: trigger_reason
        type: enum
        source: input
        description: "Why the catalog is being reprocessed."
        constraints: "CODEC_DEPRECATION | STANDARD_UPDATE | QUALITY_REGRESSION | DEVICE_MATRIX_CHANGE"
      - name: target_codec_family
        type: enum
        source: input
        description: "Codec family the result ladder will use; must differ from the source ladder codec_family."
        constraints: "H264 | HEVC | AV1"
      - name: state
        type: enum
        source: system
        description: "Job lifecycle; COMPLETED, FAILED and ABORTED are terminal."
        default: QUEUED
        constraints: "QUEUED | RUNNING | COMPLETED | FAILED | ABORTED"
      - name: cost_estimate_usd
        type: number
        source: computed
        description: "Encode cost estimate per calculations.reprocess_cost_estimate; fixed at creation."
      - name: per_rung_cost_usd
        type: array
        source: computed
        description: "Per-rung rounded cost components, in source ladder rung order."
      - name: committed_usd
        type: number
        source: computed
        description: "Budget actually held against the Title: cost_estimate_usd while RUNNING or COMPLETED, 0.00 in QUEUED, FAILED and ABORTED."
        default: 0.00
      - name: priority_rank
        type: number
        source: computed
        description: "Scheduling rank per calculations.reprocess_cost_estimate constants; higher runs first, ties broken by created_at ASC."
        default: 0.00
      - name: abort_reason
        type: enum
        source: computed
        description: "Why the job left RUNNING without completing; NONE otherwise."
        default: NONE
        constraints: "NONE | OPERATOR_ABORT | BUDGET_RECLAIM | ENCODE_FAILURE"

# =============================================================================
# §1.2 State Machine Table
# Title carries TWO independent dimensions (availability_state, packaging_state)
# declared as two machines on the same entity. The availability sweep
# (POST /availability-sweep) is the ops-run checkpoint and applies its phases in
# this fixed order, which is load-bearing for every cascade below:
#   Phase 1 AvailabilityWindow activation/closure
#   Phase 2 LiveEventReservation start/end (capacity release)
#   Phase 3 ReprocessJob completion/failure (result-ladder creation + cascade)
#   Phase 4 Title.availability_state, at most ONE transition per Title per sweep
# =============================================================================
state_machines:

  - entity: Title
    dimension: availability_state
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /titles/{id}/availability-windows"
        actor: ContentOps
        preconditions:
          - "Title.availability_state == DRAFT"
          - "no AvailabilityWindow of this Title overlaps the new interval in the same region_code (half-open semantics, §1.4 priority 11)"
        side_effects:
          - "AvailabilityWindow created in SCHEDULED"
          - "Title.availability_state = SCHEDULED"
          - "increments Title.version by 1"
        note: "Windows created while the Title is already SCHEDULED/PUBLISHED/TAKEN_DOWN leave availability_state unchanged."
      - from: SCHEDULED
        to: PUBLISHED
        trigger: "POST /availability-sweep (system, Phase 4)"
        actor: system
        preconditions:
          - "after Phase 1, at least one AvailabilityWindow of this Title has state == ACTIVE"
          - "Title.packaging_state == PACKAGED (evaluated after Phase 3)"
          - "Title.readiness_score_certified >= 80.00"
        side_effects:
          - "Title.availability_state = PUBLISHED"
          - "Title.takedown_reason = NONE"
          - "Title.last_sweep_at = logical clock now"
      - from: PUBLISHED
        to: TAKEN_DOWN
        trigger: "POST /availability-sweep (system, Phase 4)"
        actor: system
        preconditions:
          - "after Phase 1, no AvailabilityWindow of this Title has state == ACTIVE"
          - "Title.packaging_state == PACKAGED (otherwise the PACKAGING_STALE cascade below already moved it)"
        side_effects:
          - "Title.availability_state = TAKEN_DOWN"
          - "Title.takedown_reason = CONTRACT_END"
          - "Title.last_sweep_at = logical clock now"
      - from: PUBLISHED
        to: TAKEN_DOWN
        trigger: "system cascade: Title.packaging_state became STALE"
        actor: system
        preconditions:
          - "Title.availability_state == PUBLISHED"
          - "Title.packaging_state transitioned to STALE in this request"
        side_effects:
          - "Title.availability_state = TAKEN_DOWN"
          - "Title.takedown_reason = PACKAGING_STALE"
          - "because availability_state became TAKEN_DOWN, every AvailabilityWindow of this Title with state == ACTIVE transitions to CLOSED with closed_at = logical clock now"
        note: "Hop 4 and hop 5 of the ladder-lock cascade (Rule 4 instance ladder_lock_supersede_chain)."
      - from: PUBLISHED
        to: TAKEN_DOWN
        trigger: "POST /titles/{id}/takedown"
        actor: ContentOps
        preconditions:
          - "Title.availability_state == PUBLISHED"
        side_effects:
          - "Title.availability_state = TAKEN_DOWN"
          - "Title.takedown_reason = MANUAL_LEGAL"
          - "every AvailabilityWindow of this Title with state == ACTIVE transitions to CLOSED with closed_at = logical clock now"
          - "increments Title.version by 1"
      - from: TAKEN_DOWN
        to: PUBLISHED
        trigger: "POST /availability-sweep (system, Phase 4)"
        actor: system
        preconditions:
          - "Title.takedown_reason != MANUAL_LEGAL"
          - "after Phase 1, at least one AvailabilityWindow of this Title has state == ACTIVE"
          - "Title.packaging_state == PACKAGED"
          - "Title.readiness_score_certified >= 80.00"
        side_effects:
          - "Title.availability_state = PUBLISHED"
          - "Title.takedown_reason = NONE"
          - "Title.last_sweep_at = logical clock now"
        note: "Cycle PUBLISHED -> TAKEN_DOWN -> PUBLISHED; MANUAL_LEGAL takedowns never auto-republish."
      - from: SCHEDULED
        to: EXPIRED
        trigger: "POST /availability-sweep (system, Phase 4)"
        actor: system
        preconditions:
          - "every AvailabilityWindow of this Title has state in {CLOSED, CANCELLED} and at least one exists"
          - "logical clock now >= max(window_end_at) over this Title's windows"
        side_effects:
          - "Title.availability_state = EXPIRED"
          - "Title.last_sweep_at = logical clock now"
      - from: TAKEN_DOWN
        to: EXPIRED
        trigger: "POST /availability-sweep (system, Phase 4)"
        actor: system
        preconditions:
          - "every AvailabilityWindow of this Title has state in {CLOSED, CANCELLED} and at least one exists"
          - "logical clock now >= max(window_end_at) over this Title's windows"
        side_effects:
          - "Title.availability_state = EXPIRED"
          - "Title.last_sweep_at = logical clock now"

  - entity: Title
    dimension: packaging_state
    initial_state: UNPACKAGED
    terminal_states: []
    transitions:
      - from: UNPACKAGED
        to: PACKAGING
        trigger: "system: packaging_state re-derivation after any EncodingLadder or DrmPackage mutation of this Title"
        actor: system
        preconditions:
          - "Title.locked_ladder_count >= 1"
          - "no DrmPackage of this Title has state in {PACKAGED, STALE}"
        side_effects:
          - "Title.packaging_state = PACKAGING"
          - "Title.readiness_score_provisional and readiness_score_certified recomputed (calculations.title_readiness_score)"
        note: |
          packaging_state is a compound (derived) dimension re-evaluated after EVERY mutation of this
          Title's EncodingLadders or DrmPackages, in this exact precedence:
            if any DrmPackage(state == STALE)        -> STALE
            elif any DrmPackage(state == PACKAGED)   -> PACKAGED
            elif locked_ladder_count >= 1            -> PACKAGING
            else                                     -> UNPACKAGED
          DrmPackages in state REVOKED are ignored by every branch.
      - from: PACKAGING
        to: PACKAGED
        trigger: "POST /drm-packages/{id}/package"
        actor: DrmOperator
        preconditions:
          - "the packaged DrmPackage belongs to this Title and reached state PACKAGED"
          - "no DrmPackage of this Title has state == STALE"
        side_effects:
          - "Title.packaging_state = PACKAGED"
          - "Title.readiness_score_provisional and readiness_score_certified recomputed"
      - from: PACKAGED
        to: STALE
        trigger: "system cascade: a DrmPackage of this Title transitioned PACKAGED -> STALE"
        actor: system
        preconditions:
          - "at least one DrmPackage of this Title has state == STALE"
        side_effects:
          - "Title.packaging_state = STALE"
          - "Title.readiness_score_certified recomputed (drops, since no PACKAGED package remains)"
          - "because packaging_state became STALE, the availability_state cascade PUBLISHED -> TAKEN_DOWN (takedown_reason = PACKAGING_STALE) fires"
        note: "Hop 3 of the ladder-lock cascade; hop 4/5 live on the availability_state machine."
      - from: STALE
        to: PACKAGED
        trigger: "POST /drm-packages/{id}/package (repackage with ladder_id rebind)"
        actor: DrmOperator
        preconditions:
          - "the repackaged DrmPackage left STALE for PACKAGED"
          - "no other DrmPackage of this Title has state == STALE"
        side_effects:
          - "Title.packaging_state = PACKAGED"
          - "Title.readiness_score_certified recomputed"
      - from: PACKAGED
        to: PACKAGING
        trigger: "POST /drm-packages/{id}/revoke"
        actor: DrmOperator
        preconditions:
          - "after revocation no DrmPackage of this Title has state in {PACKAGED, STALE}"
          - "Title.locked_ladder_count >= 1"
        side_effects:
          - "Title.packaging_state = PACKAGING"
          - "Title.readiness_score_certified recomputed"

  - entity: MezzanineAsset
    initial_state: INGESTED
    terminal_states: [QC_REJECTED]
    transitions:
      - from: INGESTED
        to: QC_PASSED
        trigger: "POST /mezzanine-assets/{id}/qc-runs (verdict PASS or WARN branch)"
        actor: QcAnalyst
        preconditions:
          - "MezzanineAsset.qc_state == INGESTED"
          - "MezzanineAsset.qc_attempt_count < 3"
          - "calculations.mezzanine_qc_verdict yields verdict in {PASS, WARN}"
        side_effects:
          - "QualityControlReport created (immutable) with attempt_number = qc_attempt_count + 1"
          - "MezzanineAsset.qc_attempt_count += 1"
          - "MezzanineAsset.latest_severity_index = report.severity_index; blocking_defect_code = NONE"
          - "Title.readiness_score_provisional and readiness_score_certified recomputed"
      - from: INGESTED
        to: QC_FAILED
        trigger: "POST /mezzanine-assets/{id}/qc-runs (verdict FAIL branch, attempt_number < 3)"
        actor: QcAnalyst
        preconditions:
          - "MezzanineAsset.qc_state == INGESTED"
          - "MezzanineAsset.qc_attempt_count < 2"
          - "calculations.mezzanine_qc_verdict yields verdict == FAIL"
        side_effects:
          - "QualityControlReport created with verdict FAIL and a non-NONE blocking_defect_code"
          - "MezzanineAsset.qc_attempt_count += 1"
          - "MezzanineAsset.latest_severity_index and blocking_defect_code copied from the report"
          - "Title.readiness_score_certified recomputed (drops to the ladder+package components only)"
      - from: INGESTED
        to: QC_REJECTED
        trigger: "POST /mezzanine-assets/{id}/qc-runs (verdict FAIL branch on the 3rd attempt)"
        actor: QcAnalyst
        preconditions:
          - "MezzanineAsset.qc_state == INGESTED"
          - "MezzanineAsset.qc_attempt_count == 2"
          - "calculations.mezzanine_qc_verdict yields verdict == FAIL"
        side_effects:
          - "QualityControlReport created with attempt_number = 3"
          - "MezzanineAsset.qc_attempt_count = 3; qc_state = QC_REJECTED (terminal)"
          - "Title.readiness_score_provisional recomputed: a QC_REJECTED asset leaves the optimistic numerator"
      - from: QC_FAILED
        to: REMEDIATION_REQUESTED
        trigger: "POST /mezzanine-assets/{id}/remediation-request"
        actor: QcAnalyst
        preconditions:
          - "MezzanineAsset.qc_state == QC_FAILED"
        side_effects:
          - "MezzanineAsset.qc_state = REMEDIATION_REQUESTED"
          - "increments MezzanineAsset.version by 1"
      - from: REMEDIATION_REQUESTED
        to: INGESTED
        trigger: "POST /mezzanine-assets/{id}/resubmit"
        actor: ContentOps
        preconditions:
          - "MezzanineAsset.qc_state == REMEDIATION_REQUESTED"
          - "MezzanineAsset.qc_attempt_count < 3"
        side_effects:
          - "source_uri, peak_audio_lufs, artifact_defect_count and caption_languages replaced by the resubmitted values"
          - "MezzanineAsset.qc_state = INGESTED; blocking_defect_code = NONE"
          - "Title.readiness_score_provisional recomputed (the asset re-enters the optimistic numerator)"
        note: "Closes the QC revision cycle INGESTED -> QC_FAILED -> REMEDIATION_REQUESTED -> INGESTED."

  - entity: EncodingLadder
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /encoding-ladders/{id}/validate (accepting branch)"
        actor: EncodingEngineer
        preconditions:
          - "EncodingLadder.state == DRAFT"
          - "rungs are strictly increasing in both height_px and bitrate_kbps in array order"
          - "no two rungs share a height_px"
          - "calculations.device_compat_score > 0.00"
        side_effects:
          - "EncodingLadder.state = VALIDATED; validation_reason_code = OK"
          - "device_compat_score and compatible_device_count written from calculations.device_compat_score"
          - "increments EncodingLadder.version by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /encoding-ladders/{id}/validate (rejecting branch)"
        actor: EncodingEngineer
        preconditions:
          - "EncodingLadder.state == DRAFT"
          - "at least one of: rungs not strictly increasing; duplicate height_px; calculations.device_compat_score == 0.00"
        side_effects:
          - "EncodingLadder.state = REJECTED (terminal)"
          - "validation_reason_code = BITRATE_NOT_MONOTONIC (checked first), else DUPLICATE_HEIGHT, else NO_COMPATIBLE_DEVICE"
          - "device_compat_score and compatible_device_count written (0.00 / 0 on the NO_COMPATIBLE_DEVICE branch)"
        note: |
          Branching fork with divergent side-effect sets: the accepting branch writes OK plus a positive
          score, the rejecting branch writes a diagnosis code and never becomes lockable. Both branches
          return HTTP 200 with the ladder body; neither is an error response.
      - from: VALIDATED
        to: LOCKED
        trigger: "POST /encoding-ladders/{id}/lock"
        actor: EncodingEngineer
        preconditions:
          - "EncodingLadder.state == VALIDATED"
          - "the Title has >= 1 MezzanineAsset and every MezzanineAsset of the Title has qc_state == QC_PASSED"
        side_effects:
          - "hop 1: EncodingLadder.state = LOCKED; Title.locked_ladder_count recomputed; Title.version += 1"
          - "hop 2: because this ladder locked, any other EncodingLadder of the same title_id AND same codec_family with state == LOCKED transitions to SUPERSEDED with superseded_by_ladder_id = this ladder id"
          - "hop 3: because that ladder became SUPERSEDED, every DrmPackage bound to it with state == PACKAGED transitions to STALE with stale_reason = LADDER_SUPERSEDED"
          - "hop 4: because a DrmPackage of the Title became STALE, Title.packaging_state PACKAGED -> STALE and readiness_score_certified is recomputed"
          - "hop 5: because Title.packaging_state became STALE, Title.availability_state PUBLISHED -> TAKEN_DOWN with takedown_reason = PACKAGING_STALE, and every ACTIVE AvailabilityWindow of the Title transitions to CLOSED"
        note: "Depth-5 transitive cascade; each hop is caused by the previous hop, not by the lock call itself."
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system cascade: another EncodingLadder of the same Title and codec_family locked, or a ReprocessJob result ladder replaced this one"
        actor: system
        preconditions:
          - "EncodingLadder.state == LOCKED"
        side_effects:
          - "EncodingLadder.state = SUPERSEDED; superseded_by_ladder_id = the replacing ladder id"
          - "every DrmPackage bound to this ladder with state == PACKAGED transitions to STALE (stale_reason = LADDER_SUPERSEDED)"
          - "Title.locked_ladder_count recomputed"

  - entity: DrmPackage
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: PACKAGED
        trigger: "POST /drm-packages/{id}/package"
        actor: DrmOperator
        preconditions:
          - "DrmPackage.state == PENDING"
          - "the bound EncodingLadder.state == LOCKED"
          - "the Title has >= 1 MezzanineAsset and every MezzanineAsset of the Title has qc_state == QC_PASSED"
          - "DrmPackage.entitlement_rule_count >= 1"
        side_effects:
          - "DrmPackage.state = PACKAGED; packaged_at = logical clock now"
          - "hdcp_floor recomputed from the bound ladder peak_height_px"
          - "Title.packaging_state re-derived (PACKAGING -> PACKAGED) and both readiness variants recomputed"
      - from: STALE
        to: PACKAGED
        trigger: "POST /drm-packages/{id}/package with ladder_id rebind"
        actor: DrmOperator
        preconditions:
          - "DrmPackage.state == STALE"
          - "the request supplies ladder_id of an EncodingLadder with state == LOCKED and the same title_id"
          - "the Title has >= 1 MezzanineAsset and every MezzanineAsset of the Title has qc_state == QC_PASSED"
        side_effects:
          - "DrmPackage.ladder_id = the supplied ladder_id; stale_reason = NONE; state = PACKAGED; packaged_at = now"
          - "hdcp_floor recomputed from the new ladder peak_height_px"
          - "Title.packaging_state re-derived (STALE -> PACKAGED); readiness_score_certified recomputed"
      - from: PACKAGED
        to: STALE
        trigger: "system cascade: the bound EncodingLadder transitioned LOCKED -> SUPERSEDED"
        actor: system
        preconditions:
          - "DrmPackage.state == PACKAGED"
        side_effects:
          - "DrmPackage.state = STALE; stale_reason = LADDER_SUPERSEDED"
          - "Title.packaging_state PACKAGED -> STALE (hop 4 of the lock cascade)"
      - from: PENDING
        to: REVOKED
        trigger: "POST /drm-packages/{id}/revoke"
        actor: DrmOperator
        preconditions:
          - "DrmPackage.state == PENDING"
        side_effects:
          - "DrmPackage.state = REVOKED (terminal); Title.packaging_state re-derived ignoring REVOKED packages"
      - from: PACKAGED
        to: REVOKED
        trigger: "POST /drm-packages/{id}/revoke"
        actor: DrmOperator
        preconditions:
          - "DrmPackage.state == PACKAGED"
        side_effects:
          - "DrmPackage.state = REVOKED (terminal)"
          - "Title.packaging_state re-derived (PACKAGED -> PACKAGING when a LOCKED ladder remains, else UNPACKAGED); readiness_score_certified recomputed"
      - from: STALE
        to: REVOKED
        trigger: "POST /drm-packages/{id}/revoke"
        actor: DrmOperator
        preconditions:
          - "DrmPackage.state == STALE"
        side_effects:
          - "DrmPackage.state = REVOKED (terminal); Title.packaging_state re-derived (STALE clears)"

  - entity: CdnVendor
    initial_state: ACTIVE
    terminal_states: [DRAINED]
    transitions:
      - from: ACTIVE
        to: DEGRADED
        trigger: "POST /playback-metrics (system, after health recompute)"
        actor: system
        preconditions:
          - "CdnVendor.breach_window_count < 5 (the DRAINED branch is evaluated first)"
          - "CdnVendor.health_score_rolling < 50.00 after the ingest"
        side_effects:
          - "hop 2: CdnVendor.state = DEGRADED"
          - "hop 3: because the vendor became DEGRADED, every RoutingPolicy with primary_vendor_id == this vendor and state in {ACTIVE, STANDBY_ONLY} re-runs calculations.routing_vendor_selection with this vendor added to excluded_vendor_ids, resteer_count += 1"
        note: "Hops 2-3 of the metric-ingest cascade (Rule 4 instance metric_breach_resteer_chain)."
      - from: DEGRADED
        to: ACTIVE
        trigger: "POST /playback-metrics (system, after health recompute)"
        actor: system
        preconditions:
          - "CdnVendor.breach_window_count < 5"
          - "CdnVendor.health_score_rolling >= 75.00 after the ingest"
        side_effects:
          - "CdnVendor.state = ACTIVE"
          - "no RoutingPolicy is re-steered back automatically; the vendor merely re-enters future candidate pools unless it sits in that policy's excluded_vendor_ids"
        note: "Recovery arm of the ACTIVE -> DEGRADED -> ACTIVE cycle."
      - from: ACTIVE
        to: DRAINED
        trigger: "POST /playback-metrics (system, after health recompute)"
        actor: system
        preconditions:
          - "CdnVendor.breach_window_count >= 5 after the ingest"
        side_effects:
          - "CdnVendor.state = DRAINED (terminal)"
          - "every RoutingPolicy with primary_vendor_id == this vendor re-runs the selector with this vendor excluded; policies with no remaining candidate become UNROUTABLE"
          - "LiveEventReservations already held on this vendor are NOT moved; their capacity stays counted until failover, cancel or end"
      - from: DEGRADED
        to: DRAINED
        trigger: "POST /playback-metrics (system, after health recompute)"
        actor: system
        preconditions:
          - "CdnVendor.breach_window_count >= 5 after the ingest"
        side_effects:
          - "CdnVendor.state = DRAINED (terminal)"
          - "every RoutingPolicy with primary_vendor_id == this vendor re-runs the selector with this vendor excluded"

  - entity: RoutingPolicy
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /routing-policies/{id}/resteer"
        actor: DeliveryEngineer
        preconditions:
          - "RoutingPolicy.state in {ACTIVE, STANDBY_ONLY}"
          - "calculations.routing_vendor_selection returns >= 2 candidates after excluding the current primary"
        side_effects:
          - "excluded_vendor_ids gains the outgoing primary_vendor_id"
          - "primary_vendor_id and backup_vendor_id rewritten from the selector; selection_reason_code updated"
          - "resteer_count += 1; projected_egress_cost_usd recomputed (calculations.egress_cost_projection)"
        note: "Self-transition; exclusion semantics on retry make repeated resteers converge to UNROUTABLE."
      - from: ACTIVE
        to: STANDBY_ONLY
        trigger: "POST /routing-policies/{id}/resteer or system auto-resteer from a vendor DEGRADED/DRAINED transition"
        actor: DeliveryEngineer
        preconditions:
          - "the selector returns exactly 1 eligible candidate after exclusions"
        side_effects:
          - "primary_vendor_id = the single candidate; backup_vendor_id = null; state = STANDBY_ONLY"
          - "resteer_count += 1; projected_egress_cost_usd recomputed"
      - from: STANDBY_ONLY
        to: ACTIVE
        trigger: "POST /routing-policies/{id}/resteer"
        actor: DeliveryEngineer
        preconditions:
          - "the selector returns >= 2 eligible candidates after exclusions"
        side_effects:
          - "primary_vendor_id and backup_vendor_id rewritten; state = ACTIVE; resteer_count += 1"
      - from: ACTIVE
        to: UNROUTABLE
        trigger: "system auto-resteer from a CdnVendor DEGRADED or DRAINED transition"
        actor: system
        preconditions:
          - "the selector returns 0 eligible candidates after exclusions"
        side_effects:
          - "primary_vendor_id = null; backup_vendor_id = null; state = UNROUTABLE"
          - "selection_reason_code = NO_CANDIDATE; resteer_count += 1; projected_egress_cost_usd = 0.00"
      - from: STANDBY_ONLY
        to: UNROUTABLE
        trigger: "system auto-resteer from a CdnVendor DEGRADED or DRAINED transition"
        actor: system
        preconditions:
          - "the selector returns 0 eligible candidates after exclusions"
        side_effects:
          - "primary_vendor_id = null; backup_vendor_id = null; state = UNROUTABLE; selection_reason_code = NO_CANDIDATE; resteer_count += 1"
      - from: UNROUTABLE
        to: ACTIVE
        trigger: "POST /routing-policies/{id}/resteer"
        actor: DeliveryEngineer
        preconditions:
          - "the selector returns >= 2 eligible candidates after exclusions (e.g. a DEGRADED vendor recovered to ACTIVE and was never excluded)"
        side_effects:
          - "primary_vendor_id and backup_vendor_id rewritten; state = ACTIVE; resteer_count += 1"
        note: "Cycle ACTIVE -> UNROUTABLE -> ACTIVE."
      - from: STANDBY_ONLY
        to: STANDBY_ONLY
        trigger: "POST /routing-policies/{id}/resteer"
        actor: DeliveryEngineer
        preconditions:
          - "the selector returns exactly 1 eligible candidate after excluding the outgoing primary"
        side_effects:
          - "excluded_vendor_ids gains the outgoing primary_vendor_id; primary_vendor_id = the single candidate; backup_vendor_id stays null"
          - "resteer_count += 1; projected_egress_cost_usd recomputed"
        note: "Self-transition so a manual resteer is always well-defined from STANDBY_ONLY."
      - from: UNROUTABLE
        to: STANDBY_ONLY
        trigger: "POST /routing-policies/{id}/resteer"
        actor: DeliveryEngineer
        preconditions:
          - "the selector returns exactly 1 eligible candidate after exclusions"
        side_effects:
          - "primary_vendor_id = the single candidate; backup_vendor_id = null; state = STANDBY_ONLY; selection_reason_code updated"
          - "resteer_count += 1; projected_egress_cost_usd recomputed"
      - from: UNROUTABLE
        to: UNROUTABLE
        trigger: "POST /routing-policies/{id}/resteer"
        actor: DeliveryEngineer
        preconditions:
          - "the selector returns 0 eligible candidates after exclusions"
        side_effects:
          - "primary_vendor_id stays null; backup_vendor_id stays null; selection_reason_code stays NO_CANDIDATE; excluded_vendor_ids unchanged (there is no outgoing primary to exclude)"
          - "resteer_count += 1; projected_egress_cost_usd stays 0.00"
        note: "Self-transition; a manual resteer on an unroutable policy returns 200 and records the attempt rather than erroring."

  - entity: LiveEventReservation
    initial_state: RESERVED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ARMED
        trigger: "POST /live-reservations/{id}/arm"
        actor: DeliveryEngineer
        preconditions:
          - "LiveEventReservation.state == RESERVED"
          - "at least one DrmPackage of the Title has state == PACKAGED"
          - "at least one RoutingPolicy of the Title has state in {ACTIVE, STANDBY_ONLY}"
          - "logical clock now < window_end_at"
        side_effects:
          - "LiveEventReservation.state = ARMED"
          - "increments LiveEventReservation.version by 1"
        note: "Cross-entity gate on DrmPackage (different entity pair from the ladder-lock gate on MezzanineAsset)."
      - from: ARMED
        to: LIVE
        trigger: "POST /availability-sweep (system, Phase 2)"
        actor: system
        preconditions:
          - "LiveEventReservation.state == ARMED"
          - "logical clock now >= window_start_at"
          - "logical clock now < window_end_at"
        side_effects:
          - "LiveEventReservation.state = LIVE"
      - from: ARMED
        to: FAILED_OVER
        trigger: "POST /live-reservations/{id}/failover"
        actor: DeliveryEngineer
        preconditions:
          - "LiveEventReservation.state in {ARMED, LIVE}"
          - "failover_vendor_id is not null and that vendor state != DRAINED"
          - "the failover vendor has capacity for reserved_gbps per calculations.vendor_capacity_availability, excluding this reservation itself"
        side_effects:
          - "active_vendor_id = failover_vendor_id; failover_at = logical clock now; state = FAILED_OVER"
          - "primary vendor reserved_gbps -= reserved_gbps; failover vendor reserved_gbps += reserved_gbps, so sum(CdnVendor.reserved_gbps) over all vendors is unchanged"
      - from: LIVE
        to: FAILED_OVER
        trigger: "POST /live-reservations/{id}/failover"
        actor: DeliveryEngineer
        preconditions:
          - "LiveEventReservation.state == LIVE"
          - "failover_vendor_id is not null and that vendor state != DRAINED"
          - "the failover vendor has capacity for reserved_gbps"
        side_effects:
          - "active_vendor_id = failover_vendor_id; failover_at = now; state = FAILED_OVER"
          - "capacity moves from the primary to the failover vendor with sum(CdnVendor.reserved_gbps) unchanged"
      - from: LIVE
        to: ENDED
        trigger: "POST /availability-sweep (system, Phase 2)"
        actor: system
        preconditions:
          - "logical clock now >= window_end_at"
        side_effects:
          - "state = ENDED; released_gbps = reserved_gbps"
          - "active vendor reserved_gbps -= reserved_gbps"
      - from: FAILED_OVER
        to: ENDED
        trigger: "POST /availability-sweep (system, Phase 2)"
        actor: system
        preconditions:
          - "logical clock now >= window_end_at"
        side_effects:
          - "state = ENDED; released_gbps = reserved_gbps"
          - "failover (active) vendor reserved_gbps -= reserved_gbps"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /live-reservations/{id}/cancel"
        actor: DeliveryEngineer
        preconditions:
          - "LiveEventReservation.state == RESERVED"
        side_effects:
          - "state = CANCELLED; released_gbps = reserved_gbps"
          - "active vendor reserved_gbps -= reserved_gbps, restoring the pre-reservation value exactly"
      - from: ARMED
        to: CANCELLED
        trigger: "POST /live-reservations/{id}/cancel"
        actor: DeliveryEngineer
        preconditions:
          - "LiveEventReservation.state == ARMED"
        side_effects:
          - "state = CANCELLED; released_gbps = reserved_gbps; active vendor reserved_gbps -= reserved_gbps"

  - entity: AvailabilityWindow
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /availability-sweep (system, Phase 1)"
        actor: system
        preconditions:
          - "AvailabilityWindow.state == SCHEDULED"
          - "logical clock now >= window_start_at (inclusive lower bound)"
          - "logical clock now < window_end_at (exclusive upper bound)"
        side_effects:
          - "state = ACTIVE; activated_at = logical clock now"
      - from: SCHEDULED
        to: CLOSED
        trigger: "POST /availability-sweep (system, Phase 1)"
        actor: system
        preconditions:
          - "logical clock now >= window_end_at"
        side_effects:
          - "state = CLOSED; closed_at = logical clock now"
        note: "A window entirely in the past when first swept never becomes ACTIVE."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /availability-sweep (system, Phase 1)"
        actor: system
        preconditions:
          - "logical clock now >= window_end_at"
        side_effects:
          - "state = CLOSED; closed_at = logical clock now"
          - "may leave the Title with no ACTIVE window, which Phase 4 turns into TAKEN_DOWN with takedown_reason = CONTRACT_END"
      - from: ACTIVE
        to: CLOSED
        trigger: "system cascade: Title.availability_state became TAKEN_DOWN"
        actor: system
        preconditions:
          - "AvailabilityWindow.state == ACTIVE"
        side_effects:
          - "state = CLOSED; closed_at = logical clock now"
        note: "Hop 5 of the ladder-lock cascade and of the manual takedown."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /availability-windows/{id}/cancel"
        actor: ContentOps
        preconditions:
          - "AvailabilityWindow.state == SCHEDULED"
        side_effects:
          - "state = CANCELLED; the interval is released for a future overlapping window"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /availability-windows/{id}/cancel"
        actor: ContentOps
        preconditions:
          - "AvailabilityWindow.state == ACTIVE"
        side_effects:
          - "state = CANCELLED"
          - "if this was the Title's last ACTIVE window and Title.availability_state == PUBLISHED, Title.availability_state = TAKEN_DOWN with takedown_reason = CONTRACT_END"

  - entity: ReprocessJob
    initial_state: QUEUED
    terminal_states: [COMPLETED, FAILED, ABORTED]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "POST /reprocess-jobs/{id}/run"
        actor: EncodingEngineer
        preconditions:
          - "ReprocessJob.state == QUEUED"
          - "no other ReprocessJob of the same title_id has state == RUNNING"
          - "the source EncodingLadder still has state == LOCKED"
          - "cost_estimate_usd <= Title.encode_budget_remaining_usd (equality allowed)"
        side_effects:
          - "state = RUNNING; committed_usd = cost_estimate_usd"
          - "Title.encode_budget_remaining_usd -= cost_estimate_usd; Title.version += 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /availability-sweep (system, Phase 3)"
        actor: system
        preconditions:
          - "ReprocessJob.state == RUNNING"
          - "the source EncodingLadder still has state == LOCKED"
        side_effects:
          - "hop 1: a new EncodingLadder is created with title_id = this Title, codec_family = target_codec_family, rungs copied from the source ladder, derived_from_ladder_id = source_ladder_id, state = LOCKED, validation_reason_code = OK"
          - "hop 2: because the result ladder locked, the source EncodingLadder transitions LOCKED -> SUPERSEDED with superseded_by_ladder_id = result ladder id"
          - "hop 3: because the source ladder became SUPERSEDED, every DrmPackage bound to it with state == PACKAGED transitions to STALE (stale_reason = LADDER_SUPERSEDED)"
          - "hop 4: because a DrmPackage went STALE, Title.packaging_state -> STALE and readiness_score_certified is recomputed"
          - "job.state = COMPLETED; result_ladder_id = the new ladder id; committed_usd unchanged (budget stays spent)"
        note: "Phase 3 runs BEFORE Phase 4, so the same sweep sees packaging_state == STALE and takes the Title down instead of publishing it."
      - from: RUNNING
        to: FAILED
        trigger: "POST /availability-sweep (system, Phase 3)"
        actor: system
        preconditions:
          - "ReprocessJob.state == RUNNING"
          - "the source EncodingLadder state != LOCKED (it was superseded while the job was running)"
        side_effects:
          - "state = FAILED; abort_reason = ENCODE_FAILURE; committed_usd = 0.00"
          - "Title.encode_budget_remaining_usd += cost_estimate_usd, restoring the conserved budget identity"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /reprocess-jobs/{id}/abort"
        actor: EncodingEngineer
        preconditions:
          - "ReprocessJob.state == RUNNING"
        side_effects:
          - "state = ABORTED; abort_reason = OPERATOR_ABORT; committed_usd = 0.00"
          - "Title.encode_budget_remaining_usd += cost_estimate_usd; Title.version += 1"
        note: "Compensating action for the QUEUED -> RUNNING debit; conserved quantity B returns to its pre-run value."
      - from: QUEUED
        to: ABORTED
        trigger: "POST /reprocess-jobs/{id}/abort"
        actor: EncodingEngineer
        preconditions:
          - "ReprocessJob.state == QUEUED"
        side_effects:
          - "state = ABORTED; abort_reason = OPERATOR_ABORT; committed_usd stays 0.00"
          - "Title.encode_budget_remaining_usd unchanged (nothing was ever debited)"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent Title.version only
# =============================================================================
concurrency_rules:
  - rule_id: ladder-create-stale-title
    parent_entity: Title
    write_endpoint: "POST /encoding-ladders"
    occ_field: "expected_title_version"
    description: |
      Creating an EncodingLadder against a Title whose version has advanced since the client last
      read it is rejected with a stale-version error. This is the create-with-supersede case: a
      newly locked ladder legitimately supersedes the prior ladder of the same codec_family and
      cascades staleness into DRM packaging, so a writer holding an outdated view of the Title
      would otherwise author a ladder against a catalog shape that no longer exists.
    error_id: ERR_STALE_TITLE_VERSION
    http_status: 412
  - rule_id: reprocess-create-stale-title
    parent_entity: Title
    write_endpoint: "POST /reprocess-jobs"
    occ_field: "expected_title_version"
    description: |
      Creating a ReprocessJob against a Title whose version has advanced since the client last read
      it is rejected. A reprocess job pins a cost_estimate_usd computed from the Title's current
      asset durations and the source ladder's rungs, and its run debits the Title's encode budget;
      a stale view of the Title would pin an estimate against superseded inputs.
    error_id: ERR_STALE_TITLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is USD with 2 decimal places, ROUND_HALF_UP unless stated otherwise.
# No calculation, selector, ranking, tie-break or ordering rule anywhere in this
# scaffold uses `id`; every precise fallback is `created_at ASC`.
# =============================================================================
calculations:

  - name: mezzanine_qc_verdict
    trigger: "POST /mezzanine-assets/{id}/qc-runs, before the MezzanineAsset transition is chosen"
    algorithm: weighted_scoring
    formula: |
      loudness_deviation_db = round(abs(asset.peak_audio_lufs - LOUDNESS_TARGET_LUFS), 2)
      caption_coverage_pct  = 100.00 if asset.audio_language in asset.caption_languages else 0.00
      artifact_penalty      = round(asset.artifact_defect_count * W_ARTIFACT, 2)
      loudness_penalty      = round(max(0.0, loudness_deviation_db - LOUDNESS_TOLERANCE_DB) * W_LOUDNESS, 2)
      caption_penalty       = 0.00 if caption_coverage_pct == 100.00 else W_CAPTION
      severity_index        = round(artifact_penalty + loudness_penalty + caption_penalty, 2)

      # blocking conditions, evaluated as a set (order-independent):
      blocking = []
      if asset.artifact_defect_count >= ARTIFACT_FAIL_THRESHOLD: blocking += [ARTIFACT_BURST]
      if loudness_deviation_db > LOUDNESS_FAIL_DB:               blocking += [LOUDNESS_OUT_OF_SPEC]
      if caption_coverage_pct == 0.00:                           blocking += [CAPTION_MISSING]
      if len(blocking) >= 2:      blocking_defect_code = MULTI_DEFECT
      elif len(blocking) == 1:    blocking_defect_code = blocking[0]
      elif severity_index >= SEVERITY_FAIL_THRESHOLD:
                                  blocking_defect_code = MULTI_DEFECT   # aggregate-severity breach
      else:                       blocking_defect_code = NONE

      verdict = FAIL if blocking_defect_code != NONE else
                WARN if (severity_index > 0.00 or asset.artifact_defect_count >= ARTIFACT_WARN_THRESHOLD) else
                PASS
    input_set: "The single MezzanineAsset named in the path, using its CURRENT field values (a resubmit replaces them before the next run). No other asset participates."
    constants:
      LOUDNESS_TARGET_LUFS: -24.0
      LOUDNESS_TOLERANCE_DB: 2.0
      LOUDNESS_FAIL_DB: 6.0
      ARTIFACT_WARN_THRESHOLD: 3
      ARTIFACT_FAIL_THRESHOLD: 8
      W_ARTIFACT: 4.0
      W_LOUDNESS: 6.0
      W_CAPTION: 30.0
      SEVERITY_FAIL_THRESHOLD: 40.0
    precision: "severity_index and every penalty component: 2 decimal places, round_half_up"
    variants: []
    note: |
      SEVERITY_FAIL_THRESHOLD is inclusive: severity_index == 40.00 is a FAIL (recorded as
      MULTI_DEFECT), 39.99 is a WARN. LOUDNESS_FAIL_DB is exclusive: deviation 6.0 is not blocking,
      6.01 is. Both PASS and WARN drive the asset to QC_PASSED; only FAIL branches away.

  - name: title_readiness_score
    trigger: "Recomputed on the Title after any mutation of its MezzanineAssets, EncodingLadders or DrmPackages; read from Title.readiness_score_provisional and Title.readiness_score_certified"
    algorithm: weighted_scoring
    formula: |
      asset_count = count(MezzanineAsset where title_id == title.id)     # every asset, no state filter

      # PROVISIONAL variant (optimistic inclusion sets)
      prov_asset   = 0.00 if asset_count == 0 else
                     round(100.0 * count(assets with qc_state in {INGESTED, QC_PASSED}) / asset_count, 2)
      prov_ladder  = 100.00 if exists EncodingLadder(title) with state in {DRAFT, VALIDATED, LOCKED} else 0.00
      prov_package = 100.00 if exists DrmPackage(title)    with state in {PENDING, PACKAGED}        else 0.00
      readiness_score_provisional = round(W_ASSET*prov_asset + W_LADDER*prov_ladder + W_PACKAGE*prov_package, 2)

      # CERTIFIED variant (evidence-only inclusion sets)
      cert_asset   = 0.00 if asset_count == 0 else
                     round(100.0 * count(assets with qc_state == QC_PASSED) / asset_count, 2)
      cert_ladder  = 100.00 if exists EncodingLadder(title) with state == LOCKED   else 0.00
      cert_package = 100.00 if exists DrmPackage(title)    with state == PACKAGED  else 0.00
      readiness_score_certified = round(W_ASSET*cert_asset + W_LADDER*cert_ladder + W_PACKAGE*cert_package, 2)
    input_set: "All MezzanineAssets, EncodingLadders and DrmPackages whose title_id == this Title. QC_REJECTED assets stay in the denominator of both variants and leave both numerators; REVOKED packages count for neither variant."
    constants:
      W_ASSET: 0.50
      W_LADDER: 0.20
      W_PACKAGE: 0.30
      PUBLISH_GATE_CERTIFIED: 80.00
    precision: "2 decimal places, round_half_up; component percentages rounded before weighting"
    variants:
      - name: provisional
        when: "Always maintained on Title.readiness_score_provisional; the operator-facing pipeline view"
        difference: "Counts INGESTED assets as if they will pass, DRAFT/VALIDATED ladders as if they will lock, and PENDING packages as if they will package."
      - name: certified
        when: "Always maintained on Title.readiness_score_certified; the ONLY variant the availability sweep consults, gated at >= 80.00 (inclusive)"
        difference: "Counts only QC_PASSED assets, LOCKED ladders and PACKAGED packages, so it is always <= the provisional score for the same data."
    note: |
      Dual-variant instance 1 (entity domain: Title publication readiness). Five assets of which three
      are QC_PASSED and two INGESTED, plus a LOCKED ladder and a PACKAGED package, yields
      provisional 100.00 and certified 80.00 from identical stored data.

  - name: device_compat_score
    trigger: "POST /encoding-ladders/{id}/validate; written to EncodingLadder.device_compat_score and compatible_device_count"
    algorithm: aggregation
    formula: |
      candidates = DeviceProfile where state == ACTIVE          # RETIRED profiles never participate

      compatible(p) =
            ladder.codec_family in p.supported_codecs
        AND exists rung in ladder.rungs with
                  rung.height_px    <= p.max_height_px
              AND rung.bitrate_kbps >= p.min_bitrate_kbps
              AND rung.bitrate_kbps <= p.max_bitrate_kbps
        AND ( p.required_drm_system == NONE
              OR exists DrmPackage d where d.title_id == ladder.title_id
                                     AND d.state in {PENDING, PACKAGED}
                                     AND p.required_drm_system in d.drm_systems )

      compatible_device_count = count(p in candidates where compatible(p))
      coverage_multiplier     = min(1.00, ladder.rung_count / MIN_RUNG_TARGET)
      base                    = round(sum(p.market_share_pct for compatible p) * coverage_multiplier, 2)
      bonus                   = BONUS_4K_PCT if (ladder.peak_height_px >= 2160 and compatible_device_count >= 1) else 0.00
      device_compat_score     = round(min(SCORE_CAP, base + bonus), 2)
    input_set: "All DeviceProfiles with state == ACTIVE, plus every DrmPackage of the ladder's Title in state PENDING or PACKAGED (REVOKED and STALE packages do not satisfy a device's required_drm_system)."
    constants:
      MIN_RUNG_TARGET: 5
      BONUS_4K_PCT: 5.00
      SCORE_CAP: 100.00
    precision: "2 decimal places, round_half_up; the multiplier is applied to the summed share BEFORE rounding, then the bonus is added and the cap applied"
    variants: []
    note: |
      Combinatorial mode (a): four interacting inputs (codec set membership, a rung-window existential
      over two bitrate bounds and a height bound, a cross-aggregate DRM condition, and a rung-count
      coverage multiplier) with nested min/max and a conditional 4K bonus. An empty ACTIVE candidate
      set yields 0.00 and drives the validate REJECTED branch with NO_COMPATIBLE_DEVICE.

  - name: reprocess_cost_estimate
    trigger: "POST /reprocess-jobs; frozen onto ReprocessJob.cost_estimate_usd, per_rung_cost_usd and priority_rank at creation and never recomputed"
    algorithm: tiered_pricing
    formula: |
      eligible_assets  = MezzanineAsset(title) where qc_state != QC_REJECTED
      duration_minutes = ceil( max(a.duration_seconds for a in eligible_assets) / 60 )   # integer minutes
      codec_factor     = CODEC_FACTOR[job.target_codec_family]

      # ROUNDING ORDER IS PINNED: round EACH rung to cents first, THEN sum the rounded values.
      for i, rung in enumerate(source_ladder.rungs):            # source ladder rung order, unsorted
          per_rung_cost_usd[i] = round(duration_minutes * (rung.bitrate_kbps / 1000.0)
                                       * codec_factor * RATE_USD_PER_MIN_PER_MBPS, 2)
      cost_estimate_usd = round(sum(per_rung_cost_usd), 2)

      priority_rank = round(PRIORITY_WEIGHT[job.trigger_reason]
                            + min(PRIORITY_COST_CAP, cost_estimate_usd / 10.0), 2)
    input_set: "The source EncodingLadder's rungs in stored array order, and the maximum duration_seconds over the Title's MezzanineAssets whose qc_state != QC_REJECTED. A Title with zero such assets cannot create a job (ERR_REPROCESS_NO_SOURCE_ASSET)."
    constants:
      RATE_USD_PER_MIN_PER_MBPS: 0.02
      CODEC_FACTOR: { H264: 1.00, HEVC: 1.35, AV1: 2.10 }
      PRIORITY_WEIGHT: { CODEC_DEPRECATION: 40.0, STANDARD_UPDATE: 30.0, QUALITY_REGRESSION: 20.0, DEVICE_MATRIX_CHANGE: 10.0 }
      PRIORITY_COST_CAP: 20.0
    precision: "per-rung: 2 decimals round_half_up; total: sum of the ALREADY-ROUNDED per-rung values, re-rounded to 2 decimals"
    variants: []
    note: |
      Combinatorial mode (b): nested rounding where order changes the answer. duration_minutes = 100,
      target HEVC, source rungs [1150, 2350, 4850, 9650] kbps give per-rung [3.11, 6.35, 13.10, 26.06]
      and cost_estimate_usd = 48.62. Summing the unrounded products first would give 48.60. This
      scaffold pins round-per-rung-then-sum; 48.60 is the wrong answer.
      Ties in priority_rank are broken by created_at ASC (never by id).

  - name: egress_cost_projection
    trigger: "POST /routing-policies and POST /routing-policies/{id}/resteer and every system auto-resteer; written to RoutingPolicy.projected_egress_cost_usd"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — demand
      attempts = sum(m.play_attempts for m in PlaybackMetricWindow
                     where m.title_id == policy.title_id and m.region_code == policy.region_code)
      projected_monthly_gb = round(attempts * AVG_GB_PER_PLAY, 2) if attempts > 0 else PROJECTED_GB_DEFAULT

      # STEP 2 — base cost from the CURRENT primary vendor
      if policy.primary_vendor_id is null:
          projected_egress_cost_usd = 0.00 ; stop
      base_cost = round(projected_monthly_gb * primary_vendor.cost_per_gb_usd, 2)

      # STEP 3 — the surcharge tier is keyed on base_cost, NOT on the final total (PINNED ORDER)
      surcharge_pct = SURCHARGE_LOW  if base_cost <  TIER_LOW_MAX  else
                      SURCHARGE_MID  if base_cost <  TIER_MID_MAX  else
                      SURCHARGE_HIGH
      if policy.steering_mode == WEIGHTED: surcharge_pct = surcharge_pct + WEIGHTED_MODE_ADDON

      # STEP 4/5
      steering_surcharge        = round(base_cost * surcharge_pct, 2)
      projected_egress_cost_usd = round(base_cost + steering_surcharge, 2)
    input_set: "Every PlaybackMetricWindow (immutable events, no state filter) matching the policy's title_id AND region_code, plus the CdnVendor currently referenced by primary_vendor_id."
    constants:
      AVG_GB_PER_PLAY: 2.5
      PROJECTED_GB_DEFAULT: 1000.00
      TIER_LOW_MAX: 500.00
      TIER_MID_MAX: 2000.00
      SURCHARGE_LOW: 0.08
      SURCHARGE_MID: 0.05
      SURCHARGE_HIGH: 0.03
      WEIGHTED_MODE_ADDON: 0.02
    precision: "2 decimal places, round_half_up at every marked step; the tier comparison uses the rounded base_cost"
    variants: []
    note: |
      Combinatorial mode (c): a circular-looking dependency pinned to one evaluation order. The total
      depends on the surcharge and the surcharge rate depends on a tier — but the tier reads base_cost,
      never the total. base_cost 480.00 with PERFORMANCE steering gives surcharge 38.40 and total
      518.40; keying the tier on the total (518.40 >= 500.00 -> 0.05) would give 504.00, which is the
      wrong answer. TIER_LOW_MAX is exclusive on the low side: base_cost 500.00 uses SURCHARGE_MID.

  - name: playback_quality_index
    trigger: "POST /playback-metrics, before any vendor health recompute or state transition"
    algorithm: weighted_scoring
    formula: |
      rebuffer_ratio = round(m.rebuffer_events / m.play_attempts, 4)
      error_rate     = round(m.error_count    / m.play_attempts, 4)
      penalty_raw    = round(rebuffer_ratio * 100 * W_REBUFFER
                             + max(0, m.startup_ms_p95 - STARTUP_TARGET_MS) / 100.0 * W_STARTUP
                             + error_rate * 100 * W_ERROR, 4)
      penalty        = round(penalty_raw * device_profile.quality_normalization_factor, 4)
      quality_index  = round(max(0.00, min(100.00, 100.00 - penalty)), 2)
      breach_flag    = quality_index < BREACH_THRESHOLD
    input_set: "The single PlaybackMetricWindow being ingested plus the DeviceProfile referenced by device_profile_id (its quality_normalization_factor is read even when the profile state is RETIRED, because the metric is historical)."
    constants:
      W_REBUFFER: 2.5
      W_STARTUP: 1.5
      W_ERROR: 4.0
      STARTUP_TARGET_MS: 2000
      BREACH_THRESHOLD: 70.00
    precision: "ratios 4 decimals round_half_up; penalties 4 decimals; quality_index 2 decimals round_half_up"
    variants: []
    note: |
      BREACH_THRESHOLD is strict: quality_index == 70.00 is NOT a breach, 69.99 is. Startup latency
      below STARTUP_TARGET_MS contributes exactly 0 (the max(0, ...) clamp), so a 1200 ms window is
      not rewarded relative to a 2000 ms one.

  - name: vendor_health_score
    trigger: "POST /playback-metrics, after playback_quality_index for the ingested window; both variants are rewritten on CdnVendor.health_score_rolling and CdnVendor.health_score_contract"
    algorithm: aggregation
    formula: |
      rows = PlaybackMetricWindow where vendor_id == vendor.id          # immutable events

      # ROLLING variant: newest ROLLING_WINDOW_COUNT rows, unweighted arithmetic mean
      ordered = sort(rows, key = (window_start_at DESC, created_at DESC))
      recent  = ordered[0 : ROLLING_WINDOW_COUNT]
      health_score_rolling  = HEALTH_DEFAULT if len(rows) == 0 else
                              round(sum(r.quality_index for r in recent) / len(recent), 2)

      # CONTRACT variant: every row, weighted by play_attempts
      health_score_contract = HEALTH_DEFAULT if len(rows) == 0 else
                              round(sum(r.quality_index * r.play_attempts for r in rows)
                                    / sum(r.play_attempts for r in rows), 2)

      breach_window_count = count(r in rows where r.breach_flag == true)
    input_set: "Every PlaybackMetricWindow with vendor_id == this vendor, across all titles, regions and devices. Sort key is window_start_at DESC with created_at DESC as the only tie-break; ids are never consulted."
    constants:
      ROLLING_WINDOW_COUNT: 3
      HEALTH_DEFAULT: 100.00
      DEGRADE_THRESHOLD: 50.00
      RECOVER_THRESHOLD: 75.00
      DRAIN_BREACH_COUNT: 5
      ROUTING_ELIGIBILITY_MIN: 60.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: rolling_window
        when: "The ONLY variant consulted by the CdnVendor state machine: < 50.00 degrades, >= 75.00 recovers"
        difference: "Unweighted mean of the newest 3 windows; a single catastrophic recent window can degrade a vendor with an excellent long-run record."
      - name: contract_period
        when: "The ONLY variant consulted by calculations.routing_vendor_selection for eligibility (>= 60.00) and PERFORMANCE/WEIGHTED ranking"
        difference: "play_attempts-weighted mean over ALL windows ever ingested for the vendor; a low-traffic bad window barely moves it."
    note: |
      Dual-variant instance 2 (entity domain: CdnVendor delivery performance — a different subject from
      the Title readiness dual variant). Four windows with quality_index 93.10/33.50/81.50/90.40 and
      play_attempts 1000/1000/1000/500 give health_score_rolling 68.47 and health_score_contract 72.37
      from the same rows.

  - name: vendor_capacity_availability
    trigger: "POST /live-reservations (against primary_vendor_id) and POST /live-reservations/{id}/failover (against failover_vendor_id)"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals, symmetrically inflated by each side's own buffer_minutes.
      req_lo = request.window_start_at - request.buffer_minutes
      req_hi = request.window_end_at   + request.buffer_minutes

      occupied = [ R for R in LiveEventReservation
                   where R.active_vendor_id == vendor.id
                     and R.state in {RESERVED, ARMED, LIVE, FAILED_OVER}
                     and R.id != request.reservation_id            # a failover never collides with itself
                     and (R.window_start_at - R.buffer_minutes) <= req_hi
                     and (R.window_end_at   + R.buffer_minutes) >= req_lo ]   # closed: touching == colliding

      held_gbps = round(sum(R.reserved_gbps for R in occupied), 2)
      capacity_ok = (held_gbps + request.reserved_gbps) <= vendor.committed_gbps     # equality ALLOWED
    input_set: "LiveEventReservations charged to this vendor (active_vendor_id) in state RESERVED, ARMED, LIVE or FAILED_OVER. ENDED and CANCELLED reservations hold nothing."
    constants:
      DEFAULT_BUFFER_MINUTES: 15
    precision: "gbps sums to 2 decimal places, round_half_up"
    variants: []
    note: |
      Interval semantics A: CLOSED intervals inflated by a per-reservation buffer, aggregated against a
      shared capacity ceiling. Touching inflated endpoints DO collide, and colliding is not itself an
      error — only exceeding committed_gbps is. Contrast calculations.availability_window_overlap.

  - name: availability_window_overlap
    trigger: "POST /titles/{id}/availability-windows"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [start, end), no buffer, strict mutual exclusion per (title, region).
      conflicts = [ W for W in AvailabilityWindow
                    where W.title_id == title.id
                      and W.region_code == request.region_code
                      and W.state in {SCHEDULED, ACTIVE}
                      and W.window_start_at <  request.window_end_at
                      and request.window_start_at <  W.window_end_at ]
      if len(conflicts) > 0: reject with ERR_WINDOW_OVERLAP

      # Coverage used by the sweep and by region-coverage validation:
      covered_regions = distinct region_code over AvailabilityWindow(title) with state in {SCHEDULED, ACTIVE}
    input_set: "AvailabilityWindows of the same Title AND the same region_code whose state is SCHEDULED or ACTIVE. CLOSED and CANCELLED windows free their interval for reuse."
    constants: {}
    precision: "instant comparisons at millisecond resolution on ISO-8601 UTC values"
    variants: []
    note: |
      Interval semantics B: HALF-OPEN and buffer-free, so abutting windows ([Sep 1, Oct 1) followed by
      [Oct 1, Nov 1)) are legal, and a single millisecond of overlap is rejected outright rather than
      aggregated. This is a different geometry from vendor_capacity_availability on a different
      resource entity.

  - name: routing_vendor_selection
    trigger: "POST /routing-policies, POST /routing-policies/{id}/resteer, and system auto-resteer when a CdnVendor becomes DEGRADED or DRAINED"
    algorithm: waterfall_allocation
    formula: |
      # (a) eligibility filter — explicit predicate, no adjectives
      candidates = [ v for v in CdnVendor
                     where v.state == ACTIVE
                       and policy.region_code in v.regions
                       and v.health_score_contract >= ROUTING_ELIGIBILITY_MIN
                       and v.id not in policy.excluded_vendor_ids ]

      # (b) ranking expression, by steering_mode
      PERFORMANCE: sort by (health_score_contract DESC, cost_per_gb_usd ASC, created_at ASC)
      COST:        sort by (cost_per_gb_usd ASC, health_score_contract DESC, created_at ASC)
      WEIGHTED:    composite = round(health_score_contract - cost_per_gb_usd * COST_WEIGHT_PER_GB, 4)
                   sort by (composite DESC, created_at ASC)

      # (c) tie-break: created_at ASC is the final, exhaustive tie-break in all three modes (never id)
      primary_vendor_id = candidates[0].id
      backup_vendor_id  = candidates[1].id if len(candidates) >= 2 else null
      state             = ACTIVE if len(candidates) >= 2 else STANDBY_ONLY
      selection_reason_code = PERFORMANCE_RANK | COST_RANK | WEIGHTED_RANK per steering_mode

      # (d) empty-pool fallback
      if len(candidates) == 0:
          on POST /routing-policies                -> reject with ERR_NO_ELIGIBLE_VENDOR (422), nothing persisted
          on resteer or system auto-resteer        -> state = UNROUTABLE, primary_vendor_id = null,
                                                     backup_vendor_id = null,
                                                     selection_reason_code = NO_CANDIDATE,
                                                     projected_egress_cost_usd = 0.00
    input_set: "All CdnVendors with state == ACTIVE serving the policy's region_code with health_score_contract >= 60.00, minus the policy's excluded_vendor_ids. DEGRADED and DRAINED vendors are never candidates."
    constants:
      ROUTING_ELIGIBILITY_MIN: 60.00
      COST_WEIGHT_PER_GB: 1000.0
    precision: "composite score 4 decimal places, round_half_up"
    variants: []
    note: |
      Explicit resteer exclusion semantics: every resteer (manual or cascaded) appends the OUTGOING
      primary to excluded_vendor_ids, so repeated resteers monotonically shrink the pool and converge
      on UNROUTABLE. Exclusions are never cleared automatically.

  - name: entitlement_decision
    trigger: "POST /playback-entitlement-checks"
    algorithm: waterfall_allocation
    formula: |
      # (a) package selection: the PACKAGED DrmPackage of the Title, earliest created_at first
      packages = [ d for d in DrmPackage where d.title_id == request.title_id and d.state == PACKAGED ]
      if len(packages) == 0: reject with ERR_NO_PACKAGED_DRM (409)
      package = sort(packages, key = created_at ASC)[0]

      # (b) rule eligibility filter
      device = DeviceProfile where device_class == request.device_class and state == ACTIVE
      matches = [ r for r in EntitlementRule where r.package_id == package.id
                    and (r.region_code == request.region_code or r.region_code == "*")
                    and (r.subscription_tier == request.subscription_tier or r.subscription_tier == ANY)
                    and ( r.device_class_scope == ALL
                          or (r.device_class_scope == TV_ONLY     and request.device_class in TV_CLASSES)
                          or (r.device_class_scope == MOBILE_ONLY and request.device_class in MOBILE_CLASSES) )
                    and ( device.hdcp_required == false or r.hdcp_level in {TYPE_0, TYPE_1} ) ]

      # (c) ranking + tie-break
      region_specificity(r) = 1 if r.region_code == request.region_code else 0
      matched = sort(matches, key = (priority DESC, region_specificity DESC, created_at ASC))[0]

      # (d) empty-pool fallback
      if len(matches) == 0: reject with ERR_ENTITLEMENT_NO_RULE (403)

      # (e) post-match gates
      if request.requested_streams > matched.max_concurrent_streams: reject with ERR_CONCURRENCY_LIMIT_EXCEEDED (403)
      if request.offline_requested and (matched.offline_playback_allowed == false
                                        or package.persistent_license_allowed == false):
                                                                     reject with ERR_OFFLINE_PLAYBACK_DENIED (403)

      effective_height_px = min(matched.max_playback_height_px,
                                device.max_height_px,
                                bound_ladder.peak_height_px)
      decision = ALLOW ; reason_code = MATCHED
    input_set: "EntitlementRules of the selected PACKAGED DrmPackage only. Rules on PENDING, STALE or REVOKED packages never participate. TV_CLASSES = {SMART_TV_4K, SMART_TV_HD, SET_TOP_LEGACY}; MOBILE_CLASSES = {MOBILE_HIGH, MOBILE_LOW}."
    constants:
      TV_CLASSES: [SMART_TV_4K, SMART_TV_HD, SET_TOP_LEGACY]
      MOBILE_CLASSES: [MOBILE_HIGH, MOBILE_LOW]
    precision: "integer stream counts and heights; no rounding"
    variants: []
    note: |
      requested_streams == max_concurrent_streams is ALLOWED (strict > rejects). A wildcard rule with
      priority 90 beats an exact-region rule with priority 50: priority dominates specificity, and
      specificity only breaks priority ties.

  - name: vendor_reserved_ledger
    trigger: "Recomputed on every LiveEventReservation create, failover, cancel and sweep-end; written to CdnVendor.reserved_gbps"
    algorithm: aggregation
    formula: |
      CdnVendor.reserved_gbps = round(sum(R.reserved_gbps for R in LiveEventReservation
                                          where R.active_vendor_id == vendor.id
                                            and R.state in {RESERVED, ARMED, LIVE, FAILED_OVER}), 2)

      # CONSERVED QUANTITY A (bandwidth), invariant over failover:
      GLOBAL_HELD_GBPS = round(sum(v.reserved_gbps for v in CdnVendor), 2)
                       == round(sum(R.reserved_gbps for R in LiveEventReservation
                                    where R.state in {RESERVED, ARMED, LIVE, FAILED_OVER}), 2)
    input_set: "Reservations charged to the vendor via active_vendor_id in state RESERVED, ARMED, LIVE or FAILED_OVER."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []
    note: |
      A failover is the compensating action for the primary-side hold: it debits the primary and credits
      the failover vendor by the identical reserved_gbps, so GLOBAL_HELD_GBPS is byte-for-byte unchanged
      while the per-vendor split moves. Cancel and sweep-end instead reduce GLOBAL_HELD_GBPS by exactly
      released_gbps.

  - name: encode_budget_ledger
    trigger: "Recomputed on every ReprocessJob run, abort, sweep-completion and sweep-failure; written to Title.encode_budget_remaining_usd"
    algorithm: aggregation
    formula: |
      Title.encode_budget_remaining_usd =
          round(title.encode_budget_usd
                - sum(J.cost_estimate_usd for J in ReprocessJob
                      where J.title_id == title.id and J.state in {RUNNING, COMPLETED}), 2)

      # CONSERVED QUANTITY B (money), invariant over abort/fail:
      encode_budget_remaining_usd + sum(J.committed_usd for J in ReprocessJob(title)) == encode_budget_usd
    input_set: "ReprocessJobs of this Title in state RUNNING or COMPLETED. QUEUED, ABORTED and FAILED jobs contribute 0.00 and carry committed_usd == 0.00."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []
    note: |
      Abort (RUNNING -> ABORTED) and sweep-failure (RUNNING -> FAILED) are the compensating actions for
      the run debit; each restores encode_budget_remaining_usd to exactly its pre-run value and zeroes
      committed_usd, leaving the identity above true with zero drift. This is a money quantity, a
      different conserved type from the bandwidth quantity in vendor_reserved_ledger.

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
# violated rule determines the single error returned — later rules are not
# evaluated once a rule fires, even when their conditions also hold)
# =============================================================================
validations:

  # ---- 1..5 : authentication, authorization, identity scope -----------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role are both present and non-empty. A header that is absent, an empty string, or a whitespace-only string fails this rule."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is exactly one of the seven role names declared in §1.7. Unknown or differently-cased values fail here, before any endpoint role list is consulted."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The caller's role appears in the endpoint's roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: auth
    check: "When X-User-Role is VendorOperator (identity entity_backed:CdnVendor), X-User-ID equals the id of an existing CdnVendor."
    error_id: ERR_VENDOR_IDENTITY_UNKNOWN
    http_status: 403
    applies_to: "all endpoints whose roles list contains VendorOperator"

  - priority: 5
    category: auth
    check: "A VendorOperator may only read or mutate resources whose vendor scope is its own X-User-ID: GET/PATCH /cdn-vendors/{id} requires id == X-User-ID; GET /playback-metrics and GET /live-reservations and GET /routing-policies require the corresponding vendor filter to be present and equal to X-User-ID."
    error_id: ERR_VENDOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /cdn-vendors/{id}, PATCH /cdn-vendors/{id}, GET /playback-metrics, GET /live-reservations, GET /routing-policies"

  # ---- 6 : payload schema ---------------------------------------------------
  - priority: 6
    category: existence
    check: "Request payload schema: every required input present; no unknown field; correct JSON type per §1.1; enum values drawn from the declared constraint; ISO-8601 UTC instants parseable; decimals within the declared scale; integers within declared ranges; region_code matches ^[A-Z]{2}$ (or the literal '*' where §1.1 allows it); page >= 1 and 1 <= page_size <= 100. Also fires for a rungs array that is empty or whose elements lack label/height_px/bitrate_kbps."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  # ---- 7..8 : existence ------------------------------------------------------
  - priority: 7
    category: existence
    check: "Every id in the request PATH resolves to a stored entity, validated left-to-right in path order."
    error_id: "ERR_TITLE_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_LADDER_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_JOB_NOT_FOUND | ERR_METRIC_WINDOW_NOT_FOUND | ERR_DEVICE_PROFILE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 8
    category: existence
    check: "Every foreign-key id in the request BODY or query string resolves to a stored entity, validated in the field order declared in the endpoint's input list."
    error_id: "ERR_TITLE_NOT_FOUND | ERR_LADDER_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_DEVICE_PROFILE_NOT_FOUND | ERR_PACKAGE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /mezzanine-assets, POST /encoding-ladders, POST /drm-packages, POST /drm-packages/{id}/package, POST /routing-policies, POST /playback-metrics, POST /live-reservations, POST /reprocess-jobs, POST /playback-entitlement-checks"

  # ---- 9 : uniqueness --------------------------------------------------------
  - priority: 9
    category: business_constraint
    check: "Global uniqueness of natural keys: Title.external_ref, CdnVendor.vendor_code and DeviceProfile.device_class are each unique across all rows, compared case-sensitively."
    error_id: "ERR_DUPLICATE_EXTERNAL_REF | ERR_DUPLICATE_VENDOR_CODE | ERR_DUPLICATE_DEVICE_CLASS"
    http_status: 409
    applies_to: "POST /titles, POST /cdn-vendors, POST /device-profiles"

  # ---- 10..11 : state preconditions -----------------------------------------
  - priority: 10
    category: state
    check: "The entity named in the path is in a state that admits this transition, per §1.2. Covers: asset qc_state must be INGESTED for a qc-run, QC_FAILED for a remediation request and REMEDIATION_REQUESTED for a resubmit; ladder state must be DRAFT to validate and VALIDATED to lock; package state must be PENDING or STALE to package and PACKAGED to revoke; reservation state must be RESERVED to arm, ARMED to failover, and RESERVED or ARMED to cancel; job state must be QUEUED to run and QUEUED or RUNNING to abort (both abort arms are declared in §1.2); window state must be SCHEDULED or ACTIVE to cancel. RoutingPolicy is deliberately exempt: every one of its states admits a resteer, so a resteer never fails this rule."
    error_id: "ERR_ASSET_STATE_INVALID | ERR_LADDER_STATE_INVALID | ERR_PACKAGE_STATE_INVALID | ERR_RESERVATION_STATE_INVALID | ERR_JOB_STATE_INVALID | ERR_WINDOW_STATE_INVALID"
    http_status: 409
    applies_to: "every POST action endpoint under /mezzanine-assets/{id}, /encoding-ladders/{id}, /drm-packages/{id}, /live-reservations/{id}, /reprocess-jobs/{id}, /availability-windows/{id}"

  - priority: 11
    category: state
    check: "Cross-entity state preconditions on a DIFFERENT entity than the one being mutated, per §1.2 guarded transitions. Covers: POST /encoding-ladders/{id}/lock requires at least one MezzanineAsset of the Title in qc_state QC_PASSED and zero assets in REMEDIATION_REQUESTED; POST /live-reservations/{id}/arm requires a DrmPackage of the Title in state PACKAGED; POST /drm-packages/{id}/package requires the bound EncodingLadder in state LOCKED; POST /reprocess-jobs requires the source EncodingLadder in state LOCKED, and this arm is CASCADING — it is evaluated only when the Title already owns at least one MezzanineAsset with qc_state != QC_REJECTED, so a Title with no eligible source asset falls through to priority 18's ERR_REPROCESS_NO_SOURCE_ASSET (422) instead of reporting ERR_LADDER_NOT_LOCKED; POST /titles/{id}/availability-windows requires the Title not TAKEN_DOWN with takedown_reason MANUAL_LEGAL; POST /drm-packages requires the bound ladder in DRAFT, VALIDATED or LOCKED."
    error_id: "ERR_NO_PASSED_ASSET | ERR_ASSET_REMEDIATION_PENDING | ERR_PACKAGE_NOT_READY | ERR_LADDER_NOT_LOCKED | ERR_LADDER_NOT_BINDABLE | ERR_TITLE_LEGALLY_BLOCKED"
    http_status: 409
    applies_to: "POST /encoding-ladders/{id}/lock, POST /live-reservations/{id}/arm, POST /drm-packages, POST /drm-packages/{id}/package, POST /reprocess-jobs, POST /titles/{id}/availability-windows"

  # ---- 12 : optimistic concurrency -------------------------------------------
  - priority: 12
    category: state
    check: "expected_title_version, when required by a §1.2.1 concurrency rule, equals the current Title.version."
    error_id: ERR_STALE_TITLE_VERSION
    http_status: 412
    applies_to: "POST /encoding-ladders, POST /reprocess-jobs"

  # ---- 13 : business_safety (DRM / content protection) ----------------------
  - priority: 13
    category: business_safety
    check: "Content-protection floor: an EntitlementRule's hdcp_level is at least the hdcp_floor of its DrmPackage under the ordering NONE < TYPE_0 < TYPE_1, and offline_playback_allowed is false whenever the package's persistent_license_allowed is false. Also: a DrmPackage's drm_systems must contain at least one system and must include WIDEVINE whenever hdcp_floor is TYPE_1."
    error_id: "ERR_HDCP_FLOOR_VIOLATION | ERR_OFFLINE_NOT_LICENSED | ERR_DRM_SYSTEM_UNSUPPORTED"
    http_status: 422
    applies_to: "POST /drm-packages, POST /drm-packages/{id}/entitlement-rules"

  # ---- 14 : business_referential (cross-aggregate consistency) --------------
  - priority: 14
    category: business_referential
    check: "Cross-aggregate consistency of references that already exist: a DrmPackage's ladder_id must belong to the same title_id; a PlaybackMetricWindow's vendor must serve its region_code; a LiveEventReservation's Title must have content_type LIVE_EVENT and its failover_vendor_id must differ from its primary_vendor_id; a ReprocessJob's source ladder must belong to its Title and its target_codec_family must differ from the source ladder's codec_family; an EntitlementRule's region_code must be '*' or a region covered by a SCHEDULED or ACTIVE AvailabilityWindow of the package's Title."
    error_id: "ERR_LADDER_TITLE_MISMATCH | ERR_VENDOR_REGION_NOT_SERVED | ERR_NOT_LIVE_EVENT_TITLE | ERR_FAILOVER_SAME_AS_PRIMARY | ERR_REPROCESS_CODEC_UNCHANGED | ERR_RULE_REGION_NOT_LICENSED"
    http_status: 422
    applies_to: "POST /drm-packages, POST /playback-metrics, POST /live-reservations, POST /reprocess-jobs, POST /drm-packages/{id}/entitlement-rules"

  # ---- 15 : business_temporal ------------------------------------------------
  - priority: 15
    category: business_temporal
    check: "Interval well-formedness and placement: window_start_at < window_end_at strictly; a new AvailabilityWindow or LiveEventReservation must start at or after the current logical clock; a PlaybackMetricWindow must end at or before the current logical clock; a LiveEventReservation's window must fall entirely inside a single SCHEDULED or ACTIVE AvailabilityWindow of its Title (any region, since a reservation is not region-scoped)."
    error_id: "ERR_WINDOW_BOUNDS_INVALID | ERR_WINDOW_IN_PAST | ERR_METRIC_WINDOW_IN_FUTURE | ERR_RESERVATION_OUTSIDE_LICENSE"
    http_status: 422
    applies_to: "POST /titles/{id}/availability-windows, POST /live-reservations, POST /playback-metrics"

  - priority: 16
    category: business_temporal
    check: "Half-open overlap exclusion per calculations.availability_window_overlap: a new AvailabilityWindow must not overlap any SCHEDULED or ACTIVE window of the same Title and region_code. Abutting endpoints do not overlap."
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /titles/{id}/availability-windows"

  # ---- 17 : business_constraint (shape, cardinality, selector pools) --------
  - priority: 17
    category: business_constraint
    check: "Shape and cardinality constraints: a ladder's rungs must have 2..8 entries with strictly increasing height_px in stored array order and no duplicate label; an EntitlementRule's (region_code, subscription_tier, device_class_scope) triple must be unique within its package; a ReprocessJob may not be created while another job of the same Title is QUEUED or RUNNING; a Title may hold at most one RoutingPolicy per region_code; a resteer of a policy whose excluded_vendor_ids already contains every ACTIVE vendor for the region is still accepted and drives UNROUTABLE."
    error_id: "ERR_RUNG_SHAPE_INVALID | ERR_DUPLICATE_ENTITLEMENT_RULE | ERR_REPROCESS_JOB_IN_FLIGHT | ERR_DUPLICATE_ROUTING_POLICY"
    http_status: 409
    applies_to: "POST /encoding-ladders, POST /drm-packages/{id}/entitlement-rules, POST /reprocess-jobs, POST /routing-policies"

  - priority: 18
    category: business_constraint
    check: "Selector pool non-emptiness at creation time, per calculations.routing_vendor_selection step (d): POST /routing-policies requires at least one eligible CdnVendor; POST /reprocess-jobs requires at least one MezzanineAsset of the Title with qc_state != QC_REJECTED."
    error_id: "ERR_NO_ELIGIBLE_VENDOR | ERR_REPROCESS_NO_SOURCE_ASSET"
    http_status: 422
    applies_to: "POST /routing-policies, POST /reprocess-jobs"

  # ---- 19..20 : business_fiscal (capacity and budget, always last) ----------
  - priority: 19
    category: business_fiscal
    check: "Aggregate bandwidth capacity per calculations.vendor_capacity_availability: held_gbps + requested reserved_gbps <= vendor.committed_gbps on the vendor being charged. Equality is accepted."
    error_id: ERR_VENDOR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /live-reservations, POST /live-reservations/{id}/failover"

  - priority: 20
    category: business_fiscal
    check: "Encode budget per calculations.encode_budget_ledger: a run may only debit cost_estimate_usd when cost_estimate_usd <= Title.encode_budget_remaining_usd. Equality is accepted."
    error_id: ERR_ENCODE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /reprocess-jobs/{id}/run"

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix is "/", so every path below is absolute
# and every collection is top-level — flat entity topology, no nested routing
# except the four reverse-reachability sub-resources and the action endpoints)
# =============================================================================
endpoints:

  # ---------------- system / test-driving surface --------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock to an arbitrary instant. The clock's STARTUP DEFAULT is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the server reads that instant and MUST NOT fall back to real wall-clock time. Every window, sweep and expiry rule in this scaffold reads the logical clock only. Moving the clock does not by itself transition anything — POST /availability-sweep applies the consequences."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["logical clock set; no entity is transitioned"]

  - method: POST
    path: "/availability-sweep"
    description: "Runs the availability sweep in the four pinned phases (Phase 1 AvailabilityWindow, Phase 2 LiveEventReservation, Phase 3 ReprocessJob, Phase 4 Title.availability_state) against the current logical clock, and returns per-phase counts. Idempotent for a fixed clock value: a second call with an unchanged clock transitions nothing and returns all-zero counts."
    roles: [PlatformAdmin, ContentOps]
    code: 200
    input: []
    output:
      windows_activated: integer
      windows_closed: integer
      reservations_started: integer
      reservations_ended: integer
      jobs_completed: integer
      jobs_failed: integer
      titles_published: integer
      titles_taken_down: integer
      titles_expired: integer
    side_effects:
      - "Phase 1: SCHEDULED windows whose window_start_at <= now become ACTIVE; ACTIVE windows whose window_end_at <= now become CLOSED"
      - "Phase 2: ARMED reservations whose window_start_at <= now become LIVE (a still-RESERVED reservation is never started by the sweep — it must be armed first, per §1.2); LIVE and FAILED_OVER reservations whose window_end_at <= now become ENDED and release reserved_gbps (calculations.vendor_reserved_ledger)"
      - "Phase 3: RUNNING jobs complete or fail; a completing job creates the result EncodingLadder in state LOCKED and supersedes the source ladder (calculations.encode_budget_ledger)"
      - "Phase 4: at most ONE Title.availability_state transition per Title per sweep, using readiness_score_certified >= 80.00 as the publish gate"

  # ---------------- Title ---------------------------------------------------
  - method: POST
    path: "/titles"
    description: "Registers a catalog Title. availability_state starts DRAFT, packaging_state starts UNPACKAGED, both readiness scores start 0.00, encode_budget_remaining_usd starts equal to encode_budget_usd."
    roles: [ContentOps]
    code: 201
    input: [external_ref, title_name, content_type, studio_code, "encode_budget_usd?"]
    output: Title
    side_effects: ["Title created in DRAFT/UNPACKAGED; encode_budget_remaining_usd = encode_budget_usd (default 5000.00)"]

  - method: GET
    path: "/titles/{id}"
    description: "Reads one Title including both readiness variants, both state dimensions, version and encode_budget_remaining_usd."
    roles: [ContentOps, QcAnalyst, EncodingEngineer, DrmOperator, DeliveryEngineer, PlatformAdmin]
    code: 200
    input: []
    output: Title
    side_effects: []

  - method: GET
    path: "/titles"
    description: "Paginated Title list with filters. Results are ordered by created_at ASC; page defaults to 1 and page_size defaults to 20 with a maximum of 100."
    roles: [ContentOps, EncodingEngineer, DrmOperator, DeliveryEngineer, PlatformAdmin]
    code: 200
    input: ["content_type?", "availability_state?", "packaging_state?", "page?", "page_size?"]
    output: Title[]
    side_effects: []

  - method: PATCH
    path: "/titles/{id}"
    description: "Edits mutable Title metadata and the encode budget. Increments Title.version on every successful call, which is what makes a previously captured expected_title_version stale for the §1.2.1 concurrency rules. Lowering encode_budget_usd below the already-committed total is rejected."
    roles: [ContentOps]
    code: 200
    input: ["title_name?", "studio_code?", "encode_budget_usd?"]
    output: Title
    side_effects:
      - "Title.version += 1; updated_at refreshed"
      - "encode_budget_remaining_usd recomputed (calculations.encode_budget_ledger)"
      - "rejected with ERR_ENCODE_BUDGET_EXCEEDED when the new encode_budget_usd is below the sum of committed_usd over the Title's RUNNING and COMPLETED jobs"

  - method: POST
    path: "/titles/{id}/takedown"
    description: "Operator-initiated takedown. Only takedown_reason MANUAL_LEGAL is accepted here; CONTRACT_END and PACKAGING_STALE are reserved for the sweep and the packaging cascade respectively. A MANUAL_LEGAL takedown is sticky: the sweep will never re-publish the Title afterwards."
    roles: [ContentOps]
    code: 200
    input: [takedown_reason]
    output: Title
    side_effects:
      - "Title.availability_state = TAKEN_DOWN; takedown_reason = MANUAL_LEGAL; Title.version += 1"
      - "every ACTIVE AvailabilityWindow of the Title becomes CLOSED"

  - method: POST
    path: "/titles/{id}/availability-windows"
    description: "Schedules a licensing window for one region. Intervals are HALF-OPEN [window_start_at, window_end_at): abutting windows are legal, any true overlap with a SCHEDULED or ACTIVE window of the same Title and region is rejected."
    roles: [ContentOps]
    code: 201
    input: [region_code, window_start_at, window_end_at, license_tier]
    output: AvailabilityWindow
    side_effects:
      - "AvailabilityWindow created in SCHEDULED"
      - "overlap checked per calculations.availability_window_overlap"

  - method: GET
    path: "/titles/{id}/availability-windows"
    description: "Reverse-reachability list of a Title's licensing windows, ordered by window_start_at ASC then created_at ASC."
    roles: [ContentOps, DeliveryEngineer, PlatformAdmin]
    code: 200
    input: ["region_code?", "state?"]
    output: AvailabilityWindow[]
    side_effects: []

  - method: GET
    path: "/titles/{id}/mezzanine-assets"
    description: "Reverse-reachability list of a Title's source masters, ordered by created_at ASC."
    roles: [ContentOps, QcAnalyst, EncodingEngineer, PlatformAdmin]
    code: 200
    input: ["qc_state?"]
    output: MezzanineAsset[]
    side_effects: []

  - method: POST
    path: "/availability-windows/{id}/cancel"
    description: "Cancels a SCHEDULED or ACTIVE licensing window, freeing its interval for reuse by a later window in the same region."
    roles: [ContentOps]
    code: 200
    input: []
    output: AvailabilityWindow
    side_effects:
      - "AvailabilityWindow.state = CANCELLED; closed_at set"
      - "the interval no longer participates in calculations.availability_window_overlap"

  # ---------------- MezzanineAsset / QC ------------------------------------
  - method: POST
    path: "/mezzanine-assets"
    description: "Registers a source master for a Title in qc_state INGESTED with qc_attempt_count 0."
    roles: [ContentOps]
    code: 201
    input: [title_id, source_uri, duration_seconds, frame_rate, peak_audio_lufs, artifact_defect_count, "caption_languages?", audio_language]
    output: MezzanineAsset
    side_effects: ["MezzanineAsset created in INGESTED", "Title readiness recomputed, both variants (calculations.title_readiness_score)"]

  - method: GET
    path: "/mezzanine-assets/{id}"
    description: "Reads one source master including qc_state, qc_attempt_count, latest_severity_index and blocking_defect_code."
    roles: [ContentOps, QcAnalyst, EncodingEngineer, PlatformAdmin]
    code: 200
    input: []
    output: MezzanineAsset
    side_effects: []

  - method: POST
    path: "/mezzanine-assets/{id}/qc-runs"
    description: "Runs quality control on an INGESTED asset and returns the immutable QualityControlReport. Branching transition: a PASS or WARN verdict drives the asset to QC_PASSED, a FAIL verdict on attempt 1 or 2 drives it to QC_FAILED, and a FAIL verdict on attempt 3 drives it to the terminal QC_REJECTED. All three branches return HTTP 201 — a FAIL is a recorded outcome, not an error."
    roles: [QcAnalyst]
    code: 201
    input: []
    output: QualityControlReport
    side_effects:
      - "QualityControlReport created with attempt_number = asset.qc_attempt_count + 1 (calculations.mezzanine_qc_verdict)"
      - "MezzanineAsset.qc_attempt_count += 1; latest_severity_index and blocking_defect_code copied from the report"
      - "MezzanineAsset.qc_state moves to QC_PASSED, QC_FAILED or QC_REJECTED per the verdict branch"
      - "Title readiness recomputed, both variants"

  - method: POST
    path: "/mezzanine-assets/{id}/remediation-request"
    description: "Requests remediation of a QC_FAILED asset, moving it to REMEDIATION_REQUESTED. While any asset of a Title sits in REMEDIATION_REQUESTED, that Title's ladders cannot be locked."
    roles: [QcAnalyst]
    code: 200
    input: []
    output: MezzanineAsset
    side_effects: ["MezzanineAsset.qc_state = REMEDIATION_REQUESTED", "Title readiness recomputed, both variants"]

  - method: POST
    path: "/mezzanine-assets/{id}/resubmit"
    description: "Re-ingests a corrected source master, closing the QC revision loop back to INGESTED. Accepts corrected measurements; omitted fields keep their current values. qc_attempt_count is deliberately NOT reset, so the third FAIL is terminal no matter how many resubmits precede it."
    roles: [ContentOps]
    code: 200
    input: ["source_uri?", "peak_audio_lufs?", "artifact_defect_count?", "caption_languages?"]
    output: MezzanineAsset
    side_effects:
      - "MezzanineAsset.qc_state = INGESTED; blocking_defect_code = NONE; latest_severity_index = 0.00"
      - "qc_attempt_count preserved; Title readiness recomputed, both variants"

  - method: GET
    path: "/mezzanine-assets/{id}/qc-reports"
    description: "Reverse-reachability list of an asset's immutable QC reports, ordered by attempt_number ASC. These reports are the only channel through which the per-attempt severity_index and artifact_penalty are observable."
    roles: [ContentOps, QcAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: QualityControlReport[]
    side_effects: []

  # ---------------- EncodingLadder / DeviceProfile -------------------------
  - method: POST
    path: "/encoding-ladders"
    description: "Creates a DRAFT encoding ladder for a Title. expected_title_version is MANDATORY and is checked against Title.version per §1.2.1 rule ladder-create-stale-title. rungs is an array of {label, height_px, bitrate_kbps} in ascending-height order."
    roles: [EncodingEngineer]
    code: 201
    input: [title_id, codec_family, rungs, expected_title_version, "derived_from_ladder_id?"]
    output: EncodingLadder
    side_effects:
      - "EncodingLadder created in DRAFT; rung_count, peak_bitrate_kbps and peak_height_px derived from rungs"
      - "Title.version += 1; Title.packaging_state re-derived; Title readiness recomputed, both variants"

  - method: GET
    path: "/encoding-ladders/{id}"
    description: "Reads one ladder including device_compat_score, compatible_device_count, validation_reason_code and the supersede links."
    roles: [EncodingEngineer, ContentOps, DrmOperator, PlatformAdmin]
    code: 200
    input: []
    output: EncodingLadder
    side_effects: []

  - method: GET
    path: "/encoding-ladders"
    description: "Reverse-reachability list of ladders, ordered by created_at ASC. title_id, derived_from_ladder_id and superseded_by_ladder_id are the three FK filters; derived_from_ladder_id and superseded_by_ladder_id traverse the self-referential lineage."
    roles: [EncodingEngineer, ContentOps, DrmOperator, PlatformAdmin]
    code: 200
    input: ["title_id?", "derived_from_ladder_id?", "superseded_by_ladder_id?", "codec_family?", "state?", "page?", "page_size?"]
    output: EncodingLadder[]
    side_effects: []

  - method: POST
    path: "/encoding-ladders/{id}/validate"
    description: "Validates a DRAFT ladder against the ACTIVE DeviceProfile matrix and returns the ladder in its resulting state. Branching transition: VALIDATED when at least one ACTIVE profile is compatible, REJECTED when none is. Both branches return HTTP 200 with validation_reason_code explaining which arm was taken — a rejection is a recorded verdict, not an error."
    roles: [EncodingEngineer]
    code: 200
    input: []
    output: EncodingLadder
    side_effects:
      - "device_compat_score and compatible_device_count written (calculations.device_compat_score)"
      - "state = VALIDATED with validation_reason_code OK, or state = REJECTED with validation_reason_code NO_COMPATIBLE_DEVICE"
      - "Title readiness recomputed, both variants"

  - method: POST
    path: "/encoding-ladders/{id}/lock"
    description: "Locks a VALIDATED ladder as the Title's shippable ladder. This is the head of the depth-5 cascade documented in §1.2: lock -> supersede the previous LOCKED ladder of the same codec_family -> that ladder's DrmPackages become STALE -> the Title's packaging_state becomes STALE -> a PUBLISHED Title is taken down with takedown_reason PACKAGING_STALE -> its ACTIVE windows close."
    roles: [EncodingEngineer]
    code: 200
    input: []
    output: EncodingLadder
    side_effects:
      - "hop 1: EncodingLadder.state = LOCKED; Title.locked_ladder_count += 1"
      - "hop 2: the previously LOCKED ladder of the same Title and codec_family (if any) becomes SUPERSEDED with superseded_by_ladder_id set to this ladder"
      - "hop 3: every PACKAGED DrmPackage bound to that superseded ladder becomes STALE with stale_reason LADDER_SUPERSEDED"
      - "hop 4: Title.packaging_state re-derived to STALE because a STALE package now exists"
      - "hop 5: a PUBLISHED Title is taken down with takedown_reason PACKAGING_STALE and its ACTIVE AvailabilityWindows are CLOSED"
      - "guarded by the cross-entity precondition on MezzanineAsset qc_state (ERR_NO_PASSED_ASSET / ERR_ASSET_REMEDIATION_PENDING)"

  - method: POST
    path: "/device-profiles"
    description: "Registers a playback device class in the compatibility matrix. state defaults to ACTIVE; a profile created or set to RETIRED never participates in calculations.device_compat_score or entitlement device scoping, though its quality_normalization_factor is still read by historical playback metrics."
    roles: [PlatformAdmin]
    code: 201
    input: [device_class, max_height_px, supported_codecs, min_bitrate_kbps, max_bitrate_kbps, hdcp_required, required_drm_system, market_share_pct, quality_normalization_factor, "state?"]
    output: DeviceProfile
    side_effects: ["DeviceProfile created; already-validated ladders are NOT re-scored (device_compat_score is a snapshot taken at validate time)"]

  - method: GET
    path: "/device-profiles"
    description: "Lists device profiles ordered by created_at ASC, optionally filtered by state, so a test can confirm which profiles the compatibility matrix will consider."
    roles: [PlatformAdmin, EncodingEngineer, DrmOperator, DeliveryEngineer]
    code: 200
    input: ["state?", "device_class?", "page?", "page_size?"]
    output: DeviceProfile[]
    side_effects: []

  # ---------------- DrmPackage / EntitlementRule / entitlement ------------
  - method: POST
    path: "/drm-packages"
    description: "Creates a PENDING DRM package bound to one of the Title's encoding ladders. The ladder may be DRAFT, VALIDATED or LOCKED — binding before validation is deliberate, because a device profile that requires a DRM system only counts as compatible when a PENDING or PACKAGED package already advertises that system. hdcp_floor is derived from the bound ladder's peak_height_px."
    roles: [DrmOperator]
    code: 201
    input: [title_id, ladder_id, drm_systems, license_server_url, "key_rotation_hours?", "persistent_license_allowed?"]
    output: DrmPackage
    side_effects:
      - "DrmPackage created in PENDING; hdcp_floor derived (TYPE_1 at peak_height_px >= 2160, TYPE_0 at >= 1080, else NONE)"
      - "Title.packaging_state re-derived; Title readiness recomputed, both variants"

  - method: GET
    path: "/drm-packages/{id}"
    description: "Reads one DRM package including state, stale_reason, hdcp_floor, entitlement_rule_count and packaged_at."
    roles: [DrmOperator, ContentOps, DeliveryEngineer, PlatformAdmin]
    code: 200
    input: []
    output: DrmPackage
    side_effects: []

  - method: GET
    path: "/drm-packages"
    description: "Reverse-reachability list of DRM packages ordered by created_at ASC, filterable by either FK. The created_at ASC order is the same order calculations.entitlement_decision uses to pick among several PACKAGED packages of one Title."
    roles: [DrmOperator, ContentOps, DeliveryEngineer, PlatformAdmin]
    code: 200
    input: ["title_id?", "ladder_id?", "state?", "page?", "page_size?"]
    output: DrmPackage[]
    side_effects: []

  - method: POST
    path: "/drm-packages/{id}/package"
    description: "Packages a PENDING package, or repackages a STALE one. The bound ladder must be LOCKED; a STALE package whose ladder was superseded therefore MUST pass ladder_id to rebind to the Title's current LOCKED ladder — omitting it on a STALE package fails with ERR_LADDER_NOT_LOCKED."
    roles: [DrmOperator]
    code: 200
    input: ["ladder_id?"]
    output: DrmPackage
    side_effects:
      - "DrmPackage.state = PACKAGED; packaged_at = logical clock; stale_reason = NONE; hdcp_floor re-derived from the (possibly rebound) ladder"
      - "Title.packaging_state re-derived (PACKAGED once no STALE package remains); Title readiness recomputed, both variants"

  - method: POST
    path: "/drm-packages/{id}/revoke"
    description: "Revokes a package from PENDING, PACKAGED or STALE into the terminal REVOKED state. A REVOKED package is invisible to calculations.entitlement_decision, to calculations.device_compat_score and to both readiness variants."
    roles: [DrmOperator]
    code: 200
    input: []
    output: DrmPackage
    side_effects:
      - "DrmPackage.state = REVOKED (terminal)"
      - "Title.packaging_state re-derived; Title readiness recomputed, both variants"

  - method: POST
    path: "/drm-packages/{id}/entitlement-rules"
    description: "Attaches an immutable playback entitlement rule to a package. region_code accepts a two-letter code or the wildcard '*'. Rules are never updated or deleted; a superseding policy is expressed by attaching a higher-priority rule."
    roles: [DrmOperator]
    code: 201
    input: [region_code, subscription_tier, "device_class_scope?", max_concurrent_streams, max_playback_height_px, hdcp_level, "offline_playback_allowed?", priority]
    output: EntitlementRule
    side_effects:
      - "EntitlementRule created (immutable, no version field); DrmPackage.entitlement_rule_count += 1"
      - "hdcp_level checked against the package's hdcp_floor (ERR_HDCP_FLOOR_VIOLATION) and region_code against the Title's licensed regions (ERR_RULE_REGION_NOT_LICENSED)"

  - method: GET
    path: "/drm-packages/{id}/entitlement-rules"
    description: "Reverse-reachability list of a package's rules, ordered by priority DESC then created_at ASC — exactly the ranking calculations.entitlement_decision applies after filtering."
    roles: [DrmOperator, DeliveryEngineer, PlatformAdmin]
    code: 200
    input: ["region_code?"]
    output: EntitlementRule[]
    side_effects: []

  - method: POST
    path: "/playback-entitlement-checks"
    description: "Evaluates a playback request against the Title's PACKAGED DRM package and its entitlement rules, returning the winning rule and the effective playback ceiling. This is a computed read expressed as a POST because the request carries a body; nothing is persisted."
    roles: [DeliveryEngineer, DrmOperator]
    code: 200
    input: [title_id, region_code, subscription_tier, device_class, requested_streams, "offline_requested?"]
    output:
      decision: string
      reason_code: string
      matched_rule_id: string
      package_id: string
      effective_height_px: integer
      max_concurrent_streams: integer
      offline_granted: boolean
    side_effects: ["none; read-only evaluation per calculations.entitlement_decision"]

  # ---------------- CdnVendor ----------------------------------------------
  - method: POST
    path: "/cdn-vendors"
    description: "Registers a CDN vendor in state ACTIVE with reserved_gbps 0.00, breach_window_count 0 and BOTH health variants seeded at 100.00 (the no-rows default)."
    roles: [PlatformAdmin]
    code: 201
    input: [vendor_code, regions, committed_gbps, cost_per_gb_usd]
    output: CdnVendor
    side_effects: ["CdnVendor created ACTIVE; health_score_rolling = health_score_contract = 100.00"]

  - method: GET
    path: "/cdn-vendors/{id}"
    description: "Reads one vendor including reserved_gbps and both health variants. This is the only channel through which the conserved bandwidth quantity of calculations.vendor_reserved_ledger is observable. A VendorOperator may read only its own vendor row."
    roles: [PlatformAdmin, DeliveryEngineer, VendorOperator]
    code: 200
    input: []
    output: CdnVendor
    side_effects: []

  - method: PATCH
    path: "/cdn-vendors/{id}"
    description: "Updates a vendor's commercial terms. Lowering committed_gbps below the vendor's current reserved_gbps is rejected. Changing cost_per_gb_usd or regions does NOT re-steer existing routing policies — those keep their frozen selection until the next resteer."
    roles: [PlatformAdmin, VendorOperator]
    code: 200
    input: ["committed_gbps?", "cost_per_gb_usd?", "regions?"]
    output: CdnVendor
    side_effects:
      - "CdnVendor.version += 1"
      - "rejected with ERR_VENDOR_CAPACITY_EXCEEDED when the new committed_gbps < reserved_gbps"

  # ---------------- RoutingPolicy ------------------------------------------
  - method: POST
    path: "/routing-policies"
    description: "Creates a traffic-steering policy for one Title and region. The server — not the caller — selects primary_vendor_id and backup_vendor_id per calculations.routing_vendor_selection using the requested steering_mode; an empty candidate pool is rejected with ERR_NO_ELIGIBLE_VENDOR and nothing is persisted."
    roles: [DeliveryEngineer]
    code: 201
    input: [title_id, region_code, steering_mode]
    output: RoutingPolicy
    side_effects:
      - "RoutingPolicy created; primary_vendor_id, backup_vendor_id, selection_reason_code and state set by the selector (ACTIVE with 2+ candidates, STANDBY_ONLY with exactly 1)"
      - "projected_egress_cost_usd computed (calculations.egress_cost_projection)"

  - method: GET
    path: "/routing-policies/{id}"
    description: "Reads one policy including the selected vendors, excluded_vendor_ids, resteer_count, selection_reason_code and projected_egress_cost_usd."
    roles: [DeliveryEngineer, ContentOps, PlatformAdmin]
    code: 200
    input: []
    output: RoutingPolicy
    side_effects: []

  - method: GET
    path: "/routing-policies"
    description: "Reverse-reachability list of policies ordered by created_at ASC. A VendorOperator must supply primary_vendor_id or backup_vendor_id equal to its own X-User-ID."
    roles: [DeliveryEngineer, ContentOps, PlatformAdmin, VendorOperator]
    code: 200
    input: ["title_id?", "primary_vendor_id?", "backup_vendor_id?", "region_code?", "state?", "page?", "page_size?"]
    output: RoutingPolicy[]
    side_effects: []

  - method: POST
    path: "/routing-policies/{id}/resteer"
    description: "Re-runs the vendor selector after appending the outgoing primary to excluded_vendor_ids. Exclusions are permanent, so repeated resteers monotonically shrink the pool and converge on STANDBY_ONLY and then UNROUTABLE. Every state admits a resteer, including UNROUTABLE — a resteer with no candidates returns 200 and only bumps resteer_count."
    roles: [DeliveryEngineer]
    code: 200
    input: []
    output: RoutingPolicy
    side_effects:
      - "excluded_vendor_ids gains the outgoing primary_vendor_id when one exists"
      - "primary_vendor_id, backup_vendor_id, state and selection_reason_code rewritten by the selector; resteer_count += 1"
      - "projected_egress_cost_usd recomputed (0.00 when UNROUTABLE)"

  # ---------------- PlaybackMetricWindow -----------------------------------
  - method: POST
    path: "/playback-metrics"
    description: "Ingests one immutable playback-quality window for a (Title, device class, vendor, region) tuple. The window must already be closed against the logical clock. This single call is the head of the depth-3 metric cascade: window breach_flag -> vendor health/state -> automatic policy resteer."
    roles: [DeliveryEngineer, PlatformAdmin]
    code: 201
    input: [title_id, device_profile_id, vendor_id, region_code, window_start_at, window_end_at, play_attempts, rebuffer_events, startup_ms_p95, error_count]
    output: PlaybackMetricWindow
    side_effects:
      - "hop 1: PlaybackMetricWindow created with rebuffer_ratio, error_rate, quality_index and breach_flag (calculations.playback_quality_index)"
      - "hop 2: the vendor's health_score_rolling, health_score_contract and breach_window_count are rewritten (calculations.vendor_health_score) and the CdnVendor state machine may move ACTIVE->DEGRADED, DEGRADED->ACTIVE, or either->DRAINED"
      - "hop 3: if and only if the vendor left ACTIVE, every RoutingPolicy whose primary_vendor_id is that vendor auto-resteers with the vendor excluded, possibly landing in STANDBY_ONLY or UNROUTABLE"
      - "hop 4 (when the resteer changes the primary): that policy's projected_egress_cost_usd is recomputed against the new primary's cost_per_gb_usd"

  - method: GET
    path: "/playback-metrics/{id}"
    description: "Reads one ingested metric window including the derived ratios, quality_index and breach_flag."
    roles: [DeliveryEngineer, PlatformAdmin, VendorOperator]
    code: 200
    input: []
    output: PlaybackMetricWindow
    side_effects: []

  - method: GET
    path: "/playback-metrics"
    description: "Reverse-reachability list of metric windows ordered by window_start_at DESC then created_at DESC — the same ordering calculations.vendor_health_score uses to pick its rolling window. A VendorOperator must supply vendor_id equal to its own X-User-ID."
    roles: [DeliveryEngineer, PlatformAdmin, VendorOperator]
    code: 200
    input: ["title_id?", "device_profile_id?", "vendor_id?", "region_code?", "breach_flag?", "page?", "page_size?"]
    output: PlaybackMetricWindow[]
    side_effects: []

  # ---------------- LiveEventReservation -----------------------------------
  - method: POST
    path: "/live-reservations"
    description: "Reserves live-event egress capacity on a primary vendor, optionally naming a failover vendor. Reservation intervals are CLOSED and inflated by buffer_minutes on both ends, and capacity is aggregated across every colliding reservation on that vendor: equality with committed_gbps is accepted, one hundredth of a Gbps more is rejected."
    roles: [DeliveryEngineer]
    code: 201
    input: [title_id, primary_vendor_id, window_start_at, window_end_at, reserved_gbps, "failover_vendor_id?", "buffer_minutes?"]
    output: LiveEventReservation
    side_effects:
      - "LiveEventReservation created in RESERVED with active_vendor_id = primary_vendor_id"
      - "primary vendor's reserved_gbps increased (calculations.vendor_reserved_ledger)"

  - method: GET
    path: "/live-reservations/{id}"
    description: "Reads one reservation including active_vendor_id, failover_at and released_gbps."
    roles: [DeliveryEngineer, ContentOps, PlatformAdmin]
    code: 200
    input: []
    output: LiveEventReservation
    side_effects: []

  - method: GET
    path: "/live-reservations"
    description: "Reverse-reachability list of reservations ordered by window_start_at ASC then created_at ASC. A VendorOperator must supply one of the three vendor filters equal to its own X-User-ID."
    roles: [DeliveryEngineer, ContentOps, PlatformAdmin, VendorOperator]
    code: 200
    input: ["title_id?", "primary_vendor_id?", "failover_vendor_id?", "active_vendor_id?", "state?", "page?", "page_size?"]
    output: LiveEventReservation[]
    side_effects: []

  - method: POST
    path: "/live-reservations/{id}/arm"
    description: "Arms a RESERVED reservation for broadcast. Cross-entity guard: the Title must already own a DrmPackage in state PACKAGED, otherwise ERR_PACKAGE_NOT_READY (409) — a live event may not be armed against unprotected content."
    roles: [DeliveryEngineer]
    code: 200
    input: []
    output: LiveEventReservation
    side_effects: ["LiveEventReservation.state = ARMED", "no capacity movement; the hold stays on active_vendor_id"]

  - method: POST
    path: "/live-reservations/{id}/failover"
    description: "Moves an ARMED reservation onto its failover vendor. This is the compensating action for the primary-side capacity hold: the identical reserved_gbps is debited from the primary and credited to the failover vendor, leaving the global held bandwidth unchanged."
    roles: [DeliveryEngineer]
    code: 200
    input: []
    output: LiveEventReservation
    side_effects:
      - "LiveEventReservation.state = FAILED_OVER; active_vendor_id = failover_vendor_id; failover_at = logical clock"
      - "primary vendor's reserved_gbps decreased and failover vendor's reserved_gbps increased by the same amount (calculations.vendor_reserved_ledger); GLOBAL_HELD_GBPS unchanged"
      - "capacity re-checked on the failover vendor before the move (ERR_VENDOR_CAPACITY_EXCEEDED)"

  - method: POST
    path: "/live-reservations/{id}/cancel"
    description: "Cancels a RESERVED or ARMED reservation, releasing its entire hold from whichever vendor currently carries it."
    roles: [DeliveryEngineer]
    code: 200
    input: []
    output: LiveEventReservation
    side_effects:
      - "LiveEventReservation.state = CANCELLED (terminal); released_gbps = reserved_gbps"
      - "active_vendor_id's reserved_gbps decreased by reserved_gbps; GLOBAL_HELD_GBPS decreases by exactly released_gbps"

  # ---------------- ReprocessJob -------------------------------------------
  - method: POST
    path: "/reprocess-jobs"
    description: "Queues a catalog reprocessing job that re-encodes a LOCKED ladder's rung shape into a different codec family. expected_title_version is MANDATORY per §1.2.1 rule reprocess-create-stale-title. cost_estimate_usd, per_rung_cost_usd and priority_rank are frozen here and never recomputed, even if the source ladder or the Title budget later changes."
    roles: [EncodingEngineer]
    code: 201
    input: [title_id, source_ladder_id, trigger_reason, target_codec_family, expected_title_version]
    output: ReprocessJob
    side_effects:
      - "ReprocessJob created in QUEUED with the frozen cost fields (calculations.reprocess_cost_estimate)"
      - "Title.version += 1; no budget is debited yet (committed_usd stays 0.00)"

  - method: GET
    path: "/reprocess-jobs/{id}"
    description: "Reads one job including per_rung_cost_usd, committed_usd, priority_rank, result_ladder_id and abort_reason."
    roles: [EncodingEngineer, ContentOps, PlatformAdmin]
    code: 200
    input: []
    output: ReprocessJob
    side_effects: []

  - method: GET
    path: "/reprocess-jobs"
    description: "Reverse-reachability list of jobs ordered by priority_rank DESC then created_at ASC, filterable by Title or by either ladder link."
    roles: [EncodingEngineer, ContentOps, PlatformAdmin]
    code: 200
    input: ["title_id?", "source_ladder_id?", "result_ladder_id?", "state?", "page?", "page_size?"]
    output: ReprocessJob[]
    side_effects: []

  - method: POST
    path: "/reprocess-jobs/{id}/run"
    description: "Starts a QUEUED job, committing its frozen cost against the Title's encode budget. The debit is accepted at exact equality with encode_budget_remaining_usd and rejected one cent above it."
    roles: [EncodingEngineer]
    code: 200
    input: []
    output: ReprocessJob
    side_effects:
      - "ReprocessJob.state = RUNNING; committed_usd = cost_estimate_usd"
      - "Title.encode_budget_remaining_usd reduced by cost_estimate_usd (calculations.encode_budget_ledger)"

  - method: POST
    path: "/reprocess-jobs/{id}/abort"
    description: "Aborts a QUEUED or RUNNING job. From RUNNING this is the compensating action for the run debit: committed_usd returns to 0.00 and the Title's remaining budget returns to exactly its pre-run value with zero drift. From QUEUED nothing was ever debited, so committed_usd stays 0.00 and encode_budget_remaining_usd is unchanged."
    roles: [EncodingEngineer]
    code: 200
    input: [abort_reason]
    output: ReprocessJob
    side_effects:
      - "ReprocessJob.state = ABORTED (terminal); abort_reason recorded; committed_usd = 0.00"
      - "Title.encode_budget_remaining_usd restored to its pre-run value when the job was RUNNING, and left unchanged when the job was QUEUED (calculations.encode_budget_ledger)"

# =============================================================================
# §1.6 Error Code Catalog
# Every entry is triggerable by at least one endpoint in §1.5. Grouped by class;
# within a group the order matches the §1.4 priority ladder.
# =============================================================================
errors:

  # ---- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing, empty or whitespace-only, or X-User-Role is not one of the seven §1.7 role names."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is valid but absent from the endpoint's roles list."
  - id: ERR_VENDOR_IDENTITY_UNKNOWN
    http: 403
    condition: "X-User-Role is VendorOperator but X-User-ID is not the id of any CdnVendor."
  - id: ERR_VENDOR_SCOPE_VIOLATION
    http: 403
    condition: "A VendorOperator addressed a CdnVendor other than its own X-User-ID, or listed metrics, reservations or policies without a vendor filter equal to its own id."

  # ---- payload ------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Payload schema violation: missing required field, unknown field, wrong JSON type, enum value outside the declared constraint, unparseable ISO-8601 instant, decimal outside the declared scale, integer outside the declared range, region_code not matching ^[A-Z]{2}$ or '*', empty or malformed rungs array, page < 1 or page_size outside 1..100."

  # ---- existence (404) ----------------------------------------------------
  - id: ERR_TITLE_NOT_FOUND
    http: 404
    condition: "No Title with the given id, in the path or in a body/query title_id."
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "No MezzanineAsset with the given path id."
  - id: ERR_LADDER_NOT_FOUND
    http: 404
    condition: "No EncodingLadder with the given id, in the path or in a body ladder_id / source_ladder_id / derived_from_ladder_id."
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "No DrmPackage with the given path id."
  - id: ERR_DEVICE_PROFILE_NOT_FOUND
    http: 404
    condition: "No DeviceProfile with the given device_profile_id, or no ACTIVE DeviceProfile whose device_class equals the device_class of a playback entitlement check."
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "No CdnVendor with the given id, in the path or in a body vendor_id / primary_vendor_id / failover_vendor_id."
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "No RoutingPolicy with the given path id."
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "No LiveEventReservation with the given path id."
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "No AvailabilityWindow with the given path id."
  - id: ERR_JOB_NOT_FOUND
    http: 404
    condition: "No ReprocessJob with the given path id."
  - id: ERR_METRIC_WINDOW_NOT_FOUND
    http: 404
    condition: "No PlaybackMetricWindow with the given path id, on GET /playback-metrics/{id}."

  # ---- uniqueness (409) ---------------------------------------------------
  - id: ERR_DUPLICATE_EXTERNAL_REF
    http: 409
    condition: "POST /titles with an external_ref already held by another Title."
  - id: ERR_DUPLICATE_VENDOR_CODE
    http: 409
    condition: "POST /cdn-vendors with a vendor_code already held by another CdnVendor."
  - id: ERR_DUPLICATE_DEVICE_CLASS
    http: 409
    condition: "POST /device-profiles with a device_class already held by another DeviceProfile, including a RETIRED one."

  # ---- own-entity state preconditions (409) -------------------------------
  - id: ERR_ASSET_STATE_INVALID
    http: 409
    condition: "A qc-run on an asset not INGESTED, a remediation-request on an asset not QC_FAILED, or a resubmit on an asset not REMEDIATION_REQUESTED (including anything attempted on the terminal QC_REJECTED)."
  - id: ERR_LADDER_STATE_INVALID
    http: 409
    condition: "A validate on a ladder not DRAFT, or a lock on a ladder not VALIDATED (including a second lock of an already LOCKED ladder and any action on a SUPERSEDED or REJECTED ladder)."
  - id: ERR_PACKAGE_STATE_INVALID
    http: 409
    condition: "A package call on a DrmPackage that is already PACKAGED or REVOKED, or a revoke of an already REVOKED package."
  - id: ERR_RESERVATION_STATE_INVALID
    http: 409
    condition: "An arm on a reservation not RESERVED, a failover on a reservation not ARMED, or a cancel on a reservation that is LIVE, FAILED_OVER, ENDED or CANCELLED."
  - id: ERR_JOB_STATE_INVALID
    http: 409
    condition: "A run on a job not QUEUED, or an abort on a job already COMPLETED, FAILED or ABORTED (abort is legal from both QUEUED and RUNNING per §1.2)."
  - id: ERR_WINDOW_STATE_INVALID
    http: 409
    condition: "A cancel on an AvailabilityWindow already CLOSED or CANCELLED."

  # ---- cross-entity state guards (409) ------------------------------------
  - id: ERR_NO_PASSED_ASSET
    http: 409
    condition: "POST /encoding-ladders/{id}/lock when the ladder's Title owns no MezzanineAsset in qc_state QC_PASSED."
  - id: ERR_ASSET_REMEDIATION_PENDING
    http: 409
    condition: "POST /encoding-ladders/{id}/lock while at least one MezzanineAsset of the Title sits in REMEDIATION_REQUESTED, even though another asset has passed."
  - id: ERR_PACKAGE_NOT_READY
    http: 409
    condition: "POST /live-reservations/{id}/arm when the reservation's Title owns no DrmPackage in state PACKAGED."
  - id: ERR_LADDER_NOT_LOCKED
    http: 409
    condition: "POST /drm-packages/{id}/package when the bound (or rebound) EncodingLadder is not LOCKED, including a STALE package repackaged without a ladder_id rebind, and POST /reprocess-jobs whose source_ladder_id is not LOCKED."
  - id: ERR_LADDER_NOT_BINDABLE
    http: 409
    condition: "POST /drm-packages naming a ladder in state REJECTED or SUPERSEDED."
  - id: ERR_TITLE_LEGALLY_BLOCKED
    http: 409
    condition: "POST /titles/{id}/availability-windows on a Title that is TAKEN_DOWN with takedown_reason MANUAL_LEGAL."
  - id: ERR_NO_PACKAGED_DRM
    http: 409
    condition: "POST /playback-entitlement-checks for a Title with no DrmPackage in state PACKAGED."

  # ---- optimistic concurrency (412) ---------------------------------------
  - id: ERR_STALE_TITLE_VERSION
    http: 412
    condition: "expected_title_version does not equal the current Title.version on POST /encoding-ladders or POST /reprocess-jobs (§1.2.1)."

  # ---- entitlement denials (403) ------------------------------------------
  - id: ERR_ENTITLEMENT_NO_RULE
    http: 403
    condition: "No EntitlementRule on the selected PACKAGED package matches the request's region, tier, device scope and HDCP requirement."
  - id: ERR_CONCURRENCY_LIMIT_EXCEEDED
    http: 403
    condition: "requested_streams is strictly greater than the winning rule's max_concurrent_streams."
  - id: ERR_OFFLINE_PLAYBACK_DENIED
    http: 403
    condition: "offline_requested is true but the winning rule's offline_playback_allowed or the package's persistent_license_allowed is false."

  # ---- business_safety (422) ----------------------------------------------
  - id: ERR_HDCP_FLOOR_VIOLATION
    http: 422
    condition: "An EntitlementRule's hdcp_level sits below its package's hdcp_floor under NONE < TYPE_0 < TYPE_1."
  - id: ERR_OFFLINE_NOT_LICENSED
    http: 422
    condition: "An EntitlementRule sets offline_playback_allowed true on a package whose persistent_license_allowed is false."
  - id: ERR_DRM_SYSTEM_UNSUPPORTED
    http: 422
    condition: "POST /drm-packages whose drm_systems omits WIDEVINE while the bound ladder's peak_height_px puts hdcp_floor at TYPE_1."

  # ---- business_referential (422) -----------------------------------------
  - id: ERR_LADDER_TITLE_MISMATCH
    http: 422
    condition: "A DrmPackage's ladder_id, or a ReprocessJob's source_ladder_id, belongs to a different Title than the request's title_id."
  - id: ERR_VENDOR_REGION_NOT_SERVED
    http: 422
    condition: "POST /playback-metrics whose region_code is absent from the named vendor's regions."
  - id: ERR_NOT_LIVE_EVENT_TITLE
    http: 422
    condition: "POST /live-reservations for a Title whose content_type is not LIVE_EVENT."
  - id: ERR_FAILOVER_SAME_AS_PRIMARY
    http: 422
    condition: "POST /live-reservations with failover_vendor_id equal to primary_vendor_id."
  - id: ERR_REPROCESS_CODEC_UNCHANGED
    http: 422
    condition: "POST /reprocess-jobs whose target_codec_family equals the source ladder's codec_family."
  - id: ERR_RULE_REGION_NOT_LICENSED
    http: 422
    condition: "POST /drm-packages/{id}/entitlement-rules with a concrete region_code that no SCHEDULED or ACTIVE AvailabilityWindow of the package's Title covers."

  # ---- business_temporal (422 / 409) --------------------------------------
  - id: ERR_WINDOW_BOUNDS_INVALID
    http: 422
    condition: "window_start_at is greater than or equal to window_end_at on any interval-bearing create."
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "A new AvailabilityWindow or LiveEventReservation starts strictly before the current logical clock."
  - id: ERR_METRIC_WINDOW_IN_FUTURE
    http: 422
    condition: "POST /playback-metrics whose window_end_at is strictly after the current logical clock."
  - id: ERR_RESERVATION_OUTSIDE_LICENSE
    http: 422
    condition: "A LiveEventReservation window is not fully contained in any single SCHEDULED or ACTIVE AvailabilityWindow of its Title."
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "A new AvailabilityWindow overlaps a SCHEDULED or ACTIVE window of the same Title and region under half-open [start, end) comparison. Abutting windows do NOT trigger this."

  # ---- business_constraint (409 / 422) -----------------------------------
  - id: ERR_RUNG_SHAPE_INVALID
    http: 409
    condition: "A rungs array with fewer than 2 or more than 8 entries, a duplicate label, or a height_px that is not strictly increasing in stored array order."
  - id: ERR_DUPLICATE_ENTITLEMENT_RULE
    http: 409
    condition: "An EntitlementRule repeating an existing (region_code, subscription_tier, device_class_scope) triple within the same package."
  - id: ERR_REPROCESS_JOB_IN_FLIGHT
    http: 409
    condition: "POST /reprocess-jobs while another ReprocessJob of the same Title is QUEUED or RUNNING."
  - id: ERR_DUPLICATE_ROUTING_POLICY
    http: 409
    condition: "POST /routing-policies for a (title_id, region_code) pair that already has a policy."
  - id: ERR_NO_ELIGIBLE_VENDOR
    http: 422
    condition: "POST /routing-policies when calculations.routing_vendor_selection finds zero eligible CdnVendors; nothing is persisted."
  - id: ERR_REPROCESS_NO_SOURCE_ASSET
    http: 422
    condition: "POST /reprocess-jobs for a Title whose every MezzanineAsset is QC_REJECTED, or which owns none at all. Per the cascading note on §1.4 priority 11, this 422 is returned even when the named source_ladder_id is not LOCKED, because the priority-11 ladder-state arm is skipped while no eligible source asset exists."

  # ---- business_fiscal (422) ---------------------------------------------
  - id: ERR_VENDOR_CAPACITY_EXCEEDED
    http: 422
    condition: "held_gbps + requested reserved_gbps exceeds the charged vendor's committed_gbps on a reservation create or failover, or PATCH /cdn-vendors/{id} lowers committed_gbps below the vendor's current reserved_gbps. Exact equality never triggers this."
  - id: ERR_ENCODE_BUDGET_EXCEEDED
    http: 422
    condition: "POST /reprocess-jobs/{id}/run whose frozen cost_estimate_usd exceeds Title.encode_budget_remaining_usd, or PATCH /titles/{id} lowering encode_budget_usd below the already-committed total. Exact equality never triggers this."

# =============================================================================
# §1.7 RBAC Matrix  (role_model: peer_roles — each role owns a different slice
# of the pipeline; no role is a superset of another, and PlatformAdmin owns the
# reference/vendor tables rather than overriding the content roles)
# =============================================================================
roles:

  - name: ContentOps
    description: "Catalog and licensing desk: registers Titles and source masters, schedules availability windows, issues legal takedowns, and re-ingests corrected masters."
    identity: "opaque"
    exclusive_operations:
      - "POST /titles"
      - "PATCH /titles/{id}"
      - "POST /titles/{id}/takedown"
      - "POST /titles/{id}/availability-windows"
      - "POST /availability-windows/{id}/cancel"
      - "POST /mezzanine-assets"
      - "POST /mezzanine-assets/{id}/resubmit"
    shared_operations:
      - "POST /availability-sweep (with PlatformAdmin)"
      - "GET /titles/{id}, GET /titles, GET /titles/{id}/availability-windows, GET /titles/{id}/mezzanine-assets"
      - "GET /mezzanine-assets/{id}, GET /mezzanine-assets/{id}/qc-reports"
      - "GET /encoding-ladders/{id}, GET /encoding-ladders, GET /drm-packages/{id}, GET /drm-packages"
      - "GET /routing-policies/{id}, GET /routing-policies, GET /live-reservations/{id}, GET /live-reservations"
      - "GET /reprocess-jobs/{id}, GET /reprocess-jobs"

  - name: QcAnalyst
    description: "Quality-control desk: runs QC on ingested masters and requests remediation of failures. Cannot register or edit the masters it judges."
    identity: "opaque"
    exclusive_operations:
      - "POST /mezzanine-assets/{id}/qc-runs"
      - "POST /mezzanine-assets/{id}/remediation-request"
    shared_operations:
      - "GET /titles/{id}, GET /titles/{id}/mezzanine-assets"
      - "GET /mezzanine-assets/{id}, GET /mezzanine-assets/{id}/qc-reports"

  - name: EncodingEngineer
    description: "Encoding desk: authors, validates and locks encoding ladders, and drives catalog reprocessing jobs including their budget commitments."
    identity: "opaque"
    exclusive_operations:
      - "POST /encoding-ladders"
      - "POST /encoding-ladders/{id}/validate"
      - "POST /encoding-ladders/{id}/lock"
      - "POST /reprocess-jobs"
      - "POST /reprocess-jobs/{id}/run"
      - "POST /reprocess-jobs/{id}/abort"
    shared_operations:
      - "GET /titles/{id}, GET /titles, GET /titles/{id}/mezzanine-assets"
      - "GET /encoding-ladders/{id}, GET /encoding-ladders, GET /device-profiles"
      - "GET /reprocess-jobs/{id}, GET /reprocess-jobs"

  - name: DrmOperator
    description: "Rights and packaging desk: binds DRM packages to ladders, packages and revokes them, and authors immutable entitlement rules."
    identity: "opaque"
    exclusive_operations:
      - "POST /drm-packages"
      - "POST /drm-packages/{id}/package"
      - "POST /drm-packages/{id}/revoke"
      - "POST /drm-packages/{id}/entitlement-rules"
    shared_operations:
      - "POST /playback-entitlement-checks (with DeliveryEngineer)"
      - "GET /titles/{id}, GET /titles, GET /device-profiles"
      - "GET /encoding-ladders/{id}, GET /encoding-ladders"
      - "GET /drm-packages/{id}, GET /drm-packages, GET /drm-packages/{id}/entitlement-rules"

  - name: DeliveryEngineer
    description: "Delivery desk: owns CDN traffic steering, playback-quality ingestion and live-event capacity reservations."
    identity: "opaque"
    exclusive_operations:
      - "POST /routing-policies"
      - "POST /routing-policies/{id}/resteer"
      - "POST /live-reservations"
      - "POST /live-reservations/{id}/arm"
      - "POST /live-reservations/{id}/failover"
      - "POST /live-reservations/{id}/cancel"
    shared_operations:
      - "POST /playback-metrics (with PlatformAdmin)"
      - "POST /playback-entitlement-checks (with DrmOperator)"
      - "GET /titles/{id}, GET /titles, GET /device-profiles, GET /cdn-vendors/{id}"
      - "GET /drm-packages/{id}, GET /drm-packages, GET /drm-packages/{id}/entitlement-rules"
      - "GET /routing-policies/{id}, GET /routing-policies, GET /playback-metrics/{id}, GET /playback-metrics"
      - "GET /live-reservations/{id}, GET /live-reservations, GET /titles/{id}/availability-windows"

  - name: PlatformAdmin
    description: "Platform operator: owns the device compatibility matrix, the CDN vendor roster, the logical clock and the availability sweep. Deliberately NOT a superset of the content roles — it cannot create Titles, ladders, packages, policies or reservations."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /device-profiles"
      - "POST /cdn-vendors"
    shared_operations:
      - "POST /availability-sweep (with ContentOps)"
      - "POST /playback-metrics (with DeliveryEngineer)"
      - "PATCH /cdn-vendors/{id} (with VendorOperator)"
      - "GET /cdn-vendors/{id} (with DeliveryEngineer and VendorOperator)"
      - "GET /device-profiles, GET /titles/{id}, GET /titles"
      - "every GET listed for the other roles except the QC report list is also readable by PlatformAdmin"

  - name: VendorOperator
    description: "A CDN vendor's own operator, acting as one CdnVendor row. Reads and updates only its own vendor record and only the delivery data scoped to itself."
    identity: "entity_backed:CdnVendor"
    exclusive_operations: []
    shared_operations:
      - "GET /cdn-vendors/{id} where id == X-User-ID (with PlatformAdmin and DeliveryEngineer)"
      - "PATCH /cdn-vendors/{id} where id == X-User-ID (with PlatformAdmin)"
      - "GET /playback-metrics with vendor_id == X-User-ID, and GET /playback-metrics/{id} for its own windows"
      - "GET /live-reservations with primary_vendor_id, failover_vendor_id or active_vendor_id == X-User-ID"
      - "GET /routing-policies with primary_vendor_id or backup_vendor_id == X-User-ID"
    note: "X-User-ID MUST equal the id of an existing CdnVendor (ERR_VENDOR_IDENTITY_UNKNOWN, 403) and any out-of-scope target is ERR_VENDOR_SCOPE_VIOLATION (403)."
