        grounds:
          - state_machines.MethodologyDocument.transitions.DRAFT_to_PUBLISHED
          - endpoints.POST_methodology_documents_id_publish
        distinguishing_aspect: "The single MethodologyDocument transition fires under ComplianceOfficer even though NetworkEngineer authored the row, sets published_at from the logical clock and bumps version — and only then may runs and attestations cite the document."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; FIBER300 and MeasurementProbe PRB-1 exist; MTH-2026-A authored but still DRAFT."
