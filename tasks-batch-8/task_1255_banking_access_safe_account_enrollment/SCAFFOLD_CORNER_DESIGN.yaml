        claim_type: correct_result
        grounds: [calculations.certification_score]
        excluded_because:
          difficulty_instance: certification_score_mandatory_floor_branch
          rationale: "The mandatory-floor override (score in CONDITIONAL band but outcome FAIL) is asserted there."

