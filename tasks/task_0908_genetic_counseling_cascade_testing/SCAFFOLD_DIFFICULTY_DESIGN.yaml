  - rule_id: priority_pair_validation_conflict
    instances:
      - name: withdrawn_case_no_credits_state_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - state_machines.CounselingCase.INTAKE_to_WITHDRAWN
        distinguishing_aspect: "Category pair {state, business_fiscal}: booking a session on a WITHDRAWN case (state, priority 7) with covered_sessions=0 (fiscal, priority 12) returns ERR_CASE_INVALID_CLINICAL_STATE, not ERR_NO_SESSION_CREDITS."
        test_recipe:
          setup:
            - "Case with covered_sessions=0, then withdrawn"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam9", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC I", npi: "1000000009" }, as: ProgramAdmin, captures: { cid: $.data.id } }
