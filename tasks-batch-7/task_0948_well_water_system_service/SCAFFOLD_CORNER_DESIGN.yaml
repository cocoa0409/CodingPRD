      - name: corner_validation_clock_may_stand_still_but_never_move_backward
        claim_type: Violation to Error
        grounds: ["validations[priority=35]", "errors[ERR_CLOCK_BACKWARD]", "global_constants.DEFAULT_CLOCK_UTC"]
        distinguishing_aspect: |
          The clock rule is `to_iso8601 >= current`, so re-setting the clock to the
          instant it already holds succeeds and reports current_utc and previous_utc as
          the SAME instant, while a target one second earlier is refused 400
          ERR_CLOCK_BACKWARD and leaves the clock untouched. An implementation using a
          strict `>` test rejects the no-op set.
        test_recipe:
          setup: ["Logical clock advanced from its 2026-05-01T00:00:00Z default to 2026-06-01T09:00:00Z."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              captures: { prev0: $.data.previous_utc }
          trigger:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              captures: { cur_same: $.data.current_utc, prev_same: $.data.previous_utc }
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:59:59Z" }
              as: PlatformAdmin
              captures: { err_back: $.data.error_id }
            - call: "GET /water-service/_clock"
              payload: {}
              as: PlatformAdmin
              captures: { cur_after: $.data.current_utc }
          assert:
            - "${prev0} == 2026-05-01T00:00:00.000Z"
            - "${cur_same} == 2026-06-01T09:00:00.000Z"
            - "${prev_same} == 2026-06-01T09:00:00.000Z"
            - "${err_back} == ERR_CLOCK_BACKWARD"
            - "HTTP status is 400 on the backward set"
            - "${cur_after} == 2026-06-01T09:00:00.000Z"

      - name: corner_validation_inspection_validity_boundary_at_365_days
        claim_type: Temporal validation
        grounds: ["validations[priority=44]", "errors[ERR_INSPECTION_STALE]", "state_machines.Quote.SENT_to_APPROVED", "global_constants.INSPECTION_VALIDITY_DAYS"]
        distinguishing_aspect: |
          INSPECTION_VALIDITY_DAYS is right-closed at approval. Two SENT quotes cite
          the same inspection completed 2026-06-01T12:00:00Z: approving the first with
          the clock at exactly 2027-06-01T12:00:00Z (day 365) succeeds and latches
          approved_total_cents 22080, while approving the second one day later at
          2027-06-02T12:00:00Z (day 366) is refused 422 ERR_INSPECTION_STALE and leaves
          that quote SENT. Because the transition deliberately does NOT enforce
          QUOTE_VALIDITY_DAYS, the 30-day send window being long past is irrelevant -
          an implementation that expires the quote here returns ERR_QUOTE_INVALID_STATE
          instead. Quote arithmetic: parts round_half_up(5000*1.60) = 8000;
          labor MASTER STANDARD round_half_up(13500*60/60) = 13500;
          tax round_half_up(8000*7.25/100) = 580; total 22080.
        test_recipe:
          setup:
            - "One NONE-tier account with credit_hold false, one property, one well, one MASTER technician and one CONTROL part costing 5000 cents."
            - "One inspection COMPLETED at 2026-06-01T12:00:00Z, and two quotes of scope REPAIR citing it, each with one quantity-1 line, both PRICED and SENT at 2026-06-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Stale Inspection Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "si@corner.example" }
