      - name: comp_credit_control_credits_return_to_zero_residual_after_issue_then_reverse
        grounds:
          - calculations.credit_control_invariant
          - state_machines.CreditBatch.ISSUED_to_REVERSED
          - entities.CreditPathway.fields.credits_issued_total
          - entities.CreditPathway.fields.credits_outstanding
          - entities.CreditPathway.fields.credit_control_residual
        distinguishing_aspect: |
          A different conserved quantity: LCFS CREDIT UNITS rather than tonnes. Issuing
          36.111 credits raises credits_issued_total and credits_outstanding together, and
          the compensating reverse moves the same 36.111 into credits_reversed_total while
          credits_issued_total is deliberately NOT decremented - it counts everything that
          ever reached ISSUED - so credit_control_residual reads 0.000 both times; an
          implementation that decremented credits_issued_total on reversal would leave a
          residual of -36.111.
