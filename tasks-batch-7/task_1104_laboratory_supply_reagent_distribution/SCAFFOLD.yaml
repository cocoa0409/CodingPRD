    roles: [AccountManager]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["status SUSPENDED -> ACTIVE", "increments ConsignmentAgreement.version by 1"]
  - method: POST
    path: "/lab/consignment-agreements/{agreementId}/close"
    description: "Close an agreement (terminal)"
    roles: [AccountManager]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["status -> CLOSED", "increments ConsignmentAgreement.version by 1"]
  - method: POST
    path: "/lab/consignment-agreements/{agreementId}/consumption"
    description: "Record consumption against an agreement: bills the customer and may trigger replenishment"
    roles: [Customer, AccountManager]
    code: 201
