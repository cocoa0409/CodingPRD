scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: corner_product_missing_unit_price_returns_validation
        claim_type: Required Fields
        grounds: ["entities.Product.fields.unit_price_cents", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /products omitting the required unit_price_cents is rejected ERR_VALIDATION (422); no product is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "No Price", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE" }
              as: StoreOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_VALIDATION with HTTP 422."

      - name: corner_product_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{id} for a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StoreOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_NOT_FOUND with HTTP 404."

      - name: corner_product_computed_disclaimer_true
        claim_type: Computed Fields
        grounds: ["entities.Product.fields.requires_fda_disclaimer", "entities.Product.fields.dshea_claim_type"]
        distinguishing_aspect: "A product created with dshea_claim_type STRUCTURE_FUNCTION has computed requires_fda_disclaimer == true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "Disclaimer SKU", form: "TABLET", regimen_goals: ["IMMUNITY"], dshea_claim_type: "STRUCTURE_FUNCTION", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { pid: "$.data.id" }
          assert:
            - "Product.${pid}.requires_fda_disclaimer == true"

  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_resume_cancelled_subscription_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Subscription.PAUSED_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resuming (to ACTIVE) a CANCELLED subscription is rejected ERR_INVALID_STATE; CANCELLED is terminal."
        test_recipe:
          setup: ["A customer with a subscription that has been CANCELLED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm1@x.com", full_name: "SM One" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "SM SKU", form: "CAPSULE", regimen_goals: ["ENERGY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { product_id: "${prod_id}", quantity_per_cycle: 1, cadence_days: 30, first_ship_date: "2026-08-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/state"
              payload: { to_status: "CANCELLED" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/state"
              payload: { to_status: "ACTIVE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_INVALID_STATE with HTTP 409."

      - name: corner_fulfill_draft_order_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Order.PLACED_to_FULFILLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Fulfilling a DRAFT (never-placed) order is rejected ERR_INVALID_STATE; fulfil requires PLACED."
        test_recipe:
          setup: ["A customer with a DRAFT one-off order carrying one line (never placed)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm2@x.com", full_name: "SM Two" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "SM2 SKU", form: "CAPSULE", regimen_goals: ["ENERGY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: StoreOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_INVALID_STATE with HTTP 409."

      - name: corner_revoke_already_revoked_recommendation_invalid_state
        claim_type: idempotency
        grounds: ["state_machines.Recommendation.ISSUED_to_REVOKED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Revoking an already-REVOKED recommendation a second time is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["A customer, practitioner, practitioner-line product, and one recommendation already REVOKED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm3@x.com", full_name: "SM Three" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /practitioners"
              payload: { full_name: "Dr Cee", license_number: "LIC-3" }
              as: StoreOperator
              captures: { prac_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "SM3 SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], is_practitioner_line: true, dshea_claim_type: "NONE", unit_price_cents: 5000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /recommendations"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", expires_at: "2026-12-31T00:00:00Z", max_units: 3 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { rec_id: "$.data.id" }
            - call: "POST /recommendations/${rec_id}/revoke"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
          trigger:
            - call: "POST /recommendations/${rec_id}/revoke"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_INVALID_STATE with HTTP 409."

      - name: corner_recalled_lot_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.Lot.AVAILABLE_to_RECALLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Quarantining a RECALLED lot is rejected ERR_INVALID_STATE; RECALLED is terminal."
        test_recipe:
          setup: ["A product with a lot that has been RECALLED."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "SM4 SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "TL-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 5 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /lots/${lot_id}/state"
              payload: { to_status: "RECALLED", reason: "audit", severity: "CLASS_III" }
              as: StoreOperator
          trigger:
            - call: "POST /lots/${lot_id}/state"
              payload: { to_status: "QUARANTINED" }
              as: StoreOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_INVALID_STATE with HTTP 409."

  # =========================================================================
  - section: calculations
    instances:
      - name: corner_loyalty_tier_gold_boundary_inclusive
        claim_type: boundary_value
        grounds: ["calculations.loyalty_tier", "entities.Customer.fields.loyalty_tier"]
        distinguishing_aspect: "A customer with exactly 1000 lifetime points is GOLD (>= is inclusive at TIER_GOLD_THRESHOLD)."
        test_recipe:
          setup: ["A fresh customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ca1@x.com", full_name: "CA One" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /_inject/loyalty_state"
              payload: { customer_id: "${cust_id}", lifetime_points_earned: 1000 }
              as: StoreOperator
          assert:
            - "Customer.${cust_id}.loyalty_tier == GOLD"

      - name: corner_loyalty_tier_gold_boundary_below
        claim_type: boundary_value
        grounds: ["calculations.loyalty_tier", "entities.Customer.fields.loyalty_tier"]
        distinguishing_aspect: "A customer with 999 lifetime points is SILVER, not GOLD — the threshold is strictly at 1000."
        test_recipe:
          setup: ["A fresh customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ca2@x.com", full_name: "CA Two" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /_inject/loyalty_state"
              payload: { customer_id: "${cust_id}", lifetime_points_earned: 999 }
              as: StoreOperator
          assert:
            - "Customer.${cust_id}.loyalty_tier == SILVER"

      - name: corner_autoship_discount_cadence_mapping
        claim_type: constants_applied
        grounds: ["calculations.autoship_discount", "entities.Subscription.fields.autoship_discount_pct"]
        distinguishing_aspect: "A 90-day subscription gets autoship_discount_pct == 0.10 from AUTOSHIP_DISCOUNT[90]."
        test_recipe:
          setup: ["A customer and a product."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ca3@x.com", full_name: "CA Three" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Cad SKU", form: "CAPSULE", regimen_goals: ["ENERGY"], dshea_claim_type: "NONE", unit_price_cents: 2000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { product_id: "${prod_id}", quantity_per_cycle: 1, cadence_days: 90, first_ship_date: "2026-08-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
          assert:
            - "Subscription.${sub_id}.autoship_discount_pct == 0.10"

      - name: corner_fefo_earliest_expiry_first
        claim_type: correct_result
        grounds: ["calculations.fefo_allocation", "entities.Lot.fields.quantity_reserved"]
        distinguishing_aspect: "With a later-expiring lot created first and an earlier-expiring lot created second, a 3-unit line reserves 2 from the earlier-expiring lot and 1 from the later — allocation follows expiration_date ASC, not creation order."
        test_recipe:
          setup: ["A product with lot B (expires 2027-01-01, 10 units) created first and lot A (expires 2026-09-01, 2 units) created second; a customer with a 3-unit line placed."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ca4@x.com", full_name: "CA Four" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "FEFO SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "FEFO-B", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lotB: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "FEFO-A", expiration_date: "2026-09-01T00:00:00Z", quantity_received: 2 }
              as: StoreOperator
              captures: { lotA: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Lot.${lotA}.quantity_reserved == 2"
            - "Lot.${lotB}.quantity_reserved == 1"

  # =========================================================================
  - section: validations
    instances:
      - name: corner_dshea_disease_claim_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DSHEA_DISEASE_CLAIM]"]
        distinguishing_aspect: "Creating a product with dshea_claim_type DISEASE is rejected ERR_DSHEA_DISEASE_CLAIM (422); DSHEA prohibits disease claims."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "Cure SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "DISEASE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_DSHEA_DISEASE_CLAIM with HTTP 422."

      - name: corner_invalid_cadence_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_INVALID_CADENCE]"]
        distinguishing_aspect: "A subscription with cadence_days 45 (not in {30,60,90}) is rejected ERR_INVALID_CADENCE (422)."
        test_recipe:
          setup: ["A customer and a product."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "v1@x.com", full_name: "V One" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "V1 SKU", form: "CAPSULE", regimen_goals: ["SLEEP"], dshea_claim_type: "NONE", unit_price_cents: 2000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { product_id: "${prod_id}", quantity_per_cycle: 1, cadence_days: 45, first_ship_date: "2026-08-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_INVALID_CADENCE with HTTP 422."

      - name: corner_bundle_product_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_BUNDLE_PRODUCT_MISMATCH]"]
        distinguishing_aspect: "Adding a line with bundle_id whose product is not a component of that bundle is rejected ERR_BUNDLE_PRODUCT_MISMATCH (422)."
        test_recipe:
          setup: ["A customer; product X (in the bundle) and product Y (not in the bundle); a bundle whose components are [X]; a DRAFT order."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "v2@x.com", full_name: "V Two" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Bundle X", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prodX: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Bundle Y", form: "CAPSULE", regimen_goals: ["ENERGY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prodY: "$.data.id" }
            - call: "POST /bundles"
              payload: { name: "X Stack", component_product_ids: ["${prodX}"], discount_pct: 0.10 }
              as: StoreOperator
              captures: { bundle_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prodY}", quantity: 1, bundle_id: "${bundle_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_BUNDLE_PRODUCT_MISMATCH with HTTP 422."

      - name: corner_return_quantity_exceeds_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_RETURN_QUANTITY_EXCEEDS]"]
        distinguishing_aspect: "A return for 5 units against a line whose fulfilled quantity is 1 is rejected ERR_RETURN_QUANTITY_EXCEEDS (422)."
        test_recipe:
          setup: ["A customer; product; lot with 10 units; a one-off order with one line of quantity 1, PLACED and FULFILLED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "v3@x.com", full_name: "V Three" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "V3 SKU", form: "CAPSULE", regimen_goals: ["JOINT"], dshea_claim_type: "NONE", unit_price_cents: 3000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "V3-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data.id" }
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: StoreOperator
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${order_id}", order_line_id: "${line_id}", quantity: 5, reason: "UNWANTED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_RETURN_QUANTITY_EXCEEDS with HTTP 422."

      - name: corner_lot_not_sellable_when_quarantined
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_LOT_NOT_SELLABLE]"]
        distinguishing_aspect: "Placing an order for a product whose only lot is QUARANTINED (no AVAILABLE lot) is rejected ERR_LOT_NOT_SELLABLE (409)."
        test_recipe:
          setup: ["A customer; a product with a single lot that has been QUARANTINED; a DRAFT order with one line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "v4@x.com", full_name: "V Four" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "V4 SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "V4-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /lots/${lot_id}/state"
              payload: { to_status: "QUARANTINED" }
              as: StoreOperator
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_LOT_NOT_SELLABLE with HTTP 409."

  # =========================================================================
  - section: endpoints
    instances:
      - name: corner_list_product_lots_reverse_lookup
        claim_type: reverse_lookup
        grounds: ["entities.Lot.fields.product_id"]
        distinguishing_aspect: "GET /products/{id}/lots returns the 2 lots of that product (reverse lookup for Lot.product_id)."
        test_recipe:
          setup: ["A product with two lots."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "List SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "LS-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 5 }
              as: StoreOperator
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "LS-2", expiration_date: "2027-02-01T00:00:00Z", quantity_received: 5 }
              as: StoreOperator
          trigger:
            - call: "GET /products/${prod_id}/lots"
              payload: {}
              as: StoreOperator
          assert:
            - "response data is an array of length 2; meta total_count == 2."

      - name: corner_list_recommendations_filter_by_customer
        claim_type: reverse_lookup
        grounds: ["entities.Recommendation.fields.customer_id"]
        distinguishing_aspect: "GET /recommendations?customer_id={id} returns the one recommendation issued for that customer (reverse lookup for Recommendation.customer_id)."
        test_recipe:
          setup: ["A customer, practitioner, practitioner-line product, and one recommendation."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e1@x.com", full_name: "E One" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /practitioners"
              payload: { full_name: "Dr Dee", license_number: "LIC-4" }
              as: StoreOperator
              captures: { prac_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "E1 SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], is_practitioner_line: true, dshea_claim_type: "NONE", unit_price_cents: 5000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /recommendations"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", expires_at: "2026-12-31T00:00:00Z", max_units: 5 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { rec_id: "$.data.id" }
          trigger:
            - call: "GET /recommendations"
              payload: { customer_id: "${cust_id}" }
              as: StoreOperator
          assert:
            - "response data is an array of length 1 containing the recommendation ${rec_id}."

  # =========================================================================
  - section: rbac
    instances:
      - name: corner_customer_cannot_create_product_unauthorized
        claim_type: role_denied
        grounds: ["roles.Customer", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Customer calling POST /products (a StoreOperator-exclusive op) is rejected ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "r1@x.com", full_name: "R One" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /products"
              payload: { name: "Bad SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_UNAUTHORIZED with HTTP 403."

      - name: corner_customer_cannot_place_others_order_not_owner
        claim_type: ownership_denied
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Customer B placing Customer A's order is rejected ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Customer A owns a DRAFT one-off order with a line and available inventory; customer B is a separate customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ra@x.com", full_name: "Cust A" }
              as: StoreOperator
              captures: { custA: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "rb@x.com", full_name: "Cust B" }
              as: StoreOperator
              captures: { custB: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Own SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "OW-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${custA}"
              captures: { orderA: "$.data.id" }
            - call: "POST /orders/${orderA}/lines"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${custA}"
          trigger:
            - call: "POST /orders/${orderA}/place"
              payload: {}
              as: Customer
              as_user_id: "${custB}"
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_NOT_RESOURCE_OWNER with HTTP 403."

  # =========================================================================
  - section: cross_cutting
    instances:
      - name: corner_occ_stale_subscription_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[autoship-order-generate-stale-subscription]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second generate-order carrying the same (now stale) expected_subscription_version after the first generation advanced the version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A customer with an ACTIVE subscription (version 1); one generate-order already run with expected_subscription_version 1 (version now 2)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc1@x.com", full_name: "CC One" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "OCC SKU", form: "CAPSULE", regimen_goals: ["ENERGY"], dshea_claim_type: "NONE", unit_price_cents: 2000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { product_id: "${prod_id}", quantity_per_cycle: 1, cadence_days: 30, first_ship_date: "2026-08-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /subscriptions/${sub_id}/generate-order"
              payload: { expected_subscription_version: "${sub_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/generate-order"
              payload: { expected_subscription_version: "${sub_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "returns error_id ERR_STALE_VERSION with HTTP 412."

      - name: corner_subscription_version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: ["entities.Subscription.fields.version"]
        distinguishing_aspect: "A subscription starts at version 1 and a single pause mutation advances it to version 2."
        test_recipe:
          setup: ["A customer with a freshly created ACTIVE subscription (version 1)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc2@x.com", full_name: "CC Two" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Ver SKU", form: "CAPSULE", regimen_goals: ["SLEEP"], dshea_claim_type: "NONE", unit_price_cents: 2000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { product_id: "${prod_id}", quantity_per_cycle: 1, cadence_days: 60, first_ship_date: "2026-08-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/state"
              payload: { to_status: "PAUSED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { newv: "$.data.version" }
          assert:
            - "Subscription.${sub_id}.version == 2"

      - name: corner_lot_reserved_reconciled_after_place
        claim_type: derived_field_reconciliation
        grounds: ["entities.Lot.fields.quantity_reserved", "entities.Lot.fields.quantity_available"]
        distinguishing_aspect: "After placing a 3-unit line against a 10-unit lot, quantity_reserved == 3 and quantity_available == 7 (on_hand still 10)."
        test_recipe:
          setup: ["A customer; a product; a lot with 10 units; a DRAFT order with a 3-unit line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc3@x.com", full_name: "CC Three" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Rec SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "RE-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Lot.${lot_id}.quantity_reserved == 3"
            - "Lot.${lot_id}.quantity_available == 7"
            - "Lot.${lot_id}.quantity_on_hand == 10"

      - name: corner_expiry_sweep_marks_lot_expired
        claim_type: scheduled_actions
        grounds: ["state_machines.Lot.AVAILABLE_to_EXPIRED", "entities.Lot.fields.status"]
        distinguishing_aspect: "After advancing the clock past a lot's expiration_date and running the expiry sweep, the lot's status becomes EXPIRED."
        test_recipe:
          setup: ["A product with a lot expiring 2026-08-01; clock advanced to 2026-09-01."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Exp SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "EX-1", expiration_date: "2026-08-01T00:00:00Z", quantity_received: 5 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: StoreOperator
          trigger:
            - call: "POST /_jobs/run-expiry-sweep"
              payload: {}
              as: StoreOperator
          assert:
            - "Lot.${lot_id}.status == EXPIRED"

      - name: corner_expiry_sweep_marks_recommendation_expired
        claim_type: scheduled_actions
        grounds: ["state_machines.Recommendation.ISSUED_to_EXPIRED", "entities.Recommendation.fields.status"]
        distinguishing_aspect: "After advancing the clock past a recommendation's expires_at and running the sweep, the recommendation's status becomes EXPIRED."
        test_recipe:
          setup: ["A customer, practitioner, practitioner-line product; an ISSUED recommendation expiring 2026-08-01; clock advanced to 2026-09-01."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cc5@x.com", full_name: "CC Five" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /practitioners"
              payload: { full_name: "Dr Eff", license_number: "LIC-5" }
              as: StoreOperator
              captures: { prac_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "RxExp SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], is_practitioner_line: true, dshea_claim_type: "NONE", unit_price_cents: 5000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /recommendations"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", expires_at: "2026-08-01T00:00:00Z", max_units: 5 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { rec_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: StoreOperator
          trigger:
            - call: "POST /_jobs/run-expiry-sweep"
              payload: {}
              as: StoreOperator
          assert:
            - "Recommendation.${rec_id}.status == EXPIRED"

  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_recall_cascade_short_quantity_excluded
        claim_type: cross_entity_cascade
        grounds: ["state_machines.Lot.AVAILABLE_to_RECALLED", "entities.OrderLine.fields.short_quantity"]
        excluded_because:
          difficulty_instance: "transitive_cascade / recall_release_short_cascade"
          rationale: "The recall -> allocation-release -> short_quantity -> final_subtotal cascade is exercised end-to-end by the named §1.8 instance."

      - name: corner_customer_suspend_pauses_subscription_excluded
        claim_type: cross_entity_cascade
        grounds: ["state_machines.Customer.ACTIVE_to_SUSPENDED", "state_machines.Subscription.ACTIVE_to_PAUSED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / customer_suspend_pause_cancel_cascade"
          rationale: "The customer-suspend cascade to subscription pause and draft-autoship-order cancel is asserted by the named §1.8 instance."

  # =========================================================================
  - section: validations
    instances:
      - name: corner_place_practitioner_line_without_recommendation_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_PRACTITIONER_AUTH_REQUIRED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / safety_over_fiscal_conflict"
          rationale: "The ERR_PRACTITIONER_AUTH_REQUIRED failure path is asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: corner_place_suspended_customer_excluded
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CUSTOMER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / order_place_requires_customer_active"
          rationale: "The ERR_CUSTOMER_SUSPENDED failure path is asserted by the named §1.8 cross-entity instance."

  # =========================================================================
  - section: calculations
    instances:
      - name: corner_return_refund_variants_excluded
        claim_type: variant_divergence
        grounds: ["calculations.return_refund"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / return_refund_full_vs_unwanted"
          rationale: "Full-vs-unwanted refund divergence and restock behavior are asserted by the named §1.8 dual-variant instance."
