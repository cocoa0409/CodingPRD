  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_quote_version_on_line_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-line-create-stale-quote]
          - errors[ERR_STALE_QUOTE_VERSION]
          - validations[priority=32]
        distinguishing_aspect: "A repeated line addition is a legitimate operation (two identical lines are a valid two-line quote), so nothing but the version token can tell the client its money view is stale: the same payload is 201, then 412 with the reused token, then 201 again once the caller re-reads the version."
        test_recipe:
          setup:
            - "Model OPL-60-A at list 1250000"
            - "Distributor D-01 (PENDING_TRAINING is fine: authorization is only required at submit)"
            - "DRAFT quote q1 with no lines, version captured before the first write"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
