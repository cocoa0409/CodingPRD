        distinguishing_aspect: "Annual revision timing: a 2026 factor set cannot be finalized at 2026-12-31 (ERR_FACTOR_SET_FINALIZE_TOO_EARLY); at 2027-01-01T00:00:00Z exactly it succeeds."
