              payload: { program_id: "${prog_i_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 90, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_i1_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_i_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_i_id}", department: "ENGINEERING", headcount_target: 1, wave_start_date: "2026-09-10" }
              as: TalentManager
              captures: { plan_i_id: "$.data.id" }
            - call: "POST /pre-opening/training-sessions"
              payload: { program_id: "${prog_i_id}", title: "Engineering orientation", training_room_code: "TR-2", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z", capacity: 8, department: "ENGINEERING" }
              as: TalentManager
              captures: { sess_i_id: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_i_id}", full_name: "Chidi Okafor", hourly_rate_cents: 2500, scheduled_hours_per_day: 8, start_date: "2026-09-15", orientation_session_id: "${sess_i_id}" }
              as: TalentManager
              captures: { hire_i_id: "$.data.id" }
            - call: "POST /pre-opening/hires/${hire_i_id}/respond"
              payload: { decision: "ACCEPT" }
              as: TalentManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: TalentManager
            - call: "POST /pre-opening/training-sessions/${sess_i_id}/complete"
              payload: {}
              as: TalentManager
            - call: "GET /pre-opening/programs/${prog_i_id}/readiness"
              as: TalentManager
          trigger:
            - call: "POST /pre-opening/hires/${hire_i_id}/onboard"
              payload: {}
              as: TalentManager
          assert:
            - "Before the trigger the readiness read returned readiness_score == 0.2000 and staffing_ratio == 0.0"
            - "Link 1 — Hire.${hire_i_id}.state == \"ONBOARDED\" and onboarded_at == \"2026-09-20T00:00:00Z\""
            - "Link 2 — DepartmentHiringPlan.${plan_i_id}.onboarded_count == 1 and staffing_ratio == 1.0 and readiness_flag == \"READY\""
            - "Link 3 — PreOpeningProgram.${prog_i_id}.departments_ready_count == 1"
            - "Link 3 — PreOpeningProgram.${prog_i_id}.readiness_score == 0.4500"
            - "Link 3 — PreOpeningProgram.${prog_i_id}.readiness_posture == \"MOBILIZING\""
            - "Hire.${hire_i_id}.accrual_cents == 1800000"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booking_closed_state_outranks_room_night_ceiling_breach
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - errors[ERR_BOOKING_NOT_OPEN]
          - errors[ERR_ROOM_NIGHT_CEILING_EXCEEDED]
        distinguishing_aspect: |
          Category pair `state` (priority 7) vs `business_fiscal` (priority 14): a single request breaks
          both, and the response MUST be ERR_BOOKING_NOT_OPEN (409) rather than
          ERR_ROOM_NIGHT_CEILING_EXCEEDED (422).
        test_recipe:
          setup:
            - "Program with room_night_ceiling 10 and licensing_buffer_days 14; one 90-day CONSTRUCTION_COMPLETE milestone run to COMPLETE over 2026-09-01..2026-11-30, so schedule_state is CONSTRUCTION_COMPLETE and projected_opening_date_committed is 2026-12-14."
            - "Booking never opened, so commercial_state is still BOOKING_CLOSED and committed_room_nights is 0."
            - "Logical clock at 2026-11-30."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Saltmarsh Hotel", brand_code: "SMH", room_count: 100, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 10, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14 }
              as: ProgramDirector
              captures: { prog_j_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_j_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 90, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_j1_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_j_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_j1_id}/start"
              payload: {}
              as: ConstructionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_j1_id}/complete"
              payload: {}
              as: ConstructionManager
            - call: "GET /pre-opening/programs/${prog_j_id}"
              as: CommercialDirector
              captures: { prog_j_v: "$.data.version" }
          trigger:
            - call: "POST /pre-opening/reservation-blocks"
              payload: { program_id: "${prog_j_id}", account_name: "Saltmarsh Tours", arrival_date: "2026-12-01", night_count: 4, room_count: 19, rate_cents: 20000, expected_program_version: "${prog_j_v}" }
              as: CommercialDirector
              captures: { err_j: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == \"ERR_BOOKING_NOT_OPEN\""
            - "response data.error_id != \"ERR_ROOM_NIGHT_CEILING_EXCEEDED\" (76 room-nights against a ceiling of 10 is the lower-priority breach)"
            - "PreOpeningProgram.${prog_j_id}.committed_room_nights == 0"
            - "PreOpeningProgram.${prog_j_id}.contingency_liability_cents == 0"
            - "GET /pre-opening/programs/${prog_j_id}/reservation-blocks returns total_count == 0"

      - name: frozen_posture_outranks_delivery_window_violation
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_PROGRAM_FROZEN]
          - errors[ERR_DELIVERY_OUTSIDE_WINDOW]
          - state_machines.OseOrder.COMMITTED_to_STORED
        distinguishing_aspect: |
          A different category pair — `business_safety` (priority 9) vs `business_temporal`
          (priority 12): a receipt attempted on a FROZEN program outside the delivery window MUST
          return ERR_PROGRAM_FROZEN, never ERR_DELIVERY_OUTSIDE_WINDOW.
        test_recipe:
          setup:
            - "Program with a SETUP budget line authorized 1000000 and one COMMITTED OseOrder of 400000 whose delivery window is the half-open range 2026-10-01..2026-10-10."
            - "One CRITICAL punch list item OPEN, so open_critical_punch_count is 1 and readiness_posture is FROZEN."
            - "Logical clock at 2026-10-20, ten days after the window closed."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Ironbark Hotel", brand_code: "IBH", room_count: 140, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 300, contingency_liability_cap_cents: 90000000 }
              as: ProgramDirector
              captures: { prog_k_id: "$.data.id" }
            - call: "POST /pre-opening/budget-lines"
              payload: { program_id: "${prog_k_id}", category: "SETUP", authorized_cents: 1000000 }
              as: ProgramDirector
              captures: { bl_k_id: "$.data.id", bl_k_v: "$.data.version" }
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_k_id}", budget_line_id: "${bl_k_id}", description: "Guest room amenity kits", amount_cents: 400000, pallet_count: 6, delivery_window_start: "2026-10-01", delivery_window_end: "2026-10-10", expected_budget_line_version: "${bl_k_v}" }
              as: ProcurementManager
              captures: { ord_k_id: "$.data.id" }
            - call: "POST /pre-opening/punch-list-items"
              payload: { program_id: "${prog_k_id}", description: "Sprinkler main not pressure tested", severity: "CRITICAL" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { punch_k_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: ProcurementManager
          trigger:
            - call: "POST /pre-opening/ose-orders/${ord_k_id}/receive"
              payload: { stored_bay_code: "BAY-3" }
              as: ProcurementManager
              captures: { err_k: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == \"ERR_PROGRAM_FROZEN\""
            - "response data.error_id != \"ERR_DELIVERY_OUTSIDE_WINDOW\""
            - "PreOpeningProgram.${prog_k_id}.readiness_posture == \"FROZEN\" and open_critical_punch_count == 1"
            - "OseOrder.${ord_k_id}.state == \"COMMITTED\" and received_at == null and stored_bay_code == null"
            - "GET /pre-opening/programs/${prog_k_id}/budget-lines returns the SETUP line with committed_cents == 400000, spent_cents == 0, available_cents == 600000"

      - name: segregation_of_duties_outranks_certified_system_state
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_INVALID_SYSTEM_STATE]
          - state_machines.SystemImplementation.TESTING_to_CERTIFIED
        distinguishing_aspect: |
          A third distinct category pair — `auth` (priority 6) vs `state` (priority 7): the executor of
          the latest test run re-certifying an already-CERTIFIED system MUST receive
          ERR_SEGREGATION_OF_DUTIES (403), not ERR_INVALID_SYSTEM_STATE (409).
        test_recipe:
          setup:
            - "Program with one required PMS SystemImplementation."
            - "A single 40/40 test run recorded by user si-runner-1, then certified by user si-certifier-2, so the system is CERTIFIED and certified_by_user_id is si-certifier-2."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Northgate Hotel", brand_code: "NGH", room_count: 110, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 300, contingency_liability_cap_cents: 90000000 }
              as: ProgramDirector
              captures: { prog_l_id: "$.data.id" }
            - call: "POST /pre-opening/system-implementations"
              payload: { program_id: "${prog_l_id}", system_type: "PMS", is_required: true }
              as: SystemsIntegrator
              captures: { sys_l_id: "$.data.id" }
            - call: "POST /pre-opening/system-implementations/${sys_l_id}/test-runs"
              payload: { executed_at: "2026-09-10T10:00:00Z", cases_total: 40, cases_passed: 40, blocker_count: 0 }
              as: SystemsIntegrator
              as_user_id: "si-runner-1"
            - call: "POST /pre-opening/system-implementations/${sys_l_id}/certify"
              payload: {}
              as: SystemsIntegrator
              as_user_id: "si-certifier-2"
          trigger:
            - call: "POST /pre-opening/system-implementations/${sys_l_id}/certify"
              payload: {}
              as: SystemsIntegrator
              as_user_id: "si-runner-1"
              captures: { err_l: "$.data.error_id" }
          assert:
            - "HTTP status == 403"
            - "response data.error_id == \"ERR_SEGREGATION_OF_DUTIES\""
            - "response data.error_id != \"ERR_INVALID_SYSTEM_STATE\""
            - "SystemImplementation.${sys_l_id}.state == \"CERTIFIED\" and certified_by_user_id == \"si-certifier-2\""
            - "PreOpeningProgram.${prog_l_id}.certified_system_count == 1"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: certify_at_exact_ninety_five_percent_latest_pass_rate
        grounds:
          - calculations.system_test_aggregation
          - state_machines.SystemImplementation.TESTING_to_CERTIFIED
          - errors[ERR_SYSTEM_PASS_RATE_BELOW_THRESHOLD]
          - entities.SystemImplementation.fields.latest_pass_rate
        distinguishing_aspect: |
          Metric 1 — a ratio threshold reached through POST /pre-opening/system-implementations/{id}/certify:
          38/40 rounds to exactly 0.9500, and because CERTIFY_PASS_RATE_FLOOR is compared with `>=` the
          certification MUST succeed at the boundary rather than be rejected.
        test_recipe:
          setup:
            - "Program with one required PMS SystemImplementation."
            - "One test run executed by si-runner-1 with cases_total 40, cases_passed 38 and blocker_count 0, so latest_pass_rate is exactly 0.9500 and the system sits in TESTING."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Brightwater Hotel", brand_code: "BWH", room_count: 115, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 300, contingency_liability_cap_cents: 90000000 }
              as: ProgramDirector
              captures: { prog_m_id: "$.data.id" }
            - call: "POST /pre-opening/system-implementations"
              payload: { program_id: "${prog_m_id}", system_type: "PMS", is_required: true }
              as: SystemsIntegrator
              captures: { sys_m_id: "$.data.id" }
            - call: "POST /pre-opening/system-implementations/${sys_m_id}/test-runs"
              payload: { executed_at: "2026-09-10T10:00:00Z", cases_total: 40, cases_passed: 38, blocker_count: 0 }
              as: SystemsIntegrator
              as_user_id: "si-runner-1"
              captures: { run_m_rate: "$.data.pass_rate" }
          trigger:
            - call: "POST /pre-opening/system-implementations/${sys_m_id}/certify"
              payload: {}
              as: SystemsIntegrator
              as_user_id: "si-certifier-2"
          assert:
            - "The test-run response carried pass_rate == 0.95 and result == \"PASSED\""
            - "HTTP status == 200"
            - "SystemImplementation.${sys_m_id}.state == \"CERTIFIED\" and certified_by_user_id == \"si-certifier-2\""
            - "SystemImplementation.${sys_m_id}.latest_pass_rate == 0.95 and cumulative_pass_rate == 0.95 and test_run_count == 1"
            - "PreOpeningProgram.${prog_m_id}.certified_system_count == 1 and required_system_count == 1"

      - name: baseline_schedule_with_zero_milestones_rejected_as_empty_set
        grounds:
          - calculations.critical_path_schedule
          - errors[ERR_SCHEDULE_EMPTY]
          - state_machines.PreOpeningProgram.PLANNING_to_BASELINED
          - validations[priority=13]
        distinguishing_aspect: |
          A different metric on a different endpoint — the empty-collection edge of the milestone input
          set, reached through POST /pre-opening/programs/{id}/baseline-schedule: with zero milestones
          the topological pass has no max() to take, so it MUST return ERR_SCHEDULE_EMPTY and write no
          dates at all instead of defaulting project_finish to construction_start_date.
        test_recipe:
          setup:
            - "A freshly created program in PLANNING with no milestones, no dependency edges and every derived date still null."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Hollow Creek Lodge", brand_code: "HCL", room_count: 75, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14 }
              as: ProgramDirector
              captures: { prog_n_id: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/programs/${prog_n_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-baseline-1"
              captures: { err_n: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == \"ERR_SCHEDULE_EMPTY\""
            - "PreOpeningProgram.${prog_n_id}.schedule_state == \"PLANNING\""
            - "PreOpeningProgram.${prog_n_id}.projected_opening_date_committed == null and projected_opening_date_optimistic == null and projected_opening_date == null"
            - "PreOpeningProgram.${prog_n_id}.schedule_slip_days == 0 and critical_path_milestone_count == 0"
            - "PreOpeningProgram.${prog_n_id}.baselined_by_user_id == null"

      - name: storage_load_accepts_exact_capacity_and_rejects_one_more_pallet
        grounds:
          - calculations.storage_overlap_load
          - errors[ERR_STORAGE_CAPACITY_EXCEEDED]
          - entities.PreOpeningProgram.fields.storage_capacity_pallets
          - entities.OseOrder.fields.pallet_count
          - validations[priority=13]
        distinguishing_aspect: |
          A third metric on a third endpoint — an integer aggregate capacity on POST /pre-opening/ose-orders:
          overlapping windows summing to exactly storage_capacity_pallets 40 are accepted because the
          comparison is strict `>`, while the 41st pallet is rejected with ERR_STORAGE_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Program with storage_capacity_pallets 40 and a SETUP budget line authorized 10000000."
            - "Order A of 25 pallets over the half-open window 2026-12-01..2026-12-10 and order B of 15 pallets over 2026-12-05..2026-12-15, both COMMITTED — the windows overlap and the load is exactly 40 pallets."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Stonefield Hotel", brand_code: "SFH", room_count: 125, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 300, contingency_liability_cap_cents: 90000000 }
              as: ProgramDirector
              captures: { prog_o_id: "$.data.id" }
            - call: "POST /pre-opening/budget-lines"
              payload: { program_id: "${prog_o_id}", category: "SETUP", authorized_cents: 10000000 }
              as: ProgramDirector
              captures: { bl_o_id: "$.data.id", bl_o_v0: "$.data.version" }
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_o_id}", budget_line_id: "${bl_o_id}", description: "Case goods - guest rooms", amount_cents: 100000, pallet_count: 25, delivery_window_start: "2026-12-01", delivery_window_end: "2026-12-10", expected_budget_line_version: "${bl_o_v0}" }
              as: ProcurementManager
              captures: { ord_o_a_id: "$.data.id" }
            - call: "GET /pre-opening/programs/${prog_o_id}/budget-lines"
              as: ProcurementManager
              captures: { bl_o_v1: "$.data[0].version" }
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_o_id}", budget_line_id: "${bl_o_id}", description: "Soft goods - guest rooms", amount_cents: 100000, pallet_count: 15, delivery_window_start: "2026-12-05", delivery_window_end: "2026-12-15", expected_budget_line_version: "${bl_o_v1}" }
              as: ProcurementManager
              captures: { ord_o_b_id: "$.data.id" }
            - call: "GET /pre-opening/programs/${prog_o_id}/budget-lines"
              as: ProcurementManager
              captures: { bl_o_v2: "$.data[0].version" }
          trigger:
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_o_id}", budget_line_id: "${bl_o_id}", description: "Banquet trolleys", amount_cents: 50000, pallet_count: 1, delivery_window_start: "2026-12-06", delivery_window_end: "2026-12-08", expected_budget_line_version: "${bl_o_v2}" }
              as: ProcurementManager
              captures: { err_o: "$.data.error_id" }
          assert:
            - "Order B was accepted at exactly 25 + 15 == 40 pallets: OseOrder.${ord_o_b_id}.state == \"COMMITTED\" and pallet_count == 15"
            - "HTTP status == 422"
            - "response data.error_id == \"ERR_STORAGE_CAPACITY_EXCEEDED\" (25 + 15 + 1 == 41 > 40)"
            - "GET /pre-opening/ose-orders with program_id == ${prog_o_id} returns total_count == 2"
            - "GET /pre-opening/programs/${prog_o_id}/budget-lines returns the SETUP line with committed_cents == 200000 and available_cents == 9800000"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_submit_blocked_until_gating_milestone_complete
        grounds:
          - state_machines.PermitApplication.DRAFT_to_SUBMITTED
          - entities.PermitApplication.fields.gating_milestone_id
          - errors[ERR_GATING_MILESTONE_NOT_COMPLETE]
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair PermitApplication -> Milestone: the permit's DRAFT -> SUBMITTED transition is
          legal only while the Milestone named by gating_milestone_id is in state COMPLETE, so an
          IN_PROGRESS gating milestone yields ERR_GATING_MILESTONE_NOT_COMPLETE.
        test_recipe:
          setup:
            - "Program with one 60-day CONSTRUCTION_COMPLETE milestone, baselined."
            - "The milestone was started at clock 2026-09-01 and is still IN_PROGRESS."
            - "A DRAFT mandatory FOOD_SERVICE permit gated on that milestone."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Quarry Lane Hotel", brand_code: "QLH", room_count: 105, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 300, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14 }
              as: ProgramDirector
              captures: { prog_q_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_q_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 60, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_q1_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_q_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_q1_id}/start"
              payload: {}
              as: ConstructionManager
            - call: "POST /pre-opening/permit-applications"
              payload: { program_id: "${prog_q_id}", gating_milestone_id: "${m_q1_id}", permit_type: "FOOD_SERVICE", review_days: 21 }
              as: LicensingCoordinator
              captures: { permit_q_id: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/permit-applications/${permit_q_id}/submit"
              payload: {}
              as: LicensingCoordinator
              captures: { err_q: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == \"ERR_GATING_MILESTONE_NOT_COMPLETE\""
            - "PermitApplication.${permit_q_id}.state == \"DRAFT\" and submitted_at == null"
            - "Milestone.${m_q1_id}.state == \"IN_PROGRESS\""
            - "PreOpeningProgram.${prog_q_id}.schedule_state == \"BASELINED\" (the LICENSING hop never fires)"
            - "PreOpeningProgram.${prog_q_id}.issued_mandatory_permit_count == 0"

      - name: hire_onboard_blocked_until_orientation_session_completed
        grounds:
          - state_machines.Hire.ACCEPTED_to_ONBOARDED
          - entities.Hire.fields.orientation_session_id
          - errors[ERR_ORIENTATION_NOT_COMPLETED]
          - entities.TrainingSession.fields.state
        distinguishing_aspect: |
          A different entity pair — Hire -> TrainingSession: onboarding is legal only while the
          TrainingSession named by orientation_session_id is in state COMPLETED, so a SCHEDULED session
          yields ERR_ORIENTATION_NOT_COMPLETED even though the logical clock is already past both the
          session's ends_at and the hire's start_date.
        test_recipe:
          setup:
            - "Program with one 90-day milestone, baselined; no systems and no permits, so readiness_score is 0.2000."
            - "ENGINEERING plan (headcount_target 1) with one ACCEPTED hire enrolled in an orientation session that is still SCHEDULED."
            - "Logical clock at 2026-09-20, past the session's ends_at 2026-09-10T12:00:00Z and past the hire's start_date 2026-09-15."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Wrenfield Hotel", brand_code: "WFH", room_count: 118, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 300, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14 }
              as: ProgramDirector
              captures: { prog_s_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_s_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 90, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_s1_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_s_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_s_id}", department: "ENGINEERING", headcount_target: 1, wave_start_date: "2026-09-10" }
              as: TalentManager
              captures: { plan_s_id: "$.data.id" }
            - call: "POST /pre-opening/training-sessions"
              payload: { program_id: "${prog_s_id}", title: "Engineering orientation", training_room_code: "TR-2", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z", capacity: 8, department: "ENGINEERING" }
              as: TalentManager
              captures: { sess_s_id: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_s_id}", full_name: "Dara Nwosu", hourly_rate_cents: 2500, scheduled_hours_per_day: 8, start_date: "2026-09-15", orientation_session_id: "${sess_s_id}" }
              as: TalentManager
              captures: { hire_s_id: "$.data.id" }
            - call: "POST /pre-opening/hires/${hire_s_id}/respond"
              payload: { decision: "ACCEPT" }
              as: TalentManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: TalentManager
          trigger:
            - call: "POST /pre-opening/hires/${hire_s_id}/onboard"
              payload: {}
              as: TalentManager
              captures: { err_s: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == \"ERR_ORIENTATION_NOT_COMPLETED\""
            - "Hire.${hire_s_id}.state == \"ACCEPTED\" and onboarded_at == null"
            - "TrainingSession.${sess_s_id}.state == \"SCHEDULED\" and enrolled_count == 1"
            - "DepartmentHiringPlan.${plan_s_id}.onboarded_count == 0 and staffing_ratio == 0.0 and readiness_flag == \"NOT_READY\""
            - "PreOpeningProgram.${prog_s_id}.departments_ready_count == 0 and readiness_score == 0.2000"

      - name: block_guarantee_requires_program_commercial_state_booking_open
        grounds:
          - state_machines.ReservationBlock.ACCEPTED_to_GUARANTEED
          - entities.PreOpeningProgram.fields.commercial_state
          - errors[ERR_BOOKING_NOT_OPEN]
          - calculations.contingency_liability
        distinguishing_aspect: |
          A third entity pair — ReservationBlock -> PreOpeningProgram: the block's ACCEPTED ->
          GUARANTEED transition depends on the PARENT's commercial_state being BOOKING_OPEN, so a
          manual suspension after the block was accepted makes the guarantee fail with
          ERR_BOOKING_NOT_OPEN and leaves contingency_cents free of the guarantee penalty.
        test_recipe:
          setup:
            - "Program with relocation_rate_cents 25000, guarantee_penalty_cents 150000, licensing_buffer_days 14; one 90-day milestone run to COMPLETE over 2026-09-01..2026-11-30, so projected_opening_date_committed is 2026-12-14."
            - "Booking was opened, an ACCEPTED block of 19 rooms x 4 nights arriving 2026-12-01 was created (contingency_cents 2052000), then booking was suspended manually."
            - "Logical clock at 2026-11-30."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Elmswick Hotel", brand_code: "EWH", room_count: 190, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 500, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14 }
              as: ProgramDirector
              captures: { prog_t_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_t_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 90, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_t1_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_t_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_t1_id}/start"
              payload: {}
              as: ConstructionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_t1_id}/complete"
              payload: {}
              as: ConstructionManager
            - call: "POST /pre-opening/programs/${prog_t_id}/open-booking"
              payload: {}
              as: CommercialDirector
            - call: "GET /pre-opening/programs/${prog_t_id}"
              as: CommercialDirector
              captures: { prog_t_v: "$.data.version" }
            - call: "POST /pre-opening/reservation-blocks"
              payload: { program_id: "${prog_t_id}", account_name: "Elmswick Alumni Weekend", arrival_date: "2026-12-01", night_count: 4, room_count: 19, rate_cents: 20000, expected_program_version: "${prog_t_v}" }
              as: CommercialDirector
              captures: { blk_t_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_t_id}/suspend-booking"
              payload: { reason: "Rate parity audit" }
              as: CommercialDirector
          trigger:
            - call: "POST /pre-opening/reservation-blocks/${blk_t_id}/guarantee"
              payload: {}
              as: CommercialDirector
              captures: { err_t: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == \"ERR_BOOKING_NOT_OPEN\""
            - "ReservationBlock.${blk_t_id}.state == \"ACCEPTED\""
            - "ReservationBlock.${blk_t_id}.contingency_cents == 2052000 (no guarantee_penalty_cents added)"
            - "PreOpeningProgram.${prog_t_id}.contingency_liability_cents == 2052000"
            - "PreOpeningProgram.${prog_t_id}.commercial_state == \"BOOKING_SUSPENDED\" and readiness_posture == \"MOBILIZING\""

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: training_room_rejects_session_inside_thirty_minute_turnover_buffer
        grounds:
          - calculations.training_room_occupancy
          - errors[ERR_TRAINING_ROOM_CONFLICT]
          - entities.TrainingSession.fields.training_room_code
          - validations[priority=12]
        distinguishing_aspect: |
          Interval semantics 1 — single-occupancy exclusion on the TrainingSession.training_room_code
          resource with a 30-minute turnover buffer applied to both edges of the candidate: a session
          starting exactly when the incumbent ends (12:00:00Z against a 09:00-12:00 booking) collides
          because 11:30 < 12:00 and 09:00 < 14:30, and no aggregate capacity can absorb it.
        test_recipe:
          setup:
            - "Program in PLANNING with one SCHEDULED session in room TR-1 from 2026-09-10T09:00:00Z to 2026-09-10T12:00:00Z, capacity 10, department ALL."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Halden Court Hotel", brand_code: "HCH", room_count: 100, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 300, contingency_liability_cap_cents: 90000000 }
              as: ProgramDirector
              captures: { prog_u_id: "$.data.id" }
            - call: "POST /pre-opening/training-sessions"
              payload: { program_id: "${prog_u_id}", title: "Brand standards - morning", training_room_code: "TR-1", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z", capacity: 10, department: "ALL" }
              as: TalentManager
              captures: { sess_u_a_id: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/training-sessions"
              payload: { program_id: "${prog_u_id}", title: "Brand standards - afternoon", training_room_code: "TR-1", starts_at: "2026-09-10T12:00:00Z", ends_at: "2026-09-10T14:00:00Z", capacity: 10, department: "ALL" }
              as: TalentManager
              captures: { err_u: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == \"ERR_TRAINING_ROOM_CONFLICT\""
            - "GET /pre-opening/programs/${prog_u_id}/training-sessions with training_room_code == \"TR-1\" returns total_count == 1"
            - "TrainingSession.${sess_u_a_id}.state == \"SCHEDULED\" and enrolled_count == 0"

      - name: storage_load_ignores_touching_delivery_windows
        grounds:
          - calculations.storage_overlap_load
          - entities.OseOrder.fields.delivery_window_start
          - entities.OseOrder.fields.delivery_window_end
          - entities.PreOpeningProgram.fields.storage_capacity_pallets
        distinguishing_aspect: |
          Interval semantics 2 on a different resource (PreOpeningProgram.storage_capacity_pallets):
          half-open day intervals with an AGGREGATE capacity where adjacency is explicitly not overlap,
          so two 40-pallet orders on the touching windows 2026-12-01..2026-12-10 and
          2026-12-10..2026-12-20 both fit a 40-pallet room — the exact configuration the buffered
          single-occupancy training-room rule would reject.
        test_recipe:
          setup:
            - "Program with storage_capacity_pallets 40 and a SETUP budget line authorized 10000000."
            - "One COMMITTED order of 40 pallets over the half-open window 2026-12-01..2026-12-10, so the room is exactly full for those days."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Wexley Hotel", brand_code: "WXH", room_count: 128, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 300, contingency_liability_cap_cents: 90000000 }
              as: ProgramDirector
              captures: { prog_v_id: "$.data.id" }
            - call: "POST /pre-opening/budget-lines"
              payload: { program_id: "${prog_v_id}", category: "SETUP", authorized_cents: 10000000 }
              as: ProgramDirector
              captures: { bl_v_id: "$.data.id", bl_v_v0: "$.data.version" }
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_v_id}", budget_line_id: "${bl_v_id}", description: "Banquet chairs - wave 1", amount_cents: 100000, pallet_count: 40, delivery_window_start: "2026-12-01", delivery_window_end: "2026-12-10", expected_budget_line_version: "${bl_v_v0}" }
              as: ProcurementManager
              captures: { ord_v_a_id: "$.data.id" }
            - call: "GET /pre-opening/programs/${prog_v_id}/budget-lines"
              as: ProcurementManager
              captures: { bl_v_v1: "$.data[0].version" }
          trigger:
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_v_id}", budget_line_id: "${bl_v_id}", description: "Banquet chairs - wave 2", amount_cents: 100000, pallet_count: 40, delivery_window_start: "2026-12-10", delivery_window_end: "2026-12-20", expected_budget_line_version: "${bl_v_v1}" }
              as: ProcurementManager
              captures: { ord_v_b_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "OseOrder.${ord_v_b_id}.state == \"COMMITTED\" and pallet_count == 40 and delivery_window_start == \"2026-12-10\""
            - "OseOrder.${ord_v_a_id}.delivery_window_end == \"2026-12-10\" equals the new order's delivery_window_start, and the pair is NOT treated as overlapping"
            - "GET /pre-opening/ose-orders with program_id == ${prog_v_id} returns total_count == 2"
            - "GET /pre-opening/programs/${prog_v_id}/budget-lines returns the SETUP line with committed_cents == 200000 and available_cents == 9800000"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ose_order_cancel_restores_budget_line_without_authorized_drift
        grounds:
          - state_machines.OseOrder.COMMITTED_to_CANCELLED
          - entities.BudgetLine.fields.authorized_cents
          - entities.BudgetLine.fields.committed_cents
          - entities.BudgetLine.fields.available_cents
          - calculations.cost_at_completion
        distinguishing_aspect: |
          Conserved quantity 1 is MONEY IN CENTS on the BudgetLine:
          authorized_cents == committed_cents + spent_cents + available_cents must hold at 1000000
          both before and after the commit/cancel pair, and authorized_cents must never be touched by
          order activity.
        test_recipe:
          setup:
            - "Program with a SETUP budget line authorized 1000000 (committed 0, spent 0, available 1000000)."
            - "One COMMITTED order of 400000 charged to that line, so committed_cents is 400000 and available_cents is 600000."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Barrow Point Hotel", brand_code: "BPH", room_count: 112, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 300, contingency_liability_cap_cents: 90000000 }
              as: ProgramDirector
              captures: { prog_w_id: "$.data.id" }
            - call: "POST /pre-opening/budget-lines"
              payload: { program_id: "${prog_w_id}", category: "SETUP", authorized_cents: 1000000 }
              as: ProgramDirector
              captures: { bl_w_id: "$.data.id", bl_w_v0: "$.data.version" }
            - call: "POST /pre-opening/ose-orders"
              payload: { program_id: "${prog_w_id}", budget_line_id: "${bl_w_id}", description: "Housekeeping carts", amount_cents: 400000, pallet_count: 4, delivery_window_start: "2026-10-01", delivery_window_end: "2026-10-15", expected_budget_line_version: "${bl_w_v0}" }
              as: ProcurementManager
              captures: { ord_w_id: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/ose-orders/${ord_w_id}/cancel"
              payload: { reason: "Supplier discontinued the SKU" }
              as: ProcurementManager
          assert:
            - "OseOrder.${ord_w_id}.state == \"CANCELLED\" and received_at == null"
            - "GET /pre-opening/programs/${prog_w_id}/budget-lines returns the SETUP line with authorized_cents == 1000000, committed_cents == 0, spent_cents == 0, available_cents == 1000000"
            - "Invariant: authorized_cents == committed_cents + spent_cents + available_cents == 1000000 (no drift after the commit/cancel pair)"
            - "PreOpeningProgram.${prog_w_id}.cost_at_completion_commitment_cents == 0 and cost_at_completion_accrual_cents == 0"

      - name: block_cancellation_restores_committed_room_nights_and_zero_liability
        grounds:
          - state_machines.ReservationBlock.AT_RISK_to_CANCELLED
          - entities.PreOpeningProgram.fields.committed_room_nights
          - entities.PreOpeningProgram.fields.contingency_liability_cents
          - calculations.contingency_liability
          - state_machines.PunchListItem.OPEN_to_READY_FOR_VERIFICATION
        distinguishing_aspect: |
          A different conserved quantity — HELD ROOM-NIGHTS of inventory, not cents:
          committed_room_nights must return to exactly 0 (its pre-create value) after the
          accept/cancel pair while the block's immutable room_nights 76 and revenue_cents 1520000 stay
          on the row, and contingency_liability_cents must fall back to 0.
        test_recipe:
          setup:
            - "Program with relocation_rate_cents 25000, room_night_ceiling 500 and licensing_buffer_days 14; one 90-day milestone run to COMPLETE over 2026-09-01..2026-11-30, so projected_opening_date_committed is 2026-12-14 and committed_room_nights is 0."
            - "Booking open with one ACCEPTED block of 19 rooms x 4 nights arriving 2026-12-01, so committed_room_nights is 76 and contingency_liability_cents is 2052000."
            - "A CRITICAL punch item then froze the program, which suspended booking and drove the block to AT_RISK with at_risk_reason CRITICAL_PUNCH_OPEN."
            - "Logical clock at 2026-11-30."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Thornbury Hotel", brand_code: "TBH", room_count: 205, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 500, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14 }
              as: ProgramDirector
              captures: { prog_x_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_x_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 90, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_x1_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_x_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_x1_id}/start"
              payload: {}
              as: ConstructionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_x1_id}/complete"
              payload: {}
              as: ConstructionManager
            - call: "POST /pre-opening/programs/${prog_x_id}/open-booking"
              payload: {}
              as: CommercialDirector
            - call: "GET /pre-opening/programs/${prog_x_id}"
              as: CommercialDirector
              captures: { prog_x_v: "$.data.version" }
            - call: "POST /pre-opening/reservation-blocks"
              payload: { program_id: "${prog_x_id}", account_name: "Thornbury Wedding Party", arrival_date: "2026-12-01", night_count: 4, room_count: 19, rate_cents: 20000, expected_program_version: "${prog_x_v}" }
              as: CommercialDirector
              captures: { blk_x_id: "$.data.id" }
            - call: "POST /pre-opening/punch-list-items"
              payload: { program_id: "${prog_x_id}", description: "Elevator machine room fire rating incomplete", severity: "CRITICAL" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { punch_x_id: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/reservation-blocks/${blk_x_id}/resolve-contingency"
              payload: { resolution: "CANCEL" }
              as: CommercialDirector
          assert:
            - "Before the trigger the block was AT_RISK with at_risk_reason == \"CRITICAL_PUNCH_OPEN\" and PreOpeningProgram.${prog_x_id}.committed_room_nights == 76"
            - "ReservationBlock.${blk_x_id}.state == \"CANCELLED\" and contingency_cents == 0"
            - "ReservationBlock.${blk_x_id}.room_nights == 76 and revenue_cents == 1520000 (immutable computed fields survive the compensation)"
            - "PreOpeningProgram.${prog_x_id}.committed_room_nights == 0 (exactly the pre-create value)"
            - "PreOpeningProgram.${prog_x_id}.contingency_liability_cents == 0"
            - "PreOpeningProgram.${prog_x_id}.readiness_posture == \"FROZEN\" and commercial_state == \"BOOKING_SUSPENDED\" (the punch item, not the block, holds the freeze)"

      - name: system_decertification_restores_certified_count_and_clears_certifier
        grounds:
          - state_machines.SystemImplementation.CERTIFIED_to_TESTING
          - entities.SystemImplementation.fields.certified_by_user_id
          - entities.PreOpeningProgram.fields.certified_system_count
          - calculations.system_test_aggregation
          - calculations.readiness_posture
        distinguishing_aspect: |
          A third conserved quantity — the CERTIFIED-SYSTEM COUNT parity between
          certified_system_count and required_system_count: appending a failing run compensates the
          certify transition exactly, returning certified_system_count to 0, nulling both
          certified_by_user_id and certified_at, and dropping readiness_score back to 0.2000 while the
          append-only run log grows to 2.
        test_recipe:
          setup:
            - "Program with one required PMS SystemImplementation and no milestones, plans or permits."
            - "A 40/40 run by si-runner-1 certified by si-certifier-2, so the system is CERTIFIED, certified_system_count is 1 and readiness_score is 0.5000."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Calder Wharf Hotel", brand_code: "CWH", room_count: 98, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 60, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 300, contingency_liability_cap_cents: 90000000 }
              as: ProgramDirector
              captures: { prog_y_id: "$.data.id" }
            - call: "POST /pre-opening/system-implementations"
              payload: { program_id: "${prog_y_id}", system_type: "PMS", is_required: true }
              as: SystemsIntegrator
              captures: { sys_y_id: "$.data.id" }
            - call: "POST /pre-opening/system-implementations/${sys_y_id}/test-runs"
              payload: { executed_at: "2026-09-10T10:00:00Z", cases_total: 40, cases_passed: 40, blocker_count: 0 }
              as: SystemsIntegrator
              as_user_id: "si-runner-1"
            - call: "POST /pre-opening/system-implementations/${sys_y_id}/certify"
              payload: {}
              as: SystemsIntegrator
              as_user_id: "si-certifier-2"
          trigger:
            - call: "POST /pre-opening/system-implementations/${sys_y_id}/test-runs"
              payload: { executed_at: "2026-09-18T10:00:00Z", cases_total: 20, cases_passed: 18, blocker_count: 1 }
              as: SystemsIntegrator
              as_user_id: "si-runner-1"
              captures: { run_y_b_id: "$.data.system_implementation_id" }
          assert:
            - "SystemImplementation.${sys_y_id}.state == \"TESTING\""
            - "SystemImplementation.${sys_y_id}.certified_by_user_id == null and certified_at == null"
            - "SystemImplementation.${sys_y_id}.latest_pass_rate == 0.9 and open_blocker_count == 1 and test_run_count == 2"
            - "SystemImplementation.${sys_y_id}.cumulative_pass_rate == 0.9667 (58 of 60 pooled cases)"
            - "The new run's result == \"FAILED\" (pass_rate 0.9 below 0.95 and one blocker)"
            - "PreOpeningProgram.${prog_y_id}.certified_system_count == 0 and required_system_count == 1"
            - "PreOpeningProgram.${prog_y_id}.readiness_score == 0.2000 and readiness_posture == \"MOBILIZING\""
