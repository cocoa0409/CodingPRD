              payload: { class_number: 103, name: "Open Jumper 1.00m", jump_height_cm: 100, entry_fee_cents: 25000, class_share_bp: 1000, max_entries: 30 }
              as: ShowSecretary
              captures: { class103_id: $.data.id }
            - call: "POST /shows/${show_id}/license-submission"
              payload: {}
              as: ShowSecretary
            - call: "POST /shows/${show_id}/license-decision"
              payload: { decision: "APPROVE" }
