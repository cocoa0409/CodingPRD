            - "AffordableUnit.${u_id}.occupancy_status == OCCUPIED"

      - name: cure_extension_frozen_from_base_penalty_not_final_penalty
        mode: "(c) circular-looking dependency broken by a pinned evaluation order"
        grounds:
          - calculations.cure_penalty_and_deadline
          - calculations.monitoring_findings
          - state_machines.MonitoringReview.state
          - entities.MonitoringReview.fields.cure_extension_days
          - entities.MonitoringReview.fields.penalty_final_cents
        distinguishing_aspect: |
          Mode (c). The penalty depends on how long the cure takes, and the time allowed to
          cure depends on the penalty — a circular dependency broken by pinning step 1 at
          months == 1. At issue time penalty_at_base_cents is 88384, which is below the
          100000 extension threshold, so cure_extension_days is 0 and cure_deadline is
          2027-03-31. The cure lands 35 days later on 2027-04-05, so months is 2 and
          penalty_final_cents is 113384 — now ABOVE the threshold — yet cure_extension_days
          and cure_deadline must not move, so the submission is late and the review
          ESCALATES. An implementation that re-derives the extension from
          penalty_final_cents would grant 15 extra days, put the deadline at 2027-04-15 and
          take the CURE_SUBMITTED branch instead.
        test_recipe:
          setup:
