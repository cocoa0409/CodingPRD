# =============================================================================
# Aircraft Management & Owner Services — benchmark seed tables
# =============================================================================

scenario: |
  Aircraft Management & Owner Services (Jet Aviation style manager): owner
  budget & monthly operating statement, crew hiring/training & duty scheduling,
  maintenance program enrollment & event forecasting, charter revenue offset &
  owner approval of trips, insurance & regulatory compliance filing, hangar/fuel
  contract negotiation, owner-use vs charter-use tax allocation, management
  agreement termination & records handover

domain_name: aircraft-management-owner-services
api_prefix: /

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the aircraft owner (person or entity)" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email for owner communications" }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the owner who holds title to this airframe" }
      - { name: tail_number, type: string, source: input, description: "Registration tail number; unique across all aircraft" }
      - { name: model, type: string, source: input, description: "Aircraft model designation (e.g. G650)" }
      - { name: home_base_icao, type: string, source: input, description: "ICAO code of home base airport" }
      - { name: total_time_hours, type: number, source: computed, default: 0.0, description: "Read-only airframe hours = sum of block_hours_actual over TripRequests with status COMPLETED" }

  - name: ManagementAgreement
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; owner party to the agreement" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; exactly one agreement in PENDING/ACTIVE/TERMINATION_PENDING/HANDOVER_IN_PROGRESS may exist per aircraft" }
      - { name: monthly_management_fee_cents, type: integer, source: input, description: "Flat monthly management fee billed on each monthly statement" }
      - { name: variable_fee_pct, type: number, source: input, description: "Fraction (e.g. 0.10) of the pre-fee accrual subtotal added to the monthly fee" }
      - { name: charter_owner_share_pct, type: number, source: input, description: "Fraction (e.g. 0.85) of net charter revenue credited to the owner" }
      - { name: tax_allocation_method, type: enum, source: input, description: "FLIGHT_HOURS | TRIP_LEGS; method used to split MIXED expenses" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ACTIVE | TERMINATION_PENDING | HANDOVER_IN_PROGRESS | TERMINATED" }
      - { name: notice_given_at, type: datetime, source: system, description: "Timestamp when termination notice was given; null until then" }
      - { name: records_total, type: integer, source: system, default: 0, description: "Snapshot count of MaintenanceEvent + ComplianceFiling records for the aircraft taken at termination notice" }
      - { name: records_released, type: integer, source: system, default: 0, description: "Count of in-scope records with handed_over_at set" }

  - name: OperatingBudget
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: fiscal_year, type: integer, source: input, description: "Four-digit fiscal year; at most one budget per (aircraft_id, fiscal_year)" }
      - { name: fuel_cents, type: integer, source: input, description: "Annual budgeted fuel cost" }
      - { name: maintenance_cents, type: integer, source: input, description: "Annual budgeted maintenance cost" }
      - { name: crew_cents, type: integer, source: input, description: "Annual budgeted crew cost" }
      - { name: hangar_cents, type: integer, source: input, description: "Annual budgeted hangar cost" }
      - { name: insurance_cents, type: integer, source: input, description: "Annual budgeted insurance cost" }
      - { name: other_cents, type: integer, source: input, description: "Annual budgeted other cost" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Owner-supplied reason recorded at rejection; null otherwise" }

  - name: Expense
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: statement_id, type: string, source: system, description: "FK -> MonthlyStatement.id; set when the expense is locked onto a certified statement; null while POSTED" }
      - { name: trip_id, type: string, source: input, description: "FK -> TripRequest.id; required when category == CHARTER_DIRECT, otherwise must be omitted/null" }
      - { name: category, type: enum, source: input, description: "FUEL | CREW | MAINTENANCE | HANGAR | INSURANCE | PROGRAM_ACCRUAL | CHARTER_DIRECT | OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Cost amount; must be > 0" }
      - { name: service_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the cost was incurred; drives accrual-basis inclusion" }
      - { name: paid_date, type: string, source: input, description: "ISO date the cost was paid; drives cash-basis inclusion; null = unpaid" }
      - { name: vendor_name, type: string, source: input, description: "Vendor or payee name" }
      - { name: tax_use, type: enum, source: input, description: "OWNER_USE | CHARTER_USE | MIXED; MIXED lines are split by the agreement tax_allocation_method" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | BILLED | VOID" }

  - name: MonthlyStatement
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: system, description: "FK -> Aircraft.id" }
      - { name: period, type: string, source: input, description: "Statement month in YYYY-MM format; period covers [YYYY-MM-01, first day of next month)" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the AccountExecutive who generated the statement" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceController who certified; null until certified" }
      - { name: accrual_total_cents, type: integer, source: computed, description: "Sum of amount_cents over non-VOID expenses of the aircraft whose service_date falls in period" }
      - { name: cash_total_cents, type: integer, source: computed, description: "Sum of amount_cents over non-VOID expenses of the aircraft whose paid_date is non-null and falls in period" }
      - { name: management_fee_cents, type: integer, source: computed, description: "monthly_management_fee_cents + round_half_up(variable_fee_pct x accrual_total_cents)" }
      - { name: charter_offset_cents, type: integer, source: computed, description: "Sum of owner_credit_cents over CHARTER trips of the aircraft COMPLETED with completion timestamp in period" }
      - { name: budget_variance_cents, type: integer, source: computed, description: "accrual_total_cents minus one-twelfth of the APPROVED budget annual total (round_half_up); null when no APPROVED budget covers the period's fiscal year" }
      - { name: mixed_owner_share_cents, type: integer, source: computed, description: "Owner-allocated share of in-period MIXED expenses per tax_allocation_method; per-line round_half_up then sum" }
      - { name: mixed_charter_share_cents, type: integer, source: computed, description: "Charter-allocated share = per-line (amount_cents - owner share), summed" }
      - { name: tax_method_used, type: enum, source: system, description: "FLIGHT_HOURS | TRIP_LEGS; tax allocation method in force on the agreement at generation time" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | CERTIFIED | DELIVERED" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; crew are dedicated to one managed aircraft" }
      - { name: full_name, type: string, source: input, description: "Crew member legal name" }
      - { name: crew_role, type: enum, source: input, description: "CAPTAIN | FIRST_OFFICER" }
      - { name: hire_date, type: string, source: input, description: "ISO date of hire" }
      - { name: status, type: enum, source: system, default: HIRED, description: "HIRED | IN_TRAINING | QUALIFIED | INACTIVE" }
      - { name: training_hours_accumulated, type: number, source: system, default: 0.0, description: "Training hours credited at complete-training" }
      - { name: duty_hours_7d, type: number, source: computed, description: "Sum of duty_hours over assignments with status ASSIGNED or COMPLETED whose duty_end_at falls in (now-7d, now] per the logical clock" }
      - { name: duty_hours_28d, type: number, source: computed, description: "Same as duty_hours_7d over a (now-28d, now] window" }
      - { name: flight_hours_total, type: number, source: computed, default: 0.0, description: "Sum of block_hours_actual over COMPLETED trips where this crew member held an assignment" }

  - name: TripRequest
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: trip_use, type: enum, source: input, description: "OWNER_USE | CHARTER" }
      - { name: depart_icao, type: string, source: input, description: "Departure airport ICAO code" }
      - { name: arrive_icao, type: string, source: input, description: "Arrival airport ICAO code" }
      - { name: departure_at, type: datetime, source: input, description: "Scheduled departure instant (ISO 8601 UTC)" }
      - { name: block_hours_est, type: number, source: input, description: "Estimated block hours; must be > 0" }
      - { name: block_hours_actual, type: number, source: system, description: "Actual block hours recorded at completion; null until COMPLETED" }
      - { name: charter_quote_cents, type: integer, source: input, description: "Charter price quoted to the customer; required iff trip_use == CHARTER" }
      - { name: owner_credit_cents, type: integer, source: computed, description: "Owner revenue-offset credit computed at completion; null until COMPLETED; 0 for OWNER_USE trips" }
      - { name: charter_shortfall_cents, type: integer, source: computed, description: "Amount by which direct charter costs exceeded the quote; 0 when quote >= costs" }
      - { name: decline_reason, type: string, source: system, description: "Owner-supplied reason recorded at decline; null otherwise" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DECLINED | SCHEDULED | COMPLETED | CANCELLED | VOID" }

  - name: DutyAssignment
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> TripRequest.id" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id" }
      - { name: duty_role, type: enum, source: input, description: "PIC | SIC" }
      - { name: duty_start_at, type: datetime, source: input, description: "Duty period start (ISO 8601 UTC); must be < duty_end_at" }
      - { name: duty_end_at, type: datetime, source: input, description: "Duty period end (ISO 8601 UTC)" }
      - { name: duty_hours, type: number, source: computed, description: "(duty_end_at - duty_start_at) expressed in hours, 2 decimal places round_half_up" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED | RELEASED | COMPLETED" }

  - name: MaintenanceProgram
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: program_name, type: string, source: input, description: "Hourly-cost maintenance program name (e.g. JSSI-style)" }
      - { name: rate_per_hour_cents, type: integer, source: input, description: "Program accrual rate charged per actual block hour flown while ENROLLED" }
      - { name: status, type: enum, source: system, default: QUOTED, description: "QUOTED | ENROLLED | SUSPENDED | CANCELLED" }

  - name: MaintenanceEvent
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: previous_event_id, type: string, source: system, description: "FK -> MaintenanceEvent.id; set on auto-spawned successor forecasts; null on the manually created base event" }
      - { name: event_code, type: string, source: input, description: "Maintenance event code (e.g. INSPECTION_100H)" }
      - { name: interval_hours, type: number, source: input, description: "Recurring interval in airframe hours" }
      - { name: due_at_aircraft_hours, type: number, source: computed, description: "Airframe hours at which the event comes due; input-supplied on manual base-event creation, computed as previous event actual_aircraft_hours + interval_hours for successors" }
      - { name: scheduled_date, type: string, source: system, description: "Planned date set by the schedule action; null while FORECAST" }
      - { name: completed_at, type: datetime, source: system, description: "Completion timestamp; null until COMPLETED" }
      - { name: actual_aircraft_hours, type: number, source: system, description: "Aircraft total_time_hours captured at completion; null until COMPLETED" }
      - { name: handed_over_at, type: datetime, source: system, description: "Set when this record is released during agreement records handover; null until released" }
      - { name: status, type: enum, source: system, default: FORECAST, description: "FORECAST | SCHEDULED | COMPLETED" }

  - name: ComplianceFiling
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: filing_kind, type: enum, source: input, description: "INSURANCE_COI | REGISTRATION | OPS_SPECS_AMENDMENT" }
      - { name: authority, type: string, source: input, description: "Filing authority (e.g. FAA, insurer)" }
      - { name: reference_no, type: string, source: input, description: "External reference or certificate number" }
      - { name: valid_until, type: string, source: input, description: "ISO date through which the filing is valid once ACCEPTED" }
      - { name: filed_at, type: datetime, source: system, description: "Timestamp of last filing submission; null while DRAFT" }
      - { name: decision_notes, type: string, source: system, description: "Authority decision notes recorded at record-decision; null until decided" }
      - { name: handed_over_at, type: datetime, source: system, description: "Set when this record is released during agreement records handover; null until released" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FILED | ACCEPTED | REJECTED" }

  - name: VendorContract
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: vendor_kind, type: enum, source: input, description: "HANGAR | FUEL" }
      - { name: vendor_name, type: string, source: input, description: "Vendor legal name" }
      - { name: unit, type: enum, source: input, description: "MONTH | GALLON; billing unit for rate_cents_per_unit" }
      - { name: rate_cents_per_unit, type: integer, source: input, description: "Negotiated unit rate; revised by propose/counter actions" }
      - { name: term_start, type: string, source: input, description: "ISO date the contract term begins; must be < term_end" }
      - { name: term_end, type: string, source: input, description: "ISO date the contract term ends" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PROPOSED | COUNTERED | EXECUTED | EXPIRED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ManagementAgreement
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /agreements/{id}/activate"
        actor: AccountExecutive
        preconditions:
          - "Agreement must be in PENDING (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "increments ManagementAgreement.version by 1"

      - from: ACTIVE
        to: TERMINATION_PENDING
        trigger: "POST /agreements/{id}/give-termination-notice"
        actor: Owner | AccountExecutive
        preconditions:
          - "Agreement must be in ACTIVE (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "sets notice_given_at to the logical clock time"
          - "snapshots records_total = count of MaintenanceEvent + ComplianceFiling records (any status) whose aircraft_id == agreement.aircraft_id"
          - "every TripRequest of this aircraft with status REQUESTED, APPROVED, or SCHEDULED transitions to CANCELLED (see TripRequest cascade-cancel)"
          - "each such trip cancellation itself releases that trip's ASSIGNED DutyAssignments to RELEASED (see DutyAssignment)"
          - "increments ManagementAgreement.version by 1"

      - from: TERMINATION_PENDING
        to: HANDOVER_IN_PROGRESS
        trigger: "POST /agreements/{id}/release-records (first successful release)"
        actor: AccountExecutive
        preconditions:
          - "Agreement must be in TERMINATION_PENDING or HANDOVER_IN_PROGRESS (ERR_AGREEMENT_INVALID_STATE)"
          - "Every record_id in the request must identify a MaintenanceEvent or ComplianceFiling whose aircraft_id == agreement.aircraft_id (ERR_RECORD_NOT_IN_SCOPE)"
          - "No record_id may name a record whose handed_over_at is already set (ERR_RECORD_ALREADY_RELEASED)"
        side_effects:
          - "sets handed_over_at on each named record"
          - "records_released += number of records named in this request"
          - "on the first successful release the agreement moves TERMINATION_PENDING -> HANDOVER_IN_PROGRESS"
          - "increments ManagementAgreement.version by 1"

      - from: HANDOVER_IN_PROGRESS
        to: TERMINATED
        trigger: "POST /agreements/{id}/complete-termination"
        actor: AccountExecutive
        preconditions:
          - "Agreement must be in HANDOVER_IN_PROGRESS (ERR_AGREEMENT_INVALID_STATE)"
          - "records_released must equal records_total (ERR_HANDOVER_INCOMPLETE)"
          - "No TripRequest of this aircraft in REQUESTED, APPROVED, or SCHEDULED (ERR_OPEN_OBLIGATIONS)"
          - "No MaintenanceProgram of this aircraft in ENROLLED (ERR_OPEN_OBLIGATIONS)"
        side_effects:
          - "sets every MaintenanceProgram of this aircraft in SUSPENDED to CANCELLED"
          - "increments ManagementAgreement.version by 1"

  - entity: OperatingBudget
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /budgets/{id}/submit"
        actor: AccountExecutive
        preconditions:
          - "Budget must be in DRAFT (ERR_BUDGET_INVALID_STATE)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /budgets/{id}/approve"
        actor: Owner
        preconditions:
          - "Budget must be in SUBMITTED (ERR_BUDGET_INVALID_STATE)"
          - "Acting X-User-ID must equal the budget aircraft's agreement owner_id (ERR_FORBIDDEN_ROLE)"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /budgets/{id}/reject"
        actor: Owner
        preconditions:
          - "Budget must be in SUBMITTED (ERR_BUDGET_INVALID_STATE)"
        side_effects:
          - "records rejection_reason from the request body"

      - from: REJECTED
        to: DRAFT
        trigger: "PATCH /budgets/{id} (revising amounts reopens the budget)"
        actor: AccountExecutive
        preconditions:
          - "Budget must be in DRAFT or REJECTED (ERR_BUDGET_INVALID_STATE)"
        side_effects:
          - "amount fields replaced by request values; rejection_reason cleared"

  - entity: Expense
    initial_state: POSTED
    terminal_states: [BILLED, VOID]
    transitions:
      - from: POSTED
        to: BILLED
        trigger: "system (automatic when the covering MonthlyStatement is certified)"
        actor: system
        preconditions: []
        side_effects:
          - "sets statement_id to the certifying statement"

      - from: POSTED
        to: VOID
        trigger: "POST /expenses/{id}/void"
        actor: FinanceController
        preconditions:
          - "Expense must be in POSTED (ERR_EXPENSE_NOT_POSTED)"
        side_effects:
          - "any DRAFT MonthlyStatement covering this expense's service_date period is recomputed (totals drop this expense)"

  - entity: MonthlyStatement
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /statements/{id}/certify"
        actor: FinanceController
        preconditions:
          - "Statement must be in DRAFT (ERR_STATEMENT_INVALID_STATE)"
          - "Acting X-User-ID must differ from prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "No POSTED expense of this aircraft exists whose service_date falls in period and which is not reflected in the statement totals (ERR_STATEMENT_STALE)"
        side_effects:
          - "sets certified_by_user_id to the acting X-User-ID"
          - "every in-period POSTED expense of the aircraft transitions to BILLED with statement_id set to this statement"

      - from: CERTIFIED
        to: DELIVERED
        trigger: "POST /statements/{id}/deliver"
        actor: AccountExecutive
        preconditions:
          - "Statement must be in CERTIFIED (ERR_STATEMENT_INVALID_STATE)"
        side_effects: []

  - entity: CrewMember
    initial_state: HIRED
    terminal_states: [INACTIVE]
    transitions:
      - from: HIRED
        to: IN_TRAINING
        trigger: "POST /crew/{id}/begin-training"
        actor: FlightOpsManager
        preconditions:
          - "CrewMember must be in HIRED (ERR_CREW_INVALID_STATE)"
        side_effects: []

      - from: IN_TRAINING
        to: QUALIFIED
        trigger: "POST /crew/{id}/complete-training"
        actor: FlightOpsManager
        preconditions:
          - "CrewMember must be in IN_TRAINING (ERR_CREW_INVALID_STATE)"
          - "training_hours request value must be >= MIN_TRAINING_HOURS (25) (ERR_INSUFFICIENT_TRAINING)"
          - "check_ride_passed request value must be true (ERR_INSUFFICIENT_TRAINING)"
        side_effects:
          - "training_hours_accumulated += training_hours"

      - from: HIRED
        to: INACTIVE
        trigger: "POST /crew/{id}/deactivate"
        actor: FlightOpsManager
        preconditions:
          - "CrewMember must be in HIRED, IN_TRAINING, or QUALIFIED (ERR_CREW_INVALID_STATE)"
        side_effects:
          - "every ASSIGNED DutyAssignment of this crew member whose trip is in REQUESTED, APPROVED, or SCHEDULED transitions to RELEASED"

      - from: IN_TRAINING
        to: INACTIVE
        trigger: "POST /crew/{id}/deactivate"
        actor: FlightOpsManager
        preconditions: []
        side_effects: []

      - from: QUALIFIED
        to: INACTIVE
        trigger: "POST /crew/{id}/deactivate"
        actor: FlightOpsManager
        preconditions: []
        side_effects:
          - "every ASSIGNED DutyAssignment of this crew member whose trip is in REQUESTED, APPROVED, or SCHEDULED transitions to RELEASED"

  - entity: TripRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, VOID]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /trips (auto-approve when trip_use == OWNER_USE) | POST /trips/{id}/approve (CHARTER)"
        actor: Owner | system
        preconditions:
          - "Trip must be in REQUESTED (ERR_TRIP_INVALID_STATE)"
          - "CHARTER trips: acting X-User-ID must equal the aircraft agreement's owner_id (ERR_FORBIDDEN_ROLE)"
        side_effects: []

      - from: REQUESTED
        to: DECLINED
        trigger: "POST /trips/{id}/decline"
        actor: Owner
        preconditions:
          - "Trip must be in REQUESTED (ERR_TRIP_INVALID_STATE)"
          - "Only CHARTER trips may be declined; declining an OWNER_USE trip is ERR_TRIP_INVALID_STATE"
        side_effects:
          - "records decline_reason from the request body"

      - from: DECLINED
        to: REQUESTED
        trigger: "POST /trips/{id}/resubmit"
        actor: FlightOpsManager | Owner
        preconditions:
          - "Trip must be in DECLINED (ERR_TRIP_INVALID_STATE)"
        side_effects:
          - "departure_at, block_hours_est, charter_quote_cents replaced by request values when present; decline_reason cleared"

      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /trips/{id}/schedule"
        actor: FlightOpsManager
        preconditions:
          - "Trip must be in APPROVED (ERR_TRIP_INVALID_STATE)"
          - "Aircraft agreement must be in ACTIVE (ERR_AGREEMENT_INVALID_STATE)"
          - "No MaintenanceEvent of this aircraft in FORECAST or SCHEDULED may have due_at_aircraft_hours <= aircraft.total_time_hours (ERR_MAINTENANCE_OVERDUE)"
          - "An ACCEPTED ComplianceFiling of kind INSURANCE_COI with valid_until >= date(departure_at) must exist for this aircraft (ERR_INSURANCE_NOT_CURRENT)"
          - "At least one ASSIGNED DutyAssignment with duty_role == PIC held by a QUALIFIED CAPTAIN and at least one with duty_role == SIC held by a QUALIFIED FIRST_OFFICER must exist for this trip (ERR_CREW_COMPLEMENT_INCOMPLETE)"
          - "Aircraft occupancy interval [departure_at, departure_at + block_hours_est] must leave >= TURNAROUND_BUFFER_HOURS (1h) gap to every other SCHEDULED or COMPLETED trip of the same aircraft (ERR_AIRCRAFT_OVERLAP)"
        side_effects: []

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /trips/{id}/complete"
        actor: FlightOpsManager
        preconditions:
          - "Trip must be in SCHEDULED (ERR_TRIP_INVALID_STATE)"
          - "block_hours_actual request value must be > 0 (ERR_VALIDATION)"
        side_effects:
          - "sets block_hours_actual"
          - "aircraft.total_time_hours += block_hours_actual"
          - "CHARTER trips: computes owner_credit_cents and charter_shortfall_cents per charter_owner_credit calculation"
          - "if a MaintenanceProgram of this aircraft is ENROLLED at completion time: creates an Expense with category PROGRAM_ACCRUAL, amount_cents = round_half_up(block_hours_actual x rate_per_hour_cents), service_date = date of completion, tax_use = MIXED, trip_id = this trip (this expense creation itself triggers recomputation of any DRAFT MonthlyStatement covering the period)"
          - "every ASSIGNED DutyAssignment of this trip transitions to COMPLETED"
          - "flight_hours_total of each assigned crew member += block_hours_actual"
          - "any DRAFT MonthlyStatement covering the completion period is recomputed (charter_offset_cents includes the new credit; accrual/cash totals include the new accrual expense)"

      - from: COMPLETED
        to: VOID
        trigger: "POST /trips/{id}/void"
        actor: FlightOpsManager
        preconditions:
          - "Trip must be in COMPLETED (ERR_TRIP_INVALID_STATE)"
          - "The PROGRAM_ACCRUAL expense created at completion (if any) must still be POSTED, i.e. not BILLED onto a certified statement (ERR_EXPENSE_NOT_POSTED)"
        side_effects:
          - "aircraft.total_time_hours -= block_hours_actual"
          - "the completion-created PROGRAM_ACCRUAL expense (if any) transitions to VOID"
          - "owner_credit_cents and charter_shortfall_cents reset to null"
          - "DutyAssignments of this trip remain COMPLETED (duty was performed); flight_hours_total of assigned crew is NOT reversed"
          - "any DRAFT MonthlyStatement covering the period is recomputed"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel"
        actor: FlightOpsManager | Owner
        preconditions:
          - "Trip must be in REQUESTED, APPROVED, or SCHEDULED (ERR_TRIP_INVALID_STATE)"
        side_effects:
          - "every ASSIGNED DutyAssignment of this trip transitions to RELEASED"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel"
        actor: FlightOpsManager | Owner
        preconditions: []
        side_effects:
          - "every ASSIGNED DutyAssignment of this trip transitions to RELEASED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel | system (cascade from give-termination-notice)"
        actor: FlightOpsManager | Owner | system
        preconditions: []
        side_effects:
          - "every ASSIGNED DutyAssignment of this trip transitions to RELEASED"

  - entity: DutyAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "DELETE /assignments/{id} | system (trip cancel, crew deactivate)"
        actor: FlightOpsManager | system
        preconditions:
          - "Assignment must be in ASSIGNED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "crew member duty_hours_7d and duty_hours_28d decrease by this assignment's duty_hours (window membership unchanged)"

      - from: ASSIGNED
        to: COMPLETED
        trigger: "system (automatic when the trip completes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MaintenanceProgram
    initial_state: QUOTED
    terminal_states: [CANCELLED]
    transitions:
      - from: QUOTED
        to: ENROLLED
        trigger: "POST /programs/{id}/enroll"
        actor: MaintenancePlanner | AccountExecutive
        preconditions:
          - "Program must be in QUOTED or SUSPENDED (ERR_PROGRAM_INVALID_STATE)"
        side_effects: []

      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /programs/{id}/enroll (resume)"
        actor: MaintenancePlanner | AccountExecutive
        preconditions: []
        side_effects: []

      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /programs/{id}/suspend"
        actor: MaintenancePlanner
        preconditions:
          - "Program must be in ENROLLED (ERR_PROGRAM_INVALID_STATE)"
        side_effects: []

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /programs/{id}/cancel | system (complete-termination)"
        actor: AccountExecutive | system
        preconditions:
          - "Program must not be CANCELLED (ERR_PROGRAM_INVALID_STATE)"
        side_effects: []

      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /programs/{id}/cancel"
        actor: AccountExecutive
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /programs/{id}/cancel | system (complete-termination)"
        actor: AccountExecutive | system
        preconditions: []
        side_effects: []

  - entity: MaintenanceEvent
    initial_state: FORECAST
    terminal_states: [COMPLETED]
    transitions:
      - from: FORECAST
        to: SCHEDULED
        trigger: "POST /events/{id}/schedule"
        actor: MaintenancePlanner
        preconditions:
          - "Event must be in FORECAST (ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "sets scheduled_date from the request body"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /events/{id}/complete"
        actor: MaintenancePlanner
        preconditions:
          - "Event must be in SCHEDULED (ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "sets completed_at to the logical clock time and actual_aircraft_hours to the aircraft's current total_time_hours"
          - "auto-creates a successor MaintenanceEvent with previous_event_id = this event, same event_code and interval_hours, due_at_aircraft_hours = actual_aircraft_hours + interval_hours, status FORECAST"

  - entity: ComplianceFiling
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /filings/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "Filing must be in DRAFT or REJECTED (ERR_FILING_INVALID_STATE)"
        side_effects:
          - "sets filed_at to the logical clock time; reference_no and valid_until replaced by request values when present"

      - from: REJECTED
        to: FILED
        trigger: "POST /filings/{id}/file (re-file after rejection)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sets filed_at to the logical clock time; reference_no and valid_until replaced by request values when present"

      - from: FILED
        to: ACCEPTED
        trigger: "POST /filings/{id}/record-decision with outcome ACCEPTED"
        actor: ComplianceOfficer
        preconditions:
          - "Filing must be in FILED (ERR_FILING_INVALID_STATE)"
        side_effects:
          - "records decision_notes from the request body"

      - from: FILED
        to: REJECTED
        trigger: "POST /filings/{id}/record-decision with outcome REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "Filing must be in FILED (ERR_FILING_INVALID_STATE)"
        side_effects:
          - "records decision_notes from the request body"

  - entity: VendorContract
    initial_state: DRAFT
    terminal_states: [EXECUTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /contracts/{id}/propose"
        actor: ContractsManager
        preconditions:
          - "Contract must be in DRAFT or COUNTERED (ERR_CONTRACT_INVALID_STATE)"
        side_effects:
          - "rate_cents_per_unit replaced by the request value when present"

      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /contracts/{id}/propose (re-propose revised terms)"
        actor: ContractsManager
        preconditions: []
        side_effects:
          - "rate_cents_per_unit replaced by the request value when present"

      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /contracts/{id}/counter"
        actor: ContractsManager
        preconditions:
          - "Contract must be in PROPOSED (ERR_CONTRACT_INVALID_STATE)"
        side_effects:
          - "rate_cents_per_unit replaced by the request value"

      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /contracts/{id}/execute"
        actor: AccountExecutive
        preconditions:
          - "Contract must be in PROPOSED or COUNTERED (ERR_CONTRACT_INVALID_STATE)"
        side_effects: []

      - from: COUNTERED
        to: EXECUTED
        trigger: "POST /contracts/{id}/execute"
        actor: AccountExecutive
        preconditions: []
        side_effects: []

      - from: PROPOSED
        to: EXPIRED
        trigger: "POST /contracts/{id}/expire"
        actor: ContractsManager
        preconditions:
          - "Contract must be in PROPOSED or COUNTERED (ERR_CONTRACT_INVALID_STATE)"
        side_effects: []

      - from: COUNTERED
        to: EXPIRED
        trigger: "POST /contracts/{id}/expire"
        actor: ContractsManager
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-terms-stale-version
    parent_entity: ManagementAgreement
    write_endpoint: "PATCH /agreements/{id}/terms"
    occ_field: expected_agreement_version
    description: |
      Amending the commercial terms of a ManagementAgreement whose version has
      advanced since the client last observed it is rejected: the client's view
      of the fee and revenue-share terms is stale, so the amendment is refused
      with a stale-version error instead of silently overwriting the newer terms.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: statement_accrual_cash_totals
    trigger: "POST /statements (generate/recompute) and recompute of a DRAFT statement after any covered expense changes"
    algorithm: aggregation
    formula: |
      Let E = Expenses where aircraft_id == statement.aircraft_id
              and status IN {POSTED, BILLED}.
      period covers [period-01, first day of next month), service_date compared
      by calendar date, inclusive lower / exclusive upper.
      accrual_total_cents = SUM(amount_cents) over E where service_date in period
      cash_total_cents    = SUM(amount_cents) over E where paid_date is not null
                            and paid_date in period
      Both totals are integer cents; no rounding is applied to the sums.
    input_set: "Expenses of the aircraft with status POSTED or BILLED; VOID excluded"
    precision: "integer cents; no rounding on sums"
    variants:
      - name: accrual
        when: "always computed"
        difference: "membership keyed on service_date (cost incurred in period)"
      - name: cash
        when: "always computed"
        difference: "membership keyed on paid_date (cash out the door in period); identical data yields a different total whenever any expense is paid in a different month than incurred"

  - name: management_fee_assessment
    trigger: "POST /statements (generate/recompute) and DRAFT recompute"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned to break the apparent circularity
      (grand total includes the fee, but the fee is a percentage of a subtotal):
        1. direct_subtotal = accrual_total_cents (all in-period non-VOID
           expenses; there is no MANAGEMENT_FEE expense category, so the fee
           never enters its own basis)
        2. management_fee_cents = agreement.monthly_management_fee_cents
           + round_half_up(agreement.variable_fee_pct x direct_subtotal)
        3. grand_total_due_cents = direct_subtotal + management_fee_cents
           - charter_offset_cents
      The fee MUST be computed on the pre-fee subtotal and MUST NOT be
      reduced by the charter offset; the offset is applied after the fee.
    input_set: "accrual_total_cents of the statement; ACTIVE-agreement fee terms"
    constants:
      ROUNDING: round_half_up to integer cents
    precision: "integer cents, round_half_up on the variable component"

  - name: budget_variance
    trigger: "POST /statements (generate/recompute) and DRAFT recompute"
    algorithm: aggregation
    formula: |
      Find the OperatingBudget with aircraft_id == statement.aircraft_id,
      fiscal_year == year of period start, status == APPROVED.
      If none exists: budget_variance_cents = null.
      Else:
        annual_total = fuel_cents + maintenance_cents + crew_cents
                     + hangar_cents + insurance_cents + other_cents
        monthly_share = round_half_up(annual_total / 12)
        budget_variance_cents = accrual_total_cents - monthly_share
    input_set: "APPROVED OperatingBudget for the aircraft and fiscal year only"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "integer cents, round_half_up on monthly_share"

  - name: charter_owner_credit
    trigger: "POST /trips/{id}/complete on a CHARTER trip"
    algorithm: tiered_pricing
    formula: |
      direct_cost_cents = SUM(amount_cents) over Expenses where
        trip_id == this trip, category == CHARTER_DIRECT, status != VOID
      net_cents = charter_quote_cents - direct_cost_cents
      if net_cents > 0:
        owner_credit_cents = round_half_up(net_cents x agreement.charter_owner_share_pct)
        charter_shortfall_cents = 0
      if net_cents == 0:
        owner_credit_cents = 0
        charter_shortfall_cents = 0        # exact break-even is NOT a shortfall
      if net_cents < 0:
        owner_credit_cents = 0             # credit floors at zero
        charter_shortfall_cents = -net_cents
      OWNER_USE trips: owner_credit_cents = 0 and charter_shortfall_cents = 0.
    input_set: "Non-VOID CHARTER_DIRECT expenses linked to this trip; agreement.charter_owner_share_pct in force at completion"
    constants:
      CREDIT_FLOOR: 0
    precision: "integer cents, round_half_up on the shared credit"

  - name: tax_use_allocation
    trigger: "POST /statements (generate/recompute) and DRAFT recompute"
    algorithm: aggregation
    formula: |
      Trips T = TripRequests of the aircraft with status == COMPLETED and
        completion timestamp inside the statement period.
      charter_hours = SUM(block_hours_actual) over T where trip_use == CHARTER
      total_hours   = SUM(block_hours_actual) over T
      charter_legs  = COUNT of T where trip_use == CHARTER
      total_legs    = COUNT of T
      Method FLIGHT_HOURS: charter_ratio = charter_hours / total_hours
      Method TRIP_LEGS:    charter_ratio = charter_legs / total_legs
      If the denominator is 0 (no completed trips in period):
        charter_ratio = 0 (everything allocates to owner use).
      owner_ratio = 1 - charter_ratio
      For EACH in-period non-VOID expense line with tax_use == MIXED:
        line_owner_share   = round_half_up(amount_cents x owner_ratio)
        line_charter_share = amount_cents - line_owner_share
      mixed_owner_share_cents   = SUM(line_owner_share)     # per-line first, then sum
      mixed_charter_share_cents = SUM(line_charter_share)
      Rounding order is pinned: round each line BEFORE summing; summing raw
      products and rounding once at the end is a rejected alternative because
      the two orders differ on odd-cent lines.
      Invariant: mixed_owner_share_cents + mixed_charter_share_cents
                 == SUM(amount_cents of in-period MIXED non-VOID lines).
    input_set: "COMPLETED trips of the aircraft in period; in-period non-VOID MIXED expenses; agreement.tax_allocation_method in force at generation"
    precision: "integer cents, round_half_up per line"
    variants:
      - name: flight_hours
        when: "agreement.tax_allocation_method == FLIGHT_HOURS"
        difference: "ratio keyed on block-hour share; identical data yields a different split than trip_legs whenever average trip length differs between uses"
      - name: trip_legs
        when: "agreement.tax_allocation_method == TRIP_LEGS"
        difference: "ratio keyed on trip-count share"

  - name: duty_hours_accumulation
    trigger: "read of CrewMember duty fields; precondition evaluation of POST /assignments"
    algorithm: threshold
    formula: |
      Let A = DutyAssignments where crew_member_id == crew.id and
              status IN {ASSIGNED, COMPLETED}.
      duty_hours per assignment = (duty_end_at - duty_start_at) in hours,
        2 decimal places round_half_up.
      duty_hours_7d  = SUM(duty_hours) over A where duty_end_at in (now-7d, now]
      duty_hours_28d = SUM(duty_hours) over A where duty_end_at in (now-28d, now]
      ("now" is the logical clock; window bounds: lower exclusive, upper inclusive)
      A new assignment is rejected when EITHER projected total exceeds its limit:
        projected_7d  = duty_hours_7d  + new.duty_hours  > DUTY_LIMIT_7D_HOURS
        projected_28d = duty_hours_28d + new.duty_hours  > DUTY_LIMIT_28D_HOURS
      Equality with the limit is allowed (reject strictly greater than).
      Only assignments whose duty_end_at falls inside the window count; an
      assignment whose window membership straddles the bound counts in full.
    input_set: "DutyAssignments of the crew member with status ASSIGNED or COMPLETED; RELEASED excluded"
    constants:
      DUTY_LIMIT_7D_HOURS: 40
      DUTY_LIMIT_28D_HOURS: 120
    precision: "2 decimal places, round_half_up per assignment"

  - name: maintenance_forecast
    trigger: "POST /events/{id}/complete"
    algorithm: projection
    formula: |
      On completion:
        actual_aircraft_hours = aircraft.total_time_hours (at completion instant)
        successor.due_at_aircraft_hours = actual_aircraft_hours + interval_hours
        successor.previous_event_id = this event's id
        successor.event_code = this event's event_code
        successor.interval_hours = this event's interval_hours
        successor.status = FORECAST
      Overdue rule (evaluated at POST /trips/{id}/schedule):
        an event is overdue when status IN {FORECAST, SCHEDULED}
        and due_at_aircraft_hours <= aircraft.total_time_hours.
        Due exactly AT the current hour reading is already overdue.
    input_set: "the completing event and its aircraft"
    precision: "hours at 1 decimal place minimum; exact arithmetic on inputs"

  - name: aircraft_occupancy_interval
    trigger: "POST /trips/{id}/schedule"
    algorithm: interval_merge
    formula: |
      Occupancy interval of a trip = [departure_at, departure_at + block_hours_est].
      For the candidate trip C and every other trip X of the same aircraft with
      status IN {SCHEDULED, COMPLETED}:
        conflict unless C.start >= X.end + TURNAROUND_BUFFER_HOURS
                    or C.end + TURNAROUND_BUFFER_HOURS <= X.start
      A gap of exactly TURNAROUND_BUFFER_HOURS is allowed (>=, not >).
      Crew duty overlap (separate semantics, see validations):
        [duty_start_at, duty_end_at) is a half-open interval; two duty windows
        that merely touch (end == start) do NOT conflict; any strictly positive
        intersection conflicts.
    input_set: "Trips of the same aircraft with status SCHEDULED or COMPLETED"
    constants:
      TURNAROUND_BUFFER_HOURS: 1
    precision: "timestamps compared at second precision"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role must be listed in the endpoint's roles; where an endpoint is owner-scoped (budget approve/reject, trip approve/decline), the acting X-User-ID must also equal the aircraft agreement's owner_id"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path ids and body-supplied FK references (owner_id, aircraft_id, trip_id, crew_member_id, record_ids, ...) must resolve to existing resources, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request schema: required fields present, enum values valid, ISO dates parseable, amount_cents > 0, block_hours_est > 0, rates non-negative, duty_start_at < duty_end_at, term_start < term_end, period matches YYYY-MM"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 5
    category: state
    check: "Agreement target state allows the transition (activate, terms amend requires ACTIVE, notice requires ACTIVE, release-records requires TERMINATION_PENDING or HANDOVER_IN_PROGRESS, complete-termination requires HANDOVER_IN_PROGRESS)"
    error_id: ERR_AGREEMENT_INVALID_STATE
    http_status: 409
    applies_to: "PATCH /agreements/{id}/terms, POST /agreements/{id}/activate, POST /agreements/{id}/give-termination-notice, POST /agreements/{id}/release-records, POST /agreements/{id}/complete-termination"

  - priority: 5
    category: state
    check: "Budget target state allows the transition (submit from DRAFT, approve/reject from SUBMITTED, revise from DRAFT or REJECTED)"
    error_id: ERR_BUDGET_INVALID_STATE
    http_status: 409
    applies_to: "POST /budgets/{id}/submit, POST /budgets/{id}/approve, POST /budgets/{id}/reject, PATCH /budgets/{id}"

  - priority: 5
    category: state
    check: "Trip target state allows the transition (approve/decline from REQUESTED, resubmit from DECLINED, schedule from APPROVED, complete from SCHEDULED, cancel from REQUESTED/APPROVED/SCHEDULED, void from COMPLETED); decline of an OWNER_USE trip is rejected"
    error_id: ERR_TRIP_INVALID_STATE
    http_status: 409
    applies_to: "POST /trips/{id}/approve, POST /trips/{id}/decline, POST /trips/{id}/resubmit, POST /trips/{id}/schedule, POST /trips/{id}/complete, POST /trips/{id}/cancel, POST /trips/{id}/void"

  - priority: 5
    category: state
    check: "Cross-entity gate at trip scheduling, evaluated first among schedule's business gates: the aircraft's ManagementAgreement must be ACTIVE"
    error_id: ERR_AGREEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /trips/{id}/schedule"

  - priority: 5
    category: state
    check: "Crew member target state allows the transition (begin-training from HIRED, complete-training from IN_TRAINING, deactivate from HIRED/IN_TRAINING/QUALIFIED)"
    error_id: ERR_CREW_INVALID_STATE
    http_status: 409
    applies_to: "POST /crew/{id}/begin-training, POST /crew/{id}/complete-training, POST /crew/{id}/deactivate"

  - priority: 5
    category: state
    check: "Statement target state allows the transition (certify from DRAFT, deliver from CERTIFIED)"
    error_id: ERR_STATEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /statements/{id}/certify, POST /statements/{id}/deliver"

  - priority: 5
    category: state
    check: "Expense must be POSTED to be voided; trip void requires its completion-created PROGRAM_ACCRUAL expense (if any) still POSTED"
    error_id: ERR_EXPENSE_NOT_POSTED
    http_status: 409
    applies_to: "POST /expenses/{id}/void, POST /trips/{id}/void"

  - priority: 5
    category: state
    check: "Assignment creation: the referenced trip must be in APPROVED or SCHEDULED status"
    error_id: ERR_TRIP_INVALID_STATE
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 5
    category: state
    check: "Assignment must be ASSIGNED to be released"
    error_id: ERR_ASSIGNMENT_INVALID_STATE
    http_status: 409
    applies_to: "DELETE /assignments/{id}"

  - priority: 5
    category: state
    check: "Program target state allows the transition (enroll from QUOTED or SUSPENDED, suspend from ENROLLED, cancel from QUOTED/ENROLLED/SUSPENDED)"
    error_id: ERR_PROGRAM_INVALID_STATE
    http_status: 409
    applies_to: "POST /programs/{id}/enroll, POST /programs/{id}/suspend, POST /programs/{id}/cancel"

  - priority: 5
    category: state
    check: "Event target state allows the transition (schedule from FORECAST, complete from SCHEDULED)"
    error_id: ERR_EVENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /events/{id}/schedule, POST /events/{id}/complete"

  - priority: 5
    category: state
    check: "Filing target state allows the transition (file from DRAFT or REJECTED, record-decision from FILED)"
    error_id: ERR_FILING_INVALID_STATE
    http_status: 409
    applies_to: "POST /filings/{id}/file, POST /filings/{id}/record-decision"

  - priority: 5
    category: state
    check: "Contract target state allows the transition (propose from DRAFT or COUNTERED, counter from PROPOSED, execute/expire from PROPOSED or COUNTERED)"
    error_id: ERR_CONTRACT_INVALID_STATE
    http_status: 409
    applies_to: "POST /contracts/{id}/propose, POST /contracts/{id}/counter, POST /contracts/{id}/execute, POST /contracts/{id}/expire"

  - priority: 6
    category: business_safety
    check: "Trip scheduling gate (evaluated after the agreement gate, in this order): no MaintenanceEvent in FORECAST or SCHEDULED with due_at_aircraft_hours <= aircraft.total_time_hours"
    error_id: ERR_MAINTENANCE_OVERDUE
    http_status: 409
    applies_to: "POST /trips/{id}/schedule"

  - priority: 6
    category: business_safety
    check: "Trip scheduling gate: an ACCEPTED ComplianceFiling of kind INSURANCE_COI with valid_until >= date(departure_at) must exist for the aircraft"
    error_id: ERR_INSURANCE_NOT_CURRENT
    http_status: 409
    applies_to: "POST /trips/{id}/schedule"

  - priority: 6
    category: business_safety
    check: "Trip scheduling gate: at least one ASSIGNED PIC DutyAssignment held by a QUALIFIED CAPTAIN and one ASSIGNED SIC DutyAssignment held by a QUALIFIED FIRST_OFFICER for this trip"
    error_id: ERR_CREW_COMPLEMENT_INCOMPLETE
    http_status: 409
    applies_to: "POST /trips/{id}/schedule"

  - priority: 6
    category: business_safety
    check: "Assignment gate (first among assignment business checks): crew member status must be QUALIFIED"
    error_id: ERR_CREW_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 6
    category: business_safety
    check: "Assignment gate: projected duty_hours_7d and duty_hours_28d (including the new assignment) must be <= DUTY_LIMIT_7D_HOURS (40) and DUTY_LIMIT_28D_HOURS (120); strictly-greater-than rejects, equality passes"
    error_id: ERR_DUTY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /assignments"

  - priority: 6
    category: business_safety
    check: "complete-training requires training_hours >= MIN_TRAINING_HOURS (25) and check_ride_passed == true"
    error_id: ERR_INSUFFICIENT_TRAINING
    http_status: 422
    applies_to: "POST /crew/{id}/complete-training"

  - priority: 7
    category: business_temporal
    check: "Assignment gate: new duty window [duty_start_at, duty_end_at) must have strictly-empty intersection with every other ASSIGNED/COMPLETED duty window of the same crew member; touching endpoints (end == start) do not conflict"
    error_id: ERR_CREW_OVERLAP
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 7
    category: business_temporal
    check: "Trip scheduling gate: aircraft occupancy interval must keep >= TURNAROUND_BUFFER_HOURS (1h) gap to every other SCHEDULED or COMPLETED trip of the aircraft; a gap of exactly 1h passes"
    error_id: ERR_AIRCRAFT_OVERLAP
    http_status: 409
    applies_to: "POST /trips/{id}/schedule"

  - priority: 8
    category: business_constraint
    check: "tail_number must be unique across all aircraft"
    error_id: ERR_TAIL_NUMBER_EXISTS
    http_status: 409
    applies_to: "POST /aircraft"

  - priority: 8
    category: business_constraint
    check: "At most one ManagementAgreement per aircraft with status in {PENDING, ACTIVE, TERMINATION_PENDING, HANDOVER_IN_PROGRESS}"
    error_id: ERR_AGREEMENT_CONFLICT_EXISTS
    http_status: 409
    applies_to: "POST /agreements"

  - priority: 8
    category: business_constraint
    check: "At most one OperatingBudget per (aircraft_id, fiscal_year)"
    error_id: ERR_BUDGET_YEAR_EXISTS
    http_status: 409
    applies_to: "POST /budgets"

  - priority: 8
    category: business_constraint
    check: "At most one MonthlyStatement per (aircraft_id, period) in CERTIFIED or DELIVERED; generating over an existing DRAFT recomputes and returns that DRAFT instead of creating a duplicate"
    error_id: ERR_STATEMENT_EXISTS
    http_status: 409
    applies_to: "POST /statements"

  - priority: 8
    category: business_constraint
    check: "Statement certification: acting X-User-ID must differ from the statement's prepared_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /statements/{id}/certify"

  - priority: 8
    category: business_constraint
    check: "release-records: every record_id must identify a MaintenanceEvent or ComplianceFiling of the agreement's aircraft"
    error_id: ERR_RECORD_NOT_IN_SCOPE
    http_status: 422
    applies_to: "POST /agreements/{id}/release-records"

  - priority: 8
    category: business_constraint
    check: "release-records: no named record may already have handed_over_at set"
    error_id: ERR_RECORD_ALREADY_RELEASED
    http_status: 409
    applies_to: "POST /agreements/{id}/release-records"

  - priority: 8
    category: business_constraint
    check: "complete-termination: records_released must equal records_total"
    error_id: ERR_HANDOVER_INCOMPLETE
    http_status: 409
    applies_to: "POST /agreements/{id}/complete-termination"

  - priority: 8
    category: business_constraint
    check: "complete-termination: no TripRequest of the aircraft in REQUESTED/APPROVED/SCHEDULED and no MaintenanceProgram in ENROLLED"
    error_id: ERR_OPEN_OBLIGATIONS
    http_status: 409
    applies_to: "POST /agreements/{id}/complete-termination"

  - priority: 8
    category: business_constraint
    check: "CHARTER trips must carry charter_quote_cents; expenses with category CHARTER_DIRECT must carry trip_id of an existing CHARTER trip, and other categories must not carry trip_id"
    error_id: ERR_QUOTE_REQUIRED
    http_status: 422
    applies_to: "POST /trips, POST /expenses"

  - priority: 9
    category: business_fiscal
    check: "Statement certification: no POSTED expense of the aircraft with service_date in period may exist that was created after the statement's last (re)computation"
    error_id: ERR_STATEMENT_STALE
    http_status: 409
    applies_to: "POST /statements/{id}/certify"

  - priority: 10
    category: state
    check: "OCC: PATCH /agreements/{id}/terms requires expected_agreement_version to equal the agreement's current version"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "PATCH /agreements/{id}/terms"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Owner ---
  - method: POST
    path: "/owners"
    description: "Onboard an aircraft owner"
    roles: [AccountExecutive]
    code: 201
    input: [legal_name, contact_email]
    output: Owner
    side_effects: []
  - method: GET
    path: "/owners/{id}"
    description: "Fetch one owner"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: Owner
    side_effects: []

  # --- Aircraft ---
  - method: POST
    path: "/aircraft"
    description: "Register an aircraft under an owner"
    roles: [AccountExecutive]
    code: 201
    input: [owner_id, tail_number, model, home_base_icao]
    output: Aircraft
    side_effects: []
  - method: GET
    path: "/aircraft/{id}"
    description: "Fetch one aircraft"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: Aircraft
    side_effects: []
  - method: GET
    path: "/aircraft"
    description: "List aircraft, optionally filtered by owner"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: ["owner_id?"]
    output: "Aircraft[]"
    side_effects: []

  # --- ManagementAgreement ---
  - method: POST
    path: "/agreements"
    description: "Create a management agreement (starts PENDING)"
    roles: [AccountExecutive]
    code: 201
    input: [owner_id, aircraft_id, monthly_management_fee_cents, variable_fee_pct, charter_owner_share_pct, tax_allocation_method]
    output: ManagementAgreement
    side_effects: []
  - method: GET
    path: "/agreements/{id}"
    description: "Fetch one agreement"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: ManagementAgreement
    side_effects: []
  - method: GET
    path: "/agreements"
    description: "List agreements, optionally filtered by owner and/or aircraft"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: ["owner_id?", "aircraft_id?"]
    output: "ManagementAgreement[]"
    side_effects: []
  - method: PATCH
    path: "/agreements/{id}/terms"
    description: "Amend commercial terms while ACTIVE; OCC-guarded by expected_agreement_version"
    roles: [AccountExecutive]
    code: 200
    input: [expected_agreement_version, "monthly_management_fee_cents?", "variable_fee_pct?", "charter_owner_share_pct?", "tax_allocation_method?"]
    output: ManagementAgreement
    side_effects: ["increments ManagementAgreement.version by 1"]
  - method: POST
    path: "/agreements/{id}/activate"
    description: "Activate a PENDING agreement"
    roles: [AccountExecutive]
    code: 200
    input: []
    output: ManagementAgreement
    side_effects: ["increments ManagementAgreement.version by 1"]
  - method: POST
    path: "/agreements/{id}/give-termination-notice"
    description: "Owner or manager gives termination notice; snapshots records_total and cascade-cancels open trips"
    roles: [AccountExecutive, Owner]
    code: 200
    input: []
    output: ManagementAgreement
    side_effects:
      - "snapshots records_total (MaintenanceEvent + ComplianceFiling count for the aircraft)"
      - "cancels all REQUESTED/APPROVED/SCHEDULED TripRequests of the aircraft; each cancellation releases its ASSIGNED DutyAssignments"
      - "increments ManagementAgreement.version by 1"
  - method: POST
    path: "/agreements/{id}/release-records"
    description: "Release a batch of maintenance/compliance records to the owner during handover"
    roles: [AccountExecutive]
    code: 200
    input: [record_ids]
    output: ManagementAgreement
    side_effects:
      - "sets handed_over_at on each named record; records_released += batch size; first release moves agreement to HANDOVER_IN_PROGRESS"
      - "increments ManagementAgreement.version by 1"
  - method: POST
    path: "/agreements/{id}/complete-termination"
    description: "Complete termination once records handover is complete and no open obligations remain"
    roles: [AccountExecutive]
    code: 200
    input: []
    output: ManagementAgreement
    side_effects:
      - "SUSPENDED MaintenancePrograms of the aircraft become CANCELLED"
      - "increments ManagementAgreement.version by 1"

  # --- OperatingBudget ---
  - method: POST
    path: "/budgets"
    description: "Draft an annual operating budget for an aircraft"
    roles: [AccountExecutive]
    code: 201
    input: [aircraft_id, fiscal_year, fuel_cents, maintenance_cents, crew_cents, hangar_cents, insurance_cents, other_cents]
    output: OperatingBudget
    side_effects: []
  - method: GET
    path: "/aircraft/{id}/budgets"
    description: "List budgets of an aircraft"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: "OperatingBudget[]"
    side_effects: []
  - method: PATCH
    path: "/budgets/{id}"
    description: "Revise budget amounts; a REJECTED budget returns to DRAFT"
    roles: [AccountExecutive]
    code: 200
    input: ["fuel_cents?", "maintenance_cents?", "crew_cents?", "hangar_cents?", "insurance_cents?", "other_cents?"]
    output: OperatingBudget
    side_effects: ["REJECTED -> DRAFT when revised; rejection_reason cleared"]
  - method: POST
    path: "/budgets/{id}/submit"
    description: "Submit a DRAFT budget to the owner"
    roles: [AccountExecutive]
    code: 200
    input: []
    output: OperatingBudget
    side_effects: []
  - method: POST
    path: "/budgets/{id}/approve"
    description: "Owner approves a SUBMITTED budget"
    roles: [Owner]
    code: 200
    input: []
    output: OperatingBudget
    side_effects: []
  - method: POST
    path: "/budgets/{id}/reject"
    description: "Owner rejects a SUBMITTED budget"
    roles: [Owner]
    code: 200
    input: ["reason?"]
    output: OperatingBudget
    side_effects: ["records rejection_reason"]

  # --- Expense ---
  - method: POST
    path: "/expenses"
    description: "Post an actual cost against an aircraft"
    roles: [FinanceController]
    code: 201
    input: [aircraft_id, category, amount_cents, service_date, vendor_name, tax_use, "paid_date?", "trip_id?"]
    output: Expense
    side_effects: ["any DRAFT MonthlyStatement covering service_date's period is recomputed"]
  - method: GET
    path: "/expenses/{id}"
    description: "Fetch one expense"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: Expense
    side_effects: []
  - method: GET
    path: "/expenses"
    description: "List expenses with optional filters"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: ["aircraft_id?", "statement_id?", "trip_id?", "status?", "category?"]
    output: "Expense[]"
    side_effects: []
  - method: POST
    path: "/expenses/{id}/void"
    description: "Void a POSTED expense"
    roles: [FinanceController]
    code: 200
    input: []
    output: Expense
    side_effects: ["any DRAFT MonthlyStatement covering the expense's period is recomputed"]

  # --- MonthlyStatement ---
  - method: POST
    path: "/statements"
    description: "Generate (or recompute an existing DRAFT of) the monthly operating statement for an aircraft and period"
    roles: [AccountExecutive]
    code: 201
    input: [aircraft_id, period]
    output: MonthlyStatement
    side_effects: ["runs statement_accrual_cash_totals, management_fee_assessment, budget_variance, tax_use_allocation; sets prepared_by_user_id"]
  - method: GET
    path: "/statements/{id}"
    description: "Fetch one statement"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: MonthlyStatement
    side_effects: []
  - method: GET
    path: "/aircraft/{id}/statements"
    description: "List statements of an aircraft"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: "MonthlyStatement[]"
    side_effects: []
  - method: POST
    path: "/statements/{id}/certify"
    description: "FinanceController certifies a DRAFT statement; locks in-period POSTED expenses to BILLED; certifier must differ from preparer"
    roles: [FinanceController]
    code: 200
    input: []
    output: MonthlyStatement
    side_effects: ["in-period POSTED expenses become BILLED with statement_id set", "sets certified_by_user_id"]
  - method: POST
    path: "/statements/{id}/deliver"
    description: "Deliver a CERTIFIED statement to the owner"
    roles: [AccountExecutive]
    code: 200
    input: []
    output: MonthlyStatement
    side_effects: []

  # --- CrewMember ---
  - method: POST
    path: "/crew"
    description: "Hire a crew member for an aircraft"
    roles: [FlightOpsManager]
    code: 201
    input: [aircraft_id, full_name, crew_role, hire_date]
    output: CrewMember
    side_effects: []
  - method: GET
    path: "/crew/{id}"
    description: "Fetch one crew member (includes computed duty accumulators)"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: CrewMember
    side_effects: []
  - method: GET
    path: "/aircraft/{id}/crew"
    description: "List crew of an aircraft"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: "CrewMember[]"
    side_effects: []
  - method: POST
    path: "/crew/{id}/begin-training"
    description: "Move a HIRED crew member into training"
    roles: [FlightOpsManager]
    code: 200
    input: []
    output: CrewMember
    side_effects: []
  - method: POST
    path: "/crew/{id}/complete-training"
    description: "Complete training; qualifies the crew member when hours and check ride pass"
    roles: [FlightOpsManager]
    code: 200
    input: [training_hours, check_ride_passed]
    output: CrewMember
    side_effects: ["training_hours_accumulated += training_hours"]
  - method: POST
    path: "/crew/{id}/deactivate"
    description: "Deactivate a crew member; releases their ASSIGNED duty assignments on non-terminal trips"
    roles: [FlightOpsManager]
    code: 200
    input: []
    output: CrewMember
    side_effects: ["ASSIGNED DutyAssignments of this crew member on REQUESTED/APPROVED/SCHEDULED trips become RELEASED"]

  # --- TripRequest ---
  - method: POST
    path: "/trips"
    description: "Request a trip; OWNER_USE trips auto-approve, CHARTER trips await owner approval"
    roles: [FlightOpsManager, Owner]
    code: 201
    input: [aircraft_id, trip_use, depart_icao, arrive_icao, departure_at, block_hours_est, "charter_quote_cents?"]
    output: TripRequest
    side_effects: ["OWNER_USE trips transition REQUESTED -> APPROVED at creation"]
  - method: GET
    path: "/trips/{id}"
    description: "Fetch one trip"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: TripRequest
    side_effects: []
  - method: GET
    path: "/aircraft/{id}/trips"
    description: "List trips of an aircraft"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: "TripRequest[]"
    side_effects: []
  - method: POST
    path: "/trips/{id}/approve"
    description: "Owner approves a REQUESTED charter trip"
    roles: [Owner]
    code: 200
    input: []
    output: TripRequest
    side_effects: []
  - method: POST
    path: "/trips/{id}/decline"
    description: "Owner declines a REQUESTED charter trip"
    roles: [Owner]
    code: 200
    input: ["reason?"]
    output: TripRequest
    side_effects: ["records decline_reason"]
  - method: POST
    path: "/trips/{id}/resubmit"
    description: "Resubmit a DECLINED trip with optionally revised terms"
    roles: [FlightOpsManager, Owner]
    code: 200
    input: ["departure_at?", "block_hours_est?", "charter_quote_cents?"]
    output: TripRequest
    side_effects: ["clears decline_reason; applies revised fields"]
  - method: POST
    path: "/trips/{id}/schedule"
    description: "Schedule an APPROVED trip after agreement, maintenance, insurance, crew-complement, and aircraft-overlap gates"
    roles: [FlightOpsManager]
    code: 200
    input: []
    output: TripRequest
    side_effects: []
  - method: POST
    path: "/trips/{id}/complete"
    description: "Complete a SCHEDULED trip with actual block hours; drives hours accrual, charter credit, program accrual, and crew flight hours"
    roles: [FlightOpsManager]
    code: 200
    input: [block_hours_actual]
    output: TripRequest
    side_effects:
      - "aircraft.total_time_hours += block_hours_actual"
      - "CHARTER: computes owner_credit_cents / charter_shortfall_cents"
      - "ENROLLED MaintenanceProgram: creates PROGRAM_ACCRUAL Expense"
      - "ASSIGNED DutyAssignments become COMPLETED; crew flight_hours_total += block_hours_actual"
      - "DRAFT MonthlyStatement covering the period is recomputed"
  - method: POST
    path: "/trips/{id}/cancel"
    description: "Cancel a non-terminal trip; releases its ASSIGNED duty assignments"
    roles: [FlightOpsManager, Owner]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["ASSIGNED DutyAssignments of this trip become RELEASED"]
  - method: POST
    path: "/trips/{id}/void"
    description: "Void a COMPLETED trip (data error); reverses airframe hours and the unbilled program accrual"
    roles: [FlightOpsManager]
    code: 200
    input: []
    output: TripRequest
    side_effects:
      - "aircraft.total_time_hours -= block_hours_actual"
      - "completion-created PROGRAM_ACCRUAL expense becomes VOID"
      - "owner_credit_cents / charter_shortfall_cents reset to null"
      - "DRAFT MonthlyStatement covering the period is recomputed"

  # --- DutyAssignment ---
  - method: POST
    path: "/assignments"
    description: "Assign crew to a trip with a duty window"
    roles: [FlightOpsManager]
    code: 201
    input: [trip_id, crew_member_id, duty_role, duty_start_at, duty_end_at]
    output: DutyAssignment
    side_effects: ["crew duty_hours_7d / duty_hours_28d increase by duty_hours"]
  - method: GET
    path: "/assignments/{id}"
    description: "Fetch one assignment"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: DutyAssignment
    side_effects: []
  - method: GET
    path: "/assignments"
    description: "List assignments with optional filters"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: ["trip_id?", "crew_member_id?", "status?"]
    output: "DutyAssignment[]"
    side_effects: []
  - method: DELETE
    path: "/assignments/{id}"
    description: "Release an ASSIGNED duty assignment"
    roles: [FlightOpsManager]
    code: 200
    input: []
    output: DutyAssignment
    side_effects: ["crew duty_hours_7d / duty_hours_28d decrease by duty_hours"]

  # --- MaintenanceProgram ---
  - method: POST
    path: "/programs"
    description: "Quote an hourly-cost maintenance program for an aircraft"
    roles: [MaintenancePlanner]
    code: 201
    input: [aircraft_id, program_name, rate_per_hour_cents]
    output: MaintenanceProgram
    side_effects: []
  - method: GET
    path: "/programs/{id}"
    description: "Fetch one program"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: MaintenanceProgram
    side_effects: []
  - method: GET
    path: "/aircraft/{id}/programs"
    description: "List programs of an aircraft"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: "MaintenanceProgram[]"
    side_effects: []
  - method: POST
    path: "/programs/{id}/enroll"
    description: "Enroll a QUOTED program or resume a SUSPENDED one"
    roles: [MaintenancePlanner, AccountExecutive]
    code: 200
    input: []
    output: MaintenanceProgram
    side_effects: []
  - method: POST
    path: "/programs/{id}/suspend"
    description: "Suspend an ENROLLED program (accrual stops)"
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: MaintenanceProgram
    side_effects: []
  - method: POST
    path: "/programs/{id}/cancel"
    description: "Cancel a program"
    roles: [AccountExecutive]
    code: 200
    input: []
    output: MaintenanceProgram
    side_effects: []

  # --- MaintenanceEvent ---
  - method: POST
    path: "/events"
    description: "Create a base maintenance event forecast with an explicit due hour reading"
    roles: [MaintenancePlanner]
    code: 201
    input: [aircraft_id, event_code, interval_hours, due_at_aircraft_hours]
    output: MaintenanceEvent
    side_effects: []
  - method: GET
    path: "/events/{id}"
    description: "Fetch one maintenance event"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: MaintenanceEvent
    side_effects: []
  - method: GET
    path: "/events"
    description: "List maintenance events with optional filters (previous_event_id lists a chain's successors)"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: ["aircraft_id?", "previous_event_id?", "status?"]
    output: "MaintenanceEvent[]"
    side_effects: []
  - method: POST
    path: "/events/{id}/schedule"
    description: "Schedule a FORECAST event"
    roles: [MaintenancePlanner]
    code: 200
    input: [scheduled_date]
    output: MaintenanceEvent
    side_effects: ["sets scheduled_date"]
  - method: POST
    path: "/events/{id}/complete"
    description: "Complete a SCHEDULED event; records actual airframe hours and spawns the successor forecast"
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: MaintenanceEvent
    side_effects:
      - "sets completed_at and actual_aircraft_hours"
      - "auto-creates successor FORECAST event with previous_event_id = this event and due_at_aircraft_hours = actual_aircraft_hours + interval_hours"

  # --- ComplianceFiling ---
  - method: POST
    path: "/filings"
    description: "Draft an insurance or regulatory filing"
    roles: [ComplianceOfficer]
    code: 201
    input: [aircraft_id, filing_kind, authority, reference_no, valid_until]
    output: ComplianceFiling
    side_effects: []
  - method: GET
    path: "/filings/{id}"
    description: "Fetch one filing"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: []
  - method: GET
    path: "/aircraft/{id}/filings"
    description: "List filings of an aircraft"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: "ComplianceFiling[]"
    side_effects: []
  - method: POST
    path: "/filings/{id}/file"
    description: "File a DRAFT or re-file a REJECTED filing"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reference_no?", "valid_until?"]
    output: ComplianceFiling
    side_effects: ["sets filed_at"]
  - method: POST
    path: "/filings/{id}/record-decision"
    description: "Record the authority's decision on a FILED filing"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "notes?"]
    output: ComplianceFiling
    side_effects: ["records decision_notes"]

  # --- VendorContract ---
  - method: POST
    path: "/contracts"
    description: "Draft a hangar or fuel vendor contract"
    roles: [ContractsManager]
    code: 201
    input: [aircraft_id, vendor_kind, vendor_name, unit, rate_cents_per_unit, term_start, term_end]
    output: VendorContract
    side_effects: []
  - method: GET
    path: "/contracts/{id}"
    description: "Fetch one contract"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: VendorContract
    side_effects: []
  - method: GET
    path: "/aircraft/{id}/contracts"
    description: "List contracts of an aircraft"
    roles: [AccountExecutive, Owner, FlightOpsManager, MaintenancePlanner, FinanceController, ComplianceOfficer, ContractsManager]
    code: 200
    input: []
    output: "VendorContract[]"
    side_effects: []
  - method: POST
    path: "/contracts/{id}/propose"
    description: "Propose terms (from DRAFT) or re-propose revised terms (from COUNTERED)"
    roles: [ContractsManager]
    code: 200
    input: ["rate_cents_per_unit?"]
    output: VendorContract
    side_effects: ["rate_cents_per_unit updated when supplied"]
  - method: POST
    path: "/contracts/{id}/counter"
    description: "Record a vendor counter-offer with a revised rate"
    roles: [ContractsManager]
    code: 200
    input: [rate_cents_per_unit]
    output: VendorContract
    side_effects: ["rate_cents_per_unit updated"]
  - method: POST
    path: "/contracts/{id}/execute"
    description: "Execute the contract at the currently proposed terms"
    roles: [AccountExecutive]
    code: 200
    input: []
    output: VendorContract
    side_effects: []
  - method: POST
    path: "/contracts/{id}/expire"
    description: "Expire a contract still in negotiation"
    roles: [ContractsManager]
    code: 200
    input: []
    output: VendorContract
    side_effects: []

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advances to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint, or owner-scoped action attempted by a non-owner X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-supplied FK reference does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing, invalid enum/date format, non-positive amount, duty_start_at >= duty_end_at, term_start >= term_end, malformed period, or crew member not dedicated to the trip's aircraft" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Agreement transition precondition failed, or trip scheduling attempted while the aircraft's agreement is not ACTIVE" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version does not equal the agreement's current version on PATCH /agreements/{id}/terms" }
  - { id: ERR_AGREEMENT_CONFLICT_EXISTS, http: 409, condition: "A live (non-TERMINATED) agreement already exists for the aircraft" }
  - { id: ERR_HANDOVER_INCOMPLETE, http: 409, condition: "complete-termination attempted while records_released < records_total" }
  - { id: ERR_OPEN_OBLIGATIONS, http: 409, condition: "complete-termination attempted with non-terminal trips or an ENROLLED maintenance program" }
  - { id: ERR_RECORD_NOT_IN_SCOPE, http: 422, condition: "release-records names a record that is not a MaintenanceEvent or ComplianceFiling of the agreement's aircraft" }
  - { id: ERR_RECORD_ALREADY_RELEASED, http: 409, condition: "release-records names a record whose handed_over_at is already set" }
  - { id: ERR_BUDGET_INVALID_STATE, http: 409, condition: "Budget transition precondition failed" }
  - { id: ERR_BUDGET_YEAR_EXISTS, http: 409, condition: "A budget already exists for this (aircraft_id, fiscal_year)" }
  - { id: ERR_TAIL_NUMBER_EXISTS, http: 409, condition: "tail_number already registered" }
  - { id: ERR_EXPENSE_NOT_POSTED, http: 409, condition: "Expense not POSTED (void), or trip void attempted after its program accrual was BILLED" }
  - { id: ERR_STATEMENT_EXISTS, http: 409, condition: "A CERTIFIED or DELIVERED statement already exists for this (aircraft_id, period)" }
  - { id: ERR_STATEMENT_INVALID_STATE, http: 409, condition: "Statement transition precondition failed (certify requires DRAFT, deliver requires CERTIFIED)" }
  - { id: ERR_STATEMENT_STALE, http: 409, condition: "A POSTED expense in the statement's period is not reflected in the statement's last computation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Statement certifier X-User-ID equals prepared_by_user_id" }
  - { id: ERR_CREW_INVALID_STATE, http: 409, condition: "Crew member transition precondition failed" }
  - { id: ERR_CREW_NOT_QUALIFIED, http: 409, condition: "Assignment attempted for a crew member not in QUALIFIED status" }
  - { id: ERR_INSUFFICIENT_TRAINING, http: 422, condition: "complete-training with training_hours < 25 or check_ride_passed false" }
  - { id: ERR_DUTY_LIMIT_EXCEEDED, http: 422, condition: "Projected 7-day or 28-day duty total strictly exceeds its limit" }
  - { id: ERR_CREW_OVERLAP, http: 409, condition: "New duty window has a strictly positive intersection with another ASSIGNED/COMPLETED duty window of the crew member" }
  - { id: ERR_AIRCRAFT_OVERLAP, http: 409, condition: "Aircraft occupancy would leave < 1h turnaround gap to another SCHEDULED/COMPLETED trip" }
  - { id: ERR_CREW_COMPLEMENT_INCOMPLETE, http: 409, condition: "Trip scheduling without at least one QUALIFIED captain as PIC and one QUALIFIED first officer as SIC assigned" }
  - { id: ERR_INSURANCE_NOT_CURRENT, http: 409, condition: "No ACCEPTED INSURANCE_COI filing valid through the departure date" }
  - { id: ERR_MAINTENANCE_OVERDUE, http: 409, condition: "A FORECAST or SCHEDULED maintenance event is due at or below the aircraft's current total_time_hours" }
  - { id: ERR_TRIP_INVALID_STATE, http: 409, condition: "Trip transition precondition failed" }
  - { id: ERR_QUOTE_REQUIRED, http: 422, condition: "CHARTER trip without charter_quote_cents, or CHARTER_DIRECT expense without a CHARTER trip_id, or non-CHARTER_DIRECT expense carrying trip_id" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "Assignment transition precondition failed" }
  - { id: ERR_PROGRAM_INVALID_STATE, http: 409, condition: "Program transition precondition failed" }
  - { id: ERR_EVENT_INVALID_STATE, http: 409, condition: "Event transition precondition failed" }
  - { id: ERR_FILING_INVALID_STATE, http: 409, condition: "Filing transition precondition failed" }
  - { id: ERR_CONTRACT_INVALID_STATE, http: 409, condition: "Contract transition precondition failed" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Owner
    description: "Aircraft owner; approves budgets and charter trips, may give termination notice; owner-scoped actions check X-User-ID == agreement.owner_id"
    identity: entity_backed:Owner
    exclusive_operations: [budget approve/reject, trip approve/decline]
    shared_operations: [give-termination-notice, trip create/cancel/resubmit, read access]

  - name: AccountExecutive
    description: "Management company account executive; runs the agreement lifecycle, budgets, statements, and contract execution"
    identity: opaque
    exclusive_operations: [owner onboarding, aircraft registration, agreement create/activate/terms/release-records/complete-termination, budget draft/submit/revise, statement generate/deliver, program cancel, contract execute]
    shared_operations: [give-termination-notice, program enroll, read access]

  - name: FlightOpsManager
    description: "Flight operations manager; crew hiring/training, trip dispatch, duty scheduling"
    identity: opaque
    exclusive_operations: [crew hire/training/deactivate, trip schedule/complete/void, duty assignment create/release]
    shared_operations: [trip create/cancel/resubmit, read access]

  - name: MaintenancePlanner
    description: "Maintenance planner; maintenance program enrollment and event forecasting"
    identity: opaque
    exclusive_operations: [program create/suspend, event create/schedule/complete]
    shared_operations: [program enroll, read access]

  - name: FinanceController
    description: "Finance controller; posts expenses and certifies statements (segregated from statement preparation)"
    identity: opaque
    exclusive_operations: [expense post/void, statement certify]
    shared_operations: [read access]

  - name: ComplianceOfficer
    description: "Compliance officer; insurance and regulatory filings"
    identity: opaque
    exclusive_operations: [filing create/file/record-decision]
    shared_operations: [read access]

  - name: ContractsManager
    description: "Contracts manager; hangar and fuel vendor negotiation"
    identity: opaque
    exclusive_operations: [contract create/propose/counter/expire]
    shared_operations: [read access]

  - name: PlatformAdmin
    description: "Test-driving operator; only the logical clock endpoint"
    identity: opaque
    exclusive_operations: [clock set]
    shared_operations: []
