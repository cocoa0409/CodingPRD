          trigger:
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1}", team_id: "${t_a}", allocated_seats: 1, window_start_week: "2026-W38", window_end_week: "2026-W38", expected_neighborhood_version: "${na_v1}" }
              as: WorkplaceProgramOffice
