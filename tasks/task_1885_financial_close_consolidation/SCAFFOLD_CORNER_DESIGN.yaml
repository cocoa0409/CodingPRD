              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_id: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/periods/${per_id}/fx-rates", payload: { from_currency: USD, to_currency: USD, rate_kind: PERIOD_END, rate: 1.0, effective_at: "2026-01-31T00:00:00Z" }, as: Controller }
            - { call: "POST /close/entity-periods/${ep_id}/translate", payload: {}, as: Controller }
            - { call: "POST /close/entity-periods/${ep_id}/mark-reconciled", payload: {}, as: Preparer }
            - { call: "POST /close/entity-periods/${ep_id}/ready", payload: {}, as: Preparer }
          trigger:
            # use the version captured at CREATE time — now stale after open/cascades bumped it
            - call: "POST /close/periods/${per_id}/soft-lock"
              payload: { expected_close_period_version: "${per_v_create}" }
              as: Controller
              captures: { err: $.data.error_id }
          assert:
