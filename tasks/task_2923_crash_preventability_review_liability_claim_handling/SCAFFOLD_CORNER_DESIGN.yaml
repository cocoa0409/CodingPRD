            - "${e_tower} == ERR_POLICY_TOWER_MALFORMED with HTTP 409 — index 4 must attach at 35,000,000 (the cumulative limits below), not 30,000,000, and the layer is not persisted"
            - "${e_dup} == ERR_POLICY_LAYER_DUPLICATE with HTTP 409 — layer_index 2 already exists in program year 2026; GET /policy-layers?program_year=2026 still returns exactly 3 rows"
            - "${out0} == 15500000 and ${exp0} == 15500000"
            - "${settled} == 12000000, ${alae} == 1440000 == round_half_up(12,000,000 * 0.12) (MID tier, keyed on the indemnity alone) and ${total} == 13440000"
            - "${alloc} has exactly TWO entries in ascending layer_index order: {layer_index 1, layer_type SIR, allocated_cents 10000000} then {layer_index 2, layer_type PRIMARY, allocated_cents 3440000}"
            - "No entry references ${pl3} — the EXCESS layer receives nothing because the total was absorbed below its attachment point"
            - "${sir} == 10000000 and ${insured} == 3440000 — SIR erosion and insured payment are split by layer_type, and 10,000,000 + 3,440,000 == ${total}"
            - "${ind} == 12000000, ${alae_paid} == 1440000, ${out1} == 2060000 and ${h} == SETTLEMENT_COMPLETE"
            - "${exp1} == 15500000 unchanged and ${inc1} == 15500000 — the settlement moved cents between buckets rather than creating them"
            - "${rounds} carries exactly 1 row, ${r_id}, with outcome ACCEPTED and carrier_offer_cents 12000000"

      - name: dual_variant_determination_diverges_on_the_same_ballots
        claim_type: variant_divergence
        grounds:
          - calculations.preventability_determination.variants
          - complexity_profile.complexity_layers
        distinguishing_aspect: "The same ballot set decides PREVENTABLE under weighted_criteria and NON_PREVENTABLE under unweighted_majority, so the recorded determination depends entirely on the crash's evidence_posture."
        excluded_because:
          difficulty_instance: preventability_variant_divergence_weighted_vs_majority
          rationale: "That §1.8 instance runs the identical three-ballot set on two crashes that differ only in evidence_posture (COMPLETE versus COMPROMISED) and asserts both determinations, both decision_basis values and the identical committee_score, which is the divergence claim plus its delta."

      - name: reserve_variant_is_selected_by_the_basis_input
        claim_type: variant_selection
        grounds:
          - calculations.claim_reserve.variants
          - endpoints[POST /claims/{id}/reserve-revisions]
        distinguishing_aspect: "provisional_at_setup is applied at POST /claims and on a PROVISIONAL_REFRESH revision, while demand_weighted is applied only when basis is DEMAND_BASED, so the same claim yields two different reserves depending on the input."
        excluded_because:
          difficulty_instance: claim_reserve_provisional_refresh_vs_demand_based
          rationale: "That §1.8 instance posts both bases back to back on one claim with demands present and pins the two different revised_reserve_cents values, which is exactly the variant-selection claim."

      - name: reserve_variant_switch_reconciles_the_outstanding_ledger
        claim_type: reconciliation
        grounds:
          - state_machines.Claim.reserve_status
          - calculations.claim_reserve
          - invariants.claim_exposure_conserved
        distinguishing_aspect: "When the reserve variant switches, outstanding_reserve_cents is recomputed as revised minus everything already paid, so the delta lands in claim_exposure_cents and nowhere else."
        excluded_because:
          difficulty_instance: claim_parallel_handling_and_reserve_dimensions
          rationale: "That §1.8 instance interleaves settlements with revisions on one claim and asserts outstanding_reserve_cents and claim_exposure_cents after each, which is the reconciliation-on-switch claim including the paid-amount subtraction."

  # =========================================================================
  - section: validations
    instances:

      - name: negotiation_ladder_refuses_regressive_offers_and_rising_counters
        claim_type: violation_to_error
        grounds:
          - validations[priority=61]
          - state_machines.Demand.status
          - validations[priority=64]
        distinguishing_aspect: "Carrier positions must strictly increase and never exceed the demand while claimant counters must strictly exceed the standing offer and never exceed their own previous position, so a repeated offer and a raised counter are both refused while an equal counter and an offer equal to the demand are accepted."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One Terminal, one Driver, one MODERATE crash (claim provisional reserve 2,500,000 at multiplier 1.00) and a 2026 tower with a single 10,000,000 SIR layer so coverage never binds."
            - "Demand A for 2,000,000 THIRD_PARTY_PROPERTY (so the counsel gate never applies) and Demand B for 300,000 left untouched in DEMANDED."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Yellow Springs Terminal", terminal_code: "YSP02", region_code: "OH", annual_miles_millions: 3.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
