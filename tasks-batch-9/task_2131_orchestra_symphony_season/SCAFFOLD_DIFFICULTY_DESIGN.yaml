  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ticket_order_sale_state_beats_seat_capacity
        grounds:
          - validations[priority=7]
          - validations[priority=22]
          - errors[ERR_CONCERT_NOT_ON_SALE]
          - errors[ERR_INSUFFICIENT_SEATS]
          - endpoints[POST /orchestra/ticket-orders]
        distinguishing_aspect: |
          Error-category pair STATE (priority 7, ERR_CONCERT_NOT_ON_SALE) versus
          BUSINESS_FISCAL (priority 22, ERR_INSUFFICIENT_SEATS): a request that is both
          premature (sale_status RENEWAL_ONLY) and over-capacity (999 seats in a 100-seat
          section) must report the state error, never the capacity error.
        test_recipe:
          setup:
            - "Season 2027 advanced to RENEWAL_WINDOW only, so the programmed concert's sale_status is RENEWAL_ONLY"
            - "ORCHESTRA section holds 100 seats and nothing is held or sold"
            - "One patron exists"
