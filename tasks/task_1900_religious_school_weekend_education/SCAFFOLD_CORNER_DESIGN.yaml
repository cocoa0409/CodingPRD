            - { call: "POST /school/families", payload: { family_name: "Fam PM", primary_email: "pm@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id } }
            - { call: "POST /school/families/${fam}/students", payload: { full_name: "WrongGrade", grade: "G4", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { st_g: $.data.id } }
