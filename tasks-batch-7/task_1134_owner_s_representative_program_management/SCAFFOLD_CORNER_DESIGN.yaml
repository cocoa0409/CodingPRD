          - "errors[ERR_BASELINE_UNDERCUTS_COMMITMENTS]"
        distinguishing_aspect: "A replacement baseline whose contingency_total_cents (100000) is below outstanding committed+reserved+drawn (200000 from an approved CO) fails with ERR_BASELINE_UNDERCUTS_COMMITMENTS (402) — fiscal check at priority 10 after the OCC version check passes."
