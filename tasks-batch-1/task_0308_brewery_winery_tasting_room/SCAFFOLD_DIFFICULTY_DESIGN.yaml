      - name: product_activate_requires_batch_bottling_or_closed
        grounds:
          - state_machines.Product.DRAFT_to_ACTIVE
          - state_machines.ProductionBatch.AGING_to_BOTTLING
          - entities.ProductionBatch.fields.status
        distinguishing_aspect: |
          Different entity pair Product->ProductionBatch: a Product DRAFT->ACTIVATE is
          rejected with ERR_INVALID_STATE while its source batch is still AGING (not yet
          BOTTLING/CLOSED); product activation depends on the batch's state.
        test_recipe:
