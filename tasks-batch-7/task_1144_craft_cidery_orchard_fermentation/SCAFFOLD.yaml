  # --- FermentationBatch ---
  - method: POST
    path: "/cidery/fermentation-batches"
    description: "Pitch yeast into a tank with juice from a COMPLETE press batch"
    roles: [CellarLead]
    code: 201
    input: [press_batch_id, tank_id, yeast_program_id]
    output: FermentationBatch
    side_effects:
      - "Validates tank via tank_allocation_selector"
      - "Tank.status RESERVED -> FERMENTING (or EMPTY -> FERMENTING if not previously reserved)"
      - "Tank.current_batch_id set"
      - "original_gravity_brix = press_batch.blend_brix"
      - "volume_liters = press_batch.actual_juice_liters"
      - "status = PITCHED"

  - method: GET
    path: "/cidery/fermentation-batches/{batchId}"
    description: "Get a fermentation batch"
    roles: [CellarLead, PackagingOperator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: FermentationBatch
    side_effects: []

  - method: GET
    path: "/cidery/fermentation-batches"
    description: "List fermentation batches"
    roles: [CellarLead, PackagingOperator, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "tank_id?", "press_batch_id?", "yeast_program_id?", "back_blend_source_batch_id?"]
    output: "FermentationBatch[]"
    side_effects: []

  - method: POST
    path: "/cidery/fermentation-batches/{batchId}/readings"
    description: "Record a gravity reading"
    roles: [CellarLead]
    code: 200
    input: [gravity_brix]
    output: FermentationBatch
    side_effects:
      - "current_gravity_brix updated"
      - "abv_pct recomputed (provisional variant)"
      - "If first reading < original_gravity_brix: PITCHED -> FERMENTING"

  - method: POST
    path: "/cidery/fermentation-batches/{batchId}/age"
    description: "Move batch to AGING"
    roles: [CellarLead]
    code: 200
    input: []
    output: FermentationBatch
    side_effects: ["status -> AGING", "Tank.status -> AGING"]

  - method: POST
    path: "/cidery/fermentation-batches/{batchId}/ready"
    description: "Mark batch READY (aging complete)"
    roles: [CellarLead]
    code: 200
    input: []
    output: FermentationBatch
    side_effects: ["status -> READY"]

  - method: POST
    path: "/cidery/fermentation-batches/{batchId}/dump"
    description: "Dump a batch (PITCHED/FERMENTING/AGING -> DUMPED)"
    roles: [CellarLead]
    code: 200
    input: [reason]
    output: FermentationBatch
    side_effects:
      - "status -> DUMPED"
      - "Tank -> EMPTY; tank.current_batch_id = null"
      - "volume_liters -> 0"

  - method: POST
    path: "/cidery/fermentation-batches/{batchId}/back-blend"
    description: "Back-blend another batch's volume into this one (self-referential)"
    roles: [CellarLead]
    code: 200
    input: [source_batch_id, source_volume_liters]
    output: FermentationBatch
    side_effects:
      - "source_batch.volume_liters -= source_volume_liters"
      - "this.volume_liters += source_volume_liters"
      - "this.back_blend_source_batch_id = source_batch_id"
      - "this.back_blend_pct = source_volume_liters / this.volume_liters * 100 (after)"
      - "current_gravity_brix recomputed as weighted average"
      - "abv_pct recomputed"

