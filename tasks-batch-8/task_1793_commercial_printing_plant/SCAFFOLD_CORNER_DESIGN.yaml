# =============================================================================
# §1.9 Scaffold Corner Design — Commercial Printing Plant
# Breadth coverage of every §1.1-§1.7 claim not already probed by §1.8.
# Negative-path triggers capture $.data.error_id; all setup chains replay from
# empty DB using only §1.5 endpoints. Clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Customer.fields.default_tolerance_pct, entities.Customer.fields.posture, entities.Customer.fields.exposure_cents]
        distinguishing_aspect: "Omitting default_tolerance_pct yields 5; a fresh customer has exposure_cents 0 and posture ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { name: "Default Cust", credit_limit_cents: 1000000 }, as: PlantManager, captures: { cust: $.data.id } }
          assert:
            - "Customer.${cust}.default_tolerance_pct == 5"
            - "Customer.${cust}.exposure_cents == 0 and posture == ACTIVE and reprint_credit_balance_cents == 0"
            - "Customer.${cust}.version == 1"

      - name: customer_create_missing_required_name
        claim_type: required_fields
        grounds: [entities.Customer.fields.name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required name is rejected with ERR_VALIDATION and no customer is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { credit_limit_cents: 1000 }, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (http 400)"

      - name: customer_create_extra_field_rejected
        claim_type: system_fields
        grounds: [entities.Customer]
        distinguishing_aspect: "Client-supplied system fields (id, version, exposure_cents) are not accepted in the create body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { name: "X", credit_limit_cents: 1000, version: 99 }, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (unknown/read-only field rejected)"

      - name: estimate_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Estimate.fields.press_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "press_type OFFSET is outside the {WEB, SHEETFED} enum and is rejected before any pricing runs."
        test_recipe:
          setup: ["Customer and stock exist"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "E Cust", credit_limit_cents: 100000000 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "80G", grade: "COATED", cost_per_sheet_cents: 9, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
          trigger:
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "Bad", quantity_ordered: 100, press_type: "OFFSET", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 1000, rate_per_thousand_cents: 1000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: job_snapshot_fields_from_accept
        claim_type: computed_fields
        grounds: [entities.Job.fields.total_price_cents, entities.Job.fields.tolerance_pct, entities.Job.fields.production_status, entities.Job.fields.billing_status]
        distinguishing_aspect: "The Job created by accept snapshots estimate pricing (total 85000) and customer tolerance (7) at accept time, starts PREPRESS / UNBILLED with zero_charge false."
        test_recipe:
          setup: ["Customer (tolerance override 7) and a QUOTED estimate (total 85000)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Snap Cust", credit_limit_cents: 100000000, default_tolerance_pct: 7 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "Snap", quantity_ordered: 1000, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 50000, rate_per_thousand_cents: 30000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
          trigger:
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { job: $.data.id } }
          assert:
            - "Job.${job}.total_price_cents == 85000 and tolerance_pct == 7 (snapshot at accept)"
            - "Job.${job}.production_status == PREPRESS and billing_status == UNBILLED and zero_charge == false"
            - "Job.${job}.estimate_id == ${est} and parent_job_id == null and gang_run_id == null"

      - name: job_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /jobs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: customer_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "With 3 customers and limit=2, page 1 reports total_count 3 and has_more true; omitted limit defaults to 10."
        test_recipe:
          setup: ["3 customers exist"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "C1", credit_limit_cents: 1000 }, as: PlantManager }
            - { call: "POST /customers", payload: { name: "C2", credit_limit_cents: 1000 }, as: PlantManager }
            - { call: "POST /customers", payload: { name: "C3", credit_limit_cents: 1000 }, as: PlantManager }
          trigger:
            - { call: "GET /customers", payload: { limit: 2, offset: 0 }, as: PlantManager }
          assert:
            - "response contains total_count == 3 and has_more == true and exactly 2 data rows"
            - "response envelope has meta.api_request_id and response_type == array"

      - name: proof_round_number_increments_and_supersedes
        claim_type: computed_fields
        grounds: [entities.Proof.fields.round_number, state_machines.Proof.AWAITING_CUSTOMER_to_SUPERSEDED]
        distinguishing_aspect: "Second upload on the same job gets round_number 2 and flips the first proof to SUPERSEDED without any explicit transition call."
        test_recipe:
          setup: ["Accepted job in PREPRESS (minimal spec)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "P Cust", credit_limit_cents: 100000000 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "PJ", quantity_ordered: 100, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 1000, rate_per_thousand_cents: 1000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { job: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${job}", file_uri: "s3://r1.pdf" }, as: PrepressOperator, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /proofs", payload: { job_id: "${job}", file_uri: "s3://r2.pdf" }, as: PrepressOperator, captures: { p2: $.data.id } }
          assert:
            - "Proof.${p1}.status == SUPERSEDED and Proof.${p2}.round_number == 2 and status == AWAITING_CUSTOMER"
            - "Job.${job}.proof_rounds_used == 2"

      - name: paper_stock_available_sheets_computed
        claim_type: computed_fields
        grounds: [entities.PaperStock.fields.available_sheets, entities.PaperLot.fields.remaining_sheets]
        distinguishing_aspect: "available_sheets equals the sum of lot remaining_sheets: receive 3000+2000 across two POs -> 5000; damaged sheets reduce it (receive 2000 with 50 damaged -> lot remaining 1950)."
        test_recipe:
          setup: ["Stock exists; PO1 received 3000 good; PO2 received 2000 with 50 damaged"]
          setup_api_calls:
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /paper-purchase-orders", payload: { paper_stock_id: "${stock}", ordered_sheets: 3000, cost_per_sheet_cents: 5 }, as: PurchasingManager, captures: { po1: $.data.id } }
            - { call: "POST /paper-purchase-orders/${po1}/receive", payload: { sheets_received: 3000 }, as: PurchasingManager }
            - { call: "POST /paper-purchase-orders", payload: { paper_stock_id: "${stock}", ordered_sheets: 2000, cost_per_sheet_cents: 5 }, as: PurchasingManager, captures: { po2: $.data.id } }
            - { call: "POST /paper-purchase-orders/${po2}/receive", payload: { sheets_received: 2000, sheets_damaged: 50 }, as: PurchasingManager }
          trigger:
            - { call: "GET /paper-stocks/${stock}", payload: {}, as: PurchasingManager, captures: { avail: $.data.available_sheets } }
          assert:
            - "PaperStock.${stock}.available_sheets == 4950 (3000 + 1950)"

      - name: reprint_resolution_creates_child_job
        claim_type: parent_relationships
        grounds: [entities.Job.fields.parent_job_id, state_machines.ReprintClaim.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "REPRINT approval creates a child Job with parent_job_id set, quantity_ordered == defect_qty, zero_charge true, billing NOT_BILLABLE, production PREPRESS — discoverable via GET /jobs?parent_job_id."
        test_recipe:
          setup: ["SHIP job (Q=1000 minimal spec, total 85000) FULFILLED delivered 1000; claim filed and reviewed"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "RP Cust", credit_limit_cents: 100000000 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /paper-purchase-orders", payload: { paper_stock_id: "${stock}", ordered_sheets: 5000, cost_per_sheet_cents: 5 }, as: PurchasingManager, captures: { po: $.data.id } }
            - { call: "POST /paper-purchase-orders/${po}/receive", payload: { sheets_received: 5000 }, as: PurchasingManager }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "RJ", quantity_ordered: 1000, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 50000, rate_per_thousand_cents: 30000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { job: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${job}", file_uri: "s3://r.pdf" }, as: PrepressOperator, captures: { proof: $.data.id } }
            - { call: "POST /proofs/${proof}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /presses", payload: { name: "W1", press_type: "WEB", rated_impressions_per_hour: 10000, make_ready_minutes_base: 45, washup_buffer_minutes: 30 }, as: PlantManager, captures: { press: $.data.id, pv: $.data.version } }
            - { call: "POST /press-runs", payload: { press_id: "${press}", job_id: "${job}", run_quantity: 1000, scheduled_start: "2026-08-10T08:00:00Z", expected_press_version: "${pv}" }, as: PressScheduler, captures: { run: $.data.id } }
            - { call: "POST /press-runs/${run}/complete", payload: { gross_impressions: 1000, sheets_used: 1000, waste_sheets: 0 }, as: PressScheduler }
            - { call: "POST /bindery-tickets", payload: { job_id: "${job}", operation: "FOLD", sequence_no: 1 }, as: PlantManager, captures: { bt: $.data.id } }
            - { call: "POST /bindery-tickets/${bt}/complete", payload: { pieces_completed: 1000 }, as: PlantManager }
            - { call: "POST /jobs/${job}/record-delivery", payload: { delivered_quantity: 1000 }, as: PlantManager }
            - { call: "POST /reprint-claims", payload: { job_id: "${job}", claimed_defect: "BINDING_DEFECT", defect_qty: 250 }, as: Customer, as_user_id: "${cust}", captures: { claim: $.data.id } }
            - { call: "POST /reprint-claims/${claim}/review", payload: {}, as: PlantManager, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /reprint-claims/${claim}/approve", payload: { resolution: "REPRINT", liability_pct: 100 }, as: PlantManager, as_user_id: "pm-2", captures: { rjob: $.data.reprint_job_id } }
            - { call: "GET /jobs", payload: { parent_job_id: "${job}" }, as: PlantManager }
          assert:
            - "ReprintClaim.${claim}.status == APPROVED and resolution == REPRINT and reprint_job_id != null"
            - "Reprint job: parent_job_id == ${job}, quantity_ordered == 250, zero_charge == true, billing_status == NOT_BILLABLE, production_status == PREPRESS"
            - "GET /jobs?parent_job_id=${job} returns exactly 1 row"

  - section: state_machines
    instances:
      - name: estimate_accept_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Estimate, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accept is undefined from DRAFT; rejected with ERR_INVALID_STATE and the estimate stays DRAFT."
        test_recipe:
          setup: ["DRAFT estimate exists (never quoted)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "D Cust", credit_limit_cents: 100000000 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "DJ", quantity_ordered: 100, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 1000, rate_per_thousand_cents: 1000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
          trigger:
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and Estimate.${est}.status == DRAFT"

      - name: estimate_terminal_decline_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Estimate]
        distinguishing_aspect: "From DECLINED no transition exists: quote, accept, and decline again all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Estimate QUOTED then DECLINED"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "T Cust", credit_limit_cents: 100000000 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "TJ", quantity_ordered: 100, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 1000, rate_per_thousand_cents: 1000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/decline", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator, captures: { err1: $.data.error_id } }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_STATE and err2 == ERR_INVALID_STATE"
            - "Estimate.${est}.status == DECLINED"

      - name: estimate_revise_after_quote_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Estimate, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PUT /estimates/{id} is only valid from DRAFT; revising a QUOTED estimate fails even with the correct OCC version."
        test_recipe:
          setup: ["Estimate QUOTED (version advanced to 2 by quote)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "R Cust", credit_limit_cents: 100000000 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "RJ", quantity_ordered: 100, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 1000, rate_per_thousand_cents: 1000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator, captures: { ev: $.data.version } }
          trigger:
            - { call: "PUT /estimates/${est}", payload: { expected_estimate_version: "${ev}", quantity_ordered: 200 }, as: Estimator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (OCC passed, state gate fired)"

      - name: proof_approve_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.Proof, "errors[ERR_PROOF_NOT_AWAITING]"]
        distinguishing_aspect: "Approving an already-APPROVED proof fails with ERR_PROOF_NOT_AWAITING; no duplicate side effects on the job."
        test_recipe:
          setup: ["Proof approved (job PLATED)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "PA Cust", credit_limit_cents: 100000000 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "PJ", quantity_ordered: 100, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 1000, rate_per_thousand_cents: 1000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { job: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${job}", file_uri: "s3://p.pdf" }, as: PrepressOperator, captures: { proof: $.data.id } }
            - { call: "POST /proofs/${proof}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /proofs/${proof}/approve", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROOF_NOT_AWAITING"
            - "Job.${job}.production_status == PLATED (unchanged)"

      - name: proof_upload_after_plating_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Proof, entities.Proof.fields.job_id]
        distinguishing_aspect: "Proof upload requires job production_status in {PREPRESS, PROOF_REVIEW}; uploading once the job is PLATED fails with ERR_JOB_INVALID_STATE."
        test_recipe:
          setup: ["Job PLATED (proof approved)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "PU Cust", credit_limit_cents: 100000000 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "70U", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { stock: $.data.id } }
            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "PJ", quantity_ordered: 100, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 8, up_count: 1, paper_stock_id: "${stock}", make_ready_cents: 1000, rate_per_thousand_cents: 1000 } ], press_spoilage_pct: 0, bindery_spoilage_pct: 0, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { est: $.data.id } }
            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { job: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${job}", file_uri: "s3://p.pdf" }, as: PrepressOperator, captures: { proof: $.data.id } }
            - { call: "POST /proofs/${proof}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /proofs", payload: { job_id: "${job}", file_uri: "s3://late.pdf" }, as: PrepressOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_JOB_INVALID_STATE"

      - name: press_run_complete_twice_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.PressRun]
        distinguishing_aspect: "COMPLETE is terminal for a press run: a second complete fails with ERR_INVALID_STATE and does not double-consume paper."
        test_recipe:
          setup: ["Press run COMPLETE (Q=1000 job, sheets_used 1000); lot had 5000 received"]
          setup_api_calls:
