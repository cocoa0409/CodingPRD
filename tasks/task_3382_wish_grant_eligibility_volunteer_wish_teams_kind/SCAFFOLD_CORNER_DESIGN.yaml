        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: a referral is readable with all computed fields in the request right after creation; no reconciliation lag."
        test_recipe:
          setup: ["Chapter; clock at default."]
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "90012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref_id: $.data.id }
            - call: "GET /wish-grant/referrals/${ref_id}"
              as: ReferralSource
          assert:
            - "GET immediately after POST returns status PENDING_CERTIFICATION, age_months_at_intake == 125, source_type FAMILY, prognosis_months 12"
            - "the linked child is immediately visible: GET /wish-grant/children?chapter_id=${ch_id} total_count == 1"
