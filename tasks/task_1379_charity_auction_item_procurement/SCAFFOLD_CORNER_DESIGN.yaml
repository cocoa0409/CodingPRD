  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: sod_violation_on_self_approve
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_SOD_VIOLATION]"
        distinguishing_aspect: "Segregation of duties: a ValuationApprover whose X-User-ID equals the valuation's submitted_by_user_id is rejected with ERR_SOD_VIOLATION (403) even though the role is correct."
        test_recipe:
          setup:
            - "Event in SOLICITING; item with a SUBMITTED valuation submitted by po_1"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala SoD", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "DS", email: "ds@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Vase", ask_estimate_cents: 30000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Vase", description: "Ming", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it: "$.data.id", it_v: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 30000, fmv_source: "APPRAISAL", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va: "$.data.id" } }
          trigger:
            - { call: "POST /valuations/${va}/approve", payload: {}, as: ValuationApprover, as_user_id: "po_1", captures: { err_id: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SOD_VIOLATION (approver po_1 == submitter po_1)"
            - "Valuation.${va}.status remains SUBMITTED"

      - name: ack_threshold_exact_boundary
        claim_type: satisfaction_and_violation
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_ACK_THRESHOLD_NOT_MET]"
        distinguishing_aspect: "Acknowledgment issuance threshold is >= : FMV 24999 fails with ERR_ACK_THRESHOLD_NOT_MET while FMV 25000 issues successfully."
        test_recipe:
          setup:
            - "Event in SOLICITING; two donors with items valued 24999 and 25000 respectively, both APPROVED (acks auto-created PENDING)"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala Ack", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
