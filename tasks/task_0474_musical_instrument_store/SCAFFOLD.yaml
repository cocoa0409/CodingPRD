      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  # --- LessonEnrollment (lesson-studio linkage) -------------------------------
  - name: LessonEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: student_id, type: string, source: input, description: "FK -> Customer.id; the student" }
      - { name: rental_agreement_id, type: string, source: input, description: "FK -> RentalAgreement.id; the agreement that grants the bundle discount; null for standalone lessons", default: null }
      - { name: instrument_family, type: enum, source: input, description: "Lesson instrument family", constraints: "one of BAND, ORCHESTRA, GUITAR, KEYBOARD, OTHER" }
      - { name: sessions_per_month, type: integer, source: input, description: "Booked sessions per month", constraints: "> 0" }
      - { name: base_rate_cents, type: integer, source: input, description: "Per-session base rate in cents", constraints: ">= 0" }
      - { name: monthly_tuition_cents, type: integer, source: computed, description: "Monthly tuition after bundle discount (see §1.3 lesson_tuition)" }
