# =============================================================================
# task_0455_talent_agency_booking — §1.9 Scaffold Corner Design
# Breadth probe across claim-extraction-guide sections. setup_api_calls are
# directly executable against §1.5; formula-derived asserts are literals.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_agency_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Agency.fields.escrow_balance_cents
          - entities.Agency.fields.booked_day_count
          - endpoints[POST /agencies]
        distinguishing_aspect: "POST /agencies with name+commission_rate_bps returns 201; escrow_balance_cents and booked_day_count both initialize to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Agency.${agency_id}.escrow_balance_cents == 0"
            - "Agency.${agency_id}.booked_day_count == 0"
            - "Agency.${agency_id}.version == 1"

      - name: create_talent_missing_union_status_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Talent.fields.union_status
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /talents omitting required union_status returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Agency exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /talents"
              payload: { agency_id: "${agency_id}", full_name: "NoUnion", scale_rate_cents: 100000 }
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_talent_invalid_enum_union_status_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Talent.fields.union_status
          - validations[priority=4]
        distinguishing_aspect: "POST /talents with union_status='AFTRA' (not in {SAG,NON_UNION}) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Agency exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /talents"
              payload: { agency_id: "${agency_id}", full_name: "BadEnum", union_status: "AFTRA", scale_rate_cents: 100000 }
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_talent_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /talents/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /talents/{random-uuid} for an absent talent returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /talents/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: first_comp_card_is_primary_system_field
        claim_type: Computed Fields
        grounds:
          - entities.CompCard.fields.is_primary
          - endpoints[POST /comp-cards]
        distinguishing_aspect: "First CompCard for a talent has is_primary=true; the second created has is_primary=false."
        test_recipe:
          setup: ["Talent exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
            - call: "POST /talents"
              payload: { agency_id: "${agency_id}", full_name: "Tess", union_status: "SAG", scale_rate_cents: 100000 }
              as: Agent
              captures: { talent_id: $.data.id }
            - call: "POST /comp-cards"
              payload: { talent_id: "${talent_id}", headshot_url: "http://x/a.jpg", height_cm: 170, skills: ["act"] }
              as: Agent
              captures: { cc1_id: $.data.id }
          trigger:
            - call: "POST /comp-cards"
              payload: { talent_id: "${talent_id}", headshot_url: "http://x/b.jpg", height_cm: 170, skills: ["dance"] }
              as: Agent
              captures: { cc2_id: $.data.id, prim2: $.data.is_primary }
          assert:
            - "CompCard.${cc1_id}.is_primary == true"
            - "CompCard.${cc2_id}.is_primary == false"

      - name: list_talents_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /talents]
        distinguishing_aspect: "GET /talents returns an array response with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One talent exists."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
            - call: "POST /talents"
              payload: { agency_id: "${agency_id}", full_name: "Tess", union_status: "SAG", scale_rate_cents: 100000 }
              as: Agent
          trigger:
            - call: "GET /talents"
              payload: {}
              as: Agent
          assert:
            - "response.response_type == array"
            - "response.data has total_count and has_more"
            - "response.meta.api_request_id present"

      - name: create_talent_bad_agency_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Talent.fields.agency_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /talents referencing a non-existent agency_id returns ERR_NOT_FOUND (404) (FK integrity)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /talents"
              payload: { agency_id: "00000000-0000-4000-8000-000000000000", full_name: "Orphan", union_status: "SAG", scale_rate_cents: 100000 }
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

