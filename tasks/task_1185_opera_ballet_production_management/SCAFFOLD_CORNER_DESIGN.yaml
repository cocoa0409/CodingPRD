              as: PartnerRepresentative
              as_user_id: ${renter}
            - call: "POST /opera/rental-offers/${offer}/revise"
              payload: { per_performance_fee_cents: 490000 }
              as: ProductionManager
            - call: "POST /opera/rental-offers/${offer}/counter"
              payload: { countered_fee_cents: 2250000 }
              as: PartnerRepresentative
              as_user_id: ${renter}
            - call: "POST /opera/rental-offers/${offer}/revise"
              payload: { per_performance_fee_cents: 480000 }
              as: ProductionManager
            - call: "POST /opera/rental-offers/${offer}/counter"
              payload: { countered_fee_cents: 2300000 }
              as: PartnerRepresentative
              as_user_id: ${renter}
            - call: "POST /opera/rental-offers/${offer}/revise"
              payload: { per_performance_fee_cents: 470000 }
              as: ProductionManager
            - call: "POST /opera/rental-offers/${offer}/counter"
              payload: { countered_fee_cents: 2350000 }
              as: PartnerRepresentative
              as_user_id: ${renter}
            - call: "POST /opera/rental-offers/${offer}/revise"
              payload: { per_performance_fee_cents: 460000 }
              as: ProductionManager
            - call: "POST /opera/rental-offers/${offer}/counter"
              payload: { countered_fee_cents: 2400000 }
              as: PartnerRepresentative
              as_user_id: ${renter}
            - call: "POST /opera/rental-offers/${offer}/revise"
              payload: { per_performance_fee_cents: 450000 }
              as: ProductionManager
