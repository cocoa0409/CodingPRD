      - name: effect_cue_half_open_millisecond_interlock_buffer_binds_only_animation_channels
        grounds:
          - entities.EffectCue.fields.offset_ms
          - entities.EffectCue.fields.duration_ms
          - validations[priority 24].ERR_CUE_CHANNEL_CONFLICT
          - endpoints[POST /effect-cues]
        distinguishing_aspect: |
          Resource entity = EffectCue, contending for a (scene, discipline_channel) timeline rather than for the whole
          attraction. Interval semantics = HALF-OPEN [offset_ms, offset_ms + duration_ms) on a millisecond axis, with a
          250 ms interlock buffer that applies only to ANIMATION and SPECIAL_EFFECT. A gap of exactly 0 ms is therefore
          refused on ANIMATION but accepted on LIGHTING, and a gap of exactly 250 ms is accepted on ANIMATION — the
          opposite polarity to the rehearsal-window rule, where touching endpoints always collide.
        test_recipe:
          setup:
            - "Project at BLUE_SKY with one DRAFT ShowScene sc_a; cue creation requires only that the owning scene is DRAFT or SEQUENCED."
            - "One ANIMATION cue occupying [1000, 3000) ms and one LIGHTING cue occupying [1000, 3000) ms on the same scene (different channels never contend)."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-RT2", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc_a: $.data.id }
            - call: "POST /effect-cues"
              payload: { scene_id: "${sc_a}", cue_label: "Dragon Head Move", discipline_channel: "ANIMATION", offset_ms: 1000, duration_ms: 2000 }
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { cue_anim: $.data.id }
            - call: "POST /effect-cues"
              payload: { scene_id: "${sc_a}", cue_label: "Cavern Wash", discipline_channel: "LIGHTING", offset_ms: 1000, duration_ms: 2000 }
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { cue_light: $.data.id }
          trigger:
            - call: "POST /effect-cues"
              payload: { scene_id: "${sc_a}", cue_label: "Dragon Tail Snap Adjacent", discipline_channel: "ANIMATION", offset_ms: 3000, duration_ms: 500 }
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { err_anim_adjacent: $.data.error_id }
            - call: "POST /effect-cues"
              payload: { scene_id: "${sc_a}", cue_label: "Dragon Tail Snap Buffered", discipline_channel: "ANIMATION", offset_ms: 3250, duration_ms: 500 }
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { cue_anim_ok: $.data.id }
            - call: "POST /effect-cues"
              payload: { scene_id: "${sc_a}", cue_label: "Cavern Blackout", discipline_channel: "LIGHTING", offset_ms: 3000, duration_ms: 500 }
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { cue_light_ok: $.data.id }
          assert:
            - "${err_anim_adjacent} == ERR_CUE_CHANNEL_CONFLICT"
            - "the refused ANIMATION create returns HTTP status 409"
            - "EffectCue.${cue_anim_ok}.offset_ms == 3250"
            - "EffectCue.${cue_anim_ok}.discipline_channel == ANIMATION"
            - "EffectCue.${cue_anim_ok}.status == PLANNED"
            - "EffectCue.${cue_light_ok}.offset_ms == 3000"
            - "EffectCue.${cue_light_ok}.discipline_channel == LIGHTING"
            - "EffectCue.${cue_anim}.status == PLANNED"
            - "EffectCue.${cue_light}.status == PLANNED"
            - "GET /show-scenes/${sc_a}/effect-cues returns exactly 4 EffectCue rows"

  # =====================================================================
  # RULE 9 — compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ledger_reversal_restores_committed_cost_and_posture_without_drift
        grounds:
          - calculations.project_budget_position
          - calculations.project_readiness_posture
          - entities.BudgetLedgerEntry.fields.reversed
          - entities.BudgetLedgerEntry.fields.reversal_of_sequence_no
          - validations[priority 47].ERR_LEDGER_ENTRY_ALREADY_REVERSED
          - endpoints[POST /budget-ledger-entries/{id}/reverse]
        distinguishing_aspect: |
          Conserved quantity = money in cents. The invariant is committed_cost_cents == sum of amount_cents over every
          BudgetLedgerEntry of the project, and it must hold before the change order, after it, and after its reversal —
          the reversal is a compensating twin row, never a deletion or an in-place edit, so the ledger keeps three rows
          while committed_cost_cents returns to exactly its pre-change-order value and readiness_posture walks
          OPEN -> RESTRICTED -> OPEN. A second reversal of the same entry is refused, so the compensation cannot be
          applied twice and drive committed cost below the conserved sum.
        test_recipe:
          setup:
            - "Project at DESIGN_DEVELOPMENT with budget_ceiling_cents 3600000000 and one APPROVED DesignPackage of base 2500000000, so ledger sequence_no 1 is a COMMITMENT of 3080000000 and committed_cost_cents == 3080000000 with readiness_posture OPEN."
