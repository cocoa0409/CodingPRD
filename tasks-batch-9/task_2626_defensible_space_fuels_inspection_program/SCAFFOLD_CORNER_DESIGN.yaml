            - "recovery_basis == \"DISTRICT_CONTRACTED\" and ${due} == \"2026-11-20T23:59:59Z\" (clock 2026-10-06 + invoice_due_days 45)"
            - "HTTP 201 on the payment and CostRecoveryPayment.${pay1}.allocation == { ADMIN_OVERHEAD: 21176, MOBILIZATION: 32000, DISPOSAL: 6824, LABOR: 0 }"
