      grounds:
      - calculations.carrier_posture
      - entities.Carrier.fields.posture
      - endpoints[PATCH /carriers/{carrier_id}]
      distinguishing_aspect: 'Posture is FROZEN exactly when safety_rating is UNSATISFACTORY: patching to CONDITIONAL leaves it OPEN and patching to UNSATISFACTORY flips it to FROZEN, with filled_requisitions
        still 0 in both cases.'
      test_recipe:
        setup:
        - One Carrier with open_requisitions 5, safety_rating SATISFACTORY and posture OPEN.
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-CORNER-1
            open_requisitions: 5
            safety_rating: SATISFACTORY
