scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: income_countable_vs_gross_eligibility
        grounds:
          - calculations.income_eligibility
          - entities.IncomeSource.fields.countable
          - entities.Application.fields.countable_monthly_income_cents
          - validations[priority=12]
        distinguishing_aspect: |
          On the Tenant income domain, the countable variant sums only
          {WAGES,SELF_EMPLOYMENT,UNEMPLOYMENT} = 500000 (eligible, <= limit 566667)
          while the gross variant would sum all sources = 600000 (> 566667,
          ineligible); the default countable variant drives the decision.
        test_recipe:
          setup:
            - "Program limit for household_size 2 = 566667 cents/month; per_month_max 250000; months_cap 18; funding 100000000"
            - "Tenant household_size 2; Landlord W-9 VERIFIED; Unit rent 200000; ledger VERIFIED"
            - "Application UNDER_REVIEW with income WAGES 500000 (countable) + SSI 100000 (non-countable)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "ERAP-CA", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "1": 500000, "2": 566667, "3": 641667, "4": 708334 }, months_cap: 18, eligibility_ami_pct: 0.80 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T One", email: "t1@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L One", email: "l1@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /landlords/${lid}/w9"
              payload: { tin: "11-1111111", banking_last4: "0001", mailing_address: "1 A St" }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /landlords/${lid}/w9/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "1 A St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 200000, requested_prospective_months: 3, arrears_start_month: "2025-12", arrears_end_month: "2026-01", prospective_start_date: "2026-03-01", prospective_end_date: "2026-05-31" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { aid: $.data.id }
            - call: "POST /applications/${aid}/income-sources"
              payload: { source_type: "WAGES", monthly_amount_cents: 500000 }
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/income-sources"
              payload: { source_type: "SSI", monthly_amount_cents: 100000 }
              as: Tenant
              as_user_id: "${tid}"
            - call: "PATCH /applications/${aid}/tenant-section"
              payload: { hardship_type: "JOB_LOSS", hardship_attested: true }
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/ledger"
              payload: { lines: [ { month: "2025-11", line_type: "CHARGE", charge_cents: 200000 }, { month: "2025-12", line_type: "CHARGE", charge_cents: 200000 }, { month: "2025-12", line_type: "PAYMENT", payment_cents: 100000 }, { month: "2026-01", line_type: "CHARGE", charge_cents: 200000 } ] }
              as: Landlord
              as_user_id: "${lid}"
              captures: { ledid: $.data.id }
            - call: "POST /applications/${aid}/ledger/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "PATCH /applications/${aid}/landlord-section"
              payload: { ledger_confirmed: true }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /applications/${aid}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/review"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /applications/${aid}/approve"
              payload: { decision_reason: "eligible" }
              as: CaseWorker
              as_user_id: "cw-approver-1"
          assert:
            - "Application.${aid}.countable_monthly_income_cents == 500000"
            - "Application.${aid}.income_eligible == true"
            - "Application.${aid}.status == APPROVED"

      - name: arrears_chronological_vs_gross_window
        grounds:
          - calculations.arrears_owed
          - entities.Application.fields.arrears_owed_cents
          - entities.Application.fields.arrears_award_cents
          - entities.LedgerLine.fields.payment_cents
        distinguishing_aspect: |
          On the RentLedger domain, chronological FIFO applies the 2025-12 payment
          of 100000 to the oldest (pre-window 2025-11) charge, leaving in-window
          arrears = 400000; the naive gross-window variant would net the same
          payment inside the window to 300000. The 400000 FIFO value is pinned.
        test_recipe:
          setup:
            - "Same approvable application as income_countable_vs_gross_eligibility (ledger: Nov charge 200000, Dec charge 200000, Dec payment 100000, Jan charge 200000; arrears window 2025-12..2026-01)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "ERAP-CA", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "1": 500000, "2": 566667, "3": 641667, "4": 708334 }, months_cap: 18, eligibility_ami_pct: 0.80 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T Two", email: "t2@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L Two", email: "l2@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /landlords/${lid}/w9"
              payload: { tin: "22-2222222", banking_last4: "0002", mailing_address: "2 B St" }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /landlords/${lid}/w9/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "2 B St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 200000, requested_prospective_months: 3, arrears_start_month: "2025-12", arrears_end_month: "2026-01", prospective_start_date: "2026-03-01", prospective_end_date: "2026-05-31" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { aid: $.data.id }
            - call: "POST /applications/${aid}/income-sources"
              payload: { source_type: "WAGES", monthly_amount_cents: 500000 }
              as: Tenant
              as_user_id: "${tid}"
            - call: "PATCH /applications/${aid}/tenant-section"
              payload: { hardship_type: "REDUCED_INCOME", hardship_attested: true }
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/ledger"
              payload: { lines: [ { month: "2025-11", line_type: "CHARGE", charge_cents: 200000 }, { month: "2025-12", line_type: "CHARGE", charge_cents: 200000 }, { month: "2025-12", line_type: "PAYMENT", payment_cents: 100000 }, { month: "2026-01", line_type: "CHARGE", charge_cents: 200000 } ] }
              as: Landlord
              as_user_id: "${lid}"
              captures: { ledid: $.data.id }
            - call: "POST /applications/${aid}/ledger/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "PATCH /applications/${aid}/landlord-section"
              payload: { ledger_confirmed: true }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /applications/${aid}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/review"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /applications/${aid}/approve"
              payload: { decision_reason: "eligible" }
              as: CaseWorker
              as_user_id: "cw-approver-2"
          assert:
            - "Application.${aid}.arrears_owed_cents == 400000"
            - "Application.${aid}.arrears_award_cents == 400000"
            - "Application.${aid}.status == APPROVED"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: total_award_nested_min_double_clamp
        grounds:
          - calculations.total_award
          - entities.Application.fields.total_award_cents
          - entities.Application.fields.arrears_award_cents
          - entities.Program.fields.per_month_max_cents
        distinguishing_aspect: |
          Mode (a): nested min over >=3 inputs — monthly_award = min(rent 300000,
          per_month_max 250000) = 250000, arrears_award = min(arrears_owed 700000,
          arrears_months 2 * 250000 = 500000) = 500000, prospective = 3*250000 =
          750000, total = 1250000; two independent clamps both fire in one pass.
        test_recipe:
          setup:
            - "Program per_month_max 250000; funding 100000000; months_cap 18"
            - "Application rent 300000; ledger arrears window 2025-12..2026-01 with charges 350000 each and no payments; prospective 3 whole months from 2026-03-01"
            - "income WAGES 400000 (eligible for size 2 limit 566667)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "ERAP-B", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "1": 500000, "2": 566667, "3": 641667, "4": 708334 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T Three", email: "t3@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L Three", email: "l3@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /landlords/${lid}/w9"
              payload: { tin: "33-3333333", banking_last4: "0003", mailing_address: "3 C St" }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /landlords/${lid}/w9/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "3 C St", monthly_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 300000, requested_prospective_months: 3, arrears_start_month: "2025-12", arrears_end_month: "2026-01", prospective_start_date: "2026-03-01", prospective_end_date: "2026-05-31" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { aid: $.data.id }
            - call: "POST /applications/${aid}/income-sources"
              payload: { source_type: "WAGES", monthly_amount_cents: 400000 }
              as: Tenant
              as_user_id: "${tid}"
            - call: "PATCH /applications/${aid}/tenant-section"
              payload: { hardship_type: "JOB_LOSS", hardship_attested: true }
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/ledger"
              payload: { lines: [ { month: "2025-12", line_type: "CHARGE", charge_cents: 350000 }, { month: "2026-01", line_type: "CHARGE", charge_cents: 350000 } ] }
              as: Landlord
              as_user_id: "${lid}"
              captures: { ledid: $.data.id }
            - call: "POST /applications/${aid}/ledger/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "PATCH /applications/${aid}/landlord-section"
              payload: { ledger_confirmed: true }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /applications/${aid}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/review"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /applications/${aid}/approve"
              payload: { decision_reason: "ok" }
              as: CaseWorker
              as_user_id: "cw-approver-3"
          assert:
            - "Application.${aid}.arrears_award_cents == 500000"
            - "Application.${aid}.prospective_award_cents == 750000"
            - "Application.${aid}.total_award_cents == 1250000"
            - "Application.${aid}.months_awarded == 5"

      - name: prospective_proration_round_per_month_then_sum
        grounds:
          - calculations.prospective_award
          - entities.Application.fields.prospective_award_cents
          - entities.Application.fields.total_award_cents
        distinguishing_aspect: |
          Mode (b): round-per-month-then-sum is pinned — first month 2026-03 (30/31
          days) = round(150000*30/31) = 145161, full 2026-04 = 150000, last month
          2026-05 (2/31 days) = round(150000*2/31) = 9677, total = 304838; the
          rejected sum-then-round variant yields 304839, a 1-cent divergence.
        test_recipe:
          setup:
            - "Program per_month_max 250000; funding 100000000"
            - "Application rent 150000, no arrears window, prospective 2026-03-02..2026-05-02 (requested 3 months), empty verified ledger"
            - "income WAGES 300000 (eligible for size 1 limit 500000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "ERAP-P", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "1": 500000, "2": 566667, "3": 641667, "4": 708334 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T Four", email: "t4@x.com", household_size: 1 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L Four", email: "l4@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /landlords/${lid}/w9"
              payload: { tin: "44-4444444", banking_last4: "0004", mailing_address: "4 D St" }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /landlords/${lid}/w9/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "4 D St", monthly_rent_cents: 150000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 150000, requested_prospective_months: 3, prospective_start_date: "2026-03-02", prospective_end_date: "2026-05-02" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { aid: $.data.id }
            - call: "POST /applications/${aid}/income-sources"
              payload: { source_type: "WAGES", monthly_amount_cents: 300000 }
              as: Tenant
              as_user_id: "${tid}"
            - call: "PATCH /applications/${aid}/tenant-section"
              payload: { hardship_type: "MEDICAL", hardship_attested: true }
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/ledger"
              payload: { lines: [] }
              as: Landlord
              as_user_id: "${lid}"
              captures: { ledid: $.data.id }
            - call: "POST /applications/${aid}/ledger/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "PATCH /applications/${aid}/landlord-section"
              payload: { ledger_confirmed: true }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /applications/${aid}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/review"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /applications/${aid}/approve"
              payload: { decision_reason: "ok" }
              as: CaseWorker
              as_user_id: "cw-approver-4"
          assert:
            - "Application.${aid}.prospective_award_cents == 304838"
            - "Application.${aid}.total_award_cents == 304838"
            - "Application.${aid}.months_awarded == 3"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_info_request_review_cycle
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.Application.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.Application.fields.status
        distinguishing_aspect: |
          Application is cyclic: UNDER_REVIEW -> INFO_REQUESTED (request-info) ->
          UNDER_REVIEW (resubmit) returns to the same state, proving a revision loop
          rather than a linear pipeline.
        test_recipe:
          setup:
            - "Application UNDER_REVIEW (built via the standard co-application chain)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "ERAP-CY", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "1": 500000, "2": 566667 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T Cy", email: "tc@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L Cy", email: "lc@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /landlords/${lid}/w9"
              payload: { tin: "55-5555555", banking_last4: "0005", mailing_address: "5 E St" }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /landlords/${lid}/w9/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "5 E St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 200000, requested_prospective_months: 2, prospective_start_date: "2026-03-01", prospective_end_date: "2026-04-30" }
              as: Tenant
              as_user_id: "${tid}"
              captures: { aid: $.data.id }
            - call: "POST /applications/${aid}/income-sources"
              payload: { source_type: "WAGES", monthly_amount_cents: 400000 }
              as: Tenant
              as_user_id: "${tid}"
            - call: "PATCH /applications/${aid}/tenant-section"
              payload: { hardship_type: "OTHER", hardship_attested: true }
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/ledger"
              payload: { lines: [] }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /applications/${aid}/ledger/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "PATCH /applications/${aid}/landlord-section"
              payload: { ledger_confirmed: true }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /applications/${aid}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${tid}"
            - call: "POST /applications/${aid}/review"
              payload: {}
              as: CaseWorker
          trigger:
            - call: "POST /applications/${aid}/request-info"
              payload: { note: "need paystubs" }
              as: CaseWorker
              captures: { s1: $.data.status }
            - call: "POST /applications/${aid}/resubmit"
              payload: {}
              as: Tenant
              as_user_id: "${tid}"
              captures: { s2: $.data.status }
          assert:
            - "trigger[0] response Application.status == INFO_REQUESTED"
            - "trigger[1] response Application.status == UNDER_REVIEW"
            - "Application.${aid}.status == UNDER_REVIEW"

      - name: disbursement_fail_retry_cycle
        grounds:
          - state_machines.Disbursement.SENT_to_FAILED
          - state_machines.Disbursement.FAILED_to_PENDING
          - entities.Disbursement.fields.status
        distinguishing_aspect: |
          Disbursement is cyclic on a different entity: SENT -> FAILED (fail) ->
          PENDING (retry) re-enters PENDING, a payment-retry loop; the retry
          re-reserves funds and months.
        test_recipe:
          setup:
            - "Approved application with total_award 1000000; one disbursement created (1000000/5mo), SENT then FAILED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "ERAP-RT", funding_pool_total_cents: 100000000, per_month_max_cents: 250000, monthly_income_limit_by_size: { "1": 500000, "2": 566667 }, months_cap: 18 }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /tenants"
              payload: { full_name: "T Rt", email: "trt@x.com", household_size: 2 }
              as: Anonymous
              captures: { tid: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "L Rt", email: "lrt@x.com" }
              as: Anonymous
              captures: { lid: $.data.id }
            - call: "POST /landlords/${lid}/w9"
              payload: { tin: "66-6666666", banking_last4: "0006", mailing_address: "6 F St" }
              as: Landlord
              as_user_id: "${lid}"
            - call: "POST /landlords/${lid}/w9/verify"
              payload: { decision: "VERIFIED" }
              as: ProgramAdmin
            - call: "POST /units"
              payload: { landlord_id: "${lid}", address: "6 F St", monthly_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${lid}"
              captures: { uid: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pid}", tenant_id: "${tid}", landlord_id: "${lid}", unit_id: "${uid}", monthly_rent_cents: 200000, requested_prospective_months: 3, arrears_start_month: "2025-12", arrears_end_month: "2026-01", prospective_start_date: "2026-03-01", prospective_end_date: "2026-05-31" }
