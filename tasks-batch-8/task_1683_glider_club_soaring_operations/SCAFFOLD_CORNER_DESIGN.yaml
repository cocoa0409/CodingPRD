        distinguishing_aspect: "All side effects land atomically in-request: the land response itself carries final_fee_cents, flight_minutes and status LANDED, and an immediate GET of the member reflects the reconciled balance — no eventual lag."
        test_recipe:
          setup: ["member MI5 on zero-dues 10%-discount tier; full chain through IN_FLIGHT (release 1500 -> provisional 2700)"]
          setup_api_calls:
