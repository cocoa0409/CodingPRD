# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3173_student_ride_matching_caregiver_vetting_trip_monitoring
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe; the
# cited difficulty_instance names an instance that exists by name in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml.
#
# Fixture rates are fixed at per_ride 5300, per_mile 215, minimum 800, MONTHLY
# unless a corner needs otherwise. Each instance's calling chain is
# self-contained; this file does not inherit the difficulty file's anchors.
#
# Sections follow references/claim-extraction-guide.md; the section and
# claim_type values are taken verbatim from that guide's nine tables.
# =============================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: district_create_returns_every_declared_default_and_starts_active
    claim_type: Creation
    grounds:
    - entities.District
    - endpoints.POST_/student-rides/districts
    distinguishing_aspect: A district posted with only the five required fields comes back 201 with account_status ACTIVE, credit_balance_cents 0, outstanding_balance_cents 0, trips_scheduled_total 0 and version 1; none of those is client-supplied.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /student-rides/districts
        payload:
          name: Aldine ISD
          billing_email: ap@aldine.example
          contract_rate_per_ride_cents: 5300
          contract_rate_per_mile_cents: 215
        as: Anonymous
        captures:
          d_new: $.data.id
          d_new_v: $.data.version
          d_new_acct: $.data.account_status
          d_new_credit: $.data.credit_balance_cents
          d_new_total: $.data.trips_scheduled_total
      assert:
      - the response status is 201 and response_type is object
      - District.${d_new}.name == "Aldine ISD" and billing_email == "ap@aldine.example"
      - District.${d_new}.account_status == ACTIVE
      - District.${d_new}.credit_balance_cents == 0 and outstanding_balance_cents == 0
      - District.${d_new}.trips_scheduled_total == 0 and minimum_billable_cents == 0
      - District.${d_new}.version == 1 and the response carries non-null id, created_at and updated_at
      - meta.api_request_id and meta.api_request_timestamp are present on the response
  - name: district_get_round_trips_optional_arrays_and_flags
    claim_type: Retrieval
    grounds:
    - entities.District
    - endpoints.GET_/student-rides/districts/{id}
    distinguishing_aspect: 'The two array and boolean fields survive a round trip exactly: a two-element no_school_dates list and support_center_alert_enabled false read back unchanged, and bell_schedule_start keeps its HH:MM shape.'
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; one district created with both arrays populated and the alert flag off.
      setup_api_calls:
      - *id001
      - call: POST /student-rides/districts
        payload:
          name: Spring Branch ISD
          billing_email: ap@sb.example
          contract_rate_per_ride_cents: 4900
          contract_rate_per_mile_cents: 200
          minimum_billable_cents: 500
          no_school_dates:
          - '2026-11-26'
          - '2026-11-27'
          bell_schedule_start: 08:15
          support_center_alert_enabled: false
        as: Anonymous
        captures:
          d_full: $.data.id
      trigger:
      - call: GET /student-rides/districts/${d_full}
        payload: {}
        as: DistrictAdmin
        captures:
          d_full_read: $.data.no_school_dates
          d_full_flag: $.data.support_center_alert_enabled
          d_full_bell: $.data.bell_schedule_start
      assert:
      - District.${d_full}.no_school_dates == ["2026-11-26", "2026-11-27"]
      - District.${d_full}.support_center_alert_enabled == false
      - District.${d_full}.bell_schedule_start == "08:15"
      - District.${d_full}.minimum_billable_cents == 500
  - name: district_list_paginates_with_total_count_and_has_more
    claim_type: Listing
    grounds:
    - endpoints.GET_/student-rides/districts/{id}/riders
    - entities.Rider
    distinguishing_aspect: Three riders listed with limit 2 report total_count 3 and has_more true on the first page and has_more false on the second, which pins the pagination_defaults contract.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; one district and three riders.
      setup_api_calls:
      - *id001
      - call: POST /student-rides/districts
        payload:
          name: Aldine ISD
          billing_email: ap@aldine.example
          contract_rate_per_ride_cents: 5300
          contract_rate_per_mile_cents: 215
        as: Anonymous
        captures:
          d_p: $.data.id
      - call: POST /student-rides/riders
        payload:
          district_id: ${d_p}
          full_name: Ana Ruiz
          date_of_birth: '2014-04-02'
          program_type: GENERAL
          home_address: 12 Oak St
          school_name: Lincoln Elementary
          emergency_contact_phone: '5550101'
        as: DistrictAdmin
        captures:
          r_pa: $.data.id
      - call: POST /student-rides/riders
        payload:
          district_id: ${d_p}
          full_name: Beto Lane
          date_of_birth: '2013-11-08'
          program_type: FOSTER_CARE
          home_address: 44 Elm St
          school_name: Lincoln Elementary
          emergency_contact_phone: '5550102'
        as: DistrictAdmin
        captures:
          r_pb: $.data.id
      - call: POST /student-rides/riders
        payload:
          district_id: ${d_p}
          full_name: Cara Voss
          date_of_birth: '2012-02-14'
          program_type: SPECIAL_EDUCATION
          home_address: 9 Pine St
          school_name: Lincoln Elementary
          emergency_contact_phone: '5550103'
        as: DistrictAdmin
        captures:
          r_pc: $.data.id
      trigger:
      - call: GET /student-rides/districts/${d_p}/riders?limit=2&offset=0
        payload: {}
        as: DistrictAdmin
        captures:
          page_one: $.data
          page_one_total: $.data.meta.total_count
          page_one_more: $.data.meta.has_more
      - call: GET /student-rides/districts/${d_p}/riders?limit=2&offset_2=2
        payload: {}
        as: DistrictAdmin
        captures:
          page_two_total: $.data.meta.total_count
          page_two_more: $.data.meta.has_more
      assert:
      - the response_type is array and data carries exactly 2 Rider rows
      - total_count reads 3 on both pages
      - has_more reads true on the first page and false on the second
      - the third rider appears only on the second page, so offset paging is stable
  - name: rider_get_with_an_unknown_id_returns_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/student-rides/riders/{id}
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: A rider id that is a well-formed UUID but was never minted yields 404 with ERR_NOT_FOUND rather than an empty object or a 400.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; empty database.
      setup_api_calls:
      - *id001
      trigger:
      - call: GET /student-rides/riders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: DistrictAdmin
        captures:
          err_404: $.data.error_id
      assert:
      - the response status is 404 and response_type is error
      - data.error_id == ERR_NOT_FOUND
      - data.message is a non-empty string
  - name: rider_create_missing_the_school_of_record_returns_invalid_request
    claim_type: Required Fields
    grounds:
    - entities.Rider.fields.school_name
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting school_name, which is a required input with no default, yields 400 with ERR_INVALID_REQUEST; omitting spi_level, which carries a default, does not.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; one district.
      setup_api_calls:
      - *id001
      - call: POST /student-rides/districts
        payload:
          name: Aldine ISD
          billing_email: ap@aldine.example
          contract_rate_per_ride_cents: 5300
          contract_rate_per_mile_cents: 215
        as: Anonymous
        captures:
          d_r: $.data.id
      trigger:
      - call: POST /student-rides/riders
        payload:
          district_id: ${d_r}
          full_name: Ana Ruiz
          date_of_birth: '2014-04-02'
          program_type: GENERAL
          home_address: 12 Oak St
          emergency_contact_phone: '5550101'
        as: DistrictAdmin
        captures:
          err_req: $.data.error_id
      assert:
      - the response status is 400 and data.error_id == ERR_INVALID_REQUEST
      - no Rider row was created by the rejected request
      - the same body with school_name present and spi_level still absent is accepted with spi_level defaulting to 1
  - name: rider_create_defaults_the_notification_flags_and_the_priority_level
    claim_type: Defaults
    grounds:
    - entities.Rider.fields.spi_level
    - entities.Rider.fields.notify_on_pickup
    - entities.Rider.fields.notify_on_dropoff
    - entities.Rider.fields.authorized_adults
    distinguishing_aspect: Omitting spi_level, both notification flags and authorized_adults yields spi_level 1, both booleans true and an empty array, which is what the dispatch ranking and the handoff rule then have to work with.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; one district.
      setup_api_calls:
      - *id001
      - call: POST /student-rides/districts
        payload:
          name: Aldine ISD
          billing_email: ap@aldine.example
          contract_rate_per_ride_cents: 5300
          contract_rate_per_mile_cents: 215
        as: Anonymous
        captures:
          d_d: $.data.id
      trigger:
      - call: POST /student-rides/riders
        payload:
          district_id: ${d_d}
          full_name: Ana Ruiz
          date_of_birth: '2014-04-02'
          program_type: GENERAL
          home_address: 12 Oak St
          school_name: Lincoln Elementary
          emergency_contact_phone: '5550101'
        as: DistrictAdmin
        captures:
          r_def: $.data.id
      assert:
      - Rider.${r_def}.spi_level == 1
      - Rider.${r_def}.notify_on_pickup == true and notify_on_dropoff == true
      - Rider.${r_def}.authorized_adults == []
      - Rider.${r_def}.status == ACTIVE and active_ride_request_count == 0
  - name: rider_masked_contact_is_computed_and_the_raw_number_still_round_trips
    claim_type: Computed Fields
    grounds:
    - entities.Rider.fields.support_center_phone_masked
    - entities.Rider.fields.emergency_contact_phone
    - endpoints.GET_/student-rides/riders/{id}
    distinguishing_aspect: support_center_phone_masked is computed from emergency_contact_phone with all but the last four digits masked, and a later PUT that changes the raw number re-derives the digest, so the masked field is never stale.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; one district and one rider on a ten-digit contact number.
      setup_api_calls:
      - *id001
      - call: POST /student-rides/districts
        payload:
          name: Aldine ISD
          billing_email: ap@aldine.example
          contract_rate_per_ride_cents: 5300
          contract_rate_per_mile_cents: 215
        as: Anonymous
        captures:
          d_m: $.data.id
      - call: POST /student-rides/riders
        payload:
          district_id: ${d_m}
          full_name: Ana Ruiz
          date_of_birth: '2014-04-02'
          program_type: GENERAL
          home_address: 12 Oak St
          school_name: Lincoln Elementary
          emergency_contact_phone: '5551234567'
        as: DistrictAdmin
        captures:
          r_m: $.data.id
          mask_before: $.data.support_center_phone_masked
      trigger:
      - call: PUT /student-rides/riders/${r_m}
        payload:
          emergency_contact_phone: '5559876543'
        as: DistrictAdmin
        captures:
          mask_after: $.data.support_center_phone_masked
          raw_after: $.data.emergency_contact_phone
      assert:
      - the masked value before the update ends in the four digits 4567
      - the masked value after the update ends in the four digits 6543
      - Rider.${r_m}.emergency_contact_phone == "5559876543" and the mask differs from the raw value
      - the masked value never contains more than the final four digits of the raw number
  - name: driver_create_ignores_client_supplied_status_and_seat_count
    claim_type: System Fields
    grounds:
    - entities.Driver.fields.status
    - entities.Driver.fields.approved_seat_count
    - endpoints.POST_/student-rides/drivers
    distinguishing_aspect: A driver posted with status ACTIVE and approved_seat_count 9 in the body still lands in PENDING with approved_seat_count 0 and incident_strike_count 0, because those fields are server-derived.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; empty database.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /student-rides/drivers
        payload:
          full_name: Dee Alvarez
          phone: '5550111'
          employer_org: CareGo
          caregiver_experience_months: 18
          language_codes:
          - en
          vehicle_class: SUV
          seat_capacity: 6
        as: DistrictAdmin
        captures:
          drv_new: $.data.id
          drv_new_status: $.data.status
          drv_new_seats: $.data.approved_seat_count
          drv_new_strikes: $.data.incident_strike_count
          drv_new_exp: $.data.compliance_expires_at
      assert:
      - the response status is 201
      - Driver.${drv_new}.status == PENDING
      - Driver.${drv_new}.approved_seat_count == 0
      - Driver.${drv_new}.incident_strike_count == 0
      - Driver.${drv_new}.compliance_expires_at is null and version == 1
  - name: driver_create_out_of_enum_vehicle_class_returns_invalid_request
    claim_type: Type Constraints
    grounds:
    - entities.Driver.fields.vehicle_class
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: vehicle_class is closed over SEDAN, SUV and WHEELCHAIR_VAN, so a COUPE member is refused with ERR_INVALID_REQUEST while all three legal members are accepted.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; empty database.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /student-rides/drivers
        payload:
          full_name: Dee Alvarez
          phone: '5550111'
          employer_org: CareGo
          caregiver_experience_months: 18
          language_codes:
          - en
          vehicle_class: COUPE
          seat_capacity: 4
        as: DistrictAdmin
        captures:
          err_enum: $.data.error_id
      assert:
      - the response status is 400 and data.error_id == ERR_INVALID_REQUEST
      - no Driver row exists after the rejected request
      - the same body with vehicle_class WHEELCHAIR_VAN is accepted
  - name: geofence_create_requires_the_district_key_and_surfaces_it_on_read
    claim_type: Parent Relationships
    grounds:
    - entities.Geofence.fields.district_id
    - endpoints.POST_/student-rides/geofences
    - endpoints.GET_/student-rides/districts/{id}/geofences
    distinguishing_aspect: A geofence created against a district is discoverable from that district's reverse read and carries the same district_id, which is what the containment calculation keys its fence set on.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; one district.
      setup_api_calls:
      - *id001
      - call: POST /student-rides/districts
        payload:
          name: Aldine ISD
          billing_email: ap@aldine.example
          contract_rate_per_ride_cents: 5300
          contract_rate_per_mile_cents: 215
        as: Anonymous
        captures:
          d_g: $.data.id
      trigger:
      - call: POST /student-rides/geofences
        payload:
          district_id: ${d_g}
          label: Lincoln campus
          center_lat: 29.7604
          center_lon: -95.3698
          radius_miles: 1.0
        as: DistrictAdmin
        captures:
          gf_new: $.data.id
          gf_dist: $.data.district_id
      - call: GET /student-rides/districts/${d_g}/geofences
        payload: {}
        as: DistrictAdmin
        captures:
          gf_list: $.data[0].id
      assert:
      - the geofence response is 201 and Geofence.${gf_new}.district_id == ${d_g}
      - the district reverse read returns exactly one Geofence and its id is ${gf_new}
      - Geofence.${gf_new}.radius_miles == 1.0 and label == "Lincoln campus"
      - creating a geofence with an unknown district_id is refused with ERR_NOT_FOUND
- section: state_machines
  instances:
  - name: driver_machine_rejects_advancement_straight_to_inspection
    claim_type: Invalid Transitions
    grounds:
    - state_machines.Driver.PENDING_to_BACKGROUND_CHECK
    - state_machines.Driver.BACKGROUND_CHECK_to_INSPECTION
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: A brand-new driver sits in PENDING, so POST /student-rides/drivers/{id}/inspections is refused with ERR_INVALID_STATE until the driver has first opened a background check and moved to BACKGROUND_CHECK.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; one freshly onboarded driver in PENDING.
      setup_api_calls:
      - *id001
      - call: POST /student-rides/drivers
        payload:
          full_name: Dee Alvarez
          phone: '5550111'
          employer_org: CareGo
          caregiver_experience_months: 18
          language_codes:
          - en
          vehicle_class: SUV
          seat_capacity: 6
        as: DistrictAdmin
        captures:
          drv_p: $.data.id
      trigger:
      - call: POST /student-rides/drivers/${drv_p}/inspections
        payload:
          vehicle_class: SUV
          seat_count: 6
          inspector_note: premature
          expires_on: '2027-03-01'
        as: DistrictAdmin
        captures:
          err_adv: $.data.error_id
      assert:
      - the response status is 409 and data.error_id == ERR_INVALID_STATE
      - Driver.${drv_p}.status stays PENDING and no VehicleInspection row was created
      - after POST /student-rides/drivers/${drv_p}/background-checks the same inspection call moves the driver to INSPECTION
  - name: new_driver_lands_in_the_declared_initial_state
    claim_type: Initial State
    grounds:
    - entities.Driver.fields.status
    - state_machines.Driver
    distinguishing_aspect: A newly onboarded driver reads PENDING, not ACTIVE and not BLANK, so every qualification gate is entered from the declared initial state.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; empty database.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /student-rides/drivers
        payload:
          full_name: Dee Alvarez
          phone: '5550111'
          employer_org: CareGo
          caregiver_experience_months: 18
          language_codes:
          - en
          vehicle_class: SEDAN
          seat_capacity: 4
        as: DistrictAdmin
        captures:
          drv_i: $.data.id
      assert:
      - Driver.${drv_i}.status == PENDING
      - Driver.${drv_i}.approved_seat_count == 0 and compliance_expires_at is null
      - 'the driver is not dispatchable: POST /student-rides/trips/{id}/dispatch-candidate never selects a PENDING driver'
  - name: inactivated_driver_carries_no_further_transitions
    claim_type: Terminal State Lockdown
    grounds:
    - state_machines.Driver.ACTIVE_to_INACTIVE
    - state_machines.Driver.SUSPENDED_to_INACTIVE
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'INACTIVE is a terminal state for the driver machine: neither reactivate nor deactivate is legal from it, and the deactivate call that could otherwise be retried is refused.'
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; a driver vetted to ACTIVE and then inactivated.
      setup_api_calls:
      - *id001
      - call: POST /student-rides/drivers
        payload:
          full_name: Dee Alvarez
          phone: '5550111'
          employer_org: CareGo
          caregiver_experience_months: 18
          language_codes:
          - en
          vehicle_class: SUV
          seat_capacity: 6
        as: DistrictAdmin
        captures:
          drv_l: $.data.id
      - call: POST /student-rides/drivers/${drv_l}/background-checks
        payload:
          check_type: FINGERPRINT_FBI
          reference_code: FBI-L
          expires_on: '2027-03-01'
        as: DistrictAdmin
        captures:
          bc_l: $.data.id
      - call: POST /student-rides/background-checks/${bc_l}/clear
        payload: {}
        as: DistrictAdmin
      - call: POST /student-rides/drivers/${drv_l}/inspections
        payload:
          vehicle_class: SUV
          seat_count: 6
          inspector_note: clean
          expires_on: '2027-03-01'
        as: DistrictAdmin
        captures:
          ins_l: $.data.id
      - call: POST /student-rides/vehicle-inspections/${ins_l}/attest
        payload: {}
        as: DistrictAdmin
      - call: POST /student-rides/drivers/${drv_l}/background-checks
        payload:
          check_type: COUNTY_COURT
          reference_code: C-L
          expires_on: '2027-03-01'
        as: DistrictAdmin
        captures:
          bc2_l: $.data.id
      - call: POST /student-rides/background-checks/${bc2_l}/clear
        payload: {}
        as: DistrictAdmin
      - call: POST /student-rides/drivers/${drv_l}/inspections
        payload:
          vehicle_class: SUV
          seat_count: 6
          inspector_note: reinspect
          expires_on: '2027-03-01'
        as: DistrictAdmin
        captures:
          ins2_l: $.data.id
      - call: POST /student-rides/vehicle-inspections/${ins2_l}/attest
        payload: {}
        as: DistrictAdmin
      - call: POST /student-rides/drivers/${drv_l}/deactivate
        payload: {}
        as: DistrictAdmin
      trigger:
      - call: POST /student-rides/drivers/${drv_l}/reactivate
        payload: {}
        as: DistrictAdmin
        captures:
          err_term: $.data.error_id
      assert:
      - the reactivate call is refused with data.error_id == ERR_INVALID_STATE
      - Driver.${drv_l}.status stays INACTIVE
      - Driver.${drv_l}.approved_seat_count stays 0 after the refusal
      - a second deactivate call is likewise refused, so INACTIVE admits no transition at all
  - name: driver_background_check_transition_is_not_re_enterable
    claim_type: Idempotency
    grounds:
    - state_machines.Driver.PENDING_to_BACKGROUND_CHECK
    - errors[ERR_DUPLICATE_CLEARANCE]
    distinguishing_aspect: Repeating POST /student-rides/drivers/{id}/background-checks with the same FINGERPRINT_FBI check type is refused with ERR_DUPLICATE_CLEARANCE and the driver does not move.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z; a driver moved to BACKGROUND_CHECK by a first fingerprint check.
      setup_api_calls:
      - *id001
      - call: POST /student-rides/drivers
        payload:
          full_name: Dee Alvarez
          phone: '5550111'
          employer_org: CareGo
          caregiver_experience_months: 18
          language_codes:
          - en
          vehicle_class: SUV
          seat_capacity: 6
        as: DistrictAdmin
        captures:
          drv_i2: $.data.id
      - call: POST /student-rides/drivers/${drv_i2}/background-checks
        payload:
          check_type: FINGERPRINT_FBI
          reference_code: FBI-I
          expires_on: '2027-03-01'
        as: DistrictAdmin
        captures:
          bc_i: $.data.id
      trigger:
      - call: POST /student-rides/drivers/${drv_i2}/background-checks
        payload:
          check_type: FINGERPRINT_FBI
          reference_code: FBI-I-B
          expires_on: '2027-04-01'
        as: DistrictAdmin
        captures:
          err_dup: $.data.error_id
      assert:
      - the second fingerprint check is refused with data.error_id == ERR_DUPLICATE_CLEARANCE
      - Driver.${drv_i2}.status stays BACKGROUND_CHECK
      - the driver holds exactly one BackgroundCheck row whose reference_code is FBI-I
      - a COUNTY_COURT check instead of a second fingerprint is accepted, so the duplication rule is per check type
