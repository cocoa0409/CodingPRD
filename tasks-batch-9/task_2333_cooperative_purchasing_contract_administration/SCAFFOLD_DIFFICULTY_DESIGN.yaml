      - name: renewal_terms_are_half_open_so_adjacency_is_legal_but_a_thirteenth_month_is_not
        grounds:
          - validations.priority_46
          - errors.ERR_RENEWAL_TERM_NOT_EXTENDING
          - errors.ERR_RENEWAL_TERM_TOO_LONG
          - calculations.renewal_term_extension
          - state_machines.ContractAmendment.status.PROPOSED_to_APPROVED
          - entities.MasterContract.fields.current_term_end
          - entities.MasterContract.fields.renewals_used
        distinguishing_aspect: |
          The contract term is the HALF-OPEN interval [2026-09-01, 2027-09-01), so the three probes sit on
          the two edges of the legal window at once: requested_term_end equal to the current exclusive end
          is not an extension at all (ERR_RENEWAL_TERM_NOT_EXTENDING), thirteen months out is one month too
          far (ERR_RENEWAL_TERM_TOO_LONG), and EXACTLY twelve months out is admitted because
          MAX_RENEWAL_MONTHS is inclusive. The approved renewal must also leave the already-DETERMINED
          analysis's expires_on frozen at the OLD term end, so an implementation that recomputes authority
          windows on renewal is caught by the same chain.
