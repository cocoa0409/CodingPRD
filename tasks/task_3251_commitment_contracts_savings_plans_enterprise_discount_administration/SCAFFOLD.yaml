# =============================================================================
# SCAFFOLD — Commitment Contracts, Savings Plans & Enterprise Discount
# Administration (task_3251)
# =============================================================================

scenario: |
  Commitment Contracts, Savings Plans & Enterprise Discount Administration
  (Amazon Web Services): enterprise discount agreements with committed spend
  over a term and tiered discount rates by service family, savings plan and
  reserved capacity purchases with hourly commitment amounts and coverage
  computation, commitment shortfall handling and true-up billing at term end,
  discount application ordering across credits, savings plans and negotiated
  rates when computing an invoice, consolidated billing across linked accounts
  with organization-level commitment sharing, private pricing amendments for
  specific services with effective dates, marketplace purchases counting toward
  commitments under negotiated terms, renewal negotiation informed by usage
  growth forecasts and migration commitments

domain_name: commitment-contracts-savings-plans
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BillingOrganization
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Organization display name" }
      - { name: currency, type: string, source: input, default: "USD", description: "ISO currency code" }
      - { name: max_hourly_commitment_cents, type: integer, source: input, description: "Org-wide ceiling on the SUM of hourly_commitment_cents over all ACTIVE CommitmentPlans" }
      - { name: capacity_quota_units, type: integer, source: input, description: "Per-instance-family aggregate cap on RESERVED_CAPACITY plan units overlapping at any instant" }
      - { name: current_period_index, type: integer, source: system, default: 0, description: "Logical billing period counter; period N closes when run-period-close advances the counter from N to N+1" }
      - { name: unapplied_credit_cents, type: integer, source: computed, default: 0, description: "Sum of remaining_cents over all CreditGrants of this org with status IN {ISSUED, DEPLETING}" }

  - name: LinkedAccount
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> BillingOrganization.id; owning payer organization" }
      - { name: name, type: string, source: input, description: "Account display name" }
      - { name: external_ref, type: string, source: input, description: "External account reference" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: EnterpriseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> BillingOrganization.id" }
      - { name: name, type: string, source: input, description: "Agreement name" }
      - { name: committed_spend_cents, type: integer, source: input, description: "Total committed eligible spend over the whole term" }
      - { name: term_start, type: datetime, source: input, description: "Term start (inclusive), ISO8601" }
      - { name: term_end, type: datetime, source: input, description: "Term end (exclusive), ISO8601; must be > term_start" }
      - { name: lifecycle_status, type: enum, source: system, description: "NEGOTIATION | ACTIVE | SUSPENDED | EXPIRED | TERMINATED" }
      - { name: renewal_status, type: enum, source: system, description: "NONE | RENEWAL_REVIEW | RENEWED | ABANDONED — parallel state dimension, independent of lifecycle_status" }
      - { name: consumed_commitment_cents, type: integer, source: computed, default: 0, description: "Eligible spend counted toward commitment so far (two-pass marketplace weighting at true-up; running value uses pass-1 weight)" }
      - { name: accrued_trueup_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over all non-WAIVED TrueUpCharges of this agreement" }

  - name: DiscountTier
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> EnterpriseAgreement.id" }
      - { name: service_family, type: string, source: input, description: "Service family this tier row applies to (e.g. COMPUTE, STORAGE, DATABASE)" }
      - { name: threshold_cents, type: integer, source: input, description: "Cumulative consumed_commitment_cents at which this marginal bracket begins (inclusive, >=)" }
      - { name: rate, type: number, source: input, description: "Marginal discount rate in [0, 1) applied inside this bracket" }

  - name: PricingAmendment
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> EnterpriseAgreement.id" }
      - { name: service_family, type: string, source: input, description: "Service family receiving private pricing" }
      - { name: discount_rate, type: number, source: input, description: "Private pricing discount off list price, in [0, 1)" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive), ISO8601" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive), ISO8601; half-open interval [effective_from, effective_to)" }

  - name: CommitmentPlan
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> BillingOrganization.id" }
      - { name: agreement_id, type: string, source: input, description: "FK -> EnterpriseAgreement.id; plan is scoped to this agreement (cascade-terminated with it)" }
      - { name: type, type: enum, source: input, description: "SAVINGS_PLAN | RESERVED_CAPACITY" }
      - { name: instance_family, type: string, source: input, description: "Instance/service family covered; RESERVED_CAPACITY plans count units against org.capacity_quota_units for this family" }
      - { name: units, type: integer, source: input, description: "Reserved unit count; required and >= 1 for RESERVED_CAPACITY, must be 0 for SAVINGS_PLAN" }
      - { name: hourly_commitment_cents, type: integer, source: input, description: "Hourly commitment amount in cents, >= 1" }
      - { name: plan_discount_rate, type: number, source: input, description: "Discount rate in [0, 1) applied to covered usage" }
      - { name: term_start, type: datetime, source: input, description: "Plan window start (inclusive)" }
      - { name: term_end, type: datetime, source: input, description: "Plan window end (exclusive); must be > term_start" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | TERMINATED" }

  - name: UsageRecord
    parent: null
    common_fields: false
    fields:
      - { name: linked_account_id, type: string, source: input, description: "FK -> LinkedAccount.id; account that consumed the usage" }
      - { name: org_id, type: string, source: computed, description: "FK -> BillingOrganization.id; denormalized from the linked account at ingest" }
      - { name: service_family, type: string, source: input, description: "Service family of the usage" }
      - { name: usage_hour_start, type: datetime, source: input, description: "Start of the usage hour (inclusive), ISO8601, minute/second must be 00:00" }
      - { name: list_price_cents, type: integer, source: input, description: "List-price value of the hour's usage, >= 0" }
      - { name: is_marketplace, type: boolean, source: input, default: false, description: "True for marketplace purchases, which count toward commitment under negotiated weighting" }
      - { name: period_index, type: integer, source: system, description: "Org current_period_index at ingest time" }
      - { name: status, type: enum, source: system, description: "INGESTED | BILLED" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; set when the record is billed into an invoice, null until then" }

  - name: CreditGrant
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> BillingOrganization.id" }
      - { name: amount_cents, type: integer, source: input, description: "Original grant amount, >= 1" }
      - { name: consumed_cents, type: integer, source: system, default: 0, description: "Amount consumed by finalized invoices" }
      - { name: forfeited_cents, type: integer, source: system, default: 0, description: "Amount forfeited by revoke or expiry" }
      - { name: remaining_cents, type: integer, source: computed, description: "= amount_cents - consumed_cents - forfeited_cents (conservation invariant)" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry instant (exclusive); grant is auto-EXPIRED by run-period-close when clock >= expires_at" }
      - { name: status, type: enum, source: system, description: "ISSUED | DEPLETING | EXHAUSTED | EXPIRED | REVOKED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> BillingOrganization.id" }
      - { name: period_index, type: integer, source: input, description: "Billing period this invoice covers" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | DISPUTED | SETTLED | VOIDED" }
      - { name: agreement_id, type: string, source: system, description: "FK -> EnterpriseAgreement.id; the org's ACTIVE agreement at generation time, null if none" }
      - { name: total_list_cents, type: integer, source: computed, default: 0, description: "Sum of line list_cents" }
      - { name: total_amendment_discount_cents, type: integer, source: computed, default: 0, description: "Sum of line amendment_discount_cents (stage 1)" }
      - { name: total_plan_discount_cents, type: integer, source: computed, default: 0, description: "Sum of line plan_discount_cents (stage 2)" }
      - { name: total_tier_discount_cents, type: integer, source: computed, default: 0, description: "Sum of line tier_discount_cents (stage 3)" }
      - { name: total_credit_applied_cents, type: integer, source: computed, default: 0, description: "Sum of line credit_applied_cents (stage 4)" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "Sum of line net_due_cents (sum of ROUNDED line values)" }

  - name: InvoiceLine
    parent: null
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: linked_account_id, type: string, source: system, description: "FK -> LinkedAccount.id" }
      - { name: service_family, type: string, source: system, description: "Service family of the line" }
      - { name: list_cents, type: integer, source: system, description: "Pre-discount list value of the line" }
      - { name: amendment_discount_cents, type: integer, source: system, description: "Stage-1 private pricing discount on this line" }
      - { name: plan_covered_cents, type: integer, source: system, description: "Post-amendment amount covered by plans on this line" }
      - { name: plan_discount_cents, type: integer, source: system, description: "Stage-2 plan discount on this line" }
      - { name: tier_discount_cents, type: integer, source: system, description: "Stage-3 tiered agreement discount on this line" }
      - { name: credit_applied_cents, type: integer, source: system, description: "Stage-4 credit applied on this line (computed at generation, debited at finalize)" }
      - { name: net_due_cents, type: integer, source: system, description: "Round-half-up to cents at line finalization; invoice totals sum these rounded values" }

  - name: TrueUpCharge
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> EnterpriseAgreement.id" }
      - { name: type, type: enum, source: system, description: "SHORTFALL | EARLY_TERMINATION" }
      - { name: plan_id, type: string, source: system, description: "FK -> CommitmentPlan.id; set for EARLY_TERMINATION charges, null for SHORTFALL" }
      - { name: amount_cents, type: integer, source: computed, description: "SHORTFALL: max(0, committed - consumed_pass2); EARLY_TERMINATION: 50% of remaining hourly commitment over remaining hours" }
      - { name: status, type: enum, source: system, description: "ASSESSED | BILLED | WAIVED | SETTLED" }

  - name: RenewalForecast
    parent: null
    common_fields: false
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> EnterpriseAgreement.id" }
      - { name: variant, type: enum, source: input, description: "LINEAR | COHORT_WEIGHTED" }
      - { name: window_periods, type: integer, source: input, default: 3, description: "Number of most recent closed periods used; must be >= 3" }
      - { name: forecast_cents, type: integer, source: computed, description: "Forecast next-term eligible spend" }
      - { name: generated_period_index, type: integer, source: system, description: "Org current_period_index at generation time" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BillingOrganization
    initial_state: null
    terminal_states: []
    transitions: []
    note: "No lifecycle status; current_period_index advances only via run-period-close."

  - entity: LinkedAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/linked-accounts/{id}/suspend"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "increments LinkedAccount.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/linked-accounts/{id}/reactivate"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "increments LinkedAccount.version by 1"

  - entity: EnterpriseAgreement
    initial_state: "lifecycle_status=NEGOTIATION, renewal_status=NONE"
    terminal_states: ["lifecycle_status=EXPIRED", "lifecycle_status=TERMINATED", "renewal_status=RENEWED", "renewal_status=ABANDONED"]
    note: "Two parallel state dimensions on one entity. lifecycle transitions never change renewal_status except terminate (forces renewal_status=NONE when it was RENEWAL_REVIEW); renewal transitions require lifecycle_status=ACTIVE."
    transitions:
      - from: "lifecycle NEGOTIATION"
        to: "lifecycle ACTIVE"
        trigger: "POST /api/enterprise-agreements/{id}/activate"
        actor: OrgAdmin
        preconditions:
          - "logical clock >= term_start and < term_end (else ERR_AMENDMENT_OUT_OF_TERM)"
          - "at least one DiscountTier exists for the agreement (else ERR_SERVICE_FAMILY_NOT_COVERED)"
          - "no other agreement of the same org has lifecycle_status=ACTIVE (else ERR_ORG_HAS_ACTIVE_AGREEMENT)"
        side_effects:
          - "increments EnterpriseAgreement.version by 1"
      - from: "lifecycle ACTIVE"
        to: "lifecycle SUSPENDED"
        trigger: "POST /api/enterprise-agreements/{id}/suspend"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "increments EnterpriseAgreement.version by 1"
      - from: "lifecycle SUSPENDED"
        to: "lifecycle ACTIVE"
        trigger: "POST /api/enterprise-agreements/{id}/resume"
        actor: OrgAdmin
        preconditions:
          - "no other agreement of the same org has lifecycle_status=ACTIVE (else ERR_ORG_HAS_ACTIVE_AGREEMENT)"
        side_effects:
          - "increments EnterpriseAgreement.version by 1"
      - from: "lifecycle ACTIVE"
        to: "lifecycle EXPIRED"
        trigger: "system (run-period-close when logical clock >= term_end)"
        actor: system
        preconditions: []
        side_effects:
          - "increments EnterpriseAgreement.version by 1"
      - from: "lifecycle ACTIVE"
        to: "lifecycle TERMINATED"
        trigger: "POST /api/enterprise-agreements/{id}/terminate"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "cascade link 1: every CommitmentPlan with agreement_id == this agreement and status == ACTIVE transitions to TERMINATED"
          - "cascade link 2: each plan TERMINATED by link 1 spawns a TrueUpCharge (type=EARLY_TERMINATION, status=ASSESSED, plan_id set, amount_cents per commitment_trueup early-termination rule)"
          - "cascade link 3: each TrueUpCharge created by link 2 recomputes agreement.accrued_trueup_cents (sum over non-WAIVED charges)"
          - "renewal_status forced to NONE if it was RENEWAL_REVIEW"
          - "increments EnterpriseAgreement.version by 1"
      - from: "lifecycle SUSPENDED"
        to: "lifecycle TERMINATED"
        trigger: "POST /api/enterprise-agreements/{id}/terminate"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "same cascade links 1-3 as ACTIVE->TERMINATED"
          - "increments EnterpriseAgreement.version by 1"
      - from: "renewal NONE"
        to: "renewal RENEWAL_REVIEW"
        trigger: "POST /api/enterprise-agreements/{id}/open-renewal-review"
        actor: FinanceAnalyst
        preconditions:
          - "lifecycle_status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "increments EnterpriseAgreement.version by 1"
      - from: "renewal RENEWAL_REVIEW"
        to: "renewal RENEWED"
        trigger: "POST /api/enterprise-agreements/{id}/close-renewal-review with outcome=RENEWED"
        actor: FinanceAnalyst
        preconditions:
          - "lifecycle_status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "increments EnterpriseAgreement.version by 1"
      - from: "renewal RENEWAL_REVIEW"
        to: "renewal ABANDONED"
        trigger: "POST /api/enterprise-agreements/{id}/close-renewal-review with outcome=ABANDONED"
        actor: FinanceAnalyst
        preconditions:
          - "lifecycle_status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "increments EnterpriseAgreement.version by 1"

  - entity: CommitmentPlan
    initial_state: ACTIVE
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run-period-close when logical clock >= term_end)"
        actor: system
        preconditions: []
        side_effects:
          - "increments CommitmentPlan.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/commitment-plans/{id}/terminate"
        actor: OrgAdmin
        preconditions:
          - "no Invoice of the same org is in status DRAFT (else ERR_INVOICE_DRAFT_BLOCKS_TERMINATION)"
        side_effects:
          - "spawns a TrueUpCharge (type=EARLY_TERMINATION, status=ASSESSED, plan_id=this plan)"
          - "recomputes the scoped agreement's accrued_trueup_cents"
          - "increments CommitmentPlan.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (cascade from EnterpriseAgreement terminate)"
        actor: system
        preconditions: []
        side_effects:
          - "spawns a TrueUpCharge (type=EARLY_TERMINATION, status=ASSESSED, plan_id=this plan)"
          - "recomputes the scoped agreement's accrued_trueup_cents"
          - "increments CommitmentPlan.version by 1"

  - entity: UsageRecord
    initial_state: INGESTED
    terminal_states: [BILLED]
    transitions:
      - from: INGESTED
        to: BILLED
        trigger: "system (POST /api/invoices/generate includes the record in a new DRAFT invoice)"
        actor: system
        preconditions: []
        side_effects:
          - "sets invoice_id to the generated invoice"

  - entity: CreditGrant
    initial_state: ISSUED
    terminal_states: [EXHAUSTED, EXPIRED, REVOKED]
    transitions:
      - from: ISSUED
        to: DEPLETING
        trigger: "system (first credit consumption at invoice finalize)"
        actor: system
        preconditions: []
        side_effects:
          - "consumed_cents increases; remaining_cents recomputed"
      - from: DEPLETING
        to: DEPLETING
        trigger: "system (subsequent partial consumption at invoice finalize)"
        actor: system
        preconditions: []
        side_effects:
          - "consumed_cents increases; remaining_cents recomputed"
      - from: ISSUED
        to: EXHAUSTED
        trigger: "system (consumption drives remaining_cents to exactly 0)"
        actor: system
        preconditions: []
        side_effects:
          - "recomputes org.unapplied_credit_cents"
      - from: DEPLETING
        to: EXHAUSTED
        trigger: "system (consumption drives remaining_cents to exactly 0)"
        actor: system
        preconditions: []
        side_effects:
          - "recomputes org.unapplied_credit_cents"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (run-period-close when logical clock >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "forfeited_cents = remaining_cents; consumed_cents unchanged; remaining_cents recomputed to 0"
          - "recomputes org.unapplied_credit_cents"
      - from: DEPLETING
        to: EXPIRED
        trigger: "system (run-period-close when logical clock >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "forfeited_cents = remaining_cents; remaining_cents recomputed to 0"
          - "recomputes org.unapplied_credit_cents"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /api/credit-grants/{id}/revoke"
        actor: PlatformBillingOperator
        preconditions: []
        side_effects:
          - "forfeited_cents = remaining_cents; remaining_cents recomputed to 0"
          - "recomputes org.unapplied_credit_cents"
      - from: DEPLETING
        to: REVOKED
        trigger: "POST /api/credit-grants/{id}/revoke"
        actor: PlatformBillingOperator
        preconditions: []
        side_effects:
          - "forfeited_cents = remaining_cents; remaining_cents recomputed to 0"
          - "recomputes org.unapplied_credit_cents"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /api/invoices/{id}/finalize"
        actor: OrgAdmin
        preconditions:
          - "if invoice.agreement_id is non-null, that agreement's lifecycle_status must be ACTIVE or EXPIRED (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "cascade link 1: credit consumption is debited against CreditGrants of the org with status IN {ISSUED, DEPLETING}, ordered by expires_at ASC then created_at ASC, each debited min(remaining_cents, outstanding invoice credit pool)"
          - "cascade link 2: each grant whose remaining_cents reaches exactly 0 transitions ISSUED/DEPLETING -> EXHAUSTED; partially debited grants transition ISSUED -> DEPLETING"
          - "cascade link 3: each grant EXHAUSTED/DEPLETING transition recomputes org.unapplied_credit_cents"
          - "increments Invoice.version by 1"
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /api/invoices/{id}/dispute"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "increments Invoice.version by 1"
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /api/invoices/{id}/resolve-dispute"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "increments Invoice.version by 1"
      - from: FINALIZED
        to: SETTLED
        trigger: "POST /api/invoices/{id}/settle"
        actor: OrgAdmin
        preconditions:
          - "amount_cents in the request must equal total_due_cents exactly (else ERR_SETTLEMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "every TrueUpCharge of the org's agreement with status BILLED transitions to SETTLED"
          - "increments Invoice.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /api/invoices/{id}/void"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "usage records billed into this invoice revert to INGESTED with invoice_id=null"
          - "increments Invoice.version by 1"

  - entity: TrueUpCharge
    initial_state: ASSESSED
    terminal_states: [WAIVED, SETTLED]
    transitions:
      - from: ASSESSED
        to: BILLED
        trigger: "POST /api/true-up-charges/{id}/bill"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "recomputes agreement.accrued_trueup_cents"
          - "increments TrueUpCharge.version by 1"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /api/true-up-charges/{id}/waive"
        actor: FinanceAnalyst
        preconditions: []
        side_effects:
          - "recomputes agreement.accrued_trueup_cents (WAIVED charges excluded)"
          - "increments TrueUpCharge.version by 1"
      - from: BILLED
        to: SETTLED
        trigger: "system (invoice settle of the org's FINALIZED invoice)"
        actor: system
        preconditions: []
        side_effects:
          - "increments TrueUpCharge.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-agreement
    parent_entity: EnterpriseAgreement
    write_endpoint: "POST /api/pricing-amendments"
    occ_field: "expected_agreement_version"
    description: |
      Creating a PricingAmendment against an EnterpriseAgreement whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just mutated the agreement (suspend,
      resume, tier changes via cascades, or a prior amendment) and the current
      writer's view of the agreement's pricing terms is therefore stale.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tiered_eda_discount
    trigger: "invoice line computation (stage 3 of invoice_waterfall) for invoices whose agreement_id is non-null"
    algorithm: tiered_pricing
    formula: |
      # Marginal brackets over cumulative consumed_commitment_cents.
      # Tiers for the line's service_family sorted by threshold_cents ASC.
      # c0 = agreement.consumed_commitment_cents accumulated by lines already
      #      computed for this invoice (lines processed in order
      #      linked_account.created_at ASC, then service_family ASC);
      # e  = line amount entering stage 3 (post-amendment, post-plan);
      # c1 = c0 + e.
      # discount = SUM over brackets [t_i, t_{i+1}) with rate r_i of
      #   r_i * max(0, min(c1, t_{i+1}) - max(c0, t_i))
      # where the last bracket's t_{i+1} = +infinity.
      # Boundary: a tier's bracket starts AT threshold (>=): consumed exactly
      # equal to threshold_cents qualifies for the higher bracket.
    input_set: "InvoiceLines of the invoice being generated, processed in order linked_account.created_at ASC then service_family ASC; DiscountTiers of the invoice agreement matching the line's service_family; excluded when invoice.agreement_id is null or agreement has no tier for the family (tier discount 0)"
    constants:
      LAST_BRACKET_TOP: "+infinity"
    precision: "intermediate values keep full precision; rounding happens once per line at line finalization per invoice_waterfall"
    variants: []

  - name: invoice_waterfall
    trigger: "POST /api/invoices/generate"
    algorithm: waterfall_allocation
    formula: |
      # Fixed stage order (pinned, non-commutative):
      #   Stage 1 — private pricing amendment: for each usage record, if a
      #     PricingAmendment of the invoice agreement covers the record's
      #     service_family AND the record's usage_hour_start falls in the
      #     half-open window [effective_from, effective_to), line base gets
      #     list * (1 - amendment.discount_rate); else list price.
      #   Stage 2 — plan coverage (savings_plan_coverage, ACTUAL variant):
      #     covered portion discounted by plan_discount_rate.
      #   Stage 3 — tiered agreement discount (tiered_eda_discount) on the
      #     post-stage-2 amount.
      #   Stage 4 — credit grants (credit_consumption): computed against the
      #     post-stage-3 remainder at generation; debited at finalize.
      # Rounding (pinned order, mode b): each stage keeps full precision;
      # net_due_cents of each InvoiceLine is rounded ONCE, round_half_up to
      # integer cents, at line finalization; Invoice.total_due_cents is the
      # SUM of the ROUNDED line net_due_cents — never round(sum(unrounded)).
      # Stage discount fields on the line are stored as integer cents derived
      # consistently: list_cents - amendment_discount - plan_discount -
      # tier_discount - credit_applied == net_due_cents for every line,
      # with per-stage fields rounded round_half_up and the final stage
      # (credit_applied, or tier if no credit) absorbing any 1-cent residual.
    input_set: "UsageRecords of the org with status INGESTED and period_index == invoice.period_index; ACTIVE CommitmentPlans of the org whose [term_start, term_end) covers the usage hour; PricingAmendments of the invoice agreement; CreditGrants of the org with status IN {ISSUED, DEPLETING}"
    constants: {}
    precision: "0 decimal places (integer cents), round_half_up once per line at finalization"
    variants: []

  - name: savings_plan_coverage
    trigger: "stage 2 of invoice_waterfall (ACTUAL) and GET /api/commitment-plans/{id}/coverage (either variant)"
    algorithm: chronological
    formula: |
      # ACTUAL (chronological): replay usage hour by hour, usage_hour_start ASC
      # (tie-break: linked_account.created_at ASC). Per hour, the plan's
      # remaining commitment budget is hourly_commitment_cents. Coverage is
      # shared org-wide (consolidated billing): within one hour, post-amendment
      # usage amounts of the plan's instance_family across ALL of the org's
      # linked accounts are covered in account created_at ASC order until the
      # hourly budget is exhausted. covered = SUM over hours of
      # min(hourly_family_usage_post_amendment, hourly_commitment_cents).
      # PROJECTED (forward_looking): assumes full utilization of the hourly
      # commitment for every hour in the requested window regardless of actual
      # usage: covered = hourly_commitment_cents * hours_in_window.
      # The two variants diverge whenever any hour is under-utilized.
    input_set: "ACTUAL: UsageRecords (status INGESTED or BILLED) of the org in the plan's instance_family with usage_hour_start inside the window; PROJECTED: window hour count only"
    constants: {}
    precision: "integer cents; per-hour min() before summation"
    variants:
      - name: ACTUAL
        when: "invoice generation and coverage endpoint with mode=ACTUAL"
        difference: "chronological replay of real usage; under-utilized hours yield less coverage than commitment"
      - name: PROJECTED
        when: "coverage endpoint with mode=PROJECTED (what-if at purchase time)"
        difference: "assumes 100% utilization; covered = hourly_commitment_cents * hours_in_window"

  - name: commitment_trueup
    trigger: "POST /api/true-up-charges/assess (SHORTFALL) and CommitmentPlan termination (EARLY_TERMINATION)"
    algorithm: threshold
    formula: |
      # SHORTFALL — circular-looking dependency, evaluation order PINNED:
      #   Pass 1: consumed_1 = SUM(list_price_cents of eligible non-marketplace
      #     usage in the agreement's families over the term)
      #     + MARKETPLACE_BASE_WEIGHT * SUM(marketplace list_price_cents).
      #   Tier selection: highest DiscountTier (any family on the agreement)
      #   whose threshold_cents <= consumed_1 (>= boundary: consumed exactly
      #   equal to threshold qualifies).
      #   Pass 2: marketplace weight w = 1.0 if the selected tier is the
      #     agreement's highest-threshold tier, else MARKETPLACE_BASE_WEIGHT;
      #     consumed_2 = direct + w * marketplace.
      #   shortfall = max(0, committed_spend_cents - consumed_2).
      #   If shortfall == 0 (including the boundary consumed_2 == committed):
      #   NO TrueUpCharge is created (empty result, not a zero-amount charge).
      # EARLY_TERMINATION: amount = round_half_up(0.5 * hourly_commitment_cents
      #   * remaining_hours) where remaining_hours = whole hours between the
      #   logical clock and plan.term_end (0 if clock >= term_end).
    input_set: "SHORTFALL: UsageRecords of the org with usage_hour_start in [agreement.term_start, agreement.term_end), service_family covered by at least one DiscountTier of the agreement (marketplace records included under negotiated weighting); EARLY_TERMINATION: the terminated plan and the logical clock"
    constants:
      MARKETPLACE_BASE_WEIGHT: 0.5
      TOP_TIER_MARKETPLACE_WEIGHT: 1.0
      EARLY_TERM_PENALTY_RATE: 0.5
    precision: "integer cents; marketplace contribution per record truncated to integer cents before summation (floor of list_price_cents * weight)"
    variants: []

  - name: renewal_forecast
    trigger: "POST /api/renewal-forecasts"
    algorithm: forward_looking
    formula: |
      # Let U[1..W] be the org's total eligible list spend per closed period,
      # most recent W closed periods, U[1] most recent.
      # LINEAR: forecast = U[1] + mean of consecutive deltas
      #   = U[1] + (U[1] - U[W]) / (W - 1).
      # COHORT_WEIGHTED: forecast = 0.5*U[1] + 0.3*U[2] + 0.2*U[3]
      #   (W pinned to 3 for this variant; weights fixed).
      # Requires at least W closed periods (periods with index <
      # current_period_index having any usage) — else ERR_FORECAST_WINDOW_INSUFFICIENT.
    input_set: "UsageRecords of the org grouped by period_index, periods with index < org.current_period_index, most recent window_periods periods"
    constants:
      COHORT_W1: 0.5
      COHORT_W2: 0.3
      COHORT_W3: 0.2
    precision: "integer cents, round_half_up"
    variants:
      - name: LINEAR
        when: "variant=LINEAR"
        difference: "extrapolates average period-over-period growth from the window endpoints"
      - name: COHORT_WEIGHTED
        when: "variant=COHORT_WEIGHTED"
        difference: "recency-weighted level of the last 3 periods; ignores growth trend"

  - name: credit_consumption
    trigger: "stage 4 of invoice_waterfall at generation (computed) and POST /api/invoices/{id}/finalize (debited)"
    algorithm: chronological
    formula: |
      # Candidate pool: CreditGrants of the org with status IN {ISSUED,
      # DEPLETING} and expires_at > logical clock. Order: expires_at ASC,
      # tie-break created_at ASC. Walk the pool debiting
      # min(grant.remaining_cents, outstanding_pool) until the invoice's total
      # stage-4 pool (sum of post-stage-3 line remainders) is exhausted.
      # Conservation invariant: for every grant at all times,
      #   amount_cents == consumed_cents + remaining_cents + forfeited_cents.
    input_set: "CreditGrants of the org with status IN {ISSUED, DEPLETING}, expires_at strictly after the logical clock"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id referenced in the path or body exists (org_id, linked_account_id, agreement_id, plan_id, invoice_id, grant_id, trueup_id), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource is in a state that permits this transition per §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: state
    check: "cross-entity state gates: usage ingest requires LinkedAccount ACTIVE (ERR_ACCOUNT_SUSPENDED); plan purchase requires scoped agreement lifecycle ACTIVE (ERR_AGREEMENT_SUSPENDED if SUSPENDED, ERR_AGREEMENT_NOT_ACTIVE otherwise); amendment creation requires agreement lifecycle ACTIVE or SUSPENDED; renewal review requires lifecycle ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /api/commitment-plans", "POST /api/usage-records", "POST /api/pricing-amendments", "POST /api/enterprise-agreements/{id}/open-renewal-review"]
  - priority: 6
    category: business_temporal
    check: "temporal windows: amendment [effective_from, effective_to) must lie within [agreement.term_start, agreement.term_end) (ERR_AMENDMENT_OUT_OF_TERM); amendment must not overlap another amendment of the same agreement + service_family under half-open semantics — adjacency (a.effective_to == b.effective_from) is NOT overlap (ERR_AMENDMENT_WINDOW_OVERLAP); usage_hour_start must have zero minute/second (ERR_INVALID_REQUEST)"
    error_id: ERR_AMENDMENT_WINDOW_OVERLAP
    http_status: 422
    applies_to: ["POST /api/pricing-amendments", "POST /api/usage-records"]
  - priority: 7
    category: business_referential
    check: "amendment service_family must be covered by at least one DiscountTier of the agreement (ERR_SERVICE_FAMILY_NOT_COVERED); usage record's org must have an agreement covering the family for the usage to be commitment-eligible (ineligible usage is still ingested)"
    error_id: ERR_SERVICE_FAMILY_NOT_COVERED
    http_status: 422
    applies_to: ["POST /api/pricing-amendments"]
  - priority: 8
    category: business_constraint
    check: "structural constraints: DiscountTier threshold_cents strictly increasing per (agreement, service_family) (ERR_TIER_THRESHOLD_NOT_INCREASING); duplicate usage record on (linked_account_id, service_family, usage_hour_start) rejected (ERR_DUPLICATE_USAGE_RECORD); RESERVED_CAPACITY aggregate quota — sum of units over the org's ACTIVE reserved plans of the same instance_family whose [term_start, term_end) intersects the new plan's window, plus new units, must be <= org.capacity_quota_units (ERR_CAPACITY_QUOTA_EXCEEDED); SAVINGS_PLAN must have units == 0 and RESERVED_CAPACITY units >= 1 (ERR_INVALID_REQUEST); invoice generate rejects a period already covered by a non-VOIDED invoice of the org (ERR_INVOICE_PERIOD_ALREADY_BILLED)"
    error_id: ERR_CAPACITY_QUOTA_EXCEEDED
    http_status: 422
    applies_to: ["POST /api/discount-tiers", "POST /api/usage-records", "POST /api/commitment-plans", "POST /api/invoices/generate"]
  - priority: 9
    category: business_fiscal
    check: "fiscal checks last: sum of hourly_commitment_cents over the org's ACTIVE plans plus the new plan must be <= org.max_hourly_commitment_cents (ERR_COMMITMENT_CEILING_EXCEEDED); settle amount_cents must equal invoice.total_due_cents (ERR_SETTLEMENT_AMOUNT_MISMATCH); amounts must be positive where required (ERR_INVALID_REQUEST)"
    error_id: ERR_COMMITMENT_CEILING_EXCEEDED
    http_status: 422
    applies_to: ["POST /api/commitment-plans", "POST /api/invoices/{id}/settle", "POST /api/credit-grants", "POST /api/enterprise-agreements"]
  - priority: 10
    category: business_temporal
    check: "term-end gates: true-up assess requires agreement lifecycle EXPIRED (ERR_TERM_NOT_ENDED); renewal forecast requires >= window_periods closed periods with usage (ERR_FORECAST_WINDOW_INSUFFICIENT)"
    error_id: ERR_TERM_NOT_ENDED
    http_status: 409
    applies_to: ["POST /api/true-up-charges/assess", "POST /api/renewal-forecasts"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Sets the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time."
    roles: [PlatformBillingOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: []

  - method: POST
    path: "/api/billing-orgs"
    description: "Create a billing organization (payer root)."
    roles: [PlatformBillingOperator]
    code: 201
    input: [name, "currency?", max_hourly_commitment_cents, capacity_quota_units]
    output: BillingOrganization
    side_effects: []

  - method: GET
    path: "/api/billing-orgs/{id}"
    description: "Fetch one billing organization."
    roles: [PlatformBillingOperator, OrgAdmin, FinanceAnalyst]
    code: 200
    input: []
    output: BillingOrganization
    side_effects: []

  - method: GET
    path: "/api/billing-orgs"
    description: "List billing organizations (paginated)."
    roles: [PlatformBillingOperator, OrgAdmin, FinanceAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: BillingOrganization[]
    side_effects: []

  - method: POST
    path: "/api/billing-orgs/{id}/run-period-close"
    description: "Advance the org's period counter by 1: closes the current period; auto-EXPIREs CreditGrants whose expires_at <= clock; auto-EXPIREs CommitmentPlans and ACTIVE agreements whose term_end <= clock."
    roles: [PlatformBillingOperator]
    code: 200
    input: []
    output: BillingOrganization
    side_effects:
      - "current_period_index += 1"
      - "CreditGrant ISSUED/DEPLETING -> EXPIRED where clock >= expires_at (forfeits remainder)"
      - "CommitmentPlan ACTIVE -> EXPIRED where clock >= term_end"
      - "EnterpriseAgreement lifecycle ACTIVE -> EXPIRED where clock >= term_end"
      - "recomputes org.unapplied_credit_cents"

  - method: POST
    path: "/api/linked-accounts"
    description: "Create a linked account under an org."
    roles: [OrgAdmin]
    code: 201
    input: [org_id, name, external_ref]
    output: LinkedAccount
    side_effects: []

  - method: GET
    path: "/api/linked-accounts/{id}"
    description: "Fetch one linked account."
    roles: [OrgAdmin, FinanceAnalyst, LinkedAccountManager, PlatformBillingOperator]
    code: 200
    input: []
    output: LinkedAccount
    side_effects: []

  - method: GET
    path: "/api/linked-accounts"
    description: "List linked accounts, optionally filtered by org."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["org_id?", "limit?", "offset?"]
    output: LinkedAccount[]
    side_effects: []

  - method: POST
    path: "/api/linked-accounts/{id}/suspend"
    description: "Suspend a linked account (blocks usage ingest)."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: LinkedAccount
    side_effects: ["LinkedAccount ACTIVE -> SUSPENDED; increments LinkedAccount.version by 1"]

  - method: POST
    path: "/api/linked-accounts/{id}/reactivate"
    description: "Reactivate a suspended linked account."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: LinkedAccount
    side_effects: ["LinkedAccount SUSPENDED -> ACTIVE; increments LinkedAccount.version by 1"]

  - method: POST
    path: "/api/enterprise-agreements"
    description: "Create an enterprise agreement in NEGOTIATION."
    roles: [OrgAdmin]
    code: 201
    input: [org_id, name, committed_spend_cents, term_start, term_end]
    output: EnterpriseAgreement
    side_effects: []

  - method: GET
    path: "/api/enterprise-agreements/{id}"
    description: "Fetch one enterprise agreement."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: []
    output: EnterpriseAgreement
    side_effects: []

  - method: GET
    path: "/api/enterprise-agreements"
    description: "List enterprise agreements, optionally filtered by org."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["org_id?", "limit?", "offset?"]
    output: EnterpriseAgreement[]
    side_effects: []

  - method: POST
    path: "/api/enterprise-agreements/{id}/activate"
    description: "Activate an agreement (NEGOTIATION -> ACTIVE); requires at least one tier, clock within term, and no other ACTIVE agreement in the org."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: EnterpriseAgreement
    side_effects: ["increments EnterpriseAgreement.version by 1"]

  - method: POST
    path: "/api/enterprise-agreements/{id}/suspend"
    description: "Suspend an ACTIVE agreement (blocks plan purchases and renewals)."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: EnterpriseAgreement
    side_effects: ["increments EnterpriseAgreement.version by 1"]

  - method: POST
    path: "/api/enterprise-agreements/{id}/resume"
    description: "Resume a SUSPENDED agreement."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: EnterpriseAgreement
    side_effects: ["increments EnterpriseAgreement.version by 1"]

  - method: POST
    path: "/api/enterprise-agreements/{id}/terminate"
    description: "Terminate an agreement; cascades to plans, spawns early-termination true-up charges, recomputes accrued true-up."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: EnterpriseAgreement
    side_effects:
      - "cascade link 1: scoped ACTIVE CommitmentPlans -> TERMINATED"
      - "cascade link 2: each terminated plan spawns TrueUpCharge EARLY_TERMINATION ASSESSED"
      - "cascade link 3: agreement.accrued_trueup_cents recomputed"
      - "increments EnterpriseAgreement.version by 1"

  - method: POST
    path: "/api/enterprise-agreements/{id}/open-renewal-review"
    description: "Open renewal review on the renewal axis (NONE -> RENEWAL_REVIEW); requires lifecycle ACTIVE."
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: EnterpriseAgreement
    side_effects: ["increments EnterpriseAgreement.version by 1"]

  - method: POST
    path: "/api/enterprise-agreements/{id}/close-renewal-review"
    description: "Close renewal review with outcome RENEWED or ABANDONED; requires lifecycle ACTIVE."
    roles: [FinanceAnalyst]
    code: 200
    input: [outcome]
    output: EnterpriseAgreement
    side_effects: ["increments EnterpriseAgreement.version by 1"]

  - method: POST
    path: "/api/discount-tiers"
    description: "Add a tier row to an agreement (thresholds strictly increasing per family)."
    roles: [OrgAdmin]
    code: 201
    input: [agreement_id, service_family, threshold_cents, rate]
    output: DiscountTier
    side_effects: ["increments EnterpriseAgreement.version by 1"]

  - method: GET
    path: "/api/discount-tiers/{id}"
    description: "Fetch one discount tier."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: []
    output: DiscountTier
    side_effects: []

  - method: GET
    path: "/api/discount-tiers"
    description: "List discount tiers, optionally filtered by agreement."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["agreement_id?", "limit?", "offset?"]
    output: DiscountTier[]
    side_effects: []

  - method: POST
    path: "/api/pricing-amendments"
    description: "Create a private pricing amendment on an agreement. Requires expected_agreement_version (OCC): rejected with ERR_STALE_AGREEMENT_VERSION when the agreement's version has advanced past the caller's observed value."
    roles: [FinanceAnalyst]
    code: 201
    input: [agreement_id, service_family, discount_rate, effective_from, effective_to, expected_agreement_version]
    output: PricingAmendment
    side_effects: ["increments EnterpriseAgreement.version by 1"]

  - method: GET
    path: "/api/pricing-amendments/{id}"
    description: "Fetch one pricing amendment."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: []
    output: PricingAmendment
    side_effects: []

  - method: GET
    path: "/api/pricing-amendments"
    description: "List pricing amendments, optionally filtered by agreement."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["agreement_id?", "limit?", "offset?"]
    output: PricingAmendment[]
    side_effects: []

  - method: POST
    path: "/api/commitment-plans"
    description: "Purchase a savings plan or reserved capacity commitment. Validates agreement state, reserved-capacity aggregate quota, and the org hourly-commitment ceiling."
    roles: [OrgAdmin]
    code: 201
    input: [org_id, agreement_id, type, instance_family, units, hourly_commitment_cents, plan_discount_rate, term_start, term_end]
    output: CommitmentPlan
    side_effects: []

  - method: GET
    path: "/api/commitment-plans/{id}"
    description: "Fetch one commitment plan."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: []
    output: CommitmentPlan
    side_effects: []

  - method: GET
    path: "/api/commitment-plans"
    description: "List commitment plans, optionally filtered by org or agreement."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["org_id?", "agreement_id?", "limit?", "offset?"]
    output: CommitmentPlan[]
    side_effects: []

  - method: POST
    path: "/api/commitment-plans/{id}/terminate"
    description: "Terminate a plan early; spawns an EARLY_TERMINATION TrueUpCharge. Blocked while the org has a DRAFT invoice."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: CommitmentPlan
    side_effects:
      - "spawns TrueUpCharge EARLY_TERMINATION ASSESSED"
      - "recomputes agreement.accrued_trueup_cents"
      - "increments CommitmentPlan.version by 1"

  - method: GET
    path: "/api/commitment-plans/{id}/coverage"
    description: "Computed read: plan coverage over a window, mode=ACTUAL (chronological replay) or mode=PROJECTED (full utilization)."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["mode?", "window_start?", "window_end?"]
    output: { covered_cents: integer, mode: string, window_hours: integer }
    side_effects: []

  - method: POST
    path: "/api/usage-records"
    description: "Ingest one hour of usage for a linked account. LinkedAccountManager may only ingest for their own account (X-User-ID == linked_account_id)."
    roles: [LinkedAccountManager, PlatformBillingOperator]
    code: 201
    input: [linked_account_id, service_family, usage_hour_start, list_price_cents, "is_marketplace?"]
    output: UsageRecord
    side_effects: ["sets org_id and period_index from the account and org"]

  - method: GET
    path: "/api/usage-records/{id}"
    description: "Fetch one usage record."
    roles: [OrgAdmin, FinanceAnalyst, LinkedAccountManager, PlatformBillingOperator]
    code: 200
    input: []
    output: UsageRecord
    side_effects: []

  - method: GET
    path: "/api/usage-records"
    description: "List usage records, optionally filtered by account, org, or period."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["linked_account_id?", "org_id?", "period_index?", "invoice_id?", "limit?", "offset?"]
    output: UsageRecord[]
    side_effects: []

  - method: POST
    path: "/api/credit-grants"
    description: "Issue a credit grant to an org."
    roles: [PlatformBillingOperator]
    code: 201
    input: [org_id, amount_cents, expires_at]
    output: CreditGrant
    side_effects: ["recomputes org.unapplied_credit_cents"]

  - method: GET
    path: "/api/credit-grants/{id}"
    description: "Fetch one credit grant."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: []
    output: CreditGrant
    side_effects: []

  - method: GET
    path: "/api/credit-grants"
    description: "List credit grants, optionally filtered by org."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["org_id?", "limit?", "offset?"]
    output: CreditGrant[]
    side_effects: []

  - method: POST
    path: "/api/credit-grants/{id}/revoke"
    description: "Revoke a grant; remaining value is forfeited (conservation invariant maintained)."
    roles: [PlatformBillingOperator]
    code: 200
    input: []
    output: CreditGrant
    side_effects:
      - "forfeited_cents = remaining_cents; remaining_cents -> 0"
      - "recomputes org.unapplied_credit_cents"
      - "increments CreditGrant.version by 1"

  - method: POST
    path: "/api/invoices/generate"
    description: "Generate a DRAFT invoice for an org and period: bills all INGESTED usage of the period, runs invoice_waterfall (amendment -> plan -> tier -> credit), rounds per line, sums rounded lines. Selects the org's unique ACTIVE agreement (null if none)."
    roles: [OrgAdmin]
    code: 201
    input: [org_id, period_index]
    output: Invoice
    side_effects:
      - "creates InvoiceLines (one per linked account x service family with usage in the period)"
      - "UsageRecords of the period transition INGESTED -> BILLED with invoice_id set"
      - "agreement.consumed_commitment_cents increases by the period's eligible spend (pass-1 marketplace weight)"

  - method: GET
    path: "/api/invoices/{id}"
    description: "Fetch one invoice."
    roles: [OrgAdmin, FinanceAnalyst, LinkedAccountManager, PlatformBillingOperator]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/api/invoices"
    description: "List invoices, optionally filtered by org."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["org_id?", "agreement_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/api/invoices/{id}/lines"
    description: "List the computed lines of an invoice."
    roles: [OrgAdmin, FinanceAnalyst, LinkedAccountManager, PlatformBillingOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []

  - method: GET
    path: "/api/invoice-lines/{id}"
    description: "Fetch one invoice line."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []

  - method: GET
    path: "/api/invoice-lines"
    description: "List invoice lines, optionally filtered by invoice or linked account."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["invoice_id?", "linked_account_id?", "limit?", "offset?"]
    output: InvoiceLine[]
    side_effects: []

  - method: POST
    path: "/api/invoices/{id}/finalize"
    description: "Finalize a DRAFT invoice; debits credit grants in expiry order (cascade to EXHAUSTED and org.unapplied_credit_cents)."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "cascade link 1: credit pool debited from grants ordered expires_at ASC, created_at ASC"
      - "cascade link 2: grants reaching 0 transition to EXHAUSTED; partially debited ISSUED grants -> DEPLETING"
      - "cascade link 3: org.unapplied_credit_cents recomputed"
      - "increments Invoice.version by 1"

  - method: POST
    path: "/api/invoices/{id}/dispute"
    description: "Dispute a FINALIZED invoice."
    roles: [OrgAdmin]
    code: 200
    input: [reason]
    output: Invoice
    side_effects: ["increments Invoice.version by 1"]

  - method: POST
    path: "/api/invoices/{id}/resolve-dispute"
    description: "Resolve a dispute; invoice returns DISPUTED -> FINALIZED (cycle)."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["increments Invoice.version by 1"]

  - method: POST
    path: "/api/invoices/{id}/settle"
    description: "Settle a FINALIZED invoice; amount must equal total_due_cents exactly. BILLED true-up charges of the agreement transition to SETTLED."
    roles: [OrgAdmin]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects:
      - "TrueUpCharge BILLED -> SETTLED for the invoice agreement"
      - "increments Invoice.version by 1"

  - method: POST
    path: "/api/invoices/{id}/void"
    description: "Void a DRAFT invoice; billed usage records revert to INGESTED."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "UsageRecords revert BILLED -> INGESTED with invoice_id=null"
      - "increments Invoice.version by 1"

  - method: POST
    path: "/api/true-up-charges/assess"
    description: "Assess the SHORTFALL true-up for an EXPIRED agreement (two-pass marketplace weighting). When shortfall > 0 returns 201 with the created TrueUpCharge; when shortfall == 0 (including consumed exactly == committed) no charge is created and the response is 200 with data null."
    roles: [OrgAdmin]
    code: 201
    input: [agreement_id]
    output: TrueUpCharge
    side_effects: ["recomputes agreement.accrued_trueup_cents"]

  - method: GET
    path: "/api/true-up-charges/{id}"
    description: "Fetch one true-up charge."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: []
    output: TrueUpCharge
    side_effects: []

  - method: GET
    path: "/api/true-up-charges"
    description: "List true-up charges, optionally filtered by agreement or plan."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["agreement_id?", "plan_id?", "limit?", "offset?"]
    output: TrueUpCharge[]
    side_effects: []

  - method: POST
    path: "/api/true-up-charges/{id}/bill"
    description: "Bill an ASSESSED true-up charge (ASSESSED -> BILLED)."
    roles: [OrgAdmin]
    code: 200
    input: []
    output: TrueUpCharge
    side_effects: ["recomputes agreement.accrued_trueup_cents", "increments TrueUpCharge.version by 1"]

  - method: POST
    path: "/api/true-up-charges/{id}/waive"
    description: "Waive an ASSESSED true-up charge (FinanceAnalyst only — segregation of duties vs assess/bill)."
    roles: [FinanceAnalyst]
    code: 200
    input: [reason]
    output: TrueUpCharge
    side_effects: ["recomputes agreement.accrued_trueup_cents", "increments TrueUpCharge.version by 1"]

  - method: POST
    path: "/api/renewal-forecasts"
    description: "Generate a renewal forecast (LINEAR or COHORT_WEIGHTED) from the org's closed-period usage."
    roles: [FinanceAnalyst]
    code: 201
    input: [agreement_id, variant, "window_periods?"]
    output: RenewalForecast
    side_effects: []

  - method: GET
    path: "/api/renewal-forecasts/{id}"
    description: "Fetch one renewal forecast."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: []
    output: RenewalForecast
    side_effects: []

  - method: GET
    path: "/api/renewal-forecasts"
    description: "List renewal forecasts, optionally filtered by agreement."
    roles: [OrgAdmin, FinanceAnalyst, PlatformBillingOperator]
    code: 200
    input: ["agreement_id?", "limit?", "offset?"]
    output: RenewalForecast[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint; or LinkedAccountManager acting on an account other than X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, non-positive amount, malformed timestamp, usage_hour_start with non-zero minute/second, units inconsistent with plan type" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not allowed from the entity's current state (incl. terminal-state lockdown and non-idempotent repeat actions)" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Usage ingest against a SUSPENDED linked account" }
  - { id: ERR_AGREEMENT_SUSPENDED, http: 409, condition: "Plan purchase while the scoped agreement is SUSPENDED (state check precedes fiscal ceiling)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires agreement lifecycle ACTIVE (renewal review, plan purchase from NEGOTIATION/EXPIRED/TERMINATED, invoice finalize with TERMINATED agreement)" }
  - { id: ERR_ORG_HAS_ACTIVE_AGREEMENT, http: 409, condition: "Activate/resume while another agreement of the org is ACTIVE" }
  - { id: ERR_AMENDMENT_OUT_OF_TERM, http: 422, condition: "Amendment window lies outside the agreement term" }
  - { id: ERR_AMENDMENT_WINDOW_OVERLAP, http: 422, condition: "Amendment window overlaps an existing amendment of the same agreement + service_family under half-open semantics (adjacency allowed)" }
  - { id: ERR_SERVICE_FAMILY_NOT_COVERED, http: 422, condition: "Amendment references a service family with no DiscountTier on the agreement; or agreement activation with zero tiers" }
  - { id: ERR_TIER_THRESHOLD_NOT_INCREASING, http: 422, condition: "New tier threshold is not strictly greater than existing thresholds for the same (agreement, service_family)" }
  - { id: ERR_DUPLICATE_USAGE_RECORD, http: 422, condition: "A usage record already exists for (linked_account_id, service_family, usage_hour_start)" }
  - { id: ERR_CAPACITY_QUOTA_EXCEEDED, http: 422, condition: "Aggregate reserved units of overlapping ACTIVE plans in the instance family plus new units exceed org.capacity_quota_units" }
  - { id: ERR_INVOICE_PERIOD_ALREADY_BILLED, http: 422, condition: "A non-VOIDED invoice already exists for the org and period" }
  - { id: ERR_INVOICE_DRAFT_BLOCKS_TERMINATION, http: 409, condition: "Plan termination while the org has a DRAFT invoice" }
  - { id: ERR_COMMITMENT_CEILING_EXCEEDED, http: 422, condition: "Sum of ACTIVE plans' hourly_commitment_cents plus new plan exceeds org.max_hourly_commitment_cents" }
  - { id: ERR_SETTLEMENT_AMOUNT_MISMATCH, http: 422, condition: "Settle amount_cents differs from invoice.total_due_cents" }
  - { id: ERR_TERM_NOT_ENDED, http: 409, condition: "True-up assessment before the agreement has EXPIRED" }
  - { id: ERR_FORECAST_WINDOW_INSUFFICIENT, http: 409, condition: "Fewer than window_periods closed periods with usage exist" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version does not match the agreement's current version (OCC)" }
  - { id: ERR_CREDIT_NOT_USABLE, http: 409, condition: "Revoke or consume against a terminal (EXHAUSTED/EXPIRED/REVOKED) credit grant" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformBillingOperator
    description: "Cloud platform operator: manages the logical clock, organizations, credit grants, and period closes."
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/billing-orgs"
      - "POST /api/billing-orgs/{id}/run-period-close"
      - "POST /api/credit-grants"
      - "POST /api/credit-grants/{id}/revoke"
    shared_operations:
      - "read endpoints (GET) across all resources"
      - "POST /api/usage-records"

  - name: OrgAdmin
    description: "Customer-side organization administrator: manages linked accounts, agreements, tiers, plans, invoices, and true-up billing."
    identity: opaque
    exclusive_operations:
      - "POST /api/linked-accounts and suspend/reactivate"
      - "POST /api/enterprise-agreements and activate/suspend/resume/terminate"
      - "POST /api/discount-tiers"
      - "POST /api/commitment-plans and terminate"
      - "POST /api/invoices/generate, finalize, dispute, resolve-dispute, settle, void"
      - "POST /api/true-up-charges/assess and bill"
    shared_operations:
      - "read endpoints (GET) across all resources"

  - name: FinanceAnalyst
    description: "Customer-side finance analyst: owns private pricing amendments, renewal review, true-up waivers, and renewal forecasts. Segregated from OrgAdmin on true-up: assesses/bills nothing, waives only."
    identity: opaque
    exclusive_operations:
      - "POST /api/pricing-amendments"
      - "POST /api/enterprise-agreements/{id}/open-renewal-review and close-renewal-review"
      - "POST /api/true-up-charges/{id}/waive"
      - "POST /api/renewal-forecasts"
    shared_operations:
      - "read endpoints (GET) across all resources"

  - name: LinkedAccountManager
    description: "Manager of one linked account; X-User-ID equals the LinkedAccount id. Ingests usage for own account only."
    identity: "entity_backed:LinkedAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /api/usage-records (only when linked_account_id == X-User-ID, else ERR_FORBIDDEN)"
      - "GET /api/linked-accounts/{id}, GET /api/usage-records/{id}, GET /api/invoices/{id}, GET /api/invoices/{id}/lines"
