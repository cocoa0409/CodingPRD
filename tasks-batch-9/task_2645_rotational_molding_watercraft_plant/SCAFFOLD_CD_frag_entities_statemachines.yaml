        grounds:
          - state_machines.MoldingCycle.terminal_states
          - state_machines.ProductionOrder.terminal_states
          - state_machines.Mold.terminal_states
          - errors.ERR_CYCLE_INVALID_STATE
          - errors.ERR_ORDER_ALREADY_TERMINAL
          - errors.ERR_MOLD_NOT_AVAILABLE
          - validations[priority=34]
          - validations[priority=44]
        distinguishing_aspect: "Once a cycle is ABORTED, an order CANCELLED and a mould RETIRED, every trigger those machines otherwise accept is refused with 409 and the rows' version numbers stop moving — three different terminal states, three different error ids, zero further writes."
        test_recipe:
          setup:
            - "ProductModel PM-SM-TRM with TWO moulds MLD-SM-TRM-A and MLD-SM-TRM-B, so one mould can be retired while the other still serves cycles."
