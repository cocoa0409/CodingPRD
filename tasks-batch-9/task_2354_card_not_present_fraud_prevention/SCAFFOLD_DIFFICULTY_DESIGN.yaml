          A different pair on a different path and in the opposite HTTP direction:
          business_referential (59, 422) beats business_constraint (76, 409) on case
          assignment, so the lower-priority rule here is the one that returns the
          409 — proving the ladder is priority-ordered rather than status-ordered.
