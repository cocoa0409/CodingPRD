              as: HerdManager
              captures: { aB_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${aA_id}", service_date: "2025-12-20", sire_code: "S-1" }
              as: Veterinarian
              captures: { be_id: $.data.id }
            - call: "POST /herds/breeding-events/${be_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${aA_id}", breeding_event_id: "${be_id}", calving_date: "2026-01-15" }
              as: HerdManager
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds/health-treatments"
              payload: { animal_id: "${aA_id}", drug_name: "Penicillin", administered_at: "2026-03-01T08:00:00Z", milk_withhold_hours: 96, meat_withdrawal_hours: 240 }
              as: Veterinarian
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: HerdManager
          trigger:
            - call: "POST /herds/cull-decisions"
              payload: { animal_id: "${aA_id}", reason: "INJURY", disposition: "SLAUGHTER", decided_at: "2026-03-05T10:00:00Z", replacement_animal_id: "${aB_id}" }
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CROSS_HERD_REFERENCE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: scc_quality_band_boundary_inclusive_200
        grounds:
          - calculations.herd_milk_quality_status
          - entities.Herd.fields.milk_quality_status
          - entities.MilkCheck.fields.weighted_scc_thousands
        distinguishing_aspect: |
          On the milk-checks finalize endpoint, weighted_scc_thousands exactly 200.00 yields GOOD (upper
          bound inclusive, <=), the GOOD/WARNING boundary; one cell more (201) would be WARNING.
        test_recipe:
          setup:
            - "One pooled record (1000,3.8,3.1,200) so weighted SCC == 200.00 exactly; price sheet for 2026-06; PROVISIONAL MilkCheck."
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Boundary SCC Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "BS-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
