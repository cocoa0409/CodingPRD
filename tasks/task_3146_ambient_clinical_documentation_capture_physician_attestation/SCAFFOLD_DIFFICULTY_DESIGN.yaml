              payload: { expected_note_draft_version: "${draft_v}", field_updates: [{ field_key: "chief_complaint", field_value: "back pain" }] }
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/submit-review"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/regenerate"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/submit-review"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
          trigger:
            - call: "POST /ambient-clinical-documentation/consents/${cons}/opt-out"
              payload: { reason: "patient declined mid-visit" }
              as: Patient
