              as: OpsAdmin
              captures: { error_missing_clinician: $.data.error_id }
            - call: "POST /network/sessions"
              payload: { clinician_id: "${clinician_id}", patient_id: "00000000-0000-4000-8000-000000000005", scheduled_start: "2026-06-10T16:00:00Z", scheduled_end: "2026-06-10T17:00:00Z", cpt_code: "90837", modality: "VIDEO" }
