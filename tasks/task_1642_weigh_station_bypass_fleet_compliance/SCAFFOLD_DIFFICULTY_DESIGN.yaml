          ISS boundary). gvwr 80000 with WIM_TOLERANCE_BPS 500 gives limit 80000 + floor(80000*500/10000) =
          84000; measured 84000 clears (strict >) and grants, measured 84001 pulls in with OVERWEIGHT.
        test_recipe:
