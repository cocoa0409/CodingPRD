  # ==========================================================================
  # Rule 9 — compensating_invariant (two DIFFERENT conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: submission_count_add_withdraw_invariant
        grounds:
          - calculations.submission_count_reconcile
          - entities.Breakdown.fields.submission_count
        distinguishing_aspect: |
          Conserved quantity: Breakdown.submission_count. Forward action (create
          a live submission) increments it by 1; the compensating action
          (withdraw that submission) decrements it by 1, returning the counter
          to its exact prior value with no drift.
        test_recipe:
          setup:
            - "Released OPEN breakdown with submission_count == 1 (one prior live submission)"
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "IP", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { prod_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/roles"
              payload: { character_name: "IR", is_minor_role: false, is_union_covered: false, engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z" }
              as: CastingDirector
              captures: { role_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/breakdowns"
              payload: { role_id: "${role_id}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { br_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { br_v: $.data.version }
            - call: "POST /casting/agents"
              payload: { agency_name: "IA", contact_email: "ia@x.com", franchise_status: "FRANCHISED", active: true }
              as: CastingDirector
              captures: { agent_id: $.data.id }
            - call: "POST /casting/talents"
              payload: { full_name: "IT1", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION", agent_id: "${agent_id}" }
              as: CastingDirector
              captures: { t1: $.data.id }
            - call: "POST /casting/talents"
              payload: { full_name: "IT2", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION", agent_id: "${agent_id}" }
              as: CastingDirector
              captures: { t2: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${t1}", agent_id: "${agent_id}", expected_breakdown_version: "${br_v}" }
              as: Agent
              as_user_id: "${agent_id}"
              captures: { s1: $.data.id }
            - call: "GET /casting/breakdowns/${br_id}"
              payload: {}
              as: CastingDirector
              captures: { count_before: $.data.submission_count, br_v2: $.data.version }
            # forward action: add second submission
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${t2}", agent_id: "${agent_id}", expected_breakdown_version: "${br_v2}" }
              as: Agent
              as_user_id: "${agent_id}"
              captures: { s2: $.data.id }
            - call: "GET /casting/breakdowns/${br_id}"
              payload: {}
              as: CastingDirector
              captures: { count_after_add: $.data.submission_count }
          trigger:
            # compensating action: withdraw the second submission
            - call: "POST /casting/submissions/${s2}/withdraw"
              payload: {}
              as: Agent
              as_user_id: "${agent_id}"
            - call: "GET /casting/breakdowns/${br_id}"
              payload: {}
              as: CastingDirector
              captures: { count_after_withdraw: $.data.submission_count }
          assert:
            - "count_before == 1"
            - "count_after_add == 2 (forward action +1)"
            - "count_after_withdraw == 1 (compensating withdraw returns counter to count_before; invariant: submission_count conserved)"

      - name: session_booked_count_confirm_cancel_invariant
        grounds:
          - state_machines.CallbackAppointment.PROPOSED_to_CONFIRMED
          - state_machines.CallbackAppointment.CONFIRMED_to_CANCELLED
          - entities.AuditionSession.fields.booked_count
        distinguishing_aspect: |
          Different conserved quantity: AuditionSession.booked_count. Confirming
          an appointment increments it by 1; cancelling that same CONFIRMED
          appointment decrements it by 1, returning booked_count to its exact
          prior value. Distinct quantity from submission_count (a session-level
          gauge, not a submission tally).
