            - "Second call (limit 5, offset 10): data is an array of length 1 with has_more == false"
      - name: fk_reverse_lookup_lots_by_product
        claim_type: cross_reference_link
        grounds: [entities.ManufacturingLot.fields.product_id, "endpoints.\"GET /supply/manufacturing-lots\""]
        distinguishing_aspect: "The filtered list is the reverse-reachability channel: lots of product A are found via product_id filter without touching product B's lots."
        test_recipe:
