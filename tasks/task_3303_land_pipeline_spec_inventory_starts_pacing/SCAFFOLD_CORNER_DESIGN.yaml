            - { call: "POST /communities/${com}/incentives", payload: {type: "PRICE_CUT", value_cents: 2000000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z"}, as: COMMUNITY_MANAGER }
