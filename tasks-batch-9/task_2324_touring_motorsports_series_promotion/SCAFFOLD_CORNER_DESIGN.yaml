              as: TicketingManager
              captures: { v_after_refund: "$.data.version" }
            - call: "POST /ticket-orders"
              payload: { tour_stop_id: "${stop_atl}", ticket_tier_id: "${tier_ga}", purchaser_name: "Pre Refund Reader", purchaser_email: "prerefund@example.com", qty: 4, expected_ticket_tier_version: "${v_after_pay}" }
              as: TicketingManager
              captures: { e_stale_after_refund: "$.data.error_id" }
          assert:
            - "trigger call 1 returns HTTP 201 and bumps the tier: ${v_after_order} == ${v_read} + 1, reserved_seat_count == 4, available_seat_count == 496"
            - "trigger call 2 returns HTTP 412 with ${e_stale} == ERR_STALE_TIER_VERSION; reserved_seat_count is still 4 and version is still ${v_after_order}, so the refusal neither consumed a seat nor moved the version"
            - "trigger call 4 returns HTTP 201 once the client re-reads: version becomes ${v_after_order} + 1, reserved_seat_count 8"
            - "trigger call 6 shows pay bumped the version again (${v_after_pay} == ${v_after_order} + 2) while moving 4 seats from reserved to sold: reserved 4, sold 4, available 492"
            - "trigger call 7 returns HTTP 412 with ${e_stale_after_pay} == ERR_STALE_TIER_VERSION: a payment on someone else's order invalidated this writer's read even though no order was created in between"
            - "trigger call 9 shows refund bumped the version a third time (${v_after_refund} == ${v_after_pay} + 1) and restored availability: sold 0, available 496"
            - "trigger call 10 returns HTTP 412 with ${e_stale_after_refund} == ERR_STALE_TIER_VERSION, confirming all three of order, pay and refund are version-bumping writes on the tier"

      - name: corner_occ_marketing_allocation_refuses_a_stale_season_version_including_after_a_release
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.marketing-allocation-stale-season
          - errors.ERR_STALE_SEASON_VERSION
          - endpoints[POST /tour-stops/{id}/marketing-allocations]
          - endpoints[DELETE /marketing-allocations/{id}]
        distinguishing_aspect: "The guarded aggregate is the Season, not the stop, so two allocations on two DIFFERENT stops still contend: the second one is stale even though it touches an unrelated market. A release is also a version-bumping write on the season, so a version read before a DELETE is stale afterwards even though the pool grew rather than shrank — the check is on the version, not on whether money is available."
