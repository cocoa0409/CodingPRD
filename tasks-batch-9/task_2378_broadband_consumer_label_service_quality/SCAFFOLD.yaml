# =============================================================================
# PRD-Bench Scaffold — Task 2378
# Broadband Consumer Label & Service Quality Complaints
# Difficulty band: Expert+ (deliberately above the §0.4 Expert surface, per the
# "harder than expert level" generation instruction: 14 entities, 52 endpoints,
# 10 state machines, 9 calculations with 3 dual-variant families).
# =============================================================================

scenario: "2378. Broadband Consumer Label & Service Quality Complaints (internet service provider consumer compliance): label generation per service plan with typical speeds, latency, fees, data allowances and discount program participation, label display at the point of sale and in the account portal with archival of historical versions, introductory versus post-promotional pricing disclosure with itemized monthly fees, performance measurement supporting typical speed claims with test methodology documentation, consumer complaint intake alleging speed or reliability shortfalls with investigation procedures, regulator complaint response with technical evidence and resolution reporting, plan change, price increase notification and early termination fee disclosure, accessibility of label content and translation requirements"

domain_name: broadband-consumer-label-compliance
api_prefix: ""           # flat peer resources, e.g.: /service-plans, /label-versions, /complaints

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - version_pinning_on_approval
    - derived_field_reconciliation
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection; parentage is
  # expressed only through FK fields (plus four read-only sub-resource GETs used
  # for FK reverse-reachability). No business identifier is nested in a URL path
  # beyond one level of ownership.

  state_machine_shape: parallel
  # LabelVersion carries two independent state dimensions on the same row
  # (publication_state x substantiation_status). Complaint is cyclic
  # (UNDER_INVESTIGATION <-> INFO_REQUESTED, plus DISMISSED -> UNDER_INVESTIGATION
  # reopen). RegulatorInquiry is fork-join (two independent filings converge on
  # RESPONSE_COMPLETE). ServicePlan.label_posture is a compound derived gate.

  relationship_patterns:
    - one_to_many          # ServicePlan -> FeeLineItem / LabelVersion / TestRun / SubscriberAccount
    - cross_aggregate      # LabelVersion.attestation_id pins a PerformanceAttestation across aggregates
    - polymorphic          # RegulatorInquiry.complaint_id reaches plan-level evidence through Complaint

  role_model: segregation_of_duties
  # Maker-checker is enforced on two operations by X-User-ID inequality:
  # a LabelVersion may not be published by the officer who drafted it, and a
  # LabelTranslation may not be verified by the specialist who authored it.
  # Beyond that, roles are peer-scoped: NetworkEngineer owns measurement,
  # ComplianceOfficer owns label/plan governance, LocalizationSpecialist owns
  # translations, ComplaintAnalyst owns investigations, RegulatoryLiaison owns
  # regulator dockets, RetailAgent owns enrollment/disclosure/notices, Subscriber
  # acts only on its own SubscriberAccount.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - name: plan_code
        type: string
        source: input
        description: Marketing plan code shown on the consumer label.
        constraints: "1-32 chars; globally unique (case-sensitive); ERR_DUPLICATE_PLAN_CODE on collision"
      - name: display_name
        type: string
        source: input
        description: Human-readable plan name printed on the label header.
        constraints: "1-120 chars"
      - name: technology
        type: enum
        source: input
        description: Access technology disclosed on the label.
        constraints: "FIBER | CABLE | DSL | FIXED_WIRELESS | SATELLITE"
      - name: advertised_download_mbps
        type: number
        source: input
        description: Advertised (marketed) download speed the typical-speed claim must substantiate.
        constraints: "> 0; at most 2 decimals"
      - name: advertised_upload_mbps
        type: number
        source: input
        description: Advertised upload speed the typical-speed claim must substantiate.
        constraints: "> 0; at most 2 decimals"
      - name: monthly_price_cents
        type: integer
        source: input
        description: Post-promotional monthly base charge in cents (the price after any introductory term ends).
        constraints: ">= 0"
      - name: intro_price_cents
        type: integer
        source: input
        description: Introductory monthly base charge in cents; null when the plan has no promotional price.
        default: null
        constraints: ">= 0 when present"
      - name: intro_term_months
        type: integer
        source: input
        description: Number of whole months the introductory base charge applies.
        default: 0
        constraints: "0-24; MUST be >= 1 when intro_price_cents is non-null, else ERR_INVALID_REQUEST"
      - name: data_allowance_gb
        type: integer
        source: input
        description: Monthly data allowance in GB; null means unlimited (disclosed as 'Unlimited').
        default: null
        constraints: ">= 1 when present"
      - name: overage_rate_cents_per_gb
        type: integer
        source: input
        description: Cents charged per GB above data_allowance_gb.
        default: 0
        constraints: ">= 0; MUST be 0 when data_allowance_gb is null"
      - name: early_termination_fee_cents
        type: integer
        source: input
        description: Full early termination fee in cents disclosed on the label.
        default: 0
        constraints: ">= 0"
      - name: etf_proration_policy
        type: enum
        source: input
        description: How the early termination fee is reduced over the introductory term.
        default: FULL
        constraints: "FULL | PRORATED_MONTHLY | NONE"
      - name: discount_program_eligible
        type: boolean
        source: input
        description: Whether this plan participates in the federal low-income discount program.
        default: false
      - name: required_locales
        type: array
        source: input
        description: BCP-47 locale tags whose label translations MUST be VERIFIED before a LabelVersion of this plan can be published.
        constraints: "array of 1-5 unique BCP-47 strings; ERR_INVALID_REQUEST when empty"
      - name: label_posture
        type: enum
        source: computed
        description: "Derived compliance gate over this plan's published label, price drift and upheld-complaint count; recomputed by calculations.plan_label_posture after every mutation that feeds it. A freshly created plan has no PUBLISHED label and is therefore RESTRICTED."
        default: RESTRICTED
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: evidence_sample_total
        type: integer
        source: computed
        description: "Conserved evidence quantity: sum of TestRun.sample_count over TestRun rows with plan_id == this plan and status == INCLUDED."
        default: 0
      - name: upheld_complaint_count
        type: integer
        source: computed
        description: Count of Complaint rows whose account's plan_id == this plan and whose state == UPHELD.
        default: 0
      - name: price_disclosure_drift
        type: boolean
        source: computed
        description: True when a disclosed price field changed after the current PUBLISHED LabelVersion was published; cleared when a newer LabelVersion is published.
        default: false
      - name: active_label_version_id
        type: string
        source: computed
        description: "Id of the LabelVersion row where plan_id == this plan and publication_state == PUBLISHED (at most one such row by invariant); null when none. Never client-supplied."
        default: null
      - name: last_price_change_at
        type: datetime
        source: computed
        description: Timestamp (logical clock) of the most recent PATCH that changed a disclosed price field; null when never changed.
        default: null

  - name: FeeLineItem
    parent: ServicePlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; immutable after creation."
      - name: fee_code
        type: string
        source: input
        description: Stable fee identifier printed in the label's itemized fee block.
        constraints: "1-32 chars; unique per (plan_id, fee_code); ERR_INVALID_REQUEST on collision"
      - name: description
        type: string
        source: input
        description: Consumer-facing fee description.
        constraints: "1-200 chars"
      - name: label_category
        type: enum
        source: input
        description: Which label block the fee is itemized under.
        constraints: "MONTHLY_RECURRING | ONE_TIME | EARLY_TERMINATION | DATA_OVERAGE | GOVERNMENT_TAX"
      - name: basis
        type: enum
        source: input
        description: Whether the fee is a fixed cent amount or a percentage of the monthly charge.
        constraints: "FIXED | PCT_OF_MONTHLY_CHARGE"
      - name: amount_cents
        type: integer
        source: input
        description: Fixed fee amount in cents; required when basis == FIXED, MUST be null otherwise.
        default: null
        constraints: ">= 0"
      - name: rate_pct
        type: number
        source: input
        description: Fractional rate applied to the phase charge base; required when basis == PCT_OF_MONTHLY_CHARGE, MUST be null otherwise.
        default: null
        constraints: "> 0 and < 1; at most 4 decimals"
      - name: applies_during
        type: enum
        source: input
        description: Which pricing phase the fee is itemized in.
        default: ALWAYS
        constraints: "ALWAYS | INTRO_ONLY | POST_PROMO_ONLY"
      - name: is_regulatory_recovery
        type: boolean
        source: input
        description: True for provider-imposed regulatory cost-recovery fees, which the label must label as provider fees rather than government taxes.
        default: false

  - name: MethodologyDocument
    parent: null
    common_fields: true
    fields:
      - name: doc_code
        type: string
        source: input
        description: Test methodology document code cited on the label.
        constraints: "1-32 chars; globally unique; ERR_INVALID_REQUEST on collision"
      - name: version_label
        type: string
        source: input
        description: Methodology revision label pinned into every attestation that cites it.
        constraints: "1-16 chars"
      - name: methodology_url
        type: string
        source: input
        description: Public URL of the published methodology, copied onto the label at publish time.
        constraints: "1-300 chars"
      - name: peak_hours_start_utc_hour
        type: integer
        source: input
        description: Inclusive first UTC hour of the peak measurement window used by the PEAK_HOUR_MEDIAN variant.
        constraints: "0-23"
      - name: peak_hours_end_utc_hour
        type: integer
        source: input
        description: Exclusive last UTC hour of the peak measurement window; MUST be > peak_hours_start_utc_hour.
        constraints: "1-24"
      - name: min_samples_required
        type: integer
        source: input
        description: Minimum pooled sample count an attestation must reach before it can be certified.
        constraints: ">= 1"
      - name: max_run_duration_days
        type: integer
        source: input
        description: Maximum allowed duration of a single TestRun measurement window, in days.
        constraints: "1-30"
      - name: status
        type: enum
        source: computed
        description: Publication state of the methodology; only PUBLISHED documents may back test runs and attestations.
        default: DRAFT
        constraints: "DRAFT | PUBLISHED"
      - name: published_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of publication; null while DRAFT.
        default: null

  - name: MeasurementProbe
    parent: null
    common_fields: true
    fields:
      - name: probe_code
        type: string
        source: input
        description: Measurement probe / panel identifier.
        constraints: "1-32 chars; globally unique; ERR_INVALID_REQUEST on collision"
      - name: market_code
        type: string
        source: input
        description: Market the probe panel measures.
        constraints: "1-16 chars"
      - name: panel_size
        type: integer
        source: input
        description: Number of subscriber endpoints in the probe's panel, disclosed in the methodology annex.
        constraints: ">= 1"
      - name: max_concurrent_windows
        type: integer
        source: input
        description: Aggregate capacity — the maximum number of INCLUDED TestRun windows on this probe whose closed intervals may cover any single instant.
        constraints: ">= 1"

  - name: TestRun
    parent: null
    common_fields: true
    fields:
      - name: probe_id
        type: string
        source: input
        description: "FK -> MeasurementProbe.id; the probe that produced the samples."
      - name: plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan whose typical-speed claim this run supports."
      - name: methodology_doc_id
        type: string
        source: input
        description: "FK -> MethodologyDocument.id; MUST reference a document whose status == PUBLISHED."
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the closed measurement window.
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the closed measurement window; MUST be > window_start and <= the logical clock.
      - name: samples
        type: array
        source: input
        description: "Measurement samples; each element is { observed_at: ISO8601, download_mbps: number, upload_mbps: number, latency_ms: integer }."
        constraints: "1-500 elements; every observed_at MUST be within [window_start, window_end]; download_mbps/upload_mbps > 0; latency_ms >= 1"
      - name: sample_count
        type: integer
        source: computed
        description: Number of elements in samples, fixed at creation.
      - name: status
        type: enum
        source: computed
        description: Whether the run currently counts toward the plan's evidence pool.
        default: INCLUDED
        constraints: "INCLUDED | INVALIDATED"
      - name: invalidated_at
        type: datetime
        source: computed
        description: Logical-clock timestamp at which the run was invalidated; null while INCLUDED.
        default: null
      - name: invalidation_reason
        type: string
        source: computed
        description: Reason recorded by the engineer who invalidated the run; null while INCLUDED.
        default: null

  - name: PerformanceAttestation
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan whose typical speeds this attestation computes."
      - name: methodology_doc_id
        type: string
        source: input
        description: "FK -> MethodologyDocument.id; pinned at creation, MUST be PUBLISHED at that moment."
      - name: metric_variant
        type: enum
        source: input
        description: Which of the two documented typical-speed algorithms this attestation applies.
        constraints: "PEAK_HOUR_MEDIAN | ALL_HOUR_P20"
      - name: included_run_ids
        type: array
        source: computed
        description: "Ids of the TestRun rows pooled at creation, ordered by TestRun.created_at ASC; snapshot, never re-derived."
      - name: pooled_sample_count
        type: integer
        source: computed
        description: Number of samples in the variant's pool at creation (peak-hour subset for PEAK_HOUR_MEDIAN, all samples for ALL_HOUR_P20).
      - name: typical_download_mbps
        type: number
        source: computed
        description: Typical download speed produced by calculations.typical_speed_metrics for the selected variant.
        constraints: "2 decimals, round_half_up"
      - name: typical_upload_mbps
        type: number
        source: computed
        description: Typical upload speed produced by calculations.typical_speed_metrics for the selected variant.
        constraints: "2 decimals, round_half_up"
      - name: typical_latency_ms
        type: integer
        source: computed
        description: 95th-percentile latency over the variant's pool, nearest-rank, rounded half-up to a whole millisecond.
      - name: download_margin_pct
        type: number
        source: computed
        description: typical_download_mbps / ServicePlan.advertised_download_mbps, 4 decimals round_half_up.
      - name: upload_margin_pct
        type: number
        source: computed
        description: typical_upload_mbps / ServicePlan.advertised_upload_mbps, 4 decimals round_half_up.
      - name: status
        type: enum
        source: computed
        description: Attestation lifecycle; only CERTIFIED attestations may back a published label.
        default: DRAFT
        constraints: "DRAFT | CERTIFIED | SUPERSEDED | REVOKED"
      - name: certified_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of certification; null until CERTIFIED.
        default: null
      - name: revoked_reason
        type: string
        source: computed
        description: Reason recorded when a cascade revoked this attestation; null otherwise.
        default: null
      - name: methodology_snapshot
        type: object
        source: computed
        description: "Version-pinned copy of the methodology at creation: { version_label, peak_hours_start_utc_hour, peak_hours_end_utc_hour, min_samples_required, max_run_duration_days, methodology_url }."

  - name: LabelVersion
    parent: ServicePlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; immutable after creation."
      - name: version_seq
        type: integer
        source: computed
        description: "Per-plan monotonic sequence: max(version_seq over LabelVersion rows with the same plan_id) + 1, starting at 1."
      - name: publication_state
        type: enum
        source: computed
        description: First independent state dimension — where the label sits in the publish/archive lifecycle.
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | ARCHIVED | WITHDRAWN"
      - name: substantiation_status
        type: enum
        source: computed
        description: Second independent state dimension — whether the typical-speed claim on this label is currently backed by a CERTIFIED attestation. Evolves without changing publication_state.
        default: PENDING_EVIDENCE
        constraints: "PENDING_EVIDENCE | SUBSTANTIATED | UNSUBSTANTIATED"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the half-open display window [effective_from, effective_until).
      - name: effective_until
        type: datetime
        source: input
        description: Exclusive end of the half-open display window; null means open-ended (+infinity).
        default: null
      - name: accessibility_conformance
        type: enum
        source: input
        description: Accessibility conformance level of the rendered label content.
        constraints: "NONE | WCAG_AA"
      - name: discount_program_applied
        type: boolean
        source: input
        description: Whether the label discloses the low-income discount program benefit; defaults to the plan's discount_program_eligible value at creation.
        default: null
      - name: attestation_id
        type: string
        source: computed
        description: "FK -> PerformanceAttestation.id; pinned by the publish transition to the selected CERTIFIED attestation; null while DRAFT."
        default: null
      - name: typical_download_mbps
        type: number
        source: computed
        description: Version-pinned copy of the attestation's typical_download_mbps, written at publish; null while DRAFT.
        default: null
      - name: typical_upload_mbps
        type: number
        source: computed
        description: Version-pinned copy of the attestation's typical_upload_mbps, written at publish; null while DRAFT.
        default: null
      - name: typical_latency_ms
        type: integer
        source: computed
        description: Version-pinned copy of the attestation's typical_latency_ms, written at publish; null while DRAFT.
        default: null
      - name: methodology_url_snapshot
        type: string
        source: computed
        description: Copy of methodology_snapshot.methodology_url from the pinned attestation, written at publish; null while DRAFT.
        default: null
      - name: fee_itemization
        type: array
        source: computed
        description: "Itemized fee block produced by calculations.label_monthly_itemization; each element is { fee_code, label_category, phase, amount_cents } with phase in {INTRO, POST_PROMO, ONE_TIME}."
      - name: monthly_total_intro_cents
        type: integer
        source: computed
        description: Gross introductory monthly total (base + fixed lines + rounded percentage lines) before any discount benefit; null when the plan has no intro_price_cents.
        default: null
      - name: monthly_total_post_promo_cents
        type: integer
        source: computed
        description: Gross post-promotional monthly total before any discount benefit.
      - name: discount_program_benefit_intro_cents
        type: integer
        source: computed
        description: Discount benefit applied to the introductory phase; 0 when discount_program_applied is false.
        default: 0
      - name: discount_program_benefit_post_promo_cents
        type: integer
        source: computed
        description: Discount benefit applied to the post-promotional phase; 0 when discount_program_applied is false.
        default: 0
      - name: net_monthly_intro_cents
        type: integer
        source: computed
        description: monthly_total_intro_cents minus discount_program_benefit_intro_cents; null when the plan has no intro_price_cents.
        default: null
      - name: net_monthly_post_promo_cents
        type: integer
        source: computed
        description: monthly_total_post_promo_cents minus discount_program_benefit_post_promo_cents.
      - name: one_time_fee_total_cents
        type: integer
        source: computed
        description: Sum of amount_cents over the plan's FeeLineItem rows with label_category == ONE_TIME.
        default: 0
      - name: first_year_total_promo_weighted_cents
        type: integer
        source: computed
        description: First-year cost under the PROMO_WEIGHTED variant of calculations.first_year_total_disclosure.
      - name: first_year_total_post_promo_cents
        type: integer
        source: computed
        description: First-year cost under the POST_PROMO_ANNUALIZED variant of calculations.first_year_total_disclosure.
      - name: etf_disclosure_cents
        type: integer
        source: computed
        description: Copy of ServicePlan.early_termination_fee_cents at compute time, disclosed in the label's early-termination block.
      - name: data_allowance_gb_snapshot
        type: integer
        source: computed
        description: Copy of ServicePlan.data_allowance_gb at compute time; null means the label discloses 'Unlimited'.
        default: null
      - name: overage_rate_cents_per_gb_snapshot
        type: integer
        source: computed
        description: Copy of ServicePlan.overage_rate_cents_per_gb at compute time.
        default: 0
      - name: price_disclosure_drift
        type: boolean
        source: computed
        description: True when a disclosed plan price field changed after this label was published, making the displayed itemization stale.
        default: false
      - name: verified_locale_count
        type: integer
        source: computed
        description: Count of LabelTranslation rows with label_version_id == this label and status == VERIFIED.
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who drafted this label; used by the maker-checker publish control.
      - name: published_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer who published this label; null until published.
        default: null
      - name: published_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of publication; null until published.
        default: null
      - name: archived_at
        type: datetime
        source: computed
        description: Logical-clock timestamp at which a successor label archived this one; null otherwise.
        default: null
      - name: withdrawn_at
        type: datetime
        source: computed
        description: Logical-clock timestamp at which this label was withdrawn; null otherwise.
        default: null

  - name: LabelTranslation
    parent: LabelVersion
    common_fields: true
    fields:
      - name: label_version_id
        type: string
        source: input
        description: "FK -> LabelVersion.id; the label whose content is translated."
      - name: locale
        type: string
        source: input
        description: BCP-47 locale tag of this translation.
        constraints: "2-16 chars; unique per (label_version_id, locale); ERR_INVALID_REQUEST on collision"
      - name: translated_summary
        type: string
        source: input
        description: Translated rendering of the label's disclosure text.
        constraints: "1-2000 chars"
      - name: machine_translated
        type: boolean
        source: input
        description: True when the translation was machine-produced; recorded for audit but does not change verification rules.
        default: false
      - name: status
        type: enum
        source: computed
        description: Verification state; only VERIFIED translations satisfy publish coverage and disclosure locale requests.
        default: DRAFT
        constraints: "DRAFT | VERIFIED"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the LocalizationSpecialist who authored this translation; used by the self-review control.
      - name: verified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the specialist who verified this translation; null while DRAFT.
        default: null
      - name: verified_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of verification; null while DRAFT.
        default: null

  - name: SubscriberAccount
    parent: null
    common_fields: true
    fields:
      - name: account_code
        type: string
        source: input
        description: Billing account identifier.
        constraints: "1-32 chars; globally unique; ERR_INVALID_REQUEST on collision"
      - name: plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan the account is currently subscribed to."
      - name: preferred_locale
        type: string
        source: input
        description: Locale the account prefers for label content.
        constraints: "2-16 chars"
      - name: accessibility_need
        type: enum
        source: input
        description: Accessibility accommodation recorded for this account.
        default: NONE
        constraints: "NONE | SCREEN_READER | LARGE_PRINT"
      - name: discount_program_enrolled
        type: boolean
        source: input
        description: Whether the subscriber is enrolled in the low-income discount program.
        default: false
      - name: service_start_date
        type: datetime
        source: input
        description: Date service began; drives pricing_phase and early-termination proration.
      - name: subscription_state
        type: enum
        source: computed
        description: Whether a plan-change notice is pending on the account.
        default: ACTIVE
        constraints: "ACTIVE | PENDING_CHANGE"
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Conserved monetary quantity: sum of RemediationCredit.amount_cents over rows with this account_id and status == ISSUED."
        default: 0
      - name: remediation_count
        type: integer
        source: computed
        description: Count of RemediationCredit rows with this account_id and status == ISSUED.
        default: 0
      - name: audit_flag
        type: boolean
        source: computed
        description: True while remediation_count >= REMEDIATION_AUDIT_THRESHOLD; cleared when the count falls back below it.
        default: false
      - name: pricing_phase
        type: enum
        source: computed
        description: "INTRO while floor((clock - service_start_date)/30 days) < ServicePlan.intro_term_months and the plan has intro_price_cents; POST_PROMO otherwise."
        default: POST_PROMO
        constraints: "INTRO | POST_PROMO"
      - name: last_disclosed_label_version_id
        type: string
        source: computed
        description: "Id of the LabelVersion referenced by this account's most recent LabelDisclosure ordered by created_at DESC; null when the account has no disclosure. Never client-supplied."
        default: null

  - name: LabelDisclosure
    parent: SubscriberAccount
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> SubscriberAccount.id; the account the label was displayed to."
      - name: label_version_id
        type: string
        source: computed
        description: "FK -> LabelVersion.id; server-selected published label in effect at disclosure time (see calculations.effective_label_selection)."
      - name: channel
        type: enum
        source: input
        description: Where the label was displayed.
        constraints: "POINT_OF_SALE | ACCOUNT_PORTAL"
      - name: locale
        type: string
        source: input
        description: Locale in which the label content was rendered; MUST have a VERIFIED LabelTranslation on the selected label.
        constraints: "2-16 chars"
      - name: accessible_format
        type: enum
        source: input
        description: Rendering format served to the consumer.
        constraints: "STANDARD_WEB | SCREEN_READER | LARGE_PRINT"
      - name: disclosed_label_version_seq
        type: integer
        source: computed
        description: Copy of the selected LabelVersion.version_seq, retained so archived disclosures remain readable after the label is archived.
      - name: disclosed_net_monthly_cents
        type: integer
        source: computed
        description: Phase-appropriate net monthly charge shown to the consumer — net_monthly_intro_cents when the account's pricing_phase is INTRO, otherwise net_monthly_post_promo_cents.
      - name: disclosed_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who recorded the disclosure.

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> SubscriberAccount.id; the complaining subscriber's account."
      - name: disputed_label_version_id
        type: string
        source: input
        description: "FK -> LabelVersion.id; the label whose claims the complaint disputes."
      - name: allegation_type
        type: enum
        source: input
        description: Nature of the alleged shortfall.
        constraints: "SPEED_SHORTFALL | LATENCY_SHORTFALL | RELIABILITY_OUTAGE | FEE_MISMATCH"
      - name: service_observed_date
        type: datetime
        source: input
        description: Date the subscriber observed the alleged shortfall; the disputed label's display window MUST cover it.
      - name: affected_days
        type: integer
        source: input
        description: Number of days of degraded service claimed, used by the PRORATA_DAYS credit basis.
        constraints: "1-60"
      - name: measured_download_mbps
        type: number
        source: input
        description: Subscriber-reported download measurement; required when allegation_type == SPEED_SHORTFALL.
        default: null
        constraints: ">= 0 when present"
      - name: measured_upload_mbps
        type: number
        source: input
        description: Subscriber-reported upload measurement.
        default: null
        constraints: ">= 0 when present"
      - name: measured_latency_ms
        type: integer
        source: input
        description: Subscriber-reported latency; required when allegation_type == LATENCY_SHORTFALL.
        default: null
        constraints: ">= 1 when present"
      - name: narrative
        type: string
        source: input
        description: Consumer's description of the problem.
        constraints: "1-2000 chars"
      - name: state
        type: enum
        source: computed
        description: Investigation lifecycle state.
        default: INTAKE
        constraints: "INTAKE | TRIAGED | UNDER_INVESTIGATION | INFO_REQUESTED | UPHELD | DISMISSED | WITHDRAWN"
      - name: triaged_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of triage; null before triage.
        default: null
      - name: sla_due_at
        type: datetime
        source: computed
        description: triaged_at + COMPLAINT_SLA_DAYS days, written at triage; null before triage.
        default: null
      - name: resolved_at
        type: datetime
        source: computed
        description: Logical-clock timestamp at which the complaint reached UPHELD or DISMISSED; null otherwise; reset to null on reopen.
        default: null
      - name: reopened_count
        type: integer
        source: computed
        description: Number of times the complaint has been reopened from DISMISSED.
        default: 0
      - name: investigation_cycles
        type: integer
        source: computed
        description: Number of INFO_REQUESTED -> UNDER_INVESTIGATION returns recorded on this complaint.
        default: 0
      - name: shortfall_ratio
        type: number
        source: computed
        description: Assessed shortfall produced by calculations.complaint_shortfall_assessment; null before investigation.
        default: null
        constraints: "4 decimals, round_half_up, 0 <= ratio <= 1"
      - name: severity
        type: enum
        source: computed
        description: Severity tier derived from shortfall_ratio.
        default: NONE
        constraints: "NONE | MINOR | MODERATE | SEVERE"
      - name: evidence_gap
        type: boolean
        source: computed
        description: True when the disputed label lost substantiation while this complaint was open; cleared when a substantiated label is published for the plan.
        default: false
      - name: credit_basis
        type: enum
        source: input
        description: Credit algorithm chosen by the analyst at resolution; required when finding == UPHELD, MUST be null otherwise.
        default: null
        constraints: "PRORATA_DAYS | FLAT_SEVERITY_TIER"
      - name: remediation_credit_cents
        type: integer
        source: computed
        description: Credit amount computed at resolution by calculations.remediation_credit_amount; 0 unless the complaint is UPHELD with an ISSUED credit.
        default: 0
      - name: resolution
        type: enum
        source: computed
        description: Terminal disposition of the complaint.
        default: NONE
        constraints: "NONE | UPHELD | DISMISSED | WITHDRAWN"
      - name: resolution_note
        type: string
        source: computed
        description: Analyst's resolution rationale; null before resolution.
        default: null
      - name: info_request_note
        type: string
        source: computed
        description: Most recent information request sent to the subscriber; null when none.
        default: null

  - name: RemediationCredit
    parent: Complaint
    common_fields: true
    fields:
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; the upheld complaint this credit compensates."
      - name: account_id
        type: string
        source: computed
        description: "Denormalized copy of Complaint.account_id for the complaint named by complaint_id; never client-supplied."
      - name: basis
        type: enum
        source: computed
        description: Copy of Complaint.credit_basis at issuance.
        constraints: "PRORATA_DAYS | FLAT_SEVERITY_TIER"
      - name: amount_cents
        type: integer
        source: computed
        description: Credit amount produced by calculations.remediation_credit_amount at issuance; immutable thereafter.
      - name: status
        type: enum
        source: computed
        description: Whether the credit still counts toward the account's credit_balance_cents.
        default: ISSUED
        constraints: "ISSUED | VOIDED"
      - name: issued_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplaintAnalyst whose resolve call issued the credit.
      - name: voided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer who voided the credit; null while ISSUED.
        default: null
      - name: voided_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of voiding; null while ISSUED.
        default: null
      - name: void_reason
        type: string
        source: computed
        description: Reason recorded at voiding; null while ISSUED.
        default: null

  - name: RegulatorInquiry
    parent: null
    common_fields: true
    fields:
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; the consumer complaint the regulator is asking about."
      - name: docket_number
        type: string
        source: input
        description: Regulator docket number.
        constraints: "1-32 chars; globally unique; ERR_DUPLICATE_DOCKET_NUMBER on collision"
      - name: regulator_code
        type: string
        source: input
        description: Code of the regulator that opened the docket.
        constraints: "1-16 chars"
      - name: response_due_at
        type: datetime
        source: input
        description: Deadline by which both filings must be on record; MUST be strictly after the logical clock at creation.
      - name: state
        type: enum
        source: computed
        description: Docket response state; RESPONSE_COMPLETE is the fork-join point requiring both filings.
        default: RECEIVED
        constraints: "RECEIVED | EVIDENCE_ASSEMBLY | RESPONSE_COMPLETE | CLOSED"
      - name: technical_packet_filed_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of the TECHNICAL_PACKET filing; null until filed.
        default: null
      - name: resolution_report_filed_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of the RESOLUTION_REPORT filing; null until filed.
        default: null
      - name: technical_evidence_ref
        type: string
        source: computed
        description: Evidence reference recorded with the technical packet; null until filed.
        default: null
      - name: resolution_report_ref
        type: string
        source: computed
        description: Evidence reference recorded with the resolution report; null until filed.
        default: null
      - name: filed_late
        type: boolean
        source: computed
        description: True when the later of the two filing timestamps is strictly after response_due_at.
        default: false
      - name: closure_note
        type: string
        source: computed
        description: Liaison's closure note; null until CLOSED.
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of closure; null until CLOSED.
        default: null

  - name: PlanChangeNotice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> SubscriberAccount.id; the notified subscriber."
      - name: target_plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan the account moves to when the notice is effected."
      - name: notice_type
        type: enum
        source: input
        description: Whether the notice announces a plan change or a price increase.
        constraints: "PLAN_CHANGE | PRICE_INCREASE"
      - name: effective_date
        type: datetime
        source: input
        description: Date the change takes effect; MUST be at least NOTICE_MIN_DAYS whole days after the logical clock.
      - name: reason
        type: string
        source: input
        description: Consumer-facing explanation of the change.
        constraints: "1-500 chars"
      - name: notice_days
        type: integer
        source: computed
        description: floor((effective_date - clock at creation) / 86400 seconds), computed at creation.
      - name: etf_disclosed_cents
        type: integer
        source: computed
        description: Early termination fee disclosed on the notice, produced by calculations.etf_disclosure_amount.
      - name: disclosed_net_monthly_cents
        type: integer
        source: computed
        description: Target plan's net_monthly_post_promo_cents taken from its PUBLISHED LabelVersion at creation.
      - name: source_plan_id
        type: string
        source: computed
        description: "Denormalized copy of SubscriberAccount.plan_id at notice creation; never client-supplied."
      - name: state
        type: enum
        source: computed
        description: Notice lifecycle state.
        default: SENT
        constraints: "SENT | ACKNOWLEDGED | EFFECTED"
      - name: acknowledged_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of subscriber acknowledgement; null when not acknowledged.
        default: null
      - name: effected_at
        type: datetime
        source: computed
        description: Logical-clock timestamp at which the change was applied; null before that.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  - entity: MethodologyDocument
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /methodology-documents/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "peak_hours_end_utc_hour > peak_hours_start_utc_hour"
        side_effects:
          - "sets published_at = logical clock"
          - "increments MethodologyDocument.version by 1"
        note: "Authored by NetworkEngineer, published by ComplianceOfficer; only PUBLISHED documents may back TestRun and PerformanceAttestation rows."

  - entity: TestRun
    initial_state: INCLUDED
    terminal_states: [INVALIDATED]
    transitions:
      - from: INCLUDED
        to: INVALIDATED
        trigger: "POST /test-runs/{id}/invalidate"
        actor: NetworkEngineer
        preconditions:
          - "status == INCLUDED, else ERR_TEST_RUN_ALREADY_INVALIDATED"
        side_effects:
          - "CASCADE HOP 1: sets status = INVALIDATED, invalidated_at = logical clock, invalidation_reason = reason"
          - "CASCADE HOP 2 (caused by hop 1): recomputes ServicePlan.evidence_sample_total for plan_id = sum of TestRun.sample_count over TestRun rows with this plan_id and status == INCLUDED; increments ServicePlan.version by 1"
          - "CASCADE HOP 3 (caused by hop 2): for every PerformanceAttestation with plan_id == this plan, status IN {DRAFT, CERTIFIED} and methodology_snapshot.min_samples_required > the new ServicePlan.evidence_sample_total, sets status = REVOKED and revoked_reason = 'EVIDENCE_BELOW_MINIMUM' (ordered by PerformanceAttestation.created_at ASC)"
          - "CASCADE HOP 4 (caused by hop 3): for every LabelVersion with attestation_id == a just-REVOKED attestation and publication_state == PUBLISHED, sets substantiation_status = UNSUBSTANTIATED; publication_state is left unchanged"
          - "CASCADE HOP 5 (caused by hop 4): recomputes ServicePlan.label_posture via calculations.plan_label_posture, which now yields FROZEN because the plan's PUBLISHED label is UNSUBSTANTIATED"
          - "ADDITIONAL consequence of hop 4 (not part of the declared 5-hop chain): every Complaint with disputed_label_version_id == that label and state NOT IN {UPHELD, DISMISSED, WITHDRAWN} gets evidence_gap = true"
          - "COMPENSATING INVARIANT: after this transition, ServicePlan.evidence_sample_total == sum of TestRun.sample_count over TestRun rows with this plan_id and status == INCLUDED (no drift versus the value before the run was recorded)"

  - entity: PerformanceAttestation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /performance-attestations/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT, else ERR_ATTESTATION_INVALID_STATE"
          - "pooled_sample_count >= methodology_snapshot.min_samples_required, else ERR_INSUFFICIENT_SAMPLES"
          - "download_margin_pct >= SUBSTANTIATION_MIN_MARGIN AND upload_margin_pct >= SUBSTANTIATION_MIN_MARGIN, else ERR_SUBSTANTIATION_MARGIN_NOT_MET"
        side_effects:
          - "sets status = CERTIFIED, certified_at = logical clock"
          - "increments PerformanceAttestation.version by 1"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system event: POST /performance-attestations creates a newer attestation for the same plan_id"
        actor: system
        preconditions:
          - "status == CERTIFIED"
          - "the newly created attestation has the same plan_id"
        side_effects:
          - "sets status = SUPERSEDED on the older attestation (at most one per plan by invariant)"
          - "LabelVersion rows already pinned to the superseded attestation keep their pinned typical_* values and their substantiation_status"
        note: "CREATE-with-supersede — the case governed by concurrency_rules.attestation-create-stale-plan."
      - from: DRAFT
        to: REVOKED
        trigger: "system event: cascade hop 3 of POST /test-runs/{id}/invalidate"
        actor: system
        preconditions:
          - "status == DRAFT"
          - "methodology_snapshot.min_samples_required > ServicePlan.evidence_sample_total after the invalidation"
        side_effects:
          - "sets status = REVOKED, revoked_reason = 'EVIDENCE_BELOW_MINIMUM'"
      - from: CERTIFIED
        to: REVOKED
        trigger: "system event: cascade hop 3 of POST /test-runs/{id}/invalidate"
        actor: system
        preconditions:
          - "status == CERTIFIED"
          - "methodology_snapshot.min_samples_required > ServicePlan.evidence_sample_total after the invalidation"
        side_effects:
          - "sets status = REVOKED, revoked_reason = 'EVIDENCE_BELOW_MINIMUM'"
          - "propagates to cascade hop 4 (LabelVersion.substantiation_status = UNSUBSTANTIATED)"

  - entity: LabelVersion
    initial_state: DRAFT
    terminal_states: [ARCHIVED, WITHDRAWN]
    note: "Dimension 1 of 2 — publication_state. Dimension 2 (substantiation_status) is declared as its own machine below and moves independently on the same row."
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /label-versions/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "publication_state == DRAFT, else ERR_LABEL_INVALID_STATE"
          - "X-User-ID != created_by_user_id, else ERR_SOD_SELF_PUBLISH"
          - "the plan has a PerformanceAttestation with status == CERTIFIED, else ERR_ATTESTATION_NOT_CERTIFIED"
          - "every locale in ServicePlan.required_locales has a LabelTranslation on this label with status == VERIFIED, else ERR_TRANSLATION_COVERAGE_INCOMPLETE"
          - "every FeeLineItem of the plan with label_category == MONTHLY_RECURRING appears in fee_itemization for at least one phase, else ERR_FEE_ITEMIZATION_INCOMPLETE"
          - "accessibility_conformance == WCAG_AA, else ERR_ACCESSIBILITY_FORMAT_UNSUPPORTED"
        side_effects:
          - "pins attestation_id to the plan's CERTIFIED attestation (candidate filter: plan_id == this plan AND status == CERTIFIED; at most one by invariant; ranking certified_at DESC, tie-break created_at ASC; empty set → ERR_ATTESTATION_NOT_CERTIFIED)"
          - "copies typical_download_mbps, typical_upload_mbps, typical_latency_ms and methodology_url_snapshot from that attestation"
          - "sets substantiation_status = SUBSTANTIATED (dimension 2)"
          - "sets publication_state = PUBLISHED, published_at = logical clock, published_by_user_id = X-User-ID"
          - "archives the plan's previous PUBLISHED LabelVersion: publication_state = ARCHIVED, archived_at = logical clock, and effective_until = this label's effective_from when its effective_until is null or later"
          - "sets ServicePlan.active_label_version_id = this label's id, ServicePlan.price_disclosure_drift = false, and this label's price_disclosure_drift = false"
          - "clears Complaint.evidence_gap (sets false) on every Complaint whose disputed_label_version_id belongs to this plan and whose state NOT IN {UPHELD, DISMISSED, WITHDRAWN}"
          - "recomputes ServicePlan.label_posture via calculations.plan_label_posture; increments ServicePlan.version by 1"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "system event: a successor LabelVersion of the same plan is published"
        actor: system
        preconditions:
          - "publication_state == PUBLISHED"
        side_effects:
          - "sets archived_at = logical clock and truncates effective_until to the successor's effective_from when currently null or later"
          - "existing LabelDisclosure rows remain readable and keep disclosed_label_version_seq"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /label-versions/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "publication_state == PUBLISHED, else ERR_LABEL_INVALID_STATE"
        side_effects:
          - "sets publication_state = WITHDRAWN, withdrawn_at = logical clock"
          - "COMPENSATION: restores the most recently ARCHIVED LabelVersion of the same plan (candidate filter publication_state == ARCHIVED; ranking version_seq DESC; tie-break created_at ASC; empty set → no restoration) to publication_state = PUBLISHED, clears its archived_at, and restores its effective_until to the value it held before truncation"
          - "sets ServicePlan.active_label_version_id to the restored label's id, or null when there is none"
          - "recomputes ServicePlan.label_posture via calculations.plan_label_posture; increments ServicePlan.version by 1"

  - entity: LabelVersion
    initial_state: PENDING_EVIDENCE
    terminal_states: []
    note: "Dimension 2 of 2 — substantiation_status. Cycles UNSUBSTANTIATED → SUBSTANTIATED without touching publication_state."
    transitions:
      - from: PENDING_EVIDENCE
        to: SUBSTANTIATED
        trigger: "system event: POST /label-versions/{id}/publish pins a CERTIFIED attestation"
        actor: system
        preconditions:
          - "substantiation_status == PENDING_EVIDENCE"
          - "attestation_id was just pinned to an attestation with status == CERTIFIED"
        side_effects:
          - "typical_download_mbps, typical_upload_mbps, typical_latency_ms become non-null"
      - from: SUBSTANTIATED
        to: UNSUBSTANTIATED
        trigger: "system event: cascade hop 4 of POST /test-runs/{id}/invalidate revokes the pinned attestation"
        actor: system
        preconditions:
          - "substantiation_status == SUBSTANTIATED"
          - "the attestation named by attestation_id reached status == REVOKED"
        side_effects:
          - "publication_state is NOT changed — a PUBLISHED label stays PUBLISHED while unsubstantiated"
          - "cascade hop 5 recomputes ServicePlan.label_posture to FROZEN"
      - from: UNSUBSTANTIATED
        to: SUBSTANTIATED
        trigger: "system event: POST /performance-attestations/{id}/certify certifies a replacement attestation for the plan"
        actor: system
        preconditions:
          - "substantiation_status == UNSUBSTANTIATED"
          - "publication_state == PUBLISHED"
          - "the newly CERTIFIED attestation has plan_id == this label's plan_id"
        side_effects:
          - "re-pins attestation_id to the newly CERTIFIED attestation and refreshes typical_download_mbps, typical_upload_mbps, typical_latency_ms and methodology_url_snapshot"
          - "recomputes ServicePlan.label_posture via calculations.plan_label_posture; increments ServicePlan.version by 1"

  - entity: LabelTranslation
    initial_state: DRAFT
    terminal_states: [VERIFIED]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /label-versions/{id}/translations/{translationId}/verify"
        actor: LocalizationSpecialist
        preconditions:
          - "status == DRAFT, else ERR_TRANSLATION_INVALID_STATE"
          - "the parent LabelVersion.publication_state == DRAFT, else ERR_LABEL_INVALID_STATE"
          - "X-User-ID != created_by_user_id, else ERR_SOD_SELF_REVIEW"
        side_effects:
          - "sets status = VERIFIED, verified_by_user_id = X-User-ID, verified_at = logical clock"
          - "increments LabelVersion.verified_locale_count by 1 and increments LabelVersion.version by 1"

  - entity: SubscriberAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PENDING_CHANGE
        trigger: "system event: POST /plan-change-notices creates a notice for this account"
        actor: system
        preconditions:
          - "subscription_state == ACTIVE, else ERR_ACCOUNT_CHANGE_ALREADY_PENDING"
        side_effects:
          - "sets subscription_state = PENDING_CHANGE; increments SubscriberAccount.version by 1"
      - from: PENDING_CHANGE
        to: ACTIVE
        trigger: "system event: POST /plan-change-notices/{id}/effect applies the notice"
        actor: system
        preconditions:
          - "subscription_state == PENDING_CHANGE"
        side_effects:
          - "sets plan_id = PlanChangeNotice.target_plan_id when notice_type == PLAN_CHANGE"
          - "recomputes pricing_phase via calculations.account_pricing_phase"
          - "sets subscription_state = ACTIVE"

  - entity: Complaint
    initial_state: INTAKE
    terminal_states: [UPHELD, WITHDRAWN]
    note: "Cyclic: UNDER_INVESTIGATION ⇄ INFO_REQUESTED, plus DISMISSED → UNDER_INVESTIGATION reopen. DISMISSED is deliberately NOT terminal."
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /complaints/{id}/triage"
        actor: ComplaintAnalyst
        preconditions:
          - "state == INTAKE, else ERR_COMPLAINT_INVALID_STATE"
        side_effects:
          - "sets triaged_at = logical clock and sla_due_at = triaged_at + COMPLAINT_SLA_DAYS days"
      - from: TRIAGED
        to: UNDER_INVESTIGATION
        trigger: "POST /complaints/{id}/investigate"
        actor: ComplaintAnalyst
        preconditions:
          - "state == TRIAGED, else ERR_COMPLAINT_INVALID_STATE"
        side_effects:
          - "computes shortfall_ratio and severity via calculations.complaint_shortfall_assessment"
      - from: UNDER_INVESTIGATION
        to: INFO_REQUESTED
        trigger: "POST /complaints/{id}/request-info"
        actor: ComplaintAnalyst
        preconditions:
          - "state == UNDER_INVESTIGATION, else ERR_COMPLAINT_INVALID_STATE"
        side_effects:
          - "sets info_request_note = info_request_note"
      - from: INFO_REQUESTED
        to: UNDER_INVESTIGATION
        trigger: "POST /complaints/{id}/investigate"
        actor: ComplaintAnalyst
        preconditions:
          - "state == INFO_REQUESTED, else ERR_COMPLAINT_INVALID_STATE"
        side_effects:
          - "increments investigation_cycles by 1"
          - "recomputes shortfall_ratio and severity via calculations.complaint_shortfall_assessment against the same pinned LabelVersion values"
      - from: UNDER_INVESTIGATION
        to: UPHELD
        trigger: "POST /complaints/{id}/resolve with finding == UPHELD"
        actor: ComplaintAnalyst
        preconditions:
          - "state == UNDER_INVESTIGATION, else ERR_COMPLAINT_INVALID_STATE"
          - "credit_basis is present, else ERR_INVALID_REQUEST"
          - "severity != NONE, else ERR_SHORTFALL_NOT_SUBSTANTIATED"
        side_effects:
          - "CASCADE HOP 1: sets state = UPHELD, resolution = UPHELD, resolved_at = logical clock, resolution_note = resolution_note, credit_basis = credit_basis, and remediation_credit_cents via calculations.remediation_credit_amount"
          - "CASCADE HOP 2 (caused by hop 1): creates a RemediationCredit with complaint_id = this complaint, account_id = this complaint's account_id, basis = credit_basis, amount_cents = remediation_credit_cents, status = ISSUED, issued_by_user_id = X-User-ID"
          - "CASCADE HOP 3 (caused by hop 2): recomputes SubscriberAccount.credit_balance_cents = sum of RemediationCredit.amount_cents over rows with this account_id and status == ISSUED, and remediation_count = count of those rows; increments SubscriberAccount.version by 1"
          - "CASCADE HOP 4 (caused by hop 3): sets SubscriberAccount.audit_flag = true when remediation_count >= REMEDIATION_AUDIT_THRESHOLD, false otherwise"
          - "ADDITIONAL consequence of hop 1 (not part of the declared 4-hop chain): increments ServicePlan.upheld_complaint_count by 1 for the account's plan and recomputes ServicePlan.label_posture via calculations.plan_label_posture; increments ServicePlan.version by 1"
      - from: UNDER_INVESTIGATION
        to: DISMISSED
        trigger: "POST /complaints/{id}/resolve with finding == DISMISSED"
        actor: ComplaintAnalyst
        preconditions:
          - "state == UNDER_INVESTIGATION, else ERR_COMPLAINT_INVALID_STATE"
          - "credit_basis is absent, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets state = DISMISSED, resolution = DISMISSED, resolved_at = logical clock, resolution_note = resolution_note"
          - "no RemediationCredit is created; SubscriberAccount.credit_balance_cents and ServicePlan.upheld_complaint_count are unchanged"
      - from: DISMISSED
        to: UNDER_INVESTIGATION
        trigger: "POST /complaints/{id}/reopen"
        actor: ComplaintAnalyst
        preconditions:
          - "state == DISMISSED, else ERR_COMPLAINT_INVALID_STATE"
          - "floor((logical clock - resolved_at) / 86400 seconds) <= REOPEN_WINDOW_DAYS, else ERR_REOPEN_WINDOW_EXPIRED"
          - "reopened_count < MAX_REOPENS, else ERR_REOPEN_WINDOW_EXPIRED"
        side_effects:
          - "increments reopened_count by 1; sets resolved_at = null, resolution = NONE, resolution_note = null"
      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /complaints/{id}/withdraw"
        actor: Subscriber
        preconditions:
          - "state == INTAKE"
          - "X-User-ID == this complaint's account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
        side_effects:
          - "sets state = WITHDRAWN, resolution = WITHDRAWN, resolved_at = logical clock"
      - from: TRIAGED
        to: WITHDRAWN
        trigger: "POST /complaints/{id}/withdraw"
        actor: Subscriber
        preconditions:
          - "state == TRIAGED"
          - "X-User-ID == this complaint's account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
        side_effects:
          - "sets state = WITHDRAWN, resolution = WITHDRAWN, resolved_at = logical clock"
      - from: UNDER_INVESTIGATION
        to: WITHDRAWN
        trigger: "POST /complaints/{id}/withdraw"
        actor: Subscriber
        preconditions:
          - "state == UNDER_INVESTIGATION"
          - "X-User-ID == this complaint's account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
        side_effects:
          - "sets state = WITHDRAWN, resolution = WITHDRAWN, resolved_at = logical clock"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /complaints/{id}/withdraw"
        actor: Subscriber
        preconditions:
          - "state == INFO_REQUESTED"
          - "X-User-ID == this complaint's account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
        side_effects:
          - "sets state = WITHDRAWN, resolution = WITHDRAWN, resolved_at = logical clock"

  - entity: RemediationCredit
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /remediation-credits/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "status == ISSUED, else ERR_CREDIT_ALREADY_VOIDED"
        side_effects:
          - "sets status = VOIDED, voided_at = logical clock, voided_by_user_id = X-User-ID, void_reason = void_reason"
          - "COMPENSATION: recomputes SubscriberAccount.credit_balance_cents = sum of RemediationCredit.amount_cents over rows with this account_id and status == ISSUED, and remediation_count = count of those rows"
          - "recomputes SubscriberAccount.audit_flag = (remediation_count >= REMEDIATION_AUDIT_THRESHOLD)"
          - "sets Complaint.remediation_credit_cents = 0 on the complaint named by complaint_id; Complaint.state stays UPHELD and ServicePlan.upheld_complaint_count is unchanged"
          - "COMPENSATING INVARIANT: after this transition, SubscriberAccount.credit_balance_cents == sum of RemediationCredit.amount_cents over rows with this account_id and status == ISSUED — identical to its value before the forward issuance"

  - entity: RegulatorInquiry
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    note: "Fork-join: the TECHNICAL_PACKET and RESOLUTION_REPORT branches are independent, carry different preconditions and different side-effect sets, and converge on RESPONSE_COMPLETE."
    transitions:
      - from: RECEIVED
        to: EVIDENCE_ASSEMBLY
        trigger: "POST /regulator-inquiries/{id}/filings with filing_type == TECHNICAL_PACKET"
        actor: RegulatoryLiaison
        preconditions:
          - "state == RECEIVED"
          - "the Complaint named by complaint_id has a disputed LabelVersion whose attestation_id is non-null AND whose substantiation_status == SUBSTANTIATED, else ERR_LABEL_NOT_SUBSTANTIATED_FOR_FILING"
        side_effects:
          - "sets technical_evidence_ref = evidence_ref and technical_packet_filed_at = logical clock"
      - from: RECEIVED
        to: EVIDENCE_ASSEMBLY
        trigger: "POST /regulator-inquiries/{id}/filings with filing_type == RESOLUTION_REPORT"
        actor: RegulatoryLiaison
        preconditions:
          - "state == RECEIVED"
          - "the Complaint named by complaint_id has state IN {UPHELD, DISMISSED, WITHDRAWN}, else ERR_COMPLAINT_NOT_TERMINAL"
        side_effects:
          - "sets resolution_report_ref = evidence_ref and resolution_report_filed_at = logical clock"
      - from: EVIDENCE_ASSEMBLY
        to: RESPONSE_COMPLETE
        trigger: "POST /regulator-inquiries/{id}/filings with the filing_type whose *_filed_at is still null"
        actor: RegulatoryLiaison
        preconditions:
          - "state == EVIDENCE_ASSEMBLY"
          - "the branch named by filing_type has a null *_filed_at, else ERR_INQUIRY_INVALID_STATE"
          - "the branch's own precondition above holds for the named filing_type"
        side_effects:
          - "records that branch's ref and *_filed_at"
          - "JOIN: sets state = RESPONSE_COMPLETE because both technical_packet_filed_at and resolution_report_filed_at are now non-null"
          - "sets filed_late = (max(technical_packet_filed_at, resolution_report_filed_at) > response_due_at)"
      - from: RESPONSE_COMPLETE
        to: CLOSED
        trigger: "POST /regulator-inquiries/{id}/close"
        actor: RegulatoryLiaison
        preconditions:
          - "state == RESPONSE_COMPLETE, else ERR_INQUIRY_FILINGS_INCOMPLETE"
        side_effects:
          - "sets state = CLOSED, closed_at = logical clock, closure_note = closure_note"

  - entity: PlanChangeNotice
    initial_state: SENT
    terminal_states: [EFFECTED]
    transitions:
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /plan-change-notices/{id}/acknowledge"
        actor: Subscriber
        preconditions:
          - "state == SENT, else ERR_NOTICE_INVALID_STATE"
          - "X-User-ID == account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
        side_effects:
          - "sets acknowledged_at = logical clock"
      - from: ACKNOWLEDGED
        to: EFFECTED
        trigger: "POST /plan-change-notices/{id}/effect"
        actor: RetailAgent
        preconditions:
          - "state == ACKNOWLEDGED, else ERR_NOTICE_INVALID_STATE"
          - "logical clock >= effective_date, else ERR_NOTICE_NOT_DUE"
        side_effects:
          - "sets state = EFFECTED, effected_at = logical clock"
          - "moves the SubscriberAccount to target_plan_id when notice_type == PLAN_CHANGE and returns subscription_state to ACTIVE"
          - "recomputes SubscriberAccount.pricing_phase via calculations.account_pricing_phase"

  - entity: ServicePlan
    initial_state: RESTRICTED
    terminal_states: []
    note: "Derived posture dimension on ServicePlan.label_posture. Every transition is a re-evaluation of calculations.plan_label_posture, never a direct client write."
    transitions:
      - from: RESTRICTED
        to: OPEN
        trigger: "system event: calculations.plan_label_posture re-evaluated after POST /label-versions/{id}/publish"
        actor: system
        preconditions:
          - "a LabelVersion of this plan has publication_state == PUBLISHED and substantiation_status == SUBSTANTIATED"
          - "price_disclosure_drift == false"
          - "upheld_complaint_count < POSTURE_FREEZE_UPHELD_COUNT"
        side_effects:
          - "sets label_posture = OPEN, enabling POINT_OF_SALE disclosures and PRICE_INCREASE notices"
      - from: OPEN
        to: RESTRICTED
        trigger: "system event: calculations.plan_label_posture re-evaluated after PATCH /service-plans/{id} changes a disclosed price field"
        actor: system
        preconditions:
          - "price_disclosure_drift == true"
          - "upheld_complaint_count < POSTURE_FREEZE_UPHELD_COUNT"
          - "the PUBLISHED label's substantiation_status != UNSUBSTANTIATED"
        side_effects:
          - "sets label_posture = RESTRICTED, blocking POINT_OF_SALE disclosures and PRICE_INCREASE notices while ACCOUNT_PORTAL disclosures continue"
      - from: OPEN
        to: FROZEN
        trigger: "system event: calculations.plan_label_posture re-evaluated after cascade hop 4 of POST /test-runs/{id}/invalidate, or after a Complaint reaches UPHELD"
        actor: system
        preconditions:
          - "upheld_complaint_count >= POSTURE_FREEZE_UPHELD_COUNT OR the PUBLISHED label's substantiation_status == UNSUBSTANTIATED"
        side_effects:
          - "sets label_posture = FROZEN, blocking every LabelDisclosure channel and every PlanChangeNotice"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system event: calculations.plan_label_posture re-evaluated after a Complaint reaches UPHELD"
        actor: system
        preconditions:
          - "upheld_complaint_count >= POSTURE_FREEZE_UPHELD_COUNT OR the PUBLISHED label's substantiation_status == UNSUBSTANTIATED"
        side_effects:
          - "sets label_posture = FROZEN"
      - from: FROZEN
        to: OPEN
        trigger: "system event: calculations.plan_label_posture re-evaluated after POST /performance-attestations/{id}/certify re-substantiates the PUBLISHED label"
        actor: system
        preconditions:
          - "the PUBLISHED label's substantiation_status == SUBSTANTIATED"
          - "price_disclosure_drift == false"
          - "upheld_complaint_count < POSTURE_FREEZE_UPHELD_COUNT"
        side_effects:
          - "sets label_posture = OPEN"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on ServicePlan.version only)
# =============================================================================

concurrency_rules:
  - rule_id: attestation-create-stale-plan
    parent_entity: ServicePlan
    write_endpoint: "POST /performance-attestations"
    occ_field: "expected_plan_version"
    description: |
      Creating a PerformanceAttestation against a ServicePlan whose version has
      advanced since the client last read it is rejected with a stale-version
      error. This is a genuine CREATE-with-supersede case: a second attestation
      for the same plan legitimately supersedes the prior CERTIFIED one
      (state_machines.PerformanceAttestation.CERTIFIED_to_SUPERSEDED), so the
      write cannot be rejected by any state precondition — the client's stale
      view of the plan (new fee lines, a price change, a changed evidence pool)
      is the only thing that makes the write unsafe.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: label-version-create-stale-plan
    parent_entity: ServicePlan
    write_endpoint: "POST /label-versions"
    occ_field: "expected_plan_version"
    description: |
      Creating a LabelVersion against a ServicePlan whose version has advanced
      since the client last read it is rejected with a stale-version error. A
      new DRAFT label is always a legitimate write (it supersedes the prior
      PUBLISHED label once published), so no state precondition can catch a
      client that computed its itemization from an out-of-date plan snapshot;
      the version check is what guarantees the label was drafted against the
      prices and fee lines the client actually saw.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:

  - name: label_monthly_itemization
    trigger: "on POST /label-versions (initial computation), on POST /service-plans/{id}/fee-line-items for every DRAFT LabelVersion of the plan, and on PATCH /service-plans/{id} for every DRAFT LabelVersion of the plan"
    algorithm: aggregation
    formula: |
      # ---- phase bases -------------------------------------------------------
      base(INTRO)       = ServicePlan.intro_price_cents        # skipped entirely when null
      base(POST_PROMO)  = ServicePlan.monthly_price_cents

      # ---- per-phase monthly itemization ------------------------------------
      for PHASE in [INTRO, POST_PROMO]:                        # INTRO omitted when intro_price_cents is null
        lines(PHASE) = FeeLineItem rows where
                         plan_id == ServicePlan.id
                         AND label_category IN {MONTHLY_RECURRING, GOVERNMENT_TAX}
                         AND applies_during IN {ALWAYS} ∪ ({INTRO_ONLY} if PHASE == INTRO else {POST_PROMO_ONLY})
                       ordered by created_at ASC          # tie-break: none needed, created_at is unique per row
        for L in lines(PHASE) in that order:
          if L.basis == FIXED:
            line_amount = L.amount_cents
          else:                                           # PCT_OF_MONTHLY_CHARGE
            line_amount = round_half_up(L.rate_pct * base(PHASE))   # <<< ROUND EACH LINE TO WHOLE CENTS HERE
          emit { fee_code: L.fee_code, label_category: L.label_category, phase: PHASE, amount_cents: line_amount }
        monthly_total(PHASE) = base(PHASE) + sum(line_amount for L in lines(PHASE))

      monthly_total_intro_cents      = monthly_total(INTRO)      # null when intro_price_cents is null
      monthly_total_post_promo_cents = monthly_total(POST_PROMO)

      # ---- one-time block ----------------------------------------------------
      one_time_lines = FeeLineItem rows where plan_id == ServicePlan.id
                       AND label_category == ONE_TIME, ordered by created_at ASC
      one_time_fee_total_cents = sum(L.amount_cents for L in one_time_lines)
      each one_time line is emitted into fee_itemization with phase = ONE_TIME
    input_set: |
      FeeLineItem rows of the plan only. label_category IN {MONTHLY_RECURRING, GOVERNMENT_TAX} enter the
      monthly totals; label_category == ONE_TIME enters one_time_fee_total_cents; label_category IN
      {EARLY_TERMINATION, DATA_OVERAGE} are disclosed in their own label blocks and are EXCLUDED from
      both monthly totals and one_time_fee_total_cents. No status filter exists on FeeLineItem (rows are
      never retired); the plan's own posture does not filter the set.
    constants: {}
    precision: |
      Whole cents, round_half_up. PINNED ROUNDING ORDER: round-then-sum — every
      PCT_OF_MONTHLY_CHARGE line is rounded to whole cents individually and only then added to the
      running total. Sum-then-round (accumulating exact fractional cents across percentage lines and
      rounding the phase total once) is EXPLICITLY WRONG and produces a total that differs by one cent
      on the reference fixture. The percentage base is base(PHASE) alone — NEVER base(PHASE) plus the
      fixed fee lines, and NEVER a net amount after the discount benefit.

  - name: discount_program_benefit
    trigger: "on POST /label-versions and on every recomputation of calculations.label_monthly_itemization for a DRAFT LabelVersion"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER (the dependency only looks circular):
      #   step 1 — calculations.label_monthly_itemization produces monthly_total(PHASE) from the GROSS
      #            phase base, including percentage lines computed on that gross base;
      #   step 2 — the benefit is derived FROM that gross total;
      #   step 3 — the net is the gross minus the benefit.
      # Percentage fee lines are NEVER recomputed against the net amount, and the benefit is NEVER
      # subtracted from base(PHASE) before the percentage lines are computed.
      if LabelVersion.discount_program_applied == false:
        benefit(PHASE) = 0
      else:
        benefit(PHASE) = min(DISCOUNT_MONTHLY_CAP_CENTS, monthly_total(PHASE))
      net(PHASE) = monthly_total(PHASE) - benefit(PHASE)

      discount_program_benefit_intro_cents      = benefit(INTRO)        # 0 when there is no intro phase
      discount_program_benefit_post_promo_cents = benefit(POST_PROMO)
      net_monthly_intro_cents      = net(INTRO)                          # null when there is no intro phase
      net_monthly_post_promo_cents = net(POST_PROMO)
    input_set: "The single LabelVersion being computed plus the monthly_total values produced in step 1 by calculations.label_monthly_itemization."
    constants:
      DISCOUNT_MONTHLY_CAP_CENTS: 3000
    precision: "Whole cents; no rounding occurs in this rule because both operands are already whole cents. min() clamps the benefit so net(PHASE) can reach exactly 0 but never goes negative."

  - name: first_year_total_disclosure
    trigger: "on POST /label-versions and on every recomputation of calculations.label_monthly_itemization for a DRAFT LabelVersion"
    algorithm: tiered_pricing
    formula: |
      m = min(ServicePlan.intro_term_months, PROMO_DISCLOSURE_MONTHS)     # months billed at the intro net
      # variant PROMO_WEIGHTED
      first_year_total_promo_weighted_cents =
          one_time_fee_total_cents
          + net_monthly_intro_cents * m
          + net_monthly_post_promo_cents * (PROMO_DISCLOSURE_MONTHS - m)
      # variant POST_PROMO_ANNUALIZED
      first_year_total_post_promo_cents =
          one_time_fee_total_cents
          + net_monthly_post_promo_cents * PROMO_DISCLOSURE_MONTHS
      # When intro_price_cents is null, m == 0 and the two variants coincide.
    input_set: "The single LabelVersion being computed; both variants are always stored on the row so the label can disclose introductory and post-promotional first-year cost side by side."
    constants:
      PROMO_DISCLOSURE_MONTHS: 12
    precision: "Whole cents; both variants are exact integer arithmetic with no rounding step."
    variants:
      - name: PROMO_WEIGHTED
        when: "Disclosed as the label's 'first-year total' whenever the plan has an introductory price; also the figure a point-of-sale disclosure must show."
        difference: "Bills the introductory net for min(intro_term_months, 12) months and the post-promotional net for the remaining months of the first year."
      - name: POST_PROMO_ANNUALIZED
        when: "Disclosed alongside it as the 'ongoing annual cost after the promotional period'."
        difference: "Bills the post-promotional net for all 12 months, ignoring the introductory price entirely; strictly greater than PROMO_WEIGHTED whenever net_monthly_post_promo_cents > net_monthly_intro_cents and m > 0."

  - name: typical_speed_metrics
    trigger: "on POST /performance-attestations"
    algorithm: chronological
    formula: |
      runs = TestRun rows where plan_id == PerformanceAttestation.plan_id
                          AND methodology_doc_id == PerformanceAttestation.methodology_doc_id
                          AND status == INCLUDED
             ordered by created_at ASC            # snapshot order recorded in included_run_ids
      all_samples = concatenation of run.samples over runs in that order
      if all_samples is empty: reject with ERR_NO_ELIGIBLE_TEST_RUNS

      peak_start = methodology_snapshot.peak_hours_start_utc_hour
      peak_end   = methodology_snapshot.peak_hours_end_utc_hour
      # variant PEAK_HOUR_MEDIAN
      pool = [ s for s in all_samples if peak_start <= utc_hour(s.observed_at) < peak_end ]
      # variant ALL_HOUR_P20
      pool = all_samples

      pooled_sample_count = len(pool)
      if pooled_sample_count == 0: reject with ERR_NO_ELIGIBLE_TEST_RUNS

      def median(values):            # variant PEAK_HOUR_MEDIAN
        v = sort_ascending(values); n = len(v)
        return v[(n-1)//2] if n is odd else (v[n//2 - 1] + v[n//2]) / 2
      def p20(values):               # variant ALL_HOUR_P20, nearest-rank
        v = sort_ascending(values); return v[ceil(0.20 * len(v)) - 1]      # 1-based rank ceil(0.20*n)
      def p95(values):               # latency, both variants, nearest-rank
        v = sort_ascending(values); return v[ceil(0.95 * len(v)) - 1]

      typical_download_mbps = round_half_up(median_or_p20(s.download_mbps for s in pool), 2)
      typical_upload_mbps   = round_half_up(median_or_p20(s.upload_mbps   for s in pool), 2)
      typical_latency_ms    = round_half_up(p95(s.latency_ms for s in pool), 0)

      download_margin_pct = round_half_up(typical_download_mbps / ServicePlan.advertised_download_mbps, 4)
      upload_margin_pct   = round_half_up(typical_upload_mbps   / ServicePlan.advertised_upload_mbps,   4)
    input_set: |
      Only TestRun rows with status == INCLUDED, matching plan_id AND matching methodology_doc_id, are
      pooled; INVALIDATED runs and runs measured under any other methodology document are excluded.
      Sample order inside the pool follows TestRun.created_at ASC then the samples array index, which
      matters only for included_run_ids (both percentile functions sort their own values).
    constants: {}
    precision: "typical_download_mbps / typical_upload_mbps: 2 decimals, round_half_up. typical_latency_ms: whole ms, round_half_up. margins: 4 decimals, round_half_up."
    variants:
      - name: PEAK_HOUR_MEDIAN
        when: "PerformanceAttestation.metric_variant == PEAK_HOUR_MEDIAN — the busy-hour claim the label's 'typical speed' line cites."
        difference: "Restricts the pool to samples whose UTC hour falls in [peak_hours_start_utc_hour, peak_hours_end_utc_hour) and reports the median (mean of the two central values on an even count)."
      - name: ALL_HOUR_P20
        when: "PerformanceAttestation.metric_variant == ALL_HOUR_P20 — the conservative all-hours floor cited in the methodology annex."
        difference: "Pools every sample regardless of hour and reports the nearest-rank 20th percentile, which on identical run data yields a lower download figure and a higher p95 latency than PEAK_HOUR_MEDIAN."

  - name: plan_label_posture
    trigger: "on POST /label-versions/{id}/publish, POST /label-versions/{id}/withdraw, POST /performance-attestations/{id}/certify, PATCH /service-plans/{id}, POST /complaints/{id}/resolve, and cascade hop 5 of POST /test-runs/{id}/invalidate"
    algorithm: constraint_propagation
    formula: |
      published = the LabelVersion row where plan_id == ServicePlan.id AND publication_state == PUBLISHED
                  (at most one by invariant; null when none)
      # evaluated top to bottom, first match wins
      if ServicePlan.upheld_complaint_count >= POSTURE_FREEZE_UPHELD_COUNT:            label_posture = FROZEN
      elif published is not null AND published.substantiation_status == UNSUBSTANTIATED: label_posture = FROZEN
      elif published is null:                                                           label_posture = RESTRICTED
      elif ServicePlan.price_disclosure_drift == true:                                  label_posture = RESTRICTED
      else:                                                                             label_posture = OPEN
    input_set: "The plan row itself plus its single PUBLISHED LabelVersion (publication_state == PUBLISHED); ARCHIVED, WITHDRAWN and DRAFT labels are excluded."
    constants:
      POSTURE_FREEZE_UPHELD_COUNT: 3
    precision: "Enum result; no numeric rounding. Gate semantics: OPEN allows every LabelDisclosure channel and every PlanChangeNotice; RESTRICTED blocks channel == POINT_OF_SALE and notice_type == PRICE_INCREASE; FROZEN blocks every LabelDisclosure and every PlanChangeNotice."

  - name: effective_label_selection
    trigger: "on POST /subscriber-accounts/{id}/label-disclosures"
    algorithm: interval_merge
    formula: |
      candidates = LabelVersion rows where
                     plan_id == SubscriberAccount.plan_id
                     AND publication_state == PUBLISHED
                     AND effective_from <= logical_clock
                     AND (effective_until is null OR logical_clock < effective_until)   # half-open window
      ranking  = version_seq DESC
      tie_break = created_at ASC        # unreachable in practice: version_seq is unique per plan
      if candidates is empty: reject with ERR_LABEL_NOT_EFFECTIVE_FOR_SERVICE_DATE
      selected = first candidate under (ranking, tie_break)

      disclosed_label_version_seq = selected.version_seq
      disclosed_net_monthly_cents = selected.net_monthly_intro_cents
                                      if SubscriberAccount.pricing_phase == INTRO
                                      else selected.net_monthly_post_promo_cents
    input_set: "PUBLISHED LabelVersion rows of the account's current plan_id whose half-open display window [effective_from, effective_until) contains the logical clock. ARCHIVED, WITHDRAWN and DRAFT rows are excluded even when their window covers the clock."
    constants: {}
    precision: "Exact selection; disclosed_net_monthly_cents is copied as whole cents with no re-rounding."

  - name: account_pricing_phase
    trigger: "on POST /subscriber-accounts, on POST /plan-change-notices/{id}/effect, and on every read that returns SubscriberAccount"
    algorithm: threshold
    formula: |
      elapsed_months = floor((logical_clock - SubscriberAccount.service_start_date) / (PHASE_MONTH_SECONDS seconds))
      plan = the ServicePlan named by SubscriberAccount.plan_id
      if plan.intro_price_cents is null:                pricing_phase = POST_PROMO
      elif elapsed_months < plan.intro_term_months:     pricing_phase = INTRO
      else:                                             pricing_phase = POST_PROMO
    input_set: "The account row and its current plan; a negative elapsed span (clock before service_start_date) yields elapsed_months <= 0 and therefore INTRO for a plan with an introductory price."
    constants:
      PHASE_MONTH_SECONDS: 2592000
    precision: "Integer month count via floor; the boundary is exclusive — elapsed_months == intro_term_months is already POST_PROMO."

  - name: complaint_shortfall_assessment
    trigger: "on POST /complaints/{id}/investigate (both the TRIAGED and the INFO_REQUESTED origin)"
    algorithm: threshold
    formula: |
      L = the LabelVersion named by Complaint.disputed_label_version_id     # pinned typical_* values
      if Complaint.allegation_type == SPEED_SHORTFALL:
        claimed  = L.typical_download_mbps
        observed = Complaint.measured_download_mbps
        shortfall_ratio = round_half_up(max(0, claimed - observed) / claimed, 4)
      elif Complaint.allegation_type == LATENCY_SHORTFALL:
        allowed = L.typical_latency_ms + LATENCY_TOLERANCE_MS
        excess  = max(0, Complaint.measured_latency_ms - allowed)
        shortfall_ratio = round_half_up(min(1.0, excess / L.typical_latency_ms), 4)
      elif Complaint.allegation_type == RELIABILITY_OUTAGE:
        shortfall_ratio = round_half_up(min(1.0, Complaint.affected_days / RELIABILITY_WINDOW_DAYS), 4)
      else:      # FEE_MISMATCH — a pricing dispute carries no speed shortfall
        shortfall_ratio = 0.0

      if   shortfall_ratio >= SEVERE_RATIO:   severity = SEVERE
      elif shortfall_ratio >= MODERATE_RATIO: severity = MODERATE
      elif shortfall_ratio >  0:              severity = MINOR
      else:                                   severity = NONE
    input_set: "The single Complaint row plus the pinned typical_* fields of the LabelVersion named by disputed_label_version_id. A label whose typical_* fields are null (never published) cannot be disputed — POST /complaints rejects it with ERR_LABEL_INVALID_STATE."
    constants:
      LATENCY_TOLERANCE_MS: 5
      RELIABILITY_WINDOW_DAYS: 30
      SEVERE_RATIO: 0.50
      MODERATE_RATIO: 0.25
    precision: "shortfall_ratio: 4 decimals, round_half_up, clamped into [0, 1]. Severity thresholds are inclusive (>=), so exactly 0.5000 is SEVERE and exactly 0.2500 is MODERATE."

  - name: remediation_credit_amount
    trigger: "on POST /complaints/{id}/resolve with finding == UPHELD"
    algorithm: waterfall_allocation
    formula: |
      L = the LabelVersion named by Complaint.disputed_label_version_id
      A = the SubscriberAccount named by Complaint.account_id
      base = L.net_monthly_intro_cents if A.pricing_phase == INTRO else L.net_monthly_post_promo_cents

      if Complaint.severity == NONE:
        amount_cents = 0
      else:
        if Complaint.credit_basis == PRORATA_DAYS:
          raw = base * Complaint.shortfall_ratio * min(Complaint.affected_days, CREDIT_WINDOW_DAYS) / CREDIT_WINDOW_DAYS
        else:      # FLAT_SEVERITY_TIER
          raw = FLAT_TIER_CENTS[Complaint.severity]
        # PINNED ORDER: round to whole cents FIRST, then apply the floor, then the base ceiling.
        amount_cents = min(base, max(CREDIT_FLOOR_CENTS, round_half_up(raw, 0)))
    input_set: "The single Complaint row (severity, shortfall_ratio, affected_days, credit_basis), its account's pricing_phase, and the pinned net monthly figures of the disputed LabelVersion."
    constants:
      CREDIT_WINDOW_DAYS: 30
      CREDIT_FLOOR_CENTS: 500
      FLAT_TIER_CENTS: { NONE: 0, MINOR: 1000, MODERATE: 2500, SEVERE: 5000 }
      REMEDIATION_AUDIT_THRESHOLD: 2
    precision: |
      Whole cents, round_half_up, applied to `raw` BEFORE the floor and the ceiling. The floor never
      lifts a NONE-severity complaint above 0 (that branch returns before the clamp), and the base
      ceiling means a FLAT_SEVERITY_TIER credit can never exceed one month's net charge.

  - name: etf_disclosure_amount
    trigger: "on POST /plan-change-notices"
    algorithm: decay_function
    formula: |
      A = the SubscriberAccount named by account_id
      P = the ServicePlan named by A.plan_id            # the SOURCE plan, recorded as source_plan_id
      if P.etf_proration_policy == NONE:
        etf_disclosed_cents = 0
      elif P.etf_proration_policy == FULL:
        etf_disclosed_cents = P.early_termination_fee_cents
      else:                                              # PRORATED_MONTHLY
        elapsed_months   = floor((logical_clock - A.service_start_date) / (PHASE_MONTH_SECONDS seconds))
        remaining_months = max(0, P.intro_term_months - elapsed_months)
        etf_disclosed_cents = round_half_up(
            P.early_termination_fee_cents * remaining_months / max(1, P.intro_term_months), 0)
    input_set: "The account row and its current (source) plan. The target plan's fee is irrelevant — the early termination fee disclosed on a notice is always the one owed on the plan being left."
    constants:
      PHASE_MONTH_SECONDS: 2592000
    precision: "Whole cents, round_half_up. The decay is a step function on whole elapsed 30-day months, reaching 0 once elapsed_months >= intro_term_months."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================

validations:

  - priority: 10
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 15
    category: auth
    check: "the acting role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 20
    category: business_constraint
    check: |
      Request body conforms to the endpoint's input schema: every required field present, types correct,
      enum members valid, numeric ranges honored, and the conditional field rules hold —
      FeeLineItem.amount_cents required iff basis == FIXED; FeeLineItem.rate_pct required iff
      basis == PCT_OF_MONTHLY_CHARGE (0 < rate_pct < 1, at most 4 decimals); a FeeLineItem with
      label_category == ONE_TIME MUST have basis == FIXED; ServicePlan.intro_term_months >= 1 whenever
      intro_price_cents is non-null; ServicePlan.required_locales non-empty;
      ServicePlan.overage_rate_cents_per_gb == 0 whenever data_allowance_gb is null;
      MethodologyDocument.peak_hours_end_utc_hour > peak_hours_start_utc_hour;
      TestRun.window_end > window_start; Complaint.measured_download_mbps required when
      allegation_type == SPEED_SHORTFALL and Complaint.measured_latency_ms required when
      allegation_type == LATENCY_SHORTFALL; Complaint resolve carries credit_basis iff finding == UPHELD;
      RegulatorInquiry.response_due_at strictly after the logical clock; LabelVersion.effective_until
      is null or strictly after effective_from; pagination limit in [1, 100] and offset >= 0.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 30
    category: existence
    check: "every resource referenced by a path segment or an FK body field exists, validated left-to-right in the path and then in input declaration order for body FKs"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (see §1.6 for the twelve domain-specific ids)"
    http_status: 404
    applies_to: all

  - priority: 35
    category: auth
    check: "when the acting role is Subscriber, the target resource resolves to X-User-ID: SubscriberAccount.id == X-User-ID, or Complaint.account_id == X-User-ID, or PlanChangeNotice.account_id == X-User-ID, or LabelDisclosure.account_id == X-User-ID"
    error_id: ERR_ACCOUNT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /subscriber-accounts/{id}, GET /subscriber-accounts, GET /subscriber-accounts/{id}/label-disclosures, POST /subscriber-accounts/{id}/label-disclosures, POST /complaints, GET /complaints/{id}, GET /complaints, POST /complaints/{id}/withdraw, GET /complaints/{id}/remediation-credits, GET /plan-change-notices/{id}, GET /plan-change-notices, POST /plan-change-notices/{id}/acknowledge"

  - priority: 40
    category: state
    check: "the target resource satisfies the from-state and idempotency preconditions of the §1.2 transition the endpoint triggers"
    error_id: "ERR_LABEL_INVALID_STATE | ERR_ATTESTATION_INVALID_STATE | ERR_TEST_RUN_ALREADY_INVALIDATED | ERR_METHODOLOGY_ALREADY_PUBLISHED | ERR_TRANSLATION_INVALID_STATE | ERR_COMPLAINT_INVALID_STATE | ERR_CREDIT_ALREADY_VOIDED | ERR_INQUIRY_INVALID_STATE | ERR_INQUIRY_FILINGS_INCOMPLETE | ERR_NOTICE_INVALID_STATE | ERR_ACCOUNT_CHANGE_ALREADY_PENDING"
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 42
    category: state
    check: "expected_plan_version in the request body equals the current ServicePlan.version of the referenced plan (see §1.2.1)"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /performance-attestations, POST /label-versions"

  - priority: 45
    category: auth
    check: "segregation of duties by X-User-ID inequality: the publisher of a LabelVersion is not its created_by_user_id, and the verifier of a LabelTranslation is not its created_by_user_id"
    error_id: "ERR_SOD_SELF_PUBLISH | ERR_SOD_SELF_REVIEW"
    http_status: 403
    applies_to: "POST /label-versions/{id}/publish, POST /label-versions/{id}/translations/{translationId}/verify"

  - priority: 50
    category: business_safety
    check: "the plan's label_posture permits the operation — FROZEN blocks every LabelDisclosure and every PlanChangeNotice; RESTRICTED blocks channel == POINT_OF_SALE and notice_type == PRICE_INCREASE"
    error_id: "ERR_PLAN_POSTURE_FROZEN | ERR_PLAN_POSTURE_RESTRICTED"
    http_status: 409
    applies_to: "POST /subscriber-accounts/{id}/label-disclosures, POST /plan-change-notices"

  - priority: 52
    category: business_safety
    check: "accessibility accommodation is honored — when SubscriberAccount.accessibility_need == SCREEN_READER the disclosure's accessible_format MUST be SCREEN_READER, when LARGE_PRINT it MUST be LARGE_PRINT; a non-STANDARD_WEB format additionally requires the selected LabelVersion.accessibility_conformance == WCAG_AA; publishing a label requires accessibility_conformance == WCAG_AA"
    error_id: ERR_ACCESSIBILITY_FORMAT_UNSUPPORTED
    http_status: 422
    applies_to: "POST /subscriber-accounts/{id}/label-disclosures, POST /label-versions/{id}/publish"

  - priority: 55
    category: business_temporal
    check: "temporal admissibility of the request against the logical clock and neighbouring rows — TestRun.window_end <= logical clock (measurement cannot be claimed for the future); PlanChangeNotice.effective_date at least NOTICE_MIN_DAYS whole days after the clock; a new LabelVersion.effective_from strictly after the effective_from of the plan's PUBLISHED label; POST /plan-change-notices/{id}/effect only once the clock reaches effective_date"
    error_id: "ERR_MEASUREMENT_WINDOW_FUTURE | ERR_NOTICE_PERIOD_TOO_SHORT | ERR_LABEL_EFFECTIVE_NOT_AFTER_PUBLISHED | ERR_NOTICE_NOT_DUE"
    http_status: 422
    applies_to: "POST /test-runs, POST /label-versions, POST /plan-change-notices, POST /plan-change-notices/{id}/effect"

  - priority: 58
    category: business_constraint
    check: "uniqueness — ServicePlan.plan_code, MethodologyDocument.doc_code, MeasurementProbe.probe_code, SubscriberAccount.account_code, RegulatorInquiry.docket_number globally; FeeLineItem (plan_id, fee_code) and LabelTranslation (label_version_id, locale) per parent"
    error_id: "ERR_DUPLICATE_PLAN_CODE | ERR_DUPLICATE_DOCKET_NUMBER | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /service-plans, POST /methodology-documents, POST /measurement-probes, POST /subscriber-accounts, POST /regulator-inquiries, POST /service-plans/{id}/fee-line-items, POST /label-versions/{id}/translations"

  - priority: 60
    category: business_constraint
    check: |
      Interval geometry on the two occupied resources.
      (a) LabelVersion on its plan — half-open windows: the requested [effective_from, effective_until)
          MUST NOT overlap the window of any LabelVersion of the same plan whose publication_state == DRAFT.
          Overlap iff new.effective_from < other.effective_until AND other.effective_from < new.effective_until,
          with a null effective_until treated as +infinity. Adjacency is therefore legal:
          new.effective_from == other.effective_until does NOT overlap. → ERR_LABEL_WINDOW_OVERLAP (409)
      (b) MeasurementProbe on its runs — closed windows with a trailing cooldown buffer: count the
          TestRun rows with the same probe_id and status == INCLUDED whose buffered closed interval
          [window_start, window_end + PROBE_COOLDOWN_MINUTES minutes] intersects the requested closed
          interval [window_start, window_end]; intersection iff new.window_start <= other.window_end +
          buffer AND other.window_start <= new.window_end. Reject when that count >=
          MeasurementProbe.max_concurrent_windows. → ERR_PROBE_COOLDOWN_CONFLICT (409)
      (c) TestRun shape: (window_end - window_start) <= MethodologyDocument.max_run_duration_days days
          → ERR_RUN_DURATION_EXCEEDED (422); every sample's observed_at within the closed window
          → ERR_SAMPLE_OUTSIDE_WINDOW (422)
    error_id: "ERR_LABEL_WINDOW_OVERLAP | ERR_PROBE_COOLDOWN_CONFLICT | ERR_RUN_DURATION_EXCEEDED | ERR_SAMPLE_OUTSIDE_WINDOW"
    http_status: 409
    applies_to: "POST /label-versions, POST /test-runs"

  - priority: 62
    category: business_constraint
    check: "evidence sufficiency — POST /performance-attestations needs a non-empty variant pool (ERR_NO_ELIGIBLE_TEST_RUNS); POST /performance-attestations/{id}/certify needs pooled_sample_count >= methodology_snapshot.min_samples_required (ERR_INSUFFICIENT_SAMPLES), evaluated with an inclusive >= boundary"
    error_id: "ERR_NO_ELIGIBLE_TEST_RUNS | ERR_INSUFFICIENT_SAMPLES"
    http_status: 409
    applies_to: "POST /performance-attestations, POST /performance-attestations/{id}/certify"

  - priority: 70
    category: business_referential
    check: |
      Cross-entity referential prerequisites:
      MethodologyDocument.status == PUBLISHED for POST /test-runs and POST /performance-attestations
        (ERR_METHODOLOGY_NOT_PUBLISHED);
      a CERTIFIED PerformanceAttestation exists for the plan on publish (ERR_ATTESTATION_NOT_CERTIFIED);
      every ServicePlan.required_locales entry has a VERIFIED LabelTranslation on publish
        (ERR_TRANSLATION_COVERAGE_INCOMPLETE);
      every MONTHLY_RECURRING FeeLineItem of the plan appears in fee_itemization on publish
        (ERR_FEE_ITEMIZATION_INCOMPLETE);
      the requested disclosure locale has a VERIFIED LabelTranslation on the selected label
        (ERR_TRANSLATION_NOT_AVAILABLE);
      a PUBLISHED LabelVersion covers the logical clock for the account's plan
        (ERR_LABEL_NOT_EFFECTIVE_FOR_SERVICE_DATE);
      Complaint.disputed_label_version_id names a label whose display window covers
        service_observed_date and whose typical_* fields are non-null (ERR_LABEL_INVALID_STATE);
      the RESOLUTION_REPORT filing requires Complaint.state IN {UPHELD, DISMISSED, WITHDRAWN}
        (ERR_COMPLAINT_NOT_TERMINAL);
      the TECHNICAL_PACKET filing requires the disputed LabelVersion.attestation_id to be non-null
        AND its substantiation_status == SUBSTANTIATED (ERR_LABEL_NOT_SUBSTANTIATED_FOR_FILING)
    error_id: "ERR_METHODOLOGY_NOT_PUBLISHED | ERR_ATTESTATION_NOT_CERTIFIED | ERR_TRANSLATION_COVERAGE_INCOMPLETE | ERR_FEE_ITEMIZATION_INCOMPLETE | ERR_TRANSLATION_NOT_AVAILABLE | ERR_LABEL_NOT_EFFECTIVE_FOR_SERVICE_DATE | ERR_LABEL_INVALID_STATE | ERR_COMPLAINT_NOT_TERMINAL | ERR_LABEL_NOT_SUBSTANTIATED_FOR_FILING"
    http_status: 409
    applies_to: "POST /test-runs, POST /performance-attestations, POST /label-versions/{id}/publish, POST /subscriber-accounts/{id}/label-disclosures, POST /complaints, POST /regulator-inquiries/{id}/filings"

  - priority: 75
    category: business_fiscal
    check: "a complaint may only be upheld when its assessed severity is not NONE, so no credit is ever issued against a zero shortfall"
    error_id: ERR_SHORTFALL_NOT_SUBSTANTIATED
    http_status: 422
    applies_to: "POST /complaints/{id}/resolve"

  - priority: 78
    category: business_safety
    check: "an attestation may only be certified when download_margin_pct >= SUBSTANTIATION_MIN_MARGIN AND upload_margin_pct >= SUBSTANTIATION_MIN_MARGIN (0.80), inclusive boundary"
    error_id: ERR_SUBSTANTIATION_MARGIN_NOT_MET
    http_status: 422
    applies_to: "POST /performance-attestations/{id}/certify"

  - priority: 80
    category: business_constraint
    check: "reopen admissibility — floor((logical clock - resolved_at) / 86400 seconds) <= REOPEN_WINDOW_DAYS (30, inclusive) and reopened_count < MAX_REOPENS (2)"
    error_id: ERR_REOPEN_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /complaints/{id}/reopen"

validation_constants:
  SUBSTANTIATION_MIN_MARGIN: 0.80
  PROBE_COOLDOWN_MINUTES: 60
  NOTICE_MIN_DAYS: 30
  COMPLAINT_SLA_DAYS: 30
  REOPEN_WINDOW_DAYS: 30
  MAX_REOPENS: 2

# =============================================================================
# §1.5 API Endpoint Table  (52 endpoints, flat topology, api_prefix "")
# =============================================================================

endpoints:

  # ---- test-driving clock -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every temporal rule in this scaffold reads. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["repositions the logical clock; no entity is mutated"]

  # ---- ServicePlan ---------------------------------------------------------
  - method: POST
    path: "/service-plans"
    description: "Creates a service plan whose disclosed prices, allowances and locales drive every label."
    roles: [ComplianceOfficer]
    code: 201
    input: [plan_code, display_name, technology, advertised_download_mbps, advertised_upload_mbps, monthly_price_cents, early_termination_fee_cents, required_locales, "intro_price_cents?", "intro_term_months?", "data_allowance_gb?", "overage_rate_cents_per_gb?", "etf_proration_policy?", "discount_program_eligible?"]
    output: ServicePlan
    side_effects: ["initialises label_posture = RESTRICTED, evidence_sample_total = 0, upheld_complaint_count = 0, price_disclosure_drift = false, active_label_version_id = null, version = 1"]

  - method: GET
    path: "/service-plans/{id}"
    description: "Reads one service plan, including its current version for optimistic-concurrency writes."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []

  - method: PATCH
    path: "/service-plans/{id}"
    description: "Amends disclosed plan attributes; changing a price field marks the plan's published label as drifted."
    roles: [ComplianceOfficer]
    code: 200
    input: [change_justification, "monthly_price_cents?", "intro_price_cents?", "intro_term_months?", "data_allowance_gb?", "overage_rate_cents_per_gb?", "early_termination_fee_cents?", "etf_proration_policy?", "required_locales?"]
    output: ServicePlan
    side_effects:
      - "when any of monthly_price_cents, intro_price_cents, intro_term_months, early_termination_fee_cents changes: sets price_disclosure_drift = true on the plan and on its PUBLISHED LabelVersion, and sets last_price_change_at = logical clock"
      - "recomputes calculations.label_monthly_itemization, calculations.discount_program_benefit and calculations.first_year_total_disclosure for every LabelVersion of the plan with publication_state == DRAFT; PUBLISHED, ARCHIVED and WITHDRAWN labels keep their pinned figures"
      - "recomputes calculations.plan_label_posture; increments ServicePlan.version by 1"

  - method: POST
    path: "/service-plans/{id}/fee-line-items"
    description: "Adds an itemized fee line to a plan's label fee block."
    roles: [ComplianceOfficer]
    code: 201
    input: [fee_code, description, label_category, basis, "amount_cents?", "rate_pct?", "applies_during?", "is_regulatory_recovery?"]
    output: FeeLineItem
    side_effects:
      - "recomputes calculations.label_monthly_itemization, calculations.discount_program_benefit and calculations.first_year_total_disclosure for every LabelVersion of the plan with publication_state == DRAFT"

  - method: GET
    path: "/service-plans/{id}/fee-line-items"
    description: "Lists a plan's fee line items in created_at ASC order — the same order the label itemization uses."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: ["label_category?", "limit?", "offset?"]
    output: FeeLineItem[]
    side_effects: []

  # ---- MethodologyDocument -------------------------------------------------
  - method: POST
    path: "/methodology-documents"
    description: "Drafts a test methodology document defining peak hours, minimum samples and maximum run duration."
    roles: [NetworkEngineer]
    code: 201
    input: [doc_code, version_label, methodology_url, peak_hours_start_utc_hour, peak_hours_end_utc_hour, min_samples_required, max_run_duration_days]
    output: MethodologyDocument
    side_effects: ["initialises status = DRAFT, published_at = null"]

  - method: GET
    path: "/methodology-documents/{id}"
    description: "Reads one methodology document."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: []
    output: MethodologyDocument
    side_effects: []

  - method: POST
    path: "/methodology-documents/{id}/publish"
    description: "Publishes a methodology document so measurement may cite it."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MethodologyDocument
    side_effects: ["drives state_machines.MethodologyDocument.DRAFT_to_PUBLISHED; sets published_at = logical clock"]

  # ---- MeasurementProbe ----------------------------------------------------
  - method: POST
    path: "/measurement-probes"
    description: "Registers a measurement probe panel with its aggregate window capacity."
    roles: [NetworkEngineer]
    code: 201
    input: [probe_code, market_code, panel_size, max_concurrent_windows]
    output: MeasurementProbe
    side_effects: []

  - method: GET
    path: "/measurement-probes/{id}"
    description: "Reads one measurement probe."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: []
    output: MeasurementProbe
    side_effects: []

  # ---- TestRun -------------------------------------------------------------
  - method: POST
    path: "/test-runs"
    description: "Records a completed measurement window and its samples against a plan."
    roles: [NetworkEngineer]
    code: 201
    input: [probe_id, plan_id, methodology_doc_id, window_start, window_end, samples]
    output: TestRun
    side_effects:
      - "sets sample_count = len(samples), status = INCLUDED"
      - "recomputes ServicePlan.evidence_sample_total = sum of TestRun.sample_count over rows with this plan_id and status == INCLUDED; increments ServicePlan.version by 1"

  - method: GET
    path: "/test-runs/{id}"
    description: "Reads one measurement run, including its samples and inclusion status."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: []
    output: TestRun
    side_effects: []

  - method: GET
    path: "/test-runs"
    description: "Lists measurement runs filtered by probe, plan, methodology document or inclusion status."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: ["probe_id?", "plan_id?", "methodology_doc_id?", "status?", "limit?", "offset?"]
    output: TestRun[]
    side_effects: []

  - method: POST
    path: "/test-runs/{id}/invalidate"
    description: "Withdraws a measurement run from the evidence pool, triggering the five-hop substantiation cascade."
    roles: [NetworkEngineer]
    code: 200
    input: [reason]
    output: TestRun
    side_effects:
      - "drives state_machines.TestRun.INCLUDED_to_INVALIDATED and its five declared cascade hops"
      - "recomputes ServicePlan.evidence_sample_total; may REVOKE attestations, flip LabelVersion.substantiation_status to UNSUBSTANTIATED, set Complaint.evidence_gap = true, and recompute calculations.plan_label_posture; increments ServicePlan.version by 1"

  # ---- PerformanceAttestation ---------------------------------------------
  - method: POST
    path: "/performance-attestations"
    description: "Computes a typical-speed attestation from the plan's INCLUDED runs under one of the two documented metric variants. Requires expected_plan_version (see §1.2.1 attestation-create-stale-plan)."
    roles: [NetworkEngineer]
    code: 201
    input: [plan_id, methodology_doc_id, metric_variant, expected_plan_version]
    output: PerformanceAttestation
    side_effects:
      - "runs calculations.typical_speed_metrics for metric_variant; writes included_run_ids, pooled_sample_count, typical_download_mbps, typical_upload_mbps, typical_latency_ms, download_margin_pct, upload_margin_pct"
      - "pins methodology_snapshot from the referenced MethodologyDocument"
      - "drives state_machines.PerformanceAttestation.CERTIFIED_to_SUPERSEDED on the plan's existing CERTIFIED attestation, if any"
      - "increments ServicePlan.version by 1"

  - method: POST
    path: "/performance-attestations/{id}/certify"
    description: "Certifies an attestation so labels may cite its typical speeds; enforces the sample-count and margin gates."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PerformanceAttestation
    side_effects:
      - "drives state_machines.PerformanceAttestation.DRAFT_to_CERTIFIED"
      - "when the plan has a PUBLISHED LabelVersion whose substantiation_status == UNSUBSTANTIATED, re-pins that label's attestation_id and typical_* values and drives state_machines.LabelVersion.UNSUBSTANTIATED_to_SUBSTANTIATED, then recomputes calculations.plan_label_posture; increments ServicePlan.version by 1"

  - method: GET
    path: "/performance-attestations/{id}"
    description: "Reads one attestation, including its pooled sample count and margins."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: []
    output: PerformanceAttestation
    side_effects: []

  - method: GET
    path: "/performance-attestations"
    description: "Lists attestations filtered by plan, methodology document or status."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: ["plan_id?", "methodology_doc_id?", "status?", "limit?", "offset?"]
    output: PerformanceAttestation[]
    side_effects: []

  # ---- LabelVersion --------------------------------------------------------
  - method: POST
    path: "/label-versions"
    description: "Drafts a consumer label for a plan, computing the full itemization and both first-year variants. Requires expected_plan_version (see §1.2.1 label-version-create-stale-plan)."
    roles: [ComplianceOfficer]
    code: 201
    input: [plan_id, effective_from, accessibility_conformance, expected_plan_version, "effective_until?", "discount_program_applied?"]
    output: LabelVersion
    side_effects:
      - "sets version_seq = max(version_seq over the plan's LabelVersion rows) + 1, publication_state = DRAFT, substantiation_status = PENDING_EVIDENCE, created_by_user_id = X-User-ID"
      - "defaults discount_program_applied to ServicePlan.discount_program_eligible when omitted"
      - "runs calculations.label_monthly_itemization, calculations.discount_program_benefit and calculations.first_year_total_disclosure; snapshots etf_disclosure_cents, data_allowance_gb_snapshot and overage_rate_cents_per_gb_snapshot"
      - "increments ServicePlan.version by 1"

  - method: GET
    path: "/label-versions/{id}"
    description: "Reads one label version — the archival read path for historical labels."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: []
    output: LabelVersion
    side_effects: []

  - method: GET
    path: "/label-versions"
    description: "Lists label versions filtered by plan, pinned attestation, publication state or a date the display window must cover."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: ["plan_id?", "attestation_id?", "publication_state?", "effective_on?", "limit?", "offset?"]
    output: LabelVersion[]
    side_effects: []

  - method: POST
    path: "/label-versions/{id}/publish"
    description: "Publishes a drafted label, archiving its predecessor and pinning the certified typical speeds. Maker-checker: the publisher must differ from the drafter."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LabelVersion
    side_effects:
      - "drives state_machines.LabelVersion.DRAFT_to_PUBLISHED and state_machines.LabelVersion.PENDING_EVIDENCE_to_SUBSTANTIATED"
      - "archives the predecessor PUBLISHED label and truncates its effective_until"
      - "clears Complaint.evidence_gap on the plan's non-terminal complaints; recomputes calculations.plan_label_posture; increments ServicePlan.version by 1"

  - method: POST
    path: "/label-versions/{id}/withdraw"
    description: "Withdraws a published label and restores its most recent archived predecessor."
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: LabelVersion
    side_effects:
      - "drives state_machines.LabelVersion.PUBLISHED_to_WITHDRAWN and the declared compensation that restores the predecessor's publication_state and effective_until"
      - "recomputes calculations.plan_label_posture; increments ServicePlan.version by 1"

  - method: POST
    path: "/label-versions/{id}/translations"
    description: "Adds a locale translation of a drafted label's disclosure content."
    roles: [LocalizationSpecialist]
    code: 201
    input: [locale, translated_summary, "machine_translated?"]
    output: LabelTranslation
    side_effects: ["sets status = DRAFT, created_by_user_id = X-User-ID; increments LabelVersion.version by 1"]

  - method: GET
    path: "/label-versions/{id}/translations"
    description: "Lists a label's translations and their verification status."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: ["locale?", "status?", "limit?", "offset?"]
    output: LabelTranslation[]
    side_effects: []

  - method: POST
    path: "/label-versions/{id}/translations/{translationId}/verify"
    description: "Verifies a translation. Maker-checker: the verifier must differ from the author."
    roles: [LocalizationSpecialist]
    code: 200
    input: []
    output: LabelTranslation
    side_effects: ["drives state_machines.LabelTranslation.DRAFT_to_VERIFIED; increments LabelVersion.verified_locale_count by 1"]

  - method: GET
    path: "/label-versions/{id}/disclosures"
    description: "Lists the disclosure events recorded against one label version, for archival and regulator evidence."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: ["channel?", "limit?", "offset?"]
    output: LabelDisclosure[]
    side_effects: []

  # ---- SubscriberAccount / LabelDisclosure --------------------------------
  - method: POST
    path: "/subscriber-accounts"
    description: "Enrols a subscriber on a plan."
    roles: [RetailAgent]
    code: 201
    input: [account_code, plan_id, preferred_locale, service_start_date, "accessibility_need?", "discount_program_enrolled?"]
    output: SubscriberAccount
    side_effects: ["initialises subscription_state = ACTIVE, credit_balance_cents = 0, remediation_count = 0, audit_flag = false, last_disclosed_label_version_id = null; runs calculations.account_pricing_phase"]

  - method: GET
    path: "/subscriber-accounts/{id}"
    description: "Reads one subscriber account. A Subscriber may read only the account whose id equals X-User-ID."
    roles: [ComplianceOfficer, NetworkEngineer, LocalizationSpecialist, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: []
    output: SubscriberAccount
    side_effects: []

  - method: GET
    path: "/subscriber-accounts"
    description: "Lists subscriber accounts filtered by plan or subscription state."
    roles: [ComplianceOfficer, ComplaintAnalyst, RegulatoryLiaison, RetailAgent]
    code: 200
    input: ["plan_id?", "subscription_state?", "limit?", "offset?"]
    output: SubscriberAccount[]
    side_effects: []

  - method: POST
    path: "/subscriber-accounts/{id}/label-disclosures"
    description: "Records that the label in effect was displayed to the subscriber at the point of sale or in the account portal; the label version is selected by the server."
    roles: [RetailAgent, Subscriber]
    code: 201
    input: [channel, locale, accessible_format]
    output: LabelDisclosure
    side_effects:
      - "runs calculations.effective_label_selection to set label_version_id, disclosed_label_version_seq and disclosed_net_monthly_cents"
      - "sets disclosed_by_user_id = X-User-ID and SubscriberAccount.last_disclosed_label_version_id = the selected label id"

  - method: GET
    path: "/subscriber-accounts/{id}/label-disclosures"
    description: "Lists an account's disclosure history, including disclosures of labels since archived."
    roles: [ComplianceOfficer, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: ["channel?", "limit?", "offset?"]
    output: LabelDisclosure[]
    side_effects: []

  # ---- Complaint -----------------------------------------------------------
  - method: POST
    path: "/complaints"
    description: "Intakes a consumer complaint alleging that a published label's claims were not met."
    roles: [Subscriber, ComplaintAnalyst]
    code: 201
    input: [account_id, disputed_label_version_id, allegation_type, service_observed_date, affected_days, narrative, "measured_download_mbps?", "measured_upload_mbps?", "measured_latency_ms?"]
    output: Complaint
    side_effects: ["initialises state = INTAKE, resolution = NONE, severity = NONE, shortfall_ratio = null, reopened_count = 0, investigation_cycles = 0, evidence_gap = false, remediation_credit_cents = 0"]

  - method: GET
    path: "/complaints/{id}"
    description: "Reads one complaint, including its assessed shortfall and severity."
    roles: [ComplianceOfficer, NetworkEngineer, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/complaints"
    description: "Lists complaints filtered by account, disputed label or state."
    roles: [ComplianceOfficer, NetworkEngineer, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: ["account_id?", "disputed_label_version_id?", "state?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/complaints/{id}/triage"
    description: "Triages an intaken complaint and starts its response clock."
    roles: [ComplaintAnalyst]
    code: 200
    input: [priority_note]
    output: Complaint
    side_effects: ["drives state_machines.Complaint.INTAKE_to_TRIAGED; sets triaged_at and sla_due_at"]

  - method: POST
    path: "/complaints/{id}/investigate"
    description: "Opens or resumes the investigation, (re)computing the shortfall assessment."
    roles: [ComplaintAnalyst]
    code: 200
    input: []
    output: Complaint
    side_effects: ["drives state_machines.Complaint.TRIAGED_to_UNDER_INVESTIGATION or INFO_REQUESTED_to_UNDER_INVESTIGATION; runs calculations.complaint_shortfall_assessment; increments investigation_cycles on the INFO_REQUESTED origin"]

  - method: POST
    path: "/complaints/{id}/request-info"
    description: "Pauses the investigation pending information from the subscriber."
    roles: [ComplaintAnalyst]
    code: 200
    input: [info_request_note]
    output: Complaint
    side_effects: ["drives state_machines.Complaint.UNDER_INVESTIGATION_to_INFO_REQUESTED"]

  - method: POST
    path: "/complaints/{id}/resolve"
    description: "Resolves the complaint as upheld (issuing a remediation credit) or dismissed."
    roles: [ComplaintAnalyst]
    code: 200
    input: [finding, resolution_note, "credit_basis?"]
    output: Complaint
    side_effects:
      - "drives state_machines.Complaint.UNDER_INVESTIGATION_to_UPHELD or UNDER_INVESTIGATION_to_DISMISSED"
      - "on UPHELD: runs calculations.remediation_credit_amount, creates a RemediationCredit, recomputes SubscriberAccount.credit_balance_cents / remediation_count / audit_flag, increments ServicePlan.upheld_complaint_count and recomputes calculations.plan_label_posture"

  - method: POST
    path: "/complaints/{id}/reopen"
    description: "Reopens a dismissed complaint within the reopen window."
    roles: [ComplaintAnalyst]
    code: 200
    input: [reopen_reason]
    output: Complaint
    side_effects: ["drives state_machines.Complaint.DISMISSED_to_UNDER_INVESTIGATION; increments reopened_count; clears resolved_at, resolution and resolution_note"]

  - method: POST
    path: "/complaints/{id}/withdraw"
    description: "Lets the complaining subscriber withdraw the complaint from any non-terminal state."
    roles: [Subscriber]
    code: 200
    input: [withdraw_reason]
    output: Complaint
    side_effects: ["drives the four state_machines.Complaint.*_to_WITHDRAWN transitions; sets resolution = WITHDRAWN and resolved_at"]

  # ---- RemediationCredit ---------------------------------------------------
  - method: GET
    path: "/complaints/{id}/remediation-credits"
    description: "Lists the remediation credits issued for one complaint."
    roles: [ComplianceOfficer, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RemediationCredit[]
    side_effects: []

  - method: GET
    path: "/remediation-credits/{id}"
    description: "Reads one remediation credit."
    roles: [ComplianceOfficer, ComplaintAnalyst, RegulatoryLiaison, RetailAgent]
    code: 200
    input: []
    output: RemediationCredit
    side_effects: []

  - method: POST
    path: "/remediation-credits/{id}/void"
    description: "Voids an issued credit and reverses its effect on the account's balance."
    roles: [ComplianceOfficer]
    code: 200
    input: [void_reason]
    output: RemediationCredit
    side_effects: ["drives state_machines.RemediationCredit.ISSUED_to_VOIDED and its declared compensation; recomputes SubscriberAccount.credit_balance_cents, remediation_count and audit_flag; zeroes Complaint.remediation_credit_cents"]

  # ---- RegulatorInquiry ----------------------------------------------------
  - method: POST
    path: "/regulator-inquiries"
    description: "Opens a regulator docket against a consumer complaint."
    roles: [RegulatoryLiaison]
    code: 201
    input: [complaint_id, docket_number, regulator_code, response_due_at]
    output: RegulatorInquiry
    side_effects: ["initialises state = RECEIVED, filed_late = false, both filing timestamps null"]

  - method: GET
    path: "/regulator-inquiries/{id}"
    description: "Reads one regulator docket and its filing timestamps."
    roles: [ComplianceOfficer, NetworkEngineer, ComplaintAnalyst, RegulatoryLiaison]
    code: 200
    input: []
    output: RegulatorInquiry
    side_effects: []

  - method: GET
    path: "/regulator-inquiries"
    description: "Lists regulator dockets filtered by complaint or state."
    roles: [ComplianceOfficer, NetworkEngineer, ComplaintAnalyst, RegulatoryLiaison]
    code: 200
    input: ["complaint_id?", "state?", "limit?", "offset?"]
    output: RegulatorInquiry[]
    side_effects: []

  - method: POST
    path: "/regulator-inquiries/{id}/filings"
    description: "Files one of the two required responses — the technical evidence packet or the resolution report; the second filing joins the docket into RESPONSE_COMPLETE."
    roles: [RegulatoryLiaison]
    code: 200
    input: [filing_type, evidence_ref, summary]
    output: RegulatorInquiry
    side_effects: ["drives the RECEIVED_to_EVIDENCE_ASSEMBLY branch transitions and the EVIDENCE_ASSEMBLY_to_RESPONSE_COMPLETE join; sets the branch's ref and timestamp and, on the join, filed_late"]

  - method: POST
    path: "/regulator-inquiries/{id}/close"
    description: "Closes a docket whose two filings are on record."
    roles: [RegulatoryLiaison]
    code: 200
    input: [closure_note]
    output: RegulatorInquiry
    side_effects: ["drives state_machines.RegulatorInquiry.RESPONSE_COMPLETE_to_CLOSED"]

  # ---- PlanChangeNotice ----------------------------------------------------
  - method: POST
    path: "/plan-change-notices"
    description: "Sends a plan-change or price-increase notice disclosing the new net monthly charge and the early termination fee owed on the plan being left."
    roles: [RetailAgent]
    code: 201
    input: [account_id, target_plan_id, notice_type, effective_date, reason]
    output: PlanChangeNotice
    side_effects:
      - "computes notice_days, runs calculations.etf_disclosure_amount, copies the target plan's PUBLISHED label net_monthly_post_promo_cents into disclosed_net_monthly_cents, records source_plan_id"
      - "drives state_machines.SubscriberAccount.ACTIVE_to_PENDING_CHANGE"

  - method: GET
    path: "/plan-change-notices/{id}"
    description: "Reads one notice, including its disclosed early termination fee."
    roles: [ComplianceOfficer, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: []
    output: PlanChangeNotice
    side_effects: []

  - method: GET
    path: "/plan-change-notices"
    description: "Lists notices filtered by account, target plan or state."
    roles: [ComplianceOfficer, ComplaintAnalyst, RegulatoryLiaison, RetailAgent, Subscriber]
    code: 200
    input: ["account_id?", "target_plan_id?", "state?", "limit?", "offset?"]
    output: PlanChangeNotice[]
    side_effects: []

  - method: POST
    path: "/plan-change-notices/{id}/acknowledge"
    description: "Records the subscriber's acknowledgement of the notice."
    roles: [Subscriber]
    code: 200
    input: []
    output: PlanChangeNotice
    side_effects: ["drives state_machines.PlanChangeNotice.SENT_to_ACKNOWLEDGED"]

  - method: POST
    path: "/plan-change-notices/{id}/effect"
    description: "Applies an acknowledged notice once its effective date has arrived."
    roles: [RetailAgent]
    code: 200
    input: []
    output: PlanChangeNotice
    side_effects: ["drives state_machines.PlanChangeNotice.ACKNOWLEDGED_to_EFFECTED and state_machines.SubscriberAccount.PENDING_CHANGE_to_ACTIVE; moves plan_id on a PLAN_CHANGE notice and recomputes calculations.account_pricing_phase"]

# =============================================================================
# §1.6 Error Code Catalog  (56 codes, every one triggerable)
# =============================================================================

errors:

  # ---- auth / envelope -----------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "request body fails the priority-20 schema and conditional-field checks, or a uniqueness constraint on FeeLineItem (plan_id, fee_code) / LabelTranslation (label_version_id, locale) / MethodologyDocument.doc_code / MeasurementProbe.probe_code / SubscriberAccount.account_code is violated"
  - id: ERR_ACCOUNT_SCOPE_VIOLATION
    http: 403
    condition: "a Subscriber targets a SubscriberAccount, Complaint, LabelDisclosure or PlanChangeNotice whose account_id is not X-User-ID"
  - id: ERR_SOD_SELF_PUBLISH
    http: 403
    condition: "the X-User-ID publishing a LabelVersion equals its created_by_user_id"
  - id: ERR_SOD_SELF_REVIEW
    http: 403
    condition: "the X-User-ID verifying a LabelTranslation equals its created_by_user_id"
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_version does not equal the referenced ServicePlan.version (see §1.2.1)"

  # ---- existence -----------------------------------------------------------
  - id: ERR_SERVICE_PLAN_NOT_FOUND
    http: 404
    condition: "no ServicePlan with the given id (path segment or plan_id / target_plan_id body field)"
  - id: ERR_METHODOLOGY_DOCUMENT_NOT_FOUND
    http: 404
    condition: "no MethodologyDocument with the given id"
  - id: ERR_MEASUREMENT_PROBE_NOT_FOUND
    http: 404
    condition: "no MeasurementProbe with the given probe_id"
  - id: ERR_TEST_RUN_NOT_FOUND
    http: 404
    condition: "no TestRun with the given id"
  - id: ERR_ATTESTATION_NOT_FOUND
    http: 404
    condition: "no PerformanceAttestation with the given id"
  - id: ERR_LABEL_VERSION_NOT_FOUND
    http: 404
    condition: "no LabelVersion with the given id (path segment or disputed_label_version_id body field)"
  - id: ERR_TRANSLATION_NOT_FOUND
    http: 404
    condition: "no LabelTranslation with the given translationId under the named label version"
  - id: ERR_SUBSCRIBER_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no SubscriberAccount with the given id (path segment or account_id body field)"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "no Complaint with the given id (path segment or complaint_id body field)"
  - id: ERR_REMEDIATION_CREDIT_NOT_FOUND
    http: 404
    condition: "no RemediationCredit with the given id"
  - id: ERR_REGULATOR_INQUIRY_NOT_FOUND
    http: 404
    condition: "no RegulatorInquiry with the given id"
  - id: ERR_PLAN_CHANGE_NOTICE_NOT_FOUND
    http: 404
    condition: "no PlanChangeNotice with the given id"

  # ---- state ---------------------------------------------------------------
  - id: ERR_LABEL_INVALID_STATE
    http: 409
    condition: "publish attempted on a LabelVersion whose publication_state != DRAFT, withdraw attempted on one whose publication_state != PUBLISHED, a translation added or verified under a label whose publication_state != DRAFT, or a complaint filed against a label whose typical_* fields are null or whose display window does not cover service_observed_date"
  - id: ERR_ATTESTATION_INVALID_STATE
    http: 409
    condition: "certify attempted on a PerformanceAttestation whose status != DRAFT"
  - id: ERR_TEST_RUN_ALREADY_INVALIDATED
    http: 409
    condition: "invalidate attempted on a TestRun whose status is already INVALIDATED"
  - id: ERR_METHODOLOGY_ALREADY_PUBLISHED
    http: 409
    condition: "publish attempted on a MethodologyDocument whose status is already PUBLISHED"
  - id: ERR_TRANSLATION_INVALID_STATE
    http: 409
    condition: "verify attempted on a LabelTranslation whose status is already VERIFIED"
  - id: ERR_COMPLAINT_INVALID_STATE
    http: 409
    condition: "a complaint action is attempted from a state the §1.2 Complaint machine does not allow it from (e.g. resolve from TRIAGED, triage from TRIAGED, reopen from UPHELD, any action on a WITHDRAWN or UPHELD complaint)"
  - id: ERR_CREDIT_ALREADY_VOIDED
    http: 409
    condition: "void attempted on a RemediationCredit whose status is already VOIDED"
  - id: ERR_INQUIRY_INVALID_STATE
    http: 409
    condition: "a filing repeats a filing_type whose *_filed_at is already set, or any filing is attempted on an inquiry whose state is RESPONSE_COMPLETE or CLOSED"
  - id: ERR_INQUIRY_FILINGS_INCOMPLETE
    http: 409
    condition: "close attempted on a RegulatorInquiry whose state is RECEIVED or EVIDENCE_ASSEMBLY"
  - id: ERR_NOTICE_INVALID_STATE
    http: 409
    condition: "acknowledge attempted on a PlanChangeNotice whose state != SENT, or effect attempted on one whose state != ACKNOWLEDGED"
  - id: ERR_ACCOUNT_CHANGE_ALREADY_PENDING
    http: 409
    condition: "a PlanChangeNotice is created for a SubscriberAccount whose subscription_state is already PENDING_CHANGE"

  # ---- business: posture / accessibility ----------------------------------
  - id: ERR_PLAN_POSTURE_FROZEN
    http: 409
    condition: "a LabelDisclosure or a PlanChangeNotice is attempted while the plan's label_posture == FROZEN"
  - id: ERR_PLAN_POSTURE_RESTRICTED
    http: 409
    condition: "a POINT_OF_SALE LabelDisclosure or a PRICE_INCREASE PlanChangeNotice is attempted while the plan's label_posture == RESTRICTED"
  - id: ERR_ACCESSIBILITY_FORMAT_UNSUPPORTED
    http: 422
    condition: "the requested accessible_format does not match SubscriberAccount.accessibility_need, or a non-STANDARD_WEB format is requested against a label whose accessibility_conformance != WCAG_AA, or publish is attempted on a label whose accessibility_conformance != WCAG_AA"

  # ---- business: temporal --------------------------------------------------
  - id: ERR_MEASUREMENT_WINDOW_FUTURE
    http: 422
    condition: "TestRun.window_end is after the logical clock"
  - id: ERR_NOTICE_PERIOD_TOO_SHORT
    http: 422
    condition: "PlanChangeNotice.effective_date is fewer than NOTICE_MIN_DAYS (30) whole days after the logical clock"
  - id: ERR_LABEL_EFFECTIVE_NOT_AFTER_PUBLISHED
    http: 422
    condition: "a new LabelVersion's effective_from is not strictly after the effective_from of the plan's PUBLISHED LabelVersion"
  - id: ERR_NOTICE_NOT_DUE
    http: 422
    condition: "effect attempted on a PlanChangeNotice before the logical clock reaches its effective_date"

  # ---- business: uniqueness ------------------------------------------------
  - id: ERR_DUPLICATE_PLAN_CODE
    http: 409
    condition: "a ServicePlan already exists with the requested plan_code"
  - id: ERR_DUPLICATE_DOCKET_NUMBER
    http: 409
    condition: "a RegulatorInquiry already exists with the requested docket_number"

  # ---- business: interval geometry ----------------------------------------
  - id: ERR_LABEL_WINDOW_OVERLAP
    http: 409
    condition: "the requested half-open [effective_from, effective_until) window overlaps that of another DRAFT LabelVersion of the same plan; exact adjacency (new.effective_from == other.effective_until) does not overlap"
  - id: ERR_PROBE_COOLDOWN_CONFLICT
    http: 409
    condition: "the count of INCLUDED TestRun rows on the probe whose buffered interval [window_start, window_end + 60 minutes] intersects the requested closed window reaches MeasurementProbe.max_concurrent_windows"
  - id: ERR_RUN_DURATION_EXCEEDED
    http: 422
    condition: "window_end - window_start exceeds MethodologyDocument.max_run_duration_days days"
  - id: ERR_SAMPLE_OUTSIDE_WINDOW
    http: 422
    condition: "a sample's observed_at falls outside the closed [window_start, window_end] interval"

  # ---- business: evidence sufficiency ------------------------------------
  - id: ERR_NO_ELIGIBLE_TEST_RUNS
    http: 409
    condition: "the metric variant's sample pool is empty — no INCLUDED TestRun for the plan under the named methodology document, or none of their samples fall in the peak-hour window"
  - id: ERR_INSUFFICIENT_SAMPLES
    http: 409
    condition: "certify attempted while pooled_sample_count < methodology_snapshot.min_samples_required"

  # ---- business: referential prerequisites -------------------------------
  - id: ERR_METHODOLOGY_NOT_PUBLISHED
    http: 409
    condition: "a TestRun or PerformanceAttestation cites a MethodologyDocument whose status is DRAFT"
  - id: ERR_ATTESTATION_NOT_CERTIFIED
    http: 409
    condition: "publish attempted while the plan has no PerformanceAttestation with status == CERTIFIED"
  - id: ERR_TRANSLATION_COVERAGE_INCOMPLETE
    http: 409
    condition: "publish attempted while some locale in ServicePlan.required_locales has no VERIFIED LabelTranslation on the label"
  - id: ERR_FEE_ITEMIZATION_INCOMPLETE
    http: 409
    condition: "publish attempted while a MONTHLY_RECURRING FeeLineItem of the plan appears in no phase of fee_itemization (e.g. an INTRO_ONLY line on a plan with no introductory price)"
  - id: ERR_TRANSLATION_NOT_AVAILABLE
    http: 409
    condition: "a LabelDisclosure requests a locale with no VERIFIED LabelTranslation on the selected label version"
  - id: ERR_LABEL_NOT_EFFECTIVE_FOR_SERVICE_DATE
    http: 409
    condition: "calculations.effective_label_selection finds no PUBLISHED LabelVersion of the account's plan whose half-open display window contains the logical clock"
  - id: ERR_COMPLAINT_NOT_TERMINAL
    http: 409
    condition: "a RESOLUTION_REPORT filing is attempted while the docket's Complaint.state is not in {UPHELD, DISMISSED, WITHDRAWN}"
  - id: ERR_LABEL_NOT_SUBSTANTIATED_FOR_FILING
    http: 409
    condition: "a TECHNICAL_PACKET filing is attempted while the disputed LabelVersion.attestation_id is null or its substantiation_status != SUBSTANTIATED (for example after cascade hop 4 of POST /test-runs/{id}/invalidate revoked the pinned attestation)"

  # ---- business: fiscal / substantiation ---------------------------------
  - id: ERR_SHORTFALL_NOT_SUBSTANTIATED
    http: 422
    condition: "resolve with finding == UPHELD attempted while Complaint.severity == NONE"
  - id: ERR_SUBSTANTIATION_MARGIN_NOT_MET
    http: 422
    condition: "certify attempted while download_margin_pct < 0.80 or upload_margin_pct < 0.80"
  - id: ERR_REOPEN_WINDOW_EXPIRED
    http: 409
    condition: "reopen attempted more than REOPEN_WINDOW_DAYS (30) whole days after resolved_at, or when reopened_count has already reached MAX_REOPENS (2)"

# =============================================================================
# §1.7 RBAC Matrix  (segregation of duties)
# =============================================================================

roles:

  - name: ComplianceOfficer
    description: "Owns plan and label governance: plan definition, fee itemization, methodology publication, attestation certification, label drafting/publication/withdrawal and credit voiding. Maker-checker applies — an officer may not publish a label they drafted."
    identity: opaque
    exclusive_operations:
      - "POST /service-plans"
      - "PATCH /service-plans/{id}"
      - "POST /service-plans/{id}/fee-line-items"
      - "POST /methodology-documents/{id}/publish"
      - "POST /performance-attestations/{id}/certify"
      - "POST /label-versions"
      - "POST /label-versions/{id}/publish"
      - "POST /label-versions/{id}/withdraw"
      - "POST /remediation-credits/{id}/void"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET reads except GET /complaints/{id}/remediation-credits scoping"

  - name: NetworkEngineer
    description: "Owns performance measurement: methodology authoring, probe registration, test-run recording and invalidation, and attestation computation."
    identity: opaque
    exclusive_operations:
      - "POST /methodology-documents"
      - "POST /measurement-probes"
      - "POST /test-runs"
      - "POST /test-runs/{id}/invalidate"
      - "POST /performance-attestations"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET reads on plans, methodology documents, probes, runs, attestations, labels, complaints and regulator inquiries"

  - name: LocalizationSpecialist
    description: "Owns label translation and accessibility copy. Maker-checker applies — a specialist may not verify a translation they authored."
    identity: opaque
    exclusive_operations:
      - "POST /label-versions/{id}/translations"
      - "POST /label-versions/{id}/translations/{translationId}/verify"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET reads on plans, labels, translations and disclosures"

  - name: ComplaintAnalyst
    description: "Owns the consumer complaint investigation lifecycle from triage through resolution and reopening."
    identity: opaque
    exclusive_operations:
      - "POST /complaints/{id}/triage"
      - "POST /complaints/{id}/investigate"
      - "POST /complaints/{id}/request-info"
      - "POST /complaints/{id}/resolve"
      - "POST /complaints/{id}/reopen"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /complaints (shared with Subscriber)"
      - "GET reads on plans, labels, accounts, complaints, credits and regulator inquiries"

  - name: RegulatoryLiaison
    description: "Owns regulator dockets: opening an inquiry, filing the technical evidence packet and the resolution report, and closing the docket."
    identity: opaque
    exclusive_operations:
      - "POST /regulator-inquiries"
      - "POST /regulator-inquiries/{id}/filings"
      - "POST /regulator-inquiries/{id}/close"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET reads on plans, labels, accounts, complaints, credits, disclosures and regulator inquiries"

  - name: RetailAgent
    description: "Owns the consumer-facing sales surface: subscriber enrolment, point-of-sale and portal label disclosure, and plan-change / price-increase notices."
    identity: opaque
    exclusive_operations:
      - "POST /subscriber-accounts"
      - "POST /plan-change-notices"
      - "POST /plan-change-notices/{id}/effect"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /subscriber-accounts/{id}/label-disclosures (shared with Subscriber)"
      - "GET reads on plans, labels, accounts, disclosures, complaints, credits and notices"

  - name: Subscriber
    description: "The consumer. X-User-ID is the id of the SubscriberAccount the consumer holds; every operation and read is scoped to that account by the priority-35 check."
    identity: "entity_backed:SubscriberAccount"
    exclusive_operations:
      - "POST /complaints/{id}/withdraw"
      - "POST /plan-change-notices/{id}/acknowledge"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /complaints (shared with ComplaintAnalyst)"
      - "POST /subscriber-accounts/{id}/label-disclosures (shared with RetailAgent)"
      - "GET reads scoped to the subscriber's own account, its complaints, its credits, its disclosures and its notices, plus plan and label reads"
