              captures: { a1: $.data.id }
            - call: "POST /studio/artists"
              payload: { display_name: "Other Artist", discipline: "TATTOO", hourly_rate_cents: 18000 }
              as: StudioManager
              captures: { a2: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "RB2 Chair" }
              as: StudioManager
              captures: { chid: $.data.id, chv: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "RB2 Client", email: "rb2@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /studio/clients/${cid}/id-verification"
              payload: { id_document_type: "PASSPORT" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/clients/${cid}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${a1}", client_id: "${cid}", chair_id: "${chid}", expected_chair_version: "${chv}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T13:00:00Z" }
              as: Client
              as_user_id: "${cid}"
              captures: { apid: $.data.id, apv: $.data.version }
            - call: "POST /studio/appointments/${apid}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${apv}" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/appointments/${apid}/waiver"
              payload: { client_id: "${cid}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studio/appointments/${apid}/confirm"
              payload: {}
              as: Client
              as_user_id: "${cid}"
