- rule_id: priority_pair_validation_conflict
  instances:
  - name: board_ready_resubmit_prefers_state_over_capacity_fiscal
    grounds:
    - validations[priority=44]
    - validations[priority=72]
    - errors[ERR_SCENARIO_NOT_EDITABLE]
    - errors[ERR_SCHOOL_CAPACITY_CRITICAL]
    - calculations.school_capacity_utilization
    - endpoints[PATCH /redistricting/schools/{id}]
    distinguishing_aspect: 'Category pair {state (priority 44), business_fiscal (priority 72)}: one submit-for-review call violates ERR_SCENARIO_NOT_EDITABLE and ERR_SCHOOL_CAPACITY_CRITICAL at the same time and MUST return the state error; the fiscal violation is independently demonstrable through the computed read, which reports max_utilization_pct 112.09.'
    test_recipe:
      setup:
