            - call: "POST /clients/${client_q}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Ada", last_name: "Byrd", ssn_last4: "2121", birth_year: 1985, hire_date: "2026-05-01", annual_salary_cents: 2400120, employment_type: "FULL_TIME" }
              as: ClientAdmin
              as_user_id: "${client_q}"
              captures: { emp1: $.data.id, emp1_v: $.data.version }
            - call: "POST /worksite-employees/${emp1}/onboarding-packet"
              payload: { expected_employee_version: "${emp1_v}", i9_completed: true, w4_completed: true, direct_deposit_completed: true }
              as: ClientAdmin
              as_user_id: "${client_q}"
              captures: { pkt1: $.data.id }
            - call: "POST /onboarding-packets/${pkt1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_q}"
            - call: "POST /onboarding-packets/${pkt1}/review"
              payload: { decision: "APPROVE" }
              as: PeoAdmin
            - call: "POST /clients/${client_q}/payroll-runs"
              payload: { period_start: "2026-05-01", period_end: "2026-05-15", check_date: "2026-05-20", pay_frequency: "SEMI_MONTHLY" }
              as: PayrollSpecialist
              as_user_id: "ps-1"
              captures: { run1: $.data.id }
          trigger:
            - call: "POST /clients/${client_q}/payroll-runs"
              payload: { period_start: "2026-05-15", period_end: "2026-05-31", check_date: "2026-06-05", pay_frequency: "SEMI_MONTHLY" }
              as: PayrollSpecialist
              as_user_id: "ps-1"
            - call: "POST /clients/${client_q}/payroll-runs"
              payload: { period_start: "2026-05-16", period_end: "2026-05-31", check_date: "2026-06-05", pay_frequency: "SEMI_MONTHLY" }
              as: PayrollSpecialist
              as_user_id: "ps-1"
