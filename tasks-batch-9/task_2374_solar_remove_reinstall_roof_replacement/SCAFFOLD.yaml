scenario: "2374. Solar Remove-and-Reinstall for Roof Replacement (SunSystem Technology): coordination between roofer, solar owner and third-party system owner, array de-energize, panel removal and labeled storage, roof deck condition findings and attachment/flashing upgrades, reinstall with re-permitting and re-inspection where required, production loss estimate and lease/PPA credit during downtime, damaged panel and optimizer replacement sourcing with mismatched-model rules, warranty preservation and manufacturer notification, scheduling risk from weather and inspection backlog"
domain_name: solar-reroof-coordination
api_prefix: /reroof

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat topology: every entity is a top-level collection under /reroof with
    foreign keys carried in request bodies; nothing is nested more than one
    action segment deep. HardwareUnit carries two independent state dimensions
    (handling_status x condition_grade) that evolve on separate endpoints, so
    the parallel shape is the scaffold's dominant state pattern; PartyApproval
    and PermitApplication add cycles, DeckFinding and WorkWindow add branching.
    Segregation of duties: the ROOFER Party that scopes a DeckFinding upgrade
    may never be the Party that signs its completion.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Party
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal or trade name of the party
        constraints: non-empty, max 200 chars
      - name: party_type
        type: enum
        source: input
        description: which side of the coordination triangle this party sits on
        constraints: one of ROOFER | SOLAR_OWNER | SYSTEM_OWNER | SOLAR_CONTRACTOR
      - name: contact_email
        type: string
        source: input
        description: notification address for coordination messages
        constraints: must contain '@'
      - name: mobilization_buffer_minutes
        type: integer
        source: input
        description: minutes of mobilization/demobilization time this party needs on either side of a WorkWindow; used as the symmetric buffer in crew-overlap detection
        default: 120
        constraints: 0 <= value <= 480
      - name: daily_crew_capacity
        type: integer
        source: input
        description: informational crew-count capacity per day
        default: 1
        constraints: value >= 1
      - name: license_number
        type: string
        source: input
        description: contractor license identifier; null for SOLAR_OWNER and SYSTEM_OWNER parties
        default: null

  - name: Jurisdiction
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: authority-having-jurisdiction name
        constraints: non-empty
      - name: code
        type: string
        source: input
        description: short AHJ code; globally unique
        constraints: unique across all Jurisdiction rows, uppercase alphanumeric
      - name: repermit_required_for_reinstall
        type: boolean
        source: input
        description: when true a structural DeckFinding upgrade invalidates an APPROVED PermitApplication and forces re-permitting before reinstall
      - name: reinspection_required
        type: boolean
        source: input
        description: when true the project cannot reach COMMISSIONED without a PASSED ELECTRICAL_FINAL Inspection under an APPROVED PermitApplication
      - name: inspection_slots_per_day
        type: integer
        source: input
        description: aggregate number of Inspection rows this AHJ accepts per slot_date across all permits
        constraints: value >= 1
      - name: backlog_days
        type: integer
        source: input
        description: inspection backlog; an Inspection window_start_utc must be at or after clock_now plus this many whole days
        constraints: 0 <= value <= 90
      - name: permit_review_days
        type: integer
        source: input
        description: whole days added to submitted_at to derive PermitApplication.review_deadline_utc
        constraints: value >= 1
      - name: expedite_fee_cents
        type: integer
        source: input
        description: surcharge added to PermitApplication.fee_cents when expedited is true
        default: 0
        constraints: value >= 0

  - name: ReroofProject
    parent: null
    common_fields: true
    fields:
      - name: site_address
        type: string
        source: input
        description: roof address being replaced
        constraints: non-empty
      - name: ownership_model
        type: enum
        source: input
        description: how the PV system is owned, which decides whether a downtime credit is owed and whether a SYSTEM_OWNER approval is required
        constraints: one of HOST_OWNED | LEASE | PPA
      - name: system_dc_kw
        type: number
        source: input
        description: nameplate DC capacity of the array
        constraints: value > 0
      - name: roofer_party_id
        type: string
        source: input
        description: "FK -> Party.id; must have party_type == ROOFER"
      - name: solar_owner_party_id
        type: string
        source: input
        description: "FK -> Party.id; must have party_type == SOLAR_OWNER"
      - name: system_owner_party_id
        type: string
        source: input
        description: "FK -> Party.id; must have party_type == SYSTEM_OWNER; required when ownership_model IN {LEASE, PPA}, must be null when ownership_model == HOST_OWNED"
        default: null
      - name: solar_contractor_party_id
        type: string
        source: input
        description: "FK -> Party.id; must have party_type == SOLAR_CONTRACTOR; the crew that de-energizes, removes and reinstalls"
      - name: baseline_daily_kwh
        type: number
        source: input
        description: expected daily production of the array, the basis of every production-loss credit
        constraints: value > 0
      - name: downtime_days_estimated
        type: integer
        source: input
        description: planned whole days of downtime, used only by the forward_looking provisional credit variant
        constraints: value >= 1
      - name: upgrade_budget_cents
        type: integer
        source: input
        description: cap on the sum of DeckFinding.upgrade_cost_cents the project may scope
        constraints: value >= 0
      - name: phase
        type: enum
        source: system
        description: coordination phase of the reroof; see state_machines.ReroofProject
        default: INTAKE
        constraints: one of INTAKE | APPROVALS_OPEN | AUTHORIZED | DEENERGIZED | DECK_WORK | REINSTALL | COMMISSIONED | CLOSED
      - name: posture
        type: enum
        source: computed
        description: derived gate over child state; see calculations.project_posture
        default: OPEN
        constraints: one of OPEN | RESTRICTED | FROZEN
      - name: negotiation_round
        type: integer
        source: system
        description: increments whenever a party requests changes; PartyApproval decisions from earlier rounds are void
        default: 1
      - name: required_approval_party_count
        type: integer
        source: computed
        description: 3 when system_owner_party_id is non-null, else 2; the quorum needed to reach AUTHORIZED
      - name: authorized_at
        type: datetime
        source: system
        description: logical-clock instant the project first reached AUTHORIZED
        default: null
      - name: deenergized_at
        type: datetime
        source: system
        description: logical-clock instant the last ArrayCircuit became ISOLATED
        default: null
      - name: reenergized_at
        type: datetime
        source: system
        description: logical-clock instant the last ArrayCircuit returned to ENERGIZED
        default: null
      - name: provisional_credit_cents
        type: integer
        source: computed
        description: forward_looking downtime credit reserved at de-energize; see calculations.downtime_production_loss_credit variant provisional_forward_looking
        default: 0
      - name: final_credit_cents
        type: integer
        source: computed
        description: chronological downtime credit computed at settlement; see calculations.downtime_production_loss_credit variant final_chronological
        default: 0
      - name: credit_authorized_cents
        type: integer
        source: system
        description: total credit the project has ever authorized; the conserved quantity of invariant credit_ledger_identity
        default: 0
      - name: credit_reserved_cents
        type: integer
        source: system
        description: authorized credit not yet settled or released
        default: 0
      - name: credit_settled_cents
        type: integer
        source: system
        description: authorized credit paid out at settlement
        default: 0
      - name: credit_released_cents
        type: integer
        source: system
        description: authorized credit given back because downtime was shorter than estimated or authorization was withdrawn
        default: 0
      - name: weather_abort_count
        type: integer
        source: system
        description: number of WorkWindow rows on this project that reached WEATHER_ABORTED
        default: 0
      - name: warranty_notice_status
        type: enum
        source: system
        description: manufacturer notification state required to preserve module warranty across the remove-and-reinstall
        default: PENDING
        constraints: one of NOT_REQUIRED | PENDING | FILED | LAPSED
      - name: warranty_notice_filed_at
        type: datetime
        source: system
        description: logical-clock instant warranty_notice_status last became FILED
        default: null
      - name: warranty_notice_reference
        type: string
        source: system
        description: manufacturer case reference recorded on the most recent filing
        default: null
      - name: warranty_preserved
        type: boolean
        source: computed
        description: logical AND of HardwareUnit.warranty_preserved over units with handling_status == REINSTALLED; true when that set is empty
        default: true
      - name: registered_unit_count
        type: integer
        source: computed
        description: count of HardwareUnit rows on this project; the conserved population of invariant unit_population_identity
        default: 0
      - name: stored_unit_count
        type: integer
        source: computed
        description: count of HardwareUnit rows with handling_status == STORED
        default: 0
      - name: reinstalled_unit_count
        type: integer
        source: computed
        description: count of HardwareUnit rows with handling_status == REINSTALLED
        default: 0
      - name: scrapped_unit_count
        type: integer
        source: computed
        description: count of HardwareUnit rows with handling_status == SCRAPPED
        default: 0
      - name: damaged_unit_count
        type: integer
        source: computed
        description: count of HardwareUnit rows with condition_grade == DAMAGED
        default: 0
      - name: open_critical_finding_count
        type: integer
        source: computed
        description: count of DeckFinding rows with status == OPEN and severity == CRITICAL
        default: 0
      - name: scoped_upgrade_cost_cents
        type: integer
        source: computed
        description: sum of DeckFinding.upgrade_cost_cents over findings with status IN {UPGRADE_SCOPED, UPGRADE_COMPLETED}
        default: 0
      - name: downtime_days_actual
        type: integer
        source: computed
        description: count of distinct UTC calendar dates in the inclusive range [date(deenergized_at), date(reenergized_at)]; 0 while either endpoint is null
        default: 0

  - name: PartyApproval
    parent: ReroofProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ReroofProject.id"
      - name: party_id
        type: string
        source: input
        description: "FK -> Party.id; party_type must be one of ROOFER, SOLAR_OWNER, SYSTEM_OWNER and must equal the project's corresponding party field"
      - name: approval_role
        type: enum
        source: computed
        description: copied from the referenced Party.party_type at creation
        constraints: one of ROOFER | SOLAR_OWNER | SYSTEM_OWNER
      - name: status
        type: enum
        source: system
        description: negotiation state of this party's consent
        default: PENDING
        constraints: one of PENDING | APPROVED | CHANGES_REQUESTED
      - name: round_recorded
        type: integer
        source: system
        description: value of ReroofProject.negotiation_round at the moment the current status was written
        default: 1
      - name: decision_note
        type: string
        source: input
        description: free-text rationale supplied with the most recent decision
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent decision
        default: null
      - name: veto_flag
        type: boolean
        source: system
        description: true when the most recent CHANGES_REQUESTED came from the SYSTEM_OWNER approval_role, which withdraws project authorization
        default: false
      - name: change_request_count
        type: integer
        source: system
        description: number of times this approval has entered CHANGES_REQUESTED
        default: 0

  - name: ArrayCircuit
    parent: ReroofProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ReroofProject.id"
      - name: circuit_label
        type: string
        source: input
        description: string/circuit designation on the one-line diagram; unique within the project
        constraints: unique per project_id
      - name: module_count
        type: integer
        source: input
        description: number of modules originally on this circuit
        constraints: value >= 1
      - name: dc_kw
        type: number
        source: input
        description: DC capacity of this circuit
        constraints: value > 0
      - name: status
        type: enum
        source: system
        description: energization state; ISOLATION_PENDING means de-energize was recorded without a verified interlock
        default: ENERGIZED
        constraints: one of ENERGIZED | ISOLATION_PENDING | ISOLATED
      - name: interlock_verified
        type: boolean
        source: system
        description: whether the most recent de-energize recorded a verified lockout/tagout interlock
        default: false
      - name: isolation_note
        type: string
        source: input
        description: field note recorded with the most recent energization action
        default: null
      - name: isolated_at
        type: datetime
        source: system
        description: logical-clock instant status last became ISOLATED
        default: null
      - name: reenergized_at
        type: datetime
        source: system
        description: logical-clock instant status last returned to ENERGIZED
        default: null

  - name: StorageBin
    parent: ReroofProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ReroofProject.id"
      - name: bin_label
        type: string
        source: input
        description: physical label stencilled on the storage bin; unique within the project
        constraints: unique per project_id
      - name: capacity_slots
        type: integer
        source: input
        description: number of units the bin can hold
        constraints: value >= 1
      - name: climate_controlled
        type: boolean
        source: input
        description: whether the bin is climate controlled; required by the manufacturer_strict warranty variant beyond 14 off-roof days
        default: false
      - name: accepts_unit_types
        type: array
        source: input
        description: non-empty subset of {PANEL, OPTIMIZER} this bin will accept
        default: ["PANEL", "OPTIMIZER"]
      - name: occupied_slots
        type: integer
        source: computed
        description: count of HardwareUnit rows whose storage_bin_id is this bin AND handling_status == STORED; see calculations.storage_bin_occupancy
        default: 0

  - name: HardwareUnit
    parent: ReroofProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ReroofProject.id"
      - name: array_circuit_id
        type: string
        source: input
        description: "FK -> ArrayCircuit.id; must belong to the same project_id"
      - name: storage_bin_id
        type: string
        source: system
        description: "FK -> StorageBin.id; set when the unit is put into labeled storage and retained afterwards as provenance; null until then"
        default: null
      - name: unit_type
        type: enum
        source: input
        description: whether this is a module or a module-level optimizer
        constraints: one of PANEL | OPTIMIZER
      - name: manufacturer
        type: string
        source: input
        description: manufacturer of record; overwritten by a RECEIVED SourcingOrder
        constraints: non-empty
      - name: model_code
        type: string
        source: input
        description: model code of record; overwritten by a RECEIVED SourcingOrder
        constraints: non-empty
      - name: serial_number
        type: string
        source: input
        description: serial number; unique within the project
        constraints: unique per project_id
      - name: rated_watts
        type: integer
        source: input
        description: nameplate watts (STC output for PANEL, max input watts for OPTIMIZER); overwritten by a RECEIVED SourcingOrder
        constraints: value >= 1
      - name: handling_status
        type: enum
        source: system
        description: physical-handling dimension; evolves independently of condition_grade
        default: ON_ROOF
        constraints: one of ON_ROOF | REMOVED | STORED | REINSTALLED | SCRAPPED
      - name: condition_grade
        type: enum
        source: system
        description: condition dimension; evolves independently of handling_status
        default: UNINSPECTED
        constraints: one of UNINSPECTED | SERVICEABLE | DAMAGED | REPLACED
      - name: storage_label
        type: string
        source: system
        description: bin_label and storage_position joined with a hyphen, assigned when the unit enters STORED; null otherwise
        default: null
      - name: storage_position
        type: integer
        source: input
        description: position within the bin recorded at storage time; defaults to occupied_slots + 1 at the moment of storage
        default: null
      - name: warranty_variant
        type: enum
        source: system
        description: which warranty rule set applies, pinned at removal from the project's warranty_notice_status at that instant
        default: null
        constraints: one of MANUFACTURER_STRICT | INSTALLER_LENIENT | null
      - name: warranty_preserved
        type: boolean
        source: computed
        description: result of calculations.unit_warranty_preservation; null until the unit reaches REINSTALLED
        default: null
      - name: warranty_risk_points
        type: integer
        source: computed
        description: 0 when warranty_preserved is true, 10 under MANUFACTURER_STRICT otherwise, 25 under INSTALLER_LENIENT otherwise
        default: 0
      - name: damage_note
        type: string
        source: input
        description: note recorded with the most recent condition grading
        default: null
      - name: removed_at
        type: datetime
        source: system
        description: logical-clock instant handling_status became REMOVED
        default: null
      - name: stored_at
        type: datetime
        source: system
        description: logical-clock instant handling_status became STORED
        default: null
      - name: reinstalled_at
        type: datetime
        source: system
        description: logical-clock instant handling_status became REINSTALLED
        default: null
      - name: off_roof_days
        type: integer
        source: computed
        description: date(reinstalled_at) minus date(removed_at) in whole UTC days; null until REINSTALLED
        default: null

  - name: DeckFinding
    parent: ReroofProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ReroofProject.id"
      - name: scoped_by_party_id
        type: string
        source: system
        description: "FK -> Party.id; the ROOFER party whose X-User-ID scoped the upgrade; null while status == OPEN"
        default: null
      - name: completed_by_party_id
        type: string
        source: system
        description: "FK -> Party.id; the ROOFER party whose X-User-ID signed the upgrade complete; must differ from scoped_by_party_id"
        default: null
      - name: finding_type
        type: enum
        source: input
        description: deck condition category discovered once the array came off
        constraints: one of SHEATHING_ROT | FASTENER_PULLOUT | FLASHING_FAILURE | MOISTURE_INTRUSION | STRUCTURAL_DEFLECTION
      - name: severity
        type: enum
        source: input
        description: severity band driving the cost multiplier and the posture gate
        constraints: one of LOW | MEDIUM | HIGH | CRITICAL
      - name: affected_area_sqft
        type: number
        source: input
        description: deck area requiring attention, the tiered-rate input
        constraints: value > 0
      - name: attachment_count_affected
        type: integer
        source: input
        description: number of mounting attachments or flashings to be upgraded
        constraints: value >= 0
      - name: status
        type: enum
        source: system
        description: remediation state of the finding
        default: OPEN
        constraints: one of OPEN | UPGRADE_SCOPED | UPGRADE_COMPLETED | WAIVED
      - name: upgrade_cost_cents
        type: integer
        source: computed
        description: result of calculations.deck_upgrade_cost; 0 while status IN {OPEN, WAIVED}
        default: 0
      - name: requires_repermit
        type: boolean
        source: computed
        description: true when severity IN {HIGH, CRITICAL} AND finding_type IN {SHEATHING_ROT, STRUCTURAL_DEFLECTION}
        default: false
      - name: waiver_reason
        type: string
        source: input
        description: justification recorded when the finding is WAIVED instead of upgraded
        default: null
      - name: scoped_at
        type: datetime
        source: system
        description: logical-clock instant status became UPGRADE_SCOPED
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant status became UPGRADE_COMPLETED or WAIVED
        default: null

  - name: PermitApplication
    parent: ReroofProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ReroofProject.id"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id"
      - name: scope
        type: enum
        source: input
        description: permit scope requested
        constraints: one of REINSTALL_ONLY | STRUCTURAL_UPGRADE | FULL_REPERMIT
      - name: status
        type: enum
        source: system
        description: permit lifecycle; REJECTED can be re-submitted, producing a cycle
        default: DRAFT
        constraints: one of DRAFT | SUBMITTED | APPROVED | REJECTED
      - name: expedited
        type: boolean
        source: input
        description: whether the expedite fee is paid
        default: false
      - name: fee_cents
        type: integer
        source: computed
        description: result of calculations.permit_fee; recomputed on every submission
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent submission
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent AHJ decision
        default: null
      - name: review_deadline_utc
        type: datetime
        source: computed
        description: submitted_at plus Jurisdiction.permit_review_days whole days
        default: null
      - name: revision_count
        type: integer
        source: system
        description: number of submissions after the first, i.e. resubmissions and re-permit reopenings
        default: 0
      - name: rejection_reason
        type: string
        source: input
        description: AHJ rationale recorded with a REJECT decision
        default: null
      - name: reopened_by_finding_id
        type: string
        source: system
        description: "FK -> DeckFinding.id; the structural finding whose scoping reopened this APPROVED permit; null when never reopened"
        default: null

  - name: Inspection
    parent: PermitApplication
    common_fields: true
    fields:
      - name: permit_application_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: inspection_type
        type: enum
        source: input
        description: which inspection this slot is for
        constraints: one of ROOF_DECK | MOUNTING | ELECTRICAL_FINAL
      - name: slot_date
        type: string
        source: input
        description: UTC calendar date (YYYY-MM-DD) the AHJ slot is consumed on; must equal date(window_start_utc)
        constraints: ISO date, must equal the UTC date of window_start_utc
      - name: window_start_utc
        type: datetime
        source: input
        description: inclusive start of the inspector arrival window
      - name: window_end_utc
        type: datetime
        source: input
        description: inclusive end of the inspector arrival window; must be strictly after window_start_utc and on the same UTC date
      - name: status
        type: enum
        source: system
        description: inspection outcome state
        default: SCHEDULED
        constraints: one of SCHEDULED | PASSED | FAILED | CORRECTION_REQUIRED
      - name: attempt_number
        type: integer
        source: system
        description: 1 on creation; incremented when a PASSED inspection is invalidated back to CORRECTION_REQUIRED by a re-permit cascade
        default: 1
      - name: result_note
        type: string
        source: input
        description: inspector note recorded with the result
        default: null
      - name: inspected_at
        type: datetime
        source: system
        description: logical-clock instant the result was recorded
        default: null

  - name: WorkWindow
    parent: ReroofProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ReroofProject.id"
      - name: party_id
        type: string
        source: input
        description: "FK -> Party.id; the crew resource occupying the interval; party_type must be ROOFER or SOLAR_CONTRACTOR"
      - name: supersedes_window_id
        type: string
        source: system
        description: "FK -> WorkWindow.id; the WEATHER_ABORTED window this window replaces; null for a first-time schedule"
        default: null
      - name: trade
        type: enum
        source: input
        description: which trade occupies the window
        constraints: one of ROOFING | SOLAR_REMOVAL | SOLAR_REINSTALL
      - name: start_utc
        type: datetime
        source: input
        description: half-open interval start, inclusive
      - name: end_utc
        type: datetime
        source: input
        description: half-open interval end, exclusive; must be strictly after start_utc
      - name: status
        type: enum
        source: system
        description: window lifecycle
        default: SCHEDULED
        constraints: one of SCHEDULED | IN_PROGRESS | COMPLETED | WEATHER_ABORTED | SUPERSEDED | REVOKED
      - name: weather_risk_score
        type: integer
        source: input
        description: forecast risk 0-100 recorded by the coordinator
        default: 0
        constraints: 0 <= value <= 100
      - name: abort_reason
        type: string
        source: input
        description: reason recorded with a WEATHER_ABORT action
        default: null
      - name: actual_start_utc
        type: datetime
        source: system
        description: logical-clock instant the window was STARTed
        default: null
      - name: actual_end_utc
        type: datetime
        source: system
        description: logical-clock instant the window was COMPLETEd or WEATHER_ABORTed
        default: null

  - name: SourcingOrder
    parent: ReroofProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ReroofProject.id"
      - name: hardware_unit_id
        type: string
        source: input
        description: "FK -> HardwareUnit.id; the DAMAGED unit this order replaces; must belong to the same project_id"
      - name: requested_model_code
        type: string
        source: input
        description: model code originally asked for
        constraints: non-empty
      - name: offered_manufacturer
        type: string
        source: input
        description: manufacturer the distributor can actually supply
        constraints: non-empty
      - name: offered_model_code
        type: string
        source: input
        description: model code the distributor can actually supply
        constraints: non-empty
      - name: offered_rated_watts
        type: integer
        source: input
        description: nameplate watts of the offered part
        constraints: value >= 1
      - name: unit_cost_cents
        type: integer
        source: input
        description: quoted cost of the offered part
        constraints: value >= 0
      - name: waiver_ref
        type: string
        source: input
        description: engineering mismatch-waiver reference; widens the watt tolerance and lets a MISMATCHED order reach PENDING_REVIEW instead of REJECTED
        default: null
      - name: watt_delta_pct
        type: number
        source: computed
        description: signed percentage difference between offered_rated_watts and the unit's rated_watts, 2 decimal places
        default: 0
      - name: tolerance_pct
        type: number
        source: computed
        description: watt tolerance actually applied, snapshotted before this order's own warranty side effect; see calculations.replacement_match_classification
        default: 3.00
      - name: match_class
        type: enum
        source: computed
        description: mismatched-model classification of the offered part
        constraints: one of EXACT | COMPATIBLE | MISMATCHED
      - name: status
        type: enum
        source: system
        description: sourcing lifecycle
        constraints: one of PENDING_REVIEW | APPROVED | REJECTED | RECEIVED
      - name: review_note
        type: string
        source: input
        description: note recorded by the SYSTEM_OWNER review
        default: null
      - name: received_serial_number
        type: string
        source: input
        description: serial number of the part actually delivered; written onto the HardwareUnit at receipt
        default: null
      - name: received_at
        type: datetime
        source: system
        description: logical-clock instant status became RECEIVED
        default: null

state_machines:
  - entity: ReroofProject
    initial_state: INTAKE
    terminal_states: [CLOSED]
    shape: compound_with_authorization_cycle
    transitions:
      - from: INTAKE
        to: APPROVALS_OPEN
        trigger: "POST /reroof/projects/{id}/party-approvals (first PartyApproval row created on this project)"
        actor: ProjectCoordinator
        preconditions: ["project.phase == INTAKE"]
        side_effects:
          - "PartyApproval created with status PENDING and round_recorded = project.negotiation_round"
          - "project.phase := APPROVALS_OPEN"
          - "recompute project.posture"
      - from: APPROVALS_OPEN
        to: AUTHORIZED
        trigger: "system, evaluated at the end of POST /reroof/party-approvals/{id}/decision"
        actor: system
        preconditions:
          - "COUNT(PartyApproval WHERE project_id == project.id AND status == APPROVED AND round_recorded == project.negotiation_round) == project.required_approval_party_count"
        side_effects:
          - "project.authorized_at := clock_now"
          - "project.phase := AUTHORIZED"
          - "recompute project.posture"
          - "evaluate ReroofProject AUTHORIZED -> DEENERGIZED (re-entry after a withdrawn authorization, when every ArrayCircuit of the project is already ISOLATED)"
      - from: APPROVALS_OPEN
        to: APPROVALS_OPEN
        trigger: "POST /reroof/party-approvals/{id}/decision with decision == REQUEST_CHANGES"
        actor: RoofingContractor | SolarOwner | SystemOwner
        preconditions: ["target PartyApproval.status == PENDING or APPROVED", "target PartyApproval.round_recorded == project.negotiation_round"]
        side_effects:
          - "target PartyApproval.status := CHANGES_REQUESTED, change_request_count += 1, decided_at := clock_now"
          - "when the approval's approval_role == SYSTEM_OWNER: target PartyApproval.veto_flag := true"
          - "because a CHANGES_REQUESTED was recorded, project.negotiation_round += 1 (self-cycle)"
          - "because project.negotiation_round changed, every other PartyApproval of this project with status == APPROVED is reset to PENDING and its round_recorded := project.negotiation_round"
          - "recompute project.posture"
        note: "This is the cycle edge; the project stays in APPROVALS_OPEN but every prior consent is void."
      - from: AUTHORIZED
        to: APPROVALS_OPEN
        trigger: "POST /reroof/party-approvals/{id}/decision with decision == REQUEST_CHANGES on an approval whose approval_role == SYSTEM_OWNER"
        actor: SystemOwner
        preconditions: ["target PartyApproval.approval_role == SYSTEM_OWNER", "target PartyApproval.round_recorded == project.negotiation_round"]
        side_effects:
          - "target PartyApproval.status := CHANGES_REQUESTED, veto_flag := true, change_request_count += 1"
          - "because veto_flag became true, project.negotiation_round += 1 and project.phase := APPROVALS_OPEN (authorization withdrawn)"
          - "because authorization was withdrawn, every other PartyApproval with status == APPROVED is reset to PENDING with round_recorded := project.negotiation_round"
          - "because authorization was withdrawn, every WorkWindow of this project with status == SCHEDULED is set to REVOKED"
          - "recompute project.posture"
      - from: DEENERGIZED
        to: APPROVALS_OPEN
        trigger: "POST /reroof/party-approvals/{id}/decision with decision == REQUEST_CHANGES on an approval whose approval_role == SYSTEM_OWNER"
        actor: SystemOwner
        preconditions: ["target PartyApproval.approval_role == SYSTEM_OWNER", "target PartyApproval.round_recorded == project.negotiation_round"]
        side_effects:
          - "target PartyApproval.status := CHANGES_REQUESTED, veto_flag := true, change_request_count += 1"
          - "because veto_flag became true, project.negotiation_round += 1 and project.phase := APPROVALS_OPEN (authorization withdrawn)"
          - "because authorization was withdrawn, every other PartyApproval with status == APPROVED is reset to PENDING with round_recorded := project.negotiation_round"
          - "because authorization was withdrawn, the reserved downtime credit is compensated: released := project.credit_reserved_cents; project.credit_reserved_cents := 0; project.credit_released_cents += released (project.credit_authorized_cents unchanged)"
          - "because authorization was withdrawn, every WorkWindow of this project with status == SCHEDULED is set to REVOKED"
          - "recompute project.posture"
        note: "Compensating edge of invariant credit_ledger_identity; ArrayCircuit rows stay ISOLATED, only the money and the schedule unwind."
      - from: AUTHORIZED
        to: DEENERGIZED
        trigger: "system, evaluated at the end of POST /reroof/array-circuits/{id}/energization with action == DE_ENERGIZE, and again at the end of POST /reroof/party-approvals/{id}/decision when that decision re-authorizes a project whose circuits are all already ISOLATED"
        actor: system
        preconditions:
          - "project.phase == AUTHORIZED"
          - "COUNT(ArrayCircuit WHERE project_id == project.id AND status != ISOLATED) == 0"
          - "COUNT(ArrayCircuit WHERE project_id == project.id) >= 1"
        side_effects:
          - "project.deenergized_at := clock_now"
          - "project.phase := DEENERGIZED"
          - "project.provisional_credit_cents := calculations.downtime_production_loss_credit variant provisional_forward_looking"
          - "project.credit_authorized_cents += project.provisional_credit_cents"
          - "project.credit_reserved_cents += project.provisional_credit_cents"
          - "recompute project.posture"
      - from: DEENERGIZED
        to: DECK_WORK
        trigger: "system, evaluated at the end of POST /reroof/hardware-units/{id}/storage and POST /reroof/hardware-units/{id}/condition-grade"
        actor: system
        preconditions:
          - "project.phase == DEENERGIZED"
          - "project.registered_unit_count >= 1"
          - "COUNT(HardwareUnit WHERE project_id == project.id AND handling_status NOT IN {STORED, SCRAPPED}) == 0"
        side_effects:
          - "project.phase := DECK_WORK"
          - "recompute project.stored_unit_count, project.scrapped_unit_count, project.posture"
      - from: DECK_WORK
        to: REINSTALL
        trigger: "system, evaluated at the end of POST /reroof/deck-findings/{id}/upgrade and POST /reroof/permit-applications/{id}/decision"
        actor: system
        preconditions:
          - "project.phase == DECK_WORK"
          - "COUNT(DeckFinding WHERE project_id == project.id AND status NOT IN {UPGRADE_COMPLETED, WAIVED}) == 0"
          - "COUNT(DeckFinding WHERE project_id == project.id AND requires_repermit == true AND status == UPGRADE_COMPLETED) == 0 OR EXISTS(PermitApplication WHERE project_id == project.id AND status == APPROVED)"
        side_effects:
          - "project.phase := REINSTALL"
          - "recompute project.posture"
      - from: REINSTALL
        to: COMMISSIONED
        trigger: "system, evaluated at the end of POST /reroof/array-circuits/{id}/energization with action == RE_ENERGIZE"
        actor: system
        preconditions:
          - "project.phase == REINSTALL"
          - "COUNT(ArrayCircuit WHERE project_id == project.id AND status != ENERGIZED) == 0"
          - "the project has no PermitApplication at all, OR the Jurisdiction of its PermitApplications has reinspection_required == false, OR EXISTS(Inspection WHERE permit_application_id IN (PermitApplication of this project WHERE status == APPROVED) AND inspection_type == ELECTRICAL_FINAL AND status == PASSED)"
        side_effects:
          - "project.reenergized_at := clock_now"
          - "project.phase := COMMISSIONED"
          - "recompute project.downtime_days_actual, project.warranty_preserved, project.posture"
      - from: COMMISSIONED
        to: CLOSED
        trigger: "POST /reroof/projects/{id}/credit-settlement"
        actor: ProjectCoordinator
        preconditions:
          - "project.phase == COMMISSIONED"
          - "project.credit_authorized_cents == project.credit_reserved_cents + project.credit_settled_cents + project.credit_released_cents"
        side_effects:
          - "project.final_credit_cents := calculations.downtime_production_loss_credit variant final_chronological"
          - "delta := project.final_credit_cents - project.credit_reserved_cents; when delta > 0 then project.credit_authorized_cents += delta"
          - "project.credit_settled_cents := project.final_credit_cents"
          - "project.credit_reserved_cents := 0"
          - "project.credit_released_cents := project.credit_authorized_cents - project.credit_settled_cents"
          - "project.phase := CLOSED"

  - entity: PartyApproval
    initial_state: PENDING
    terminal_states: []
    shape: cyclic
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /reroof/party-approvals/{id}/decision with decision == APPROVE"
        actor: RoofingContractor | SolarOwner | SystemOwner
        preconditions:
          - "X-User-ID == approval.party_id"
          - "approval.status == PENDING"
          - "approval.round_recorded == project.negotiation_round"
        side_effects:
          - "status := APPROVED, decided_at := clock_now, veto_flag := false"
          - "evaluate ReroofProject APPROVALS_OPEN -> AUTHORIZED"
      - from: PENDING
        to: CHANGES_REQUESTED
        trigger: "POST /reroof/party-approvals/{id}/decision with decision == REQUEST_CHANGES"
        actor: RoofingContractor | SolarOwner | SystemOwner
        preconditions:
          - "X-User-ID == approval.party_id"
          - "approval.status == PENDING"
          - "approval.round_recorded == project.negotiation_round"
        side_effects:
          - "status := CHANGES_REQUESTED, change_request_count += 1, decided_at := clock_now"
          - "veto_flag := true when approval_role == SYSTEM_OWNER"
          - "drives the ReroofProject negotiation-round cascade"
          - "after that cascade has incremented project.negotiation_round, this objecting approval's own round_recorded := project.negotiation_round (it stays current in the new round so it can withdraw the objection)"
      - from: APPROVED
        to: CHANGES_REQUESTED
        trigger: "POST /reroof/party-approvals/{id}/decision with decision == REQUEST_CHANGES"
        actor: RoofingContractor | SolarOwner | SystemOwner
        preconditions:
          - "X-User-ID == approval.party_id"
          - "approval.status == APPROVED"
          - "approval.round_recorded == project.negotiation_round"
        side_effects:
          - "status := CHANGES_REQUESTED, change_request_count += 1, decided_at := clock_now"
          - "veto_flag := true when approval_role == SYSTEM_OWNER"
          - "drives the ReroofProject negotiation-round cascade"
          - "after that cascade has incremented project.negotiation_round, this objecting approval's own round_recorded := project.negotiation_round"
      - from: CHANGES_REQUESTED
        to: APPROVED
        trigger: "POST /reroof/party-approvals/{id}/decision with decision == APPROVE"
        actor: RoofingContractor | SolarOwner | SystemOwner
        preconditions:
          - "X-User-ID == approval.party_id"
          - "approval.status == CHANGES_REQUESTED"
          - "approval.round_recorded == project.negotiation_round"
        side_effects:
          - "status := APPROVED, decided_at := clock_now, veto_flag := false"
          - "evaluate ReroofProject APPROVALS_OPEN -> AUTHORIZED"
        note: "The objecting party withdraws its objection inside the current negotiation round; clearing veto_flag is what lets the cycle close and the project re-authorize."
      - from: APPROVED
        to: PENDING
        trigger: "system cascade from the ReroofProject negotiation-round increment"
        actor: system
        preconditions: ["project.negotiation_round advanced past this approval's round_recorded"]
        side_effects: ["status := PENDING, round_recorded := project.negotiation_round, decided_at := null"]
        note: "Closes the cycle APPROVED -> PENDING -> APPROVED."
      - from: CHANGES_REQUESTED
        to: PENDING
        trigger: "system cascade from the ReroofProject negotiation-round increment (a second party requests changes in the new round)"
        actor: system
        preconditions: ["project.negotiation_round advanced past this approval's round_recorded"]
        side_effects: ["status := PENDING, round_recorded := project.negotiation_round, veto_flag := false"]

  - entity: ArrayCircuit
    initial_state: ENERGIZED
    terminal_states: []
    shape: cyclic_with_pending_branch
    transitions:
      - from: ENERGIZED
        to: ISOLATED
        trigger: "POST /reroof/array-circuits/{id}/energization with action == DE_ENERGIZE and interlock_verified == true"
        actor: SolarContractor
        preconditions:
          - "project.phase == AUTHORIZED"
          - "project.posture != FROZEN"
          - "circuit.status == ENERGIZED"
        side_effects:
          - "status := ISOLATED, interlock_verified := true, isolated_at := clock_now"
          - "evaluate ReroofProject AUTHORIZED -> DEENERGIZED"
      - from: ENERGIZED
        to: ISOLATION_PENDING
        trigger: "POST /reroof/array-circuits/{id}/energization with action == DE_ENERGIZE and interlock_verified == false"
        actor: SolarContractor
        preconditions:
          - "project.phase == AUTHORIZED"
          - "project.posture != FROZEN"
          - "circuit.status == ENERGIZED"
        side_effects: ["status := ISOLATION_PENDING, interlock_verified := false"]
        note: "Divergent branch of the same trigger; no project-level bubble-up because the circuit is not ISOLATED."
      - from: ISOLATION_PENDING
        to: ISOLATED
        trigger: "POST /reroof/array-circuits/{id}/energization with action == DE_ENERGIZE and interlock_verified == true"
        actor: SolarContractor
        preconditions: ["circuit.status == ISOLATION_PENDING", "project.posture != FROZEN"]
        side_effects:
          - "status := ISOLATED, interlock_verified := true, isolated_at := clock_now"
          - "evaluate ReroofProject AUTHORIZED -> DEENERGIZED"
      - from: ISOLATED
        to: ENERGIZED
        trigger: "POST /reroof/array-circuits/{id}/energization with action == RE_ENERGIZE"
        actor: SolarContractor
        preconditions:
          - "circuit.status == ISOLATED"
          - "project.phase == REINSTALL"
          - "project.posture == OPEN"
          - "COUNT(HardwareUnit WHERE array_circuit_id == circuit.id AND handling_status != SCRAPPED AND handling_status != REINSTALLED) == 0"
        side_effects:
          - "status := ENERGIZED, reenergized_at := clock_now"
          - "evaluate ReroofProject REINSTALL -> COMMISSIONED"
        note: "Closes the cycle ENERGIZED -> ISOLATED -> ENERGIZED."

  - entity: HardwareUnit
    initial_state: "handling_status = ON_ROOF, condition_grade = UNINSPECTED"
    terminal_states: [SCRAPPED]
    shape: parallel
    dimensions:
      handling_status: [ON_ROOF, REMOVED, STORED, REINSTALLED, SCRAPPED]
      condition_grade: [UNINSPECTED, SERVICEABLE, DAMAGED, REPLACED]
    transitions:
      - from: ON_ROOF
        to: REMOVED
        trigger: "POST /reroof/hardware-units/{id}/removal"
        actor: SolarContractor
        preconditions:
          - "unit.handling_status == ON_ROOF"
          - "unit's ArrayCircuit.status == ISOLATED"
          - "project.posture != FROZEN"
        side_effects:
          - "handling_status := REMOVED, removed_at := clock_now"
          - "warranty_variant := MANUFACTURER_STRICT when project.warranty_notice_status == FILED at this instant, else INSTALLER_LENIENT"
        note: "Handling dimension only; condition_grade is untouched."
      - from: REMOVED
        to: STORED
        trigger: "POST /reroof/hardware-units/{id}/storage"
        actor: SolarContractor
        preconditions:
          - "unit.handling_status == REMOVED"
          - "project.posture != FROZEN"
          - "target StorageBin.project_id == unit.project_id"
          - "unit.unit_type IN target StorageBin.accepts_unit_types"
          - "target StorageBin.occupied_slots < target StorageBin.capacity_slots"
        side_effects:
          - "storage_bin_id := target bin, storage_position := supplied value or bin.occupied_slots + 1"
          - "storage_label := bin.bin_label + '-' + storage_position"
          - "handling_status := STORED, stored_at := clock_now"
          - "recompute StorageBin.occupied_slots for the target bin"
          - "recompute project.stored_unit_count"
          - "evaluate ReroofProject DEENERGIZED -> DECK_WORK"
      - from: STORED
        to: REINSTALLED
        trigger: "POST /reroof/hardware-units/{id}/reinstall"
        actor: SolarContractor
        preconditions:
          - "unit.handling_status == STORED"
          - "unit.condition_grade IN {SERVICEABLE, REPLACED}"
          - "project.phase == REINSTALL"
          - "project.posture == OPEN"
          - "unit's ArrayCircuit.status == ISOLATED"
          - "project.ownership_model == HOST_OWNED OR project.warranty_notice_status == FILED"
        side_effects:
          - "handling_status := REINSTALLED, reinstalled_at := clock_now"
          - "off_roof_days := date(reinstalled_at) - date(removed_at) in whole UTC days"
          - "warranty_preserved and warranty_risk_points := calculations.unit_warranty_preservation"
          - "recompute StorageBin.occupied_slots for unit.storage_bin_id (the slot is freed; storage_bin_id and storage_label are retained as provenance)"
          - "recompute project.stored_unit_count, project.reinstalled_unit_count, project.warranty_preserved"
        note: "Compensating edge of invariant unit_population_identity."
      - from: REMOVED
        to: SCRAPPED
        trigger: "POST /reroof/hardware-units/{id}/condition-grade with condition_grade == DAMAGED and disposition == SCRAP"
        actor: SolarContractor
        preconditions: ["unit.handling_status == REMOVED"]
        side_effects:
          - "condition_grade := DAMAGED, handling_status := SCRAPPED"
          - "recompute project.damaged_unit_count, project.scrapped_unit_count"
          - "evaluate ReroofProject DEENERGIZED -> DECK_WORK"
      - from: STORED
        to: SCRAPPED
        trigger: "POST /reroof/hardware-units/{id}/condition-grade with condition_grade == DAMAGED and disposition == SCRAP"
        actor: SolarContractor
        preconditions: ["unit.handling_status == STORED"]
        side_effects:
          - "condition_grade := DAMAGED, handling_status := SCRAPPED"
          - "recompute StorageBin.occupied_slots for unit.storage_bin_id"
          - "recompute project.damaged_unit_count, project.scrapped_unit_count, project.stored_unit_count"
      - from: UNINSPECTED
        to: SERVICEABLE
        trigger: "POST /reroof/hardware-units/{id}/condition-grade with condition_grade == SERVICEABLE"
        actor: SolarContractor
        preconditions: ["unit.handling_status IN {REMOVED, STORED}"]
        side_effects: ["condition_grade := SERVICEABLE", "recompute project.damaged_unit_count"]
        note: "Condition dimension only; handling_status is untouched."
      - from: UNINSPECTED
        to: DAMAGED
        trigger: "POST /reroof/hardware-units/{id}/condition-grade with condition_grade == DAMAGED and disposition == RETAIN"
        actor: SolarContractor
        preconditions: ["unit.handling_status IN {REMOVED, STORED}"]
        side_effects: ["condition_grade := DAMAGED, damage_note recorded", "recompute project.damaged_unit_count"]
      - from: SERVICEABLE
        to: DAMAGED
        trigger: "POST /reroof/hardware-units/{id}/condition-grade with condition_grade == DAMAGED and disposition == RETAIN"
        actor: SolarContractor
        preconditions: ["unit.handling_status IN {REMOVED, STORED}"]
        side_effects: ["condition_grade := DAMAGED", "recompute project.damaged_unit_count"]
      - from: DAMAGED
        to: REPLACED
        trigger: "POST /reroof/sourcing-orders/{id}/receipt"
        actor: ProjectCoordinator
        preconditions:
          - "unit.condition_grade == DAMAGED"
          - "order.status == APPROVED"
          - "the resulting circuit watt spread satisfies calculations.circuit_watt_spread"
        side_effects:
          - "condition_grade := REPLACED"
          - "manufacturer := order.offered_manufacturer, model_code := order.offered_model_code, rated_watts := order.offered_rated_watts, serial_number := order.received_serial_number"
          - "recompute project.damaged_unit_count"

  - entity: DeckFinding
    initial_state: OPEN
    terminal_states: [WAIVED]
    shape: branching
    transitions:
      - from: OPEN
        to: UPGRADE_SCOPED
        trigger: "POST /reroof/deck-findings/{id}/upgrade with action == SCOPE"
        actor: RoofingContractor
        preconditions:
          - "finding.status == OPEN"
          - "acting Party.party_type == ROOFER"
          - "project.scoped_upgrade_cost_cents + the newly computed upgrade_cost_cents <= project.upgrade_budget_cents"
        side_effects:
          - "upgrade_cost_cents := calculations.deck_upgrade_cost"
          - "status := UPGRADE_SCOPED, scoped_at := clock_now, scoped_by_party_id := X-User-ID"
          - "recompute project.scoped_upgrade_cost_cents and project.open_critical_finding_count"
          - "because finding.requires_repermit == true and the project has a PermitApplication with status == APPROVED whose Jurisdiction.repermit_required_for_reinstall == true, that permit reverts APPROVED -> SUBMITTED with revision_count += 1, reopened_by_finding_id := finding.id, submitted_at := clock_now, fee_cents recomputed by calculations.permit_fee and review_deadline_utc := submitted_at + Jurisdiction.permit_review_days days"
          - "because that PermitApplication left APPROVED, every Inspection under it with status == PASSED and inspection_type IN {ROOF_DECK, MOUNTING} is invalidated to CORRECTION_REQUIRED with attempt_number += 1"
          - "recompute project.posture (the SUBMITTED re-permit drives RESTRICTED)"
        note: "Branch A of the fork; carries the depth-4 re-permitting cascade."
      - from: OPEN
        to: WAIVED
        trigger: "POST /reroof/deck-findings/{id}/upgrade with action == WAIVE"
        actor: RoofingContractor
        preconditions:
          - "finding.status == OPEN"
          - "acting Party.party_type == ROOFER"
          - "waiver_reason is supplied and non-empty"
        side_effects:
          - "status := WAIVED, completed_at := clock_now, upgrade_cost_cents stays 0"
          - "because a CRITICAL finding was waived rather than upgraded, project.warranty_notice_status := LAPSED when severity == CRITICAL"
          - "recompute project.open_critical_finding_count and project.posture"
          - "evaluate ReroofProject DECK_WORK -> REINSTALL"
        note: "Branch B of the fork; no cost, no re-permit, but a warranty consequence the SCOPE branch does not have."
      - from: UPGRADE_SCOPED
        to: UPGRADE_COMPLETED
        trigger: "POST /reroof/deck-findings/{id}/upgrade with action == COMPLETE"
        actor: RoofingContractor
        preconditions:
          - "finding.status == UPGRADE_SCOPED"
          - "acting Party.party_type == ROOFER"
          - "X-User-ID != finding.scoped_by_party_id"
        side_effects:
          - "status := UPGRADE_COMPLETED, completed_at := clock_now, completed_by_party_id := X-User-ID"
          - "recompute project.posture"
          - "evaluate ReroofProject DECK_WORK -> REINSTALL"
      - from: UPGRADE_SCOPED
        to: OPEN
        trigger: "POST /reroof/deck-findings/{id}/upgrade with action == RESCOPE"
        actor: RoofingContractor
        preconditions: ["finding.status == UPGRADE_SCOPED", "acting Party.party_type == ROOFER"]
        side_effects:
          - "status := OPEN, upgrade_cost_cents := 0, scoped_by_party_id := null, scoped_at := null"
          - "recompute project.scoped_upgrade_cost_cents, project.open_critical_finding_count, project.posture"
        note: "Revert edge; the reopened PermitApplication is NOT re-approved by this action."

  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: []
    shape: cyclic_with_branch
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reroof/permit-applications/{id}/submission"
        actor: ProjectCoordinator
        preconditions: ["permit.status == DRAFT"]
        side_effects:
          - "status := SUBMITTED, submitted_at := clock_now"
          - "fee_cents := calculations.permit_fee"
          - "review_deadline_utc := submitted_at + Jurisdiction.permit_review_days days"
          - "recompute project.posture"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /reroof/permit-applications/{id}/submission"
        actor: ProjectCoordinator
        preconditions: ["permit.status == REJECTED"]
        side_effects:
          - "status := SUBMITTED, submitted_at := clock_now, revision_count += 1, rejection_reason := null"
          - "fee_cents := calculations.permit_fee"
          - "review_deadline_utc := submitted_at + Jurisdiction.permit_review_days days"
          - "recompute project.posture"
        note: "Closes the cycle SUBMITTED -> REJECTED -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /reroof/permit-applications/{id}/decision with decision == APPROVE"
        actor: AHJInspector
        preconditions: ["permit.status == SUBMITTED", "X-User-ID == permit.jurisdiction_id"]
        side_effects:
          - "status := APPROVED, decided_at := clock_now"
          - "recompute project.posture"
          - "evaluate ReroofProject DECK_WORK -> REINSTALL"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /reroof/permit-applications/{id}/decision with decision == REJECT"
        actor: AHJInspector
        preconditions: ["permit.status == SUBMITTED", "X-User-ID == permit.jurisdiction_id", "rejection_reason supplied"]
        side_effects:
          - "status := REJECTED, decided_at := clock_now, rejection_reason recorded"
          - "because a PermitApplication of this project is REJECTED, project.posture := FROZEN"
          - "because project.posture became FROZEN, every WorkWindow of this project with status == SCHEDULED whose start_utc is at or after clock_now is set to REVOKED"
        note: "Divergent branch of the same trigger: APPROVE has no posture consequence, REJECT freezes the project and revokes future crew windows."

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: []
    shape: branching
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /reroof/inspections/{id}/result with result == PASS"
        actor: AHJInspector
        preconditions: ["inspection.status == SCHEDULED", "X-User-ID == the parent PermitApplication.jurisdiction_id", "parent PermitApplication.status IN {SUBMITTED, APPROVED}"]
        side_effects:
          - "status := PASSED, inspected_at := clock_now"
          - "the AHJ slot for slot_date is released (the row no longer counts toward inspection_slots_per_day)"
          - "evaluate ReroofProject REINSTALL -> COMMISSIONED"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /reroof/inspections/{id}/result with result == FAIL"
        actor: AHJInspector
        preconditions: ["inspection.status == SCHEDULED", "X-User-ID == the parent PermitApplication.jurisdiction_id"]
        side_effects:
          - "status := FAILED, inspected_at := clock_now"
          - "the AHJ slot for slot_date is released"
          - "because an Inspection FAILED, project.posture is recomputed with the failed inspection counting as an open compliance defect (RESTRICTED)"
      - from: SCHEDULED
        to: CORRECTION_REQUIRED
        trigger: "POST /reroof/inspections/{id}/result with result == CORRECTION"
        actor: AHJInspector
        preconditions: ["inspection.status == SCHEDULED", "X-User-ID == the parent PermitApplication.jurisdiction_id"]
        side_effects:
          - "status := CORRECTION_REQUIRED, inspected_at := clock_now"
          - "the AHJ slot for slot_date remains consumed (CORRECTION_REQUIRED still counts toward inspection_slots_per_day)"
      - from: PASSED
        to: CORRECTION_REQUIRED
        trigger: "system cascade from DeckFinding OPEN -> UPGRADE_SCOPED reopening the parent APPROVED PermitApplication"
        actor: system
        preconditions: ["inspection.status == PASSED", "inspection.inspection_type IN {ROOF_DECK, MOUNTING}", "parent PermitApplication left APPROVED in this same request"]
        side_effects: ["status := CORRECTION_REQUIRED, attempt_number += 1"]

  - entity: WorkWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SUPERSEDED, REVOKED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /reroof/work-windows/{id}/status with action == START"
        actor: ProjectCoordinator | RoofingContractor | SolarContractor
        preconditions: ["window.status == SCHEDULED", "project.posture != FROZEN", "clock_now >= window.start_utc"]
        side_effects: ["status := IN_PROGRESS, actual_start_utc := clock_now"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /reroof/work-windows/{id}/status with action == COMPLETE"
        actor: ProjectCoordinator | RoofingContractor | SolarContractor
        preconditions: ["window.status == IN_PROGRESS"]
        side_effects: ["status := COMPLETED, actual_end_utc := clock_now", "the crew interval is released for overlap purposes"]
      - from: SCHEDULED
        to: WEATHER_ABORTED
        trigger: "POST /reroof/work-windows/{id}/status with action == WEATHER_ABORT"
        actor: ProjectCoordinator
        preconditions: ["window.status == SCHEDULED", "abort_reason supplied"]
        side_effects:
          - "status := WEATHER_ABORTED, actual_end_utc := clock_now, abort_reason recorded"
          - "because a window aborted, project.weather_abort_count += 1"
          - "because project.weather_abort_count reached the threshold, project.posture is recomputed (>= 2 drives RESTRICTED)"
      - from: IN_PROGRESS
        to: WEATHER_ABORTED
        trigger: "POST /reroof/work-windows/{id}/status with action == WEATHER_ABORT"
        actor: ProjectCoordinator
        preconditions: ["window.status == IN_PROGRESS", "abort_reason supplied"]
        side_effects:
          - "status := WEATHER_ABORTED, actual_end_utc := clock_now"
          - "because a window aborted, project.weather_abort_count += 1"
          - "recompute project.posture"
      - from: WEATHER_ABORTED
        to: SUPERSEDED
        trigger: "POST /reroof/work-windows/{id}/reschedule"
        actor: ProjectCoordinator
        preconditions: ["window.status == WEATHER_ABORTED", "the replacement interval passes calculations.crew_window_overlap"]
        side_effects:
          - "the aborted window's status := SUPERSEDED"
          - "a new WorkWindow row is created with status SCHEDULED and supersedes_window_id := the aborted window's id"
      - from: SCHEDULED
        to: REVOKED
        trigger: "system cascade from a SYSTEM_OWNER veto or a PermitApplication REJECT"
        actor: system
        preconditions: ["window.status == SCHEDULED"]
        side_effects: ["status := REVOKED", "the crew interval is released for overlap purposes"]

  - entity: SourcingOrder
    initial_state: "computed at creation by calculations.replacement_match_classification"
    terminal_states: [REJECTED, RECEIVED]
    shape: branching
    transitions:
      - from: "(creation)"
        to: APPROVED
        trigger: "POST /reroof/sourcing-orders where match_class == EXACT, or match_class == COMPATIBLE and project.ownership_model == HOST_OWNED"
        actor: ProjectCoordinator
        preconditions:
          - "target HardwareUnit.condition_grade == DAMAGED"
          - "target HardwareUnit.handling_status IN {REMOVED, STORED}"
          - "expected_project_version == project.version"
        side_effects:
          - "status := APPROVED, match_class, watt_delta_pct, tolerance_pct computed"
          - "increments ReroofProject.version by 1"
      - from: "(creation)"
        to: PENDING_REVIEW
        trigger: "POST /reroof/sourcing-orders where (match_class == COMPATIBLE and project.ownership_model IN {LEASE, PPA}) or (match_class == MISMATCHED and waiver_ref is non-null)"
        actor: ProjectCoordinator
        preconditions:
          - "target HardwareUnit.condition_grade == DAMAGED"
          - "target HardwareUnit.handling_status IN {REMOVED, STORED}"
          - "expected_project_version == project.version"
        side_effects:
          - "status := PENDING_REVIEW"
          - "because match_class != EXACT, project.warranty_notice_status := PENDING when it was FILED (the manufacturer must be re-notified of the model change)"
          - "increments ReroofProject.version by 1"
      - from: "(creation)"
        to: REJECTED
        trigger: "POST /reroof/sourcing-orders where match_class == MISMATCHED and waiver_ref is null"
        actor: ProjectCoordinator
        preconditions: ["target HardwareUnit.condition_grade == DAMAGED", "expected_project_version == project.version"]
        side_effects: ["the request is refused with ERR_MODEL_MISMATCH_NOT_WAIVED and no SourcingOrder row is persisted"]
        note: "Modelled as a validation refusal, not a persisted REJECTED row; the REJECTED enum value is produced by the SYSTEM_OWNER review branch below."
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /reroof/sourcing-orders/{id}/review with decision == APPROVE"
        actor: SystemOwner
        preconditions: ["order.status == PENDING_REVIEW", "X-User-ID == project.system_owner_party_id"]
        side_effects: ["status := APPROVED"]
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /reroof/sourcing-orders/{id}/review with decision == REJECT"
        actor: SystemOwner
        preconditions: ["order.status == PENDING_REVIEW", "X-User-ID == project.system_owner_party_id"]
        side_effects: ["status := REJECTED", "the target HardwareUnit stays DAMAGED"]
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /reroof/sourcing-orders/{id}/receipt"
        actor: ProjectCoordinator
        preconditions:
          - "order.status == APPROVED"
          - "received_serial_number is unique within the project"
          - "the post-receipt circuit watt spread satisfies calculations.circuit_watt_spread"
        side_effects:
          - "status := RECEIVED, received_at := clock_now"
          - "the target HardwareUnit condition_grade DAMAGED -> REPLACED with manufacturer, model_code, rated_watts and serial_number overwritten from the order"
          - "recompute project.damaged_unit_count"

concurrency_rules:
  - rule_id: sourcing-order-create-stale-project
    parent_entity: ReroofProject
    write_endpoint: "POST /reroof/sourcing-orders"
    occ_field: "expected_project_version"
    description: |
      Creating a SourcingOrder against a ReroofProject whose version has
      advanced since the client last read it is rejected. A second sourcing
      order for the same DAMAGED unit is legitimate product behaviour - it
      supersedes the earlier quote when the distributor comes back with a
      different part - so the request cannot be refused on state grounds; the
      stale expected_project_version is the only signal that the writer has
      not seen the earlier order (and the warranty_notice_status change it
      caused).
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: warranty-notice-refile-stale-project
    parent_entity: ReroofProject
    write_endpoint: "POST /reroof/projects/{id}/warranty-notice"
    occ_field: "expected_project_version"
    description: |
      Filing a manufacturer warranty notice against a ReroofProject whose
      version has advanced since the client last read it is rejected. Re-filing
      is legitimate product behaviour - a second notice supersedes the first
      when the model of record changed - so the request cannot be refused on
      state grounds; the stale expected_project_version is the only signal that
      the writer is filing against an outdated view of the model of record.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

calculations:
  - name: downtime_production_loss_credit
    trigger: "provisional_forward_looking runs on the ReroofProject AUTHORIZED -> DEENERGIZED transition and writes project.provisional_credit_cents; final_chronological runs on the COMMISSIONED -> CLOSED transition (POST /reroof/projects/{id}/credit-settlement) and writes project.final_credit_cents"
    algorithm: forward_looking + chronological
    formula: |
      OWNERSHIP_FACTOR = { HOST_OWNED: 0.00, LEASE: 1.00, PPA: 0.85 }
      f = OWNERSHIP_FACTOR[project.ownership_model]

      # variant provisional_forward_looking  (one rounding, at the end)
      provisional_credit_cents =
          round_half_up( project.baseline_daily_kwh
                         * project.downtime_days_estimated
                         * CREDIT_RATE_CENTS_PER_KWH
                         * f )

      # variant final_chronological  (ROUNDING ORDER IS PINNED: round PER DAY, then sum)
      days = the ordered list of distinct UTC calendar dates D in the inclusive
             range [ date(project.deenergized_at), date(project.reenergized_at) ],
             ascending by date
      for each D in days, in ascending date order:
          day_factor(D) = 0.5 if EXISTS( WorkWindow w WHERE w.project_id == project.id
                                         AND w.status == WEATHER_ABORTED
                                         AND date(w.start_utc) <= D <= date(w.end_utc) )
                          else 1.0
          day_cents(D)  = round_half_up( project.baseline_daily_kwh
                                         * CREDIT_RATE_CENTS_PER_KWH
                                         * f
                                         * day_factor(D) )
      final_credit_cents = SUM over D in days of day_cents(D)
      # Summing first and rounding once is explicitly WRONG for this scaffold.
    input_set: |
      provisional_forward_looking reads only project.baseline_daily_kwh,
      project.downtime_days_estimated and project.ownership_model - no child rows
      at all, so it is insensitive to what actually happened.
      final_chronological reads project.deenergized_at, project.reenergized_at and
      only WorkWindow rows with status == WEATHER_ABORTED (SUPERSEDED, REVOKED,
      COMPLETED, SCHEDULED and IN_PROGRESS windows are excluded); the day list is
      inclusive at both ends and iterated ascending by calendar date.
    constants:
      CREDIT_RATE_CENTS_PER_KWH: 14
      OWNERSHIP_FACTOR_HOST_OWNED: 0.00
      OWNERSHIP_FACTOR_LEASE: 1.00
      OWNERSHIP_FACTOR_PPA: 0.85
      WEATHER_ABORTED_DAY_FACTOR: 0.5
    precision: "whole cents, round_half_up; the final variant rounds once per calendar day BEFORE summing"
    variants:
      - name: provisional_forward_looking
        when: "the last ArrayCircuit of the project reaches ISOLATED (AUTHORIZED -> DEENERGIZED)"
        difference: "uses the planned downtime_days_estimated and a single terminal rounding; ignores every WorkWindow row"
      - name: final_chronological
        when: "POST /reroof/projects/{id}/credit-settlement on a COMMISSIONED project"
        difference: "replays actual calendar dates between deenergized_at and reenergized_at, halves days covered by a WEATHER_ABORTED WorkWindow, and rounds per day before summing - so identical inputs give a different total from the provisional variant"

  - name: deck_upgrade_cost
    trigger: "DeckFinding OPEN -> UPGRADE_SCOPED (POST /reroof/deck-findings/{id}/upgrade with action == SCOPE); writes DeckFinding.upgrade_cost_cents"
    algorithm: tiered_pricing
    formula: |
      # (1) marginal tiered area cost
      a = finding.affected_area_sqft
      area_cost = ( min(a, 100) * AREA_TIER_1_CENTS_PER_SQFT )
                + ( max(0, min(a, 300) - 100) * AREA_TIER_2_CENTS_PER_SQFT )
                + ( max(0, a - 300)          * AREA_TIER_3_CENTS_PER_SQFT )

      # (2) attachment cost with a conditional surcharge on the finding_type
      surcharge = FLASHING_SURCHARGE_MULT if finding.finding_type == FLASHING_FAILURE else 1.00
      attachment_cost = finding.attachment_count_affected * ATTACHMENT_UNIT_CENTS * surcharge

      # (3) severity multiplier, plus an emergency bump under the FROZEN variant
      sev = SEVERITY_MULT[finding.severity]
      if project.posture == FROZEN: sev = sev + EMERGENCY_SEVERITY_BUMP

      raw = (area_cost + attachment_cost) * sev

      # (4) nested cap/floor: the cap is absolute, the floor is itself a max
      upgrade_cost_cents = max( min( round_half_up(raw), CAP_CENTS ),
                                max( FLOOR_BASE_CENTS, round_half_up(attachment_cost) ) )
      # Note the interaction: when attachment_cost alone exceeds CAP_CENTS the
      # floor wins over the cap, so the result can exceed CAP_CENTS.
    input_set: "a single DeckFinding row plus its project's posture at the instant of scoping; no sibling findings enter the formula, but project.scoped_upgrade_cost_cents (sum over findings with status IN {UPGRADE_SCOPED, UPGRADE_COMPLETED}) gates the write via validation priority 30"
    constants:
      AREA_TIER_1_MAX_SQFT: 100
      AREA_TIER_1_CENTS_PER_SQFT: 950
      AREA_TIER_2_MAX_SQFT: 300
      AREA_TIER_2_CENTS_PER_SQFT: 780
      AREA_TIER_3_CENTS_PER_SQFT: 640
      ATTACHMENT_UNIT_CENTS: 4200
      FLASHING_SURCHARGE_MULT: 1.25
      SEVERITY_MULT_LOW: 1.00
      SEVERITY_MULT_MEDIUM: 1.15
      SEVERITY_MULT_HIGH: 1.40
      SEVERITY_MULT_CRITICAL: 1.75
      EMERGENCY_SEVERITY_BUMP: 0.25
      CAP_CENTS: 2500000
      FLOOR_BASE_CENTS: 50000
    precision: "whole cents, round_half_up applied once to raw and once to attachment_cost before the max/min nest"
    variants:
      - name: standard_scope
        when: "project.posture IN {OPEN, RESTRICTED} at the instant of scoping"
        difference: "severity multiplier used as published"
      - name: emergency_scope
        when: "project.posture == FROZEN at the instant of scoping"
        difference: "severity multiplier is increased by EMERGENCY_SEVERITY_BUMP before the cap/floor nest, so the same finding costs more when scoped on a frozen project"

  - name: replacement_match_classification
    trigger: "POST /reroof/sourcing-orders; writes SourcingOrder.watt_delta_pct, tolerance_pct, match_class and the initial status"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. Steps 1-4 read the PRE-mutation snapshot of
      # project.warranty_notice_status; step 5 then mutates that very field. The
      # dependency only looks circular - the snapshot resolves it.
      u = the target HardwareUnit

      # step 1
      watt_delta_pct = round_half_up( ((order.offered_rated_watts - u.rated_watts)
                                       / u.rated_watts) * 100 , 2 )

      # step 2 - snapshot read of the project BEFORE step 5 writes it
      tolerance_pct = BASE_TOLERANCE_PCT
                    + (WARRANTY_FILED_BONUS_PCT if snapshot(project.warranty_notice_status) == FILED else 0.00)
                    + (WAIVER_BONUS_PCT         if order.waiver_ref is not null            else 0.00)

      # step 3
      if   order.offered_manufacturer == u.manufacturer
       and order.offered_model_code   == u.model_code:        match_class = EXACT
      elif order.offered_manufacturer == u.manufacturer
       and abs(watt_delta_pct) <= tolerance_pct:              match_class = COMPATIBLE
      else:                                                   match_class = MISMATCHED

      # step 4
      if   match_class == EXACT:                                       status = APPROVED
      elif match_class == COMPATIBLE and project.ownership_model == HOST_OWNED: status = APPROVED
      elif match_class == COMPATIBLE:                                  status = PENDING_REVIEW
      elif order.waiver_ref is not null:                               status = PENDING_REVIEW
      else: refuse the request with ERR_MODEL_MISMATCH_NOT_WAIVED (no row persisted)

      # step 5 - mutation, strictly after steps 1-4
      if match_class != EXACT and project.warranty_notice_status == FILED:
          project.warranty_notice_status = PENDING
    input_set: "one SourcingOrder request body, the target HardwareUnit's manufacturer/model_code/rated_watts of record, and the project's ownership_model plus the pre-mutation snapshot of warranty_notice_status"
    constants:
      BASE_TOLERANCE_PCT: 3.00
      WARRANTY_FILED_BONUS_PCT: 1.00
      WAIVER_BONUS_PCT: 2.00
    precision: "watt_delta_pct to 2 decimal places, round_half_up; tolerance_pct exact to 2 decimal places; comparison is <= (a delta exactly equal to the tolerance is COMPATIBLE)"
    variants:
      - name: notified_tolerance
        when: "snapshot(project.warranty_notice_status) == FILED"
        difference: "tolerance widened by WARRANTY_FILED_BONUS_PCT, so a part that is MISMATCHED on an un-notified project is COMPATIBLE on a notified one"
      - name: unnotified_tolerance
        when: "snapshot(project.warranty_notice_status) != FILED"
        difference: "base tolerance only"

  - name: unit_warranty_preservation
    trigger: "HardwareUnit STORED -> REINSTALLED (POST /reroof/hardware-units/{id}/reinstall); writes HardwareUnit.warranty_preserved, warranty_risk_points and off_roof_days, then ReroofProject.warranty_preserved"
    algorithm: threshold
    formula: |
      off_roof_days = date(unit.reinstalled_at) - date(unit.removed_at)   # whole UTC days
      bin = the StorageBin referenced by unit.storage_bin_id

      # variant manufacturer_strict
      preserved_strict = ( off_roof_days <= MFR_MAX_OFFROOF_DAYS )
                     and ( off_roof_days <= CLIMATE_THRESHOLD_DAYS or bin.climate_controlled == true )
                     and ( unit.condition_grade IN {SERVICEABLE, REPLACED} )

      # variant installer_lenient
      preserved_lenient = ( off_roof_days <= LENIENT_MAX_OFFROOF_DAYS )
                      and ( unit.condition_grade == SERVICEABLE )

      warranty_preserved = preserved_strict  if unit.warranty_variant == MANUFACTURER_STRICT
                           else preserved_lenient
      warranty_risk_points = 0 if warranty_preserved
                             else (STRICT_RISK_POINTS if unit.warranty_variant == MANUFACTURER_STRICT
                                   else LENIENT_RISK_POINTS)

      project.warranty_preserved = logical AND of warranty_preserved over every
          HardwareUnit of the project with handling_status == REINSTALLED,
          ordered by created_at ASC; true when that set is empty
    input_set: "one HardwareUnit, its warranty_variant pinned at removal, its storage bin's climate_controlled flag and its condition_grade at reinstall time; project-level roll-up includes only units with handling_status == REINSTALLED"
    constants:
      MFR_MAX_OFFROOF_DAYS: 30
      CLIMATE_THRESHOLD_DAYS: 14
      LENIENT_MAX_OFFROOF_DAYS: 14
      STRICT_RISK_POINTS: 10
      LENIENT_RISK_POINTS: 25
    precision: "integer days, calendar-date difference in UTC; all comparisons use <="
    variants:
      - name: manufacturer_strict
        when: "unit.warranty_variant == MANUFACTURER_STRICT, i.e. project.warranty_notice_status was FILED at the instant of removal"
        difference: "tolerates up to 30 off-roof days provided storage beyond 14 days was climate controlled, and accepts a REPLACED unit"
      - name: installer_lenient
        when: "unit.warranty_variant == INSTALLER_LENIENT, i.e. no manufacturer notice was on file at removal"
        difference: "hard 14-day ceiling regardless of storage conditions and only a SERVICEABLE unit qualifies - so identical off_roof_days and identical condition give the opposite verdict from the strict variant"

  - name: project_posture
    trigger: "recomputed at the end of every mutation that touches a ReroofProject or any of its children; writes ReroofProject.posture"
    algorithm: aggregation
    formula: |
      FROZEN when
          EXISTS( DeckFinding f WHERE f.project_id == P.id
                  AND f.status == OPEN AND f.severity == CRITICAL )
       OR EXISTS( PermitApplication p WHERE p.project_id == P.id
                  AND p.status == REJECTED )

      RESTRICTED when not FROZEN and
          EXISTS( DeckFinding f WHERE f.project_id == P.id
                  AND f.status IN {OPEN, UPGRADE_SCOPED} AND f.severity == HIGH )
       OR EXISTS( PermitApplication p WHERE p.project_id == P.id
                  AND p.status IN {DRAFT, SUBMITTED}
                  AND p.jurisdiction's repermit_required_for_reinstall == true )
       OR EXISTS( Inspection i WHERE i.permit_application_id IN
                  (PermitApplication of P) AND i.status IN {FAILED, CORRECTION_REQUIRED} )
       OR P.weather_abort_count >= WEATHER_ABORT_RESTRICT_THRESHOLD

      OPEN otherwise
    input_set: "all DeckFinding, PermitApplication and Inspection rows of the project with the status filters written above, plus the project's own weather_abort_count; SUPERSEDED/REVOKED/COMPLETED WorkWindow rows never affect posture directly"
    constants:
      WEATHER_ABORT_RESTRICT_THRESHOLD: 2
    precision: "n/a - enum result; the threshold comparison is >= (exactly 2 aborts already restricts)"

  - name: storage_bin_occupancy
    trigger: "recomputed on POST /reroof/hardware-units/{id}/storage, POST /reroof/hardware-units/{id}/reinstall and POST /reroof/hardware-units/{id}/condition-grade; writes StorageBin.occupied_slots"
    algorithm: aggregation
    formula: |
      bin.occupied_slots = COUNT( HardwareUnit u
                                  WHERE u.storage_bin_id == bin.id
                                  AND u.handling_status == STORED )
      # invariant unit_population_identity, checked after every mutation:
      SUM over bins of the project of bin.occupied_slots
        == COUNT( HardwareUnit WHERE project_id == P.id AND handling_status == STORED )
      P.registered_unit_count
        == COUNT(ON_ROOF) + COUNT(REMOVED) + COUNT(STORED)
         + COUNT(REINSTALLED) + COUNT(SCRAPPED)
    input_set: "HardwareUnit rows whose storage_bin_id equals the bin, filtered to handling_status == STORED exactly; REINSTALLED and SCRAPPED units retain storage_bin_id as provenance but no longer occupy a slot"
    constants: {}
    precision: "integer count; the capacity gate is occupied_slots < capacity_slots, so storage into a bin at exactly capacity is refused"

  - name: crew_window_overlap
    trigger: "POST /reroof/work-windows and POST /reroof/work-windows/{id}/reschedule; gates the write via ERR_CREW_WINDOW_CONFLICT"
    algorithm: interval_merge
    formula: |
      # Half-open intervals [start_utc, end_utc) on the Party crew resource,
      # inflated by a SYMMETRIC mobilization buffer taken from the Party row.
      B = Party(candidate.party_id).mobilization_buffer_minutes  (converted to seconds)
      conflict(candidate, existing) =
             candidate.start_utc <  existing.end_utc   + B
         and existing.start_utc  <  candidate.end_utc  + B
      refuse when EXISTS existing WorkWindow e WHERE
             e.party_id == candidate.party_id
         and e.id      != candidate.id
         and e.status  IN {SCHEDULED, IN_PROGRESS}
         and conflict(candidate, e)
      # Consequence pinned deliberately: exact adjacency (candidate.start_utc ==
      # existing.end_utc) IS a conflict whenever B > 0; the first legal start is
      # existing.end_utc + B.
    input_set: "WorkWindow rows on the same party_id with status IN {SCHEDULED, IN_PROGRESS}; COMPLETED, WEATHER_ABORTED, SUPERSEDED and REVOKED rows are excluded, and windows belonging to a different party never conflict"
    constants: {}
    precision: "second resolution; comparisons are strict <, so a candidate starting exactly at existing.end_utc + B is accepted"

  - name: inspection_slot_availability
    trigger: "POST /reroof/permit-applications/{id}/inspections; gates the write via ERR_INSPECTION_BACKLOG_VIOLATION and ERR_INSPECTION_SLOT_FULL"
    algorithm: threshold
    formula: |
      J = Jurisdiction(parent PermitApplication.jurisdiction_id)

      # (1) backlog floor - CLOSED lower bound
      earliest_start_utc = clock_now + J.backlog_days whole days
      refuse ERR_INSPECTION_BACKLOG_VIOLATION when
          candidate.window_start_utc < earliest_start_utc
      # a candidate starting exactly at earliest_start_utc is accepted

      # (2) aggregate day capacity - CLOSED intervals, endpoints may be shared
      slot_used = COUNT( Inspection i
                         WHERE Jurisdiction(i's permit) == J
                         AND i.slot_date == candidate.slot_date
                         AND i.status IN {SCHEDULED, CORRECTION_REQUIRED} )
      refuse ERR_INSPECTION_SLOT_FULL when slot_used >= J.inspection_slots_per_day
      # Two inspections on the same slot_date whose windows touch at an endpoint
      # (a.window_end_utc == b.window_start_utc) are BOTH legal while capacity
      # remains; geometry never rejects here, only the aggregate count does.
    input_set: "Inspection rows across every PermitApplication of the same Jurisdiction (not just the same project) sharing the candidate slot_date, filtered to status IN {SCHEDULED, CORRECTION_REQUIRED}; PASSED and FAILED rows release their slot"
    constants: {}
    precision: "second resolution on the backlog floor (comparison is >=); integer count on capacity (comparison is >=, so the Nth+1 request is refused)"

  - name: circuit_watt_spread
    trigger: "POST /reroof/sourcing-orders/{id}/receipt; gates the write via ERR_CIRCUIT_WATT_SPREAD_EXCEEDED"
    algorithm: threshold
    formula: |
      C = the ArrayCircuit of the target HardwareUnit
      W = the multiset of rated_watts over HardwareUnit rows WHERE
              array_circuit_id == C.id
          AND unit_type == the target unit's unit_type
          AND handling_status != SCRAPPED,
          evaluated AS IF the receipt had already written
          offered_rated_watts onto the target unit
      spread_pct = round_half_up( ((max(W) - min(W)) / min(W)) * 100 , 2 )
      refuse when spread_pct > MAX_CIRCUIT_WATT_SPREAD_PCT
      # comparison is >, so a spread exactly equal to the limit is accepted
    input_set: "non-SCRAPPED HardwareUnit rows on the same ArrayCircuit of the same unit_type, with the candidate replacement watts substituted in; PANEL and OPTIMIZER populations are evaluated independently"
    constants:
      MAX_CIRCUIT_WATT_SPREAD_PCT: 3.00
    precision: "2 decimal places, round_half_up; refusal only when strictly greater than the limit"

  - name: permit_fee
    trigger: "PermitApplication DRAFT -> SUBMITTED and REJECTED -> SUBMITTED (POST /reroof/permit-applications/{id}/submission); writes PermitApplication.fee_cents"
    algorithm: aggregation
    formula: |
      SCOPE_BASE = { REINSTALL_ONLY: 18000, STRUCTURAL_UPGRADE: 46000, FULL_REPERMIT: 72000 }
      fee_cents = SCOPE_BASE[permit.scope]
                + round_half_up( project.system_dc_kw * PER_KW_CENTS )
                + ( Jurisdiction.expedite_fee_cents if permit.expedited else 0 )
                + ( permit.revision_count_after_this_submission * REVISION_SURCHARGE_CENTS )
      # revision_count_after_this_submission is the value AFTER the increment
      # performed by this transition, so the first submission adds nothing.
    input_set: "one PermitApplication, its Jurisdiction and its project's system_dc_kw"
    constants:
      SCOPE_BASE_REINSTALL_ONLY: 18000
      SCOPE_BASE_STRUCTURAL_UPGRADE: 46000
      SCOPE_BASE_FULL_REPERMIT: 72000
      PER_KW_CENTS: 850
      REVISION_SURCHARGE_CENTS: 9000
    precision: "whole cents, round_half_up on the per-kW term only"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, X-User-Role is one of the six declared roles, and X-User-ID is a non-empty string"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the X-User-Role is listed in the target endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every resource named in the path exists, validated left to right"
    error_id: ERR_PROJECT_NOT_FOUND | ERR_APPROVAL_NOT_FOUND | ERR_CIRCUIT_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_SOURCING_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: ERR_PROJECT_NOT_FOUND | ERR_PARTY_NOT_FOUND | ERR_JURISDICTION_NOT_FOUND | ERR_CIRCUIT_NOT_FOUND | ERR_BIN_NOT_FOUND | ERR_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying FK fields in input"
  - priority: 5
    category: business_constraint
    check: "request body satisfies the declared schema: required fields present, enum members legal, numeric ranges respected, ISO 8601 timestamps parseable, accepts_unit_types a non-empty subset of {PANEL, OPTIMIZER}, pagination limit within 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 6
    category: auth
    check: "for entity_backed roles acting on a specific resource, X-User-ID equals the resource's owning foreign key: PartyApproval.party_id for a decision, project.system_owner_party_id for a sourcing review, WorkWindow.party_id for a crew-driven status change, and PermitApplication.jurisdiction_id for an AHJInspector action"
    error_id: ERR_PARTY_NOT_ON_PROJECT
    http_status: 403
    applies_to: "POST /reroof/party-approvals/{id}/decision, POST /reroof/sourcing-orders/{id}/review, POST /reroof/work-windows/{id}/status, POST /reroof/permit-applications/{id}/decision, POST /reroof/inspections/{id}/result"
  - priority: 7
    category: business_constraint
    check: "expected_project_version equals the current ReroofProject.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /reroof/sourcing-orders, POST /reroof/projects/{id}/warranty-notice"
  - priority: 8
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2, including the negotiation-round freshness check on a PartyApproval decision and the requirement that a PermitApplication be SUBMITTED or APPROVED before an Inspection can be scheduled under it"
    error_id: ERR_INVALID_STATE | ERR_APPROVAL_ROUND_STALE | ERR_PERMIT_NOT_SUBMITTED | ERR_SETTLEMENT_NOT_READY
    http_status: 409
    applies_to: "all state-changing action endpoints"
  - priority: 9
    category: business_safety
    check: "a HardwareUnit may only be removed or reinstalled while its ArrayCircuit.status == ISOLATED"
    error_id: ERR_CIRCUIT_NOT_ISOLATED
    http_status: 409
    applies_to: "POST /reroof/hardware-units/{id}/removal, POST /reroof/hardware-units/{id}/reinstall"
  - priority: 10
    category: business_safety
    check: "project.posture != FROZEN"
    error_id: ERR_PROJECT_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /reroof/array-circuits/{id}/energization, POST /reroof/hardware-units/{id}/removal, POST /reroof/hardware-units/{id}/storage, POST /reroof/hardware-units/{id}/reinstall, POST /reroof/work-windows, POST /reroof/work-windows/{id}/status with action == START"
  - priority: 11
    category: business_safety
    check: "project.posture == OPEN (RESTRICTED is not enough) before any energization-restoring or reinstall step"
    error_id: ERR_PROJECT_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /reroof/hardware-units/{id}/reinstall, POST /reroof/array-circuits/{id}/energization with action == RE_ENERGIZE"
  - priority: 12
    category: business_safety
    check: "project.ownership_model == HOST_OWNED OR project.warranty_notice_status == FILED before a unit is reinstalled"
    error_id: ERR_WARRANTY_NOTICE_MISSING
    http_status: 409
    applies_to: "POST /reroof/hardware-units/{id}/reinstall"
  - priority: 13
    category: business_safety
    check: "unit.condition_grade IN {SERVICEABLE, REPLACED} before reinstall"
    error_id: ERR_UNIT_NOT_SERVICEABLE
    http_status: 409
    applies_to: "POST /reroof/hardware-units/{id}/reinstall"
  - priority: 14
    category: business_safety
    check: "every non-SCRAPPED HardwareUnit on the circuit has handling_status == REINSTALLED before the circuit is re-energized"
    error_id: ERR_CIRCUIT_UNITS_NOT_REINSTALLED
    http_status: 409
    applies_to: "POST /reroof/array-circuits/{id}/energization with action == RE_ENERGIZE"
  - priority: 15
    category: business_referential
    check: "cross-aggregate references stay inside one project: HardwareUnit.array_circuit_id and the storage bin supplied at storage time must belong to the unit's project, and SourcingOrder.hardware_unit_id must belong to SourcingOrder.project_id"
    error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 422
    applies_to: "POST /reroof/projects/{id}/hardware-units, POST /reroof/hardware-units/{id}/storage, POST /reroof/sourcing-orders"
  - priority: 16
    category: business_referential
    check: "the X-User-ID completing a DeckFinding upgrade differs from DeckFinding.scoped_by_party_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reroof/deck-findings/{id}/upgrade with action == COMPLETE"
  - priority: 17
    category: business_referential
    check: "the referenced Party has the party_type the field requires: ROOFER for roofer_party_id and for any deck-finding action, SOLAR_OWNER for solar_owner_party_id, SYSTEM_OWNER for system_owner_party_id, SOLAR_CONTRACTOR for solar_contractor_party_id, and ROOFER or SOLAR_CONTRACTOR for WorkWindow.party_id; system_owner_party_id must be null exactly when ownership_model == HOST_OWNED; a PartyApproval's party_id must equal the project's field matching that party_type"
    error_id: ERR_PARTY_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /reroof/projects, POST /reroof/projects/{id}/party-approvals, POST /reroof/work-windows, POST /reroof/deck-findings/{id}/upgrade"
  - priority: 18
    category: business_referential
    check: "a SourcingOrder whose computed match_class == MISMATCHED carries a non-null waiver_ref"
    error_id: ERR_MODEL_MISMATCH_NOT_WAIVED
    http_status: 422
    applies_to: "POST /reroof/sourcing-orders"
  - priority: 19
    category: business_referential
    check: "the post-receipt circuit watt spread satisfies calculations.circuit_watt_spread"
    error_id: ERR_CIRCUIT_WATT_SPREAD_EXCEEDED
    http_status: 422
    applies_to: "POST /reroof/sourcing-orders/{id}/receipt"
  - priority: 20
    category: business_temporal
    check: "interval bounds are well formed: WorkWindow.end_utc strictly after start_utc; Inspection.window_end_utc strictly after window_start_utc, both on the same UTC date, and slot_date equal to that date"
    error_id: ERR_INVALID_WINDOW_BOUNDS
    http_status: 422
    applies_to: "POST /reroof/work-windows, POST /reroof/work-windows/{id}/reschedule, POST /reroof/permit-applications/{id}/inspections"
  - priority: 21
    category: business_temporal
    check: "Inspection.window_start_utc is at or after clock_now plus Jurisdiction.backlog_days whole days"
    error_id: ERR_INSPECTION_BACKLOG_VIOLATION
    http_status: 422
    applies_to: "POST /reroof/permit-applications/{id}/inspections"
  - priority: 22
    category: business_temporal
    check: "the candidate interval does not conflict with another SCHEDULED or IN_PROGRESS WorkWindow on the same party_id under calculations.crew_window_overlap"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /reroof/work-windows, POST /reroof/work-windows/{id}/reschedule"
  - priority: 23
    category: business_temporal
    check: "the jurisdiction's aggregate slot count for the candidate slot_date is below inspection_slots_per_day"
    error_id: ERR_INSPECTION_SLOT_FULL
    http_status: 409
    applies_to: "POST /reroof/permit-applications/{id}/inspections"
  - priority: 24
    category: business_constraint
    check: "the unit's unit_type appears in the target StorageBin.accepts_unit_types"
    error_id: ERR_BIN_UNIT_TYPE_REJECTED
    http_status: 422
    applies_to: "POST /reroof/hardware-units/{id}/storage"
  - priority: 25
    category: business_constraint
    check: "serial_number is unique within the project, including the serial written by a sourcing receipt"
    error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    applies_to: "POST /reroof/projects/{id}/hardware-units, POST /reroof/sourcing-orders/{id}/receipt"
  - priority: 26
    category: business_constraint
    check: "bin_label is unique within the project"
    error_id: ERR_DUPLICATE_BIN_LABEL
    http_status: 409
    applies_to: "POST /reroof/projects/{id}/storage-bins"
  - priority: 27
    category: business_constraint
    check: "circuit_label is unique within the project"
    error_id: ERR_DUPLICATE_CIRCUIT_LABEL
    http_status: 409
    applies_to: "POST /reroof/projects/{id}/array-circuits"
  - priority: 28
    category: business_constraint
    check: "at most one PartyApproval per (project_id, party_id) pair"
    error_id: ERR_DUPLICATE_APPROVAL_PARTY
    http_status: 409
    applies_to: "POST /reroof/projects/{id}/party-approvals"
  - priority: 29
    category: business_fiscal
    check: "target StorageBin.occupied_slots < capacity_slots"
    error_id: ERR_BIN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /reroof/hardware-units/{id}/storage"
  - priority: 30
    category: business_fiscal
    check: "project.scoped_upgrade_cost_cents plus the newly computed DeckFinding.upgrade_cost_cents does not exceed project.upgrade_budget_cents"
    error_id: ERR_UPGRADE_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /reroof/deck-findings/{id}/upgrade with action == SCOPE"
  - priority: 31
    category: business_fiscal
    check: "the credit ledger identity credit_authorized_cents == credit_reserved_cents + credit_settled_cents + credit_released_cents holds before settlement is applied"
    error_id: ERR_CREDIT_LEDGER_UNBALANCED
    http_status: 409
    applies_to: "POST /reroof/projects/{id}/credit-settlement"

endpoints:
  - method: POST
    path: "/reroof/parties"
    description: "Register a coordination party (roofer, solar owner, third-party system owner, or SunSystem solar contractor crew)."
    roles: [ProjectCoordinator]
    code: 201
    input: ["name", "party_type", "contact_email", "mobilization_buffer_minutes?", "daily_crew_capacity?", "license_number?"]
    output: Party
    side_effects: ["Party row created with version 1"]
  - method: GET
    path: "/reroof/parties"
    description: "List parties, optionally filtered by party_type."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner, AHJInspector]
    code: 200
    input: ["party_type?", "limit?", "offset?"]
    output: Party[]
    side_effects: []
  - method: GET
    path: "/reroof/parties/{id}"
    description: "Read one party including its mobilization buffer and crew capacity."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner, AHJInspector]
    code: 200
    input: []
    output: Party
    side_effects: []
  - method: POST
    path: "/reroof/jurisdictions"
    description: "Register an authority having jurisdiction with its re-permit, re-inspection, slot-capacity and backlog policy. Immutable once created."
    roles: [ProjectCoordinator]
    code: 201
    input: ["name", "code", "repermit_required_for_reinstall", "reinspection_required", "inspection_slots_per_day", "backlog_days", "permit_review_days", "expedite_fee_cents?"]
    output: Jurisdiction
    side_effects: ["Jurisdiction row created; no version field, no update endpoint"]
  - method: GET
    path: "/reroof/jurisdictions"
    description: "List jurisdictions, optionally filtered by code."
    roles: [ProjectCoordinator, AHJInspector]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []
  - method: GET
    path: "/reroof/jurisdictions/{id}"
    description: "Read one jurisdiction and its re-permit, re-inspection, slot-capacity and backlog policy."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner, AHJInspector]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []
  - method: POST
    path: "/reroof/projects"
    description: "Open a remove-and-reinstall project for a roof replacement."
    roles: [ProjectCoordinator]
    code: 201
    input: ["site_address", "ownership_model", "system_dc_kw", "roofer_party_id", "solar_owner_party_id", "solar_contractor_party_id", "baseline_daily_kwh", "downtime_days_estimated", "upgrade_budget_cents", "system_owner_party_id?"]
    output: ReroofProject
    side_effects:
      - "phase := INTAKE, posture := OPEN, negotiation_round := 1, version := 1"
      - "required_approval_party_count := 3 when system_owner_party_id is non-null else 2"
      - "warranty_notice_status := NOT_REQUIRED when ownership_model == HOST_OWNED else PENDING"
      - "all credit and count fields initialised to 0, warranty_preserved := true"
  - method: GET
    path: "/reroof/projects"
    description: "List projects, filterable by any of the four party foreign keys, by phase and by posture."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner]
    code: 200
    input: ["roofer_party_id?", "solar_owner_party_id?", "system_owner_party_id?", "solar_contractor_party_id?", "phase?", "posture?", "limit?", "offset?"]
    output: ReroofProject[]
    side_effects: []
  - method: GET
    path: "/reroof/projects/{id}"
    description: "Read one project including its derived posture, credit ledger, counters and current version."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner, AHJInspector]
    code: 200
    input: []
    output: ReroofProject
    side_effects: []
  - method: GET
    path: "/reroof/projects/{id}/downtime-summary"
    description: "Computed read of the downtime and credit position, including whether the credit ledger identity currently balances."
    roles: [ProjectCoordinator, SolarOwner, SystemOwner]
    code: 200
    input: []
    output:
      downtime_days_actual: integer
      provisional_credit_cents: integer
      final_credit_cents: integer
      credit_authorized_cents: integer
      credit_reserved_cents: integer
      credit_settled_cents: integer
      credit_released_cents: integer
      ledger_balanced: boolean
    side_effects: []
  - method: POST
    path: "/reroof/projects/{id}/warranty-notice"
    description: "File (or re-file) the manufacturer notification that preserves module warranty across the remove-and-reinstall."
    roles: [ProjectCoordinator]
    code: 200
    input: [manufacturer, notice_reference, expected_project_version]
    output: ReroofProject
    side_effects:
      - "warranty_notice_status := FILED, warranty_notice_filed_at := clock_now, warranty_notice_reference := notice_reference"
      - "increments ReroofProject.version by 1"
      - "recompute project.posture"
  - method: POST
    path: "/reroof/projects/{id}/credit-settlement"
    description: "Settle the downtime credit on a COMMISSIONED project using the final_chronological variant and close the project."
    roles: [ProjectCoordinator]
    code: 200
    input: ["settlement_note?"]
    output: ReroofProject
    side_effects:
      - "final_credit_cents := calculations.downtime_production_loss_credit variant final_chronological"
      - "credit_authorized_cents topped up by any positive delta, credit_settled_cents := final_credit_cents, credit_reserved_cents := 0, credit_released_cents := credit_authorized_cents - credit_settled_cents"
      - "phase COMMISSIONED -> CLOSED"
  - method: POST
    path: "/reroof/projects/{id}/party-approvals"
    description: "Open a consent request for one of the three coordinating parties; the first one moves the project into APPROVALS_OPEN."
    roles: [ProjectCoordinator]
    code: 201
    input: [party_id]
    output: PartyApproval
    side_effects:
      - "PartyApproval created with status PENDING, approval_role copied from Party.party_type, round_recorded := project.negotiation_round"
      - "project.phase INTAKE -> APPROVALS_OPEN on the first approval"
  - method: GET
    path: "/reroof/party-approvals/{id}"
    description: "Read one consent record."
    roles: [ProjectCoordinator, RoofingContractor, SolarOwner, SystemOwner]
    code: 200
    input: []
    output: PartyApproval
    side_effects: []
  - method: GET
    path: "/reroof/party-approvals"
    description: "List consent records, filterable by project, party and status."
    roles: [ProjectCoordinator, RoofingContractor, SolarOwner, SystemOwner]
    code: 200
    input: ["project_id?", "party_id?", "status?", "limit?", "offset?"]
    output: PartyApproval[]
    side_effects: []
  - method: POST
    path: "/reroof/party-approvals/{id}/decision"
    description: "Record a party's APPROVE or REQUEST_CHANGES decision for the current negotiation round."
    roles: [RoofingContractor, SolarOwner, SystemOwner]
    code: 200
    input: ["decision", "decision_note?"]
    output: PartyApproval
    side_effects:
      - "PartyApproval status, decided_at, change_request_count and veto_flag updated"
      - "APPROVE may bubble the project APPROVALS_OPEN -> AUTHORIZED"
      - "REQUEST_CHANGES increments project.negotiation_round, resets sibling approvals, and on a SYSTEM_OWNER veto withdraws authorization, releases reserved credit and revokes SCHEDULED WorkWindows"
  - method: POST
    path: "/reroof/projects/{id}/array-circuits"
    description: "Register a PV string/circuit on the project."
    roles: [ProjectCoordinator]
    code: 201
    input: [circuit_label, module_count, dc_kw]
    output: ArrayCircuit
    side_effects: ["ArrayCircuit created with status ENERGIZED, interlock_verified false"]
  - method: GET
    path: "/reroof/array-circuits/{id}"
    description: "Read one array circuit including its isolation status and interlock flag."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner, AHJInspector]
    code: 200
    input: []
    output: ArrayCircuit
    side_effects: []
  - method: GET
    path: "/reroof/projects/{id}/array-circuits"
    description: "List the circuits of a project."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ArrayCircuit[]
    side_effects: []
  - method: POST
    path: "/reroof/array-circuits/{id}/energization"
    description: "De-energize or re-energize a circuit. DE_ENERGIZE without a verified interlock lands in ISOLATION_PENDING instead of ISOLATED."
    roles: [SolarContractor]
    code: 200
    input: ["action", "interlock_verified", "isolation_note?"]
    output: ArrayCircuit
    side_effects:
      - "circuit.status, interlock_verified, isolated_at / reenergized_at updated"
      - "DE_ENERGIZE of the last circuit bubbles project AUTHORIZED -> DEENERGIZED and reserves the provisional downtime credit"
      - "RE_ENERGIZE of the last circuit bubbles project REINSTALL -> COMMISSIONED and recomputes downtime_days_actual and warranty_preserved"
  - method: POST
    path: "/reroof/projects/{id}/storage-bins"
    description: "Create a labeled storage bin for removed modules and optimizers."
    roles: [ProjectCoordinator]
    code: 201
    input: ["bin_label", "capacity_slots", "climate_controlled?", "accepts_unit_types?"]
    output: StorageBin
    side_effects: ["StorageBin created with occupied_slots 0"]
  - method: GET
    path: "/reroof/storage-bins/{id}"
    description: "Read one storage bin including its live occupied_slots figure."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner]
    code: 200
    input: []
    output: StorageBin
    side_effects: []
  - method: GET
    path: "/reroof/projects/{id}/storage-bins"
    description: "List the storage bins of a project with their derived occupancy."
    roles: [ProjectCoordinator, SolarContractor]
    code: 200
    input: ["limit?", "offset?"]
    output: StorageBin[]
    side_effects: []
  - method: POST
    path: "/reroof/projects/{id}/hardware-units"
    description: "Register a module or optimizer that is currently on the roof."
    roles: [SolarContractor]
    code: 201
    input: [array_circuit_id, unit_type, manufacturer, model_code, serial_number, rated_watts]
    output: HardwareUnit
    side_effects:
      - "HardwareUnit created with handling_status ON_ROOF and condition_grade UNINSPECTED"
      - "recompute project.registered_unit_count"
  - method: GET
    path: "/reroof/hardware-units/{id}"
    description: "Read one hardware unit including both state dimensions, its storage label and its warranty verdict."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner]
    code: 200
    input: []
    output: HardwareUnit
    side_effects: []
  - method: GET
    path: "/reroof/hardware-units"
    description: "List hardware units, filterable by project, circuit, storage bin and either state dimension."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner]
    code: 200
    input: ["project_id?", "array_circuit_id?", "storage_bin_id?", "handling_status?", "condition_grade?", "unit_type?", "limit?", "offset?"]
    output: HardwareUnit[]
    side_effects: []
  - method: POST
    path: "/reroof/hardware-units/{id}/removal"
    description: "Record physical removal of the unit from the roof; pins the warranty variant from the project's notice status at this instant."
    roles: [SolarContractor]
    code: 200
    input: []
    output: HardwareUnit
    side_effects:
      - "handling_status ON_ROOF -> REMOVED, removed_at := clock_now"
      - "warranty_variant := MANUFACTURER_STRICT when project.warranty_notice_status == FILED else INSTALLER_LENIENT"
  - method: POST
    path: "/reroof/hardware-units/{id}/storage"
    description: "Place a removed unit into a labeled storage bin slot."
    roles: [SolarContractor]
    code: 200
    input: ["storage_bin_id", "storage_position?"]
    output: HardwareUnit
    side_effects:
      - "handling_status REMOVED -> STORED, stored_at := clock_now, storage_bin_id, storage_position and storage_label written"
      - "recompute StorageBin.occupied_slots and project.stored_unit_count"
      - "may bubble project DEENERGIZED -> DECK_WORK"
  - method: POST
    path: "/reroof/hardware-units/{id}/condition-grade"
    description: "Grade a removed or stored unit SERVICEABLE or DAMAGED; a DAMAGED unit may be retained for replacement sourcing or scrapped outright."
    roles: [SolarContractor]
    code: 200
    input: ["condition_grade", "disposition", "damage_note?"]
    output: HardwareUnit
    side_effects:
      - "condition_grade updated on the condition dimension only, unless disposition == SCRAP which also sets handling_status := SCRAPPED"
      - "recompute project.damaged_unit_count, project.scrapped_unit_count, project.stored_unit_count and StorageBin.occupied_slots"
      - "may bubble project DEENERGIZED -> DECK_WORK"
  - method: POST
    path: "/reroof/hardware-units/{id}/reinstall"
    description: "Reinstall a stored, serviceable-or-replaced unit onto the new roof and evaluate its warranty preservation."
    roles: [SolarContractor]
    code: 200
    input: []
    output: HardwareUnit
    side_effects:
      - "handling_status STORED -> REINSTALLED, reinstalled_at := clock_now, off_roof_days computed"
      - "warranty_preserved and warranty_risk_points := calculations.unit_warranty_preservation"
      - "recompute StorageBin.occupied_slots, project.stored_unit_count, project.reinstalled_unit_count, project.warranty_preserved"
  - method: POST
    path: "/reroof/projects/{id}/deck-findings"
    description: "Record a roof deck condition finding discovered once the array came off."
    roles: [RoofingContractor]
    code: 201
    input: [finding_type, severity, affected_area_sqft, attachment_count_affected]
    output: DeckFinding
    side_effects:
      - "DeckFinding created with status OPEN, requires_repermit computed"
      - "recompute project.open_critical_finding_count and project.posture"
  - method: GET
    path: "/reroof/deck-findings/{id}"
    description: "Read one deck finding including its scoped cost and the two segregation-of-duties party references."
    roles: [ProjectCoordinator, RoofingContractor, SolarOwner, SystemOwner, AHJInspector]
    code: 200
    input: []
    output: DeckFinding
    side_effects: []
  - method: GET
    path: "/reroof/deck-findings"
    description: "List deck findings, filterable by project, severity, status and either segregation-of-duties party reference."
    roles: [ProjectCoordinator, RoofingContractor, SolarOwner, SystemOwner, AHJInspector]
    code: 200
    input: ["project_id?", "scoped_by_party_id?", "completed_by_party_id?", "severity?", "status?", "limit?", "offset?"]
    output: DeckFinding[]
    side_effects: []
  - method: POST
    path: "/reroof/deck-findings/{id}/upgrade"
    description: "Drive the attachment/flashing upgrade branch of a finding: SCOPE prices it and may reopen an approved permit, COMPLETE signs it off under segregation of duties, WAIVE closes it without work, RESCOPE reverts to OPEN."
    roles: [RoofingContractor]
    code: 200
    input: ["action", "waiver_reason?"]
    output: DeckFinding
    side_effects:
      - "SCOPE: upgrade_cost_cents := calculations.deck_upgrade_cost, status := UPGRADE_SCOPED, scoped_by_party_id := X-User-ID; a structural finding reopens an APPROVED PermitApplication to SUBMITTED and invalidates its PASSED deck/mounting Inspections to CORRECTION_REQUIRED"
      - "COMPLETE: status := UPGRADE_COMPLETED, completed_by_party_id := X-User-ID"
      - "WAIVE: status := WAIVED and a CRITICAL waiver sets project.warranty_notice_status := LAPSED"
      - "RESCOPE: status := OPEN, upgrade_cost_cents := 0, scoped_by_party_id := null"
      - "recompute project.scoped_upgrade_cost_cents, project.open_critical_finding_count, project.posture; may bubble project DECK_WORK -> REINSTALL"
  - method: POST
    path: "/reroof/permit-applications"
    description: "Draft a re-permit application for the reinstall with the authority having jurisdiction."
    roles: [ProjectCoordinator]
    code: 201
    input: ["project_id", "jurisdiction_id", "scope", "expedited?"]
    output: PermitApplication
    side_effects: ["PermitApplication created with status DRAFT, revision_count 0, fee_cents 0", "recompute project.posture"]
  - method: GET
    path: "/reroof/permit-applications/{id}"
    description: "Read one permit application including its review deadline, fee and re-permit provenance."
    roles: [ProjectCoordinator, RoofingContractor, SolarOwner, SystemOwner, AHJInspector]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []
  - method: GET
    path: "/reroof/permit-applications"
    description: "List permit applications, filterable by project, jurisdiction, status and the finding that reopened them."
    roles: [ProjectCoordinator, RoofingContractor, SolarOwner, SystemOwner, AHJInspector]
    code: 200
    input: ["project_id?", "jurisdiction_id?", "reopened_by_finding_id?", "status?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []
  - method: POST
    path: "/reroof/permit-applications/{id}/submission"
    description: "Submit or re-submit the application to the AHJ; recomputes the fee and the review deadline."
    roles: [ProjectCoordinator]
    code: 200
    input: []
    output: PermitApplication
    side_effects:
      - "status DRAFT|REJECTED -> SUBMITTED, submitted_at := clock_now, revision_count incremented on a re-submission"
      - "fee_cents := calculations.permit_fee, review_deadline_utc := submitted_at + Jurisdiction.permit_review_days days"
      - "recompute project.posture"
  - method: POST
    path: "/reroof/permit-applications/{id}/decision"
    description: "Record the AHJ decision. APPROVE clears the re-permit gate; REJECT freezes the project and revokes future crew windows."
    roles: [AHJInspector]
    code: 200
    input: ["decision", "rejection_reason?"]
    output: PermitApplication
    side_effects:
      - "status SUBMITTED -> APPROVED or REJECTED, decided_at := clock_now"
      - "APPROVE may bubble project DECK_WORK -> REINSTALL"
      - "REJECT sets project.posture := FROZEN and REVOKES every SCHEDULED WorkWindow of the project starting at or after clock_now"
  - method: POST
    path: "/reroof/permit-applications/{id}/inspections"
    description: "Book an AHJ inspection slot against the application, subject to the jurisdiction's backlog floor and per-day aggregate capacity."
    roles: [ProjectCoordinator]
    code: 201
    input: [inspection_type, slot_date, window_start_utc, window_end_utc]
    output: Inspection
    side_effects: ["Inspection created with status SCHEDULED and attempt_number 1, consuming one aggregate slot on slot_date", "recompute project.posture"]
  - method: GET
    path: "/reroof/permit-applications/{id}/inspections"
    description: "List the inspections booked under one permit application."
    roles: [ProjectCoordinator, RoofingContractor, SolarOwner, SystemOwner, AHJInspector]
    code: 200
    input: ["status?", "inspection_type?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/reroof/inspections/{id}"
    description: "Read one inspection including its slot date, window, attempt number and result."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner, AHJInspector]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/reroof/inspections/{id}/result"
    description: "Record the inspector's PASS, FAIL or CORRECTION result. PASS and FAIL release the AHJ slot; CORRECTION keeps it consumed."
    roles: [AHJInspector]
    code: 200
    input: ["result", "result_note?"]
    output: Inspection
    side_effects:
      - "status and inspected_at written; PASS or FAIL releases the slot_date slot, CORRECTION keeps it consumed"
      - "FAIL or CORRECTION drives project.posture := RESTRICTED"
      - "a PASSED ELECTRICAL_FINAL may bubble project REINSTALL -> COMMISSIONED"
  - method: POST
    path: "/reroof/work-windows"
    description: "Schedule a crew window on a party's calendar, subject to that party's symmetric mobilization buffer."
    roles: [ProjectCoordinator]
    code: 201
    input: ["project_id", "party_id", "trade", "start_utc", "end_utc", "weather_risk_score?"]
    output: WorkWindow
    side_effects: ["WorkWindow created with status SCHEDULED and supersedes_window_id null, occupying the party's interval"]
  - method: GET
    path: "/reroof/work-windows/{id}"
    description: "Read one crew window."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner]
    code: 200
    input: []
    output: WorkWindow
    side_effects: []
  - method: GET
    path: "/reroof/work-windows"
    description: "List crew windows, filterable by project, party, status and the aborted window they replace."
    roles: [ProjectCoordinator, SolarContractor, RoofingContractor, SolarOwner, SystemOwner]
    code: 200
    input: ["project_id?", "party_id?", "supersedes_window_id?", "status?", "limit?", "offset?"]
    output: WorkWindow[]
    side_effects: []
  - method: POST
    path: "/reroof/work-windows/{id}/status"
    description: "Advance a crew window: START, COMPLETE or WEATHER_ABORT."
    roles: [ProjectCoordinator, RoofingContractor, SolarContractor]
    code: 200
    input: ["action", "abort_reason?", "weather_risk_score?"]
    output: WorkWindow
    side_effects:
      - "status, actual_start_utc and actual_end_utc updated; COMPLETED, WEATHER_ABORTED and REVOKED release the party's interval"
      - "WEATHER_ABORT increments project.weather_abort_count and recomputes project.posture (>= 2 aborts restricts the project)"
  - method: POST
    path: "/reroof/work-windows/{id}/reschedule"
    description: "Replace a weather-aborted window with a new one, marking the original SUPERSEDED."
    roles: [ProjectCoordinator]
    code: 201
    input: ["start_utc", "end_utc", "party_id?", "weather_risk_score?"]
    output: WorkWindow
    side_effects:
      - "the aborted window's status := SUPERSEDED"
      - "a new SCHEDULED WorkWindow is created with supersedes_window_id := the aborted window's id"
  - method: POST
    path: "/reroof/sourcing-orders"
    description: "Source a replacement for a damaged module or optimizer; classifies the offered part EXACT, COMPATIBLE or MISMATCHED under the mismatched-model rules."
    roles: [ProjectCoordinator]
    code: 201
    input: ["project_id", "hardware_unit_id", "requested_model_code", "offered_manufacturer", "offered_model_code", "offered_rated_watts", "unit_cost_cents", "expected_project_version", "waiver_ref?"]
    output: SourcingOrder
    side_effects:
      - "watt_delta_pct, tolerance_pct, match_class and status computed by calculations.replacement_match_classification"
      - "a non-EXACT match resets project.warranty_notice_status FILED -> PENDING"
      - "increments ReroofProject.version by 1"
  - method: GET
    path: "/reroof/sourcing-orders/{id}"
    description: "Read one sourcing order including its match classification and applied tolerance."
    roles: [ProjectCoordinator, SolarContractor, SystemOwner, SolarOwner]
    code: 200
    input: []
    output: SourcingOrder
    side_effects: []
  - method: GET
    path: "/reroof/sourcing-orders"
    description: "List sourcing orders, filterable by project, target unit, status and match class."
    roles: [ProjectCoordinator, SolarContractor, SystemOwner, SolarOwner]
    code: 200
    input: ["project_id?", "hardware_unit_id?", "status?", "match_class?", "limit?", "offset?"]
    output: SourcingOrder[]
    side_effects: []
  - method: POST
    path: "/reroof/sourcing-orders/{id}/review"
    description: "Third-party system owner decision on a sourcing order that needs review because the offered part is not an exact match."
    roles: [SystemOwner]
    code: 200
    input: ["decision", "review_note?"]
    output: SourcingOrder
    side_effects: ["status PENDING_REVIEW -> APPROVED or REJECTED"]
  - method: POST
    path: "/reroof/sourcing-orders/{id}/receipt"
    description: "Receive the replacement part and write it onto the damaged unit, subject to the circuit watt-spread rule."
    roles: [ProjectCoordinator]
    code: 200
    input: [received_serial_number]
    output: SourcingOrder
    side_effects:
      - "status APPROVED -> RECEIVED, received_at := clock_now"
      - "target HardwareUnit condition_grade DAMAGED -> REPLACED with manufacturer, model_code, rated_watts and serial_number overwritten"
      - "recompute project.damaged_unit_count"
  - method: POST
    path: "/reroof/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, backlog floor, off-roof-day count and downtime date range is measured against this logical clock."
    roles: [ProjectCoordinator]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
    side_effects: ["the logical clock used by every clock_now reference is set to to_iso8601"]
  - method: POST
    path: "/reroof/_ledger/perturb"
    description: "Test-driving endpoint that adds released_delta_cents to ReroofProject.credit_released_cents WITHOUT touching credit_authorized_cents, deliberately breaking the credit ledger identity so the defensive priority-31 guard on credit settlement is reachable. No business workflow reaches an unbalanced ledger; this endpoint exists only to prove the guard fires."
    roles: [ProjectCoordinator]
    code: 200
    input: [project_id, released_delta_cents]
    output: ReroofProject
    side_effects:
      - "project.credit_released_cents += released_delta_cents (credit_authorized_cents, credit_reserved_cents and credit_settled_cents are untouched, so the identity credit_authorized_cents == credit_reserved_cents + credit_settled_cents + credit_released_cents no longer holds)"
      - "project.version += 1"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_PARTY_NOT_ON_PROJECT
    http: 403
    condition: "an entity_backed actor's X-User-ID does not match the resource's owning party or jurisdiction foreign key"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the party completing a DeckFinding upgrade is the same party that scoped it"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "no ReroofProject with the given id"
  - id: ERR_PARTY_NOT_FOUND
    http: 404
    condition: "no Party with the given id"
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "no Jurisdiction with the given id"
  - id: ERR_APPROVAL_NOT_FOUND
    http: 404
    condition: "no PartyApproval with the given id"
  - id: ERR_CIRCUIT_NOT_FOUND
    http: 404
    condition: "no ArrayCircuit with the given id"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "no HardwareUnit with the given id"
  - id: ERR_BIN_NOT_FOUND
    http: 404
    condition: "no StorageBin with the given id"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "no DeckFinding with the given id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "no PermitApplication with the given id"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "no Inspection with the given id"
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "no WorkWindow with the given id"
  - id: ERR_SOURCING_ORDER_NOT_FOUND
    http: 404
    condition: "no SourcingOrder with the given id"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required body field, illegal enum member, out-of-range number, unparseable timestamp, empty accepts_unit_types, or pagination limit outside 1..100"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the current ReroofProject.version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the resource's current state"
  - id: ERR_APPROVAL_ROUND_STALE
    http: 409
    condition: "a PartyApproval decision is submitted while approval.round_recorded is behind project.negotiation_round"
  - id: ERR_PERMIT_NOT_SUBMITTED
    http: 409
    condition: "an Inspection is booked under a PermitApplication whose status is not SUBMITTED or APPROVED"
  - id: ERR_SETTLEMENT_NOT_READY
    http: 409
    condition: "credit settlement is requested on a project whose phase is not COMMISSIONED"
  - id: ERR_CIRCUIT_NOT_ISOLATED
    http: 409
    condition: "a unit removal or reinstall is attempted while its ArrayCircuit.status is not ISOLATED"
  - id: ERR_PROJECT_POSTURE_FROZEN
    http: 409
    condition: "a gated operation is attempted while project.posture == FROZEN"
  - id: ERR_PROJECT_POSTURE_RESTRICTED
    http: 409
    condition: "a reinstall or re-energization is attempted while project.posture == RESTRICTED"
  - id: ERR_WARRANTY_NOTICE_MISSING
    http: 409
    condition: "a unit is reinstalled on a LEASE or PPA project whose warranty_notice_status is not FILED"
  - id: ERR_UNIT_NOT_SERVICEABLE
    http: 409
    condition: "a unit whose condition_grade is UNINSPECTED or DAMAGED is submitted for reinstall"
  - id: ERR_CIRCUIT_UNITS_NOT_REINSTALLED
    http: 409
    condition: "a circuit is re-energized while it still carries a non-SCRAPPED unit that is not REINSTALLED"
  - id: ERR_CROSS_PROJECT_REFERENCE
    http: 422
    condition: "a circuit, storage bin or hardware unit referenced in the request belongs to a different project"
  - id: ERR_PARTY_TYPE_MISMATCH
    http: 422
    condition: "a referenced Party has the wrong party_type for the field, a SYSTEM_OWNER is supplied on a HOST_OWNED project (or omitted on a LEASE/PPA project), or an approval's party is not the project's party of that type"
  - id: ERR_MODEL_MISMATCH_NOT_WAIVED
    http: 422
    condition: "a sourcing order classified MISMATCHED is submitted without a waiver_ref"
  - id: ERR_CIRCUIT_WATT_SPREAD_EXCEEDED
    http: 422
    condition: "receiving the replacement would push the circuit's same-unit_type watt spread above MAX_CIRCUIT_WATT_SPREAD_PCT"
  - id: ERR_INVALID_WINDOW_BOUNDS
    http: 422
    condition: "end_utc is not strictly after start_utc, an inspection window spans two UTC dates, or slot_date does not equal the UTC date of window_start_utc"
  - id: ERR_INSPECTION_BACKLOG_VIOLATION
    http: 422
    condition: "window_start_utc is earlier than clock_now plus the jurisdiction's backlog_days"
  - id: ERR_CREW_WINDOW_CONFLICT
    http: 409
    condition: "the candidate interval collides with another SCHEDULED or IN_PROGRESS window on the same party once the mobilization buffer is applied on both sides"
  - id: ERR_INSPECTION_SLOT_FULL
    http: 409
    condition: "the jurisdiction already holds inspection_slots_per_day SCHEDULED or CORRECTION_REQUIRED inspections on the candidate slot_date"
  - id: ERR_BIN_UNIT_TYPE_REJECTED
    http: 422
    condition: "the unit's unit_type is not in the target bin's accepts_unit_types"
  - id: ERR_DUPLICATE_SERIAL
    http: 409
    condition: "serial_number already exists on another HardwareUnit of the same project"
  - id: ERR_DUPLICATE_BIN_LABEL
    http: 409
    condition: "bin_label already exists on another StorageBin of the same project"
  - id: ERR_DUPLICATE_CIRCUIT_LABEL
    http: 409
    condition: "circuit_label already exists on another ArrayCircuit of the same project"
  - id: ERR_DUPLICATE_APPROVAL_PARTY
    http: 409
    condition: "a PartyApproval already exists for this (project_id, party_id) pair"
  - id: ERR_BIN_CAPACITY_EXCEEDED
    http: 409
    condition: "the target bin's occupied_slots already equals capacity_slots"
  - id: ERR_UPGRADE_BUDGET_EXCEEDED
    http: 402
    condition: "scoping the finding would push project.scoped_upgrade_cost_cents above project.upgrade_budget_cents"
  - id: ERR_CREDIT_LEDGER_UNBALANCED
    http: 409
    condition: "the credit ledger identity does not hold when settlement is requested"

roles:
  - name: ProjectCoordinator
    description: "SunSystem Technology coordinator who owns the reroof project record, the permit paperwork, the crew calendar, replacement sourcing and the downtime credit ledger."
    identity: opaque
    exclusive_operations:
      - "POST /reroof/parties"
      - "POST /reroof/jurisdictions"
      - "POST /reroof/projects"
      - "POST /reroof/projects/{id}/party-approvals"
      - "POST /reroof/projects/{id}/array-circuits"
      - "POST /reroof/projects/{id}/storage-bins"
      - "POST /reroof/projects/{id}/warranty-notice"
      - "POST /reroof/projects/{id}/credit-settlement"
      - "POST /reroof/permit-applications"
      - "POST /reroof/permit-applications/{id}/submission"
      - "POST /reroof/permit-applications/{id}/inspections"
      - "POST /reroof/work-windows"
      - "POST /reroof/work-windows/{id}/reschedule"
      - "POST /reroof/sourcing-orders"
      - "POST /reroof/sourcing-orders/{id}/receipt"
      - "POST /reroof/_clock/set_current_utc"
      - "POST /reroof/_ledger/perturb"
    shared_operations:
      - "POST /reroof/work-windows/{id}/status (with RoofingContractor and SolarContractor)"
      - "all GET reads"
  - name: SolarContractor
    description: "SunSystem solar crew that de-energizes the array, removes and labels units into storage, grades condition and reinstalls."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /reroof/array-circuits/{id}/energization"
      - "POST /reroof/projects/{id}/hardware-units"
      - "POST /reroof/hardware-units/{id}/removal"
      - "POST /reroof/hardware-units/{id}/storage"
      - "POST /reroof/hardware-units/{id}/condition-grade"
      - "POST /reroof/hardware-units/{id}/reinstall"
    shared_operations:
      - "POST /reroof/work-windows/{id}/status (with ProjectCoordinator and RoofingContractor)"
      - "GET reads on projects, circuits, bins, units, windows and sourcing orders"
  - name: RoofingContractor
    description: "Roofer of record. Records deck condition findings and drives attachment/flashing upgrades; also one of the three consenting parties. Segregation of duties applies: the roofer party that scopes an upgrade may not sign its completion."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /reroof/projects/{id}/deck-findings"
      - "POST /reroof/deck-findings/{id}/upgrade"
    shared_operations:
      - "POST /reroof/party-approvals/{id}/decision (with SolarOwner and SystemOwner)"
      - "POST /reroof/work-windows/{id}/status (with ProjectCoordinator and SolarContractor)"
      - "GET reads on projects, approvals, findings, permits, inspections, units and windows"
  - name: SolarOwner
    description: "Homeowner / host customer who owns the roof and, on a HOST_OWNED system, the array. One of the three consenting parties."
    identity: "entity_backed:Party"
    exclusive_operations: []
    shared_operations:
      - "POST /reroof/party-approvals/{id}/decision (with RoofingContractor and SystemOwner)"
      - "GET reads on their projects, approvals, findings, permits, inspections, units, windows, sourcing orders and the downtime summary"
  - name: SystemOwner
    description: "Third-party lease/PPA system owner. Consenting party with veto power that withdraws project authorization, and the reviewer of non-exact replacement parts."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /reroof/sourcing-orders/{id}/review"
    shared_operations:
      - "POST /reroof/party-approvals/{id}/decision (with RoofingContractor and SolarOwner)"
      - "GET reads on their projects, approvals, findings, permits, inspections, units, windows, sourcing orders and the downtime summary"
  - name: AHJInspector
    description: "Authority-having-jurisdiction plan reviewer and field inspector. Decides permit applications and records inspection results for its own jurisdiction only."
    identity: "entity_backed:Jurisdiction"
    exclusive_operations:
      - "POST /reroof/permit-applications/{id}/decision"
      - "POST /reroof/inspections/{id}/result"
    shared_operations:
      - "GET reads on jurisdictions, permits, inspections, findings and projects"
