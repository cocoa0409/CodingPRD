      - name: corner_state_parallel_dimensions_independent
        claim_type: Valid Transition
        grounds:
          - state_machines.ReturnLine.disposition_state
          - state_machines.ReturnLine.financial_state
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: "non_linear_state_machine / return_line_parallel_dimensions_evolve_independently"
          rationale: "The parallel-shape claim (the two ReturnLine dimensions advance on different triggers and the combined state is correct at every step) is exactly what the named §1.8 instance asserts end to end."

      - name: corner_state_cyclic_rework_loop_terminates
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RefurbWorkOrder.transitions[TEST_FAILED -> IN_TEST]
          - validations[priority 45 ERR_REWORK_LIMIT_EXCEEDED]
          - errors.ERR_REWORK_LIMIT_EXCEEDED
        excluded_because:
          difficulty_instance: "non_linear_state_machine / refurb_work_order_rework_cycle_terminates_at_two"
          rationale: "The cyclic-shape termination claim (the TEST_FAILED -> IN_TEST loop is admitted twice and the third start-test fails with ERR_REWORK_LIMIT_EXCEEDED) is the whole subject of the named §1.8 instance."

      - name: corner_state_bubble_up_rma_closes_when_all_lines_dispositioned
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ReturnAuthorization.transitions[RECEIVED -> CLOSED]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / rma_close_depends_on_every_sibling_return_line_dispositioned"
          rationale: "The bubble-up claim (the parent closes only once every sibling line is DISPOSITIONED, and not on the first one) is asserted in both directions by the named §1.8 instance."

      - name: corner_state_cascade_down_from_execute
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DispositionOrder.transitions[APPROVED -> EXECUTED]
          - state_machines.ReturnLine.transitions[DISPOSITION_ASSIGNED -> DISPOSITIONED]
        excluded_because:
          difficulty_instance: "transitive_cascade / execute_destroy_order_cascades_to_client_suspension_and_rma_close"
          rationale: "The multi-level cascade-down chain fired by one execute call (order, line, ledger, client aggregates, client suspension, parent RMA) is traced link by link in the named §1.8 instance."

      - name: corner_state_conditional_cascade_on_mandatory_recall
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ReturnLine.transitions[DISPOSITION_ASSIGNED -> DISPOSITION_ASSIGNED]
          - state_machines.RefurbWorkOrder.transitions[IN_TEST -> ABANDONED]
        excluded_because:
          difficulty_instance: "transitive_cascade / mandatory_recall_cascades_through_refurb_abandon_to_shrink_ledger"
          rationale: "The conditional-cascade claim (a MANDATORY recall touches only the non-terminal work orders and re-steers only the still-open lines) is the named §1.8 instance's core assertion."

      - name: corner_state_compensation_on_disposition_order_cancel
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DispositionOrder.transitions[APPROVED -> CANCELLED]
          - calculations.client_unit_conservation
        excluded_because:
          difficulty_instance: "compensating_invariant / unit_conservation_survives_disposition_order_cancel"
          rationale: "The compensation claim (cancelling an approved order returns the reserved units to units_in_process with no drift in the conserved total) is the named §1.8 instance."

      - name: corner_state_ledger_sync_on_refund_reversal
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ReturnLine.transitions[REFUNDED -> CLAWED_BACK]
          - calculations.client_settlement_balance
        excluded_because:
          difficulty_instance: "compensating_invariant / settlement_balance_conservation_survives_refund_reversal"
          rationale: "The ledger-sync claim (a REVERSAL row restores settlement_balance_cents to its pre-refund value while both original rows survive) is the named §1.8 instance."

  # =================================================================== #
  # SECTION 3 — calculations                                            #
  # =================================================================== #
  - section: calculations
    instances:
      - name: corner_calc_expected_weight_is_tare_plus_authorized_line_weights
        claim_type: Correct Result
        grounds:
          - calculations.receipt_expected_weight
          - endpoints[POST /receipts]
        distinguishing_aspect: "For an RMA authorizing 3 units of a 1200-gram SKU and 2 units of a 500-gram SKU, expected_weight_grams == 4800 == 200 + 3 * 1200 + 2 * 500, and a carton weighing exactly 4800 grams is not flagged."
        test_recipe:
