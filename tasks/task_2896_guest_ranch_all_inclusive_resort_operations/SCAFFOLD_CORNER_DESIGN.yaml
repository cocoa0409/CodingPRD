            - "80377 == round_half_up(120000 * 71 / 106) and the GET never advances StaffMember.version"

      - name: season_advance_refuses_to_skip_a_lifecycle_step
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /seasons/{seasonId}/advance]
          - state_machines.Season.season_status
          - validations[priority=16]
        distinguishing_aspect: "The action endpoint walks exactly one step: PLANNING cannot jump straight to IN_SEASON (ERR_INVALID_SEASON_TRANSITION) and cannot go backwards to PLANNING once OPEN, but the single legal step succeeds and bumps the version."
        test_recipe:
          setup:
            - "a freshly created season in PLANNING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RanchManager
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id, status_new: $.data.season_status, v_new: $.data.version }
          trigger:
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "IN_SEASON" }
              as: RanchManager
              captures: { err_skip: $.data.error_id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
              captures: { status_open: $.data.season_status, v_open: $.data.version }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "PLANNING" }
              as: RanchManager
              captures: { err_back: $.data.error_id }
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: RanchManager
              captures: { status_final: $.data.season_status, v_final: $.data.version }
          assert:
            - "${status_new} == PLANNING"
            - "${err_skip} == ERR_INVALID_SEASON_TRANSITION with HTTP 409"
            - "${status_open} == OPEN"
            - "${v_open} == ${v_new} + 1"
            - "${err_back} == ERR_INVALID_SEASON_TRANSITION with HTTP 409"
            - "${status_final} == OPEN"
            - "${v_final} == ${v_open}"
            - "neither rejected advance ran season_financial_rollup"

