      - call: POST /v1/domains/${dom_id}/verify
        payload:
          outcome: SUCCESS
        as: Developer
      - call: GET /v1/domains/${dom_id}/certificates
        as: TeamOwner
        captures:
          cert_id: $.data.0.id
      trigger:
      - call: POST /v1/certificates/${cert_id}/complete
        payload: {}
        as: SystemWebhook
      assert:
      - Certificate.${cert_id}.not_before == '2026-09-01T00:00:00Z' (fixed default, not wall clock)
      - Certificate.${cert_id}.not_after == '2026-11-30T00:00:00Z' (not_before + 90 days)
