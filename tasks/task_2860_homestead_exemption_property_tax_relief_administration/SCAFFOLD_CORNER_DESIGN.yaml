      - name: info_request_round_limit_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors[ERR_INFO_REQUEST_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: application_information_request_cycle_bounded_at_two_rounds
          rationale: "The §1.8 non_linear_state_machine instance drives the UNDER_REVIEW -> INFO_REQUESTED cycle to its bound and asserts the third REQUEST_INFO rejection verbatim."

      - name: fraud_hold_and_unowned_destination_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_FRAUD_HOLD_ACTIVE]
          - errors[ERR_DESTINATION_NOT_OWNED]
        excluded_because:
          difficulty_instance: fraud_hold_beats_unowned_destination_on_freeze_port
          rationale: "The §1.8 priority_pair_validation_conflict instance triggers both codes on one port request and asserts that the fraud hold wins, which is strictly stronger than isolated triggers of either code."

      - name: hearing_slot_buffer_conflict_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_HEARING_SLOT_CONFLICT]
        excluded_because:
          difficulty_instance: hearing_buffer_gap_of_exactly_fifteen_minutes_collides_sixteen_clears
          rationale: "The §1.8 boundary_precision_check instance pins the 15-minute buffer at its exact boundary in both directions, covering this error's only trigger."

      - name: occupancy_interval_overlap_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_OCCUPANCY_INTERVAL_OVERLAP]
        excluded_because:
          difficulty_instance: occupancy_intervals_touch_at_endpoints_but_reject_true_overlap
          rationale: "The §1.8 resource_temporal_overlap instance asserts both the accepted touching-endpoint case and the rejected true overlap on the same parcel."

      - name: docket_capacity_limit_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations[priority=27]
          - errors[ERR_DOCKET_CAPACITY_REACHED]
        excluded_because:
          difficulty_instance: docket_aggregate_capacity_blocks_a_slot_no_other_hearing_touches
          rationale: "The §1.8 resource_temporal_overlap instance fills a docket to capacity and asserts the capacity refusal ahead of any interval conflict."

      - name: recovery_payment_over_the_balance_covered_by_the_difficulty_design
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
        excluded_because:
          difficulty_instance: abatement_restores_the_taxpayer_money_ledger_to_its_pre_assessment_value
          rationale: "The §1.8 compensating_invariant instance already rejects a 300000 payment against a 246750 outstanding balance before abating the case, asserting recovery_paid_cents stays 0."

  # ===========================================================================
  # RBAC — the claim-extraction guide's RBAC section has no claim_type table, so
  # the claim_type values below are the guide's own RBAC vocabulary:
  # role_denied / ownership_check / segregation_of_duties / unauthenticated.
  # ===========================================================================
  - section: rbac
    instances:

      - name: intake_clerk_cannot_determine_an_application
        claim_type: role_denied
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED_ROLE]
          - endpoints[POST /exemption-applications/{id}/determine]
          - endpoints[POST /parcels]
          - roles.IntakeClerk
          - roles.ExemptionsReviewer
        distinguishing_aspect: "The role gate is evaluated from the endpoint's own roles list before any state or payload check: the very same determine body that an ExemptionsReviewer executes successfully is refused with ERR_UNAUTHORIZED_ROLE for an IntakeClerk, and the refusal leaves application.status at UNDER_REVIEW and application.version unchanged, proving nothing was applied."
        test_recipe:
          setup:
            - "One parcel, one taxpayer and one submitted application that reached UNDER_REVIEW via its first VerificationCheck."
            - "The IntakeClerk owns POST /exemption-applications and POST /exemption-applications/{id}/submit but is absent from the roles list of both POST /exemption-applications/{id}/determine and POST /parcels."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "TERESA OWNER", date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id }
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app_id: $.data.id }
            - call: "POST /exemption-applications/${app_id}/submit"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /exemption-applications/${app_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
          trigger:
            - call: "POST /exemption-applications/${app_id}/determine"
              payload: { outcome: "DENY", denial_reason: "OCCUPANCY_NOT_ESTABLISHED", expected_parcel_version: "${p1_v}" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { e_role_det: $.data.error_id }
            - call: "POST /parcels"
              payload: { apn: "P-0002", situs_address_normalized: "200 ELM ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 20000000, market_value_cents: 25000000, assessment_cap_pct_bps: 200 }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { e_role_parcel: $.data.error_id }
            - call: "GET /exemption-applications/${app_id}"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { st_mid: $.data.status }
            - call: "POST /exemption-applications/${app_id}/determine"
              payload: { outcome: "DENY", denial_reason: "OCCUPANCY_NOT_ESTABLISHED", expected_parcel_version: "${p1_v}" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { st_final: $.data.status }
          assert:
            - "${e_role_det} == ERR_UNAUTHORIZED_ROLE with HTTP 403"
            - "${e_role_parcel} == ERR_UNAUTHORIZED_ROLE with HTTP 403 and GET /parcels/${p1_id} remains the only parcel"
            - "${st_mid} == UNDER_REVIEW — the refused determine changed nothing"
            - "${st_final} == DENIED with HTTP 200: the identical body succeeds for ExemptionsReviewer, so only the role differed"
            - "Parcel.${p1_id}.version is still 1 after all four calls (a DENY outcome never re-runs the parcel decomposition)"

      - name: taxpayer_cannot_read_another_taxpayers_account
        claim_type: ownership_check
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_TAXPAYER_NOT_FOUND]
          - endpoints[GET /taxpayer-accounts/{id}]
          - roles.Taxpayer
        distinguishing_aspect: "GET /taxpayer-accounts/{id} admits both a staff role and the entity-backed Taxpayer role, so the same path is 200 for three of four callers: the owning Taxpayer and the ExemptionsReviewer both read it, a different Taxpayer gets ERR_NOT_RESOURCE_OWNER, and an unknown id gets ERR_TAXPAYER_NOT_FOUND rather than the ownership error because a non-existent row has no owner to compare against."
        test_recipe:
          setup:
            - "Two independent TaxpayerAccount rows; the Taxpayer role is entity_backed, so X-User-ID must equal the addressed account id to pass the ownership check."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "TERESA OWNER", date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t1_id: $.data.id }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "NORMAN NEIGHBOR", date_of_birth: "1960-07-22", ssn_last4: "8765", mailing_address_normalized: "200 ELM ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t2_id: $.data.id }
          trigger:
            - call: "GET /taxpayer-accounts/${t1_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${t2_id}"
              captures: { e_owner: $.data.error_id }
            - call: "GET /taxpayer-accounts/${t1_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${t1_id}"
              captures: { own_name: $.data.full_name }
            - call: "GET /taxpayer-accounts/${t1_id}"
              payload: {}
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { staff_name: $.data.full_name }
            - call: "GET /taxpayer-accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Taxpayer
              as_user_id: "${t2_id}"
              captures: { e_missing: $.data.error_id }
          assert:
            - "${e_owner} == ERR_NOT_RESOURCE_OWNER with HTTP 403"
            - "${own_name} == TERESA OWNER with HTTP 200 — the owning taxpayer reads the same path successfully"
            - "${staff_name} == TERESA OWNER with HTTP 200 — ExemptionsReviewer is not ownership-bound"
            - "${e_missing} == ERR_TAXPAYER_NOT_FOUND with HTTP 404, not ERR_NOT_RESOURCE_OWNER: priority 6 preempts priority 3 when the row does not exist"

      - name: determination_by_the_intake_clerks_own_user_id_violates_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=4]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.ExemptionApplication.fields.intake_user_id
          - entities.ExemptionApplication.fields.determined_by_user_id
          - endpoints[POST /exemption-applications/{id}/determine]
        distinguishing_aspect: "The bar is on X-User-ID, not on the role: the application is created with X-User-Role IntakeClerk and X-User-ID reviewer-01, so when reviewer-01 later sends a fully authorised ExemptionsReviewer determine it is refused with ERR_SEGREGATION_OF_DUTIES, while reviewer-02 sending the byte-identical body approves it and becomes determined_by_user_id."
        test_recipe:
          setup:
            - "A fully verifiable HOMESTEAD_BASIC application whose intake_user_id is deliberately reviewer-01."
            - "Both registry records match the claimed address and both verification checks are MATCH, so the only remaining obstacle is the segregation-of-duties bar."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /taxpayer-accounts"
