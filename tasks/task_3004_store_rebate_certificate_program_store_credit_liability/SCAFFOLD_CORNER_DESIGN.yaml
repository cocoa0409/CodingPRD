              payload: { name: "W", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.11 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Ann", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-EP2", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 10000, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] } ] }
              as: GuestService
              captures: { r: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "REJECT", rejection_reason: "illegible" }
              as: GuestService
            - call: "POST /stores/${s}/receipts/${r}/returns"
              payload: { lines: [ { line_number: 1, quantity: 1 } ] }
              as: GuestService
          trigger:
            - call: "POST /stores/${s}/rebate-submissions/${sub}/resubmit"
              payload: {}
              as: Customer
              as_user_id: "${ac}"
          assert:
            - "RebateSubmission.${sub}.status == UNDER_REVIEW and resubmit_count == 1"
            - "RebateSubmission.${sub}.provisional_award_cents == 1100 (the provisional variant recomputes with returned_quantity treated as 0 per the scaffold, so the intervening full return does NOT change the provisional figure — only a future adjudication would see it)"
            - "RebateSubmission.${sub}.rejection_reason is null after resubmit"

