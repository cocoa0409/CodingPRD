              as: StudioManager
            - call: "POST /entitlements/${ent_id}/thaw"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { fr_status2: $.data.freeze_status }
          assert:
            - "After freeze: Entitlement.${ent_id}.freeze_status == FROZEN AND lifecycle_status == ACTIVE (axes independent)"
            - "After thaw: Entitlement.${ent_id}.freeze_status == UNFROZEN AND lifecycle_status == ACTIVE"
            - "Entitlement.${ent_id}.cycle_end_utc == 2026-04-04T00:00:00Z (extended 4 days; ceil(3.5 frozen days))"
            - "Entitlement.${ent_id}.frozen_days_consumed == 4"

