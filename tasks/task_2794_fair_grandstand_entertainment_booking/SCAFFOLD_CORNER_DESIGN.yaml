      - name: expiry_outranks_stale_version_on_the_same_revise
        claim_type: cascading
        grounds:
          - validations.priority_18
          - validations.priority_24
          - errors.ERR_OFFER_EXPIRED
          - errors.ERR_INVALID_OFFER_STATE
        distinguishing_aspect: |
          One revise request violates two rules at once -- the offer has lapsed AND the
          expected_offer_version is one behind -- and the lower-priority expiry rule
          wins: ERR_OFFER_EXPIRED / 409, never ERR_STALE_OFFER_VERSION / 412. The
          refusal also cascades: the offer is auto-transitioned to EXPIRED, so a
          second, version-correct revise now reports ERR_INVALID_OFFER_STATE.
