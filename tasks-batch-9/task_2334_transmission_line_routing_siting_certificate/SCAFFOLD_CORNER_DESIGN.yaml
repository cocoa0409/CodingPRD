        claim_type: triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[ERR_UNAUTHENTICATED].check
        distinguishing_aspect: "Priority 1 runs before role resolution: a create call whose X-User-ID header is empty returns ERR_UNAUTHENTICATED (401), not ERR_UNAUTHORIZED, and writes nothing."
