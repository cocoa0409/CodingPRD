    roles: [ComplaintManager, CaseHandler, QAReviewer, ExecutiveReviewer, Auditor]
    code: 200
    input: ["complaint_id?", "linked_product_code?", "status?", "limit?", "offset?"]
    output: "RootCauseAnalysis[]"
    side_effects: []

  - method: GET
    path: "/complaint-office/rcas/{rcaId}"
    description: "Get an RCA"
