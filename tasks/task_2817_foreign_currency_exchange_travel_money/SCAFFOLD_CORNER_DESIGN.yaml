              captures: { e_conf: "$.data.error_id" }
            - call: "POST /note-assessments/${a_cft}/assess"
              payload: { outcome: "RETURNED", assessment_note: "cannot hand a fake back" }
              as: BranchManager
              as_user_id: mgr-01
              captures: { e_ret: "$.data.error_id" }
            - call: "POST /note-assessments/${a_obs}/assess"
