# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Drone Light Show Production (task_1800)
# §1.9 Coverage Index: every testable claim of §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Sections follow the claim-extraction guide.
# Logical clock default 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: site_create_and_get_roundtrip
        claim_type: creation
        grounds: [entities.Site, "endpoints: POST /api/sites"]
        distinguishing_aspect: "POST persists all eight input fields; GET returns them with id, created_at, updated_at, version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/sites", payload: { name: "Harbor Front", latitude: 34.5, longitude: -118.25, ground_length_m: 600, ground_width_m: 450, site_max_wind_kt: 15, site_max_gust_kt: 20, site_max_altitude_ft: 400 }, as: ProductionPlanner, captures: { site_id: $.data.id, v: $.data.version } }
            - { call: "GET /api/sites/${site_id}", as: FleetManager, captures: { name: $.data.name, wind: $.data.site_max_wind_kt } }
          assert:
            - "POST returns 201 with ${v} == 1 and a server-minted id"
            - "GET returns name == 'Harbor Front' and site_max_wind_kt == 15 (all inputs persisted verbatim)"

      - name: drone_defaults_applied_on_create
        claim_type: defaults
        grounds: [entities.Drone.fields.charge_pct, entities.Drone.fields.battery_cycle_count]
        distinguishing_aspect: "Omitting charge_pct and battery_cycle_count applies defaults 100 and 0; initial status AVAILABLE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/drones", payload: { serial_number: "SN-DEF-1", model: "LUM-2" }, as: FleetManager, captures: { charge: $.data.charge_pct, cycles: $.data.battery_cycle_count, status: $.data.status } }
          assert:
            - "${charge} == 100 and ${cycles} == 0 and ${status} == AVAILABLE"

      - name: drone_duplicate_serial_rejected
        claim_type: type_constraints
        grounds: [entities.Drone.fields.serial_number, "errors[ERR_DUPLICATE_SERIAL]"]
        distinguishing_aspect: "serial_number is globally unique; second create with the same serial fails with ERR_DUPLICATE_SERIAL (409)."
        test_recipe:
          setup: ["drone SN-DUP-1 registered"]
          setup_api_calls:
            - { call: "POST /api/drones", payload: { serial_number: "SN-DUP-1", model: "LUM-2" }, as: FleetManager }
          trigger:
            - { call: "POST /api/drones", payload: { serial_number: "SN-DUP-1", model: "LUM-3" }, as: FleetManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_SERIAL"

      - name: show_create_computes_pricing_and_rejects_computed_input
        claim_type: computed_fields
        grounds: [entities.ShowEvent.fields.contract_value_cents, calculations.show_contract_pricing, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "contract_value_cents/deposit_cents/balance_cents are server-computed (551250/165375/385875 for 10 drones); a client-supplied contract_value_cents is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Site A exists; clock default"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { contract: $.data.contract_value_cents, dep: $.data.deposit_cents, bal: $.data.balance_cents, l: $.data.lifecycle_status, p: $.data.payment_status, posture: $.data.readiness_posture, cnt: $.data.assigned_count } }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show X", window_start: "2026-08-14T19:00:00Z", window_end: "2026-08-14T19:30:00Z", drone_count_planned: 10, contract_value_cents: 1 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${contract} == 551250 and ${dep} == 165375 and ${bal} == 385875"
            - "initial: ${l} == PLANNING, ${p} == DEPOSIT_DUE, ${posture} == NOT_READY, ${cnt} == 0"
            - "client-supplied computed field rejected: ${err} == ERR_VALIDATION"

      - name: simulation_run_immutable_without_version
        claim_type: immutability
        grounds: [entities.SimulationRun]
        distinguishing_aspect: "SimulationRun is an append-only event (common_fields: false): response carries id and created_at but no version/updated_at; no update endpoints exist."
        test_recipe:
          setup: ["Site A; Show S; design D1"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
          trigger:
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner, captures: { run_id: $.data.id, verdict: $.data.verdict } }
            - { call: "GET /api/simulation-runs/${run_id}", as: ProductionPlanner }
          assert:
            - "${verdict} == PASS"
            - "GET response data has id and created_at but no 'version' and no 'updated_at' key (immutable event row)"

      - name: weather_reading_gust_below_wind_rejected
        claim_type: type_constraints
        grounds: [entities.WeatherReading.fields.gust_kt, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "gust_kt must be >= wind_speed_kt; gust 5 with wind 10 fails with ERR_VALIDATION."
        test_recipe:
          setup: ["Site A exists"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /api/weather-readings", payload: { site_id: "${site_id}", recorded_at: "2026-07-31T23:00:00Z", wind_speed_kt: 10, gust_kt: 5, precip_mm_hr: 0.0, temperature_c: 18 }, as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: site_coordinate_range_enforced
        claim_type: type_constraints
        grounds: [entities.Site.fields.latitude, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "latitude 95 is outside [-90, 90] and rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/sites", payload: { name: "Bad Site", latitude: 95, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: show_window_inverted_rejected
        claim_type: type_constraints
        grounds: [entities.ShowEvent.fields.window_end, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "window_end <= window_start is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Site A exists; clock default"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Bad Show", window_start: "2026-08-10T19:30:00Z", window_end: "2026-08-10T19:00:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: backup_window_24h_minimum_enforced
        claim_type: type_constraints
        grounds: [entities.ShowEvent.fields.backup_window_start, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "backup_window_start 12h after window_end violates the >= 24h backup gap and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Site A exists; clock default"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10, backup_window_start: "2026-08-11T07:30:00Z", backup_window_end: "2026-08-11T08:00:00Z" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION (backup start 12h after window_end < 24h minimum)"

      - name: site_missing_name_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Site.fields.name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "omitting required field 'name' fails with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/sites", payload: { latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: designs_filtered_by_show_reverse_lookup
        claim_type: listing
        grounds: [entities.ShowDesign.fields.show_event_id, "endpoints: GET /api/show-designs"]
        distinguishing_aspect: "FK reverse-reachability: GET /api/show-designs?show_event_id=<A> returns exactly A's two designs, not B's one."
        test_recipe:
          setup: ["Site A; shows A and B; A has 2 designs, B has 1"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show A", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_a: $.data.id } }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show B", window_start: "2026-08-12T19:00:00Z", window_end: "2026-08-12T19:30:00Z", drone_count_planned: 5 }, as: ProductionPlanner, captures: { show_b: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_a}", drone_count: 10, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_a}", drone_count: 10, max_altitude_ft: 320, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_b}", drone_count: 5, max_altitude_ft: 250, duration_sec: 300, min_separation_m: 3.0 }, as: ProductionPlanner }
          trigger:
            - { call: "GET /api/show-designs", payload: { show_event_id: "${show_a}" }, as: ProductionPlanner }
          assert:
            - "filtered list returns total_count == 2 and both rows belong to show ${show_a}"

      - name: design_version_numbers_increment_per_show
        claim_type: computed_fields
        grounds: [calculations.design_version_assignment]
        excluded_because:
          difficulty_instance: design_revision_loop_and_supersede_cycle
          rationale: "That instance asserts v_no1 == 1 and v_no2 == 2 for two designs on one show."

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: authorize_from_planning_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ShowEvent.DESIGN_LOCKED_to_AUTHORIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "authorize requires DESIGN_LOCKED; a PLANNING show is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Site A; Show S in PLANNING; authorization APPROVED"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: [] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
          trigger:
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (PLANNING is not a from-state for authorize)"

      - name: execute_from_ready_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ShowEvent.GO_CERTIFIED_to_EXECUTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "execute requires GO_CERTIFIED; a READY show (grid complete, no go-certification) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Site A; Show S (2 drones) in READY"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 2 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 2, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 55, max_speed_mps: 9.0 }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v1: $.data.version } }
            - { call: "POST /api/show-designs/${design_id}/lock", payload: { expected_show_event_version: "${v1}" }, as: ProductionPlanner }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { v2: $.data.version } }
            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 250, altitude_hard_ceiling_ft: 400, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${v2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_id: $.data.id } }
            - { call: "POST /api/safety-configurations/${config_id}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /api/airspace-authorizations", payload: { show_event_id: "${show_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T21:00:00Z", altitude_ceiling_ft: 450, waiver_types: [] }, as: ProductionPlanner, captures: { auth_id: $.data.id } }
            - { call: "POST /api/airspace-authorizations/${auth_id}/submit", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/airspace-authorizations/${auth_id}/decide", payload: { decision: "APPROVED" }, as: AuthorityOfficer, as_user_id: "ao-1" }
            - { call: "POST /api/show-events/${show_id}/authorize", payload: { authorization_id: "${auth_id}" }, as: ProductionPlanner }
            - { call: "POST /api/drones", payload: { serial_number: "SN-S01", model: "LUM-2" }, as: FleetManager, captures: { d1: $.data.id } }
            - { call: "POST /api/drones", payload: { serial_number: "SN-S02", model: "LUM-2" }, as: FleetManager, captures: { d2: $.data.id } }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d1}", grid_row: 0, grid_col: 0 }, as: FleetManager }
            - { call: "POST /api/launch-grid-assignments", payload: { show_event_id: "${show_id}", drone_id: "${d2}", grid_row: 0, grid_col: 1 }, as: FleetManager }
          trigger:
            - { call: "POST /api/show-events/${show_id}/execute", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (READY is not GO_CERTIFIED)"

      - name: cancel_already_cancelled_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.ShowEvent, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel is rejected with ERR_INVALID_STATE and refund_due_cents does not change."
        test_recipe:
          setup: ["Site A; Show S (2 drones, unpaid) CANCELLED at default clock (lead 235h -> T2, refund 0 since paid_total 0)"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 2 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-events/${show_id}/cancel", payload: {}, as: ProductionPlanner, captures: { due: $.data.refund_due_cents, tier: $.data.cancellation_tier } }
          trigger:
            - { call: "POST /api/show-events/${show_id}/cancel", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
            - { call: "GET /api/show-events/${show_id}", as: ProductionPlanner, captures: { due2: $.data.refund_due_cents } }
          assert:
            - "first cancel: ${tier} == T2_DEPOSIT_HALF and ${due} == 0 (nothing paid)"
            - "second cancel: ${err} == ERR_INVALID_STATE; ${due2} == 0 unchanged"

      - name: postpone_reschedule_auto_advances_to_design_locked
        claim_type: valid_transition
        grounds: [state_machines.ShowEvent.AUTHORIZED_to_POSTPONED, state_machines.ShowEvent.POSTPONED_to_PLANNING]
        distinguishing_aspect: "reschedule moves POSTPONED -> PLANNING with the new window, then the system auto-advances to DESIGN_LOCKED because the pinned design is still LOCKED."
        test_recipe:
          setup: ["Site A; Show S AUTHORIZED (pinned design LOCKED); clock default"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
