      - name: bus_unit_production_certification_and_service_dimensions_are_independent
        claim_type: parallel_dimensions
        grounds:
          - state_machines.BusUnit
        excluded_because:
          difficulty_instance: "non_linear_state_machine / bus_unit_three_dimensions_advance_independently"
          rationale: |
            The §1.8 instance already walks the whole 35-call happy path proving production_status,
            certification_status and service_status advance on independent axes (and that service_status
            only leaves NONE via a recall). A corner-level restatement would duplicate it call for call.

      - name: test_failure_cascades_from_quality_test_to_order_breach
        claim_type: cascade_down
        grounds:
          - endpoints[POST /quality-tests/{id}/record-result].side_effects
          - calculations.delivery_posture
        excluded_because:
          difficulty_instance: "transitive_cascade / cascade_a_test_failure_reaches_order_breach_and_damages"
          rationale: |
            CASCADE-A's four hops (unit NONCONFORMING, live slot RELEASED, ledger and phase revert with
            sibling tests VOIDED, order BREACHED with liquidated damages) are exercised end to end in §1.8.
            The corner set instead probes the negative side of the same rule — the inert cascade when the
            slot is already COMPLETED — inside waiver_eligibility_depends_on_which_test_type_failed.

      - name: line_ledger_stays_synchronised_with_slot_state_changes
        claim_type: ledger_sync
        grounds:
          - calculations.line_capacity_ledger
          - state_machines.BuildSlot
        excluded_because:
          difficulty_instance: "compensating_invariant / line_slot_day_ledger_returns_to_pre_commit_value_on_release"
          rationale: |
            The commit/release round trip and the exact restoration of committed_slot_days is the whole
            subject of that §1.8 instance, including the release of a middle slot and the refusal that
            follows. Only the PLANNED-slot release (which must subtract nothing) is left, and that is
            covered here by released_slot_and_awarded_solicitation_are_terminal_and_lock_further_actions.

      - name: remedy_task_completion_bubbles_up_to_campaign_status
        claim_type: bubble_up
        grounds:
          - state_machines.RemedyTask
          - state_machines.RecallCampaign
        excluded_because:
          difficulty_instance: "compensating_invariant / recall_kit_pool_conserved_across_completion_and_cancellation"
          rationale: |
            That instance already drives every RemedyTask out of OPEN/IN_PROGRESS and asserts the campaign
            flipping LAUNCHED -> COMPLETED once no task remains open, together with the kit accounting that
            moves with each transition.

      - name: slot_commit_is_guarded_by_the_lines_own_state
        claim_type: guarded_transitions
        grounds:
          - validations[priority=30]
          - state_machines.ProductionLine
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / slot_commit_gated_by_production_line_maintenance_state"
          rationale: |
            A transition on BuildSlot that is legal or illegal depending on the ProductionLine's MAINTENANCE
            state is exactly that instance's claim, including the resume that makes the same commit succeed.

