    instances:
      - name: reimbursement_flow_requires_provider_not_on_probation
        grounds:
          - state_machines.Provider.SCREENED_to_PROBATION
          - validations[priority=25]
          - errors.ERR_PROVIDER_NOT_ELIGIBLE
          - entities.Provider.fields.status
          - entities.PurchaseRequest.fields.flow
        distinguishing_aspect: |
          The PurchaseRequest's own attributes are legal in both attempts and the Account is
          ACTIVE with ample balance; only the state of a THIRD entity - Provider P4 landing in
          PROBATION because its screening score was 45 - decides the outcome, and it decides it
          per-flow: REIMBURSEMENT is refused 422 while the identical amount under PREAPPROVAL
          is accepted 201.
