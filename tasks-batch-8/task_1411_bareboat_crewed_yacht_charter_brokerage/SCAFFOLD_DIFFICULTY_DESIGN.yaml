        grounds:
          - state_machines.CharterAgreement.PENDING_SIGNATURES_to_SIGNED
          - state_machines.CharterAgreement.funds_status.UNFUNDED_to_DEPOSIT_HELD
          - state_machines.CharterAgreement.funds_status.DEPOSIT_HELD_to_FULLY_FUNDED
          - entities.CharterAgreement.fields.funds_status
        distinguishing_aspect: |
          Parallel dimensions on CharterAgreement: the funds axis advances
          UNFUNDED -> DEPOSIT_HELD -> FULLY_FUNDED while status stays pinned at
          SIGNED, and cancellation then drives both axes to their own terminal
          states (CANCELLED x REFUNDED) — the axes are observable independently
          at every step.
        test_recipe:
          setup:
