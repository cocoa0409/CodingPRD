          trigger:
            - call: "POST /credits/${credit_id}/amendments"
              payload: { change_set: { amount_cents: 12000000, tolerance_pct: 0 }, reason: "buyer increased the order; tolerance restated unchanged", expected_credit_version: "${v0}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { a1_id: $.data.id, a1_consent: $.data.requires_beneficiary_consent, a1_seq: $.data.seq }
            - call: "POST /amendments/${a1_id}/issue"
              payload: { issue_note: "favourable amendment binds on issuance" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_2"
              captures: { a1_status: $.data.status, a1_delta: $.data.exposure_delta_cents, a1_fee: $.data.amendment_fee_cents, a1_wee: $.data.window_end_effective }
            - call: "GET /credits/${credit_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { v1: $.data.version, amt1: $.data.amount_cents, com1: $.data.committed_allocation_cents, bps1: $.data.commission_bps_applied, tot1: $.data.total_charge_cents, ch1: $.data.chargeable_utilisation_cents, seq1: $.data.amendment_seq, st1: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /credits/${credit_id}/amendments"
              payload: { change_set: { presentation_period_days: 15 }, reason: "applicant wants a shorter presentation period", expected_credit_version: "${v1}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { a2_id: $.data.id, a2_consent: $.data.requires_beneficiary_consent, a2_seq: $.data.seq }
            - call: "POST /amendments/${a2_id}/issue"
              payload: { issue_note: "needs the beneficiary's word" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_2"
              captures: { a2_status: $.data.status, a2_delta: $.data.exposure_delta_cents, a2_fee: $.data.amendment_fee_cents, a2_deadline: $.data.consent_deadline_date }
          assert:
            - "${a1_consent} == false"
            - "${a1_seq} == 1"
            - "${a1_status} == ACCEPTED"
            - "${a1_delta} == 2000000"
            - "${a1_fee} == 11500"
            - "${a1_fee} != 31500"
            - "${a1_wee} == \"2026-08-10\""
            - "${amt1} == 12000000"
            - "${com1} == 12000000"
            - "${bps1} == 10"
            - "${tot1} == 25000"
            - "${ch1} == 12025000"
            - "${seq1} == 1"
            - "${st1} == ISSUED"
            - "exactly 2 FacilityAllocation rows exist for credit ${credit_id}: one RELEASED with released_cents 10025000, one OPEN with allocated_cents 12000000, charge_cents 36500 and basis AMENDED_INCREASE"
            - "CreditFacility.${fac_id}.allocated_cents == 12036500"
            - "CreditFacility.${fac_id}.available_cents == 37963500"
            - "${a2_consent} == true"
            - "${a2_seq} == 2"
            - "${a2_status} == PENDING_CONSENT"
            - "${a2_delta} == 0"
            - "${a2_fee} == 7500"
            - "${a2_deadline} == \"2026-08-23\""
            - "DocumentaryCredit.${credit_id}.status == AMENDMENT_PENDING"
            - "DocumentaryCredit.${credit_id}.presentation_period_days == 21"
            - "DocumentaryCredit.${credit_id}.amendment_seq == 1"

      - name: collateral_posted_ledger_is_a_running_total_that_cannot_go_negative
        claim_type: aggregation
        grounds:
          - calculations.collateral_posted_ledger
          - errors.ERR_COLLATERAL_RELEASE_EXCEEDS_POSTED
          - endpoints.POST_/facilities/{id}/collateral-postings
        distinguishing_aspect: |
          collateral_posted_cents is the running SUM of every posting, not the
          latest posting: +5000000 then +3000000 gives 8000000, a -2000000
          release brings it to 6000000, and a further -7000000 is refused with 422
          ERR_COLLATERAL_RELEASE_EXCEEDS_POSTED because the ledger may not go
          negative - the refused posting leaves the total at 6000000 with no
          partial write. No credit has been issued, so collateral_required_pct 50
          has granted no collateral credit yet and the separate
          ERR_COLLATERAL_RELEASE_BLOCKED guard does not fire. An implementation
          that stores only the last amount reports 3000000 after the second
          posting; one that clamps at zero accepts the fourth.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 50000000 and collateral_required_pct 50, holding no credits at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 50, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id, fv0: $.data.version }
          trigger:
            - call: "POST /facilities/${fac_id}/collateral-postings"
              payload: { amount_cents: 5000000, expected_facility_version: "${fv0}", posting_note: "first cash margin" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { p1: $.data.collateral_posted_cents, fv1: $.data.version }
            - call: "POST /facilities/${fac_id}/collateral-postings"
              payload: { amount_cents: 3000000, expected_facility_version: "${fv1}", posting_note: "top up" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { p2: $.data.collateral_posted_cents, fv2: $.data.version }
            - call: "POST /facilities/${fac_id}/collateral-postings"
              payload: { amount_cents: -2000000, expected_facility_version: "${fv2}", posting_note: "partial release" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { p3: $.data.collateral_posted_cents, fv3: $.data.version }
            - call: "POST /facilities/${fac_id}/collateral-postings"
              payload: { amount_cents: -7000000, expected_facility_version: "${fv3}", posting_note: "release more than is there" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${p1} == 5000000"
            - "${p2} == 8000000"
            - "${p2} != 3000000"
            - "${p3} == 6000000"
            - "trigger call 4 returns HTTP 422"
            - "${err_id} == ERR_COLLATERAL_RELEASE_EXCEEDS_POSTED"
            - "CreditFacility.${fac_id}.collateral_posted_cents == 6000000"
            - "CreditFacility.${fac_id}.version == ${fv3}"
            - "CreditFacility.${fac_id}.allocated_cents == 0"
            - "CreditFacility.${fac_id}.utilisation_posture == OPEN"

      - name: amendment_consent_window_is_a_closed_interval_with_a_cooling_off_buffer
        claim_type: interval_merge
        grounds:
          - calculations.amendment_window_overlap
          - errors.ERR_AMENDMENT_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: amendment_consent_window_closed_interval_with_cooling_off_buffer
          rationale: |
            The 1.8 resource_temporal_overlap instance already drives the closed
            interval and the symmetric two-day buffer to their exact adjacency
            boundary, rejecting the touching amendment and admitting the one that
            clears the buffer by a single day.

      - name: confirming_line_peak_occupancy_uses_half_open_intervals_and_a_capacity
        claim_type: interval_merge
        grounds:
          - calculations.confirming_line_peak_occupancy
          - errors.ERR_CONFIRMING_LINE_WINDOW_FULL
        excluded_because:
          difficulty_instance: confirming_line_peak_occupancy_half_open_window_with_capacity
          rationale: |
            The 1.8 resource_temporal_overlap instance already stacks three
            confirmation windows on one bank, proves the half-open end lets an
            abutting window in for free, and rejects only the request whose peak
            strictly exceeds confirmation_appetite_cents.

      - name: credit_allocation_variants_diverge_on_tolerance_and_tenor
        claim_type: variant_divergence
        grounds:
          - calculations.credit_allocation_exposure.variants.provisional_draft
          - calculations.credit_allocation_exposure.variants.committed_issuance
        excluded_because:
          difficulty_instance: facility_allocation_provisional_vs_committed
          rationale: |
            The 1.8 dual_variant_calc instance already runs both variants over the
            same inputs and asserts that the provisional figure suppresses both
            the tolerance and the tenor add-on while the committed figure applies
            them and the collateral offset.

      - name: settlement_variants_diverge_on_commission_rate_and_discount
        claim_type: variant_divergence
        grounds:
          - calculations.settlement_proceeds.variants.SIGHT_HONOUR
          - calculations.settlement_proceeds.variants.NEGOTIATION_UNDER_DISCOUNT
        excluded_because:
          difficulty_instance: settlement_proceeds_sight_vs_negotiation
          rationale: |
            The 1.8 dual_variant_calc instance already settles the same drawn
            amount under both variants and asserts the 12-versus-20 bps
            commission split and the presence or absence of the discount leg.

      - name: document_examination_fee_rounds_per_document_before_summing
        claim_type: precision
        grounds:
          - calculations.settlement_proceeds.constants.DOC_FEE_BPS
          - calculations.settlement_proceeds.constants.DOC_FEE_FLAT_CENTS
        excluded_because:
          difficulty_instance: doc_examination_fee_round_per_document_then_sum
          rationale: |
            The 1.8 combinatorial_formula instance already pits round-then-sum
            against sum-then-round on a document set chosen so the two orders give
            different totals, which is the whole of this claim.

      - name: commission_tier_is_keyed_on_gross_exposure_not_on_the_charged_total
        claim_type: tiered_pricing
        grounds:
          - calculations.issuance_charges.constants.COMMISSION_TIERS
        excluded_because:
          difficulty_instance: commission_tier_keyed_on_gross_not_chargeable_total
          rationale: |
            The 1.8 combinatorial_formula instance already builds a credit whose
            gross_exposure_cents sits below a tier edge while its
            chargeable_utilisation_cents sits above it, so only a tier keyed on
            the wrong input changes the answer.

  - section: validations
    instances:
      - name: applicant_kyc_pending_blocks_credit_approval
        claim_type: violation_to_error
        grounds:
