        - Rfp.${rfp1_id}.response_due_at == 2026-09-30T17:00:00.000Z
        - Rfp.${rfp1_id}.invited_count == 0 and submitted_count == 0
        - Rfp.${rfp1_id}.issued_at == null and closed_at == null
        - Rfp.${rfp1_id}.version == 1
        - GET /sourcing/proposals?rfp_id=${rfp1_id} returns 0 rows
        - MeetingEvent.${ev_id}.status == REQUIREMENTS_LOCKED (creating an Rfp does not move the event)
    - name: eliminated_shortlist_entry_is_terminal_and_rejects_further_transitions
      claim_type: Terminal State Lockdown
      grounds:
      - state_machines.VenueShortlistEntry.terminal_states
      - state_machines.VenueShortlistEntry.SHORTLISTED_to_ELIMINATED
      - endpoints[POST /sourcing/shortlist-entries/{entry_id}/eliminate]
      - errors[ERR_SHORTLIST_ENTRY_STATE_INVALID]
      - entities.MeetingEvent.fields.shortlisted_venue_count
      distinguishing_aspect: 'ELIMINATED is terminal: after the entry is eliminated once (and the event''s shortlisted_venue_count drops 1 -> 0), a second eliminate and a re-shortlist both return HTTP 409 ERR_SHORTLIST_ENTRY_STATE_INVALID, and the count is decremented exactly once - it does not go negative on the repeated call.'
      test_recipe:
