  - rule_id: combinatorial_formula
    instances:
      - name: d_pattern_score_tiered_multiplier
        grounds:
          - calculations.pattern_score_calc
          - entities.Business.fields.pattern_score
          - entities.Business.fields.watch_status
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — per-outcome weights
          (SETTLED 10 / CLOSED_UNRESOLVED 15) + overdue penalty 5, multiplied by a
          conditional size-tier factor (MEDIUM 0.75), with a single round_half_up
          at the end: raw (10 + 15 + 5) = 30 -> 30*0.75 = 22.5 -> 23. An
          implementation skipping the multiplier yields 30; rounding the sum
          before multiplying yields 22; the pinned order yields 23.
        test_recipe:
          setup:
            - "MEDIUM business with K1 SETTLED (closed 2026-08-04, not overdue) and K2 CLOSED_UNRESOLVED with ever_response_overdue == true (closed 2026-09-10)"
