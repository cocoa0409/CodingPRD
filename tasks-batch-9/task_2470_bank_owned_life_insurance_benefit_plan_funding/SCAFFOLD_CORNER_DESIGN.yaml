            - "NqdcPlan.${plan_solo_id}.accrual_liability_usd == 0.00, pbo_liability_usd == 0.00 and matched_cash_value_usd == 0.00"
            - "NqdcPlan.${plan_solo_id}.funded_ratio_bps == 10000 and funding_posture == FUNDED"
