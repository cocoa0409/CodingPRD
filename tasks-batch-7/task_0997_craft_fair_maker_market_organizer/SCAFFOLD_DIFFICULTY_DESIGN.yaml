          Pair = VendorApplication -> MakerEvent. Submit is rejected when the
          MakerEvent is in PLANNING (not yet APPLICATION_OPEN) even though
          the application itself is DRAFT and otherwise valid. The gating
          state lives on a DIFFERENT entity than the one being mutated.
