# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# Premium Seating & Suite License Management
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: license_fee_rounded_step_beats_base_indexed
        grounds:
          - calculations.license_fee_schedule
          - entities.LicenseAgreement.fields.fee_schedule_cents
        distinguishing_aspect: |
          Entity domain = LicenseAgreement fee schedule. The canonical rounded_step
          variant compounds on each season's already-rounded fee; the base_indexed
          variant rounds once from base. For base=5001208, escalator=625bp, term=4 the
          two variants diverge from season 3: 5645896 (rounded_step) vs 5645895
          (base_indexed), and season 4: 5998765 vs 5998763.
        test_recipe:
          setup:
            - "Venue V with PLATINUM suite (cap 12), season S1 PUBLISHED (2026-09-01..2027-02-15), account ACTIVE"
            - "Clock 2026-08-01 (before season start -> no proration)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "P-001", tier: PLATINUM, capacity_seats: 12, base_annual_fee_cents: 20000000, f_b_minimum_cents: 6000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 4, base_annual_fee_cents: 5001208, escalator_bp: 625, f_b_minimum_cents: 6000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
          trigger:
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}", captures: { sched: $.data.fee_schedule_cents } }
          assert:
            - "LicenseAgreement.${ag}.fee_schedule_cents == [5001208, 5313784, 5645896, 5998765] (rounded_step canonical)"
            - "fee_schedule_cents[2] == 5645896, NOT the base_indexed value 5645895"
            - "fee_schedule_cents[3] == 5998765, NOT the base_indexed value 5998763"
            - "the LICENSE_FEE invoice for ${ag} has subtotal_cents == 5001208 (full season-1 fee, no proration)"

      - name: f_b_accrual_net_excludes_service_fee
        grounds:
          - calculations.f_b_minimum_accrual
          - entities.LicenseAgreement.fields.f_b_accrued_cents_current_season
        distinguishing_aspect: |
          Entity domain = CateringOrder accrual toward an F&B minimum (different
          domain from license fees). The canonical net_of_service_fee variant accrues
          subtotal_cents only; the gross_accrual variant would accrue total_cents.
          For the pinned fixture the delta is exactly service_fee_cents (1692).
        test_recipe:
          setup:
            - "Venue, GOLD suite (cap 20), season S1 PUBLISHED with REGULAR event E1 2026-09-10T17:00Z, account ACTIVE, agreement ACTIVE (base 12000000, esc 300bp, fb min 4000000, term 1)"
            - "Clock 2026-08-20T00:00:00Z (before E1 catering cutoff 2026-09-07T17:00Z)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Opener", event_type: REGULAR, starts_at: "2026-09-10T17:00:00Z", duration_hours: 4, rental_base_price_cents: 500000 }, as: StadiumAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/catering-orders", payload: { event_id: "${e1}", suite_id: "${su}", agreement_id: "${ag}", package_tier: PREMIUM, guest_count: 12, lines: [ { item_code: "APP", description: "Sliders", quantity: 2, unit_price_cents: 1250, discount_pct: 0.10 }, { item_code: "PLT", description: "Carving station", quantity: 1, unit_price_cents: 4750 }, { item_code: "DES", description: "Dessert bites", quantity: 5, unit_price_cents: 640, discount_pct: 0.25 } ] }, as: AccountHolder, as_user_id: "${ac}", captures: { co: $.data.id } }
          trigger:
            - { call: "POST /api/catering-orders/${co}/set_status", payload: { target_status: "CONFIRMED" }, as: EventServicesManager }
            - { call: "GET /api/agreements/${ag}", payload: {}, as: PremiumSalesRep, captures: { accrual: $.data.f_b_accrued_cents_current_season } }
          assert:
            - "CateringOrder.${co}.subtotal_cents == 9400 and service_fee_cents == 1692 and total_cents == 11092"
            - "LicenseAgreement.${ag}.f_b_accrued_cents_current_season == 9400 (net variant), NOT 11092 (gross variant); delta == service_fee_cents == 1692"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: rental_quote_tier_overage_playoff_interaction
        grounds:
          - calculations.rental_price_quote
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tiered multiplier by
          suite tier, max() overage beyond capacity, conditional 1.25x PLAYOFF
          surcharge. PLAYOFF/GOLD/24 guests over cap 20: (1200000*1.00 + 4*1500)*1.25
          = 1507500; same event with 20 guests (no overage) = 1500000.
        test_recipe:
          setup:
            - "Venue, GOLD suite cap 20, season S1 PUBLISHED, PLAYOFF event E5 2027-01-10T20:00Z base 1200000, account ACTIVE"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Semifinal", event_type: PLAYOFF, starts_at: "2027-01-10T20:00:00Z", duration_hours: 5, rental_base_price_cents: 1200000 }, as: StadiumAdmin, captures: { e5: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "Beta LLC", account_type: CORPORATE, tax_id: "T-200", billing_email: "ap@beta.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
          trigger:
            - { call: "POST /api/rentals", payload: { event_id: "${e5}", suite_id: "${su}", account_id: "${ac}", guest_count: 24 }, as: PremiumSalesRep, captures: { r1: $.data.id, q1: $.data.quoted_price_cents, d1: $.data.deposit_cents } }
            - { call: "POST /api/rentals", payload: { event_id: "${e5}", suite_id: "${su}", account_id: "${ac}", guest_count: 20 }, as: PremiumSalesRep, captures: { r2: $.data.id, q2: $.data.quoted_price_cents, d2: $.data.deposit_cents } }
          assert:
            - "SingleEventRental.${r1}.quoted_price_cents == 1507500 and deposit_cents == 452250 (tier 1.00 x base 1200000 + overage 6000, then x1.25 playoff; deposit = round_half_up(1507500*0.30))"
            - "SingleEventRental.${r2}.quoted_price_cents == 1500000 and deposit_cents == 450000 (overage zeroed by max(0, 20-20))"
            - "q1 - q2 == 7500 (the 6000 overage amplified by the 1.25 playoff surcharge proves multiplicative interaction, not additive)"

      - name: catering_total_per_line_then_sum_rounding
        grounds:
          - calculations.catering_order_total
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Pinned order is per-line
          round_half_up THEN sum. Two identical lines (qty 3 @ 999, 15% off):
          per-line 2547+2547 = 5094; the forbidden sum-then-round gives 5095.
        test_recipe:
          setup:
            - "Venue, GOLD suite cap 20, season S1 PUBLISHED with REGULAR event E1, account ACTIVE with ACTIVE agreement on the suite"
            - "Clock 2026-08-20 (before E1 cutoff)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Opener", event_type: REGULAR, starts_at: "2026-09-10T17:00:00Z", duration_hours: 4, rental_base_price_cents: 500000 }, as: StadiumAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: StadiumAdmin }
          trigger:
            - { call: "POST /api/catering-orders", payload: { event_id: "${e1}", suite_id: "${su}", agreement_id: "${ag}", package_tier: STANDARD, guest_count: 6, lines: [ { item_code: "WNG", description: "Wings", quantity: 3, unit_price_cents: 999, discount_pct: 0.15 }, { item_code: "WNG2", description: "Wings encore", quantity: 3, unit_price_cents: 999, discount_pct: 0.15 } ] }, as: AccountHolder, as_user_id: "${ac}", captures: { co: $.data.id } }
          assert:
            - "CateringOrder.${co}.subtotal_cents == 5094 (per-line 2547+2547), NOT 5095 (sum-then-round)"
            - "CateringOrder.${co}.service_fee_cents == 917 (round_half_up(5094*0.18)=round_half_up(916.92))"
            - "CateringOrder.${co}.total_cents == 6011"

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_suspend_cure_cycle_restores_active
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_SUSPENDED
          - state_machines.LicenseAgreement.SUSPENDED_to_ACTIVE
          - state_machines.Account.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Cyclic machine on LicenseAgreement: ACTIVE -> SUSPENDED -> ACTIVE with
          suspension_count incrementing per lap and suspension_reason=ADMINISTRATIVE
          surviving manual account reinstate until an explicit cure.
        test_recipe:
          setup:
            - "Venue, GOLD suite, S1+S2 PUBLISHED, account ACTIVE, agreement ACTIVE (term 2 covering S1,S2), clock 2026-08-20 (license invoice issued but not yet due -> standing GOOD)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2027-28", starts_on: "2027-09-01T00:00:00Z", ends_on: "2028-02-15T00:00:00Z", renewal_window_opens_on: "2027-12-01T00:00:00Z", renewal_window_closes_on: "2028-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s2: $.data.id } }
            - { call: "POST /api/seasons/${s2}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 2, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
          trigger:
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "SUSPENDED" }, as: FinanceController }
            - { call: "GET /api/agreements/${ag}", payload: {}, as: PremiumSalesRep, captures: { st1: $.data.status, cnt1: $.data.suspension_count, rsn1: $.data.suspension_reason } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "GET /api/agreements/${ag}", payload: {}, as: PremiumSalesRep, captures: { st2: $.data.status } }
            - { call: "POST /api/agreements/${ag}/cure", payload: {}, as: FinanceController }
          assert:
            - "After account suspend: agreement status == SUSPENDED, suspension_count == 1, suspension_reason == ADMINISTRATIVE"
            - "After manual account reinstate: agreement status still == SUSPENDED (manual reinstate does NOT cure ADMINISTRATIVE suspensions)"
            - "After POST cure: agreement status == ACTIVE and suspension_reason == null and suspension_count == 1 (cycle completed exactly one lap)"

      - name: renewal_offer_counter_revise_cycle_increments_rounds
        grounds:
          - state_machines.RenewalOffer.OFFERED_to_COUNTERED
          - state_machines.RenewalOffer.COUNTERED_to_REVISED
          - state_machines.RenewalOffer.REVISED_to_ACCEPTED
        distinguishing_aspect: |
          Cyclic machine on RenewalOffer (different entity from LicenseAgreement):
          OFFERED -> COUNTERED -> REVISED -> COUNTERED -> REVISED -> ACCEPTED, with
          round_index incrementing on every lap and ACCEPTED materializing a DRAFT
          renewal agreement from the final revised terms.
        test_recipe:
          setup:
            - "Venue, GOLD suite, S1+S2+S3 PUBLISHED, agreement ACTIVE term 2 (covered S1,S2), clock 2027-12-10 inside S2 renewal window [2027-12-01, 2028-01-15]"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2027-28", starts_on: "2027-09-01T00:00:00Z", ends_on: "2028-02-15T00:00:00Z", renewal_window_opens_on: "2027-12-01T00:00:00Z", renewal_window_closes_on: "2028-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s2: $.data.id } }
            - { call: "POST /api/seasons/${s2}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2028-29", starts_on: "2028-09-01T00:00:00Z", ends_on: "2029-02-15T00:00:00Z", renewal_window_opens_on: "2028-12-01T00:00:00Z", renewal_window_closes_on: "2029-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s3: $.data.id } }
            - { call: "POST /api/seasons/${s3}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 2, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-12-10T00:00:00Z" }, as: StadiumAdmin }
            - { call: "GET /api/agreements/${ag}", payload: {}, as: PremiumSalesRep, captures: { ag_v: $.data.version } }
            - { call: "POST /api/renewal-offers", payload: { agreement_id: "${ag}", season_id: "${s3}", proposed_fee_cents: 13000000, proposed_escalator_bp: 300, proposed_term_seasons: 2, response_due_on: "2028-01-10T00:00:00Z", expected_agreement_version: "${ag_v}" }, as: PremiumSalesRep, captures: { ro: $.data.id } }
          trigger:
            - { call: "POST /api/renewal-offers/${ro}/set_status", payload: { target_status: "COUNTERED", counter_fee_cents: 12500000 }, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "POST /api/renewal-offers/${ro}/set_status", payload: { target_status: "REVISED", revised_fee_cents: 12750000 }, as: PremiumSalesRep }
            - { call: "POST /api/renewal-offers/${ro}/set_status", payload: { target_status: "COUNTERED", counter_fee_cents: 12600000 }, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "POST /api/renewal-offers/${ro}/set_status", payload: { target_status: "REVISED", revised_fee_cents: 12650000 }, as: PremiumSalesRep }
