  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: window_start_depends_on_course_play_posture
        grounds:
          - validations[priority=33]
          - state_machines.MaintenanceWindow.SCHEDULED_to_IN_PROGRESS
          - calculations.course_play_posture
          - errors.ERR_COURSE_CLOSED
        distinguishing_aspect: |
          Entity pair (MaintenanceWindow, Course): whether a window may start
          is decided by a field of a THIRD-party aggregate that the request
          never names, and the dependency is conditional on the window's own
          task_type — STORM_CLEANUP is exactly the work a closed course needs,
          so the identical start call on a CLOSED course succeeds for cleanup
          and fails for mowing.
        test_recipe:
          setup:
            - "One course with a hole 7 green and a hole 12 green."
            - "Two SCHEDULED windows on 2026-08-05 from 14:00Z to 15:00Z: MOWING on the hole 7 green and STORM_CLEANUP on the hole 12 green, both booked while the course is OPEN."
            - "Logical clock moved to 2026-08-05T12:00:00Z."
            - "A LIGHTNING event declared with expected_clear_at 2026-08-05T13:00:00Z, whose interval deliberately does NOT intersect either window, so neither window is deferred and only the play posture changes."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id, course_v1: $.data.version }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 4300, mowing_height_mm: 3.2, distance_to_water_ft: 200, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "MOWING", window_start: "2026-08-05T14:00:00Z", window_end: "2026-08-05T15:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win_mow_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green12_id}", task_type: "STORM_CLEANUP", window_start: "2026-08-05T14:00:00Z", window_end: "2026-08-05T15:00:00Z", crew_size: 5 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win_clean_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /weather-events"
              payload: { course_id: "${course_id}", event_type: "LIGHTNING", expected_clear_at: "2026-08-05T13:00:00Z", expected_course_version: "${course_v1}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { light_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows/${win_mow_id}/start"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /maintenance-windows/${win_clean_id}/start"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "Course.${course_id}.play_posture == CLOSED and frost_delay_minutes == 0"
            - "WeatherEvent.${light_id}.deferred_window_count == 0 (neither window intersects [12:00Z, 13:00Z))"
            - "both windows are still SCHEDULED immediately after the declaration, so the start refusal is not a state error"
            - "the MOWING start -> 409 ERR_COURSE_CLOSED and MaintenanceWindow.${win_mow_id}.status is still SCHEDULED with version == 1"
            - "the STORM_CLEANUP start -> 200 and MaintenanceWindow.${win_clean_id}.status == IN_PROGRESS with version == 2"
            - "TurfArea.${green12_id}.agronomic_status is still ACTIVE (only AERATION renovates an area on start)"

      - name: application_verify_depends_on_verifier_applicator_license_state
        grounds:
          - validations[priority=28]
          - state_machines.Application.RECORDED_to_VERIFIED
          - entities.Applicator.fields.license_status
          - errors.ERR_LICENSE_EXPIRED
        distinguishing_aspect: |
          Entity pair (Application, Applicator), and the dependency is on the
          CALLER's own entity-backed row rather than on a row named in the
          body: verification is refused because the verifier's licence was
          suspended by an unrelated void on a different application. The
          request carries no licence field at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T06:00:00Z."
            - "One course with a 5500 sq ft hole 7 green and a 4300 sq ft hole 12 green."
            - "Dana (CAT_3_TURF) and Miguel (CAT_3_AND_7), both licensed well into the future."
            - "Miguel records an application on the hole 12 green which the superintendent then voids for SAFETY_VIOLATION, suspending Miguel's licence."
            - "Dana then records an unrelated application on the hole 7 green."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 4300, mowing_height_mm: 3.2, distance_to_water_ft: 200, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-11001", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Miguel Ortiz", license_number: "OR-CAT37-22002", license_category: "CAT_3_AND_7", license_expires_on: "2028-03-31" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_b_id: $.data.id }
            - call: "POST /pesticide-products"
              payload: { trade_name: "Urea 46-0-0", epa_reg_no: "NA-FERT-0001", requires_license_category: "CAT_3_TURF", rei_hours: 0, min_buffer_ft: 0, max_wind_speed_mph: 15, posting_required: false, nitrogen_pct: 46 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { urea_id: $.data.id }
            - call: "POST /applications"
              payload: { turf_area_id: "${green12_id}", product_id: "${urea_id}", applicator_id: "${appl_b_id}", applied_at: "2026-08-01T06:00:00Z", rate_lb_per_acre: 200, wind_speed_mph: 5, distance_to_water_ft: 200 }
              as: Applicator
              as_user_id: "${appl_b_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /applications/${app_b_id}/void"
              payload: { void_reason: "SAFETY_VIOLATION" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /applications"
              payload: { turf_area_id: "${green7_id}", product_id: "${urea_id}", applicator_id: "${appl_a_id}", applied_at: "2026-08-01T06:00:00Z", rate_lb_per_acre: 200, wind_speed_mph: 5, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_a_id}"
              captures: { app_a_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_a_id}/verify"
              payload: {}
              as: Applicator
              as_user_id: "${appl_b_id}"
          assert:
            - "the voided record had total_lb == 19.74 and nitrogen_lb == 9.08, so TurfArea.${green12_id}.nitrogen_applied_lb_per_1000_ytd went 2.112 -> 0.000"
            - "Applicator.${appl_b_id}.license_status == SUSPENDED and suspended_at == 2026-08-01T06:00:00Z"
            - "Applicator.${appl_a_id}.license_status is still ACTIVE"
            - "the verify -> 422 ERR_LICENSE_EXPIRED"
            - "error_id != ERR_SEGREGATION_OF_DUTIES: Miguel is not the recorded applicator on ${app_a_id}, so that higher-priority rule does not fire"
            - "Application.${app_a_id}.record_status is still RECORDED, verified_by_applicator_id == null, version == 1"
            - "TurfArea.${green7_id}.nitrogen_applied_lb_per_1000_ytd == 2.113"

      - name: irrigation_run_creation_depends_on_pump_station_status
        grounds:
          - validations[priority=43]
          - state_machines.IrrigationRun.SCHEDULED_to_CANCELLED
          - errors.ERR_PUMP_OFFLINE
          - errors.ERR_RUN_STATE_INVALID
        distinguishing_aspect: |
          Entity pair (IrrigationRun, PumpStation), and the dependency runs in
          both directions in one chain: taking the station OFFLINE cancels the
          run already booked on it, and the OFFLINE status then blocks any new
          run. Because the cancellation lands first, a later complete on the old
          run reports the RUN's state rather than the STATION's, which is the
          non-obvious half of the pair.
        test_recipe:
          setup:
            - "One course, one 5500 sq ft hole 7 green and one ONLINE WELL station with a 10000 gal daily cap, a 300 gpm ceiling and 2 zones."
            - "One SCHEDULED run on that station from 04:00Z to 05:00Z at a 5 point deficit: 170.5 gal at 2.84 gpm."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "WELL", max_flow_gpm: 300, max_concurrent_zones: 2, daily_withdrawal_cap_gal: 10000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_id: $.data.id, pump_v1: $.data.version }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green7_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T05:00:00Z", target_moisture_deficit_pct: 5, expected_pump_station_version: "${pump_v1}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { run_x_id: $.data.id }
          trigger:
            - call: "PATCH /pump-stations/${pump_id}/status"
              payload: { status: "OFFLINE" }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { pump_v_offline: $.data.version }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green7_id}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T07:00:00Z", target_moisture_deficit_pct: 5, expected_pump_station_version: "${pump_v_offline}" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /irrigation-runs/${run_x_id}/complete"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "before the trigger IrrigationRun.${run_x_id}.status == SCHEDULED, allotted_gal == 170.5, flow_gpm == 2.84, volume_gal == 0"
            - "PumpStation.${pump_id}.status == OFFLINE after the PATCH"
            - "cascade: IrrigationRun.${run_x_id}.status == CANCELLED and volume_gal == 0"
            - "the new run -> 409 ERR_PUMP_OFFLINE and GET /irrigation-runs?pump_station_id=${pump_id} still returns total_count == 1"
            - "the complete on the cancelled run -> 409 ERR_RUN_STATE_INVALID, not ERR_PUMP_OFFLINE, because the run-state rule sits at priority 20 and the station rule at priority 43"
            - "Course.${course_id}.water_used_gal == 0 and PumpStation.${pump_id}.withdrawn_today_gal == 0"

      - name: task_scheduling_depends_on_target_window_state
        grounds:
          - validations[priority=19]
          - state_machines.PlanTask.PLANNED_to_SCHEDULED
          - state_machines.MaintenanceWindow.DEFERRED_to_SCHEDULED
          - errors.ERR_WINDOW_STATE_INVALID
        distinguishing_aspect: |
          Entity pair (PlanTask, MaintenanceWindow): the scheduling write is
          refused for a state the CALLEE reached through a weather cascade the
          caller never saw, and the same window identity becomes acceptable once
          it is rescheduled. The dependency is therefore on the target's state
          and not on its identity or its interval.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One course, one 5500 sq ft hole 7 green, one ACTIVE 2026 plan with an 8.00 lb budget and one PLANNED FERTILITY task at 0.85 lb per 1000."
            - "One SCHEDULED window on 2026-08-12 from 05:00Z to 07:00Z carrying no plan task."
            - "A HEAVY_RAIN event whose interval covers that window, deferring it before any task is attached."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id, course_v1: $.data.version }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 8.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.85, planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { plan_v_active: $.data.version }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", window_start: "2026-08-12T05:00:00Z", window_end: "2026-08-12T07:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win1_id: $.data.id }
            - call: "POST /weather-events"
              payload: { course_id: "${course_id}", event_type: "HEAVY_RAIN", expected_clear_at: "2026-08-12T06:00:00Z", expected_course_version: "${course_v1}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { rain_id: $.data.id }
          trigger:
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${win1_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /maintenance-windows/${win1_id}/reschedule"
              payload: { window_start: "2026-08-15T05:00:00Z", window_end: "2026-08-15T07:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${win1_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "the rain cascade left MaintenanceWindow.${win1_id}.status == DEFERRED, deferral_count == 1, plan_task_id == null, and WeatherEvent.${rain_id}.deferred_window_count == 1"
            - "the first schedule -> 409 ERR_WINDOW_STATE_INVALID"
            - "after the refusal PlanTask.${task1_id}.status is still PLANNED, AgronomicPlan.${plan_id}.committed_nitrogen_lb == 0.00 and AgronomicPlan.${plan_id}.version == ${plan_v_active}"
            - "the reschedule -> 200 with MaintenanceWindow.${win1_id}.status == SCHEDULED and deferral_count still 1"
            - "the second schedule -> 200 with PlanTask.${task1_id}.status == SCHEDULED and MaintenanceWindow.${win1_id}.plan_task_id == ${task1_id}"
            - "AgronomicPlan.${plan_id}.committed_nitrogen_lb == 4.68 after the second schedule"
            - "the second schedule reuses ${plan_v_active} successfully, proving the refused attempt bumped no version"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_windows_on_one_turf_area_conflict_on_closed_intervals
        grounds:
          - validations[priority=39]
          - errors.ERR_WINDOW_OVERLAP
          - entities.MaintenanceWindow.fields.window_start
        distinguishing_aspect: |
          Resource: a single TurfArea's crew occupancy. Interval semantics:
          CLOSED on both ends, so touching endpoints conflict — the mirror
          image of the pump-station instance. Capacity is one, so a single
          intersecting row is enough, and the conflict is scoped per area, not
          per course.
        test_recipe:
          setup:
            - "One course with a 5500 sq ft hole 7 green and a 4300 sq ft hole 12 green."
            - "One SCHEDULED MOWING window on the hole 7 green on 2026-08-05 from 05:00Z to 07:00Z."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 4300, mowing_height_mm: 3.2, distance_to_water_ft: 200, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "MOWING", window_start: "2026-08-05T05:00:00Z", window_end: "2026-08-05T07:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win1_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "TOPDRESSING", window_start: "2026-08-05T07:00:00Z", window_end: "2026-08-05T09:00:00Z", crew_size: 2 }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green12_id}", task_type: "TOPDRESSING", window_start: "2026-08-05T07:00:00Z", window_end: "2026-08-05T09:00:00Z", crew_size: 2 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win_other_area_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "TOPDRESSING", window_start: "2026-08-05T07:01:00Z", window_end: "2026-08-05T09:00:00Z", crew_size: 2 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win_after_id: $.data.id }
          assert:
            - "the 07:00Z start on the same area -> 409 ERR_WINDOW_OVERLAP, because 07:00 <= 07:00 and 05:00 <= 09:00 both hold on closed intervals"
            - "the identical interval on the hole 12 green -> 201, so the resource is the area and not the course"
            - "MaintenanceWindow.${win_other_area_id}.crew_hours == 4.00"
            - "the 07:01Z start on the same area -> 201, one minute of separation being sufficient"
            - "MaintenanceWindow.${win_after_id}.status == SCHEDULED"
            - "GET /maintenance-windows?turf_area_id=${green7_id} returns total_count == 2"

      - name: pump_station_zone_capacity_counts_half_open_intersections
        grounds:
          - validations[priority=44]
          - entities.PumpStation.fields.max_concurrent_zones
          - errors.ERR_PUMP_ZONE_CAPACITY
        distinguishing_aspect: |
          Resource: a PumpStation's simultaneous-zone capacity, a different
          resource entity with a capacity ABOVE one, so overlap alone is legal
          and only the third intersecting row breaks the limit. Interval
          semantics are HALF-OPEN, so the two back-to-back runs that touch at
          05:00Z do not count against each other at all.
        test_recipe:
          setup:
            - "One course with a 5500 sq ft hole 7 green."
            - "One ONLINE WELL station with a 10000 gal daily cap, a 300 gpm ceiling and max_concurrent_zones 2."
            - "Two SCHEDULED runs at a 5 point deficit that touch at 05:00Z: 04:00Z to 05:00Z and 05:00Z to 06:00Z, each 170.5 gal at 2.84 gpm."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "WELL", max_flow_gpm: 300, max_concurrent_zones: 2, daily_withdrawal_cap_gal: 10000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_id: $.data.id, pump_v1: $.data.version }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green7_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T05:00:00Z", target_moisture_deficit_pct: 5, expected_pump_station_version: "${pump_v1}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { run_1_id: $.data.id }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green7_id}", window_start: "2026-08-05T05:00:00Z", window_end: "2026-08-05T06:00:00Z", target_moisture_deficit_pct: 5, expected_pump_station_version: "${pump_v1}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { run_2_id: $.data.id }
          trigger:
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green7_id}", window_start: "2026-08-05T04:30:00Z", window_end: "2026-08-05T05:30:00Z", target_moisture_deficit_pct: 5, expected_pump_station_version: "${pump_v1}" }
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "both setup runs were accepted with allotted_gal == 170.5 and flow_gpm == 2.84, proving touching half-open intervals do not count as intersecting"
            - "the straddling run -> 409 ERR_PUMP_ZONE_CAPACITY, because it intersects both booked runs and 2 + 1 > 2"
            - "error_id != ERR_PUMP_FLOW_CAPACITY: the flow sum would be only 8.52 gpm against a 300 gpm ceiling"
            - "GET /irrigation-runs?pump_station_id=${pump_id} returns total_count == 2"
            - "PumpStation.${pump_id}.withdrawn_today_gal == 0 and version == ${pump_v1}"

      - name: hole_occupancy_conflict_uses_paced_half_open_windows_plus_clearance
        grounds:
          - validations[priority=40]
          - errors.ERR_WINDOW_CONFLICTS_PLAY
          - entities.PlayEvent.fields.effective_start_at
          - entities.TurfArea.fields.hole_number
        distinguishing_aspect: |
          Resource: a PlayEvent's per-hole occupancy, a third resource entity
          whose intervals are DERIVED rather than stored — hole h is occupied
          for [start + (h-1)*12min, start + h*12min) — and the window side is
          extended by a 30 minute clearance buffer before the half-open test.
          One minute of window shift therefore flips the verdict, and a window
          on a different hole of the same event never conflicts at all.
        test_recipe:
          setup:
            - "One course with a 5500 sq ft hole 7 green, a 130000 sq ft hole 7 fairway and a 4300 sq ft hole 12 green."
            - "One STANDARD_TEE_TIMES event on 2026-08-06 from 13:00Z to 18:00Z over 18 holes with a field of 80, undelayed, so effective_start_at is 13:00Z."
            - "At a 12 minute pace hole 7 is occupied for [14:12Z, 14:24Z) and hole 12 for [15:12Z, 15:24Z)."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "FAIRWAY", hole_number: 7, area_sq_ft: 130000, mowing_height_mm: 12.7, distance_to_water_ft: 15, soil_type: "NATIVE_LOAM" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { fw7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 4300, mowing_height_mm: 3.2, distance_to_water_ft: 200, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /play-events"
              payload: { course_id: "${course_id}", event_type: "STANDARD_TEE_TIMES", start_at: "2026-08-06T13:00:00Z", end_at: "2026-08-06T18:00:00Z", holes_in_play: 18, field_size: 80 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "MOWING", window_start: "2026-08-06T13:30:00Z", window_end: "2026-08-06T13:42:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win_ok_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${fw7_id}", task_type: "MOWING", window_start: "2026-08-06T13:31:00Z", window_end: "2026-08-06T13:43:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green12_id}", task_type: "MOWING", window_start: "2026-08-06T13:31:00Z", window_end: "2026-08-06T13:43:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win_hole12_id: $.data.id }
          assert:
            - "PlayEvent.${event_id}.effective_start_at == 2026-08-06T13:00:00Z and delayed_minutes == 0"
            - "the hole 7 green window -> 201: extended to [13:30Z, 14:12Z) it only touches the [14:12Z, 14:24Z) occupancy, and half-open intervals that touch do not intersect"
            - "MaintenanceWindow.${win_ok_id}.crew_hours == 0.60"
            - "the hole 7 fairway window one minute later -> 409 ERR_WINDOW_CONFLICTS_PLAY: extended to [13:31Z, 14:13Z) it overlaps [14:12Z, 14:24Z) by one minute"
            - "error_id != ERR_WINDOW_OVERLAP: the fairway is a different TurfArea from the green, so the crew-occupancy rule does not fire"
            - "the hole 12 green window at the same clock time -> 201, because hole 12 is not occupied until 15:12Z"
            - "MaintenanceWindow.${win_hole12_id}.status == SCHEDULED"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: nitrogen_ledger_returns_to_its_exact_value_after_defer_and_reschedule
        grounds:
          - calculations.plan_nitrogen_commitment_lb
          - state_machines.MaintenanceWindow.SCHEDULED_to_DEFERRED
          - state_machines.MaintenanceWindow.DEFERRED_to_SCHEDULED
          - entities.AgronomicPlan.fields.committed_nitrogen_lb
        distinguishing_aspect: |
          Conserved quantity: committed nitrogen in pounds on the AgronomicPlan
          ledger. The weather defer debits 4.68 and the reschedule credits
          exactly 4.68 back, so 7.91 is restored to the cent with no rounding
          drift, while the monotone counters (version, deferral_count) do NOT
          return — the compensation is on the quantity only.
        test_recipe:
          setup:
            - "The two-task 2026 plan fixture with an 8.00 lb budget: 0.85 on the 5500 sq ft hole 7 green and 0.75 on the 4300 sq ft hole 12 green, approved and both tasks scheduled, so committed_nitrogen_lb is 7.91."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id, course_v1: $.data.version }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 4300, mowing_height_mm: 3.2, distance_to_water_ft: 200, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 8.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.85, planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green12_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.75, planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task2_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { plan_v_active: $.data.version }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", window_start: "2026-08-12T05:00:00Z", window_end: "2026-08-12T07:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win1_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green12_id}", task_type: "FERTILITY", window_start: "2026-08-13T05:00:00Z", window_end: "2026-08-13T07:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { win2_id: $.data.id }
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${win1_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "GET /agronomic-plans/${plan_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_after_t1: $.data.version }
            - call: "POST /plan-tasks/${task2_id}/schedule"
              payload: { maintenance_window_id: "${win2_id}", expected_plan_version: "${plan_v_after_t1}" }
              as: Agronomist
              as_user_id: "agro-1"
          trigger:
            - call: "POST /weather-events"
              payload: { course_id: "${course_id}", event_type: "HEAVY_RAIN", expected_clear_at: "2026-08-12T06:00:00Z", expected_course_version: "${course_v1}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { rain_id: $.data.id }
            - call: "POST /maintenance-windows/${win1_id}/reschedule"
              payload: { window_start: "2026-08-15T05:00:00Z", window_end: "2026-08-15T07:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "before the trigger AgronomicPlan.${plan_id}.committed_nitrogen_lb == 7.91"
            - "after the defer AgronomicPlan.${plan_id}.committed_nitrogen_lb == 3.23 and PlanTask.${task1_id}.status == PLANNED"
            - "after the reschedule AgronomicPlan.${plan_id}.committed_nitrogen_lb == 7.91 exactly, restored to the cent"
            - "after the reschedule PlanTask.${task1_id}.status == SCHEDULED and MaintenanceWindow.${win1_id}.plan_task_id == ${task1_id}"
            - "TurfArea.${green7_id}.nitrogen_projected_lb_per_1000 == 0.850 at every step, since PLANNED and SCHEDULED are both projected"
            - "MaintenanceWindow.${win1_id}.deferral_count == 1 after the round trip, not 0 — the counter is not compensated"
            - "AgronomicPlan.${plan_id}.version is strictly greater than ${plan_v_after_t1} after the round trip, so the ledger returned while the version did not"

      - name: water_ledger_and_posture_unwind_exactly_on_run_reversal
        grounds:
          - state_machines.IrrigationRun.COMPLETED_to_REVERSED
          - state_machines.Course.RESTRICTED_to_OPEN
          - entities.Course.fields.water_used_gal
          - entities.PumpStation.fields.withdrawn_today_gal
        distinguishing_aspect: |
          Conserved quantity: withdrawn water in gallons, tracked at two levels
          at once (PumpStation.withdrawn_today_gal and Course.water_used_gal) —
          a different quantity and different holders from the nitrogen ledger.
          The reversal also has to unwind a DERIVED consequence the debit
          caused: the RESTRICTED posture and the mirrored station status both
          return, which no nitrogen compensation does.
        test_recipe:
          setup:
            - "One course with an 800 gal annual allocation and the default 80 and 100 percent thresholds."
            - "One 5500 sq ft hole 7 green and one ONLINE WELL station with a 10000 gal daily cap, a 300 gpm ceiling and 2 zones."
            - "One SCHEDULED run over 60 minutes at a 20 point deficit: 682.0 gal at 11.37 gpm."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 800, water_restricted_threshold_pct: 80, water_suspended_threshold_pct: 100 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "WELL", max_flow_gpm: 300, max_concurrent_zones: 2, daily_withdrawal_cap_gal: 10000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_id: $.data.id, pump_v1: $.data.version }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green7_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T05:00:00Z", target_moisture_deficit_pct: 20, expected_pump_station_version: "${pump_v1}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { run_a_id: $.data.id }
          trigger:
            - call: "POST /irrigation-runs/${run_a_id}/complete"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /irrigation-runs/${run_a_id}/reverse"
              payload: { reversal_note: "meter fault, withdrawal never happened" }
              as: Superintendent
              as_user_id: "super-1"
          assert:
            - "at creation IrrigationRun.${run_a_id}.allotted_gal == 682.0, flow_gpm == 11.37, volume_gal == 0, and Course.${course_id}.water_used_gal == 0"
            - "after the complete IrrigationRun.${run_a_id}.volume_gal == 682.0, PumpStation.${pump_id}.withdrawn_today_gal == 682.0 and Course.${course_id}.water_used_gal == 682.0"
            - "after the complete 682.0 / 800 * 100 == 85.25 percent, so Course.${course_id}.water_posture == RESTRICTED and PumpStation.${pump_id}.status == RESTRICTED"
            - "after the reverse IrrigationRun.${run_a_id}.status == REVERSED and volume_gal == 0"
            - "after the reverse PumpStation.${pump_id}.withdrawn_today_gal == 0.0 and Course.${course_id}.water_used_gal == 0.0, both restored exactly"
            - "after the reverse Course.${course_id}.water_posture == OPEN and PumpStation.${pump_id}.status == ONLINE, the derived consequences unwound too"
            - "IrrigationRun.${run_a_id}.allotted_gal is still 682.0 — the reversal zeroes the delivered volume and never rewrites the allotment"

      - name: engine_hour_meter_is_conserved_across_a_service
        grounds:
          - state_machines.EquipmentUnit.DOWN_FOR_SERVICE_to_IN_SERVICE
          - calculations.equipment_replacement_score
          - entities.EquipmentUnit.fields.engine_hours
          - entities.EquipmentUnit.fields.hours_since_service
        distinguishing_aspect: |
          Conserved quantity: cumulative engine hours on the meter, which must
          NOT move when the service resets the derived counters around it — the
          inverse shape of the other two instances, where the tracked quantity
          returns to an earlier value. hours_since_service is reset to 0,
          engine_hours_at_last_service jumps to the meter, and the score falls
          from 81.8 to 61.8 while engine_hours stays at 4500.0.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z, so 152 whole days remain to the fiscal year end and the unit's age is 8 years."
            - "One course and one 2018 triplex greens mower: 6000 hour life, 250 hour interval, 3.5 average daily hours, 4200 hours on the meter."
            - "300 hours logged, which trips the auto-transition to DOWN_FOR_SERVICE."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { course_id: "${course_id}", unit_type: "TRIPLEX_GREENS_MOWER", model_year: 2018, purchase_cost: 38000, expected_life_hours: 6000, service_interval_hours: 250, avg_daily_hours: 3.5, initial_engine_hours: 4200 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { unit1_id: $.data.id }
            - call: "POST /equipment-units/${unit1_id}/log-hours"
              payload: { hours_added: 300 }
              as: EquipmentTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /equipment-units/${unit1_id}/service"
              payload: { service_note: "500 hour PM, blades reground" }
              as: EquipmentTechnician
              as_user_id: "tech-1"
            - call: "POST /equipment-units/${unit1_id}/service"
              payload: { service_note: "duplicate work order" }
              as: EquipmentTechnician
              as_user_id: "tech-1"
          assert:
            - "before the service EquipmentUnit.${unit1_id}.status == DOWN_FOR_SERVICE, engine_hours == 4500.0, hours_since_service == 300.0, engine_hours_at_last_service == 4200.0, replacement_score == 81.8, replacement_score_projected == 85.7, replacement_flag == true"
            - "after the service EquipmentUnit.${unit1_id}.engine_hours == 4500.0, unchanged to the tenth"
            - "after the service hours_since_service == 0.0 and engine_hours_at_last_service == 4500.0"
            - "after the service replacement_score == 61.8, the overdue term having gone from its capped 1.0 to 0"
            - "after the service replacement_score_projected == 65.7 and replacement_flag == false, so the service also clears the capital flag"
            - "after the service EquipmentUnit.${unit1_id}.status == IN_SERVICE and version == 4"
            - "a second service -> 409 ERR_EQUIPMENT_STATE_INVALID, since the unit is no longer DOWN_FOR_SERVICE"
