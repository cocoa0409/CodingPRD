            - { call: "POST /credit/borrowers", payload: { legal_name: "Tier Edge Over LLC", naics_code: "531120", relationship_since: "2010-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor2: $.data.id } }
