            - call: "POST /participants"
              payload: { plan_id: "${plan_b}", business_unit_id: "${u2}", employee_code: "E822", full_name: "No Pool", job_level: "L3", base_salary_cents: 10000000, hire_date: "2025-01-01" }
              as: PlanAdmin
          trigger:
