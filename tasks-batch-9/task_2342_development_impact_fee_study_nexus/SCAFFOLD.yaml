scenario: "2342. Development Impact Fee Study & Nexus Analysis (city fee study program): facility standard adoption defining existing and planned level of service by category, growth projection converting new development into service demand units, cost allocation demonstrating a rational nexus between the fee and the development impact, credit calculation for developer-provided improvements and existing tax contributions, fee schedule adoption with land use categories and conversion factors, statutory notice, protest and effective-date requirements, collection timing at permit versus certificate of occupancy with deferral agreements, expenditure within statutory deadlines with refund obligations and annual reporting"
domain_name: "development-impact-fee-nexus"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a root-level peer collection linked by explicit foreign keys
  # (`/facility-categories`, `/fee-studies`, `/nexus-components`, ...). No entity
  # is nested inside another entity's URL path; sub-paths that do appear are
  # action verbs (`/fee-studies/{id}/adopt`) or reverse-reachability reads
  # (`GET /nexus-components/{id}/fee-schedule-items`), never ownership chains.

  state_machine_shape: cyclic
  # FeeStudy is cyclic (NEXUS_CERTIFIED -> DRAFT decertification remand and
  # NOTICE_PUBLISHED -> DRAFT protest remand, each bumping revision_round);
  # DevelopmentApplication carries two independent dimensions
  # (assessment_status x collection_status); CreditClaim and DeferralAgreement
  # branch with divergent side-effect sets; FacilityCategory.fund_posture is a
  # derived posture that gates expenditures on its own fund.

  relationship_patterns:
    - one_to_many          # FeeProgram -> FacilityCategory / FeeStudy; NexusComponent -> FeeScheduleItem
    - self_referential     # FeeStudy.superseded_by_fee_study_id -> FeeStudy.id; FundLedgerEntry.refunded_entry_id -> FundLedgerEntry.id
    - cross_aggregate      # NexusComponent joins a FeeStudy to a FacilityCategory; FundLedgerEntry joins a DevelopmentApplication to a FacilityCategory
    - polymorphic          # FundLedgerEntry.kind discriminates COLLECTION / EXPENDITURE / REFUND rows in one ledger table

  role_model: segregation_of_duties
  # The user id that certifies a study's nexus findings may not adopt it, and the
  # user id that authorized any expenditure inside a fiscal year may not file that
  # fiscal year's annual report. Role separation alone does not satisfy either
  # rule: both are checked on X-User-ID, not on X-User-Role.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Deliberately above the Expert band of SKILL.md 0.4: 10 entities, 43 endpoints,
  # 54 validation rules, 54 error codes, 9 calculations, 7 state machines and 3
  # optimistic-concurrency rules. The surface is
  # wide only where the scenario's eight statutory clauses demand it; the difficulty
  # is concentrated in (i) two methodologies that price the same facts differently,
  # (ii) a four-hop decertification cascade, (iii) a per-line rounding + credit-cap +
  # admin-charge evaluation order that three plausible readings resolve differently,
  # and (iv) a FIFO vintage ledger whose statutory deadline converts money into a
  # refund obligation.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FeeProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the jurisdiction's impact fee program"
        constraints: "1..200 chars, non-blank"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Short jurisdiction identifier used on notices"
        constraints: "2..10 chars, uppercase A-Z0-9, unique across FeeProgram"
      - name: fiscal_year_start_month
        type: integer
        source: input
        description: "Calendar month (1-12) on whose first day the program's fiscal year opens"
        default: 7
        constraints: "1..12"
      - name: statutory_expenditure_deadline_years
        type: integer
        source: input
        description: "Years a collected fee may sit unexpended before it becomes refundable"
        default: 5
        constraints: "1..20"
      - name: notice_min_days
        type: integer
        source: input
        description: "Minimum days a fee study notice must stay published before the protest window may close"
        default: 14
        constraints: "1..365"
      - name: protest_threshold_bp
        type: integer
        source: input
        description: "Basis points of affected-property weight at or above which protest is sustained"
        default: 5000
        constraints: "1..10000"
      - name: effective_delay_days
        type: integer
        source: input
        description: "Statutory days between adoption and the earliest effective date"
        default: 60
        constraints: "0..365"
      - name: admin_charge_bp
        type: integer
        source: input
        description: "Basis points added as an administrative charge on each assessed line's net fee"
        default: 300
        constraints: "0..2000"
      - name: credit_cap_bp
        type: integer
        source: input
        description: "Basis points of the gross assessed fee that approved credits may not exceed in aggregate"
        default: 5000
        constraints: "0..10000"
      - name: los_policy
        type: enum
        source: input
        description: "Whether the standard-based methodology may price the planned level of service or is held to the existing one"
        default: "EXISTING_DEFICIENCY_EXCLUDED"
        constraints: "EXISTING_DEFICIENCY_EXCLUDED | PLANNED_STANDARD_ALLOWED"
      - name: discount_rate_bp
        type: integer
        source: input
        description: "Annual discount rate in basis points used by the PRESENT_VALUE credit variant"
        default: 400
        constraints: "1..5000"
      - name: max_deferral_days
        type: integer
        source: input
        description: "Maximum days from execution that a deferral agreement's due date may fall"
        default: 730
        constraints: "1..3650"
      - name: default_penalty_bp
        type: integer
        source: input
        description: "Basis points of the application's net_due_cents charged when an executed deferral defaults"
        default: 1000
        constraints: "0..10000"
      - name: at_risk_window_days
        type: integer
        source: input
        description: "Look-ahead days used by the deadline sweep to flag a fund AT_RISK before its earliest deadline"
        default: 365
        constraints: "1..3650"
      - name: report_grace_days
        type: integer
        source: input
        description: "Days after a fiscal year closes within which its annual report is on time"
        default: 180
        constraints: "1..730"
      - name: effective_fee_study_id
        type: string
        source: computed
        description: "Derived pointer to the program's effective study; resolved as the single FeeStudy where fee_program_id == this.id AND status == EFFECTIVE, else null. NOT a stored foreign key."
        default: null
      - name: last_report_fiscal_year
        type: integer
        source: computed
        description: "fiscal_year of the most recently filed annual report, null before the first filing"
        default: null
      - name: last_report_filed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent annual report filing"
        default: null
      - name: last_report_status
        type: enum
        source: computed
        description: "Timeliness verdict of the most recent annual report filing"
        default: "NOT_FILED"
        constraints: "NOT_FILED | FILED_ON_TIME | FILED_LATE"
      - name: last_report_filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceOfficer who filed the most recent annual report"
        default: null

  - name: FacilityCategory
    parent: FeeProgram
    common_fields: true
    fields:
      - name: fee_program_id
        type: string
        source: input
        description: "FK -> FeeProgram.id; the program that adopted this facility standard"
      - name: code
        type: string
        source: input
        description: "Stable category code used to order assessment lines and to address credits"
        constraints: "2..12 chars, uppercase A-Z_; unique per fee_program_id"
      - name: name
        type: string
        source: input
        description: "Human-readable facility category name"
        constraints: "1..120 chars"
      - name: demand_unit_label
        type: string
        source: input
        description: "Name of the service demand unit this category is measured in (resident, PM peak trip, ...)"
        constraints: "1..40 chars"
      - name: existing_los_per_demand_unit
        type: number
        source: input
        description: "Adopted existing level of service expressed as facility units per demand unit"
        constraints: "> 0, 4 decimal places"
      - name: planned_los_per_demand_unit
        type: number
        source: input
        description: "Adopted planned level of service expressed as facility units per demand unit"
        constraints: "> 0, 4 decimal places"
      - name: existing_deficiency_demand_units
        type: number
        source: input
        description: "Demand units already served below the existing standard; never charged to new development"
        default: 0
        constraints: ">= 0, 4 decimal places"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Cost in cents of one facility unit (one acre, one lane mile, ...)"
        constraints: "> 0"
      - name: fund_posture
        type: enum
        source: computed
        description: "Derived compliance posture of this category's fee fund; recomputed by every ledger mutation and by the deadline sweep"
        default: "COMPLIANT"
        constraints: "COMPLIANT | AT_RISK | REFUND_DUE"
      - name: fund_balance_cents
        type: integer
        source: computed
        description: "sum(FundLedgerEntry.amount_cents where kind == COLLECTION) - sum(where kind == EXPENDITURE) - sum(where kind == REFUND), all scoped to facility_category_id == this.id"
        default: 0
      - name: refund_due_cents
        type: integer
        source: computed
        description: "sum(FundLedgerEntry.unexpended_cents where facility_category_id == this.id AND entry_status == REFUND_DUE)"
        default: 0
      - name: oldest_unexpended_vintage_at
        type: datetime
        source: computed
        description: "min(FundLedgerEntry.vintage_at where facility_category_id == this.id AND kind == COLLECTION AND entry_status IN {OPEN, PARTIALLY_EXPENDED, REFUND_DUE}), else null"
        default: null
      - name: committed_demand_units
        type: number
        source: computed
        description: "sum of assessed_lines[].demand_units over DevelopmentApplication rows whose assessment_status IN {ASSESSED, REASSESSED} and whose line names this category; 4 decimal places"
        default: 0
      - name: deferred_receivable_cents
        type: integer
        source: computed
        description: "sum of assessed_lines[].line_net_cents for this category over applications whose collection_status IN {DEFERRED, DELINQUENT}"
        default: 0

  - name: FeeStudy
    parent: FeeProgram
    common_fields: true
    fields:
      - name: fee_program_id
        type: string
        source: input
        description: "FK -> FeeProgram.id; the program this study prices"
      - name: title
        type: string
        source: input
        description: "Title of the nexus study document"
        constraints: "1..200 chars"
      - name: methodology
        type: enum
        source: input
        description: "Which of the two cost-allocation variants this study adopts as its fee basis"
        constraints: "PLAN_BASED | STANDARD_BASED"
      - name: status
        type: enum
        source: computed
        description: "Statutory lifecycle position of the study"
        default: "DRAFT"
        constraints: "DRAFT | NEXUS_CERTIFIED | NOTICE_PUBLISHED | PROTEST_CLEARED | ADOPTED | EFFECTIVE | SUPERSEDED"
      - name: revision_round
        type: integer
        source: computed
        description: "Count of remands back to DRAFT; incremented by decertification and by a sustained protest"
        default: 0
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the NexusAnalyst who certified the nexus findings; cleared on remand to DRAFT"
        default: null
      - name: certified_at
        type: datetime
        source: computed
        description: "Logical-clock instant of nexus certification; cleared on remand to DRAFT"
        default: null
      - name: notice_method
        type: enum
        source: input
        description: "Publication channel recorded at notice publication"
        default: null
        constraints: "NEWSPAPER | WEBSITE | MAILED"
      - name: notice_days
        type: integer
        source: input
        description: "Days the notice stays published; also the length of the protest window"
        default: null
        constraints: ">= 1"
      - name: notice_published_at
        type: datetime
        source: computed
        description: "Logical-clock instant notice was published; cleared on remand to DRAFT"
        default: null
      - name: protest_window_ends_at
        type: datetime
        source: computed
        description: "notice_published_at + notice_days; cleared on remand to DRAFT"
        default: null
      - name: protest_weight_bp
        type: integer
        source: computed
        description: "sum(ProtestFiling.weight_bp where fee_study_id == this.id AND status == RECORDED)"
        default: 0
      - name: protest_count
        type: integer
        source: computed
        description: "count(ProtestFiling where fee_study_id == this.id AND status == RECORDED)"
        default: 0
      - name: adopted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of council adoption"
        default: null
      - name: adopted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CouncilClerk who recorded adoption"
        default: null
      - name: effective_at
        type: datetime
        source: computed
        description: "adopted_at + FeeProgram.effective_delay_days; the earliest instant the schedule may be activated"
        default: null
      - name: activated_at
        type: datetime
        source: computed
        description: "Logical-clock instant the study became EFFECTIVE"
        default: null
      - name: superseded_by_fee_study_id
        type: string
        source: computed
        description: "FK -> FeeStudy.id; set on the outgoing study when a newer study is activated"
        default: null

  - name: NexusComponent
    parent: FeeStudy
    common_fields: true
    fields:
      - name: fee_study_id
        type: string
        source: input
        description: "FK -> FeeStudy.id; the study this component belongs to"
      - name: facility_category_id
        type: string
        source: input
        description: "FK -> FacilityCategory.id; the facility standard this component prices"
      - name: horizon_start_year
        type: integer
        source: input
        description: "First calendar year of the growth horizon, inclusive"
        constraints: "1900..2200"
      - name: horizon_end_year
        type: integer
        source: input
        description: "Last calendar year of the growth horizon, inclusive; must be >= horizon_start_year"
        constraints: "1900..2200"
      - name: projected_new_dwelling_units
        type: integer
        source: input
        description: "Dwelling units the growth projection expects inside the horizon"
        constraints: ">= 0"
      - name: projected_new_nonres_sqft
        type: integer
        source: input
        description: "Non-residential square feet the growth projection expects inside the horizon"
        constraints: ">= 0"
      - name: demand_units_per_dwelling
        type: number
        source: input
        description: "Service demand units generated per new dwelling unit; 4 decimal places"
        constraints: ">= 0"
      - name: demand_units_per_1000_nonres_sqft
        type: number
        source: input
        description: "Service demand units generated per 1000 non-residential square feet; 4 decimal places"
        constraints: ">= 0"
      - name: planned_facility_cost_cents
        type: integer
        source: input
        description: "Gross capital cost in cents of the planned facilities in this category"
        constraints: ">= 0"
      - name: planned_other_funding_cents
        type: integer
        source: input
        description: "Grants and non-fee funding in cents netted out of the growth cost before allocation"
        default: 0
        constraints: ">= 0"
      - name: planned_growth_share_bp
        type: integer
        source: input
        description: "Basis points of planned_facility_cost_cents attributable to new growth"
        default: 10000
        constraints: "0..10000"
      - name: planned_capacity_demand_units
        type: number
        source: input
        description: "Demand units of capacity the planned facilities add; 4 decimal places"
        constraints: ">= 0"
      - name: existing_tax_credit_per_unit_cents
        type: integer
        source: input
        description: "Per-demand-unit credit for existing tax contributions, subtracted from the selected cost basis"
        default: 0
        constraints: ">= 0"
      - name: growth_demand_units
        type: number
        source: computed
        description: "Demand units the horizon's new development adds; see calculations.growth_demand_units"
        default: 0
      - name: plan_based_cost_per_unit_cents
        type: integer
        source: computed
        description: "Incremental-expansion cost per demand unit; see calculations.cost_per_demand_unit variant PLAN_BASED"
        default: null
      - name: standard_based_cost_per_unit_cents
        type: integer
        source: computed
        description: "Level-of-service cost per demand unit; see calculations.cost_per_demand_unit variant STANDARD_BASED"
        default: null
      - name: adopted_cost_per_unit_cents
        type: integer
        source: computed
        description: "The variant selected by the parent FeeStudy.methodology, less existing_tax_credit_per_unit_cents, floored at 0"
        default: null
      - name: nexus_ratio
        type: number
        source: computed
        description: "planned_capacity_demand_units / growth_demand_units rounded to 4 decimal places; proportionality evidence for certification"
        default: null
      - name: allocation_status
        type: enum
        source: computed
        description: "Whether the computed allocation reflects the current inputs"
        default: "PENDING"
        constraints: "PENDING | VALID | STALE"
      - name: allocated_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent successful allocation"
        default: null

  - name: FeeScheduleItem
    parent: NexusComponent
    common_fields: true
    fields:
      - name: nexus_component_id
        type: string
        source: input
        description: "FK -> NexusComponent.id; the allocation this schedule line converts into a per-unit fee"
      - name: land_use_category
        type: enum
        source: input
        description: "Land use class this line prices; unique per nexus_component_id"
        constraints: "SINGLE_FAMILY | MULTI_FAMILY | RETAIL | OFFICE | INDUSTRIAL"
      - name: unit_basis
        type: enum
        source: input
        description: "Charging unit; PER_DWELLING is required for SINGLE_FAMILY and MULTI_FAMILY, PER_1000_SQFT for RETAIL, OFFICE and INDUSTRIAL"
        constraints: "PER_DWELLING | PER_1000_SQFT"
      - name: conversion_factor
        type: number
        source: input
        description: "Demand units generated per charging unit of this land use; 4 decimal places"
        constraints: "> 0"
      - name: fee_per_unit_cents
        type: integer
        source: computed
        description: "round_half_up(NexusComponent.adopted_cost_per_unit_cents * conversion_factor); null until the parent component is VALID"
        default: null
      - name: schedule_status
        type: enum
        source: computed
        description: "Mirrors the parent NexusComponent.allocation_status for this line; a line can only be created while its component is VALID, so it is born VALID"
        default: "VALID"
        constraints: "VALID | STALE"

  - name: ProtestFiling
    parent: FeeStudy
    common_fields: true
    fields:
      - name: fee_study_id
        type: string
        source: input
        description: "FK -> FeeStudy.id; the study protested"
      - name: protester_name
        type: string
        source: input
        description: "Name of the record owner filing the protest"
        constraints: "1..200 chars"
      - name: parcel_count
        type: integer
        source: input
        description: "Parcels represented by this filing"
        constraints: ">= 1"
      - name: weight_bp
        type: integer
        source: input
        description: "Basis points of affected-property weight this filing carries"
        constraints: "1..10000"
      - name: status
        type: enum
        source: computed
        description: "Whether the filing still counts toward the protest tally"
        default: "RECORDED"
        constraints: "RECORDED | WITHDRAWN | VOIDED"
      - name: filed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the clerk recorded the filing"

  - name: DevelopmentApplication
    parent: null
    common_fields: true
    fields:
      - name: fee_program_id
        type: string
        source: input
        description: "FK -> FeeProgram.id; the program whose schedule will price this project"
      - name: permit_number
        type: string
        source: input
        description: "Building permit number; unique per fee_program_id"
        constraints: "1..40 chars"
      - name: land_use_category
        type: enum
        source: input
        description: "Land use class of the project; selects the applicable schedule lines"
        constraints: "SINGLE_FAMILY | MULTI_FAMILY | RETAIL | OFFICE | INDUSTRIAL"
      - name: dwelling_units
        type: integer
        source: input
        description: "Dwelling units proposed; charged by PER_DWELLING schedule lines"
        default: 0
        constraints: ">= 0"
      - name: nonres_sqft
        type: integer
        source: input
        description: "Non-residential square feet proposed; charged by PER_1000_SQFT schedule lines"
        default: 0
        constraints: ">= 0"
      - name: collection_trigger
        type: enum
        source: input
        description: "Whether the fee falls due when the permit is assessed or when the certificate of occupancy is requested"
        default: "PERMIT"
        constraints: "PERMIT | CERTIFICATE_OF_OCCUPANCY"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Developer who created the application; the owner for ownership checks"
      - name: pinned_fee_study_id
        type: string
        source: computed
        description: "FK -> FeeStudy.id; the study whose schedule was used at assessment"
        default: null
      - name: pinned_fee_study_version
        type: integer
        source: computed
        description: "FeeStudy.version observed at assessment; stale when the pinned study is later superseded"
        default: null
      - name: assessment_status
        type: enum
        source: computed
        description: "Assessment dimension; evolves independently of collection_status"
        default: "UNASSESSED"
        constraints: "UNASSESSED | ASSESSED | REASSESSED"
      - name: collection_status
        type: enum
        source: computed
        description: "Collection dimension; evolves independently of assessment_status"
        default: "NOT_DUE"
        constraints: "NOT_DUE | DUE | DEFERRED | DELINQUENT | PAID"
      - name: reassessment_required
        type: boolean
        source: computed
        description: "Set when the pinned study is superseded before the fee is paid; blocks payment until a fresh assessment runs"
        default: false
      - name: assessed_lines
        type: array
        source: computed
        description: "One object per priced line, ordered by FacilityCategory.code ASC: { facility_category_id, facility_category_code, demand_units, line_gross_cents, line_credit_cents, line_admin_cents, line_net_cents }"
        default: []
      - name: gross_assessed_cents
        type: integer
        source: computed
        description: "sum of assessed_lines[].line_gross_cents"
        default: 0
      - name: credit_applied_cents
        type: integer
        source: computed
        description: "sum of assessed_lines[].line_credit_cents after the program credit cap and the waterfall allocation"
        default: 0
      - name: admin_charge_cents
        type: integer
        source: computed
        description: "sum of assessed_lines[].line_admin_cents"
        default: 0
      - name: net_due_cents
        type: integer
        source: computed
        description: "gross_assessed_cents - credit_applied_cents + admin_charge_cents"
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "sum(FundLedgerEntry.amount_cents where development_application_id == this.id AND kind == COLLECTION) - sum(where kind == REFUND)"
        default: 0
      - name: default_penalty_cents
        type: integer
        source: computed
        description: "Penalty added when an executed deferral on this application defaults"
        default: 0
      - name: assessed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the first assessment"
        default: null
      - name: reassessed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent reassessment"
        default: null
      - name: co_issued_at
        type: datetime
        source: computed
        description: "Logical-clock instant the certificate of occupancy was issued, null while not issued"
        default: null

  - name: CreditClaim
    parent: DevelopmentApplication
    common_fields: true
    fields:
      - name: development_application_id
        type: string
        source: input
        description: "FK -> DevelopmentApplication.id; the project claiming the credit"
      - name: facility_category_code
        type: string
        source: input
        description: "Code of the credited category; resolved as the FacilityCategory where fee_program_id == application.fee_program_id AND code == this value"
        constraints: "2..12 chars, uppercase A-Z_"
      - name: credit_type
        type: enum
        source: input
        description: "Whether the claim rests on a developer-provided improvement or on existing tax contributions"
        constraints: "DEVELOPER_IMPROVEMENT | EXISTING_TAX_CONTRIBUTION"
      - name: valuation_method
        type: enum
        source: input
        description: "Which of the two valuation variants prices this claim"
        constraints: "NOMINAL | PRESENT_VALUE"
      - name: improvement_value_cents
        type: integer
        source: input
        description: "Appraised value in cents of the developer-provided improvement; required when credit_type == DEVELOPER_IMPROVEMENT"
        default: null
        constraints: "> 0 when present"
      - name: annual_tax_contribution_cents
        type: integer
        source: input
        description: "Annual tax contribution in cents; required when credit_type == EXISTING_TAX_CONTRIBUTION"
        default: null
        constraints: "> 0 when present"
      - name: contribution_years
        type: integer
        source: input
        description: "Years of contribution for the tax variant, or years of deferral for the improvement variant"
        default: 0
        constraints: "0..50"
      - name: claimed_credit_cents
        type: integer
        source: computed
        description: "Claim value produced by calculations.credit_claim_valuation under valuation_method"
        default: 0
      - name: approved_cents
        type: integer
        source: computed
        description: "Credit the reviewer allowed; 0 until decided and 0 forever when DENIED"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Review outcome of the claim"
        default: "SUBMITTED"
        constraints: "SUBMITTED | APPROVED_FULL | APPROVED_PARTIAL | DENIED"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the NexusAnalyst who decided the claim"
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the decision"
        default: null

  - name: DeferralAgreement
    parent: DevelopmentApplication
    common_fields: true
    fields:
      - name: development_application_id
        type: string
        source: input
        description: "FK -> DevelopmentApplication.id; the project deferring collection"
      - name: requested_security_type
        type: enum
        source: input
        description: "Security instrument offered for the deferred fee"
        constraints: "CASH_BOND | LETTER_OF_CREDIT | LIEN"
      - name: security_amount_cents
        type: integer
        source: input
        description: "Face amount in cents of the offered security"
        constraints: "> 0"
      - name: requested_due_at
        type: datetime
        source: input
        description: "Due date the applicant requests for the deferred fee"
      - name: due_at
        type: datetime
        source: computed
        description: "min(requested_due_at, executed_at + FeeProgram.max_deferral_days); set at execution"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the deferral agreement"
        default: "REQUESTED"
        constraints: "REQUESTED | EXECUTED | DENIED | SATISFIED | DEFAULTED"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PermitOfficer who executed or denied the agreement"
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the execute/deny decision"
        default: null
      - name: executed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the agreement was executed"
        default: null
      - name: satisfied_at
        type: datetime
        source: computed
        description: "Logical-clock instant the deferred fee was paid in full"
        default: null
      - name: defaulted_at
        type: datetime
        source: computed
        description: "Logical-clock instant the deadline sweep found the agreement past due and unpaid"
        default: null

  - name: FundLedgerEntry
    parent: FacilityCategory
    common_fields: true
    fields:
      - name: facility_category_id
        type: string
        source: input
        description: "FK -> FacilityCategory.id; the fee fund this entry moves"
      - name: development_application_id
        type: string
        source: input
        description: "FK -> DevelopmentApplication.id; the project that paid, null on EXPENDITURE rows"
        default: null
      - name: refunded_entry_id
        type: string
        source: computed
        description: "FK -> FundLedgerEntry.id; on a REFUND row, the COLLECTION row it reverses"
        default: null
      - name: kind
        type: enum
        source: system
        description: "Ledger row discriminator"
        constraints: "COLLECTION | EXPENDITURE | REFUND"
      - name: amount_cents
        type: integer
        source: input
        description: "Absolute value in cents moved by this row"
        constraints: "> 0"
      - name: vintage_at
        type: datetime
        source: computed
        description: "Logical-clock instant that starts this row's statutory clock; the collection instant on COLLECTION rows and the action instant on EXPENDITURE and REFUND rows"
      - name: deadline_at
        type: datetime
        source: computed
        description: "vintage_at + FeeProgram.statutory_expenditure_deadline_years for COLLECTION rows, null otherwise"
        default: null
      - name: unexpended_cents
        type: integer
        source: computed
        description: "Portion of amount_cents not yet consumed by an expenditure; 0 on EXPENDITURE and REFUND rows"
        default: 0
      - name: entry_status
        type: enum
        source: computed
        description: "Consumption state of a COLLECTION row; EXPENDITURE and REFUND rows are created POSTED and never leave it"
        default: "OPEN"
        constraints: "OPEN | PARTIALLY_EXPENDED | FULLY_EXPENDED | REFUND_DUE | REFUNDED | POSTED"
      - name: project_name
        type: string
        source: input
        description: "Capital project charged on an EXPENDITURE row, null otherwise"
        default: null
        constraints: "1..120 chars when present"
      - name: authorized_by_user_id
        type: string
        source: system
        description: "X-User-ID of the finance officer who authorized an EXPENDITURE or REFUND row, null on COLLECTION rows; the segregation-of-duties check on annual report filing reads this"
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FeeStudy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: NEXUS_CERTIFIED
        trigger: "POST /fee-studies/{id}/certify-nexus"
        actor: NexusAnalyst
        preconditions:
          - "study.status == DRAFT"
          - "count(NexusComponent where fee_study_id == study.id) >= 1"
          - "every NexusComponent of the study has allocation_status == VALID (else ERR_COMPONENT_ALLOCATION_STALE)"
          - "every NexusComponent of the study has count(FeeScheduleItem where nexus_component_id == component.id) >= 1 (else ERR_COMPONENT_ALLOCATION_STALE)"
          - "every NexusComponent of the study has nexus_ratio >= 1.0 (else ERR_NEXUS_RATIO_INSUFFICIENT)"
        side_effects:
          - "study.certified_by_user_id = X-User-ID; study.certified_at = clock"
          - "study.version += 1"
        note: "Certification is the record that the rational nexus and proportionality tests are met for every category in the study."

      - from: NEXUS_CERTIFIED
        to: NOTICE_PUBLISHED
        trigger: "POST /fee-studies/{id}/publish-notice"
        actor: CouncilClerk
        preconditions:
          - "study.status == NEXUS_CERTIFIED"
          - "notice_days >= FeeProgram.notice_min_days (else ERR_NOTICE_PERIOD_TOO_SHORT)"
          - "no other FeeStudy of the same fee_program_id has status IN {NOTICE_PUBLISHED, PROTEST_CLEARED, ADOPTED} (else ERR_NOTICE_WINDOW_OVERLAP)"
        side_effects:
          - "study.notice_method / notice_days stored; study.notice_published_at = clock"
          - "study.protest_window_ends_at = notice_published_at + notice_days days"
          - "study.version += 1"

      - from: NOTICE_PUBLISHED
        to: PROTEST_CLEARED
        trigger: "POST /fee-studies/{id}/close-protest-window (branch taken when protest_weight_bp < FeeProgram.protest_threshold_bp)"
        actor: CouncilClerk
        preconditions:
          - "study.status == NOTICE_PUBLISHED"
          - "clock >= study.protest_window_ends_at (else ERR_PROTEST_WINDOW_OPEN)"
          - "study.protest_weight_bp < FeeProgram.protest_threshold_bp"
        side_effects:
          - "study.version += 1"
          - "RECORDED ProtestFiling rows are left untouched so the tally stays on the record"

      - from: NOTICE_PUBLISHED
        to: DRAFT
        trigger: "POST /fee-studies/{id}/close-protest-window (branch taken when protest_weight_bp >= FeeProgram.protest_threshold_bp)"
        actor: CouncilClerk
        preconditions:
          - "study.status == NOTICE_PUBLISHED"
          - "clock >= study.protest_window_ends_at (else ERR_PROTEST_WINDOW_OPEN)"
          - "study.protest_weight_bp >= FeeProgram.protest_threshold_bp"
        side_effects:
          - "study.revision_round += 1"
          - "study.certified_by_user_id = null; study.certified_at = null"
          - "study.notice_method = null; study.notice_days = null; study.notice_published_at = null; study.protest_window_ends_at = null"
          - "every ProtestFiling where fee_study_id == study.id AND status == RECORDED transitions to VOIDED; study.protest_weight_bp = 0; study.protest_count = 0"
          - "study.version += 1"
        note: "Sustained protest remands the study for revision; the next notice starts a fresh protest period, so the old filings are voided rather than carried forward."

      - from: NEXUS_CERTIFIED
        to: DRAFT
        trigger: "system: a child NexusComponent of the study became STALE (see NexusComponent VALID_to_STALE)"
        actor: system
        preconditions:
          - "study.status == NEXUS_CERTIFIED"
          - "at least one NexusComponent of the study has allocation_status == STALE"
        side_effects:
          - "study.revision_round += 1"
          - "study.certified_by_user_id = null; study.certified_at = null"
          - "study.version += 1"
        note: "Hop 3 of the decertification cascade: the component's STALE flip, not the operator's request, causes this."

      - from: NOTICE_PUBLISHED
        to: DRAFT
        trigger: "system: a child NexusComponent of the study became STALE (see NexusComponent VALID_to_STALE)"
        actor: system
        preconditions:
          - "study.status == NOTICE_PUBLISHED"
          - "at least one NexusComponent of the study has allocation_status == STALE"
        side_effects:
          - "study.revision_round += 1"
          - "study.certified_by_user_id = null; study.certified_at = null"
          - "study.notice_method = null; study.notice_days = null; study.notice_published_at = null; study.protest_window_ends_at = null"
          - "because the study left NOTICE_PUBLISHED, every ProtestFiling where fee_study_id == study.id AND status == RECORDED transitions to VOIDED; study.protest_weight_bp = 0; study.protest_count = 0"
          - "study.version += 1"
        note: "Hops 3 and 4 of the decertification cascade: the STALE component remands the noticed study, and the remand (not the PATCH) voids the protest tally."

      - from: PROTEST_CLEARED
        to: ADOPTED
        trigger: "POST /fee-studies/{id}/adopt"
        actor: CouncilClerk
        preconditions:
          - "study.status == PROTEST_CLEARED"
          - "X-User-ID != study.certified_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "study.adopted_at = clock; study.adopted_by_user_id = X-User-ID"
          - "study.effective_at = adopted_at + FeeProgram.effective_delay_days days"
          - "study.version += 1"

      - from: ADOPTED
        to: EFFECTIVE
        trigger: "POST /fee-studies/{id}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "study.status == ADOPTED"
          - "clock >= study.effective_at (else ERR_EFFECTIVE_DATE_NOT_REACHED)"
        side_effects:
          - "study.activated_at = clock; study.version += 1"
          - "the prior FeeStudy of the same fee_program_id with status == EFFECTIVE (at most one) transitions to SUPERSEDED with superseded_by_fee_study_id = this study.id (cascade hop 2)"
          - "because that study became SUPERSEDED, every DevelopmentApplication where pinned_fee_study_id == the superseded study.id AND assessment_status IN {ASSESSED, REASSESSED} AND collection_status IN {NOT_DUE, DUE, DEFERRED, DELINQUENT} gets reassessment_required = true and version += 1 (cascade hop 3)"
          - "FeeProgram.version += 1 (the program's derived effective_fee_study_id changed)"

      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system: a newer FeeStudy of the same program was activated"
        actor: system
        preconditions:
          - "study.status == EFFECTIVE"
          - "the activating study belongs to the same fee_program_id"
        side_effects:
          - "study.superseded_by_fee_study_id = activating study.id; study.version += 1"
        note: "Terminal. A superseded study's schedule stays readable so pinned assessments remain auditable."

  - entity: NexusComponent
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: VALID
        trigger: "POST /nexus-components/{id}/allocate"
        actor: NexusAnalyst
        preconditions:
          - "parent FeeStudy.status == DRAFT (else ERR_STUDY_INVALID_STATE)"
          - "component.growth_demand_units > 0 (else ERR_ZERO_DEMAND_UNITS)"
          - "min(growth_demand_units, planned_capacity_demand_units) > 0 (else ERR_ZERO_DEMAND_UNITS)"
        side_effects:
          - "calculations.growth_demand_units and calculations.cost_per_demand_unit run; growth_demand_units, plan_based_cost_per_unit_cents, standard_based_cost_per_unit_cents, adopted_cost_per_unit_cents, nexus_ratio written"
          - "component.allocated_at = clock; component.version += 1"

      - from: STALE
        to: VALID
        trigger: "POST /nexus-components/{id}/allocate"
        actor: NexusAnalyst
        preconditions:
          - "parent FeeStudy.status == DRAFT (else ERR_STUDY_INVALID_STATE)"
          - "component.growth_demand_units > 0 (else ERR_ZERO_DEMAND_UNITS)"
        side_effects:
          - "same recomputation as PENDING_to_VALID"
          - "every FeeScheduleItem where nexus_component_id == component.id returns to schedule_status VALID with fee_per_unit_cents recomputed by calculations.fee_schedule_item_fee"
          - "component.version += 1"
        note: "Closes the PENDING/STALE -> VALID -> STALE -> VALID revision loop."

      - from: VALID
        to: VALID
        trigger: "POST /nexus-components/{id}/allocate"
        actor: NexusAnalyst
        preconditions:
          - "parent FeeStudy.status == DRAFT (else ERR_STUDY_INVALID_STATE)"
        side_effects:
          - "same recomputation as PENDING_to_VALID; idempotent when no input changed"
          - "component.version += 1"

      - from: VALID
        to: STALE
        trigger: "PATCH /nexus-components/{id}"
        actor: NexusAnalyst
        preconditions:
          - "parent FeeStudy.status IN {DRAFT, NEXUS_CERTIFIED, NOTICE_PUBLISHED} (else ERR_STUDY_INVALID_STATE)"
          - "at least one patchable field is present in the body"
        side_effects:
          - "patched inputs stored; growth_demand_units recomputed immediately; plan_based_cost_per_unit_cents, standard_based_cost_per_unit_cents, adopted_cost_per_unit_cents and nexus_ratio set to null (cascade hop 1)"
          - "because the component went STALE, every FeeScheduleItem where nexus_component_id == component.id gets schedule_status = STALE and fee_per_unit_cents = null (cascade hop 2)"
          - "because a child schedule line went STALE, the parent FeeStudy is remanded per FeeStudy NEXUS_CERTIFIED_to_DRAFT or NOTICE_PUBLISHED_to_DRAFT (cascade hop 3, which itself voids the protest tally as hop 4)"
          - "component.version += 1"

      - from: PENDING
        to: PENDING
        trigger: "PATCH /nexus-components/{id}"
        actor: NexusAnalyst
        preconditions:
          - "parent FeeStudy.status IN {DRAFT, NEXUS_CERTIFIED, NOTICE_PUBLISHED}"
        side_effects:
          - "patched inputs stored; growth_demand_units recomputed; component.version += 1"
        note: "A never-allocated component has nothing to invalidate, so no cascade fires."

  - entity: DevelopmentApplication
    initial_state: "UNASSESSED x NOT_DUE"
    terminal_states: []
    transitions:
      - from: "assessment_status=UNASSESSED"
        to: "assessment_status=ASSESSED"
        trigger: "POST /development-applications/{id}/assess"
        actor: PermitOfficer
        preconditions:
          - "the program has exactly one FeeStudy with status == EFFECTIVE (else ERR_NO_EFFECTIVE_STUDY)"
          - "every NexusComponent of that study has allocation_status == VALID (else ERR_COMPONENT_ALLOCATION_STALE)"
          - "count(FeeScheduleItem lines applicable to application.land_use_category inside that study) >= 1 (else ERR_NO_APPLICABLE_FEE_SCHEDULE)"
        side_effects:
          - "pinned_fee_study_id and pinned_fee_study_version recorded from the effective study"
          - "calculations.application_assessment runs; assessed_lines, gross_assessed_cents, credit_applied_cents, admin_charge_cents, net_due_cents written; assessed_at = clock"
          - "for each assessed line, FacilityCategory.committed_demand_units += line.demand_units and that category's version += 1"
          - "collection_status: NOT_DUE -> DUE when collection_trigger == PERMIT; stays NOT_DUE when collection_trigger == CERTIFICATE_OF_OCCUPANCY"
          - "reassessment_required = false; application.version += 1"
        note: "Dimension A moves independently of dimension B: the same call advances assessment_status always and collection_status only for PERMIT-triggered projects."

      - from: "assessment_status=ASSESSED"
        to: "assessment_status=REASSESSED"
        trigger: "POST /development-applications/{id}/assess (re-run), or system re-assessment caused by a credit decision"
        actor: PermitOfficer | system
        preconditions:
          - "collection_status != PAID (else ERR_APPLICATION_INVALID_STATE)"
          - "co_issued_at == null (else ERR_APPLICATION_INVALID_STATE)"
          - "when the actor is PermitOfficer: the program has exactly one FeeStudy with status == EFFECTIVE"
        side_effects:
          - "for each previously assessed line, FacilityCategory.committed_demand_units -= old line.demand_units before the new lines are added, so a re-run with unchanged inputs leaves committed_demand_units unchanged"
          - "assessed_lines and all money fields recomputed; reassessed_at = clock; reassessment_required = false"
          - "collection_status unchanged by this dimension"
          - "application.version += 1"

      - from: "assessment_status=REASSESSED"
        to: "assessment_status=REASSESSED"
        trigger: "POST /development-applications/{id}/assess (further re-run), or system re-assessment caused by a credit decision"
        actor: PermitOfficer | system
        preconditions:
          - "collection_status != PAID"
          - "co_issued_at == null"
        side_effects:
          - "same as ASSESSED_to_REASSESSED"

      - from: "collection_status=DUE"
        to: "collection_status=DEFERRED"
        trigger: "POST /deferral-agreements/{id}/decide with decision EXECUTE"
        actor: PermitOfficer
        preconditions:
          - "application.collection_trigger == PERMIT (else ERR_DEFERRAL_INVALID_STATE)"
          - "application.collection_status == DUE"
        side_effects:
          - "FacilityCategory.deferred_receivable_cents += the application's line_net_cents for that category, for every assessed line; each such category version += 1"
          - "application.version += 1"

      - from: "collection_status=DEFERRED"
        to: "collection_status=DELINQUENT"
        trigger: "POST /fee-programs/{id}/deadline-sweep (deferral past due and unpaid)"
        actor: system
        preconditions:
          - "an EXECUTED DeferralAgreement of this application has due_at <= clock"
        side_effects:
          - "that DeferralAgreement transitions EXECUTED -> DEFAULTED"
          - "because the agreement defaulted, application.default_penalty_cents = round_half_up(net_due_cents * FeeProgram.default_penalty_bp / 10000) and net_due_cents += default_penalty_cents"
          - "application.version += 1"

      - from: "collection_status IN {NOT_DUE (CERTIFICATE_OF_OCCUPANCY trigger only), DUE, DEFERRED, DELINQUENT}"
        to: "collection_status=PAID"
        trigger: "POST /development-applications/{id}/payments"
        actor: PermitOfficer
        preconditions:
          - "assessment_status IN {ASSESSED, REASSESSED} (else ERR_APPLICATION_INVALID_STATE)"
          - "reassessment_required == false (else ERR_REASSESSMENT_REQUIRED)"
          - "collection_status != PAID (else ERR_APPLICATION_INVALID_STATE)"
          - "collection_status != NOT_DUE unless collection_trigger == CERTIFICATE_OF_OCCUPANCY (else ERR_APPLICATION_INVALID_STATE)"
          - "amount_cents == net_due_cents - paid_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "one FundLedgerEntry with kind COLLECTION is created per assessed line whose line_net_cents > 0, with facility_category_id from the line, amount_cents = line_net_cents, vintage_at = clock, deadline_at = clock + FeeProgram.statutory_expenditure_deadline_years years, unexpended_cents = amount_cents, entry_status = OPEN"
          - "because those entries exist, each FacilityCategory.fund_balance_cents += the line amount, oldest_unexpended_vintage_at is recomputed, fund_posture is recomputed by calculations.fund_posture, and that category's version += 1"
          - "paid_cents recomputed; collection_status = PAID; application.version += 1"
          - "when an EXECUTED or DEFAULTED DeferralAgreement of this application exists it transitions to SATISFIED, and every FacilityCategory.deferred_receivable_cents that carried this application's lines is reduced back by the same line amounts"

      - from: "co_issued_at == null"
        to: "co_issued_at = clock"
        trigger: "POST /development-applications/{id}/issue-co"
        actor: PermitOfficer
        preconditions:
          - "assessment_status IN {ASSESSED, REASSESSED} (else ERR_APPLICATION_INVALID_STATE)"
          - "collection_status == PAID (else ERR_CO_BLOCKED_UNPAID)"
          - "no DeferralAgreement of this application has status IN {REQUESTED, EXECUTED, DEFAULTED} (else ERR_CO_BLOCKED_UNPAID)"
          - "co_issued_at == null (else ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "co_issued_at = clock; application.version += 1"

  - entity: CreditClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED_FULL, APPROVED_PARTIAL, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED_FULL
        trigger: "POST /credit-claims/{id}/decide with decision APPROVE_FULL"
        actor: NexusAnalyst
        preconditions:
          - "claim.status == SUBMITTED (else ERR_CLAIM_INVALID_STATE)"
          - "application.assessment_status IN {ASSESSED, REASSESSED} (else ERR_APPLICATION_INVALID_STATE)"
          - "application.co_issued_at == null (else ERR_APPLICATION_INVALID_STATE)"
          - "expected_development_application_version == application.version (else ERR_STALE_APPLICATION_VERSION)"
        side_effects:
          - "claim.approved_cents = claim.claimed_credit_cents; decided_by_user_id / decided_at set; claim.version += 1"
          - "because approved credit changed, the application is re-assessed by the system (assessment_status -> REASSESSED, credit_applied_cents / admin_charge_cents / net_due_cents recomputed)"
          - "because net_due_cents fell, when collection_status == PAID and paid_cents > net_due_cents the application's COLLECTION ledger entries become refundable as an overpayment (calculations.refund_amount mode OVERPAYMENT)"
          - "application.version += 1"

      - from: SUBMITTED
        to: APPROVED_PARTIAL
        trigger: "POST /credit-claims/{id}/decide with decision APPROVE_PARTIAL and approved_cents"
        actor: NexusAnalyst
        preconditions:
          - "claim.status == SUBMITTED"
          - "approved_cents present and 0 < approved_cents < claimed_credit_cents (else ERR_INVALID_REQUEST)"
          - "expected_development_application_version == application.version"
        side_effects:
          - "claim.approved_cents = body approved_cents; claim.version += 1"
          - "same system re-assessment and overpayment consequences as APPROVED_FULL"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /credit-claims/{id}/decide with decision DENY"
        actor: NexusAnalyst
        preconditions:
          - "claim.status == SUBMITTED"
          - "expected_development_application_version == application.version"
        side_effects:
          - "claim.approved_cents = 0; decided_by_user_id / decided_at set; claim.version += 1"
          - "no re-assessment fires: the application's money fields and version are untouched"
        note: "Divergent branch: DENY is the only decision that leaves the application row unmodified."

  - entity: DeferralAgreement
    initial_state: REQUESTED
    terminal_states: [DENIED, SATISFIED]
    transitions:
      - from: REQUESTED
        to: EXECUTED
        trigger: "POST /deferral-agreements/{id}/decide with decision EXECUTE"
        actor: PermitOfficer
        preconditions:
          - "agreement.status == REQUESTED (else ERR_DEFERRAL_INVALID_STATE)"
          - "application.collection_trigger == PERMIT AND application.collection_status == DUE (else ERR_DEFERRAL_INVALID_STATE)"
          - "agreement.security_amount_cents >= application.net_due_cents (else ERR_INSUFFICIENT_SECURITY)"
        side_effects:
          - "executed_at = clock; due_at = min(requested_due_at, executed_at + FeeProgram.max_deferral_days days); decided_by_user_id / decided_at set"
          - "application.collection_status = DUE -> DEFERRED with the deferred_receivable_cents side effects listed on that transition"
          - "agreement.version += 1"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /deferral-agreements/{id}/decide with decision DENY"
        actor: PermitOfficer
        preconditions:
          - "agreement.status == REQUESTED"
        side_effects:
          - "decided_by_user_id / decided_at set; agreement.version += 1"
          - "application.collection_status stays DUE and no receivable is booked"
        note: "Divergent branch: DENY touches only the agreement row."

      - from: EXECUTED
        to: DEFAULTED
        trigger: "POST /fee-programs/{id}/deadline-sweep"
        actor: system
        preconditions:
          - "agreement.status == EXECUTED"
          - "agreement.due_at <= clock"
          - "application.collection_status == DEFERRED"
        side_effects:
          - "defaulted_at = clock; agreement.version += 1"
          - "application.collection_status = DEFERRED -> DELINQUENT with the penalty side effects listed on that transition"

      - from: EXECUTED
        to: SATISFIED
        trigger: "POST /development-applications/{id}/payments"
        actor: PermitOfficer
        preconditions:
          - "agreement.status == EXECUTED"
          - "the payment brings application.paid_cents == net_due_cents"
        side_effects:
          - "satisfied_at = clock; agreement.version += 1; the application's deferred receivable is released per the payment transition"

      - from: DEFAULTED
        to: SATISFIED
        trigger: "POST /development-applications/{id}/payments"
        actor: PermitOfficer
        preconditions:
          - "agreement.status == DEFAULTED"
          - "the payment amount equals net_due_cents - paid_cents, penalty included"
        side_effects:
          - "satisfied_at = clock; agreement.version += 1; application.collection_status = DELINQUENT -> PAID"
        note: "Join: both EXECUTED and DEFAULTED converge on SATISFIED, but only this branch has a penalty inside the paid amount."

  - entity: FacilityCategory
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: AT_RISK
        trigger: "system: recomputation by calculations.fund_posture after any ledger mutation or POST /fee-programs/{id}/deadline-sweep"
        actor: system
        preconditions:
          - "refund_due_cents == 0"
          - "at least one COLLECTION entry with entry_status IN {OPEN, PARTIALLY_EXPENDED} has deadline_at <= clock + FeeProgram.at_risk_window_days days"
        side_effects:
          - "fund_posture = AT_RISK; category.version += 1"

      - from: AT_RISK
        to: REFUND_DUE
        trigger: "system: recomputation by calculations.fund_posture after POST /fee-programs/{id}/deadline-sweep"
        actor: system
        preconditions:
          - "refund_due_cents > 0"
        side_effects:
          - "fund_posture = REFUND_DUE; category.version += 1"
          - "while REFUND_DUE, POST /facility-categories/{id}/expenditures is rejected with ERR_FUND_REFUND_OBLIGATION_PENDING"

      - from: COMPLIANT
        to: REFUND_DUE
        trigger: "system: recomputation by calculations.fund_posture after POST /fee-programs/{id}/deadline-sweep"
        actor: system
        preconditions:
          - "refund_due_cents > 0"
        side_effects:
          - "fund_posture = REFUND_DUE; category.version += 1"

      - from: REFUND_DUE
        to: COMPLIANT
        trigger: "system: recomputation by calculations.fund_posture after POST /fund-ledger-entries/{id}/refund"
        actor: system
        preconditions:
          - "refund_due_cents == 0 after the refund"
          - "no remaining COLLECTION entry with entry_status IN {OPEN, PARTIALLY_EXPENDED} has deadline_at <= clock + FeeProgram.at_risk_window_days days"
        side_effects:
          - "fund_posture = COMPLIANT; category.version += 1"

      - from: REFUND_DUE
        to: AT_RISK
        trigger: "system: recomputation by calculations.fund_posture after POST /fund-ledger-entries/{id}/refund"
        actor: system
        preconditions:
          - "refund_due_cents == 0 after the refund"
          - "at least one remaining COLLECTION entry with entry_status IN {OPEN, PARTIALLY_EXPENDED} has deadline_at <= clock + FeeProgram.at_risk_window_days days"
        side_effects:
          - "fund_posture = AT_RISK; category.version += 1"

      - from: AT_RISK
        to: COMPLIANT
        trigger: "system: recomputation by calculations.fund_posture after POST /facility-categories/{id}/expenditures"
        actor: system
        preconditions:
          - "refund_due_cents == 0"
          - "no COLLECTION entry with entry_status IN {OPEN, PARTIALLY_EXPENDED} has deadline_at <= clock + FeeProgram.at_risk_window_days days"
        side_effects:
          - "fund_posture = COMPLIANT; category.version += 1"

  - entity: FundLedgerEntry
    initial_state: OPEN
    terminal_states: [FULLY_EXPENDED, REFUNDED, POSTED]
    transitions:
      - from: OPEN
        to: POSTED
        trigger: "POST /facility-categories/{id}/expenditures or POST /fund-ledger-entries/{id}/refund (rows of kind EXPENDITURE and REFUND)"
        actor: FinanceOfficer
        preconditions:
          - "the created row's kind IN {EXPENDITURE, REFUND}"
        side_effects:
          - "entry_status = POSTED, unexpended_cents = 0, deadline_at = null"
        note: "Non-collection rows are born POSTED and never move again; only COLLECTION rows use the consumption states."

      - from: OPEN
        to: PARTIALLY_EXPENDED
        trigger: "POST /facility-categories/{id}/expenditures (FIFO consumption takes part of this row)"
        actor: system
        preconditions:
          - "entry.kind == COLLECTION AND entry.entry_status == OPEN"
          - "the FIFO sweep consumed 0 < take < entry.unexpended_cents"
        side_effects:
          - "unexpended_cents -= take; entry.version += 1"

      - from: OPEN
        to: FULLY_EXPENDED
        trigger: "POST /facility-categories/{id}/expenditures (FIFO consumption takes this row's whole remainder)"
        actor: system
        preconditions:
          - "entry.kind == COLLECTION AND entry.entry_status == OPEN"
          - "the FIFO sweep consumed take == entry.unexpended_cents"
        side_effects:
          - "unexpended_cents = 0; entry.version += 1"

      - from: PARTIALLY_EXPENDED
        to: FULLY_EXPENDED
        trigger: "POST /facility-categories/{id}/expenditures (a later expenditure finishes this row)"
        actor: system
        preconditions:
          - "entry.entry_status == PARTIALLY_EXPENDED AND take == entry.unexpended_cents"
        side_effects:
          - "unexpended_cents = 0; entry.version += 1"

      - from: OPEN
        to: REFUND_DUE
        trigger: "POST /fee-programs/{id}/deadline-sweep"
        actor: system
        preconditions:
          - "entry.kind == COLLECTION AND entry.entry_status IN {OPEN, PARTIALLY_EXPENDED}"
          - "clock >= entry.deadline_at"
        side_effects:
          - "entry_status = REFUND_DUE; entry.version += 1"
          - "because the entry became REFUND_DUE, FacilityCategory.refund_due_cents and fund_posture are recomputed"
          - "REFUND_DUE rows are excluded from later FIFO expenditure consumption"

      - from: PARTIALLY_EXPENDED
        to: REFUND_DUE
        trigger: "POST /fee-programs/{id}/deadline-sweep"
        actor: system
        preconditions:
          - "entry.entry_status == PARTIALLY_EXPENDED AND clock >= entry.deadline_at"
        side_effects:
          - "entry_status = REFUND_DUE; entry.version += 1; category refund_due_cents and fund_posture recomputed"

      - from: REFUND_DUE
        to: REFUNDED
        trigger: "POST /fund-ledger-entries/{id}/refund"
        actor: FinanceOfficer
        preconditions:
          - "entry.entry_status == REFUND_DUE (else ERR_LEDGER_ENTRY_INVALID_STATE)"
        side_effects:
          - "a REFUND row is created for amount_cents = the entry's unexpended_cents with refunded_entry_id = entry.id"
          - "entry.unexpended_cents = 0; entry_status = REFUNDED; entry.version += 1"
          - "because the REFUND row exists, FacilityCategory.fund_balance_cents -= refund amount, refund_due_cents and oldest_unexpended_vintage_at recomputed, fund_posture recomputed"
          - "DevelopmentApplication.paid_cents recomputed and application.version += 1"

      - from: OPEN
        to: REFUNDED
        trigger: "POST /fund-ledger-entries/{id}/refund (overpayment mode)"
        actor: FinanceOfficer
        preconditions:
          - "entry.entry_status == OPEN AND entry.kind == COLLECTION"
          - "the entry's application has paid_cents > net_due_cents (else ERR_REFUND_NOT_ELIGIBLE)"
        side_effects:
          - "a REFUND row is created for calculations.refund_amount mode OVERPAYMENT; refunded_entry_id = entry.id"
          - "entry.unexpended_cents -= refund amount; entry_status = REFUNDED when unexpended_cents reaches 0, otherwise PARTIALLY_EXPENDED is NOT used - the entry stays OPEN with the reduced remainder"
          - "category and application derived fields recomputed as in REFUND_DUE_to_REFUNDED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version - the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: study-create-stale-program
    parent_entity: FeeProgram
    write_endpoint: "POST /fee-studies"
    occ_field: "expected_fee_program_version"
    description: |
      Creating a FeeStudy against a FeeProgram whose version has advanced since
      the analyst last read it is rejected. A study prices the program's whole
      facility-standard roster and its statutory constants, so a stale view means
      the analyst is drafting against a roster or a constant set that no longer
      exists. Multiple DRAFT studies per program are legitimate, so nothing in the
      state machine would otherwise stop the second writer.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: credit-decide-stale-application
    parent_entity: DevelopmentApplication
    write_endpoint: "POST /credit-claims/{id}/decide"
    occ_field: "expected_development_application_version"
    description: |
      Deciding a CreditClaim against a DevelopmentApplication whose version has
      advanced since the reviewer read it is rejected. Every approval legitimately
      re-assesses the application and moves credit_applied_cents against the
      program credit cap, so a reviewer working from a stale net_due_cents would
      allow a credit the cap no longer has room for.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

  - rule_id: expenditure-stale-category
    parent_entity: FacilityCategory
    write_endpoint: "POST /facility-categories/{id}/expenditures"
    occ_field: "expected_facility_category_version"
    description: |
      Recording an expenditure against a FacilityCategory whose version has
      advanced since the finance officer read its fund is rejected. Two
      expenditures are each legitimate while the balance covers them, so the
      state machine cannot distinguish a writer who has seen the current balance,
      posture and vintage list from one who has not.
    error_id: ERR_STALE_CATEGORY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: growth_demand_units
    entity: NexusComponent
    trigger: "POST /nexus-components (on create), PATCH /nexus-components/{id}, POST /nexus-components/{id}/allocate"
    algorithm_type: aggregation
    formula: |
      growth_demand_units =
          round_half_up(  projected_new_dwelling_units * demand_units_per_dwelling
                        + (projected_new_nonres_sqft / 1000)
                              * demand_units_per_1000_nonres_sqft , 4)
    inputs:
      - "NexusComponent.projected_new_dwelling_units (integer, >= 0)"
      - "NexusComponent.demand_units_per_dwelling (decimal 4dp, >= 0)"
      - "NexusComponent.projected_new_nonres_sqft (integer square feet, >= 0)"
      - "NexusComponent.demand_units_per_1000_nonres_sqft (decimal 4dp, >= 0)"
    constants: []
    precision: "4 decimal places, round_half_up; the two products are summed at full precision and the sum is rounded once"
    worked_example: |
      PARKS component: 1200 dwelling units * 2.5000
        + (0 sqft / 1000) * 0.0000 = 3000.0000 demand units.
      ROADS component: 1200 * 1.0100 + (200,000 sqft / 1000) * 3.7500
        = 1212 + 750 = 1962.0000 demand units.
    note: "This is the scenario's 'growth projection converting new development into service demand units'. It is recomputed on every PATCH even when the component goes STALE, because the demand projection does not depend on the cost allocation."

  - name: cost_per_demand_unit
    entity: NexusComponent
    trigger: "POST /nexus-components/{id}/allocate"
    algorithm_type: threshold
    variants:
      PLAN_BASED: |
        # Incremental-expansion reading: only the growth share of the planned
        # facility programme, net of other committed funding, is recoverable, and
        # it is spread over the smaller of projected growth and the capacity the
        # programme actually buys.
        net_growth_cost_cents =
            round_half_up(planned_facility_cost_cents * planned_growth_share_bp / 10000, 0)
            - planned_other_funding_cents
        denominator = min(growth_demand_units, planned_capacity_demand_units)
        raw_cost_per_unit_cents = net_growth_cost_cents / denominator
      STANDARD_BASED: |
        # Level-of-service reading: the fee buys the adopted standard at today's
        # unit cost, so the planned programme's price tag never enters. Which
        # standard is priced depends on the program's los_policy.
        applicable_los =
            existing_los_per_demand_unit  when FeeProgram.los_policy == EXISTING_DEFICIENCY_EXCLUDED
            max(existing_los_per_demand_unit, planned_los_per_demand_unit)
                                          when FeeProgram.los_policy == PLANNED_STANDARD_ALLOWED
        raw_cost_per_unit_cents = FacilityCategory.unit_cost_cents * applicable_los
    formula: |
      plan_based_cost_per_unit_cents     = round_half_up(PLAN_BASED.raw_cost_per_unit_cents, 0)
      standard_based_cost_per_unit_cents = round_half_up(STANDARD_BASED.raw_cost_per_unit_cents, 0)

      selected_cost_per_unit_cents =
          plan_based_cost_per_unit_cents      when FeeStudy.methodology == PLAN_BASED
          standard_based_cost_per_unit_cents  when FeeStudy.methodology == STANDARD_BASED

      # The existing-tax credit required by the scenario is subtracted from the
      # methodology result and floored at zero, never allowed to go negative.
      adopted_cost_per_unit_cents =
          max(0, selected_cost_per_unit_cents - existing_tax_credit_per_unit_cents)

      # Proportionality evidence required by the rational-nexus test: the planned
      # programme must deliver at least as much capacity as the projected growth
      # demands, otherwise the fee is charging new development for capacity the
      # programme never buys.
      nexus_ratio = round_half_up(
          planned_capacity_demand_units / growth_demand_units, 4)
        when growth_demand_units > 0, else null
    inputs:
      - "NexusComponent.planned_facility_cost_cents, planned_growth_share_bp, planned_other_funding_cents, planned_capacity_demand_units, existing_tax_credit_per_unit_cents"
      - "NexusComponent.growth_demand_units (computed above)"
      - "FacilityCategory.unit_cost_cents, existing_los_per_demand_unit, planned_los_per_demand_unit"
      - "FeeStudy.methodology (selects the variant)"
      - "FeeProgram.los_policy (selects the standard inside STANDARD_BASED)"
    constants:
      - "basis-point denominator 10000"
    precision: "whole cents, round_half_up; both variants are always stored so the record shows the alternative the council did not adopt; nexus_ratio 4dp round_half_up"
    worked_example: |
      PARKS, FeeProgram.los_policy = EXISTING_DEFICIENCY_EXCLUDED:
        planned_facility_cost_cents 500,000,000; planned_growth_share_bp 8000;
        planned_other_funding_cents 50,000,000;
        planned_capacity_demand_units 3500; growth_demand_units 3000;
        FacilityCategory.unit_cost_cents 45,000,000;
        existing_los 0.0030; planned_los 0.0040;
        existing_tax_credit_per_unit_cents 15,000.
        PLAN_BASED:     500,000,000*0.80 = 400,000,000 - 50,000,000 = 350,000,000;
                        denominator min(3000, 3500) = 3000;
                        350,000,000/3000 = 116,666.66... -> 116,667.
        STANDARD_BASED: applicable_los = 0.0030 (existing);
                        45,000,000 * 0.0030 = 135,000 -> 135,000.
        FeeStudy.methodology = PLAN_BASED -> selected 116,667;
                        adopted = 116,667 - 15,000 = 101,667.
        FeeStudy.methodology = STANDARD_BASED -> selected 135,000;
                        adopted = 135,000 - 15,000 = 120,000.
        With los_policy = PLANNED_STANDARD_ALLOWED the STANDARD_BASED figure
                        becomes 45,000,000 * max(0.0030, 0.0040) = 180,000
                        (adopted 165,000) while PLAN_BASED is unchanged.
        nexus_ratio = 3500/3000 = 1.1666... -> 1.1667, identical under both
                        methodologies because it measures capacity, not price.
      ROADS, same program:
        planned_facility_cost_cents 900,000,000; planned_growth_share_bp 6500;
        planned_other_funding_cents 100,000,000;
        planned_capacity_demand_units 2000; growth_demand_units 1962;
        unit_cost_cents 250,000,000; existing_los 0.0008; planned_los 0.0006;
        existing_tax_credit_per_unit_cents 0.
        PLAN_BASED:     900,000,000*0.65 = 585,000,000 - 100,000,000 = 485,000,000;
                        min(1962, 2000) = 1962; 485,000,000/1962 = 247,196.7... -> 247,197.
        STANDARD_BASED: applicable_los = 0.0008 under EITHER los_policy, because
                        planned_los 0.0006 is below existing_los and max() keeps
                        the existing standard: 250,000,000 * 0.0008 = 200,000.
        methodology PLAN_BASED -> selected 247,197; adopted 247,197.
        nexus_ratio = 2000/1962 = 1.019367... -> 1.0194.
    note: |
      Two readings of the same statutory facts. Note that the min() in PLAN_BASED
      and the max()/policy branch in STANDARD_BASED bite in opposite directions:
      raising planned_capacity_demand_units above growth_demand_units cannot change
      the plan-based fee, while flipping los_policy cannot change it at all.

  - name: fee_schedule_item_fee
    entity: FeeScheduleItem
    trigger: "POST /nexus-components/{id}/fee-schedule-items, and recomputation on POST /nexus-components/{id}/allocate"
    algorithm_type: aggregation
    formula: |
      fee_per_unit_cents = round_half_up(
          NexusComponent.adopted_cost_per_unit_cents * conversion_factor, 0)
    inputs:
      - "FeeScheduleItem.conversion_factor (decimal 4dp, > 0) - demand units generated per unit of the land use category"
      - "NexusComponent.adopted_cost_per_unit_cents"
    constants: []
    precision: |
      Whole cents, round_half_up, rounded ONCE per schedule line. The rounded
      fee_per_unit_cents is the only figure that may be multiplied by an
      application's billable units later; the unrounded product is never carried
      forward.
    worked_example: |
      PARKS component with adopted_cost_per_unit_cents 101,667 (PLAN_BASED):
        SINGLE_FAMILY conversion_factor 2.5000 -> 101,667 * 2.5 = 254,167.5
          -> round_half_up -> 254,168.
        MULTI_FAMILY conversion_factor 1.8000 -> 183,000.6 -> 183,001.
      ROADS component with adopted_cost_per_unit_cents 247,197:
        SINGLE_FAMILY conversion_factor 1.0100 -> 249,668.97 -> 249,669.
        RETAIL conversion_factor 6.5000 -> 1,606,780.5 -> 1,606,781.
    note: "The .5 case is deliberate: a round_half_even implementation returns 254,168 for the PARKS line but 183,000 for MULTI_FAMILY, so the mode is observable."

  - name: application_assessment
    entity: DevelopmentApplication
    trigger: "POST /development-applications/{id}/assess, and system re-assessment after POST /credit-claims/{id}/decide"
    algorithm_type: waterfall_allocation
    formula: |
      # ---- step 1: applicable line set (input set filtering) -------------------
      lines = every FeeScheduleItem S such that
                S.nexus_component_id belongs to application.pinned_fee_study_id
            AND S.land_use_category == application.land_use_category
            AND S.schedule_status == VALID
        ordered by FacilityCategory.code ASC
      # a component whose FacilityCategory has no matching land use contributes
      # nothing; an empty set is rejected by ERR_NO_APPLICABLE_FEE_SCHEDULE.

      # ---- step 2: per-line billable units and gross, rounded per line -------
      for each line:
        billable_units =
            application.dwelling_units        when S.unit_basis == PER_DWELLING
            application.nonres_sqft / 1000    when S.unit_basis == PER_1000_SQFT
        line.billable_units    = billable_units
        line.demand_units      = round_half_up(billable_units * S.conversion_factor, 4)
        line.gross_fee_cents   = round_half_up(S.fee_per_unit_cents * billable_units, 0)
      gross_assessed_cents = sum(line.gross_fee_cents)

      # ---- step 3: raw approved credit per facility category ------------------
      for each line:
        line.raw_credit_cents = sum(C.approved_cents) over CreditClaim C where
              C.development_application_id == application.id
          AND C.status IN {APPROVED_FULL, APPROVED_PARTIAL}
          AND C.facility_category_code == line's FacilityCategory.code
        # DENIED and SUBMITTED claims contribute nothing.

      # ---- step 4: aggregate cap on the GROSS fee ----------------------------
      credit_cap_cents = round_half_up(
          gross_assessed_cents * FeeProgram.credit_cap_bp / 10000, 0)
      total_raw_credit_cents = sum(line.raw_credit_cents)
      credit_applied_cents   = min(total_raw_credit_cents, credit_cap_cents)

      # ---- step 5: waterfall the capped total back onto the lines ------------
      remaining = credit_applied_cents
      for each line in FacilityCategory.code ASC order:
        line.credit_cents = min(line.raw_credit_cents, remaining)
        remaining        -= line.credit_cents
      # first bucket fills before the second; a line's own credit can never
      # exceed its own gross fee either, so line.credit_cents is additionally
      # clamped to line.gross_fee_cents and the surplus stays with `remaining`
      # for the next line.

      # ---- step 6: per-line admin charge, rounded per line -------------------
      for each line:
        line.net_before_admin_cents = line.gross_fee_cents - line.credit_cents
        line.admin_charge_cents     = round_half_up(
            line.net_before_admin_cents * FeeProgram.admin_charge_bp / 10000, 0)
        line.line_net_cents         = line.net_before_admin_cents + line.admin_charge_cents
      admin_charge_cents = sum(line.admin_charge_cents)

      # ---- step 7: application totals ---------------------------------------
      net_due_cents = gross_assessed_cents - credit_applied_cents + admin_charge_cents
                      + default_penalty_cents
      assessed_lines = the per-line objects above, in FacilityCategory.code ASC order
    inputs:
      - "DevelopmentApplication.land_use_category, dwelling_units, nonres_sqft, pinned_fee_study_id, default_penalty_cents"
      - "FeeScheduleItem.fee_per_unit_cents, conversion_factor, land_use_category, schedule_status"
      - "CreditClaim.approved_cents, status, facility_category_code"
      - "FeeProgram.credit_cap_bp, admin_charge_bp"
    constants:
      - "basis-point denominator 10000"
    precision: |
      Whole cents throughout. Three rounding decisions are pinned and each is
      observably different from the plausible alternative:
        (a) the credit cap is taken on gross_assessed_cents, not on the
            post-admin total;
        (b) the admin charge is rounded once PER LINE and then summed, not
            computed on the aggregate net;
        (c) the credit waterfall runs in FacilityCategory.code ASC order, so a
            capped credit lands on the alphabetically first category first.
    worked_example: |
      Program admin_charge_bp 300, credit_cap_bp 5000. Study PLAN_BASED with the
      two components above. Application: land_use_category SINGLE_FAMILY,
      dwelling_units 10, nonres_sqft 0, collection_trigger PERMIT.
        lines (code ASC = PARKS, ROADS), both PER_DWELLING so
        billable_units = 10:
          PARKS: fee_per_unit 254,168 * 10 = 2,541,680; demand_units 25.0000
          ROADS: fee_per_unit 249,669 * 10 = 2,496,690; demand_units 10.1000
        gross_assessed_cents = 5,038,370
          (the discarded alternative - multiply unrounded 101,667*2.5*10 and
           254,166.4...*10 then round - yields 5,038,365)
        credit_cap_cents = round_half_up(5,038,370 * 0.50) = 2,519,185
      Case A, no credit claims:
        PARKS admin = round_half_up(2,541,680 * 0.03) = round_half_up(76,250.4) = 76,250
        ROADS admin = round_half_up(2,496,690 * 0.03) = round_half_up(74,900.7) = 74,901
        admin_charge_cents = 151,151; net_due_cents = 5,189,521
        line_net PARKS 2,617,930; ROADS 2,571,591
      Case B, one APPROVED_FULL PARKS claim of 1,000,000 (under the cap):
        credit_applied_cents = 1,000,000, all on PARKS
        PARKS admin = round_half_up(1,541,680 * 0.03) = round_half_up(46,250.4) = 46,250
        ROADS admin = 74,901; admin_charge_cents = 121,151
        net_due_cents = 5,038,370 - 1,000,000 + 121,151 = 4,159,521
      Case C, one APPROVED_FULL PARKS claim of 3,000,000 (over the cap):
        total_raw 3,000,000 -> credit_applied 2,519,185, all on PARKS
        PARKS net_before_admin = 2,541,680 - 2,519,185 = 22,495;
          admin = round_half_up(674.85) = 675
        ROADS admin = 74,901; admin_charge_cents = 75,576
        net_due_cents = 5,038,370 - 2,519,185 + 75,576 = 2,594,761
      Case D, two claims - PARKS 2,500,000 and ROADS 2,400,000:
        total_raw 4,900,000 -> credit_applied 2,519,185
        waterfall: PARKS takes 2,500,000, ROADS takes the remaining 19,185
        PARKS net_before_admin 41,680 -> admin round_half_up(1,250.4) = 1,250
        ROADS net_before_admin 2,477,505 -> admin round_half_up(74,325.15) = 74,325
        admin_charge_cents = 75,575; net_due_cents = 2,594,760
        (aggregate-rounding alternative: 2,519,185 net total * 0.03 on the
         combined 2,519,185 remainder gives 75,576 and 2,594,761 - one cent
         apart, which is exactly what the per-line pin is there to distinguish)
    note: "This is the scenario's fee schedule applied through land use categories and conversion factors, with credits and the administrative charge layered on."

  - name: credit_claim_valuation
    entity: CreditClaim
    trigger: "POST /development-applications/{id}/credit-claims"
    algorithm_type: decay_function
    variants:
      NOMINAL: |
        # Face-value reading: contributions are added up as they will be paid.
        claimed_credit_cents = improvement_value_cents
                             + annual_tax_contribution_cents * contribution_years
      PRESENT_VALUE: |
        # Discounted reading: a dollar of future property tax is worth less than a
        # dollar of improvement delivered today. r = FeeProgram.discount_rate_bp/10000.
        annuity_factor = sum over t = 1..contribution_years of 1 / (1 + r)^t
        pv_tax_cents   = annual_tax_contribution_cents * annuity_factor
        # A developer-built improvement is delivered at the end of the
        # contribution horizon when contribution_years > 0, so it is discounted
        # over the same horizon; with contribution_years == 0 it is undiscounted.
        pv_improvement_cents = improvement_value_cents / (1 + r)^contribution_years
        claimed_credit_cents = round_half_up(pv_tax_cents + pv_improvement_cents, 0)
    formula: |
      valuation_method selects the variant; the result is stored in
      claimed_credit_cents and is the ceiling for any later approval
      (approved_cents <= claimed_credit_cents is enforced by ERR_INVALID_REQUEST).
    inputs:
      - "CreditClaim.improvement_value_cents, annual_tax_contribution_cents, contribution_years, valuation_method"
      - "FeeProgram.discount_rate_bp"
    constants:
      - "basis-point denominator 10000"
    precision: "whole cents, round_half_up, applied once to the summed present value; the annuity factor itself is not rounded"
    worked_example: |
      FeeProgram.discount_rate_bp 400 (r = 0.04).
      Claim X: improvement_value_cents 0, annual_tax_contribution_cents 120,000,
      contribution_years 10.
        NOMINAL:       0 + 120,000 * 10 = 1,200,000
        PRESENT_VALUE: annuity_factor(10, 4%) = 8.110895779...
                       120,000 * 8.110895779 = 973,307.49... -> 973,307
      Claim Y: improvement_value_cents 1,000,000,
      annual_tax_contribution_cents 0, contribution_years 3.
        NOMINAL:       1,000,000
        PRESENT_VALUE: 1,000,000 / 1.04^3 = 888,996.36... -> 888,996
    note: "This is the scenario's 'credit calculation for developer-provided improvements and existing tax contributions'; the per-unit existing-tax credit inside cost_per_demand_unit is the program-wide half of the same idea, and the two are deliberately not the same computation."

  - name: fifo_expenditure_vintage_consumption
    entity: FacilityCategory
    trigger: "POST /facility-categories/{id}/expenditures"
    algorithm_type: chronological
    formula: |
      eligible = every FundLedgerEntry E where
            E.facility_category_id == category.id
        AND E.kind == COLLECTION
        AND E.entry_status IN {OPEN, PARTIALLY_EXPENDED}
        ordered by E.vintage_at ASC, then E.created_at ASC
      # REFUND_DUE, REFUNDED and FULLY_EXPENDED rows are excluded: money that has
      # already breached its statutory deadline may not be spent out from under
      # the refund obligation.

      available = sum(E.unexpended_cents) over eligible
      if amount_cents > available -> ERR_INSUFFICIENT_FUND_BALANCE  (all-or-nothing;
          no partial consumption is written)

      remaining = amount_cents
      for E in eligible:
        take = min(E.unexpended_cents, remaining)
        E.unexpended_cents -= take
        E.entry_status = FULLY_EXPENDED when E.unexpended_cents == 0
                         else PARTIALLY_EXPENDED
        remaining -= take
        stop when remaining == 0

      one FundLedgerEntry of kind EXPENDITURE is created for amount_cents with
      entry_status POSTED, deadline_at null, unexpended_cents 0
      category.fund_balance_cents -= amount_cents
      category.oldest_unexpended_vintage_at = min(E.vintage_at) over the remaining
        eligible rows, or null when none remain
    inputs:
      - "FundLedgerEntry.vintage_at, created_at, unexpended_cents, entry_status, kind"
      - "expenditure amount_cents"
    constants: []
    precision: "whole cents; the oldest vintage is consumed to exhaustion before the next is touched"
    worked_example: |
      PARKS fund holds three COLLECTION rows:
        E1 vintage_at 2026-05-10, unexpended 2,617,930
        E2 vintage_at 2026-06-01, unexpended 1,000,000
        E3 vintage_at 2026-06-01, unexpended   500,000 (created_at after E2)
      An expenditure of 3,000,000 consumes E1 fully (2,617,930), then
      382,070 of E2, leaving E2 at 617,930 PARTIALLY_EXPENDED and E3 untouched
      OPEN. oldest_unexpended_vintage_at becomes 2026-06-01.
      An expenditure of 4,200,000 against the same starting state is rejected:
      available is 4,117,930.
    note: "Out-of-order creation does not change the result: E3 created before E2 with the same vintage_at would swap only their relative order under the created_at ASC tie-break, and both are consumed after E1 either way."

  - name: fund_posture
    entity: FacilityCategory
    trigger: "POST /development-applications/{id}/payments, POST /facility-categories/{id}/expenditures, POST /fund-ledger-entries/{id}/refund, POST /fee-programs/{id}/deadline-sweep"
    algorithm_type: threshold
    formula: |
      # step 1 - only the sweep may convert a breach into an obligation
      when triggered by POST /fee-programs/{id}/deadline-sweep:
        for every FundLedgerEntry E of this category with kind == COLLECTION
        and entry_status IN {OPEN, PARTIALLY_EXPENDED}:
            when clock >= E.deadline_at:  E.entry_status = REFUND_DUE

      # step 2 - derived money fields, recomputed from the ledger every time
      refund_due_cents = sum(E.unexpended_cents) over this category's COLLECTION
                         rows with entry_status == REFUND_DUE
      fund_balance_cents = sum(COLLECTION.amount_cents)
                         - sum(EXPENDITURE.amount_cents)
                         - sum(REFUND.amount_cents)
      oldest_unexpended_vintage_at = min(E.vintage_at) over COLLECTION rows with
                         entry_status IN {OPEN, PARTIALLY_EXPENDED}, else null

      # step 3 - posture, evaluated in this order
      fund_posture =
        REFUND_DUE  when refund_due_cents > 0
        AT_RISK     when refund_due_cents == 0
                     AND exists a COLLECTION row with entry_status IN {OPEN,
                         PARTIALLY_EXPENDED} whose deadline_at
                         <= clock + FeeProgram.at_risk_window_days days
        COMPLIANT   otherwise
    inputs:
      - "FundLedgerEntry rows of the category (kind, entry_status, amount_cents, unexpended_cents, vintage_at, deadline_at)"
      - "FeeProgram.at_risk_window_days, statutory_expenditure_deadline_years"
      - "the logical clock"
    constants: []
    precision: |
      Both comparisons are inclusive and are pinned at the boundary:
        clock >= deadline_at            -> the entry breaches ON its deadline
        deadline_at <= clock + window    -> the fund is AT_RISK exactly one window out
    worked_example: |
      statutory_expenditure_deadline_years 5, at_risk_window_days 365.
      A payment on 2026-05-10T00:00:00Z creates a COLLECTION row with
      vintage_at 2026-05-10T00:00:00Z and deadline_at 2031-05-10T00:00:00Z.
        sweep at 2030-05-09T00:00:00Z -> deadline_at > clock+365d -> COMPLIANT
        sweep at 2030-05-10T00:00:00Z -> deadline_at == clock+365d -> AT_RISK
        sweep at 2031-05-09T00:00:00Z -> clock < deadline_at -> still AT_RISK
        sweep at 2031-05-10T00:00:00Z -> clock == deadline_at -> entry becomes
          REFUND_DUE, refund_due_cents = its unexpended_cents, posture REFUND_DUE,
          and expenditures on this category are refused with
          ERR_FUND_REFUND_OBLIGATION_PENDING
    note: "This is the scenario's 'expenditure within statutory deadlines with refund obligations'; the posture is what turns the deadline into an operational block instead of a report footnote."

  - name: refund_amount
    entity: FundLedgerEntry
    trigger: "POST /fund-ledger-entries/{id}/refund"
    algorithm_type: threshold
    variants:
      DEADLINE_BREACH: |
        # entry.entry_status == REFUND_DUE
        refund_cents = entry.unexpended_cents
      OVERPAYMENT: |
        # entry.entry_status == OPEN and the payer's assessment fell after payment
        application_overpaid_cents = application.paid_cents - application.net_due_cents
        refund_cents = min(entry.unexpended_cents, application_overpaid_cents)
        # rejected with ERR_REFUND_NOT_ELIGIBLE when application_overpaid_cents <= 0
    formula: |
      The variant is selected by the entry's own state, not by a request field:
      a REFUND_DUE row is always a deadline refund, an OPEN row is only ever an
      overpayment refund. A REFUND FundLedgerEntry is created for refund_cents
      with refunded_entry_id = entry.id, and the source entry's unexpended_cents
      is reduced by the same amount.
    inputs:
      - "FundLedgerEntry.entry_status, unexpended_cents, development_application_id"
      - "DevelopmentApplication.paid_cents, net_due_cents"
    constants: []
    precision: "whole cents; the refund can never exceed the source entry's remaining unexpended balance, so a refund followed by a second refund of the same entry returns 0-eligible and is rejected"
    worked_example: |
      Deadline case: PARKS entry of 2,617,930 fully unexpended and REFUND_DUE
      -> refund_cents 2,617,930; category fund_balance_cents drops by the same
      amount; refund_due_cents returns to 0.
      Overpayment case: the application paid 5,189,521; a later APPROVED_FULL
      credit of 1,000,000 re-assesses net_due_cents to 4,159,521, so
      paid - net_due = 1,030,000. The PARKS entry holds 2,617,930 unexpended,
      so refund_cents = 1,030,000 and the entry stays OPEN with 1,587,930.
    note: "The overpayment path is what makes the credit-decision cascade reconcile: money already in the fund is walked back out through the same ledger the collection came in on."

  - name: annual_report_aggregation
    entity: FeeProgram
    trigger: "GET /fee-programs/{id}/annual-report, POST /fee-programs/{id}/annual-report/file"
    algorithm_type: aggregation
    formula: |
      # half-open fiscal-year window, keyed on fiscal_year_start_month
      window_start = the first instant of fiscal_year_start_month in fiscal_year
      window_end   = window_start + 1 year        # exclusive
      in_window(t)  <=>  window_start <= t < window_end

      per FacilityCategory of the program, over its FundLedgerEntry rows:
        collections_cents  = sum(amount_cents) where kind == COLLECTION
                             AND in_window(vintage_at)
        expenditures_cents = sum(amount_cents) where kind == EXPENDITURE
                             AND in_window(created_at)
        refunds_cents      = sum(amount_cents) where kind == REFUND
                             AND in_window(created_at)
        # cumulative, NOT windowed - the statutory disclosure is the balance at
        # the close of the year, including money collected in earlier years
        unexpended_cents   = sum(unexpended_cents) where kind == COLLECTION
                             AND vintage_at < window_end
        refund_obligation_cents = sum(unexpended_cents) where kind == COLLECTION
                             AND entry_status == REFUND_DUE AND vintage_at < window_end
        earliest_deadline_at = min(deadline_at) where kind == COLLECTION
                             AND entry_status IN {OPEN, PARTIALLY_EXPENDED}
                             AND vintage_at < window_end

      program totals are the sums of the per-category figures, and the category
      rows are ordered by FacilityCategory.code ASC.

      filed_late = clock > window_end + FeeProgram.report_grace_days days
    inputs:
      - "FeeProgram.fiscal_year_start_month, report_grace_days"
      - "FundLedgerEntry rows of every category in the program"
      - "requested fiscal_year"
      - "the logical clock (for filed_late)"
    constants: []
    precision: |
      The window is half-open: an entry stamped exactly at window_start is IN,
      an entry stamped exactly at window_end belongs to the next fiscal year.
      The lateness comparison is strict, so filing exactly on the grace deadline
      is on time.
    worked_example: |
      fiscal_year_start_month 7, report_grace_days 180, fiscal_year 2025:
        window_start 2025-07-01T00:00:00Z, window_end 2026-07-01T00:00:00Z.
        A COLLECTION with vintage_at 2026-05-10 is in FY2025.
        A COLLECTION with vintage_at 2026-07-01T00:00:00Z is NOT - it is FY2026.
        Grace deadline = 2026-07-01 + 180 days = 2026-12-28T00:00:00Z:
          filing at 2026-12-28T00:00:00Z -> filed_late false
          filing at 2026-12-28T00:00:01Z -> filed_late true
    note: "This is the scenario's annual reporting obligation; it is also the only read that mixes windowed flows with cumulative balances, which is where a naive implementation reports the wrong unexpended figure."

# =============================================================================
# 1.4 Validation Rules (evaluated in ascending priority; the first violated rule
#     is the only error returned)
# =============================================================================
validations:
  - priority: 1
    category: authentication
    rule: "X-User-ID and X-User-Role headers are present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint except POST /_clock/set_current_utc"

  - priority: 2
    category: authorization
    rule: "X-User-Role is one of the six declared roles AND that role is listed for the endpoint in 1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint"

  - priority: 3
    category: existence
    rule: "the {id} in a /fee-programs/{id} path resolves to a FeeProgram"
    error_id: ERR_FEE_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "GET /fee-programs/{id}, GET /fee-programs/{id}/facility-categories, GET /fee-programs/{id}/annual-report, POST /fee-programs/{id}/deadline-sweep, POST /fee-programs/{id}/annual-report/file"

  - priority: 4
    category: existence
    rule: "the {id} in a /facility-categories/{id} path resolves to a FacilityCategory"
    error_id: ERR_FACILITY_CATEGORY_NOT_FOUND
    http_status: 404
    applies_to: "GET /facility-categories/{id}, POST /facility-categories/{id}/expenditures"

  - priority: 5
    category: existence
    rule: "the {id} in a /fee-studies/{id} path resolves to a FeeStudy"
    error_id: ERR_FEE_STUDY_NOT_FOUND
    http_status: 404
    applies_to: "GET /fee-studies/{id}, GET /fee-studies/{id}/protest-filings, POST /fee-studies/{id}/certify-nexus, POST /fee-studies/{id}/publish-notice, POST /fee-studies/{id}/protest-filings, POST /fee-studies/{id}/close-protest-window, POST /fee-studies/{id}/adopt, POST /fee-studies/{id}/activate"

  - priority: 6
    category: existence
    rule: "the {id} in a /nexus-components/{id} path resolves to a NexusComponent"
    error_id: ERR_NEXUS_COMPONENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /nexus-components/{id}, GET /nexus-components/{id}/fee-schedule-items, PATCH /nexus-components/{id}, POST /nexus-components/{id}/allocate, POST /nexus-components/{id}/fee-schedule-items"

  - priority: 7
    category: existence
    rule: "the {id} in a /development-applications/{id} path resolves to a DevelopmentApplication"
    error_id: ERR_DEVELOPMENT_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /development-applications/{id}, GET /development-applications/{id}/credit-claims, GET /development-applications/{id}/deferral-agreements, POST /development-applications/{id}/assess, POST /development-applications/{id}/credit-claims, POST /development-applications/{id}/deferral-agreements, POST /development-applications/{id}/payments, POST /development-applications/{id}/issue-co"

  - priority: 8
    category: existence
    rule: "the {id} in a /credit-claims/{id} path resolves to a CreditClaim"
    error_id: ERR_CREDIT_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "POST /credit-claims/{id}/decide"

  - priority: 9
    category: existence
    rule: "the {id} in a /deferral-agreements/{id} path resolves to a DeferralAgreement"
    error_id: ERR_DEFERRAL_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /deferral-agreements/{id}/decide"

  - priority: 10
    category: existence
    rule: "the {id} in a /protest-filings/{id} path resolves to a ProtestFiling"
    error_id: ERR_PROTEST_FILING_NOT_FOUND
    http_status: 404
    applies_to: "POST /protest-filings/{id}/withdraw"

  - priority: 11
    category: existence
    rule: "the {id} in a /fund-ledger-entries/{id} path resolves to a FundLedgerEntry"
    error_id: ERR_FUND_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /fund-ledger-entries/{id}, POST /fund-ledger-entries/{id}/refund"

  - priority: 12
    category: schema
    rule: |
      Request body and query parameters satisfy their declared shapes: required
      fields present, types correct, enum values inside the declared set, integers
      inside their declared ranges, decimals within their declared scale, timestamps
      ISO-8601 UTC, limit in 1..100, offset >= 0, dwelling_units and nonres_sqft >= 0
      and not both zero, conversion_factor > 0,
      approved_cents inside 0..claimed_credit_cents for APPROVE_PARTIAL, and
      APPROVE_PARTIAL carrying approved_cents strictly between 0 and claimed_credit_cents.
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "every endpoint that accepts a body or query parameters"

  - priority: 13
    category: existence
    rule: "a fee_program_id, facility_category_id or fee_study_id supplied in a request BODY resolves to an existing row"
    error_id: ERR_INVALID_REFERENCE
    http_status: 404
    applies_to: "POST /facility-categories, POST /fee-studies, POST /nexus-components"

  - priority: 14
    category: existence
    rule: "a NexusComponent's fee_study_id and facility_category_id belong to the same FeeProgram"
    error_id: ERR_PROGRAM_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /nexus-components"

  - priority: 15
    category: ownership
    rule: "when X-User-Role is Developer, X-User-ID equals the DevelopmentApplication's submitted_by_user_id"
    error_id: ERR_NOT_APPLICATION_OWNER
    http_status: 403
    applies_to: "POST /development-applications/{id}/credit-claims, POST /development-applications/{id}/deferral-agreements"

  - priority: 16
    category: concurrency
    rule: "expected_fee_program_version equals the FeeProgram's current version (concurrency rule study-create-stale-program)"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /fee-studies"

  - priority: 17
    category: concurrency
    rule: "expected_development_application_version equals the DevelopmentApplication's current version (concurrency rule credit-decide-stale-application)"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /credit-claims/{id}/decide"

  - priority: 18
    category: concurrency
    rule: "expected_facility_category_version equals the FacilityCategory's current version (concurrency rule expenditure-stale-category)"
    error_id: ERR_STALE_CATEGORY_VERSION
    http_status: 412
    applies_to: "POST /facility-categories/{id}/expenditures"

  - priority: 19
    category: segregation
    rule: "X-User-ID differs from FeeStudy.certified_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /fee-studies/{id}/adopt"

  - priority: 20
    category: segregation
    rule: "X-User-ID is not the authorized_by_user_id of any EXPENDITURE FundLedgerEntry created inside the fiscal year being reported"
    error_id: ERR_REPORT_PREPARER_CONFLICT
    http_status: 409
    applies_to: "POST /fee-programs/{id}/annual-report/file"

  - priority: 21
    category: state
    rule: "the FeeStudy is in a status that admits the requested transition (see 1.2 FeeStudy)"
    error_id: ERR_STUDY_INVALID_STATE
    http_status: 409
    applies_to: "POST /fee-studies/{id}/certify-nexus, POST /fee-studies/{id}/publish-notice, POST /fee-studies/{id}/close-protest-window, POST /fee-studies/{id}/adopt, POST /fee-studies/{id}/activate, POST /fee-studies/{id}/protest-filings, POST /nexus-components, PATCH /nexus-components/{id}, POST /nexus-components/{id}/allocate, POST /nexus-components/{id}/fee-schedule-items"

  - priority: 22
    category: state
    rule: "every NexusComponent in scope has allocation_status VALID and at least one FeeScheduleItem"
    error_id: ERR_COMPONENT_ALLOCATION_STALE
    http_status: 409
    applies_to: "POST /fee-studies/{id}/certify-nexus, POST /development-applications/{id}/assess"

  - priority: 23
    category: state
    rule: "the FeeStudy has at least one NexusComponent"
    error_id: ERR_STUDY_HAS_NO_COMPONENTS
    http_status: 409
    applies_to: "POST /fee-studies/{id}/certify-nexus"

  - priority: 24
    category: state
    rule: "the ProtestFiling is RECORDED and its FeeStudy is still NOTICE_PUBLISHED"
    error_id: ERR_PROTEST_INVALID_STATE
    http_status: 409
    applies_to: "POST /protest-filings/{id}/withdraw"

  - priority: 25
    category: state
    rule: "the DevelopmentApplication's program has exactly one FeeStudy in status EFFECTIVE"
    error_id: ERR_NO_EFFECTIVE_STUDY
    http_status: 409
    applies_to: "POST /development-applications/{id}/assess"

  - priority: 26
    category: state
    rule: "the DevelopmentApplication's assessment_status / collection_status / co_issued_at admit the requested operation (see 1.2 DevelopmentApplication)"
    error_id: ERR_APPLICATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /development-applications/{id}/assess, POST /development-applications/{id}/credit-claims, POST /development-applications/{id}/deferral-agreements, POST /development-applications/{id}/payments, POST /development-applications/{id}/issue-co, POST /credit-claims/{id}/decide"

  - priority: 27
    category: state
    rule: "the DevelopmentApplication has reassessment_required == false"
    error_id: ERR_REASSESSMENT_REQUIRED
    http_status: 409
    applies_to: "POST /development-applications/{id}/payments, POST /development-applications/{id}/issue-co"

  - priority: 28
    category: state
    rule: "the CreditClaim is SUBMITTED"
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "POST /credit-claims/{id}/decide"

  - priority: 29
    category: state
    rule: "the DeferralAgreement's status admits the requested decision, and its application is PERMIT-triggered and DUE"
    error_id: ERR_DEFERRAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /deferral-agreements/{id}/decide"

  - priority: 30
    category: state
    rule: "the FacilityCategory's fund_posture is not REFUND_DUE - an outstanding statutory refund obligation must be discharged before any further expenditure from that fund"
    error_id: ERR_FUND_REFUND_OBLIGATION_PENDING
    http_status: 409
    applies_to: "POST /facility-categories/{id}/expenditures"
    conflict_note: "Deliberately ordered ABOVE the fiscal check at priority 53: a REFUND_DUE fund whose balance also cannot cover the expenditure returns ERR_FUND_REFUND_OBLIGATION_PENDING, never ERR_INSUFFICIENT_FUND_BALANCE."

  - priority: 31
    category: state
    rule: "the FundLedgerEntry's entry_status admits a refund (REFUND_DUE, or OPEN for the overpayment path) and its kind is COLLECTION"
    error_id: ERR_LEDGER_ENTRY_INVALID_STATE
    http_status: 409
    applies_to: "POST /fund-ledger-entries/{id}/refund"

  - priority: 32
    category: state
    rule: "collection_status is PAID and no DeferralAgreement of the application is REQUESTED, EXECUTED or DEFAULTED"
    error_id: ERR_CO_BLOCKED_UNPAID
    http_status: 409
    applies_to: "POST /development-applications/{id}/issue-co"

  - priority: 33
    category: state
    rule: "the fiscal year has no AnnualReport already filed for this program"
    error_id: ERR_REPORT_ALREADY_FILED
    http_status: 409
    applies_to: "POST /fee-programs/{id}/annual-report/file"

  - priority: 34
    category: business_constraint
    rule: "jurisdiction_code is unique across FeeProgram"
    error_id: ERR_DUPLICATE_JURISDICTION_CODE
    http_status: 409
    applies_to: "POST /fee-programs"

  - priority: 35
    category: business_constraint
    rule: "FacilityCategory.code is unique within its FeeProgram"
    error_id: ERR_DUPLICATE_CATEGORY_CODE
    http_status: 409
    applies_to: "POST /facility-categories"

  - priority: 36
    category: business_constraint
    rule: "a FeeStudy has at most one NexusComponent per FacilityCategory"
    error_id: ERR_DUPLICATE_NEXUS_COMPONENT
    http_status: 409
    applies_to: "POST /nexus-components"

  - priority: 37
    category: business_constraint
    rule: "a NexusComponent has at most one FeeScheduleItem per land_use_category"
    error_id: ERR_DUPLICATE_SCHEDULE_ITEM
    http_status: 409
    applies_to: "POST /nexus-components/{id}/fee-schedule-items"

  - priority: 38
    category: business_constraint
    rule: "DevelopmentApplication.permit_number is unique within its FeeProgram"
    error_id: ERR_DUPLICATE_PERMIT_NUMBER
    http_status: 409
    applies_to: "POST /development-applications"

  - priority: 39
    category: business_constraint
    rule: "unit_basis matches land_use_category (PER_DWELLING for SINGLE_FAMILY and MULTI_FAMILY, PER_1000_SQFT for RETAIL, OFFICE and INDUSTRIAL) AND the parent component carries a non-zero factor for that basis (demand_units_per_dwelling > 0 for PER_DWELLING, demand_units_per_1000_nonres_sqft > 0 for PER_1000_SQFT)"
    error_id: ERR_UNIT_BASIS_MISMATCH
    http_status: 422
    applies_to: "POST /nexus-components/{id}/fee-schedule-items"

  - priority: 40
    category: business_constraint
    rule: |
      A new NexusComponent's [horizon_start_year, horizon_end_year] interval must
      not overlap the interval of the component that prices the SAME
      FacilityCategory inside the program's currently EFFECTIVE FeeStudy - new
      development may not be charged twice for the same category over the same
      years. The interval is CLOSED and inclusive on both ends and its endpoints
      are integer years, so 2026..2030 and 2030..2035 DO overlap on 2030 and are
      rejected, while 2026..2030 and 2031..2035 are accepted. Components of DRAFT,
      NEXUS_CERTIFIED, NOTICE_PUBLISHED, PROTEST_CLEARED, ADOPTED and SUPERSEDED
      studies are ignored, so competing drafts of the same years may coexist.
    error_id: ERR_HORIZON_OVERLAP
    http_status: 409
    applies_to: "POST /nexus-components, PATCH /nexus-components/{id}"

  - priority: 41
    category: business_constraint
    rule: |
      No other FeeStudy of the same FeeProgram may be inside its statutory notice
      window. The window is the HALF-OPEN timestamp interval
      [notice_published_at, protest_window_ends_at) occupied by any study in status
      NOTICE_PUBLISHED, PROTEST_CLEARED or ADOPTED, so publishing a notice exactly
      at another study's protest_window_ends_at is ACCEPTED - adjacency is not
      overlap for timestamps, unlike the closed integer-year horizon rule above.
    error_id: ERR_NOTICE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /fee-studies/{id}/publish-notice"
    conflict_note: "Deliberately ordered ABOVE the temporal check at priority 42: a second notice with notice_days below the statutory minimum published while another study's window is open returns ERR_NOTICE_WINDOW_OVERLAP, not ERR_NOTICE_PERIOD_TOO_SHORT."

  - priority: 42
    category: temporal
    rule: "notice_days >= FeeProgram.notice_min_days"
    error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /fee-studies/{id}/publish-notice"

  - priority: 43
    category: temporal
    rule: "the logical clock has reached FeeStudy.protest_window_ends_at (inclusive: closing exactly at that instant is allowed)"
    error_id: ERR_PROTEST_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /fee-studies/{id}/close-protest-window"

  - priority: 44
    category: temporal
    rule: "the logical clock has reached FeeStudy.effective_at (inclusive: activating exactly at that instant is allowed)"
    error_id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /fee-studies/{id}/activate"

  - priority: 45
    category: temporal
    rule: "requested_due_at is strictly after the logical clock"
    error_id: ERR_DEFERRAL_DUE_DATE_INVALID
    http_status: 422
    applies_to: "POST /development-applications/{id}/deferral-agreements"

  - priority: 46
    category: temporal
    rule: "the requested fiscal_year's window has closed: clock >= window_end (see calculations.annual_report_aggregation)"
    error_id: ERR_FISCAL_YEAR_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /fee-programs/{id}/annual-report/file"

  - priority: 47
    category: business_constraint
    rule: "a CreditClaim's facility_category_code resolves to a FacilityCategory of the application's FeeProgram that has a NexusComponent in the application's effective study"
    error_id: ERR_CREDIT_CATEGORY_NOT_IN_STUDY
    http_status: 422
    applies_to: "POST /development-applications/{id}/credit-claims"

  - priority: 48
    category: business_constraint
    rule: "min(growth_demand_units, planned_capacity_demand_units) > 0 - a component with no projected growth has no rational nexus to allocate against"
    error_id: ERR_ZERO_DEMAND_UNITS
    http_status: 422
    applies_to: "POST /nexus-components/{id}/allocate"

  - priority: 49
    category: business_constraint
    rule: "every NexusComponent of the study has nexus_ratio >= 1.0"
    error_id: ERR_NEXUS_RATIO_INSUFFICIENT
    http_status: 409
    applies_to: "POST /fee-studies/{id}/certify-nexus"

  - priority: 50
    category: business_constraint
    rule: "at least one VALID FeeScheduleItem in the effective study matches the application's land_use_category"
    error_id: ERR_NO_APPLICABLE_FEE_SCHEDULE
    http_status: 409
    applies_to: "POST /development-applications/{id}/assess"

  - priority: 51
    category: fiscal
    rule: "security_amount_cents >= the application's net_due_cents"
    error_id: ERR_INSUFFICIENT_SECURITY
    http_status: 422
    applies_to: "POST /deferral-agreements/{id}/decide"

  - priority: 52
    category: fiscal
    rule: "amount_cents equals net_due_cents - paid_cents exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /development-applications/{id}/payments"

  - priority: 53
    category: fiscal
    rule: "the expenditure amount_cents does not exceed the sum of unexpended_cents over the category's OPEN and PARTIALLY_EXPENDED COLLECTION entries (all-or-nothing)"
    error_id: ERR_INSUFFICIENT_FUND_BALANCE
    http_status: 422
    applies_to: "POST /facility-categories/{id}/expenditures"

  - priority: 54
    category: fiscal
    rule: "an OPEN entry's application has paid_cents > net_due_cents (there is an overpayment to refund)"
    error_id: ERR_REFUND_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /fund-ledger-entries/{id}/refund"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- reads -----
  - method: GET
    path: /fee-programs/{id}
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: []
    output: FeeProgram
    status: 200
    description: "Reads one impact fee program with its statutory constants and its derived effective_fee_study_id."

  - method: GET
    path: /fee-programs/{id}/facility-categories
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: ["fund_posture?", "limit?", "offset?"]
    output: FacilityCategory[]
    status: 200
    description: "Lists the program's adopted facility standards with their fund posture, ordered by code ASC."

  - method: GET
    path: /fee-programs/{id}/annual-report
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: ["fiscal_year"]
    output: "{ fiscal_year: integer, window_start: string, window_end: string, collections_cents: integer, expenditures_cents: integer, refunds_cents: integer, unexpended_cents: integer, refund_obligation_cents: integer, earliest_deadline_at: string, categories: object[], filed_late: boolean, report_status: string }"
    status: 200
    description: |
      Computed read of the statutory annual report for one fiscal year per
      calculations.annual_report_aggregation. Each element of `categories` carries
      facility_category_id, code, existing_deficiency_demand_units,
      collections_cents, expenditures_cents, refunds_cents, unexpended_cents,
      refund_obligation_cents and earliest_deadline_at, ordered by code ASC.
      report_status is UNFILED until POST .../annual-report/file records it.

  - method: GET
    path: /facility-categories/{id}
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: []
    output: FacilityCategory
    status: 200
    description: "Reads one facility standard with its derived fund_balance_cents, refund_due_cents, committed_demand_units, deferred_receivable_cents and fund_posture."

  - method: GET
    path: /fee-studies
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: ["fee_program_id?", "status?", "methodology?", "superseded_by_fee_study_id?", "limit?", "offset?"]
    output: FeeStudy[]
    status: 200
    description: "Lists fee studies, ordered by created_at ASC. Filtering by superseded_by_fee_study_id reaches the studies a given activation retired."

  - method: GET
    path: /fee-studies/{id}
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: []
    output: FeeStudy
    status: 200
    description: "Reads one fee study with its revision_round, notice window, protest tally and adoption timestamps."

  - method: GET
    path: /fee-studies/{id}/protest-filings
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: ProtestFiling[]
    status: 200
    description: "Lists the protests filed against a study, ordered by created_at ASC."

  - method: GET
    path: /nexus-components
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: ["fee_study_id?", "facility_category_id?", "allocation_status?", "limit?", "offset?"]
    output: NexusComponent[]
    status: 200
    description: "Lists nexus components, ordered by created_at ASC, filterable by their study or their facility standard."

  - method: GET
    path: /nexus-components/{id}
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: []
    output: NexusComponent
    status: 200
    description: "Reads one nexus component with both methodology results, the adopted per-unit cost and the nexus_ratio."

  - method: GET
    path: /nexus-components/{id}/fee-schedule-items
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: ["schedule_status?", "limit?", "offset?"]
    output: FeeScheduleItem[]
    status: 200
    description: "Lists the adopted fee schedule lines of one component, ordered by land_use_category ASC."

  - method: GET
    path: /development-applications
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: ["fee_program_id?", "pinned_fee_study_id?", "assessment_status?", "collection_status?", "reassessment_required?", "limit?", "offset?"]
    output: DevelopmentApplication[]
    status: 200
    description: "Lists development applications, ordered by created_at ASC. Filtering by pinned_fee_study_id reaches every project priced by a given study."

  - method: GET
    path: /development-applications/{id}
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: []
    output: DevelopmentApplication
    status: 200
    description: "Reads one application with its assessed_lines breakdown and all money fields."

  - method: GET
    path: /development-applications/{id}/credit-claims
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: CreditClaim[]
    status: 200
    description: "Lists the credit claims filed against one application, ordered by created_at ASC."

  - method: GET
    path: /development-applications/{id}/deferral-agreements
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: DeferralAgreement[]
    status: 200
    description: "Lists the deferral agreements of one application, ordered by created_at ASC."

  - method: GET
    path: /fund-ledger-entries
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: ["facility_category_id?", "development_application_id?", "refunded_entry_id?", "kind?", "entry_status?", "limit?", "offset?"]
    output: FundLedgerEntry[]
    status: 200
    description: "Lists impact fee fund ledger rows, ordered by vintage_at ASC then created_at ASC - the same order the FIFO expenditure sweep uses."

  - method: GET
    path: /fund-ledger-entries/{id}
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: []
    output: FundLedgerEntry
    status: 200
    description: "Reads one ledger row with its vintage_at, deadline_at, unexpended_cents and entry_status."

  # --------------------------------------------------------------- writes -----
  - method: POST
    path: /fee-programs
    roles: [ProgramAdministrator]
    input: ["name", "jurisdiction_code", "fiscal_year_start_month?", "statutory_expenditure_deadline_years?", "notice_min_days?", "protest_threshold_bp?", "effective_delay_days?", "admin_charge_bp?", "credit_cap_bp?", "los_policy?", "discount_rate_bp?", "max_deferral_days?", "default_penalty_bp?", "at_risk_window_days?", "report_grace_days?"]
    output: FeeProgram
    status: 201
    description: "Creates an impact fee program. Every statutory constant has a default so a minimal body is valid."
    side_effects:
      - "the program is created with version 1, effective_fee_study_id null, last_report_status UNFILED"

  - method: POST
    path: /facility-categories
    roles: [ProgramAdministrator]
    input: ["fee_program_id", "code", "name", "demand_unit_label", "existing_los_per_demand_unit", "planned_los_per_demand_unit", "unit_cost_cents", "existing_deficiency_demand_units?"]
    output: FacilityCategory
    status: 201
    description: "Adopts a facility standard: the existing and planned level of service for one facility category and the unit cost of that facility."
    side_effects:
      - "the category is created with fund_posture COMPLIANT and every derived money field at 0"

  - method: POST
    path: /fee-studies
    roles: [NexusAnalyst]
    input: ["fee_program_id", "title", "methodology", "expected_fee_program_version"]
    output: FeeStudy
    status: 201
    description: "Opens a DRAFT fee study for a program under one of the two cost allocation methodologies. Guarded by concurrency rule study-create-stale-program."
    side_effects:
      - "the study is created in status DRAFT with revision_round 0, protest_weight_bp 0, protest_count 0"
      - "increments FeeProgram.version by 1"

  - method: POST
    path: /nexus-components
    roles: [NexusAnalyst]
    input: ["fee_study_id", "facility_category_id", "horizon_start_year", "horizon_end_year", "projected_new_dwelling_units?", "projected_new_nonres_sqft?", "demand_units_per_dwelling?", "demand_units_per_1000_nonres_sqft?", "planned_facility_cost_cents", "planned_growth_share_bp", "planned_capacity_demand_units", "planned_other_funding_cents?", "existing_tax_credit_per_unit_cents?"]
    output: NexusComponent
    status: 201
    description: "Adds one facility category's growth projection and planned cost programme to a DRAFT study."
    side_effects:
      - "growth_demand_units is computed on create per calculations.growth_demand_units"
      - "allocation_status is PENDING and every cost field is null until the component is allocated"

  - method: PATCH
    path: /nexus-components/{id}
    roles: [NexusAnalyst]
    input: ["horizon_start_year?", "horizon_end_year?", "projected_new_dwelling_units?", "projected_new_nonres_sqft?", "demand_units_per_dwelling?", "demand_units_per_1000_nonres_sqft?", "planned_facility_cost_cents?", "planned_growth_share_bp?", "planned_capacity_demand_units?", "planned_other_funding_cents?", "existing_tax_credit_per_unit_cents?"]
    output: NexusComponent
    status: 200
    description: "Revises a component's growth projection or planned cost programme. On a VALID component this is the head of the four-hop decertification cascade."
    side_effects:
      - "growth_demand_units is recomputed immediately"
      - "a VALID component becomes STALE and its cost fields and nexus_ratio are set to null"
      - "every FeeScheduleItem of the component becomes STALE with fee_per_unit_cents null"
      - "a NEXUS_CERTIFIED or NOTICE_PUBLISHED parent study is remanded to DRAFT with revision_round incremented and its certification cleared"
      - "when the remanded study was NOTICE_PUBLISHED, its notice fields are cleared and every RECORDED ProtestFiling becomes VOIDED with the tally reset to 0"
      - "increments NexusComponent.version by 1"

  - method: POST
    path: /nexus-components/{id}/allocate
    roles: [NexusAnalyst]
    input: []
    output: NexusComponent
    status: 200
    description: "Runs the cost allocation for one component, producing both methodology results, the adopted per-unit cost and the proportionality evidence."
    side_effects:
      - "plan_based_cost_per_unit_cents, standard_based_cost_per_unit_cents, adopted_cost_per_unit_cents and nexus_ratio are written per calculations.cost_per_demand_unit"
      - "allocation_status becomes VALID and allocated_at is stamped from the logical clock"
      - "when the component was STALE, every FeeScheduleItem of the component returns to VALID with fee_per_unit_cents recomputed"
      - "increments NexusComponent.version by 1"

  - method: POST
    path: /nexus-components/{id}/fee-schedule-items
    roles: [NexusAnalyst]
    input: ["land_use_category", "unit_basis", "conversion_factor"]
    output: FeeScheduleItem
    status: 201
    description: "Adopts one fee schedule line, converting the component's per-demand-unit cost into a per-land-use fee through a conversion factor."
    side_effects:
      - "fee_per_unit_cents is computed per calculations.fee_schedule_item_fee and the line is created VALID"

  - method: POST
    path: /fee-studies/{id}/certify-nexus
    roles: [NexusAnalyst]
    input: []
    output: FeeStudy
    status: 200
    description: "Certifies that every component of the study demonstrates a rational nexus and rough proportionality. Records the certifying user id for the later segregation-of-duties check at adoption."
    side_effects:
      - "status DRAFT -> NEXUS_CERTIFIED"
      - "certified_by_user_id = X-User-ID and certified_at = the logical clock"
      - "increments FeeStudy.version by 1"

  - method: POST
    path: /fee-studies/{id}/publish-notice
    roles: [CouncilClerk]
    input: ["notice_method", "notice_days"]
    output: FeeStudy
    status: 200
    description: "Publishes the statutory notice and opens the protest window."
    side_effects:
      - "status NEXUS_CERTIFIED -> NOTICE_PUBLISHED"
      - "notice_published_at = the logical clock and protest_window_ends_at = notice_published_at + notice_days days"
      - "increments FeeStudy.version by 1"

  - method: POST
    path: /fee-studies/{id}/protest-filings
    roles: [CouncilClerk]
    input: ["protester_name", "parcel_count", "weight_bp"]
    output: ProtestFiling
    status: 201
    description: "Records one record-owner protest against a noticed study."
    side_effects:
      - "the filing is created RECORDED with filed_at from the logical clock"
      - "FeeStudy.protest_weight_bp += weight_bp and FeeStudy.protest_count += 1"
      - "increments FeeStudy.version by 1"

  - method: POST
    path: /protest-filings/{id}/withdraw
    roles: [CouncilClerk]
    input: []
    output: ProtestFiling
    status: 200
    description: "Withdraws a recorded protest and removes its weight from the tally."
    side_effects:
      - "status RECORDED -> WITHDRAWN"
      - "FeeStudy.protest_weight_bp -= weight_bp and FeeStudy.protest_count -= 1"
      - "increments FeeStudy.version by 1"

  - method: POST
    path: /fee-studies/{id}/close-protest-window
    roles: [CouncilClerk]
    input: []
    output: FeeStudy
    status: 200
    description: "Closes the protest window once it has run and branches on the tally: below the threshold the study clears, at or above it the study is remanded to DRAFT."
    side_effects:
      - "when protest_weight_bp < FeeProgram.protest_threshold_bp: status NOTICE_PUBLISHED -> PROTEST_CLEARED and the filings are left on the record"
      - "when protest_weight_bp >= FeeProgram.protest_threshold_bp: status NOTICE_PUBLISHED -> DRAFT, revision_round += 1, certification and notice fields cleared, every RECORDED ProtestFiling becomes VOIDED and the tally is reset to 0"
      - "increments FeeStudy.version by 1"

  - method: POST
    path: /fee-studies/{id}/adopt
    roles: [CouncilClerk]
    input: []
    output: FeeStudy
    status: 200
    description: "Adopts the fee schedule and fixes the statutory effective date. The user id that certified the nexus findings may not adopt them."
    side_effects:
      - "status PROTEST_CLEARED -> ADOPTED"
      - "adopted_at = the logical clock, adopted_by_user_id = X-User-ID, effective_at = adopted_at + FeeProgram.effective_delay_days days"
      - "increments FeeStudy.version by 1"

  - method: POST
    path: /fee-studies/{id}/activate
    roles: [ProgramAdministrator]
    input: []
    output: FeeStudy
    status: 200
    description: "Puts an adopted study into effect once its statutory effective date has arrived, retiring the study it replaces."
    side_effects:
      - "status ADOPTED -> EFFECTIVE and activated_at = the logical clock"
      - "the program's prior EFFECTIVE study becomes SUPERSEDED with superseded_by_fee_study_id set to this study"
      - "every unpaid DevelopmentApplication pinned to the superseded study gets reassessment_required = true and its version incremented"
      - "increments FeeStudy.version by 1 and FeeProgram.version by 1"

  - method: POST
    path: /development-applications
    roles: [Developer]
    input: ["fee_program_id", "permit_number", "land_use_category", "collection_trigger", "dwelling_units?", "nonres_sqft?"]
    output: DevelopmentApplication
    status: 201
    description: "Files a development application under a program, declaring whether the fee is collected at permit issuance or at certificate of occupancy."
    side_effects:
      - "submitted_by_user_id = X-User-ID"
      - "assessment_status UNASSESSED, collection_status NOT_DUE, every money field 0 and reassessment_required false"

  - method: POST
    path: /development-applications/{id}/assess
    roles: [PermitOfficer]
    input: []
    output: DevelopmentApplication
    status: 200
    description: "Prices the application against the program's effective fee schedule, applying approved credits, the credit cap and the administrative charge."
    side_effects:
      - "pinned_fee_study_id and pinned_fee_study_version are set from the program's EFFECTIVE study"
      - "assessed_lines, gross_assessed_cents, credit_applied_cents, admin_charge_cents and net_due_cents are written per calculations.application_assessment"
      - "assessment_status UNASSESSED -> ASSESSED, or ASSESSED/REASSESSED -> REASSESSED with the previous lines' demand units first removed from each FacilityCategory.committed_demand_units"
      - "each assessed line's demand units are added to that FacilityCategory.committed_demand_units and that category's version is incremented"
      - "collection_status NOT_DUE -> DUE only when collection_trigger is PERMIT"
      - "reassessment_required = false; increments DevelopmentApplication.version by 1"

  - method: POST
    path: /development-applications/{id}/credit-claims
    roles: [Developer]
    input: ["facility_category_code", "credit_type", "valuation_method", "improvement_value_cents?", "annual_tax_contribution_cents?", "contribution_years?"]
    output: CreditClaim
    status: 201
    description: "Claims credit for a developer-provided improvement or for existing tax contributions, valued nominally or in present value."
    side_effects:
      - "claimed_credit_cents is computed per calculations.credit_claim_valuation"
      - "the claim is created SUBMITTED with approved_cents 0; the application's money fields are untouched until the claim is decided"

  - method: POST
    path: /credit-claims/{id}/decide
    roles: [NexusAnalyst]
    input: ["decision", "expected_development_application_version", "approved_cents?"]
    output: CreditClaim
    status: 200
    description: "Approves a credit claim in full, approves it partially, or denies it. Guarded by concurrency rule credit-decide-stale-application."
    side_effects:
      - "status SUBMITTED -> APPROVED_FULL, APPROVED_PARTIAL or DENIED; approved_cents, decided_by_user_id and decided_at are written"
      - "on APPROVE_FULL and APPROVE_PARTIAL the application is re-assessed by the system: assessment_status becomes REASSESSED and credit_applied_cents, admin_charge_cents and net_due_cents are recomputed under the credit cap"
      - "on APPROVE_FULL and APPROVE_PARTIAL, increments DevelopmentApplication.version by 1"
      - "on DENY nothing outside the claim row changes"

  - method: POST
    path: /development-applications/{id}/deferral-agreements
    roles: [Developer]
    input: ["requested_security_type", "security_amount_cents", "requested_due_at"]
    output: DeferralAgreement
    status: 201
    description: "Requests a deferral of collection from permit issuance to a later date, offering security."
    side_effects:
      - "the agreement is created REQUESTED with due_at null; the application's collection_status is unchanged"

  - method: POST
    path: /deferral-agreements/{id}/decide
    roles: [PermitOfficer]
    input: ["decision"]
    output: DeferralAgreement
    status: 200
    description: "Executes or denies a requested deferral agreement."
    side_effects:
      - "on EXECUTE: status REQUESTED -> EXECUTED, executed_at = the logical clock, due_at = min(requested_due_at, executed_at + FeeProgram.max_deferral_days days)"
      - "on EXECUTE: the application's collection_status DUE -> DEFERRED and each assessed line's line_net_cents is added to that FacilityCategory.deferred_receivable_cents"
      - "on EXECUTE: increments DevelopmentApplication.version by 1"
      - "on DENY: status REQUESTED -> DENIED and nothing outside the agreement row changes"

  - method: POST
    path: /development-applications/{id}/payments
    roles: [PermitOfficer]
    input: ["amount_cents", "payment_reference?"]
    output: DevelopmentApplication
    status: 200
    description: "Collects the fee, in full, at permit issuance, at certificate of occupancy, or on a deferral coming due."
    side_effects:
      - "one COLLECTION FundLedgerEntry per assessed line with a positive line_net_cents, each with vintage_at from the logical clock and deadline_at = vintage_at + FeeProgram.statutory_expenditure_deadline_years years"
      - "each affected FacilityCategory.fund_balance_cents increases by its line amount, oldest_unexpended_vintage_at and fund_posture are recomputed, and that category's version is incremented"
      - "paid_cents is recomputed and collection_status becomes PAID"
      - "any EXECUTED or DEFAULTED DeferralAgreement becomes SATISFIED and the corresponding deferred_receivable_cents are released"
      - "increments DevelopmentApplication.version by 1"

  - method: POST
    path: /development-applications/{id}/issue-co
    roles: [PermitOfficer]
    input: []
    output: DevelopmentApplication
    status: 200
    description: "Issues the certificate of occupancy, which is blocked while any fee or deferral obligation is outstanding."
    side_effects:
      - "co_issued_at = the logical clock; the application can no longer be re-assessed"
      - "increments DevelopmentApplication.version by 1"

  - method: POST
    path: /facility-categories/{id}/expenditures
    roles: [FinanceOfficer]
    input: ["amount_cents", "project_name", "expected_facility_category_version"]
    output: FundLedgerEntry
    status: 201
    description: "Spends impact fee revenue on a capital project, consuming the oldest vintages first. Guarded by concurrency rule expenditure-stale-category."
    side_effects:
      - "the category's OPEN and PARTIALLY_EXPENDED COLLECTION rows are consumed in vintage_at ASC then created_at ASC order per calculations.fifo_expenditure_vintage_consumption; REFUND_DUE rows are skipped"
      - "one EXPENDITURE FundLedgerEntry is created POSTED with authorized_by_user_id = X-User-ID"
      - "fund_balance_cents, oldest_unexpended_vintage_at and fund_posture are recomputed"
      - "increments FacilityCategory.version by 1"

  - method: POST
    path: /fund-ledger-entries/{id}/refund
    roles: [FinanceOfficer]
    input: ["reason?"]
    output: FundLedgerEntry
    status: 201
    description: "Refunds a collection: either the statutory refund of money unexpended past its deadline, or the return of an overpayment created by a later credit approval. The variant is selected by the source row's own state."
    side_effects:
      - "one REFUND FundLedgerEntry is created POSTED with refunded_entry_id pointing at the source row and authorized_by_user_id = X-User-ID"
      - "the source row's unexpended_cents is reduced by the refunded amount and its entry_status becomes REFUNDED when it reaches 0"
      - "the category's fund_balance_cents, refund_due_cents, oldest_unexpended_vintage_at and fund_posture are recomputed and its version is incremented"
      - "on the overpayment variant the application's paid_cents is recomputed and its version is incremented"

  - method: POST
    path: /fee-programs/{id}/deadline-sweep
    roles: [ProgramAdministrator]
    input: []
    output: "{ refund_due_entry_ids: string[], refund_due_entry_count: integer, defaulted_agreement_ids: string[], delinquent_application_ids: string[], at_risk_category_ids: string[], refund_due_category_ids: string[] }"
    status: 200
    description: "Runs the statutory clock over the whole program: converts collections past their expenditure deadline into refund obligations, defaults deferral agreements that have come due, and recomputes every category's fund posture."
    side_effects:
      - "every COLLECTION row with clock >= deadline_at becomes REFUND_DUE"
      - "every EXECUTED DeferralAgreement with due_at <= clock becomes DEFAULTED, its application becomes DELINQUENT and a default penalty is added to net_due_cents"
      - "every category's refund_due_cents and fund_posture are recomputed per calculations.fund_posture"

  - method: POST
    path: /fee-programs/{id}/annual-report/file
    roles: [FinanceOfficer]
    input: ["fiscal_year"]
    output: "{ fiscal_year: integer, filed_at: string, filed_late: boolean, report_status: string, collections_cents: integer, expenditures_cents: integer, refunds_cents: integer, unexpended_cents: integer, refund_obligation_cents: integer }"
    status: 201
    description: "Files the statutory annual report for a closed fiscal year. The officer who authorized expenditures inside that year may not file its report."
    side_effects:
      - "FeeProgram.last_report_fiscal_year, last_report_filed_at, last_report_filed_by_user_id and last_report_status (FILED_ON_TIME or FILED_LATE) are written"
      - "increments FeeProgram.version by 1"

  - method: POST
    path: /_clock/set_current_utc
    roles: [ProgramAdministrator, NexusAnalyst, CouncilClerk, PermitOfficer, Developer, FinanceOfficer]
    input: ["current_utc"]
    output: "{ current_utc: string }"
    status: 200
    description: "Test-only control endpoint that sets the logical clock every timestamp, statutory window and deadline in this service reads. The default logical clock before any call to this endpoint is 2026-08-01T00:00:00Z."

# =============================================================================
# 1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    trigger: "X-User-ID or X-User-Role header missing or blank"
    message: "Authentication headers are required."
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    trigger: "X-User-Role is not permitted to call this endpoint"
    message: "Role is not permitted to perform this operation."
  - error_id: ERR_FEE_PROGRAM_NOT_FOUND
    http_status: 404
    trigger: "no FeeProgram with the given id"
    message: "Fee program not found."
  - error_id: ERR_FACILITY_CATEGORY_NOT_FOUND
    http_status: 404
    trigger: "no FacilityCategory with the given id"
    message: "Facility category not found."
  - error_id: ERR_FEE_STUDY_NOT_FOUND
    http_status: 404
    trigger: "no FeeStudy with the given id"
    message: "Fee study not found."
  - error_id: ERR_NEXUS_COMPONENT_NOT_FOUND
    http_status: 404
    trigger: "no NexusComponent with the given id"
    message: "Nexus component not found."
  - error_id: ERR_DEVELOPMENT_APPLICATION_NOT_FOUND
    http_status: 404
    trigger: "no DevelopmentApplication with the given id"
    message: "Development application not found."
  - error_id: ERR_CREDIT_CLAIM_NOT_FOUND
    http_status: 404
    trigger: "no CreditClaim with the given id"
    message: "Credit claim not found."
  - error_id: ERR_DEFERRAL_AGREEMENT_NOT_FOUND
    http_status: 404
    trigger: "no DeferralAgreement with the given id"
    message: "Deferral agreement not found."
  - error_id: ERR_PROTEST_FILING_NOT_FOUND
    http_status: 404
    trigger: "no ProtestFiling with the given id"
    message: "Protest filing not found."
  - error_id: ERR_FUND_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    trigger: "no FundLedgerEntry with the given id"
    message: "Fund ledger entry not found."
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    trigger: "a required field is missing, or a field violates its declared type, enum, range or scale"
    message: "Request payload is invalid."
  - error_id: ERR_INVALID_REFERENCE
    http_status: 404
    trigger: "a fee_program_id, fee_study_id or facility_category_id in the request body does not resolve"
    message: "Referenced entity does not exist."
  - error_id: ERR_PROGRAM_SCOPE_MISMATCH
    http_status: 422
    trigger: "a component's study and facility category belong to different fee programs"
    message: "Fee study and facility category belong to different fee programs."
  - error_id: ERR_NOT_APPLICATION_OWNER
    http_status: 403
    trigger: "a Developer acts on a DevelopmentApplication submitted by a different user id"
    message: "Only the submitting developer may act on this application."
  - error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    trigger: "expected_fee_program_version does not match the FeeProgram's current version"
    message: "Fee program has changed since it was read."
  - error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    trigger: "expected_development_application_version does not match the application's current version"
    message: "Development application has changed since it was read."
  - error_id: ERR_STALE_CATEGORY_VERSION
    http_status: 412
    trigger: "expected_facility_category_version does not match the category's current version"
    message: "Facility category has changed since it was read."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    trigger: "the user id adopting a study is the user id that certified its nexus findings"
    message: "The user who certified the nexus findings may not adopt the study."
  - error_id: ERR_REPORT_PREPARER_CONFLICT
    http_status: 409
    trigger: "the user id filing an annual report authorized an expenditure inside the reported fiscal year"
    message: "A user who authorized expenditures in the fiscal year may not file its annual report."
  - error_id: ERR_STUDY_INVALID_STATE
    http_status: 409
    trigger: "the FeeStudy's status does not admit the requested transition or child mutation"
    message: "Fee study is not in a state that allows this operation."
  - error_id: ERR_COMPONENT_ALLOCATION_STALE
    http_status: 409
    trigger: "a NexusComponent in scope is PENDING or STALE, or has no fee schedule lines"
    message: "Every nexus component must be allocated with an adopted fee schedule."
  - error_id: ERR_STUDY_HAS_NO_COMPONENTS
    http_status: 409
    trigger: "certification attempted on a study with no NexusComponent"
    message: "Fee study has no nexus components to certify."
  - error_id: ERR_PROTEST_INVALID_STATE
    http_status: 409
    trigger: "withdrawal attempted on a filing that is not RECORDED, or whose study has left NOTICE_PUBLISHED"
    message: "Protest filing cannot be withdrawn in its current state."
  - error_id: ERR_NO_EFFECTIVE_STUDY
    http_status: 409
    trigger: "assessment attempted while the program has no EFFECTIVE fee study"
    message: "Program has no effective fee study."
  - error_id: ERR_APPLICATION_INVALID_STATE
    http_status: 409
    trigger: "the application's assessment_status, collection_status or co_issued_at does not admit the operation"
    message: "Development application is not in a state that allows this operation."
  - error_id: ERR_REASSESSMENT_REQUIRED
    http_status: 409
    trigger: "payment or certificate issuance attempted while reassessment_required is true"
    message: "Application must be re-assessed against the current effective fee schedule first."
  - error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    trigger: "a decision is attempted on a CreditClaim that is not SUBMITTED"
    message: "Credit claim has already been decided."
  - error_id: ERR_DEFERRAL_INVALID_STATE
    http_status: 409
    trigger: "a decision is attempted on an agreement that is not REQUESTED, or on an application that is not PERMIT-triggered and DUE"
    message: "Deferral agreement cannot be decided in this state."
  - error_id: ERR_FUND_REFUND_OBLIGATION_PENDING
    http_status: 409
    trigger: "an expenditure is attempted on a category whose fund_posture is REFUND_DUE"
    message: "Outstanding statutory refund obligation must be discharged before further expenditure."
  - error_id: ERR_LEDGER_ENTRY_INVALID_STATE
    http_status: 409
    trigger: "a refund is attempted on a row that is not a refundable COLLECTION row"
    message: "Ledger entry is not refundable in its current state."
  - error_id: ERR_CO_BLOCKED_UNPAID
    http_status: 409
    trigger: "certificate issuance attempted while the fee is unpaid or a deferral is still open"
    message: "Certificate of occupancy is blocked until the impact fee obligation is satisfied."
  - error_id: ERR_REPORT_ALREADY_FILED
    http_status: 409
    trigger: "an annual report has already been filed for the requested fiscal year"
    message: "Annual report for this fiscal year has already been filed."
  - error_id: ERR_DUPLICATE_JURISDICTION_CODE
    http_status: 409
    trigger: "jurisdiction_code already used by another FeeProgram"
    message: "Jurisdiction code is already in use."
  - error_id: ERR_DUPLICATE_CATEGORY_CODE
    http_status: 409
    trigger: "the facility category code already exists in the program"
    message: "Facility category code already exists in this program."
  - error_id: ERR_DUPLICATE_NEXUS_COMPONENT
    http_status: 409
    trigger: "the study already has a component for that facility category"
    message: "Fee study already prices this facility category."
  - error_id: ERR_DUPLICATE_SCHEDULE_ITEM
    http_status: 409
    trigger: "the component already has a schedule line for that land use category"
    message: "Fee schedule line already exists for this land use category."
  - error_id: ERR_DUPLICATE_PERMIT_NUMBER
    http_status: 409
    trigger: "the permit number already exists in the program"
    message: "Permit number already exists in this program."
  - error_id: ERR_UNIT_BASIS_MISMATCH
    http_status: 422
    trigger: "unit_basis contradicts the land use category, or the parent component has no demand factor for that basis"
    message: "Unit basis is not valid for this land use category."
  - error_id: ERR_HORIZON_OVERLAP
    http_status: 409
    trigger: "the component's inclusive horizon year range touches the range priced for the same facility category by the program's effective study"
    message: "Projection horizon overlaps an existing component for this facility category."
  - error_id: ERR_NOTICE_WINDOW_OVERLAP
    http_status: 409
    trigger: "another study of the program is inside its statutory notice window"
    message: "Another fee study is already inside its statutory notice window."
  - error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 422
    trigger: "notice_days is below the program's notice_min_days"
    message: "Notice period is shorter than the statutory minimum."
  - error_id: ERR_PROTEST_WINDOW_OPEN
    http_status: 409
    trigger: "the protest window has not yet run"
    message: "Protest window has not closed yet."
  - error_id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http_status: 409
    trigger: "activation attempted before the study's effective_at"
    message: "Statutory effective date has not been reached."
  - error_id: ERR_DEFERRAL_DUE_DATE_INVALID
    http_status: 422
    trigger: "requested_due_at is not after the logical clock"
    message: "Requested deferral due date must be in the future."
  - error_id: ERR_FISCAL_YEAR_NOT_COMPLETE
    http_status: 409
    trigger: "the requested fiscal year has not closed"
    message: "Fiscal year has not closed yet."
  - error_id: ERR_CREDIT_CATEGORY_NOT_IN_STUDY
    http_status: 422
    trigger: "the claimed facility_category_code is not priced by the application's effective study"
    message: "Claimed facility category is not priced by the effective fee study."
  - error_id: ERR_ZERO_DEMAND_UNITS
    http_status: 422
    trigger: "the component's growth or planned capacity is zero, leaving nothing to allocate against"
    message: "Component has no demand units to allocate cost across."
  - error_id: ERR_NEXUS_RATIO_INSUFFICIENT
    http_status: 409
    trigger: "a component's planned capacity is below its projected growth demand, so nexus_ratio is under 1.0"
    message: "Planned capacity does not cover projected growth demand; the rational nexus fails."
  - error_id: ERR_NO_APPLICABLE_FEE_SCHEDULE
    http_status: 409
    trigger: "no VALID fee schedule line in the effective study matches the application's land use category"
    message: "Effective fee schedule has no line for this land use category."
  - error_id: ERR_INSUFFICIENT_SECURITY
    http_status: 422
    trigger: "the offered security is below the application's net_due_cents"
    message: "Offered security does not cover the deferred fee."
  - error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    trigger: "amount_cents is not exactly the outstanding balance"
    message: "Payment must settle the outstanding balance exactly."
  - error_id: ERR_INSUFFICIENT_FUND_BALANCE
    http_status: 422
    trigger: "the expenditure exceeds the category's expendable unexpended collections"
    message: "Expenditure exceeds the expendable fund balance."
  - error_id: ERR_REFUND_NOT_ELIGIBLE
    http_status: 422
    trigger: "an OPEN row is refunded although its application has no overpayment"
    message: "Ledger entry has no refundable amount."

# =============================================================================
# 1.7 RBAC Matrix (segregation_of_duties: role separation is necessary but not
#     sufficient - two rules additionally compare X-User-ID values)
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Owns the program's statutory constants and its facility standards, and drives the statutory clock: effective-date activation, the deadline sweep."
    exclusive_operations:
      - "POST /fee-programs"
      - "POST /facility-categories"
      - "POST /fee-studies/{id}/activate"
      - "POST /fee-programs/{id}/deadline-sweep"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: NexusAnalyst
    description: "Builds the technical study: growth projections, cost allocation, fee schedule lines, nexus certification, and the technical review of credit claims."
    exclusive_operations:
      - "POST /fee-studies"
      - "POST /nexus-components"
      - "PATCH /nexus-components/{id}"
      - "POST /nexus-components/{id}/allocate"
      - "POST /nexus-components/{id}/fee-schedule-items"
      - "POST /fee-studies/{id}/certify-nexus"
      - "POST /credit-claims/{id}/decide"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: CouncilClerk
    description: "Runs the statutory legislative process: notice publication, the protest record, closing the protest window and adoption."
    exclusive_operations:
      - "POST /fee-studies/{id}/publish-notice"
      - "POST /fee-studies/{id}/protest-filings"
      - "POST /protest-filings/{id}/withdraw"
      - "POST /fee-studies/{id}/close-protest-window"
      - "POST /fee-studies/{id}/adopt"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: PermitOfficer
    description: "Applies the adopted schedule at the counter: assessment, deferral decisions, collection and certificate issuance."
    exclusive_operations:
      - "POST /development-applications/{id}/assess"
      - "POST /deferral-agreements/{id}/decide"
      - "POST /development-applications/{id}/payments"
      - "POST /development-applications/{id}/issue-co"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: Developer
    description: "The fee payer: files applications, claims credits and requests deferrals, and may only act on its own applications."
    exclusive_operations:
      - "POST /development-applications"
      - "POST /development-applications/{id}/credit-claims"
      - "POST /development-applications/{id}/deferral-agreements"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
    ownership_rule: "X-User-ID must equal DevelopmentApplication.submitted_by_user_id on the two application sub-resource writes (ERR_NOT_APPLICATION_OWNER)."

  - name: FinanceOfficer
    description: "Custodian of the fee funds: expenditures, statutory refunds and the annual report."
    exclusive_operations:
      - "POST /facility-categories/{id}/expenditures"
      - "POST /fund-ledger-entries/{id}/refund"
      - "POST /fee-programs/{id}/annual-report/file"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

segregation_of_duties_rules:
  - rule: "FeeStudy.certified_by_user_id != X-User-ID on POST /fee-studies/{id}/adopt"
    error_id: ERR_SEGREGATION_OF_DUTIES
    note: "NexusAnalyst and CouncilClerk are distinct roles, so this bites only when one human holds both roles; the check is on the user id, not the role."
  - rule: "no EXPENDITURE FundLedgerEntry created inside the reported fiscal year has authorized_by_user_id == X-User-ID on POST /fee-programs/{id}/annual-report/file"
    error_id: ERR_REPORT_PREPARER_CONFLICT
    note: "Both operations belong to FinanceOfficer, so the role matrix alone cannot enforce this; the same finance officer may spend or report, never both for the same year."
