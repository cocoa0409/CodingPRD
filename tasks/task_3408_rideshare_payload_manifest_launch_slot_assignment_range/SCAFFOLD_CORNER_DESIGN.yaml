              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl1: "$.data[0].id" }
            - *k_getm1
          trigger:
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
          assert:
            - "the create returns 201 (closed-bound coverage: equality on both ends is compatible)"
            - "ManifestAssignment.${a1}.status == PROVISIONAL"

      - name: duplicate_port_code_and_stack_position_rejected
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=10]
          - errors.ERR_DUPLICATE_PORT_CODE
        distinguishing_aspect: "port_code and stack_position are each unique per mission: reusing DSP-A's code, or reusing stack_position 4 under a fresh code, are both 422 ERR_DUPLICATE_PORT_CODE and neither persists a row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Mission with port DSP-A at stack_position 4."
          setup_api_calls:
            - *k_clock
            - *k_mission
            - *k_port_a
          trigger:
            - call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-A", stack_position: 9, max_mass_kg: 100, supported_interface_classes: ["CUBESAT"] }
              as: MissionOps
              captures: { e1: $.data.error_id }
            - call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-Z", stack_position: 4, max_mass_kg: 100, supported_interface_classes: ["CUBESAT"] }
              as: MissionOps
              captures: { e2: $.data.error_id }
          assert:
            - "e1 == ERR_DUPLICATE_PORT_CODE (422; code reuse)"
            - "e2 == ERR_DUPLICATE_PORT_CODE (422; stack_position reuse)"
            - "GET /rideshare/missions/${m_id}/dispenser-ports returns exactly 1 row"

      - name: volume_overflow_rejected_after_mass_passes
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=11]
          - errors.ERR_VOLUME_CAPACITY_EXCEEDED
        distinguishing_aspect: "Fiscal checks run mass before volume: a payload that fits the mass budget (150 <= 300) but overflows volume (3.5 + 1.0 > 4.0) fails with ERR_VOLUME_CAPACITY_EXCEEDED, proving mass passed first."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Mission (300 kg / 4.0 m3) with DSP-A and DSP-B; contract signed with PLV1 100 kg / 3.5 m3 RING_15 (assigned) and PLV2 50 kg / 1.0 m3 CUBESAT."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-V9", target_orbit: "SSO", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-20T00:00:00Z", mass_capacity_kg: 300, volume_capacity_m3: 4.0 }
              as: MissionOps
              captures: { m_id: $.data.id }
            - *k_port_a
            - call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-B", stack_position: 3, max_mass_kg: 100, supported_interface_classes: ["CUBESAT"] }
              as: MissionOps
              captures: { p_b: $.data.id }
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "PLV1", mass_kg: 100, volume_m3: 3.5, interface_class: "RING_15", required_orbit: "SSO" }, { payload_name: "PLV2", mass_kg: 50, volume_m3: 1.0, interface_class: "CUBESAT", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl_v1: "$.data[0].id", pl_v2: "$.data[1].id" }
            - *k_getm1
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl_v1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v2: $.data.version }
          trigger:
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl_v2}", dispenser_port_id: "${p_b}", expected_mission_version: "${m_v2}" }
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_VOLUME_CAPACITY_EXCEEDED"
            - "error_id != ERR_MASS_CAPACITY_EXCEEDED (150 kg <= 300 kg passes the mass leg)"
            - "Mission.${m_id}.committed_volume_m3 == 3.5 (unchanged)"

  # ===========================================================================
  - section: entities
    instances:

      - name: contracts_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/rideshare/contracts
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three contracts on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns the remaining 1 row with has_more false — total_count counts the whole filtered set, not the page; the customer_id filter returns all 3."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer with three DRAFT contracts."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "K1", mass_kg: 10, volume_m3: 0.5, interface_class: "RING_15", required_orbit: "SSO" }] }
              as: ContractManager
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "FLAT", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "K2", mass_kg: 20, volume_m3: 0.5, interface_class: "CUBESAT", required_orbit: "SSO" }] }
              as: ContractManager
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "K3", mass_kg: 30, volume_m3: 0.5, interface_class: "RING_24", required_orbit: "SSO" }] }
              as: ContractManager
          trigger:
            - call: "GET /rideshare/contracts"
              payload: { limit: 2, offset: 0 }
              as: ContractManager
            - call: "GET /rideshare/contracts"
              payload: { limit: 2, offset: 2 }
              as: ContractManager
            - call: "GET /rideshare/contracts"
              payload: { customer_id: "${c_id}" }
              as: ContractManager
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "page 2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "the customer_id filter returns exactly 3 rows"
            - "GET /rideshare/contracts with no parameters returns 3 rows under the defaults limit=10, offset=0"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: error_response_carries_envelope_error_shape
        claim_type: Standard CRUD
        grounds:
          - response_envelope
          - endpoints.GET_/rideshare/missions/{id}
          - errors.ERR_MISSION_NOT_FOUND
        distinguishing_aspect: "The fixed error envelope is honored exactly: response_type is error, data carries error_id and message, and meta carries api_request_id plus api_request_timestamp — demonstrated on a 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /rideshare/missions/00000000-0000-4000-8000-000000000020"
              payload: {}
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and response_type == error"
            - "error_id == ERR_MISSION_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "no data.id / entity fields leak into an error envelope"

  # ===========================================================================
  - section: errors
    instances:

      - name: request_missing_x_user_headers_returns_400
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_CONTEXT_HEADER
        distinguishing_aspect: "Priority 1 beats existence: the same path returns 400 ERR_MISSING_OR_INVALID_CONTEXT_HEADER when the X-User-ID/X-User-Role headers are absent, but 404 ERR_MISSION_NOT_FOUND when they are present — proving auth runs before resource lookup."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The first trigger call is dispatched with NEITHER X-User-ID NOR X-User-Role headers; the second carries them."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /rideshare/missions/00000000-0000-4000-8000-000000000020"
              payload: {}
              as: PlatformAdmin
              captures: { e_noheaders: $.data.error_id }
            - call: "GET /rideshare/missions/00000000-0000-4000-8000-000000000020"
              payload: {}
              as: MissionOps
              captures: { e_withheaders: $.data.error_id }
          assert:
            - "without context headers: 400 and e_noheaders == ERR_MISSING_OR_INVALID_CONTEXT_HEADER"
            - "with context headers: 404 and e_withheaders == ERR_MISSION_NOT_FOUND"

      - name: assign_after_manifest_lock_rejected
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_MANIFEST_LOCKED
          - state_machines.Mission.MANIFEST_OPEN_to_MANIFEST_LOCKED
        distinguishing_aspect: "Once the manifest is locked, the mission is no longer MANIFEST_OPEN and any further assignment create is 409 ERR_MANIFEST_LOCKED even though the payload, port, and capacity would all be valid."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two-payload contract (PL1 100 kg RING_15, PL2 50 kg CUBESAT) signed; A1 = PL1 on DSP-A confirmed; manifest locked. DSP-B still free."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-B", stack_position: 3, max_mass_kg: 100, supported_interface_classes: ["CUBESAT"] }
              as: MissionOps
              captures: { p_b: $.data.id }
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "PL1", mass_kg: 100, volume_m3: 2.0, interface_class: "RING_15", required_orbit: "SSO" }, { payload_name: "PL2", mass_kg: 50, volume_m3: 1.0, interface_class: "CUBESAT", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl1: "$.data[0].id", pl2: "$.data[1].id" }
            - *k_lic_c
            - *k_lic_c_grant
            - *k_getm1
            - *k_assign_a1
            - *k_ver_mech
            - *k_ver_elec
            - *k_safety_ok
            - *k_confirm_a1
            - *k_lock
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_vL: $.data.version }
          trigger:
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl2}", dispenser_port_id: "${p_b}", expected_mission_version: "${m_vL}" }
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the create returns 409 and error_id == ERR_MANIFEST_LOCKED"
            - "GET /rideshare/assignments?mission_id=${m_id} returns exactly 1 row"

      - name: assign_same_payload_twice_rejected
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_PAYLOAD_ALREADY_MANIFESTED
          - state_machines.Payload.REGISTERED_to_MANIFESTED
        distinguishing_aspect: "A payload leaves REGISTERED when first assigned; a second assignment for it fails 409 ERR_PAYLOAD_ALREADY_MANIFESTED at the state layer — before the interface constraint that DSP-B (CUBESAT-only) would also trip for a RING_15 payload."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A1 = PL1 (RING_15) on DSP-A exists (PROVISIONAL); DSP-B is CUBESAT-only."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-B", stack_position: 3, max_mass_kg: 100, supported_interface_classes: ["CUBESAT"] }
              as: MissionOps
              captures: { p_b: $.data.id }
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_getm1
            - *k_assign_a1
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v2: $.data.version }
          trigger:
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_b}", expected_mission_version: "${m_v2}" }
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PAYLOAD_ALREADY_MANIFESTED"
            - "error_id != ERR_INTERFACE_INCOMPATIBLE (state priority 7 precedes constraint priority 10)"
            - "GET /rideshare/assignments?mission_id=${m_id} returns exactly 1 row"

      - name: delay_to_non_later_window_rejected
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_DELAY_REGRESSION
          - calculations.delay_cascade_assessment
        distinguishing_aspect: "A delay whose new_window_open_utc equals the current window_open_utc (not strictly later) is 422 ERR_DELAY_REGRESSION and leaves the mission window untouched — the boundary is strict inequality."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Mission MANIFEST_LOCKED (A1 confirmed, manifest locked)."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_lic_c
            - *k_lic_c_grant
            - *k_getm1
            - *k_assign_a1
            - *k_ver_mech
            - *k_ver_elec
            - *k_safety_ok
            - *k_confirm_a1
            - *k_lock
          trigger:
            - call: "POST /rideshare/missions/${m_id}/delay"
              payload: { new_window_open_utc: "2026-10-10T00:00:00Z", new_window_close_utc: "2026-10-22T00:00:00Z", reason_code: "NOT_REALLY_LATER" }
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_DELAY_REGRESSION"
            - "Mission.${m_id}.window_open_utc remains 2026-10-10T00:00:00Z and window_close_utc remains 2026-10-20T00:00:00Z"
            - "GET /rideshare/missions/${m_id}/delay-events returns 0 rows"

      - name: rebook_of_manifested_contract_rejected
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_REBOOKING_NOT_ELIGIBLE
          - state_machines.LaunchContract
        distinguishing_aspect: "Rebook requires a SIGNED contract (no live assignments); a MANIFESTED contract with a live assignment is 409 ERR_REBOOKING_NOT_ELIGIBLE and neither target_mission_id nor rebookings_remaining changes."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A1 = PL1 on DSP-A (PROVISIONAL) so the contract is MANIFESTED. Target mission M2 [2026-10-16, 2026-10-26] MANIFEST_OPEN."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_getm1
            - *k_assign_a1
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-B2", target_orbit: "SSO", window_open_utc: "2026-10-16T00:00:00Z", window_close_utc: "2026-10-26T00:00:00Z", mass_capacity_kg: 100, volume_capacity_m3: 2.0 }
              as: MissionOps
              captures: { m2_id: $.data.id }
            - call: "GET /rideshare/contracts/${ct_id}"
