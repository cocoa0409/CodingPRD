        grounds:
          - state_machines.Carrier.status.ACTIVE_to_EXIT_NOTICED
          - state_machines.Policy.policy_status.IN_FORCE_to_REASSIGNMENT_PENDING
          - calculations.carrier_selection_for_assignment
          - calculations.carrier_quota_target_units
          - calculations.carrier_performance_and_posture
          - endpoints[POST /plan/carriers/{id}/exit-notice].side_effects
        distinguishing_aspect: |
          Depth-4 chain from one call, each link caused strictly by the previous one:
          (1) Atlas leaves the ACTIVE set, (2) its IN_FORCE policy is forced to
          REASSIGNMENT_PENDING, (3) the selector creates a REASSIGNMENT Assignment on the only
          remaining carrier licensed in T02 (Beacon) and increments Beacon's assigned_risk_count,
          (4) the shrunken apportionment denominator hands Beacon a quota_target_units of 0, so its
          variance turns positive and the posture ladder flips it to RESTRICTED with a perfect
          performance_score of 100. Triggered by a carrier-exit notice; the sibling instance is
          triggered by a complaint resolution.
