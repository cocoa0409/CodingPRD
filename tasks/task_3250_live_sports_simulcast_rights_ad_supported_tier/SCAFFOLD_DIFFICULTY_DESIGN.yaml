scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: amortization_straight_line_vs_event_weighted_same_property_data
    grounds:
    - calculations.amortization_expense
    - entities.RightsProperty.fields.amortization_method
    - entities.RightsProperty.fields.amortized_fee_cents
    distinguishing_aspect: 'Same rights fee and same completed-window history produce different

      amortized_fee_cents under the two variants: with rights_fee 120000

      cents over a 4-month term and exactly one SIMULCAST window (weight 1)

      that has COMPLETED, STRAIGHT_LINE amortizes floor(120000/4) per month

      times 2 elapsed months = 60000, while EVENT_WEIGHTED amortizes

      floor(120000 * done_weight 1 / total_weight 1) = 120000 — identical

      inputs, divergent results, pinned by the variant selector on the

      property.

      '
    test_recipe:
      setup:
      - Two properties P_straight (STRAIGHT_LINE) and P_weighted (EVENT_WEIGHTED), identical fee 120000, term 2026-09-01..2027-01-01
      - Each property has one SIMULCAST window and one EXCLUSIVE window, both COMPLETE for P_weighted's first window only the SIMULCAST completed
      - Logical clock at 2026-11-01 (2 of 4 months elapsed)
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-STR
          display_name: Straight
          sport: NFL
          rights_fee_cents: 120000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-01-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 5
          exclusive_windows_count: 5
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          p_str_id: $.data.id
          p_str_v: $.data.version
      - call: POST /platform/properties
        payload:
          property_code: P-WGT
          display_name: Weighted
          sport: NFL
          rights_fee_cents: 120000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-01-01T00:00:00Z'
          amortization_method: EVENT_WEIGHTED
          simulcast_windows_count: 5
          exclusive_windows_count: 5
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          p_wgt_id: $.data.id
          p_wgt_v: $.data.version
      - call: POST /platform/properties/${p_str_id}/activate
        payload: {}
        as: RightsManager
      - call: POST /platform/properties/${p_wgt_id}/activate
        payload: {}
        as: RightsManager
      - call: GET /platform/properties/${p_str_id}
        as: RightsManager
        captures:
          str_v2: $.data.version
      - call: POST /platform/windows
        payload:
          property_id: ${p_str_id}
          event_code: S1
          rights_mode: SIMULCAST
          scheduled_start: '2026-09-10T17:00:00Z'
          scheduled_end: '2026-09-10T20:00:00Z'
          territory_scope:
          - '510'
          regional_block: false
          capacity_required_units: 1
          replay_hours: 24
          expected_property_version: ${str_v2}
        as: RightsManager
        captures:
          w_str_sim: $.data.id
      - call: GET /platform/properties/${p_wgt_id}
        as: RightsManager
        captures:
          wgt_v2: $.data.version
      - call: POST /platform/windows
        payload:
          property_id: ${p_wgt_id}
          event_code: S1
          rights_mode: SIMULCAST
          scheduled_start: '2026-09-10T17:00:00Z'
          scheduled_end: '2026-09-10T20:00:00Z'
          territory_scope:
          - '510'
          regional_block: false
          capacity_required_units: 1
          replay_hours: 24
          expected_property_version: ${wgt_v2}
        as: RightsManager
        captures:
          w_wgt_sim: $.data.id
      - call: POST /platform/capacity-pools
        payload:
          pool_code: POOL-S
          scope_kind: REGION
          total_units: 100
          region_code: '510'
          oversubscribe_pct: 0
        as: StreamOps
        captures:
          pool_s_id: $.data.id
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_s_id}
          window_id: ${w_str_sim}
          units: 1
        as: StreamOps
        captures:
          res_str_id: $.data.id
      - call: POST /platform/capacity-reservations/${res_str_id}/confirm
        payload: {}
        as: StreamOps
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_s_id}
          window_id: ${w_wgt_sim}
          units: 1
        as: StreamOps
        captures:
          res_wgt_id: $.data.id
      - call: POST /platform/capacity-reservations/${res_wgt_id}/confirm
        payload: {}
        as: StreamOps
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-10T17:00:00Z'
        as: StreamOps
      - call: POST /platform/windows/${w_str_sim}/go-live
        payload: {}
        as: RightsManager
      - call: POST /platform/windows/${w_wgt_sim}/go-live
        payload: {}
        as: RightsManager
      - call: POST /platform/windows/${w_str_sim}/complete
        payload: {}
        as: RightsManager
      - call: POST /platform/windows/${w_wgt_sim}/complete
        payload: {}
        as: RightsManager
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-11-01T00:00:00Z'
        as: StreamOps
      trigger:
      - call: GET /platform/reports/property-economics
        payload:
          property_id: ${p_str_id}
        as: RightsManager
        captures:
          amort_str: $.data.amortized_fee_cents
      - call: GET /platform/reports/property-economics
        payload:
          property_id: ${p_wgt_id}
        as: RightsManager
        captures:
          amort_wgt: $.data.amortized_fee_cents
      assert:
      - 'amort_str == 60000  # STRAIGHT_LINE: floor(120000/4)=30000 per month x 2 elapsed months'
      - 'amort_wgt == 120000  # EVENT_WEIGHTED: only one window exists (weight 1), it is COMPLETE, so floor(120000 * 1/1) = 120000'
      - amort_str != amort_wgt
  - name: churn_provisional_vs_final_marquee_cohort
    grounds:
    - calculations.churn_model
    - entities.Viewer.fields.acquisition_window_id
    - state_machines.Viewer.ACTIVE_to_CANCELLED
    distinguishing_aspect: 'Entity domain is the Viewer cohort (not the property fiscal ledger):

      provisional churn uses BASELINE_CHURN_PCT + marquee uplift (12 + 5 =

      17), while final churn recomputed after one of two cohort viewers

      cancels is floor(100 * 1 / 2) = 50 — same cohort, different numbers.

      '
    test_recipe:
      setup:
      - Marquee EXCLUSIVE window completed; two viewers acquired via the window (acquisition_window_id set)
      - One cohort viewer cancels after completion
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-CHN
          display_name: ChurnProp
          sport: SOCCER
          rights_fee_cents: 60000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: EVENT_WEIGHTED
          simulcast_windows_count: 2
          exclusive_windows_count: 2
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          p_chn_id: $.data.id
          p_chn_v: $.data.version
      - call: POST /platform/properties/${p_chn_id}/activate
        payload: {}
        as: RightsManager
      - call: POST /platform/windows
        payload:
          property_id: ${p_chn_id}
          event_code: MARQ1
          rights_mode: EXCLUSIVE
          scheduled_start: '2026-09-05T18:00:00Z'
          scheduled_end: '2026-09-05T21:00:00Z'
          territory_scope:
          - '510'
          regional_block: false
          capacity_required_units: 1
          replay_hours: 48
          is_marquee: true
          expected_property_version: ${p_chn_v} + 1
        as: RightsManager
        captures:
          w_marq_id: $.data.id
      - call: POST /platform/capacity-pools
        payload:
          pool_code: POOL-C
          scope_kind: REGION
          total_units: 50
          region_code: '510'
          oversubscribe_pct: 0
        as: StreamOps
        captures:
          pool_c_id: $.data.id
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_c_id}
          window_id: ${w_marq_id}
          units: 1
        as: StreamOps
        captures:
          res_marq_id: $.data.id
      - call: POST /platform/capacity-reservations/${res_marq_id}/confirm
        payload: {}
        as: StreamOps
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T18:00:00Z'
        as: StreamOps
      - call: POST /platform/windows/${w_marq_id}/go-live
        payload: {}
        as: RightsManager
      - call: POST /platform/viewers
        payload:
          email: c1@x.com
          home_region: '510'
          subscription_tier: PREMIUM
        as: Viewer
        captures:
          v_c1: $.data.id
      - call: POST /platform/viewers
        payload:
          email: c2@x.com
          home_region: '510'
          subscription_tier: PREMIUM
        as: Viewer
        captures:
          v_c2: $.data.id
      - call: POST /platform/windows/${w_marq_id}/view-grants
        payload:
          viewer_id: ${v_c1}
          grant_type: LIVE
        as: Viewer
        as_user_id: ${v_c1}
      - call: POST /platform/windows/${w_marq_id}/view-grants
        payload:
          viewer_id: ${v_c2}
          grant_type: LIVE
        as: Viewer
        as_user_id: ${v_c2}
      - call: POST /platform/windows/${w_marq_id}/complete
        payload: {}
        as: RightsManager
      trigger:
      - call: POST /platform/viewers/${v_c1}/cancel
        payload: {}
        as: Viewer
        as_user_id: ${v_c1}
      - call: GET /platform/reports/property-economics
        payload:
          property_id: ${p_chn_id}
        as: RightsManager
      assert:
      - provisional_churn_pct computed at complete == 17 (BASELINE 12 + MARQUEE_UPLIFT 5)
      - final_churn_pct recomputed after cancel == 50 (floor(100*1/2))
      - 17 != 50
- rule_id: combinatorial_formula
  instances:
  - name: ad_revenue_single_final_rounding_local_marquee
    grounds:
    - calculations.ad_revenue_attribution
    - entities.Impression.fields.revenue_cents
    distinguishing_aspect: 'Mode (b) nested rounding: cpm 333 cents on a 15s LOCAL slot of a

      marquee EXCLUSIVE window yields raw = 333 * (15/30) * 1.5 * 2 / 1000

      = 0.4995; rounding per-factor first (floor/round the 15/30 factor to

      0.5 -> 333*0.5*1.5*2/1000 = 0.4995 -> 0) versus the pinned

      single-final-rounding (round_half_up(0.4995) = 0, but with cpm 1001:

      1001*0.5*1.5*2/1000 = 1.5015 -> 2, whereas round-half-up at the

      per-line 30s-normalization step first gives 1) — the scaffold pins

      single final rounding, so revenue_cents == 2 for cpm 1001.

      '
    test_recipe:
      setup:
      - Marquee EXCLUSIVE window LIVE; campaign cpm 1001 cents, frequency cap high; one 15s LOCAL slot FILLED with that campaign
      - AD_SUPPORTED viewer in the slot region
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-REV
          display_name: RevProp
          sport: GOLF
          rights_fee_cents: 1000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 2
          exclusive_windows_count: 2
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 1
        as: RightsManager
        captures:
          p_rev_id: $.data.id
          p_rev_v: $.data.version
      - call: POST /platform/properties/${p_rev_id}/activate
        payload: {}
        as: RightsManager
      - call: POST /platform/windows
        payload:
          property_id: ${p_rev_id}
          event_code: REV1
          rights_mode: EXCLUSIVE
          scheduled_start: '2026-09-06T18:00:00Z'
          scheduled_end: '2026-09-06T21:00:00Z'
          territory_scope:
          - '510'
          regional_block: false
          capacity_required_units: 1
          replay_hours: 24
          is_marquee: true
          expected_property_version: ${p_rev_v} + 1
        as: RightsManager
        captures:
          w_rev_id: $.data.id
          w_rev_v: $.data.version
      - call: POST /platform/capacity-pools
        payload:
          pool_code: POOL-R
          scope_kind: REGION
          total_units: 10
          region_code: '510'
          oversubscribe_pct: 0
        as: StreamOps
        captures:
          pool_r_id: $.data.id
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_r_id}
          window_id: ${w_rev_id}
          units: 1
        as: StreamOps
        captures:
          res_rev_id: $.data.id
      - call: POST /platform/capacity-reservations/${res_rev_id}/confirm
        payload: {}
        as: StreamOps
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-06T18:00:00Z'
        as: StreamOps
      - call: POST /platform/ad-campaigns
        payload:
          advertiser_code: ADV1
          flight_start: '2026-09-01T00:00:00Z'
          flight_end: '2026-12-01T00:00:00Z'
          frequency_cap_per_viewer: 10
          frequency_window_hours: 24
          cpm_cents: 1001
          region_target:
          - '510'
        as: AdOps
        captures:
          camp_rev_id: $.data.id
      - call: POST /platform/ad-campaigns/${camp_rev_id}/book
        payload: {}
        as: AdOps
      - call: POST /platform/ad-slots
        payload:
          window_id: ${w_rev_id}
          break_index: 1
          pod_index: 1
          duration_seconds: 15
          slot_scope: LOCAL
          region_code: '510'
        as: AdOps
        captures:
          slot_rev_id: $.data.id
      - call: POST /platform/ad-slots/${slot_rev_id}/fill
        payload:
          campaign_id: ${camp_rev_id}
          expected_window_version: ${w_rev_v}
        as: AdOps
      - call: POST /platform/windows/${w_rev_id}/go-live
        payload: {}
        as: RightsManager
      - call: POST /platform/viewers
        payload:
          email: rv@x.com
          home_region: '510'
        as: Viewer
        captures:
          v_rev_id: $.data.id
      trigger:
      - call: POST /platform/ad-slots/${slot_rev_id}/serve
        payload:
          viewer_id: ${v_rev_id}
        as: AdOps
        captures:
          imp_rev_cents: $.data.revenue_cents
      assert:
      - 'imp_rev_cents == 2  # round_half_up(1001 * 0.5 * 1.5 * 2 / 1000) = round_half_up(1.5015) = 2'
      - Impression.fill_source == LOCAL_INSERTION
  - name: capacity_oversubscribe_applies_at_confirm_not_hold
    grounds:
    - calculations.capacity_commit
    - entities.CapacityPool.fields.oversubscribe_pct
    - entities.CapacityReservation.fields.status
    distinguishing_aspect: 'Mode (c) evaluation-order circularity pinned: effective pool capacity

      depends on oversubscribe_pct applied at CONFIRM, while hold-time

      admission checks raw total_units — a pool with total_units 10 and

      oversubscribe 20% admits a hold of 10 units, then a second hold of 2

      units is admitted at hold time (raw check passes: 10-10=0? — pinned:

      hold admission uses total_units, so the 2-unit hold is REJECTED at

      hold time) yet confirming the 10-unit reservation succeeds and a

      subsequent 2-unit hold+confirm succeeds because confirm expands the

      effective ceiling to floor(10*120/100)=12. The order of

      confirm-then-hold vs hold-then-confirm is the pinned evaluation

      order and yields different acceptance.

      '
    test_recipe:
      setup:
      - Pool total_units 10, oversubscribe_pct 20 (effective 12)
      - Reservation R1 of 10 units CONFIRMED; then R2 of 2 units held and confirmed
      setup_api_calls:
      - call: POST /platform/properties
        payload:
          property_code: P-CAP
          display_name: CapProp
          sport: NBA
          rights_fee_cents: 1000
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          amortization_method: STRAIGHT_LINE
          simulcast_windows_count: 2
          exclusive_windows_count: 2
          minimum_exclusive_ratio_pct: 0
          required_local_breaks_per_event: 0
        as: RightsManager
        captures:
          p_cap_id: $.data.id
          p_cap_v: $.data.version
      - call: POST /platform/properties/${p_cap_id}/activate
        payload: {}
        as: RightsManager
      - call: POST /platform/windows
        payload:
          property_id: ${p_cap_id}
          event_code: CAP1
          rights_mode: SIMULCAST
          scheduled_start: '2026-09-07T18:00:00Z'
          scheduled_end: '2026-09-07T21:00:00Z'
          territory_scope:
          - '510'
          regional_block: false
          capacity_required_units: 12
          replay_hours: 0
          expected_property_version: ${p_cap_v} + 1
        as: RightsManager
        captures:
          w_cap_id: $.data.id
      - call: POST /platform/capacity-pools
        payload:
          pool_code: POOL-OV
          scope_kind: REGION
          total_units: 10
          region_code: '510'
          oversubscribe_pct: 20
        as: StreamOps
        captures:
          pool_ov_id: $.data.id
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_ov_id}
          window_id: ${w_cap_id}
          units: 10
        as: StreamOps
        captures:
          res_ov1_id: $.data.id
      - call: POST /platform/capacity-reservations/${res_ov1_id}/confirm
        payload: {}
        as: StreamOps
      - call: POST /platform/capacity-reservations
        payload:
          pool_id: ${pool_ov_id}
          window_id: ${w_cap_id}
          units: 2
        as: StreamOps
        captures:
          res_ov2_id: $.data.id
      trigger:
      - call: POST /platform/capacity-reservations/${res_ov2_id}/confirm
        payload: {}
        as: StreamOps
      - call: GET /platform/capacity-pools/${pool_ov_id}
        payload: {}
        as: StreamOps
        captures:
          pool_committed: $.data.committed_units
      assert:
      - R2 confirm succeeds because effective_pool_units = floor(10*120/100) = 12 >= committed 10 + new 2
      - pool_committed == 12
      - A hold of 3 more units after R2 would still hold but its confirm must fail with ERR_CAPACITY_INSUFFICIENT (12 == 12 boundary passes at equality; 13 > 12 fails)
- rule_id: non_linear_state_machine
  instances:
  - name: ad_campaign_booked_paused_booked_cycle
    grounds:
    - state_machines.AdCampaign.BOOKED_to_PAUSED
    - state_machines.AdCampaign.PAUSED_to_BOOKED
    distinguishing_aspect: 'Cyclic machine on AdCampaign: BOOKED -> PAUSED -> BOOKED loop can be

      taken twice; the second resume re-validates flight_end against the

      logical clock, so a pause spanning past flight_end makes the second

      resume fail with ERR_INVALID_STATE while the first succeeded.

      '
    test_recipe:
      setup:
      - Campaign flight 2026-09-01..2026-09-10, BOOKED
      - Logical clock advanced past flight_end before second resume
      setup_api_calls:
      - call: POST /platform/ad-campaigns
        payload:
          advertiser_code: ADV-C
          flight_start: '2026-09-01T00:00:00Z'
          flight_end: '2026-09-10T00:00:00Z'
          frequency_cap_per_viewer: 3
          frequency_window_hours: 24
          cpm_cents: 500
          region_target: []
        as: AdOps
        captures:
          camp_cyc_id: $.data.id
      - call: POST /platform/ad-campaigns/${camp_cyc_id}/book
        payload: {}
        as: AdOps
      - call: POST /platform/ad-campaigns/${camp_cyc_id}/pause
        payload: {}
        as: AdOps
      - call: POST /platform/ad-campaigns/${camp_cyc_id}/resume
        payload: {}
        as: AdOps
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-11T00:00:00Z'
        as: StreamOps
      - call: POST /platform/ad-campaigns/${camp_cyc_id}/pause
        payload: {}
        as: AdOps
      trigger:
      - call: POST /platform/ad-campaigns/${camp_cyc_id}/resume
        payload: {}
        as: AdOps
        captures:
          resume_err: $.data.error_id
      assert:
      - 'resume_err == ERR_INVALID_STATE  # flight_end passed; the cycle is clock-gated'
      - campaign.campaign_status remains PAUSED
  - name: viewer_grace_active_suspended_cycle_with_entitlement_toggle
    grounds:
    - state_machines.Viewer.ACTIVE_to_GRACE
    - state_machines.Viewer.GRACE_to_ACTIVE
    - state_machines.Viewer.GRACE_to_SUSPENDED
    - state_machines.Viewer.SUSPENDED_to_ACTIVE
    distinguishing_aspect: 'Cyclic machine on Viewer (different entity than AdCampaign):

      ACTIVE -> GRACE -> ACTIVE -> GRACE -> (clock +72h) -> SUSPENDED ->

      ACTIVE; each GRACE->SUSPENDED auto-transition flips Entitlement.active

      false, and SUSPENDED->ACTIVE flips it back, so the loop is observable

      on a second entity (Entitlement) rather than being a pure relabel.

      '
    test_recipe:
      setup:
      - Viewer ACTIVE with an active Entitlement (via promo redemption)
      setup_api_calls:
      - call: POST /platform/partners
        payload:
          partner_code: PT-CYC
          display_name: CycPartner
          bundled_tier: PREMIUM
          max_promo_codes: 5
        as: PartnerManager
        captures:
          pt_cyc_id: $.data.id
      - call: POST /platform/partners/${pt_cyc_id}/promo-codes
        payload: {}
        as: PartnerManager
        captures:
          code_cyc: $.data.code
      - call: POST /platform/viewers
        payload:
          email: cyc@x.com
          home_region: '510'
        as: Viewer
        captures:
          v_cyc_id: $.data.id
      - call: POST /platform/promo-codes/redeem
        payload:
          code: ${code_cyc}
          viewer_id: ${v_cyc_id}
        as: Viewer
        as_user_id: ${v_cyc_id}
      - call: POST /platform/viewers/${v_cyc_id}/suspend-billing
        payload: {}
        as: PartnerManager
      - call: POST /platform/viewers/${v_cyc_id}/reactivate
        payload: {}
        as: PartnerManager
      - call: POST /platform/viewers/${v_cyc_id}/suspend-billing
        payload: {}
        as: PartnerManager
      - call: POST /platform/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T00:00:00Z'
        as: StreamOps
      - call: POST /platform/viewers/${v_cyc_id}/reactivate
        payload: {}
        as: PartnerManager
      trigger:
      - call: GET /platform/entitlements
        payload:
          viewer_id: ${v_cyc_id}
        as: PartnerManager
        captures:
          ent_active: $.data[0].active
      assert:
      - 'ent_active == true  # SUSPENDED->ACTIVE reactivation flipped the entitlement back on'
      - Viewer.subscription_status == ACTIVE after the full cycle
- rule_id: transitive_cascade
  instances:
  - name: property_suspend_cascades_window_slot_impression_depth3
    grounds:
    - state_machines.RightsProperty.ACTIVE_to_SUSPENDED
    - state_machines.StreamingWindow.SCHEDULED_to_CANCELLED
