      - "fire due system auto-transitions (no-show, stranding, auto-confirm)"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint, or entity-backed identity mismatch (VendorRep acting on another vendor's resource)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request body or missing required field"
  - id: ERR_VALIDATION
    http: 400
    condition: "Field-level validation failure (format, range, enum)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path id or FK) does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not permitted from the entity's current state"
  - id: ERR_SAFETY_GATE
    http: 422
    condition: "Safety gate violation: suspended member purchasing/complaining/buying ancillary services, or allocation to a CONSTRAINED club without regional_ops_approved"
  - id: ERR_DEPARTMENT_DISABLED
    http: 422
    condition: "Ancillary department sale rejected because the club's ancillary_flags disable that department"
  - id: ERR_CLUB_FROZEN
    http: 422
    condition: "Allocation to a FROZEN club rejected (posture gate)"
  - id: ERR_APPOINTMENT_CONFLICT
    http: 409
    condition: "Appointment window outside dock hours, misaligned to slot granularity, overlapping an existing window on the same depot/dock, or check-in outside the allowed window"
  - id: ERR_CUTOFF_PASSED
    http: 422
    condition: "Allocation create or run commit attempted after the run's cutoff_time on run_date"
  - id: ERR_CONSTRAINT_VIOLATION
    http: 422
    condition: "Uniqueness violation (code/number/sku/membership number) or pallet unit_qty inconsistent with item.pallet_qty_units"
  - id: ERR_SAME_DAY_ONLY
    http: 422
    condition: "Pallet.received_date differs from cross_dock_run.run_date (same-day cross-dock constraint)"
  - id: ERR_MEMBER_CAP_EXCEEDED
    http: 422
    condition: "Per-membership purchase cap would be exceeded for the current cap window"
  - id: ERR_CLUB_CAPACITY_EXCEEDED
    http: 422
    condition: "Allocation would push club.allocated_slot_count above club.floor_slot_capacity"
  - id: ERR_MARKDOWN_RULE_VIOLATION
    http: 422
    condition: "Markdown decision rule violated: missing markdown_pct, premature SELL_THROUGH at/after exit window below target, or treasure-hunt reorder attempt after MARKDOWN decision"
  - id: ERR_INACTIVE_REFERENCE
    http: 422
    condition: "Referenced vendor not ACTIVE for appointments/pallets, or item not ACTIVE for pallets/purchases"
  - id: ERR_REFERENTIAL_GUARD
    http: 409
    condition: "Delete/discontinue blocked by referential guard (open appointments on vendor, insufficient complaint score, missing markdown decision)"
  - id: ERR_STALE_RUN_VERSION
    http: 412
    condition: "expected_cross_dock_run_version does not match the run's current version"
  - id: ERR_STALE_ITEM_VERSION
    http: 412
    condition: "expected_item_version does not match the item's current version"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegionalOps
    description: "Regional operations administrator; owns regions, vendors, clubs; drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /wcd/regions"
      - "POST /wcd/vendors"
      - "POST /wcd/clubs"
