          trigger:
            - { call: "POST /api/events/${ev_id}/elections", payload: { account_id: "${a1}", option_code: "CASH", expected_event_version: "${ev_v}" }, as: AccountHolder, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_NOT_ACCEPTING_ELECTIONS (state, priority 6) — NOT ERR_ELECTION_DEADLINE_PASSED (temporal, priority 10), though both conditions hold"

      - name: claim_duplicate_beats_amount_cap
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_DUPLICATE_OPEN_CLAIM]
          - errors[ERR_CLAIM_AMOUNT_EXCEEDS_CAP]
        distinguishing_aspect: |
          Category pair business_constraint-vs-business_fiscal: a FILED claim
          already exists on the entitlement (constraint, priority 9) AND the new
          claim asks 300000 > 250000 cap (fiscal, priority 12); the constraint
          error ERR_DUPLICATE_OPEN_CLAIM must win.
        test_recipe:
          setup:
            - "ACME security; account A1 (5 sh, FROZEN at booking so entitlement MISSED); SPLIT 2:1 event BOOKED; one FILED claim already on the entitlement; clock 2026-06-01"
