      - name: corner_parallel_axes_of_the_cord_blood_unit
        claim_type: parallel
        excluded_because:
          difficulty_instance: unit_three_axes_evolve_independently
          rationale: "That §1.8 instance walks processing_status, availability_status and eligibility_status through nine observations and asserts each axis moves only when its own trigger fires, which is exactly the `parallel` shape claim; repeating it here would duplicate the same chain."

      - name: corner_alarm_cascade_down_the_tank_inventory
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: temperature_alarm_quarantine_cascade_depth4
          rationale: "The depth-4 tank -> unit -> listing -> reservation cascade with its non-terminal-children-only filter is already asserted link by link in §1.8; the cascade-down claim adds nothing beyond it."

      - name: corner_cross_entity_delinquency_effects
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: nightly_delinquency_abandonment_cascade_depth3
          rationale: "§1.8 already asserts the invoice -> account -> unit -> reservation cross-entity adjustment produced by a single nightly run, including each downstream entity's state and fields."

      - name: corner_account_balance_ledger_sync
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: account_balance_equals_unpaid_residual_across_delinquency_then_full_payment
          rationale: "The ancestor derived field (StorageAccount.balance_cents) is reconciled before and after every mutation in that §1.8 compensating-invariant instance, which is the ledger-sync claim in full."

      - name: corner_guarded_transition_on_a_foreign_entity_state
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: release_gated_on_holding_tank_status
          rationale: "That instance is precisely 'A -> B only if entity C is in state X' (a CONFIRMED reservation may release only while its holding tank is ONLINE), asserted in both the permitted and the refused direction."

