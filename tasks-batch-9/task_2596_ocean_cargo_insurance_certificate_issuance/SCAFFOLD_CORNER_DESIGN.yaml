            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /open-policies/${pol_id}/run-transit-sweep"
              payload: {}
              as: ComplianceOfficer
              captures: { sweep2_status: $.data.status }
            - call: "GET /certificates?open_policy_id=${pol_id}&status=TRANSIT_ENDED"
              payload: {}
              as: Underwriter
              captures: { ended_count: $.meta.total_count }
            - call: "GET /vessels/${vsl_id}"
              payload: {}
              as: Underwriter
              captures: { vessel_exposure: $.data.accumulated_insured_value }
          assert:
            - "${early_tt} == \"2026-09-19T00:00:00Z\" and ${late_tt} == \"2026-10-05T00:00:00Z\" — same storage allowance, different discharge dates"
            - "after the first sweep ${sweep1_status} == \"ACTIVE\": the policy is untouched because 2026-09-20 is before its 2027-01-01 expiry"
            - "${still_issued} == 1 and ${still_issued_first} == ${cert_late_id} — CERT-LATE is not swept"
            - "Certificate.${cert_early_id}.status == \"TRANSIT_ENDED\""
            - "${early_released} == 3 and ${early_reason} == \"TRANSIT_ENDED\" — a different release_reason from the DELIVERY_CONFIRMED and CERTIFICATE_CANCELLED paths"
            - "after the first sweep Vessel.${vsl_id}.accumulated_insured_value == 1155000.00 (2310000.00 less the released 1155000.00)"
            - "${sweep2_status} == \"EXPIRED\" and ${ended_count} == 2 — the second sweep ends CERT-LATE and expires the policy in one call"
            - "${vessel_exposure} == 0.00 and OpenPolicy.aggregate_insured_value_booked == 2310000.00 — the annual aggregate is never released by a sweep"

      - name: confirm_delivery_before_attachment_is_refused_then_accepted_after_it
        claim_type: conditional_action
        grounds:
          - endpoints.POST /certificates/{id}/confirm-delivery
          - state_machines.Certificate.status.ISSUED_to_TRANSIT_ENDED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Delivery can only be confirmed once cover has attached: with the clock
          at the default 2026-08-01 the certificate is ISSUED but its
          attachment_at is 2026-08-10, so the call is refused with 409
          ERR_INVALID_STATE; advancing the clock to 2026-08-15 makes the same call
          succeed and pull transit_termination_at back from 2026-10-05 to the
          delivery instant. An implementation that gates only on status accepts
          the first call.
