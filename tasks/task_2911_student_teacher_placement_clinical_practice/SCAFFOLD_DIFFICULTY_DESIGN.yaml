  - rule_id: compensating_invariant
    instances:
      - name: reroute_conserves_agreement_seats_and_supervisor_caseload
        grounds:
          - "concurrency_rules.reroute-supersede-stale-request"
          - "calculations.agreement_ledger"
          - "calculations.supervisor_caseload_points"
          - "endpoints.POST /epp/placement-requests/{request_id}/reroute"
          - "entities.PlacementRequest.reroute_count"
          - "entities.Placement.voided_reason"
        distinguishing_aspect: |
          Conserved quantity: OCCUPANCY UNITS - the agreement's reserved seat count, the supervisor's
          caseload points and the sum of the teachers' active_placement_count. A reroute destroys one
          PROPOSED placement and creates a replacement in the same breath, so every occupancy counter must
          read exactly the same value after the operation as before it, even though it is now charged to a
          different cooperating teacher. The compensation is structural, not monetary: nothing has been
          settled yet, so stipend_committed_cents stays 0 throughout. The sibling instance conserves the
          other kind of quantity - settled money - after a payout has already left the program.
        test_recipe:
          setup:
            - "Build the base fixture at clock 2026-08-01T00:00:00Z and add a second QUALIFIED teacher at grid (10,11)."
            - "Route a 14-week placement; the candidate's home at (2,4) is 14 miles from teacher 1 and 15 miles from teacher 2, so teacher 1 wins the ranking."
            - "Read the request to capture its current version, which the reroute must echo in expected_request_version."
            - "Record the pre-reroute occupancy: agreement seats_reserved 1, supervisor caseload_points 2, teacher 1 active_placement_count 1, teacher 2 active_placement_count 0."
