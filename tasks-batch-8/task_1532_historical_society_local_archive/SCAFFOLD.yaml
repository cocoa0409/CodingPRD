# =============================================================================
# PRD Benchmark Seed Tables — task_1532_historical_society_local_archive
# =============================================================================

scenario: |
  Historical Society & Local Archive Operations (county historical society): collection accession & deed of gift, cataloging/finding aid creation & digitization queue, researcher request & reading room appointment, reproduction/permission fee & citation requirement, conservation priority & environmental monitoring, deaccession policy & board approval, volunteer processing project management, oral history recording & release forms

domain_name: historical-society-archive
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit        # deeds of gift, SoD board approval, cooling-off, citation mandates
  secondary_archetype: temporal_windowing    # reading-room seats, recording-studio buffers, embargo/cooling-off clocks
  complexity_layers:
    - optimistic_concurrency                 # OCC on Accession.version (deed execute) and Item.version (assessment create)
    - cascading_side_effects                 # environmental breach -> zone posture -> item hold -> appointment reschedule; deaccession finalize fan-chain
    - scheduled_deferred_actions             # deaccession cooling-off sweep, embargo expiry, no-show window — all driven by the logical clock
    - rate_threshold_triggers                # breach streaks (3/6), no-show strikes (3 in 180d), volunteer hour cap, repro page quota
  entity_topology: flat                      # peer entities with FK references; only deed/assessment/reading creation nests under a parent
  state_machine_shape: cyclic                # dominant shape: accession amendment loop, finding-aid revision loop, item treatment loop, QC fail loop, oral-history review loop
  relationship_patterns:
    - one_to_many
    - self_referential                       # Collection.parent_collection_id hierarchy (cycles forbidden)
    - many_to_many                           # ResearchRequest.item_ids / ReproductionOrder.item_ids / DeaccessionProposal.item_ids reference many Items
    - cross_aggregate                        # appointments -> requests -> items -> accessions -> deeds chains
  role_model: segregation_of_duties          # deaccession proposer != approver; digitization claimer != QC reviewer
  consistency_model: immediate               # every mutation (incl. cascades) visible when the triggering request returns

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# common_fields: true => id (UUID, identity only — never a decision input),
#   created_at / updated_at (ISO 8601 UTC, 3 fractional digits), version (int, starts 1, +1 per mutation)
# =============================================================================
entities:
  - name: StorageZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique zone code (e.g. VAULT-A)", constraints: "unique across StorageZone; duplicate -> ERR_ZONE_CODE_EXISTS" }
      - { name: name, type: string, source: input, description: "Human-readable zone name" }
      - { name: temp_high_c, type: number, source: input, default: 24.0, description: "Breach when a reading's temperature_c is strictly greater than this" }
      - { name: temp_low_c, type: number, source: input, default: 14.0, description: "Breach when a reading's temperature_c is strictly less than this" }
      - { name: humidity_high_pct, type: number, source: input, default: 60.0, description: "Breach when a reading's humidity_pct is greater-than-or-equal to this" }
      - { name: humidity_low_pct, type: number, source: input, default: 30.0, description: "Breach when a reading's humidity_pct is less-than-or-equal to this" }
      - { name: posture, type: enum, source: system, description: "OPEN | RESTRICTED | CLOSED — derived by environmental_posture_evaluation; gates item availability and pulls", default: OPEN }
      - { name: breach_streak, type: integer, source: computed, description: "Length of the trailing run of breach readings in the replay-ordered reading history (0 when the latest ordered reading is in range)", default: 0 }
      - { name: recent_readings, type: array, source: computed, description: "Append-only embedded reading log; each element { reading_id, recorded_at, temperature_c, humidity_pct, is_breach, is_severe }; kept sorted by (recorded_at ASC, created_at ASC) — late-arriving readings are inserted in timestamp order and posture is re-derived by full replay", default: [] }

  - name: Collection
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Collection title" }
      - { name: collection_code, type: string, source: input, description: "Unique collection code", constraints: "unique; duplicate -> ERR_COLLECTION_CODE_EXISTS" }
      - { name: parent_collection_id, type: string, source: input, description: "FK -> Collection.id; optional parent for fonds/series hierarchy; must not create a cycle (self or descendant) -> ERR_COLLECTION_CYCLE", constraints: "nullable; acyclic" }
      - { name: storage_zone_id, type: string, source: input, description: "FK -> StorageZone.id; zone where this collection's physical items sit" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEACCESSIONED; auto-transitions to DEACCESSIONED when its last non-deaccessioned direct Item is deaccessioned (bubble-up)", default: ACTIVE }
      - { name: item_count, type: integer, source: computed, description: "Count of direct Items (item.collection_id == this.id) with status != DEACCESSIONED", default: 0 }
      - { name: published_finding_aid_present, type: boolean, source: computed, description: "True iff at least one FindingAid with collection_id == this.id has status == PUBLISHED", default: false }

  - name: Accession
    parent: null
    common_fields: true
    fields:
      - { name: donor_name, type: string, source: input, description: "Donor full/legal name" }
      - { name: donor_contact, type: string, source: input, description: "Donor contact email/phone" }
      - { name: accession_date, type: datetime, source: input, description: "Date materials physically received (ISO 8601 date)" }
      - { name: lot_appraised_value_cents, type: integer, source: input, description: "Appraised value of the whole accession lot in cents", constraints: ">= 0" }
      - { name: accession_number, type: string, source: computed, description: "Assigned at creation as '<year-of-created_at>-<NNN>' where NNN is the 1-based count of accessions created in that calendar year, zero-padded to 3" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PENDING_DEED -> ACCESSIONED -> AMENDMENT_PENDING -> ACCESSIONED (amendment cycle); DRAFT/PENDING_DEED -> WITHDRAWN", default: DRAFT }
      - { name: current_deed_id, type: string, source: computed, description: "id of the DeedOfGift with status == EXECUTED for this accession; null when none", default: null }

  - name: DeedOfGift
    parent: Accession
    common_fields: true
    fields:
      - { name: accession_id, type: string, source: system, description: "FK -> Accession.id; owning accession (path parameter of POST /accessions/{id}/deeds)" }
      - { name: deed_version, type: integer, source: computed, description: "1-based count of deeds created for this accession up to and including this one, assigned at creation" }
      - { name: reproduction_restricted, type: boolean, source: input, default: false, description: "When true on the EXECUTED deed, reproduction orders covering this accession's items are rejected (ERR_DEED_REPRODUCTION_RESTRICTED)" }
      - { name: publication_license_required, type: boolean, source: input, default: false, description: "When true on the EXECUTED deed, reproduction orders with license_class == PERSONAL covering these items are rejected (ERR_PUBLICATION_LICENSE_REQUIRED)" }
      - { name: embargo_until, type: datetime, source: input, description: "Optional ISO instant; while embargo_until > logical now, reproduction orders covering these items are rejected (ERR_EMBARGO_ACTIVE)", constraints: "nullable" }
      - { name: required_citation_text, type: string, source: input, description: "Exact citation string donors require; reproduction delivery acknowledgment must contain it verbatim (case-sensitive)", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT -> EXECUTED -> SUPERSEDED; DRAFT -> VOIDED", default: DRAFT }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: accession_id, type: string, source: input, description: "FK -> Accession.id; accession that brought this item in" }
      - { name: collection_id, type: string, source: input, description: "FK -> Collection.id; collection the item belongs to" }
      - { name: title, type: string, source: input, description: "Item title (set at creation)" }
      - { name: description, type: string, source: input, description: "Catalog description (set by /catalog)", constraints: "null until cataloged" }
      - { name: condition_grade, type: enum, source: input, description: "EXCELLENT | GOOD | FAIR | POOR | FRAGILE (set by /catalog; updated by complete-treatment)", constraints: "null until cataloged" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Item-level appraised value in cents (set by /catalog)", constraints: ">= 0; null until cataloged" }
      - { name: format, type: enum, source: input, description: "MANUSCRIPT | PHOTOGRAPH | MAP | ARTIFACT | AUDIOVISUAL | BOUND_VOLUME (set by /catalog)", constraints: "null until cataloged" }
      - { name: status, type: enum, source: system, description: "PENDING_CATALOG -> CATALOGED -> AVAILABLE <-> FLAGGED_CONSERVATION -> IN_TREATMENT -> AVAILABLE; AVAILABLE <-> ZONE_HOLD (auto via zone posture); non-terminal except IN_TREATMENT -> DEACCESSIONED", default: PENDING_CATALOG }
      - { name: conservation_priority_score, type: number, source: computed, description: "Confirmed priority score from the current ConservationAssessment; null when no APPROVED/IN_TREATMENT assessment exists", default: null }
      - { name: current_assessment_id, type: string, source: computed, description: "id of the latest non-SUPERSEDED ConservationAssessment for this item; null when none", default: null }

  - name: ConservationAssessment
    parent: Item
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; assessed item (path parameter)" }
      - { name: condition_grade_observed, type: enum, source: input, description: "EXCELLENT | GOOD | FAIR | POOR | FRAGILE — assessor's observed grade" }
      - { name: urgency_score, type: integer, source: input, description: "Assessor urgency 0-100 inclusive", constraints: "0 <= x <= 100; else ERR_INVALID_REQUEST" }
      - { name: treatment_estimate_hours, type: integer, source: input, description: "Estimated bench hours", constraints: "> 0" }
      - { name: open_request_count_snapshot, type: integer, source: computed, description: "Count of ResearchRequests referencing the item with status IN {SUBMITTED, IN_REVIEW, APPROVED}, snapshotted at creation and never recomputed" }
      - { name: preliminary_priority_score, type: number, source: computed, description: "Score computed at creation per conservation_priority_score (preliminary variant)" }
      - { name: confirmed_priority_score, type: number, source: computed, description: "Score recomputed at /approve per conservation_priority_score (confirmed variant, FRAGILE urgency multiplier); null until approved", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT -> APPROVED -> IN_TREATMENT -> COMPLETED; DRAFT/APPROVED -> SUPERSEDED when a newer assessment is created for the same item", default: DRAFT }

  - name: FindingAid
    parent: null
    common_fields: true
    fields:
      - { name: collection_id, type: string, source: input, description: "FK -> Collection.id; collection this finding aid describes" }
      - { name: title, type: string, source: input, description: "Finding aid title" }
      - { name: summary, type: string, source: input, description: "Abstract/summary" }
      - { name: scope_note, type: string, source: input, description: "Scope and content note", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "DRAFT -> IN_REVIEW -> PUBLISHED -> IN_REVISION -> IN_REVIEW (revision cycle); IN_REVIEW returns to review_origin; PUBLISHED -> RETIRED on collection deaccession", default: DRAFT }
      - { name: review_origin, type: enum, source: system, description: "DRAFT | IN_REVISION — stamped by submit-review with the state the aid came from; /return routes back to this state", default: null }
      - { name: published_revision_count, type: integer, source: computed, description: "Number of times this aid has reached PUBLISHED", default: 0 }
      - { name: published_at, type: datetime, source: system, description: "Logical timestamp of the most recent publish; null until first publish", default: null }

  - name: VolunteerProject
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: description, type: string, source: input, description: "Project description", constraints: "optional" }
      - { name: max_hours_per_volunteer, type: integer, source: input, default: 40, description: "Lifetime per-volunteer hour cap for this project; a log-hours call that would push a volunteer strictly above the cap is rejected (== cap allowed)" }
      - { name: status, type: enum, source: system, description: "PLANNED -> ACTIVE -> CLOSED", default: PLANNED }
      - { name: hours_logged_total, type: number, source: computed, description: "Sum of hours across all log-hours calls on this project's tickets", default: 0 }
      - { name: volunteer_hours, type: object, source: computed, description: "Map of volunteer X-User-ID -> cumulative hours logged on this project's tickets", default: {} }
      - { name: active_ticket_count, type: integer, source: computed, description: "Count of this project's DigitizationTickets with status IN {CLAIMED, IN_CAPTURE, QC_REVIEW}", default: 0 }

  - name: DigitizationTicket
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> VolunteerProject.id; owning project (path parameter of POST /volunteer-projects/{id}/tickets)" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; item to digitize" }
      - { name: priority_score, type: number, source: computed, description: "Snapshot at creation per digitization_priority_score; never recomputed", default: null }
      - { name: status, type: enum, source: system, description: "QUEUED -> CLAIMED -> IN_CAPTURE -> QC_REVIEW -> COMPLETE; QC_REVIEW -> IN_CAPTURE (fail loop); CLAIMED/IN_CAPTURE -> QUEUED (release); any non-terminal -> CANCELLED", default: QUEUED }
      - { name: claimed_by_user_id, type: string, source: system, description: "X-User-ID of the Volunteer who claimed the ticket; null while QUEUED", default: null }
      - { name: qc_fail_count, type: integer, source: system, description: "Number of QC failures on this ticket", default: 0 }
      - { name: hours_logged, type: number, source: computed, description: "Sum of log-hours on this ticket", default: 0 }

  - name: Researcher
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Researcher full name" }
      - { name: email, type: string, source: input, description: "Unique email", constraints: "unique; duplicate -> ERR_DUPLICATE_EMAIL" }
      - { name: affiliation, type: string, source: input, description: "Institutional affiliation", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; auto-suspends when a recorded no-show brings the rolling 180-day strike count to >= 3; reinstated manually", default: ACTIVE }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of this researcher's appointments with status == NO_SHOW and scheduled_date >= (current logical date - 180 days) inclusive", default: 0 }
      - { name: total_charged_cents, type: integer, source: computed, description: "Sum of invoiced_fee_cents over this researcher's ReproductionOrders with status IN {PAID, DELIVERED} minus refunds (status REFUNDED contributes 0)", default: 0 }

  - name: ResearchRequest
    parent: null
    common_fields: true
    fields:
      - { name: researcher_id, type: string, source: system, description: "FK -> Researcher.id; stamped from X-User-ID of the Researcher role at creation" }
      - { name: item_ids, type: array, source: input, description: "FK -> Item.id (array elements); items requested, 1..10 entries (11 -> ERR_TOO_MANY_ITEMS), duplicates -> ERR_INVALID_REQUEST" }
      - { name: topic, type: string, source: input, description: "Research topic" }
      - { name: purpose, type: enum, source: input, description: "PERSONAL | ACADEMIC | COMMERCIAL | PUBLICATION; drives reproduction academic discount eligibility" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> IN_REVIEW -> APPROVED; IN_REVIEW -> DENIED; SUBMITTED/IN_REVIEW -> CANCELLED", default: SUBMITTED }
      - { name: decision_reason, type: string, source: input, description: "Reason recorded at deny time", constraints: "optional" }

  - name: ReadingRoomAppointment
    parent: null
    common_fields: true
    fields:
      - { name: researcher_id, type: string, source: system, description: "FK -> Researcher.id; stamped from X-User-ID at creation" }
      - { name: research_request_id, type: string, source: input, description: "FK -> ResearchRequest.id; the APPROVED request this appointment serves" }
      - { name: room_code, type: enum, source: input, description: "MAIN (capacity 8 seats) | MAP_ROOM (capacity 4 seats)" }
      - { name: scheduled_date, type: string, source: input, description: "YYYY-MM-DD appointment date (interpreted UTC)" }
      - { name: start_time, type: string, source: input, description: "HH:MM 24h start; must be < end_time else ERR_INVALID_REQUEST" }
      - { name: end_time, type: string, source: input, description: "HH:MM 24h end (exclusive bound — half-open interval [start_time, end_time))" }
      - { name: seats, type: integer, source: input, default: 1, description: "Seats consumed; >= 1 else ERR_INVALID_REQUEST" }
      - { name: status, type: enum, source: system, description: "CONFIRMED -> CHECKED_IN -> COMPLETED; CONFIRMED -> NO_SHOW; CONFIRMED -> NEEDS_RESCHEDULE -> CONFIRMED (reschedule); CONFIRMED/NEEDS_RESCHEDULE -> CANCELLED", default: CONFIRMED }

  - name: ReproductionOrder
    parent: null
    common_fields: true
    fields:
      - { name: researcher_id, type: string, source: system, description: "FK -> Researcher.id; stamped from X-User-ID at creation" }
      - { name: research_request_id, type: string, source: input, description: "FK -> ResearchRequest.id; must be APPROVED and owned by the caller" }
      - { name: item_ids, type: array, source: input, description: "FK -> Item.id (array elements); every entry must be a member of the request's item_ids else ERR_ITEM_NOT_IN_REQUEST" }
      - { name: format, type: enum, source: input, description: "SCAN_STANDARD (x1.0) | SCAN_HIGHRES (x1.8) | PRINT_PHOTOGRAPH (x2.5)" }
      - { name: page_estimate, type: integer, source: input, description: "Estimated pages, basis of the quoted (provisional) fee", constraints: "> 0" }
      - { name: actual_pages, type: integer, source: input, description: "Actual pages, supplied by staff at /invoice, basis of the invoiced (final) fee", constraints: "> 0; null until invoiced" }
      - { name: license_class, type: enum, source: input, default: PERSONAL, description: "PERSONAL (+0c) | NONPROFIT_PUBLICATION (+1500c) | COMMERCIAL_PUBLICATION (+7500c)" }
      - { name: rush, type: boolean, source: input, default: false, description: "Rush handling multiplies the image component by 1.5" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Provisional fee computed at creation from page_estimate per reproduction_fee" }
      - { name: invoiced_fee_cents, type: integer, source: computed, description: "Final fee computed at /invoice from actual_pages per reproduction_fee; null until invoiced", default: null }
      - { name: status, type: enum, source: system, description: "QUOTED -> APPROVED -> INVOICED -> PAID -> DELIVERED; PAID -> REFUNDED", default: QUOTED }

  - name: DeaccessionProposal
    parent: null
    common_fields: true
    fields:
      - { name: item_ids, type: array, source: input, description: "FK -> Item.id (array elements); items proposed for deaccession, 1..N entries, duplicates -> ERR_INVALID_REQUEST" }
      - { name: justification, type: string, source: input, description: "Policy justification text" }
      - { name: disposal_method, type: enum, source: input, description: "SALE | TRANSFER | DESTRUCTION | RETURN_TO_DONOR; SALE requires hammer_prices at finalize" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID stamped at creation; the approver must differ (segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID stamped at approval", default: null }
      - { name: approved_at, type: datetime, source: system, description: "Logical timestamp of approval", default: null }
      - { name: finalize_not_before, type: datetime, source: computed, description: "approved_at + 30 days cooling-off; finalize allowed only when logical now >= this instant", default: null }
      - { name: hammer_prices, type: array, source: input, description: "At finalize for SALE: array of { item_id, price_cents } covering every proposed item exactly once else ERR_HAMMER_PRICE_MISSING", constraints: "required iff disposal_method == SALE" }
      - { name: proceeds_cents, type: integer, source: computed, description: "For SALE at finalize: sum over items of round_half_up(price_cents * 0.90) — per-item rounding THEN sum (pinned order); null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> BOARD_REVIEW -> APPROVED -> COOLED_OFF -> FINALIZED; BOARD_REVIEW -> REJECTED; DRAFT/SUBMITTED -> WITHDRAWN", default: DRAFT }

  - name: OralHistoryRecording
    parent: null
    common_fields: true
    fields:
      - { name: collection_id, type: string, source: input, description: "FK -> Collection.id; collection the interview accrues to" }
      - { name: narrator_name, type: string, source: input, description: "Interviewee name; release signature must match exactly" }
      - { name: interviewer_name, type: string, source: input, description: "Interviewer name" }
      - { name: recording_room_id, type: enum, source: input, description: "STUDIO_A | STUDIO_B — single-resource pool per room with a 30-minute turnaround buffer" }
      - { name: session_start, type: datetime, source: input, description: "Session start (closed interval lower bound); must be < session_end else ERR_INVALID_REQUEST" }
      - { name: session_end, type: datetime, source: input, description: "Session end (closed interval upper bound)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> RECORDED -> TRANSCRIBED -> IN_REVIEW -> RELEASED; IN_REVIEW -> TRANSCRIBED (review loop); SCHEDULED/RECORDED/TRANSCRIBED/IN_REVIEW -> CANCELLED", default: SCHEDULED }
      - { name: release_status, type: enum, source: system, description: "PENDING -> SIGNED | DECLINED — independent parallel dimension to status; publish-release requires SIGNED", default: PENDING }
      - { name: release_signed_at, type: datetime, source: system, description: "Logical timestamp the release form was signed", default: null }
      - { name: embargo_until, type: datetime, source: input, description: "Optional embargo recorded on the signed release; publish-release blocked while embargo_until > logical now", constraints: "nullable" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: StorageZone
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system — POST /storage-zones/{id}/readings replay yields trailing breach run >= 3 (and no severe latest reading)"
        actor: system
        preconditions: []
        side_effects:
          - "Every Item whose collection's storage_zone_id == this zone and whose status == AVAILABLE becomes ZONE_HOLD (link 1)"
          - "Every ReadingRoomAppointment with status == CONFIRMED, scheduled_date >= current logical date, whose research_request_id resolves to a ResearchRequest whose item_ids contain a just-held item becomes NEEDS_RESCHEDULE (link 2)"
      - from: RESTRICTED
        to: CLOSED
        trigger: "system — replay yields trailing breach run >= 6"
        actor: system
        preconditions: []
        side_effects: ["Items already ZONE_HOLD remain ZONE_HOLD (no further item transitions)"]
      - from: OPEN
        to: CLOSED
        trigger: "system — latest replay-ordered reading is severe (temperature_c >= temp_high_c + 4.0 OR humidity_pct >= humidity_high_pct + 15.0)"
        actor: system
        preconditions: []
        side_effects:
          - "Same item/appointment cascade as OPEN -> RESTRICTED (AVAILABLE items -> ZONE_HOLD; affected future CONFIRMED appointments -> NEEDS_RESCHEDULE)"
      - from: RESTRICTED
        to: OPEN
        trigger: "system — replay yields trailing in-range run >= 3"
        actor: system
        preconditions: []
        side_effects:
          - "Items in this zone with status == ZONE_HOLD become AVAILABLE"
          - "Appointments in NEEDS_RESCHEDULE are NOT auto-restored (explicitly pinned asymmetry — they need POST /reading-room-appointments/{id}/reschedule or /cancel)"
      - from: CLOSED
        to: RESTRICTED
        trigger: "system — replay yields trailing in-range run >= 3 (CLOSED recovers one level at a time; never directly to OPEN)"
        actor: system
        preconditions: []
        side_effects: ["Items remain ZONE_HOLD until a later evaluation reaches OPEN"]
    note: "Posture is recomputed by deterministic replay over recent_readings ordered (recorded_at ASC, created_at ASC) after every reading insert, so a late-arriving reading rewrites history; replay algorithm pinned in calculations.environmental_posture_evaluation."

  - entity: Collection
    initial_state: ACTIVE
    terminal_states: [DEACCESSIONED]
    transitions:
      - from: ACTIVE
        to: DEACCESSIONED
        trigger: "system — bubble-up during deaccession finalize: after item transitions, a collection whose item_count reaches 0 deaccessions"
        actor: system
        preconditions: []
        side_effects:
          - "Every FindingAid with collection_id == this.id and status == PUBLISHED becomes RETIRED"

  - entity: Accession
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_DEED
        trigger: "POST /accessions/{id}/submit"
        actor: Registrar
        preconditions: ["accession.status == DRAFT else ERR_INVALID_STATE"]
        side_effects: ["increments Accession.version by 1"]
      - from: PENDING_DEED
        to: ACCESSIONED
        trigger: "system — a DeedOfGift for this accession reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects: ["current_deed_id := the newly EXECUTED deed's id"]
      - from: ACCESSIONED
        to: AMENDMENT_PENDING
        trigger: "POST /accessions/{id}/amend"
        actor: Registrar
        preconditions: ["accession.status == ACCESSIONED else ERR_INVALID_STATE"]
        side_effects: ["increments Accession.version by 1"]
      - from: AMENDMENT_PENDING
        to: ACCESSIONED
        trigger: "system — a new DeedOfGift for this accession reaches EXECUTED (amendment cycle closes)"
        actor: system
        preconditions: []
        side_effects: ["current_deed_id := the newly EXECUTED deed's id"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /accessions/{id}/withdraw"
        actor: Registrar
        preconditions: ["accession.status IN {DRAFT, PENDING_DEED} else ERR_INVALID_STATE"]
        side_effects: ["Any DRAFT DeedOfGift for this accession becomes VOIDED"]
      - from: PENDING_DEED
        to: WITHDRAWN
        trigger: "POST /accessions/{id}/withdraw"
        actor: Registrar
        preconditions: ["accession.status IN {DRAFT, PENDING_DEED} else ERR_INVALID_STATE"]
        side_effects: ["Any DRAFT DeedOfGift for this accession becomes VOIDED"]

  - entity: DeedOfGift
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /deeds/{id}/execute"
        actor: Registrar
        preconditions:
          - "deed.status == DRAFT else ERR_INVALID_STATE"
          - "accession.status IN {PENDING_DEED, AMENDMENT_PENDING, ACCESSIONED} else ERR_ACCESSION_NOT_ACCESSIONED (executing over an already-ACCESSIONED accession legitimately supersedes its current deed — supersession is permitted product semantics, so a stale client view is rejected only by the OCC check at priority 6)"
          - "request body expected_accession_version == accession.version else ERR_STALE_VERSION (OCC)"
        side_effects:
          - "increments Accession.version by 1"
          - "The previously EXECUTED DeedOfGift for this accession (if any) becomes SUPERSEDED"
          - "accession.status: PENDING_DEED -> ACCESSIONED, AMENDMENT_PENDING -> ACCESSIONED; accession.current_deed_id updated"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /deeds/{id}/void"
        actor: Registrar
        preconditions: ["deed.status == DRAFT else ERR_INVALID_STATE"]
        side_effects: []
      - from: EXECUTED
        to: SUPERSEDED
        trigger: "system — a newer deed for the same accession reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Item
    initial_state: PENDING_CATALOG
    terminal_states: [DEACCESSIONED]
    transitions:
      - from: PENDING_CATALOG
        to: CATALOGED
        trigger: "POST /items/{id}/catalog"
        actor: Archivist
        preconditions: ["item.status == PENDING_CATALOG else ERR_INVALID_STATE"]
        side_effects:
          - "sets description, condition_grade, appraised_value_cents, format from the request body"
          - "collection.item_count unchanged (item already counted)"
      - from: CATALOGED
        to: AVAILABLE
        trigger: "POST /items/{id}/make-available"
        actor: Archivist
        preconditions:
          - "item.status == CATALOGED else ERR_INVALID_STATE"
          - "item.collection_id -> Collection.published_finding_aid_present == true else ERR_FINDING_AID_NOT_PUBLISHED"
          - "item.accession_id -> Accession.status == ACCESSIONED else ERR_ACCESSION_NOT_ACCESSIONED"
          - "item.collection_id -> Collection.storage_zone_id -> StorageZone.posture == OPEN else ERR_ZONE_RESTRICTED"
        side_effects: []
      - from: AVAILABLE
        to: FLAGGED_CONSERVATION
        trigger: "POST /items/{id}/flag-conservation"
        actor: Archivist
        preconditions: ["item.status == AVAILABLE else ERR_INVALID_STATE"]
        side_effects: []
      - from: FLAGGED_CONSERVATION
        to: IN_TREATMENT
        trigger: "POST /conservation-assessments/{id}/begin-treatment"
        actor: Archivist
        preconditions:
          - "assessment.status == APPROVED else ERR_INVALID_STATE"
          - "assessment.item_id -> Item.status == FLAGGED_CONSERVATION else ERR_INVALID_STATE"
        side_effects: ["assessment.status -> IN_TREATMENT"]
      - from: IN_TREATMENT
        to: AVAILABLE
        trigger: "POST /conservation-assessments/{id}/complete-treatment"
        actor: Archivist
        preconditions:
          - "assessment.status == IN_TREATMENT else ERR_INVALID_STATE"
          - "assessment.item_id -> Item.status == IN_TREATMENT else ERR_INVALID_STATE"
        side_effects:
          - "item.condition_grade := request body new_condition_grade"
          - "assessment.status -> COMPLETED; item.current_assessment_id := null; item.conservation_priority_score := null"
      - from: AVAILABLE
        to: ZONE_HOLD
        trigger: "system — the item's collection's StorageZone posture enters RESTRICTED or CLOSED"
        actor: system
        preconditions: []
        side_effects: ["Confirms appointments referencing this item move to NEEDS_RESCHEDULE (see StorageZone cascade)"]
      - from: ZONE_HOLD
        to: AVAILABLE
        trigger: "system — the zone posture returns to OPEN"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: DEACCESSIONED
        trigger: "system — a DeaccessionProposal covering this item is FINALIZED"
        actor: system
        preconditions: []
        side_effects: ["collection.item_count -= 1; if 0 -> collection bubble-up to DEACCESSIONED and its PUBLISHED finding aids RETIRE"]
      - from: CATALOGED
        to: DEACCESSIONED
        trigger: "system — deaccession finalize"
        actor: system
        preconditions: []
        side_effects: ["same collection bubble-up as above"]
      - from: FLAGGED_CONSERVATION
        to: DEACCESSIONED
        trigger: "system — deaccession finalize"
        actor: system
        preconditions: []
        side_effects: ["same collection bubble-up as above"]
      - from: ZONE_HOLD
        to: DEACCESSIONED
        trigger: "system — deaccession finalize"
        actor: system
        preconditions: []
        side_effects: ["same collection bubble-up as above"]
      - from: PENDING_CATALOG
        to: DEACCESSIONED
        trigger: "system — deaccession finalize"
        actor: system
        preconditions: []
        side_effects: ["same collection bubble-up as above"]

  - entity: ConservationAssessment
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /conservation-assessments/{id}/approve"
        actor: Archivist
        preconditions: ["assessment.status == DRAFT else ERR_INVALID_STATE"]
        side_effects:
          - "computes confirmed_priority_score (confirmed variant of conservation_priority_score) from the creation-time snapshots"
          - "item.conservation_priority_score := confirmed_priority_score; item.current_assessment_id := this assessment"
      - from: APPROVED
        to: IN_TREATMENT
        trigger: "POST /conservation-assessments/{id}/begin-treatment"
        actor: Archivist
        preconditions:
          - "assessment.status == APPROVED else ERR_INVALID_STATE"
          - "item.status == FLAGGED_CONSERVATION else ERR_INVALID_STATE"
        side_effects: ["item.status -> IN_TREATMENT"]
      - from: IN_TREATMENT
        to: COMPLETED
        trigger: "POST /conservation-assessments/{id}/complete-treatment"
        actor: Archivist
        preconditions:
          - "assessment.status == IN_TREATMENT else ERR_INVALID_STATE"
          - "item.status == IN_TREATMENT else ERR_INVALID_STATE"
        side_effects: ["item.status -> AVAILABLE; item.condition_grade := body.new_condition_grade; item.conservation_priority_score := null; item.current_assessment_id := null"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system — a new ConservationAssessment is created for the same item"
        actor: system
        preconditions: []
        side_effects: ["item.current_assessment_id points at the newer assessment"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — a new ConservationAssessment is created for the same item (only when item.status != IN_TREATMENT; creation is blocked while item IN_TREATMENT)"
        actor: system
        preconditions: []
        side_effects: ["item.conservation_priority_score := newer assessment's preliminary score is NOT applied until that assessment is approved — pin: score stays until superseding approval replaces it; current_assessment_id moves to the newer assessment"]

  - entity: FindingAid
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /finding-aids/{id}/submit-review"
        actor: Archivist
        preconditions: ["finding_aid.status IN {DRAFT, IN_REVISION} else ERR_INVALID_STATE"]
        side_effects: ["review_origin := DRAFT"]
      - from: IN_REVISION
        to: IN_REVIEW
        trigger: "POST /finding-aids/{id}/submit-review"
        actor: Archivist
        preconditions: ["finding_aid.status IN {DRAFT, IN_REVISION} else ERR_INVALID_STATE"]
        side_effects: ["review_origin := IN_REVISION"]
      - from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /finding-aids/{id}/publish"
        actor: Archivist
        preconditions: ["finding_aid.status == IN_REVIEW else ERR_INVALID_STATE"]
        side_effects:
          - "published_revision_count += 1; published_at := logical now"
          - "collection.published_finding_aid_present recomputed (becomes true)"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /finding-aids/{id}/return when review_origin == DRAFT"
        actor: Archivist
        preconditions: ["finding_aid.status == IN_REVIEW else ERR_INVALID_STATE"]
        side_effects: ["review_origin := null"]
      - from: IN_REVIEW
        to: IN_REVISION
        trigger: "POST /finding-aids/{id}/return when review_origin == IN_REVISION"
        actor: Archivist
        preconditions: ["finding_aid.status == IN_REVIEW else ERR_INVALID_STATE"]
        side_effects: ["review_origin := null"]
      - from: PUBLISHED
        to: IN_REVISION
        trigger: "POST /finding-aids/{id}/open-revision"
        actor: Archivist
        preconditions: ["finding_aid.status == PUBLISHED else ERR_INVALID_STATE"]
        side_effects: ["collection.published_finding_aid_present recomputed (drops to false when this was the only PUBLISHED aid)"]
      - from: PUBLISHED
        to: RETIRED
        trigger: "system — the finding aid's collection is deaccessioned (bubble-up)"
        actor: system
        preconditions: []
        side_effects: ["collection.published_finding_aid_present recomputed"]

  - entity: VolunteerProject
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /volunteer-projects/{id}/activate"
        actor: VolunteerCoordinator
        preconditions: ["project.status == PLANNED else ERR_INVALID_STATE"]
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /volunteer-projects/{id}/close"
        actor: VolunteerCoordinator
        preconditions:
          - "project.status == ACTIVE else ERR_INVALID_STATE"
          - "project.active_ticket_count == 0 else ERR_ACTIVE_TICKETS_REMAIN"
        side_effects: []

  - entity: DigitizationTicket
    initial_state: QUEUED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: QUEUED
        to: CLAIMED
        trigger: "POST /volunteer-projects/{id}/tickets/claim-next (selector policy assigns the ticket)"
        actor: Volunteer
        preconditions:
          - "project.status == ACTIVE else ERR_INVALID_STATE"
          - "candidate pool non-empty else ERR_NO_CLAIMABLE_TICKETS (pool: this project's tickets with status == QUEUED whose item.status == AVAILABLE; rank priority_score DESC, tie-break created_at ASC)"
        side_effects:
          - "claimed_by_user_id := caller X-User-ID"
          - "project.active_ticket_count += 1"
      - from: CLAIMED
        to: IN_CAPTURE
        trigger: "POST /digitization-tickets/{id}/begin-capture"
        actor: Volunteer
        preconditions:
          - "ticket.status == CLAIMED else ERR_INVALID_STATE"
          - "ticket.claimed_by_user_id == caller X-User-ID else ERR_OWNERSHIP_MISMATCH"
        side_effects: []
      - from: IN_CAPTURE
        to: QC_REVIEW
        trigger: "POST /digitization-tickets/{id}/submit-qc"
        actor: Volunteer
        preconditions:
          - "ticket.status == IN_CAPTURE else ERR_INVALID_STATE"
          - "ticket.claimed_by_user_id == caller X-User-ID else ERR_OWNERSHIP_MISMATCH"
        side_effects: []
      - from: QC_REVIEW
        to: COMPLETE
        trigger: "POST /digitization-tickets/{id}/qc-pass"
        actor: VolunteerCoordinator
        preconditions:
          - "ticket.status == QC_REVIEW else ERR_INVALID_STATE"
          - "ticket.claimed_by_user_id != caller X-User-ID else ERR_QC_SELF_REVIEW (segregation of duties)"
        side_effects: ["project.active_ticket_count -= 1"]
      - from: QC_REVIEW
        to: IN_CAPTURE
        trigger: "POST /digitization-tickets/{id}/qc-fail"
        actor: VolunteerCoordinator
        preconditions:
          - "ticket.status == QC_REVIEW else ERR_INVALID_STATE"
          - "ticket.claimed_by_user_id != caller X-User-ID else ERR_QC_SELF_REVIEW"
        side_effects: ["qc_fail_count += 1 (active_ticket_count unchanged — ticket remains active)"]
      - from: CLAIMED
        to: QUEUED
        trigger: "POST /digitization-tickets/{id}/release"
        actor: Volunteer
        preconditions:
          - "ticket.status IN {CLAIMED, IN_CAPTURE} else ERR_INVALID_STATE"
          - "ticket.claimed_by_user_id == caller X-User-ID else ERR_OWNERSHIP_MISMATCH"
        side_effects: ["claimed_by_user_id := null; project.active_ticket_count -= 1 (compensates the claim)"]
      - from: IN_CAPTURE
        to: QUEUED
        trigger: "POST /digitization-tickets/{id}/release"
        actor: Volunteer
        preconditions:
          - "ticket.status IN {CLAIMED, IN_CAPTURE} else ERR_INVALID_STATE"
          - "ticket.claimed_by_user_id == caller X-User-ID else ERR_OWNERSHIP_MISMATCH"
        side_effects: ["claimed_by_user_id := null; project.active_ticket_count -= 1"]
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /digitization-tickets/{id}/cancel, or system during deaccession finalize"
        actor: VolunteerCoordinator
        preconditions: ["ticket.status IN {QUEUED, CLAIMED, IN_CAPTURE, QC_REVIEW} else ERR_INVALID_STATE"]
        side_effects: ["if ticket was CLAIMED/IN_CAPTURE/QC_REVIEW: project.active_ticket_count -= 1"]
      - from: CLAIMED
        to: CANCELLED
        trigger: "POST /digitization-tickets/{id}/cancel, or system during deaccession finalize"
        actor: VolunteerCoordinator
        preconditions: ["ticket.status IN {QUEUED, CLAIMED, IN_CAPTURE, QC_REVIEW} else ERR_INVALID_STATE"]
        side_effects: ["project.active_ticket_count -= 1"]
      - from: IN_CAPTURE
        to: CANCELLED
        trigger: "POST /digitization-tickets/{id}/cancel, or system during deaccession finalize"
        actor: VolunteerCoordinator
        preconditions: ["ticket.status IN {QUEUED, CLAIMED, IN_CAPTURE, QC_REVIEW} else ERR_INVALID_STATE"]
        side_effects: ["project.active_ticket_count -= 1"]
      - from: QC_REVIEW
        to: CANCELLED
        trigger: "POST /digitization-tickets/{id}/cancel, or system during deaccession finalize"
        actor: VolunteerCoordinator
        preconditions: ["ticket.status IN {QUEUED, CLAIMED, IN_CAPTURE, QC_REVIEW} else ERR_INVALID_STATE"]
        side_effects: ["project.active_ticket_count -= 1"]

  - entity: Researcher
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — POST /reading-room-appointments/{id}/record-no-show brings no_show_strikes to >= 3"
        actor: system
        preconditions: []
        side_effects:
          - "Every ReadingRoomAppointment with researcher_id == this.id, status == CONFIRMED, scheduled_date >= current logical date becomes CANCELLED (cascade link 2)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /researchers/{id}/reinstate"
        actor: ReadingRoomStaff
        preconditions: ["researcher.status == SUSPENDED else ERR_INVALID_STATE"]
        side_effects: ["strike history is NOT erased; a later recorded no-show with no_show_strikes still >= 3 re-suspends (level check evaluated on each no-show event)"]

  - entity: ResearchRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /research-requests/{id}/begin-review"
        actor: ReadingRoomStaff
        preconditions: ["request.status == SUBMITTED else ERR_INVALID_STATE"]
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /research-requests/{id}/approve"
        actor: ReadingRoomStaff
        preconditions: ["request.status == IN_REVIEW else ERR_INVALID_STATE"]
        side_effects: []
      - from: IN_REVIEW
        to: DENIED
        trigger: "POST /research-requests/{id}/deny, or system during deaccession finalize"
        actor: ReadingRoomStaff
        preconditions: ["request.status == IN_REVIEW else ERR_INVALID_STATE (manual path); system path acts on status IN {SUBMITTED, IN_REVIEW, APPROVED}"]
        side_effects:
          - "system path: every ReadingRoomAppointment whose research_request_id == this.id with status IN {CONFIRMED, NEEDS_RESCHEDULE} becomes CANCELLED (cascade link 3)"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /research-requests/{id}/cancel"
        actor: Researcher
        preconditions:
          - "request.status IN {SUBMITTED, IN_REVIEW} else ERR_INVALID_STATE"
          - "request.researcher_id == caller X-User-ID else ERR_OWNERSHIP_MISMATCH"
        side_effects: []
      - from: IN_REVIEW
        to: CANCELLED
        trigger: "POST /research-requests/{id}/cancel"
        actor: Researcher
        preconditions:
          - "request.status IN {SUBMITTED, IN_REVIEW} else ERR_INVALID_STATE"
          - "request.researcher_id == caller X-User-ID else ERR_OWNERSHIP_MISMATCH"
        side_effects: []

  - entity: ReadingRoomAppointment
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /reading-room-appointments/{id}/check-in"
        actor: ReadingRoomStaff
        preconditions: ["appointment.status == CONFIRMED else ERR_INVALID_STATE"]
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /reading-room-appointments/{id}/complete"
        actor: ReadingRoomStaff
        preconditions: ["appointment.status == CHECKED_IN else ERR_INVALID_STATE"]
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /reading-room-appointments/{id}/record-no-show"
        actor: ReadingRoomStaff
        preconditions:
          - "appointment.status == CONFIRMED else ERR_INVALID_STATE"
          - "logical now >= appointment end datetime (scheduled_date + end_time UTC) else ERR_APPOINTMENT_NOT_ENDED"
        side_effects:
          - "researcher.no_show_strikes recomputed (rolling 180-day window over NO_SHOW appointments)"
          - "if strikes >= 3 and researcher.status == ACTIVE: researcher -> SUSPENDED and future CONFIRMED appointments CANCELLED (cascade)"
      - from: CONFIRMED
        to: NEEDS_RESCHEDULE
        trigger: "system — a requested item entered ZONE_HOLD via zone posture cascade, or system during suspension-adjacent hold"
        actor: system
        preconditions: ["scheduled_date >= current logical date"]
        side_effects: []
      - from: NEEDS_RESCHEDULE
        to: CONFIRMED
        trigger: "POST /reading-room-appointments/{id}/reschedule"
        actor: Researcher
        preconditions:
          - "appointment.status == NEEDS_RESCHEDULE else ERR_INVALID_STATE"
          - "appointment.researcher_id == caller X-User-ID else ERR_OWNERSHIP_MISMATCH"
          - "new slot passes the same capacity / double-booking / future-start validations as creation"
          - "every item on the underlying request has status == AVAILABLE at reschedule time else ERR_ITEM_NOT_AVAILABLE"
        side_effects: ["seats re-reserved for the new interval"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reading-room-appointments/{id}/cancel, or system (suspension cascade / deaccession cascade)"
        actor: Researcher
        preconditions:
          - "appointment.status IN {CONFIRMED, NEEDS_RESCHEDULE} else ERR_INVALID_STATE"
          - "appointment.researcher_id == caller X-User-ID else ERR_OWNERSHIP_MISMATCH (manual path; system cascade bypasses ownership)"
        side_effects: ["reserved seats released for the interval (compensating action for booking)"]
      - from: NEEDS_RESCHEDULE
        to: CANCELLED
        trigger: "POST /reading-room-appointments/{id}/cancel, or system cascades"
        actor: Researcher
        preconditions:
          - "appointment.status IN {CONFIRMED, NEEDS_RESCHEDULE} else ERR_INVALID_STATE"
          - "appointment.researcher_id == caller X-User-ID else ERR_OWNERSHIP_MISMATCH (manual path)"
        side_effects: ["reserved seats released"]

  - entity: ReproductionOrder
    initial_state: QUOTED
    terminal_states: [DELIVERED, REFUNDED, CANCELLED]
    transitions:
      - from: QUOTED
        to: APPROVED
        trigger: "POST /reproduction-orders/{id}/approve-quote"
        actor: Researcher
        preconditions:
          - "order.status == QUOTED else ERR_INVALID_STATE"
          - "order.researcher_id == caller X-User-ID else ERR_OWNERSHIP_MISMATCH"
        side_effects: []
      - from: APPROVED
        to: INVOICED
        trigger: "POST /reproduction-orders/{id}/invoice"
        actor: ReadingRoomStaff
        preconditions:
          - "order.status == APPROVED else ERR_INVALID_STATE"
          - "invoiced_fee_cents (from body.actual_pages) <= floor(quoted_fee_cents * 1.10) else ERR_REQUOTE_REQUIRED"
          - "actual_pages <= researcher's remaining annual page quota else ERR_REPRO_QUOTA_EXCEEDED"
        side_effects:
          - "invoiced_fee_cents computed per reproduction_fee (final variant) and stored"
          - "annual quota debited by actual_pages"
      - from: INVOICED
        to: PAID
        trigger: "POST /reproduction-orders/{id}/pay"
        actor: Researcher
        preconditions:
          - "order.status == INVOICED else ERR_INVALID_STATE"
          - "order.researcher_id == caller X-User-ID else ERR_OWNERSHIP_MISMATCH"
          - "body.amount_cents == invoiced_fee_cents exactly else ERR_PAYMENT_AMOUNT_MISMATCH"
        side_effects: ["researcher.total_charged_cents += invoiced_fee_cents"]
      - from: PAID
        to: DELIVERED
        trigger: "POST /reproduction-orders/{id}/deliver"
        actor: ReadingRoomStaff
        preconditions:
          - "order.status == PAID else ERR_INVALID_STATE"
          - "body.citation_acknowledgment_text is non-empty; for every item on the order whose accession's current EXECUTED deed has non-null required_citation_text, the acknowledgment must contain that exact text (case-sensitive) else ERR_CITATION_MISMATCH — evaluated against the deed current AT DELIVERY TIME"
        side_effects: []
      - from: PAID
        to: REFUNDED
        trigger: "POST /reproduction-orders/{id}/refund"
        actor: ReadingRoomStaff
        preconditions: ["order.status == PAID else ERR_INVALID_STATE"]
        side_effects:
          - "researcher.total_charged_cents -= invoiced_fee_cents (compensates the pay transition)"
          - "annual page quota debit is NOT released by refund (pinned)"
      - from: QUOTED
        to: CANCELLED
        trigger: "system — deaccession finalize fan-out over an order whose item_ids intersect the deaccessioned set"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "system — deaccession finalize fan-out"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeaccessionProposal
    initial_state: DRAFT
    terminal_states: [FINALIZED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /deaccession-proposals/{id}/submit"
        actor: Registrar
        preconditions: ["proposal.status == DRAFT else ERR_INVALID_STATE"]
        side_effects: []
      - from: SUBMITTED
        to: BOARD_REVIEW
        trigger: "POST /deaccession-proposals/{id}/send-to-board"
        actor: Registrar
        preconditions: ["proposal.status == SUBMITTED else ERR_INVALID_STATE"]
        side_effects: []
      - from: BOARD_REVIEW
        to: APPROVED
        trigger: "POST /deaccession-proposals/{id}/approve"
        actor: BoardOfficer
        preconditions:
          - "proposal.status == BOARD_REVIEW else ERR_INVALID_STATE"
          - "caller X-User-ID != proposal.proposed_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "no proposed item has status == IN_TREATMENT else ERR_ITEMS_IN_TREATMENT"
        side_effects:
          - "approved_by_user_id := caller X-User-ID; approved_at := logical now"
          - "finalize_not_before := approved_at + 30 days"
      - from: APPROVED
        to: COOLED_OFF
        trigger: "system — POST /_clock/set_current_utc sweeps APPROVED proposals whose finalize_not_before <= new logical now"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOARD_REVIEW
        to: REJECTED
        trigger: "POST /deaccession-proposals/{id}/reject"
        actor: BoardOfficer
        preconditions: ["proposal.status == BOARD_REVIEW else ERR_INVALID_STATE (no segregation-of-duties check on reject — pinned)"]
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /deaccession-proposals/{id}/withdraw"
        actor: Registrar
        preconditions: ["proposal.status IN {DRAFT, SUBMITTED} else ERR_INVALID_STATE"]
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /deaccession-proposals/{id}/withdraw"
        actor: Registrar
        preconditions: ["proposal.status IN {DRAFT, SUBMITTED} else ERR_INVALID_STATE"]
        side_effects: []
      - from: COOLED_OFF
        to: FINALIZED
        trigger: "POST /deaccession-proposals/{id}/finalize"
        actor: Registrar
        preconditions:
          - "proposal.status == COOLED_OFF else ERR_INVALID_STATE (if APPROVED but logical now < finalize_not_before, the state error surfaces as ERR_COOLING_OFF_NOT_ELAPSED — see validations)"
          - "no proposed item has status == IN_TREATMENT else ERR_ITEMS_IN_TREATMENT"
          - "if disposal_method == SALE: hammer_prices covers every proposed item exactly once else ERR_HAMMER_PRICE_MISSING"
        side_effects:
          - "if SALE: proceeds_cents computed per deaccession_proceeds (per-item rounding then sum)"
          - "Link 1: every proposed Item with status IN {PENDING_CATALOG, CATALOGED, AVAILABLE, FLAGGED_CONSERVATION, ZONE_HOLD} -> DEACCESSIONED"
          - "Link 2: every ResearchRequest with status IN {SUBMITTED, IN_REVIEW, APPROVED} whose item_ids intersect the deaccessioned set -> DENIED with decision_reason AUTO_DEACCESSION"
          - "Link 3: every ReadingRoomAppointment with status IN {CONFIRMED, NEEDS_RESCHEDULE} whose research_request_id was denied in link 2 -> CANCELLED"
          - "Fan-out: every DigitizationTicket with status IN {QUEUED, CLAIMED, IN_CAPTURE, QC_REVIEW} whose item was deaccessioned -> CANCELLED (project.active_ticket_count adjusted)"
          - "Fan-out: every ReproductionOrder with status IN {QUOTED, APPROVED} whose item_ids intersect the deaccessioned set -> CANCELLED; INVOICED/PAID/DELIVERED orders are untouched (pinned)"
          - "Bubble-up: a collection whose item_count reaches 0 -> DEACCESSIONED and its PUBLISHED FindingAids -> RETIRED"

  - entity: OralHistoryRecording
    initial_state: SCHEDULED
    terminal_states: [RELEASED, CANCELLED]
    note: "status (workflow) and release_status (PENDING/SIGNED/DECLINED) are independent parallel dimensions on this entity"
    transitions:
      - from: SCHEDULED
        to: RECORDED
        trigger: "POST /oral-histories/{id}/mark-recorded"
        actor: Archivist
        preconditions: ["recording.status == SCHEDULED else ERR_INVALID_STATE"]
        side_effects: []
      - from: RECORDED
        to: TRANSCRIBED
        trigger: "POST /oral-histories/{id}/submit-transcript"
        actor: Archivist
        preconditions: ["recording.status == RECORDED else ERR_INVALID_STATE"]
        side_effects: []
      - from: TRANSCRIBED
        to: IN_REVIEW
        trigger: "POST /oral-histories/{id}/send-to-review"
        actor: Archivist
        preconditions: ["recording.status == TRANSCRIBED else ERR_INVALID_STATE"]
        side_effects: []
      - from: IN_REVIEW
        to: TRANSCRIBED
        trigger: "POST /oral-histories/{id}/return-to-transcription (review loop)"
        actor: Archivist
        preconditions: ["recording.status == IN_REVIEW else ERR_INVALID_STATE"]
        side_effects: []
      - from: IN_REVIEW
        to: RELEASED
        trigger: "POST /oral-histories/{id}/publish-release"
        actor: Archivist
        preconditions:
          - "recording.status == IN_REVIEW else ERR_INVALID_STATE"
          - "recording.release_status == SIGNED else ERR_RELEASE_FORM_MISSING"
          - "recording.embargo_until is null OR embargo_until <= logical now else ERR_ORAL_HISTORY_EMBARGOED"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /oral-histories/{id}/cancel"
        actor: Archivist
        preconditions: ["recording.status IN {SCHEDULED, RECORDED, TRANSCRIBED, IN_REVIEW} else ERR_INVALID_STATE"]
        side_effects: []
      - from: RECORDED
        to: CANCELLED
        trigger: "POST /oral-histories/{id}/cancel"
        actor: Archivist
        preconditions: ["recording.status IN {SCHEDULED, RECORDED, TRANSCRIBED, IN_REVIEW} else ERR_INVALID_STATE"]
        side_effects: []
      - from: TRANSCRIBED
        to: CANCELLED
        trigger: "POST /oral-histories/{id}/cancel"
        actor: Archivist
        preconditions: ["recording.status IN {SCHEDULED, RECORDED, TRANSCRIBED, IN_REVIEW} else ERR_INVALID_STATE"]
        side_effects: []
      - from: IN_REVIEW
        to: CANCELLED
        trigger: "POST /oral-histories/{id}/cancel"
        actor: Archivist
        preconditions: ["recording.status IN {SCHEDULED, RECORDED, TRANSCRIBED, IN_REVIEW} else ERR_INVALID_STATE"]
        side_effects: []
      - from: PENDING
        to: SIGNED
        trigger: "POST /oral-histories/{id}/release-forms/sign (release_status dimension)"
        actor: Archivist
        preconditions:
          - "recording.release_status == PENDING else ERR_INVALID_STATE"
          - "body.signed_by_narrator_name == recording.narrator_name (exact match) else ERR_NARRATOR_MISMATCH"
        side_effects: ["release_signed_at := logical now; embargo_until := body.embargo_until (may be null)"]
      - from: PENDING
        to: DECLINED
        trigger: "POST /oral-histories/{id}/release-forms/decline (release_status dimension)"
        actor: Archivist
        preconditions: ["recording.release_status == PENDING else ERR_INVALID_STATE"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC — the only sanctioned write-write mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: deed-execute-stale-accession
    parent_entity: Accession
    write_endpoint: "POST /deeds/{id}/execute"
    occ_field: expected_accession_version
    description: |
      Executing a DRAFT deed against an Accession whose version has advanced
      since the client last observed it is rejected. Executing one deed
      legitimately supersedes the previously EXECUTED deed (product semantics
      allow a later execution to replace the current deed), so a second
      execute carrying a stale expected_accession_version cannot be rejected
      from state alone; the stale-version check is what rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: assessment-create-stale-item
    parent_entity: Item
    write_endpoint: "POST /items/{id}/conservation-assessments"
    occ_field: expected_item_version
    description: |
      Creating a ConservationAssessment against an Item whose version has
      advanced since the client last observed it is rejected. A newer
      assessment legitimately supersedes the item's previous DRAFT/APPROVED
      assessment (product semantics allow supersession), so a second create
      carrying a stale expected_item_version cannot be rejected from state
      alone; the stale-version check is what rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: reproduction_image_component
    trigger: "ReproductionOrder creation (from page_estimate) and POST /reproduction-orders/{id}/invoice (from body.actual_pages)"
    algorithm: tiered_pricing
    formula: |
      tier_cost(p) = 35 * min(p, 50)                     # first 50 pages @ 35c
                   + 25 * min(max(p - 50, 0), 150)       # next 150 pages @ 25c
                   + 15 * max(p - 200, 0)                # pages beyond 200 @ 15c
      image_component = round_half_up_to_cents( tier_cost(p) * FORMAT_MULT[format] * (1.5 if rush else 1.0) )
      # >= 3 inputs with non-linear interaction: marginal tier selection, format
      # multiplier, rush multiplier; tier_cost itself is piecewise. (Rule 2 mode a)
    input_set: "the single order being priced; pages = page_estimate at creation, actual_pages at invoice"
    constants:
      TIER1_PAGES: 50
      TIER1_RATE_CENTS: 35
      TIER2_PAGES: 150
      TIER2_RATE_CENTS: 25
      TIER3_RATE_CENTS: 15
      FORMAT_MULT_SCAN_STANDARD: 1.0
      FORMAT_MULT_SCAN_HIGHRES: 1.8
      FORMAT_MULT_PRINT_PHOTOGRAPH: 2.5
      RUSH_MULT: 1.5
    precision: "integer cents; the single multiply-round step uses round_half_up"
    variants:
      - name: quoted
        when: "order creation; pages := page_estimate; result stored in quoted_fee_cents"
        difference: "uses the patron's estimate; may differ from invoiced value for identical rate constants"
      - name: invoiced
        when: "POST /reproduction-orders/{id}/invoice; pages := body.actual_pages; result stored in invoiced_fee_cents"
        difference: "uses staff-recorded actual pages; diverges from quoted whenever actual_pages != page_estimate"

  - name: reproduction_order_total
    trigger: "same trigger points as reproduction_image_component; consumes its image_component"
    algorithm: constraint_propagation
    formula: |
      # Pinned evaluation order (a circular-looking dependency made explicit):
      # the academic discount tier is keyed on the PRE-discount image_component,
      # the minimum fee applies AFTER discounting, and the license flat is added LAST.
      # (Rule 2 mode c)
      (1) image_component   := reproduction_image_component(...)
      (2) discount_rate     := 0.20 if (order.research_request_id -> ResearchRequest.purpose == "ACADEMIC"
                                        AND image_component >= ACADEMIC_DISCOUNT_MIN_COMPONENT_CENTS) else 0.0
      (3) discounted        := round_half_up_to_cents( image_component * (1 - discount_rate) )
      (4) after_minimum     := max(MIN_ORDER_FEE_CENTS, discounted)
      (5) total             := after_minimum + LICENSE_FLAT_CENTS[license_class]
      # Evaluation-order sensitivity: keying the discount on the POST-discount amount,
      # or applying the minimum before the discount, yields different cents; both are forbidden.
    input_set: "the order plus its linked ResearchRequest.purpose"
    constants:
      ACADEMIC_DISCOUNT_MIN_COMPONENT_CENTS: 5000
      ACADEMIC_DISCOUNT_RATE: 0.20
      MIN_ORDER_FEE_CENTS: 500
      LICENSE_FLAT_PERSONAL: 0
      LICENSE_FLAT_NONPROFIT_PUBLICATION: 1500
      LICENSE_FLAT_COMMERCIAL_PUBLICATION: 7500
    precision: "integer cents; round_half_up at steps (1) and (3) only"
    variants:
      - name: quoted
        when: "order creation"
        difference: "feeds quoted_fee_cents"
      - name: invoiced
        when: "invoice"
        difference: "feeds invoiced_fee_cents; requote gate compares the two: invoiced > floor(quoted * 1.10) -> ERR_REQUOTE_REQUIRED"

  - name: reproduction_annual_quota
    trigger: "POST /reproduction-orders/{id}/invoice, after the fee is computed and before the order transitions"
    algorithm: aggregation
    formula: |
      quota_remaining = ANNUAL_PAGE_QUOTA
                        - sum(order.actual_pages for order in the researcher's orders
                              with status IN {INVOICED, PAID, DELIVERED}
                              and invoice timestamp inside the current calendar year (UTC))
      # REFUNDED orders keep their quota debit (pinned); QUOTED/APPROVED orders consume nothing.
      # Check: actual_pages > quota_remaining -> ERR_REPRO_QUOTA_EXCEEDED; == quota_remaining is allowed.
    input_set: "all ReproductionOrders of the researcher stamped at invoice time"
    constants:
      ANNUAL_PAGE_QUOTA: 500
    precision: "integer pages"

  - name: conservation_priority_score
    trigger: "ConservationAssessment creation (preliminary variant) and POST /conservation-assessments/{id}/approve (confirmed variant)"
    algorithm: weighted_scoring
    formula: |
      demand_score = min(100, open_request_count_snapshot * DEMAND_POINTS_PER_REQUEST)
      value_score  = min(100, floor(item.appraised_value_cents / VALUE_STEP_CENTS))
      preliminary:  score = round_half_up_2dp( W_URGENCY * urgency_score
                             + W_DEMAND * demand_score + W_VALUE * value_score )
      confirmed:    urgency_eff = min(100, round_half_up_0dp(urgency_score * FRAGILE_URGENCY_MULT))
                                  if condition_grade_observed == FRAGILE else urgency_score
                    score = round_half_up_2dp( W_URGENCY * urgency_eff
                             + W_DEMAND * demand_score + W_VALUE * value_score )
      # open_request_count_snapshot is taken ONCE at assessment creation and never
      # recomputed — the preliminary->confirmed step changes ONLY the urgency term.
    input_set: "the assessment's snapshots + the item's appraised_value_cents at computation time; open requests = ResearchRequests with status IN {SUBMITTED, IN_REVIEW, APPROVED} whose item_ids contain the item"
    constants:
      W_URGENCY: 0.5
      W_DEMAND: 0.3
      W_VALUE: 0.2
      DEMAND_POINTS_PER_REQUEST: 25
      VALUE_STEP_CENTS: 1000
      FRAGILE_URGENCY_MULT: 1.25
    precision: "2 decimal places, round_half_up; urgency_eff rounded to integer first"
    variants:
      - name: preliminary
        when: "assessment creation -> preliminary_priority_score"
        difference: "urgency used as given"
      - name: confirmed
        when: "approval -> confirmed_priority_score (then copied to item.conservation_priority_score)"
        difference: "FRAGILE observations get urgency x1.25 capped at 100; identical inputs otherwise — same snapshots, different number"

  - name: digitization_priority_score
    trigger: "DigitizationTicket creation (POST /volunteer-projects/{id}/tickets); result frozen for the ticket's life"
    algorithm: weighted_scoring
    formula: |
      priority_score = round_half_up_2dp( BASE_PRIORITY
                       + CONSERVATION_WEIGHT * (item.conservation_priority_score or 0)
                       + REQUEST_BOOST * min(REQUEST_BOOST_CAP, approved_request_count) )
      # approved_request_count = ResearchRequests with status == APPROVED referencing the item
    input_set: "the referenced item (its current conservation_priority_score) and its APPROVED requests at ticket-creation time"
    constants:
      BASE_PRIORITY: 50
      CONSERVATION_WEIGHT: 0.4
      REQUEST_BOOST: 10
      REQUEST_BOOST_CAP: 3
    precision: "2 decimal places, round_half_up"

  - name: environmental_posture_evaluation
    trigger: "every POST /storage-zones/{id}/readings (after the reading is appended)"
    algorithm: chronological
    formula: |
      # Deterministic replay — order-sensitive by design; late-arriving readings are
      # inserted by (recorded_at ASC, created_at ASC) and the whole history replays.
      posture := OPEN; breach_run := 0; clean_run := 0
      for r in recent_readings ordered by (recorded_at ASC, created_at ASC):
        if r.is_severe:                       # severe is always also a breach
          posture := CLOSED; breach_run += 1; clean_run := 0
        elif r.is_breach:
          breach_run += 1; clean_run := 0
          if breach_run >= 6: posture := CLOSED
          elif breach_run >= 3 and posture == OPEN: posture := RESTRICTED
          # 1-2 breaches: hysteresis — posture unchanged
        else:
          clean_run += 1; breach_run := 0
          if clean_run >= 3: posture := one level toward OPEN (CLOSED->RESTRICTED, RESTRICTED->OPEN, OPEN->OPEN)
      zone.posture := posture; zone.breach_streak := breach_run
      # breach test (computed at POST time, stored on the reading):
      #   is_breach = temperature_c > temp_high_c OR temperature_c < temp_low_c
      #            OR humidity_pct >= humidity_high_pct OR humidity_pct <= humidity_low_pct
      #   is_severe = temperature_c >= temp_high_c + 4.0 OR humidity_pct >= humidity_high_pct + 15.0
      # Note the asymmetric operators: temperature bounds are strict (>, <),
      # humidity bounds are inclusive (>=, <=) — boundary precision is intentional.
    input_set: "all readings embedded on the zone, replayed in (recorded_at ASC, created_at ASC) order — never arrival order"
    constants:
      BREACH_STREAK_RESTRICT: 3
      BREACH_STREAK_CLOSE: 6
      CLEAN_STREAK_RECOVER: 3
      SEVERE_TEMP_MARGIN_C: 4.0
      SEVERE_HUMIDITY_MARGIN_PCT: 15.0
    precision: "thresholds compared at the exact decimal precision posted"

  - name: no_show_strike_count
    trigger: "POST /reading-room-appointments/{id}/record-no-show (after the appointment becomes NO_SHOW)"
    algorithm: threshold
    formula: |
      strikes = count of the researcher's appointments with status == NO_SHOW
                and scheduled_date >= (current logical date - STRIKE_WINDOW_DAYS)   # inclusive boundary
      if strikes >= STRIKE_SUSPEND_THRESHOLD and researcher.status == ACTIVE:
        researcher.status := SUSPENDED   # level check, evaluated on each no-show event
        cascade: researcher's future CONFIRMED appointments -> CANCELLED
    input_set: "the researcher's ReadingRoomAppointments (all history; window filter applied)"
    constants:
      STRIKE_WINDOW_DAYS: 180
      STRIKE_SUSPEND_THRESHOLD: 3          # >= : exactly 3 strikes suspends; 2 does not
    precision: "whole days; scheduled_date compared as a UTC calendar date"

  - name: seat_occupancy
    trigger: "POST /reading-room-appointments (creation) and POST /reading-room-appointments/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      overlap(a, b) = a.start_time < b.end_time AND b.start_time < a.end_time   # half-open [start, end)
      occupied = sum(seats of appointments with same room_code, same scheduled_date,
                     status IN {CONFIRMED, CHECKED_IN}, overlapping the candidate interval)
      admitted iff occupied + new_seats <= ROOM_CAPACITY[room_code]
      # Adjacent appointments (a.end_time == b.start_time) do NOT overlap — back-to-back is allowed.
      # Full house: occupied == capacity admits zero further seats (>= is the rejection rule, not >).
      # Additionally: any single item appearing in two distinct CONFIRMED appointments on the
      # same scheduled_date -> ERR_ITEM_DOUBLE_BOOKED (whole-day granularity, regardless of times).
    input_set: "appointments of the same room and date in seat-holding states"
    constants:
      ROOM_CAPACITY_MAIN: 8
      ROOM_CAPACITY_MAP_ROOM: 4
    precision: "times at minute precision"

  - name: recording_studio_conflict
    trigger: "POST /oral-histories (creation)"
    algorithm: interval_merge
    formula: |
      # Single-resource-per-room semantics with a mandatory turnaround buffer —
      # deliberately different interval semantics from seat_occupancy:
      # closed bounds and a required gap, no aggregate capacity.
      conflict(new, existing) = NOT ( new.session_end + TURNAROUND_MINUTES <= existing.session_start
                                   OR existing.session_end + TURNAROUND_MINUTES <= new.session_start )
      # a gap of EXACTLY TURNAROUND_MINUTES is allowed (<= is inclusive); 29 minutes is a conflict.
      # Only recordings with status != CANCELLED participate.
    input_set: "OralHistoryRecordings with the same recording_room_id and status != CANCELLED"
    constants:
      TURNAROUND_MINUTES: 30
    precision: "minute precision on instants"

  - name: deaccession_proceeds
    trigger: "POST /deaccession-proposals/{id}/finalize when disposal_method == SALE"
    algorithm: aggregation
    formula: |
      # Pinned rounding order (Rule 2 mode b): round EACH line, THEN sum.
      proceeds_cents = sum over proposed items of round_half_up_to_cents( price_cents * (1 - COMMISSION_RATE) )
      # Sum-then-round is a valid-looking alternative that yields different cents
      # (e.g. hammers 999/555/333 -> per-item-then-sum 1699 vs sum-then-round 1698); it is forbidden.
    input_set: "the proposal's hammer_prices entries (exactly one per proposed item)"
    constants:
      COMMISSION_RATE: 0.10
    precision: "integer cents, round_half_up per line"

  - name: volunteer_hours_accumulation
    trigger: "POST /digitization-tickets/{id}/log-hours"
    algorithm: aggregation
    formula: |
      new_total = (project.volunteer_hours[caller_user_id] or 0) + body.hours
      reject with ERR_VOLUNTEER_HOUR_CAP_EXCEEDED iff new_total > project.max_hours_per_volunteer
      # boundary: new_total == cap is allowed; strictly greater is rejected.
      on success: ticket.hours_logged += hours; project.hours_logged_total += hours;
                  project.volunteer_hours[caller_user_id] := new_total
    input_set: "the ticket's project and the caller's accumulated hours"
    constants:
      DEFAULT_MAX_HOURS_PER_VOLUNTEER: 40
    precision: "hours must be a positive multiple of 0.25 (else ERR_INVALID_REQUEST); stored exactly"

  - name: collection_holdings_rollup
    trigger: "Item creation/deaccession; FindingAid publish/open-revision/retire; deaccession finalize"
    algorithm: aggregation
    formula: |
      collection.item_count = count of Items with collection_id == collection.id and status != DEACCESSIONED
      collection.published_finding_aid_present = exists FindingAid with collection_id == collection.id and status == PUBLISHED
    input_set: "direct children only (subcollection contents are NOT rolled up — pinned)"
    precision: "exact integers/booleans; recomputed synchronously on each trigger (immediate consistency)"

# =============================================================================
# Table 4: Validation Rules Table (§1.4) — ordered by priority
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: business_constraint
    check: "Request body shape, validated BEFORE any resource lookup: required fields present (ERR_INVALID_REQUEST); enum values in their declared sets (ERR_INVALID_REQUEST); start_time < end_time and session_start < session_end (ERR_INVALID_REQUEST); hours a positive multiple of 0.25 (ERR_INVALID_REQUEST); item_ids arrays duplicate-free (ERR_INVALID_REQUEST); ResearchRequest item_ids arity 1..10 (ERR_TOO_MANY_ITEMS); ReproductionOrder item_ids non-empty (ERR_ITEM_NOT_IN_REQUEST); pagination params limit in 1..100 and offset >= 0 on list endpoints (ERR_INVALID_PAGINATION_PARAMETERS)"
    error_id: "ERR_INVALID_REQUEST / ERR_TOO_MANY_ITEMS / ERR_ITEM_NOT_IN_REQUEST / ERR_INVALID_PAGINATION_PARAMETERS"
    http_status: 400
    applies_to: "all endpoints with request bodies"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right (zone, then collection/accession/item/etc.); body-referenced ids after path ids"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: state
    check: "Target resource is in a state that permits the operation (per state machine)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version in the request body equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /deeds/{id}/execute; POST /items/{id}/conservation-assessments"
  - priority: 7
    category: state
    check: "Cross-entity state gates: accession ACCESSIONED for item create and make-available (ERR_ACCESSION_NOT_ACCESSIONED); collection ACTIVE for item create and finding-aid create (ERR_INVALID_STATE); collection finding aid published for make-available (ERR_FINDING_AID_NOT_PUBLISHED); zone posture OPEN for make-available (ERR_ZONE_RESTRICTED); item AVAILABLE for request create / ticket create / reschedule (ERR_ITEM_NOT_AVAILABLE); request APPROVED for appointment and reproduction-order create (ERR_REQUEST_NOT_APPROVED); researcher ACTIVE for request/appointment/order create (ERR_RESEARCHER_SUSPENDED)"
    error_id: "ERR_ACCESSION_NOT_ACCESSIONED / ERR_INVALID_STATE / ERR_FINDING_AID_NOT_PUBLISHED / ERR_ZONE_RESTRICTED / ERR_ITEM_NOT_AVAILABLE / ERR_REQUEST_NOT_APPROVED / ERR_RESEARCHER_SUSPENDED"
    http_status: 409
    applies_to: "create/action endpoints with cross-entity preconditions"
  - priority: 8
    category: business_safety
    check: "Conservation/compliance gates: FRAGILE items may not be pulled to the reading room (ERR_ITEM_TOO_FRAGILE); deaccession approver must differ from proposer (ERR_SEGREGATION_OF_DUTIES); QC reviewer must differ from claimer (ERR_QC_SELF_REVIEW); active deed embargo blocks reproduction-order create (ERR_EMBARGO_ACTIVE); deed reproduction_restricted blocks order create (ERR_DEED_REPRODUCTION_RESTRICTED); deed publication_license_required blocks PERSONAL orders (ERR_PUBLICATION_LICENSE_REQUIRED); oral-history publish requires SIGNED release (ERR_RELEASE_FORM_MISSING) past embargo (ERR_ORAL_HISTORY_EMBARGOED); delivery citation must contain the current deed's required_citation_text (ERR_CITATION_MISMATCH)"
    error_id: "ERR_ITEM_TOO_FRAGILE / ERR_SEGREGATION_OF_DUTIES / ERR_QC_SELF_REVIEW / ERR_EMBARGO_ACTIVE / ERR_DEED_REPRODUCTION_RESTRICTED / ERR_PUBLICATION_LICENSE_REQUIRED / ERR_RELEASE_FORM_MISSING / ERR_ORAL_HISTORY_EMBARGOED / ERR_CITATION_MISMATCH"
    http_status: 409
    applies_to: "appointments, reproduction orders, deaccession approve, ticket QC, oral-history release/publish, order delivery"
  - priority: 9
    category: business_temporal
    check: "Temporal gates: appointment start (scheduled_date + start_time UTC) must be strictly in the future (ERR_APPOINTMENT_IN_PAST); record-no-show requires logical now >= appointment end datetime (ERR_APPOINTMENT_NOT_ENDED); deaccession finalize requires COOLED_OFF — while APPROVED with logical now < finalize_not_before the finalize call fails (ERR_COOLING_OFF_NOT_ELAPSED)"
    error_id: "ERR_APPOINTMENT_IN_PAST / ERR_APPOINTMENT_NOT_ENDED / ERR_COOLING_OFF_NOT_ELAPSED"
    http_status: 422
    applies_to: "appointment create/reschedule, record-no-show, deaccession finalize"
  - priority: 10
    category: business_constraint
    check: "Constraint gates: seat capacity & item double-booking (ERR_APPOINTMENT_CAPACITY_EXCEEDED / ERR_ITEM_DOUBLE_BOOKED); recording-studio turnaround buffer (ERR_RECORDING_ROOM_CONFLICT); uniqueness (ERR_COLLECTION_CODE_EXISTS / ERR_ZONE_CODE_EXISTS / ERR_DUPLICATE_EMAIL); collection hierarchy acyclicity (ERR_COLLECTION_CYCLE); volunteer hour cap (ERR_VOLUNTEER_HOUR_CAP_EXCEEDED); claim pool non-empty (ERR_NO_CLAIMABLE_TICKETS); project close requires zero active tickets (ERR_ACTIVE_TICKETS_REMAIN); approve/finalize blocked while items IN_TREATMENT (ERR_ITEMS_IN_TREATMENT); release signer must equal narrator (ERR_NARRATOR_MISMATCH)"
    error_id: "ERR_APPOINTMENT_CAPACITY_EXCEEDED / ERR_ITEM_DOUBLE_BOOKED / ERR_RECORDING_ROOM_CONFLICT / ERR_COLLECTION_CODE_EXISTS / ERR_ZONE_CODE_EXISTS / ERR_DUPLICATE_EMAIL / ERR_COLLECTION_CYCLE / ERR_VOLUNTEER_HOUR_CAP_EXCEEDED / ERR_NO_CLAIMABLE_TICKETS / ERR_ACTIVE_TICKETS_REMAIN / ERR_ITEMS_IN_TREATMENT / ERR_NARRATOR_MISMATCH"
    http_status: 409
    applies_to: "create/action endpoints with constraint checks"
  - priority: 11
    category: business_referential
    check: "Referential/ownership: appointment or order may reference only the caller's own research request (ERR_REQUEST_OWNERSHIP_MISMATCH); cancel/log-hours/begin-capture etc. only by the owning researcher/volunteer (ERR_OWNERSHIP_MISMATCH); order item_ids must be a subset of the request's item_ids (ERR_ITEM_NOT_IN_REQUEST)"
    error_id: "ERR_REQUEST_OWNERSHIP_MISMATCH / ERR_OWNERSHIP_MISMATCH / ERR_ITEM_NOT_IN_REQUEST"
    http_status: 403
    applies_to: "appointment create, reproduction-order create, cancel/action endpoints"
  - priority: 12
    category: business_fiscal
    check: "Fiscal gates: annual page quota at invoice (ERR_REPRO_QUOTA_EXCEEDED); payment amount must equal invoiced fee exactly (ERR_PAYMENT_AMOUNT_MISMATCH); invoice within 110% of quote (ERR_REQUOTE_REQUIRED); SALE finalize requires complete hammer prices (ERR_HAMMER_PRICE_MISSING)"
    error_id: "ERR_REPRO_QUOTA_EXCEEDED / ERR_PAYMENT_AMOUNT_MISMATCH / ERR_REQUOTE_REQUIRED / ERR_HAMMER_PRICE_MISSING"
    http_status: 402
    applies_to: "reproduction invoice/pay, deaccession finalize"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- Logical clock (test-driving endpoint; declared per §1.5 priority ladder rung 3) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. All embargo/cooling-off/strike-window/future-start checks read this clock."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "logical clock := to_iso8601 (may move forward or backward; pinned)"
      - "sweep: every DeaccessionProposal with status == APPROVED and finalize_not_before <= new now becomes COOLED_OFF"

  # --- StorageZone ---
  - method: POST
    path: "/storage-zones"
    description: "Create a storage zone with configurable environmental thresholds"
    roles: [Registrar, SystemAdmin]
    code: 201
    input: [zone_code, name, "temp_high_c?", "temp_low_c?", "humidity_high_pct?", "humidity_low_pct?"]
    output: StorageZone
    side_effects: ["posture := OPEN; breach_streak := 0; recent_readings := []"]
  - method: GET
    path: "/storage-zones"
    description: "List storage zones"
    roles: &all_roles [Registrar, Archivist, ReadingRoomStaff, BoardOfficer, VolunteerCoordinator, Volunteer, Researcher, SystemAdmin]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: "StorageZone[]"
    side_effects: []
  - method: GET
    path: "/storage-zones/{id}"
    description: "Get one storage zone (includes posture, breach_streak, recent_readings)"
    roles: *all_roles
    code: 200
    input: []
    output: StorageZone
    side_effects: []
  - method: POST
    path: "/storage-zones/{id}/readings"
    description: "Append an environmental reading (sensor feed); recomputes posture by replay and fires zone->item->appointment cascades. Returns the zone."
    roles: [SystemAdmin, Archivist]
    code: 201
    input: [recorded_at, temperature_c, humidity_pct]
    output: StorageZone
    side_effects:
      - "reading appended to recent_readings with is_breach/is_severe computed against current zone thresholds"
      - "environmental_posture_evaluation replays; posture transitions fire the Item ZONE_HOLD / appointment NEEDS_RESCHEDULE cascade (see StorageZone state machine)"

  # --- Collection ---
  - method: POST
    path: "/collections"
    description: "Create a collection (optionally under a parent collection)"
    roles: [Registrar]
    code: 201
    input: [title, collection_code, storage_zone_id, "parent_collection_id?"]
    output: Collection
    side_effects:
      - "status := ACTIVE"
      - "parent_collection_id must reference an existing Collection and must not create a cycle (self or descendant) else ERR_COLLECTION_CYCLE"
  - method: GET
    path: "/collections"
    description: "List collections; filters double as FK reverse-reachability views"
    roles: *all_roles
    code: 200
    input: ["parent_collection_id?", "storage_zone_id?", "status?", "limit?", "offset?"]
    output: "Collection[]"
    side_effects: []
  - method: GET
    path: "/collections/{id}"
    description: "Get one collection"
    roles: *all_roles
    code: 200
    input: []
    output: Collection
    side_effects: []
  - method: PATCH
    path: "/collections/{id}"
    description: "Move a collection under a different parent collection (hierarchy maintenance)"
    roles: [Registrar]
    code: 200
    input: [parent_collection_id]
    output: Collection
    side_effects:
      - "new parent must exist (ERR_NOT_FOUND), must not be the collection itself or one of its descendants (ERR_COLLECTION_CYCLE), and the collection must be ACTIVE (ERR_INVALID_STATE)"

  # --- Accession ---
  - method: POST
    path: "/accessions"
    description: "Register a new accession (donor lot intake)"
    roles: [Registrar]
    code: 201
    input: [donor_name, donor_contact, accession_date, lot_appraised_value_cents]
    output: Accession
    side_effects: ["status := DRAFT; accession_number computed"]
  - method: GET
    path: "/accessions"
    description: "List accessions"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Accession[]"
    side_effects: []
  - method: GET
    path: "/accessions/{id}"
    description: "Get one accession"
    roles: *all_roles
    code: 200
    input: []
    output: Accession
    side_effects: []
  - method: POST
    path: "/accessions/{id}/submit"
    description: "Submit accession: DRAFT -> PENDING_DEED"
    roles: [Registrar]
    code: 200
    input: []
    output: Accession
    side_effects: ["status := PENDING_DEED; increments Accession.version by 1"]
  - method: POST
    path: "/accessions/{id}/amend"
    description: "Open a deed-amendment cycle: ACCESSIONED -> AMENDMENT_PENDING"
    roles: [Registrar]
    code: 200
    input: []
    output: Accession
    side_effects: ["status := AMENDMENT_PENDING; increments Accession.version by 1"]
  - method: POST
    path: "/accessions/{id}/withdraw"
    description: "Withdraw accession before any deed executes: DRAFT/PENDING_DEED -> WITHDRAWN"
    roles: [Registrar]
    code: 200
    input: []
    output: Accession
    side_effects: ["status := WITHDRAWN; DRAFT deeds -> VOIDED"]

  # --- DeedOfGift ---
  - method: POST
    path: "/accessions/{id}/deeds"
    description: "Draft a deed of gift for an accession"
    roles: [Registrar]
    code: 201
    input: ["reproduction_restricted?", "publication_license_required?", "embargo_until?", "required_citation_text?"]
    output: DeedOfGift
    side_effects:
      - "accession.status must be IN {PENDING_DEED, AMENDMENT_PENDING, ACCESSIONED} else ERR_INVALID_STATE"
      - "deed_version assigned (1-based per accession)"
  - method: GET
    path: "/accessions/{id}/deeds"
    description: "List deeds of an accession (FK reverse-reachability)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "DeedOfGift[]"
    side_effects: []
  - method: POST
    path: "/deeds/{id}/execute"
    description: "Execute a draft deed (OCC on Accession.version); supersedes the previously EXECUTED deed"
    roles: [Registrar]
    code: 200
    input: [expected_accession_version]
    output: DeedOfGift
    side_effects:
      - "status := EXECUTED"
      - "increments Accession.version by 1"
      - "prior EXECUTED deed (if any) -> SUPERSEDED; accession -> ACCESSIONED; accession.current_deed_id updated"
  - method: POST
    path: "/deeds/{id}/void"
    description: "Void a draft deed: DRAFT -> VOIDED"
    roles: [Registrar]
    code: 200
    input: []
    output: DeedOfGift
    side_effects: ["status := VOIDED"]

  # --- Item ---
  - method: POST
    path: "/items"
    description: "Create a stub item (PENDING_CATALOG) from an ACCESSIONED accession into an ACTIVE collection"
    roles: [Archivist]
    code: 201
    input: [accession_id, collection_id, title]
    output: Item
    side_effects:
      - "accession.status must be ACCESSIONED else ERR_ACCESSION_NOT_ACCESSIONED"
      - "collection.status must be ACTIVE else ERR_INVALID_STATE"
      - "collection.item_count += 1"
  - method: GET
    path: "/items"
    description: "List items; accession_id/collection_id filters double as FK reverse views"
    roles: *all_roles
    code: 200
    input: ["accession_id?", "collection_id?", "status?", "limit?", "offset?"]
    output: "Item[]"
    side_effects: []
  - method: GET
    path: "/items/{id}"
    description: "Get one item"
    roles: *all_roles
    code: 200
    input: []
    output: Item
    side_effects: []
  - method: POST
    path: "/items/{id}/catalog"
    description: "Complete cataloging: PENDING_CATALOG -> CATALOGED, setting catalog metadata"
    roles: [Archivist]
    code: 200
    input: [description, condition_grade, appraised_value_cents, format]
    output: Item
    side_effects: ["status := CATALOGED; fields stored"]
  - method: POST
    path: "/items/{id}/make-available"
    description: "Release a cataloged item for research: CATALOGED -> AVAILABLE (gated by finding aid, accession, zone)"
    roles: [Archivist]
    code: 200
    input: []
    output: Item
    side_effects: ["status := AVAILABLE"]
  - method: POST
    path: "/items/{id}/flag-conservation"
    description: "Flag an available item for conservation: AVAILABLE -> FLAGGED_CONSERVATION"
    roles: [Archivist]
    code: 200
    input: []
    output: Item
    side_effects: ["status := FLAGGED_CONSERVATION"]
  - method: GET
    path: "/items/{id}/research-requests"
    description: "Requests referencing this item (FK reverse-reachability for item_ids arrays)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "ResearchRequest[]"
    side_effects: []
  - method: GET
    path: "/items/{id}/reproduction-orders"
    description: "Reproduction orders referencing this item (FK reverse-reachability)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "ReproductionOrder[]"
    side_effects: []
  - method: GET
    path: "/items/{id}/deaccession-proposals"
    description: "Deaccession proposals referencing this item (FK reverse-reachability)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "DeaccessionProposal[]"
    side_effects: []

  # --- ConservationAssessment ---
  - method: POST
    path: "/items/{id}/conservation-assessments"
    description: "Create a conservation assessment (OCC on Item.version); supersedes the item's prior DRAFT/APPROVED assessment"
    roles: [Archivist]
    code: 201
    input: [expected_item_version, condition_grade_observed, urgency_score, treatment_estimate_hours]
    output: ConservationAssessment
    side_effects:
      - "item.status must be IN {AVAILABLE, FLAGGED_CONSERVATION} else ERR_INVALID_STATE (blocked while IN_TREATMENT)"
      - "increments Item.version by 1"
      - "prior DRAFT/APPROVED assessment for the item (if any) -> SUPERSEDED"
      - "open_request_count_snapshot taken; preliminary_priority_score computed; item.current_assessment_id := this assessment"
  - method: GET
    path: "/items/{id}/conservation-assessments"
    description: "List assessments of an item (FK reverse-reachability)"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "ConservationAssessment[]"
    side_effects: []
  - method: POST
    path: "/conservation-assessments/{id}/approve"
    description: "Approve a draft assessment; computes the confirmed score and publishes it to the item"
    roles: [Archivist]
    code: 200
    input: []
    output: ConservationAssessment
    side_effects: ["status := APPROVED; confirmed_priority_score computed; item.conservation_priority_score := confirmed score"]
  - method: POST
    path: "/conservation-assessments/{id}/begin-treatment"
    description: "Start treatment: assessment APPROVED -> IN_TREATMENT; item FLAGGED_CONSERVATION -> IN_TREATMENT"
    roles: [Archivist]
    code: 200
    input: []
    output: ConservationAssessment
    side_effects: ["assessment.status := IN_TREATMENT; item.status := IN_TREATMENT"]
  - method: POST
    path: "/conservation-assessments/{id}/complete-treatment"
    description: "Finish treatment: assessment IN_TREATMENT -> COMPLETED; item IN_TREATMENT -> AVAILABLE with new condition grade"
    roles: [Archivist]
    code: 200
    input: [new_condition_grade]
    output: ConservationAssessment
    side_effects: ["assessment.status := COMPLETED; item.status := AVAILABLE; item.condition_grade := new_condition_grade; item.conservation_priority_score := null; item.current_assessment_id := null"]

  # --- FindingAid ---
  - method: POST
    path: "/finding-aids"
    description: "Create a finding aid for a collection"
    roles: [Archivist]
    code: 201
    input: [collection_id, title, summary, "scope_note?"]
    output: FindingAid
    side_effects: ["collection must be ACTIVE else ERR_INVALID_STATE; status := DRAFT"]
  - method: GET
    path: "/finding-aids"
    description: "List finding aids; collection_id filter doubles as FK reverse view"
    roles: *all_roles
    code: 200
    input: ["collection_id?", "status?", "limit?", "offset?"]
    output: "FindingAid[]"
    side_effects: []
  - method: GET
    path: "/finding-aids/{id}"
    description: "Get one finding aid"
    roles: *all_roles
    code: 200
    input: []
    output: FindingAid
    side_effects: []
  - method: POST
    path: "/finding-aids/{id}/submit-review"
    description: "DRAFT or IN_REVISION -> IN_REVIEW; stamps review_origin with the source state"
    roles: [Archivist]
    code: 200
    input: []
    output: FindingAid
    side_effects: ["status := IN_REVIEW; review_origin := prior state"]
  - method: POST
    path: "/finding-aids/{id}/publish"
    description: "IN_REVIEW -> PUBLISHED; updates collection rollup"
    roles: [Archivist]
    code: 200
    input: []
    output: FindingAid
    side_effects: ["status := PUBLISHED; published_revision_count += 1; published_at := now; collection.published_finding_aid_present recomputed"]
  - method: POST
    path: "/finding-aids/{id}/return"
    description: "IN_REVIEW -> review_origin (DRAFT or IN_REVISION) — return routing depends on stamped origin"
    roles: [Archivist]
    code: 200
    input: []
    output: FindingAid
    side_effects: ["status := review_origin; review_origin := null"]
  - method: POST
    path: "/finding-aids/{id}/open-revision"
    description: "PUBLISHED -> IN_REVISION; collection rollup drops if this was the only published aid"
    roles: [Archivist]
    code: 200
    input: []
    output: FindingAid
    side_effects: ["status := IN_REVISION; collection.published_finding_aid_present recomputed"]

  # --- VolunteerProject ---
  - method: POST
    path: "/volunteer-projects"
    description: "Create a volunteer processing project"
    roles: [VolunteerCoordinator]
    code: 201
    input: [name, "description?", "max_hours_per_volunteer?"]
    output: VolunteerProject
    side_effects: ["status := PLANNED; volunteer_hours := {}; hours_logged_total := 0; active_ticket_count := 0"]
  - method: GET
    path: "/volunteer-projects"
    description: "List volunteer projects"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "VolunteerProject[]"
    side_effects: []
  - method: GET
    path: "/volunteer-projects/{id}"
    description: "Get one volunteer project"
    roles: *all_roles
    code: 200
    input: []
    output: VolunteerProject
    side_effects: []
  - method: POST
    path: "/volunteer-projects/{id}/activate"
    description: "PLANNED -> ACTIVE"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: VolunteerProject
    side_effects: ["status := ACTIVE"]
  - method: POST
    path: "/volunteer-projects/{id}/close"
    description: "ACTIVE -> CLOSED; blocked while any ticket is active"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: VolunteerProject
    side_effects: ["status := CLOSED (requires active_ticket_count == 0 else ERR_ACTIVE_TICKETS_REMAIN)"]

  # --- DigitizationTicket ---
  - method: POST
    path: "/volunteer-projects/{id}/tickets"
    description: "Queue a digitization ticket for an item under a project"
    roles: [VolunteerCoordinator]
    code: 201
    input: [item_id]
    output: DigitizationTicket
    side_effects:
      - "project.status must be IN {PLANNED, ACTIVE} else ERR_INVALID_STATE"
      - "item.status must be AVAILABLE else ERR_ITEM_NOT_AVAILABLE"
      - "priority_score computed per digitization_priority_score and frozen"
  - method: GET
    path: "/digitization-tickets"
    description: "List tickets; project_id/item_id filters double as FK reverse views"
    roles: *all_roles
    code: 200
    input: ["project_id?", "item_id?", "status?", "limit?", "offset?"]
    output: "DigitizationTicket[]"
    side_effects: []
  - method: GET
    path: "/digitization-tickets/{id}"
    description: "Get one ticket"
    roles: *all_roles
    code: 200
    input: []
    output: DigitizationTicket
    side_effects: []
  - method: POST
    path: "/volunteer-projects/{id}/tickets/claim-next"
    description: "Selector policy: claim the highest-priority claimable ticket. Pool: project's QUEUED tickets whose item.status == AVAILABLE. Rank: priority_score DESC; tie-break: created_at ASC. Empty pool -> ERR_NO_CLAIMABLE_TICKETS."
    roles: [Volunteer]
    code: 200
    input: []
    output: DigitizationTicket
    side_effects:
      - "project.status must be ACTIVE else ERR_INVALID_STATE"
      - "selected ticket -> CLAIMED with claimed_by_user_id := caller X-User-ID; project.active_ticket_count += 1"
  - method: POST
    path: "/digitization-tickets/{id}/begin-capture"
    description: "CLAIMED -> IN_CAPTURE (claimant only)"
    roles: [Volunteer]
    code: 200
    input: []
    output: DigitizationTicket
    side_effects: ["status := IN_CAPTURE"]
  - method: POST
    path: "/digitization-tickets/{id}/submit-qc"
    description: "IN_CAPTURE -> QC_REVIEW (claimant only)"
    roles: [Volunteer]
    code: 200
    input: []
    output: DigitizationTicket
    side_effects: ["status := QC_REVIEW"]
  - method: POST
    path: "/digitization-tickets/{id}/qc-pass"
    description: "QC_REVIEW -> COMPLETE; reviewer must differ from claimant (ERR_QC_SELF_REVIEW)"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: DigitizationTicket
    side_effects: ["status := COMPLETE; project.active_ticket_count -= 1"]
  - method: POST
    path: "/digitization-tickets/{id}/qc-fail"
    description: "QC_REVIEW -> IN_CAPTURE (fail loop); reviewer must differ from claimant"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: DigitizationTicket
    side_effects: ["status := IN_CAPTURE; qc_fail_count += 1"]
  - method: POST
    path: "/digitization-tickets/{id}/release"
    description: "CLAIMED/IN_CAPTURE -> QUEUED; releases the claim (compensating action)"
    roles: [Volunteer]
    code: 200
    input: []
    output: DigitizationTicket
    side_effects: ["status := QUEUED; claimed_by_user_id := null; project.active_ticket_count -= 1"]
  - method: POST
    path: "/digitization-tickets/{id}/log-hours"
    description: "Log work hours on a claimed/capturing ticket; enforces the project's per-volunteer hour cap"
    roles: [Volunteer]
    code: 200
    input: [hours]
    output: DigitizationTicket
    side_effects:
      - "ticket.status must be IN {CLAIMED, IN_CAPTURE} else ERR_INVALID_STATE"
      - "caller must be ticket.claimed_by_user_id else ERR_OWNERSHIP_MISMATCH"
      - "hours must be a positive multiple of 0.25 else ERR_INVALID_REQUEST"
      - "project.volunteer_hours[caller] + hours > project.max_hours_per_volunteer -> ERR_VOLUNTEER_HOUR_CAP_EXCEEDED (== cap allowed)"
      - "ticket.hours_logged += hours; project.hours_logged_total += hours; project.volunteer_hours[caller] += hours"
  - method: POST
    path: "/digitization-tickets/{id}/cancel"
    description: "Cancel a non-terminal ticket"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: DigitizationTicket
    side_effects: ["status := CANCELLED; active_ticket_count decremented if the ticket was active"]

  # --- Researcher ---
  - method: POST
    path: "/researchers"
    description: "Register a researcher (staff-assisted registration at the reading-room desk)"
    roles: [ReadingRoomStaff]
    code: 201
    input: [full_name, email, "affiliation?"]
    output: Researcher
    side_effects: ["status := ACTIVE; no_show_strikes := 0; total_charged_cents := 0; duplicate email -> ERR_DUPLICATE_EMAIL"]
  - method: GET
    path: "/researchers"
    description: "List researchers"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Researcher[]"
    side_effects: []
  - method: GET
    path: "/researchers/{id}"
    description: "Get one researcher"
    roles: *all_roles
    code: 200
    input: []
    output: Researcher
    side_effects: []
  - method: POST
    path: "/researchers/{id}/reinstate"
    description: "Reinstate a SUSPENDED researcher (strike history retained)"
    roles: [ReadingRoomStaff]
    code: 200
    input: []
    output: Researcher
    side_effects: ["status := ACTIVE"]

  # --- ResearchRequest ---
  - method: POST
    path: "/research-requests"
    description: "Researcher submits a request over a set of items"
    roles: [Researcher]
    code: 201
    input: [item_ids, topic, purpose]
    output: ResearchRequest
    side_effects:
      - "researcher_id := caller X-User-ID; caller must be ACTIVE else ERR_RESEARCHER_SUSPENDED"
      - "1..10 item_ids else ERR_TOO_MANY_ITEMS / ERR_INVALID_REQUEST; duplicates -> ERR_INVALID_REQUEST"
      - "every referenced item must exist (ERR_NOT_FOUND) and have status == AVAILABLE else ERR_ITEM_NOT_AVAILABLE (first offending id in item_ids order is reported)"
      - "status := SUBMITTED"
  - method: GET
    path: "/research-requests"
    description: "List research requests"
    roles: *all_roles
    code: 200
    input: ["researcher_id?", "status?", "limit?", "offset?"]
    output: "ResearchRequest[]"
    side_effects: []
  - method: GET
    path: "/research-requests/{id}"
    description: "Get one research request"
    roles: *all_roles
    code: 200
    input: []
    output: ResearchRequest
    side_effects: []
  - method: POST
    path: "/research-requests/{id}/begin-review"
    description: "SUBMITTED -> IN_REVIEW"
    roles: [ReadingRoomStaff]
    code: 200
    input: []
    output: ResearchRequest
    side_effects: ["status := IN_REVIEW"]
  - method: POST
    path: "/research-requests/{id}/approve"
    description: "IN_REVIEW -> APPROVED"
    roles: [ReadingRoomStaff]
    code: 200
    input: []
    output: ResearchRequest
    side_effects: ["status := APPROVED"]
  - method: POST
    path: "/research-requests/{id}/deny"
    description: "IN_REVIEW -> DENIED"
    roles: [ReadingRoomStaff]
    code: 200
    input: ["decision_reason?"]
    output: ResearchRequest
    side_effects: ["status := DENIED; decision_reason stored"]
  - method: POST
    path: "/research-requests/{id}/cancel"
    description: "Researcher cancels own SUBMITTED/IN_REVIEW request"
    roles: [Researcher]
    code: 200
    input: []
    output: ResearchRequest
    side_effects: ["status := CANCELLED"]

  # --- ReadingRoomAppointment ---
  - method: POST
    path: "/reading-room-appointments"
    description: "Book a reading-room slot against an APPROVED request the caller owns"
    roles: [Researcher]
    code: 201
    input: [research_request_id, room_code, scheduled_date, start_time, end_time, "seats?"]
    output: ReadingRoomAppointment
    side_effects:
      - "request must be APPROVED (ERR_REQUEST_NOT_APPROVED) and owned by caller (ERR_REQUEST_OWNERSHIP_MISMATCH)"
      - "caller must be ACTIVE (ERR_RESEARCHER_SUSPENDED)"
      - "no request item may be FRAGILE (ERR_ITEM_TOO_FRAGILE); every request item must be AVAILABLE (ERR_ITEM_NOT_AVAILABLE)"
      - "start must be strictly in the future (ERR_APPOINTMENT_IN_PAST); start_time < end_time else ERR_INVALID_REQUEST"
      - "seat_occupancy must admit the booking (ERR_APPOINTMENT_CAPACITY_EXCEEDED); no request item may already sit on a CONFIRMED appointment that date (ERR_ITEM_DOUBLE_BOOKED)"
      - "status := CONFIRMED; researcher_id := caller X-User-ID"
  - method: GET
    path: "/reading-room-appointments"
    description: "List appointments"
    roles: *all_roles
    code: 200
    input: ["researcher_id?", "research_request_id?", "scheduled_date?", "room_code?", "status?", "limit?", "offset?"]
    output: "ReadingRoomAppointment[]"
    side_effects: []
  - method: GET
    path: "/reading-room-appointments/{id}"
    description: "Get one appointment"
    roles: *all_roles
    code: 200
    input: []
    output: ReadingRoomAppointment
    side_effects: []
  - method: POST
    path: "/reading-room-appointments/{id}/check-in"
    description: "CONFIRMED -> CHECKED_IN"
    roles: [ReadingRoomStaff]
    code: 200
    input: []
    output: ReadingRoomAppointment
    side_effects: ["status := CHECKED_IN"]
  - method: POST
    path: "/reading-room-appointments/{id}/complete"
    description: "CHECKED_IN -> COMPLETED"
    roles: [ReadingRoomStaff]
    code: 200
    input: []
    output: ReadingRoomAppointment
    side_effects: ["status := COMPLETED"]
  - method: POST
    path: "/reading-room-appointments/{id}/record-no-show"
    description: "CONFIRMED -> NO_SHOW after the slot has ended; recomputes strikes and may suspend the researcher"
    roles: [ReadingRoomStaff]
    code: 200
    input: []
    output: ReadingRoomAppointment
    side_effects:
      - "status := NO_SHOW (requires logical now >= end datetime else ERR_APPOINTMENT_NOT_ENDED)"
      - "no_show_strikes recomputed; if >= 3 and researcher ACTIVE -> researcher SUSPENDED and future CONFIRMED appointments CANCELLED"
  - method: POST
    path: "/reading-room-appointments/{id}/cancel"
    description: "Researcher cancels own CONFIRMED/NEEDS_RESCHEDULE appointment; releases seats"
    roles: [Researcher]
    code: 200
    input: []
    output: ReadingRoomAppointment
    side_effects: ["status := CANCELLED; seats released"]
  - method: POST
    path: "/reading-room-appointments/{id}/reschedule"
    description: "NEEDS_RESCHEDULE -> CONFIRMED with a new slot; re-validates item availability, capacity, double-booking, and future-start"
    roles: [Researcher]
    code: 200
    input: [scheduled_date, start_time, end_time]
    output: ReadingRoomAppointment
    side_effects: ["status := CONFIRMED with the new interval (all creation-time temporal/constraint checks re-run)"]

  # --- ReproductionOrder ---
  - method: POST
    path: "/reproduction-orders"
    description: "Researcher orders reproductions of items on an own APPROVED request; quote computed at creation"
    roles: [Researcher]
    code: 201
    input: [research_request_id, item_ids, format, page_estimate, "license_class?", "rush?"]
    output: ReproductionOrder
    side_effects:
      - "request must be APPROVED (ERR_REQUEST_NOT_APPROVED) and owned by caller (ERR_REQUEST_OWNERSHIP_MISMATCH)"
      - "caller must be ACTIVE (ERR_RESEARCHER_SUSPENDED)"
      - "item_ids must be non-empty and a subset of the request's item_ids else ERR_ITEM_NOT_IN_REQUEST"
      - "for each item, resolve item.accession_id -> Accession.current_deed_id -> DeedOfGift (only status == EXECUTED): embargo_until > now -> ERR_EMBARGO_ACTIVE; reproduction_restricted == true -> ERR_DEED_REPRODUCTION_RESTRICTED; publication_license_required == true AND license_class == PERSONAL -> ERR_PUBLICATION_LICENSE_REQUIRED"
      - "quoted_fee_cents computed per reproduction_image_component + reproduction_order_total (quoted variant)"
      - "status := QUOTED; researcher_id := caller X-User-ID"
  - method: GET
    path: "/reproduction-orders"
    description: "List reproduction orders"
    roles: *all_roles
    code: 200
    input: ["researcher_id?", "research_request_id?", "status?", "limit?", "offset?"]
    output: "ReproductionOrder[]"
    side_effects: []
  - method: GET
    path: "/reproduction-orders/{id}"
    description: "Get one reproduction order"
    roles: *all_roles
    code: 200
    input: []
    output: ReproductionOrder
    side_effects: []
  - method: POST
    path: "/reproduction-orders/{id}/approve-quote"
    description: "Researcher accepts the quote: QUOTED -> APPROVED"
    roles: [Researcher]
    code: 200
    input: []
    output: ReproductionOrder
    side_effects: ["status := APPROVED"]
  - method: POST
    path: "/reproduction-orders/{id}/invoice"
    description: "Staff invoices with actual page count: APPROVED -> INVOICED (final fee variant; requote and quota gates)"
    roles: [ReadingRoomStaff]
    code: 200
    input: [actual_pages]
    output: ReproductionOrder
    side_effects:
      - "invoiced_fee_cents computed (invoiced variant) and stored"
      - "invoiced > floor(quoted * 1.10) -> ERR_REQUOTE_REQUIRED (order stays APPROVED)"
      - "actual_pages > quota_remaining -> ERR_REPRO_QUOTA_EXCEEDED; == remaining allowed"
      - "annual quota debited by actual_pages"
  - method: POST
    path: "/reproduction-orders/{id}/pay"
    description: "Researcher pays the invoice: INVOICED -> PAID; amount must equal invoiced_fee_cents exactly"
    roles: [Researcher]
    code: 200
    input: [amount_cents]
    output: ReproductionOrder
    side_effects: ["status := PAID; researcher.total_charged_cents += invoiced_fee_cents"]
  - method: POST
    path: "/reproduction-orders/{id}/deliver"
    description: "Staff delivers scans/prints: PAID -> DELIVERED; citation acknowledgment checked against the deeds current at delivery time"
    roles: [ReadingRoomStaff]
    code: 200
    input: [citation_acknowledgment_text]
    output: ReproductionOrder
    side_effects: ["status := DELIVERED"]
  - method: POST
    path: "/reproduction-orders/{id}/refund"
    description: "Staff refunds a paid order: PAID -> REFUNDED; researcher charge ledger compensated"
    roles: [ReadingRoomStaff]
    code: 200
    input: []
    output: ReproductionOrder
    side_effects: ["status := REFUNDED; researcher.total_charged_cents -= invoiced_fee_cents; quota debit retained (pinned)"]

  # --- DeaccessionProposal ---
  - method: POST
    path: "/deaccession-proposals"
    description: "Registrar drafts a deaccession proposal over a set of items"
    roles: [Registrar]
    code: 201
    input: [item_ids, justification, disposal_method]
    output: DeaccessionProposal
    side_effects:
      - "every referenced item must exist (ERR_NOT_FOUND) and have status != DEACCESSIONED else ERR_INVALID_STATE"
      - "proposed_by_user_id := caller X-User-ID; status := DRAFT"
  - method: GET
    path: "/deaccession-proposals"
    description: "List deaccession proposals"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DeaccessionProposal[]"
    side_effects: []
  - method: GET
    path: "/deaccession-proposals/{id}"
    description: "Get one proposal"
    roles: *all_roles
    code: 200
    input: []
    output: DeaccessionProposal
    side_effects: []
  - method: POST
    path: "/deaccession-proposals/{id}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [Registrar]
    code: 200
    input: []
    output: DeaccessionProposal
    side_effects: ["status := SUBMITTED"]
  - method: POST
    path: "/deaccession-proposals/{id}/send-to-board"
    description: "SUBMITTED -> BOARD_REVIEW"
    roles: [Registrar]
    code: 200
    input: []
    output: DeaccessionProposal
    side_effects: ["status := BOARD_REVIEW"]
  - method: POST
    path: "/deaccession-proposals/{id}/approve"
    description: "BOARD_REVIEW -> APPROVED; segregation of duties enforced; starts the 30-day cooling-off"
    roles: [BoardOfficer]
    code: 200
    input: []
    output: DeaccessionProposal
    side_effects: ["status := APPROVED; approved_by_user_id, approved_at stamped; finalize_not_before := approved_at + 30 days"]
  - method: POST
    path: "/deaccession-proposals/{id}/reject"
    description: "BOARD_REVIEW -> REJECTED (no SoD restriction on rejection)"
    roles: [BoardOfficer]
    code: 200
    input: []
    output: DeaccessionProposal
    side_effects: ["status := REJECTED"]
  - method: POST
    path: "/deaccession-proposals/{id}/withdraw"
    description: "DRAFT/SUBMITTED -> WITHDRAWN"
    roles: [Registrar]
    code: 200
    input: []
    output: DeaccessionProposal
    side_effects: ["status := WITHDRAWN"]
  - method: POST
    path: "/deaccession-proposals/{id}/finalize"
    description: "COOLED_OFF -> FINALIZED; fires the item -> request -> appointment cascade, ticket/order fan-out, collection bubble-up, and proceeds calculation"
    roles: [Registrar]
    code: 200
    input: ["hammer_prices?"]
    output: DeaccessionProposal
    side_effects:
      - "if status == APPROVED and logical now < finalize_not_before -> ERR_COOLING_OFF_NOT_ELAPSED (see validations priority 9)"
      - "SALE requires hammer_prices covering every proposed item exactly once else ERR_HAMMER_PRICE_MISSING; proceeds_cents computed (per-item rounding then sum)"
      - "full cascade per DeaccessionProposal state machine (items DEACCESSIONED; requests DENIED; their appointments CANCELLED; tickets CANCELLED; QUOTED/APPROVED orders CANCELLED; empty collections DEACCESSIONED with finding aids RETIRED)"

  # --- OralHistoryRecording ---
  - method: POST
    path: "/oral-histories"
    description: "Schedule an oral-history recording session (studio booked with turnaround buffer)"
    roles: [Archivist]
    code: 201
    input: [collection_id, narrator_name, interviewer_name, recording_room_id, session_start, session_end]
    output: OralHistoryRecording
    side_effects:
      - "session_start < session_end else ERR_INVALID_REQUEST"
      - "recording_studio_conflict must find no conflict else ERR_RECORDING_ROOM_CONFLICT"
      - "status := SCHEDULED; release_status := PENDING"
  - method: GET
    path: "/oral-histories"
    description: "List oral histories; collection_id filter doubles as FK reverse view"
    roles: *all_roles
    code: 200
    input: ["collection_id?", "status?", "limit?", "offset?"]
    output: "OralHistoryRecording[]"
    side_effects: []
  - method: GET
    path: "/oral-histories/{id}"
    description: "Get one oral history"
    roles: *all_roles
    code: 200
    input: []
    output: OralHistoryRecording
    side_effects: []
  - method: POST
    path: "/oral-histories/{id}/mark-recorded"
    description: "SCHEDULED -> RECORDED"
    roles: [Archivist]
    code: 200
    input: []
    output: OralHistoryRecording
    side_effects: ["status := RECORDED"]
  - method: POST
    path: "/oral-histories/{id}/submit-transcript"
    description: "RECORDED -> TRANSCRIBED"
    roles: [Archivist]
    code: 200
    input: []
    output: OralHistoryRecording
    side_effects: ["status := TRANSCRIBED"]
  - method: POST
    path: "/oral-histories/{id}/send-to-review"
    description: "TRANSCRIBED -> IN_REVIEW"
    roles: [Archivist]
    code: 200
    input: []
    output: OralHistoryRecording
    side_effects: ["status := IN_REVIEW"]
  - method: POST
    path: "/oral-histories/{id}/return-to-transcription"
    description: "IN_REVIEW -> TRANSCRIBED (review loop)"
    roles: [Archivist]
    code: 200
    input: []
    output: OralHistoryRecording
    side_effects: ["status := TRANSCRIBED"]
  - method: POST
    path: "/oral-histories/{id}/release-forms/sign"
    description: "Record the narrator's signed release: release_status PENDING -> SIGNED; optional embargo recorded"
    roles: [Archivist]
    code: 200
    input: [signed_by_narrator_name, "embargo_until?"]
    output: OralHistoryRecording
    side_effects: ["release_status := SIGNED; release_signed_at := now; embargo_until stored"]
  - method: POST
    path: "/oral-histories/{id}/release-forms/decline"
    description: "Record the narrator's refusal: release_status PENDING -> DECLINED"
    roles: [Archivist]
    code: 200
    input: []
    output: OralHistoryRecording
    side_effects: ["release_status := DECLINED"]
  - method: POST
    path: "/oral-histories/{id}/publish-release"
    description: "IN_REVIEW -> RELEASED; requires SIGNED release and lapsed embargo"
    roles: [Archivist]
    code: 200
    input: []
    output: OralHistoryRecording
    side_effects: ["status := RELEASED"]
  - method: POST
    path: "/oral-histories/{id}/cancel"
    description: "Cancel a non-terminal recording"
    roles: [Archivist]
    code: 200
    input: []
    output: OralHistoryRecording
    side_effects: ["status := CANCELLED"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Caller role is not in the endpoint's roles list" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, out-of-range scalar, duplicate array entries, start >= end, hours not a positive multiple of 0.25, etc." }
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "limit outside 1..100 or offset < 0" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path or body-referenced resource id does not exist (message names the resource type)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's state forbids the operation (covers per-machine wrong-from-state and collection-not-ACTIVE gates)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_ACCESSION_NOT_ACCESSIONED, http: 409, condition: "Operation requires the item's accession to be ACCESSIONED (or the deed's accession to be PENDING_DEED/AMENDMENT_PENDING — state gate on the accession)" }
  - { id: ERR_FINDING_AID_NOT_PUBLISHED, http: 409, condition: "make-available requires the collection to have a PUBLISHED finding aid" }
  - { id: ERR_ZONE_RESTRICTED, http: 409, condition: "make-available requires the collection's zone posture == OPEN" }
  - { id: ERR_ITEM_NOT_AVAILABLE, http: 409, condition: "Referenced item does not have status == AVAILABLE (request create, ticket create, reschedule)" }
  - { id: ERR_REQUEST_NOT_APPROVED, http: 409, condition: "Referenced research request is not APPROVED" }
  - { id: ERR_RESEARCHER_SUSPENDED, http: 409, condition: "The researcher is SUSPENDED" }
  - { id: ERR_ITEM_TOO_FRAGILE, http: 409, condition: "A request item has condition_grade == FRAGILE; it cannot be pulled to the reading room" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Deaccession approver X-User-ID equals proposed_by_user_id" }
  - { id: ERR_QC_SELF_REVIEW, http: 409, condition: "QC reviewer X-User-ID equals the ticket's claimed_by_user_id" }
  - { id: ERR_EMBARGO_ACTIVE, http: 409, condition: "A current EXECUTED deed covering an ordered item has embargo_until > logical now" }
  - { id: ERR_DEED_REPRODUCTION_RESTRICTED, http: 409, condition: "A current EXECUTED deed covering an ordered item sets reproduction_restricted == true" }
  - { id: ERR_PUBLICATION_LICENSE_REQUIRED, http: 409, condition: "A current EXECUTED deed requires a publication license; license_class == PERSONAL is insufficient" }
  - { id: ERR_RELEASE_FORM_MISSING, http: 409, condition: "publish-release requires release_status == SIGNED" }
  - { id: ERR_ORAL_HISTORY_EMBARGOED, http: 409, condition: "publish-release while embargo_until > logical now" }
  - { id: ERR_CITATION_MISMATCH, http: 422, condition: "Delivery citation_acknowledgment_text does not contain a current deed's required_citation_text verbatim" }
  - { id: ERR_APPOINTMENT_IN_PAST, http: 422, condition: "Appointment start (scheduled_date + start_time UTC) is not strictly in the future" }
  - { id: ERR_APPOINTMENT_NOT_ENDED, http: 409, condition: "record-no-show before the appointment's end datetime" }
  - { id: ERR_COOLING_OFF_NOT_ELAPSED, http: 409, condition: "finalize while proposal is APPROVED and logical now < finalize_not_before" }
  - { id: ERR_APPOINTMENT_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping seat total would exceed room capacity (rejection at occupied + seats > capacity)" }
  - { id: ERR_ITEM_DOUBLE_BOOKED, http: 409, condition: "A request item already appears on another CONFIRMED appointment on the same scheduled_date" }
  - { id: ERR_RECORDING_ROOM_CONFLICT, http: 409, condition: "Studio session conflicts with an existing non-cancelled session including the 30-minute turnaround buffer" }
  - { id: ERR_COLLECTION_CODE_EXISTS, http: 409, condition: "collection_code already in use" }
  - { id: ERR_ZONE_CODE_EXISTS, http: 409, condition: "zone_code already in use" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "researcher email already registered" }
  - { id: ERR_COLLECTION_CYCLE, http: 422, condition: "parent_collection_id would create a cycle (self or descendant)" }
  - { id: ERR_TOO_MANY_ITEMS, http: 422, condition: "ResearchRequest carries more than 10 item_ids" }
  - { id: ERR_VOLUNTEER_HOUR_CAP_EXCEEDED, http: 409, condition: "log-hours would push the volunteer's project hours strictly above max_hours_per_volunteer" }
  - { id: ERR_NO_CLAIMABLE_TICKETS, http: 409, condition: "claim-next pool is empty (no QUEUED ticket with an AVAILABLE item)" }
  - { id: ERR_ACTIVE_TICKETS_REMAIN, http: 409, condition: "Project close while active_ticket_count > 0" }
  - { id: ERR_ITEMS_IN_TREATMENT, http: 409, condition: "Deaccession approve/finalize while a proposed item is IN_TREATMENT" }
  - { id: ERR_NARRATOR_MISMATCH, http: 400, condition: "signed_by_narrator_name does not exactly equal the recording's narrator_name" }
  - { id: ERR_REQUEST_OWNERSHIP_MISMATCH, http: 403, condition: "Appointment/order references a research request owned by a different researcher" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Caller is not the owner of the target resource (researcher cancel, volunteer ticket actions)" }
  - { id: ERR_ITEM_NOT_IN_REQUEST, http: 422, condition: "Reproduction-order item_ids is not a subset of the request's item_ids (or is empty)" }
  - { id: ERR_REPRO_QUOTA_EXCEEDED, http: 402, condition: "Invoice actual_pages exceeds the researcher's remaining annual page quota" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 402, condition: "pay amount_cents != invoiced_fee_cents" }
  - { id: ERR_REQUOTE_REQUIRED, http: 409, condition: "invoiced_fee_cents would exceed floor(quoted_fee_cents * 1.10)" }
  - { id: ERR_HAMMER_PRICE_MISSING, http: 422, condition: "SALE finalize without exactly one hammer price per proposed item" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: Registrar
    description: "Collections registrar — legal custody: accessions, deeds of gift, deaccession proposals, collections, zones"
    identity: opaque
    exclusive_operations:
      - "POST /collections; POST /storage-zones"
      - "POST /accessions; POST /accessions/{id}/submit|amend|withdraw"
      - "POST /accessions/{id}/deeds; POST /deeds/{id}/execute|void"
      - "POST /deaccession-proposals; POST /deaccession-proposals/{id}/submit|send-to-board|withdraw|finalize"
    shared_operations: ["all GET endpoints"]
  - name: BoardOfficer
    description: "Board officer — votes on deaccession proposals; segregation of duties vs the proposing Registrar"
    identity: opaque
    exclusive_operations:
      - "POST /deaccession-proposals/{id}/approve; POST /deaccession-proposals/{id}/reject"
    shared_operations: ["all GET endpoints"]
  - name: Archivist
    description: "Processing archivist — items, cataloging, finding aids, conservation assessments, oral histories"
    identity: opaque
    exclusive_operations:
      - "POST /items; POST /items/{id}/catalog|make-available|flag-conservation"
      - "POST /items/{id}/conservation-assessments; POST /conservation-assessments/{id}/approve|begin-treatment|complete-treatment"
      - "POST /finding-aids; POST /finding-aids/{id}/submit-review|publish|return|open-revision"
      - "POST /oral-histories; POST /oral-histories/{id}/mark-recorded|submit-transcript|send-to-review|return-to-transcription|publish-release|cancel; POST /oral-histories/{id}/release-forms/sign|decline"
    shared_operations: ["all GET endpoints", "POST /storage-zones/{id}/readings (shared with SystemAdmin)"]
  - name: ReadingRoomStaff
    description: "Public-services staff — researcher registration, request triage, appointment handling, reproduction invoicing/delivery/refunds"
    identity: opaque
    exclusive_operations:
      - "POST /researchers; POST /researchers/{id}/reinstate"
      - "POST /research-requests/{id}/begin-review|approve|deny"
      - "POST /reading-room-appointments/{id}/check-in|complete|record-no-show"
      - "POST /reproduction-orders/{id}/invoice|deliver|refund"
    shared_operations: ["all GET endpoints"]
  - name: Researcher
    description: "Registered researcher — submits requests, books appointments, orders reproductions; acts only on own resources"
    identity: "entity_backed:Researcher"
    exclusive_operations:
      - "POST /research-requests; POST /research-requests/{id}/cancel"
      - "POST /reading-room-appointments; POST /reading-room-appointments/{id}/cancel|reschedule"
      - "POST /reproduction-orders; POST /reproduction-orders/{id}/approve-quote|pay"
    shared_operations: ["all GET endpoints"]
  - name: VolunteerCoordinator
    description: "Volunteer program coordinator — projects, ticket queue management, QC review (never self-review)"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-projects; POST /volunteer-projects/{id}/activate|close"
      - "POST /volunteer-projects/{id}/tickets; POST /digitization-tickets/{id}/qc-pass|qc-fail|cancel"
    shared_operations: ["all GET endpoints"]
  - name: Volunteer
    description: "Volunteer digitization worker — claims tickets, captures images, logs hours; X-User-ID is an operator id recorded as claimed_by_user_id"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-projects/{id}/tickets/claim-next"
      - "POST /digitization-tickets/{id}/begin-capture|submit-qc|release|log-hours"
    shared_operations: ["all GET endpoints"]
  - name: SystemAdmin
    description: "System operator — logical clock and sensor-feed ingestion"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints", "POST /storage-zones (shared with Registrar)", "POST /storage-zones/{id}/readings (shared with Archivist)"]
