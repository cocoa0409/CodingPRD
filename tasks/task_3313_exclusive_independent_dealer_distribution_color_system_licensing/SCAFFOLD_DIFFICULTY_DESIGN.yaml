              payload: { performed_on: "${clock_now}", result: "PASS" }
              as: EquipmentTech
            - call: "POST /dealer-network/orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", units: 40, purpose: "INITIAL_STOCK" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
