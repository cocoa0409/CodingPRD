            - "${expired_at_boundary} == 0: at exactly 2026-08-21T00:00:00Z the deadline is not strictly passed, so ScreeningRequest.${sr_id}.status is still WAITLISTED with waitlist_position 1"
            - "${expired_after_boundary} == 1 and ScreeningRequest.${sr_id}.status == EXPIRED with waitlist_position == null"
            - "${restaffed} == 0: a WAITLISTED request never counted toward active_caseload_count, so StaffMember.${adv_id}.secondary_trauma_index stays 0.0 and wellness_posture stays OPEN"

