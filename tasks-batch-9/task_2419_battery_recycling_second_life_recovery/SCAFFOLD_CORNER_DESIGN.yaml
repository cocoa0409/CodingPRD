          - roles.IntakeClerk
          - roles.PlantOperator
          - roles.ComplianceOfficer
          - roles.TriageEngineer
          - roles.AssayTechnician
          - roles.SettlementAccountant
          - roles.CertificationOfficer
        distinguishing_aspect: "Nine roles hand one shipment down the line and every exclusive operation succeeds under exactly its owning role - no single role can complete the workflow alone, and each hand-off is a different role acting on a row created by the previous one."
