              payload: { requested_qty_cases: 50 }
              as: WholesalerPrincipal
              as_user_id: "${wcl_id}"
            - call: "POST /allocation-events/${evc2_id}/lock"
              payload: {}
              as: BrewerAdmin
          trigger:
            - call: "POST /allocation-events/${evc2_id}/assignments/${wcl_id}/decision"
              payload: { decision: "CONFIRM" }
              as: WholesalerPrincipal
              as_user_id: "${wcl_id}"
              captures: { evc2_status: $.data.status }
          assert:
            - "evc2_status == CLOSED (pending_qty reached 0 in the same request)"
            - "AllocationEvent.${evc2_id}: committed_qty == 40, pending_qty == 0, unassigned_remainder == 60; the ${wcl_id} assignment is CONFIRMED with assigned_qty == 40"

      - name: review_dispute_branch_and_terminal_lockdown
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PerformanceReview.PUBLISHED_to_DISPUTED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "The DISPUTE branch requires dispute_reason and lands in terminal DISPUTED; a second response of either action is then rejected, proving both PUBLISHED branches are terminal."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
