              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id }
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: DocumentationEngineer
              captures: { mv1: $.data.version }
            - call: "POST /repair-program/manual-revisions"
              payload: { model_id: "${model_id}", doc_type: "DISASSEMBLY_GUIDE", covered_part_skus: ["SKU-LATER-1"], safety_warning_count: 2, expected_model_version: "${mv1}" }
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
              captures: { revision_id: $.data.id }
            - call: "POST /repair-program/manual-revisions/${revision_id}/submit"
              payload: {}
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
            - call: "POST /repair-program/product-models/${model_id}/end-production"
              payload: { end_of_production_date: "2024-06-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/product-models/${model_id}/end-support"
              payload: { support_end_date: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
          trigger:
            - call: "POST /repair-program/manual-revisions/${revision_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "content is fine but the model is retired" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "HTTP status == 409"
            - "ManualRevision.${revision_id}.status == IN_REVIEW (unchanged)"
            - "ManualRevision.${revision_id}.reviewed_by_user_id IS NULL"
            - "ManualRevision.${revision_id}.coverage_gap_sku_count == 0 (the refusal is not a coverage gap)"
            - "ProductModel.${model_id}.support_state == SUPPORT_ENDED"

