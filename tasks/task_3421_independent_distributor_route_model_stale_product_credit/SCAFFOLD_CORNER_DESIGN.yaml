          - errors.ERR_DISTRIBUTOR_NOT_FOUND
        distinguishing_aspect: "POST /agreements declares territory_id before distributor_id before bakery_id; with both territory and distributor ids unknown the 404 is ERR_TERRITORY_NOT_FOUND, and fixing only the territory flips the error to ERR_DISTRIBUTOR_NOT_FOUND."
        test_recipe:
          setup: ["One LISTED territory and one distributor exist; clock 2026-09-01."]
