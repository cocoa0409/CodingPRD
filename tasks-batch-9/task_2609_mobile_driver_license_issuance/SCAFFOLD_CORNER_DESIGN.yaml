      - name: duplicate_certificate_serial_for_the_same_verifier_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_READER_APP]
          - validations[priority 23]
          - entities.ReaderApp.fields.certificate_serial
        distinguishing_aspect: "Registering a second reader app that reuses certificate_serial SER-A1 under a DIFFERENT app_identifier returns 409 ERR_DUPLICATE_READER_APP: uniqueness is on (verifier_id, certificate_serial), and because app_identifier differs the 24-hour renewal-buffer rule at priority 22 does not fire first."
        test_recipe:
          setup:
            - "One APPROVED verifier with one reader app registered as app_identifier till-a / certificate_serial SER-A1."
          setup_api_calls:
            - call: "POST /mdl/verifiers"
              payload: { organization_name: "Prairie Cellars", category: "AGE_RESTRICTED_RETAIL", purpose_scope: ["family_name", "age_over_21"], retention_ceiling_days: 30 }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { verifier_id: "$.data.id" }
            - call: "POST /mdl/verifiers/${verifier_id}/trust-decision"
              payload: { decision: "APPROVE" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/reader-apps"
              payload: { verifier_id: "${verifier_id}", app_identifier: "till-a", certificate_serial: "SER-A1", cert_not_before: "2026-07-01T00:00:00Z", cert_not_after: "2027-07-01T00:00:00Z", requested_elements: ["family_name", "age_over_21"], base_rate_cents: 30 }
