  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: offer_activate_requires_live_show
        grounds:
          - validations[priority=9]
          - state_machines.FlashOffer.SCHEDULED_to_ACTIVE
          - state_machines.Show.READY_to_LIVE
          - errors[ERR_INVALID_SHOW_STATE]
        distinguishing_aspect: |
          Entity pair FlashOffer -> LineupSlot -> Show: the offer is SCHEDULED, inside
          its window and on a substantiated product, so every property of the offer
          itself is satisfiable, yet activation is refused with ERR_INVALID_SHOW_STATE
          because the Show two hops away is READY rather than LIVE; the identical call
          succeeds after go-live with no change to the offer.
        test_recipe:
          setup:
            - "Show READY (never taken live), clock 2026-08-10T18:10:00Z which is inside the offer window 18:00-19:00Z."
            - "FlashOffer SCHEDULED at 3500 cents on a SUBSTANTIATED product."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_live
          trigger:
            - call: "POST /flash-offers/${o1}/activate"
              payload: {}
              as: MerchandisingManager
              captures: { err_show: $.data.error_id }
            - call: "POST /shows/${sh1}/go-live"
              payload: {}
              as: ShowProducer
            - call: "POST /flash-offers/${o1}/activate"
              payload: {}
              as: MerchandisingManager
          assert:
            - "First activate: HTTP 409 with ${err_show} == ERR_INVALID_SHOW_STATE"
            - "FlashOffer.${o1}.status == SCHEDULED and activated_at == null after the refusal"
            - "Show.${sh1}.status == LIVE and went_live_at == 2026-08-10T18:10:00Z after go-live"
            - "Second activate: HTTP 200, FlashOffer.${o1}.status == ACTIVE, activated_at == 2026-08-10T18:10:00Z, remaining_qty == 10"

      - name: booking_confirm_requires_certified_host
        grounds:
          - validations[priority=12]
          - state_machines.HostBooking.PENDING_to_CONFIRMED
          - entities.Host.fields.certification_status
          - entities.Host.fields.disclosure_certification_expires_at
          - errors[ERR_HOST_CERTIFICATION_EXPIRED]
        distinguishing_aspect: |
          Entity pair HostBooking -> Host, gated by a CLOCK-DERIVED status rather than a
          lifecycle state: the booking is PENDING and the actor owns it, but
          Host.certification_status has flipped to EXPIRED because
          disclosure_certification_expires_at 2026-08-05T00:00:00Z is behind the logical
          clock, so confirm returns ERR_HOST_CERTIFICATION_EXPIRED; re-certifying the
          Host row alone makes the same call succeed.
        test_recipe:
          setup:
            - "Host ada-vance certified only until 2026-08-05T00:00:00Z."
            - "A PENDING PRIMARY booking exists on a DRAFT show."
            - "Clock advanced to 2026-08-06T00:00:00Z, one day past the certification expiry."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - call: "POST /hosts/${h1}/disclosure-certifications"
              payload: { certified_until: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-cert-1"
            - *c_show
            - *c_booking
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /host-bookings/${b1}/confirm"
              payload: {}
              as: Host
              as_user_id: "${h1}"
              captures: { err_cert: $.data.error_id }
            - call: "POST /hosts/${h1}/disclosure-certifications"
              payload: { certified_until: "2026-12-31T23:59:59Z" }
              as: ComplianceOfficer
              as_user_id: "co-cert-1"
            - call: "POST /host-bookings/${b1}/confirm"
              payload: {}
              as: Host
              as_user_id: "${h1}"
          assert:
            - "Before the trigger: Host.${h1}.certification_status == EXPIRED"
            - "First confirm: HTTP 422 with ${err_cert} == ERR_HOST_CERTIFICATION_EXPIRED"
            - "HostBooking.${b1}.status == PENDING and confirmed_at == null after the refusal"
            - "After re-certification: Host.${h1}.certification_status == CERTIFIED and disclosure_certification_expires_at == 2026-12-31T23:59:59Z"
            - "Second confirm: HTTP 200, HostBooking.${b1}.status == CONFIRMED, confirmed_at == 2026-08-06T00:00:00Z"

      - name: cart_item_requires_active_offer
        grounds:
          - validations[priority=9]
          - state_machines.FlashOffer.SCHEDULED_to_ACTIVE
          - errors[ERR_OFFER_NOT_ACTIVE]
          - entities.CartItem.fields.state
        distinguishing_aspect: |
          Entity pair CartItem -> FlashOffer with the SHOW already LIVE, which isolates
          the offer's own status as the gate: adding a line against a SCHEDULED offer
          returns ERR_OFFER_NOT_ACTIVE (not ERR_INVALID_SHOW_STATE), and the same
          payload succeeds the instant the offer is activated — no cart, viewer or show
          attribute changes between the two attempts.
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z; the 3500-cent offer was never activated and is still SCHEDULED."
            - "Viewer 1 has an empty OPEN cart."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_prelive
            - *c_golive
            - *c_clock_live
            - *c_cart1
          trigger:
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 1 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { err_offer: $.data.error_id }
            - call: "POST /flash-offers/${o1}/activate"
              payload: {}
              as: MerchandisingManager
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 1 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itH: $.data.id }
          assert:
            - "First add: HTTP 409 with ${err_offer} == ERR_OFFER_NOT_ACTIVE"
            - "No CartItem row exists for Cart.${ct1}; Product.${p1}.reserved_qty == 0 and available_qty == 50"
            - "Second add: HTTP 201, CartItem.${itH}.state == HELD, effective_unit_price_cents == 3500, line_gross_cents == 3500, line_tax_cents == 306"
            - "Product.${p1}.reserved_qty == 1 and available_qty == 49; FlashOffer.${o1}.held_qty == 1 and remaining_qty == 9"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: host_booking_half_open_interval_with_buffer
        grounds:
          - validations[priority=14]
          - errors[ERR_HOST_BOOKING_OVERLAP]
          - state_machines.HostBooking.CONFIRMED_to_CANCELLED
          - entities.HostBooking.fields.status
        distinguishing_aspect: |
          Resource: the HOST (bookings collide across different shows). Interval
          semantics: half-open [call_time_at, release_time_at) expanded by a
          HOST_TURNAROUND_BUFFER_MIN = 45 minute buffer on BOTH sides, over rows with
          status in {PENDING, CONFIRMED}. Consequences: a booking starting exactly when
          another releases (20:30Z) is rejected despite zero raw intersection, a
          booking releasing exactly 45 minutes before the other starts (16:15Z vs
          17:00Z) is accepted, and cancelling the incumbent removes it from the
          candidate set so the previously rejected 20:30Z booking is then accepted.
        test_recipe:
          setup:
            - "Host ada-vance holds a PENDING booking on show 1: call 2026-08-10T17:00:00Z, release 2026-08-10T20:30:00Z."
            - "Two further shows exist to hang the competing bookings on."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_show
            - *c_booking
            - call: "POST /shows"
              payload: { title: "Late Silk", scheduled_start_at: "2026-08-10T21:30:00Z", scheduled_end_at: "2026-08-10T23:00:00Z" }
              as: ShowProducer
              captures: { sh2: $.data.id }
            - call: "POST /shows"
              payload: { title: "Morning Silk", scheduled_start_at: "2026-08-10T14:30:00Z", scheduled_end_at: "2026-08-10T16:00:00Z" }
              as: ShowProducer
              captures: { sh3: $.data.id }
          trigger:
            - call: "POST /host-bookings"
              payload: { show_id: "${sh2}", host_id: "${h1}", role: "PRIMARY", call_time_at: "2026-08-10T20:30:00Z", release_time_at: "2026-08-10T22:00:00Z", fee_cents: 30000 }
              as: ShowProducer
              captures: { err_touch: $.data.error_id }
            - call: "POST /host-bookings"
              payload: { show_id: "${sh3}", host_id: "${h1}", role: "PRIMARY", call_time_at: "2026-08-10T14:00:00Z", release_time_at: "2026-08-10T16:15:00Z", fee_cents: 20000 }
              as: ShowProducer
              captures: { b3: $.data.id }
            - call: "POST /host-bookings/${b1}/cancel"
              payload: { cancel_reason: "HOST_ILLNESS" }
              as: ShowProducer
            - call: "POST /host-bookings"
              payload: { show_id: "${sh2}", host_id: "${h1}", role: "PRIMARY", call_time_at: "2026-08-10T20:30:00Z", release_time_at: "2026-08-10T22:00:00Z", fee_cents: 30000 }
              as: ShowProducer
              captures: { b4: $.data.id }
          assert:
            - "Touching booking at 20:30:00Z is rejected: HTTP 422 with ${err_touch} == ERR_HOST_BOOKING_OVERLAP (buffer, not raw intersection)"
            - "Preceding booking releasing at 16:15:00Z is accepted: HTTP 201, HostBooking.${b3}.status == PENDING (16:15 + 45 min == 17:00, not < 17:00)"
            - "HostBooking.${b1}.status == CANCELLED and cancel_reason == HOST_ILLNESS after the cancel"
            - "DisclosureRecord rows of ${b1}: none exist in this instance, so no VOIDED cascade is observable"
            - "Replaying the 20:30:00Z booking after the cancel is accepted: HTTP 201, HostBooking.${b4}.status == PENDING, show_id == ${sh2}"

      - name: offer_window_closed_interval_per_product
        grounds:
          - validations[priority=15]
          - errors[ERR_OFFER_WINDOW_OVERLAP]
          - entities.FlashOffer.fields.window_start_at
          - entities.LineupSlot.fields.product_id
        distinguishing_aspect: |
          Resource: the PRODUCT (offers collide across shows through
          LineupSlot.product_id), and the interval semantics are the opposite of the
          host rule — a CLOSED interval [window_start_at, window_end_at] with ZERO
          buffer. Consequences: a second show's offer on the same product starting at
          the exact instant the first window ends (19:00:00Z) is rejected, one starting
          a minute later is accepted, and an offer on a DIFFERENT product may reuse the
          first window verbatim.
        test_recipe:
          setup:
            - "Show 1 has a SCHEDULED offer on SKU-ROBE with window 2026-08-10T18:00:00Z - 19:00:00Z."
            - "Show 2 (19:00-21:00Z) has its own lineup slot for the SAME product SKU-ROBE, plus a slot for SKU-SASH."
          setup_api_calls:
            - *c_clock_t0
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_slot
            - *c_offer
            - call: "POST /shows"
              payload: { title: "Silk Encore", scheduled_start_at: "2026-08-10T19:00:00Z", scheduled_end_at: "2026-08-10T21:00:00Z" }
              as: ShowProducer
              captures: { sh4: $.data.id }
            - call: "POST /lineup-slots"
              payload: { show_id: "${sh4}", product_id: "${p1}", slot_sequence: 1, planned_start_at: "2026-08-10T19:05:00Z", planned_end_at: "2026-08-10T19:35:00Z", planned_qty: 10 }
              as: MerchandisingManager
              captures: { sl4: $.data.id, sl4_v: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-SASH", title: "Silk Sash", base_price_cents: 2500, unit_cost_cents: 900, on_hand_qty: 40, claim_text: "Hand rolled hem" }
              as: MerchandisingManager
              captures: { p2: $.data.id }
            - call: "POST /products/${p2}/claim-substantiations"
              payload: { decision: "SUBSTANTIATED", evidence_ref: "LAB-89" }
              as: ComplianceOfficer
              as_user_id: "co-claims-1"
            - call: "POST /lineup-slots"
              payload: { show_id: "${sh4}", product_id: "${p2}", slot_sequence: 2, planned_start_at: "2026-08-10T19:40:00Z", planned_end_at: "2026-08-10T20:00:00Z", planned_qty: 10 }
              as: MerchandisingManager
              captures: { sl5: $.data.id, sl5_v: $.data.version }
          trigger:
            - call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl4}", offer_price_cents: 3400, window_start_at: "2026-08-10T19:00:00Z", window_end_at: "2026-08-10T19:30:00Z", max_qty: 5, expected_lineup_slot_version: "${sl4_v}" }
              as: MerchandisingManager
              captures: { err_window: $.data.error_id }
            - call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl4}", offer_price_cents: 3400, window_start_at: "2026-08-10T19:01:00Z", window_end_at: "2026-08-10T19:30:00Z", max_qty: 5, expected_lineup_slot_version: "${sl4_v}" }
              as: MerchandisingManager
              captures: { oI: $.data.id }
            - call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl5}", offer_price_cents: 2000, window_start_at: "2026-08-10T18:00:00Z", window_end_at: "2026-08-10T19:00:00Z", max_qty: 5, expected_lineup_slot_version: "${sl5_v}" }
              as: MerchandisingManager
              captures: { oJ: $.data.id }
          assert:
            - "Window starting exactly at 19:00:00Z on the same product is rejected: HTTP 422 with ${err_window} == ERR_OFFER_WINDOW_OVERLAP"
            - "Window starting at 19:01:00Z is accepted: HTTP 201, FlashOffer.${oI}.status == SCHEDULED, window_start_at == 2026-08-10T19:01:00Z, remaining_qty == 5"
            - "FlashOffer.${o1}.status == SCHEDULED and superseded_by_offer_id == null (a different lineup slot never supersedes)"
            - "The SKU-SASH offer reusing 18:00-19:00Z verbatim is accepted: HTTP 201, FlashOffer.${oJ}.status == SCHEDULED (the overlap set is scoped to LineupSlot.product_id)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: hold_release_rehold_conserves_product_units
        grounds:
          - calculations.inventory_pool_reconciliation
          - state_machines.Cart.OPEN_to_ABANDONED
          - state_machines.Cart.ABANDONED_to_OPEN
          - entities.Product.fields.available_qty
          - entities.Cart.fields.recovered_count
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL UNITS on Product — INV-1
          on_hand_qty == available_qty + reserved_qty + committed_qty. The compensation
          path is hold -> release -> re-hold: abandoning returns available_qty to the
          exact pre-hold 50 and recovering re-consumes exactly 4, so two full round
          trips leave zero drift, and Show.abandoned_cart_count is decremented back to
          0 by the recovery.
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with the ACTIVE 3500-cent offer (max_qty 10) on SKU-ROBE (on_hand 50)."
            - "Viewer 1 has an empty OPEN cart; recovery window is 20 minutes, so the deadline after abandoning at 18:10Z is 18:30Z."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_prelive
            - *c_golive
            - *c_clock_live
            - *c_activate
            - *c_cart1
          trigger:
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 4 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itJ: $.data.id }
            - call: "POST /carts/${ct1}/abandon"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
            - call: "POST /carts/${ct1}/recover"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
          assert:
            - "After the hold: Product.${p1}.reserved_qty == 4, committed_qty == 0, available_qty == 46 (INV-1: 50 == 46 + 4 + 0)"
            - "After the hold: CartItem.${itJ}.effective_unit_price_cents == 3325, line_gross_cents == 13300, line_tax_cents == 1164; FlashOffer.${o1}.held_qty == 4, remaining_qty == 6"
            - "After the abandon: Product.${p1}.reserved_qty == 0 and available_qty == 50 exactly (INV-1 restored, no drift)"
            - "After the abandon: CartItem.${itJ}.state == RELEASED with released_reason == CART_ABANDONED; FlashOffer.${o1}.held_qty == 0, remaining_qty == 10; Show.${sh1}.abandoned_cart_count == 1 and abandonment_rate_bp == 10000"
            - "After the recover: CartItem.${itJ}.state == HELD with released_reason == null, effective_unit_price_cents == 3325 (re-locked at the same tier)"
            - "After the recover: Product.${p1}.reserved_qty == 4 and available_qty == 46 (INV-1 holds again); FlashOffer.${o1}.held_qty == 4, remaining_qty == 6"
            - "After the recover: Cart.${ct1}.status == OPEN, recovered_count == 1, abandoned_at == null, recovery_deadline_at == null; Show.${sh1}.abandoned_cart_count == 0 and abandonment_rate_bp == 0"

      - name: capture_refund_conserves_offer_allotment_and_money
        grounds:
          - calculations.inventory_pool_reconciliation
          - state_machines.Order.CAPTURED_to_REFUNDED
          - entities.FlashOffer.fields.sold_qty
          - entities.Show.fields.gross_merchandise_cents
          - entities.Order.fields.host_commission_accrued_cents
        distinguishing_aspect: |
          Conserved quantity: the OFFER ALLOTMENT — INV-2
          max_qty == remaining_qty + held_qty + sold_qty — together with the monetary
          aggregates (gross_merchandise_cents and host_commission_accrued_cents). The
          compensation path is a different one from the units instance: commit ->
          capture -> refund, which unwinds sold_qty rather than held_qty, moves
          Product.committed_qty rather than reserved_qty, and zeroes the accrued
          commission while stamping refunded_cents == 10848.
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with the ACTIVE 3500-cent offer, max_qty 10, on SKU-ROBE (on_hand 50)."
            - "Viewer 1 holds 3 units: subtotal 10500 crosses TIER1_FLOOR_CENTS so the line prices at 3325, merchandise 9975, tax 873, shipping 0 (>= 7500), total 10848."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_prelive
            - *c_golive
            - *c_clock_live
            - *c_activate
            - *c_cart1
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 3 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itK: $.data.id }
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct1_v: $.data.version }
          trigger:
            - call: "POST /carts/${ct1}/checkout"
              payload: { expected_cart_version: "${ct1_v}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { ordK: $.data.id }
            - call: "POST /orders/${ordK}/capture"
              payload: {}
              as: MerchandisingManager
            - call: "POST /orders/${ordK}/cancel"
              payload: { cancel_reason: "FULL_RETURN" }
              as: MerchandisingManager
          assert:
            - "After checkout: CartItem.${itK}.state == COMMITTED; FlashOffer.${o1}.held_qty == 0, sold_qty == 3, remaining_qty == 7 (INV-2: 10 == 7 + 0 + 3)"
            - "After checkout: Product.${p1}.reserved_qty == 0, committed_qty == 3, available_qty == 47; Order.${ordK}.merchandise_cents == 9975, tax_cents == 873, shipping_cents == 0, total_cents == 10848"
            - "After capture: Order.${ordK}.host_commission_accrued_cents == 798 and Show.${sh1}.gross_merchandise_cents == 9975"
            - "After the refund: Order.${ordK}.payment_state == REFUNDED, fulfillment_state == CANCELLED, refunded_cents == 10848, host_commission_accrued_cents == 0"
            - "After the refund: FlashOffer.${o1}.sold_qty == 0, held_qty == 0, remaining_qty == 10 exactly (INV-2 restored) and status == ACTIVE"
            - "After the refund: Product.${p1}.committed_qty == 0 and available_qty == 50 (INV-1 also intact)"
            - "After the refund: Show.${sh1}.gross_merchandise_cents == 0 and Show.${sh1}.margin_provisional_cents == 0"
            - "CartItem.${itK}.state == RELEASED with released_reason == ORDER_CANCELLED"
