      - name: body_foreign_key_check_outranks_the_optimistic_concurrency_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors.ERR_CALCULATION_NOT_FOUND
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / body_fk_existence_outranks_stale_project_version_on_submittal_create
          rationale: "That instance sends an unknown calculation id together with a deliberately stale expected_project_version and asserts the 404, then repairs one input at a time to walk the ladder down."

      - name: authorization_outranks_body_schema_validation
        claim_type: priority_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors.ERR_NOT_PROJECT_ENGINEER
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / project_engineer_authorization_outranks_invalid_enum_on_hazard_area_create
          rationale: "The wrong-engineer plus invalid-enum combination is asserted there to return the 403 first and the 422 only after the identity is corrected."

      - name: flow_test_staleness_is_checked_before_the_chain_is_inspected
        claim_type: cascading_validation
        grounds:
          - validations[priority=22]
          - validations[priority=35]
          - errors.ERR_FLOW_TEST_STALE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_flow_test_outranks_empty_iteration_chain_on_supply_evaluation
          rationale: "That instance violates both rules in one request - a 400-day-old flow test against a calculation with no iterations - and asserts priority 22 wins."

      - name: an_iteration_exactly_at_the_velocity_limit_is_accepted
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=20]
          - calculations.pipe_sizing_chain
        excluded_because:
          difficulty_instance: boundary_precision_check / velocity_limit_accepts_exactly_thirty_two_fps_and_rejects_thirty_two_point_zero_one
          rationale: "The accept-at-32.00 and reject-at-32.01 pair is that instance's entire subject, including the flow figures that produce those velocities."

      - name: a_witness_window_that_only_conflicts_after_the_buffer_is_refused
        claim_type: temporal_validation
        grounds:
          - validations[priority=40]
          - errors.ERR_WITNESS_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / witness_calendar_closed_interval_with_sixty_minute_buffer_rejects_exact_gap
          rationale: "The exact-60-minute collision and the 61-minute acceptance across two projects sharing one reviewer are asserted there."

      - name: individually_legal_outages_can_exceed_the_project_concurrency_cap
        claim_type: aggregate_validation
        grounds:
          - validations[priority=41]
          - errors.ERR_OUTAGE_CONCURRENCY_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / outage_calendar_half_open_aggregate_cap_of_two_concurrent_systems
          rationale: "That instance commissions two overlapping outages, has the third refused at the aggregate cap, and shows a touching-endpoint window still accepted."

  - section: endpoints
    instances:
      - name: flow_test_crud_surface_is_create_read_and_a_filtered_project_scoped_list
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/flow-tests
          - endpoints.GET_/projects/{id}/flow-tests
          - entities.FlowTest
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          FlowTest has no /flow-tests/{id} read and no update or delete at all: the only read channel is
          the project-scoped list, which is also the reverse-reachability channel for its single foreign
          key. Three hydrants on one project and one on another prove the list is scoped by the path
          project and not global, and limit 2 / offset 2 proves the envelope reports total_count 3 with
          has_more false on the tail page.
        test_recipe:
          setup:
            - "Two projects sharing one lead engineer; three flow tests on FP-2601 and one on FP-2602"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
