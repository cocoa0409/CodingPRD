              as: LicensingManager
              captures: { s1: "$.data.license_status" }
          assert:
            - "${obl} == 0 and ${v_fresh} == ${v_stale} + 2"
            - "trigger call 1: HTTP 412 with ${e1} == ERR_STALE_LICENSE_VERSION; license_status is still ACTIVE"
            - "trigger call 2: HTTP 200 with ${s1} == SURRENDER_REQUESTED and surrender_effective_date == 2026-09-30T00:00:00Z"

