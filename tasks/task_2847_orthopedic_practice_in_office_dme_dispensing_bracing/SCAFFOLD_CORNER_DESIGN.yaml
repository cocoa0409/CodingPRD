              captures: { clinic_status_after_receipt: $.data.dispensing_status, clinic_count_after_receipt: $.data.stockout_par_level_count }
            - call: "GET /dme/clinics/${clinic_id}/dispensing-summary"
              payload: {}
              as: InventoryManager
              captures: { sum_recv_after_receipt: $.data.units_received_total, sum_hand_after_receipt: $.data.units_on_hand_total, sum_acct_after_receipt: $.data.units_accounted_total }
            - call: "POST /dme/encounters/${enc_id}/reservations"
              payload: { expected_par_level_version: "${receipt_v}" }
              as: DmeFitter
              as_user_id: "${fitter_id}"
              captures: { resv_clinical: $.data.clinical_status, resv_financial: $.data.financial_status }
            - call: "GET /dme/par-levels/${par_id}"
              payload: {}
              as: DmeFitter
              as_user_id: "${fitter_id}"
              captures: { par_resv_immediate: $.data.reserved_qty, par_hand_immediate: $.data.on_hand_qty, par_v_immediate: $.data.version, par_posture_immediate: $.data.stock_posture }
            - call: "GET /dme/clinics/${clinic_id}/dispensing-summary"
              payload: {}
              as: InventoryManager
              captures: { sum_resv_immediate: $.data.units_reserved_total, sum_hand_immediate: $.data.units_on_hand_total, sum_disp_immediate: $.data.units_dispensed_total }
            - call: "POST /dme/encounters/${enc_id}/fitting-records"
              payload: { fitting_start_at: "2026-08-01T09:00:00Z", fitting_end_at: "2026-08-01T09:30:00Z", measurement_set: { waist_cm: 91 }, fit_outcome: "ACCEPTABLE" }
              as: DmeFitter
              as_user_id: "${fitter_id}"
            - call: "POST /dme/encounters/${enc_id}/dispense"
              payload: { delivery_signature_role: "PATIENT" }
              as: DmeFitter
              as_user_id: "${fitter_id}"
              captures: { disp_clinical: $.data.clinical_status, disp_financial: $.data.financial_status, disp_resp: $.data.patient_responsibility_cents, disp_billable: $.data.billable_amount_cents }
            - call: "GET /dme/clinics/${clinic_id}/dispensing-summary"
              payload: {}
              as: InventoryManager
              captures: { sum_hand_after_disp: $.data.units_on_hand_total, sum_resv_after_disp: $.data.units_reserved_total, sum_disp_after_disp: $.data.units_dispensed_total, sum_acct_after_disp: $.data.units_accounted_total, sum_gross_after_disp: $.data.gross_charged_cents, sum_net_after_disp: $.data.net_cash_position_cents }
          assert:
            - "${par_posture_created} == STOCKOUT, so ${clinic_status_before} == SUSPENDED is NOT the case: a never-stocked shelf is a STOCKOUT that does not count against the clinic, hence ${clinic_status_before} == ACTIVE and ${clinic_count_before} == 0"
            - "the receipt's own response already carries the recomputed values: ${receipt_hand} == 4, ${receipt_lifetime} == 4, ${receipt_posture} == OK and ${receipt_v} == 2 -- no second read is needed to see them"
            - "${clinic_status_after_receipt} == ACTIVE and ${clinic_count_after_receipt} == 0 immediately afterwards"
            - "the summary read straight after the write agrees: ${sum_recv_after_receipt} == 4, ${sum_hand_after_receipt} == 4 and ${sum_acct_after_receipt} == 4"
            - "${resv_clinical} == RESERVED and ${resv_financial} == VERIFIED_COVERED in the reservation's own response, even though that response is a DispenseEncounter and shows no shelf numbers"
            - "the shelf read issued immediately after that reservation is already correct: ${par_resv_immediate} == 1, ${par_hand_immediate} == 4, ${par_v_immediate} == 3 and ${par_posture_immediate} == OK"
            - "${sum_resv_immediate} == 1, ${sum_hand_immediate} == 4 and ${sum_disp_immediate} == 0 with no settling step between the write and the read"
            - "${disp_clinical} == DELIVERED, ${disp_financial} == BILLED, ${disp_resp} == 10300 and ${disp_billable} == 10300 in the dispense response itself"
            - "${sum_hand_after_disp} == 3, ${sum_resv_after_disp} == 0, ${sum_disp_after_disp} == 1, ${sum_acct_after_disp} == 4, ${sum_gross_after_disp} == 10300 and ${sum_net_after_disp} == 10300 -- every derived field of the summary moved in the same request cycle as the write"
