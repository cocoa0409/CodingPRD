          - endpoints[POST /amnesty/enforcement-cases/{id}/refer]
        distinguishing_aspect: |
          The two OPEN exits are not symmetric: /close removes the 20-point open-case
          penalty and leaves the score at 100, while /refer replaces it with the
          30-point referred-case penalty, so the score falls to 70 even though
          open_case_count also drops to 0 and referred_case_count rises to 1.
