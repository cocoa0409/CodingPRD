# =============================================================================
# TSA PreCheck / Global Entry Enrollment — Scaffold Seed Tables (Expert)
# §1.0–§1.7 (response_envelope, entities, state_machines, concurrency_rules,
#            calculations, validations, endpoints, errors, roles)
# =============================================================================

scenario: |
  TSA PreCheck / Global Entry Enrollment: application & eligibility, background
  vetting, appointment/interview scheduling, biometric capture,
  Known-Traveler-Number issuance, renewal, denial/appeal, redress

domain_name: tsa-precheck-global-entry-enrollment
api_prefix: ""   # flat topology: peer top-level collections (/applications, /applicants, /enrollment-centers, ...) rooted at "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: flat            # peer entities linked by FKs; appointments/slots cross-cut
  state_machine_shape: cyclic      # Application has a denial→appeal→reinstate loop + branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate              # Appointment binds Application <-> AppointmentSlot
    - self_referential            # KnownTravelerNumber.renews_from_ktn_id -> prior KTN

  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: expert
  entity_count: 13
  state_machine_count: 5
  calculation_count: 6
  validation_layer_count: 19
  endpoint_count: 30
  error_code_count: 28
  role_count: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration ---
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: code, type: enum, source: input, description: "PRECHECK | GLOBAL_ENTRY (program offered)", constraints: "unique across all Programs; one of {PRECHECK, GLOBAL_ENTRY}" }
      - { name: name, type: string, source: input, description: "Human-readable program name" }
      - { name: base_fee_cents, type: integer, source: input, description: "Nominal enrollment fee in cents", constraints: ">= 0" }
      - { name: validity_years, type: integer, source: input, description: "Years a KTN issued under this program remains valid", constraints: "one of {3, 4, 5}" }
      - { name: vetting_risk_threshold, type: integer, source: input, description: "BackgroundCheck.risk_score strictly above this value forces manual REVIEW instead of auto-CLEARED", constraints: "0..100" }
      - { name: vetting_deny_threshold, type: integer, source: input, description: "BackgroundCheck.risk_score >= this value forces ADVERSE (auto-deny path)", constraints: "0..100; must be > vetting_risk_threshold" }
      - { name: redress_min_score, type: integer, source: input, description: "Minimum RedressCase.match_strength_score for a redress to clear an adverse hit", constraints: "0..100" }
      - { name: renewal_window_days, type: integer, source: input, description: "Days before KTN expiry within which an early renewal is permitted", default: 180, constraints: ">= 0" }

  - name: EnrollmentCenter
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: enum, source: input, description: "Which program this center serves (PRECHECK | GLOBAL_ENTRY)" }
      - { name: name, type: string, source: input, description: "Center name" }
      - { name: daily_interview_capacity, type: integer, source: input, description: "Maximum number of CONFIRMED appointments whose slot starts on a single calendar UTC date", constraints: ">= 1" }
      - { name: buffer_minutes, type: integer, source: input, description: "Mandatory clearance gap (minutes) the center enforces between two CONFIRMED appointments on the same lane", default: 0, constraints: ">= 0" }
      - { name: lane_count, type: integer, source: input, description: "Number of parallel interview lanes; appointments compete for a lane only against same-lane appointments", default: 1, constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED (SUSPENDED blocks new slot booking but not existing appointments)", default: "OPEN" }

  - name: AppointmentSlot
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> EnrollmentCenter.id" }
      - { name: lane_index, type: integer, source: input, description: "Lane this slot belongs to (0-based, < center.lane_count)", constraints: "0 <= lane_index < EnrollmentCenter.lane_count" }
      - { name: starts_at, type: datetime, source: input, description: "Slot start (ISO 8601 UTC, half-open interval [starts_at, ends_at))" }
      - { name: ends_at, type: datetime, source: input, description: "Slot end (exclusive); must be strictly after starts_at" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | BOOKED | RELEASED (terminal)", default: "AVAILABLE" }
      - { name: held_by_appointment_id, type: string, source: computed, description: "Denormalized back-pointer to the Appointment.id currently occupying this slot (null when AVAILABLE or RELEASED); not a forward FK — discovered via the slot itself", default: null }

  # --- People / core lifecycle ---
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant legal name" }
      - { name: date_of_birth, type: string, source: input, description: "YYYY-MM-DD" }
      - { name: citizenship, type: enum, source: input, description: "US_CITIZEN | LPR | NONIMMIGRANT (Global Entry requires US_CITIZEN or LPR)" }
      - { name: disqualifying_flag, type: boolean, source: input, description: "True if applicant self-declared a permanently disqualifying conviction", default: false }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: program_code, type: enum, source: input, description: "PRECHECK | GLOBAL_ENTRY; pins which Program governs fees/thresholds" }
      - { name: renews_from_application_id, type: string, source: input, description: "FK -> Application.id; set when this application renews a prior approved one, else null", default: null, required: false }
      - { name: fee_due_cents, type: integer, source: computed, description: "Fee owed, computed at submission per fee-assessment calc (renewal vs new differ)", default: 0 }
      - { name: fee_paid_cents, type: integer, source: computed, description: "Cumulative successful payments minus refunds applied to this application", default: 0 }
      - { name: adverse_reason, type: string, source: computed, description: "Populated when application enters DENIED via vetting; null otherwise", default: null }
      - { name: appeal_count, type: integer, source: computed, description: "Number of appeals filed against denials of this application", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | VETTING | INTERVIEW_SCHEDULED | INTERVIEW_COMPLETE | APPROVED | DENIED | APPEAL_PENDING | WITHDRAWN", default: "DRAFT", constraints: "terminal: APPROVED, WITHDRAWN; DENIED is non-terminal (appealable)" }

  - name: BackgroundCheck
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; one BackgroundCheck per Application" }
      - { name: criminal_hits, type: integer, source: input, description: "Count of criminal-history hits returned by the vetting feed", default: 0, constraints: ">= 0" }
      - { name: watchlist_hits, type: integer, source: input, description: "Count of terrorist-watchlist matches returned by the vetting feed", default: 0, constraints: ">= 0" }
      - { name: prior_revocations, type: integer, source: input, description: "Count of prior KTN revocations for this applicant", default: 0, constraints: ">= 0" }
      - { name: risk_score, type: integer, source: computed, description: "Weighted vetting risk score (see compute_risk_score calc), 0..100" }
      - { name: redress_offset_applied, type: integer, source: computed, description: "Points subtracted from raw risk by an accepted RedressCase at resolution time", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | CLEARED | REVIEW | ADVERSE", default: "PENDING" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: slot_id, type: string, source: input, description: "FK -> AppointmentSlot.id" }
      - { name: center_id, type: string, source: computed, description: "Denormalized copy of the booked slot's center id (EnrollmentCenter.id); convenience field, not a forward FK" }
      - { name: starts_at, type: datetime, source: computed, description: "Copied from slot.starts_at at booking time" }
      - { name: ends_at, type: datetime, source: computed, description: "Copied from slot.ends_at at booking time" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | COMPLETED | CANCELLED | NO_SHOW", default: "CONFIRMED", constraints: "terminal: COMPLETED, CANCELLED, NO_SHOW" }

  - name: BiometricCapture
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id" }
      - { name: application_id, type: string, source: computed, description: "Denormalized copy of the appointment's application id (Application.id); convenience field, not a forward FK" }
      - { name: fingerprint_quality, type: integer, source: input, description: "NFIQ-style quality 1 (best) .. 5 (worst)", constraints: "1..5" }
      - { name: photo_captured, type: boolean, source: input, description: "Whether a compliant facial photo was captured", default: false }
      - { name: status, type: enum, source: system, description: "ACCEPTED | REJECTED (quality fail)", default: "ACCEPTED" }

  - name: KnownTravelerNumber
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the approved application that produced this KTN" }
      - { name: applicant_id, type: string, source: computed, description: "Denormalized copy of the application's applicant id (Applicant.id); convenience field, not a forward FK" }
      - { name: ktn_value, type: string, source: system, description: "Issued 9-character KTN string (system-minted, opaque)" }
      - { name: issued_at, type: datetime, source: system, description: "Issuance timestamp (ISO 8601 UTC)" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + Program.validity_years (see compute_ktn_expiry calc)" }
      - { name: renews_from_ktn_id, type: string, source: input, description: "FK -> KnownTravelerNumber.id; prior KTN this one renews, else null", default: null, required: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED | SUPERSEDED", default: "ACTIVE", constraints: "terminal: REVOKED, SUPERSEDED" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the DENIED application being appealed" }
      - { name: filed_reason, type: string, source: input, description: "Applicant's stated grounds for appeal" }
      - { name: decided_by_user_id, type: string, source: computed, description: "Opaque AppealsOfficer id who decided; must differ from the vetting officer (segregation of duties)", default: null }
      - { name: outcome, type: enum, source: computed, description: "UPHELD (denial stands) | OVERTURNED (application reinstated)", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | DECIDED", default: "OPEN", constraints: "terminal: DECIDED" }

  - name: RedressCase
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application whose adverse vetting is being challenged via DHS TRIP" }
      - { name: trip_number, type: string, source: input, description: "DHS TRIP redress control number" }
      - { name: match_strength_score, type: integer, source: input, description: "Adjudicator's confidence that the watchlist hit is a true match (0..100); lower = weaker match", constraints: "0..100" }
      - { name: resolution, type: enum, source: computed, description: "CLEARED (mis-identification, offset applied) | CONFIRMED (true match, no offset)", default: null }
      - { name: risk_offset, type: integer, source: computed, description: "Points this redress subtracts from BackgroundCheck.risk_score when CLEARED (see compute_redress_offset calc)", default: 0 }
      - { name: status, type: enum, source: system, description: "FILED | RESOLVED", default: "FILED", constraints: "terminal: RESOLVED" }

  # --- Fiscal event log ---
  - name: FeeTransaction
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: kind, type: enum, source: input, description: "PAYMENT | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Absolute transaction amount in cents (always positive)", constraints: ">= 1" }
      - { name: reason, type: string, source: input, description: "Free-text reason (e.g. 'enrollment fee', 'withdrawal refund')", required: false, default: null }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id the event concerns" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID that caused the event (opaque or applicant id)" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role that caused the event" }
      - { name: event_type, type: string, source: system, description: "Machine event name, e.g. APPLICATION_SUBMITTED, VETTING_ADVERSE, KTN_ISSUED" }
      - { name: detail, type: string, source: system, description: "Human-readable summary captured at write time" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [APPROVED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Application in DRAFT (ERR_INVALID_STATE)"
          - "Referenced Applicant exists (ERR_APPLICANT_NOT_FOUND)"
          - "If program_code == GLOBAL_ENTRY, applicant.citizenship in {US_CITIZEN, LPR} (ERR_ELIGIBILITY_CITIZENSHIP)"
          - "applicant.disqualifying_flag == false (ERR_PERMANENTLY_DISQUALIFIED)"
          - "If renews_from_application_id set, that application is APPROVED and shares applicant_id+program_code (ERR_RENEWAL_SOURCE_INVALID)"
        side_effects:
          - "fee_due_cents := compute_fee_due(application)  (renewal vs new differ)"
          - "fee_paid_cents initialized to 0"
          - "Write AuditEvent(event_type=APPLICATION_SUBMITTED)"

      - from: SUBMITTED
        to: VETTING
        trigger: "POST /applications/{id}/background-checks"
        actor: VettingOfficer
        preconditions:
          - "Application in SUBMITTED (ERR_INVALID_STATE)"
          - "fee_paid_cents >= fee_due_cents (ERR_FEE_UNPAID)"
          - "No BackgroundCheck already exists for this application (ERR_BACKGROUND_CHECK_EXISTS)"
        side_effects:
          - "Create BackgroundCheck(status=PENDING)"
          - "risk_score := compute_risk_score(check) using its hit counts"
          - "Write AuditEvent(event_type=VETTING_STARTED)"

      - from: VETTING
        to: INTERVIEW_SCHEDULED
        trigger: "POST /applications/{id}/adjudicate (resolves to CLEARED) then POST /appointments"
        actor: VettingOfficer
        preconditions:
          - "BackgroundCheck.status == CLEARED (ERR_VETTING_NOT_CLEARED)"
          - "A CONFIRMED Appointment exists for this application (ERR_NO_APPOINTMENT)"
        side_effects:
          - "Write AuditEvent(event_type=INTERVIEW_SCHEDULED)"
        note: "Adjudication sets BackgroundCheck terminal status; booking an appointment after CLEARED advances the application."

      - from: VETTING
        to: DENIED
        trigger: "POST /applications/{id}/adjudicate (resolves to ADVERSE)"
        actor: VettingOfficer
        preconditions:
          - "BackgroundCheck.status == ADVERSE after adjudication (ERR_VETTING_NOT_ADVERSE)"
        side_effects:
          - "adverse_reason := derived from dominant hit category"
          - "Write AuditEvent(event_type=VETTING_ADVERSE)"

      - from: INTERVIEW_SCHEDULED
        to: INTERVIEW_COMPLETE
        trigger: "POST /appointments/{id}/complete"
        actor: EnrollmentOfficer
        preconditions:
          - "Appointment in CONFIRMED (ERR_INVALID_STATE)"
          - "A BiometricCapture with status ACCEPTED exists for the appointment (ERR_BIOMETRICS_NOT_ACCEPTED)"
        side_effects:
          - "Appointment -> COMPLETED"
          - "Slot held by appointment stays BOOKED"
          - "Write AuditEvent(event_type=INTERVIEW_COMPLETE)"

      - from: INTERVIEW_COMPLETE
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: EnrollmentOfficer
        preconditions:
          - "Application in INTERVIEW_COMPLETE (ERR_INVALID_STATE)"
          - "BackgroundCheck.status == CLEARED (ERR_VETTING_NOT_CLEARED)"
          - "Issuing this KTN's [issued_at, expires_at] coverage interval must not overlap any existing ACTIVE KTN coverage interval for the same applicant_id + program_code, UNLESS this application is a valid renewal of that KTN's application (in which case the prior is SUPERSEDED). Closed-interval semantics: shared endpoints count as overlap (ERR_KTN_COVERAGE_OVERLAP)"
        side_effects:
          - "Create KnownTravelerNumber(status=ACTIVE); expires_at := compute_ktn_expiry"
          - "If renews_from_application_id set: the prior application's ACTIVE KTN -> SUPERSEDED"
          - "Write AuditEvent(event_type=KTN_ISSUED)"

      - from: DENIED
        to: APPEAL_PENDING
        trigger: "POST /applications/{id}/appeals"
        actor: Applicant
        preconditions:
          - "Application in DENIED (ERR_INVALID_STATE)"
          - "appeal_count < 1 (only one appeal per denial; ERR_APPEAL_LIMIT_REACHED)"
        side_effects:
          - "Create Appeal(status=OPEN)"
          - "appeal_count += 1"
          - "Write AuditEvent(event_type=APPEAL_FILED)"

      - from: APPEAL_PENDING
        to: VETTING
        trigger: "POST /appeals/{id}/decide (outcome OVERTURNED)"
        actor: AppealsOfficer
        preconditions:
          - "Appeal in OPEN (ERR_INVALID_STATE)"
          - "Deciding AppealsOfficer X-User-ID != the BackgroundCheck adjudicating VettingOfficer's id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Appeal -> DECIDED, outcome=OVERTURNED"
          - "BackgroundCheck.status reset ADVERSE -> PENDING, adverse_reason cleared"
          - "Write AuditEvent(event_type=APPEAL_OVERTURNED)"
        note: "Cycle: DENIED -> APPEAL_PENDING -> VETTING re-opens the vetting loop."

      - from: APPEAL_PENDING
        to: DENIED
        trigger: "POST /appeals/{id}/decide (outcome UPHELD)"
        actor: AppealsOfficer
        preconditions:
          - "Appeal in OPEN (ERR_INVALID_STATE)"
          - "Deciding AppealsOfficer X-User-ID != adjudicating VettingOfficer id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Appeal -> DECIDED, outcome=UPHELD"
          - "Write AuditEvent(event_type=APPEAL_UPHELD)"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application in {DRAFT, SUBMITTED, VETTING, INTERVIEW_SCHEDULED, DENIED, APPEAL_PENDING} (ERR_INVALID_STATE)"
          - "expected_application_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "If fee_paid_cents > fee_due_refundable: create FeeTransaction(REFUND) for refundable portion; fee_paid_cents decremented"
          - "Any CONFIRMED Appointment -> CANCELLED; its slot -> AVAILABLE (cascade)"
          - "Any OPEN Appeal -> DECIDED(outcome=UPHELD)"
          - "Write AuditEvent(event_type=APPLICATION_WITHDRAWN)"
        note: "Same trigger reachable from SUBMITTED/VETTING/INTERVIEW_SCHEDULED/DENIED/APPEAL_PENDING; all converge on WITHDRAWN."

  - entity: BackgroundCheck
    initial_state: PENDING
    terminal_states: [CLEARED, ADVERSE]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /applications/{id}/adjudicate"
        actor: VettingOfficer
        preconditions:
          - "BackgroundCheck in PENDING (ERR_INVALID_STATE)"
          - "effective risk_score (risk_score - redress_offset_applied) <= Program.vetting_risk_threshold (else REVIEW or ADVERSE)"
        side_effects:
          - "Record adjudicating VettingOfficer X-User-ID on the check"
          - "Application stays VETTING until appointment booked"

      - from: PENDING
        to: REVIEW
        trigger: "POST /applications/{id}/adjudicate"
        actor: VettingOfficer
        preconditions:
          - "BackgroundCheck in PENDING (ERR_INVALID_STATE)"
          - "vetting_risk_threshold < effective risk_score < vetting_deny_threshold"
        side_effects:
          - "Record adjudicating VettingOfficer X-User-ID on the check"

      - from: REVIEW
        to: CLEARED
        trigger: "POST /background-checks/{id}/manual-clear"
        actor: VettingOfficer
        preconditions:
          - "BackgroundCheck in REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "Record adjudicating VettingOfficer X-User-ID"

      - from: REVIEW
        to: ADVERSE
        trigger: "POST /background-checks/{id}/manual-deny"
        actor: VettingOfficer
        preconditions:
          - "BackgroundCheck in REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "Application -> DENIED; adverse_reason set"

      - from: PENDING
        to: ADVERSE
        trigger: "POST /applications/{id}/adjudicate"
        actor: VettingOfficer
        preconditions:
          - "BackgroundCheck in PENDING (ERR_INVALID_STATE)"
          - "effective risk_score >= Program.vetting_deny_threshold"
        side_effects:
          - "Application -> DENIED; adverse_reason set from dominant hit category"
          - "Record adjudicating VettingOfficer X-User-ID"

  - entity: Appointment
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: EnrollmentOfficer
        preconditions:
          - "Appointment in CONFIRMED (ERR_INVALID_STATE)"
          - "A BiometricCapture status ACCEPTED exists for the appointment (ERR_BIOMETRICS_NOT_ACCEPTED)"
        side_effects:
          - "Application INTERVIEW_SCHEDULED -> INTERVIEW_COMPLETE (cross-entity)"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Applicant
        preconditions:
          - "Appointment in CONFIRMED (ERR_INVALID_STATE)"
        side_effects:
          - "Slot held by appointment -> AVAILABLE; slot.held_by_appointment_id cleared (cascade)"
          - "If Application is INTERVIEW_SCHEDULED, revert it to VETTING (cross-entity)"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: EnrollmentOfficer
        preconditions:
          - "Appointment in CONFIRMED (ERR_INVALID_STATE)"
          - "current clock >= appointment.ends_at (ERR_APPOINTMENT_NOT_ELAPSED)"
        side_effects:
          - "Slot held by appointment -> AVAILABLE; slot.held_by_appointment_id cleared (cascade)"
          - "If Application is INTERVIEW_SCHEDULED, revert it to VETTING (cross-entity)"

  - entity: AppointmentSlot
    initial_state: AVAILABLE
    terminal_states: [RELEASED]
    transitions:
      - from: AVAILABLE
        to: BOOKED
        trigger: "POST /appointments"
        actor: Applicant
        preconditions:
          - "Slot in AVAILABLE (ERR_SLOT_NOT_AVAILABLE)"
          - "Center status == OPEN (ERR_CENTER_SUSPENDED)"
          - "No lane buffer collision and daily capacity not exceeded (ERR_SLOT_OVERLAP / ERR_DAILY_CAPACITY_EXCEEDED)"
        side_effects:
          - "held_by_appointment_id := new appointment id"
          - "Application SUBMITTED-or-later with CLEARED check advances toward INTERVIEW_SCHEDULED"

      - from: BOOKED
        to: AVAILABLE
        trigger: "system (appointment cancelled / no-show)"
        actor: system
        preconditions:
          - "Held appointment transitioned to CANCELLED or NO_SHOW"
        side_effects:
          - "held_by_appointment_id cleared"

      - from: AVAILABLE
        to: RELEASED
        trigger: "POST /appointment-slots/{id}/release"
        actor: SchedulingAdmin
        preconditions:
          - "Slot in AVAILABLE (ERR_SLOT_NOT_AVAILABLE)"
        side_effects:
          - "Slot permanently removed from booking pool"

  - entity: KnownTravelerNumber
    initial_state: ACTIVE
    terminal_states: [REVOKED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /known-traveler-numbers/{id}/expire-sweep"
        actor: SchedulingAdmin
        preconditions:
          - "KTN in ACTIVE (ERR_INVALID_STATE)"
          - "current clock >= expires_at (ERR_KTN_NOT_EXPIRED)"
        side_effects:
          - "Write AuditEvent(event_type=KTN_EXPIRED)"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /known-traveler-numbers/{id}/revoke"
        actor: VettingOfficer
        preconditions:
          - "KTN in ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Write AuditEvent(event_type=KTN_REVOKED)"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (renewal application approved)"
        actor: system
        preconditions:
          - "A renewal Application referencing this KTN's application was APPROVED"
        side_effects:
          - "New KTN issued with renews_from_ktn_id pointing here"
          - "Write AuditEvent(event_type=KTN_SUPERSEDED)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: appointment-book-stale-application
    parent_entity: Application
    write_endpoint: "POST /appointments"
    occ_field: "expected_application_version"
    description: |
      Booking an Appointment against an Application whose version has advanced
      since the client last observed it is rejected. This captures the case
      where the application has already been moved forward (a prior appointment
      booked, or the vetting result re-adjudicated) and the current writer's
      view of the application is stale, so the booking it intends is no longer
      the one the system would produce.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: withdraw-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/withdraw"
    occ_field: "expected_application_version"
    description: |
      Withdrawing an Application whose version has advanced since the client
      last read it is rejected. A refund and cascade fire on withdrawal, so a
      stale view (computed against an older fee_paid_cents / appointment set)
      must not drive the compensation; the write is rejected on the version
      mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compute_fee_due
    trigger: "Application SUBMITTED transition (POST /applications/{id}/submit)"
    algorithm: threshold
    formula: |
      base = Program(program_code).base_fee_cents
      if application.renews_from_application_id is null:
        fee_due_cents = base                         # new enrollment pays full fee
      else:
        # renewal discount: 20% off, applied to the base, rounded to nearest cent (half-up)
        fee_due_cents = round_half_up(base * (1 - RENEWAL_DISCOUNT_RATE))
      Evaluation order is pinned: discount applies to base BEFORE any rounding;
      no per-component rounding.
    input_set: "single Program row matched by application.program_code; renewal flag from application"
    constants:
      RENEWAL_DISCOUNT_RATE: 0.20
    precision: "integer cents, round_half_up"
    variants:
      - name: new_enrollment
        when: "renews_from_application_id is null"
        difference: "full base_fee_cents, no discount"
      - name: renewal
        when: "renews_from_application_id is set and valid"
        difference: "base_fee_cents * 0.80 rounded half-up"

  - name: compute_refund_due
    trigger: "Application withdraw transition (POST /applications/{id}/withdraw)"
    algorithm: threshold
    formula: |
      paid = application.fee_paid_cents
      if application.status in {DRAFT, SUBMITTED}:
        # full refund before vetting begins
        refund_cents = paid
      elif application.status in {VETTING, INTERVIEW_SCHEDULED}:
        # partial: processing fee retained
        refund_cents = max(0, paid - PROCESSING_FEE_CENTS)
      else:  # DENIED, APPEAL_PENDING
        refund_cents = 0                              # no refund after adverse decision
      Refund never exceeds paid and is floored at 0.
    input_set: "single Application; branch on status at withdrawal time"
    constants:
      PROCESSING_FEE_CENTS: 1175
    precision: "integer cents"
    variants:
      - name: pre_vetting_full
        when: "status in {DRAFT, SUBMITTED}"
        difference: "refund == fee_paid_cents"
      - name: in_progress_partial
        when: "status in {VETTING, INTERVIEW_SCHEDULED}"
        difference: "refund == max(0, fee_paid_cents - 1175)"
      - name: post_adverse_none
        when: "status in {DENIED, APPEAL_PENDING}"
        difference: "refund == 0"

  - name: compute_risk_score
    trigger: "BackgroundCheck creation (POST /applications/{id}/background-checks)"
    algorithm: weighted_scoring
    formula: |
      raw = (criminal_hits * W_CRIMINAL)
          + (watchlist_hits * W_WATCHLIST)
          + (prior_revocations * W_REVOCATION)
      # clamp into [0,100]; watchlist dominates because W_WATCHLIST is largest
      risk_score = min(100, max(0, raw))
      # effective score used at adjudication subtracts any accepted redress offset:
      effective = max(0, risk_score - redress_offset_applied)
      Pinned order: compute weighted raw, clamp to [0,100], THEN subtract offset
      and re-floor at 0. Subtracting offset before the clamp is WRONG.
    input_set: "single BackgroundCheck row; redress_offset_applied starts at 0, updated by redress resolution"
    constants:
      W_CRIMINAL: 15
      W_WATCHLIST: 60
      W_REVOCATION: 25
    precision: "integer points, clamp [0,100]"
    variants:
      - name: raw_at_creation
        when: "BackgroundCheck created, no redress yet"
        difference: "effective == risk_score (offset 0)"
      - name: post_redress_adjusted
        when: "an accepted RedressCase has applied risk_offset"
        difference: "effective == max(0, risk_score - redress_offset_applied), evaluated AFTER clamp"

  - name: compute_redress_offset
    trigger: "RedressCase resolution (POST /redress-cases/{id}/resolve)"
    algorithm: threshold
    formula: |
      prog = Program(application.program_code)
      if redress.match_strength_score <= prog.redress_min_score:
        # weak match => mis-identification cleared; full watchlist weight removed
        resolution = CLEARED
        risk_offset = W_WATCHLIST * background_check.watchlist_hits
      else:
        resolution = CONFIRMED
        risk_offset = 0
      On CLEARED: background_check.redress_offset_applied += risk_offset.
      Boundary: match_strength_score EQUAL to redress_min_score CLEARS (<=).
    input_set: "single RedressCase + its Application's BackgroundCheck + Program thresholds"
    constants:
      W_WATCHLIST: 60
    precision: "integer points"
    variants:
      - name: weak_match_cleared
        when: "match_strength_score <= Program.redress_min_score"
        difference: "offset = 60 * watchlist_hits, resolution CLEARED"
      - name: strong_match_confirmed
        when: "match_strength_score > Program.redress_min_score"
        difference: "offset = 0, resolution CONFIRMED"

  - name: compute_ktn_expiry
    trigger: "KTN issuance on Application approve (POST /applications/{id}/approve)"
    algorithm: aggregation
    formula: |
      years = Program(application.program_code).validity_years
      expires_at = issued_at + years calendar years (same month/day; Feb-29 issue
                   maps to Feb-28 in non-leap target years).
      issued_at is the server clock at approval time.
    input_set: "single Program row + issuance clock"
    constants: {}
    precision: "ISO 8601 UTC datetime"

  - name: compute_daily_capacity_used
    trigger: "Appointment booking (POST /appointments) and capacity validation"
    algorithm: aggregation
    formula: |
      target_date = slot.starts_at date (UTC calendar date)
      used = count of Appointments A where
               A.center_id == slot.center_id
           AND A.status == CONFIRMED
           AND date(A.starts_at UTC) == target_date
      Booking is rejected when used >= center.daily_interview_capacity
      (strict: the capacity-th confirmed appointment fills the day; the next is
      rejected). CANCELLED/NO_SHOW/COMPLETED appointments do NOT count.
    input_set: "all CONFIRMED Appointments at the center sharing the slot's UTC calendar date"
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with a path id

  - priority: 4
    category: existence
    check: "Referenced FK body fields (applicant_id, slot_id, application_id, renews_from_*) resolve to existing rows"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /applications, POST /applications/{id}/background-checks, POST /appointments, POST /biometric-captures, POST /redress-cases"

  - priority: 5
    category: business_constraint
    check: "Request body conforms to schema: required fields present, enums in range, integers within declared bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5.1
    category: business_constraint
    check: "Pagination params within bounds: 1 <= limit <= 100, offset >= 0"
    error_id: ERR_VALIDATION_OUT_OF_RANGE
    http_status: 422
    applies_to: all list (GET collection) endpoints

  - priority: 5.2
    category: business_temporal
    check: "POST /_clock/set_current_utc to_iso8601 is a valid ISO 8601 UTC datetime"
    error_id: ERR_CLOCK_INVALID
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 6
    category: state
    check: "expected_<parent>_version (when the endpoint declares it) equals the live parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /appointments, POST /applications/{id}/withdraw"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_safety
    check: "Applicant has not self-declared a permanently disqualifying conviction"
    error_id: ERR_PERMANENTLY_DISQUALIFIED
    http_status: 403
    applies_to: "POST /applications/{id}/submit"

  - priority: 9
    category: business_safety
    check: "For GLOBAL_ENTRY, applicant.citizenship in {US_CITIZEN, LPR}"
    error_id: ERR_ELIGIBILITY_CITIZENSHIP
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 10
    category: business_referential
    check: "renews_from_application_id (when set) is APPROVED and shares applicant_id + program_code"
    error_id: ERR_RENEWAL_SOURCE_INVALID
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 11
    category: business_temporal
    check: "Renewal submitted no earlier than (prior KTN.expires_at - Program.renewal_window_days)"
    error_id: ERR_RENEWAL_TOO_EARLY
    http_status: 409
    applies_to: "POST /applications/{id}/submit (renewal only)"

  - priority: 12
    category: state
    check: "Enrollment center is OPEN (not SUSPENDED) when booking an appointment"
    error_id: ERR_CENTER_SUSPENDED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 13
    category: state
    check: "Target AppointmentSlot is AVAILABLE"
    error_id: ERR_SLOT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 14
    category: business_temporal
    check: "No same-lane CONFIRMED appointment whose [starts_at, ends_at) expanded by buffer_minutes overlaps the requested slot"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 15
    category: business_constraint
    check: "CONFIRMED appointment count at the center for the slot's UTC date is below daily_interview_capacity"
    error_id: ERR_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 16
    category: state
    check: "BackgroundCheck is CLEARED before an application may be approved or advanced to interview-scheduled"
    error_id: ERR_VETTING_NOT_CLEARED
    http_status: 409
    applies_to: "POST /applications/{id}/approve, advancing to INTERVIEW_SCHEDULED"

  - priority: 16.5
    category: business_temporal
    check: "On approval, the new KTN's closed coverage interval [issued_at, expires_at] must not overlap any ACTIVE KTN for the same applicant_id+program_code (unless a valid renewal supersedes it). Closed-interval: shared endpoints overlap"
    error_id: ERR_KTN_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /applications/{id}/approve"

  - priority: 17
    category: business_safety
    check: "Deciding AppealsOfficer X-User-ID differs from the VettingOfficer who adjudicated the BackgroundCheck"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appeals/{id}/decide"

  - priority: 18
    category: business_constraint
    check: "At most one appeal per denied application (appeal_count < 1)"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /applications/{id}/appeals"

  - priority: 19
    category: business_fiscal
    check: "fee_paid_cents >= fee_due_cents before vetting may begin"
    error_id: ERR_FEE_UNPAID
    http_status: 402
    applies_to: "POST /applications/{id}/background-checks"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Programs (config) ---
  - method: POST
    path: "/programs"
    description: "Create a program configuration"
    roles: [SchedulingAdmin]
    code: 201
    input: [code, name, base_fee_cents, validity_years, vetting_risk_threshold, vetting_deny_threshold, redress_min_score, "renewal_window_days?"]
    output: Program
    side_effects: []

  - method: GET
    path: "/programs"
    description: "List programs (filterable by code)"
    roles: [SchedulingAdmin, VettingOfficer, EnrollmentOfficer, AppealsOfficer, Applicant]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: "Program[]"
    side_effects: []

  - method: GET
    path: "/programs/{id}"
    description: "Get one program"
    roles: [SchedulingAdmin, VettingOfficer, EnrollmentOfficer, AppealsOfficer, Applicant]
    code: 200
    input: []
    output: Program
    side_effects: []

  # --- Applicants ---
  - method: POST
    path: "/applicants"
    description: "Register an applicant"
    roles: [Applicant, SchedulingAdmin]
    code: 201
    input: [full_name, date_of_birth, citizenship, "disqualifying_flag?"]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants/{id}"
    description: "Get an applicant"
    roles: [Applicant, SchedulingAdmin, VettingOfficer]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants/{id}/applications"
    description: "List applications for an applicant (reverse-reachability for Application.applicant_id)"
    roles: [Applicant, SchedulingAdmin, VettingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Application[]"
    side_effects: []

  # --- Enrollment Centers ---
  - method: POST
    path: "/enrollment-centers"
    description: "Create an enrollment center"
    roles: [SchedulingAdmin]
    code: 201
    input: [program_code, name, daily_interview_capacity, "buffer_minutes?", "lane_count?"]
    output: EnrollmentCenter
    side_effects: ["status initialized OPEN"]

  - method: GET
    path: "/enrollment-centers/{id}"
    description: "Get an enrollment center"
    roles: [SchedulingAdmin, EnrollmentOfficer, Applicant]
    code: 200
    input: []
    output: EnrollmentCenter
    side_effects: []

  - method: POST
    path: "/enrollment-centers/{id}/suspend"
    description: "Suspend a center (blocks new bookings)"
    roles: [SchedulingAdmin]
    code: 200
    input: []
    output: EnrollmentCenter
    side_effects: ["status -> SUSPENDED"]

  - method: GET
    path: "/enrollment-centers/{id}/appointment-slots"
    description: "List slots at a center (reverse-reachability for AppointmentSlot.center_id)"
    roles: [SchedulingAdmin, EnrollmentOfficer, Applicant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AppointmentSlot[]"
    side_effects: []

  # --- Appointment Slots ---
  - method: POST
    path: "/appointment-slots"
    description: "Create a bookable slot at a center"
    roles: [SchedulingAdmin]
    code: 201
    input: [center_id, lane_index, starts_at, ends_at]
    output: AppointmentSlot
    side_effects: ["status AVAILABLE"]

  - method: GET
    path: "/appointment-slots/{id}"
    description: "Get a slot"
    roles: [SchedulingAdmin, EnrollmentOfficer, Applicant]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: []

  - method: POST
    path: "/appointment-slots/{id}/release"
    description: "Permanently release an available slot from the booking pool"
    roles: [SchedulingAdmin]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: ["status AVAILABLE -> RELEASED"]

  # --- Applications (core lifecycle) ---
  - method: POST
    path: "/applications"
    description: "Create a DRAFT application"
    roles: [Applicant, SchedulingAdmin]
    code: 201
    input: [applicant_id, program_code, "renews_from_application_id?"]
    output: Application
    side_effects: ["status DRAFT"]

  - method: GET
    path: "/applications"
    description: "List applications (filterable by applicant_id, program_code, status, renews_from_application_id — the last gives reverse-reachability for the self-referential renewal FK)"
    roles: [SchedulingAdmin, VettingOfficer, EnrollmentOfficer, AppealsOfficer]
    code: 200
    input: ["applicant_id?", "program_code?", "status?", "renews_from_application_id?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []

  - method: GET
    path: "/applications/{id}"
    description: "Get an application"
    roles: [SchedulingAdmin, VettingOfficer, EnrollmentOfficer, AppealsOfficer, Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/applications/{id}/pay"
    description: "Record a fee payment toward the application"
    roles: [Applicant, SchedulingAdmin]
    code: 201
    input: [amount_cents]
    output: FeeTransaction
    side_effects: ["Create FeeTransaction(kind=PAYMENT); fee_paid_cents += amount_cents; increments Application.version by 1"]

  - method: GET
    path: "/applications/{id}/fee-transactions"
    description: "List fee transactions for an application (reverse-reachability for FeeTransaction.application_id)"
    roles: [SchedulingAdmin, Applicant, VettingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FeeTransaction[]"
    side_effects: []

  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit a DRAFT application"
    roles: [Applicant, SchedulingAdmin]
    code: 200
    input: []
    output: Application
    side_effects: ["status DRAFT -> SUBMITTED", "fee_due_cents := compute_fee_due", "increments Application.version by 1", "Write AuditEvent"]

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Withdraw an application (refund + cascade)"
    roles: [Applicant, SchedulingAdmin]
    code: 200
    input: [expected_application_version]
    output: Application
    side_effects: ["status -> WITHDRAWN", "compute_refund_due; create FeeTransaction(REFUND) if > 0; fee_paid_cents decremented", "CONFIRMED appointment -> CANCELLED + slot -> AVAILABLE (cascade)", "OPEN appeal -> DECIDED(UPHELD)", "increments Application.version by 1", "Write AuditEvent"]

  - method: POST
    path: "/applications/{id}/background-checks"
    description: "Open vetting: create the BackgroundCheck and score it"
    roles: [VettingOfficer]
    code: 201
    input: ["criminal_hits?", "watchlist_hits?", "prior_revocations?"]
    output: BackgroundCheck
    side_effects: ["Application SUBMITTED -> VETTING", "Create BackgroundCheck(PENDING); risk_score := compute_risk_score", "increments Application.version by 1", "Write AuditEvent"]

  - method: GET
    path: "/applications/{id}/background-checks"
    description: "List background checks for an application (reverse-reachability for BackgroundCheck.application_id)"
    roles: [VettingOfficer, AppealsOfficer, SchedulingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "BackgroundCheck[]"
    side_effects: []

  - method: POST
    path: "/applications/{id}/adjudicate"
    description: "Adjudicate the PENDING background check: CLEARED / REVIEW / ADVERSE per thresholds"
    roles: [VettingOfficer]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: ["BackgroundCheck PENDING -> CLEARED|REVIEW|ADVERSE", "On ADVERSE: Application VETTING -> DENIED, adverse_reason set", "Record adjudicating VettingOfficer id", "increments Application.version by 1", "Write AuditEvent"]

  - method: POST
    path: "/background-checks/{id}/manual-clear"
    description: "Manually clear a REVIEW background check"
    roles: [VettingOfficer]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: ["BackgroundCheck REVIEW -> CLEARED"]

  - method: POST
    path: "/background-checks/{id}/manual-deny"
    description: "Manually deny a REVIEW background check"
    roles: [VettingOfficer]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: ["BackgroundCheck REVIEW -> ADVERSE", "Application VETTING -> DENIED, adverse_reason set", "increments Application.version by 1"]

  - method: GET
    path: "/background-checks/{id}"
    description: "Get a background check"
    roles: [VettingOfficer, AppealsOfficer, SchedulingAdmin]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []

  # --- Appointments ---
  - method: POST
    path: "/appointments"
    description: "Book an appointment for an application against a slot (OCC-guarded on Application.version)"
    roles: [Applicant, SchedulingAdmin]
    code: 201
    input: [application_id, slot_id, expected_application_version]
    output: Appointment
    side_effects: ["Create Appointment(CONFIRMED); slot -> BOOKED; slot.held_by_appointment_id set", "If BackgroundCheck CLEARED: Application VETTING -> INTERVIEW_SCHEDULED", "increments Application.version by 1", "Write AuditEvent"]

  - method: GET
    path: "/applications/{id}/appointments"
    description: "List appointments for an application (reverse-reachability for Appointment.application_id)"
    roles: [SchedulingAdmin, EnrollmentOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/appointment-slots/{id}/appointments"
    description: "List appointments booked against a slot (reverse-reachability for Appointment.slot_id)"
    roles: [SchedulingAdmin, EnrollmentOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [SchedulingAdmin, EnrollmentOfficer, Applicant]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel a confirmed appointment"
    roles: [Applicant, SchedulingAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Appointment CONFIRMED -> CANCELLED", "slot -> AVAILABLE (cascade)", "If Application INTERVIEW_SCHEDULED -> VETTING (cross-entity)", "increments Application.version by 1"]

  - method: POST
    path: "/appointments/{id}/no-show"
    description: "Mark an elapsed confirmed appointment as a no-show"
    roles: [EnrollmentOfficer]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Appointment CONFIRMED -> NO_SHOW", "slot -> AVAILABLE (cascade)", "If Application INTERVIEW_SCHEDULED -> VETTING (cross-entity)", "increments Application.version by 1"]

  - method: POST
    path: "/appointments/{id}/complete"
    description: "Complete the interview (requires accepted biometrics)"
    roles: [EnrollmentOfficer]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Appointment CONFIRMED -> COMPLETED", "Application INTERVIEW_SCHEDULED -> INTERVIEW_COMPLETE", "increments Application.version by 1", "Write AuditEvent"]

  # --- Biometric Captures ---
  - method: POST
    path: "/biometric-captures"
    description: "Record a biometric capture for an appointment (accept/reject by quality)"
    roles: [EnrollmentOfficer]
