            - "${a2_status} == ACTIVE and ${a2_from} == 2026-08-13T00:00:00.000Z — a gap of exactly three days clears the buffer"
            - "${a2_id} != ${a1_id} and the filtered list holds exactly two assignments with ${first_from} == 2026-08-01T00:00:00.000Z"
            - "the accepted create reused ${circ_v2}, so neither refusal advanced Circulator.${circ_id}.version"

  - rule_id: compensating_invariant
    instances:

      - name: batch_invalidate_reinstate_preserves_signature_ledger
        grounds:
          - state_machines.SignatureBatch.FULLY_CHECKED_to_INVALIDATED
          - state_machines.SignatureBatch.INVALIDATED_to_status_before_invalidation
          - calculations.petition_raw_and_accepted_counts
          - endpoints[POST /signature-batches/{batch_id}/invalidate]
          - endpoints[POST /signature-batches/{batch_id}/reinstate]
        distinguishing_aspect: |
          Conserved quantity: the petition's INTEGER SIGNATURE LEDGER — raw_signature_count,
          accepted_raw_total, verified_valid_count, voided_signature_count and
          qualifying_county_count — together with each line's validation_status. Invalidating a
          fully-checked batch moves every one of those numbers and then reinstating it must restore
          all of them bit-for-bit, including status_before_invalidation and status_before_void being
          cleared back to null. The mid-state is captured explicitly, so an implementation that
          recomputes the ledger from scratch instead of reversing exactly what it removed (or that
          leaves a line VOIDED, or leaves void_reason set) shows up as drift on the return leg.
