            - {call: "POST /false-alarm-program/false-alarm-incidents/${inc_t2}/determination", payload: {determination: "COUNTED"}, as: FalseAlarmReviewOfficer, as_user_id: "rev-2507"}
            - {call: "GET /false-alarm-program/alarm-sites/${site_th}", payload: {}, as: ProgramAdministrator}
            - {call: "GET /false-alarm-program/suspension-orders?alarm_site_id=${site_th}", payload: {}, as: ProgramAdministrator}
          assert:
            - "before the trigger: AlarmSite.${site_th}.chargeable_count_window == 1 and response_status == 'RESPONSE_ACTIVE' (1 < 2)"
            - "after the trigger: AlarmSite.${site_th}.chargeable_count_window == 2 and response_status == 'RESPONSE_PROBATION' (>= is inclusive at exactly 2)"
            - "GET /false-alarm-program/suspension-orders?alarm_site_id=${site_th} returns total_count == 0 (2 < suspension_threshold_count 6, so no proposal)"
            - "FalseAlarmIncident.${inc_t2}.occurrence_index == 2 and assessed_fee_cents == 10000"

      - name: two_ecv_calls_to_one_contact_fall_one_short_of_the_inclusive_distinct_minimum
        grounds:
          - calculations.ecv_verification_sufficiency
          - entities.DispatchRequest.fields.distinct_ecv_contact_count
          - "validations[priority=28]"
        distinguishing_aspect: >-
          Two eligible call attempts placed on the SAME site contact freeze
          distinct_ecv_contact_count at 1, so a TWO_CALL_ECV request is insufficient and its
          validation must fail with 422 ERR_ECV_REQUIREMENT_NOT_MET, while the same two attempts split
          across two contacts reach the inclusive minimum of 2 and validate.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule at program defaults with invoice_due_days 3650."
            - "One RESIDENTIAL AlarmSite with exactly two ACTIVE ECV-callable contacts (so the priority 27 roster minimum of 2 is satisfied and cannot pre-empt the request) and two PERMITTED systems."
            - "Request X on the first system places two attempts on contact 1 only (NO_ANSWER then VOICEMAIL, both eligible outcomes)."
            - "Request Y on the second system places one attempt on each contact."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-05-01T00:00:00Z"}, as: ProgramAdministrator}
            - call: "POST /false-alarm-program/fee-schedules"
