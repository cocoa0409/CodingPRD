        claim_type: Idempotency
        grounds:
          - state_machines.VenueBooking.COUNTERED_to_TERMS_PROPOSED
          - entities.VenueBooking.fields.negotiation_round
        excluded_because:
          difficulty_instance: "non_linear_state_machine / booking_negotiation_cycles_until_the_round_cap_bites"
          rationale: "The cyclic loop's termination condition (MAX_NEGOTIATION_ROUNDS) is exercised round by round, including the refused fourth counter, by that §1.8 instance."

