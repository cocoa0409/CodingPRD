      - name: volunteer_weekly_hour_cap_aggregate_exceeded_rejected
        claim_type: aggregate_validation
        grounds:
          - validations.priority_51_ERR_VOLUNTEER_HOUR_CAP_EXCEEDED
          - calculations.volunteer_hours.constants.VOLUNTEER_WEEKLY_HOUR_CAP
        distinguishing_aspect: "Each assignment is individually legal; only the collective breaches the cap. Two 4.00-hour assignments in the ISO week Monday 2026-08-03 .. Sunday 2026-08-09 reach exactly 8.00 and are admitted, and a third 1.00-hour assignment in the same week is refused."
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-03T00:00:00Z so week_lo is Monday 2026-08-03 and week_hi is Monday 2026-08-10"
            - "one CLEARED volunteer with screening_level FULL and one volunteer_eligible program requiring BASIC"
            - "three non-overlapping sessions inside that week: 4 hours on 2026-08-03, 4 hours on 2026-08-04 and 1 hour on 2026-08-05"
          setup_api_calls:
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ActivityDirector
            - call: "POST /recreation/programs"
              payload: { name: "Cap Chorus", domain: "CREATIVE", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_2", volunteer_eligible: true, required_screening_level: "BASIC" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Cap Chorus Room", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-03T09:00:00Z", ends_at: "2026-08-03T13:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { s1_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-04T09:00:00Z", ends_at: "2026-08-04T13:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { s2_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { s3_id: $.data.id }
            - call: "POST /recreation/volunteers"
              payload: { full_name: "Capped Cal", volunteer_type: "ADULT_COMMUNITY" }
              as: VolunteerCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /recreation/volunteers/${vol_id}/screening"
              payload: { event_type: "BACKGROUND_CHECK_CLEARED", cleared_on: "2026-07-03" }
              as: VolunteerCoordinator
            - call: "POST /recreation/volunteers/${vol_id}/screening"
              payload: { event_type: "ORIENTATION_COMPLETED", completed_on: "2026-07-07" }
              as: VolunteerCoordinator
            - call: "POST /recreation/volunteer-assignments"
              payload: { volunteer_id: "${vol_id}", session_id: "${s1_id}", role_type: "GROUP_ASSISTANT" }
              as: VolunteerCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /recreation/volunteer-assignments"
              payload: { volunteer_id: "${vol_id}", session_id: "${s2_id}", role_type: "GROUP_ASSISTANT" }
              as: VolunteerCoordinator
              captures: { a2_id: $.data.id }
            - call: "GET /recreation/volunteers/${vol_id}"
              as: VolunteerCoordinator
              captures: { hours_at_cap: $.data.scheduled_hours_week }
          trigger:
            - call: "POST /recreation/volunteer-assignments"
