      - name: corner_pressure_check_settles_before_the_gas_blend_check_is_reached
        claim_type: Cascading validation
        grounds:
          - validations[56].ERR_PRESSURE_OUT_OF_BALANCE
          - validations[57].ERR_GAS_BLEND_MISMATCH
          - calculations.gas_balance_target
          - endpoints.POST_balance_records
        distinguishing_aspect: |
          Priority 57 is declared to be evaluated only after the pressure check
          at priority 56 passes, so a proposal wrong on both axes must report
          ERR_PRESSURE_OUT_OF_BALANCE and only a proposal whose psi is inside
          APPLIED_PSI_TOLERANCE can surface ERR_GAS_BLEND_MISMATCH — and neither
          refusal advances BeerLine.version, so all three proposals may carry
          expected_line_version 1.
        test_recipe:
          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE with an ACTIVE contract (21 days, 4 lines, 4175, 7500)."
            - "BeerLine #1 32ft/4ft/0.375in ALE, version 1 (32*0.30 + 4*0.5 + 2.0 = 13.60 psi restriction)."
