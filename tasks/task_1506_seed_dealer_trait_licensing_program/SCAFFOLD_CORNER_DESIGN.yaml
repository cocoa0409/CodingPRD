        claim_type: rbac_denial
        grounds: [roles, "endpoints[POST /dealer/programs/{id}/open]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Program lifecycle operations are DealerAdmin-exclusive; SalesRep gets 403 even on an existing program."
        test_recipe:
          setup: ["program in DRAFT"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /dealer/programs/${prog}/open"
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE, http 403; program stays DRAFT"

      - name: claims_adjuster_cannot_create_plot_forbidden
        claim_type: rbac_denial
        grounds: [roles, "endpoints[POST /dealer/plot-trials]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Plot trials are the Agronomist's resource; ClaimsAdjuster is rejected 403."
        test_recipe:
          setup: ["program; grower; field; variety exist"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/fields"
              payload: { grower_id: "${g}", name: "North 40", acres: 100, soil_type: "LOAM", drainage: "WELL", irrigated: true, prev_crop: "SOYBEAN", maturity_zone: 11 }
              as: SalesRep
              captures: { f: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /dealer/plot-trials"
              payload: { program_id: "${prog}", variety_id: "${v2}", field_id: "${f}", planting_date: "2027-04-15T00:00:00Z", expected_harvest_date: "2027-10-01T00:00:00Z", replication_index: 1 }
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE, http 403"

      - name: grower_can_sign_own_agreement_positive
        claim_type: rbac_allow
        grounds: [roles, "endpoints[POST /dealer/trait-agreements/{id}/sign]", state_machines.TraitAgreement.PENDING_SIGNATURE_to_ACTIVE]
        distinguishing_aspect: "Grower is authorized to sign their own agreement (X-User-ID == agreement.grower_id); the agreement goes ACTIVE."
        test_recipe:
          setup: ["grower G; package VT2P; agreement for (G, VT2P) PENDING_SIGNATURE; default clock 2026-08-01T00:00:00Z inside the window"]
          setup_api_calls:
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id, gver: $.data.version }
            - call: "POST /dealer/trait-packages"
              payload: { code: "VT2P", description: "VT Double PRO", requires_stewardship_agreement: true, refuge_required_bps: 500 }
              as: DealerAdmin
              captures: { tp: $.data.id }
            - call: "POST /dealer/trait-agreements"
              payload: { grower_id: "${g}", trait_package_id: "${tp}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-12-31T23:59:59Z", expected_grower_version: "${gver}" }
              as: DealerAdmin
              captures: { a: $.data.id }
          trigger:
            - call: "POST /dealer/trait-agreements/${a}/sign"
              as: Grower
              as_user_id: "${g}"
              captures: { st: $.data.status }
          assert:
            - "status == ACTIVE when the owning grower signs"

  # ---------------------------------------------------------------------------
  # Section: cross_cutting_layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_grower_version_rejected_on_agreement_create
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[agreement-create-stale-grower]", "errors[ERR_STALE_GROWER_VERSION]"]
        distinguishing_aspect: "Two strictly sequential agreement creates carrying the same captured grower version: the first succeeds (grower version bumps to 2), the second is rejected 412 ERR_STALE_GROWER_VERSION."
        test_recipe:
          setup: ["grower G (version 1 captured); packages VT2P and SS-RR2"]
          setup_api_calls:
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id, gver: $.data.version }
            - call: "POST /dealer/trait-packages"
              payload: { code: "VT2P", description: "VT Double PRO", requires_stewardship_agreement: true, refuge_required_bps: 500 }
              as: DealerAdmin
              captures: { tp1: $.data.id }
            - call: "POST /dealer/trait-packages"
              payload: { code: "SS-RR2", description: "Roundup Ready 2", requires_stewardship_agreement: true, refuge_required_bps: 0 }
              as: DealerAdmin
              captures: { tp2: $.data.id }
          trigger:
            - call: "POST /dealer/trait-agreements"
              payload: { grower_id: "${g}", trait_package_id: "${tp1}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-12-31T23:59:59Z", expected_grower_version: "${gver}" }
              as: DealerAdmin
              captures: { a1: $.data.id }
            - call: "POST /dealer/trait-agreements"
              payload: { grower_id: "${g}", trait_package_id: "${tp2}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-12-31T23:59:59Z", expected_grower_version: "${gver}" }
              as: DealerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first create succeeds (version matched at 1)"
            - "second create with the same captured version 1: error_id == ERR_STALE_GROWER_VERSION, http 412"

      - name: occ_stale_field_version_rejected_on_recommendation_create
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[recommendation-create-stale-field]", "errors[ERR_STALE_FIELD_VERSION]"]
        distinguishing_aspect: "After the first recommendation create bumps the field to version 2, a second create carrying version 1 (the deliberate stale read) is rejected 412 ERR_STALE_FIELD_VERSION."
        test_recipe:
          setup: ["program; grower; field F (version 1 captured); variety SOY-V2"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/fields"
              payload: { grower_id: "${g}", name: "North 40", acres: 100, soil_type: "LOAM", drainage: "WELL", irrigated: true, prev_crop: "SOYBEAN", maturity_zone: 11 }
              as: SalesRep
              captures: { f: $.data.id, fver: $.data.version }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /dealer/recommendations"
              payload: { field_id: "${f}", variety_id: "${v2}", program_id: "${prog}", seeding_rate_seeds_per_acre: 34000, expected_yield_index: 105, expected_field_version: "${fver}" }
              as: Agronomist
              captures: { r1: $.data.id }
            - call: "POST /dealer/recommendations"
              payload: { field_id: "${f}", variety_id: "${v2}", program_id: "${prog}", seeding_rate_seeds_per_acre: 36000, expected_yield_index: 110, expected_field_version: "${fver} - 1" }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "first create succeeds with version 1"
            - "second create with expected_field_version == fver - 1 (i.e. 0, below the live 2): error_id == ERR_STALE_FIELD_VERSION, http 412"

      - name: layer_cascading_side_effects
        claim_type: layer_coverage
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / agreement_suspend_cascades_order_hold_reservation_release_statement_drop
          rationale: "The cascading-side-effects layer is exercised end-to-end by both §1.8 transitive_cascade instances."

      - name: layer_rate_threshold_triggers
        claim_type: layer_coverage
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: boundary_precision_check / commission_volume_tier_exactly_at_min_units
          rationale: "Threshold boundary semantics (>= vs >) for both early-order and commission tiers are covered by the two §1.8 boundary_precision_check instances."

      - name: layer_ops_run_checkpoint
        claim_type: layer_coverage
        grounds: [complexity_profile.complexity_layers, state_machines.SeedProgram]
        excluded_because:
          difficulty_instance: compensating_invariant / prepay_ledger_conserved_through_prepay_refund_reprepay_settle
          rationale: "Epoch-advance behavior (close_sales invoicing sweep, settle application) is exercised there; sweep side-effect details are additionally covered by corner instances close_sales_cancels_drafts_and_expires_recommendations, agreement_past_window_expired_by_close_sales_sweep, and settle_blocked_while_scheduled_ticket_exists."

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_confirm_response_matches_read
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, state_machines.SeedOrder.DRAFT_to_CONFIRMED]
        distinguishing_aspect: "The confirm response already carries the locked pricing, and an immediate GET returns byte-identical derived values (no eventual-consistency lag)."
        test_recipe:
          setup: ["program OPEN; grower; SOY-V2 @18000; lot 500; DRAFT order with 10-unit line; clock 2027-01-10"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 10 }
              as: SalesRep
          trigger:
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
              captures: { c_net: $.data.net_amount_cents, c_disc: $.data.locked_discount_bps, c_st: $.data.status }
            - call: "GET /dealer/orders/${o}"
              as: SalesRep
              captures: { r_net: $.data.net_amount_cents, r_disc: $.data.locked_discount_bps, r_st: $.data.status }
          assert:
            - "confirm response: status CONFIRMED, locked_discount_bps 600, net_amount_cents 169200"
            - "immediate GET returns identical status/locked_discount_bps/net_amount_cents"
