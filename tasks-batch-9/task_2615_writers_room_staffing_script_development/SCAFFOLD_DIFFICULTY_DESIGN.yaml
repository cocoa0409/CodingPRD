          setup:
            - "Agreement AG, season SE (ready_script_target 1), ACTIVE room RM with two CONFIRMED seats: W1 (STORY_EDITOR, 600000, guarantee 0) and W2 (CO_PRODUCER, 900000, guarantee 0)."
            - "Episode E1 (ONE_HOUR) carries two APPROVED assignments: TELEPLAY by W1 (three milestones) and STORY by W2 (a single OUTLINE milestone), so both writers are credit-eligible and E1.credit_status is SUBMISSIONS_OPEN."
            - "Three credit submissions exist: W1 claims 60, W2 claims 30, and W3 (no assignment on E1) claims 25."
            - "Three panel arbiters A1, A2, A3 are registered writers with neither an assignment nor a submission on E1."
