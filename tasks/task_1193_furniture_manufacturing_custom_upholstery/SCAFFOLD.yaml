  - { method: GET, path: "/mill/cut-plans", description: "List cut plans with filters", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["order_line_id?", "limit?", "offset?"], output: "CutPlan[]", side_effects: [] }
  - { method: GET, path: "/mill/cut-plans/{id}", description: "Get a cut plan", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: CutPlan, side_effects: [] }
  - { method: POST, path: "/mill/cut-plans/{id}/approve", description: "Approve a DRAFT plan; computes final required yards", roles: [ProductionPlanner], code: 200, input: [marker_length_yards], output: CutPlan, side_effects: ["fabric_requirement_final computed and copied to line.required_yards_final; ERR_INSUFFICIENT_ALLOCATION if allocated < final"] }
  - { method: POST, path: "/mill/cut-plans/{id}/revise", description: "Send an APPROVED plan back to DRAFT (marker revision loop)", roles: [ProductionPlanner], code: 200, input: [], output: CutPlan, side_effects: ["line.required_yards_final cleared to null"] }
  - { method: POST, path: "/mill/cut-plans/{id}/record-cut", description: "Record cutting execution against an APPROVED plan; consumes allocations", roles: [ProductionPlanner], code: 200, input: [], output: CutPlan, side_effects: ["allocations consumed in created_at ASC up to required_yards_final; excess → RELEASED; utilization_pct and waste_yards computed; depleted lots → DEPLETED; line → CUT"] }

