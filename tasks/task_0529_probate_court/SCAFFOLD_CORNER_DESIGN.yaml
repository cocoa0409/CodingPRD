  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: estate_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Estate.fields.version, state_machines.Petition.PENDING_to_GRANTED]
        distinguishing_aspect: "Estate.version starts at 1 and increments by exactly 1 on each estate-mutating transition (grant bumps 1 -> 2)."
        test_recipe:
          setup: ["A DRAFT estate (version 1) with a PENDING petition."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "VI", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
          assert:
            - "Estate.${est_id}.version == 2 (was 1 at creation, +1 on grant)"

