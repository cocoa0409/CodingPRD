          license_number: L-OB1
          license_state: CA
          brokerage_id: ${ob}
        as: PlatformAdmin
        captures:
          aob1: $.data.id
      - call: POST /listings
        payload:
          external_ref: EXT-1
          market_id: ${mkt14}
          source_feed: BROKER_DIRECT
          brokerage_id: ${ob}
          listing_agent_id: ${aob1}
        as: BrokerageUser
        as_user_id: ${ob}
        captures:
