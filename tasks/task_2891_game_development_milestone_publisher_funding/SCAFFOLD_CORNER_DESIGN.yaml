          setup:
            - "Agreement Aurora Solo (advance 3600000, single ALPHA milestone funded 3600000) is ACTIVE; build 1 (75.00 / 96.00 / 60.00 / 5) passed and was REJECTED, so the milestone is back in IN_DEVELOPMENT with latest_build_number 1."
