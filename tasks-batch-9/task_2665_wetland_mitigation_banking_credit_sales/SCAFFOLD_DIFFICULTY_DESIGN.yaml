              payload: { sponsor_id: "${sponsor_id}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002", "03130003"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_id: $.data.id, required: $.data.stewardship_required_cents }
          assert:
            - "MitigationBank.${bank_id}.stewardship_required_cents == 113680000"
            - "MitigationBank.${bank_id}.stewardship_required_cents != 186666667 (the fixed-point solve is wrong)"
            - "MitigationBank.${bank_id}.stewardship_required_cents != 112000000 (the admin fee must be added)"
            - "MitigationBank.${bank_id}.stewardship_funded_cents == 0"
            - "MitigationBank.${bank_id}.status == DRAFT"
            - "MitigationBank.${bank_id}.sales_posture == FROZEN"
            - "MitigationBank.${bank_id}.easement_recorded == false"

  - rule_id: non_linear_state_machine
    instances:

      - name: prospectus_revision_cycle_resets_tallies_then_approves_in_round_two
        grounds:
          - state_machines.Prospectus
          - entities.Prospectus.fields.revision_round
          - entities.Prospectus.fields.concur_count
          - entities.ProspectusVote.fields.revision_round
          - endpoints.POST_/mitigation/prospectuses/{id}/finalize-review
        distinguishing_aspect: |
          CYCLIC shape: UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW is a true loop,
          and re-entering it is not a no-op — revision_round increments to 2, review_opened_at is reset
          to null, and the vote tallies are re-scoped so the round-1 votes (1 CONCUR / 1 OBJECT /
          1 ABSTAIN) stop counting entirely. The same three members then vote CONCUR in round 2 and the
          supermajority is measured against round-2 votes only.
