        grounds:
          - calculations.restaurant_eligibility_selection
          - endpoints[GET /meal-programs/{id}/eligible-restaurants]
        distinguishing_aspect: "Selection filters on status, cuisine membership and min(program radius, own radius), then ranks by distance ASC and name ASC: Thai Annex and Thai Garden both sit at 5.000 km so the name breaks the tie, Thai Local at 3.000 km is still excluded because its own 2 km radius binds, and a dock 30 km out yields 200 with an empty array rather than a 404."
        test_recipe:
          setup:
            - "Acme Corp program with eligible_cuisines [THAI, SALAD] and max_delivery_radius_km 8.0."
            - "Docks: HQ Lobby at (0,0) and Far Dock at (0,30)."
            - "Restaurants: Thai Garden THAI (3,4) radius 10; Thai Annex THAI (0,5) radius 10; Thai Local THAI (0,3) radius 2; Salad Mid SALAD (6,0) radius 12; Sushi Nine SUSHI (1,0) radius 12; Pizza Rim PIZZA (0,9) radius 12."
