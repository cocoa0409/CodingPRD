              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /turn-ins/${ti1}/review"
              payload: { decision: "ACCEPT" }
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles"
              payload: { asset_id: "${a1}", opens_at: "2026-08-01T00:00:00Z", tier_window_days: 5 }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /screening-cycles/${cyc}/advance-tier"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles/${cyc}/advance-tier"
              payload: {}
