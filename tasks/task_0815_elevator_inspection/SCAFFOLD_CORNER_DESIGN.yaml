  - section: consistency_model
    instances:
      - name: outstanding_balance_visible_immediately_after_citation
        claim_type: immediate
        grounds:
          - "calculations.device_outstanding_balance_cents"
          - "entities.Device.fields.outstanding_balance_cents"
        distinguishing_aspect: "Immediately after a MINOR citation issues, a GET /devices/{id} reflects outstanding_balance_cents == 18044 (10000 registration + 8044 citation surcharge) in the same request cycle."
        test_recipe:
          setup: ["PASSENGER device (registration fee unpaid, 10000) with one MINOR citation just issued (surcharge 8044)."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "H1 Co", contact_email: "h1@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "H1 Insp", license_number: "H-1", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "H1", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "PERIODIC", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins_id}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: { result: "CONDITIONAL", deficiencies: [ { code: "H1-1", severity: "MINOR", description: "n" } ] }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /deficiencies?inspection_id=${ins_id}"
              payload: { inspection_id: "${ins_id}" }
              as: Registrar
              captures: { def_id: "$.data[0].id" }
            - call: "POST /citations"
              payload: { deficiency_id: "${def_id}" }
              as: Registrar
          trigger:
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Registrar
              captures: { bal: "$.data.outstanding_balance_cents" }
          assert:
            - "Device.${dev_id}.outstanding_balance_cents == 18044 (10000 + 8044)"

  - section: errors
    instances:
      - name: error_open_deficiencies_exist_on_certificate
        claim_type: Violation to Error
        grounds: ["errors[ERR_OPEN_DEFICIENCIES_EXIST]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / certificate_zero_open_deficiencies_empty_set"
          rationale: "The empty-set deficiency boundary on certificate issuance is asserted as that §1.8 instance's failure path."
      - name: error_inspector_schedule_conflict_on_assign
        claim_type: Violation to Error
        grounds: ["errors[ERR_INSPECTOR_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / inspector_halfopen_buffer_conflict"
          rationale: "The inspector half-open+buffer overlap is the trigger of that §1.8 instance."
      - name: error_oos_order_overlap_on_create
        claim_type: Violation to Error
        grounds: ["errors[ERR_OOS_ORDER_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / oos_order_closed_interval_touch"
          rationale: "The closed-interval OOS overlap is the trigger of that §1.8 instance."
      - name: error_source_inspection_not_passed_on_certificate
        claim_type: Violation to Error
        grounds: ["errors[ERR_SOURCE_INSPECTION_NOT_PASSED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / certificate_requires_source_inspection_passed"
          rationale: "Asserted as that §1.8 instance's failure path."
      - name: error_device_not_operable_on_start
        claim_type: Violation to Error
        grounds: ["errors[ERR_DEVICE_NOT_OPERABLE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / inspection_start_requires_device_operable"
          rationale: "Asserted as that §1.8 instance's failure path."
      - name: error_inspection_device_mismatch_on_certificate
        claim_type: Violation to Error
        grounds: ["errors[ERR_INSPECTION_DEVICE_MISMATCH]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / certificate_referential_over_fiscal"
          rationale: "The referential mismatch is the winning error of that §1.8 priority conflict."

