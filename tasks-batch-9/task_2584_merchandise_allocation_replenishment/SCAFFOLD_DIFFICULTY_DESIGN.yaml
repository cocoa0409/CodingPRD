          assert:
            - "Link 1 - AllocationLine.${l_s1}.units_allocated == 26, ${l_s3} == 10, ${l_s4} == 8, all with fulfillment_status PENDING; no line exists for store 0102 (need 0)"
            - "Link 2 - Receipt.${rcpt_id}.units_committed == 44 and units_unallocated == 0"
            - "Link 3 - Receipt.${rcpt_id}.status == ALLOCATED (it would have stayed ALLOCATING for any pool > 44)"
            - "Link 4 - AllocationProgram.${prog_id}.total_units_received == 44, total_units_committed == 44, open_reserve_units == 0"
            - "AllocationRun.${run_id}.status == COMMITTED, units_committed == 44, unallocated_remainder_units == 0, committed_by_user_id == u-mgr-1 and proposed_by_user_id == u-alloc-1"
            - "StorePosition.${p1_id}.on_hand_units is still 6 and in_transit_units still 0 - the commit books the ledger only, it does not move stock"
      - name: store_closed_cascades_position_exit_then_item_lifecycle
        grounds:
          - state_machines[Store].transitions[CLOSING->CLOSED].side_effects
          - calculations.assortment_health_derivation
          - entities.StorePosition.fields.assortment_status
          - entities.Item.fields.lifecycle_state
          - validations[priority:27]
        distinguishing_aspect: |
          A third trigger and a three-link chain that removes rather than repairs: CLOSED forces
          assortment_status = EXITED on every position of the store (link 1), the EXITED position stops
          counting toward the item's broken_store_count (link 2), and the item re-derives BROKEN -> ACTIVE
          (link 3) even though no unit of stock moved anywhere. The chain is also gated: 0102 cannot close
          at all while it still holds 12 units, so the cascade never starts there.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with stores 0101(A,URBAN) and 0102(B,URBAN), shelf plans capacity 24 / pmin 8 effective 2026-07-01 open-ended"
            - "SizeProfile TOP-4SZ with all four sizes CORE; SKU-1001 SEASONAL"
            - "Position 0101 is empty (on_hand 0, size_on_hand []) so all four CORE sizes are missing -> broken_size_count 4, BROKEN, and the item is BROKEN"
            - "Position 0102 holds 12 units across all four sizes -> COMPLETE"
            - "A detection sweep has raised one PENDING MARKDOWN AssortmentAction for (SKU-1001, store 0101) because an empty position has nothing to consolidate"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
