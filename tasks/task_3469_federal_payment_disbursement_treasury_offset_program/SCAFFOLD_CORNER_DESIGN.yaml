# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_3469
# §1.9 Coverage Index: every testable claim of §1.1–§1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise.
# Anchors are file-local. Default logical clock: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: payee_create_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Payee
          - endpoints.POST /payees
        distinguishing_aspect: "A payee created with the four documented inputs returns 201 with a server-minted UUID id, version 1, non-null created_at/updated_at, and the envelope's meta block — no client-supplied identity fields are involved."
        test_recipe:
          setup:
            - "Logical clock set to 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: TreasurySupervisor
          trigger:
            - &k_payee1
              call: "POST /payees"
              payload: { tin: "111-22-3333", tin_type: "SSN", legal_name: "Pat Doe", routing_number: "021000021", account_last4: "4321" }
              as: TreasuryOperator
              captures: { payee_1: $.data.id, payee_v: $.data.version, payee_created: $.data.created_at }
          assert:
            - "the response status is 201 and response_type is object"
            - "Payee.${payee_1}.tin == \"111-22-3333\" and tin_type == SSN and legal_name == \"Pat Doe\""
            - "Payee.${payee_1}.version == 1 and created_at/updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: creditor_state_code_conditional_requirement
        claim_type: Type Constraints
        grounds:
          - entities.CreditorAgency.fields.state_code
          - errors.ERR_STATE_CODE_REQUIRED
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "state_code is conditionally required by creditor_type: a STATE creditor without it fails 400 ERR_STATE_CODE_REQUIRED, while a FEDERAL creditor carrying it fails 400 ERR_INVALID_REQUEST — the same field is required in one enum branch and forbidden in the other."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /creditor-agencies"
              payload: { creditor_code: "CA-FTB", legal_name: "California Franchise Tax Board", creditor_type: "STATE" }
              as: TreasurySupervisor
              captures: { err_1: $.data.error_id }
            - call: "POST /creditor-agencies"
              payload: { creditor_code: "IRS-7469", legal_name: "Federal Test Creditor", creditor_type: "FEDERAL", state_code: "CA" }
              as: TreasurySupervisor
              captures: { err_2: $.data.error_id }
          assert:
            - "first request: 400 with error_id == ERR_STATE_CODE_REQUIRED"
            - "second request: 400 with error_id == ERR_INVALID_REQUEST and error_id != ERR_STATE_CODE_REQUIRED"
            - "no CreditorAgency rows persist from either request"

      - name: payment_file_get_round_trips_derived_totals
        claim_type: Retrieval
        grounds:
          - entities.PaymentFile.fields.payment_count
          - entities.PaymentFile.fields.total_offset_cents
          - endpoints.GET /payment-files/{paymentFileId}
        distinguishing_aspect: "A file with one un-evaluated payment reads back status PROCESSING, payment_count 1, and both totals 0 — the derived fields reflect intake state, not nulls."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Payee and FULL VENDOR policy present; one file with one 25000-cent VENDOR payment."
          setup_api_calls:
            - *k_clock
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "VENDOR", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_v: $.data.id }
            - call: "POST /exemption-policies/${pol_v}/activate"
              payload: {}
              as: TreasurySupervisor
            - &k_file1
              call: "POST /payment-files"
              payload: { agency_code: "AG-01", settlement_date: "2026-09-15T00:00:00Z" }
              as: PaymentAgencyAnalyst
              captures: { file_1: $.data.id }
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 25000, payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
          trigger:
            - call: "GET /payment-files/${file_1}"
              payload: {}
              as: Auditor
          assert:
            - "PaymentFile.${file_1}.agency_code == \"AG-01\" and settlement_date == 2026-09-15T00:00:00Z"
            - "PaymentFile.${file_1}.status == PROCESSING and payment_count == 1"
            - "PaymentFile.${file_1}.total_offset_cents == 0 and total_disbursed_cents == 0"

      - name: payments_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET /payments
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three payments in one file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count describes the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Payee and FULL VENDOR policy present; one file with three VENDOR payments."
          setup_api_calls:
            - *k_clock
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "VENDOR", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_v: $.data.id }
            - call: "POST /exemption-policies/${pol_v}/activate"
              payload: {}
              as: TreasurySupervisor
            - *k_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 10000, payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 20000, payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 30000, payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
          trigger:
            - call: "GET /payments"
              payload: { payment_file_id: "${file_1}", limit: 2, offset: 0 }
              as: Auditor
            - call: "GET /payments"
              payload: { payment_file_id: "${file_1}", limit: 2, offset: 2 }
              as: Auditor
          assert:
            - "first page: 2 rows, total_count == 3, has_more == true, response_type == array"
            - "second page: 1 row, total_count == 3, has_more == false"
            - "GET /payments with no parameters uses limit 10 and offset 0"

      - name: debt_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET /debts/{debtId}
          - errors.ERR_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but unallocated UUID in the path yields 404 ERR_NOT_FOUND with the error envelope, not a 400 and not an empty 200."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /debts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Auditor
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: payment_create_missing_amount_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Payment.fields.amount_cents
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "amount_cents is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST at the schema priority, before any existence or policy check runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Payee and FULL VENDOR policy present; one file."
          setup_api_calls:
            - *k_clock
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "VENDOR", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_v: $.data.id }
            - call: "POST /exemption-policies/${pol_v}/activate"
              payload: {}
              as: TreasurySupervisor
            - *k_file1
          trigger:
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /payments?payment_file_id=${file_1} returns 0 rows"

      - name: debt_create_defaults_and_starts_referred
        claim_type: Defaults
        grounds:
          - entities.Debt.fields.due_process_completed
          - entities.Debt.fields.returned_count
          - entities.Debt.fields.current_balance_cents
          - state_machines.Debt
        distinguishing_aspect: "A referral omitting notice_sent_at and due_process_completed starts REFERRED with due_process_completed false, returned_count 0, and current_balance_cents copied from original_amount_cents — the notice shortcut is the only way to start NOTICED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Federal creditor present."
          setup_api_calls:
            - *k_clock
            - &k_cred_fed
              call: "POST /creditor-agencies"
              payload: { creditor_code: "IRS-7469", legal_name: "Federal Test Creditor", creditor_type: "FEDERAL" }
              as: TreasurySupervisor
              captures: { cred_fed: $.data.id }
          trigger:
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 50000, delinquent_since: "2026-01-15T00:00:00Z" }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
          assert:
            - "Debt.${debt_1}.status == REFERRED and due_process_completed == false and notice_sent_at is null"
            - "Debt.${debt_1}.current_balance_cents == 50000 and returned_count == 0"
            - "Debt.${debt_1}.priority_rank == 30"

      - name: payment_method_determination_eft_vs_check
        claim_type: Computed Fields
        grounds:
          - calculations.payment_method_determination
          - entities.Payment.fields.payment_method
        distinguishing_aspect: "payment_method is computed at intake from the payee's routing_number: the EFT payee's payment reads EFT and the no-routing payee's payment reads CHECK — client input cannot set it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. FULL VENDOR policy ACTIVE; payee A has routing_number, payee B does not."
          setup_api_calls:
            - *k_clock
            - *k_payee1
            - call: "POST /payees"
              payload: { tin: "555-66-7777", tin_type: "SSN", legal_name: "Sam Poe" }
              as: TreasuryOperator
              captures: { payee_2: $.data.id }
            - call: "POST /exemption-policies"
              payload: { payment_type: "VENDOR", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_v: $.data.id }
            - call: "POST /exemption-policies/${pol_v}/activate"
              payload: {}
              as: TreasurySupervisor
            - *k_file1
          trigger:
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 10000, payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
              captures: { pay_a: $.data.id, pay_a_method: $.data.payment_method }
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_2}", payee_tin: "555-66-7777", amount_cents: 10000, payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
              captures: { pay_b: $.data.id, pay_b_method: $.data.payment_method }
          assert:
            - "Payment.${pay_a}.payment_method == EFT (routing_number present)"
            - "Payment.${pay_b}.payment_method == CHECK (routing_number null)"

      - name: debt_priority_rank_computed_from_debt_type
        claim_type: Computed Fields
        grounds:
          - calculations.priority_rank_mapping
          - entities.Debt.fields.priority_rank
        distinguishing_aspect: "priority_rank is derived from debt_type at creation: CHILD_SUPPORT 10, FEDERAL_TAX 20, FEDERAL_NONTAX 30, STATE_TAX 40, STATE_OTHER 50 — lower offsets first in the waterfall."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Federal creditor and STATE creditor (WA) present."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - call: "POST /creditor-agencies"
              payload: { creditor_code: "WA-DOR", legal_name: "Washington Department of Revenue", creditor_type: "STATE", state_code: "WA" }
              as: TreasurySupervisor
              captures: { cred_wa: $.data.id }
          trigger:
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "CHILD_SUPPORT", original_amount_cents: 10000, delinquent_since: "2026-01-15T00:00:00Z" }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { d_cs: $.data.id, d_cs_rank: $.data.priority_rank }
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_wa}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "STATE_OTHER", original_amount_cents: 10000, delinquent_since: "2026-01-15T00:00:00Z" }
              as: CreditorAnalyst
              as_user_id: "${cred_wa}"
              captures: { d_so: $.data.id, d_so_rank: $.data.priority_rank }
          assert:
            - "Debt.${d_cs}.priority_rank == 10"
            - "Debt.${d_so}.priority_rank == 50"
            - "both debts start REFERRED (no notice supplied)"

      - name: payee_create_client_supplied_version_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.Payee
          - endpoints.POST /payees
        distinguishing_aspect: "System-managed fields are ignored on input: a create body carrying version 99 and a forged id persists version 1 and a server-minted id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /payees"
              payload: { tin: "999-88-7777", tin_type: "EIN", legal_name: "Forged Fields Inc", version: 99, id: "00000000-0000-4000-8000-0000000000ff" }
              as: TreasuryOperator
              captures: { payee_x: $.data.id, payee_x_v: $.data.version }
          assert:
            - "the response status is 201"
            - "Payee.${payee_x}.version == 1 (client-supplied 99 ignored)"
            - "Payee.${payee_x}.id != 00000000-0000-4000-8000-0000000000ff (server-minted id)"

      - name: payment_create_unknown_payee_returns_payee_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Payment.fields.payee_id
          - errors.ERR_PAYEE_NOT_FOUND
          - errors.ERR_CREDITOR_NOT_FOUND
          - errors.ERR_OFFSET_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: "Body foreign keys are validated at the existence priority with entity-specific 404s: an unknown payee_id on payment create yields ERR_PAYEE_NOT_FOUND, an unknown creditor_agency_id on debt create yields ERR_CREDITOR_NOT_FOUND, an unknown offset_id on claim filing yields ERR_OFFSET_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. FULL VENDOR policy ACTIVE; one file."
          setup_api_calls:
            - *k_clock
            - call: "POST /exemption-policies"
              payload: { payment_type: "VENDOR", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_v: $.data.id }
            - call: "POST /exemption-policies/${pol_v}/activate"
              payload: {}
              as: TreasurySupervisor
            - *k_file1
          trigger:
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "00000000-0000-4000-8000-000000000001", payee_tin: "111-22-3333", amount_cents: 10000, payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
              captures: { err_1: $.data.error_id }
            - call: "POST /debts"
              payload: { creditor_agency_id: "00000000-0000-4000-8000-000000000002", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 10000, delinquent_since: "2026-01-15T00:00:00Z" }
              as: CreditorAnalyst
              as_user_id: "00000000-0000-4000-8000-000000000002"
              captures: { err_2: $.data.error_id }
            - call: "POST /refund-claims"
              payload: { offset_id: "00000000-0000-4000-8000-000000000003", claimed_amount_cents: 100, reason: "DEBT_NOT_OWED" }
              as: TreasuryOperator
              captures: { err_3: $.data.error_id }
          assert:
            - "payment create: 404 with err_1 == ERR_PAYEE_NOT_FOUND"
            - "debt create: 404 with err_2 == ERR_CREDITOR_NOT_FOUND"
            - "claim filing: 404 with err_3 == ERR_OFFSET_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: policy_activate_supersedes_incumbent_to_retired
        claim_type: Valid Transition
        grounds:
          - state_machines.ExemptionPolicy.DRAFT_to_ACTIVE
          - entities.ExemptionPolicy.fields.status
        distinguishing_aspect: "Activating a second DRAFT policy for the same payment_type retires the incumbent: after P2 (PARTIAL, protected 1000) supersedes P1 (FULL), a 10000-cent SALARY payment projects 9000 under P2's rules — P1's FULL behavior (projection 10000) is gone, proving P1 is RETIRED without any policy GET endpoint."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. SALARY policy P1 FULL created and ACTIVE."
          setup_api_calls:
            - *k_clock
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "SALARY", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_1: $.data.id }
            - call: "POST /exemption-policies/${pol_1}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /exemption-policies"
              payload: { payment_type: "SALARY", exemption_class: "PARTIAL", protected_minimum_cents: 1000, max_offset_pct: 0.50 }
              as: TreasurySupervisor
              captures: { pol_2: $.data.id }
            - *k_file1
          trigger:
            - call: "POST /exemption-policies/${pol_2}/activate"
              payload: {}
              as: TreasurySupervisor
              captures: { pol_2_status: $.data.status }
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 10000, payment_type: "SALARY" }
              as: PaymentAgencyAnalyst
              captures: { pay_1: $.data.id, pay_1_proj: $.data.projected_offset_cents }
          assert:
            - "ExemptionPolicy.${pol_2}.status == ACTIVE after activation"
            - "the incumbent ${pol_1} is RETIRED (superseded): observable because Payment.${pay_1}.projected_offset_cents == 9000 (max(0, 10000 - 1000)) instead of the FULL-policy 10000"

      - name: debt_activate_from_referred_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Debt
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "activate is defined only from NOTICED; calling it on a REFERRED debt (notice never recorded) is a 409 ERR_INVALID_STATE — the due-process gate cannot be jumped."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Federal creditor with a REFERRED debt (no notice)."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 50000, delinquent_since: "2026-01-15T00:00:00Z" }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
          trigger:
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Debt.${debt_1}.status remains REFERRED"

      - name: payment_execute_from_verified_returns_not_executable
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Payment
          - errors.ERR_PAYMENT_NOT_EXECUTABLE
        distinguishing_aspect: "execute requires EVALUATED; a VERIFIED payment with CLEAR integrity (no do-not-pay involvement) fails with 409 ERR_PAYMENT_NOT_EXECUTABLE — matching can never be skipped."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Payee and FULL VENDOR policy ACTIVE; one 25000-cent VENDOR payment in VERIFIED."
          setup_api_calls:
            - *k_clock
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "VENDOR", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_v: $.data.id }
            - call: "POST /exemption-policies/${pol_v}/activate"
              payload: {}
              as: TreasurySupervisor
            - *k_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 25000, payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
              captures: { pay_1: $.data.id }
          trigger:
            - call: "POST /payments/${pay_1}/execute"
              payload: {}
              as: TreasuryOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PAYMENT_NOT_EXECUTABLE"
            - "Payment.${pay_1}.processing_status remains VERIFIED and total_offset_cents == 0"

      - name: settled_payment_reverse_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Payment
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "SETTLED is terminal: after the settlement sweep flips an executed payment, reverse is a 409 ERR_INVALID_STATE — remediation past settlement must go through refund claims, not reversal."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Federal creditor, payee, FULL SALARY policy, ACTIVE 50000-cent debt, and a 30000-cent SALARY payment executed in a file whose settlement_date is 2026-09-15."
          setup_api_calls:
            - *k_clock
            - *k_cred_fed
            - *k_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "SALARY", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_s: $.data.id }
            - call: "POST /exemption-policies/${pol_s}/activate"
              payload: {}
              as: TreasurySupervisor
            - &k_debt50
              call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 50000, delinquent_since: "2026-01-15T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
            - &k_debt50_act
