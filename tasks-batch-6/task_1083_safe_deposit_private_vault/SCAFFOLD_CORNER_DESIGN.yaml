      - name: unauthenticated_request_rejected
        claim_type: role_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request missing X-User-Role/X-User-ID → ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /vault/branches", payload: { name: "NoAuth", code: "NA1", viewing_room_capacity: 2 }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "http_status == 401"

  # ------------------------------------------------- cross-cutting layers (OCC)
  - section: cross_cutting_complexity_layers
    instances:
      - name: rental_adjust_plan_stale_version_conflict
        claim_type: occ_conflict
        grounds:
          - "concurrency_rules[rental-plan-adjust-stale]"
          - endpoints
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: |
          After a successful adjust-plan bumps Rental.version, a second adjust-plan still carrying the
          pre-bump version is rejected with ERR_STALE_VERSION (412). Two strictly sequential requests.
        test_recipe:
          setup: ["Rental ACTIVE; capture its version after activation (rv1)."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Occ", code: "OC1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "OC-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Occ User", email: "occ@x.com", gov_id_ref: "G-47", date_of_birth: "1987-07-27" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin, captures: { rv1: "$.data.version" } }
            - { call: "POST /vault/rentals/${rental_id}/adjust-plan", payload: { autopay_enabled: true, expected_rental_version: "${rv1}" }, as: VaultAdmin }
          trigger:
            - { call: "POST /vault/rentals/${rental_id}/adjust-plan", payload: { autopay_enabled: false, expected_rental_version: "${rv1}" }, as: VaultAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "http_status == 412"

  # --------------------------------------------------------- consistency model
  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate
        grounds:
          - entities.Box
          - endpoints
        distinguishing_aspect: "A box GET immediately after creation returns the persisted record in the same envelope."
        test_recipe:
          setup: ["Branch + box-type exist."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Imm", code: "IM1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "SMALL", annual_rate_cents: 12000, height_mm: 50, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "IM-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
          trigger:
            - { call: "GET /vault/boxes/${box_id}", payload: {}, as: Any }
          assert:
            - "Box(${box_id}).box_number == IM-1"
            - "Box(${box_id}).status == AVAILABLE"

  # ------------------------------------------------- excluded (covered by §1.8)
  - section: state_machines
    instances:
      - name: appointment_overlap_same_box_excluded
        claim_type: invalid_transition
        grounds:
          - "errors[ERR_APPOINTMENT_OVERLAP]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / box_appointment_overlap_half_open
          rationale: "Same-box half-open overlap rejection is fully asserted by the named §1.8 instance."

      - name: checkin_compliance_hold_excluded
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_COMPLIANCE_HOLD]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / checkin_compliance_hold_beats_state
          rationale: "ERR_COMPLIANCE_HOLD on check-in is the winning branch of the named §1.8 priority-pair instance."

      - name: dual_control_witness_excluded
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUAL_CONTROL_REQUIRED]"
        excluded_because:
          difficulty_instance: boundary_precision_check / dual_control_witness_count_boundary
          rationale: "ERR_DUAL_CONTROL_REQUIRED at witness_count boundary is asserted by the named §1.8 instance."

      - name: payment_reverse_ledger_excluded
        claim_type: Compensation
        grounds:
          - state_machines.Payment.CLEARED_to_REVERSED
        excluded_because:
          difficulty_instance: compensating_invariant / payment_reverse_restores_balance
          rationale: "Payment reverse ledger restoration is asserted by the named §1.8 compensating-invariant instance."
