      - name: dispute_window_day45_allowed_day46_expired
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_DISPUTE_WINDOW_EXPIRED]
        distinguishing_aspect: "The 45-day dispute window is inclusive: a dispute created exactly at determined_at + 45 days succeeds; at +46 days it fails with ERR_DISPUTE_WINDOW_EXPIRED."
        test_recipe:
          setup:
            - "Provider PWI; edit EWI (DENY, PROFESSIONAL) ACTIVE"
            - "Claims W1 and W2 (30000 each): hits upheld at default clock -> both DENIED with determined_at 2026-08-01T00:00:00Z"
