              payload: { procedure_code: "ADAS-CAL-A", source: "OEM_PORTAL", operation_scope: "ADAS", requires_calibration: true, calibration_type: "STATIC" }
              as: Technician
              as_user_id: "tech-001"
              captures: { pr1_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/procedure-records"
              payload: { procedure_code: "ADAS-CAL-B", source: "OEM_PORTAL", operation_scope: "ADAS", requires_calibration: true, calibration_type: "STATIC" }
              as: Technician
              as_user_id: "tech-001"
              captures: { pr2_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/procedure-records"
              payload: { procedure_code: "ADAS-CAL-C", source: "OEM_PORTAL", operation_scope: "ADAS", requires_calibration: true, calibration_type: "STATIC" }
              as: Technician
              as_user_id: "tech-001"
              captures: { pr3_id: $.data.id }
            - call: "POST /procedure-records/${pr1_id}/calibration-schedule"
              payload: { bay_id: "${bay_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T11:00:00Z" }
