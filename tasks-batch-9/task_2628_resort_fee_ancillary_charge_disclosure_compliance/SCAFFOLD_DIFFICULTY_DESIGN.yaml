      - name: regulator_inquiry_remediation_rejection_round_trip_cycle
        grounds:
          - state_machines.RegulatorInquiry
          - state_machines.RegulatorInquiry.REMEDIATION_REQUIRED_to_REMEDIATION_SUBMITTED
          - state_machines.RegulatorInquiry.REMEDIATION_SUBMITTED_to_REMEDIATION_REQUIRED
          - entities.RegulatorInquiry.fields.remediation_round
          - validations[priority=40]
        distinguishing_aspect: |
          RegulatorInquiry re-enters REMEDIATION_REQUIRED after a rejection, and
          the second occupancy differs from the first: remediation_round is 2, a
          rejection_reason is set, and the profile that had reached REMEDIATED is
          driven back to FLAGGED — so the operator must remediate twice before
