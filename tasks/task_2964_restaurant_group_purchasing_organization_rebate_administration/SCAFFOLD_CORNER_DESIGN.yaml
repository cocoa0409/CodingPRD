            - "call 9: 201 — a REJECTED dispute is terminal and no longer blocks, so ${d2_id} opens with accrual_status_before == ACCRUED and drives ${a1_id} back to DISPUTED"
            - "GET /disputes with accrual_id == ${a1_id} returns total_count == 2, and only ${d2_id} has status == OPEN"

