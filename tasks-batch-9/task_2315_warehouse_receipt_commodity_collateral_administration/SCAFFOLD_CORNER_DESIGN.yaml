                damage_pct: 2.0
                foreign_material_pct: 1.0
                dockage_pct: 0.0
                fill_start_at: "2026-08-09T09:00:00Z"
                fill_end_at: "2026-08-09T11:00:00Z"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
