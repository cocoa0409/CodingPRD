  # =====================================================================
  - section: calculations
    instances:

      - name: corner_effective_submission_date_rolls_over_at_the_cutoff_hour
        claim_type: boundary_edge
        grounds:
          - calculations.effective_submission_date
          - endpoints[GET /expediting/orders/{id}/feasibility]
          - entities.Order.fields.effective_submission_date
        distinguishing_aspect: "The cutoff comparison is strict: at 2026-06-01T20:00:00Z a STANDARD order reports effective_submission_date 2026-06-01, and at exactly 2026-06-01T21:00:00Z (STANDARD_CUTOFF_HOUR_UTC) it rolls to 2026-06-02."
        test_recipe:
          setup:
            - "One STANDARD order with one applicant, quoted."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Cutoff One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
          trigger:
            - call: "GET /expediting/orders/${ord_id}/feasibility"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { esd_before: $.data.effective_submission_date }
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T21:00:00Z" }
              as: PlatformAdmin
            - call: "GET /expediting/orders/${ord_id}/feasibility"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { esd_at: $.data.effective_submission_date }
          assert:
            - "${esd_before} == 2026-06-01"
            - "${esd_at} == 2026-06-02"

