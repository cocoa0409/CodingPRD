            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L1-T1", received_qty: 100, unit_cost_cents: 100, expiration_date: "2027-01-01" }, as: PharmacyTech }
            - { call: "POST /compounding-benches", payload: { bench_code: "BN-T1", supports_controlled: true }, as: PharmacyAdmin, captures: { bench: $.data.id } }
