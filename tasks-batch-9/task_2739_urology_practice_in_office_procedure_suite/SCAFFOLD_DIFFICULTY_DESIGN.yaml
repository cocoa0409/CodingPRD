            - "clock pinned at 2026-09-16T10:00:00Z, the case start instant, so completed_at is that value and therapy_start_by is 2026-10-16"
            - "the case is carried all the way to COMPLETED because ACCEPT requires it"
            - "program BEHAVIORAL_TRAINING has PROGRAM_VISIT_CAP 4, so the cap does not bind and visits_authorized is min(2, 2, 4) == 2"
