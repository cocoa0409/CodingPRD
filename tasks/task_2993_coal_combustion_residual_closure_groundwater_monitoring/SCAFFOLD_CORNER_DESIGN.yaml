          setup:
            - "One unit with a certified network of BG-01 plus DG-01..DG-03 and an INTERWELL program"
            - "Background window 2025-01-01..2025-12-31 holding four VALIDATED BG-01 sulfate values 0.5000/0.6000/0.5500/0.5800"
