              captures: { po1_id: $.data.id }
            - call: "POST /meat-ops/pre-orders/${po1_id}/transitions"
              payload: { action: "CONFIRM" }
              as: ServiceClerk
              as_user_id: "clerk-01"
            - call: "POST /meat-ops/case-plans/${cp1_id}/transitions"
              payload: { action: "SUSPEND" }
              as: MeatManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /meat-ops/pre-orders/${po1_id}/transitions"
