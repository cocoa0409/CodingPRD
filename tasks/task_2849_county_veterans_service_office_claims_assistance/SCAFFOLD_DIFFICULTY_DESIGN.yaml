            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { screen: $.data.id }
          assert:
            - "DischargeDocument.${doc}.verification_status == VERIFIED"
            - "DischargeDocument.${doc}.resubmission_count == 1"
            - "DischargeDocument.${doc}.claimed_service_start == 2001-09-11"
            - "DischargeDocument.${doc}.verified_by_representative_id == ${rep_a}"
            - "Veteran.${vet}.discharge_doc_status == VERIFIED"
            - "Veteran.${vet}.character_of_service == HONORABLE"
            - "Veteran.${vet}.wartime_service_days == 90"
            - "Veteran.${vet}.intake_status == SCREENED"
            - "Veteran.${vet}.priority_group == P3"
            - "EligibilityScreen.${screen}.screen_sequence == 1"
            - "EligibilityScreen.${screen}.wartime_service_days_at_screen == 90"
            - "EligibilityScreen.${screen}.basic_eligibility == true"
            - "EligibilityScreen.${screen}.category_results.PENSION == true"
            - "EligibilityScreen.${screen}.category_results.STATE_PROPERTY_TAX_EXEMPTION == false"
            - "EligibilityScreen.${screen}.eligible_category_count == 3"

