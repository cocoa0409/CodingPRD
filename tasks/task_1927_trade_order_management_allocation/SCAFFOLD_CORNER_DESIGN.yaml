          trigger:
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ACCOUNT_SUSPENDED; GET /trading/orders?account_id=${a1} total_count == 0"]

      - name: error_account_origin_forbidden
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_ACCOUNT_TYPE_FORBIDDEN]"]
        distinguishing_aspect: "Conditional on account_type: order create on an ERROR-type account is rejected ERR_ACCOUNT_TYPE_FORBIDDEN even though the account is ACTIVE."
        test_recipe:
          setup: ["ERROR-type account ACTIVE; security ACTIVE"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "ERR", display_name: "Desk Error", account_type: ERROR, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { ea: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
          trigger:
            - { call: "POST /trading/orders", payload: { account_id: "${ea}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_ACCOUNT_TYPE_FORBIDDEN"]

      - name: broker_asset_class_unsupported_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_BROKER_ASSET_CLASS_UNSUPPORTED]"]
        distinguishing_aspect: "Routing an EQUITY block to a broker supporting only FIXED_INCOME is rejected ERR_BROKER_ASSET_CLASS_UNSUPPORTED; block stays OPEN."
        test_recipe:
          setup: ["EQUITY block OPEN with approved order; broker ACTIVE supporting [FIXED_INCOME] only"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRKFI", display_name: "FI only", commission_rate_bp: 50, supported_asset_classes: [FIXED_INCOME] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
          trigger:
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_BROKER_ASSET_CLASS_UNSUPPORTED; BlockOrder.${blk}.status remains OPEN"]

      - name: position_limit_breach_and_equality_boundary
        claim_type: boundary_edge
        grounds: ["validations[priority=8]", "errors[ERR_POSITION_LIMIT_BREACH]", "calculations.position_net_qty"]
        distinguishing_aspect: "MAX_POSITION_UNITS uses strict exceedance: with net position 100 and threshold 150, an order of 100 (projected 200) is rejected with compliance_note ERR_POSITION_LIMIT_BREACH while an order of 50 (projected == 150) is APPROVED."
        test_recipe:
          setup:
            - "Account A1 with budget 100000 and position +100 in ACME (prior posted trade 100@1000)"
            - "ACTIVE MAX_POSITION_UNITS restriction on (A1, ACME, BUY) threshold 150 covering 2026-08-01"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /trading/allocation-plans/${plan}/post", as: Trader }
            - { call: "POST /trading/restrictions", payload: { account_id: "${a1}", security_id: "${sec}", rule_type: MAX_POSITION_UNITS, side: BUY, threshold_units: 150, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: ComplianceOfficer, captures: { rst: $.data.id } }
            - { call: "POST /trading/restrictions/${rst}/activate", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o2: $.data.id } }
          trigger:
            - { call: "POST /trading/orders/${o2}/compliance-check", as: ComplianceOfficer, captures: { st1: $.data.status, note1: $.data.compliance_note } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 50, order_type: MARKET }, as: Trader, captures: { o3: $.data.id } }
            - { call: "POST /trading/orders/${o3}/compliance-check", as: ComplianceOfficer, captures: { st2: $.data.status } }
          assert:
            - "Order 100: COMPLIANCE_REJECTED with compliance_note == ERR_POSITION_LIMIT_BREACH (100 + 100 = 200 > 150)"
            - "Order 50: APPROVED (100 + 50 = 150 == threshold; breach requires > threshold)"

      - name: block_membership_state_errors
        claim_type: precondition_enforcement
        grounds: ["validations[priority=6]", "errors[ERR_ORDER_NOT_APPROVED]", "errors[ERR_BLOCK_NOT_OPEN]", "errors[ERR_ORDER_NOT_IN_BLOCK]"]
        distinguishing_aspect: "The three block-membership state guards each fire: attach a PENDING_COMPLIANCE order (ERR_ORDER_NOT_APPROVED), attach to a WORKING block (ERR_BLOCK_NOT_OPEN), detach an order belonging to another block (ERR_ORDER_NOT_IN_BLOCK)."
        test_recipe:
          setup: ["Account A1; security; broker; orders o1 (APPROVED), o2 (PENDING_COMPLIANCE), o3 (APPROVED); block A OPEN with o1; block B routed (WORKING) with o3"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 50, order_type: MARKET }, as: Trader, captures: { o2: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 25, order_type: MARKET }, as: Trader, captures: { o3: $.data.id } }
            - { call: "POST /trading/orders/${o3}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blkA: $.data.id } }
            - { call: "POST /trading/blocks/${blkA}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blkB: $.data.id } }
            - { call: "POST /trading/blocks/${blkB}/orders", payload: { order_id: "${o3}" }, as: Trader }
            - { call: "POST /trading/blocks/${blkB}/route", payload: { broker_id: "${brk}" }, as: Trader }
          trigger:
            - { call: "POST /trading/blocks/${blkA}/orders", payload: { order_id: "${o2}" }, as: Trader, captures: { e1: $.data.error_id } }
            - { call: "POST /trading/blocks/${blkB}/orders", payload: { order_id: "${o1}" }, as: Trader, captures: { e2: $.data.error_id } }
            - { call: "DELETE /trading/blocks/${blkA}/orders/${o3}", as: Trader, captures: { e3: $.data.error_id } }
          assert:
            - "Attach unapproved order: e1 == ERR_ORDER_NOT_APPROVED"
            - "Attach to WORKING block: e2 == ERR_BLOCK_NOT_OPEN (note: o1 is BLOCKED in block A, so ERR_BLOCK_NOT_OPEN proves block-state check precedes membership checks)"
            - "Detach foreign order: e3 == ERR_ORDER_NOT_IN_BLOCK"

      - name: error_budget_period_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUDGET_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: budget_half_open_period_overlap
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_restriction_window_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESTRICTION_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: restriction_closed_window_overlap
          rationale: "Asserted as the failure path of the named §1.8 instance."

