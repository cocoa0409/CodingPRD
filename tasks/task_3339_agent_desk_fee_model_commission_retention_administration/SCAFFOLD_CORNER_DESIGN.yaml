        excluded_because:
          difficulty_instance: calculations / trust_balance_recomputed_after_close_and_reconcile
          rationale: "The reconcile endpoint's settlement side effects and trust recomputation are asserted in the named calculations corner."

      - name: retention_report_compute_and_archive_superseded_report
        claim_type: Conditional action
        grounds:
          - state_machines.AgentRetentionReport.COMPUTED_to_ARCHIVED
          - calculations.agent_retention_index
        distinguishing_aspect: "Recomputing the same (office, period_month) archives the prior COMPUTED report and returns a fresh one — only one COMPUTED report exists per office-month."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Alice onboarded and ACTIVE since 2026-08-15 (setup uses clock backfill: create at 2026-08-15 then advance)."]
          setup_api_calls:
