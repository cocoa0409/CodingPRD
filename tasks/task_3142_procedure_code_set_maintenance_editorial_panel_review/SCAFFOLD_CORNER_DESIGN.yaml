scaffold_corner_design:
  - section: entities
    instances:
      - name: code_change_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.CodeChange.fields.organ_system_count
          - entities.CodeChange.fields.cycles_in_process
          - entities.CodeChange.fields.determination
          - entities.CodeChange.fields.administrative_review_status
        distinguishing_aspect: |
          A CodeChange created without organ_system_count, cycles_in_process and
          determination returns organ_system_count 1, cycles_in_process 0 and
          determination PENDING rather than echoing absent values.
        test_recipe:
          setup:
            - "One ACTIVE SpecialtySociety and one ACTIVE ChangeApplicant"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/specialty-societies"
              payload: { name: "Default Society", specialty_code: "DEF", voting_seat_count: 1, gpci_work: 1.0000, gpci_pe: 1.0000, gpci_mp: 1.0000 }
              as: EditorialStaff
              captures: { soc_df: $.data.id }
            - call: "POST /cpt/applicants"
              payload: { name: "Default Applicant", applicant_type: "PHYSICIAN", society_id: "${soc_df}", is_entity_member: true, dues_paid_current: true, contact_email: "default@example.org" }
              as: EditorialStaff
              captures: { app_df: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
          trigger:
            - call: "POST /cpt/code-changes"
              payload: { code: "00050", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_df}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 800, descriptor_current: "Placeholder descriptor" }
              as: EditorialStaff
              captures: { chg_df: $.data.id }
          assert:
            - "CodeChange.${chg_df}.organ_system_count == 1"
            - "CodeChange.${chg_df}.cycles_in_process == 0"
            - "CodeChange.${chg_df}.determination == PENDING"
            - "CodeChange.${chg_df}.administrative_review_status == UNDER_ADMIN_REVIEW"
            - "CodeChange.${chg_df}.review_status == DRAFT"

      - name: change_applicant_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
          - entities.ChangeApplicant.fields.name
        distinguishing_aspect: |
          Reading a ChangeApplicant with an unassigned UUID returns
          ERR_NOT_FOUND at status 404 rather than an empty object.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
          trigger:
            - call: "GET /cpt/applicants/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: EditorialStaff
              captures: { err_nf: $.data.error_id }
          assert:
            - "${err_nf} == ERR_NOT_FOUND"
            - "the returned http status is 404"

      - name: specialty_society_default_gpci_is_national
        claim_type: defaults
        grounds:
          - entities.SpecialtySociety.fields.gpci_work
          - entities.SpecialtySociety.fields.gpci_pe
          - entities.SpecialtySociety.fields.gpci_mp
          - entities.SpecialtySociety.fields.status
        distinguishing_aspect: |
          A SpecialtySociety created without any GPCI returns 1.0000 on all
          three indices and status ACTIVE, so an unadjusted society is
          distinguishable from one carrying a regional index.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
          trigger:
            - call: "POST /cpt/specialty-societies"
              payload: { name: "National Society", specialty_code: "NAT" }
              as: EditorialStaff
              captures: { soc_nat: $.data.id }
          assert:
            - "SpecialtySociety.${soc_nat}.gpci_work == 1.0000"
            - "SpecialtySociety.${soc_nat}.gpci_pe == 1.0000"
            - "SpecialtySociety.${soc_nat}.gpci_mp == 1.0000"
            - "SpecialtySociety.${soc_nat}.status == ACTIVE"
            - "SpecialtySociety.${soc_nat}.cea_credit_balance == 0"

      - name: code_format_invalid_on_bad_trailing_letter
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_CODE_FORMAT_INVALID]
          - entities.CodeChange.fields.code
        distinguishing_aspect: |
          A five-character descriptor ending in Z is rejected with
          ERR_CODE_FORMAT_INVALID at status 422 while an otherwise identical
          descriptor ending in B is accepted.
        test_recipe:
          setup:
            - "One ACTIVE ChangeApplicant"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/applicants"
              payload: { name: "Format Applicant", applicant_type: "OTHER", is_entity_member: false, dues_paid_current: false, contact_email: "format@example.org" }
              as: EditorialStaff
              captures: { app_fm: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
          trigger:
            - call: "POST /cpt/code-changes"
              payload: { code: "0000Z", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_fm}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 900, descriptor_current: "Placeholder descriptor" }
              as: EditorialStaff
              captures: { err_fmt: $.data.error_id }
          assert:
            - "${err_fmt} == ERR_CODE_FORMAT_INVALID"
            - "the returned http status is 422"

      - name: pagination_defaults_and_has_more_on_change_list
        claim_type: listing
        grounds:
          - endpoints.GET /cpt/code-changes
          - entities.CodeChange.fields.code
        distinguishing_aspect: |
          A CodeChange list read with no limit returns limit 10, offset 0 and
          has_more false when fewer than ten rows exist, and total_count reflects
          every row rather than the page.
        test_recipe:
          setup:
            - "One ACTIVE ChangeApplicant and two CodeChange rows"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/applicants"
              payload: { name: "Page Applicant", applicant_type: "PAYER", is_entity_member: true, dues_paid_current: true, contact_email: "page@example.org" }
              as: EditorialStaff
              captures: { app_pg: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-changes"
              payload: { code: "00060", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_pg}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "First placeholder" }
              as: EditorialStaff
              captures: { chg_pg1: $.data.id }
            - call: "POST /cpt/code-changes"
              payload: { code: "00061", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_pg}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "Second placeholder" }
              as: EditorialStaff
              captures: { chg_pg2: $.data.id }
          trigger:
            - call: "GET /cpt/code-changes?limit=10&offset=0"
              payload: {}
              as: EditorialStaff
          assert:
            - "the response meta limit is 10 and offset is 0"
            - "the response total_count is 2"
            - "the response has_more is false"

  - section: state_machines
    instances:
      - name: change_administrative_return_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CodeChange.POSTED_FOR_COMMENT_to_DRAFT
          - errors[ERR_INVALID_STATE]
          - validations[priority=16]
        distinguishing_aspect: |
          A CodeChange still in DRAFT has no administrative-return transition, so
          the call is rejected with ERR_INVALID_STATE and the change keeps its
          UNDER_ADMIN_REVIEW screening status.
        test_recipe:
          setup:
            - "One ACTIVE ChangeApplicant and one DRAFT CodeChange 00062 not yet posted"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/applicants"
              payload: { name: "Return Applicant", applicant_type: "PHYSICIAN", is_entity_member: true, dues_paid_current: true, contact_email: "return@example.org" }
              as: EditorialStaff
              captures: { app_rt: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-changes"
              payload: { code: "00062", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_rt}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "Placeholder descriptor" }
              as: EditorialStaff
              captures: { chg_rt: $.data.id }
          trigger:
            - call: "POST /cpt/code-changes/${chg_rt}/administrative-returns"
              payload: { reason: "Not posted yet" }
              as: EditorialStaff
              captures: { err_rt: $.data.error_id }
          assert:
            - "${err_rt} == ERR_INVALID_STATE"
            - "CodeChange.${chg_rt}.review_status == DRAFT"
            - "CodeChange.${chg_rt}.administrative_review_status == UNDER_ADMIN_REVIEW"

      - name: approved_change_cannot_be_reverted_to_draft
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CodeChange.DETERMINED_to_DRAFT
          - errors[ERR_ALREADY_TERMINAL]
          - validations[priority=17]
        distinguishing_aspect: |
          A CodeChange whose determination is APPROVED has no revert path, so an
          APPROVED determination holds its CEA credits at 2.5 through the failed
          revert rather than unwinding them.
        test_recipe:
          setup:
            - "One ACTIVE SpecialtySociety and one ACTIVE ChangeApplicant"
            - "One EditorialPanelMeeting that already closed with three docketed changes"
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "One CodeChange 00063 already determined APPROVED with cea_credits 2.5"
          setup_api_calls:
            - call: "POST /cpt/specialty-societies"
              payload: { name: "Terminal Society", specialty_code: "TRM", voting_seat_count: 1, gpci_work: 1.0000, gpci_pe: 1.0000, gpci_mp: 1.0000 }
              as: EditorialStaff
              captures: { soc_tm: $.data.id }
            - call: "POST /cpt/applicants"
              payload: { name: "Terminal Applicant", applicant_type: "SPECIALTY_SOCIETY", society_id: "${soc_tm}", is_entity_member: true, dues_paid_current: true, contact_email: "terminal@example.org" }
              as: EditorialStaff
              captures: { app_tm: $.data.id }
            - call: "POST /cpt/meetings"
              payload: { meeting_code: "FEB2026", meeting_month: "FEBRUARY", starts_at: "2026-02-09T14:00:00Z", ends_at: "2026-02-09T23:00:00Z", citation_mode: false }
              as: EditorialStaff
              captures: { mtg_tm: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-changes"
              payload: { code: "00063", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_tm}", society_id: "${soc_tm}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 4000, organ_system_count: 1, descriptor_current: "First placeholder", descriptor_proposed: "First placeholder revised" }
              as: EditorialStaff
              captures: { chg_tm: $.data.id }
            - call: "POST /cpt/code-changes"
              payload: { code: "00064", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_tm}", society_id: "${soc_tm}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "Second placeholder" }
              as: EditorialStaff
              captures: { chg_tm2: $.data.id }
            - call: "POST /cpt/code-changes"
              payload: { code: "00065", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_tm}", society_id: "${soc_tm}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "Third placeholder" }
              as: EditorialStaff
              captures: { chg_tm3: $.data.id }
            - call: "POST /cpt/meetings/${mtg_tm}/agenda"
              payload: { change_ids: ["${chg_tm}", "${chg_tm2}", "${chg_tm3}"] }
              as: EditorialStaff
              captures: { mtg_tm_v1: $.data.version }
            - call: "POST /cpt/meetings/${mtg_tm}/openings"
              payload: {}
              as: EditorialPanelChair
              captures: { mtg_tm_v2: $.data.version }
            - call: "POST /cpt/code-changes/${chg_tm}/determinations"
              payload: { determination: "APPROVED", determination_basis: "Evidence is sufficient" }
              as: EditorialPanelChair
              captures: { tm_det_v: $.data.version }
          trigger:
            - call: "POST /cpt/code-changes/${chg_tm}/revert-to-draft"
              payload: { reason: "Attempted rework" }
              as: EditorialStaff
              captures: { err_tm: $.data.error_id }
          assert:
            - "${err_tm} == ERR_ALREADY_TERMINAL"
            - "CodeChange.${chg_tm}.determination == APPROVED"
            - "CodeChange.${chg_tm}.cea_credits == 2.5"

      - name: cycle_limit_exceeded_on_fourth_carry_forward
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CodeChange.REFERRED_to_POSTED_FOR_COMMENT
          - state_machines.CodeChange.REFERRED_to_DRAFT
          - errors[ERR_CYCLE_LIMIT_EXCEEDED]
          - validations[priority=12]
        distinguishing_aspect: |
          A change already carried three times cannot be carried a fourth, so
          the third carry-forward succeeds and the fourth is rejected with
          ERR_CYCLE_LIMIT_EXCEEDED at status 422.
        test_recipe:
          setup:
            - "One ACTIVE ChangeApplicant, one meeting and one open ReleaseCycle"
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "One CodeChange 00066 already REFERRED with held_for_full_panel true and cycles_in_process 2"
          setup_api_calls:
            - call: "POST /cpt/applicants"
              payload: { name: "Cycle Applicant", applicant_type: "SPECIALTY_SOCIETY", is_entity_member: true, dues_paid_current: true, contact_email: "cycle@example.org" }
              as: EditorialStaff
              captures: { app_cy: $.data.id }
            - call: "POST /cpt/meetings"
              payload: { meeting_code: "APR2026", meeting_month: "APRIL", starts_at: "2026-04-13T14:00:00Z", ends_at: "2026-04-13T23:00:00Z", citation_mode: false }
              as: EditorialStaff
              captures: { mtg_cy: $.data.id }
            - call: "POST /cpt/release-cycles"
              payload: { year: 2027, comment_open: "2026-09-01T00:00:00Z", comment_close: "2026-10-01T00:00:00Z", addendum_comment_close: "2027-11-15T00:00:00Z", meeting_ids: ["${mtg_cy}"], code_set_capacity: 400, errata_deadline: "2027-06-30T00:00:00Z", single_floor_budgeting: false }
              as: EditorialStaff
              captures: { cyc_cy: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-changes"
              payload: { code: "00066", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_cy}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "First placeholder", descriptor_proposed: "First placeholder revised" }
              as: EditorialStaff
              captures: { chg_cy: $.data.id, cyc_v_pre: $.data.version }
            - call: "POST /cpt/code-changes"
              payload: { code: "00067", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_cy}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "Second placeholder" }
              as: EditorialStaff
              captures: { chg_cy2: $.data.id }
            - call: "POST /cpt/code-changes"
              payload: { code: "00068", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_cy}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "Third placeholder" }
              as: EditorialStaff
              captures: { chg_cy3: $.data.id }
            - call: "POST /cpt/release-cycles/${cyc_cy}/submissions"
              payload: { change_ids: ["${chg_cy}", "${chg_cy2}", "${chg_cy3}"], expected_change_version: "${cyc_v_pre}" }
              as: EditorialStaff
              captures: { cyc_cy_v1: $.data.version }
            - call: "POST /cpt/meetings/${mtg_cy}/agenda"
              payload: { change_ids: ["${chg_cy}", "${chg_cy2}", "${chg_cy3}"] }
              as: EditorialStaff
              captures: { mtg_cy_v1: $.data.version }
            - call: "POST /cpt/meetings/${mtg_cy}/openings"
              payload: {}
              as: EditorialPanelChair
              captures: { mtg_cy_v2: $.data.version }
            - call: "POST /cpt/code-changes/${chg_cy}/referrals"
              payload: { reason: "Carried to the June minutes the first time" }
              as: EditorialPanelChair
              captures: { cy_r1: $.data.version }
            - call: "POST /cpt/code-changes/${chg_cy}/supplementary-reports"
              payload: { report_text: "Supplementary report one" }
              as: EditorialStaff
              captures: { cy_r2: $.data.version }
            - call: "POST /cpt/meetings/${mtg_cy}/agenda"
              payload: { change_ids: ["${chg_cy}"] }
              as: EditorialStaff
              captures: { mtg_cy_v3: $.data.version }
            - call: "POST /cpt/meetings/${mtg_cy}/openings"
              payload: {}
              as: EditorialPanelChair
              captures: { mtg_cy_v4: $.data.version }
            - call: "POST /cpt/code-changes/${chg_cy}/referrals"
              payload: { reason: "Carried to the June minutes the second time" }
              as: EditorialPanelChair
              captures: { cy_r3: $.data.version }
            - call: "POST /cpt/code-changes/${chg_cy}/supplementary-reports"
              payload: { report_text: "Supplementary report two" }
              as: EditorialStaff
              captures: { cy_r4: $.data.version }
            - call: "POST /cpt/meetings/${mtg_cy}/agenda"
              payload: { change_ids: ["${chg_cy}"] }
              as: EditorialStaff
              captures: { mtg_cy_v5: $.data.version }
            - call: "POST /cpt/meetings/${mtg_cy}/openings"
              payload: {}
              as: EditorialPanelChair
              captures: { mtg_cy_v6: $.data.version }
            - call: "POST /cpt/code-changes/${chg_cy}/referrals"
              payload: { reason: "Carried to the June minutes the third time" }
              as: EditorialPanelChair
              captures: { cy_r5: $.data.version }
          trigger:
            - call: "POST /cpt/code-changes/${chg_cy}/supplementary-reports"
              payload: { report_text: "Supplementary report four" }
              as: EditorialStaff
              captures: { err_cy: $.data.error_id }
          assert:
            - "${err_cy} == ERR_CYCLE_LIMIT_EXCEEDED"
            - "the returned http status is 422"
            - "CodeChange.${chg_cy}.cycles_in_process == 3"

  - section: calculations
    instances:
      - name: comment_period_one_day_short_is_rejected
        claim_type: boundary_value
        grounds:
          - calculations.comment_period_governance
          - validations[priority=13]
          - errors[ERR_COMMENT_PERIOD_TOO_SHORT]
          - entities.CodeChange.fields.comment_period_close_at
        distinguishing_aspect: |
          The posting window boundary sits exactly at 30 whole days: a window of
          30 days is accepted while the same window shortened by one day is
          rejected with ERR_COMMENT_PERIOD_TOO_SHORT at status 422.
        test_recipe:
          setup:
            - "One ACTIVE ChangeApplicant, one meeting and one open ReleaseCycle"
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "One CodeChange 00069 submitted into the cycle and still DRAFT"
          setup_api_calls:
            - call: "POST /cpt/applicants"
              payload: { name: "Window Applicant", applicant_type: "SPECIALTY_SOCIETY", is_entity_member: true, dues_paid_current: true, contact_email: "window@example.org" }
              as: EditorialStaff
              captures: { app_wn: $.data.id }
            - call: "POST /cpt/meetings"
              payload: { meeting_code: "JUN2026", meeting_month: "JUNE", starts_at: "2026-06-08T14:00:00Z", ends_at: "2026-06-08T23:00:00Z", citation_mode: false }
              as: EditorialStaff
              captures: { mtg_wn: $.data.id }
            - call: "POST /cpt/release-cycles"
              payload: { year: 2028, comment_open: "2026-09-01T00:00:00Z", comment_close: "2026-10-01T00:00:00Z", addendum_comment_close: "2026-11-15T00:00:00Z", meeting_ids: ["${mtg_wn}"], code_set_capacity: 400, errata_deadline: "2028-06-30T00:00:00Z", single_floor_budgeting: false }
              as: EditorialStaff
              captures: { cyc_wn: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-changes"
              payload: { code: "00069", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_wn}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "Placeholder descriptor" }
              as: EditorialStaff
              captures: { chg_wn: $.data.id, wn_v_pre: $.data.version }
            - call: "POST /cpt/release-cycles/${cyc_wn}/submissions"
              payload: { change_ids: ["${chg_wn}"], expected_change_version: "${wn_v_pre}" }
              as: EditorialStaff
              captures: { cyc_wn_v1: $.data.version }
          trigger:
            - call: "POST /cpt/code-changes/${chg_wn}/postings"
              payload: { comment_period_open_at: "2026-09-01T00:00:00Z", comment_period_close_at: "2026-09-30T00:00:00Z" }
              as: EditorialStaff
              captures: { err_wn: $.data.error_id }
          assert:
            - "${err_wn} == ERR_COMMENT_PERIOD_TOO_SHORT"
            - "the returned http status is 422"
            - "CodeChange.${chg_wn}.review_status == DRAFT"

      - name: comment_period_exactly_thirty_days_is_accepted
        claim_type: boundary_value
        grounds:
          - calculations.comment_period_governance
          - state_machines.CodeChange.DRAFT_to_POSTED_FOR_COMMENT
          - entities.CodeChange.fields.posting_state
        distinguishing_aspect: |
          The same window boundary accepted from the other side: a window of
          exactly 30 days posts successfully and sets posting_state to
          COMMENT_OPEN.
        test_recipe:
          setup:
            - "One ACTIVE ChangeApplicant, one meeting and one open ReleaseCycle"
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "One CodeChange 00070 submitted into the cycle and still DRAFT"
          setup_api_calls:
            - call: "POST /cpt/applicants"
              payload: { name: "Accepted Applicant", applicant_type: "SPECIALTY_SOCIETY", is_entity_member: true, dues_paid_current: true, contact_email: "accepted@example.org" }
              as: EditorialStaff
              captures: { app_ac: $.data.id }
            - call: "POST /cpt/meetings"
