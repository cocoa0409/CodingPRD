        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_PRICE_CHANGE_NOTICE_TOO_SHORT]"
        distinguishing_aspect: "Price change effective < 30 days after announcement returns ERR_PRICE_CHANGE_NOTICE_TOO_SHORT."
        test_recipe:
