  # ===================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: census_plan_year_containment_conflict
        grounds:
          - validations[priority=15]
          - errors[ERR_CENSUS_YEAR_CONFLICT]
          - state_machines.CensusBatch.transitions.UPLOADED_to_VALIDATED
        distinguishing_aspect: |
          Absolute calendar-year containment: a second batch whose plan_year
          equals an already-VALIDATED batch's plan_year collides (rejected),
          while an adjacent year would be permitted — half-open yearly
          intervals on the CensusBatch resource.
        test_recipe:
          setup:
            - "Plan 2028; census batch B1 VALIDATED for plan_year 2028; second batch B2 created for the same plan_year 2028 with valid rows"
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { sponsor_name: "Overlap Co", plan_year: 2028, accrual_rate: 0.01, normal_retirement_age: 62, prior_aftap_pct: 84.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /v1/plans/${plan_id}/census-batches"
              payload: { plan_year: 2028, source_label: "b1" }
              as: PlanAdmin
              captures: { batch1_id: "$.data.id" }
            - call: "POST /v1/census-batches/${batch1_id}/participants"
              payload:
                participants:
                  - { external_ref: "R1", date_of_birth: "1965-04-04", status: "RETIREE", current_annual_benefit: 1000 }
              as: PlanAdmin
            - call: "POST /v1/census-batches/${batch1_id}/submit-screening"
              payload: {}
              as: PlanAdmin
            - call: "POST /v1/plans/${plan_id}/census-batches"
              payload: { plan_year: 2028, source_label: "b2" }
              as: PlanAdmin
              captures: { batch2_id: "$.data.id" }
            - call: "POST /v1/census-batches/${batch2_id}/participants"
              payload:
                participants:
                  - { external_ref: "R2", date_of_birth: "1965-05-05", status: "RETIREE", current_annual_benefit: 2000 }
              as: PlanAdmin
          trigger:
            - call: "POST /v1/census-batches/${batch2_id}/submit-screening"
              payload: {}
              as: PlanAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_CENSUS_YEAR_CONFLICT with http 409 (B1 already VALIDATED for plan_year 2028)"
            - "CensusBatch.${batch2_id}.status remains UPLOADED"

      - name: election_revocation_window_relative_duration
        grounds:
          - validations[priority=10]
          - errors[ERR_ELECTION_WINDOW_CONFLICT]
          - entities.CreditBalanceElection.fields.revoke_deadline
        distinguishing_aspect: |
          Relative duration-window semantics on the CreditBalanceElection
          resource: a second election collides while the first election's
          [created_at, created_at + 21 days) window is open, but is permitted
          at exactly +21 days (half-open relative window) — different interval
          arithmetic than absolute calendar-year containment.
        test_recipe:
          setup:
            - "Family A plan with carryover 2000 / prefunding 3000; demand OPEN tentative 2839.98"
            - "Election E1 (500.00) created at clock 2028-03-01T00:00:00Z; window open until 2028-03-22T00:00:00Z"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2028-03-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /v1/plans"
              payload: { sponsor_name: "Window Co", plan_year: 2028, accrual_rate: 0.01, normal_retirement_age: 62, prior_aftap_pct: 84.00, initial_carryover_balance: 2000, initial_prefunding_balance: 3000 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /v1/actuaries"
              payload: { full_name: "Prep Act", credential_id: "EA-1", enrollment_status: "ENROLLED" }
              as: FirmAdmin
