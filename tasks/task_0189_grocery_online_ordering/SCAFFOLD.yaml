    side_effects: []

  # ---- AgeCheck ----
  - method: POST
    path: "/v1/age-checks"
    description: "Record an in-person age verification; computes PASS/FAIL by completed-years rule against slot.window_start"
    roles: [StoreOps]
    code: 201
    input: [order_id, verifier_user_id, verified_birth_date]
    output: AgeCheck
    side_effects: ["outcome computed PASS/FAIL"]

  - method: GET
    path: "/v1/age-checks"
