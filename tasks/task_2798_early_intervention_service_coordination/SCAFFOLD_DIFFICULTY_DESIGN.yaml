          assert:
            - "TransitionPlan.${tp1_id}.notification_lead_days == 90 and notification_compliance == \"TIMELY\" (the 90-day boundary is inclusive)"
            - "TransitionPlan.${tp1_id}.status == \"NOTIFIED\" with lea_code == \"LEA_042\" and notification_date == \"2026-10-17\""
            - "TransitionPlan.${tp2_id}.notification_lead_days == 89 and notification_compliance == \"LATE\""
            - "TransitionPlan.${tp2_id}.status == \"NOTIFIED\" (a late notification still moves the plan to NOTIFIED)"
            - "Child.${child1_id}.third_birthday_date == \"2027-01-15\" and Child.${child2_id}.third_birthday_date == \"2027-01-18\""
            - "Referral.${ref1_id}.case_weight_points == 1.75 and Referral.${ref2_id}.case_weight_points == 1.75 (active base 1.00 plus the 0.75 transition-window term after the clock moved)"
            - "ServiceCoordinator.${coord_id}.weighted_caseload_points == 3.50 and utilization_ratio == 0.2917"

      - name: zero_excluded_delay_days_empty_assessment_set
        grounds:
          - calculations.initial_timeline_elapsed_days
          - entities.Referral.fields.excluded_delay_days
          - endpoints[GET /ei/referrals/{referralId}/timeline-compliance]
        distinguishing_aspect: |
          This instance drives the timeline calculation with an EMPTY input set: two assessments exist
          but neither is COMPLETED, so excluded_delay_days must be 0 and the gross and net counts must
          coincide at 18 days, with the stop date falling back to the logical clock date and the status
          resting at IN_PROGRESS rather than MET. An implementation that sums family_unavailable_days
          over SCHEDULED rows, or that treats a missing IFSP as a MET verdict, diverges here. The other
          boundary instances sit on numeric thresholds rather than on an empty set.
        test_recipe:
          setup:
            - "A referral received 2026-03-02 in CNT_A with a coordinator assigned, so the statutory deadline is 2026-04-16."
            - "Two assessments exist (INITIAL_EVALUATION and FAMILY_ASSESSMENT) but both are still SCHEDULED."
            - "No IFSP exists on the referral, so the timeline has no meeting_date stop instant."
            - "Logical clock at 2026-03-20T09:00:00Z, 18 days after the received date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-24", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-03-25", setting_code: "HOME" }
              as: Evaluator
              captures: { fam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-20T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /ei/referrals/${ref_id}/timeline-compliance"
              as: ProgramAdmin
          assert:
            - "response.data.statutory_deadline_date == \"2026-04-16\" (2026-03-02 plus 45 days)"
            - "response.data.stop_date == \"2026-03-20\" (the logical clock date, because no INITIAL IFSP meeting exists)"
            - "response.data.gross_elapsed_days == 18"
            - "response.data.excluded_delay_days == 0 (no COMPLETED assessment contributes)"
            - "response.data.net_elapsed_days == 18, identical to the gross count"
            - "response.data.initial_timeline_status == \"IN_PROGRESS\" (not MET, because the clock has not been stopped by a meeting date)"
            - "response.data.monthly_contact_status == \"NOT_APPLICABLE\" and response.data.last_qualifying_contact_date == null"
            - "Referral.${ref_id}.excluded_delay_days == 0 and net_elapsed_days == 18 on the stored row"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: eligibility_determination_requires_both_completed_assessment_types
        grounds:
          - validations[priority 33 -> ERR_REQUIRED_ASSESSMENTS_INCOMPLETE]
          - state_machines.Referral[EVALUATION_PENDING -> ELIGIBILITY_DETERMINED]
          - state_machines.Assessment[SCHEDULED -> COMPLETED]
          - endpoints[POST /ei/referrals/{referralId}/eligibility-determination]
        distinguishing_aspect: |
          Here a Referral transition is gated on the state of TWO sibling Assessment rows of different
          assessment_type: having one COMPLETED evaluation is not enough while the family assessment is
          still SCHEDULED. The instance proves the gate is per-type (not per-count) and that the
          rejected attempt is a true no-op by comparing Referral.version against the value captured
          before the attempt, then shows the same request succeeding once the second assessment is
          completed. The other cross_entity instance gates a child create on the PARENT plan's status
          instead, and turns on a fiscal counter rather than a version.
