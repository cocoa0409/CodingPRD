          - entities.MealClaim.fields.claimed_operating_cost_cents
          - entities.MealClaim.fields.claimed_admin_cost_cents
          - entities.MealClaim.fields.final_reimbursement_cents
          - state_machines.MealClaim.SUBMITTED_to_VALIDATED
        distinguishing_aspect: |
          Mode (c) — an apparently circular constraint resolved by a PINNED step order: with
          meals_rate_value_cents 22114, claimed_operating_cost_cents 20000 and claimed_admin_cost_cents
          20000, step 2 clamps operating to 20000, step 3 keys the admin cap to THAT output
