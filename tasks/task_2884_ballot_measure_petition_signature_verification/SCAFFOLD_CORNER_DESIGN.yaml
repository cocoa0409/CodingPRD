      - name: cure_eligibility_floor_blocks_reopen_after_ledger_drop
        claim_type: aggregate_validation
        grounds:
          - validations[priority 15]
          - errors[ERR_CURE_NOT_ELIGIBLE]
          - calculations.cure_target_computation
          - state_machines.Petition
        distinguishing_aspect: |
          The cure eligibility floor is re-evaluated at cure-period creation, not frozen at
          the tally that opened the cure path, and after a FULL_CHECK round the quantity it
          reads is the live verified_valid_count. Invalidating a batch voids its lines and
          drops that count below the floor, so a petition that was cure-eligible one call
          earlier is refused with ERR_CURE_NOT_ELIGIBLE while remaining in CURE_PERIOD -
          which rules out ERR_INVALID_PETITION_STATE as the explanation. Reinstating the
          batch restores the count and the same creation call then succeeds, proving the
          floor was the only obstacle. The satisfied case sits exactly on the floor
          (4 == 5 * 8000 / 10000), so the comparison is inclusive.
