          setup:
            - "One ACTIVE CUSTOMER_CASH program CAS-AUG-26, per_unit_amount_cents 150000, accrual_method UNIT_BASED, budget_cents 100000000, window [2026-08-01, 2026-09-01)."
            - "Dealer D-800 in region WEST, ACTIVE."
            - "One VALIDATED MX5/CASH delivery with sale_date 2026-08-05."
            - "One Claim on it, VALIDATED with approved_amount_cents 150000 and payment_status SCHEDULED inside an OPEN WEST batch for [2026-08-01, 2026-08-31]."
            - "One BudgetAccrual ACCRUAL row already run for period_month 2026-08, so accrued_cents == round_half_up(1 * 150000 * 9725 / 10000) == 145875."
            - "Logical clock at 2026-08-25 when the unwind fires."
