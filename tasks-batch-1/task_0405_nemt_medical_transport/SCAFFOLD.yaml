# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Member ----
  - method: POST
    path: "/members"
    description: "Create a Member; eligibility_status initialized ELIGIBLE"
    roles: [Coordinator]
    code: 201
    input: [medicaid_id, full_name, mobility_level, home_county]
    output: Member
    side_effects: ["eligibility_status=ELIGIBLE, noshow_strike_count=0, standing_orders_paused=false"]

  - method: GET
    path: "/members/{id}"
    description: "Get a Member"
    roles: [Coordinator, Broker, Auditor, Driver]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{id}/eligibility/recompute"
    description: "Recompute eligibility posture from spans + clock; fires lapse/restore cascade"
    roles: [Coordinator]
    code: 200
    input: []
    output: Member
    side_effects:
      - "ELIGIBLE->SUSPENDED cascade: SCHEDULED/ASSIGNED trips CANCELLED, legs CANCELLED, assignments RELEASED, standing orders PAUSED"
      - "SUSPENDED->ELIGIBLE: standing_orders_paused cleared (no auto-resume)"

  - method: POST
    path: "/members/{id}/terminate"
    description: "Terminate a Member (no in-flight ASSIGNED/IN_PROGRESS trips)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Member
    side_effects: ["ACTIVE/PAUSED StandingOrders -> CANCELLED"]

  - method: GET
    path: "/members/{id}/eligibility-spans"
    description: "List EligibilitySpan rows for a member (reverse-reachability for EligibilitySpan.member_id)"
    roles: [Coordinator, Auditor]
    code: 200
    input: []
    output: EligibilitySpan[]
    side_effects: []

  - method: GET
    path: "/members/{id}/trips"
    description: "List TripRequest rows for a member (reverse-reachability for TripRequest.member_id)"
    roles: [Coordinator, Broker, Auditor]
    code: 200
    input: []
    output: TripRequest[]
    side_effects: []

  - method: GET
    path: "/members/{id}/standing-orders"
    description: "List StandingOrder rows for a member (reverse-reachability for StandingOrder.member_id)"
    roles: [Coordinator]
    code: 200
    input: []
    output: StandingOrder[]
    side_effects: []

  # ---- EligibilitySpan ----
  - method: POST
    path: "/eligibility-spans"
    description: "Append an EligibilitySpan (immutable coverage record)"
    roles: [Coordinator]
    code: 201
    input: [member_id, level_of_service, coverage_start, coverage_end]
    output: EligibilitySpan
    side_effects: []

  - method: POST
    path: "/eligibility-spans/{id}/void"
