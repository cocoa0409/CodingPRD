        grounds:
          - calculations.laboratory_slot_overlap_check
          - validations[priority=28]
          - errors.ERR_LAB_SLOT_CAPACITY_EXCEEDED
          - entities.Laboratory.fields.concurrent_slot_capacity
        distinguishing_aspect: "Resource entity: Laboratory bench slots. Interval semantics: HALF-OPEN [window_start, window_end) with adjacency ALLOWED and an AGGREGATE capacity of more than one — two overlapping orders are perfectly legal on a laboratory with concurrent_slot_capacity 2, and only the third overlapping order is refused. A window that starts exactly when another ends is accepted. Cancelling an order frees its window immediately, because the input set is filtered to SCHEDULED and IN_TESTING."
