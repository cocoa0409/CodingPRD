      - name: vial_label_mismatch_then_expiry_blocks_verification
        claim_type: violation_to_error
        grounds:
          - errors.ERR_VIAL_LABEL_MISMATCH
          - errors.ERR_VIAL_EXPIRED
          - validations[priority 10]
          - state_machines.ImmunotherapyVial.MIXED_to_LABEL_VERIFIED
          - state_machines.ImmunotherapyVial.MIXED_to_DISCARDED
        distinguishing_aspect: "Two priority-10 gates on the same endpoint fire in their declared order and neither is a shape error: a confirmation string that differs by one character in the date segment is ERR_VIAL_LABEL_MISMATCH, and once the clock reaches expires_at exactly, the character-perfect confirmation is instead ERR_VIAL_EXPIRED — after which the only legal move left is a BEYOND_USE_DATE discard."
        test_recipe:
          setup:
            - "PayerPolicy with defaults; one adult Patient with MRN-10246; one ALLERGEN_CONCENTRATE lot."
            - "One BLUE_1_100 vial compounded by u_nurse_1 at the default clock with expires_at 2026-08-15T00:00:00Z and the mandated label_text 'MRN-10246|BLUE_1_100|2026-08-15'."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Label Health", plan_code: "ERRK-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10246", full_name: "Ludvig Aaltonen", date_of_birth: "1957-01-15", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /supply-lots"
              payload: { item_type: "ALLERGEN_CONCENTRATE", lot_number: "LOT-1029", quantity_received: 4, expires_at: "2027-06-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-vials"
              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "MRN-10246|BLUE_1_100|2026-08-15", expires_at: "2026-08-15T00:00:00Z", expected_patient_version: "${pat_v}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { vial_id: $.data.id }
          trigger:
            - call: "POST /immunotherapy-vials/${vial_id}/label-verification"
              payload: { label_text_confirmation: "MRN-10246|BLUE_1_100|2026-08-14" }
              as: AllergyNurse
              as_user_id: "u_nurse_2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-vials/${vial_id}/label-verification"
              payload: { label_text_confirmation: "MRN-10246|BLUE_1_100|2026-08-15" }
              as: AllergyNurse
              as_user_id: "u_nurse_2"
            - call: "POST /immunotherapy-vials/${vial_id}/discard"
              payload: { discard_reason: "BEYOND_USE_DATE" }
              as: AllergyNurse
              as_user_id: "u_nurse_2"
          assert:
            - "The first verification returns HTTP 409 with error.id == \"ERR_VIAL_LABEL_MISMATCH\" — the comparison is character for character, so 2026-08-14 does not match 2026-08-15"
            - "ImmunotherapyVial.${vial_id}.status is still \"MIXED\" and verified_by_user_id is still null"
            - "The second verification returns HTTP 409 with error.id == \"ERR_VIAL_EXPIRED\" — the clock has reached expires_at, and the reached-or-passed comparison makes the boundary instant already expired"
            - "The vial is still \"MIXED\" and Patient.${pat_id}.immunotherapy_status is still \"NONE\" — the BUILD_UP side effect belongs to a successful verification only"
            - "The discard returns HTTP 200 with status == \"DISCARDED\", discard_reason == \"BEYOND_USE_DATE\", volume_ml_wasted == 5.00 and volume_ml_remaining == 0.00"
            - "The conserved identity holds after the discard: 5.00 == 0.00 + 0.00 + 5.00"

      - name: state_gates_reject_repeat_actions_on_vial_booking_and_block
        claim_type: violation_to_error
        grounds:
          - errors.ERR_VIAL_STATE_INVALID
          - errors.ERR_BOOKING_STATE_INVALID
          - errors.ERR_BLOCK_STATE_INVALID
          - validations[priority 7]
          - state_machines.SurgeryCenterBlock.OPEN_to_CLOSED
        distinguishing_aspect: "Three entity-scoped state errors are raised by replaying three already-successful terminal actions, which shows the state gate is per-entity rather than one shared conflict code: a second discard on a DISCARDED vial, a second cancel on a CANCELLED booking, and a second close on a CLOSED block."
        test_recipe:
          setup:
            - "PayerPolicy with defaults; one adult Patient; one ALLERGEN_CONCENTRATE lot and one vial; one TONSILLECTOMY booking in the office suite; one surgery-center block with no bookings."
            - "Each of the three entities is first driven into its terminal or closed state by a successful call."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Repeat Health", plan_code: "ERRL-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10247", full_name: "Nadia Bertrand", date_of_birth: "1965-02-16", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /supply-lots"
              payload: { item_type: "ALLERGEN_CONCENTRATE", lot_number: "LOT-1030", quantity_received: 4, expires_at: "2027-06-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-vials"
              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "MRN-10247|BLUE_1_100|2026-12-01", expires_at: "2026-12-01T00:00:00Z", expected_patient_version: "${pat_v}" }
              as: AllergyNurse
