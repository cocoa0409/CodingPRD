  # ===================================================================
  - section: validations
    instances:

      - name: agreement_term_one_day_short_of_ninety_returns_invalid_term
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors.ERR_INVALID_TERM
        distinguishing_aspect: "2026-09-01..2026-11-29 is exactly 89 whole days (term_end_date minus term_start_date), one short of the 90-day floor, so the create is rejected with ERR_INVALID_TERM (422) and no agreement row appears - the interval is perfectly ordered, so ERR_INVALID_INTERVAL must not fire instead."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN and one ACTIVE CoBrandIssuer with annual_mile_purchase_cap_miles 5000000."
            - "Logical clock at its 2026-08-01T00:00:00Z default, so a 2026-09-01 start is not in the past."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Term", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
          trigger:
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2026-11-29"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 422 with data.error_id == ERR_INVALID_TERM"
            - "data.error_id != ERR_INVALID_INTERVAL"
            - "GET /mile-sale-agreements?issuer_id=${issuer_id} returns total_count 0"
            - "CoBrandIssuer.${issuer_id}.aggregate_committed_miles == 0"

      - name: agreement_term_of_exactly_ninety_days_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=17]
          - entities.MileSaleAgreement.fields.status
        distinguishing_aspect: "The same shape one day longer - 2026-09-01..2026-11-30, exactly 90 whole days - passes, proving the floor is inclusive; the row lands in DRAFT with negotiation_round 0 and drawn_miles 0 and the issuer aggregate stays 0 because DRAFT is not a committed status."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN and one ACTIVE CoBrandIssuer with annual_mile_purchase_cap_miles 5000000."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Term Pass", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
          trigger:
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2026-11-30"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_id: "$.data.id" }
          assert:
            - "the trigger returns HTTP 201"
            - "MileSaleAgreement.${agr_id}.status == DRAFT"
            - "MileSaleAgreement.${agr_id}.negotiation_round == 0"
            - "MileSaleAgreement.${agr_id}.drawn_miles == 0"
            - "MileSaleAgreement.${agr_id}.prepayment_balance_miles == 0"
            - "MileSaleAgreement.${agr_id}.negotiated_by_user_id == null"
            - "MileSaleAgreement.${agr_id}.ratified_by_user_id == null"
            - "MileSaleAgreement.${agr_id}.version == 1"
            - "CoBrandIssuer.${issuer_id}.aggregate_committed_miles == 0"

      - name: travel_date_one_day_past_the_window_returns_travel_date_out_of_window
        claim_type: temporal_validation
        grounds:
          - validations[priority=18]
          - errors.ERR_TRAVEL_DATE_OUT_OF_WINDOW
        distinguishing_aspect: "The window's date interval is CLOSED, so 2026-09-30 books and 2026-10-01 is rejected with ERR_TRAVEL_DATE_OUT_OF_WINDOW (422) - and the rejected attempt must leave seats_held at the 1 seat the accepted booking took, not 2."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE."
            - "One empty AwardInventoryWindow JFK-CDG ECONOMY 2026-09-01..2026-09-30, authorized_seats 10."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
