- section: endpoints
  instances:
  - name: qualification_report_projects_both_cycle_variants_side_by_side
    claim_type: computed_read
    grounds:
    - endpoints[GET /model-revisions/{id}/qualification-report]
    - calculations.revision_cycle_qualification
    - domain_constants.RUNNING_PROJECTION_FACTOR
    distinguishing_aspect: 'The read-only report exposes six fields that exist nowhere on the ModelRevision row, and the two variants diverge the instant a RUNNING run appears: verified stays 500000 (a
      RUNNING run contributes 0) while projected jumps to 580000 (floor(100000 x 0.8) = 80000). The same GET also updates completed_run_count / running_run_count without mutating anything.'
    test_recipe:
      setup:
      - Revision T900-R1 (FULL_COMMERCIAL, min 500000 cycles) is IN_TESTING on rig RIG-A (2 stations).
      - Two runs are COMPLETED PASSED with 300000 and 200000 achieved cycles.
      - A third run is then created with target_cycles 100000 and started, so it is RUNNING with no achieved cycles.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE]}
