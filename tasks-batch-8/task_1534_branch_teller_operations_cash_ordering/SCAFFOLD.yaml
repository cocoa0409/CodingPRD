# =============================================================================
# PRD Benchmark Seed Tables — branch-teller-operations (v1)
# =============================================================================

scenario: |
  Branch Teller Operations & Cash Ordering (community bank branch): teller
  drawer limit & buy/sell to vault, cash order forecasting by branch &
  day-of-week, dual control & cash count/balancing at close, over/short
  tracking & investigation threshold, large cash transaction handling & CTR
  trigger, negotiable instrument (cashier's check/money order) issuance
  controls, hold placement per funds-availability policy, branch audit &
  surprise cash count.

domain_name: branch-teller-operations
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Branch display name" }
      - { name: drawer_limit_cents, type: integer, source: input, description: "Per-drawer cap enforced on buy/sell only: a buy-from-vault is rejected when the post-buy drawer balance would be >= this limit; a sell-to-vault requires pre-sell balance >= limit AND post-sell balance < limit. Customer transactions are never blocked by this limit" }
      - { name: vault_cash_cents, type: integer, source: input, description: "Vault physical cash on hand at open; thereafter mutated only by buy/sell, order deliver, and audit adjustments" }
      - { name: over_short_investigation_threshold_cents, type: integer, source: input, description: "Absolute over/short at or above which an OverShortCase is auto-created" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | AUDIT_FROZEN" }

  - name: Teller
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id" }
      - { name: display_name, type: string, source: input, description: "Teller display name" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }

  - name: Account
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id" }
      - { name: owner_name, type: string, source: input, description: "Account holder display name" }
      - { name: balance_cents, type: integer, source: input, description: "Ledger balance at open; thereafter mutated by posted transactions and hold capture/release" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED" }

  - name: TellerDrawer
    parent: Teller
    common_fields: true
    fields:
      - { name: teller_id, type: string, source: system, description: "FK -> Teller.id" }
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id; denormalized at open from the teller's branch" }
      - { name: cash_balance_cents, type: integer, source: system, default: 0, description: "Drawer physical cash; mutated by buy/sell, transactions, closing counts, audit adjustments" }
      - { name: business_date, type: string, source: system, description: "ISO date (YYYY-MM-DD) of the logical clock day this drawer session serves" }
      - { name: status, type: enum, source: system, description: "OPEN -> COUNTING -> BALANCED / OUT_OF_BALANCE -> CLOSED; CLOSED -> OPEN allowed for the next business date" }
      - { name: expected_cash_cents, type: integer, source: computed, description: "System-expected drawer cash: carry-forward baseline plus signed cash deltas of POSTED transactions, plus buys from vault minus sells to vault (see expected_drawer_cash)" }
      - { name: counted_cash_cents, type: integer, source: system, description: "Physical count attested at count time" }
      - { name: variance_cents, type: integer, source: computed, description: "counted_cash_cents - expected_cash_cents (positive = over, negative = short)" }
      - { name: last_close_variant, type: enum, source: system, description: "Which expected-cash algorithm the most recent close used: STRICT | LENIENT" }

  - name: TellerTransaction
    parent: TellerDrawer
    common_fields: true
    fields:
      - { name: drawer_id, type: string, source: system, description: "FK -> TellerDrawer.id" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id; denormalized at creation from the drawer's branch" }
      - { name: type, type: enum, source: input, description: "CASH_DEPOSIT | CASH_WITHDRAWAL | CHECK_DEPOSIT | CASHIERS_CHECK_PURCHASE | MONEY_ORDER_PURCHASE" }
      - { name: amount_cents, type: integer, source: input, description: "Face amount of the transaction; for CHECK_DEPOSIT the check face amount; for instrument purchases the instrument face amount" }
      - { name: fee_waived, type: boolean, source: input, default: false, description: "TellerRequest only: waive the instrument issuance fee" }
      - { name: is_ctr_exempt, type: boolean, source: input, default: false, description: "Customer is a Phase-I CTR-exempt entity; exempt cash still counts toward daily cash exposure but a CTR is not filed for exempt activity" }
      - { name: fee_cents, type: integer, source: computed, description: "Instrument issuance fee actually charged in cash (0 for non-instrument types and when fee_waived); see instrument_fee" }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED" }
      - { name: voided_by_user_id, type: string, source: system, description: "User id that voided; null unless VOIDED" }

  - name: CashOrder
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id" }
      - { name: order_date, type: string, source: system, description: "ISO date of the logical clock day the order was placed" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the placing teller, recorded for segregation-of-duties on approve/reject" }
      - { name: delivery_date, type: string, source: input, description: "ISO date the shipment is due; must be a later business day than order_date" }
      - { name: projected_need_cents, type: integer, source: computed, description: "Forecast of cash need for the target day-of-week (see forecast_cash_need)" }
      - { name: suggested_order_cents, type: integer, source: computed, description: "forecast_cash_need minus vault_cash_cents at order time, floored at 0" }
      - { name: ordered_amount_cents, type: integer, source: computed, description: "Order quantity after step rounding and vault-capacity clamp" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED / REJECTED; APPROVED -> DELIVERED / CANCELLED" }
      - { name: decided_by_user_id, type: string, source: system, description: "Manager who approved/rejected; null while PENDING" }

  - name: Approval
    parent: Branch
    common_fields: false
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id" }
      - { name: action_type, type: enum, source: system, description: "TELLER_REQUEST | OVER_SHORT_WAIVER | HOLD_WAIVER" }
      - { name: subject_type, type: enum, source: system, description: "TellerRequest | OverShortCase | Hold" }
      - { name: subject_id, type: string, source: system, description: "Polymorphic reference to the subject row's id (TellerRequest, OverShortCase, or Hold per subject_type)" }
      - { name: requested_by_user_id, type: string, source: system, description: "Creator-side user id recorded for segregation-of-duties comparison" }
      - { name: approved_by_user_id, type: string, source: system, description: "Deciding user id (approver, rejector, or waiving manager)" }
      - { name: status, type: enum, source: system, description: "APPROVED | REJECTED — terminal at creation; Approval is an immutable decision record" }

  - name: TellerRequest
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id" }
      - { name: teller_id, type: string, source: system, description: "FK -> Teller.id" }
      - { name: drawer_id, type: string, source: system, description: "FK -> TellerDrawer.id; the teller's drawer for the current business date" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the creating teller, recorded for segregation-of-duties on approve/reject" }
      - { name: type, type: enum, source: input, description: "ISSUE_INSTRUMENT | FEE_WAIVER | OVER_LIMIT_TRANSACTION" }
      - { name: params, type: object, source: input, description: "Type-specific parameters: ISSUE_INSTRUMENT { account_id, instrument_type: CASHIERS_CHECK | MONEY_ORDER, amount_cents, fee_waived }; FEE_WAIVER { transaction_id }; OVER_LIMIT_TRANSACTION { account_id, amount_cents, is_ctr_exempt } (executes a CASH_WITHDRAWAL)" }
      - { name: status, type: enum, source: system, description: "PENDING -> EXECUTED / REJECTED / EXPIRED" }

  - name: Hold
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id; denormalized from the account" }
      - { name: transaction_id, type: string, source: system, description: "FK -> TellerTransaction.id; the CHECK_DEPOSIT whose funds are held" }
      - { name: amount_cents, type: integer, source: computed, description: "Held amount: amount_cents - NEXT_DAY_AVAILABILITY_CENTS, possibly reduced by an approved waiver" }
      - { name: hold_type, type: enum, source: computed, description: "STANDARD (face <= LARGE_CHECK_FACE_CENTS) | LARGE_CHECK (face above)" }
      - { name: release_day_offset, type: integer, source: computed, description: "Business-day offset from deposit business date until release: 2 STANDARD, 7 LARGE_CHECK, 1 after approved waiver" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED | WAIVED" }

  - name: CTRFiling
    parent: Branch
    common_fields: false
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: business_date, type: string, source: system, description: "ISO date of the logical clock day being reported" }
      - { name: total_cash_in_cents, type: integer, source: computed, description: "Sum of POSTED non-exempt CASH_DEPOSIT amounts for the account/branch/date" }
      - { name: total_cash_out_cents, type: integer, source: computed, description: "Sum of POSTED non-exempt CASH_WITHDRAWAL amounts for the account/branch/date" }
      - { name: trigger_direction, type: enum, source: computed, description: "CASH_IN | CASH_OUT | BOTH — which side(s) crossed the CTR threshold" }
      - { name: transaction_ids, type: array, source: computed, description: "Ids of the contributing POSTED non-exempt transactions" }
      - { name: status, type: enum, source: system, description: "FILED | AMENDED" }

  - name: OverShortCase
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id" }
      - { name: drawer_id, type: string, source: system, description: "FK -> TellerDrawer.id" }
      - { name: business_date, type: string, source: system, description: "ISO date of the drawer session that produced the variance" }
      - { name: variance_cents, type: integer, source: system, description: "Signed variance copied from the drawer at case creation" }
      - { name: status, type: enum, source: system, description: "OPEN -> UNDER_INVESTIGATION -> RESOLVED / WAIVED" }

  - name: AuditSession
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id" }
      - { name: type, type: enum, source: input, description: "SCHEDULED | SURPRISE" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date; required for SCHEDULED, must be a later business day; null for SURPRISE" }
      - { name: status, type: enum, source: system, description: "PLANNED -> IN_PROGRESS -> COMPLETED; PLANNED -> CANCELLED" }
      - { name: freeze_applied, type: boolean, source: computed, description: "True once the audit has frozen branch cash movements (SURPRISE immediately at creation, SCHEDULED at begin)" }
      - { name: discrepancy_total_cents, type: integer, source: computed, description: "Signed sum of per-drawer discrepancies plus vault discrepancy recorded at complete" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Teller
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/tellers/{tellerId}/suspend"
        actor: BranchManager
        preconditions:
          - "Teller.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when an OverShortCase is created whose drawer's teller is this teller AND abs(variance_cents) >= 2 * branch.over_short_investigation_threshold_cents — a severe variance)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/tellers/{tellerId}/reinstate"
        actor: BranchManager
        preconditions:
          - "Teller.status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Account
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/accounts/{accountId}/close"
        actor: BranchManager
        preconditions:
          - "Account.status == OPEN (ERR_INVALID_STATE)"
          - "Account.balance_cents == 0 (ERR_ACCOUNT_NOT_SETTLED)"
          - "No Hold on this account in status ACTIVE (ERR_ACCOUNT_NOT_SETTLED)"
        side_effects: []

  - entity: Branch
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: AUDIT_FROZEN
        trigger: "POST /api/branches/{branchId}/audits with type=SURPRISE (system side effect at creation), or POST /api/audits/{auditId}/begin for a SCHEDULED audit"
        actor: Auditor
        preconditions:
          - "Branch must be OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "AuditSession.freeze_applied := true"

      - from: AUDIT_FROZEN
        to: OPEN
        trigger: "system (automatic when the freezing AuditSession reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TellerDrawer
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: CLOSED
        to: OPEN
        trigger: "POST /api/tellers/{tellerId}/drawers"
        actor: HeadTeller | BranchManager
        preconditions:
          - "Teller.status == ACTIVE (ERR_TELLER_SUSPENDED)"
          - "Branch.status == OPEN (ERR_BRANCH_FROZEN)"
          - "No drawer for this teller with status IN {OPEN, COUNTING, BALANCED, OUT_OF_BALANCE} (ERR_DRAWER_ALREADY_OPEN)"
          - "The logical-clock date must differ from every prior drawer session's business_date for this teller (ERR_DRAWER_ALREADY_OPEN)"
        side_effects:
          - "cash_balance_cents := prior CLOSED drawer's counted_cash_cents (carry-forward); 0 for the teller's first drawer"
          - "baseline_cash_cents (algorithm input) := carry-forward amount"

      - from: OPEN
        to: COUNTING
        trigger: "POST /api/drawers/{drawerId}/count"
        actor: Teller
        preconditions:
          - "Drawer.status == OPEN (ERR_INVALID_STATE)"
          - "Request body counted_cash_cents present (ERR_INVALID_REQUEST)"
          - "Acting X-User-ID must equal drawer.teller_id (ERR_FORBIDDEN)"
        side_effects:
          - "counted_cash_cents := request value"

      - from: COUNTING
        to: BALANCED
        trigger: "POST /api/drawers/{drawerId}/attest (dual control: acting manager must differ from the counting teller)"
        actor: BranchManager | Auditor
        preconditions:
          - "Drawer.status == COUNTING (ERR_INVALID_STATE)"
          - "abs(counted_cash_cents - expected_cash_cents) == 0 (else OUT_OF_BALANCE path)"
          - "Attestor X-User-ID != drawer.teller_id (ERR_DUAL_CONTROL_VIOLATION)"
        side_effects:
          - "cash_balance_cents := counted_cash_cents"
          - "last_close_variant := STRICT"

      - from: COUNTING
        to: OUT_OF_BALANCE
        trigger: "POST /api/drawers/{drawerId}/attest (dual control: acting manager must differ from the counting teller)"
        actor: BranchManager | Auditor
        preconditions:
          - "Drawer.status == COUNTING (ERR_INVALID_STATE)"
          - "abs(counted_cash_cents - expected_cash_cents) > 0"
          - "Attestor X-User-ID != drawer.teller_id (ERR_DUAL_CONTROL_VIOLATION)"
        side_effects:
          - "cash_balance_cents := counted_cash_cents"
          - "variance_cents := counted_cash_cents - expected_cash_cents"
          - "If abs(variance_cents) >= branch.over_short_investigation_threshold_cents: create OverShortCase(status=OPEN, variance_cents copied) — cascade link 1 of over/short escalation"
          - "Cascade link 2: the new OverShortCase, when abs(variance_cents) >= 2 * branch.over_short_investigation_threshold_cents, automatically SUSPENDS the drawer's teller (see Teller state machine)"
          - "last_close_variant := STRICT"

      - from: BALANCED
        to: CLOSED
        trigger: "POST /api/drawers/{drawerId}/close"
        actor: BranchManager
        preconditions:
          - "Drawer.status == BALANCED (ERR_INVALID_STATE)"
        side_effects: []

      - from: OUT_OF_BALANCE
        to: CLOSED
        trigger: "POST /api/drawers/{drawerId}/close"
        actor: BranchManager
        preconditions:
          - "Drawer.status == OUT_OF_BALANCE (ERR_INVALID_STATE)"
          - "If an OverShortCase exists for this drawer+business_date, it must be in {RESOLVED, WAIVED} (ERR_OVER_SHORT_UNRESOLVED)"
        side_effects: []

  - entity: TellerTransaction
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /api/transactions/{transactionId}/void"
        actor: BranchManager
        preconditions:
          - "Transaction.status == POSTED (ERR_INVALID_STATE)"
          - "The transaction's drawer must be OPEN (ERR_INVALID_STATE) — voids are same-day corrections only"
          - "Voiding manager X-User-ID must differ from the teller who posted the transaction (segregation of duties: ERR_SOD_VIOLATION)"
          - "If transaction.type == CHECK_DEPOSIT: its Hold must still be ACTIVE (ERR_HOLD_ALREADY_RELEASED); voiding releases the hold"
        side_effects:
          - "Reverse the account balance effect (CASH_DEPOSIT: subtract amount; CASH_WITHDRAWAL: add amount; CHECK_DEPOSIT: subtract the immediately-credited portion; instrument purchases: no balance effect)"
          - "Reverse the drawer cash effect (cash-in: subtract amount+fee; cash-out: add amount; CHECK_DEPOSIT: none)"
          - "Recompute drawer expected_cash_cents (voided transactions drop out of the POSTED set)"
          - "If CHECK_DEPOSIT: Hold.status := RELEASED with NO credit of the held amount (cascade link 1) and Account balance keeps only what was already credited (cascade link 2)"
          - "If the void drops the account's same-day non-exempt cash totals at or below the CTR threshold, mark any FILED CTRFiling for that account/date as AMENDED (cascade link 3)"

  - entity: CashOrder
    initial_state: PENDING
    terminal_states: [REJECTED, DELIVERED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/cash-orders/{orderId}/approve"
        actor: BranchManager
        preconditions:
          - "Order.status == PENDING (ERR_INVALID_STATE)"
          - "Approver X-User-ID must differ from the ordering teller's user id (segregation of duties: ERR_SOD_VIOLATION)"
        side_effects:
          - "decided_by_user_id := approver"

      - from: PENDING
        to: REJECTED
        trigger: "POST /api/cash-orders/{orderId}/reject"
        actor: BranchManager
        preconditions:
          - "Order.status == PENDING (ERR_INVALID_STATE)"
          - "Rejector X-User-ID must differ from the ordering teller's user id (segregation of duties: ERR_SOD_VIOLATION)"
        side_effects:
          - "decided_by_user_id := rejector"

      - from: APPROVED
        to: DELIVERED
        trigger: "POST /api/cash-orders/{orderId}/deliver"
        actor: HeadTeller
        preconditions:
          - "Order.status == APPROVED (ERR_INVALID_STATE)"
          - "Logical-clock date must equal order.delivery_date (ERR_ORDER_NOT_DUE)"
          - "Branch.status == OPEN (ERR_BRANCH_FROZEN)"
        side_effects:
          - "Capacity pre-check first: if Branch.vault_cash_cents + ordered_amount_cents > VAULT_CAPACITY_CENTS the delivery is rejected (ERR_VAULT_CAPACITY_EXCEEDED) and no state changes"
          - "Branch.vault_cash_cents += ordered_amount_cents (cascade link 1)"
          - "increments Branch.version by 1"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /api/cash-orders/{orderId}/cancel"
        actor: BranchManager
        preconditions:
          - "Order.status == APPROVED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: TellerRequest
    initial_state: PENDING
    terminal_states: [EXECUTED, REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /api/teller-requests/{requestId}/approve"
        actor: HeadTeller | BranchManager
        preconditions:
          - "Request.status == PENDING (ERR_INVALID_STATE)"
          - "Approver X-User-ID must differ from request.requested_by_user_id (segregation of duties: ERR_SOD_VIOLATION)"
          - "The subject action is re-validated at execution time per its own rules (e.g., instrument limit, drawer balance); failure aborts with that rule's error"
        side_effects:
          - "Create Approval(action_type mapped from request type, status=APPROVED) (cascade link 1)"
          - "Execute the requested action atomically (cascade link 2):"
          - "  ISSUE_INSTRUMENT: create TellerTransaction(type=CASHIERS_CHECK_PURCHASE|MONEY_ORDER_PURCHASE, status=POSTED); fee per instrument_fee; params.fee_waived honored"
          - "  FEE_WAIVER: locate the referenced POSTED instrument transaction and refund its fee to the account (Account.balance_cents += fee)"
          - "  OVER_LIMIT_TRANSACTION: create TellerTransaction(type=CASH_WITHDRAWAL, status=POSTED) for params.account_id / params.amount_cents / params.is_ctr_exempt; the per-transaction limit check is skipped for this execution"
          - "  Any cash movement re-evaluates the CTR aggregation for the account/date (cascade link 3)"

      - from: PENDING
        to: REJECTED
        trigger: "POST /api/teller-requests/{requestId}/reject"
        actor: HeadTeller | BranchManager
        preconditions:
          - "Request.status == PENDING (ERR_INVALID_STATE)"
          - "Rejector X-User-ID must differ from request.requested_by_user_id (segregation of duties: ERR_SOD_VIOLATION)"
        side_effects:
          - "Create Approval(action_type mapped from request type, status=REJECTED)"

      - from: PENDING
        to: EXPIRED
        trigger: "system (automatic on the first call to POST /api/_clock/set_current_utc that lands on a later calendar date than the request's creation date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OverShortCase
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /api/over-short-cases/{caseId}/investigate"
        actor: BranchManager
        preconditions:
          - "Case.status == OPEN (ERR_INVALID_STATE)"
        side_effects: []

      - from: UNDER_INVESTIGATION
        to: RESOLVED
        trigger: "POST /api/over-short-cases/{caseId}/resolve"
        actor: BranchManager
        preconditions:
          - "Case.status == UNDER_INVESTIGATION (ERR_INVALID_STATE)"
        side_effects: []

      - from: OPEN
        to: WAIVED
        trigger: "POST /api/over-short-cases/{caseId}/waive"
        actor: BranchManager
        preconditions:
          - "Case.status IN {OPEN, UNDER_INVESTIGATION} (ERR_INVALID_STATE)"
          - "abs(case.variance_cents) < branch.over_short_investigation_threshold_cents * OVER_SHORT_WAIVE_FACTOR (ERR_WAIVER_NOT_ALLOWED) — waivers only for variances under twice the investigation threshold"
        side_effects:
          - "Create Approval(action_type=OVER_SHORT_WAIVER, subject=case, status=APPROVED, approved_by_user_id := waiving manager)"

      - from: UNDER_INVESTIGATION
        to: WAIVED
        trigger: "POST /api/over-short-cases/{caseId}/waive"
        actor: BranchManager
        preconditions:
          - "Case.status IN {OPEN, UNDER_INVESTIGATION} (ERR_INVALID_STATE)"
          - "abs(case.variance_cents) < branch.over_short_investigation_threshold_cents * OVER_SHORT_WAIVE_FACTOR (ERR_WAIVER_NOT_ALLOWED)"
        side_effects:
          - "Create Approval(action_type=OVER_SHORT_WAIVER, subject=case, status=APPROVED, approved_by_user_id := waiving manager)"

  - entity: Hold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "system (automatic on POST /api/_clock/set_current_utc when the logical date reaches the deposit business_date + release_day_offset business days) OR side effect of voiding the linked CHECK_DEPOSIT"
        actor: system | BranchManager
        preconditions: []
        side_effects:
          - "Clock path: Account.balance_cents += amount_cents (funds become available)"
          - "Void path: NO credit — the voided deposit never had the held amount posted"

      - from: ACTIVE
        to: WAIVED
        trigger: "POST /api/holds/{holdId}/waive"
        actor: BranchManager
        preconditions:
          - "Hold.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "release_day_offset := 1 (waived hold releases one business day after the deposit business date instead of its original schedule)"
          - "Create Approval(action_type=HOLD_WAIVER, subject=hold, status=APPROVED, approved_by_user_id := waiving manager)"
        note: "WAIVED is not terminal for the clock: the hold still releases on the shortened offset."

      - from: WAIVED
        to: RELEASED
        trigger: "system (automatic on POST /api/_clock/set_current_utc when the logical date reaches the deposit business_date + 1 business day)"
        actor: system
        preconditions: []
        side_effects:
          - "Account.balance_cents += amount_cents"

  - entity: CTRFiling
    initial_state: FILED
    terminal_states: []
    transitions:
      - from: FILED
        to: AMENDED
        trigger: "system (side effect of voiding a contributing transaction when the account's same-day non-exempt totals fall back below the CTR threshold)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AMENDED
        to: FILED
        trigger: "system (side effect of a new POSTED non-exempt transaction that pushes the account's same-day totals back over the CTR threshold)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AuditSession
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /api/audits/{auditId}/begin (SCHEDULED only, and only when the logical-clock date equals scheduled_date); SURPRISE audits are created directly IN_PROGRESS"
        actor: Auditor
        preconditions:
          - "Audit.status == PLANNED (ERR_INVALID_STATE)"
          - "For SCHEDULED: logical-clock date == scheduled_date (ERR_AUDIT_NOT_DUE)"
        side_effects:
          - "Branch.status := AUDIT_FROZEN (cash movements blocked branch-wide); freeze_applied := true"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/audits/{auditId}/complete"
        actor: Auditor
        preconditions:
          - "Audit.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "Request body carries vault_counted_cents and per-drawer counts for every drawer of the branch in status IN {OPEN, COUNTING, BALANCED, OUT_OF_BALANCE} (ERR_INVALID_REQUEST)"
        side_effects:
          - "discrepancy_total_cents := (vault_counted_cents - branch.vault_cash_cents) + sum over counted drawers of (drawer_counted - drawer.cash_balance_cents)"
          - "Branch.vault_cash_cents := vault_counted_cents (audit adjustment)"
          - "Each counted drawer's cash_balance_cents := its audited count (audit adjustment)"
          - "Branch.status := OPEN (freeze lifted)"
          - "If abs(discrepancy_total_cents) >= branch.over_short_investigation_threshold_cents: create OverShortCase(status=OPEN) against the branch's earliest-created drawer among those counted (tie-break: created_at ASC) with variance_cents := discrepancy_total_cents; the same severity rule then applies (abs >= 2 * threshold suspends that drawer's teller)"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/audits/{auditId}/cancel"
        actor: Auditor
        preconditions:
          - "Audit.status == PLANNED (ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: cash-order-create-stale-branch
    parent_entity: Branch
    write_endpoint: "POST /api/branches/{branchId}/cash-orders"
    occ_field: "expected_branch_version"
    description: |
      Creating a CashOrder against a Branch whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just placed a competing cash order for the same
      delivery date (which legitimately supersedes stale planning under the
      one-open-order-per-delivery-date rule) and the current writer's view of
      branch cash is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: drawer-close-stale-drawer
    parent_entity: TellerDrawer
    write_endpoint: "POST /api/drawers/{drawerId}/close"
    occ_field: "expected_drawer_version"
    description: |
      Closing a TellerDrawer whose version has advanced since the client last
      observed it is rejected. This captures the case where an audit adjustment
      or recount has just mutated the drawer (changing the balance the close
      would carry forward) and the closing manager's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: expected_drawer_cash
    trigger: "on every drawer-affecting event (transaction post/void, buy, sell, audit adjustment) and read at count/attest"
    algorithm: aggregation
    formula: |
      baseline = carry-forward counted_cash_cents of the teller's prior CLOSED
                 drawer (0 for the teller's first drawer)
      STRICT variant (used by count/attest/close and by GET .../expected-cash?variant=STRICT):
        expected = baseline
                 + sum over POSTED transactions t on this drawer of cash_delta(t)
                 + sum of buy-from-vault amounts - sum of sell-to-vault amounts
        cash_delta(t): CASH_DEPOSIT +amount_cents
                       CASH_WITHDRAWAL -amount_cents
                       CHECK_DEPOSIT 0
                       CASHIERS_CHECK_PURCHASE +(amount_cents + fee_cents)
                       MONEY_ORDER_PURCHASE +(amount_cents + fee_cents)
      LENIENT variant (preview only, via GET .../expected-cash?variant=LENIENT):
        identical except instrument purchases contribute 0 (their cash is
        treated as vault-settled for staffing previews)
      Fees are cash received at the window: they are part of the drawer's cash
      delta and NEVER touch Account.balance_cents (except via FEE_WAIVER refund).
    input_set: "TellerTransactions of this drawer with status POSTED only (VOIDED excluded); buys/sells recorded on this drawer this business date"
    constants:
      STRICT: "STRICT"
      LENIENT: "LENIENT"
    precision: "integer cents; no rounding"
    variants:
      - name: STRICT
        when: "count/attest/close and default reads"
        difference: "includes instrument-purchase cash (face + fee)"
      - name: LENIENT
        when: "balance preview endpoint only"
        difference: "excludes instrument-purchase cash; expected is lower than STRICT whenever instrument purchases posted"

  - name: forecast_cash_need
    trigger: "on POST /api/branches/{branchId}/cash-orders (and GET forecast preview)"
    algorithm: forward_looking
    formula: |
      Window: the 28 calendar days ending the day before order_date
              [order_date - 28, order_date - 1], inclusive both ends.
      For each calendar day d in the window, over this branch's POSTED
      transactions with business day d (all transactions, exempt or not):
        cash_in(d)  = sum of CASH_DEPOSIT amounts
        cash_out(d) = sum of CASH_WITHDRAWAL amounts
        net(d)      = cash_out(d) - cash_in(d)
      A day counts as a SAMPLE iff it has >= 1 POSTED CASH_DEPOSIT or
      CASH_WITHDRAWAL (instrument purchases and check deposits do not make a
      day a sample).
      Let S = sampled days whose day-of-week == day-of-week(delivery_date),
          O = sampled days with any other day-of-week.
      TRAILING variant:
        if |S| >= FORECAST_MIN_SAMPLES:  base = ceil(mean of net(d) over S)
        elif only one of S, O non-empty: base = ceil(mean of net(d) over that group)
        else: base = ceil( DOW_WEIGHT_SAME * mean(S) + DOW_WEIGHT_OTHER * mean(O) )
        if no samples at all:            base = 0
      WEIGHTED variant (returned alongside for comparison):
        always base_w = ceil( DOW_WEIGHT_SAME * (mean(S) or 0)
                            + DOW_WEIGHT_OTHER * (mean(O) or 0) )
      projected_need_cents = base (TRAILING); means are computed in exact
      rational arithmetic and ceil is applied once at the end.
      suggested_order_cents = max(projected_need_cents - branch.vault_cash_cents, 0)
    input_set: "POSTED TellerTransactions of the branch whose business day falls in the 28-day window; business day = the logical-clock date at posting"
    constants:
      FORECAST_WINDOW_DAYS: 28
      FORECAST_MIN_SAMPLES: 3
      DOW_WEIGHT_SAME: 0.70
      DOW_WEIGHT_OTHER: 0.30
    precision: "integer cents; means exact rational; single final ceil (round half up away from zero for negative bases: ceil(-x) = -floor(x))"
    variants:
      - name: TRAILING
        when: "official forecast stored in projected_need_cents"
        difference: "uses the unweighted same-day-of-week mean once 3+ same-DOW samples exist; falls back to the 70/30 blend otherwise"
      - name: WEIGHTED
        when: "returned as weighted_need_cents in the forecast preview response for management comparison"
        difference: "always applies the 70/30 blend, treating missing groups as 0 without renormalization"

  - name: order_quantity
    trigger: "on POST /api/branches/{branchId}/cash-orders, after forecast_cash_need"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned — step rounding BEFORE capacity clamp:
      1. raw = requested_amount_cents if provided in the request body,
               else suggested_order_cents
      2. stepped = floor(raw / ORDER_STEP_CENTS) * ORDER_STEP_CENTS
      3. capacity_left = max(VAULT_CAPACITY_CENTS - branch.vault_cash_cents, 0)
      4. capacity_stepped = floor(capacity_left / ORDER_STEP_CENTS) * ORDER_STEP_CENTS
      5. ordered_amount_cents = min(stepped, capacity_stepped)
      6. if ordered_amount_cents <= 0: reject with ERR_ORDER_BELOW_MINIMUM
    input_set: "the CashOrder being created and the branch's current vault_cash_cents"
    constants:
      ORDER_STEP_CENTS: 100000
      VAULT_CAPACITY_CENTS: 100000000
    precision: "integer cents; floor rounding at each step, in the pinned order"

  - name: instrument_fee
    trigger: "on execution of a TellerRequest of type ISSUE_INSTRUMENT"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned to break the fee <-> total circle:
      1. fee_base = CASHIERS_CHECK_FEE_CENTS if instrument_type == CASHIERS_CHECK
                    else MONEY_ORDER_FEE_CENTS
      2. fee_cents = 0 if params.fee_waived == true else fee_base
      3. cash_received = amount_cents + fee_cents   (customer pays face + fee in cash)
      4. Drawer cash increases by cash_received; Account.balance_cents is NOT debited
         (the instrument is purchased with cash, not from the account).
      Instrument face limits: MONEY_ORDER amount_cents must be
      <= MONEY_ORDER_MAX_CENTS (ERR_INSTRUMENT_LIMIT); CASHIERS_CHECK has no face cap.
    input_set: "the TellerRequest params"
    constants:
      CASHIERS_CHECK_FEE_CENTS: 800
      MONEY_ORDER_FEE_CENTS: 200
      MONEY_ORDER_MAX_CENTS: 100000
    precision: "integer cents; no rounding"

  - name: hold_capture_amount
    trigger: "on posting a TellerTransaction of type CHECK_DEPOSIT"
    algorithm: threshold
    formula: |
      Let F = amount_cents (check face), D = logical-clock business date.
      immediate_credit = min(F, NEXT_DAY_AVAILABILITY_CENTS)
      hold.amount_cents = F - immediate_credit
      Account.balance_cents += immediate_credit at posting time only.
      hold.hold_type = STANDARD if F <= LARGE_CHECK_FACE_CENTS else LARGE_CHECK
      hold.release_day_offset = 2 for STANDARD, 7 for LARGE_CHECK
      Release rule: when the logical-clock date reaches the release_day_offset-th
      business day (Mon-Fri, excluding Saturdays and Sundays) AFTER D, the hold
      releases: Hold.status := RELEASED and Account.balance_cents += hold.amount_cents.
      Business-day arithmetic: add_business_days(D, n) walks forward n days that
      are Monday..Friday; D itself is not counted.
      Boundary: F == LARGE_CHECK_FACE_CENTS exactly is STANDARD; F == threshold+1
      is LARGE_CHECK. A deposit with F <= NEXT_DAY_AVAILABILITY_CENTS still
      creates a Hold with amount_cents == 0 (status ACTIVE, releases on schedule).
    input_set: "the CHECK_DEPOSIT transaction"
    constants:
      NEXT_DAY_AVAILABILITY_CENTS: 20000
      LARGE_CHECK_FACE_CENTS: 500000
      STANDARD_HOLD_DAYS: 2
      LARGE_CHECK_HOLD_DAYS: 7
      WAIVED_HOLD_DAYS: 1
    precision: "integer cents; no rounding"

  - name: ctr_daily_aggregation
    trigger: "after every TellerTransaction post or void that touches cash"
    algorithm: threshold
    formula: |
      For account A on branch B for business date D (logical-clock date at posting):
        cash_in  = sum of amount_cents over POSTED transactions with
                   type CASH_DEPOSIT, plus the face amount_cents (NOT the fee)
                   of POSTED CASHIERS_CHECK_PURCHASE and MONEY_ORDER_PURCHASE,
                   excluding transactions with is_ctr_exempt == true
        cash_out = sum of amount_cents over POSTED CASH_WITHDRAWAL,
                   excluding transactions with is_ctr_exempt == true
      Filing trigger (strictly greater):
        crossed_in  = cash_in  > CTR_THRESHOLD_CENTS
        crossed_out = cash_out > CTR_THRESHOLD_CENTS
      If crossed_in or crossed_out:
        if no CTRFiling exists for (A, B, D): create one, status=FILED
        if one exists in status AMENDED: it returns to FILED
        always refresh total_cash_in_cents, total_cash_out_cents,
        transaction_ids (ids of contributing POSTED non-exempt transactions,
        ordered by created_at ASC), and trigger_direction
        (CASH_IN if only crossed_in, CASH_OUT if only crossed_out, BOTH if both)
      Else, if a FILED CTRFiling exists for (A, B, D): status := AMENDED
      (totals are refreshed as well).
      Boundary: cash_in == CTR_THRESHOLD_CENTS exactly does NOT file;
      CTR_THRESHOLD_CENTS + 1 files.
    input_set: "POSTED, non-exempt TellerTransactions of the account on the branch with business day D"
    constants:
      CTR_THRESHOLD_CENTS: 1000000
    precision: "integer cents; no rounding"

  - name: audit_discrepancy_total
    trigger: "on POST /api/audits/{auditId}/complete"
    algorithm: aggregation
    formula: |
      discrepancy_total_cents =
          (vault_counted_cents - branch.vault_cash_cents)
        + sum over each counted drawer d of
          (counted_cash_cents_of_d - d.cash_balance_cents)
      then branch.vault_cash_cents := vault_counted_cents and each counted
      drawer's cash_balance_cents := its counted value.
    input_set: "the complete request body (vault_counted_cents + per-drawer counts) and the branch's pre-audit balances"
    constants: {}
    precision: "integer cents; no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path identifiers resolve to existing resources, validated left-to-right (branch, then nested child); a child id that exists but belongs to a different parent is NOT_FOUND", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Target resource is in a state that permits the operation per §1.2 (drawer OPEN for transactions/buy/sell, order PENDING for approve, request PENDING for approve/reject, etc.)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "Referenced Account.status == OPEN when posting a transaction or issuing an instrument against it", error_id: ERR_ACCOUNT_CLOSED, http_status: 409, applies_to: "POST /api/drawers/{drawerId}/transactions, POST /api/teller-requests, TellerRequest execution" }
  - { priority: 4, category: state, check: "Closing an OUT_OF_BALANCE drawer requires its OverShortCase (if any) to be RESOLVED or WAIVED", error_id: ERR_OVER_SHORT_UNRESOLVED, http_status: 409, applies_to: "POST /api/drawers/{drawerId}/close" }
  - { priority: 4, category: state, check: "Voiding a CHECK_DEPOSIT requires its Hold still ACTIVE", error_id: ERR_HOLD_ALREADY_RELEASED, http_status: 409, applies_to: "POST /api/transactions/{transactionId}/void" }
  - { priority: 5, category: business_safety, check: "Branch must not be AUDIT_FROZEN for any cash movement (transactions, buy/sell, drawer open, cash-order create/deliver, instrument execution)", error_id: ERR_BRANCH_FROZEN, http_status: 409, applies_to: "POST /api/drawers/{drawerId}/transactions, POST /api/drawers/{drawerId}/buy-from-vault, POST /api/drawers/{drawerId}/sell-to-vault, POST /api/tellers/{tellerId}/drawers, POST /api/branches/{branchId}/cash-orders, POST /api/cash-orders/{orderId}/deliver, TellerRequest execution" }
  - { priority: 5, category: business_safety, check: "Dual control on close: the attesting manager/auditor's X-User-ID must differ from the drawer's teller_id", error_id: ERR_DUAL_CONTROL_VIOLATION, http_status: 409, applies_to: "POST /api/drawers/{drawerId}/attest" }
  - { priority: 5, category: business_safety, check: "Segregation of duties: approver/rejector X-User-ID must differ from the creator (TellerRequest.requested_by_user_id, CashOrder.created_by_user_id); voiding manager must differ from the posting teller", error_id: ERR_SOD_VIOLATION, http_status: 409, applies_to: "POST /api/teller-requests/{requestId}/approve, POST /api/teller-requests/{requestId}/reject, POST /api/cash-orders/{orderId}/approve, POST /api/cash-orders/{orderId}/reject, POST /api/transactions/{transactionId}/void" }
  - { priority: 5, category: business_safety, check: "Teller.status == ACTIVE when opening a drawer or posting a transaction", error_id: ERR_TELLER_SUSPENDED, http_status: 409, applies_to: "POST /api/tellers/{tellerId}/drawers, POST /api/drawers/{drawerId}/transactions, POST /api/teller-requests" }
  - { priority: 5, category: business_safety, check: "Negotiable instruments are issued only via an approved TellerRequest — direct POST of CASHIERS_CHECK_PURCHASE or MONEY_ORDER_PURCHASE to the transactions endpoint is rejected", error_id: ERR_INSTRUMENT_REQUIRES_APPROVAL, http_status: 409, applies_to: "POST /api/drawers/{drawerId}/transactions" }
  - { priority: 5, category: business_safety, check: "Teller acting on a drawer must be the drawer's owner (X-User-ID == drawer.teller_id) for transactions, buy/sell, and count", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "POST /api/drawers/{drawerId}/transactions, POST /api/drawers/{drawerId}/buy-from-vault, POST /api/drawers/{drawerId}/sell-to-vault, POST /api/drawers/{drawerId}/count, POST /api/teller-requests" }
  - { priority: 6, category: business_constraint, check: "Request shape: required fields present, enums valid, amount_cents a positive integer", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 6, category: business_constraint, check: "At most one drawer session per teller per business date; also at most one non-CLOSED drawer per teller", error_id: ERR_DRAWER_ALREADY_OPEN, http_status: 409, applies_to: "POST /api/tellers/{tellerId}/drawers" }
  - { priority: 6, category: business_constraint, check: "At most one CashOrder in status PENDING or APPROVED per branch per delivery_date", error_id: ERR_DUPLICATE_CASH_ORDER, http_status: 409, applies_to: "POST /api/branches/{branchId}/cash-orders" }
  - { priority: 6, category: business_constraint, check: "At most one AuditSession in status PLANNED or IN_PROGRESS per branch", error_id: ERR_AUDIT_IN_PROGRESS, http_status: 409, applies_to: "POST /api/branches/{branchId}/audits" }
  - { priority: 6, category: business_constraint, check: "Over-short waiver allowed only when abs(variance) < over_short_investigation_threshold_cents * OVER_SHORT_WAIVE_FACTOR", error_id: ERR_WAIVER_NOT_ALLOWED, http_status: 422, applies_to: "POST /api/over-short-cases/{caseId}/waive", constants: { OVER_SHORT_WAIVE_FACTOR: 2 } }
  - { priority: 7, category: business_temporal, check: "CashOrder.delivery_date must be a strictly later Monday-Friday date than the order date", error_id: ERR_INVALID_DELIVERY_DATE, http_status: 422, applies_to: "POST /api/branches/{branchId}/cash-orders" }
  - { priority: 7, category: business_temporal, check: "Cash order deliver requires the logical-clock date to equal delivery_date", error_id: ERR_ORDER_NOT_DUE, http_status: 409, applies_to: "POST /api/cash-orders/{orderId}/deliver" }
  - { priority: 7, category: business_temporal, check: "SCHEDULED audit requires scheduled_date strictly later than the logical-clock date and a Monday-Friday; begin requires logical date == scheduled_date", error_id: ERR_INVALID_AUDIT_DATE, http_status: 422, applies_to: "POST /api/branches/{branchId}/audits" }
  - { priority: 7, category: business_temporal, check: "Beginning a SCHEDULED audit before/after its scheduled_date is rejected", error_id: ERR_AUDIT_NOT_DUE, http_status: 409, applies_to: "POST /api/audits/{auditId}/begin" }
  - { priority: 7, category: business_temporal, check: "The logical clock never moves backward: set_current_utc with a timestamp earlier than the current logical time is rejected", error_id: ERR_CLOCK_REGRESSION, http_status: 422, applies_to: "POST /api/_clock/set_current_utc" }
  - { priority: 8, category: business_referential, check: "Transaction/request account must belong to the same branch as the drawer", error_id: ERR_CROSS_BRANCH, http_status: 422, applies_to: "POST /api/drawers/{drawerId}/transactions, POST /api/teller-requests" }
  - { priority: 8, category: business_referential, check: "FEE_WAIVER params.transaction_id must reference a POSTED instrument-purchase transaction on the same branch", error_id: ERR_TRANSACTION_NOT_FOUND, http_status: 404, applies_to: "POST /api/teller-requests" }
  - { priority: 9, category: business_fiscal, check: "Drawer holds enough cash for cash-out (CASH_WITHDRAWAL face; sell-to-vault amount)", error_id: ERR_INSUFFICIENT_DRAWER_CASH, http_status: 422, applies_to: "POST /api/drawers/{drawerId}/transactions, POST /api/drawers/{drawerId}/sell-to-vault" }
  - { priority: 9, category: business_fiscal, check: "Account has sufficient available funds for a CASH_WITHDRAWAL: balance_cents - sum of ACTIVE hold amounts >= amount_cents", error_id: ERR_INSUFFICIENT_FUNDS, http_status: 422, applies_to: "POST /api/drawers/{drawerId}/transactions, OVER_LIMIT_TRANSACTION execution" }
  - { priority: 9, category: business_fiscal, check: "CASH_WITHDRAWAL amount_cents must be <= TELLER_TRANSACTION_LIMIT_CENTS for teller-direct posting; larger amounts require an approved OVER_LIMIT_TRANSACTION TellerRequest", error_id: ERR_TRANSACTION_OVER_LIMIT, http_status: 422, applies_to: "POST /api/drawers/{drawerId}/transactions", constants: { TELLER_TRANSACTION_LIMIT_CENTS: 500000 } }
  - { priority: 9, category: business_fiscal, check: "Drawer-limit rule on buy/sell per Branch.drawer_limit_cents (buy: post-buy balance must be < limit; sell: pre-sell >= limit and post-sell < limit)", error_id: ERR_DRAWER_LIMIT, http_status: 422, applies_to: "POST /api/drawers/{drawerId}/buy-from-vault, POST /api/drawers/{drawerId}/sell-to-vault" }
  - { priority: 9, category: business_fiscal, check: "Vault holds enough cash for a buy-from-vault", error_id: ERR_INSUFFICIENT_VAULT_CASH, http_status: 422, applies_to: "POST /api/drawers/{drawerId}/buy-from-vault" }
  - { priority: 9, category: business_fiscal, check: "MONEY_ORDER face amount must be <= MONEY_ORDER_MAX_CENTS", error_id: ERR_INSTRUMENT_LIMIT, http_status: 422, applies_to: "TellerRequest creation and execution (ISSUE_INSTRUMENT)" }
  - { priority: 9, category: business_fiscal, check: "Cash order quantity after step-rounding and capacity clamp must be > 0", error_id: ERR_ORDER_BELOW_MINIMUM, http_status: 422, applies_to: "POST /api/branches/{branchId}/cash-orders" }
  - { priority: 9, category: business_fiscal, check: "Delivery must not push vault_cash_cents above VAULT_CAPACITY_CENTS", error_id: ERR_VAULT_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /api/cash-orders/{orderId}/deliver" }
  - { priority: 10, category: business_constraint, check: "OCC: expected_branch_version / expected_drawer_version must equal the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/branches/{branchId}/cash-orders, POST /api/drawers/{drawerId}/close" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z (never wall-clock). Moving to a later calendar date expires PENDING TellerRequests created before that date and releases ACTIVE holds whose release day has been reached."
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Expire PENDING TellerRequests whose creation date is before the new logical date"
      - "Release ACTIVE holds whose business-day release date is reached (credit Account.balance_cents)"

  # --- branches ---
  - method: POST
    path: "/api/branches"
    description: "Open a branch with its cash policies"
    roles: [BranchManager]
    code: 201
    input: [name, drawer_limit_cents, vault_cash_cents, over_short_investigation_threshold_cents]
    output: Branch
    side_effects: []
  - method: GET
    path: "/api/branches"
    description: "List branches (paginated); default order created_at ASC, stable and deterministic"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Branch[]
    side_effects: []
  - method: GET
    path: "/api/branches/{branchId}"
    description: "Get one branch"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: []
    output: Branch
    side_effects: []

  # --- tellers ---
  - method: POST
    path: "/api/branches/{branchId}/tellers"
    description: "Hire a teller at a branch"
    roles: [BranchManager]
    code: 201
    input: [display_name]
    output: Teller
    side_effects: []
  - method: GET
    path: "/api/tellers"
    description: "List tellers, optionally by branch; default order created_at ASC, stable and deterministic"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: ["branch_id?", "limit?", "offset?"]
    output: Teller[]
    side_effects: []
  - method: GET
    path: "/api/tellers/{tellerId}"
    description: "Get one teller"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: []
    output: Teller
    side_effects: []
  - method: POST
    path: "/api/tellers/{tellerId}/suspend"
    description: "Suspend a teller (blocks drawer open and transaction posting)"
    roles: [BranchManager]
    code: 200
    input: []
    output: Teller
    side_effects: ["Teller.status := SUSPENDED"]
  - method: POST
    path: "/api/tellers/{tellerId}/reinstate"
    description: "Reinstate a suspended teller"
    roles: [BranchManager]
    code: 200
    input: []
    output: Teller
    side_effects: ["Teller.status := ACTIVE"]

  # --- accounts ---
  - method: POST
    path: "/api/branches/{branchId}/accounts"
    description: "Open a customer account"
    roles: [BranchManager, HeadTeller]
    code: 201
    input: [owner_name, balance_cents]
    output: Account
    side_effects: []
  - method: GET
    path: "/api/accounts"
    description: "List accounts, optionally by branch; default order created_at ASC, stable and deterministic"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: ["branch_id?", "limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: GET
    path: "/api/accounts/{accountId}"
    description: "Get one account"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/api/accounts/{accountId}/close"
    description: "Close an account (zero balance, no ACTIVE holds)"
    roles: [BranchManager]
    code: 200
    input: []
    output: Account
    side_effects: ["Account.status := CLOSED"]

  # --- drawers ---
  - method: POST
    path: "/api/tellers/{tellerId}/drawers"
    description: "Open the teller's drawer session for the current logical business date; carries forward the prior CLOSED drawer's counted cash"
    roles: [HeadTeller, BranchManager]
    code: 201
    input: []
    output: TellerDrawer
    side_effects: ["cash_balance_cents := carry-forward (prior CLOSED drawer's counted_cash_cents, else 0)"]
  - method: GET
    path: "/api/drawers"
    description: "List drawers, optionally by teller or branch; default order created_at ASC, stable and deterministic"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: ["teller_id?", "branch_id?", "limit?", "offset?"]
    output: TellerDrawer[]
    side_effects: []
  - method: GET
    path: "/api/drawers/{drawerId}"
    description: "Get one drawer"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: []
    output: TellerDrawer
    side_effects: []
  - method: GET
    path: "/api/drawers/{drawerId}/expected-cash"
    description: "Preview expected drawer cash under a variant (STRICT default, LENIENT optional)"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: ["variant?"]
    output: { expected_cash_cents: integer, variant: string }
    side_effects: []
  - method: POST
    path: "/api/drawers/{drawerId}/buy-from-vault"
    description: "Move cash vault -> drawer; rejected if post-buy balance >= drawer limit or vault short"
    roles: [Teller]
    code: 200
    input: [amount_cents]
    output: TellerDrawer
    side_effects: ["Branch.vault_cash_cents -= amount_cents", "drawer.cash_balance_cents += amount_cents"]
  - method: POST
    path: "/api/drawers/{drawerId}/sell-to-vault"
    description: "Move cash drawer -> vault; requires pre-sell balance >= limit and post-sell balance < limit"
    roles: [Teller]
    code: 200
    input: [amount_cents]
    output: TellerDrawer
    side_effects: ["Branch.vault_cash_cents += amount_cents", "drawer.cash_balance_cents -= amount_cents"]
  - method: POST
    path: "/api/drawers/{drawerId}/count"
    description: "Teller attests the physical count; drawer moves OPEN -> COUNTING"
    roles: [Teller]
    code: 200
    input: [counted_cash_cents]
    output: TellerDrawer
    side_effects: ["counted_cash_cents := input"]
  - method: POST
    path: "/api/drawers/{drawerId}/attest"
    description: "Second-person verification of the count (dual control); COUNTING -> BALANCED or OUT_OF_BALANCE"
    roles: [BranchManager, Auditor]
    code: 200
    input: []
    output: TellerDrawer
    side_effects: ["cash_balance_cents := counted_cash_cents", "variance_cents computed; OverShortCase created when |variance| >= branch threshold"]
  - method: POST
    path: "/api/drawers/{drawerId}/close"
    description: "Close a BALANCED or OUT_OF_BALANCE drawer (OCC-guarded)"
    roles: [BranchManager]
    code: 200
    input: [expected_drawer_version]
    output: TellerDrawer
    side_effects: ["increments TellerDrawer.version by 1"]

  # --- transactions ---
  - method: POST
    path: "/api/drawers/{drawerId}/transactions"
    description: "Post a teller transaction (CASH_DEPOSIT, CASH_WITHDRAWAL, CHECK_DEPOSIT only; instruments require an approved TellerRequest)"
    roles: [Teller]
    code: 201
    input: [account_id, type, amount_cents, "is_ctr_exempt?"]
    output: TellerTransaction
    side_effects:
      - "Account balance effect: CASH_DEPOSIT +amount; CASH_WITHDRAWAL -amount; CHECK_DEPOSIT +min(amount, NEXT_DAY_AVAILABILITY_CENTS)"
      - "Drawer cash effect per expected_drawer_cash sign table; expected_cash_cents recomputed"
      - "CHECK_DEPOSIT creates a Hold per hold_capture_amount"
      - "ctr_daily_aggregation re-evaluated for the account/date"
  - method: GET
    path: "/api/transactions"
    description: "List transactions, optionally by drawer, account, or branch; default order created_at ASC, stable and deterministic"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: ["drawer_id?", "account_id?", "branch_id?", "limit?", "offset?"]
    output: TellerTransaction[]
    side_effects: []
  - method: GET
    path: "/api/transactions/{transactionId}"
    description: "Get one transaction"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: []
    output: TellerTransaction
    side_effects: []
  - method: POST
    path: "/api/transactions/{transactionId}/void"
    description: "Void a POSTED transaction (same-day correction; manager other than the posting teller)"
    roles: [BranchManager]
    code: 200
    input: []
    output: TellerTransaction
    side_effects: ["Reverse account and drawer effects", "CHECK_DEPOSIT void releases its Hold without crediting the held amount", "ctr_daily_aggregation re-evaluated (may AMEND a FILED ctr)"]

  # --- cash orders ---
  - method: POST
    path: "/api/branches/{branchId}/cash-orders"
    description: "Place a cash order for a future business day; forecast, step-rounding and capacity clamp applied (OCC-guarded)"
    roles: [Teller, HeadTeller]
    code: 201
    input: [delivery_date, expected_branch_version, "requested_amount_cents?"]
    output: CashOrder
    side_effects: ["forecast_cash_need + order_quantity computed", "increments Branch.version by 1"]
  - method: GET
    path: "/api/cash-orders"
    description: "List cash orders, optionally by branch; default order created_at ASC, stable and deterministic"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: ["branch_id?", "limit?", "offset?"]
    output: CashOrder[]
    side_effects: []
  - method: GET
    path: "/api/cash-orders/{orderId}"
    description: "Get one cash order"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: []
    output: CashOrder
    side_effects: []
  - method: GET
    path: "/api/branches/{branchId}/cash-forecast"
    description: "Forecast preview for a target delivery date: TRAILING projected need, WEIGHTED comparison, and suggested order"
    roles: [BranchManager, HeadTeller, Teller]
    code: 200
    input: [delivery_date]
    output: { projected_need_cents: integer, weighted_need_cents: integer, suggested_order_cents: integer }
    side_effects: []
  - method: POST
    path: "/api/cash-orders/{orderId}/approve"
    description: "Approve a PENDING cash order (manager other than the ordering teller)"
    roles: [BranchManager]
    code: 200
    input: []
    output: CashOrder
    side_effects: ["decided_by_user_id := approver"]
  - method: POST
    path: "/api/cash-orders/{orderId}/reject"
    description: "Reject a PENDING cash order (manager other than the ordering teller)"
    roles: [BranchManager]
    code: 200
    input: []
    output: CashOrder
    side_effects: ["decided_by_user_id := rejector"]
  - method: POST
    path: "/api/cash-orders/{orderId}/deliver"
    description: "Receive the shipment on its delivery date; vault credited"
    roles: [HeadTeller]
    code: 200
    input: []
    output: CashOrder
    side_effects: ["Branch.vault_cash_cents += ordered_amount_cents"]
  - method: POST
    path: "/api/cash-orders/{orderId}/cancel"
    description: "Cancel an APPROVED-but-undelivered order"
    roles: [BranchManager]
    code: 200
    input: []
    output: CashOrder
    side_effects: []

  # --- teller requests (dual-control workflow) ---
  - method: POST
    path: "/api/drawers/{drawerId}/teller-requests"
    description: "Teller creates a dual-control request (ISSUE_INSTRUMENT, FEE_WAIVER, OVER_LIMIT_TRANSACTION) against their own OPEN drawer"
    roles: [Teller]
    code: 201
    input: [type, params]
    output: TellerRequest
    side_effects: []
  - method: GET
    path: "/api/teller-requests"
    description: "List teller requests, optionally by branch, teller, or drawer; default order created_at ASC, stable and deterministic"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: ["branch_id?", "teller_id?", "drawer_id?", "limit?", "offset?"]
    output: TellerRequest[]
    side_effects: []
  - method: GET
    path: "/api/teller-requests/{requestId}"
    description: "Get one teller request"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: []
    output: TellerRequest
    side_effects: []
  - method: POST
    path: "/api/teller-requests/{requestId}/approve"
    description: "Approve and atomically execute a PENDING request (approver != requester)"
    roles: [HeadTeller, BranchManager]
    code: 200
    input: []
    output: TellerRequest
    side_effects: ["Create Approval(TELLER_REQUEST, APPROVED)", "Execute the requested action; ctr_daily_aggregation re-evaluated on any cash movement"]
  - method: POST
    path: "/api/teller-requests/{requestId}/reject"
    description: "Reject a PENDING request (rejector != requester)"
    roles: [HeadTeller, BranchManager]
    code: 200
    input: []
    output: TellerRequest
    side_effects: ["Create Approval(TELLER_REQUEST, REJECTED)"]

  # --- holds ---
  - method: GET
    path: "/api/holds"
    description: "List holds, optionally by account, branch, or transaction; default order created_at ASC, stable and deterministic"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: ["account_id?", "branch_id?", "transaction_id?", "limit?", "offset?"]
    output: Hold[]
    side_effects: []
  - method: GET
    path: "/api/holds/{holdId}"
    description: "Get one hold"
    roles: [BranchManager, HeadTeller, Teller, Auditor]
    code: 200
    input: []
    output: Hold
    side_effects: []
  - method: POST
    path: "/api/holds/{holdId}/waive"
    description: "Waive an ACTIVE hold to the shortened 1-business-day schedule"
    roles: [BranchManager]
    code: 200
    input: []
    output: Hold
    side_effects: ["release_day_offset := 1", "Create Approval(HOLD_WAIVER, APPROVED)"]

  # --- CTR filings ---
  - method: GET
    path: "/api/ctr-filings"
    description: "List CTR filings, optionally by branch or account; default order created_at ASC, stable and deterministic"
    roles: [BranchManager, HeadTeller, Auditor]
    code: 200
    input: ["branch_id?", "account_id?", "limit?", "offset?"]
    output: CTRFiling[]
    side_effects: []
  - method: GET
    path: "/api/ctr-filings/{filingId}"
    description: "Get one CTR filing"
    roles: [BranchManager, HeadTeller, Auditor]
    code: 200
    input: []
    output: CTRFiling
    side_effects: []

  # --- over/short cases ---
  - method: GET
    path: "/api/over-short-cases"
    description: "List over/short cases, optionally by branch or drawer; default order created_at ASC, stable and deterministic"
    roles: [BranchManager, Auditor]
    code: 200
    input: ["branch_id?", "drawer_id?", "limit?", "offset?"]
    output: OverShortCase[]
    side_effects: []
  - method: GET
    path: "/api/over-short-cases/{caseId}"
    description: "Get one over/short case"
    roles: [BranchManager, Auditor]
    code: 200
    input: []
    output: OverShortCase
    side_effects: []
  - method: POST
    path: "/api/over-short-cases/{caseId}/investigate"
    description: "Move an OPEN case to UNDER_INVESTIGATION"
    roles: [BranchManager]
    code: 200
    input: []
    output: OverShortCase
    side_effects: []
  - method: POST
    path: "/api/over-short-cases/{caseId}/resolve"
    description: "Resolve an UNDER_INVESTIGATION case"
    roles: [BranchManager]
    code: 200
    input: []
    output: OverShortCase
    side_effects: []
  - method: POST
    path: "/api/over-short-cases/{caseId}/waive"
    description: "Waive a case whose |variance| is under twice the investigation threshold"
    roles: [BranchManager]
    code: 200
    input: []
    output: OverShortCase
    side_effects: ["Create Approval(OVER_SHORT_WAIVER, APPROVED)"]

  # --- approvals (immutable decision records) ---
  - method: GET
    path: "/api/approvals"
    description: "List approval records, optionally by branch; default order created_at ASC, stable and deterministic"
    roles: [BranchManager, Auditor]
    code: 200
    input: ["branch_id?", "limit?", "offset?"]
    output: Approval[]
    side_effects: []
  - method: GET
    path: "/api/approvals/{approvalId}"
    description: "Get one approval record"
    roles: [BranchManager, Auditor]
    code: 200
    input: []
    output: Approval
    side_effects: []

  # --- audits ---
  - method: POST
    path: "/api/branches/{branchId}/audits"
    description: "Schedule an audit (SCHEDULED for a future business day) or launch a SURPRISE audit (created IN_PROGRESS, freezes the branch immediately)"
    roles: [Auditor]
    code: 201
    input: [type, "scheduled_date?"]
    output: AuditSession
    side_effects: ["SURPRISE: status IN_PROGRESS, freeze_applied=true, Branch.status := AUDIT_FROZEN"]
  - method: GET
    path: "/api/audits"
    description: "List audit sessions, optionally by branch; default order created_at ASC, stable and deterministic"
    roles: [BranchManager, Auditor]
    code: 200
    input: ["branch_id?", "limit?", "offset?"]
    output: AuditSession[]
    side_effects: []
  - method: GET
    path: "/api/audits/{auditId}"
    description: "Get one audit session"
    roles: [BranchManager, Auditor]
    code: 200
    input: []
    output: AuditSession
    side_effects: []
  - method: POST
    path: "/api/audits/{auditId}/begin"
    description: "Begin a SCHEDULED audit on its scheduled date (freezes the branch)"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditSession
    side_effects: ["Branch.status := AUDIT_FROZEN; freeze_applied := true"]
  - method: POST
    path: "/api/audits/{auditId}/complete"
    description: "Complete an IN_PROGRESS audit with vault and drawer counts; adjusts balances, lifts the freeze, may open an OverShortCase"
    roles: [Auditor]
    code: 200
    input: [vault_counted_cents, drawer_counts]
    output: AuditSession
    side_effects: ["audit_discrepancy_total computed", "Branch.vault_cash_cents and drawer balances adjusted to counts", "Branch.status := OPEN", "OverShortCase created when |discrepancy| >= branch threshold"]
  - method: POST
    path: "/api/audits/{auditId}/cancel"
    description: "Cancel a PLANNED (not yet begun) audit"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditSession
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-ID or X-User-Role header, or unrecognized role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or teller acting on another teller's drawer" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path identifier does not resolve (or child belongs to a different parent)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, non-positive or non-integer amount_cents" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that permits the operation" }
  - { id: ERR_ACCOUNT_CLOSED, http: 409, condition: "Transaction or instrument references a CLOSED account" }
  - { id: ERR_ACCOUNT_NOT_SETTLED, http: 409, condition: "Closing an account with nonzero balance or an ACTIVE hold" }
  - { id: ERR_OVER_SHORT_UNRESOLVED, http: 409, condition: "Closing an OUT_OF_BALANCE drawer whose OverShortCase is still OPEN or UNDER_INVESTIGATION" }
  - { id: ERR_HOLD_ALREADY_RELEASED, http: 409, condition: "Voiding a CHECK_DEPOSIT whose hold already RELEASED or WAIVED" }
  - { id: ERR_BRANCH_FROZEN, http: 409, condition: "Cash movement attempted while the branch is AUDIT_FROZEN" }
  - { id: ERR_DUAL_CONTROL_VIOLATION, http: 409, condition: "Attestor id equals the counting teller's id" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Approver/rejector/voider is the same user as the requester/orderer/posting teller" }
  - { id: ERR_TELLER_SUSPENDED, http: 409, condition: "SUSPENDED teller opening a drawer, posting a transaction, or creating a request" }
  - { id: ERR_INSTRUMENT_REQUIRES_APPROVAL, http: 409, condition: "Direct posting of CASHIERS_CHECK_PURCHASE or MONEY_ORDER_PURCHASE without an approved TellerRequest" }
  - { id: ERR_DRAWER_ALREADY_OPEN, http: 409, condition: "The teller already has a non-CLOSED drawer, or already had a drawer session on this business date" }
  - { id: ERR_DUPLICATE_CASH_ORDER, http: 409, condition: "A PENDING or APPROVED cash order already exists for this branch and delivery_date" }
  - { id: ERR_AUDIT_IN_PROGRESS, http: 409, condition: "A PLANNED or IN_PROGRESS audit already exists for this branch" }
  - { id: ERR_WAIVER_NOT_ALLOWED, http: 422, condition: "Over-short waiver for |variance| >= twice the investigation threshold" }
  - { id: ERR_INVALID_DELIVERY_DATE, http: 422, condition: "delivery_date is not a strictly later Monday-Friday date than the order date" }
  - { id: ERR_ORDER_NOT_DUE, http: 409, condition: "Deliver attempted when the logical date differs from delivery_date" }
  - { id: ERR_INVALID_AUDIT_DATE, http: 422, condition: "SCHEDULED audit scheduled_date missing, not a weekday, or not later than today; or scheduled_date supplied for a SURPRISE audit" }
  - { id: ERR_AUDIT_NOT_DUE, http: 409, condition: "Begin attempted when the logical date differs from scheduled_date" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc with a timestamp earlier than the current logical time" }
  - { id: ERR_CROSS_BRANCH, http: 422, condition: "Account and drawer belong to different branches" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "FEE_WAIVER references a transaction id that does not exist, is VOIDED, is not an instrument purchase, or belongs to another branch" }
  - { id: ERR_INSUFFICIENT_DRAWER_CASH, http: 422, condition: "Cash-out exceeds the drawer's current cash_balance_cents" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 422, condition: "Account available balance (balance minus ACTIVE holds) below the withdrawal amount" }
  - { id: ERR_TRANSACTION_OVER_LIMIT, http: 422, condition: "Teller-direct CASH_WITHDRAWAL above TELLER_TRANSACTION_LIMIT_CENTS without an approved OVER_LIMIT_TRANSACTION request" }
  - { id: ERR_DRAWER_LIMIT, http: 422, condition: "Buy would leave drawer >= limit; sell attempted below limit or not bringing the drawer below limit" }
  - { id: ERR_INSUFFICIENT_VAULT_CASH, http: 422, condition: "Buy-from-vault exceeds branch vault_cash_cents" }
  - { id: ERR_INSTRUMENT_LIMIT, http: 422, condition: "MONEY_ORDER face amount above MONEY_ORDER_MAX_CENTS" }
  - { id: ERR_ORDER_BELOW_MINIMUM, http: 422, condition: "Cash order quantity after step-rounding and capacity clamp is zero" }
  - { id: ERR_VAULT_CAPACITY_EXCEEDED, http: 422, condition: "Delivery would push vault_cash_cents above VAULT_CAPACITY_CENTS" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_branch_version or expected_drawer_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BranchManager
    description: "Branch manager — opens branches/tellers/accounts, decides cash orders and teller requests, voids transactions, attests counts, manages over/short cases and holds"
    identity: opaque
    exclusive_operations:
      - "POST /api/branches"
      - "POST /api/branches/{branchId}/tellers"
      - "POST /api/tellers/{tellerId}/suspend"
      - "POST /api/tellers/{tellerId}/reinstate"
      - "POST /api/accounts/{accountId}/close"
      - "POST /api/cash-orders/{orderId}/approve|reject|cancel"
      - "POST /api/transactions/{transactionId}/void"
      - "POST /api/holds/{holdId}/waive"
      - "POST /api/over-short-cases/{caseId}/investigate|resolve|waive"
      - "POST /api/drawers/{drawerId}/close"
    shared_operations:
      - "POST /api/branches/{branchId}/accounts (with HeadTeller)"
      - "POST /api/tellers/{tellerId}/drawers (with HeadTeller)"
      - "POST /api/drawers/{drawerId}/attest (with Auditor)"
      - "POST /api/teller-requests/{requestId}/approve|reject (with HeadTeller)"
      - "GET endpoints per §1.5 roles"
      - "POST /api/_clock/set_current_utc"

  - name: HeadTeller
    description: "Head teller — opens drawers, approves teller requests, receives cash-order deliveries"
    identity: opaque
    exclusive_operations:
      - "POST /api/cash-orders/{orderId}/deliver"
    shared_operations:
      - "POST /api/branches/{branchId}/accounts (with BranchManager)"
      - "POST /api/tellers/{tellerId}/drawers (with BranchManager)"
      - "POST /api/teller-requests/{requestId}/approve|reject (with BranchManager)"
      - "POST /api/branches/{branchId}/cash-orders (with Teller)"
      - "GET endpoints per §1.5 roles"
      - "POST /api/_clock/set_current_utc"

  - name: Teller
    description: "Line teller — operates their own drawer: posts transactions, buys/sells vault cash, counts at close, creates dual-control requests and cash orders. X-User-ID is the Teller entity id."
    identity: "entity_backed:Teller"
    exclusive_operations:
      - "POST /api/drawers/{drawerId}/transactions"
      - "POST /api/drawers/{drawerId}/buy-from-vault"
      - "POST /api/drawers/{drawerId}/sell-to-vault"
      - "POST /api/drawers/{drawerId}/count"
      - "POST /api/drawers/{drawerId}/teller-requests"
    shared_operations:
      - "POST /api/branches/{branchId}/cash-orders (with HeadTeller)"
      - "GET endpoints per §1.5 roles"
      - "POST /api/_clock/set_current_utc"

  - name: Auditor
    description: "Internal auditor — schedules and runs audits, attests counts, reads compliance records"
    identity: opaque
    exclusive_operations:
      - "POST /api/branches/{branchId}/audits"
      - "POST /api/audits/{auditId}/begin|complete|cancel"
    shared_operations:
      - "POST /api/drawers/{drawerId}/attest (with BranchManager)"
      - "GET endpoints per §1.5 roles"
      - "POST /api/_clock/set_current_utc"
