      - name: finalize_while_the_lot_is_on_hold_returns_holdback_not_cleared
        claim_type: Violation to Error
        grounds: ["validations[priority=52]", "errors[ERR_HOLDBACK_NOT_CLEARED]", "state_machines.SettlementStatement.PROVISIONAL_to_HELD"]
        distinguishing_aspect: "A HELD statement whose lot is still on HOLD cannot be finalized: priority 52 returns 409 ERR_HOLDBACK_NOT_CLEARED and the 914 cent holdback stays unresolved with net_payable_cents at the provisional 6048."
        test_recipe:
          setup:
            - "a verified 10.04 lb COD landing with a PROVISIONAL settlement statement"
            - "a 25 minute cold-chain breach logged afterwards, moving the lot to HOLD and the statement to HELD"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["COD"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
