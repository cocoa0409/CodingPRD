          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; policy at defaults."
            - "One evaluator certified by a first review (deviation 0.10), then suspended by two consecutive FAIL reviews (deviations 0.80 and 0.90)."
            - "One cycle in SCHEDULING with no observations, so the suspension cascade voided nothing."
