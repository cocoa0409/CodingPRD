        claim_type: immediate
        grounds:
          - state_machines.InstallOrder.PASSED_to_COMPLETED
          - entities.InstallOrder.fields.final_total_cents
        distinguishing_aspect: "Under immediate consistency the complete response itself carries the recomputed final_total_cents (1020780) — no re-read needed; complements the §1.8 cascade depth instance which asserts the downstream Job/CrewBooking states."
        test_recipe:
          setup:
            - "Already covered build-up: see difficulty instance install_reconciliation_variance_vs_quoted_estimate."
