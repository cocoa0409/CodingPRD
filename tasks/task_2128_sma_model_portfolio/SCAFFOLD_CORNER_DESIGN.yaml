              as: PortfolioManager
              captures: { d2: "$.data.id" }
          assert:
            - "The stale-version request returns HTTP 412 with error_id ERR_STALE_VERSION"
            - "ModelVersion.${mv1}.distribution_count == 1 immediately after that rejection"
            - "${mv1_v2} == ${mv1_v} + 1 — the first distribution advanced the parent's version"
            - "The retry with the refreshed version returns HTTP 201 and SponsorDistribution.${d2}.sponsor_id == ${sp2}"
            - "ModelVersion.${mv1}.distribution_count == 2 at the end"

      - name: occ_stale_account_rejects_the_second_harvest_proposal
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[harvest-create-stale-account]", "validations[priority=8]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "The first harvest proposal advances Account.version; a second proposal for a different security still carrying the pre-proposal version is refused with HTTP 412 ERR_STALE_VERSION rather than silently superseding anything."
