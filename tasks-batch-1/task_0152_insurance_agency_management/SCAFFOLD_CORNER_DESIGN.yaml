scaffold_corner_design:

  # =================================================================
  # Entities
  # =================================================================
  - section: entities
    instances:
      - name: carrier_create_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - "entities.Carrier"
          - "endpoints"
        distinguishing_aspect: "POST /carriers with all required fields returns 201, status PROSPECTIVE, version 1, download_supported default false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /carriers"
              payload: { name: "Acme Ins", naic_code: "12345", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_status: $.data.status, car_v: $.data.version, car_dl: $.data.download_supported }
          assert:
            - "Carrier.${car_id}.status == PROSPECTIVE"
            - "Carrier.${car_id}.version == 1"
            - "Carrier.${car_id}.download_supported == false"

      - name: carrier_get_not_found
        claim_type: Not Found
        grounds:
          - "entities.Carrier"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /carriers/{unknown-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /carriers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: carrier_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Carrier.fields.naic_code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /carriers omitting naic_code returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /carriers"
              payload: { name: "No NAIC", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: producer_npn_duplicate_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Producer.fields.npn"
          - "validations[priority=7]"
          - "errors[ERR_DUPLICATE]"
        distinguishing_aspect: "Second POST /producers with an already-used npn returns ERR_DUPLICATE 409."
        test_recipe:
          setup: ["one producer with npn NPN-DUP exists"]
          setup_api_calls:
            - call: "POST /producers"
              payload: { full_name: "First", npn: "NPN-DUP", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /producers"
              payload: { full_name: "Second", npn: "NPN-DUP", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"

      - name: trust_account_state_code_duplicate_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.TrustAccount.fields.state_code"
          - "validations[priority=7]"
          - "errors[ERR_DUPLICATE]"
        distinguishing_aspect: "Second POST /trust-accounts for state_code already having a trust account returns ERR_DUPLICATE 409."
        test_recipe:
          setup: ["one trust account for CA exists"]
          setup_api_calls:
            - call: "POST /trust-accounts"
              payload: { name: "CA Trust", state_code: "CA", minimum_balance_cents: 0 }
              as: TrustAccountant
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /trust-accounts"
              payload: { name: "CA Trust 2", state_code: "CA", minimum_balance_cents: 0 }
              as: TrustAccountant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"

      - name: license_status_computed_active_at_now
        claim_type: Computed Fields
        grounds:
          - "entities.License.fields.status"
          - "endpoints"
        distinguishing_aspect: "License.status is computed: with clock 2026-06-01, license [2025-01-01,2030-01-01) reads ACTIVE; input status (if any) is ignored."
        test_recipe:
          setup: ["clock at 2026-06-01; a producer with a CA AUTO license [2025-01-01,2030-01-01)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /producers"
              payload: { full_name: "Lic Holder", npn: "NPN-LC1", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /licenses"
              payload: { producer_id: "${prod_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: AgencyAdmin
              captures: { lic_id: $.data.id }
          trigger:
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: AgencyAdmin
              captures: { lic_status: $.data.status }
          assert:
            - "License.${lic_id}.status == ACTIVE"

      - name: license_status_computed_pending_before_effective
        claim_type: Computed Fields
        grounds:
          - "entities.License.fields.status"
          - "entities.License.fields.effective_date"
        distinguishing_aspect: "With clock 2024-06-01 (before effective 2025-01-01), the same license reads PENDING, demonstrating now-dependent computation."
        test_recipe:
          setup: ["clock at 2024-06-01; a producer with a CA AUTO license [2025-01-01,2030-01-01)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /producers"
              payload: { full_name: "Lic Pending", npn: "NPN-LC2", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /licenses"
              payload: { producer_id: "${prod_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: AgencyAdmin
              captures: { lic_id: $.data.id }
          trigger:
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: AgencyAdmin
              captures: { lic_status: $.data.status }
          assert:
            - "License.${lic_id}.status == PENDING"

      - name: policy_system_fields_ignored_on_input
        claim_type: System Fields
        grounds:
          - "entities.Policy.fields.status"
          - "entities.Policy.fields.term_kind"
        distinguishing_aspect: "POST /policies with no renewed_from_policy_id sets term_kind=NEW_BUSINESS and status=QUOTED regardless of any client-supplied status; id/version system-minted."
        test_recipe:
          setup: ["a carrier+product+producer+account exist (no compliance needed for QUOTED creation)"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { name: "Car SY", naic_code: "13579", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id }
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto SY", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod SY", npn: "NPN-SY1", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { wp_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Acct SY", servicing_producer_id: "${wp_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${wp_id}", state_code: "CA", annual_premium_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${wp_id}"
              captures: { pol_id: $.data.id, pol_status: $.data.status, pol_kind: $.data.term_kind, pol_v: $.data.version }
          assert:
            - "Policy.${pol_id}.status == QUOTED"
            - "Policy.${pol_id}.term_kind == NEW_BUSINESS"
            - "Policy.${pol_id}.version == 1"

      - name: account_active_policy_count_starts_zero
        claim_type: Computed Fields
        grounds:
          - "entities.Account.fields.active_policy_count"
        distinguishing_aspect: "A freshly created Account has active_policy_count == 0 (no policies yet)."
        test_recipe:
          setup: ["a producer exists to service the account"]
          setup_api_calls:
            - call: "POST /producers"
              payload: { full_name: "Svc AC", npn: "NPN-AC1", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { name: "Fresh Acct", servicing_producer_id: "${prod_id}", account_type: "COMMERCIAL" }
              as: AccountManager
              captures: { acct_id: $.data.id, cnt: $.data.active_policy_count }
          assert:
            - "Account.${acct_id}.active_policy_count == 0"

      - name: policy_create_unknown_account_not_found
        claim_type: Parent Relationships
        grounds:
          - "entities.Policy.fields.account_id"
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /policies with a non-existent account_id returns ERR_NOT_FOUND 404 (FK existence, left-to-right)."
        test_recipe:
          setup: ["a product + producer exist but no account with the referenced id"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { name: "Car FK", naic_code: "24680", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id }
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto FK", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod FK", npn: "NPN-FK1", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { wp_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { account_id: "00000000-0000-0000-0000-000000000000", product_id: "${prod_id}", writing_producer_id: "${wp_id}", state_code: "CA", annual_premium_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${wp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: license_invalid_date_range_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.License.fields.effective_date"
          - "validations[priority=12]"
          - "errors[ERR_INVALID_DATE_RANGE]"
        distinguishing_aspect: "POST /licenses with effective_date >= expiration_date returns ERR_INVALID_DATE_RANGE 422."
        test_recipe:
          setup: ["a producer exists"]
          setup_api_calls:
            - call: "POST /producers"
              payload: { full_name: "Prod DR", npn: "NPN-DR1", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /licenses"
              payload: { producer_id: "${prod_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2027-01-01T00:00:00Z", expiration_date: "2026-01-01T00:00:00Z" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_DATE_RANGE"

  # =================================================================
  # State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: carrier_initial_state_is_prospective
        claim_type: Initial State
        grounds:
          - "state_machines.Carrier"
          - "entities.Carrier.fields.status"
        distinguishing_aspect: "A newly created Carrier starts in PROSPECTIVE (initial_state)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /carriers"
              payload: { name: "Init C", naic_code: "11111", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, st: $.data.status }
          assert:
            - "Carrier.${car_id}.status == PROSPECTIVE"

      - name: carrier_terminate_cascades_appointments
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Carrier.ACTIVE_to_TERMINATED"
          - "state_machines.Appointment"
          - "entities.Appointment.fields.status"
        distinguishing_aspect: "Terminating an ACTIVE carrier with a non-terminal appointment cascades the appointment to TERMINATED (cascade down)."
        test_recipe:
          setup: ["ACTIVE carrier with an APPROVED appointment for a producer; no active policies on the carrier"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { name: "Car TM", naic_code: "22222", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /carriers/${car_id}/activate"
              payload: { expected_carrier_version: "${car_v}" }
              as: AgencyAdmin
              captures: { car_v2: $.data.version }
            - call: "POST /producers"
              payload: { full_name: "Prod TM", npn: "NPN-TM1", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /appointments"
              payload: { carrier_id: "${car_id}", producer_id: "${prod_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt_id: $.data.id, appt_v: $.data.version }
            - call: "POST /appointments/${appt_id}/approve"
              payload: { expected_appointment_version: "${appt_v}" }
              as: AgencyAdmin
          trigger:
            - call: "POST /carriers/${car_id}/terminate"
              payload: { expected_carrier_version: "${car_v2}" }
              as: AgencyAdmin
            - call: "GET /appointments/${appt_id}"
              payload: {}
              as: AgencyAdmin
              captures: { appt_status: $.data.status }
          assert:
            - "Carrier.${car_id}.status == TERMINATED"
            - "Appointment.${appt_id}.status == TERMINATED"

      - name: appointment_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Appointment"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A TERMINATED appointment cannot be approved again -> ERR_INVALID_STATE 409 (terminal lockdown)."
        test_recipe:
          setup: ["a REQUESTED appointment terminated to TERMINATED"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { name: "Car TL", naic_code: "33333", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /carriers/${car_id}/activate"
              payload: { expected_carrier_version: "${car_v}" }
              as: AgencyAdmin
            - call: "POST /producers"
              payload: { full_name: "Prod TL", npn: "NPN-TL1", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /appointments"
              payload: { carrier_id: "${car_id}", producer_id: "${prod_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt_id: $.data.id, appt_v: $.data.version }
            - call: "POST /appointments/${appt_id}/terminate"
              payload: { expected_appointment_version: "${appt_v}" }
              as: AgencyAdmin
              captures: { appt_v2: $.data.version }
          trigger:
            - call: "POST /appointments/${appt_id}/approve"
              payload: { expected_appointment_version: "${appt_v2}" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: policy_activate_from_quoted_invalid
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Policy.BOUND_to_ACTIVE"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Activating a QUOTED policy (must be BOUND) returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["a QUOTED policy (never bound)"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { name: "Car IV", naic_code: "44444", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id }
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto IV", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod IV", npn: "NPN-IV1", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { wp_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Acct IV", servicing_producer_id: "${wp_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${wp_id}", state_code: "CA", annual_premium_cents: 100000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${wp_id}"
              captures: { pol_id: $.data.id, pol_v: $.data.version }
          trigger:
            - call: "POST /policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Policy.${pol_id}.status == QUOTED (unchanged)"

      - name: reinstate_underwriting_cancellation_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Policy.CANCELLED_to_REINSTATED"
          - "validations[priority=16]"
          - "errors[ERR_REINSTATE_NOT_ALLOWED]"
        distinguishing_aspect: "Reinstating a policy cancelled with reason UNDERWRITING returns ERR_REINSTATE_NOT_ALLOWED 422 even before expiration."
        test_recipe:
          setup: ["an ACTIVE policy cancelled with reason UNDERWRITING; clock before expiration; trust account exists for refund posting"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Car UW", naic_code: "55555", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /carriers/${car_id}/activate"
              payload: { expected_carrier_version: "${car_v}" }
              as: AgencyAdmin
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto UW", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod UW", npn: "NPN-UW1", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { wp_id: $.data.id }
            - call: "POST /licenses"
              payload: { producer_id: "${wp_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /appointments"
              payload: { carrier_id: "${car_id}", producer_id: "${wp_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt_id: $.data.id, appt_v: $.data.version }
            - call: "POST /appointments/${appt_id}/approve"
              payload: { expected_appointment_version: "${appt_v}" }
              as: AgencyAdmin
              captures: { appt_v2: $.data.version }
            - call: "POST /appointments/${appt_id}/activate"
              payload: { expected_appointment_version: "${appt_v2}" }
              as: AgencyAdmin
            - call: "POST /trust-accounts"
              payload: { name: "Trust UW", state_code: "CA", minimum_balance_cents: 0 }
              as: TrustAccountant
              captures: { trust_id: $.data.id, trust_v: $.data.version }
            - call: "POST /trust-accounts/${trust_id}/entries"
              payload: { entry_type: "OPENING_BALANCE", amount_cents: 5000000, expected_trustaccount_version: "${trust_v}" }
              as: TrustAccountant
            - call: "POST /accounts"
              payload: { name: "Acct UW", servicing_producer_id: "${wp_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${wp_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${wp_id}"
              captures: { pol_id: $.data.id, pol_v: $.data.version }
            - call: "POST /policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v}" }
              as: Producer
              as_user_id: "${wp_id}"
              captures: { pol_v2: $.data.version }
            - call: "POST /policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v2}" }
              as: AccountManager
              captures: { pol_v3: $.data.version }
            - call: "POST /policies/${pol_id}/cancel"
              payload: { expected_policy_version: "${pol_v3}", cancellation_date: "2026-06-01T00:00:00Z", cancellation_reason: "UNDERWRITING" }
              as: AccountManager
              captures: { pol_v4: $.data.version }
          trigger:
            - call: "POST /policies/${pol_id}/reinstate"
              payload: { expected_policy_version: "${pol_v4}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REINSTATE_NOT_ALLOWED"
            - "Policy.${pol_id}.status == CANCELLED (unchanged)"

      - name: nonpayment_cancel_forces_pro_rata
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Policy.ACTIVE_to_CANCELLED"
          - "calculations.return_premium"
          - "entities.Policy.fields.cancellation_reason"
        distinguishing_aspect: "Cancelling a SHORT_RATE-product policy with reason NON_PAYMENT forces PRO_RATA: return_premium_cents == 604932 (full unearned), not the short-rate 544438."
        test_recipe:
          setup: ["ACTIVE policy on a SHORT_RATE product, annual 1200000, term 2026-01-01..2027-01-01; clock 2026-07-01; trust account exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
