      - name: visitor_deactivation_cascade_reverts_visit_and_cycle
        grounds:
          - endpoints.POST_/accreditation/visitors/{visitorId}/deactivate
          - state_machines.VisitAssignment.ASSIGNED_to_WITHDRAWN
          - state_machines.AccreditationVisit.SCHEDULED_to_DRAFT
          - state_machines.AccreditationCycle.VISIT_SCHEDULED_to_SELF_ASSESSMENT
          - calculations.visitor_travel_commitment
          - entities.AccreditationVisit.fields.lead_visitor_id
          - entities.AccreditationVisit.fields.scheduled_by_user_id
        distinguishing_aspect: |
          The cascade runs BACKWARD through the workflow instead of forward: one write
          on a roster record un-schedules a visit and reopens a cycle. It is also
          selective - only the deactivated visitor's ASSIGNED seat is withdrawn while
          the co-visitor's seat is untouched - and it clears scheduled_by_user_id, so
