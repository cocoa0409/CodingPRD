        excluded_because:
          difficulty_instance: state_check_precedes_temporal_window_on_unsigned_late_submit
          rationale: "That §1.8 instance violates the priority-40 state rule and the priority-60 window rule with a single submit call and asserts the priority-40 error, which is exactly the ordering claim."

