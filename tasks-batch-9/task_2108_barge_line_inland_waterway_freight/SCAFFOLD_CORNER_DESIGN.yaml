      - name: fleeting_assignment_cancel_leaves_nothing_billable_and_frees_the_berth
        claim_type: Compensation
        grounds:
          - state_machines.FleetingAssignment.RESERVED_to_CANCELLED
          - entities.FleetingBerth.fields.occupied_barge_count
        distinguishing_aspect: "The conserved quantity here is berth OCCUPANCY: reserving then cancelling returns FleetingBerth.occupied_barge_count to its pre-reservation value of 0, leaves fee_cents and billable_days at 0, and returns the hull to IDLE."
        test_recipe:
          setup: ["Berth Cairo Harbor with capacity 2; one idle hull; one RESERVED assignment over [2026-08-18T00:00Z, 2026-08-20T00:00Z)."]
          setup_api_calls:
            - call: "POST /fleeting-berths"
              payload: { harbor_name: "Cairo Harbor", river_mile: 955.0, capacity_barges: 2, daily_fee_cents_per_barge: 15000, switch_fee_cents: 60000 }
              as: WaterwayAdmin
              captures: { fb_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-9801", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b_id: $.data.id }
            - call: "POST /fleeting-assignments"
              payload: { barge_id: "${b_id}", fleeting_berth_id: "${fb_id}", start_at: "2026-08-18T00:00:00Z", end_at: "2026-08-20T00:00:00Z" }
              as: HarborAgent
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /fleeting-assignments/${fa_id}/cancel"
