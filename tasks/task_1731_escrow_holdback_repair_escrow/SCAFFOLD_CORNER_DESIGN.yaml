              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "hb_v2 == hb_v1 + 1 (== 2; every mutation increments version by exactly 1)"
            - "err == ERR_STALE_VERSION (http 412) and repair_scope remains 'Roof plus gutters'"
            - "No delta ledger entry is posted by the rejected amend (ledger still has exactly 1 FUNDING entry)"

