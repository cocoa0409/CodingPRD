            - "e3_status == REJECTED (REQUESTED branch)"
  - section: calculations
    instances:
      - name: sea_service_input_set_filtering
        claim_type: input_set_filtering
        grounds: [calculations.sea_service_day_credit]
        distinguishing_aspect: "Input-set filtering (distinct from the factor-variant §1.8 instance): DRAFT and DISPUTED records are excluded from BOTH totals; SUBMITTED counts only toward provisional; VERIFIED counts toward both. Records of 5/10/15/20 days yield provisional 30.0 (10+20) and verified 20.0."
        test_recipe:
          setup:
            - "Mariner + vessel; R1 DRAFT 5d; R2 SUBMITTED 10d; R3 DISPUTED 15d; R4 VERIFIED 20d (all OCEAN EIGHT_HOUR)"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Filter One", mariner_reference_number: "MRN-CC1-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /vessels", payload: { vessel_name: "SS Filter", imo_number: "IMO-CC1", vessel_class: "BULK", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/sea-service-records", payload: { vessel_id: "${v_id}", position_code: "AB", rank_track: "DECK", rank_grade: 5, service_region: "OCEAN", watch_schedule: "EIGHT_HOUR", start_date: "2025-01-01T00:00:00Z", end_date: "2025-01-05T00:00:00Z" }, as: Mariner, as_user_id: "${m_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/sea-service-records", payload: { vessel_id: "${v_id}", position_code: "AB", rank_track: "DECK", rank_grade: 5, service_region: "OCEAN", watch_schedule: "EIGHT_HOUR", start_date: "2025-02-01T00:00:00Z", end_date: "2025-02-10T00:00:00Z" }, as: Mariner, as_user_id: "${m_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/sea-service-records", payload: { vessel_id: "${v_id}", position_code: "AB", rank_track: "DECK", rank_grade: 5, service_region: "OCEAN", watch_schedule: "EIGHT_HOUR", start_date: "2025-03-01T00:00:00Z", end_date: "2025-03-15T00:00:00Z" }, as: Mariner, as_user_id: "${m_id}", captures: { r3_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/sea-service-records", payload: { vessel_id: "${v_id}", position_code: "AB", rank_track: "DECK", rank_grade: 5, service_region: "OCEAN", watch_schedule: "EIGHT_HOUR", start_date: "2025-04-01T00:00:00Z", end_date: "2025-04-20T00:00:00Z" }, as: Mariner, as_user_id: "${m_id}", captures: { r4_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r2_id}/submit", payload: {}, as: Mariner, as_user_id: "${m_id}" }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r3_id}/submit", payload: {}, as: Mariner, as_user_id: "${m_id}" }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r3_id}/dispute", payload: { reason: "date query" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r4_id}/submit", payload: {}, as: Mariner, as_user_id: "${m_id}" }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r4_id}/verify", payload: {}, as: CredentialingOfficer }
          trigger:
            - { call: "GET /mariners/${m_id}/sea-service-summary", as: CredentialingOfficer, captures: { sum_prov: $.data.provisional_days_total, sum_ver: $.data.verified_days_total } }
          assert:
            - "sum_prov == 30.0 (SUBMITTED 10 + VERIFIED 20; DRAFT 5 and DISPUTED 15 excluded)"
            - "sum_ver == 20.0 (only VERIFIED)"
      - name: restricted_window_exactly_30_days
        claim_type: correct_result
        grounds: [calculations.mariner_readiness_posture]
        distinguishing_aspect: "RESTRICTED threshold uses <= 30 days: medical expiry exactly 30 days out (2026-08-31 vs clock 2026-08-01) yields RESTRICTED with reason MEDICAL_EXPIRING_SOON; 31 days out (2026-09-01) yields CLEAR."
        test_recipe:
          setup: ["MX activated with medical expiry 2026-08-31; MY activated with medical expiry 2026-09-01 (credentials 2030, drug until 2027-01-02 for both)"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Thirty", mariner_reference_number: "MRN-CC2-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { mx_id: $.data.id } }
            - { call: "POST /mariners/${mx_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2026-08-31T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${mx_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${mx_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dtx_id: $.data.id } }
            - { call: "POST /mariners/${mx_id}/drug-tests/${dtx_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners", payload: { full_name: "ThirtyOne", mariner_reference_number: "MRN-CC2-2", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { my_id: $.data.id } }
            - { call: "POST /mariners/${my_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2026-09-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${my_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${my_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dty_id: $.data.id } }
            - { call: "POST /mariners/${my_id}/drug-tests/${dty_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
          trigger:
            - { call: "POST /mariners/${mx_id}/activate", payload: {}, as: FleetAdmin, captures: { mx_posture: $.data.readiness_posture, mx_reasons: $.data.readiness_reasons } }
            - { call: "POST /mariners/${my_id}/activate", payload: {}, as: FleetAdmin, captures: { my_posture: $.data.readiness_posture } }
          assert:
            - "mx_posture == RESTRICTED and mx_reasons == [MEDICAL_EXPIRING_SOON] (exactly 30 days: <= boundary inclusive)"
            - "my_posture == CLEAR (31 days: outside the restricted window)"
      - name: medical_expiry_instant_boundary
        claim_type: precision
        grounds: [calculations.credential_expiry_sweep, calculations.mariner_readiness_posture]
        distinguishing_aspect: "Expiry comparison is strict <: at clock == expiry_date the certificate is still VALID (posture merely RESTRICTED); one second later the sweep flips it EXPIRED and posture drops to BLOCKED with NO_VALID_MEDICAL."
        test_recipe:
          setup: ["M activated; medical expiry 2026-08-20T00:00:00Z (RESTRICTED at activation); credential 2030; drug until 2027-01-02"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Instant", mariner_reference_number: "MRN-CC3-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2026-08-20T00:00:00Z" }, as: CredentialingOfficer, captures: { mc_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: FleetAdmin }
            - { call: "GET /mariners/${m_id}/medical-certificates", as: CredentialingOfficer, captures: { mc_at: "$.data[0].status" } }
            - { call: "GET /mariners/${m_id}", as: CredentialingOfficer, captures: { m_at: $.data.readiness_posture } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:01Z" }, as: FleetAdmin }
            - { call: "GET /mariners/${m_id}/medical-certificates", as: CredentialingOfficer, captures: { mc_after: "$.data[0].status" } }
            - { call: "GET /mariners/${m_id}", as: CredentialingOfficer, captures: { m_after: $.data.readiness_posture, m_after_reasons: $.data.readiness_reasons } }
          assert:
            - "mc_at == VALID and m_at == RESTRICTED (expiry == now is still valid; 0 days remaining is within the restricted window)"
            - "mc_after == EXPIRED and m_after == BLOCKED and m_after_reasons contains NO_VALID_MEDICAL (one second past)"
      - name: drug_currency_inclusive_boundary
        claim_type: precision
        grounds: [calculations.drug_test_currency]
        distinguishing_aspect: "Currency window is inclusive at the boundary: collected 2026-01-02 + 365d = until 2027-01-02T00:00:00Z; at exactly that instant the mariner is still current (CLEAR); one second later the posture is BLOCKED with DRUG_CURRENCY_LAPSED."
        test_recipe:
          setup: ["M activated (NEGATIVE collected 2026-01-02; medical expiry 2027-06-01; credential 2030)"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Currency", mariner_reference_number: "MRN-CC4-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin, captures: { m_until: $.data.drug_test_current_until } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-02T00:00:00Z" }, as: FleetAdmin }
            - { call: "GET /mariners/${m_id}", as: CredentialingOfficer, captures: { m_at: $.data.readiness_posture } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-02T00:00:01Z" }, as: FleetAdmin }
            - { call: "GET /mariners/${m_id}", as: CredentialingOfficer, captures: { m_after: $.data.readiness_posture, m_after_reasons: $.data.readiness_reasons } }
          assert:
            - "m_until == 2027-01-02T00:00:00Z (collected + 365 days)"
            - "m_at == CLEAR (until >= now: inclusive boundary still current; other gates comfortably valid)"
            - "m_after == BLOCKED and m_after_reasons contains DRUG_CURRENCY_LAPSED"
      - name: upgrade_window_and_grade_filters
        claim_type: input_set_filtering
        grounds: [calculations.upgrade_eligibility]
        distinguishing_aspect: "Only VERIFIED records with rank_track DECK, rank_grade >= 4, and start_date within 36 months of now count: a grade-3 record (30d) and a pre-window record (30d, start 2023-01-01 < 2023-08-01) are both excluded, leaving verified_days_in_window == 30.0 from the single qualifying record."
        test_recipe:
          setup: ["M activated; three VERIFIED records: RQ grade 5 2024-06-01..2024-06-30; RG grade 3 2025-01-01..2025-01-30; RO grade 5 2023-01-01..2023-01-30"]
          setup_api_calls:
