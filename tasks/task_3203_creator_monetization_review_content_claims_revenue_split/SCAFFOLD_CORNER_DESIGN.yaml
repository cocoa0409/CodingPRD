        distinguishing_aspect: "A channel that satisfies both numeric thresholds but carries one ACTIVE community strike is rejected with 409 ERR_MONETIZATION_BLOCKED_BY_STRIKE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US with 5000 watch hours, 1500 subscribers and one ACTIVE community strike."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
