            - { call: "POST /sustainability/emission-factors/${f_fuel}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r1: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r1}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r1}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r2: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r2}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r2}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r3: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r3}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r3}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r4: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r4}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r4}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 100, unit: "therm", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r5: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r5}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r5}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records/${r1}/evidence", payload: { file_name: "invoice-jan.pdf", sha256_hex: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { ev1: $.data.id } }
            - { call: "POST /sustainability/evidence-items/${ev1}/transition", payload: { to_state: "VERIFIED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records/${r2}/evidence", payload: { file_name: "invoice-feb.pdf", sha256_hex: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { ev2: $.data.id } }
            - { call: "POST /sustainability/evidence-items/${ev2}/transition", payload: { to_state: "VERIFIED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /sustainability/activity-records/${r3}/evidence", payload: { file_name: "invoice-mar.pdf", sha256_hex: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { ev3: $.data.id } }
            - { call: "POST /sustainability/evidence-items/${ev3}/transition", payload: { to_state: "VERIFIED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_ASSURANCE" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records/${r4}/evidence", payload: { file_name: "invoice-apr.pdf", sha256_hex: "dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { ev4: $.data.id } }
            - { call: "POST /sustainability/evidence-items/${ev4}/transition", payload: { to_state: "VERIFIED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v2: $.data.version, ready: $.data.readiness_pct } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v2}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_ASSURANCE" }, as: SustainabilityManager, captures: { st: $.data.status } }
          assert:
            - "first begin-assurance at readiness 60.0 (300/500) fails with error_id == ERR_READINESS_BELOW_THRESHOLD"
            - "after verifying evidence on r4, readiness_pct == 80.0 (400/500, exact boundary)"
            - "second begin-assurance at exactly 80.0 succeeds: status == UNDER_ASSURANCE (>= semantics)"

      - name: baseline_shift_exactly_5pct_significant
        grounds:
          - calculations.target_trajectory_status
          - entities.EmissionTarget.fields.baseline_shift_significant
          - concurrency_rules[baseline-recalc-stale-target]
        distinguishing_aspect: |
          Boundary metric baseline_shift_pct on the recalculate-baseline
          endpoint: shift exactly 5.0% (1000 -> 1050) is significant (>=
          semantics) while 4.0% (1000 -> 1040) is not. Different metric and
          endpoint from the readiness instance.
        test_recipe:
          setup:
            - "PUBLISHED SCOPE1_STATIONARY factor GLOBAL = 1.0 tCO2e/therm; two LOCKED 2025 cycles: baseA with one APPROVED record of 1050 therm (frozen total 1050.00), baseB with 1040 therm (frozen total 1040.00)"
