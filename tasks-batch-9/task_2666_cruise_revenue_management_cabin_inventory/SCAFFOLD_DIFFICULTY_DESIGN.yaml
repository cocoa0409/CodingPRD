  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: sailing_sales_suspension_resume_cycle_bounded_at_two
        grounds:
          - state_machines.Sailing.OPEN_FOR_SALE_to_SALES_SUSPENDED
          - state_machines.Sailing.SALES_SUSPENDED_to_OPEN_FOR_SALE
          - entities.Sailing.fields.suspension_count
          - errors[ERR_SUSPENSION_LIMIT_REACHED]
        distinguishing_aspect: |
          A cyclic loop on the Sailing entity: OPEN_FOR_SALE -> SALES_SUSPENDED -> OPEN_FOR_SALE
          is traversed twice and the third entry is refused, so the graph is neither a DAG nor
          an unbounded loop - suspension_count is the monotone counter that terminates it while
          the sailing itself sits back in the earlier OPEN_FOR_SALE state.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing AUR-2701 OPEN_FOR_SALE with one IA allotment and one fare rule."
            - "Two complete suspend/resume loops have already been traversed, so suspension_count == 2 and status is back at OPEN_FOR_SALE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
