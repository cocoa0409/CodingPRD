      - name: lot_expired_consume_rejected
        claim_type: input_set_filtering
        grounds:
          - calculations.fefo_issue_order
          - "errors[ERR_LOT_EXPIRED]"
        distinguishing_aspect: "Expired lots are excluded from the FEFO candidate set even before run_ops discards them: consuming the only (now expired) lot fails ERR_LOT_EXPIRED."
        test_recipe:
          setup: ["Center; lot created 2026-09-01 with expiry 2026-09-05; clock advanced to 2026-09-06 (no run_ops yet)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Vav2 Center", airport_code: "CID", occupancy_cap: 10, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/donation-lots"
              payload: { item_name: "milk boxes", category: "BEVERAGE", received_qty: 4, expiry_date: "2026-09-05", declared_value_cents: 200 }
              as: CenterManager
              captures: { lot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /donation-lots/${lot_id}/consume"
              payload: { quantity: 1 }
              as: CenterManager
              captures: { err: $.data.error_id }
          assert:
            - "consume rejected ERR_LOT_EXPIRED (expiry 2026-09-05 < 2026-09-06; no non-expired candidate exists)"
            - "lot remaining_qty unchanged == 4 and status still AVAILABLE until run_ops discards it"
      - name: consume_over_remaining_rejected
        claim_type: threshold
        grounds:
          - entities.DonationLot.fields.remaining_qty
          - "errors[ERR_INSUFFICIENT_QUANTITY]"
        distinguishing_aspect: "Quantity ceiling: quantity 6 > remaining 5 is rejected while the lot is AVAILABLE; nothing is decremented."
        test_recipe:
          setup: ["Center; single lot remaining_qty 5, expiry 2026-09-20"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Zayin2 Center", airport_code: "DBQ", occupancy_cap: 10, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/donation-lots"
              payload: { item_name: "trail mix", category: "FOOD", received_qty: 5, expiry_date: "2026-09-20", declared_value_cents: 250 }
              as: CenterManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /donation-lots/${lot_id}/consume"
              payload: { quantity: 6 }
              as: CenterManager
              captures: { err: $.data.error_id }
          assert:
            - "consume rejected ERR_INSUFFICIENT_QUANTITY (6 > 5)"
            - "lot remaining_qty == 5 (unchanged)"
