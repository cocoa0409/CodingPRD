      - "a REFUND RevenueEntry mirroring the seat SALE when the assignment was CONFIRMED and price_charged_cents > 0"
      - "Booking money fields and channel_settlement_total recomputed"
      - "increments SeatAssignment.version by 1"

  - method: POST
    path: "/flights/{id}/irops-waivers"
    description: "Declare an irregular-operations waiver on a flight, crediting posted ancillary fees in scope and waiving future change fees."
    roles: [OperationsController]
    code: 201
    input: [event_type, delay_minutes, waiver_scope]
    output: IropsWaiver
    side_effects:
      - "Flight.irops_state -> IRREGULAR and active_waiver_count recomputed"
      - "for every Booking with flight_id == this flight and booking_status IN {TICKETED, CHANGE_PENDING}, for every RevenueEntry of that booking with entry_type == SALE whose category is a member of waiver_scope, post one WAIVER_CREDIT entry with gross_cents = -(SALE.gross_cents), tax_cents = -(SALE.tax_cents), net_cents = gross_cents - tax_cents and the same category, product_sku, tax_treatment, revenue_class and revenue_account_code as the credited SALE, source_ref waiver:<IropsWaiver.id>, processed in source SALE created_at ASC order"
      - "for every Booking with flight_id == this flight and booking_status IN {TICKETED, CHANGE_PENDING}: waiver_applied = true; and when CHANGE is a member of waiver_scope, change_fee_waived_cents increases by FareFamily.change_fee_cents of that booking's fare family, capped so change_fee_waived_cents never exceeds that change_fee_cents; when CHANGE is not a member of waiver_scope, change_fee_waived_cents is unchanged"
      - "every AncillaryOffer with offer_status == PRESENTED on those bookings whose product category is a member of waiver_scope transitions to SUPERSEDED"
      - "on event_type == DIVERSION with SEAT in waiver_scope, the flight's HELD and CONFIRMED SeatAssignment rows transition to RELEASED with released_reason IROPS_REACCOMMODATION; this cascade does NOT post the CONFIRMED -> RELEASED REFUND entry for a seat SALE that this same waiver already credited with a WAIVER_CREDIT entry, so every SALE is reversed at most once per waiver"
      - "credited_bookings_count = the number of distinct bookings that received at least one WAIVER_CREDIT entry; credited_amount_cents = the sum of abs(gross_cents) over the WAIVER_CREDIT entries this waiver posted"
      - "recompute recognized_ancillary_net_cents, ancillary_gross_cents and channel_settlement_total for every credited Booking"
  - method: GET
    path: "/irops-waivers/{id}"
    description: "Read one waiver with its credit totals."
    roles: [MerchandisingAnalyst, PricingApprover, DistributionManager, OperationsController, RevenueAccountant, ChannelPartner]
    code: 200
    input: []
    output: IropsWaiver
    side_effects: []
  - method: GET
    path: "/irops-waivers"
    description: "Paginated waiver list, filterable by flight, waiver_state and event_type."
    roles: [MerchandisingAnalyst, PricingApprover, DistributionManager, OperationsController, RevenueAccountant, ChannelPartner]
    code: 200
    input: ["flight_id?", "waiver_state?", "event_type?", "limit?", "offset?"]
    output: IropsWaiver[]
    side_effects: []
  - method: GET
    path: "/flights/{id}/irops-waivers"
    description: "Every waiver declared on one flight."
    roles: [MerchandisingAnalyst, PricingApprover, DistributionManager, OperationsController, RevenueAccountant, ChannelPartner]
    code: 200
    input: ["waiver_state?", "limit?", "offset?"]
    output: IropsWaiver[]
    side_effects: []
  - method: POST
    path: "/irops-waivers/{id}/rescind"
    description: "Rescind an ACTIVE waiver, posting WAIVER_REVERSAL entries that undo every credit it posted."
    roles: [OperationsController]
    code: 200
    input: [rescind_reason]
    output: IropsWaiver
    side_effects:
      - "WAIVER_REVERSAL entries mirroring each WAIVER_CREDIT this waiver posted"
      - "change_fee_waived_cents and waiver_applied restored on every credited booking"
      - "Flight.active_waiver_count recomputed and irops_state -> RECOVERED at zero"
      - "increments IropsWaiver.version by 1"

  - method: GET
    path: "/revenue-entries/{id}"
    description: "Read one immutable revenue-accounting entry."
    roles: [RevenueAccountant]
    code: 200
    input: []
    output: RevenueEntry
    side_effects: []
  - method: GET
    path: "/revenue-entries"
    description: "Paginated revenue-entry ledger, filterable by booking, category, entry_type and accounting_period."
    roles: [RevenueAccountant]
    code: 200
    input: ["booking_id?", "category?", "entry_type?", "accounting_period?", "limit?", "offset?"]
    output: RevenueEntry[]
    side_effects: []
  - method: GET
    path: "/bookings/{id}/revenue-entries"
    description: "The full append-only revenue trail of one booking, ordered created_at ASC."
    roles: [RevenueAccountant]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: RevenueEntry[]
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown field, wrong type, enum value outside the declared set, or numeric/format constraint violated"
  - id: ERR_ANCILLARY_PRODUCT_NOT_FOUND
    http: 404
    condition: "no AncillaryProduct with the given id"
  - id: ERR_FARE_FAMILY_NOT_FOUND
    http: 404
    condition: "no FareFamily with the given id, including an unknown upsell_parent_family_id"
  - id: ERR_FAMILY_ATTRIBUTE_NOT_FOUND
    http: 404
    condition: "no FamilyAttribute with the given id"
  - id: ERR_FLIGHT_NOT_FOUND
    http: 404
    condition: "no Flight with the given id"
  - id: ERR_SEAT_SEGMENT_NOT_FOUND
    http: 404
    condition: "no SeatInventorySegment with the given id"
  - id: ERR_DISTRIBUTION_CHANNEL_NOT_FOUND
    http: 404
    condition: "no DistributionChannel with the given id"
  - id: ERR_CHANNEL_PUBLICATION_NOT_FOUND
    http: 404
    condition: "no ChannelPublication with the given id"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "no Booking with the given id"
  - id: ERR_ANCILLARY_OFFER_NOT_FOUND
    http: 404
    condition: "no AncillaryOffer with the given id"
  - id: ERR_SEAT_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no SeatAssignment with the given id"
  - id: ERR_IROPS_WAIVER_NOT_FOUND
    http: 404
    condition: "no IropsWaiver with the given id"
  - id: ERR_CHANNEL_SCOPE_VIOLATION
    http: 403
    condition: "a ChannelPartner acts on or reads a Booking (or an AncillaryOffer / SeatAssignment of a Booking) whose distribution_channel_id differs from its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the PricingApprover recording a review decision is the same user as FareFamily.design_owner_user_id"
  - id: ERR_FAMILY_STATE_INVALID
    http: 409
    condition: "the fare family is not in a from-state that permits the requested action, or the requested target_status is unreachable from its current status"
  - id: ERR_BOOKING_STATE_INVALID
    http: 409
    condition: "the booking's booking_status is not a legal from-state for the requested action"
  - id: ERR_DISCLOSURE_STATE_INVALID
    http: 409
    condition: "acknowledging a disclosure while disclosure_state != PENDING_ACK"
  - id: ERR_OFFER_STATE_INVALID
    http: 409
    condition: "accepting or declining an offer whose offer_status != PRESENTED"
  - id: ERR_SEAT_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "releasing a seat assignment already in assignment_state RELEASED"
  - id: ERR_WAIVER_STATE_INVALID
    http: 409
    condition: "rescinding a waiver whose waiver_state != ACTIVE"
  - id: ERR_PUBLICATION_STATE_INVALID
    http: 409
    condition: "resyncing a publication whose parity_state != OUT_OF_PARITY"
  - id: ERR_PHASE_TRANSITION_INVALID
    http: 409
    condition: "target_phase is not exactly the next phase after the flight's current sales_phase"
  - id: ERR_FLIGHT_ALREADY_DEPARTED
    http: 409
    condition: "a write touching the flight's inventory, waivers, bookings or seats after sales_phase reached DEPARTED"
  - id: ERR_SEGMENT_CLOSED
    http: 409
    condition: "assigning a seat on a SeatInventorySegment whose segment_state == CLOSED"
  - id: ERR_TOUCHPOINT_PHASE_MISMATCH
    http: 409
    condition: "the requested offer-session touchpoint does not match the flight's sales_phase (BOOKING/PRESALE, CHECKIN/CHECKIN_OPEN, INFLIGHT/BOARDING)"
  - id: ERR_FLIGHT_SALES_PHASE_CLOSED
    http: 409
    condition: "ticketing a booking when the flight's sales_phase is BOARDING or DEPARTED"
  - id: ERR_OFFER_WINDOW_CLOSED
    http: 409
    condition: "accepting or declining an offer when the logical clock is outside the half-open window [valid_from, valid_until)"
  - id: ERR_STALE_BOOKING_VERSION
    http: 412
    condition: "expected_booking_version does not match Booking.version at offer acceptance (rule offer-accept-stale-booking)"
  - id: ERR_STALE_FAMILY_VERSION
    http: 412
    condition: "expected_fare_family_version does not match FareFamily.version at publication creation (rule publication-create-stale-family)"
  - id: ERR_FAMILY_NOT_PUBLISHED
    http: 409
    condition: "ticketing a booking on, or resyncing a publication of, a family whose status != PUBLISHED"
  - id: ERR_IROPS_SALES_BLOCKED
    http: 409
    condition: "ticketing a booking while the flight's irops_state == IRREGULAR"
  - id: ERR_FEE_DISCLOSURE_NOT_ACKNOWLEDGED
    http: 422
    condition: "ticketing a booking whose disclosure_state is NOT_ISSUED or PENDING_ACK"
  - id: ERR_FEE_DISCLOSURE_STALE
    http: 409
    condition: "ticketing a booking whose disclosure_state == STALE, or whose disclosed_fee_fingerprint no longer equals the live FareFamily.fee_fingerprint"
  - id: ERR_DISCLOSURE_FINGERPRINT_MISMATCH
    http: 409
    condition: "acknowledged_fee_fingerprint differs from Booking.disclosed_fee_fingerprint"
  - id: ERR_UNDISCLOSED_FEE_CATEGORY
    http: 422
    condition: "issuing a disclosure for a family with an ACTIVE CHARGEABLE attribute whose product has disclosable_fee == false"
  - id: ERR_FAMILY_NOT_PUBLISHED_TO_CHANNEL
    http: 409
    condition: "ticketing a booking with no IN_PARITY ChannelPublication for its (fare_family_id, distribution_channel_id) pair"
  - id: ERR_CHANNEL_CONTENT_PARITY_BREACH
    http: 409
    condition: "ticketing a booking or accepting an offer on a channel whose content_parity_status == BREACHED"
  - id: ERR_CHANNEL_CATEGORY_UNSUPPORTED
    http: 422
    condition: "a category the request would disclose, merchandise or sell is not a member of DistributionChannel.supported_categories"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "an AncillaryProduct with the same sku already exists"
  - id: ERR_DUPLICATE_FAMILY_CODE
    http: 409
    condition: "a FareFamily with the same code already exists"
  - id: ERR_DUPLICATE_CHANNEL_CODE
    http: 409
    condition: "a DistributionChannel with the same channel_code already exists"
  - id: ERR_DUPLICATE_RECORD_LOCATOR
    http: 409
    condition: "a Booking with the same record_locator already exists, in any booking_status"
  - id: ERR_ATTRIBUTE_DUPLICATE_PRODUCT
    http: 409
    condition: "the family already has an ACTIVE FamilyAttribute for that ancillary_product_id"
  - id: ERR_DUPLICATE_PUBLICATION
    http: 409
    condition: "the (fare_family_id, distribution_channel_id) pair already has a publication with parity_state IN {PENDING, IN_PARITY, OUT_OF_PARITY}"
  - id: ERR_INVALID_ATTRIBUTE_QUANTITY
    http: 422
    condition: "included_quantity == 0 with inclusion == INCLUDED, or included_quantity > 0 with inclusion == CHARGEABLE"
  - id: ERR_UPSELL_CYCLE_DETECTED
    http: 422
    condition: "the upsell_parent_family_id chain would revisit a family already on the path"
  - id: ERR_SEAT_PRODUCT_CATEGORY_INVALID
    http: 422
    condition: "the AncillaryProduct referenced by a seat segment has category != SEAT"
  - id: ERR_SEAT_SEGMENT_ROW_OVERLAP
    http: 409
    condition: "the new segment's rows x letters rectangle shares at least one seat with an OPEN segment on the same flight"
  - id: ERR_SEGMENT_EXCEEDS_CABIN
    http: 422
    condition: "the flight's segments would together declare more seats than Flight.cabin_seat_total"
  - id: ERR_SEAT_ROW_OUT_OF_SEGMENT
    http: 422
    condition: "the requested row is outside the segment's closed row range, or the seat_letter is not a member of segment.seat_letters"
  - id: ERR_SEAT_ALREADY_OCCUPIED
    http: 409
    condition: "a HELD or CONFIRMED SeatAssignment already occupies that (segment, row, seat_letter) triple"
  - id: ERR_OFFER_COOLOFF_CONFLICT
    http: 409
    condition: "an explicitly requested product is still inside its post-decline OFFER_COOLOFF_MINUTES window on this booking"
  - id: ERR_DELAY_THRESHOLD_NOT_MET
    http: 422
    condition: "a DELAY waiver scoping CHANGE declares delay_minutes below IROPS_CHANGE_WAIVER_MIN_DELAY_MINUTES"
  - id: ERR_FAMILY_HAS_NO_ATTRIBUTES
    http: 422
    condition: "submitting a family with zero ACTIVE FamilyAttribute rows"
  - id: ERR_FAMILY_HAS_LIVE_BOOKINGS
    http: 409
    condition: "retiring a family that still has bookings in HELD, TICKETED or CHANGE_PENDING"
  - id: ERR_SEAT_INVENTORY_EXHAUSTED
    http: 409
    condition: "assigning a seat on a segment whose available_seats == 0"
  - id: ERR_OFFER_PRICE_CAP_EXCEEDED
    http: 422
    condition: "the offer's offered_price_cents exceeds the channel's max_ancillary_price_cents at acceptance"
  - id: ERR_BUNDLE_DISCOUNT_FLOOR_BREACH
    http: 422
    condition: "submitting a family whose bundle_price_cents exceeds its recomputed a_la_carte_total_cents"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: MerchandisingAnalyst
    description: "Builds the catalog and designs fare families and their bundled attributes."
    identity: opaque
    exclusive_operations:
      - "POST /ancillary-products"
      - "POST /fare-families"
      - "PATCH /fare-families/{id}"
      - "POST /fare-families/{id}/attributes"
      - "PATCH /family-attributes/{id}"
      - "POST /fare-families/{id}/submit"
    shared_operations:
      - "every GET except the revenue-entry ledger"
      - "POST /_clock/set_current_utc"
  - name: PricingApprover
    description: "Reviews and publishes fare families; the only role that may suspend or retire one. May never approve a family it designed."
    identity: opaque
    exclusive_operations:
      - "POST /fare-families/{id}/review-decision"
      - "POST /fare-families/{id}/status-change"
    shared_operations:
      - "every GET except the revenue-entry ledger"
      - "POST /_clock/set_current_utc"
  - name: DistributionManager
    description: "Registers channels and manages content parity of published families across them."
    identity: opaque
    exclusive_operations:
      - "POST /distribution-channels"
      - "POST /channel-publications"
      - "POST /channel-publications/{id}/resync"
    shared_operations:
      - "every GET except the revenue-entry ledger"
      - "POST /_clock/set_current_utc"
  - name: OperationsController
    description: "Owns flights, the seat map, the demand feed and irregular-operations waivers."
    identity: opaque
    exclusive_operations:
      - "POST /flights"
      - "POST /flights/{id}/phase-advance"
      - "POST /flights/{id}/demand-snapshot"
      - "POST /seat-segments"
      - "POST /flights/{id}/irops-waivers"
      - "POST /irops-waivers/{id}/rescind"
    shared_operations:
      - "every GET except the revenue-entry ledger"
      - "POST /_clock/set_current_utc"
  - name: RevenueAccountant
    description: "Reads the append-only ancillary revenue ledger and its tax treatment. The only role that may read revenue entries."
    identity: opaque
    exclusive_operations:
      - "GET /revenue-entries/{id}"
      - "GET /revenue-entries"
      - "GET /bookings/{id}/revenue-entries"
    shared_operations:
      - "every other GET"
      - "POST /_clock/set_current_utc"
  - name: ChannelPartner
    description: "An indirect or direct selling channel acting on its own bookings. X-User-ID is the DistributionChannel.id it sells for."
    identity: "entity_backed:DistributionChannel"
    exclusive_operations:
      - "POST /bookings"
      - "POST /bookings/{id}/disclosure"
      - "POST /bookings/{id}/disclosure-ack"
      - "POST /bookings/{id}/ticket"
      - "POST /bookings/{id}/change-open"
      - "POST /bookings/{id}/change-settle"
      - "POST /bookings/{id}/cancel"
      - "POST /bookings/{id}/offer-sessions"
      - "POST /ancillary-offers/{id}/accept"
      - "POST /ancillary-offers/{id}/decline"
      - "POST /bookings/{id}/seat-assignments"
      - "POST /seat-assignments/{id}/release"
    shared_operations:
      - "every GET except the revenue-entry ledger, scoped to its own channel for Booking, AncillaryOffer and SeatAssignment reads"
      - "POST /_clock/set_current_utc"
