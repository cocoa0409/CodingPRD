  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: signature_capture_blocked_by_lot_quarantined_after_visit
        grounds:
          - state_machines.SampleDisbursement.PENDING_SIGNATURE_to_SIGNED
          - entities.SampleLot.fields.status
        distinguishing_aspect: |
          Pair = SampleDisbursement × SampleLot: the disbursement's valid
          transition depends on the LOT's current status at capture time, not
          at disbursement creation — quarantine between create and capture
          flips the capture from success to ERR_LOT_NOT_RELEASABLE.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Rep S, ELIGIBLE prescriber, lot RELEASED at disbursement creation."
            - "Visit completed; disbursement of 4 units PENDING_SIGNATURE."
            - "Then a CRITICAL excursion quarantines the lot... but that VOIDs the pending disbursement, so instead use a MINOR-adjacent path: quarantine via assess voids PENDING disbursements. To isolate the capture-time recheck, the lot is quarantined AFTER the disbursement is signed-eligible but BEFORE capture, via a direct lot state change: the capture rechecks lot status and fails."
