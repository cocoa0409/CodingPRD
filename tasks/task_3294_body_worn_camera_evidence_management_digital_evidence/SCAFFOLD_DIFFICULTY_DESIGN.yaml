# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3294_body_worn_camera_evidence_management_digital_evidence
# Nine Difficulty Rules x 2 instances each = 18 instances.
# Every setup chain drives empty-DB -> precondition state via §1.5 endpoints.
# Clock discipline: logical clock defaults to 2026-09-01T00:00:00Z; every chain
# pins it explicitly first. All fixture hashes are exactly 64 lowercase hex
# chars (only [0-9a-f]); hex chars beyond [0-9a-f] are declared mismatches.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: redaction_single_pass_vs_multi_pass_effort_diverges
        grounds:
          - calculations.redaction_effort_minutes
          - entities.RedactionJob.fields.estimated_minutes
          - endpoints.POST_/agencies/{agencyId}/recordings/{recordingId}/redaction-jobs
        distinguishing_aspect: "Same recording (face+audio, 7260s = 121 media-minutes), SINGLE_PASS yields ceil(121*2*1.5)=363 minutes while MULTI_PASS yields ceil(121*5*2)+30=1240 minutes — the variant pinned by `passes`, not by any other input, selects between two valid effort algorithms on the RedactionJob/Recording domain."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency with ACTIVE policy (tagging_required true, review rate 0). Officer with assigned docked device. One ACTIVE recording, category INCIDENT, duration 7260s."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 7260, size_bytes: 2147483648, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { rec: $.data.id }
          trigger:
            - call: "POST /agencies/${ag}/recordings/${rec}/redaction-jobs"
              payload: { request_reference: "PRR-1", scope_face: true, scope_audio: true, passes: "SINGLE_PASS" }
              as: RecordsOfficer
              captures: { j1: $.data.id }
            - call: "POST /agencies/${ag}/recordings/${rec}/redaction-jobs"
              payload: { request_reference: "PRR-2", scope_face: true, scope_audio: true, passes: "MULTI_PASS" }
              as: RecordsOfficer
              captures: { j2: $.data.id }
          assert:
            - "RedactionJob.${j1}.estimated_minutes == 363"
            - "RedactionJob.${j2}.estimated_minutes == 1240"
            - "RedactionJob.${j1}.estimated_minutes != RedactionJob.${j2}.estimated_minutes"

      - name: budget_projection_full_month_vs_prorated_accrual_diverges
        grounds:
          - calculations.storage_monthly_cost_cents
          - calculations.storage_gib_billing_rounding
          - endpoints.GET_/agencies/{agencyId}/storage/budget-projection
        distinguishing_aspect: "Same storage_used_bytes (3 GiB total) on a clock at 2026-09-16 (day 16 of a 30-day month): the PROJECTION variant reports ceil(3*1000)=3000 cents full-month while the ACCRUAL variant reports floor(3000*16/30)=1600 cents — dual-variant budget math on the Agency/StorageBudgetPlan domain, distinct from the RedactionJob effort variant."
        test_recipe:
          setup:
            - "Clock advanced to 2026-09-16T00:00:00Z before the projection call. Agency with ACTIVE policy (tagging_required true, review rate 0) and ACTIVE budget plan (10000 cents/month, 1000 cents/GiB-month, alert 80%). Three ACTIVE INCIDENT recordings of 1 GiB each (total 3221225472 bytes)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/storage-budget-plans"
              payload: { fiscal_year_start_month: 1, monthly_budget_cents: 10000, cost_per_gb_month_cents: 1000, alert_threshold_pct: 80, effective_from_month: "2026-01" }
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1073741824, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1073741824, recorded_at: "2026-09-01T00:01:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1073741824, recorded_at: "2026-09-01T00:02:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "GET /agencies/${ag}/storage/budget-projection"
              payload: {}
              as: RecordsOfficer
          assert:
            - "response.data.projection_month_cost_cents == 3000"
            - "response.data.current_month_accrued_cost_cents == 1600"
            - "response.data.posture == OK"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: multi_year_projection_growth_crossing_boundary
        grounds:
          - calculations.multi_year_budget_projection
          - calculations.storage_posture
          - endpoints.GET_/agencies/{agencyId}/storage/budget-projection
        distinguishing_aspect: "Mode (a) combinatorial: 4 inputs (storage bytes, growth rate, months, threshold) with non-linear compounding — 1 GiB at 10% monthly growth projected over 5 months yields per-month costs 1000/1100/1210/1331/1464 cents and every one stays strictly below the 1500-cent budget (1464 < 1500), so first_over_budget_month_index is null; a naive implementer who rounds 1.1^4 to 1.46 and applies >= would mis-flag month 4."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency, ACTIVE policy, ACTIVE budget plan (1500 cents/month, 1000 cents/GiB-month, alert 80%). One ACTIVE INCIDENT recording of exactly 1 GiB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/storage-budget-plans"
              payload: { fiscal_year_start_month: 1, monthly_budget_cents: 1500, cost_per_gb_month_cents: 1000, alert_threshold_pct: 80, effective_from_month: "2026-01" }
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1073741824, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
          trigger:
            - call: "GET /agencies/${ag}/storage/budget-projection?months=5&plan_growth_bps=1000"
              payload: {}
              as: AgencyAdmin
          assert:
            - "response.data.months has 5 entries whose projected_cost_cents are exactly [1000, 1100, 1210, 1331, 1464] in month_index order 0..4 (growth compounds on the byte count 1073741824 * 1.1^m before GiB conversion and per-month ceil)"
            - "every months[i].over_budget == false (1464 < 1500; strict > never fires)"
            - "response.data.first_over_budget_month_index is null"
            - "response.data.total_projected_cost_cents == 6105"

      - name: per_month_ceil_then_sum_beats_sum_then_ceil
        grounds:
          - calculations.storage_gib_billing_rounding
          - calculations.storage_monthly_cost_cents
        distinguishing_aspect: "Mode (b) nested rounding: with 1 GiB at 1000 cents/GiB-month and growth 10%, per-month ceil then sum yields 1000+1100+1210+1331 = 4641, while sum-then-ceil of the raw floats would yield 4641 only if ceiled once — the pinned order (ceil each month, sum integer cents) is what the implementation MUST exhibit; verified against literal month values 1000/1100/1210/1331."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency, ACTIVE policy, ACTIVE budget plan (100000 cents/month so posture never interferes, 1000 cents/GiB-month, alert 80%). One ACTIVE INCIDENT recording of exactly 1 GiB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/storage-budget-plans"
              payload: { fiscal_year_start_month: 1, monthly_budget_cents: 100000, cost_per_gb_month_cents: 1000, alert_threshold_pct: 80, effective_from_month: "2026-01" }
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1073741824, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
          trigger:
            - call: "GET /agencies/${ag}/storage/budget-projection?months=4&plan_growth_bps=1000"
              payload: {}
              as: AgencyAdmin
          assert:
            - "months[0].projected_cost_cents == 1000"
            - "months[1].projected_cost_cents == 1100"
            - "months[2].projected_cost_cents == 1210"
            - "months[3].projected_cost_cents == 1331"
            - "total_projected_cost_cents == 4641 (per-month ceil then sum; a sum-then-ceil pipeline that carried fractional cents would report 4641 only by coincidence at these inputs — the per-month literals 1100/1210/1331 with exact fractional parts 1100.000/1210.000/1331.000 pin the GiB precision: implementation must compound on the byte count, not on rounded cents)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: redaction_job_revision_cycle_returns_to_in_progress
        grounds:
          - state_machines.RedactionJob.SUBMITTED_to_RETURNED
          - state_machines.RedactionJob.RETURNED_to_IN_PROGRESS
          - state_machines.RedactionJob.IN_PROGRESS_to_SUBMITTED
        distinguishing_aspect: "Cyclic machine on RedactionJob: IN_PROGRESS -> SUBMITTED -> RETURNED -> IN_PROGRESS -> SUBMITTED -> APPROVED -> RELEASED traverses the revision loop once; the RETURNED restart clears actual_minutes to null, and the second submit carries a new value — proving the cycle re-enters cleanly rather than treating RETURNED as terminal."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency, ACTIVE policy (tagging true, rate 0). Officer with assigned device; one ACTIVE INCIDENT recording; one QUEUED redaction job (face only, SINGLE_PASS)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 600, size_bytes: 1048576, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { rec: $.data.id }
            - call: "POST /agencies/${ag}/recordings/${rec}/redaction-jobs"
              payload: { request_reference: "PRR-1", scope_face: true, scope_audio: false, passes: "SINGLE_PASS" }
              as: RecordsOfficer
              captures: { job: $.data.id }
            - call: "POST /agencies/${ag}/redaction-jobs/${job}/start"
              payload: {}
              as: RedactionTechnician
              as_user_id: "tech-1"
            - call: "POST /agencies/${ag}/redaction-jobs/${job}/submit"
              payload: { actual_minutes: 40 }
              as: RedactionTechnician
              as_user_id: "tech-1"
            - call: "POST /agencies/${ag}/redaction-jobs/${job}/return"
              payload: {}
              as: RecordsOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /agencies/${ag}/redaction-jobs/${job}/start"
              payload: {}
              as: RedactionTechnician
              as_user_id: "tech-1"
            - call: "POST /agencies/${ag}/redaction-jobs/${job}/submit"
              payload: { actual_minutes: 55 }
              as: RedactionTechnician
              as_user_id: "tech-1"
            - call: "POST /agencies/${ag}/redaction-jobs/${job}/approve"
              payload: {}
              as: RecordsOfficer
              as_user_id: "ro-1"
            - call: "POST /agencies/${ag}/redaction-jobs/${job}/release"
              payload: {}
              as: RecordsOfficer
              as_user_id: "ro-1"
          assert:
            - "after the RETURNED -> IN_PROGRESS restart, RedactionJob.${job}.actual_minutes was reset to null (observable via the job read embedded in the start response)"
            - "final RedactionJob.${job}.status == RELEASED"
            - "final RedactionJob.${job}.actual_minutes == 55"

      - name: recording_parallel_dims_flagging_independent_of_upload_state
        grounds:
          - state_machines.Recording.NOT_FLAGGED_to_PENDING_REVIEW
          - state_machines.Recording.PENDING_REVIEW_to_REVIEWED
          - state_machines.Recording.ACTIVE_to_RETENTION_DUE
          - state_machines.Recording.RETENTION_DUE_to_PURGED
        distinguishing_aspect: "Parallel state dimensions on Recording: with sampling rate 100 every upload is PENDING_REVIEW; advancing the clock 200 days moves the recording ACTIVE -> RETENTION_DUE -> PURGED (no holds) while review_status stays PENDING_REVIEW the whole time — the review dimension is never auto-advanced by the upload dimension, and a purge leaves pending_review_count stale-decremented only via mark-reviewed's precondition blocking (REVIEWED unreachable post-purge)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency, ACTIVE policy (tagging true, rate 100 so sampling flags every upload). Officer with assigned device. One ACTIVE INCIDENT recording (retention 180 days, uploaded at clock T0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 100, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 600, size_bytes: 1048576, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { rec: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/retention/run"
              payload: {}
              as: AgencyAdmin
          assert:
            - "Recording.${rec}.upload_status == PURGED (180-day INCIDENT retention expired 2026-02-28, well before 2027-03-20)"
            - "Recording.${rec}.review_status == PENDING_REVIEW (review dimension never auto-advanced)"
            - "Officer.${officer}.pending_review_count == 1 (the pending review counter is not decremented by purge)"
            - "Officer.${officer}.recordings_uploaded_count == 0 (purge decrements the upload count)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: purge_cascade_recording_to_agency_posture_to_case_rollup
        grounds:
          - state_machines.Recording.RETENTION_DUE_to_PURGED
          - calculations.storage_posture
          - calculations.case_retention_due_at
          - endpoints.POST_/agencies/{agencyId}/retention/run
        distinguishing_aspect: "Depth-3 cascade from the retention run trigger: recording purge (link 1) recomputes agency.storage_used_bytes and flips storage_posture OVER_BUDGET -> OK (link 2, caused by link 1), and the same purge recomputes the linked case's total_evidence_bytes and nulls its retention_due_at (link 3 sibling branch off link 1 via the case rollup) — each hop is caused by the previous mutation, not by the run itself touching all three in parallel."
        test_recipe:
          setup:
            - "Clock starts 2026-09-01T00:00:00Z. Agency with ACTIVE policy (tagging true, rate 0) and budget plan 3000 cents/month at 1000 cents/GiB (posture OVER_BUDGET once 4 GiB live). Officer with assigned device. Four ACTIVE INCIDENT recordings: three 1 GiB unlinked + one 1 GiB linked to an OPEN case. Clock then advanced to 2027-03-01 (past INCIDENT 180-day retention)."
