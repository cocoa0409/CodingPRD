      - name: expiry_sweep_reports_every_delegation_grant_it_expired
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/expiry-sweeps
          - state_machines.DelegationGrant.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          The sweep is a bulk action whose response enumerates exactly what it changed and nothing else:
          with the clock at 2026-08-05T00:00:00Z — the half-open window's exclusive end — the grant is
          reported in expired_delegation_grant_ids and moved to EXPIRED, while expired_quote_ids,
          voided_order_form_ids and released_exception_ids all come back empty because no quote, form or
          exception exists.
        test_recipe:
          setup:
            - "The base configuration from the anchored chain; no quote, order form or competitive exception exists."
            - "One DelegationGrant from u-dir-1 to u-appr-a at tier_level 2 over [2026-08-01T00:00:00Z, 2026-08-05T00:00:00Z)."
            - "The logical clock advanced to exactly 2026-08-05T00:00:00Z."
          setup_api_calls:
            - *cb_clock
