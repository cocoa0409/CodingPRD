              payload: { patient_id: "${pat_id}", body_region: "LEFT_ARM", payer_name: "Acme Health", auth_number: "AUTH-2", visit_cap: 5, effective_start_date: "2026-06-30", effective_end_date: "2026-07-31" }
              as: Authorizer
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_AUTH_WINDOW_OVERLAP (2026-06-30 is shared by both closed windows)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: compensating_visit_release_conserves_available
        grounds:
          - state_machines.Session.SCHEDULED_to_CANCELLED
