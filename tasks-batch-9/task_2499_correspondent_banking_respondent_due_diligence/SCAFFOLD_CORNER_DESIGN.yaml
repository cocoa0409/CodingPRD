  # ===========================================================================
  # §1.9 / validations - one instance per validation rule family, plus the
  # generic precedence corners (auth > existence, role > existence,
  # existence > body, OCC > temporal). The four PRECEDENCE PAIRs the scaffold
  # names inline (P1..P4) are deliberately NOT duplicated here.
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_win_over_a_nonexistent_path_id
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=4]
        distinguishing_aspect: "The request is doubly invalid - it carries no X-User-ID / X-User-Role headers at all AND addresses a respondent id that does not exist - and priority 1 must win, so the answer is 401 ERR_UNAUTHENTICATED rather than 404 ERR_RESPONDENT_NOT_FOUND. An X-User-Role header carrying a value outside the six declared roles (for example Auditor) must produce the same 401, not a 403."
        test_recipe:
          setup: ["Empty system; no respondent with id 00000000-0000-0000-0000-000000000000 exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /correspondent-banking/respondents/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Unauthenticated
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "response.status != 404 - the auth ladder is evaluated before path resolution"

      - name: forbidden_role_is_decided_before_the_path_id_is_resolved
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
        distinguishing_aspect: "CommitteeApprover is absent from the roles list of PATCH /correspondent-banking/respondents/{respondentId} (FIGRelationshipManager and PlatformAdmin only), and the addressed id is also unknown; priority 2 outranks priority 4 so the caller learns 403 ERR_FORBIDDEN_ROLE and never that the respondent is missing."
        test_recipe:
          setup: ["Empty system."]
          setup_api_calls: []
          trigger:
            - call: "PATCH /correspondent-banking/respondents/00000000-0000-0000-0000-000000000000"
              payload: { legal_name: "Renamed Bank AG" }
              as: CommitteeApprover
              as_user_id: "u-committee-1"
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: respondent_contact_cannot_reach_another_respondents_questionnaire
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_RESPONDENT_SCOPE_VIOLATION]
        distinguishing_aspect: "The acting role IS permitted on POST /correspondent-banking/questionnaires/{questionnaireId}/control-assessments, so priority 2 passes; the failure is that the RespondentContact's X-User-ID is respondent R2 while the addressed questionnaire hangs off respondent R1, which the scope rule must detect through the questionnaire's respondent_bank_id rather than from the URL."
        test_recipe:
          setup: ["Two DD_IN_PROGRESS respondents R1 and R2; a DRAFT questionnaire belongs to R1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              captures: { r1_id: $.data.id }
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Sudbank AG", swift_bic: "SUEDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-2", expected_monthly_volume_usd: 200000.00, expected_monthly_count: 40 }
              as: FIGRelationshipManager
              captures: { r2_id: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r1_id}/licensing-verification"
              payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "GET /correspondent-banking/respondents/${r1_id}"
              payload: {}
              as: ComplianceAnalyst
              captures: { r1_ver: $.data.version }
            - call: "POST /correspondent-banking/respondents/${r1_id}/questionnaires"
              payload: { questionnaire_version: "WOLFSBERG_V1_4", expected_respondent_version: "${r1_ver}" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /correspondent-banking/questionnaires/${q_id}/control-assessments"
              payload: { control_domain: "GOVERNANCE", self_rating: 3 }
              as: RespondentContact
              as_user_id: "${r2_id}"
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_RESPONDENT_SCOPE_VIOLATION"
            - "no ControlAssessment row exists for questionnaire ${q_id}"

      - name: path_id_resolution_precedes_body_referential_checks
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=31]
        distinguishing_aspect: "Both the path's monitoringProfileId and the body's corridor_jurisdiction_code are unresolvable; priority 4 fires first, so the error is ERR_MONITORING_PROFILE_NOT_FOUND and not the body-level ERR_JURISDICTION_PROFILE_NOT_FOUND, even though both are 404s with different ids."
        test_recipe:
          setup: ["Empty system - neither the profile id nor jurisdiction ZZ exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/monitoring-profiles/00000000-0000-0000-0000-000000000000/observations"
              payload: { period_month: "2026-07", corridor_jurisdiction_code: "ZZ", aggregate_usd: 1000.00, txn_count: 3 }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_MONITORING_PROFILE_NOT_FOUND"

      - name: missing_required_field_on_respondent_creation
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - endpoints[POST /correspondent-banking/respondents]
        distinguishing_aspect: "swift_bic is a declared required input with no default, so omitting it is a body-shape failure (400) - not a uniqueness or referential failure - and nothing is persisted."
        test_recipe:
          setup: ["Jurisdiction DE exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST_BODY"
            - "GET /correspondent-banking/respondents returns total_count 0"

      - name: type_wrong_numeric_field_is_a_body_error_not_a_range_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: "expected_monthly_volume_usd arrives as a non-numeric string. Priority 5 covers declared-type conformance and fires before the priority 7 domain check, so the answer is ERR_INVALID_REQUEST_BODY rather than ERR_FIELD_OUT_OF_RANGE."
        test_recipe:
          setup: ["Jurisdiction DE exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: "half a million", expected_monthly_count: 100 }
              as: FIGRelationshipManager
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST_BODY"

      - name: unknown_payload_fields_are_ignored_on_creation
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=5]
          - entities.RespondentBank
        distinguishing_aspect: "The rule explicitly says unknown fields are ignored, so a payload carrying an undeclared key still succeeds with 201 and the stray key must not surface in the response body or become a stored field."
        test_recipe:
          setup: ["Jurisdiction DE exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100, internal_underwriting_notes: "ignore me", dd_state: "APPROVED" }
              as: FIGRelationshipManager
              captures: { r_id: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data has no key internal_underwriting_notes"
            - "RespondentBank.${r_id}.dd_state == PROSPECT - a system-managed field supplied in the body is ignored, not honoured"

      - name: unknown_enum_member_on_an_action_discriminator
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - endpoints[POST /correspondent-banking/respondents/{respondentId}/restriction]
        distinguishing_aspect: "The acting role is permitted and the respondent exists, so the request reaches the body checks; action PAUSE is outside the declared RESTRICT/LIFT/CLEAR_SCREENING discriminator, which is a 400 ERR_INVALID_ENUM_VALUE and not a 409 state error."
        test_recipe:
          setup: ["One DD_IN_PROGRESS respondent under DE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              captures: { r_id: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_id}/licensing-verification"
              payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          trigger:
            - call: "POST /correspondent-banking/respondents/${r_id}/restriction"
              payload: { action: "PAUSE", restriction_reason: "OFFICER_ACTION" }
              as: SanctionsOfficer
              as_user_id: "u-officer-1"
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_ENUM_VALUE"
            - "RespondentBank.${r_id}.dd_state == DD_IN_PROGRESS - unchanged"

      - name: ownership_pct_lower_bound_is_exclusive_and_upper_bound_is_inclusive
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_FIELD_OUT_OF_RANGE]
          - entities.BeneficialOwner.fields.ownership_pct
        distinguishing_aspect: "ownership_pct is declared over the half-open domain (0.00, 100.00]: 0.00 is rejected with ERR_FIELD_OUT_OF_RANGE while 100.00 - the exact upper bound, and the largest value a single direct owner can hold without breaching the 100.00 sibling sum - is accepted."
        test_recipe:
          setup: ["One DD_IN_PROGRESS respondent under DE with no beneficial owners yet."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              captures: { r_id: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_id}/licensing-verification"
              payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
          trigger:
            - call: "POST /correspondent-banking/respondents/${r_id}/beneficial-owners"
              payload: { owner_name: "Zero Holder", owner_type: "NATURAL_PERSON", ownership_pct: 0.00, country_of_residence: "DE" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /correspondent-banking/respondents/${r_id}/beneficial-owners"
              payload: { owner_name: "Anna Weber", owner_type: "NATURAL_PERSON", ownership_pct: 100.00, country_of_residence: "DE" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { bo_id: $.data.id }
          assert:
            - "first response.status == 400 and first response.data.error_id == ERR_FIELD_OUT_OF_RANGE"
            - "second response.status == 201"
            - "BeneficialOwner.${bo_id}.ownership_pct == 100.00"
            - "BeneficialOwner.${bo_id}.effective_ownership_pct == 100.00 and chain_depth == 1 and verification_status == PENDING"

      - name: control_assessment_self_rating_outside_one_to_five
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
