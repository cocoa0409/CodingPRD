  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_inspection_verify
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Error-category pair state (priority 4) vs business_safety (priority
          5): verifying a DRAFT report as the same individual who submitted it
          violates both the state precondition (report not SUBMITTED) and
          segregation of duties; ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Seller S, DRAFT listing L, inspection report IR still in DRAFT (never submitted)"
          setup_api_calls:
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Prio Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "41 Prio St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/inspection-reports"
              payload: { inspector_name: "I", inspection_date: "2026-08-01T00:00:00Z", overall_score: 80, roof_score: 80, systems_score: 80, disclosed_defects: [], title_grade: "A" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ir: $.data.id }
          trigger:
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "VERIFY" }
              as: CertificationReviewer
              as_user_id: "${s_id}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state, priority 4, beats business_safety, priority 5)"
            - "InspectionReport.${ir}.status == DRAFT (unchanged)"

      - name: referential_beats_fiscal_on_offer_submit
        grounds:
          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: |
          Error-category pair business_referential (priority 10) vs
          business_fiscal (priority 11): submitting an offer on a DRAFT listing
          while also carrying earnest money below the minimum violates both;
          ERR_PRECONDITION must win over ERR_INSUFFICIENT_FUNDS.
        test_recipe:
          setup:
            - "Seller S, buyer B with proof_of_funds 100000000, listing L still DRAFT; offer O created with earnest_money_cents 1000 (< EARNEST_MIN_CENTS)"
          setup_api_calls:
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Fiscal Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "Fiscal Buyer", buyer_state: "TX", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "43 Fiscal St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /marketplace/listings/${l_id}/offers"
              payload: { buyer_id: "${b_id}", amount_cents: 9000000, earnest_money_cents: 1000, financing_type: "CASH", expected_listing_version: "${l_v}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off: $.data.id }
          trigger:
            - call: "POST /marketplace/offers/${off}/transition"
              payload: { action: "SUBMIT" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_PRECONDITION (referential, priority 10, beats fiscal, priority 11)"
            - "Offer.${off}.status == DRAFT (unchanged)"

