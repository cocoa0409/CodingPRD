          rationale: "The named §1.8 instance asserts the reversal-then-reapplication identity before and after the compensating transition."

      - name: agreement_activation_guarded_by_licensee_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.LicenseAgreement.PENDING_SIGNATURE_to_ACTIVE
          - validations.priority_17
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / agreement_activation_requires_active_licensee
          rationale: "The named §1.8 instance blocks the countersignature on a SUSPENDED licensee and then lets it through after REINSTATE."

      - name: sample_verdict_conditional_cascade
        claim_type: conditional_cascade
        grounds:
          - state_machines.ProductSubmission.SAMPLE_REQUESTED_to_SAMPLE_PASSED
          - state_machines.ProductSubmission.SAMPLE_REQUESTED_to_REVISION_REQUESTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / sample_review_fork_divergent_side_effects
          rationale: "The named §1.8 instance forks on the sample verdict and asserts the divergent side effects of each branch."

