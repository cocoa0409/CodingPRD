  # ------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: buddy_redeem_requires_pass_active
        grounds:
          - state_machines.BuddyTicket.RESERVED_to_REDEEMED
          - state_machines.Pass.ACTIVE_to_SUSPENDED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair = BuddyTicket -> Pass. A RESERVED BuddyTicket can transition
          to REDEEMED only if the referenced Pass.status == ACTIVE. Suspending the
          host Pass cancels the RESERVED ticket via cascade, so redemption on the
          now-CANCELLED ticket is blocked: the cross-entity guard (host not ACTIVE)
          manifests as the ticket no longer being RESERVED.
        test_recipe:
          setup:
            - "Clock 2026-01-22. Product allotment=2. ACTIVE pass with one RESERVED buddy ticket; then pass SUSPENDED (the ticket cancels via cascade)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-22T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 4000, buddy_ticket_allotment: 2, buddy_ticket_price_cents: 2000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Kirkwood", home_network: "EPIC", gate_count: 1 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "XEntity Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-01-23" }
              as: ResortOps
              captures: { bt_id: $.data.id }
            - call: "POST /passes/${pass_id}/suspend"
              payload: {}
              as: ResortOps
          trigger:
            - call: "POST /buddy-tickets/${bt_id}/redeem"
              payload: {}
              as: ResortOps
              captures: { err: $.data.error_id }
          assert:
            - "BuddyTicket.${bt_id}.status == CANCELLED"
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: scan_grant_requires_resort_open
        grounds:
          - calculations.scan_access_decision
          - state_machines.Pass.ISSUED_to_ACTIVE
          - entities.Resort.fields.status
          - entities.LiftScan.fields.denial_reason
          - endpoints.POST_/resorts/{id}/suspend
        distinguishing_aspect: |
          Entity pair = LiftScan/Pass -> Resort (a different pair than
          BuddyTicket->Pass). A scan of an ACTIVE, token-valid pass is DENIED with
          denial_reason=RESORT_SUSPENDED when the scanning Resort.status ==
          SUSPENDED. The scan outcome depends on the Resort's state.
        test_recipe:
          setup:
            - "Clock 2026-01-25. FULL_EPIC ACTIVE pass. EPIC resort SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-25T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 8000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Suspended Mtn", home_network: "EPIC", gate_count: 1 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "ResortDep Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /resorts/${resort_id}/suspend"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
              captures: { result: $.data.result, reason: $.data.denial_reason }
          assert:
            - "LiftScan.result == DENIED"
            - "LiftScan.denial_reason == RESORT_SUSPENDED"

  # ------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: anti_passback_buffer_window_overlap
        grounds:
          - calculations.scan_access_decision
          - validations[priority=8]
          - errors[ERR_ANTI_PASSBACK]
          - entities.LiftScan.fields.scan_at
          - entities.LiftScan.fields.resort_id
        distinguishing_aspect: |
          Interval semantics = a forward buffer window on the Resort gate: a new
          scan collides if a prior GRANTED scan for the same pass+resort lies in
          the half-open buffer [last_grant, last_grant+5min). This is a duration
          buffer around a single instant, distinct from the calendar-day point
          interval below. Resource = Resort gate (per pass+resort).
        test_recipe:
          setup:
            - "Clock 2026-03-01T08:00:00Z. FULL_EPIC ACTIVE pass. First scan GRANTED at 08:00 at resort R."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 9000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Buffer Mtn", home_network: "EPIC", gate_count: 1 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Buffer Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
              captures: { r1: $.data.result }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:03:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
              captures: { r2: $.data.result, reason2: $.data.denial_reason }
          assert:
            - "LiftScan(08:00).result == GRANTED"
            - "LiftScan(08:03).result == DENIED"
            - "LiftScan(08:03).denial_reason == ANTI_PASSBACK"

      - name: buddy_same_day_calendar_point_overlap
        grounds:
          - validations[priority=13]
          - errors[ERR_BUDDY_DATE_CONFLICT]
          - entities.BuddyTicket.fields.valid_date
          - entities.BuddyTicket.fields.guest_name
          - entities.BuddyTicket.fields.resort_id
        distinguishing_aspect: |
          Interval semantics = a closed calendar-day point interval (no buffer): a
          guest_name may not hold two non-CANCELLED BuddyTickets for the same
          valid_date at the same resort_id. Geometry differs from the duration
          buffer above (exact-day equality, not a minutes window), and the
          resource is the BuddyTicket guest/date slot, not the Resort scan gate.
        test_recipe:
          setup:
            - "Clock 2026-01-28. Product allotment=3. ACTIVE pass. One RESERVED buddy ticket for guest 'Sam Lee' at resort R, valid_date 2026-01-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-28T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 4000, buddy_ticket_allotment: 3, buddy_ticket_price_cents: 2000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "DatePoint Mtn", home_network: "EPIC", gate_count: 1 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Date Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "Sam Lee", valid_date: "2026-01-30" }
              as: ResortOps
              captures: { bt1_id: $.data.id }
          trigger:
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "Sam Lee", valid_date: "2026-01-30" }
              as: ResortOps
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_BUDDY_DATE_CONFLICT"
            - "http_status == 409"

  # ------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: buddy_allotment_conservation_reserve_cancel
        grounds:
          - calculations.buddy_tickets_remaining
          - state_machines.BuddyTicket.RESERVED_to_CANCELLED
          - endpoints.POST_/buddy-tickets
          - endpoints.POST_/buddy-tickets/{id}/cancel
          - entities.Pass.fields.buddy_tickets_remaining
        distinguishing_aspect: |
          Conserved quantity = the buddy allotment identity
          (buddy_tickets_remaining + count(BuddyTicket in {RESERVED,REDEEMED}) ==
          product.buddy_ticket_allotment). Reserve (forward) decrements remaining;
          cancel (compensating) increments it back. After reserve-then-cancel,
          buddy_tickets_remaining returns to the original allotment 2 with zero drift.
        test_recipe:
          setup:
            - "Clock 2026-01-29. Product allotment=2. ACTIVE pass, buddy_tickets_remaining=2 initially."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-29T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 4000, buddy_ticket_allotment: 2, buddy_ticket_price_cents: 2000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Conserve Mtn", home_network: "EPIC", gate_count: 1 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Conserve Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-01-30" }
              as: ResortOps
              captures: { bt_id: $.data.id }
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: ResortOps
              captures: { rem_after_reserve: $.data.buddy_tickets_remaining }
          trigger:
            - call: "POST /buddy-tickets/${bt_id}/cancel"
              payload: {}
              as: ResortOps
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: ResortOps
              captures: { rem_after_cancel: $.data.buddy_tickets_remaining }
          assert:
            - "Pass.${pass_id}.buddy_tickets_remaining (after reserve) == 1"
            - "Pass.${pass_id}.buddy_tickets_remaining (after cancel) == 2"

      - name: refund_basis_conservation_reject_then_inspect
        grounds:
          - state_machines.RefundRequest.PENDING_to_REJECTED
          - calculations.end_of_season_refund
          - entities.RefundRequest.fields.refund_amount_cents
          - entities.Pass.fields.refund_basis_cents
          - entities.Pass.fields.status
        distinguishing_aspect: |
          Conserved quantity = the Pass refund_basis_cents and pass status under a
          rejected refund (a different conserved quantity than the buddy allotment
          count). Opening then REJECTING a RefundRequest leaves
          refund_amount_cents=0 and the Pass untouched (still ACTIVE,
          refund_basis_cents=7000 unchanged): the reject is the compensating no-op
          that leaves the monetary basis with zero drift.
        test_recipe:
          setup:
            - "Clock 2026-01-31. FULL_EPIC pass price=7000, ACTIVE, refund_basis_cents=7000. A PENDING RefundRequest reason=DISSATISFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 7000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Reject Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /refund-requests"
              payload: { pass_id: "${pass_id}", reason: "DISSATISFIED" }
              as: RefundAdmin
              captures: { rr_id: $.data.id }
          trigger:
            - call: "POST /refund-requests/${rr_id}/reject"
              payload: {}
              as: RefundAdmin
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: RefundAdmin
              captures: { basis: $.data.refund_basis_cents, st: $.data.status }
          assert:
            - "RefundRequest.${rr_id}.status == REJECTED"
            - "RefundRequest.${rr_id}.refund_amount_cents == 0"
            - "Pass.${pass_id}.status == ACTIVE"
            - "Pass.${pass_id}.refund_basis_cents == 7000"
