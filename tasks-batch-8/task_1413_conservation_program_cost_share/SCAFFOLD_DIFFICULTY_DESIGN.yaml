            - { call: "POST /eqip/advance-payments/${adv}/return", payload: { amount_cents: 144000 }, as: Applicant, as_user_id: "${a1}", captures: { adv_st2: $.data.status } }
            - { call: "POST /eqip/contracts/${con}/complete", payload: {}, as: ProgramAdmin, captures: { con_st: $.data.status } }
