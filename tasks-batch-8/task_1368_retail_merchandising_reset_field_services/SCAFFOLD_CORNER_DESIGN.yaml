            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_id}", rep_id: "${rep_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:30:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_id}/check-in"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { visit_id: "$.data.id" }
            - call: "POST /retail-reset/store-visits/${visit_id}/photos"
              payload: { photo_type: "BEFORE", image_url: "https://img/b.jpg", captured_at: "2026-08-05T09:31:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
            - call: "POST /retail-reset/store-visits/${visit_id}/photos"
              payload: { photo_type: "AFTER", image_url: "https://img/a.jpg", captured_at: "2026-08-05T10:29:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:30:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_id}/check-out"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
            - call: "POST /retail-reset/store-visits/${visit_id}/verify"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /retail-reset/store-visits/${visit_id}/verify"
              payload: {}
              as: ProjectManager
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"
      - name: checkout_without_photos_blocked
        claim_type: precondition_enforcement
        grounds: [state_machines.Assignment.ON_SITE_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Check-out before uploading BOTH a BEFORE and an AFTER photo is rejected; only AFTER photo present still blocks."
        test_recipe:
          setup:
            - "rep ON_SITE with only an AFTER photo uploaded"
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "Ph Client", billing_model: "PER_STORE", per_store_rate_cents: 3500 }
              as: ProjectManager
              captures: { client_id: "$.data.id" }
            - call: "POST /retail-reset/reps"
