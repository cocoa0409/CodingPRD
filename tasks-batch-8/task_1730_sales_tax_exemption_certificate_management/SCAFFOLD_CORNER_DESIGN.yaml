      - name: order_ship_in_held_state_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Order", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Calling /ship on an order in HELD_FOR_CERT -> ERR_INVALID_STATE_TRANSITION"
        test_recipe:
          setup: ["HELD_FOR_CERT order"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
