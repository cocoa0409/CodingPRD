              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
              captures: { rv_stale: $.data.version }
            - call: "POST /routes/${route_id}/budget-adjustments"
              payload: { delta_cents: 500000, reason: "supplemental authorization" }
