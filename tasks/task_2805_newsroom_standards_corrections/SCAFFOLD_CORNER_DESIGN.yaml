  # =========================================================================
  # Every error in §1.6 must be triggerable. The 404 family is swept first,
  # then the behavioural errors this file has not already produced; errors that
  # a §1.8 instance already raises are recorded as stubs at the end.
  - section: errors
    instances:
      - name: opening_investigation_into_unknown_journalist_returns_journalist_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_JOURNALIST_NOT_FOUND]
          - validations[priority=7]
          - endpoints[POST /standards-desk/misconduct-investigations]
        distinguishing_aspect: "Body-id resolution at priority 7 fires on journalist_id, so an investigation opened against a well-formed but unknown journalist returns 404 ERR_JOURNALIST_NOT_FOUND and creates nothing."
        test_recipe:
          setup:
            - "A newsroom with an executive editor and a standards editor; no journalist has the probed id"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Sam Okoye", email: "sam@ledger.test", role_title: "STANDARDS_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
          trigger:
            - call: "POST /standards-desk/misconduct-investigations"
              payload: { journalist_id: "00000000-0000-4000-8000-000000000001", allegation_type: "PLAGIARISM", severity: "SERIOUS", allegation_summary: "An allegation against nobody in particular." }
              as: StandardsEditor
              as_user_id: "${sed}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_JOURNALIST_NOT_FOUND"
            - "GET /standards-desk/misconduct-investigations with status OPENED returns total_count == 0"

