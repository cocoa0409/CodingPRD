# =============================================================================
# PRD Benchmark Scaffold — Markdown Optimization & Season Exit
# Sections §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2921. Markdown Optimization & Season Exit (retail pricing team): lifecycle stage
  classification with markdown eligibility rules and protected new-arrival periods,
  price elasticity estimation by item, cluster and remaining inventory position,
  markdown cadence design with depth ladders and exit-date targets, exit inventory
  targets by category with clearance space constraints, permanent versus promotional
  markdown decisions and their margin accounting treatment, vendor markdown allowance
  negotiation and funding recognition, store-level versus chain-level price zone
  execution and signage compliance, salvage, jobber and donation disposition for
  residual inventory, post-season margin and sell-through review

domain_name: markdown-optimization-season-exit

# All business resources are peer top-level collections (flat topology); the API
# root is "/" and every §1.5 path below is absolute from the root.
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation      # elasticity own-history vs cluster-pooled; exit review PRELIMINARY vs FINAL
    - cascading_side_effects        # zone-execution apply and claim recognition each propagate 4-5 hops
    - rate_threshold_triggers       # lifecycle classification thresholds, season EXIT_WINDOW auto-trigger, allowance cap
    - optimistic_concurrency        # OCC on Item.version and Season.version for supersede-style creates

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no nested ownership URLs except
  # read-only sub-resource lists. PriceZone.parent_zone_id and
  # MarkdownPlan.superseded_by_plan_id are self-referential edges.

  state_machine_shape: parallel
  # Item carries two independent dimensions (lifecycle_stage x markdown_state) and
  # ZoneExecution carries two (status x signage_status); MarkdownPlan and
  # VendorAllowanceAgreement are cyclic (revision rounds / negotiation rounds).

  relationship_patterns:
    - one_to_many          # Season -> Item, MarkdownPlan -> MarkdownStep
    - many_to_many         # ZoneExecution associates MarkdownStep x PriceZone (and optionally Store)
    - self_referential     # PriceZone.parent_zone_id, MarkdownPlan.superseded_by_plan_id
    - cross_aggregate      # VendorClaim links a funding aggregate to a pricing aggregate

  role_model: segregation_of_duties
  # The PricingAnalyst who authors a MarkdownPlan cannot be the user who approves it;
  # the user who drafts a DispositionOrder cannot be the user who approves it; the
  # party that made the last allowance offer cannot be the party that accepts it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Human season code, unique across seasons"
        constraints: "1-32 chars; unique (case-sensitive exact match)"
      - name: category
        type: enum
        source: input
        description: "Merchandise category this season governs; exit targets are set per category"
        constraints: "APPAREL | FOOTWEAR | ACCESSORIES | SEASONAL_DECOR"
      - name: season_start_date
        type: string
        source: input
        description: "First selling date of the season (date-only, YYYY-MM-DD)"
      - name: season_end_date
        type: string
        source: input
        description: "Last selling date of the season (date-only, YYYY-MM-DD)"
        constraints: "must be > season_start_date"
      - name: exit_target_date
        type: string
        source: input
        description: "Date by which residual inventory must be exited (date-only)"
        constraints: "must satisfy season_start_date < exit_target_date <= season_end_date"
      - name: exit_units_target
        type: integer
        source: input
        description: "Units of this season's inventory targeted for exit through markdown and disposition"
        constraints: ">= 1"
      - name: sell_through_target_pct
        type: number
        source: input
        description: "Season sell-through target in percent, 2 decimals"
        constraints: "0.01 - 100.00"
      - name: clearance_space_units
        type: integer
        source: input
        description: "Chain-level clearance space cap in units for this season; total RESERVED+COMMITTED clearance reservations may not exceed it"
        constraints: ">= 1"
      - name: reserved_clearance_units
        type: integer
        source: computed
        description: "Sum of ClearanceReservation.reserved_units for this season where status == RESERVED"
        default: 0
      - name: committed_clearance_units
        type: integer
        source: computed
        description: "Sum of ClearanceReservation.reserved_units for this season where status == COMMITTED; this is the quantity the EXIT_WINDOW auto-trigger threshold is measured against"
        default: 0
      - name: projected_exit_units
        type: integer
        source: computed
        description: "Sum of MarkdownPlan.projected_exit_units over plans of this season with status IN {APPROVED, EXECUTING, COMPLETED}"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Season lifecycle state (see §1.2 Season machine)"
        default: PLANNING
        constraints: "PLANNING | ACTIVE | EXIT_WINDOW | CLOSED"

  - name: PriceZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: "Zone code, unique across price zones"
        constraints: "unique"
      - name: zone_type
        type: enum
        source: input
        description: "Execution breadth of the zone"
        constraints: "CHAIN | REGION | STORE"
      - name: parent_zone_id
        type: string
        source: input
        description: "FK -> PriceZone.id; nullable self-referential parent zone. A REGION zone must name a CHAIN parent; a STORE zone must name a REGION parent; a CHAIN zone must be null"
        default: null
      - name: signage_lead_days
        type: integer
        source: input
        description: "Days of signage lead required before an execution effective_date in this zone; also the minimum spacing between two executions on the same item in this zone"
        default: null
        constraints: "1-30; when omitted defaults per zone_type via SIGNAGE_LEAD_DEFAULT_DAYS"
      - name: region_code
        type: string
        source: input
        description: "Region label used for reporting"
        default: null

  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: store_number
        type: string
        source: input
        description: "Store number, unique across stores; used as the deterministic secondary sort key in clearance allocation"
        constraints: "unique; 1-16 chars"
      - name: price_zone_id
        type: string
        source: input
        description: "FK -> PriceZone.id; the zone whose prices this store executes"
      - name: region_code
        type: string
        source: input
        description: "Region label of the store"
        default: null
      - name: clearance_bay_units
        type: integer
        source: input
        description: "Total clearance bay capacity of the store in units"
        constraints: ">= 0"
      - name: committed_clearance_units
        type: integer
        source: computed
        description: "Sum of ClearanceReservation.reserved_units for this store where status IN {RESERVED, COMMITTED}"
        default: 0
      - name: available_clearance_units
        type: integer
        source: computed
        description: "clearance_bay_units - committed_clearance_units"
        default: 0
      - name: status
        type: enum
        source: input
        description: "Operating status; only OPEN stores are eligible for clearance allocation"
        default: OPEN
        constraints: "OPEN | REMODEL | CLOSING"

  - name: Item
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Stock keeping unit code, unique across items"
        constraints: "unique"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this item belongs to"
      - name: category
        type: enum
        source: input
        description: "Merchandise category; drives PROTECTED_NEW_ARRIVAL_DAYS and must equal Season.category"
        constraints: "APPAREL | FOOTWEAR | ACCESSORIES | SEASONAL_DECOR"
      - name: cluster_code
        type: string
        source: input
        description: "Store-cluster label used to pool elasticity peers"
      - name: vendor_code
        type: string
        source: input
        description: "Vendor label; a VendorAllowanceAgreement is matched to an item by vendor_code plus category scope"
      - name: first_receipt_date
        type: string
        source: input
        description: "Date the first units landed (date-only, YYYY-MM-DD)"
      - name: protected_until_date
        type: string
        source: computed
        description: "first_receipt_date + PROTECTED_NEW_ARRIVAL_DAYS[category], date-only; no markdown step may take effect on or before this date"
      - name: original_retail_cents
        type: integer
        source: input
        description: "Original ticket retail in cents; the base every ladder depth is applied against"
        constraints: ">= 1"
      - name: current_retail_cents
        type: integer
        source: computed
        description: "Live ticket retail in cents; initialized to original_retail_cents and rewritten by an applied ZoneExecution"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Landed unit cost in cents"
        constraints: ">= 0"
      - name: units_received_total
        type: integer
        source: input
        description: "Total units received for the season"
        constraints: ">= 1"
      - name: on_hand_units
        type: integer
        source: computed
        description: "units_received_total - units_sold_total - units_disposed_total"
      - name: units_sold_total
        type: integer
        source: computed
        description: "Sum of SalesWeek.units_sold for this item"
        default: 0
      - name: units_committed_disposition
        type: integer
        source: computed
        description: "Sum of DispositionOrder.units for this item where status IN {DRAFT, APPROVED}"
        default: 0
      - name: units_disposed_total
        type: integer
        source: computed
        description: "Sum of DispositionOrder.settled_units for this item where status == SETTLED"
        default: 0
      - name: sample_weeks
        type: integer
        source: computed
        description: "Count of SalesWeek rows for this item"
        default: 0
      - name: sell_through_pct
        type: number
        source: computed
        description: "round_half_up(units_sold_total / units_received_total * 100, 2)"
        default: 0.00
      - name: weeks_of_supply
        type: number
        source: computed
        description: "round_half_up(on_hand_units / avg_weekly_units_sold, 2) where avg_weekly_units_sold = round_half_up(units_sold_total / sample_weeks, 4); 999.99 when sample_weeks == 0 or units_sold_total == 0"
        default: 999.99
      - name: lifecycle_stage
        type: enum
        source: computed
        description: "Lifecycle classification dimension (see calculations.lifecycle_stage_classification and the Item lifecycle machine in §1.2)"
        default: NEW_ARRIVAL
        constraints: "NEW_ARRIVAL | CORE | AGING | CLEARANCE | EXIT_PENDING | DISPOSED"
      - name: markdown_state
        type: enum
        source: computed
        description: "Pricing dimension, independent of lifecycle_stage (see the Item markdown machine in §1.2)"
        default: FULL_PRICE
        constraints: "FULL_PRICE | PROMO_ACTIVE | PERM_MARKED | EXIT_PRICED | SETTLED"
      - name: permanent_markdown_reserve_cents
        type: integer
        source: computed
        description: "Cumulative inventory writedown from applied PERMANENT executions on this item (recognized at execution, on all units in scope)"
        default: 0
      - name: promo_discount_cents
        type: integer
        source: computed
        description: "Cumulative contra-revenue from applied PROMOTIONAL executions on this item (recognized only on units sold at or after the execution effective_date)"
        default: 0

  - name: SalesWeek
    parent: Item
    common_fields: false
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the item this weekly reading belongs to"
      - name: week_ending_date
        type: string
        source: input
        description: "Week-ending date (date-only); unique per item"
        constraints: "unique per (item_id, week_ending_date); must be > Item.first_receipt_date"
      - name: units_sold
        type: integer
        source: input
        description: "Units sold in the week"
        constraints: ">= 0 and <= Item.on_hand_units at posting time"
      - name: ticket_price_cents
        type: integer
        source: input
        description: "Ticket price in effect during the week, in cents"
        constraints: ">= 1"
      - name: price_relative_pct
        type: number
        source: computed
        description: "round_half_up(ticket_price_cents / Item.original_retail_cents * 100, 2)"

  - name: ElasticityEstimate
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; subject of the estimate"
      - name: method
        type: enum
        source: input
        description: "Requested estimation method; AUTO resolves per calculations.elasticity_coefficient_estimation"
        default: AUTO
        constraints: "AUTO | OWN_HISTORY | CLUSTER_POOLED"
      - name: resolved_method
        type: enum
        source: computed
        description: "Method actually executed"
        constraints: "OWN_HISTORY | CLUSTER_POOLED"
      - name: elasticity_coefficient
        type: number
        source: computed
        description: "Own-price elasticity, negative, 4 decimals, clamped to ELASTICITY_FLOOR..ELASTICITY_CAP"
      - name: sample_weeks_used
        type: integer
        source: computed
        description: "Count of the subject item's SalesWeek rows used (0 for CLUSTER_POOLED)"
        default: 0
      - name: peer_items_used
        type: integer
        source: computed
        description: "Count of peer items whose CERTIFIED estimate entered the pooled average (0 for OWN_HISTORY)"
        default: 0
      - name: confidence
        type: enum
        source: computed
        description: "HIGH when resolved_method == OWN_HISTORY and sample_weeks_used >= HIGH_CONFIDENCE_WEEKS; LOW otherwise"
        constraints: "HIGH | LOW"
      - name: estimated_at
        type: datetime
        source: system
        description: "Logical clock instant at which the estimate was produced (ISO 8601 UTC, three fractional digits)"
      - name: certified_at
        type: datetime
        source: system
        description: "Logical clock instant of certification; null while DRAFT"
        default: null
      - name: status
        type: enum
        source: system
        description: "Estimate lifecycle (see §1.2 ElasticityEstimate machine)"
        default: DRAFT
        constraints: "DRAFT | CERTIFIED | SUPERSEDED"

  - name: MarkdownPlan
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; season the plan exits inventory for"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; item the ladder prices"
      - name: elasticity_estimate_id
        type: string
        source: input
        description: "FK -> ElasticityEstimate.id; the estimate whose coefficient drives recommended_depth_pct; must belong to item_id and be CERTIFIED at submit time"
      - name: plan_type
        type: enum
        source: input
        description: "PERMANENT writes the ticket down and books an inventory reserve; PROMOTIONAL books contra-revenue on sold units only and is not claimable against a vendor allowance"
        constraints: "PERMANENT | PROMOTIONAL"
      - name: exit_date_target
        type: string
        source: input
        description: "Date the item must be fully exit-priced by (date-only); must be <= Season.exit_target_date"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PricingAnalyst that created the plan; segregation-of-duties compares it to the approver"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MerchandiseDirector that approved the plan; null until APPROVED"
        default: null
      - name: revision_round
        type: integer
        source: computed
        description: "Number of completed revision cycles (incremented on SUBMITTED -> REVISION_REQUESTED)"
        default: 0
      - name: recommended_depth_pct
        type: number
        source: computed
        description: "Output of calculations.recommended_first_step_depth at plan creation, 2 decimals"
      - name: ladder_step_count
        type: integer
        source: computed
        description: "Count of MarkdownStep rows with status != SUPERSEDED for this plan"
        default: 0
      - name: gross_markdown_cents
        type: integer
        source: computed
        description: "Sum of ZoneExecution.line_markdown_cents for this plan where status == APPLIED, accumulated in created_at ASC order"
        default: 0
      - name: vendor_funded_cents
        type: integer
        source: computed
        description: "Sum of VendorClaim.recognized_cents for this plan where status == RECOGNIZED"
        default: 0
      - name: net_markdown_cents
        type: integer
        source: computed
        description: "gross_markdown_cents - vendor_funded_cents"
        default: 0
      - name: projected_exit_units
        type: integer
        source: computed
        description: "Sum of ZoneExecution.units_in_scope over this plan's executions with status IN {SCHEDULED, APPLIED}"
        default: 0
      - name: superseded_by_plan_id
        type: string
        source: system
        description: "FK -> MarkdownPlan.id; self-referential pointer to the plan that superseded this one; null unless status == SUPERSEDED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle (see §1.2 MarkdownPlan machine; cyclic through REVISION_REQUESTED)"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | EXECUTING | COMPLETED | SUPERSEDED"

  - name: MarkdownStep
    parent: MarkdownPlan
    common_fields: true
    fields:
      - name: markdown_plan_id
        type: string
        source: input
        description: "FK -> MarkdownPlan.id; owning ladder"
      - name: step_index
        type: integer
        source: input
        description: "1-based rung position; must equal the plan's current ladder_step_count + 1"
        constraints: "1 - MAX_LADDER_STEPS"
      - name: effective_date
        type: string
        source: input
        description: "Date this rung takes effect (date-only)"
      - name: depth_pct
        type: number
        source: input
        description: "Cumulative depth off original retail in percent, 2 decimals; must exceed the previous rung's depth_pct"
        constraints: "0.01 - MAX_DEPTH_PCT"
      - name: price_cents
        type: integer
        source: computed
        description: "Item.original_retail_cents - round_half_up(Item.original_retail_cents * depth_pct / 100)"
      - name: window_end_date_exclusive
        type: string
        source: computed
        description: "Exclusive end of this rung's half-open occupancy window: the next rung's effective_date, or MarkdownPlan.exit_date_target when this is the last rung"
      - name: status
        type: enum
        source: system
        description: "Rung lifecycle (see §1.2 MarkdownStep machine)"
        default: PLANNED
        constraints: "PLANNED | SCHEDULED | EXECUTED | SUPERSEDED"

  - name: ZoneExecution
    parent: null
    common_fields: true
    fields:
      - name: markdown_plan_id
        type: string
        source: input
        description: "FK -> MarkdownPlan.id; plan being executed"
      - name: markdown_step_id
        type: string
        source: input
        description: "FK -> MarkdownStep.id; rung being executed; must belong to markdown_plan_id"
      - name: price_zone_id
        type: string
        source: input
        description: "FK -> PriceZone.id; zone whose tickets change"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; required when execution_scope == STORE and must satisfy Store.price_zone_id == price_zone_id; must be null otherwise"
        default: null
      - name: execution_scope
        type: enum
        source: input
        description: "CHAIN requires a CHAIN price zone and signage verification by MerchandiseDirector; ZONE requires a REGION zone; STORE requires store_id and signage verification by the owning StoreManager"
        constraints: "CHAIN | ZONE | STORE"
      - name: effective_date
        type: string
        source: input
        description: "Date the new ticket goes live in this zone (date-only); must equal MarkdownStep.effective_date"
      - name: units_in_scope
        type: integer
        source: input
        description: "Units of the item this execution reprices; the markdown line is computed on this count"
        constraints: ">= 1"
      - name: signage_due_date
        type: string
        source: computed
        description: "effective_date - PriceZone.signage_lead_days (date-only)"
      - name: signage_status
        type: enum
        source: computed
        description: "Signage dimension, independent of status (see §1.2 ZoneExecution signage machine)"
        default: PENDING
        constraints: "PENDING | POSTED | NON_COMPLIANT | VERIFIED"
      - name: posted_at
        type: datetime
        source: system
        description: "Logical clock instant signage was posted; null while PENDING"
        default: null
      - name: posted_by_user_id
        type: string
        source: system
        description: "X-User-ID that posted signage"
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID that verified signage"
        default: null
      - name: per_unit_markdown_cents
        type: integer
        source: computed
        description: "Item.current_retail_cents - MarkdownStep.price_cents, frozen at apply time; 0 while SCHEDULED"
        default: 0
      - name: line_markdown_cents
        type: integer
        source: computed
        description: "per_unit_markdown_cents * units_in_scope, frozen at apply time; 0 while SCHEDULED"
        default: 0
      - name: price_cents_applied
        type: integer
        source: computed
        description: "Ticket price written onto the item at apply time (equals MarkdownStep.price_cents); 0 while SCHEDULED"
        default: 0
      - name: applied_at
        type: datetime
        source: system
        description: "Logical clock instant of apply; null while SCHEDULED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Execution dimension (see §1.2 ZoneExecution status machine)"
        default: SCHEDULED
        constraints: "SCHEDULED | APPLIED | ROLLED_BACK"

  - name: ClearanceReservation
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; season the clearance space is booked against"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store holding the clearance bay units"
      - name: markdown_plan_id
        type: string
        source: input
        description: "FK -> MarkdownPlan.id; plan whose exit units occupy the space"
      - name: reserved_units
        type: integer
        source: computed
        description: "Units of clearance bay space held at this store by the waterfall allocation"
        constraints: ">= 1"
      - name: allocation_rank
        type: integer
        source: computed
        description: "1-based position this store took in the waterfall (see calculations.clearance_space_waterfall)"
      - name: released_at
        type: datetime
        source: system
        description: "Logical clock instant of release; null unless status == RELEASED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Reservation lifecycle (see §1.2 ClearanceReservation machine)"
        default: RESERVED
        constraints: "RESERVED | COMMITTED | RELEASED"

  - name: VendorAllowanceAgreement
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; season the allowance funds"
      - name: vendor_code
        type: string
        source: input
        description: "Vendor label; matched to Item.vendor_code when a claim is filed"
      - name: item_category_scope
        type: enum
        source: input
        description: "Category the allowance covers; a claim's plan item must match it"
        constraints: "APPAREL | FOOTWEAR | ACCESSORIES | SEASONAL_DECOR"
      - name: current_share_pct
        type: number
        source: input
        description: "Share of gross markdown the vendor funds under the offer currently on the table, 2 decimals"
        constraints: "0.01 - 100.00"
      - name: current_cap_cents
        type: integer
        source: input
        description: "Funding ceiling in cents under the offer currently on the table"
        constraints: ">= 1"
      - name: agreed_share_pct
        type: number
        source: computed
        description: "current_share_pct frozen at acceptance; null while negotiating"
        default: null
      - name: funding_cap_cents
        type: integer
        source: computed
        description: "current_cap_cents frozen at acceptance; null while negotiating"
        default: null
      - name: remaining_cap_cents
        type: integer
        source: computed
        description: "funding_cap_cents - recognized_total_cents"
        default: null
      - name: recognized_total_cents
        type: integer
        source: computed
        description: "Sum of VendorClaim.recognized_cents for this agreement where status == RECOGNIZED"
        default: 0
      - name: round_index
        type: integer
        source: computed
        description: "Number of offers placed on the table, starting at 1 for the opening proposal"
        default: 1
      - name: last_offer_by_role
        type: enum
        source: system
        description: "Role that placed the offer currently on the table; the same role may not accept it"
        constraints: "PricingAnalyst | VendorRep"
      - name: last_offer_by_user_id
        type: string
        source: system
        description: "X-User-ID that placed the offer currently on the table"
      - name: status
        type: enum
        source: system
        description: "Agreement lifecycle (see §1.2 VendorAllowanceAgreement machine; cyclic PROPOSED <-> COUNTERED)"
        default: PROPOSED
        constraints: "PROPOSED | COUNTERED | AGREED | FUNDED | EXPIRED"

  - name: VendorClaim
    parent: null
    common_fields: true
    fields:
      - name: allowance_agreement_id
        type: string
        source: input
        description: "FK -> VendorAllowanceAgreement.id; agreement funding the claim"
      - name: markdown_plan_id
        type: string
        source: input
        description: "FK -> MarkdownPlan.id; plan whose applied markdown is being claimed"
      - name: claimed_cents
        type: integer
        source: input
        description: "Amount claimed in cents"
        constraints: ">= 1"
      - name: recognized_cents
        type: integer
        source: computed
        description: "Amount actually recognized against the cap (see calculations.vendor_funding_recognition); 0 until RECOGNIZED"
        default: 0
      - name: recognized_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Controller that recognized the claim"
        default: null
      - name: rejection_reason
        type: enum
        source: system
        description: "Why the claim was rejected; null unless status == REJECTED"
        default: null
        constraints: "CAP_EXHAUSTED | AGREEMENT_EXPIRED"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle (see §1.2 VendorClaim machine)"
        default: SUBMITTED
        constraints: "SUBMITTED | RECOGNIZED | REJECTED | REVERSED"

  - name: DispositionOrder
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; season disposing the residual units"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; item whose residual units are disposed"
      - name: channel
        type: enum
        source: input
        description: "SALVAGE and JOBBER recover cash per unit; DONATION recovers a tax credit only"
        constraints: "SALVAGE | JOBBER | DONATION"
      - name: units
        type: integer
        source: input
        description: "Units committed to the channel"
        constraints: ">= 1 and <= (Item.on_hand_units - Item.units_committed_disposition) at creation time"
      - name: unit_recovery_cents
        type: integer
        source: input
        description: "Cash recovery per unit; required and >= 1 for SALVAGE and JOBBER, must be omitted or 0 for DONATION"
        default: 0
      - name: fmv_cents
        type: integer
        source: input
        description: "Fair market value per unit for a DONATION; required for DONATION, must be omitted for SALVAGE and JOBBER"
        default: null
      - name: projected_recovery_cents
        type: integer
        source: computed
        description: "Output of calculations.disposition_recovery at creation (cash for SALVAGE/JOBBER, tax credit for DONATION)"
        default: 0
      - name: settled_units
        type: integer
        source: computed
        description: "Units actually settled; 0 until SETTLED"
        default: 0
      - name: settled_recovery_cents
        type: integer
        source: computed
        description: "Recovery actually realized at settlement, recomputed from settled_units by calculations.disposition_recovery; 0 until SETTLED"
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PricingAnalyst that drafted the order; segregation-of-duties compares it to the approver"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Controller that approved the order; null until APPROVED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Order lifecycle (see §1.2 DispositionOrder machine)"
        default: DRAFT
        constraints: "DRAFT | APPROVED | SETTLED | CANCELLED"

  - name: SeasonExitReview
    parent: Season
    common_fields: false
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; season under review"
      - name: review_type
        type: enum
        source: input
        description: "PRELIMINARY scores the season on projections; FINAL scores it on realized facts only (see calculations.season_exit_scorecard)"
        constraints: "PRELIMINARY | FINAL"
      - name: revenue_cents
        type: integer
        source: computed
        description: "Sum over the season's items of SalesWeek.units_sold * SalesWeek.ticket_price_cents"
      - name: cogs_cents
        type: integer
        source: computed
        description: "Sum over the season's items of units_sold_total * unit_cost_cents"
      - name: markdown_reserve_cents
        type: integer
        source: computed
        description: "Permanent-markdown inventory writedown included by this review variant"
      - name: promo_discount_cents
        type: integer
        source: computed
        description: "Promotional contra-revenue included by this review variant"
      - name: vendor_funding_cents
        type: integer
        source: computed
        description: "Vendor allowance funding included by this review variant"
      - name: disposition_recovery_cents
        type: integer
        source: computed
        description: "Disposition recovery included by this review variant"
      - name: gross_margin_cents
        type: integer
        source: computed
        description: "revenue_cents - cogs_cents - markdown_reserve_cents - promo_discount_cents + vendor_funding_cents + disposition_recovery_cents"
      - name: sell_through_pct
        type: number
        source: computed
        description: "round_half_up(units_sold_total / units_received_total * 100, 2) across the season's items"
      - name: units_received_total
        type: integer
        source: computed
        description: "Sum of Item.units_received_total across the season's items"
      - name: units_sold_total
        type: integer
        source: computed
        description: "Sum of Item.units_sold_total across the season's items"
      - name: units_disposed_total
        type: integer
        source: computed
        description: "Sum of Item.units_disposed_total across the season's items"
      - name: exit_units_variance
        type: integer
        source: computed
        description: "(units_sold_total + units_disposed_total) - Season.exit_units_target"
      - name: sell_through_variance_pct
        type: number
        source: computed
        description: "round_half_up(sell_through_pct - Season.sell_through_target_pct, 2)"
      - name: generated_at
        type: datetime
        source: system
        description: "Logical clock instant the snapshot was taken (ISO 8601 UTC, three fractional digits)"
      - name: generated_by_user_id
        type: string
        source: system
        description: "X-User-ID that generated the review"

# =============================================================================
# §1.2 State Machine Table
# Twelve machines. Item and ZoneExecution each carry two independent dimensions
# on the same row; MarkdownPlan, MarkdownStep, Item.lifecycle_stage and
# VendorAllowanceAgreement contain cycles.
# =============================================================================
state_machines:
  - entity: Season
    dimension: status
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /seasons/{season_id}/transition with to_status=ACTIVE"
        actor: MerchandiseDirector
        preconditions:
          - "Season.status == PLANNING"
          - "at least one Item exists with Item.season_id == Season.id"
        side_effects:
          - "recomputes lifecycle_stage for every Item of this season (calculations.lifecycle_stage_classification)"
      - from: ACTIVE
        to: EXIT_WINDOW
        trigger: "POST /seasons/{season_id}/transition with to_status=EXIT_WINDOW"
        actor: MerchandiseDirector
        preconditions:
          - "Season.status == ACTIVE"
        side_effects:
          - "recomputes lifecycle_stage for every Item of this season; items with weeks_to_exit <= EXIT_PENDING_WEEKS move to EXIT_PENDING"
      - from: ACTIVE
        to: EXIT_WINDOW
        trigger: "system event: Season.committed_clearance_units reaches or passes round_half_up(exit_units_target * EXIT_WINDOW_TRIGGER_PCT / 100) as a consequence of a ClearanceReservation entering COMMITTED"
        actor: system
        preconditions:
          - "Season.status == ACTIVE"
          - "Season.committed_clearance_units >= round_half_up(Season.exit_units_target * EXIT_WINDOW_TRIGGER_PCT / 100)"
        side_effects:
          - "recomputes lifecycle_stage for every Item of this season; items with weeks_to_exit <= EXIT_PENDING_WEEKS move to EXIT_PENDING"
        note: "Hop 5 of cascade markdown_apply_exit_window_cascade; the threshold uses >= so the exact boundary fires."
      - from: EXIT_WINDOW
        to: CLOSED
        trigger: "POST /seasons/{season_id}/transition with to_status=CLOSED"
        actor: MerchandiseDirector
        preconditions:
          - "Season.status == EXIT_WINDOW"
          - "a SeasonExitReview row exists with season_id == Season.id AND review_type == FINAL"
          - "no DispositionOrder of this season has status IN {DRAFT, APPROVED}"
        side_effects:
          - "every VendorAllowanceAgreement of this season with status IN {PROPOSED, COUNTERED} moves to EXPIRED"
          - "every VendorClaim with status == SUBMITTED whose agreement just moved to EXPIRED moves to REJECTED with rejection_reason = AGREEMENT_EXPIRED"
          - "every ClearanceReservation of this season with status IN {RESERVED, COMMITTED} moves to RELEASED, restoring Store.available_clearance_units"

  - entity: Item
    dimension: lifecycle_stage
    initial_state: NEW_ARRIVAL
    terminal_states: [DISPOSED]
    transitions:
      - from: NEW_ARRIVAL
        to: CORE
        trigger: "system event: calculations.lifecycle_stage_classification re-runs after any Item mutation or after POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "current_date > Item.protected_until_date"
          - "classification rules 1-5 do not match"
        side_effects: ["Item.updated_at refreshed; Item.version incremented"]
      - from: NEW_ARRIVAL
        to: AGING
        trigger: "system event: calculations.lifecycle_stage_classification re-runs after POST /items/{item_id}/sales-weeks or POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "current_date > Item.protected_until_date"
          - "Item.weeks_on_hand >= AGING_WEEKS, OR (Item.sell_through_pct < SLOW_SELLER_ST_PCT AND Item.weeks_on_hand >= SLOW_SELLER_MIN_WEEKS)"
        side_effects: ["Item becomes markdown-eligible (validations priority 15 no longer blocks)"]
      - from: CORE
        to: AGING
        trigger: "system event: calculations.lifecycle_stage_classification re-runs"
        actor: system
        preconditions:
          - "Item.weeks_on_hand >= AGING_WEEKS, OR (Item.sell_through_pct < SLOW_SELLER_ST_PCT AND Item.weeks_on_hand >= SLOW_SELLER_MIN_WEEKS)"
        side_effects: ["Item becomes markdown-eligible"]
      - from: AGING
        to: CLEARANCE
        trigger: "system event: calculations.lifecycle_stage_classification re-runs after Item.markdown_state becomes PERM_MARKED, or after the clock advances so that weeks_to_exit <= CLEARANCE_WEEKS"
        actor: system
        preconditions:
          - "Item.markdown_state == PERM_MARKED OR Item.weeks_to_exit <= CLEARANCE_WEEKS"
        side_effects:
          - "every ClearanceReservation with markdown_plan_id in this item's non-terminal plans and status == RESERVED moves to COMMITTED (hop 4 of cascade markdown_apply_exit_window_cascade)"
        note: "Hop 3 of cascade markdown_apply_exit_window_cascade; caused by the markdown_state change, not directly by the apply call."
      - from: CORE
        to: CLEARANCE
        trigger: "system event: calculations.lifecycle_stage_classification re-runs after the clock advances"
        actor: system
        preconditions: ["Item.weeks_to_exit <= CLEARANCE_WEEKS"]
        side_effects: ["every ClearanceReservation of this item's non-terminal plans with status == RESERVED moves to COMMITTED"]
      - from: CLEARANCE
        to: AGING
        trigger: "system event: calculations.lifecycle_stage_classification re-runs after Item.markdown_state reverts to FULL_PRICE via POST /zone-executions/{zone_execution_id}/roll-back"
        actor: system
        preconditions:
          - "Item.markdown_state == FULL_PRICE"
          - "Item.weeks_to_exit > CLEARANCE_WEEKS"
          - "Item.weeks_on_hand >= AGING_WEEKS OR (Item.sell_through_pct < SLOW_SELLER_ST_PCT AND Item.weeks_on_hand >= SLOW_SELLER_MIN_WEEKS)"
        side_effects: ["COMMITTED ClearanceReservations of this item's plans revert to RESERVED"]
        note: "Backward edge: the lifecycle dimension is cyclic (AGING -> CLEARANCE -> AGING)."
      - from: CLEARANCE
        to: EXIT_PENDING
        trigger: "system event: classification re-runs after Season.status becomes EXIT_WINDOW or after the clock advances"
        actor: system
        preconditions:
          - "Season.status == EXIT_WINDOW"
          - "Item.weeks_to_exit <= EXIT_PENDING_WEEKS"
        side_effects: ["Item becomes eligible for DispositionOrder creation (validations priority 16)"]
      - from: AGING
        to: EXIT_PENDING
        trigger: "system event: classification re-runs after Season.status becomes EXIT_WINDOW"
        actor: system
        preconditions:
          - "Season.status == EXIT_WINDOW"
          - "Item.weeks_to_exit <= EXIT_PENDING_WEEKS"
        side_effects: ["Item becomes eligible for DispositionOrder creation"]
      - from: EXIT_PENDING
        to: DISPOSED
        trigger: "system event: classification re-runs after POST /disposition-orders/{disposition_order_id}/settle"
        actor: system
        preconditions:
          - "Item.on_hand_units == 0"
          - "Item.units_disposed_total > 0"
        side_effects: ["Item.markdown_state moves to SETTLED"]
      - from: CLEARANCE
        to: DISPOSED
        trigger: "system event: classification re-runs after POST /disposition-orders/{disposition_order_id}/settle"
        actor: system
        preconditions:
          - "Item.on_hand_units == 0"
          - "Item.units_disposed_total > 0"
        side_effects: ["Item.markdown_state moves to SETTLED"]

  - entity: Item
    dimension: markdown_state
    initial_state: FULL_PRICE
    terminal_states: [SETTLED]
    transitions:
      - from: FULL_PRICE
        to: PROMO_ACTIVE
        trigger: "POST /zone-executions/{zone_execution_id}/apply where MarkdownPlan.plan_type == PROMOTIONAL"
        actor: system
        preconditions:
          - "MarkdownPlan.plan_type == PROMOTIONAL"
          - "MarkdownStep.depth_pct < EXIT_DEPTH_PCT"
        side_effects:
          - "Item.current_retail_cents = MarkdownStep.price_cents"
          - "Item.promo_discount_cents accrues per_unit_markdown_cents for every unit sold on or after effective_date (contra-revenue treatment)"
      - from: PROMO_ACTIVE
        to: FULL_PRICE
        trigger: "POST /zone-executions/{zone_execution_id}/roll-back"
        actor: PricingAnalyst
        preconditions:
          - "no other ZoneExecution of this item has status == APPLIED"
        side_effects:
          - "Item.current_retail_cents restored to Item.original_retail_cents"
          - "Item.promo_discount_cents reduced by the rolled-back execution's accrual (compensating action; leaves margin_exposure_cents unchanged)"
        note: "Backward edge: the markdown dimension is cyclic for promotional pricing."
      - from: FULL_PRICE
        to: PERM_MARKED
        trigger: "POST /zone-executions/{zone_execution_id}/apply where MarkdownPlan.plan_type == PERMANENT"
        actor: system
        preconditions:
          - "MarkdownPlan.plan_type == PERMANENT"
          - "MarkdownStep.depth_pct < EXIT_DEPTH_PCT"
        side_effects:
          - "Item.current_retail_cents = MarkdownStep.price_cents"
          - "Item.permanent_markdown_reserve_cents += ZoneExecution.line_markdown_cents (writedown recognized at execution)"
          - "Item.lifecycle_stage reclassified (hop 3 of cascade markdown_apply_exit_window_cascade)"
      - from: PROMO_ACTIVE
        to: PERM_MARKED
        trigger: "POST /zone-executions/{zone_execution_id}/apply where MarkdownPlan.plan_type == PERMANENT"
        actor: system
        preconditions: ["MarkdownPlan.plan_type == PERMANENT", "MarkdownStep.depth_pct < EXIT_DEPTH_PCT"]
        side_effects:
          - "Item.current_retail_cents = MarkdownStep.price_cents"
          - "Item.permanent_markdown_reserve_cents += ZoneExecution.line_markdown_cents"
          - "Item.lifecycle_stage reclassified"
      - from: PERM_MARKED
        to: FULL_PRICE
        trigger: "POST /zone-executions/{zone_execution_id}/roll-back"
        actor: PricingAnalyst
        preconditions:
          - "no other ZoneExecution of this item has status == APPLIED"
        side_effects:
          - "Item.current_retail_cents restored to Item.original_retail_cents"
          - "Item.permanent_markdown_reserve_cents -= the rolled-back execution's line_markdown_cents"
          - "Item.lifecycle_stage reclassified, which reverts CLEARANCE to AGING and COMMITTED reservations to RESERVED"
      - from: PERM_MARKED
        to: EXIT_PRICED
        trigger: "POST /zone-executions/{zone_execution_id}/apply where MarkdownStep.depth_pct >= EXIT_DEPTH_PCT"
        actor: system
        preconditions:
          - "MarkdownPlan.plan_type == PERMANENT"
          - "MarkdownStep.depth_pct >= EXIT_DEPTH_PCT"
        side_effects:
          - "Item.current_retail_cents = MarkdownStep.price_cents"
          - "Item.permanent_markdown_reserve_cents += ZoneExecution.line_markdown_cents"
      - from: EXIT_PRICED
        to: SETTLED
        trigger: "POST /disposition-orders/{disposition_order_id}/settle"
        actor: system
        preconditions: ["Item.on_hand_units == 0 after settlement"]
        side_effects: ["Item.lifecycle_stage moves to DISPOSED"]
      - from: PERM_MARKED
        to: SETTLED
        trigger: "POST /disposition-orders/{disposition_order_id}/settle"
        actor: system
        preconditions: ["Item.on_hand_units == 0 after settlement"]
        side_effects: ["Item.lifecycle_stage moves to DISPOSED"]

  - entity: ElasticityEstimate
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /elasticity-estimates/{estimate_id}/certify"
        actor: PricingAnalyst
        preconditions:
          - "ElasticityEstimate.status == DRAFT"
          - "ElasticityEstimate.confidence == HIGH OR request carries override_low_confidence == true"
        side_effects:
          - "certified_at set to the logical clock instant"
          - "every other ElasticityEstimate of the same item_id with status IN {DRAFT, CERTIFIED} moves to SUPERSEDED"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system event: another ElasticityEstimate for the same item_id is certified"
        actor: system
        preconditions: ["a different estimate of the same item_id just entered CERTIFIED"]
        side_effects:
          - "any MarkdownPlan with status IN {DRAFT, REVISION_REQUESTED} referencing this estimate can no longer be submitted (validations priority 14)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: another ElasticityEstimate for the same item_id is certified"
        actor: system
        preconditions: ["a different estimate of the same item_id just entered CERTIFIED"]
        side_effects: ["estimate is no longer certifiable"]

  - entity: MarkdownPlan
    dimension: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /markdown-plans/{markdown_plan_id}/submit"
        actor: PricingAnalyst
        preconditions:
          - "MarkdownPlan.status IN {DRAFT}"
          - "ladder_step_count >= 1"
          - "referenced ElasticityEstimate.status == CERTIFIED and its item_id == MarkdownPlan.item_id"
          - "Item.lifecycle_stage IN {AGING, CLEARANCE, EXIT_PENDING}"
          - "Season.status IN {ACTIVE, EXIT_WINDOW}"
          - "every MarkdownStep of the plan satisfies the cadence, monotonic-depth, protected-window and exit-date rules (validations priorities 17-20)"
        side_effects: ["MarkdownPlan.projected_exit_units recomputed from its scheduled executions (0 while none exist)"]
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /markdown-plans/{markdown_plan_id}/request-revision"
        actor: MerchandiseDirector
        preconditions:
          - "MarkdownPlan.status == SUBMITTED"
        side_effects:
          - "revision_round incremented by 1"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /markdown-plans/{markdown_plan_id}/reopen"
        actor: PricingAnalyst
        preconditions:
          - "MarkdownPlan.status == REVISION_REQUESTED"
          - "revision_round <= MAX_REVISION_ROUNDS"
        side_effects:
          - "every MarkdownStep of this plan with status == PLANNED is deleted from the ladder by moving it to SUPERSEDED, so the analyst re-authors the ladder from step_index 1"
          - "ladder_step_count recomputed to 0"
        note: "Closes the cycle DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /markdown-plans/{markdown_plan_id}/approve"
        actor: MerchandiseDirector
        preconditions:
          - "MarkdownPlan.status == SUBMITTED"
          - "Season.status IN {ACTIVE, EXIT_WINDOW}"
          - "X-User-ID != MarkdownPlan.created_by_user_id (segregation of duties)"
        side_effects:
          - "approved_by_user_id set to X-User-ID"
          - "Season.projected_exit_units recomputed"
      - from: APPROVED
        to: EXECUTING
        trigger: "system event: the first ZoneExecution of this plan reaches APPLIED"
        actor: system
        preconditions: ["MarkdownPlan.status == APPROVED"]
        side_effects: ["gross_markdown_cents and net_markdown_cents recomputed from applied executions"]
      - from: EXECUTING
        to: COMPLETED
        trigger: "system event: the last MarkdownStep of the plan reaches EXECUTED, or Item.markdown_state reaches SETTLED"
        actor: system
        preconditions:
          - "MarkdownPlan.status == EXECUTING"
          - "every MarkdownStep with status != SUPERSEDED has status == EXECUTED, OR Item.markdown_state == SETTLED"
        side_effects: ["plan is claimable by a VendorClaim while COMPLETED (validations priority 13 allows EXECUTING and COMPLETED)"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: POST /markdown-plans creates a newer plan for the same (season_id, item_id)"
        actor: system
        preconditions: ["MarkdownPlan.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED}"]
        side_effects:
          - "superseded_by_plan_id set to the new plan's id"
          - "every MarkdownStep of this plan with status IN {PLANNED, SCHEDULED} moves to SUPERSEDED"
          - "every ClearanceReservation of this plan with status IN {RESERVED, COMMITTED} moves to RELEASED"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event: POST /markdown-plans creates a newer plan for the same (season_id, item_id)"
        actor: system
        preconditions: ["MarkdownPlan.status == APPROVED", "no ZoneExecution of this plan has status == APPLIED"]
        side_effects:
          - "superseded_by_plan_id set to the new plan's id"
          - "every MarkdownStep with status IN {PLANNED, SCHEDULED} moves to SUPERSEDED"
          - "every ClearanceReservation of this plan with status IN {RESERVED, COMMITTED} moves to RELEASED"
        note: "A plan with an APPLIED execution cannot be superseded (validations priority 12 rejects the create with ERR_PLAN_ALREADY_EXECUTING)."

  - entity: MarkdownStep
    dimension: status
    initial_state: PLANNED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /zone-executions"
        actor: PricingAnalyst
        preconditions:
          - "MarkdownStep.status == PLANNED"
          - "MarkdownPlan.status == APPROVED OR MarkdownPlan.status == EXECUTING"
        side_effects: ["MarkdownPlan.projected_exit_units += ZoneExecution.units_in_scope"]
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /zone-executions/{zone_execution_id}/apply"
        actor: PricingAnalyst
        preconditions: ["MarkdownStep.status == SCHEDULED"]
        side_effects: ["Item.current_retail_cents rewritten to MarkdownStep.price_cents (hop 1 of cascade markdown_apply_exit_window_cascade)"]
      - from: EXECUTED
        to: SCHEDULED
        trigger: "POST /zone-executions/{zone_execution_id}/roll-back"
        actor: PricingAnalyst
        preconditions: ["MarkdownStep.status == EXECUTED", "the rolled-back execution is the only APPLIED execution of this step"]
        side_effects: ["Item.current_retail_cents restored; plan gross_markdown_cents reduced by the execution's line_markdown_cents"]
        note: "Backward edge: rungs can be un-executed, so the step dimension is cyclic."
      - from: PLANNED
        to: SUPERSEDED
        trigger: "system event: the owning plan moves to SUPERSEDED, or POST /markdown-plans/{markdown_plan_id}/reopen clears the ladder"
        actor: system
        preconditions: ["MarkdownStep.status == PLANNED"]
        side_effects: ["MarkdownPlan.ladder_step_count recomputed"]
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system event: the owning plan moves to SUPERSEDED"
        actor: system
        preconditions: ["MarkdownStep.status == SCHEDULED"]
        side_effects: ["MarkdownPlan.ladder_step_count recomputed"]

  - entity: ZoneExecution
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [ROLLED_BACK]
    transitions:
      - from: SCHEDULED
        to: APPLIED
        trigger: "POST /zone-executions/{zone_execution_id}/apply"
        actor: PricingAnalyst
        preconditions:
          - "ZoneExecution.status == SCHEDULED"
          - "ZoneExecution.signage_status == VERIFIED"
          - "MarkdownPlan.status IN {APPROVED, EXECUTING}"
          - "Item.markdown_state IN {FULL_PRICE, PROMO_ACTIVE, PERM_MARKED}"
          - "current_date >= ZoneExecution.effective_date"
          - "units_in_scope <= Item.on_hand_units"
          - "MarkdownStep.price_cents < Item.current_retail_cents"
        side_effects:
          - "per_unit_markdown_cents = Item.current_retail_cents - MarkdownStep.price_cents; line_markdown_cents = per_unit_markdown_cents * units_in_scope; price_cents_applied = MarkdownStep.price_cents (calculations.markdown_liability_line)"
          - "hop 1: Item.current_retail_cents = MarkdownStep.price_cents and MarkdownStep moves to EXECUTED"
          - "hop 2: because the ticket dropped under this plan_type, Item.markdown_state moves to PERM_MARKED (or PROMO_ACTIVE / EXIT_PRICED per the Item markdown machine)"
          - "hop 3: because Item.markdown_state changed, calculations.lifecycle_stage_classification re-runs and Item.lifecycle_stage moves to CLEARANCE"
          - "hop 4: because Item.lifecycle_stage became CLEARANCE, every ClearanceReservation of this plan with status == RESERVED moves to COMMITTED, so Season.reserved_clearance_units decreases and Season.committed_clearance_units increases"
          - "hop 5: because Season.committed_clearance_units crossed round_half_up(exit_units_target * EXIT_WINDOW_TRIGGER_PCT / 100), Season.status moves ACTIVE -> EXIT_WINDOW, which reclassifies the season's items"
          - "MarkdownPlan.gross_markdown_cents += line_markdown_cents; net_markdown_cents recomputed; plan moves APPROVED -> EXECUTING on the first applied execution"
      - from: APPLIED
        to: ROLLED_BACK
        trigger: "POST /zone-executions/{zone_execution_id}/roll-back"
        actor: PricingAnalyst
        preconditions:
          - "ZoneExecution.status == APPLIED"
          - "no VendorClaim with status == RECOGNIZED references this execution's MarkdownPlan"
        side_effects:
          - "Item.current_retail_cents restored to Item.original_retail_cents when no other APPLIED execution remains for the item, otherwise to the price_cents_applied of the latest remaining APPLIED execution ordered by effective_date ASC then created_at ASC"
          - "MarkdownPlan.gross_markdown_cents -= line_markdown_cents; net_markdown_cents recomputed"
          - "Item.permanent_markdown_reserve_cents -= line_markdown_cents (PERMANENT plans) or Item.promo_discount_cents -= the accrued contra-revenue (PROMOTIONAL plans)"
          - "MarkdownStep moves EXECUTED -> SCHEDULED; Item.markdown_state and Item.lifecycle_stage reclassified; COMMITTED reservations of the plan revert to RESERVED"
        note: "Compensating action for the apply cascade; leaves margin_exposure_cents (calculations.markdown_liability_line invariant) unchanged."

  - entity: ZoneExecution
    dimension: signage_status
    initial_state: PENDING
    terminal_states: [NON_COMPLIANT, VERIFIED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /zone-executions/{zone_execution_id}/post-signage"
        actor: StoreManager
        preconditions:
          - "ZoneExecution.signage_status == PENDING"
          - "current_date <= ZoneExecution.signage_due_date"
          - "for execution_scope == STORE the acting StoreManager's X-User-ID equals ZoneExecution.store_id"
        side_effects: ["posted_at and posted_by_user_id stamped from the logical clock and header"]
      - from: PENDING
        to: NON_COMPLIANT
        trigger: "POST /zone-executions/{zone_execution_id}/post-signage after the signage due date"
        actor: StoreManager
        preconditions:
          - "ZoneExecution.signage_status == PENDING"
          - "current_date > ZoneExecution.signage_due_date"
        side_effects:
          - "posted_at and posted_by_user_id stamped; the execution can never be applied (validations priority 21 rejects apply with ERR_SIGNAGE_NOT_VERIFIED) and can never be verified"
        note: "Terminal on the signage dimension; the analyst must schedule a fresh execution."
      - from: POSTED
        to: VERIFIED
        trigger: "POST /zone-executions/{zone_execution_id}/verify-signage"
        actor: MerchandiseDirector
        preconditions:
          - "ZoneExecution.signage_status == POSTED"
          - "for execution_scope == CHAIN the actor role is MerchandiseDirector; for execution_scope IN {ZONE, STORE} the actor role is MerchandiseDirector or the StoreManager whose X-User-ID equals ZoneExecution.store_id"
        side_effects: ["verified_by_user_id stamped; the execution becomes appliable"]

  - entity: VendorAllowanceAgreement
    dimension: status
    initial_state: PROPOSED
    terminal_states: [FUNDED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /allowance-agreements/{agreement_id}/counter as VendorRep"
        actor: VendorRep
        preconditions:
          - "VendorAllowanceAgreement.status == PROPOSED"
          - "round_index < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "current_share_pct and current_cap_cents overwritten by the counter offer; round_index incremented; last_offer_by_role = VendorRep; last_offer_by_user_id = X-User-ID"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /allowance-agreements/{agreement_id}/counter as PricingAnalyst"
        actor: PricingAnalyst
        preconditions:
          - "VendorAllowanceAgreement.status == COUNTERED"
          - "round_index < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "current_share_pct and current_cap_cents overwritten; round_index incremented; last_offer_by_role = PricingAnalyst"
        note: "Closes the negotiation cycle PROPOSED <-> COUNTERED; round_index is capped at MAX_NEGOTIATION_ROUNDS."
      - from: PROPOSED
        to: AGREED
        trigger: "POST /allowance-agreements/{agreement_id}/accept as VendorRep"
        actor: VendorRep
        preconditions:
          - "VendorAllowanceAgreement.status == PROPOSED"
          - "last_offer_by_role != VendorRep (segregation of duties: a party cannot accept its own offer)"
        side_effects:
          - "agreed_share_pct = current_share_pct; funding_cap_cents = current_cap_cents; remaining_cap_cents = current_cap_cents; recognized_total_cents = 0"
      - from: COUNTERED
        to: AGREED
        trigger: "POST /allowance-agreements/{agreement_id}/accept as PricingAnalyst"
        actor: PricingAnalyst
        preconditions:
          - "VendorAllowanceAgreement.status == COUNTERED"
          - "last_offer_by_role != PricingAnalyst"
        side_effects:
          - "agreed_share_pct = current_share_pct; funding_cap_cents = current_cap_cents; remaining_cap_cents = current_cap_cents"
      - from: AGREED
        to: FUNDED
        trigger: "system event: remaining_cap_cents reaches 0 as a consequence of a VendorClaim entering RECOGNIZED"
        actor: system
        preconditions:
          - "VendorAllowanceAgreement.status == AGREED"
          - "remaining_cap_cents == 0"
        side_effects:
          - "hop 4 of cascade allowance_cap_exhaustion_cascade: every VendorClaim of this agreement with status == SUBMITTED moves to REJECTED with rejection_reason = CAP_EXHAUSTED"
        note: "Hop 3 of cascade allowance_cap_exhaustion_cascade; caused by the cap field update, not directly by the recognize call."
      - from: PROPOSED
        to: EXPIRED
        trigger: "system event: Season moves EXIT_WINDOW -> CLOSED"
        actor: system
        preconditions: ["VendorAllowanceAgreement.status == PROPOSED"]
        side_effects: ["SUBMITTED claims of this agreement move to REJECTED with rejection_reason = AGREEMENT_EXPIRED"]
      - from: COUNTERED
        to: EXPIRED
        trigger: "system event: Season moves EXIT_WINDOW -> CLOSED"
        actor: system
        preconditions: ["VendorAllowanceAgreement.status == COUNTERED"]
        side_effects: ["SUBMITTED claims of this agreement move to REJECTED with rejection_reason = AGREEMENT_EXPIRED"]

  - entity: VendorClaim
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: RECOGNIZED
        trigger: "POST /vendor-claims/{claim_id}/recognize"
        actor: Controller
        preconditions:
          - "VendorClaim.status == SUBMITTED"
          - "VendorAllowanceAgreement.status == AGREED"
          - "MarkdownPlan.status IN {EXECUTING, COMPLETED}"
          - "MarkdownPlan.plan_type == PERMANENT"
          - "calculations.vendor_funding_recognition yields recognized_cents >= 1"
        side_effects:
          - "hop 1: recognized_cents computed and stored; recognized_by_user_id stamped"
          - "hop 2: because this claim is RECOGNIZED, VendorAllowanceAgreement.recognized_total_cents += recognized_cents and remaining_cap_cents = funding_cap_cents - recognized_total_cents"
          - "hop 3: because remaining_cap_cents reached 0, the agreement moves AGREED -> FUNDED"
          - "hop 4: because the agreement is FUNDED, every other VendorClaim of the agreement with status == SUBMITTED moves to REJECTED with rejection_reason = CAP_EXHAUSTED"
          - "hop 5: because those sibling claims are REJECTED, each of their MarkdownPlan rows recomputes vendor_funded_cents and net_markdown_cents = gross_markdown_cents - vendor_funded_cents"
          - "this claim's own MarkdownPlan.vendor_funded_cents += recognized_cents and net_markdown_cents recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system event: the agreement reaches FUNDED or EXPIRED"
        actor: system
        preconditions: ["VendorClaim.status == SUBMITTED"]
        side_effects: ["rejection_reason set to CAP_EXHAUSTED or AGREEMENT_EXPIRED; recognized_cents stays 0"]
      - from: RECOGNIZED
        to: REVERSED
        trigger: "POST /vendor-claims/{claim_id}/reverse"
        actor: Controller
        preconditions:
          - "VendorClaim.status == RECOGNIZED"
          - "VendorAllowanceAgreement.status IN {AGREED, FUNDED}"
        side_effects:
          - "VendorAllowanceAgreement.recognized_total_cents -= recognized_cents; remaining_cap_cents restored; a FUNDED agreement returns to AGREED"
          - "MarkdownPlan.vendor_funded_cents -= recognized_cents; net_markdown_cents recomputed"
          - "recognized_cents zeroed on the claim"
        note: "Compensating action: leaves funding_cap_cents == remaining_cap_cents + sum(RECOGNIZED recognized_cents) invariant intact."

  - entity: ClearanceReservation
    dimension: status
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "system event: the reservation's Item.lifecycle_stage becomes CLEARANCE or EXIT_PENDING"
        actor: system
        preconditions: ["ClearanceReservation.status == RESERVED"]
        side_effects:
          - "Season.reserved_clearance_units -= reserved_units; Season.committed_clearance_units += reserved_units (hop 4 of cascade markdown_apply_exit_window_cascade)"
      - from: COMMITTED
        to: RESERVED
        trigger: "system event: the reservation's Item.lifecycle_stage reverts to AGING after POST /zone-executions/{zone_execution_id}/roll-back"
        actor: system
        preconditions: ["ClearanceReservation.status == COMMITTED"]
        side_effects: ["Season.committed_clearance_units -= reserved_units; Season.reserved_clearance_units += reserved_units"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /clearance-reservations/{reservation_id}/release"
        actor: PricingAnalyst
        preconditions: ["ClearanceReservation.status == RESERVED"]
        side_effects:
          - "released_at stamped; Store.committed_clearance_units -= reserved_units; Store.available_clearance_units += reserved_units; Season.reserved_clearance_units -= reserved_units"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /clearance-reservations/{reservation_id}/release"
        actor: PricingAnalyst
        preconditions: ["ClearanceReservation.status == COMMITTED"]
        side_effects:
          - "released_at stamped; Store.committed_clearance_units -= reserved_units; Store.available_clearance_units += reserved_units; Season.committed_clearance_units -= reserved_units"

  - entity: DispositionOrder
    dimension: status
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /disposition-orders/{disposition_order_id}/approve"
        actor: Controller
        preconditions:
          - "DispositionOrder.status == DRAFT"
          - "Season.status == EXIT_WINDOW"
          - "X-User-ID != DispositionOrder.created_by_user_id (segregation of duties)"
        side_effects: ["approved_by_user_id stamped"]
      - from: APPROVED
        to: SETTLED
        trigger: "POST /disposition-orders/{disposition_order_id}/settle"
        actor: Controller
        preconditions:
          - "DispositionOrder.status == APPROVED"
          - "settled_units >= 1 AND settled_units <= DispositionOrder.units"
        side_effects:
          - "settled_recovery_cents recomputed from settled_units via calculations.disposition_recovery"
          - "Item.units_disposed_total += settled_units; Item.units_committed_disposition -= units; Item.on_hand_units recomputed"
          - "when Item.on_hand_units reaches 0, Item.markdown_state moves to SETTLED and Item.lifecycle_stage moves to DISPOSED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /disposition-orders/{disposition_order_id}/cancel"
        actor: PricingAnalyst
        preconditions: ["DispositionOrder.status == DRAFT"]
        side_effects:
          - "Item.units_committed_disposition -= units, restoring item_available_units = on_hand_units - units_committed_disposition to its pre-create value"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /disposition-orders/{disposition_order_id}/cancel"
        actor: PricingAnalyst
        preconditions: ["DispositionOrder.status == APPROVED"]
        side_effects:
          - "Item.units_committed_disposition -= units, restoring item_available_units to its pre-create value"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent's `version` only.
# Both entries are CREATE-with-supersede: the new child legitimately supersedes
# the prior one, so a strictly sequential second create against a stale parent
# version is the only deterministic way to reject the losing writer.
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-item
    parent_entity: Item
    write_endpoint: "POST /markdown-plans"
    occ_field: "expected_item_version"
    description: |
      Creating a MarkdownPlan for an Item whose version has advanced since the
      client last read it is rejected. A new plan for the same (season_id, item_id)
      legitimately supersedes the prior plan (§1.2 MarkdownPlan DRAFT/APPROVED ->
      SUPERSEDED), so the create would otherwise silently discard a ladder the
      client never saw; the stale-version check makes the rejection deterministic.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412
  - rule_id: clearance-allocation-stale-season
    parent_entity: Season
    write_endpoint: "POST /seasons/{season_id}/clearance-allocations"
    occ_field: "expected_season_version"
    description: |
      Allocating clearance space against a Season whose version has advanced since
      the client last read it is rejected. An allocation releases every prior
      RESERVED/COMMITTED reservation of the same markdown_plan_id and re-draws the
      waterfall, so a client working from a stale view of
      reserved_clearance_units / committed_clearance_units would supersede an
      allocation it never observed.
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lifecycle_stage_classification
    trigger: "Re-runs for an Item after every Item mutation (POST /items, POST /items/{item_id}/sales-weeks, any applied or rolled-back ZoneExecution, any settled DispositionOrder) and for every Item of a season after POST /_clock/set_current_utc or a Season status change"
    algorithm: threshold
    formula: |
      current_date    = date part (UTC) of the logical clock
      weeks_on_hand   = floor((current_date - Item.first_receipt_date).days / 7)
      weeks_to_exit   = floor((Season.exit_target_date - current_date).days / 7)   # may be negative
      slow_seller     = (Item.sell_through_pct < SLOW_SELLER_ST_PCT) and (weeks_on_hand >= SLOW_SELLER_MIN_WEEKS)

      # First matching rule wins; rules are evaluated strictly top-down.
      R1 DISPOSED     if Item.on_hand_units == 0 and Item.units_disposed_total > 0
      R2 NEW_ARRIVAL  if current_date <= Item.protected_until_date          # inclusive: the boundary day is still protected
      R3 EXIT_PENDING if Season.status == EXIT_WINDOW and weeks_to_exit <= EXIT_PENDING_WEEKS
      R4 CLEARANCE    if Item.markdown_state == PERM_MARKED or Item.markdown_state == EXIT_PRICED
                          or weeks_to_exit <= CLEARANCE_WEEKS
      R5 AGING        if weeks_on_hand >= AGING_WEEKS or slow_seller
      R6 CORE         otherwise
    input_set: "The subject Item plus its Season; SalesWeek rows enter only through the already-maintained Item.sell_through_pct / Item.units_sold_total aggregates"
    constants:
      PROTECTED_NEW_ARRIVAL_DAYS: { APPAREL: 42, FOOTWEAR: 56, ACCESSORIES: 28, SEASONAL_DECOR: 21 }
      AGING_WEEKS: 10
      SLOW_SELLER_ST_PCT: 45.00
      SLOW_SELLER_MIN_WEEKS: 6
      CLEARANCE_WEEKS: 6
      EXIT_PENDING_WEEKS: 2
    precision: "weeks are integers via floor of whole days / 7; sell_through_pct compared at 2 decimals"
    variants: []
    note: "Markdown eligibility (validations priority 15) is exactly lifecycle_stage IN {AGING, CLEARANCE, EXIT_PENDING}; NEW_ARRIVAL and CORE are ineligible and DISPOSED is closed."

  - name: elasticity_coefficient_estimation
    trigger: "POST /elasticity-estimates"
    algorithm: weighted_scoring
    formula: |
      # SalesWeek rows of the subject item, ordered week_ending_date ASC, tie-break created_at ASC.
      weeks            = SalesWeek where item_id == subject.id, ordered as above
      distinct_prices  = count(distinct weeks[*].ticket_price_cents)
      own_history_ok   = len(weeks) >= MIN_SAMPLE_WEEKS
                         and distinct_prices >= 2
                         and weeks[0].ticket_price_cents != weeks[-1].ticket_price_cents
                         and weeks[0].units_sold >= 1 and weeks[-1].units_sold >= 1

      # VARIANT own_history
      raw = ln(weeks[-1].units_sold / weeks[0].units_sold)
            / ln(weeks[-1].ticket_price_cents / weeks[0].ticket_price_cents)

      # VARIANT cluster_pooled
      peers = Item P where P.id != subject.id
                       and P.season_id == subject.season_id
                       and P.category == subject.category
                       and P.cluster_code == subject.cluster_code
                       and P.units_sold_total >= 1
                       and exists ElasticityEstimate E with E.item_id == P.id and E.status == CERTIFIED
      # exactly one CERTIFIED estimate can exist per item (certify supersedes the others)
      raw = sum(E_P.elasticity_coefficient * P.units_sold_total for P in peers)
            / sum(P.units_sold_total for P in peers)

      elasticity_coefficient = round_half_up(min(ELASTICITY_CAP, max(ELASTICITY_FLOOR, raw)), 4)
      confidence = HIGH if (resolved_method == OWN_HISTORY and sample_weeks_used >= HIGH_CONFIDENCE_WEEKS) else LOW
    input_set: "own_history uses only the subject item's SalesWeek rows; cluster_pooled uses only peer items with a CERTIFIED estimate and units_sold_total >= 1, and never the subject's own weeks"
    constants:
      MIN_SAMPLE_WEEKS: 4
      HIGH_CONFIDENCE_WEEKS: 4
      ELASTICITY_FLOOR: -4.0000
      ELASTICITY_CAP: -0.2000
    precision: "4 decimal places, round_half_up; natural logarithms evaluated on the raw integer cent prices and unit counts"
    variants:
      - name: own_history
        when: "method == OWN_HISTORY, or method == AUTO and own_history_ok is true"
        difference: "Two-point log-log slope over the subject item's own earliest and latest SalesWeek; resolved_method = OWN_HISTORY, sample_weeks_used = len(weeks), peer_items_used = 0. Rejected with ERR_INSUFFICIENT_PRICE_HISTORY when method == OWN_HISTORY and own_history_ok is false."
      - name: cluster_pooled
        when: "method == CLUSTER_POOLED, or method == AUTO and own_history_ok is false"
        difference: "Units-weighted mean of peer items' CERTIFIED coefficients within the same (season, category, cluster_code); resolved_method = CLUSTER_POOLED, sample_weeks_used = 0, peer_items_used = len(peers), confidence = LOW. Rejected with ERR_EMPTY_PEER_POOL when peers is empty."
    note: "For an item that satisfies own_history_ok AND has pooled peers, the two variants return different coefficients for identical stored data, which then propagates to a different recommended_first_step_depth."

  - name: recommended_first_step_depth
    trigger: "POST /markdown-plans (stored on MarkdownPlan.recommended_depth_pct)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is fixed: (1) base, (2) urgency tier, (3) inventory pressure, (4) elasticity factor, (5) clamp.
      base_depth_pct = BASE_DEPTH_PCT[Item.lifecycle_stage]           # keyed for all six lifecycle stages

      weeks_to_exit  = floor((Season.exit_target_date - current_date).days / 7)
      urgency_pct    = 0.00  if weeks_to_exit > 12
                       5.00  if 8 <= weeks_to_exit <= 12
                       10.00 if 4 <= weeks_to_exit <= 7
                       20.00 if weeks_to_exit < 4

      pressure_pct   = min(PRESSURE_CAP_PCT,
                           round_half_up(max(0.00, Item.weeks_of_supply - TARGET_WEEKS_OF_SUPPLY) * PRESSURE_PER_WEEK_PCT, 2))

      elasticity_factor = round_half_up(min(ELASTICITY_FACTOR_CAP,
                                            max(ELASTICITY_FACTOR_FLOOR,
                                                abs(ElasticityEstimate.elasticity_coefficient) / ELASTICITY_PIVOT)), 4)

      recommended_depth_pct = round_half_up(
          min(MAX_DEPTH_PCT,
              max(MIN_DEPTH_PCT,
                  (base_depth_pct + urgency_pct + pressure_pct) * elasticity_factor)), 2)
    input_set: "The plan's Item (lifecycle_stage, weeks_of_supply), its Season (exit_target_date), the referenced ElasticityEstimate, and the logical clock"
    constants:
      BASE_DEPTH_PCT: { NEW_ARRIVAL: 0.00, CORE: 5.00, AGING: 15.00, CLEARANCE: 30.00, EXIT_PENDING: 50.00, DISPOSED: 0.00 }
      TARGET_WEEKS_OF_SUPPLY: 4.00
      PRESSURE_PER_WEEK_PCT: 1.50
      PRESSURE_CAP_PCT: 15.00
      ELASTICITY_PIVOT: 1.50
      ELASTICITY_FACTOR_FLOOR: 0.60
      ELASTICITY_FACTOR_CAP: 1.40
      MIN_DEPTH_PCT: 10.00
      MAX_DEPTH_PCT: 70.00
    precision: "pressure_pct and recommended_depth_pct at 2 decimals round_half_up; elasticity_factor at 4 decimals round_half_up; the multiplication happens once, after the three percentage addends are summed"
    variants: []
    note: "Four inputs interact non-linearly: a tier-selected urgency bonus, a clamped linear pressure term, a clamped ratio multiplier, and an outer clamp. Recommended depth is advisory - MarkdownStep.depth_pct is authored by the analyst and only bounded by MAX_DEPTH_PCT and monotonicity. BASE_DEPTH_PCT is keyed for every lifecycle_stage because POST /markdown-plans carries no eligibility gate (markdown eligibility is enforced at submit, validations priority 15): a plan opened on a NEW_ARRIVAL, CORE or DISPOSED item still stamps a recommended_depth_pct, which the outer clamp pins at MIN_DEPTH_PCT 10.00 unless urgency and pressure alone exceed it."

  - name: markdown_step_price
    trigger: "POST /markdown-plans/{markdown_plan_id}/steps (stored on MarkdownStep.price_cents)"
    algorithm: tiered_pricing
    formula: |
      price_cents = Item.original_retail_cents
                    - round_half_up(Item.original_retail_cents * depth_pct / 100)
    input_set: "The step's depth_pct and the owning plan's Item.original_retail_cents; the live current_retail_cents is deliberately NOT the base, so ladder depths stay cumulative off the original ticket"
    constants: {}
    precision: "the cent amount of the discount is rounded first (round_half_up, 0 decimals) and then subtracted; never round the resulting price"
    variants: []

  - name: markdown_liability_line
    trigger: "POST /zone-executions/{zone_execution_id}/apply (stored on ZoneExecution.per_unit_markdown_cents / line_markdown_cents and rolled into MarkdownPlan.gross_markdown_cents)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round the per-unit markdown to the cent FIRST (it is
      # already integral because MarkdownStep.price_cents was rounded at authoring
      # time), THEN multiply by units, THEN sum across executions. The alternative
      # order - multiply the unrounded percentage amount by units and round the
      # product - yields a different total and is explicitly NOT used.
      per_unit_markdown_cents = Item.current_retail_cents - MarkdownStep.price_cents      # step 1: per-unit, integral cents
      line_markdown_cents     = per_unit_markdown_cents * ZoneExecution.units_in_scope    # step 2: per-line product
      MarkdownPlan.gross_markdown_cents = sum(line_markdown_cents
                                              for e in ZoneExecutions of the plan where e.status == APPLIED,
                                              ordered by e.created_at ASC)                # step 3: sum of rounded lines

      # Accounting treatment branches on plan_type:
      #   PERMANENT   -> Item.permanent_markdown_reserve_cents += line_markdown_cents at apply time (all units in scope)
      #   PROMOTIONAL -> Item.promo_discount_cents += per_unit_markdown_cents * units sold on or after effective_date
      # Conserved quantity (compensating-invariant): margin_exposure_cents =
      #   Item.permanent_markdown_reserve_cents + Item.promo_discount_cents
      # apply followed by roll-back of the same execution MUST leave margin_exposure_cents
      # and Item.current_retail_cents at their pre-apply values.
    input_set: "ZoneExecutions of one MarkdownPlan with status == APPLIED; SCHEDULED and ROLLED_BACK executions are excluded from gross_markdown_cents"
    constants:
      EXIT_DEPTH_PCT: 50.00
    precision: "integer cents throughout; the only rounding happened in markdown_step_price"
    variants: []
    note: "Order matters observably: 4999 cents at 32.50% gives per-unit 1625 (round_half_up of 1624.675) and 37 units -> 60125, whereas rounding the product of the unrounded per-unit amount gives 60113."

  - name: vendor_funding_recognition
    trigger: "POST /vendor-claims/{claim_id}/recognize (stored on VendorClaim.recognized_cents)"
    algorithm: waterfall_allocation
    formula: |
      # The dependency LOOKS circular - the vendor share is a share of markdown, and
      # net markdown is markdown minus the vendor share - so the evaluation order is
      # pinned and net_markdown_cents is never an input to the share computation.
      # 1. gross markdown, funding-blind:
      gross = MarkdownPlan.gross_markdown_cents                       # applied executions only
      # 2. total the vendor could ever owe on this plan:
      eligible_total_cents = round_half_up(VendorAllowanceAgreement.agreed_share_pct / 100 * gross)
      # 3. how much of that is still unclaimed on this plan:
      headroom_cents = eligible_total_cents - MarkdownPlan.vendor_funded_cents
      # 4. the waterfall: claim amount, plan headroom, and agreement cap in that order
      recognized_cents = min(VendorClaim.claimed_cents, headroom_cents,
                             VendorAllowanceAgreement.remaining_cap_cents)
      # 5. reject when nothing is left
      if recognized_cents < 1: ERR_ALLOWANCE_CAP_EXHAUSTED
      # 6. only now is net markdown restated:
      MarkdownPlan.vendor_funded_cents += recognized_cents
      MarkdownPlan.net_markdown_cents   = gross - MarkdownPlan.vendor_funded_cents
      VendorAllowanceAgreement.recognized_total_cents += recognized_cents
      VendorAllowanceAgreement.remaining_cap_cents = funding_cap_cents - recognized_total_cents
      # Conserved quantity (compensating-invariant):
      #   funding_cap_cents == remaining_cap_cents + sum(recognized_cents of RECOGNIZED claims)
      # recognize followed by reverse MUST restore both sides exactly.
    input_set: "One VendorClaim, its VendorAllowanceAgreement (status == AGREED) and its MarkdownPlan (status IN {EXECUTING, COMPLETED}, plan_type == PERMANENT). Multiple SUBMITTED claims on one agreement drain the cap in the created_at ASC order in which the Controller recognizes them; a claim whose turn finds the cap empty is rejected."
    constants: {}
    precision: "eligible_total_cents rounded to whole cents round_half_up; every other term is already integral"
    variants: []
    note: "PROMOTIONAL plans are never claimable (validations priority 13 -> ERR_PROMO_NOT_CLAIMABLE), so promotional contra-revenue never enters the vendor-funding waterfall."

  - name: clearance_space_waterfall
    trigger: "POST /seasons/{season_id}/clearance-allocations"
    algorithm: waterfall_allocation
    formula: |
      # 0. supersede: every ClearanceReservation with this markdown_plan_id and
      #    status IN {RESERVED, COMMITTED} moves to RELEASED before anything else,
      #    restoring Store.available_clearance_units and the Season counters.
      # 1. chain-level cap (fiscal check, evaluated after the release):
      if Season.reserved_clearance_units + Season.committed_clearance_units + total_units
         > Season.clearance_space_units: ERR_SEASON_CLEARANCE_CAP_EXCEEDED
      # 2. candidate set (explicit predicate, no fuzzy "available stores"):
      candidates = Store where status == OPEN and available_clearance_units >= 1
      # 3. ranking expression, then tie-breaks:
      order candidates by available_clearance_units DESC,
                         store_number ASC,
                         created_at ASC
      # 4. waterfall fill:
      remaining = total_units; rank = 0
      for store in ordered candidates:
          if remaining == 0: break
          rank += 1
          take = min(store.available_clearance_units, remaining)
          create ClearanceReservation(season_id, store_id=store.id, markdown_plan_id,
                                      reserved_units=take, allocation_rank=rank,
                                      status=RESERVED)
          remaining -= take
      # 5. all-or-nothing: an unfilled remainder rejects the whole request and
      #    creates no reservations at all.
      if remaining > 0: ERR_CLEARANCE_SPACE_EXCEEDED
      # Conserved quantity (compensating-invariant), per store:
      #   Store.clearance_bay_units == Store.available_clearance_units
      #                              + sum(reserved_units of its RESERVED and COMMITTED reservations)
    input_set: "All Store rows with status == OPEN and available_clearance_units >= 1; REMODEL and CLOSING stores are excluded even when they have free bays"
    constants: {}
    precision: "integer units; the last funded store absorbs the remainder, so no rounding remainder exists"
    variants: []

  - name: disposition_recovery
    trigger: "POST /disposition-orders (projected_recovery_cents) and POST /disposition-orders/{disposition_order_id}/settle (settled_recovery_cents)"
    algorithm: tiered_pricing
    formula: |
      u = units at creation, or settled_units at settlement
      SALVAGE:  recovery_cents = u * unit_recovery_cents
      JOBBER:   recovery_cents = round_half_up(u * unit_recovery_cents * (100 - JOBBER_FREIGHT_PCT) / 100)
      DONATION: recovery_cents = round_half_up(u * min(fmv_cents, Item.unit_cost_cents) * DONATION_CREDIT_PCT / 100)
    input_set: "One DispositionOrder and its Item (unit_cost_cents caps the donation basis)"
    constants:
      JOBBER_FREIGHT_PCT: 8.00
      DONATION_CREDIT_PCT: 21.00
    precision: "whole cents, round_half_up, applied once to the whole-order product (never per unit)"
    variants: []
    note: "Accounting treatment: SALVAGE and JOBBER recoveries are cash credits to season margin; a DONATION recovery is a tax credit only and requires fmv_cents with unit_recovery_cents omitted or 0."

  - name: season_exit_scorecard
    trigger: "POST /seasons/{season_id}/exit-reviews"
    algorithm: aggregation
    formula: |
      items                = Item where season_id == Season.id
      units_received_total = sum(items.units_received_total)
      units_sold_total     = sum(items.units_sold_total)
      units_disposed_total = sum(items.units_disposed_total)
      revenue_cents        = sum(w.units_sold * w.ticket_price_cents for w in SalesWeek of items)
      cogs_cents           = sum(i.units_sold_total * i.unit_cost_cents for i in items)
      sell_through_pct     = round_half_up(units_sold_total / units_received_total * 100, 2)

      gross_margin_cents   = revenue_cents - cogs_cents
                             - markdown_reserve_cents - promo_discount_cents
                             + vendor_funding_cents + disposition_recovery_cents

      exit_units_variance      = (units_sold_total + units_disposed_total) - Season.exit_units_target
      sell_through_variance_pct = round_half_up(sell_through_pct - Season.sell_through_target_pct, 2)
    input_set: "Every Item of the season plus its SalesWeek rows; which markdown, funding and disposition rows are admitted depends on the variant below"
    constants: {}
    precision: "integer cents; percentages at 2 decimals round_half_up; division by zero is impossible because a season cannot be reviewed with zero items received"
    variants:
      - name: preliminary
        when: "review_type == PRELIMINARY"
        difference: |
          Scores the season on projections:
            markdown_reserve_cents      = sum over PERMANENT plans of the season, over ZoneExecutions with
                                          status IN {SCHEDULED, APPLIED}, of
                                          (Item.current_retail_cents - MarkdownStep.price_cents) * units_in_scope
                                          for SCHEDULED rows and line_markdown_cents for APPLIED rows
            promo_discount_cents        = sum over PROMOTIONAL plans, over ZoneExecutions with
                                          status IN {SCHEDULED, APPLIED}, of per-unit markdown * units_in_scope
                                          (assumes every unit in scope will sell)
            vendor_funding_cents        = sum(claimed_cents of SUBMITTED claims) + sum(recognized_cents of RECOGNIZED claims)
            disposition_recovery_cents  = sum(projected_recovery_cents of DRAFT and APPROVED orders)
                                          + sum(settled_recovery_cents of SETTLED orders)
      - name: final
        when: "review_type == FINAL"
        difference: |
          Scores the season on realized facts only:
            markdown_reserve_cents      = sum(Item.permanent_markdown_reserve_cents) over the season's items
                                          (equivalently sum of line_markdown_cents over APPLIED executions of PERMANENT plans)
            promo_discount_cents        = sum(Item.promo_discount_cents) over the season's items
                                          (only units actually sold on or after each effective_date)
            vendor_funding_cents        = sum(recognized_cents of RECOGNIZED claims only)
            disposition_recovery_cents  = sum(settled_recovery_cents of SETTLED orders only)
    note: "Both variants read identical stored rows and return different gross_margin_cents whenever any execution is still SCHEDULED, any claim still SUBMITTED, or any disposition order not yet SETTLED. A season may hold at most one review per (season_id, review_type)."

# =============================================================================
# Global constants referenced by §1.2 preconditions and §1.4 checks that are not
# owned by a single §1.3 formula.
# =============================================================================
global_constants:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  MIN_CADENCE_DAYS: 14
  MAX_LADDER_STEPS: 4
  EXIT_BUFFER_DAYS: 7
  MAX_REVISION_ROUNDS: 3
  MAX_NEGOTIATION_ROUNDS: 4
  EXIT_WINDOW_TRIGGER_PCT: 60.00
  EXIT_DEPTH_PCT: 50.00
  SIGNAGE_LEAD_DEFAULT_DAYS: { CHAIN: 10, REGION: 7, STORE: 3 }

# =============================================================================
# §1.4 Validation Rules Table — evaluated in ascending priority; the first
# violated row decides the response.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles AND is listed in the endpoint's §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body carries every required field for the endpoint with the declared type, enum membership and numeric range (including units >= 1, depth_pct within 0.01..MAX_DEPTH_PCT, pagination limit within 1..100)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Every path id resolves, validated left-to-right"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_STEP_NOT_FOUND | ERR_ZONE_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_ESTIMATE_NOT_FOUND | ERR_EXECUTION_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_DISPOSITION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Every foreign key in the request body resolves to an existing row"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_STEP_NOT_FOUND | ERR_ZONE_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_ESTIMATE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /items, POST /stores, POST /price-zones, POST /elasticity-estimates, POST /markdown-plans, POST /markdown-plans/{markdown_plan_id}/steps, POST /zone-executions, POST /seasons/{season_id}/clearance-allocations, POST /allowance-agreements, POST /vendor-claims, POST /disposition-orders, POST /items/{item_id}/sales-weeks"
  - priority: 6
    category: business_referential
    check: "For a STORE-scope ZoneExecution (store_id non-null) the posting StoreManager's X-User-ID must equal store_id; CHAIN- and ZONE-scope executions carry no store_id and may be posted by any StoreManager"
    error_id: ERR_STORE_NOT_OWNED
    http_status: 403
    applies_to: "POST /zone-executions/{zone_execution_id}/post-signage"
  - priority: 7
    category: state
    check: "expected_item_version equals Item.version (plan create) / expected_season_version equals Season.version (clearance allocation)"
    error_id: "ERR_STALE_ITEM_VERSION | ERR_STALE_SEASON_VERSION"
    http_status: 412
    applies_to: "POST /markdown-plans, POST /seasons/{season_id}/clearance-allocations"
  - priority: 8
    category: state
    check: "The target row is in a from-state that declares this transition in §1.2 (includes the signage dimension: post-signage requires PENDING, verify-signage requires POSTED), AND every precondition of that §1.2 transition which has no dedicated error_id further down this ladder holds - notably POST /zone-executions/{zone_execution_id}/apply requires current_date >= ZoneExecution.effective_date and MarkdownStep.price_cents < Item.current_retail_cents, and POST /zone-executions/{zone_execution_id}/roll-back requires that no VendorClaim with status == RECOGNIZED references the execution's MarkdownPlan"
    error_id: "ERR_INVALID_STATE | ERR_SIGNAGE_ALREADY_POSTED | ERR_SIGNAGE_NOT_POSTED"
    http_status: 409
    applies_to: "every transition endpoint"
  - priority: 9
    category: state
    check: "The governing Season is in the required status: ACTIVE or EXIT_WINDOW for plan submit/approve, zone-execution creation, clearance allocation, vendor claims and a PRELIMINARY exit review; EXIT_WINDOW for disposition approve, disposition settle and a FINAL exit review; and never CLOSED for any write"
    error_id: "ERR_SEASON_NOT_ACTIVE | ERR_SEASON_NOT_IN_EXIT_WINDOW | ERR_SEASON_CLOSED"
    http_status: 409
    applies_to: "POST /markdown-plans, POST /markdown-plans/{markdown_plan_id}/submit, POST /markdown-plans/{markdown_plan_id}/approve, POST /zone-executions, POST /seasons/{season_id}/clearance-allocations, POST /disposition-orders, POST /disposition-orders/{disposition_order_id}/approve, POST /disposition-orders/{disposition_order_id}/settle, POST /seasons/{season_id}/transition, POST /vendor-claims, POST /seasons/{season_id}/exit-reviews"
  - priority: 10
    category: state
    check: "The governing MarkdownPlan is in the required status: APPROVED or EXECUTING to create or apply a ZoneExecution, APPROVED or EXECUTING to allocate clearance space"
    error_id: ERR_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /zone-executions, POST /zone-executions/{zone_execution_id}/apply, POST /seasons/{season_id}/clearance-allocations"
  - priority: 11
    category: business_constraint
    check: "Segregation of duties: the approving MerchandiseDirector's X-User-ID differs from MarkdownPlan.created_by_user_id; the approving Controller's X-User-ID differs from DispositionOrder.created_by_user_id; the accepting party's role differs from VendorAllowanceAgreement.last_offer_by_role"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /markdown-plans/{markdown_plan_id}/approve, POST /disposition-orders/{disposition_order_id}/approve, POST /allowance-agreements/{agreement_id}/accept"
  - priority: 12
    category: business_constraint
    check: "A new MarkdownPlan may supersede a prior plan for the same (season_id, item_id) only when no ZoneExecution of that prior plan has status == APPLIED"
    error_id: ERR_PLAN_ALREADY_EXECUTING
    http_status: 409
    applies_to: "POST /markdown-plans"
  - priority: 13
    category: business_referential
    check: "Claim eligibility: MarkdownPlan.plan_type == PERMANENT (else ERR_PROMO_NOT_CLAIMABLE); MarkdownPlan.status IN {EXECUTING, COMPLETED} (else ERR_PLAN_NOT_CLAIMABLE); the agreement's vendor_code equals Item.vendor_code and item_category_scope equals Item.category and season_id equals the plan's season_id (else ERR_ALLOWANCE_SCOPE_MISMATCH)"
    error_id: "ERR_PROMO_NOT_CLAIMABLE | ERR_PLAN_NOT_CLAIMABLE | ERR_ALLOWANCE_SCOPE_MISMATCH"
    http_status: 422
    applies_to: "POST /vendor-claims, POST /vendor-claims/{claim_id}/recognize"
  - priority: 14
    category: business_referential
    check: "The plan's ElasticityEstimate has status == CERTIFIED and its item_id equals MarkdownPlan.item_id"
    error_id: ERR_ELASTICITY_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /markdown-plans/{markdown_plan_id}/submit"
  - priority: 15
    category: business_referential
    check: "Markdown eligibility: Item.lifecycle_stage IN {AGING, CLEARANCE, EXIT_PENDING} at submit time"
    error_id: ERR_MARKDOWN_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /markdown-plans/{markdown_plan_id}/submit"
  - priority: 16
    category: business_referential
    check: "Disposition eligibility: Item.lifecycle_stage IN {CLEARANCE, EXIT_PENDING}"
    error_id: ERR_ITEM_NOT_EXIT_ELIGIBLE
    http_status: 422
    applies_to: "POST /disposition-orders"
  - priority: 17
    category: business_temporal
    check: "Protected new-arrival period: MarkdownStep.effective_date must be strictly greater than Item.protected_until_date (equality is a violation)"
    error_id: ERR_PROTECTED_PERIOD_ACTIVE
    http_status: 422
    applies_to: "POST /markdown-plans/{markdown_plan_id}/steps"
  - priority: 18
    category: business_temporal
    check: "Cadence: (effective_date - previous rung's effective_date).days >= MIN_CADENCE_DAYS; equality is allowed"
    error_id: ERR_CADENCE_TOO_TIGHT
    http_status: 422
    applies_to: "POST /markdown-plans/{markdown_plan_id}/steps"
  - priority: 19
    category: business_temporal
    check: "Exit-date target: effective_date <= MarkdownPlan.exit_date_target - EXIT_BUFFER_DAYS (else ERR_EXIT_DATE_MISSED) and effective_date >= the logical clock's current date (else ERR_EFFECTIVE_DATE_IN_PAST)"
    error_id: "ERR_EXIT_DATE_MISSED | ERR_EFFECTIVE_DATE_IN_PAST"
    http_status: 422
    applies_to: "POST /markdown-plans/{markdown_plan_id}/steps"
  - priority: 20
    category: business_temporal
    check: "Signage lead at scheduling: ZoneExecution.effective_date - PriceZone.signage_lead_days >= the logical clock's current date, so the signage window has not already closed"
    error_id: ERR_SIGNAGE_LEAD_VIOLATION
    http_status: 422
    applies_to: "POST /zone-executions"
  - priority: 21
    category: business_safety
    check: "Signage compliance: ZoneExecution.signage_status == VERIFIED before the price change may be applied; PENDING, POSTED and NON_COMPLIANT all block"
    error_id: ERR_SIGNAGE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /zone-executions/{zone_execution_id}/apply"
  - priority: 22
    category: business_constraint
    check: "Ladder shape: step_index equals MarkdownPlan.ladder_step_count + 1 (else ERR_STEP_INDEX_OUT_OF_SEQUENCE); ladder_step_count < MAX_LADDER_STEPS (else ERR_MAX_LADDER_STEPS); depth_pct strictly greater than the previous rung's depth_pct (else ERR_DEPTH_NOT_MONOTONIC)"
    error_id: "ERR_STEP_INDEX_OUT_OF_SEQUENCE | ERR_MAX_LADDER_STEPS | ERR_DEPTH_NOT_MONOTONIC"
    http_status: 422
    applies_to: "POST /markdown-plans/{markdown_plan_id}/steps"
  - priority: 23
    category: business_temporal
    check: "STORE-scope occupancy overlap: a STORE-scope ZoneExecution occupies the half-open window [MarkdownStep.effective_date, MarkdownStep.window_end_date_exclusive) for its (item_id, store_id) pair. A new STORE-scope execution is rejected when its window intersects the window of an existing execution with status IN {SCHEDULED, APPLIED} for the same item and store. Touching windows (new.effective_date == existing.window_end_date_exclusive) do NOT intersect and are allowed."
    error_id: ERR_STEP_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /zone-executions"
  - priority: 24
    category: business_temporal
    check: "ZoneExecution spacing on the same (price_zone_id, item_id): two executions with status IN {SCHEDULED, APPLIED} must satisfy abs((new.effective_date - existing.effective_date).days) >= PriceZone.signage_lead_days; a gap exactly equal to signage_lead_days is allowed, one day less is rejected"
    error_id: ERR_ZONE_SIGNAGE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /zone-executions"
  - priority: 25
    category: business_constraint
    check: "Zone scope integrity: execution_scope == CHAIN requires PriceZone.zone_type == CHAIN and store_id null; ZONE requires zone_type == REGION and store_id null; STORE requires zone_type == STORE or REGION plus a store_id whose Store.price_zone_id equals price_zone_id; the execution's effective_date equals MarkdownStep.effective_date and the step belongs to markdown_plan_id"
    error_id: ERR_ZONE_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /zone-executions"
  - priority: 26
    category: business_constraint
    check: "Negotiation rounds: VendorAllowanceAgreement.round_index < MAX_NEGOTIATION_ROUNDS before another counter is accepted onto the table; revision rounds: MarkdownPlan.revision_round <= MAX_REVISION_ROUNDS before a reopen"
    error_id: "ERR_NEGOTIATION_ROUNDS_EXHAUSTED | ERR_REVISION_ROUNDS_EXHAUSTED"
    http_status: 409
    applies_to: "POST /allowance-agreements/{agreement_id}/counter, POST /markdown-plans/{markdown_plan_id}/reopen"
  - priority: 27
    category: business_constraint
    check: "Uniqueness: Season.code, Item.sku, Store.store_number, PriceZone.zone_code, (SalesWeek.item_id, week_ending_date), (SeasonExitReview.season_id, review_type)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /seasons, POST /items, POST /stores, POST /price-zones, POST /items/{item_id}/sales-weeks, POST /seasons/{season_id}/exit-reviews"
  - priority: 28
    category: business_fiscal
    check: "Units in scope: ZoneExecution.units_in_scope plus the units_in_scope of the item's other executions with status IN {SCHEDULED, APPLIED} must not exceed Item.on_hand_units"
    error_id: ERR_ZONE_UNITS_EXCEED_ON_HAND
    http_status: 409
    applies_to: "POST /zone-executions"
  - priority: 29
    category: business_fiscal
    check: "Chain clearance cap: Season.reserved_clearance_units + Season.committed_clearance_units + requested total_units must not exceed Season.clearance_space_units (evaluated after the supersede release)"
    error_id: ERR_SEASON_CLEARANCE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /seasons/{season_id}/clearance-allocations"
  - priority: 30
    category: business_fiscal
    check: "Store clearance capacity: the waterfall over OPEN stores with available_clearance_units >= 1 must fully cover total_units; any remainder rejects the whole request and creates no reservations"
    error_id: ERR_CLEARANCE_SPACE_EXCEEDED
    http_status: 409
    applies_to: "POST /seasons/{season_id}/clearance-allocations"
  - priority: 31
    category: business_fiscal
    check: "Allowance cap: calculations.vendor_funding_recognition must yield recognized_cents >= 1"
    error_id: ERR_ALLOWANCE_CAP_EXHAUSTED
    http_status: 409
    applies_to: "POST /vendor-claims/{claim_id}/recognize"
  - priority: 32
    category: business_fiscal
    check: "Disposition units: DispositionOrder.units <= Item.on_hand_units - Item.units_committed_disposition at creation; settled_units <= DispositionOrder.units at settlement; SalesWeek.units_sold <= Item.on_hand_units at posting"
    error_id: ERR_INSUFFICIENT_AVAILABLE_UNITS
    http_status: 409
    applies_to: "POST /disposition-orders, POST /disposition-orders/{disposition_order_id}/settle, POST /items/{item_id}/sales-weeks"
  - priority: 33
    category: business_constraint
    check: "Channel payload coherence: SALVAGE and JOBBER require unit_recovery_cents >= 1 and forbid fmv_cents; DONATION requires fmv_cents >= 1 and forbids a non-zero unit_recovery_cents"
    error_id: ERR_DISPOSITION_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "POST /disposition-orders"
  - priority: 34
    category: business_referential
    check: "Elasticity sample sufficiency: method == OWN_HISTORY requires at least MIN_SAMPLE_WEEKS SalesWeeks with at least two distinct ticket_price_cents values (else ERR_INSUFFICIENT_PRICE_HISTORY); the CLUSTER_POOLED path requires at least one other item in the same (season_id, category, cluster_code) holding a CERTIFIED estimate (else ERR_EMPTY_PEER_POOL)"
    error_id: "ERR_INSUFFICIENT_PRICE_HISTORY | ERR_EMPTY_PEER_POOL"
    http_status: 422
    applies_to: "POST /elasticity-estimates"
  - priority: 35
    category: business_referential
    check: "Certification confidence gate: confidence == HIGH, or the request carries override_low_confidence == true"
    error_id: ERR_LOW_CONFIDENCE_NOT_OVERRIDDEN
    http_status: 422
    applies_to: "POST /elasticity-estimates/{estimate_id}/certify"
  - priority: 36
    category: business_constraint
    check: "Ladder completeness: MarkdownPlan.ladder_step_count >= 1 at submit"
    error_id: ERR_EMPTY_LADDER
    http_status: 409
    applies_to: "POST /markdown-plans/{markdown_plan_id}/submit"

# =============================================================================
# §1.5 API Endpoint Table
# api_prefix is "/", so every path below is absolute from the server root.
# All GET query parameters are optional; `limit` defaults to 50 (max 100) and
# `offset` defaults to 0. List responses carry total_count / has_more per §1.0.
# =============================================================================
endpoints:

  # ---- Reads: seasons -------------------------------------------------------
  - method: GET
    path: "/seasons"
    description: "List seasons, newest first by created_at ASC tie-break on code"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, VendorRep, Controller]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: Season[]
    side_effects: []
  - method: GET
    path: "/seasons/{season_id}"
    description: "Fetch one season with its live clearance-space counters"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, VendorRep, Controller]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: GET
    path: "/seasons/{season_id}/allowance-agreements"
    description: "List every vendor allowance agreement negotiated for the season"
    roles: [PricingAnalyst, MerchandiseDirector, VendorRep, Controller]
    code: 200
    input: ["status?", "vendor_code?", "limit?", "offset?"]
    output: VendorAllowanceAgreement[]
    side_effects: []
  - method: GET
    path: "/seasons/{season_id}/exit-reviews"
    description: "List the PRELIMINARY and FINAL exit scorecards generated for the season"
