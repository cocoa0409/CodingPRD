  - rule_id: cross_entity_state_dependency
    instances:
      - name: lease_submit_requires_distributor_active
        grounds:
          - state_machines.FleetLease.DRAFT_to_SPEC_REVIEW
          - state_machines.Distributor.ACTIVE_to_PROBATION
          - validations[priority=12]
        distinguishing_aspect: |
          Entity pair FleetLease -> Distributor: the same lease submit succeeds
          while the distributor is ACTIVE and fails with ERR_DISTRIBUTOR_NOT_ACTIVE
          after a failing review drops the distributor to PROBATION — the lease's
          own fields are untouched by the flip.
        test_recipe:
          setup:
            - "D4 ACTIVE with min_parts_stock_value_cents 500000; C4 assigned to D4; M3; lease L4 in DRAFT"
