  - section: errors
    instances:
      - name: corner_request_without_identity_headers_is_rejected
        claim_type: Triggerability
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 precedes every other check: a read with no X-User-Role / X-User-ID headers returns HTTP 401 ERR_UNAUTHENTICATED, and an unrecognised role string returns the same error rather than ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          trigger:
            - call: "GET /procurement/vendors"
              payload: { limit: 10, offset: 0 }
              as: "(no X-User-Role header)"
          assert:
            - "HTTP 401 with $.data.error_id == ERR_UNAUTHENTICATED"
            - "the same call carrying X-User-Role: Auditor (not one of the six declared roles) also returns HTTP 401 ERR_UNAUTHENTICATED, NOT HTTP 403 ERR_FORBIDDEN_ROLE"
            - "the same call carrying X-User-Role: ProcurementOfficer with no X-User-ID also returns HTTP 401 ERR_UNAUTHENTICATED"

      - name: corner_each_unknown_path_id_returns_its_own_not_found_error
        claim_type: Triggerability
        grounds:
          - validations[priority=5]
          - errors[ERR_HEARING_NOT_FOUND]
          - errors[ERR_BID_NOT_FOUND]
          - errors[ERR_PROTEST_NOT_FOUND]
          - errors[ERR_AWARD_NOT_FOUND]
          - errors[ERR_PROCEEDING_NOT_FOUND]
          - errors[ERR_PETITION_NOT_FOUND]
          - errors[ERR_SCREENING_NOT_FOUND]
        distinguishing_aspect: "Each resource family owns a distinct 404 error_id; an unknown hearings/{id} must not collapse into a generic not-found or into ERR_PROTEST_NOT_FOUND."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; empty database, so every id below is unknown"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          trigger:
            - call: "GET /procurement/hearings/00000000-0000-4000-8000-0000000000h1"
              payload: {}
              as: HearingOfficer
              as_user_id: "U-HEARING-1"
          assert:
            - "HTTP 404 with $.data.error_id == ERR_HEARING_NOT_FOUND"
            - "GET /procurement/bids/00000000-0000-4000-8000-0000000000b1 returns HTTP 404 ERR_BID_NOT_FOUND"
            - "GET /procurement/protests/00000000-0000-4000-8000-0000000000p1 returns HTTP 404 ERR_PROTEST_NOT_FOUND"
            - "GET /procurement/awards/00000000-0000-4000-8000-0000000000a1 returns HTTP 404 ERR_AWARD_NOT_FOUND"
            - "GET /procurement/debarment-proceedings/00000000-0000-4000-8000-0000000000d1 returns HTTP 404 ERR_PROCEEDING_NOT_FOUND"
            - "GET /procurement/debarment-proceedings/00000000-0000-4000-8000-0000000000d1/reinstatement-petitions returns HTTP 404 ERR_PROCEEDING_NOT_FOUND (the parent is validated left to right)"
            - "POST /procurement/reinstatement-petitions/00000000-0000-4000-8000-0000000000r1/decision with { outcome: GRANTED, decision_rationale: 'x' } returns HTTP 404 ERR_PETITION_NOT_FOUND"
            - "GET /procurement/subcontractor-screenings/00000000-0000-4000-8000-0000000000s1 returns HTTP 404 ERR_SCREENING_NOT_FOUND"

      - name: corner_duplicate_registry_keys_are_rejected
        claim_type: Triggerability
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_TAX_ID]
          - errors[ERR_DUPLICATE_SOLICITATION_NUMBER]
          - errors[ERR_DUPLICATE_REQUIREMENT_CODE]
        distinguishing_aspect: "Three separate uniqueness scopes share priority 7 but keep distinct error ids: a repeated tax_id, a repeated solicitation_number, and a requirement_code repeated inside one solicitation's mandatory_requirements array."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; one Vendor with tax_id 100000060 and one Solicitation numbered SOL-2238-C29 already exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
