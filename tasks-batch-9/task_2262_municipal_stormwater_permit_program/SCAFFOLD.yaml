# =============================================================================
# §1.6 Error Code Catalog — 73 codes, every one triggerable from §1.5
# =============================================================================
errors:

  - id: ERR_MISSING_USER_ID
    http_status: 401
    condition: "X-User-ID header absent or unknown"
    applies_to: [all]

  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "the actor's role is not listed in the endpoint's roles"
    applies_to: [all]

  - id: ERR_VALIDATION
    http_status: 400
    condition: "missing required body field, wrong type, unknown enum member, out-of-range number, malformed ISO 8601 value, term_end_date not after term_start_date, disturbed_acres below 1.00, requested_credit_pct outside (0.0000, 0.5000], weight outside 1..5, inspection period_end before period_start, tmdl_applicable true without tmdl_pollutant or tmdl_wla_lb_per_year, limit outside 1..100 or negative offset"
    applies_to: [all]

  - id: ERR_PERMIT_TERM_NOT_FOUND
    http_status: 404
    condition: "no PermitTerm with the supplied id"
    applies_to: ["GET /stormwater/permit-terms/{id}", "POST /stormwater/permit-terms/{id}/activate", "POST /stormwater/permit-terms/{id}/expire", "POST /stormwater/permit-terms/{id}/billing-runs", "GET /stormwater/permit-terms/{id}/control-measures", "GET /stormwater/permit-terms/{id}/outfalls", "GET /stormwater/permit-terms/{id}/construction-sites", "GET /stormwater/permit-terms/{id}/accounts", "GET /stormwater/permit-terms/{id}/annual-reports", "POST /stormwater/control-measures", "POST /stormwater/outfalls", "POST /stormwater/construction-sites", "POST /stormwater/accounts", "POST /stormwater/annual-reports"]

  - id: ERR_CONTROL_MEASURE_NOT_FOUND
    http_status: 404
    condition: "no ControlMeasure with the supplied id"
    applies_to: ["GET /stormwater/control-measures/{id}", "POST /stormwater/control-measures/{id}/report-progress", "POST /stormwater/control-measures/{id}/retire"]

  - id: ERR_OUTFALL_NOT_FOUND
    http_status: 404
    condition: "no Outfall with the supplied id"
    applies_to: ["GET /stormwater/outfalls/{id}", "POST /stormwater/outfalls/{id}/retire", "POST /stormwater/outfalls/{id}/observations", "GET /stormwater/outfalls/{id}/observations", "POST /stormwater/outfalls/{id}/sweeping-runs", "POST /stormwater/outfalls/{id}/load-assessments"]

  - id: ERR_OBSERVATION_NOT_FOUND
    http_status: 404
    condition: "no OutfallObservation with the supplied id"
    applies_to: ["POST /stormwater/observations/{id}/validate"]

  - id: ERR_CASE_NOT_FOUND
    http_status: 404
    condition: "no IllicitDischargeCase with the supplied id"
    applies_to: ["GET /stormwater/illicit-discharge-cases/{id}", "POST /stormwater/illicit-discharge-cases/{id}/start-tracing", "POST /stormwater/illicit-discharge-cases/{id}/identify-source", "POST /stormwater/illicit-discharge-cases/{id}/reopen-tracing", "POST /stormwater/illicit-discharge-cases/{id}/resolve", "POST /stormwater/enforcement-actions"]

  - id: ERR_CONSTRUCTION_SITE_NOT_FOUND
    http_status: 404
    condition: "no ConstructionSite with the supplied id"
    applies_to: ["GET /stormwater/construction-sites/{id}", "POST /stormwater/construction-sites/{id}/submit-esc-plan", "POST /stormwater/construction-sites/{id}/esc-review", "POST /stormwater/construction-sites/{id}/stop-work", "POST /stormwater/construction-sites/{id}/release-stop-work", "POST /stormwater/construction-sites/{id}/close", "GET /stormwater/construction-sites/{id}/post-construction-facilities", "POST /stormwater/post-construction-facilities", "POST /stormwater/inspections", "POST /stormwater/enforcement-actions"]

  - id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    condition: "no PostConstructionFacility with the supplied id"
    applies_to: ["GET /stormwater/post-construction-facilities/{id}", "POST /stormwater/post-construction-facilities/{id}/record-agreement", "POST /stormwater/inspections", "POST /stormwater/enforcement-actions", "POST /stormwater/fee-credit-applications"]

  - id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    condition: "no Inspection with the supplied id"
    applies_to: ["GET /stormwater/inspections/{id}", "POST /stormwater/inspections/{id}/findings", "POST /stormwater/inspections/{id}/finalize", "POST /stormwater/enforcement-actions"]

  - id: ERR_ENFORCEMENT_ACTION_NOT_FOUND
    http_status: 404
    condition: "no EnforcementAction with the supplied id"
    applies_to: ["GET /stormwater/enforcement-actions/{id}", "POST /stormwater/enforcement-actions/{id}/escalate", "POST /stormwater/enforcement-actions/{id}/close", "POST /stormwater/enforcement-actions/{id}/rescind"]

  - id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    condition: "no StormwaterAccount with the supplied id"
    applies_to: ["GET /stormwater/accounts/{id}", "POST /stormwater/accounts/{id}/impervious-updates", "POST /stormwater/fee-credit-applications"]

  - id: ERR_CREDIT_APPLICATION_NOT_FOUND
    http_status: 404
    condition: "no FeeCreditApplication with the supplied id"
    applies_to: ["GET /stormwater/fee-credit-applications/{id}", "POST /stormwater/fee-credit-applications/{id}/review", "POST /stormwater/fee-credit-applications/{id}/resubmit", "POST /stormwater/fee-credit-applications/{id}/revoke"]

  - id: ERR_ANNUAL_REPORT_NOT_FOUND
    http_status: 404
    condition: "no AnnualReport with the supplied id"
    applies_to: ["GET /stormwater/annual-reports/{id}", "POST /stormwater/annual-reports/{id}/compile", "POST /stormwater/annual-reports/{id}/certify", "POST /stormwater/annual-reports/{id}/submit"]

  - id: ERR_DUPLICATE_PERMIT_NUMBER
