              as: Member
              as_user_id: "${m_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", dog_id: "${d2_id}" }
              as: Member
              as_user_id: "${m_id}"
