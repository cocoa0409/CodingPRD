            - "${err_inscope} == ERR_BOUNDARY_SCOPE_MISMATCH with HTTP status 422"
            - "GET /soc/boundary-components?system_description_id=${sd} returns total_count == 0"
            - "SystemDescription.${sd}.in_scope_component_count == 0"

      - name: corner_locked_boundary_rejects_new_components
        claim_type: conditional_validation
        grounds: ["validations[priority=220]", "errors[ERR_BOUNDARY_LOCKED]", "entities.SystemDescription.fields.boundary_locked"]
        distinguishing_aspect: "Once lock-boundary has run, POST /soc/boundary-components against that description returns 409 ERR_BOUNDARY_LOCKED and in_scope_component_count stays at 1."
        test_recipe:
          setup:
