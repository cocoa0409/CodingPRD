# =============================================================================
# §1.8 Scaffold Difficulty Design — Task 1908 Insider Trading Window & Preclearance
# Nine Difficulty Rules x 2 instances each. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and is directly transcribable into a pytest fixture.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: approval_validity_provisional_vs_final
        grounds:
          - calculations.preclearance_validity_check
          - state_machines.PreclearanceRequest.APPROVED_to_VOIDED
          - state_machines.BlackoutWindow.SCHEDULED_to_ACTIVE
        distinguishing_aspect: |
          Entity domain PreclearanceRequest: the PROVISIONAL variant approves the request
          against the blackout calendar known at decided_at, while the FINAL variant —
          evaluating only windows with created_at > decided_at — voids the same approval
          when a later-created window activates over the identical proposed trade date.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; insider is policy/training current; no blackout windows exist"
            - "Request for ACME BUY 100 proposed 2026-08-02T00:00:00Z is APPROVED at 2026-08-01T00:00:00Z (valid_until 2026-08-03T00:00:00Z)"
            - "An EVENT_DRIVEN window for ACME [2026-08-01T12:00:00Z, 2026-08-04T00:00:00Z) is created at 2026-08-01T06:00:00Z (after decided_at) and activated by sweep"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer One", email: "officer1@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Insider A", email: "insider_a@x.com", designation: "EMPLOYEE", department: "Engineering" }
              as: LegalAdmin
              captures: { person_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { ack_id: $.data.id }
            - call: "POST /attestations/${ack_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /preclearance-requests"
              payload: { covered_person_id: "${person_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 100, proposed_trade_date: "2026-08-02T00:00:00Z" }
              as: Insider
              as_user_id: "${person_id}"
              captures: { req_id: $.data.id }
            - call: "POST /preclearance-requests/${req_id}/review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { req_v2: $.data.version }
            - call: "POST /preclearance-requests/${req_id}/decision"
              payload: { outcome: "APPROVE", expected_preclearance_version: "${req_v2}" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: LegalAdmin
            - call: "POST /blackout-windows"
              payload: { kind: "EVENT_DRIVEN", security_ticker: "ACME", start_at: "2026-08-01T12:00:00Z", end_at: "2026-08-04T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { win_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /compliance-sweeps"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /trade-confirmations"
              payload: { covered_person_id: "${person_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 100, price: 10.00, trade_date: "2026-08-02T00:00:00Z", broker_ref: "BR-D1" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { conf_id: $.data.id }
          assert:
            - "PreclearanceRequest.${req_id}.status == VOIDED (final variant voided the provisional approval)"
            - "PreclearanceRequest.${req_id}.approval_valid_until == 2026-08-03T00:00:00Z (provisional variant had approved with decided_at + 48h)"
            - "TradeConfirmation.${conf_id}.status == FLAGGED"
            - "TradeConfirmation.${conf_id}.flagged_reason == BLACKOUT_TRADE"

      - name: cooling_off_end_executive_vs_standard
        grounds:
          - calculations.cooling_off_end
          - entities.TenB5Plan.fields.cooling_off_end
        distinguishing_aspect: |
          Entity domain TenB5Plan: with identical approved_at (2026-08-01T00:00:00Z) and an
          identical containing quarterly window, the EXECUTIVE variant yields
          cooling_off_end 2026-11-17T00:00:00Z (max(approved+90d, window_end+2d)) while the
          STANDARD variant yields 2026-08-31T00:00:00Z (approved+30d) — different entity
          domain than approval_validity_provisional_vs_final.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; QUARTERLY window [2026-07-15, 2026-11-15) exists containing approval time"
            - "Two owners: exec (SECTION_16_OFFICER) and std (EMPLOYEE), both policy/training current"
            - "Each owns an APPROVED plan for ACME approved at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer Two", email: "officer2@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Exec E", email: "exec_e@x.com", designation: "SECTION_16_OFFICER", department: "Executive" }
              as: LegalAdmin
              captures: { exec_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Std S", email: "std_s@x.com", designation: "EMPLOYEE", department: "Sales" }
              as: LegalAdmin
              captures: { std_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${exec_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { exec_ack: $.data.id }
            - call: "POST /attestations/${exec_ack}/complete"
              payload: {}
              as: Insider
              as_user_id: "${exec_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${exec_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { exec_trn: $.data.id }
            - call: "POST /attestations/${exec_trn}/complete"
              payload: {}
              as: Insider
              as_user_id: "${exec_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${std_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { std_ack: $.data.id }
            - call: "POST /attestations/${std_ack}/complete"
              payload: {}
              as: Insider
              as_user_id: "${std_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${std_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { std_trn: $.data.id }
            - call: "POST /attestations/${std_trn}/complete"
              payload: {}
              as: Insider
              as_user_id: "${std_id}"
            - call: "POST /blackout-windows"
              payload: { kind: "QUARTERLY", fiscal_year: 2026, fiscal_quarter: "Q3", start_at: "2026-07-15T00:00:00Z", end_at: "2026-11-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "GET /covered-persons/${exec_id}"
              payload: {}
              as: LegalAdmin
              captures: { exec_v: $.data.version }
            - call: "GET /covered-persons/${std_id}"
              payload: {}
              as: LegalAdmin
              captures: { std_v: $.data.version }
            - call: "POST /tenb5-plans"
              payload: { covered_person_id: "${exec_id}", security_ticker: "ACME", total_quantity: 500, first_trade_date: "2026-12-01T00:00:00Z", expected_covered_person_version: "${exec_v}" }
              as: Insider
              as_user_id: "${exec_id}"
              captures: { exec_plan: $.data.id }
            - call: "POST /tenb5-plans/${exec_plan}/submit"
              payload: {}
              as: Insider
              as_user_id: "${exec_id}"
            - call: "POST /tenb5-plans/${exec_plan}/decision"
              payload: { outcome: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /tenb5-plans"
              payload: { covered_person_id: "${std_id}", security_ticker: "ACME", total_quantity: 500, first_trade_date: "2026-12-01T00:00:00Z", expected_covered_person_version: "${std_v}" }
              as: Insider
              as_user_id: "${std_id}"
              captures: { std_plan: $.data.id }
            - call: "POST /tenb5-plans/${std_plan}/submit"
              payload: {}
              as: Insider
              as_user_id: "${std_id}"
            - call: "POST /tenb5-plans/${std_plan}/decision"
              payload: { outcome: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "GET /tenb5-plans/${exec_plan}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "GET /tenb5-plans/${std_plan}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          assert:
            - "TenB5Plan.${exec_plan}.cooling_off_end == 2026-11-17T00:00:00Z (max(2026-08-01 + 90d, 2026-11-15 + 2d))"
            - "TenB5Plan.${std_plan}.cooling_off_end == 2026-08-31T00:00:00Z (2026-08-01 + 30d)"
            - "TenB5Plan.${exec_plan}.approved_at == TenB5Plan.${std_plan}.approved_at == 2026-08-01T00:00:00Z"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: sanction_severity_multi_input_scoring
        grounds:
          - calculations.sanction_severity_score
          - state_machines.ViolationCase.UNDER_INVESTIGATION_to_SUBSTANTIATED
        distinguishing_aspect: |
          Mode (a) — a >=3-input formula with non-linear interaction: base points per
          violation_type + 15 x repeat_count + tiered value_band_bonus + conditional
          designation_bonus, capped by min(100, ...), then banded into sanction tiers.
          Computed literal: NO_PRECLEARANCE(25) + 0 + 10 (trade_value 40000 in [25000,100000))
          + 0 (EMPLOYEE) = 35 -> SUSPENSION_30D.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; subject is EMPLOYEE with no prior cases"
            - "A confirmation of 400 shares at price 100.00 (trade_value 40000.00) is FLAGGED and auto-opens a case"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer Three", email: "officer3@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Subject B", email: "subject_b@x.com", designation: "EMPLOYEE", department: "Finance" }
              as: LegalAdmin
              captures: { subject_id: $.data.id }
            - call: "POST /trade-confirmations"
              payload: { covered_person_id: "${subject_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 400, price: 100.00, trade_date: "2026-08-01T10:00:00Z", broker_ref: "BR-D3" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { conf_id: $.data.id }
            - call: "GET /violation-cases"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { case_id: "$.data[0].id" }
            - call: "POST /violation-cases/${case_id}/action"
              payload: { action: "BEGIN_INVESTIGATION" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /violation-cases/${case_id}/action"
              payload: { action: "SUBSTANTIATE" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /violation-cases/${case_id}/action"
              payload: { action: "RECORD_SANCTION" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          assert:
            - "ViolationCase.${case_id}.severity_score == 35"
            - "ViolationCase.${case_id}.sanction == SUSPENSION_30D"
            - "ViolationCase.${case_id}.status == SANCTION_RECORDED"
            - "CoveredPerson.${subject_id}.status == SUSPENDED"
            - "CoveredPerson.${subject_id}.suspended_until == 2026-08-31T00:00:00Z"

      - name: matched_quantity_per_line_rounding_order
        grounds:
          - calculations.matched_quantity_consumption
          - state_machines.TradeConfirmation.RECEIVED_to_MATCHED_PRECLEARANCE
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the pinned rule rounds each
          confirmation's applied quantity to 2dp (round_half_up) BEFORE accumulating, so two
          confirmations of 10.005 consume 10.01 + 10.01 = 20.02 and CLOSE the 20.02 request;
          sum-then-round would accumulate 20.01 and leave remaining_quantity 0.01 with the
          request still APPROVED. Different mode than sanction_severity_multi_input_scoring (a).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; insider policy/training current"
            - "APPROVED request ACME BUY quantity 20.02, decided_at 2026-08-01T00:00:00Z, valid_until 2026-08-03T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer Four", email: "officer4@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Insider C", email: "insider_c@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { person_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { ack_id: $.data.id }
            - call: "POST /attestations/${ack_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /preclearance-requests"
              payload: { covered_person_id: "${person_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 20.02, proposed_trade_date: "2026-08-02T00:00:00Z" }
              as: Insider
              as_user_id: "${person_id}"
              captures: { req_id: $.data.id }
            - call: "POST /preclearance-requests/${req_id}/review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { req_v2: $.data.version }
            - call: "POST /preclearance-requests/${req_id}/decision"
              payload: { outcome: "APPROVE", expected_preclearance_version: "${req_v2}" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /trade-confirmations"
              payload: { covered_person_id: "${person_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 10.005, price: 50.00, trade_date: "2026-08-02T00:00:00Z", broker_ref: "BR-D4-1" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { conf1_id: $.data.id }
            - call: "POST /trade-confirmations"
              payload: { covered_person_id: "${person_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 10.005, price: 50.00, trade_date: "2026-08-02T00:00:00Z", broker_ref: "BR-D4-2" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { conf2_id: $.data.id }
          assert:
            - "TradeConfirmation.${conf1_id}.status == MATCHED_PRECLEARANCE"
            - "TradeConfirmation.${conf2_id}.status == MATCHED_PRECLEARANCE"
            - "PreclearanceRequest.${req_id}.matched_quantity == 20.02 (per-line round_half_up then accumulate)"
            - "PreclearanceRequest.${req_id}.remaining_quantity == 0"
            - "PreclearanceRequest.${req_id}.status == CLOSED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: tenb5_plan_revision_and_suspend_resume_cycles
        grounds:
          - state_machines.TenB5Plan.RETURNED_to_SUBMITTED
          - state_machines.TenB5Plan.ACTIVE_to_SUSPENDED
          - state_machines.TenB5Plan.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Entity TenB5Plan: the machine is cyclic — RETURNED -> SUBMITTED revision loop and
          ACTIVE -> SUSPENDED -> ACTIVE suspension cycle — not a linear pipeline. Distinct
          entity from the ViolationCase machine in violation_case_escalation_and_fork.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; owner EMPLOYEE policy/training current; no quarterly window containing 2026-08-01"
            - "Plan for ACME traverses DRAFT -> SUBMITTED -> RETURNED -> SUBMITTED -> APPROVED -> ACTIVE -> SUSPENDED -> ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer Five", email: "officer5@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Insider D", email: "insider_d@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { person_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { ack_id: $.data.id }
            - call: "POST /attestations/${ack_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "GET /covered-persons/${person_id}"
              payload: {}
              as: LegalAdmin
              captures: { person_v: $.data.version }
            - call: "POST /tenb5-plans"
              payload: { covered_person_id: "${person_id}", security_ticker: "ACME", total_quantity: 300, first_trade_date: "2026-09-01T00:00:00Z", expected_covered_person_version: "${person_v}" }
              as: Insider
              as_user_id: "${person_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /tenb5-plans/${plan_id}/submit"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /tenb5-plans/${plan_id}/decision"
              payload: { outcome: "RETURN", return_note: "fix trade dates" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /tenb5-plans/${plan_id}/submit"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /tenb5-plans/${plan_id}/decision"
              payload: { outcome: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /compliance-sweeps"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /tenb5-plans/${plan_id}/action"
              payload: { action: "SUSPEND" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /tenb5-plans/${plan_id}/action"
              payload: { action: "RESUME" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          assert:
            - "TenB5Plan.${plan_id} reached RETURNED after first decision (revision loop entered)"
            - "TenB5Plan.${plan_id} reached SUBMITTED again after re-submit (cycle RETURNED -> SUBMITTED)"
            - "TenB5Plan.${plan_id}.cooling_off_end == 2026-08-31T00:00:00Z and sweep moved it APPROVED -> ACTIVE"
            - "TenB5Plan.${plan_id}.status == ACTIVE after SUSPEND then RESUME (cycle completed)"

      - name: violation_case_escalation_and_fork
        grounds:
          - state_machines.ViolationCase.UNDER_INVESTIGATION_to_ESCALATED
          - state_machines.ViolationCase.ESCALATED_to_UNDER_INVESTIGATION
          - state_machines.ViolationCase.UNFOUNDED_to_CLOSED
        distinguishing_aspect: |
          Entity ViolationCase: the machine combines a cycle (UNDER_INVESTIGATION ->
          ESCALATED -> UNDER_INVESTIGATION) with a branch fork — SUBSTANTIATED computes a
          severity score while UNFOUNDED -> CLOSE clears the linked confirmation — divergent
          side-effect sets per branch. Distinct entity from tenb5_plan_revision_and_suspend_resume_cycles.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; subject EMPLOYEE; two unmatched confirmations each auto-open a case"
            - "case1 cycles through escalation and is SUBSTANTIATED; case2 takes the UNFOUNDED fork and clears its confirmation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer Six", email: "officer6@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Subject E", email: "subject_e@x.com", designation: "EMPLOYEE", department: "Finance" }
              as: LegalAdmin
              captures: { subject_id: $.data.id }
            - call: "POST /trade-confirmations"
              payload: { covered_person_id: "${subject_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 10, price: 10.00, trade_date: "2026-08-01T10:00:00Z", broker_ref: "BR-D6-1" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { conf1_id: $.data.id }
            - call: "POST /trade-confirmations"
              payload: { covered_person_id: "${subject_id}", security_ticker: "BETA", trade_side: "SELL", quantity: 5, price: 20.00, trade_date: "2026-08-01T11:00:00Z", broker_ref: "BR-D6-2" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { conf2_id: $.data.id }
            - call: "GET /violation-cases"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { case1_id: "$.data[0].id", case2_id: "$.data[1].id" }
            - call: "POST /violation-cases/${case1_id}/action"
              payload: { action: "BEGIN_INVESTIGATION" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /violation-cases/${case1_id}/action"
              payload: { action: "ESCALATE" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /violation-cases/${case1_id}/action"
              payload: { action: "DEESCALATE" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /violation-cases/${case1_id}/action"
              payload: { action: "SUBSTANTIATE" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /violation-cases/${case2_id}/action"
              payload: { action: "BEGIN_INVESTIGATION" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /violation-cases/${case2_id}/action"
              payload: { action: "UNFOUND" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
            - call: "POST /violation-cases/${case2_id}/action"
              payload: { action: "CLOSE" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          assert:
            - "ViolationCase.${case1_id}.status == SUBSTANTIATED after the ESCALATED -> UNDER_INVESTIGATION cycle"
            - "ViolationCase.${case1_id}.severity_score == 25 (NO_PRECLEARANCE base 25, value 100 below band, EMPLOYEE, no repeats)"
            - "ViolationCase.${case2_id}.status == CLOSED via the UNFOUNDED fork"
            - "TradeConfirmation.${conf2_id}.status == CLEARED (UNFOUNDED-branch side effect; not fired on the SUBSTANTIATED branch)"

