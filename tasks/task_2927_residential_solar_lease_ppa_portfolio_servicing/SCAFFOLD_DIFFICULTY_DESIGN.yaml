      - name: prepayment_close_cascades_to_ucc_termination_and_child_write_lockout
        grounds:
          - state_machines.TransferCase.TITLE_CLEARED_to_CLOSED
          - state_machines.SolarAgreement.TRANSFER_PENDING_to_PREPAID_CLOSED
          - state_machines.UccFiling.TERMINATION_REQUESTED_to_TERMINATED
          - calculations.transfer_payoff_quote
          - calculations.credit_ledger_invariant
