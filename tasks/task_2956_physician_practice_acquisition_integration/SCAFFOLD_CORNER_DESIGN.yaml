          - validations[priority=42]
        excluded_because:
          difficulty_instance: provider_based_conversion_requires_medicare_contract_novated
          rationale: |
            That §1.8 cross-entity instance already exercises the conditional form of
            this action end to end: the CONVERTED request is refused with
            ERR_PAYER_NOVATION_INCOMPLETE while the MEDICARE contract is short of
            NOVATED and succeeds once it arrives, with the FREESTANDING_CLINIC variant
            shown to be exempt. A corner test would issue the same two calls.

  # ===========================================================================
  # Section 6 — Errors (§1.6)
  #
  # Every error id in the §1.6 catalog must be triggerable. The ids not raised
  # by a §1.8 instance or by an earlier section of this file are driven here.
  # ===========================================================================
  - section: errors
    instances:
      - name: duplicate_npi_across_two_acquisitions_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_DUPLICATE_NPI]
          - validations[priority=7]
        distinguishing_aspect: |
          National Provider Identifiers are unique globally rather than per deal, so the
          same npi cannot be registered on a second acquisition even though the two
          acquisitions share nothing else — the guard is not scoped by acquisition_id
          the way task codes and batch labels are.
        test_recipe:
          setup:
            - "Two Acquisitions in deal_status SOURCING; the first already has a Physician with npi 1548392017."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_a_id: "$.data.id" }
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Northgate Cardiology Associates", specialty: "CARDIOLOGY", structure: "EQUITY", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 9600000, trailing_annual_collections_cents: 900000000, target_close_on: "2026-12-01", required_staff_headcount: 8, retention_pool_total_cents: 6000000, escrow_total_cents: 20000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_b_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_a_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_a_id: "$.data.id" }
          trigger:
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_b_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "CARDIOLOGY", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response error_id == ERR_DUPLICATE_NPI with HTTP 409"
            - "GET /physicians with acquisition_id ${acq_b_id} reports total_count == 0"
            - "Physician.${phys_a_id} is untouched and still carries employment_status PROSPECTIVE"
            - "the same body with npi 1962037481 succeeds on ${acq_b_id} with HTTP 201"

      - name: duplicate_batch_label_within_one_acquisition_rejected
