  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_create_blocked_until_park_state_is_open
        grounds:
          - validations[priority=28]
          - state_machines.Park.SEASONAL_CLOSED_to_OPEN
          - errors[ERR_PARK_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Reservation -> Park: an operation on Reservation is gated on the state of a
          Park row. A park is created in SEASONAL_CLOSED, so a byte-identical booking is rejected
          with 422 ERR_PARK_NOT_OPEN before the season opening and accepted after it, with nothing
          about the booking itself changing.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "One ACTIVE PRESIDENT membership"
            - "One CLASS_B park with 40 sites and 60% member allocation, freshly created and therefore still in SEASONAL_CLOSED, season 2026-01-05 to 2026-12-20"
