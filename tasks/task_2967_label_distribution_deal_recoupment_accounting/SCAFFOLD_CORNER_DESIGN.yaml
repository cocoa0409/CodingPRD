            - "the report status is \"SUBMITTED\" and the deal's net_receipts_to_date_cents is still 0 — pricing a report does not book receipts"

      - name: rate_card_window_is_evaluated_at_period_end_not_at_the_clock
        claim_type: input_set_filtering
        grounds:
