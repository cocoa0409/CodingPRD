            - call: "POST /registry-cases/${k1}/abstractions"
              payload: { expected_case_version: "${k1_v}", iss_abstracted: 26, gcs_arrival: 9, mechanism_code: "FALL", ed_departure_at: "2026-07-20T07:00:00Z" }
              as: RegistryAbstractor
