  - rule_id: transitive_cascade
    instances:
      - name: utility_allowance_apply_propagates_through_property_certifications_households_into_the_monthly_voucher
        grounds:
          - state_machines.UtilityAllowanceAnalysis.APPROVED_to_APPLIED
          - calculations.utility_allowance_adjustment
          - calculations.tenant_rent_recalculation
          - calculations.monthly_voucher_hap_request
          - entities.Property.fields.current_utility_allowance_cents
          - entities.TenantCertification.fields.hap_cents
          - entities.TenantHousehold.fields.current_hap_cents
