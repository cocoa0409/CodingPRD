      - name: capital_call_partial_full_funded_bubbling
        grounds:
          - state_machines.CapitalCall
          - state_machines.CapitalCallContribution
        distinguishing_aspect: |
          CapitalCall uses a compound/aggregate shape: parent state is
          derived from child contribution states. ISSUED -> PARTIALLY_FUNDED
          fires when at least one contribution reaches ESCROW_RECEIVED while
          others remain pending; PARTIALLY_FUNDED -> FULLY_FUNDED fires only
