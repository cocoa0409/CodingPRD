      - name: validation_second_launch_plan_for_same_product_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_LAUNCH_ALREADY_ALLOCATED]", entities.Product.fields.launch_status]
        distinguishing_aspect: "A launch allocation may be planned once per product: the first plan moves launch_status to ALLOCATED and a second plan for the same product is refused with ERR_LAUNCH_ALREADY_ALLOCATED 409."
