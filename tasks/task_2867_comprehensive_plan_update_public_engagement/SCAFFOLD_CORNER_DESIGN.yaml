            - call: "POST /planning/inventory-datasets/${inv_hou}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/inventory-datasets/${inv_emp}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/inventory-datasets/${inv_lu}/certify"
