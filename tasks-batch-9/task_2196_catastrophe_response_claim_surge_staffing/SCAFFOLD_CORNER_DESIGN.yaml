            - "after trigger call 1, CatastropheEvent.${ev}.status == DECLARED"
            - "trigger call 2 response HTTP status == 200 and response.data.status == ACTIVE"
            - "trigger call 3 response HTTP status == 409 and response.data.error_id == ERR_LOSS_ESTIMATE_STALE   # only the snapshot gate is left failing"
            - "CatastropheEvent.${ev}.status == DECLARED and posture == OPEN"
            - "GET /loss-estimates?event_id=${ev} returns meta.total_count == 1, row 0 id == ${les}, input_reserve_sequence_high_water == 0, stale == true"
            - "GET /housing-blocks?event_id=${ev}&status=ACTIVE returns meta.total_count == 1"
