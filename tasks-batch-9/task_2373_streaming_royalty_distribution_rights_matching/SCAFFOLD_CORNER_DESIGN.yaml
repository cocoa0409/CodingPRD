scaffold_corner_design:
  - section: entities
    instances:
      - name: rights_holder_create_returns_declared_fields_and_zero_counters
        claim_type: creation
        grounds:
          - entities.RightsHolder
          - endpoints.POST_/royalties/rights-holders
          - response_envelope.success
        distinguishing_aspect: |
          A freshly created RightsHolder carries every declared field, its two computed money
          counters start at 0 (not null), and the success envelope has response_type "object" with
          a meta.api_request_id — no field is silently dropped from the create response.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
              captures: { h: "$.data.id", bal: "$.data.receivable_balance_cents", cnt: "$.data.issued_statement_count" }
            - call: "GET /royalties/rights-holders/${h}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { name2: "$.data.legal_name", type2: "$.data.holder_type", terr2: "$.data.home_territory_code", rate2: "$.data.direct_deal_rate_bps" }
          assert:
            - "HTTP 201; response_type is \"object\"; meta.api_request_id and meta.api_request_timestamp are present."
            - "legal_name Northbeam Records, holder_type LABEL, home_territory_code GB, direct_deal_rate_bps 800 all echo the input."
            - "receivable_balance_cents is 0 and issued_statement_count is 0 — computed counters start at zero, not null."
            - "id, created_at, updated_at and version are present (common_fields: true) and version is 1."
            - "The subsequent GET returns byte-identical business field values, readable by RightsOpsAnalyst as well as RoyaltyAdmin."

      - name: work_normalization_fields_are_computed_from_title_and_artist
        claim_type: computed_fields
        grounds:
          - entities.Work.fields.normalized_title
          - entities.Work.fields.normalized_artist
          - entities.Work.fields.rights_state
          - entities.Work.fields.approved_master_share_bps
        distinguishing_aspect: |
          normalized_title lowercases, strips every character outside [a-z0-9 ], collapses runs of
          spaces and trims — so "  MIDNIGHT   LEDGER!! " becomes exactly "midnight ledger" (not
          "midnight  ledger", not " midnight ledger", not "midnightledger"), and the same rule
          applied to artist_credit yields "the reconcilers".
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "  MIDNIGHT   LEDGER!! ", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { w: "$.data.id", nt: "$.data.normalized_title", na: "$.data.normalized_artist", rs: "$.data.rights_state", ms: "$.data.approved_master_share_bps" }
          assert:
            - "normalized_title is exactly \"midnight ledger\" — 15 characters, single interior space, no leading or trailing space, no punctuation."
            - "normalized_artist is exactly \"the reconcilers\"."
            - "title and artist_credit are stored unchanged as \"  MIDNIGHT   LEDGER!! \" and \"The Reconcilers\" — normalization does not overwrite the reported values."
            - "rights_state is UNMATCHED and approved_master_share_bps is 0 on a work with no registrations."

      - name: work_optional_inputs_omitted_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Work.fields.artist_credit
          - entities.Work.fields.linked_work_id
          - entities.Work.fields.provisional_match_by_user_id
          - endpoints.POST_/royalties/works
        distinguishing_aspect: |
          artist_credit and linked_work_id are the only optional inputs on POST /royalties/works;
          omitting both must leave normalized_artist null (not the empty string) and
          provisional_match_by_user_id null, while rights_state still defaults to UNMATCHED.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /royalties/works"
              payload: { work_type: "COMPOSITION", identifier: "T9001234567", title: "Midnight Ledger" }
              as: RightsOpsAnalyst
              captures: { w: "$.data.id", na: "$.data.normalized_artist", lw: "$.data.linked_work_id", pm: "$.data.provisional_match_by_user_id", rs: "$.data.rights_state" }
          assert:
            - "HTTP 201; artist_credit is null, normalized_artist is null (not \"\"), linked_work_id is null, provisional_match_by_user_id is null."
            - "normalized_title is \"midnight ledger\" — computed for COMPOSITION rows too."
            - "rights_state is UNMATCHED and approved_master_share_bps is 0."

      - name: usage_batch_counters_default_to_zero_on_creation
        claim_type: defaults
        grounds:
          - entities.UsageBatch
          - state_machines.UsageBatch.initial_state
          - endpoints.POST_/royalties/usage-batches
        distinguishing_aspect: |
          A new UsageBatch reports status OPEN and all five counters at 0 — line_count,
          total_play_count, matched_play_count, unmatched_play_count and disputed_play_count —
          before any line is appended.
        test_recipe:
          setup:
            - "One OPEN AccountingPeriod."
          setup_api_calls:
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id", pstatus: "$.data.status", cw: "$.data.claim_window_closes_at" }
          trigger:
            - call: "POST /royalties/usage-batches"
              payload: { period_id: "${per}", source_label: "UK client feed" }
              as: RightsOpsAnalyst
              captures: { ub: "$.data.id", st: "$.data.status", lc: "$.data.line_count", tp: "$.data.total_play_count", mp: "$.data.matched_play_count", up: "$.data.unmatched_play_count", dp: "$.data.disputed_play_count" }
          assert:
            - "The period was created with status OPEN and claim_window_closes_at 2026-08-29T00:00:00Z (usage_end 2026-06-30 at midnight plus CLAIM_WINDOW_DAYS 60)."
            - "The batch is created with status OPEN and line_count, total_play_count, matched_play_count, unmatched_play_count, disputed_play_count all exactly 0."
            - "period_id echoes the parent period id and source_label echoes \"UK client feed\"."

      - name: work_create_extra_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Work.fields.normalized_title
          - entities.Work.fields.rights_state
          - endpoints.POST_/royalties/works
        distinguishing_aspect: |
          id, created_at, version and the computed fields normalized_title / rights_state /
          approved_master_share_bps are server-owned: supplying them in the create body must not
          influence the stored row, so a client-supplied rights_state of REGISTERED and a
          client-supplied normalized_title of "zzz" are both discarded.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger", id: "deadbeef-0000-4000-8000-000000000001", created_at: "1999-01-01T00:00:00Z", version: 77, normalized_title: "zzz", rights_state: "REGISTERED", approved_master_share_bps: 9999 }
              as: RightsOpsAnalyst
              captures: { w: "$.data.id", nt: "$.data.normalized_title", rs: "$.data.rights_state", ms: "$.data.approved_master_share_bps" }
          assert:
            - "HTTP 201 — unknown and server-owned keys are ignored, not rejected."
            - "The returned id is NOT deadbeef-0000-4000-8000-000000000001, created_at is the logical clock value 2026-08-01T00:00:00Z (not 1999-01-01T00:00:00Z), and version is 1 (not 77)."
            - "normalized_title is \"midnight ledger\" (not \"zzz\"), rights_state is UNMATCHED (not REGISTERED), approved_master_share_bps is 0 (not 9999)."

      - name: registration_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_4
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/royalties/rights-registrations
        distinguishing_aspect: |
          share_bps has no default and is not optional on POST /royalties/rights-registrations, so
          omitting it is a structural failure (ERR_INVALID_REQUEST at priority 4) and not a
          business failure — the row must not be created even though every FK resolves.
        test_recipe:
          setup:
            - "One LABEL holder and one RECORDING work; the work's version is captured for the OCC field."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
              captures: { lbl: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { w1: "$.data.id" }
            - call: "GET /royalties/works/${w1}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { w1v: "$.data.version" }
          trigger:
            - name: registration_missing_required_share_bps_rejected
              call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w1}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", territory_set: ["GB"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${w1v}" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { err: "$.data.error_id", msg: "$.data.message" }
            - call: "GET /royalties/rights-registrations"
              payload: { work_id: "${w1}" }
              as: RightsOpsAnalyst
              captures: { page: "$.data" }
          assert:
            - "HTTP 422 with response_type \"error\" and error_id ERR_INVALID_REQUEST; data.message is present."
            - "GET /royalties/rights-registrations?work_id=<w1> returns an empty list — no partial row was persisted."
            - "The work's version is still the value captured before the call: a rejected create does not bump the parent."

      - name: usage_line_enum_outside_domain_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations.priority_4
          - entities.UsageLine.fields.subscription_tier
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          subscription_tier is an enum; a value outside the declared domain fails at priority 4
          before any batch-state or play-count business rule is consulted, so the batch's
          line_count stays 0 even though the batch is OPEN and would accept a valid line.
        test_recipe:
          setup:
            - "One OPEN period with one OPEN usage batch and no lines."
          setup_api_calls:
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - call: "POST /royalties/usage-batches"
              payload: { period_id: "${per}", source_label: "UK client feed" }
              as: RightsOpsAnalyst
              captures: { ub: "$.data.id" }
          trigger:
            - name: usage_line_with_unknown_tier_rejected
              call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_title: "Midnight Ledger", territory_code: "GB", subscription_tier: "PLATINUM", play_count: 100000 }
              as: RightsOpsAnalyst
              captures: { err: "$.data.error_id" }
            - call: "GET /royalties/usage-batches/${ub}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { lc: "$.data.line_count", tp: "$.data.total_play_count" }
          assert:
            - "HTTP 422 with error_id ERR_INVALID_REQUEST."
            - "The batch still reports line_count 0 and total_play_count 0."
            - "The batch status is still OPEN — a rejected line append is not a state transition."

      - name: registration_share_bps_out_of_range_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations.priority_4
          - entities.RightsRegistration.fields.share_bps
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          share_bps is constrained to 1..10000 inclusive at priority 4, so 0 and 10001 are both
          structural failures at create time — they never reach the priority-22 aggregate check,
          which only runs at approve.
        test_recipe:
          setup:
            - "One LABEL holder and one RECORDING work with its version captured."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
              captures: { lbl: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { w1: "$.data.id" }
            - call: "GET /royalties/works/${w1}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { w1v: "$.data.version" }
          trigger:
            - name: registration_with_zero_share_bps_rejected
              call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w1}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 0, territory_set: ["GB"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${w1v}" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { err: "$.data.error_id" }
            - name: registration_with_share_bps_above_10000_rejected
              call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w1}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 10001, territory_set: ["GB"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${w1v}" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { err2: "$.data.error_id" }
            - name: registration_with_empty_territory_set_rejected
              call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w1}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 10000, territory_set: [], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${w1v}" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { err3: "$.data.error_id" }
            - call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w1}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 1, territory_set: ["GB"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${w1v}" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { rg: "$.data.id", sb: "$.data.share_bps", st: "$.data.status" }
          assert:
            - "share_bps 0 → HTTP 422 ERR_INVALID_REQUEST; share_bps 10001 → HTTP 422 ERR_INVALID_REQUEST; territory_set [] → HTTP 422 ERR_INVALID_REQUEST."
            - "share_bps 1, the low end of the inclusive 1..10000 range, is accepted: HTTP 201 with share_bps 1 and status SUBMITTED."
            - "The three rejected attempts left no rows: only one registration exists for this work."

      - name: works_list_returns_default_page_and_honours_filters
        claim_type: listing
        grounds:
          - endpoints.GET_/royalties/works
          - response_envelope.pagination_defaults
          - entities.Work.fields.work_type
        distinguishing_aspect: |
          With 12 works stored, the unfiltered list returns the default page of 10 with
          total_count 12 and has_more true, while a work_type filter narrows total_count to 2 and
          flips has_more to false — the count reflects the filtered set, not the table.
        test_recipe:
          setup:
            - "Twelve Work rows created in order: ten RECORDING rows with identifiers GBABC2600001..GBABC2600010 and two COMPOSITION rows with identifiers T9001234567 and T9001234568."
          setup_api_calls:
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Track One", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { r1: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600002", title: "Track Two", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600003", title: "Track Three", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600004", title: "Track Four", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600005", title: "Track Five", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600006", title: "Track Six", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600007", title: "Track Seven", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600008", title: "Track Eight", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600009", title: "Track Nine", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600010", title: "Track Ten", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
            - call: "POST /royalties/works"
              payload: { work_type: "COMPOSITION", identifier: "T9001234567", title: "Track One" }
              as: RightsOpsAnalyst
              captures: { c1: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "COMPOSITION", identifier: "T9001234568", title: "Track Two" }
              as: RightsOpsAnalyst
              captures: { c2: "$.data.id" }
          trigger:
            - call: "GET /royalties/works"
              payload: {}
              as: RightsHolderUser
              captures: { page_all: "$.data", first_id: "$.data[0].id" }
            - call: "GET /royalties/works"
              payload: { work_type: "COMPOSITION" }
              as: RightsHolderUser
              captures: { page_comp: "$.data", comp_first: "$.data[0].identifier" }
            - call: "GET /royalties/works"
              payload: { rights_state: "REGISTERED" }
              as: RightsHolderUser
              captures: { page_reg: "$.data" }
          assert:
            - "Unfiltered: response_type \"array\", 10 items in data (the default limit), total_count 12, has_more true, offset 0, limit 10."
            - "Filtered by work_type COMPOSITION: 2 items, total_count 2, has_more false, and both identifiers are T9001234567 and T9001234568."
            - "Filtered by rights_state REGISTERED: 0 items, total_count 0, has_more false — every work is still UNMATCHED."

      - name: registration_junction_supports_reverse_lookups_from_both_sides
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.RightsRegistration.fields.payee_holder_id
          - endpoints.GET_/royalties/rights-registrations
        distinguishing_aspect: |
          RightsRegistration is the many-to-many junction between Work and RightsHolder and it
          carries TWO holder edges: claimant_id and collective_id. payee_holder_id is computed
          from routing, so a COLLECTIVE-routed row is reachable by claimant_id, by collective_id
          and by payee_holder_id == the collective, while a DIRECT-routed row on the same work is
          reachable by payee_holder_id == the claimant.
        test_recipe:
          setup:
            - "One COMPOSITION work; one PUBLISHER claimant; one COLLECTIVE holder whose home_territory_code is WORLD."
            - "Two registrations on that work by the same claimant: MECHANICAL routed DIRECT, and PERFORMANCE routed COLLECTIVE through the collective."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Tidewater Songs", holder_type: "PUBLISHER", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Harbour Collecting Society", holder_type: "COLLECTIVE", home_territory_code: "WORLD" }
              as: RoyaltyAdmin
              captures: { col: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "COMPOSITION", identifier: "T9001234567", title: "Midnight Ledger" }
              as: RightsOpsAnalyst
              captures: { wc: "$.data.id" }
            - call: "GET /royalties/works/${wc}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { wcv: "$.data.version" }
            - call: "POST /royalties/rights-registrations"
              payload: { work_id: "${wc}", claimant_id: "${pub}", right_type: "MECHANICAL", routing: "DIRECT", share_bps: 10000, territory_set: ["GB"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${wcv}" }
              as: RightsHolderUser
              as_user_id: "${pub}"
              captures: { rg_direct: "$.data.id", payee_direct: "$.data.payee_holder_id" }
            - call: "GET /royalties/works/${wc}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { wcv2: "$.data.version" }
            - call: "POST /royalties/rights-registrations"
              payload: { work_id: "${wc}", claimant_id: "${pub}", collective_id: "${col}", right_type: "PERFORMANCE", routing: "COLLECTIVE", share_bps: 10000, territory_set: ["GB"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${wcv2}" }
              as: RightsHolderUser
              as_user_id: "${pub}"
              captures: { rg_col: "$.data.id", payee_col: "$.data.payee_holder_id" }
          trigger:
            - call: "GET /royalties/rights-registrations"
              payload: { work_id: "${wc}" }
              as: RoyaltyAdmin
              captures: { by_work: "$.data" }
            - call: "GET /royalties/rights-registrations"
              payload: { claimant_id: "${pub}" }
              as: RoyaltyAdmin
              captures: { by_claimant: "$.data" }
            - call: "GET /royalties/rights-registrations"
              payload: { collective_id: "${col}" }
              as: RoyaltyAdmin
              captures: { by_collective: "$.data" }
            - call: "GET /royalties/rights-registrations"
              payload: { payee_holder_id: "${pub}" }
              as: RoyaltyAdmin
              captures: { by_payee_pub: "$.data" }
            - call: "GET /royalties/rights-registrations"
              payload: { payee_holder_id: "${col}" }
              as: RoyaltyAdmin
              captures: { by_payee_col: "$.data" }
          assert:
            - "The DIRECT row's payee_holder_id equals the publisher id; the COLLECTIVE row's payee_holder_id equals the collective id — payee_holder_id is computed from routing, never supplied."
            - "By work_id: 2 rows. By claimant_id (the publisher): 2 rows — the junction is traversable from the holder side for both."
            - "By collective_id: exactly 1 row, the PERFORMANCE registration."
            - "By payee_holder_id == publisher: exactly 1 row (the MECHANICAL/DIRECT one). By payee_holder_id == collective: exactly 1 row (the PERFORMANCE/COLLECTIVE one)."

      - name: rights_holder_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: [validations.priority_3, errors.ERR_RIGHTS_HOLDER_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown RightsHolder id on the path yields ERR_RIGHTS_HOLDER_NOT_FOUND (404), not an empty 200 body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - name: rights_holder_get_unknown_id_not_found
              call: "GET /royalties/rights-holders/11111111-1111-4111-8111-111111111101"
              payload: {}
              as: RoyaltyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with response_type \"error\" and error_id ERR_RIGHTS_HOLDER_NOT_FOUND."

      - name: registration_create_with_unknown_work_returns_not_found
        claim_type: not_found
        grounds: [validations.priority_3, errors.ERR_WORK_NOT_FOUND]
        distinguishing_aspect: |
          Body FKs are validated left-to-right after the path ids: with an unknown work_id AND an
          unknown claimant_id the work error wins, because work_id precedes claimant_id in the
