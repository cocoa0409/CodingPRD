# =============================================================================
# Task 1463 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# All payloads replay against SCAFFOLD.yaml §1.5; literals precomputed.
# Logical clock default at startup: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: download_qualification_provisional_vs_final
        grounds:
          - calculations.download_qualification
          - entities.Episode.fields.provisional_download_count
          - entities.Episode.fields.measured_download_count
        distinguishing_aspect: |
          Same four download events yield provisional_download_count == 3 but
          measured_download_count == 1: the final variant (measurement domain)
          drops UNKNOWN user agents, same-listener same-day repeats, and applies
          the inclusive measurement window, while the provisional variant only
          drops BOT.
        test_recipe:
          setup:
            - "Show with one PUBLISHED episode (publish_at 2026-08-01T00:00:00Z, measurement_window_days 30)"
            - "4 downloads: L1-0 HUMAN 2026-08-02T00:00:00Z; L1-0 HUMAN 2026-08-02T12:00:00Z (same listener, same UTC day); L2-0 UNKNOWN 2026-08-03T00:00:00Z; L3-0 BOT 2026-08-04T00:00:00Z"
            - "Logical clock advanced past window close (2026-08-31T00:00:00Z)"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Tech Talk", content_category: "TECHNOLOGY", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-01T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
              captures: { ep: $.data.id }
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep}", listener_key_prefix: "L1", count: 1, occurred_at: "2026-08-02T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep}", listener_key_prefix: "L1", count: 1, occurred_at: "2026-08-02T12:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep}", listener_key_prefix: "L2", count: 1, occurred_at: "2026-08-03T00:00:00Z", user_agent_class: "UNKNOWN" }
              as: Ingestion
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep}", listener_key_prefix: "L3", count: 1, occurred_at: "2026-08-04T00:00:00Z", user_agent_class: "BOT" }
              as: Ingestion
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: AdOps
          trigger:
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
          assert:
            - "Episode.${ep}.provisional_download_count == 3 (L1-0 x2 + L2-0 UNKNOWN; only BOT excluded)"
            - "Episode.${ep}.measured_download_count == 1 (only the first L1-0 HUMAN download survives dedupe; UNKNOWN excluded in final)"
            - "Episode.${ep}.status == MEASURED"

      - name: invoice_billing_actual_vs_booked_gross
        grounds:
          - calculations.invoice_billing
          - entities.Invoice.fields.gross_cents
        distinguishing_aspect: |
          Two campaigns with identical flights, rates, and delivery (800 qualified
          impressions against 1000 booked) produce gross_cents 4000 under
          ACTUAL_DELIVERY and 5000 under BOOKED_GROSS — a billing-domain dual
          variant, distinct from the measurement-domain download_qualification.
        test_recipe:
          setup:
            - "Show (avg_downloads_30d 10000 -> forecast 9500 with 1 episode in window), one episode publish_at 2026-08-01T00:00:00Z slot_capacity 2"
            - "Direct advertiser (no agency), category TECHNOLOGY"
            - "Campaign A ACTUAL_DELIVERY booked 1000 cpm 5000 flight [2026-08-01, 2026-09-01); Campaign B BOOKED_GROSS identical"
            - "APPROVED PRODUCED_AUDIO copy per campaign; one run-of-show MID_ROLL line item per campaign, both ACTIVE"
            - "800 qualified HUMAN downloads at 2026-08-05T00:00:00Z (both line items serve every download)"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Daily Tech", content_category: "TECHNOLOGY", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-01T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
              captures: { ep: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "Acme", category: "TECHNOLOGY" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CA", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 1000, cpm_cents: 5000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { ca: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CB", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 1000, cpm_cents: 5000, billing_model: "BOOKED_GROSS" }
              as: AdOps
              captures: { cb: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${ca}", kind: "PRODUCED_AUDIO", script_text: "spot A" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpa: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cb}", kind: "PRODUCED_AUDIO", script_text: "spot B" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpb: $.data.id }
            - call: "POST /adnet/ad-copies/${cpa}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpa}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/ad-copies/${cpb}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpb}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${ca}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cb}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${ca}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 1000, priority: 10, ad_copy_id: "${cpa}" }
              as: AdOps
              captures: { lia: $.data.id }
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cb}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 1000, priority: 9, ad_copy_id: "${cpb}" }
              as: AdOps
              captures: { lib: $.data.id }
            - call: "POST /adnet/line-items/${lia}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items/${lib}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep}", listener_key_prefix: "P", count: 800, occurred_at: "2026-08-05T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
            - call: "POST /adnet/campaigns/${ca}/transition"
              payload: { action: "END" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cb}/transition"
              payload: { action: "END" }
              as: AdOps
          trigger:
            - call: "POST /adnet/invoices"
              payload: { campaign_id: "${ca}" }
              as: Finance
              captures: { inva: $.data.id }
            - call: "POST /adnet/invoices"
              payload: { campaign_id: "${cb}" }
              as: Finance
              captures: { invb: $.data.id }
          assert:
            - "Invoice.${inva}.gross_cents == 4000 (round_half_up(800 * 5000 * 1000 / 1000000); ACTUAL_DELIVERY)"
            - "Invoice.${invb}.gross_cents == 5000 (round_half_up(1000 * 5000 / 1000); BOOKED_GROSS bills booked despite identical delivery)"
            - "Invoice.${inva}.delivered_impressions_billed == 800 and Invoice.${invb}.delivered_impressions_billed == 800"
            - "Invoice.${inva}.shortfall_impressions == 200 and Invoice.${invb}.shortfall_impressions == 200"
            - "GET /adnet/make-goods?campaign_id=${ca} returns total_count == 1 with granted_impressions == 200 (shortfall auto-offer fires under both variants)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: inventory_forecast_tiered_conditional_inputs
        grounds:
          - calculations.inventory_forecast
          - entities.Show.fields.forecast_impressions
        distinguishing_aspect: |
          Mode (a): forecast combines 3+ inputs (avg_downloads_30d, eligible
          episode count filtered by status AND rolling window, tier-conditional
          sell-through cap) — 10000 x 2 x 0.95 = 19000 when CLEAR, and the same
          inputs yield 14000 under the FLAGGED branch (cap 0.70).
        test_recipe:
          setup:
            - "Show avg_downloads_30d 10000, tier CLEAR; logical clock 2026-08-01T00:00:00Z"
            - "E1 SCHEDULED publish 2026-08-05 (inside horizon), E2 SCHEDULED publish 2026-08-20 (inside), E3 SCHEDULED publish 2026-10-01 (outside [2026-08-01, 2026-08-31])"
            - "E4 publish 2026-08-10 measurement_window_days 1, walked to MEASURED via clock detour, so it is excluded by status despite publish_at inside the horizon"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Forecast FM", content_category: "BUSINESS", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-05T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E2", publish_at: "2026-08-20T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E3", publish_at: "2026-10-01T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E4", publish_at: "2026-08-10T00:00:00Z", measurement_window_days: 1, slot_capacity: 2 }
              as: AdOps
              captures: { ep4: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep4}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep4}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AdOps
          trigger:
            - call: "GET /adnet/shows/${sh}"
              as: AdOps
            - call: "POST /adnet/shows/${sh}/transition"
              payload: { to_tier: "FLAGGED" }
              as: AdOps
          assert:
            - "Show.${sh}.forecast_impressions == 19000 while CLEAR (floor(10000 * 2 * 0.95); E1+E2 eligible, E3 outside horizon, E4 MEASURED)"
            - "After FLAGGED transition, Show.${sh}.forecast_impressions == 14000 (floor(10000 * 2 * 0.70))"

      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_billing
          - entities.Invoice.fields.lines
        distinguishing_aspect: |
          Mode (b): rounding is pinned per line item, then summed — lines
          7xPRE(5.6->6), 7xPRE(5.6->6), 1xPOST(0.6->1) give gross 13, whereas the
          alternative sum-then-round order gives round(11.8) == 12; the two
          orders diverge and the scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "Show with three episodes EPA/EPB/EPC (publish 2026-08-01T00:00:00Z, window 30, slot_capacity 2), all PUBLISHED"
            - "Direct advertiser; campaign ACTUAL_DELIVERY booked 15 cpm_cents 1000 flight [2026-08-01, 2026-09-01); APPROVED PRODUCED_AUDIO copy"
            - "Three episode-targeted line items: LI1->EPA PRE_ROLL, LI2->EPB PRE_ROLL, LI3->EPC POST_ROLL, all ACTIVE"
            - "Downloads: 7 HUMAN on EPA, 7 HUMAN on EPB, 1 HUMAN on EPC (all 2026-08-05T00:00:00Z); all episodes MEASURED"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Rounding Radio", content_category: "COMEDY", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "EPA", publish_at: "2026-08-01T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
              captures: { epa: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "EPB", publish_at: "2026-08-01T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
              captures: { epb: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "EPC", publish_at: "2026-08-01T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
              captures: { epc: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "RoundCo", category: "CPG_FOOD" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CR", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 15, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", episode_id: "${epa}", ad_format: "PRODUCED_SPOT", position: "PRE_ROLL", reserved_impressions: 100, priority: 10, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li1: $.data.id }
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", episode_id: "${epb}", ad_format: "PRODUCED_SPOT", position: "PRE_ROLL", reserved_impressions: 100, priority: 9, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li2: $.data.id }
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", episode_id: "${epc}", ad_format: "PRODUCED_SPOT", position: "POST_ROLL", reserved_impressions: 100, priority: 8, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li3: $.data.id }
            - call: "POST /adnet/line-items/${li1}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items/${li2}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items/${li3}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/episodes/${epa}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /adnet/episodes/${epb}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /adnet/episodes/${epc}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${epa}", listener_key_prefix: "PA", count: 7, occurred_at: "2026-08-05T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${epb}", listener_key_prefix: "PB", count: 7, occurred_at: "2026-08-05T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${epc}", listener_key_prefix: "PC", count: 1, occurred_at: "2026-08-05T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: AdOps
            - call: "POST /adnet/episodes/${epa}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
            - call: "POST /adnet/episodes/${epb}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
            - call: "POST /adnet/episodes/${epc}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "END" }
              as: AdOps
          trigger:
            - call: "POST /adnet/invoices"
              payload: { campaign_id: "${cmp}" }
              as: Finance
              captures: { inv: $.data.id }
          assert:
            - "Invoice.${inv}.gross_cents == 13 (6 + 6 + 1; per-line round_half_up then sum)"
            - "Invoice.${inv}.lines has 3 entries with line_cents [6, 6, 1] for [PRE_ROLL x7, PRE_ROLL x7, POST_ROLL x1]"
            - "Invoice.${inv}.delivered_impressions_billed == 15 and shortfall_impressions == 0"
            - "GET /adnet/make-goods?campaign_id=${cmp} returns total_count == 0 (no shortfall -> no make-good)"

      - name: invoice_commission_pinned_evaluation_order
        grounds:
          - calculations.invoice_commission
          - entities.Invoice.fields.net_cents
        distinguishing_aspect: |
          Mode (c): commission depends on the credit which depends on delivery —
          pinned order delivered -> gross -> credit -> commission -> net yields
          commission 180 and net 1020; evaluating commission on gross instead
          (the circular-looking alternative) yields 240 and 960.
        test_recipe:
          setup:
            - "Agency commission_bps 1500; advertiser represented by it"
            - "Campaign ACTUAL_DELIVERY booked 1000 cpm 2000, flight [2026-08-01, 2026-09-01); 800 qualified downloads delivered on one PUBLISHED episode via one ACTIVE MID_ROLL run-of-show line item; episode MEASURED; campaign ENDED"
            - "Invoice created in DRAFT with shortfall 200 and MakeGood OFFERED"
          setup_api_calls:
            - call: "POST /adnet/agencies"
              payload: { name: "MediaBuy LLC", commission_bps: 1500 }
              as: AdOps
              captures: { ag: $.data.id }
            - call: "POST /adnet/shows"
              payload: { title: "Order Ops", content_category: "NEWS", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-01T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
              captures: { ep: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "Orderly", category: "FINTECH", agency_id: "${ag}" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CC", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 1000, cpm_cents: 2000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Agency
              as_user_id: "${ag}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Agency
              as_user_id: "${ag}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 500, priority: 10, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li: $.data.id }
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep}", listener_key_prefix: "P", count: 800, occurred_at: "2026-08-05T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "END" }
              as: AdOps
            - call: "POST /adnet/invoices"
              payload: { campaign_id: "${cmp}" }
              as: Finance
              captures: { inv: $.data.id }
            - call: "GET /adnet/make-goods"
              payload: { campaign_id: "${cmp}" }
              as: Finance
              captures: { mg: "$.data[0].id" }
          trigger:
            - call: "POST /adnet/make-goods/${mg}/transition"
              payload: { action: "DECLINE" }
              as: Advertiser
              as_user_id: "${adv}"
          assert:
            - "Invoice.${inv}.gross_cents == 1600 (800 x 2000 x 1000 / 1000000)"
            - "Invoice.${inv}.make_good_credit_cents == 400 (round_half_up(200 x 2000 / 1000))"
            - "Invoice.${inv}.agency_commission_cents == 180 (round_half_up((1600 - 400) x 1500 / 10000)) — computed on post-credit gross, NOT on gross (which would give 240)"
            - "Invoice.${inv}.net_cents == 1020 and net_cents + agency_commission_cents + make_good_credit_cents == gross_cents"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ad_copy_revision_loop_cycles
        grounds:
          - state_machines.AdCopy.DRAFT_to_SUBMITTED
          - state_machines.AdCopy.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.AdCopy.APPROVED_to_CHANGES_REQUESTED
        distinguishing_aspect: |
          AdCopy is cyclic: DRAFT->SUBMITTED->CHANGES_REQUESTED->SUBMITTED (revision
          bumps 1->2) ->APPROVED->CHANGES_REQUESTED (revocation) — a revision loop,
          not a linear pipeline.
        test_recipe:
          setup:
            - "Show; direct advertiser; DRAFT campaign; HOST_READ_SCRIPT copy bound to the show"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Loopcast", content_category: "COMEDY", avg_downloads_30d: 5000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "LoopBrand", category: "CPG_FOOD" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CL", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 100, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "HOST_READ_SCRIPT", script_text: "v1 script", show_id: "${sh}" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
          trigger:
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "REQUEST_CHANGES", note: "tighten CTA" }
              as: ShowProducer
              as_user_id: "${sh}"
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: ShowProducer
              as_user_id: "${sh}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "REQUEST_CHANGES", note: "legal follow-up" }
              as: ShowProducer
              as_user_id: "${sh}"
          assert:
            - "After first submit AdCopy.${cpy}.status == SUBMITTED with revision == 1"
            - "After resubmission from CHANGES_REQUESTED, AdCopy.${cpy}.revision == 2 and status == SUBMITTED"
            - "APPROVE from SUBMITTED succeeds (status == APPROVED)"
            - "REQUEST_CHANGES from APPROVED succeeds (status == CHANGES_REQUESTED) — APPROVED is not terminal; the machine loops"

      - name: campaign_pause_resume_and_makegood_reopen_cycle
        grounds:
          - state_machines.Campaign.ACTIVE_to_PAUSED
          - state_machines.Campaign.PAUSED_to_ACTIVE
          - state_machines.Campaign.ENDED_to_ACTIVE
          - state_machines.MakeGood.ACCEPTED_to_FULFILLED
        distinguishing_aspect: |
          Campaign is cyclic on two levels: ACTIVE<->PAUSED and ENDED->ACTIVE via
          make-good acceptance (flight extends to 2026-09-15T00:00:00Z); a second
          END evaluates fulfillment (bonus 200 >= granted 200 -> FULFILLED). A
          different entity than AdCopy carries the non-linear shape.
        test_recipe:
          setup:
            - "Show (avg 10000); direct advertiser; campaign ACTUAL_DELIVERY booked 1000 cpm 5000 flight [2026-08-01, 2026-09-01); APPROVED copy; ACTIVE run-of-show MID_ROLL line item (reserved 1000)"
            - "E1 PUBLISHED with 800 qualified downloads (2026-08-05), MEASURED; E2 created with publish_at 2026-08-25T00:00:00Z (still SCHEDULED at first END)"
            - "Campaign taken ACTIVE -> PAUSED -> ACTIVE -> ENDED; invoice DRAFT; MakeGood OFFERED granted 200"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Cycle Show", content_category: "SPORTS", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-01T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
              captures: { ep1: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E2", publish_at: "2026-08-25T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
              captures: { ep2: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "CycleCo", category: "AUTOMOTIVE" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CY", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 1000, cpm_cents: 5000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "PAUSE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 1000, priority: 10, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li1: $.data.id }
            - call: "POST /adnet/line-items/${li1}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep1}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep1}", listener_key_prefix: "P", count: 800, occurred_at: "2026-08-05T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep1}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "END" }
              as: AdOps
            - call: "POST /adnet/invoices"
              payload: { campaign_id: "${cmp}" }
              as: Finance
            - call: "GET /adnet/make-goods"
              payload: { campaign_id: "${cmp}" }
              as: Finance
              captures: { mg: "$.data[0].id" }
          trigger:
            - call: "POST /adnet/make-goods/${mg}/transition"
              payload: { action: "ACCEPT", extension_days: 14 }
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep2}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 100, priority: 10, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li2: $.data.id }
            - call: "POST /adnet/line-items/${li2}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep2}", listener_key_prefix: "Q", count: 200, occurred_at: "2026-08-26T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep2}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "END" }
              as: AdOps
          assert:
            - "Campaign.${cmp} accepted the PAUSED->ACTIVE resume before first END (cyclic pause/resume)"
            - "After ACCEPT, Campaign.${cmp}.status == ACTIVE and flight_end == 2026-09-15T00:00:00Z (ENDED->ACTIVE reopen, +14 days)"
            - "MakeGood.${mg}.baseline_delivered_impressions == 800"
            - "After bonus delivery and second END, Campaign.${cmp}.delivered_impressions == 1000 and MakeGood.${mg}.status == FULFILLED (200 >= 200 boundary)"
            - "Campaign.${cmp}.status == ENDED after second END (invoice not PAID -> no auto-RECONCILED)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: advertiser_suspension_three_level_cascade
        grounds:
          - state_machines.Advertiser.ACTIVE_to_SUSPENDED
          - state_machines.Campaign.ACTIVE_to_PAUSED
          - state_machines.LineItem.ACTIVE_to_PAUSED
          - entities.Show.fields.available_impressions
        distinguishing_aspect: |
          Depth-3 chain triggered by advertiser SUSPEND: Advertiser -> Campaign
          (ACTIVE->PAUSED) -> LineItem (ACTIVE->PAUSED) -> Show (reserved released,
          available recomputed); each link is caused by the previous link's
          mutation. Reinstatement deliberately does NOT unwind the chain.
        test_recipe:
          setup:
            - "Show avg 10000 with one episode in horizon (forecast 9500); advertiser; ACTIVE campaign with APPROVED copy; ACTIVE run-of-show line item reserved 1000 (reserved 1000, available 8500)"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Cascade FM", content_category: "NEWS", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-05T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
            - call: "POST /adnet/advertisers"
              payload: { name: "CascadeCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CS", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 1000, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 1000, priority: 10, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li: $.data.id }
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
          trigger:
            - call: "POST /adnet/advertisers/${adv}/transition"
              payload: { action: "SUSPEND" }
              as: AdOps
            - call: "POST /adnet/advertisers/${adv}/transition"
              payload: { action: "REINSTATE" }
              as: AdOps
          assert:
            - "After SUSPEND: Campaign.${cmp}.status == PAUSED (link 1)"
            - "After SUSPEND: LineItem.${li}.status == PAUSED (link 2, caused by link 1's campaign cascade)"
            - "After SUSPEND: Show.${sh}.reserved_impressions == 0 and available_impressions == 9500 == forecast_impressions (link 3, caused by link 2's release)"
            - "After REINSTATE: Campaign.${cmp}.status == PAUSED and LineItem.${li}.status == PAUSED (no auto-resume unwind)"

      - name: finalize_measurement_delivery_cascade
        grounds:
          - state_machines.Episode.PUBLISHED_to_MEASURED
          - calculations.delivery_aggregation
          - entities.Campaign.fields.delivered_impressions
        distinguishing_aspect: |
          Depth-3 chain with a different trigger (FINALIZE_MEASUREMENT): Episode ->
          Download.qualified_final -> Impression.billable_final ->
          Campaign.delivered_impressions; before the trigger the campaign counter
          is 0 although 5 impressions exist, proving the chain is driven by the
          finalize transition rather than ingest.
        test_recipe:
          setup:
            - "Show; direct advertiser; ACTIVE campaign (ACTUAL_DELIVERY booked 10 cpm 1000) with APPROVED copy and ACTIVE run-of-show MID_ROLL line item"
            - "Episode PUBLISHED with 5 HUMAN downloads (distinct listeners) at 2026-08-05T00:00:00Z -> 5 impressions, all billable_final null"
            - "Clock advanced to 2026-09-01T00:00:01Z (window closed)"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Finalize FM", content_category: "HEALTH", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-01T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
              captures: { ep: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "FinCo", category: "HEALTH_PHARMA" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CF", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 10, priority: 10, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li: $.data.id }
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep}", listener_key_prefix: "D", count: 5, occurred_at: "2026-08-05T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
            - call: "GET /adnet/campaigns/${cmp}"
              as: AdOps
              captures: { pre_delivered: $.data.delivered_impressions }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: AdOps
          trigger:
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
          assert:
            - "Before finalize, Campaign.${cmp}.delivered_impressions == 0 (captured pre_delivered == 0)"
            - "Every download of Episode.${ep} has qualified_final == true after finalize (link 1)"
            - "GET /adnet/impressions?campaign_id=${cmp} returns 5 impressions all with billable_final == true (link 2)"
            - "Campaign.${cmp}.delivered_impressions == 5 after finalize (link 3)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_line_item_activation
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_CAMPAIGN_NOT_ACTIVE]
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): the activation request
          violates both (owning campaign PAUSED; reserved 1 > available 0) and
          must surface the state error ERR_CAMPAIGN_NOT_ACTIVE, not the fiscal
          ERR_INSUFFICIENT_INVENTORY.
        test_recipe:
          setup:
            - "Show avg 1000 with one episode in horizon -> forecast 950; advertiser; campaign PAUSED; APPROVED copy"
            - "LI1 run-of-show reserved 950 was ACTIVATED while campaign was ACTIVE (available now 0), then campaign PAUSED"
            - "LI2 run-of-show reserved 1 remains DRAFT"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Tight Pool", content_category: "BUSINESS", avg_downloads_30d: 1000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-05T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
            - call: "POST /adnet/advertisers"
              payload: { name: "TightCo", category: "FINTECH" }
