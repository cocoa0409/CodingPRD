              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/billing-accounts"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 and err == ERR_UNAUTHENTICATED"

  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Every mutation on a common_fields: true entity bumps version by exactly 1; reading twice without an intervening write sees the same version."
        test_recipe:
          setup:
            - "Account created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "V", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /api/billing-accounts/${acct_id}/commitments"
              payload: { meter: "INFRA_HOST", committed_quantity: 5, window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T23:59:59Z", committed_unit_rate_cents: 100, overage_unit_rate_cents: 500, expected_billing_account_version: "${acct_v0}" }
              as: BillingAdmin
          trigger:
            - call: "GET /api/billing-accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
              captures: { acct_v_after: $.data.version }
          assert:
            - "BillingAccount.version was 1 at create"
            - "after the commitment create (which lists account.version increment in side_effects), version == 2"

  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_usage_record_post
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "After POST usage-records, a same-request response and immediate GET both reflect the bumped MeterAccumulator; no delayed reconciliation."
        test_recipe:
          setup:
            - "OPEN period exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/plan-tier-configs"
              payload: { plan_tier: "ENTERPRISE", max_monitors: 500, included_custom_metrics: 200, host_overage_rate_cents: 1500, log_ingest_rate_cents_per_gb: 10, log_index_rate_cents_per_million: 170, custom_metric_rate_cents_per_unit: 5 }
              as: PlatformAdmin
            - call: "POST /api/billing-accounts"
              payload: { name: "IC", plan_tier: "ENTERPRISE", billing_cycle_anchor_day: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods"
              payload: { period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z" }
              as: BillingAdmin
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /api/billing-accounts/${acct_id}/billing-periods/${period_id}/usage-records"
              payload: { meter: "SYNTHETIC", quantity: 11 }
              as: IngestionAgent
            - call: "GET /api/billing-accounts/${acct_id}/billing-periods/${period_id}/meter-accumulators"
              payload: { meter: "SYNTHETIC" }
              as: BillingAdmin
          assert:
            - "MeterAccumulator SYNTHETIC.quantity == 11 immediately after the POST (no delayed reconciliation)"
