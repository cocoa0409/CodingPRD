      - name: cascade_conditional_on_option_leaving_active
        claim_type: Conditional cascade
        grounds:
          - state_machines.PlanYear.OPEN_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / plan_year_close_denies_open_elections_depth_three
          rationale: "That instance asserts the DRAFT option is untouched while the ACTIVE one closes, and that only the elections on the closed option are denied - exactly the conditional-cascade claim."

      - name: parallel_state_dimensions_on_enrollment
        claim_type: parallel
        grounds:
          - state_machines.Enrollment
        excluded_because:
          difficulty_instance: non_linear_state_machine / enrollment_coverage_and_billing_dimensions_move_independently
          rationale: "That instance drives coverage_status and billing_status through independent hops and asserts the combined state after each."

      - name: compensation_reverses_every_payment_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.ReimbursementClaim.PAID_to_REVERSED
        excluded_because:
          difficulty_instance: compensating_invariant / claim_pay_then_reverse_restores_hra_ledger
          rationale: "That instance asserts every bucket returns to its pre-PAY value with zero drift."

      - name: ledger_sync_on_claim_approval_updates_account_buckets
        claim_type: Ledger sync
        grounds:
          - state_machines.ReimbursementClaim.SUBMITTED_to_APPROVED
        excluded_because:
          difficulty_instance: dual_variant_calc / hra_claim_provisional_versus_final_eligible_amount
          rationale: "That instance asserts the account's pending_hold_cents and available_balance_cents before and after the FINAL recomputation."

