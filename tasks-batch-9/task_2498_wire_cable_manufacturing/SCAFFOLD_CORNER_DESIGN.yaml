  # ===========================================================================
  # Section 2 - State Machines (1.2)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: compound_qualify_suspend_requalify_walks_the_declared_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Compound.transitions.DRAFT_to_QUALIFIED
          - state_machines.Compound.transitions.QUALIFIED_to_SUSPENDED
          - state_machines.Compound.transitions.SUSPENDED_to_QUALIFIED
          - endpoints[POST /compounds/{id}/qualify]
          - endpoints[POST /compounds/{id}/suspend]
        distinguishing_aspect: "Compound is the scaffold's smallest genuine cycle: DRAFT -> QUALIFIED -> SUSPENDED -> QUALIFIED, and each hop bumps version by exactly 1, so the re-qualified compound sits at version 4 - which is what makes pinned-version staleness detectable elsewhere."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one freshly created insulation compound."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
          trigger:
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /compounds/${ins_id}/suspend"
              payload: { suspension_reason: "supplier resin lot change" }
              as: QualityEngineer
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
          assert:
            - "at create: Compound.${ins_id}.status == \"DRAFT\", qualification_date == null, suspension_reason == null, version == 1"
            - "after the first qualify: status == \"QUALIFIED\", qualification_date == \"2026-08-01\" (the logical-clock date), version == 2"
            - "after the suspend: status == \"SUSPENDED\", suspension_reason == \"supplier resin lot change\", version == 3"
            - "after the re-qualify: status == \"QUALIFIED\", qualification_date == \"2026-08-01\", version == 4"
            - "GET /compounds/${ins_id} as QualityEngineer returns the same version 4 row"

      - name: newly_created_entities_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.RodPurchaseLot.initial_state
          - state_machines.Compound.initial_state
          - state_machines.ListingCertification.initial_state
          - state_machines.CatalogProduct.initial_state
          - state_machines.CustomerOrder.initial_state
          - state_machines.ProductionLot.initial_states
          - state_machines.Reel.initial_state
        distinguishing_aspect: "Seven machines are checked in one pass, including the only two-dimensional one: a new ProductionLot starts at process_state QUEUED AND quality_state PENDING simultaneously, and a new ListingCertification starts PENDING with both inspection dates null."
        test_recipe:
          setup:
            - "One of every definition entity plus an order, a lot and a reel, all freshly created and untouched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
          trigger:
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
