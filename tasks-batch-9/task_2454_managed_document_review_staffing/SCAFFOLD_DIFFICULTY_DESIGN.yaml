              payload: { coding_error_count: 2, privilege_error_count: 0 }
              as: QCLead
              captures: { rate1: $.data.discrepancy_rate }
            - call: "POST /assignments/${a1_id}/start"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a1_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /batches/${b1_id}/qc-samples"
