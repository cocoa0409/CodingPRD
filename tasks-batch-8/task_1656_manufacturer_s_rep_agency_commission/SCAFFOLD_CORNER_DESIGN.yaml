      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Priority 1: a call without X-User-ID/X-User-Role fails ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check — even on a valid endpoint with a valid body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "with auth headers withheld by the harness: error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"

      - name: unknown_family_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_UNKNOWN_FAMILY_CODE]"]
