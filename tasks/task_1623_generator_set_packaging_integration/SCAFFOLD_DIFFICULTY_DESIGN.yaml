# =============================================================================
# Task 1623: Generator Set Packaging & Integration — §1.8 Test Targeting Index
# Two instances per Difficulty Rule (§0.5); every setup chain replayed against
# SCAFFOLD.yaml §1.2 / §1.4 / §1.5 from empty-DB.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sizing_nameplate_vs_derated_divergence
        grounds:
          - calculations.sizing_required_kva
          - entities.SizingStudy.fields.required_kva
          - entities.SizingStudy.fields.method
        distinguishing_aspect: |
          Same engineering inputs on a SizingStudy (entity domain: engineering
          sizing) produce required_kva == 440.0 under NAMEPLATE_SUM but 514.9
          under DERATED_STOCHASTIC — the derate/reserve variant is strictly
          larger once altitude (2000 m) and ambient (50 C) derates apply.
        test_recipe:
          setup:
            - "Customer, engine (rated_kw 400, burn 15.0, EPA_TIER_4), alternator (rated_kva 700) exist"
            - "Order O (US_TX, STANDARD, STANDBY) exists at version 1"
            - "Study A on O: steps 100/80/60 CONTINUOUS, largest_motor 100, DOL, altitude 2000, ambient 50, method NAMEPLATE_SUM"
            - "Study B on O: identical inputs but method DERATED_STOCHASTIC"
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Acme Health", credit_limit_cents: 200000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "C500D6", manufacturer: "Cummins", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "MX-700", rated_kva: 700, efficiency_pct: 96.5, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { alt_id: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${cust_id}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { ord_id: $.data.id, ord_v1: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${ord_id}", engine_model_id: "${eng_id}", alternator_model_id: "${alt_id}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" }, { description: "B", kva: 80, duty: "CONTINUOUS" }, { description: "C", kva: 60, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 2000, ambient_c: 50, method: "NAMEPLATE_SUM", expected_order_version: "${ord_v1}" }
              as: ApplicationEngineer
              captures: { study_a: $.data.id, kva_a: $.data.required_kva }
            - call: "GET /genset-packaging/orders/${ord_id}"
              payload: {}
              as: SalesEngineer
              captures: { ord_v2: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${ord_id}", engine_model_id: "${eng_id}", alternator_model_id: "${alt_id}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" }, { description: "B", kva: 80, duty: "CONTINUOUS" }, { description: "C", kva: 60, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 2000, ambient_c: 50, method: "DERATED_STOCHASTIC", expected_order_version: "${ord_v2}" }
              as: ApplicationEngineer
              captures: { study_b: $.data.id, kva_b: $.data.required_kva }
          trigger:
            - call: "GET /genset-packaging/sizing-studies/${study_a}"
              payload: {}
              as: SalesEngineer
            - call: "GET /genset-packaging/sizing-studies/${study_b}"
              payload: {}
              as: SalesEngineer
          assert:
            - "SizingStudy.${study_a}.required_kva == 440.0"
            - "SizingStudy.${study_b}.required_kva == 514.9"
            - "SizingStudy.${study_b}.required_kva != SizingStudy.${study_a}.required_kva"

      - name: service_contract_flat_vs_tnm_divergence
        grounds:
          - calculations.service_contract_price
          - entities.ServiceContract.fields.total_price_cents
          - entities.ServiceContract.fields.pricing_variant
        distinguishing_aspect: |
          Same coverage inputs (500 kW, 3 years, US_TX order) priced on a
          ServiceContract (entity domain: commercial coverage) yield
          total_price_cents == 1800000 under FLAT_RISK_PREMIUM but 1794000
          under TIME_AND_MATERIALS_EV — different entity domain from the
          sizing variant instance, and a different divergence mechanism
          (rate table vs expected-value build-up).
        test_recipe:
          setup:
            - "Customer and order O2 (US_TX, STANDARD, STANDBY) exist"
            - "Contract C1 on O2: FLAT_RISK_PREMIUM, 500 kW, 3 years"
            - "Contract C2 on O2: TIME_AND_MATERIALS_EV, 500 kW, 3 years"
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Beta Industrial", credit_limit_cents: 200000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { cust2_id: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${cust2_id}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { ord2_id: $.data.id }
            - call: "POST /genset-packaging/service-contracts"
              payload: { order_id: "${ord2_id}", pricing_variant: "FLAT_RISK_PREMIUM", term_years: 3, nameplate_kw: 500 }
              as: SalesEngineer
              captures: { sc_flat: $.data.id }
            - call: "POST /genset-packaging/service-contracts"
              payload: { order_id: "${ord2_id}", pricing_variant: "TIME_AND_MATERIALS_EV", term_years: 3, nameplate_kw: 500 }
              as: SalesEngineer
              captures: { sc_tnm: $.data.id }
          trigger:
            - call: "GET /genset-packaging/service-contracts/${sc_flat}"
              payload: {}
              as: SalesEngineer
            - call: "GET /genset-packaging/service-contracts/${sc_tnm}"
              payload: {}
              as: SalesEngineer
          assert:
            - "ServiceContract.${sc_flat}.annual_price_cents == 600000"
            - "ServiceContract.${sc_flat}.total_price_cents == 1800000"
            - "ServiceContract.${sc_tnm}.annual_price_cents == 598000"
            - "ServiceContract.${sc_tnm}.total_price_cents == 1794000"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fuel_tank_runtime_locale_ullage_nonlinear
        grounds:
          - calculations.fuel_tank_runtime
          - validations[priority=5]
          - state_machines.PackageConfiguration.DRAFT_to_LOCKED
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (tank gallons, locale-dependent ullage, engine
          burn rate, occupancy minimum) interact non-linearly — the identical
          400-gal tank on identical hardware yields runtime 24.00 h in US_TX
          (lock allowed) but 23.47 h in US_CA (lock rejected with
          ERR_FUEL_RUNTIME_INSUFFICIENT), purely from the locale ullage branch.
        test_recipe:
          setup:
            - "Two customers; two orders: O_TX (US_TX, STANDARD) and O_CA (US_CA, STANDARD)"
            - "Engine E15 with fuel_burn_gph_at_75 == 15.0, rated_kw 400, EPA_TIER_4; alternator 700 kVA"
            - "Both orders have an APPROVED study (required_kva 440.0 via NAMEPLATE_SUM) and are AUTHORIZED"
            - "Configuration CFG_TX on O_TX: 400 gal; configuration CFG_CA on O_CA: 400 gal"
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "TX Data", credit_limit_cents: 200000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { cust_tx: $.data.id }
            - call: "POST /genset-packaging/customers"
              payload: { name: "CA Data", credit_limit_cents: 200000000, primary_locale: "US_CA" }
              as: PlatformAdmin
              captures: { cust_ca: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "Generac", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "TIER_4_FINAL_CARB", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { eng15: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { alt700: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${cust_tx}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { ord_tx: $.data.id, vtx0: $.data.version }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${cust_ca}", site_locale: "US_CA", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { ord_ca: $.data.id, vca0: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${ord_tx}", engine_model_id: "${eng15}", alternator_model_id: "${alt700}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" }, { description: "B", kva: 80, duty: "CONTINUOUS" }, { description: "C", kva: 60, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${vtx0}" }
              as: ApplicationEngineer
              captures: { ss_tx: $.data.id }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${ord_ca}", engine_model_id: "${eng15}", alternator_model_id: "${alt700}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" }, { description: "B", kva: 80, duty: "CONTINUOUS" }, { description: "C", kva: 60, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${vca0}" }
              as: ApplicationEngineer
              captures: { ss_ca: $.data.id }
            - call: "POST /genset-packaging/sizing-studies/${ss_tx}/submit"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /genset-packaging/sizing-studies/${ss_tx}/approve"
              payload: {}
              as: SalesEngineer
            - call: "POST /genset-packaging/sizing-studies/${ss_ca}/submit"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /genset-packaging/sizing-studies/${ss_ca}/approve"
              payload: {}
              as: SalesEngineer
            - call: "POST /genset-packaging/orders/${ord_tx}/authorize"
              payload: { amount_cents: 60000000, freight_charge_cents: 1250000 }
              as: SalesEngineer
            - call: "POST /genset-packaging/orders/${ord_ca}/authorize"
              payload: { amount_cents: 60000000, freight_charge_cents: 1250000 }
              as: SalesEngineer
            - call: "POST /genset-packaging/configurations"
              payload: { order_id: "${ord_tx}", sizing_study_id: "${ss_tx}", enclosure_type: "WEATHERPROOF", enclosure_price_cents: 5000000, fuel_tank_gallons: 400 }
              as: ApplicationEngineer
              captures: { cfg_tx: $.data.id, rt_tx: $.data.runtime_hours }
            - call: "POST /genset-packaging/configurations"
              payload: { order_id: "${ord_ca}", sizing_study_id: "${ss_ca}", enclosure_type: "WEATHERPROOF", enclosure_price_cents: 5000000, fuel_tank_gallons: 400 }
              as: ApplicationEngineer
              captures: { cfg_ca: $.data.id, rt_ca: $.data.runtime_hours }
          trigger:
            - call: "POST /genset-packaging/configurations/${cfg_tx}/lock"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /genset-packaging/configurations/${cfg_ca}/lock"
              payload: {}
              as: ApplicationEngineer
              captures: { ca_err: $.data.error_id }
          assert:
            - "PackageConfiguration.${cfg_tx}.runtime_hours == 24.00"
            - "PackageConfiguration.${cfg_tx}.status == LOCKED"
            - "PackageConfiguration.${cfg_ca}.runtime_hours == 23.47"
            - "lock of ${cfg_ca} rejected with ERR_FUEL_RUNTIME_INSUFFICIENT"
            - "PackageConfiguration.${cfg_ca}.status == DRAFT"

      - name: load_bank_billing_rounding_order
        grounds:
          - calculations.load_bank_billing
          - entities.FactoryTest.fields.invoice_total_cents
          - entities.FactoryTest.fields.total_kwh
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-step-then-sum, so two steps (47.25 kW x 1.0 h; 33.33 kW x
          0.5 h at 32 c/kWh) invoice 2048 cents; the alternative sum-then-round
          order would produce 2045 cents on identical readings.
        test_recipe:
          setup:
            - "Full chain to build_status TESTING: approved study, authorized order, locked config (400 gal), submitted+approved permit, issued cert"
            - "Bay B1 ACTIVE; test T1 scheduled on B1 (2026-08-05, 8-12) and started"
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Gamma Co", credit_limit_cents: 200000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "Generac", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "TIER_4_FINAL_CARB", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { e3: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { a3: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${c3}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { o3: $.data.id, o3v: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${o3}", engine_model_id: "${e3}", alternator_model_id: "${a3}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${o3v}" }
              as: ApplicationEngineer
              captures: { s3: $.data.id }
            - call: "POST /genset-packaging/sizing-studies/${s3}/submit"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /genset-packaging/sizing-studies/${s3}/approve"
              payload: {}
              as: SalesEngineer
            - call: "POST /genset-packaging/orders/${o3}/authorize"
              payload: { amount_cents: 60000000, freight_charge_cents: 1250000 }
              as: SalesEngineer
            - call: "POST /genset-packaging/configurations"
              payload: { order_id: "${o3}", sizing_study_id: "${s3}", enclosure_type: "OPEN", enclosure_price_cents: 2000000, fuel_tank_gallons: 400 }
              as: ApplicationEngineer
              captures: { cf3: $.data.id }
            - call: "POST /genset-packaging/configurations/${cf3}/lock"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /genset-packaging/permit-cases"
              payload: { order_id: "${o3}", configuration_id: "${cf3}" }
              as: ComplianceOfficer
              captures: { p3: $.data.id }
            - call: "POST /genset-packaging/permit-cases/${p3}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /genset-packaging/permit-cases/${p3}/approve-ahj"
              payload: {}
              as: PlatformAdmin
            - call: "POST /genset-packaging/emissions-certificates"
              payload: { order_id: "${o3}", configuration_id: "${cf3}" }
              as: ComplianceOfficer
              captures: { ec3: $.data.id }
            - call: "POST /genset-packaging/emissions-certificates/${ec3}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /genset-packaging/emissions-certificates/${ec3}/issue"
              payload: {}
              as: PlatformAdmin
            - call: "POST /genset-packaging/test-bays"
              payload: { bay_code: "B1", max_kw: 1000 }
              as: PlatformAdmin
              captures: { bay3: $.data.id }
            - call: "POST /genset-packaging/factory-tests"
              payload: { order_id: "${o3}", configuration_id: "${cf3}", bay_id: "${bay3}", service_date: "2026-08-05", start_hour: 8, end_hour: 12 }
              as: TestEngineer
              captures: { t3: $.data.id }
            - call: "POST /genset-packaging/factory-tests/${t3}/start"
              payload: {}
              as: TestEngineer
          trigger:
            - call: "POST /genset-packaging/factory-tests/${t3}/record"
              payload: { readings: [ { kw: 47.25, hours: 1.0, power_factor: 0.80 }, { kw: 33.33, hours: 0.5, power_factor: 0.82 } ] }
              as: TestEngineer
              captures: { inv3: $.data.invoice_total_cents, kwh3: $.data.total_kwh, pf3: $.data.measured_avg_pf }
          assert:
            - "FactoryTest.${t3}.total_kwh == 64.0"
            - "FactoryTest.${t3}.invoice_total_cents == 2048"
            - "FactoryTest.${t3}.measured_avg_pf == 0.8067"
            - "FactoryTest.${t3}.verdict == PASS"
            - "FactoryTest.${t3}.status == PASSED"

      - name: order_total_circular_tier_pin
        grounds:
          - calculations.order_total_price
          - entities.PackageOrder.fields.total_price_cents
          - entities.PackageOrder.fields.discount_tier
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the discount tier keys on the
          total while the total includes the discount — broken by the pinned
          evaluation order (tier on PRE-discount subtotal; freight added after
          discount). Pre-discount 50060000 cents lands exactly 60000 cents over
          the TIER_8 threshold, so discount == 4004800 and total == 47305200.
        test_recipe:
          setup:
            - "Customer with credit 200000000; engine 30000000, alternator 15000000"
            - "Order O4 (US_TX) with APPROVED study; AUTHORIZED with freight 1250000"
            - "Configuration CFG4: enclosure SOUND_ATTENUATED 5000000, tank 400 gal (tank price 60000) -> pre-discount 50060000"
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Delta Ltd", credit_limit_cents: 200000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { c4: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "Generac", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { e4: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { a4: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${c4}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { o4: $.data.id, o4v: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${o4}", engine_model_id: "${e4}", alternator_model_id: "${a4}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${o4v}" }
              as: ApplicationEngineer
              captures: { s4: $.data.id }
            - call: "POST /genset-packaging/sizing-studies/${s4}/submit"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /genset-packaging/sizing-studies/${s4}/approve"
              payload: {}
              as: SalesEngineer
            - call: "POST /genset-packaging/orders/${o4}/authorize"
              payload: { amount_cents: 60000000, freight_charge_cents: 1250000 }
              as: SalesEngineer
            - call: "POST /genset-packaging/configurations"
              payload: { order_id: "${o4}", sizing_study_id: "${s4}", enclosure_type: "SOUND_ATTENUATED", enclosure_price_cents: 5000000, fuel_tank_gallons: 400 }
              as: ApplicationEngineer
              captures: { cf4: $.data.id }
          trigger:
            - call: "POST /genset-packaging/configurations/${cf4}/lock"
              payload: {}
              as: ApplicationEngineer
          assert:
            - "PackageConfiguration.${cf4}.tank_price_cents == 60000"
            - "PackageOrder.${o4}.discount_tier == TIER_8"
            - "PackageOrder.${o4}.total_price_cents == 47305200"
            - "PackageOrder.${o4}.build_status == CONFIGURING"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_case_correction_cycle
        grounds:
          - state_machines.PermitCase.SUBMITTED_to_CORRECTION_REQUESTED
          - state_machines.PermitCase.CORRECTION_REQUESTED_to_SUBMITTED
          - calculations.permit_fee_schedule
        distinguishing_aspect: |
          PermitCase runs a true cycle (SUBMITTED -> CORRECTION_REQUESTED ->
          SUBMITTED) on the PermitCase entity: after one loop revision_count ==
          1 and total_fees_paid_cents == 100000 + 50000 == 150000 (US_TX),
          and expires_on is recomputed from the resubmission date.
        test_recipe:
          setup:
            - "Order O5 (US_TX) advanced to build CONFIGURING: study approved, authorized, config locked"
            - "Permit P5 created at clock 2026-08-01 (default) and submitted (expires_on 2026-09-15)"
            - "AHJ requests correction; officer resubmits"
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Echo LLC", credit_limit_cents: 200000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { c5: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "Generac", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { e5: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { a5: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${c5}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { o5: $.data.id, o5v: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${o5}", engine_model_id: "${e5}", alternator_model_id: "${a5}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${o5v}" }
              as: ApplicationEngineer
              captures: { s5: $.data.id }
            - call: "POST /genset-packaging/sizing-studies/${s5}/submit"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /genset-packaging/sizing-studies/${s5}/approve"
              payload: {}
              as: SalesEngineer
            - call: "POST /genset-packaging/orders/${o5}/authorize"
