        distinguishing_aspect: "qa-signoff is reachable only from QA_HOLD, so calling it on a unit that is merely ON_FLOOR is a 409 ERR_BUILD_STATE_INVALID; the state check (priority 26) fires before the QualityInspector's missing QA_SIGNOFF scope (priority 36) is ever consulted."
        test_recipe:
          setup:
            - "Certified OPL-60-A; BuildOrder SN-0001 released to the floor with no station logs"
