    roles: [IncentiveOps]
    code: 201
    input: [market_id, program_type, title, window_start_utc, window_end_utc, stacking_class, excluded_ride_types, "geo_cell_id?", "streak_length?", "streak_payout_cents?", "zone_multiplier_bps?", "challenge_ride_target?", "challenge_payout_cents?", "guaranteed_weekly_cents?", "guaranteed_min_rides?", "capacity?"]
    output: IncentiveProgram
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/incentive-programs/{id}"
    description: "Get a program"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer, FraudAnalyst, Driver]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: []
  - method: GET
    path: "/incentive-programs"
    description: "List programs"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer, FraudAnalyst, Driver]
    code: 200
    input: ["market_id?", "program_type?", "status?", "limit?", "offset?"]
    output: "IncentiveProgram[]"
    side_effects: []
  - method: POST
    path: "/incentive-programs/{id}/activate"
    description: "Activate program (window/overlap/budget checks)"
    roles: [IncentiveOps]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: ["GUARANTEE: reserve budget on market"]
  - method: POST
    path: "/incentive-programs/{id}/pause"
    description: "Pause program"
    roles: [IncentiveOps]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: ["GUARANTEE: release reservation"]
  - method: POST
    path: "/incentive-programs/{id}/resume"
    description: "Resume paused program"
    roles: [IncentiveOps]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: ["GUARANTEE: re-reserve"]
  - method: POST
    path: "/incentive-programs/{id}/retire"
    description: "Retire program"
    roles: [IncentiveOps]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: ["requires no ACTIVE enrollments; releases reservation; linked shortfalls -> ADDRESSED"]
  - method: GET
    path: "/incentive-programs/{id}/enrollments"
    description: "List program enrollments (reverse FK)"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "IncentiveEnrollment[]"
    side_effects: []
  - method: GET
    path: "/incentive-programs/{id}/cost-forecasts"
    description: "List program cost forecasts (reverse FK)"
    roles: [PlatformAdmin, IncentiveOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CostForecast[]"
    side_effects: []
  - method: POST
    path: "/incentive-programs/{id}/cost-forecasts"
    description: "Create a cost forecast for a program"
    roles: [IncentiveOps]
    code: 201
    input: [baseline_rides, lift_bps, cannibalization_bps]
    output: CostForecast
    side_effects: ["projected_* fields computed per calculations.cost_forecast; forecast_revision = next monotonic; status=DRAFT"]
  - method: POST
    path: "/cost-forecasts/{id}/approve"
    description: "Approve forecast (OCC on program version; supersedes prior APPROVED)"
    roles: [IncentiveOps]
    code: 200
    input: [expected_program_version]
    output: CostForecast
    side_effects: ["prior APPROVED -> SUPERSEDED; program.forecast_headroom_cents recomputed; program.version += 1"]
  - method: POST
    path: "/cost-forecasts/{id}/reject"
    description: "Reject draft forecast"
    roles: [IncentiveOps]
    code: 200
    input: []
    output: CostForecast
    side_effects: []

  # --- Enrollments ---
  - method: POST
    path: "/incentive-programs/{id}/enrollments"
    description: "Enroll a driver in a program (eligibility + fraud + window + capacity gating)"
    roles: [IncentiveOps]
    code: 201
    input: [driver_id]
    output: IncentiveEnrollment
    side_effects: ["status=ACTIVE; progress_count=0; streak_broken=false"]
  - method: GET
    path: "/enrollments/{id}"
    description: "Get an enrollment"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer, Driver]
    code: 200
    input: []
    output: IncentiveEnrollment
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/cancel"
    description: "Cancel an active enrollment"
    roles: [IncentiveOps, Driver]
    code: 200
    input: []
    output: IncentiveEnrollment
    side_effects: ["BONUS_ZONE: capacity slot released"]

  # --- Rides ---
  - method: POST
    path: "/rides"
    description: "Record a ride offer"
    roles: [Driver]
    code: 201
    input: [driver_id, market_id, ride_type, geo_cell_id, base_fare_cents, tips_cents]
    output: Ride
    side_effects: ["status=OFFERED; offer event folded into driver rolling rates"]
  - method: POST
    path: "/rides/{id}/accept"
    description: "Accept offered ride"
    roles: [Driver]
    code: 200
    input: []
    output: Ride
    side_effects: ["accept folded into rolling rates"]
  - method: POST
    path: "/rides/{id}/decline"
    description: "Decline offered ride"
    roles: [Driver]
    code: 200
    input: []
    output: Ride
    side_effects: ["decline folded into rolling rates; STREAK streak_broken latch"]
  - method: POST
    path: "/rides/{id}/complete"
    description: "Complete accepted ride"
    roles: [Driver]
    code: 200
    input: []
    output: Ride
    side_effects: ["progress on covering ACTIVE enrollments; streak/challenge completion payouts; budget_spent += payout"]
  - method: POST
    path: "/rides/{id}/cancel"
    description: "Cancel accepted ride"
    roles: [Driver]
    code: 200
    input: [cancelled_by]
    output: Ride
    side_effects: ["DRIVER: cancellation rate impact + streak break; RIDER: none"]
  - method: POST
    path: "/rides/{id}/flag-review"
    description: "Flag a completed ride for fraud review"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: Ride
    side_effects: ["COMPLETED -> UNDER_REVIEW; FINALIZED settlements for driver+week -> REOPENED"]
  - method: POST
    path: "/rides/{id}/clear-review"
    description: "Clear ride back to COMPLETED"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: Ride
    side_effects: ["re-included in FINAL guarantee basis"]
  - method: POST
    path: "/rides/{id}/void"
    description: "Void a ride confirmed fraudulent"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: Ride
    side_effects: ["qualifying_earnings -> 0; statement negative adjustment; fraud posture recompute cascade"]
  - method: GET
    path: "/rides/{id}"
    description: "Get a ride"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer, FraudAnalyst, Driver]
    code: 200
    input: []
    output: Ride
    side_effects: []
  - method: GET
    path: "/rides"
    description: "List rides"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer, FraudAnalyst]
    code: 200
    input: ["driver_id?", "market_id?", "status?", "limit?", "offset?"]
    output: "Ride[]"
    side_effects: []

  # --- Fraud ---
  - method: POST
    path: "/fraud-flags"
    description: "Open a fraud flag on a driver anchored to a ride"
    roles: [FraudAnalyst]
    code: 201
    input: [driver_id, ride_id, signal_type, severity, "ring_id?"]
    output: FraudFlag
    side_effects: ["status=OPEN; acute/chronic scores computed"]
  - method: GET
    path: "/fraud-flags/{id}"
    description: "Get a fraud flag"
    roles: [PlatformAdmin, FraudAnalyst]
    code: 200
    input: []
    output: FraudFlag
    side_effects: []
  - method: GET
    path: "/fraud-flags"
    description: "List fraud flags"
    roles: [PlatformAdmin, FraudAnalyst]
    code: 200
    input: ["driver_id?", "ring_id?", "ride_id?", "status?", "limit?", "offset?"]
    output: "FraudFlag[]"
    side_effects: []
  - method: POST
    path: "/fraud-flags/{id}/confirm"
    description: "Confirm a fraud flag"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: FraudFlag
    side_effects: ["driver fraud_posture recompute; anchor ride COMPLETED -> UNDER_REVIEW; ring members WATCH floor; RESTRICTED cascade"]
  - method: POST
    path: "/fraud-flags/{id}/dismiss"
    description: "Dismiss a fraud flag"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: FraudFlag
    side_effects: ["driver fraud_posture recompute"]

  # --- Settlements ---
  - method: POST
    path: "/settlements/compute"
    description: "Compute (create DRAFT) a guarantee settlement for a driver+program+week under the PROVISIONAL variant"
    roles: [PaymentsOfficer]
    code: 201
    input: [driver_id, program_id, week_start_utc]
    output: GuaranteeSettlement
    side_effects: ["promised/actual/make_up computed (PROVISIONAL); status=DRAFT"]
  - method: GET
    path: "/settlements/{id}"
    description: "Get a settlement"
    roles: [PlatformAdmin, PaymentsOfficer, Driver]
    code: 200
    input: []
    output: GuaranteeSettlement
    side_effects: []
  - method: GET
    path: "/settlements"
    description: "List settlements"
    roles: [PlatformAdmin, PaymentsOfficer]
    code: 200
    input: ["driver_id?", "program_id?", "status?", "limit?", "offset?"]
    output: "GuaranteeSettlement[]"
    side_effects: []
  - method: POST
    path: "/settlements/{id}/finalize"
    description: "Finalize settlement (FINAL variant; all week rides terminal)"
    roles: [PaymentsOfficer]
    code: 200
    input: []
    output: GuaranteeSettlement
    side_effects: ["make_up recomputed FINAL; REOPENED->FINALIZED supported"]
  - method: POST
    path: "/settlements/{id}/pay"
    description: "Pay make-up amount (budget-gated)"
    roles: [PaymentsOfficer]
    code: 200
    input: []
    output: GuaranteeSettlement
    side_effects: ["market.budget_spent += make_up; statement recompute"]
  - method: POST
    path: "/settlements/{id}/reopen"
    description: "Reopen a finalized settlement"
    roles: [PaymentsOfficer]
    code: 200
    input: []
    output: GuaranteeSettlement
    side_effects: ["basis back to PROVISIONAL semantics"]
  - method: POST
    path: "/settlements/{id}/void"
    description: "Void an unpaid settlement"
    roles: [PaymentsOfficer]
    code: 200
    input: []
    output: GuaranteeSettlement
    side_effects: ["excluded from budget and statement aggregations"]

  # --- Statements ---
  - method: POST
    path: "/statements/compute"
    description: "Compute (create DRAFT) an earnings statement for driver+week"
    roles: [PaymentsOfficer]
    code: 201
    input: [driver_id, week_start_utc]
    output: EarningsStatement
    side_effects: ["all totals computed per calculations.weekly_earnings_total"]
  - method: GET
    path: "/statements/{id}"
    description: "Get a statement"
    roles: [PlatformAdmin, PaymentsOfficer, Driver]
    code: 200
    input: []
    output: EarningsStatement
    side_effects: []
  - method: GET
    path: "/statements"
    description: "List statements"
    roles: [PlatformAdmin, PaymentsOfficer]
    code: 200
    input: ["driver_id?", "status?", "limit?", "offset?"]
    output: "EarningsStatement[]"
    side_effects: []
  - method: POST
    path: "/statements/{id}/publish"
    description: "Publish statement (requires all week settlements PAID or VOID)"
    roles: [PaymentsOfficer]
    code: 200
    input: []
    output: EarningsStatement
    side_effects: []

  # --- Appeals ---
  - method: POST
    path: "/appeals"
    description: "File an appeal (ELIGIBILITY or STATEMENT subject)"
    roles: [Driver]
    code: 201
    input: [driver_id, subject_type, reason, "statement_id?", "adjustment_cents?"]
    output: Appeal
    side_effects: ["STATEMENT subject: statement -> DISPUTED"]
  - method: GET
    path: "/appeals/{id}"
    description: "Get an appeal"
    roles: [PlatformAdmin, PaymentsOfficer, Driver]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/appeals"
    description: "List appeals"
    roles: [PlatformAdmin, PaymentsOfficer]
    code: 200
    input: ["driver_id?", "status?", "subject_type?", "statement_id?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []
  - method: POST
    path: "/appeals/{id}/start-review"
    description: "Start reviewing an appeal"
    roles: [PaymentsOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/appeals/{id}/request-info"
    description: "Request more info from driver (max 2 rounds)"
    roles: [PaymentsOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/appeals/{id}/provide-info"
    description: "Driver provides requested info (cyclic loop back to UNDER_REVIEW)"
    roles: [Driver]
    code: 200
    input: []
    output: Appeal
    side_effects: ["round_count += 1"]
  - method: POST
    path: "/appeals/{id}/resolve"
    description: "Resolve appeal (UPHELD | OVERTURNED); ESCALATED appeals require PlatformAdmin"
    roles: [PaymentsOfficer, PlatformAdmin]
    code: 200
    input: [outcome, "adjustment_cents?"]
    output: Appeal
    side_effects: ["OVERTURNED on STATEMENT: statement AMENDED with adjustment; OVERTURNED on ELIGIBILITY: driver rate_posture reset"]
  - method: POST
    path: "/appeals/{id}/escalate"
    description: "Escalate after both info rounds exhausted"
    roles: [PaymentsOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/appeals/{id}/withdraw"
    description: "Driver withdraws appeal"
    roles: [Driver]
    code: 200
    input: []
    output: Appeal
    side_effects: ["STATEMENT subject: statement back to PUBLISHED"]

  # --- Supply shortfalls ---
  - method: POST
    path: "/supply-shortfalls"
    description: "Declare a supply shortfall for a market geo-cell hour bucket"
    roles: [IncentiveOps]
    code: 201
    input: [market_id, geo_cell_id, hour_bucket, severity_bps]
    output: SupplyShortfall
    side_effects: ["recommended_bonus_cents computed"]
  - method: GET
    path: "/supply-shortfalls/{id}"
    description: "Get a shortfall"
    roles: [PlatformAdmin, IncentiveOps]
    code: 200
    input: []
    output: SupplyShortfall
    side_effects: []
  - method: POST
    path: "/supply-shortfalls/{id}/address"
    description: "Mark a shortfall addressed"
    roles: [IncentiveOps]
    code: 200
    input: []
    output: SupplyShortfall
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Missing/invalid X-User-Role/X-User-ID, or role not permitted for the endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, integer out of range, malformed datetime" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that permits the transition (per §1.2)" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version != current IncentiveProgram.version on forecast approve" }
  - { id: ERR_STALE_MARKET_VERSION, http: 412, condition: "expected_market_version != current Market.version on budget update" }
  - { id: ERR_PROGRAM_CONFIG_INCOMPLETE, http: 400, condition: "Program-type-specific required config fields missing or invalid (e.g., STREAK without streak_length)" }
  - { id: ERR_PROGRAM_WINDOW_CONFLICT, http: 422, condition: "window_start >= window_end; BONUS_ZONE same-cell half-open overlap with ACTIVE zone program; or BONUS_ZONE capacity exceeded on enrollment" }
  - { id: ERR_CROSS_MARKET_REFERENCE, http: 422, condition: "Referential incoherence: driver.market != program.market on enrollment; appeal statement belongs to another driver; geo_cell_id not in market.geo_cells" }
  - { id: ERR_DRIVER_INELIGIBLE, http: 422, condition: "driver.rate_posture == INELIGIBLE blocks enrollment" }
  - { id: ERR_FRAUD_RESTRICTED, http: 422, condition: "driver.fraud_posture == RESTRICTED blocks enrollment and settlement finalize" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "Reservation/pay/budget-update would drive budget_available negative" }
  - { id: ERR_RIDE_NOT_COMPLETABLE, http: 409, condition: "Complete/flag/void attempted from a non-source state" }
  - { id: ERR_RIDE_ALREADY_TERMINAL, http: 409, condition: "Action on a terminal ride (COMPLETED/DRIVER_CANCELLED/RIDER_CANCELLED/DECLINED/VOIDED) that requires a live state" }
  - { id: ERR_SETTLEMENT_RIDES_PENDING, http: 409, condition: "Finalize attempted while any week ride is UNDER_REVIEW" }
  - { id: ERR_SETTLEMENT_ALREADY_PAID, http: 409, condition: "Reopen/void on a PAID settlement" }
  - { id: ERR_STATEMENT_SETTLEMENTS_OPEN, http: 409, condition: "Publish attempted while a week settlement is DRAFT/FINALIZED/REOPENED" }
  - { id: ERR_APPEAL_ROUNDS_EXHAUSTED, http: 422, condition: "request-info beyond round_count == 2" }
  - { id: ERR_APPEAL_NOT_ESCALATABLE, http: 422, condition: "escalate before round_count == 2" }
  - { id: ERR_APPEAL_ADJUSTMENT_REQUIRED, http: 400, condition: "OVERTURNED resolution of a STATEMENT appeal without non-zero adjustment_cents" }
  - { id: ERR_APPEAL_IDENTITY_MISMATCH, http: 403, condition: "Acting X-User-ID (Driver) != appeal.driver_id on provide-info/withdraw" }
  - { id: ERR_FORECAST_NOT_DRAFT, http: 409, condition: "Approve/reject a non-DRAFT forecast" }
  - { id: ERR_ENROLLMENT_DUPLICATE, http: 409, condition: "Driver already has an ACTIVE enrollment on the same program" }
  - { id: ERR_PROGRAM_NOT_GUARANTEE, http: 422, condition: "Settlement compute against a non-GUARANTEE program" }
  - { id: ERR_GEO_CELL_UNKNOWN, http: 422, condition: "geo_cell_id not a member of market.geo_cells (ride, zone program, or shortfall)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages markets, driver lifecycle, escalated appeals, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /markets; PUT /markets/{id}; freeze/unfreeze/close"
      - "POST /drivers/{id}/deactivate"
      - "POST /appeals/{id}/resolve on ESCALATED appeals"
    shared_operations:
      - "All GET endpoints"
  - name: IncentiveOps
    description: "Incentive program designer; owns programs, enrollments, forecasts, shortfalls, driver onboarding and rate-event feeds"
    identity: opaque
    exclusive_operations:
      - "POST /drivers; POST /drivers/{id}/rate-events"
      - "POST /incentive-programs; activate/pause/resume/retire"
      - "POST /incentive-programs/{id}/cost-forecasts; approve/reject"
      - "POST /incentive-programs/{id}/enrollments"
      - "POST /supply-shortfalls; address"
    shared_operations:
      - "GET endpoints for markets, drivers, programs, enrollments, rides"
  - name: PaymentsOfficer
    description: "Payments operator; computes/finalizes/pays settlements, publishes statements, processes appeals"
    identity: opaque
    exclusive_operations:
      - "POST /settlements/compute; finalize/pay/reopen/void"
      - "POST /statements/compute; publish"
      - "POST /appeals/{id}/start-review; request-info; escalate; resolve (non-escalated)"
    shared_operations:
      - "GET endpoints for drivers, settlements, statements, appeals"
  - name: FraudAnalyst
    description: "Fraud investigator; owns ride review and fraud flags"
    identity: opaque
    exclusive_operations:
      - "POST /rides/{id}/flag-review; clear-review; void"
      - "POST /fraud-flags; confirm; dismiss"
    shared_operations:
      - "GET endpoints for rides, drivers, fraud flags"
  - name: Driver
    description: "Rideshare driver; acts on own rides and appeals only (X-User-ID == Driver.id)"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /rides (as driver_id == self); accept/decline/complete/cancel"
      - "POST /appeals (driver_id == self); provide-info; withdraw"
    shared_operations:
      - "GET /drivers/{id} (self), /drivers/{id}/rides, /drivers/{id}/enrollments, /drivers/{id}/settlements, /drivers/{id}/statements"
      - "GET /incentive-programs, /incentive-programs/{id}"
