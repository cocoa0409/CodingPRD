  # ===========================================================================
  # Rule 6 -- boundary-precision checks on different metrics / endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: damage_points_inclusive_threshold_24_stays_serviceable_25_goes_out_of_service
        grounds:
          - calculations.trailer_service_status
          - entities.Trailer.fields.damage_points
          - entities.Trailer.fields.last_damage_repair_at
          - state_machines.Trailer.service_status.SERVICEABLE_to_OOS_DAMAGE
        distinguishing_aspect: |
          NUMERIC INCLUSIVE-THRESHOLD BOUNDARY ON THE damage_points METRIC, reached through
          POST /fleet/damage-assessments/{id}/submit: 24 points leaves service_status SERVICEABLE
          and exactly 25 points (the OOS_DAMAGE_POINT_THRESHOLD itself) flips it to OOS_DAMAGE. A
          DAMAGE_REPAIR event in between resets the watermark to 0 so both sides of the boundary
          are observed on the same trailer.
        test_recipe:
          setup:
            - "Branch WST-01, one DRY_VAN_53 trailer T-1001, one rate card, tier-B customer with a 3,000,000 cent certificate."
