      - name: response_envelope_shape_for_success_and_error
        claim_type: standard_crud
        grounds: ['response_envelope']
        distinguishing_aspect: "Success responses carry meta.api_request_id/meta.api_request_timestamp and response_type object; error responses carry response_type error and data.error_id + data.message."
        test_recipe:
          setup: ["Building B exists"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Envelope House" }
              as: SecurityAdmin
              captures: { b: $.data.id }
          trigger:
            - call: "GET /buildings/${b}"
              as: SecurityAdmin
              captures: { ok_body: $.data }
            - call: "GET /buildings/00000000-0000-0000-0000-000000000000"
              as: SecurityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Success envelope: meta.api_request_id present, response_type == 'object', data.id == ${b}"
            - "Error envelope: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message present"

