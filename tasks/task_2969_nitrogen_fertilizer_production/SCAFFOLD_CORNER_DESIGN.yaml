            - "ProductionRun.${run_id}.status == RUNNING"
            - "ProductionRun.${run_id}.catalyst_charge_id == ${charge_id}"
            - "ProductionRun.${run_id}.provisional_unit_cost_usd_per_ton == 181.10"
            - "ProductionRun.${run_id}.final_unit_cost_usd_per_ton == null"
            - "ProductionRun.${run_id}.consumed_gas_mmbtu == 0"
            - "ReformerTrain.${train_id}.status == RUNNING"
            - "CatalystCharge.${charge_id}.status == ACTIVE"
            - "CatalystCharge.${charge_id}.cumulative_operating_hours == 0"

      - name: turnaround_approve_arm_stamps_approver_and_leaves_tasks_pending
        claim_type: branching
        grounds:
          - state_machines.Turnaround.SUBMITTED_to_APPROVED
          - complexity_profile.state_machine_shape
          - entities.Turnaround.fields.approved_by_user_id
