  # ===========================================================================
  # Guide section 3 — Calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: pie_rotation_limit_rejects_sixth_consecutive_year
        claim_type: constants_applied
        grounds:
          - calculations.partner_rotation_check
          - validations[priority=15]
          - errors[ERR_PARTNER_ROTATION_LIMIT]
          - entities.Client.fields.partner_rotation_limit_years
        distinguishing_aspect: |
          For a public-interest entity the limit is ROTATION_LIMIT_PIE 5, so with engagements
          for 2021, 2022, 2023, 2024 and 2025 the backwards run is 5 and the requested 2026
          engagement would be the 6th consecutive year — rejected with
          ERR_PARTNER_ROTATION_LIMIT, a year earlier than a non-PIE client would be.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T09:00:00Z."
            - "PIE client AURORA (FINANCIAL_SERVICES, public_interest_entity true -> partner_rotation_limit_years 5) and DOMESTIC partner P1."
            - "Five engagements of P1 on AURORA for busy_season_year 2021, 2022, 2023, 2024 and 2025 (an unbroken run)."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/clients"
              payload: { name: "Aurora Federal Bancorp", industry_code: "FINANCIAL_SERVICES", public_interest_entity: true, fiscal_year_end: "2026-12-31" }
              as: FirmAdmin
              captures: { c_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Pat Rowe", level: "PARTNER", service_center: "DOMESTIC", industry_specialization: "FINANCIAL_SERVICES", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 400.00 }
              as: FirmAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2021, deadline_date: "2021-10-15", budget_fee_amount: 6000.00 }
              as: SchedulingManager
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2022, deadline_date: "2022-10-15", budget_fee_amount: 6000.00 }
              as: SchedulingManager
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2023, deadline_date: "2023-10-15", budget_fee_amount: 6000.00 }
              as: SchedulingManager
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2024, deadline_date: "2024-10-15", budget_fee_amount: 6000.00 }
              as: SchedulingManager
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2025, deadline_date: "2025-10-15", budget_fee_amount: 6000.00 }
              as: SchedulingManager
          trigger:
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2026, deadline_date: "2026-10-15", budget_fee_amount: 6000.00 }
              as: SchedulingManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err_id} == 'ERR_PARTNER_ROTATION_LIMIT'"
            - "a follow-up GET /scheduling/clients/${c_id} reports engagement_count == 5 and partner_rotation_limit_years == 5 (no 2026 row was created)"

      - name: rotation_run_resets_after_a_gap_year
        claim_type: correct_result
        grounds:
          - calculations.partner_rotation_check
          - validations[priority=15]
          - entities.Client.fields.engagement_count
        distinguishing_aspect: |
          The run walks strictly backwards from busy_season_year - 1 and stops at the first
          missing year, so a partner with 2020-2024 on a PIE client but nothing in 2025 may
          take 2026: consecutive_years_including_request is 1, not 6, and the client's
          engagement_count reaches 6.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T09:00:00Z."
            - "PIE client AURORA (partner_rotation_limit_years 5) and DOMESTIC partner P1."
            - "Five engagements of P1 on AURORA for 2020, 2021, 2022, 2023 and 2024; 2025 is deliberately absent."
