            - call: "POST /items/${item_id}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 8000, expected_item_version: "${iv}" }
              as: IntakeGrader
            - call: "POST /items/${item_id}/list"
              payload: {}
              as: IntakeGrader
            - call: "POST /sales"
              payload: { lines: [{item_id: "${item_id}"}], payment_method: "CARD" }
              as: CashierClerk
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/void"
              payload: {}
              as: CashierClerk
          assert:
            - "GET /consignors/${cons_id} -> data.unsettled_payable_cents == 0"
            - "GET /consignors/${cons_id}/ledger-entries -> sum(data[*].amount_cents) == 0"

      - name: store_credit_void_conserves_store_credit_balance
        grounds:
          - state_machines.Sale.COMPLETED_to_VOIDED
          - entities.StoreCreditTransaction.fields.amount_cents
          - entities.Consignor.fields.store_credit_cents
        distinguishing_aspect: |
          Conserved quantity = consignor.store_credit_cents (a DIFFERENT conserved
          quantity from cash payable): a STORE_CREDIT sale ISSUE(+4400) followed by
          void's offsetting store-credit VOID entry leaves store_credit_cents back
          at its pre-sale value 0.
        test_recipe:
          setup:
            - "One STORE_CREDIT GROSS consignor split 0.50 with store_credit_cents==0; one ON_FLOOR item priced 8000c (would ISSUE 4400 on sale)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Credit Conserve", email: "creditcon@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50, split_basis: "GROSS", payout_method: "STORE_CREDIT" }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Credit coat" }
              as: IntakeGrader
              captures: { item_id: $.data.id, iv: $.data.version }
            - call: "POST /items/${item_id}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 8000, expected_item_version: "${iv}" }
              as: IntakeGrader
            - call: "POST /items/${item_id}/list"
              payload: {}
              as: IntakeGrader
            - call: "POST /sales"
              payload: { lines: [{item_id: "${item_id}"}], payment_method: "CARD" }
              as: CashierClerk
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/void"
              payload: {}
              as: CashierClerk
          assert:
            - "GET /consignors/${cons_id} -> data.store_credit_cents == 0"
            - "GET /consignors/${cons_id}/store-credit/transactions -> sum(POSTED data[*].amount_cents) == 0"
