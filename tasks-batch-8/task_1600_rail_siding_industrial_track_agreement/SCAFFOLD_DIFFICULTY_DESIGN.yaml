              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { err_blocked: $.data.error_id }
            - call: "POST /inspections"
              payload: { agreement_id: "${agr_id}", segment_id: "${seg_id}", scheduled_date: "2026-08-04" }
              as: SafetyInspector
              captures: { insp2: $.data.id }
            - call: "POST /inspections/${insp2}/record-result"
              payload: { result: "PASS", completed_date: "2026-08-04", cited_device_ids: ["${dev_id}"] }
