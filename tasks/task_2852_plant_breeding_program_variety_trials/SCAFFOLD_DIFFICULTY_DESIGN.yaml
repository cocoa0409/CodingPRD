              payload: { line_id: "${line_id}", target_market: "CA_PRAIRIE", market_allocations: [{ market_code: "CA_PRAIRIE", demand_kg: 9000 }], launch_year: 2028 }
              as: SupplyPlanner
            - call: "POST /breeding-lines/${line_id}/stewardship-agreements"
              payload: { approved_markets: ["CA_PRAIRIE"], regulatory_dossier_ref: "DOS-2852-06", grower_agreement_ref: "GA-2852-06", effective_from: "2026-09-01", effective_to: "2029-09-01" }
              as: RegulatoryOfficer
              as_user_id: "ro-1"
              captures: { agr_id: $.data.id }
            - call: "POST /stewardship-agreements/${agr_id}/submit"
              payload: {}
              as: RegulatoryOfficer
              as_user_id: "ro-1"
            - call: "POST /stewardship-agreements/${agr_id}/review"
              payload: { outcome: "APPROVE" }
