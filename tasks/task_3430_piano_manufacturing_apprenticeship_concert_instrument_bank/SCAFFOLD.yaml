# =============================================================================
# PRD Benchmark Scaffold — Piano Manufacturing Apprenticeship & Concert Instrument Bank
# =============================================================================

scenario: |
  Piano Manufacturing Apprenticeship & Concert Instrument Bank (Steinway & Sons): multi-year build cycle with wood selection, rim bending, seasoning and action regulation requiring long work-in-process inventory, craft apprenticeship programs with skill progression for specialized operations that take years to master, concert and artist bank where instruments are maintained for touring performers with selection visits and technician support, artist relationship programs with instrument selection privileges and performance requirements, dealer network with showroom standards, selection room experiences and consignment arrangements, restoration and rebuilding services for older instruments with parts authenticity decisions, limited edition and art case instruments with design collaboration and commission terms, humidity-controlled logistics for delivery and long-term instrument care programs

domain_name: piano-manufacturing-bank
api_prefix: /piano-works

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: WoodBatch
    parent: null
    common_fields: true
    fields:
      - { name: species, type: enum, source: input, description: "SPRUCE | MAPLE | MAHOGANY | BIRCH" }
      - { name: moisture_content_pct, type: number, source: input, description: "Latest moisture reading in percent; updated by each moisture reading" }
      - { name: status, type: enum, source: system, description: "DRYING | CONDITIONED | ALLOCATED | CONSUMED | REJECTED", default: DRYING }
      - { name: drying_started_at, type: datetime, source: system, description: "Logical clock timestamp at creation; start of the drying window" }
      - { name: conditioned_at, type: datetime, source: system, description: "Logical clock timestamp when the batch auto-transitioned to CONDITIONED; null until then", constraints: "nullable" }

  - name: BuildOrder
    parent: null
    common_fields: true
    fields:
      - { name: model, type: enum, source: input, description: "MODEL_D | MODEL_B | MODEL_O | ART_CASE" }
      - { name: wood_batch_id, type: string, source: input, description: "FK -> WoodBatch.id; allocated batch. Cleared to null by the wood-reject rework cascade; nullable" }
      - { name: status, type: enum, source: system, description: "COMMISSIONED | RIM_BENT | SEASONING | ACTION_REGULATION | VOICING | COMPLETED", default: COMMISSIONED }
      - { name: seasoning_started_at, type: datetime, source: system, description: "Logical clock timestamp of entry into SEASONING; null before first entry and cleared on rework", constraints: "nullable" }
      - { name: commissioned_note, type: string, source: input, description: "Commission terms text (art-case design collaboration notes)", constraints: "optional, may be empty string", default: "" }
      - { name: wip_value_cents, type: integer, source: computed, description: "ACTUAL variant of wip_valuation; recomputed on every stage log, batch allocation, and rework" }

  - name: BuildStageLog
    parent: BuildOrder
    common_fields: false
    fields:
      - { name: build_order_id, type: string, source: system, description: "FK -> BuildOrder.id; owning build order" }
      - { name: to_stage, type: enum, source: system, description: "Stage entered: RIM_BENT | SEASONING | ACTION_REGULATION | VOICING | COMPLETED" }
      - { name: operation_type, type: enum, source: system, description: "Operation credited, derived from to_stage: RIM_BENDING | SEASONING_CHECK | ACTION_REGULATION | VOICING" }
      - { name: hours_applied, type: number, source: input, description: "Hours of craft work logged by this stage advance; 0 < hours_applied <= 500" }
      - { name: actor_role, type: enum, source: system, description: "MasterCraftsman | Apprentice — role of the advancing caller" }
      - { name: actor_id, type: string, source: system, description: "Craftsman.id or Apprentice.id of the advancing caller (plain reference, not an FK constraint target)" }
      - { name: supervising_craftsman_id, type: string, source: input, description: "Craftsman.id supervising an apprentice advance; null for unsupervised advances", constraints: "nullable" }
      - { name: logged_at, type: datetime, source: system, description: "Logical clock timestamp of the advance" }

  - name: Craftsman
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Craftsman full name" }
      - { name: specialty, type: enum, source: input, description: "RIM_BENDING | SEASONING_CHECK | ACTION_REGULATION | VOICING — master-level qualification used by stage-advance gates and supervision-credit matching" }

  - name: Apprentice
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Apprentice full name" }

  - name: SkillEndorsement
    parent: null
    common_fields: true
    fields:
      - { name: apprentice_id, type: string, source: input, description: "FK -> Apprentice.id; owner of this endorsement track" }
      - { name: operation_type, type: enum, source: input, description: "RIM_BENDING | SEASONING_CHECK — apprentice-trainable operations only; ACTION_REGULATION/VOICING are rejected with ERR_VALIDATION" }
      - { name: status, type: enum, source: system, description: "IN_TRAINING | PENDING_ASSESSMENT | ENDORSED | REVOKED", default: IN_TRAINING }
      - { name: logged_hours, type: number, source: computed, description: "Sum of raw hours over supervision_log entries" }
      - { name: effective_hours, type: number, source: computed, description: "Per-entry rounded credited hours per effective_training_hours calculation" }
      - { name: supervision_log, type: array, source: system, description: "Append-only entries {supervising_craftsman_id, hours, specialty_match, logged_at}; null craftsman id allowed for endorsed unsupervised work" }
      - { name: endorsed_by_craftsman_id, type: string, source: system, description: "FK -> Craftsman.id; assessor who endorsed; null until ENDORSED", constraints: "nullable" }

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - { name: build_order_id, type: string, source: system, description: "FK -> BuildOrder.id; the completed build that produced this instrument" }
      - { name: model, type: enum, source: system, description: "Copied from BuildOrder.model: MODEL_D | MODEL_B | MODEL_O | ART_CASE" }
      - { name: serial_number, type: string, source: system, description: "Server-minted serial, format PIN-######## sequential" }
      - { name: status, type: enum, source: system, description: "SHOWROOM | BANK | ON_LOAN | RESTORATION", default: SHOWROOM }
      - { name: condition_grade, type: enum, source: system, description: "A | B | C | D — A at creation; overwritten by loan return observation; bumped one letter on restoration completion" }
      - { name: certified_authentic, type: boolean, source: system, description: "true at creation; set false when a restoration completes below the authenticity threshold", default: true }

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Artist stage name" }
      - { name: tier, type: enum, source: input, description: "STANDARD | PRIVILEGED — drives loan fee factor" }
      - { name: performance_quota, type: integer, source: input, description: "Performances required per 365-day review period; > 0" }
      - { name: performances_logged, type: integer, source: computed, description: "Realized performances counted in the current review period", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: next_review_date, type: datetime, source: system, description: "Logical clock timestamp of next scheduled review; created_at + 365 days" }
      - { name: standing_realized, type: integer, source: computed, description: "performance_standing REALIZED variant: performances_logged only" }
      - { name: standing_forward, type: integer, source: computed, description: "performance_standing FORWARD_LOOKING variant: performances_logged plus projected tour-week credits of ON_TOUR loans" }

  - name: ConcertLoan
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: system, description: "FK -> Artist.id; taken from X-User-ID of the creating Artist caller" }
      - { name: desired_model, type: enum, source: input, description: "MODEL_D | MODEL_B | MODEL_O | ART_CASE" }
      - { name: tour_start, type: datetime, source: input, description: "First tour day (inclusive); must be >= current clock date" }
      - { name: tour_end, type: datetime, source: input, description: "Day after final tour day (exclusive); must be > tour_start" }
      - { name: instrument_id, type: string, source: system, description: "FK -> Instrument.id; null until confirm", constraints: "nullable" }
      - { name: technician_id, type: string, source: system, description: "FK -> Craftsman.id; assigned at confirm; null until then", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ON_TOUR | RETURNED", default: REQUESTED }
      - { name: fee_cents, type: integer, source: computed, description: "loan_fee_estimate result, fixed at confirm; null until then", constraints: "nullable" }

  - name: RestorationCase
    parent: null
    common_fields: true
    fields:
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id; instrument under restoration" }
      - { name: lead_craftsman_id, type: string, source: input, description: "FK -> Craftsman.id; restoration lead" }
      - { name: origin, type: enum, source: system, description: "MANUAL | LOAN_RETURN — how the case was opened", default: MANUAL }
      - { name: diagnosis, type: string, source: input, description: "Assessment narrative; auto-filled for LOAN_RETURN cases" }
      - { name: status, type: enum, source: system, description: "QUOTED | DISASSEMBLED | REBUILT | AUTHENTICITY_HOLD | COMPLETED", default: QUOTED }
      - { name: authentic_parts_value_cents, type: integer, source: input, description: "Value of authentic parts in the current quote; >= 0" }
      - { name: total_parts_value_cents, type: integer, source: input, description: "Value of all parts in the current quote; >= authentic_parts_value_cents, >= 0" }
      - { name: waiver_accepted, type: boolean, source: input, description: "Client accepts sub-threshold authenticity; may complete with certified_authentic = false", default: false }
      - { name: authenticity_pct, type: number, source: computed, description: "Null while total_parts_value_cents == 0; else round_half_up(100 * authentic / total, 1 decimal)" }
      - { name: final_authentic_value_cents, type: integer, source: input, description: "Actual authentic parts value declared at completion", constraints: "null until complete" }
      - { name: final_total_parts_value_cents, type: integer, source: input, description: "Actual total parts value declared at completion", constraints: "null until complete" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: WoodBatch
    initial_state: DRYING
    terminal_states: [CONSUMED, REJECTED]
    transitions:
      - from: DRYING
        to: CONDITIONED
        trigger: "system: POST /piano-works/wood-batches/{id}/moisture-readings auto-transition"
        actor: system
        preconditions:
          - "New moisture_content_pct <= 8.0 (MOISTURE_READY_PCT; exactly 8.0 passes)"
          - "floor((clock_now - drying_started_at) / 86400s) >= 240 (MIN_DRYING_DAYS; exactly 240 passes)"
        side_effects:
          - "conditioned_at set to clock now"
          - "WoodBatch.version incremented by 1"
      - from: DRYING
        to: REJECTED
        trigger: "POST /piano-works/wood-batches/{id}/reject"
        actor: WorkshopManager
        preconditions: []
        side_effects:
          - "WoodBatch.version incremented by 1"
      - from: CONDITIONED
        to: ALLOCATED
        trigger: "system: POST /piano-works/build-orders allocates the batch"
        actor: system
        preconditions: []
        side_effects:
          - "WoodBatch.version incremented by 1"
      - from: ALLOCATED
        to: REJECTED
        trigger: "POST /piano-works/wood-batches/{id}/reject (seasoning moisture re-check failure)"
        actor: WorkshopManager
        preconditions:
          - "The BuildOrder holding this batch (wood_batch_id == batch.id) is in SEASONING, else ERR_INVALID_STATE"
        side_effects:
          - "REWORK CASCADE link 1: that BuildOrder.status SEASONING -> RIM_BENT, wood_batch_id := null, seasoning_started_at := null, version incremented"
          - "REWORK CASCADE link 2: BuildOrder.wip_value_cents recomputed by wip_valuation (rejected batch material cost dropped)"
          - "WoodBatch.version incremented by 1"
      - from: ALLOCATED
        to: CONSUMED
        trigger: "system: owning BuildOrder reaches COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "WoodBatch.version incremented by 1"
      - from: CONDITIONED
        to: REJECTED
        trigger: "POST /piano-works/wood-batches/{id}/reject"
        actor: WorkshopManager
        preconditions: []
        side_effects:
          - "WoodBatch.version incremented by 1"

  - entity: BuildOrder
    initial_state: COMMISSIONED
    terminal_states: [COMPLETED]
    transitions:
      - from: COMMISSIONED
        to: RIM_BENT
        trigger: "POST /piano-works/build-orders/{id}/advance (to_stage=RIM_BENT, operation RIM_BENDING)"
        actor: MasterCraftsman | Apprentice
        preconditions:
          - "expected_build_order_version == current version (ERR_STALE_VERSION)"
          - "wood_batch_id is not null and the batch status == ALLOCATED"
          - "Actor gate: MasterCraftsman specialty == RIM_BENDING, or Apprentice with ENDORSED SkillEndorsement (operation_type=RIM_BENDING), or Apprentice with IN_TRAINING/PENDING_ASSESSMENT endorsement plus supervising_craftsman_id whose specialty == RIM_BENDING (ERR_ENDORSEMENT_REQUIRED)"
        side_effects:
          - "BuildStageLog appended (operation_type=RIM_BENDING, hours_applied)"
          - "Apprentice actor: supervision entry appended to the matching endorsement; effective_hours recomputed"
          - "wip_value_cents recomputed; BuildOrder.version incremented by 1"
      - from: RIM_BENT
        to: SEASONING
        trigger: "POST /piano-works/build-orders/{id}/advance (to_stage=SEASONING, operation SEASONING_CHECK)"
        actor: MasterCraftsman | Apprentice
        preconditions:
          - "expected_build_order_version == current version (ERR_STALE_VERSION)"
          - "If wood_batch_id is null (post-rework), payload wood_batch_id MUST name a CONDITIONED batch (ERR_WOOD_NOT_CONDITIONED / ERR_WOOD_ALREADY_ALLOCATED); it becomes ALLOCATED"
          - "Actor gate on operation SEASONING_CHECK (same rule shape as RIM_BENT advance; ERR_ENDORSEMENT_REQUIRED)"
        side_effects:
          - "seasoning_started_at := clock now"
          - "BuildStageLog appended (operation_type=SEASONING_CHECK)"
          - "Apprentice hours credit; wip_value_cents recomputed; version incremented"
      - from: SEASONING
        to: ACTION_REGULATION
        trigger: "POST /piano-works/build-orders/{id}/advance (to_stage=ACTION_REGULATION, operation SEASONING_CHECK)"
        actor: MasterCraftsman | Apprentice
        preconditions:
          - "expected_build_order_version == current version (ERR_STALE_VERSION)"
          - "floor((clock_now - seasoning_started_at)/86400s) >= 365 (SEASONING_MIN_DAYS; exactly 365 passes, else ERR_SEASONING_INCOMPLETE)"
          - "Actor gate on operation SEASONING_CHECK"
        side_effects:
          - "BuildStageLog appended (operation_type=SEASONING_CHECK)"
          - "Apprentice hours credit; wip_value_cents recomputed; version incremented"
      - from: ACTION_REGULATION
        to: VOICING
        trigger: "POST /piano-works/build-orders/{id}/advance (to_stage=VOICING, operation ACTION_REGULATION)"
        actor: MasterCraftsman
        preconditions:
          - "expected_build_order_version == current version (ERR_STALE_VERSION)"
          - "MasterCraftsman specialty == ACTION_REGULATION (apprentices always ERR_ENDORSEMENT_REQUIRED)"
        side_effects:
          - "BuildStageLog appended (operation_type=ACTION_REGULATION); wip recomputed; version incremented"
      - from: VOICING
        to: COMPLETED
        trigger: "POST /piano-works/build-orders/{id}/advance (to_stage=COMPLETED, operation VOICING)"
        actor: MasterCraftsman
        preconditions:
          - "expected_build_order_version == current version (ERR_STALE_VERSION)"
          - "MasterCraftsman specialty == VOICING"
        side_effects:
          - "BuildStageLog appended (operation_type=VOICING); wip recomputed; version incremented"
          - "Instrument created: SHOWROOM, condition_grade A, certified_authentic true, model copied, serial minted"
          - "Allocated WoodBatch -> CONSUMED"
      - from: SEASONING
        to: RIM_BENT
        trigger: "system: wood-reject rework cascade only (never via advance)"
        actor: system
        preconditions: []
        side_effects:
          - "wood_batch_id := null; seasoning_started_at := null; version incremented; wip recomputed"

  - entity: SkillEndorsement
    initial_state: IN_TRAINING
    terminal_states: []
    transitions:
      - from: IN_TRAINING
        to: PENDING_ASSESSMENT
        trigger: "system: log-hours or apprentice advance credit raises effective_hours >= HOURS_REQUIRED[operation_type]"
        actor: system
        preconditions:
          - "effective_hours >= 600 (RIM_BENDING) or >= 300 (SEASONING_CHECK); equality passes"
        side_effects:
          - "SkillEndorsement.version incremented by 1"
      - from: PENDING_ASSESSMENT
        to: ENDORSED
        trigger: "POST /piano-works/skill-endorsements/{id}/assess (outcome=ENDORSE)"
        actor: MasterCraftsman
        preconditions:
          - "Assessor (X-User-ID craftsman) != top supervisor by raw supervision_log hours (tie-break: earliest first entry logged_at) — ERR_SOD_ASSESSOR_IS_SUPERVISOR"
        side_effects:
          - "endorsed_by_craftsman_id := assessor; version incremented"
      - from: PENDING_ASSESSMENT
        to: IN_TRAINING
        trigger: "POST /piano-works/skill-endorsements/{id}/assess (outcome=FAIL)"
        actor: MasterCraftsman
        preconditions:
          - "Same segregation-of-duties rule as ENDORSE (ERR_SOD_ASSESSOR_IS_SUPERVISOR)"
        side_effects:
          - "Every supervision_log entry hours := floor(hours * 0.75); logged_hours and effective_hours recomputed; version incremented"
      - from: ENDORSED
        to: REVOKED
        trigger: "POST /piano-works/skill-endorsements/{id}/review (action=REVOKE)"
        actor: WorkshopManager
        preconditions: []
        side_effects:
          - "effective_hours retained in storage but excluded from endorsed totals; version incremented"
      - from: REVOKED
        to: ENDORSED
        trigger: "POST /piano-works/skill-endorsements/{id}/review (action=REOPEN)"
        actor: WorkshopManager
        preconditions: []
        side_effects:
          - "Reinstatement: status returns to ENDORSED with hours intact; version incremented"

  - entity: Instrument
    initial_state: SHOWROOM
    terminal_states: []
    transitions:
      - from: SHOWROOM
        to: BANK
        trigger: "POST /piano-works/instruments/{id}/bank-intake"
        actor: ArtistLiaison
        preconditions:
          - "certified_authentic == true and condition_grade IN {A, B} (ERR_INSTRUMENT_NOT_BANK_ELIGIBLE)"
        side_effects:
          - "Instrument.version incremented by 1"
      - from: BANK
        to: ON_LOAN
        trigger: "system: POST /piano-works/concert-loans/{id}/confirm binds this instrument"
        actor: system
        preconditions: []
        side_effects:
          - "Instrument.version incremented by 1"
      - from: ON_LOAN
        to: ON_LOAN
        trigger: "system: chained confirm of an adjacent-tour loan on the same instrument"
        actor: system
        preconditions:
          - "Half-open overlap rule already enforced by the confirming loan"
        side_effects:
          - "Status unchanged; Instrument.version incremented by 1"
      - from: ON_LOAN
        to: BANK
        trigger: "system: loan return with condition_grade_observed IN {A, B}"
        actor: system
        preconditions: []
        side_effects:
          - "condition_grade := observed grade; version incremented"
      - from: ON_LOAN
        to: RESTORATION
        trigger: "system: loan return with condition_grade_observed IN {C, D} (grade-drop rule, cascade link 2)"
        actor: system
        preconditions: []
        side_effects:
          - "condition_grade := observed grade; version incremented"
          - "CASCADE link 3: RestorationCase auto-created (origin=LOAN_RETURN, status QUOTED, zero quote values, lead_craftsman_id := returning loan's technician_id)"
      - from: SHOWROOM
        to: RESTORATION
        trigger: "system: POST /piano-works/restorations opens a case"
        actor: system
        preconditions: []
        side_effects:
          - "Instrument.version incremented by 1"
      - from: BANK
        to: RESTORATION
        trigger: "system: POST /piano-works/restorations opens a case"
        actor: system
        preconditions: []
        side_effects:
          - "Instrument.version incremented by 1"
      - from: RESTORATION
        to: BANK
        trigger: "system: restoration completes with certified_authentic true and post-bump grade IN {A, B}"
        actor: system
        preconditions: []
        side_effects:
          - "condition_grade bumped one letter (D->C, C->B, B->A, A->A); certified_authentic recomputed; version incremented"
      - from: RESTORATION
        to: SHOWROOM
        trigger: "system: restoration completes with certified_authentic false or post-bump grade IN {C, D}"
        actor: system
        preconditions: []
        side_effects:
          - "Same grade bump and authenticity recompute; lands in SHOWROOM; version incremented"

  - entity: Artist
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /piano-works/artists/{id}/review with performances_logged < performance_quota"
        actor: ArtistLiaison
        preconditions:
          - "clock now >= next_review_date (ERR_REVIEW_NOT_DUE)"
        side_effects:
          - "performances_logged retained; next_review_date unchanged (re-review allowed after catch-up); version incremented"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /piano-works/artists/{id}/review with performances_logged >= performance_quota"
        actor: ArtistLiaison
        preconditions:
          - "clock now >= next_review_date (ERR_REVIEW_NOT_DUE)"
        side_effects:
          - "performances_logged := 0; next_review_date := clock now + 365 days; version incremented"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /piano-works/artists/{id}/review with performances_logged >= performance_quota"
        actor: ArtistLiaison
        preconditions:
          - "clock now >= next_review_date (ERR_REVIEW_NOT_DUE)"
        side_effects:
          - "performances_logged := 0; next_review_date := next_review_date + 365 days; version incremented"
      - from: SUSPENDED
        to: SUSPENDED
        trigger: "POST /piano-works/artists/{id}/review with performances_logged < performance_quota"
        actor: ArtistLiaison
        preconditions:
          - "clock now >= next_review_date (ERR_REVIEW_NOT_DUE)"
        side_effects:
          - "No field changes except version incremented"

  - entity: ConcertLoan
    initial_state: REQUESTED
    terminal_states: [RETURNED]
    transitions:
      - from: REQUESTED
        to: ON_TOUR
        trigger: "POST /piano-works/concert-loans/{id}/confirm"
        actor: ArtistLiaison
        preconditions:
          - "Artist status == ACTIVE, re-checked at confirm (ERR_ARTIST_NOT_ACTIVE)"
          - "If instrument_id supplied: Instrument status IN {BANK, ON_LOAN}, certified_authentic == true, condition_grade IN {A,B}, model == desired_model (ERR_INSTRUMENT_NOT_ELIGIBLE)"
          - "If instrument_id omitted: selector policy over eligible instruments (status IN {BANK, ON_LOAN}, certified_authentic, grade IN {A,B}, model == desired_model, half-open window free): rank by condition_grade (A before B), tie-break created_at ASC (never id); empty pool -> ERR_NO_ELIGIBLE_INSTRUMENT"
          - "technician_id exists (ERR_NOT_FOUND) and specialty == VOICING (ERR_TECHNICIAN_NOT_QUALIFIED)"
          - "Instrument half-open overlap: for every other ON_TOUR loan bound to this instrument, require existing.tour_end <= new.tour_start OR new.tour_end <= existing.tour_start; equality (adjacency) is allowed; otherwise ERR_LOAN_WINDOW_CONFLICT"
          - "Technician buffered overlap: no other ON_TOUR loan with same technician where NOT(new.tour_start > existing.tour_end + 1 day OR existing.tour_start > new.tour_end + 1 day) (TECH_BUFFER_DAYS=1, ERR_TECHNICIAN_WINDOW_CONFLICT)"
        side_effects:
          - "instrument_id, technician_id bound; fee_cents computed via loan_fee_estimate"
          - "Instrument.status BANK -> ON_LOAN (chained confirm on an ON_LOAN instrument leaves status ON_LOAN); Instrument.version incremented either way"
          - "ConcertLoan.version incremented"
      - from: ON_TOUR
        to: RETURNED
        trigger: "POST /piano-works/concert-loans/{id}/return"
        actor: ArtistLiaison
        preconditions: []
        side_effects:
          - "CASCADE link 1: Instrument.condition_grade := condition_grade_observed"
          - "CASCADE link 2 (caused by link 1): observed IN {A,B} and instrument currently ON_LOAN -> BANK only if no other ON_TOUR loan is bound to it, else stays ON_LOAN; observed IN {C,D} and instrument currently ON_LOAN -> RESTORATION"
          - "CASCADE link 3 (caused by link 2 entering RESTORATION): RestorationCase auto-created (origin=LOAN_RETURN, status QUOTED, quote values 0, lead_craftsman_id := the loan's technician_id, diagnosis 'post-tour condition <grade>')"
          - "Instrument.version incremented; ConcertLoan.version incremented"

  - entity: RestorationCase
    initial_state: QUOTED
    terminal_states: [COMPLETED]
    transitions:
      - from: QUOTED
        to: AUTHENTICITY_HOLD
        trigger: "system: at create/resolve, total_parts_value_cents > 0 and authenticity_pct < 70.0 and waiver_accepted == false"
        actor: system
        preconditions: []
        side_effects:
          - "authenticity_pct recomputed; version incremented"
      - from: QUOTED
        to: DISASSEMBLED
        trigger: "POST /piano-works/restorations/{id}/advance (to_stage=DISASSEMBLED)"
        actor: MasterCraftsman
        preconditions: []
        side_effects:
          - "If payload authenticity_concern == true, transitions to AUTHENTICITY_HOLD instead"
          - "version incremented"
      - from: DISASSEMBLED
        to: REBUILT
        trigger: "POST /piano-works/restorations/{id}/advance (to_stage=REBUILT)"
        actor: MasterCraftsman
        preconditions: []
        side_effects:
          - "version incremented"
      - from: DISASSEMBLED
        to: AUTHENTICITY_HOLD
        trigger: "POST /piano-works/restorations/{id}/advance (to_stage=DISASSEMBLED is current; to_stage=REBUILT with authenticity_concern=true diverts here)"
        actor: MasterCraftsman
        preconditions: []
        side_effects:
          - "version incremented"
      - from: AUTHENTICITY_HOLD
        to: QUOTED
        trigger: "POST /piano-works/restorations/{id}/resolve-authenticity (revised quote values and/or waiver)"
        actor: MasterCraftsman
        preconditions:
          - "New authenticity_pct >= 70.0 or waiver_accepted == true (else ERR_AUTHENTICITY_BELOW_THRESHOLD and case stays in AUTHENTICITY_HOLD)"
        side_effects:
          - "authenticity_pct recomputed from new values; waiver_accepted updated; version incremented"
      - from: REBUILT
        to: COMPLETED
        trigger: "POST /piano-works/restorations/{id}/complete"
        actor: MasterCraftsman
        preconditions:
          - "final_total_parts_value_cents > 0 and final authenticity_pct < 70.0 requires waiver_accepted == true (ERR_AUTHENTICITY_BELOW_THRESHOLD)"
        side_effects:
          - "Evaluation order pinned: (1) authenticity_pct computed from final values; (2) certified_authentic := (final_total == 0 ? unchanged : final_pct >= 70.0); (3) condition_grade bumped one letter; (4) Instrument.status := BANK if certified_authentic and post-bump grade IN {A,B} else SHOWROOM"
          - "Instrument.version incremented; RestorationCase.version incremented"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: build-advance-stale-version
    parent_entity: BuildOrder
    write_endpoint: "POST /piano-works/build-orders/{id}/advance"
    occ_field: expected_build_order_version
    description: |
      Advancing a BuildOrder with an expected_build_order_version below the
      order's current version is rejected: another write (an earlier advance or
      the wood-reject rework cascade) has already mutated the order since the
      caller last observed it, so the caller's stage view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: wip_valuation
    trigger: "On every BuildOrder stage advance, on wood-reject rework cascade, on build create, and on GET /piano-works/build-orders/{id}/valuation"
    algorithm: aggregation
    formula: |
      ACTUAL variant:
        actual_cents = (material_cost if wood_batch_id != null else 0)
                     + sum over BuildStageLog of round_half_up(hours_applied * STAGE_RATE_CENTS[operation_type])
      PROVISIONAL variant:
        provisional_cents = actual_cents
                     + (material_cost if wood_batch_id == null else 0)   # planned replacement materials
                     + sum over untaken forward transitions T of round_half_up(PLANNED_HOURS[op(T)] * STAGE_RATE_CENTS[op(T)])
      Forward transition order: RIM_BENT<-COMMISSIONED, SEASONING<-RIM_BENT,
      ACTION_REGULATION<-SEASONING, VOICING<-ACTION_REGULATION, COMPLETED<-VOICING.
      After rework (status RIM_BENT), untaken set restarts from RIM_BENT->SEASONING.
      delta_cents = provisional_cents - actual_cents.
    input_set: "All BuildStageLog rows of the build (any stage); batch material cost only while a batch is allocated"
    constants:
      MATERIAL_COST_CENTS: { MODEL_D: 4200000, MODEL_B: 3600000, MODEL_O: 3100000, ART_CASE: 9000000 }
      STAGE_RATE_CENTS: { RIM_BENDING: 14500, SEASONING_CHECK: 9500, ACTION_REGULATION: 21000, VOICING: 24000 }
      PLANNED_HOURS: { RIM_BENT: 120, SEASONING: 40, ACTION_REGULATION: 40, VOICING: 200, COMPLETED: 160 }
    precision: "integer cents, round_half_up per stage-log entry before summing"
    variants:
      - name: ACTUAL
        when: "wip_value_cents stored field; valuation endpoint field actual_wip_cents"
        difference: "Counts only consumed inputs: allocated batch material + logged labor"
      - name: PROVISIONAL
        when: "valuation endpoint field provisional_wip_cents"
        difference: "Adds planned replacement material when no batch allocated, plus planned labor for untaken forward transitions; identical logs yield provisional >= actual, equal only at COMPLETED"

  - name: effective_training_hours
    trigger: "On every SkillEndorsement log-hours call, apprentice advance credit, and assess FAIL scaling"
    algorithm: threshold
    formula: |
      For each supervision_log entry e:
        credited(e) = round_half_up(e.hours * (1.0 if e.specialty_match else 0.5))   # ROUND PER ENTRY, THEN SUM (pinned order)
      effective_hours = sum of credited(e) over all entries
      logged_hours = sum of e.hours over all entries
      specialty_match is true when the supervising craftsman's specialty == endorsement operation_type
      (unsupervised endorsed-work entries carry specialty_match = true).
      PENDING_ASSESSMENT auto-transition fires when effective_hours >= HOURS_REQUIRED[operation_type].
    input_set: "All supervision_log entries of the endorsement, in append order"
    constants:
      MISMATCHED_SUPERVISION_RATIO: 0.5
      HOURS_REQUIRED: { RIM_BENDING: 600, SEASONING_CHECK: 300 }
      FAIL_RETAIN_RATIO: 0.75
    precision: "hours to 1 decimal place, round_half_up applied per entry; per-entry-then-sum is the pinned order (sum-then-round is a rejected alternative)"
    variants:
      - name: per_entry_rounding
        when: "canonical"
        difference: "round each credited entry, then sum"
      - name: sum_then_round
        when: "REJECTED alternative, documented for tests to distinguish"
        difference: "sum raw credited values, then round once; yields fewer hours (e.g. two 7h mismatched entries: 4+4=8 vs round(7.0)=7)"

  - name: loan_fee_estimate
    trigger: "On POST /piano-works/concert-loans/{id}/confirm; result stored in ConcertLoan.fee_cents"
    algorithm: tiered_pricing
    formula: |
      tour_days = (tour_end - tour_start) / 86400s
      tour_weeks = ceil(tour_days / 7)                                   # 7 days -> 1 week; 8 days -> 2 weeks
      raw_fee = WEEKLY_RATE_CENTS[instrument.model] * tour_weeks * TIER_FACTOR[artist.tier]
      fee_cents = min(MAX_FEE_CENTS, max(MIN_FEE_CENTS, raw_fee))        # nested clamp AFTER tier factor
    input_set: "The confirmed instrument's model, the loan's tour window, the artist's tier"
    constants:
      WEEKLY_RATE_CENTS: { MODEL_D: 85000, MODEL_B: 72000, MODEL_O: 64000, ART_CASE: 150000 }
      TIER_FACTOR: { STANDARD: 1.0, PRIVILEGED: 0.8 }
      MIN_FEE_CENTS: 55000
      MAX_FEE_CENTS: 2000000
    precision: "integer cents; tour_weeks integer via ceil before multiplication"
    variants:
      - name: standard_tour
        when: "tour_days >= 1"
        difference: "formula as above; MIN/MAX clamp can bind (MODEL_O PRIVILEGED 1 week = 51200 -> 55000; MODEL_D STANDARD 24 weeks = 2040000 -> 2000000)"

  - name: performance_standing
    trigger: "Computed on every Artist response (create, performances, review)"
    algorithm: forward_looking
    formula: |
      REALIZED variant:  standing_realized = performances_logged
      FORWARD_LOOKING variant: standing_forward = performances_logged + sum over ConcertLoan L
        where L.artist_id == artist.id AND L.status == ON_TOUR of tour_weeks(L)
      tour_weeks(L) = ceil((L.tour_end - L.tour_start)/7 days), identical to loan_fee_estimate.
    input_set: "Artist.performances_logged plus all ON_TOUR ConcertLoans of this artist"
    constants: {}
    precision: "integer counts"
    variants:
      - name: REALIZED
        when: "standing_realized field; used by review transition logic"
        difference: "counts only logged performances"
      - name: FORWARD_LOOKING
        when: "standing_forward field"
        difference: "adds projected tour-week credits; identical data yields standing_forward >= standing_realized, strictly greater while any ON_TOUR loan exists"

  - name: restoration_authenticity
    trigger: "On restoration create, resolve-authenticity, and complete (final values)"
    algorithm: weighted_scoring
    formula: |
      If total_parts_value_cents == 0: authenticity_pct = null (no parts replaced; treated as authentic)
      Else: authenticity_pct = round_half_up(100.0 * authentic_parts_value_cents / total_parts_value_cents, 1)
      Sub-threshold rule: authenticity_pct < 70.0 blocks completion unless waiver_accepted == true.
      COMPLETION EVALUATION ORDER (pinned, circular-looking dependency resolved):
        (1) compute final authenticity_pct from final values;
        (2) certified_authentic := (final_total == 0 ? keep current : final_pct >= 70.0);
        (3) bump condition_grade one letter (D->C, C->B, B->A, A->A);
        (4) Instrument.status := BANK if (certified_authentic AND grade IN {A,B}) else SHOWROOM.
      Grade bump MUST use the pre-completion grade; status MUST use the post-bump grade.
    input_set: "Quote or final part values of the case; the instrument's current grade and certified_authentic"
    constants:
      AUTHENTICITY_MIN_PCT: 70.0
    precision: "1 decimal place, round_half_up (70.0 exactly passes; 69.9 fails)"
    variants:
      - name: waived
        when: "waiver_accepted == true"
        difference: "completion allowed below threshold; certified_authentic forced false, instrument exits to SHOWROOM"
      - name: strict
        when: "waiver_accepted == false"
        difference: "below-threshold completion rejected with ERR_AUTHENTICITY_BELOW_THRESHOLD"

  - name: seasoning_and_drying_gates
    trigger: "WoodBatch moisture readings (drying gate) and BuildOrder advance to ACTION_REGULATION (seasoning gate)"
    algorithm: threshold
    formula: |
      drying_days = floor((clock_now - drying_started_at)/86400s)
      DRYING -> CONDITIONED when moisture_content_pct <= MOISTURE_READY_PCT AND drying_days >= MIN_DRYING_DAYS
      seasoning_days = floor((clock_now - seasoning_started_at)/86400s)
      SEASONING -> ACTION_REGULATION requires seasoning_days >= SEASONING_MIN_DAYS
    input_set: "Single batch / single build order timestamps against the logical clock"
    constants:
      MOISTURE_READY_PCT: 8.0
      MIN_DRYING_DAYS: 240
      SEASONING_MIN_DAYS: 365
    precision: "moisture 2 decimals; day counts integer floor"
    variants: []

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; for entity_backed roles X-User-ID must resolve to an existing entity of that type", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 2, category: auth, check: "Ownership: Apprentice logging hours must own the endorsement (X-User-ID == endorsement.apprentice_id); Artist loan create binds artist_id := X-User-ID", error_id: ERR_FORBIDDEN_RESOURCE, http_status: 403, applies_to: ["POST /piano-works/skill-endorsements/{id}/log-hours"] }
  - { priority: 3, category: existence, check: "Path ids resolve (batch, build, endorsement, instrument, artist, loan, restoration)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 3, category: existence, check: "Body FK ids resolve: wood_batch_id, apprentice_id, supervising_craftsman_id, instrument_id, technician_id, lead_craftsman_id", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: ["POST /piano-works/build-orders", "POST /piano-works/skill-endorsements", "POST /piano-works/skill-endorsements/{id}/log-hours", "POST /piano-works/build-orders/{id}/advance", "POST /piano-works/concert-loans/{id}/confirm", "POST /piano-works/restorations"] }
  - { priority: 3, category: existence, check: "Request shape: required fields present, types valid, enum members valid, hours_applied in (0, 500], hours > 0, integers non-negative where required", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 3, category: existence, check: "Loan window sanity: tour_end > tour_start and tour_start >= current clock date", error_id: ERR_LOAN_WINDOW_INVALID, http_status: 422, applies_to: ["POST /piano-works/concert-loans"] }
  - { priority: 4, category: state, check: "OCC: expected_build_order_version == BuildOrder.version (evaluated before any state-transition check within priority 4)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /piano-works/build-orders/{id}/advance"] }
  - { priority: 4, category: state, check: "From-state valid for the requested transition; terminal states accept no transitions (COMPLETED build, RETURNED loan, COMPLETED restoration, CONSUMED/REJECTED batch)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all" }
  - { priority: 4, category: state, check: "advance to_stage is a legal target from current stage per BuildOrder machine (skip/stagnation rejected; SEASONING->RIM_BENT is system-only)", error_id: ERR_BUILD_STAGE_INVALID, http_status: 409, applies_to: ["POST /piano-works/build-orders/{id}/advance"] }
  - { priority: 4, category: state, check: "Artist status == ACTIVE at loan create and re-checked at loan confirm", error_id: ERR_ARTIST_NOT_ACTIVE, http_status: 409, applies_to: ["POST /piano-works/concert-loans", "POST /piano-works/concert-loans/{id}/confirm"] }
  - { priority: 5, category: business_safety, check: "Assessor craftsman != top supervisor of the endorsement by raw supervision_log hours (tie-break: earliest first entry logged_at; empty log never blocks)", error_id: ERR_SOD_ASSESSOR_IS_SUPERVISOR, http_status: 409, applies_to: ["POST /piano-works/skill-endorsements/{id}/assess"] }
  - { priority: 5, category: business_safety, check: "Restoration authenticity: final_pct >= 70.0 or waiver_accepted, at complete and at resolve-authenticity", error_id: ERR_AUTHENTICITY_BELOW_THRESHOLD, http_status: 422, applies_to: ["POST /piano-works/restorations/{id}/complete", "POST /piano-works/restorations/{id}/resolve-authenticity"] }
  - { priority: 6, category: business_constraint, check: "Build create: wood batch status == CONDITIONED (DRYING/REJECTED/CONSUMED)", error_id: ERR_WOOD_NOT_CONDITIONED, http_status: 409, applies_to: ["POST /piano-works/build-orders", "POST /piano-works/build-orders/{id}/advance"] }
  - { priority: 6, category: business_constraint, check: "Wood batch not already ALLOCATED to another build", error_id: ERR_WOOD_ALREADY_ALLOCATED, http_status: 409, applies_to: ["POST /piano-works/build-orders", "POST /piano-works/build-orders/{id}/advance"] }
  - { priority: 6, category: business_constraint, check: "No other SkillEndorsement for (apprentice_id, operation_type) with status IN {IN_TRAINING, PENDING_ASSESSMENT, ENDORSED}; REVOKED allows a new track", error_id: ERR_DUPLICATE_ENDORSEMENT, http_status: 409, applies_to: ["POST /piano-works/skill-endorsements"] }
  - { priority: 6, category: business_constraint, check: "Actor endorsement gate for the advance operation: craftsman specialty match, or apprentice ENDORSED (unsupervised), or apprentice IN_TRAINING/PENDING_ASSESSMENT with specialty-matched supervising_craftsman_id", error_id: ERR_ENDORSEMENT_REQUIRED, http_status: 409, applies_to: ["POST /piano-works/build-orders/{id}/advance"] }
  - { priority: 6, category: business_constraint, check: "Confirm technician specialty == VOICING", error_id: ERR_TECHNICIAN_NOT_QUALIFIED, http_status: 409, applies_to: ["POST /piano-works/concert-loans/{id}/confirm"] }
  - { priority: 6, category: business_constraint, check: "Confirm instrument eligibility: status IN {BANK, ON_LOAN}, certified_authentic, grade IN {A,B}, model == desired_model (also applies to selector-pool candidates)", error_id: ERR_INSTRUMENT_NOT_ELIGIBLE, http_status: 409, applies_to: ["POST /piano-works/concert-loans/{id}/confirm"] }
  - { priority: 6, category: business_constraint, check: "Selector fallback: instrument_id omitted and eligible pool empty (ranking: condition_grade A-before-B, tie-break created_at ASC)", error_id: ERR_NO_ELIGIBLE_INSTRUMENT, http_status: 422, applies_to: ["POST /piano-works/concert-loans/{id}/confirm"] }
  - { priority: 6, category: business_constraint, check: "Bank intake: status SHOWROOM, certified_authentic, grade IN {A,B}", error_id: ERR_INSTRUMENT_NOT_BANK_ELIGIBLE, http_status: 409, applies_to: ["POST /piano-works/instruments/{id}/bank-intake"] }
  - { priority: 6, category: business_constraint, check: "Restoration create: no other non-COMPLETED case for the same instrument", error_id: ERR_RESTORATION_ALREADY_OPEN, http_status: 409, applies_to: ["POST /piano-works/restorations"] }
  - { priority: 7, category: business_temporal, check: "Seasoning gate: seasoning_days >= 365 before SEASONING -> ACTION_REGULATION", error_id: ERR_SEASONING_INCOMPLETE, http_status: 409, applies_to: ["POST /piano-works/build-orders/{id}/advance"] }
  - { priority: 7, category: business_temporal, check: "Instrument half-open interval overlap vs other ON_TOUR loans (adjacency allowed)", error_id: ERR_LOAN_WINDOW_CONFLICT, http_status: 409, applies_to: ["POST /piano-works/concert-loans/{id}/confirm"] }
  - { priority: 7, category: business_temporal, check: "Technician buffered overlap: closed intervals plus TECH_BUFFER_DAYS = 1 day on both sides vs other ON_TOUR loans", error_id: ERR_TECHNICIAN_WINDOW_CONFLICT, http_status: 409, applies_to: ["POST /piano-works/concert-loans/{id}/confirm"] }
  - { priority: 7, category: business_temporal, check: "Review due: clock now >= artist.next_review_date", error_id: ERR_REVIEW_NOT_DUE, http_status: 409, applies_to: ["POST /piano-works/artists/{id}/review"] }
  - { priority: 7, category: business_temporal, check: "Performance performed_at <= clock now", error_id: ERR_PERFORMANCE_IN_FUTURE, http_status: 422, applies_to: ["POST /piano-works/artists/{id}/performances"] }
  - { priority: 7, category: business_temporal, check: "Clock may only move forward: to_iso8601 >= current logical clock", error_id: ERR_CLOCK_REGRESSION, http_status: 422, applies_to: ["POST /_clock/set_current_utc"] }

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/piano-works/wood-batches", description: "Register a wood batch; enters DRYING at the current logical clock", roles: [WorkshopManager], code: 201, input: [species, moisture_content_pct], output: WoodBatch, side_effects: ["drying_started_at := clock now"] }
  - { method: GET, path: "/piano-works/wood-batches", description: "List wood batches with optional filters", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: ["status?", "species?", "limit?", "offset?"], output: "WoodBatch[]", side_effects: [] }
  - { method: GET, path: "/piano-works/wood-batches/{id}", description: "Fetch one wood batch", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: [], output: WoodBatch, side_effects: [] }
  - { method: POST, path: "/piano-works/wood-batches/{id}/moisture-readings", description: "Record a moisture reading (accepted while status IN {DRYING, CONDITIONED, ALLOCATED}; REJECTED/CONSUMED -> ERR_INVALID_STATE); auto-transitions DRYING -> CONDITIONED when moisture <= 8.0 and drying_days >= 240; CONDITIONED is sticky (later readings never revert it)", roles: [WorkshopManager], code: 200, input: [moisture_content_pct], output: WoodBatch, side_effects: ["moisture_content_pct updated", "auto CONDITIONED per seasoning_and_drying_gates", "version incremented"] }
  - { method: POST, path: "/piano-works/wood-batches/{id}/reject", description: "Reject a batch (quality failure); if ALLOCATED to a SEASONING build, fires the rework cascade", roles: [WorkshopManager], code: 200, input: [], output: WoodBatch, side_effects: ["batch -> REJECTED", "rework cascade per WoodBatch machine"] }

  - { method: POST, path: "/piano-works/build-orders", description: "Commission a build order against a CONDITIONED batch; batch becomes ALLOCATED", roles: [WorkshopManager], code: 201, input: [model, wood_batch_id, "commissioned_note?"], output: BuildOrder, side_effects: ["batch CONDITIONED -> ALLOCATED", "wip_value_cents initialized (ACTUAL variant)"] }
  - { method: GET, path: "/piano-works/build-orders", description: "List build orders with optional filters", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: ["status?", "model?", "wood_batch_id?", "limit?", "offset?"], output: "BuildOrder[]", side_effects: [] }
  - { method: GET, path: "/piano-works/build-orders/{id}", description: "Fetch one build order", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: [], output: BuildOrder, side_effects: [] }
  - { method: GET, path: "/piano-works/build-orders/{id}/stage-logs", description: "List stage logs of a build in append order", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: [], output: "BuildStageLog[]", side_effects: [] }
  - { method: GET, path: "/piano-works/build-orders/{id}/valuation", description: "Dual-variant WIP valuation read", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: [], output: { provisional_wip_cents: integer, actual_wip_cents: integer, delta_cents: integer }, side_effects: [] }
  - { method: POST, path: "/piano-works/build-orders/{id}/advance", description: "Advance the build one stage (OCC-guarded); apprentice callers credit endorsement hours; wood_batch_id only meaningful when re-allocating after rework into SEASONING", roles: [MasterCraftsman, Apprentice], code: 200, input: [to_stage, hours_applied, expected_build_order_version, "supervising_craftsman_id?", "wood_batch_id?"], output: BuildOrder, side_effects: ["BuildStageLog appended", "apprentice supervision entry appended when applicable", "wip_value_cents recomputed", "BuildOrder.version incremented by 1", "COMPLETED creates Instrument and consumes batch"] }

  - { method: POST, path: "/piano-works/craftsmen", description: "Register a craftsman with a specialty", roles: [WorkshopManager], code: 201, input: [name, specialty], output: Craftsman, side_effects: [] }
  - { method: GET, path: "/piano-works/craftsmen/{id}", description: "Fetch one craftsman", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: [], output: Craftsman, side_effects: [] }
  - { method: POST, path: "/piano-works/apprentices", description: "Enroll an apprentice", roles: [WorkshopManager], code: 201, input: [name], output: Apprentice, side_effects: [] }
  - { method: GET, path: "/piano-works/apprentices/{id}", description: "Fetch one apprentice", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: [], output: Apprentice, side_effects: [] }

  - { method: POST, path: "/piano-works/skill-endorsements", description: "Open an endorsement track for (apprentice, operation); one non-REVOKED track per pair", roles: [WorkshopManager], code: 201, input: [apprentice_id, operation_type], output: SkillEndorsement, side_effects: [] }
  - { method: GET, path: "/piano-works/skill-endorsements", description: "List endorsement tracks with optional filters", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: ["apprentice_id?", "endorsed_by_craftsman_id?", "operation_type?", "status?", "limit?", "offset?"], output: "SkillEndorsement[]", side_effects: [] }
  - { method: GET, path: "/piano-works/skill-endorsements/{id}", description: "Fetch one endorsement track", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: [], output: SkillEndorsement, side_effects: [] }
  - { method: POST, path: "/piano-works/skill-endorsements/{id}/log-hours", description: "Apprentice logs supervised hours; appends supervision entry; may auto-transition to PENDING_ASSESSMENT", roles: [Apprentice], code: 200, input: [hours, supervising_craftsman_id], output: SkillEndorsement, side_effects: ["supervision_log append", "logged_hours/effective_hours recomputed", "auto PENDING_ASSESSMENT at threshold", "version incremented"] }
  - { method: POST, path: "/piano-works/skill-endorsements/{id}/assess", description: "Master craftsman assesses a PENDING_ASSESSMENT endorsement; segregation of duties enforced", roles: [MasterCraftsman], code: 200, input: [outcome], output: SkillEndorsement, side_effects: ["ENDORSE -> ENDORSED with endorsed_by_craftsman_id", "FAIL -> IN_TRAINING with per-entry 0.75 floor scaling", "version incremented"] }
  - { method: POST, path: "/piano-works/skill-endorsements/{id}/review", description: "Workshop review: REVOKE an ENDORSED track or REOPEN a REVOKED one (reinstates ENDORSED)", roles: [WorkshopManager], code: 200, input: [action], output: SkillEndorsement, side_effects: ["ENDORSED <-> REVOKED per machine", "version incremented"] }

  - { method: GET, path: "/piano-works/instruments", description: "List instruments with optional filters", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: ["status?", "condition_grade?", "model?", "build_order_id?", "limit?", "offset?"], output: "Instrument[]", side_effects: [] }
  - { method: GET, path: "/piano-works/instruments/{id}", description: "Fetch one instrument", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: [], output: Instrument, side_effects: [] }
  - { method: POST, path: "/piano-works/instruments/{id}/bank-intake", description: "Admit a SHOWROOM instrument into the concert bank", roles: [ArtistLiaison], code: 200, input: [], output: Instrument, side_effects: ["SHOWROOM -> BANK", "version incremented"] }

  - { method: POST, path: "/piano-works/artists", description: "Register an artist with tier and performance quota", roles: [ArtistLiaison], code: 201, input: [name, tier, performance_quota], output: Artist, side_effects: ["next_review_date := clock now + 365 days"] }
  - { method: GET, path: "/piano-works/artists/{id}", description: "Fetch one artist (includes standing_realized and standing_forward)", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: [], output: Artist, side_effects: [] }
  - { method: POST, path: "/piano-works/artists/{id}/performances", description: "Log a realized performance (not in the future)", roles: [ArtistLiaison], code: 200, input: [venue, performed_at], output: Artist, side_effects: ["performances_logged += 1", "version incremented"] }
  - { method: POST, path: "/piano-works/artists/{id}/review", description: "Annual standing review per Artist machine", roles: [ArtistLiaison], code: 200, input: [], output: Artist, side_effects: ["status/counter/next_review transitions per machine", "version incremented"] }

  - { method: POST, path: "/piano-works/concert-loans", description: "Artist requests a tour loan; artist_id taken from X-User-ID", roles: [Artist], code: 201, input: [desired_model, tour_start, tour_end], output: ConcertLoan, side_effects: [] }
  - { method: GET, path: "/piano-works/concert-loans", description: "List loans with optional filters", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: ["instrument_id?", "artist_id?", "technician_id?", "status?", "limit?", "offset?"], output: "ConcertLoan[]", side_effects: [] }
  - { method: GET, path: "/piano-works/concert-loans/{id}", description: "Fetch one loan", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: [], output: ConcertLoan, side_effects: [] }
  - { method: POST, path: "/piano-works/concert-loans/{id}/confirm", description: "Bind instrument (explicit id or selector policy) and VOICING technician; computes fee; instrument goes ON_LOAN", roles: [ArtistLiaison], code: 200, input: ["instrument_id?", technician_id], output: ConcertLoan, side_effects: ["fee_cents computed via loan_fee_estimate", "Instrument BANK -> ON_LOAN", "versions incremented"] }
  - { method: POST, path: "/piano-works/concert-loans/{id}/return", description: "Close a tour with observed condition grade; grade C/D fires the restoration cascade", roles: [ArtistLiaison], code: 200, input: [condition_grade_observed], output: ConcertLoan, side_effects: ["condition grade written", "instrument BANK or RESTORATION per grade", "LOAN_RETURN RestorationCase auto-created on C/D", "versions incremented"] }

  - { method: POST, path: "/piano-works/restorations", description: "Open a restoration case (instrument SHOWROOM/BANK/RESTORATION, no other open case); auto-AUTHENTICITY_HOLD when quote below threshold without waiver", roles: [WorkshopManager], code: 201, input: [instrument_id, lead_craftsman_id, diagnosis, authentic_parts_value_cents, total_parts_value_cents, "waiver_accepted?"], output: RestorationCase, side_effects: ["instrument -> RESTORATION if SHOWROOM/BANK", "auto AUTHENTICITY_HOLD per machine"] }
  - { method: GET, path: "/piano-works/restorations", description: "List restoration cases with optional filters", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: ["instrument_id?", "lead_craftsman_id?", "status?", "limit?", "offset?"], output: "RestorationCase[]", side_effects: [] }
  - { method: GET, path: "/piano-works/restorations/{id}", description: "Fetch one restoration case", roles: [WorkshopManager, MasterCraftsman, Apprentice, ArtistLiaison, Artist], code: 200, input: [], output: RestorationCase, side_effects: [] }
  - { method: POST, path: "/piano-works/restorations/{id}/advance", description: "QUOTED -> DISASSEMBLED -> REBUILT; authenticity_concern diverts to AUTHENTICITY_HOLD", roles: [MasterCraftsman], code: 200, input: [to_stage, "authenticity_concern?"], output: RestorationCase, side_effects: ["stage transition per machine", "version incremented"] }
  - { method: POST, path: "/piano-works/restorations/{id}/resolve-authenticity", description: "Re-quote parts values and/or set waiver to leave AUTHENTICITY_HOLD", roles: [MasterCraftsman], code: 200, input: [authentic_parts_value_cents, total_parts_value_cents, "waiver_accepted?"], output: RestorationCase, side_effects: ["AUTHENTICITY_HOLD -> QUOTED when rule satisfied", "authenticity_pct recomputed", "version incremented"] }
  - { method: POST, path: "/piano-works/restorations/{id}/complete", description: "Complete a REBUILT case with final part values; pinned 4-step evaluation order mutates the instrument", roles: [MasterCraftsman], code: 200, input: [final_authentic_value_cents, final_total_parts_value_cents], output: RestorationCase, side_effects: ["authenticity/certified/grade/status evaluation per restoration_authenticity", "Instrument.version incremented", "RestorationCase.version incremented"] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving). Startup default is exactly 2026-09-01T00:00:00Z; the clock never reads wall-clock time and may only move forward", roles: [WorkshopManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role, or entity-backed X-User-ID does not resolve" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_RESOURCE, http: 403, condition: "Entity-backed caller does not own the target resource (apprentice logging another's endorsement)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, bad enum member, out-of-range numeric (e.g. hours_applied outside (0, 500])" }
  - { id: ERR_LOAN_WINDOW_INVALID, http: 422, condition: "tour_end <= tour_start, or tour_start before current clock date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_build_order_version below current BuildOrder.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "From-state does not allow the transition, or terminal state lockdown" }
  - { id: ERR_BUILD_STAGE_INVALID, http: 409, condition: "advance to_stage is not the legal next stage (skip, repeat, or system-only rework path)" }
  - { id: ERR_ARTIST_NOT_ACTIVE, http: 409, condition: "Artist SUSPENDED at loan create or confirm" }
  - { id: ERR_SOD_ASSESSOR_IS_SUPERVISOR, http: 409, condition: "Assessor is the endorsement's top supervisor (segregation of duties)" }
  - { id: ERR_AUTHENTICITY_BELOW_THRESHOLD, http: 422, condition: "Authenticity below 70.0 without waiver at resolve or complete" }
  - { id: ERR_WOOD_NOT_CONDITIONED, http: 409, condition: "Batch not in CONDITIONED when allocation requires it" }
  - { id: ERR_WOOD_ALREADY_ALLOCATED, http: 409, condition: "Batch already ALLOCATED to another build" }
  - { id: ERR_DUPLICATE_ENDORSEMENT, http: 409, condition: "Non-REVOKED track already exists for (apprentice, operation)" }
  - { id: ERR_ENDORSEMENT_REQUIRED, http: 409, condition: "Actor lacks the specialty/endorsement (or supervision) the operation requires" }
  - { id: ERR_TECHNICIAN_NOT_QUALIFIED, http: 409, condition: "Confirm technician specialty != VOICING" }
  - { id: ERR_INSTRUMENT_NOT_ELIGIBLE, http: 409, condition: "Confirm instrument fails status/authenticity/grade/model eligibility" }
  - { id: ERR_INSTRUMENT_NOT_BANK_ELIGIBLE, http: 409, condition: "Bank intake precondition failed" }
  - { id: ERR_RESTORATION_ALREADY_OPEN, http: 409, condition: "Another non-COMPLETED case exists for the instrument" }
  - { id: ERR_SEASONING_INCOMPLETE, http: 409, condition: "seasoning_days < 365 at SEASONING -> ACTION_REGULATION" }
  - { id: ERR_LOAN_WINDOW_CONFLICT, http: 409, condition: "Instrument half-open interval overlaps another ON_TOUR loan" }
  - { id: ERR_TECHNICIAN_WINDOW_CONFLICT, http: 409, condition: "Technician buffered interval overlaps another ON_TOUR loan" }
  - { id: ERR_REVIEW_NOT_DUE, http: 409, condition: "Clock now < artist.next_review_date" }
  - { id: ERR_PERFORMANCE_IN_FUTURE, http: 422, condition: "performed_at after current logical clock" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "to_iso8601 before current logical clock" }
  - { id: ERR_NO_ELIGIBLE_INSTRUMENT, http: 422, condition: "Selector pool empty for omitted instrument_id at confirm" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: WorkshopManager
    description: "Factory operations manager: wood intake, build commissioning, people registration, endorsement review, restoration intake, clock control"
    identity: opaque
    exclusive_operations: ["POST /piano-works/wood-batches", "POST /piano-works/wood-batches/{id}/moisture-readings", "POST /piano-works/wood-batches/{id}/reject", "POST /piano-works/build-orders", "POST /piano-works/craftsmen", "POST /piano-works/apprentices", "POST /piano-works/skill-endorsements", "POST /piano-works/skill-endorsements/{id}/review", "POST /piano-works/restorations", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: MasterCraftsman
    description: "Master of one specialty operation; advances builds, assesses endorsements, leads restoration work"
    identity: "entity_backed:Craftsman"
    exclusive_operations: ["POST /piano-works/skill-endorsements/{id}/assess", "POST /piano-works/restorations/{id}/advance", "POST /piano-works/restorations/{id}/resolve-authenticity", "POST /piano-works/restorations/{id}/complete"]
    shared_operations: ["POST /piano-works/build-orders/{id}/advance", "all GET endpoints"]
  - name: Apprentice
    description: "Craft apprentice; logs supervised hours and advances trainable stages under endorsement rules"
    identity: "entity_backed:Apprentice"
    exclusive_operations: ["POST /piano-works/skill-endorsements/{id}/log-hours"]
    shared_operations: ["POST /piano-works/build-orders/{id}/advance", "all GET endpoints"]
  - name: ArtistLiaison
    description: "Concert & artist program operator: artists, bank intake, loan confirmation and return"
    identity: opaque
    exclusive_operations: ["POST /piano-works/artists", "POST /piano-works/artists/{id}/performances", "POST /piano-works/artists/{id}/review", "POST /piano-works/instruments/{id}/bank-intake", "POST /piano-works/concert-loans/{id}/confirm", "POST /piano-works/concert-loans/{id}/return"]
    shared_operations: ["all GET endpoints"]
  - name: Artist
    description: "Performing artist; requests tour loans for their own artist record"
    identity: "entity_backed:Artist"
    exclusive_operations: ["POST /piano-works/concert-loans"]
    shared_operations: ["all GET endpoints"]
