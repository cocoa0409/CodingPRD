              as: Organizer
              as_user_id: "${org_id}"
              captures: { app_state_mid: $.data.status }
            - call: "POST /petitions/${pet_id}/cure"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /petitions/${pet_id}/signatures"
              payload: { household_address: "9 Elm St", signer_name: "F Nine", signer_email: "f9@x.com" }
              as: Neighbor
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /petitions/${pet_id}/verify"
              payload: { decision: APPROVE }
              as: PermitOfficer
            - call: "GET /permit-applications/${app_id}"
