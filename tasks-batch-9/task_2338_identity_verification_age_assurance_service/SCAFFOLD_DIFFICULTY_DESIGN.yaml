              payload: { client_id: "${client_id}", external_subject_ref: "subj-r3c-attest", requested_assurance_tier: "STANDARD", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "NO_STANDARD_DOCS" }
              as: ClientIntegrator
