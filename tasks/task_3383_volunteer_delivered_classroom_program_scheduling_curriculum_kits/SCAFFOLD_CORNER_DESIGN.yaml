            - "GET /ja-programs/capstone-events?delivery_id=${del_id} returns exactly 1 row"

      - name: corner_write_off_exceeds_available_rejected
        claim_type: Violation → Error
        grounds:
          - endpoints.POST_/ja-programs/kit-inventories/{inventory_id}/transition
          - errors.ERR_WRITE_OFF_EXCEEDS_AVAILABLE
        distinguishing_aspect: "WRITE_OFF may only consume the on-shelf pool: writing off 11 against available 10 (with 5 more reserved) is rejected 422 — reserved kits are not write-offable."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Office; program JA-BIZ; inventory assembled 15."
          setup_api_calls:
            - *clk
            - *office
            - *prog4
            - *inv4
            - call: "POST /ja-programs/kit-inventories/${inv4_id}/transition"
              payload: { action: "ASSEMBLE", quantity: 15 }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /ja-programs/kit-inventories/${inv4_id}/transition"
              payload: { action: "WRITE_OFF", quantity: 16 }
              as: LogisticsCoordinator
              captures: { err: $.data }
            - call: "POST /ja-programs/kit-inventories/${inv4_id}/transition"
              payload: { action: "WRITE_OFF", quantity: 15 }
              as: LogisticsCoordinator
              captures: { ok: $.data }
          assert:
            - "WRITE_OFF 16 against available 15: 422 ERR_WRITE_OFF_EXCEEDS_AVAILABLE"
            - "WRITE_OFF 15 against available 15 succeeds (inclusive boundary): available_count == 0, written_off_count == 15"

