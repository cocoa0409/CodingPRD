              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
              captures: { op_id: $.data.id }
            - call: "POST /shore-excursions/operators/${op_id}/safety-audits"
              payload: { audit_type: "INITIAL", conducted_on: "2026-06-01T00:00:00Z", raw_score: 64, critical_finding_count: 0 }
              as: OperatorVettingOfficer
              as_user_id: "u_aud_1"
            - call: "POST /shore-excursions/operators/${op_id}/safety-audits"
              payload: { audit_type: "PERIODIC", conducted_on: "2026-07-01T00:00:00Z", raw_score: 66, critical_finding_count: 0 }
              as: OperatorVettingOfficer
              as_user_id: "u_aud_2"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
