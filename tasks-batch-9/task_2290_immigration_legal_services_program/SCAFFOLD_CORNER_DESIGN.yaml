      - name: hours_rollup_rounds_at_every_accumulation_step_not_once_at_the_end
        claim_type: precision
        grounds:
          - calculations.case_hours_rollup
          - endpoints[POST /case-assignments/{assignment_id}/log-hours]
          - validations[priority 36 ERR_HOURS_OUT_OF_RANGE]
        distinguishing_aspect: "Three DIRECT entries of 0.005, 1.005 and 2.335 hours must be rounded HALF UP after EACH accumulation: 0.01, then 1.02, then 3.36. Deferring the rounding to a single final pass gives round(3.345) == 3.35, so the two policies differ by a cent-of-an-hour and the difference propagates into the reimbursement money. The same instance pins the range guard at MAX_HOURS_PER_LOG_ENTRY 12.00 and the hours_kind/role cross-check, which shares the ERR_HOURS_OUT_OF_RANGE id."
        test_recipe:
          setup:
            - "TEMPLATE A gives one STAFFED U_VISA matter with Ada Ortiz as ACTIVE LEAD (assignment ${lead_id}). Both hour counters start at 0.00 by the POST /case-assignments side effect."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /case-assignments/${lead_id}/log-hours"
              payload: { hours: 0.005, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${lead_id}/log-hours"
              payload: { hours: 1.005, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${lead_id}/log-hours"
              payload: { hours: 2.335, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${lead_id}/log-hours"
              payload: { hours: 12.01, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${lead_id}/log-hours"
              payload: { hours: 0, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${lead_id}/log-hours"
              payload: { hours: 1.5, hours_kind: "SUPERVISION", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${lead_id}/log-hours"
              payload: { hours: 12, hours_kind: "DIRECT", service_date: "2026-08-04" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          assert:
            - "after trigger 1: HTTP 200, CaseAssignment.${lead_id}.direct_hours_logged == 0.01"
            - "after trigger 2: CaseAssignment.${lead_id}.direct_hours_logged == 1.02 — round(0.01 + 1.005) not round(1.01)"
            - "after trigger 3: CaseAssignment.${lead_id}.direct_hours_logged == 3.36 (NOT 3.35), and CaseMatter.${matter_id}.direct_hours_logged == 3.36"
            - "CaseMatter.${matter_id}.supervision_hours_logged == 0.00 throughout"
            - "trigger 4: HTTP status == 422, error_id == 'ERR_HOURS_OUT_OF_RANGE' — 12.01 exceeds MAX_HOURS_PER_LOG_ENTRY"
            - "trigger 5: HTTP status == 422, error_id == 'ERR_HOURS_OUT_OF_RANGE' — hours must be strictly greater than 0.00"
            - "trigger 6: HTTP status == 422, error_id == 'ERR_HOURS_OUT_OF_RANGE' — SUPERVISION hours against a LEAD assignment, same error id as the numeric range failure"
            - "trigger 7: HTTP status == 200 — 12.00 exactly is accepted; CaseAssignment.${lead_id}.direct_hours_logged == 15.36 and CaseMatter.${matter_id}.direct_hours_logged == 15.36"

      - name: grant_rollup_tier_boundary_then_largest_remainder_gives_the_extra_cent_to_the_older_matter
        claim_type: waterfall_allocation
        grounds:
          - calculations.grant_reimbursement_rollup
          - calculations.grant_confidentiality_partition
          - state_machines.GrantReport
        distinguishing_aspect: "Two matters with 12.01 and 27.99 direct hours produce per-matter bases of 150125 and 349875, summing to exactly 500000 — the SURCHARGE_TIER_1_MIN boundary — so the 0.06 tier applies (a `<=` reading would leave the tier at 0.00 and the surcharge at 0). The tier must be read from base_reimbursable_cents alone: feeding total_reimbursable_cents back in would push 530000 into a different tier reading. Allocation then produces two ideals of exactly 159132.5 and 370867.5 whose remainders tie at 0.5, so the created_at ASC tie-break must hand the single leftover cent to the older matter."
        test_recipe:
          setup:
            - "TEMPLATE A gives matter M1 (U_VISA, Rosa Mena, accepted 2026-08-03) with Ada Ortiz as ACTIVE LEAD. A second matter M2 (NATURALIZATION) for the same client is accepted moments later and led by Ben Cole, so M1.created_at < M2.created_at."
            - "M1 accumulates 12.00 + 0.01 = 12.01 direct hours; M2 accumulates 12.00 + 12.00 + 3.99 = 27.99, every entry within MAX_HOURS_PER_LOG_ENTRY."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "NATURALIZATION", detained: false }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { intake2_id: "$.data.id" }
            - call: "POST /intake-screenings/${intake2_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${intake2_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "GET /case-matters"
              payload: { intake_id: "${intake2_id}" }
              as: ProgramDirector
              captures: { matter2_id: "$.data[0].id", m2v1: "$.data[0].version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter2_id}", representative_id: "${atty_b_id}", role_on_case: "LEAD", expected_matter_version: "${m2v1}" }
              as: ProgramDirector
              captures: { lead2_id: "$.data.id" }
            - call: "POST /case-assignments/${lead2_id}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramDirector
            - call: "POST /case-assignments/${lead_id}/log-hours"
              payload: { hours: 12, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${lead_id}/log-hours"
              payload: { hours: 0.01, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-assignments/${lead2_id}/log-hours"
              payload: { hours: 12, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${lead2_id}/log-hours"
              payload: { hours: 12, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${lead2_id}/log-hours"
              payload: { hours: 3.99, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${atty_b_id}"
            - call: "POST /grant-reports"
              payload: { cycle_id: "${cycle_id}", grant_code: "EOIR-LOP-26", period_start_date: "2026-08-01", period_end_date: "2026-08-31", disclosure_level: "AGGREGATE_ONLY" }
              as: GrantAnalyst
              captures: { report_id: "$.data.id" }
          trigger:
            - call: "POST /grant-reports/${report_id}/transition"
              payload: { action: "GENERATE" }
              as: GrantAnalyst
          assert:
            - "HTTP status == 200, GrantReport.${report_id}.status == 'GENERATED'"
            - "CaseMatter.${matter_id}.direct_hours_logged == 12.01 and CaseMatter.${matter2_id}.direct_hours_logged == 27.99"
            - "GrantReport.${report_id}.cases_served_count == 2"
            - "GrantReport.${report_id}.base_reimbursable_cents == 500000 — round(12500 * 12.01) == 150125 plus round(12500 * 27.99) == 349875, rounded PER MATTER before summing"
            - "GrantReport.${report_id}.supervision_surcharge_cents == 30000 — the 0.06 tier applies at exactly SURCHARGE_TIER_1_MIN, not 0.00"
            - "GrantReport.${report_id}.total_reimbursable_cents == 530000"
            - "GrantReport.${report_id}.allocated_line_total_cents == 530000 and rounding_remainder_cents == 1"
            - "per-line allocation: ${matter_id} receives 159133 and ${matter2_id} receives 370867 — both ideals end in .5, so the created_at ASC tie-break gives the leftover cent to the older matter, never to the larger share"
            - "GrantReport.${report_id}.outcomes_summary has key 'NOT_YET_DECIDED' with value 2, since neither matter has been filed or decided"
            - "GrantReport.${report_id}.version == 2"

      - name: waiving_evidence_moves_the_index_in_both_directions_yet_keeps_required_total
        claim_type: input_set_filtering
        grounds:
          - calculations.matter_readiness_index
          - endpoints[POST /evidence-items/{item_id}/transition]
        distinguishing_aspect: "WAIVED rows leave BOTH the numerator and the denominator, so waiving an unverified low-weight item RAISES the index while waiving a VERIFIED high-weight item LOWERS it — a filter that only dropped rows from the denominator, or only from the numerator, gets one of the two directions wrong. Meanwhile required_total counts REQUIRED rows regardless of status, so it stays at 2 across every waiver, and waiving the last open REQUIRED row flips readiness_ready_strict to true without anything ever being verified."
        test_recipe:
          setup:
            - "TEMPLATE A gives one STAFFED U_VISA matter with Ada Ortiz as ACTIVE LEAD. Four evidence items are added: R1 REQUIRED 24 points, R2 REQUIRED 8 points, S1 SUPPORTING 12 points, S2 SUPPORTING 6 points, all requires_translation false so VERIFY is legal straight from RECEIVED."
            - "R1 and S1 are driven to VERIFIED (RECEIVE then VERIFY); R2 and S2 stay REQUESTED."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 24, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { r1: "$.data.id" }
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "POLICE_REPORT", tier: "REQUIRED", weight_points: 8, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { r2: "$.data.id" }
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "MEDICAL_RECORD", tier: "SUPPORTING", weight_points: 12, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { s1: "$.data.id" }
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "COUNTRY_CONDITIONS_REPORT", tier: "SUPPORTING", weight_points: 6, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { s2: "$.data.id" }
            - call: "POST /evidence-items/${r1}/transition"
              payload: { action: "RECEIVE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /evidence-items/${r1}/transition"
              payload: { action: "VERIFY" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /evidence-items/${s1}/transition"
              payload: { action: "RECEIVE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /evidence-items/${s1}/transition"
              payload: { action: "VERIFY" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          trigger:
            - call: "POST /evidence-items/${s2}/transition"
              payload: { action: "WAIVE", disposition_reason_code: "NOT_APPLICABLE_TO_CASE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /evidence-items/${r2}/transition"
              payload: { action: "WAIVE", disposition_reason_code: "NOT_APPLICABLE_TO_CASE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /evidence-items/${r1}/transition"
              payload: { action: "WAIVE", disposition_reason_code: "NOT_APPLICABLE_TO_CASE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "before any trigger: denominator 24+8+12+6 == 50, numerator 24+12 == 36, CaseMatter.${matter_id}.readiness_index_weighted == 0.7200, readiness_ready_strict == false (required_open == 1), evidence_blocking_count == 1"
            - "trigger 1 (waive unverified SUPPORTING 6): readiness_index_weighted == 0.8182 — 36/44 rounded HALF UP at 4dp; the index ROSE because the waived row left the denominator"
            - "trigger 1: readiness_ready_strict is still false and evidence_blocking_count is still 1"
            - "trigger 2 (waive the last open REQUIRED 8): readiness_index_weighted == 1.0000 (36/36), readiness_ready_strict == true, evidence_blocking_count == 0 — required_total is still 2 because a WAIVED REQUIRED row keeps counting, so the (required_total >= 1) guard holds and strict readiness is reachable with zero verified REQUIRED items remaining open"
            - "trigger 3 (waive the VERIFIED 24-point REQUIRED): readiness_index_weighted == 1.0000 stays at 12/12, proving the waived row left the numerator as well as the denominator — had it only left the denominator the index would be 36/12"
            - "after trigger 3: readiness_ready_strict == true, evidence_blocking_count == 0, and GET /evidence-items?matter_id=${matter_id}&status=WAIVED returns 3 rows"
            - "CaseMatter.${matter_id}.version increased by exactly 3 across the three triggers"

      - name: partition_window_is_inclusive_excludes_withdrawn_and_gates_on_the_consent_ladder
        claim_type: input_set_filtering
        grounds:
          - calculations.grant_confidentiality_partition
          - endpoints[POST /grant-reports/{report_id}/transition]
          - validations[priority 32 ERR_CONSENT_SCOPE_INSUFFICIENT]
        distinguishing_aspect: "The reporting window keys off the accepted IntakeScreening's decided_at DATE and is inclusive at BOTH ends, so a one-day period 2026-08-31..2026-08-31 reports the intakes decided that day, drops Rosa's (decided 2026-08-03, before the start) and drops Ivo's (decided 2026-09-01, one day after the end). A WITHDRAWN_FROM matter is removed from the line set entirely rather than merely suppressed, so it lowers cases_served_count and never reaches the suppression counters. Suppression itself follows the ladder: at DEIDENTIFIED_CASE_LEVEL a FUNDER_AGGREGATE client passes while PROGRAM_ONLY is suppressed, whereas at IDENTIFIED_WITH_CONSENT anything short of FUNDER_IDENTIFIED makes GENERATE fail outright instead of suppressing."
        test_recipe:
          setup:
            - "TEMPLATE A establishes cycle FY26-H2 (2026-07-01..2026-12-31), the three staff attorneys, and Rosa Mena's U_VISA matter accepted on 2026-08-03 — deliberately BEFORE the reporting window."
            - "The clock then moves to 2026-08-31T12:00:00.000Z and three more clients are accepted that day: Luis Diaz (FUNDER_AGGREGATE), Ana Sol (PROGRAM_ONLY) and Eva Roth (FUNDER_IDENTIFIED). Eva's intake is then withdrawn, which cascades her matter to WITHDRAWN_FROM."
            - "The clock moves to 2026-09-01T12:00:00.000Z and Ivo Kral is accepted — one day past the inclusive end."
            - "Two one-day reports are opened over 2026-08-31..2026-08-31, one at DEIDENTIFIED_CASE_LEVEL and one at IDENTIFIED_WITH_CONSENT."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T12:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Luis Diaz", preferred_language_code: "es", country_of_birth_code: "HN", date_of_birth: "1988-02-02", household_size: 2, annual_household_income_cents: 1500000, confidentiality_consent_scope: "FUNDER_AGGREGATE" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { luis_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Ana Sol", preferred_language_code: "es", country_of_birth_code: "SV", date_of_birth: "1992-03-03", household_size: 2, annual_household_income_cents: 1500000, confidentiality_consent_scope: "PROGRAM_ONLY" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { ana_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Eva Roth", preferred_language_code: "en", country_of_birth_code: "RO", date_of_birth: "1979-07-07", household_size: 1, annual_household_income_cents: 1200000, confidentiality_consent_scope: "FUNDER_IDENTIFIED" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { eva_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Ivo Kral", preferred_language_code: "en", country_of_birth_code: "CZ", date_of_birth: "1985-05-05", household_size: 1, annual_household_income_cents: 1000000, confidentiality_consent_scope: "FUNDER_IDENTIFIED" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { ivo_id: "$.data.id" }
            - call: "ACCEPT_INTAKE(client=${luis_id}, case_type=U_VISA, detained=false)"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { luis_intake_id: "$.data.id", luis_matter_id: "$.data[0].id" }
            - call: "ACCEPT_INTAKE(client=${ana_id}, case_type=U_VISA, detained=false)"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { ana_intake_id: "$.data.id", ana_matter_id: "$.data[0].id" }
            - call: "ACCEPT_INTAKE(client=${eva_id}, case_type=NATURALIZATION, detained=false)"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { eva_intake_id: "$.data.id", eva_matter_id: "$.data[0].id" }
            - call: "POST /intake-screenings/${eva_intake_id}/withdraw"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00.000Z" }
              as: ProgramDirector
            - call: "ACCEPT_INTAKE(client=${ivo_id}, case_type=U_VISA, detained=false)"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { ivo_intake_id: "$.data.id", ivo_matter_id: "$.data[0].id" }
            - call: "POST /grant-reports"
              payload: { cycle_id: "${cycle_id}", grant_code: "EOIR-LOP-26", period_start_date: "2026-08-31", period_end_date: "2026-08-31", disclosure_level: "DEIDENTIFIED_CASE_LEVEL" }
              as: GrantAnalyst
              captures: { deid_report_id: "$.data.id" }
            - call: "POST /grant-reports"
              payload: { cycle_id: "${cycle_id}", grant_code: "EOIR-LOP-26", period_start_date: "2026-08-31", period_end_date: "2026-08-31", disclosure_level: "IDENTIFIED_WITH_CONSENT" }
              as: GrantAnalyst
              captures: { ident_report_id: "$.data.id" }
          trigger:
            - call: "POST /grant-reports/${deid_report_id}/transition"
              payload: { action: "GENERATE" }
              as: GrantAnalyst
            - call: "POST /grant-reports/${ident_report_id}/transition"
              payload: { action: "GENERATE" }
              as: GrantAnalyst
          assert:
            - "both POST /grant-reports calls returned 201 — a period whose start equals its end is legal and sits inside the cycle window"
            - "CaseMatter.${eva_matter_id}.representation_status == 'WITHDRAWN_FROM' and outcome == 'WITHDRAWN' after the intake withdraw"
            - "trigger 1: HTTP status == 200, GrantReport.${deid_report_id}.status == 'GENERATED'"
            - "trigger 1: cases_served_count == 2, covering exactly ${luis_matter_id} and ${ana_matter_id} in created_at ASC order"
            - "trigger 1: ${matter_id} is absent (decided 2026-08-03, before the inclusive start) and ${ivo_matter_id} is absent (decided 2026-09-01, one day past the inclusive end)"
            - "trigger 1: ${eva_matter_id} is absent and is counted in NEITHER consent_verified_count NOR suppressed_case_count — withdrawal is an exclusion from the line set, not a suppression"
            - "trigger 1: consent_verified_count == 1 (Luis, FUNDER_AGGREGATE) and suppressed_case_count == 1 (Ana, PROGRAM_ONLY)"
            - "trigger 1: outcomes_summary == { 'NOT_YET_DECIDED': 2 }"
            - "trigger 2: HTTP status == 422, error_id == 'ERR_CONSENT_SCOPE_INSUFFICIENT' — IDENTIFIED_WITH_CONSENT admits only FUNDER_IDENTIFIED and Luis is FUNDER_AGGREGATE; GrantReport.${ident_report_id}.status stays 'DRAFT' with every count and money field still 0 and version still 1"

      - name: forum_is_case_type_driven_and_the_effective_deadline_is_the_min_of_candidates
        claim_type: correct_result
        grounds:
          - calculations.matter_forum_and_deadlines
          - endpoints[POST /intake-screenings/{intake_id}/decide]
          - entities.CaseMatter.fields.effective_filing_deadline_date
        distinguishing_aspect: "The forum comes from FORUM_BY_CASE_TYPE, not from where the client sits: a detained ASYLUM_AFFIRMATIVE matter is still ASYLUM_OFFICE, while a non-detained BOND_HEARING is still EOIR_IMMIGRATION_COURT. effective_filing_deadline_date is the minimum over the NON-NULL candidates: the detained matter carries a statutory 2026-09-30 and an expedited 2026-08-24 and must resolve to the earlier expedited date, while the non-detained matter has NO candidates at all and must resolve to null rather than treating a null candidate as an earliest date."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Facility 'El Paso SPC' (TX-ELP) has expedited_filing_days 21, so a matter decided 2026-08-03 and attached to it gets an expedited candidate of 2026-08-24."
            - "Two accepted matters for Rosa Mena in cycle FY26-H2: MA is ASYLUM_AFFIRMATIVE with detained true, facility_id supplied at intake creation (a detained intake with a null facility_id is rejected with ERR_FACILITY_REQUIRED_FOR_DETAINED) and statutory_deadline_date 2026-09-30; MB is BOND_HEARING with detained false, no facility and no statutory deadline. MA consumes a DETAINED_RESERVED slot, of which the cycle has 2."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /detention-facilities"
              payload: { name: "El Paso SPC", jurisdiction_code: "TX-ELP", visit_lead_time_hours: 48, max_daily_visit_slots: 4, expedited_filing_days: 21, access_credential_required: false }
              as: ProgramDirector
              captures: { facility_id: "$.data.id" }
            - call: "ACCEPT_INTAKE(client=${client_id}, case_type=ASYLUM_AFFIRMATIVE, detained=true, facility_id=${facility_id}, statutory_deadline_date=2026-09-30)"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { ma_id: "$.data[0].id" }
            - call: "ACCEPT_INTAKE(client=${client_id}, case_type=BOND_HEARING, detained=false)"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { mb_id: "$.data[0].id" }
          trigger:
            - call: "GET /case-matters/${ma_id}"
              payload: {}
              as: ProgramDirector
            - call: "GET /case-matters/${mb_id}"
              payload: {}
              as: ProgramDirector
          assert:
            - "CaseMatter.${ma_id}.forum == 'ASYLUM_OFFICE' — FORUM_BY_CASE_TYPE maps ASYLUM_AFFIRMATIVE to the asylum office even though the client is detained and the facility is an EOIR jurisdiction"
            - "CaseMatter.${mb_id}.forum == 'EOIR_IMMIGRATION_COURT' — BOND_HEARING maps to the immigration court even though the client is NOT detained"
            - "CaseMatter.${ma_id}.statutory_deadline_date == '2026-09-30', copied from the intake"
            - "CaseMatter.${ma_id}.expedited_deadline_date == '2026-08-24' — date(decided_at_utc) 2026-08-03 plus expedited_filing_days 21"
            - "CaseMatter.${ma_id}.effective_filing_deadline_date == '2026-08-24' — min over the two non-null candidates, so the expedited detained candidate wins by being earlier than the statutory one"
            - "CaseMatter.${mb_id}.expedited_deadline_date == null and effective_filing_deadline_date == null — the candidate list is empty, and an empty list yields null rather than collapsing onto the dropped candidate"
            - "CaseMatter.${ma_id}.detained == true and facility_id == '${facility_id}'; CaseMatter.${mb_id}.facility_id == null"

      - name: forum_grant_is_a_triple_intersection_with_a_partial_type_ceiling
        claim_type: constants_applied
        grounds:
          - calculations.accreditation_forum_grant
          - endpoints[POST /accreditations/{accreditation_id}/transition]
          - errors[ERR_FORUM_GRANT_EMPTY]
        distinguishing_aspect: "authorized_forums is the intersection of THREE sets — requested_forums, the recognition's authorized_forums and the type ceiling — sorted ascending, so a PARTIAL request for all four forums under a recognition holding all four still grants only ['ASYLUM_OFFICE','USCIS'] (alphabetical, not request order), and a PARTIAL request for EOIR_IMMIGRATION_COURT alone intersects to the empty set and is refused. A FULL request is still capped by the recognition, which lacks BIA. expiry_date is effective_date + 1095 days: 2026-08-03 + 1095 = 2029-08-02, which crosses two year boundaries including the 2028 leap day. NOTE: the calculation text names ERR_FORUM_NOT_AUTHORIZED for the empty intersection while §1.5 and §1.6 name ERR_FORUM_GRANT_EMPTY; the endpoint-specific id is asserted here."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. One OrganizationRecognition with authorized_forums ['USCIS','ASYLUM_OFFICE','EOIR_IMMIGRATION_COURT'] — deliberately without BIA — effective 2026-01-01, expiry 2030-01-01, so it is ACTIVE."
            - "Three ACCREDITED_REP representatives (no bar_number, which is mandatory for non-attorneys) plus Ada Ortiz as the approving STAFF_ATTORNEY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /representatives"
              payload: { full_name: "Ada Ortiz", rep_type: "STAFF_ATTORNEY", languages: ["en", "es"], max_case_load: 25, max_supervisees: 10, weekly_capacity_hours: 40, bar_number: "BAR-1001" }
              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /organization-recognitions"
              payload: { recognition_number: "REC-2026-001", effective_date: "2026-01-01", expiry_date: "2030-01-01", authorized_forums: ["USCIS", "ASYLUM_OFFICE", "EOIR_IMMIGRATION_COURT"] }
              as: ProgramDirector
              captures: { rec_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Rey", rep_type: "ACCREDITED_REP", languages: ["en", "es"], max_case_load: 15, max_supervisees: 0, weekly_capacity_hours: 40 }
              as: ProgramDirector
              captures: { rep_partial_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Omar Vale", rep_type: "ACCREDITED_REP", languages: ["en"], max_case_load: 15, max_supervisees: 0, weekly_capacity_hours: 40 }
              as: ProgramDirector
              captures: { rep_full_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Pia Lund", rep_type: "ACCREDITED_REP", languages: ["en"], max_case_load: 15, max_supervisees: 0, weekly_capacity_hours: 40 }
              as: ProgramDirector
              captures: { rep_empty_id: "$.data.id" }
            - call: "POST /accreditations"
              payload: { representative_id: "${rep_partial_id}", recognition_id: "${rec_id}", accreditation_type: "PARTIAL", requested_forums: ["USCIS", "BIA", "EOIR_IMMIGRATION_COURT", "ASYLUM_OFFICE"] }
              as: ProgramDirector
              captures: { acc_partial_id: "$.data.id" }
            - call: "POST /accreditations"
              payload: { representative_id: "${rep_full_id}", recognition_id: "${rec_id}", accreditation_type: "FULL", requested_forums: ["USCIS", "BIA", "EOIR_IMMIGRATION_COURT", "ASYLUM_OFFICE"] }
              as: ProgramDirector
              captures: { acc_full_id: "$.data.id" }
            - call: "POST /accreditations"
              payload: { representative_id: "${rep_empty_id}", recognition_id: "${rec_id}", accreditation_type: "PARTIAL", requested_forums: ["EOIR_IMMIGRATION_COURT"] }
              as: ProgramDirector
              captures: { acc_empty_id: "$.data.id" }
          trigger:
            - call: "POST /accreditations/${acc_partial_id}/transition"
              payload: { action: "APPROVE" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
            - call: "POST /accreditations/${acc_full_id}/transition"
              payload: { action: "APPROVE" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
            - call: "POST /accreditations/${acc_empty_id}/transition"
              payload: { action: "APPROVE" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
          assert:
            - "all three POST /accreditations calls returned 201 with status 'PENDING', authorized_forums [], effective_date null, expiry_date null and renewal_round 0"
            - "trigger 1: HTTP status == 200, Accreditation.${acc_partial_id}.status == 'APPROVED' and authorized_forums == ['ASYLUM_OFFICE', 'USCIS'] — the PARTIAL ceiling removes EOIR_IMMIGRATION_COURT even though the recognition holds it, BIA is removed by BOTH the recognition and the ceiling, and the output is sorted ascending rather than kept in request order"
            - "trigger 2: HTTP status == 200, Accreditation.${acc_full_id}.authorized_forums == ['ASYLUM_OFFICE', 'EOIR_IMMIGRATION_COURT', 'USCIS'] — the FULL ceiling admits all four but the recognition lacks BIA, so the recognition is the binding constraint"
            - "trigger 1 and 2: effective_date == '2026-08-03' and expiry_date == '2029-08-02' — effective_date + ACCREDITATION_TERM_DAYS 1095, spanning the 2028 leap day"
            - "trigger 1 and 2: approved_by_representative_id == '${atty_a_id}', renewal_round still 0"
            - "trigger 1 and 2: Representative.${rep_partial_id}.authorization_status == 'AUTHORIZED_ACCREDITED' and Representative.${rep_full_id}.authorization_status == 'AUTHORIZED_ACCREDITED'"
            - "trigger 3: HTTP status == 422, error_id == 'ERR_FORUM_GRANT_EMPTY' — the PARTIAL ceiling and the single EOIR_IMMIGRATION_COURT request intersect to the empty set; Accreditation.${acc_empty_id}.status stays 'PENDING' with authorized_forums [] and Representative.${rep_empty_id}.authorization_status stays 'UNAUTHORIZED'"

      - name: authorization_status_ladder_is_first_match_across_all_four_rep_types
        claim_type: constraint_propagation
        grounds:
          - calculations.representative_authorization_status
          - endpoints[POST /representatives]
          - endpoints[PATCH /representatives/{representative_id}]
        distinguishing_aspect: "The ladder is first-match, so Representative.status == 'SUSPENDED' short-circuits to AUTHORIZATION_SUSPENDED before the rep_type branches — a SUSPENDED staff attorney with a valid bar number is NOT AUTHORIZED_ATTORNEY. A STAFF_ATTORNEY branch depends only on status and bar_number, never on any accreditation; an ACCREDITED_REP with a merely PENDING accreditation is UNAUTHORIZED because the qualifying filter is an explicit enum set {APPROVED, EXPIRING, RENEWAL_PENDING}; and PRO_BONO_VOLUNTEER and LAW_GRADUATE both land on AUTHORIZED_SUPERVISED with no credential at all, so the two non-attorney families diverge sharply."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. One ACTIVE OrganizationRecognition with all four forums. Five representatives: a STAFF_ATTORNEY with a bar number, an ACCREDITED_REP whose accreditation stays PENDING, a PRO_BONO_VOLUNTEER, a LAW_GRADUATE, and a second STAFF_ATTORNEY used as the approver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /organization-recognitions"
              payload: { recognition_number: "REC-2026-001", effective_date: "2026-01-01", expiry_date: "2030-01-01", authorized_forums: ["USCIS", "ASYLUM_OFFICE", "EOIR_IMMIGRATION_COURT", "BIA"] }
              as: ProgramDirector
              captures: { rec_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Ada Ortiz", rep_type: "STAFF_ATTORNEY", languages: ["en", "es"], max_case_load: 25, max_supervisees: 10, weekly_capacity_hours: 40, bar_number: "BAR-1001" }
              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Rey", rep_type: "ACCREDITED_REP", languages: ["en", "es"], max_case_load: 15, max_supervisees: 0, weekly_capacity_hours: 40 }
              as: ProgramDirector
              captures: { acc_rep_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Vic Lang", rep_type: "PRO_BONO_VOLUNTEER", languages: ["en", "es"], max_case_load: 5, max_supervisees: 0, weekly_capacity_hours: 10 }
              as: ProgramDirector
              captures: { vol_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Gus Reed", rep_type: "LAW_GRADUATE", languages: ["en"], max_case_load: 5, max_supervisees: 0, weekly_capacity_hours: 20 }
              as: ProgramDirector
              captures: { grad_id: "$.data.id" }
            - call: "POST /accreditations"
              payload: { representative_id: "${acc_rep_id}", recognition_id: "${rec_id}", accreditation_type: "PARTIAL", requested_forums: ["USCIS"] }
              as: ProgramDirector
              captures: { acc_id: "$.data.id" }
          trigger:
            - call: "GET /representatives/${atty_a_id}"
              payload: {}
              as: ProgramDirector
            - call: "GET /representatives/${acc_rep_id}"
              payload: {}
              as: ProgramDirector
            - call: "GET /representatives/${vol_id}"
              payload: {}
              as: ProgramDirector
            - call: "GET /representatives/${grad_id}"
              payload: {}
              as: ProgramDirector
            - call: "PATCH /representatives/${atty_a_id}"
              payload: { status: "SUSPENDED" }
              as: ProgramDirector
            - call: "PATCH /representatives/${vol_id}"
              payload: { status: "INACTIVE" }
              as: ProgramDirector
          assert:
            - "trigger 1: Representative.${atty_a_id}.authorization_status == 'AUTHORIZED_ATTORNEY' — ACTIVE with a non-null bar_number, and no accreditation was ever needed"
            - "trigger 2: Representative.${acc_rep_id}.authorization_status == 'UNAUTHORIZED' — the accreditation exists but is PENDING, which is outside the qualifying enum set {APPROVED, EXPIRING, RENEWAL_PENDING}, and no SUSPENDED_BY_RECOGNITION row exists to reach the middle branch"
            - "trigger 3: Representative.${vol_id}.authorization_status == 'AUTHORIZED_SUPERVISED' — a PRO_BONO_VOLUNTEER needs only ACTIVE status, never a bar number or an accreditation"
            - "trigger 4: Representative.${grad_id}.authorization_status == 'AUTHORIZED_SUPERVISED' — LAW_GRADUATE falls into the same else branch as PRO_BONO_VOLUNTEER"
            - "trigger 5: Representative.${atty_a_id}.authorization_status == 'AUTHORIZATION_SUSPENDED' — the SUSPENDED short-circuit fires BEFORE the STAFF_ATTORNEY branch, so the still-valid bar_number does not restore AUTHORIZED_ATTORNEY"
            - "trigger 6: Representative.${vol_id}.authorization_status == 'UNAUTHORIZED' — INACTIVE is not SUSPENDED, so the ladder falls through to the else branch and fails its ACTIVE test, producing a different id from trigger 5"
            - "both PATCH calls incremented Representative.version by 1"

  # ===========================================================================
  # §1.4 breadth. One instance per declared CONFLICT PAIR, one per priority band
  # collision that the scaffold pins, plus the Satisfaction -> Pass row and the
  # six validation-pattern rows of the extraction guide.
  - section: validations
    instances:

      - name: conflict_pair_1_role_membership_beats_matter_existence
        claim_type: Priority Ordering
        grounds:
          - validations[priority 2 ERR_ROLE_NOT_PERMITTED]
          - validations[priority 6 ERR_MATTER_NOT_FOUND]
        distinguishing_aspect: "A ClientPortalUser POSTing /case-assignments with a syntactically valid but non-existent matter_id violates priority 2 AND priority 6 at once. Priority 2 must win, so the 403 leaks nothing about whether the matter exists — an implementation that resolves foreign keys before checking the roles list returns 404 and fails. The same request from ProgramDirector, whose role IS in the list, then does surface the 404, proving the second rule is live rather than absent."
        test_recipe:
          setup:
            - "TEMPLATE A gives a real cycle, three attorneys, Rosa Mena and one STAFFED matter, so the endpoint itself is fully functional. The literal uuid 00000000-0000-4000-8000-000000000999 is never created."
            - "The ClientPortalUser actor carries X-User-ID equal to Rosa Mena's client_id, so its identity resolves; only its role is wrong for this endpoint."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /case-assignments"
              payload: { matter_id: "00000000-0000-4000-8000-000000000999", representative_id: "${atty_a_id}", role_on_case: "CO_COUNSEL", expected_matter_version: 1 }
              as: ClientPortalUser
              as_user_id: "${client_id}"
            - call: "POST /case-assignments"
              payload: { matter_id: "00000000-0000-4000-8000-000000000999", representative_id: "${atty_a_id}", role_on_case: "CO_COUNSEL", expected_matter_version: 1 }
              as: ProgramDirector
          assert:
            - "trigger 1: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED', NOT 404 / ERR_MATTER_NOT_FOUND"
            - "trigger 1: the response body contains no field disclosing the existence or non-existence of the matter"
            - "trigger 2: HTTP status == 404 and error_id == 'ERR_MATTER_NOT_FOUND' — with a permitted role the lower-priority existence rule is reached, so priority 6 is genuinely implemented"
            - "no CaseAssignment row was created by either trigger: GET /case-assignments?matter_id=${matter_id} still returns exactly 1 row (the LEAD)"

      - name: conflict_pair_2_supervision_link_existence_beats_matter_closed
        claim_type: Priority Ordering
        grounds:
          - validations[priority 11 ERR_SUPERVISION_LINK_NOT_FOUND]
          - validations[priority 15 ERR_MATTER_CLOSED]
        distinguishing_aspect: "Supplying a non-existent supervision_link_id on a matter that is already WITHDRAWN_FROM violates priority 11 and priority 15 simultaneously. Priority 11 wins with a 404, which is the counter-intuitive direction: the coarse state guard on the matter is cheaper to evaluate and would naturally be checked first, yet the scaffold pins the fine-grained existence check ahead of it. Removing the bogus link id from the same request then yields the 409, proving both rules exist."
        test_recipe:
          setup:
            - "TEMPLATE A, then the intake is withdrawn from ACCEPTED, which cascades the matter to representation_status WITHDRAWN_FROM and releases the LEAD assignment."
            - "Vic Lang is a PRO_BONO_VOLUNTEER, so an assignment for him would ordinarily need a supervision link."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /representatives"
              payload: { full_name: "Vic Lang", rep_type: "PRO_BONO_VOLUNTEER", languages: ["en", "es"], max_case_load: 5, max_supervisees: 0, weekly_capacity_hours: 10 }
              as: ProgramDirector
              captures: { vol_id: "$.data.id" }
            - call: "POST /intake-screenings/${intake_id}/withdraw"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { closed_v: "$.data.version" }
          trigger:
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${vol_id}", role_on_case: "LEAD", supervision_link_id: "00000000-0000-4000-8000-000000000111", expected_matter_version: "${closed_v}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${vol_id}", role_on_case: "LEAD", expected_matter_version: "${closed_v}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "setup: CaseMatter.${matter_id}.representation_status == 'WITHDRAWN_FROM' and the LEAD assignment ${lead_id}.status == 'RELEASED' with release_reason_code == 'CLIENT_WITHDREW'"
            - "trigger 1: HTTP status == 404 and error_id == 'ERR_SUPERVISION_LINK_NOT_FOUND', NOT 409 / ERR_MATTER_CLOSED"
            - "trigger 2: HTTP status == 409 and error_id == 'ERR_MATTER_CLOSED' — with the bogus link removed the state rule at priority 15 is reached"
            - "neither trigger created a row: GET /case-assignments?matter_id=${matter_id} returns exactly 1 row, the RELEASED lead"

      - name: conflict_pair_3_matter_not_ready_beats_forum_not_authorized_and_lead_absence_preempts_both
        claim_type: Priority Ordering
        grounds:
          - validations[priority 18 ERR_MATTER_NOT_READY]
          - validations[priority 24 ERR_FORUM_NOT_AUTHORIZED]
          - errors[ERR_LEAD_NOT_ASSIGNED]
        distinguishing_aspect: "A DETAINED ASYLUM_DEFENSIVE matter (forum EOIR_IMMIGRATION_COURT) whose readiness index sits at 0.7499 and whose LEAD is a PARTIAL-accredited representative violates priority 18 and priority 24 together; priority 18 must win. Then, once that lead is released and the matter falls into COVERAGE_GAP, the very same advance-filing call fails with ERR_LEAD_NOT_ASSIGNED instead — a third error id for one unchanged request, because the forum rule presupposes a lead to examine. 0.7499 versus 0.7500 is the only numeric difference between failure and success."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Recognition REC-2026-001 with all four forums. Nadia Rey is an ACCREDITED_REP holding a PARTIAL accreditation over ['USCIS'], so her grant can never cover EOIR_IMMIGRATION_COURT."
            - "A detained ASYLUM_DEFENSIVE matter for Rosa Mena at facility El Paso SPC (TX-ELP, a SERVED_JURISDICTION). Ada Ortiz holds an ACTIVE SUPERVISOR assignment; Nadia Rey holds the ACTIVE LEAD, supervised by Ada. Ben Cole holds an ACTIVE CO_COUNSEL so a declaration can be certified."
            - "Evidence: one REQUIRED item of 8 points left REQUESTED and one SUPPORTING item of 23 points VERIFIED, giving 23/31 == 0.7419; a CERTIFIED Spanish declaration exists and the matter is in EVIDENCE_GATHERING."
          setup_api_calls:
            - call: "TEMPLATE B, with the intake replaced by case_type ASYLUM_DEFENSIVE, detained true and facility_id set to a facility created in the same macro (facility 'El Paso SPC', TX-ELP, visit_lead_time_hours 24, max_daily_visit_slots 2, expedited_filing_days 21), and with the LEAD assignment given to Nadia Rey under Ada Ortiz's ACTIVE SUPERVISOR assignment instead of to Ada directly"
              payload: {}
              as: ProgramDirector
              captures: { fac_id: "$.data.id", nadia_id: "$.data.id", nadia_lead_id: "$.data.id", ada_sup_id: "$.data.id" }
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "POLICE_REPORT", tier: "REQUIRED", weight_points: 8, requires_translation: false }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { req_ev_id: "$.data.id" }
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "COUNTRY_CONDITIONS_REPORT", tier: "SUPPORTING", weight_points: 23, requires_translation: false }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { sup_ev_id: "$.data.id" }
            - call: "POST /evidence-items/${sup_ev_id}/transition"
              payload: { action: "RECEIVE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /evidence-items/${sup_ev_id}/transition"
              payload: { action: "VERIFY" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "EVIDENCE_GATHERING" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          trigger:
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "READY_TO_FILE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${nadia_lead_id}/transition"
              payload: { action: "RELEASE", release_reason_code: "REASSIGNED" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-matters/${matter_id}/advance-filing"
              payload: { target_filing_status: "READY_TO_FILE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "setup: Accreditation for Nadia Rey has authorized_forums == ['USCIS'] and CaseMatter.${matter_id}.forum == 'EOIR_IMMIGRATION_COURT', so the forum rule at priority 24 is genuinely violated"
            - "setup: CaseMatter.${matter_id}.readiness_index_weighted == 0.7419 (23/31 rounded HALF UP at 4dp), below READY_TO_FILE_WEIGHTED_MIN 0.7500, and detained == true so the EVIDENCE_WEIGHTED_GATE variant applies"
            - "trigger 1: HTTP status == 409 and error_id == 'ERR_MATTER_NOT_READY', NOT 422 / ERR_FORUM_NOT_AUTHORIZED — the state band at priority 18 outranks the business_safety band at 24"
            - "trigger 2: HTTP status == 200, CaseAssignment.${nadia_lead_id}.status == 'RELEASED', CaseMatter.${matter_id}.representation_status == 'COVERAGE_GAP'"
            - "trigger 3: HTTP status == 409 and error_id == 'ERR_LEAD_NOT_ASSIGNED' — a third distinct id for the byte-identical request of trigger 1, because with no lead the forum grant is never computed"
            - "filing_status is still 'EVIDENCE_GATHERING' after all three triggers"

      - name: conflict_pair_4_caseload_cap_beats_frozen_cycle_and_an_override_unmasks_it
        claim_type: Priority Ordering
        grounds:
          - validations[priority 26 ERR_CASELOAD_CAP_EXCEEDED]
          - validations[priority 34 ERR_CYCLE_CAPACITY_FROZEN]
          - endpoints[POST /capacity-cycles/{cycle_id}/posture-override]
        distinguishing_aspect: "One ACTIVATE call violates both the per-representative caseload cap and the cycle-level FROZEN posture; priority 26 must win. A director override that downgrades FROZEN to RESTRICTED then leaves the caseload error unchanged (proving the two rules are independent), while raising the representative's max_case_load with the override still in force finally lets the call through. The posture boundary is exact: 19/20 == 0.9500 is FROZEN, and the override never downgrades RESTRICTED to OPEN."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Cycle FY26-H2 with total_case_slots 20 and reserved_detained_slots 0. Ada Ortiz has max_case_load 1; Ben Cole and Sara Ruiz have max_case_load 25."
            - "Nineteen non-detained U_VISA matters are accepted for nineteen distinct clients, giving utilization_ratio 19/20 == 0.9500 and capacity_posture FROZEN."
            - "Ada is already LEAD-and-ACTIVE on the first of those matters, so her active_case_load is exactly 1 and equal to her cap. A twentieth matter M20 is accepted (utilization 20/20 == 1.0000, still FROZEN) and a PROPOSED CO_COUNSEL assignment for Ada is created on M20 while the posture override is briefly in force, so the ACTIVATE call below is the only step that has to trip both rules."
          setup_api_calls:
            - call: "TEMPLATE A, with total_case_slots 20, reserved_detained_slots 0 and Ada Ortiz's max_case_load set to 1"
              payload: {}
              as: ProgramDirector
            - call: "18 further repetitions of: POST /clients then ACCEPT_INTAKE(client=<new>, case_type=U_VISA, detained=false)"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "GET /capacity-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /capacity-cycles/${cycle_id}/posture-override"
              payload: { posture_override_until_utc: "2026-08-04T00:00:00.000Z", override_reason_code: "DIRECTOR_DISCRETION" }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Tom Vega", preferred_language_code: "en", country_of_birth_code: "MX", date_of_birth: "1991-01-01", household_size: 1, annual_household_income_cents: 1000000 }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { c20_id: "$.data.id" }
            - call: "ACCEPT_INTAKE(client=${c20_id}, case_type=U_VISA, detained=false)"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { m20_id: "$.data[0].id", m20_v: "$.data[0].version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${m20_id}", representative_id: "${atty_a_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${m20_v}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { a20_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00.000Z" }
              as: ProgramDirector
            - call: "GET /capacity-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /case-assignments/${a20_id}/transition"
              payload: { action: "ACTIVATE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /capacity-cycles/${cycle_id}/posture-override"
              payload: { posture_override_until_utc: "2026-08-06T00:00:00.000Z", override_reason_code: "DIRECTOR_DISCRETION" }
              as: ProgramDirector
            - call: "POST /case-assignments/${a20_id}/transition"
              payload: { action: "ACTIVATE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "PATCH /representatives/${atty_a_id}"
              payload: { max_case_load: 5 }
              as: ProgramDirector
            - call: "POST /case-assignments/${a20_id}/transition"
              payload: { action: "ACTIVATE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "setup after 19 matters: ProgramCapacityCycle.${cycle_id}.utilization_ratio == 0.9500 and capacity_posture == 'FROZEN' — 0.9500 is inclusive"
            - "setup after the clock moves to 2026-08-05: the first override instant 2026-08-04T00:00:00.000Z is now in the past, so capacity_posture is 'FROZEN' again and Representative.${atty_a_id}.active_case_load == 1 == max_case_load"
            - "trigger 1: HTTP status == 422 and error_id == 'ERR_CASELOAD_CAP_EXCEEDED', NOT 409 / ERR_CYCLE_CAPACITY_FROZEN"
            - "trigger 2: HTTP status == 200 and ProgramCapacityCycle.${cycle_id}.capacity_posture == 'RESTRICTED' — an override instant strictly after the clock downgrades FROZEN one step only, never to OPEN, and utilization_ratio is unchanged at 1.0000"
            - "trigger 3: HTTP status == 422 and error_id == 'ERR_CASELOAD_CAP_EXCEEDED' — removing the FROZEN violation leaves the caseload violation untouched, proving the two rules are independent rather than one masking the other"
            - "trigger 5: HTTP status == 200, CaseAssignment.${a20_id}.status == 'ACTIVE' and Representative.${atty_a_id}.active_case_load == 2"
            - "at no point did an ACTIVATE change ProgramCapacityCycle.utilization_ratio — activation consumes caseload, not slots"

      - name: auth_band_ladder_unauthenticated_then_role_then_row_scope_then_inactive
        claim_type: Priority Ordering
        grounds:
          - validations[priority 1 ERR_UNAUTHENTICATED]
          - validations[priority 2 ERR_ROLE_NOT_PERMITTED]
          - validations[priority 3 ERR_ACTOR_NOT_ON_CASE]
          - validations[priority 4 ERR_REPRESENTATIVE_INACTIVE]
        distinguishing_aspect: "Four distinct 401/403 outcomes for the same POST /evidence-items call, separated only by the actor headers, and each must pre-empt the next: an unknown role name is 401 before any path id is resolved; a permitted-but-wrong role is 403 ERR_ROLE_NOT_PERMITTED; a CaseRepresentative holding no assignment on the matter is 403 ERR_ACTOR_NOT_ON_CASE; and a CaseRepresentative who DOES hold the assignment but whose Representative row is SUSPENDED is 403 ERR_REPRESENTATIVE_INACTIVE. Collapsing any pair into a single generic 403 fails."
        test_recipe:
          setup:
            - "TEMPLATE A. Ada Ortiz holds the ACTIVE LEAD on the matter; Sara Ruiz holds no assignment on it."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 10 }
              as: "AuditorGeneral"
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 10 }
              as: GrantAnalyst
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 10 }
              as: CaseRepresentative
              as_user_id: "${screener_id}"
            - call: "PATCH /representatives/${atty_a_id}"
              payload: { status: "SUSPENDED" }
              as: ProgramDirector
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 10 }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          assert:
            - "trigger 1: HTTP status == 401 and error_id == 'ERR_UNAUTHENTICATED' — 'AuditorGeneral' is not a §1.7 role, and the matter id is never resolved"
            - "trigger 2: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED' — GrantAnalyst is authenticated but absent from this endpoint's roles list"
            - "trigger 3: HTTP status == 403 and error_id == 'ERR_ACTOR_NOT_ON_CASE' — Sara Ruiz's role is permitted but she holds no PROPOSED, ACTIVE or SUSPENDED assignment on ${matter_id}; a distinct id from trigger 2"
            - "trigger 5: HTTP status == 403 and error_id == 'ERR_REPRESENTATIVE_INACTIVE' — Ada Ortiz still holds the ACTIVE LEAD, so row scoping passes and only the priority-4 status rule fails"
            - "GET /evidence-items?matter_id=${matter_id} returns 0 rows — no trigger created anything"

      - name: existence_band_specific_not_found_ids_pre_empt_the_generic_one_and_validation
        claim_type: Priority Ordering
        grounds:
          - validations[priority 5 ERR_NOT_FOUND]
          - validations[priority 7 ERR_CLIENT_NOT_FOUND]
          - validations[priority 9 ERR_CYCLE_NOT_FOUND]
          - validations[priority 10 ERR_FACILITY_NOT_FOUND]
          - validations[priority 13 ERR_VALIDATION]
        distinguishing_aspect: "A single POST /intake-screenings can violate the client, cycle and facility existence rules plus a payload-shape rule all at once; the response must be ERR_CLIENT_NOT_FOUND because priority 7 is the lowest number among them, and it must NOT be the generic ERR_NOT_FOUND. Repairing one id at a time walks the ladder 7 -> 9 -> 10 -> 13, producing four different error ids from four nearly identical requests, and the generic priority-5 id appears only where no entity-specific rule is declared, e.g. an unknown declaration_id in a path."
        test_recipe:
          setup:
            - "TEMPLATE A. The uuids ...0aaa (client), ...0bbb (cycle), ...0ccc (facility) and ...0ddd (accreditation) are never created."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /intake-screenings"
              payload: { client_id: "00000000-0000-4000-8000-000000000aaa", cycle_id: "00000000-0000-4000-8000-000000000bbb", case_type: "NOT_A_CASE_TYPE", detained: true, facility_id: "00000000-0000-4000-8000-000000000ccc" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "00000000-0000-4000-8000-000000000bbb", case_type: "NOT_A_CASE_TYPE", detained: true, facility_id: "00000000-0000-4000-8000-000000000ccc" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "NOT_A_CASE_TYPE", detained: true, facility_id: "00000000-0000-4000-8000-000000000ccc" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "NOT_A_CASE_TYPE", detained: false }
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "GET /accreditations/00000000-0000-4000-8000-000000000ddd"
              payload: {}
              as: ProgramDirector
          assert:
            - "trigger 1: HTTP status == 404 and error_id == 'ERR_CLIENT_NOT_FOUND' — priority 7 beats 9, 10 and 13, and beats the generic ERR_NOT_FOUND of priority 5"
            - "trigger 2: HTTP status == 404 and error_id == 'ERR_CYCLE_NOT_FOUND'"
            - "trigger 3: HTTP status == 404 and error_id == 'ERR_FACILITY_NOT_FOUND'"
            - "trigger 4: HTTP status == 422 and error_id == 'ERR_VALIDATION' — with every foreign key resolvable, the unknown case_type enum finally surfaces at priority 13"
            - "trigger 5: HTTP status == 404 and error_id == 'ERR_NOT_FOUND' — no accreditation-specific 404 id is declared anywhere in §1.4, so the generic priority-5 id is the correct answer for that path parameter"
            - "GET /intake-screenings?client_id=${client_id} still returns exactly 1 row, the ACCEPTED intake from TEMPLATE A"

      - name: satisfaction_to_pass_the_happy_path_trips_no_rule_at_any_priority
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority 13 ERR_VALIDATION]
          - validations[priority 26 ERR_CASELOAD_CAP_EXCEEDED]
          - validations[priority 34 ERR_CYCLE_CAPACITY_FROZEN]
          - validations[priority 35 ERR_INDIGENCY_CEILING_EXCEEDED]
          - validations[priority 38 ERR_STALE_MATTER_VERSION]
        distinguishing_aspect: "Every value in this chain sits deliberately at the safe side of a boundary that the scaffold elsewhere uses to reject: fpl_percent 77.76 is well under the 200.00 ceiling, utilization 1/10 == 0.1000 is under the 0.8000 RESTRICTED step, active_case_load 0 is under max_case_load 25, and the OCC token is freshly read. The whole chain must return 201/200 with no error envelope anywhere — an implementation that is over-eager on any single rule fails here rather than on a negative test."
        test_recipe:
          setup:
            - "Empty database, logical clock left at the startup default so this instance also pins that default."
          setup_api_calls:
            - call: "GET /capacity-cycles"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "TEMPLATE A, but WITHOUT its step 1 clock call, so every timestamp is anchored on the startup default 2026-08-01T00:00:00Z"
              payload: {}
              as: ProgramDirector
          assert:
            - "every call in the chain returned its declared success code: 201 for POST /capacity-cycles, /representatives, /clients, /intake-screenings and /case-assignments; 200 for /screen, /decide, GET /case-matters and the ACTIVATE transition"
            - "no response body contains an error_id field"
            - "Client.${client_id}.fpl_percent == 77.76 — inside the 200.00 ceiling, so priority 35 stays quiet"
            - "IntakeScreening.${intake_id}.legal_eligibility_verdict == 'ELIGIBLE' and status == 'ACCEPTED'"
            - "IntakeScreening.${intake_id}.decided_at_utc == '2026-08-01T00:00:00.000Z' — the startup logical clock, never host wall-clock time"
            - "ProgramCapacityCycle.${cycle_id}.general_slots_consumed == 1, available_slot_count == 9, utilization_ratio == 0.1000 and capacity_posture == 'OPEN' — under the 0.8000 step, so priority 34 stays quiet"
            - "Representative.${atty_a_id}.active_case_load == 1 with max_case_load 25, so priority 26 stays quiet"
            - "CaseMatter.${matter_id}.representation_status == 'STAFFED' and filing_status == 'PRE_FILING'"
            - "the expected_matter_version supplied to POST /case-assignments equalled CaseMatter.version at that instant, so priority 38 stays quiet, and CaseMatter.version incremented afterwards"

      - name: aggregate_validation_supervisee_cap_is_collective_and_lands_exactly_on_the_cap
        claim_type: aggregate_validation
        grounds:
          - validations[priority 25 ERR_SUPERVISEE_CAP_EXCEEDED]
          - calculations.supervisor_auto_selection
        distinguishing_aspect: "Each individual supervised assignment is perfectly legal; only the collective count trips the rule. With max_supervisees 2 the first two ACTIVATEs succeed and the second lands supervisee_count exactly ON the cap without error (the check is strictly `<`), and the third fails. Releasing one supervisee then frees exactly one slot, so the rule reads a live recomputed counter rather than a monotonic tally."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Cycle FY26-H2 with 10 slots. Ada Ortiz is a STAFF_ATTORNEY with max_supervisees 2. Three PRO_BONO_VOLUNTEERs (Vic, Wes, Zoe) all speak es."
            - "Three separate accepted U_VISA matters for three clients, each with Ada as ACTIVE SUPERVISOR, and one volunteer proposed as LEAD on each."
          setup_api_calls:
            - call: "TEMPLATE A, with Ada Ortiz's max_supervisees set to 2"
              payload: {}
              as: ProgramDirector
            - call: "3 x POST /representatives for Vic Lang, Wes Duro and Zoe Adan, each rep_type PRO_BONO_VOLUNTEER, languages ['en','es'], max_case_load 5, max_supervisees 0, weekly_capacity_hours 10"
              payload: {}
              as: ProgramDirector
              captures: { vic_id: "$.data.id", wes_id: "$.data.id", zoe_id: "$.data.id" }
            - call: "2 x (POST /clients then ACCEPT_INTAKE(client=<new>, case_type=U_VISA, detained=false)) producing matters M2 and M3"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { m2_id: "$.data[0].id", m3_id: "$.data[0].id" }
            - call: "on each of ${matter_id}, ${m2_id} and ${m3_id}: GET the matter for its version, then POST /case-assignments for Ada Ortiz with role_on_case SUPERVISOR and that version, then ACTIVATE it"
              payload: {}
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { sup1_id: "$.data.id", sup2_id: "$.data.id", sup3_id: "$.data.id" }
            - call: "on each matter in turn: GET the matter for its fresh version, then POST /case-assignments for the matching volunteer with role_on_case LEAD and that version (Vic on ${matter_id}, Wes on ${m2_id}, Zoe on ${m3_id})"
              payload: {}
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { vic_lead_id: "$.data.id", wes_lead_id: "$.data.id", zoe_lead_id: "$.data.id" }
          trigger:
            - call: "POST /case-assignments/${vic_lead_id}/transition"
              payload: { action: "ACTIVATE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${wes_lead_id}/transition"
              payload: { action: "ACTIVATE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${zoe_lead_id}/transition"
              payload: { action: "ACTIVATE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${vic_lead_id}/transition"
              payload: { action: "RELEASE", release_reason_code: "REASSIGNED" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${zoe_lead_id}/transition"
              payload: { action: "ACTIVATE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "setup: all three LEAD creations returned 201 with supervision_link_id pointing at Ada's SUPERVISOR assignment on the same matter and supervision_source == 'AUTO_SELECTED' — creation is legal for all three because supervisee_count only rises on ACTIVATE"
            - "trigger 1: HTTP status == 200, Representative.${atty_a_id}.supervisee_count == 1"
            - "trigger 2: HTTP status == 200, Representative.${atty_a_id}.supervisee_count == 2 — landing exactly ON max_supervisees is accepted because the check is supervisee_count < max_supervisees evaluated BEFORE the increment"
            - "trigger 3: HTTP status == 422 and error_id == 'ERR_SUPERVISEE_CAP_EXCEEDED'; CaseAssignment.${zoe_lead_id}.status stays 'PROPOSED' and supervisee_count stays 2"
            - "trigger 4: HTTP status == 200, Representative.${atty_a_id}.supervisee_count == 1 — the counter is recomputed from live ACTIVE links, not accumulated"
            - "trigger 5: HTTP status == 200, supervisee_count == 2 — the freed slot is reusable"
            - "Representative.${atty_a_id}.active_case_load is unaffected throughout, because SUPERVISOR assignments are not LEAD or CO_COUNSEL"

      - name: conditional_validation_readback_is_required_only_when_the_client_needs_an_interpreter
        claim_type: conditional_validation
        grounds:
          - validations[priority 29 ERR_READBACK_NOT_COMPLETED]
          - state_machines.Declaration
          - entities.Client.fields.interpreter_required
        distinguishing_aspect: "The read-back rule is conditional on the client's configuration, so the SAME CERTIFY call succeeds or fails depending on a flag on a different entity. An English-speaking client (interpreter_required defaults to false because preferred_language_code == 'en') certifies with no interpretation session at all, while a Spanish-speaking client's identically shaped declaration is refused until a COMPLETED DECLARATION_READBACK session in 'es' exists — and a COMPLETED session in the WRONG language does not satisfy it."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z, cycle FY26-H2, Ada Ortiz (LEAD) and Ben Cole (CO_COUNSEL) on both matters below."
            - "Client EN: Dan Poe, preferred_language_code 'en', so interpreter_required defaults to false. Client ES: Rosa Mena, preferred_language_code 'es', so interpreter_required defaults to true."
            - "Each matter carries one declaration prepared by Ada in the client's own language and already SUBMIT_FOR_REVIEW'd — for Rosa's matter that submission itself needs a completed 'es' readback, so the divergence is observed on CERTIFY using a WRONG-language session first."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { mv2: "$.data.version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${atty_b_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${mv2}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { cocounsel_id: "$.data.id" }
            - call: "POST /case-assignments/${cocounsel_id}/transition"
              payload: { action: "ACTIVATE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /declarations"
              payload: { matter_id: "${matter_id}", preparer_assignment_id: "${lead_id}", language_code: "es", word_count: 900 }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { decl_es_id: "$.data.id" }
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${matter_id}", language_code: "pt", interpreter_source: "CONTRACT", purpose: "DECLARATION_READBACK", scheduled_start_utc: "2026-08-03T07:00:00.000Z", scheduled_end_utc: "2026-08-03T08:00:00.000Z" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { sess_pt_id: "$.data.id" }
            - call: "POST /interpretation-sessions/${sess_pt_id}/transition"
              payload: { action: "COMPLETE", actual_minutes: 30 }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /declarations/${decl_es_id}/transition"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /clients"
              payload: { full_name: "Dan Poe", preferred_language_code: "en", country_of_birth_code: "US", date_of_birth: "1990-06-06", household_size: 1, annual_household_income_cents: 1000000 }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { en_client_id: "$.data.id" }
            - call: "ACCEPT_INTAKE(client=${en_client_id}, case_type=U_VISA, detained=false)"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { en_matter_id: "$.data[0].id" }
            - call: "on ${en_matter_id}: GET for version, POST /case-assignments LEAD Ada + ACTIVATE, GET for version, POST /case-assignments CO_COUNSEL Ben + ACTIVATE"
              payload: {}
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { en_lead_id: "$.data.id", en_cocounsel_id: "$.data.id" }
            - call: "POST /declarations"
              payload: { matter_id: "${en_matter_id}", preparer_assignment_id: "${en_lead_id}", language_code: "en", word_count: 900 }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { decl_en_id: "$.data.id" }
            - call: "POST /declarations/${decl_en_id}/transition"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          trigger:
            - call: "POST /declarations/${decl_en_id}/transition"
              payload: { action: "CERTIFY", reviewer_assignment_id: "${en_cocounsel_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /declarations/${decl_es_id}/transition"
              payload: { action: "CERTIFY", reviewer_assignment_id: "${cocounsel_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${matter_id}", language_code: "es", interpreter_source: "CONTRACT", purpose: "DECLARATION_READBACK", scheduled_start_utc: "2026-08-03T07:00:00.000Z", scheduled_end_utc: "2026-08-03T08:00:00.000Z" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { sess_es_id: "$.data.id" }
            - call: "POST /interpretation-sessions/${sess_es_id}/transition"
              payload: { action: "COMPLETE", actual_minutes: 30 }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /declarations/${decl_es_id}/transition"
              payload: { action: "CERTIFY", reviewer_assignment_id: "${cocounsel_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "setup: Client.${en_client_id}.interpreter_required == false (defaulted from preferred_language_code == 'en') and Client.${client_id}.interpreter_required == true"
            - "trigger 1: HTTP status == 200, Declaration.${decl_en_id}.status == 'CERTIFIED' with readback_session_id null and readback_completed false — no interpretation session was ever created on that matter, and the rule simply does not apply"
            - "trigger 2: HTTP status == 409 and error_id == 'ERR_READBACK_NOT_COMPLETED' — a COMPLETED 'pt' DECLARATION_READBACK session does not satisfy a client whose preferred_language_code is 'es'"
            - "trigger 4: HTTP status == 200 and the COMPLETE side effect binds the session to the IN_REVIEW same-language declaration: Declaration.${decl_es_id}.readback_session_id == '${sess_es_id}' and readback_completed == true, still status 'IN_REVIEW'"
            - "trigger 5: HTTP status == 200, Declaration.${decl_es_id}.status == 'CERTIFIED'"
            - "CaseMatter.${matter_id}.interpretation_cost_cents == 9500 — two COMPLETED 30-minute CONTRACT sessions, 'pt' and 'es' both COMMON, 4750 each"

      - name: temporal_validation_a_reschedule_creates_the_conflict_and_is_capped_at_three
        claim_type: temporal_validation
        grounds:
          - validations[priority 30 ERR_REPRESENTATIVE_CALENDAR_CONFLICT]
          - endpoints[POST /calendar-events/{event_id}/reschedule]
          - errors[ERR_RESCHEDULE_LIMIT_REACHED]
        distinguishing_aspect: "Both events are individually legal when created; the conflict only comes into existence when one of them is MOVED, so the scan must run on /reschedule and not only on creation — and it must exclude the row being moved from its own comparison set, otherwise every reschedule would collide with its own old interval. The rejected attempt must not consume a reschedule slot: after one rejected and three accepted moves the fourth accepted attempt is refused with ERR_RESCHEDULE_LIMIT_REACHED at reschedule_count == 3."
        test_recipe:
          setup:
            - "TEMPLATE A. Two BIOMETRICS events for Ada Ortiz on 2026-09-20, E1 from 09:00 to 10:00 and E2 from 14:00 to 15:00, both at location 'USCIS-ELP-ASC' and both client_conflict_waived true. With a 30-minute buffer they are far apart and both create cleanly."
          setup_api_calls:
            - call: "TEMPLATE A"
