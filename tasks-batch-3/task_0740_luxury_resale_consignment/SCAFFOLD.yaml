# =============================================================================
# PRD-bench seed tables — Luxury Resale & Consignment Authentication
# Difficulty: Expert
# =============================================================================

scenario: |
  740. Luxury Resale & Consignment Authentication (The RealReal/Poshmark style):
  consignment intake & authentication/grading, pricing & commission tier, listing
  & inventory, sale & payout schedule, returns/authenticity dispute, buyer/seller
  fee, direct-shop (closet) & offer, white-glove pickup

domain_name: luxury-resale-consignment
api_prefix: /consignment

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep nesting in URLs. Every entity
  # is a top-level collection under /consignment; children are reached by
  # filtered lists (?fk=) or sub-resource lists (payouts/disputes under a sale).

  state_machine_shape: parallel
  # Sale carries two independent state axes (payment_status × fulfillment_status).
  # Offer is cyclic (PENDING <-> COUNTERED negotiation rounds). ConsignmentItem
  # has a relist cycle (SOLD -> LISTED). Others are branching/linear.

  relationship_patterns:
    - one_to_many        # Seller -> ConsignmentItems, Sale -> Payout, Sale -> Disputes
    - cross_aggregate    # Listing pricing reads CategoryPolicy; Payout release reads Sale + Dispute
    - polymorphic: false

  role_model: peer_roles
  # Seller / Buyer / Authenticator / ConciergeAgent each own distinct resource
  # types; OpsAdmin is an operational superset for config, disputes, payouts.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only; never a business-decision input)" }
      - { name: display_name, type: string, source: input, description: "Consignor display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Account status; only ACTIVE is produced in this scaffold (system-initialized on create)", constraints: "ACTIVE" }
      - { name: tier, type: enum, source: computed, default: STANDARD, description: "Loyalty tier derived from lifetime_net_sales_cents; STANDARD | PREMIER | ELITE", constraints: "STANDARD, PREMIER, ELITE" }
      - { name: lifetime_net_sales_cents, type: integer, source: computed, default: 0, description: "Sum of seller_net_payout_cents over RELEASED payouts (tier basis); reversal subtracts exactly" }
      - { name: pending_payout_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this seller's Payouts in status SCHEDULED or HELD" }
      - { name: released_payout_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this seller's Payouts in status RELEASED" }
      - { name: reversed_payout_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this seller's Payouts in status REVERSED" }
      - { name: payout_balance_cents, type: integer, source: computed, default: 0, description: "pending_payout_cents + released_payout_cents (money owed or already paid, excluding reversed)" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: display_name, type: string, source: input, description: "Buyer display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Account status; only ACTIVE is produced in this scaffold (system-initialized on create)", constraints: "ACTIVE" }
      - { name: lifetime_purchases_cents, type: integer, source: computed, default: 0, description: "Sum of order_total_cents over Sales that are DELIVERED and not RETURNED; a RETURNED sale subtracts its order_total_cents exactly" }

  - name: CategoryPolicy
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: category, type: enum, source: input, description: "Unique luxury category key; HANDBAGS | WATCHES | JEWELRY | APPAREL | SHOES", constraints: "unique; HANDBAGS, WATCHES, JEWELRY, APPAREL, SHOES" }
      - { name: base_commission_pct, type: number, source: input, description: "Base platform commission fraction on sale_price before tier discount (e.g., 0.20)" }
      - { name: buyer_fee_pct, type: number, source: input, description: "Buyer protection fee fraction on sale_price (e.g., 0.10)" }
      - { name: buyer_fee_flat_cents, type: integer, source: input, description: "Flat buyer fee component added to the percentage component" }
      - { name: return_window_days, type: integer, source: input, description: "Days after delivered_at during which a dispute may be filed (inclusive)" }
      - { name: min_offer_pct, type: number, source: input, description: "Minimum acceptable offer as a fraction of list_price_cents (e.g., 0.70)" }
      - { name: listable_min_condition_grade, type: enum, source: input, description: "Worst condition grade still eligible to list; A | B | C | D (A best)", constraints: "A, B, C, D" }
      - { name: pickup_insurance_cap_cents, type: integer, source: input, description: "Max declared_value_cents insurable on a white-glove pickup for this category" }

  - name: ConsignmentItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; owning consignor" }
      - { name: category, type: enum, source: input, description: "Category key; resolves the CategoryPolicy WHERE CategoryPolicy.category == this value (unique)", constraints: "HANDBAGS, WATCHES, JEWELRY, APPAREL, SHOES" }
      - { name: brand, type: string, source: input, description: "Brand/maker" }
      - { name: title, type: string, source: input, description: "Item title" }
      - { name: declared_value_cents, type: integer, source: input, description: "Seller-declared value; used for pickup insurance cap check" }
      - { name: intake_channel, type: enum, source: input, description: "DROP_OFF (auto-RECEIVED on create) | PICKUP (RECEIVED only when its PickupAppointment completes)", constraints: "DROP_OFF, PICKUP" }
      - { name: status, type: enum, source: system, description: "INTAKE_REQUESTED | RECEIVED | AUTHENTICATED | REJECTED | LISTED | SOLD | DISPOSED", constraints: "INTAKE_REQUESTED, RECEIVED, AUTHENTICATED, REJECTED, LISTED, SOLD, DISPOSED" }
      - { name: authenticity_verdict, type: enum, source: system, default: null, description: "Set by authenticate action; AUTHENTIC | COUNTERFEIT | INCONCLUSIVE", constraints: "AUTHENTIC, COUNTERFEIT, INCONCLUSIVE" }
      - { name: condition_grade, type: enum, source: system, default: null, description: "Grade assigned by authenticate action; A | B | C | D", constraints: "A, B, C, D" }
      - { name: authenticator_id, type: string, source: system, default: null, description: "X-User-ID of the Authenticator who graded (opaque operator id)" }
      - { name: authenticated_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when authenticate ran" }
      - { name: listable, type: boolean, source: computed, default: false, description: "True when authenticity_verdict==AUTHENTIC AND rank(condition_grade) >= rank(policy.listable_min_condition_grade)" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: item_id, type: string, source: input, description: "FK -> ConsignmentItem.id; the authenticated item being listed (1:1)" }
      - { name: seller_id, type: string, source: system, description: "Denormalized copy of ConsignmentItem.seller_id (owning seller); see ConsignmentItem.seller_id" }
      - { name: category, type: enum, source: system, description: "Denormalized copy of ConsignmentItem.category", constraints: "HANDBAGS, WATCHES, JEWELRY, APPAREL, SHOES" }
      - { name: list_price_cents, type: integer, source: input, description: "Seller's asking price" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SOLD", constraints: "DRAFT, ACTIVE, SOLD" }
      - { name: commission_tier_locked, type: enum, source: computed, default: null, description: "Seller.tier captured at publish; locks the commission rate for any sale of this listing", constraints: "STANDARD, PREMIER, ELITE" }
      - { name: commission_rate_locked_pct, type: number, source: computed, default: null, description: "max(policy.base_commission_pct - tier_discount(commission_tier_locked), MIN_COMMISSION_PCT); pinned at publish" }
      - { name: provisional_payout_cents, type: integer, source: computed, default: null, description: "Estimate at publish: list_price_cents - round_half_up(list_price_cents * commission_rate_locked_pct)" }
      - { name: min_offer_cents, type: integer, source: computed, default: null, description: "round_half_up(list_price_cents * policy.min_offer_pct); pinned at publish" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; the listing being negotiated" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the offering buyer" }
      - { name: amount_cents, type: integer, source: input, description: "Buyer's current offer amount" }
      - { name: status, type: enum, source: system, description: "PENDING | COUNTERED | ACCEPTED | DECLINED | EXPIRED", constraints: "PENDING, COUNTERED, ACCEPTED, DECLINED, EXPIRED" }
      - { name: counter_amount_cents, type: integer, source: system, default: null, description: "Seller's counter amount when status==COUNTERED" }
      - { name: round_number, type: integer, source: system, default: 1, description: "Negotiation round; increments each time the offer cycles PENDING<->COUNTERED" }
      - { name: agreed_price_cents, type: integer, source: computed, default: null, description: "Set at accept: amount_cents if accepted from PENDING, counter_amount_cents if accepted from COUNTERED" }
      - { name: expires_at, type: datetime, source: system, description: "Logical-clock instant after which the offer is EXPIRED (created_at + OFFER_TTL_HOURS)" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; the sold listing" }
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id; direct buy uses X-User-ID, offer-accept uses Offer.buyer_id" }
      - { name: seller_id, type: string, source: system, description: "Denormalized copy of Listing.seller_id" }
      - { name: offer_id, type: string, source: system, default: null, description: "Originating Offer.id when sale_channel==OFFER; null for DIRECT" }
      - { name: sale_channel, type: enum, source: system, description: "DIRECT (list_price) | OFFER (agreed_price)", constraints: "DIRECT, OFFER" }
      - { name: sale_price_cents, type: integer, source: computed, description: "list_price_cents for DIRECT; Offer.agreed_price_cents for OFFER" }
      - { name: commission_rate_pct, type: number, source: computed, description: "Copied from Listing.commission_rate_locked_pct at sale creation" }
      - { name: commission_cents, type: integer, source: computed, description: "round_half_up(sale_price_cents * commission_rate_pct)" }
      - { name: seller_net_payout_cents, type: integer, source: computed, description: "sale_price_cents - commission_cents (final payout basis)" }
      - { name: buyer_fee_cents, type: integer, source: computed, description: "policy.buyer_fee_flat_cents + round_half_up(sale_price_cents * policy.buyer_fee_pct)" }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up((sale_price_cents + buyer_fee_cents) * SALES_TAX_PCT); computed AFTER buyer_fee is rounded" }
      - { name: order_total_cents, type: integer, source: computed, description: "sale_price_cents + buyer_fee_cents + tax_cents" }
      - { name: payment_status, type: enum, source: system, description: "PENDING | CAPTURED | REFUNDED (independent axis)", constraints: "PENDING, CAPTURED, REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "AWAITING_SHIPMENT | SHIPPED | DELIVERED | RETURNED (independent axis)", constraints: "AWAITING_SHIPMENT, SHIPPED, DELIVERED, RETURNED" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Logical-clock instant at confirm-delivery" }
      - { name: return_window_ends_at, type: datetime, source: computed, default: null, description: "delivered_at + policy.return_window_days (inclusive dispute boundary); set at delivery" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: sale_id, type: string, source: system, description: "FK -> Sale.id; the settling sale (1:1, cascade-created at delivery)" }
      - { name: seller_id, type: string, source: system, description: "Denormalized copy of Sale.seller_id" }
      - { name: amount_cents, type: integer, source: computed, description: "Sale.seller_net_payout_cents captured at payout creation" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | RELEASED | REVERSED", constraints: "SCHEDULED, HELD, RELEASED, REVERSED" }
      - { name: scheduled_release_at, type: datetime, source: computed, description: "Sale.return_window_ends_at + PAYOUT_HOLD_DAYS" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Logical-clock instant at release" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id; the disputed sale" }
      - { name: buyer_id, type: string, source: system, description: "Denormalized copy of Sale.buyer_id" }
      - { name: type, type: enum, source: input, description: "AUTHENTICITY | CONDITION | CHANGE_OF_MIND (drives the refund variant)", constraints: "AUTHENTICITY, CONDITION, CHANGE_OF_MIND" }
      - { name: reason, type: string, source: input, description: "Free-text dispute reason" }
      - { name: status, type: enum, source: system, description: "FILED | RESOLVED_BUYER | RESOLVED_SELLER", constraints: "FILED, RESOLVED_BUYER, RESOLVED_SELLER" }
      - { name: outcome, type: enum, source: system, default: null, description: "BUYER | SELLER; set at resolve", constraints: "BUYER, SELLER" }
      - { name: refund_amount_cents, type: integer, source: computed, default: null, description: "Set at resolve BUYER; full order_total for AUTHENTICITY/CONDITION, price+tax-restocking for CHANGE_OF_MIND" }
      - { name: restocking_fee_cents, type: integer, source: computed, default: null, description: "round_half_up(Sale.sale_price_cents * RESTOCKING_PCT) for CHANGE_OF_MIND; 0 otherwise" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical-clock instant at resolve" }

  - name: Concierge
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: name, type: string, source: input, description: "Concierge agent name" }
      - { name: region, type: string, source: input, description: "Service region" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Concierge status; only ACTIVE is produced (system-initialized on create)", constraints: "ACTIVE" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: plate, type: string, source: input, description: "Vehicle plate / identifier" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Vehicle status; only ACTIVE is produced (system-initialized on create)", constraints: "ACTIVE" }

  - name: PickupAppointment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: item_id, type: string, source: input, description: "FK -> ConsignmentItem.id; item to collect (intake_channel must be PICKUP)" }
      - { name: concierge_id, type: string, source: input, description: "FK -> Concierge.id; the assigned white-glove agent" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; the assigned vehicle" }
      - { name: seller_id, type: string, source: system, description: "Denormalized copy of ConsignmentItem.seller_id" }
      - { name: window_start, type: datetime, source: input, description: "Half-open occupation window start [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Half-open occupation window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED", constraints: "SCHEDULED, COMPLETED" }
      - { name: declared_value_cents, type: integer, source: system, description: "Denormalized copy of ConsignmentItem.declared_value_cents (insurance check basis)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ConsignmentItem
    field: status
    initial_state: INTAKE_REQUESTED
    terminal_states: [REJECTED, DISPOSED]
    transitions:
      - from: INTAKE_REQUESTED
        to: RECEIVED
        trigger: "automatic on POST /consignment/items when intake_channel==DROP_OFF; else POST /consignment/pickups/{pickupId}/complete"
        actor: "system | ConciergeAgent"
        preconditions: ["intake_channel==DROP_OFF at create, OR the item's PickupAppointment transitions SCHEDULED->COMPLETED"]
        side_effects: []
      - from: RECEIVED
        to: AUTHENTICATED
        trigger: "POST /consignment/items/{itemId}/authenticate"
        actor: Authenticator
        preconditions: ["verdict==AUTHENTIC (grade is recorded but the listable-grade gate is enforced later, at publish)"]
        side_effects: ["Set authenticity_verdict, condition_grade, authenticator_id, authenticated_at", "recompute listable (may be false if grade below policy min — still AUTHENTICATED, just not publishable)"]
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /consignment/items/{itemId}/authenticate"
        actor: Authenticator
        preconditions: ["verdict==COUNTERFEIT OR verdict==INCONCLUSIVE"]
        side_effects: ["Set authenticity_verdict, condition_grade; item is returned to seller (terminal)"]
        note: "REJECTED is terminal — a counterfeit/inconclusive item cannot be listed. A low condition grade does NOT reject here; it blocks at publish (ERR_ITEM_GRADE_NOT_LISTABLE)."
      - from: AUTHENTICATED
        to: LISTED
        trigger: "cascade from Listing DRAFT->ACTIVE (publish)"
        actor: system
        preconditions: ["a Listing referencing this item transitions to ACTIVE"]
        side_effects: []
      - from: LISTED
        to: SOLD
        trigger: "cascade from Listing ACTIVE->SOLD (sale created)"
        actor: system
        preconditions: ["parent Listing transitions ACTIVE->SOLD"]
        side_effects: []
      - from: SOLD
        to: LISTED
        trigger: "cascade from Sale (CHANGE_OF_MIND dispute resolved BUYER -> relist)"
        actor: system
        preconditions: ["a Dispute of type==CHANGE_OF_MIND on this item's Sale is resolved outcome==BUYER"]
        side_effects: ["parent Listing returns SOLD->ACTIVE"]
        note: "Relist cycle; distinguishes change-of-mind returns from authenticity failures."
      - from: SOLD
        to: DISPOSED
        trigger: "cascade from Sale (AUTHENTICITY/CONDITION dispute resolved BUYER)"
        actor: system
        preconditions: ["a Dispute of type in {AUTHENTICITY, CONDITION} on this item's Sale is resolved outcome==BUYER"]
        side_effects: ["item quarantined; not relisted (terminal)"]

  - entity: Listing
    field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /consignment/listings/{listingId}/publish"
        actor: "Seller | OpsAdmin"
        preconditions:
          - "referenced ConsignmentItem.status == AUTHENTICATED (cross-entity)"
          - "ConsignmentItem.listable == true"
        side_effects:
          - "commission_tier_locked = Seller.tier (current)"
          - "commission_rate_locked_pct = max(policy.base_commission_pct - tier_discount(Seller.tier), MIN_COMMISSION_PCT)"
          - "provisional_payout_cents computed (calc provisional_seller_payout)"
          - "min_offer_cents = round_half_up(list_price_cents * policy.min_offer_pct)"
          - "ConsignmentItem AUTHENTICATED -> LISTED"
          - "increments Listing.version by 1"
      - from: ACTIVE
        to: SOLD
        trigger: "POST /consignment/sales (direct) or POST /consignment/offers/{offerId}/accept (cascade)"
        actor: "system"
        preconditions: ["Listing.status == ACTIVE"]
        side_effects:
          - "create Sale (calc final_seller_payout, buyer_order_total run)"
          - "ConsignmentItem LISTED -> SOLD"
          - "all sibling Offers on this listing in {PENDING, COUNTERED} -> DECLINED"
          - "increments Listing.version by 1"
      - from: SOLD
        to: ACTIVE
        trigger: "cascade from CHANGE_OF_MIND dispute resolved BUYER (relist)"
        actor: system
        preconditions: ["Sale.fulfillment_status -> RETURNED via CHANGE_OF_MIND buyer-favor resolution"]
        side_effects: ["ConsignmentItem SOLD -> LISTED", "increments Listing.version by 1"]

  - entity: Offer
    field: status
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: PENDING
        to: COUNTERED
        trigger: "POST /consignment/offers/{offerId}/counter (seller counters buyer)"
        actor: Seller
        preconditions: ["Offer.status == PENDING", "Listing.status == ACTIVE"]
        side_effects: ["set counter_amount_cents to the seller's counter"]
      - from: COUNTERED
        to: PENDING
        trigger: "POST /consignment/offers/{offerId}/counter (buyer counters back)"
        actor: Buyer
        preconditions: ["Offer.status == COUNTERED", "Listing.status == ACTIVE"]
        side_effects: ["set amount_cents to the buyer's new amount", "clear counter_amount_cents", "round_number += 1"]
        note: "Cyclic negotiation: PENDING<->COUNTERED can repeat across rounds."
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /consignment/offers/{offerId}/accept (seller accepts buyer's amount)"
        actor: Seller
        preconditions: ["Offer.status == PENDING", "Listing.status == ACTIVE (cross-entity)"]
        side_effects: ["agreed_price_cents = amount_cents", "cascade: Listing ACTIVE->SOLD -> creates Sale (sale_channel=OFFER, sale_price=agreed_price_cents)"]
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /consignment/offers/{offerId}/accept (buyer accepts seller's counter)"
        actor: Buyer
        preconditions: ["Offer.status == COUNTERED", "Listing.status == ACTIVE (cross-entity)"]
        side_effects: ["agreed_price_cents = counter_amount_cents", "cascade: Listing ACTIVE->SOLD -> creates Sale (sale_channel=OFFER)"]
      - from: [PENDING, COUNTERED]
        to: DECLINED
        trigger: "POST /consignment/offers/{offerId}/decline OR system (sibling of an accepted offer / listing sold)"
        actor: "Seller | Buyer | system"
        preconditions: ["Offer.status in {PENDING, COUNTERED}"]
        side_effects: []
      - from: [PENDING, COUNTERED]
        to: EXPIRED
        trigger: "system (logical clock passes expires_at, evaluated lazily on read/accept/counter)"
        actor: system
        preconditions: ["current_clock > expires_at"]
        side_effects: []

  - entity: Sale
    field: payment_status
    initial_state: PENDING
    terminal_states: [REFUNDED]
    transitions:
      - from: PENDING
        to: CAPTURED
        trigger: "POST /consignment/sales/{saleId}/capture-payment"
        actor: "Buyer | OpsAdmin"
        preconditions: ["payment_status == PENDING"]
        side_effects: []
      - from: CAPTURED
        to: REFUNDED
        trigger: "cascade from Dispute resolved BUYER"
        actor: system
        preconditions: ["a Dispute on this sale is resolved outcome==BUYER"]
        side_effects: ["refund_amount_cents credited to buyer (calc buyer_refund)"]

  - entity: Sale
    field: fulfillment_status
    initial_state: AWAITING_SHIPMENT
    terminal_states: [RETURNED]
    transitions:
      - from: AWAITING_SHIPMENT
        to: SHIPPED
        trigger: "POST /consignment/sales/{saleId}/ship"
        actor: "Seller | OpsAdmin"
        preconditions: ["payment_status == CAPTURED (cross-axis)", "fulfillment_status == AWAITING_SHIPMENT"]
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /consignment/sales/{saleId}/confirm-delivery"
        actor: "Buyer | OpsAdmin"
        preconditions: ["fulfillment_status == SHIPPED"]
        side_effects:
          - "set delivered_at = current_clock"
          - "return_window_ends_at = delivered_at + policy.return_window_days"
          - "create Payout (status SCHEDULED, amount_cents = seller_net_payout_cents, scheduled_release_at = return_window_ends_at + PAYOUT_HOLD_DAYS)"
          - "Seller.pending_payout_cents += seller_net_payout_cents"
          - "Buyer.lifetime_purchases_cents += order_total_cents"
      - from: DELIVERED
        to: RETURNED
        trigger: "cascade from Dispute resolved BUYER"
        actor: system
        preconditions: ["a Dispute on this sale is resolved outcome==BUYER"]
        side_effects:
          - "Buyer.lifetime_purchases_cents -= order_total_cents (exact reversal)"
          - "Payout SCHEDULED/HELD -> REVERSED; Seller.pending_payout_cents -= amount_cents"

  - entity: Payout
    field: status
    initial_state: SCHEDULED
    terminal_states: [RELEASED, REVERSED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "cascade from POST /consignment/disputes (open dispute filed on the sale)"
        actor: system
        preconditions: ["a Dispute with status FILED exists for the payout's sale"]
        side_effects: []
      - from: HELD
        to: SCHEDULED
        trigger: "cascade from Dispute resolved SELLER"
        actor: system
        preconditions: ["the sale's open Dispute is resolved outcome==SELLER"]
        side_effects: []
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /consignment/payouts/{payoutId}/release"
        actor: OpsAdmin
        preconditions:
          - "Payout.status == SCHEDULED (a FILED dispute has already moved it to HELD -> ERR_PAYOUT_NOT_RELEASABLE)"
          - "current_clock >= scheduled_release_at (business_temporal)"
        side_effects:
          - "set released_at = current_clock"
          - "Seller.pending_payout_cents -= amount_cents"
          - "Seller.released_payout_cents += amount_cents"
          - "Seller.lifetime_net_sales_cents += amount_cents"
          - "recompute Seller.tier from lifetime_net_sales_cents (calc seller_tier)"
      - from: [SCHEDULED, HELD]
        to: REVERSED
        trigger: "cascade from Sale DELIVERED->RETURNED (Dispute resolved BUYER)"
        actor: system
        preconditions: ["the sale's Dispute is resolved outcome==BUYER"]
        side_effects:
          - "Seller.pending_payout_cents -= amount_cents"
          - "Seller.reversed_payout_cents += amount_cents"

  - entity: Dispute
    field: status
    initial_state: FILED
    terminal_states: [RESOLVED_BUYER, RESOLVED_SELLER]
    transitions:
      - from: FILED
        to: RESOLVED_BUYER
        trigger: "POST /consignment/disputes/{disputeId}/resolve (outcome=BUYER)"
        actor: OpsAdmin
        preconditions: ["Dispute.status == FILED"]
        side_effects:
          - "compute refund_amount_cents + restocking_fee_cents (calc buyer_refund, variant by type)"
          - "Sale.payment_status CAPTURED -> REFUNDED"
          - "Sale.fulfillment_status DELIVERED -> RETURNED (cascade chain to Payout + Seller + Buyer + Item)"
          - "AUTHENTICITY/CONDITION: ConsignmentItem SOLD -> DISPOSED; CHANGE_OF_MIND: ConsignmentItem SOLD -> LISTED and Listing SOLD -> ACTIVE"
      - from: FILED
        to: RESOLVED_SELLER
        trigger: "POST /consignment/disputes/{disputeId}/resolve (outcome=SELLER)"
        actor: OpsAdmin
        preconditions: ["Dispute.status == FILED"]
        side_effects:
          - "refund_amount_cents = 0"
          - "Payout HELD -> SCHEDULED (hold cleared; sale unchanged)"

  - entity: PickupAppointment
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /consignment/pickups/{pickupId}/complete"
        actor: "ConciergeAgent | OpsAdmin"
        preconditions: ["PickupAppointment.status == SCHEDULED"]
        side_effects: ["ConsignmentItem INTAKE_REQUESTED -> RECEIVED"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC — the only sanctioned write-write mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /consignment/offers"
    occ_field: "expected_listing_version"
    description: |
      Creating an Offer against a Listing whose version has advanced since the
      buyer last observed it is rejected. A buyer holds at most one live offer
      per listing; a fresh offer legitimately supersedes the buyer's prior view.
      When the listing's version has moved on (another offer was created, the
      seller published/relisted, or the listing was marked SOLD), the buyer's
      observed version is stale and the create is refused so it cannot post
      against a listing state that no longer exists.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
# Global constants (referenced by name across formulas):
#   PREMIER_THRESHOLD_CENTS = 1000000   # $10,000 lifetime net sales
#   ELITE_THRESHOLD_CENTS   = 5000000   # $50,000 lifetime net sales
#   PREMIER_DISCOUNT_PCT    = 0.03
#   ELITE_DISCOUNT_PCT      = 0.05
#   MIN_COMMISSION_PCT      = 0.05
#   SALES_TAX_PCT           = 0.08
#   RESTOCKING_PCT          = 0.10
#   PAYOUT_HOLD_DAYS        = 1
#   OFFER_TTL_HOURS         = 72
#   TRAVEL_BUFFER_MINUTES   = 60
# Rounding: round_half_up to whole cents everywhere unless stated.
calculations:
  - name: seller_tier
    trigger: "recomputed on Payout release (Seller.lifetime_net_sales_cents changes)"
    algorithm: threshold
    formula: |
      L = Seller.lifetime_net_sales_cents
      if   L >= ELITE_THRESHOLD_CENTS:   tier = ELITE
      elif L >= PREMIER_THRESHOLD_CENTS: tier = PREMIER
      else:                              tier = STANDARD
      # Boundaries are INCLUSIVE (>=): L == PREMIER_THRESHOLD_CENTS is PREMIER,
      # L == PREMIER_THRESHOLD_CENTS - 1 stays STANDARD.
    input_set: "single Seller row; lifetime_net_sales_cents only accumulates RELEASED payouts"
    constants: { PREMIER_THRESHOLD_CENTS: 1000000, ELITE_THRESHOLD_CENTS: 5000000 }
    precision: "integer cents; >= comparisons"

  - name: commission_rate_locked
    trigger: "Listing publish (DRAFT->ACTIVE); value frozen onto Listing.commission_rate_locked_pct"
    algorithm: tiered_pricing
    formula: |
      tier_discount = { STANDARD: 0.0, PREMIER: PREMIER_DISCOUNT_PCT, ELITE: ELITE_DISCOUNT_PCT }[Seller.tier]
      commission_rate_locked_pct = max(policy.base_commission_pct - tier_discount, MIN_COMMISSION_PCT)
      # Non-linear: tier-selected discount branch, then a max() floor at MIN_COMMISSION_PCT.
      # Locked at publish: a later tier change does NOT alter an already-published listing's rate.
    input_set: "the Listing's CategoryPolicy (by category) and the Seller.tier AT publish time"
    constants: { PREMIER_DISCOUNT_PCT: 0.03, ELITE_DISCOUNT_PCT: 0.05, MIN_COMMISSION_PCT: 0.05 }
    precision: "fraction; downstream money rounds round_half_up"

  - name: seller_payout
    trigger: "provisional variant at Listing publish; final variant at Sale creation"
    algorithm: forward_looking
    formula: |
      net(price, rate) = price - round_half_up(price * rate)
    input_set: "one Listing (provisional) or one Sale (final)"
    precision: "round_half_up to whole cents"
    variants:
      - name: provisional_seller_payout
        when: "Listing publish; uses list_price_cents and commission_rate_locked_pct"
        difference: "provisional_payout_cents = net(list_price_cents, commission_rate_locked_pct); an ESTIMATE on the asking price"
      - name: final_seller_payout
        when: "Sale creation (direct buy or accepted offer)"
        difference: "seller_net_payout_cents = net(sale_price_cents, commission_rate_pct); uses the ACTUAL sale_price (may be a lower accepted-offer amount) so it diverges from provisional whenever sale_price != list_price"

  - name: buyer_order_total
    trigger: "Sale creation"
    algorithm: aggregation
    formula: |
      # PINNED rounding order — round each component before the next consumes it:
      buyer_fee_cents = policy.buyer_fee_flat_cents + round_half_up(sale_price_cents * policy.buyer_fee_pct)
      tax_cents       = round_half_up((sale_price_cents + buyer_fee_cents) * SALES_TAX_PCT)   # tax on price+ROUNDED fee
      order_total_cents = sale_price_cents + buyer_fee_cents + tax_cents
      # Order matters: taxing (price + rounded fee) differs from taxing price-only or
      # from summing raw components then rounding once. This scaffold pins the above order.
    input_set: "one Sale + its CategoryPolicy"
    constants: { SALES_TAX_PCT: 0.08 }
    precision: "round_half_up to whole cents, applied component-by-component in the order shown"

  - name: buyer_refund
    trigger: "Dispute resolve outcome==BUYER"
    algorithm: forward_looking
    formula: |
      # variant selected by Dispute.type
    input_set: "one Dispute + its Sale + the Sale's CategoryPolicy"
    precision: "round_half_up to whole cents"
    variants:
      - name: authenticity_full_refund
        when: "Dispute.type in {AUTHENTICITY, CONDITION}"
        difference: "restocking_fee_cents = 0; refund_amount_cents = Sale.order_total_cents (price + buyer_fee + tax ALL refunded); item -> DISPOSED"
      - name: change_of_mind_restocking_refund
        when: "Dispute.type == CHANGE_OF_MIND"
        difference: "restocking_fee_cents = round_half_up(Sale.sale_price_cents * RESTOCKING_PCT); refund_amount_cents = Sale.sale_price_cents + Sale.tax_cents - restocking_fee_cents (buyer_fee_cents is NON-refundable); item relisted"
    constants: { RESTOCKING_PCT: 0.10 }

  - name: seller_payout_ledger_invariant
    trigger: "invariant checked after every Payout status change (release, hold, reverse, delivery)"
    algorithm: aggregation
    formula: |
      Seller.pending_payout_cents  == SUM(Payout.amount_cents WHERE Payout.seller_id==S AND status IN {SCHEDULED, HELD})
      Seller.released_payout_cents == SUM(Payout.amount_cents WHERE Payout.seller_id==S AND status == RELEASED)
      Seller.reversed_payout_cents == SUM(Payout.amount_cents WHERE Payout.seller_id==S AND status == REVERSED)
      # Conserved quantity Q_payout = pending + released + reversed == SUM(all this seller's Payout.amount_cents).
      # A REVERSED payout moves its amount out of pending and into reversed, leaving Q_payout unchanged.
    input_set: "all Payout rows for one Seller"
    precision: "integer cents; exact equality"

  - name: buyer_purchase_ledger_invariant
    trigger: "invariant checked after delivery (+order_total) and after buyer-favor return (-order_total)"
    algorithm: aggregation
    formula: |
      Buyer.lifetime_purchases_cents == SUM(Sale.order_total_cents
        WHERE Sale.buyer_id==B AND fulfillment_status==DELIVERED AND fulfillment_status!=RETURNED)
      # Conserved quantity Q_purchase: delivery adds order_total_cents; a RETURNED sale
      # subtracts the SAME order_total_cents, so a delivered-then-returned sale nets to zero.
    input_set: "all Sale rows for one Buyer"
    precision: "integer cents; exact equality"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every id in the path (and required FK body ids) resolves to an existing resource, validated left-to-right"
    error_id: "ERR_SELLER_NOT_FOUND / ERR_BUYER_NOT_FOUND / ERR_CATEGORY_POLICY_NOT_FOUND / ERR_ITEM_NOT_FOUND / ERR_LISTING_NOT_FOUND / ERR_OFFER_NOT_FOUND / ERR_SALE_NOT_FOUND / ERR_PAYOUT_NOT_FOUND / ERR_DISPUTE_NOT_FOUND / ERR_CONCIERGE_NOT_FOUND / ERR_VEHICLE_NOT_FOUND / ERR_PICKUP_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path/body ids
  - priority: 4
    category: business_referential
    check: "Acting entity_backed principal owns the target: Seller owns the ConsignmentItem/Listing (seller_id == X-User-ID); Buyer owns the Sale/Offer (buyer_id == X-User-ID)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "item authenticate is exempt (Authenticator); seller-only and buyer-only mutations"
  - priority: 5
    category: state
    check: "Target resource is in a state that admits this transition (single-axis or cross-axis precondition)"
    error_id: "ERR_ITEM_INVALID_STATE / ERR_LISTING_INVALID_STATE / ERR_OFFER_INVALID_STATE / ERR_SALE_PAYMENT_INVALID_STATE / ERR_SALE_FULFILLMENT_INVALID_STATE / ERR_SALE_NOT_DISPUTABLE / ERR_DISPUTE_INVALID_STATE / ERR_PAYOUT_NOT_RELEASABLE / ERR_PICKUP_INVALID_STATE"
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 6
    category: state
    check: "OCC: expected_listing_version must equal current Listing.version (stale => reject)"
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
    applies_to: "POST /consignment/offers"
  - priority: 7
    category: business_referential
    check: "Cross-entity precondition on a DIFFERENT entity: Listing.publish requires its ConsignmentItem.status==AUTHENTICATED; Offer.accept and Sale creation (direct buy) require the Listing.status==ACTIVE"
    error_id: "ERR_ITEM_NOT_AUTHENTICATED / ERR_LISTING_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST .../listings/{id}/publish, POST .../offers/{id}/accept, POST /consignment/sales"
  - priority: 8
    category: business_safety
    check: "Publish requires the item to be listable: rank(condition_grade) >= rank(policy.listable_min_condition_grade) AND verdict==AUTHENTIC"
    error_id: ERR_ITEM_GRADE_NOT_LISTABLE
    http_status: 422
    applies_to: "POST .../listings/{id}/publish"
  - priority: 9
    category: business_constraint
    check: "At most one open (FILED) Dispute per Sale"
    error_id: ERR_DISPUTE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /consignment/disputes"
  - priority: 10
    category: business_fiscal
    check: "Offer amount_cents (or counter target) >= Listing.min_offer_cents"
    error_id: ERR_OFFER_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /consignment/offers, POST .../offers/{id}/counter"
  - priority: 11
    category: business_fiscal
    check: "Pickup item.declared_value_cents <= its CategoryPolicy.pickup_insurance_cap_cents"
    error_id: ERR_PICKUP_VALUE_EXCEEDS_INSURANCE
    http_status: 422
    applies_to: "POST /consignment/pickups"
  - priority: 12
    category: business_temporal
    check: "Dispute filed only within the return window: current_clock <= Sale.return_window_ends_at (inclusive)"
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /consignment/disputes"
  - priority: 13
    category: business_temporal
    check: "Payout release requires current_clock >= scheduled_release_at (a FILED dispute has already moved the payout to HELD, which the priority-5 state check rejects with ERR_PAYOUT_NOT_RELEASABLE)"
    error_id: "ERR_PAYOUT_HOLD_ACTIVE"
    http_status: 409
    applies_to: "POST .../payouts/{id}/release"
  - priority: 14
    category: business_temporal
    check: "Concierge free on [window_start, window_end) padded by TRAVEL_BUFFER_MINUTES on both ends against that concierge's other SCHEDULED appointments"
    error_id: ERR_CONCIERGE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /consignment/pickups"
  - priority: 15
    category: business_temporal
    check: "Vehicle free on the strict half-open [window_start, window_end) against that vehicle's other SCHEDULED appointments (adjacency at the exact boundary allowed; NO buffer)"
    error_id: ERR_VEHICLE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /consignment/pickups"

# =============================================================================
# §1.5 API Endpoint Table (37 endpoints; primary id placeholder is {id} everywhere)
# =============================================================================
endpoints:
  # --- Sellers ---
  - { method: POST, path: "/consignment/sellers", description: "Register a consignor", roles: [OpsAdmin], code: 201, input: [display_name, email], output: Seller, side_effects: ["status=ACTIVE, tier=STANDARD, all ledgers 0"] }
  - { method: GET, path: "/consignment/sellers/{id}", description: "Get a seller (tier, ledgers)", roles: [OpsAdmin, Seller], code: 200, input: [], output: Seller, side_effects: [] }
  # --- Buyers ---
  - { method: POST, path: "/consignment/buyers", description: "Register a buyer", roles: [OpsAdmin], code: 201, input: [display_name, email], output: Buyer, side_effects: ["status=ACTIVE, lifetime_purchases_cents=0"] }
  - { method: GET, path: "/consignment/buyers/{id}", description: "Get a buyer (lifetime purchases)", roles: [OpsAdmin, Buyer], code: 200, input: [], output: Buyer, side_effects: [] }
  # --- Category policies (config) ---
  - { method: POST, path: "/consignment/category-policies", description: "Create a per-category pricing/return policy", roles: [OpsAdmin], code: 201, input: [category, base_commission_pct, buyer_fee_pct, buyer_fee_flat_cents, return_window_days, min_offer_pct, listable_min_condition_grade, pickup_insurance_cap_cents], output: CategoryPolicy, side_effects: ["category is unique"] }
  - { method: GET, path: "/consignment/category-policies/{id}", description: "Get a category policy", roles: [OpsAdmin, Seller, Buyer, Authenticator], code: 200, input: [], output: CategoryPolicy, side_effects: [] }
  # --- Consignment items (intake) ---
  - { method: POST, path: "/consignment/items", description: "Create a consignment intake", roles: [Seller, OpsAdmin], code: 201, input: [seller_id, category, brand, title, declared_value_cents, intake_channel], output: ConsignmentItem, side_effects: ["DROP_OFF -> status RECEIVED immediately; PICKUP -> status INTAKE_REQUESTED"] }
  - { method: GET, path: "/consignment/items", description: "List items (filtered)", roles: [OpsAdmin, Seller], code: 200, input: ["seller_id?", "category?", "status?", "limit?", "offset?"], output: "ConsignmentItem[]", side_effects: [] }
  - { method: GET, path: "/consignment/items/{id}", description: "Get an item", roles: [OpsAdmin, Seller, Authenticator], code: 200, input: [], output: ConsignmentItem, side_effects: [] }
  - { method: POST, path: "/consignment/items/{id}/authenticate", description: "Authenticate & grade a RECEIVED item", roles: [Authenticator], code: 200, input: [verdict, condition_grade, "notes?"], output: ConsignmentItem, side_effects: ["set authenticity_verdict, condition_grade, authenticator_id, authenticated_at", "status -> AUTHENTICATED when verdict==AUTHENTIC (any grade) or REJECTED when verdict in {COUNTERFEIT, INCONCLUSIVE}", "recompute listable"] }
  # --- Listings ---
  - { method: POST, path: "/consignment/listings", description: "Create a DRAFT listing from an item", roles: [Seller, OpsAdmin], code: 201, input: [item_id, list_price_cents], output: Listing, side_effects: ["status=DRAFT", "seller_id/category denormalized from item"] }
  - { method: GET, path: "/consignment/listings", description: "List listings (filtered)", roles: [OpsAdmin, Seller, Buyer], code: 200, input: ["item_id?", "seller_id?", "status?", "limit?", "offset?"], output: "Listing[]", side_effects: [] }
  - { method: GET, path: "/consignment/listings/{id}", description: "Get a listing", roles: [OpsAdmin, Seller, Buyer, Authenticator], code: 200, input: [], output: Listing, side_effects: [] }
  - { method: POST, path: "/consignment/listings/{id}/publish", description: "Publish a listing (DRAFT->ACTIVE)", roles: [Seller, OpsAdmin], code: 200, input: [], output: Listing, side_effects: ["requires item AUTHENTICATED & listable", "lock commission_tier_locked, commission_rate_locked_pct", "compute provisional_payout_cents, min_offer_cents", "item AUTHENTICATED->LISTED", "increments Listing.version by 1"] }
  # --- Offers (cyclic negotiation) ---
  - { method: POST, path: "/consignment/offers", description: "Make an offer on an ACTIVE listing (OCC-guarded)", roles: [Buyer], code: 201, input: [listing_id, buyer_id, amount_cents, expected_listing_version], output: Offer, side_effects: ["status=PENDING, round_number=1, expires_at=created_at+OFFER_TTL_HOURS", "increments Listing.version by 1"] }
  - { method: GET, path: "/consignment/offers", description: "List offers (filtered)", roles: [OpsAdmin, Seller, Buyer], code: 200, input: ["listing_id?", "buyer_id?", "status?", "limit?", "offset?"], output: "Offer[]", side_effects: [] }
  - { method: GET, path: "/consignment/offers/{id}", description: "Get an offer", roles: [OpsAdmin, Seller, Buyer], code: 200, input: [], output: Offer, side_effects: [] }
  - { method: POST, path: "/consignment/offers/{id}/counter", description: "Counter an offer (seller PENDING->COUNTERED or buyer COUNTERED->PENDING)", roles: [Seller, Buyer], code: 200, input: [counter_amount_cents], output: Offer, side_effects: ["seller counter sets counter_amount_cents; buyer counter-back sets amount_cents, round_number+=1"] }
  - { method: POST, path: "/consignment/offers/{id}/accept", description: "Accept an offer/counter -> creates a Sale", roles: [Seller, Buyer], code: 200, input: [], output: Offer, side_effects: ["agreed_price_cents set", "Listing ACTIVE->SOLD (cascade): create Sale, item LISTED->SOLD, sibling offers DECLINED"] }
  # --- Sales (parallel payment x fulfillment) ---
  - { method: POST, path: "/consignment/sales", description: "Direct-buy an ACTIVE listing at list price", roles: [Buyer, OpsAdmin], code: 201, input: [listing_id, buyer_id], output: Sale, side_effects: ["sale_channel=DIRECT, sale_price=list_price", "payment PENDING, fulfillment AWAITING_SHIPMENT", "run final_seller_payout + buyer_order_total", "Listing ACTIVE->SOLD, item LISTED->SOLD, sibling offers DECLINED"] }
  - { method: GET, path: "/consignment/sales", description: "List sales (filtered)", roles: [OpsAdmin, Seller, Buyer], code: 200, input: ["listing_id?", "buyer_id?", "seller_id?", "status?", "limit?", "offset?"], output: "Sale[]", side_effects: [] }
  - { method: GET, path: "/consignment/sales/{id}", description: "Get a sale", roles: [OpsAdmin, Seller, Buyer], code: 200, input: [], output: Sale, side_effects: [] }
  - { method: POST, path: "/consignment/sales/{id}/capture-payment", description: "Capture payment (PENDING->CAPTURED)", roles: [Buyer, OpsAdmin], code: 200, input: [], output: Sale, side_effects: ["payment_status -> CAPTURED"] }
  - { method: POST, path: "/consignment/sales/{id}/ship", description: "Mark shipped (AWAITING_SHIPMENT->SHIPPED)", roles: [Seller, OpsAdmin], code: 200, input: [], output: Sale, side_effects: ["requires payment CAPTURED", "fulfillment_status -> SHIPPED"] }
  - { method: POST, path: "/consignment/sales/{id}/confirm-delivery", description: "Confirm delivery (SHIPPED->DELIVERED)", roles: [Buyer, OpsAdmin], code: 200, input: [], output: Sale, side_effects: ["set delivered_at, return_window_ends_at", "create Payout SCHEDULED", "Seller.pending_payout_cents += net", "Buyer.lifetime_purchases_cents += order_total_cents"] }
  - { method: GET, path: "/consignment/sales/{id}/payouts", description: "List payouts for a sale (reverse-reachability for Payout.sale_id)", roles: [OpsAdmin, Seller], code: 200, input: [], output: "Payout[]", side_effects: [] }
  - { method: GET, path: "/consignment/sales/{id}/disputes", description: "List disputes for a sale (reverse-reachability for Dispute.sale_id)", roles: [OpsAdmin, Seller, Buyer], code: 200, input: [], output: "Dispute[]", side_effects: [] }
  # --- Payouts ---
  - { method: POST, path: "/consignment/payouts/{id}/release", description: "Release a scheduled payout to the seller", roles: [OpsAdmin], code: 200, input: [], output: Payout, side_effects: ["requires payout SCHEDULED & clock>=scheduled_release_at", "status->RELEASED, set released_at", "Seller pending-=amt, released+=amt, lifetime_net_sales+=amt", "recompute Seller.tier"] }
  # --- Disputes (returns / authenticity) ---
  - { method: POST, path: "/consignment/disputes", description: "File a dispute on a delivered sale (within window)", roles: [Buyer, OpsAdmin], code: 201, input: [sale_id, type, reason], output: Dispute, side_effects: ["status=FILED", "the sale's SCHEDULED Payout -> HELD"] }
  - { method: POST, path: "/consignment/disputes/{id}/resolve", description: "Resolve a FILED dispute", roles: [OpsAdmin], code: 200, input: [outcome], output: Dispute, side_effects: ["BUYER: compute buyer_refund, Sale REFUNDED+RETURNED cascade to Payout/Seller/Buyer/Item", "SELLER: refund 0, Payout HELD->SCHEDULED"] }
  # --- White-glove pickup resources ---
  - { method: POST, path: "/consignment/concierges", description: "Create a white-glove concierge agent", roles: [OpsAdmin], code: 201, input: [name, region], output: Concierge, side_effects: ["status=ACTIVE"] }
  - { method: POST, path: "/consignment/vehicles", description: "Create a pickup vehicle", roles: [OpsAdmin], code: 201, input: [plate], output: Vehicle, side_effects: ["status=ACTIVE"] }
  - { method: POST, path: "/consignment/pickups", description: "Schedule a white-glove pickup (concierge+vehicle overlap checks)", roles: [Seller, OpsAdmin], code: 201, input: [item_id, concierge_id, vehicle_id, window_start, window_end], output: PickupAppointment, side_effects: ["status=SCHEDULED", "seller_id/declared_value_cents denormalized from item", "concierge buffer + vehicle strict-overlap enforced"] }
  - { method: GET, path: "/consignment/pickups", description: "List pickups (filtered; reverse-reachability for concierge_id/vehicle_id/item_id)", roles: [OpsAdmin, Seller], code: 200, input: ["concierge_id?", "vehicle_id?", "item_id?", "seller_id?", "status?", "limit?", "offset?"], output: "PickupAppointment[]", side_effects: [] }
  - { method: GET, path: "/consignment/pickups/{id}", description: "Get a pickup appointment", roles: [OpsAdmin, Seller], code: 200, input: [], output: PickupAppointment, side_effects: [] }
  - { method: POST, path: "/consignment/pickups/{id}/complete", description: "Complete a pickup (SCHEDULED->COMPLETED)", roles: [ConciergeAgent, OpsAdmin], code: 200, input: [], output: PickupAppointment, side_effects: ["ConsignmentItem INTAKE_REQUESTED -> RECEIVED"] }
  # --- Test-driving logical clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default (never real wall-clock).", roles: [OpsAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["all deadline/window/expiry evaluations read this logical clock"] }

# =============================================================================
# §1.6 Error Code Catalog (37 codes)
# =============================================================================
errors:
  # request / auth
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum value, or non-integer cents" }
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 400, condition: "X-User-ID / X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting entity_backed principal is not the owner of the target resource" }
  # not found
  - { id: ERR_SELLER_NOT_FOUND, http: 404, condition: "Seller id does not exist" }
  - { id: ERR_BUYER_NOT_FOUND, http: 404, condition: "Buyer id does not exist" }
  - { id: ERR_CATEGORY_POLICY_NOT_FOUND, http: 404, condition: "No CategoryPolicy for the given category / policy id" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "ConsignmentItem id does not exist" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "Listing id does not exist" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "Offer id does not exist" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "Sale id does not exist" }
  - { id: ERR_PAYOUT_NOT_FOUND, http: 404, condition: "Payout id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Dispute id does not exist" }
  - { id: ERR_CONCIERGE_NOT_FOUND, http: 404, condition: "Concierge id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "Vehicle id does not exist" }
  - { id: ERR_PICKUP_NOT_FOUND, http: 404, condition: "PickupAppointment id does not exist" }
  # state / concurrency
  - { id: ERR_ITEM_INVALID_STATE, http: 409, condition: "Authenticate requires status==RECEIVED; item not in a state admitting the action" }
  - { id: ERR_ITEM_NOT_AUTHENTICATED, http: 409, condition: "Publish requires the referenced item to be AUTHENTICATED" }
  - { id: ERR_LISTING_INVALID_STATE, http: 409, condition: "Publish requires status==DRAFT" }
  - { id: ERR_LISTING_NOT_ACTIVE, http: 409, condition: "Offer/direct-buy/accept requires listing status==ACTIVE" }
  - { id: ERR_OFFER_INVALID_STATE, http: 409, condition: "Counter/accept on an offer not in the required PENDING/COUNTERED state (or EXPIRED)" }
  - { id: ERR_SALE_PAYMENT_INVALID_STATE, http: 409, condition: "capture-payment on a sale whose payment_status != PENDING" }
  - { id: ERR_SALE_FULFILLMENT_INVALID_STATE, http: 409, condition: "ship/confirm-delivery from the wrong fulfillment_status (or ship before payment CAPTURED)" }
  - { id: ERR_SALE_NOT_DISPUTABLE, http: 409, condition: "Dispute requires fulfillment_status==DELIVERED and not already RETURNED" }
  - { id: ERR_DISPUTE_INVALID_STATE, http: 409, condition: "Resolve on a dispute not in status FILED" }
  - { id: ERR_PAYOUT_NOT_RELEASABLE, http: 409, condition: "Release on a payout not in status SCHEDULED (HELD/RELEASED/REVERSED)" }
  - { id: ERR_PICKUP_INVALID_STATE, http: 409, condition: "Complete on a pickup not in status SCHEDULED" }
  - { id: ERR_STALE_LISTING_VERSION, http: 412, condition: "expected_listing_version != current Listing.version on POST /offers (OCC)" }
  # business
  - { id: ERR_ITEM_GRADE_NOT_LISTABLE, http: 422, condition: "Publish blocked: verdict!=AUTHENTIC or condition_grade below policy.listable_min_condition_grade" }
  - { id: ERR_DISPUTE_ALREADY_EXISTS, http: 409, condition: "A FILED dispute already exists for this sale" }
  - { id: ERR_OFFER_BELOW_FLOOR, http: 422, condition: "Offer/counter amount below Listing.min_offer_cents" }
  - { id: ERR_PICKUP_VALUE_EXCEEDS_INSURANCE, http: 422, condition: "Item declared_value_cents exceeds the category's pickup_insurance_cap_cents" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 409, condition: "current_clock > Sale.return_window_ends_at at filing time" }
  - { id: ERR_PAYOUT_HOLD_ACTIVE, http: 409, condition: "Release attempted before current_clock >= scheduled_release_at" }
  - { id: ERR_CONCIERGE_UNAVAILABLE, http: 409, condition: "Concierge busy within TRAVEL_BUFFER_MINUTES of the requested window" }
  - { id: ERR_VEHICLE_UNAVAILABLE, http: 409, condition: "Vehicle window strictly overlaps another SCHEDULED appointment (adjacency allowed)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Platform operations: config, disputes, payout release, clock; operational superset"
    identity: "opaque"
    exclusive_operations:
      - "POST /consignment/sellers, POST /consignment/buyers"
      - "POST /consignment/category-policies"
      - "POST /consignment/payouts/{id}/release"
      - "POST /consignment/disputes/{id}/resolve"
      - "POST /consignment/concierges, POST /consignment/vehicles"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /consignment/items, POST /consignment/listings, POST /consignment/listings/{id}/publish (with Seller)"
      - "POST /consignment/sales, POST .../capture-payment, POST .../confirm-delivery (with Buyer)"
      - "POST /consignment/sales/{id}/ship (with Seller)"
      - "POST /consignment/pickups, POST /consignment/pickups/{id}/complete"
      - "All GET reads"

  - name: Seller
    description: "Consignor: creates intakes/listings, publishes, negotiates offers on own listings, ships, requests pickup"
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /consignment/offers/{id}/counter (seller side, PENDING->COUNTERED)"
    shared_operations:
      - "POST /consignment/items, POST /consignment/listings, POST /consignment/listings/{id}/publish"
      - "POST /consignment/offers/{id}/accept (seller accepts PENDING)"
      - "POST /consignment/sales/{id}/ship"
      - "POST /consignment/pickups"
      - "GET reads of own sellers/{id}, items, listings, offers, sales, payouts, pickups"

  - name: Buyer
    description: "Shopper: browses closets, makes/counters/accepts offers, direct-buys, captures payment, confirms delivery, files disputes"
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /consignment/offers (make offer, OCC)"
      - "POST /consignment/sales (direct buy)"
      - "POST /consignment/disputes (file dispute)"
    shared_operations:
      - "POST /consignment/offers/{id}/counter (buyer side, COUNTERED->PENDING)"
      - "POST /consignment/offers/{id}/accept (buyer accepts COUNTERED)"
      - "POST /consignment/sales/{id}/capture-payment, POST /consignment/sales/{id}/confirm-delivery"
      - "GET reads of own buyers/{id}, offers, sales, disputes"

  - name: Authenticator
    description: "Expert who authenticates and grades received items"
    identity: "opaque"
    exclusive_operations:
      - "POST /consignment/items/{id}/authenticate"
    shared_operations:
      - "GET reads of items, listings, category-policies"

  - name: ConciergeAgent
    description: "Field agent who completes white-glove pickups"
    identity: "opaque"
    exclusive_operations:
      - "POST /consignment/pickups/{id}/complete"
    shared_operations: []
