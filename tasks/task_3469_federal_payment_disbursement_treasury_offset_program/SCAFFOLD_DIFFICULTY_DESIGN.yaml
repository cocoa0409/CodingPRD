            - "after record creation: Payment.${pay_1}.integrity_status == FLAGGED (link 1) and processing_status == HELD (link 2 — caused by the flag, not by the creation call directly)"
            - "execute is rejected from HELD (state gate) — see sibling priority-conflict instance"
