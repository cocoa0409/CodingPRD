  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_blocked_by_student_suspension
        grounds:
          - state_machines.Student.ELIGIBLE_to_SUSPENDED
          - state_machines.Enrollment.PENDING_VERIFICATION_to_REGISTERED
          - errors[ERR_STUDENT_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Entity pair Enrollment x Student: confirm is gated on the Student
          aggregate's state (status == ELIGIBLE). Suspending the student after
          the enrollment was created turns a previously-confirmable enrollment
          into ERR_STUDENT_NOT_ELIGIBLE without touching the offering, the
          terms, or the funding agreement.
        test_recipe:
          setup:
            - "Standard fixture, capacity 2, no-placement course; enrollment e1 created (PENDING_VERIFICATION) for student s1 while s1 was ELIGIBLE"
            - "Then DualCreditAdmin suspends s1 (Student.status -> SUSPENDED)"
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Fall 2026 HS", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin, captures: { ht_id: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "HIST210", title: "US History", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "NONE", min_placement_score: 0 }, as: DualCreditAdmin, captures: { crs_id: $.data.id } }
            - { call: "POST /dual-credit/instructors", payload: { full_name: "Pat Quinn", high_school_id: "${hs_id}" }, as: DualCreditAdmin, captures: { ins_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications", payload: { instructor_id: "${ins_id}", course_id: "${crs_id}", qualification_summary: "MA History" }, as: Instructor, as_user_id: "${ins_id}", captures: { cap_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications/${cap_id}/begin-review", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/credential-applications/${cap_id}/approve", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/funding-agreements", payload: { high_school_id: "${hs_id}", college_term_id: "${ct_id}", funding_model: STATE_PROGRAM, tuition_cents_per_credit: 40000, state_rate_cents_per_credit: 30000, district_cap_cents: 0 }, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_id}", college_term_id: "${ct_id}", hs_term_id: "${ht_id}", high_school_id: "${hs_id}", instructor_id: "${ins_id}", capacity: 2, delivery_mode: HS_CAMPUS }, as: DualCreditAdmin, captures: { off_id: $.data.id } }
            - { call: "POST /dual-credit/terms/${ct_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/terms/${ht_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings/${off_id}/open", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/students", payload: { full_name: "Jamie Diaz", high_school_id: "${hs_id}", grade_level: 12 }, as: HsCoordinator, captures: { stu_id: $.data.id } }
            - { call: "POST /dual-credit/enrollments", payload: { student_id: "${stu_id}", offering_id: "${off_id}" }, as: HsCoordinator, captures: { enr_id: $.data.id } }
            - { call: "POST /dual-credit/students/${stu_id}/suspend", payload: {}, as: DualCreditAdmin }
            - { call: "GET /dual-credit/offerings/${off_id}", as: Any, captures: { off_v: $.data.version } }
          trigger:
            - { call: "POST /dual-credit/enrollments/${enr_id}/confirm", payload: { expected_offering_version: "${off_v}" }, as: HsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_STUDENT_NOT_ELIGIBLE"
            - "Enrollment.${enr_id}.status remains PENDING_VERIFICATION (the failed confirm leaves state untouched)"
            - "CourseOffering.${off_id}.seats_taken == 0 (no seat was consumed)"

      - name: offering_open_blocked_by_credential_state
        grounds:
          - state_machines.CourseOffering.DRAFT_to_OPEN
          - state_machines.CredentialApplication.SUBMITTED_to_UNDER_REVIEW
          - errors[ERR_INSTRUCTOR_NOT_CREDENTIALED]
        distinguishing_aspect: |
          Entity pair CourseOffering x CredentialApplication (distinct from
          the sibling's Enrollment x Student): open is gated on the EXISTENCE
          of an APPROVED application for (instructor, course). An application
          sitting in UNDER_REVIEW blocks the transition with
          ERR_INSTRUCTOR_NOT_CREDENTIALED; approving it unblocks the exact
          same request — the gate reads another aggregate's state machine.
        test_recipe:
          setup:
            - "School, both terms OPEN, MATH151, instructor with a credential application taken only as far as UNDER_REVIEW; DRAFT offering; funding agreement present"
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Fall 2026 HS", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin, captures: { ht_id: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "MATH151", title: "College Algebra", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "MATH", min_placement_score: 70 }, as: DualCreditAdmin, captures: { crs_id: $.data.id } }
            - { call: "POST /dual-credit/instructors", payload: { full_name: "Pat Quinn", high_school_id: "${hs_id}" }, as: DualCreditAdmin, captures: { ins_id: $.data.id } }
            - { call: "POST /dual-credit/funding-agreements", payload: { high_school_id: "${hs_id}", college_term_id: "${ct_id}", funding_model: STATE_PROGRAM, tuition_cents_per_credit: 40000, state_rate_cents_per_credit: 30000, district_cap_cents: 0 }, as: DualCreditAdmin }
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_id}", college_term_id: "${ct_id}", hs_term_id: "${ht_id}", high_school_id: "${hs_id}", instructor_id: "${ins_id}", capacity: 2, delivery_mode: HS_CAMPUS }, as: DualCreditAdmin, captures: { off_id: $.data.id } }
            - { call: "POST /dual-credit/terms/${ct_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/terms/${ht_id}/open-registration", payload: {}, as: DualCreditAdmin }
            - { call: "POST /dual-credit/credential-applications", payload: { instructor_id: "${ins_id}", course_id: "${crs_id}", qualification_summary: "MS Mathematics" }, as: Instructor, as_user_id: "${ins_id}", captures: { cap_id: $.data.id } }
            - { call: "POST /dual-credit/credential-applications/${cap_id}/begin-review", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /dual-credit/offerings/${off_id}/open", payload: {}, as: DualCreditAdmin, captures: { open_err: $.data.error_id } }
            - { call: "POST /dual-credit/credential-applications/${cap_id}/approve", payload: {}, as: CredentialReviewer, as_user_id: "rev-1" }
            - { call: "POST /dual-credit/offerings/${off_id}/open", payload: {}, as: DualCreditAdmin, captures: { open_ok: $.data.status } }
          assert:
            - "${open_err} == ERR_INSTRUCTOR_NOT_CREDENTIALED (UNDER_REVIEW does not satisfy the APPROVED gate)"
            - "CourseOffering.${off_id}.status remains DRAFT after the failed open"
            - "${open_ok} == OPEN after the application transitions to APPROVED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: term_overlap_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_TERM_OVERLAP]
          - entities.AcademicTerm.fields.start_date
        distinguishing_aspect: |
          HALF-OPEN [start_date, end_date) semantics on the AcademicTerm
          resource: a sibling HS term starting exactly when the existing one
          ends (end == start) does NOT overlap and is created; one starting a
          day earlier DOES overlap and is rejected. Distinct interval geometry
          from the closed-interval articulation sibling.
        test_recipe:
          setup:
            - "School exists; one HIGH_SCHOOL term occupies [2026-08-20, 2026-12-20)"
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Fall 2026 HS", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin }
          trigger:
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Spring 2027 HS", start_date: "2026-12-20T00:00:00Z", end_date: "2027-05-10T00:00:00Z", add_deadline: "2027-01-10T00:00:00Z", drop_deadline: "2027-02-01T00:00:00Z", withdraw_deadline: "2027-03-15T00:00:00Z" }, as: DualCreditAdmin, captures: { adjacent_ok: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_id}", name: "Winter Bridge", start_date: "2026-12-19T00:00:00Z", end_date: "2027-01-05T00:00:00Z", add_deadline: "2026-12-22T00:00:00Z", drop_deadline: "2026-12-26T00:00:00Z", withdraw_deadline: "2027-01-02T00:00:00Z" }, as: DualCreditAdmin, captures: { overlap_err: $.data.error_id } }
          assert:
            - "${adjacent_ok} is a created term id (HTTP 201): start == existing end is adjacency, not overlap, under half-open semantics"
            - "${overlap_err} == ERR_TERM_OVERLAP: [2026-12-19, 2027-01-05) intersects [2026-08-20, 2026-12-20)"

      - name: articulation_window_closed_interval_conflict
        grounds:
          - validations[priority=8]
          - errors[ERR_ARTICULATION_WINDOW_OVERLAP]
          - entities.ArticulationAgreement.fields.effective_to
        distinguishing_aspect: |
          CLOSED [effective_from, effective_to] semantics on the
          ArticulationAgreement resource (different geometry AND different
          entity from the half-open term sibling): a new agreement whose
          effective_from merely TOUCHES the existing effective_to
          (2026-06-30 == 2026-06-30) is rejected, while one starting the next
          day is accepted.
        test_recipe:
          setup:
            - "School, college term, course MATH151 exist; an articulation agreement for (MATH151, 'StateU') covers the closed window [2026-01-01, 2026-06-30]"
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "MATH151", title: "College Algebra", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "MATH", min_placement_score: 70 }, as: DualCreditAdmin, captures: { crs_id: $.data.id } }
            - { call: "POST /dual-credit/articulation-agreements", payload: { course_id: "${crs_id}", target_institution: "StateU", transfer_credit_hours: 2.5, min_grade_for_transfer: C, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z" }, as: DualCreditAdmin, captures: { aa_id: $.data.id } }
          trigger:
            - { call: "POST /dual-credit/articulation-agreements", payload: { course_id: "${crs_id}", target_institution: "StateU", transfer_credit_hours: 3.0, min_grade_for_transfer: C, effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }, as: DualCreditAdmin, captures: { touch_err: $.data.error_id } }
            - { call: "POST /dual-credit/articulation-agreements", payload: { course_id: "${crs_id}", target_institution: "StateU", transfer_credit_hours: 3.0, min_grade_for_transfer: C, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }, as: DualCreditAdmin, captures: { next_ok: $.data.id } }
          assert:
            - "${touch_err} == ERR_ARTICULATION_WINDOW_OVERLAP (closed interval: touching endpoints DO overlap)"
            - "${next_ok} is a created agreement id (HTTP 201): 2026-07-01 lies strictly after the existing effective_to"

  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_across_cycles
        grounds:
          - calculations.seat_availability
          - calculations.waitlist_promotion
          - state_machines.Enrollment.REGISTERED_to_DROPPED
          - state_machines.Enrollment.WITHDRAWN_to_REGISTERED
