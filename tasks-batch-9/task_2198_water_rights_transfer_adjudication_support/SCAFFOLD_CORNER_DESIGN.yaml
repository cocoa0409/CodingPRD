          assert:
            - "HTTP 200; WaterRight.status == ACTIVE; version == 2 (creation was 1)."
            - "The AUTHORIZED listing returns total_count 2 — BOTH ${pod1} and ${pod2} were promoted, and GET /water-rights/${wr}/points-of-diversion with status PROPOSED now returns 0 rows."
            - "consecutive_nonuse_years == 7 (2019..2025 in the 2016..2025 look-back), forfeiture_risk_score == 60.50 (63 + 0.00 + 7.50 + 0 - 10) and forfeiture_risk_band == ELEVATED, visible on the activation response itself."
            - "certified_hcu_af is still 0.00 — activation perfects the right but quantifies nothing."

      - name: sm_water_right_activate_without_verified_evidence_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.WaterRight.UNADJUDICATED_to_ACTIVE
          - validations[priority=29]
          - errors[ERR_NO_VERIFIED_USE_EVIDENCE]
        distinguishing_aspect: >-
          The activation gate is about evidence QUALITY, not evidence presence: a
          right with no records at all and a right with an AFFIDAVIT-only record
          are both refused with ERR_NO_VERIFIED_USE_EVIDENCE, and only adding a
          METER or AERIAL_IMAGERY record opens the transition.
        test_recipe:
          setup:
            - "Two UNADJUDICATED rights: R1 with no beneficial-use records, R2 with a single AFFIDAVIT record."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr1: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-002", priority_date: "1912-06-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 60.00, authorized_diversion_af: 200.00, authorized_rate_cfs: 2.500}, as: WaterRightsAnalyst, captures: {wr2: "$.data.id"}}
            - {call: "POST /water-rights/${wr2}/beneficial-use-records", payload: {use_year: 2022, reported_diversion_af: 150.000, irrigated_acres: 50.00, verification_source: AFFIDAVIT}, as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /water-rights/${wr1}/activate", as: WaterRightsAnalyst, captures: {e1: "$.data.error_id"}}
            - {call: "POST /water-rights/${wr2}/activate", as: WaterRightsAnalyst, captures: {e2: "$.data.error_id"}}
            - {call: "POST /water-rights/${wr2}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 150.000, irrigated_acres: 50.00, verification_source: AERIAL_IMAGERY}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr2}/activate", as: WaterRightsAnalyst}
          assert:
            - "Call 1: 422 ERR_NO_VERIFIED_USE_EVIDENCE; R1 stays UNADJUDICATED with version 1."
            - "Call 2: 422 ERR_NO_VERIFIED_USE_EVIDENCE — an AFFIDAVIT record does not qualify."
            - "Call 4: 200 with status ACTIVE — the AERIAL_IMAGERY record opens the same transition that was refused twice."
            - "R2's AFFIDAVIT record still counts for the forfeiture look-back: with records for 2022 and 2023 the longest non-use run is 2024..2025 == 2, so consecutive_nonuse_years == 2 even though quantification would ignore the affidavit."

      - name: sm_water_right_invalid_transitions_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.WaterRight
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FORFEITURE_NOT_ELIGIBLE]
        distinguishing_aspect: >-
          Undeclared edges out of ACTIVE are refused with ERR_INVALID_STATE
          (re-activating, reinstating a right that was never suspended), and the
          declared-but-ungated edge is refused with its OWN error: forfeiture of
          a right with only 2 consecutive non-use years is
          ERR_FORFEITURE_NOT_ELIGIBLE, not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Right R2 activated with 2022 and 2023 records (consecutive_nonuse_years == 2), clock 2026-03-01T00:00:00Z."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-002", priority_date: "1912-06-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 60.00, authorized_diversion_af: 200.00, authorized_rate_cfs: 2.500}, as: WaterRightsAnalyst, captures: {wr2: "$.data.id"}}
            - {call: "POST /water-rights/${wr2}/beneficial-use-records", payload: {use_year: 2022, reported_diversion_af: 150.000, irrigated_acres: 50.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr2}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 150.000, irrigated_acres: 50.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr2}/activate", as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /water-rights/${wr2}/activate", as: WaterRightsAnalyst, captures: {e1: "$.data.error_id"}}
            - {call: "POST /water-rights/${wr2}/reinstate", payload: {reinstatement_note: "no suspension to lift"}, as: WaterRightsAnalyst, captures: {e2: "$.data.error_id"}}
            - {call: "POST /water-rights/${wr2}/declare-forfeiture", payload: {finding_note: "premature finding"}, as: WaterRightsAnalyst, captures: {e3: "$.data.error_id"}}
          assert:
            - "Call 1: 409 ERR_INVALID_STATE — ACTIVE -> ACTIVE is not a declared edge."
            - "Call 2: 409 ERR_INVALID_STATE — only SUSPENDED -> ACTIVE is declared for /reinstate."
            - "Call 3: 422 ERR_FORFEITURE_NOT_ELIGIBLE — the edge ACTIVE -> FORFEITED exists but its statutory gate (5 consecutive non-use years) is unmet at 2."
            - "After all three calls the right is still ACTIVE with the same version it had after activation — a rejected transition never bumps version."

      - name: sm_water_right_forfeited_state_is_terminal_and_locked
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.WaterRight.terminal_states
          - errors[ERR_INVALID_STATE]
          - errors[ERR_RIGHT_NOT_TRANSFERABLE]
        distinguishing_aspect: >-
          FORFEITED is sticky: activation, reinstatement and a second forfeiture
          declaration are all ERR_INVALID_STATE, while an operation that reads
          the right as collateral fails with the domain-specific
          ERR_RIGHT_NOT_TRANSFERABLE instead — and the zeroed ledger stays zeroed.
        test_recipe:
          setup:
            - "Bank-enrolled right with a single 2018 METER record (consecutive_nonuse_years == 7), activated then forfeited; an empty bank account for the same claimant."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2018, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-bank-accounts", payload: {claimant_id: "${cl_a}", basin_code: "BASIN-01"}, as: WaterRightsAnalyst, captures: {acct: "$.data.id"}}
            - {call: "GET /water-bank-accounts/${acct}", as: WaterRightsAnalyst, captures: {acct_v1: "$.data.version"}}
            - {call: "POST /water-rights/${wr}/declare-forfeiture", payload: {finding_note: "seven consecutive non-use years on the meter record"}, as: WaterRightsAnalyst}
          trigger:
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst, captures: {e1: "$.data.error_id"}}
            - {call: "POST /water-rights/${wr}/reinstate", payload: {reinstatement_note: "attempt to revive a forfeited right"}, as: WaterRightsAnalyst, captures: {e2: "$.data.error_id"}}
            - {call: "POST /water-rights/${wr}/declare-forfeiture", payload: {finding_note: "second declaration"}, as: WaterRightsAnalyst, captures: {e3: "$.data.error_id"}}
            - {call: "POST /water-bank-accounts/${acct}/deposits", payload: {water_right_id: "${wr}", deposit_af: 1.00, expected_water_bank_account_version: "${acct_v1}"}, as: WaterRightsAnalyst, captures: {e4: "$.data.error_id"}}
          assert:
            - "Calls 1-3: 409 ERR_INVALID_STATE — no edge leaves FORFEITED."
            - "Call 4: 409 ERR_RIGHT_NOT_TRANSFERABLE — the deposit is refused for the right's status (validations priority 18), NOT for the version (priority 16) or the empty transferable bucket (priority 45)."
            - "The version guard at priority 16 is never reached, so supplying the CURRENT account version does not change the outcome."
            - "GET /water-rights/${wr}: status FORFEITED and certified_hcu_af == encumbered_af == transferred_away_af == transferable_af == 0.00; version unchanged from the declaration."
            - "GET /water-bank-accounts/${acct}: deposited_credit_af == 0.00 and version still ${acct_v1} — the rejected deposit moved nothing."

      - name: sm_hcu_study_certification_supersedes_the_prior_certified_study
        claim_type: side_effect_execution
        grounds:
          - state_machines.HcuStudy.DRAFT_to_CERTIFIED
          - state_machines.HcuStudy.CERTIFIED_to_SUPERSEDED
          - calculations.hcu_transferable_volume
          - calculations.right_volume_ledger
        distinguishing_aspect: >-
          Certifying a second study is a cross-entity side effect chain: the
          previously CERTIFIED study is pushed to the terminal SUPERSEDED state
          and the right's certified_hcu_af is REPLACED (not accumulated) by the
          new figure, which here is LOWER because the shorter period triggers
          the short-history haircut.
        test_recipe:
          setup:
            - "ACTIVE right (authorized_diversion_af 400.00) with 2023, 2024 and 2025 METER records of 300.000 AF each; study A over 2023..2025 already CERTIFIED (certified_hcu_af 195.00)."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st_a: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st_a}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2024, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st_b: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v2: "$.data.version"}}
          trigger:
            - {call: "POST /hcu-studies/${st_b}/certify", payload: {expected_water_right_version: "${wr_v2}"}, as: WaterRightsAnalyst}
            - {call: "GET /hcu-studies/${st_a}", as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst}
          assert:
            - "Study B: status CERTIFIED, qualifying_year_count == 2, average_annual_cu_af == 195.000, short_history_haircut_applied == true, transferable_cu_af == 165.75 (195.000 <= face_cap 260.000, then * 0.85)."
            - "Study A is now SUPERSEDED (terminal) and its own transferable_cu_af is unchanged at 195.00 — supersession rewrites no historical figure."
            - "The right's certified_hcu_af == 165.75 — REPLACED, not summed with 195.00 — and transferable_af == 165.75 with encumbered_af 0.00 and transferred_away_af 0.00, so calculations.right_volume_ledger holds exactly."
            - "The right's version is ${wr_v2} + 1; both study versions were bumped."

      - name: sm_hcu_idempotency_recertification_rejected_without_double_ledger_move
        claim_type: idempotency
        grounds:
          - state_machines.HcuStudy.DRAFT_to_CERTIFIED
          - errors[ERR_INVALID_STATE]
          - calculations.right_volume_ledger
        distinguishing_aspect: >-
          Certification is NOT idempotent-by-replay: re-certifying an already
