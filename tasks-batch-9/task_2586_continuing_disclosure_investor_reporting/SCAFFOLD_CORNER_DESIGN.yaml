  # The §1.6 error catalog carries no claim_type rows of its own (Table 6 states only that
  # every code must be triggerable), so no standalone `errors` section is emitted. The four
  # codes not yet exercised above — ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED,
  # ERR_SEGREGATION_OF_DUTIES and ERR_ISSUE_VERSION_STALE — are triggered by the rbac and
  # cross-cutting sections that follow, completing coverage of all 52 codes.
  - section: rbac
    instances:

      - name: registry_and_calendar_authority_belongs_to_the_finance_director_alone
        claim_type: role_exclusive_operations
        grounds:
          - roles.FinanceDirector.exclusive_operations
          - validations.priority_2
          - validations.priority_1
        distinguishing_aspect: >-
          The three non-director roles are refused the debt-registry and calendar endpoints with
          ERR_UNAUTHORIZED, and the refusal must be decided by the role check at priority 2 BEFORE
          the DisseminationAgent identity check at priority 6: an agent whose X-User-ID is not an
          engagement id at all must still see ERR_UNAUTHORIZED, never ERR_AGENT_NOT_ENGAGED.
          Priority 2 also outranks the body-FK not-found check at priority 4, so a wrong-role call
          carrying a nonexistent undertaking_id still returns 403 rather than 404.
        test_recipe:
          setup:
            - "No pre-existing rows are required for the negative probes; one OUTSTANDING BondIssue is created at the end to prove the same endpoint works for the director."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
          trigger:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026B", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 5000000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_officer: "$.data.error_id" }
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026B", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 5000000 }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_reviewer: "$.data.error_id" }
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026B", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 5000000 }
              as: DisseminationAgent
              as_user_id: "not-an-engagement-id"
              captures: { e_agent: "$.data.error_id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "00000000-0000-4000-8000-000000000000", fiscal_year_end_month_day: "06-30" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_before_fk: "$.data.error_id" }
            - call: "POST /disclosure/undertakings/${und_id}/suspend"
              payload: { suspended_reason: "Attempted by the preparer." }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_suspend: "$.data.error_id" }
            - call: "POST /disclosure/calendar-sweeps"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_sweep: "$.data.error_id" }
            - call: "POST /disclosure/bond-issues/${issue_id}/defease"
              payload: { defeasance_type: "LEGAL", escrow_deposit_cents: 100000000, occurrence_date: "2026-07-30" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_defease: "$.data.error_id" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { shared_read: "$.data.status" }
          assert:
            - "${e_officer}, ${e_reviewer}, ${e_agent} are all ERR_UNAUTHORIZED with HTTP 403 — and in particular ${e_agent} is NOT ERR_AGENT_NOT_ENGAGED, because priority 2 precedes priority 6"
            - "${e_before_fk} == ERR_UNAUTHORIZED (403), not ERR_ISSUE_NOT_FOUND (404) — the role gate at priority 2 precedes the body-FK resolution at priority 4"
            - "${e_suspend} == ERR_UNAUTHORIZED, ${e_sweep} == ERR_UNAUTHORIZED, ${e_defease} == ERR_UNAUTHORIZED"
            - "${shared_read} == OUTSTANDING — every GET is a shared operation, so the refusals above are endpoint-specific and not a blanket lockout"

      - name: preparation_and_review_duties_do_not_overlap_between_officer_and_reviewer
        claim_type: role_exclusive_operations
        grounds:
          - roles.DisclosureOfficer.exclusive_operations
          - roles.ComplianceReviewer.exclusive_operations
          - validations.priority_2
        distinguishing_aspect: >-
          The officer prepares and the reviewer judges, and neither may cross: the officer cannot
          determine materiality, waive content, classify a placement or post a statement, while the
          reviewer cannot declare requirements, open cycles, attest content or draft a filing. Each
          refusal must be a 403 on a request whose body is otherwise completely valid, so an
          implementation that validates the body first and the role second is exposed.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking, a waivable 10000-bp requirement, one FY2026 cycle with its single item, and one pending MaterialEventNotice."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "ENTERPRISE_STATISTICS", label: "Enterprise Statistics", weight_bp: 10000, waivable: true }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_id: "$.data[0].id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-07-28" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { notice_id: "$.data.id" }
          trigger:
            - call: "POST /disclosure/material-event-notices/${notice_id}/determine"
              payload: { determination: "MATERIAL", determination_note: "Preparer attempting to judge his own filing." }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_determine: "$.data.error_id" }
            - call: "POST /disclosure/cycle-content-items/${item_id}/waive"
              payload: { waiver_reason: "Preparer attempting to excuse his own content." }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_waive: "$.data.error_id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "BUDGET_SUMMARY", label: "Adopted Budget Summary", weight_bp: 1000 }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_req: "$.data.error_id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2027", period_start_date: "2026-07-01", period_end_date: "2027-06-30" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_cycle: "$.data.error_id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { data_as_of_date: "2026-06-30" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_patch: "$.data.error_id" }
            - call: "POST /disclosure/cycle-content-items/${item_id}/attest"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_attest: "$.data.error_id" }
            - call: "POST /disclosure/cycle-content-items/${item_id}/waive"
              payload: { waiver_reason: "Enterprise statistics are not part of this undertaking." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { w_status: "$.data.status", w_reason: "$.data.waiver_reason" }
            - call: "POST /disclosure/material-event-notices/${notice_id}/determine"
              payload: { determination: "MATERIAL", determination_note: "Trustee substitution affects bondholder security." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { d_status: "$.data.status" }
          assert:
            - "${e_determine} == ERR_UNAUTHORIZED (403) and ${e_waive} == ERR_UNAUTHORIZED (403) — the preparer may not judge or excuse"
            - "${e_req}, ${e_cycle}, ${e_patch}, ${e_attest} are all ERR_UNAUTHORIZED (403) — the reviewer may not prepare"
            - "${w_status} == WAIVED with ${w_reason} stored, and ${d_status} == MATERIAL — the identical two payloads that were refused above succeed once the correct role sends them, so the refusals were about the role and nothing else"

      - name: repository_traffic_is_restricted_to_the_engagement_that_owns_it
        claim_type: role_exclusive_operations
        grounds:
          - roles.DisseminationAgent.exclusive_operations
          - validations.priority_6
          - validations.priority_2
        distinguishing_aspect: >-
          Two gates stack here. The role gate keeps the three human roles off submit / confirm /
          reject entirely, and the identity gate at priority 6 then discriminates among agents by
          all three of its arms: an engagement of the WRONG undertaking cannot submit (arm a), an
          engagement that did not submit cannot confirm or reject (arm b), and an agent cannot
          acknowledge another engagement's calendar (arm c). Arm (b) is the subtle one — engagement
          B is perfectly ACTIVE and engaged on a real undertaking, so only an exact comparison
          against filing.submitting_engagement_id rejects it.
        test_recipe:
          setup:
            - "Two OUTSTANDING BondIssues, each with an ACTIVE Undertaking and one ACTIVE DisseminationEngagement (eng_a on undertaking A, eng_b on undertaking B)."
            - "One MATERIAL notice on issue A and a DRAFT MATERIAL_EVENT_NOTICE filing for it."
