# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage) — Chiropractic Practice
# Walks references/claim-extraction-guide.md row-by-row against §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Patient
          - endpoints
        distinguishing_aspect: "POST /patients with full_name/date_of_birth/payer_mode=CASH returns 201, status=ACTIVE, no_show_strike_count=0, ledger_balance_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "New Nora", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response code == 201"
            - "Patient.${pt_id}.status == ACTIVE"
            - "Patient.${pt_id}.no_show_strike_count == 0"
            - "Patient.${pt_id}.ledger_balance_cents == 0"
            - "Patient.${pt_id}.version == 1"

      - name: get_patient_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.Patient
          - endpoints
        distinguishing_aspect: "GET /patients/{id} echoes the stored full_name and payer_mode."
        test_recipe:
          setup: ["One CASH patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Read Rita", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
          trigger:
            - call: "GET /patients/${pt_id}"
              payload: {}
              as: FrontDesk
              captures: { nm: $.data.full_name }
          assert:
            - "Patient.${pt_id}.full_name == 'Read Rita'"
            - "Patient.${pt_id}.payer_mode == CASH"

      - name: list_patients_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Patient
          - endpoints
        distinguishing_aspect: "GET /patients returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two patients exist."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P1", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
            - call: "POST /patients"
              payload: { full_name: "P2", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
          trigger:
            - call: "GET /patients"
              payload: { limit: 1, offset: 0 }
              as: FrontDesk
          assert:
            - "response_type == array"
            - "meta/pagination total_count == 2 and has_more == true"

      - name: get_patient_not_found
        claim_type: Not Found
        grounds:
          - entities.Patient
          - "errors[ERR_PATIENT_NOT_FOUND]"
        distinguishing_aspect: "GET /patients/{nonexistent uuid} returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "data.error_id == ERR_PATIENT_NOT_FOUND"

      - name: create_patient_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Patient.fields.payer_mode
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=6]"
        distinguishing_aspect: "POST /patients omitting payer_mode returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Bad Bob", date_of_birth: "1990-05-05" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_appointment_bad_enum_visit_type
        claim_type: Type Constraints
        grounds:
          - entities.Appointment.fields.visit_type
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=6]"
        distinguishing_aspect: "Booking with visit_type='MASSAGE' (outside the enum) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A patient, provider, room and ADJUSTMENT fee schedule exist; clock set."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Enum Ed", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "MASSAGE", scheduled_start: "2026-03-03T17:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: computed_fields_system_minted_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Patient.fields.ledger_balance_cents
          - entities.Patient.fields.status
        distinguishing_aspect: "Client cannot set ledger_balance_cents or status on create; server mints them (id, created_at, version) and ignores any client value."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Sys Sam", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id, ver: $.data.version }
          assert:
            - "Patient.${pt_id}.ledger_balance_cents == 0"
            - "Patient.${pt_id}.status == ACTIVE"
            - "Patient.${pt_id}.version == 1"

      - name: immutable_ledger_entry_no_version_field
        claim_type: Immutability
        grounds:
          - entities.LedgerEntry
        distinguishing_aspect: "LedgerEntry has common_fields:false — it carries id and created_at only, no version, and has no update endpoint (append-only)."
        test_recipe:
          setup: ["A CASH patient with one PATIENT_PAYMENT ledger entry."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Led Lee", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/payments"
              payload: { amount_cents: 1000 }
              as: FrontDesk
              captures: { le_id: $.data.id }
          trigger:
            - call: "GET /patients/${pt_id}/ledger-entries"
              payload: { entry_type: "PATIENT_PAYMENT" }
              as: BillingClerk
          assert:
            - "the returned LedgerEntry has entry_type == PATIENT_PAYMENT and amount_cents == -1000"
            - "no PUT/PATCH endpoint exists for LedgerEntry in §1.5"

      - name: insurance_policy_parent_must_exist
        claim_type: Parent Relationships
        grounds:
          - entities.InsurancePolicy.fields.patient_id
          - "errors[ERR_PATIENT_NOT_FOUND]"
        distinguishing_aspect: "Adding an insurance policy under a non-existent patient returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients/00000000-0000-4000-8000-000000000000/insurance-policies"
              payload: { carrier_name: "Acme", annual_visit_cap: 10, deductible_total_cents: 0, coinsurance_pct: 0.2, allowed_amount_cents: 8000 }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "data.error_id == ERR_PATIENT_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_from_booked_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.CHECKED_IN_to_ATTENDED
          - "errors[ERR_INVALID_STATE]"
          - "validations[priority=7]"
        distinguishing_aspect: "Completing a BOOKED (never CHECKED_IN) appointment returns ERR_INVALID_STATE (409); no transition defined from BOOKED to ATTENDED."
        test_recipe:
          setup: ["A CASH patient with one BOOKED ADJUSTMENT appointment (not checked in)."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "State Stan", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-03T17:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - "errors[ERR_INVALID_STATE]"
          - "validations[priority=7]"
        distinguishing_aspect: "A second cancel on an already-CANCELLED appointment returns ERR_INVALID_STATE (409); no double cap-release fires."
        test_recipe:
          setup: ["A CASH patient with one CANCELLED appointment (cancelled well before its start)."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Idem Ida", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-20T17:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Appointment.${appt_id}.attendance_status == CANCELLED"

      - name: finalize_already_finalized_exam_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ExamRecord.DRAFT_to_FINALIZED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Finalizing an already-FINALIZED exam (terminal) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A patient with a FINALIZED exam."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Exam Eve", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/exams"
              payload: { provider_id: "${prov_id}", exam_type: "INITIAL", severity_score: 5 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /patients/${pt_id}/exams/${exam_id}/finalize"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /patients/${pt_id}/exams/${exam_id}/finalize"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: sign_soap_locks_immutable_resign_invalid
        claim_type: Valid Transition
        grounds:
          - state_machines.SoapNote.DRAFT_to_SIGNED
          - entities.SoapNote.fields.status
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Signing a DRAFT SOAP note moves it to SIGNED; re-signing the SIGNED note returns ERR_INVALID_STATE (immutability)."
        test_recipe:
          setup: ["A CASH patient with a CHECKED_IN appointment that has a DRAFT SOAP note."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Sign Sid", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-03T17:00:00Z", duration_minutes: 15 }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/soap-note"
              payload: { provider_id: "${prov_id}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/soap-note/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { st: $.data.status }
          trigger:
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/soap-note/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "after the setup sign, SoapNote.status == SIGNED"
            - "the re-sign returns response code 409 with data.error_id == ERR_INVALID_STATE"

      - name: phase_bubble_up_completes_plan
        claim_type: Bubble up
        grounds:
          - state_machines.PlanPhase.IN_PROGRESS_to_COMPLETED
          - state_machines.TreatmentPlan.ACTIVE_to_COMPLETED
          - entities.TreatmentPlan.fields.status
        distinguishing_aspect: "When the only (MAINTENANCE) phase's visits_completed reaches planned_visit_count, the phase auto-COMPLETES and bubbles up to set the plan COMPLETED."
        test_recipe:
          setup: ["An ACTIVE CASH plan with a single MAINTENANCE phase (planned 1) whose lone visit is CHECKED_IN with a SIGNED SOAP note."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Maint Mia", date_of_birth: "1990-05-05", payer_mode: "CASH" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/exams"
              payload: { provider_id: "${prov_id}", exam_type: "INITIAL", severity_score: 3 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /patients/${pt_id}/exams/${exam_id}/finalize"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/treatment-plans"
              payload: { exam_record_id: "${exam_id}" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pt_id}/treatment-plans/${plan_id}/phases"
              payload: { phase_type: "MAINTENANCE", sequence_index: 0, visits_per_week: 1, planned_visit_count: 1 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { phase_id: $.data.id }
            - call: "GET /patients/${pt_id}"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { pt_v: $.data.version }
            - call: "POST /patients/${pt_id}/treatment-plans/${plan_id}/activate"
              payload: { expected_patient_version: "${pt_v}" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "ADJUSTMENT", scheduled_start: "2026-03-03T17:00:00Z", duration_minutes: 15, plan_phase_id: "${phase_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/soap-note"
              payload: { provider_id: "${prov_id}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/soap-note/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          assert:
            - "PlanPhase.${phase_id}.status == COMPLETED"
            - "TreatmentPlan.${plan_id}.status == COMPLETED"
            - "TreatmentPlan.${plan_id}.visits_delivered == 1"

      - name: appointment_parallel_dimensions_excluded
        claim_type: Valid Transition
        grounds:
          - state_machines.Appointment.POSTED_to_ADJUDICATED
        excluded_because:
          difficulty_instance: non_linear_state_machine / appointment_parallel_attendance_x_billing
          rationale: "The parallel attendance×billing dimension and the POSTED->ADJUDICATED transition are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: cap_counting_excludes_exam_and_xray
        claim_type: Input Set Filtering
        grounds:
          - calculations.cap_reservation_check
          - entities.Appointment.fields.counts_against_cap
        distinguishing_aspect: "Booking an EXAM visit for an INSURANCE patient does NOT reserve a cap slot (EXAM not in CAP_COUNTING_VISIT_TYPES); counts_against_cap stays false and visits_reserved stays 0."
        test_recipe:
          setup: ["INSURANCE patient with ACTIVE policy cap=1; an EXAM fee schedule and an IMAGING-irrelevant ADJUSTMENT room."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "EXAM", cash_rate_cents: 12000, billed_amount_cents: 15000 }
              as: PracticeAdmin
            - call: "POST /providers"
              payload: { full_name: "Dr Vega", npi: "1234567890", license_state: "CA" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { name: "Adj 1", room_type: "ADJUSTMENT" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /patients"
              payload: { full_name: "Exam Ed", date_of_birth: "1990-05-05", payer_mode: "INSURANCE" }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/insurance-policies"
              payload: { carrier_name: "Acme", annual_visit_cap: 1, deductible_total_cents: 0, coinsurance_pct: 0.2, allowed_amount_cents: 8000 }
              as: BillingClerk
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /patients/${pt_id}/appointments"
              payload: { provider_id: "${prov_id}", treatment_room_id: "${room_id}", visit_type: "EXAM", scheduled_start: "2026-03-03T17:00:00Z", duration_minutes: 30, insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id, cac: $.data.counts_against_cap }
          assert:
            - "Appointment.${appt_id}.counts_against_cap == false"
            - "InsurancePolicy.${pol_id}.visits_reserved == 0"

      - name: cash_responsibility_full_cash_rate
        claim_type: Correct Result
        grounds:
          - calculations.patient_responsibility
          - entities.Appointment.fields.patient_responsibility_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / patient_responsibility_insurance_vs_cash_diverge
          rationale: "CASH variant result (6000) asserted by the named §1.8 dual-variant instance."

      - name: series_generates_exact_planned_count
        claim_type: Correct Result
