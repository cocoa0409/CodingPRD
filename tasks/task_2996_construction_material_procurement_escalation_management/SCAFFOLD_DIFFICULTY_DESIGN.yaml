# Scaffold Difficulty Design (SKILL.md 1.8) - depth probe for task 2996
# 9 rule_ids from 0.5, each with >= 2 differentiated instances.
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: escalation_provisional_at_release_versus_final_at_delivery
    grounds:
    - calculations.escalation_adjustment
    - entities.PurchaseCommitment.fields.escalation_variant
    - entities.PurchaseCommitment.fields.escalation_accrued
    - state_machines.PurchaseCommitment.RELEASED_FOR_FAB_to_FABRICATING
    distinguishing_aspect: The same executed clause and the same committed_base_cost of 1150000.00 yield 32941.98 under provisional_at_release (look-back to the greatest published period <= the clock month, 2026-09 at 331.00) and 55200.00 under final_at_delivery (exact clock month 2026-12 at 344.50, where the 8.0 pct cap binds); the 22258.02 delta lands on Project.escalation_contingency_committed.
    test_recipe:
      setup:
      - Project with escalation_contingency_budget 500000.00 and one steel package estimated at 1200000.00
      - 'Four PPI_STEEL_MILL readings published: 2026-07 at 310.00, 2026-08 at 322.00, 2026-09 at 331.00, 2026-12 at 344.50'
      - Escalation clause EXECUTED with baseline period 2026-07 (baseline_index_value frozen at 310.00), deadband 2.0, cap 8.0, contractor share 40.0
      - PurchaseCommitment COMMITTED at committed_base_cost 1150000.00, is_early_buyout false so requires_storage_arrangement is false
      - Clock advanced to 2026-09-10 and the commitment RELEASED_FOR_FAB, then FABRICATING; escalation_accrued is the provisional 32941.98
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Ironworks Fabricators LLC, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg_id}', supplier_id: '${sup_id}', base_price: '1150000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q_id: $.data.id}
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-07, value: '310.00', published_at: '2026-07-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-08, value: '322.00', published_at: '2026-08-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-09, value: '331.00', published_at: '2026-09-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-12, value: '344.50', published_at: '2026-12-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/escalation-agreements
        payload: {quote_id: '${q_id}', index_code: PPI_STEEL_MILL, baseline_index_period: 2026-07, cap_pct: '8.0', contractor_share_pct: '40.0', price_hold_through: '2026-09-15T00:00:00.000Z', deadband_pct: '2.0', proposed_terms_note: Mill index escalation with 2 pct deadband and shared band}
        as: BuyoutManager
        captures: {ea_id: $.data.id}
      - call: POST /procurement/escalation-agreements/${ea_id}/propose
        payload: {}
        as: BuyoutManager
      - call: POST /procurement/escalation-agreements/${ea_id}/execute
        payload: {}
        as: ProjectExecutive
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
        captures: {pv: $.data.version}
      - call: POST /procurement/purchase-commitments
        payload: {quote_id: '${q_id}', po_number: PO-2996-0001, expected_project_version: '${pv}', escalation_agreement_id: '${ea_id}', is_early_buyout: false}
        as: BuyoutManager
        captures: {pc_id: $.data.id}
      - call: POST /procurement/purchase-commitments/${pc_id}/commit
        payload: {}
        as: ProjectExecutive
      - call: POST /procurement/_clock/set_current_utc
        payload: {to_iso8601: '2026-09-10T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/purchase-commitments/${pc_id}/delivery-posture
        payload: {to_posture: RELEASED_FOR_FAB}
        as: BuyoutManager
      - call: POST /procurement/purchase-commitments/${pc_id}/delivery-posture
        payload: {to_posture: FABRICATING}
        as: BuyoutManager
      trigger:
      - call: POST /procurement/_clock/set_current_utc
        payload: {to_iso8601: '2026-12-20T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/purchase-commitments/${pc_id}/delivery-posture
        payload: {to_posture: DELIVERED}
        as: BuyoutManager
      - call: GET /procurement/projects/${proj_id}
        payload: {}
        as: BuyoutManager
      assert:
      - PurchaseCommitment.${pc_id}.escalation_variant == FINAL
      - PurchaseCommitment.${pc_id}.escalation_accrued == 55200.00
      - PurchaseCommitment.${pc_id}.escalation_index_period == "2026-12"
      - the provisional amount observed before the trigger was 32941.98 with escalation_index_period "2026-09", so the variant switch moved escalation_accrued by exactly 22258.02
      - PurchaseCommitment.${pc_id}.commitment_status == CLOSED and delivery_posture == DELIVERED
      - MaterialPackage.${pkg_id}.status == CLOSED
      - Project.${proj_id}.escalation_contingency_committed == 55200.00
      - Project.${proj_id}.escalation_contingency_remaining == 444800.00
      - Project.${proj_id}.committed_total_cost == 1205200.00
      - Project.${proj_id}.buyout_variance == -5200.00
  - name: supplier_exposure_snapshot_versus_forward_on_one_supplier
    grounds:
    - calculations.supplier_exposure_score
    - entities.Supplier.fields.exposure_score_snapshot
    - errors[ERR_SUBSTITUTE_SUPPLIER_EXPOSED]
    - validations[priority=70]
    distinguishing_aspect: One domestic supplier with two OPEN disruption events dated 2026-12-01 scores 0.00 / LOW under snapshot_exposure at clock 2026-08-01 (effective_date filter) yet 80.00 / HIGH under forward_exposure (no date filter), so the identical row is simultaneously readable as LOW and refused as an exposed substitute.
    test_recipe:
      setup:
      - Clock at its 2026-08-01T00:00:00Z startup default (never set)
      - Supplier 'Cascade Rebar Supply' registered as US with declared_tariff_rate_pct 0.00
      - 'Two OPEN DisruptionEvents on that supplier, both effective 2026-12-01: a TARIFF_IMPOSED at tariff_rate_pct 25.00 and an ALLOCATION notice'
      - A steel package and a SUBMITTED substitution request naming that supplier as the proposed substitute, driver VALUE_ENGINEERING, cost_delta 0.00, schedule_delta_days 0
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Cascade Rebar Supply, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup2_id: $.data.id}
      - call: POST /procurement/suppliers/${sup2_id}/disruption-events
        payload: {event_type: TARIFF_IMPOSED, effective_date: '2026-12-01T00:00:00.000Z', description: Announced Section 232 action effective 2026-12-01, tariff_rate_pct: '25.00'}
        as: BuyoutManager
        captures: {ev_tariff_id: $.data.id}
      - call: POST /procurement/suppliers/${sup2_id}/disruption-events
        payload: {event_type: ALLOCATION, effective_date: '2026-12-01T00:00:00.000Z', description: Mill placed the product on allocation from 2026-12-01}
        as: BuyoutManager
        captures: {ev_alloc_id: $.data.id}
      - call: POST /procurement/substitution-requests
        payload: {material_package_id: '${pkg_id}', proposed_supplier_id: '${sup2_id}', driver: VALUE_ENGINEERING, proposed_product: Cascade rebar cage assembly, cost_delta: '0.00', schedule_delta_days: 0}
        as: BuyoutManager
        captures: {sr_id: $.data.id}
      trigger:
      - call: GET /procurement/suppliers/${sup2_id}
        payload: {}
        as: BuyoutManager
      - call: POST /procurement/substitution-requests/${sr_id}/disposition
        payload: {disposition: APPROVED}
        as: DesignEngineer
      assert:
      - the GET returns Supplier.${sup2_id}.exposure_score_snapshot == 0.00 and exposure_band_snapshot == LOW
      - Supplier.${sup2_id}.open_disruption_count == 2
      - the disposition call fails with error_id ERR_SUBSTITUTE_SUPPLIER_EXPOSED and HTTP 409 because forward_exposure scores 80.00 (HIGH)
      - SubstitutionRequest.${sr_id}.status remains SUBMITTED
      - SubstitutionRequest.${sr_id}.applied_cost_delta == 0.00 and applied_schedule_delta_days == 0
      - MaterialPackage.${pkg_id}.fabrication_duration_days remains 70
  - name: buyout_variance_full_program_versus_bought_out_scope_only
