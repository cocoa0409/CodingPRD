  - rule_id: boundary_precision_check
    instances:
      - name: nitrate_exactly_at_mcl_is_exceedance_while_one_tenth_below_passes
        grounds:
          - calculations.water_sample_result
          - entities.WaterSample.fields.result
          - state_machines.Well.CLEAR_to_ADVISORY
          - calculations.parcel_risk_tier
        distinguishing_aspect: |
          Boundary metric #1: a concentration in mg/L on POST /wells/{id}/water-samples. The
          comparison is `>=` against NITRATE_MCL_MG_L 10.0, so 9.9 leaves the well CLEAR with
          result PASS while exactly 10.0 turns the well ADVISORY with result EXCEEDANCE.
        test_recipe:
          setup:
            - "A parcel on a private well with two DOMESTIC wells, both CLEAR and never sampled."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-BP1", county_code: "OR", site_address: "12 Aquifer Avenue", lot_size_sqft: 40000, water_source: "PRIVATE_WELL" }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { p_id: $.data.id }
            - call: "POST /wells"
              payload: { parcel_id: "${p_id}", well_type: "DOMESTIC", location_x_ft: 0, location_y_ft: 0, depth_ft: 120 }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { parcel_id: "${p_id}", well_type: "DOMESTIC", location_x_ft: 0, location_y_ft: 300, depth_ft: 130 }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { w2_id: $.data.id }
          trigger:
            - call: "POST /wells/${w1_id}/water-samples"
              payload: { collected_at: "2026-05-01T08:00:00Z", nitrate_mg_l: 9.9, coliform_present: false }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { ws1_id: $.data.id }
            - call: "POST /wells/${w2_id}/water-samples"
              payload: { collected_at: "2026-05-01T09:00:00Z", nitrate_mg_l: 10.0, coliform_present: false }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { ws2_id: $.data.id }
          assert:
            - "WaterSample.${ws1_id}.result == PASS"
            - "WaterSample.${ws1_id}.exceedance_reasons == []"
            - "Well.${w1_id}.advisory_status == CLEAR"
            - "WaterSample.${ws2_id}.result == EXCEEDANCE"
            - "WaterSample.${ws2_id}.exceedance_reasons == [NITRATE_MCL_EXCEEDED]"
            - "Well.${w2_id}.advisory_status == ADVISORY"
            - "Parcel.${p_id}.water_quality_flag == true"
            - "Parcel.${p_id}.risk_tier == ELEVATED"

      - name: setback_distance_exactly_equal_to_requirement_is_compliant_half_foot_short_is_not
        grounds:
          - calculations.well_setback_evaluation
          - entities.SystemDesign.fields.setback_status
          - entities.SystemDesign.fields.nearest_well_distance_ft
        distinguishing_aspect: |
          Boundary metric #2 — a separation distance in feet, reached through a DIFFERENT
          endpoint (POST /system-designs) than the nitrate boundary. The comparison is `>=`
          against required_setback_ft 100.0, so a drainfield exactly 100.00 ft from the well is
          COMPLIANT while one at 99.50 ft is VARIANCE_REQUIRED.
        test_recipe:
          setup:
            - "A parcel with one DOMESTIC well at (0,0) and an APPROVED LOAMY site evaluation, so no sandy surcharge applies and required_setback_ft for a CONVENTIONAL system is 100.0."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-BP2", county_code: "OR", site_address: "13 Separation Road", lot_size_sqft: 40000, water_source: "PRIVATE_WELL" }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { p_id: $.data.id }
            - call: "POST /wells"
              payload: { parcel_id: "${p_id}", well_type: "DOMESTIC", location_x_ft: 0, location_y_ft: 0, depth_ft: 120 }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { w_id: $.data.id }
            - call: "POST /site-evaluations"
              payload: { parcel_id: "${p_id}", evaluated_on: "2026-04-15T00:00:00Z", soil_group: "LOAMY", depth_to_limiting_layer_in: 48 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { se_id: $.data.id }
            - call: "POST /site-evaluations/${se_id}/perc-holes"
              payload: { hole_number: 1, drop_inches: 6, elapsed_minutes: 132, presoak_ok: true }
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/review"
              payload: { decision: "APPROVE", review_note: "Accepted" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
              captures: { se_v1: $.data.version }
          trigger:
            - call: "POST /system-designs"
              payload: { site_evaluation_id: "${se_id}", expected_site_evaluation_version: "${se_v1}", system_type: "CONVENTIONAL", bedrooms: 3, tank_capacity_gal: 1000, drainfield_x_ft: 100, drainfield_y_ft: 0 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { sd_exact_id: $.data.id }
            - call: "GET /site-evaluations/${se_id}"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { se_v2: $.data.version }
            - call: "POST /system-designs"
              payload: { site_evaluation_id: "${se_id}", expected_site_evaluation_version: "${se_v2}", system_type: "CONVENTIONAL", bedrooms: 3, tank_capacity_gal: 1000, drainfield_x_ft: 99.5, drainfield_y_ft: 0 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { sd_short_id: $.data.id }
          assert:
            - "SystemDesign.${sd_exact_id}.nearest_well_distance_ft == 100.0"
            - "SystemDesign.${sd_exact_id}.required_setback_ft == 100.0"
            - "SystemDesign.${sd_exact_id}.setback_status == COMPLIANT"
            - "SystemDesign.${sd_short_id}.nearest_well_distance_ft == 99.5"
            - "SystemDesign.${sd_short_id}.setback_status == VARIANCE_REQUIRED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: cover_inspection_pass_gated_on_contractor_effective_status_active
        grounds:
          - validations[priority=11]
          - errors[ERR_CONTRACTOR_NOT_ACTIVE]
          - calculations.contractor_effective_status
          - state_machines.Contractor.ACTIVE_to_SUSPENDED
          - state_machines.Inspection.SCHEDULED_to_PASSED
        distinguishing_aspect: |
          Entity pair Inspection -> Contractor: the Inspection's SCHEDULED_to_PASSED transition
          is legal on the Inspection's own axis, yet it is refused with ERR_CONTRACTOR_NOT_ACTIVE
          purely because the Contractor row named on the permit sits in SUSPENDED; reinstating
          the licence makes the identical request succeed.
        test_recipe:
          setup:
            - "A parcel with an APPROVED design, an ISSUED construction permit naming a DUAL-class contractor, and one COVER inspection in SCHEDULED (which moved the permit to UNDER_CONSTRUCTION)."
            - "The contractor licence has then been SUSPENDED by the HealthOfficer."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-CE1", county_code: "OR", site_address: "14 Licence Loop", lot_size_sqft: 40000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { p_id: $.data.id }
            - call: "POST /site-evaluations"
              payload: { parcel_id: "${p_id}", evaluated_on: "2026-04-15T00:00:00Z", soil_group: "LOAMY", depth_to_limiting_layer_in: 48 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { se_id: $.data.id }
            - call: "POST /site-evaluations/${se_id}/perc-holes"
              payload: { hole_number: 1, drop_inches: 6, elapsed_minutes: 132, presoak_ok: true }
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/review"
              payload: { decision: "APPROVE", review_note: "Accepted" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
              captures: { se_v: $.data.version }
            - call: "POST /system-designs"
              payload: { site_evaluation_id: "${se_id}", expected_site_evaluation_version: "${se_v}", system_type: "CONVENTIONAL", bedrooms: 3, tank_capacity_gal: 1000, drainfield_x_ft: 150, drainfield_y_ft: 0 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { sd_id: $.data.id }
            - call: "POST /system-designs/${sd_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /system-designs/${sd_id}/review"
              payload: { decision: "APPROVE" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
            - call: "POST /contractors"
              payload: { business_name: "Cascade Septic", license_number: "LIC-0856-I", license_class: "DUAL", license_expires_on: "2035-01-01T00:00:00Z", bond_amount_cents: 5000000 }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { c_id: $.data.id }
            - call: "POST /construction-permits"
              payload: { system_design_id: "${sd_id}", contractor_id: "${c_id}", valid_from: "2026-05-01T00:00:00Z", valid_until: "2027-05-01T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { cp_id: $.data.id }
            - call: "POST /inspections"
              payload: { construction_permit_id: "${cp_id}", inspection_type: "COVER", scheduled_start: "2026-05-01T09:00:00Z", scheduled_end: "2026-05-01T10:00:00Z" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { i1_id: $.data.id }
            - call: "POST /contractors/${c_id}/license-status"
              payload: { action: "SUSPEND" }
              as: HealthOfficer
              as_user_id: "u-ho-1"
          trigger:
            - call: "POST /inspections/${i1_id}/result"
              payload: { result: "PASS" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { err: $.data.error_id }
            - call: "POST /contractors/${c_id}/license-status"
              payload: { action: "REINSTATE" }
              as: HealthOfficer
              as_user_id: "u-ho-1"
            - call: "POST /inspections/${i1_id}/result"
              payload: { result: "PASS" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
          assert:
            - "${err} == ERR_CONTRACTOR_NOT_ACTIVE with HTTP 409"
            - "after the first trigger call Inspection.${i1_id}.status == SCHEDULED and ConstructionPermit.${cp_id}.status == UNDER_CONSTRUCTION"
            - "after the REINSTATE, Contractor.${c_id}.status == ACTIVE and Contractor.${c_id}.effective_status == ACTIVE"
            - "after the third trigger call Inspection.${i1_id}.status == PASSED"
            - "ConstructionPermit.${cp_id}.status == COVER_PASSED"
            - "ConstructionPermit.${cp_id}.cover_inspection_passed_at == 2026-05-01T00:00:00.000Z"

      - name: transfer_certification_gated_on_operating_permit_status_active
        grounds:
          - validations[priority=11]
          - errors[ERR_OPERATING_PERMIT_NOT_ACTIVE]
          - state_machines.OperatingPermit.ACTIVE_to_EXPIRED
          - state_machines.TransferInspection.REQUESTED_to_CERTIFIED
        distinguishing_aspect: |
          A DIFFERENT entity pair from the inspection/contractor instance: TransferInspection ->
          OperatingPermit. The TransferInspection is still in REQUESTED (the EXPIRED transition
          does not block it, unlike SUSPEND), yet certification is refused with
          ERR_OPERATING_PERMIT_NOT_ACTIVE solely because the operating permit lapsed when the
          logical clock passed its expires_on of 2031-05-01T00:00:00.000Z.
        test_recipe:
          setup:
            - "A fully permitted parcel whose OperatingPermit was issued at 2026-05-01T00:00:00.000Z and therefore expires_on 2031-05-01T00:00:00.000Z."
            - "The 73018-cent permit fee has been paid so fee_balance_cents is 0 and transfer_hold is false."
            - "One TransferInspection in REQUESTED (DESK_REVIEW) was created before the clock moved."
            - "The logical clock has then been advanced to 2031-06-01T00:00:00Z, expiring the operating permit."
