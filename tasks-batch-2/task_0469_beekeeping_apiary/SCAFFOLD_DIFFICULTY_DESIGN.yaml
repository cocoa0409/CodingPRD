              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H2", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h2_id: $.data.id }
            - call: "POST /hives/${h2_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H3", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h3_id: $.data.id }
            - call: "POST /hives/${h3_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /pollination-contracts"
              payload: { grower_name: "Almond Co", orchard_state_code: "CA", bloom_start: "2026-02-04T00:00:00Z", bloom_end: "2026-03-06T00:00:00Z", required_strong_hives: 2, max_hives_on_site: 2, base_rate_cents: 20000 }
              as: ContractCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /pollination-contracts/${c1_id}/sign"
              payload: {}
              as: ContractCoordinator
              captures: { c1_v0: $.data.version }
            - call: "POST /pollination-contracts/${c1_id}/placements"
              payload: { hive_id: "${h1_id}", placement_start: "2026-02-04T00:00:00Z", removal_due: "2026-03-06T00:00:00Z" }
              as: ContractCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /hive-placements/${p1_id}/confirm"
              payload: { expected_contract_version: "${c1_v0}" }
              as: ContractCoordinator
              captures: { c1_v1: $.data.version }
            - call: "POST /pollination-contracts/${c1_id}/placements"
              payload: { hive_id: "${h2_id}", placement_start: "2026-02-04T00:00:00Z", removal_due: "2026-03-06T00:00:00Z" }
              as: ContractCoordinator
