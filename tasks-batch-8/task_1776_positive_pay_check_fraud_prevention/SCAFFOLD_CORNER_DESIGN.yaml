  - section: consistency_model
    instances:
      - name: immediate_read_after_decision_write
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "The decision response itself carries the terminal state, and an immediate re-read shows identical values — no lag, no reconciliation delay."
        test_recipe:
          setup: ["ACTIVE REVERSE-tier enrollment with one OPEN exception"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "ImmCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "860011" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 100, payee_name_raw: "A", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex: $.data.exception_id } }
          trigger:
            - { call: "POST /treasury/exceptions/${ex}/decision", payload: { decision: "RETURN" }, as: CustomerDecisionMaker, as_user_id: "${dm}", captures: { st: $.data.status, lb: $.data.liability_party } }
            - { call: "GET /treasury/exceptions/${ex}", payload: {}, as: BankOps, captures: { st2: $.data.status, lb2: $.data.liability_party } }
          assert:
            - "Write response: st == DECISIONED_RETURN, lb == NONE"
            - "Immediate read: st2 == DECISIONED_RETURN, lb2 == NONE"
