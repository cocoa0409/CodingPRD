# =============================================================================
# SCAFFOLD — Craft-Fair & Maker-Market Organizer (task 997)
# Harder-than-expert calibration: tight coupling, dual-variant calcs on two
# different domains, two independent overlap semantics, posture-driven gating,
# segregation of duties between jury and coordinator roles, and a compensating
# settlement ledger where forward + compensating actions must leave named
# conserved quantities unchanged.
# =============================================================================

scenario: |
  997. Craft-Fair & Maker-Market Organizer: event & booth map, vendor
  application & jury/category-cap, booth fee & tiers, load-in/out & schedule,
  sales/attendance & commission, marketing & ticket, weather/cancellation,
  vendor settlement

domain_name: craft-fair-maker-market
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope — FIXED block, emit verbatim
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MakerEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display name of the craft fair" }
      - { name: opens_at, type: datetime, source: input, description: "Public doors-open instant (UTC)" }
      - { name: closes_at, type: datetime, source: input, description: "Public doors-close instant (UTC)" }
      - { name: venue_capacity, type: integer, source: input, description: "Hard cap on simultaneous on-site attendees for the whole venue" }
      - { name: posture, type: enum, source: computed, description: "PLANNING | APPLICATION_OPEN | JURY_REVIEW | SCHEDULING | LIVE | WEATHER_HOLD | SETTLEMENT | CLOSED | CANCELLED — derived; drives gating for every child write" }
      - { name: weather_flag, type: enum, source: input, default: CLEAR, description: "CLEAR | ADVISORY | SEVERE — SEVERE auto-transitions posture to WEATHER_HOLD" }
      - { name: application_window_start, type: datetime, source: input, description: "Vendor applications accepted from this instant (inclusive)" }
      - { name: application_window_end, type: datetime, source: input, description: "Vendor applications accepted until this instant (exclusive)" }
      - { name: jury_quorum, type: integer, source: input, description: "Minimum distinct Juror scores required before an application may be decided" }
      - { name: commission_pct_standard, type: number, source: input, description: "Standard commission percent charged on settled vendor gross sales (0–25)" }
      - { name: commission_pct_anchor, type: number, source: input, description: "Reduced commission percent for ANCHOR-tier booths (0–25)" }

  - name: BoothZone
    parent: MakerEvent
    common_fields: true
    fields:
      - { name: maker_event_id, type: string, source: system, description: "FK -> MakerEvent.id; owning event" }
      - { name: label, type: string, source: input, description: "Zone label (e.g. 'North Lawn', 'Pavilion')" }
      - { name: weather_exposure, type: enum, source: input, description: "INDOOR | COVERED | OPEN_AIR — drives weather-cancellation cascade granularity" }
      - { name: category, type: enum, source: input, description: "CERAMICS | TEXTILES | JEWELRY | WOODWORK | FOOD | MIXED — used for per-category caps" }
      - { name: category_cap, type: integer, source: input, description: "Maximum simultaneously-APPROVED applications for this zone's category across the entire event" }

  - name: Booth
    parent: BoothZone
    common_fields: true
    fields:
      - { name: booth_zone_id, type: string, source: system, description: "FK -> BoothZone.id; owning zone" }
      - { name: code, type: string, source: input, description: "Human-readable booth code (e.g. 'NL-014')" }
      - { name: tier, type: enum, source: input, description: "STANDARD | CORNER | ANCHOR — drives fee tier & commission_pct lookup" }
      - { name: footprint_sqm, type: integer, source: input, description: "Floor area; ANCHOR booths must be >= 20 sqm" }
      - { name: price_cents, type: integer, source: input, description: "Base booth fee for the event, before tier multiplier" }
      - { name: assigned_application_id, type: string, source: system, description: "FK -> VendorApplication.id; nullable, set when a BoothAssignment is ACTIVE" }

  - name: VendorProfile
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Vendor trading name" }
      - { name: contact_email, type: string, source: input, description: "Unique contact email; uniqueness enforced across all vendors" }
      - { name: home_region, type: string, source: input, description: "Two-letter region code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED vendors cannot submit new applications nor have existing assignments confirmed" }

  - name: VendorApplication
    parent: MakerEvent
    common_fields: true
    fields:
      - { name: maker_event_id, type: string, source: system, description: "FK -> MakerEvent.id; event applied to" }
      - { name: vendor_profile_id, type: string, source: system, description: "FK -> VendorProfile.id; applicant" }
      - { name: requested_category, type: enum, source: input, description: "CERAMICS | TEXTILES | JEWELRY | WOODWORK | FOOD | MIXED" }
      - { name: requested_tier, type: enum, source: input, description: "STANDARD | CORNER | ANCHOR" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | IN_REVIEW | APPROVED | WAITLISTED | REJECTED | WITHDRAWN | CONFIRMED | CANCELLED" }
      - { name: jury_score_total, type: integer, source: computed, description: "Sum of distinct-juror scorecards for this application" }
      - { name: jury_score_count, type: integer, source: computed, description: "Number of distinct-juror scorecards submitted" }
      - { name: waitlist_rank, type: integer, source: computed, description: "1-based position on the waitlist; null unless status == WAITLISTED" }

  - name: JuryScore
    parent: VendorApplication
    common_fields: false
    fields:
      - { name: vendor_application_id, type: string, source: system, description: "FK -> VendorApplication.id; application being scored" }
      - { name: juror_user_id, type: string, source: system, description: "Opaque user id of the juror (must differ from applicant's vendor user id AND from any coordinator who created the event — segregation of duties)" }
      - { name: craftsmanship, type: integer, source: input, description: "0–10" }
      - { name: originality, type: integer, source: input, description: "0–10" }
      - { name: booth_presentation, type: integer, source: input, description: "0–10" }
      - { name: total, type: integer, source: computed, description: "craftsmanship + originality + booth_presentation (0–30)" }

  - name: BoothAssignment
    parent: VendorApplication
    common_fields: true
    fields:
      - { name: vendor_application_id, type: string, source: system, description: "FK -> VendorApplication.id; the approved application being placed" }
      - { name: booth_id, type: string, source: system, description: "FK -> Booth.id; the booth granted" }
      - { name: status, type: enum, source: system, description: "PENDING_PAYMENT | ACTIVE | RELEASED | FORFEITED" }
      - { name: assigned_at, type: datetime, source: system, description: "When the assignment was created" }
      - { name: payment_due_at, type: datetime, source: system, description: "assigned_at + 72h; auto-FORFEIT when clock passes" }
      - { name: expected_event_version, type: integer, source: system, description: "MakerEvent.version snapshot at assignment creation; stale-version OCC anchor for booth-grant endpoint" }

  - name: BoothFeeCharge
    parent: BoothAssignment
    common_fields: true
    fields:
      - { name: booth_assignment_id, type: string, source: system, description: "FK -> BoothAssignment.id; owning assignment" }
      - { name: charge_kind, type: enum, source: system, description: "PROVISIONAL | FINAL | SURCHARGE | REFUND — dual-variant pair PROVISIONAL/FINAL" }
      - { name: amount_cents, type: integer, source: computed, description: "Computed per booth_fee_quote (PROVISIONAL) or booth_fee_final (FINAL); sign convention: positive=charge, negative=refund" }
      - { name: computed_at, type: datetime, source: system, description: "When this charge row was minted" }
      - { name: rounding_trace, type: string, source: system, description: "Audit string pinning which rounding branch fired (e.g. 'per_line_then_sum' or 'sum_then_round')" }

  - name: LoadInSlot
    parent: MakerEvent
    common_fields: true
    fields:
      - { name: maker_event_id, type: string, source: system, description: "FK -> MakerEvent.id; owning event" }
      - { name: booth_assignment_id, type: string, source: system, description: "FK -> BoothAssignment.id; assignment reserving the slot" }
      - { name: kind, type: enum, source: input, description: "LOAD_IN | LOAD_OUT" }
      - { name: starts_at, type: datetime, source: input, description: "Slot start (UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Slot end (UTC); half-open [starts_at, ends_at)" }
      - { name: bay, type: enum, source: input, description: "NORTH | SOUTH — only one slot per bay at any instant per adjacency rule" }

  - name: Ticket
    parent: MakerEvent
    common_fields: true
    fields:
      - { name: maker_event_id, type: string, source: system, description: "FK -> MakerEvent.id; owning event" }
      - { name: purchaser_email, type: string, source: input, description: "Buyer email; not unique" }
      - { name: kind, type: enum, source: input, description: "GA | EARLY_BIRD | VIP — VIP includes early entry and counts double against attendance occupancy projection" }
      - { name: price_cents, type: integer, source: input, description: "Face value paid" }
      - { name: state, type: enum, source: system, description: "ISSUED | REDEEMED | REFUNDED | VOIDED" }
      - { name: redeemed_at, type: datetime, source: system, description: "When the ticket was scanned at the gate; null until REDEEMED" }

  - name: Attendance
    parent: MakerEvent
    common_fields: false
    fields:
      - { name: maker_event_id, type: string, source: system, description: "FK -> MakerEvent.id; owning event" }
      - { name: ticket_id, type: string, source: system, description: "FK -> Ticket.id; ticket scanned" }
      - { name: entered_at, type: datetime, source: system, description: "Gate scan instant" }
      - { name: exited_at, type: datetime, source: system, description: "Gate exit scan instant; null while on-site" }

  - name: SalesLedgerEntry
    parent: MakerEvent
    common_fields: false
    fields:
      - { name: maker_event_id, type: string, source: system, description: "FK -> MakerEvent.id; owning event" }
      - { name: booth_assignment_id, type: string, source: system, description: "FK -> BoothAssignment.id; the vendor assignment making the sale" }
      - { name: gross_cents, type: integer, source: input, description: "Gross sale amount (positive) or refund (negative) recorded at the booth" }
      - { name: recorded_at, type: datetime, source: system, description: "When the entry was posted" }
      - { name: reversal_of_entry_id, type: string, source: system, description: "FK -> SalesLedgerEntry.id; nullable; when set, this entry is a compensation row" }

  - name: Settlement
    parent: BoothAssignment
    common_fields: true
    fields:
      - { name: booth_assignment_id, type: string, source: system, description: "FK -> BoothAssignment.id; assignment being settled" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPUTED | APPROVED | PAID | DISPUTED | CANCELLED" }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Sum of SalesLedgerEntry.gross_cents (compensations included) for the assignment" }
      - { name: commission_cents, type: integer, source: computed, description: "Commission owed to organizer per commission_quote; dual-variant against commission_final" }
      - { name: net_payout_cents, type: integer, source: computed, description: "gross_sales_cents - commission_cents - outstanding_booth_fee_cents" }
      - { name: approved_by_user_id, type: string, source: system, description: "Treasurer user id who approved; MUST differ from the coordinator who created the MakerEvent (segregation of duties)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MakerEvent
    initial_state: PLANNING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNING
        to: APPLICATION_OPEN
        trigger: "POST /maker-events/{event_id}/open-applications"
        actor: EventCoordinator
        preconditions:
          - "event.clock_now >= application_window_start"
          - "jury_quorum >= 2"
        side_effects: []

      - from: APPLICATION_OPEN
        to: JURY_REVIEW
        trigger: "POST /maker-events/{event_id}/close-applications OR system auto-transition when clock_now >= application_window_end"
        actor: EventCoordinator
        preconditions:
          - "clock_now >= application_window_end OR manual override"
        side_effects:
          - "All DRAFT applications -> WITHDRAWN"
          - "All SUBMITTED applications -> IN_REVIEW"

      - from: JURY_REVIEW
        to: SCHEDULING
        trigger: "POST /maker-events/{event_id}/begin-scheduling"
        actor: EventCoordinator
        preconditions:
          - "No SUBMITTED application remains; every application is in {APPROVED, WAITLISTED, REJECTED, WITHDRAWN}"
          - "jury_score_count >= jury_quorum for every APPROVED application"
        side_effects:
          - "Waitlist ranking materialized: rank by (jury_score_total DESC, application created_at ASC) among WAITLISTED; rank 1 = head"

      - from: SCHEDULING
        to: LIVE
        trigger: "POST /maker-events/{event_id}/go-live"
        actor: EventCoordinator
        preconditions:
          - "At least one BoothAssignment in ACTIVE state"
          - "All BoothAssignments in PENDING_PAYMENT have payment_due_at > clock_now"
        side_effects:
          - "Tickets become redeemable at gate"

      - from: LIVE
        to: SETTLEMENT
        trigger: "POST /maker-events/{event_id}/end-event"
        actor: EventCoordinator
        preconditions:
          - "clock_now >= closes_at"
          - "No Attendance row with exited_at null"
        side_effects:
          - "One Settlement(status=PENDING) is synthesized per BoothAssignment in {ACTIVE} state"
          - "PROVISIONAL BoothFeeCharge rows for those assignments are frozen and paired with FINAL recomputation at Settlement COMPUTED time"

      - from: LIVE
        to: WEATHER_HOLD
        trigger: "POST /maker-events/{event_id}/weather  with weather_flag=SEVERE"
        actor: EventCoordinator
        preconditions: []
        side_effects:
          - "Ticket redemption suspended"
          - "OPEN_AIR BoothZones cascade: every BoothAssignment in such a zone whose status==ACTIVE -> FORFEITED"
          - "FORFEITED assignments release their Booth (assigned_application_id cleared)"
          - "FORFEITED assignments trigger BoothFeeCharge REFUND rows per weather_refund_policy"

      - from: WEATHER_HOLD
        to: LIVE
        trigger: "POST /maker-events/{event_id}/weather with weather_flag=CLEAR"
        actor: EventCoordinator
        preconditions:
          - "clock_now < closes_at"
        side_effects: []

      - from: WEATHER_HOLD
        to: CANCELLED
        trigger: "POST /maker-events/{event_id}/cancel"
        actor: EventCoordinator
        preconditions: []
        side_effects:
          - "Every Ticket in {ISSUED, REDEEMED} -> REFUNDED (full face value)"
          - "Every BoothAssignment in {PENDING_PAYMENT, ACTIVE} -> FORFEITED"
          - "Every Settlement in {PENDING, COMPUTED} -> CANCELLED"
          - "Every LoadInSlot is deleted (cascade-down)"

      - from: SETTLEMENT
        to: CLOSED
        trigger: "POST /maker-events/{event_id}/close-event"
        actor: EventCoordinator
        preconditions:
          - "No Settlement in {PENDING, COMPUTED, DISPUTED} — every settlement must be APPROVED or PAID"
        side_effects: []

      - from: [PLANNING, APPLICATION_OPEN, JURY_REVIEW, SCHEDULING]
        to: CANCELLED
        trigger: "POST /maker-events/{event_id}/cancel"
        actor: EventCoordinator
        preconditions: []
        side_effects:
          - "All Tickets -> VOIDED"
          - "All VendorApplications in non-terminal states -> WITHDRAWN"
          - "All BoothAssignments -> RELEASED"

  - entity: VendorApplication
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, CANCELLED, CONFIRMED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /maker-events/{event_id}/applications/{app_id}/submit"
        actor: Vendor
        preconditions:
          - "MakerEvent.posture == APPLICATION_OPEN"
          - "application_window_start <= clock_now < application_window_end"
          - "VendorProfile.status == ACTIVE"
          - "requested_category category_cap not yet exhausted by APPROVED applications"
        side_effects: []

      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "system (on MakerEvent.APPLICATION_OPEN -> JURY_REVIEW)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /maker-events/{event_id}/applications/{app_id}/decide with outcome=APPROVE"
        actor: EventCoordinator
        preconditions:
          - "jury_score_count >= MakerEvent.jury_quorum"
          - "Approving does NOT push the requested_category's APPROVED count above its zone category_cap"
          - "MakerEvent.posture == JURY_REVIEW"
        side_effects:
          - "A BoothAssignment(status=PENDING_PAYMENT) is auto-created against a Booth matching (requested_category, requested_tier), selected by selector: lowest-priced matching unoccupied booth, tie-break Booth.code ASC, then Booth.created_at ASC"
          - "PROVISIONAL BoothFeeCharge minted using booth_fee_quote (per-line rounding)"

      - from: IN_REVIEW
        to: WAITLISTED
        trigger: "POST /maker-events/{event_id}/applications/{app_id}/decide with outcome=WAITLIST"
        actor: EventCoordinator
        preconditions:
          - "jury_score_count >= MakerEvent.jury_quorum"
          - "MakerEvent.posture == JURY_REVIEW"
        side_effects:
          - "waitlist_rank computed later at SCHEDULING entry"

      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /maker-events/{event_id}/applications/{app_id}/decide with outcome=REJECT"
        actor: EventCoordinator
        preconditions:
          - "jury_score_count >= MakerEvent.jury_quorum"
          - "MakerEvent.posture == JURY_REVIEW"
        side_effects: []

      - from: WAITLISTED
        to: APPROVED
        trigger: "system (promotion when a BoothAssignment forfeits or a category_cap slot frees up)"
        actor: system
        preconditions:
          - "Applicant is at head of waitlist for its requested_category (lowest waitlist_rank)"
          - "Category cap has spare capacity"
          - "A Booth matching (requested_category, requested_tier) is unoccupied"
        side_effects:
          - "Same side effects as IN_REVIEW -> APPROVED (assignment + PROVISIONAL charge minted)"

      - from: APPROVED
        to: CONFIRMED
        trigger: "POST /maker-events/{event_id}/assignments/{assignment_id}/confirm"
        actor: Vendor
        preconditions:
          - "BoothAssignment.status == ACTIVE (payment completed)"
          - "MakerEvent.posture in {SCHEDULING, LIVE, WEATHER_HOLD}"
        side_effects: []

      - from: [DRAFT, SUBMITTED, IN_REVIEW, WAITLISTED, APPROVED]
        to: WITHDRAWN
        trigger: "POST /maker-events/{event_id}/applications/{app_id}/withdraw"
        actor: Vendor
        preconditions: []
        side_effects:
          - "If APPROVED and a BoothAssignment exists, assignment -> FORFEITED with REFUND per policy"
          - "Category cap slot released (recomputed, not stored)"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /maker-events/{event_id}/applications/{app_id}/revoke"
        actor: EventCoordinator
        preconditions:
          - "MakerEvent.posture in {JURY_REVIEW, SCHEDULING}"
        side_effects:
          - "Existing BoothAssignment -> FORFEITED; REFUND charge minted"
          - "Triggers waitlist promotion scan"

  - entity: BoothAssignment
    initial_state: PENDING_PAYMENT
    terminal_states: [RELEASED, FORFEITED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /maker-events/{event_id}/assignments/{assignment_id}/pay"
        actor: Vendor
        preconditions:
          - "clock_now <= payment_due_at"
          - "MakerEvent.posture in {SCHEDULING, LIVE, WEATHER_HOLD}"
        side_effects:
          - "FINAL BoothFeeCharge minted (booth_fee_final, sum-then-round); PROVISIONAL row kept for audit"
          - "Booth.assigned_application_id = application.id"

      - from: PENDING_PAYMENT
        to: FORFEITED
        trigger: "system (clock passes payment_due_at) OR POST .../assignments/{id}/forfeit"
        actor: system
        preconditions: []
        side_effects:
          - "REFUND charge of any paid amount (zero if none)"
          - "Waitlist promotion scan runs against this (category, tier)"
          - "Booth.assigned_application_id cleared"

      - from: ACTIVE
        to: FORFEITED
        trigger: "POST .../assignments/{id}/forfeit OR weather cascade OR MakerEvent cancel cascade"
        actor: "EventCoordinator | system"
        preconditions: []
        side_effects:
          - "REFUND charge per refund_policy"
          - "Booth.assigned_application_id cleared"
          - "Settlement, if any, -> CANCELLED"
          - "Waitlist promotion scan runs"

      - from: PENDING_PAYMENT
        to: RELEASED
        trigger: "POST /maker-events/{event_id}/assignments/{assignment_id}/release"
        actor: EventCoordinator
        preconditions:
          - "MakerEvent.posture == SCHEDULING"
        side_effects:
          - "No refund owed (nothing paid)"
          - "Waitlist promotion scan runs"

  - entity: Settlement
    initial_state: PENDING
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: PENDING
        to: COMPUTED
        trigger: "POST /maker-events/{event_id}/settlements/{settlement_id}/compute"
        actor: Treasurer
        preconditions:
          - "MakerEvent.posture == SETTLEMENT"
        side_effects:
          - "gross_sales_cents computed via settlement_gross_quote (chronological, compensation-aware)"
          - "commission_cents computed via commission_quote (tiered + tier override for ANCHOR)"
          - "net_payout_cents computed"

      - from: COMPUTED
        to: APPROVED
        trigger: "POST /maker-events/{event_id}/settlements/{settlement_id}/approve"
        actor: Treasurer
        preconditions:
          - "approved_by_user_id (X-User-ID) MUST differ from the EventCoordinator user id who created the MakerEvent (segregation of duties)"
        side_effects: []

      - from: COMPUTED
        to: DISPUTED
        trigger: "POST /maker-events/{event_id}/settlements/{settlement_id}/dispute"
        actor: Vendor
        preconditions:
          - "Vendor owns the underlying VendorApplication (X-User-ID == VendorProfile.id backing that application)"
        side_effects: []

      - from: DISPUTED
        to: COMPUTED
        trigger: "POST /maker-events/{event_id}/settlements/{settlement_id}/compute (recompute)"
        actor: Treasurer
        preconditions: []
        side_effects:
          - "Fields recomputed; cyclic loop DISPUTED -> COMPUTED is permitted indefinitely"

      - from: APPROVED
        to: PAID
        trigger: "POST /maker-events/{event_id}/settlements/{settlement_id}/mark-paid"
        actor: Treasurer
        preconditions: []
        side_effects: []

      - from: [PENDING, COMPUTED]
        to: CANCELLED
        trigger: "system (weather/cancel cascade) OR POST .../settlements/{id}/cancel"
        actor: "system | Treasurer"
        preconditions: []
        side_effects: []

  - entity: Ticket
    initial_state: ISSUED
    terminal_states: [REFUNDED, VOIDED, REDEEMED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /maker-events/{event_id}/tickets/{ticket_id}/redeem"
        actor: GateAgent
        preconditions:
          - "MakerEvent.posture == LIVE"
          - "weather_flag != SEVERE"
          - "Current on-site attendance count < venue_capacity (>= venue_capacity rejects with ERR_VENUE_AT_CAPACITY)"
          - "VIP tickets double-count against capacity"
        side_effects:
          - "Attendance row appended with entered_at=clock_now, exited_at=null"

      - from: REDEEMED
        to: REFUNDED
        trigger: "POST /maker-events/{event_id}/tickets/{ticket_id}/refund (only allowed if Attendance.exited_at != null AND reason == EVENT_CANCELLED)"
        actor: EventCoordinator
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: REFUNDED
        trigger: "POST /maker-events/{event_id}/tickets/{ticket_id}/refund"
        actor: EventCoordinator
        preconditions:
          - "MakerEvent.posture in {PLANNING, APPLICATION_OPEN, JURY_REVIEW, SCHEDULING, WEATHER_HOLD} OR reason == EVENT_CANCELLED"
        side_effects: []

      - from: ISSUED
        to: VOIDED
        trigger: "system (MakerEvent cancel cascade from pre-LIVE postures)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true OCC races only)
# =============================================================================
concurrency_rules:
  - rule_id: booth-grant-stale-event
    parent_entity: MakerEvent
    write_endpoint: "POST /maker-events/{event_id}/applications/{app_id}/decide"
    occ_field: expected_event_version
    description: |
      Approving an application auto-grants a Booth chosen by the selector at
      decision time. If the MakerEvent's `version` has advanced since the
      coordinator last observed it — e.g., another coordinator just approved a
      different application which consumed the lowest-priced booth — the
      selector output this writer relied on is stale. The server rejects with
      ERR_STALE_VERSION; the writer MUST re-read the event (and booth pool)
      and retry against the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settlement-approve-stale-settlement
    parent_entity: Settlement
    write_endpoint: "POST /maker-events/{event_id}/settlements/{settlement_id}/approve"
    occ_field: expected_settlement_version
    description: |
      Approving a Settlement whose `version` has advanced since the treasurer
      last observed it — e.g., a recompute just replaced gross_sales_cents and
      commission_cents in response to a dispute — is rejected with
      ERR_STALE_VERSION. The treasurer MUST re-read the settlement before
      approving; an approve against a stale snapshot would silently bless a
      figure the treasurer never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---------- Rule 1 instance A: dual-variant on VendorApplication/Booth domain
  - name: booth_fee_quote
    trigger: "BoothAssignment creation (PROVISIONAL charge) and any GET /assignments/{id}/quote"
    algorithm: tiered_pricing
    formula: |
      # Variant A: PROVISIONAL — per-line rounding (round each component to cents, then sum)
      base = Booth.price_cents
      tier_mult = { STANDARD: 1.00, CORNER: 1.25, ANCHOR: 1.60 }[Booth.tier]
      category_uplift_pct = { FOOD: 0.10, MIXED: 0.05, else: 0.00 }[BoothZone.category]
      per_line_components = [
          round_half_up(base * tier_mult),
          round_half_up(base * category_uplift_pct),
      ]
      provisional_cents = sum(per_line_components)
    constants:
      TIER_MULT_STANDARD: 1.00
      TIER_MULT_CORNER: 1.25
      TIER_MULT_ANCHOR: 1.60
      UPLIFT_FOOD: 0.10
      UPLIFT_MIXED: 0.05
    precision: "0 decimal places (integer cents), round_half_up per component"
    variants:
      - name: provisional
        when: "Quoted at decision/grant time before payment"
        difference: "Rounds each component (tier, uplift) to integer cents BEFORE summing"

  - name: booth_fee_final
    trigger: "BoothAssignment PENDING_PAYMENT -> ACTIVE on /pay"
    algorithm: tiered_pricing
    formula: |
      # Variant B: FINAL — sum-then-round (sum exact components, round once)
      base = Booth.price_cents
      tier_mult = { STANDARD: 1.00, CORNER: 1.25, ANCHOR: 1.60 }[Booth.tier]
      category_uplift_pct = { FOOD: 0.10, MIXED: 0.05, else: 0.00 }[BoothZone.category]
      exact_total = base * tier_mult + base * category_uplift_pct
      final_cents = round_half_up(exact_total)
    precision: "0 decimal places (integer cents), round_half_up at the end"
    variants:
      - name: final
        when: "Charged at payment time"
        difference: "Rounds once on the exact total; may differ from PROVISIONAL by +/-1 cent on tie values"
    note: "Dual-variant pair with booth_fee_quote — same inputs, intentionally different cents for specific base values (e.g. base=12345, tier=CORNER, category=FOOD)"

  # ---------- Rule 1 instance B: dual-variant on Settlement/Sales domain
  - name: commission_quote
    trigger: "Settlement PENDING -> COMPUTED"
    algorithm: tiered_pricing
    formula: |
      # Variant A: PROVISIONAL commission — chronological tiering by cumulative gross
      # Walk SalesLedgerEntry rows in (recorded_at ASC, created_at ASC) order,
      # applying tiered commission per row using the cumulative gross tier.
      rows = SalesLedgerEntry where booth_assignment_id = assignment.id
           AND reversal_of_entry_id IS NULL
           ORDER BY recorded_at ASC, created_at ASC
      cum = 0
      commission_cents = 0
      for r in rows:
        gross = r.gross_cents
        # determine tier from cumulative gross BEFORE this row
        pct = commission_pct_anchor if Booth.tier == ANCHOR else commission_pct_standard
        # tier bump: if cum + gross crosses 100_000 cents, portion above bump gets +2%
        threshold = 100_000
        if cum < threshold and cum + gross > threshold:
          below = threshold - cum
          above = gross - below
          commission_cents += round_half_up(below * pct) + round_half_up(above * (pct + 0.02))
        else:
          effective_pct = pct if cum + gross <= threshold else (pct + 0.02)
          commission_cents += round_half_up(gross * effective_pct)
        cum += gross
      # Compensations (reversals) subtract against the tier they originally hit.
    precision: "0 decimal places, round_half_up per row"
    variants:
      - name: provisional
        when: "Used at Settlement COMPUTED time before dispute resolution"
        difference: "Per-row rounding with cumulative-tier selection — order matters"

  - name: commission_final
    trigger: "Settlement APPROVED -> PAID (re-quoted at mark-paid to lock audit figure)"
    algorithm: aggregation
    formula: |
      # Variant B: FINAL commission — aggregate-then-tier on the whole period
      gross_total = sum of SalesLedgerEntry.gross_cents (compensations netted)
      pct_base = commission_pct_anchor if Booth.tier == ANCHOR else commission_pct_standard
      if gross_total > 100_000:
        commission_cents = round_half_up(100_000 * pct_base) + round_half_up((gross_total - 100_000) * (pct_base + 0.02))
      else:
        commission_cents = round_half_up(gross_total * pct_base)
    precision: "0 decimal places, round_half_up once"
    variants:
      - name: final
        difference: "Single-rounding on aggregate; can diverge from commission_quote by several cents when many small rows straddle the 100_000 threshold"

  # ---------- Rule 2 (mode a): combinatorial formula with >=3 inputs, non-linear
  - name: waitlist_rank
    trigger: "MakerEvent JURY_REVIEW -> SCHEDULING"
    algorithm: weighted_scoring
    formula: |
      candidates = VendorApplication where maker_event_id = event.id
                   AND status == WAITLISTED
                   AND requested_category == C
      sort_key = (jury_score_total DESC, created_at ASC, vendor_profile_id ASC)
      # vendor_profile_id is a UUID — used only as a last-resort tiebreak; never in business
      # decisions elsewhere. Two apps with equal jury_score_total and equal created_at are
      # broken by lexicographic vendor_profile_id ASC for determinism only.
      assign waitlist_rank = 1..N in sort_key order, per requested_category independently
    note: "Combinatorial mode (a): 3 inputs, two non-linear interactions (sort by score, then by time, then by uuid)"

  # ---------- Rule 2 (mode b): nested rounding (order matters)
  # Already covered by booth_fee_quote (per-line) vs booth_fee_final (sum-then-round).
  # Declared explicitly so §1.8 can ground both ends of the pair.
  - name: booth_fee_rounding_order
    trigger: "documentation anchor for Rule 2 mode (b)"
    algorithm: tiered_pricing
    formula: |
      PINNED ORDER:
        PROVISIONAL = round_per_line_then_sum   (booth_fee_quote)
        FINAL       = sum_then_round_per_line   (booth_fee_final)
      Scaffold pins BOTH orders intentionally so the pair forms a dual-variant
      and the rounding order is explicit.
    precision: "0 decimal places, round_half_up"

  # ---------- Rule 2 (mode c): circular-looking dependency — pinned evaluation order
  - name: settlement_net_payout
    trigger: "Settlement COMPUTED"
    algorithm: constraint_propagation
    formula: |
      # Looks circular: net depends on commission, commission depends on tier,
      # tier depends on cumulative gross, gross is sum of sales rows.
      # Pinned evaluation order:
      #   1. gross_sales_cents      = settlement_gross_quote(...)
      #   2. commission_cents       = commission_quote(gross_sales_cents, Booth.tier, MakerEvent.commission_pcts)
      #   3. outstanding_booth_fee  = max(0, booth_fee_final - already_paid_booth_fee)
      #   4. net_payout_cents       = gross_sales_cents - commission_cents - outstanding_booth_fee
      # Any reordering produces different cents when the 100_000 tier straddle
      # or the per-line-vs-sum rounding gap matters.
      pass
    precision: "0 decimal places"

  - name: settlement_gross_quote
    trigger: "Settlement COMPUTED"
    algorithm: chronological
    formula: |
      # Chronological accumulator over SalesLedgerEntry with compensation semantics
      rows = SalesLedgerEntry where booth_assignment_id = assignment.id
             ORDER BY recorded_at ASC, created_at ASC
      gross_sales_cents = 0
      for r in rows:
        if r.reversal_of_entry_id IS NULL:
          gross_sales_cents += r.gross_cents
        else:
          # compensation row: gross_cents is expected to be the negative of the original
          gross_sales_cents += r.gross_cents  # signed addition
      # Floor: gross_sales_cents never below 0 (excess refunds are tracked separately)
      gross_sales_cents = max(0, gross_sales_cents)

  - name: occupancy_projection
    trigger: "Ticket REDEEM (gate) — checked synchronously"
    algorithm: aggregation
    formula: |
      onsite = count of Attendance where maker_event_id = event.id
               AND exited_at IS NULL
      vip_onsite = count of Attendance a join Ticket t on a.ticket_id = t.id
                   WHERE a.exited_at IS NULL AND t.kind == 'VIP'
      effective_occupancy = onsite + vip_onsite   # VIPs double-count
      admit if effective_occupancy < venue_capacity
      # Boundary: admits when effective_occupancy == venue_capacity - 1, rejects when >= venue_capacity
    precision: "integer"

  # ---------- Resource temporal overlap (Rule 8): two different interval semantics
  - name: load_in_slot_overlap_half_open
    trigger: "POST /maker-events/{event_id}/load-in-slots"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN [starts_at, ends_at) — adjacent slots ARE permitted
      # Two slots on the same bay conflict iff s1 < e2 AND s2 < e1
      conflicts = LoadInSlot where maker_event_id = event.id
                  AND bay == new.bay
                  AND kind == new.kind
                  AND NOT (new.ends_at <= existing.starts_at OR new.starts_at >= existing.ends_at)
      # Back-to-back slots (s2 == e1) do NOT conflict
      if any conflicts: reject ERR_SLOT_OVERLAP

  - name: booth_assignment_no_double_booking
    trigger: "BoothAssignment creation (system from decide) AND POST .../assignments/{id}/pay"
    algorithm: interval_merge
    formula: |
      # AGGREGATE-CAPACITY semantics: at most ONE BoothAssignment may be in
      # {PENDING_PAYMENT, ACTIVE} per Booth at any moment — a boolean occupancy,
      # not a time interval. Different from load_in_slot_overlap_half_open.
      conflicts = BoothAssignment where booth_id = target_booth.id
                  AND status IN {PENDING_PAYMENT, ACTIVE}
                  AND id != this_assignment.id
      if any conflicts: reject ERR_BOOTH_DOUBLE_BOOKED

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role authorized for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources exist (event, application, assignment, settlement, ticket, booth, zone)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "MakerEvent.posture permits the requested operation (gates every child write)"
    error_id: ERR_POSTURE_FORBIDS
    http_status: 409
    applies_to: "all child-write endpoints"

  - priority: 5
    category: state
    check: "Target child entity is in the correct state for this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: juror_user_id != vendor's user_id AND != event-creating coordinator; settlement approver != event-creating coordinator"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /jury-scores, POST /settlements/{id}/approve"

  - priority: 7
    category: business_safety
    check: "Jury quorum met before decide; each Juror may score each application at most once"
    error_id: ERR_JURY_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /applications/{id}/decide"

  - priority: 8
    category: business_constraint
    check: "Requested booth constraints: tier matches application.requested_tier; ANCHOR requires footprint_sqm >= 20"
    error_id: ERR_BOOTH_CONSTRAINT_VIOLATION
    http_status: 422
    applies_to: "POST /applications/{id}/decide (auto-grant), POST /booths"

  - priority: 9
    category: business_constraint
    check: "Category cap: approving this application does not push APPROVED count for requested_category above the maximum category_cap across zones with that category"
    error_id: ERR_CATEGORY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /applications/{id}/decide"

  - priority: 10
    category: business_temporal
    check: "Application submit window: application_window_start <= clock_now < application_window_end"
    error_id: ERR_APPLICATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 11
    category: business_temporal
    check: "LoadInSlot overlap (half-open) on same bay+kind"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /load-in-slots"

  - priority: 12
    category: business_temporal
    check: "Payment due: clock_now <= payment_due_at"
    error_id: ERR_PAYMENT_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /assignments/{id}/pay"

  - priority: 13
    category: business_fiscal
    check: "Venue capacity: effective_occupancy (with VIP double-count) < venue_capacity"
    error_id: ERR_VENUE_AT_CAPACITY
    http_status: 409
    applies_to: "POST /tickets/{id}/redeem"

  - priority: 14
    category: business_referential
    check: "Booth occupancy invariant: at most one non-terminal BoothAssignment per Booth"
    error_id: ERR_BOOTH_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /applications/{id}/decide, POST /assignments/{id}/pay"

  - priority: 15
    category: business_fiscal
    check: "OCC: expected_<parent>_version matches parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /applications/{id}/decide, POST /settlements/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Clock (test-driving) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-05-01T00:00:00Z (no wall-clock fallback)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["Triggers payment_due_at forfeit sweep and application-window auto-close"]

  # ---------- MakerEvent ----------
  - method: POST
    path: "/maker-events"
    description: "Create a MakerEvent"
    roles: [EventCoordinator]
    code: 201
    input: [name, opens_at, closes_at, venue_capacity, application_window_start, application_window_end, jury_quorum, commission_pct_standard, commission_pct_anchor, "weather_flag?"]
    output: MakerEvent
    side_effects: ["posture=PLANNING"]

  - method: GET
    path: "/maker-events"
    description: "List MakerEvents"
    roles: [EventCoordinator, Treasurer, Vendor, Juror, GateAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "MakerEvent[]"
    side_effects: []

  - method: GET
    path: "/maker-events/{event_id}"
    description: "Read one MakerEvent"
    roles: [EventCoordinator, Treasurer, Vendor, Juror, GateAgent, PlatformAdmin]
    code: 200
    input: []
    output: MakerEvent
    side_effects: []

  - method: POST
    path: "/maker-events/{event_id}/open-applications"
    description: "PLANNING -> APPLICATION_OPEN"
    roles: [EventCoordinator]
    code: 200
    input: []
    output: MakerEvent
    side_effects: ["posture -> APPLICATION_OPEN"]

  - method: POST
    path: "/maker-events/{event_id}/close-applications"
    description: "APPLICATION_OPEN -> JURY_REVIEW"
    roles: [EventCoordinator]
    code: 200
    input: []
    output: MakerEvent
    side_effects: ["DRAFT apps -> WITHDRAWN; SUBMITTED apps -> IN_REVIEW"]

  - method: POST
    path: "/maker-events/{event_id}/begin-scheduling"
    description: "JURY_REVIEW -> SCHEDULING"
    roles: [EventCoordinator]
    code: 200
    input: []
    output: MakerEvent
    side_effects: ["waitlist_rank materialized"]

  - method: POST
    path: "/maker-events/{event_id}/go-live"
    description: "SCHEDULING -> LIVE"
    roles: [EventCoordinator]
    code: 200
    input: []
    output: MakerEvent
    side_effects: ["ticket redemption enabled"]

  - method: POST
    path: "/maker-events/{event_id}/end-event"
    description: "LIVE -> SETTLEMENT; synthesizes PENDING Settlement per ACTIVE assignment"
    roles: [EventCoordinator]
    code: 200
    input: []
    output: MakerEvent
    side_effects: ["Settlement rows synthesized"]

  - method: POST
    path: "/maker-events/{event_id}/close-event"
    description: "SETTLEMENT -> CLOSED"
    roles: [EventCoordinator]
    code: 200
    input: []
    output: MakerEvent
    side_effects: []

  - method: POST
    path: "/maker-events/{event_id}/cancel"
    description: "Any posture -> CANCELLED with cascade"
    roles: [EventCoordinator]
    code: 200
    input: ["reason?"]
    output: MakerEvent
    side_effects: ["Cascade: Tickets, Applications, BoothAssignments, Settlements, LoadInSlots"]

  - method: POST
    path: "/maker-events/{event_id}/weather"
    description: "Set weather_flag; SEVERE from LIVE triggers WEATHER_HOLD cascade"
    roles: [EventCoordinator]
    code: 200
    input: [weather_flag]
    output: MakerEvent
    side_effects: ["OPEN_AIR cascade on SEVERE"]

  # ---------- BoothZone & Booth ----------
  - method: POST
    path: "/maker-events/{event_id}/booth-zones"
    description: "Create a BoothZone"
    roles: [EventCoordinator]
    code: 201
    input: [label, weather_exposure, category, category_cap]
    output: BoothZone
    side_effects: []

  - method: GET
    path: "/maker-events/{event_id}/booth-zones"
    description: "List BoothZones"
    roles: [EventCoordinator, Treasurer, Vendor, Juror, GateAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "BoothZone[]"
    side_effects: []

  - method: GET
    path: "/booth-zones/{zone_id}"
    description: "Read a single BoothZone (canonical collection anchor)"
    roles: [EventCoordinator, Treasurer, Vendor, Juror, GateAgent, PlatformAdmin]
    code: 200
    input: []
    output: BoothZone
    side_effects: []

  - method: GET
    path: "/booth-zones"
    description: "Filtered list of BoothZones by event"
    roles: [EventCoordinator, Treasurer, Vendor, Juror, GateAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "maker_event_id?"]
    output: "BoothZone[]"
    side_effects: []

  - method: POST
    path: "/maker-events/{event_id}/booth-zones/{zone_id}/booths"
    description: "Create a Booth in a Zone"
    roles: [EventCoordinator]
    code: 201
    input: [code, tier, footprint_sqm, price_cents]
    output: Booth
    side_effects: []

  - method: GET
    path: "/maker-events/{event_id}/booth-zones/{zone_id}/booths"
    description: "List Booths in a Zone"
    roles: [EventCoordinator, Treasurer, Vendor, Juror, GateAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "tier?", "occupied?"]
    output: "Booth[]"
    side_effects: []

  - method: GET
    path: "/booths/{booth_id}"
    description: "Read a single Booth (canonical collection anchor)"
    roles: [EventCoordinator, Treasurer, Vendor, Juror, GateAgent, PlatformAdmin]
    code: 200
    input: []
    output: Booth
    side_effects: []

  - method: GET
    path: "/booths"
    description: "Filtered list of Booths by zone or assigned application"
    roles: [EventCoordinator, Treasurer, Vendor, Juror, GateAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "booth_zone_id?", "assigned_application_id?"]
    output: "Booth[]"
    side_effects: []

  # ---------- VendorProfile ----------
  - method: POST
    path: "/vendor-profiles"
    description: "Register a VendorProfile"
    roles: [PlatformAdmin]
