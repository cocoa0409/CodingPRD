            - "depth-4 effect: the allowance payment on the cascade-suspended enrollment fails 409 with error_id == ERR_ENROLLMENT_NOT_ACTIVE"

      - name: for_cause_exit_debars_member_and_recycles_slot
        grounds:
          - state_machines.MemberEnrollment.ACTIVE_to_RELEASED_FOR_CAUSE
          - state_machines.Member.ACTIVE_to_DEBARRED
          - state_machines.PositionSlot.FILLED_to_VACATED
          - state_machines.PositionSlot.VACATED_to_OPEN
        distinguishing_aspect: "A different trigger (FOR_CAUSE exit) drives a different chain: the exit mutates the ENROLLMENT (hop 1); the release itself debars the MEMBER and vacates the SLOT (hop 2, caused by the enrollment's new state); the vacancy itself triggers refill evaluation returning the slot to OPEN (hop 3) — and no EducationAward is created."
        test_recipe:
          setup:
            - "Award ACTIVE with 2 FULL_TIME slots; member A enrolled, ACTIVE, 15300 certified minutes, no grievances."
          setup_api_calls:
