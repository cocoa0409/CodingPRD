# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Petting-Zoo & Mobile-Animal Party — 20 instances across the 9 Difficulty Rules
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: fiscal pricing vs safety scoring)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quote_vs_final_invoice_price_divergence
        grounds:
          - calculations.booking_price
          - calculations.line_item_rounding
          - entities.Booking.fields.quoted_total_cents
          - entities.Booking.fields.final_total_cents
        distinguishing_aspect: |
          FISCAL domain on Booking: the provisional variant counts the PROPOSED/
          CONFIRMED roster (3 animals incl. rabbit) producing quoted_total_cents
          34375, while the final variant on identical creation data excludes the
          REMOVED rabbit and prices 29637 — a different number for the same
          nominal booking; this is the pricing domain, distinct from the safety
          domain of the sibling instance.
        test_recipe:
          setup:
            - "Clock at 2026-05-10T00:00:00Z; PRIVATE customer with VERIFIED 500000-cent insurance cert"
            - "OUTDOOR GRASS ZONE_A 10mi venue, capacity 100, handwash required, no animal permit"
            - "Goat SMALL tier3 8000c, sheep MEDIUM tier2 9000c, rabbit SMALL tier3 4000c, all with PASS certs to 2026-07-01"
            - "Saturday booking 2026-06-06 14:00-16:00, 30 guests / 12 children, 2 planned stations, all 3 animals CONFIRMED"
            - "Quoted (34375, deposit 10313), fully paid (10313 + 24062), CONFIRMED, waiver complete, 2 handlers assigned, event run to COMPLETED with 45 actual attendees"
            - "Post-completion: rabbit health FAIL quarantines it and cascade-removes its BookingAnimal"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c1@x.com", full_name: "Cust One", customer_type: "PRIVATE" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /petting-zoo/customers/${c1}/insurance-certificates", payload: { provider: "Acme Mutual", policy_number: "POL-1", coverage_amount_cents: 500000, expires_at: "2027-01-01T00:00:00Z" }, as: Customer, as_user_id: "${c1}", captures: { cert1: $.data.id } }
            - { call: "POST /petting-zoo/insurance-certificates/${cert1}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c1}", captures: { v1: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Gogo", species: "GOAT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 8000 }, as: Operator, captures: { a_goat: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Shelly", species: "SHEEP", weight_class: "MEDIUM", temperament_tier: 2, base_event_fee_cents: 9000 }, as: Operator, captures: { a_sheep: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Bun", species: "RABBIT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 4000 }, as: Operator, captures: { a_rabbit: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_goat}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${a_sheep}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${a_rabbit}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v1}", start_time: "2026-06-06T14:00:00Z", end_time: "2026-06-06T16:00:00Z", guest_count: 30, child_guest_count: 12, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 2 }, as: Customer, as_user_id: "${c1}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba_goat: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals/${ba_goat}/confirm", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_sheep}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba_sheep: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals/${ba_sheep}/confirm", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_rabbit}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba_rabbit: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals/${ba_rabbit}/confirm", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/quote", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/payments", payload: { amount_cents: 10313, method: "CARD" }, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /petting-zoo/bookings/${bk}/confirm", payload: {}, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /petting-zoo/bookings/${bk}/waiver-signatures", payload: { count: 12 }, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /petting-zoo/handlers", payload: { name: "Hank", certifications: ["FIRST_AID"] }, as: Operator, captures: { h1: $.data.id } }
            - { call: "POST /petting-zoo/handlers", payload: { name: "Hana", certifications: ["FIRST_AID"] }, as: Operator, captures: { h2: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/staff-assignments", payload: { handler_id: "${h1}", role: "LEAD" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/staff-assignments", payload: { handler_id: "${h2}", role: "ASSISTANT" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/payments", payload: { amount_cents: 24062, method: "CARD" }, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /petting-zoo/bookings/${bk}/dispatch", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/arrive", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/start-event", payload: { actual_handwash_stations: 2 }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/complete", payload: { actual_attendance_count: 45 }, as: Coordinator }
            - { call: "POST /petting-zoo/animals/${a_rabbit}/health-records", payload: { exam_date: "2026-06-06T18:00:00Z", result: "FAIL", valid_until: "2026-06-06T18:00:00Z" }, as: Veterinarian }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/finalize-invoice", payload: {}, as: Coordinator }
          assert:
            - "Booking.${bk}.quoted_total_cents == 34375 (provisional: weekend lines 9200 + 10350 + 4600, surcharge 725, travel 8000, guest tier 1500)"
            - "Booking.${bk}.deposit_amount_cents == 10313 (round_half_up(0.30 * 34375))"
            - "Booking.${bk}.final_total_cents == 29637 (final variant excludes REMOVED rabbit: 19550 + 587 + 8000 + 1500)"
            - "Animal.${a_rabbit}.status == QUARANTINE and BookingAnimal.${ba_rabbit}.status == REMOVED with removal_reason QUARANTINE"
            - "LedgerEntry of type REFUND with amount_cents == 4738 (overpayment 34375 - 29637) exists; Booking.payment_status == REFUND_PARTIAL"

      - name: compliance_screening_vs_audited_score_divergence
        grounds:
          - calculations.compliance_score
          - entities.Booking.fields.compliance_screening_score
          - entities.Booking.fields.compliance_audited_score
        distinguishing_aspect: |
          SAFETY/compliance domain on Booking: screening variant (planned inputs at
          quote: 2 confirmed animals, 2 planned stations, 30 booked guests) scores
          87, while the audited variant at completion (actual inputs: 45 actual
          attendees pushing the station requirement to 3 with only 2 deployed)
          scores 81 — the sibling instance is fiscal pricing, so the two
          dual-variant calculations operate on different entity domains.
        test_recipe:
          setup:
            - "Clock 2026-05-10; PRIVATE customer with VERIFIED 500000c cert"
            - "OUTDOOR GRASS ZONE_A 10mi venue (handwash required), goat SMALL tier3 8000c + sheep MEDIUM tier2 9000c with PASS certs to 2026-07-01"
            - "Saturday booking 2026-06-13 14:00-16:00, 30 guests / 0 children, 2 planned stations, both animals CONFIRMED, quoted 29637 (screening 87), deposit 8891 paid, CONFIRMED"
            - "1 handler assigned (required = max(ceil(2/4), ceil(0/8)) = 1), balance 20746 paid"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c2@x.com", full_name: "Cust Two", customer_type: "PRIVATE" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /petting-zoo/customers/${c2}/insurance-certificates", payload: { provider: "Acme Mutual", policy_number: "POL-2", coverage_amount_cents: 500000, expires_at: "2027-01-01T00:00:00Z" }, as: Customer, as_user_id: "${c2}", captures: { cert2: $.data.id } }
            - { call: "POST /petting-zoo/insurance-certificates/${cert2}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 10, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c2}", captures: { v2: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Gogo", species: "GOAT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 8000 }, as: Operator, captures: { a_goat: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Shelly", species: "SHEEP", weight_class: "MEDIUM", temperament_tier: 2, base_event_fee_cents: 9000 }, as: Operator, captures: { a_sheep: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_goat}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${a_sheep}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v2}", start_time: "2026-06-13T14:00:00Z", end_time: "2026-06-13T16:00:00Z", guest_count: 30, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 2 }, as: Customer, as_user_id: "${c2}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba_goat: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals/${ba_goat}/confirm", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_sheep}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba_sheep: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals/${ba_sheep}/confirm", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/quote", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/payments", payload: { amount_cents: 8891, method: "CARD" }, as: Customer, as_user_id: "${c2}" }
            - { call: "POST /petting-zoo/bookings/${bk}/confirm", payload: {}, as: Customer, as_user_id: "${c2}" }
            - { call: "POST /petting-zoo/handlers", payload: { name: "Hank", certifications: ["FIRST_AID"] }, as: Operator, captures: { h1: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/staff-assignments", payload: { handler_id: "${h1}", role: "LEAD" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/payments", payload: { amount_cents: 20746, method: "CARD" }, as: Customer, as_user_id: "${c2}" }
            - { call: "POST /petting-zoo/bookings/${bk}/dispatch", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/arrive", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/start-event", payload: { actual_handwash_stations: 2 }, as: Coordinator }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/complete", payload: { actual_attendance_count: 45 }, as: Coordinator }
          assert:
            - "Booking.${bk}.compliance_screening_score == 87 (100 - 5 - 10 + 2, no shortfall at 2 planned stations for 30 guests)"
            - "Booking.${bk}.compliance_audited_score == 81 (100 - 15 + 2 - 1 guest-pressure - 5 station shortfall: ceil(45/20)=3 required vs 2 actual)"
            - "Booking.${bk}.compliance_screening_score != Booking.${bk}.compliance_audited_score"
            - "Booking.${bk}.status == COMPLETED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes: a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: travel_fee_multi_input_nonlinear
        grounds:
          - calculations.travel_setup_fee
        distinguishing_aspect: |
          Mode (a): travel_setup_fee combines 4 inputs (zone band base, distance
          overage vs included miles, ceil trailer capacity over animal count,
          conditional 1.25x PAVEMENT multiplier) with nested max/ceil/conditional
          branches — ZONE_B 60mi PAVEMENT with 7 animals yields
          round_half_up((9000 + 10*85 + 2*3000) * 1.25) = 19813.
        test_recipe:
          setup:
            - "Clock 2026-05-10; PRIVATE customer; OUTDOOR PAVEMENT ZONE_B 60mi venue, capacity 200, handwash not required"
            - "Seven chickens SMALL tier2 3000c each with PASS certs to 2026-07-01, all attached (PROPOSED) to a weekday booking 2026-06-10 10:00-12:00, 20 guests / 0 children / 0 stations"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c3@x.com", full_name: "Cust Three", customer_type: "PRIVATE" }, as: Anonymous, captures: { c3: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Lot 7", address: "7 Asphalt Way", venue_type: "OUTDOOR", water_access: true, surface_type: "PAVEMENT", travel_zone: "ZONE_B", distance_miles: 60, max_guest_capacity: 200, requires_animal_permit: false, requires_handwash_stations: false }, as: Customer, as_user_id: "${c3}", captures: { v3: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Chk1", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator, captures: { k1: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Chk2", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator, captures: { k2: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Chk3", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator, captures: { k3: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Chk4", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator, captures: { k4: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Chk5", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator, captures: { k5: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Chk6", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator, captures: { k6: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Chk7", species: "CHICKEN", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3000 }, as: Operator, captures: { k7: $.data.id } }
            - { call: "POST /petting-zoo/animals/${k1}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${k2}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${k3}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${k4}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${k5}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${k6}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${k7}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v3}", start_time: "2026-06-10T10:00:00Z", end_time: "2026-06-10T12:00:00Z", guest_count: 20, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 0 }, as: Customer, as_user_id: "${c3}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${k1}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${k2}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${k3}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${k4}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${k5}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${k6}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${k7}", role: "PETTING_ZOO" }, as: Coordinator }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/quote", payload: {}, as: Coordinator }
          assert:
            - "Booking.${bk}.travel_fee_cents == 19813 (raw 9000 + 850 overage + 6000 two trailers = 15850, x1.25 PAVEMENT = 19812.5 rounds half-up)"
            - "Booking.${bk}.animal_subtotal_cents == 21000 (7 x 3000, weekday, no weekend multiplier)"
            - "Booking.${bk}.surcharge_cents == 630 and Booking.${bk}.guest_surcharge_cents == 0 (20 guests)"
            - "Booking.${bk}.quoted_total_cents == 41443"

      - name: invoice_per_line_rounding_order
        grounds:
          - calculations.line_item_rounding
        distinguishing_aspect: |
          Mode (b) nested rounding: three 3343c animals on a Saturday produce
          round_half_up(3343*1.15)=3844 per line, summing to 11532; the forbidden
          sum-then-round order gives round_half_up(10029*1.15)=11533 — the pinned
          round-per-line-then-sum order is observable as a 1-cent delta.
        test_recipe:
          setup:
            - "Clock 2026-05-10; PRIVATE customer; OUTDOOR GRASS ZONE_A 5mi venue, handwash required"
            - "Three rabbits SMALL tier2 3343c each with PASS certs, attached (PROPOSED) to a Saturday booking 2026-06-06 10:00-12:00, 10 guests / 0 children / 1 station"
          setup_api_calls:
            - { call: "POST /petting-zoo/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: Operator }
            - { call: "POST /petting-zoo/customers", payload: { email: "c4@x.com", full_name: "Cust Four", customer_type: "PRIVATE" }, as: Anonymous, captures: { c4: $.data.id } }
            - { call: "POST /petting-zoo/venues", payload: { name: "Greenfield Park", address: "1 Meadow Ln", venue_type: "OUTDOOR", water_access: true, surface_type: "GRASS", travel_zone: "ZONE_A", distance_miles: 5, max_guest_capacity: 100, requires_animal_permit: false, requires_handwash_stations: true }, as: Customer, as_user_id: "${c4}", captures: { v4: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Bun1", species: "RABBIT", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3343 }, as: Operator, captures: { r1: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Bun2", species: "RABBIT", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3343 }, as: Operator, captures: { r2: $.data.id } }
            - { call: "POST /petting-zoo/animals", payload: { name: "Bun3", species: "RABBIT", weight_class: "SMALL", temperament_tier: 2, base_event_fee_cents: 3343 }, as: Operator, captures: { r3: $.data.id } }
            - { call: "POST /petting-zoo/animals/${r1}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${r2}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/animals/${r3}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v4}", start_time: "2026-06-06T10:00:00Z", end_time: "2026-06-06T12:00:00Z", guest_count: 10, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c4}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${r1}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${r2}", role: "PETTING_ZOO" }, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${r3}", role: "PETTING_ZOO" }, as: Coordinator }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/quote", payload: {}, as: Coordinator }
          assert:
            - "Booking.${bk}.animal_subtotal_cents == 11532 (3 x round_half_up(3343*1.15)=3844, per-line order; NOT 11533 from sum-then-round)"
            - "Booking.${bk}.surcharge_cents == 346 (round_half_up(0.03 * 11532))"
            - "Booking.${bk}.travel_fee_cents == 8000 and Booking.${bk}.guest_surcharge_cents == 0"
            - "Booking.${bk}.quoted_total_cents == 19878"

      - name: discount_surcharge_evaluation_order
        grounds:
          - calculations.institutional_discount_surcharge_order
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the institutional discount is
          computed on the raw subtotal FIRST (round_half_up(0.15*29000)=4350) and
          the liability surcharge SECOND on the discounted subtotal
          (round_half_up(0.03*24650)=740); reversing the order yields 4481/870 and
          a quoted total of 45889 instead of the pinned 45890.
        test_recipe:
          setup:
            - "Clock 2026-05-10; SCHOOL customer; OUTDOOR GRASS ZONE_C 90mi venue, capacity 200, handwash required"
            - "Weekday SCHOOL_PROGRAM booking 2026-06-10 09:00-11:00, 60 guests / 40 children / 3 stations"
            - "PONY_RIDE add-on 45min APPROVED (venue OUTDOOR satisfies pony gate); sheep 9000c + goat 8000c attached PROPOSED (weekday: no multiplier)"
