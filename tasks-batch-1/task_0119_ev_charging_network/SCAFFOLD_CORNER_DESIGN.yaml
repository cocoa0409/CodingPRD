scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_site_returns_201_with_computed_defaults
        claim_type: Creation
        grounds: [entities.Site, endpoints]
        distinguishing_aspect: "POST /api/sites with required fields returns 201; allocated_total_kw and active_session_count default to 0; version starts at 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/sites"
              payload: { name: "S1", circuit_limit_kw: 150, demand_charge_threshold_kw: 120 }
              as: CPOOperator
              captures: { sid: $.data.id, v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Site.allocated_total_kw == 0 and Site.active_session_count == 0"
            - "Site.version == 1 and Site.id is a server-minted UUID"

      - name: create_site_missing_required_circuit_limit_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Site.fields.circuit_limit_kw, "validations[priority=5]"]
        distinguishing_aspect: "POST /api/sites without circuit_limit_kw -> ERR_INVALID_REQUEST (422); circuit_limit_kw has source input and no default."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/sites"
              payload: { name: "S2", demand_charge_threshold_kw: 100 }
              as: CPOOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_site_threshold_exceeds_circuit_returns_over_circuit_limit
        claim_type: Type Constraints
        grounds: [entities.Site.fields.demand_charge_threshold_kw, "errors[ERR_OVER_CIRCUIT_LIMIT]"]
        distinguishing_aspect: "demand_charge_threshold_kw > circuit_limit_kw is rejected ERR_OVER_CIRCUIT_LIMIT (409)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/sites"
              payload: { name: "S3", circuit_limit_kw: 100, demand_charge_threshold_kw: 150 }
              as: CPOOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OVER_CIRCUIT_LIMIT"
            - "HTTP status == 409"

      - name: get_site_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Site, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/sites/{id} with an unknown UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/sites/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CPOOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: stall_ocpp_status_defaults_available_system_field
        claim_type: System Fields
        grounds: [entities.Stall.fields.ocpp_status, entities.Stall.fields.reservation_priority]
        distinguishing_aspect: "POST /api/stalls ignores any client ocpp_status; new stall starts ocpp_status == AVAILABLE and reservation_priority defaults to 100."
        test_recipe:
          setup: ["A site exists."]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "SX", circuit_limit_kw: 100, demand_charge_threshold_kw: 100 }
              as: CPOOperator
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /api/stalls"
              payload: { site_id: "${sid}", connector_type: "NACS", max_power_kw: 50 }
              as: CPOOperator
              captures: { stid: $.data.id, st: $.data.ocpp_status }
          assert:
            - "Stall.${stid}.ocpp_status == AVAILABLE"
            - "Stall.${stid}.reservation_priority == 100"

      - name: tariff_invalid_tier_order_returns_invalid_tiers
        claim_type: Type Constraints
        grounds: [entities.Tariff.fields.energy_tier_2_max_kwh, "errors[ERR_TARIFF_INVALID_TIERS]"]
        distinguishing_aspect: "energy_tier_2_max_kwh <= energy_tier_1_max_kwh is rejected ERR_TARIFF_INVALID_TIERS (422)."
        test_recipe:
          setup: ["A site exists."]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "STier", circuit_limit_kw: 100, demand_charge_threshold_kw: 100 }
              as: CPOOperator
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /api/tariffs"
              payload: { site_id: "${sid}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", energy_tier_1_max_kwh: 30, energy_tier_2_max_kwh: 20, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: CPOOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TARIFF_INVALID_TIERS"
            - "HTTP status == 422"

      - name: meter_event_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.MeterEvent]
        distinguishing_aspect: "MeterEvent has common_fields false: the create response carries id and created_at but no version field; there is no update endpoint."
        test_recipe:
          setup: ["A session in PREPARING exists."]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "SM", circuit_limit_kw: 100, demand_charge_threshold_kw: 100 }
              as: CPOOperator
              captures: { sid: $.data.id }
            - call: "POST /api/tariffs"
              payload: { site_id: "${sid}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/stalls"
              payload: { site_id: "${sid}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stid: $.data.id }
            - call: "POST /api/emsps"
              payload: { name: "E", commission_pct: 0.05 }
              as: CPOOperator
              captures: { eid: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "m@x.com", full_name: "M", home_emsp_id: "${eid}" }
              as: CPOOperator
              captures: { did: $.data.id }
            - call: "POST /api/sessions"
              payload: { stall_id: "${stid}", driver_id: "${did}" }
              as: Driver
              as_user_id: "${did}"
              captures: { ssid: $.data.id }
          trigger:
            - call: "POST /api/sessions/${ssid}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
              captures: { meid: $.data.id }
          assert:
            - "HTTP status == 201"
            - "MeterEvent.${meid}.id present and created_at present; no version field on the response"

  # =========================================================================
  - section: state_machines
    instances:
      - name: begin_charging_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ChargingSession.FINISHING_to_COMPLETED, "validations[priority=6]"]
        distinguishing_aspect: "After a session reaches COMPLETED, POST begin-charging is undefined from COMPLETED -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A home session driven to COMPLETED (charged then stopped)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/sites"
              payload: { name: "SC2", circuit_limit_kw: 200, demand_charge_threshold_kw: 200 }
              as: CPOOperator
              captures: { sid: $.data.id }
            - call: "POST /api/tariffs"
              payload: { site_id: "${sid}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", session_fee_cents: 100, energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, idle_grace_minutes: 10, idle_fee_cents_per_min: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/stalls"
              payload: { site_id: "${sid}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stid: $.data.id }
            - call: "POST /api/emsps"
              payload: { name: "E", commission_pct: 0.05 }
              as: CPOOperator
              captures: { eid: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "c2@x.com", full_name: "C2", home_emsp_id: "${eid}" }
              as: CPOOperator
              captures: { did: $.data.id }
            - call: "POST /api/drivers/${did}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: CPOOperator
            - call: "POST /api/sessions"
              payload: { stall_id: "${stid}", driver_id: "${did}" }
              as: Driver
              as_user_id: "${did}"
              captures: { ssid: $.data.id }
            - call: "POST /api/sessions/${ssid}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/sessions/${ssid}/begin-charging"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:30:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${ssid}/meter-events"
              payload: { meter_kwh: 10, sampled_at: "2026-06-01T00:30:00Z", reading_context: "TRANSACTION_END" }
              as: StationController
            - call: "POST /api/sessions/${ssid}/stop"
              payload: {}
              as: Driver
              as_user_id: "${did}"
          trigger:
            - call: "POST /api/sessions/${ssid}/begin-charging"
              payload: {}
              as: StationController
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: settle_open_batch_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SettlementBatch.LOCKED_to_SETTLED, "validations[priority=6]"]
        distinguishing_aspect: "POST settle requires status LOCKED; settling an OPEN batch -> ERR_INVALID_STATE (409). State precondition fails before the OCC version check."
        test_recipe:
          setup: ["An OPEN batch with one line item (never locked)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/sites"
              payload: { name: "SOB", circuit_limit_kw: 200, demand_charge_threshold_kw: 200 }
              as: CPOOperator
              captures: { sid: $.data.id }
            - call: "POST /api/tariffs"
              payload: { site_id: "${sid}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", session_fee_cents: 100, energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, idle_grace_minutes: 10, idle_fee_cents_per_min: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/stalls"
              payload: { site_id: "${sid}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stid: $.data.id }
            - call: "POST /api/emsps"
              payload: { name: "EOB", commission_pct: 0.075 }
              as: CPOOperator
              captures: { eid: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "ob@x.com", full_name: "OB", home_emsp_id: "${eid}" }
              as: CPOOperator
              captures: { did: $.data.id }
            - call: "POST /api/sessions"
              payload: { stall_id: "${stid}", driver_id: "${did}", is_roaming: true }
              as: Driver
              as_user_id: "${did}"
              captures: { ssid: $.data.id }
            - call: "POST /api/sessions/${ssid}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/sessions/${ssid}/begin-charging"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:50:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${ssid}/meter-events"
              payload: { meter_kwh: 35, sampled_at: "2026-06-01T00:50:00Z", reading_context: "TRANSACTION_END" }
              as: StationController
            - call: "POST /api/sessions/${ssid}/stop"
              payload: {}
              as: StationController
            - call: "POST /api/settlement-batches"
              payload: { emsp_id: "${eid}" }
              as: CPOOperator
              captures: { bid: $.data.id }
            - call: "POST /api/settlement-batches/${bid}/line-items"
              payload: { session_id: "${ssid}" }
              as: CPOOperator
            - call: "GET /api/settlement-batches/${bid}"
              payload: {}
              as: CPOOperator
              captures: { bv: $.data.version }
          trigger:
            - call: "POST /api/settlement-batches/${bid}/settle"
              payload: { expected_settlementbatch_version: "${bv}" }
              as: CPOOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: meter_regression_rejected
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=13]", "errors[ERR_METER_REGRESSION]"]
        distinguishing_aspect: "A MeterEvent.meter_kwh below the session's prior reading is rejected ERR_METER_REGRESSION (409)."
        test_recipe:
          setup: ["A session with a TRANSACTION_BEGIN reading of 10 kWh."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/sites"
              payload: { name: "SMR", circuit_limit_kw: 200, demand_charge_threshold_kw: 200 }
              as: CPOOperator
              captures: { sid: $.data.id }
            - call: "POST /api/tariffs"
              payload: { site_id: "${sid}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/stalls"
              payload: { site_id: "${sid}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stid: $.data.id }
            - call: "POST /api/emsps"
              payload: { name: "EMR", commission_pct: 0.05 }
              as: CPOOperator
              captures: { eid: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "mr@x.com", full_name: "MR", home_emsp_id: "${eid}" }
              as: CPOOperator
              captures: { did: $.data.id }
            - call: "POST /api/sessions"
              payload: { stall_id: "${stid}", driver_id: "${did}" }
              as: Driver
              as_user_id: "${did}"
              captures: { ssid: $.data.id }
            - call: "POST /api/sessions/${ssid}/meter-events"
              payload: { meter_kwh: 10, sampled_at: "2026-06-01T00:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
          trigger:
            - call: "POST /api/sessions/${ssid}/meter-events"
              payload: { meter_kwh: 8, sampled_at: "2026-06-01T00:05:00Z", reading_context: "SAMPLE_PERIODIC" }
              as: StationController
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_METER_REGRESSION"
            - "HTTP status == 409"

      - name: stall_fault_recovery_cycle_back_to_available
        claim_type: cyclic
        grounds: [state_machines.Stall.FAULTED_to_AVAILABLE, state_machines.Stall.AVAILABLE_to_FAULTED]
        distinguishing_aspect: "Stall cycles AVAILABLE->FAULTED->AVAILABLE: after a Faulted then an Available StatusNotification, ocpp_status returns to AVAILABLE."
        test_recipe:
          setup: ["A stall (no active session) faulted then recovered."]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "SFR", circuit_limit_kw: 100, demand_charge_threshold_kw: 100 }
              as: CPOOperator
              captures: { sid: $.data.id }
            - call: "POST /api/stalls"
              payload: { site_id: "${sid}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stid: $.data.id }
            - call: "POST /api/stalls/${stid}/ocpp-status"
              payload: { reported_status: "FAULTED" }
              as: StationController
          trigger:
            - call: "POST /api/stalls/${stid}/ocpp-status"
              payload: { reported_status: "AVAILABLE" }
              as: StationController
              captures: { st: $.data.ocpp_status }
          assert:
            - "Stall.${stid}.ocpp_status == AVAILABLE"

      - name: reservation_consumed_branch_refunds_hold
        claim_type: compensation
        grounds: [state_machines.Reservation.CHECKED_IN_to_CONSUMED, state_machines.ChargingSession.FINISHING_to_COMPLETED]
        distinguishing_aspect: "The CONSUMED branch (driver checks in, charges, stops) refunds hold_fee_cents — the divergent counterpart to the §1.8 NO_SHOW branch which forfeits it."
        test_recipe:
          setup: ["A confirmed reservation (hold 500), checked in within the window, then a session honoring it is charged 10 kWh (cost 400) and stopped."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: CPOOperator
            - call: "POST /api/emsps"
              payload: { name: "ECB", commission_pct: 0.05 }
              as: CPOOperator
              captures: { eid: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "cb@x.com", full_name: "CB", home_emsp_id: "${eid}" }
              as: CPOOperator
              captures: { did: $.data.id }
            - call: "POST /api/drivers/${did}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: CPOOperator
            - call: "POST /api/sites"
              payload: { name: "SCB", circuit_limit_kw: 200, demand_charge_threshold_kw: 200 }
              as: CPOOperator
              captures: { sid: $.data.id }
            - call: "POST /api/tariffs"
              payload: { site_id: "${sid}", connector_type: "CCS", pricing_mode: "ENERGY_BASED", session_fee_cents: 100, energy_tier_1_max_kwh: 20, energy_tier_2_max_kwh: 50, energy_rate_t1_cents: 30, energy_rate_t2_cents: 25, energy_rate_t3_cents: 20, time_rate_cents_per_min: 40, idle_grace_minutes: 10, idle_fee_cents_per_min: 50, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/stalls"
              payload: { site_id: "${sid}", connector_type: "CCS", max_power_kw: 60 }
              as: CPOOperator
              captures: { stid: $.data.id, stv: $.data.version }
            - call: "POST /api/reservations"
              payload: { stall_id: "${stid}", driver_id: "${did}", window_start: "2026-06-01T09:00:00Z", window_end: "2026-06-01T11:00:00Z", hold_fee_cents: 500, expected_stall_version: "${stv}" }
              as: Driver
              as_user_id: "${did}"
              captures: { rid: $.data.id }
            - call: "POST /api/reservations/${rid}/confirm"
              payload: {}
              as: Driver
              as_user_id: "${did}"
            - call: "POST /api/reservations/${rid}/check-in"
              payload: {}
              as: Driver
              as_user_id: "${did}"
            - call: "POST /api/sessions"
              payload: { stall_id: "${stid}", driver_id: "${did}", reservation_id: "${rid}" }
              as: Driver
              as_user_id: "${did}"
              captures: { ssid: $.data.id }
            - call: "POST /api/sessions/${ssid}/meter-events"
              payload: { meter_kwh: 0, sampled_at: "2026-06-01T09:00:00Z", reading_context: "TRANSACTION_BEGIN" }
              as: StationController
            - call: "POST /api/sessions/${ssid}/begin-charging"
              payload: {}
              as: StationController
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:30:00Z" }
              as: CPOOperator
            - call: "POST /api/sessions/${ssid}/meter-events"
              payload: { meter_kwh: 10, sampled_at: "2026-06-01T09:30:00Z", reading_context: "TRANSACTION_END" }
              as: StationController
          trigger:
            - call: "POST /api/sessions/${ssid}/stop"
              payload: {}
              as: Driver
              as_user_id: "${did}"
          assert:
            - "Reservation.${rid}.status == CONSUMED"
            - "Driver.${did}.wallet_balance_cents == 99600 (100000 - 500 hold + 500 refund - 400 session cost)"

      - name: error_session_start_on_occupied_stall_already_covered
        claim_type: invalid_transition
        grounds: [state_machines.Stall.AVAILABLE_to_OCCUPIED, "validations[priority=7]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / session_start_requires_stall_available
          rationale: "Session-start rejection on a non-AVAILABLE stall is asserted by the named §1.8 instance (UNAVAILABLE variant); the OCCUPIED variant is the same ERR_STALL_NOT_AVAILABLE path."

  # =========================================================================
  - section: calculations
    instances:
      - name: idle_fee_beyond_grace_correct
        claim_type: Correct Result
        grounds: [calculations.idle_occupancy_fee, entities.ChargingSession.fields.idle_fee_cents]
        distinguishing_aspect: "idle_minutes 11 with grace 10 yields idle_fee 50 (1 billable minute * 50); a 5 kWh session totals 300 — the >grace counterpart to the §1.8 ==grace boundary."
        test_recipe:
          setup: ["ENERGY tariff (grace 10, idle 50). A 5 kWh session idling 11 whole minutes."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CPOOperator
            - call: "POST /api/emsps"
              payload: { name: "EIF", commission_pct: 0.05 }
              as: CPOOperator
              captures: { eid: $.data.id }
            - call: "POST /api/drivers"
              payload: { email: "if@x.com", full_name: "IF", home_emsp_id: "${eid}" }
              as: CPOOperator
              captures: { did: $.data.id }
            - call: "POST /api/drivers/${did}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: CPOOperator
            - call: "POST /api/sites"
