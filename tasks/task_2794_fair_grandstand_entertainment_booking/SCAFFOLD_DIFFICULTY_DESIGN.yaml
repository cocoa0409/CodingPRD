          - calculations.artist_draw_score
          - entities.FairEdition.fields.strategy_basis
          - entities.Artist.fields.draw_score_next_year
          - entities.Artist.fields.base_draw_score
          - state_machines.Settlement.PENDING_APPROVAL_to_APPROVED
