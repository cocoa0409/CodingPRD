      - name: reserve_unavailable_asset_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=31]", "errors[ERR_ASSET_NOT_AVAILABLE]"]
        distinguishing_aspect: "Only one active engagement per asset: while E1 holds the asset RESERVED, reserving waitlisted E2 fails with ERR_ASSET_NOT_AVAILABLE (409); pull CREATION on a RETIRED asset fails with the same code through the creation-side clause."
        test_recipe:
          setup: ["IATSE venue; production PLANNING; asset A1 with E1 RESERVED and E2 REQUESTED; retired asset A2"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { v1: $.data.id } }
