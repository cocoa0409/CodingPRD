            - { call: "POST /draw-line-items", payload: { draw_id: "${d1_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d1_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc1_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d1_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc1_w: $.data.id } }
            - { call: "POST /draw-documents/${doc1_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc1_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d1_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d1_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d1_id}", scheduled_date: "2026-03-19" }, as: DrawProcessor, captures: { insp1_id: $.data.id } }
            - { call: "POST /inspections/${insp1_id}/complete", payload: { percent_complete_reported: 49.99, completed_date: "2026-03-20" }, as: Inspector }
            - { call: "POST /inspections/${insp1_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d1_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-04-01", period_end_date: "2026-04-30" }, as: Borrower, as_user_id: "${b_id}", captures: { d2_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d2_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d2_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-04-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc2_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d2_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-04-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc2_w: $.data.id } }
            - { call: "POST /draw-documents/${doc2_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc2_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d2_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d2_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d2_id}", scheduled_date: "2026-04-19" }, as: DrawProcessor, captures: { insp2_id: $.data.id } }
            - { call: "POST /inspections/${insp2_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-04-20" }, as: Inspector }
            - { call: "POST /inspections/${insp2_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d2_id}/approve", payload: {}, as: CreditOfficer }
          trigger:
            - { call: "GET /draws/${d1_id}", as: LoanServicer }
            - { call: "GET /draws/${d2_id}", as: LoanServicer }
          assert:
            - "DrawRequest.${d1_id}.retainage_total_cents == 10000 (49.99 percent: standard 10.00 pct, milestone_applied == false)"
            - "DrawRequest.${d2_id}.retainage_total_cents == 5000 (exactly 50.00 percent: reduced 5.00 pct, milestone_applied == true)"
            - "Loan.${l_id}.milestone_reached == true after the 50.00 inspection is accepted"

      - name: interest_reserve_exact_depletion_boundary
        grounds:
          - calculations.interest_accrual
          - entities.Loan.fields.interest_reserve_depleted
        distinguishing_aspect: |
          Metric: reserve cents at exact zero via POST /loans/{id}/interest-accruals.
          interest_due == reserve exactly (95000 == 95000) leaves balance 0,
          depleted true, and ZERO capitalization; the next run (reserve already
          0) capitalizes the full 95000 — equality, not one cent short, is the
          boundary between paying and capitalizing.
        test_recipe:
          setup:
            - "Loan L reserve exactly 95000, one line 40000000, FUNDED draw netting principal 9500000"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 95000, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws/${d_id}/fund", payload: {}, as: LoanServicer }
          trigger:
            - { call: "POST /loans/${l_id}/interest-accruals", payload: { period_start_date: "2026-04-01", period_end_date: "2026-05-01" }, as: LoanServicer, captures: { paid1: $.data.paid_from_reserve_cents, cap1: $.data.capitalized_cents, bal1: $.data.reserve_balance_after_cents } }
            - { call: "POST /loans/${l_id}/interest-accruals", payload: { period_start_date: "2026-05-01", period_end_date: "2026-05-31" }, as: LoanServicer, captures: { paid2: $.data.paid_from_reserve_cents, cap2: $.data.capitalized_cents } }
          assert:
            - "Run 1 (due == reserve exactly): paid_from_reserve_cents == 95000, capitalized_cents == 0, reserve_balance_after_cents == 0"
            - "Loan.${l_id}.interest_reserve_depleted == true after exact-zero landing"
            - "Run 2: paid_from_reserve_cents == 0 and capitalized_cents == 95000"
            - "Loan.${l_id}.interest_capitalized_cents == 95000"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: approve_requires_accepted_inspection
        grounds:
          - state_machines.DrawRequest.UNDER_REVIEW_to_APPROVED
          - state_machines.Inspection.COMPLETED_to_ACCEPTED
          - errors[ERR_INSPECTION_REQUIRED]
        distinguishing_aspect: |
          Pair DrawRequest -> Inspection: a draw in UNDER_REVIEW whose linked
          inspection is only COMPLETED (not ACCEPTED) cannot be approved
          (ERR_INSPECTION_REQUIRED); accepting the inspection unblocks the same
          approve call with no change to the draw itself.
        test_recipe:
          setup:
            - "Draw D UNDER_REVIEW with verified invoice + conditional waiver (100000 each) and one COMPLETED inspection (40.00, in-period)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 1000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 100000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 40.00, completed_date: "2026-03-21" }, as: Inspector }
          trigger:
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
          assert:
            - "First approve: error_id == ERR_INSPECTION_REQUIRED; draw remains UNDER_REVIEW"
            - "After inspection ACCEPTED: second approve succeeds, DrawRequest.${d_id}.status == APPROVED"
            - "DrawRequest.${d_id}.approved_total_cents == 100000"

      - name: conversion_approve_requires_clean_loan
        grounds:
          - state_machines.ConversionReview.REQUESTED_to_APPROVED
          - state_machines.RetainageRelease.APPROVED_to_PAID
          - errors[ERR_CONVERSION_PRECONDITIONS_UNMET]
        distinguishing_aspect: |
          Pair ConversionReview -> Loan: conversion approve is gated on loan
          aggregate state (retained_cents == 0, no non-terminal draws, 100.00
          ACCEPTED inspection). With 500000 retainage still withheld the approve
          fails; after the release cascade zeroes retained_cents, the same
          review approves without any change to the review itself.
        test_recipe:
          setup:
            - "Loan L: FUNDED draw (BL-A disbursed 9500000, retained 500000, milestone reached), plus a completion inspection (no draw) ACCEPTED at 100.00"
            - "ConversionReview CR in REQUESTED"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws/${d_id}/fund", payload: {}, as: LoanServicer }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", scheduled_date: "2026-06-15" }, as: DrawProcessor, captures: { inspc_id: $.data.id } }
            - { call: "POST /inspections/${inspc_id}/complete", payload: { percent_complete_reported: 100.00, completed_date: "2026-06-16" }, as: Inspector }
            - { call: "POST /inspections/${inspc_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /conversion-reviews", payload: { loan_id: "${l_id}" }, as: Borrower, as_user_id: "${b_id}", captures: { cr_id: $.data.id } }
          trigger:
            - { call: "POST /conversion-reviews/${cr_id}/review", payload: { decision: "APPROVED" }, as: CreditOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /retainage-releases", payload: { loan_id: "${l_id}", budget_line_id: "${bl_a}", amount_cents: 500000, reason: "Final release" }, as: Borrower, as_user_id: "${b_id}", captures: { rr_id: $.data.id } }
            - { call: "POST /retainage-releases/${rr_id}/review", payload: { decision: "APPROVED" }, as: CreditOfficer }
            - { call: "POST /retainage-releases/${rr_id}/pay", payload: {}, as: LoanServicer }
            - { call: "POST /conversion-reviews/${cr_id}/review", payload: { decision: "APPROVED" }, as: CreditOfficer }
          assert:
            - "First conversion approve: error_id == ERR_CONVERSION_PRECONDITIONS_UNMET (retained_cents 500000 > 0)"
            - "After release pay: Loan.${l_id}.retained_cents == 0"
            - "Second conversion approve succeeds: ConversionReview.${cr_id}.status == APPROVED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: draw_period_half_open_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_DRAW_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource DrawRequest with HALF-OPEN interval semantics: periods
          [start, end) on the same loan; adjacency (end == next start) is
          allowed, any strict interior overlap is rejected. Draw B starting
          2026-03-31 (A's end) succeeds; draw C [2026-03-15, 2026-04-15) fails.
        test_recipe:
          setup:
            - "Loan L with BL-A; draw A [2026-03-01, 2026-03-31) with one line, SUBMITTED"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { da_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${da_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${da_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-31", period_end_date: "2026-04-30" }, as: Borrower, as_user_id: "${b_id}", captures: { db_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${db_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-15", period_end_date: "2026-04-15" }, as: Borrower, as_user_id: "${b_id}", captures: { dc_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${dc_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /draws/${db_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${dc_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "Draw B (adjacent at A's end): submit succeeds, status == SUBMITTED (half-open boundary)"
            - "Draw C (interior overlap): error_id == ERR_DRAW_PERIOD_OVERLAP and draw remains DRAFT"

      - name: inspection_minimum_gap_buffer
        grounds:
          - validations[priority=8]
          - errors[ERR_INSPECTION_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource Inspection with MINIMUM-GAP BUFFER semantics (not half-open
          intervals): a new ORDERED inspection conflicts with an existing ORDERED
          inspection on the same loan when |scheduled_date difference| <= 2 days.
          Difference 2 conflicts; difference exactly 3 is allowed.
        test_recipe:
          setup:
            - "Loan L OPEN; inspection I1 ORDERED scheduled 2026-03-10 (completion inspection, no draw)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", scheduled_date: "2026-03-10" }, as: DrawProcessor, captures: { i1_id: $.data.id } }
          trigger:
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", scheduled_date: "2026-03-12" }, as: DrawProcessor, captures: { err: $.data.error_id } }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", scheduled_date: "2026-03-13" }, as: DrawProcessor, captures: { i3_id: $.data.id } }
          assert:
            - "Scheduled 2026-03-12 (gap 2 days): error_id == ERR_INSPECTION_SCHEDULE_CONFLICT"
            - "Scheduled 2026-03-13 (gap exactly 3 days): succeeds, status == ORDERED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reallocation_roundtrip_budget_conservation
        grounds:
          - calculations.revised_budget_reallocation
          - state_machines.ReallocationRequest.APPROVED_to_APPLIED
        distinguishing_aspect: |
          Conserved quantity: total revised budget cents. Applying a
          reallocation C->A of 5000000 followed by its exact compensating
          reallocation A->C restores every line's revised_amount_cents to its
          original, and sum(revised) == sum(original) == 80000000 at every step.
        test_recipe:
          setup:
            - "Loan L with BL-A 40000000, BL-B 30000000, BL-C contingency 10000000 (no draws)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "FRAM", description: "Framing", original_amount_cents: 30000000 }, as: LenderAdmin, captures: { bl_b: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "CONT", description: "Contingency", original_amount_cents: 10000000, is_contingency: true }, as: LenderAdmin, captures: { bl_c: $.data.id } }
            - { call: "GET /loans/${l_id}", as: LenderAdmin, captures: { l_v1: $.data.version } }
            - { call: "POST /reallocation-requests", payload: { loan_id: "${l_id}", from_budget_line_id: "${bl_c}", to_budget_line_id: "${bl_a}", amount_cents: 5000000, justification: "Site overrun", expected_loan_version: "${l_v1}" }, as: LenderAdmin, captures: { ra1_id: $.data.id } }
            - { call: "POST /reallocation-requests/${ra1_id}/review", payload: { decision: "APPROVED" }, as: CreditOfficer }
            - { call: "POST /reallocation-requests/${ra1_id}/apply", payload: {}, as: LoanServicer }
            - { call: "GET /loans/${l_id}", as: LenderAdmin, captures: { l_v2: $.data.version } }
            - { call: "POST /reallocation-requests", payload: { loan_id: "${l_id}", from_budget_line_id: "${bl_a}", to_budget_line_id: "${bl_c}", amount_cents: 5000000, justification: "Reverse", expected_loan_version: "${l_v2}" }, as: LenderAdmin, captures: { ra2_id: $.data.id } }
            - { call: "POST /reallocation-requests/${ra2_id}/review", payload: { decision: "APPROVED" }, as: CreditOfficer }
            - { call: "POST /reallocation-requests/${ra2_id}/apply", payload: {}, as: LoanServicer }
          trigger:
            - { call: "GET /budget-lines/${bl_a}", as: LenderAdmin }
            - { call: "GET /budget-lines/${bl_c}", as: LenderAdmin }
          assert:
            - "After forward apply (observed mid-chain): BL-A revised 45000000, BL-C revised 5000000, sum 80000000 == sum(original)"
            - "After compensating apply: BudgetLine.${bl_a}.revised_amount_cents == 40000000 (original restored)"
            - "BudgetLine.${bl_c}.revised_amount_cents == 10000000 (contingency restored)"
            - "sum(revised_amount_cents) over all lines == 80000000 (conserved)"

      - name: retainage_release_cash_conservation
        grounds:
          - state_machines.RetainageRelease.APPROVED_to_PAID
          - calculations.retainage_withholding
        distinguishing_aspect: |
          Conserved quantity: per-line funded cash split. A retainage release
          only transfers between disbursed_cents and retained_cents on the line:
          BL-A (disbursed 9500000 + retained 500000 == 10000000 before) ==
          (disbursed 10000000 + retained 0 == 10000000 after). Nothing is
          created or leaked by the transfer.
        test_recipe:
          setup:
            - "Loan L with FUNDED draw: BL-A disbursed 9500000, retained 500000; milestone_reached true"
            - "RetainageRelease of 500000 on BL-A in APPROVED"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", commitment_amount_cents: 100000000, interest_rate_annual_bps: 1200, interest_reserve_initial_cents: 0, maturity_date: "2027-12-31" }, as: LenderAdmin, captures: { l_id: $.data.id } }
            - { call: "POST /budget-lines", payload: { loan_id: "${l_id}", cost_code: "SITE", description: "Site work", original_amount_cents: 40000000 }, as: LenderAdmin, captures: { bl_a: $.data.id } }
            - { call: "POST /draws", payload: { loan_id: "${l_id}", period_start_date: "2026-03-01", period_end_date: "2026-03-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /draw-line-items", payload: { draw_id: "${d_id}", budget_line_id: "${bl_a}", line_type: "WORK_COMPLETED", requested_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "INVOICE", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_inv: $.data.id } }
            - { call: "POST /draw-documents", payload: { draw_id: "${d_id}", doc_type: "LIEN_WAIVER_CONDITIONAL", party_name: "Acme GC", amount_cents: 10000000, doc_date: "2026-03-25" }, as: Borrower, as_user_id: "${b_id}", captures: { doc_w: $.data.id } }
            - { call: "POST /draw-documents/${doc_inv}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draw-documents/${doc_w}/review", payload: { decision: "VERIFIED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/submit", payload: {}, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /draws/${d_id}/start-review", payload: {}, as: DrawProcessor }
            - { call: "POST /inspections", payload: { loan_id: "${l_id}", draw_id: "${d_id}", scheduled_date: "2026-03-20" }, as: DrawProcessor, captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/complete", payload: { percent_complete_reported: 50.00, completed_date: "2026-03-21" }, as: Inspector }
            - { call: "POST /inspections/${insp_id}/review", payload: { decision: "ACCEPTED" }, as: DrawProcessor }
            - { call: "POST /draws/${d_id}/approve", payload: {}, as: CreditOfficer }
            - { call: "POST /draws/${d_id}/fund", payload: {}, as: LoanServicer }
            - { call: "POST /retainage-releases", payload: { loan_id: "${l_id}", budget_line_id: "${bl_a}", amount_cents: 500000, reason: "Milestone release" }, as: Borrower, as_user_id: "${b_id}", captures: { rr_id: $.data.id } }
            - { call: "POST /retainage-releases/${rr_id}/review", payload: { decision: "APPROVED" }, as: CreditOfficer }
          trigger:
            - { call: "POST /retainage-releases/${rr_id}/pay", payload: {}, as: LoanServicer }
          assert:
            - "Before pay: BL-A disbursed_cents + retained_cents == 10000000 (9500000 + 500000)"
            - "After pay: BudgetLine.${bl_a}.disbursed_cents == 10000000 and retained_cents == 0"
            - "After pay: BL-A disbursed_cents + retained_cents == 10000000 (conserved through the transfer)"

      - name: interest_reserve_account_conservation
        grounds:
          - calculations.interest_accrual
          - entities.InterestReserveEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: interest reserve account cents. For any sequence
          of accruals, interest_reserve_initial_cents ==
          interest_reserve_balance_cents + total INTEREST_PAYMENT payouts +
          interest_reserve_swept_cents. With initial 200000 and one accrual
          paying 95000: 200000 == 105000 + 95000 + 0.
        test_recipe:
          setup:
            - "Loan L reserve 200000, FUNDED draw netting principal 9500000"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
