scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_subtotal_diverge_on_late_happy_hour_window
        grounds:
          - calculations.provisional_check_subtotal
          - calculations.final_check_subtotal
          - state_machines.Check.OPEN_to_PRESENTED
          - entities.Check.fields.provisional_subtotal_cents
          - entities.Check.fields.final_subtotal_cents
        distinguishing_aspect: |
          Same fired course, two algorithms on the Check domain: provisional snapshots base price at fire
          time (no window existed yet → 2700), final re-evaluates happy-hour windows at fired_at on present
          (window now covers fired_at → 1900); the two numbers differ.
        test_recipe:
          setup:
            - "Restaurant with tax_rate_bps=875, large_party_threshold=8, auto_gratuity_bps=2000, comp_cap_bps=10000."
            - "MenuItem base=1200, happy=800, station GRILL, initial_available_count=50."
            - "Clock at 2026-06-01T17:30:00Z (Monday, minute-of-day 1050) when the course fires (NO window yet)."
            - "Seating OPEN on an AVAILABLE table (capacity 10); Check OPEN with party_size=8; one course (number 1) with one item qty=2 plus a modifier surcharge 150; course fired."
            - "AFTER firing, a HappyHourWindow Monday [1020,1080) is created so it now covers minute 1050."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R1", tax_rate_bps: 875, large_party_threshold: 8, auto_gratuity_bps: 2000, comp_cap_bps: 10000 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-01T17:30:00Z" }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Burger", station: "GRILL", base_price_cents: 1200, happy_hour_price_cents: 800, initial_available_count: 50 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 10 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 8 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 8 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { oi: $.data.id }
            - call: "POST /item-modifiers"
              payload: { restaurant_id: "${rid}", order_item_id: "${oi}", name: "extra cheese", surcharge_cents: 150 }
              as: Server
              as_user_id: "${sm}"
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
            - call: "POST /happy-hour-windows"
              payload: { restaurant_id: "${rid}", day_of_week: 1, start_minute: 1020, end_minute: 1080 }
              as: Manager
          trigger:
            - call: "POST /checks/${chk}/present"
              payload: {}
              as: Server
              as_user_id: "${sm}"
              captures: { prov: $.data.provisional_subtotal_cents, fin: $.data.final_subtotal_cents }
          assert:
            - "Check.${chk}.provisional_subtotal_cents == 2700"
            - "Check.${chk}.final_subtotal_cents == 1900"
            - "Check.${chk}.provisional_subtotal_cents != Check.${chk}.final_subtotal_cents"

      - name: tip_pool_even_vs_weighted_diverge_on_same_shifts
        grounds:
          - calculations.tip_pool_distribution
          - entities.TipPool.fields.distribution_mode
          - entities.TipAllocation.fields.amount_cents
          - state_machines.TipPool.ACCUMULATING_to_DISTRIBUTED
        distinguishing_aspect: |
          Tip-pool domain (different entity from the Check subtotal above): identical shifts and pooled_cents=10000
          split EVEN_BY_HOURS yield [6154,3846], but WEIGHTED_BY_ROLE yield [7619,2381] — same data, two algorithms,
          different per-shift payouts.
        test_recipe:
          setup:
            - "Restaurant; clock 2026-06-01T20:00:00Z."
            - "StaffMember SERVER weight 10000 with shift 600..1080 (hours_x100=800); StaffMember BUSSER weight 5000 with shift 1020..1320 (hours_x100=500), both business_date 2026-06-01."
            - "A check is closed with a payment carrying tip 10000, contributing pooled_cents=10000 to the 2026-06-01 pool created with distribution_mode WEIGHTED_BY_ROLE."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R2", tax_rate_bps: 0, large_party_threshold: 8, auto_gratuity_bps: 2000, comp_cap_bps: 10000 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-01T20:00:00Z" }
              as: Manager
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Srv", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { srv: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Bus", role: "BUSSER", tip_weight_bps: 5000 }
              as: Manager
              captures: { bus: $.data.id }
            - call: "POST /staff-shifts"
              payload: { restaurant_id: "${rid}", staff_id: "${srv}", business_date: "2026-06-01", clock_in_minute: 600, clock_out_minute: 1080 }
              as: Manager
            - call: "POST /staff-shifts"
              payload: { restaurant_id: "${rid}", staff_id: "${bus}", business_date: "2026-06-01", clock_in_minute: 1020, clock_out_minute: 1320 }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Soda", station: "BAR", base_price_cents: 500, happy_hour_price_cents: 500, initial_available_count: 50 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${srv}", party_size: 2 }
              as: Server
              as_user_id: "${srv}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${srv}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${srv}"
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${srv}"
            - call: "POST /tip-pools"
              payload: { restaurant_id: "${rid}", business_date: "2026-06-01", distribution_mode: "WEIGHTED_BY_ROLE" }
              as: Manager
              captures: { pool: $.data.id }
            - call: "POST /checks/${chk}/present"
              payload: {}
              as: Server
              as_user_id: "${srv}"
            - call: "POST /payments"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", amount_cents: 500, tip_cents: 10000, method: "CARD" }
              as: Server
              as_user_id: "${srv}"
            - call: "POST /checks/${chk}/close"
              payload: {}
              as: Server
              as_user_id: "${srv}"
          trigger:
            - call: "POST /tip-pools/${pool}/distribute"
              payload: {}
              as: Manager
              captures: { dist: $.data.distributed_cents }
          assert:
            - "TipPool.${pool}.pooled_cents == 10000"
            - "TipPool.${pool}.distributed_cents == 10000"
            - "the TipAllocation for the SERVER shift has amount_cents == 7619 and the BUSSER shift == 2381 (WEIGHTED_BY_ROLE), which differ from the EVEN_BY_HOURS split [6154,3846]"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_subtotal_rounds_per_line_then_sums_mode_b
        grounds:
          - calculations.final_check_subtotal
          - entities.OrderItem.fields.line_subtotal_cents
          - state_machines.Check.OPEN_to_PRESENTED
        distinguishing_aspect: |
          Mode (b) pinned rounding order: final_subtotal computes each line (qty*price + qty*Σsurcharge) as an
          integer-cent value and sums the lines — round-per-line-then-sum — distinct from any sum-then-round order.
          Two lines at 1900 and 1605 sum to 3505.
        test_recipe:
          setup:
            - "Restaurant tax_rate_bps=0; clock outside any happy-hour window (no windows created)."
            - "MenuItem A base=950 (qty 2, modifier 0) → line 1900; MenuItem B base=535 (qty 3, modifier 0) → line 1605; both in one fired course."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R3", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-02T10:00:00Z" }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "A", station: "SAUTE", base_price_cents: 950, happy_hour_price_cents: 950, initial_available_count: 50 }
              as: Manager
              captures: { mia: $.data.id }
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "B", station: "FRY", base_price_cents: 535, happy_hour_price_cents: 535, initial_available_count: 50 }
              as: Manager
              captures: { mib: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mia}", quantity: 2 }
              as: Server
              as_user_id: "${sm}"
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mib}", quantity: 3 }
              as: Server
              as_user_id: "${sm}"
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
          trigger:
            - call: "POST /checks/${chk}/present"
              payload: {}
              as: Server
              as_user_id: "${sm}"
              captures: { fin: $.data.final_subtotal_cents }
          assert:
            - "Check.${chk}.final_subtotal_cents == 3505"

      - name: auto_gratuity_keys_off_comped_subtotal_pinned_eval_order_mode_c
        grounds:
          - calculations.auto_gratuity
          - entities.Check.fields.comp_total_cents
          - entities.Check.fields.auto_gratuity_cents
          - entities.Check.fields.total_due_cents
          - state_machines.OrderItem.FIRED_to_COMPED
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: total_due = comped_subtotal + tax + auto_gratuity, where auto_gratuity
          and tax both key off comped_subtotal (= base_subtotal − capped comp_total). With base 1900, comp 800 →
          comped_subtotal 1100, gratuity round(1100*0.20)=220, tax 0, total 1320 — only well-defined because the
          order resolves comp→comped_subtotal→gratuity, not gratuity-on-base.
        test_recipe:
          setup:
            - "Restaurant tax_rate_bps=0, auto_gratuity_bps=2000, large_party_threshold=8, comp_cap_bps=10000; clock 2026-06-02 10:00, no happy-hour window."
            - "One fired course on a party_size=8 check holds item X (base 1200 + modifier 700 = line 1900) and item Y (base 800 = line 800); base_subtotal = 2700."
            - "Item Y is COMPED (comp_total 800) → comped_subtotal = 1900; gratuity = round_half_up(1900*0.20) = 380; tax 0; total_due = 1900 + 0 + 380 = 2280."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R4", tax_rate_bps: 0, auto_gratuity_bps: 2000, large_party_threshold: 8, comp_cap_bps: 10000 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-02T10:00:00Z" }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "X", station: "GRILL", base_price_cents: 1200, happy_hour_price_cents: 1200, initial_available_count: 50 }
              as: Manager
              captures: { mix: $.data.id }
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Y", station: "COLD", base_price_cents: 800, happy_hour_price_cents: 800, initial_available_count: 50 }
              as: Manager
              captures: { miy: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 10 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 8 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 8 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mix}", quantity: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { oix: $.data.id }
            - call: "POST /item-modifiers"
              payload: { restaurant_id: "${rid}", order_item_id: "${oix}", name: "truffle", surcharge_cents: 700 }
              as: Server
              as_user_id: "${sm}"
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${miy}", quantity: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { oiy: $.data.id }
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
            - call: "POST /order-items/${oiy}/comp"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /checks/${chk}/present"
              payload: {}
              as: Server
              as_user_id: "${sm}"
              captures: { ct: $.data.comp_total_cents, ag: $.data.auto_gratuity_cents, td: $.data.total_due_cents }
          assert:
            - "Check.${chk}.comp_total_cents == 800"
            - "Check.${chk}.final_subtotal_cents == 2700"
            - "Check.${chk}.auto_gratuity_cents == 380"
            - "Check.${chk}.total_due_cents == 2280"

  # =========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: check_cyclic_open_present_reopen_open
        grounds:
          - state_machines.Check.OPEN_to_PRESENTED
          - state_machines.Check.PRESENTED_to_OPEN
          - entities.Check.fields.final_subtotal_cents
        distinguishing_aspect: |
          Check exhibits a cycle OPEN→PRESENTED→OPEN: present locks final_subtotal_cents, reopen (only while
          unpaid) clears it back to null and returns the check to OPEN — a genuine A→B→A loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Restaurant tax 0; a party_size=2 check with one fired item base 1000 qty 1 (clock 2026-06-02 10:00, no window)."
            - "Check presented once (final_subtotal_cents locked = 1000) with zero payments."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R5", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-02T10:00:00Z" }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Plate", station: "GRILL", base_price_cents: 1000, happy_hour_price_cents: 1000, initial_available_count: 50 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${sm}"
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
            - call: "POST /checks/${chk}/present"
              payload: {}
              as: Server
              as_user_id: "${sm}"
          trigger:
            - call: "POST /checks/${chk}/reopen"
              payload: {}
              as: Server
              as_user_id: "${sm}"
              captures: { st: $.data.status, fin: $.data.final_subtotal_cents }
          assert:
            - "Check.${chk}.status == OPEN"
            - "Check.${chk}.final_subtotal_cents == null"

      - name: order_item_branching_fired_to_comped_vs_served_divergent_effects
        grounds:
          - state_machines.OrderItem.FIRED_to_SERVED
          - state_machines.OrderItem.FIRED_to_COMPED
          - state_machines.OrderItem.FIRED_to_VOIDED
          - entities.OrderItem.fields.comp_amount_cents
          - entities.MenuItem.fields.available_count
        distinguishing_aspect: |
          OrderItem branches FIRED→{SERVED, VOIDED, COMPED} with divergent side-effect sets (different entity from
          Check): COMP sets comp_amount_cents and keeps the line at gross WITHOUT restoring available_count; SERVE
          changes nothing else; VOID restores available_count and drops the line from the subtotal — three branches
          off one state with genuinely different effects, on a different entity than Rule-3 instance 1.
        test_recipe:
          setup:
            - "Restaurant tax 0; MenuItem base 1000, initial_available_count=5; clock 2026-06-02 10:00."
            - "A party_size=2 check with one fired course holding ONE item qty 1 (so available_count is 4 after fire)."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R6", tax_rate_bps: 0, comp_cap_bps: 10000 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-02T10:00:00Z" }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Item", station: "GRILL", base_price_cents: 1000, happy_hour_price_cents: 1000, initial_available_count: 5 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { oi: $.data.id }
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
          trigger:
            - call: "POST /order-items/${oi}/comp"
              payload: {}
              as: Manager
              captures: { ost: $.data.status, comp: $.data.comp_amount_cents }
          assert:
            - "OrderItem.${oi}.status == COMPED"
            - "OrderItem.${oi}.comp_amount_cents == 1000"
            - "MenuItem.${mi}.available_count == 4  (COMP does NOT restore the count: 5→4 on fire, stays 4 on comp — unlike VOID which would restore to 5)"

  # =========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: buss_depth3_free_table_promotes_waitlist_creates_seating
        grounds:
          - state_machines.DiningTable.DIRTY_to_AVAILABLE
          - state_machines.WaitlistEntry.WAITING_to_PROMOTED
          - state_machines.WaitlistEntry.PROMOTED_to_SEATED
          - entities.WaitlistEntry.fields.seating_id
          - entities.DiningTable.fields.occupancy_status
        distinguishing_aspect: |
          Depth-3 chain from a single buss: DiningTable DIRTY→AVAILABLE (link1) causes head WaitlistEntry
          WAITING→PROMOTED (link2, caused by the table freeing), which causes creation of a Seating and
          WaitlistEntry PROMOTED→SEATED (link3, caused by the promotion). Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "Restaurant; clock 2026-06-03T12:00:00Z."
            - "Table capacity 4; a walk-in seating opened on it then cleared (table now DIRTY)."
            - "A WaitlistEntry party_size=2 is WAITING (added before buss)."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R7", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-03T12:00:00Z" }
              as: Manager
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 3 }
              as: Host
              captures: { seat1: $.data.id }
            - call: "POST /seatings/${seat1}/clear"
              payload: {}
              as: Host
            - call: "POST /waitlist"
              payload: { restaurant_id: "${rid}", party_name: "Lee", party_size: 2 }
              as: Host
              captures: { wl: $.data.id }
            - call: "GET /tables/${tbl}"
              payload: {}
              as: Host
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /tables/${tbl}/buss"
              payload: { expected_table_version: "${tv}" }
              as: Host
              captures: { occ: $.data.occupancy_status }
          assert:
            - "WaitlistEntry.${wl}.status == SEATED"
            - "WaitlistEntry.${wl}.seating_id != null"
            - "DiningTable.${tbl}.occupancy_status == SEATED  (re-seated by the promotion)"

      - name: void_item_depth2_restores_86_count_and_subtotal
        grounds:
          - state_machines.OrderItem.FIRED_to_VOIDED
          - entities.MenuItem.fields.available_count
          - entities.Check.fields.provisional_subtotal_cents
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (void, not buss): OrderItem FIRED→VOIDED (link1) causes
          MenuItem.available_count to be restored by quantity (link2, caused by the void) and the line to drop from
          provisional_subtotal — a distinct propagation pattern from the buss chain.
        test_recipe:
          setup:
            - "Restaurant tax 0; MenuItem base 1000 initial_available_count=5; clock 2026-06-02 10:00."
            - "A check with one fired course holding one item qty 2 (available_count 5→3 after fire; provisional_subtotal 2000)."
