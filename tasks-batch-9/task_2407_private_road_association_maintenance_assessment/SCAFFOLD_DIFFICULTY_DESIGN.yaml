  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: ballot_proposal_state_error_outranks_member_standing_error
        grounds:
          - "validations[priority=19]"
          - "validations[priority=51]"
          - "endpoints[POST /ballots]"
          - "state_machines.SpecialAssessmentProposal.BALLOTING_to_DRAFT"
        distinguishing_aspect: >
          One POST /ballots violates priority 19 (proposal.status == BALLOTING,
          ERR_PROPOSAL_NOT_BALLOTING) and priority 51 (voter is
          GOOD_STANDING, ERR_MEMBER_NOT_IN_GOOD_STANDING) at the same time. The
          scaffold's ordering demands ERR_PROPOSAL_NOT_BALLOTING. The trap is
          that the standing check is the eligibility check an implementation
          naturally performs while resolving the member and computing
          weight_snapshot, so a member-first implementation answers
          ERR_MEMBER_NOT_IN_GOOD_STANDING. The pair is disambiguated by a
          control call: re-opening balloting removes the priority-19 violation
          only, and the same cast then must return
          ERR_MEMBER_NOT_IN_GOOD_STANDING, proving both rules are live and only
          their order was under test.
        test_recipe:
          setup: |
            Build SINGLE_4M. Draft a PER_PARCEL GRADING proposal and open
            balloting with balloting_closes_at 2026-10-05T00:00:00Z. Cast
            nothing, advance the clock to 2026-10-06 and tally: eligible_weight_total
            is 1 and counted_weight_total is 0, so quorum fails, and with
            failed_tally_count 0 (< 2) the proposal drops back to DRAFT rather
            than REJECTED. Then advance the clock to 2026-12-15 (due_date
            2026-11-15 plus 30 grace days) and initiate a NOTICE on the member's
            charge: that alone drives the charge OPEN -> DELINQUENT and the
            member's standing_status GOOD_STANDING -> DELINQUENT with no
            effectuation. The proposal is now DRAFT and the only voter is
            DELINQUENT.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Pine Hollow Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Pine Hollow Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB120-P41", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P41" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_id: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_id}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "GET /assessment-charges?roll_id=${roll_id}"
              payload: {}
              as: AssessmentClerk
              captures: { charge_id: "$.data[0].id" }
            - call: "POST /special-assessment-proposals"
              payload: { road_segment_id: "${seg_id}", project_type: "GRADING", title: "Autumn regrade", estimated_cost_cents: 1500000, cost_allocation_method: "EQUAL_SHARE", voting_basis: "PER_PARCEL" }
              as: BoardTreasurer
              captures: { prop_id: "$.data.id" }
            - call: "POST /special-assessment-proposals/${prop_id}/open-balloting"
              payload: { balloting_closes_at: "2026-10-05T00:00:00Z" }
              as: BoardTreasurer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T00:00:00Z" }
              as: BoardTreasurer
            - call: "POST /special-assessment-proposals/${prop_id}/tally"
              payload: {}
              as: BoardTreasurer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: BoardTreasurer
            - call: "POST /assessment-charges/${charge_id}/delinquency-actions"
              payload: { action_type: "NOTICE" }
              as: BoardTreasurer
              as_user_id: "bt-user-1"
            - call: "GET /special-assessment-proposals/${prop_id}"
              payload: {}
              as: BoardTreasurer
              captures: { prop_v_draft: "$.data.version" }
          trigger:
            - call: "POST /ballots"
              payload: { proposal_id: "${prop_id}", member_id: "${m1_id}", choice: "YES", expected_proposal_version: "${prop_v_draft}" }
              as: MemberOwner
              as_user_id: "${m1_id}"
              captures: { conflict_error: "$.data.error_id" }
            - call: "POST /special-assessment-proposals/${prop_id}/open-balloting"
