            - "GET /pipeline-nominations?contract_id=${contract_id}&limit=10&offset=0 returns total_count == 0"

      - name: hazardous_condensate_without_hw_manifest_is_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=90]", "errors[ERR_CONDENSATE_MANIFEST_REQUIRED]", "entities.CondensateHaul.fields.is_hazardous"]
        distinguishing_aspect: "The manifest rule applies only when is_hazardous is true: the same manifest number 'MAN-4471' is accepted for a non-hazardous haul and refused with 422 ERR_CONDENSATE_MANIFEST_REQUIRED for a hazardous one, which needs an 'HW-' prefix."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "One LandfillSite, one GasWell W-01 and one IN_PROGRESS WorkOrder whose window 2026-08-09T00:00:00Z to 2026-08-11T00:00:00Z contains the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /work-orders"
              payload: { well_id: "${w1_id}", work_type: "SUMP_PUMP_SERVICE", window_start: "2026-08-09T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }
              as: WellfieldTechnician
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/status"
              payload: { to_status: "IN_PROGRESS" }
              as: WellfieldTechnician
          trigger:
            - call: "POST /work-orders/${wo_id}/condensate-hauls"
              payload: { gallons: 120.0, disposal_manifest_no: "MAN-4471", hauled_at: "2026-08-10T02:00:00Z", is_hazardous: true }
              as: WellfieldTechnician
              captures: { err_id: $.data.error_id }
            - call: "POST /work-orders/${wo_id}/condensate-hauls"
              payload: { gallons: 120.0, disposal_manifest_no: "HW-4471", hauled_at: "2026-08-10T02:00:00Z", is_hazardous: true }
              as: WellfieldTechnician
              captures: { haul_id: $.data.id }
          assert:
            - "The first haul returns HTTP 422 with data.error_id == 'ERR_CONDENSATE_MANIFEST_REQUIRED'"
            - "The second haul returns HTTP 201 and CondensateHaul.${haul_id}.disposal_manifest_no == 'HW-4471'"
            - "WorkOrder.${wo_id}.condensate_gallons_removed == 120.0"
            - "GET /work-orders/${wo_id}/condensate-hauls?limit=10&offset=0 returns total_count == 1"

      - name: work_order_start_outside_its_window_is_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=110]", "errors[ERR_WORK_ORDER_WINDOW_NOT_ACTIVE]", "state_machines.WorkOrder.PLANNED_to_IN_PROGRESS"]
        distinguishing_aspect: "A job may only start while current_utc is inside [window_start, window_end]; with the clock at 2026-08-10T00:00:00Z and a window opening 2026-08-12T08:00:00Z the start returns 422 ERR_WORK_ORDER_WINDOW_NOT_ACTIVE and the well is never locked out."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "One LandfillSite, one GasWell W-01 with a GOOD reading at flow 480.0, and one PLANNED WorkOrder with window 2026-08-12T08:00:00Z to 2026-08-12T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-09T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /work-orders"
              payload: { well_id: "${w1_id}", work_type: "WELL_RETUNE", window_start: "2026-08-12T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }
              as: WellfieldTechnician
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/status"
              payload: { to_status: "IN_PROGRESS" }
              as: WellfieldTechnician
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "data.error_id == 'ERR_WORK_ORDER_WINDOW_NOT_ACTIVE'"
            - "WorkOrder.${wo_id}.status == PLANNED"
            - "WorkOrder.${wo_id}.actual_start_at is null"
            - "GasWell.${w1_id}.operating_state == ONLINE"
            - "GasWell.${w1_id}.current_flow_scfm == 480.0"

      - name: upgrading_without_enough_collected_flow_is_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=90]", "errors[ERR_INSUFFICIENT_FEED_FLOW]", "state_machines.ProcessingPlant.STARTUP_to_UPGRADING", "entities.LandfillSite.fields.collected_flow_scfm"]
        distinguishing_aspect: "STARTUP -> UPGRADING is gated on the site's collected_flow_scfm: with no readings at all the site reports 0.0 against min_feed_scfm 900.0, so the call returns 422 ERR_INSUFFICIENT_FEED_FLOW and process_mode stays STARTUP."
        test_recipe:
          setup: ["One LandfillSite, two GasWells created but never read, and one ProcessingPlant in STARTUP with min_feed_scfm 900.0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-02", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w2_id: $.data.id }
          trigger:
            - call: "POST /plants/${plant_id}/status"
              payload: { process_mode: "UPGRADING" }
              as: PlantOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "data.error_id == 'ERR_INSUFFICIENT_FEED_FLOW'"
            - "ProcessingPlant.${plant_id}.process_mode == STARTUP"
            - "ProcessingPlant.${plant_id}.spec_status == ON_SPEC"
            - "LandfillSite.${site_id}.collected_flow_scfm == 0.0"

      - name: royalty_statement_for_a_period_still_running_is_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=110]", "errors[ERR_ROYALTY_PERIOD_NOT_CLOSED]", "calculations.royalty_settlement"]
        distinguishing_aspect: "The settlement month must have fully elapsed against the logical clock; at 2026-08-20T00:00:00Z a statement for period 2026-08 returns 422 ERR_ROYALTY_PERIOD_NOT_CLOSED."
        test_recipe:
          setup: ["One LandfillSite; logical clock at 2026-08-20T00:00:00Z, still inside the 2026-08 settlement window."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id, site_v1: $.data.version }
          trigger:
            - call: "POST /royalty-statements"
              payload: { site_id: "${site_id}", period: "2026-08", expected_site_version: "${site_v1}" }
              as: ProjectAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "data.error_id == 'ERR_ROYALTY_PERIOD_NOT_CLOSED'"
            - "GET /royalty-statements?site_id=${site_id}&limit=10&offset=0 returns total_count == 0"
            - "LandfillSite.${site_id}.royalty_payable_usd == 0.0"

  - section: endpoints
    instances:
