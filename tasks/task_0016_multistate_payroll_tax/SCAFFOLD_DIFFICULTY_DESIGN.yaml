              payload: { pay_period_start: "2025-10-01T00:00:00.000Z", pay_period_end: "2025-10-15T23:59:59.999Z", pay_date: "2025-10-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
