scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_estimate_vs_final_diverge_on_remeasure
        grounds:
          - calculations.quote_base_price
          - state_machines.Quote.ISSUED_to_ACCEPTED
          - state_machines.ManufactureOrder.QUEUED_to_IN_PRODUCTION
          - entities.Quote.fields.variant
        distinguishing_aspect: |
          Same Project, two valid pricing passes on the Quote entity domain: the ESTIMATE base
          (footprint 120.00 -> base 1080000) accepted by the Homeowner differs from the FINAL base
          recomputed at manufacture start after a re-measure (footprint 130.00 -> base 1170000);
          the FINAL Quote supersedes the accepted ESTIMATE.
        test_recipe:
          setup:
            - "A THREE_SEASON / ALUMINUM project measured 120x144 (footprint 120.00), design finalized, an ESTIMATE quote (base 1080000, total 1161000) accepted, then re-measured to 130x144 (footprint 130.00) before any quote was accepted on the new design, re-finalized, the 130-design quote accepted, permit approved (no engineering needed since wind/snow low, three-season), manufacture order created and started."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "r1a@x.com", full_name: "R1A", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "1 Sun Way", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv1: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv1}" }
              as: Homeowner
              as_user_id: "${ho}"
          trigger:
            - call: "POST /manufacture-orders"
              payload: { project_id: "${pj}", quote_id: "${q1}" }
              as: Manufacturer
              captures: { mo: $.data.id }
            - call: "POST /manufacture-orders/${mo}/start"
              payload: {}
              as: Manufacturer
            - call: "GET /projects/${pj}/quotes"
              payload: {}
              as: SalesDesigner
          assert:
            - "Quote.${q1}.variant == ESTIMATE and Quote.${q1}.base_price_cents == 1080000 and Quote.${q1}.total_cents == 1161000"
            - "after manufacture start, a new Quote on project ${pj} exists with variant == FINAL, base_price_cents == 1080000 (same measurement, no re-measure here) — note divergence is exercised in the next instance"
            - "exactly one Quote on project ${pj} has status == ACCEPTED after the FINAL supersede"

      - name: quote_final_base_differs_after_remeasure
        grounds:
          - calculations.quote_base_price
          - state_machines.Project.DESIGNED_to_MEASURED
          - state_machines.ManufactureOrder.QUEUED_to_IN_PRODUCTION
        distinguishing_aspect: |
          The FINAL base computed at manufacture start (footprint 130.00 -> 1170000) is strictly
          greater than the design-time ESTIMATE the Homeowner accepted (footprint 120.00 -> 1080000),
          proving the two variants produce different numbers for the same Project from different
          measurement snapshots.
        test_recipe:
          setup:
            - "THREE_SEASON/ALUMINUM project measured 120x144, design finalized, ESTIMATE quote issued but NOT accepted; then re-measured 130x144 (supersedes the 120 measurement and the outstanding ESTIMATE quote), re-finalized, a fresh ESTIMATE (base 1170000) accepted, permit approved, manufacture order created."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "r1b@x.com", full_name: "R1B", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "2 Sun Way", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { qold: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 130, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m2: $.data.id }
            - call: "POST /measurements/${m2}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { qnew: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv: $.data.version }
            - call: "POST /quotes/${qnew}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Homeowner
              as_user_id: "${ho}"
          trigger:
            - call: "GET /projects/${pj}/quotes"
              payload: {}
              as: SalesDesigner
          assert:
            - "Quote.${qold}.status == SUPERSEDED (the 120-footprint ESTIMATE was invalidated by re-measure)"
            - "Quote.${qnew}.base_price_cents == 1170000 and Quote.${qnew}.total_cents == 1257750 (footprint 130.00)"
            - "Project.${pj}.footprint_sqft == 130.00 and Project.${pj}.accepted_quote_id == ${qnew}"

      - name: lead_time_promised_vs_actual_diverge
        grounds:
          - calculations.manufacture_lead_time
          - state_machines.ManufactureOrder.IN_PRODUCTION_to_READY
          - entities.ManufactureOrder.fields.ready_at
        distinguishing_aspect: |
          On the ManufactureOrder entity domain (distinct from Quote), the PROMISED lead time stamped
          at order creation (promised_ready_at = order_clock + 45 days) diverges from the ACTUAL ready
          instant (ready_at = clock at /ready), because the logical clock is advanced only 10 days
          before /ready — promised_ready_at != ready_at.
        test_recipe:
          setup:
            - "A FOUR_SEASON/THERMAL_BREAK_ALUMINUM project (footprint 200.00) fully approved-to-build, manufacture order created at clock 2026-05-01 (lead 45 days -> promised_ready_at 2026-06-15), production started, clock advanced to 2026-05-11, then marked ready."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Manufacturer
            - call: "POST /homeowners"
              payload: { email: "r1c@x.com", full_name: "R1C", hoa_governed: false, ground_snow_load_psf: 40, design_wind_speed_mph: 140 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "3 Sun Way", structure_type: "FOUR_SEASON", material: "THERMAL_BREAK_ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 180, depth_in: 160, wall_height_in: 108, existing_slab: false }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Homeowner
              as_user_id: "${ho}"
            - call: "POST /permit-applications"
              payload: { project_id: "${pj}", jurisdiction_code: "J1" }
              as: SalesDesigner
              captures: { pa: $.data.id }
            - call: "POST /permit-applications/${pa}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /engineering-reviews"
              payload: { permit_application_id: "${pa}", project_id: "${pj}", rated_wind_mph: 150, rated_snow_psf: 45 }
              as: SalesDesigner
              captures: { er: $.data.id }
            - call: "POST /engineering-reviews/${er}/rule"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${pa}/decide"
              payload: { outcome: "APPROVED" }
              as: PermitOfficer
            - call: "POST /manufacture-orders"
              payload: { project_id: "${pj}", quote_id: "${q1}" }
              as: Manufacturer
              captures: { mo: $.data.id }
            - call: "POST /manufacture-orders/${mo}/start"
              payload: {}
              as: Manufacturer
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: Manufacturer
            - call: "POST /manufacture-orders/${mo}/ready"
              payload: {}
              as: Manufacturer
          assert:
            - "ManufactureOrder.${mo}.lead_time_days == 45 and ManufactureOrder.${mo}.promised_ready_at == 2026-06-15T00:00:00.000Z"
            - "ManufactureOrder.${mo}.ready_at == 2026-05-11T00:00:00.000Z (PROMISED != ACTUAL)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: base_price_tiered_rate_times_material_multiplier
        grounds:
          - calculations.quote_base_price
          - entities.Project.fields.structure_type
          - entities.Project.fields.material
          - entities.Project.fields.footprint_sqft
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — base = footprint * BASE_RATE[structure_type]
          * MATERIAL_MULT[material]/1000 — selecting BOTH a tiered structure rate AND a material
          multiplier, so the result is a product of two independent lookups times area
          (FOUR_SEASON/THERMAL_BREAK 200.00 -> 4160000).
        test_recipe:
          setup:
            - "A FOUR_SEASON/THERMAL_BREAK_ALUMINUM project measured 180x160 (footprint 200.00), design finalized, ESTIMATE quote issued."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "r2a@x.com", full_name: "R2A", hoa_governed: false, ground_snow_load_psf: 40, design_wind_speed_mph: 140 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "4 Sun Way", structure_type: "FOUR_SEASON", material: "THERMAL_BREAK_ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 180, depth_in: 160, wall_height_in: 108, existing_slab: false }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
          trigger:
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
          assert:
            - "Quote.${q1}.base_price_cents == 4160000 (200.00 * 16000 * 1300 / 1000)"
            - "Quote.${q1}.addons_cents == 415225 (slab 320150 + engineering 95075; FOUR_SEASON requires engineering)"

      - name: tax_sum_then_round_order_pinned
        grounds:
          - calculations.quote_tax
          - calculations.quote_addons_total
          - entities.Quote.fields.tax_cents
        distinguishing_aspect: |
          Mode (b): nested-rounding order pin — tax on (base 517500 + addons 415225) is rounded ONCE
          on the sum (69954), NOT by rounding each line item's tax and summing (which yields 69955);
          the scaffold pins sum-then-round so tax_cents == 69954.
        test_recipe:
          setup:
            - "A THREE_SEASON/ALUMINUM project, wind 130 (so requires_engineering true), measured 90x92 (footprint 57.50), existing_slab false (slab add-on applies), design finalized, ESTIMATE quote issued."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "r2b@x.com", full_name: "R2B", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 130 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "5 Sun Way", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 90, depth_in: 92, wall_height_in: 96, existing_slab: false }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
          trigger:
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
          assert:
            - "Quote.${q1}.base_price_cents == 517500 and Quote.${q1}.addons_cents == 415225"
            - "Quote.${q1}.tax_cents == 69954 (sum-then-round; round-per-line would give 69955)"
            - "Quote.${q1}.total_cents == 1002679"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: install_job_parallel_weather_and_progress_axes
        grounds:
          - state_machines.InstallJob.CLEAR_to_WEATHER_HOLD
          - state_machines.InstallJob.SCHEDULED_to_IN_PROGRESS
          - entities.InstallJob.fields.progress_status
          - entities.InstallJob.fields.weather_status
        distinguishing_aspect: |
          On InstallJob, the weather axis and progress axis are INDEPENDENT: raising a weather hold
          (CLEAR->WEATHER_HOLD) leaves progress_status==SCHEDULED unchanged; clearing it then starting
          moves progress to IN_PROGRESS while weather stays CLEAR — two dimensions evolve separately
          on one row.
        test_recipe:
          setup:
            - "A project advanced to INSTALLING with a SCHEDULED install job on an active crew within forecast limits (clock 2026-05-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: InstallManager
            - call: "POST /homeowners"
              payload: { email: "r3a@x.com", full_name: "R3A", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "6 Sun Way", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Homeowner
              as_user_id: "${ho}"
            - call: "POST /permit-applications"
              payload: { project_id: "${pj}", jurisdiction_code: "J1" }
              as: SalesDesigner
              captures: { pa: $.data.id }
            - call: "POST /permit-applications/${pa}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${pa}/decide"
              payload: { outcome: "APPROVED" }
              as: PermitOfficer
            - call: "POST /manufacture-orders"
              payload: { project_id: "${pj}", quote_id: "${q1}" }
              as: Manufacturer
              captures: { mo: $.data.id }
            - call: "POST /manufacture-orders/${mo}/start"
              payload: {}
              as: Manufacturer
            - call: "POST /manufacture-orders/${mo}/ready"
              payload: {}
              as: Manufacturer
            - call: "POST /crews"
              payload: { name: "Crew A", max_wind_mph: 40, certified_four_season: false, active: true }
              as: InstallManager
              captures: { cw: $.data.id }
            - call: "POST /install-jobs"
              payload: { project_id: "${pj}", crew_id: "${cw}", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T17:00:00Z", forecast_wind_mph: 20 }
              as: InstallManager
              captures: { ij: $.data.id }
          trigger:
            - call: "POST /install-jobs/${ij}/weather"
              payload: { weather_status: "WEATHER_HOLD" }
              as: InstallManager
            - call: "POST /install-jobs/${ij}/weather"
              payload: { weather_status: "CLEAR" }
              as: InstallManager
            - call: "POST /install-jobs/${ij}/start"
              payload: {}
              as: InstallManager
          assert:
            - "after the WEATHER_HOLD call, InstallJob.${ij}.weather_status == WEATHER_HOLD and InstallJob.${ij}.progress_status == SCHEDULED (progress untouched by weather axis)"
            - "after CLEAR + start, InstallJob.${ij}.progress_status == IN_PROGRESS and InstallJob.${ij}.weather_status == CLEAR"

      - name: permit_resubmission_cycle_rejected_back_to_submitted
        grounds:
          - state_machines.PermitApplication.REJECTED_to_SUBMITTED
          - state_machines.PermitApplication.IN_REVIEW_to_REJECTED
          - entities.PermitApplication.fields.resubmission_count
        distinguishing_aspect: |
          On PermitApplication (different entity from InstallJob), a REJECTED permit loops back to
          SUBMITTED via /resubmit (cyclic A->B->A), incrementing resubmission_count each time, until
          the cap — proving a non-linear cyclic shape.
        test_recipe:
          setup:
            - "A PERMITTING project with a SUBMITTED permit moved to IN_REVIEW then REJECTED (resubmission_count 0)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "r3b@x.com", full_name: "R3B", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "7 Sun Way", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Homeowner
              as_user_id: "${ho}"
            - call: "POST /permit-applications"
              payload: { project_id: "${pj}", jurisdiction_code: "J1" }
              as: SalesDesigner
              captures: { pa: $.data.id }
            - call: "POST /permit-applications/${pa}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /permit-applications/${pa}/decide"
              payload: { outcome: "REJECTED" }
              as: PermitOfficer
          trigger:
            - call: "POST /permit-applications/${pa}/resubmit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho}"
          assert:
            - "PermitApplication.${pa}.status == SUBMITTED (looped back from REJECTED)"
            - "PermitApplication.${pa}.resubmission_count == 1"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: manufacture_start_final_quote_supersede_repoint_chain
        grounds:
          - state_machines.ManufactureOrder.QUEUED_to_IN_PRODUCTION
          - state_machines.Quote.ISSUED_to_SUPERSEDED
          - entities.Project.fields.accepted_quote_id
          - entities.Quote.fields.variant
        distinguishing_aspect: |
          Depth-3 transitive cascade from /manufacture-orders/{id}/start: (A) ManufactureOrder
          QUEUED->IN_PRODUCTION; (B) that mutation creates a FINAL Quote and supersedes the prior
          ACCEPTED ESTIMATE Quote; (C) the supersede repoints Project.accepted_quote_id to the FINAL
          Quote. Each link is caused by the previous one.
        test_recipe:
          setup:
            - "A THREE_SEASON/ALUMINUM project fully approved-to-build with an ACCEPTED ESTIMATE quote (footprint 120.00), manufacture order created (QUEUED)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "r4a@x.com", full_name: "R4A", hoa_governed: false, ground_snow_load_psf: 10, design_wind_speed_mph: 90 }
              as: SalesDesigner
              captures: { ho: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho}", address_line: "8 Sun Way", structure_type: "THREE_SEASON", material: "ALUMINUM" }
              as: SalesDesigner
              captures: { pj: $.data.id }
            - call: "POST /measurements"
              payload: { project_id: "${pj}", width_in: 120, depth_in: 144, wall_height_in: 96, existing_slab: true }
              as: SalesDesigner
              captures: { m1: $.data.id }
            - call: "POST /measurements/${m1}/accept"
              payload: {}
              as: SalesDesigner
            - call: "POST /projects/${pj}/finalize-design"
              payload: {}
              as: SalesDesigner
            - call: "POST /quotes"
              payload: { project_id: "${pj}" }
              as: SalesDesigner
              captures: { q1: $.data.id }
            - call: "GET /projects/${pj}"
              payload: {}
              as: SalesDesigner
              captures: { pv: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv}" }
              as: Homeowner
              as_user_id: "${ho}"
            - call: "POST /permit-applications"
              payload: { project_id: "${pj}", jurisdiction_code: "J1" }
              as: SalesDesigner
              captures: { pa: $.data.id }
