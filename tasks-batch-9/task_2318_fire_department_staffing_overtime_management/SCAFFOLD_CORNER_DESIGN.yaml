              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st80}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh80: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh80}/publish"
