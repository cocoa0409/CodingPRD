        excluded_because:
          difficulty_instance: "transitive_cascade / full_return_clawback_cascade_depth_four"
          rationale: "The §1.8 instance already walks the full four-hop cascade end to end — FULL_RETURN adjustment -> Conversion.validation_status CLAWED_BACK -> REVERSAL ledger row -> PayoutLine detachment and batch total recompute -> Affiliate pending_balance decrement — and asserts the ordering sensitivity (the line must be detached before the batch totals are recomputed, or net_payable keeps the reversed amount). A breadth instance here would re-run the same chain with the same asserts."

