  # =====================================================================
  # Rule 3 — non_linear_state_machine on DIFFERENT entities.
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: verification_case_correction_loop_cycle
        grounds:
          - state_machines.VerificationCase
          - state_machines.VerificationDocument
        distinguishing_aspect: |
          Cyclic machine on VerificationCase: DOCUMENTS_REQUESTED -> ... ->
          COMPLETED_CORRECTION_SENT -> DOCUMENTS_REQUESTED (re-verification loop
          when the corrected ISIR is re-selected). A linear pipeline could never
          revisit DOCUMENTS_REQUESTED; the loop must re-arm the 3 required docs
          to REQUESTED on loop entry.
        test_recipe:
          setup:
            - "AidYear OPEN with ACTIVE PELL; Student C SSN 111223333 (SELECTED); ISIR txn 1 imported; case DOCUMENTS_REQUESTED"
            - "Docs: TAX_RETURN_TRANSCRIPT accepted; W2 and HOUSEHOLD_FORM still REQUESTED"
            - "Case moved DOCUMENTS_REQUESTED -> DOCUMENTS_RECEIVED? No: auto-transition requires all 3. Instead drive: all 3 received, begin-review, complete-correction -> COMPLETED_CORRECTION_SENT; then import ISIR txn 2 (SELECTED via cps_selection_flag=true) -> case loops to DOCUMENTS_REQUESTED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { f_pell: "$.data.id" }
            - call: "POST /api/fund-types/${f_pell}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "111223333", full_name: "Casey Loop", email: "c@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_c: "$.data.id" }
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_c}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 4500000, untaxed_income_cents: 0, asset_net_worth_cents: 50000, cps_selection_flag: false }
              as: AidOfficer
            - call: "GET /api/students/${stu_c}/verification-cases"
              payload: {}
              as: AidOfficer
              captures: { vc_c: "$.data[0].id" }
            - call: "GET /api/verification-cases/${vc_c}/documents"
              payload: {}
              as: AidOfficer
              captures: { d1: "$.data[0].id", d2: "$.data[1].id", d3: "$.data[2].id" }
            - call: "POST /api/verification-documents/${d1}/mark-received"
              payload: {}
              as: AidOfficer
            - call: "POST /api/verification-documents/${d2}/mark-received"
              payload: {}
              as: AidOfficer
            - call: "POST /api/verification-documents/${d3}/mark-received"
              payload: {}
              as: AidOfficer
            - call: "POST /api/verification-documents/${d1}/accept"
              payload: {}
              as: AidOfficer
            - call: "POST /api/verification-cases/${vc_c}/begin-review"
              payload: {}
              as: AidOfficer
            - call: "POST /api/verification-cases/${vc_c}/complete-correction"
              payload: { resolution_notes: "AGI mismatch; correction filed" }
              as: AidOfficer
          trigger:
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_c}", aid_year_id: "${ay_id}", transaction_number: 2, received_at: "2026-09-02T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 5200000, untaxed_income_cents: 0, asset_net_worth_cents: 50000, cps_selection_flag: true }
              as: AidOfficer
              captures: { isir2: "$.data.id" }
          assert:
            - "VerificationCase.${vc_c}.status == DOCUMENTS_REQUESTED (looped back)"
            - "VerificationCase.${vc_c}.completed_at == null"
            - "ISIRRecord.${isir2}.is_current == true and transaction 1 is_current == false"

      - name: revision_request_branching_fork_on_package
        grounds:
          - state_machines.RevisionRequest
          - state_machines.AwardPackage
        distinguishing_aspect: |
          Branching fork-join on RevisionRequest (different entity from
          VerificationCase): UNDER_REVIEW forks to APPROVED (repack + new
          notification seq 2) or DENIED (package returns to NOTIFIED with
