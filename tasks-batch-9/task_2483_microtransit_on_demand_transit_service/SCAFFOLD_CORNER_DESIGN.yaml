  - section: rbac
    instances:
      - name: every_role_can_perform_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.ZoneAdmin.exclusive_operations
          - roles.Dispatcher.exclusive_operations
          - roles.DriverUser.exclusive_operations
          - roles.FinanceAnalyst.exclusive_operations
          - roles.FundingAgencyAuditor.exclusive_operations
        distinguishing_aspect: "One unbroken chain crosses all six principals — ZoneAdmin plans and publishes, Dispatcher opens and offers, Rider requests, DriverUser accepts and matching is driven by the Dispatcher, FinanceAnalyst files and FundingAgencyAuditor certifies — so a permission table that is merely permissive-for-one-role cannot pass it."
