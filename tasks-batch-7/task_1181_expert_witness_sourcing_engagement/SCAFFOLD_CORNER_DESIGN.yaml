scaffold_corner_design:

  - section: entities
    instances:
      - name: expert_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Expert.fields.roster_status, entities.Expert.fields.max_concurrent_engagements, entities.Expert.fields.rating_simple]
        distinguishing_aspect: "Minimal create yields roster_status ACTIVE, daubert counts 0, max_concurrent_engagements 5, both ratings 0.0, evaluation_count 0, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "Default Dan", specialty_area: "med" }, as: PlatformAdmin, captures: { ed: $.data.id } }
          trigger:
            - call: "GET /litigation/experts/${ed}"
              as: PlatformAdmin
          assert:
            - "Expert.${ed}.roster_status == ACTIVE"
            - "Expert.${ed}.daubert_challenge_count == 0 and daubert_exclusion_count == 0"
            - "Expert.${ed}.max_concurrent_engagements == 5"
            - "Expert.${ed}.rating_simple == 0.0 and rating_decayed == 0.0 and evaluation_count == 0"
            - "Expert.${ed}.version == 1"

      - name: case_create_missing_required_budget_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Case.fields.budget_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required budget_cents yields ERR_INVALID_REQUEST (400) before any state work."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /litigation/cases"
              payload: { case_number: "CV-X", court: "SDNY", title: "NoBudget", trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: expert_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Expert.fields.rating_decayed]
        distinguishing_aspect: "Client-supplied rating_decayed is ignored; server keeps the computed 0.0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "Inflated Ivy", specialty_area: "med", rating_decayed: 9.9 }, as: PlatformAdmin, captures: { ei: $.data.id } }
          trigger:
            - call: "GET /litigation/experts/${ei}"
              as: PlatformAdmin
          assert:
            - "Expert.${ei}.rating_decayed == 0.0  (client input ignored, computed field wins)"

      - name: expert_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but unknown expert UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /litigation/experts/11111111-2222-4333-8444-555555555555"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: expert_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /litigation/experts]"]
        distinguishing_aspect: "List honors limit/offset with total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["three experts exist"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "P1", specialty_area: "med" }, as: PlatformAdmin }
            - { call: "POST /litigation/experts", payload: { full_name: "P2", specialty_area: "med" }, as: PlatformAdmin }
            - { call: "POST /litigation/experts", payload: { full_name: "P3", specialty_area: "econ" }, as: PlatformAdmin }
          trigger:
            - call: "GET /litigation/experts"
              payload: { limit: 2, offset: 0 }
              as: CaseManager
              as_user_id: "cm-1"
            - call: "GET /litigation/experts"
              payload: { specialty_area: "econ" }
              as: CaseManager
              as_user_id: "cm-1"
          assert:
            - "page 1: total_count == 3, has_more == true, data length == 2"
            - "filtered by specialty_area=econ: total_count == 1, has_more == false"

      - name: roster_status_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Expert.fields.roster_status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "to_status outside {ACTIVE, PROBATION, REMOVED} yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one expert"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "Enum Eve", specialty_area: "med" }, as: PlatformAdmin, captures: { ee: $.data.id } }
          trigger:
            - call: "POST /litigation/experts/${ee}/roster-status"
              payload: { to_status: "FROZEN", rationale: "bad" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: engagement_request_requires_existing_case
        claim_type: parent_relationships
        grounds: [entities.EngagementRequest.fields.case_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Request creation with an unknown case_id fails existence validation (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /litigation/engagement-requests"
              payload: { case_id: "11111111-2222-4333-8444-555555555555", specialty_area: "med" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: evaluation_immutable_record
        claim_type: immutability
        grounds: [entities.Evaluation]
        distinguishing_aspect: "Evaluation has common_fields false: response carries id and created_at but no version/updated_at; no update endpoint exists."
        test_recipe:
          setup: ["one CLOSED engagement (full lifecycle, retainer 0)"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "Imm Ida", specialty_area: "med" }, as: PlatformAdmin, captures: { eim: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-IMM", court: "SDNY", title: "Imm", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { cim: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${cim}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { rim: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${rim}/conflict-checks", payload: { expert_id: "${eim}", adverse_parties: [] }, as: ConflictAnalyst, captures: { ccim: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${ccim}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${rim}/credential-reviews", payload: { expert_id: "${eim}" }, as: CredentialAnalyst, captures: { crim: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${crim}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${rim}", expert_id: "${eim}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { gim: $.data.id } }
            - { call: "POST /litigation/engagements/${gim}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${gim}/sign", payload: {}, as: Expert, as_user_id: "${eim}" }
            - { call: "POST /litigation/engagements/${gim}/fund-retainer", payload: { amount_cents: 0 }, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${gim}/close", payload: {}, as: CaseManager, as_user_id: "cm-1" }
          trigger:
            - call: "POST /litigation/engagements/${gim}/evaluations"
              payload: { overall_score: 4.5, comments: "solid" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { evim: $.data.id }
          assert:
            - "Evaluation.${evim} response has id, created_at, evaluated_at, overall_score 4.5"
            - "Evaluation.${evim} response has no version or updated_at key (immutable record)"

  - section: state_machines
    instances:
      - name: engagement_sign_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Engagement.DRAFT_to_PROPOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "sign is only valid from PROPOSED; calling it on a DRAFT engagement returns ERR_INVALID_STATE and no nda_executed change."
        test_recipe:
          setup: ["engagement created (DRAFT) for a READY request"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "Sig Sam", specialty_area: "med" }, as: PlatformAdmin, captures: { es: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-SIG", court: "SDNY", title: "Sig", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { cs: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${cs}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { rs: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${rs}/conflict-checks", payload: { expert_id: "${es}", adverse_parties: [] }, as: ConflictAnalyst, captures: { ccs: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${ccs}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${rs}/credential-reviews", payload: { expert_id: "${es}" }, as: CredentialAnalyst, captures: { crs: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${crs}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${rs}", expert_id: "${es}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { gs: $.data.id } }
          trigger:
            - call: "POST /litigation/engagements/${gs}/sign"
              payload: {}
              as: Expert
              as_user_id: "${es}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Engagement.${gs}.status == DRAFT and nda_executed == false (no side effects fired)"

      - name: cancelled_schedule_confirm_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.TestimonySchedule.PROPOSED_to_CANCELLED, state_machines.TestimonySchedule.PROPOSED_to_CONFIRMED]
        distinguishing_aspect: "CANCELLED is terminal: confirm after cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE engagement with a PROPOSED schedule that is then cancelled"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "Lock Lou", specialty_area: "med" }, as: PlatformAdmin, captures: { el: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-LCK", court: "SDNY", title: "Lock", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { cl: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${cl}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { rl: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${rl}/conflict-checks", payload: { expert_id: "${el}", adverse_parties: [] }, as: ConflictAnalyst, captures: { ccl: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${ccl}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${rl}/credential-reviews", payload: { expert_id: "${el}" }, as: CredentialAnalyst, captures: { crl: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${crl}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${rl}", expert_id: "${el}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { gl: $.data.id } }
            - { call: "POST /litigation/engagements/${gl}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${gl}/sign", payload: {}, as: Expert, as_user_id: "${el}" }
            - { call: "POST /litigation/engagements/${gl}/fund-retainer", payload: { amount_cents: 0 }, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${gl}/testimony-schedules", payload: { kind: "DEPOSITION", start_at: "2026-06-15T10:00:00Z", end_at: "2026-06-15T12:00:00Z", estimated_hours: 2 }, as: CaseManager, as_user_id: "cm-1", captures: { sl: $.data.id } }
            - { call: "POST /litigation/testimony-schedules/${sl}/cancel", payload: { reason: "settled" }, as: CaseManager, as_user_id: "cm-1" }
          trigger:
            - call: "POST /litigation/testimony-schedules/${sl}/confirm"
              payload: {}
              as: CaseManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE  (CANCELLED is terminal)"

      - name: report_initial_state_and_pinned_deadline
        claim_type: initial_state
        grounds: [state_machines.Report, entities.Report.fields.deadline_at]
        distinguishing_aspect: "New report starts DRAFT with revision_count 0 and deadline_at pinned to the case's report_deadline at creation time."
        test_recipe:
          setup: ["ACTIVE engagement on case with report_deadline 2026-07-01T17:00:00Z"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "Pin Pam", specialty_area: "med" }, as: PlatformAdmin, captures: { ep: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-PIN", court: "SDNY", title: "Pin", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { cp: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${cp}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { rp: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${rp}/conflict-checks", payload: { expert_id: "${ep}", adverse_parties: [] }, as: ConflictAnalyst, captures: { ccp: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${ccp}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${rp}/credential-reviews", payload: { expert_id: "${ep}" }, as: CredentialAnalyst, captures: { crp: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${crp}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${rp}", expert_id: "${ep}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { gp: $.data.id } }
            - { call: "POST /litigation/engagements/${gp}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${gp}/sign", payload: {}, as: Expert, as_user_id: "${ep}" }
            - { call: "POST /litigation/engagements/${gp}/fund-retainer", payload: { amount_cents: 0 }, as: CaseManager, as_user_id: "cm-1" }
          trigger:
            - call: "POST /litigation/engagements/${gp}/reports"
              payload: { title: "Initial", report_type: "LIABILITY" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { rep: $.data.id }
          assert:
            - "Report.${rep}.status == DRAFT"
            - "Report.${rep}.deadline_at == 2026-07-01T17:00:00Z (pinned from case at creation)"
            - "Report.${rep}.revision_count == 0 and submitted_at == null"

      - name: request_lifecycle_auto_transitions
        claim_type: side_effect_execution
        grounds: [state_machines.EngagementRequest.OPEN_to_SCREENING, state_machines.EngagementRequest.SCREENING_to_READY, state_machines.EngagementRequest.READY_to_FILLED]
        distinguishing_aspect: "Request auto-advances OPEN->SCREENING on first check, ->READY when a candidate is fully qualified, ->FILLED on engagement creation."
        test_recipe:
          setup: ["case and expert exist"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "Auto Ann", specialty_area: "med" }, as: PlatformAdmin, captures: { ea: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-AUT", court: "SDNY", title: "Aut", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { ca: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${ca}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { ra: $.data.id, st0: $.data.status } }
            - { call: "POST /litigation/engagement-requests/${ra}/conflict-checks", payload: { expert_id: "${ea}", adverse_parties: [] }, as: ConflictAnalyst, captures: { cca: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${cca}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${ra}/credential-reviews", payload: { expert_id: "${ea}" }, as: CredentialAnalyst, captures: { cra: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${cra}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
          trigger:
            - call: "GET /litigation/engagement-requests/${ra}"
              as: CaseManager
              as_user_id: "cm-1"
              captures: { st_ready: $.data.status }
            - call: "POST /litigation/engagements"
              payload: { engagement_request_id: "${ra}", expert_id: "${ea}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }
              as: CaseManager
              as_user_id: "cm-1"
            - call: "GET /litigation/engagement-requests/${ra}"
              as: CaseManager
              as_user_id: "cm-1"
              captures: { st_filled: $.data.status }
          assert:
            - "st0 == OPEN"
            - "st_ready == READY  (after CLEARED check + PASSED review)"
            - "st_filled == FILLED  (after engagement creation)"

      - name: case_auto_advance_through_report_phase
        claim_type: side_effect_execution
        grounds: [state_machines.Case.INTAKE_to_SOURCING, state_machines.Case.SOURCING_to_ENGAGED, state_machines.Case.ENGAGED_to_DISCOVERY]
        distinguishing_aspect: "Case posture is compound: derived from children — request creation, first signature, and first report each advance it exactly one step."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "Cmp Cal", specialty_area: "med" }, as: PlatformAdmin, captures: { ec: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-CMP", court: "SDNY", title: "Cmp", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { cc: $.data.id, cst0: $.data.status } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${cc}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { rc: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${rc}/conflict-checks", payload: { expert_id: "${ec}", adverse_parties: [] }, as: ConflictAnalyst, captures: { ccc: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${ccc}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${rc}/credential-reviews", payload: { expert_id: "${ec}" }, as: CredentialAnalyst, captures: { crc: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${crc}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${rc}", expert_id: "${ec}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { gc: $.data.id } }
            - { call: "POST /litigation/engagements/${gc}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
          trigger:
            - call: "POST /litigation/engagements/${gc}/sign"
              payload: {}
              as: Expert
              as_user_id: "${ec}"
            - call: "GET /litigation/cases/${cc}"
              as: CaseManager
              as_user_id: "cm-1"
              captures: { cst_engaged: $.data.status }
            - call: "POST /litigation/engagements/${gc}/fund-retainer"
              payload: { amount_cents: 0 }
              as: CaseManager
              as_user_id: "cm-1"
            - call: "POST /litigation/engagements/${gc}/reports"
              payload: { title: "R", report_type: "DAMAGES" }
              as: CaseManager
              as_user_id: "cm-1"
            - call: "GET /litigation/cases/${cc}"
              as: CaseManager
              as_user_id: "cm-1"
              captures: { cst_discovery: $.data.status }
          assert:
            - "cst0 == INTAKE"
            - "cst_engaged == ENGAGED  (sign advanced SOURCING -> ENGAGED; request creation had advanced INTAKE -> SOURCING)"
            - "cst_discovery == DISCOVERY  (first report created)"

      - name: conflict_check_waive_by_admin
        claim_type: valid_transition
        grounds: [state_machines.ConflictCheck.FLAGGED_to_WAIVED]
        distinguishing_aspect: "PlatformAdmin waives a FLAGGED check; WAIVED satisfies the READY predicate like CLEARED."
        test_recipe:
          setup: ["request with expert: check FLAGGED, review PASSED"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "Waive Wes", specialty_area: "med" }, as: PlatformAdmin, captures: { ew: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-WAV", court: "SDNY", title: "Wav", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { cw: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${cw}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { rw: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${rw}/conflict-checks", payload: { expert_id: "${ew}", adverse_parties: ["OpCo"] }, as: ConflictAnalyst, captures: { ccw: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${ccw}/resolve", payload: { outcome: "FLAGGED", rationale: "prior adverse engagement" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${rw}/credential-reviews", payload: { expert_id: "${ew}" }, as: CredentialAnalyst, captures: { crw: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${crw}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
          trigger:
