      - name: environmental_manager_cannot_approve_plan
        claim_type: role_denial
        grounds: [ "roles[EnvironmentalManager]", "roles[IntegratorAdmin]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Submit/approve segregation by role: the role that submits manure plans cannot approve them -> 403."
        test_recipe:
          setup: ["plan SUBMITTED"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /manure-plans", payload: { site_id: "${site_id}", plan_year: 2026, lagoon_capacity_gal: 2000000, lagoon_start_gal: 1000000, n_budget_lbs: 50000, p_budget_lbs: 40000 }, as: EnvironmentalManager, captures: { plan: $.data.id } }
            - { call: "POST /manure-plans/${plan}/submit", payload: {}, as: EnvironmentalManager, as_user_id: "em_1" }
          trigger:
            - { call: "POST /manure-plans/${plan}/approve", payload: {}, as: EnvironmentalManager, as_user_id: "em_2", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403; error_id == ERR_FORBIDDEN_ROLE (${err}); plan stays SUBMITTED"

      - name: sod_quote_approve_same_user_rejected
        claim_type: segregation_of_duties
        grounds: [ state_machines.MaintenanceTicket, "errors[ERR_SEGREGATION_OF_DUTIES]", "roles[FieldTech]"]
        distinguishing_aspect: "Same FieldTech user who quoted cannot approve even though role and threshold (30000c < 50000c) both allow it: 403 ERR_SEGREGATION_OF_DUTIES; a different FieldTech user succeeds."
        test_recipe:
          setup: ["contract ACTIVE; barn; ticket quoted 30000c WEAR by ft_1"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id } }
            - { call: "POST /maintenance-tickets", payload: { barn_id: "${barn_id}", category: "EQUIPMENT", description: "fan" }, as: Grower, as_user_id: "${grower_id}", captures: { tick: $.data.id } }
            - { call: "POST /maintenance-tickets/${tick}/quote", payload: { cost_cents: 30000, cause: "WEAR" }, as: FieldTech, as_user_id: "ft_1" }
          trigger:
            - { call: "POST /maintenance-tickets/${tick}/approve", payload: {}, as: FieldTech, as_user_id: "ft_1", captures: { err: $.data.error_id } }
            - { call: "POST /maintenance-tickets/${tick}/approve", payload: {}, as: FieldTech, as_user_id: "ft_2", captures: { t_status: $.data.ticket_status } }
          assert:
            - "ft_1 (quoter) approve -> 403 ERR_SEGREGATION_OF_DUTIES (${err})"
            - "ft_2 approve -> 200, ticket_status == APPROVED (${t_status}), approved_by == ft_2"

