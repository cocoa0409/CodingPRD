      - name: senior_class_payment_blocks_junior
        claim_type: conditional_validation
        grounds: ["validations[priority=10]", "errors[ERR_SENIOR_CLASS_UNPAID]", state_machines.DistributionPayment.SCHEDULED_to_PAID]
        distinguishing_aspect: "Conditional on sibling state: a GENERAL-class payment cannot be paid while SECURED or PRIORITY payments of the same plan remain SCHEDULED; paying seniors first unlocks the identical junior pay call. Same-class ordering is free (not tested here)."
