          assert: ["HTTP 404, captured err == ERR_CREDIT_ENTRY_NOT_FOUND"]

  - section: state_machines
    instances:
      - name: energy_model_initial_state_and_retrieval
        claim_type: initial_state
        grounds: ["state_machines.EnergyModel", "entities.EnergyModel.fields.status"]
        distinguishing_aspect: "A newly created EnergyModel starts in DRAFT with version_index 1 and null improvement fields; GET returns the stored fields."
        test_recipe:
          setup: ["Project in REGISTERED"]
          setup_api_calls:
            - { call: "POST /team-members", payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }, as: ProgramAdmin, captures: { m_admin: $.data.id } }
            - { call: "POST /team-members", payload: { full_name: "Molly Modeler", email: "molly@x.com", specialty: "MODELING" }, as: ProgramAdmin, captures: { m_model: $.data.id } }
            - { call: "POST /certification-projects", payload: { project_name: "Init Tower", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { p_id: $.data.id, p_v: $.data.version } }
          trigger:
            - { call: "POST /energy-models", payload: { project_id: "${p_id}", model_type: "BASELINE", modeling_standard: "ASHRAE_90_1_2019", annual_energy_cost_modeled_cents: 12000000, annual_energy_cost_confirmed_only_cents: 12000000, includes_unconfirmed_measures: false, expected_project_version: "${p_v}" }, as: EnergyModeler, as_user_id: "${m_model}", captures: { bm_id: $.data.id } }
            - { call: "GET /energy-models/${bm_id}", as: Any }
          assert:
            - "EnergyModel.${bm_id}.status == DRAFT (initial state)"
            - "EnergyModel.${bm_id}.version_index == 1 and improvement_pct_provisional == null and improvement_pct_final == null"
            - "EnergyModel.${bm_id}.created_by == ${m_model}"
            - "GET /energy-models/${bm_id} returns annual_energy_cost_modeled_cents == 12000000"

      - name: lock_locked_model_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.EnergyModel.DRAFT_to_LOCKED", "errors[ERR_INVALID_MODEL_STATE]"]
        distinguishing_aspect: "Locking an already-LOCKED model fails with ERR_INVALID_MODEL_STATE; no side effects fire."
        test_recipe:
          setup: ["Project in REGISTERED; BASELINE model already LOCKED"]
          setup_api_calls:
            - { call: "POST /team-members", payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }, as: ProgramAdmin, captures: { m_admin: $.data.id } }
            - { call: "POST /team-members", payload: { full_name: "Molly Modeler", email: "molly@x.com", specialty: "MODELING" }, as: ProgramAdmin, captures: { m_model: $.data.id } }
            - { call: "POST /certification-projects", payload: { project_name: "Lock Tower", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /energy-models", payload: { project_id: "${p_id}", model_type: "BASELINE", modeling_standard: "ASHRAE_90_1_2019", annual_energy_cost_modeled_cents: 12000000, annual_energy_cost_confirmed_only_cents: 12000000, includes_unconfirmed_measures: false, expected_project_version: "${p_v}" }, as: EnergyModeler, as_user_id: "${m_model}", captures: { bm_id: $.data.id } }
            - { call: "POST /energy-models/${bm_id}/lock", as: EnergyModeler, as_user_id: "${m_model}" }
          trigger:
            - { call: "POST /energy-models/${bm_id}/lock", as: EnergyModeler, as_user_id: "${m_model}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409, captured err == ERR_INVALID_MODEL_STATE"
            - "EnergyModel.${bm_id}.status still == LOCKED"

      - name: lock_superseded_model_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.EnergyModel.DRAFT_to_LOCKED", "errors[ERR_INVALID_MODEL_STATE]"]
        distinguishing_aspect: "A SUPERSEDED model is terminal: locking it again fails with ERR_INVALID_MODEL_STATE."
        test_recipe:
          setup: ["Project with two BASELINE models B1 (SUPERSEDED) and B2 (LOCKED)"]
          setup_api_calls:
            - { call: "POST /team-members", payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }, as: ProgramAdmin, captures: { m_admin: $.data.id } }
            - { call: "POST /team-members", payload: { full_name: "Molly Modeler", email: "molly@x.com", specialty: "MODELING" }, as: ProgramAdmin, captures: { m_model: $.data.id } }
            - { call: "POST /certification-projects", payload: { project_name: "Sup Tower", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /energy-models", payload: { project_id: "${p_id}", model_type: "BASELINE", modeling_standard: "ASHRAE_90_1_2019", annual_energy_cost_modeled_cents: 12000000, annual_energy_cost_confirmed_only_cents: 12000000, includes_unconfirmed_measures: false, expected_project_version: "${p_v}" }, as: EnergyModeler, as_user_id: "${m_model}", captures: { b1: $.data.id } }
            - { call: "POST /energy-models/${b1}/lock", as: EnergyModeler, as_user_id: "${m_model}" }
            - { call: "GET /certification-projects/${p_id}", as: Any, captures: { p_v2: $.data.version } }
            - { call: "POST /energy-models", payload: { project_id: "${p_id}", model_type: "BASELINE", modeling_standard: "ASHRAE_90_1_2019", annual_energy_cost_modeled_cents: 12100000, annual_energy_cost_confirmed_only_cents: 12100000, includes_unconfirmed_measures: false, expected_project_version: "${p_v2}" }, as: EnergyModeler, as_user_id: "${m_model}", captures: { b2: $.data.id } }
            - { call: "POST /energy-models/${b2}/lock", as: EnergyModeler, as_user_id: "${m_model}" }
          trigger:
            - { call: "POST /energy-models/${b1}/lock", as: EnergyModeler, as_user_id: "${m_model}", captures: { err: $.data.error_id } }
          assert:
            - "EnergyModel.${b1}.status == SUPERSEDED after B2 locked (cascade link 1)"
            - "HTTP 409, captured err == ERR_INVALID_MODEL_STATE (terminal lockdown)"
            - "EnergyModel.${b2}.version_index == 2"

      - name: accept_comment_before_resubmit_blocked
        claim_type: invalid_transition
        grounds: ["state_machines.ReviewComment.ADDRESSED_to_ACCEPTED", "errors[ERR_INVALID_COMMENT_STATE]"]
        distinguishing_aspect: "Accepting a comment that is still OPEN (attempt CLARIFICATION_REQUESTED, not RESUBMITTED) fails with ERR_INVALID_COMMENT_STATE."
        test_recipe:
          setup: ["Attempt UNDER_REVIEW in a submitted DESIGN package; reviewer posts a comment (attempt -> CLARIFICATION_REQUESTED, comment OPEN)"]
          setup_api_calls:
            - { call: "POST /team-members", payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }, as: ProgramAdmin, captures: { m_admin: $.data.id } }
            - { call: "POST /team-members", payload: { full_name: "Dana Docs", email: "dana@x.com", specialty: "DOCUMENTATION" }, as: ProgramAdmin, captures: { m_spec: $.data.id } }
            - { call: "POST /credit-library-entries", payload: { credit_code: "EAp1", title: "Fundamental Commissioning", category: "ENERGY_ATMOSPHERE", points_possible: 0, is_prerequisite: true, phase_eligibility: "BOTH", requires_energy_model: false }, as: ProgramAdmin, captures: { e_p: $.data.id } }
            - { call: "POST /certification-projects", payload: { project_name: "Comment Tower", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { p_id: $.data.id } }
            - { call: "POST /credit-attempts", payload: { project_id: "${p_id}", credit_library_entry_id: "${e_p}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { a_p: $.data.id } }
            - { call: "GET /certification-projects/${p_id}", as: Any, captures: { p_v: $.data.version } }
            - { call: "POST /certification-projects/${p_id}/lock-strategy", payload: { expected_project_version: "${p_v}" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_p}/assign-owner", payload: { documentation_owner_id: "${m_spec}" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_p}/mark-ready", as: DocumentationSpecialist, as_user_id: "${m_spec}" }
