# =============================================================================
# task_0554_appliance_repair — §1.8 Scaffold Difficulty Design
# 9 Difficulty Rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: repair_cost_estimate_vs_final_on_service_request
        grounds:
          - calculations.repair_cost
          - calculations.labor_cost
          - entities.Estimate.fields.estimated_repair_subtotal_cents
          - entities.ServiceRequest.fields.final_repair_subtotal_cents
        distinguishing_aspect: "Repair-cost accounting: estimate subtotal (24000) uses estimated labor tasks, final subtotal (27000) uses actual labor tasks — same repair, two subtotals — grounded on the cost domain (ServiceRequest/Estimate)."
        test_recipe:
          setup:
            - "Out-of-warranty appliance (routing NONE), technician with 5 units of part P1 on truck, one scheduled request diagnosed with parts=[P1 x2], estimated labor tasks [40,20]min."
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ann", email: "a@x.com", phone: "1", address: "1 St" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "M100", serial_number: "S1", purchase_date: "2020-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Tex" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "P1", name: "Pump", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "Z", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "no cool" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }, { minutes: 20 }], required_parts: [{ part_id: "${part_id}", quantity: 2 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
            - { call: "POST /estimates/${est_id}/decision", payload: { decision: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /service-requests/${sr_id}/complete", payload: { actual_labor_tasks: [{ minutes: 55 }, { minutes: 25 }] }, as: Technician, as_user_id: "${tech_id}" }
          assert:
            - "Estimate.${est_id}.estimated_repair_subtotal_cents == 24000"
            - "ServiceRequest.${sr_id}.final_repair_subtotal_cents == 27000"
            - "ServiceRequest.${sr_id}.final_labor_total_cents == 18000"

      - name: appliance_health_score_at_diagnosis_vs_post_completion
        grounds:
          - calculations.appliance_health_score
          - entities.ServiceRequest.fields.health_score_at_diagnosis
          - entities.Appliance.fields.health_score
        distinguishing_aspect: "Risk scoring on Appliance: at_diagnosis excludes the in-flight request (score 70), post_completion includes it (+1 repair → 62) — a different entity domain than the repair-cost dual variant."
        test_recipe:
          setup:
            - "Appliance purchased 2020-01-15 (age 6 at 2026-06-10), 0 prior completed repairs, routing NONE, tech has part P1 x5."
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Bo", email: "b@x.com", phone: "1", address: "2 St" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "M200", serial_number: "S2", purchase_date: "2020-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Tia" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "P2", name: "Valve", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "Z2", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "leak" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }, { minutes: 20 }], required_parts: [{ part_id: "${part_id}", quantity: 2 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
            - { call: "POST /estimates/${est_id}/decision", payload: { decision: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /service-requests/${sr_id}/complete", payload: { actual_labor_tasks: [{ minutes: 40 }, { minutes: 20 }] }, as: Technician, as_user_id: "${tech_id}" }
          assert:
            - "ServiceRequest.${sr_id}.health_score_at_diagnosis == 70"
            - "Appliance.${app_id}.health_score == 62"
            - "Appliance.${app_id}.completed_repair_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: warranty_customer_responsibility_extended_mode_a
        grounds:
          - calculations.warranty_customer_responsibility
          - entities.Estimate.fields.estimated_customer_responsibility_cents
          - entities.WarrantyContract.fields.deductible_cents
        distinguishing_aspect: "Mode (a): >=3 inputs (subtotal 24000, cap_remaining 100000, deductible 5000, routing EXTENDED) with nested min/max — covered=min(24000,100000)=24000, responsibility=5000+(24000-24000)=5000."
        test_recipe:
          setup:
            - "Appliance covered by EXTENDED contract (deductible 5000, cap 100000, dates covering 2026-06-10), diagnosed with subtotal 24000."
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Cy", email: "c@x.com", phone: "1", address: "3 St" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "M300", serial_number: "S3", purchase_date: "2024-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /warranty-contracts", payload: { appliance_id: "${app_id}", coverage_type: "EXTENDED", coverage_start: "2025-01-01", coverage_end: "2027-01-01", deductible_cents: 5000, coverage_cap_cents: 100000 }, as: ServiceAdmin, captures: { wc_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Ted" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "P3", name: "Motor", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "Z3", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "noise" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
          trigger:
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }, { minutes: 20 }], required_parts: [{ part_id: "${part_id}", quantity: 2 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
          assert:
            - "Estimate.${est_id}.estimated_repair_subtotal_cents == 24000"
            - "Estimate.${est_id}.estimated_customer_responsibility_cents == 5000"
            - "ServiceRequest.${sr_id}.warranty_routing == EXTENDED"

      - name: labor_cost_round_up_per_task_mode_b
        grounds:
          - calculations.labor_cost
          - entities.Estimate.fields.estimated_labor_total_cents
        distinguishing_aspect: "Mode (b): rounding order is pinned round-up-per-task-then-sum → ceil(40/15)*3000 + ceil(20/15)*3000 = 9000+6000 = 15000, NOT sum-then-round ceil(60/15)*3000 = 12000."
        test_recipe:
          setup:
            - "Scheduled request diagnosed with labor tasks [40,20]min; parts P4 x1 priced 0 to isolate labor."
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Di", email: "d@x.com", phone: "1", address: "4 St" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "M400", serial_number: "S4", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Tom" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "P4", name: "Clip", unit_price_cents: 0 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "Z4", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "spin" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
          trigger:
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }, { minutes: 20 }], required_parts: [{ part_id: "${part_id}", quantity: 1 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
          assert:
            - "Estimate.${est_id}.estimated_labor_total_cents == 15000"
            - "Estimate.${est_id}.estimated_parts_total_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: service_request_second_trip_callback_cycle
        grounds:
          - state_machines.ServiceRequest.APPROVED_to_AWAITING_PARTS
          - state_machines.ServiceRequest.AWAITING_PARTS_to_SCHEDULED
          - state_machines.ServiceRequest.SCHEDULED_to_COMPLETED
          - entities.ServiceRequest.fields.visit_count
        distinguishing_aspect: "ServiceRequest is cyclic: APPROVED→AWAITING_PARTS→SCHEDULED revisits SCHEDULED and reaches COMPLETED via a callback visit; visit_count reaches 2."
        test_recipe:
          setup:
            - "Approved request; technician calls second-trip ordering a depot part; part received; dispatcher reschedules callback; technician completes."
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ed", email: "e@x.com", phone: "1", address: "5 St" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "M500", serial_number: "S5", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Uma" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "P5", name: "Belt", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "Z5", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "burn" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }, { minutes: 20 }], required_parts: [{ part_id: "${part_id}", quantity: 2 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
            - { call: "POST /estimates/${est_id}/decision", payload: { decision: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /service-requests/${sr_id}/second-trip", payload: { part_id: "${part_id}", quantity: 1 }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "GET /parts-orders?service_request_id=${sr_id}", as: Technician, as_user_id: "${tech_id}", captures: { po_id: "$.data.0.id" } }
            - { call: "POST /parts-orders/${po_id}/status", payload: { to_status: "RECEIVED" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-12T09:00:00Z", window_end: "2026-06-12T10:00:00Z" }, as: Dispatcher, captures: { appt2_id: "$.data.id" } }
          trigger:
            - { call: "POST /service-requests/${sr_id}/complete", payload: { actual_labor_tasks: [{ minutes: 40 }, { minutes: 20 }] }, as: Technician, as_user_id: "${tech_id}" }
          assert:
            - "ServiceRequest.${sr_id}.status == COMPLETED"
            - "ServiceRequest.${sr_id}.visit_count == 2"

      - name: parts_order_backorder_retry_cycle
        grounds:
          - state_machines.PartsOrder.ORDERED_to_BACKORDERED
          - state_machines.PartsOrder.BACKORDERED_to_ORDERED
          - state_machines.PartsOrder.ORDERED_to_RECEIVED
        distinguishing_aspect: "PartsOrder is cyclic on a different entity: ORDERED→BACKORDERED→ORDERED→RECEIVED loops through ORDERED twice before terminating."
        test_recipe:
          setup:
            - "Approved request with a second-trip depot PartsOrder in ORDERED."
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Fi", email: "f@x.com", phone: "1", address: "6 St" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "M600", serial_number: "S6", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Val" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "P6", name: "Hose", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "Z6", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "drip" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }], required_parts: [{ part_id: "${part_id}", quantity: 2 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
            - { call: "POST /estimates/${est_id}/decision", payload: { decision: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /service-requests/${sr_id}/second-trip", payload: { part_id: "${part_id}", quantity: 1 }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "GET /parts-orders?service_request_id=${sr_id}", as: Technician, as_user_id: "${tech_id}", captures: { po_id: "$.data.0.id" } }
            - { call: "POST /parts-orders/${po_id}/status", payload: { to_status: "BACKORDERED" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /parts-orders/${po_id}/status", payload: { to_status: "ORDERED" }, as: Technician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /parts-orders/${po_id}/status", payload: { to_status: "RECEIVED" }, as: Technician, as_user_id: "${tech_id}" }
          assert:
            - "PartsOrder.${po_id}.status == RECEIVED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: recall_activation_safety_hold_cascade_depth4
        grounds:
          - state_machines.RecallNotice.ISSUED_to_ACTIVE
          - state_machines.ServiceRequest.SCHEDULED_to_SAFETY_HOLD
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - entities.Appliance.fields.recall_status
        distinguishing_aspect: "Depth-4 transitive chain: recall ACTIVE → Appliance RECALLED → ServiceRequest SCHEDULED→SAFETY_HOLD → its BOOKED Appointment CANCELLED (each link caused by the previous), triggered by recall activation."
        test_recipe:
          setup:
            - "A SCHEDULED request on a Kenmore/M700 appliance with a BOOKED appointment; recall ISSUED (not yet active)."
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Gi", email: "g@x.com", phone: "1", address: "7 St" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "M700", serial_number: "S7", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Wes" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "Z7", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "smoke" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /recalls", payload: { brand: "Kenmore", model: "M700", description: "fire risk" }, as: ServiceAdmin, captures: { rec_id: "$.data.id" } }
          trigger:
            - { call: "POST /recalls/${rec_id}/status", payload: { to_status: "ACTIVE" }, as: ServiceAdmin }
          assert:
            - "Appliance.${app_id}.recall_status == RECALLED"
            - "ServiceRequest.${sr_id}.status == SAFETY_HOLD"
            - "Appointment.${appt_id}.status == CANCELLED"

      - name: second_trip_appointment_cancel_cascade_depth3
        grounds:
          - state_machines.ServiceRequest.APPROVED_to_AWAITING_PARTS
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - entities.PartsOrder.fields.status
        distinguishing_aspect: "Depth-3 transitive chain from a different trigger (second-trip): SR APPROVED→AWAITING_PARTS → its BOOKED Appointment CANCELLED → the appointment's zone slot released; a depot PartsOrder is created ORDERED."
        test_recipe:
          setup:
            - "APPROVED request with a BOOKED appointment (the repair-visit slot)."
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ha", email: "h@x.com", phone: "1", address: "8 St" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "M800", serial_number: "S8", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Xed" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "P8", name: "Coil", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "Z8", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "hot" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }], required_parts: [{ part_id: "${part_id}", quantity: 2 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
            - { call: "POST /estimates/${est_id}/decision", payload: { decision: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
