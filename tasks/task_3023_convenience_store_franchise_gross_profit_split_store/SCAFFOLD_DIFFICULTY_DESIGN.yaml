# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3023_convenience_store_franchise_gross_profit_split_store
#
# Single top-level key. Every instance grounds in SCAFFOLD.yaml §1.1-§1.7.
# 9 rule_id blocks x >=2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: settlement_provisional_split_vs_final_split_diverge
        grounds:
          - calculations.gross_profit_split
          - state_machines.Settlement.OPEN_to_DRAW_PAID
          - state_machines.Settlement.DRAW_PAID_to_RECONCILED
          - entities.Settlement.fields.provisional
          - entities.Settlement.fields.provisional_gross_profit_cents
        distinguishing_aspect: |
          The two variants split DIFFERENT bases: the provisional variant splits the settlement's
          trailing_avg_gross_profit_cents + rebate_credit_cents at the bare split_pct, while the final
          variant splits the actual gross_profit_cents at min(0.75, split_pct + tier_bonus). For the
          same stored data the provisional payout is 2800000.00 and the final payout is 2400000.00 —
          a 400000.00 divergence, not a rounding difference.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee holding 30000000 stated cents, one ACTIVE store, one ACTIVE agreement at split_pct 0.50, and one OPEN settlement for the week of 2026-09-01 covering trailing_avg_gross_profit_cents 5000000 with three revenue lines (MERCHANDISE 8000000/5600000, FUEL 6000000/5400000, SERVICES 2000000/800000), so actual gross profit before rebate is 4200000."
            - "An overlapping POSTED recommended-vendor rebate of 1000000 at rebate_pass_pct 0.60, which the first reconcile step applies."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Lone Star Operator LLC", owner_name: "Dana Reyes", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fA_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fA_id}", store_number: "TX-4410", state_code: "TX", format: "SUBURBAN", opened_on: "2024-01-15T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stA_id: $.data.id, stA_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fA_id}", store_id: "${stA_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 0.60, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agA_id: $.data.id }
            - call: "POST /franchise/agreements/${agA_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stA_id}", franchisee_id: "${fA_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", trailing_avg_gross_profit_cents: 5000000, expected_store_version: "${stA_v}" }
              as: FranchisorAdmin
              captures: { set_id: $.data.id, set_v1: $.data.version }
            - call: "POST /franchise/settlements/${set_id}/revenue-lines"
              payload: { category: "MERCHANDISE", gross_sales_cents: 8000000, cost_of_goods_cents: 5600000, expected_settlement_version: "${set_v1}" }
              as: FranchisorAdmin
              captures: { set_v2: $.data.version }
            - call: "POST /franchise/settlements/${set_id}/revenue-lines"
              payload: { category: "FUEL", gross_sales_cents: 6000000, cost_of_goods_cents: 5400000, expected_settlement_version: "${set_v2}" }
              as: FranchisorAdmin
              captures: { set_v3: $.data.version }
            - call: "POST /franchise/settlements/${set_id}/revenue-lines"
              payload: { category: "SERVICES", gross_sales_cents: 2000000, cost_of_goods_cents: 800000, expected_settlement_version: "${set_v3}" }
              as: FranchisorAdmin
            - call: "POST /franchise/rebates"
              payload: { store_id: "${stA_id}", vendor_name: "Blue Ridge Distributing", vendor_code: "BRD-01", recommended_vendor: true, rebate_cents: 1000000, period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z" }
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/settlements/${set_id}/reconcile"
              payload: {}
              as: FranchisorAdmin
              captures: { set_v4: $.data.version }
            - call: "POST /franchise/settlements/${set_id}/reconcile"
              payload: {}
              as: FranchisorAdmin
          assert:
            - "after the first reconcile Settlement.${set_id}.status == DRAW_PAID and Settlement.${set_id}.provisional == true"
            - "Settlement.${set_id}.rebate_credit_cents == 600000.00"
            - "Settlement.${set_id}.provisional_gross_profit_cents == 5600000.00"
            - "Settlement.${set_id}.provisional_split_cents == 2800000.00"
            - "after the second reconcile Settlement.${set_id}.status == RECONCILED and Settlement.${set_id}.provisional == false"
            - "Settlement.${set_id}.gross_profit_cents == 4800000.00"
            - "Settlement.${set_id}.eligible_split_pct == 0.50"
            - "Settlement.${set_id}.franchisee_split_cents == 2400000.00"
            - "Settlement.${set_id}.franchisor_share_cents == 2400000.00"
            - "Settlement.${set_id}.franchisee_split_cents - Settlement.${set_id}.provisional_split_cents == -400000.00"
            - "Settlement.${set_id}.franchisee_split_cents + Settlement.${set_id}.franchisor_share_cents == Settlement.${set_id}.gross_profit_cents"

      - name: shrink_charge_recomputed_at_finalize_after_agreement_amendment
        grounds:
          - calculations.shrink_charge_book_to_physical
          - state_machines.ShrinkAudit.SCHEDULED_to_COUNTED
          - state_machines.ShrinkAudit.COUNTED_to_FINALIZED
          - entities.ShrinkAudit.fields.shrink_charge_cents
          - entities.ShrinkAudit.fields.shrink_cents
        distinguishing_aspect: |
          The provisional variant charges the shrink at the shrink_responsibility_pct the agreement
          carried WHEN THE COUNT WAS TAKEN; the final variant recharges the identical book and
          physical counts at the percentage the agreement carries AT FINALIZE. With the percentage
          amended from 0.40 to 0.50 between count and finalize and identical inventory of
          10000000 book against 9650000 physical, the provisional charge is 140000.00 and the
          final charge is 175000.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee, one ACTIVE store, one ACTIVE agreement at shrink_responsibility_pct 0.40."
            - "A shrink audit for [2026-08-01, 2026-09-01) with book_inventory_cents 10000000, counted to physical_inventory_cents 9650000 while the agreement still reads 0.40."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Gulf Coast Retail LLC", owner_name: "Marco Silva", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fB_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fB_id}", store_number: "TX-5120", state_code: "TX", format: "URBAN", opened_on: "2023-06-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stB_id: $.data.id, stB_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fB_id}", store_id: "${stB_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.40, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agB_id: $.data.id }
            - call: "POST /franchise/agreements/${agB_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/shrink-audits"
              payload: { store_id: "${stB_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", book_inventory_cents: 10000000 }
              as: FranchisorAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /franchise/shrink-audits/${sa_id}/count"
              payload: { physical_inventory_cents: 9650000, recount: false }
              as: FieldAuditor
          trigger:
            - call: "POST /franchise/agreements/${agB_id}/amend"
              payload: { shrink_responsibility_pct: 0.50 }
              as: FranchisorAdmin
            - call: "POST /franchise/shrink-audits/${sa_id}/finalize"
              payload: {}
              as: FranchisorAdmin
          assert:
            - "immediately after the count ShrinkAudit.${sa_id}.status == COUNTED and ShrinkAudit.${sa_id}.shrink_cents == 350000"
            - "immediately after the count ShrinkAudit.${sa_id}.shrink_charge_cents == 140000.00"
            - "after finalize ShrinkAudit.${sa_id}.status == FINALIZED"
            - "after finalize ShrinkAudit.${sa_id}.shrink_cents == 350000 and ShrinkAudit.${sa_id}.book_inventory_cents == 10000000 and ShrinkAudit.${sa_id}.physical_inventory_cents == 9650000 — the counts did not move"
            - "after finalize ShrinkAudit.${sa_id}.shrink_charge_cents == 175000.00"
            - "ShrinkAudit.${sa_id}.shrink_charge_cents != 140000.00"
            - "Franchisee.${fB_id}.open_shrink_charge_cents == 175000.00"
            - "Franchisee.${fB_id}.audit_adjusted_net_worth_cents == 29825000.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: waste_share_period_total_keys_tier_then_per_order_share
        grounds:
          - calculations.waste_share_allocation
          - state_machines.FreshOrder.DELIVERED_to_RECONCILED
          - entities.FreshOrder.fields.line_waste_cents
          - entities.Settlement.fields.waste_charge_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order: the tier that keys
          each order's share is derived from the whole-period waste cost that is itself the sum of
          the per-order figures. With period_waste_cost_cents 160650 the tier is MEDIUM (adder 0.02),
          so effective_share_pct is 0.52 and SKU-A's line_waste_cents is 31137.60; evaluating the tier
          per order instead would put every order in the LOW tier and yield 29940.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee, one ACTIVE store with cold_chain_certified true, one ACTIVE agreement at waste_share_pct 0.50."
            - "One SCHEDULED commissary delivery window on 2026-09-08 from 06:00:00Z to 10:00:00Z with capacity_units 2000, and three fresh orders placed against it: SKU-A 499 cents x 400 waste units, SKU-B 699 cents x 300 waste units, SKU-C 299 cents x 500 waste units."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Prairie Convenience LLC", owner_name: "Ava Nkemelu", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fC_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fC_id}", store_number: "OK-2201", state_code: "OK", format: "RURAL", opened_on: "2024-03-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stC_id: $.data.id, stC_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fC_id}", store_id: "${stC_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agC_id: $.data.id }
            - call: "POST /franchise/agreements/${agC_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/delivery-windows"
              payload: { store_id: "${stC_id}", commissary_code: "COMM-OK-1", day_of_week: "TUE", window_start: "2026-09-08T06:00:00Z", window_end: "2026-09-08T10:00:00Z", capacity_units: 2000 }
              as: FranchisorAdmin
              captures: { dw_id: $.data.id, dw_v1: $.data.version }
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stC_id}", delivery_window_id: "${dw_id}", sku_code: "SKU-A", ordered_units: 400, unit_cost_cents: 499 }
              as: Franchisee
              as_user_id: "${fC_id}"
              captures: { fo_a: $.data.id, dw_v2: $.data.version }
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stC_id}", delivery_window_id: "${dw_id}", sku_code: "SKU-B", ordered_units: 300, unit_cost_cents: 699 }
              as: Franchisee
              as_user_id: "${fC_id}"
              captures: { fo_b: $.data.id, dw_v3: $.data.version }
            - call: "POST /franchise/fresh-orders"
              payload: { store_id: "${stC_id}", delivery_window_id: "${dw_id}", sku_code: "SKU-C", ordered_units: 500, unit_cost_cents: 299 }
              as: Franchisee
              as_user_id: "${fC_id}"
              captures: { fo_c: $.data.id }
            - call: "POST /franchise/delivery-windows/${dw_id}/lock"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/fresh-orders/${fo_a}/confirm"
              payload: {}
              as: Commissary
            - call: "POST /franchise/fresh-orders/${fo_b}/confirm"
              payload: {}
              as: Commissary
            - call: "POST /franchise/fresh-orders/${fo_c}/confirm"
              payload: {}
              as: Commissary
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T07:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/fresh-orders/${fo_a}/deliver"
              payload: { delivered_units: 400 }
              as: Commissary
            - call: "POST /franchise/fresh-orders/${fo_b}/deliver"
              payload: { delivered_units: 300 }
              as: Commissary
            - call: "POST /franchise/fresh-orders/${fo_c}/deliver"
              payload: { delivered_units: 500 }
              as: Commissary
          trigger:
            - call: "POST /franchise/fresh-orders/${fo_a}/reconcile"
              payload: { waste_units: 120 }
              as: FranchisorAdmin
            - call: "POST /franchise/fresh-orders/${fo_b}/reconcile"
              payload: { waste_units: 80 }
              as: FranchisorAdmin
            - call: "POST /franchise/fresh-orders/${fo_c}/reconcile"
              payload: { waste_units: 150 }
              as: FranchisorAdmin
          assert:
            - "FreshOrder.${fo_a}.status == RECONCILED and FreshOrder.${fo_c}.status == RECONCILED"
            - "FreshOrder.${fo_a}.line_waste_cents == 31137.60"
            - "FreshOrder.${fo_b}.line_waste_cents == 29078.40"
            - "FreshOrder.${fo_c}.line_waste_cents == 23322.00"
            - "FreshOrder.${fo_a}.line_waste_cents != 29940.00"
            - "the period waste cost is 59880.00 + 55920.00 + 44850.00 == 160650.00, which is >= 100000 and < 500000, so the MEDIUM adder 0.02 applies and effective_share_pct is 0.52"
            - "DeliveryWindow.${dw_id}.reserved_units == 0 after all three reconciliations"

      - name: rebate_flowthrough_rounded_per_category_beats_single_rounding
        grounds:
          - calculations.rebate_flowthrough
          - state_machines.VendorRebate.POSTED_to_APPLIED
          - state_machines.Settlement.OPEN_to_DRAW_PAID
          - entities.Settlement.fields.rebate_credit_cents
          - entities.VendorRebate.fields.flowthrough_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the pinned order is load-bearing: the rebate is attributed
          across categories with per-category rounding, each attribution is passed through at
          rebate_pass_pct with a SECOND per-category rounding, and only then summed. For rebate
          1234567 with per-category attributions 617283.50 / 462962.63 / 154320.87 and
          rebate_pass_pct 0.55 the per-category order yields 679011.86, while rounding the whole
          rebate once (round(1234567 * 0.55, 2)) yields 679011.85.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One franchisee, one ACTIVE store, one ACTIVE agreement at rebate_pass_pct 0.55."
            - "One OPEN settlement for [2026-09-01, 2026-09-08) with three revenue lines at gross sales 8000000 / 6000000 / 2000000, and one overlapping POSTED recommended-vendor rebate of 1234567 cents from vendor code BRD-77."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Red River Stores LLC", owner_name: "Ines Barrera", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fD_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fD_id}", store_number: "TX-6677", state_code: "TX", format: "SUBURBAN", opened_on: "2022-09-15T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stD_id: $.data.id, stD_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fD_id}", store_id: "${stD_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 0.55, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agD_id: $.data.id }
            - call: "POST /franchise/agreements/${agD_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stD_id}", franchisee_id: "${fD_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", trailing_avg_gross_profit_cents: 5000000, expected_store_version: "${stD_v}" }
              as: FranchisorAdmin
              captures: { setD_id: $.data.id, setD_v1: $.data.version }
            - call: "POST /franchise/settlements/${setD_id}/revenue-lines"
              payload: { category: "MERCHANDISE", gross_sales_cents: 8000000, cost_of_goods_cents: 5600000, expected_settlement_version: "${setD_v1}" }
              as: FranchisorAdmin
              captures: { setD_v2: $.data.version }
            - call: "POST /franchise/settlements/${setD_id}/revenue-lines"
              payload: { category: "FUEL", gross_sales_cents: 6000000, cost_of_goods_cents: 5400000, expected_settlement_version: "${setD_v2}" }
              as: FranchisorAdmin
              captures: { setD_v3: $.data.version }
            - call: "POST /franchise/settlements/${setD_id}/revenue-lines"
              payload: { category: "SERVICES", gross_sales_cents: 2000000, cost_of_goods_cents: 800000, expected_settlement_version: "${setD_v3}" }
              as: FranchisorAdmin
            - call: "POST /franchise/rebates"
              payload: { store_id: "${stD_id}", vendor_name: "Blue Ridge Distributing", vendor_code: "BRD-77", recommended_vendor: true, rebate_cents: 1234567, period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z" }
              as: FranchisorAdmin
              captures: { rb_id: $.data.id }
          trigger:
            - call: "POST /franchise/settlements/${setD_id}/reconcile"
              payload: {}
              as: FranchisorAdmin
          assert:
            - "VendorRebate.${rb_id}.status == APPLIED"
            - "VendorRebate.${rb_id}.flowthrough_cents == 679011.86"
            - "VendorRebate.${rb_id}.flowthrough_cents != 679011.85"
            - "Settlement.${setD_id}.rebate_credit_cents == 679011.86"
            - "the retained franchisor leg is 1234567.00 - 679011.86 == 554555.14"
            - "the three passed-through category legs are 339505.93 + 254629.45 + 84876.48 == 679011.86"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: settlement_reconcile_dispute_resolve_cycle
        grounds:
          - state_machines.Settlement.RECONCILED_to_DISPUTED
          - state_machines.Settlement.DISPUTED_to_RECONCILED
          - state_machines.Settlement.DRAW_PAID_to_RECONCILED
          - entities.Settlement.fields.status
          - entities.Settlement.fields.dispute_reason
        distinguishing_aspect: |
          A genuine cycle rather than a pipeline: the Settlement entity re-enters RECONCILED from
          DISPUTED, so a settlement that has already been reconciled can be challenged and returned to
          the same state with a recomputed waste charge. This is the only transition in the scaffold
          whose `to:` state is a state the entity has already occupied.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-20T12:00:00Z so that the period_end + 14 day dispute window is still open for the week of 2026-09-08."
            - "One franchisee, one ACTIVE store, one ACTIVE agreement, one settlement for [2026-09-08, 2026-09-15) with a single SERVICES line 2000000/800000, reconciled through to RECONCILED."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Cedar Point Operators LLC", owner_name: "Ruth Aldana", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fE_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${fE_id}", store_number: "TX-3311", state_code: "TX", format: "URBAN", opened_on: "2023-02-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stE_id: $.data.id, stE_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fE_id}", store_id: "${stE_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agE_id: $.data.id }
            - call: "POST /franchise/agreements/${agE_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements"
