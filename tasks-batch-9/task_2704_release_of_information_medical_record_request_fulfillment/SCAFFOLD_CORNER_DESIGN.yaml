        excluded_because:
          difficulty_instance: dual_variant_calc / invoice_variant_divergence_third_party_retail_vs_patient_access_cost_based
          rationale: "The two pricing variants are driven off identical page sets there, which is the whole point of the layer."

      - name: corner_rate_threshold_triggers_layer
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_layers.rate_threshold_triggers
        excluded_because:
          difficulty_instance: dual_variant_calc / turnaround_penalty_variant_divergence_strict_vs_safe_harbor
          rationale: "Per-day accrual, the business-day grace threshold and the per-request penalty cap are all exercised there against one clock line."

  - section: consistency model
    instances:

      - name: accepted_write_is_fully_visible_to_the_very_next_read
        claim_type: immediate_consistency
        grounds:
          - envelope.consistency_model
          - calculations.statutory_due_at
          - endpoints.GET_/roi/requests/{id}/turnaround
        distinguishing_aspect: >
          The declared model is immediate, so the read that follows a write needs no
          settling step and no retry: the accept response body, the next GET of the
          entity, the computed turnaround read and the request listing all report the
          same fulfillment_status and the same statutory_due_at within the same
          logical instant, and the derived deadline appears on the first read rather
          than after a sweep.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; CA fee rule (third_party_deadline_days 30); facility; patient; ATTORNEY requester with a VALID authorization."
            - "One THIRD_PARTY request created but not yet decided, so statutory_due_at is still unset."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roi/state-fee-rules"
              payload: { state_code: "CA", base_retrieval_fee_cents: 1500, tier1_page_limit: 25, tier1_per_page_millicents: 27500, tier2_per_page_millicents: 12500, patient_access_per_page_millicents: 10000, certification_fee_cents: 1000, media_fee_cents: 500, postage_per_delivery_cents: 850, electronic_delivery_total_cap_cents: 6500, total_fee_cap_cents: 12000, patient_access_deadline_days: 15, third_party_deadline_days: 30, extension_days: 15, penalty_per_day_cents: 2500, penalty_cap_cents: 25000, fee_forfeiture_on_late: true }
              as: PlatformAdmin
              captures: { rule_ca: $.data.id }
            - call: "POST /roi/facilities"
              payload: { name: "Bay Regional Health", state_fee_rule_id: "${rule_ca}" }
              as: PlatformAdmin
              captures: { fac: $.data.id }
            - call: "POST /roi/patients"
              payload: { facility_id: "${fac}", mrn: "MRN-1001", full_name: "Dana Reyes", date_of_birth: "1984-03-11" }
              as: FacilityAdmin
              as_user_id: "${fac}"
              captures: { pat: $.data.id }
            - call: "POST /roi/requesters"
              payload: { requester_type: "ATTORNEY", contact_email: "counsel@firm.example", organization_name: "Firm LLP", credential_number: "BAR-55", signature_on_file: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { atty: $.data.id }
            - call: "GET /roi/patients/${pat}"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
