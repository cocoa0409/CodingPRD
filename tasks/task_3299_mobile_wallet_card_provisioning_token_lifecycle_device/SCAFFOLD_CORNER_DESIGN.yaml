              payload: { cryptogram: "ok3", amount_cents: 3000, currency: "USD", merchant_id: "m-3", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { a3: $.data.id }
            - call: "POST /payment-tokens/${tok_id}/authorizations"
              payload: { cryptogram: "ok4", amount_cents: 4000, currency: "USD", merchant_id: "m-4", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { a4: $.data.id }
            - call: "POST /payment-tokens/${tok_id}/authorizations"
              payload: { cryptogram: "ok5", amount_cents: 5000, currency: "USD", merchant_id: "m-5", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { a5: $.data.id }
            - call: "POST /authorizations/${a1}/disputes"
              payload: { amount_cents: 1000, reason: "UNRECOGNIZED" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /authorizations/${a2}/disputes"
              payload: { amount_cents: 2000, reason: "DUPLICATE" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /authorizations/${a3}/disputes"
              payload: { amount_cents: 3000, reason: "GOODS_NOT_RECEIVED" }
