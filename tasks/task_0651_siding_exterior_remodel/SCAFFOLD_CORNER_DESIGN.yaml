scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "POST /projects with required fields returns 201; workflow_status defaults to DRAFT, compliance_status to PENDING_CLEARANCE, hoa_required omitted defaults false, version starts at 1."
        test_recipe:
          setup:
            - "A registered ProjectManager StaffMember and a HomeownerClient."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "pmc1@x.com", full_name: "PMc", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "clc1@x.com", full_name: "Clc", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "100 Cedar" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_id: $.data.id, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Project.${proj_id}.workflow_status == DRAFT"
            - "Project.${proj_id}.compliance_status == PENDING_CLEARANCE"
            - "Project.${proj_id}.hoa_required == false"
            - "Project.${proj_id}.version == 1"

      - name: create_project_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Project.fields.property_address", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /projects omitting required property_address returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A registered ProjectManager and HomeownerClient."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "pmc2@x.com", full_name: "PMc2", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "clc2@x.com", full_name: "Clc2", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_project_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Project", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /projects/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "A registered ProjectManager."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "pmc3@x.com", full_name: "PMc3", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_line_item_invalid_enum_scope_kind_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.EstimateLineItem.fields.scope_kind", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "scope_kind outside {SIDING,TRIM,WRAP} (e.g. 'GUTTER') returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A DRAFT estimate on a measured project."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "estc4@x.com", full_name: "Estc4", role_code: "ESTIMATOR" }
              as: Anonymous
              captures: { est_id: $.data.id }
            - call: "POST /staff/register"
              payload: { email: "pmc4@x.com", full_name: "PMc4", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "clc4@x.com", full_name: "Clc4", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "104 Cedar" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/measurements"
              payload: { estimator_id: "${est_id}", gross_wall_sqft: 1100, opening_sqft: 100, linear_trim_ft: 300, color_code: "ARCTIC_WHITE_HZ10" }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { meas_id: $.data.id }
            - call: "POST /estimates"
              payload: { project_id: "${proj_id}", measurement_id: "${meas_id}", waste_factor_pct: 0.10 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { est_obj_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "GUTTER", quantity: 100, unit_price_cents: 500 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: measurement_net_siding_sqft_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Measurement.fields.net_siding_sqft, calculations.net_siding_area]
        distinguishing_aspect: "net_siding_sqft is computed as max(gross-opening,0); gross 1500 opening 300 yields net_siding_sqft 1200.0 (server computes)."
        test_recipe:
          setup:
            - "A DRAFT project."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "estc5@x.com", full_name: "Estc5", role_code: "ESTIMATOR" }
              as: Anonymous
              captures: { est_id: $.data.id }
            - call: "POST /staff/register"
              payload: { email: "pmc5@x.com", full_name: "PMc5", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "clc5@x.com", full_name: "Clc5", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "105 Cedar" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/measurements"
              payload: { estimator_id: "${est_id}", gross_wall_sqft: 1500, opening_sqft: 300, linear_trim_ft: 200, color_code: "ARCTIC_WHITE_HZ10" }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { meas_id: $.data.id, net: $.data.net_siding_sqft }
          assert:
            - "Measurement.${meas_id}.net_siding_sqft == 1200.0"

      - name: project_listing_pagination_envelope
        claim_type: Listing
        grounds: [entities.Project, response_envelope]
        distinguishing_aspect: "GET /projects returns a paginated array envelope with total_count present and >= 1."
        test_recipe:
          setup:
            - "At least one project exists; PM lists with limit=1."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "pmc6@x.com", full_name: "PMc6", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "clc6@x.com", full_name: "Clc6", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "106 Cedar" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "GET /projects"
              payload: { limit: 1, offset: 0 }
              as: ProjectManager
              as_user_id: "${pm_id}"
          assert:
            - "response.response_type == array"
            - "response.meta.total_count >= 1"

  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_project_returns_cancel_not_allowed
        claim_type: invalid_transition
        grounds: ["state_machines.Project.cancel", "errors[ERR_CANCEL_NOT_ALLOWED]"]
        distinguishing_aspect: "Cancelling a project already in workflow_status=CANCELLED returns ERR_CANCEL_NOT_ALLOWED (409); no further cascade fires."
        test_recipe:
          setup:
            - "A DRAFT project cancelled once."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "pmc7@x.com", full_name: "PMc7", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "clc7@x.com", full_name: "Clc7", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "107 Cedar" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { v0: $.data.version }
            - call: "POST /projects/${proj_id}/cancel"
              payload: { cancelled_reason: "client backed out", expected_project_version: "${v0}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/cancel"
              payload: { cancelled_reason: "again", expected_project_version: "${v1}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CANCEL_NOT_ALLOWED"

      - name: complete_project_with_open_milestones_returns_open_milestones
        claim_type: precondition_violation
        grounds: ["state_machines.Project.IN_PROGRESS_to_COMPLETED", "validations[priority=19]", "errors[ERR_OPEN_MILESTONES]"]
        distinguishing_aspect: "Completing an IN_PROGRESS project while a WorkSchedule is still CONFIRMED (not COMPLETED/CANCELLED) returns ERR_OPEN_MILESTONES (409)."
        test_recipe:
          setup:
            - "Project IN_PROGRESS with one started window and a second still-CONFIRMED window."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "estc8@x.com", full_name: "Estc8", role_code: "ESTIMATOR" }
              as: Anonymous
              captures: { est_id: $.data.id }
            - call: "POST /staff/register"
              payload: { email: "pmc8@x.com", full_name: "PMc8", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "clc8@x.com", full_name: "Clc8", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "108 Cedar" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/measurements"
              payload: { estimator_id: "${est_id}", gross_wall_sqft: 1100, opening_sqft: 100, linear_trim_ft: 300, color_code: "ARCTIC_WHITE_HZ10" }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { meas_id: $.data.id }
            - call: "POST /estimates"
              payload: { project_id: "${proj_id}", measurement_id: "${meas_id}", waste_factor_pct: 0.10 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { est_obj_id: $.data.id }
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "SIDING", quantity: 1000, unit_price_cents: 1000 }
              as: Estimator
              as_user_id: "${est_id}"
            - call: "POST /estimates/${est_obj_id}/baseline"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", jurisdiction: "Austin" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: { permit_number: "P-108" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /material-orders"
              payload: { project_id: "${proj_id}", estimate_id: "${est_obj_id}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /material-orders/${mo_id}/confirm"
              payload: { delivery_eta_iso: "2026-04-10T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /material-orders/${mo_id}/deliver"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /crews"
              payload: { name: "Crew C108", max_wind_mph: 30 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { crew_id: $.data.id }
            - call: "POST /projects/${proj_id}/work-schedules"
              payload: { crew_id: "${crew_id}", milestone: "WRAP_INSTALL", window_start_iso: "2026-04-20T08:00:00Z", window_end_iso: "2026-04-20T17:00:00Z", forecast_wind_mph: 10 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ws1_id: $.data.id }
            - call: "POST /work-schedules/${ws1_id}/confirm"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /work-schedules/${ws1_id}/start"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "POST /projects/${proj_id}/complete"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OPEN_MILESTONES"

      - name: complete_project_activates_warranties_and_releases_retainage
        claim_type: side_effect_execution
        grounds: [state_machines.Project.IN_PROGRESS_to_COMPLETED, entities.Warranty.fields.status, entities.Project.fields.retainage_held_cents]
        distinguishing_aspect: "Completing a project with one released draw (retainage 39749 held) moves retainage_held_cents into amount_released_cents (357745+39749=397494) leaving retainage_held_cents == 0; all PENDING warranties become ACTIVE."
        test_recipe:
          setup:
            - "Project IN_PROGRESS, contract 1324980, one COMPLETED window, draw 30% RELEASED (net 357745, retainage 39749)."
