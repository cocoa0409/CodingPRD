            - call: "GET /sma/trade-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SponsorOperator
              captures: { e_ord: "$.data.error_id" }
            - call: "GET /sma/blocks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e_blk: "$.data.error_id" }
            - call: "GET /sma/tax-lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PortfolioManager
              captures: { e_lot: "$.data.error_id" }
            - call: "GET /sma/harvest-proposals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PortfolioManager
              captures: { e_hp: "$.data.error_id" }
            - call: "GET /sma/fee-invoices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingOfficer
