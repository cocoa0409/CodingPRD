            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_MANAGEMENT", hours: 40, work_period_start: "2026-02-02", work_period_end: "2026-03-02" }, as: Candidate, as_user_id: "${cand_id}" }
