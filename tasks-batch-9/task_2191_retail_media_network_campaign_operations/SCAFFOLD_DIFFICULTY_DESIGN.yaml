  - rule_id: compensating_invariant
    instances:
      - name: ci_budget_plan_cents_conserved_across_schedule_then_archive
        grounds:
          - calculations.budget_plan_available
          - state_machines.Campaign.PENDING_REVIEW_to_SCHEDULED
          - state_machines.Campaign.SCHEDULED_to_ARCHIVED
          - entities.BudgetPlan.fields.committed_total_cents
          - entities.BudgetPlan.fields.top_up_total_cents
          - entities.BudgetPlan.fields.reserved_cents
          - entities.BudgetPlan.fields.consumed_cents
          - entities.BudgetPlan.fields.available_cents
