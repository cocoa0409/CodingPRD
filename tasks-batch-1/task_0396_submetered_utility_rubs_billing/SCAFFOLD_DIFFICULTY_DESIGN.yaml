              as: PropertyManager
              captures: { pdl_id: $.data.id }
            - call: "POST /leases/${pdl_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pd_id}", utility_id: "${upd_id}", period_label: "2026-06", total_cost_cents: 7059 }
