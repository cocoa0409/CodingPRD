      - name: a_lapsed_engineer_can_no_longer_author_revise_or_seal_but_prior_designs_survive
        claim_type: precondition_enforcement
        grounds:
          - state_machines[Engineer].transitions
          - validations[priority 15]
          - errors[ERR_ENGINEER_LICENSE_LAPSED]
        distinguishing_aspect: "The Engineer machine has exactly one edge and its whole purpose is to gate three other endpoints, so the interesting claim is the gate rather than the transition. The lapse must block authoring, revising and sealing for the lapsed engineer while leaving the designs that engineer already authored fully sealable by a different active engineer - the license state is read from the ACTING engineer, never from BinDesign.author_engineer_id. An implementation that keys the check on the stored author id would wrongly refuse the final seal."
