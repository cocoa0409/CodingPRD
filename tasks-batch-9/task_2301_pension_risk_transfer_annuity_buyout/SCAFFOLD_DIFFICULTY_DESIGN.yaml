            - call: "GET /prt/settlement-entries"
              payload: { plan_id: "${plan_id}", entry_type: "REMEDIATION_REVERSAL" }
              as: Regulator
              as_user_id: "regulator-01"
              captures: { reversal_amount: "$.data[0].amount_cents", reversal_type: "$.data[0].entry_type" }
            - call: "GET /prt/participants/${p1_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_audit_status_after: $.data.benefit_audit_status, p1_score_after: $.data.data_confidence_score }
          assert:
            - "the buyout settlement recognised nothing: its SettlementEntry has entry_type == BUYOUT_RECOGNITION, amount_cents == 0 and deferred_amount_cents == 998400, because settlement_cost 12000000 > threshold 12000000 is false"
            - "the SPONSOR_RESPONSIBLE triage reopened the audit — BenefitAudit.${a1_id}.audit_status == REOPENED with reopened_by_complaint_id == ${c1_id}, ParticipantRecord.${p1_id}.benefit_audit_status == REOPENED and data_confidence_score == 85, which is still CLEAN at the inclusive floor of 80"
            - "before the reversal PensionPlan.${plan_id}.cumulative_settlement_charge_cents == 250000, plan_assets_cents == 79750000, total_liability_cents == 88540000 and accounting_funded_status_bp == 9007"
            - "before the reversal exactly 2 SettlementEntry rows exist: BUYOUT_RECOGNITION at amount_cents 0 and REMEDIATION at amount_cents 250000"
            - "the re-triage returns 200 with ParticipantComplaint.${c1_id}.complaint_status == TRIAGED, responsibility_determination == NO_ERROR, triage_count == 2, resolved_at == null and reversed_amount_cents == 250000"
            - "a third SettlementEntry now exists with entry_type == REMEDIATION_REVERSAL and amount_cents == -250000 — the REMEDIATION row is still present and unmodified, because the ledger is append-only"
            - "after the reversal PensionPlan.${plan_id}.cumulative_settlement_charge_cents == 0, plan_assets_cents == 80000000 and accounting_funded_status_bp == 9035 — byte-identical to the post-settlement figures"
            - "the conserved identity holds at all three observations: cumulative_settlement_charge_cents equals the sum of amount_cents over the plan's SettlementEntry rows (0, then 0 + 250000, then 0 + 250000 - 250000)"
            - "deferred_settlement_charge_cents == 998400 both before and after the reversal — a remediation reversal never touches AOCI"
            - "the re-triage did NOT reopen the audit: BenefitAudit.${a1_id}.audit_status == CORRECTED and ParticipantRecord.${p1_id}.benefit_audit_status == CORRECTED with data_confidence_score == 100, because the reopen cascade fires only when the NEW determination is SPONSOR_RESPONSIBLE"
            - "PensionPlan.${plan_id}.total_liability_cents == 88540000 throughout the reversal — remediation moves assets, never liability"
