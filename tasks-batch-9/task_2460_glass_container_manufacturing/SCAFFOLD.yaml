    path: "/glass-plant/batch-recipes/{batch_recipe_id}/approve"
    description: "Approve a recipe for production use"
    roles: [BatchHouseTech]
    code: 200
    input: []
    output: BatchRecipe
    side_effects: ["sets approved to true"]

  - method: POST
    path: "/glass-plant/color-changes"
