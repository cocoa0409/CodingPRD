# =============================================================================
# task_2483 — Microtransit & On-Demand Transit Service
# Scaffold seed tables (§1.0–§1.7). Difficulty target: beyond Expert.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2483. Microtransit & On-Demand Transit Service (on-demand transit operator):
  service zone definition with virtual stop placement and walking distance
  standards, trip request intake with real-time matching, shared-ride pooling and
  detour tolerance, vehicle and driver scheduling to forecast demand with peak
  surge fleet sizing, wheelchair-accessible vehicle dispatch and equivalent
  service requirements, fare integration with fixed-route transfers and fare
  capping policies, first/last-mile connections timed to rail and bus schedules,
  performance metrics on wait time, ride time and boardings per revenue hour,
  subsidy per trip reporting to the funding agency

domain_name: microtransit-on-demand
api_prefix: ""   # flat topology — every collection is a top-level path

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - selector_policy
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Twelve peer entities linked purely by foreign keys; no nesting in URL paths.
  # Every collection is addressed at the top level (/trip-requests, /vehicle-blocks).

  state_machine_shape: cyclic
  # TripRequest.status carries a MATCHING→OFFERED→MATCHING re-match loop plus a
  # MATCHING→MATCHING self-loop, and runs a second independent axis
  # (TripRequest.fare_status) as a second dimension of the same row. SubsidyReport adds a
  # CERTIFIED→AMENDED→SUBMITTED→CERTIFIED revision loop. PoolAssignment adds a
  # branching OFFERED→{ACCEPTED, DECLINED, RELEASED} fork with divergent
  # side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # ServiceZone -> VirtualStop / Vehicle / Driver / Rider / VehicleBlock
    - many_to_many         # PoolAssignment joins TripRequest <-> VehicleBlock
    - self_referential     # VirtualStop.paired_stop_id -> VirtualStop.id
    - cross_aggregate      # SubsidyReport aggregates VehicleBlock + TripRequest + FareTransaction

  role_model: segregation_of_duties
  # FinanceAnalyst drafts and submits subsidy reports but can never certify them;
  # FundingAgencyAuditor certifies or rejects but can never submit; and the
  # X-User-ID that submitted a report is barred from certifying that same report.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceZone
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable service zone name", constraints: "1..120 chars" }
      - { name: zone_code, type: string, source: input, description: "Operator-assigned zone code", constraints: "unique across all ServiceZone rows; 2..12 chars" }
      - { name: status, type: enum, source: system, description: "Zone lifecycle state", default: DRAFT, constraints: "DRAFT | ACTIVE | SUSPENDED" }
      - { name: max_walk_meters, type: integer, source: input, description: "Walking-distance standard: the largest walk shed a VirtualStop may advertise and still be approved", constraints: ">= 100 and <= 1200" }
      - { name: detour_tolerance_pct, type: number, source: input, description: "Shared-ride detour tolerance as a fraction of a trip's baseline_direct_minutes", constraints: ">= 0 and <= 1.0; 2 decimal places" }
      - { name: detour_tolerance_floor_minutes, type: integer, source: input, description: "Absolute minimum detour allowance in minutes; wins when the percentage allowance is smaller", constraints: ">= 0 and <= 60" }
      - { name: base_fare_cents, type: integer, source: input, description: "Flat base fare in cents before band surcharge, category multiplier, transfer credit and caps", constraints: ">= 0" }
      - { name: fare_cap_cents_daily, type: integer, source: input, description: "Fare-capping policy: maximum cents a Rider can be charged across one UTC service date in this zone", constraints: ">= 0" }
      - { name: fare_cap_cents_weekly, type: integer, source: input, description: "Fare-capping policy: maximum cents a Rider can be charged across one ISO week (Monday-anchored) in this zone", constraints: ">= 0" }
      - { name: on_time_window_minutes, type: integer, source: input, description: "Pickup is on time when actual_pickup_utc <= promised_pickup_utc + this many minutes", default: 5, constraints: ">= 0 and <= 30" }
      - { name: curb_capacity_per_bucket, type: integer, source: input, description: "Maximum number of non-terminal PoolAssignments that may hold a promised pickup at the same VirtualStop inside one 15-minute UTC bucket", default: 2, constraints: ">= 1" }
      - { name: completed_trip_count, type: integer, source: computed, description: "Count of TripRequest rows in this zone with status == COMPLETED", default: 0 }
      - { name: unserved_trip_count, type: integer, source: computed, description: "Count of TripRequest rows in this zone with status == NO_SERVICE", default: 0 }
      - { name: avg_wait_minutes, type: number, source: computed, description: "Mean TripRequest.wait_minutes over zone trips with status == COMPLETED, 2 decimal places; 0.00 when that set is empty", default: 0.00 }
      - { name: avg_ride_minutes, type: number, source: computed, description: "Mean TripRequest.ride_minutes over zone trips with status == COMPLETED, 2 decimal places; 0.00 when that set is empty", default: 0.00 }
      - { name: boardings_per_revenue_hour, type: number, source: computed, description: "Sum of VehicleBlock.boardings_count over zone blocks with state == CLOSED divided by the sum of their actual_revenue_hours, 2 decimal places; 0.00 when the divisor is 0", default: 0.00 }
      - { name: wav_avg_wait_minutes, type: number, source: computed, description: "Mean wait_minutes over zone trips with status == COMPLETED and wav_required == true, 2 decimal places; 0.00 when that set is empty", default: 0.00 }
      - { name: nonwav_avg_wait_minutes, type: number, source: computed, description: "Mean wait_minutes over zone trips with status == COMPLETED and wav_required == false, 2 decimal places; 0.00 when that set is empty", default: 0.00 }
      - { name: wav_equivalence_ratio, type: number, source: computed, description: "wav_avg_wait_minutes / nonwav_avg_wait_minutes, 3 decimal places; 0.000 when nonwav_avg_wait_minutes == 0.00", default: 0.000 }
      - { name: equivalence_verdict, type: enum, source: computed, description: "Equivalent-service verdict for wheelchair-accessible dispatch", default: COMPLIANT, constraints: "COMPLIANT | DEFICIENT" }

  - name: VirtualStop
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; the zone that owns this virtual stop" }
      - { name: stop_code, type: string, source: input, description: "Operator-assigned stop code", constraints: "unique within zone_id" }
      - { name: corridor_index, type: integer, source: input, description: "Integer position of this stop along the zone's single corridor; all travel-time and detour arithmetic is derived from index distance", constraints: ">= 0 and <= 500" }
      - { name: walk_shed_meters, type: integer, source: input, description: "Farthest walking distance in meters this stop is advertised to serve", constraints: ">= 0" }
      - { name: accessibility, type: enum, source: input, description: "Curb-side path condition at this stop", default: UNKNOWN, constraints: "ACCESSIBLE_PATH | STAIRS_ONLY | UNKNOWN" }
      - { name: paired_stop_id, type: string, source: input, description: "FK -> VirtualStop.id; the opposite-direction stop across the street; nullable", default: null }
      - { name: status, type: enum, source: system, description: "Stop placement lifecycle state", default: PROPOSED, constraints: "PROPOSED | APPROVED | RETIRED" }

  - name: TransitConnection
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone whose microtransit service feeds this fixed-route departure" }
      - { name: stop_id, type: string, source: input, description: "FK -> VirtualStop.id; the virtual stop co-located with the rail platform or bus bay" }
      - { name: mode, type: enum, source: input, description: "Fixed-route mode this connection anchors to", constraints: "RAIL | BUS" }
      - { name: route_code, type: string, source: input, description: "Fixed-route line identifier as published by the transit agency" }
      - { name: scheduled_departure_utc, type: datetime, source: input, description: "Published departure time of the fixed-route trip this connection is timed to" }
      - { name: guaranteed_transfer_buffer_minutes, type: integer, source: input, description: "Absolute minutes of slack around scheduled_departure_utc inside which a microtransit pickup counts as a guaranteed transfer", constraints: ">= 0 and <= 60" }
      - { name: transfer_credit_cents, type: integer, source: input, description: "Cents credited against a microtransit fare when the transfer is guaranteed", constraints: ">= 0" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone this vehicle is assigned to" }
      - { name: vehicle_code, type: string, source: input, description: "Fleet identifier", constraints: "unique within zone_id" }
      - { name: seat_capacity, type: integer, source: input, description: "Total ambulatory seats available for pooling", constraints: ">= 1 and <= 24" }
      - { name: wav_positions, type: integer, source: input, description: "Number of securement positions for wheelchair-accessible boarding", default: 0, constraints: ">= 0 and <= 4" }
      - { name: is_wav, type: boolean, source: computed, description: "true exactly when wav_positions >= 1; request-supplied values are ignored" }
      - { name: status, type: enum, source: system, description: "Fleet availability state", default: AVAILABLE, constraints: "AVAILABLE | IN_MAINTENANCE | RETIRED" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone this driver is rostered in" }
      - { name: driver_code, type: string, source: input, description: "Operator-assigned driver identifier", constraints: "unique within zone_id" }
      - { name: wav_certified, type: boolean, source: input, description: "Whether this driver holds current securement/lift certification", default: false }
      - { name: status, type: enum, source: system, description: "Roster availability state", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }
      - { name: consecutive_decline_count, type: integer, source: computed, description: "Number of PoolAssignment declines by this driver since the last accept or the last manual reinstatement; reset to 0 on accept and on a SUSPENDED->ACTIVE status change", default: 0 }

  - name: Rider
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone this rider account belongs to" }
      - { name: rider_code, type: string, source: input, description: "Operator-assigned rider identifier", constraints: "unique within zone_id" }
      - { name: fare_category, type: enum, source: input, description: "Fare category driving the category multiplier", default: FULL, constraints: "FULL | REDUCED | PARATRANSIT" }
      - { name: mobility_device, type: enum, source: input, description: "Declared mobility device; WHEELCHAIR forces wav_required on every trip this rider books", default: NONE, constraints: "NONE | WHEELCHAIR" }
      - { name: fare_counter_date, type: string, source: computed, description: "UTC service date (YYYY-MM-DD) that daily_fare_paid_cents currently covers; null until the first FareTransaction", default: null }
      - { name: fare_counter_week_start, type: string, source: computed, description: "UTC date (YYYY-MM-DD) of the Monday anchoring the ISO week that weekly_fare_paid_cents currently covers; null until the first FareTransaction", default: null }
      - { name: daily_fare_paid_cents, type: integer, source: computed, description: "Sum of FareTransaction.amount_cents for this rider whose service_date == fare_counter_date", default: 0 }
      - { name: weekly_fare_paid_cents, type: integer, source: computed, description: "Sum of FareTransaction.amount_cents for this rider whose service_date falls in the ISO week starting at fare_counter_week_start", default: 0 }

  - name: DemandForecast
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone this forecast sizes fleet for" }
      - { name: window_start_utc, type: datetime, source: input, description: "Inclusive start of the forecast window" }
      - { name: window_end_utc, type: datetime, source: input, description: "Exclusive end of the forecast window", constraints: "> window_start_utc" }
      - { name: forecast_trips, type: integer, source: input, description: "Expected number of boarded trips inside the window", constraints: ">= 0" }
      - { name: peak_factor, type: number, source: input, description: "Ratio of peak-interval demand to average demand inside the window", constraints: ">= 1.00 and <= 4.00; 2 decimal places" }
      - { name: required_base_blocks, type: integer, source: computed, description: "Number of BASE VehicleBlocks the fleet-sizing rule requires for this window" }
      - { name: required_surge_blocks, type: integer, source: computed, description: "Number of SURGE VehicleBlocks the fleet-sizing rule requires for this window" }
      - { name: state, type: enum, source: system, description: "Forecast publication state", default: PUBLISHED, constraints: "PUBLISHED | SUPERSEDED" }

  - name: VehicleBlock
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone this block runs in" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle pinned to this block" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; driver rostered on this block" }
      - { name: block_type, type: enum, source: input, description: "Whether the block counts against base or peak-surge fleet sizing", constraints: "BASE | SURGE" }
      - { name: start_utc, type: datetime, source: input, description: "Inclusive start of the block's service window" }
      - { name: end_utc, type: datetime, source: input, description: "Exclusive end of the block's service window", constraints: "> start_utc" }
      - { name: state, type: enum, source: system, description: "Block lifecycle state", default: SCHEDULED, constraints: "SCHEDULED | OPEN | CLOSED | CANCELLED" }
      - { name: opened_at, type: datetime, source: system, description: "Logical clock reading when the block moved SCHEDULED -> OPEN; null before that", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock reading when the block moved OPEN -> CLOSED; null before that", default: null }
      - { name: seats_committed, type: integer, source: computed, description: "Sum of PoolAssignment.seats_held over this block's assignments whose state is in {OFFERED, ACCEPTED, ONBOARD}", default: 0 }
      - { name: wav_positions_committed, type: integer, source: computed, description: "Sum of PoolAssignment.wav_positions_held over this block's assignments whose state is in {OFFERED, ACCEPTED, ONBOARD}", default: 0 }
      - { name: committed_index_min, type: integer, source: computed, description: "Minimum VirtualStop.corridor_index over the origin and destination stops of this block's assignments whose state is in {OFFERED, ACCEPTED, ONBOARD}; null when that set is empty", default: null }
      - { name: committed_index_max, type: integer, source: computed, description: "Maximum VirtualStop.corridor_index over the origin and destination stops of this block's assignments whose state is in {OFFERED, ACCEPTED, ONBOARD}; null when that set is empty", default: null }
      - { name: boardings_count, type: integer, source: computed, description: "Sum of PoolAssignment.seats_held over this block's assignments with state == COMPLETED", default: 0 }
      - { name: scheduled_revenue_hours, type: number, source: computed, description: "(end_utc - start_utc) in hours, 2 decimal places, round_half_up" }
      - { name: actual_revenue_hours, type: number, source: computed, description: "(closed_at - opened_at) in hours, 2 decimal places, round_half_up; 0.00 whenever state != CLOSED", default: 0.00 }

  - name: TripRequest
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone the trip is requested in" }
      - { name: rider_id, type: string, source: input, description: "FK -> Rider.id; the requesting rider" }
      - { name: origin_stop_id, type: string, source: input, description: "FK -> VirtualStop.id; boarding virtual stop" }
      - { name: destination_stop_id, type: string, source: input, description: "FK -> VirtualStop.id; alighting virtual stop", constraints: "must differ from origin_stop_id" }
      - { name: connection_id, type: string, source: input, description: "FK -> TransitConnection.id; the rail/bus departure this first/last-mile trip is timed to; nullable", default: null }
      - { name: assigned_block_id, type: string, source: computed, description: "FK -> VehicleBlock.id; block currently holding a non-terminal PoolAssignment for this trip; null whenever no such assignment exists", default: null }
      - { name: requested_pickup_utc, type: datetime, source: input, description: "Rider's desired boarding instant" }
      - { name: party_size, type: integer, source: input, description: "Number of ambulatory seats requested", default: 1, constraints: ">= 1 and <= 6" }
      - { name: wav_required, type: boolean, source: computed, description: "true when the request body supplied wav_required == true OR the Rider's mobility_device == WHEELCHAIR; the request body value alone never overrides a WHEELCHAIR rider" }
      - { name: status, type: enum, source: system, description: "Trip fulfilment axis", default: RECEIVED, constraints: "RECEIVED | MATCHING | OFFERED | ASSIGNED | PICKED_UP | COMPLETED | CANCELLED | NO_SERVICE" }
      - { name: fare_status, type: enum, source: system, description: "Fare axis, evolving independently of status on the same row", default: UNPRICED, constraints: "UNPRICED | QUOTED | CAPPED | CHARGED | REFUNDED" }
      - { name: no_service_reason, type: enum, source: system, description: "Why the trip ended in NO_SERVICE; null in every other status", default: null, constraints: "NO_ELIGIBLE_BLOCK | ZONE_SUSPENDED | MAX_ATTEMPTS_EXHAUSTED" }
      - { name: match_attempt_count, type: integer, source: computed, description: "Number of PoolAssignment offers ever created for this trip, incremented once per successful offer creation and never decremented", default: 0 }
      - { name: baseline_direct_minutes, type: integer, source: computed, description: "TRAVEL_MINUTES_PER_INDEX * abs(destination corridor_index - origin corridor_index); recomputed on every offer creation; null before the first offer", default: null }
      - { name: projected_detour_minutes, type: integer, source: computed, description: "Detour minutes the current offer imposes on this trip relative to baseline_direct_minutes; null whenever assigned_block_id is null", default: null }
      - { name: promised_pickup_utc, type: datetime, source: computed, description: "max(requested_pickup_utc, logical clock at offer creation); null whenever assigned_block_id is null", default: null }
      - { name: promised_dropoff_utc, type: datetime, source: computed, description: "promised_pickup_utc + (baseline_direct_minutes + projected_detour_minutes) minutes; null whenever assigned_block_id is null", default: null }
      - { name: actual_pickup_utc, type: datetime, source: system, description: "Logical clock reading when the assignment moved ACCEPTED -> ONBOARD; null before that", default: null }
      - { name: actual_dropoff_utc, type: datetime, source: system, description: "Logical clock reading when the assignment moved ONBOARD -> COMPLETED; null before that", default: null }
      - { name: wait_minutes, type: integer, source: computed, description: "max(0, round_half_up((actual_pickup_utc - requested_pickup_utc) / 60 seconds)); null until actual_pickup_utc is set", default: null }
      - { name: ride_minutes, type: integer, source: computed, description: "round_half_up((actual_dropoff_utc - actual_pickup_utc) / 60 seconds); null until actual_dropoff_utc is set", default: null }
      - { name: quoted_fare_cents, type: integer, source: computed, description: "Output of the trip_fare calculation under variant PROVISIONAL_QUOTE; null whenever fare_status == UNPRICED", default: null }
      - { name: charged_fare_cents, type: integer, source: computed, description: "Output of the trip_fare calculation under variant SETTLED_CHARGE; 0 after a refund; null until fare_status reaches CHARGED", default: null }
      - { name: applied_cap, type: enum, source: computed, description: "Which fare cap bound the settled charge; null until fare_status reaches CHARGED", default: null, constraints: "NONE | DAILY | WEEKLY" }

  - name: PoolAssignment
    parent: null
    common_fields: true
    fields:
      - { name: block_id, type: string, source: input, description: "FK -> VehicleBlock.id; block whose manifest this entry sits on" }
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; trip offered onto the block" }
      - { name: seats_held, type: integer, source: system, description: "Copied from TripRequest.party_size at creation and frozen thereafter" }
      - { name: wav_positions_held, type: integer, source: system, description: "1 when the trip's wav_required == true, otherwise 0; frozen at creation" }
      - { name: seq_pickup, type: integer, source: computed, description: "1-based pickup order along the corridor among this block's assignments whose state is in {OFFERED, ACCEPTED, ONBOARD}, ordered by origin corridor_index ASC then PoolAssignment.created_at ASC" }
      - { name: baseline_direct_minutes, type: integer, source: computed, description: "Copy of the trip's baseline_direct_minutes as evaluated at creation" }
      - { name: projected_detour_minutes, type: integer, source: computed, description: "Detour minutes this offer imposes, as evaluated at creation" }
      - { name: match_score, type: number, source: computed, description: "pool_match_selection score of the winning block; null when offer_origin == MANUAL_DISPATCH", default: null }
      - { name: offer_origin, type: enum, source: system, description: "How the offer was produced", constraints: "AUTO_MATCH | MANUAL_DISPATCH" }
      - { name: state, type: enum, source: system, description: "Offer lifecycle state", default: OFFERED, constraints: "OFFERED | ACCEPTED | DECLINED | ONBOARD | COMPLETED | RELEASED" }

  - name: FareTransaction
    parent: null
    common_fields: false
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; trip this ledger row belongs to" }
      - { name: rider_id, type: string, source: input, description: "FK -> Rider.id; rider whose fare counters this row moves" }
      - { name: kind, type: enum, source: system, description: "Ledger row kind", constraints: "CHARGE | TRANSFER_CREDIT | CAP_REBATE | REFUND" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents; CHARGE is positive, TRANSFER_CREDIT / CAP_REBATE / REFUND are negative" }
      - { name: service_date, type: string, source: system, description: "UTC calendar date (YYYY-MM-DD) of the logical clock when the row was appended" }
      - { name: applied_cap, type: enum, source: system, description: "Cap that bound the settlement this row belongs to", constraints: "NONE | DAILY | WEEKLY" }

  - name: SubsidyReport
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; zone the reporting period covers" }
      - { name: period_start_date, type: string, source: input, description: "Inclusive first UTC service date of the reporting period (YYYY-MM-DD)" }
      - { name: period_end_date, type: string, source: input, description: "Inclusive last UTC service date of the reporting period (YYYY-MM-DD)", constraints: ">= period_start_date" }
      - { name: variant, type: enum, source: input, description: "Which subsidy_per_trip variant this report is filed under", constraints: "PROVISIONAL | FINAL" }
      - { name: state, type: enum, source: system, description: "Reporting workflow state", default: DRAFT, constraints: "DRAFT | SUBMITTED | CERTIFIED | REJECTED | AMENDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceAnalyst on the most recent submit; null before the first submit", default: null }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the FundingAgencyAuditor on the most recent certify; cleared to null on amend", default: null }
      - { name: rejection_reason, type: string, source: system, description: "Free-text reason recorded by the auditor on reject; cleared to null on the next submit", default: null }
      - { name: amendment_count, type: integer, source: computed, description: "Number of CERTIFIED -> AMENDED transitions this report has undergone", default: 0 }
      - { name: total_trips, type: integer, source: computed, description: "Denominator of subsidy_per_trip_cents under this report's variant; recomputed on every submit", default: 0 }
      - { name: total_fare_revenue_cents, type: integer, source: computed, description: "Sum of FareTransaction.amount_cents over the trips in this report's variant scope; recomputed on every submit", default: 0 }
      - { name: total_operating_cost_cents, type: integer, source: computed, description: "Sum of per-block operating cost over the blocks in this report's variant scope; recomputed on every submit", default: 0 }
      - { name: subsidy_per_trip_cents, type: integer, source: computed, description: "(total_operating_cost_cents - total_fare_revenue_cents) / total_trips, round_half_up to whole cents; 0 when total_trips == 0", default: 0 }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceZone
    dimension: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /service-zones/{id}/activate"
        actor: ZoneAdmin
        preconditions:
          - "ServiceZone.status == DRAFT"
        side_effects:
          - "increments ServiceZone.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /service-zones/{id}/activate"
        actor: ZoneAdmin
        preconditions:
          - "ServiceZone.status == SUSPENDED"
        side_effects:
          - "increments ServiceZone.version by 1"
        note: "Cyclic re-entry; suspended trips are NOT restored — NO_SERVICE is terminal."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /service-zones/{id}/suspend"
        actor: ZoneAdmin
        preconditions:
          - "ServiceZone.status == ACTIVE"
        side_effects:
          - "every TripRequest in this zone with status IN {RECEIVED, MATCHING} -> status = NO_SERVICE, no_service_reason = ZONE_SUSPENDED, assigned_block_id = null (processed in TripRequest.created_at ASC order)"
          - "for each such trip, if fare_status == QUOTED then fare_status = UNPRICED and quoted_fare_cents = null"
          - "recomputes ServiceZone.unserved_trip_count"
          - "increments ServiceZone.version by 1"

  - entity: VirtualStop
    dimension: status
    initial_state: PROPOSED
    terminal_states: [RETIRED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /virtual-stops/{id}/approve"
        actor: ZoneAdmin
        preconditions:
          - "VirtualStop.status == PROPOSED"
          - "ServiceZone.status IN {DRAFT, ACTIVE} for VirtualStop.zone_id"
          - "VirtualStop.walk_shed_meters <= ServiceZone.max_walk_meters (walking-distance standard)"
        side_effects:
          - "increments VirtualStop.version by 1"
      - from: PROPOSED
        to: RETIRED
        trigger: "POST /virtual-stops/{id}/retire"
        actor: ZoneAdmin
        preconditions:
          - "VirtualStop.status == PROPOSED"
          - "no TripRequest has origin_stop_id or destination_stop_id equal to this stop with status IN {RECEIVED, MATCHING, OFFERED, ASSIGNED, PICKED_UP}"
        side_effects:
          - "increments VirtualStop.version by 1"
      - from: APPROVED
        to: RETIRED
        trigger: "POST /virtual-stops/{id}/retire"
        actor: ZoneAdmin
        preconditions:
          - "VirtualStop.status == APPROVED"
          - "no TripRequest has origin_stop_id or destination_stop_id equal to this stop with status IN {RECEIVED, MATCHING, OFFERED, ASSIGNED, PICKED_UP}"
        side_effects:
          - "every VirtualStop whose paired_stop_id == this stop's id has paired_stop_id set to null (processed in VirtualStop.created_at ASC order)"
          - "increments VirtualStop.version by 1"

  - entity: Vehicle
    dimension: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "POST /vehicles/{id}/status with status = IN_MAINTENANCE"
        actor: ZoneAdmin
        preconditions:
          - "Vehicle.status == AVAILABLE"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "POST /vehicles/{id}/status with status = AVAILABLE"
        actor: ZoneAdmin
        preconditions:
          - "Vehicle.status == IN_MAINTENANCE"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /vehicles/{id}/status with status = RETIRED"
        actor: ZoneAdmin
        preconditions:
          - "Vehicle.status == AVAILABLE"
          - "no VehicleBlock references this vehicle with state IN {SCHEDULED, OPEN}"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: IN_MAINTENANCE
        to: RETIRED
        trigger: "POST /vehicles/{id}/status with status = RETIRED"
        actor: ZoneAdmin
        preconditions:
          - "Vehicle.status == IN_MAINTENANCE"
          - "no VehicleBlock references this vehicle with state IN {SCHEDULED, OPEN}"
        side_effects:
          - "increments Vehicle.version by 1"

  - entity: Driver
    dimension: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /drivers/{id}/status with status = SUSPENDED"
        actor: ZoneAdmin
        preconditions:
          - "Driver.status == ACTIVE"
        side_effects:
          - "every VehicleBlock with driver_id == this driver and state == SCHEDULED -> state = CANCELLED (processed in VehicleBlock.start_utc ASC then VehicleBlock.created_at ASC order)"
          - "increments Driver.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: third consecutive decline (cascade from POST /pool-assignments/{id}/decline)"
        actor: system
        preconditions:
          - "Driver.status == ACTIVE"
          - "Driver.consecutive_decline_count >= DECLINE_SUSPENSION_THRESHOLD (3) after the decline increment"
        side_effects:
          - "every VehicleBlock with driver_id == this driver and state == SCHEDULED -> state = CANCELLED (processed in VehicleBlock.start_utc ASC then VehicleBlock.created_at ASC order)"
          - "increments Driver.version by 1"
        note: "Third hop of the decline cascade; only SCHEDULED blocks are cancelled, so this cascade never re-enters the block-cancel release chain."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /drivers/{id}/status with status = ACTIVE"
        actor: ZoneAdmin
        preconditions:
          - "Driver.status == SUSPENDED"
        side_effects:
          - "Driver.consecutive_decline_count = 0"
          - "increments Driver.version by 1"

  - entity: DemandForecast
    dimension: state
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: POST /demand-forecasts created a new forecast whose window overlaps this one"
        actor: system
        preconditions:
          - "DemandForecast.state == PUBLISHED"
          - "same zone_id as the incoming forecast"
          - "half-open window intersection: existing.window_start_utc < incoming.window_end_utc AND incoming.window_start_utc < existing.window_end_utc"
        side_effects:
          - "increments DemandForecast.version by 1"
        note: "Create-with-supersede; the incoming create is guarded by OCC on ServiceZone.version (§1.2.1)."

  - entity: VehicleBlock
    dimension: state
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /vehicle-blocks/{id}/open"
        actor: Dispatcher
        preconditions:
          - "VehicleBlock.state == SCHEDULED"
          - "ServiceZone.status == ACTIVE for VehicleBlock.zone_id"
          - "Vehicle.status == AVAILABLE for VehicleBlock.vehicle_id"
          - "Driver.status == ACTIVE for VehicleBlock.driver_id"
          - "fleet-sizing cap from the covering PUBLISHED DemandForecast is not exceeded (validations priority 56)"
        side_effects:
          - "opened_at = logical clock now"
          - "increments VehicleBlock.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /vehicle-blocks/{id}/close"
        actor: Dispatcher
        preconditions:
          - "VehicleBlock.state == OPEN"
          - "no PoolAssignment on this block has state IN {OFFERED, ACCEPTED, ONBOARD}"
        side_effects:
          - "closed_at = logical clock now"
          - "recomputes VehicleBlock.actual_revenue_hours"
          - "recomputes ServiceZone.boardings_per_revenue_hour for VehicleBlock.zone_id"
          - "increments VehicleBlock.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vehicle-blocks/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "VehicleBlock.state == SCHEDULED"
        side_effects:
          - "increments VehicleBlock.version by 1"
        note: "A SCHEDULED block can hold no assignments, so no release chain fires."
      - from: OPEN
        to: CANCELLED
        trigger: "POST /vehicle-blocks/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "VehicleBlock.state == OPEN"
          - "no PoolAssignment on this block has state == ONBOARD"
        side_effects:
          - "HOP 1: seats_committed = 0, wav_positions_committed = 0, committed_index_min = null, committed_index_max = null"
          - "HOP 2 (caused by HOP 1): every PoolAssignment on this block with state IN {OFFERED, ACCEPTED} -> state = RELEASED, processed in PoolAssignment.created_at ASC order"
          - "HOP 3 (caused by HOP 2): for each released assignment, its TripRequest with status IN {OFFERED, ASSIGNED} -> assigned_block_id = null, projected_detour_minutes = null, promised_pickup_utc = null, promised_dropoff_utc = null; fare_status QUOTED -> UNPRICED with quoted_fare_cents = null; status -> MATCHING when match_attempt_count < MAX_MATCH_ATTEMPTS (2)"
          - "HOP 4 (caused by HOP 3): for each such TripRequest whose match_attempt_count >= MAX_MATCH_ATTEMPTS (2), status -> NO_SERVICE with no_service_reason = MAX_ATTEMPTS_EXHAUSTED, and ServiceZone.unserved_trip_count is recomputed for TripRequest.zone_id"
          - "increments VehicleBlock.version by 1"

  - entity: TripRequest
    dimension: status
    initial_state: RECEIVED
    terminal_states: [COMPLETED, CANCELLED, NO_SERVICE]
    transitions:
      - from: RECEIVED
        to: OFFERED
        trigger: "POST /trip-requests/{id}/match (candidate pool non-empty) or POST /pool-assignments"
        actor: Dispatcher
        preconditions:
          - "TripRequest.status == RECEIVED"
          - "ServiceZone.status == ACTIVE for TripRequest.zone_id"
          - "a PoolAssignment is created (all §1.4 offer checks pass)"
        side_effects:
          - "creates PoolAssignment with state = OFFERED"
          - "match_attempt_count += 1"
          - "assigned_block_id, baseline_direct_minutes, projected_detour_minutes, promised_pickup_utc, promised_dropoff_utc set"
          - "VehicleBlock.seats_committed += party_size, wav_positions_committed += (1 when wav_required else 0), committed_index_min/max recomputed"
          - "fare_status UNPRICED -> QUOTED with quoted_fare_cents = trip_fare under variant PROVISIONAL_QUOTE"
          - "increments VehicleBlock.version by 1"
      - from: MATCHING
        to: OFFERED
        trigger: "POST /trip-requests/{id}/match (candidate pool non-empty) or POST /pool-assignments"
        actor: Dispatcher
        preconditions:
          - "TripRequest.status == MATCHING"
          - "ServiceZone.status == ACTIVE for TripRequest.zone_id"
          - "a PoolAssignment is created (all §1.4 offer checks pass)"
        side_effects:
          - "identical to the RECEIVED -> OFFERED side-effect set"
      - from: RECEIVED
        to: MATCHING
        trigger: "POST /trip-requests/{id}/match (candidate pool empty)"
        actor: Dispatcher
        preconditions:
          - "TripRequest.status == RECEIVED"
          - "ServiceZone.status == ACTIVE for TripRequest.zone_id"
          - "pool_match_selection candidate set is empty"
          - "match_attempt_count < MAX_MATCH_ATTEMPTS (2)"
        side_effects:
          - "increments TripRequest.version by 1"
        note: "match_attempt_count is NOT incremented when no offer is created."
      - from: MATCHING
        to: MATCHING
        trigger: "POST /trip-requests/{id}/match (candidate pool empty)"
        actor: Dispatcher
        preconditions:
          - "TripRequest.status == MATCHING"
          - "ServiceZone.status == ACTIVE for TripRequest.zone_id"
          - "pool_match_selection candidate set is empty"
          - "match_attempt_count < MAX_MATCH_ATTEMPTS (2)"
        side_effects:
          - "increments TripRequest.version by 1"
        note: "Self-loop: the trip stays queued for another matching round."
      - from: MATCHING
        to: NO_SERVICE
        trigger: "POST /trip-requests/{id}/match (candidate pool empty and offers exhausted)"
        actor: Dispatcher
        preconditions:
          - "TripRequest.status == MATCHING"
          - "pool_match_selection candidate set is empty"
          - "match_attempt_count >= MAX_MATCH_ATTEMPTS (2)"
        side_effects:
          - "no_service_reason = NO_ELIGIBLE_BLOCK"
          - "recomputes ServiceZone.unserved_trip_count"
      - from: OFFERED
        to: ASSIGNED
        trigger: "POST /pool-assignments/{id}/accept"
        actor: DriverUser
        preconditions:
          - "TripRequest.status == OFFERED"
          - "PoolAssignment.state == OFFERED"
          - "VehicleBlock.state == OPEN"
        side_effects:
          - "PoolAssignment.state = ACCEPTED"
          - "Driver.consecutive_decline_count = 0"
      - from: OFFERED
        to: MATCHING
        trigger: "system: cascade from POST /pool-assignments/{id}/decline or POST /vehicle-blocks/{id}/cancel"
        actor: system
        preconditions:
          - "TripRequest.status == OFFERED"
          - "match_attempt_count < MAX_MATCH_ATTEMPTS (2)"
        side_effects:
          - "assigned_block_id = null, projected_detour_minutes = null, promised_pickup_utc = null, promised_dropoff_utc = null"
          - "fare_status QUOTED -> UNPRICED with quoted_fare_cents = null"
      - from: OFFERED
        to: NO_SERVICE
        trigger: "system: cascade from POST /pool-assignments/{id}/decline or POST /vehicle-blocks/{id}/cancel"
        actor: system
        preconditions:
          - "TripRequest.status == OFFERED"
          - "match_attempt_count >= MAX_MATCH_ATTEMPTS (2)"
        side_effects:
          - "assigned_block_id = null, no_service_reason = MAX_ATTEMPTS_EXHAUSTED"
          - "fare_status QUOTED -> UNPRICED with quoted_fare_cents = null"
          - "recomputes ServiceZone.unserved_trip_count"
      - from: ASSIGNED
        to: PICKED_UP
        trigger: "POST /pool-assignments/{id}/board"
        actor: DriverUser
        preconditions:
          - "TripRequest.status == ASSIGNED"
          - "PoolAssignment.state == ACCEPTED"
          - "VehicleBlock.state == OPEN"
        side_effects:
          - "PoolAssignment.state = ONBOARD"
          - "actual_pickup_utc = logical clock now, wait_minutes recomputed"
      - from: ASSIGNED
        to: MATCHING
        trigger: "system: cascade from POST /vehicle-blocks/{id}/cancel"
        actor: system
        preconditions:
          - "TripRequest.status == ASSIGNED"
          - "match_attempt_count < MAX_MATCH_ATTEMPTS (2)"
        side_effects:
          - "identical to the OFFERED -> MATCHING side-effect set"
      - from: ASSIGNED
        to: NO_SERVICE
        trigger: "system: cascade from POST /vehicle-blocks/{id}/cancel"
        actor: system
        preconditions:
          - "TripRequest.status == ASSIGNED"
          - "match_attempt_count >= MAX_MATCH_ATTEMPTS (2)"
        side_effects:
          - "identical to the OFFERED -> NO_SERVICE side-effect set"
      - from: PICKED_UP
        to: COMPLETED
        trigger: "POST /pool-assignments/{id}/complete"
        actor: DriverUser
        preconditions:
          - "TripRequest.status == PICKED_UP"
          - "PoolAssignment.state == ONBOARD"
        side_effects:
          - "PoolAssignment.state = COMPLETED"
          - "actual_dropoff_utc = logical clock now, ride_minutes recomputed"
          - "VehicleBlock.seats_committed -= seats_held, wav_positions_committed -= wav_positions_held, boardings_count += seats_held, committed_index_min/max recomputed"
          - "fare_status QUOTED|CAPPED -> CHARGED with charged_fare_cents and applied_cap = trip_fare under variant SETTLED_CHARGE"
          - "recomputes ServiceZone.completed_trip_count, avg_wait_minutes, avg_ride_minutes, wav_avg_wait_minutes, nonwav_avg_wait_minutes, wav_equivalence_ratio, equivalence_verdict"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /trip-requests/{id}/cancel"
        actor: Rider
        preconditions:
          - "TripRequest.status == RECEIVED"
        side_effects:
          - "increments TripRequest.version by 1"
      - from: MATCHING
        to: CANCELLED
        trigger: "POST /trip-requests/{id}/cancel"
        actor: Rider
        preconditions:
          - "TripRequest.status == MATCHING"
        side_effects:
          - "increments TripRequest.version by 1"
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /trip-requests/{id}/cancel"
        actor: Rider
        preconditions:
          - "TripRequest.status == OFFERED"
        side_effects:
          - "the trip's PoolAssignment with state == OFFERED -> state = RELEASED"
          - "VehicleBlock.seats_committed -= seats_held, wav_positions_committed -= wav_positions_held, committed_index_min/max recomputed"
          - "assigned_block_id = null, promised_pickup_utc = null, promised_dropoff_utc = null, projected_detour_minutes = null"
          - "fare_status QUOTED -> UNPRICED with quoted_fare_cents = null"
          - "increments VehicleBlock.version by 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /trip-requests/{id}/cancel"
        actor: Rider
        preconditions:
          - "TripRequest.status == ASSIGNED"
        side_effects:
          - "the trip's PoolAssignment with state == ACCEPTED -> state = RELEASED"
          - "identical remaining side-effect set to OFFERED -> CANCELLED"
      - from: RECEIVED
        to: NO_SERVICE
        trigger: "system: cascade from POST /service-zones/{id}/suspend"
        actor: system
        preconditions:
          - "TripRequest.status == RECEIVED"
          - "ServiceZone.status transitions ACTIVE -> SUSPENDED"
        side_effects:
          - "no_service_reason = ZONE_SUSPENDED"
          - "recomputes ServiceZone.unserved_trip_count"
      - from: MATCHING
        to: NO_SERVICE
        trigger: "system: cascade from POST /service-zones/{id}/suspend"
        actor: system
        preconditions:
          - "TripRequest.status == MATCHING"
          - "ServiceZone.status transitions ACTIVE -> SUSPENDED"
        side_effects:
          - "no_service_reason = ZONE_SUSPENDED"
          - "recomputes ServiceZone.unserved_trip_count"

  - entity: TripRequest
    dimension: fare_status
    initial_state: UNPRICED
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPRICED
        to: QUOTED
        trigger: "POST /trip-requests/{id}/match or POST /pool-assignments (offer created)"
        actor: Dispatcher
        preconditions:
          - "TripRequest.fare_status == UNPRICED"
          - "a PoolAssignment is created for this trip"
        side_effects:
          - "quoted_fare_cents = trip_fare under variant PROVISIONAL_QUOTE"
      - from: QUOTED
        to: UNPRICED
        trigger: "system: cascade from decline / block cancel / trip cancel (offer released)"
        actor: system
        preconditions:
          - "TripRequest.fare_status == QUOTED"
          - "the trip's PoolAssignment leaves {OFFERED, ACCEPTED} for DECLINED or RELEASED"
        side_effects:
          - "quoted_fare_cents = null"
      - from: QUOTED
        to: CAPPED
        trigger: "system: cascade from POST /pool-assignments/{id}/complete on another trip of the same rider"
        actor: system
        preconditions:
          - "TripRequest.fare_status == QUOTED"
          - "the settling trip belongs to the same Rider"
          - "after settlement, Rider.daily_fare_paid_cents >= ServiceZone.fare_cap_cents_daily for the trip's zone"
        side_effects:
          - "quoted_fare_cents = 0"
      - from: QUOTED
        to: CHARGED
        trigger: "POST /pool-assignments/{id}/complete"
        actor: DriverUser
        preconditions:
          - "TripRequest.fare_status == QUOTED"
          - "TripRequest.status transitions PICKED_UP -> COMPLETED"
        side_effects:
          - "charged_fare_cents and applied_cap = trip_fare under variant SETTLED_CHARGE"
          - "appends FareTransaction rows: CHARGE (+category_cents), TRANSFER_CREDIT (-transfer_credit_cents, only when > 0), CAP_REBATE (-cap_rebate_cents, only when > 0)"
          - "recomputes Rider.fare_counter_date, fare_counter_week_start, daily_fare_paid_cents, weekly_fare_paid_cents"
      - from: CAPPED
        to: CHARGED
        trigger: "POST /pool-assignments/{id}/complete"
        actor: DriverUser
        preconditions:
          - "TripRequest.fare_status == CAPPED"
          - "TripRequest.status transitions PICKED_UP -> COMPLETED"
        side_effects:
          - "identical side-effect set to QUOTED -> CHARGED"
      - from: CAPPED
        to: UNPRICED
        trigger: "system: cascade from decline / block cancel / trip cancel (offer released)"
        actor: system
        preconditions:
          - "TripRequest.fare_status == CAPPED"
          - "the trip's PoolAssignment leaves {OFFERED, ACCEPTED} for DECLINED or RELEASED"
        side_effects:
          - "quoted_fare_cents = null"
      - from: CHARGED
        to: REFUNDED
        trigger: "POST /trip-requests/{id}/refund"
        actor: Dispatcher
        preconditions:
          - "TripRequest.fare_status == CHARGED"
        side_effects:
          - "appends FareTransaction row REFUND with amount_cents = -charged_fare_cents"
          - "charged_fare_cents = 0"
          - "recomputes Rider.daily_fare_paid_cents and weekly_fare_paid_cents"
          - "recomputes ServiceZone metrics unaffected (revenue is read from FareTransaction at report submit time)"

  - entity: PoolAssignment
    dimension: state
    initial_state: OFFERED
    terminal_states: [DECLINED, RELEASED, COMPLETED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /pool-assignments/{id}/accept"
        actor: DriverUser
        preconditions:
          - "PoolAssignment.state == OFFERED"
          - "VehicleBlock.state == OPEN for PoolAssignment.block_id"
          - "X-User-ID == VehicleBlock.driver_id"
        side_effects:
          - "TripRequest.status OFFERED -> ASSIGNED"
          - "Driver.consecutive_decline_count = 0"
          - "seats_committed and wav_positions_committed on the block are unchanged (already held since OFFERED)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /pool-assignments/{id}/decline"
        actor: DriverUser
        preconditions:
          - "PoolAssignment.state == OFFERED"
          - "VehicleBlock.state == OPEN for PoolAssignment.block_id"
          - "X-User-ID == VehicleBlock.driver_id"
        side_effects:
          - "HOP 1: VehicleBlock.seats_committed -= seats_held, wav_positions_committed -= wav_positions_held, committed_index_min/max recomputed, VehicleBlock.version += 1"
          - "HOP 2 (caused by HOP 1): Driver.consecutive_decline_count += 1; TripRequest status OFFERED -> MATCHING (or NO_SERVICE when match_attempt_count >= 2) with fare_status QUOTED|CAPPED -> UNPRICED"
          - "HOP 3 (caused by HOP 2): when Driver.consecutive_decline_count >= DECLINE_SUSPENSION_THRESHOLD (3), Driver.status ACTIVE -> SUSPENDED and every VehicleBlock of that driver with state == SCHEDULED -> CANCELLED"
        note: "Divergent branch: unlike ACCEPTED, this branch releases capacity, moves the driver's decline counter, and can suspend the driver."
      - from: OFFERED
        to: RELEASED
        trigger: "system: cascade from POST /vehicle-blocks/{id}/cancel or POST /trip-requests/{id}/cancel"
        actor: system
        preconditions:
          - "PoolAssignment.state == OFFERED"
        side_effects:
          - "VehicleBlock.seats_committed -= seats_held, wav_positions_committed -= wav_positions_held, committed_index_min/max recomputed"
          - "Driver.consecutive_decline_count is NOT changed"
        note: "Divergent branch: same capacity release as DECLINED but no driver penalty."
      - from: ACCEPTED
        to: ONBOARD
        trigger: "POST /pool-assignments/{id}/board"
        actor: DriverUser
        preconditions:
          - "PoolAssignment.state == ACCEPTED"
          - "VehicleBlock.state == OPEN for PoolAssignment.block_id"
          - "X-User-ID == VehicleBlock.driver_id"
        side_effects:
          - "TripRequest.status ASSIGNED -> PICKED_UP, actual_pickup_utc = logical clock now, wait_minutes recomputed"
      - from: ACCEPTED
        to: RELEASED
        trigger: "system: cascade from POST /vehicle-blocks/{id}/cancel or POST /trip-requests/{id}/cancel"
        actor: system
        preconditions:
          - "PoolAssignment.state == ACCEPTED"
        side_effects:
          - "identical side-effect set to OFFERED -> RELEASED"
      - from: ONBOARD
        to: COMPLETED
        trigger: "POST /pool-assignments/{id}/complete"
        actor: DriverUser
        preconditions:
          - "PoolAssignment.state == ONBOARD"
          - "X-User-ID == VehicleBlock.driver_id"
        side_effects:
          - "HOP 1: VehicleBlock.seats_committed -= seats_held, wav_positions_committed -= wav_positions_held, boardings_count += seats_held, committed_index_min/max recomputed, VehicleBlock.version += 1"
          - "HOP 2 (caused by HOP 1): TripRequest status PICKED_UP -> COMPLETED, actual_dropoff_utc set, ride_minutes recomputed, fare_status QUOTED|CAPPED -> CHARGED with charged_fare_cents = trip_fare under variant SETTLED_CHARGE; FareTransaction rows appended; Rider.daily_fare_paid_cents and weekly_fare_paid_cents recomputed; ServiceZone metrics recomputed"
          - "HOP 3 (caused by HOP 2): when Rider.daily_fare_paid_cents >= ServiceZone.fare_cap_cents_daily after HOP 2, every OTHER TripRequest of the same Rider with fare_status == QUOTED gets quoted_fare_cents = 0 and fare_status -> CAPPED, processed in TripRequest.created_at ASC order"

  - entity: SubsidyReport
    dimension: state
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /subsidy-reports/{id}/submit"
        actor: FinanceAnalyst
        preconditions:
          - "SubsidyReport.state == DRAFT"
        side_effects:
          - "recomputes total_trips, total_fare_revenue_cents, total_operating_cost_cents, subsidy_per_trip_cents via subsidy_per_trip under this report's variant"
          - "submitted_by_user_id = X-User-ID, rejection_reason = null"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /subsidy-reports/{id}/submit"
        actor: FinanceAnalyst
        preconditions:
          - "SubsidyReport.state == REJECTED"
        side_effects:
          - "identical side-effect set to DRAFT -> SUBMITTED"
        note: "Revision loop: rejected reports are resubmitted with freshly recomputed totals."
      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /subsidy-reports/{id}/submit"
        actor: FinanceAnalyst
        preconditions:
          - "SubsidyReport.state == AMENDED"
        side_effects:
          - "identical side-effect set to DRAFT -> SUBMITTED"
        note: "Second leg of the amendment cycle."
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /subsidy-reports/{id}/certify"
        actor: FundingAgencyAuditor
        preconditions:
          - "SubsidyReport.state == SUBMITTED"
          - "X-User-ID != SubsidyReport.submitted_by_user_id (segregation of duties)"
          - "ServiceZone.equivalence_verdict == COMPLIANT for SubsidyReport.zone_id"
          - "every VehicleBlock of the zone whose start_utc UTC date falls in [period_start_date, period_end_date] has state IN {CLOSED, CANCELLED}"
        side_effects:
          - "certified_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /subsidy-reports/{id}/reject"
        actor: FundingAgencyAuditor
        preconditions:
          - "SubsidyReport.state == SUBMITTED"
        side_effects:
          - "rejection_reason = request body rejection_reason"
      - from: CERTIFIED
        to: AMENDED
        trigger: "POST /subsidy-reports/{id}/amend"
        actor: FinanceAnalyst
        preconditions:
          - "SubsidyReport.state == CERTIFIED"
        side_effects:
          - "amendment_count += 1, certified_by_user_id = null"
        note: "Closes the cycle CERTIFIED -> AMENDED -> SUBMITTED -> CERTIFIED."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-stale-block
    parent_entity: VehicleBlock
    write_endpoint: "POST /pool-assignments"
    occ_field: "expected_vehicle_block_version"
    description: |
      Creating a PoolAssignment against a VehicleBlock whose version has advanced
      since the dispatcher last observed it is rejected. This captures the case
      where another offer has already been placed on the block and consumed part
      of its seat and securement-position capacity, so the dispatcher's view of
      seats_committed, wav_positions_committed and committed_index_min/max — the
      exact fields the detour and capacity checks read — is stale.
    error_id: ERR_STALE_VEHICLE_BLOCK_VERSION
    http_status: 412

  - rule_id: forecast-create-stale-zone
    parent_entity: ServiceZone
    write_endpoint: "POST /demand-forecasts"
    occ_field: "expected_service_zone_version"
    description: |
      Creating a DemandForecast against a ServiceZone whose version has advanced
      since the planner last observed it is rejected. A new forecast legitimately
      supersedes any PUBLISHED forecast whose window it overlaps, so a stale-view
      create would silently retire fleet-sizing numbers the planner never saw.
    error_id: ERR_STALE_SERVICE_ZONE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: corridor_travel_geometry
    trigger: "Evaluated inside pool_match_selection and on every PoolAssignment creation (POST /trip-requests/{id}/match, POST /pool-assignments)"
    algorithm: interval_merge
    formula: |
      # All travel time in this domain is a deterministic function of corridor index
      # distance. No wall-clock, no geography, no randomness.
      origin_ix      = VirtualStop[trip.origin_stop_id].corridor_index
      dest_ix        = VirtualStop[trip.destination_stop_id].corridor_index
      baseline_direct_minutes = TRAVEL_MINUTES_PER_INDEX * abs(dest_ix - origin_ix)

      # Candidate block's already-committed corridor span (null-safe).
      if block.committed_index_min is null:          # no non-terminal assignments
          span_min = min(origin_ix, dest_ix)
          span_max = max(origin_ix, dest_ix)
      else:
          span_min = min(block.committed_index_min, origin_ix, dest_ix)
          span_max = max(block.committed_index_max, origin_ix, dest_ix)

      new_span_indexes        = span_max - span_min
      projected_detour_minutes = TRAVEL_MINUTES_PER_INDEX * new_span_indexes
                                 - baseline_direct_minutes

      detour_allowance_minutes = max(
          zone.detour_tolerance_floor_minutes,
          ceil(baseline_direct_minutes * zone.detour_tolerance_pct)
      )
    input_set: "Only PoolAssignment rows with state IN {OFFERED, ACCEPTED, ONBOARD} contribute to block.committed_index_min / committed_index_max; DECLINED, RELEASED and COMPLETED rows are excluded."
    constants:
      TRAVEL_MINUTES_PER_INDEX: 3
    precision: "integer minutes; ceil() on the percentage allowance, no other rounding"
    variants: []

  - name: pool_match_selection
    trigger: "POST /trip-requests/{id}/match"
    algorithm: weighted_scoring
    formula: |
      # (a) ELIGIBILITY FILTER — the candidate set, as an explicit predicate.
      candidates = every VehicleBlock B such that ALL hold:
        B.zone_id == trip.zone_id
        B.state == OPEN
        Vehicle[B.vehicle_id].status == AVAILABLE
        Driver[B.driver_id].status == ACTIVE
        B.start_utc <= trip.requested_pickup_utc  AND  trip.requested_pickup_utc < B.end_utc
        B.seats_committed + trip.party_size <= Vehicle[B.vehicle_id].seat_capacity
        (trip.wav_required == false)
          OR (Vehicle[B.vehicle_id].wav_positions - B.wav_positions_committed >= 1
              AND Driver[B.driver_id].wav_certified == true)
        projected_detour_minutes(trip, B) <= detour_allowance_minutes(trip)
        curb_bucket_count(trip.origin_stop_id, promised_pickup_utc(trip))
          < zone.curb_capacity_per_bucket

      # (b) RANKING EXPRESSION — lowest match_score wins. Three-way non-linear
      #     interaction: a saturating detour term, a state-conditional surge
      #     penalty, a wav-headroom branch, and a saturating seat-slack term.
      remaining_seats = Vehicle[B.vehicle_id].seat_capacity
                        - B.seats_committed - trip.party_size
      wav_headroom    = Vehicle[B.vehicle_id].wav_positions - B.wav_positions_committed

      match_score = min(100, projected_detour_minutes(trip, B) * 4)
                  + (0 if B.block_type == 'BASE' else SURGE_PENALTY)
                  + (0 if trip.wav_required == false
                       else (0 if wav_headroom >= 2 else WAV_TIGHT_PENALTY))
                  + min(SEAT_SLACK_CAP, remaining_seats) * SEAT_SLACK_WEIGHT

      # (c) TIE-BREAK when match_score ties: B.start_utc ASC, then B.created_at ASC.
      # (d) EMPTY-POOL FALLBACK: no error. TripRequest.status becomes MATCHING when
      #     match_attempt_count < MAX_MATCH_ATTEMPTS, otherwise NO_SERVICE with
      #     no_service_reason = NO_ELIGIBLE_BLOCK. Response is 200 either way.
    input_set: "VehicleBlock rows with state == OPEN in the trip's zone only; SCHEDULED, CLOSED and CANCELLED blocks are never candidates."
    constants:
      SURGE_PENALTY: 15
      WAV_TIGHT_PENALTY: 8
      SEAT_SLACK_CAP: 12
      SEAT_SLACK_WEIGHT: 2
      MAX_MATCH_ATTEMPTS: 2
    precision: "integer score; no rounding required"
    variants: []

  - name: trip_fare
    trigger: "Variant PROVISIONAL_QUOTE on every PoolAssignment creation (fare_status UNPRICED -> QUOTED); variant SETTLED_CHARGE on POST /pool-assignments/{id}/complete (fare_status QUOTED|CAPPED -> CHARGED)"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. The apparent circularity — the band surcharge
      # is waived when a guaranteed transfer applies, while the transfer credit is
      # itself capped by the post-multiplier fare — is broken at step 2: the waiver
      # is decided ONLY from connection linkage and the pickup instant, NEVER from
      # the credit amount. Steps run strictly 1..8, no re-entry.

      # step 1 — distance band from the variant's minute basis
      m = variant_minutes            # see `variants:` below
      band = 'SHORT'  if m <= BAND_EDGE_SHORT_MINUTES
             else ('MEDIUM' if m <= BAND_EDGE_MEDIUM_MINUTES else 'LONG')

      # step 2 — guaranteed-transfer waiver (decided before any money is computed)
      if trip.connection_id is null:
          surcharge_waived = false
      else:
          c = TransitConnection[trip.connection_id]
          surcharge_waived = abs(variant_pickup_instant - c.scheduled_departure_utc)
                             <= c.guaranteed_transfer_buffer_minutes minutes

      # step 3 — gross fare
      gross_cents = zone.base_fare_cents
                  + (0 if surcharge_waived else BAND_SURCHARGE_CENTS[band])

      # step 4 — fare-category multiplier, rounded once, here
      category_cents = round_half_up(gross_cents * CATEGORY_MULTIPLIER[rider.fare_category])

      # step 5 — transfer credit, bounded by the post-multiplier fare
      transfer_credit_cents = min(c.transfer_credit_cents, category_cents)
                              if surcharge_waived else 0

      # step 6 — net fare before capping
      net_before_cap_cents = category_cents - transfer_credit_cents

      # step 7 — fare capping (daily and weekly headroom, both floored at 0)
      daily_headroom_cents  = max(0, zone.fare_cap_cents_daily
                                     - rider.daily_fare_paid_cents)
      weekly_headroom_cents = max(0, zone.fare_cap_cents_weekly
                                     - rider.weekly_fare_paid_cents)
      charge_cents = min(net_before_cap_cents, daily_headroom_cents, weekly_headroom_cents)

      # step 8 — which cap bound the result, and the rebate
      applied_cap = 'NONE' if charge_cents == net_before_cap_cents
                    else ('DAILY' if daily_headroom_cents <= weekly_headroom_cents
                          else 'WEEKLY')
      cap_rebate_cents = net_before_cap_cents - charge_cents
    input_set: |
      rider.daily_fare_paid_cents is the sum of FareTransaction.amount_cents for
      that rider whose service_date equals the logical clock's UTC date at the
      moment this calculation runs; when the rider's fare_counter_date differs
      from that date, the daily counter is treated as 0 (and the stored counter is
      reset before the new rows are appended). rider.weekly_fare_paid_cents uses
      the same rule against the Monday-anchored ISO week.
    constants:
      BAND_EDGE_SHORT_MINUTES: 10
      BAND_EDGE_MEDIUM_MINUTES: 20
      BAND_SURCHARGE_CENTS: { SHORT: 0, MEDIUM: 75, LONG: 150 }
      CATEGORY_MULTIPLIER: { FULL: 1.00, REDUCED: 0.50, PARATRANSIT: 0.00 }
    precision: "whole cents, round_half_up, applied exactly once at step 4 and nowhere else"
    variants:
      - name: PROVISIONAL_QUOTE
        when: "Runs at offer creation; writes TripRequest.quoted_fare_cents. fare_status UNPRICED -> QUOTED."
        difference: "variant_minutes = PoolAssignment.baseline_direct_minutes (the projected direct ride); variant_pickup_instant = TripRequest.requested_pickup_utc; rider counters are read as of offer creation."
      - name: SETTLED_CHARGE
        when: "Runs at drop-off; writes TripRequest.charged_fare_cents and TripRequest.applied_cap. fare_status QUOTED|CAPPED -> CHARGED."
        difference: "variant_minutes = TripRequest.ride_minutes (the actual measured ride); variant_pickup_instant = TripRequest.actual_pickup_utc — so a late arrival can lose the guaranteed-transfer waiver that the quote assumed; rider counters are read as of drop-off, so intervening settlements shrink the headroom."

  - name: fleet_sizing
    trigger: "POST /demand-forecasts (writes required_base_blocks and required_surge_blocks)"
    algorithm: threshold
    formula: |
      window_hours = (window_end_utc - window_start_utc) / 3600 seconds
      block_trip_capacity = TRIPS_PER_BLOCK_HOUR * window_hours

      required_base_blocks = ceil(forecast_trips / block_trip_capacity)

      peak_trips   = ceil(forecast_trips * peak_factor)
      surge_trips  = peak_trips - forecast_trips
      required_surge_blocks =
          0 if peak_factor <= SURGE_THRESHOLD_PEAK_FACTOR
            else min(MAX_SURGE_BLOCKS, ceil(surge_trips / block_trip_capacity))
    input_set: "Reads only the incoming request body plus the constants below; no other entity contributes."
    constants:
      TRIPS_PER_BLOCK_HOUR: 4
      SURGE_THRESHOLD_PEAK_FACTOR: 1.50
      MAX_SURGE_BLOCKS: 6
    precision: "integer block counts; ceil() on both divisions; the surge threshold is inclusive (peak_factor exactly 1.50 yields 0 surge blocks)"
    variants: []

  - name: subsidy_per_trip
    trigger: "POST /subsidy-reports/{id}/submit (writes total_trips, total_fare_revenue_cents, total_operating_cost_cents, subsidy_per_trip_cents)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round each block's cost to whole cents FIRST,
      # then sum. Summing the unrounded per-block costs and rounding once at the
      # end produces a different total and is WRONG.
      for each block B in block_scope (see variants):
          cost_B = round_half_up(revenue_hours(B)
                                 * OPERATING_COST_CENTS_PER_REVENUE_HOUR
                                 * (1 + ADMIN_OVERHEAD_PCT))
      total_operating_cost_cents = sum(cost_B)          # sum of ROUNDED values

      total_fare_revenue_cents = sum(FareTransaction.amount_cents
                                     for every FareTransaction whose
                                     trip_request_id is in trip_scope)
      total_trips = count(trip_scope)

      subsidy_per_trip_cents =
          0 if total_trips == 0
            else round_half_up((total_operating_cost_cents
                                - total_fare_revenue_cents) / total_trips)
    input_set: |
      block_scope is ordered by VehicleBlock.start_utc ASC then VehicleBlock.created_at
      ASC (the order is immaterial to the sum but pinned for auditability). A block
      is in period when the UTC calendar date of its start_utc falls inside
      [period_start_date, period_end_date] inclusive. A trip is in period when the
      UTC calendar date of its created_at falls inside the same inclusive range.
      FareTransaction rows are pulled by trip_request_id from trip_scope, so REFUND
      rows net out revenue automatically.
    constants:
      OPERATING_COST_CENTS_PER_REVENUE_HOUR: 8250
      ADMIN_OVERHEAD_PCT: 0.12
    precision: "whole cents, round_half_up, applied once per block and once on the final division"
    variants:
      - name: PROVISIONAL
        when: "SubsidyReport.variant == PROVISIONAL — filed while the period is still running."
        difference: "block_scope = blocks in period with state IN {SCHEDULED, OPEN, CLOSED}; revenue_hours(B) = B.scheduled_revenue_hours. trip_scope = trips in period with status IN {ASSIGNED, PICKED_UP, COMPLETED}."
      - name: FINAL
        when: "SubsidyReport.variant == FINAL — filed after every block in the period is finalized."
        difference: "block_scope = blocks in period with state == CLOSED only; revenue_hours(B) = B.actual_revenue_hours. trip_scope = trips in period with status == COMPLETED only."

  - name: service_performance_metrics
    trigger: "Recomputed on TripRequest PICKED_UP -> COMPLETED and on VehicleBlock OPEN -> CLOSED and on TripRequest -> NO_SERVICE; writes the computed metric fields on ServiceZone"
    algorithm: aggregation
    formula: |
      completed = TripRequest rows in the zone with status == COMPLETED
      avg_wait_minutes = 0.00 if count(completed) == 0
                         else round_half_up(mean(t.wait_minutes for t in completed), 2)
      avg_ride_minutes = 0.00 if count(completed) == 0
                         else round_half_up(mean(t.ride_minutes for t in completed), 2)

      wav    = [t in completed where t.wav_required == true]
      nonwav = [t in completed where t.wav_required == false]
      wav_avg_wait_minutes    = 0.00 if count(wav) == 0
                                else round_half_up(mean(t.wait_minutes for t in wav), 2)
      nonwav_avg_wait_minutes = 0.00 if count(nonwav) == 0
                                else round_half_up(mean(t.wait_minutes for t in nonwav), 2)

      wav_equivalence_ratio = 0.000 if nonwav_avg_wait_minutes == 0.00
                              else round_half_up(wav_avg_wait_minutes
                                                 / nonwav_avg_wait_minutes, 3)
      equivalence_verdict = 'COMPLIANT' if wav_equivalence_ratio
                                            <= WAV_EQUIVALENCE_MAX_RATIO
                            else 'DEFICIENT'

      closed_blocks = VehicleBlock rows in the zone with state == CLOSED
      total_boardings      = sum(B.boardings_count for B in closed_blocks)
      total_revenue_hours  = sum(B.actual_revenue_hours for B in closed_blocks)
      boardings_per_revenue_hour = 0.00 if total_revenue_hours == 0
                                   else round_half_up(total_boardings
                                                      / total_revenue_hours, 2)

      completed_trip_count = count(completed)
      unserved_trip_count  = count(TripRequest rows in the zone with status == NO_SERVICE)
    input_set: "Only TripRequest rows with status == COMPLETED feed the wait/ride means; only VehicleBlock rows with state == CLOSED feed boardings_per_revenue_hour. CANCELLED and NO_SERVICE trips are excluded from every mean."
    constants:
      WAV_EQUIVALENCE_MAX_RATIO: 1.25
    precision: "2 decimal places for minute means and boardings_per_revenue_hour, 3 decimal places for wav_equivalence_ratio, all round_half_up; the equivalence threshold is inclusive"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of {ZoneAdmin, Dispatcher, Rider, DriverUser, FinanceAnalyst, FundingAgencyAuditor} AND appears in the called endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "for X-User-Role == Rider, X-User-ID resolves to an existing Rider row; for X-User-Role == DriverUser, X-User-ID resolves to an existing Driver row"
    error_id: ERR_IDENTITY_NOT_FOUND
    http_status: 403
    applies_to: "all endpoints called as Rider or DriverUser"

  - priority: 4
    category: existence
    check: "every {id} path segment resolves to an existing row, validated left-to-right"
    error_id: "ERR_SERVICE_ZONE_NOT_FOUND | ERR_VIRTUAL_STOP_NOT_FOUND | ERR_TRANSIT_CONNECTION_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_DRIVER_NOT_FOUND | ERR_RIDER_NOT_FOUND | ERR_DEMAND_FORECAST_NOT_FOUND | ERR_VEHICLE_BLOCK_NOT_FOUND | ERR_TRIP_REQUEST_NOT_FOUND | ERR_POOL_ASSIGNMENT_NOT_FOUND | ERR_FARE_TRANSACTION_NOT_FOUND | ERR_SUBSIDY_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the field order declared in the endpoint's input list"
    error_id: "ERR_SERVICE_ZONE_NOT_FOUND | ERR_VIRTUAL_STOP_NOT_FOUND | ERR_TRANSIT_CONNECTION_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_DRIVER_NOT_FOUND | ERR_RIDER_NOT_FOUND | ERR_VEHICLE_BLOCK_NOT_FOUND | ERR_TRIP_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "POST /virtual-stops, POST /transit-connections, POST /vehicles, POST /drivers, POST /riders, POST /demand-forecasts, POST /vehicle-blocks, POST /trip-requests, POST /pool-assignments, POST /subsidy-reports"

  - priority: 6
    category: auth
    check: "ownership — Rider role may only create or act on a TripRequest whose rider_id == X-User-ID and may only read a TripRequest / PoolAssignment / FareTransaction belonging to that rider; DriverUser role may only act on or read a PoolAssignment whose block's driver_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /trip-requests, POST /trip-requests/{id}/cancel, POST /pool-assignments/{id}/accept, POST /pool-assignments/{id}/decline, POST /pool-assignments/{id}/board, POST /pool-assignments/{id}/complete, GET /trip-requests/{id}, GET /pool-assignments/{id}, GET /fare-transactions/{id}"

  - priority: 7
    category: business_constraint
    check: "every required input field is present, every value matches its declared type, every enum value is a declared member, every numeric range constraint in §1.1 holds, and TripRequest.destination_stop_id != origin_stop_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints with a request body"

  - priority: 8
    category: business_constraint
    check: "ServiceZone.zone_code is unique across all zones"
    error_id: ERR_DUPLICATE_ZONE_CODE
    http_status: 409
    applies_to: "POST /service-zones"

  - priority: 9
    category: business_referential
    check: "when paired_stop_id is supplied it must reference a VirtualStop in the same zone_id, with status != RETIRED, and must not equal the stop being created"
    error_id: ERR_PAIRED_STOP_INVALID
    http_status: 422
    applies_to: "POST /virtual-stops"

  - priority: 10
    category: business_temporal
    check: "SubsidyReport.period_end_date >= period_start_date"
    error_id: ERR_REPORT_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /subsidy-reports"

  - priority: 12
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_INVALID_ZONE_STATE | ERR_INVALID_STOP_STATE | ERR_INVALID_VEHICLE_STATE | ERR_INVALID_DRIVER_STATE | ERR_INVALID_BLOCK_STATE | ERR_INVALID_TRIP_STATE | ERR_INVALID_ASSIGNMENT_STATE | ERR_INVALID_REPORT_STATE"
    http_status: 409
    applies_to: "every state-transition endpoint (all POST /{collection}/{id}/{action} endpoints) plus POST /pool-assignments (TripRequest must be in RECEIVED or MATCHING, VehicleBlock must be OPEN)"

  - priority: 14
    category: state
    check: "ServiceZone.status == ACTIVE for the zone the operation touches"
    error_id: ERR_ZONE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /trip-requests, POST /trip-requests/{id}/match, POST /pool-assignments, POST /vehicle-blocks/{id}/open"

  - priority: 15
    category: state
    check: "ServiceZone.status IN {DRAFT, ACTIVE} for the zone the resource is created under"
    error_id: ERR_ZONE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /virtual-stops, POST /transit-connections, POST /vehicles, POST /drivers, POST /riders, POST /demand-forecasts, POST /vehicle-blocks, POST /virtual-stops/{id}/approve"

  - priority: 16
    category: business_constraint
    check: "expected_vehicle_block_version == VehicleBlock.version (POST /pool-assignments); expected_service_zone_version == ServiceZone.version (POST /demand-forecasts)"
    error_id: "ERR_STALE_VEHICLE_BLOCK_VERSION | ERR_STALE_SERVICE_ZONE_VERSION"
    http_status: 412
    applies_to: "POST /pool-assignments, POST /demand-forecasts"

  - priority: 20
    category: business_referential
    check: "cross-zone consistency — every referenced VirtualStop, TransitConnection, Rider, Vehicle, Driver and VehicleBlock has the same zone_id as the operation's zone; for POST /pool-assignments the TripRequest.zone_id must equal VehicleBlock.zone_id"
    error_id: ERR_ZONE_MISMATCH
    http_status: 409
    applies_to: "POST /virtual-stops, POST /transit-connections, POST /vehicle-blocks, POST /trip-requests, POST /pool-assignments"

  - priority: 22
    category: business_referential
    check: "segregation of duties — X-User-ID must differ from SubsidyReport.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /subsidy-reports/{id}/certify"

  - priority: 24
    category: business_referential
    check: "TripRequest.origin_stop_id and destination_stop_id both reference a VirtualStop with status == APPROVED"
    error_id: ERR_STOP_NOT_APPROVED
    http_status: 409
    applies_to: "POST /trip-requests"

  - priority: 26
    category: business_safety
    check: "walking-distance standard — VirtualStop.walk_shed_meters <= ServiceZone.max_walk_meters (inclusive)"
    error_id: ERR_WALK_DISTANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /virtual-stops/{id}/approve"

  - priority: 27
    category: business_safety
    check: "when the effective wav_required is true, both the origin and the destination VirtualStop must have accessibility == ACCESSIBLE_PATH"
    error_id: ERR_STOP_NOT_ACCESSIBLE
    http_status: 409
    applies_to: "POST /trip-requests"

  - priority: 28
    category: business_safety
    check: "wheelchair-accessible dispatch — when TripRequest.wav_required == true the target block's Vehicle.wav_positions >= 1 AND Driver.wav_certified == true"
    error_id: ERR_WAV_UNAVAILABLE
    http_status: 409
    applies_to: "POST /pool-assignments"

  - priority: 30
    category: business_safety
    check: "equivalent-service requirement — ServiceZone.equivalence_verdict == COMPLIANT for the report's zone"
    error_id: ERR_EQUIVALENCE_DEFICIENT
    http_status: 409
    applies_to: "POST /subsidy-reports/{id}/certify"

  - priority: 32
    category: business_temporal
    check: "vehicle occupation — HALF-OPEN interval arithmetic [start_utc, end_utc): reject when an existing VehicleBlock with the same vehicle_id and state IN {SCHEDULED, OPEN} satisfies existing.start_utc < new.end_utc AND new.start_utc < existing.end_utc. Exact adjacency (existing.end_utc == new.start_utc) is ALLOWED; no buffer is applied"
    error_id: ERR_VEHICLE_BLOCK_OVERLAP
    http_status: 409
    applies_to: "POST /vehicle-blocks"

  - priority: 34
    category: business_temporal
    check: "driver rest buffer — BUFFERED CLOSED interval arithmetic: reject when an existing VehicleBlock with the same driver_id and state IN {SCHEDULED, OPEN} satisfies existing.start_utc - DRIVER_REST_BUFFER_MINUTES(30) < new.end_utc AND new.start_utc - DRIVER_REST_BUFFER_MINUTES(30) < existing.end_utc. Exact adjacency is REJECTED; a gap of exactly 30 minutes is ALLOWED"
    error_id: ERR_DRIVER_REST_BUFFER
    http_status: 409
    applies_to: "POST /vehicle-blocks"

  - priority: 36
    category: business_temporal
    check: "the trip's requested_pickup_utc must fall in the target block's HALF-OPEN window: block.start_utc <= requested_pickup_utc < block.end_utc"
    error_id: ERR_PICKUP_OUTSIDE_BLOCK_WINDOW
    http_status: 422
    applies_to: "POST /pool-assignments"

  - priority: 38
    category: business_temporal
    check: "when connection_id is supplied, abs(requested_pickup_utc - TransitConnection.scheduled_departure_utc) <= guaranteed_transfer_buffer_minutes (inclusive)"
    error_id: ERR_TRANSFER_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /trip-requests"

  - priority: 40
    category: business_temporal
    check: "curb capacity — AGGREGATE 15-MINUTE BUCKET arithmetic on the origin VirtualStop: the count of PoolAssignments with state IN {OFFERED, ACCEPTED, ONBOARD} whose TripRequest.origin_stop_id equals this trip's origin_stop_id and whose TripRequest.promised_pickup_utc falls in the same floor(epoch_minutes/15) bucket as the new offer's promised_pickup_utc must be < ServiceZone.curb_capacity_per_bucket"
    error_id: ERR_CURB_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /pool-assignments"

  - priority: 42
    category: business_constraint
    check: "reporting period must not overlap the inclusive date range of another SubsidyReport for the same zone_id and the same variant whose state IN {DRAFT, SUBMITTED, CERTIFIED, AMENDED}"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /subsidy-reports"

  - priority: 44
    category: business_constraint
    check: "shared-ride detour tolerance — projected_detour_minutes <= detour_allowance_minutes (inclusive), per corridor_travel_geometry"
    error_id: ERR_DETOUR_TOLERANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /pool-assignments"

  - priority: 46
    category: business_constraint
    check: "no PoolAssignment on the block has state IN {OFFERED, ACCEPTED, ONBOARD} (close) / state == ONBOARD (cancel of an OPEN block)"
    error_id: ERR_BLOCK_HAS_ACTIVE_ASSIGNMENTS
    http_status: 409
    applies_to: "POST /vehicle-blocks/{id}/close, POST /vehicle-blocks/{id}/cancel"

  - priority: 48
    category: business_constraint
    check: "no TripRequest with status IN {RECEIVED, MATCHING, OFFERED, ASSIGNED, PICKED_UP} references the stop as origin_stop_id or destination_stop_id"
    error_id: ERR_STOP_IN_USE
    http_status: 409
    applies_to: "POST /virtual-stops/{id}/retire"

  - priority: 50
    category: business_constraint
    check: "TripRequest.fare_status == CHARGED"
    error_id: ERR_TRIP_NOT_CHARGED
    http_status: 409
    applies_to: "POST /trip-requests/{id}/refund"

  - priority: 52
    category: business_fiscal
    check: "seat capacity — VehicleBlock.seats_committed + TripRequest.party_size <= Vehicle.seat_capacity"
    error_id: ERR_SEAT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /pool-assignments"

  - priority: 54
    category: business_fiscal
    check: "securement-position capacity — when TripRequest.wav_required == true, Vehicle.wav_positions - VehicleBlock.wav_positions_committed >= 1"
    error_id: ERR_WAV_POSITION_UNAVAILABLE
    http_status: 409
    applies_to: "POST /pool-assignments"

  - priority: 56
    category: business_fiscal
    check: "peak-surge fleet sizing — let F be the DemandForecast with state == PUBLISHED for this zone whose window half-open-overlaps the block's [start_utc, end_utc); when no such F exists the check is skipped. Otherwise, after this open, the count of blocks with state == OPEN, the same block_type and a window half-open-overlapping F's window must be <= F.required_base_blocks (block_type BASE) or <= F.required_surge_blocks (block_type SURGE)"
    error_id: ERR_FLEET_SIZE_EXCEEDED
    http_status: 409
    applies_to: "POST /vehicle-blocks/{id}/open"

  - priority: 58
    category: business_fiscal
    check: "every VehicleBlock of the report's zone whose start_utc UTC date falls in [period_start_date, period_end_date] has state IN {CLOSED, CANCELLED}"
    error_id: ERR_BLOCKS_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /subsidy-reports/{id}/certify"

# =============================================================================
# §1.5 API Endpoint Table
#   api_prefix is "" — every collection is a top-level path.
#   READ role set (all six roles) is used on every GET.
# =============================================================================
endpoints:
  # --- ServiceZone -----------------------------------------------------------
  - method: POST
    path: "/service-zones"
    description: "Define a microtransit service zone with its walking-distance standard, detour tolerance, fare policy and curb capacity. Created in DRAFT."
    roles: [ZoneAdmin]
    code: 201
    input: [name, zone_code, max_walk_meters, detour_tolerance_pct, detour_tolerance_floor_minutes, base_fare_cents, fare_cap_cents_daily, fare_cap_cents_weekly, on_time_window_minutes, curb_capacity_per_bucket]
    output: ServiceZone
    side_effects: ["status set to DRAFT", "version set to 1", "all computed performance fields initialised (completed_trip_count 0, unserved_trip_count 0, avg_wait_minutes 0.00, avg_ride_minutes 0.00, boardings_per_revenue_hour 0.00, wav_avg_wait_minutes 0.00, nonwav_avg_wait_minutes 0.00, wav_equivalence_ratio 0.000, equivalence_verdict COMPLIANT)"]

  - method: POST
    path: "/service-zones/{id}/activate"
    description: "Open the zone for trip intake and dispatch (DRAFT -> ACTIVE or SUSPENDED -> ACTIVE)."
    roles: [ZoneAdmin]
    code: 200
    input: []
    output: ServiceZone
    side_effects: ["status set to ACTIVE", "increments ServiceZone.version by 1"]

  - method: POST
    path: "/service-zones/{id}/suspend"
    description: "Suspend the zone (ACTIVE -> SUSPENDED). Blocks new intake and new dispatch; in-flight trips are untouched."
    roles: [ZoneAdmin]
    code: 200
    input: ["note?"]
    output: ServiceZone
    side_effects: ["status set to SUSPENDED", "increments ServiceZone.version by 1"]

  - method: GET
    path: "/service-zones/{id}"
    description: "Read one service zone including all recomputed performance metrics and the wheelchair-accessible equivalence verdict."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: ServiceZone
    side_effects: []

  - method: GET
    path: "/service-zones"
    description: "List service zones ordered by created_at ASC."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceZone[]
    side_effects: []

  # --- VirtualStop -----------------------------------------------------------
  - method: POST
    path: "/virtual-stops"
    description: "Place a virtual stop on the zone corridor with its advertised walk shed, curb accessibility and optional opposite-direction pair. Created in PROPOSED."
    roles: [ZoneAdmin]
    code: 201
    input: [zone_id, stop_code, corridor_index, walk_shed_meters, accessibility, "paired_stop_id?"]
    output: VirtualStop
    side_effects: ["status set to PROPOSED", "version set to 1"]

  - method: POST
    path: "/virtual-stops/{id}/approve"
    description: "Approve a proposed virtual stop for revenue use; enforces the zone's walking-distance standard (PROPOSED -> APPROVED)."
    roles: [ZoneAdmin]
    code: 200
    input: []
    output: VirtualStop
    side_effects: ["status set to APPROVED", "increments VirtualStop.version by 1"]

  - method: POST
    path: "/virtual-stops/{id}/retire"
    description: "Retire a virtual stop so no new trip may reference it (PROPOSED -> RETIRED or APPROVED -> RETIRED)."
    roles: [ZoneAdmin]
    code: 200
    input: []
    output: VirtualStop
    side_effects: ["status set to RETIRED", "increments VirtualStop.version by 1"]

  - method: GET
    path: "/virtual-stops/{id}"
    description: "Read one virtual stop."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: VirtualStop
    side_effects: []

  - method: GET
    path: "/virtual-stops"
    description: "List virtual stops ordered by created_at ASC. Filter by zone_id for zone reverse-reachability or by paired_stop_id for the self-referential pairing."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["zone_id?", "paired_stop_id?", "status?", "accessibility?", "limit?", "offset?"]
    output: VirtualStop[]
    side_effects: []

  # --- TransitConnection -----------------------------------------------------
  - method: POST
    path: "/transit-connections"
    description: "Register a fixed-route rail or bus departure that first/last-mile microtransit trips are timed to, with its guaranteed transfer buffer and transfer credit."
    roles: [ZoneAdmin]
    code: 201
    input: [zone_id, stop_id, mode, route_code, scheduled_departure_utc, guaranteed_transfer_buffer_minutes, transfer_credit_cents]
    output: TransitConnection
    side_effects: ["version set to 1"]

  - method: GET
    path: "/transit-connections/{id}"
    description: "Read one fixed-route transit connection."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: TransitConnection
    side_effects: []

  - method: GET
    path: "/transit-connections"
    description: "List transit connections ordered by created_at ASC. Filter by zone_id or by stop_id."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["zone_id?", "stop_id?", "mode?", "limit?", "offset?"]
    output: TransitConnection[]
    side_effects: []

  # --- Vehicle ---------------------------------------------------------------
  - method: POST
    path: "/vehicles"
    description: "Add a vehicle to the zone fleet with its ambulatory seat capacity and wheelchair securement positions. Created AVAILABLE."
    roles: [ZoneAdmin]
    code: 201
    input: [zone_id, vehicle_code, seat_capacity, wav_positions]
    output: Vehicle
    side_effects: ["status set to AVAILABLE", "is_wav computed as (wav_positions >= 1)", "version set to 1"]

  - method: POST
    path: "/vehicles/{id}/status"
    description: "Move a vehicle between AVAILABLE, IN_MAINTENANCE and RETIRED per the declared transitions. RETIRED is terminal."
    roles: [ZoneAdmin, Dispatcher]
    code: 200
    input: [status]
    output: Vehicle
    side_effects: ["status set to the requested value", "increments Vehicle.version by 1"]

  - method: GET
    path: "/vehicles/{id}"
    description: "Read one vehicle."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List vehicles ordered by created_at ASC. Filter by zone_id."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["zone_id?", "status?", "is_wav?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # --- Driver ----------------------------------------------------------------
  - method: POST
    path: "/drivers"
    description: "Roster a driver in the zone, recording whether they hold current wheelchair securement certification. Created AVAILABLE."
    roles: [ZoneAdmin]
    code: 201
    input: [zone_id, driver_code, wav_certified]
    output: Driver
    side_effects: ["status set to ACTIVE", "consecutive_decline_count set to 0", "version set to 1"]

  - method: POST
    path: "/drivers/{id}/status"
    description: "Move a driver between ACTIVE and SUSPENDED per the declared transitions. Suspending cascades a cancel to every SCHEDULED block of that driver; restoring to ACTIVE clears the decline counter."
    roles: [ZoneAdmin, Dispatcher]
    code: 200
    input: [status]
    output: Driver
    side_effects: ["status set to the requested value", "on SUSPENDED: every VehicleBlock of this driver with state == SCHEDULED transitions to CANCELLED, processed in start_utc ASC then created_at ASC order", "on ACTIVE: consecutive_decline_count reset to 0", "increments Driver.version by 1"]

  - method: GET
    path: "/drivers/{id}"
    description: "Read one driver including the running consecutive_decline_count."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: Driver
    side_effects: []

  - method: GET
    path: "/drivers"
    description: "List drivers ordered by created_at ASC. Filter by zone_id."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["zone_id?", "status?", "wav_certified?", "limit?", "offset?"]
    output: Driver[]
    side_effects: []

  # --- Rider -----------------------------------------------------------------
  - method: POST
    path: "/riders"
    description: "Register a rider account with fare category and declared mobility device. The returned id is the X-User-ID used for the Rider role."
    roles: [ZoneAdmin]
    code: 201
    input: [zone_id, rider_code, fare_category, mobility_device]
    output: Rider
    side_effects: ["fare_counter_date set to null", "fare_counter_week_start set to null", "daily_fare_paid_cents set to 0", "weekly_fare_paid_cents set to 0", "version set to 1"]

  - method: GET
    path: "/riders/{id}"
    description: "Read one rider including the live daily and weekly fare-cap counters."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: Rider
    side_effects: []

  - method: GET
    path: "/riders"
    description: "List riders ordered by created_at ASC. Filter by zone_id."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["zone_id?", "fare_category?", "mobility_device?", "limit?", "offset?"]
    output: Rider[]
    side_effects: []

  # --- DemandForecast --------------------------------------------------------
  - method: POST
    path: "/demand-forecasts"
    description: "Publish a demand forecast for a service window; the fleet_sizing rule derives required_base_blocks and required_surge_blocks. Optimistic concurrency is enforced on the parent ServiceZone via expected_service_zone_version, because a forecast supersedes any earlier PUBLISHED forecast whose window overlaps and therefore changes the zone's dispatch envelope."
    roles: [ZoneAdmin]
    code: 201
    input: [zone_id, window_start_utc, window_end_utc, forecast_trips, peak_factor, expected_service_zone_version]
    output: DemandForecast
    side_effects: ["state set to PUBLISHED", "required_base_blocks and required_surge_blocks computed via fleet_sizing", "every PUBLISHED DemandForecast for the same zone whose window half-open-overlaps this window transitions to SUPERSEDED", "increments ServiceZone.version by 1", "version set to 1"]

  - method: GET
    path: "/demand-forecasts/{id}"
    description: "Read one demand forecast including the derived peak-surge fleet sizing."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: DemandForecast
    side_effects: []

  - method: GET
    path: "/demand-forecasts"
    description: "List demand forecasts ordered by created_at ASC. Filter by zone_id."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["zone_id?", "state?", "limit?", "offset?"]
    output: DemandForecast[]
    side_effects: []

  # --- VehicleBlock ----------------------------------------------------------
  - method: POST
    path: "/vehicle-blocks"
    description: "Schedule a driver-and-vehicle block over a half-open service window. Enforces vehicle occupation (adjacency allowed) and the driver rest buffer (adjacency rejected). Created SCHEDULED."
    roles: [ZoneAdmin, Dispatcher]
    code: 201
    input: [zone_id, vehicle_id, driver_id, block_type, start_utc, end_utc]
    output: VehicleBlock
    side_effects: ["state set to SCHEDULED", "seats_committed, wav_positions_committed, boardings_count set to 0", "committed_index_min and committed_index_max set to null", "scheduled_revenue_hours computed from the window", "actual_revenue_hours set to 0.00", "opened_at and closed_at set to null", "version set to 1"]

  - method: POST
    path: "/vehicle-blocks/{id}/open"
    description: "Pull the block out for service (SCHEDULED -> OPEN). Enforces the peak-surge fleet-sizing ceiling from the overlapping PUBLISHED DemandForecast."
    roles: [Dispatcher]
    code: 200
    input: []
    output: VehicleBlock
    side_effects: ["state set to OPEN", "opened_at set to the logical clock", "increments VehicleBlock.version by 1"]

  - method: POST
    path: "/vehicle-blocks/{id}/close"
    description: "End the block's service (OPEN -> CLOSED). Rejected while any assignment is still non-terminal."
    roles: [Dispatcher]
    code: 200
    input: []
    output: VehicleBlock
    side_effects: ["state set to CLOSED", "closed_at set to the logical clock", "actual_revenue_hours recomputed from opened_at and closed_at", "the zone's boardings_per_revenue_hour recomputed", "increments VehicleBlock.version by 1"]

  - method: POST
    path: "/vehicle-blocks/{id}/cancel"
    description: "Cancel the block (SCHEDULED -> CANCELLED or OPEN -> CANCELLED) and cascade: every non-terminal PoolAssignment on it is RELEASED, each released trip is re-opened for matching or exhausted into NO_SERVICE, and any exhausted trip's fare axis is voided."
    roles: [Dispatcher]
    code: 200
    input: ["note?"]
    output: VehicleBlock
    side_effects: ["state set to CANCELLED", "every PoolAssignment on the block with state IN {OFFERED, ACCEPTED} transitions to RELEASED", "each released assignment's TripRequest returns to MATCHING when match_attempt_count < MAX_MATCH_ATTEMPTS (2), otherwise moves to NO_SERVICE with no_service_reason MAX_ATTEMPTS_EXHAUSTED", "each TripRequest moved to NO_SERVICE has fare_status set to UNPRICED, quoted_fare_cents set to null and assigned_block_id cleared", "the zone's unserved_trip_count recomputed", "seats_committed and wav_positions_committed recomputed to 0", "increments VehicleBlock.version by 1"]

  - method: GET
    path: "/vehicle-blocks/{id}"
    description: "Read one vehicle block including committed seats, securement positions, corridor envelope and revenue hours."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: VehicleBlock
    side_effects: []

  - method: GET
    path: "/vehicle-blocks"
    description: "List vehicle blocks ordered by created_at ASC. Filter by zone_id, vehicle_id or driver_id."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["zone_id?", "vehicle_id?", "driver_id?", "state?", "block_type?", "limit?", "offset?"]
    output: VehicleBlock[]
    side_effects: []

  # --- TripRequest -----------------------------------------------------------
  - method: POST
    path: "/trip-requests"
    description: "Intake an on-demand trip request between two approved virtual stops, optionally timed to a fixed-route connection. Created RECEIVED with fare_status UNPRICED. Riders may only book for themselves."
    roles: [Rider, Dispatcher]
    code: 201
    input: [zone_id, rider_id, origin_stop_id, destination_stop_id, requested_pickup_utc, "party_size?", "wav_required?", "connection_id?"]
    output: TripRequest
    side_effects: ["status set to RECEIVED", "fare_status set to UNPRICED", "party_size defaults to 1 when omitted", "wav_required computed as (body wav_required == true OR Rider.mobility_device == WHEELCHAIR)", "baseline_direct_minutes computed via corridor_travel_geometry", "match_attempt_count set to 0", "assigned_block_id, promised_pickup_utc, promised_dropoff_utc, quoted_fare_cents, charged_fare_cents, applied_cap, no_service_reason set to null", "version set to 1"]

  - method: POST
    path: "/trip-requests/{id}/match"
    description: "Run real-time matching for the trip (RECEIVED -> MATCHING, then MATCHING -> OFFERED when a block wins). Selects the winning open block via pool_match_selection and creates the PoolAssignment offer; when no block is eligible the trip stays in MATCHING, or moves to NO_SERVICE once the attempt budget is exhausted."
    roles: [Dispatcher]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["status set to MATCHING while candidates are scored", "on a win: a PoolAssignment is created in OFFERED with offer_origin AUTO_MATCH and match_score set, status set to OFFERED, assigned_block_id set to the winning block, match_attempt_count incremented by 1, promised_pickup_utc and promised_dropoff_utc set, projected_detour_minutes set, fare_status set to QUOTED and quoted_fare_cents computed via trip_fare variant PROVISIONAL_QUOTE", "on a win: the winning block's seats_committed, wav_positions_committed, committed_index_min, committed_index_max recomputed and VehicleBlock.version incremented by 1", "on no eligible candidate with match_attempt_count < MAX_MATCH_ATTEMPTS: status stays MATCHING", "on no eligible candidate with match_attempt_count >= MAX_MATCH_ATTEMPTS (2): status set to NO_SERVICE with no_service_reason NO_ELIGIBLE_BLOCK and the zone's unserved_trip_count recomputed", "increments TripRequest.version by 1"]

  - method: POST
    path: "/trip-requests/{id}/cancel"
    description: "Rider or dispatcher cancellation of a trip that has not yet been picked up. Releases any non-terminal offer and voids the fare axis."
    roles: [Rider, Dispatcher]
    code: 200
    input: ["note?"]
    output: TripRequest
    side_effects: ["status set to CANCELLED", "any PoolAssignment for this trip with state IN {OFFERED, ACCEPTED} transitions to RELEASED", "the released assignment's block recomputes seats_committed, wav_positions_committed, committed_index_min, committed_index_max and increments its version by 1", "fare_status set to UNPRICED and quoted_fare_cents set to null", "assigned_block_id, promised_pickup_utc and promised_dropoff_utc cleared", "increments TripRequest.version by 1"]

  - method: POST
    path: "/trip-requests/{id}/refund"
    description: "Reverse a settled fare (fare_status CHARGED -> REFUNDED), appending the compensating ledger rows that return the rider's cap counters to their pre-charge values."
    roles: [Dispatcher]
    code: 200
    input: [reason]
    output: TripRequest
    side_effects: ["fare_status set to REFUNDED", "charged_fare_cents set to 0", "a FareTransaction of kind REFUND is appended whose amount_cents is the negative of the net cents previously settled for this trip", "the Rider's daily_fare_paid_cents and weekly_fare_paid_cents recomputed", "the zone's performance metrics left unchanged", "increments TripRequest.version by 1"]

  - method: GET
    path: "/trip-requests/{id}"
    description: "Read one trip request including both state axes, the promised and actual timestamps, wait/ride minutes and the fare fields."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: TripRequest
    side_effects: []

  - method: GET
    path: "/trip-requests"
    description: "List trip requests ordered by created_at ASC. Filter by zone_id, rider_id, origin_stop_id, destination_stop_id, connection_id or assigned_block_id."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["zone_id?", "rider_id?", "origin_stop_id?", "destination_stop_id?", "connection_id?", "assigned_block_id?", "status?", "fare_status?", "wav_required?", "limit?", "offset?"]
    output: TripRequest[]
    side_effects: []

  # --- PoolAssignment --------------------------------------------------------
  - method: POST
    path: "/pool-assignments"
    description: "Manually dispatch a trip onto a specific open block, bypassing automatic matching. Optimistic concurrency is enforced on the parent VehicleBlock via expected_vehicle_block_version, because the offer consumes that block's seats and securement positions. Created OFFERED with offer_origin MANUAL_DISPATCH."
    roles: [Dispatcher]
    code: 201
    input: [trip_request_id, block_id, expected_vehicle_block_version]
    output: PoolAssignment
    side_effects: ["state set to OFFERED", "offer_origin set to MANUAL_DISPATCH and match_score set to null", "seats_held copied from TripRequest.party_size and wav_positions_held set to 1 when the trip requires a securement position, else 0", "baseline_direct_minutes and projected_detour_minutes evaluated via corridor_travel_geometry", "seq_pickup assigned along the corridor", "the TripRequest moves to OFFERED with assigned_block_id set, match_attempt_count incremented by 1, promised_pickup_utc and promised_dropoff_utc set, fare_status set to QUOTED and quoted_fare_cents computed via trip_fare variant PROVISIONAL_QUOTE", "the block recomputes seats_committed, wav_positions_committed, committed_index_min, committed_index_max", "increments VehicleBlock.version by 1", "version set to 1"]

  - method: POST
    path: "/pool-assignments/{id}/accept"
    description: "Driver accepts the offer (OFFERED -> ACCEPTED). Clears the driver's decline streak."
    roles: [DriverUser]
    code: 200
    input: []
    output: PoolAssignment
    side_effects: ["state set to ACCEPTED", "the TripRequest moves to ASSIGNED", "the block's Driver consecutive_decline_count reset to 0", "increments PoolAssignment.version by 1"]

  - method: POST
    path: "/pool-assignments/{id}/decline"
    description: "Driver refuses the offer (OFFERED -> DECLINED) and cascades: the trip returns to matching or is exhausted, the block's committed capacity is given back, and a driver who declines DECLINE_SUSPENSION_THRESHOLD (3) offers in a row is suspended, which in turn cancels that driver's SCHEDULED blocks."
    roles: [DriverUser]
    code: 200
    input: ["reason?"]
    output: PoolAssignment
    side_effects: ["state set to DECLINED", "the block recomputes seats_committed, wav_positions_committed, committed_index_min, committed_index_max and increments its version by 1", "the TripRequest returns to MATCHING with assigned_block_id, promised_pickup_utc, promised_dropoff_utc, projected_detour_minutes and quoted_fare_cents cleared and fare_status set to UNPRICED when match_attempt_count < MAX_MATCH_ATTEMPTS (2), otherwise moves to NO_SERVICE with no_service_reason MAX_ATTEMPTS_EXHAUSTED", "the block's Driver consecutive_decline_count incremented by 1", "when the Driver's consecutive_decline_count reaches DECLINE_SUSPENSION_THRESHOLD (3) the Driver status is set to SUSPENDED and every VehicleBlock of that driver with state == SCHEDULED transitions to CANCELLED (which itself cascades per POST /vehicle-blocks/{id}/cancel)", "increments PoolAssignment.version by 1"]

  - method: POST
    path: "/pool-assignments/{id}/board"
    description: "Driver boards the rider (ACCEPTED -> ONBOARD). Stamps the actual pickup and derives the wait metric."
    roles: [DriverUser]
    code: 200
    input: []
    output: PoolAssignment
    side_effects: ["state set to ONBOARD", "the TripRequest moves to PICKED_UP with actual_pickup_utc set to the logical clock and wait_minutes computed", "increments PoolAssignment.version by 1"]

  - method: POST
    path: "/pool-assignments/{id}/complete"
    description: "Driver alights the rider (ONBOARD -> COMPLETED) and cascades: the trip completes, the fare settles under the SETTLED_CHARGE variant with transfer credit and fare capping applied, the ledger rows are appended, the rider's cap counters move and the zone's performance metrics are recomputed."
    roles: [DriverUser]
    code: 200
    input: []
    output: PoolAssignment
    side_effects: ["state set to COMPLETED", "the TripRequest moves to COMPLETED with actual_dropoff_utc set to the logical clock and ride_minutes computed", "the TripRequest fare_status set to CHARGED with charged_fare_cents and applied_cap computed via trip_fare variant SETTLED_CHARGE", "FareTransaction rows appended for the CHARGE and, when applicable, TRANSFER_CREDIT and CAP_REBATE", "the Rider's fare_counter_date, fare_counter_week_start, daily_fare_paid_cents and weekly_fare_paid_cents updated", "the block's seats_committed and wav_positions_committed recomputed and boardings_count increased by seats_held", "the zone's completed_trip_count, avg_wait_minutes, avg_ride_minutes, boardings_per_revenue_hour, wav_avg_wait_minutes, nonwav_avg_wait_minutes, wav_equivalence_ratio and equivalence_verdict recomputed", "increments PoolAssignment.version by 1"]

  - method: GET
    path: "/pool-assignments/{id}"
    description: "Read one pool assignment including seats held, securement positions held, pickup sequence, detour minutes and match score."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: PoolAssignment
    side_effects: []

  - method: GET
    path: "/pool-assignments"
    description: "List pool assignments ordered by created_at ASC. Filter by block_id or trip_request_id."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["block_id?", "trip_request_id?", "state?", "offer_origin?", "limit?", "offset?"]
    output: PoolAssignment[]
    side_effects: []

  # --- FareTransaction (append-only ledger; no create endpoint) ---------------
  - method: GET
    path: "/fare-transactions/{id}"
    description: "Read one immutable fare-ledger row."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: FareTransaction
    side_effects: []

  - method: GET
    path: "/fare-transactions"
    description: "List fare-ledger rows ordered by created_at ASC. Filter by trip_request_id or rider_id. This is the only discovery channel for ledger rows, which are appended as side effects of completion, refund and cap rebate."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["trip_request_id?", "rider_id?", "kind?", "service_date?", "limit?", "offset?"]
    output: FareTransaction[]
    side_effects: []

  # --- SubsidyReport ---------------------------------------------------------
  - method: POST
    path: "/subsidy-reports"
    description: "Open a subsidy-per-trip report for a reporting period under either the PROVISIONAL or FINAL variant. Created DRAFT with all totals computed from the period's blocks and trips."
    roles: [FinanceAnalyst]
    code: 201
    input: [zone_id, period_start_date, period_end_date, variant]
    output: SubsidyReport
    side_effects: ["state set to DRAFT", "amendment_count set to 0", "submitted_by_user_id, certified_by_user_id and rejection_reason set to null", "total_trips, total_fare_revenue_cents, total_operating_cost_cents and subsidy_per_trip_cents computed via subsidy_per_trip under the declared variant", "version set to 1"]

  - method: POST
    path: "/subsidy-reports/{id}/submit"
    description: "File the report with the funding agency (DRAFT -> SUBMITTED, REJECTED -> SUBMITTED or AMENDED -> SUBMITTED). Recomputes every total at submission time."
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: SubsidyReport
    side_effects: ["state set to SUBMITTED", "submitted_by_user_id set to the calling X-User-ID", "rejection_reason cleared to null", "total_trips, total_fare_revenue_cents, total_operating_cost_cents and subsidy_per_trip_cents recomputed", "increments SubsidyReport.version by 1"]

  - method: POST
    path: "/subsidy-reports/{id}/certify"
    description: "Funding agency certifies the filed report (SUBMITTED -> CERTIFIED). Requires the zone's wheelchair-accessible equivalence verdict to be COMPLIANT, every block in the period finalised, and a certifier different from the submitter."
    roles: [FundingAgencyAuditor]
    code: 200
    input: ["note?"]
    output: SubsidyReport
    side_effects: ["state set to CERTIFIED", "certified_by_user_id set to the calling X-User-ID", "increments SubsidyReport.version by 1"]

  - method: POST
    path: "/subsidy-reports/{id}/reject"
    description: "Funding agency rejects the filed report (SUBMITTED -> REJECTED), returning it to the analyst for correction and refiling."
    roles: [FundingAgencyAuditor]
    code: 200
    input: [rejection_reason]
    output: SubsidyReport
    side_effects: ["state set to REJECTED", "rejection_reason recorded", "submitted_by_user_id cleared to null", "increments SubsidyReport.version by 1"]

  - method: POST
    path: "/subsidy-reports/{id}/amend"
    description: "Reopen a certified report for amendment (CERTIFIED -> AMENDED), clearing the certification so the report must be refiled and recertified."
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: SubsidyReport
    side_effects: ["state set to AMENDED", "amendment_count incremented by 1", "certified_by_user_id cleared to null", "submitted_by_user_id cleared to null", "increments SubsidyReport.version by 1"]

  - method: GET
    path: "/subsidy-reports/{id}"
    description: "Read one subsidy report including all four derived totals and the workflow attribution fields."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: []
    output: SubsidyReport
    side_effects: []

  - method: GET
    path: "/subsidy-reports"
    description: "List subsidy reports ordered by created_at ASC. Filter by zone_id."
    roles: [ZoneAdmin, Dispatcher, FinanceAnalyst, FundingAgencyAuditor, Rider, DriverUser]
    code: 200
    input: ["zone_id?", "state?", "variant?", "limit?", "offset?"]
    output: SubsidyReport[]
    side_effects: []

  # --- Test-driving endpoint (logical clock) ---------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary instant so that block windows, transfer buffers, curb buckets, service dates and fare-cap periods are deterministic. The logical clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the clock reads that default and never falls back to real wall-clock time."
    roles: [ZoneAdmin, Dispatcher]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["the logical clock used by every timestamp-stamping side effect and every temporal validation is set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / identity ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_IDENTITY_NOT_FOUND
    http: 403
    condition: "X-User-ID does not resolve to a Rider row (Rider role) or a Driver row (DriverUser role)"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Rider acts on a trip that is not theirs, or a DriverUser acts on an assignment whose block belongs to another driver"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the certifying X-User-ID equals the report's submitted_by_user_id"

  # --- existence ---
  - id: ERR_SERVICE_ZONE_NOT_FOUND
    http: 404
    condition: "referenced ServiceZone does not exist"
  - id: ERR_VIRTUAL_STOP_NOT_FOUND
    http: 404
    condition: "referenced VirtualStop does not exist"
  - id: ERR_TRANSIT_CONNECTION_NOT_FOUND
    http: 404
    condition: "referenced TransitConnection does not exist"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "referenced Vehicle does not exist"
  - id: ERR_DRIVER_NOT_FOUND
    http: 404
    condition: "referenced Driver does not exist"
  - id: ERR_RIDER_NOT_FOUND
    http: 404
    condition: "referenced Rider does not exist"
  - id: ERR_DEMAND_FORECAST_NOT_FOUND
    http: 404
    condition: "referenced DemandForecast does not exist"
  - id: ERR_VEHICLE_BLOCK_NOT_FOUND
    http: 404
    condition: "referenced VehicleBlock does not exist"
  - id: ERR_TRIP_REQUEST_NOT_FOUND
    http: 404
    condition: "referenced TripRequest does not exist"
  - id: ERR_POOL_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "referenced PoolAssignment does not exist"
  - id: ERR_FARE_TRANSACTION_NOT_FOUND
    http: 404
    condition: "referenced FareTransaction does not exist"
  - id: ERR_SUBSIDY_REPORT_NOT_FOUND
    http: 404
    condition: "referenced SubsidyReport does not exist"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, undeclared enum member, out-of-range numeric value, or destination_stop_id equal to origin_stop_id"
  - id: ERR_DUPLICATE_ZONE_CODE
    http: 409
    condition: "zone_code already used by another ServiceZone"
  - id: ERR_PAIRED_STOP_INVALID
    http: 422
    condition: "paired_stop_id refers to a stop in another zone, a RETIRED stop, or the stop itself"
  - id: ERR_REPORT_PERIOD_INVALID
    http: 422
    condition: "period_end_date earlier than period_start_date"

  # --- state ---
  - id: ERR_INVALID_ZONE_STATE
    http: 409
    condition: "the requested zone transition is not declared from the zone's current status"
  - id: ERR_INVALID_STOP_STATE
    http: 409
    condition: "the requested stop transition is not declared from the stop's current status"
  - id: ERR_INVALID_VEHICLE_STATE
    http: 409
    condition: "the requested vehicle transition is not declared from the vehicle's current status"
  - id: ERR_INVALID_DRIVER_STATE
    http: 409
    condition: "the requested driver transition is not declared from the driver's current status"
  - id: ERR_INVALID_BLOCK_STATE
    http: 409
    condition: "the requested block transition is not declared from the block's current state, or an offer targets a block that is not OPEN"
  - id: ERR_INVALID_TRIP_STATE
    http: 409
    condition: "the requested trip transition is not declared from the trip's current status, or an offer targets a trip that is not in RECEIVED or MATCHING"
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "the requested assignment transition is not declared from the assignment's current state"
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "the requested report transition is not declared from the report's current state"
  - id: ERR_ZONE_NOT_ACTIVE
    http: 409
    condition: "the operation requires ServiceZone.status == ACTIVE (intake, matching, dispatch, block open) or IN {DRAFT, ACTIVE} (configuration writes) and the zone is not in that status"

  # --- optimistic concurrency ---
  - id: ERR_STALE_VEHICLE_BLOCK_VERSION
    http: 412
    condition: "expected_vehicle_block_version does not match the VehicleBlock's current version"
  - id: ERR_STALE_SERVICE_ZONE_VERSION
    http: 412
    condition: "expected_service_zone_version does not match the ServiceZone's current version"

  # --- referential / business ---
  - id: ERR_ZONE_MISMATCH
    http: 409
    condition: "a referenced stop, connection, rider, vehicle, driver, block or trip belongs to a different service zone than the operation's zone"
  - id: ERR_STOP_NOT_APPROVED
    http: 409
    condition: "a trip's origin or destination virtual stop is not APPROVED"
  - id: ERR_STOP_IN_USE
    http: 409
    condition: "retiring a stop that a non-terminal trip still references as origin or destination"
  - id: ERR_WALK_DISTANCE_EXCEEDED
    http: 422
    condition: "approving a stop whose walk_shed_meters exceeds the zone's max_walk_meters"
  - id: ERR_STOP_NOT_ACCESSIBLE
    http: 409
    condition: "a wheelchair-accessible trip names an origin or destination stop whose accessibility is not ACCESSIBLE_PATH"
  - id: ERR_WAV_UNAVAILABLE
    http: 409
    condition: "a wheelchair-accessible trip is offered onto a block whose vehicle has no securement position or whose driver is not wav_certified"
  - id: ERR_WAV_POSITION_UNAVAILABLE
    http: 409
    condition: "a wheelchair-accessible trip is offered onto a block whose remaining securement positions are exhausted"
  - id: ERR_EQUIVALENCE_DEFICIENT
    http: 409
    condition: "certifying a report whose zone equivalence_verdict is not COMPLIANT"
  - id: ERR_SEAT_CAPACITY_EXCEEDED
    http: 409
    condition: "the offer's party_size would push the block's seats_committed above the vehicle's seat_capacity"
  - id: ERR_DETOUR_TOLERANCE_EXCEEDED
    http: 409
    condition: "the offer's projected_detour_minutes exceeds the trip's detour allowance"
  - id: ERR_CURB_CAPACITY_EXCEEDED
    http: 409
    condition: "the offer's promised pickup fills a 15-minute curb bucket at the origin stop beyond the zone's curb_capacity_per_bucket"
  - id: ERR_VEHICLE_BLOCK_OVERLAP
    http: 409
    condition: "the new block's window overlaps another live block for the same vehicle"
  - id: ERR_DRIVER_REST_BUFFER
    http: 409
    condition: "the new block leaves less than 30 minutes of rest between it and another live block for the same driver"
  - id: ERR_PICKUP_OUTSIDE_BLOCK_WINDOW
    http: 422
    condition: "the trip's requested_pickup_utc falls outside the target block's half-open service window"
  - id: ERR_TRANSFER_WINDOW_MISSED
    http: 422
    condition: "the requested pickup lies further from the fixed-route scheduled departure than the connection's guaranteed transfer buffer"
  - id: ERR_FLEET_SIZE_EXCEEDED
    http: 409
    condition: "opening the block would put more blocks of its type in service than the overlapping published forecast's peak-surge fleet sizing allows"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "another live report of the same variant already covers an overlapping period for the zone"
  - id: ERR_BLOCKS_NOT_FINALIZED
    http: 409
    condition: "certifying a report while a block in the reporting period is still SCHEDULED or OPEN"
  - id: ERR_BLOCK_HAS_ACTIVE_ASSIGNMENTS
    http: 409
    condition: "closing a block with a non-terminal assignment, or cancelling a block with a rider already onboard"
  - id: ERR_TRIP_NOT_CHARGED
    http: 409
    condition: "refunding a trip whose fare_status is not CHARGED"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ZoneAdmin
    description: "Service planner who defines zones, places and approves virtual stops, registers fixed-route connections, onboards fleet, drivers and rider accounts, and publishes demand forecasts."
    identity: "opaque"
    exclusive_operations: ["create service zone", "activate service zone", "suspend service zone", "create virtual stop", "approve virtual stop", "retire virtual stop", "create transit connection", "create vehicle", "create driver", "create rider", "publish demand forecast"]
    shared_operations: ["set vehicle status", "set driver status", "create vehicle block", "set logical clock", "read every collection"]

  - name: Dispatcher
    description: "Operations controller who schedules and runs blocks, drives real-time matching, manually dispatches offers, cancels trips or blocks and issues fare refunds."
    identity: "opaque"
    exclusive_operations: ["open vehicle block", "close vehicle block", "cancel vehicle block", "run trip matching", "create pool assignment", "refund trip fare"]
    shared_operations: ["set vehicle status", "set driver status", "create vehicle block", "create trip request", "cancel trip request", "set logical clock", "read every collection"]

  - name: Rider
    description: "Passenger acting on their own account; may request and cancel their own trips only."
    identity: "entity_backed:Rider"
    exclusive_operations: []
    shared_operations: ["create trip request (own rider_id only)", "cancel trip request (own trip only)", "read every collection (own trips, assignments and fare rows only)"]

  - name: DriverUser
    description: "Driver acting on their own roster; accepts, declines, boards and completes offers on blocks they are rostered on."
    identity: "entity_backed:Driver"
    exclusive_operations: ["accept pool assignment", "decline pool assignment", "board pool assignment", "complete pool assignment"]
    shared_operations: ["read every collection (own blocks and assignments only)"]

  - name: FinanceAnalyst
    description: "Operator finance staff who prepare, file and amend subsidy-per-trip reports to the funding agency. Never certifies — segregation of duties."
    identity: "opaque"
    exclusive_operations: ["create subsidy report", "submit subsidy report", "amend subsidy report"]
    shared_operations: ["read every collection"]

  - name: FundingAgencyAuditor
    description: "Funding agency reviewer who certifies or rejects filed subsidy reports. Never prepares or files them, and may not certify a report they submitted."
    identity: "opaque"
    exclusive_operations: ["certify subsidy report", "reject subsidy report"]
    shared_operations: ["read every collection"]
