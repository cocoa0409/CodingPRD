            - "${billing_after} == DAMAGE_BILLED, ${dmg_after} == 9000, ${proc_after} == 2500 and ${total_after} == 11500"
            - "IllRequest.${req_id}.status == CLOSED_WITH_DAMAGE and Patron.${patron_id}.damaged_count == 1"

      - name: needed_by_one_second_after_the_clock_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=62]
          - errors[ERR_NEEDED_BY_IN_PAST]
          - entities.IllRequest.fields.needed_by
        distinguishing_aspect: "The rule reads 'strictly after the logical clock', so needed_by equal to the clock instant is refused while needed_by one second later is admitted — the boundary is exclusive, and the admitted request still records days_available_at_source 0 once it is sourced."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Patron P-9032 with max_open_requests 5."
            - "Partner NORTHU on a single-entry LOAN rota quoting 2000 / 4."
            - "One BibItem with local_holding_status NONE and licensed_access_status NONE, so nothing above priority 62 fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9032", full_name: "Abe Reader", email: "abe@u.edu", patron_type: "STAFF", department: "ENGR", max_open_requests: 5 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Fluid Mechanics Casebook", item_type: "BOOK", publication_year: 2016, isbn: "978-0-000-00053-0", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_id: $.data.id }
          trigger:
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-01T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err_past: $.data.error_id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-01T00:00:01Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { ok_id: $.data.id, ok_status: $.data.status, ok_needed: $.data.needed_by }
            - call: "POST /ill/requests/${ok_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer_landed: $.data.landed_cost_cents }
          assert:
            - "${err_past} == ERR_NEEDED_BY_IN_PAST with HTTP 422 — needed_by equal to the clock is not strictly after it"
            - "${ok_status} == SOURCING and ${ok_needed} == 2026-08-01T00:00:01Z"
            - "IllRequest.${ok_id}.days_available_at_source == 0 — floor(1 second / 86400) is 0"
            - "${offer_landed} == 3000 — quoted 2000 plus DAY_PENALTY_CENTS 250 times a lateness of 4 days, since the turnaround of 4 days cannot fit in 0 available days"
            - "Patron.${patron_id}.open_request_count == 1"

      - name: role_check_outranks_path_existence_so_a_bad_role_on_a_bad_id_returns_forbidden
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=30]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_PATRON_NOT_FOUND]
        distinguishing_aspect: "Two rules are violated at once — the caller holds the wrong role and the patron id does not exist — and the ladder returns the priority-20 ERR_UNAUTHORIZED (403), not the priority-30 ERR_PATRON_NOT_FOUND (404), so no resource existence is leaked to an unauthorised caller."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "No patron with id 00000000-0000-4000-8000-0000000009f0 exists."
            - "POST /ill/patrons/{id}/infraction-records is exclusive to LibraryAdmin in §1.5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /ill/patrons/00000000-0000-4000-8000-0000000009f0/infraction-records"
              payload: { kind: "LOST", count: 1 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err_role: $.data.error_id }
            - call: "POST /ill/patrons/00000000-0000-4000-8000-0000000009f0/infraction-records"
              payload: { kind: "LOST", count: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { err_missing: $.data.error_id }
          assert:
            - "${err_role} == ERR_UNAUTHORIZED with HTTP 403"
            - "${err_missing} == ERR_PATRON_NOT_FOUND with HTTP 404 — with the role fixed, the very next rung of the ladder is reached"
            - "Both responses carry the standard error envelope with meta.api_request_id and data.message, and data contains no patron payload"

