              as: CustomerCare
              captures: { ol2: "$.data.id" }
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: CustomerCare
          assert:
            - "HTTP 201; OrderLine.${ol2}.quantity == 3, open_units == 3, line_status == OPEN"
            - "CustomerOrder.${o1}.total_units == 5, unassigned_units == 5, routing_status still UNROUTED"
            - "CustomerOrder.${o1}.version == 3 (creation plus two line bumps)"

      - name: body_shape_error_outranks_the_unresolved_path_id
        claim_type: priority_ordering
        grounds:
          - validations.priority_3
          - validations.priority_4
        distinguishing_aspect: "Priority 3 (request shape) is evaluated before priority 4 (path-id resolution): a line POST that carries quantity 0 AND an unknown order_id returns 400 ERR_INVALID_REQUEST, never 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock 09:00; SKU-A exists; no order carries the probed id."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-B201", customer_ref: "C-321", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
          trigger:
            - call: "POST /fulfillment-network/orders/00000000-0000-4000-8000-000000000011/lines"
              payload: { sku_id: "${sku_a}", quantity: 0, unit_price_cents: 4500 }
              as: CustomerCare
              captures: { err_first: "$.data.error_id" }
            - call: "POST /fulfillment-network/orders/00000000-0000-4000-8000-000000000011/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
              captures: { err_second: "$.data.error_id" }
          assert:
            - "${err_first} == ERR_INVALID_REQUEST with HTTP 400 (quantity >= 1 is a priority-3 range check)"
            - "${err_second} == ERR_ORDER_NOT_FOUND with HTTP 404, isolating the priority-4 check once the body is well formed"
            - "GET /order-lines returns 0 rows in both cases"

      - name: routing_a_lineless_order_returns_no_routable_lines_then_succeeds
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_13
          - errors.ERR_NO_ROUTABLE_LINES
        distinguishing_aspect: "The routability check reads a DIFFERENT entity: with zero OrderLine rows the run is refused with 409 ERR_NO_ROUTABLE_LINES, and the identical call succeeds once a line with open_units 2 exists, committing 2 units to S1."
        test_recipe:
          setup:
            - "Clock 09:00; node S1 with SKU-A 20 on hand / 2 safety; order O1 exists with NO lines at all."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
