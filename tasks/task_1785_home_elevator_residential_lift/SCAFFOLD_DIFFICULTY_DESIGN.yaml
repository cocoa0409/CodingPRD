            - { call: "POST /api/projects", payload: { property_id: "${prop}", survey_id: "${surv}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj: $.data.id, proj_v: $.data.version } }
            - { call: "PATCH /api/projects/${proj}", payload: { product_model_id: "${mdl}", lead_installer_technician_id: "${t_inst}", expected_project_version: "${proj_v}" }, as: ProjectCoordinator }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", ahj_name: "Springfield AHJ" }, as: ProjectCoordinator, captures: { perm: $.data.id } }
            - { call: "POST /api/permits/${perm}/approve", payload: {}, as: Regulator }
            - { call: "POST /api/projects/${proj}/schedule-installation", payload: { install_start_date: "2026-08-10T08:00:00Z", install_end_date: "2026-08-20T17:00:00Z" }, as: ProjectCoordinator }
