              as_user_id: "rcm-1"
              captures: { a1_v_now: $.data.version }
          trigger:
            - call: "POST /charity-care/applications/${a1}/decide"
              payload: { decision: "ACCEPT", decision_reason: "blocked while suspended", expected_application_version: "${a1_v_now}" }
              as: ReviewCommitteeMember
