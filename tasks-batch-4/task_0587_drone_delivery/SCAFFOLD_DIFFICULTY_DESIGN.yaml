  # ===================================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: flight_launch_gated_by_authorization_window
        grounds:
          - state_machines.Flight.PLANNED_to_LAUNCHED
          - state_machines.AirspaceAuthorization.PENDING_to_APPROVED
          - "validations[priority=17]"
          - "errors[ERR_AUTHORIZATION_WINDOW_EXPIRED]"
        distinguishing_aspect: |
          Entity pair #1 = Flight -> AirspaceAuthorization: the Flight's PLANNED -> LAUNCHED
          transition is legal only while the sibling authorization is APPROVED and the logical clock
          sits inside its HALF-OPEN [window_start, window_end). Advancing the clock to exactly
          window_end (12:00:00Z) makes the identical launch request fail, with no field on the
          Flight itself having changed.
        test_recipe:
          setup:
            - "Clock 2026-06-01T09:00:00Z; Bay + nest N1 (2 pads); drone N101 with a READY 100% pack."
            - "Order 2000 g dispatched, authorization filed for [08:00Z, 12:00Z), APPROVED, and flight released (PLANNED/CLEARED)."
            - "Clock then advanced to exactly 2026-06-01T12:00:00Z, i.e. the exclusive end of the window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
