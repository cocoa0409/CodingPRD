              payload: { limit: 100, offset: 0 }
              as: BranchManager
              captures: { sa: "$.data[0].id", sb: "$.data[1].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${sa}/services"
              payload: { activity_level: "HEAVY", matrix_replaced: true }
              as: FieldInspector
              as_user_id: "${a1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-19T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${sa}/services"
              payload: { activity_level: "HEAVY", matrix_replaced: true }
              as: FieldInspector
              as_user_id: "${a1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-19T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${sa}/services"
              payload: { activity_level: "HEAVY", matrix_replaced: true }
              as: FieldInspector
              as_user_id: "${a1}"
            - call: "GET /treatment-plans/${pl2}"
              payload: {}
              as: BranchManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-20T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${sb}/services"
              payload: { activity_level: "MODERATE", matrix_replaced: false }
              as: FieldInspector
              as_user_id: "${a1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-19T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${sb}/services"
              payload: { activity_level: "MODERATE", matrix_replaced: false }
              as: FieldInspector
              as_user_id: "${a1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-19T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bait-stations/${sb}/services"
              payload: { activity_level: "MODERATE", matrix_replaced: false }
              as: FieldInspector
              as_user_id: "${a1}"
            - call: "GET /treatment-plans/${pl2}"
              payload: {}
              as: BranchManager
          assert:
            - "target_station_count is 21 == ceil(205 / 10), so plan_escalation_threshold is ceil(21 * 0.05) == 2"
            - "the first station reaches ESCALATED on its third HEAVY visit (2026-10-19) and the plan then reads escalated_station_count 1 with retreat_required STILL false, because 1 < 2"
            - "the second station's first visit on 2026-10-20 grades ON_TIME at 80 whole days against the INSTALLED limit of 90"
            - "the second station reaches ESCALATED on 2026-12-19 and only then does the plan read escalated_station_count 2 and retreat_required true"
            - "the plan's escalated_station_count counts STATIONS, not services: six services produced exactly 2"
            - "each station's grid_ref is derived from its ordinal — station 1 is A1 and station 11 is B1 — and the 21st station is C1"

  - section: consistency_model
    instances:
      - name: every_derived_value_is_visible_in_the_response_that_produced_it
        claim_type: immediate
        grounds:
          - response_envelope
          - calculations.treatment_sizing_and_quote
          - calculations.bond_premium_and_cap
          - calculations.claim_exclusion_and_eligibility
          - calculations.claim_payout_waterfall
          - calculations.conducive_condition_ledger
        distinguishing_aspect: >-
          Every write returns its own derived fields already populated — the plan create response
          carries target_gallons and quoted_price_usd, the bond create response carries all six money
          fields, and the verification response carries the exclusion basis, the deductible and the
          projected payout. Cross-entity denormalisation is equally immediate: the Property's conducive
          ledger reflects the bond's waiver on the very next read, with no second call required to
          trigger recomputation.
        test_recipe:
          setup:
            - "Empty system; the clock starts at its declared default and is moved once to 2026-09-01 for issuance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995 }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Rosa Vance", license_number: "FL-10001", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { i1: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivan Reyes", license_number: "FL-10003", license_state: "FL", license_categories: ["WDO_INSPECTOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { i2: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Dale Ortiz", license_number: "FL-10002", license_state: "FL", license_categories: ["TERMITE_APPLICATOR"], license_expires_on: "2029-06-30" }
              as: ComplianceOfficer
              captures: { a1: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${i1}", purpose: "INITIAL", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${i1}"
              captures: { ins1: $.data.id }
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "A1", organism: "NONE", conducive_code: "WOOD_TO_SOIL_CONTACT", severity: 2 }
              as: FieldInspector
              as_user_id: "${i1}"
            - call: "POST /inspections/${ins1}/findings"
              payload: { finding_type: "CONDUCIVE_CONDITION", grid_ref: "A2", organism: "NONE", conducive_code: "EXCESSIVE_MOISTURE", severity: 2 }
              as: FieldInspector
              as_user_id: "${i1}"
            - call: "POST /inspections/${ins1}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${i1}"
          trigger:
            - call: "POST /treatment-plans"
              payload: { property_id: "${p1}", inspection_id: "${ins1}", applicator_id: "${a1}", method: "LIQUID_BARRIER", chemical_product_code: "FIPRO_9" }
              as: BranchManager
              captures: { pl1: $.data.id, vp: $.data.version }
            - call: "POST /treatment-plans/${pl1}/approve"
              payload: {}
              as: BranchManager
              captures: { vp2: $.data.version }
            - call: "POST /treatment-plans/${pl1}/applications"
              payload: { product_epa_number: "432-1234", gallons_applied: 190.00, concentration_pct: 0.06, expected_treatment_plan_version: "${vp2}" }
              as: Applicator
              as_user_id: "${a1}"
            - call: "POST /treatment-plans/${pl1}/complete"
              payload: {}
              as: Applicator
              as_user_id: "${a1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bonds"
              payload: { property_id: "${p1}", treatment_plan_id: "${pl1}", coverage_tier: "REPAIR_AND_RETREAT", conducive_waiver_codes: ["WOOD_TO_SOIL_CONTACT"] }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { bond1: $.data.id, vb: $.data.version }
            - call: "GET /properties/${p1}"
              payload: {}
              as: BranchManager
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${i2}", purpose: "INITIAL", scheduled_start_at: "2026-09-01T13:00:00Z", scheduled_end_at: "2026-09-01T15:00:00Z" }
              as: FieldInspector
              as_user_id: "${i2}"
              captures: { ins2: $.data.id }
            - call: "POST /inspections/${ins2}/findings"
              payload: { finding_type: "DAMAGE", grid_ref: "B3", organism: "SUBTERRANEAN_TERMITE", damage_estimate_usd: 3000.00, pre_existing: false, severity: 4 }
              as: FieldInspector
              as_user_id: "${i2}"
            - call: "POST /inspections/${ins2}/graph-complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${i2}"
            - call: "POST /damage-claims"
              payload: { bond_id: "${bond1}", claim_type: "REPAIR", claimed_damage_usd: 3000.00, expected_bond_version: "${vb}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { cl1: $.data.id }
            - call: "POST /damage-claims/${cl1}/attach-verification"
              payload: { verifying_inspection_id: "${ins2}" }
              as: FieldInspector
              as_user_id: "${i2}"
            - call: "GET /bonds/${bond1}"
              payload: {}
              as: BranchManager
          assert:
            - "the plan create response already carries target_gallons 190.00 (180 * 1.0 trench + ceil(2000/100) * 0.5 drill) and quoted_price_usd 1080.00 (275.00 + 805.00, multiplier 1.0, no infestation surcharge) — no second read is needed"
            - "the bond create response already carries base_premium_usd 194.40, repair_liability_cap_usd 11664.00, annual_premium_usd 241.06, claims_paid_to_date_usd 0.00, reserved_claim_amount_usd 0.00 and remaining_repair_cap_usd 11664.00"
            - "the GET on the property immediately after issuance reads total_conducive_condition_count 2, waived_conducive_condition_count 1 and open_conducive_condition_count 1 — the waiver applied in the bond write is already reflected, and 1 + 1 == 2"
            - "the verification response already carries exclusion_basis AGGREGATE_PRORATION (ins2 supersedes nothing), eligible_damage_usd 3000.00, excluded_pre_existing_usd 0.00, deductible_usd 210.00 (rate 0.07 because 2000.00 <= 3000.00 < 10000.00) and projected_payout_usd 2790.00"
            - "the bond read immediately after the verification shows reserved_claim_amount_usd 2790.00 and remaining_repair_cap_usd 8874.00 == 11664.00 - 2790.00, with claims_paid_to_date_usd still 0.00"
            - "every response in the chain is wrapped in the declared envelope with data as an object for single-row reads and an array for list reads, and no field is ever null-then-populated on a later read"

      - name: money_ledger_stays_reconciled_after_every_reserve_movement
        claim_type: immediate
        grounds:
          - calculations.repair_liability_conservation
          - entities.Bond.remaining_repair_cap_usd
        excluded_because:
          difficulty_instance: compensating_invariant / repair_cap_money_conservation_across_reserve_release_and_settlement
          rationale: "That instance walks reserve, release and settlement and asserts repair_liability_cap_usd == claims_paid_to_date_usd + reserved_claim_amount_usd + remaining_repair_cap_usd after every single hop, which is the invariant an immediate-consistency model owes on this entity."
