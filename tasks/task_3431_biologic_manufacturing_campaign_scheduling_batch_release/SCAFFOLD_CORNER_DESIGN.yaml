      - name: retest_after_invalidation_succeeds
        claim_type: Satisfaction
        grounds:
          - validations[priority=12]
          - state_machines.InProcessTest.OOS_SUSPECT_to_INVALIDATED
          - state_machines.Deviation.OPEN_to_CLOSED
        distinguishing_aspect: "The full OOS retest loop: out-of-spec PURITY (99.5 against spec 95.0-96.0) verifies to OOS_SUSPECT with an auto CRITICAL deviation; closing that deviation INVALIDATED_TEST flips the test INVALIDATED, and a superseding retest is then accepted and records in-spec."
        test_recipe:
          setup:
            - "Batch in DOWNSTREAM; out-of-spec DOWNSTREAM PURITY test verified to OOS_SUSPECT."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - *k_prod
            - *k_batch
            - *k_test_up
            - *k_verify_up
            - *k_adv_down
            - *k_getb
            - call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "PURITY", phase: "DOWNSTREAM", measured_value: 99.5, unit: "PCT", spec_min: 95.0, spec_max: 96.0, expected_batch_version: "${bat_v2}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_bad: $.data.id }
            - call: "POST /tests/${t_bad}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - call: "GET /batches/${batch_id}/deviations"
              payload: {}
              as: Any
              captures: { dev_oos: "$.data[0].id" }
            - call: "POST /deviations/${dev_oos}/action"
              payload: { action: "CLOSE", conclusion: "INVALIDATED_TEST", capa_summary: "Analyst transcription error; raw data supports invalidation" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
            - call: "GET /batches/${batch_id}"
              payload: {}
              as: Any
              captures: { bat_vr: $.data.version }
          trigger:
            - call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "PURITY", phase: "DOWNSTREAM", measured_value: 95.5, unit: "PCT", spec_min: 95.0, spec_max: 96.0, expected_batch_version: "${bat_vr}", supersedes_test_id: "${t_bad}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_retest: $.data.id }
          assert:
            - "InProcessTest.${t_bad}.status == INVALIDATED after the deviation close"
            - "the retest returns 201 with status RECORDED and is_in_spec == true"
            - "InProcessTest.${t_retest}.supersedes_test_id == ${t_bad}"

