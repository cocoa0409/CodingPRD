      - name: fee_and_surcharge_covered_by_difficulty
        claim_type: precision
        grounds: [calculations.shipment_compliance_fee, calculations.order_total_value]
        excluded_because:
          difficulty_instance: combinatorial_formula / fee_round_per_shipment_then_sum
          rationale: "Per-shipment rounding order and literal accumulated fees (2 + 5 = 7) asserted there; surcharge order asserted in surcharge_tier_keyed_on_goods_not_total."

  # =================================================================
  # Section: validations
  # =================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call with no X-User-Role/X-User-ID headers fails 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /compliance/products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_UNAUTHENTICATED\" (http 401)"

      - name: forbidden_role_on_create_product
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "TradeOpsSpecialist calling the Analyst-exclusive POST /products gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/products"
              payload: { sku: "P-030", name: "X", controlled_content_pct: 0, unit_value_cents: 10 }
              as: TradeOpsSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_FORBIDDEN\" (http 403)"

      - name: authorization_beats_existence_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "A request that would fail BOTH authorization (TradeOpsSpecialist on Manager-only review) AND existence (non-existent classification id) returns ERR_FORBIDDEN — priority 2 precedes priority 3."
        test_recipe:
          setup: ["empty DB (id does not exist)"]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/classifications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/review"
              payload: { decision: "APPROVE" }
              as: TradeOpsSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_FORBIDDEN\" (not ERR_NOT_FOUND)"

      - name: embargoed_destination_rejected_at_create
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DESTINATION_EMBARGOED]"]
        distinguishing_aspect: "Order creation to a destination with an ACTIVE PROHIBITED EMBARGOED_COUNTRY entry is rejected outright with ERR_DESTINATION_EMBARGOED."
        test_recipe:
          setup: ["EAR99 classified product; party; ACTIVE EMBARGOED_COUNTRY entry for PRK"]
