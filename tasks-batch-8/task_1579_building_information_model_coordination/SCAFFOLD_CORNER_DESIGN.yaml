            - { call: "POST /api/handover-packages/${h1}/respond", payload: { decision: "MAYBE" }, as: FacilitiesManager, as_user_id: "fm-1", captures: { e2b: $.data.error_id } }
            - { call: "POST /api/handover-packages/${h1}/transmit", payload: {}, as: BIMCoordinator, captures: { hst2: $.data.status } }
