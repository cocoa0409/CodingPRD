        grounds:
          - calculations.bin_occupancy_overlap
          - validations[priority=9]
          - errors[ERR_BIN_CAPACITY_EXCEEDED]
          - entities.StorageBin.fields.capacity
        distinguishing_aspect: |
          HALF-OPEN aggregate-capacity geometry on StorageBin: a capacity-1 bin already holding one loan over
          [2026-01-01, 2026-03-02) rejects a second concurrent origination overlapping that window with
          ERR_BIN_CAPACITY_EXCEEDED, while an abutting loan starting exactly at the first's grace_end (touching
          endpoints) would NOT conflict.
        test_recipe:
          setup:
            - "FL shop with a capacity-1 StorageBin already occupied by loan-1 over [2026-01-01, 2026-03-02)."
            - "A second appraised item awaits origination into the same bin at clock 2026-01-01 (overlapping)."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "TIGHT", capacity: 1 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Rex Borrower", gov_id_number: "ID-R1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Item A" }
              as: LoanOfficer
              captures: { item_a: $.data.id }
            - call: "POST /pawn/items/${item_a}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_a}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_a: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Item B" }
              as: LoanOfficer
              captures: { item_b: $.data.id }
            - call: "POST /pawn/items/${item_b}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
          trigger:
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_b}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_BIN_CAPACITY_EXCEEDED"

      - name: layaway_reservation_closed_buffer_overlap
        grounds:
          - calculations.bin_occupancy_overlap.variants.layaway_reservation_overlap
          - validations[priority=14]
          - errors[ERR_LAYAWAY_RESERVATION_CONFLICT]
          - entities.InventoryItem.fields.last_layaway_end_at
        distinguishing_aspect: |
          CLOSED-interval-with-additive-BUFFER geometry on InventoryItem (different from the bin's half-open
          aggregate model): after a layaway is cancelled at 2026-02-01 (last_layaway_end_at), a new layaway at
          2026-02-05 (within last_end + 7 buffer days) is rejected ERR_LAYAWAY_RESERVATION_CONFLICT.
        test_recipe:
          setup:
            - "An AVAILABLE forfeited InventoryItem; a first layaway created then cancelled at 2026-02-01 (sets last_layaway_end_at)."
            - "Clock advanced to 2026-02-05 (within the 7-day restock buffer)."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Sara Buyer", gov_id_number: "ID-S1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Camera" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id }
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/loans/${loan_id}/forfeit"
              payload: {}
              as: ShopManager
            - call: "GET /pawn/inventory?source_loan_id=${loan_id}"
              payload: {}
              as: ShopManager
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/layaway-plans"
              payload: { inventory_item_id: "${inv_id}", customer_id: "${cust_id}", installment_count: 2, reserved_until_at: "2026-06-01T00:00:00.000Z" }
              as: ShopManager
              captures: { plan1_id: $.data.id }
            - call: "POST /pawn/layaway-plans/${plan1_id}/cancel"
              payload: {}
              as: ShopManager
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00.000Z" }
              as: ShopManager
          trigger:
            - call: "POST /pawn/layaway-plans"
              payload: { inventory_item_id: "${inv_id}", customer_id: "${cust_id}", installment_count: 2, reserved_until_at: "2026-07-01T00:00:00.000Z" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_LAYAWAY_RESERVATION_CONFLICT"

  # ===================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_conserves_cash_drawer_balance
        grounds:
          - state_machines.Loan.ACTIVE_to_VOIDED
          - entities.FinanceTransaction.fields.amount_cents
          - entities.CashDrawer.fields.balance_cents
          - calculations.drawer_balance
        distinguishing_aspect: |
          CONSERVED QUANTITY = CashDrawer.balance_cents (cash): DISBURSEMENT (-20000) then its compensating
          VOID_REVERSAL (+20000) leaves the drawer at exactly its pre-origination value 0;
          sum of the loan's FinanceTransaction.amount_cents == 0.
        test_recipe:
          setup:
            - "Fresh FL shop, drawer 0; loan principal 20000 originated (drawer -> -20000); no servicing yet."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Tina Borrower", gov_id_number: "ID-T1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Ring" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id }
            - call: "GET /pawn/shops/${shop_id}/drawer"
              payload: {}
              as: ShopManager
              captures: { bal_after_disburse: "$.data[0].balance_cents" }
          trigger:
            - call: "POST /pawn/loans/${loan_id}/void"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "GET /pawn/shops/${shop_id}/drawer"
              payload: {}
              as: ShopManager
              captures: { bal_after_void: "$.data[0].balance_cents" }
          assert:
            - "bal_after_disburse == -20000"
            - "CashDrawer.balance_cents == 0 after void"
            - "PawnItem.${item_id}.status == APPRAISED (reverted)"

      - name: recall_conserves_item_population_count
        grounds:
          - state_machines.InventoryItem.AVAILABLE_to_RECALLED
          - state_machines.Loan.IN_GRACE_to_FORFEITED
          - calculations.drawer_balance
          - entities.PawnItem.fields.status
        distinguishing_aspect: |
          DIFFERENT CONSERVED QUANTITY = the item-population count (count(PawnItem PLEDGED) + count(InventoryItem in
          {AVAILABLE, ON_LAYAWAY})): forfeit moves the unit from the PLEDGED side to the AVAILABLE side; recall moves
          it back. The named total is 1 both before forfeit and after recall (no item created or destroyed).
        test_recipe:
          setup:
            - "FL loan principal 20000; clock at 2026-03-02; loan forfeited -> AVAILABLE InventoryItem (count: 0 pledged + 1 available = 1)."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Uma Borrower", gov_id_number: "ID-U1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Amp" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id }
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/loans/${loan_id}/forfeit"
              payload: {}
              as: ShopManager
            - call: "GET /pawn/inventory?source_loan_id=${loan_id}"
              payload: {}
              as: ShopManager
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /pawn/inventory/${inv_id}/recall"
              payload: {}
              as: ShopManager
            - call: "GET /pawn/items/${item_id}"
              payload: {}
              as: ShopManager
              captures: { item_status: $.data.status }
            - call: "GET /pawn/loans/${loan_id}"
              payload: {}
              as: ShopManager
              captures: { loan_status: $.data.status }
          assert:
            - "InventoryItem.${inv_id}.status == RECALLED"
            - "PawnItem.${item_id}.status == PLEDGED (back on the pledged side)"
            - "Loan.${loan_id}.status == IN_GRACE (redeemable again); item-population count conserved at 1"
