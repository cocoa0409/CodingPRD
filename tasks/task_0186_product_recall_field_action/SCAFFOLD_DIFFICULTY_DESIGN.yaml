  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      # --- Recall transition depends on RegulatoryReport state ---------------
      - name: announce_requires_initial_report_submitted
        grounds:
          - state_machines.Recall.CLASSIFIED_to_ANNOUNCED
          - entities.RegulatoryReport.fields.status
          - validations[priority=8]
        distinguishing_aspect: >
          Recall CLASSIFIED->ANNOUNCED is blocked unless a RegulatoryReport for the
          recall is SUBMITTED/ACKNOWLEDGED — Recall's transition depends on
          RegulatoryReport state, the (Recall, RegulatoryReport) entity pair.
        test_recipe:
          setup:
            - "Recall CLASSIFIED by U1, INITIAL report still DRAFTED (not submitted). U2 attempts announce -> blocked."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-CE1", name: "Charger", regulator: "CPSC", unit_list_price_cents: 3000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
