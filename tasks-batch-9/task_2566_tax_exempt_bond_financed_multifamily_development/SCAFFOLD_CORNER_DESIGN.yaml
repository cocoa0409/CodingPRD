          Right after issuance the project carries exactly one of the two ratios:
          the provisional variant is stamped at 5000 bps (par 200,000,000 over the
          filed aggregate basis 400,000,000) while the final variant is still null
          because no certification has been accepted, and automatic_credit_triggered
          is true on the strength of the provisional pass alone. The same read also
          has to expose the derived roster fields, and the list endpoint filtered on
          development_status FINANCED must return this project only, leaving the
          sponsor's untouched second project out.
