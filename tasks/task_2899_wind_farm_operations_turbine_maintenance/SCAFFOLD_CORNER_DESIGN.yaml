          assert:
            - "the create returns HTTP 201 with WorkOrder.${wo_id}.state == DRAFT, work_type == FAULT_DISPATCH and fault_event_id == ${fe_id}"
            - "FaultEvent.${fe_id}.triage_state == DISPATCHED immediately, with cleared_at still null and reset_attempt_count still 0"
            - "Turbine.${t_id}.availability_state is still FAULTED with active_fault_code F-4002"
