# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Cottage-Food & Farmers-Market Vendor Permit — Expert
# Breadth probe; §1.8 is the depth probe. excluded_because stubs cite §1.8 names.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: producer_register_success_201
        claim_type: Creation
        grounds: [entities.Producer.fields.business_name, entities.Producer.fields.status]
        distinguishing_aspect: "POST /cottage-food/producers with all required fields -> 201, status=PENDING_VERIFICATION, verification_token present, ytd_gross_sales_cents=0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "New Co", operator_name: "Ny C", contact_email: "ny@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { pid: $.data.id, st: $.data.status }
          assert:
            - "response.status_code == 201"
            - "Producer.${pid}.status == PENDING_VERIFICATION"
            - "Producer.${pid}.ytd_gross_sales_cents == 0"

      - name: producer_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Producer, "errors[ERR_PRODUCER_NOT_FOUND]"]
        distinguishing_aspect: "GET /cottage-food/producers/{unknown} -> ERR_PRODUCER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cottage-food/producers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HealthAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 404"
            - "response.error_id == ERR_PRODUCER_NOT_FOUND"

      - name: product_create_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product.fields.unit_price_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cottage-food/products omitting unit_price_cents -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A producer exists"]
          setup_api_calls:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Prod Co", operator_name: "Pr C", contact_email: "pr@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /cottage-food/products"
              payload: { producer_id: "${prod_id}", name: "NoPrice", food_category: "BAKED_GOODS", requires_refrigeration: false }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 400"
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: sales_record_nonpositive_gross_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.SalesRecord.fields.gross_amount_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cottage-food/sales-records with gross_amount_cents <= 0 -> ERR_INVALID_REQUEST (400) before any ledger update."
        test_recipe:
          setup: ["REGISTERED producer, ISSUED permit, APPROVED product, manifest APPROVED"]
          setup_api_calls:
            - call: "POST /cottage-food/allowed-food-policies"
              payload: { food_category: "BAKED_GOODS", is_cottage_allowed: true, class_b_required: false, requires_allergen_label: false }
              as: HealthAdmin
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Zero Co", operator_name: "Ze C", contact_email: "ze@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_A" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /cottage-food/products"
              payload: { producer_id: "${prod_id}", name: "Tart", food_category: "BAKED_GOODS", requires_refrigeration: false, unit_price_cents: 300 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { product_id: $.data.id }
            - call: "POST /cottage-food/products/${product_id}/review-food"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/products/${product_id}/review-label"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/farmers-markets"
              payload: { name: "Neg FM", county: "Alameda", venue_type: "CERTIFIED_FM", max_vendors_per_day: 5, allowed_classes: ["CLASS_A"] }
              as: HealthAdmin
              captures: { market_id: $.data.id, mv0: $.data.version }
            - call: "POST /cottage-food/market-manifests"
              payload: { producer_id: "${prod_id}", market_id: "${market_id}", permit_id: "${permit_id}", event_date: "2026-06-15", product_ids: ["${product_id}"] }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { m1: $.data.id }
            - call: "POST /cottage-food/market-manifests/${m1}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/market-manifests/${m1}/approve"
              payload: { expected_market_version: "${mv0}" }
              as: MarketManager
              as_user_id: "${market_id}"
          trigger:
            - call: "POST /cottage-food/sales-records"
              payload: { manifest_id: "${m1}", gross_amount_cents: 0 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 400"
            - "response.error_id == ERR_INVALID_REQUEST"
            - "Producer.${prod_id}.ytd_gross_sales_cents == 0"

      - name: producers_list_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Producer]
        distinguishing_aspect: "GET /cottage-food/producers returns array response_type with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two producers exist"]
          setup_api_calls:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "L1", operator_name: "L One", contact_email: "l1@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
            - call: "POST /cottage-food/producers"
              payload: { business_name: "L2", operator_name: "L Two", contact_email: "l2@x.com", county: "Marin", water_source: "PRIVATE_WELL" }
              as: Producer
          trigger:
            - call: "GET /cottage-food/producers"
              payload: { limit: 1, offset: 0 }
              as: HealthAdmin
          assert:
            - "response.response_type == array"
            - "response.data has total_count >= 2 and has_more == true"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: verify_already_registered_returns_invalid_request
        claim_type: invalid_transition
        grounds: [state_machines.Producer.PENDING_VERIFICATION_to_REGISTERED, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Verifying an already-REGISTERED producer (token consumed) -> ERR_INVALID_REQUEST; status stays REGISTERED."
        test_recipe:
          setup: ["A REGISTERED producer"]
          setup_api_calls:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Twice Co", operator_name: "Tw C", contact_email: "tw@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
          trigger:
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "Producer.${prod_id}.status == REGISTERED"

      - name: permit_submit_from_issued_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Permit.DRAFT_to_SUBMITTED, "errors[ERR_PERMIT_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-ISSUED permit -> ERR_PERMIT_INVALID_STATE (409); status stays ISSUED."
        test_recipe:
          setup: ["REGISTERED producer with an ISSUED CLASS_A permit"]
          setup_api_calls:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "IsCo", operator_name: "Is C", contact_email: "is@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_A" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
          trigger:
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PERMIT_INVALID_STATE"
            - "Permit.${permit_id}.status == ISSUED"

      - name: inspection_close_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Inspection.SCHEDULED_to_PASSED, "errors[ERR_INSPECTION_NOT_SCHEDULED]"]
        distinguishing_aspect: "Closing a PASSED inspection again -> ERR_INSPECTION_NOT_SCHEDULED (terminal lockdown)."
        test_recipe:
          setup: ["A PASSED inspection on a CLASS_B permit"]
          setup_api_calls:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "InsCo", operator_name: "In C", contact_email: "inc@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_B" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/inspections"
              payload: { permit_id: "${permit_id}", inspection_type: "ROUTINE", scheduled_for: "2026-05-10T09:00:00Z" }
              as: HealthInspector
              captures: { insp_id: $.data.id }
            - call: "POST /cottage-food/inspections/${insp_id}/close"
              payload: { result: "PASS", violation_count: 0 }
              as: HealthInspector
          trigger:
            - call: "POST /cottage-food/inspections/${insp_id}/close"
              payload: { result: "PASS", violation_count: 0 }
              as: HealthInspector
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INSPECTION_NOT_SCHEDULED"
            - "Inspection.${insp_id}.status == PASSED"

      - name: manifest_reject_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.MarketManifest.SUBMITTED_to_REJECTED, "errors[ERR_MANIFEST_INVALID_STATE]"]
        distinguishing_aspect: "Rejecting a DRAFT (not SUBMITTED) manifest -> ERR_MANIFEST_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT manifest and its market"]
          setup_api_calls:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "RejCo", operator_name: "Re C", contact_email: "re@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_A" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/products"
              payload: { producer_id: "${prod_id}", name: "Draft Prod", food_category: "BAKED_GOODS", requires_refrigeration: false, unit_price_cents: 300 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { product_id: $.data.id }
            - call: "POST /cottage-food/farmers-markets"
              payload: { name: "Rej FM", county: "Alameda", venue_type: "CERTIFIED_FM", max_vendors_per_day: 5, allowed_classes: ["CLASS_A"] }
              as: HealthAdmin
              captures: { market_id: $.data.id }
            - call: "POST /cottage-food/market-manifests"
              payload: { producer_id: "${prod_id}", market_id: "${market_id}", permit_id: "${permit_id}", event_date: "2026-06-15", product_ids: ["${product_id}"] }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /cottage-food/market-manifests/${m1}/reject"
              payload: {}
              as: MarketManager
              as_user_id: "${market_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_MANIFEST_INVALID_STATE"
            - "MarketManifest.${m1}.status == DRAFT"

      - name: recall_resolve_from_resolved_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RecallEvent.INITIATED_to_RESOLVED, "errors[ERR_RECALL_INVALID_STATE]"]
        distinguishing_aspect: "Resolving an already-RESOLVED recall -> ERR_RECALL_INVALID_STATE."
        test_recipe:
          setup: ["A RESOLVED recall on an approved product"]
          setup_api_calls:
            - call: "POST /cottage-food/allowed-food-policies"
              payload: { food_category: "BAKED_GOODS", is_cottage_allowed: true, class_b_required: false, requires_allergen_label: false }
              as: HealthAdmin
            - call: "POST /cottage-food/producers"
              payload: { business_name: "RecCo", operator_name: "Rc C", contact_email: "rc@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/products"
              payload: { producer_id: "${prod_id}", name: "RecProd", food_category: "BAKED_GOODS", requires_refrigeration: false, unit_price_cents: 500 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { product_id: $.data.id }
            - call: "POST /cottage-food/products/${product_id}/review-food"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/recall-events"
              payload: { producer_id: "${prod_id}", product_id: "${product_id}", reason: "MISLABEL", severity: "LOW" }
              as: HealthAdmin
              captures: { recall_id: $.data.id }
            - call: "POST /cottage-food/recall-events/${recall_id}/resolve"
              payload: { recalled_units: 5 }
              as: HealthAdmin
          trigger:
            - call: "POST /cottage-food/recall-events/${recall_id}/resolve"
              payload: { recalled_units: 3 }
              as: HealthAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_RECALL_INVALID_STATE"
            - "RecallEvent.${recall_id}.status == RESOLVED"

      - name: complaint_review_by_filer_returns_segregation_of_duties
        claim_type: precondition_enforcement
        grounds: [state_machines.Complaint.RECEIVED_to_UNDER_REVIEW, "validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Reviewing a complaint with the same X-User-ID that filed it -> ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["A RECEIVED complaint filed by user insp-1"]
          setup_api_calls:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "CompCo", operator_name: "Co C", contact_email: "co@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id }
            - call: "POST /cottage-food/complaints"
              payload: { producer_id: "${prod_id}", category: "LABELING", description: "no allergen line" }
              as: HealthInspector
              as_user_id: "insp-1"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /cottage-food/complaints/${comp_id}/review"
              payload: {}
              as: HealthInspector
              as_user_id: "insp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Complaint.${comp_id}.status == RECEIVED"

      - name: complaint_sod_distinct_reviewer_succeeds
        claim_type: valid_transition
        grounds: [state_machines.Complaint.RECEIVED_to_UNDER_REVIEW]
        distinguishing_aspect: "A different reviewer (insp-2) advances the complaint to UNDER_REVIEW and reviewed_by_user_id records insp-2."
        test_recipe:
          setup: ["A RECEIVED complaint filed by insp-1"]
          setup_api_calls:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Comp2 Co", operator_name: "C2 C", contact_email: "c2@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id }
            - call: "POST /cottage-food/complaints"
              payload: { producer_id: "${prod_id}", category: "ILLNESS", description: "reported illness" }
              as: HealthInspector
              as_user_id: "insp-1"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /cottage-food/complaints/${comp_id}/review"
              payload: {}
              as: HealthInspector
              as_user_id: "insp-2"
          assert:
            - "Complaint.${comp_id}.status == UNDER_REVIEW"
            - "Complaint.${comp_id}.reviewed_by_user_id == insp-2"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: permit_fee_class_a_value
        claim_type: Correct Result
        grounds: [calculations.permit_fee, entities.Permit.fields.fee_cents]
        distinguishing_aspect: "CLASS_A permit fee_cents == 5000 (base 2500 + cap-tier 2500 + inspection 0)."
        test_recipe:
          setup: ["REGISTERED producer, CLASS_A permit issued"]
          setup_api_calls:
            - call: "POST /cottage-food/producers"
              payload: { business_name: "FeeA Co", operator_name: "Fa C", contact_email: "fa@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_A" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
          trigger:
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
              captures: { fee: $.data.fee_cents }
          assert:
            - "Permit.${permit_id}.fee_cents == 5000"

      - name: audited_ytd_floors_at_zero
        claim_type: Correct Result
        grounds: [calculations.sales_cap_utilization]
        distinguishing_aspect: "When CHECKED_IN gross (30000) is below the 50000 exemption, audited_ytd_cents floors at 0 while provisional_ytd_cents == 30000."
        test_recipe:
          setup: ["REGISTERED producer, ISSUED permit, APPROVED product, manifest CHECKED_IN with one 30000 sale"]
          setup_api_calls:
            - call: "POST /cottage-food/allowed-food-policies"
              payload: { food_category: "BAKED_GOODS", is_cottage_allowed: true, class_b_required: false, requires_allergen_label: false }
              as: HealthAdmin
            - call: "POST /cottage-food/producers"
              payload: { business_name: "Floor Co", operator_name: "Fl C", contact_email: "fl@x.com", county: "Alameda", water_source: "PUBLIC" }
              as: Producer
              captures: { prod_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /cottage-food/producers/${prod_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits"
              payload: { producer_id: "${prod_id}", permit_class: "CLASS_A" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /cottage-food/permits/${permit_id}/submit"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /cottage-food/products"
              payload: { producer_id: "${prod_id}", name: "Danish", food_category: "BAKED_GOODS", requires_refrigeration: false, unit_price_cents: 300 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { product_id: $.data.id }
            - call: "POST /cottage-food/products/${product_id}/review-food"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/products/${product_id}/review-label"
              payload: { decision: "APPROVE" }
              as: HealthInspector
            - call: "POST /cottage-food/farmers-markets"
              payload: { name: "Floor FM", county: "Alameda", venue_type: "CERTIFIED_FM", max_vendors_per_day: 5, allowed_classes: ["CLASS_A"] }
              as: HealthAdmin
              captures: { market_id: $.data.id, mv0: $.data.version }
            - call: "POST /cottage-food/market-manifests"
              payload: { producer_id: "${prod_id}", market_id: "${market_id}", permit_id: "${permit_id}", event_date: "2026-06-15", product_ids: ["${product_id}"] }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { m1: $.data.id }
