              payload: { legal_name: "Sierra2 B", account_type: "COMMERCIAL", contact_email: "sb@x.test", site_address: "47 St" }
              as: AccountManager
              captures: { client_b: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "TREE-S2", category: "TREE", unit_replacement_cents: 9000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /clients/${client_a}/contracts"
              payload: { contract_type: "COMMERCIAL", season_year: 2026, early_bird_deadline: "2026-03-01T00:00:00Z" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/design-proposals"
              payload: { theme: "T" }
              as: AccountManager
              captures: { proposal_id: $.data.id }
            - call: "POST /design-proposals/${proposal_id}/line-items"
              payload: { inventory_item_id: "${sku_id}", quantity: 4, unit_install_cents: 5000 }
              as: AccountManager
            - call: "POST /design-proposals/${proposal_id}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /clients/${client_a}/contracts/${contract_id}/propose"
              payload: {}
              as: AccountManager
              captures: { contract_v: $.data.version }
            - call: "POST /design-proposals/${proposal_id}/accept"
              payload: { expected_contract_version: "${contract_v}" }
              as: ClientContact
              as_user_id: "${client_a}"
          trigger:
            - call: "POST /clients/${client_a}/contracts/${contract_id}/sign"
              payload: {}
              as: ClientContact
              as_user_id: "${client_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: unknown_role_returns_unauthenticated
        claim_type: forbidden_operation
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown X-User-Role value → ERR_UNAUTHENTICATED 401."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clients"
              payload: {}
              as: Nobody
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

