  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency (≥ 2 instances, different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_accept_gated_on_film_lifecycle
        grounds:
          - state_machines.BookingAgreement.PROPOSED_to_ACCEPTED
          - entities.Film.fields.lifecycle_status
          - errors[ERR_FILM_NOT_BOOKABLE]
        distinguishing_aspect: |
          Entity pair: BookingAgreement → Film.
          BookingAgreement.PROPOSED → ACCEPTED requires Film.lifecycle_status
          in {PRE_RELEASE, IN_RELEASE, HOLDOVER_PHASE}. When Film is PULLED or
          ANCILLARY_RELEASED, acceptance is rejected.
        test_recipe:
          setup:
            - "Film F1 in PRE_RELEASE"
            - "BookingAgreement BA1 PROPOSED for F1"
            - "Then F1 transitions to PULLED (Booker pulls before release)"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "D", territory: "US" }
              as: PlatformAdmin
              captures: { did: $.data.id }
            - call: "POST /distributors/${did}/films"
              payload: { title: "F", genre: "NARRATIVE", runtime_minutes: 90, rating: "R", release_pattern: "LIMITED", target_release_date: "2026-05-08T00:00:00Z", min_screens_for_wide: 0 }
              as: Booker
              captures: { fid: $.data.id }
            - call: "POST /distributors/${did}/theatres"
              payload: { name: "T", circuit: "X", market_code: "NYC", house_allowance_cents: 100 }
