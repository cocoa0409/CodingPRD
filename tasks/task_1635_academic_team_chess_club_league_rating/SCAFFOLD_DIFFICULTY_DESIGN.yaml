scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Player vs Club)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_established_rating_divergence
        grounds:
          - calculations.rating_update
          - entities.Player.fields.is_provisional
          - state_machines.Pairing.REPORTED_to_CONFIRMED
        distinguishing_aspect: |
          Player-domain dual variant: for identical pre-game data (winner rating 800,
          opponent 1200, win), the PROVISIONAL variant yields 1600 while the
          ESTABLISHED variant would yield 829 — variant is selected by
          rated_games_played < season.provisional_game_threshold, and the RatingEvent
          records which variant ran.
        test_recipe:
          setup:
            - "Season threshold 4, base 800, ACTIVE; two clubs NE with coaches; white player W is brand-new (no initial rating/games); black player B seeded initial_rating 1200, initial_rated_games 25; both memberships WAIVED; meet IN_PROGRESS with one pairing W(white) vs B(black)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "Alpha HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "Beta HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "SENIOR" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_b}", full_name: "Coach B", email: "cb@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_b: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "W", grade_level: 9 }, as: FederationAdmin, captures: { player_w: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "B", grade_level: 10, initial_rating: 1200, initial_rated_games: 25 }, as: FederationAdmin, captures: { player_b: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${player_w}", season_id: "${season_id}" }, as: FederationAdmin, captures: { mem_w: $.data.id } }
            - { call: "POST /api/memberships/${mem_w}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${player_b}", season_id: "${season_id}" }, as: FederationAdmin, captures: { mem_b: $.data.id } }
            - { call: "POST /api/memberships/${mem_b}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet_id: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { meet_v: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${player_w}", black_player_id: "${player_b}", expected_meet_version: "${meet_v}" }, as: FederationAdmin, captures: { pairing_id: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/publish-pairings", payload: {}, as: FederationAdmin }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_a}", event_type: "MEET", meet_id: "${meet_id}" }, as: FederationAdmin, captures: { asg_id: $.data.id } }
            - { call: "POST /api/proctor-assignments/${asg_id}/confirm", payload: {}, as: Proctor, as_user_id: "${coach_a}" }
            - { call: "POST /api/meets/${meet_id}/start", payload: {}, as: FederationAdmin }
          trigger:
            - { call: "POST /api/pairings/${pairing_id}/report-result", payload: { result: "WHITE_WIN" }, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/pairings/${pairing_id}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_b}" }
            - { call: "GET /api/players/${player_w}", as: FederationAdmin, captures: { w_rating: $.data.rating, w_prov: $.data.is_provisional } }
            - { call: "GET /api/players/${player_b}", as: FederationAdmin, captures: { b_rating: $.data.rating } }
            - { call: "GET /api/rating-events?player_id=${player_w}", as: FederationAdmin, captures: { w_variant: "$.data[0].formula_variant", w_k: "$.data[0].k_factor" } }
          assert:
            - "Player.${player_w}.rating == 1600 (PROVISIONAL: (800*0 + 1200 + 400)/1)"
            - "Player.${player_w}.rating != 829 (ESTABLISHED hypothetical: 800 + round(32*(1 - 1/(1+10^1))) = 829)"
            - "RatingEvent[0].formula_variant == PROVISIONAL and k_factor is null (${w_variant}, ${w_k})"
            - "Player.${player_b}.rating == 1171 (ESTABLISHED: 1200 - 29)"
            - "Player.${player_w}.is_provisional == true; Player.${player_b}.is_provisional == false"

      - name: projected_vs_actual_travel_stipend
        grounds:
          - calculations.travel_stipend
          - entities.Club.fields.projected_travel_stipend_cents
        distinguishing_aspect: |
          Club-domain dual variant (different domain from the Player rating variant):
          PROJECTED counts SCHEDULED|PAIRINGS_PUBLISHED|IN_PROGRESS|COMPLETED meets
          while ACTUAL counts COMPLETED only, so with 2 completed + 1 scheduled meet
          the same club yields projected 9000 vs actual 6000.
        test_recipe:
          setup:
            - "Season ACTIVE, travel_base_cents 1500; club A travel_tier 2 with: two COMPLETED meets (vs B on 2026-09-05, vs C on 2026-09-12) and one SCHEDULED meet (vs B on 2026-10-03); memberships waived; each completed meet had its single pairing confirmed as a draw"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 2 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Gamma", school_name: "G HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_c: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_b}", full_name: "Coach B", email: "cb@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_c}", full_name: "Coach C", email: "cc@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_c: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "PA", grade_level: 9 }, as: FederationAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "PB", grade_level: 9 }, as: FederationAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_c}", full_name: "PC", grade_level: 9 }, as: FederationAdmin, captures: { pc: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${pa}", season_id: "${season_id}" }, as: FederationAdmin, captures: { ma: $.data.id } }
            - { call: "POST /api/memberships/${ma}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${pb}", season_id: "${season_id}" }, as: FederationAdmin, captures: { mb: $.data.id } }
            - { call: "POST /api/memberships/${mb}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${pc}", season_id: "${season_id}" }, as: FederationAdmin, captures: { mc: $.data.id } }
            - { call: "POST /api/memberships/${mc}/waive", payload: {}, as: FederationAdmin }
            # meet 1 (A host vs B) -> COMPLETED with a draw
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet1: $.data.id } }
            - { call: "POST /api/meets/${meet1}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet1}", as: FederationAdmin, captures: { m1v: $.data.version } }
            - { call: "POST /api/meets/${meet1}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${pa}", black_player_id: "${pb}", expected_meet_version: "${m1v}" }, as: FederationAdmin, captures: { pair1: $.data.id } }
            - { call: "POST /api/meets/${meet1}/publish-pairings", payload: {}, as: FederationAdmin }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_a}", event_type: "MEET", meet_id: "${meet1}" }, as: FederationAdmin, captures: { asg1: $.data.id } }
            - { call: "POST /api/proctor-assignments/${asg1}/confirm", payload: {}, as: Proctor, as_user_id: "${coach_a}" }
            - { call: "POST /api/meets/${meet1}/start", payload: {}, as: FederationAdmin }
            - { call: "POST /api/pairings/${pair1}/report-result", payload: { result: "DRAW" }, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/pairings/${pair1}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_b}" }
            - { call: "POST /api/meets/${meet1}/complete", payload: {}, as: FederationAdmin }
            # meet 2 (C host vs A) -> COMPLETED with a draw
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_c}", away_club_id: "${club_a}", scheduled_date: "2026-09-12", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet2: $.data.id } }
            - { call: "POST /api/meets/${meet2}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet2}", as: FederationAdmin, captures: { m2v: $.data.version } }
            - { call: "POST /api/meets/${meet2}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${pc}", black_player_id: "${pa}", expected_meet_version: "${m2v}" }, as: FederationAdmin, captures: { pair2: $.data.id } }
            - { call: "POST /api/meets/${meet2}/publish-pairings", payload: {}, as: FederationAdmin }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_c}", event_type: "MEET", meet_id: "${meet2}" }, as: FederationAdmin, captures: { asg2: $.data.id } }
            - { call: "POST /api/proctor-assignments/${asg2}/confirm", payload: {}, as: Proctor, as_user_id: "${coach_c}" }
            - { call: "POST /api/meets/${meet2}/start", payload: {}, as: FederationAdmin }
            - { call: "POST /api/pairings/${pair2}/report-result", payload: { result: "DRAW" }, as: ClubCoach, as_user_id: "${coach_c}" }
            - { call: "POST /api/pairings/${pair2}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/meets/${meet2}/complete", payload: {}, as: FederationAdmin }
            # meet 3 (A host vs B) left SCHEDULED only
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-10-03", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet3: $.data.id } }
            - { call: "POST /api/meets/${meet3}/schedule", payload: {}, as: FederationAdmin }
            - { call: "POST /api/seasons/${season_id}/finalize", payload: {}, as: FederationAdmin }
          trigger:
            - { call: "GET /api/clubs/${club_a}", as: FederationAdmin, captures: { proj: $.data.projected_travel_stipend_cents } }
            - { call: "POST /api/travel-stipends", payload: { season_id: "${season_id}", club_id: "${club_a}" }, as: Treasurer, as_user_id: "treasurer-1", captures: { stip: $.data.amount_cents, counted: $.data.meets_counted } }
          assert:
            - "Club.${club_a}.projected_travel_stipend_cents == 9000 (2 * 1500 * min(3,10); PROJECTED counts the SCHEDULED meet)"
            - "TravelStipend.amount_cents == 6000 (2 * 1500 * min(2,10); ACTUAL counts COMPLETED only) and meets_counted == 2 (${stip}, ${counted})"
            - "GET /api/clubs/${club_a}/ledger-entries contains a TRAVEL_STIPEND entry of +6000"
  # =====================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: k_factor_tier_selection_boundary
        grounds:
          - calculations.rating_update
          - entities.RatingEvent.fields.k_factor
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: the ESTABLISHED formula
          tiers K by pre-game rating (32 / 24 / 16 at 2100 / 2400 boundaries) on top of
          the expected-score logistic and score; a player at exactly 2100 uses K=24
          while 2099 uses K=32, recorded per RatingEvent.
        test_recipe:
          setup:
            - "Season threshold 4 ACTIVE; host club A with two seeded winners (2100/25 and 2099/25), away club B with two seeded 800/30 players; memberships waived; one meet with 1 round x 2 boards, IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_b}", full_name: "Coach B", email: "cb@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_b: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "W2100", grade_level: 11, initial_rating: 2100, initial_rated_games: 25 }, as: FederationAdmin, captures: { w_hi: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "W2099", grade_level: 11, initial_rating: 2099, initial_rated_games: 25 }, as: FederationAdmin, captures: { w_lo: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "B800a", grade_level: 9, initial_rating: 800, initial_rated_games: 30 }, as: FederationAdmin, captures: { b1: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "B800b", grade_level: 9, initial_rating: 800, initial_rated_games: 30 }, as: FederationAdmin, captures: { b2: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${w_hi}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${w_lo}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${b1}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m3: $.data.id } }
            - { call: "POST /api/memberships/${m3}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${b2}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m4: $.data.id } }
            - { call: "POST /api/memberships/${m4}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 2 }, as: FederationAdmin, captures: { meet_id: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/schedule", payload: {}, as: FederationAdmin }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { mv1: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${w_hi}", black_player_id: "${b1}", expected_meet_version: "${mv1}" }, as: FederationAdmin, captures: { pair1: $.data.id } }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { mv2: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 2, white_player_id: "${w_lo}", black_player_id: "${b2}", expected_meet_version: "${mv2}" }, as: FederationAdmin, captures: { pair2: $.data.id } }
            - { call: "POST /api/meets/${meet_id}/publish-pairings", payload: {}, as: FederationAdmin }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_a}", event_type: "MEET", meet_id: "${meet_id}" }, as: FederationAdmin, captures: { asg: $.data.id } }
            - { call: "POST /api/proctor-assignments/${asg}/confirm", payload: {}, as: Proctor, as_user_id: "${coach_a}" }
            - { call: "POST /api/meets/${meet_id}/start", payload: {}, as: FederationAdmin }
          trigger:
            - { call: "POST /api/pairings/${pair1}/report-result", payload: { result: "WHITE_WIN" }, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/pairings/${pair1}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_b}" }
            - { call: "POST /api/pairings/${pair2}/report-result", payload: { result: "WHITE_WIN" }, as: ClubCoach, as_user_id: "${coach_a}" }
            - { call: "POST /api/pairings/${pair2}/confirm", payload: {}, as: ClubCoach, as_user_id: "${coach_b}" }
            - { call: "GET /api/rating-events?player_id=${w_hi}", as: FederationAdmin, captures: { k_hi: "$.data[0].k_factor" } }
            - { call: "GET /api/rating-events?player_id=${w_lo}", as: FederationAdmin, captures: { k_lo: "$.data[0].k_factor" } }
          assert:
            - "RatingEvent for ${w_hi}: k_factor == 24 (2100 uses the mid tier; delta round(24*0.000562) == 0, rating stays 2100) — got ${k_hi}"
            - "RatingEvent for ${w_lo}: k_factor == 32 (2099 uses the low tier) — got ${k_lo}"
            - "Player.${w_hi}.rating == 2100 and Player.${w_lo}.rating == 2099 (both deltas round to 0, but K tiers differ on the stored events)"

      - name: entry_fee_per_entry_rounding
        grounds:
          - calculations.entry_fee
          - entities.TournamentEntry.fields.fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order is pinned: fee 1035 with 10% early-bird is
          931.5 rounded per entry to 932 and THEN summed (3 entries = 2796); the
          alternative sum-then-round yields 2795. The ledger must show 2796 total.
        test_recipe:
          setup:
            - "Season ACTIVE; club A funded 5000; tournament fee 1035 with early_bird 10% deadline 2026-09-15 (default clock 2026-08-01 is before it); section [0,2900] allow_provisional, max_entries 10; three players with WAIVED memberships"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, club_v: $.data.version } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 5000, memo: "funding", expected_club_version: "${club_v}" }, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P1", grade_level: 9 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P2", grade_level: 9 }, as: FederationAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P3", grade_level: 9 }, as: FederationAdmin, captures: { p3: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${p2}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${p3}", season_id: "${season_id}" }, as: FederationAdmin, captures: { m3: $.data.id } }
            - { call: "POST /api/memberships/${m3}/waive", payload: {}, as: FederationAdmin }
