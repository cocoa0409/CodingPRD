  - rule_id: compensating_invariant
    instances:
      - name: in_scope_dependent_headcount_conserved_across_amnesty_verification_and_termination
        grounds:
          - entities.AuditProgram.fields.in_scope_dependent_count
          - entities.AuditProgram.fields.pending_dependent_count
          - entities.AuditProgram.fields.amnesty_removed_count
          - entities.AuditProgram.fields.terminated_dependent_count
          - calculations.amnesty_coverage_end
          - endpoints[POST /audit-programs/{id}/run-sweep]
        distinguishing_aspect: |
          Conserved quantity #1 is a HEADCOUNT partition, not money: at every checkpoint
          in_scope_dependent_count == pending_dependent_count + verified_dependent_count + amnesty_removed_count
          + termination_pending_count + terminated_dependent_count must hold exactly (3 == 3), so a dependent that
          moves between buckets can never be double-counted or dropped by the counter recomputes.
        test_recipe:
          setup:
            - "Employee E1 holds three dependents created in this order: SPOUSE D1 (49713), CHILD_BIOLOGICAL D2 (30500) and STEPCHILD D3 (30500); each relationship_type has an AUDIT DocumentationRule with min_accepted_documents 1."
            - "Program P was scoped FULL_CENSUS and announced 2026-09-01, so in_scope_dependent_count == 3 and pending_dependent_count == 3."
            - "At 2026-09-10 the employee voluntarily removed D2 under amnesty (coverage_end_date 2026-09-30), moving case C1 to IN_PROGRESS."
            - "A sweep at 2026-09-23 ran only S1 (program -> RESPONSE_WINDOW); at 2026-09-24 D1's MARRIAGE_CERTIFICATE was filed and accepted by u_analyst_1, so D1 is VERIFIED and only D3 is still PENDING_VERIFICATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "FAMILY", employer_monthly_premium_cents: 148000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "CHILD_BIOLOGICAL", full_name: "Ivo Reyes", date_of_birth: "2014-02-02", monthly_cost_cents: 30500 }
              as: ProgramAdmin
              captures: { dep2_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "STEPCHILD", full_name: "Lena Reyes", date_of_birth: "2012-07-19", monthly_cost_cents: 30500 }
              as: ProgramAdmin
              captures: { dep3_id: "$.data.id" }
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Dependent Eligibility Audit", plan_year: 2026, amnesty_days: 21, response_days: 45, reminder_min_gap_days: 7, max_reminders: 3, poe_verification_enabled: false }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "CHILD_BIOLOGICAL", phase: "AUDIT", acceptable_proof_types: ["BIRTH_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
