- section: cross_cutting_complexity_layers
  instances:
  - name: finalize_with_stale_connection_version_returns_stale
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[survey-finalize-stale-connection]
    - validations[priority=15]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: After one survey is finalized (bumping the connection version), finalizing a second draft survey while still carrying the pre-bump expected_service_connection_version is rejected ERR_STALE_VERSION (412).
    test_recipe:
      setup:
      - Connection with two DRAFT surveys; the connection version is captured, then survey 1 is finalized (version advances).
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C23
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /hazard-surveys
        payload:
          service_connection_id: ${conn_id}
          premise_use_score: 10
          chemical_exposure_score: 10
          auxiliary_supply_score: 10
        as: UtilityAdmin
        captures:
          survey1_id: $.data.id
      - call: POST /hazard-surveys
        payload:
          service_connection_id: ${conn_id}
          premise_use_score: 20
          chemical_exposure_score: 20
          auxiliary_supply_score: 20
        as: UtilityAdmin
        captures:
          survey2_id: $.data.id
      - call: GET /service-connections/${conn_id}
        as: UtilityAdmin
        captures:
          v0: $.data.version
      - call: POST /hazard-surveys/${survey1_id}/finalize
        payload:
          expected_service_connection_version: ${v0}
        as: UtilityAdmin
      trigger:
      - call: POST /hazard-surveys/${survey2_id}/finalize
        payload:
          expected_service_connection_version: ${v0}
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_STALE_VERSION (v0 is stale after survey 1 finalized)
      - HTTP status == 412
  - name: overdue_count_reconciled_after_clock_advance
    claim_type: derived_field_reconciliation
    grounds:
    - entities.ServiceConnection.fields.overdue_device_count
    - calculations.connection_compliance_posture
    distinguishing_aspect: A device due 2026-03-01 shows overdue_device_count 0 at clock 2026-03-01 but 1 after the clock advances to 2026-03-15, and posture becomes NON_COMPLIANT.
    test_recipe:
      setup:
      - Connection + device due 2026-03-01; clock advanced to 2026-03-15.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C24
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C24
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2025-03-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-03-15T00:00:00Z'
        as: UtilityAdmin
      trigger:
      - call: GET /service-connections/${conn_id}
        as: UtilityAdmin
        captures:
          od: $.data.overdue_device_count
      assert:
      - ServiceConnection.${conn_id}.overdue_device_count == 1
      - ServiceConnection.${conn_id}.compliance_posture == NON_COMPLIANT
  - name: reminders_generate_creates_overdue_reminder
    claim_type: scheduled_actions
    grounds:
    - endpoints.POST /reminders/generate
    - entities.Reminder.fields.reminder_type
    distinguishing_aspect: With one overdue device, POST /reminders/generate returns generated_count 1 and overdue_count 1.
    test_recipe:
      setup:
      - Connection + one device due 2026-03-01; clock advanced to 2026-03-15 (overdue).
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C25
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C25
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2025-03-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-03-15T00:00:00Z'
        as: UtilityAdmin
      trigger:
      - call: POST /reminders/generate
        payload: {}
        as: UtilityAdmin
        captures:
          oc: $.data.overdue_count
          gc: $.data.generated_count
      assert:
      - reminders generate overdue_count == 1
      - reminders generate generated_count == 1
