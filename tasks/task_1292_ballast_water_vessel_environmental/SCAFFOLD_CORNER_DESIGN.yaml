              captures: { crit: "$.data[0].id", crit_due: "$.data[0].response_due_at", crit_st0: "$.data[0].response_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-23T00:00:04Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /vessels/${v}/voyages/${vyB}/noncompliance?severity=CRITICAL"
              as: ShoreComplianceOfficer
              captures: { crit_st1: "$.data[0].response_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-23T00:00:05Z" }
              as: PlatformAdmin
            - call: "GET /vessels/${v}/voyages/${vyB}/noncompliance?severity=CRITICAL"
