  # =====================================================================
  # RULE 5 - priority_pair_validation_conflict
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: body_fk_existence_outranks_stale_project_version_on_submittal_create
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - concurrency_rules[submittal-create-stale-project]
          - endpoints.POST_/submittals
        distinguishing_aspect: |
          Both violations are present in one request - an unknown calculation id in the body and an
          expected_project_version that a later auxiliary-system write already invalidated - and the
          existence family at priority 5 must answer first, so the response is 404
          ERR_CALCULATION_NOT_FOUND, not the 412 an implementation that checks the cheap version
          comparison first would return. The second trigger call keeps the same stale version with a
          real calculation id and does get 412, which proves the OCC check is live and only outranked.
        test_recipe:
          setup:
            - "Project FP-2601 created, version captured immediately after creation"
            - "One STANDPIPE_CLASS_I system added afterwards, which recomputes the demand ledger and increments Project.version, so the captured version is now stale"
            - "Calculation HC-1 exists in DRAFT with no iterations"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id, pv_stale: $.data.version }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0, room_area_sqft: 3000.0, enclosure_rating_hours: 2.0, room_has_unprotected_opening: false }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p1}", hazard_area_id: "${ha1}", method: "AREA_DENSITY", k_factor: 25.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc1: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_I", label: "Stair 1 and 2 standpipes", riser_count: 2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux1: $.data.id }
          trigger:
            - call: "POST /submittals"
              payload: { project_id: "${p1}", included_calculation_ids: ["11111111-2222-3333-4444-555555555555"], expected_project_version: "${pv_stale}" }
              as: DesignEngineer
              as_user_id: "${e1}"
            - call: "POST /submittals"
              payload: { project_id: "${p1}", included_calculation_ids: ["${hc1}"], expected_project_version: "${pv_stale}" }
              as: DesignEngineer
              as_user_id: "${e1}"
          assert:
            - "the first trigger call returns 404 ERR_CALCULATION_NOT_FOUND"
            - "the first trigger call does NOT return 412 ERR_STALE_PROJECT_VERSION"
            - "the second trigger call returns 412 ERR_STALE_PROJECT_VERSION"
            - "the second trigger call does NOT return 409 ERR_CALCULATION_NOT_SEALED, because priority 11 outranks priority 25"
            - "GET /submittals?project_id=${p1} returns 0 rows"
            - "Project.${p1}.submittal_cycle_count == 0"
            - "Project.${p1}.status == DESIGN"

