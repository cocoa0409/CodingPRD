          setup: ["Deal D1 exists"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-IMM2", deal_name: "I2", strategy: "CORE", target_purchase_price_cents: 100 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "OFFICE", units: 1, rentable_sqft: 1000, year_built: 2000 }
              as: Analyst
              as_user_id: "u-analyst-1"
            - call: "POST /re-underwriting/deals/${deal_id}/assumptions"
              payload: { label: "B", market_rent_growth_yr1_bps: 100, market_rent_growth_steady_bps: 100, expense_growth_bps: 100, exit_cap_rate_bps: 500, hold_period_years: 5, capex_per_unit_cents: 0, lease_up_months: 0 }
              as: Analyst
              as_user_id: "u-analyst-1"
          trigger:
            - call: "POST /re-underwriting/deals/${deal_id}/submit-underwriting"
              payload: {}
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { status_in_response: $.data.status }
            - call: "GET /re-underwriting/deals/${deal_id}"
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { status_on_read: $.data.status }
          assert:
            - "status_in_response == UNDERWRITING (visible in same response)"
            - "status_on_read == UNDERWRITING (immediately consistent on read)"
