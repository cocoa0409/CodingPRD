  # --- CCPCheck ---
  - method: POST
    path: "/plant/production-batches/{batchId}/ccp-checks"
    description: "Record a critical-control-point check (batch must be FROZEN, PACKED, COMPLETED, or ON_HOLD — ON_HOLD allows investigative re-checks; append-only)"
    roles: [QATechnician]
    code: 201
    input: [check_type, test_piece_detected, "measured_size_mm?"]
    output: CCPCheck
    side_effects:
      - "result computed (PASS iff test_piece_detected)"
      - "FAIL while batch is FROZEN or PACKED: batch -> ON_HOLD (CCP_FAIL cascade: SCHEDULED runs CANCELLED, film reservations released)"
      - "FAIL while batch is COMPLETED: no hold; release gating via latest-check rule (ERR_CCP_NOT_CURRENT) applies instead"
  - method: GET
    path: "/plant/ccp-checks/{checkId}"
    description: "Get a CCP check"
    roles: [PlantManager, ProductionPlanner, LineOperator, QATechnician, QAManager, WarehouseLead]
    code: 200
    input: []
    output: CCPCheck
    side_effects: []
