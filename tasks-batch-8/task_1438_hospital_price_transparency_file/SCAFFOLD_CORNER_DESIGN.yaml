            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fs}", cycle_type: "ANNUAL", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cyfs: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fs}", publication_cycle_id: "${cyfs}", service_item_id: "${ifs}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { rfs: $.data.id } }
