              payload: { tower_id: "${t2_id}", master_lease_agreement_id: "${mla_e_id}", requested_elevation_bottom_ft: 100, requested_elevation_top_ft: 140, requested_ground_space_sqft: 400 }
              as: Tenant
              as_user_id: "${te_id}"
              captures: { app_q_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${app_q_id}/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "QX-80", quantity: 10, unit_weight_lbs: 80.01, wind_area_sqft: 0, mount_elevation_ft: 80 }
              as: Tenant
              as_user_id: "${te_id}"
              captures: { line_over_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${app_q_id}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${te_id}"
            - call: "GET /tower-colo/towers/${t2_id}"
              payload: {}
              as: StructuralEngineer
              as_user_id: "eng-1"
              captures: { t2_v1: $.data.version }
            - call: "POST /tower-colo/structural-analyses"
              payload: { colocation_application_id: "${app_q_id}", variant: "PRELIMINARY", expected_tower_version: "${t2_v1}" }
