  - section: cross_cutting_complexity_layers
    instances:
      - name: match_accept_stale_version_occ_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[match-accept-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Accepting a Match with expected_match_version one behind current (a counter bumped it) returns ERR_STALE_VERSION (412); match stays PROPOSED (post-counter state)."
        test_recipe:
          setup: ["A PROPOSED match created at version v0, then a counter+re-propose bump the version so the client's v0 is stale; all parties CLEARED so only OCC can fail."]
          setup_api_calls:
            - call: "POST /intended-parents"
              payload: { legal_name: "IP OCC", state_code: "CA", budget_cents: 6000000 }
              as: CaseManager
              captures: { ip_id: $.data.id }
            - call: "POST /intended-parents/${ip_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /intended-parents/${ip_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /intended-parents/${ip_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /intended-parents/${ip_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /carriers"
              payload: { legal_name: "Carrier OCC", state_code: "TX", prior_deliveries: 2, base_compensation_cents: 4000000 }
              as: CaseManager
              captures: { car_id: $.data.id }
            - call: "POST /carriers/${car_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /carriers/${car_id}/start-screening"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/set-psych"
              payload: { psych_clearance: "PASSED" }
              as: Screener
            - call: "POST /insurance-reviews"
              payload: { carrier_id: "${car_id}", policy_kind: "SURROGACY_FRIENDLY" }
              as: Screener
              captures: { ins_id: $.data.id }
            - call: "POST /insurance-reviews/${ins_id}/approve"
              payload: {}
              as: Screener
            - call: "POST /carriers/${car_id}/clear"
              payload: {}
              as: Screener
            - call: "POST /matches"
              payload: { intended_parent_id: "${ip_id}", carrier_id: "${car_id}", proposed_carrier_comp_cents: 4000000 }
              as: CaseManager
              captures: { match_id: $.data.id, mv0: $.data.version }
            - call: "POST /matches/${match_id}/counter"
              payload: { proposed_carrier_comp_cents: 4500000, expected_match_version: "${mv0}" }
              as: CaseManager
              captures: { mv1: $.data.version }
            - call: "POST /matches/${match_id}/re-propose"
              payload: { proposed_carrier_comp_cents: 4200000, expected_match_version: "${mv1}" }
              as: CaseManager
          trigger:
            - call: "POST /matches/${match_id}/accept"
              payload: { expected_match_version: "${mv0}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "Match.${match_id}.status == PROPOSED"

