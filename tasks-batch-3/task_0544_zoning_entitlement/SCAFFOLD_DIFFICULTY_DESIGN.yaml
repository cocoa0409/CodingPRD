  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_liability_restored_on_plat_vacate
        grounds:
          - calculations.parcel_assessed_fee_ledger
          - state_machines.Plat.RECORDED_to_VACATED
          - state_machines.ImpactFeeAssessment.PAID_to_VOIDED
          - entities.Parcel.fields.assessed_fee_cents
        distinguishing_aspect: "Conserved quantity = fee cents: recording adds final_fee_cents (2152500) to Parcel.assessed_fee_cents; vacating voids the paid assessment and restores Parcel.assessed_fee_cents to its pre-record value 0."
        test_recipe:
          setup:
            - "A SUBDIVISION application EFFECTIVE with a RECORDED plat (recorded 4 lots / 10 acres, final fee 2152500) whose assessment has been PAID; Parcel.assessed_fee_cents == 2152500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /parcels"
              payload: { apn: "APN-16", zoning_district: "RES", area_acres: 10, neighbor_parcel_count: 12, expanded_neighbor_count: 20, sensitive_area: false }
              as: Admin
              captures: { parcel_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "FY26", park_fee_per_lot_cents: 250000, road_fee_tier1_per_acre_cents: 120000, road_fee_tier2_per_acre_cents: 90000, road_fee_tier3_per_acre_cents: 60000, admin_pct: 0.05, affordable_discount_pct: 0.20, credit_pct: 0.10, fee_cap_cents: 10000000 }
              as: Admin
              captures: { fs_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Pia Dev", email: "pia@x.com" }
              as: Admin
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { application_type: "SUBDIVISION", parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", requested_use: "subdivide" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/completeness"
              payload: { determination: "COMPLETE" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${app_id}/notices"
              payload: { notice_kind: "MAILED" }
              as: Clerk
            - call: "POST /hearings"
              payload: { body: "PLANNING_COMMISSION", scheduled_date: "2026-06-11T00:00:00Z", agenda_capacity: 5 }
              as: Clerk
              captures: { hearing_id: $.data.id, h_v: $.data.version }
            - call: "POST /hearings/${hearing_id}/agenda-items"
              payload: { application_id: "${app_id}", expected_hearing_version: "${h_v}" }
              as: Clerk
              captures: { item_id: $.data.id }
            - call: "POST /agenda-items/${item_id}/decide"
              payload: { decision: "APPROVE", findings: [{ finding_code: "F-A", finding_text: "meets code", supports_approval: true }] }
              as: Commissioner
              as_user_id: "commish-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-17T00:00:00Z" }
              as: Admin
            - call: "POST /applications/${app_id}/effectuate"
              payload: {}
              as: Clerk
            - call: "POST /plats"
              payload: { application_id: "${app_id}", fee_schedule_id: "${fs_id}", declared_lot_count: 4, declared_gross_acres: 10 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { plat_id: $.data.id }
            - call: "POST /plats/${plat_id}/record"
              payload: { recorded_lot_count: 4, recorded_gross_acres: 10 }
              as: Clerk
            - call: "GET /plats/${plat_id}/impact-fee"
              as: Clerk
              captures: { fee_id: "$.data[0].id" }
            - call: "POST /impact-fees/${fee_id}/pay"
              payload: { amount_cents: 2152500 }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /plats/${plat_id}/vacate"
              payload: {}
              as: Clerk
              captures: { pst: $.data.status }
          assert:
            - "ImpactFeeAssessment.${fee_id}.status == VOIDED"
            - "Parcel.${parcel_id}.assessed_fee_cents == 0"
            - "EntitlementApplication.${app_id}.status == EFFECTIVE"
            - "Parcel.${parcel_id}.status == ENTITLED"

      - name: agenda_slots_restored_on_withdraw
        grounds:
          - entities.Hearing.fields.agenda_slots_remaining
