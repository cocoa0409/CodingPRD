# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# task_0577_event_ticketing
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: buyer_create_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Buyer.fields.name, entities.Buyer.fields.email]
        distinguishing_aspect: "POST /buyers with name+email returns 201 with a server-minted id, credit_balance_cents==0, and version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /buyers", payload: { name: "Ada", email: "ada@x.com" }, as: BoxOffice, captures: { b: $.data.id, credit: $.data.credit_balance_cents, v: $.data.version } }
          assert:
            - "response status == 201"
            - "Buyer.${b}.credit_balance_cents == 0"
            - "Buyer.${b}.version == 1"

      - name: buyer_create_missing_required_email_returns_validation
        claim_type: Required Fields
        grounds: [entities.Buyer.fields.email]
        distinguishing_aspect: "POST /buyers omitting the required email field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /buyers", payload: { name: "NoEmail" }, as: BoxOffice, captures: { err: $.data.error_id } }
          assert:
            - "response status == 400"
            - "error_id == ERR_VALIDATION"

      - name: event_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /events/{id} for an unknown UUID returns ERR_EVENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /events/00000000-0000-4000-8000-000000000000", payload: {}, as: BoxOffice, captures: { err: $.data.error_id } }
          assert:
            - "response status == 404"
            - "error_id == ERR_EVENT_NOT_FOUND"

      - name: seat_current_face_defaults_to_base_when_low_demand
        claim_type: Computed Fields
        grounds: [entities.Seat.fields.current_face_value_cents, calculations.dynamic_seat_price]
        distinguishing_aspect: "With dynamic pricing enabled but pct_sold==0 (<50 tier), a base-10000 seat reads current_face_value_cents==10000 (multiplier 1.00)."
        test_recipe:
          setup: ["Event DRAFT, one dynamic base-10000 seat, no sales."]
          setup_api_calls:
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 10000, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: true }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
          trigger:
            - { call: "GET /seats/${s1}", payload: {}, as: BoxOffice, captures: { face: $.data.current_face_value_cents } }
          assert:
            - "Seat.${s1}.current_face_value_cents == 10000"
            - "Seat.${s1}.status == AVAILABLE"

      - name: seats_list_returns_paginated_envelope
        claim_type: Listing
        grounds: [entities.Seat.fields.status]
        distinguishing_aspect: "GET /seats?event_id=<ev> returns a Seat[] with pagination fields total_count and has_more in the response envelope."
        test_recipe:
          setup: ["Event with two seats."]
          setup_api_calls:
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "2" }, as: BoxOffice, captures: { s2: $.data.id } }
          trigger:
            - { call: "GET /seats?event_id=${ev}", payload: {}, as: BoxOffice, captures: { first: "$.data[0].id" } }
          assert:
            - "response envelope meta.total_count == 2 and meta.has_more == false"
            - "response_type == array"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: event_cancel_twice_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Event.transitions.to_CANCELED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second CANCELED transition on an already-CANCELED (terminal) event returns ERR_INVALID_STATE with no further cascades."
        test_recipe:
          setup: ["Event created then CANCELED from DRAFT."]
          setup_api_calls:
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "CANCELED" }, as: Promoter, as_user_id: "prm_1" }
          trigger:
            - { call: "POST /events/${ev}/status", payload: { target_status: "CANCELED" }, as: Promoter, as_user_id: "prm_1", captures: { err: $.data.error_id } }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: hold_release_when_converted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Hold.transitions.ACTIVE_to_RELEASED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Releasing a CONVERTED hold (its order was paid) is rejected with ERR_INVALID_STATE; only ACTIVE holds may be released."
        test_recipe:
          setup: ["Paid 1-seat order, so its hold is CONVERTED."]
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b}" }
          trigger:
            - { call: "POST /holds/${h}/release", payload: {}, as: Buyer, as_user_id: "${b}", captures: { err: $.data.error_id } }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: refund_reject_then_approve_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RefundRequest.transitions.REQUESTED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a REJECTED (terminal) refund request returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Paid 1-seat order with a refund request that was REJECTED."]
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b}" }
            - { call: "GET /orders/${o}", payload: {}, as: Buyer, as_user_id: "${b}", captures: { ov: $.data.version } }
            - { call: "POST /orders/${o}/refund-requests", payload: { reason: "CUSTOMER_REQUEST", refund_destination: "ORIGINAL", expected_order_version: "${ov}" }, as: Buyer, as_user_id: "${b}", captures: { rr: $.data.id } }
            - { call: "POST /refund-requests/${rr}/reject", payload: {}, as: BoxOffice }
          trigger:
            - { call: "POST /refund-requests/${rr}/approve", payload: {}, as: BoxOffice, captures: { err: $.data.error_id } }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: transfer_accept_by_non_recipient_cannot
        claim_type: Precondition Enforcement
        grounds: [state_machines.TicketTransfer.transitions.INITIATED_to_ACCEPTED, "validations[priority=2]"]
        distinguishing_aspect: "A Buyer who is not the transfer's to_buyer_id cannot accept it; the server returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["B1 holds a ticket and initiates a GIFT transfer to B2; a third buyer B3 exists."]
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B1", email: "b1@x.com" }, as: BoxOffice, captures: { b1: $.data.id } }
            - { call: "POST /buyers", payload: { name: "B2", email: "b2@x.com" }, as: BoxOffice, captures: { b2: $.data.id } }
            - { call: "POST /buyers", payload: { name: "B3", email: "b3@x.com" }, as: BoxOffice, captures: { b3: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b1}" }, as: Buyer, as_user_id: "${b1}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b1}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b1}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b1}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b1}" }
            - { call: "GET /tickets", payload: {}, as: Buyer, as_user_id: "${b1}", captures: { t1: "$.data[0].id" } }
            - { call: "POST /transfers", payload: { ticket_id: "${t1}", to_buyer_id: "${b2}", kind: "GIFT" }, as: Buyer, as_user_id: "${b1}", captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /transfers/${tr}/accept", payload: {}, as: Buyer, as_user_id: "${b3}", captures: { err: $.data.error_id } }
          assert:
            - "response status == 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: deliver_already_delivered_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Ticket.transitions.deliver, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Delivering a ticket whose delivery_status is already DELIVERED (MOBILE auto-delivered at pay) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Paid MOBILE 1-seat order; its ticket is already DELIVERED."]
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b}" }
            - { call: "GET /tickets", payload: {}, as: Buyer, as_user_id: "${b}", captures: { t1: "$.data[0].id" } }
          trigger:
            - { call: "POST /tickets/${t1}/deliver", payload: {}, as: BoxOffice, captures: { err: $.data.error_id } }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: refund_partial_then_full_order_status_progression
        claim_type: Correct Result
        grounds: [calculations.refund_balance, entities.Order.fields.refunded_amount_cents, state_machines.Order.transitions.PARTIALLY_REFUNDED]
        distinguishing_aspect: "For a 2-ticket order (face 9990 each), refunding one ticket moves the order to PARTIALLY_REFUNDED with refunded_amount_cents==9990; refunding the second moves it to REFUNDED with refunded_amount_cents==19980."
        test_recipe:
          setup: ["Paid 2-seat MOBILE order; two VALID tickets face 9990 each."]
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "2" }, as: BoxOffice, captures: { s2: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}", "${s2}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b}" }
            - { call: "GET /tickets?order_id=${o}", payload: {}, as: Buyer, as_user_id: "${b}", captures: { t1: "$.data[0].id", t2: "$.data[1].id" } }
            - { call: "GET /orders/${o}", payload: {}, as: Buyer, as_user_id: "${b}", captures: { ov1: $.data.version } }
            - { call: "POST /orders/${o}/refund-requests", payload: { reason: "CUSTOMER_REQUEST", refund_destination: "ORIGINAL", expected_order_version: "${ov1}", ticket_ids: ["${t1}"] }, as: Buyer, as_user_id: "${b}", captures: { rr1: $.data.id } }
            - { call: "POST /refund-requests/${rr1}/approve", payload: {}, as: BoxOffice }
            - { call: "GET /orders/${o}", payload: {}, as: Buyer, as_user_id: "${b}", captures: { ov2: $.data.version } }
          trigger:
            - { call: "POST /orders/${o}/refund-requests", payload: { reason: "CUSTOMER_REQUEST", refund_destination: "ORIGINAL", expected_order_version: "${ov2}", ticket_ids: ["${t2}"] }, as: Buyer, as_user_id: "${b}", captures: { rr2: $.data.id } }
            - { call: "POST /refund-requests/${rr2}/approve", payload: {}, as: BoxOffice }
            - { call: "GET /orders/${o}", payload: {}, as: Buyer, as_user_id: "${b}", captures: { fin_status: $.data.status, fin_ref: $.data.refunded_amount_cents } }
          assert:
            - "after first refund: Order.${o}.status == PARTIALLY_REFUNDED and Order.${o}.refunded_amount_cents == 9990"
            - "after second refund: Order.${o}.status == REFUNDED and Order.${o}.refunded_amount_cents == 19980"

      - name: seat_price_dynamic_disabled_equals_base
        claim_type: Constants Applied
        grounds: [calculations.dynamic_seat_price, entities.PriceLevel.fields.dynamic_pricing_enabled]
        distinguishing_aspect: "When dynamic_pricing_enabled==false the multiplier is pinned to 1.00 regardless of pct_sold, so current_face_value_cents==base_face_value_cents==9990 even after a sale raises pct_sold."
        test_recipe:
          setup: ["Dynamic-off base-9990 level, 2 seats, 1 sold (pct_sold 50)."]
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
