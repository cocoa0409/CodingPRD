              captures: { s9_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (assignment not ACTIVE, priority 6 beats priority 15)"

      - name: business_safety_vs_business_referential
        grounds:
          - validations[priority=7]
          - validations[priority=13]
        distinguishing_aspect: |
          Pair: business_safety (priority 7, ERR_PERMIT_REQUIRED) vs
          business_referential (priority 13, ERR_BOOTH_NO_LONGER_AVAILABLE).
          Energizing a PROPANE hookup without a permit while the booth has been
          reserved by another assignment: safety error wins.
        test_recipe:
          setup:
