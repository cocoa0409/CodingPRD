  - rule_id: priority_pair_validation_conflict
    instances:
      - name: conflict_state_beats_temporal_on_report_submit
        grounds:
          - validations.priority_7_ERR_LICENSE_NOT_ACTIVE
          - validations.priority_12_ERR_REPORT_PERIOD_OVERLAP
          - state_machines.PerformanceReport.REJECTED_to_DRAFT
          - state_machines.License.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Error-category pair (state, business_temporal): priority 7 ERR_LICENSE_NOT_ACTIVE must beat
          priority 12 ERR_REPORT_PERIOD_OVERLAP on the same POST .../submit call. Reaching the
          double violation needs the REJECTED -> DRAFT bounce: report B is rejected, which frees its
          period so report C can be created over the same interval, and adding a setlist entry to B
          returns B to DRAFT so that B and C now collide. Suspending L1 layers the state failure on
          top. Removing the suspension exposes the lower-priority error on an otherwise identical call.
        test_recipe:
          setup:
            - "License L1 of Venue V1 is ACTIVE with annual_fee_cents 90017 and outstanding_balance_cents 90017"
            - "Report B for 2026-09-01 to 2026-10-01 was submitted and then REJECTED with rejection_reason INCOMPLETE_SETLIST"
            - "Report C was then created for exactly the same period (legal, because a REJECTED report is outside the overlap set)"
