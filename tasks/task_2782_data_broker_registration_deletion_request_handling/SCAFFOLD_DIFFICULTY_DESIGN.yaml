          buffered exclusion zone ends at 2028-08-31 plus 30 days = 2028-09-30. A new entry
          starting exactly on 2028-09-30 must be refused because the conflict test is
          `window_start <= other.window_end + 30d`, an inclusive comparison; starting one day
