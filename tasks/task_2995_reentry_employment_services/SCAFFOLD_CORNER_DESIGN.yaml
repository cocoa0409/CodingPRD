      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: WORK_HISTORY
        as: CaseManager
        as_user_id: cm-1
      - call: GET /participants/${p1_id}
        as: CaseManager
        as_user_id: cm-1
