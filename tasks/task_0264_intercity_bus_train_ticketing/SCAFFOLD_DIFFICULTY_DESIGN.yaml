          assert:
            - "immediately after /confirm, Booking.${b_id}.booking_status == CONFIRMED AND payment_status == UNPAID (axes independent)"
            - "after /pay, Booking.${b_id}.payment_status == PAID AND booking_status remains CONFIRMED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: service_date_cancel_depth3_cash_refund
        grounds:
          - state_machines.ServiceDate.lifecycle.SCHEDULED_to_CANCELLED
          - state_machines.Booking.booking_status.CONFIRMED_to_CANCELLED
          - state_machines.Ticket.state.ISSUED_to_VOID
          - state_machines.Booking.payment_status.PAID_to_REFUNDED
        distinguishing_aspect: |
          DEPTH-3 cascade from /service-dates/{id}/cancel: (hop1) ServiceDate CANCELLED force-cancels
          the Booking; (hop2) the cancelled Booking RELEASES its leg; (hop3) the released leg's Ticket
          is VOIDed AND a full CASH RefundCreditNote (penalty 0) is created. Each hop is caused by the
          prior, not directly by the cancel action.
        test_recipe:
          setup:
            - "Operator; PUBLISHED route; ServiceDate seats_total=10 base 4000 departure 2026-06-15; ECONOMY OPEN refundable class."
            - "Passenger P confirms+pays a single-leg booking (Ticket ISSUED, payment PAID, total_paid 3600)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN", refundable: true }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat Rider", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v}" }
              as: Passenger
              as_user_id: "${p_id}"
            - call: "POST /v1/bookings/${b_id}/pay"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /v1/service-dates/${sd_id}/cancel"
              payload: {}
              as: ScheduleManager
          assert:
            - "ServiceDate.${sd_id}.lifecycle == CANCELLED (hop1 origin)"
            - "Booking.${b_id}.booking_status == CANCELLED (hop1) and its BookingLeg.leg_state == RELEASED (hop2)"
            - "the booking's Ticket.state == VOID (hop3) and Booking.${b_id}.payment_status == REFUNDED with a CASH RefundCreditNote net_cents == 3600 (penalty 0)"
            - "ServiceDate.${sd_id}.seats_sold == 0 after the cascade releases the seat"

      - name: booking_confirm_depth2_ledger_and_ticket
        grounds:
          - state_machines.Booking.booking_status.HELD_to_CONFIRMED
          - calculations.seat_inventory
          - state_machines.Ticket.state.ISSUED_to_VOID
          - entities.ServiceDate.fields.seats_sold
        distinguishing_aspect: |
          DEPTH-2 cascade from a DIFFERENT trigger (/bookings/{id}/confirm vs the depth-3 cancel above):
          (hop1) confirm moves the ServiceDate seat held->sold and recomputes load_factor; (hop2) that
          inventory change is the basis on which the per-leg Ticket is issued. Distinct propagation
          pattern and origin from instance 1.
        test_recipe:
          setup:
            - "Operator; PUBLISHED route; ServiceDate seats_total=10 base 4000; ECONOMY OPEN class; passenger P with a HELD single-leg booking (seats_held=1, seats_sold=0)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
