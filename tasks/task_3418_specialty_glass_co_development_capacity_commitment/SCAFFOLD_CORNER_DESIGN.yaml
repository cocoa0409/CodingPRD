            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c1_id: $.data.id } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 6000, required_units: 6000, prepayment_cents: 3000000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { err: $.data.error_id } }
