      - name: corner_calc_time_bonus_threshold_is_inclusive_at_exact_second
        claim_type: threshold
        grounds:
          - calculations.bonus_determination
          - entities.PurseLine.fields.threshold_seconds
        distinguishing_aspect: >-
          A TIME_BONUS line pays when official_seconds is at or under threshold_seconds, so a
          finisher exactly on 7600 against a 7600 threshold collects the bonus while 7601 collects
          nothing — and with a 5,000,000 cap the bonus is paid in full, isolating the threshold from
          the headroom clamp.
        test_recipe:
          setup:
            - "Edition with bonus_pool_cap_cents 5,000,000, no course records, an ELITE MALE OVERALL place-1 line of 1,000,000 and a place-2 line of 600,000, plus an ELITE MALE TIME_BONUS line of 400,000 at threshold_seconds 7600."
