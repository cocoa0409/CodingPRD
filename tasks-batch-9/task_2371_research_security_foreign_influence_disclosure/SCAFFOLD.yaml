      - { name: project_id, type: string, source: input, description: "FK -> Project.id; nullable when the trip is not charged to a project", default: null }
      - { name: host_organization_id, type: string, source: input, description: "FK -> ForeignOrganization.id; nullable when there is no foreign host", default: null }
      - { name: destination_country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 destination", constraints: "exactly 2 uppercase letters" }
      - { name: depart_on, type: datetime, source: input, description: "Departure instant; the closed interval [depart_on, return_on] occupies the investigator" }
      - { name: return_on, type: datetime, source: input, description: "Return instant; must be >= depart_on" }
      - { name: purpose, type: enum, source: input, description: "CONFERENCE | COLLABORATION | TEACHING | RECRUITMENT" }
      - { name: carries_institutional_device, type: boolean, source: input, description: "Whether the traveller intends to carry an institutional device", default: true }
      - { name: risk_flag_count, type: integer, source: computed, description: "0..4 risk flags feeding the device tier; see calculations.travel_device_requirement" }
      - { name: device_requirement_tier, type: enum, source: computed, description: "NONE | STANDARD | LOANER_REQUIRED | LOANER_PLUS_ESCORT" }
      - { name: briefing_required, type: boolean, source: computed, description: "Whether a FOREIGN_TRAVEL_BRIEF completion is required before approval" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED | CANCELLED | COMPLETED" }
      - { name: device_decision_recorded_at, type: datetime, source: system, description: "Logical-clock instant the device tier was locked in at approval", default: null }

  - name: ControlledAccessGrant
