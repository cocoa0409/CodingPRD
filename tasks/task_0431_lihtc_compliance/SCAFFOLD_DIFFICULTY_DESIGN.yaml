# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0431 LIHTC
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances.
#
# Canonical literals (project AMI = 96,000.00 -> 9_600_000 cents):
#   Unit AMI_50 br1 ua9000:  income_limit=3_840_000  net_max_rent=87_000  over140=5_376_000
#   Unit AMI_60 br2 ua12500: income_limit=5_184_000  net_max_rent=117_100 over140=7_257_600
#   Building B (eligible_basis 100_000_000, NINE_PERCENT, 10 units, 10000 sqft, 1000 each):
#     1 LI unit -> af 0.1000 qb 10_000_000 credit 900_000
#     2 LI units-> af 0.2000 qb 20_000_000 credit 1_800_000
#   8609 dual-variant (8 designated of 10 units; monthly [2,2,4,4,6,6,8,8,8,8,8,8]):
#     PROVISIONAL fraction 0.8000 credit 7_200_000 ; FINAL fraction 0.6000 credit 5_400_000
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: first_year_credit_provisional_vs_final_on_building
        grounds:
          - calculations.first_year_credit_dual_variant
          - state_machines.Building.PRE_ALLOCATION_to_PROVISIONAL_8609
          - state_machines.Building.PROVISIONAL_8609_to_FINAL_8609
          - entities.Building.fields.annual_credit_cents
        distinguishing_aspect: |
          On the SAME Building (entity domain: Building credit), the forward-looking PROVISIONAL
          fraction (all 8 designated units full-year) yields annual_credit_cents=7200000 while the
          chronological FINAL fraction (average of 12 month-end snapshots) yields 5400000 — same data,
          two algorithms, different credit.
        test_recipe:
          setup:
            - "Project P (AMI 9_600_000, FORTY_SIXTY) in SET_ASIDE_MET; Building B (eligible_basis 100_000_000, NINE_PERCENT, 10 units, 10000 sqft); B has 8 designated low-income units, B in PRE_ALLOCATION."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U2", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U3", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U4", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U5", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U6", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U7", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U8", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /projects/${p_id}/certify-set-aside"
              payload: {}
              as: StateHFA
          trigger:
            - call: "POST /buildings/${b_id}/form8609"
              payload: { issuance_type: "PROVISIONAL" }
              as: StateHFA
              captures: { prov_form_id: $.data.id }
            - call: "GET /buildings/${b_id}"
              payload: {}
              as: StateHFA
              captures: { b_v: $.data.version }
            - call: "POST /buildings/${b_id}/form8609"
              payload: { issuance_type: "FINAL", monthly_qualified_units: [2,2,4,4,6,6,8,8,8,8,8,8], expected_building_version: "${b_v}" }
              as: StateHFA
              captures: { final_form_id: $.data.id }
          assert:
            - "Form8609.${prov_form_id}.issuance_type == PROVISIONAL"
            - "Form8609.${prov_form_id}.allocated_fraction == 0.8000"
            - "Form8609.${prov_form_id}.allocated_annual_credit_cents == 7200000"
            - "Form8609.${final_form_id}.issuance_type == FINAL"
            - "Form8609.${final_form_id}.allocated_fraction == 0.6000"
            - "Form8609.${final_form_id}.allocated_annual_credit_cents == 5400000"
            - "Building.${b_id}.annual_credit_cents == 5400000"

      - name: income_eligibility_initial_limit_vs_recert_140_threshold
        grounds:
          - calculations.over_income_threshold
          - validations[priority=8]
          - state_machines.Certification.DRAFT_to_SUBMITTED
          - entities.Certification.fields.is_over_income
        distinguishing_aspect: |
          On the Certification/Unit domain (different from Building credit), the SAME annual income
          5_000_000 is judged against two valid thresholds: an INITIAL cert compares to the 100%
          income limit (3_840_000) and FAILS (ERR_INCOME_OVER_LIMIT), whereas a RECERT compares to the
          140% threshold (5_376_000) and PASSES with is_over_income=false.
        test_recipe:
          setup:
            - "Project P, Building B, Unit U1 (AMI_50, br1, ua9000, income_limit 3_840_000, over140 5_376_000); Household H1 (non-student); an APPROVED INITIAL cert at income 3_000_000 made U1 QUALIFIED so a RECERT is valid."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
              captures: { u1_id: $.data.id }
            - call: "POST /households"
              payload: { project_id: "${p_id}", head_name: "H1", household_size: 2, all_full_time_students: false }
              as: OwnerAgent
              captures: { h1_id: $.data.id }
            - call: "POST /certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u1_id}", cert_type: "INITIAL", annual_income_cents: 3000000, effective_date: "2026-01-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c0_id: $.data.id }
            - call: "POST /certifications/${c0_id}/submit"
              payload: {}
              as: OwnerAgent
            - call: "POST /certifications/${c0_id}/approve"
              payload: { decision: "APPROVE" }
              as: StateHFA
            - call: "POST /certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u1_id}", cert_type: "INITIAL", annual_income_cents: 5000000, effective_date: "2026-02-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c_init_id: $.data.id }
            - call: "POST /certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u1_id}", cert_type: "RECERT", annual_income_cents: 5000000, effective_date: "2027-01-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c_recert_id: $.data.id }
          trigger:
            - call: "POST /certifications/${c_init_id}/submit"
              payload: {}
              as: OwnerAgent
              captures: { init_err: $.data.error_id }
            - call: "POST /certifications/${c_recert_id}/submit"
              payload: {}
              as: OwnerAgent
              captures: { recert_status: $.data.status }
          assert:
            - "POST submit on c_init_id (INITIAL, income 5000000 > limit 3840000) returns 422 ERR_INCOME_OVER_LIMIT"
            - "POST submit on c_recert_id (RECERT, income 5000000 <= over140 5376000) returns 200"
            - "Certification.${c_recert_id}.status == SUBMITTED"
            - "Certification.${c_recert_id}.over_income_threshold_cents == 5376000"
            - "Certification.${c_recert_id}.is_over_income == false"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: applicable_fraction_min_of_two_fractions_then_tiered_credit
        grounds:
          - calculations.building_applicable_fraction_and_credit
          - entities.Building.fields.applicable_fraction
          - entities.Building.fields.qualified_basis_cents
          - entities.Building.fields.annual_credit_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — applicable_fraction = min(unit_fraction,
          floor_space_fraction) drives qualified_basis = floor(eligible_basis * fraction), then a tiered
          credit_bp selection (NINE_PERCENT->900) yields annual_credit. With li_units=2 of 10 and
          li_sqft=2000 of 10000 the unit fraction (0.2000) binds and credit=1800000.
        test_recipe:
          setup:
            - "Project P SET_ASIDE_MET; Building B (eligible_basis 100_000_000, NINE_PERCENT, 10 units, 10000 sqft); two AMI_50 br1 units U1,U2 each 1000 sqft both QUALIFIED via approved INITIAL certs."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
              captures: { u1_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U2", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
              captures: { u2_id: $.data.id }
            - call: "POST /households"
              payload: { project_id: "${p_id}", head_name: "H1", household_size: 2, all_full_time_students: false }
              as: OwnerAgent
              captures: { h1_id: $.data.id }
            - call: "POST /households"
              payload: { project_id: "${p_id}", head_name: "H2", household_size: 2, all_full_time_students: false }
              as: OwnerAgent
              captures: { h2_id: $.data.id }
            - call: "POST /certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u1_id}", cert_type: "INITIAL", annual_income_cents: 3000000, effective_date: "2026-01-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c1_id: $.data.id }
            - call: "POST /certifications/${c1_id}/submit"
              payload: {}
              as: OwnerAgent
            - call: "POST /certifications/${c1_id}/approve"
              payload: { decision: "APPROVE" }
              as: StateHFA
            - call: "POST /certifications"
              payload: { household_id: "${h2_id}", unit_id: "${u2_id}", cert_type: "INITIAL", annual_income_cents: 3000000, effective_date: "2026-01-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c2_id: $.data.id }
            - call: "POST /certifications/${c2_id}/submit"
              payload: {}
              as: OwnerAgent
          trigger:
            - call: "POST /certifications/${c2_id}/approve"
              payload: { decision: "APPROVE" }
              as: StateHFA
          assert:
            - "Building.${b_id}.applicable_fraction == 0.2000"
            - "Building.${b_id}.qualified_basis_cents == 20000000"
            - "Building.${b_id}.annual_credit_cents == 1800000"

      - name: rent_ceiling_nested_floor_order_income_then_thirty_then_twelve
        grounds:
          - calculations.unit_income_and_rent_limits
          - entities.Unit.fields.income_limit_cents
          - entities.Unit.fields.gross_rent_ceiling_cents
          - entities.Unit.fields.net_max_rent_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned — floor the income limit FIRST
          (floor(9_600_000*0.60*0.90)=5_184_000), THEN floor the 30%/12 derivation
          (floor(5_184_000*0.30/12)=129_600), THEN subtract the utility allowance (-12500 -> 117_100).
          Computing 30%/12 against an unfloored income would drift the cents.
        test_recipe:
          setup:
            - "Project P (AMI 9_600_000); Building B; create Unit U2 (AMI_60, br2, ua 12500)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U2", bedroom_count: 2, sqft: 1000, utility_allowance_cents: 12500, ami_designation: "AMI_60" }
              as: OwnerAgent
              captures: { u2_id: $.data.id }
          assert:
            - "Unit.${u2_id}.income_limit_cents == 5184000"
            - "Unit.${u2_id}.gross_rent_ceiling_cents == 129600"
            - "Unit.${u2_id}.net_max_rent_cents == 117100"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: unit_li_status_cycle_qualified_over_income_qualified
        grounds:
          - state_machines.Unit.QUALIFIED_to_OVER_INCOME
          - state_machines.Unit.OVER_INCOME_to_QUALIFIED
          - entities.Unit.fields.li_status
        distinguishing_aspect: |
          The Unit li_status machine is cyclic: QUALIFIED->OVER_INCOME (RECERT over-income) and back
          OVER_INCOME->QUALIFIED (later RECERT no longer over-income) on the same Unit entity — a true
          A<->B loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Unit U2 (AMI_60 br2, income_limit 5_184_000, over140 7_257_600) QUALIFIED via approved INITIAL cert for Household H1."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U2", bedroom_count: 2, sqft: 1000, utility_allowance_cents: 12500, ami_designation: "AMI_60" }
              as: OwnerAgent
              captures: { u2_id: $.data.id }
            - call: "POST /households"
              payload: { project_id: "${p_id}", head_name: "H1", household_size: 3, all_full_time_students: false }
              as: OwnerAgent
              captures: { h1_id: $.data.id }
            - call: "POST /certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u2_id}", cert_type: "INITIAL", annual_income_cents: 4000000, effective_date: "2026-01-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c_init_id: $.data.id }
            - call: "POST /certifications/${c_init_id}/submit"
              payload: {}
              as: OwnerAgent
            - call: "POST /certifications/${c_init_id}/approve"
              payload: { decision: "APPROVE" }
              as: StateHFA
            - call: "POST /certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u2_id}", cert_type: "RECERT", annual_income_cents: 8000000, effective_date: "2027-01-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c_over_id: $.data.id }
            - call: "POST /certifications/${c_over_id}/submit"
              payload: {}
              as: OwnerAgent
            - call: "POST /certifications/${c_over_id}/approve"
              payload: { decision: "APPROVE" }
              as: StateHFA
            - call: "POST /certifications"
              payload: { household_id: "${h1_id}", unit_id: "${u2_id}", cert_type: "RECERT", annual_income_cents: 6000000, effective_date: "2028-01-15T00:00:00Z" }
              as: OwnerAgent
              captures: { c_back_id: $.data.id }
            - call: "POST /certifications/${c_back_id}/submit"
              payload: {}
              as: OwnerAgent
          trigger:
            - call: "POST /certifications/${c_back_id}/approve"
              payload: { decision: "APPROVE" }
              as: StateHFA
          assert:
            - "After c_over_id approval (income 8000000 > over140 7257600) Unit.${u2_id}.li_status was OVER_INCOME"
            - "After c_back_id approval (income 6000000 <= over140 7257600) Unit.${u2_id}.li_status == QUALIFIED"
            - "Unit.${u2_id}.is_low_income_counted == true throughout the cycle"

      - name: building_credit_branch_revert_final_to_provisional
        grounds:
          - state_machines.Building.PROVISIONAL_8609_to_FINAL_8609
          - state_machines.Building.FINAL_8609_to_PROVISIONAL_8609
          - entities.Building.fields.credit_status
        distinguishing_aspect: |
          The Building credit machine branches and reverts: PROVISIONAL_8609->FINAL_8609 then
          FINAL_8609->PROVISIONAL_8609 (revoke-final) on a different entity (Building) than the cyclic
          Unit machine — a forward+rollback edge, not a linear pipeline.
        test_recipe:
          setup:
            - "Project P SET_ASIDE_MET; Building B with 8 designated units; B advanced to FINAL_8609 (provisional fraction 0.8000 then final fraction 0.6000)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U2", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U3", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U4", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U5", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U6", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U7", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U8", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /projects/${p_id}/certify-set-aside"
              payload: {}
              as: StateHFA
            - call: "POST /buildings/${b_id}/form8609"
              payload: { issuance_type: "PROVISIONAL" }
              as: StateHFA
            - call: "GET /buildings/${b_id}"
              payload: {}
              as: StateHFA
              captures: { b_v: $.data.version }
            - call: "POST /buildings/${b_id}/form8609"
              payload: { issuance_type: "FINAL", monthly_qualified_units: [2,2,4,4,6,6,8,8,8,8,8,8], expected_building_version: "${b_v}" }
              as: StateHFA
          trigger:
            - call: "POST /buildings/${b_id}/revoke-final"
              payload: {}
              as: StateHFA
              captures: { cs: $.data.credit_status }
          assert:
            - "Building.${b_id}.credit_status == PROVISIONAL_8609"
            - "Building.${b_id}.first_year_fraction == 0.8000"
            - "Building.${b_id}.annual_credit_cents == 7200000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: disqualify_unit_cascades_building_credit_then_project_posture
        grounds:
          - state_machines.Unit.OVER_INCOME_to_DISQUALIFIED
          - entities.Building.fields.annual_credit_cents
          - entities.Project.fields.open_finding_count
          - entities.Project.fields.posture
        distinguishing_aspect: |
          Depth-3 transitive chain from a single disqualify trigger: disqualify(Unit) -> Unit
          DISQUALIFIED -> that mutation recomputes Building.annual_credit_cents (from 900000 to 0)
          -> the created Finding bumps Project.open_finding_count (0->1) and flips Project.posture to
          AT_RISK (an OPEN, not-yet-reported finding). Each hop is caused by the previous, not by the
          original action.
        test_recipe:
          setup:
            - "Project P; Building B with one QUALIFIED unit U1 (af 0.1000, credit 900000); U1 made OVER_INCOME via an over-income RECERT; project posture COMPLIANT, open_finding_count 0."
          setup_api_calls:
            - call: "POST /projects"
