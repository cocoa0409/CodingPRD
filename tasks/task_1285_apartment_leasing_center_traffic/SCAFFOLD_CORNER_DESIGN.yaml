  # ===========================================================================
  - section: endpoints
    instances:
      - name: inquiries_list_paginates_with_envelope_fields
        claim_type: listing
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "Pagination envelope: with 3 inquiries, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the final row with has_more false. Defaults (limit 10) apply when params are omitted."
        test_recipe:
          setup: ["Property P; three inquiries created"]
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Page Place", code: "PG1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", contact_name: "P1", contact_email: "pg1@x.com", source: "WEB_FORM" }
              as: PropertyManager
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", contact_name: "P2", contact_email: "pg2@x.com", source: "PHONE" }
              as: PropertyManager
            - call: "POST /leasing/inquiries"
              payload: { property_id: "${p_id}", contact_name: "P3", contact_email: "pg3@x.com", source: "WALK_IN" }
              as: PropertyManager
          trigger:
            - call: "GET /leasing/inquiries?property_id=${p_id}&limit=2&offset=0"
              as: PropertyManager
            - call: "GET /leasing/inquiries?property_id=${p_id}&limit=2&offset=2"
              as: PropertyManager
          assert:
            - "first page: data length == 2, total_count == 3, has_more == true"
            - "second page: data length == 1, total_count == 3, has_more == false"
            - "response envelope contains meta.api_request_id and response_type == array"

