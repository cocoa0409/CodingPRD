# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: every testable §1.1–§1.7 claim not already covered by §1.8.
# Sections/claim_types drawn verbatim from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_yearbook_returns_201_with_derived_defaults
        claim_type: Creation
        grounds:
          - entities.Yearbook.fields.production_phase
          - endpoints
        distinguishing_aspect: "POST /yearbooks with all required fields → 201; production_phase=LADDER_BUILD, all derived counts/revenue=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id, v: $.data.version }
          assert:
            - "response status == 201"
            - "Yearbook.${yb}.production_phase == LADDER_BUILD"
            - "Yearbook.${yb}.ladder_filled_count == 0"
            - "Yearbook.${yb}.ad_revenue_cents == 0"
            - "Yearbook.${yb}.version == 1"

      - name: get_yearbook_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - endpoints
        distinguishing_aspect: "GET /yearbooks/{id} for a random non-existent UUID → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /yearbooks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_yearbook_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /yearbooks omitting target_page_count → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_yearbook_target_pages_not_divisible_by_four_invalid
        claim_type: Type Constraints
        grounds:
          - entities.Yearbook.fields.target_page_count
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "target_page_count=97 (not divisible by 4) → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 97, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_page_default_spread_span_one
        claim_type: Defaults
        grounds:
          - entities.LadderPage.fields.spread_span
        distinguishing_aspect: "POST /yearbooks/pages omitting spread_span → defaults to 1."
        test_recipe:
          setup: ["A yearbook exists."]
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
          trigger:
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 5, section: "ACADEMICS", template_code: "T" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pg: $.data.id }
          assert:
            - "response status == 201"
            - "LadderPage.${pg}.spread_span == 1"
            - "LadderPage.${pg}.status == DRAFT"

      - name: presale_personalize_without_stamp_name_invalid
        claim_type: Type Constraints
        grounds:
          - entities.PreSaleOrder.fields.stamp_name
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "personalize=true with empty/omitted stamp_name → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Yearbook, clock inside EARLY window."]
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
          trigger:
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "No Name", quantity: 1, personalize: true }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: list_yearbooks_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - response_envelope
        distinguishing_aspect: "GET /yearbooks returns array envelope with total_count and has_more."
        test_recipe:
          setup: ["One yearbook exists."]
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
          trigger:
            - call: "GET /yearbooks?limit=10&offset=0"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
          assert:
            - "response status == 200"
            - "response_type == array"
            - "meta.total_count >= 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_page_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.LadderPage.IN_REVIEW_to_APPROVED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Approving a DRAFT page (approve only defined from IN_REVIEW) → ERR_INVALID_STATE (409); page stays DRAFT."
        test_recipe:
          setup: ["Yearbook with a DRAFT page #1."]
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 1, section: "CLUBS", template_code: "T" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pg: $.data.id }
          trigger:
            - call: "POST /yearbooks/pages/${pg}/approve"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: submit_review_without_assigned_staff_returns_page_unassigned
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LadderPage.DRAFT_to_IN_REVIEW
          - "errors[ERR_PAGE_UNASSIGNED]"
        distinguishing_aspect: "submit-review on a page with no assigned_staff_id (required_submission_count=0) → ERR_PAGE_UNASSIGNED (409)."
        test_recipe:
          setup: ["Yearbook with an unassigned DRAFT page #1, required_submission_count=0."]
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 1, section: "CLUBS", template_code: "T", required_submission_count: 0 }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pg: $.data.id }
          trigger:
            - call: "POST /yearbooks/pages/${pg}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PAGE_UNASSIGNED"

      - name: submit_review_with_insufficient_submissions_returns_incomplete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LadderPage.DRAFT_to_IN_REVIEW
          - "errors[ERR_SUBMISSIONS_INCOMPLETE]"
        distinguishing_aspect: "submit-review on an assigned page with required_submission_count=1 and zero APPROVED submissions → ERR_SUBMISSIONS_INCOMPLETE (409)."
        test_recipe:
          setup: ["Yearbook + ACTIVE assignment; page #1 assigned, required_submission_count=1, no approved submissions."]
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/staff-assignments"
              payload: { yearbook_id: "${yb}", staff_user_id: "staff-9", role_title: "PHOTOGRAPHER", deadline_iso: "2026-06-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { sa: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 1, section: "CLUBS", template_code: "T", required_submission_count: 1, assigned_staff_id: "${sa}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pg: $.data.id }
          trigger:
            - call: "POST /yearbooks/pages/${pg}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SUBMISSIONS_INCOMPLETE"

      - name: submission_approve_increments_then_decrements_on_reject
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Submission.PENDING_to_APPROVED
          - state_machines.Submission.APPROVED_to_REJECTED
          - entities.LadderPage.fields.approved_submission_count
        distinguishing_aspect: "Approving a submission sets LadderPage.approved_submission_count=1; rejecting that approved submission (compensation) returns it to 0."
        test_recipe:
          setup: ["Yearbook + DRAFT page #1 with one PENDING submission."]
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 1, section: "CLUBS", template_code: "T" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pg: $.data.id }
            - call: "POST /yearbooks/submissions"
              payload: { ladder_page_id: "${pg}", kind: "QUOTE", contributor_id: "c-1", asset_ref: "Best year ever" }
              as: Contributor
              as_user_id: "c-1"
              captures: { sub: $.data.id }
            - call: "POST /yearbooks/submissions/${sub}/approve"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
          trigger:
            - call: "GET /yearbooks/pages/${pg}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { c_after_approve: $.data.approved_submission_count }
            - call: "POST /yearbooks/submissions/${sub}/reject"
              payload: { review_note: "changed mind" }
              as: Staff
              as_user_id: "staff-9"
            - call: "GET /yearbooks/pages/${pg}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { c_after_reject: $.data.approved_submission_count }
          assert:
            - "LadderPage.${pg}.approved_submission_count after approve == 1"
            - "LadderPage.${pg}.approved_submission_count after reject == 0"

      - name: reopen_locked_page_after_plant_returns_plant_frozen
        claim_type: guarded_transition
        grounds:
          - state_machines.LadderPage.LOCKED_to_CHANGES_REQUESTED
          - "errors[ERR_PLANT_FROZEN]"
        distinguishing_aspect: "request-changes on a LOCKED page (after a PLANT_SUBMITTED proof) → ERR_PLANT_FROZEN (409); the frozen-plant guard always rejects since a LOCKED page always has a plant proof."
        test_recipe:
          setup: ["target_page_count=4 yearbook, all 4 pages APPROVED, proof submitted to plant (pages now LOCKED)."]
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Tiny High", academic_year: "2025-2026", target_page_count: 4, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/staff-assignments"
              payload: { yearbook_id: "${yb}", staff_user_id: "staff-9", role_title: "EDITOR", deadline_iso: "2026-06-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { sa: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 1, section: "STUDENT_LIFE", template_code: "T", required_submission_count: 0, assigned_staff_id: "${sa}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { p1: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 2, section: "ACADEMICS", template_code: "T", required_submission_count: 0, assigned_staff_id: "${sa}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { p2: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 3, section: "CLUBS", template_code: "T", required_submission_count: 0, assigned_staff_id: "${sa}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { p3: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 4, section: "SIGNATURE", template_code: "T", required_submission_count: 0, assigned_staff_id: "${sa}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { p4: $.data.id }
            - call: "POST /yearbooks/pages/${p1}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
            - call: "POST /yearbooks/pages/${p1}/approve"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/pages/${p2}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
            - call: "POST /yearbooks/pages/${p2}/approve"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/pages/${p3}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
            - call: "POST /yearbooks/pages/${p3}/approve"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/pages/${p4}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
            - call: "POST /yearbooks/pages/${p4}/approve"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/proofs"
              payload: { yearbook_id: "${yb}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { proof: $.data.id }
            - call: "POST /yearbooks/proofs/${proof}/submit-plant"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
          trigger:
            - call: "POST /yearbooks/pages/${p1}/request-changes"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PLANT_FROZEN"

      - name: terminal_voided_ad_contract_cannot_sign
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AdContract.DRAFT_to_VOIDED
          - state_machines.AdContract.DRAFT_to_SIGNED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Signing a VOIDED (terminal) ad contract → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Yearbook with ADS page #2; AdContract created then VOIDED from DRAFT."]
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 2, section: "ADS", template_code: "T-AD" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pg: $.data.id }
            - call: "POST /yearbooks/ad-contracts"
              payload: { yearbook_id: "${yb}", ladder_page_id: "${pg}", sponsor_name: "Gone", size: "QUARTER" }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ad: $.data.id }
            - call: "POST /yearbooks/ad-contracts/${ad}/void"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
          trigger:
            - call: "POST /yearbooks/ad-contracts/${ad}/sign"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: plant_submit_with_incomplete_ladder_returns_ladder_incomplete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Proof.OPEN_to_PLANT_SUBMITTED
          - entities.Yearbook.fields.ladder_complete
          - "errors[ERR_LADDER_INCOMPLETE]"
        distinguishing_aspect: "submit-plant when ladder_filled_count(0) < target_page_count(4) → ERR_LADDER_INCOMPLETE (409)."
        test_recipe:
          setup: ["Yearbook target_page_count=4 with NO pages; an OPEN proof exists."]
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Tiny High", academic_year: "2025-2026", target_page_count: 4, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/proofs"
              payload: { yearbook_id: "${yb}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { proof: $.data.id }
          trigger:
            - call: "POST /yearbooks/proofs/${proof}/submit-plant"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_LADDER_INCOMPLETE"

      - name: cancel_paid_order_after_shipped_returns_already_distributed
        claim_type: guarded_transition
        grounds:
          - state_machines.PreSaleOrder.PAID_to_CANCELLED
          - "errors[ERR_ALREADY_DISTRIBUTED]"
        distinguishing_aspect: "Cancelling a PAID order after a print run reached SHIPPED → ERR_ALREADY_DISTRIBUTED (409)."
        test_recipe:
          setup: ["Yearbook, EARLY clock, a PAID order, and a SHIPPED print run."]
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id, yb_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "Late", quantity: 1 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ord: $.data.id }
            - call: "POST /yearbooks/presale-orders/${ord}/pay"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
            - call: "GET /yearbooks/${yb}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb_v_now: $.data.version }
            - call: "POST /yearbooks/print-runs"
              payload: { yearbook_id: "${yb}", quantity: 100, delivery_address: "1 School St", expected_yearbook_version: "${yb_v_now}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pr: $.data.id }
            - call: "POST /yearbooks/print-runs/${pr}/ship"
