      - name: corner_supplier_turnaround_rollup_counts_only_accepted_orders
        claim_type: Input Set Filtering
        grounds:
          - calculations.supplier_turnaround_score
          - calculations.supplier_turnaround_score.input_set
          - calculations.supplier_turnaround_score.constants
          - endpoints[POST /dme/custom-fab-orders/{id}/fabrication-events]
        distinguishing_aspect: "A late order that has been delivered to the clinic but not yet accepted already carries projected_turnaround_score 60 (100 - 4 points x 10 late days) on the order row, yet the Supplier rollup still reads turnaround_score 100 with accepted_fab_order_count 0; only the ACCEPT fitting-check moves the supplier average to 60 and the count to 1."
        test_recipe:
          setup:
            - "a HAND clinic with a CUSTOM_AND_OFF_SHELF fitter, a custom-fab-capable supplier promising 10 days, a CUSTOM_FABRICATED product and one fabrication order submitted at 2026-08-01; the clock is then moved to 2026-08-21, twenty days later"
