            - "${chk_total} == 2 with rows enumerated phase_number ASC: ${chk_pass_res} == PASS for phase 2, and ${chk_fail_res} == FAIL with ${chk_fail_reason} == PED_CLEAR_SHORT for phase 4 (10.0 < 17.8 decides before the walk and phase-length sub-checks are even considered)"
