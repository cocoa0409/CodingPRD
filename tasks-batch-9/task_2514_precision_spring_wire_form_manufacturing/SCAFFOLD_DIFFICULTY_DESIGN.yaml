  - rule_id: resource_temporal_overlap
    instances:

      - name: coiling_machine_half_open_windows_with_symmetric_changeover_buffer
        resource_entity: CoilingMachine
        interval_semantics: "HALF-OPEN [window_start, window_end) inflated on BOTH sides by changeover_buffer_minutes; a gap exactly equal to the buffer is legal, one minute less is not"
        grounds:
          - calculations.setup_window_conflict
          - validations[priority=67]
          - errors.ERR_SETUP_WINDOW_CONFLICT
          - entities.CoilingMachine.fields.changeover_buffer_minutes
          - endpoints["POST /machine-setups"]
        distinguishing_aspect: |
          The coiler books a SINGLE-OCCUPANCY resource under half-open semantics with a symmetric changeover buffer,
          so the conflict test is `new.start < existing.end + buffer AND existing.start < new.end + buffer`.
          The instance probes both sides of the same existing window: 29 minutes after it ends is a conflict while
          exactly 30 is legal, and a window that ends exactly 30 minutes BEFORE it starts is legal while one that
