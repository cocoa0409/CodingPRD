          A cascade whose fourth hop changes what a LATER request is allowed to
          do: ticket -> agreement SERVICE_SWAP_PENDING -> old unit IN_SERVICE and
          replacement unit ON_RENT -> Store.units_in_service_count 0 -> 1 ->
