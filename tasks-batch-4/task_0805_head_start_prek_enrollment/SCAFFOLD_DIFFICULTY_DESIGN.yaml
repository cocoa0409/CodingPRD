              as: Family
              as_user_id: "${fam2}"
            - call: "GET /enrollments?application_id=${app1}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { enr1: "$.data[0].id" }
            - call: "GET /enrollments?application_id=${app2}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { enr2: "$.data[0].id" }
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr1}", attendance_date: "2026-03-02", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr1}", attendance_date: "2026-03-03", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr1}", attendance_date: "2026-03-04", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
