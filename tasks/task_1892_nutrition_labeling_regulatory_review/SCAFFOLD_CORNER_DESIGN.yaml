      - name: err_content_revision_required_on_approve
        claim_type: error_triggerable
        grounds: ["errors[ERR_CONTENT_REVISION_REQUIRED]", entities.LabelVersion.fields.content_status]
        distinguishing_aspect: "After a lab revalidation cascade flips a claim to SUSPENDED, approving the label fails with ERR_CONTENT_REVISION_REQUIRED."
        test_recipe:
          setup: ["client, product, LOCKED recipe, lab1 VALIDATED, LAB panel, label IN_REVIEW with LOW_FAT ELIGIBLE; then lab2 VALIDATED (claim SUSPENDED, content NEEDS_REVISION)"]
