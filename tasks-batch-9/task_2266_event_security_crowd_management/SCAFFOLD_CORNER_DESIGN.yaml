  - name: lane_open_is_gated_by_event_state_then_by_operator_presence
    claim_type: conditional_action
    grounds:
    - endpoints[POST /event-security/screening-lanes/{id}/status]
    - state_machines.ScreeningLane.PLANNED_to_OPEN
    - validations[priority=12]
    - validations[priority=31]
    distinguishing_aspect: |
      OPEN is the clearest conditional action in §1.5: the same request is refused for two different reasons in a fixed order — the event must have reached BRIEFED (ERR_INVALID_STATE) before the operator-presence rule (ERR_LANE_UNSTAFFED) is even consulted. Observing the ORDER requires a fixture where both conditions are false at once, which is only reachable while the event is still STAFFED and nobody has checked in.
