              as: AgreementAdmin
              captures: { au14a_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Ben Oyelaran", email: "ben.oyelaran@uni.example", orcid: "0000-0006-7777-8888", department_code: "MET", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { au14b_id: $.data.id }
