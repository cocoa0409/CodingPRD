      - name: promo_once_per_schedule_evaluation_order_resolution
        grounds:
          - calculations.promo_compensation_cents
          - entities.CompensationPayment.fields.schedule_id
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — a payment's FINAL promo_cents depends
          on whether ANY FINALIZED payment with the same schedule_id already has
          promo_cents > 0, a set that conceptually includes the payment being computed.
          The scaffold pins the resolution order: completion order is chronological, so
          the FIRST of two checked-in visits to COMPLETE banks the 2000-cent promo and
          the SECOND gets 0 even though both PROVISIONAL payments showed 2000. With both
          visits checked in before either completes, provisional(A) == provisional(B) ==
          2000 but final(B) == 2000 and final(A) == 0 purely by completion order.
