            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "LOTB" }, captures: { b3: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "LOTC" }, captures: { cc1: "$.data.id" } }
