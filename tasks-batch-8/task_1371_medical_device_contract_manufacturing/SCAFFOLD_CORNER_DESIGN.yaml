  # ==================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_agreement_create_stale_supplier_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-create-stale-supplier]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Agreement creation is OCC-guarded on Supplier.version: a create carrying the pre-supersede version after a successful create is rejected 412; retrying with the fresh version succeeds and supersedes the first DRAFT."
        test_recipe:
          setup: ["supplier SUP-OCC1 at version 1"]
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-OCC1", name: "OCC One" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v1: "$.data.version" } }
          trigger:
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-OCC1-A", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v1}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_a: "$.data.id" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-OCC1-B", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v1}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { err_stale: "$.data.error_id" } }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_v2: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-OCC1-C", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v2}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_c: "$.data.id" } }
            - { call: "GET /api/quality-agreements/${agr_a}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_a_st: "$.data.status" } }
          assert:
            - "first create with expected version 1: 201 (supplier.version -> 2)"
            - "second create with the same (now stale) version: 412 error_id == ERR_STALE_VERSION"
            - "retry with fresh version 2: 201"
            - "QualityAgreement.${agr_a}.status == SUPERSEDED (create-supersede of the earlier DRAFT)"

      - name: occ_revision_create_stale_dmr_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[revision-create-stale-dmr]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Revision creation is OCC-guarded on the parent DMR version: after one revision is created (parent version advanced), a second create with the old expected version fails 412; with the fresh version it succeeds."
        test_recipe:
          setup: ["DMR DEV-OCC2 rev A APPROVED (version 2 after approval)"]
          setup_api_calls:
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-OCC2", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_a: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_a}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { a_v2: "$.data.version" } }
          trigger:
            - { call: "POST /api/device-master-records/${dmr_a}/revisions", payload: { revision_code: "B", shelf_life_claim_months: 24, sterile: true, expected_dmr_version: "${a_v2}" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_b: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_a}/revisions", payload: { revision_code: "C", shelf_life_claim_months: 30, sterile: true, expected_dmr_version: "${a_v2}" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { err_stale: "$.data.error_id" } }
            - { call: "GET /api/device-master-records/${dmr_a}", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { a_v3: "$.data.version" } }
            - { call: "POST /api/device-master-records/${dmr_a}/revisions", payload: { revision_code: "C", shelf_life_claim_months: 30, sterile: true, expected_dmr_version: "${a_v3}" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_c: "$.data.id" } }
          assert:
            - "revision B with expected version 2: 201 (parent A version -> 3)"
            - "revision C with the stale version 2: 412 error_id == ERR_STALE_VERSION"
            - "revision C with fresh version 3: 201, revision_seq == 2, parent_dmr_id == ${dmr_a}"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Supplier]
        distinguishing_aspect: "Supplier.version starts at 1 and increments by exactly 1 per mutation OF THE SUPPLIER: create(1) -> agreement create bumps the parent (2) -> agreement activate mutates only the agreement (supplier stays 2) -> qualify(3)."
        test_recipe:
          setup: ["supplier SUP-VM created"]
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-VM", name: "VM Co" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-VM", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${v1}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { v2: "$.data.version" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { v3: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { v4: "$.data.version" } }
          assert:
            - "version sequence observed on the Supplier: 1 -> 2 -> 2 -> 3 (agreement activate does not touch the supplier row; only supplier mutations bump its version)"

      - name: cascade_coverage_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.NonconformanceReport]
        excluded_because:
          difficulty_instance: ncr_supplier_fault_disposition_chain
          rationale: "N-level cascade ordering asserted end-to-end in the named §1.8 instance; SCN and CAPA cascade variants covered in endpoints section."

      - name: part_bucket_reconciliation_covered_by_difficulty
        claim_type: derived_field_reconciliation
        grounds: [entities.SupplierPart.fields.quantity_committed]
        excluded_because:
          difficulty_instance: part_quantity_mass_balance
          rationale: "Derived quantity buckets after create/delete/release/scrap asserted in the named §1.8 instance."

