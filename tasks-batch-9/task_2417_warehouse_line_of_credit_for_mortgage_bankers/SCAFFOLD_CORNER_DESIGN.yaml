              as_user_id: "ca_1"
          assert:
            - "setup: BaileeLetter for A1 has effective_from 2026-08-01T00:00:00Z and expires_at 2026-08-31T00:00:00Z with status ISSUED — no aging-run has run, so nothing expired it"
            - "setup: BaileeLetter.${bl2_id}.effective_from == 2026-09-05T00:00:00Z, expires_at == 2026-10-05T00:00:00Z, bailee_period_days == 30"
            - "purchasing ${a1_id} returns HTTP 409 with data.error_id == ERR_BAILEE_LETTER_REQUIRED — status ISSUED is necessary but not sufficient"
            - "Advance.${a1_id}.funding_status is still SHIPPED and outstanding_balance_cents is still 1960000000"
            - "purchasing ${ab2_id} returns HTTP 200 with funding_status == PURCHASED and outstanding_balance_cents == 0"
            - "BaileeLetter.${bl2_id}.status == HONORED while A1's letter is untouched at ISSUED"
            - "an INVESTOR_PROCEEDS CREDIT of 980000000 is appended for ${ab2_id}"
