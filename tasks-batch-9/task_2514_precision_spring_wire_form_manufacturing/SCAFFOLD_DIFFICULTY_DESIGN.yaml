            - "hop 2: ProductionRun.${run_id}.min_cpk_observed == 0.833 and min_ppk_observed == 1.571"
            - "hop 3: ShipmentLot.${lot_id}.lot_status == QUARANTINED and quarantine_reason == SPC_HOLD_CASCADE"
            - "hop 4: CustomerProgram.${prog_id}.quarantined_lot_count == 1, allocated_pieces == 0, open_commitment_pieces == 500000"
            - "hop 5: CustomerProgram.${prog_id}.delivery_posture == AT_RISK (an APPROVED package exists, so it is not BLOCKED)"
            - "CustomerProgram.${prog_id}.shipped_pieces == 0 and CustomerProgram.${prog_id}.version is unchanged by the cascade (only the quote endpoint writes version)"
            - "ShipmentLot.${lot_id}.extended_price_cents == 600000 and ShipmentLot.${lot_id}.unit_price_cents == 24 and tooling_amort_per_piece_cents == 4 (quote-time cap, not the tool's frozen 10)"
            - "ToolingAsset.${tool_id}.recovered_cents == 0 (a quarantine never touches the tooling ledger)"

      - name: ppap_approval_production_release_amortization_chain_four_hops
        cascade_depth: 4
        grounds:
          - state_machines.QualificationSubmission.SUBMITTED_to_APPROVED
          - state_machines.SpringDesign.PROTOTYPE_RELEASED_to_PRODUCTION_RELEASED
          - state_machines.ToolingAsset.PENDING_to_AMORTIZING
          - entities.CustomerProgram.fields.quote_frozen
          - calculations.program_delivery_posture
        distinguishing_aspect: |
          A different trigger (POST /qualification-submissions/{id}/review with decision APPROVE) drives a four-hop
          chain across a completely different entity path — submission -> design -> tooling -> program — and the
          third hop is FINANCIAL: reaching PRODUCTION_RELEASED is what freezes amort_per_piece_cents at
          ceil(4800000 / 500000) = 10 from committed_pieces, a number that did not exist anywhere in the system
          before the customer's verdict.
          The four-hop path shares no edge with spc_violation_quarantine_posture_chain_five_hops.
        test_recipe:
          setup:
            - "An AUTOMOTIVE_SAFETY program with committed_pieces 500000, a PROTOTYPE_RELEASED design D1, a PENDING 4800000-cent tool, and a quote already on file at 26000 pieces."
            - "A 26000-piece run of D1 with an ACCEPTED first article, so a PPAP package is admissible."
