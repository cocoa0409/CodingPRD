          setup:
            - "Interviewer officer-1 has a SCHEDULED interview 2026-09-05T14:00:00Z-15:00:00Z for applicant Ana (application INTERVIEWING)"
            - "Applicants Bob and Cy have applications in UNDER_REVIEW (ready for interview scheduling)"
