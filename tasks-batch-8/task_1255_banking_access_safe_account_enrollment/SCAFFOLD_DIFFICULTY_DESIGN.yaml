            - { call: "POST /api/partner-reports/${rep_id}/submit", payload: {}, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { err: $.data.error_id } }
          assert:
            - "Second submit fails with error_id == ERR_INVALID_STATE (report already SUBMITTED)"
            - "ERR_INSUFFICIENT_GRANT_FUNDS is NOT returned even though claim 4963 > available 4037 (state priority 5 beats fiscal priority 10)"
            - "PartnerReport.${rep_id}.status remains SUBMITTED and grant.reserved_cents remains 4963"

      - name: application_create_safety_vs_referential
        grounds:
          - "validations[priority=7]"
          - "validations[priority=9]"
          - "errors[ERR_DOCS_INCOMPLETE]"
          - "errors[ERR_REFERRAL_MISMATCH]"
        distinguishing_aspect: |
          Category pair business_safety x business_referential: creating an application for a
          participant whose docs are incomplete while referencing another participant's
          referral MUST return ERR_DOCS_INCOMPLETE (priority 7), not ERR_REFERRAL_MISMATCH
          (priority 9).
        test_recipe:
          setup:
            - "CERTIFIED institution; participant P1 without verified docs; participant P2 fully documented with referral R2 in DOCS_COMPLETE"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "PROOF_OF_ADDRESS", status: "SUBMITTED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "Ben Okafor", date_of_birth: "1985-11-02", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p2_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p2_id}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { r2_id: $.data.id } }
            - { call: "POST /api/referrals/${r2_id}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
          trigger:
            - { call: "POST /api/account-applications", payload: { participant_id: "${p1_id}", institution_id: "${inst_id}", id_type_presented: "STATE_ID", referral_id: "${r2_id}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { err: $.data.error_id } }
          assert:
            - "Create fails with error_id == ERR_DOCS_INCOMPLETE (P1.docs_complete == false)"
            - "ERR_REFERRAL_MISMATCH is NOT returned even though R2 belongs to P2 (safety priority 7 beats referential priority 9)"
            - "No AccountApplication row exists for P1 afterwards (GET /api/account-applications?participant_id=${p1_id} -> total_count == 0)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (two different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: certification_score_exactly_90_passes
        grounds:
          - calculations.certification_score
          - state_machines.CertificationReview.SCORED_to_FINALIZED_PASS
        distinguishing_aspect: |
          Metric: weighted certification score. >= 90.00 is PASS (not > 90.00): ratings
          summing to exactly 90.00 finalize PASS, while 88.75 (the next reachable score
          below) finalizes CONDITIONAL — exercised via POST .../finalize.
        test_recipe:
          setup:
            - "EFFECTIVE STANDARD_RUBRIC standard; institutions I1 and I2 each with a SCORED review"
            - "I1 ratings FEE4/ACC4/ALT4/CHEX4/EDU2 -> 90.00; I2 ratings FEE3/ACC4/ALT4/CHEX4/EDU3 -> 88.75"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst1: $.data.id, inst1_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst1}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst1_v}" }, as: CoalitionAdmin, captures: { rev1: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev1}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 2 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer", captures: { sc1: $.data.weighted_score } }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Metro Bank", charter_type: "BANK" }, as: CoalitionAdmin, captures: { inst2: $.data.id, inst2_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst2}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst2_v}" }, as: CoalitionAdmin, captures: { rev2: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev2}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 3 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 3 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer", captures: { sc2: $.data.weighted_score } }
          trigger:
            - { call: "POST /api/certification-reviews/${rev1}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer", captures: { st1: $.data.status } }
            - { call: "POST /api/certification-reviews/${rev2}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer", captures: { st2: $.data.status } }
          assert:
            - "CertificationReview.${rev1}.weighted_score == 90.0 (1.0+0.8+0.6+0.8+0.4 = 3.6 -> 100*3.6/4)"
            - "CertificationReview.${rev1}.status == FINALIZED_PASS (90.00 >= 90.00; a > comparison would wrongly fail it)"
            - "CertificationReview.${rev2}.weighted_score == 88.75 (0.75+0.8+0.6+0.8+0.6 = 3.55)"
            - "CertificationReview.${rev2}.status == FINALIZED_CONDITIONAL (88.75 < 90.00, >= 75.00)"

      - name: retention_empty_eligible_set_null_rate
        grounds:
          - calculations.retention_rate
          - entities.PartnerReport.fields.retention_rate_m6
        distinguishing_aspect: |
          Metric: retention rate over an EMPTY eligible checkpoint set — rate is null (not
          0.0) and the bonus is 0, exercised via POST /partner-reports; a different metric
          and endpoint than the certification score boundary.
        test_recipe:
          setup:
            - "CERTIFIED institution with one OPENED account (2026-05-01; M6 due 2026-10-31)"
            - "ACTIVE grant; report period ends 2026-05-31, before any checkpoint due_date"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p_id}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { ref_id: $.data.id } }
            - { call: "POST /api/referrals/${ref_id}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/account-applications", payload: { participant_id: "${p_id}", institution_id: "${inst_id}", id_type_presented: "MATRICULA_CONSULAR", referral_id: "${ref_id}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { app_id: $.data.id } }
            - { call: "POST /api/account-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "POST /api/funding-grants", payload: { funder_name: "City Foundation", program_year: 2026, total_cents: 500000, per_report_cap_cents: 200000 }, as: CoalitionAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/funding-grants/${g_id}/activate", payload: {}, as: CoalitionAdmin, captures: { g_v: $.data.version } }
          trigger:
            - { call: "POST /api/partner-reports", payload: { institution_id: "${inst_id}", grant_id: "${g_id}", period_start: "2026-01-01", period_end: "2026-05-31", evaluation_mode: "FINAL", expected_grant_version: "${g_v}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { rep_id: $.data.id } }
          assert:
            - "PartnerReport.${rep_id}.retention_rate_m6 == null (eligible M6 set is empty: due 2026-10-31 > period_end 2026-05-31)"
            - "PartnerReport.${rep_id}.retention_rate_m12 == null (M12 due 2027-05-01 also beyond period_end)"
            - "PartnerReport.${rep_id}.retention_bonus_cents == 0 (null rate yields no tier, and a 0.0 rate would also yield no tier — the null-vs-0.0 distinction is observable on the field itself)"
            - "PartnerReport.${rep_id}.claim_total_cents == 4963 (opening claim only: 1 x round(5000 x 0.9925))"

