          - errors.ERR_NO_ELIGIBLE_CANDIDATES
        distinguishing_aspect: |
          Harbor Foods scores exactly 314 on the FULL variant. A THRESHOLD project with
          selection_threshold_score 315 must select nobody and be rejected with
          ERR_NO_ELIGIBLE_CANDIDATES leaving no leads behind, while an otherwise
          identical project with threshold 314 must select it — the comparison is
          risk_score >= threshold, and the failed run must not litter the database.
        test_recipe:
          setup:
            - "Harbor Foods with reported_total_cents 120000000 and matched_total_cents 90000000 (one information return), delinquent_period_count 2, gross_receipts_annual_cents 250000000 and no prior audit rate: FULL score 314 against industry_error_rate_bp 4200."
