              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_CERTIFICATION_FIELDS_INVALID"
            - "response.http_status == 422"

      - name: certification_ein_not_9_digits_returns_invalid
        claim_type: Violation → Error
        grounds:
          - validations[priority=28]
          - entities.EmploymentCertification.fields.employer_ein
        distinguishing_aspect: "POST /employment-certifications with employer_ein='12345' (not 9 digits) returns 422 ERR_CERTIFICATION_FIELDS_INVALID."
