        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[revision-create-stale-part]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Creating a 2nd revision with a stale expected_part_version (the pre-first-create value) returns ERR_STALE_VERSION (412); Part.version incremented by the first create."
        test_recipe:
          setup: ["A Part observed at version v0; one revision already created (version advanced)."]
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "OCC-P", name: "OccPart", part_type: "MAKE", base_cost_cents: 0 }
              as: Designer
              captures: { pid: $.data.id, v0: $.data.version }
            - call: "POST /plm/parts/${pid}/revisions"
              payload: { expected_part_version: "${v0}" }
              as: Designer
          trigger:
            - call: "POST /plm/parts/${pid}/revisions"
              payload: { expected_part_version: "${v0}" }
              as: Designer
              captures: { eid: $.data.error_id }
          assert:
            - "second revision create returns 412 with data.error_id == ERR_STALE_VERSION"

