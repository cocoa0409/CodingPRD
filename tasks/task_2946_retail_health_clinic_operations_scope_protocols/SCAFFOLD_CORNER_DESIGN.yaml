  - section: endpoints
    instances:
      - name: corner_appointment_arrival_awards_the_on_time_bonus_and_lifts_the_wait
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /queue-entries/{queueEntryId}/arrive]
          - calculations.queue_priority_score
          - state_machines.QueueEntry.SCHEDULED_to_WAITING
        distinguishing_aspect: "Arrival is what converts a booking into queue presence: it stamps arrived_at, awards ON_TIME_APPOINTMENT_BONUS (250) so the score jumps from 200 to 450, and moves the entry out of the appointment-blend term into waiting_count, so posted_wait_minutes goes from 10 to 20."
        test_recipe:
          setup:
            - "CA StateRule and a SORE_THROAT protocol (acuity_tier 2) exist; one OPEN CA clinic with one ACTIVE clinician."
            - "An appointment is booked for 2026-08-01T00:10:00Z while the clock is at 00:00, so it is SCHEDULED, inside the next hour and inside its own arrival window [23:55, 00:20]."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: ["STRIDOR"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 57", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c57_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Zephyr", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p57_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Zephyr", credential: "NP", license_state_code: "CA", home_clinic_id: "${c57_id}", supervising_physician_id: "${p57_id}" }
              as: ClinicAdmin
              captures: { cl57_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c57_id}", clinician_id: "${cl57_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${p57_id}" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "Ann Arrival", date_of_birth: "1989-09-09" }
              as: FrontDeskAgent
              captures: { ann_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c57_id}", patient_id: "${ann_id}", kind: "APPOINTMENT", complaint_code: "SORE_THROAT", scheduled_at: "2026-08-01T00:10:00Z" }
              as: FrontDeskAgent
              captures: { q57_id: $.data.id, q57_score_before: $.data.priority_score }
            - call: "GET /clinics/${c57_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c57_posted_before: $.data.posted_wait_minutes, c57_waiting_before: $.data.waiting_count }
          trigger:
            - call: "POST /queue-entries/${q57_id}/arrive"
              payload: {}
              as: FrontDeskAgent
              captures: { q57_status: $.data.status, q57_arrived: $.data.arrived_at, q57_score_after: $.data.priority_score }
            - call: "GET /clinics/${c57_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c57_posted_after: $.data.posted_wait_minutes, c57_waiting_after: $.data.waiting_count }
          assert:
            - "${q57_score_before} == 200   # no arrival yet, so no appointment bonus and no wait credit"
            - "${c57_waiting_before} == 0 and ${c57_posted_before} == 10   # ceil(0/1) * 20 + APPOINTMENT_BLEND_MINUTES 10 * 1 upcoming appointment"
            - "${q57_status} == WAITING and ${q57_arrived} == 2026-08-01T00:00:00Z"
            - "${q57_score_after} == 450   # 200 acuity + 250 on-time bonus (arrived_at <= scheduled_at + LATE_GRACE_MINUTES) + 0 wait"
            - "${c57_waiting_after} == 1 and ${c57_posted_after} == 20   # the entry left the blend term and entered waiting_count"
            - "Clinic.${c57_id}.last_realized_wait_minutes == null   # arrival is not a call"

      - name: corner_float_coverage_requires_a_cancelled_uncovered_assignment
        claim_type: conditional_action
        grounds:
          - endpoints[POST /clinics/{clinicId}/float-coverages]
