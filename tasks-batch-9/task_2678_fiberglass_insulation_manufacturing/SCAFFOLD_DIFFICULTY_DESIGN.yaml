              captures: { cycle_1: "$.data.id" }
          trigger:
            - call: "POST /allocation-cycles/${cycle_1}/propose"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
          assert:
            - "trigger -> 422 with error_id == ERR_NO_ELIGIBLE_ORDERS, because required_by 2026-09-01T00:00:00Z > period_end 2026-08-31T23:59:59Z by one second"
            - "AllocationCycle.${cycle_1}.status is still OPEN and allocated_sqft is still 0.00; no AllocationLine exists (GET /allocation-lines?allocation_cycle_id=${cycle_1} -> total_count == 0)"
