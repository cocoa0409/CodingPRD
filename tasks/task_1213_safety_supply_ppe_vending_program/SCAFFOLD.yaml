# =============================================================================
# SCAFFOLD.yaml — task_1213 Safety Supply & PPE Vending Program
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  generate task hard than expert level! 1213. Safety Supply & PPE Vending Program
  (Fastenal industrial vending): PPE issuance policy by job role, industrial
  vending machine placement & planogram, employee issuance limits & manager
  override, consumption reporting & cost center chargeback, respirator/fit-test
  linkage, regulated item (fall protection) inspection cycle, restock trigger &
  machine service, contract pricing & compliance audit

domain_name: safety-ppe-vending
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: expert_plus
  rationale: |
    Quota/allocation core (rolling issuance limits, par-level inventory pools,
    override grants as consumable capacity) fused with compliance/audit gating
    (fit-test linkage, serialized fall-protection inspection cycle, audit
    findings). Flat FK topology — no nested ownership tree; every aggregate
    crosses others via foreign keys. Three cyclic state machines (Employee,
    VendingMachine, SerializedUnit) and two branch machines (ManagerOverride,
    RestockOrder, ChargebackBatch) keep state shape non-linear. Logical clock
    (default 2026-05-01T00:00:00Z) drives all temporal sweeps deterministically.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities, flat topology)
# =============================================================================
entities:
  - name: CostCenter
    parent: null
    common_fields: true
    fields:
      - { name: cost_center_code, type: string, source: input, description: "Unique cost center code (e.g. CC-4100)" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: ytd_charged_cents, type: integer, source: computed, description: "Sum of total_cents over this center's ChargebackBatch rows in status CLOSED, DISPUTED or SETTLED; updated at batch close/settle; initial 0" }

  - name: JobRole
    parent: null
    common_fields: true
    fields:
      - { name: role_name, type: string, source: input, description: "Unique job role name (e.g. WELDER, ELECTRICIAN)" }
      - { name: description, type: string, source: input, description: "Free-text description", default: "" }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique SKU" }
      - { name: name, type: string, source: input, description: "Item name" }
      - { name: category, type: enum, source: input, description: "GENERAL | RESPIRATOR | FALL_PROTECTION" }
      - { name: requires_fit_test, type: boolean, source: computed, description: "= (category == RESPIRATOR); input ignored" }
      - { name: serialized_tracking, type: boolean, source: computed, description: "= (category == FALL_PROTECTION); input ignored" }
      - { name: inspection_interval_days, type: integer, source: input, description: "Required iff category == FALL_PROTECTION; must be > 0 then; null otherwise", default: null }
      - { name: base_list_price_cents, type: integer, source: input, description: "Fallback unit price when no ContractPrice row matches; >= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCONTINUED" }

  - name: ContractPrice
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; priced item" }
      - { name: min_period_qty, type: integer, source: input, description: "Tier breakpoint: row applies when the issuing cost center's cumulative POSTED qty for this item in the vend's calendar month, measured BEFORE the current line, is >= min_period_qty; >= 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Contracted unit price for this tier; >= 0" }
      - { name: effective_from, type: string, source: input, description: "ISO date YYYY-MM-DD; inclusive window start" }
      - { name: effective_to, type: string, source: input, description: "ISO date YYYY-MM-DD; inclusive window end; must be >= effective_from" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employee_code, type: string, source: input, description: "Unique badge code" }
      - { name: full_name, type: string, source: input, description: "Full name" }
      - { name: job_role_id, type: string, source: input, description: "FK -> JobRole.id; drives issuance policy resolution at vend time" }
      - { name: home_cost_center_id, type: string, source: input, description: "FK -> CostCenter.id; chargeback target for this employee's vends" }
      - { name: is_manager, type: boolean, source: input, default: false, description: "Gate for the Manager role (X-User-ID must reference an Employee with is_manager == true)" }
      - { name: fit_tests, type: array, source: system, default: [], description: "Append-only fit-test entries: [{fit_test_id, item_id (references Item.id), tested_on, result, expires_on, status}]; written only via POST /employees/{id}/fit-tests" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: VendingMachine
    parent: null
    common_fields: true
    fields:
      - { name: location_code, type: string, source: input, description: "Unique placement code (e.g. PLANT1-AISLE3)" }
      - { name: site_name, type: string, source: input, description: "Site name" }
      - { name: model, type: string, source: input, description: "Machine model" }
      - { name: status, type: enum, source: system, default: COMMISSIONING, description: "COMMISSIONING | ACTIVE | OFFLINE | IN_SERVICE | DECOMMISSIONED" }

  - name: MachineSlot
    parent: null
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> VendingMachine.id; planogram parent" }
      - { name: slot_code, type: string, source: input, description: "Planogram position code; unique per machine (machine_id, slot_code)" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; stocked item" }
      - { name: capacity, type: integer, source: input, description: "Physical slot capacity, > 0" }
      - { name: par_level, type: integer, source: input, description: "Restock trigger level; 0 <= par_level < capacity" }
      - { name: on_hand_qty, type: integer, source: system, default: 0, description: "Stock on hand; mutated only by serialized-unit registration (+1), vend (-qty), reversal (+qty), restock load (+qty)" }

  - name: SerializedUnit
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; item MUST have category FALL_PROTECTION" }
      - { name: serial_number, type: string, source: input, description: "Unique manufacturer serial" }
      - { name: slot_id, type: string, source: input, description: "FK -> MachineSlot.id; slot holding the unit while IN_STOCK" }
      - { name: issued_to_employee_id, type: string, source: system, default: null, description: "FK -> Employee.id; set at vend, null while IN_STOCK" }
      - { name: last_inspected_on, type: string, source: system, default: null, description: "ISO date of latest PASS inspection, null until first inspection" }
      - { name: next_inspection_due_on, type: string, source: system, default: null, description: "ISO date; set at vend = vend date + item.inspection_interval_days; refreshed at PASS inspection = inspected_on + interval" }
      - { name: inspection_log, type: array, source: system, default: [], description: "Append-only [{inspected_on, result, inspector_user_id}]" }
      - { name: status, type: enum, source: system, default: IN_STOCK, description: "IN_STOCK | ISSUED | INSPECTION_DUE | QUARANTINED" }

  - name: ManagerOverride
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; grantee" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; covered item" }
      - { name: approved_qty, type: integer, source: input, description: "Approved extra units beyond policy limit; > 0" }
      - { name: consumed_qty, type: integer, source: system, default: 0, description: "Units drawn; incremented by the override-drawn portion of each vend; NEVER decremented (reversal does not restore allowance)" }
      - { name: remaining_qty, type: integer, source: computed, description: "= approved_qty - consumed_qty" }
      - { name: valid_from, type: string, source: input, description: "ISO date; closed-interval start" }
      - { name: valid_until, type: string, source: input, description: "ISO date; closed-interval end; >= valid_from" }
      - { name: reason_code, type: enum, source: input, description: "MEDICAL | NEW_HIRE | INCIDENT | PROJECT | OTHER" }
      - { name: granted_by_user_id, type: string, source: system, description: "X-User-ID of the granting Manager; must differ from employee_id (segregation of duties)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CONSUMED | EXPIRED | REVOKED" }

  - name: IssuanceTransaction
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; taken from X-User-ID of the calling Employee (self-service vend)" }
      - { name: machine_id, type: string, source: input, description: "FK -> VendingMachine.id" }
      - { name: slot_id, type: string, source: input, description: "FK -> MachineSlot.id; must belong to machine_id" }
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; copied from slot.item_id at vend" }
      - { name: serialized_unit_id, type: string, source: input, default: null, description: "FK -> SerializedUnit.id; required iff item serialized_tracking; must be null otherwise" }
      - { name: qty, type: integer, source: input, description: "Units vended; > 0; must equal 1 when serialized_tracking" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Contract tier price resolved at vend time (see contract_price_resolution)" }
      - { name: line_total_cents, type: integer, source: computed, description: "= unit_price_cents * qty" }
      - { name: cost_center_id, type: string, source: system, description: "FK -> CostCenter.id; copied from employee.home_cost_center_id at vend" }
      - { name: manager_override_id, type: string, source: input, default: null, description: "FK -> ManagerOverride.id; required when the vend draws beyond policy limit" }
      - { name: override_drawn_qty, type: integer, source: computed, default: 0, description: "Portion of qty charged to the override per effective_limit draw-split rule" }
      - { name: idempotency_key, type: string, source: input, description: "Client key; unique across IssuanceTransaction" }
      - { name: vended_at, type: datetime, source: system, description: "Logical clock timestamp at vend" }
      - { name: chargeback_batch_id, type: string, source: system, default: null, description: "FK -> ChargebackBatch.id; stamped at batch close sweep; null while unbilled" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | REVERSED" }

  - name: RestockOrder
    parent: null
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> VendingMachine.id" }
      - { name: slot_id, type: string, source: input, description: "FK -> MachineSlot.id; must belong to machine_id and hold a non-serialized item" }
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; copied from slot.item_id" }
      - { name: qty, type: integer, source: input, description: "Units to load; > 0; on manual create, equals requested qty (naive variant); on AUTO_PAR create, = capacity - on_hand at trigger" }
      - { name: suggested_qty, type: integer, source: computed, description: "Committed-aware suggestion = max(0, par_level - on_hand_qty - SUM(qty of this slot's RestockOrder in SUGGESTED or PICKED)) evaluated at create" }
      - { name: source, type: enum, source: system, description: "AUTO_PAR (created by par-breach trigger) | MANUAL (POST /restock-orders)" }
      - { name: status, type: enum, source: system, default: SUGGESTED, description: "SUGGESTED | PICKED | LOADED | CANCELLED" }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> VendingMachine.id" }
      - { name: issue_code, type: enum, source: input, description: "JAM | DOOR_FAULT | NETWORK | DISPLAY | PLANOGRAM_CHANGE | PREVENTIVE" }
      - { name: window_start, type: datetime, source: input, description: "Half-open service window start (ISO8601)" }
      - { name: window_end, type: datetime, source: input, description: "Half-open service window end; must be > window_start" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | IN_PROGRESS | RESOLVED" }

  - name: ChargebackBatch
    parent: null
    common_fields: true
    fields:
      - { name: cost_center_id, type: string, source: input, description: "FK -> CostCenter.id" }
      - { name: period_start, type: string, source: input, description: "ISO date; half-open sweep window start (vended_at >= period_start)" }
      - { name: period_end, type: string, source: input, description: "ISO date; half-open sweep window end (vended_at < period_end); > period_start" }
      - { name: line_count, type: integer, source: computed, default: 0, description: "Number of POSTED issuances swept at close" }
      - { name: snapshot_total_cents, type: integer, source: computed, default: 0, description: "SUM of stored line_total_cents over swept POSTED lines (vend-time pricing)" }
      - { name: rerated_total_cents, type: integer, source: computed, default: 0, description: "Chronological re-price of swept POSTED lines at close (see chargeback_rerate)" }
      - { name: adjustment_cents, type: integer, source: system, default: 0, description: "Accumulates -line_total_cents for each reversal of a line billed in an earlier CLOSED/DISPUTED/SETTLED batch of the same cost center; negative or zero" }
      - { name: admin_fee_cents, type: integer, source: computed, default: 0, description: "SUM over swept lines of round_half_up(line_total * ADMIN_FEE_BPS / 10000) — per-line rounding, then sum (pinned order)" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "At close: rerated_total_cents + adjustment_cents + admin_fee_cents; while OPEN: 0" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED | DISPUTED | SETTLED" }

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - { name: scope, type: enum, source: input, description: "OVERRIDE_USAGE | INSPECTION_COMPLIANCE" }
      - { name: period_start, type: string, source: input, description: "ISO date; closed interval start" }
      - { name: period_end, type: string, source: input, description: "ISO date; closed interval end; >= period_start" }
      - { name: exceptions_count, type: integer, source: computed, default: 0, description: "Computed at file-findings per audit_exceptions rule; 0 until then" }
      - { name: findings_detail, type: array, source: computed, default: [], description: "List of {finding_type, entity_id, detail} produced at file-findings" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FIELDWORK | FINDINGS_FILED | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PUT /employees/{employeeId} with status=SUSPENDED"
        actor: EHSAdministrator
        preconditions:
          - "Employee currently ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "increments Employee.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PUT /employees/{employeeId} with status=ACTIVE"
        actor: EHSAdministrator
        preconditions:
          - "Employee currently SUSPENDED"
        side_effects:
          - "increments Employee.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "PUT /employees/{employeeId} with status=TERMINATED"
        actor: EHSAdministrator
        preconditions:
          - "Employee currently ACTIVE or SUSPENDED"
        side_effects:
          - "All ManagerOverride rows for this employee in status ACTIVE -> REVOKED (cascade); consumed_qty unchanged"
          - "increments Employee.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "PUT /employees/{employeeId} with status=TERMINATED"
        actor: EHSAdministrator
        preconditions: []
        side_effects:
          - "All ACTIVE ManagerOverride rows for this employee -> REVOKED"

  - entity: Item
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /items/{itemId}/discontinue"
        actor: EHSAdministrator
        preconditions:
          - "Item currently ACTIVE (else ERR_ITEM_DISCONTINUED)"
        side_effects:
          - "New vends of this item rejected (ERR_ITEM_DISCONTINUED)"
          - "New RestockOrder creation for slots holding this item rejected"
          - "Existing IssuancePolicy rows remain in force for historical reads"

  - entity: VendingMachine
    initial_state: COMMISSIONING
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: COMMISSIONING
        to: ACTIVE
        trigger: "PUT /machines/{machineId} with status=ACTIVE"
        actor: VendingTechnician
        preconditions:
          - "Machine has >= 1 MachineSlot (else ERR_MACHINE_NO_PLANOGRAM)"
        side_effects:
          - "increments VendingMachine.version by 1"
      - from: ACTIVE
        to: OFFLINE
        trigger: "PUT /machines/{machineId} with status=OFFLINE"
        actor: VendingTechnician
        preconditions: []
        side_effects:
          - "increments VendingMachine.version by 1"
      - from: OFFLINE
        to: ACTIVE
        trigger: "PUT /machines/{machineId} with status=ACTIVE"
        actor: VendingTechnician
        preconditions: []
        side_effects:
          - "increments VendingMachine.version by 1"
      - from: ACTIVE
        to: IN_SERVICE
        trigger: "system (POST /service-tickets/{ticketId}/start)"
        actor: system
        preconditions:
          - "Machine ACTIVE or OFFLINE when the ticket starts"
        side_effects:
          - "All RestockOrder rows for this machine in status SUGGESTED or PICKED -> CANCELLED (because the machine entered IN_SERVICE)"
          - "increments VendingMachine.version by 1"
      - from: OFFLINE
        to: IN_SERVICE
        trigger: "system (POST /service-tickets/{ticketId}/start)"
        actor: system
        preconditions: []
        side_effects:
          - "All RestockOrder rows for this machine in status SUGGESTED or PICKED -> CANCELLED"
          - "increments VendingMachine.version by 1"
      - from: IN_SERVICE
        to: ACTIVE
        trigger: "system (POST /service-tickets/{ticketId}/resolve)"
        actor: system
        preconditions: []
        side_effects:
          - "For every slot of this machine whose item is non-serialized and whose on_hand_qty <= par_level with no RestockOrder in SUGGESTED or PICKED: auto-create RestockOrder source=AUTO_PAR, qty = capacity - on_hand_qty (restock_par_trigger)"
          - "increments VendingMachine.version by 1"
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "PUT /machines/{machineId} with status=DECOMMISSIONED"
        actor: VendingTechnician
        preconditions:
          - "No RestockOrder for this machine in status SUGGESTED or PICKED (else ERR_OPEN_RESTOCK_ORDERS_EXIST)"
          - "No ServiceTicket for this machine in status OPEN or IN_PROGRESS (else ERR_OPEN_SERVICE_TICKETS_EXIST)"
        side_effects:
          - "increments VendingMachine.version by 1"
      - from: OFFLINE
        to: DECOMMISSIONED
        trigger: "PUT /machines/{machineId} with status=DECOMMISSIONED"
        actor: VendingTechnician
        preconditions:
          - "Same as ACTIVE -> DECOMMISSIONED"
        side_effects:
          - "increments VendingMachine.version by 1"

  - entity: SerializedUnit
    initial_state: IN_STOCK
    terminal_states: [QUARANTINED]
    transitions:
      - from: IN_STOCK
        to: ISSUED
        trigger: "system (POST /issuances vending this serialized unit)"
        actor: system
        preconditions:
          - "Unit status IN_STOCK (else ERR_SERIALIZED_UNIT_NOT_ISSUABLE)"
          - "Unit slot_id equals the request slot_id"
        side_effects:
          - "issued_to_employee_id = vending employee"
          - "next_inspection_due_on = vend date + item.inspection_interval_days"
          - "MachineSlot.on_hand_qty -= 1"
      - from: ISSUED
        to: INSPECTION_DUE
        trigger: "system (clock sweep on POST /_clock/set_current_utc when current date > next_inspection_due_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INSPECTION_DUE
        to: ISSUED
        trigger: "POST /serialized-units/{unitId}/inspect with result=PASS"
        actor: SafetyOfficer
        preconditions:
          - "Unit status ISSUED or INSPECTION_DUE (else ERR_SERIALIZED_UNIT_NOT_ISSUABLE)"
        side_effects:
          - "last_inspected_on = inspected_on"
          - "next_inspection_due_on = inspected_on + item.inspection_interval_days"
          - "inspection_log appended"
      - from: ISSUED
        to: ISSUED
        trigger: "POST /serialized-units/{unitId}/inspect with result=PASS (voluntary early inspection)"
        actor: SafetyOfficer
        preconditions:
          - "Unit status ISSUED or INSPECTION_DUE"
        side_effects:
          - "last_inspected_on = inspected_on"
          - "next_inspection_due_on = inspected_on + item.inspection_interval_days"
          - "inspection_log appended"
      - from: ISSUED
        to: QUARANTINED
        trigger: "POST /serialized-units/{unitId}/inspect with result=FAIL"
        actor: SafetyOfficer
        preconditions:
          - "Unit status ISSUED or INSPECTION_DUE"
        side_effects:
          - "inspection_log appended"
          - "issued_to_employee_id retained for audit traceability"
      - from: INSPECTION_DUE
        to: QUARANTINED
        trigger: "POST /serialized-units/{unitId}/inspect with result=FAIL, OR system clock sweep when current date > next_inspection_due_on + 30-day grace"
        actor: system
        preconditions: []
        side_effects:
          - "inspection_log appended only for the FAIL-inspection path"
      - from: IN_STOCK
        to: QUARANTINED
        trigger: "POST /serialized-units/{unitId}/inspect with result=FAIL (stock unit fails incoming inspection)"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "MachineSlot.on_hand_qty -= 1 (unit removed from sellable stock)"
          - "inspection_log appended"

  - entity: ManagerOverride
    initial_state: ACTIVE
    terminal_states: [CONSUMED, EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "system (POST /issuances draw makes consumed_qty == approved_qty)"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_qty becomes 0"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep when current date > valid_until)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /manager-overrides/{overrideId}/revoke, OR system cascade on Employee -> TERMINATED"
        actor: Manager
        preconditions:
          - "Override currently ACTIVE (else ERR_OVERRIDE_NOT_ACTIVE)"
        side_effects:
          - "consumed_qty unchanged; remaining_qty becomes 0"

  - entity: IssuanceTransaction
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /issuances/{issuanceId}/reverse"
        actor: Manager
        preconditions:
          - "Issuance currently POSTED (else ERR_ISSUANCE_ALREADY_REVERSED)"
          - "Reversing manager's X-User-ID != issuance.employee_id (else ERR_SELF_REVERSAL_FORBIDDEN)"
          - "If chargeback_batch_id references a batch in CLOSED/DISPUTED/SETTLED: an OPEN ChargebackBatch for the same cost_center_id must exist (else ERR_NO_OPEN_CHARGEBACK_BATCH)"
        side_effects:
          - "MachineSlot.on_hand_qty += qty (slot restored; for serialized items qty == 1)"
          - "If the on_hand_qty increase pushes the slot strictly above par_level and a RestockOrder for the slot is in SUGGESTED: that order -> CANCELLED (restock auto-cancel cascade)"
          - "If serialized_unit_id set: unit ISSUED -> IN_STOCK, issued_to_employee_id = null, next_inspection_due_on = null"
          - "Employee rolling usage for the item decreases by qty (usage recomputed over POSTED rows only)"
          - "ManagerOverride.consumed_qty NOT decremented (consumption is final; audit reconciles)"
          - "If chargeback_batch_id null (unbilled): line simply excluded from future close sweeps"
          - "If chargeback_batch_id references a non-OPEN batch: the OPEN batch for the same cost center gets adjustment_cents -= line_total_cents"

  - entity: RestockOrder
    initial_state: SUGGESTED
    terminal_states: [LOADED, CANCELLED]
    transitions:
      - from: SUGGESTED
        to: PICKED
        trigger: "POST /restock-orders/{orderId}/pick"
        actor: VendingTechnician
        preconditions:
          - "Order currently SUGGESTED (else ERR_RESTOCK_ORDER_INVALID_STATE)"
        side_effects: []
      - from: PICKED
        to: LOADED
        trigger: "POST /restock-orders/{orderId}/load"
        actor: VendingTechnician
        preconditions:
          - "Order currently PICKED (else ERR_RESTOCK_ORDER_INVALID_STATE)"
          - "Machine status ACTIVE or OFFLINE (else ERR_MACHINE_NOT_ACTIVE)"
          - "MachineSlot.on_hand_qty + qty <= capacity (else ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "MachineSlot.on_hand_qty += qty"
      - from: SUGGESTED
        to: CANCELLED
        trigger: "POST /restock-orders/{orderId}/cancel, OR system (restock auto-cancel cascade on reversal), OR system (machine enters IN_SERVICE)"
        actor: VendingTechnician
        preconditions:
          - "Order currently SUGGESTED or PICKED (else ERR_RESTOCK_ORDER_INVALID_STATE)"
        side_effects: []
      - from: PICKED
        to: CANCELLED
        trigger: "POST /restock-orders/{orderId}/cancel, OR system (machine enters IN_SERVICE)"
        actor: VendingTechnician
        preconditions: []
        side_effects: []

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /service-tickets/{ticketId}/start"
        actor: VendingTechnician
        preconditions:
          - "Ticket currently OPEN (else ERR_SERVICE_TICKET_INVALID_STATE)"
          - "Logical clock >= window_start AND < window_end (else ERR_SERVICE_WINDOW_NOT_REACHED)"
          - "Machine status ACTIVE or OFFLINE (else ERR_MACHINE_NOT_ACTIVE)"
        side_effects:
          - "Machine -> IN_SERVICE (see VendingMachine transitions)"
          - "Machine's SUGGESTED/PICKED RestockOrders -> CANCELLED"
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /service-tickets/{ticketId}/resolve"
        actor: VendingTechnician
        preconditions:
          - "Ticket currently IN_PROGRESS (else ERR_SERVICE_TICKET_INVALID_STATE)"
        side_effects:
          - "Machine IN_SERVICE -> ACTIVE"
          - "Post-service restock sweep: auto-create AUTO_PAR RestockOrder for every non-serialized slot of the machine with on_hand_qty <= par_level and no SUGGESTED/PICKED order (restock_par_trigger)"

  - entity: ChargebackBatch
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /chargeback-batches/{batchId}/close"
        actor: FinanceAnalyst
        preconditions:
          - "Batch currently OPEN (else ERR_BATCH_INVALID_STATE)"
          - "Sweep set non-empty OR adjustment_cents != 0 (else ERR_EMPTY_CHARGEBACK_BATCH)"
        side_effects:
          - "Sweep: all IssuanceTransaction with cost_center_id == batch.cost_center_id, status POSTED, chargeback_batch_id null, and period_start <= vended_at(date) < period_end get chargeback_batch_id = batch.id"
          - "line_count, snapshot_total_cents computed from swept lines' stored line_total_cents"
          - "rerated_total_cents computed via chargeback_rerate (chronological replay)"
          - "admin_fee_cents computed per line with round_half_up then summed (pinned rounding order)"
          - "total_cents = rerated_total_cents + adjustment_cents + admin_fee_cents"
          - "CostCenter.ytd_charged_cents += total_cents"
      - from: CLOSED
        to: DISPUTED
        trigger: "POST /chargeback-batches/{batchId}/dispute"
        actor: Manager
        preconditions:
          - "Batch currently CLOSED (else ERR_BATCH_INVALID_STATE)"
        side_effects: []
      - from: CLOSED
        to: SETTLED
        trigger: "POST /chargeback-batches/{batchId}/settle"
        actor: FinanceAnalyst
        preconditions:
          - "Batch currently CLOSED or DISPUTED (else ERR_BATCH_INVALID_STATE)"
        side_effects: []
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /chargeback-batches/{batchId}/settle"
        actor: FinanceAnalyst
        preconditions: []
        side_effects: []

  - entity: ComplianceAudit
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: FIELDWORK
        trigger: "POST /compliance-audits/{auditId}/begin-fieldwork"
        actor: ComplianceAuditor
        preconditions:
          - "Audit currently DRAFT (else ERR_AUDIT_INVALID_STATE)"
          - "No ChargebackBatch overlapping [period_start, period_end] (closed-interval overlap) is in status OPEN (else ERR_OPEN_BATCHES_EXIST)"
        side_effects: []
      - from: FIELDWORK
        to: FINDINGS_FILED
        trigger: "POST /compliance-audits/{auditId}/file-findings"
        actor: ComplianceAuditor
        preconditions:
          - "Audit currently FIELDWORK (else ERR_AUDIT_INVALID_STATE)"
        side_effects:
          - "exceptions_count and findings_detail computed per audit_exceptions rule"
      - from: FINDINGS_FILED
        to: CLOSED
        trigger: "POST /compliance-audits/{auditId}/close"
        actor: ComplianceAuditor
        preconditions:
          - "Audit currently FINDINGS_FILED (else ERR_AUDIT_INVALID_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: slot-create-stale-machine
    parent_entity: VendingMachine
    write_endpoint: "POST /machines/{machineId}/slots"
    occ_field: expected_machine_version
    description: |
      Creating a planogram slot against a VendingMachine whose version has
      advanced since the client last observed it is rejected: another write
      (commission, offline toggle, service start, or an earlier slot create)
      has legitimately moved the machine on, so the caller's planogram view is
      stale. Expressed purely as a stale-version check on the parent.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: slot-update-stale-slot
    parent_entity: MachineSlot
    write_endpoint: "PUT /slots/{slotId}"
    occ_field: expected_slot_version
    description: |
      Updating a planogram slot (par_level, capacity, or item swap) with an
      expected_slot_version that no longer matches the slot's current version
      is rejected: a prior planogram edit has already superseded the caller's
      view of the slot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contract_price_resolution
    trigger: "POST /issuances (at vend time, per line)"
    algorithm: tiered_pricing
    formula: |
      Inputs: item_id, vended_date (logical clock date), qty,
              cumulative_before = SUM(qty) over IssuanceTransaction rows with
                cost_center_id == employee.home_cost_center_id,
                item_id == this item, status == POSTED,
                and vended_at within the same calendar month as vended_date
                (month boundaries by logical clock), evaluated BEFORE this line.
      1. candidates = ContractPrice rows where item_id matches AND
         effective_from <= vended_date <= effective_to AND
         min_period_qty <= cumulative_before
      2. if candidates empty:
           eligible_window = rows where item_id matches AND
             effective_from <= vended_date <= effective_to (any tier)
           if eligible_window empty: unit_price_cents = item.base_list_price_cents
           else: unit_price_cents = unit_price_cents of the eligible_window row
                  with the SMALLEST min_period_qty (tie: latest effective_from,
                  then earliest created_at)
      3. else: unit_price_cents = unit_price_cents of the candidate row with the
         LARGEST min_period_qty (tie: latest effective_from, then earliest
         created_at)
      line_total_cents = unit_price_cents * qty
    constants:
      FALLBACK: "item.base_list_price_cents"
    precision: "integer cents; no rounding"
    variants: []

  - name: usage_rolling_window
    trigger: "POST /issuances (limit check) and POST /issuances/{id}/reverse (recompute)"
    algorithm: aggregation
    formula: |
      usage(employee, item) = SUM(qty) over IssuanceTransaction rows where
        employee_id == employee, item_id == item, status == POSTED,
        AND 0 <= (current_utc - vended_at) <= period_window_days * 24h
      Boundary: a row whose age equals exactly period_window_days * 24 hours IS
      included (<=). A row 1 second older is excluded.
      Only POSTED rows count; REVERSED rows excluded.
    constants: []
    precision: "integer units"

  - name: effective_limit
    trigger: "POST /issuances (limit check)"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned (circular-looking dependency made explicit):
      1. policy = IssuancePolicy row matching (employee.job_role_id, item_id);
         if none -> ERR_ITEM_NOT_ENTITLED (business_constraint)
      2. usage = usage_rolling_window(employee, item)
      3. base_limit = policy.period_limit_qty
      4. override = the unique ManagerOverride with employee_id == employee,
         item_id == item, status == ACTIVE, valid_from <= current_date <=
         valid_until (uniqueness guaranteed by the override window-gap rule).
         If the request supplies manager_override_id, it MUST equal this row's
         id (else ERR_OVERRIDE_NOT_ACTIVE).
      5. effective_limit = base_limit + (override ? override.remaining_qty : 0)
      6. Draw split: if usage + qty <= base_limit -> override_drawn_qty = 0
         elif override present: needed = (usage + qty) - max(base_limit, usage);
           require needed <= override.remaining_qty (else ERR_OVERRIDE_QTY_EXCEEDED);
           override_drawn_qty = needed
         else -> ERR_ISSUANCE_LIMIT_EXCEEDED
    constants: []
    precision: "integer units"

  - name: restock_par_trigger
    trigger: "system after any MachineSlot.on_hand_qty decrease (vend), and after ServiceTicket resolve sweep"
    algorithm: threshold
    formula: |
      Applies only to slots whose item.serialized_tracking == false.
      After a decrease: if on_hand_qty <= par_level AND no RestockOrder exists
      for the slot with status in {SUGGESTED, PICKED}:
        create RestockOrder(source=AUTO_PAR, qty = capacity - on_hand_qty)
      Boundary: on_hand_qty == par_level TRIGGERS (<=); par_level + 1 does not.
      Auto-create is suppressed entirely for serialized (FALL_PROTECTION) slots.
    constants: []
    precision: "integer units"

  - name: restock_suggested_qty
    trigger: "POST /restock-orders (manual create)"
    algorithm: aggregation
    formula: |
      suggested_qty = max(0, par_level - on_hand_qty
                          - SUM(qty of this slot's RestockOrder rows in
                                status SUGGESTED or PICKED))
      Manual create stores client-supplied qty as the order qty (naive
      fill-to-request variant) while suggested_qty records the committed-aware
      recommendation. The two variants diverge whenever on_hand or open orders
      are non-zero.
    constants: []
    precision: "integer units"
    variants:
      - name: naive_fill
        when: "AUTO_PAR trigger and MANUAL order qty field"
        difference: "qty = capacity - on_hand_qty (AUTO_PAR) or client-requested qty (MANUAL); ignores open orders and par vs capacity distinction"
      - name: committed_aware
        when: "suggested_qty computed field on every RestockOrder"
        difference: "max(0, par_level - on_hand_qty - open committed qty); subtracts SUGGESTED/PICKED pipeline and targets par, not capacity"

  - name: chargeback_snapshot_vs_rerate
    trigger: "POST /chargeback-batches/{batchId}/close"
    algorithm: aggregation
    formula: |
      snapshot_total_cents = SUM(stored line_total_cents) over swept POSTED
        lines (vend-time pricing, tier keyed on cumulative_before at vend).
      rerated_total_cents: replay swept POSTED lines in chronological order
        (vended_at ASC, tie -> created_at ASC), maintaining a running
        cumulative per item; for each line re-resolve the tier with
        min_period_qty <= running cumulative BEFORE this line, using the
        ContractPrice rows effective at the ORIGINAL vended_date; line reprice
        = resolved unit_price_cents * qty; rerated_total_cents = SUM(reprice).
      The two totals diverge whenever a reversal removed lower-tier lines whose
      cumulative contribution had pushed later lines into a cheaper tier.
    constants: []
    precision: "integer cents"
    variants:
      - name: snapshot
        when: "stored at vend; snapshot_total_cents"
        difference: "uses per-line stored line_total_cents with tier fixed at vend-time cumulative"
      - name: rerate
        when: "computed at close; rerated_total_cents"
        difference: "replays POSTED lines chronologically with running cumulative; reversed lines removed from the sequence, shifting later lines' tiers"

  - name: admin_fee_rounding
    trigger: "POST /chargeback-batches/{batchId}/close"
    algorithm: aggregation
    formula: |
      Per swept POSTED line: fee_line = round_half_up(line_total_cents_rerated * ADMIN_FEE_BPS / 10000)
      admin_fee_cents = SUM(fee_line)
      PINNED ORDER: round each line first, then sum. (Sum-then-round is the
      rejected alternative: it can differ by cents, e.g. three 1350-cent lines
      give 3 * round_half_up(33.75) = 102 vs round_half_up(101.25) = 101.)
    constants:
      ADMIN_FEE_BPS: 250
    precision: "integer cents; round_half_up at line level"

  - name: fit_test_validity
    trigger: "POST /issuances for items with requires_fit_test == true; clock sweep"
    algorithm: threshold
    formula: |
      latest = fit_tests entry for (employee, item) with greatest tested_on
               (tie -> greatest created_at).
      If no entry, or latest.result == FAIL, or latest.status == EXPIRED
      -> ERR_FIT_TEST_REQUIRED.
      On entry creation: PASS -> expires_on = tested_on + 365 days,
        status VALID; FAIL -> expires_on = tested_on, status VALID (but result
        FAIL never authorizes).
      Clock sweep: entry VALID -> EXPIRED when current_date > expires_on.
      Boundary: current_date == expires_on is still VALID (inclusive expiry).
    constants:
      FIT_TEST_VALIDITY_DAYS: 365
    precision: "date granularity"

  - name: inspection_due_sweep
    trigger: "POST /_clock/set_current_utc (system sweep)"
    algorithm: threshold
    formula: |
      For each SerializedUnit:
        status ISSUED and current_date > next_inspection_due_on
          -> INSPECTION_DUE
        status INSPECTION_DUE and current_date > next_inspection_due_on + 30 days
          -> QUARANTINED (overdue quarantine; no inspection_log entry)
      Boundary: current_date == next_inspection_due_on keeps ISSUED (due the
      FOLLOWING day); current_date == next_inspection_due_on + 30 keeps
      INSPECTION_DUE (quarantine on day +31).
    constants:
      OVERDUE_GRACE_DAYS: 30
    precision: "date granularity"

  - name: override_expiry_sweep
    trigger: "POST /_clock/set_current_utc (system sweep)"
    algorithm: threshold
    formula: |
      ManagerOverride status ACTIVE and current_date > valid_until -> EXPIRED.
      Boundary: current_date == valid_until remains ACTIVE (closed interval).
    constants: []
    precision: "date granularity"

  - name: audit_exceptions
    trigger: "POST /compliance-audits/{auditId}/file-findings"
    algorithm: aggregation
    formula: |
      scope OVERRIDE_USAGE:
        findings = ManagerOverride rows (any status) whose [valid_from,
        valid_until] closed interval intersects the audit's closed
        [period_start, period_end] AND consumed_qty != SUM(override_drawn_qty)
        over IssuanceTransaction rows referencing this override with
        status == POSTED.
        exceptions_count = count(findings); findings_detail entries carry
        finding_type=OVERRIDE_CONSUMPTION_MISMATCH and entity_id=override id.
      scope INSPECTION_COMPLIANCE:
        findings = SerializedUnit rows with status in {INSPECTION_DUE,
        QUARANTINED} at file-findings time.
        exceptions_count = count(findings); finding_type=UNIT_INSPECTION_LAPSED.
    constants: []
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role names a declared role; for entity-backed roles X-User-ID must resolve to an existing Employee row"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint; Manager role additionally requires the referenced Employee to have is_manager == true"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; then body FK ids (machine_id, slot_id, item_id, job_role_id, home_cost_center_id, employee_id, serialized_unit_id, manager_override_id) exist"
    error_id: "ERR_COST_CENTER_NOT_FOUND | ERR_JOB_ROLE_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_CONTRACT_PRICE_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_MACHINE_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_SERIALIZED_UNIT_NOT_FOUND | ERR_MANAGER_OVERRIDE_NOT_FOUND | ERR_ISSUANCE_NOT_FOUND | ERR_RESTOCK_ORDER_NOT_FOUND | ERR_SERVICE_TICKET_NOT_FOUND | ERR_CHARGEBACK_BATCH_NOT_FOUND | ERR_COMPLIANCE_AUDIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints"

  - priority: 3.7
    category: business_constraint
    check: "Idempotency: an IssuanceTransaction with the same idempotency_key exists -> if the remainder of the payload is identical, return the original transaction (201, replay); if any other field differs, reject"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "POST /issuances"

  - priority: 3.8
    category: state
    check: "OCC: expected_machine_version (POST /machines/{id}/slots) / expected_slot_version (PUT /slots/{id}) must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /machines/{machineId}/slots, PUT /slots/{slotId}"

  - priority: 4
    category: state
    check: "Employee status == ACTIVE to vend (header-resolved employee)"
    error_id: ERR_EMPLOYEE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /issuances"

  - priority: 5
    category: state
    check: "Machine status == ACTIVE to vend; RestockOrder load requires machine ACTIVE or OFFLINE; slot create requires machine COMMISSIONING, ACTIVE or IN_SERVICE; serialized-unit registration requires machine COMMISSIONING or ACTIVE"
    error_id: ERR_MACHINE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /issuances, POST /restock-orders/{id}/load, POST /machines/{id}/slots, POST /serialized-units"

  - priority: 6
    category: state
    check: "Item status == ACTIVE (vend, slot create, restock create, serialized-unit registration)"
    error_id: ERR_ITEM_DISCONTINUED
    http_status: 409
    applies_to: "POST /issuances, POST /machines/{id}/slots, POST /restock-orders, POST /serialized-units"

  - priority: 7
    category: state
    check: "Target-resource state preconditions per state machine (override ACTIVE, unit issuable, order/ticket/batch/audit in expected from-state, issuance POSTED)"
    error_id: "ERR_OVERRIDE_NOT_ACTIVE | ERR_SERIALIZED_UNIT_NOT_ISSUABLE | ERR_RESTOCK_ORDER_INVALID_STATE | ERR_SERVICE_TICKET_INVALID_STATE | ERR_BATCH_INVALID_STATE | ERR_AUDIT_INVALID_STATE | ERR_ISSUANCE_ALREADY_REVERSED | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "Respirator linkage: item.requires_fit_test -> employee's latest fit-tests entry for the item is result=PASS and not EXPIRED (fit_test_validity)"
    error_id: ERR_FIT_TEST_REQUIRED
    http_status: 403
    applies_to: "POST /issuances"

  - priority: 9
    category: business_safety
    check: "Fall-protection linkage: serialized unit IN_STOCK in the requested slot; employee does not currently hold another unit of the same item in INSPECTION_DUE or QUARANTINED"
    error_id: "ERR_SERIALIZED_UNIT_NOT_ISSUABLE (unit state) | ERR_REGULATED_ITEM_INSPECTION_DUE (employee holding lapsed unit)"
    http_status: 409
    applies_to: "POST /issuances"

  - priority: 10
    category: business_temporal
    check: "Service window overlap: for the same machine, no other ServiceTicket with status OPEN or IN_PROGRESS whose half-open [window_start, window_end) intersects the request's; adjacency (window_end == other.window_start) is ALLOWED"
    error_id: ERR_SERVICE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /service-tickets"

  - priority: 11
    category: business_temporal
    check: "Override window separation: for the same (employee_id, item_id), every other ManagerOverride in status ACTIVE must leave at least one full calendar day between closed intervals: new.valid_from >= existing.valid_until + 2 days OR new.valid_until <= existing.valid_from - 2 days"
    error_id: ERR_OVERRIDE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /manager-overrides"

  - priority: 12
    category: business_temporal
    check: "ContractPrice windows for the same item must not overlap (closed-interval intersection); gaps are allowed; ChargebackBatch windows for the same cost center must not overlap (half-open [period_start, period_end)); adjacency allowed"
    error_id: "ERR_CONTRACT_PRICE_WINDOW_CONFLICT | ERR_BATCH_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "POST /contract-prices, POST /chargeback-batches"

  - priority: 13
    category: business_temporal
    check: "ServiceTicket start only when window_start <= logical clock < window_end"
    error_id: ERR_SERVICE_WINDOW_NOT_REACHED
    http_status: 409
    applies_to: "POST /service-tickets/{id}/start"

  - priority: 14
    category: business_constraint
    check: "Structural integrity, evaluated in this pinned sub-order within the priority: (1) slot belongs to path/body machine_id (ERR_SLOT_ITEM_MISMATCH); (2) serialized_unit_id present for a non-serialized item OR absent for a FALL_PROTECTION item (ERR_SERIALIZED_UNIT_REQUIRED); (3) FALL_PROTECTION qty != 1 (ERR_SERIALIZED_QTY_INVALID); (4) unit.slot_id != request slot or unit.item_id != slot.item_id (ERR_SLOT_ITEM_MISMATCH); (5) RestockOrder on a serialized slot, or POST /serialized-units with a non-FALL_PROTECTION item (ERR_ITEM_NOT_SERIALIZED_CATEGORY); (6) on_hand_qty + qty > capacity on load/registration, or capacity shrink below on_hand_qty (ERR_CAPACITY_EXCEEDED)"
    error_id: "ERR_SLOT_ITEM_MISMATCH | ERR_SERIALIZED_UNIT_REQUIRED | ERR_SERIALIZED_QTY_INVALID | ERR_CAPACITY_EXCEEDED | ERR_ITEM_NOT_SERIALIZED_CATEGORY"
    http_status: 422
    applies_to: "POST /issuances, POST /restock-orders, POST /restock-orders/{id}/load, POST /serialized-units"

  - priority: 15
    category: business_constraint
    check: "Uniqueness: employee_code, location_code, sku, serial_number, (machine_id, slot_code), (job_role_id, item_id) policy pair"
    error_id: "ERR_DUPLICATE_EMPLOYEE_CODE | ERR_DUPLICATE_MACHINE_LOCATION | ERR_DUPLICATE_SKU | ERR_DUPLICATE_SERIAL_NUMBER | ERR_DUPLICATE_SLOT_CODE | ERR_DUPLICATE_POLICY"
    http_status: 409
    applies_to: "POST /employees, POST /machines, POST /items, POST /serialized-units, POST /machines/{id}/slots, POST /issuance-policies"

  - priority: 16
    category: business_constraint
    check: "Segregation of duties: override grantor (Manager X-User-ID) != employee_id; reversing manager != issuance.employee_id"
    error_id: "ERR_SELF_OVERRIDE_FORBIDDEN | ERR_SELF_REVERSAL_FORBIDDEN"
    http_status: 403
    applies_to: "POST /manager-overrides, POST /issuances/{id}/reverse"

  - priority: 17
    category: business_constraint
    check: "Entitlement: an IssuancePolicy row exists for (employee.job_role_id, item_id) at vend time"
    error_id: ERR_ITEM_NOT_ENTITLED
    http_status: 422
    applies_to: "POST /issuances"

  - priority: 18
    category: business_fiscal
    check: "Issuance limit: usage + qty <= effective_limit per effective_limit rule; override draw must fit remaining_qty"
    error_id: "ERR_ISSUANCE_LIMIT_EXCEEDED | ERR_OVERRIDE_QTY_EXCEEDED"
    http_status: 422
    applies_to: "POST /issuances"

  - priority: 19
    category: business_fiscal
    check: "Chargeback close requires a non-empty sweep set or a non-zero adjustment_cents"
    error_id: ERR_EMPTY_CHARGEBACK_BATCH
    http_status: 422
    applies_to: "POST /chargeback-batches/{id}/close"

  - priority: 20
    category: business_referential
    check: "Machine decommission blocked by open RestockOrders (SUGGESTED/PICKED) or open ServiceTickets (OPEN/IN_PROGRESS); audit begin-fieldwork blocked by any overlapping OPEN ChargebackBatch; reversal of an already-billed line requires an OPEN batch for the same cost center"
    error_id: "ERR_OPEN_RESTOCK_ORDERS_EXIST | ERR_OPEN_SERVICE_TICKETS_EXIST | ERR_OPEN_BATCHES_EXIST | ERR_NO_OPEN_CHARGEBACK_BATCH"
    http_status: 409
    applies_to: "PUT /machines/{id}, POST /compliance-audits/{id}/begin-fieldwork, POST /issuances/{id}/reverse"

  - priority: 0
    category: existence
    check: "Request-body shape: required fields present, types valid, enum members valid, integer ranges (qty > 0, capacity > 0, 0 <= par_level < capacity, window ordering) — evaluated before all other checks except auth"
    error_id: ERR_VALIDATION_FAILED
    http_status: 400
    applies_to: "all endpoints"
    note: "priority 0 = request-shape validation; runs after auth (1-2) but before existence (3)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- CostCenter ---
  - method: POST
    path: "/cost-centers"
    description: "Create a cost center"
    roles: [FinanceAnalyst]
    code: 201
    input: [cost_center_code, name]
    output: CostCenter
    side_effects: ["status ACTIVE; ytd_charged_cents = 0"]

  - method: GET
    path: "/cost-centers/{costCenterId}"
    description: "Get a cost center"
    roles: [Any]
    code: 200
    input: []
    output: CostCenter
    side_effects: []

  # --- JobRole ---
  - method: POST
    path: "/job-roles"
    description: "Create a job role"
    roles: [EHSAdministrator]
    code: 201
    input: [role_name, "description?"]
    output: JobRole
    side_effects: []

  - method: GET
    path: "/job-roles/{jobRoleId}"
    description: "Get a job role"
    roles: [Any]
    code: 200
    input: []
    output: JobRole
    side_effects: []

  # --- Item ---
  - method: POST
    path: "/items"
    description: "Create a catalog item"
    roles: [EHSAdministrator]
    code: 201
    input: [sku, name, category, base_list_price_cents, "inspection_interval_days?"]
    output: Item
    side_effects: ["requires_fit_test / serialized_tracking computed from category"]

  - method: GET
    path: "/items/{itemId}"
    description: "Get an item"
    roles: [Any]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: POST
    path: "/items/{itemId}/discontinue"
    description: "Discontinue an item"
    roles: [EHSAdministrator]
    code: 200
    input: []
    output: Item
    side_effects: ["status -> DISCONTINUED"]

  # --- ContractPrice ---
  - method: POST
    path: "/contract-prices"
    description: "Create a contract price tier row for an item"
    roles: [EHSAdministrator]
    code: 201
    input: [item_id, min_period_qty, unit_price_cents, effective_from, effective_to]
    output: ContractPrice
    side_effects: []

  - method: GET
    path: "/contract-prices"
    description: "List contract prices (filter by item_id)"
    roles: [Any]
    code: 200
    input: ["item_id?", "limit?", "offset?"]
    output: "ContractPrice[]"
    side_effects: []

  - method: GET
    path: "/contract-prices/{priceId}"
    description: "Get a contract price row"
    roles: [Any]
    code: 200
    input: []
    output: ContractPrice
    side_effects: []

  # --- IssuancePolicy ---
  - method: POST
    path: "/issuance-policies"
    description: "Create an issuance policy line (job role entitlement)"
    roles: [EHSAdministrator]
    code: 201
    input: [job_role_id, item_id, period_limit_qty, period_window_days]
    output: IssuancePolicy
    side_effects: []

  - method: GET
    path: "/issuance-policies"
    description: "List issuance policies (filter by job_role_id and/or item_id)"
    roles: [Any]
    code: 200
    input: ["job_role_id?", "item_id?", "limit?", "offset?"]
    output: "IssuancePolicy[]"
    side_effects: []

  - method: GET
    path: "/issuance-policies/{policyId}"
    description: "Get an issuance policy"
    roles: [Any]
    code: 200
    input: []
    output: IssuancePolicy
    side_effects: []

  # --- Employee ---
  - method: POST
    path: "/employees"
    description: "Create an employee"
    roles: [EHSAdministrator]
    code: 201
    input: [employee_code, full_name, job_role_id, home_cost_center_id, "is_manager?"]
    output: Employee
    side_effects: ["status ACTIVE; fit_tests = []"]

  - method: GET
    path: "/employees"
    description: "List employees (filter by job_role_id / cost_center_id / status)"
    roles: [Any]
    code: 200
    input: ["job_role_id?", "cost_center_id?", "home_cost_center_id?", "status?", "limit?", "offset?"]
    output: "Employee[]"
    side_effects: []

  - method: GET
    path: "/employees/{employeeId}"
    description: "Get an employee"
    roles: [Any]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: PUT
    path: "/employees/{employeeId}"
    description: "Update employee (status transitions SUSPENDED/ACTIVE/TERMINATED, job role or cost center reassignment, is_manager flag)"
    roles: [EHSAdministrator]
    code: 200
    input: ["status?", "job_role_id?", "home_cost_center_id?", "is_manager?"]
    output: Employee
    side_effects: ["status transitions per Employee state machine; TERMINATED cascades REVOKED to ACTIVE overrides; increments Employee.version"]

  - method: POST
    path: "/employees/{employeeId}/fit-tests"
    description: "Record a respirator fit test for an employee"
    roles: [SafetyOfficer]
    code: 201
    input: [item_id, tested_on, result]
    output: Employee
    side_effects: ["appends fit_tests entry (PASS -> expires_on = tested_on + 365d); entry may supersede validity of older entries per fit_test_validity"]

  # --- VendingMachine ---
  - method: POST
    path: "/machines"
    description: "Register a vending machine"
    roles: [VendingTechnician]
    code: 201
    input: [location_code, site_name, model]
    output: VendingMachine
    side_effects: ["status COMMISSIONING"]

  - method: GET
    path: "/machines"
    description: "List machines (filter by status)"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "VendingMachine[]"
    side_effects: []

  - method: GET
    path: "/machines/{machineId}"
    description: "Get a machine"
    roles: [Any]
    code: 200
    input: []
    output: VendingMachine
    side_effects: []

  - method: PUT
    path: "/machines/{machineId}"
    description: "Machine lifecycle transitions: commission (ACTIVE), take OFFLINE, restore, DECOMMISSION"
    roles: [VendingTechnician]
    code: 200
    input: [status]
    output: VendingMachine
    side_effects: ["per VendingMachine state machine; increments VendingMachine.version"]

  # --- MachineSlot (planogram) ---
  - method: POST
    path: "/machines/{machineId}/slots"
    description: "Create a planogram slot (OCC-guarded by expected_machine_version)"
    roles: [VendingTechnician]
    code: 201
    input: [slot_code, item_id, capacity, par_level, expected_machine_version]
    output: MachineSlot
    side_effects: ["on_hand_qty = 0; increments VendingMachine.version by 1"]

  - method: GET
    path: "/machines/{machineId}/slots"
    description: "List planogram slots of a machine"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "MachineSlot[]"
    side_effects: []

  - method: GET
    path: "/slots"
    description: "List slots across machines (filter by item_id / machine_id)"
    roles: [Any]
    code: 200
    input: ["item_id?", "machine_id?", "limit?", "offset?"]
    output: "MachineSlot[]"
    side_effects: []

  - method: GET
    path: "/slots/{slotId}"
    description: "Get a slot"
    roles: [Any]
    code: 200
    input: []
    output: MachineSlot
    side_effects: []

  - method: PUT
    path: "/slots/{slotId}"
    description: "Update planogram slot (item swap, capacity, par_level); only while machine COMMISSIONING or IN_SERVICE (OCC-guarded)"
    roles: [VendingTechnician]
    code: 200
    input: ["item_id?", "capacity?", "par_level?", expected_slot_version]
    output: MachineSlot
    side_effects: ["increments MachineSlot.version by 1; on_hand_qty unchanged; capacity shrink must keep capacity >= on_hand_qty (ERR_CAPACITY_EXCEEDED)"]

  # --- SerializedUnit ---
  - method: POST
    path: "/serialized-units"
    description: "Register a serialized fall-protection unit into a slot"
    roles: [EHSAdministrator]
    code: 201
    input: [item_id, serial_number, slot_id]
    output: SerializedUnit
    side_effects: ["status IN_STOCK; slot.on_hand_qty += 1 (capacity check)"]

  - method: GET
    path: "/serialized-units"
    description: "List serialized units (filter by item_id / slot_id / issued_to_employee_id / status)"
    roles: [Any]
    code: 200
    input: ["item_id?", "slot_id?", "issued_to_employee_id?", "status?", "limit?", "offset?"]
    output: "SerializedUnit[]"
    side_effects: []

  - method: GET
    path: "/serialized-units/{unitId}"
    description: "Get a serialized unit"
    roles: [Any]
    code: 200
    input: []
    output: SerializedUnit
    side_effects: []

  - method: POST
    path: "/serialized-units/{unitId}/inspect"
    description: "Record an inspection of a serialized unit"
    roles: [SafetyOfficer]
    code: 200
    input: [result, inspected_on]
    output: SerializedUnit
    side_effects: ["per SerializedUnit state machine; PASS refreshes next_inspection_due_on; FAIL -> QUARANTINED"]

  # --- ManagerOverride ---
  - method: POST
    path: "/manager-overrides"
    description: "Grant a manager override for beyond-limit issuance"
    roles: [Manager]
    code: 201
    input: [employee_id, item_id, approved_qty, valid_from, valid_until, reason_code]
    output: ManagerOverride
    side_effects: ["status ACTIVE; consumed_qty = 0; granted_by_user_id from header; window-gap rule enforced"]

  - method: GET
    path: "/manager-overrides"
    description: "List overrides (filter by employee_id / item_id / status)"
    roles: [Any]
    code: 200
    input: ["employee_id?", "item_id?", "status?", "limit?", "offset?"]
    output: "ManagerOverride[]"
    side_effects: []

  - method: GET
    path: "/manager-overrides/{overrideId}"
    description: "Get an override"
    roles: [Any]
    code: 200
    input: []
    output: ManagerOverride
    side_effects: []

  - method: POST
    path: "/manager-overrides/{overrideId}/revoke"
    description: "Revoke an ACTIVE override"
    roles: [Manager]
    code: 200
    input: []
    output: ManagerOverride
    side_effects: ["status ACTIVE -> REVOKED; consumed_qty retained"]

  # --- IssuanceTransaction ---
  - method: POST
    path: "/issuances"
    description: "Vend PPE to the calling employee (badge swipe); idempotent by idempotency_key"
    roles: [Employee]
    code: 201
    input: [machine_id, slot_id, qty, idempotency_key, "serialized_unit_id?", "manager_override_id?"]
    output: IssuanceTransaction
    side_effects:
      - "resolves pricing (contract_price_resolution) and limit split (effective_limit)"
      - "MachineSlot.on_hand_qty -= qty"
      - "if override drawn: ManagerOverride.consumed_qty += override_drawn_qty; CONSUMED at equality"
      - "if serialized: unit -> ISSUED with inspection due date"
      - "restock_par_trigger evaluated after decrement"
      - "increments version of MachineSlot, ManagerOverride (if drawn), SerializedUnit (if any)"

  - method: GET
    path: "/issuances"
    description: "List issuances (filter by employee_id / machine_id / slot_id / item_id / cost_center_id / manager_override_id / status)"
    roles: [Any]
    code: 200
    input: ["employee_id?", "machine_id?", "slot_id?", "item_id?", "cost_center_id?", "manager_override_id?", "serialized_unit_id?", "chargeback_batch_id?", "status?", "limit?", "offset?"]
    output: "IssuanceTransaction[]"
    side_effects: []

  - method: GET
    path: "/issuances/{issuanceId}"
    description: "Get an issuance"
    roles: [Any]
    code: 200
    input: []
    output: IssuanceTransaction
    side_effects: []

  - method: POST
    path: "/issuances/{issuanceId}/reverse"
    description: "Reverse a POSTED issuance (manager action; segregation of duties enforced)"
    roles: [Manager]
    code: 200
    input: []
    output: IssuanceTransaction
    side_effects: ["per IssuanceTransaction REVERSED transition incl. restock auto-cancel cascade and chargeback adjustment"]

  # --- RestockOrder ---
  - method: POST
    path: "/restock-orders"
    description: "Manually create a restock order for a non-serialized slot"
    roles: [VendingTechnician]
    code: 201
    input: [machine_id, slot_id, qty]
    output: RestockOrder
    side_effects: ["status SUGGESTED; suggested_qty computed (committed-aware); source MANUAL"]

  - method: GET
    path: "/restock-orders"
    description: "List restock orders (filter by machine_id / slot_id / item_id / status)"
    roles: [Any]
    code: 200
    input: ["machine_id?", "slot_id?", "item_id?", "status?", "limit?", "offset?"]
    output: "RestockOrder[]"
    side_effects: []

  - method: GET
    path: "/restock-orders/{orderId}"
    description: "Get a restock order"
    roles: [Any]
    code: 200
    input: []
    output: RestockOrder
    side_effects: []

  - method: POST
    path: "/restock-orders/{orderId}/pick"
    description: "Pick a SUGGESTED restock order"
    roles: [VendingTechnician]
    code: 200
    input: []
    output: RestockOrder
    side_effects: ["status SUGGESTED -> PICKED"]

  - method: POST
    path: "/restock-orders/{orderId}/load"
    description: "Load a PICKED restock order into the machine slot"
    roles: [VendingTechnician]
    code: 200
    input: []
    output: RestockOrder
    side_effects: ["status PICKED -> LOADED; MachineSlot.on_hand_qty += qty"]

  - method: POST
    path: "/restock-orders/{orderId}/cancel"
    description: "Cancel a SUGGESTED or PICKED restock order"
    roles: [VendingTechnician]
    code: 200
    input: []
    output: RestockOrder
    side_effects: ["status -> CANCELLED"]

  # --- ServiceTicket ---
  - method: POST
    path: "/service-tickets"
    description: "Open a service ticket with a half-open service window"
    roles: [VendingTechnician]
    code: 201
    input: [machine_id, issue_code, window_start, window_end]
    output: ServiceTicket
    side_effects: ["status OPEN; overlap rule enforced"]

  - method: GET
    path: "/service-tickets"
    description: "List service tickets (filter by machine_id / status)"
    roles: [Any]
    code: 200
    input: ["machine_id?", "status?", "limit?", "offset?"]
    output: "ServiceTicket[]"
    side_effects: []

  - method: GET
    path: "/service-tickets/{ticketId}"
    description: "Get a service ticket"
    roles: [Any]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []

  - method: POST
    path: "/service-tickets/{ticketId}/start"
    description: "Start service within its window; machine enters IN_SERVICE; open restocks cancelled"
    roles: [VendingTechnician]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["machine -> IN_SERVICE; SUGGESTED/PICKED restocks of machine -> CANCELLED"]

  - method: POST
    path: "/service-tickets/{ticketId}/resolve"
    description: "Resolve an IN_PROGRESS ticket; machine returns ACTIVE; restock sweep runs"
    roles: [VendingTechnician]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["machine -> ACTIVE; post-service AUTO_PAR restock sweep"]

  # --- ChargebackBatch ---
  - method: POST
    path: "/chargeback-batches"
    description: "Open a chargeback batch for a cost center and period"
    roles: [FinanceAnalyst]
    code: 201
    input: [cost_center_id, period_start, period_end]
    output: ChargebackBatch
    side_effects: ["status OPEN; period-overlap rule enforced"]

  - method: GET
    path: "/chargeback-batches"
    description: "List chargeback batches (filter by cost_center_id / status)"
    roles: [Any]
    code: 200
    input: ["cost_center_id?", "status?", "limit?", "offset?"]
    output: "ChargebackBatch[]"
    side_effects: []

  - method: GET
    path: "/chargeback-batches/{batchId}"
    description: "Get a chargeback batch"
    roles: [Any]
    code: 200
    input: []
    output: ChargebackBatch
    side_effects: []

  - method: POST
    path: "/chargeback-batches/{batchId}/close"
    description: "Close an OPEN batch: sweep POSTED lines, compute snapshot/rerate/admin-fee totals, bump cost center ytd"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: ChargebackBatch
    side_effects: ["per ChargebackBatch OPEN -> CLOSED transition"]

  - method: POST
    path: "/chargeback-batches/{batchId}/dispute"
    description: "Manager disputes a CLOSED batch"
    roles: [Manager]
    code: 200
    input: []
    output: ChargebackBatch
    side_effects: ["status CLOSED -> DISPUTED"]

  - method: POST
    path: "/chargeback-batches/{batchId}/settle"
    description: "Settle a CLOSED or DISPUTED batch"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: ChargebackBatch
    side_effects: ["status -> SETTLED"]

  # --- ComplianceAudit ---
  - method: POST
    path: "/compliance-audits"
    description: "Create a compliance audit case"
    roles: [ComplianceAuditor]
    code: 201
    input: [scope, period_start, period_end]
    output: ComplianceAudit
    side_effects: ["status DRAFT"]

  - method: GET
    path: "/compliance-audits/{auditId}"
    description: "Get a compliance audit"
    roles: [Any]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: []

  - method: POST
    path: "/compliance-audits/{auditId}/begin-fieldwork"
    description: "Begin fieldwork; requires no overlapping OPEN chargeback batches"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: ["status DRAFT -> FIELDWORK"]

  - method: POST
    path: "/compliance-audits/{auditId}/file-findings"
    description: "Compute and file findings (audit_exceptions)"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: ["status FIELDWORK -> FINDINGS_FILED; exceptions_count and findings_detail computed"]

  - method: POST
    path: "/compliance-audits/{auditId}/close"
    description: "Close a FINDINGS_FILED audit"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: ["status FINDINGS_FILED -> CLOSED"]

  # --- Reports (computed read) ---
  - method: GET
    path: "/reports/consumption"
    description: "Consumption report: POSTED (non-reversed) issuance lines for a cost center within [period_start, period_end) half-open"
    roles: [Any]
    code: 200
    input: [cost_center_id, period_start, period_end]
    output: "{ cost_center_id: string, period_start: string, period_end: string, line_count: integer, total_qty: integer, total_amount_cents: integer }"
    side_effects: []

  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Server startup default before any call is exactly 2026-05-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. Each set triggers the system sweeps (override expiry, inspection due/quarantine, fit-test expiry)."
    roles: [EHSAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["runs override_expiry_sweep, inspection_due_sweep, fit_test_validity expiry sweep"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role missing, role undeclared, or entity-backed X-User-ID does not resolve to an existing Employee" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for endpoint, or Manager role asserted by an Employee with is_manager == false" }
  # --- request shape ---
  - { id: ERR_VALIDATION_FAILED, http: 400, condition: "Missing required field, type mismatch, invalid enum member, or integer range violation (qty <= 0, capacity <= 0, par_level outside [0, capacity), window end <= start, valid_until < valid_from, period_end <= period_start, negative prices)" }
  # --- existence (one per path/body resource) ---
  - { id: ERR_COST_CENTER_NOT_FOUND, http: 404, condition: "costCenterId / cost_center_id does not exist" }
  - { id: ERR_JOB_ROLE_NOT_FOUND, http: 404, condition: "jobRoleId / job_role_id does not exist" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "itemId / item_id does not exist" }
  - { id: ERR_CONTRACT_PRICE_NOT_FOUND, http: 404, condition: "priceId does not exist" }
  - { id: ERR_EMPLOYEE_NOT_FOUND, http: 404, condition: "employeeId / employee_id does not exist" }
  - { id: ERR_MACHINE_NOT_FOUND, http: 404, condition: "machineId / machine_id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "slotId / slot_id does not exist" }
  - { id: ERR_SERIALIZED_UNIT_NOT_FOUND, http: 404, condition: "unitId / serialized_unit_id does not exist" }
  - { id: ERR_MANAGER_OVERRIDE_NOT_FOUND, http: 404, condition: "overrideId / manager_override_id does not exist" }
  - { id: ERR_ISSUANCE_NOT_FOUND, http: 404, condition: "issuanceId does not exist" }
  - { id: ERR_RESTOCK_ORDER_NOT_FOUND, http: 404, condition: "orderId does not exist" }
  - { id: ERR_SERVICE_TICKET_NOT_FOUND, http: 404, condition: "ticketId does not exist" }
  - { id: ERR_CHARGEBACK_BATCH_NOT_FOUND, http: 404, condition: "batchId does not exist" }
  - { id: ERR_COMPLIANCE_AUDIT_NOT_FOUND, http: 404, condition: "auditId does not exist" }
  # --- idempotency / OCC ---
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key reused with a different payload" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_machine_version / expected_slot_version does not match the parent's current version" }
  # --- state ---
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 409, condition: "Vend attempted by SUSPENDED or TERMINATED employee" }
  - { id: ERR_MACHINE_NOT_ACTIVE, http: 409, condition: "Vend requires machine ACTIVE; load requires ACTIVE or OFFLINE; slot create requires COMMISSIONING/ACTIVE/IN_SERVICE; unit registration requires COMMISSIONING or ACTIVE; service start requires ACTIVE or OFFLINE" }
  - { id: ERR_MACHINE_NO_PLANOGRAM, http: 409, condition: "Commission requires >= 1 planogram slot" }
  - { id: ERR_ITEM_DISCONTINUED, http: 409, condition: "Item is DISCONTINUED (vend, slot create, restock create, unit registration)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid from-state (e.g. PUT /employees status transition not allowed from current state; PUT /machines with an unsupported target)" }
  - { id: ERR_OVERRIDE_NOT_ACTIVE, http: 409, condition: "Override not ACTIVE, window does not cover current date, or manager_override_id does not match the unique covering override" }
  - { id: ERR_SERIALIZED_UNIT_NOT_ISSUABLE, http: 409, condition: "Unit not IN_STOCK, unit slot mismatch, or inspect on a non-issuable state" }
  - { id: ERR_RESTOCK_ORDER_INVALID_STATE, http: 409, condition: "pick/load/cancel from a state other than the allowed from-state" }
  - { id: ERR_SERVICE_TICKET_INVALID_STATE, http: 409, condition: "start/resolve from a state other than the allowed from-state" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "close/dispute/settle from a state other than the allowed from-state" }
  - { id: ERR_AUDIT_INVALID_STATE, http: 409, condition: "begin-fieldwork/file-findings/close from a state other than the allowed from-state" }
  - { id: ERR_ISSUANCE_ALREADY_REVERSED, http: 409, condition: "Reverse on a non-POSTED issuance" }
  # --- safety ---
  - { id: ERR_FIT_TEST_REQUIRED, http: 403, condition: "Respirator vend without a current PASS fit test for the item" }
  - { id: ERR_REGULATED_ITEM_INSPECTION_DUE, http: 409, condition: "Employee holds another unit of the same fall-protection item in INSPECTION_DUE or QUARANTINED" }
  # --- temporal ---
  - { id: ERR_SERVICE_WINDOW_OVERLAP, http: 409, condition: "Half-open service window intersects another OPEN/IN_PROGRESS ticket for the machine (adjacency allowed)" }
  - { id: ERR_OVERRIDE_WINDOW_OVERLAP, http: 409, condition: "Closed override window for the same (employee, item) fails the >= 1 full calendar day gap rule against an ACTIVE override" }
  - { id: ERR_CONTRACT_PRICE_WINDOW_CONFLICT, http: 409, condition: "Closed-interval overlap with an existing ContractPrice window for the same item" }
  - { id: ERR_BATCH_PERIOD_OVERLAP, http: 409, condition: "Half-open batch period overlaps an existing batch for the same cost center" }
  - { id: ERR_SERVICE_WINDOW_NOT_REACHED, http: 409, condition: "Ticket start attempted outside [window_start, window_end)" }
  # --- structural constraint ---
  - { id: ERR_SLOT_ITEM_MISMATCH, http: 422, condition: "slot_id does not belong to machine_id, or unit.slot_id != request slot_id, or unit.item_id != slot.item_id" }
  - { id: ERR_SERIALIZED_UNIT_REQUIRED, http: 422, condition: "FALL_PROTECTION vend without serialized_unit_id, or serialized_unit_id passed for a non-serialized item" }
  - { id: ERR_SERIALIZED_QTY_INVALID, http: 422, condition: "FALL_PROTECTION vend with qty != 1" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Load or unit registration would push on_hand_qty above capacity; or capacity shrink below on_hand_qty" }
  - { id: ERR_ITEM_NOT_SERIALIZED_CATEGORY, http: 422, condition: "POST /serialized-units with a non-FALL_PROTECTION item, or RestockOrder for a serialized slot" }
  - { id: ERR_DUPLICATE_EMPLOYEE_CODE, http: 409, condition: "employee_code already exists" }
  - { id: ERR_DUPLICATE_MACHINE_LOCATION, http: 409, condition: "location_code already exists" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "sku already exists" }
  - { id: ERR_DUPLICATE_SERIAL_NUMBER, http: 409, condition: "serial_number already exists" }
  - { id: ERR_DUPLICATE_SLOT_CODE, http: 409, condition: "(machine_id, slot_code) already exists" }
  - { id: ERR_DUPLICATE_POLICY, http: 409, condition: "(job_role_id, item_id) policy already exists" }
  - { id: ERR_SELF_OVERRIDE_FORBIDDEN, http: 403, condition: "Manager granting an override to themselves" }
  - { id: ERR_SELF_REVERSAL_FORBIDDEN, http: 403, condition: "Manager reversing their own vend" }
  - { id: ERR_ITEM_NOT_ENTITLED, http: 422, condition: "No IssuancePolicy for (employee.job_role_id, item_id)" }
  # --- fiscal ---
  - { id: ERR_ISSUANCE_LIMIT_EXCEEDED, http: 422, condition: "usage + qty exceeds base limit and no covering override supplied" }
  - { id: ERR_OVERRIDE_QTY_EXCEEDED, http: 422, condition: "Override draw exceeds remaining_qty" }
  - { id: ERR_EMPTY_CHARGEBACK_BATCH, http: 422, condition: "Close with empty sweep set and zero adjustment_cents" }
  # --- referential ---
  - { id: ERR_OPEN_RESTOCK_ORDERS_EXIST, http: 409, condition: "Decommission blocked by SUGGESTED/PICKED restock orders" }
  - { id: ERR_OPEN_SERVICE_TICKETS_EXIST, http: 409, condition: "Decommission blocked by OPEN/IN_PROGRESS service tickets" }
  - { id: ERR_OPEN_BATCHES_EXIST, http: 409, condition: "Audit fieldwork blocked by overlapping OPEN chargeback batch" }
  - { id: ERR_NO_OPEN_CHARGEBACK_BATCH, http: 409, condition: "Reversal of a billed line requires an OPEN batch for the same cost center" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EHSAdministrator
    description: "EHS program administrator: catalog, job roles, issuance policies, contract pricing, employee administration, serialized stock registration, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /items, POST /items/{id}/discontinue"
      - "POST /job-roles"
      - "POST /issuance-policies"
      - "POST /contract-prices"
      - "POST /employees, PUT /employees/{id}"
      - "POST /serialized-units"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: Manager
    description: "Line manager: grants/revokes issuance overrides, reverses vends, disputes chargebacks; cannot act on self (segregation of duties)"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /manager-overrides, POST /manager-overrides/{id}/revoke"
      - "POST /issuances/{id}/reverse"
      - "POST /chargeback-batches/{id}/dispute"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: Employee
    description: "Front-line worker: self-service vending against own badge identity"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /issuances"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: VendingTechnician
    description: "Vending field technician: machine registration and lifecycle, planogram slots, restock orders, service tickets"
    identity: opaque
    exclusive_operations:
      - "POST /machines, PUT /machines/{id}"
      - "POST /machines/{id}/slots, PUT /slots/{id}"
      - "POST /restock-orders, POST /restock-orders/{id}/pick, POST /restock-orders/{id}/load, POST /restock-orders/{id}/cancel"
      - "POST /service-tickets, POST /service-tickets/{id}/start, POST /service-tickets/{id}/resolve"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: SafetyOfficer
    description: "Safety officer: records respirator fit tests and serialized-unit inspections"
    identity: opaque
    exclusive_operations:
      - "POST /employees/{id}/fit-tests"
      - "POST /serialized-units/{id}/inspect"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: FinanceAnalyst
    description: "Finance analyst: cost centers and chargeback batch lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /cost-centers"
      - "POST /chargeback-batches, POST /chargeback-batches/{id}/close, POST /chargeback-batches/{id}/settle"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: ComplianceAuditor
    description: "Compliance auditor: audit case lifecycle only; read access otherwise; cannot create or modify business data"
    identity: opaque
    exclusive_operations:
      - "POST /compliance-audits, POST /compliance-audits/{id}/begin-fieldwork, POST /compliance-audits/{id}/file-findings, POST /compliance-audits/{id}/close"
    shared_operations: ["all GET endpoints (via Any)"]

  - name: Any
    description: "Shared read surface for every authenticated role"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /cost-centers/{id}, GET /job-roles/{id}, GET /items/{id}"
      - "GET /contract-prices, GET /contract-prices/{id}, GET /issuance-policies, GET /issuance-policies/{id}"
      - "GET /employees, GET /employees/{id}"
      - "GET /machines, GET /machines/{id}, GET /machines/{id}/slots, GET /slots, GET /slots/{id}"
      - "GET /serialized-units, GET /serialized-units/{id}"
      - "GET /manager-overrides, GET /manager-overrides/{id}"
      - "GET /issuances, GET /issuances/{id}"
      - "GET /restock-orders, GET /restock-orders/{id}"
      - "GET /service-tickets, GET /service-tickets/{id}"
      - "GET /chargeback-batches, GET /chargeback-batches/{id}"
      - "GET /compliance-audits/{id}"
      - "GET /reports/consumption"
