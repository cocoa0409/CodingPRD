              payload: { player_id: "${player_id}", game_id: "${game_id}", trigger_source: "UNAFFILIATED_OBSERVER" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - call: "POST /concussion-program/sideline-evaluations"
