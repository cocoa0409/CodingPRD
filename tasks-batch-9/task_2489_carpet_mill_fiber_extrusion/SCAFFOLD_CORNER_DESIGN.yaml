          - complexity_profile.role_model
        distinguishing_aspect: |
          The role is right and the evidence is right; only the acting X-User-ID is wrong. A
          CertificationOfficer whose user id matches the cited test's tested_by_user_id is refused,
          and the identical payload succeeds under a different officer id — so the check is on the
          user identity, not the role.
        test_recipe:
          setup:
            - "BACKED solution-dyed run PR-01 with RollGood RG-01 and a PASSing FLAMMABILITY_PILL test (18.0) recorded by qa-tech-1."
