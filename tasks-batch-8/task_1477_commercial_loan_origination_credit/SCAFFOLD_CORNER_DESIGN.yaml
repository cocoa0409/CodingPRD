# =============================================================================
# §1.9 Scaffold Corner Design — Commercial Loan Origination & Credit Memo
# Breadth probe: enumerates every testable claim of SCAFFOLD.yaml §1.1–§1.7
# NOT already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Corners that
# ARE covered by a §1.8 instance appear as excluded_because stubs.
# All money is integer cents; ratios 4dp round_half_up; default logical clock
# is 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: bank_officer_and_borrower_creation_roundtrip
        claim_type: creation
        grounds: [entities.BankOfficer, entities.Borrower, "endpoints.POST /credit/borrowers"]
        distinguishing_aspect: "POST with all required fields returns 201 with the full stored entity; a subsequent GET returns the identical representation."
        test_recipe:
          setup: ["Empty database; one BankAdmin-registered officer to act as RelationshipManager"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
          trigger:
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01", is_reg_o_insider: true }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "GET /credit/borrowers/${bor}", as: RelationshipManager, as_user_id: "${rm}", captures: { echo_name: $.data.legal_name } }
          assert:
            - "POST /credit/borrowers returned 201 and Borrower.${bor} carries a server-minted UUID id, created_at, updated_at, version == 1"
            - "GET /credit/borrowers/${bor} echoes legal_name == 'Beacon Holdings LLC', naics_code == '332710', relationship_since == '2018-01-01', is_reg_o_insider == true"
            - "Borrower.${bor}.status == ACTIVE at creation"

      - name: creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Borrower.fields.is_reg_o_insider, entities.Appraiser.fields.max_concurrent_engagements, entities.Appraiser.fields.status]
        distinguishing_aspect: "Omitting optional fields applies the declared defaults: borrower is_reg_o_insider false, appraiser max_concurrent_engagements 2 and status ELIGIBLE."
        test_recipe:
          setup: ["Officers rm and apm registered"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "April Appraisals" }, as: BankAdmin, captures: { apm: $.data.id } }
          trigger:
            - { call: "POST /credit/borrowers", payload: { legal_name: "Default Test Co", naics_code: "441110", relationship_since: "2020-03-15" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/appraisers", payload: { name: "AppraisalCo", license_number: "LIC-100" }, as: AppraisalManager, as_user_id: "${apm}", captures: { apr: $.data.id } }
          assert:
            - "Borrower.${bor}.is_reg_o_insider == false (declared default) and status == ACTIVE"
            - "Borrower.${bor}.committed_exposure_cents == 0, funded_exposure_cents == 0, total_exposure_cents == 0 (computed defaults)"
            - "Appraiser.${apr}.max_concurrent_engagements == 2 (declared default) and status == ELIGIBLE"

      - name: missing_required_fields_rejected
        claim_type: required_fields
        grounds: ["validations[priority=4]", entities.Borrower.fields.legal_name, entities.LoanApplication.fields.term_months, entities.FinancialStatement.fields.ebitda_cents]
        distinguishing_aspect: "Each create with a missing source:input field (no default) fails with ERR_VALIDATION: borrower without legal_name, application without term_months, statement without ebitda_cents."
        test_recipe:
          setup: ["Officer rm + analyst an; one borrower and one INTAKE application exist (for the statement call)"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /credit/borrowers", payload: { naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { err1: $.data.error_id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000 }, as: RelationshipManager, as_user_id: "${rm}", captures: { err2: $.data.error_id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 20000000, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 450000, existing_annual_debt_service_cents: 2500000, total_assets_cents: 80000000, total_liabilities_cents: 40000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { err3: $.data.error_id } }
          assert:
            - "borrower create without legal_name: status 400, error_id == ERR_VALIDATION"
            - "application create without term_months: status 400, error_id == ERR_VALIDATION"
            - "statement create without ebitda_cents: status 400, error_id == ERR_VALIDATION"

      - name: field_range_enum_and_date_constraints_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=4]", entities.LoanApplication.fields.term_months, entities.LoanApplication.fields.product_type, entities.Appraisal.fields.engagement_end_date, entities.CommitteeSession.fields.ends_at]
        distinguishing_aspect: "Schema-level constraints fire per field: term below the 12-month floor, zero amount, unknown enum member, engagement end before start, and a zero-length session window all return ERR_VALIDATION — and the date-order failure surfaces even when the application state would also reject the call (priority 4 beats priority 6)."
        test_recipe:
          setup: ["Officers rm, an, apm, ch; one borrower; one application in INTAKE; one ELIGIBLE appraiser"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "April Appraisals" }, as: BankAdmin, captures: { apm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Cheryl Chair" }, as: BankAdmin, captures: { ch: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/appraisers", payload: { name: "AppraisalCo", license_number: "LIC-100" }, as: AppraisalManager, as_user_id: "${apm}", captures: { apr: $.data.id } }
          trigger:
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 6 }, as: RelationshipManager, as_user_id: "${rm}", captures: { err1: $.data.error_id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 0, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { err2: $.data.error_id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: BRIDGE_LOAN, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { err3: $.data.error_id } }
            - { call: "POST /credit/appraisals", payload: { loan_application_id: "${app}", appraiser_id: "${apr}", collateral_class: REAL_ESTATE, engagement_start_date: "2026-08-07", engagement_end_date: "2026-08-03" }, as: AppraisalManager, as_user_id: "${apm}", captures: { err4: $.data.error_id } }
            - { call: "POST /credit/committee-sessions", payload: { level: STANDARD, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T14:00:00Z" }, as: CommitteeChair, as_user_id: "${ch}", captures: { err5: $.data.error_id } }
          assert:
            - "term_months 6 (< 12): status 400, error_id == ERR_VALIDATION"
            - "requested_amount_cents 0 (not > 0): status 400, error_id == ERR_VALIDATION"
            - "product_type BRIDGE_LOAN (not an enum member): status 400, error_id == ERR_VALIDATION"
            - "engagement_end_date < engagement_start_date: status 400, error_id == ERR_VALIDATION (schema beats the INTAKE-state rejection the same call would also earn)"
            - "session ends_at == starts_at (not strictly greater): status 400, error_id == ERR_VALIDATION"

      - name: application_computed_fields_null_before_underwriting
        claim_type: computed_fields
        grounds: [entities.LoanApplication.fields.dscr_standard, entities.LoanApplication.fields.risk_rating, entities.LoanApplication.fields.bank_hold_amount_cents, entities.LoanApplication.fields.bank_hold_fee_cents]
        distinguishing_aspect: "A freshly created application exposes every computed underwriting field as null/0 — DSCR, rating, sizing, collateral aggregates and hold fields carry no values before their producing transitions run."
        test_recipe:
          setup: ["Officer rm; one borrower"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beacon Holdings LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 30000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
          trigger:
            - { call: "GET /credit/loan-applications/${app}", as: RelationshipManager, as_user_id: "${rm}" }
          assert:
            - "dscr_standard == null, dscr_stress == null, risk_rating == null, rating_basis == null (null until finalize-spreads)"
            - "proposed_amount_cents == null and committee_level_required == null (computed only at submit-to-committee / decision creation)"
            - "total_appraised_value_cents == 0, total_eligible_collateral_cents == 0, total_liquidation_collateral_cents == 0"
            - "bank_hold_amount_cents == 0 and bank_hold_fee_cents == null (no commitment letter exists)"
            - "funded_amount_cents == 0 and originating_officer_id == ${rm}"

      - name: unknown_ids_return_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed but nonexistent UUID yields 404 ERR_NOT_FOUND on a plain GET, on a nested-action POST, and on a sibling collection GET — existence is checked before any state logic."
        test_recipe:
          setup: ["Officers rm and an registered; no other data"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
          trigger:
            - { call: "GET /credit/borrowers/00000000-0000-0000-0000-000000000000", as: CreditAnalyst, as_user_id: "${an}", captures: { err1: $.data.error_id } }
            - { call: "POST /credit/loan-applications/00000000-0000-0000-0000-000000000000/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}", captures: { err2: $.data.error_id } }
            - { call: "GET /credit/commitment-letters/00000000-0000-0000-0000-000000000000", as: CreditAnalyst, as_user_id: "${an}", captures: { err3: $.data.error_id } }
          assert:
            - "GET unknown borrower: status 404, error_id == ERR_NOT_FOUND"
            - "POST submit on unknown application: status 404, error_id == ERR_NOT_FOUND (not 409 — existence precedes state)"
            - "GET unknown commitment letter: status 404, error_id == ERR_NOT_FOUND"

      - name: borrower_list_pagination_defaults_and_offsets
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET /credit/borrowers"]
        distinguishing_aspect: "List responses carry the fixed envelope pagination fields with declared defaults (limit 10, offset 0) and has_more/total_count track the window exactly across offset steps."
        test_recipe:
          setup: ["Officer rm; three borrowers created"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Alpha LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { b1: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beta LLC", naics_code: "441110", relationship_since: "2019-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { b2: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Gamma LLC", naics_code: "531120", relationship_since: "2020-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { b3: $.data.id } }
          trigger:
            - { call: "GET /credit/borrowers", as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "GET /credit/borrowers?limit=2", as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "GET /credit/borrowers?limit=2&offset=2", as: RelationshipManager, as_user_id: "${rm}" }
          assert:
            - "default GET: response_type == 'array', data length 3, limit == 10, offset == 0, total_count == 3, has_more == false (declared defaults)"
            - "GET ?limit=2: data length 2, total_count == 3, has_more == true"
            - "GET ?limit=2&offset=2: data length 1, total_count == 3, has_more == false"
            - "every element carries meta block with api_request_id and api_request_timestamp"

      - name: loan_application_list_filters
        claim_type: listing
        grounds: ["endpoints.GET /credit/loan-applications"]
        distinguishing_aspect: "The borrower_id and status query filters each narrow the list independently: borrower_id selects only that borrower's applications and status selects only matching states."
        test_recipe:
          setup: ["Officer rm + analyst an; two borrowers; app1 (borrower1) driven to SPREADING with one statement; app2 (borrower2) left in INTAKE"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Alpha LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor1: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Beta LLC", naics_code: "441110", relationship_since: "2019-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor2: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor1}", product_type: EQUIPMENT, requested_amount_cents: 5000000, term_months: 36 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app1: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app1}", period_end_date: "2025-12-31", revenue_cents: 40000000, ebitda_cents: 20000000, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 0, total_assets_cents: 100000000, total_liabilities_cents: 20000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt1: $.data.id } }
            - { call: "POST /credit/loan-applications/${app1}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor2}", product_type: CRE_TERM, requested_amount_cents: 7000000, term_months: 48 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app2: $.data.id } }
          trigger:
            - { call: "GET /credit/loan-applications?borrower_id=${bor1}", as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "GET /credit/loan-applications?status=SPREADING", as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "GET /credit/loan-applications?status=INTAKE", as: CreditAnalyst, as_user_id: "${an}" }
          assert:
            - "?borrower_id=${bor1}: exactly 1 application (${app1}); ${app2} excluded"
            - "?status=SPREADING: contains ${app1} only (submitted), not ${app2}"
            - "?status=INTAKE: contains ${app2} only"
            - "unfiltered GET /credit/loan-applications returns both (total_count == 2)"

      - name: application_version_increments_on_each_mutation
        claim_type: system_fields
        grounds: [entities.LoanApplication.fields.status, state_machines.LoanApplication.INTAKE_to_SPREADING, state_machines.LoanApplication.SPREADING_to_APPRAISAL_REVIEW]
        distinguishing_aspect: "The common-field version starts at 1 at creation and increments by exactly 1 on every mutating transition of the application (submit, finalize-spreads), while child-only mutations in between leave it untouched."
        test_recipe:
          setup: ["Clean 20,000,000 application with one statement (revenue 40,000,000; ebitda 20,000,000 => no exceptions)"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Window Watchers LLC", naics_code: "332710", relationship_since: "2015-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 20000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id, v0: $.data.version } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 40000000, ebitda_cents: 20000000, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 0, total_assets_cents: 100000000, total_liabilities_cents: 20000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
          trigger:
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}", captures: { v1: $.data.version, u1: $.data.updated_at } }
            - { call: "POST /credit/financial-statements/${stmt}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications/${app}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { v2: $.data.version, u2: $.data.updated_at } }
          assert:
            - "LoanApplication.${app}.version == 1 at creation"
            - "after submit: version == 2 (status mutation increments the parent version)"
            - "after finalize-spreads: version == 3 (statement spread/finalize in between did NOT bump the application's version)"
            - "updated_at at finalize-spreads > updated_at at submit (refreshed on every mutation)"

      - name: fk_reverse_reachability_full_child_set
        claim_type: parent_relationships
        grounds: [entities.LoanApplication.fields.borrower_id, entities.Appraisal.fields.appraiser_id, entities.CommitteeDecision.fields.committee_session_id, entities.CommitmentLetter.fields.loan_application_id, entities.DocumentChecklistItem.fields.is_required]
        distinguishing_aspect: "Every FK declared in §1.1 is reverse-reachable through its declared GET: one application driven to CLOSING is discoverable from its borrower, and its appraisal, decision, letter, checklist items, covenant, participation, funding authorization and statements are each listed by their parent-scoped GETs with exact cardinalities."
        test_recipe:
          setup:
            - "Application fully approved and advanced to CLOSING (clean 200,000,000 deal; STANDARD committee; letter ISSUED then ACCEPTED; required DOCUMENT and CLOSING_CONDITION items APPROVED; one covenant; one PROPOSED participation of 10,000,000; one REQUESTED FundingAuthorization of 50,000,000)"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "April Appraisals" }, as: BankAdmin, captures: { apm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Cheryl Chair" }, as: BankAdmin, captures: { ch: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Member One" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Member Two" }, as: BankAdmin, captures: { m2: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Polly Policy" }, as: BankAdmin, captures: { po: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Adam Admin" }, as: BankAdmin, captures: { adm: $.data.id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Meridian Industrial Parks", naics_code: "531120", relationship_since: "2010-01-01" }, as: RelationshipManager, as_user_id: "${rm}", captures: { bor: $.data.id } }
            - { call: "POST /credit/loan-applications", payload: { borrower_id: "${bor}", product_type: CRE_TERM, requested_amount_cents: 200000000, term_months: 60 }, as: RelationshipManager, as_user_id: "${rm}", captures: { app: $.data.id } }
            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app}", period_end_date: "2025-12-31", revenue_cents: 200000000, ebitda_cents: 100000000, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 0, total_assets_cents: 500000000, total_liabilities_cents: 200000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt: $.data.id } }
            - { call: "POST /credit/loan-applications/${app}/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}" }
            - { call: "POST /credit/financial-statements/${stmt}/spread", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/financial-statements/${stmt}/finalize", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/loan-applications/${app}/finalize-spreads", payload: {}, as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "POST /credit/appraisers", payload: { name: "AppraisalCo", license_number: "LIC-100" }, as: AppraisalManager, as_user_id: "${apm}", captures: { apr: $.data.id } }
            - { call: "POST /credit/appraisals", payload: { loan_application_id: "${app}", appraiser_id: "${apr}", collateral_class: REAL_ESTATE, engagement_start_date: "2026-08-03", engagement_end_date: "2026-08-07" }, as: AppraisalManager, as_user_id: "${apm}", captures: { aprl: $.data.id } }
            - { call: "POST /credit/appraisals/${aprl}/receive-report", payload: { appraised_value_cents: 400000000, orderly_liquidation_value_cents: 380000000 }, as: AppraisalManager, as_user_id: "${apm}" }
            - { call: "POST /credit/appraisals/${aprl}/review", payload: { outcome: ACCEPTED }, as: AppraisalManager, as_user_id: "${apm}" }
