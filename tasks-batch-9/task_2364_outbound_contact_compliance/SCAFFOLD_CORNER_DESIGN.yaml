  - name: outside_calling_window_error_is_reachable
    claim_type: Violation → Error
    grounds:
    - validations[priority=94]
    - errors[ERR_OUTSIDE_CALLING_WINDOW]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / calling_window_error_wins_over_cooldown_error
      rationale: The named §1.8 instance dials at recipient local 21:00 with the cooldown also violated and asserts ERR_OUTSIDE_CALLING_WINDOW, which is this rule's violation claim.
  - name: contact_cooldown_error_is_reachable
    claim_type: Violation → Error
    grounds:
    - validations[priority=110]
    - errors[ERR_CONTACT_COOLDOWN_ACTIVE]
    excluded_because:
      difficulty_instance: boundary_precision_check / contact_cooldown_closed_buffer_rejects_exact_boundary
      rationale: The named §1.8 instance dials at exactly 30 minutes and asserts ERR_CONTACT_COOLDOWN_ACTIVE, then at 30 minutes and one second and asserts success.
  - name: suppressed_number_error_is_reachable
    claim_type: Violation → Error
    grounds:
    - validations[priority=75]
    - errors[ERR_SUPPRESSED_NUMBER]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / suppression_error_wins_over_attempt_budget_error
      rationale: The named §1.8 instance puts the recipient on an ACTIVE INTERNAL list with the budget also exhausted and asserts ERR_SUPPRESSED_NUMBER.
  - name: no_consent_on_record_error_is_reachable_for_a_suspended_consent
    claim_type: Violation → Error
    grounds:
    - validations[priority=76]
    - errors[ERR_NO_CONSENT_ON_RECORD]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / attempt_blocked_while_consent_record_suspended
      rationale: The named §1.8 instance suspends the only consent and asserts ERR_NO_CONSENT_ON_RECORD, then reinstates it and asserts the dial succeeds.
  - name: dialer_profile_not_approved_error_is_reachable
    claim_type: Violation → Error
    grounds:
    - validations[priority=86]
    - errors[ERR_DIALER_PROFILE_NOT_APPROVED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / campaign_launch_blocked_until_dialer_profile_approved
      rationale: The named §1.8 instance launches against a DRAFT profile and asserts ERR_DIALER_PROFILE_NOT_APPROVED, then approves the profile and asserts the launch succeeds.
  - name: empty_target_set_error_is_reachable
    claim_type: Violation → Error
    grounds:
    - validations[priority=89]
    - errors[ERR_EMPTY_TARGET_SET]
    excluded_because:
      difficulty_instance: boundary_precision_check / fully_suppressed_target_set_blocks_launch_at_zero
      rationale: The named §1.8 instance scrubs every target away and asserts eligible_target_count 0 with ERR_EMPTY_TARGET_SET at launch.
  - name: scrub_expired_error_is_reachable
    claim_type: Violation → Error
    grounds:
    - validations[priority=95]
    - errors[ERR_SCRUB_EXPIRED]
    excluded_because:
      difficulty_instance: boundary_precision_check / scrub_validity_expires_exactly_at_expires_at
      rationale: The named §1.8 instance dials one second after expires_at and asserts ERR_SCRUB_EXPIRED, and exactly at expires_at minus one second and asserts success.
  - name: policy_period_overlap_error_is_reachable
    claim_type: Violation → Error
    grounds:
    - validations[priority=101]
    - errors[ERR_POLICY_PERIOD_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / calling_window_policy_periods_reject_overlap_but_allow_adjacency
      rationale: The named §1.8 instance rejects a one-second overlap with ERR_POLICY_PERIOD_OVERLAP and accepts the exactly adjacent period.
