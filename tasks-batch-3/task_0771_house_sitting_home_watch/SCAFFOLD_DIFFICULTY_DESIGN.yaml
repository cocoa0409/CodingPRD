            - call: "POST /home-watch/bookings/${bk_id}/assign"
              payload: { sitter_id: "${st_id}" }
              as: Coordinator
            - call: "POST /home-watch/key-assignments"
              payload: { property_id: "${prop_id}", sitter_id: "${st_id}", booking_id: "${bk_id}" }
              as: Coordinator
              captures: { key_id: $.data.id }
            - call: "POST /home-watch/key-assignments/${key_id}/check-out"
              payload: {}
              as: Coordinator
            - call: "POST /home-watch/bookings/${bk_id}/activate"
              payload: {}
              as: Coordinator
            - call: "GET /home-watch/visits?booking_id=${bk_id}"
              payload: {}
              as: Coordinator
              captures: { vis_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T09:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/visits/${vis_id}/check-in"
              payload: { gps_lat: 40.0, gps_lng: -70.0 }
              as: Sitter
              as_user_id: "${st_id}"
            - call: "POST /home-watch/visit-logs"
              payload: { visit_id: "${vis_id}", entry_type: "PHOTO", photo_url: "http://x/1.jpg", gps_lat: 40.0, gps_lng: -70.0, captured_at: "2026-06-06T09:06:00Z" }
              as: Sitter
              as_user_id: "${st_id}"
          trigger:
            - call: "POST /home-watch/visits/${vis_id}/check-out"
              payload: { completed_tasks: ["MAIL"] }
              as: Sitter
              as_user_id: "${st_id}"
          assert:
            - "Visit.${vis_id}.is_weekend == true"
            - "Visit.${vis_id}.provisional_charge_cents == 10625"

      - name: invoice_discount_fee_total_pinned_order_mode_c
        grounds:
          - calculations.invoice_financials
          - state_machines.Booking.ACTIVE_to_COMPLETED
          - entities.Invoice.fields.service_fee_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: "Mode (c): invoice total depends on service_fee which depends on the discount keyed on the subtotal tier; with pinned order subtotal 16250 → discount 0 → base 16250 → fee 1300 → tax 1229 → total 18779."
        test_recipe:
          setup:
            - "Sitter CLEARED + BOND; MEDIUM property with pets, checklist [MAIL]; VACATION booking 2026-06-01..2026-06-02 (2 weekday visits) base rate 4000, active."
            - "Visit 1 checked in 06-01 09:00, checked out 06-01 09:45 (45 min); visit 2 checked in 06-02 09:00, checked out 06-02 09:30 (30 min); both with a photo log."
