              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /users"
              payload: { email: "cc_occ2@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "OCC2", display_name: "OCC2", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "OCC2", jurisdiction: "US-CA" }
              as: OpsAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "OCC2" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "A", category: "OPERATIONAL", standard_text: "a", fallback_positions: ["fb"], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "MEDIUM" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { cl_a: $.data.id }
            - call: "POST /playbooks/${pb_id}/publish"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_id}", counterparty_id: "${cp_id}", contract_value_cents: 75000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /intake-requests/${ir_id}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_v: $.data.version }
            - call: "POST /intake-requests/${ir_id}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { change_summary: "r1" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${cl_a}", proposed_text: "alt", fallback_index: 0 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/deviations/${dev_id}/begin-review"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
            # Approver reads version
            - call: "GET /negotiations/${neg_id}"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { neg_v_stale: $.data.version }
            # Drafter withdraws a different deviation OR another mutation bumps version
            # Simplest: another decide on a second deviation bumps version.
            # But to keep this simple, we just call decide twice: first decide succeeds
            # (which bumps version), second decide with stale version fails.
          trigger:
            - call: "POST /negotiations/${neg_id}/deviations/${dev_id}/decide"
              payload: { decision: "APPROVE", expected_negotiation_version: "${neg_v_stale}" }
              as: LegalCounsel
              as_user_id: "${lc_id}"
            # The next call uses the same stale version, but the previous call succeeded and bumped version.
            # However, the deviation is now in APPROVED terminal state; decide would fail with INVALID_STATE_TRANSITION
            # before the OCC check. To force the OCC check to fire first, we instead create a second deviation
            # and try to decide IT with the stale version (the version is stale at the Negotiation level).
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${cl_a}", proposed_text: "alt2", fallback_index: 0 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev2_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/deviations/${dev2_id}/begin-review"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
            - call: "POST /negotiations/${neg_id}/deviations/${dev2_id}/decide"
              payload: { decision: "APPROVE", expected_negotiation_version: "${neg_v_stale}" }
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"
            - "HTTP status == 412"

