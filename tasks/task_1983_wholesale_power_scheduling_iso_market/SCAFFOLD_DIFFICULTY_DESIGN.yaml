  - rule_id: boundary_precision_check
    instances:
      - name: da_gate_close_inclusive_boundary
        grounds:
          - validations[priority=10]
          - entities.OperatingDay.fields.da_gate_close_at
          - errors[ERR_DA_GATE_CLOSED]
        distinguishing_aspect: |
          Timestamp boundary on the submit endpoint: submission at EXACTLY
          da_gate_close_at is accepted (inclusive <=), one second after is
          rejected — metric: logical timestamp vs gate instant.
        test_recipe:
          setup:
            - "Participant + 10 MW generator; day 2026-08-03 with gate 2026-08-02T10:30:00Z; logical clock set to exactly the gate"
