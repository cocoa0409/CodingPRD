- rule_id: non_linear_state_machine
  instances:
  - name: sourcing_bid_fork_join_two_branches_and_three_joins
    grounds:
    - state_machines.SourcingBid.PENDING_to_SHORTLISTED
    - state_machines.SourcingBid.SHORTLISTED_to_SELECTED
    - state_machines.SourcingBid.SHORTLISTED_to_NOT_SELECTED
    - calculations.allocate_box_lines
    - entities.SourcingBid.fields.status
    distinguishing_aspect: "One fork from PENDING into SHORTLISTED splits into two divergent branches \u2014 SELECTED on the top-ranked bid and NOT_SELECTED on every other shortlisted bid \u2014 and all three of those branches rejoin the same lot's READY outcome, so the machine is fork-join rather than a linear pipeline."
    test_recipe:
      setup:
      - Logical clock default 2026-09-01T00:00:00Z. Center DEMO-NE (region NE), three suppliers SJ1 (earliest created), SJ2, SJ3.
      - 'One lot JUDGE (category FRUIT, unit_weight 120, unit_cost 300) at DEMO-NE with three PENDING bids: from SJ1 at cost 100, from SJ2 at cost 200 and from SJ3 at cost 300. The allocation selector ranks cost ASC so SJ1 leads the shortlist.'
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-NE
          name: Demo Northeast
          region: NE
          insulation_profile: LIGHT
        as: PlatformAdmin
        captures:
          csj_c: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Sigma One
          region: NE
        as: PlatformAdmin
        captures:
          csj_1: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Sigma Two
          region: NE
        as: PlatformAdmin
        captures:
          csj_2: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Sigma Three
          region: NE
        as: PlatformAdmin
        captures:
          csj_3: $.data.id
      - call: POST /produce/suppliers/${csj_1}/lots
        payload:
          fulfillment_center_id: ${csj_c}
          product_name: JUDGE
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 120
          quantity_available: 100
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          csj_lot: $.data.id
          csj_lot_v: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${csj_lot}
          supplier_id: ${csj_1}
          bid_unit_cost_cents: 100
          quantity_offered: 100
        as: Supplier
        as_user_id: ${csj_1}
        captures:
          csj_b1: $.data.id
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${csj_lot}
          supplier_id: ${csj_2}
          bid_unit_cost_cents: 200
          quantity_offered: 100
        as: Supplier
        as_user_id: ${csj_2}
        captures:
          csj_b2: $.data.id
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${csj_lot}
          supplier_id: ${csj_3}
          bid_unit_cost_cents: 300
          quantity_offered: 100
        as: Supplier
        as_user_id: ${csj_3}
        captures:
          csj_b3: $.data.id
      trigger:
      - call: POST /produce/supply-lots/${csj_lot}/award
        payload:
          bidder_quota: 2
          expected_supply_lot_version: ${csj_lot_v}
        as: PlatformAdmin
      assert:
      - SourcingBid.${csj_b1}.status == SELECTED (the top-ranked branch)
      - SourcingBid.${csj_b2}.status == NOT_SELECTED (the non-top-ranked branch)
      - SourcingBid.${csj_b3}.status == NOT_SELECTED (never shortlisted, so joined from PENDING)
      - SupplyLot.${csj_lot}.status == READY (the fork rejoin)
      - GET /produce/sourcing-bids?supply_lot_id=${csj_lot}&status=SHORTLISTED returns exactly 0 rows
  - name: box_order_rerouted_revert_cycle_carries_no_build_work_finished
    grounds:
    - state_machines.BoxOrder.READY_TO_BUILD_to_REROUTED
    - state_machines.BoxOrder.REROUTED_to_READY_TO_BUILD
    - state_machines.BoxOrder.REROUTED_to_DRAFT
    - state_machines.BoxOrder.READY_TO_BUILD_to_DRAFT
    - entities.BoxOrder.fields.serving_cycle_index
    distinguishing_aspect: "The box lifecycle is cyclic on exactly the three edges READY_TO_BUILD to REROUTED, REROUTED back to READY_TO_BUILD and REROUTED to DRAFT \u2014 no other cycle exists, and a single loop through REROUTED and back can only be entered when no line has status INCLUDED, so the cycle never carries build work out with it."
    test_recipe:
      setup:
      - Logical clock default 2026-09-01T00:00:00Z. Center DEMO-NE (region NE), supplier, lot CY1 (FRUIT, unit_weight 200, unit_cost 100, quantity 200), awarded and PASS.
