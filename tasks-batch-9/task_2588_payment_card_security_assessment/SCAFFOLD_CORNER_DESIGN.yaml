              payload: { revision_note: "Sampling justification expanded." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/rocs"
              payload: { roc_version_label: "v1.1" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_already_exists: $.data.error_id }
          assert:
            - "The first creation attempt returns HTTP 422 with ${err_no_applicable} == ERR_NO_APPLICABLE_REQUIREMENTS - the compliance denominator would be zero"
            - "The second attempt, with requirement 1.2.1 still NOT_STARTED, returns HTTP 422 with ${err_testing_incomplete} == ERR_REQUIREMENT_TESTING_INCOMPLETE"
            - "The third attempt returns HTTP 201: RocReport.${roc_id}.status == DRAFTING, revision_count == 0, compliance_result == COMPLIANT and Engagement.${eng_id}.status == REPORTING with posture == FROZEN"
            - "The child write that follows returns HTTP 409 with ${err_frozen} == ERR_ENGAGEMENT_FROZEN, and GET /requirement-assessments?engagement_id=${eng_id} still returns total_count 1"
