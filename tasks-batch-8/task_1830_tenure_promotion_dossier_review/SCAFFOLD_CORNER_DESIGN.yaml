  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: mutations are visible in the very next GET within the same test — extension approve reflects extension_days 31 on the case read that follows it in the same request sequence (no lag, no recompute job)."
        test_recipe:
          setup: ["case in DOSSIER_ASSEMBLY; one PENDING extension [2023-01-01, 2023-02-01) (31 days)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand IC", employee_id: "E9700", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_ic: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_ic}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_ic: $.data.id } }
            - { call: "POST /api/clock-extensions", payload: { case_id: "${case_ic}", reason: "MEDICAL_LEAVE", interval_start: "2023-01-01", interval_end: "2023-02-01" }, as: Candidate, as_user_id: "${cand_ic}", captures: { ext_ic: $.data.id } }
          trigger:
            - { call: "POST /api/clock-extensions/${ext_ic}/approve", as: ProvostOfficer }
            - { call: "GET /api/cases/${case_ic}", as: Any, captures: { ic_days: $.data.extension_days, ic_date: $.data.mandatory_review_date } }
          assert:
            - "ic_days == 31 AND ic_date == 2026-09-01 (visible on the immediate next read)"
            - "ClockExtensionRequest.${ext_ic}.status == APPROVED AND decided_at == 2026-08-01T00:00:00Z"
