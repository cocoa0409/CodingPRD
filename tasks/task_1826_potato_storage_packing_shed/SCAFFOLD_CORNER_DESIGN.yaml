            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer T1", variety: "RUSSET_BURBANK", committed_volume_cwt: 100.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer T2", variety: "RUSSET_BURBANK", committed_volume_cwt: 300.00, price_cents_per_cwt: 4000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 2 }, as: SalesManager }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer T3", variety: "RUSSET_BURBANK", committed_volume_cwt: 1000.00, price_cents_per_cwt: 9999, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-08-10T00:00:00Z", priority_rank: 3 }, as: SalesManager }
