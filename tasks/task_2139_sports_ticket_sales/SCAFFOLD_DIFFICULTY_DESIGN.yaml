# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Deleting this file leaves the
# scaffold's declared behaviour unchanged; it exists so the unit-test generator can prove
# coverage of the nine §0.5 Difficulty Rules.
# Logical clock starts at 2026-08-01T00:00:00Z on every server start (see POST /_clock/set_current_utc).
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_quoted_vs_final_diverges_once_a_game_is_behind_the_clock
        grounds:
          - calculations.plan_order_total
          - calculations.game_seat_line_price
          - state_machines.PlanOrder.APPROVED_to_CONFIRMED
          - entities.PlanOrder.fields.quoted_total_cents
          - entities.PlanOrder.fields.final_total_cents
          - endpoints[POST /ticketing/plan-orders]
          - endpoints[POST /ticketing/plan-orders/{order_id}/confirm]
        distinguishing_aspect: |
          This dual-variant pair lives in the money domain on PlanOrder: QUOTED prices every game in the
          plan while FINAL drops games whose game_date_utc has passed, so the identical order row carries
          quoted_total_cents 26644 and final_total_cents 6360 at the same instant.
        test_recipe:
          setup:
            - "Season 2026-27 in RENEWAL_OPEN with total_home_games 2 and renewal_deadline_utc 2026-09-15T00:00:00Z"
            - "Game g1 MARQUEE/WEEKEND/demand 85 on 2026-10-10T23:00:00Z and Game g2 STANDARD/WEEKDAY/demand 50 on 2026-10-20T23:00:00Z"
            - "One ZONE_B seat, a PUBLISHED FULL_SEASON plan over both games, an account with tenure_years 4 and its assigned rep"
            - "A DRAFT->APPROVED order for that single seat, created while the clock still reads 2026-08-01T00:00:00Z"
            - "Clock then moved to 2026-10-15T00:00:00Z, which is after g1 but before g2; season_status stays RENEWAL_OPEN because no run-ops has executed"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 2, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "RIV", opponent_tier: "MARQUEE", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "MID", opponent_tier: "STANDARD", game_date_utc: "2026-10-20T23:00:00Z", day_bucket: "WEEKDAY", demand_index: 50 }
              as: TicketOpsAdmin
              captures: { g2: "$.data.id" }
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_B", seat_number_from: 1, seat_number_to: 1 }
              as: TicketOpsAdmin
              captures: { s1: "$.data[0].id" }
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}", "${g2}"], min_seats: 1, max_seats: 4 }
              as: RevenueManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /ticketing/season-plans/${plan_id}/publish"
              payload: {}
              as: RevenueManager
            - call: "POST /ticketing/seasons/${season_id}/open-renewal"
              payload: {}
              as: TicketOpsAdmin
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep North", territory_code: "NORTH", book_capacity: 5 }
              as: TicketOpsAdmin
              captures: { rep1: "$.data.id" }
            - call: "POST /ticketing/accounts"
              payload: { account_name: "Acct One", account_type: "INDIVIDUAL", territory_code: "NORTH", tenure_years: 4 }
              as: TicketOpsAdmin
              captures: { acct1: "$.data.id" }
            - call: "POST /ticketing/accounts/${acct1}/assign-rep"
              payload: {}
              as: TicketOpsAdmin
              captures: { rep_of_acct1: "$.data.assigned_rep_id" }
            - call: "POST /ticketing/plan-orders"
              payload: { account_id: "${acct1}", plan_id: "${plan_id}", seat_ids: ["${s1}"] }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { order1: "$.data.id" }
            - call: "POST /ticketing/plan-orders/${order1}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: TicketOpsAdmin
          trigger:
            - call: "POST /ticketing/plan-orders/${order1}/confirm"
              payload: { installment_count: 1 }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { final_total: "$.data.final_total_cents" }
          assert:
            - "PlanOrder.${order1}.quoted_total_cents == 26644"
            - "PlanOrder.${order1}.final_total_cents == 6360"
            - "PlanOrder.${order1}.quoted_total_cents != PlanOrder.${order1}.final_total_cents"
            - "PlanOrder.${order1}.order_status == CONFIRMED"
            - "Season.${season_id}.contracted_revenue_cents == 6360"

      - name: account_churn_risk_rolling_and_campaign_variants_disagree_after_ops_run
        grounds:
          - calculations.account_churn_risk
          - entities.TicketAccount.fields.churn_risk_rolling
          - entities.TicketAccount.fields.churn_risk_campaign
          - state_machines.Game.SCHEDULED_to_PLAYED
          - endpoints[POST /ticketing/seasons/{season_id}/run-ops]
        distinguishing_aspect: |
          The second dual-variant pair lives in the relationship-risk domain on TicketAccount, not in the
          money domain: with identical stored data the ROLLING variant scores 16 (tenure relief applied,
          lifetime no-shows) while the CAMPAIGN variant scores 28 (relief dropped because the season has
          left RENEWAL_OPEN, season-scoped no-shows).
        test_recipe:
          setup:
            - "Season with one game on 2026-10-10T23:00:00Z, renewal_deadline_utc 2026-09-15T00:00:00Z"
            - "Account with tenure_years 4, no touchpoints ever, one CONFIRMED and fully paid single-seat order"
            - "Clock moved to 2026-10-11T00:00:00Z so the game has been played and the renewal deadline is behind"
            - "One run-ops settles the game (the entitled seat was never scanned) and advances the season to IN_SEASON"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "RIV", opponent_tier: "PREMIUM", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_C", seat_number_from: 1, seat_number_to: 1 }
              as: TicketOpsAdmin
              captures: { s1: "$.data[0].id" }
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}"], min_seats: 1, max_seats: 4 }
              as: RevenueManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /ticketing/season-plans/${plan_id}/publish"
              payload: {}
              as: RevenueManager
            - call: "POST /ticketing/seasons/${season_id}/open-renewal"
              payload: {}
              as: TicketOpsAdmin
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep North", territory_code: "NORTH", book_capacity: 5 }
              as: TicketOpsAdmin
              captures: { rep1: "$.data.id" }
            - call: "POST /ticketing/accounts"
              payload: { account_name: "Acct One", account_type: "INDIVIDUAL", territory_code: "NORTH", tenure_years: 4 }
              as: TicketOpsAdmin
              captures: { acct1: "$.data.id" }
            - call: "POST /ticketing/accounts/${acct1}/assign-rep"
              payload: {}
              as: TicketOpsAdmin
              captures: { rep_of_acct1: "$.data.assigned_rep_id" }
            - call: "POST /ticketing/plan-orders"
              payload: { account_id: "${acct1}", plan_id: "${plan_id}", seat_ids: ["${s1}"] }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { order1: "$.data.id" }
            - call: "POST /ticketing/plan-orders/${order1}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
            - call: "POST /ticketing/plan-orders/${order1}/confirm"
              payload: { installment_count: 1 }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
            - call: "POST /ticketing/plan-orders/${order1}/payments"
              payload: { amount_cents: 7785 }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T00:00:00Z" }
              as: TicketOpsAdmin
          trigger:
            - call: "POST /ticketing/seasons/${season_id}/run-ops"
              payload: {}
              as: TicketOpsAdmin
              captures: { played: "$.data.played_game_count" }
          assert:
            - "PlanOrder.${order1}.final_total_cents == 7785"
            - "PlanOrder.${order1}.payment_status == PAID_IN_FULL"
            - "Game.${g1}.game_status == PLAYED"
            - "TicketAccount.${acct1}.no_show_count == 1"
            - "TicketAccount.${acct1}.season_no_show_count == 1"
            - "TicketAccount.${acct1}.churn_risk_rolling == 16"
            - "TicketAccount.${acct1}.churn_risk_campaign == 28"
            - "TicketAccount.${acct1}.service_status == ACTIVE"
            - "Season.${season_id}.season_status == IN_SEASON"

  - rule_id: combinatorial_formula
    instances:
      - name: order_subtotal_rounds_every_seat_game_line_before_summing
        grounds:
          - calculations.game_seat_line_price
          - calculations.plan_order_total
          - endpoints[POST /ticketing/plan-orders]
          - entities.PlanOrder.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order matters. Four identical ZONE_C lines each land on
          9343.75 raw cents; rounding per line then summing yields subtotal 37376 and total 38430, while
          summing raw then rounding once yields 37375 and total 38429. The scaffold pins per-line-first.
        test_recipe:
          setup:
            - "Season in RENEWAL_OPEN with one PREMIUM/WEEKEND game at demand_index 85 and dynamic_pricing_mode AGGRESSIVE"
            - "Four ZONE_C seats, a PUBLISHED FULL_SEASON plan with min_seats 1 / max_seats 8"
            - "An account with tenure_years 0 (no tenure credit) and its assigned rep"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "RIV", opponent_tier: "PREMIUM", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_C", seat_number_from: 1, seat_number_to: 4 }
              as: TicketOpsAdmin
              captures: { s1: "$.data[0].id", s2: "$.data[1].id", s3: "$.data[2].id", s4: "$.data[3].id" }
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}"], min_seats: 1, max_seats: 8 }
              as: RevenueManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /ticketing/season-plans/${plan_id}/publish"
              payload: {}
              as: RevenueManager
            - call: "POST /ticketing/seasons/${season_id}/open-renewal"
              payload: {}
              as: TicketOpsAdmin
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep North", territory_code: "NORTH", book_capacity: 5 }
              as: TicketOpsAdmin
              captures: { rep1: "$.data.id" }
            - call: "POST /ticketing/accounts"
              payload: { account_name: "Acct One", account_type: "INDIVIDUAL", territory_code: "NORTH", tenure_years: 0 }
              as: TicketOpsAdmin
              captures: { acct1: "$.data.id" }
            - call: "POST /ticketing/accounts/${acct1}/assign-rep"
              payload: {}
              as: TicketOpsAdmin
              captures: { rep_of_acct1: "$.data.assigned_rep_id" }
          trigger:
            - call: "POST /ticketing/plan-orders"
              payload: { account_id: "${acct1}", plan_id: "${plan_id}", seat_ids: ["${s1}", "${s2}", "${s3}", "${s4}"] }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { order1: "$.data.id", quoted: "$.data.quoted_total_cents" }
          assert:
            - "PlanOrder.${order1}.quoted_total_cents == 38430"
            - "PlanOrder.${order1}.quoted_total_cents != 38429"
            - "PlanOrder.${order1}.order_status == DRAFT"
            - "PlanOrder.${order1}.payment_status == NOT_STARTED"
            - "Season.${season_id}.held_seat_count == 4"
            - "Season.${season_id}.available_seat_count == 0"

      - name: hospitality_partner_discount_tier_reads_gross_never_total_due
        grounds:
          - calculations.hospitality_package_fee
          - endpoints[POST /ticketing/hospitality-packages]
          - entities.HospitalityPackage.fields.gross_fee_cents
          - entities.HospitalityPackage.fields.partner_discount_pct
          - entities.HospitalityPackage.fields.total_due_cents
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency with a pinned evaluation order. gross_fee_cents 472500
          sits just below the 500000 discount tier while total_due_cents 510300 sits just above it, so an
          implementation that keys the tier on total_due_cents produces 484785 instead of 510300.
        test_recipe:
          setup:
            - "Season in RENEWAL_OPEN with one PREMIUM game, a PUBLISHED plan and an account with an assigned rep"
            - "No hospitality package exists yet for suite SUITE-1 on that game (game cap 200 heads)"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "RIV", opponent_tier: "PREMIUM", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85, hospitality_headcount_cap: 200 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_C", seat_number_from: 1, seat_number_to: 2 }
              as: TicketOpsAdmin
              captures: { s1: "$.data[0].id" }
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}"], min_seats: 1, max_seats: 4 }
              as: RevenueManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /ticketing/season-plans/${plan_id}/publish"
              payload: {}
              as: RevenueManager
            - call: "POST /ticketing/seasons/${season_id}/open-renewal"
              payload: {}
              as: TicketOpsAdmin
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep North", territory_code: "NORTH", book_capacity: 5 }
              as: TicketOpsAdmin
              captures: { rep1: "$.data.id" }
            - call: "POST /ticketing/accounts"
              payload: { account_name: "Acct One", account_type: "CORPORATE", territory_code: "NORTH", tenure_years: 0 }
              as: TicketOpsAdmin
              captures: { acct1: "$.data.id" }
            - call: "POST /ticketing/accounts/${acct1}/assign-rep"
              payload: {}
              as: TicketOpsAdmin
              captures: { rep_of_acct1: "$.data.assigned_rep_id" }
          trigger:
            - call: "POST /ticketing/hospitality-packages"
              payload: { game_id: "${g1}", account_id: "${acct1}", suite_code: "SUITE-1", headcount: 21, service_window_start_utc: "2026-10-10T18:00:00Z", service_window_end_utc: "2026-10-10T21:00:00Z" }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { pkg1: "$.data.id", due: "$.data.total_due_cents" }
          assert:
            - "HospitalityPackage.${pkg1}.gross_fee_cents == 472500"
            - "HospitalityPackage.${pkg1}.partner_discount_pct == 0.00"
            - "HospitalityPackage.${pkg1}.service_fee_cents == 37800"
            - "HospitalityPackage.${pkg1}.total_due_cents == 510300"
            - "HospitalityPackage.${pkg1}.total_due_cents != 484785"
            - "HospitalityPackage.${pkg1}.package_status == HELD"
            - "Game.${g1}.hospitality_booked_headcount == 21"

  - rule_id: non_linear_state_machine
    instances:
      - name: plan_order_order_status_and_payment_status_advance_independently
        grounds:
          - state_machines.PlanOrder.order_status.APPROVED_to_CONFIRMED
          - state_machines.PlanOrder.payment_status.SCHEDULED_to_PARTIALLY_PAID
          - state_machines.PlanOrder.payment_status.PARTIALLY_PAID_to_DELINQUENT
          - state_machines.TicketAccount.billing_status.CURRENT_to_PAST_DUE
          - calculations.installment_schedule_and_payment_application
        distinguishing_aspect: |
          Non-linear shape #1 is parallel dimensions on PlanOrder: payment_status walks
          SCHEDULED -> PARTIALLY_PAID -> DELINQUENT while order_status stays pinned at CONFIRMED across
          all three steps, and the delinquency also moves a second entity's dimension (account
          billing_status CURRENT -> PAST_DUE).
        test_recipe:
          setup:
            - "Season in RENEWAL_OPEN, one PREMIUM/WEEKEND/85 game on 2026-10-10T23:00:00Z, four ZONE_C seats"
            - "A CONFIRMED four-seat order with final_total_cents 38430 and installment_count 3, so installments are 12810 due 2026-08-01, 12810 due 2026-08-31 and 12810 due 2026-09-30"
            - "Clock still at 2026-08-01T00:00:00Z at confirm time"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "RIV", opponent_tier: "PREMIUM", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_C", seat_number_from: 1, seat_number_to: 4 }
              as: TicketOpsAdmin
              captures: { s1: "$.data[0].id", s2: "$.data[1].id", s3: "$.data[2].id", s4: "$.data[3].id" }
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}"], min_seats: 1, max_seats: 8 }
              as: RevenueManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /ticketing/season-plans/${plan_id}/publish"
              payload: {}
              as: RevenueManager
            - call: "POST /ticketing/seasons/${season_id}/open-renewal"
              payload: {}
              as: TicketOpsAdmin
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep North", territory_code: "NORTH", book_capacity: 5 }
              as: TicketOpsAdmin
              captures: { rep1: "$.data.id" }
            - call: "POST /ticketing/accounts"
              payload: { account_name: "Acct One", account_type: "INDIVIDUAL", territory_code: "NORTH", tenure_years: 0 }
              as: TicketOpsAdmin
              captures: { acct1: "$.data.id" }
            - call: "POST /ticketing/accounts/${acct1}/assign-rep"
              payload: {}
              as: TicketOpsAdmin
              captures: { rep_of_acct1: "$.data.assigned_rep_id" }
            - call: "POST /ticketing/plan-orders"
              payload: { account_id: "${acct1}", plan_id: "${plan_id}", seat_ids: ["${s1}", "${s2}", "${s3}", "${s4}"] }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { order1: "$.data.id" }
            - call: "POST /ticketing/plan-orders/${order1}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
            - call: "POST /ticketing/plan-orders/${order1}/confirm"
              payload: { installment_count: 3 }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
          trigger:
            - call: "POST /ticketing/plan-orders/${order1}/payments"
              payload: { amount_cents: 5000 }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { pay_status: "$.data.payment_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: TicketOpsAdmin
            - call: "POST /ticketing/seasons/${season_id}/run-ops"
              payload: {}
              as: TicketOpsAdmin
              captures: { delinquent_count: "$.data.delinquent_order_count" }
          assert:
            - "PlanOrder.${order1}.final_total_cents == 38430"
            - "PlanOrder.${order1}.installments[0].amount_cents == 12810 and installments[0].paid_cents == 5000"
            - "PlanOrder.${order1}.payment_status == PARTIALLY_PAID immediately after the 5000 payment"
            - "PlanOrder.${order1}.order_status == CONFIRMED immediately after the 5000 payment"
            - "PlanOrder.${order1}.payment_status == DELINQUENT after run-ops"
            - "PlanOrder.${order1}.order_status == CONFIRMED after run-ops (unchanged by the payment dimension)"
            - "TicketAccount.${acct1}.billing_status == PAST_DUE"
            - "TicketAccount.${acct1}.past_due_since_utc == 2026-08-12T00:00:00.000Z"
            - "Season.${season_id}.season_status == RENEWAL_OPEN"

      - name: ticket_account_service_status_cycles_active_at_risk_active
        grounds:
          - state_machines.TicketAccount.service_status.ACTIVE_to_AT_RISK
          - state_machines.TicketAccount.service_status.AT_RISK_to_ACTIVE
          - endpoints[POST /ticketing/accounts/{account_id}/touchpoints]
          - endpoints[POST /ticketing/seasons/{season_id}/run-ops]
          - entities.TicketAccount.fields.at_risk_since_utc
        distinguishing_aspect: |
          Non-linear shape #2 is a cycle on a different entity, TicketAccount: service_status returns to
