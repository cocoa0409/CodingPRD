            - "after settle: Manufacturer.${mfg_id}.rebate_funding_payable_cents == 0"
            - "INVARIANT after settle: 0 + 56700 == 56700"
            - "${reopened_status} == CLOSED"
            - "after reverse-settlement: Contract.${ct_id}.rebate_payable_cents == 56700 and Contract.${ct_id}.rebate_settled_total_cents == 0"
            - "after reverse-settlement: Manufacturer.${mfg_id}.rebate_funding_payable_cents == 34020 (exactly its pre-settle value)"
            - "after reverse-settlement: RebatePeriod.${rp_id}.settled_amount_cents == 0"
            - "INVARIANT after reverse-settlement: 56700 + 0 == 56700"
