              as: PharmacyOps
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/payment"
              payload: {}
              as: PharmacyOps
          assert:
            - "Order.${o_id}.acquisition_cost_cents == 720"
            - "Order.${o_id}.markup_cents == 108"
            - "Order.${o_id}.pharmacy_fee_cents == 800"
            - "Order.${o_id}.shipping_fee_cents == 0"
            - "Order.${o_id}.patient_price_cents == 1628"
            - "the provisional total was 2128 (720+108+800+500) and is >= 1500, so the 500-cent fee is absent from the final total; a single-pass reading that reassembles before waiving would report 2128"

      - name: order_price_round_per_unit_before_markup_not_after
