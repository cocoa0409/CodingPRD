        claim_type: violation_to_error
        grounds:
          - errors[ERR_OUTAGE_REQUIRED]
        excluded_because:
          difficulty_instance: production_requires_in_effect_outage
          rationale: "Asserted as the failure branch of the named §1.8 instance (and again under cap dual-failure in outage_safety_beats_quantity_cap)."

      - name: insufficient_stock_error_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INSUFFICIENT_STOCK]
        excluded_because:
          difficulty_instance: material_issue_exact_on_hand_boundary
          rationale: "Asserted as the failure branch of the named §1.8 instance."

      - name: crew_overlap_error_trigger
        claim_type: violation_to_error
        grounds:
