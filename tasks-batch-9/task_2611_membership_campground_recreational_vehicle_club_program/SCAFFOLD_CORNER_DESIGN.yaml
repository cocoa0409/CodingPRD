              captures: { inv_dw_status_pastdue: "$.data.status", inv_dw_fee_pastdue: "$.data.late_fee_cents" }
          trigger:
            - call: "POST /dues-invoices/${inv_dw_id}/payments"
              payload: { amount_cents: 46040 }
              as: Member
              as_user_id: "${member_dw_id}"
              captures: { inv_dw_status_paid: "$.data.status" }
            - call: "GET /memberships/${mem_dw_id}"
              as: ClubAdmin
              captures: { mem_dw_dues_cured: "$.data.dues_status", mem_dw_balance_cured: "$.data.dues_balance_cents", mem_dw_paid_through: "$.data.dues_paid_through", mem_dw_version_cured: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-08T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /ops/dues-delinquency-run"
              as: ClubAdmin
            - call: "GET /dues-invoices/${inv_dw_id}"
              as: ClubAdmin
              captures: { inv_dw_status_sweep2: "$.data.status", inv_dw_fee_sweep2: "$.data.late_fee_cents" }
            - call: "GET /memberships/${mem_dw_id}"
              as: ClubAdmin
              captures: { mem_dw_dues_sweep2: "$.data.dues_status", mem_dw_status_sweep2: "$.data.membership_status", mem_dw_balance_sweep2: "$.data.dues_balance_cents", mem_dw_version_sweep2: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-18T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /ops/dues-delinquency-run"
              as: ClubAdmin
            - call: "GET /memberships/${mem_dw_id}"
              as: ClubAdmin
              captures: { mem_dw_dues_sweep3: "$.data.dues_status", mem_dw_status_sweep3: "$.data.membership_status", mem_dw_balance_sweep3: "$.data.dues_balance_cents" }
            - call: "GET /memberships/${mem_dw_id}/dues-invoices"
              as: ClubAdmin
              captures: { inv_list_first_status: "$.data[0].status" }
          assert:
            - "Before the cure the first sweep leaves the invoice PAST_DUE with late_fee_cents 680 (29 days past due, ceil(29/30) = 1) and the membership in GRACE"
            - "Paying 46040 settles amount 45360 plus fee 680: the invoice becomes PAID, dues_status returns to CURRENT, dues_balance_cents is 0 and dues_paid_through advances"
            - "The second sweep at 2026-11-08 — 69 days past the original due_date — leaves the invoice PAID with late_fee_cents still exactly 680 and the membership CURRENT and ACTIVE; the sweep's input set is invoices in status OPEN or PAST_DUE, so a settled invoice is invisible to it"
            - "The third sweep at 2026-12-18, 109 days past due_date, also changes nothing: dues_status is still CURRENT, membership_status still ACTIVE and dues_balance_cents still 0 — the membership never re-enters GRACE or DELINQUENT despite crossing both day thresholds on paper"
