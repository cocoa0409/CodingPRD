  # =====================================================================
  # Rule 4 — transitive_cascade (≥ 2 instances, different triggers, depth ≥3 / ≥2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:

      - name: plan_revision_approval_cascades_through_permits_and_structural_plan
        grounds:
          - state_machines.PlanRevision.SUBMITTED_to_APPROVED
          - state_machines.StructuralPlan.UNDER_REVIEW_to_APPROVED
          - state_machines.PermitApplication
        distinguishing_aspect: |
          Depth-3 cascade triggered by PlanRevision SUBMITTED → APPROVED:
          hop1: PlanRevision becomes APPROVED;
          hop2: StructuralPlan UNDER_REVIEW → APPROVED and the previously APPROVED PlanRevision
                on the same plan is forced APPROVED → VOIDED;
          hop3: any PermitApplication referencing the now-VOIDED revision and still in DRAFT or
                SUBMITTED cascades to WITHDRAWN with ERR_PERMIT_REVISION_SUPERSEDED on subsequent
                submit attempts.
        test_recipe:
          setup:
            - "Plan with revision R1 APPROVED; a PermitApplication referencing R1 sits in DRAFT."
            - "A new revision R2 created, submitted, and about to be approved."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JD", name: "J-D", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { jd_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "Plan D", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 80 }
              as: Engineer
              captures: { plan_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions"
              payload: { engineering_notes: "r1", required_code_path: "PRESCRIPTIVE" }
              as: Engineer
              captures: { r1_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${r1_id}/action"
              payload: { action: "SUBMIT" }
              as: Engineer
              as_user_id: "eng-alice"
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${r1_id}/action"
              payload: { action: "APPROVE" }
              as: Engineer
              as_user_id: "eng-bob"
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${jd_id}", address: "21 G St", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/permit-applications"
              payload: { plan_revision_id: "${r1_id}", requested_path: "PRESCRIPTIVE" }
              as: PermitCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions"
              payload: { engineering_notes: "r2", required_code_path: "PRESCRIPTIVE", supersedes_revision_id: "${r1_id}" }
              as: Engineer
              captures: { r2_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${r2_id}/action"
              payload: { action: "SUBMIT" }
              as: Engineer
              as_user_id: "eng-alice"
          trigger:
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${r2_id}/action"
              payload: { action: "APPROVE" }
              as: Engineer
              as_user_id: "eng-bob"
          assert:
            - "PlanRevision.${r2_id}.status == APPROVED"
            - "PlanRevision.${r1_id}.status == VOIDED"
            - "StructuralPlan.${plan_id}.approved_revision_id == ${r2_id}"
            - "StructuralPlan.${plan_id}.current_revision_id == ${r2_id}"
            - "PermitApplication.${pa_id}.status == WITHDRAWN (cascade hop 3)"

      - name: site_suspend_cascades_prints_trades_permits
        grounds:
          - state_machines.Site
          - state_machines.PrintJob
          - state_machines.ConventionalTradeTask
          - state_machines.PermitApplication
