  - rule_id: compensating_invariant
    instances:

      - name: session_checkin_restores_lot_booklet_conservation_exactly
        grounds:
          - calculations.material_reconciliation
          - entities.MaterialLot.fields.quantity_at_school
          - entities.MaterialLot.fields.quantity_in_sessions
          - entities.CustodyEvent.fields.chain_balance_after
          - state_machines.MaterialLot.IN_DISTRIBUTION_to_IN_DISTRIBUTION
        distinguishing_aspect: >-
          Conserved quantity 1 is a PHYSICAL COUNT: quantity_at_district +
          quantity_at_school + quantity_in_sessions + quantity_destroyed must equal
          quantity_shipped (20) after both the forward SESSION_CHECKOUT of 6 and its
          compensating SESSION_CHECKIN of 6, and quantity_at_school must return to exactly
          20 with zero drift.
        test_recipe:
          setup:
            - "One district, school and OPEN window with a certified proctor holding an ACTIVE affidavit."
            - "A 20-booklet lot has been received and transferred whole to the school, so quantity_at_school is 20 and the other three buckets are 0."
            - "Session A is SCHEDULED with one PENDING registration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-0017", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Quince High", school_code: "QH-01", max_concurrent_seats: 60 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s_id: $.data.id }
            - call: "POST /test-windows"
              payload: { name: "Fall ELA G9-12", subject: "ELA", grade_band: "G9_12", window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-18T18:00:00Z", makeup_start: "2026-09-21T08:00:00Z", makeup_end: "2026-09-25T18:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { w_id: $.data.id }
            - call: "POST /material-lots"
              payload: { window_id: "${w_id}", district_id: "${d_id}", lot_code: "LOT-Q1", quantity_shipped: 20, seal_range_start: 2200, seal_range_end: 2219 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { lot_id: $.data.id }
            - call: "POST /test-windows/${w_id}/transitions"
              payload: { to_status: "OPEN" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /proctors"
              payload: { school_id: "${s_id}", full_name: "Ada Proctor", email: "ada@ng.gov" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /proctors/${p1_id}/training-completions"
              payload: { module_version: "2026.1", quiz_score_pct: 92.0 }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { p1_v: $.data.version }
            - call: "POST /security-affidavits"
              payload: { proctor_id: "${p1_id}", window_id: "${w_id}", affidavit_version: "2026.1", expected_proctor_version: "${p1_v}" }
              as: Proctor
              as_user_id: "${p1_id}"
            - call: "POST /sessions"
              payload: { window_id: "${w_id}", school_id: "${s_id}", room_code: "R101", scheduled_start: "2026-09-08T09:00:00Z", scheduled_end: "2026-09-08T12:00:00Z", seat_capacity: 25, session_type: "INITIAL" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { sess_a_id: $.data.id, sess_a_v: $.data.version }
            - call: "POST /sessions/${sess_a_id}/proctor-assignments"
              payload: { proctor_id: "${p1_id}", expected_session_version: "${sess_a_v}" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "RECEIPT", quantity: 20, sealed_count: 20 }
              as: DistrictTestCoordinator
              as_user_id: "${d_id}"
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "TRANSFER_TO_SCHOOL", quantity: 20, sealed_count: 20 }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /registrations"
              payload: { session_id: "${sess_a_id}", student_state_id: "S00000001", grade: 10, guardian_email: "g1@fam.example" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /sessions/${sess_a_id}/transitions"
              payload: { to_status: "SCHEDULED" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "SESSION_CHECKOUT", quantity: 6, sealed_count: 6, session_id: "${sess_a_id}" }
              as: Proctor
              as_user_id: "${p1_id}"
              captures: { out_event_id: $.data.id, out_balance: $.data.chain_balance_after }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T09:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /sessions/${sess_a_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: Proctor
              as_user_id: "${p1_id}"
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "SESSION_CHECKIN", quantity: 6, sealed_count: 6, session_id: "${sess_a_id}" }
              as: Proctor
              as_user_id: "${p1_id}"
              captures: { in_event_id: $.data.id, in_balance: $.data.chain_balance_after, in_seq: $.data.sequence_no }
          assert:
            - "after the first trigger call MaterialLot.${lot_id}.quantity_at_school == 14"
            - "after the first trigger call MaterialLot.${lot_id}.quantity_in_sessions == 6"
            - "CustodyEvent.${out_event_id}.chain_balance_after == 20"
            - "after the fourth trigger call MaterialLot.${lot_id}.quantity_at_district == 0"
            - "after the fourth trigger call MaterialLot.${lot_id}.quantity_at_school == 20"
            - "after the fourth trigger call MaterialLot.${lot_id}.quantity_in_sessions == 0"
            - "after the fourth trigger call MaterialLot.${lot_id}.quantity_destroyed == 0"
            - "CustodyEvent.${in_event_id}.chain_balance_after == 20"
            - "CustodyEvent.${in_event_id}.sequence_no == 4"
            - "CustodyEvent.${in_event_id}.previous_event_id == ${out_event_id}"
            - "Session.${sess_a_id}.materials_checked_out == 6"
            - "Session.${sess_a_id}.materials_checked_in == 6"
            - "MaterialLot.${lot_id}.status == IN_DISTRIBUTION"

      - name: dismissed_breach_report_reverses_district_charge_ledger_to_zero
        grounds:
          - calculations.replacement_charge_ledger
          - calculations.district_security_assessment
          - state_machines.IrregularityReport.UNDER_REVIEW_to_ADJUDICATED
          - entities.MaterialLot.fields.charge_reversed
          - entities.District.fields.security_assessment_cents
        distinguishing_aspect: >-
          Conserved quantity 2 is a MONETARY LEDGER, a different type from the booklet
          count: District.replacement_charge_total_cents must return from 6250 to exactly
          0 (and security_assessment_cents from 5625 to 0) once the compensating DISMISSED
          adjudication reverses the charge the DISCREPANT reconciliation raised, with the
          lot's own replacement_charge_cents preserved at 6250 for audit.
        test_recipe:
          setup:
            - "One district, school and window with a single 10-booklet lot that has been received, transferred and returned in full."
            - "The lot sits in RETURNED_PENDING and the district ledger is still at zero."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-0018", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Rowan High", school_code: "RH-01", max_concurrent_seats: 40 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s_id: $.data.id }
            - call: "POST /test-windows"
              payload: { name: "Fall MATH G3-5", subject: "MATH", grade_band: "G3_5", window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-18T18:00:00Z", makeup_start: "2026-09-21T08:00:00Z", makeup_end: "2026-09-25T18:00:00Z", min_participation_pct: 0.0 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { w_id: $.data.id }
            - call: "POST /material-lots"
              payload: { window_id: "${w_id}", district_id: "${d_id}", lot_code: "LOT-R1", quantity_shipped: 10, seal_range_start: 2000, seal_range_end: 2009 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { lot_id: $.data.id }
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "RECEIPT", quantity: 10, sealed_count: 10 }
              as: DistrictTestCoordinator
              as_user_id: "${d_id}"
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "TRANSFER_TO_SCHOOL", quantity: 10, sealed_count: 10 }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "RETURN_TO_DISTRICT", quantity: 10, sealed_count: 10 }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /material-lots/${lot_id}/reconciliations"
              payload: { declared_returned_count: 6, declared_destroyed_count: 0, broken_seal_count: 0 }
              as: DistrictTestCoordinator
              as_user_id: "${d_id}"
              captures: { charge_after_discrepancy: $.data.replacement_charge_cents }
            - call: "GET /districts/${d_id}"
              payload: {}
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { gross_before: $.data.replacement_charge_total_cents, assessment_before: $.data.security_assessment_cents }
            - call: "GET /irregularity-reports"
              payload: { material_lot_id: "${lot_id}" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { sysrep_id: "$.data[0].id" }
            - call: "POST /irregularity-reports/${sysrep_id}/transitions"
              payload: { to_status: "UNDER_REVIEW" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /irregularity-reports/${sysrep_id}/transitions"
              payload: { to_status: "ADJUDICATED", disposition: "DISMISSED", note: "Booklets located in the vault; count error only." }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
          assert:
            - "after the first trigger call MaterialLot.${lot_id}.missing_count == 4"
            - "after the first trigger call MaterialLot.${lot_id}.replacement_charge_cents == 6250"
            - "gross_before == 6250"
            - "assessment_before == 5625"
            - "after the last trigger call MaterialLot.${lot_id}.charge_reversed == true"
            - "after the last trigger call MaterialLot.${lot_id}.replacement_charge_cents == 6250"
            - "after the last trigger call MaterialLot.${lot_id}.status == DISCREPANT"
            - "District.${d_id}.replacement_charge_total_cents == 0"
            - "District.${d_id}.security_assessment_cents == 0"
            - "District.${d_id}.open_discrepancy_count == 0"
            - "TestWindow.${w_id}.open_breach_count == 0"
            - "TestWindow.${w_id}.security_hold == false"
            - "IrregularityReport.${sysrep_id}.disposition == DISMISSED"
