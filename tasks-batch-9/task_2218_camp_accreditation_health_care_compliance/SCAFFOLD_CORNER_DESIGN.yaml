              as: Visitor
              as_user_id: "${lead_id}"
          trigger:
            - call: "PATCH /accreditation/standard-evaluations/${ev_a_aq_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "OBSERVED" }
