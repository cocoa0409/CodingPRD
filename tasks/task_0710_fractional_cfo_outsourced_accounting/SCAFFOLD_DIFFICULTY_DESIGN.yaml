scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: retainer_surcharge_variant_divergence
        grounds:
          - calculations.retainer_invoice_amount
          - entities.RetainerInvoice.fields.surcharge_cents
          - entities.Client.fields.catchup_active
          - state_machines.CatchupProject.SCOPED
        distinguishing_aspect: |
          Two RetainerInvoices issued off identical GROWTH-tier closes with txn_count 650 diverge
          only because one client has an active CatchupProject (surcharge_cents=60000, total=369000)
          and the other does not (surcharge_cents=0, total=309000) — the dual variant lives on the
          RetainerInvoice/Client billing domain.
        test_recipe:
          setup:
            - "Client A is GROWTH tier, has a CatchupProject in SCOPED (catchup_active=true)."
            - "Client B is GROWTH tier, no catch-up project (catchup_active=false)."
            - "Each client has a MonthlyClose with txn_count=650."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Alpha LLC", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid_a: $.data.id }
            - call: "POST /clients/${cid_a}/catchup-projects"
              payload: { months_behind: 4, quoted_fee_cents: 500000 }
              as: CFO
              captures: { cp_a: $.data.id }
            - call: "POST /catchup-projects/${cp_a}/scope"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid_a}/monthly-closes"
              payload: { period_year: 2026, period_month: 1, txn_count: 650 }
              as: Bookkeeper
              captures: { mc_a: $.data.id }
            - call: "GET /clients/${cid_a}"
              payload: {}
              as: CFO
              captures: { cver_a: $.data.version }
            - call: "POST /clients"
              payload: { legal_name: "Beta LLC", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid_b: $.data.id, cver_b: $.data.version }
            - call: "POST /clients/${cid_b}/monthly-closes"
              payload: { period_year: 2026, period_month: 1, txn_count: 650 }
              as: Bookkeeper
              captures: { mc_b: $.data.id }
          trigger:
            - call: "POST /clients/${cid_a}/retainer-invoices"
              payload: { monthly_close_id: "${mc_a}", expected_client_version: "${cver_a}" }
              as: CFO
              captures: { inv_a: $.data.id }
            - call: "POST /clients/${cid_b}/retainer-invoices"
              payload: { monthly_close_id: "${mc_b}", expected_client_version: "${cver_b}" }
              as: CFO
              captures: { inv_b: $.data.id }
          assert:
            - "RetainerInvoice.${inv_a}.base_fee_cents == 300000"
            - "RetainerInvoice.${inv_a}.overage_cents == 9000"
            - "RetainerInvoice.${inv_a}.surcharge_cents == 60000"
            - "RetainerInvoice.${inv_a}.total_cents == 369000"
            - "RetainerInvoice.${inv_b}.surcharge_cents == 0"
            - "RetainerInvoice.${inv_b}.total_cents == 309000"

      - name: ar_dso_gross_vs_net_divergence
        grounds:
          - calculations.ar_dso
          - entities.ARInvoice.fields.status
          - state_machines.ARInvoice.OPEN_to_DISPUTED
        distinguishing_aspect: |
          The same AR ledger yields dso_gross=15.00 (includes a DISPUTED 500000-cent invoice) and
          dso_net=13.33 (excludes it) — the dual variant lives on the ARInvoice collections domain,
          a different entity domain from the retainer billing variant above.
        test_recipe:
          setup:
            - "Client has two OPEN AR invoices totalling 4000000 cents and one DISPUTED invoice of 500000 cents (gross outstanding 4500000)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Gamma LLC", state_code: "NY", retainer_tier: "ESSENTIALS" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/ar-invoices"
              payload: { counterparty_name: "Cust1", amount_cents: 2500000, issue_date: "2026-03-01T00:00:00Z", due_date: "2026-03-31T00:00:00Z" }
              as: Bookkeeper
              captures: { ar1: $.data.id }
            - call: "POST /clients/${cid}/ar-invoices"
              payload: { counterparty_name: "Cust2", amount_cents: 1500000, issue_date: "2026-03-01T00:00:00Z", due_date: "2026-03-31T00:00:00Z" }
              as: Bookkeeper
              captures: { ar2: $.data.id }
            - call: "POST /clients/${cid}/ar-invoices"
              payload: { counterparty_name: "Cust3", amount_cents: 500000, issue_date: "2026-03-01T00:00:00Z", due_date: "2026-03-31T00:00:00Z" }
              as: Bookkeeper
              captures: { ar3: $.data.id }
            - call: "POST /ar-invoices/${ar3}/dispute"
              payload: {}
              as: ClientContact
              as_user_id: "${cid}"
          trigger:
            - call: "GET /clients/${cid}/ar-summary"
              payload: { credit_sales_cents: 9000000 }
              as: CFO
              captures: { dg: $.data.dso_gross, dn: $.data.dso_net }
          assert:
            - "ar-summary.gross_outstanding_cents == 4500000"
            - "ar-summary.net_outstanding_cents == 4000000"
            - "ar-summary.dso_gross == 15.00"
            - "ar-summary.dso_net == 13.33"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: retainer_tiered_rate_with_conditional_surcharge
        grounds:
          - calculations.retainer_invoice_amount
          - entities.Client.fields.retainer_tier
          - entities.MonthlyClose.fields.txn_count
        distinguishing_aspect: |
          Mode (a): retainer_invoice_amount selects a tier rate from a 3-row table, computes overage
          above the included volume, and conditionally adds a surcharge — three inputs (tier, txn_count,
          catchup_active) with non-linear tiered-rate-plus-conditional-branch interaction. CFO tier,
          1500 txns, catchup active -> base 600000 + overage 13500 + surcharge 120000 = 733500.
        test_recipe:
          setup:
            - "Client is CFO tier with an active catch-up project; MonthlyClose has txn_count=1500 (300 over the 1200 included)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Delta Inc", state_code: "TX", retainer_tier: "CFO" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/catchup-projects"
              payload: { months_behind: 6, quoted_fee_cents: 900000 }
              as: CFO
              captures: { cp: $.data.id }
            - call: "POST /catchup-projects/${cp}/scope"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 2, txn_count: 1500 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "GET /clients/${cid}"
              payload: {}
              as: CFO
              captures: { cver: $.data.version }
          trigger:
            - call: "POST /clients/${cid}/retainer-invoices"
              payload: { monthly_close_id: "${mc}", expected_client_version: "${cver}" }
              as: CFO
              captures: { inv: $.data.id }
          assert:
            - "RetainerInvoice.${inv}.base_fee_cents == 600000"
            - "RetainerInvoice.${inv}.overage_cents == 13500"
            - "RetainerInvoice.${inv}.surcharge_cents == 120000"
            - "RetainerInvoice.${inv}.total_cents == 733500"

      - name: payroll_allocation_round_per_line_then_remainder
        grounds:
          - calculations.payroll_cost_allocation
          - entities.PayrollAllocation.fields.allocated_cents
          - state_machines.PayrollRun.DRAFT_to_ALLOCATED
        distinguishing_aspect: |
          Mode (b): payroll_cost_allocation pins rounding order — round each department's share to
          cents FIRST, then assign the leftover remainder to the largest-gross department
          (tie-break earliest created_at). Three equal 500000 departments over a 1000000 total round
          to 333333 each (sum 999999); the 1-cent remainder lands on the first-created department,
          giving 333334/333333/333333 — a sum-then-round order would not.
        test_recipe:
          setup:
            - "PayrollRun has three PayrollAllocation lines, each dept_gross_cents=500000, created in order A,B,C; total_employer_cost_cents=1000000."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Epsilon LLC", state_code: "WA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 3, txn_count: 100 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /clients/${cid}/payroll-runs"
              payload: { monthly_close_id: "${mc}", pay_date: "2026-03-31T00:00:00Z", pay_period_start: "2026-03-01T00:00:00Z", pay_period_end: "2026-04-01T00:00:00Z", total_employer_cost_cents: 1000000 }
              as: Bookkeeper
              captures: { pr: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocations"
              payload: { department_name: "A", dept_gross_cents: 500000 }
              as: Bookkeeper
              captures: { aA: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocations"
              payload: { department_name: "B", dept_gross_cents: 500000 }
              as: Bookkeeper
              captures: { aB: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocations"
              payload: { department_name: "C", dept_gross_cents: 500000 }
              as: Bookkeeper
              captures: { aC: $.data.id }
          trigger:
            - call: "POST /payroll-runs/${pr}/allocate"
              payload: {}
              as: Bookkeeper
          assert:
            - "PayrollAllocation.${aA}.allocated_cents == 333334"
            - "PayrollAllocation.${aB}.allocated_cents == 333333"
            - "PayrollAllocation.${aC}.allocated_cents == 333333"
            - "sum of PayrollAllocation.allocated_cents over run ${pr} == 1000000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: catchup_revision_cycle_round_counter
        grounds:
          - state_machines.CatchupProject.CLIENT_REVIEW_to_REVISION
          - state_machines.CatchupProject.REVISION_to_CLIENT_REVIEW
          - entities.CatchupProject.fields.revision_rounds
        distinguishing_aspect: |
          CatchupProject is cyclic: CLIENT_REVIEW->REVISION->CLIENT_REVIEW->REVISION loops, and
          revision_rounds increments on each reject — after two reject/resubmit loops revision_rounds==2
          while the entity is back in CLIENT_REVIEW. This non-linearity sits on CatchupProject.
        test_recipe:
          setup:
            - "A CatchupProject is in CLIENT_REVIEW after start + submit; it will be rejected and resubmitted twice."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Zeta LLC", state_code: "CA", retainer_tier: "ESSENTIALS" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/catchup-projects"
              payload: { months_behind: 3, quoted_fee_cents: 400000 }
              as: CFO
              captures: { cp: $.data.id }
            - call: "POST /catchup-projects/${cp}/scope"
              payload: {}
              as: CFO
            - call: "POST /catchup-projects/${cp}/start"
              payload: {}
              as: Bookkeeper
            - call: "POST /catchup-projects/${cp}/submit-for-review"
              payload: {}
              as: Bookkeeper
            - call: "POST /catchup-projects/${cp}/reject"
              payload: {}
              as: ClientContact
              as_user_id: "${cid}"
            - call: "POST /catchup-projects/${cp}/submit-for-review"
              payload: {}
              as: Bookkeeper
          trigger:
            - call: "POST /catchup-projects/${cp}/reject"
              payload: {}
              as: ClientContact
              as_user_id: "${cid}"
            - call: "POST /catchup-projects/${cp}/submit-for-review"
              payload: {}
              as: Bookkeeper
          assert:
            - "CatchupProject.${cp}.status == CLIENT_REVIEW"
            - "CatchupProject.${cp}.revision_rounds == 2"

      - name: tax_handoff_fork_join_both_signoffs
        grounds:
          - state_machines.TaxHandoff.BOOKS_REVIEW_to_ADVISORY_REVIEW
          - state_machines.TaxHandoff.ADVISORY_REVIEW_to_READY
          - entities.TaxHandoff.fields.books_signoff
          - entities.TaxHandoff.fields.advisory_signoff
        distinguishing_aspect: |
          TaxHandoff is a branching fork-join on a different entity: start-reviews forks into two
          branches and only when BOTH books_signoff and advisory_signoff are true does status reach
          READY. After the first (books) sign-off alone, status is ADVISORY_REVIEW, not READY.
        test_recipe:
          setup:
            - "A TaxHandoff for tax_year 2025 is in BOOKS_REVIEW: the client's (2025,12) MonthlyClose is FINALIZED and start-reviews has fired."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Eta LLC", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2025, period_month: 12, txn_count: 50 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "Reconcile", weight: 1 }
              as: Bookkeeper
              captures: { t1: $.data.id }
            - call: "POST /close-tasks/${t1}/transition"
              payload: { to_status: "DONE" }
              as: Bookkeeper
            - call: "POST /monthly-closes/${mc}/approve-review"
              payload: {}
              as: CFO
            - call: "POST /monthly-closes/${mc}/finalize"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid}/tax-handoffs"
              payload: { tax_year: 2025 }
              as: CFO
              captures: { th: $.data.id }
            - call: "POST /tax-handoffs/${th}/start-reviews"
              payload: {}
              as: CFO
          trigger:
            - call: "POST /tax-handoffs/${th}/books-signoff"
              payload: {}
              as: Bookkeeper
          assert:
            - "TaxHandoff.${th}.books_signoff == true"
            - "TaxHandoff.${th}.advisory_signoff == false"
            - "TaxHandoff.${th}.status == ADVISORY_REVIEW"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: offboard_cancels_catchup_clears_active_flag
        grounds:
          - state_machines.Client.ACTIVE_to_OFFBOARDED
          - state_machines.CatchupProject.DRAFT_to_CANCELLED
          - entities.Client.fields.catchup_active
        distinguishing_aspect: |
          Depth-3 cascade from POST /clients/{id}/offboard: offboard sets Client.engagement_status=OFFBOARDED
          (hop 1) -> that engagement transition cancels the client's non-terminal CatchupProject to CANCELLED
          (hop 2) -> the CatchupProject reaching a terminal state recomputes Client.catchup_active to false (hop 3).
          Each hop is caused by the previous, not directly by offboard.
        test_recipe:
          setup:
            - "Client is fully onboarded and ACTIVE with catchup_active=true (a SCOPED CatchupProject); no open closes."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Theta LLC", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/schedule-kickoff"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid}/start-ledger-setup"
              payload: {}
              as: Bookkeeper
            - call: "POST /clients/${cid}/ledger-accounts"
              payload: { account_code: "1000", account_type: "ASSET", name: "Cash" }
              as: Bookkeeper
              captures: { la: $.data.id }
            - call: "POST /clients/${cid}/complete-onboarding"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid}/activate-engagement"
              payload: {}
              as: CFO
            - call: "POST /clients/${cid}/catchup-projects"
              payload: { months_behind: 5, quoted_fee_cents: 700000 }
              as: CFO
              captures: { cp: $.data.id }
            - call: "POST /catchup-projects/${cp}/scope"
              payload: {}
              as: CFO
          trigger:
            - call: "POST /clients/${cid}/offboard"
              payload: {}
              as: CFO
          assert:
            - "Client.${cid}.engagement_status == OFFBOARDED"
            - "CatchupProject.${cp}.status == CANCELLED"
            - "Client.${cid}.catchup_active == false"

      - name: payroll_reverse_zeroes_allocations
        grounds:
          - state_machines.PayrollRun.POSTED_to_REVERSED
          - entities.PayrollAllocation.fields.allocated_cents
        distinguishing_aspect: |
          Depth-2 cascade from POST /payroll-runs/{id}/reverse (a different trigger than offboard):
          reverse sets PayrollRun.status=REVERSED (hop 1) -> the run reaching REVERSED zeroes every
          PayrollAllocation.allocated_cents on that run (hop 2). The previously allocated 333334/333333/333333
          all become 0.
        test_recipe:
          setup:
            - "A PayrollRun is POSTED with three allocations summing to 1000000; the linked close is not finalized."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Iota LLC", state_code: "OR", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 4, txn_count: 80 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /clients/${cid}/payroll-runs"
              payload: { monthly_close_id: "${mc}", pay_date: "2026-04-30T00:00:00Z", pay_period_start: "2026-04-01T00:00:00Z", pay_period_end: "2026-05-01T00:00:00Z", total_employer_cost_cents: 1000000 }
              as: Bookkeeper
              captures: { pr: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocations"
              payload: { department_name: "A", dept_gross_cents: 500000 }
              as: Bookkeeper
              captures: { aA: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocations"
              payload: { department_name: "B", dept_gross_cents: 500000 }
              as: Bookkeeper
              captures: { aB: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocations"
              payload: { department_name: "C", dept_gross_cents: 500000 }
              as: Bookkeeper
              captures: { aC: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocate"
              payload: {}
              as: Bookkeeper
            - call: "POST /payroll-runs/${pr}/post"
              payload: {}
              as: CFO
          trigger:
            - call: "POST /payroll-runs/${pr}/reverse"
              payload: {}
              as: CFO
          assert:
            - "PayrollRun.${pr}.status == REVERSED"
            - "PayrollAllocation.${aA}.allocated_cents == 0"
            - "PayrollAllocation.${aB}.allocated_cents == 0"
            - "PayrollAllocation.${aC}.allocated_cents == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: complete_onboarding_state_beats_no_ledger
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - state_machines.Client.LEDGER_SETUP_to_ONBOARDED
        distinguishing_aspect: |
          A complete-onboarding request that violates BOTH the state precondition (client still in
          KICKOFF_SCHEDULED, not LEDGER_SETUP -> ERR_INVALID_STATE, priority 4, category state) AND the
          ledger precondition (no ACTIVE ledger account -> ERR_NO_LEDGER_ACCOUNTS, priority 9, category
          business_referential) returns ERR_INVALID_STATE — the state vs business_referential pair resolves
          to the lower-priority-number state error.
        test_recipe:
          setup:
            - "Client is in onboarding_status KICKOFF_SCHEDULED (not LEDGER_SETUP) and has no ledger accounts."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Kappa LLC", state_code: "CA", retainer_tier: "ESSENTIALS" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/schedule-kickoff"
              payload: {}
              as: CFO
          trigger:
            - call: "POST /clients/${cid}/complete-onboarding"
              payload: {}
              as: CFO
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: forecast_approve_state_beats_covenant
        grounds:
          - validations[priority=4]
          - validations[priority=14]
          - state_machines.CashFlowForecast.DRAFT_to_APPROVED
        distinguishing_aspect: |
          A forecast-approve request that violates BOTH the state precondition (forecast already
          SUPERSEDED, not DRAFT -> ERR_INVALID_STATE, priority 4, category state) AND the covenant
          floor (min projected below floor -> ERR_COVENANT_BREACH, priority 14, category business_safety)
          returns ERR_INVALID_STATE — a different category pair (state vs business_safety) than the
          state vs business_referential conflict above.
        test_recipe:
          setup:
            - "Client covenant_floor_cents=600000. A first forecast f1 (min 400000, below floor) is APPROVED, then superseded by a second APPROVED forecast f2, leaving f1 in SUPERSEDED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Lambda LLC", state_code: "CA", retainer_tier: "CFO", covenant_floor_cents: 600000 }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/forecasts"
              payload: { opening_balance_cents: 500000 }
              as: CFO
              captures: { f1: $.data.id }
            - call: "POST /forecasts/${f1}/lines"
              payload: { effective_date: "2026-04-05T00:00:00Z", direction: "OUTFLOW", amount_cents: 100000 }
              as: CFO
            - call: "POST /forecasts/${f1}/lines"
              payload: { effective_date: "2026-04-10T00:00:00Z", direction: "INFLOW", amount_cents: 1000000 }
              as: CFO
            - call: "GET /clients/${cid}"
              payload: {}
              as: CFO
              captures: { cver1: $.data.version }
            - call: "POST /forecasts/${f1}/approve"
              payload: { expected_client_version: "${cver1}" }
              as: CFO
            - call: "POST /clients/${cid}/forecasts"
              payload: { opening_balance_cents: 2000000 }
              as: CFO
              captures: { f2: $.data.id }
            - call: "GET /clients/${cid}"
              payload: {}
              as: CFO
              captures: { cver2: $.data.version }
            - call: "POST /forecasts/${f2}/approve"
              payload: { expected_client_version: "${cver2}" }
              as: CFO
            - call: "GET /clients/${cid}"
              payload: {}
              as: CFO
              captures: { cver3: $.data.version }
          trigger:
            - call: "POST /forecasts/${f1}/approve"
              payload: { expected_client_version: "${cver3}" }
              as: CFO
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: covenant_floor_inclusive_boundary
        grounds:
          - validations[priority=14]
          - calculations.cash_flow_projection
          - state_machines.CashFlowForecast.DRAFT_to_APPROVED
          - entities.CashFlowForecast.fields.min_projected_balance_cents
        distinguishing_aspect: |
          Forecast approval uses >= against the covenant floor: a forecast whose
          min_projected_balance_cents equals the floor exactly (400000 == floor 400000) is APPROVED,
          whereas one cent lower would breach. This boundary is the covenant balance metric on the forecasts endpoint.
        test_recipe:
          setup:
            - "Client covenant_floor_cents=400000; a DRAFT forecast opens at 500000 with one OUTFLOW of 100000, so min_projected_balance_cents == 400000 exactly."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Mu LLC", state_code: "CA", retainer_tier: "GROWTH", covenant_floor_cents: 400000 }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/forecasts"
              payload: { opening_balance_cents: 500000 }
              as: CFO
              captures: { f1: $.data.id }
            - call: "POST /forecasts/${f1}/lines"
              payload: { effective_date: "2026-04-05T00:00:00Z", direction: "OUTFLOW", amount_cents: 100000 }
              as: CFO
            - call: "GET /clients/${cid}"
              payload: {}
              as: CFO
              captures: { cver: $.data.version }
          trigger:
            - call: "POST /forecasts/${f1}/approve"
              payload: { expected_client_version: "${cver}" }
              as: CFO
          assert:
            - "CashFlowForecast.${f1}.min_projected_balance_cents == 400000"
            - "CashFlowForecast.${f1}.status == APPROVED"

      - name: retainer_overage_zero_at_included_boundary
        grounds:
          - calculations.retainer_invoice_amount
          - entities.MonthlyClose.fields.txn_count
          - entities.RetainerInvoice.fields.overage_cents
        distinguishing_aspect: |
          Retainer overage uses txn_count > included_txns (strict): at exactly the ESSENTIALS included
          volume (200) overage_cents == 0, while 201 transactions would yield overage_cents == 75. This is a
          zero-overage count boundary on the retainer-invoices endpoint — a different metric and endpoint
          than the covenant balance boundary above.
        test_recipe:
          setup:
            - "Client is ESSENTIALS tier, no catch-up; MonthlyClose has txn_count == 200 (exactly the included volume)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Nu LLC", state_code: "CA", retainer_tier: "ESSENTIALS" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 5, txn_count: 200 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "GET /clients/${cid}"
              payload: {}
              as: CFO
              captures: { cver: $.data.version }
          trigger:
            - call: "POST /clients/${cid}/retainer-invoices"
              payload: { monthly_close_id: "${mc}", expected_client_version: "${cver}" }
              as: CFO
              captures: { inv: $.data.id }
          assert:
            - "RetainerInvoice.${inv}.overage_cents == 0"
            - "RetainerInvoice.${inv}.total_cents == 150000"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: tax_handoff_requires_finalized_december_close
        grounds:
          - validations[priority=7]
          - state_machines.TaxHandoff.PREPARING_to_BOOKS_REVIEW
          - state_machines.MonthlyClose.READY_FOR_REVIEW_to_FINALIZED
        distinguishing_aspect: |
          TaxHandoff start-reviews depends on a different entity's state: the client's (tax_year,12)
          MonthlyClose must be FINALIZED. With that December close only READY_FOR_REVIEW (not FINALIZED),
          start-reviews fails ERR_DECEMBER_CLOSE_NOT_FINAL — the TaxHandoff<->MonthlyClose entity pair.
        test_recipe:
          setup:
            - "Client has a (2025,12) MonthlyClose in READY_FOR_REVIEW (all tasks DONE) but NOT finalized; a TaxHandoff for 2025 is PREPARING."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Xi LLC", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2025, period_month: 12, txn_count: 40 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "Reconcile", weight: 1 }
              as: Bookkeeper
              captures: { t1: $.data.id }
            - call: "POST /close-tasks/${t1}/transition"
              payload: { to_status: "DONE" }
              as: Bookkeeper
            - call: "POST /clients/${cid}/tax-handoffs"
              payload: { tax_year: 2025 }
              as: CFO
              captures: { th: $.data.id }
          trigger:
            - call: "POST /tax-handoffs/${th}/start-reviews"
              payload: {}
              as: CFO
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_DECEMBER_CLOSE_NOT_FINAL"

      - name: payroll_post_blocked_by_finalized_close
        grounds:
          - validations[priority=8]
          - state_machines.PayrollRun.ALLOCATED_to_POSTED
          - state_machines.MonthlyClose.READY_FOR_REVIEW_to_FINALIZED
        distinguishing_aspect: |
          PayrollRun post depends on a different entity pair (PayrollRun<->MonthlyClose): posting an
          ALLOCATED run whose linked MonthlyClose is FINALIZED fails ERR_CLOSE_FINALIZED. Distinct from
          the TaxHandoff<->MonthlyClose dependency above.
        test_recipe:
          setup:
            - "Client has a FINALIZED MonthlyClose; a PayrollRun linked to that close is ALLOCATED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Omicron LLC", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 6, txn_count: 70 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /clients/${cid}/payroll-runs"
              payload: { monthly_close_id: "${mc}", pay_date: "2026-06-30T00:00:00Z", pay_period_start: "2026-06-01T00:00:00Z", pay_period_end: "2026-07-01T00:00:00Z", total_employer_cost_cents: 600000 }
              as: Bookkeeper
              captures: { pr: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocations"
              payload: { department_name: "Ops", dept_gross_cents: 600000 }
              as: Bookkeeper
              captures: { aOps: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocate"
              payload: {}
              as: Bookkeeper
            - call: "POST /monthly-closes/${mc}/close-tasks"
              payload: { name: "Reconcile", weight: 1 }
              as: Bookkeeper
              captures: { t1: $.data.id }
            - call: "POST /close-tasks/${t1}/transition"
              payload: { to_status: "DONE" }
              as: Bookkeeper
            - call: "POST /monthly-closes/${mc}/approve-review"
              payload: {}
              as: CFO
            - call: "POST /monthly-closes/${mc}/finalize"
              payload: {}
              as: CFO
          trigger:
            - call: "POST /payroll-runs/${pr}/post"
              payload: {}
              as: CFO
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_CLOSE_FINALIZED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: payroll_period_half_open_overlap_rejected
        grounds:
          - validations[priority=13]
          - entities.PayrollRun.fields.pay_period_start
          - entities.PayrollRun.fields.pay_period_end
        distinguishing_aspect: |
          PayrollRun pay periods are half-open [start,end) continuous intervals: a second run
          [2026-03-15, 2026-04-15) overlapping an existing non-REVERSED run [2026-03-01, 2026-04-01)
          is rejected ERR_PAY_PERIOD_OVERLAP. This is continuous half-open interval arithmetic on PayrollRun.
        test_recipe:
          setup:
            - "Client has an existing non-REVERSED PayrollRun covering [2026-03-01, 2026-04-01)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Pi LLC", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 3, txn_count: 60 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /clients/${cid}/payroll-runs"
              payload: { monthly_close_id: "${mc}", pay_date: "2026-03-31T00:00:00Z", pay_period_start: "2026-03-01T00:00:00Z", pay_period_end: "2026-04-01T00:00:00Z", total_employer_cost_cents: 500000 }
              as: Bookkeeper
              captures: { pr1: $.data.id }
          trigger:
            - call: "POST /clients/${cid}/payroll-runs"
              payload: { monthly_close_id: "${mc}", pay_date: "2026-04-14T00:00:00Z", pay_period_start: "2026-03-15T00:00:00Z", pay_period_end: "2026-04-15T00:00:00Z", total_employer_cost_cents: 500000 }
              as: Bookkeeper
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_PAY_PERIOD_OVERLAP"

      - name: monthly_close_period_cell_duplicate_rejected
        grounds:
          - validations[priority=12]
          - entities.MonthlyClose.fields.period_year
          - entities.MonthlyClose.fields.period_month
        distinguishing_aspect: |
          MonthlyClose periods are discrete (year,month) cells, not continuous intervals: a second
          non-FINALIZED close for the same (2026,7) cell collides ERR_DUPLICATE_PERIOD by exact-cell
          equality, a different interval semantics (discrete point) on a different resource (MonthlyClose)
          than PayrollRun's half-open continuous overlap.
        test_recipe:
          setup:
            - "Client already has a non-FINALIZED MonthlyClose for (2026,7)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Rho LLC", state_code: "CA", retainer_tier: "ESSENTIALS" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 7, txn_count: 30 }
              as: Bookkeeper
              captures: { mc1: $.data.id }
          trigger:
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 7, txn_count: 31 }
              as: Bookkeeper
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_DUPLICATE_PERIOD"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payroll_allocation_sum_conserved_then_drained
        grounds:
          - calculations.payroll_cost_allocation
          - state_machines.PayrollRun.DRAFT_to_ALLOCATED
          - state_machines.PayrollRun.POSTED_to_REVERSED
          - entities.PayrollAllocation.fields.allocated_cents
        distinguishing_aspect: |
          Conserved quantity = total allocated cents. After allocate, sum(PayrollAllocation.allocated_cents)
          == PayrollRun.total_employer_cost_cents (1000000) exactly; the compensating reverse drains it to
          sum == 0. Allocate-then-reverse leaves zero drift in the monetary conserved quantity.
        test_recipe:
          setup:
            - "A PayrollRun is POSTED with three 500000-gross allocations; total_employer_cost_cents=1000000; linked close not finalized."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Sigma LLC", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 8, txn_count: 90 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "POST /clients/${cid}/payroll-runs"
              payload: { monthly_close_id: "${mc}", pay_date: "2026-08-31T00:00:00Z", pay_period_start: "2026-08-01T00:00:00Z", pay_period_end: "2026-09-01T00:00:00Z", total_employer_cost_cents: 1000000 }
              as: Bookkeeper
              captures: { pr: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocations"
              payload: { department_name: "A", dept_gross_cents: 500000 }
              as: Bookkeeper
              captures: { aA: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocations"
              payload: { department_name: "B", dept_gross_cents: 500000 }
              as: Bookkeeper
              captures: { aB: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocations"
              payload: { department_name: "C", dept_gross_cents: 500000 }
              as: Bookkeeper
              captures: { aC: $.data.id }
            - call: "POST /payroll-runs/${pr}/allocate"
              payload: {}
              as: Bookkeeper
            - call: "POST /payroll-runs/${pr}/post"
              payload: {}
              as: CFO
          trigger:
            - call: "POST /payroll-runs/${pr}/reverse"
              payload: {}
              as: CFO
          assert:
            - "before reverse: sum of PayrollAllocation.allocated_cents over run ${pr} == 1000000"
            - "after reverse: sum of PayrollAllocation.allocated_cents over run ${pr} == 0"
            - "PayrollRun.${pr}.status == REVERSED"

      - name: catchup_active_flag_invariant_scope_then_cancel
        grounds:
          - state_machines.CatchupProject.DRAFT_to_SCOPED
          - state_machines.CatchupProject.DRAFT_to_CANCELLED
          - entities.Client.fields.catchup_active
        distinguishing_aspect: |
          Conserved quantity = Client.catchup_active (a boolean existence flag, a different kind of
          conserved quantity than allocated cents). Invariant: catchup_active == (a non-terminal
          CatchupProject exists). Forward scope sets it true; compensating cancel restores it to false,
          leaving the flag back at its pre-scope value with no drift.
        test_recipe:
          setup:
            - "Client has catchup_active=false and a single CatchupProject that will be scoped then cancelled."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Tau LLC", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/catchup-projects"
              payload: { months_behind: 2, quoted_fee_cents: 300000 }
              as: CFO
              captures: { cp: $.data.id }
            - call: "POST /catchup-projects/${cp}/scope"
              payload: {}
              as: CFO
          trigger:
            - call: "POST /catchup-projects/${cp}/cancel"
              payload: {}
              as: CFO
          assert:
            - "before cancel: Client.${cid}.catchup_active == true"
            - "after cancel: CatchupProject.${cp}.status == CANCELLED"
            - "after cancel: Client.${cid}.catchup_active == false"

  # ===========================================================================
  - rule_id: optimistic_concurrency
    instances:
      - name: forecast_approve_stale_client_version_rejected
        grounds:
          - concurrency_rules[forecast-approve-stale-client]
          - state_machines.CashFlowForecast.DRAFT_to_APPROVED
          - entities.Client.fields.version
        distinguishing_aspect: |
          Approving forecast f2 with expected_client_version equal to the client version observed
          BEFORE f1's approval (which bumped Client.version) is rejected ERR_STALE_VERSION (412): the
          first approval advanced the parent Client's version, so the second carries a stale view.
        test_recipe:
          setup:
            - "Client covenant_floor_cents=0 has two DRAFT forecasts f1 and f2, both with min_projected_balance >= 0."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Upsilon LLC", state_code: "CA", retainer_tier: "GROWTH", covenant_floor_cents: 0 }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/forecasts"
              payload: { opening_balance_cents: 1000000 }
              as: CFO
              captures: { f1: $.data.id }
            - call: "POST /clients/${cid}/forecasts"
              payload: { opening_balance_cents: 2000000 }
              as: CFO
              captures: { f2: $.data.id }
            - call: "GET /clients/${cid}"
              payload: {}
              as: CFO
              captures: { cver_stale: $.data.version }
            - call: "POST /forecasts/${f1}/approve"
              payload: { expected_client_version: "${cver_stale}" }
              as: CFO
          trigger:
            - call: "POST /forecasts/${f2}/approve"
              payload: { expected_client_version: "${cver_stale}" }
              as: CFO
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_VERSION"

      - name: retainer_issue_stale_client_version_rejected
        grounds:
          - concurrency_rules[retainer-issue-stale-client]
          - entities.Client.fields.version
          - state_machines.CatchupProject.DRAFT_to_SCOPED
        distinguishing_aspect: |
          Issuing a retainer invoice with expected_client_version captured BEFORE a CatchupProject
          scope (which bumped Client.version and flipped catchup_active) is rejected ERR_STALE_VERSION
          (412), preventing an invoice minted off out-of-date surcharge inputs.
        test_recipe:
          setup:
            - "Client is GROWTH tier with a MonthlyClose (txn_count 650). Client version is captured, then a CatchupProject is scoped, advancing the version."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Phi LLC", state_code: "CA", retainer_tier: "GROWTH" }
              as: CFO
              captures: { cid: $.data.id }
            - call: "POST /clients/${cid}/monthly-closes"
              payload: { period_year: 2026, period_month: 9, txn_count: 650 }
              as: Bookkeeper
              captures: { mc: $.data.id }
            - call: "GET /clients/${cid}"
              payload: {}
              as: CFO
              captures: { cver_stale: $.data.version }
            - call: "POST /clients/${cid}/catchup-projects"
              payload: { months_behind: 3, quoted_fee_cents: 400000 }
              as: CFO
              captures: { cp: $.data.id }
            - call: "POST /catchup-projects/${cp}/scope"
              payload: {}
              as: CFO
          trigger:
            - call: "POST /clients/${cid}/retainer-invoices"
              payload: { monthly_close_id: "${mc}", expected_client_version: "${cver_stale}" }
              as: CFO
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_VERSION"
