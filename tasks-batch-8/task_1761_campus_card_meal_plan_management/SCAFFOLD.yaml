    side_effects: ["increments MealPlanEnrollment.version by 1", "enrollment_cancellation_credit posts PRORATION_CREDIT", "pending change requests VOID (ENROLLMENT_CANCELLED)"]
  - method: GET
    path: "/api/enrollments/{id}/change-requests"
