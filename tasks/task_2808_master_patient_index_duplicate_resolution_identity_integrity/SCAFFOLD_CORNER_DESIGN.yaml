              as_user_id: "analyst-1"
          assert:
            - "${pair_s4_state3} == \"UNDER_REVIEW\" and ${pair_s4_v3} == 3"
            - "Trigger: HTTP 409 with $.data.error_id == \"ERR_PAIR_INVALID_STATE\""
            - "DuplicateCandidatePair.${pair_s4_id}.queue_state == UNDER_REVIEW and version == 3 (the rejected call bumped nothing)"
            - "DuplicateCandidatePair.${pair_s4_id}.updated_at == \"2026-08-01T00:00:00.000Z\""

      - name: apply_overlay_correction_executes_every_declared_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.OverlayCorrection.DETECTED_to_UNDER_CORRECTION
          - endpoints[POST /mpi/overlay-corrections/{id}/apply]
          - entities.OverlayCorrection.fields.prior_field_snapshot
        distinguishing_aspect: "One apply call must produce all four declared effects at once: overlay DETECTED -> UNDER_CORRECTION, both corrected keys written onto the record with its version bumped, one QUEUED OVERLAY_CORRECTION propagation task per ACTIVE downstream system, and no ContaminationRemediation because 5 is not above the threshold of 25."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-S5."
            - "One ACTIVE DownstreamSystem OVL-SYS with propagation_mode BATCH, ack_required true and max_concurrent_dispatch 2."
            - "One PatientRecord S5-1000 with last_name Whitfield and postal_code 27601 at version 1."
            - "One OverlayCorrection in DETECTED for that record with corrected_field_snapshot {last_name: Whitford, postal_code: 27605} and affected_clinical_element_count 5; opening it re-derived the record to REMEDIATION_PENDING and advanced record.version to 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-S5", name: "Overlay Side Effect Clinic", region_code: "US-NC", registrar_headcount: 3 }
              as: MpiAdmin
              captures: { site_s5_id: $.data.id }
            - call: "POST /mpi/downstream-systems"
              payload: { system_code: "OVL-SYS", name: "Overlay Consumer", propagation_mode: "BATCH", ack_required: true, max_concurrent_dispatch: 2 }
              as: MpiAdmin
              captures: { sys_s5_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s5_id}", mrn: "S5-1000", last_name: "Whitfield", first_name: "Miriam", dob: "1976-02-18", sex: "F", ssn_last4: "8484", postal_code: "27601", phone: "9195550101", clinical_element_count: 9 }
              as: IdentityAnalyst
              captures: { rec_s5_id: $.data.id, rec_s5_v0: $.data.version }
            - call: "POST /mpi/overlay-corrections"
              payload: { record_id: "${rec_s5_id}", overlay_type: "DEMOGRAPHIC_OVERWRITE", corrected_field_snapshot: { last_name: "Whitford", postal_code: "27605" }, affected_clinical_element_count: 5, encounter_from_date: "2026-07-10", encounter_to_date: "2026-07-14", expected_record_version: "${rec_s5_v0}" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { ov_s5_id: $.data.id, ov_s5_prior: $.data.prior_field_snapshot, ov_s5_state0: $.data.state }
          trigger:
            - call: "POST /mpi/overlay-corrections/${ov_s5_id}/apply"
              payload: {}
              as: IdentityStewardApprover
              as_user_id: "steward-1"
          assert:
            - "${ov_s5_state0} == \"DETECTED\" and ${ov_s5_prior} == {\"last_name\": \"Whitfield\", \"postal_code\": \"27601\"} and ${rec_s5_v0} == 1"
            - "Trigger: HTTP 200 with $.data.state == UNDER_CORRECTION and $.data.version == 2 and $.data.created_by_user_id == \"analyst-1\""
            - "PatientRecord.${rec_s5_id}.last_name == \"Whitford\" and postal_code == \"27605\""
            - "PatientRecord.${rec_s5_id}.first_name == \"Miriam\" and phone == \"9195550101\" (keys absent from corrected_field_snapshot are untouched)"
            - "PatientRecord.${rec_s5_id}.enterprise_id == \"EID-SITE-S5-S5-1000\" (mrn is not a correctable key, so the enterprise identity is stable)"
            - "PatientRecord.${rec_s5_id}.version == 3 (v1 create, v2 overlay opened, v3 apply) and integrity_state == REMEDIATION_PENDING"
            - "GET /mpi/propagation-tasks?overlay_correction_id=${ov_s5_id} returns exactly 1 row with state == QUEUED, operation_kind == OVERLAY_CORRECTION, downstream_system_id == ${sys_s5_id} and propagation_deadline_at == \"2026-08-04T00:00:00Z\""
            - "GET /mpi/contamination-remediations?overlay_correction_id=${ov_s5_id} returns exactly 0 rows (5 is not greater than CONTAMINATION_REVIEW_ELEMENT_THRESHOLD 25)"
            - "DownstreamSystem.${sys_s5_id}.unacked_task_count == 1"

      - name: complete_overlay_correction_releases_the_remediation_hold
        claim_type: side_effect_execution
        grounds:
          - state_machines.OverlayCorrection.UNDER_CORRECTION_to_CORRECTED
          - state_machines.PatientRecord.REMEDIATION_PENDING_to_CLEAR
          - endpoints[POST /mpi/overlay-corrections/{id}/complete]
        distinguishing_aspect: "Completing the overlay is the only event that releases the record's REMEDIATION_PENDING hold in this chain: integrity_state re-derives to CLEAR and the record's version advances a fourth time, while the corrected demographic values stay written."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-S6 and NO DownstreamSystem, so the apply produces no propagation tasks."
            - "One PatientRecord S6-1000 at version 1; one OverlayCorrection with affected_clinical_element_count 5 opened against it (record version 2, integrity_state REMEDIATION_PENDING) and then applied (overlay UNDER_CORRECTION, record version 3)."
            - "Because 5 is not above CONTAMINATION_REVIEW_ELEMENT_THRESHOLD 25, no ContaminationRemediation exists, so the complete transition's precondition holds."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-S6", name: "Overlay Completion Clinic", region_code: "US-SC", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_s6_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s6_id}", mrn: "S6-1000", last_name: "Pemberton", first_name: "Alice", dob: "1962-12-19", sex: "F", ssn_last4: "6363", postal_code: "29201", phone: "8035550101", clinical_element_count: 12 }
              as: IdentityAnalyst
              captures: { rec_s6_id: $.data.id, rec_s6_v0: $.data.version }
            - call: "POST /mpi/overlay-corrections"
              payload: { record_id: "${rec_s6_id}", overlay_type: "CLINICAL_MISFILE", corrected_field_snapshot: { first_name: "Alicia" }, affected_clinical_element_count: 5, encounter_from_date: "2026-07-20", encounter_to_date: "2026-07-22", expected_record_version: "${rec_s6_v0}" }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { ov_s6_id: $.data.id }
            - call: "POST /mpi/overlay-corrections/${ov_s6_id}/apply"
              payload: {}
              as: IdentityStewardApprover
              as_user_id: "steward-1"
            - call: "GET /mpi/patient-records/${rec_s6_id}"
              payload: {}
              as: MpiAdmin
              captures: { rec_s6_integrity_mid: $.data.integrity_state, rec_s6_v_mid: $.data.version }
          trigger:
            - call: "POST /mpi/overlay-corrections/${ov_s6_id}/complete"
              payload: { closure_note: "Misfiled encounters returned to the correct chart." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
          assert:
            - "${rec_s6_integrity_mid} == \"REMEDIATION_PENDING\" and ${rec_s6_v_mid} == 3"
            - "Trigger: HTTP 200 with $.data.state == CORRECTED and $.data.version == 3 and $.data.closure_note == \"Misfiled encounters returned to the correct chart.\""
            - "PatientRecord.${rec_s6_id}.integrity_state == CLEAR and version == 4"
            - "PatientRecord.${rec_s6_id}.first_name == \"Alicia\" (the correction is not rolled back by completion)"
            - "PatientRecord.${rec_s6_id}.clinical_element_count == 12 (completing an overlay moves no elements)"
            - "GET /mpi/overlay-corrections?record_id=${rec_s6_id}&state=CORRECTED returns exactly 1 row"

      - name: substantiate_an_unsubstantiated_investigation_returns_investigation_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.FraudInvestigation.terminal_states
          - validations[priority=31]
          - errors[ERR_INVESTIGATION_INVALID_STATE]
        distinguishing_aspect: "UNSUBSTANTIATED is terminal, so substantiate - whose only declared from: state is OPEN - returns 409 ERR_INVESTIGATION_INVALID_STATE and cannot resurrect the fraud hold that unsubstantiation released."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-S7 and one PatientRecord S7-1000."
            - "One MANUAL FraudInvestigation opened on that record (record integrity FRAUD_SUSPECTED, site flagged_record_count 1) and then unsubstantiated (investigation UNSUBSTANTIATED, record CLEAR, flagged_record_count 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-S7", name: "Invalid Transition Clinic", region_code: "US-MS", registrar_headcount: 1 }
              as: MpiAdmin
              captures: { site_s7_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s7_id}", mrn: "S7-1000", last_name: "Bouchard", first_name: "Emile", dob: "1971-07-07", sex: "M", ssn_last4: "5757", postal_code: "39201", phone: "6015550101", clinical_element_count: 4 }
              as: IdentityAnalyst
              captures: { rec_s7_id: $.data.id }
            - call: "POST /mpi/fraud-investigations"
              payload: { record_id: "${rec_s7_id}", trigger_kind: "MANUAL", note: "Two insurance cards presented under one identity." }
              as: PrivacyOfficer
              as_user_id: "officer-1"
              captures: { inv_s7_id: $.data.id, inv_s7_risk: $.data.risk_score }
            - call: "POST /mpi/fraud-investigations/${inv_s7_id}/unsubstantiate"
              payload: { finding_note: "Cards belonged to the patient and a dependent; no fraud." }
              as: PrivacyOfficer
              as_user_id: "officer-1"
              captures: { inv_s7_state: $.data.state }
          trigger:
            - call: "POST /mpi/fraud-investigations/${inv_s7_id}/substantiate"
              payload: { finding_note: "Attempting to substantiate a closed investigation." }
              as: PrivacyOfficer
              as_user_id: "officer-1"
          assert:
            - "${inv_s7_state} == \"UNSUBSTANTIATED\" and ${inv_s7_risk} == 2.00 (no pair, so only the site component of 2.00 * flagged_record_count 1 applies)"
            - "Trigger: HTTP 409 with $.data.error_id == \"ERR_INVESTIGATION_INVALID_STATE\""
            - "FraudInvestigation.${inv_s7_id}.state == UNSUBSTANTIATED and finding_note == \"Cards belonged to the patient and a dependent; no fraud.\""
            - "PatientRecord.${rec_s7_id}.integrity_state == CLEAR and RegistrationSite.${site_s7_id}.flagged_record_count == 0"

      - name: unmerge_with_a_sent_task_returns_propagation_in_flight
        claim_type: precondition_enforcement
        grounds:
          - state_machines.MergeOperation.PENDING_PROPAGATION_to_UNMERGED
          - validations[priority=33]
          - errors[ERR_PROPAGATION_IN_FLIGHT]
        distinguishing_aspect: "The PENDING_PROPAGATION -> UNMERGED transition declares 'no PropagationTask for this merge has state == SENT'; sending the merge's only task therefore blocks the reversal with 409 ERR_PROPAGATION_IN_FLIGHT while the merge stays PENDING_PROPAGATION and the subsumed record stays MERGED_SUBSUMED."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-S8 and one MatchRuleSet RS-BASE."
            - "One ACTIVE DownstreamSystem PF-SYS with propagation_mode BATCH, ack_required true and max_concurrent_dispatch 2."
            - "Two PatientRecord rows agreeing on all seven scored attributes (S8-1000 with clinical_element_count 6, S8-2000 with 4), so STRICT match_score is 100.00 AUTO_LINK with empty conflict_flags and the pair is created directly in RECOMMENDED_MERGE with recommended_by_user_id null."
            - "The merge is approved: state PENDING_PROPAGATION with one QUEUED task; that task is then sent, so it is SENT and holds capacity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
