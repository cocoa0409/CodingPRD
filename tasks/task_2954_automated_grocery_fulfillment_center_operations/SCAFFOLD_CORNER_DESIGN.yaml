          setup:
            - "Clock at the boot default. Route R1 with base_delivery_fee_cents 599, AMBIENT zone A1, and three AMBIENT SKUs with 100 units each: AMB-A at 5000 cents, AMB-B at 4401 cents, AMB-C at 4400 cents."
