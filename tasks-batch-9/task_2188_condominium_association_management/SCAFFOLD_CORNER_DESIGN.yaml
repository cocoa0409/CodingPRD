            - "GET /work-orders with contract_id=${contract1} and status=CANCELLED returns total_count == 1 and that row has encumbered_cents == 0"
            - "GET /associations/${assoc} as CommunityManager returns data.operating_cash_cents == 3900000"
            - "GET /common-elements with association_id=${assoc} shows status \"SERVICEABLE\", effective_age_years == 0 and last_serviced_at == \"2026-08-06T08:00:00Z\""
            - "the same GET /associations/${assoc}/reserve-adequacy with method=STRAIGHT_LINE now reports fully_funded_cents == 0 and posture \"ADEQUATE\" because the reset component's basis fell to 0"

  - section: validations
    instances:
      - name: missing_x_user_header_returns_unauthenticated_before_fk_and_range_checks
        claim_type: priority_ordering
        grounds:
          - validations[priority 1]
          - validations[priority 5]
          - validations[priority 6]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request that is simultaneously unauthenticated, points at a non-existent owner and carries interest_bp 0 must answer 401 ERR_UNAUTHENTICATED — priority 1 short-circuits before any body inspection, so no 404 or 422 may leak."
        test_recipe:
          setup:
            - "One association and nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
          trigger:
            - call: "POST /associations/${assoc}/units"
              as: Unauthenticated
              payload: { current_owner_id: "11111111-1111-4111-8111-111111111111", unit_label: "101", interest_bp: 0, heated_sqft: 0 }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 401"
            - "response_type == \"error\" and data.error_id == \"ERR_UNAUTHENTICATED\""
            - "the request carries no X-User-ID header at all"
            - "GET /units with association_id=${assoc} as CommunityManager still returns total_count == 0"

      - name: unseated_director_returns_actor_not_recognized_before_the_state_check
        claim_type: priority_conflict
        grounds:
          - validations[priority 3]
          - validations[priority 12]
          - errors[ERR_ACTOR_NOT_RECOGNIZED]
          - endpoints[POST /budgets/{budget_id}/return-to-draft]
        distinguishing_aspect: "An owner whose board_role is DIRECTOR but is_seated is false fails priority 3 with 403 ERR_ACTOR_NOT_RECOGNIZED even though the very same call would also be an illegal DRAFT -> DRAFT hop (409 ERR_INVALID_BUDGET_STATE) — actor recognition precedes state legality."
        test_recipe:
          setup:
            - "A DRAFT fiscal-2026 budget and an owner recorded as DIRECTOR with is_seated false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Hal Mercer", email: "hal@example.com", board_role: "DIRECTOR", is_seated: false }
              captures: { unseated: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 10000, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
            - call: "GET /associations/${assoc}"
              as: CommunityManager
              captures: { assoc_v: "$.data.version" }
            - call: "POST /associations/${assoc}/budgets"
              as: CommunityManager
              payload: { fiscal_year: 2026, operating_total_cents: 12000000, reserve_contribution_cents: 1200000, expected_association_version: "${assoc_v}" }
              captures: { budget1: "$.data.id" }
          trigger:
            - call: "POST /budgets/${budget1}/return-to-draft"
              as: BoardDirector
              as_user_id: "${unseated}"
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ACTOR_NOT_RECOGNIZED\" (never \"ERR_INVALID_BUDGET_STATE\")"
            - "GET /budgets with association_id=${assoc} still shows status \"DRAFT\" and revision_round == 0"

      - name: unknown_association_in_the_path_beats_the_unknown_meeting_reference
        claim_type: priority_conflict
        grounds:
          - validations[priority 4]
          - validations[priority 5]
          - errors[ERR_ASSOCIATION_NOT_FOUND]
        distinguishing_aspect: "Path existence is resolved left-to-right BEFORE body foreign keys, so an unknown association id in the URL plus an unknown ratification_meeting_id in the body must answer ERR_ASSOCIATION_NOT_FOUND, not ERR_REFERENCED_ENTITY_NOT_FOUND — both are 404, so only the error_id distinguishes the two rules."
        test_recipe:
          setup:
            - "A real association (used only to source a live version token) and two unrelated random UUIDs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "GET /associations/${assoc}"
              as: CommunityManager
              captures: { assoc_v: "$.data.version" }
          trigger:
            - call: "POST /associations/99999999-9999-4999-8999-999999999999/budgets"
              as: CommunityManager
              payload: { fiscal_year: 2026, operating_total_cents: 12000000, reserve_contribution_cents: 1200000, ratification_meeting_id: "88888888-8888-4888-8888-888888888888", expected_association_version: "${assoc_v}" }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_ASSOCIATION_NOT_FOUND\" (never \"ERR_REFERENCED_ENTITY_NOT_FOUND\")"
            - "GET /budgets with association_id=${assoc} returns total_count == 0"

      - name: unknown_owner_reference_beats_the_interest_bp_range_error
        claim_type: priority_conflict
        grounds:
          - validations[priority 5]
          - validations[priority 6]
          - errors[ERR_REFERENCED_ENTITY_NOT_FOUND]
        distinguishing_aspect: "Body foreign keys (priority 5, 404) resolve before field ranges (priority 6, 422): current_owner_id pointing nowhere while interest_bp is 0 and heated_sqft is 0 must produce a single 404 ERR_REFERENCED_ENTITY_NOT_FOUND, never a 422 field report."
        test_recipe:
          setup:
            - "An association with one real owner, no units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
          trigger:
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "77777777-7777-4777-8777-777777777777", unit_label: "101", interest_bp: 0, heated_sqft: 0 }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_REFERENCED_ENTITY_NOT_FOUND\" (never \"ERR_VALIDATION\")"
            - "GET /units with association_id=${assoc} returns total_count == 0"
            - "GET /associations/${assoc} still returns data.total_interest_bp == 0 and data.unit_count == 0"

      - name: installment_count_out_of_range_beats_the_stale_association_version
        claim_type: priority_conflict
        grounds:
          - validations[priority 6]
          - validations[priority 9]
          - errors[ERR_STALE_ASSOCIATION_VERSION]
          - complexity_profile.complexity_layers.optimistic_concurrency
        distinguishing_aspect: "Field ranges (priority 6) outrank optimistic concurrency (priority 9): installment_count 25 with a genuinely stale expected_association_version must answer 422 ERR_VALIDATION, so an implementation that checks the version guard first would wrongly return 412."
        test_recipe:
          setup:
            - "An association whose version was captured and then bumped by a PATCH, plus a seated treasurer and a single 10000 bp unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Tina Cole", email: "tina@example.com", board_role: "TREASURER", is_seated: true }
              captures: { treas: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 10000, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
            - call: "GET /associations/${assoc}"
              as: CommunityManager
              captures: { stale_v: "$.data.version" }
            - call: "PATCH /associations/${assoc}"
              as: CommunityManager
              payload: { reserve_balance_cents: 4000000 }
          trigger:
            - call: "POST /associations/${assoc}/special-assessments"
              as: BoardTreasurer
              as_user_id: "${treas}"
              payload: { purpose: "Roof replacement", total_amount_cents: 4000000, installment_count: 25, expected_association_version: "${stale_v}" }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\" (never \"ERR_STALE_ASSOCIATION_VERSION\")"
            - "GET /special-assessments with association_id=${assoc} returns total_count == 0"
            - "resending the same body with installment_count 24 and the same stale ${stale_v} now returns HTTP 412 with data.error_id == \"ERR_STALE_ASSOCIATION_VERSION\""

      - name: interest_sum_invalid_beats_reserve_contribution_too_low_on_propose
        claim_type: priority_conflict
        grounds:
          - validations[priority 35]
          - validations[priority 43]
          - state_machines.Budget.transitions.DRAFT_to_PROPOSED.preconditions
        distinguishing_aspect: "Both rules answer 422 on the same propose call: a 9000 bp roster and a reserve contribution of 100000 against operating 12000000 (minimum 1200000) are simultaneously wrong, and priority 35 must win with ERR_INTEREST_SUM_INVALID rather than ERR_RESERVE_CONTRIBUTION_TOO_LOW."
        test_recipe:
          setup:
            - "A single 9000 bp unit (association total_interest_bp 9000) and a DRAFT budget with operating 12000000 / reserve 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 9000, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
            - call: "GET /associations/${assoc}"
              as: CommunityManager
              captures: { assoc_v: "$.data.version" }
            - call: "POST /associations/${assoc}/budgets"
              as: CommunityManager
              payload: { fiscal_year: 2026, operating_total_cents: 12000000, reserve_contribution_cents: 100000, expected_association_version: "${assoc_v}" }
              captures: { budget1: "$.data.id" }
          trigger:
            - call: "POST /budgets/${budget1}/propose"
              as: CommunityManager
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_INTEREST_SUM_INVALID\" (never \"ERR_RESERVE_CONTRIBUTION_TOO_LOW\")"
            - "GET /budgets with association_id=${assoc} still shows status \"DRAFT\" with assessment_total_cents == 0"
            - "after adding a second 1000 bp unit the same propose returns HTTP 422 with data.error_id == \"ERR_RESERVE_CONTRIBUTION_TOO_LOW\""

      - name: foreign_owner_reading_a_unit_statement_returns_not_unit_owner
        claim_type: violation_to_error
        grounds:
          - validations[priority 7]
          - errors[ERR_NOT_UNIT_OWNER]
          - endpoints[GET /units/{unit_id}/statement]
          - rbac.UnitOwner
        distinguishing_aspect: "UnitOwner is an allowed role on the statement endpoint, so the block is data-scoped rather than role-scoped: owner2 reading unit 101's statement gets 403 ERR_NOT_UNIT_OWNER while the identical call from owner1 succeeds — ERR_ROLE_NOT_PERMITTED would be the wrong answer."
        test_recipe:
          setup:
            - "Two owners each holding one unit; unit 101 belongs to owner1 and carries a 20000-cent ASSESSMENT charge."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Nina Boyd", email: "nina@example.com" }
              captures: { owner2: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 5000, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner2}", unit_label: "102", interest_bp: 5000, heated_sqft: 1000 }
              captures: { unit2: "$.data.id" }
            - call: "POST /units/${unit1}/charges"
              as: CommunityManager
              payload: { entry_type: "ASSESSMENT", amount_cents: 20000, due_on: "2026-08-15T00:00:00Z", effective_period: "2026-08", memo: "August assessment" }
          trigger:
            - call: "GET /units/${unit1}/statement"
              as: UnitOwner
              as_user_id: "${owner2}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_NOT_UNIT_OWNER\" (never \"ERR_ROLE_NOT_PERMITTED\")"
            - "the same GET as UnitOwner with X-User-ID ${owner1} returns HTTP 200 with data.balance_due_cents == 20000"
            - "the same GET as CommunityManager returns HTTP 200"

      - name: budget_pointing_at_a_foreign_associations_meeting_returns_scope_mismatch
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 8]
          - errors[ERR_ASSOCIATION_SCOPE_MISMATCH]
          - complexity_profile.complexity_layers.multi_tenancy
        distinguishing_aspect: "The referenced meeting EXISTS, so priority 5 is satisfied and the failure must be the 409 tenancy check: a fiscal-2026 budget for association A naming association B's ratification meeting is ERR_ASSOCIATION_SCOPE_MISMATCH, not a 404."
        test_recipe:
          setup:
            - "Two independent associations, each with one 10000 bp unit; association B owns a BUDGET_RATIFICATION meeting on 2026-09-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assocA: "$.data.id" }
            - call: "POST /associations"
              as: CommunityManager
