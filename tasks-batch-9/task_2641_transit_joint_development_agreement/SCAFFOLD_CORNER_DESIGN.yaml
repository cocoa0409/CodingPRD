      - name: corner_extension_ceiling_is_cumulative_not_windowed
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=54]
          - validations[priority=44]
          - errors[ERR_MAX_EXTENSIONS_REACHED]
          - errors[ERR_INVALID_INTERVAL]
          - state_machines.ExclusiveNegotiationPeriod[EXTENDED->EXTENDED]
        distinguishing_aspect: |
          MAX_NEGOTIATION_EXTENSIONS is a lifetime counter on the period, not a per-interval rate: two
          extensions succeed (the second is a self-loop that leaves the state EXTENDED), a non-advancing
          end date is refused 422 ERR_INVALID_INTERVAL without consuming an extension, and the third genuine
          extension is refused 409 ERR_MAX_EXTENSIONS_REACHED with end_date left at the second extension.
        test_recipe:
          setup:
            - "UNDER_AGREEMENT site with one ACTIVE negotiation period ending 2026-09-15"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-058", name: "Dogwood Landing Parcel", address_line: "58 Dogwood Ld", parcel_area_sqft: 61000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id }
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/sites/${site_a}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/developers"
              payload: { legal_name: "Alder Transit Partners LLC", contact_email: "dev-a@example.com", prequalified: true, debarment_status: "CLEAR" }
              as: RealEstateOfficer
              captures: { dev_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/solicitations"
              payload: { solicitation_type: "RFP", response_deadline: "2026-09-15T00:00:00Z", benchmark_value_cents: 48500000, affordable_housing_min_pct: 15, min_proposals_required: 1, joint_use_required: false }
              as: RealEstateOfficer
              captures: { sol_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/issue"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/solicitations/${sol_a}/proposals"
              payload: { developer_id: "${dev_a}", proposed_structure: "GROUND_LEASE", proposed_annual_rent_cents: 2400000, affordable_units: 50, total_units: 200, transit_ridership_uplift: 600, design_compliance_score: 88, joint_use_committed: false }
              as: Developer
              as_user_id: "${dev_a}"
              captures: { prop_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/negotiation-periods"
              payload: { proposal_id: "${prop_a}", start_date: "2026-08-15", end_date: "2026-09-15" }
              as: RealEstateOfficer
              captures: { enp_a: $.data.id, enp_status_0: $.data.status, count_0: $.data.extension_count }
          trigger:
            - call: "POST /jda/negotiation-periods/${enp_a}/extend"
              payload: { new_end_date: "2026-10-15" }
              as: RealEstateOfficer
              captures: { enp_status_1: $.data.status, count_1: $.data.extension_count, end_1: $.data.end_date }
            - call: "POST /jda/negotiation-periods/${enp_a}/extend"
              payload: { new_end_date: "2026-10-01" }
              as: RealEstateOfficer
              captures: { err_interval: $.data.error_id }
            - call: "POST /jda/negotiation-periods/${enp_a}/extend"
              payload: { new_end_date: "2026-11-15" }
              as: RealEstateOfficer
              captures: { enp_status_2: $.data.status, count_2: $.data.extension_count, end_2: $.data.end_date }
            - call: "POST /jda/negotiation-periods/${enp_a}/extend"
              payload: { new_end_date: "2026-12-15" }
              as: RealEstateOfficer
              captures: { err_max: $.data.error_id }
            - call: "GET /jda/negotiation-periods/${enp_a}"
              payload: { }
              as: RealEstateOfficer
              captures: { enp_status_3: $.data.status, count_3: $.data.extension_count, end_3: $.data.end_date }
          assert:
            - "${enp_status_0} == ACTIVE and ${count_0} == 0"
            - "${enp_status_1} == EXTENDED and ${count_1} == 1 and ${end_1} == 2026-10-15"
            - "Second trigger call returns HTTP 422 and ${err_interval} == ERR_INVALID_INTERVAL"
            - "${enp_status_2} == EXTENDED and ${count_2} == 2 and ${end_2} == 2026-11-15"
            - "Fourth trigger call returns HTTP 409 and ${err_max} == ERR_MAX_EXTENSIONS_REACHED"
            - "${enp_status_3} == EXTENDED and ${count_3} == 2 and ${end_3} == 2026-11-15"
            - "AgencySite.${site_a}.status == UNDER_AGREEMENT and Proposal.${prop_a}.status == SELECTED"

      - name: corner_award_cascade_chain_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.Solicitation[CLOSED->AWARDED]
        excluded_because:
          difficulty_instance: award_cascade_site_to_sibling_solicitation_to_its_proposals
          rationale: |
            The §1.8 multi_hop_cascade instance already walks the full five-hop award chain (proposal
            SELECTED, period ACTIVE, site UNDER_AGREEMENT, sibling solicitation CANCELLED, its proposals
            REJECTED) and asserts every hop plus the untouched non-participants.

      - name: corner_federal_rejection_cascade_partial_failure_ordering
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.JointDevelopmentAgreement[BOARD_APPROVED->REVISION_REQUESTED]
        excluded_because:
          difficulty_instance: federal_rejection_cascade_suspends_staging_and_releases_encumbrance
          rationale: |
            Ordering sensitivity of the rejection cascade (determination first, then the negotiation
            dimension, then the valuation and the staging windows, then the capacity release) is asserted
            hop by hop in that §1.8 instance, including the encumbrance ledger returning to its prior value.

      - name: corner_dual_variant_readiness_and_floor_deltas
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.site_readiness_score
          - calculations.permissible_transfer_floor
        excluded_because:
          difficulty_instance: readiness_score_preliminary_versus_certified_variant_divergence
          rationale: |
            Both dual-variant calculations are covered by §1.8: this instance contrasts the preliminary and
            certified readiness variants on identical inputs, and
            valuation_floor_fmv_strict_versus_below_market_divergence contrasts the FAIR_MARKET_VALUE and
            TRANSIT_SUPPORTIVE_BELOW_MARKET floor variants with the exact delta.

  - section: consistency_model
    instances:
      - name: corner_award_cascade_visible_in_the_same_response_and_immediate_reads
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Solicitation[CLOSED->AWARDED]
          - endpoints[POST /jda/solicitations/{id}/award]
        distinguishing_aspect: |
          consistency_model is immediate, so the award response already carries status AWARDED and the rank
          assignment, and the very next reads — with no retry, sleep or refresh step — show the proposal
          SELECTED, a new ACTIVE period, the site UNDER_AGREEMENT and the derived
          federal_interest_basis_cents from the valuation write that preceded them.
        test_recipe:
          setup:
            - "CLOSED solicitation with one ranked proposal on a SOLICITATION_READY site"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
