      - name: void_participation_restores_incentive_points_balance
        conserved_quantity: "Member.incentive_points_balance == SUM(ParticipationRecord.points_awarded WHERE member_id == member AND status == COUNTED)"
        forward_operation: "POST /participation-records (check-in) — awards points and adds them to the member's balance"
        compensating_operation: "POST /participation-records/{id}/void — subtracts exactly the points that record awarded"
        grounds:
          - state_machines.ParticipationRecord[COUNTED -> VOIDED].side_effects
          - calculations.incentive_points_award
          - entities.Member.fields.incentive_points_balance
          - entities.ProgramOffering.fields.counted_participation_total
          - endpoints[POST /participation-records/{id}/void]
        distinguishing_aspect: |
          Conserved quantity = an INCENTIVE POINT LEDGER on Member. The void must
          reverse the points that the voided record itself awarded — not
          BASE_POINTS_PER_CHECKIN, and not a recomputation of the award — so an
          implementation that recomputes instead of storing-and-reversing drifts.
          The same void also decrements the session's actual_attendance and the
          offering's counted_participation_total, and the scaffold explicitly states
          that voiding does NOT hand the weekly cap headroom back to already-written
          rows.
