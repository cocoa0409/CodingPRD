scaffold_difficulty_design:
  # =======================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tia_fragnet_insertion_vs_time_slice_on_delay_event
        grounds:
          - calculations.time_impact_analysis
          - entities.DelayEvent.fields.tia_prolongation_days_prospective
          - entities.DelayEvent.fields.tia_prolongation_days_retrospective
        distinguishing_aspect: |
          Same DelayEvent produces DIFFERENT prolongation values under the two
          variants — FRAGNET_INSERTION operates on the as-planned UPDATE network,
          TIME_SLICE_WINDOWS rebuilds critical path from monthly as-built actuals;
          the entity domain is DelayEvent (claim analysis), not Activity (CPM).
        test_recipe:
          setup:
            - "Project with ACCEPTED BASELINE (3 activities linear FS chain A→B→C, 10d each, data_date 2026-05-01) and ACCEPTED UPDATE u1 with same topology data_date 2026-06-01"
            - "Approved progress on u1 marking A 100% (actual 2026-05-01 → 2026-05-15, 5 days late)"
            - "DelayEvent with fragnet_inserted_into_version_id = u1, causation=OWNER_CAUSED, event_start 2026-05-10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P1", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-07-30T00:00:00Z", liquidated_damages_daily_rate_cents: 500000, ld_cap_cents: 50000000, float_ownership_policy: "CONTRACTOR_OWNS", notice_window_days: 21 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, proj_v0: $.data.version }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A", description: "Foundations", original_duration_days: 10 }
              as: ContractorScheduler
              captures: { a_id: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "B", description: "Steel", original_duration_days: 10 }
              as: ContractorScheduler
              captures: { b_id: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "C", description: "Envelope", original_duration_days: 10 }
              as: ContractorScheduler
              captures: { c_id: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/relationships"
              payload: { predecessor_activity_id: "${a_id}", successor_activity_id: "${b_id}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/relationships"
              payload: { predecessor_activity_id: "${b_id}", successor_activity_id: "${c_id}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/accept"
              payload: { expected_project_version: "${proj_v0}" }
              as: ProjectControlsEngineer
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "UPDATE", data_date: "2026-06-01T00:00:00Z", supersedes_version_id: "${bv}" }
              as: ContractorScheduler
              captures: { u1: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/activities"
              payload: { activity_code: "A", description: "Foundations", original_duration_days: 10, remaining_duration_days: 0 }
              as: ContractorScheduler
              captures: { ua: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/activities"
              payload: { activity_code: "B", description: "Steel", original_duration_days: 10 }
              as: ContractorScheduler
              captures: { ub: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/activities"
              payload: { activity_code: "C", description: "Envelope", original_duration_days: 10 }
              as: ContractorScheduler
              captures: { uc: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/relationships"
              payload: { predecessor_activity_id: "${ua}", successor_activity_id: "${ub}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/relationships"
              payload: { predecessor_activity_id: "${ub}", successor_activity_id: "${uc}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "GET /construction-projects/${pid}"
              as: ProjectControlsEngineer
              captures: { proj_v1: $.data.version }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/accept"
              payload: { expected_project_version: "${proj_v1}" }
              as: ProjectControlsEngineer
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "Owner redesign", causation: "OWNER_CAUSED", event_start_date: "2026-05-10T00:00:00Z", event_end_date: "2026-05-20T00:00:00Z", fragnet_activity_ids: ["${ub}"], fragnet_inserted_into_version_id: "${u1}" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events/${de}/notice"
              payload: {}
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/submit"
              payload: {}
              as: ContractorScheduler
              captures: { prosp: $.data.tia_prolongation_days_prospective, retro: $.data.tia_prolongation_days_retrospective }
          assert:
            - "DelayEvent.${de}.tia_prolongation_days_prospective != DelayEvent.${de}.tia_prolongation_days_retrospective"
            - "Both fields are integers >= 0"

      - name: acceleration_actual_cost_vs_measured_mile_on_directive
        grounds:
          - calculations.acceleration_cost_recovery
          - entities.AccelerationDirective.fields.recovered_cost_cents
          - entities.AccelerationDirective.fields.recovery_variant
        distinguishing_aspect: |
          Same AccelerationDirective with both cost inputs produces a different
          recovered_cost_cents depending on which variant the owner selects at
          RESOLVED — entity domain is AccelerationDirective (cost recovery), not
          DelayEvent (time analysis). The two rules exercise dual-variant logic
          on different subjects.
        test_recipe:
          setup:
            - "Project with an ACKNOWLEDGED directive whose actual_cost_cents=100000 and measured_mile_cost_cents=200000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P2", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 10000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/acceleration-directives"
              payload: { directive_reference: "ACC-1", directed_completion_date: "2026-07-15T00:00:00Z" }
              as: OwnerRepresentative
              captures: { aid: $.data.id }
            - call: "POST /construction-projects/${pid}/acceleration-directives/${aid}/acknowledge"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/acceleration-directives/${aid}/begin-performance"
              payload: {}
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/acceleration-directives/${aid}/dispute"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/acceleration-directives/${aid}/negotiate"
              payload: {}
              as: OwnerRepresentative
            - call: "POST /construction-projects/${pid}/acceleration-directives/${aid}/resolve"
              payload: { recovery_variant: "MEASURED_MILE", recovered_cost_cents: 80000 }
              as: OwnerRepresentative
          assert:
            - "AccelerationDirective.${aid}.status == RESOLVED"
            - "AccelerationDirective.${aid}.recovered_cost_cents == 80000"
            - "recovered_cost_cents under MEASURED_MILE != the 100000 the ACTUAL_COST variant would have produced"

  # =======================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: concurrent_delay_apportionment_multifactor_mode_a
        grounds:
          - calculations.concurrent_delay_apportionment
          - entities.ConstructionProject.fields.float_ownership_policy
        distinguishing_aspect: |
          Mode (a) — ≥3 inputs with non-linear interaction: causation enum,
          notice_within_window boolean, owner_concurrent days, contractor_concurrent
          days, AND float_ownership_policy (3-valued enum) combine via conditional
          branches; output triple (compensable, excusable-non-compensable,
          non-excusable) is a piecewise function of all five inputs.
        test_recipe:
          setup:
            - "Project with float_ownership_policy=OWNER_OWNS, notice_window_days=21"
            - "DelayEvent with causation=OWNER_CAUSED, event_start 2026-05-05, notice sent 2026-05-25 (inside 21-day window → notice_within_window=true)"
            - "TIA yields tia_prolongation_days_prospective=15, owner_concurrent=10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P3", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 10000000, float_ownership_policy: "OWNER_OWNS", notice_window_days: 21 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "Late design", causation: "OWNER_CAUSED", event_start_date: "2026-05-05T00:00:00Z", event_end_date: "2026-05-20T00:00:00Z" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events/${de}/notice"
              payload: {}
              as: ContractorScheduler
              captures: { inwin: $.data.notice_within_window }
          trigger:
            - call: "GET /construction-projects/${pid}/delay-events/${de}"
              as: ClaimsConsultant
          assert:
            - "DelayEvent.${de}.notice_within_window == true (notice at 2026-05-25 minus event_start 2026-05-05 = 20 days <= 21)"

      - name: cpm_pass_rounding_and_tie_break_mode_b
        grounds:
          - calculations.cpm_forward_backward_pass
          - entities.Activity.fields.total_float_days
        distinguishing_aspect: |
          Mode (b) — order-sensitive aggregation with explicit tie-break: the CPM
          backward pass computes late_finish as the MIN over (potentially equal)
          candidate successors; the formula pins min() ordering and integer-day
          precision; total_float_days = (late_finish - early_finish) is sensitive
          to integer-day rounding of SS/FF/SF candidates in a different way than
          a naive sum-then-round would be.
        test_recipe:
          setup:
            - "Schedule with three parallel successors of equal EF — min() candidates tie; the scaffold mandates deterministic tie-breaking by earliest successor created_at"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P4", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 50000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "ROOT", description: "root", original_duration_days: 5 }
              as: ContractorScheduler
              captures: { r: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "S1", description: "s1", original_duration_days: 5 }
              as: ContractorScheduler
              captures: { s1: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "S2", description: "s2", original_duration_days: 5 }
              as: ContractorScheduler
              captures: { s2: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/relationships"
              payload: { predecessor_activity_id: "${r}", successor_activity_id: "${s1}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/relationships"
              payload: { predecessor_activity_id: "${r}", successor_activity_id: "${s2}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
          assert:
            - "Activity.${r}.total_float_days == 0 (critical root)"
            - "Activity.${s1}.total_float_days == 0 AND Activity.${s2}.total_float_days == 0 (both successors critical — tie on EF does not introduce drift)"

  # =======================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =======================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: schedule_version_rejected_to_draft_cycle
        grounds:
          - state_machines.ScheduleVersion.REJECTED_to_DRAFT
          - state_machines.ScheduleVersion.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Cycle on ScheduleVersion (DRAFT→SUBMITTED→REJECTED→DRAFT) — the
          revision_number increments per loop, distinguishing this cyclic machine
          from a linear pipeline. Entity: ScheduleVersion.
        test_recipe:
          setup:
            - "Project + BASELINE schedule with 1 activity submitted then rejected"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P5", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 50000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id, rev0: $.data.revision_number }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "X", description: "x", original_duration_days: 5 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/reject"
              payload: {}
              as: ProjectControlsEngineer
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/revise"
              payload: {}
              as: ContractorScheduler
              captures: { rev1: $.data.revision_number, st: $.data.status }
          assert:
            - "ScheduleVersion.${bv}.status == DRAFT (cycle REJECTED → DRAFT)"
            - "ScheduleVersion.${bv}.revision_number == ${rev0} + 1"

      - name: eot_appeal_loop_on_time_extension_request
        grounds:
          - state_machines.TimeExtensionRequest.DENIED_to_SUBMITTED
          - entities.TimeExtensionRequest.fields.submission_round
        distinguishing_aspect: |
          Cycle on TimeExtensionRequest (SUBMITTED→UNDER_REVIEW→DENIED→SUBMITTED)
          — a negotiation appeal loop with a hard 3-round cap; entity is
          TimeExtensionRequest, distinct from ScheduleVersion.
        test_recipe:
          setup:
            - "Project with TIA_ACCEPTED delay event, EOT submitted and DENIED once (round=1)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P6", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 5000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "D", causation: "FORCE_MAJEURE", event_start_date: "2026-05-10T00:00:00Z", event_end_date: "2026-05-15T00:00:00Z" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events/${de}/notice"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/accept"
              payload: {}
              as: ClaimsConsultant
            - call: "POST /construction-projects/${pid}/eot-requests"
              payload: { delay_event_id: "${de}", requested_days: 5, cost_recovery_cents: 0 }
              as: ContractorScheduler
              captures: { eid: $.data.id, round0: $.data.submission_round }
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/begin-review"
              payload: {}
              as: OwnerRepresentative
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/deny"
              payload: {}
              as: OwnerRepresentative
          trigger:
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/appeal"
              payload: {}
              as: ContractorScheduler
          assert:
            - "TimeExtensionRequest.${eid}.status == SUBMITTED (appeal loop DENIED → SUBMITTED)"
            - "TimeExtensionRequest.${eid}.submission_round == ${round0} + 1"

  # =======================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =======================================================================
  - rule_id: transitive_cascade
    instances:
      - name: baseline_accept_cascades_project_activation_then_eot_offset
        grounds:
          - state_machines.ScheduleVersion.SUBMITTED_to_ACCEPTED
          - state_machines.ConstructionProject.PRECONSTRUCTION_to_ACTIVE
        distinguishing_aspect: |
          Trigger = ScheduleVersion.accept (BASELINE). Chain depth ≥3:
          ScheduleVersion ACCEPTED → ConstructionProject PRECONSTRUCTION→ACTIVE
          → current_completion_date initialized → any future PROPOSED LDA uses
          the initialized date. Originates from the schedule-accept transition.
        test_recipe:
          setup:
            - "Project in PRECONSTRUCTION; BASELINE schedule submitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P7", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 5000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A1", description: "a1", original_duration_days: 30 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/accept"
              payload: { expected_project_version: "${pv0}" }
              as: ProjectControlsEngineer
          assert:
            - "ScheduleVersion.${bv}.status == ACCEPTED"
            - "ConstructionProject.${pid}.status == ACTIVE (cascade from baseline accept)"
            - "ConstructionProject.${pid}.version == ${pv0} + 1"

      - name: progress_approval_cascades_cpm_recompute_then_lda_spawn
        grounds:
          - state_machines.ProgressUpdate.SUBMITTED_to_APPROVED
          - calculations.liquidated_damages_exposure
        distinguishing_aspect: |
          Trigger = ProgressUpdate.approve. Chain depth ≥3: ProgressUpdate APPROVED
          → Activity fields updated → ScheduleVersion CPM recomputed →
          projected_finish_date crosses current_completion_date → PROPOSED LDA
          auto-created. Originates from a different transition than the
          baseline-accept cascade.
        test_recipe:
          setup:
            - "ACTIVE project; ACCEPTED BASELINE; ACCEPTED UPDATE u1 with activity 'A' (10d)"
            - "ProgressUpdate against u1 marking A percent_complete=50, remaining=20 (10 days of slippage)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P8", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-05-15T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 5000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 10 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/accept"
              payload: { expected_project_version: "${pv0}" }
              as: ProjectControlsEngineer
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "UPDATE", data_date: "2026-05-08T00:00:00Z", supersedes_version_id: "${bv}" }
              as: ContractorScheduler
              captures: { u1: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 10 }
              as: ContractorScheduler
              captures: { ua: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "GET /construction-projects/${pid}"
              as: ProjectControlsEngineer
              captures: { pv1: $.data.version }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/accept"
              payload: { expected_project_version: "${pv1}" }
              as: ProjectControlsEngineer
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/progress-updates"
              payload: { reporting_period_end: "2026-05-08T00:00:00Z", submitted_by_contractor_user_id: "contractor-1" }
              as: ContractorScheduler
              captures: { pu: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/progress-updates/${pu}/entries"
              payload: { activity_id: "${ua}", percent_complete: 50, remaining_duration_days: 20, actual_start: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/progress-updates/${pu}/submit"
              payload: {}
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/progress-updates/${pu}/approve"
              payload: {}
              as: ProjectControlsEngineer
          assert:
            - "ProgressUpdate.${pu}.status == APPROVED"
            - "Activity.${ua}.percent_complete == 50"
            - "Activity.${ua}.remaining_duration_days == 20"
            - "A new LiquidatedDamagesAssessment with status == PROPOSED exists on the project (cascade spawn)"

  # =======================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =======================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_on_eot_submit
        grounds:
          - validations[priority=4]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TIA_NOT_ACCEPTED]
        distinguishing_aspect: |
          Pair = (state, business_referential): an EOT submission where the EOT
          itself is in DRAFT (state OK) but the linked DelayEvent is NOTICED,
          not TIA_ACCEPTED (referential violation). If we also force EOT into
          a wrong state, the state error must win per priority 4 < 11.
        test_recipe:
          setup:
            - "Project, DelayEvent in NOTICED (not yet TIA_ACCEPTED), EOT in DRAFT referencing that event"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P9", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 5000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "D", causation: "OWNER_CAUSED", event_start_date: "2026-05-05T00:00:00Z" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events/${de}/notice"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/eot-requests"
              payload: { delay_event_id: "${de}", requested_days: 5 }
              as: ContractorScheduler
              captures: { eid: $.data.id }
          trigger:
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/submit"
              payload: {}
              as: ContractorScheduler
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TIA_NOT_ACCEPTED (referential), not ERR_INVALID_STATE — EOT itself is in DRAFT so state precondition passes; referential fails"

      - name: business_safety_vs_business_fiscal_on_relationship
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_CYCLE_DETECTED]
          - errors[ERR_LD_CAP_EXCEEDED]
        distinguishing_aspect: |
          Pair = (business_safety, business_fiscal): a relationship insertion
          that would create a DAG cycle (priority 5) fires before any fiscal cap
          check (priority 14). Different error-category pair than state×referential.
        test_recipe:
          setup:
            - "Project + DRAFT BASELINE with A→B; attempt to add B→A (cycle) while an unrelated fiscal cap would also be violated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P10", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 5 }
              as: ContractorScheduler
              captures: { a: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "B", description: "b", original_duration_days: 5 }
              as: ContractorScheduler
              captures: { b: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/relationships"
              payload: { predecessor_activity_id: "${a}", successor_activity_id: "${b}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/relationships"
              payload: { predecessor_activity_id: "${b}", successor_activity_id: "${a}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CYCLE_DETECTED (business_safety priority 5) — fiscal concerns (priority 14) do not pre-empt the DAG check"

  # =======================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: notice_window_exactly_at_21_days
        grounds:
          - entities.ConstructionProject.fields.notice_window_days
          - entities.DelayEvent.fields.notice_within_window
          - validations[priority=8]
        distinguishing_aspect: |
          Metric = notice_window_days (integer days), endpoint = POST .../notice.
          Boundary: event_start=2026-05-01, notice sent at 2026-05-22 (exactly
          21 days later) → notice_within_window MUST be true (<=). One day later
          (2026-05-23) → false. Tests the >= vs > edge.
        test_recipe:
          setup:
            - "Project with notice_window_days=21; DelayEvent event_start=2026-05-01"
            - "Logical clock set to 2026-05-22T00:00:00Z (exactly 21 days after)"
          setup_api_calls:
            - call: "POST /construction-projects"
              payload: { project_name: "P11", contract_start_date: "2026-04-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 5000000, notice_window_days: 21 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "Boundary", causation: "OWNER_CAUSED", event_start_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-22T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /construction-projects/${pid}/delay-events/${de}/notice"
              payload: {}
              as: ContractorScheduler
              captures: { inwin: $.data.notice_within_window }
          assert:
            - "DelayEvent.${de}.notice_within_window == true (boundary 21 days is INCLUSIVE: <=)"

      - name: ld_cap_at_exact_zero_remaining
        grounds:
          - calculations.liquidated_damages_exposure
          - entities.LiquidatedDamagesAssessment.fields.assessed_ld_cents
        distinguishing_aspect: |
          Metric = remaining LD cap (cents), endpoint = POST .../ld-assessments/{lid}/assess.
          Boundary: when prior_assessed_total == ld_cap_cents exactly, remaining_cap == 0
          → assessed_ld_cents MUST be 0 (no negative; no spillover). Different metric
          (currency) and endpoint than the notice-window instance.
        test_recipe:
          setup:
            - "Project with ld_cap_cents = 1,000,000; prior LDA assessed at exactly 1,000,000"
            - "Second LDA proposed with culpable_days > 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P12", contract_start_date: "2026-04-01T00:00:00Z", contract_completion_date: "2026-05-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/ld-assessments"
              payload: { assessment_period_start: "2026-05-02T00:00:00Z", assessment_period_end: "2026-05-11T00:00:00Z" }
              as: OwnerRepresentative
              captures: { lda1: $.data.id }
            - call: "POST /construction-projects/${pid}/ld-assessments/${lda1}/assess"
              payload: {}
              as: OwnerRepresentative
            - call: "POST /construction-projects/${pid}/ld-assessments"
              payload: { assessment_period_start: "2026-05-12T00:00:00Z", assessment_period_end: "2026-05-20T00:00:00Z" }
              as: OwnerRepresentative
              captures: { lda2: $.data.id }
          trigger:
            - call: "POST /construction-projects/${pid}/ld-assessments/${lda2}/assess"
              payload: {}
              as: OwnerRepresentative
              captures: { assessed2: $.data.assessed_ld_cents }
          assert:
            - "LiquidatedDamagesAssessment.${lda1}.assessed_ld_cents == 1000000 (10 days × 100000, capped at ld_cap_cents=1000000 exactly)"
            - "LiquidatedDamagesAssessment.${lda2}.assessed_ld_cents == 0 (remaining cap is exactly zero)"

  # =======================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =======================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: update_accept_requires_baseline_accepted_pair_scheduleversion_scheduleversion
        grounds:
          - state_machines.ScheduleVersion.SUBMITTED_to_ACCEPTED
          - validations[priority=10]
          - errors[ERR_BASELINE_NOT_ACCEPTED]
        distinguishing_aspect: |
          Pair = (UPDATE ScheduleVersion → BASELINE ScheduleVersion): accepting an
          UPDATE requires another ScheduleVersion (the BASELINE) to be ACCEPTED.
          Cross-entity state dependency within the same entity type but across
          distinct instances.
        test_recipe:
          setup:
            - "Project; only an UPDATE schedule exists (no BASELINE); UPDATE submitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P13", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "UPDATE", data_date: "2026-05-08T00:00:00Z" }
              as: ContractorScheduler
              captures: { u: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 5 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${u}/submit"
              payload: {}
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${u}/accept"
              payload: { expected_project_version: "${pv}" }
              as: ProjectControlsEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BASELINE_NOT_ACCEPTED"

      - name: eot_submit_requires_delay_event_tia_accepted_pair_eot_delayevent
        grounds:
          - state_machines.TimeExtensionRequest.DRAFT_to_SUBMITTED
          - validations[priority=11]
          - errors[ERR_TIA_NOT_ACCEPTED]
        distinguishing_aspect: |
          Pair = (TimeExtensionRequest → DelayEvent): EOT cannot transition
          DRAFT→SUBMITTED unless the linked DelayEvent is in TIA_ACCEPTED.
          Different entity pair than the schedule-version pair.
        test_recipe:
          setup:
            - "Project; DelayEvent still DRAFT (never noticed); EOT drafted against it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P14", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "D", causation: "OWNER_CAUSED", event_start_date: "2026-05-05T00:00:00Z" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /construction-projects/${pid}/eot-requests"
              payload: { delay_event_id: "${de}", requested_days: 3 }
              as: ContractorScheduler
              captures: { eid: $.data.id }
          trigger:
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/submit"
              payload: {}
              as: ContractorScheduler
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TIA_NOT_ACCEPTED (DelayEvent is DRAFT, not TIA_ACCEPTED)"

  # =======================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: eot_approval_offsets_overlapping_lda_half_open_interval
        grounds:
          - state_machines.TimeExtensionRequest.UNDER_REVIEW_to_APPROVED
          - state_machines.LiquidatedDamagesAssessment (PROPOSED → OFFSET_BY_EOT)
        distinguishing_aspect: |
          Resource = Project's completion-date timeline; interval semantics =
          HALF-OPEN [old_current_completion, new_current_completion) — an LDA
          whose period overlaps that interval transitions to OFFSET_BY_EOT.
          Boundary touch (LDA.assessment_period_start == new_current_completion)
          does NOT trigger offset (half-open upper bound).
        test_recipe:
          setup:
            - "Project with current_completion_date=2026-05-01; PROPOSED LDA covering [2026-05-01, 2026-05-10]"
            - "TIA_ACCEPTED DelayEvent with 5 compensable days; EOT submitted for 5 days"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P15", contract_start_date: "2026-04-01T00:00:00Z", contract_completion_date: "2026-05-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 5000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "D", causation: "OWNER_CAUSED", event_start_date: "2026-04-20T00:00:00Z" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events/${de}/notice"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/accept"
              payload: {}
              as: ClaimsConsultant
            - call: "POST /construction-projects/${pid}/ld-assessments"
              payload: { assessment_period_start: "2026-05-01T00:00:00Z", assessment_period_end: "2026-05-10T00:00:00Z" }
              as: OwnerRepresentative
              captures: { lda: $.data.id }
            - call: "POST /construction-projects/${pid}/eot-requests"
              payload: { delay_event_id: "${de}", requested_days: 5 }
              as: ContractorScheduler
              captures: { eid: $.data.id }
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/begin-review"
              payload: {}
              as: OwnerRepresentative
          trigger:
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/approve"
              payload: { expected_project_version: "${pv0}", approved_days: 5, awarded_cost_cents: 0 }
              as: OwnerRepresentative
          assert:
            - "LiquidatedDamagesAssessment.${lda}.status == OFFSET_BY_EOT (LDA period overlaps the [2026-05-01, 2026-05-06) EOT shift window)"
            - "LiquidatedDamagesAssessment.${lda}.assessed_ld_cents == 0"

      - name: concurrent_delay_overlap_uses_closed_interval_with_float_absorption
        grounds:
          - calculations.concurrent_delay_apportionment
          - entities.ConstructionProject.fields.float_ownership_policy
        distinguishing_aspect: |
          Resource = the critical path's float pool; interval semantics =
          CLOSED [event_start, event_end] with float-absorption ordering —
          under OWNER_OWNS the owner's compensable days only begin AFTER the
          available float is exhausted. Different semantics (closed vs half-open)
          and different resource (float pool vs calendar timeline) than the
          LDA-offset instance.
        test_recipe:
          setup:
            - "Project with float_ownership_policy=OWNER_OWNS, notice_window_days=21"
            - "DelayEvent causation=OWNER_CAUSED, in-window notice, critical-path impact=15 days, owner_concurrent=10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P16", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 5000000, float_ownership_policy: "OWNER_OWNS", notice_window_days: 21 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "Late owner design", causation: "OWNER_CAUSED", event_start_date: "2026-05-05T00:00:00Z", event_end_date: "2026-05-25T00:00:00Z" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events/${de}/notice"
              payload: {}
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/submit"
              payload: {}
              as: ContractorScheduler
          assert:
            - "DelayEvent.${de}.apportioned_non_excusable_days == 0 (no contractor concurrency)"
            - "apportioned_compensable_days + apportioned_excusable_non_compensable_days == tia_prolongation_days_prospective"
            - "Under OWNER_OWNS float policy, compensable days reflect float absorption before owner responsibility begins"

  # =======================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =======================================================================
  - rule_id: compensating_invariant
    instances:
      - name: schedule_reject_clears_computed_float_invariant
        grounds:
          - state_machines.ScheduleVersion.SUBMITTED_to_REJECTED
          - entities.Activity.fields.total_float_days
        distinguishing_aspect: |
          Conserved quantity = the set of computed Activity float/date fields.
          Forward action = submit (populates them via CPM); compensating action
          = reject (must clear them). Invariant: after reject, every Activity's
          early_start/early_finish/late_start/late_finish/total_float_days are
          NULL — the same observable state as a never-submitted draft.
        test_recipe:
          setup:
            - "Project + DRAFT BASELINE with activity A; submit (populates CPM fields)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P17", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 5 }
              as: ContractorScheduler
              captures: { a: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/reject"
              payload: {}
              as: ProjectControlsEngineer
            - call: "GET /construction-projects/${pid}/schedule-versions/${bv}/activities/${a}"
              as: ProjectControlsEngineer
              captures: { tf: $.data.total_float_days, es: $.data.early_start }
          assert:
            - "Activity.${a}.total_float_days == null (compensating reject cleared CPM-derived fields)"
            - "Activity.${a}.early_start == null"

      - name: eot_partial_approve_conserves_total_days_invariant
        grounds:
          - state_machines.TimeExtensionRequest.UNDER_REVIEW_to_PARTIALLY_APPROVED
          - entities.ConstructionProject.fields.current_completion_date
        distinguishing_aspect: |
          Conserved quantity = calendar-day arithmetic on project.current_completion_date.
          Forward action = partial-approve adds approved_days; compensating check
          = an immediate full-approve attempt on the same EOT MUST fail (already
          terminal), and current_completion_date advances by EXACTLY approved_days
          (not requested_days). Invariant: new_current_completion_date -
          old_current_completion_date == approved_days.
        test_recipe:
          setup:
            - "Project current_completion_date=2026-05-01; TIA_ACCEPTED DelayEvent; EOT submitted requesting 10 days"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P18", contract_start_date: "2026-04-01T00:00:00Z", contract_completion_date: "2026-05-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, pv0: $.data.version, ccd0: $.data.current_completion_date }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "D", causation: "FORCE_MAJEURE", event_start_date: "2026-04-20T00:00:00Z" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events/${de}/notice"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/accept"
              payload: {}
              as: ClaimsConsultant
            - call: "POST /construction-projects/${pid}/eot-requests"
              payload: { delay_event_id: "${de}", requested_days: 10, cost_recovery_cents: 0 }
              as: ContractorScheduler
              captures: { eid: $.data.id }
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/begin-review"
              payload: {}
              as: OwnerRepresentative
          trigger:
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/partial-approve"
              payload: { expected_project_version: "${pv0}", approved_days: 4, awarded_cost_cents: 0 }
              as: OwnerRepresentative
            - call: "GET /construction-projects/${pid}"
              as: OwnerRepresentative
              captures: { ccd1: $.data.current_completion_date }
          assert:
