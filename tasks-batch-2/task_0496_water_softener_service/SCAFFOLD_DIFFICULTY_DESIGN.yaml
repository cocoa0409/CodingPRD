scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: proration_full_cycle_vs_daily_on_rental_contract
        grounds:
          - calculations.rental_proration
          - entities.Invoice.fields.invoice_kind
          - entities.RentalContract.fields.monthly_rate_cents
        distinguishing_aspect: "On the SAME RentalContract+period, RENTAL_CYCLE bills a flat 4500 cents while PRORATION over an 18-day partial occupancy bills 2700 cents — same inputs, two algorithms, different amounts; this calc lives on the billing (RentalContract/Invoice) domain."
        test_recipe:
          setup:
            - "A customer, account (zone Z-NORTH), an ACCEPTED water test (hardness 15), a RENTAL system installed+activated, and a rental contract monthly_rate_cents=4500 starting 2026-06-13 exist; clock at 2026-07-05."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ada Owner", email: "ada@x.com" }
              as: BillingClerk
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Tim Tech", home_zone: "Z-NORTH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { rec_cap: $.data.recommended_grain_capacity }
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "RENTAL", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_id: $.data.id }
            - call: "POST /systems/${sys_id}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", system_id: "${sys_id}", monthly_rate_cents: 4500, term_months: 12, start_date: "2026-06-13T00:00:00Z" }
              as: BillingClerk
              captures: { rc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: BillingClerk
          trigger:
            - call: "POST /invoices"
              payload: { account_id: "${acct_id}", contract_id: "${rc_id}", invoice_kind: "RENTAL_CYCLE", period_start: "2026-06-13T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_full_id: $.data.id, inv_full_amt: $.data.amount_cents }
            - call: "POST /invoices"
              payload: { account_id: "${acct_id}", contract_id: "${rc_id}", invoice_kind: "PRORATION", period_start: "2026-06-13T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_pro_id: $.data.id, inv_pro_amt: $.data.amount_cents }
          assert:
            - "Invoice.${inv_full_id}.amount_cents == 4500"
            - "Invoice.${inv_pro_id}.amount_cents == 2700"
            - "Invoice.${inv_full_id}.amount_cents != Invoice.${inv_pro_id}.amount_cents"

      - name: claim_settlement_covered_vs_out_of_warranty_on_warrantyclaim
        grounds:
          - calculations.claim_settlement
          - calculations.coverage_window
          - entities.WarrantyClaim.fields.settlement_cents
        distinguishing_aspect: "On the WarrantyClaim domain (a different entity from rental billing), a covered VALVE_FAILURE settles at 0 cents while an out-of-warranty CONTROL_BOARD on a 2-year-old system settles at 31500 cents — divergent results from the covered flag."
        test_recipe:
          setup:
            - "Two systems: SYS_A installed 2026-01-01 (fresh) with a covered VALVE_FAILURE claim, SYS_B installed 2024-01-01 (aged 2yr) with an out-of-warranty CONTROL_BOARD claim; clock at 2026-06-01 when resolving."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bo Owner", email: "bo@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Fay Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "WELL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "PURCHASE", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_b: $.data.id }
            - call: "POST /systems/${sys_b}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_b}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "PURCHASE", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_a: $.data.id }
            - call: "POST /systems/${sys_a}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_a}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /warranty-claims"
              payload: { system_id: "${sys_a}", defect_class: "VALVE_FAILURE", reported_at: "2026-06-01T00:00:00Z" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { claim_a: $.data.id }
            - call: "POST /warranty-claims/${claim_a}/triage"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { a_covered: $.data.covered }
            - call: "POST /warranty-claims"
              payload: { system_id: "${sys_b}", defect_class: "CONTROL_BOARD", reported_at: "2026-06-01T00:00:00Z" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { claim_b: $.data.id }
            - call: "POST /warranty-claims/${claim_b}/triage"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { b_covered: $.data.covered }
          trigger:
            - call: "POST /warranty-claims/${claim_a}/resolve"
              payload: { resolution: "REPAIR" }
              as: ServiceManager
              captures: { a_settle: $.data.settlement_cents }
            - call: "POST /warranty-claims/${claim_b}/resolve"
              payload: { resolution: "REPAIR" }
              as: ServiceManager
              captures: { b_settle: $.data.settlement_cents }
          assert:
            - "WarrantyClaim.${claim_a}.covered == true"
            - "WarrantyClaim.${claim_a}.settlement_cents == 0"
            - "WarrantyClaim.${claim_b}.covered == false"
            - "WarrantyClaim.${claim_b}.settlement_cents == 31500"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: proration_round_then_multiply_order_mode_b
        grounds:
          - calculations.rental_proration
          - entities.RentalContract.fields.monthly_rate_cents
          - entities.Invoice.fields.invoice_kind
        distinguishing_aspect: "Mode (b) nested-rounding-order: daily_rate = round_half_up(4505/30) = 150 is rounded BEFORE multiplying by 18 billable days giving 2700, whereas multiply-then-round (4505/30*18 = 2703.0 -> 2703) would give 2703; the scaffold pins round-then-multiply."
        test_recipe:
          setup:
            - "A RENTAL contract monthly_rate_cents=4505 starting 2026-06-13 on an ACTIVE system; clock at 2026-07-05; a PRORATION invoice over [2026-06-13, 2026-07-01) = 18 billable days."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cy Owner", email: "cy@x.com" }
              as: BillingClerk
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Ty Tech", home_zone: "Z-NORTH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "RENTAL", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_id: $.data.id }
            - call: "POST /systems/${sys_id}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", system_id: "${sys_id}", monthly_rate_cents: 4505, term_months: 12, start_date: "2026-06-13T00:00:00Z" }
              as: BillingClerk
              captures: { rc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: BillingClerk
          trigger:
            - call: "POST /invoices"
              payload: { account_id: "${acct_id}", contract_id: "${rc_id}", invoice_kind: "PRORATION", period_start: "2026-06-13T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.amount_cents == 2700"

      - name: early_termination_fee_tiered_rate_with_cap_mode_a
        grounds:
          - calculations.early_termination_fee
          - entities.RentalContract.fields.term_months
          - entities.RentalContract.fields.start_date
        distinguishing_aspect: "Mode (a) >=3-input non-linear formula: months_remaining (from start_date, term_months, clock) selects a tiered rate (1.0/0.6/0.4) then min-caps the product at FEE_CAP_CENTS; here months_remaining=10 -> tier3 0.4 -> 10*4500*0.4 = 18000, uncapped."
        test_recipe:
          setup:
            - "A RENTAL contract term_months=12, monthly_rate_cents=4500, start_date 2026-01-01; clock advanced to 2026-03-02 (60 days, 2 months elapsed, 10 remaining)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Di Owner", email: "di@x.com" }
              as: BillingClerk
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Vi Tech", home_zone: "Z-NORTH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "RENTAL", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_id: $.data.id }
            - call: "POST /systems/${sys_id}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", system_id: "${sys_id}", monthly_rate_cents: 4500, term_months: 12, start_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { rc_id: $.data.id, rc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: BillingClerk
          trigger:
            - call: "POST /rental-contracts/${rc_id}/terminate"
              payload: { expected_rentalcontract_version: "${rc_v}" }
              as: BillingClerk
              captures: { etf: $.data.early_termination_fee_cents }
          assert:
            - "RentalContract.${rc_id}.early_termination_fee_cents == 18000"
            - "RentalContract.${rc_id}.status == TERMINATED"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rental_contract_cyclic_active_suspended
        grounds:
          - state_machines.RentalContract.ACTIVE_to_SUSPENDED
          - state_machines.RentalContract.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "RentalContract is cyclic: ACTIVE->SUSPENDED->ACTIVE->SUSPENDED is reachable, and each toggle increments version (a linear pipeline could not revisit ACTIVE); final version is 4 after three toggles from version 1."
        test_recipe:
          setup:
            - "An ACTIVE rental contract (version 1) on a GOOD-standing account exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ed Owner", email: "ed@x.com" }
              as: BillingClerk
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Wu Tech", home_zone: "Z-NORTH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "RENTAL", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_id: $.data.id }
            - call: "POST /systems/${sys_id}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", system_id: "${sys_id}", monthly_rate_cents: 4500, term_months: 12, start_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /rental-contracts/${rc_id}/suspend"
              payload: {}
              as: BillingClerk
            - call: "POST /rental-contracts/${rc_id}/resume"
              payload: {}
              as: BillingClerk
            - call: "POST /rental-contracts/${rc_id}/suspend"
              payload: {}
              as: BillingClerk
              captures: { final_status: $.data.status, final_v: $.data.version }
          assert:
            - "RentalContract.${rc_id}.status == SUSPENDED"
            - "RentalContract.${rc_id}.version == 4"

      - name: warranty_claim_branching_fork_join
        grounds:
          - state_machines.WarrantyClaim.TRIAGED_to_REPAIR
          - state_machines.WarrantyClaim.TRIAGED_to_REPLACE
          - state_machines.WarrantyClaim.TRIAGED_to_DENIED
        distinguishing_aspect: "WarrantyClaim is branching fork-join on a DIFFERENT entity than RentalContract: TRIAGED forks to {REPAIR, REPLACE, DENIED}; REPAIR and REPLACE join at CLOSED while DENIED is a separate terminal — the chosen REPLACE branch on a covered claim drives settlement to 0 and reaches CLOSED."
        test_recipe:
          setup:
            - "A covered RESIN_FOULING claim is TRIAGED on a fresh system installed 2026-01-01; clock at 2026-06-01."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fi Owner", email: "fi@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Yo Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "PURCHASE", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_id: $.data.id }
            - call: "POST /systems/${sys_id}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /warranty-claims"
              payload: { system_id: "${sys_id}", defect_class: "RESIN_FOULING", reported_at: "2026-06-01T00:00:00Z" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /warranty-claims/${claim_id}/triage"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /warranty-claims/${claim_id}/resolve"
              payload: { resolution: "REPLACE" }
              as: ServiceManager
              captures: { status_after: $.data.status }
            - call: "POST /warranty-claims/${claim_id}/close"
              payload: {}
              as: ServiceManager
              captures: { final_status: $.data.status }
          assert:
            - "WarrantyClaim.${claim_id}.status == CLOSED"
            - "WarrantyClaim.${claim_id}.covered == true"
            - "WarrantyClaim.${claim_id}.settlement_cents == 0"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: terminate_to_fee_invoice_to_ledger_debit_depth3
        grounds:
          - state_machines.RentalContract.ACTIVE_to_TERMINATED
          - calculations.early_termination_fee
          - calculations.apply_invoice
          - entities.ServiceAccount.fields.credit_balance_cents
        distinguishing_aspect: "Depth-3 cascade from terminate: (A) RentalContract->TERMINATED computes an 18000-cent fee, which (B) creates a TERMINATION Invoice, whose issue (C) debits the account's 5000-cent credit (applied=5000, balance->0, remainder owed) — each hop caused by the prior."
        test_recipe:
          setup:
            - "RENTAL contract (monthly 4500, term 12, start 2026-01-01) on an account pre-credited 5000 cents; clock at 2026-03-02 so 10 months remain (fee 18000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gus Owner", email: "gus@x.com" }
              as: BillingClerk
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Ha Tech", home_zone: "Z-NORTH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/credit"
              payload: { amount_cents: 5000 }
              as: BillingClerk
            - call: "POST /water-tests"
