            - call: "POST /lqa-bugs"
              payload: { qa_pass_id: "${pass_ling}", bug_class: "MISTRANSLATION", severity: "S2", summary: "honorific register wrong" }
              as: LqaTester
              as_user_id: "lqa-1"
              captures: { bug_c: "$.data.id" }
