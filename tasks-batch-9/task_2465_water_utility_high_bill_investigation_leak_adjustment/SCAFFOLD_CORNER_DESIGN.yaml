      - name: corner_state_cyclic_evidence_loop_termination
        claim_type: cyclic
        grounds:
          - state_machines.HighBillInvestigation
          - validations[ERR_EVIDENCE_ROUND_LIMIT]
        excluded_because:
          difficulty_instance: non_linear_cyclic_investigation_evidence_loop_then_remand_exhausts_rounds
          rationale: |
            That difficulty instance already drives the EVIDENCE_REQUESTED <-> EVIDENCE_UNDER_REVIEW
            back-edge to its MAX_EVIDENCE_ROUNDS bound, then re-enters the loop through a board
            remand and asserts the terminal ERR_EVIDENCE_ROUND_LIMIT refusal — the full loop-count
            and termination claim for this shape.

