            - {call: "GET /water-bank-accounts/${acct}", as: WaterRightsAnalyst, captures: {acct_v1: "$.data.version"}}
            - {call: "POST /water-bank-accounts/${acct}/deposits", payload: {water_right_id: "${wr}", deposit_af: 90.00, expected_water_bank_account_version: "${acct_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /lease-assignments", payload: {water_bank_account_id: "${acct}", water_right_id: "${wr}", point_of_diversion_id: "${pod}", lessee_name: "Bitterroot Feedlot", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-07-01T00:00:00Z", requested_af: 20.00, diversion_rate_cfs: 1.000, rental_rate_usd_per_af: 12.00, valuation_method: PRO_RATA_DAILY}, as: WaterRightsAnalyst, captures: {lease: "$.data.id"}}
          trigger:
