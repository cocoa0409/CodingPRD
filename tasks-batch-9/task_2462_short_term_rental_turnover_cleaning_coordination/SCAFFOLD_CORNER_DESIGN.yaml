          assert:
            - "${e1} == ERR_CLEANING_WINDOW_NON_POSITIVE (422) - window_end_at 16:00Z equals window_start_at 16:00Z, so window_minutes would be 0"
            - "${e2} == ERR_CLEANING_WINDOW_NON_POSITIVE (422) - override_reason does NOT waive priority 22"
            - "${e3} == ERR_WINDOW_OVERRIDE_REQUIRED (422) - a 1-minute window is positive but 109 minutes short of 110"
            - "${t2_min} == 1 with HTTP 201, ${t2_start} == 2026-08-08T16:00:00Z, ${t2_end} == 2026-08-08T16:01:00Z"
            - "${t2_req} == 110, ${t2_slack} == -109, ${t2_tight} == true, ${t2_status} == PENDING_ASSIGNMENT"
            - "GET /turnovers?property_id=${p1} returns total_count == 0 - the refused pair produced no row"

      - name: corner_val_schedule_change_that_compresses_a_live_turn_needs_an_override
        claim_type: Conditional validation
        grounds:
          - validations[priority=24]
          - errors.ERR_SCHEDULE_CHANGE_BLOCKS_TURN
          - endpoints["POST /bookings/{id}/schedule-change"].side_effects
        distinguishing_aspect: |
          Priority 24 only fires when the outgoing booking actually carries a live turnover, and
          only when the compressed window drops BELOW required_minutes: 16:00Z -> 17:00Z leaves
          210 >= 198 and is granted with no override, 17:00Z -> 17:30Z leaves 180 < 198 and is
