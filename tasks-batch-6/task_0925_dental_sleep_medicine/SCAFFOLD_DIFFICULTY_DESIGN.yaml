          - state_machines.PriorAuth.APPEALED_to_DENIED_FINAL
          - validations[priority=35]
          - errors[ERR_APPEAL_LIMIT_REACHED]
        distinguishing_aspect: |
          The second non-linear machine is on a different entity, PriorAuth, and its non-linearity is a
          bounded cycle rather than a self-loop: DENIED -> APPEALED -> DENIED repeats until
          appeal_attempts reaches Payer.appeal_limit, at which point the identical decision call lands
          in DENIED_FINAL instead of DENIED and any further appeal is refused.
        test_recipe:
          setup:
            - "A payer with prior_auth_required true and appeal_limit 2."
            - "An ACCEPTED referral for a SEVERE patient and a PriorAuth in status SUBMITTED."
