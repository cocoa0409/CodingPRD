  - rule_id: compensating_invariant
    instances:
      - name: liters_ledger_nets_to_zero_on_return_and_is_re_debited_on_reship
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_RETURNED
          - state_machines.Order.RETURNED_to_LABELED
          - entities.VolumeLedgerEntry.fields.event_type
          - calculations.consumer_rolling_volume_liters
          - entities.Consumer.fields.return_credit_count
        distinguishing_aspect: |
          The liters ledger is append-only, so the compensation must be a mirror entry rather than an
          edit: after the return the two rows sum to exactly 0.000 and the consumer's rolling volume is back to
          its pre-order value, and the reship appends a third row that restores 4.500 without deleting
          anything. The audit counter is deliberately NOT compensated — return_credit_count stays 1 through the
          reship, so the round trip leaves a permanent trace.
