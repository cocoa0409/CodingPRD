  - rule_id: resource_temporal_overlap
    instances:

      - name: authorization_window_closed_interval_touching_endpoints_collide
        grounds:
          - calculations.authorization_window_overlap
          - validations[priority 43 -> ERR_AUTHORIZATION_WINDOW_OVERLAP]
          - calculations.service_unit_pool
          - endpoints[POST /ei/provider-authorizations]
        distinguishing_aspect: |
          This instance pins CLOSED/CLOSED date-interval semantics on the shared resource "one service
          line": a new window whose start_date equals an existing window's end_date (2026-04-30) is a
          collision, and moving the start one day later to 2026-05-01 is admitted. The contrast pair
          differs by a single day and the successful branch is verified through the unit pool
          (committed 36, remaining 60). The other resource_temporal_overlap instance is the mirror
          image: HALF-OPEN datetime intervals where touching endpoints are LEGAL, on a different
          shared resource (the provider's calendar) and widened by a setting-change buffer.
        test_recipe:
          setup:
            - "An ACTIVE_SERVICES case whose ACTIVE plan carries one HOME SPEECH_THERAPY line of 96 planned units."
            - "One ACTIVE authorization on that line for 24 units over 2026-04-01..2026-04-30, so units_committed is 24 and units_pool_remaining is 72."
            - "The provider is ACTIVE, qualified for SPEECH_THERAPY and credentialed through 2027-06-30, so priorities 22, 31 and 41 all pass."
            - "Logical clock at 2026-03-20T09:00:00Z; authorization windows are allowed to be future-dated."
