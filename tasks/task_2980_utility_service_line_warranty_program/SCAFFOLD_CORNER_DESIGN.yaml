          - state_machines.Dispatch.transitions.ASSIGNED_to_SLA_BREACHED
        distinguishing_aspect: "The replacement dispatch is created 3.5 hours after the claim was reported and must still carry the ORIGINAL 12:00 deadline - not 11:30 + 4h and not a deadline derived from its own 2026-09-11 appointment window - so the nightly run at exactly 12:00 breaches a dispatch that is 30 minutes old."
