            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 2000.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 1800.0, span_measured_value: 1810.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }, { hour_begin_utc: "2026-04-01T03:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }, { hour_begin_utc: "2026-04-01T04:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }, { hour_begin_utc: "2026-04-01T05:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }, { hour_begin_utc: "2026-04-01T06:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }, { hour_begin_utc: "2026-04-01T07:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }, { hour_begin_utc: "2026-04-01T08:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }, { hour_begin_utc: "2026-04-01T09:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }, { hour_begin_utc: "2026-04-01T10:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }, { hour_begin_utc: "2026-04-01T11:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 20000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 1500.0, nox_rate_lb_mmbtu: 0.150 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { first_hour_id: "$.data[0].id" }
            - call: "POST /emissions/units/${unit_id}/permit-limits"
              payload: { pollutant: "SO2", limit_value: 4900.0, limit_units: "LB_PER_HR", averaging_basis: "ROLLING_3_HOUR", effective_from_utc: "2026-01-01T00:00:00Z" }
