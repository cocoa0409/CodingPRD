# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Water & Fire Restoration / Disaster Cleanup
# Nine Difficulty Rules x >= 2 instances each (>= 18 total). Every grounds[]
# reference resolves into SCAFFOLD.yaml §1.1-§1.7; every test_recipe drives from
# empty-DB using only §1.5 endpoints. Numeric asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_cost_estimated_vs_final_billed
        grounds:
          - calculations.estimate_cost
          - calculations.final_billing
          - entities.ScopeEstimate.fields.estimate_total_cents
          - entities.EquipmentPlacement.fields.billable_days
        distinguishing_aspect: |
          Cost domain: the projected estimate_total_cents (estimated_drying_days x required
          counts) and the realized billing.final_total_cents (actual placement billable_days)
          diverge for the same job; estimate=41000, final=51500 when a unit runs 3 days vs the
          2 estimated.
        test_recipe:
          setup:
            - "A claim with coverage_limit_cents=200000; a WATER class-1 job with one chamber (room R1, 100 sqft, 0 wet wall, dehu 70 => air_movers_required=1, dehumidifiers_required=1)."
            - "An APPROVED estimate with estimated_drying_days=2 and one scope line qty=2 unit_price_cents=10000 (estimate_total_cents=41000)."
            - "One AIR_MOVER and one DEHUMIDIFIER placed in R1 on monitoring_day 0; advanced 3 monitoring days; both removed on day 3 (billable_days=3 each)."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P1", peril: "WATER", coverage_limit_cents: 200000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Tech A", certification: "ASD" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-1", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { am1: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "DH-1", kind: "DEHUMIDIFIER" }
              as: PlatformAdmin
              captures: { dh1: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "1 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v1: $.data.version }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id, ch1_am_req: $.data.air_movers_required, ch1_dh_req: $.data.dehumidifiers_required }
            - call: "GET /restoration/jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_v_now: $.data.version }
            - call: "POST /restoration/estimates"
              payload: { job_id: "${job_id}", estimated_drying_days: 2, line_items: [ { qty: 2, unit_price_cents: 10000 } ], expected_job_version: "${job_v_now}" }
              as: Estimator
              captures: { est_id: $.data.id, est_total: $.data.estimate_total_cents }
            - call: "POST /restoration/estimates/${est_id}/approve"
              payload: {}
              as: Adjuster
              as_user_id: "adj-1"
            - call: "POST /restoration/jobs/${job_id}/start-mitigation"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${am1}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pl_am: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${dh1}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pl_dh: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/begin-monitoring"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/jobs/${job_id}/advance-day"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/jobs/${job_id}/advance-day"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/jobs/${job_id}/advance-day"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/placements/${pl_am}/remove"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/placements/${pl_dh}/remove"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "GET /restoration/jobs/${job_id}/billing"
              payload: {}
              as: Adjuster
              as_user_id: "adj-1"
              captures: { final_total: $.data.final_total_cents, variance: $.data.billing_variance_cents }
          assert:
            - "ScopeEstimate.${est_id}.estimate_total_cents == 41000"
            - "billing.final_equipment_cents == 31500"
            - "billing.final_total_cents == 51500"
            - "billing.billing_variance_cents == 10500"

      - name: drying_progress_instant_vs_trailing
        grounds:
          - calculations.drying_progress_pct
          - entities.MoistureReading.fields.gpp
          - entities.LossJob.fields.drying_status
        distinguishing_aspect: |
          Moisture domain (distinct from the cost domain above): the instantaneous progress
          (newest reading gpp) and the trailing progress (mean of two newest readings' gpp)
          diverge for the same chamber — 66.04% vs 51.89% for the pinned reading set.
        test_recipe:
          setup:
            - "A DISPATCHED WATER job (readings are not job-state gated) with an UNAFFECTED-REF chamber whose newest reading gpp=43 (temp 70, RH 40), and a target chamber R1 with three readings: first gpp=149 (90/70), then 108 (85/60), newest 79 (78/55). R1 stays OPEN (mc 40/30/20 all > dry threshold 16)."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P2", peril: "WATER", coverage_limit_cents: 500000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Tech A", certification: "ASD" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-2", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { am2: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "DH-2", kind: "DEHUMIDIFIER" }
              as: PlatformAdmin
              captures: { dh2: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "2 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "UNAFFECTED-REF", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ref_ch: $.data.id }
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${am2}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${dh2}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/chambers/${ref_ch}/readings"
              payload: { temp_f: 70, relative_humidity_pct: 40, moisture_content_pct: 10 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ref_r1: $.data.gpp }
            - call: "POST /restoration/chambers/${ch1}/readings"
              payload: { temp_f: 90, relative_humidity_pct: 70, moisture_content_pct: 40 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { r1_first: $.data.gpp }
            - call: "POST /restoration/chambers/${ch1}/readings"
              payload: { temp_f: 85, relative_humidity_pct: 60, moisture_content_pct: 30 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/chambers/${ch1}/readings"
              payload: { temp_f: 78, relative_humidity_pct: 55, moisture_content_pct: 20 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { r1_latest: $.data.gpp }
          trigger:
            - call: "GET /restoration/jobs/${job_id}/drying-progress?mode=INSTANT"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { prog_instant: $.data.per_chamber }
            - call: "GET /restoration/jobs/${job_id}/drying-progress?mode=TRAILING"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { prog_trailing: $.data.per_chamber }
          assert:
            - "MoistureReading.${ref_ch}.newest.gpp == 43"
            - "instant progress_pct for chamber R1 == 66.04"
            - "trailing progress_pct for chamber R1 == 51.89"
            - "instant progress_pct != trailing progress_pct"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: equipment_sizing_tiered_nonlinear
        grounds:
          - calculations.chamber_equipment_sizing
          - entities.DryingChamber.fields.air_movers_required
          - entities.DryingChamber.fields.dehumidifiers_required
        distinguishing_aspect: |
          Mode (a) non-linear: air_movers_required = max(1, ceil(area/AM_DIVISOR[class])) +
          ceil(wet_wall/16) and dehumidifiers_required = ceil(round(area*CLASS_FACTOR[class],2)/dehu)
          combine >=3 inputs with class-keyed tier selection and nested ceil — class-2 700sqft/40lf/70
          => 13 air movers, 10 dehumidifiers.
        test_recipe:
          setup:
            - "A WATER class-2 job; one chamber R1 with floor_area_sqft=700, wet_wall_linear_ft=40, dehu_ppd_rating=70."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P3", peril: "WATER", coverage_limit_cents: 9000000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "3 Main", loss_type: "WATER", water_category: 2, water_class: 2 }
              as: Dispatcher
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 700, wet_wall_linear_ft: 40, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "tech-x"
              captures: { ch1: $.data.id, am_req: $.data.air_movers_required, dh_req: $.data.dehumidifiers_required }
          assert:
            - "DryingChamber.${ch1}.air_movers_required == 13"
            - "DryingChamber.${ch1}.dehumidifiers_required == 10"

      - name: insurance_acv_per_line_rounding_order
        grounds:
          - calculations.insurance_acv
          - entities.ScopeEstimate.fields.acv_total_cents
          - entities.InsuranceClaim.fields.depreciation_pct
        distinguishing_aspect: |
          Mode (b) rounding order: depreciation is rounded PER LINE then summed (never sum-then-round).
          Three lines qty=1 unit=1050 at 15% depreciation give acv_total_cents=2676; sum-then-round
          would give 2677 — the pinned per-line order yields 2676.
        test_recipe:
          setup:
            - "A claim with depreciation_pct=15, tax_pct=0, coverage_limit_cents=9000000; a WATER job with no chambers."
            - "An estimate with three line_items each { qty:1, unit_price_cents:1050 } (scope_lines_total_cents=3150, equipment_estimate_cents=0)."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P4", peril: "FIRE", coverage_limit_cents: 9000000, depreciation_pct: 15, tax_pct: 0 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "4 Main", loss_type: "FIRE" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v1: $.data.version }
          trigger:
            - call: "POST /restoration/estimates"
              payload: { job_id: "${job_id}", estimated_drying_days: 3, line_items: [ { qty: 1, unit_price_cents: 1050 }, { qty: 1, unit_price_cents: 1050 }, { qty: 1, unit_price_cents: 1050 } ], expected_job_version: "${job_v1}" }
              as: Estimator
              captures: { est_id: $.data.id, acv: $.data.acv_total_cents, scope_tot: $.data.scope_lines_total_cents }
          assert:
            - "ScopeEstimate.${est_id}.scope_lines_total_cents == 3150"
            - "ScopeEstimate.${est_id}.acv_total_cents == 2676"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: chamber_cyclic_open_dried_open
        grounds:
          - state_machines.DryingChamber.OPEN_to_DRIED
          - state_machines.DryingChamber.DRIED_to_OPEN
          - entities.DryingChamber.fields.is_dry
        distinguishing_aspect: |
          DryingChamber is cyclic OPEN<->DRIED on a single entity: a dry reading
          (mc=16 <= 12+4) drives OPEN->DRIED, a later re-wetting reading (mc=20) drives DRIED->OPEN —
          a true loop, not a linear pipeline.
        test_recipe:
          setup:
            - "A WATER MONITORING-eligible chamber R1 with dry_standard_pct=12; readings drive it dry then wet again."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P5", peril: "WATER", coverage_limit_cents: 500000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Tech A", certification: "WRT" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "5 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id }
            - call: "POST /restoration/chambers/${ch1}/readings"
              payload: { temp_f: 78, relative_humidity_pct: 55, moisture_content_pct: 16 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /restoration/chambers/${ch1}/readings"
              payload: { temp_f: 85, relative_humidity_pct: 60, moisture_content_pct: 20 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { rewet_mc: $.data.moisture_content_pct }
          assert:
            - "After the mc=16 reading, DryingChamber.${ch1}.status == DRIED and is_dry == true"
            - "After the mc=20 reading, DryingChamber.${ch1}.status == OPEN and is_dry == false"

      - name: job_monitoring_revert_to_mitigation
        grounds:
          - state_machines.LossJob.MONITORING_to_MITIGATION
          - state_machines.LossJob.MITIGATION_to_MONITORING
          - state_machines.LossJob.MONITORING_to_CANCELLED
        distinguishing_aspect: |
          LossJob (a different entity from DryingChamber) is branch-with-revert: MONITORING forks to
          MITIGATION (reopen) and to CANCELLED, and MITIGATION can return to MONITORING — a non-linear
          fork+revert shape, not a one-way pipeline.
        test_recipe:
          setup:
            - "A WATER job in MONITORING with one chamber R1 still wet (is_dry=false)."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P6", peril: "WATER", coverage_limit_cents: 500000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Tech A", certification: "WRT" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-6", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { am6: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "DH-6", kind: "DEHUMIDIFIER" }
              as: PlatformAdmin
              captures: { dh6: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "6 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${am6}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${dh6}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/jobs/${job_id}/start-mitigation"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/jobs/${job_id}/begin-monitoring"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /restoration/jobs/${job_id}/reopen-mitigation"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { st: $.data.status }
          assert:
            - "LossJob.${job_id}.status == MITIGATION after reopen-mitigation"
            - "A subsequent POST /restoration/jobs/${job_id}/begin-monitoring returns the job to status == MONITORING"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_depth3_placement_unit_chamber
        grounds:
          - state_machines.LossJob.MONITORING_to_CANCELLED
          - state_machines.EquipmentPlacement.ACTIVE_to_REMOVED
          - entities.EquipmentUnit.fields.status
          - entities.DryingChamber.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from cancel: hop1 ACTIVE EquipmentPlacement -> REMOVED causes
          hop2 its EquipmentUnit -> AVAILABLE (active_placement_id null), and the removal of
          equipment in turn permits hop3 the OPEN DryingChamber -> DECOMMISSIONED — each hop
          caused by the prior, not by cancel directly.
        test_recipe:
          setup:
            - "A WATER job in MONITORING with chamber R1 (OPEN), one AIR_MOVER placement ACTIVE, its unit DEPLOYED."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P7", peril: "WATER", coverage_limit_cents: 500000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Tech A", certification: "ASD" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "AM-7", kind: "AIR_MOVER" }
              as: PlatformAdmin
              captures: { am7: $.data.id }
            - call: "POST /restoration/equipment-units"
              payload: { asset_tag: "DH-7", kind: "DEHUMIDIFIER" }
              as: PlatformAdmin
              captures: { dh7: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "7 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${am7}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pl_am: $.data.id }
            - call: "POST /restoration/placements"
              payload: { job_id: "${job_id}", chamber_id: "${ch1}", equipment_unit_id: "${dh7}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/jobs/${job_id}/start-mitigation"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /restoration/jobs/${job_id}/begin-monitoring"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /restoration/jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { st: $.data.status }
          assert:
            - "LossJob.${job_id}.status == CANCELLED"
            - "EquipmentPlacement.${pl_am}.status == REMOVED"
            - "EquipmentUnit.${am7}.status == AVAILABLE and active_placement_id == null"
            - "DryingChamber.${ch1}.status == DECOMMISSIONED"

      - name: reading_depth2_chamber_dried_job_drystandard
        grounds:
          - state_machines.DryingChamber.OPEN_to_DRIED
          - entities.LossJob.fields.drying_status
          - calculations.chamber_dry_determination
