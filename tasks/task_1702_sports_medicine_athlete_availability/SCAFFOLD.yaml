scenario: |
  Sports Medicine & Athlete Availability Tracking (team medical staff): injury
  intake & diagnosis coding, treatment plan & daily status designation,
  return-to-participation progression & clearance authority, workload /
  load-management data integration, medical record confidentiality &
  disclosure rules, insurance & billing for athlete care, injury trend
  analysis by position/surface, availability reporting to coaching staff.

domain_name: sports-medicine-availability
api_prefix: /sports-med

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching   # RTP regression cycle + Claim appeal cycle + Clearance re-request cycle
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential            # DailyStatusEntry.supersedes_entry_id; Claim.supersedes_claim_id
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FK fields carry canonical prefix)
# =============================================================================
entities:
  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Team name" }
      - { name: sport, type: enum, source: input, description: "FOOTBALL | BASKETBALL | SOCCER | HOCKEY | BASEBALL" }
      - { name: season_start_date, type: datetime, source: input, description: "Season window start (ISO date)" }
      - { name: season_end_date, type: datetime, source: input, description: "Season window end (ISO date); must be > season_start_date" }
      - { name: hipaa_mode, type: enum, source: input, default: "STRICT", description: "STRICT | STANDARD — STRICT suppresses designation/body_region/diagnosis detail for non-MEDICAL audiences regardless of grant scope" }
      - { name: acwr_variant, type: enum, source: input, default: "ROLLING", description: "ROLLING | EWMA — selects authoritative ACWR variant for load_flag derivation" }
      - { name: current_utc, type: datetime, source: system, description: "Logical clock; initialized to 2026-08-01T00:00:00Z; advanced only via POST /sports-med/_clock/set_current_utc" }

  - name: Athlete
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: full_name, type: string, source: input, description: "Athlete legal name" }
      - { name: position, type: string, source: input, description: "Position label (free string, e.g. QB, G, F); feeds trend analytics grouping" }
      - { name: enrollment_date, type: datetime, source: input, description: "Date athlete joined team; sessions before this date excluded from trend denominators" }
      - { name: roster_status, type: enum, source: system, description: "ACTIVE | INACTIVE | RELEASED" }
      - { name: availability_tier, type: enum, source: computed, description: "FULL | MODIFIED | LIMITED | OUT — per availability_tier_derivation" }
      - { name: acute_chronic_workload_ratio, type: number, source: computed, description: "Authoritative ACWR per Team.acwr_variant; null when gate not met" }
      - { name: load_flag, type: enum, source: computed, description: "NONE | ELEVATED | SPIKE — threshold band on acute_chronic_workload_ratio" }

  - name: DiagnosisCode
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "Diagnosis code string, e.g. S83.511A — unique" }
      - { name: body_region, type: enum, source: input, description: "HEAD_NECK | SHOULDER | ARM | HAND | TRUNK | HIP | KNEE | LOWER_LEG | ANKLE_FOOT | SYSTEMIC" }
      - { name: severity_class, type: enum, source: input, description: "MINOR | MODERATE | SEVERE — drives RTP min-days floor" }
      - { name: is_concussion, type: boolean, source: input, description: "True => concussion protocol rules apply (hard min-days floor, physician-only clearance)" }

  - name: InjuryCase
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; denormalized from athlete at intake" }
      - { name: diagnosis_code_id, type: string, source: input, description: "FK -> DiagnosisCode.id" }
      - { name: occurred_on, type: datetime, source: input, description: "Date of injury occurrence (ISO date); must not be later than current_utc date" }
      - { name: surface, type: enum, source: input, description: "GRASS | TURF | COURT | ICE | TRAINING_ROOM — surface at time of injury; feeds trend analytics" }
      - { name: mechanism, type: enum, source: input, description: "CONTACT | NON_CONTACT | OVERUSE | UNKNOWN" }
      - { name: status, type: enum, source: system, description: "OPEN -> REHAB -> RTP -> CLEARED -> CLOSED; REGRESSED loop RTP->REHAB; LONG_TERM branch from REHAB with resume" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of creating MedicalStaff (audit)" }
      - { name: severity_class_snapshot, type: enum, source: computed, description: "Copied from DiagnosisCode.severity_class at intake; immune to later DiagnosisCode edits" }
      - { name: is_concussion_snapshot, type: boolean, source: computed, description: "Copied from DiagnosisCode.is_concussion at intake" }
      - { name: cleared_on, type: datetime, source: system, description: "Set when status -> CLEARED; null otherwise" }
      - { name: closed_on, type: datetime, source: system, description: "Set when status -> CLOSED; null otherwise" }
      - { name: days_lost, type: integer, source: computed, description: "CLOSED cases: closed_on - occurred_on in whole days; else null" }

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - { name: injury_case_id, type: string, source: input, description: "FK -> InjuryCase.id" }
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; denormalized from case at creation" }
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: planned_sessions_per_week, type: integer, source: input, description: "1..14" }
      - { name: estimated_duration_weeks, type: integer, source: input, description: "1..52" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> COMPLETED; ACTIVE <-> SUSPENDED cyclic; SUSPENDED -> COMPLETED allowed" }
      - { name: suspension_reason, type: string, source: system, description: "Set when status -> SUSPENDED; cleared on resume" }

  - name: DailyStatusEntry
    parent: null
    common_fields: false   # immutable event log: id + created_at only
    fields:
      - { name: injury_case_id, type: string, source: input, description: "FK -> InjuryCase.id" }
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; denormalized from case at creation" }
      - { name: entry_date, type: datetime, source: input, description: "ISO calendar date this designation applies to; must not be later than current_utc date" }
      - { name: designation, type: enum, source: input, description: "OUT | LIMITED | MODIFIED | FULL — participation designation for entry_date" }
      - { name: symptom_free, type: boolean, source: input, description: "Feeds RTP readiness and concussion auto-suspend" }
      - { name: functional_test_score, type: integer, source: input, description: "0..100; feeds RTP readiness" }
      - { name: notes, type: string, source: input, description: "Free-text clinical note (confidential)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of recording MedicalStaff" }
      - { name: supersedes_entry_id, type: string, source: input, description: "FK -> DailyStatusEntry.id; nullable — set when correcting a prior entry for the same (injury_case_id, entry_date)" }
      - { name: is_current, type: boolean, source: computed, description: "True iff no other entry for same (injury_case_id, entry_date) has later created_at; only is_current entries feed derivations" }

  - name: RTPProtocol
    parent: null
    common_fields: true
    fields:
      - { name: injury_case_id, type: string, source: input, description: "FK -> InjuryCase.id; at most one RTPProtocol per InjuryCase" }
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; denormalized" }
      - { name: total_stages, type: integer, source: input, description: "3..7 stages" }
      - { name: current_stage_index, type: integer, source: system, description: "0-based; 0 at creation; final stage index = total_stages - 1" }
      - { name: current_stage_entered_on, type: datetime, source: system, description: "Date current stage began (creation, advance, or regression)" }
      - { name: regression_count, type: integer, source: system, default: 0, description: "Increments on each regress action" }
      - { name: status, type: enum, source: system, description: "NOT_STARTED -> IN_PROGRESS -> AWAITING_CLEARANCE -> CLEARED; IN_PROGRESS/AWAITING_CLEARANCE -> REGRESSED -> IN_PROGRESS cycle; SUSPENDED_CONCUSSION auto-overlay while concussion symptom_free=false" }

  - name: RTPStageAdvance
    parent: null
    common_fields: false   # append-only
    fields:
      - { name: rtp_protocol_id, type: string, source: system, description: "FK -> RTPProtocol.id" }
      - { name: from_stage_index, type: integer, source: system, description: "Stage departed" }
      - { name: to_stage_index, type: integer, source: system, description: "Stage entered (advance: from+1; regression row: from-1)" }
      - { name: kind, type: enum, source: system, description: "ADVANCE | REGRESSION" }
      - { name: advanced_by_user_id, type: string, source: system, description: "X-User-ID of acting MedicalStaff" }
      - { name: readiness_snapshot, type: object, source: computed, description: "ADVANCE rows only: {days_in_stage, symptom_free, functional_test_score, regression_in_window} at gate time; null on REGRESSION rows" }

  - name: ClearanceAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: rtp_protocol_id, type: string, source: input, description: "FK -> RTPProtocol.id" }
      - { name: injury_case_id, type: string, source: system, description: "FK -> InjuryCase.id; denormalized" }
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; denormalized" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of requesting MedicalStaff (segregation anchor)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of deciding TeamPhysician; must differ from requested_by_user_id and from the recorder of the latest is_current DailyStatusEntry" }
      - { name: decision, type: enum, source: system, description: "GRANTED | RETURNED_FOR_REVIEW — set on decide; null while PENDING" }
      - { name: status, type: enum, source: system, description: "PENDING -> GRANTED | RETURNED_FOR_REVIEW | EXPIRED; RETURNED_FOR_REVIEW superseded by a new PENDING request (old row -> EXPIRED)" }
      - { name: requested_at, type: datetime, source: system, description: "Logical-clock timestamp of request" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of decision; null while PENDING" }
      - { name: expires_at, type: datetime, source: system, description: "decided_at + CLEARANCE_TTL_HOURS when GRANTED; null otherwise" }
      - { name: request_notes, type: string, source: input, description: "Requester note (confidential)" }
      - { name: decision_notes, type: string, source: input, description: "Decider rationale (confidential)" }

  - name: WorkloadSession
    parent: null
    common_fields: false   # append-only feed
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; denormalized from athlete at ingest" }
      - { name: session_date, type: datetime, source: input, description: "ISO calendar date of the session; must not be later than current_utc date" }
      - { name: session_type, type: enum, source: input, description: "PRACTICE | GAME | CONDITIONING | REHAB_SESSION — REHAB_SESSION excluded from exposure denominators and ACWR windows" }
      - { name: surface, type: enum, source: input, description: "GRASS | TURF | COURT | ICE | TRAINING_ROOM" }
      - { name: duration_minutes, type: integer, source: input, description: "0..600" }
      - { name: rpe, type: integer, source: input, description: "0..10 rating of perceived exertion" }
      - { name: session_load, type: integer, source: computed, description: "= duration_minutes * rpe (arbitrary units)" }
      - { name: counts_as_exposure, type: boolean, source: computed, description: "true iff session_type in {PRACTICE, GAME, CONDITIONING} AND duration_minutes >= EXPOSURE_MIN_MINUTES (10)" }
      - { name: ingested_by_user_id, type: string, source: system, description: "X-User-ID of PerformanceStaff uploader" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: payer_name, type: string, source: input, description: "Insurer name" }
      - { name: policy_number, type: string, source: input, description: "Unique per athlete among non-CANCELLED policies" }
      - { name: deductible_cents, type: integer, source: input, description: "Annual deductible, >= 0" }
      - { name: deductible_met_cents, type: integer, source: system, default: 0, description: "Accumulates deductible_applied_cents across adjudicated claims" }
      - { name: coinsurance_pct, type: integer, source: input, description: "0..100 — payer share after deductible" }
      - { name: oop_max_cents, type: integer, source: input, description: "Annual out-of-pocket maximum; must be >= deductible_cents" }
      - { name: oop_accrued_cents, type: integer, source: system, default: 0, description: "Patient responsibility accrued across adjudicated claims" }
      - { name: policy_year_start, type: datetime, source: input, description: "Policy year window start (inclusive)" }
      - { name: policy_year_end, type: datetime, source: input, description: "Policy year window end (inclusive); > policy_year_start" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | CANCELLED — EXHAUSTED auto-set when oop_accrued_cents >= oop_max_cents after adjudication" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: injury_case_id, type: string, source: input, description: "FK -> InjuryCase.id" }
      - { name: athlete_id, type: string, source: system, description: "FK -> Athlete.id; denormalized from case" }
      - { name: insurance_policy_id, type: string, source: input, description: "FK -> InsurancePolicy.id; must belong to same athlete" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Total billed, > 0" }
      - { name: line_items, type: array, source: input, description: "[{cpt_code: string, charge_cents: integer > 0, service_date: ISO date}] — 1..50 items; sum must equal billed_amount_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> ADJUDICATED -> {PAID | DENIED}; DENIED -> APPEALED -> ADJUDICATED appeal cycle (<= 3 appeals); DRAFT -> VOID" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp at SUBMITTED; null while DRAFT" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical-clock timestamp of latest adjudication; null until first adjudication" }
      - { name: payer_paid_cents, type: integer, source: computed, description: "Per claim_adjudication; null until adjudicated" }
      - { name: patient_resp_cents, type: integer, source: computed, description: "Per claim_adjudication; null until adjudicated" }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "Portion credited to policy deductible; null until adjudicated" }
      - { name: appeals_count, type: integer, source: system, default: 0, description: "Increments on each DENIED -> APPEALED" }
      - { name: supersedes_claim_id, type: string, source: input, description: "FK -> Claim.id; nullable — corrected claim references a VOID claim of the same injury case" }

  - name: DisclosureGrant
    parent: null
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: grantee_role, type: enum, source: input, description: "COACHING | FRONT_OFFICE — which staff class may see the scoped fields" }
      - { name: scope, type: enum, source: input, description: "TIER_ONLY | GENERAL | FULL — TIER_ONLY exposes availability_tier only; GENERAL adds designation + body_region; FULL adds diagnosis detail + notes" }
      - { name: effective_from, type: datetime, source: input, description: "Grant window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Grant window end (inclusive); > effective_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED | EXPIRED — EXPIRED applied lazily on read when current_utc > effective_to" }

  - name: AvailabilityReport
    parent: null
    common_fields: false   # snapshot artifact
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: report_date, type: datetime, source: system, description: "Logical-clock date the snapshot was generated" }
      - { name: generated_by_user_id, type: string, source: system, description: "X-User-ID of requester" }
      - { name: generated_for_role, type: enum, source: system, description: "COACHING | FRONT_OFFICE | MEDICAL — audience; determines redaction per confidentiality_redaction_filter" }
      - { name: rows, type: array, source: computed, description: "[{athlete_id, availability_tier, designation?, body_region?, diagnosis_detail?}] — field presence per grant scope and Team.hipaa_mode; rows sorted by availability_tier severity rank (OUT > LIMITED > MODIFIED > FULL), then position ASC, then athlete created_at ASC" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InjuryCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REHAB
        trigger: "POST /sports-med/injury-cases/{caseId}/start-rehab"
        actor: MedicalStaff
        preconditions:
          - "Case status == OPEN (ERR_CASE_NOT_OPEN)"
          - "At least one DailyStatusEntry with is_current == true exists for the case (ERR_NO_STATUS_ENTRY)"
        side_effects:
          - "Recompute Athlete.availability_tier; increments Athlete.version by 1"
      - from: REHAB
        to: RTP
        trigger: "POST /sports-med/rtp-protocols (protocol creation auto-advances the case)"
        actor: MedicalStaff
        preconditions:
          - "Case status == REHAB (ERR_CASE_NOT_IN_REHAB)"
          - "No existing RTPProtocol for this case (ERR_RTP_ALREADY_EXISTS)"
          - "At least one TreatmentPlan with status == ACTIVE for the case (ERR_NO_ACTIVE_TREATMENT_PLAN)"
        side_effects:
          - "RTPProtocol created: status NOT_STARTED, current_stage_index 0, current_stage_entered_on = current_utc date"
      - from: RTP
        to: REHAB
        trigger: "system (automatic when RTPProtocol transitions to REGRESSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute Athlete.availability_tier; increments Athlete.version by 1"
      - from: RTP
        to: CLEARED
        trigger: "system (automatic when a ClearanceAuthorization on the case's protocol transitions to GRANTED)"
        actor: system
        preconditions: []
        side_effects:
          - "cleared_on = current_utc date"
          - "Recompute Athlete.availability_tier; increments Athlete.version by 1"
      - from: CLEARED
        to: CLOSED
        trigger: "POST /sports-med/injury-cases/{caseId}/close"
        actor: MedicalStaff
        preconditions:
          - "Case status == CLEARED (ERR_CASE_NOT_CLEARED)"
          - "No TreatmentPlan with status in {ACTIVE, SUSPENDED} for the case (ERR_PLAN_STILL_ACTIVE)"
          - "No Claim with status in {DRAFT, SUBMITTED, APPEALED} for the case (ERR_CLAIMS_OPEN)"
        side_effects:
          - "closed_on = current_utc date"
          - "days_lost = closed_on - occurred_on (whole days)"
          - "Recompute Athlete.availability_tier; increments Athlete.version by 1"
      - from: REHAB
        to: LONG_TERM
        trigger: "POST /sports-med/injury-cases/{caseId}/mark-long-term"
        actor: MedicalStaff
        preconditions:
          - "Case status == REHAB (ERR_CASE_NOT_IN_REHAB)"
          - "Latest is_current DailyStatusEntry designation == OUT (ERR_DESIGNATION_NOT_OUT)"
        side_effects:
          - "Recompute Athlete.availability_tier; increments Athlete.version by 1"
      - from: LONG_TERM
        to: REHAB
        trigger: "POST /sports-med/injury-cases/{caseId}/resume-rehab"
        actor: MedicalStaff
        preconditions:
          - "Case status == LONG_TERM (ERR_CASE_NOT_LONG_TERM)"
        side_effects:
          - "Recompute Athlete.availability_tier; increments Athlete.version by 1"

  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /sports-med/treatment-plans/{planId}/activate"
        actor: MedicalStaff
        preconditions:
          - "Plan status == DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "Parent InjuryCase status in {OPEN, REHAB, LONG_TERM, RTP} (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sports-med/treatment-plans/{planId}/suspend"
        actor: MedicalStaff
        preconditions:
          - "Plan status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "suspension_reason = request body reason"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sports-med/treatment-plans/{planId}/resume"
        actor: MedicalStaff
        preconditions:
          - "Plan status == SUSPENDED (ERR_PLAN_NOT_SUSPENDED)"
        side_effects:
          - "suspension_reason cleared"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /sports-med/treatment-plans/{planId}/complete"
        actor: MedicalStaff
        preconditions:
          - "Plan status in {ACTIVE, SUSPENDED} (ERR_PLAN_NOT_COMPLETABLE)"
        side_effects: []
      - from: SUSPENDED
        to: COMPLETED
        trigger: "POST /sports-med/treatment-plans/{planId}/complete"
        actor: MedicalStaff
        preconditions:
          - "Plan status in {ACTIVE, SUSPENDED} (ERR_PLAN_NOT_COMPLETABLE)"
        side_effects: []

  - entity: RTPProtocol
    initial_state: NOT_STARTED
    terminal_states: [CLEARED]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /sports-med/rtp-protocols/{protocolId}/advances (first advance)"
        actor: MedicalStaff
        preconditions:
          - "Protocol status in {NOT_STARTED, IN_PROGRESS, REGRESSED} (ERR_PROTOCOL_NOT_ADVANCEABLE)"
          - "Readiness gate passes per calculation rtp_stage_readiness (ERR_READINESS_NOT_MET; concussion floor breach yields ERR_CONCUSSION_MIN_DAYS)"
        side_effects:
          - "current_stage_index += 1; current_stage_entered_on = current_utc date; increments RTPProtocol.version by 1"
          - "RTPStageAdvance appended (kind ADVANCE, readiness_snapshot captured)"
          - "If new current_stage_index == total_stages - 1: status -> AWAITING_CLEARANCE instead of IN_PROGRESS"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /sports-med/rtp-protocols/{protocolId}/advances (non-final stage advance)"
        actor: MedicalStaff
        preconditions:
          - "Same as NOT_STARTED -> IN_PROGRESS"
        side_effects:
          - "Same as NOT_STARTED -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: AWAITING_CLEARANCE
        trigger: "system (automatic when an advance reaches final stage index total_stages - 1)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REGRESSED
        to: IN_PROGRESS
        trigger: "POST /sports-med/rtp-protocols/{protocolId}/advances (advance after regression)"
        actor: MedicalStaff
        preconditions:
          - "Same as NOT_STARTED -> IN_PROGRESS"
        side_effects:
          - "Same as NOT_STARTED -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: REGRESSED
        trigger: "POST /sports-med/rtp-protocols/{protocolId}/regress"
        actor: MedicalStaff
        preconditions:
          - "Protocol status in {IN_PROGRESS, AWAITING_CLEARANCE} (ERR_PROTOCOL_NOT_REGRESSABLE)"
          - "current_stage_index > 0 (ERR_CANNOT_REGRESS_BELOW_ZERO)"
        side_effects:
          - "current_stage_index -= 1; current_stage_entered_on = current_utc date; regression_count += 1; increments RTPProtocol.version by 1"
          - "RTPStageAdvance appended (kind REGRESSION, readiness_snapshot null)"
          - "Parent InjuryCase RTP -> REHAB"
          - "Any PENDING ClearanceAuthorization on this protocol -> EXPIRED"
          - "Recompute Athlete.availability_tier; increments Athlete.version by 1"
      - from: AWAITING_CLEARANCE
        to: REGRESSED
        trigger: "POST /sports-med/rtp-protocols/{protocolId}/regress"
        actor: MedicalStaff
        preconditions:
          - "Same as IN_PROGRESS -> REGRESSED"
        side_effects:
          - "Same as IN_PROGRESS -> REGRESSED"
      - from: AWAITING_CLEARANCE
        to: CLEARED
        trigger: "system (automatic when ClearanceAuthorization -> GRANTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent InjuryCase RTP -> CLEARED"
          - "Recompute Athlete.availability_tier; increments Athlete.version by 1"
      - from: IN_PROGRESS
        to: SUSPENDED_CONCUSSION
        trigger: "system (automatic on DailyStatusEntry creation when case.is_concussion_snapshot == true and the new latest is_current entry has symptom_free == false)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED_CONCUSSION
        to: IN_PROGRESS
        trigger: "system (automatic on DailyStatusEntry creation when the new latest is_current entry has symptom_free == true)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClearanceAuthorization
    initial_state: PENDING
    terminal_states: [GRANTED, EXPIRED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /sports-med/clearances/{clearanceId}/decide with decision=GRANTED"
        actor: TeamPhysician
        preconditions:
          - "Clearance status == PENDING (ERR_CLEARANCE_NOT_PENDING)"
          - "Protocol status == AWAITING_CLEARANCE (ERR_PROTOCOL_NOT_AWAITING_CLEARANCE)"
          - "decided_by (X-User-ID) != requested_by_user_id (ERR_SOD_SELF_CLEARANCE)"
          - "decided_by != recorded_by_user_id of the latest is_current DailyStatusEntry on the case (ERR_SOD_EVALUATOR_CLEARANCE)"
          - "Evaluation freshness: (current_utc - latest is_current DailyStatusEntry.created_at) <= CLEARANCE_EVAL_MAX_AGE_HOURS hours (ERR_STALE_EVALUATION)"
        side_effects:
          - "decision = GRANTED; decided_by_user_id = X-User-ID; decided_at = current_utc; expires_at = decided_at + CLEARANCE_TTL_HOURS (72h)"
          - "RTPProtocol AWAITING_CLEARANCE -> CLEARED; InjuryCase RTP -> CLEARED (cleared_on set); availability_tier recompute; Athlete.version +1"
      - from: PENDING
        to: RETURNED_FOR_REVIEW
        trigger: "POST /sports-med/clearances/{clearanceId}/decide with decision=RETURNED_FOR_REVIEW"
        actor: TeamPhysician
        preconditions:
          - "Clearance status == PENDING (ERR_CLEARANCE_NOT_PENDING)"
          - "decided_by != requested_by_user_id (ERR_SOD_SELF_CLEARANCE)"
        side_effects:
          - "decision = RETURNED_FOR_REVIEW; decided_by_user_id = X-User-ID; decided_at = current_utc"
      - from: RETURNED_FOR_REVIEW
        to: EXPIRED
        trigger: "system (automatic when a replacement clearance request is created for the same protocol — re-request)"
        actor: system
        preconditions:
          - "Replacement request precondition: a DailyStatusEntry with entry_date == current_utc date and is_current == true exists on the case (ERR_NO_FRESH_STATUS_ENTRY)"
        side_effects:
          - "New ClearanceAuthorization row created in PENDING; increments RTPProtocol.version by 1"
      - from: PENDING
        to: EXPIRED
        trigger: "system (automatic when parent RTPProtocol regresses)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sports-med/claims/{claimId}/submit"
        actor: BillingStaff
        preconditions:
          - "Claim status == DRAFT (ERR_CLAIM_NOT_DRAFT)"
          - "Referenced InsurancePolicy status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "Every line_items[].service_date within [policy_year_start, policy_year_end] inclusive (ERR_SERVICE_DATE_OUT_OF_POLICY_YEAR)"
          - "sum(line_items.charge_cents) == billed_amount_cents (ERR_LINE_ITEM_SUM_MISMATCH)"
          - "OCC: expected_policy_version matches InsurancePolicy.version (ERR_STALE_VERSION, priority 3.5)"
        side_effects:
          - "submitted_at = current_utc; increments InsurancePolicy.version by 1"
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /sports-med/claims/{claimId}/adjudicate"
        actor: BillingStaff
        preconditions:
          - "Claim status in {SUBMITTED, APPEALED} (ERR_CLAIM_NOT_SUBMITTABLE_STATE)"
        side_effects:
          - "Run claim_adjudication -> payer_paid_cents, patient_resp_cents, deductible_applied_cents; adjudicated_at = current_utc"
          - "On non-denial: InsurancePolicy.deductible_met_cents += deductible_applied_cents; oop_accrued_cents += patient_resp_cents; policy.version +1"
          - "If oop_accrued_cents >= oop_max_cents after update: policy status ACTIVE -> EXHAUSTED"
          - "Immediate re-transition ADJUDICATED -> PAID (deny absent/false) or ADJUDICATED -> DENIED (deny=true)"
      - from: ADJUDICATED
        to: PAID
        trigger: "system (automatic at adjudication when deny is absent/false)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ADJUDICATED
        to: DENIED
        trigger: "system (automatic at adjudication when deny=true)"
        actor: system
        preconditions: []
        side_effects:
          - "Denial: payer_paid_cents = 0, patient_resp_cents = 0, deductible_applied_cents = 0; policy accumulators unchanged"
      - from: DENIED
        to: APPEALED
        trigger: "POST /sports-med/claims/{claimId}/appeal"
        actor: BillingStaff
        preconditions:
          - "Claim status == DENIED (ERR_CLAIM_NOT_DENIED)"
          - "appeals_count < MAX_APPEALS (3) (ERR_MAX_APPEALS_REACHED)"
        side_effects:
          - "appeals_count += 1"
      - from: APPEALED
        to: ADJUDICATED
        trigger: "POST /sports-med/claims/{claimId}/adjudicate (re-adjudication after appeal)"
        actor: BillingStaff
        preconditions:
          - "Claim status in {SUBMITTED, APPEALED} (ERR_CLAIM_NOT_SUBMITTABLE_STATE)"
        side_effects:
          - "Re-run claim_adjudication against CURRENT policy accumulators (readjudication_after_appeal variant)"
          - "Policy accumulator update identical to SUBMITTED -> ADJUDICATED"
      - from: DRAFT
        to: VOID
        trigger: "POST /sports-med/claims/{claimId}/void"
        actor: BillingStaff
        preconditions:
          - "Claim status == DRAFT (ERR_CLAIM_NOT_VOIDABLE)"
        side_effects: []

  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when oop_accrued_cents >= oop_max_cents after a claim adjudication)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /sports-med/insurance-policies/{policyId}/cancel"
        actor: BillingStaff
        preconditions:
          - "Policy status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "No Claim referencing this policy with status in {SUBMITTED, APPEALED} (ERR_POLICY_CLAIMS_IN_FLIGHT)"
        side_effects: []

  - entity: DisclosureGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /sports-med/disclosure-grants/{grantId}/revoke"
        actor: MedicalStaff
        preconditions:
          - "Grant status == ACTIVE (ERR_GRANT_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: applied on any grant evaluation path when current_utc > effective_to)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Athlete
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /sports-med/athletes/{athleteId}/deactivate"
        actor: TeamAdmin
        preconditions:
          - "Athlete roster_status == ACTIVE (ERR_ATHLETE_NOT_ACTIVE)"
        side_effects: []
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /sports-med/athletes/{athleteId}/reactivate"
        actor: TeamAdmin
        preconditions:
          - "Athlete roster_status == INACTIVE (ERR_ATHLETE_NOT_INACTIVE)"
        side_effects:
          - "Recompute Athlete.availability_tier"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /sports-med/athletes/{athleteId}/release"
        actor: TeamAdmin
        preconditions:
          - "Athlete roster_status == ACTIVE (ERR_ATHLETE_NOT_ACTIVE)"
          - "No InjuryCase with status in {OPEN, REHAB, RTP, LONG_TERM} for the athlete (ERR_OPEN_CASES_EXIST)"
        side_effects:
          - "All ACTIVE DisclosureGrants for athlete -> REVOKED (cascade)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only — all true create-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: clearance-request-stale-protocol
    parent_entity: RTPProtocol
    write_endpoint: "POST /sports-med/rtp-protocols/{protocolId}/clearances"
    occ_field: expected_protocol_version
    description: |
      Requesting a ClearanceAuthorization against an RTPProtocol whose version
      has advanced since the client last observed it is rejected. A prior
      clearance request, advance, or regression has since mutated the protocol,
      so the requester's view of the protocol state (and of which clearance row
      is superseded) is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rtp-advance-stale-protocol
    parent_entity: RTPProtocol
    write_endpoint: "POST /sports-med/rtp-protocols/{protocolId}/advances"
    occ_field: expected_protocol_version
    description: |
      Advancing an RTPProtocol whose version has advanced since the client last
      observed it is rejected. The readiness gate must be evaluated against the
      current stage index and entry date; a prior advance, regression, or
      clearance request has since changed those fields, invalidating the
      caller's snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-submit-stale-policy
    parent_entity: InsurancePolicy
    write_endpoint: "POST /sports-med/claims/{claimId}/submit"
    occ_field: expected_policy_version
    description: |
      Submitting a Claim against an InsurancePolicy whose version has advanced
      since the client last observed it is rejected. Policy accumulator fields
      (deductible_met_cents, oop_accrued_cents) or status may have been mutated
      by another claim's submission or adjudication, changing the
      adjudication-relevant context the submitter relied upon.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: availability_tier_derivation
    trigger: "Any mutation to InjuryCase status, DailyStatusEntry creation/supersede, ClearanceAuthorization GRANTED, RTP regression, athlete reactivate, WorkloadSession ingest (via load overlay)"
    algorithm: aggregation
    formula: |
      # Derived per Athlete; recomputed eagerly on every triggering mutation.
      # Step 1: candidate cases = InjuryCase of athlete with
      #   status IN {OPEN, REHAB, RTP, LONG_TERM}  (CLEARED, CLOSED excluded).
      # Step 2: per candidate case, effective designation =
      #   - if an is_current DailyStatusEntry exists with entry_date == current_utc date: its designation
      #   - elif any is_current entries exist: designation of the one with max entry_date
      #     (per (case, entry_date) the supersede chain guarantees exactly one is_current)
      #   - else: OUT (conservative default for an entry-less case)
      # Step 3: case tier contribution = designation, EXCEPT:
      #   - status == OPEN forces at least LIMITED (OPEN can never report FULL)
      #   - status == LONG_TERM forces OUT regardless of designation
      #   - status == RTP whose protocol.status == AWAITING_CLEARANCE forces at most LIMITED
      # Step 4: athlete tier = worst (most restrictive) contribution across cases;
      #   severity order OUT > LIMITED > MODIFIED > FULL; empty candidate set => FULL.
      # Step 5: load overlay — if load_flag == SPIKE and derived tier == FULL,
      #   downgrade to MODIFIED (SPIKE never modifies LIMITED/OUT).
    input_set: "InjuryCase (status filter above) x latest is_current DailyStatusEntry per case; Athlete.load_flag"
    constants:
      TIER_ORDER: "OUT > LIMITED > MODIFIED > FULL"
    precision: "enum result; deterministic total order"

  - name: acute_chronic_workload_ratio
    trigger: "WorkloadSession ingest for the athlete"
    algorithm: aggregation
    formula: |
      # Qualifying sessions: session_type != REHAB_SESSION (all four windows).
      # ROLLING (base):
      #   acute_load   = sum(session_load where session_date in [today-6, today])
      #   chronic_load = sum(session_load where session_date in [today-27, today]) / 4
      #   ACWR = acute_load / chronic_load; null when chronic_load == 0
      #   Gate: null when fewer than ACWR_MIN_SESSIONS qualifying sessions exist
      #   in [today-27, today]. today = current_utc date.
    constants:
      ACUTE_WINDOW_DAYS: 7        # [today-6, today] inclusive
      CHRONIC_WINDOW_DAYS: 28     # [today-27, today] inclusive
      CHRONIC_DIVISOR: 4
      ACWR_MIN_SESSIONS: 8
      EWMA_LAMBDA: 0.2
    precision: "3 decimal places, round_half_up"
    variants:
      - name: ROLLING
        when: "Team.acwr_variant == ROLLING (default)"
        difference: "Simple averages over fixed windows, as above."
      - name: EWMA
        when: "Team.acwr_variant == EWMA"
        difference: |
          daily_load[d] = sum(session_load of qualifying sessions on date d).
          acute  = sum over d in [today-6, today]  of L^(today-d) * daily_load[d] / sum of L^(today-d)
          chronic = sum over d in [today-27, today] of L^(today-d) * daily_load[d] / sum of L^(today-d)
          with L = 1 - EWMA_LAMBDA = 0.8; missing days contribute daily_load 0.
          ACWR = acute / chronic; same null-when-chronic==0 rule and same
          ACWR_MIN_SESSIONS gate. Yields different values than ROLLING whenever
          loads are not uniformly distributed across the window.

  - name: load_flag_threshold
    trigger: "After acute_chronic_workload_ratio recompute"
    algorithm: threshold
    formula: |
      if acute_chronic_workload_ratio is null: load_flag = NONE
      elif acute_chronic_workload_ratio >= SPIKE_THRESHOLD: load_flag = SPIKE
      elif acute_chronic_workload_ratio >= ELEVATED_THRESHOLD: load_flag = ELEVATED
      else: load_flag = NONE
      # Boundary: >= inclusive at both thresholds; comparison uses the
      # 3-decimal rounded ratio (1.500 exactly => SPIKE; 1.499 => ELEVATED).
    constants:
      ELEVATED_THRESHOLD: 1.300
      SPIKE_THRESHOLD: 1.500
    precision: "comparison against 3-decimal rounded ratio"

  - name: rtp_stage_readiness
    trigger: "POST /sports-med/rtp-protocols/{protocolId}/advances (gate evaluation before any mutation)"
    algorithm: threshold
    formula: |
      # Pinned evaluation order (later steps see earlier results; no cycle):
      # 1. days_in_stage = current_utc date - current_stage_entered_on (whole days)
      # 2. min_days_for_stage = BASE_MIN_DAYS_PER_STAGE
      #      + (case.severity_class_snapshot == SEVERE ? SEVERE_EXTRA_DAYS : 0)
      #      + (case.is_concussion_snapshot ? CONCUSSION_EXTRA_DAYS : 0)
      # 3. regression_in_window = true iff any RTPStageAdvance on this protocol
      #    with kind == REGRESSION has created_at date within
      #    REGRESSION_LOOKBACK_DAYS days before current_utc date (inclusive)
      # 4. latest_entry = is_current DailyStatusEntry with max entry_date for the case
      # 5. READY iff ALL:
      #      days_in_stage >= min_days_for_stage
      #      AND latest_entry exists AND latest_entry.symptom_free == true
      #      AND latest_entry.functional_test_score >= FUNCTIONAL_SCORE_MIN
      #      AND regression_in_window == false
      #      AND latest_entry.entry_date >= current_stage_entered_on
      # 6. Concussion hard floor (independent of step 2 — BOTH must hold):
      #      if case.is_concussion_snapshot: days_in_stage >= MIN_CONCUSSION_DAYS_PER_STAGE
      # Failure mapping (deterministic priority): the concussion hard floor is
      # evaluated FIRST — if case.is_concussion_snapshot AND
      # days_in_stage < MIN_CONCUSSION_DAYS_PER_STAGE => ERR_CONCUSSION_MIN_DAYS.
      # Otherwise any failed conjunct in step 5 => ERR_READINESS_NOT_MET.
    constants:
      BASE_MIN_DAYS_PER_STAGE: 2
      SEVERE_EXTRA_DAYS: 2
      CONCUSSION_EXTRA_DAYS: 1
      MIN_CONCUSSION_DAYS_PER_STAGE: 3
      FUNCTIONAL_SCORE_MIN: 80
      REGRESSION_LOOKBACK_DAYS: 14
    precision: "whole-day arithmetic on ISO dates; >= inclusive"

  - name: claim_adjudication
    trigger: "Claim transitions into ADJUDICATED (from SUBMITTED or APPEALED)"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order (rounding order is normative; do NOT reorder):
      #  1. allowed_cents = billed_amount_cents (no UCR reduction in v1)
      #  2. remaining_deductible = max(0, deductible_cents - deductible_met_cents)
      #  3. deductible_applied_cents = min(allowed_cents, remaining_deductible)
      #  4. after_deductible = allowed_cents - deductible_applied_cents
      #  5. patient_coins_cents = round_half_up(after_deductible * (100 - coinsurance_pct) / 100)
      #     -- rounding applied PER CLAIM at this step (never per line item), 0 dp
      #  6. patient_resp_pre_cap = deductible_applied_cents + patient_coins_cents
      #  7. remaining_oop = max(0, oop_max_cents - oop_accrued_cents)
      #  8. patient_resp_cents = min(patient_resp_pre_cap, remaining_oop)
      #  9. payer_paid_cents = allowed_cents - patient_resp_cents
      # 10. credited deductible = min(deductible_applied_cents, patient_resp_cents)
      #     (patient cannot accrue deductible beyond what they owe after OOP cap)
      # Denial (deny=true): payer_paid = patient_resp = deductible_applied = 0;
      # policy accumulators unchanged.
    input_set: "Claim.billed_amount_cents; InsurancePolicy accumulators at adjudication time"
    precision: "integer cents; round_half_up at step 5 only"
    variants:
      - name: initial_adjudication
        when: "SUBMITTED -> ADJUDICATED"
        difference: "Uses policy accumulators as they stand at first adjudication."
      - name: readjudication_after_appeal
        when: "APPEALED -> ADJUDICATED"
        difference: |
          Uses CURRENT policy accumulators, which may have been advanced by
          other claims adjudicated between denial and appeal; identical billed
          amounts can therefore split differently than at initial adjudication.

  - name: injury_rate_trend
    trigger: "GET /sports-med/teams/{teamId}/analytics/injury-rates"
    algorithm: aggregation
    formula: |
      # Per group (position x surface) over [from_date, to_date] inclusive:
      #   exposures = count of WorkloadSession with counts_as_exposure == true,
      #     session_date in [from_date, to_date], athlete.position == group.position,
      #     session.surface == group.surface, session_date >= athlete.enrollment_date
      #   injuries = count of InjuryCase with occurred_on in [from_date, to_date],
      #     athlete.position == group.position, case.surface == group.surface,
      #     NOT (case.status == CLOSED AND case.closed_on < from_date)
      #   rate_per_1000 = round_half_up(injuries * 1000 / exposures, 2)
      # Groups: cartesian of positions present on athletes with
      #   roster_status != RELEASED x all Surface enum values; groups with
      #   exposures == 0 are omitted from the response (never emitted as 0).
    input_set: "WorkloadSession + InjuryCase joined via Athlete (position); team scope"
    constants:
      RATE_MULTIPLIER: 1000
      EXPOSURE_MIN_MINUTES: 10
    precision: "2 decimal places, round_half_up"

  - name: confidentiality_redaction_filter
    trigger: "POST /sports-med/availability-reports (generation); GET /sports-med/availability-reports/{reportId} (re-evaluated on read against current grants and clock)"
    algorithm: constraint_propagation
    formula: |
      # Per athlete row, field visibility = f(audience, grant, team mode).
      #   audience == MEDICAL: all fields always.
      #   audience in {COACHING, FRONT_OFFICE}:
      #     base = availability_tier (always visible)
      #     Grant selection: among DisclosureGrant of the athlete with
      #       grantee_role == audience, status == ACTIVE (after lazy EXPIRED
      #       re-evaluation), and current_utc within [effective_from, effective_to]
      #       inclusive: pick max scope rank (FULL > GENERAL > TIER_ONLY);
      #       ties broken by created_at ASC (earliest created wins).
      #     scope GENERAL or FULL => + designation, + body_region
      #     scope FULL => + diagnosis_detail
      #     Team.hipaa_mode == STRICT override (applied LAST):
      #       diagnosis_detail never exposed to non-MEDICAL audiences;
      #       scope GENERAL downgraded to TIER_ONLY (designation/body_region suppressed).
      # Evaluation order pinned: lazy EXPIRED -> window check -> scope rank
      # selection -> tie-break -> STRICT downgrade.
    input_set: "DisclosureGrant (athlete, grantee_role, status, window), Team.hipaa_mode"
    constants:
      SCOPE_RANK: "FULL > GENERAL > TIER_ONLY"
    precision: "deterministic field-masking"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role in declared role set"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resources exist; body FK references exist and belong to the same team scope as the path/parent resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3.5
    category: state
    check: "OCC: expected_*_version (where required by a concurrency rule) matches the parent's current version — evaluated after existence, before business rules"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sports-med/rtp-protocols/{id}/clearances, POST /sports-med/rtp-protocols/{id}/advances, POST /sports-med/claims/{id}/submit"

  - priority: 4
    category: state
    check: "Target resource in a legal from-state for the requested transition (generic)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: clearance decider != clearance requester (ERR_SOD_SELF_CLEARANCE) and != recorder of latest is_current DailyStatusEntry (ERR_SOD_EVALUATOR_CLEARANCE)"
    error_id: ERR_SOD_SELF_CLEARANCE
    http_status: 403
    applies_to: "POST /sports-med/clearances/{id}/decide"

  - priority: 6
    category: business_safety
    check: "Evaluation freshness for GRANTED: latest is_current DailyStatusEntry created_at within CLEARANCE_EVAL_MAX_AGE_HOURS (72h) of current_utc"
    error_id: ERR_STALE_EVALUATION
    http_status: 409
    applies_to: "POST /sports-med/clearances/{id}/decide (decision=GRANTED)"

  - priority: 7
    category: business_safety
    check: "RTP readiness gate per rtp_stage_readiness; concussion floor breach maps to ERR_CONCUSSION_MIN_DAYS, all other failures to ERR_READINESS_NOT_MET"
    error_id: ERR_READINESS_NOT_MET
    http_status: 409
    applies_to: "POST /sports-med/rtp-protocols/{id}/advances"

  - priority: 8
    category: business_temporal
    check: "Clearance re-request (prior row RETURNED_FOR_REVIEW) requires a DailyStatusEntry with entry_date == current_utc date and is_current == true"
    error_id: ERR_NO_FRESH_STATUS_ENTRY
    http_status: 409
    applies_to: "POST /sports-med/rtp-protocols/{id}/clearances (re-request path)"

  - priority: 9
    category: business_referential
    check: "Aggregate preconditions: RTP creation requires ACTIVE TreatmentPlan (ERR_NO_ACTIVE_TREATMENT_PLAN); close requires no ACTIVE/SUSPENDED plan (ERR_PLAN_STILL_ACTIVE) and no DRAFT/SUBMITTED/APPEALED claim (ERR_CLAIMS_OPEN); release requires no non-terminal case (ERR_OPEN_CASES_EXIST)"
    error_id: ERR_NO_ACTIVE_TREATMENT_PLAN
    http_status: 409
    applies_to: "POST /sports-med/rtp-protocols, POST /sports-med/injury-cases/{id}/close, POST /sports-med/athletes/{id}/release"

  - priority: 10
    category: business_constraint
    check: "Field-level constraints: enum membership; date ordering (season_end > season_start, policy_year_end > policy_year_start, effective_to > effective_from); ranges (rpe 0..10, functional_test_score 0..100, planned_sessions_per_week 1..14, estimated_duration_weeks 1..52, total_stages 3..7, duration_minutes 0..600, line_items 1..50, coinsurance_pct 0..100, billed_amount_cents > 0, oop_max_cents >= deductible_cents)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 10.5
    category: business_constraint
    check: "Availability report audience must be one of COACHING | FRONT_OFFICE | MEDICAL"
    error_id: ERR_AUDIENCE_INVALID
    http_status: 400
    applies_to: "POST /sports-med/availability-reports"

  - priority: 11
    category: business_constraint
    check: "Claim integrity: sum(line_items.charge_cents) == billed_amount_cents"
    error_id: ERR_LINE_ITEM_SUM_MISMATCH
    http_status: 422
    applies_to: "POST /sports-med/claims/{id}/submit"

  - priority: 12
    category: business_temporal
    check: "Claim service dates within policy year window (inclusive both ends)"
    error_id: ERR_SERVICE_DATE_OUT_OF_POLICY_YEAR
    http_status: 422
    applies_to: "POST /sports-med/claims/{id}/submit"

  - priority: 13
    category: business_referential
    check: "Supersede references valid: DailyStatusEntry.supersedes_entry_id points to an is_current entry of the same (injury_case_id, entry_date); Claim.supersedes_claim_id points to a VOID claim of the same injury case"
    error_id: ERR_INVALID_SUPERSEDE_TARGET
    http_status: 422
    applies_to: "POST /sports-med/daily-status-entries, POST /sports-med/claims"

  - priority: 14
    category: business_temporal
    check: "No future dates: WorkloadSession.session_date, DailyStatusEntry.entry_date, InjuryCase.occurred_on must be <= current_utc date"
    error_id: ERR_FUTURE_DATE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /sports-med/workload-sessions, POST /sports-med/daily-status-entries, POST /sports-med/injury-cases"

  - priority: 15
    category: business_fiscal
    check: "Policy usable for submission: status == ACTIVE"
    error_id: ERR_POLICY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sports-med/claims/{id}/submit"

  - priority: 16
    category: business_constraint
    check: "Appeal budget: appeals_count < MAX_APPEALS (3)"
    error_id: ERR_MAX_APPEALS_REACHED
    http_status: 409
    applies_to: "POST /sports-med/claims/{id}/appeal"

  - priority: 17
    category: business_referential
    check: "Uniqueness: (athlete_id, policy_number) unique among non-CANCELLED policies (ERR_DUPLICATE_POLICY_NUMBER); at most one RTPProtocol per InjuryCase (ERR_RTP_ALREADY_EXISTS); at most one PENDING ClearanceAuthorization per protocol (ERR_CLEARANCE_ALREADY_PENDING); DiagnosisCode.code unique (ERR_INVALID_REQUEST)"
    error_id: ERR_DUPLICATE_POLICY_NUMBER
    http_status: 409
    applies_to: "POST /sports-med/insurance-policies, POST /sports-med/rtp-protocols, POST /sports-med/rtp-protocols/{id}/clearances, POST /sports-med/diagnosis-codes"

# =============================================================================
# 1.5 API Endpoint Table (flat collections; FK in body/query)
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/sports-med/_clock/set_current_utc"
    description: "Set the logical clock for all teams. Startup default (before any set) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [TeamAdmin]
    code: 200
    input: [to_iso8601]
    output: Team
    side_effects: ["Every Team.current_utc = to_iso8601; lazy EXPIRED transitions re-evaluated on next read"]

  # --- Teams ---
  - method: POST
    path: "/sports-med/teams"
    description: "Create a team"
    roles: [TeamAdmin]
    code: 201
    input: [name, sport, season_start_date, season_end_date, "hipaa_mode?", "acwr_variant?"]
    output: Team
    side_effects: ["current_utc initialized to 2026-08-01T00:00:00Z"]

  - method: GET
    path: "/sports-med/teams"
    description: "List teams"
    roles: [TeamAdmin, MedicalStaff, TeamPhysician, PerformanceStaff, BillingStaff, CoachingStaff]
    code: 200
    input: []
    output: "Team[]"
    side_effects: []

  - method: GET
    path: "/sports-med/teams/{teamId}"
    description: "Get a team"
    roles: [TeamAdmin, MedicalStaff, TeamPhysician, PerformanceStaff, BillingStaff, CoachingStaff]
    code: 200
    input: []
    output: Team
    side_effects: []

  # --- Diagnosis codes ---
  - method: POST
    path: "/sports-med/diagnosis-codes"
    description: "Register a diagnosis code (shared configuration)"
    roles: [TeamAdmin]
    code: 201
    input: [code, body_region, severity_class, is_concussion]
    output: DiagnosisCode
    side_effects: []

  - method: GET
    path: "/sports-med/diagnosis-codes"
    description: "List diagnosis codes"
    roles: [TeamAdmin, MedicalStaff, TeamPhysician]
    code: 200
    input: []
    output: "DiagnosisCode[]"
    side_effects: []

  - method: GET
    path: "/sports-med/diagnosis-codes/{codeId}"
    description: "Get a diagnosis code"
    roles: [TeamAdmin, MedicalStaff, TeamPhysician]
    code: 200
    input: []
    output: DiagnosisCode
    side_effects: []

  # --- Athletes ---
  - method: POST
    path: "/sports-med/athletes"
    description: "Enroll an athlete"
    roles: [TeamAdmin]
    code: 201
    input: [team_id, full_name, position, enrollment_date]
    output: Athlete
    side_effects: ["roster_status = ACTIVE; availability_tier = FULL; load_flag = NONE; acute_chronic_workload_ratio = null"]

  - method: GET
    path: "/sports-med/athletes"
    description: "List athletes (filterable)"
    roles: [TeamAdmin, MedicalStaff, TeamPhysician, PerformanceStaff, BillingStaff, CoachingStaff]
    code: 200
    input: ["team_id?", "roster_status?", "position?"]
    output: "Athlete[]"
    side_effects: []

  - method: GET
    path: "/sports-med/athletes/{athleteId}"
    description: "Get an athlete. MedicalStaff/TeamPhysician/PerformanceStaff/BillingStaff/TeamAdmin see all fields; CoachingStaff sees only {id, team_id, full_name, position, roster_status, availability_tier, created_at, updated_at, version} — ACWR and load_flag masked."
    roles: [TeamAdmin, MedicalStaff, TeamPhysician, PerformanceStaff, BillingStaff, CoachingStaff]
    code: 200
    input: []
    output: Athlete
    side_effects: []

  - method: POST
    path: "/sports-med/athletes/{athleteId}/deactivate"
    description: "ACTIVE -> INACTIVE"
    roles: [TeamAdmin]
    code: 200
    input: []
    output: Athlete
    side_effects: ["roster_status -> INACTIVE; increments Athlete.version by 1"]

  - method: POST
    path: "/sports-med/athletes/{athleteId}/reactivate"
    description: "INACTIVE -> ACTIVE"
    roles: [TeamAdmin]
    code: 200
    input: []
    output: Athlete
    side_effects: ["roster_status -> ACTIVE; availability_tier recompute; increments Athlete.version by 1"]

  - method: POST
    path: "/sports-med/athletes/{athleteId}/release"
    description: "ACTIVE -> RELEASED; cascades grant revocation"
    roles: [TeamAdmin]
    code: 200
    input: []
    output: Athlete
    side_effects: ["roster_status -> RELEASED; all ACTIVE DisclosureGrants -> REVOKED; increments Athlete.version by 1"]

  # --- Injury cases ---
  - method: POST
    path: "/sports-med/injury-cases"
    description: "Injury intake"
    roles: [MedicalStaff]
    code: 201
    input: [athlete_id, diagnosis_code_id, occurred_on, surface, mechanism]
    output: InjuryCase
    side_effects:
      - "status = OPEN; reported_by_user_id = X-User-ID; severity_class_snapshot / is_concussion_snapshot copied from DiagnosisCode; team_id denormalized from athlete"
      - "Recompute Athlete.availability_tier (new OPEN case forces at least LIMITED); increments Athlete.version by 1"

  - method: GET
    path: "/sports-med/injury-cases"
    description: "List injury cases (filterable)"
    roles: [MedicalStaff, TeamPhysician, BillingStaff, TeamAdmin]
    code: 200
    input: ["athlete_id?", "team_id?", "diagnosis_code_id?", "status?"]
    output: "InjuryCase[]"
    side_effects: []

  - method: GET
    path: "/sports-med/injury-cases/{caseId}"
    description: "Get an injury case"
    roles: [MedicalStaff, TeamPhysician, BillingStaff, TeamAdmin]
    code: 200
    input: []
    output: InjuryCase
    side_effects: []

  - method: POST
    path: "/sports-med/injury-cases/{caseId}/start-rehab"
    description: "OPEN -> REHAB"
    roles: [MedicalStaff]
    code: 200
    input: []
    output: InjuryCase
    side_effects: ["status -> REHAB; availability_tier recompute"]

  - method: POST
    path: "/sports-med/injury-cases/{caseId}/mark-long-term"
    description: "REHAB -> LONG_TERM"
    roles: [MedicalStaff]
    code: 200
    input: []
    output: InjuryCase
    side_effects: ["status -> LONG_TERM; availability_tier recompute (forced OUT)"]

  - method: POST
    path: "/sports-med/injury-cases/{caseId}/resume-rehab"
    description: "LONG_TERM -> REHAB"
    roles: [MedicalStaff]
    code: 200
    input: []
    output: InjuryCase
    side_effects: ["status -> REHAB; availability_tier recompute"]

  - method: POST
    path: "/sports-med/injury-cases/{caseId}/close"
    description: "CLEARED -> CLOSED"
    roles: [MedicalStaff]
    code: 200
    input: []
    output: InjuryCase
    side_effects: ["status -> CLOSED; closed_on, days_lost set; availability_tier recompute"]

  # --- Treatment plans ---
  - method: POST
    path: "/sports-med/treatment-plans"
    description: "Create a treatment plan"
    roles: [MedicalStaff]
    code: 201
    input: [injury_case_id, title, planned_sessions_per_week, estimated_duration_weeks]
    output: TreatmentPlan
    side_effects: ["status = DRAFT; athlete_id denormalized from case"]

  - method: GET
    path: "/sports-med/treatment-plans"
    description: "List treatment plans (filterable)"
    roles: [MedicalStaff, TeamPhysician, TeamAdmin]
    code: 200
    input: ["injury_case_id?", "athlete_id?", "status?"]
    output: "TreatmentPlan[]"
    side_effects: []

  - method: GET
    path: "/sports-med/treatment-plans/{planId}"
    description: "Get a treatment plan"
    roles: [MedicalStaff, TeamPhysician, TeamAdmin]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: POST
    path: "/sports-med/treatment-plans/{planId}/activate"
    description: "DRAFT -> ACTIVE"
    roles: [MedicalStaff]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: POST
    path: "/sports-med/treatment-plans/{planId}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [MedicalStaff]
    code: 200
    input: [reason]
    output: TreatmentPlan
    side_effects: ["suspension_reason set"]

  - method: POST
    path: "/sports-med/treatment-plans/{planId}/resume"
    description: "SUSPENDED -> ACTIVE"
    roles: [MedicalStaff]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["suspension_reason cleared"]

  - method: POST
    path: "/sports-med/treatment-plans/{planId}/complete"
    description: "{ACTIVE,SUSPENDED} -> COMPLETED"
    roles: [MedicalStaff]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  # --- Daily status entries ---
  - method: POST
    path: "/sports-med/daily-status-entries"
    description: "Record a daily designation; may supersede an earlier entry for the same (case, entry_date)"
    roles: [MedicalStaff]
    code: 201
    input: [injury_case_id, entry_date, designation, symptom_free, functional_test_score, "notes?", "supersedes_entry_id?"]
    output: DailyStatusEntry
    side_effects:
      - "is_current bookkeeping: new entry is_current = true; superseded entry is_current = false"
      - "Recompute Athlete.availability_tier; increments Athlete.version by 1"
      - "Concussion overlay: if case.is_concussion_snapshot and protocol status IN_PROGRESS and new latest entry symptom_free == false -> protocol SUSPENDED_CONCUSSION; if protocol SUSPENDED_CONCUSSION and new latest entry symptom_free == true -> protocol IN_PROGRESS"

  - method: GET
    path: "/sports-med/daily-status-entries"
    description: "List daily status entries (filterable)"
    roles: [MedicalStaff, TeamPhysician, TeamAdmin]
    code: 200
    input: ["injury_case_id?", "athlete_id?", "entry_date?", "is_current?", "supersedes_entry_id?"]
    output: "DailyStatusEntry[]"
    side_effects: []

  - method: GET
    path: "/sports-med/daily-status-entries/{entryId}"
    description: "Get a daily status entry"
    roles: [MedicalStaff, TeamPhysician, TeamAdmin]
    code: 200
    input: []
    output: DailyStatusEntry
    side_effects: []

  # --- RTP protocols ---
  - method: POST
    path: "/sports-med/rtp-protocols"
    description: "Create RTP protocol; case REHAB -> RTP"
    roles: [MedicalStaff]
    code: 201
    input: [injury_case_id, total_stages]
    output: RTPProtocol
    side_effects:
      - "status = NOT_STARTED; current_stage_index = 0; current_stage_entered_on = current_utc date"
      - "InjuryCase REHAB -> RTP; availability_tier recompute"

  - method: GET
    path: "/sports-med/rtp-protocols"
    description: "List RTP protocols (filterable)"
    roles: [MedicalStaff, TeamPhysician, TeamAdmin]
    code: 200
    input: ["injury_case_id?", "athlete_id?", "status?"]
    output: "RTPProtocol[]"
    side_effects: []

  - method: GET
    path: "/sports-med/rtp-protocols/{protocolId}"
    description: "Get an RTP protocol"
    roles: [MedicalStaff, TeamPhysician, TeamAdmin]
    code: 200
    input: []
    output: RTPProtocol
    side_effects: []

  - method: POST
    path: "/sports-med/rtp-protocols/{protocolId}/advances"
    description: "Advance one stage (OCC on protocol version)"
    roles: [MedicalStaff]
    code: 201
    input: [expected_protocol_version]
    output: RTPStageAdvance
    side_effects:
      - "Readiness gate evaluated per rtp_stage_readiness"
      - "current_stage_index += 1; current_stage_entered_on = current_utc date; increments RTPProtocol.version by 1"
      - "If final stage reached: protocol -> AWAITING_CLEARANCE"

  - method: GET
    path: "/sports-med/rtp-protocols/{protocolId}/advances"
    description: "List stage advances of a protocol"
    roles: [MedicalStaff, TeamPhysician, TeamAdmin]
    code: 200
    input: []
    output: "RTPStageAdvance[]"
    side_effects: []

  - method: GET
    path: "/sports-med/rtp-stage-advances"
    description: "List stage advances across protocols (filterable)"
    roles: [MedicalStaff, TeamPhysician, TeamAdmin]
    code: 200
    input: ["rtp_protocol_id?", "kind?"]
    output: "RTPStageAdvance[]"
    side_effects: []

  - method: GET
    path: "/sports-med/rtp-stage-advances/{advanceId}"
    description: "Get a single stage advance"
    roles: [MedicalStaff, TeamPhysician, TeamAdmin]
    code: 200
    input: []
    output: RTPStageAdvance
    side_effects: []

  - method: POST
    path: "/sports-med/rtp-protocols/{protocolId}/regress"
    description: "Regress one stage; cascades to case and clearances"
    roles: [MedicalStaff]
    code: 200
    input: [reason]
    output: RTPProtocol
    side_effects:
      - "current_stage_index -= 1; current_stage_entered_on = current_utc date; regression_count += 1; protocol -> REGRESSED; increments RTPProtocol.version by 1"
      - "InjuryCase RTP -> REHAB"
      - "PENDING ClearanceAuthorization on protocol -> EXPIRED"
      - "availability_tier recompute"

  # --- Clearances ---
  - method: POST
    path: "/sports-med/rtp-protocols/{protocolId}/clearances"
    description: "Request clearance (initial or re-request after RETURNED_FOR_REVIEW; OCC on protocol version)"
    roles: [MedicalStaff]
    code: 201
    input: [expected_protocol_version, "request_notes?"]
    output: ClearanceAuthorization
    side_effects:
      - "status = PENDING; requested_by_user_id = X-User-ID; requested_at = current_utc; rtp_protocol_id from path; injury_case_id/athlete_id denormalized"
      - "Re-request path: prior RETURNED_FOR_REVIEW row -> EXPIRED"
      - "increments RTPProtocol.version by 1"

  - method: GET
    path: "/sports-med/clearances"
    description: "List clearances (filterable)"
    roles: [MedicalStaff, TeamPhysician, TeamAdmin]
    code: 200
    input: ["rtp_protocol_id?", "injury_case_id?", "athlete_id?", "status?"]
    output: "ClearanceAuthorization[]"
    side_effects: []

  - method: GET
    path: "/sports-med/clearances/{clearanceId}"
    description: "Get a clearance"
    roles: [MedicalStaff, TeamPhysician, TeamAdmin]
    code: 200
    input: []
    output: ClearanceAuthorization
    side_effects: []

  - method: POST
    path: "/sports-med/clearances/{clearanceId}/decide"
    description: "Physician decision on clearance"
    roles: [TeamPhysician]
    code: 200
    input: [decision, "decision_notes?"]
    output: ClearanceAuthorization
    side_effects:
      - "GRANTED: decided_at/expires_at set; protocol AWAITING_CLEARANCE -> CLEARED; case RTP -> CLEARED (cleared_on set); availability_tier recompute"
      - "RETURNED_FOR_REVIEW: decision/decided_at set"

  # --- Workload sessions ---
  - method: POST
    path: "/sports-med/workload-sessions"
    description: "Ingest a workload session record"
    roles: [PerformanceStaff]
    code: 201
    input: [athlete_id, session_date, session_type, surface, duration_minutes, rpe]
    output: WorkloadSession
    side_effects:
      - "session_load = duration_minutes * rpe; counts_as_exposure computed; team_id denormalized"
      - "Recompute acute_chronic_workload_ratio + load_flag; availability_tier load overlay applied; increments Athlete.version by 1"

  - method: GET
    path: "/sports-med/workload-sessions"
    description: "List workload sessions (filterable)"
    roles: [PerformanceStaff, MedicalStaff, TeamAdmin]
    code: 200
    input: ["athlete_id?", "team_id?", "from_date?", "to_date?", "session_type?"]
    output: "WorkloadSession[]"
    side_effects: []

  - method: GET
    path: "/sports-med/workload-sessions/{sessionId}"
    description: "Get a workload session"
    roles: [PerformanceStaff, MedicalStaff, TeamAdmin]
    code: 200
    input: []
    output: WorkloadSession
    side_effects: []

  # --- Insurance policies ---
  - method: POST
    path: "/sports-med/insurance-policies"
    description: "Create an insurance policy"
    roles: [BillingStaff]
    code: 201
    input: [athlete_id, payer_name, policy_number, deductible_cents, coinsurance_pct, oop_max_cents, policy_year_start, policy_year_end]
    output: InsurancePolicy
    side_effects: ["status = ACTIVE; deductible_met_cents = 0; oop_accrued_cents = 0"]

  - method: GET
    path: "/sports-med/insurance-policies"
    description: "List policies (filterable)"
    roles: [BillingStaff, TeamAdmin]
    code: 200
    input: ["athlete_id?", "status?"]
    output: "InsurancePolicy[]"
    side_effects: []

  - method: GET
    path: "/sports-med/insurance-policies/{policyId}"
    description: "Get a policy"
    roles: [BillingStaff, TeamAdmin]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []

  - method: POST
    path: "/sports-med/insurance-policies/{policyId}/cancel"
    description: "Cancel a policy"
    roles: [BillingStaff]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status -> CANCELLED; increments InsurancePolicy.version by 1"]

  # --- Claims ---
  - method: POST
    path: "/sports-med/claims"
    description: "Create a claim (may supersede a VOID claim)"
    roles: [BillingStaff]
    code: 201
    input: [injury_case_id, insurance_policy_id, billed_amount_cents, line_items, "supersedes_claim_id?"]
    output: Claim
    side_effects: ["status = DRAFT; athlete_id denormalized from case"]

  - method: GET
    path: "/sports-med/claims"
    description: "List claims (filterable)"
    roles: [BillingStaff, TeamAdmin]
    code: 200
    input: ["injury_case_id?", "athlete_id?", "insurance_policy_id?", "status?", "supersedes_claim_id?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/sports-med/claims/{claimId}"
    description: "Get a claim"
    roles: [BillingStaff, TeamAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/sports-med/claims/{claimId}/submit"
    description: "Submit a claim (OCC on policy version)"
    roles: [BillingStaff]
    code: 200
    input: [expected_policy_version]
    output: Claim
    side_effects: ["status -> SUBMITTED; submitted_at set; increments InsurancePolicy.version by 1"]

  - method: POST
    path: "/sports-med/claims/{claimId}/adjudicate"
    description: "Adjudicate a claim (initial or after appeal)"
    roles: [BillingStaff]
    code: 200
    input: ["deny?", "denial_reason?"]
    output: Claim
    side_effects:
      - "Run claim_adjudication; status -> ADJUDICATED then immediately PAID (deny absent/false) or DENIED (deny=true)"
      - "Non-denial: policy accumulators updated; policy may -> EXHAUSTED"

  - method: POST
    path: "/sports-med/claims/{claimId}/appeal"
    description: "Appeal a denied claim"
    roles: [BillingStaff]
    code: 200
    input: [appeal_reason]
    output: Claim
    side_effects: ["status -> APPEALED; appeals_count += 1"]

  - method: POST
    path: "/sports-med/claims/{claimId}/void"
    description: "Void a draft claim"
    roles: [BillingStaff]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> VOID"]

  # --- Disclosure grants ---
  - method: POST
    path: "/sports-med/disclosure-grants"
    description: "Create a disclosure grant"
    roles: [MedicalStaff]
    code: 201
    input: [athlete_id, grantee_role, scope, effective_from, effective_to]
    output: DisclosureGrant
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/sports-med/disclosure-grants"
    description: "List disclosure grants (filterable)"
    roles: [MedicalStaff, TeamAdmin]
    code: 200
    input: ["athlete_id?", "status?", "grantee_role?"]
    output: "DisclosureGrant[]"
    side_effects: []

  - method: GET
    path: "/sports-med/disclosure-grants/{grantId}"
    description: "Get a disclosure grant"
    roles: [MedicalStaff, TeamAdmin]
    code: 200
    input: []
    output: DisclosureGrant
    side_effects: []

  - method: POST
    path: "/sports-med/disclosure-grants/{grantId}/revoke"
    description: "Revoke a grant"
    roles: [MedicalStaff]
    code: 200
    input: []
    output: DisclosureGrant
    side_effects: ["status -> REVOKED"]

  # --- Availability reports & analytics ---
  - method: POST
    path: "/sports-med/availability-reports"
    description: "Generate an availability snapshot for an audience"
    roles: [CoachingStaff, MedicalStaff, TeamAdmin]
    code: 201
    input: [team_id, audience]
    output: AvailabilityReport
    side_effects: ["rows computed per confidentiality_redaction_filter; report_date = current_utc date; generated_for_role = audience"]

  - method: GET
    path: "/sports-med/availability-reports"
    description: "List availability reports (filterable)"
    roles: [CoachingStaff, MedicalStaff, TeamAdmin]
    code: 200
    input: ["team_id?"]
    output: "AvailabilityReport[]"
    side_effects: []

  - method: GET
    path: "/sports-med/availability-reports/{reportId}"
    description: "Get an availability report (redaction re-evaluated at read time against current grants and clock)"
    roles: [CoachingStaff, MedicalStaff, TeamAdmin]
    code: 200
    input: []
    output: AvailabilityReport
    side_effects: []

  - method: GET
    path: "/sports-med/teams/{teamId}/analytics/injury-rates"
    description: "Injury rate per 1000 exposures by position x surface over a window"
    roles: [MedicalStaff, TeamAdmin, PerformanceStaff]
    code: 200
    input: [from_date, to_date]
    output: "{ groups: array }"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource missing, or body FK reference missing / cross-team scope mismatch" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, enum violation, range violation, or date-ordering violation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic illegal from-state for the requested transition" }
  - { id: ERR_CASE_NOT_OPEN, http: 409, condition: "start-rehab requires case OPEN" }
  - { id: ERR_NO_STATUS_ENTRY, http: 409, condition: "start-rehab requires at least one is_current DailyStatusEntry" }
  - { id: ERR_CASE_NOT_IN_REHAB, http: 409, condition: "RTP creation or mark-long-term requires case REHAB" }
  - { id: ERR_RTP_ALREADY_EXISTS, http: 409, condition: "An RTPProtocol already exists for this InjuryCase" }
  - { id: ERR_NO_ACTIVE_TREATMENT_PLAN, http: 409, condition: "RTP creation requires an ACTIVE TreatmentPlan on the case" }
  - { id: ERR_CASE_NOT_CLEARED, http: 409, condition: "close requires case CLEARED" }
  - { id: ERR_PLAN_STILL_ACTIVE, http: 409, condition: "close blocked by ACTIVE/SUSPENDED TreatmentPlan" }
  - { id: ERR_CLAIMS_OPEN, http: 409, condition: "close blocked by Claim in DRAFT/SUBMITTED/APPEALED" }
  - { id: ERR_DESIGNATION_NOT_OUT, http: 409, condition: "mark-long-term requires latest designation OUT" }
  - { id: ERR_CASE_NOT_LONG_TERM, http: 409, condition: "resume-rehab requires case LONG_TERM" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "activate requires plan DRAFT" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "suspend requires plan ACTIVE" }
  - { id: ERR_PLAN_NOT_SUSPENDED, http: 409, condition: "resume requires plan SUSPENDED" }
  - { id: ERR_PLAN_NOT_COMPLETABLE, http: 409, condition: "complete requires plan ACTIVE or SUSPENDED" }
  - { id: ERR_PROTOCOL_NOT_ADVANCEABLE, http: 409, condition: "advance requires protocol NOT_STARTED/IN_PROGRESS/REGRESSED (not SUSPENDED_CONCUSSION/AWAITING_CLEARANCE/CLEARED)" }
  - { id: ERR_READINESS_NOT_MET, http: 409, condition: "rtp_stage_readiness gate failed (days/symptom/score/regression-window/stage-observation)" }
  - { id: ERR_CONCUSSION_MIN_DAYS, http: 409, condition: "Concussion case advanced before MIN_CONCUSSION_DAYS_PER_STAGE hard floor" }
  - { id: ERR_PROTOCOL_NOT_REGRESSABLE, http: 409, condition: "regress requires protocol IN_PROGRESS or AWAITING_CLEARANCE" }
  - { id: ERR_CANNOT_REGRESS_BELOW_ZERO, http: 409, condition: "regress at current_stage_index == 0" }
  - { id: ERR_PROTOCOL_NOT_AWAITING_CLEARANCE, http: 409, condition: "clearance request/decision requires protocol AWAITING_CLEARANCE" }
  - { id: ERR_CLEARANCE_NOT_PENDING, http: 409, condition: "decide requires clearance PENDING" }
  - { id: ERR_CLEARANCE_ALREADY_PENDING, http: 409, condition: "A PENDING clearance already exists on the protocol" }
  - { id: ERR_SOD_SELF_CLEARANCE, http: 403, condition: "Clearance decider is the same user as the clearance requester" }
  - { id: ERR_SOD_EVALUATOR_CLEARANCE, http: 403, condition: "Clearance decider recorded the latest is_current DailyStatusEntry (evaluator cannot clear own evaluation)" }
  - { id: ERR_STALE_EVALUATION, http: 409, condition: "Latest DailyStatusEntry older than CLEARANCE_EVAL_MAX_AGE_HOURS (72h) at grant time" }
  - { id: ERR_NO_FRESH_STATUS_ENTRY, http: 409, condition: "Clearance re-request lacks a status entry dated current_utc date" }
  - { id: ERR_CLAIM_NOT_DRAFT, http: 409, condition: "submit requires claim DRAFT" }
  - { id: ERR_CLAIM_NOT_SUBMITTABLE_STATE, http: 409, condition: "adjudicate requires claim SUBMITTED or APPEALED" }
  - { id: ERR_CLAIM_NOT_DENIED, http: 409, condition: "appeal requires claim DENIED" }
  - { id: ERR_CLAIM_NOT_VOIDABLE, http: 409, condition: "void requires claim DRAFT" }
  - { id: ERR_MAX_APPEALS_REACHED, http: 409, condition: "appeals_count == MAX_APPEALS (3)" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Policy not ACTIVE (submit/cancel precondition)" }
  - { id: ERR_POLICY_CLAIMS_IN_FLIGHT, http: 409, condition: "Policy cancel blocked by SUBMITTED/APPEALED claims" }
  - { id: ERR_SERVICE_DATE_OUT_OF_POLICY_YEAR, http: 422, condition: "A line item's service_date lies outside [policy_year_start, policy_year_end]" }
  - { id: ERR_LINE_ITEM_SUM_MISMATCH, http: 422, condition: "sum(line_items.charge_cents) != billed_amount_cents" }
  - { id: ERR_INVALID_SUPERSEDE_TARGET, http: 422, condition: "supersedes_entry_id / supersedes_claim_id invalid (wrong case, wrong date, not is_current, or claim target not VOID)" }
  - { id: ERR_FUTURE_DATE_NOT_ALLOWED, http: 422, condition: "entry_date/session_date/occurred_on later than current_utc date" }
  - { id: ERR_DUPLICATE_POLICY_NUMBER, http: 409, condition: "(athlete_id, policy_number) already exists on a non-CANCELLED policy" }
  - { id: ERR_ATHLETE_NOT_ACTIVE, http: 409, condition: "deactivate/release requires roster_status ACTIVE" }
  - { id: ERR_ATHLETE_NOT_INACTIVE, http: 409, condition: "reactivate requires roster_status INACTIVE" }
  - { id: ERR_OPEN_CASES_EXIST, http: 409, condition: "release blocked by non-terminal InjuryCase" }
  - { id: ERR_GRANT_NOT_ACTIVE, http: 409, condition: "revoke requires grant ACTIVE" }
  - { id: ERR_AUDIENCE_INVALID, http: 400, condition: "availability report audience not in {COACHING, FRONT_OFFICE, MEDICAL}" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TeamAdmin
    description: "Team operations administrator; owns team/roster/diagnosis-code config and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /sports-med/teams"
      - "POST /sports-med/_clock/set_current_utc"
      - "POST /sports-med/diagnosis-codes"
      - "POST /sports-med/athletes"
      - "POST /sports-med/athletes/{id}/deactivate"
      - "POST /sports-med/athletes/{id}/reactivate"
      - "POST /sports-med/athletes/{id}/release"
    shared_operations:
      - "GET endpoints listing TeamAdmin in roles"
      - "POST /sports-med/availability-reports"

  - name: MedicalStaff
    description: "Team medical staff (athletic trainers); owns intake, treatment plans, daily status, RTP advancement/regression, clearance requests, disclosure grants"
    identity: "opaque"
    exclusive_operations:
      - "POST /sports-med/injury-cases"
      - "POST /sports-med/injury-cases/{id}/start-rehab"
      - "POST /sports-med/injury-cases/{id}/mark-long-term"
      - "POST /sports-med/injury-cases/{id}/resume-rehab"
      - "POST /sports-med/injury-cases/{id}/close"
      - "POST /sports-med/treatment-plans and plan action endpoints"
      - "POST /sports-med/daily-status-entries"
      - "POST /sports-med/rtp-protocols"
      - "POST /sports-med/rtp-protocols/{id}/advances"
      - "POST /sports-med/rtp-protocols/{id}/regress"
      - "POST /sports-med/rtp-protocols/{id}/clearances"
      - "POST /sports-med/disclosure-grants"
      - "POST /sports-med/disclosure-grants/{id}/revoke"
    shared_operations:
      - "GET endpoints listing MedicalStaff in roles"
      - "POST /sports-med/availability-reports"

  - name: TeamPhysician
    description: "Team physician; sole clearance-decision authority (segregated from requester and from the recording evaluator)"
    identity: "opaque"
    exclusive_operations:
      - "POST /sports-med/clearances/{id}/decide"
    shared_operations:
      - "GET endpoints listing TeamPhysician in roles"

  - name: PerformanceStaff
    description: "Performance / load-management staff; owns workload data ingest"
    identity: "opaque"
    exclusive_operations:
      - "POST /sports-med/workload-sessions"
    shared_operations:
      - "GET endpoints listing PerformanceStaff in roles"

  - name: BillingStaff
    description: "Insurance & billing staff; owns policies and the claims lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /sports-med/insurance-policies"
      - "POST /sports-med/insurance-policies/{id}/cancel"
      - "POST /sports-med/claims"
      - "POST /sports-med/claims/{id}/submit"
      - "POST /sports-med/claims/{id}/adjudicate"
      - "POST /sports-med/claims/{id}/appeal"
      - "POST /sports-med/claims/{id}/void"
    shared_operations:
      - "GET endpoints listing BillingStaff in roles"

  - name: CoachingStaff
    description: "Coaching staff; consumes redacted availability reporting only; cannot see diagnosis detail, notes, ACWR, or load_flag"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /sports-med/teams, GET /sports-med/teams/{id}"
      - "GET /sports-med/athletes, GET /sports-med/athletes/{id} (masked field set)"
      - "POST /sports-med/availability-reports"
      - "GET /sports-med/availability-reports, GET /sports-med/availability-reports/{id}"
