# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index) — task_2447
# Walks references/claim-extraction-guide.md section by section against this
# scaffold's §1.1–§1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN
# carry an `excluded_because:` stub instead of a recipe. Every literal in an
# `assert:` line was computed from the §1.3 formula it belongs to.
# The sentinel id 00000000-0000-4000-8000-000000000000 is never minted by the
# API and is used wherever a non-existent id is required.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: unit_creation_applies_declared_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.NicuUnit
          - endpoints.POST /nicu-units
          - calculations.unit_capability_and_effective_level
          - calculations.bed_ledger
          - calculations.census_posture
        distinguishing_aspect: |
          A brand-new unit is born PROVISIONAL with an empty census, and its
          capability_level is LEVEL_I (statutory baseline) even though its
          designated_level is LEVEL_III — because no credential or asset exists
          yet, so effective_level is LEVEL_I on the creation response itself.
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-01T00:00:00Z."
            - "All four network DesignationStandard rows are declared."
            - "No unit, credential or asset exists yet."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - &c_std1
              call: "POST /designation-standards"
              payload: { level: "LEVEL_I", required_credential_codes: [], required_equipment_codes: [], nurse_patient_ratio_denominator: 4.0, min_annual_volume: 100, transport_capability_required: false, min_compliance_score: 85.00, conditional_floor_score: 70.00 }
              as: NetworkAdmin
              as_user_id: "net-1"
            - &c_std2
              call: "POST /designation-standards"
              payload: { level: "LEVEL_II", required_credential_codes: ["RN_NICU_CORE"], required_equipment_codes: ["CONVENTIONAL_VENT"], nurse_patient_ratio_denominator: 3.0, min_annual_volume: 300, transport_capability_required: false, min_compliance_score: 85.00, conditional_floor_score: 70.00 }
              as: NetworkAdmin
              as_user_id: "net-1"
            - &c_std3
              call: "POST /designation-standards"
              payload: { level: "LEVEL_III", required_credential_codes: ["NEO_BOARD", "RN_NICU_CORE"], required_equipment_codes: ["CONVENTIONAL_VENT", "HFOV"], nurse_patient_ratio_denominator: 2.0, min_annual_volume: 500, transport_capability_required: false, min_compliance_score: 85.00, conditional_floor_score: 70.00 }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { std3: $.data.id }
            - &c_std4
              call: "POST /designation-standards"
              payload: { level: "LEVEL_IV", required_credential_codes: ["NEO_BOARD", "NNP", "RN_NICU_CORE", "RT_NEO"], required_equipment_codes: ["CONVENTIONAL_VENT", "HFOV", "INHALED_NO"], nurse_patient_ratio_denominator: 1.0, min_annual_volume: 500, transport_capability_required: true, min_compliance_score: 90.00, conditional_floor_score: 75.00 }
              as: NetworkAdmin
              as_user_id: "net-1"
          trigger:
            - &c_unit_a
              call: "POST /nicu-units"
              payload: { name: "Regional NICU A", hospital_type: "REGIONAL_CENTER", staffed_bed_target: 4, designated_level: "LEVEL_III", transport_capable: true, annual_admission_volume: 400, followup_clinic_daily_capacity: 2 }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { unit_a: $.data.id }
            - &c_unit_b
              call: "POST /nicu-units"
              payload: { name: "Community Hospital B", hospital_type: "COMMUNITY", staffed_bed_target: 6, designated_level: "LEVEL_I", transport_capable: false, annual_admission_volume: 300, followup_clinic_daily_capacity: 1 }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { unit_b: $.data.id }
          assert:
            - "Both creations return HTTP 201 with a server-minted uuid id, created_at and updated_at set to 2026-08-01T00:00:00Z and version == 1"
            - "NicuUnit.${unit_a}.designation_status == PROVISIONAL"
            - "NicuUnit.${unit_a}.capability_level == LEVEL_I and effective_level == LEVEL_I — no credential or asset exists, so only the LEVEL_I standard is satisfied"
            - "NicuUnit.${unit_a}.staffing_compliant == false and equipment_compliant == false"
            - "NicuUnit.${unit_a}.escalation_bed_count == 0, occupied_bed_count == 0, held_bed_count == 0, available_bed_count == 4"
            - "NicuUnit.${unit_a}.census_posture == OPEN and required_nurse_count == 0 and deferral_queue_depth == 0"
            - "NicuUnit.${unit_a}.quality_flag == WITHIN_BENCHMARK"
            - "NicuUnit.${unit_b}.capability_level == LEVEL_I with staffing_compliant == true and equipment_compliant == true — the LEVEL_I standard requires nothing"
            - "NicuUnit.${unit_b}.available_bed_count == 6 and census_posture == OPEN"

      - name: optional_fields_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.NicuUnit.fields.designated_level
          - entities.NicuUnit.fields.transport_capable
          - entities.NicuUnit.fields.annual_admission_volume
          - entities.NicuUnit.fields.followup_clinic_daily_capacity
          - entities.Referral.fields.diagnoses
          - entities.Referral.fields.planned_surgery
        distinguishing_aspect: |
          Omitting every optional input yields the declared defaults, not nulls:
          a unit created with three fields is LEVEL_I / not transport capable /
          volume 0 / clinic capacity 0, and a referral created without diagnoses
          is [] with planned_surgery false, so its anticipated_need_level equals
          its current_support_level.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z and the four standards are declared."
            - "Regional NICU A (LEVEL_III, 4 beds, transport capable) and Community Hospital B (COMMUNITY, LEVEL_I, 6 beds) exist."
            - "Regional NICU A holds valid NEO_BOARD (1.0 FTE) and RN_NICU_CORE (3.0 FTE) credentials and in-service CONVENTIONAL_VENT, HFOV and TRANSPORT_ISOLETTE assets, so its capability_level is LEVEL_III."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - &c_cred_neo
              call: "POST /staff-credentials"
              payload: { unit_id: "${unit_a}", credential_code: "NEO_BOARD", holder_reference: "neo-1", fte: 1.0, expires_on: "2027-01-01T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { cred_neo_a: $.data.id }
            - &c_cred_rn
              call: "POST /staff-credentials"
              payload: { unit_id: "${unit_a}", credential_code: "RN_NICU_CORE", holder_reference: "rn-pool", fte: 3.0, expires_on: "2027-01-01T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { cred_rn_a: $.data.id }
            - &c_vent
              call: "POST /equipment-assets"
              payload: { unit_id: "${unit_a}", equipment_code: "CONVENTIONAL_VENT", asset_tag: "VENT-1", last_service_at: "2026-07-01T00:00:00Z", service_interval_days: 365 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { vent_a: $.data.id }
            - &c_hfov
              call: "POST /equipment-assets"
              payload: { unit_id: "${unit_a}", equipment_code: "HFOV", asset_tag: "HFOV-1", last_service_at: "2026-07-01T00:00:00Z", service_interval_days: 365 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { hfov_a: $.data.id }
            - &c_isolette
              call: "POST /equipment-assets"
              payload: { unit_id: "${unit_a}", equipment_code: "TRANSPORT_ISOLETTE", asset_tag: "ISO-1", last_service_at: "2026-07-01T00:00:00Z", service_interval_days: 365 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { isolette_a: $.data.id }
          trigger:
            - call: "POST /nicu-units"
              payload: { name: "Bare Nursery C", hospital_type: "COMMUNITY", staffed_bed_target: 3 }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { unit_c: $.data.id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-D1", gestational_age_weeks: 36.0, birth_weight_grams: 2600, support_modality: "CPAP" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_d: $.data.id }
          assert:
            - "NicuUnit.${unit_c}.designated_level == LEVEL_I and transport_capable == false"
            - "NicuUnit.${unit_c}.annual_admission_volume == 0 and followup_clinic_daily_capacity == 0"
            - "NicuUnit.${unit_c}.designation_status == PROVISIONAL and available_bed_count == 3 and census_posture == OPEN"
            - "Referral.${ref_d}.diagnoses == [] and planned_surgery == false"
            - "Referral.${ref_d}.status == PENDING, info_request_rounds == 0, requested_items == null, decision_reason == null, reservation_id == null"
            - "Referral.${ref_d}.current_support_level == LEVEL_II and anticipated_need_level == LEVEL_II and level_basis == CURRENT_SUPPORT"
            - "Referral.${ref_d}.weight_basis_grams == 2600 and required_level == LEVEL_II and maternal_transfer_preferred == false"
            - "Referral.${ref_d}.triage_priority == 33.75"

      - name: unit_retrieval_and_filtered_pagination
        claim_type: listing
        grounds:
          - endpoints.GET /nicu-units
          - endpoints.GET /nicu-units/{unit_id}
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list endpoint reports total_count over the FILTERED set, not the
          table: hospital_type=COMMUNITY returns exactly one row with
          total_count 1 and has_more false, while an unfiltered limit=1 page
          reports total_count 2 and has_more true.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and exactly two units exist: Regional NICU A (REGIONAL_CENTER) and Community Hospital B (COMMUNITY)."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
          trigger:
            - call: "GET /nicu-units"
              payload: { hospital_type: "COMMUNITY" }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { listed_b: "$.data[0].id" }
            - call: "GET /nicu-units"
              payload: { limit: 1, offset: 0 }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /nicu-units"
              payload: { limit: 1, offset: 1 }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
          assert:
            - "The COMMUNITY-filtered list returns response_type array with exactly 1 row, total_count 1, has_more false, and ${listed_b} == ${unit_b}"
            - "The limit=1 offset=0 page returns 1 row with total_count 2 and has_more true"
            - "The limit=1 offset=1 page returns 1 row with total_count 2 and has_more false"
            - "GET /nicu-units/${unit_a} returns the stored row: name == Regional NICU A, staffed_bed_target == 4, designated_level == LEVEL_III, version == 1"
            - "Every response carries meta.api_request_id and meta.api_request_timestamp"

      - name: every_path_id_not_found_returns_its_entity_code
        claim_type: not_found
        grounds:
          - validations.priority_3
          - errors[ERR_UNIT_NOT_FOUND]
          - errors[ERR_STANDARD_NOT_FOUND]
          - errors[ERR_CREDENTIAL_NOT_FOUND]
          - errors[ERR_ASSET_NOT_FOUND]
          - errors[ERR_REVIEW_NOT_FOUND]
          - errors[ERR_REFERRAL_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_RUN_NOT_FOUND]
          - errors[ERR_ADMISSION_NOT_FOUND]
          - errors[ERR_MILK_BATCH_NOT_FOUND]
          - errors[ERR_ESCALATION_NOT_FOUND]
          - errors[ERR_REPORT_NOT_FOUND]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
        distinguishing_aspect: |
          Priority 3 is per-entity, not generic: the same sentinel uuid produces
          thirteen DIFFERENT 404 codes depending on which collection it was
          addressed against, so a client can tell which reference is stale.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z; no row of any entity has the sentinel id 00000000-0000-4000-8000-000000000000."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /nicu-units/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_unit: $.data.error_id }
            - call: "GET /designation-standards/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_std: $.data.error_id }
            - call: "GET /staff-credentials/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_cred: $.data.error_id }
            - call: "GET /equipment-assets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_asset: $.data.error_id }
            - call: "GET /designation-reviews/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_review: $.data.error_id }
            - call: "GET /referrals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_ref: $.data.error_id }
            - call: "GET /bed-reservations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_res: $.data.error_id }
            - call: "GET /transport-runs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_run: $.data.error_id }
            - call: "GET /admissions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_adm: $.data.error_id }
            - call: "GET /milk-batches/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_milk: $.data.error_id }
            - call: "GET /surge-escalations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_esc: $.data.error_id }
            - call: "GET /surveillance-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_rep: $.data.error_id }
            - call: "GET /follow-up-enrollments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_enr: $.data.error_id }
          assert:
            - "${e_unit} == ERR_UNIT_NOT_FOUND with HTTP 404"
            - "${e_std} == ERR_STANDARD_NOT_FOUND with HTTP 404"
            - "${e_cred} == ERR_CREDENTIAL_NOT_FOUND with HTTP 404"
            - "${e_asset} == ERR_ASSET_NOT_FOUND with HTTP 404"
            - "${e_review} == ERR_REVIEW_NOT_FOUND with HTTP 404"
            - "${e_ref} == ERR_REFERRAL_NOT_FOUND with HTTP 404"
            - "${e_res} == ERR_RESERVATION_NOT_FOUND with HTTP 404"
            - "${e_run} == ERR_RUN_NOT_FOUND with HTTP 404"
            - "${e_adm} == ERR_ADMISSION_NOT_FOUND with HTTP 404"
            - "${e_milk} == ERR_MILK_BATCH_NOT_FOUND with HTTP 404"
            - "${e_esc} == ERR_ESCALATION_NOT_FOUND with HTTP 404"
            - "${e_rep} == ERR_REPORT_NOT_FOUND with HTTP 404"
            - "${e_enr} == ERR_ENROLLMENT_NOT_FOUND with HTTP 404"
            - "Every response body is the error envelope { error_id, message } with response_type error"

      - name: missing_required_fields_return_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_5
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST /nicu-units
          - endpoints.POST /referrals
          - endpoints.POST /staff-credentials
          - endpoints.POST /surveillance-reports
        distinguishing_aspect: |
          Every field declared `source: input` with no default is genuinely
          required: dropping staffed_bed_target, support_modality, expires_on or
          reported_central_line_days each returns 400 and writes nothing, even
          though the rest of the payload is valid.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and both units exist."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
          trigger:
            - call: "POST /nicu-units"
              payload: { name: "No Beds Declared", hospital_type: "COMMUNITY" }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_unit_req: $.data.error_id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-R0", gestational_age_weeks: 30.0, birth_weight_grams: 1300 }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { e_ref_req: $.data.error_id }
            - call: "POST /staff-credentials"
              payload: { unit_id: "${unit_a}", credential_code: "RN_NICU_CORE", holder_reference: "rn-x", fte: 1.0 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { e_cred_req: $.data.error_id }
            - call: "POST /surveillance-reports"
              payload: { unit_id: "${unit_a}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", reported_patient_days: 10 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { e_rep_req: $.data.error_id }
          assert:
            - "${e_unit_req} == ERR_INVALID_REQUEST with HTTP 400"
            - "${e_ref_req} == ERR_INVALID_REQUEST with HTTP 400"
            - "${e_cred_req} == ERR_INVALID_REQUEST with HTTP 400"
            - "${e_rep_req} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /nicu-units reports total_count 2 — no third unit was created"
            - "GET /referrals reports total_count 0, GET /staff-credentials total_count 0 and GET /surveillance-reports total_count 0"

      - name: computed_and_system_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.NicuUnit.fields.designation_status
          - entities.NicuUnit.fields.capability_level
          - entities.NicuUnit.fields.available_bed_count
          - endpoints.POST /nicu-units
        distinguishing_aspect: |
          Client-supplied values for id, version and every computed/system field
          are discarded rather than honoured: the unit comes back with a
          server-minted id, version 1, designation_status PROVISIONAL and
          available_bed_count derived from staffed_bed_target — not the 99 the
          caller asked for.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z and the standards are declared."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
          trigger:
            - call: "POST /nicu-units"
              payload: { name: "Injection Attempt", hospital_type: "REGIONAL_CENTER", staffed_bed_target: 4, designated_level: "LEVEL_III", id: "00000000-0000-4000-8000-000000000000", version: 99, designation_status: "DESIGNATED", capability_level: "LEVEL_IV", available_bed_count: 99, census_posture: "CLOSED" }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { unit_i: $.data.id }
          assert:
            - "The call returns HTTP 201 — unknown and non-input keys are ignored, not rejected"
            - "${unit_i} != 00000000-0000-4000-8000-000000000000 — id is server-minted"
            - "NicuUnit.${unit_i}.version == 1 and created_at == 2026-08-01T00:00:00Z"
            - "NicuUnit.${unit_i}.designation_status == PROVISIONAL (system default, not the requested DESIGNATED)"
            - "NicuUnit.${unit_i}.capability_level == LEVEL_I and effective_level == LEVEL_I (computed, not the requested LEVEL_IV)"
            - "NicuUnit.${unit_i}.available_bed_count == 4 and census_posture == OPEN (computed from staffed_bed_target 4)"

      - name: designation_standard_is_immutable_and_unique_per_level
        claim_type: immutability
        grounds:
          - entities.DesignationStandard
          - endpoints.POST /designation-standards
          - endpoints.GET /designation-standards/{standard_id}
          - errors[ERR_DUPLICATE_STANDARD]
          - validations.priority_14
        distinguishing_aspect: |
          DesignationStandard is the only `common_fields: false` entity: it has
          no version, no updated_at, no PATCH and no DELETE in §1.5, and its
          level is unique — so the only way to "change" a standard is refused
          with ERR_DUPLICATE_STANDARD.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z and standards for LEVEL_I through LEVEL_IV are declared."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_std4
          trigger:
            - call: "GET /designation-standards/${std3}"
              payload: {}
              as: UnitDirector
              as_user_id: "${std3}:dir-1"
            - call: "POST /designation-standards"
              payload: { level: "LEVEL_III", required_credential_codes: ["NEO_BOARD"], required_equipment_codes: ["HFOV"], nurse_patient_ratio_denominator: 2.5, min_annual_volume: 400, transport_capability_required: false, min_compliance_score: 80.00, conditional_floor_score: 60.00 }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_dup_std: $.data.error_id }
            - call: "GET /designation-standards"
              payload: { level: "LEVEL_III" }
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "GET /designation-standards/${std3} returns id and created_at but NO version and NO updated_at field — common_fields is false for this entity"
            - "§1.5 declares no PATCH, PUT or DELETE on /designation-standards, so the row is write-once"
            - "${e_dup_std} == ERR_DUPLICATE_STANDARD with HTTP 409"
            - "GET /designation-standards?level=LEVEL_III reports total_count 1 and the surviving row still has nurse_patient_ratio_denominator 2.0, min_compliance_score 85.00 and conditional_floor_score 70.00"

      - name: type_constraint_violations_return_invalid_request
        claim_type: type_constraints
        grounds:
          - validations.priority_5
          - entities.NicuUnit.fields.staffed_bed_target
          - entities.Referral.fields.support_modality
          - entities.SurgeEscalation.fields.effective_to
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Four different shapes of type violation all land on the same 400:
          an out-of-range enum, a numeric bound (staffed_bed_target >= 1), an
          inverted interval (effective_to > effective_from) and a pagination
          limit above 100.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and both units exist."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
          trigger:
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-T1", gestational_age_weeks: 30.0, birth_weight_grams: 1300, support_modality: "MOON_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { e_enum: $.data.error_id }
            - call: "POST /nicu-units"
              payload: { name: "Zero Beds", hospital_type: "COMMUNITY", staffed_bed_target: 0 }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_range: $.data.error_id }
            - call: "POST /surge-escalations"
              payload: { unit_id: "${unit_a}", requested_beds: 2, effective_from: "2026-08-02T00:00:00Z", effective_to: "2026-08-01T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { e_interval: $.data.error_id }
            - call: "GET /nicu-units"
              payload: { limit: 101 }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_page: $.data.error_id }
          assert:
            - "${e_enum} == ERR_INVALID_REQUEST with HTTP 400 — MOON_AIR is not in the support_modality enum"
            - "${e_range} == ERR_INVALID_REQUEST with HTTP 400 — staffed_bed_target must be >= 1"
            - "${e_interval} == ERR_INVALID_REQUEST with HTTP 400 — effective_to must be greater than effective_from, and the schema check at priority 5 fires before any capacity rule at priority 15"
            - "${e_page} == ERR_INVALID_REQUEST with HTTP 400 — limit must be within 1..100"
            - "GET /referrals reports total_count 0 and GET /surge-escalations reports total_count 0"

      - name: body_foreign_keys_must_resolve_before_use
        claim_type: flat_topology_fk_validation
        grounds:
          - complexity_profile.entity_topology
          - validations.priority_6
          - entities.StaffCredential.fields.unit_id
          - entities.Admission.fields.referral_id
          - entities.TransportRun.fields.reservation_id
          - entities.MilkBatch.fields.admission_id
        distinguishing_aspect: |
          The topology is flat, so parenthood is asserted only by body FKs — and
          each unresolvable FK returns the code of the entity it points at
          (ERR_UNIT_NOT_FOUND for unit_id, ERR_REFERRAL_NOT_FOUND for
          referral_id, ERR_RESERVATION_NOT_FOUND for reservation_id), never a
          generic 400.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, both units exist and Regional NICU A owns an in-service TRANSPORT_ISOLETTE."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_isolette
          trigger:
            - call: "POST /staff-credentials"
              payload: { unit_id: "00000000-0000-4000-8000-000000000000", credential_code: "RN_NICU_CORE", holder_reference: "rn-y", fte: 1.0, expires_on: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_fk_unit: $.data.error_id }
            - call: "POST /admissions"
              payload: { referral_id: "00000000-0000-4000-8000-000000000000" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { e_fk_ref: $.data.error_id }
            - call: "POST /transport-runs"
              payload: { reservation_id: "00000000-0000-4000-8000-000000000000", isolette_asset_id: "${isolette_a}", mode: "GROUND", crew_composition: ["TRANSPORT_RN"], depart_at: "2026-08-01T01:00:00Z", planned_return_at: "2026-08-01T05:00:00Z" }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { e_fk_res: $.data.error_id }
            - call: "POST /milk-batches"
              payload: { admission_id: "00000000-0000-4000-8000-000000000000", donor_type: "MOTHERS_OWN", volume_ml: 120.0, expressed_at: "2026-08-01T00:00:00Z", label_code: "LBL-Z" }
              as: BedsideNurse
              as_user_id: "nurse-1"
              captures: { e_fk_adm: $.data.error_id }
            - call: "POST /follow-up-enrollments"
              payload: { admission_id: "00000000-0000-4000-8000-000000000000", clinic_unit_id: "${unit_a}", target_appointment_date: "2026-09-01T09:00:00Z" }
              as: FollowUpCoordinator
              as_user_id: "fu-1"
              captures: { e_fk_enr: $.data.error_id }
          assert:
            - "${e_fk_unit} == ERR_UNIT_NOT_FOUND with HTTP 404"
            - "${e_fk_ref} == ERR_REFERRAL_NOT_FOUND with HTTP 404 — priority 6 is the first check that can be evaluated, because priority 4 has no receiving unit to compare the caller against until the referral resolves"
            - "${e_fk_res} == ERR_RESERVATION_NOT_FOUND with HTTP 404"
            - "${e_fk_adm} == ERR_ADMISSION_NOT_FOUND with HTTP 404"
            - "${e_fk_enr} == ERR_ADMISSION_NOT_FOUND with HTTP 404 — the admission FK is checked even though clinic_unit_id resolves"
            - "No StaffCredential, Admission, TransportRun, MilkBatch or FollowUpEnrollment row was created"

      - name: reservation_is_reachable_from_its_referral_and_its_unit
        claim_type: flat_topology_cross_reference_integrity
        grounds:
          - complexity_profile.entity_topology
          - endpoints.GET /bed-reservations
          - endpoints.GET /referrals
          - entities.BedReservation.fields.referral_id
          - entities.Referral.fields.reservation_id
        distinguishing_aspect: |
          A flat topology has no nested URLs, so every FK must be walkable
          backwards through a filtered list: the hold created by acceptance is
          found by referral_id AND by unit_id, and the referral's own
          reservation_id points back at the very same row.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, Regional NICU A is capability LEVEL_III with 4 staffed beds, and Community Hospital B exists."
            - "A LEVEL_III inbound referral (GA 29.0, 1200 g, ROOM_AIR) is PENDING at Regional NICU A."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - &c_ref_n
              call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-N1", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_n: $.data.id }
            - &c_get_unit_a
              call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_a: $.data.version }
            - &c_accept_n
              call: "POST /referrals/${ref_n}/accept"
              payload: { expected_unit_version: "${v_a}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_n: $.data.reservation_id }
          trigger:
            - call: "GET /bed-reservations"
              payload: { referral_id: "${ref_n}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_listed: "$.data[0].id" }
            - call: "GET /bed-reservations"
              payload: { unit_id: "${unit_a}", status: "HELD" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /referrals"
              payload: { receiving_unit_id: "${unit_a}", status: "ACCEPTED" }
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "GET /bed-reservations?referral_id=${ref_n} returns exactly 1 row and ${res_listed} == ${res_n}"
            - "BedReservation.${res_n}.unit_id == ${unit_a} and referral_id == ${ref_n}"
            - "BedReservation.${res_n}.status == HELD, bed_class == STAFFED, held_at == 2026-08-01T00:00:00Z, expires_at == 2026-08-01T04:00:00Z"
            - "GET /bed-reservations?unit_id=${unit_a}&status=HELD returns total_count 1"
            - "GET /referrals?receiving_unit_id=${unit_a}&status=ACCEPTED returns total_count 1 whose reservation_id == ${res_n}"
            - "NicuUnit.${unit_a}.held_bed_count == 1 and available_bed_count == 3"

  # ===========================================================================
  # 2. From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: initial_state_of_every_declared_machine
        claim_type: initial_state
        grounds:
          - state_machines[DesignationReview].initial_state
          - state_machines[Referral].initial_state
          - state_machines[TransportRun].initial_state
          - state_machines[Admission.care_status].initial_state
          - state_machines[Admission.infection_status].initial_state
          - state_machines[SurveillanceReport].initial_state
          - state_machines[SurgeEscalation].initial_state
        distinguishing_aspect: |
          Admission is the parallel machine: a freshly created admission starts
          on BOTH dimensions at once (care_status ADMITTED and infection_status
          SURVEILLANCE_CLEAR) from a single POST, and no dimension is null.
          FollowUpEnrollment's ENROLLED start is asserted in
          followup_eligibility_first_match_and_risk_tier.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with 4 staffed beds, an in-service isolette, and Community Hospital B exists."
            - "Two identical LEVEL_III inbound referrals (GA 29.0, 1200 g, ROOM_AIR) have been accepted at Regional NICU A."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_isolette
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
            - &c_ref_2
              call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-N2", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_2: $.data.id }
            - &c_get_unit_a2
              call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_a2: $.data.version }
            - &c_accept_2
              call: "POST /referrals/${ref_2}/accept"
              payload: { expected_unit_version: "${v_a2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_2: $.data.reservation_id }
          trigger:
            - &c_review_1
              call: "POST /designation-reviews"
              payload: { unit_id: "${unit_a}", requested_level: "LEVEL_III", assigned_nurse_count: 2 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { rev_1: $.data.id }
            - &c_run_n
              call: "POST /transport-runs"
              payload: { reservation_id: "${res_n}", isolette_asset_id: "${isolette_a}", mode: "GROUND", crew_composition: ["TRANSPORT_RN", "TRANSPORT_RT"], depart_at: "2026-08-01T01:00:00Z", planned_return_at: "2026-08-01T05:00:00Z" }
              as: TransportCoordinator
              as_user_id: "coord-1"
              captures: { run_n: $.data.id }
            - &c_admit_2
              call: "POST /admissions"
              payload: { referral_id: "${ref_2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_2: $.data.id }
            - &c_batch_1
              call: "POST /milk-batches"
              payload: { admission_id: "${adm_2}", donor_type: "MOTHERS_OWN", volume_ml: 120.0, expressed_at: "2026-08-01T00:00:00Z", label_code: "LBL-1" }
              as: BedsideNurse
              as_user_id: "nurse-1"
              captures: { batch_1: $.data.id }
            - call: "POST /surveillance-reports"
              payload: { unit_id: "${unit_a}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", reported_patient_days: 10, reported_central_line_days: 0 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { rep_1: $.data.id }
            - call: "POST /surge-escalations"
              payload: { unit_id: "${unit_a}", requested_beds: 2, effective_from: "2026-08-02T00:00:00Z", effective_to: "2026-08-03T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { esc_1: $.data.id }
          assert:
            - "DesignationReview.${rev_1}.status == DRAFT with submission_round == 0 and compliance_score == null"
            - "Referral.${ref_n} was created PENDING before it was accepted"
            - "TransportRun.${run_n}.status == ACTIVATED — creation does not dispatch"
            - "Admission.${adm_2}.care_status == ADMITTED AND infection_status == SURVEILLANCE_CLEAR in the same creation response"
            - "MilkBatch.${batch_1}.status == RECEIVED with administered_ml == 0.0, discarded_ml == 0.0, remaining_ml == 120.0 and pre_quarantine_status == null"
            - "SurveillanceReport.${rep_1}.status == DRAFT"
            - "SurgeEscalation.${esc_1}.status == REQUESTED"
            - "BedReservation.${res_n}.status == HELD — the reservation is born held, not occupied"

      - name: review_certifies_at_requested_level_and_designates_the_unit
        claim_type: valid_transition
        grounds:
          - state_machines[DesignationReview].transitions.submit
          - state_machines[DesignationReview].transitions.verify
          - state_machines[DesignationReview].transitions.certify
          - calculations.designation_compliance_score
          - calculations.designation_outcome
        distinguishing_aspect: |
          The whole DRAFT -> SUBMITTED -> VERIFIED -> CERTIFIED path walked with
          a fully compliant unit: staffing 100.00, equipment 100.00 and volume
          80.00 (400/500) give 0.45*100 + 0.35*100 + 0.20*80 = 96.00 >= 85.00,
          so outcome_level equals requested_level and the unit becomes
          DESIGNATED — the only path that reaches DESIGNATED.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z and the standards are declared."
            - "Regional NICU A (REGIONAL_CENTER, annual volume 400) holds valid NEO_BOARD 1.0 FTE and RN_NICU_CORE 3.0 FTE and in-service CONVENTIONAL_VENT and HFOV, so it satisfies every LEVEL_III requirement."
            - "The unit has no admissions, so required_nurse_count is 0 and any assigned_nurse_count satisfies the ratio."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_review_1
          trigger:
            - call: "POST /designation-reviews/${rev_1}/submit"
              payload: { assigned_nurse_count: 2 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /designation-reviews/${rev_1}/verify"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /designation-reviews/${rev_1}/certify"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-2"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "After submit: DesignationReview.${rev_1}.status == SUBMITTED, submission_round == 1, assessment_at == 2026-08-01T00:00:00Z, submitted_by_user_id == ${unit_a}:dir-1"
            - "The frozen scores are staffing_subscore == 100.00, equipment_subscore == 100.00, volume_subscore == 80.00 and compliance_score == 96.00"
            - "After verify: status == VERIFIED and verified_by_user_id == net-1"
            - "After certify: status == CERTIFIED, certified_by_user_id == net-2 and outcome_level == LEVEL_III"
            - "NicuUnit.${unit_a}.designated_level == LEVEL_III and designation_status == DESIGNATED"
            - "NicuUnit.${unit_a}.effective_level == LEVEL_III (min of designated LEVEL_III and capability LEVEL_III)"

      - name: conditional_pass_grants_one_level_below_the_request
        claim_type: side_effect_execution
        grounds:
          - state_machines[DesignationReview].transitions.certify
          - calculations.designation_outcome
          - calculations.designation_compliance_score
          - entities.NicuUnit.fields.designation_status
        distinguishing_aspect: |
          A score inside the conditional band is the ONLY way to reach
          designation_status CONDITIONAL: with NEO_BOARD revoked the credential
          coverage is 1/2, so staffing is 50.00 and the total is
          0.45*50 + 0.35*100 + 0.20*80 = 73.50 — under the 85.00 minimum but at
          or over the 70.00 floor — so certify lands on CERTIFIED while the unit
          is demoted to LEVEL_II / CONDITIONAL rather than DENIED.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z and the standards are declared."
            - "Regional NICU A holds NEO_BOARD and RN_NICU_CORE credentials and in-service CONVENTIONAL_VENT and HFOV, and has an open DRAFT review for LEVEL_III."
            - "No referral or admission exists at the unit, so the capability cascade has nothing to divert."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_review_1
          trigger:
            - call: "POST /staff-credentials/${cred_neo_a}/revoke"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /designation-reviews/${rev_1}/submit"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /designation-reviews/${rev_1}/verify"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /designation-reviews/${rev_1}/certify"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-2"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "StaffCredential.${cred_neo_a}.status == REVOKED with revoked_at == 2026-08-01T00:00:00Z"
            - "DesignationReview.${rev_1}.staffing_subscore == 50.00, equipment_subscore == 100.00, volume_subscore == 80.00 and compliance_score == 73.50"
            - "verify succeeds because 73.50 >= the LEVEL_III conditional_floor_score of 70.00"
            - "DesignationReview.${rev_1}.status == CERTIFIED and outcome_level == LEVEL_II — one step below the requested LEVEL_III"
            - "NicuUnit.${unit_a}.designation_status == CONDITIONAL and designated_level == LEVEL_II"
            - "NicuUnit.${unit_a}.capability_level == LEVEL_II and effective_level == LEVEL_II"

      - name: certify_from_submitted_denies_a_below_floor_score
        claim_type: precondition_enforcement
        grounds:
          - state_machines[DesignationReview].transitions.certify_denies_below_floor
          - state_machines[DesignationReview].transitions.verify
          - calculations.designation_compliance_score
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A bare unit scores 0.45*0 + 0.35*0 + 0.20*80 = 16.00, below the 70.00
          floor, so the verify precondition can never be met and the scaffold's
          escape hatch is the SUBMITTED -> DENIED certify variant: DENIED is
          reached WITHOUT ever passing through VERIFIED, and the following
          verify attempt is refused as a terminal-state violation.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z and the standards are declared."
            - "Regional NICU A (annual volume 400) holds NO credential and NO equipment asset, so both coverage factors are 0."
            - "A DRAFT LEVEL_III review exists for the unit."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_review_1
          trigger:
            - call: "POST /designation-reviews/${rev_1}/submit"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /designation-reviews/${rev_1}/certify"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /designation-reviews/${rev_1}/verify"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-2"
              captures: { e_after_denied: $.data.error_id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "DesignationReview.${rev_1}.staffing_subscore == 0.00, equipment_subscore == 0.00, volume_subscore == 80.00 and compliance_score == 16.00"
            - "certify moves the review straight from SUBMITTED to DENIED with denial_basis == SCORE_BELOW_FLOOR and outcome_level == null"
            - "verified_by_user_id and certified_by_user_id remain null — the VERIFIED state was never entered"
            - "${e_after_denied} == ERR_INVALID_STATE with HTTP 409"
            - "NicuUnit.${unit_a}.designation_status stays PROVISIONAL and designated_level stays LEVEL_III — only the certify-from-VERIFIED path rewrites the unit"

      - name: third_submit_denies_the_review_and_suspends_the_unit
        claim_type: cyclic
        grounds:
          - state_machines[DesignationReview].shape_note
          - state_machines[DesignationReview].transitions.deny_rounds_exhausted
          - state_machines[Referral].transitions.capability_loss_divert
          - errors[ERR_UNIT_SUSPENDED]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The SUBMITTED -> RETURNED -> SUBMITTED loop is bounded by
          submission_round, not by a wall clock: the third submit does not enter
          SUBMITTED at all, it lands on DENIED, suspends the unit, and diverts
          every queued referral — after which the suspended unit can no longer
          accept, which is how ERR_UNIT_SUSPENDED is reachable.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with 4 staffed beds."
            - "One LEVEL_III inbound referral (GA 29.0, 1200 g) is PENDING at Regional NICU A and a DRAFT LEVEL_III review is open."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_review_1
          trigger:
            - call: "POST /designation-reviews/${rev_1}/submit"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /designation-reviews/${rev_1}/return"
              payload: { return_reason: "Nurse roster attachment missing" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /designation-reviews/${rev_1}/submit"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /designation-reviews/${rev_1}/return"
              payload: { return_reason: "Equipment service log still unsigned" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /designation-reviews/${rev_1}/submit"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-N3", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_3: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_susp: $.data.version }
            - call: "POST /referrals/${ref_3}/accept"
              payload: { expected_unit_version: "${v_susp}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { e_susp: $.data.error_id }
          assert:
            - "The first two submits reach SUBMITTED with submission_round 1 then 2, and each return reaches RETURNED"
            - "The third submit returns 200 but DesignationReview.${rev_1}.status == DENIED with submission_round == 3, denial_basis == ROUNDS_EXHAUSTED and outcome_level == null"
            - "NicuUnit.${unit_a}.designation_status == SUSPENDED"
            - "Referral.${ref_n}.status == DIVERTED with decision_reason == CAPABILITY_LOST"
            - "${e_susp} == ERR_UNIT_SUSPENDED with HTTP 422 — the suspension gate at priority 11 fires even though the unit still has 4 free beds"
            - "Referral.${ref_3}.status stays PENDING and NicuUnit.${unit_a}.held_bed_count == 0"

      - name: terminal_lockdown_and_repeat_trigger_rejection
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[Referral].terminal_states
          - state_machines[Referral].transitions.accept
          - state_machines[Referral].transitions.withdraw
          - validations.priority_8
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Two different 409s from the same rule: accepting an already-ACCEPTED
          referral is a repeat-trigger rejection (the trigger exists but not
          from this state), and withdrawing an already-WITHDRAWN referral is
          terminal lockdown — and neither attempt double-releases the bed, so
          the ledger stays conserved.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, Regional NICU A is capability LEVEL_III with 4 staffed beds, and one LEVEL_III referral has been accepted (held_bed_count 1, available 3)."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
          trigger:
            - *c_get_unit_a2
            - call: "POST /referrals/${ref_n}/accept"
              payload: { expected_unit_version: "${v_a2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { e_reaccept: $.data.error_id }
            - call: "POST /referrals/${ref_n}/withdraw"
              payload: {}
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
            - call: "POST /referrals/${ref_n}/withdraw"
              payload: {}
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { e_rewithdraw: $.data.error_id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "${e_reaccept} == ERR_INVALID_STATE with HTTP 409 — accept is not a transition out of ACCEPTED, and the correct unit version does not rescue it"
            - "The first withdraw succeeds: Referral.${ref_n}.status == WITHDRAWN with decision_reason == FAMILY_CHOICE and BedReservation.${res_n}.status == RELEASED with released_reason == REFERRAL_WITHDRAWN"
            - "${e_rewithdraw} == ERR_INVALID_STATE with HTTP 409 — WITHDRAWN is terminal"
            - "NicuUnit.${unit_a}.held_bed_count == 0, occupied_bed_count == 0 and available_bed_count == 4 — released exactly once"

      - name: triggers_absent_from_the_transition_list_are_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines[Referral].transitions.provide-info
          - state_machines[Referral].transitions.revoke-acceptance
          - state_machines[DesignationReview].transitions.verify
          - state_machines[DesignationReview].transitions.return
          - validations.priority_8
        distinguishing_aspect: |
          Every rejected call here names a trigger that IS declared for the
          machine but not from the row's current state, so the failure mode is
          exactly ERR_INVALID_STATE (409) and not a 404 or a 400: PENDING has no
          provide-info and no revoke-acceptance, DRAFT has no verify and no
          return.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, Regional NICU A is capability LEVEL_III, one referral is PENDING at it and a DRAFT LEVEL_III review is open."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_review_1
          trigger:
            - call: "POST /referrals/${ref_n}/provide-info"
              payload: { support_modality: "CPAP" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { e_provide: $.data.error_id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_inv: $.data.version }
            - call: "POST /referrals/${ref_n}/revoke-acceptance"
              payload: { expected_unit_version: "${v_inv}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { e_revoke: $.data.error_id }
            - call: "POST /designation-reviews/${rev_1}/verify"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_verify: $.data.error_id }
            - call: "POST /designation-reviews/${rev_1}/return"
              payload: { return_reason: "Too early" }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_return: $.data.error_id }
          assert:
            - "${e_provide} == ERR_INVALID_STATE with HTTP 409 — provide-info only leaves INFO_REQUESTED"
            - "${e_revoke} == ERR_INVALID_STATE with HTTP 409 — and the referral's clinical fields are untouched: support_modality is still ROOM_AIR"
            - "${e_verify} == ERR_INVALID_STATE with HTTP 409 and ${e_return} == ERR_INVALID_STATE with HTTP 409"
            - "Referral.${ref_n}.status is still PENDING with info_request_rounds == 0 and DesignationReview.${rev_1}.status is still DRAFT with submission_round == 0"

      - name: accept_is_guarded_by_the_receiving_units_capability
        claim_type: guarded_transitions
        grounds:
          - state_machines[Referral].transitions.accept.preconditions
          - validations.priority_10
          - errors[ERR_LEVEL_CAPABILITY_INSUFFICIENT]
          - calculations.unit_capability_and_effective_level
          - calculations.referral_required_level
        distinguishing_aspect: |
          The guard is on a DIFFERENT entity than the one transitioning: the
          same LEVEL_III referral is accepted at Regional NICU A and refused at
          Community Hospital B, whose effective_level is LEVEL_I — and the
          refusal survives a perfectly fresh expected_unit_version, proving the
          check is capability and not concurrency.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z and the standards are declared."
            - "Regional NICU A is capability LEVEL_III; Community Hospital B has no credentials or equipment, so its capability_level and effective_level are LEVEL_I with 6 free beds."
            - "A LEVEL_III referral (GA 29.0, 1200 g, ROOM_AIR) has been created toward Community Hospital B."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_a}", receiving_unit_id: "${unit_b}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-G1", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_a}:ref-1"
              captures: { ref_g: $.data.id }
          trigger:
            - call: "GET /nicu-units/${unit_b}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_b}:intake-1"
              captures: { v_b: $.data.version }
            - call: "POST /referrals/${ref_g}/accept"
              payload: { expected_unit_version: "${v_b}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_b}:intake-1"
              captures: { e_cap: $.data.error_id }
            - call: "GET /nicu-units/${unit_b}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "Referral.${ref_g}.required_level == LEVEL_III and triage_priority == 71.25"
            - "${e_cap} == ERR_LEVEL_CAPABILITY_INSUFFICIENT with HTTP 422"
            - "Referral.${ref_g}.status stays PENDING and no BedReservation exists for it"
            - "NicuUnit.${unit_b}.version is unchanged and available_bed_count is still 6 — a refused guard consumes neither a bed nor a version"

      - name: credential_revocation_cascades_down_to_referral_and_admission
        claim_type: cascade_down
        grounds:
          - endpoints.POST /staff-credentials/{credential_id}/revoke
          - state_machines[Referral].transitions.capability_loss_divert
          - state_machines[Admission.care_status].transitions.capability_loss_requires_back_transfer
          - calculations.unit_capability_and_effective_level
        distinguishing_aspect: |
          One revoke touches three entity kinds in one response: the unit loses
          capability LEVEL_III -> LEVEL_II, the ACCEPTED LEVEL_III referral is
          DIVERTED and its hold RELEASED, and the LEVEL_III admission is pushed
          to BACK_TRANSFER_REQUIRED — while the already-COMPLETED referral
          behind that admission, being terminal, is left alone.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with 4 staffed beds."
            - "Referral CASE-N1 (GA 29.0, 1200 g) is ACCEPTED with a HELD bed; referral CASE-N2 was accepted and admitted, so admission current_care_level is LEVEL_III."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
            - *c_ref_2
            - *c_get_unit_a2
            - *c_accept_2
            - *c_admit_2
          trigger:
            - call: "POST /staff-credentials/${cred_neo_a}/revoke"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /referrals/${ref_n}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /admissions/${adm_2}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "NicuUnit.${unit_a}.capability_level == LEVEL_II, effective_level == LEVEL_II and staffing_compliant == false"
            - "Referral.${ref_n}.status == DIVERTED with decision_reason == CAPABILITY_LOST"
            - "BedReservation.${res_n}.status == RELEASED with released_reason == CAPABILITY_LOST"
            - "Admission.${adm_2}.care_status == BACK_TRANSFER_REQUIRED and current_care_level == LEVEL_III (1200 g)"
            - "Referral.${ref_2}.status stays COMPLETED — the divert cascade skips terminal referrals"
            - "NicuUnit.${unit_a}.held_bed_count == 0, occupied_bed_count == 1 and available_bed_count == 3"
            - "designated_level stays LEVEL_III: §1.5 declares the PROVISIONAL/DESIGNATED -> CONDITIONAL demotion only for the equipment out-of-service path, so the credential path leaves designation_status alone"

      - name: admission_syncs_the_units_bed_ledger
        claim_type: ledger_sync
        grounds:
          - endpoints.POST /admissions
          - state_machines[Referral].transitions.complete
          - calculations.bed_ledger
          - calculations.census_posture
        distinguishing_aspect: |
          Admission moves a bed between two ledger buckets rather than
          consuming a new one: held 1 / occupied 0 becomes held 0 / occupied 1
          with available unchanged at 3, so target + escalation ==
          occupied + held + available holds before and after.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with 4 staffed beds."
            - "Referral CASE-N1 is ACCEPTED with a HELD STAFFED reservation, so the unit reads held 1 / occupied 0 / available 3."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
          trigger:
            - call: "POST /admissions"
              payload: { referral_id: "${ref_n}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_n: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { v_after_admit: $.data.version }
            - call: "GET /bed-reservations/${res_n}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "Admission.${adm_n}.care_status == ADMITTED, unit_id == ${unit_a}, referral_id == ${ref_n}, version == 1"
            - "Admission.${adm_n}.transport_run_id == null — no ARRIVED run exists"
            - "Admission.${adm_n}.current_weight_grams == 1200 and current_care_level == LEVEL_III"
            - "Referral.${ref_n}.status == COMPLETED"
            - "BedReservation.${res_n}.status == OCCUPIED with released_reason == ADMITTED"
            - "NicuUnit.${unit_a}.held_bed_count == 0, occupied_bed_count == 1, available_bed_count == 3, census_posture == OPEN"
            - "${v_after_admit} == 3 — version 1 at creation, +1 at accept, +1 at admission"

      - name: transport_abort_compensates_without_promoting_the_queue
        claim_type: compensation
        grounds:
          - state_machines[TransportRun].transitions.abort
          - state_machines[Referral].transitions.transport_abort_returns_case
          - calculations.deferral_promotion_order
          - calculations.isolette_occupation_interval
        distinguishing_aspect: |
          The compensation is deliberately partial: abort releases the hold and
          returns the case to PENDING, but §1.3 pins that abort is NOT a
          promotion trigger — so the DEFERRED referral stays DEFERRED even
          though a bed is now free, and the isolette is only released after its
          45-minute ground decontamination buffer.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with an in-service isolette."
            - "The unit's staffed_bed_target has been reduced to 1, referral CASE-N1 holds that only bed, and referral CASE-N2 was deferred for want of a bed."
            - "An ACTIVATED ground transport run exists on CASE-N1's reservation."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_isolette
            - &c_patch_target_1
              call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { v_pre_patch: $.data.version }
            - &c_shrink_to_1
              call: "PATCH /nicu-units/${unit_a}"
              payload: { expected_unit_version: "${v_pre_patch}", staffed_bed_target: 1 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
            - *c_ref_2
            - &c_defer_2
              call: "POST /referrals/${ref_2}/defer"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - *c_run_n
          trigger:
            - call: "POST /transport-runs/${run_n}/abort"
              payload: { abort_reason: "CREW_UNAVAILABLE" }
              as: TransportCoordinator
              as_user_id: "coord-1"
            - call: "GET /referrals/${ref_2}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /equipment-assets/${isolette_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "TransportRun.${run_n}.status == ABORTED with abort_reason == CREW_UNAVAILABLE"
            - "BedReservation.${res_n}.status == RELEASED with released_reason == TRANSPORT_ABORTED"
            - "Referral.${ref_n}.status == PENDING with decision_reason == TRANSPORT_ABORTED — the case is back in the queue, not terminal"
            - "Referral.${ref_2}.status is still DEFERRED with decision_reason == NO_BED — abort is not in the promotion trigger list"
            - "EquipmentAsset.${isolette_a}.decontamination_ready_at == 2026-08-01T00:45:00Z (current_utc + 45 ground minutes, not planned_return_at + 45)"
            - "NicuUnit.${unit_a}.held_bed_count == 0, available_bed_count == 1 and deferral_queue_depth == 1 — a free bed with a queued case, left unpromoted on purpose"

      - name: sweep_expires_the_hold_then_promotes_the_queue
        claim_type: side_effect_execution
        grounds:
          - endpoints.POST /ops/run-capacity-sweep
          - state_machines[Referral].transitions.hold_expiry_divert
          - state_machines[Referral].transitions.promote
          - calculations.hold_expiry_window
          - calculations.deferral_promotion_order
        distinguishing_aspect: |
          Ordering inside one sweep is load-bearing: the expiry must run before
          the promotion or the freed bed would not exist yet. At exactly
          04:00:00Z (held_at + 240 minutes for an inbound hold) the expiry
          fires, and the same response promotes the deferred case onto the bed
          it just released, with a fresh 240-minute window of its own.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III."
            - "staffed_bed_target has been reduced to 1; referral CASE-N1 is ACCEPTED holding that bed with expires_at 2026-08-01T04:00:00Z; referral CASE-N2 is DEFERRED."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_patch_target_1
            - *c_shrink_to_1
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
            - *c_ref_2
            - *c_defer_2
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T04:00:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /ops/run-capacity-sweep"
              payload: { unit_id: "${unit_a}" }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { swept_holds: $.data.holds_expired, swept_promotions: $.data.referrals_promoted, swept_units: $.data.units_touched }
            - call: "GET /referrals/${ref_2}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { res_promoted: $.data.reservation_id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "${swept_holds} == 1, ${swept_promotions} == 1 and ${swept_units} == 1; escalations_expired == 0 and enrollments_lapsed == 0"
            - "Referral.${ref_n}.status == DIVERTED with decision_reason == HOLD_EXPIRED — expiry fires AT expires_at, not strictly after"
            - "BedReservation.${res_n}.status == EXPIRED with released_reason == HOLD_EXPIRED"
            - "Referral.${ref_2}.status == ACCEPTED with decision_reason == null"
            - "BedReservation.${res_promoted}.status == HELD, bed_class == STAFFED, held_at == 2026-08-01T04:00:00Z and expires_at == 2026-08-01T08:00:00Z"
            - "NicuUnit.${unit_a}.held_bed_count == 1, available_bed_count == 0, census_posture == CLOSED and deferral_queue_depth == 0"

      - name: referral_info_request_loop_is_bounded
        claim_type: cyclic
        grounds:
          - state_machines[Referral].transitions.request-info
          - state_machines[Referral].transitions.divert_info_exhausted
          - state_machines[Referral].shape_note
        distinguishing_aspect: |
          The PENDING -> INFO_REQUESTED -> PENDING loop terminates on the third
          request rather than looping forever.
        excluded_because:
          difficulty_instance: referral_info_request_cycle_bounded_at_two_rounds
          rationale: |
            That instance already walks both completed rounds, asserts
            info_request_rounds 0/1/2 across the loop, and shows the third
            request-info landing on DIVERTED with INFO_ROUNDS_EXHAUSTED instead
            of re-entering INFO_REQUESTED.

      - name: transport_mode_forks_then_joins_at_on_scene
        claim_type: branching
        grounds:
          - state_machines[TransportRun].transitions.dispatch_ground
          - state_machines[TransportRun].transitions.dispatch_air
          - state_machines[TransportRun].transitions.on-scene
        distinguishing_aspect: |
          Both dispatch branches carry different preconditions and different
          decontamination buffers, yet on-scene accepts either branch.
        excluded_because:
          difficulty_instance: transport_run_mode_fork_joins_at_on_scene
          rationale: |
            That instance dispatches one GROUND and one ROTOR_WING run, asserts
            the 45- versus 90-minute decontamination_ready_at values that
            distinguish the branches, and then joins both at ON_SCENE.

      - name: admission_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines[Admission.care_status]
          - state_machines[Admission.infection_status]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          A care_status transition must not move infection_status and vice
          versa, and every combination is legal.
        excluded_because:
          difficulty_instance: admission_care_and_infection_dimensions_advance_independently
          rationale: |
            That instance interleaves care-updates with infection-events and
            asserts each dimension's value after every step, including the
            CONFIRMED_CLABSI-with-STABILIZED combination.

      - name: capability_cascade_skips_terminal_children
        claim_type: conditional_cascade
        grounds:
          - endpoints.POST /equipment-assets/{asset_id}/out-of-service
          - state_machines[Referral].transitions.capability_loss_divert
          - state_machines[TransportRun].transitions.abort
        distinguishing_aspect: |
          The out-of-service cascade applies only to referrals whose
          required_level now exceeds effective_level and only to non-terminal
          runs.
        excluded_because:
          difficulty_instance: equipment_out_of_service_cascades_to_transport_abort
          rationale: |
            That instance takes an HFOV out of service with a mixed population
            of referrals and runs, and asserts that the LEVEL_II referral and
            the already-ARRIVED run are untouched while the LEVEL_III referral
            is diverted and its in-flight run aborted.

      - name: back_transfer_completion_bubbles_into_the_source_unit
        claim_type: bubble_up
        grounds:
          - state_machines[Admission.care_status].transitions.back_transfer_completed
          - endpoints.POST /admissions/{admission_id}/back-transfer-referrals
          - calculations.deferral_promotion_order
        distinguishing_aspect: |
          Admitting the back-transfer at the community hospital is what closes
          the source admission and frees the regional bed.
        excluded_because:
          difficulty_instance: back_transfer_admission_cascades_to_queue_promotion
          rationale: |
            That instance walks the full four-level chain (community admission
            -> source admission TRANSFERRED -> source unit counters re-derived
            -> deferred referral promoted) and asserts every level in the same
            response.

  # ===========================================================================
  # 3. From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:

      - name: credential_expiry_and_service_due_are_pure_clock_functions
        claim_type: input_set_filtering
        grounds:
          - entities.StaffCredential.fields.status
          - entities.EquipmentAsset.fields.status
          - calculations.unit_capability_and_effective_level
          - endpoints.POST /equipment-assets/{asset_id}/service
        distinguishing_aspect: |
          Capability collapses with NO write at all: moving the clock to exactly
          the credentials' expires_on (<=, so the boundary instant is already
          expired) drops the unit from LEVEL_III to LEVEL_I on the next read,
          yet the queued referral is NOT diverted — the divert cascade belongs to
          explicit revoke/out-of-service writes, so the referral only fails at
          the next acceptance attempt.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with credentials expiring 2027-01-01T00:00:00Z and assets last serviced 2026-07-01T00:00:00Z on a 365-day interval."
            - "One LEVEL_III referral (GA 29.0, 1200 g) is PENDING at Regional NICU A."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /staff-credentials/${cred_rn_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_expired: $.data.version, cap_expired: $.data.capability_level }
            - call: "POST /referrals/${ref_n}/accept"
              payload: { expected_unit_version: "${v_expired}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { e_expired_cap: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-07-01T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "GET /equipment-assets/${vent_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /equipment-assets/${vent_a}/service"
              payload: { serviced_at: "2027-07-01T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
          assert:
            - "StaffCredential.${cred_rn_a}.status == EXPIRED at exactly 2027-01-01T00:00:00Z (expires_on <= current_utc) with revoked_at still null"
            - "${cap_expired} == LEVEL_I and NicuUnit.${unit_a}.effective_level == LEVEL_I and staffing_compliant == false"
            - "${v_expired} == 1 — the collapse is a derivation, so the unit's version never moved"
            - "Referral.${ref_n}.status is still PENDING with decision_reason == null — clock-driven expiry does not run the divert cascade"
            - "${e_expired_cap} == ERR_LEVEL_CAPABILITY_INSUFFICIENT with HTTP 422 — the stale capability is caught at the acceptance instead"
            - "At 2027-07-01T00:00:00Z EquipmentAsset.${vent_a}.next_service_due_at == 2027-07-01T00:00:00Z and status == SERVICE_DUE (<= boundary again)"
            - "After service, EquipmentAsset.${vent_a}.last_service_at == 2027-07-01T00:00:00Z, next_service_due_at == 2028-06-30T00:00:00Z (365 days across the 2028 leap year) and status == IN_SERVICE"

      - name: staffed_beds_fill_before_escalation_beds
        claim_type: waterfall_allocation
        grounds:
          - calculations.bed_ledger
          - calculations.surge_escalation_authorization
          - entities.BedReservation.fields.bed_class
          - state_machines[SurgeEscalation].transitions.authorize
        distinguishing_aspect: |
          bed_class is decided by the PRE-STATE of the waterfall, not by how
          many beds are left: with target 1 and one occupied bed, the next two
          holds are both ESCALATION even though escalation beds are the only
          ones free — and the escalation's own tier is computed from occupied
          beds only (holds excluded), giving census_ratio 1.0000 -> TIER_3.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with RN_NICU_CORE 3.0 FTE."
            - "staffed_bed_target has been reduced to 1 and referral CASE-N1 has been accepted and admitted, so occupied 1 / held 0 / available 0."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_patch_target_1
            - *c_shrink_to_1
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
            - call: "POST /admissions"
              payload: { referral_id: "${ref_n}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_w: $.data.id }
          trigger:
            - call: "POST /surge-escalations"
              payload: { unit_id: "${unit_a}", requested_beds: 2, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-02T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { esc_w: $.data.id }
            - call: "POST /surge-escalations/${esc_w}/authorize"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
            - *c_ref_2
            - *c_get_unit_a2
            - *c_accept_2
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-N4", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_4: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_a4: $.data.version }
            - call: "POST /referrals/${ref_4}/accept"
              payload: { expected_unit_version: "${v_a4}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_4: $.data.reservation_id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "SurgeEscalation.${esc_w}.census_ratio_at_request == 1.0000 (occupied 1 / (target 1 + 0 other active escalation beds)), escalation_tier == TIER_3, staffing_waiver_ratio == 1.50"
            - "authorized_beds == 2 = min(requested 2, capacity_from_staff floor(3.0 * 1.50 * 2) = 9 minus committed 1, TIER_3 cap 6) and status == ACTIVE"
            - "BedReservation.${res_n}.bed_class == STAFFED — taken while occupied+held (0) was below target (1)"
            - "BedReservation.${res_2}.bed_class == ESCALATION and BedReservation.${res_4}.bed_class == ESCALATION"
            - "NicuUnit.${unit_a}.escalation_bed_count == 2, occupied_bed_count == 1, held_bed_count == 2, available_bed_count == 0"
            - "The ledger is conserved: staffed_bed_target 1 + escalation 2 == occupied 1 + held 2 + available 0"
            - "NicuUnit.${unit_a}.census_posture == CLOSED and required_nurse_count == 1 (ceil(1 / (2.0 * 1.50)))"

      - name: census_posture_at_and_around_the_constrained_band
        claim_type: threshold
        grounds:
          - calculations.census_posture
          - calculations.bed_ledger
          - entities.NicuUnit.fields.census_posture
        distinguishing_aspect: |
          The CONSTRAINED band is floor(target * 0.20), so at target 5 it is
          exactly available == 1: available 2 is still OPEN, available 1 is
          CONSTRAINED and available 0 is CLOSED — three postures walked one hold
          at a time with no other state change.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III."
            - "staffed_bed_target has been raised to 5 and five LEVEL_III referrals (GA 29.0, 1200 g) are PENDING at the unit."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { v_pre_grow: $.data.version }
            - call: "PATCH /nicu-units/${unit_a}"
              payload: { expected_unit_version: "${v_pre_grow}", staffed_bed_target: 5 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - *c_ref_n
            - *c_ref_2
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-P3", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_p3: $.data.id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-P4", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_p4: $.data.id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-P5", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_p5: $.data.id }
          trigger:
            - *c_get_unit_a
            - *c_accept_n
            - *c_get_unit_a2
            - *c_accept_2
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_p3: $.data.version }
            - call: "POST /referrals/${ref_p3}/accept"
              payload: { expected_unit_version: "${v_p3}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_p4: $.data.version, posture_open: $.data.census_posture }
            - call: "POST /referrals/${ref_p4}/accept"
              payload: { expected_unit_version: "${v_p4}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_p5: $.data.version, posture_constrained: $.data.census_posture }
            - call: "POST /referrals/${ref_p5}/accept"
              payload: { expected_unit_version: "${v_p5}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { posture_closed: $.data.census_posture }
          assert:
            - "After three holds available_bed_count == 2 and ${posture_open} == OPEN — 2 is above the floor(5 * 0.20) == 1 threshold"
            - "After four holds available_bed_count == 1 and ${posture_constrained} == CONSTRAINED — at the threshold, not above it"
            - "After five holds available_bed_count == 0 and ${posture_closed} == CLOSED"
            - "Every hold is bed_class STAFFED and held_bed_count == 5 with occupied_bed_count == 0"
            - "${v_p5} == 6 — version 1, +1 for the PATCH, +1 for each of the first four accepts; the fifth accept leaves the unit at version 7"

      - name: back_transfer_is_judged_on_current_weight_not_birth_weight
        claim_type: input_set_filtering
        grounds:
          - calculations.referral_required_level
          - calculations.triage_priority
          - endpoints.POST /admissions/{admission_id}/back-transfer-referrals
          - calculations.developmental_bundle_score
        distinguishing_aspect: |
          The back-transfer variant deliberately DROPS two inputs the inbound
          variant uses: weight_basis_grams comes from current_weight_grams
          (1900 g, not the 1200 g birth weight) and ga_term is suppressed, so a
          29-week ex-preemie comes out LEVEL_I with triage 33.75 (kind_pts 0)
          instead of LEVEL_III / 71.25 — otherwise no graduate could ever go
          home.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III."
            - "Referral CASE-N1 (GA 29.0, birth weight 1200 g, ROOM_AIR, required LEVEL_III) has been accepted and admitted at Regional NICU A."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
            - call: "POST /admissions"
              payload: { referral_id: "${ref_n}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_bt: $.data.id }
          trigger:
            - call: "POST /admissions/${adm_bt}/care-updates"
              payload: { current_weight_grams: 1900, support_modality: "ROOM_AIR" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - &c_round_1
              call: "POST /admissions/${adm_bt}/developmental-rounds"
              payload: { kangaroo_care_minutes: 60, family_presence_minutes: 240, cluster_care_compliant: true, light_cycling_compliant: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - &c_round_2
              call: "POST /admissions/${adm_bt}/developmental-rounds"
              payload: { kangaroo_care_minutes: 60, family_presence_minutes: 240, cluster_care_compliant: true, light_cycling_compliant: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_bt}/back-transfer-ready"
              payload: { back_transfer_attestation_note: "Weight 1900 g, room air, feeding fully, risk-appropriate for Community Hospital B" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "GET /admissions/${adm_bt}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_adm_bt: $.data.version }
            - call: "POST /admissions/${adm_bt}/back-transfer-referrals"
              payload: { expected_admission_version: "${v_adm_bt}", receiving_unit_id: "${unit_b}", case_reference: "CASE-BT1" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { ref_bt: $.data.id }
          assert:
            - "After the care-update Admission.${adm_bt}.care_status == STABILIZED, current_weight_grams == 1900 and current_care_level == LEVEL_I"
            - "After two rounds Admission.${adm_bt}.developmental_bundle_score == 60.00 (0.35*66.67 + 0.25*66.67 + 0.20*100 + 0.20*0) — exactly the readiness boundary"
            - "back-transfer-ready succeeds: care_status == BACK_TRANSFER_READY with the attestation note stored"
            - "Referral.${ref_bt}.referral_kind == BACK_TRANSFER, source_admission_id == ${adm_bt}, receiving_unit_id == ${unit_b}"
            - "Referral.${ref_bt}.weight_basis_grams == 1900 — current weight, not the 1200 g birth weight"
            - "Referral.${ref_bt}.current_support_level == LEVEL_I, anticipated_need_level == LEVEL_I, required_level == LEVEL_I and level_basis == CURRENT_SUPPORT — the 29-week ga_term is suppressed"
            - "Referral.${ref_bt}.triage_priority == 33.75 (0.40*25 + 0.25*75 + 0.20*25 + 0.15*0) and maternal_transfer_preferred == false"

      - name: milk_expiry_constants_differ_by_donor_type
        claim_type: constants_applied
        grounds:
          - calculations.milk_expiry
          - entities.MilkBatch.fields.expires_at
          - errors[ERR_MILK_EXPIRED]
          - validations.priority_11
        distinguishing_aspect: |
          Two batches expressed at the same instant expire 72 hours apart
          because only the donor constant differs: at 2026-08-02T00:00:00Z the
          DONOR_PASTEURIZED batch is expired exactly on its 24-hour boundary
          (expires_at <= current_utc) and refuses administration, while the
          MOTHERS_OWN batch still has 72 hours and feeds normally.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, Regional NICU A is capability LEVEL_III, and referral CASE-N2 has been accepted and admitted."
            - "Both a MOTHERS_OWN batch (120.0 ml, LBL-1) and a DONOR_PASTEURIZED batch (60.0 ml, LBL-2) were received at 2026-08-01T00:00:00Z and verified by a second nurse."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_2
            - *c_get_unit_a
            - *c_accept_2
            - *c_admit_2
            - *c_batch_1
            - &c_batch_donor
              call: "POST /milk-batches"
              payload: { admission_id: "${adm_2}", donor_type: "DONOR_PASTEURIZED", volume_ml: 60.0, expressed_at: "2026-08-01T00:00:00Z", label_code: "LBL-2" }
              as: BedsideNurse
              as_user_id: "nurse-1"
              captures: { batch_d: $.data.id }
            - &c_verify_1
              call: "POST /milk-batches/${batch_1}/verify"
              payload: { label_code: "LBL-1" }
              as: BedsideNurse
              as_user_id: "nurse-2"
            - call: "POST /milk-batches/${batch_d}/verify"
              payload: { label_code: "LBL-2" }
              as: BedsideNurse
              as_user_id: "nurse-2"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /milk-batches/${batch_d}/administrations"
              payload: { volume_ml: 30.0 }
              as: BedsideNurse
              as_user_id: "nurse-1"
              captures: { e_milk_exp: $.data.error_id }
            - call: "POST /milk-batches/${batch_1}/administrations"
              payload: { volume_ml: 30.0 }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "GET /admissions/${adm_2}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "MilkBatch.${batch_1}.expires_at == 2026-08-05T00:00:00Z (expressed + 96 h) and MilkBatch.${batch_d}.expires_at == 2026-08-02T00:00:00Z (expressed + 24 h)"
            - "Both batches read status VERIFIED with verified_by_user_id == nurse-2, distinct from received_by_user_id nurse-1"
            - "${e_milk_exp} == ERR_MILK_EXPIRED with HTTP 422 — refused AT expires_at, not one second later"
            - "MilkBatch.${batch_d}.administered_ml == 0.0 and remaining_ml == 60.0"
            - "MilkBatch.${batch_1}.status == PARTIALLY_ADMINISTERED with administered_ml == 30.0 and remaining_ml == 90.0"
            - "Admission.${adm_2}.milk_administered_ml == 30.0 — only the successful administration reached the derived total"

      - name: followup_eligibility_basis_risk_tier_and_window
        claim_type: correct_result
        grounds:
          - calculations.followup_eligibility
          - calculations.followup_clinic_day_capacity
          - state_machines[FollowUpEnrollment].transitions.schedule
          - state_machines[FollowUpEnrollment].transitions.record-attendance
          - state_machines[Admission.care_status].transitions.discharge_home
        distinguishing_aspect: |
          An 850 g graduate matches the FIRST rule (BW_UNDER_1500) and is
          nevertheless HIGH risk_tier, because the tier is a second, independent
          test (BW < 1000) rather than a property of the basis — and the
          appointment window opens 14 days after discharge, so the discharge day
          itself is outside it.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with a follow-up clinic capacity of 2 per day."
            - "A referral for a 26-week 850 g infant on room air has been accepted and admitted at Regional NICU A."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-HR1", gestational_age_weeks: 26.0, birth_weight_grams: 850, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_hr: $.data.id }
            - *c_get_unit_a
            - call: "POST /referrals/${ref_hr}/accept"
              payload: { expected_unit_version: "${v_a}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { res_hr: $.data.reservation_id }
            - call: "POST /admissions"
              payload: { referral_id: "${ref_hr}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_hr: $.data.id }
          trigger:
            - call: "POST /admissions/${adm_hr}/care-updates"
              payload: { current_weight_grams: 2100, support_modality: "ROOM_AIR" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_hr}/discharge"
              payload: { disposition: "HOME" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /follow-up-enrollments"
              payload: { admission_id: "${adm_hr}", clinic_unit_id: "${unit_a}", target_appointment_date: "2026-09-01T09:00:00Z" }
              as: FollowUpCoordinator
              as_user_id: "fu-1"
              captures: { enr_hr: $.data.id }
            - call: "POST /follow-up-enrollments/${enr_hr}/schedule"
              payload: { confirmed_appointment_date: "2026-09-01T09:00:00Z" }
              as: FollowUpCoordinator
              as_user_id: "fu-1"
            - call: "POST /follow-up-enrollments/${enr_hr}/record-attendance"
              payload: { attended: true }
              as: FollowUpCoordinator
              as_user_id: "fu-1"
          assert:
            - "Referral.${ref_hr}.required_level == LEVEL_III and triage_priority == 92.50 (0.40*75 + 0.25*100 + 0.20*100 + 0.15*50)"
            - "After discharge Admission.${adm_hr}.care_status == DISCHARGED, discharge_disposition == HOME, discharged_at == 2026-08-01T00:00:00Z and high_risk_graduate == true"
            - "FollowUpEnrollment.${enr_hr}.status == ENROLLED at creation with eligibility_basis == BW_UNDER_1500 and risk_tier == HIGH (850 g < 1000 g)"
            - "FollowUpEnrollment.${enr_hr}.appointment_window_start == 2026-08-15T00:00:00Z and appointment_window_end == 2026-10-30T00:00:00Z"
            - "After schedule: status == SCHEDULED with confirmed_appointment_date == 2026-09-01T09:00:00Z"
            - "After record-attendance: status == ATTENDED with attendance_recorded_at == 2026-08-01T00:00:00Z"
            - "NicuUnit.${unit_a}.occupied_bed_count == 0 and available_bed_count == 4 — the discharge returned the bed"

      - name: deferral_queue_tie_breaks_on_created_at
        claim_type: chronological
        grounds:
          - calculations.deferral_promotion_order
          - calculations.triage_priority
          - endpoints.GET /nicu-units/{unit_id}/deferral-queue
          - state_machines[Referral].transitions.promote
        distinguishing_aspect: |
          Two referrals with DELIBERATELY equal triage_priority 71.25 (GA 29.0 /
          1200 g and GA 30.0 / 1250 g land on the same weighted score) are
          separated only by created_at ascending, so the earlier one is ranked
          first and is the single case the sweep promotes onto the one freed bed.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III."
            - "staffed_bed_target has been reduced to 1 and CASE-N1 holds that bed with expires_at 2026-08-01T04:00:00Z."
            - "CASE-TIE-EARLY (GA 30.0, 1250 g) was created first and deferred; CASE-TIE-LATE (GA 29.0, 1200 g) was created second and deferred."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_patch_target_1
            - *c_shrink_to_1
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-TIE-EARLY", gestational_age_weeks: 30.0, birth_weight_grams: 1250, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_early: $.data.id }
            - call: "POST /referrals/${ref_early}/defer"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-TIE-LATE", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_late: $.data.id }
            - call: "POST /referrals/${ref_late}/defer"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
          trigger:
            - call: "GET /nicu-units/${unit_a}/deferral-queue"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { ranked_first: "$.data[0].id", ranked_first_priority: "$.data[0].triage_priority" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T04:00:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /ops/run-capacity-sweep"
              payload: { unit_id: "${unit_a}" }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { tie_promotions: $.data.referrals_promoted }
            - call: "GET /referrals/${ref_late}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "Referral.${ref_early}.triage_priority == 71.25 and Referral.${ref_late}.triage_priority == 71.25 — an exact tie by construction"
            - "${ranked_first} == ${ref_early} and ${ranked_first_priority} == 71.25 — created_at ascending breaks the tie, not id order and not weight"
            - "${tie_promotions} == 1 — the loop stops as soon as committed_available falls below 1"
            - "Referral.${ref_early}.status == ACCEPTED with a HELD reservation expiring 2026-08-01T08:00:00Z"
            - "Referral.${ref_late}.status is still DEFERRED with decision_reason == NO_BED"
            - "NicuUnit.${unit_a}.deferral_queue_depth == 1 and available_bed_count == 0"

      - name: designation_score_weight_precision
        claim_type: precision
        grounds:
          - calculations.designation_compliance_score
          - calculations.designation_outcome
        distinguishing_aspect: |
          Half-up rounding to 2 decimals over four weighted terms plus the
          transport cap at 69.99.
        excluded_because:
          difficulty_instance: designation_score_multi_factor_with_transport_cap
          rationale: |
            That instance walks four score assemblies (96.00 / 84.75 / the
            capped 69.99 / the volume half-rule) and asserts each subscore and
            total to two decimals, which is exactly the precision claim.

      - name: required_nurse_count_ceilings_per_band
        claim_type: correct_result
        grounds:
          - calculations.required_nurse_count
        distinguishing_aspect: |
          Per-band ceilings summed, not a summed fraction ceilinged once.
        excluded_because:
          difficulty_instance: required_nurse_count_per_band_ceiling_order
          rationale: |
            That instance builds a three-band census and asserts the pinned
            per-band result (3) against the wrong sum-then-ceil result (2),
            including the surge-waiver variant.

      - name: surveillance_rate_variants_and_empty_denominators
        claim_type: variant_divergence
        grounds:
          - calculations.clabsi_surveillance_rates
        distinguishing_aspect: |
          Crude versus device-adjusted rates on identical data, and the
          zero-denominator fallbacks.
        excluded_because:
          difficulty_instance: clabsi_crude_versus_device_adjusted_rate
          rationale: |
            That instance asserts both variants on one report plus the
            applied-variant selection; the denominator boundaries are asserted
            by surveillance_denominators_at_zero_and_empty_cohort.

      - name: variant_selection_is_reconciled_when_information_arrives
        claim_type: reconciliation
        grounds:
          - calculations.referral_required_level
          - state_machines[Referral].transitions.provide-info
        distinguishing_aspect: |
          provide-info recomputes both variants and can move required_level and
          level_basis after the fact.
        excluded_because:
          difficulty_instance: referral_current_support_vs_anticipated_need_level
          rationale: |
            That instance drives the same referral through provide-info and
            asserts the recomputed current_support_level, anticipated_need_level,
            level_basis and triage_priority delta.

      - name: gates_read_committed_beds_not_the_forecast
        claim_type: variant_selection
        grounds:
          - calculations.capacity_projection
          - calculations.bed_ledger
        distinguishing_aspect: |
          The forecast variant is advisory only; acceptance gates read the
          committed variant.
        excluded_because:
          difficulty_instance: capacity_committed_versus_forecast_beds
          rationale: |
            That instance shows a forecast with free beds while the committed
            ledger is full, and asserts that the acceptance is still refused.

      - name: isolette_interval_adjacency_and_overlap
        claim_type: interval_merge
        grounds:
          - calculations.isolette_occupation_interval
        distinguishing_aspect: |
          Half-open intervals plus the decontamination buffer decide whether two
          runs may share an isolette.
        excluded_because:
          difficulty_instance: isolette_interval_half_open_with_decontamination_buffer
          rationale: |
            That instance tests the exact touch point (a run departing at the
            previous run's decontamination_ready_at succeeds, one minute earlier
            fails), which is the adjacency-versus-overlap claim.

      - name: stabilization_targets_at_their_bounds
        claim_type: threshold
        grounds:
          - calculations.stabilization_score
        distinguishing_aspect: |
          Each of the four physiologic targets tested at its inclusive bound.
        excluded_because:
          difficulty_instance: stabilization_targets_met_exactly_at_every_bound
          rationale: |
            That instance posts values sitting exactly on all four bounds and
            asserts score 100 with bundle_complete true, then walks one value
            off each bound.

      - name: clinic_capacity_is_a_daily_aggregate
        claim_type: aggregation
        grounds:
          - calculations.followup_clinic_day_capacity
        distinguishing_aspect: |
          Capacity is per UTC calendar day across all bookings, not per
          appointment instant.
        excluded_because:
          difficulty_instance: clinic_calendar_day_capacity_is_aggregate_not_pointwise
          rationale: |
            That instance books different times on the same calendar day until
            ERR_CLINIC_DAY_FULL fires, then books the next day successfully.

  # ===========================================================================
  # 4. From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:

      - name: unauthenticated_and_wrong_role_requests_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_1
          - validations.priority_2
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          Priority 1 fires before priority 2 and both fire before anything else:
          a missing header returns 401 even when the target id does not exist,
          and a present-but-wrong role returns 403 rather than leaking whether
          the row exists.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A exists."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
          trigger:
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: ""
              as_user_id: "net-1"
              captures: { e_norole: $.data.error_id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: ""
              captures: { e_nouser: $.data.error_id }
            - call: "POST /nicu-units"
              payload: { name: "Nurse Built Unit", hospital_type: "COMMUNITY", staffed_bed_target: 2 }
              as: BedsideNurse
              as_user_id: "nurse-1"
              captures: { e_role_unit: $.data.error_id }
            - call: "POST /designation-standards"
              payload: { level: "LEVEL_IV", required_credential_codes: [], required_equipment_codes: [], nurse_patient_ratio_denominator: 1.0, min_annual_volume: 1, transport_capability_required: false, min_compliance_score: 10.00, conditional_floor_score: 5.00 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { e_role_std: $.data.error_id }
          assert:
            - "${e_norole} == ERR_UNAUTHENTICATED with HTTP 401 (empty X-User-Role)"
            - "${e_nouser} == ERR_UNAUTHENTICATED with HTTP 401 (empty X-User-ID)"
            - "${e_role_unit} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — POST /nicu-units is NetworkAdmin-exclusive"
            - "${e_role_std} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — a UnitDirector cannot write network standards"
            - "GET /nicu-units reports total_count 1 and GET /designation-standards total_count 3 — nothing was written"

      - name: unit_scoped_caller_cannot_act_for_another_unit
        claim_type: violation_to_error
        grounds:
          - validations.priority_4
          - rbac.identity_convention
          - errors[ERR_UNIT_SCOPE_VIOLATION]
          - rbac.roles[UnitDirector].scope
          - rbac.roles[IntakeNeonatologist].scope
        distinguishing_aspect: |
          The scope check at priority 4 runs BEFORE the schema check at 5 and
          before OCC at 7: Community Hospital B's director is refused a PATCH of
          Regional NICU A even though its expected_unit_version is perfectly
          fresh, and B's intake neonatologist cannot accept a referral whose
          receiving unit is A.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, Regional NICU A is capability LEVEL_III and Community Hospital B exists."
            - "A LEVEL_III referral is PENDING at Regional NICU A."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { v_scope: $.data.version }
          trigger:
            - call: "PATCH /nicu-units/${unit_a}"
              payload: { expected_unit_version: "${v_scope}", staffed_bed_target: 99 }
              as: UnitDirector
              as_user_id: "${unit_b}:dir-1"
              captures: { e_scope_patch: $.data.error_id }
            - call: "POST /referrals/${ref_n}/accept"
              payload: { expected_unit_version: "${v_scope}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_b}:intake-1"
              captures: { e_scope_accept: $.data.error_id }
            - call: "POST /staff-credentials"
              payload: { unit_id: "${unit_a}", credential_code: "NNP", holder_reference: "nnp-1", fte: 1.0, expires_on: "2027-01-01T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_b}:dir-1"
              captures: { e_scope_cred: $.data.error_id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
          assert:
            - "${e_scope_patch} == ERR_UNIT_SCOPE_VIOLATION with HTTP 403"
            - "${e_scope_accept} == ERR_UNIT_SCOPE_VIOLATION with HTTP 403 — the receiving unit, not the caller's own unit, defines the scope"
            - "${e_scope_cred} == ERR_UNIT_SCOPE_VIOLATION with HTTP 403 — body-borne unit_id is scoped too"
            - "NicuUnit.${unit_a}.staffed_bed_target is still 4 and version is still ${v_scope}"
            - "Referral.${ref_n}.status is still PENDING"

      - name: occ_conflict_outranks_the_own_state_conflict
        claim_type: priority_conflict
        grounds:
          - validations.priority_7
          - validations.priority_8
          - errors[ERR_UNIT_VERSION_CONFLICT]
          - errors[ERR_INVALID_STATE]
          - concurrency_rules.referral_acceptance_consumes_a_bed
        distinguishing_aspect: |
          One request violates BOTH priority 7 and priority 8 — a stale unit
          version AND an already-ACCEPTED referral — and the answer is 412, not
          409: the caller is told to re-read rather than told its stale decision
          was illegal. Retrying with the fresh version then surfaces the 409
          underneath.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III at version 1."
            - "Referral CASE-N1 was accepted using expected_unit_version 1, which pushed the unit to version 2."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
          trigger:
            - call: "POST /referrals/${ref_n}/accept"
              payload: { expected_unit_version: "${v_a}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { e_occ_first: $.data.error_id }
            - *c_get_unit_a2
            - call: "POST /referrals/${ref_n}/accept"
              payload: { expected_unit_version: "${v_a2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { e_state_second: $.data.error_id }
          assert:
            - "${v_a} == 1 and ${v_a2} == 2"
            - "${e_occ_first} == ERR_UNIT_VERSION_CONFLICT with HTTP 412 — the 409 hiding behind it is not reported"
            - "${e_state_second} == ERR_INVALID_STATE with HTTP 409 once the version is fresh"
            - "NicuUnit.${unit_a}.version is still 2 — neither refused call bumped it"
            - "NicuUnit.${unit_a}.held_bed_count == 1 — no second hold was created"

      - name: schema_check_runs_before_body_reference_existence
        claim_type: cascading_validation
        grounds:
          - validations.priority_5
          - validations.priority_6
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_UNIT_NOT_FOUND]
        distinguishing_aspect: |
          The same request carries an inverted window AND an unresolvable
          unit_id. Priority 5 wins, so the answer is 400; fixing only the window
          then exposes the 404 underneath — proving the checks are ordered, not
          collected.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A exists."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
          trigger:
            - call: "POST /surge-escalations"
              payload: { unit_id: "00000000-0000-4000-8000-000000000000", requested_beds: 2, effective_from: "2026-08-03T00:00:00Z", effective_to: "2026-08-02T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { e_schema_first: $.data.error_id }
            - call: "POST /surge-escalations"
              payload: { unit_id: "00000000-0000-4000-8000-000000000000", requested_beds: 2, effective_from: "2026-08-02T00:00:00Z", effective_to: "2026-08-03T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { e_ref_second: $.data.error_id }
          assert:
            - "${e_schema_first} == ERR_INVALID_REQUEST with HTTP 400 — effective_to <= effective_from is caught at priority 5"
            - "${e_ref_second} == ERR_UNIT_NOT_FOUND with HTTP 404 — the body FK check at priority 6 only runs once the schema is clean"
            - "GET /surge-escalations reports total_count 0"

      - name: role_check_runs_before_path_existence
        claim_type: priority_ordering
        grounds:
          - validations.priority_2
          - validations.priority_3
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_REVIEW_NOT_FOUND]
        distinguishing_aspect: |
          Addressing a nonexistent review id with the wrong role returns 403,
          not 404 — the authorization boundary refuses to confirm or deny the
          row's existence — and the same call with the right role then returns
          the 404.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z and no DesignationReview exists."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /designation-reviews/00000000-0000-4000-8000-000000000000/verify"
              payload: {}
              as: ReferringClinician
              as_user_id: "00000000-0000-4000-8000-000000000000:ref-1"
              captures: { e_role_before_404: $.data.error_id }
            - call: "POST /designation-reviews/00000000-0000-4000-8000-000000000000/verify"
              payload: {}
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { e_404_after_role: $.data.error_id }
          assert:
            - "${e_role_before_404} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — verify is NetworkAdmin-exclusive and priority 2 precedes priority 3"
            - "${e_404_after_role} == ERR_REVIEW_NOT_FOUND with HTTP 404"

      - name: aggregate_bed_capacity_refuses_the_fifth_hold
        claim_type: aggregate_validation
        grounds:
          - validations.priority_15
          - errors[ERR_NO_BED_AVAILABLE]
          - calculations.bed_ledger
          - state_machines[Referral].transitions.accept.preconditions
        distinguishing_aspect: |
          Every one of the five acceptances is individually legal — same unit,
          same capability, fresh version each time — but the collective consumes
          the last of four staffed beds, so only the aggregate check at the
          bottom of the ladder can catch the fifth.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, and Regional NICU A is capability LEVEL_III with staffed_bed_target 4 and no escalation."
            - "Five LEVEL_III referrals are PENDING at the unit; the first four have been accepted, so held 4 / available 0."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
            - *c_cred_neo
            - *c_cred_rn
            - *c_vent
            - *c_hfov
            - *c_ref_n
            - *c_get_unit_a
            - *c_accept_n
            - *c_ref_2
            - *c_get_unit_a2
            - *c_accept_2
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-F3", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_f3: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_f3: $.data.version }
            - call: "POST /referrals/${ref_f3}/accept"
              payload: { expected_unit_version: "${v_f3}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /referrals"
