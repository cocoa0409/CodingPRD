  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_verification_retry_cycle
        grounds:
          - state_machines.AssistanceApplication.VERIFICATION_FAILED_to_UNDER_VERIFICATION
          - state_machines.VendorVerification.PENDING_to_FAILED
        distinguishing_aspect: |
          AssistanceApplication loops UNDER_VERIFICATION -> VERIFICATION_FAILED ->
          UNDER_VERIFICATION via a NEW verification while the FAILED one is
          retained — a cycle on the application, not a linear pipeline.
        test_recipe:
          setup:
            - "Canonical chain to UNDER_VERIFICATION; first verification completed FAILED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramManager }
