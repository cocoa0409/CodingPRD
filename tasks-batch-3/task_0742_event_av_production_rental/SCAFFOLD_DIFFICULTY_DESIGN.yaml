            - "RentalOrder.${ord_id}.has_approved_coi == true"
            - "RentalOrder.${ord_id}.status == CONFIRMED"

      - name: reservation_checkout_requires_order_loaded_out
        grounds:
          - state_machines.EquipmentReservation.HELD_to_CHECKED_OUT
          - entities.RentalOrder.fields.status
          - errors[ERR_ORDER_NOT_LOADED_OUT]
        distinguishing_aspect: >
          EquipmentReservation HELD->CHECKED_OUT depends on the parent RentalOrder being LOADED_OUT;
          while the order is CONFIRMED the check-out returns ERR_ORDER_NOT_LOADED_OUT, and after
          load-out the same check-out succeeds. Entity pair: EquipmentReservation<-RentalOrder
          (distinct from RentalOrder<-COI).
        test_recipe:
          setup:
            - "Order CONFIRMED (clock 2026-05-01) with a HELD LED reservation; order not yet loaded out."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "N", contact_email: "n@n.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V12", address: "14 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E12", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
          trigger:
            - { call: "POST /equipment-reservations/${res_id}/check-out", payload: {}, as: WarehouseManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /rental-orders/${ord_id}/load-out", payload: {}, as: WarehouseManager }
            - { call: "POST /equipment-reservations/${res_id}/check-out", payload: {}, as: WarehouseManager }
          assert:
            - "first check-out response.status == 409 and response.data.error_id == ERR_ORDER_NOT_LOADED_OUT"
            - "EquipmentReservation.${res_id}.status == CHECKED_OUT"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: equipment_window_overlap_aggregate_capacity
        grounds:
          - calculations.equipment_availability
          - validations[priority=8]
          - errors[ERR_EQUIPMENT_UNAVAILABLE]
        distinguishing_aspect: >
          EquipmentItem uses inclusive-day aggregate-capacity overlap: a qty-8 reservation sharing
          day 06-12 with a qty-15 hold (peak 23 > 20 total) is rejected, but a qty-8 reservation
          starting 06-13 (no shared day, peak 15) is admitted — capacity summed across concurrent
          reservations up to total_units.
        test_recipe:
          setup:
            - "LED total 20; reservation A qty15 over 06-10..06-12."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "O", contact_email: "o@o.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V13", address: "15 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E13", event_start_date: "2026-06-10", event_end_date: "2026-06-15" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 15, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 8, reserve_start_date: "2026-06-12", reserve_end_date: "2026-06-14" }, as: WarehouseManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 8, reserve_start_date: "2026-06-13", reserve_end_date: "2026-06-15" }, as: WarehouseManager, captures: { ok_res: "$.data.id" } }
          assert:
            - "overlapping reservation response.status == 409 and response.data.error_id == ERR_EQUIPMENT_UNAVAILABLE"
            - "EquipmentReservation.${ok_res}.status == HELD"

      - name: crew_shift_turnaround_buffer
        grounds:
          - validations[priority=8]
          - entities.CrewAssignment.fields.shift_start
          - entities.CrewAssignment.fields.shift_end
          - errors[ERR_CREW_DOUBLE_BOOKED]
        distinguishing_aspect: >
          CrewMember uses single-capacity half-open shifts with a 60-min TURNAROUND buffer: a shift
          starting exactly at the prior shift's end (0-min gap) is rejected ERR_CREW_DOUBLE_BOOKED,
          one starting 60 min later is admitted — different interval semantics (buffer + capacity 1)
          than EquipmentItem's aggregate-capacity inclusive-day overlap.
        test_recipe:
          setup:
            - "One crew member; order DRAFT; assignment A shift 2026-06-10T08:00Z..16:00Z."
          setup_api_calls:
