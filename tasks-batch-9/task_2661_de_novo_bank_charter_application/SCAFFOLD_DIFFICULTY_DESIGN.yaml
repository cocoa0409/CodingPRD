# Scaffold Difficulty Design - task_2661 De Novo Bank Charter Application
# SKILL.md section 1.8. Every instance grounds in SCAFFOLD.yaml sections 1.1-1.7 only;
# deleting this file leaves the declared behaviour identical.
# Logical clock starts at 2026-08-01T00:00:00Z (see POST /de-novo/_clock/set_current_utc).
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: stress_path_static_vs_dynamic_divergence_on_severely_adverse
        grounds:
          - calculations.stress_leverage_path
          - entities.StressScenario.fields.static_min_leverage_ratio_bps
          - entities.StressScenario.fields.dynamic_min_leverage_ratio_bps
          - entities.StressScenario.fields.governing_variant
          - validations[priority=78]
        distinguishing_aspect: >
          Dual-variant subject is CAPITAL STRESS PROJECTION on BusinessPlan/StressScenario (a
          balance-sheet forecast), not money movement: holding the balance sheet at year 1
          (STATIC_BALANCE_SHEET) yields min 1246 bps and no breach, while letting it grow with the
          plan (DYNAMIC_GROWTH) yields min 636 bps and a year-3 breach on byte-identical inputs.
        test_recipe:
          setup:
            - "A group with five cleared, qualified organizers (management_composite_score 71.80)."
            - "One DRAFT BusinessPlan with the canonical projections and no stress scenarios yet."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Dana Whitfield", role_on_board: "PROPOSED_CEO", is_independent: false, affiliation_code: "FIRSTCAP", banking_years: 7, regulatory_experience_score: 83 }
              as: CharterCounsel
              captures: { o1_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Marcus Ibarra", role_on_board: "PROPOSED_CFO", is_independent: false, affiliation_code: "FIRSTCAP", banking_years: 13, regulatory_experience_score: 71 }
              as: CharterCounsel
              captures: { o2_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Priya Raghunathan", role_on_board: "PROPOSED_CRO", is_independent: true, affiliation_code: "IND_A", banking_years: 3, regulatory_experience_score: 66 }
              as: CharterCounsel
              captures: { o3_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Elena Kowalski", role_on_board: "PROPOSED_CCO", is_independent: true, affiliation_code: "IND_B", banking_years: 20, regulatory_experience_score: 90 }
              as: CharterCounsel
              captures: { o4_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Theo Nakamura", role_on_board: "DIRECTOR", is_independent: true, affiliation_code: "IND_C", banking_years: 10, regulatory_experience_score: 54 }
              as: CharterCounsel
              captures: { o5_id: $.data.id }
            - call: "POST /de-novo/organizers/${o1_id}/background-result"
              payload: { dimension: "FINGERPRINT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o1_id}/background-result"
              payload: { dimension: "CREDIT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o2_id}/background-result"
              payload: { dimension: "FINGERPRINT", outcome: "CLEARED" }
