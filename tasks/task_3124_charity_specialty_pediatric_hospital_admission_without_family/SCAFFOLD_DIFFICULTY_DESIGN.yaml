  - rule_id: cross_entity_state_dependency
    instances:

      - name: application_acceptance_gated_by_program_state
        grounds:
          - state_machines.PatientApplication.PENDING_REVIEW_to_ACCEPTED
          - state_machines.SpecialtyProgram.ACTIVE_to_SUSPENDED
          - errors.ERR_PROGRAM_NOT_ACTIVE
        distinguishing_aspect: |
          Entity pair PatientApplication -> SpecialtyProgram: an application with full
          quorum cannot be ACCEPTED while its program is SUSPENDED; reactivating the
          program (hospital OPEN) unblocks the very same decide payload. The gate is
          the sibling entity's state, not any field of the application.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 capacity 5, ORTHOPEDIC program P1 (0..215, non-staged), source RS1. Application A1 submitted, opened, quorum voted (2+1 accept). P1 then SUSPENDED."
