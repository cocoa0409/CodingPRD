- rule_id: priority_pair_validation_conflict
  instances:
  - name: state_beats_business_constraint_on_locked_month_denominator
    grounds:
    - validations[priority=5.5]
    - validations[priority=9]
    - errors[ERR_SUMMARY_LOCKED]
    - errors[ERR_DUPLICATE_DEVICE_DAY_COUNT]
    distinguishing_aspect: 'Error-category pair (state vs business_constraint): one POST

      device-day-count violates BOTH the covering-summary lock (summary

      SUBMITTED, priority 5.5) AND the (unit_id, count_date) uniqueness

      constraint (a row already exists, priority 9). The lower priority

      number wins: ERR_SUMMARY_LOCKED, not ERR_DUPLICATE_DEVICE_DAY_COUNT.

      '
    test_recipe:
      setup:
      - Facility + unit; existing DeviceDayCount row for 2026-08-01
      - MonthlySummary (unit, 2026-08) created and SUBMITTED (posture NORMAL, so submit succeeds; row becomes LOCKED)
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-6
          unit_type: ICU
          nhsn_location_code: ICU6
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/device-day-counts
        payload:
          unit_id: ${unit_id}
          count_date: '2026-08-01T00:00:00Z'
          central_line_days: 10
          urinary_catheter_days: 5
          ventilator_days: 2
          patient_days: 40
        as: UnitNurseManager
      - call: POST /api/monthly-summaries
        payload:
          unit_id: ${unit_id}
          month: 2026-08
        as: InfectionPreventionist
        captures:
          sum_id: $.data.id
      - call: POST /api/monthly-summaries/${sum_id}/submit
        payload: {}
        as: InfectionPreventionist
      trigger:
      - call: POST /api/device-day-counts
        payload:
          unit_id: ${unit_id}
          count_date: '2026-08-01T00:00:00Z'
          central_line_days: 11
          urinary_catheter_days: 5
          ventilator_days: 2
          patient_days: 40
        as: UnitNurseManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_SUMMARY_LOCKED (state priority 5.5 beats business_constraint priority 9)
      - HTTP status == 409
      - 'the existing row remains unchanged: GET /api/device-day-counts?unit_id=<unit> shows central_line_days == 10 for 2026-08-01'
  - name: temporal_beats_referential_on_case_create_in_rit
    grounds:
    - validations[priority=7]
    - validations[priority=8]
    - errors[ERR_REPEAT_INFECTION_TIMEFRAME]
    - errors[ERR_EPISODE_PATIENT_MISMATCH]
    distinguishing_aspect: 'Error-category pair (business_temporal vs business_referential —

      different from the state/constraint pair above): one POST

      infection-case has its specimen date inside the patient''s own RIT

      window (temporal, priority 7) AND links a device episode belonging

      to a DIFFERENT patient (referential, priority 8). Temporal wins:

      ERR_REPEAT_INFECTION_TIMEFRAME.

      '
    test_recipe:
      setup:
      - Facility + unit; patient P1 with CENTRAL_LINE episode E1 and an ADJUDICATED_HAI CLABSI with DOE 2026-08-05 (RIT covers 2026-08-05..2026-08-18)
      - Patient P2 with CENTRAL_LINE episode E2
      - New case for P1 with specimen 2026-08-15 (inside RIT) but linked_device_episode_id = E2 (wrong patient)
      setup_api_calls:
      - call: POST /api/facilities
        payload:
          name: F1
          nhsn_org_id: ORG-1
          clabsi_baseline_per_1000: 2.0
          cauti_baseline_per_1000: 1.5
          ssi_baseline_per_procedure: 0.25
        as: PlatformAdmin
        captures:
          fac_id: $.data.id
      - call: POST /api/units
        payload:
          facility_id: ${fac_id}
          name: ICU-7
          unit_type: ICU
          nhsn_location_code: ICU7
        as: PlatformAdmin
        captures:
          unit_id: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-H1
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_1: $.data.id
      - call: POST /api/patients
        payload:
          mrn: MRN-H2
          admitted_at: '2026-08-01T08:00:00Z'
          unit_id: ${unit_id}
        as: UnitNurseManager
        captures:
          pat_2: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_1}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_1: $.data.id
      - call: POST /api/device-episodes
        payload:
          patient_id: ${pat_2}
          device_type: CENTRAL_LINE
          placed_at: '2026-08-01T10:00:00Z'
        as: UnitNurseManager
        captures:
          ep_2: $.data.id
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_1}
          case_type: CLABSI
          suspected_organism: Escherichia coli
          first_positive_specimen_at: '2026-08-05T09:00:00Z'
          linked_device_episode_id: ${ep_1}
        as: InfectionPreventionist
        captures:
          case_1: $.data.id
      - call: POST /api/infection-cases/${case_1}/begin-review
        payload: {}
        as: InfectionPreventionist
      - call: POST /api/infection-cases/${case_1}/adjudicate
        payload:
          outcome: ADJUDICATED_HAI
          date_of_event: '2026-08-05T00:00:00Z'
          rationale: LCBI-1 criteria all met
        as: InfectionPreventionist
      trigger:
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_1}
          case_type: CLABSI
          suspected_organism: Enterococcus faecalis
          first_positive_specimen_at: '2026-08-15T09:00:00Z'
          linked_device_episode_id: ${ep_2}
        as: InfectionPreventionist
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_REPEAT_INFECTION_TIMEFRAME (temporal priority 7 beats referential priority 8)
      - HTTP status == 422
      - 'no new case persisted: GET /api/infection-cases?patient_id=<pat_1> returns total_count == 1'
- rule_id: boundary_precision_check
  instances:
  - name: sir_calculability_floor_exactly_one_vs_below
    grounds:
    - calculations.predicted_infections_and_sir
    - entities.MonthlySummary.fields.sir_clabsi
    - entities.MonthlySummary.fields.sir_flag
    distinguishing_aspect: 'Boundary on the predicted-infections metric (>= 1.0 calculable, <

      1.0 NOT_CALCULATED): unit A with 500 central-line days lands exactly

      on predicted = 1.000 (calculable, sir 0.0 with zero observed), unit B

      with 499 days lands at predicted = 0.998 (one device-day short) and

      must yield sir_clabsi null / sir_flag NOT_CALCULATED.

      '
