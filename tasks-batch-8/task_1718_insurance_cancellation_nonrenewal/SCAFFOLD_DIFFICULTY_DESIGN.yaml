# =============================================================================
# Task 1718 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules × 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================

scaffold_difficulty_design:

  # ------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT entity domains
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: return_premium_pro_rata_vs_short_rate_same_inputs
        grounds:
          - calculations.return_premium
          - entities.CancellationCase.fields.return_method
          - entities.PremiumLedgerEntry.fields.entry_kind
        distinguishing_aspect: |
          Entity domain = premium accounting on Policy/PremiumLedgerEntry. With identical
          policy economics (term 2026-01-01..2027-01-01, premium 120000 cents, effective
          2026-07-02), the PRO_RATA variant returns 60164 cents while the SHORT_RATE
          variant at short_rate_penalty_pct 0.10 returns 54148 cents — same inputs,
          two valid algorithms, different cents; variant selection is driven by
          ground_code × profile.short_rate_penalty_pct.
        test_recipe:
          setup:
            - "Two ACTIVE StateFilingProfiles: CA (short_rate_penalty_pct 0.0) and TX (short_rate_penalty_pct 0.10); identical economics otherwise"
            - "Two ACTIVE policies with identical term 2026-01-01..2027-01-01 and total_premium_cents 120000, one pinned to CA and one to TX"
            - "Clock at 2026-08-05; two INSURED_REQUEST cancellation cases approved with scheduled_effective_date 2026-10-01 — wait, see trigger: we instead pin scheduled_effective_date 2026-07-02 via approval on a clock date early enough; chain sets clock to 2026-06-01 for approval then 2026-07-02 for the sweep"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "CA", permissible_grounds: ["NONPAYMENT", "MATERIAL_MISREPRESENTATION"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_ca: $.data.id }
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "TX", permissible_grounds: ["NONPAYMENT", "MATERIAL_MISREPRESENTATION"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.10, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_tx: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_ca}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles/${prof_tx}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "A Insured", mailing_address: "1 A St", email: "a@x.com" }
              as: Underwriter
              captures: { ph_a: $.data.id }
            - call: "POST /carrier/policyholders"
              payload: { full_name: "B Insured", mailing_address: "2 B St", email: "b@x.com" }
              as: Underwriter
              captures: { ph_b: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_a}", state_profile_id: "${prof_ca}", policy_number: "P-CA-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 120000 }
              as: Underwriter
              captures: { pol_ca: $.data.id, pol_ca_v: $.data.version }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_b}", state_profile_id: "${prof_tx}", policy_number: "P-TX-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 120000 }
              as: Underwriter
              captures: { pol_tx: $.data.id, pol_tx_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_ca}", ground_code: "INSURED_REQUEST", expected_policy_version: "${pol_ca_v}" }
              as: Policyholder
              as_user_id: "${ph_a}"
              captures: { case_ca: $.data.id }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_tx}", ground_code: "INSURED_REQUEST", expected_policy_version: "${pol_tx_v}" }
              as: Policyholder
              as_user_id: "${ph_b}"
              captures: { case_tx: $.data.id }
            - call: "POST /carrier/cancellation-cases/${case_ca}/approve"
              payload: { scheduled_effective_date: "2026-07-02" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_tx}/approve"
              payload: { scheduled_effective_date: "2026-07-02" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_ca}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-06-01", tracking_code: "T-CA-1" } ] }
              as: Underwriter
            - call: "POST /carrier/cancellation-cases/${case_tx}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-06-01", tracking_code: "T-TX-1" } ] }
              as: Underwriter
          trigger:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /carrier/policies/${pol_ca}/ledger-entries"
              payload: {}
              as: ComplianceOfficer
              captures: { ledger_ca: $.data }
            - call: "GET /carrier/policies/${pol_tx}/ledger-entries"
              payload: {}
              as: ComplianceOfficer
              captures: { ledger_tx: $.data }
          assert:
            - "Policy.${pol_ca}.status == CANCELLED and Policy.${pol_tx}.status == CANCELLED"
            - "CancellationCase.${case_ca}.return_method == PRO_RATA and return_premium_cents == 60164"
            - "CancellationCase.${case_tx}.return_method == SHORT_RATE and return_premium_cents == 54148"
            - "PremiumLedgerEntry for ${pol_ca} contains entry_kind=RETURN_PRO_RATA amount_cents=-60164; ${pol_tx} contains entry_kind=RETURN_SHORT_RATE amount_cents=-54148"
            - "60164 != 54148 (identical economics, variant-driven delta of 6016 cents)"

      - name: reinstatement_fee_tier_boundaries_same_window
        grounds:
          - calculations.reinstatement_fee
          - entities.ReinstatementRequest.fields.lapse_days
          - entities.ReinstatementRequest.fields.reinstatement_fee_cents
        distinguishing_aspect: |
          Entity domain = reinstatement economics on ReinstatementRequest (distinct from
          premium accounting on PremiumLedgerEntry). Same cancellation_effective_date
          2026-09-01 and same profile constants produce three different fee outcomes purely
          from lapse-day tiering: lapse 10 -> 0 cents, lapse 11 -> 2500 cents, lapse 31 ->
          5000 cents; the tier boundaries are <= comparisons (10 falls in tier 1, 11 in tier 2).
        test_recipe:
          setup:
            - "ACTIVE WA profile: reinstatement_window_days 45, max_reinstatements 3, short_rate_penalty_pct 0.0, nonpayment 10, other 30, mortgagee 45, nonrenewal 60"
            - "Three ACTIVE WA policies (term 2026-01-01..2027-01-01, premium 60000), each cancelled EFFECTIVE with scheduled_effective_date 2026-09-01 via NONPAYMENT cases approved on 2026-08-10 and noticed on 2026-08-10"
            - "Clock swept to 2026-09-01 so all three policies are CANCELLED"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "WA", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 3, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_wa: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_wa}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "R One", mailing_address: "1 R St", email: "r1@x.com" }
              as: Underwriter
              captures: { ph_r1: $.data.id }
            - call: "POST /carrier/policyholders"
              payload: { full_name: "R Two", mailing_address: "2 R St", email: "r2@x.com" }
              as: Underwriter
              captures: { ph_r2: $.data.id }
            - call: "POST /carrier/policyholders"
              payload: { full_name: "R Three", mailing_address: "3 R St", email: "r3@x.com" }
              as: Underwriter
              captures: { ph_r3: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_r1}", state_profile_id: "${prof_wa}", policy_number: "P-R-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 60000 }
              as: Underwriter
              captures: { pol_r1: $.data.id, pol_r1_v: $.data.version }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_r2}", state_profile_id: "${prof_wa}", policy_number: "P-R-2", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 60000 }
              as: Underwriter
              captures: { pol_r2: $.data.id, pol_r2_v: $.data.version }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_r3}", state_profile_id: "${prof_wa}", policy_number: "P-R-3", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 60000 }
              as: Underwriter
              captures: { pol_r3: $.data.id, pol_r3_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_r1}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_r1_v}" }
              as: Underwriter
              captures: { case_r1: $.data.id }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_r2}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_r2_v}" }
              as: Underwriter
              captures: { case_r2: $.data.id }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_r3}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_r3_v}" }
              as: Underwriter
              captures: { case_r3: $.data.id }
            - call: "POST /carrier/cancellation-cases/${case_r1}/approve"
              payload: { scheduled_effective_date: "2026-09-01" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_r2}/approve"
              payload: { scheduled_effective_date: "2026-09-01" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_r3}/approve"
              payload: { scheduled_effective_date: "2026-09-01" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_r1}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-08-10", tracking_code: "T-R-1" } ] }
              as: Underwriter
            - call: "POST /carrier/cancellation-cases/${case_r2}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-08-10", tracking_code: "T-R-2" } ] }
              as: Underwriter
            - call: "POST /carrier/cancellation-cases/${case_r3}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-08-10", tracking_code: "T-R-3" } ] }
              as: Underwriter
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /carrier/policies/${pol_r1}"
              payload: {}
              as: ComplianceOfficer
              captures: { pol_r1_v2: $.data.version }
            - call: "POST /carrier/reinstatement-requests"
              payload: { policy_id: "${pol_r1}", cancellation_case_id: "${case_r1}", expected_policy_version: "${pol_r1_v2}" }
              as: Policyholder
              as_user_id: "${ph_r1}"
              captures: { rr_1: $.data.id, rr_1_fee: $.data.reinstatement_fee_cents }
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /carrier/policies/${pol_r2}"
              payload: {}
              as: ComplianceOfficer
              captures: { pol_r2_v2: $.data.version }
            - call: "POST /carrier/reinstatement-requests"
              payload: { policy_id: "${pol_r2}", cancellation_case_id: "${case_r2}", expected_policy_version: "${pol_r2_v2}" }
              as: Policyholder
              as_user_id: "${ph_r2}"
              captures: { rr_2: $.data.id, rr_2_fee: $.data.reinstatement_fee_cents }
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /carrier/policies/${pol_r3}"
              payload: {}
              as: ComplianceOfficer
              captures: { pol_r3_v2: $.data.version }
          trigger:
            - call: "POST /carrier/reinstatement-requests"
              payload: { policy_id: "${pol_r3}", cancellation_case_id: "${case_r3}", expected_policy_version: "${pol_r3_v2}" }
              as: Policyholder
              as_user_id: "${ph_r3}"
              captures: { rr_3: $.data.id, rr_3_fee: $.data.reinstatement_fee_cents }
          assert:
            - "ReinstatementRequest.${rr_1}.lapse_days == 10 and reinstatement_fee_cents == 0 (tier-1 boundary <= 10)"
            - "ReinstatementRequest.${rr_2}.lapse_days == 11 and reinstatement_fee_cents == 2500 (tier-2 lower edge)"
            - "ReinstatementRequest.${rr_3}.lapse_days == 31 and reinstatement_fee_cents == 5000 (tier-3)"
            - "All three requests share cancellation_effective_date 2026-09-01 — fee divergence is purely lapse-tier-driven"

  # ------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes {(a),(b),(c)}
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: notice_window_max_across_ground_and_recipients
        grounds:
          - calculations.notice_window
          - entities.CancellationCase.fields.earliest_effective_date
          - state_machines.CancellationCase.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction: ground tier
          (NONPAYMENT 10 vs other 30) interacts with a nested max over recipient classes
          (mortgagee 45) so the presence of a single InsuredInterest flips the result
          from requested+30 to requested+45 regardless of ground; two cases requested
          the same day with different ground codes but identical interest sets resolve
          to the SAME earliest_effective_date 2026-09-19 because the max is
          recipient-dominated.
        test_recipe:
          setup:
            - "ACTIVE OR profile: nonpayment 10, other 30, mortgagee 45, nonrenewal 60, short_rate 0.0, reinstatement_window 45, max_reinstatements 2"
            - "Two ACTIVE OR policies (term 2026-01-01..2027-01-01, premium 50000), each with one MORTGAGEE InsuredInterest"
            - "Clock 2026-08-05"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "OR", permissible_grounds: ["NONPAYMENT", "MATERIAL_MISREPRESENTATION"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_or: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_or}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "N One", mailing_address: "1 N St", email: "n1@x.com" }
              as: Underwriter
              captures: { ph_n1: $.data.id }
            - call: "POST /carrier/policyholders"
              payload: { full_name: "N Two", mailing_address: "2 N St", email: "n2@x.com" }
              as: Underwriter
              captures: { ph_n2: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_n1}", state_profile_id: "${prof_or}", policy_number: "P-N-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 50000 }
              as: Underwriter
              captures: { pol_n1: $.data.id, pol_n1_v: $.data.version }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_n2}", state_profile_id: "${prof_or}", policy_number: "P-N-2", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 50000 }
              as: Underwriter
              captures: { pol_n2: $.data.id, pol_n2_v: $.data.version }
            - call: "POST /carrier/policies/${pol_n1}/interests"
              payload: { interest_type: "MORTGAGEE", institution_name: "Bank 1", mailing_address: "9 Bank Rd" }
              as: Underwriter
            - call: "POST /carrier/policies/${pol_n2}/interests"
              payload: { interest_type: "MORTGAGEE", institution_name: "Bank 2", mailing_address: "9 Bank Rd" }
              as: Underwriter
          trigger:
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_n1}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_n1_v}" }
              as: Underwriter
              captures: { case_np: $.data.id, case_np_eed: $.data.earliest_effective_date }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_n2}", ground_code: "MATERIAL_MISREPRESENTATION", expected_policy_version: "${pol_n2_v}" }
              as: Underwriter
              captures: { case_mm: $.data.id, case_mm_eed: $.data.earliest_effective_date }
          assert:
            - "CancellationCase.${case_np}.earliest_effective_date == 2026-09-19 (max(10, 45))"
            - "CancellationCase.${case_mm}.earliest_effective_date == 2026-09-19 (max(30, 45) — ground tier is recipient-dominated)"
            - "The two grounds differ but the nested max makes the effective dates equal"

      - name: return_premium_double_rounding_order_pinned
        grounds:
          - calculations.return_premium
          - entities.CancellationCase.fields.return_premium_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: unearned_cents is rounded
          (round_half_up to whole cents) BEFORE the short-rate penalty is applied and
          rounded a second time. Policy term 2026-03-01..2027-03-01, premium 73000,
          effective 2026-06-15: unearned = round_half_up(73000*259/365) = 51800, then
          short-rate 0.25 penalty -> round_half_up(51800*0.75) = 38850. An
          implementation that rounds only once (73000*259/365*0.75 = 38850.41 -> 38850
          happens to coincide here only if the intermediate is NOT pre-rounded; the
          pinned order is the contract and differs from sum-then-round formulations on
          odd inputs — scaffold pins round-then-penalize).
        test_recipe:
          setup:
            - "ACTIVE NM profile: short_rate_penalty_pct 0.25, other grounds 30, nonpayment 10, mortgagee 45, nonrenewal 60, window 45, max reinst 2"
            - "ACTIVE NM policy: term 2026-03-01..2027-03-01, premium 73000"
            - "Clock 2026-05-20 for case creation/approval; scheduled_effective_date 2026-06-15"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "NM", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.25, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_nm: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_nm}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "SR Insured", mailing_address: "7 S St", email: "sr@x.com" }
              as: Underwriter
              captures: { ph_sr: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_sr}", state_profile_id: "${prof_nm}", policy_number: "P-SR-1", term_start_date: "2026-03-01", term_end_date: "2027-03-01", total_premium_cents: 73000 }
              as: Underwriter
              captures: { pol_sr: $.data.id, pol_sr_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_sr}", ground_code: "INSURED_REQUEST", expected_policy_version: "${pol_sr_v}" }
              as: Policyholder
              as_user_id: "${ph_sr}"
              captures: { case_sr: $.data.id }
            - call: "POST /carrier/cancellation-cases/${case_sr}/approve"
              payload: { scheduled_effective_date: "2026-06-15" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_sr}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-05-20", tracking_code: "T-SR-1" } ] }
              as: Underwriter
          trigger:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /carrier/cancellation-cases/${case_sr}"
              payload: {}
              as: ComplianceOfficer
              captures: { sr_return: $.data.return_premium_cents }
          assert:
            - "CancellationCase.${case_sr}.status == EFFECTIVE"
            - "CancellationCase.${case_sr}.return_premium_cents == 38850 (unearned pre-rounded to 51800, then penalty rounded: round_half_up(51800 * 0.75))"
            - "PremiumLedgerEntry for ${pol_sr} contains RETURN_SHORT_RATE amount_cents == -38850"

  # ------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: non-linear shapes on DIFFERENT entities
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: policy_cancellation_reinstatement_cycle
        grounds:
          - state_machines.Policy.CANCELLED_to_ACTIVE
          - state_machines.Policy.ACTIVE_to_CANCEL_PENDING
          - entities.Policy.fields.reinstatements_used
        distinguishing_aspect: |
          Policy machine is cyclic: ACTIVE -> CANCEL_PENDING -> CANCELLED -> ACTIVE
          (via approved reinstatement) and the loop is bounded by
          profile.max_reinstatements — after a full cycle the policy can be cancelled
          a second time and reinstatements_used accumulates to 1; a third reinstatement
          beyond max_reinstatements=2 fails with ERR_REINSTATEMENT_LIMIT_REACHED.
        test_recipe:
          setup:
            - "ACTIVE GA profile: window 45, max_reinstatements 2, grounds [NONPAYMENT], nonpayment 10, other 30, mortgagee 45, nonrenewal 60, short_rate 0.0"
