            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-ON1", patient_account_number: "PA-ON1", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 100000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
