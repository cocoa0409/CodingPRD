            - { call: "POST /grillops/assembly-jobs/${j1}/transition", payload: { action: "ASSIGN", assembler_id: "${asm_id}", window_start: "2026-04-02T09:00:00Z", window_end: "2026-04-02T10:00:00Z" }, as: ServiceAgent }
            - { call: "POST /grillops/assembly-jobs/${j2}/transition", payload: { action: "ASSIGN", assembler_id: "${asm_id}", window_start: "2026-04-02T10:00:00Z", window_end: "2026-04-02T11:00:00Z" }, as: ServiceAgent }
            - { call: "POST /grillops/assembly-jobs/${j3}/transition", payload: { action: "ASSIGN", assembler_id: "${asm_id}", window_start: "2026-04-02T11:00:00Z", window_end: "2026-04-02T12:00:00Z" }, as: ServiceAgent }
            - { call: "POST /grillops/assembly-jobs/${j4}/transition", payload: { action: "ASSIGN", assembler_id: "${asm_id}", window_start: "2026-04-02T13:00:00Z", window_end: "2026-04-02T14:00:00Z" }, as: ServiceAgent }
          trigger:
            - { call: "POST /grillops/assembly-jobs/${j1}/transition", payload: { action: "NO_SHOW" }, as: ServiceAgent }
            - { call: "POST /grillops/assembly-jobs/${j2}/transition", payload: { action: "NO_SHOW" }, as: ServiceAgent }
            - { call: "POST /grillops/assembly-jobs/${j3}/transition", payload: { action: "NO_SHOW" }, as: ServiceAgent }
            - { call: "GET /grillops/assemblers/${asm_id}", as: PlannerAdmin, captures: { asm_st: "$.data.status", nsh: "$.data.no_show_count", prov_q: "$.data.provisional_quality_bp" } }
            - { call: "GET /grillops/assembly-jobs/${j4}", as: ServiceAgent, captures: { j4_st: "$.data.status", j4_asm: "$.data.assembler_id" } }
          assert:
            - "captured asm_st == SUSPENDED (auto-transition at NO_SHOW_SUSPEND_THRESHOLD 3, no explicit SUSPEND call was made)"
            - "captured nsh == 3 and prov_q == 6400 (10000 - 1200 x 3) — below REINSTATE_MIN_PROVISIONAL_BP 7000, so reinstatement is currently blocked"
            - "captured j4_st == REQUESTED and j4_asm == null (hop-3 cascade unassigned the still-SCHEDULED job)"
            - "jobs j1..j3 remain NO_SHOW with their assembler_id retained for audit"
      - name: season_transition_discontinues_models_and_closes_lots
        grounds:
          - state_machines.Season.CLEARANCE_to_TRANSITIONED
          - state_machines.GrillModel.ACTIVE_to_DISCONTINUED
          - entities.InventoryLot.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger than the no-show cascade:
          the season advance CLEARANCE -> TRANSITIONED (hop 1) discontinues
          every model with lots in the season and stamps the parts-obligation
          clock; each model's own mutation (hop 2) flips its lots to CLOSEOUT.
          The lots change without any lot-targeted call.
        test_recipe:
          setup:
            - "Season 2026 advanced to CLEARANCE with one lot of GX-100 (no allocations needed)"
            - "clock set to 2026-10-01 (>= season_end 2026-09-30)"
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 40 }, as: PlannerAdmin, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "CLEARANCE" }, as: PlannerAdmin }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlannerAdmin }
          trigger:
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "TRANSITIONED" }, as: PlannerAdmin }
            - { call: "GET /grillops/models/${m_id}", as: PlannerAdmin, captures: { m_st: "$.data.status", m_disc: "$.data.discontinued_at", m_until: "$.data.support_obligation_until" } }
            - { call: "GET /grillops/seasons/${s_id}/lots", as: PlannerAdmin, captures: { lot_st: "$.data[0].status" } }
          assert:
            - "captured m_st == DISCONTINUED (hop 1: model with a lot in the transitioned season)"
            - "captured m_disc == 2026-10-01T00:00:00Z (logical clock at transition)"
            - "captured m_until == 2033-10-01T00:00:00Z (discontinued_at + parts_support_years default 7 — the long-tail parts obligation)"
            - "captured lot_st == CLOSEOUT (hop 2: caused by the model's discontinuation, not by a direct lot call)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posture_error_precedes_credit_error
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_SEASON_POSTURE_FORBIDDEN]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state x business_fiscal: one allocation create
          that violates BOTH the season posture gate (season still PLANNING)
          and the channel credit limit (5 x 100000 > credit_limit 1) MUST return
          the priority-5 state error ERR_SEASON_POSTURE_FORBIDDEN, not the
          priority-10 fiscal error.
        test_recipe:
          setup:
            - "Season 2026 freshly created (PLANNING, version 1); model GX-100; channel TinyCredit with credit_limit_cents 1"
          setup_api_calls:
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id", s_v: "$.data.version" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "TinyCredit", channel_type: "SPECIALTY_DEALER", allocation_priority: 3, credit_limit_cents: 1 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
          trigger:
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 5, expected_season_version: "${s_v}" }, as: PlannerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_SEASON_POSTURE_FORBIDDEN (http 409) — the state-category violation is reported even though the fiscal check (500000 > 1) also fails"
            - "no Allocation is persisted for (${s_id}, ${ch_id}, ${m_id})"

      - name: incompatible_part_error_precedes_obligation_error
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_PART_INCOMPATIBLE]
          - errors[ERR_PARTS_OBLIGATION_EXPIRED]
        distinguishing_aspect: |
          Error-category pair business_referential x business_temporal (a
          different pair than state x fiscal): a free WARRANTY parts order whose
          part is incompatible with the sale's model AND whose model obligation
          window has expired MUST return the priority-7 ERR_PART_INCOMPATIBLE,
          not the priority-8 ERR_PARTS_OBLIGATION_EXPIRED.
        test_recipe:
          setup:
            - "Season 2018 ran its course; sale of GX-OLD registered at clock 2018-04-01 via DIRECT channel"
            - "GX-OLD manually discontinued at clock 2018-06-01 -> support_obligation_until 2025-06-01T00:00:00Z"
            - "Part VLV-1 (BURNER, compatible only with OTHER-X) in catalog"
            - "clock at 2026-09-01 — past the obligation window, so the temporal check would also fire"
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2018-01-10T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Season 2018", year: 2018, build_start: "2017-11-01T00:00:00Z", allocation_open: "2018-01-15T00:00:00Z", in_season_start: "2018-03-01T00:00:00Z", clearance_start: "2018-07-01T00:00:00Z", season_end: "2018-09-30T00:00:00Z", demand_forecast_units: 500 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-OLD", model_family: "GX", model_year: 2018, base_price_cents: 50000, demand_share_bp: 6000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "WebDirect", channel_type: "DIRECT", allocation_priority: 5, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2017-W48", units_built: 5 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 2, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2018-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-OLD" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2018-06-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/models/${m_id}/lifecycle", payload: { action: "DISCONTINUE" }, as: PlannerAdmin }
            - { call: "POST /grillops/parts", payload: { part_number: "VLV-1", component: "BURNER", compatible_model_codes: ["OTHER-X"], supersession_chain_id: "CH-VLV", chain_position: 1, unit_cost_cents: 3200, stock_quantity: 10 }, as: PlannerAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlannerAdmin }
          trigger:
            - { call: "POST /grillops/parts-orders", payload: { part_id: "${p_id}", sale_id: "${sale_id}", quantity: 1, fulfillment_type: "WARRANTY" }, as: ServiceAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_PART_INCOMPATIBLE (http 422) — referential priority 7 beats temporal priority 8 even though clock 2026-09-01 > support_obligation_until 2025-06-01"
            - "no PartsOrder is persisted"
  - rule_id: boundary_precision_check
    instances:
      - name: coverage_expiry_day_is_inclusive
        grounds:
          - calculations.calc_coverage_determination
          - entities.WarrantyClaim.fields.coverage_determination
        distinguishing_aspect: |
          Boundary on a TIME metric via POST /warranty-claims: a BURNER claim
          filed exactly on sold_at + 10 years is IN_COVERAGE (<=, inclusive),
          while the same claim one day later is only GOODWILL_ELIGIBLE — the
          >= vs > distinction changes the adjudication path.
        test_recipe:
          setup:
            - "Season 2026 IN_SEASON; sale REGISTERED at clock 2026-04-01T00:00:00Z (sold_at pinned)"
            - "logical clock moved to the exact burner coverage boundary days"
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 50 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 10, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-COV" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { sale_id: "$.data.id" } }
          trigger:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2036-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/warranty-claims", payload: { sale_id: "${sale_id}", component: "BURNER", failure_description: "Burner cracked on boundary day" }, as: ServiceAgent, captures: { det1: "$.data.coverage_determination" } }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2036-04-02T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/warranty-claims", payload: { sale_id: "${sale_id}", component: "BURNER", failure_description: "Second burner issue one day later" }, as: ServiceAgent, captures: { det2: "$.data.coverage_determination" } }
          assert:
            - "captured det1 == IN_COVERAGE (claim_date 2036-04-01 == sold_at 2026-04-01 + BURNER_COVERAGE_YEARS 10y; boundary inclusive)"
            - "captured det2 == GOODWILL_ELIGIBLE (one day past expiry, inside the 90-day goodwill extension)"

      - name: allocation_capacity_exact_fit_passes
        grounds:
          - calculations.calc_allocation_credit
          - validations[priority=9]
          - entities.InventoryLot.fields.units_available
        distinguishing_aspect: |
          Boundary on an INTEGER UNITS metric via POST /grillops/allocations (a
          different metric and endpoint than the coverage boundary): allocations
          summing to exactly units_built pass (capacity check is 'exceeds',
          not 'reaches'); the next single unit fails.
        test_recipe:
          setup:
            - "Season 2026 in ALLOCATION with a 5-unit lot of GX-100; three channels CH-A/CH-B/CH-C with large credit limits"
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "CH-A", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { chA: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "CH-B", channel_type: "HOME_CENTER", allocation_priority: 20, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { chB: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "CH-C", channel_type: "HOME_CENTER", allocation_priority: 30, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { chC: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 5 }, as: PlannerAdmin, captures: { lot_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { sv1: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${chA}", model_id: "${m_id}", allocated_units: 3, expected_season_version: "${sv1}" }, as: PlannerAdmin, captures: { aA: "$.data.id" } }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { sv2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${chB}", model_id: "${m_id}", allocated_units: 2, expected_season_version: "${sv2}" }, as: PlannerAdmin, captures: { aB: "$.data.id" } }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { sv3: "$.data.version" } }
          trigger:
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${chC}", model_id: "${m_id}", allocated_units: 1, expected_season_version: "${sv3}" }, as: PlannerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "allocations ${aA} (3 units) and ${aB} (2 units) were both created — the sum 5 == units_built 5 passes the capacity check (equality is not an excess)"
            - "captured err == ERR_ALLOCATION_CAPACITY_EXCEEDED (http 409) for the 6th unit; InventoryLot.${lot_id}.units_available == 0"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_gated_by_season_posture
        grounds:
          - validations[priority=5]
          - state_machines.Season.BUILD_to_ALLOCATION
          - errors[ERR_SEASON_POSTURE_FORBIDDEN]
        distinguishing_aspect: |
          Entity pair Season -> Allocation: an allocation can only be created
          while the referenced Season is in ALLOCATION; the same well-formed,
          credit-passing request is rejected in PLANNING and accepted after two
          season advances — the gate lives entirely on the OTHER entity.
        test_recipe:
          setup:
            - "Season 2026 created (PLANNING) with a 20-unit lot; channel BigBox with ample credit; model GX-100"
          setup_api_calls:
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id", s_v: "$.data.version" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 20 }, as: PlannerAdmin }
          trigger:
