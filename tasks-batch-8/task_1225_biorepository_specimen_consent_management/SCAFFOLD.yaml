# =============================================================================
# Scaffold: Biorepository & Specimen Consent Management (academic biobank)
# =============================================================================

scenario: |
  1225. Biorepository & Specimen Consent Management (academic biobank): consent
  scope & permitted-use rules per specimen, collection kit distribution & chain
  of custody, aliquoting/storage location & freezer monitoring, request review
  committee & distribution approval, de-identification & re-identification key
  control, consent withdrawal & specimen destruction, inventory depletion &
  sample sharing agreements, freezer failure contingency

domain_name: biorepository-consent
api_prefix: /biobank

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: donor_reference_code, type: string, source: input, description: "External donor reference code; unique across donors" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "ENROLLED (sole status at v1)" }

  - name: ConsentRecord
    parent: Donor
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id; owning donor" }
      - { name: permitted_uses, type: array, source: input, description: "Non-empty subset of GENERAL_RESEARCH | DISEASE_SPECIFIC | GENETIC_ANALYSIS | COMMERCIAL_USE" }
      - { name: excluded_uses, type: array, source: input, default: [], description: "Subset of the same use enum; carved out of permitted_uses" }
      - { name: allow_reidentification, type: boolean, source: input, default: false, description: "Whether re-identification key reveal is permitted" }
      - { name: effective_from, type: datetime, source: input, description: "Consent is usable only when current clock >= effective_from" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | WITHDRAWAL_PENDING | WITHDRAWN | SUPERSEDED" }
      - { name: withdrawal_requested_at, type: datetime, source: system, description: "Set on withdraw; null otherwise" }
      - { name: grace_deadline, type: datetime, source: computed, description: "= withdrawal_requested_at + GRACE_HOURS (72); null until withdrawal" }
      - { name: supersedes_consent_id, type: string, source: system, description: "FK -> ConsentRecord.id; set on the amendment child, null on originals" }

  - name: CollectionKit
    parent: null
    common_fields: true
    fields:
      - { name: kit_type, type: enum, source: input, description: "BLOOD | SALIVA | TISSUE" }
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id; assigned at distribution; null while IN_STOCK" }
      - { name: expires_at, type: datetime, source: input, description: "Kit is expired when current clock >= expires_at" }
      - { name: status, type: enum, source: system, default: IN_STOCK, description: "IN_STOCK | DISTRIBUTED | RETURNED | CONSUMED | EXPIRED" }
      - { name: distributed_at, type: datetime, source: system, description: "Set on distribute; null otherwise" }
      - { name: returned_at, type: datetime, source: system, description: "Set on receive-return; null otherwise" }

  - name: CustodyEvent
    parent: CollectionKit
    common_fields: false
    fields:
      - { name: kit_id, type: string, source: system, description: "FK -> CollectionKit.id" }
      - { name: event_type, type: enum, source: system, description: "DISTRIBUTED | RETURNED | CONSUMED | EXPIRED" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor who caused the event; 'system' for sweep events" }
      - { name: location, type: string, source: input, description: "Free-text location recorded with the event; may be null" }
      - { name: note, type: string, source: input, description: "Free-text note; may be null" }

  - name: Specimen
    parent: Donor
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: kit_id, type: string, source: input, description: "FK -> CollectionKit.id; kit must be RETURNED and assigned to the same donor" }
      - { name: consent_record_id, type: string, source: input, description: "FK -> ConsentRecord.id; must be ACTIVE and belong to the same donor" }
      - { name: storage_slot_id, type: string, source: input, description: "FK -> StorageSlot.id; optional at accession; when provided specimen starts IN_STORAGE" }
      - { name: specimen_type, type: enum, source: input, description: "BLOOD | SALIVA | TISSUE | PLASMA" }
      - { name: collected_at, type: datetime, source: input, description: "Collection timestamp; drives fulfill selector ranking (oldest first)" }
      - { name: initial_volume_ml, type: number, source: input, description: "Accessioned volume; must be > 0" }
      - { name: residual_volume_ml, type: number, source: computed, description: "= initial_volume_ml - sum of child aliquot initial_volume_ml with status != VOID" }
      - { name: committed_volume_book_ml, type: number, source: computed, description: "Forward-looking variant: sum of aliquot initial_volume_ml with status in {RESERVED, DESTRUCTION_PENDING, DISTRIBUTED, DESTROYED}" }
      - { name: committed_volume_physical_ml, type: number, source: computed, description: "Chronological variant: sum of aliquot initial_volume_ml with status in {DISTRIBUTED, DESTROYED} only" }
      - { name: lifecycle_status, type: enum, source: system, default: ACCESSIONED, description: "ACCESSIONED | IN_STORAGE | DESTRUCTION_PENDING | DESTROYED" }
      - { name: viability_status, type: enum, source: system, default: USABLE, description: "USABLE | QUARANTINED; parallel dimension independent of lifecycle_status" }

  - name: Aliquot
    parent: Specimen
    common_fields: true
    fields:
      - { name: specimen_id, type: string, source: system, description: "FK -> Specimen.id" }
      - { name: storage_slot_id, type: string, source: input, description: "FK -> StorageSlot.id; optional; when provided aliquot starts IN_STORAGE" }
      - { name: initial_volume_ml, type: number, source: input, description: "Aliquot volume; must be > 0 and <= specimen.residual_volume_ml" }
      - { name: remaining_volume_ml, type: number, source: computed, description: "= initial_volume_ml while active; 0 once DISTRIBUTED, DESTROYED, or VOID" }
      - { name: status, type: enum, source: system, default: IN_STORAGE, description: "IN_STORAGE | RESERVED | QUARANTINED | DESTRUCTION_PENDING | DISTRIBUTED | DESTROYED | VOID" }
      - { name: reserved_for_request_id, type: string, source: system, description: "FK -> SampleRequest.id; set by fulfill, cleared by release/checkout; null otherwise" }

  - name: StorageUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Unique freezer code" }
      - { name: setpoint_c, type: number, source: input, description: "Target temperature Celsius" }
      - { name: warn_threshold_c, type: number, source: input, default: -70.0, description: "Posture WARNING when a reading is strictly above this" }
      - { name: fail_threshold_c, type: number, source: input, default: -60.0, description: "Posture FAILURE when a reading is strictly above this" }
      - { name: posture, type: enum, source: system, default: OPERATIONAL, description: "OPERATIONAL | WARNING | FAILURE" }
      - { name: peak_excursion_c, type: number, source: computed, default: 0, description: "Peak variant: max(temp_c - warn_threshold_c, 0) over all readings" }
      - { name: cumulative_degree_minutes, type: number, source: computed, default: 0, description: "Cumulative variant: sum of (temp_c - warn_threshold_c) * minutes-since-previous-reading over readings taken while posture was WARNING or FAILURE" }

  - name: TemperatureReading
    parent: StorageUnit
    common_fields: false
    fields:
      - { name: storage_unit_id, type: string, source: system, description: "FK -> StorageUnit.id" }
      - { name: recorded_at, type: datetime, source: input, description: "When the reading was taken; drives degree-minute accrual spacing" }
      - { name: temp_c, type: number, source: input, description: "Plausibility range -100.0..+25.0 inclusive" }

  - name: StorageSlot
    parent: StorageUnit
    common_fields: true
    fields:
      - { name: storage_unit_id, type: string, source: system, description: "FK -> StorageUnit.id" }
      - { name: slot_code, type: string, source: input, description: "Position label, unique within the unit" }
      - { name: capacity_ml, type: integer, source: input, description: "Slot capacity; must be > 0" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | OFFLINE (set by unit failure cascade)" }

  - name: SlotReservation
    parent: StorageSlot
    common_fields: true
    fields:
      - { name: storage_slot_id, type: string, source: system, description: "FK -> StorageSlot.id" }
      - { name: starts_at, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Half-open window end (exclusive); must be strictly after starts_at" }
      - { name: purpose, type: enum, source: input, description: "MAINTENANCE | TRANSFER_HOLD | AUDIT" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | CANCELLED | COMPLETED (sweep completes windows whose ends_at <= now)" }

  - name: SampleRequest
    parent: null
    common_fields: true
    fields:
      - { name: requester_user_id, type: string, source: system, description: "X-User-ID of the creating Researcher" }
      - { name: title, type: string, source: input, description: "Request title" }
      - { name: required_uses, type: array, source: input, description: "Non-empty subset of the consent use enum this request will exercise" }
      - { name: specimen_type, type: enum, source: input, description: "BLOOD | SALIVA | TISSUE | PLASMA" }
      - { name: volume_needed_ml, type: number, source: input, description: "Total volume requested; must be > 0" }
      - { name: sharing_agreement_id, type: string, source: input, description: "FK -> SharingAgreement.id the fulfillment charges against" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | FULFILLED | COMPROMISED | REJECTED | CANCELLED" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Increments on each resubmit from REVISION_REQUESTED; hard cap MAX_REVISION_ROUNDS (2)" }
      - { name: votes_for, type: integer, source: computed, default: 0, description: "Count of APPROVE votes" }
      - { name: votes_against, type: integer, source: computed, default: 0, description: "Count of REJECT votes" }
      - { name: charged_volume_ml, type: number, source: computed, default: 0, description: "Quota charge debited at fulfill (may exceed physical volume when surcharge applies)" }
      - { name: fulfilled_volume_ml, type: number, source: computed, default: 0, description: "Sum of aliquot initial_volume_ml checked out under this request" }
      - { name: handling_fee_cents, type: integer, source: computed, default: 0, description: "Per-aliquot rounded fees summed at fulfill (round-per-aliquot-then-sum order pinned)" }
      - { name: recall_required, type: boolean, source: computed, default: false, description: "Set true when a consent withdrawal touches an already-DISTRIBUTED aliquot of this request" }

  - name: ReviewVote
    parent: SampleRequest
    common_fields: false
    fields:
      - { name: sample_request_id, type: string, source: system, description: "FK -> SampleRequest.id" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the CommitteeReviewer" }
      - { name: decision, type: enum, source: input, description: "APPROVE | REJECT" }
      - { name: rationale, type: string, source: input, description: "Free text; minimum 20 characters" }

  - name: SharingAgreement
    parent: null
    common_fields: true
    fields:
      - { name: recipient_institution, type: string, source: input, description: "Recipient institution name" }
      - { name: scope_uses, type: array, source: input, description: "Non-empty subset of the consent use enum this agreement authorizes" }
      - { name: total_committed_volume_ml, type: number, source: input, description: "Contracted total volume; must be > 0" }
      - { name: remaining_volume_ml, type: number, source: computed, description: "= total_committed_volume_ml - reserved_volume_ml - fulfilled_volume_ml" }
      - { name: reserved_volume_ml, type: number, source: computed, default: 0, description: "Quota debited at fulfill, not yet checked out" }
      - { name: fulfilled_volume_ml, type: number, source: computed, default: 0, description: "Quota consumed by completed checkouts" }
      - { name: effective_from, type: datetime, source: input, description: "Agreement effective window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Agreement effective window end; agreement expires when clock >= effective_to" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }

  - name: DeidentificationKey
    parent: Specimen
    common_fields: true
    fields:
      - { name: specimen_id, type: string, source: input, description: "FK -> Specimen.id; at most one non-REVOKED key per specimen" }
      - { name: key_code, type: string, source: system, description: "Server-minted coded identifier (identity only; never a decision input)" }
      - { name: holder_user_id, type: string, source: system, description: "X-User-ID of the creating ConsentCoordinator" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REVOKED (auto-revoked when the specimen is destroyed)" }
      - { name: reveal_count, type: integer, source: computed, default: 0, description: "Number of successful re-identification reveals" }

  - name: KeyAccessGrant
    parent: DeidentificationKey
    common_fields: true
    fields:
      - { name: deidentification_key_id, type: string, source: system, description: "FK -> DeidentificationKey.id" }
      - { name: grantee_user_id, type: string, source: input, description: "User allowed to request reveal within the window" }
      - { name: starts_at, type: datetime, source: input, description: "Closed window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Closed window end (inclusive); must be strictly after starts_at" }
      - { name: purpose, type: string, source: input, description: "Free text purpose" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED (sweep expires grants whose ends_at < now)" }

  - name: DestructionOrder
    parent: null
    common_fields: true
    fields:
      - { name: specimen_id, type: string, source: input, description: "FK -> Specimen.id targeted for destruction" }
      - { name: consent_record_id, type: string, source: system, description: "FK -> ConsentRecord.id; set when auto-created by a withdrawal sweep, null for manual orders" }
      - { name: reason, type: enum, source: input, description: "CONSENT_WITHDRAWAL | QUALITY_FAILURE | OTHER" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; 'system' for sweep-created orders" }
      - { name: confirmed_by_user_id, type: string, source: system, description: "X-User-ID of confirmer; must differ from created_by_user_id (segregation of duties)" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | COMPLETED" }
      - { name: due_at, type: datetime, source: computed, description: "= created_at + DESTRUCTION_SLA_HOURS (48)" }
      - { name: completed_late, type: boolean, source: computed, default: false, description: "True when confirmation timestamp is strictly after due_at" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ConsentRecord
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: WITHDRAWAL_PENDING
        trigger: POST /biobank/consent-records/{consentId}/withdraw
        actor: ConsentCoordinator
        preconditions:
          - "Consent must be ACTIVE (ERR_CONSENT_NOT_ACTIVE)"
          - "Consent must be effective: current clock >= effective_from (ERR_CONSENT_NOT_ACTIVE)"
        side_effects:
          - "withdrawal_requested_at = current clock; grace_deadline = withdrawal_requested_at + 72h"
          - "increments ConsentRecord.version by 1"

      - from: WITHDRAWAL_PENDING
        to: ACTIVE
        trigger: POST /biobank/consent-records/{consentId}/rescind-withdrawal
        actor: ConsentCoordinator
        preconditions:
          - "Consent must be WITHDRAWAL_PENDING (ERR_CONSENT_NOT_ACTIVE)"
          - "current clock < grace_deadline (ERR_WITHDRAWAL_GRACE_EXPIRED)"
        side_effects:
          - "withdrawal_requested_at = null; grace_deadline = null"
          - "increments ConsentRecord.version by 1"

      - from: WITHDRAWAL_PENDING
        to: WITHDRAWN
        trigger: "system (POST /biobank/sweeps/process-due when current clock >= grace_deadline)"
        actor: system
        preconditions:
          - "Consent is WITHDRAWAL_PENDING and current clock >= grace_deadline"
        side_effects:
          - "CASCADE depth-1: every Specimen of the same donor whose lifecycle_status in {ACCESSIONED, IN_STORAGE} flips to DESTRUCTION_PENDING; one DestructionOrder (reason CONSENT_WITHDRAWAL, created_by_user_id 'system', consent_record_id set) is auto-created per such specimen"
          - "CASCADE depth-2: every Aliquot of those specimens with status in {IN_STORAGE, RESERVED, QUARANTINED} flips to DESTRUCTION_PENDING"
          - "CASCADE depth-3: for each flipped aliquot whose status was RESERVED, the reserving SampleRequest flips APPROVED -> COMPROMISED and the request's SharingAgreement.reserved_volume_ml decreases by that request's charged_volume_ml while remaining_volume_ml increases by the same amount (release compensation)"
          - "CASCADE depth-3: for each SampleRequest that has an aliquot of those specimens already in DISTRIBUTED status, set recall_required = true (request stays FULFILLED/APPROVED)"
          - "CASCADE depth-2: each DeidentificationKey with specimen_id of an affected specimen and status ACTIVE flips to REVOKED"
          - "increments ConsentRecord.version by 1"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: POST /biobank/consent-records/{consentId}/amendments
        actor: ConsentCoordinator
        preconditions:
          - "Consent must be ACTIVE (ERR_CONSENT_NOT_ACTIVE)"
          - "OCC: expected_consent_record_version must equal current version (ERR_STALE_VERSION)"
        side_effects:
          - "A new ConsentRecord is created for the same donor with status ACTIVE, supersedes_consent_id = old consent id, version 1"
          - "Old consent flips to SUPERSEDED; increments old ConsentRecord.version by 1"

  - entity: CollectionKit
    initial_state: IN_STOCK
    terminal_states: [CONSUMED, EXPIRED]
    transitions:
      - from: IN_STOCK
        to: DISTRIBUTED
        trigger: POST /biobank/collection-kits/{kitId}/distribute
        actor: ConsentCoordinator
        preconditions:
          - "Kit must be IN_STOCK (ERR_KIT_NOT_DISTRIBUTABLE)"
          - "current clock < expires_at (ERR_KIT_EXPIRED)"
        side_effects:
          - "donor_id = payload donor_id; distributed_at = current clock"
          - "Append CustodyEvent(event_type=DISTRIBUTED, actor from X-User-ID)"

      - from: DISTRIBUTED
        to: RETURNED
        trigger: POST /biobank/collection-kits/{kitId}/receive-return
        actor: ConsentCoordinator
        preconditions:
          - "Kit must be DISTRIBUTED (ERR_KIT_NOT_RETURNED)"
          - "current clock < expires_at (ERR_KIT_EXPIRED)"
        side_effects:
          - "returned_at = current clock"
          - "Append CustodyEvent(event_type=RETURNED)"

      - from: RETURNED
        to: CONSUMED
        trigger: "system (POST /biobank/specimens accessions this kit)"
        actor: system
        preconditions:
          - "Kit must be RETURNED (ERR_KIT_NOT_RETURNED)"
        side_effects:
          - "Append CustodyEvent(event_type=CONSUMED)"

      - from: IN_STOCK
        to: EXPIRED
        trigger: "system (POST /biobank/sweeps/process-due when current clock >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Append CustodyEvent(event_type=EXPIRED, actor 'system')"

      - from: DISTRIBUTED
        to: EXPIRED
        trigger: "system (POST /biobank/sweeps/process-due when current clock >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Append CustodyEvent(event_type=EXPIRED, actor 'system')"

  - entity: Specimen
    initial_state: ACCESSIONED
    terminal_states: [DESTROYED]
    transitions:
      - from: ACCESSIONED
        to: IN_STORAGE
        trigger: "system (POST /biobank/specimens with storage_slot_id provided, or first aliquot placement)"
        actor: system
        preconditions:
          - "storage_slot_id provided and slot status AVAILABLE (ERR_SLOT_NOT_AVAILABLE)"
        side_effects: []

      - from: IN_STORAGE
        to: DESTRUCTION_PENDING
        trigger: "system (consent withdrawal cascade) or POST /biobank/destruction-orders (manual)"
        actor: system
        preconditions:
          - "lifecycle_status in {ACCESSIONED, IN_STORAGE}"
        side_effects:
          - "All child aliquots in {IN_STORAGE, RESERVED, QUARANTINED} -> DESTRUCTION_PENDING (see ConsentRecord cascade)"

      - from: ACCESSIONED
        to: DESTRUCTION_PENDING
        trigger: "system (consent withdrawal cascade) or POST /biobank/destruction-orders (manual)"
        actor: system
        preconditions:
          - "lifecycle_status in {ACCESSIONED, IN_STORAGE}"
        side_effects:
          - "All child aliquots in {IN_STORAGE, RESERVED, QUARANTINED} -> DESTRUCTION_PENDING"

      - from: DESTRUCTION_PENDING
        to: DESTROYED
        trigger: "system (POST /biobank/destruction-orders/{orderId}/confirm-execution confirms the covering order)"
        actor: system
        preconditions:
          - "A PENDING DestructionOrder targeting this specimen is confirmed"
        side_effects:
          - "All child aliquots in DESTRUCTION_PENDING -> DESTROYED; their remaining_volume_ml = 0"
          - "Each ACTIVE DeidentificationKey of this specimen -> REVOKED"

      - from: IN_STORAGE
        to: IN_STORAGE
        trigger: "system (unit failure sets viability_status = QUARANTINED; return-to-service restores viability_status = USABLE)"
        actor: system
        preconditions: []
        side_effects: []
        note: "viability_status is a parallel state dimension on Specimen (USABLE | QUARANTINED) that evolves independently of lifecycle_status"

  - entity: Aliquot
    initial_state: IN_STORAGE
    terminal_states: [DISTRIBUTED, DESTROYED, VOID]
    transitions:
      - from: IN_STORAGE
        to: RESERVED
        trigger: "system (POST /biobank/sample-requests/{requestId}/fulfill selector picks this aliquot)"
        actor: system
        preconditions:
          - "Aliquot IN_STORAGE; specimen lifecycle IN_STORAGE, viability USABLE; scope coverage holds"
        side_effects:
          - "reserved_for_request_id = request id"
          - "SharingAgreement.reserved_volume_ml += request charge share; remaining_volume_ml -= same"

      - from: RESERVED
        to: IN_STORAGE
        trigger: "system (POST /biobank/sample-requests/{requestId}/cancel releases reservations)"
        actor: system
        preconditions:
          - "Aliquot RESERVED for the cancelled request"
        side_effects:
          - "reserved_for_request_id = null"
          - "SharingAgreement.reserved_volume_ml -= request charge; remaining_volume_ml += request charge (compensation)"

      - from: RESERVED
        to: DISTRIBUTED
        trigger: POST /biobank/aliquots/{aliquotId}/checkout
        actor: LabTechnician
        preconditions:
          - "Aliquot RESERVED and reserved_for_request_id == payload request_id (ERR_ALIQUOT_NOT_RESERVED_FOR_REQUEST)"
          - "Specimen consent ACTIVE (ERR_CONSENT_NOT_ACTIVE) and scope covers request.required_uses (ERR_CONSENT_SCOPE_VIOLATION)"
          - "StorageUnit containing the aliquot's slot has posture OPERATIONAL (ERR_UNIT_NOT_OPERATIONAL)"
          - "SampleRequest status APPROVED (ERR_REQUEST_NOT_APPROVED)"
        side_effects:
          - "remaining_volume_ml = 0; reserved_for_request_id = null"
          - "Agreement: reserved_volume_ml -= charged share; fulfilled_volume_ml += charged share"
          - "SampleRequest.fulfilled_volume_ml += aliquot.initial_volume_ml; when fulfilled_volume_ml >= volume_needed_ml the request auto-flips APPROVED -> FULFILLED"

      - from: IN_STORAGE
        to: QUARANTINED
        trigger: "system (StorageUnit enters FAILURE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: QUARANTINED
        to: IN_STORAGE
        trigger: "system (POST /biobank/storage-units/{unitId}/return-to-service when unit cumulative_degree_minutes delta over the quarantine window <= VIABILITY_LIMIT_DEG_MIN 120)"
        actor: system
        preconditions: []
        side_effects: []

      - from: QUARANTINED
        to: DESTRUCTION_PENDING
        trigger: "system (return-to-service when quarantine degree-minute delta > 120)"
        actor: system
        preconditions: []
        side_effects:
          - "Auto-create DestructionOrder(reason=QUALITY_FAILURE, created_by_user_id='system') for the parent specimen if none PENDING"

      - from: IN_STORAGE
        to: DESTRUCTION_PENDING
        trigger: "system (consent withdrawal cascade or manual DestructionOrder creation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESERVED
        to: DESTRUCTION_PENDING
        trigger: "system (consent withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Release compensation: reserving request -> COMPROMISED; agreement reserved_volume_ml/remaining_volume_ml rebalanced"

      - from: QUARANTINED
        to: DESTRUCTION_PENDING
        trigger: "system (consent withdrawal cascade or manual DestructionOrder creation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DESTRUCTION_PENDING
        to: DESTROYED
        trigger: "system (DestructionOrder confirmed)"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_volume_ml = 0"

      - from: IN_STORAGE
        to: VOID
        trigger: POST /biobank/aliquots/{aliquotId}/void
        actor: LabTechnician
        preconditions:
          - "Aliquot must be IN_STORAGE (ERR_INVALID_STATE)"
        side_effects:
          - "remaining_volume_ml = 0"
          - "Specimen.residual_volume_ml += aliquot.initial_volume_ml (compensating restore); increments Specimen.version by 1"

  - entity: StorageUnit
    initial_state: OPERATIONAL
    terminal_states: []
    transitions:
      - from: OPERATIONAL
        to: WARNING
        trigger: "system (POST /biobank/storage-units/{unitId}/temperature-readings with temp_c strictly above warn_threshold_c and <= fail_threshold_c)"
        actor: system
        preconditions: []
        side_effects:
          - "peak_excursion_c and cumulative_degree_minutes recomputed"

      - from: WARNING
        to: OPERATIONAL
        trigger: "system (temperature reading with temp_c <= warn_threshold_c)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPERATIONAL
        to: FAILURE
        trigger: "system (reading with temp_c strictly above fail_threshold_c) or POST /biobank/storage-units/{unitId}/declare-failure"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE depth-1: every StorageSlot of the unit -> OFFLINE"
          - "CASCADE depth-2: every SlotReservation of those slots with status BOOKED and ends_at > current clock -> CANCELLED"
          - "CASCADE depth-1: every Aliquot whose storage_slot_id is in the unit and status == IN_STORAGE -> QUARANTINED; every Specimen in those slots gets viability_status = QUARANTINED"

      - from: WARNING
        to: FAILURE
        trigger: "system (reading above fail_threshold_c) or POST /biobank/storage-units/{unitId}/declare-failure"
        actor: system
        preconditions: []
        side_effects:
          - "Same slot/reservation/aliquot cascade as OPERATIONAL -> FAILURE"

      - from: FAILURE
        to: OPERATIONAL
        trigger: POST /biobank/storage-units/{unitId}/return-to-service
        actor: QualityOfficer
        preconditions:
          - "Unit must be FAILURE (ERR_INVALID_STATE)"
        side_effects:
          - "Every StorageSlot OFFLINE -> AVAILABLE"
          - "Every QUARANTINED aliquot: degree-minute delta over quarantine window <= 120 -> IN_STORAGE (and specimen viability USABLE when no child remains quarantined); else -> DESTRUCTION_PENDING with auto DestructionOrder(QUALITY_FAILURE)"

  - entity: SampleRequest
    initial_state: DRAFT
    terminal_states: [REJECTED, CANCELLED, COMPROMISED, FULFILLED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: POST /biobank/sample-requests/{requestId}/submit
        actor: Researcher
        preconditions:
          - "Request must be DRAFT (ERR_REQUEST_NOT_UNDER_REVIEW inverted: ERR_INVALID_STATE)"
          - "requester_user_id == X-User-ID (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []

      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: POST /biobank/sample-requests/{requestId}/submit
        actor: Researcher
        preconditions:
          - "Request must be REVISION_REQUESTED (ERR_INVALID_STATE)"
          - "revision_round < MAX_REVISION_ROUNDS (2) (ERR_MAX_REVISION_ROUNDS)"
        side_effects:
          - "revision_round += 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "system (vote causes votes_for >= QUORUM_COUNT 3)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system (vote causes votes_against >= COMMITTEE_SIZE - QUORUM_COUNT + 1 = 3)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: POST /biobank/sample-requests/{requestId}/request-revision
        actor: CommitteeReviewer
        preconditions:
          - "Request must be UNDER_REVIEW (ERR_REQUEST_NOT_UNDER_REVIEW)"
          - "revision_round < 2 (ERR_MAX_REVISION_ROUNDS)"
        side_effects:
          - "Existing votes are cleared: votes_for = 0, votes_against = 0; prior ReviewVote rows remain as immutable history"

      - from: APPROVED
        to: FULFILLED
        trigger: "system (checkout causes fulfilled_volume_ml >= volume_needed_ml)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: COMPROMISED
        trigger: "system (consent withdrawal cascade destroys a RESERVED aliquot of this request)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: POST /biobank/sample-requests/{requestId}/cancel
        actor: Researcher
        preconditions:
          - "requester_user_id == X-User-ID (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []

      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: POST /biobank/sample-requests/{requestId}/cancel
        actor: Researcher
        preconditions:
          - "requester_user_id == X-User-ID"
        side_effects: []

      - from: REVISION_REQUESTED
        to: CANCELLED
        trigger: POST /biobank/sample-requests/{requestId}/cancel
        actor: Researcher
        preconditions:
          - "requester_user_id == X-User-ID"
        side_effects: []

      - from: APPROVED
        to: CANCELLED
        trigger: POST /biobank/sample-requests/{requestId}/cancel
        actor: Researcher
        preconditions:
          - "requester_user_id == X-User-ID"
        side_effects:
          - "All aliquots RESERVED for this request -> IN_STORAGE; agreement reserved_volume_ml -= charged_volume_ml, remaining_volume_ml += charged_volume_ml"

  - entity: SharingAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /biobank/sharing-agreements/{agreementId}/activate
        actor: BiobankAdmin
        preconditions:
          - "Agreement must be DRAFT (ERR_INVALID_STATE)"
          - "current clock < effective_to (ERR_AGREEMENT_NOT_EFFECTIVE)"
        side_effects:
          - "remaining_volume_ml = total_committed_volume_ml"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /biobank/sweeps/process-due when current clock >= effective_to)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: POST /biobank/sharing-agreements/{agreementId}/terminate
        actor: BiobankAdmin
        preconditions:
          - "Agreement must be ACTIVE (ERR_INVALID_STATE)"
          - "reserved_volume_ml == 0 (ERR_AGREEMENT_HAS_ACTIVE_RESERVATIONS)"
        side_effects: []

  - entity: DeidentificationKey
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "system (specimen destroyed, consent withdrawal cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: KeyAccessGrant
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /biobank/sweeps/process-due when current clock > ends_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: StorageSlot
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OFFLINE
        trigger: "system (StorageUnit enters FAILURE)"
        actor: system
        preconditions: []
        side_effects:
          - "BOOKED reservations with ends_at > now -> CANCELLED"

      - from: OFFLINE
        to: AVAILABLE
        trigger: "system (StorageUnit return-to-service)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DestructionOrder
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: POST /biobank/destruction-orders/{orderId}/confirm-execution
        actor: QualityOfficer
        preconditions:
          - "Order must be PENDING (ERR_DESTRUCTION_ORDER_NOT_CONFIRMABLE)"
          - "confirmed_by (X-User-ID) != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "confirmed_by_user_id = X-User-ID; completed_late = (current clock > due_at)"
          - "Specimen -> DESTROYED; DESTRUCTION_PENDING aliquots -> DESTROYED (remaining_volume_ml = 0); ACTIVE DeidentificationKeys -> REVOKED"

# =============================================================================
# Concurrency Rules (OCC only — see SKILL.md section 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: aliquot-create-stale-specimen
    parent_entity: Specimen
    write_endpoint: "POST /biobank/specimens/{specimenId}/aliquots"
    occ_field: expected_specimen_version
    description: |
      Creating an Aliquot against a Specimen whose version has advanced since
      the client last observed it (e.g., another aliquot creation or a void
      changed residual_volume_ml) is rejected. The client must re-read the
      specimen and retry with the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: consent-amend-stale-consent
    parent_entity: ConsentRecord
    write_endpoint: "POST /biobank/consent-records/{consentId}/amendments"
    occ_field: expected_consent_record_version
    description: |
      Creating an amendment against a ConsentRecord whose version has advanced
      since the client last observed it (e.g., a prior amendment already
      superseded it, or a withdraw/rescind bumped the version) is rejected.
      Amendments legitimately supersede the prior record, so a second
      sequential amendment against the same observed version must fail on the
      stale version alone.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: specimen_volume_reconciliation
    trigger: "aliquot creation, aliquot void"
    algorithm: aggregation
    formula: |
      residual_volume_ml = initial_volume_ml
        - SUM(aliquot.initial_volume_ml for aliquots of this specimen where status != VOID)
      Recomputed immediately on aliquot create (debit) and on void (compensating credit).
    input_set: "All Aliquot rows of the specimen in any status except VOID"
    precision: "3 decimal places, round_half_up"

  - name: specimen_committed_volume
    trigger: "aliquot status change (fulfill reservation, release, checkout, void, destroy)"
    algorithm: aggregation
    formula: |
      committed_volume_book_ml = SUM(aliquot.initial_volume_ml
        where aliquot.status in {RESERVED, DESTRUCTION_PENDING, DISTRIBUTED, DESTROYED})
      committed_volume_physical_ml = SUM(aliquot.initial_volume_ml
        where aliquot.status in {DISTRIBUTED, DESTROYED})
    input_set: "All Aliquot rows of the specimen except VOID"
    precision: "3 decimal places, round_half_up"
    variants:
      - name: book
        when: "Forward-looking quota/space planning; counts RESERVED and DESTRUCTION_PENDING as committed"
        difference: "Includes aliquots merely reserved or queued for destruction, so it exceeds physical whenever reservations exist"
      - name: physical
        when: "Chronological removal audit; counts only aliquots physically gone"
        difference: "Excludes RESERVED/DESTRUCTION_PENDING, so it lags book until checkout/destruction completes"

  - name: freezer_excursion_assessment
    trigger: "temperature reading ingest"
    algorithm: threshold
    formula: |
      peak_excursion_c = MAX(0, MAX(reading.temp_c - unit.warn_threshold_c) over all readings of the unit)
      For each reading with temp_c strictly above warn_threshold_c:
        cumulative_degree_minutes += (reading.temp_c - unit.warn_threshold_c)
          * minutes_between(reading.recorded_at, previous reading.recorded_at)
      Readings at or below warn_threshold_c contribute 0 (and end any excursion posture).
      The first reading of a unit has no previous reading and accrues 0.
    input_set: "All TemperatureReading rows of the unit, ordered by recorded_at ASC, tie-break created_at ASC"
    constants:
      VIABILITY_LIMIT_DEG_MIN: 120
    precision: "2 decimal places, round_half_up"
    variants:
      - name: peak
        when: "Instantaneous severity reporting and posture transitions"
        difference: "Reports the single worst deviation; a unit at -65C once and a unit at -66C for hours share the same peak"
      - name: cumulative
        when: "Aliquot viability review at return-to-service (threshold VIABILITY_LIMIT_DEG_MIN 120)"
        difference: "Time-weights deviations; long mild excursions can exceed short sharp ones"

  - name: fulfillment_quota_charge
    trigger: "POST /biobank/sample-requests/{requestId}/fulfill"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: (1) selection volume, (2) pre-fulfillment utilization,
      # (3) multiplier branch, (4) cap against remaining, (5) feasibility gate.
      V      = SUM(selected_aliquot.initial_volume_ml)               # step 1
      U_pre  = agreement.fulfilled_volume_ml / agreement.total_committed_volume_ml   # step 2
      M      = SURCHARGE_MULT if U_pre >= SURCHARGE_UTILIZATION else 1.0             # step 3
      charge = V * M                                                 # step 4 raw
      if charge > agreement.remaining_volume_ml: reject ERR_INSUFFICIENT_QUOTA       # step 5 (no partial debit)
      agreement.reserved_volume_ml += charge; agreement.remaining_volume_ml -= charge
      request.charged_volume_ml = charge
    input_set: "Aliquots selected by the fulfill selector for this request; the linked SharingAgreement"
    constants:
      SURCHARGE_UTILIZATION: 0.8
      SURCHARGE_MULT: 1.25
    precision: "3 decimal places, round_half_up"

  - name: handling_fee_cents
    trigger: "POST /biobank/sample-requests/{requestId}/fulfill (after selection)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each per-aliquot fee to integer cents FIRST, then sum.
      # The alternative (sum raw fees, then round) yields different cents and is NOT used.
      per_aliquot_fee_cents(aliquot) = round_half_up(BASE_FEE_CENTS + aliquot.initial_volume_ml * RATE_CENTS_PER_ML, 0)
      request.handling_fee_cents = SUM(per_aliquot_fee_cents over selected aliquots)
      Example divergence: two 0.5ml aliquots -> per-aliquot 501.25 -> 501 each -> total 1002;
      sum-then-round would give round(1002.5) = 1003.
    input_set: "Aliquots selected by the fulfill selector"
    constants:
      BASE_FEE_CENTS: 500
      RATE_CENTS_PER_ML: 2.5
    precision: "0 decimal places per aliquot line, round_half_up; total is an exact integer sum"

  - name: committee_quorum
    trigger: "each ReviewVote creation"
    algorithm: threshold
    formula: |
      QUORUM_COUNT = ceil(COMMITTEE_SIZE * QUORUM_RATIO) = ceil(5 * 0.6) = 3
      if votes_for >= QUORUM_COUNT: request -> APPROVED
      elif votes_against >= COMMITTEE_SIZE - QUORUM_COUNT + 1 (= 3): request -> REJECTED
      Boundary is inclusive on both sides (>=); exactly 3 approvals approves, exactly 3 rejections rejects.
    input_set: "ReviewVote rows of the request in the current review round"
    constants:
      COMMITTEE_SIZE: 5
      QUORUM_RATIO: 0.6
    precision: "integer counts; no rounding"

  - name: withdrawal_grace_deadline
    trigger: "POST /biobank/consent-records/{consentId}/withdraw; evaluated by POST /biobank/sweeps/process-due"
    algorithm: threshold
    formula: |
      grace_deadline = withdrawal_requested_at + GRACE_HOURS
      Sweep finalizes (WITHDRAWAL_PENDING -> WITHDRAWN) when current_utc >= grace_deadline (inclusive).
      Rescind is allowed only while current_utc < grace_deadline (strict).
    input_set: "ConsentRecord rows with status WITHDRAWAL_PENDING"
    constants:
      GRACE_HOURS: 72
    precision: "ISO8601 timestamps, second precision"

  - name: destruction_sla
    trigger: "DestructionOrder creation; confirm-execution"
    algorithm: threshold
    formula: |
      due_at = created_at + DESTRUCTION_SLA_HOURS
      completed_late = (confirm timestamp > due_at)   # strictly greater; exactly at due_at is on time
    input_set: "The DestructionOrder"
    constants:
      DESTRUCTION_SLA_HOURS: 48
    precision: "ISO8601 timestamps, second precision"

  - name: fulfill_aliquot_selection
    trigger: "POST /biobank/sample-requests/{requestId}/fulfill"
    algorithm: constraint_propagation
    formula: |
      Eligibility filter (all must hold):
        aliquot.status == IN_STORAGE
        aliquot.specimen.lifecycle_status == IN_STORAGE
        aliquot.specimen.viability_status == USABLE
        aliquot.specimen.specimen_type == request.specimen_type
        aliquot.specimen.consent.status == ACTIVE
        consent_scope_coverage(aliquot.specimen.consent, request.required_uses) == true
      Ranking: specimen.collected_at ASC, tie-break aliquot.created_at ASC (never id).
      Greedy accumulation in ranking order until cumulative volume >= request.volume_needed_ml.
      Empty/insufficient pool -> ERR_INSUFFICIENT_INVENTORY (no partial reservation).
    input_set: "All Aliquot rows joined to their Specimen and ConsentRecord"
    precision: "3 decimal places on volume sums"

  - name: consent_scope_coverage
    trigger: "fulfill selection; aliquot checkout"
    algorithm: constraint_propagation
    formula: |
      covered = (request.required_uses SUBSET_OF consent.permitted_uses)
                AND (INTERSECTION(request.required_uses, consent.excluded_uses) == empty)
    input_set: "One ConsentRecord and one required_uses set"
    precision: "exact set algebra"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per the RBAC matrix; for requester-owned mutations (submit/cancel) X-User-ID must equal requester_user_id"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Resource ids in the path must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3.5
    category: existence
    check: "OCC: expected_<parent>_version must equal the parent's current version (checked before any business rule)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /biobank/specimens/{specimenId}/aliquots; POST /biobank/consent-records/{consentId}/amendments"

  - priority: 3.6
    category: existence
    check: "Input shape: required fields present, types valid, enum values in range, starts_at < ends_at where applicable; unknown request fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 4
    category: state
    check: "Target resource must be in the state required by the transition (kit IN_STOCK/DISTRIBUTED, consent ACTIVE, request UNDER_REVIEW/APPROVED, aliquot RESERVED for this request, order PENDING, agreement DRAFT/ACTIVE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
    note: "Domain-specific state errors (ERR_KIT_NOT_DISTRIBUTABLE, ERR_KIT_NOT_RETURNED, ERR_CONSENT_NOT_ACTIVE, ERR_REQUEST_NOT_UNDER_REVIEW, ERR_REQUEST_NOT_APPROVED, ERR_ALIQUOT_NOT_RESERVED_FOR_REQUEST, ERR_DESTRUCTION_ORDER_NOT_CONFIRMABLE, ERR_KEY_NOT_ACTIVE, ERR_ALREADY_TERMINAL) are all priority-4 state errors"

  - priority: 5
    category: business_safety
    check: "Consent of the specimen must be ACTIVE for accession, fulfill selection, and checkout"
    error_id: ERR_CONSENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /biobank/specimens; POST /biobank/sample-requests/{id}/fulfill; POST /biobank/aliquots/{id}/checkout"

  - priority: 6
    category: business_safety
    check: "Consent scope coverage: request.required_uses must be a subset of consent.permitted_uses and disjoint from consent.excluded_uses"
    error_id: ERR_CONSENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /biobank/sample-requests/{id}/fulfill; POST /biobank/aliquots/{id}/checkout"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: destruction confirmer != order creator; committee reviewer != request requester; reveal officer != grant grantee"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /biobank/destruction-orders/{id}/confirm-execution; POST /biobank/sample-requests/{id}/votes; POST /biobank/deidentification-keys/{id}/reveal"

  - priority: 8
    category: business_referential
    check: "Cross-references must cohere: kit.donor_id == specimen.donor_id and consent.donor_id == specimen.donor_id at accession; one non-REVOKED DeidentificationKey per specimen"
    error_id: ERR_DONOR_MISMATCH
    http_status: 400
    applies_to: "POST /biobank/specimens"
    note: "Duplicate-key creation raises ERR_KEY_ALREADY_EXISTS (409) at the same priority tier on POST /biobank/deidentification-keys"

  - priority: 9
    category: business_temporal
    check: "Kit must be unexpired (current clock < expires_at) at distribute, receive-return, and accession"
    error_id: ERR_KIT_EXPIRED
    http_status: 409
    applies_to: "POST /biobank/collection-kits/{id}/distribute; POST /biobank/collection-kits/{id}/receive-return; POST /biobank/specimens"

  - priority: 10
    category: business_temporal
    check: "SharingAgreement must be ACTIVE with effective_from <= current clock < effective_to at fulfill"
    error_id: ERR_AGREEMENT_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /biobank/sample-requests/{id}/fulfill"

  - priority: 11
    category: business_temporal
    check: "SlotReservation windows are half-open [starts_at, ends_at): overlap with any BOOKED reservation of the same slot is rejected; back-to-back adjacency (new.starts_at == existing.ends_at) is allowed"
    error_id: ERR_SLOT_RESERVATION_OVERLAP
    http_status: 409
    applies_to: "POST /biobank/storage-slots/{id}/reservations"

  - priority: 12
    category: business_temporal
    check: "KeyAccessGrant windows are CLOSED [starts_at, ends_at] with a mandatory 24h buffer: touching endpoints count as overlap, and a gap to any existing grant on the same key of less than 24 hours on either side is rejected"
    error_id: ERR_GRANT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /biobank/deidentification-keys/{id}/grants"

  - priority: 13
    category: business_constraint
    check: "One vote per reviewer per request per review round"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /biobank/sample-requests/{id}/votes"

  - priority: 14
    category: business_constraint
    check: "revision_round must stay < 2 for request-revision and resubmit"
    error_id: ERR_MAX_REVISION_ROUNDS
    http_status: 409
    applies_to: "POST /biobank/sample-requests/{id}/request-revision; POST /biobank/sample-requests/{id}/submit"

  - priority: 15
    category: business_constraint
    check: "Aliquot initial_volume_ml must be > 0 and <= specimen.residual_volume_ml (equality allowed)"
    error_id: ERR_INSUFFICIENT_SPECIMEN_VOLUME
    http_status: 422
    applies_to: "POST /biobank/specimens/{id}/aliquots"

  - priority: 16
    category: business_constraint
    check: "Fulfill selector pool must cover request.volume_needed_ml"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /biobank/sample-requests/{id}/fulfill"

  - priority: 17
    category: business_fiscal
    check: "Agreement quota: computed charge must be <= remaining_volume_ml (fiscal check is last among business rules)"
    error_id: ERR_INSUFFICIENT_QUOTA
    http_status: 402
    applies_to: "POST /biobank/sample-requests/{id}/fulfill"

  - priority: 18
    category: business_constraint
    check: "StorageUnit posture must be OPERATIONAL for aliquot checkout and new slot reservations"
    error_id: ERR_UNIT_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /biobank/aliquots/{id}/checkout; POST /biobank/storage-slots/{id}/reservations"

  - priority: 19
    category: business_constraint
    check: "Agreement scope must cover request.required_uses at request creation"
    error_id: ERR_AGREEMENT_SCOPE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /biobank/sample-requests"

  - priority: 20
    category: business_constraint
    check: "Agreement termination requires reserved_volume_ml == 0"
    error_id: ERR_AGREEMENT_HAS_ACTIVE_RESERVATIONS
    http_status: 409
    applies_to: "POST /biobank/sharing-agreements/{id}/terminate"

  - priority: 21
    category: business_constraint
    check: "Temperature reading plausibility: -100.0 <= temp_c <= 25.0"
    error_id: ERR_INVALID_TEMPERATURE_READING
    http_status: 400
    applies_to: "POST /biobank/storage-units/{id}/temperature-readings"

  - priority: 22
    category: business_constraint
    check: "Rationale/justification minimum length: vote rationale >= 20 chars; reveal justification >= 20 chars"
    error_id: ERR_JUSTIFICATION_TOO_SHORT
    http_status: 400
    applies_to: "POST /biobank/sample-requests/{id}/votes; POST /biobank/sample-requests/{id}/request-revision; POST /biobank/deidentification-keys/{id}/reveal"

  - priority: 23
    category: business_constraint
    check: "Reveal requires an ACTIVE KeyAccessGrant whose closed window contains the current clock, key ACTIVE, and consent.allow_reidentification == true"
    error_id: ERR_NO_ACTIVE_GRANT
    http_status: 403
    applies_to: "POST /biobank/deidentification-keys/{id}/reveal"

  - priority: 24
    category: business_constraint
    check: "Reveal window containment and dual-control prerequisites beyond SoD (grant exists on this key, window contains current clock)"
    error_id: ERR_NO_ACTIVE_GRANT
    http_status: 403
    applies_to: "POST /biobank/deidentification-keys/{id}/reveal"
    note: "Same error as priority 23; kept as the terminal reveal gate"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock & sweep ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Startup default (before any set) is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [BiobankAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock set; no sweep runs implicitly"]

  - method: POST
    path: "/biobank/sweeps/process-due"
    description: "Ops-run checkpoint: finalize due consent withdrawals (with cascade), expire kits/grants/agreements, complete elapsed slot reservations"
    roles: [BiobankAdmin]
    code: 200
    input: []
    output: { withdrawals_finalized: integer, kits_expired: integer, agreements_expired: integer, grants_expired: integer, reservations_completed: integer }
    side_effects: ["all deadline-gated system transitions fire per the state machines"]

  # --- Donors ---
  - method: POST
    path: "/biobank/donors"
    description: "Register a donor"
    roles: [ConsentCoordinator]
    code: 201
    input: [donor_reference_code]
    output: Donor
    side_effects: ["status = ENROLLED"]

  - method: GET
    path: "/biobank/donors/{donorId}"
    description: "Get a donor"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: Donor
    side_effects: []

  # --- Consent records ---
  - method: POST
    path: "/biobank/donors/{donorId}/consent-records"
    description: "File a consent record for a donor"
    roles: [ConsentCoordinator]
    code: 201
    input: [permitted_uses, effective_from, "excluded_uses?", "allow_reidentification?"]
    output: ConsentRecord
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/biobank/consent-records"
    description: "List consent records with optional filters"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: ["donor_id?", "supersedes_consent_id?", "status?"]
    output: ConsentRecord[]
    side_effects: []

  - method: GET
    path: "/biobank/donors/{donorId}/consent-records"
    description: "List consent records of a donor"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: ConsentRecord[]
    side_effects: []

  - method: GET
    path: "/biobank/consent-records/{consentId}"
    description: "Get a consent record"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []

  - method: POST
    path: "/biobank/consent-records/{consentId}/withdraw"
    description: "Initiate consent withdrawal (enters 72h grace period)"
    roles: [ConsentCoordinator]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["status -> WITHDRAWAL_PENDING; grace_deadline = now + 72h; increments version by 1"]

  - method: POST
    path: "/biobank/consent-records/{consentId}/rescind-withdrawal"
    description: "Rescind a pending withdrawal inside the grace window"
    roles: [ConsentCoordinator]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["status -> ACTIVE; grace fields cleared; increments version by 1"]

  - method: POST
    path: "/biobank/consent-records/{consentId}/amendments"
    description: "File an amendment that supersedes the current consent (OCC-guarded)"
    roles: [ConsentCoordinator]
    code: 201
    input: [permitted_uses, effective_from, expected_consent_record_version, "excluded_uses?", "allow_reidentification?"]
    output: ConsentRecord
    side_effects: ["old consent -> SUPERSEDED and increments ConsentRecord.version by 1; new record ACTIVE with supersedes_consent_id set"]

  # --- Collection kits & custody ---
  - method: POST
    path: "/biobank/collection-kits"
    description: "Register a collection kit into stock"
    roles: [ConsentCoordinator]
    code: 201
    input: [kit_type, expires_at]
    output: CollectionKit
    side_effects: ["status = IN_STOCK"]

  - method: GET
    path: "/biobank/collection-kits"
    description: "List collection kits with optional filters"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: ["donor_id?", "status?"]
    output: CollectionKit[]
    side_effects: []

  - method: GET
    path: "/biobank/collection-kits/{kitId}"
    description: "Get a collection kit"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: CollectionKit
    side_effects: []

  - method: POST
    path: "/biobank/collection-kits/{kitId}/distribute"
    description: "Distribute a kit to a donor (custody event)"
    roles: [ConsentCoordinator]
    code: 200
    input: [donor_id, "location?", "note?"]
    output: CollectionKit
    side_effects: ["status -> DISTRIBUTED; append CustodyEvent(DISTRIBUTED)"]

  - method: POST
    path: "/biobank/collection-kits/{kitId}/receive-return"
    description: "Receive a kit back (custody event)"
    roles: [ConsentCoordinator]
    code: 200
    input: ["location?", "note?"]
    output: CollectionKit
    side_effects: ["status -> RETURNED; append CustodyEvent(RETURNED)"]

  - method: GET
    path: "/biobank/collection-kits/{id}/custody-events"
    description: "List custody events of a kit, ordered created_at ASC"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: CustodyEvent[]
    side_effects: []

  # --- Specimens ---
  - method: POST
    path: "/biobank/specimens"
    description: "Accession a specimen from a returned kit"
    roles: [LabTechnician]
    code: 201
    input: [donor_id, kit_id, consent_record_id, specimen_type, initial_volume_ml, collected_at, "storage_slot_id?"]
    output: Specimen
    side_effects: ["kit -> CONSUMED (+ CustodyEvent CONSUMED); lifecycle IN_STORAGE when storage_slot_id provided else ACCESSIONED; residual_volume_ml = initial_volume_ml"]

  - method: GET
    path: "/biobank/specimens"
    description: "List specimens with optional filters (paginated)"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: ["donor_id?", "kit_id?", "consent_record_id?", "storage_slot_id?", "lifecycle_status?", "viability_status?", "limit?", "offset?"]
    output: Specimen[]
    side_effects: []

  - method: GET
    path: "/biobank/specimens/{specimenId}"
    description: "Get a specimen"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: Specimen
    side_effects: []

  # --- Aliquots ---
  - method: POST
    path: "/biobank/specimens/{specimenId}/aliquots"
    description: "Create an aliquot from a specimen (OCC-guarded, debits residual volume)"
    roles: [LabTechnician]
    code: 201
    input: [initial_volume_ml, expected_specimen_version, "storage_slot_id?"]
    output: Aliquot
    side_effects: ["Specimen.residual_volume_ml -= initial_volume_ml; increments Specimen.version by 1"]

  - method: GET
    path: "/biobank/specimens/{specimenId}/aliquots"
    description: "List aliquots of a specimen"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: Aliquot[]
    side_effects: []

  - method: GET
    path: "/biobank/aliquots"
    description: "List aliquots with optional filters"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: ["specimen_id?", "storage_slot_id?", "reserved_for_request_id?", "status?"]
    output: Aliquot[]
    side_effects: []

  - method: GET
    path: "/biobank/aliquots/{aliquotId}"
    description: "Get an aliquot"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: Aliquot
    side_effects: []

  - method: POST
    path: "/biobank/aliquots/{aliquotId}/void"
    description: "Void an IN_STORAGE aliquot (compensating volume restore)"
    roles: [LabTechnician]
    code: 200
    input: []
    output: Aliquot
    side_effects: ["status -> VOID; Specimen.residual_volume_ml += initial_volume_ml; increments Specimen.version by 1"]

  - method: POST
    path: "/biobank/aliquots/{aliquotId}/checkout"
    description: "Ship a RESERVED aliquot against its reserving request"
    roles: [LabTechnician]
    code: 200
    input: [request_id]
    output: Aliquot
    side_effects: ["status -> DISTRIBUTED; remaining_volume_ml = 0; agreement reserved->fulfilled; request.fulfilled_volume_ml += initial_volume_ml; request may auto-complete to FULFILLED"]

  # --- Storage ---
  - method: POST
    path: "/biobank/storage-units"
    description: "Register a freezer"
    roles: [BiobankAdmin]
    code: 201
    input: [unit_code, setpoint_c, "warn_threshold_c?", "fail_threshold_c?"]
    output: StorageUnit
    side_effects: ["posture = OPERATIONAL"]

  - method: GET
    path: "/biobank/storage-units/{unitId}"
    description: "Get a storage unit"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: StorageUnit
    side_effects: []

  - method: POST
    path: "/biobank/storage-units/{id}/slots"
    description: "Define a storage slot in a unit"
    roles: [BiobankAdmin]
    code: 201
    input: [slot_code, capacity_ml]
    output: StorageSlot
    side_effects: ["status = AVAILABLE"]

  - method: GET
    path: "/biobank/storage-units/{id}/slots"
    description: "List slots of a unit"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: StorageSlot[]
    side_effects: []

  - method: GET
    path: "/biobank/storage-slots/{slotId}"
    description: "Get a storage slot"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: StorageSlot
    side_effects: []

  - method: POST
    path: "/biobank/storage-slots/{id}/reservations"
    description: "Book a half-open maintenance/transfer window on a slot"
    roles: [LabTechnician]
    code: 201
    input: [starts_at, ends_at, purpose]
    output: SlotReservation
    side_effects: ["status = BOOKED"]

  - method: GET
    path: "/biobank/storage-slots/{id}/reservations"
    description: "List reservations of a slot"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: SlotReservation[]
    side_effects: []

  - method: POST
    path: "/biobank/storage-units/{id}/temperature-readings"
    description: "Ingest a temperature reading; drives posture and excursion metrics"
    roles: [LabTechnician]
    code: 201
    input: [recorded_at, temp_c]
    output: TemperatureReading
    side_effects: ["posture re-evaluated (OPERATIONAL/WARNING/FAILURE); peak_excursion_c and cumulative_degree_minutes recomputed; FAILURE fires the slot/reservation/aliquot cascade"]

  - method: GET
    path: "/biobank/storage-units/{id}/temperature-readings"
    description: "List readings of a unit, ordered recorded_at ASC, tie-break created_at ASC"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: TemperatureReading[]
    side_effects: []

  - method: POST
    path: "/biobank/storage-units/{unitId}/declare-failure"
    description: "Declare freezer failure (contingency cascade)"
    roles: [QualityOfficer]
    code: 200
    input: ["note?"]
    output: StorageUnit
    side_effects: ["posture -> FAILURE; slots OFFLINE; future BOOKED reservations CANCELLED; contained aliquots QUARANTINED; specimens viability QUARANTINED"]

  - method: POST
    path: "/biobank/storage-units/{unitId}/return-to-service"
    description: "Return a failed freezer to service; viability review of quarantined contents"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: StorageUnit
    side_effects: ["posture -> OPERATIONAL; slots AVAILABLE; quarantined aliquots released to IN_STORAGE or moved to DESTRUCTION_PENDING per degree-minute viability check"]

  # --- Sample requests & committee review ---
  - method: POST
    path: "/biobank/sample-requests"
    description: "Create a sample request (requester = X-User-ID)"
    roles: [Researcher]
    code: 201
    input: [title, required_uses, specimen_type, volume_needed_ml, sharing_agreement_id]
    output: SampleRequest
    side_effects: ["status = DRAFT; revision_round = 0"]

  - method: GET
    path: "/biobank/sample-requests"
    description: "List sample requests with optional filters"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: ["sharing_agreement_id?", "status?"]
    output: SampleRequest[]
    side_effects: []

  - method: GET
    path: "/biobank/sample-requests/{requestId}"
    description: "Get a sample request"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: SampleRequest
    side_effects: []

  - method: POST
    path: "/biobank/sample-requests/{requestId}/submit"
    description: "Submit for committee review (DRAFT or REVISION_REQUESTED -> UNDER_REVIEW)"
    roles: [Researcher]
    code: 200
    input: []
    output: SampleRequest
    side_effects: ["from REVISION_REQUESTED: revision_round += 1"]

  - method: POST
    path: "/biobank/sample-requests/{id}/votes"
    description: "Cast a committee vote (one per reviewer per review round)"
    roles: [CommitteeReviewer]
    code: 201
    input: [decision, rationale]
    output: ReviewVote
    side_effects: ["votes_for/votes_against recomputed; quorum thresholds may auto-flip request to APPROVED or REJECTED"]

  - method: GET
    path: "/biobank/sample-requests/{id}/votes"
    description: "List votes of the current review round"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: ReviewVote[]
    side_effects: []

  - method: POST
    path: "/biobank/sample-requests/{requestId}/request-revision"
    description: "Send the request back for revision (cycle), bounded by MAX_REVISION_ROUNDS"
    roles: [CommitteeReviewer]
    code: 200
    input: [rationale]
    output: SampleRequest
    side_effects: ["status -> REVISION_REQUESTED; votes_for/votes_against reset to 0 for the new round"]

  - method: POST
    path: "/biobank/sample-requests/{requestId}/fulfill"
    description: "Allocate aliquots via the deterministic selector; debits agreement quota and computes handling fee"
    roles: [BiobankAdmin]
    code: 200
    input: []
    output: SampleRequest
    side_effects: ["selected aliquots -> RESERVED; agreement remaining_volume_ml -> reserved_volume_ml by charged_volume_ml; handling_fee_cents computed (round-per-aliquot-then-sum)"]

  - method: POST
    path: "/biobank/sample-requests/{requestId}/cancel"
    description: "Cancel own request; releases any reservations back to inventory and quota"
    roles: [Researcher]
    code: 200
    input: []
    output: SampleRequest
    side_effects: ["status -> CANCELLED; RESERVED aliquots -> IN_STORAGE; agreement reserved_volume_ml -> remaining_volume_ml by charged_volume_ml"]

  # --- Sharing agreements ---
  - method: POST
    path: "/biobank/sharing-agreements"
    description: "Create a material transfer / sharing agreement"
    roles: [BiobankAdmin]
    code: 201
    input: [recipient_institution, scope_uses, total_committed_volume_ml, effective_from, effective_to]
    output: SharingAgreement
    side_effects: ["status = DRAFT; remaining/reserved/fulfilled initialized"]

  - method: GET
    path: "/biobank/sharing-agreements/{agreementId}"
    description: "Get a sharing agreement"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: SharingAgreement
    side_effects: []

  - method: POST
    path: "/biobank/sharing-agreements/{agreementId}/activate"
    description: "Activate an agreement"
    roles: [BiobankAdmin]
    code: 200
    input: []
    output: SharingAgreement
    side_effects: ["status -> ACTIVE; remaining_volume_ml = total_committed_volume_ml"]

  - method: POST
    path: "/biobank/sharing-agreements/{agreementId}/terminate"
    description: "Terminate an agreement (blocked while reservations are outstanding)"
    roles: [BiobankAdmin]
    code: 200
    input: []
    output: SharingAgreement
    side_effects: ["status -> TERMINATED"]

  # --- De-identification keys & access grants ---
  - method: POST
    path: "/biobank/deidentification-keys"
    description: "Mint a de-identification key for a specimen (at most one non-REVOKED key per specimen)"
    roles: [ConsentCoordinator]
    code: 201
    input: [specimen_id]
    output: DeidentificationKey
    side_effects: ["status = ACTIVE; key_code minted; holder_user_id = X-User-ID"]

  - method: GET
    path: "/biobank/deidentification-keys"
    description: "List de-identification keys with optional filters"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: ["specimen_id?", "status?"]
    output: DeidentificationKey[]
    side_effects: []

  - method: GET
    path: "/biobank/deidentification-keys/{keyId}"
    description: "Get a de-identification key"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: DeidentificationKey
    side_effects: []

  - method: POST
    path: "/biobank/deidentification-keys/{id}/grants"
    description: "Grant time-boxed re-identification access (closed window + 24h buffer rule)"
    roles: [ConsentCoordinator]
    code: 201
    input: [grantee_user_id, starts_at, ends_at, purpose]
    output: KeyAccessGrant
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/biobank/deidentification-keys/{id}/grants"
    description: "List access grants of a key"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: KeyAccessGrant[]
    side_effects: []

  - method: POST
    path: "/biobank/deidentification-keys/{keyId}/reveal"
    description: "Re-identify a specimen under an active grant (dual control: officer != grantee)"
    roles: [QualityOfficer]
    code: 200
    input: [grant_id, justification]
    output: DeidentificationKey
    side_effects: ["reveal_count += 1"]

  # --- Destruction orders ---
  - method: POST
    path: "/biobank/destruction-orders"
    description: "Manually create a destruction order for a specimen"
    roles: [QualityOfficer]
    code: 201
    input: [specimen_id, reason]
    output: DestructionOrder
    side_effects: ["specimen -> DESTRUCTION_PENDING; child aliquots in {IN_STORAGE, RESERVED, QUARANTINED} -> DESTRUCTION_PENDING; due_at = created_at + 48h"]

  - method: GET
    path: "/biobank/destruction-orders"
    description: "List destruction orders with optional filters"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: ["consent_record_id?", "specimen_id?", "status?"]
    output: DestructionOrder[]
    side_effects: []

  - method: GET
    path: "/biobank/destruction-orders/{orderId}"
    description: "Get a destruction order"
    roles: [BiobankAdmin, ConsentCoordinator, LabTechnician, CommitteeReviewer, Researcher, QualityOfficer]
    code: 200
    input: []
    output: DestructionOrder
    side_effects: []

  - method: POST
    path: "/biobank/destruction-orders/{orderId}/confirm-execution"
    description: "Confirm destruction (segregation of duties: confirmer != creator)"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: DestructionOrder
    side_effects: ["status -> COMPLETED; specimen -> DESTROYED; aliquots DESTRUCTION_PENDING -> DESTROYED; keys REVOKED; completed_late computed"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint, or requester ownership check failed" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A resource id in the path does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, starts_at >= ends_at, or unknown request field" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure on the target resource" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action attempted on a resource in a terminal state" }
  - { id: ERR_CONSENT_NOT_ACTIVE, http: 409, condition: "Consent is not ACTIVE (or not yet effective) for the attempted operation" }
  - { id: ERR_CONSENT_SCOPE_VIOLATION, http: 403, condition: "Required uses are not covered by consent permitted_uses or intersect excluded_uses" }
  - { id: ERR_WITHDRAWAL_GRACE_EXPIRED, http: 409, condition: "Rescind attempted at or after grace_deadline" }
  - { id: ERR_KIT_NOT_DISTRIBUTABLE, http: 409, condition: "Kit is not IN_STOCK at distribute" }
  - { id: ERR_KIT_NOT_RETURNED, http: 409, condition: "Kit is not DISTRIBUTED at receive-return, or not RETURNED at accession" }
  - { id: ERR_KIT_EXPIRED, http: 409, condition: "current clock >= kit.expires_at at distribute/receive-return/accession" }
  - { id: ERR_DONOR_MISMATCH, http: 400, condition: "kit.donor_id or consent.donor_id differs from specimen.donor_id at accession" }
  - { id: ERR_SPECIMEN_NOT_ALIQUOTABLE, http: 409, condition: "Specimen lifecycle not in {ACCESSIONED, IN_STORAGE} or viability QUARANTINED at aliquot creation" }
  - { id: ERR_INSUFFICIENT_SPECIMEN_VOLUME, http: 422, condition: "Aliquot initial_volume_ml exceeds specimen.residual_volume_ml" }
  - { id: ERR_ALIQUOT_NOT_RESERVED_FOR_REQUEST, http: 409, condition: "Checkout: aliquot not RESERVED or reserved for a different request" }
  - { id: ERR_UNIT_NOT_OPERATIONAL, http: 409, condition: "Unit posture not OPERATIONAL for checkout or new slot reservation" }
  - { id: ERR_SLOT_NOT_AVAILABLE, http: 409, condition: "Slot OFFLINE or otherwise not AVAILABLE for placement/reservation" }
  - { id: ERR_SLOT_RESERVATION_OVERLAP, http: 409, condition: "Half-open reservation window overlaps an existing BOOKED reservation on the same slot" }
  - { id: ERR_GRANT_WINDOW_CONFLICT, http: 409, condition: "Closed grant window overlaps or falls inside the 24h buffer of an existing grant on the same key" }
  - { id: ERR_NO_ACTIVE_GRANT, http: 403, condition: "Reveal without an ACTIVE grant whose window contains now, or consent.allow_reidentification is false" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempted both sides of a segregated control (order create/confirm, request/vote, grant/reveal)" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Reviewer already voted on this request in the current review round" }
  - { id: ERR_REQUEST_NOT_UNDER_REVIEW, http: 409, condition: "Vote or request-revision attempted when request is not UNDER_REVIEW" }
  - { id: ERR_REQUEST_NOT_APPROVED, http: 409, condition: "Fulfill or checkout attempted when request is not APPROVED" }
  - { id: ERR_MAX_REVISION_ROUNDS, http: 409, condition: "Revision round cap (2) reached" }
  - { id: ERR_AGREEMENT_NOT_EFFECTIVE, http: 409, condition: "Agreement not ACTIVE or current clock outside [effective_from, effective_to)" }
  - { id: ERR_AGREEMENT_SCOPE_INSUFFICIENT, http: 409, condition: "Agreement scope_uses does not cover request.required_uses" }
  - { id: ERR_INSUFFICIENT_QUOTA, http: 402, condition: "Computed fulfillment charge exceeds agreement.remaining_volume_ml" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Eligible aliquot pool cannot cover request.volume_needed_ml" }
  - { id: ERR_AGREEMENT_HAS_ACTIVE_RESERVATIONS, http: 409, condition: "Terminate attempted while reserved_volume_ml > 0" }
  - { id: ERR_DESTRUCTION_ORDER_NOT_CONFIRMABLE, http: 409, condition: "Order not PENDING at confirm-execution" }
  - { id: ERR_INVALID_TEMPERATURE_READING, http: 400, condition: "temp_c outside plausibility range -100.0..+25.0" }
  - { id: ERR_JUSTIFICATION_TOO_SHORT, http: 400, condition: "rationale/justification shorter than 20 characters" }
  - { id: ERR_KEY_NOT_ACTIVE, http: 409, condition: "DeidentificationKey not ACTIVE" }
  - { id: ERR_KEY_ALREADY_EXISTS, http: 409, condition: "Specimen already has a non-REVOKED de-identification key" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: BiobankAdmin
    description: "Biobank operations administrator: freezer registry, sharing agreements, fulfillment, sweeps, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /biobank/sweeps/process-due"
      - "POST /biobank/storage-units and /slots"
      - "POST /biobank/sharing-agreements and /activate and /terminate"
      - "POST /biobank/sample-requests/{id}/fulfill"
    shared_operations: ["all GET endpoints"]

  - name: ConsentCoordinator
    description: "Donor/consent registrar and kit custodian; controls de-identification keys and access grants"
    identity: opaque
    exclusive_operations:
      - "POST /biobank/donors and consent-record lifecycle (create, withdraw, rescind, amendments)"
      - "POST /biobank/collection-kits and kit distribute/receive-return"
      - "POST /biobank/deidentification-keys and /grants"
    shared_operations: ["all GET endpoints"]

  - name: LabTechnician
    description: "Wet-lab operator: accession, aliquoting, void, checkout, slot reservations, temperature readings"
    identity: opaque
    exclusive_operations:
      - "POST /biobank/specimens"
      - "POST /biobank/specimens/{id}/aliquots, /biobank/aliquots/{id}/void, /biobank/aliquots/{id}/checkout"
      - "POST /biobank/storage-slots/{id}/reservations"
      - "POST /biobank/storage-units/{id}/temperature-readings"
    shared_operations: ["all GET endpoints"]

  - name: CommitteeReviewer
    description: "Request review committee member; votes and revision requests; must not review own requests"
    identity: opaque
    exclusive_operations:
      - "POST /biobank/sample-requests/{id}/votes"
      - "POST /biobank/sample-requests/{id}/request-revision"
    shared_operations: ["all GET endpoints"]

  - name: Researcher
    description: "External researcher; creates, submits, and cancels own sample requests"
    identity: opaque
    exclusive_operations:
      - "POST /biobank/sample-requests"
      - "POST /biobank/sample-requests/{id}/submit and /cancel (own requests only)"
    shared_operations: ["all GET endpoints"]

  - name: QualityOfficer
    description: "Quality & compliance officer: freezer failure contingency, destruction orders (create + confirm by different users), re-identification reveals"
    identity: opaque
    exclusive_operations:
      - "POST /biobank/storage-units/{id}/declare-failure and /return-to-service"
      - "POST /biobank/destruction-orders and /confirm-execution"
      - "POST /biobank/deidentification-keys/{id}/reveal"
    shared_operations: ["all GET endpoints"]
