      - name: same_user_submitting_and_deciding_segment_rejected
        claim_type: segregation_of_duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=28]
          - roles.DataGovernanceOfficer.exclusive_operations
        distinguishing_aspect: "Segregation of duties is tracked by X-User-ID, not by role: a user who legitimately holds both hats is still refused 409 when the SAME id submitted the segment and now decides it, and the rung sits below the role rung so the caller must first be a governance officer."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Segment created and submitted for review by X-User-ID u_dual acting as SegmentAnalyst."
            - "The same X-User-ID u_dual then presents as DataGovernanceOfficer to decide it."
