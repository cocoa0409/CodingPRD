# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Research Core Facility Scheduling & Recharge
# 9 Difficulty Rules x 3 instances = 27 instances.
# Conventions: logical clock starts at 2026-08-01T00:00:00Z (never set unless the
# recipe says so). Canonical instrument "NMR-600": buffer 30, min 30, max 480,
# free notice 24h, late-cancel 0.5, no-show 1.0. Canonical FY2026 rate line:
# internal 12000 cents/h (= 200 cents/min), external 18000 (= 300 cents/min),
# increment 15, min charge 30, projected 500 h. Canonical booking window:
# 2026-09-01T09:00:00Z -> 2026-09-01T10:30:00Z (90 min, Tuesday).
# Negative triggers always capture $.data.error_id.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (3 instances, three different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: usage_charge_provisional_vs_final_on_booking
        grounds:
          - calculations.usage_charge
          - entities.Booking.fields.estimated_charge_cents
          - entities.UsageLog.fields.usage_charge_cents
        distinguishing_aspect: |
          Entity domain Booking/UsageLog: the PROVISIONAL variant (scheduled
          minutes, no ceil/floor/consumables) yields 18000 cents while the FINAL
          variant (actual 74 min ceiled to 75, x200 cents/min) yields 15000
          cents for the SAME booking — two valid algorithms, different results.
        test_recipe:
          setup:
            - "Researcher u1 (INTERNAL, PI) certified on instrument i1; FY2026 open; rate set FY2026 EFFECTIVE with the canonical line; grant g1 (budget 100000, window 2026-01-01..2026-12-31); booking b1 2026-09-01 09:00-10:30 APPROVED; batch 2026-09 OPEN; session completed with actual usage 09:00-10:14 (74 min); usage log submitted"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { fy26: $.data.id } }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { est: $.data.estimated_charge_cents } }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 9 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { bat: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:55:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:14:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/complete", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs", payload: { booking_id: "${b1}", actual_start_at: "2026-09-01T09:00:00Z", actual_end_at: "2026-09-01T10:14:00Z" }, as: CoreStaff, as_user_id: "staff-1", captures: { ul1: $.data.id } }
            - { call: "POST /usage-logs/${ul1}/submit", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
          trigger:
            - { call: "POST /usage-logs/${ul1}/validate", payload: {}, as: CoreStaff, as_user_id: "staff-2", captures: { final_charge: $.data.usage_charge_cents, billable: $.data.billable_minutes } }
          assert:
            - "Booking.${b1}.estimated_charge_cents == 18000 (provisional: 90 scheduled min x 200 cents/min)"
            - "UsageLog.${ul1}.billable_minutes == 75 (ceil(74/15)*15, above the 30-min floor)"
            - "UsageLog.${ul1}.usage_charge_cents == 15000 (final: 75 x 200, no consumables)"
            - "Booking.estimated_charge_cents (18000) != UsageLog.usage_charge_cents (15000) for the same booking"

      - name: fiscal_trueup_accrual_vs_cash_on_fiscal_year
        grounds:
          - calculations.fiscal_trueup
          - entities.FiscalYearPeriod.fields.revenue_cents
          - entities.FiscalYearPeriod.fields.cash_revenue_cents
        distinguishing_aspect: |
          Entity domain FiscalYearPeriod: identical ledger (two billed entries,
          one unpaid) yields accrual revenue 24000 but cash revenue 9000; the
          official carryforward uses accrual (-146000), the cash figure is
          informational only.
        test_recipe:
          setup:
            - "Canonical stack (u1, i1, certified, FY2026, EFFECTIVE rate set, grant 100000) plus a maintenance contract on i1 covering 2026-01-01..2026-12-31 at 50000 cents/yr"
            - "Booking b1 2026-09-01 09:00-10:30 completed with 74 actual minutes -> entry E1 net 15000 in batch 2026-09; batch 2026-09 FINALIZED (E1 BILLED, unpaid)"
            - "Booking b2 2026-09-02 09:00-09:40 completed with 40 actual minutes (billable 45) -> entry E2 net 9000 in batch 2026-10; batch 2026-10 FINALIZED; E2 marked PAID"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { fy26: $.data.id } }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /maintenance-contracts", payload: { instrument_id: "${i1}", vendor: "Bruker Service", sla_response_hours: 24, coverage_start: "2026-01-01", coverage_end: "2026-12-31", annual_cost_cents: 50000 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { mc1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-02T09:00:00Z", end_at: "2026-09-02T09:40:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b2: $.data.id } }
            - { call: "POST /bookings/${b2}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 9 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { bat9: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:55:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:14:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/complete", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs", payload: { booking_id: "${b1}", actual_start_at: "2026-09-01T09:00:00Z", actual_end_at: "2026-09-01T10:14:00Z" }, as: CoreStaff, as_user_id: "staff-1", captures: { ul1: $.data.id } }
            - { call: "POST /usage-logs/${ul1}/submit", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs/${ul1}/validate", payload: {}, as: CoreStaff, as_user_id: "staff-2" }
            - { call: "POST /recharge-batches/${bat9}/finalize", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T08:55:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b2}/check-in", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T09:40:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b2}/complete", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 10 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { bat10: $.data.id } }
            - { call: "POST /usage-logs", payload: { booking_id: "${b2}", actual_start_at: "2026-09-02T09:00:00Z", actual_end_at: "2026-09-02T09:40:00Z" }, as: CoreStaff, as_user_id: "staff-1", captures: { ul2: $.data.id } }
            - { call: "POST /usage-logs/${ul2}/submit", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs/${ul2}/validate", payload: {}, as: CoreStaff, as_user_id: "staff-2" }
            - { call: "POST /recharge-batches/${bat10}/finalize", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "GET /recharge-entries", payload: { usage_log_id: "${ul2}" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { e2: "$.data[0].id" } }
            - { call: "POST /recharge-entries/${e2}/mark-paid", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /fiscal-years/${fy26}/close", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { rev: $.data.revenue_cents, cash: $.data.cash_revenue_cents, surplus: $.data.surplus_deficit_cents, cf_out: $.data.carryforward_out_cents, cost: $.data.cost_cents } }
          assert:
            - "FiscalYearPeriod.${fy26}.revenue_cents == 24000 (accrual: BILLED 15000 + PAID 9000)"
            - "FiscalYearPeriod.${fy26}.cash_revenue_cents == 9000 (cash variant: PAID only)"
            - "FiscalYearPeriod.${fy26}.cost_cents == 170000 (contract 50000 + overhead 120000 x 1 instrument with entries)"
            - "FiscalYearPeriod.${fy26}.surplus_deficit_cents == -146000 and carryforward_out_cents == -146000"
            - "revenue_cents (24000) != cash_revenue_cents (9000): identical data, two variants, different results"

      - name: break_even_projected_vs_actual_on_rate_set
        grounds:
          - calculations.break_even_review
          - entities.RateSet.fields.line_verdicts
        distinguishing_aspect: |
          Entity domain RateSet: the same instrument line is PASS under the
          PROJECTED variant (12000 x 500h = 6000000 >= 170000 cost) but the
          ACTUAL variant at fiscal close shows a deficit (revenue 15000 <
          170000) — projected approval and realized outcome diverge.
        test_recipe:
          setup:
            - "Canonical stack; maintenance contract on i1 covering 2026-01-01..2026-12-31 at 50000 cents/yr; rate set EFFECTIVE with projected_billable_hours 500"
            - "One booking completed with 74 actual minutes -> entry net 15000; batch 2026-09 FINALIZED"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { fy26: $.data.id } }
            - { call: "POST /maintenance-contracts", payload: { instrument_id: "${i1}", vendor: "Bruker Service", sla_response_hours: 24, coverage_start: "2026-01-01", coverage_end: "2026-12-31", annual_cost_cents: 50000 }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "GET /rate-sets/${rs26}/break-even", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { verdict: $.data.overall_verdict } }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 9 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { bat: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:55:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:14:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/complete", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs", payload: { booking_id: "${b1}", actual_start_at: "2026-09-01T09:00:00Z", actual_end_at: "2026-09-01T10:14:00Z" }, as: CoreStaff, as_user_id: "staff-1", captures: { ul1: $.data.id } }
            - { call: "POST /usage-logs/${ul1}/submit", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs/${ul1}/validate", payload: {}, as: CoreStaff, as_user_id: "staff-2" }
            - { call: "POST /recharge-batches/${bat}/finalize", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /fiscal-years/${fy26}/close", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { surplus: $.data.surplus_deficit_cents, cost: $.data.cost_cents } }
          assert:
            - "Projected variant: break-even overall_verdict == PASS (12000 x 500 = 6000000 >= 50000 + 120000)"
            - "Actual variant at close: FiscalYearPeriod.${fy26}.surplus_deficit_cents == -155000 (15000 - 170000)"
            - "Projected PASS coexists with actual deficit for the same instrument line — the variants diverge"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (3 instances, modes (a), (b), (c))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cancellation_penalty_tiered_branching
        grounds:
          - calculations.cancellation_penalty
          - entities.Instrument.fields.late_cancel_penalty_pct
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs (notice_minutes, estimated_charge_cents,
          per-instrument penalty pct, booking status branch) with conditional
          branches: cancel-from-REQUESTED yields 0 while the same booking once
          APPROVED and cancelled 23 h before start (inside the 24 h free
          window) yields round_half_up(18000 x 0.5) = 9000.
        test_recipe:
          setup:
            - "Canonical stack; batch 2026-09 OPEN; b1 APPROVED for 2026-09-01 09:00-10:30 (estimate 18000); b2 REQUESTED for 2026-09-03 09:00-10:30 (same params, never approved)"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
