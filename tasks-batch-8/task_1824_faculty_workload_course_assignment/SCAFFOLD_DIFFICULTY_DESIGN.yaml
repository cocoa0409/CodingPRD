  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precedes_temporal_on_assignment_create
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_SECTION_NOT_ASSIGNABLE]
          - errors[ERR_MEETING_TIME_CONFLICT]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: the target section is
          CANCELLED AND its meeting window overlaps the faculty's existing
          section — priority 5 (state) must win over priority 7 (temporal).
        test_recipe:
          setup:
            - "Term OPEN; CS-301; Anna qualified; S1 MON 09:00-10:00 with CONFIRMED assignment; S2 MON 09:30-10:30 created and SCHEDULED then CANCELLED (clock default, not late, no confirmed assignment on S2)"
