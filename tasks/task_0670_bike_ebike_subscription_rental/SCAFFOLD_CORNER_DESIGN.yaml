              payload: { account_type: "FLEET", display_name: "RiderCo", email: "fleet@x.com", rental_cap: 5 }
              as: Anonymous
              captures: { aid: $.data.id }
            - call: "GET /bike-models/${mid}"
              payload: {}
              as: FleetManager
              as_user_id: "${aid}"
              captures: { mv_after_bikes: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${aid}", model_id: "${mid}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv_after_bikes}" }
              as: FleetManager
              as_user_id: "${aid}"
          trigger:
            - call: "POST /rentals"
              payload: { account_id: "${aid}", model_id: "${mid}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv_after_bikes}" }
              as: FleetManager
              as_user_id: "${aid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_MODEL_VERSION, HTTP 412 (version advanced by the first reserve)"

      - name: damage_claim_payout_credits_wallet_only
        claim_type: cascading_side_effects
        grounds: ["state_machines.CoverageClaim.UNDER_REVIEW_to_APPROVED", "entities.Account.fields.wallet_credit_cents"]
        distinguishing_aspect: "DAMAGE claim approval credits approved_payout_cents to Account.wallet_credit_cents and leaves the rental ACTIVE — no bike retire (contrast with the THEFT cascade in §1.8)."
        test_recipe:
          setup: ["ACTIVE rental; DAMAGE claim UNDER_REVIEW claimed 30000 (cap 40% of 90000 = 36000)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
              captures: { mid: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-1" }
              as: OpsAdmin
              captures: { bid: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { aid: $.data.id }
            - call: "GET /bike-models/${mid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${aid}", model_id: "${mid}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${aid}"
              captures: { rid: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rid}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { did: $.data.id }
            - call: "POST /deliveries/${did}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rid}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
            - call: "POST /coverage-claims"
              payload: { rental_id: "${rid}", claim_type: "DAMAGE", incident_clock: "2026-06-02T00:00:00Z", claimed_amount_cents: 30000 }
              as: Subscriber
              as_user_id: "${aid}"
              captures: { cid: $.data.id }
            - call: "POST /coverage-claims/${cid}/review"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /coverage-claims/${cid}/approve"
              payload: { approved_payout_cents: 30000 }
              as: OpsAdmin
            - call: "GET /accounts/${aid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { w: $.data.wallet_credit_cents }
            - call: "GET /rentals/${rid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { ls: $.data.lifecycle_status }
          assert:
            - "Account.wallet_credit_cents == 30000 (payout credited)"
            - "RentalAgreement.lifecycle_status == ACTIVE and Bike.${bid}.bike_status == OUT (no retire on DAMAGE)"

      - name: derived_active_rental_count_reconciles_on_return
        claim_type: derived_field_reconciliation
        grounds: ["entities.Account.fields.active_rental_count", "state_machines.RentalAgreement.RETURN_REQUESTED_to_RETURNED"]
        distinguishing_aspect: "Account.active_rental_count is 1 while a rental is ACTIVE and reconciles to 0 after the return is inspected (RETURNED is excluded from the active set)."
        test_recipe:
          setup: ["One DAILY rental ACTIVE then RETURN_REQUESTED; account active_rental_count == 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 20000, fleet_size: 2 }
              as: OpsAdmin
              captures: { mid: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { aid: $.data.id }
            - call: "GET /bike-models/${mid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${aid}", model_id: "${mid}", rental_mode: "DAILY", return_due_clock: "2026-06-30T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${aid}"
              captures: { rid: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rid}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { did: $.data.id }
            - call: "POST /deliveries/${did}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rid}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
            - call: "POST /rentals/${rid}/request-return"
              payload: { return_address: "1 A St" }
              as: Subscriber
              as_user_id: "${aid}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /rentals/${rid}/inspect"
              payload: { bike_condition: "GOOD", damage_charge_cents: 0, cleaning_fee_cents: 0 }
              as: FieldTech
            - call: "GET /accounts/${aid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { arc: $.data.active_rental_count }
          assert:
            - "Account.active_rental_count == 0 after RETURNED (reconciled from 1)"

