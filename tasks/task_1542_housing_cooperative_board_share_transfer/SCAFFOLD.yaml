# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_CONTEXT_HEADER,       http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE,            http: 403, condition: "X-User-Role not in endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER,           http: 403, condition: "Caller X-User-ID does not match the required owner id (e.g., seller_shareholder_id)" }
  - { id: ERR_NOT_FOUND,                    http: 404, condition: "Path-parameter resource does not exist in this cooperative scope" }
  - { id: ERR_INVALID_STATE,                http: 409, condition: "Target resource not in a state from which the requested transition is permitted" }
  - { id: ERR_STALE_COOP_VERSION,           http: 412, condition: "expected_cooperative_version does not match Cooperative.version" }
  - { id: ERR_INVALID_REQUEST,              http: 400, condition: "Required request field missing or fails type check" }
  - { id: ERR_INVALID_ENUM,                 http: 400, condition: "Enum field value not in declared set" }
  - { id: ERR_ALTERATION_SAFETY_VIOLATION,  http: 422, condition: "Alteration contractor insurance below minimum, or wet-over-dry without explicit acknowledgment" }
  - { id: ERR_CROSS_ENTITY_VIOLATION,       http: 422, condition: "Referenced entity does not exist or is in incompatible state (e.g., seller not GOOD_STANDING, schedule not DRAFT)" }
  - { id: ERR_TEMPORAL_CONFLICT,            http: 422, condition: "Date interval invalid (start >= end) or overlaps a conflicting interval, or scheduled_at in past" }
  - { id: ERR_SUBLET_POLICY_VIOLATION,      http: 422, condition: "Sublet violates policy: exceeds max years, gap not honored, or unit already sublet" }
  - { id: ERR_BUSINESS_CONSTRAINT,          http: 422, condition: "Domain constraint violated: share conservation, financing cap, panel size, unique ballot" }
  - { id: ERR_FISCAL_THRESHOLD_VIOLATION,   http: 422, condition: "Buyer DTI or liquidity below requirement, OR arrears below termination threshold for TERMINATION_NOTICE" }
  - { id: ERR_SHARES_MISMATCH,              http: 422, condition: "Sum of ACTIVE ShareLedgerEntry.shares_held != Unit.shares_allocated" }
  - { id: ERR_ALREADY_TERMINAL,             http: 409, condition: "Resource already in a terminal state; no further transitions permitted" }
  - { id: ERR_DUPLICATE_BALLOT,             http: 409, condition: "(Deprecated — re-vote invalidates prior; see Ballot side-effects) Reserved for hard-duplicate scenarios" }
  - { id: ERR_MEETING_NO_QUORUM,            http: 422, condition: "Attempted action requires QUORUM_MET but quorum not reached" }
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING,  http: 422, condition: "Payment amount_cents > outstanding_cents" }
  - { id: ERR_SEPARATION_OF_DUTIES,         http: 422, condition: "Same X-User-ID attempted two roles on same workflow that must be segregated (e.g., certifier cannot also be panel member)" }
  - { id: ERR_RESOLUTION_ALREADY_VOTED,     http: 409, condition: "Withdraw attempted after at least one vote has been cast" }
  - { id: ERR_VOTER_ALREADY_CAST,           http: 409, condition: "Same voter_user_id has already cast a vote on this resolution" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator; creates cooperatives, advances logical clock, can read anything"
    identity: opaque
    exclusive_operations:
      - "POST /cooperatives"
      - "POST /cooperatives/{cid}/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /cooperatives/{cid}/units"
      - "POST /cooperatives/{cid}/shareholders"
      - "POST /cooperatives/{cid}/share-ledger-entries"

  - name: BoardOfficer
    description: "Board president/treasurer/secretary; schedules interviews, opens resolutions, manages charge schedules and meetings"
    identity: opaque
    exclusive_operations:
      - "POST /cooperatives/{cid}/charge-schedules"
      - "POST /cooperatives/{cid}/purchase-applications/{paid}/request-info"
      - "POST /cooperatives/{cid}/purchase-applications/{paid}/schedule-interview"
      - "POST /cooperatives/{cid}/purchase-applications/{paid}/record-transfer"
      - "POST /cooperatives/{cid}/interviews/{iid}/cancel"
      - "POST /cooperatives/{cid}/resolutions"
      - "POST /cooperatives/{cid}/resolutions/{rid}/withdraw"
      - "POST /cooperatives/{cid}/arrears-actions/{aid}/escalate"
      - "POST /cooperatives/{cid}/arrears-actions/{aid}/withdraw"
      - "POST /cooperatives/{cid}/sublet-agreements/{sid}/reject"
      - "POST /cooperatives/{cid}/sublet-agreements/{sid}/terminate-early"
      - "POST /cooperatives/{cid}/meetings"
      - "POST /cooperatives/{cid}/meetings/{mid}/send-notice"
      - "POST /cooperatives/{cid}/meetings/{mid}/open"
      - "POST /cooperatives/{cid}/meetings/{mid}/close"
    shared_operations:
      - "All GET endpoints"
      - "POST /cooperatives/{cid}/units"
      - "POST /cooperatives/{cid}/shareholders"
      - "POST /cooperatives/{cid}/share-ledger-entries"
      - "POST /cooperatives/{cid}/arrears-actions"
      - "POST /cooperatives/{cid}/alteration-agreements/{aid}/abandon"

  - name: BoardMember
    description: "Board director; sits on interview panels, votes on resolutions. Cannot certify applications (segregation from ManagingAgent) and cannot conduct interviews for applications they certified (segregation from BoardOfficer if same person holds both — disallowed by design here)."
    identity: opaque
    exclusive_operations:
      - "POST /cooperatives/{cid}/interviews/{iid}/complete"
      - "POST /cooperatives/{cid}/resolutions/{rid}/vote"
    shared_operations:
      - "All GET endpoints"

  - name: ManagingAgent
    description: "Building's managing agent (external firm); certifies applications, posts payments, issues arrears notices. Cannot vote, cannot schedule interviews, cannot conduct them."
    identity: opaque
    exclusive_operations:
      - "POST /cooperatives/{cid}/purchase-applications/{paid}/certify"
      - "POST /cooperatives/{cid}/maintenance-charges/{mcid}/payments"
      - "POST /cooperatives/{cid}/payments/{pid}/void"
    shared_operations:
      - "All GET endpoints"
      - "POST /cooperatives/{cid}/shareholders"
      - "POST /cooperatives/{cid}/arrears-actions"

  - name: Shareholder
    description: "Co-op unit owner; initiates purchase applications (as seller), sublets, alterations, casts ballots"
    identity: "entity_backed:Shareholder"
    exclusive_operations:
      - "POST /cooperatives/{cid}/purchase-applications (as seller_shareholder_id)"
      - "POST /cooperatives/{cid}/purchase-applications/{paid}/submit"
      - "POST /cooperatives/{cid}/purchase-applications/{paid}/submit-info"
      - "POST /cooperatives/{cid}/purchase-applications/{paid}/withdraw"
      - "POST /cooperatives/{cid}/sublet-agreements"
      - "POST /cooperatives/{cid}/sublet-agreements/{sid}/submit"
      - "POST /cooperatives/{cid}/alteration-agreements"
      - "POST /cooperatives/{cid}/alteration-agreements/{aid}/submit"
