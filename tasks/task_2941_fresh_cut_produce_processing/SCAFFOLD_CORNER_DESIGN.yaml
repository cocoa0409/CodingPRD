          - calculations.antimicrobial_compliance_check.notes
        distinguishing_aspect: "A close with readings only from before started_at is refused, and a reading taken at exactly the closing instant is inside the window, so the same close then succeeds with that reading as min_ppm_observed."
        test_recipe:
