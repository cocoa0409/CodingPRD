# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_3469
# §1.8 Test Targeting Index: 9 Difficulty Rules x >=2 instances (19 total).
# Every setup chain replays against SCAFFOLD.yaml §1.5 only.
# Default logical clock is 2026-09-01T00:00:00Z; chains set it explicitly.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: offset_projection_intake_vs_execution
        grounds:
          - calculations.offset_pool_determination
          - entities.Payment.fields.projected_offset_cents
          - entities.Payment.fields.total_offset_cents
          - endpoints.POST /payment-files/{paymentFileId}/payments
          - endpoints.POST /payments/{paymentId}/execute
        distinguishing_aspect: "Dual-variant logic on the PAYMENT domain: the INTAKE_ESTIMATE variant (protected minimum only) projects 125000 cents for the same payment that the EXECUTION_FINAL variant (percentage cap applied) offsets at only 30000 cents — same inputs, two valid algorithms, different results. The sibling instance exercises the CollectionAction domain instead."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Federal creditor, EFT payee, PARTIAL BENEFIT_RETIREMENT policy (protected 75000, pct 0.15) ACTIVE, one ACTIVE FEDERAL_NONTAX debt of 200000 for the payee's TIN."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: TreasurySupervisor
            - &c_cred_fed
              call: "POST /creditor-agencies"
              payload: { creditor_code: "IRS-7469", legal_name: "Federal Test Creditor", creditor_type: "FEDERAL" }
              as: TreasurySupervisor
              captures: { cred_fed: $.data.id }
            - &c_payee1
              call: "POST /payees"
              payload: { tin: "111-22-3333", tin_type: "SSN", legal_name: "Pat Doe", routing_number: "021000021", account_last4: "4321" }
              as: TreasuryOperator
              captures: { payee_1: $.data.id }
            - call: "POST /exemption-policies"
              payload: { payment_type: "BENEFIT_RETIREMENT", exemption_class: "PARTIAL", protected_minimum_cents: 75000, max_offset_pct: 0.15 }
              as: TreasurySupervisor
              captures: { pol_br: $.data.id }
            - call: "POST /exemption-policies/${pol_br}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 200000, delinquent_since: "2026-01-15T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - &c_file1
              call: "POST /payment-files"
              payload: { agency_code: "AG-01", settlement_date: "2026-09-15T00:00:00Z" }
              as: PaymentAgencyAnalyst
              captures: { file_1: $.data.id }
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 200000, payment_type: "BENEFIT_RETIREMENT" }
              as: PaymentAgencyAnalyst
              captures: { pay_1: $.data.id, pay_1_v: $.data.version, pay_1_proj: $.data.projected_offset_cents }
            - call: "POST /payments/${pay_1}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_1_v}" }
              as: TreasuryOperator
          trigger:
            - call: "POST /payments/${pay_1}/execute"
              payload: {}
              as: TreasuryOperator
              as_user_id: "op-1"
            - call: "GET /offsets"
              payload: { payment_id: "${pay_1}" }
              as: Auditor
              captures: { off_amt: "$.data[0].offset_amount_cents", off_fee: "$.data[0].fee_cents", off_net: "$.data[0].net_remittance_cents" }
          assert:
            - "Payment.${pay_1}.projected_offset_cents == 125000 (INTAKE_ESTIMATE: 200000 - 75000, no percentage cap)"
            - "after execute, Payment.${pay_1}.total_offset_cents == 30000 (EXECUTION_FINAL: min(125000, round_half_up(200000 * 0.15)))"
            - "Payment.${pay_1}.projected_offset_cents != Payment.${pay_1}.total_offset_cents (125000 != 30000 — the variants diverge on identical inputs)"
            - "Payment.${pay_1}.disbursed_cents == 170000"
            - "the single Offset has offset_amount_cents == 30000, fee_cents == 900 (3% low band), net_remittance_cents == 29100"
            - "CreditorAgency.${cred_fed}.remitted_net_total_cents == 29100 and remitted_gross_ytd_cents == 30000"
            - "Debt.${debt_1}.current_balance_cents == 170000 and status == ACTIVE"

      - name: awg_provisional_vs_statutory_final
        grounds:
          - calculations.awg_garnishment_amount
          - entities.CollectionAction.fields.projected_per_period_cents
          - endpoints.POST /debts/{debtId}/collection-actions
          - endpoints.POST /collection-actions/{collectionActionId}/collect
          - concurrency_rules[garnishment-collect-stale-debt]
        distinguishing_aspect: "Dual-variant logic on the COLLECTIONACTION domain: the PROVISIONAL projection (15% of estimated disposable pay) yields 3750 cents while the STATUTORY_FINAL variant (min of the 15% term and disposable-minus-21750 floor) collects only 3250 cents on the same 25000-cent disposable pay. The sibling instance exercises the Payment domain instead."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-05T00:00:00Z. Federal creditor with an ACTIVE FEDERAL_NONTAX debt of 100000; an AWG action created with estimate 25000 and notice_sent_at 2026-08-20T00:00:00Z, activated after the 15-day hearing window (2026-09-04T00:00:00Z)."
          setup_api_calls:
            - *c_clock
            - *c_cred_fed
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "222-33-4444", debtor_name: "Jamie Roe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 100000, delinquent_since: "2026-02-01T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - call: "POST /debts/${debt_1}/collection-actions"
              payload: { action_type: "AWG", notice_sent_at: "2026-08-20T00:00:00Z", disposable_pay_estimate_cents: 25000 }
              as: TreasuryOperator
              captures: { ca_1: $.data.id, ca_1_proj: $.data.projected_per_period_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: TreasurySupervisor
            - call: "POST /collection-actions/${ca_1}/activate"
              payload: {}
              as: TreasuryOperator
            - call: "GET /debts/${debt_1}"
              payload: {}
              as: Auditor
              captures: { debt_1_v: $.data.version }
          trigger:
            - call: "POST /collection-actions/${ca_1}/collect"
              payload: { expected_debt_version: "${debt_1_v}", disposable_pay_cents: 25000 }
              as: TreasuryOperator
          assert:
            - "CollectionAction.${ca_1}.projected_per_period_cents == 3750 (PROVISIONAL: round_half_up(0.15 * 25000))"
            - "after collect, CollectionAction.${ca_1}.collected_total_cents == 3250 (STATUTORY_FINAL: min(3750, max(0, 25000 - 21750)))"
            - "3750 != 3250 — the two variants produce different results for the same disposable pay"
            - "Debt.${debt_1}.current_balance_cents == 96750"
            - "CreditorAgency.${cred_fed}.remitted_gross_ytd_cents == 3250 and remitted_net_total_cents == 3152 (fee = round_half_up(3250 * 0.03) == 98)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: offset_pool_partial_policy_mode_a
        grounds:
          - calculations.offset_pool_determination
          - calculations.waterfall_allocation
          - entities.ExemptionPolicy.fields.max_offset_pct
        distinguishing_aspect: "Mode (a): a >=3-input formula with non-linear interaction — nested min/max plus a conditional branch on matched-debt composition. A 200000-cent PARTIAL payment pools 30000 cents when only a FEDERAL_NONTAX debt matches (0.15 cap binds) but 125000 cents when a CHILD_SUPPORT debt matches (0.65 branch frees the protected-minimum bound) — the branch flips which bound is active."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. PARTIAL BENEFIT_RETIREMENT policy (75000 / 0.15) ACTIVE. Payee A (tin 111-22-3333) with an ACTIVE 500000-cent FEDERAL_NONTAX debt under a federal creditor. Payee B (tin 555-66-7777) with an ACTIVE 500000-cent CHILD_SUPPORT debt under a STATE creditor covered by an ACTIVE CA BIDIRECTIONAL agreement. Two payment files, one 200000-cent BENEFIT_RETIREMENT payment each."
          setup_api_calls:
            - *c_clock
            - *c_cred_fed
            - *c_payee1
            - call: "POST /payees"
              payload: { tin: "555-66-7777", tin_type: "SSN", legal_name: "Sam Poe", routing_number: null }
              as: TreasuryOperator
              captures: { payee_2: $.data.id }
            - call: "POST /exemption-policies"
              payload: { payment_type: "BENEFIT_RETIREMENT", exemption_class: "PARTIAL", protected_minimum_cents: 75000, max_offset_pct: 0.15 }
              as: TreasurySupervisor
              captures: { pol_br: $.data.id }
            - call: "POST /exemption-policies/${pol_br}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /creditor-agencies"
              payload: { creditor_code: "CA-FTB", legal_name: "California Franchise Tax Board", creditor_type: "STATE", state_code: "CA" }
              as: TreasurySupervisor
              captures: { cred_ca: $.data.id }
            - call: "POST /reciprocal-agreements"
              payload: { state_code: "CA", direction: "BIDIRECTIONAL", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: TreasurySupervisor
              captures: { agr_ca: $.data.id }
            - call: "POST /reciprocal-agreements/${agr_ca}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 500000, delinquent_since: "2026-01-15T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_a: $.data.id }
            - call: "POST /debts/${debt_a}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_ca}", debtor_tin: "555-66-7777", debtor_name: "Sam Poe", debt_type: "CHILD_SUPPORT", original_amount_cents: 500000, delinquent_since: "2026-01-15T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_ca}"
              captures: { debt_b: $.data.id }
            - call: "POST /debts/${debt_b}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_ca}"
            - *c_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 200000, payment_type: "BENEFIT_RETIREMENT" }
              as: PaymentAgencyAnalyst
              captures: { pay_a: $.data.id, pay_a_v: $.data.version }
            - call: "POST /payments/${pay_a}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_a_v}" }
              as: TreasuryOperator
            - call: "POST /payment-files"
              payload: { agency_code: "AG-01", settlement_date: "2026-09-15T00:00:00Z" }
              as: PaymentAgencyAnalyst
              captures: { file_2: $.data.id }
            - call: "POST /payment-files/${file_2}/payments"
              payload: { payee_id: "${payee_2}", payee_tin: "555-66-7777", amount_cents: 200000, payment_type: "BENEFIT_RETIREMENT" }
              as: PaymentAgencyAnalyst
              captures: { pay_b: $.data.id, pay_b_v: $.data.version }
            - call: "POST /payments/${pay_b}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_b_v}" }
              as: TreasuryOperator
          trigger:
            - call: "GET /offsets"
              payload: { payment_id: "${pay_a}" }
              as: Auditor
              captures: { off_a: "$.data[0].offset_amount_cents" }
            - call: "GET /offsets"
              payload: { payment_id: "${pay_b}" }
              as: Auditor
              captures: { off_b: "$.data[0].offset_amount_cents" }
          assert:
            - "Payment ${pay_a} pool == 30000: min(200000 - 75000, round_half_up(200000 * 0.15)) — the percentage cap binds (single offset of 30000)"
            - "Payment ${pay_b} pool == 125000: min(200000 - 75000, round_half_up(200000 * 0.65)) — the CHILD_SUPPORT branch lifts the cap and the protected-minimum bound binds (single offset of 125000)"
            - "30000 != 125000 for identical amount/policy — the matched-set composition branch flips the active bound"

      - name: per_payment_cap_rounding_mode_b
        grounds:
          - calculations.file_total_aggregation
          - calculations.offset_pool_determination
          - entities.PaymentFile.fields.total_offset_cents
        distinguishing_aspect: "Mode (b): nested rounding order is pinned — each payment's 0.15 cap rounds half-up to whole cents BEFORE the file total is summed. Two 33337-cent payments yield 5001 + 5001 == 10002 in the file total; the forbidden sum-then-round order would yield round_half_up(66674 * 0.15) == 10001. One cent of divergence proves the order."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. PARTIAL GRANT policy (protected 5000, pct 0.15) ACTIVE. Federal creditor; payees tin 111-22-3333 and 555-66-7777 each with an ACTIVE 100000-cent FEDERAL_NONTAX debt. One file with two 33337-cent GRANT payments, both executed."
          setup_api_calls:
            - *c_clock
            - *c_cred_fed
            - *c_payee1
            - call: "POST /payees"
              payload: { tin: "555-66-7777", tin_type: "SSN", legal_name: "Sam Poe" }
              as: TreasuryOperator
              captures: { payee_2: $.data.id }
            - call: "POST /exemption-policies"
              payload: { payment_type: "GRANT", exemption_class: "PARTIAL", protected_minimum_cents: 5000, max_offset_pct: 0.15 }
              as: TreasurySupervisor
              captures: { pol_gr: $.data.id }
            - call: "POST /exemption-policies/${pol_gr}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 100000, delinquent_since: "2026-01-15T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_a: $.data.id }
            - call: "POST /debts/${debt_a}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "555-66-7777", debtor_name: "Sam Poe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 100000, delinquent_since: "2026-02-01T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_b: $.data.id }
            - call: "POST /debts/${debt_b}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - *c_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 33337, payment_type: "GRANT" }
              as: PaymentAgencyAnalyst
              captures: { pay_a: $.data.id, pay_a_v: $.data.version }
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_2}", payee_tin: "555-66-7777", amount_cents: 33337, payment_type: "GRANT" }
              as: PaymentAgencyAnalyst
              captures: { pay_b: $.data.id, pay_b_v: $.data.version }
            - call: "POST /payments/${pay_a}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_a_v}" }
              as: TreasuryOperator
            - call: "POST /payments/${pay_b}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_b_v}" }
              as: TreasuryOperator
            - call: "POST /payments/${pay_a}/execute"
              payload: {}
              as: TreasuryOperator
              as_user_id: "op-1"
            - call: "POST /payments/${pay_b}/execute"
              payload: {}
              as: TreasuryOperator
              as_user_id: "op-1"
          trigger:
            - call: "GET /payment-files/${file_1}"
              payload: {}
              as: Auditor
          assert:
            - "each payment's pool rounds individually: round_half_up(33337 * 0.15) == 5001, so Payment.${pay_a}.total_offset_cents == 5001 and Payment.${pay_b}.total_offset_cents == 5001"
            - "PaymentFile.${file_1}.total_offset_cents == 10002 (per-payment rounding then sum)"
            - "PaymentFile.${file_1}.total_offset_cents != 10001 (the forbidden sum-then-round result)"
            - "PaymentFile.${file_1}.total_disbursed_cents == 56672 (28336 + 28336)"
            - "PaymentFile.${file_1}.payment_count == 2"

      - name: remittance_fee_tier_mode_c
        grounds:
          - calculations.remittance_fee_assessment
          - entities.CreditorAgency.fields.remitted_gross_ytd_cents
          - entities.Offset.fields.fee_cents
        distinguishing_aspect: "Mode (c): circular-looking dependency with pinned evaluation order — the fee tier reads the creditor's cumulative gross counter BEFORE the current event is added, so an event never counts toward its own tier. The third 30000-cent collection in the year is charged 2% (fee 600) while the first two are charged 3% (fee 900) because the pre-event cumulative reaches exactly the 60000-cent threshold only after event two."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. FULL TAX_REFUND policy ACTIVE. Federal creditor; payee tin 111-22-3333 with one ACTIVE 1000000-cent FEDERAL_TAX debt. One file with three 30000-cent TAX_REFUND payments, each evaluated then executed strictly in order."
          setup_api_calls:
            - *c_clock
            - *c_cred_fed
            - *c_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "TAX_REFUND", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_tr: $.data.id }
            - call: "POST /exemption-policies/${pol_tr}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_TAX", original_amount_cents: 1000000, delinquent_since: "2025-12-01T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - *c_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 30000, payment_type: "TAX_REFUND" }
              as: PaymentAgencyAnalyst
              captures: { pay_a: $.data.id, pay_a_v: $.data.version }
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 30000, payment_type: "TAX_REFUND" }
              as: PaymentAgencyAnalyst
              captures: { pay_b: $.data.id, pay_b_v: $.data.version }
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 30000, payment_type: "TAX_REFUND" }
              as: PaymentAgencyAnalyst
              captures: { pay_c: $.data.id, pay_c_v: $.data.version }
            - call: "POST /payments/${pay_a}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_a_v}" }
              as: TreasuryOperator
            - call: "POST /payments/${pay_a}/execute"
              payload: {}
              as: TreasuryOperator
              as_user_id: "op-1"
            - call: "POST /payments/${pay_b}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_b_v}" }
              as: TreasuryOperator
            - call: "POST /payments/${pay_b}/execute"
              payload: {}
              as: TreasuryOperator
              as_user_id: "op-1"
            - call: "POST /payments/${pay_c}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_c_v}" }
              as: TreasuryOperator
            - call: "POST /payments/${pay_c}/execute"
              payload: {}
              as: TreasuryOperator
              as_user_id: "op-1"
          trigger:
            - call: "GET /offsets"
              payload: { payment_id: "${pay_a}" }
              as: Auditor
              captures: { fee_a: "$.data[0].fee_cents" }
            - call: "GET /offsets"
              payload: { payment_id: "${pay_b}" }
              as: Auditor
              captures: { fee_b: "$.data[0].fee_cents" }
            - call: "GET /offsets"
              payload: { payment_id: "${pay_c}" }
              as: Auditor
              captures: { fee_c: "$.data[0].fee_cents" }
            - call: "GET /creditor-agencies/${cred_fed}"
              payload: {}
              as: Auditor
          assert:
            - "first offset fee_cents == 900 (pre-event gross 0 < 60000 -> 3% band)"
            - "second offset fee_cents == 900 (pre-event gross 30000 < 60000 -> 3% band)"
            - "third offset fee_cents == 600 (pre-event gross 60000, NOT < 60000 -> 2% band; the third event never counted toward its own tier)"
            - "CreditorAgency.${cred_fed}.remitted_gross_ytd_cents == 90000"
            - "CreditorAgency.${cred_fed}.remitted_net_total_cents == 87600 (29100 + 29100 + 29400)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: debt_cyclic_referral_and_reopen
        grounds:
          - state_machines.Debt.REFERRED_to_NOTICED
          - state_machines.Debt.RETURNED_to_NOTICED
          - state_machines.Debt.PAID_IN_FULL_to_ACTIVE
          - state_machines.Debt.ACTIVE_to_RETURNED
        distinguishing_aspect: "Non-linear machine on DEBT (cyclic): the instance walks two distinct cycles — the re-referral cycle ACTIVE->RETURNED->NOTICED->ACTIVE (refund marks the offset improper WITHOUT restoring the balance; a fresh notice window is required) and the reopen cycle ACTIVE->PAID_IN_FULL->ACTIVE (payment reversal DOES restore the balance). The sibling instance exercises dual-axis independence on Payment instead."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Federal creditor; payee tin 111-22-3333; FULL SALARY policy ACTIVE; a 50000-cent FEDERAL_NONTAX debt that is partially offset (30000), sent to RETURNED by an approved refund claim, re-noticed and re-activated, then paid in full by a 20000-cent payment and finally reopened by that payment's reversal."
          setup_api_calls:
            - *c_clock
            - *c_cred_fed
            - *c_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "SALARY", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_s: $.data.id }
