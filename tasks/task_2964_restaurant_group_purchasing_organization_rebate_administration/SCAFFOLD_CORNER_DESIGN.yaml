      - name: prorated_commitment_uses_a_365_day_year_and_counts_both_endpoints
        claim_type: constants_applied
        grounds:
          - calculations.compliance_purchase_ratio
          - calculations.compliance_purchase_ratio.constants.DAYS_PER_YEAR
          - entities.ComplianceReview.fields.committed_spend_prorated_cents
        distinguishing_aspect: |
          Two windows over identical purchase data pin all three constants at
          once: DAYS_PER_YEAR 365 (a 366-day year would give 1693989 instead of
          1698630), the inclusive +1 on window_days (dropping it gives 1643836),
          and BPS_DENOMINATOR 10000 with a FLOOR on the ratio. A single-day
          window is included precisely because it makes an off-by-one in
          window_days collapse the prorated commitment to 0.
        test_recipe:
          setup:
            - "Member Harbor Grill ACTIVE with committed_annual_spend_cents 20000000 under ELITE (compliance_min_ratio_bps 8000)."
            - "Deal PBC-2026 ACTIVE with required_purchase_window_days 60, item BEEF-PATTY-4OZ-CS40 and an APPROVED PER_CASE 150 card."
            - "A January batch holds one MATCHED line, 30 cases at 9140 on invoice_date 2026-01-15, so contracted_spend_cents == 274200 in any window containing that date."
            - "The logical clock is still 2026-08-01T00:00:00Z, so both windows are in the past."
          setup_api_calls:
            - call: "POST /program-tiers"
