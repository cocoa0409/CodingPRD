          assert:
            - "trigger response data.error_id == ERR_INVALID_STATE (priority 6 state beats priority 11 fiscal)"

      - name: hearing_referential_beats_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_JURISDICTION_MISMATCH]
        distinguishing_aspect: |
          Scheduling on a courtroom whose jurisdiction_code (CA-02) mismatches the petition
          (CA-01) AND that is already booked at the overlapping time returns
          ERR_JURISDICTION_MISMATCH (business_referential, pri 8), not ERR_COURTROOM_UNAVAILABLE
          (business_temporal, pri 9).
        test_recipe:
          setup:
            - "Courtroom X (CA-02) already hosts a SCHEDULED hearing 2026-06-02 09:00-10:00 from petition Q (CA-02, fully cleared). Petition P (CA-01) is FILED (notifications not yet cleared)."
