            - call: "GET /parts/${part_id}"
              payload: {}
              as: PropertyManager
              captures: { onhand: $.data.quantity_on_hand, resv: $.data.reserved_quantity }
          assert:
            - "WorkOrder.${wo_id}.status == CANCELLED"
            - "WorkOrderPart.${wop_id}.status == RELEASED"
            - "Part.${part_id}: quantity_on_hand == 3, reserved_quantity == 0 (reservation returned)"

      - name: vendor_suspend_cascade_covered_by_difficulty
        claim_type: action_endpoint
        grounds: ["endpoints[POST /vendors/{id}/events]"]
        excluded_because:
          difficulty_instance: transitive_cascade / vendor_suspend_cascade_depth3
          rationale: "SUSPEND side-effect chain is asserted to depth 3 by the named §1.8 instance; REINSTATE no-restore is covered by state_machines / vendor_reinstate_does_not_restore_assignments."

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_for_not_found
        claim_type: envelope_shape
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type 'error', data.error_id, data.message, and meta.api_request_id / meta.api_request_timestamp."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /work-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == \"error\""
            - "data.error_id == ERR_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails with ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["empty database; the trigger call sends no auth headers (`as: Anonymous` documents header absence)"]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "NoAuth" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, HTTP 401"

      - name: recall_window_error_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_RECALL_WINDOW_EXPIRED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / reopen_window_exact_boundary
          rationale: "ERR_RECALL_WINDOW_EXPIRED is triggered at the +1-second boundary by the named §1.8 instance."

      - name: open_purchase_error_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_PURCHASE_REQUESTS]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / completion_blocked_by_open_purchase_request
          rationale: "ERR_OPEN_PURCHASE_REQUESTS is triggered and then unblocked by the named §1.8 instance."

      - name: vendor_not_active_error_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_VENDOR_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / dispatch_requires_vendor_active
          rationale: "ERR_VENDOR_NOT_ACTIVE is triggered by the named §1.8 instance."

      - name: schedule_conflict_errors_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_TECHNICIAN_SCHEDULE_CONFLICT]", "errors[ERR_VENDOR_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / technician_half_open_adjacency
          rationale: "Both schedule-conflict errors are triggered by the two §1.8 resource_temporal_overlap instances (technician_half_open_adjacency and vendor_travel_buffer_gap)."

