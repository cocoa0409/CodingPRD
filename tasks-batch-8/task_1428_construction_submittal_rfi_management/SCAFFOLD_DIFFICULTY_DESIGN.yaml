      - name: rfi_due_date_inclusive_boundary
        grounds:
          - calculations.rfi_due_date
          - entities.RFI.fields.is_late_answer
        distinguishing_aspect: |
          Metric date on POST answer: answered_date == due_date (2026-08-17) is ON TIME
          (inclusive <=) while answered one day later (2026-08-18) sets is_late_answer true —
          the exact boundary day is the discriminator.
        test_recipe:
          setup:
            - "Project ACTIVE (rfi_response_days 10, no holidays); reviewer R1; clock 2026-08-03 (Mon)"
            - "RFI1 opened 2026-08-03 (due 2026-08-17), routed; RFI2 opened 2026-08-03 (due 2026-08-17), routed"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "DueBoundary" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
