          This is the one place where the generic from-state check stands aside: a complaint in
          CONSENT_PENDING is not in the PROBABLE_CAUSE from-state of either channel, yet the declared
          answer is the specific ERR_CONSENT_ALREADY_OPEN, and it survives the respondent's COUNTER
