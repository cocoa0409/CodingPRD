      - name: industry_hour_and_course_status_gates_are_reachable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_INDUSTRY_HOURS_EXCEED_CLAIM]
          - errors[ERR_COURSE_NOT_ACTIVE]
          - validations[priority=33]
          - validations[priority=37]
          - state_machines.Educator.PROVISIONAL_to_PROVISIONAL
          - entities.Educator.fields.verified_industry_hours
        distinguishing_aspect: |
          Priority 33 is an ACCUMULATING ceiling, not a per-request one: the check is verified_industry_hours plus the
          request's hours against claimed_industry_hours, and it also refuses a zero-hour request outright. So the probe
          verifies 3999 hours (accepted, and below INDUSTRY_HOURS_MIN so the educator stays PROVISIONAL), then 202 hours
          which would total 4201 and must be refused, then 201 hours which totals exactly the claimed 4200 and must be
          accepted and flip the educator to ELIGIBLE. Priority 37 is probed in the same instance because it shares its
          rule with the balance check: credits posted against a DRAFT course must be refused while the identical posting
          against the ACTIVE course succeeds.
        test_recipe:
          setup:
            - "One DRAFT ProgramOfStudy with one ACTIVE SECONDARY course of 4.00 credit hours and one DRAFT SECONDARY course of 2.00 credit hours."
            - "One Educator on the INDUSTRY_EXPERIENCE route with claimed_industry_hours 4200, verified_industry_hours 0 and status PROVISIONAL."
            - "One Student in cohort_year 2026 with cte_credits_earned 0 and concentrator_status PARTICIPANT."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "47.0201", title: "HVAC Technology", cluster: "ARCHITECTURE", labor_market_data_asof: "2026-03-01" }
