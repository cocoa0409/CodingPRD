# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules x >=2 instances. All literals pre-computed against §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: gauge_volume_vs_weight_diverge
        grounds:
          - calculations.proof_gallons_gauge
          - state_machines.DistillationRun.DISTILLING_to_GAUGED
          - entities.DistillationRun.fields.proof_gallons
        distinguishing_aspect: "Same collected data gauged VOLUME vs WEIGHT gives 140.0 vs 134.6 proof gallons on the DistillationRun domain (distinct from the excise/TaxRemoval dual-variant)."
        test_recipe:
          setup:
            - "One distillery; two FERMENTING mash batches; two DISTILLING runs with identical collected inputs but gauge_method VOLUME vs WEIGHT."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-1", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn/rye", volume_gallons: 200 }, as: ProductionManager, captures: { mb1: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn/rye", volume_gallons: 200 }, as: ProductionManager, captures: { mb2: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb1}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 100, collected_proof: 140, collected_weight_lbs: 700 }, as: ProductionManager, captures: { run_vol: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb2}", spirit_type: "WHISKEY", gauge_method: "WEIGHT", collected_wine_gallons: 100, collected_proof: 140, collected_weight_lbs: 700 }, as: ProductionManager, captures: { run_wt: $.data.id } }
          trigger:
            - { call: "POST /dsp/distillation-runs/${run_vol}/gauge", payload: {}, as: ProductionManager, captures: { pg_vol: $.data.proof_gallons } }
            - { call: "POST /dsp/distillation-runs/${run_wt}/gauge", payload: {}, as: ProductionManager, captures: { pg_wt: $.data.proof_gallons } }
          assert:
            - "DistillationRun.${run_vol}.proof_gallons == 140.0"
            - "DistillationRun.${run_wt}.proof_gallons == 134.6"
            - "DistillationRun.${run_vol}.proof_gallons != DistillationRun.${run_wt}.proof_gallons"

      - name: excise_reduced_vs_standard_rate_diverge
        grounds:
          - calculations.excise_tax
          - state_machines.TaxRemoval.(none)_to_DETERMINED
          - entities.TaxRemoval.fields.excise_tax_due_cents
        distinguishing_aspect: "Identical 3.6 removed proof gallons taxed under the CBMA reduced regime vs the standard regime yields 972 vs 4860 cents on the TaxRemoval domain (distinct from the gauge dual-variant)."
        test_recipe:
          setup:
            - "A COMPLETED bottling run with 10 cases bottled (11.9 pg in the processing account); cbma_pg_removed_ytd starts at 0."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-2", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 15 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 10 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/bottling-runs/${br}/complete", payload: {}, as: ProductionManager }
          trigger:
            - { call: "POST /dsp/tax-removals", payload: { bottling_run_id: "${br}", removal_reason: "TAXPAID", removed_cases: 3 }, as: ComplianceOfficer, captures: { excise_reduced: $.data.excise_tax_due_cents, removed_a: $.data.removed_proof_gallons } }
            - { call: "POST /dsp/_ledger/set_cbma_ytd", payload: { distillery_id: "${dist_id}", cbma_pg_removed_ytd: 100000 }, as: ComplianceOfficer }
            - { call: "POST /dsp/tax-removals", payload: { bottling_run_id: "${br}", removal_reason: "TAXPAID", removed_cases: 3 }, as: ComplianceOfficer, captures: { excise_standard: $.data.excise_tax_due_cents, removed_b: $.data.removed_proof_gallons } }
          assert:
            - "TaxRemoval(first).removed_proof_gallons == 3.6 and TaxRemoval(second).removed_proof_gallons == 3.6"
            - "TaxRemoval(first).excise_tax_due_cents == 972"
            - "TaxRemoval(second).excise_tax_due_cents == 4860"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: excise_tiered_rate_split_across_cbma_limit
        grounds:
          - calculations.excise_tax
          - entities.Distillery.fields.cbma_pg_removed_ytd
          - entities.TaxRemoval.fields.reduced_rate_pg
        distinguishing_aspect: "Mode (a): 4-input nested min/max (removed_pg, cbma_ytd, 100000 limit, two rates) splits 6.0 pg into 2.0 reduced + 4.0 standard = 5940 cents; not a simple aggregation+threshold."
        test_recipe:
          setup:
            - "COMPLETED 10-case run (11.9 pg processing); cbma_pg_removed_ytd seeded to 99998.0 so a 6.0-pg removal straddles the 100000 limit."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-3", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 15 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 10 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/bottling-runs/${br}/complete", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/_ledger/set_cbma_ytd", payload: { distillery_id: "${dist_id}", cbma_pg_removed_ytd: 99998.0 }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /dsp/tax-removals", payload: { bottling_run_id: "${br}", removal_reason: "TAXPAID", removed_cases: 5 }, as: ComplianceOfficer, captures: { rid: $.data.id } }
          assert:
            - "TaxRemoval.${rid}.removed_proof_gallons == 6.0"
            - "TaxRemoval.${rid}.reduced_rate_pg == 2.0"
            - "TaxRemoval.${rid}.standard_rate_pg == 4.0"
            - "TaxRemoval.${rid}.excise_tax_due_cents == 5940"

      - name: bottling_pg_sum_then_round_pinned
        grounds:
          - calculations.bottling_proof_gallons
          - state_machines.BottlingRun.BOTTLING_to_COMPLETED
          - entities.BottlingRun.fields.bottled_proof_gallons
        distinguishing_aspect: "Mode (b): pinned sum-then-round yields 5.9 pg for 5x6x750mL@100proof; round-per-case-then-sum would give 6.0 — the order is fixed and observable."
        test_recipe:
          setup:
            - "A BOTTLING run of 5 cases (6 bottles x 750mL, label proof 100) drawing a barrel with current_proof_gallons 10.0."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-4", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 10 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 5 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager }
          trigger:
            - { call: "POST /dsp/bottling-runs/${br}/complete", payload: {}, as: ProductionManager, captures: { bottled: $.data.bottled_proof_gallons } }
          assert:
            - "BottlingRun.${br}.bottled_proof_gallons == 5.9"
            - "BottlingRun.${br}.cases_bottled == 5"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: label_needs_correction_resubmit_cycle
        grounds:
          - state_machines.LabelApplication.SUBMITTED_to_NEEDS_CORRECTION
          - state_machines.LabelApplication.NEEDS_CORRECTION_to_SUBMITTED
          - entities.LabelApplication.fields.status
        distinguishing_aspect: "LabelApplication loops SUBMITTED -> NEEDS_CORRECTION -> SUBMITTED (cyclic) before reaching APPROVED — a revision cycle, not a linear pipeline."
        test_recipe:
          setup:
            - "A DRAFT label application."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-5", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
          trigger:
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "RETURN", correction_notes: "fix ABV" }, as: ComplianceOfficer, captures: { st_after_return: $.data.status } }
            - { call: "POST /dsp/label-applications/${label}/resubmit", payload: {}, as: ComplianceOfficer, captures: { st_after_resubmit: $.data.status } }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer, captures: { st_final: $.data.status } }
          assert:
            - "LabelApplication.${label}.status == NEEDS_CORRECTION after the RETURN decision"
            - "LabelApplication.${label}.status == SUBMITTED after resubmit"
            - "LabelApplication.${label}.status == APPROVED after the final APPROVE"

      - name: sales_order_payment_fulfillment_parallel_axes
        grounds:
          - state_machines.SalesOrder.payment=UNPAID_to_payment=PAID
          - state_machines.SalesOrder."fulfillment in {PENDING, ALLOCATED}_to_fulfillment=CANCELLED"
          - entities.SalesOrder.fields.payment_status
        distinguishing_aspect: "payment_status and fulfillment_status advance independently: after cancel the order is fulfillment=CANCELLED yet still payment=PAID until a separate refund — two parallel axes on one SalesOrder."
        test_recipe:
          setup:
            - "A COMPLETED 10-case run; an age-verified customer; a PAID (ALLOCATED) THREE_TIER order for 4 cases."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-6", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 15 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 10 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/bottling-runs/${br}/complete", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/customers", payload: { name: "Ada Buyer", email: "ada@x.com", state_code: "CA", age_verified: true }, as: SalesManager, captures: { cust: $.data.id } }
            - { call: "POST /dsp/sales-orders", payload: { customer_id: "${cust}", bottling_run_id: "${br}", channel: "THREE_TIER", cases: 4, unit_price_cents: 5000 }, as: SalesManager, captures: { order: $.data.id } }
          trigger:
            - { call: "POST /dsp/sales-orders/${order}/pay", payload: {}, as: SalesManager, captures: { pay_p: $.data.payment_status, pay_f: $.data.fulfillment_status } }
            - { call: "POST /dsp/sales-orders/${order}/cancel", payload: {}, as: SalesManager, captures: { can_p: $.data.payment_status, can_f: $.data.fulfillment_status } }
            - { call: "POST /dsp/sales-orders/${order}/refund", payload: {}, as: SalesManager, captures: { ref_p: $.data.payment_status, ref_f: $.data.fulfillment_status } }
          assert:
            - "after pay: SalesOrder.${order}.payment_status == PAID and fulfillment_status == ALLOCATED"
            - "after cancel: SalesOrder.${order}.fulfillment_status == CANCELLED and payment_status == PAID"
            - "after refund: SalesOrder.${order}.payment_status == REFUNDED and fulfillment_status == CANCELLED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: bottling_complete_empties_barrel_closes_run_archives_batch
        grounds:
          - state_machines.BottlingRun.BOTTLING_to_COMPLETED
          - state_machines.Barrel.AGING_to_EMPTIED
          - state_machines.DistillationRun.GAUGED_to_CLOSED
          - state_machines.MashBatch.DISTILLED_to_ARCHIVED
        distinguishing_aspect: "Depth-4 chain: BottlingRun COMPLETE -> Barrel EMPTIED -> DistillationRun CLOSED -> MashBatch ARCHIVED, each hop caused by the prior (trigger: bottling complete)."
        test_recipe:
          setup:
            - "A BOTTLING run of 5 cases drawing the run's only barrel (current 10.0); run GAUGED, batch DISTILLED."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-7", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 10 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 5 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager }
          trigger:
            - { call: "POST /dsp/bottling-runs/${br}/complete", payload: {}, as: ProductionManager }
          assert:
            - "Barrel.${barrel}.status == EMPTIED"
            - "DistillationRun.${run}.status == CLOSED"
            - "MashBatch.${mb}.status == ARCHIVED"

      - name: taxpaid_removal_sells_out_run_autocancels_pending_order
        grounds:
          - state_machines.TaxRemoval.(none)_to_DETERMINED
          - entities.BottlingRun.fields.inventory_status
          - state_machines.SalesOrder."fulfillment in {PENDING, ALLOCATED}_to_fulfillment=CANCELLED"
        distinguishing_aspect: "Depth-3 chain from a different trigger (tax removal): TaxRemoval drains cases -> BottlingRun inventory_status SOLD_OUT -> every PENDING SalesOrder on that run auto-CANCELLED."
        test_recipe:
          setup:
            - "A COMPLETED 5-case run; an un-paid PENDING THREE_TIER order for 2 cases on that run."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-8", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 10 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 5 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/bottling-runs/${br}/complete", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/customers", payload: { name: "Ada Buyer", email: "ada@x.com", state_code: "CA", age_verified: true }, as: SalesManager, captures: { cust: $.data.id } }
            - { call: "POST /dsp/sales-orders", payload: { customer_id: "${cust}", bottling_run_id: "${br}", channel: "THREE_TIER", cases: 2, unit_price_cents: 5000 }, as: SalesManager, captures: { order: $.data.id } }
          trigger:
