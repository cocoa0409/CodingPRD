  # =====================================================================
  # Rule 8 - resource temporal overlap under two different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_weekly_slots_use_half_open_intervals_and_date_intersection
        grounds:
          - calculations.provider_load_and_conflict
          - validations.priority_16_ERR_PROVIDER_TIME_CONFLICT
          - entities.ProviderAssignment.fields.start_time
          - entities.ProviderAssignment.fields.effective_from
          - endpoints.POST_/esy/provider-assignments
        distinguishing_aspect: |
          RESOURCE: Provider (a person's weekly timetable). INTERVAL SEMANTICS:
          HALF-OPEN [start_time, end_time) on a repeating weekday, so 09:00-10:00 and
          10:00-11:00 are compatible and a touching endpoint is NOT a conflict. The
          conflict test is additionally gated by INCLUSIVE intersection of the
          effective_from / effective_to date ranges, so the same colliding clock
          window is accepted once the date ranges are disjoint. No turnaround buffer
          exists on this resource.
        test_recipe:
          setup:
            - "Program P1 is PLANNING with instructional_weekdays MON-THU, 22 instructional days and 6 instructional weeks, and an OPEN IDEA_611_FEDERAL allocation of 25000000 cents."
            - "Provider PR1 is an ACTIVE SPED_TEACHER, rate 150 cents/minute, max_weekly_minutes 1200, assigned_weekly_minutes 0."
