            - { call: "POST /registrations/${ra}/payment", payload: { amount_cents: 2000, method: EXTERNAL }, as: HouseholdManager, as_user_id: "${ha}" }
            - { call: "GET /class-sessions/${ss}", as: ProgramCoordinator, captures: { ss_v2: $.data.version, before_cnt: $.data.enrolled_count, before_wl: $.data.waitlist_count } }
            - { call: "POST /registrations", payload: { session_id: "${ss}", participant_id: "${pb}", expected_class_session_version: "${ss_v2}" }, as: HouseholdManager, as_user_id: "${hb}", captures: { rb: $.data.id } }
            - { call: "GET /class-sessions/${ss}", as: ProgramCoordinator, captures: { mid_cnt: $.data.enrolled_count, mid_wl: $.data.waitlist_count } }
          trigger:
