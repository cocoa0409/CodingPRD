            - { call: "POST /talent/interviewers/${iv1}/calibrations", payload: { guide_id: "${g_adj}" }, as: TalentAssessmentAdmin, captures: { cal1a: $.data.id } }
            - { call: "POST /talent/calibrations/${cal1a}/certify", payload: { practice_score: 0.85 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/interviewers/${iv2}/calibrations", payload: { guide_id: "${g_adj}" }, as: TalentAssessmentAdmin, captures: { cal2a: $.data.id } }
            - { call: "POST /talent/calibrations/${cal2a}/certify", payload: { practice_score: 0.85 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/candidates", payload: { external_ref: "C-R1", full_name: "Cand R1", email: "cr1@x.com", group_code: "GROUP_A" }, as: HiringManager, as_user_id: hm-1, captures: { cr1: $.data.id } }
            - { call: "POST /talent/candidates", payload: { external_ref: "C-R2", full_name: "Cand R2", email: "cr2@x.com", group_code: "GROUP_A" }, as: HiringManager, as_user_id: hm-1, captures: { cr2: $.data.id } }
