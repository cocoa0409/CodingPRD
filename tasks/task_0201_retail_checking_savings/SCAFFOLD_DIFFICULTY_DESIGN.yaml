  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_kyc_risk_on_approve
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Application.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          A DRAFT (never-submitted) application with a would-be-high kyc_risk_score is approved:
          the state check (priority 5, category state, ERR_INVALID_STATE) fires before the KYC
          gate (priority 7, category business_safety, ERR_KYC_RISK_TOO_HIGH). Error-category pair
          = state vs business_safety, distinct from the temporal-vs-state pair below.
        test_recipe:
          setup:
            - "A DRAFT application (never submitted) for a sanctioned non-US customer (would score 90 on submit)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Draft Risky", date_of_birth: "1985-01-01", tax_id_last4: "9999", country_of_residence: "GB" }
              as: Teller
              captures: { cust_dr: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_dr}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_dr: $.data.id }
          trigger:
            - call: "POST /applications/${app_dr}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_INVALID_STATE (state precondition fires before KYC business_safety gate)"

      - name: escheat_not_due_beats_invalid_state_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.Account.DORMANT_to_ESCHEATED
        distinguishing_aspect: |
          On run-escheat-sweep against an ACTIVE (not DORMANT) account that is also not yet
          escheat-due, the state check (priority 5, category state, ERR_INVALID_STATE) wins over
          the temporal escheat-due check (priority 10, category business_temporal,
          ERR_ESCHEAT_NOT_DUE). Error-category pair = state vs business_temporal, a different
          pairing than the state-vs-business_safety conflict above.
        test_recipe:
          setup:
            - "A freshly opened ACTIVE account (not DORMANT, not escheat-due)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Fresh Owner", date_of_birth: "1990-01-01", tax_id_last4: "5050", country_of_residence: "US" }
              as: Teller
              captures: { cust_f: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_f}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_f: $.data.id }
            - call: "POST /applications/${app_f}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_f}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_f: $.data.opened_account_id }
          trigger:
            - call: "POST /accounts/${acct_f}/run-escheat-sweep"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_INVALID_STATE (account is ACTIVE, not DORMANT — state check precedes the escheat-due temporal check)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: courtesy_floor_exact_vs_one_cent_over
        grounds:
          - calculations.overdraft_nsf_fee_tier
          - state_machines.Transaction.PENDING_to_POSTED
          - state_machines.Transaction.PENDING_to_RETURNED
          - entities.Account.fields.courtesy_pay_limit_cents
        distinguishing_aspect: |
          Numeric threshold crossing on the courtesy floor via POST /accounts/{id}/transactions:
          a withdrawal landing post-debit available exactly at -courtesy_pay_limit_cents POSTS
          (>= floor), while one cent deeper is RETURNED NSF. Tested on the courtesy-floor metric;
          a different metric/endpoint than the dormancy day-count boundary below.
        test_recipe:
          setup:
            - "Account ledger 10000, courtesy opted in, limit 50000 -> floor at -50000; a 60000 withdrawal lands exactly at -50000."
          setup_api_calls:
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Edge Owner", date_of_birth: "1990-01-01", tax_id_last4: "6060", country_of_residence: "US" }
              as: Teller
              captures: { cust_g: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_g}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_g: $.data.id }
            - call: "POST /applications/${app_g}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_g}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_g: $.data.opened_account_id }
            - call: "POST /accounts/${acct_g}/courtesy-pay"
              payload: { courtesy_pay_opted_in: true, courtesy_pay_limit_cents: 50000 }
              as: AccountHolder
              as_user_id: "${cust_g}"
            - call: "POST /accounts/${acct_g}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 10000 }
              as: AccountHolder
              as_user_id: "${cust_g}"
          trigger:
            - call: "POST /accounts/${acct_g}/transactions"
              payload: { txn_type: "WITHDRAWAL", amount_cents: 60000 }
              as: AccountHolder
              as_user_id: "${cust_g}"
              captures: { edge_txn: $.data.id, edge_status: $.data.status }
          assert:
            - "Transaction.${edge_txn}.status == POSTED (post-debit available == -50000 == floor, inclusive)"
            - "GET /accounts/${acct_g} -> Account.ledger_balance_cents == -53000 (-50000 item then -3000 tier-1 overdraft fee)"

      - name: dormancy_day_count_threshold_minus_one
        grounds:
          - validations[priority=9]
          - state_machines.Account.ACTIVE_to_DORMANT
          - entities.Account.fields.dormancy_threshold_days
        distinguishing_aspect: |
          Day-count boundary on the dormancy_threshold_days metric via run-dormancy-scan: at
          exactly 364 days of inactivity the scan returns ERR_DORMANCY_NOT_DUE, while at 365 the
          account flips DORMANT. Tested on the dormancy day-count metric/endpoint, distinct from
          the courtesy-floor cents boundary above.
        test_recipe:
          setup:
            - "Account whose last_activity_date is 2025-01-01; clock set to 2025-12-31 (exactly 364 days inactive)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
