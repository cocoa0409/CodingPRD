  # ===========================================================================
  - section: endpoints
    instances:

      - name: delete_withdraws_the_draft_lease_and_disqualifies_its_appraisals
        claim_type: standard_crud
        grounds:
          - endpoints[DELETE /leases/{id}]
          - state_machines[Lease].transitions[DRAFT -> WITHDRAWN].side_effects
        distinguishing_aspect: "DELETE is a state change, not a row removal: the lease is still readable as WITHDRAWN and still counted by a status-filtered list, its QUALIFIED appraisal is dragged to DISQUALIFIED by the declared side effect, and a second DELETE is refused because WITHDRAWN is terminal."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite."
            - "One physician-owned ONCOLOGY tenant on a DRAFT lease at 30.00 psf for 2026-09-01..2029-08-31, carrying one QUALIFIED appraisal."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { e1_b_id: $.data.id }
            - call: "POST /buildings/${e1_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { e1_s_id: $.data.id }
