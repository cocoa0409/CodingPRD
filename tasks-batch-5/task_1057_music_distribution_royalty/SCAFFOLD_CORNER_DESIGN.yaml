          - "entities.RoyaltyStatement.fields.reconciled_by_user_id"
        distinguishing_aspect: "The reconcile/close pair is segregated: closing with the same X-User-ID that reconciled returns 403 ERR_SEGREGATION_OF_DUTIES, and a different FinanceOps user then closes successfully."
        test_recipe:
          setup: ["Artist CAELUM2 with an INGESTING statement over [2026-05-01, 2026-06-01) reconciled by fin-1."]
