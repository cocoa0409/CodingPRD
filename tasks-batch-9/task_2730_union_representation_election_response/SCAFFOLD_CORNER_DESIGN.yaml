      - name: the_blocking_hold_survives_a_merit_finding_and_only_a_settlement_lifts_it
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_BLOCKING_CHARGE_PENDING
          - errors.ERR_CASE_POSTURE_BLOCKED
          - state_machines.ULPCharge.transitions.FILED_to_MERIT_FOUND
          - validations[priority=11]
        distinguishing_aspect: |
          ERR_BLOCKING_CHARGE_PENDING is structurally unreachable: blocking_charge_count > 0 always implies
          case_posture != OPEN, and priority 11 answers first, so the guard is defensive. What is observable
          is that a MERIT determination deliberately does NOT decrement the counter - the same certify call
          fails identically before and after the determination - and only the settlement releases the hold
          and un-impounds the ballots.
