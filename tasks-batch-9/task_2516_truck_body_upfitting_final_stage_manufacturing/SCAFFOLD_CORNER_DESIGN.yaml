          - endpoints.POST_/upfit/build-configurations
        distinguishing_aspect: |
          The F450 fails the service body's book requirements on BOTH axes at once — 60 in of cab to
          axle against 84 required and a 176 in wheelbase against 189 required — and priority 70 must
          win. The paired positive case is the sharpest possible control: the same chassis model
          against the dump body clears both requirements at exact equality (60 >= 60, 176 >= 176).
        test_recipe:
          setup:
            - "F450-SRW-60CA (CA 60, WB 176) and two body specs: SERVICE-11FT (min CA 84, min WB 189) and DUMP-12FT (min CA 60, min WB 176)."
