  - rule_id: transitive_cascade
    instances:
      - name: recordkeeper_exit_cascade_depth3
        grounds:
          - state_machines.Recordkeeper.ACTIVE_to_EXITED
          - state_machines.MatchCandidate.CONFIRMED_to_EXPIRED
          - state_machines.SafeHarborIRA.MATCHED_to_OPEN
          - entities.Plan.fields.network_reachable
        distinguishing_aspect: |
          Depth-3 chain from the recordkeeper-exit trigger: (1) Recordkeeper EXITED flips
          Plan.network_reachable to false; (2) the plan's unreachability EXPIRES the CONFIRMED and
          CANDIDATE matches targeting it; (3) the expired CONFIRMED match returns its IRA from
          MATCHED to OPEN. Each link is caused by the previous link, not by the exit call directly.
        test_recipe:
          setup:
            - "Two IRAs (same source batch, elected path): IRA1 MATCHED via auto-confirmed 0.910 match to plan Y at RK-B; IRA2 OPEN with a CANDIDATE-band 0.652 match to the same plan Y"
          setup_api_calls:
