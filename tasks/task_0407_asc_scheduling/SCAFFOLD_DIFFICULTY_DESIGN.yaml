            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN2", full_name: "Pat Two", date_of_birth: "1981-01-01" }
              as: Scheduler
              captures: { pat2_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 720 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { case1_id: $.data.id, blk_v1: $.data.version }
          trigger:
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v1}", patient_id: "${pat2_id}", procedure_id: "${proc_id}", start_min: 500, recovery_bay_id: "${bay_id}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_OR_TIME_CONFLICT"
            - "trigger response error_id != ERR_RECOVERY_PHASE2_REQUIRED"

  # ===========================================================================
  - rule_id: boundary_precision_check
