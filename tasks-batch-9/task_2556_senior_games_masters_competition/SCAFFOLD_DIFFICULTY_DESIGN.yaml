            - "exactly three SessionSlot rows exist on Venue ${vn_x_id} (${slot_s1_id}, ${slot_s2_id}, ${slot_s3_id}) and exactly two on Venue ${vn_y_id} (${slot_y1_id}, ${slot_y2_id})"
            - "SessionSlot.${slot_s1_id}.teardown_buffer_minutes == 15 and SessionSlot.${slot_s2_id}.teardown_buffer_minutes == 0"

      - name: personnel_closed_interval_with_venue_conditional_travel_buffer
        grounds:
          - calculations.personnel_conflict_window
          - validations[priority=66]
          - validations[priority=80]
          - entities.Personnel.fields.assigned_minutes_total
          - errors[ERR_PERSONNEL_DOUBLE_BOOKED]
          - errors[ERR_PERSONNEL_DAILY_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          INTERVAL SEMANTICS #2 ON THE PERSONNEL RESOURCE, deliberately the mirror image of the
          Venue semantics: intervals are CLOSED so touching endpoints DO conflict (the exact case
          the Venue rule accepts), the buffer is applied SYMMETRICALLY on both sides and ONLY when
          the two slots sit at DIFFERENT venues (a venue-conditional widening the Venue rule has
          no analogue for), capacity is always 1 rather than a per-resource count, and a SECOND,
          independent aggregate ceiling of MAX_DAILY_ASSIGNED_MINUTES is evaluated per UTC date
          on top of the pairwise check.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN, one LOW-contact TRACK sport with required_certification_level 2, one 60-64 event with no entries so the athlete recovery-gap rule is vacuous."
            - "Venue A (North Oval) and Venue B (South Annex) both have competition_area_count 4, EP_ADVANCED and an on-site medical bay, so no Venue-side capacity rule can interfere."
            - "One OFFICIAL, Dana Reyes, with certification_level 3 and certified_sport_codes ['TRACK'], so certification never blocks an assignment."
            - "Slots at Venue A on 2026-09-12: A1 09:00-10:00, A2 10:00-11:00, A3 10:01-11:00, A4 14:20-20:20. Slots at Venue B on 2026-09-12: B1 11:30-12:30, B2 11:46-12:46. Slot A5 at Venue A on 2026-09-13 14:20-20:20. Every slot has teardown_buffer_minutes 0 and required_official_count 1."
            - "Dana already holds one ASSIGNED assignment on A1, so assigned_minutes_total is 60."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
