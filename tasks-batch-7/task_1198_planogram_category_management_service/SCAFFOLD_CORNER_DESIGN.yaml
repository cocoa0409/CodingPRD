            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "GET /retailers/${rid}/categories/${cid}/planograms/${pgid}"
              payload: {}
              as: CategoryManager
              captures: { recorded: $.data.submitted_by_captain_supplier_id }
