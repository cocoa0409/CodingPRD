            - call: "POST /registry/typing-requests/${ct_d1}/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { ct_grade: "$.data.reported_match_grade" }
            - call: "GET /registry/match-candidates/${mc_d1}"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc_conf: "$.data.confirmed_score", mc_conf_grade: "$.data.confirmed_match_grade", mc_status_after_ct: "$.data.status" }
            - call: "POST /registry/match-candidates/${mc_d1}/screening"
