          assert:
            - "${expires} == 2026-08-01T10:00:00Z"
            - "HTTP status == 200"
            - "${dp} == LUNCH"
            - "${epoch} == 1"
            - "${waste} == 1600"
            - "${slots} == 0"
            - "ProductionBatch.${batch_id}.status == DISCARDED"
            - "ProductionBatch.${batch_id}.remaining_qty == 0"
            - "ProductionBatch.${batch_id}.discarded_qty == 40"
            - "GET /production-batches/${batch_id}/waste-logs -> total_count == 1"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].reason == DAYPART_TRANSITION"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].qty == 40"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].food_cost_cents == 1600"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].retail_value_cents == 7960"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].logged_by_user_id == system"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].daypart_epoch == 1"

      - name: pull_a_planned_batch_returns_batch_state_invalid
        claim_type: invalid_transitions
        grounds:
          - state_machines.ProductionBatch.BAKING_to_HOLDING
          - errors[ERR_BATCH_STATE_INVALID]
          - validations[priority=11]
        distinguishing_aspect: |
          pull is only defined from BAKING. Firing it on a PLANNED batch must return
          ERR_BATCH_STATE_INVALID (409) and leave hold_started_at / hold_expires_at null - skipping the bake
          must not be treated as an implicit bake-then-pull.
        test_recipe:
          setup:
