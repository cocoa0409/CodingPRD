              captures: { c_est56b_id: $.data.id }
            - call: "GET /mining/permits/${c_permit56_id}"
              as: PermitReviewer
              captures: { c_p56v1: $.data.version }
          trigger:
            - call: "POST /mining/reclamation-cost-estimates/${c_est56b_id}/accept"
              payload: { expected_permit_version: "${c_p56v1}" }
              as: PermitReviewer
              captures: { c_est56b_status: $.data.status }
            - call: "POST /mining/reclamation-cost-estimates/${c_est56a_id}/accept"
              payload: { expected_permit_version: "${c_p56v1}" }
              as: PermitReviewer
              captures: { c_err_occ1: $.data.error_id }
            - call: "GET /mining/permits/${c_permit56_id}"
              as: PermitReviewer
              captures: { c_p56v2: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${c_est56a_id}/accept"
              payload: { expected_permit_version: "${c_p56v2}" }
              as: PermitReviewer
              captures: { c_est56a_status: $.data.status }
          assert:
            - "${c_est56b_status} == ACCEPTED and Permit.${c_permit56_id}.bond_required_amount == 938164.50 (per_acre_loaded 7702.50, subtotal 924300.00, admin_fee 13864.50)"
            - "${c_p56v2} == ${c_p56v1} + 1"
            - "HTTP 412 with ${c_err_occ1} == ERR_STALE_PERMIT_VERSION; ReclamationCostEstimate.${c_est56a_id}.status is still SUBMITTED and bond_required_amount is still 938164.50"
            - "${c_est56a_status} == ACCEPTED after the re-read, ReclamationCostEstimate.${c_est56b_id}.status == SUPERSEDED"
            - "Permit.${c_permit56_id}.bond_required_amount == 865998.00 and version == ${c_p56v1} + 2"

      - name: stale_permit_version_on_bond_recalculation_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[bond-recalculation-stale-permit]
          - errors[ERR_STALE_PERMIT_VERSION]
          - validations[priority=8]
          - calculations.bond_required_amount
        distinguishing_aspect: "A recalculation carrying the version observed before a newer estimate was accepted returns ERR_STALE_PERMIT_VERSION, and the retry with the fresh version prices the INCREMENTAL basis off the newer 6500.00 estimate at 469082.25 rather than the older one."
        test_recipe:
          setup:
            - "CHAIN-ISSUED at 6000.00/acre (bond_required 865998.00, CASH 900000.00 accepted), then disturbance reported as 60.00 acres."
