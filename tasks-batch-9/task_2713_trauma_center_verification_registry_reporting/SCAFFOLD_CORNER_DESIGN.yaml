              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${t3}", mrn: "MRN-RW1", arrival_at: "2026-07-05T14:00:00Z", injury_severity_score: 3, los_hours: 6.00, ed_disposition: "DISCHARGE" }
