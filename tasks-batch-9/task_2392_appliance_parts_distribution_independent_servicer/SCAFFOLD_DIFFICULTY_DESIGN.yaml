  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: allocation_blocked_while_owning_servicer_account_is_on_credit_hold
        grounds:
          - validations[priority=8]
          - state_machines.PartOrder.DRAFT_to_ALLOCATED
          - state_machines.ServicerAccount.ACTIVE_to_CREDIT_HOLD
          - errors[ERR_SERVICER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair PartOrder -> ServicerAccount: the order itself is perfectly allocatable
          (DRAFT, credit-approved, one line, stock on the shelf) and the only thing standing in
          the way is the owner account's account_status, so the same request fails with
          ERR_SERVICER_NOT_ACTIVE on CREDIT_HOLD and succeeds unchanged once the account is ACTIVE.
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL (OPEN, will_call_enabled true); Part P1 (12999 MECHANICAL); InventoryRecord (STL, P1) with on_hand_units 10."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 10000000, authorized for WHIRLPOOL."
            - "A WILL_CALL order at STL holds one line for 1 unit of P1 (10399) and is credit-approved, so fulfillment_status DRAFT / settlement_status CREDIT_APPROVED."
            - "The account is then moved to CREDIT_HOLD; the order has no reservation yet, so nothing is frozen by the move."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p1_id}", on_hand_units: 10, reorder_point: 2 }
              as: PlatformAdmin
              captures: { inv_a_p1_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 1, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_id: $.data.id }
            - call: "POST /part-orders/${order_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "PATCH /servicer-accounts/${acct_s_id}"
              payload: { account_status: "CREDIT_HOLD" }
              as: CreditManager
          trigger:
            - call: "POST /part-orders/${order_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "PATCH /servicer-accounts/${acct_s_id}"
              payload: { account_status: "ACTIVE" }
              as: CreditManager
            - call: "POST /part-orders/${order_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
          assert:
            - "trigger step 1 returns HTTP 409 with data.error_id == ERR_SERVICER_NOT_ACTIVE"
            - "after trigger step 1: PartOrder.${order_id}.fulfillment_status == DRAFT and InventoryRecord.${inv_a_p1_id}.reserved_units == 0"
            - "trigger step 3 returns 200 and PartOrder.${order_id}.fulfillment_status == ALLOCATED"
            - "OrderLine.${line_id}.line_status == ALLOCATED and OrderLine.${line_id}.allocation_branch_id == ${branch_a_id}"
            - "InventoryRecord.${inv_a_p1_id}.reserved_units == 1 and InventoryRecord.${inv_a_p1_id}.available_units == 9"
            - "PartOrder.${order_id}.total_cents == 10399"

      - name: warranty_submission_blocked_after_the_covering_certification_is_revoked
        grounds:
          - validations[priority=25]
          - state_machines.WarrantyClaim.DRAFT_to_SUBMITTED
          - state_machines.TechnicianCertification.ACTIVE_to_REVOKED
          - calculations.cert_effectiveness
          - errors[ERR_TECHNICIAN_CERT_REQUIRED]
        distinguishing_aspect: |
          A different entity pair — WarrantyClaim -> TechnicianCertification — and a different
          dependency direction from the order/account pair: the claim was legally opened while the
          SEALED_SYSTEM certification was effective, and revoking that certification retroactively
          removes the competence needed to file it, so submit fails with
          ERR_TECHNICIAN_CERT_REQUIRED while the claim stays DRAFT with a null submitted_at.
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL; Part P2 W10-COMP, WHIRLPOOL, SEALED_SYSTEM, list 320000, weight 12000 g, core_required true, core_deposit_cents 8500 (cert_level_required SEALED_SYSTEM)."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 10000000, core_liability_limit_cents 5000000, authorized for WHIRLPOOL."
            - "One WHIRLPOOL SEALED_SYSTEM certification for technician Dana Ruiz, 2026-01-01 through 2027-01-01, ACTIVE and effective at 2026-08-01."
            - "InventoryRecord (STL, P2) with on_hand_units 5."
            - "A WILL_CALL order for 1 unit of P2 is credit-approved, allocated and fulfilled on 2026-08-01: unit 288000, core deposit 8500, invoiced_total 296500."
            - "A DRAFT warranty claim already exists against that shipped line, and the certification is then revoked."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
