scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_vendor_returns_201_with_fields
        claim_type: Creation
        grounds: ["entities.VendorRegistration", "endpoints"]
        distinguishing_aspect: "POST /vendors with all required fields returns 201 and a VendorRegistration with sam_status == DRAFT and version == 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "Acme Corp", uei: "ACME00000001", employee_count: 12, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { v_id: $.data.id, st: $.data.sam_status, ver: $.data.version }
          assert:
            - "response code == 201"
            - "VendorRegistration.${v_id}.sam_status == DRAFT"
            - "VendorRegistration.${v_id}.version == 1"

      - name: get_vendor_not_found
        claim_type: Not Found
        grounds: ["entities.VendorRegistration", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /vendors/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /vendors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ContractingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404 and error_id == ERR_NOT_FOUND"

      - name: vendor_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.VendorRegistration.fields.uei", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /vendors omitting required uei returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "NoUei", employee_count: 12, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400 and error_id == ERR_INVALID_REQUEST"

      - name: vendor_set_aside_default_empty_array
        claim_type: Defaults
        grounds: ["entities.VendorRegistration.fields.set_aside_certifications"]
        distinguishing_aspect: "Omitting set_aside_certifications applies the default empty array []."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "DefaultCerts", uei: "DEFC00000001", employee_count: 12, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { certs: $.data.set_aside_certifications, v_id: $.data.id }
          assert:
            - "VendorRegistration.${v_id}.set_aside_certifications == []"

      - name: vendor_system_fields_input_ignored
        claim_type: System Fields
        grounds: ["entities.VendorRegistration.fields.sam_status", "entities.VendorRegistration.fields.performance_index"]
        distinguishing_aspect: "Client-supplied sam_status/performance_index are ignored; server mints sam_status == DRAFT and performance_index == null."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "IgnoreSys", uei: "IGNS00000001", employee_count: 12, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { st: $.data.sam_status, pi: $.data.performance_index, v_id: $.data.id }
          assert:
            - "VendorRegistration.${v_id}.sam_status == DRAFT"
            - "VendorRegistration.${v_id}.performance_index == null"

      - name: vendor_raw_score_enum_out_of_range
        claim_type: Type Constraints
        grounds: ["entities.FactorScore.fields.raw_score", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /proposals/{id}/scores with raw_score 150 (>100) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A DRAFT proposal under an OPEN solicitation."]
          setup_api_calls:
            - call: "POST /solicitations"
              payload: { title: "Scoresol", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-03-01T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 1.0 }
              as: ContractingOfficer
              captures: { f_tech: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/open"
              payload: {}
              as: ContractingOfficer
            - call: "POST /vendors"
              payload: { legal_name: "ScoreVendor", uei: "SCOR00000001", employee_count: 5, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { v_id: $.data.id }
            - call: "POST /proposals"
              payload: { solicitation_id: "${sol_id}", vendor_id: "${v_id}", total_price_cents: 40000000 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /proposals/${p_id}/scores"
              payload: { factor_id: "${f_tech}", raw_score: 150 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 400 and error_id == ERR_INVALID_REQUEST"

      - name: list_vendors_pagination_envelope
        claim_type: Listing
        grounds: ["entities.VendorRegistration", "endpoints"]
        distinguishing_aspect: "GET /vendors returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["Two vendors created."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "L1", uei: "LST100000001", employee_count: 1, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
            - call: "POST /vendors"
              payload: { legal_name: "L2", uei: "LST200000001", employee_count: 1, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
          trigger:
            - call: "GET /vendors"
              payload: {}
              as: Auditor
          assert:
            - "response_type == array; meta total_count == 2; has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_vendor_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.VendorRegistration.DRAFT_to_ACTIVE"]
        distinguishing_aspect: "Activating a vendor already ACTIVE has no defined transition from ACTIVE via activate->ACTIVE; returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ACTIVE vendor."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /vendors"
              payload: { legal_name: "AlreadyActive", uei: "ALAC00000001", employee_count: 5, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { v_id: $.data.id }
            - call: "POST /vendors/${v_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /vendors/${v_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_INVALID_STATE"

      - name: vendor_expired_revival_cycle
        claim_type: Valid Transition
        grounds: ["state_machines.VendorRegistration.EXPIRED_to_ACTIVE", "entities.VendorRegistration.fields.sam_status"]
        distinguishing_aspect: "EXPIRED vendor with a renewed expiry re-activates (EXPIRED->ACTIVE), sam_status returns to ACTIVE (cyclic shape)."
        test_recipe:
          setup: ["An ACTIVE vendor that was then EXPIRED by the CO."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /vendors"
              payload: { legal_name: "Reviver", uei: "REVV00000001", employee_count: 5, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { v_id: $.data.id }
            - call: "POST /vendors/${v_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /vendors/${v_id}/expire"
              payload: {}
              as: ContractingOfficer
          trigger:
            - call: "POST /vendors/${v_id}/activate"
              payload: { registration_expires_at: "2028-01-01T00:00:00Z" }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { st: $.data.sam_status }
          assert:
            - "VendorRegistration.${v_id}.sam_status == ACTIVE"

      - name: excluded_vendor_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.VendorRegistration.ACTIVE_to_EXCLUDED"]
        distinguishing_aspect: "An EXCLUDED vendor (terminal) cannot be activated; activate returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ACTIVE vendor that was then EXCLUDED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /vendors"
              payload: { legal_name: "Debarred", uei: "DEBR00000001", employee_count: 5, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { v_id: $.data.id }
            - call: "POST /vendors/${v_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /vendors/${v_id}/exclude"
              payload: {}
              as: ContractingOfficer
          trigger:
            - call: "POST /vendors/${v_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_INVALID_STATE"

      - name: solicitation_initial_state_draft
        claim_type: Initial State
        grounds: ["state_machines.Solicitation", "entities.Solicitation.fields.status"]
        distinguishing_aspect: "A newly created solicitation starts in status == DRAFT with amendment_count == 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /solicitations"
              payload: { title: "Fresh", vehicle_type: "IFB", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-03-01T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_id: $.data.id, st: $.data.status, ac: $.data.amendment_count }
          assert:
            - "Solicitation.${sol_id}.status == DRAFT"
            - "Solicitation.${sol_id}.amendment_count == 0"

      - name: open_sets_evaluation_method_from_vehicle
        claim_type: Side Effect Execution
        grounds: ["state_machines.Solicitation.DRAFT_to_OPEN", "entities.Solicitation.fields.evaluation_method"]
        distinguishing_aspect: "Opening an IFB solicitation sets evaluation_method == LPTA (RFP would set TRADEOFF)."
        test_recipe:
          setup: ["A DRAFT IFB solicitation with valid factors, clock at open_at."]
          setup_api_calls:
            - call: "POST /solicitations"
              payload: { title: "IFB Sol", vehicle_type: "IFB", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-03-01T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 1.0 }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
          trigger:
            - call: "POST /solicitations/${sol_id}/open"
              payload: {}
              as: ContractingOfficer
              captures: { em: $.data.evaluation_method, st: $.data.status }
          assert:
            - "Solicitation.${sol_id}.evaluation_method == LPTA"
            - "Solicitation.${sol_id}.status == OPEN"

      - name: cancel_open_solicitation_cascades_proposals_withdrawn
        claim_type: Cascade down
        grounds: ["state_machines.Solicitation.OPEN_to_CANCELLED", "state_machines.Proposal"]
        distinguishing_aspect: "Cancelling an OPEN solicitation cascades a SUBMITTED proposal to WITHDRAWN."
        test_recipe:
          setup: ["An OPEN solicitation with one SUBMITTED proposal."]
          setup_api_calls:
            - call: "POST /solicitations"
              payload: { title: "CancelSol", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-03-01T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 1.0 }
              as: ContractingOfficer
              captures: { f_tech: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
              captures: { f_price: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/open"
              payload: {}
              as: ContractingOfficer
            - call: "POST /vendors"
              payload: { legal_name: "CancelVendor", uei: "CANC00000001", employee_count: 5, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { v_id: $.data.id }
            - call: "POST /vendors/${v_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals"
              payload: { solicitation_id: "${sol_id}", vendor_id: "${v_id}", total_price_cents: 40000000 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { p_id: $.data.id }
            - call: "POST /proposals/${p_id}/scores"
              payload: { factor_id: "${f_tech}", raw_score: 90 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${p_id}/scores"
              payload: { factor_id: "${f_price}", raw_score: 100 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /proposals/${p_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /solicitations/${sol_id}/cancel"
              payload: {}
              as: ContractingOfficer
            - call: "GET /proposals/${p_id}"
              payload: {}
              as: ContractingOfficer
              captures: { st: $.data.status }
          assert:
            - "Proposal.${p_id}.status == WITHDRAWN"
            - "Solicitation.${sol_id}.status == CANCELLED"

      - name: protest_denied_restores_award
        claim_type: Compensation
        grounds: ["state_machines.Protest.UNDER_REVIEW_to_DENIED", "state_machines.Award.PROTESTED_to_AWARDED"]
        distinguishing_aspect: "Resolving a protest DENIED restores Award.status to AWARDED (compensation of the PROTESTED flag)."
        test_recipe:
          setup: ["An AWARDED award now PROTESTED with the protest UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /vendors"
              payload: { legal_name: "DWin", uei: "DWIN00000001", employee_count: 30, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { vw_id: $.data.id }
            - call: "POST /vendors/${vw_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${vw_id}"
            - call: "POST /vendors"
              payload: { legal_name: "DLose", uei: "DLOS00000001", employee_count: 30, registration_expires_at: "2027-01-01T00:00:00Z" }
              as: Vendor
              captures: { vl_id: $.data.id }
            - call: "POST /vendors/${vl_id}/activate"
              payload: {}
              as: Vendor
              as_user_id: "${vl_id}"
            - call: "POST /solicitations"
              payload: { title: "DeniedProtest", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-02-05T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 1.0 }
              as: ContractingOfficer
              captures: { f_tech: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
              captures: { f_price: $.data.id }
            - call: "POST /solicitations/${sol_id}/open"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals"
              payload: { solicitation_id: "${sol_id}", vendor_id: "${vw_id}", total_price_cents: 50000000 }
              as: Vendor
              as_user_id: "${vw_id}"
              captures: { pw_id: $.data.id }
            - call: "POST /proposals/${pw_id}/scores"
              payload: { factor_id: "${f_tech}", raw_score: 95 }
              as: Vendor
              as_user_id: "${vw_id}"
            - call: "POST /proposals/${pw_id}/scores"
              payload: { factor_id: "${f_price}", raw_score: 100 }
              as: Vendor
              as_user_id: "${vw_id}"
            - call: "POST /proposals/${pw_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${vw_id}"
            - call: "POST /proposals"
              payload: { solicitation_id: "${sol_id}", vendor_id: "${vl_id}", total_price_cents: 60000000 }
              as: Vendor
              as_user_id: "${vl_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /proposals/${pl_id}/scores"
              payload: { factor_id: "${f_tech}", raw_score: 80 }
              as: Vendor
              as_user_id: "${vl_id}"
            - call: "POST /proposals/${pl_id}/scores"
              payload: { factor_id: "${f_price}", raw_score: 100 }
              as: Vendor
              as_user_id: "${vl_id}"
            - call: "POST /proposals/${pl_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${vl_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-05T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/close"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pw_id}/begin-evaluation"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pw_id}/score"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pl_id}/begin-evaluation"
              payload: {}
              as: ContractingOfficer
            - call: "POST /proposals/${pl_id}/score"
              payload: {}
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/finalize-evaluation"
              payload: {}
              as: ContractingOfficer
              as_user_id: "co_chair"
              captures: { sol_v: $.data.version }
            - call: "POST /awards"
              payload: { solicitation_id: "${sol_id}", proposal_id: "${pw_id}", expected_solicitation_version: "${sol_v}" }
              as: ContractingOfficer
              as_user_id: "co_award"
              captures: { aw_id: $.data.id }
            - call: "POST /protests"
              payload: { award_id: "${aw_id}", protester_vendor_id: "${vl_id}", grounds: "weak grounds" }
              as: Vendor
              as_user_id: "${vl_id}"
              captures: { prot_id: $.data.id }
            - call: "POST /protests/${prot_id}/begin-review"
              payload: {}
              as: ContractingOfficer
          trigger:
            - call: "POST /protests/${prot_id}/resolve"
              payload: { outcome: "DENIED" }
              as: ContractingOfficer
            - call: "GET /awards/${aw_id}"
              payload: {}
              as: ContractingOfficer
              captures: { st: $.data.status }
          assert:
            - "Award.${aw_id}.status == AWARDED (restored)"

      - name: close_solicitation_before_deadline_invalid_state
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Solicitation.OPEN_to_CLOSED", "validations[priority=5]"]
        distinguishing_aspect: "Closing an OPEN solicitation while clock < close_at fails the precondition (clock >= close_at) with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An OPEN solicitation, clock still before close_at."]
          setup_api_calls:
            - call: "POST /solicitations"
              payload: { title: "EarlyClose", vehicle_type: "RFP", set_aside_type: "NONE", naics_size_threshold: 500, open_at: "2026-02-01T00:00:00Z", close_at: "2026-03-01T00:00:00Z" }
              as: ContractingOfficer
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Technical", kind: "TECHNICAL", weight: 1.0 }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/factors"
              payload: { name: "Price", kind: "PRICE", weight: 0.0 }
              as: ContractingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /solicitations/${sol_id}/open"
              payload: {}
              as: ContractingOfficer
          trigger:
            - call: "POST /solicitations/${sol_id}/close"
              payload: {}
              as: ContractingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409 and error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: ffp_invoice_amount_units_times_price
        claim_type: Correct Result
        grounds: ["calculations.invoice_amount", "entities.ContractLineItem.fields.unit_price_cents"]
        distinguishing_aspect: "FFP invoice amount_cents == unit_price_cents * invoiced_qty (50000 * 30 == 1500000), fee_portion_cents == 0."
        test_recipe:
          setup: ["An ACTIVE FFP contract with a CLIN unit_price_cents=50000, funded_qty=100."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ContractingOfficer
            - call: "POST /vendors"
