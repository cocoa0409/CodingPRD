    roles: [VendorAdmin]
    code: 200
    input: []
    output: "{ generated_work_order_ids: string[], expired_registration_ids: string[], escalated_violation_ids: string[], released_disposition_ids: string[], expired_work_order_ids: string[], missed_inspection_ids: string[] }"
