            - "GuardianNotification.${unsafe_gn_id}.attempt_count == 0"
            - "GuardianNotification.${unsafe_gn_id}.resolved_at == null"
            - "Youth.${unsafe_youth_id}.risk_posture == RESTRICTED"

      - name: discharged_admission_rejects_a_second_discharge
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Admission.terminal_states
          - validations[priority=10]
          - errors.ERR_ADMISSION_ALREADY_TERMINAL
        distinguishing_aspect: "DISCHARGED is terminal: a second discharge returns 409 ERR_ADMISSION_ALREADY_TERMINAL (priority 10, which owns terminal rows because priority 9 is scoped to non-terminal admissions) and the bed is not double-released - occupied_beds stays 0, not -1."
        test_recipe:
          setup:
            - "an ACTIVE admission at an OPEN shelter, discharged at the default clock 2026-08-01T00:00:00Z to OTHER_SHELTER while its GuardianNotification is still PENDING (not OVERDUE, so the runaway-report gate passes)"
            - "the discharge instant equals admitted_at and is before 12:00Z, so final_billable_nights is 0"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { term_program_id: $.data.id }
