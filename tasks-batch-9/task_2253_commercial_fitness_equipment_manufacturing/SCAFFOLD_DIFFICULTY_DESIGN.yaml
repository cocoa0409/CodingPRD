- rule_id: boundary_precision_check
  instances:
  - name: volume_discount_tier_exact_lower_bound_and_price_inversion
    grounds:
    - calculations.order_total_assembly
    - entities.Order.fields.volume_discount_cents
    - entities.Order.fields.quoted_total_cents
    - endpoints[POST /orders/{id}/quote]
    - endpoints[GET /orders/{id}/price-breakdown]
    distinguishing_aspect: An order of 40 units lands discount_base_cents on exactly 15000000, the inclusive lower bound of the 0.075 tier, so volume_discount_cents == 1125000 and quoted_total_cents ==
      14790200 — 142120 cents CHEAPER than the 39-unit order at 14932320, and 525000 cents away from the 600000 discount an exclusive-bound implementation would compute.
    test_recipe:
      setup:
      - Logical clock at the default 2026-08-01T00:00:00Z throughout.
      - L200 Connected Cross-Trainer (CONNECTED / LIGHT_COMMERCIAL / 348375 cents / 88.0 kg, uplift 0.00) has RELEASED revision L200-R1.
      - Facility f1 is freight_zone Z2 (260 cents/kg).
      - Order o39 holds one ACTIVE line of 39 x L200-R1 GRAPHITE; order o40 holds one ACTIVE line of 40 x L200-R1 GRAPHITE.
      - Both orders are still CONFIGURING and UNQUOTED before the trigger.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: L200 Connected Cross-Trainer, category: CONNECTED, duty_class: LIGHT_COMMERCIAL, unit_list_price_cents: 348375, shipping_weight_kg: 88.0, allowed_finish_codes: [GRAPHITE], console_platform: CONSOLE_X}
