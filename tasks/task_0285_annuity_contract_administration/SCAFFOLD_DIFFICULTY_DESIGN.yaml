              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "POST /death-claims"
              payload: { contract_id: "${cid}", date_of_death: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
              captures: { dc: $.data.id }
          trigger:
            - call: "POST /death-claims/${dc}/deny"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /contracts/${cid}"
              payload: {}
              as: ContractAdmin
              captures: { acc_after: $.data.accumulation_value_cents, st: $.data.status }
          assert:
            - "Contract.${cid}.accumulation_value_cents == 2000000"
            - "Contract.${cid}.status == ACTIVE"
            - "DeathClaim.${dc}.status == DENIED"

      - name: withdrawal_request_then_reject_conserves_free_corridor
        grounds:
          - state_machines.Withdrawal.REQUESTED_to_REJECTED
          - entities.Contract.fields.free_withdrawal_used_cents
          - entities.Contract.fields.accumulation_value_cents
        distinguishing_aspect: |
          Conserved quantity = Contract.free_withdrawal_used_cents (different from instance 1's
          accumulation): requesting a withdrawal (forward) then rejecting it (compensating) leaves
          free_withdrawal_used_cents == 0 and accumulation == 2,000,000; a reject never consumes
          corridor, so no drift in corridor usage.
        test_recipe:
          setup:
            - "FIXED contract ACTIVE funded 2,000,000, corridor 1000bps, free_withdrawal_used=0; one REQUESTED withdrawal requested 150,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /products"
              payload: { name: "Fixed", contract_type: "FIXED", fixed_annual_rate_bps: 0, free_withdrawal_corridor_bps: 1000, death_benefit_type: "ACCOUNT_VALUE", surrender_charge_schedule: [ { contract_year: 0, charge_bps: 700 } ], min_initial_premium_cents: 1000000 }
              as: ContractAdmin
              captures: { pid: $.data.id }
            - call: "POST /contracts"
              payload: { product_id: "${pid}", owner_name: "Owner", annuitant_age: 60 }
              as: ContractAdmin
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /premiums"
              payload: { contract_id: "${cid}", gross_premium_cents: 2000000, expected_contract_version: "${cv0}" }
              as: ContractAdmin
              captures: { prem0: $.data.id }
            - call: "POST /premiums/${prem0}/clear"
              payload: {}
              as: ContractAdmin
            - call: "GET /contracts/${cid}"
              payload: {}
              as: ContractAdmin
              captures: { cv1: $.data.version }
            - call: "POST /withdrawals"
              payload: { contract_id: "${cid}", requested_amount_cents: 150000, expected_contract_version: "${cv1}" }
              as: ContractAdmin
              captures: { wid: $.data.id }
          trigger:
            - call: "POST /withdrawals/${wid}/reject"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /contracts/${cid}"
              payload: {}
              as: ContractAdmin
              captures: { used_after: $.data.free_withdrawal_used_cents, acc_after: $.data.accumulation_value_cents }
          assert:
            - "Contract.${cid}.free_withdrawal_used_cents == 0"
            - "Contract.${cid}.accumulation_value_cents == 2000000"
            - "Withdrawal.${wid}.status == REJECTED"
