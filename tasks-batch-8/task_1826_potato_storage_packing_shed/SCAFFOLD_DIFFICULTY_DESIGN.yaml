            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "YUKON_GOLD", harvest_date: "2026-07-21", original_weight_cwt: 500.00 }, as: IntakeClerk, captures: { l2_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l2_id}/bin-assignment", payload: { bin_id: "${b2_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer L", variety: "RUSSET_BURBANK", committed_volume_cwt: 300.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c1_id: "$.data.id" } }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer M", variety: "YUKON_GOLD", committed_volume_cwt: 200.00, price_cents_per_cwt: 2200, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c2_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c1_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 100.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o1_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o1_id}/allocate", payload: {}, as: SalesManager }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c1_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 100.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o2_id: "$.data.id" } }
