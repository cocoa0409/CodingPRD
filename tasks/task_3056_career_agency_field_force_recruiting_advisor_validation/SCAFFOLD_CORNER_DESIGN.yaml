              payload: { policy_number: "NM-L001", writing_advisor_id: "${adv_lead_id}", carrier_name: "Northwestern Mutual", product_line: "LIFE", annual_premium_cents: 480000, issue_date: "2026-02-01T00:00:00Z", is_advanced_commission: true }
              as: ManagingDirector
