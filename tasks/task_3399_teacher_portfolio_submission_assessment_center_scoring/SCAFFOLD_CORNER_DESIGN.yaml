            - call: "GET /incentive-programs/${prog_id}"
              payload: {}
              as: IncentiveAdministrator
              captures: { rem3: $.data.budget_remaining_cents }
          assert:
            - "Both stipends auto-proposed at 330000 (PROPOSED rows never encumber): amt_a == 330000 and amt_b == 330000"
            - "Approving A succeeds: budget_remaining_cents == 70000 (400000 - 330000)"
            - "Approving B then fails 422 ERR_PROGRAM_BUDGET_EXHAUSTED (70000 < 330000) and B stays PROPOSED"
            - "Revoking the APPROVED stipend A restores budget_remaining_cents == 400000 (compensating invariant)"
            - "Any further transition on the REVOKED stipend fails 409 ERR_STIPEND_NOT_TRANSITIONABLE (terminal lockdown)"
            - "After the revocation restores budget, stipend B approves and pays: APPROVED then PAID; budget_remaining_cents == 70000 (400000 - 330000, invariant holds for PAID rows too)"
            - "PAID is terminal: revoking it fails 409 ERR_STIPEND_NOT_TRANSITIONABLE and budget stays 70000"

