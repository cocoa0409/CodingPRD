          - calculations.drawdown_reimbursable
        distinguishing_aspect: "Conserved quantity = Subaward.obligated_cents: after submit (debits 5000000) then return (credits 5000000), obligated_cents == 0, exactly its pre-submit value; the pinned invariant is obligated_cents == sum(reimbursable_cents over Drawdowns in {SUBMITTED,APPROVED,PAID})."
