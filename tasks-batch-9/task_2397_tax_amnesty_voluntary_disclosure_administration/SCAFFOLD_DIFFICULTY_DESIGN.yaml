              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/representatives"
              payload: { firm_name: "Halloran Tax Counsel", bar_number: "BAR-55120" }
              as: ProgramAdministrator
              captures: { rep_id: $.data.id }
            - call: "POST /amnesty/pre-clearances"
              payload: { program_id: "${prog_id}", tax_type: "SALES_USE", anonymous_alias: "CLIENT-45", estimated_liability_cents: 600000, self_reported_under_audit: false, earliest_unfiled_period_start: "2024-10-01" }
              as: Representative
              as_user_id: "${rep_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /amnesty/pre-clearances/${pc_id}/begin-review"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { pc_v2: $.data.version }
            - call: "POST /amnesty/pre-clearances/${pc_id}/offer-terms"
              payload: { expected_pre_clearance_version: "${pc_v2}", offered_lookback_months: 36, offered_penalty_waiver_pct: 0.70, offered_interest_waiver_pct: 0.30 }
