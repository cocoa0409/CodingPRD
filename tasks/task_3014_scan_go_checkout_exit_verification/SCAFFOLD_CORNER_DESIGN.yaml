# =============================================================================
# §1.9 Scaffold Corner Design — Scan-and-Go Checkout & Exit Verification
# Breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: club_creation_applies_documented_defaults
        claim_type: defaults_applied
        grounds: [entities.Club.fields.scan_go_enabled, entities.Club.fields.lp_unscanned_threshold, entities.Club.fields.connectivity_posture]
        distinguishing_aspect: "Club created with only required inputs exposes the documented defaults: scan_go_enabled true, connectivity ONLINE, thresholds 2/3, slot capacity 2, TTLs 30/10."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Club Defaults", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id, enabled: $.data.scan_go_enabled, posture: $.data.connectivity_posture, thr: $.data.lp_unscanned_threshold, strikes: $.data.lp_suspend_strikes, cap: $.data.staging_slot_capacity, rttl: $.data.receipt_code_ttl_minutes, ittl: $.data.intercept_ttl_minutes }
          trigger:
            - call: "GET /clubs/${club_id}"
              as: PlatformAdmin
          assert:
            - "enabled == true and posture == ONLINE"
            - "thr == 2 and strikes == 3 and cap == 2 and rttl == 30 and ittl == 10"

      - name: member_creation_defaults_active_with_zero_balances
        claim_type: defaults_applied
        grounds: [entities.Member.fields.status, entities.Member.fields.cash_rewards_pending_cents, entities.Member.fields.unscanned_strikes]
        distinguishing_aspect: "Member registered without tender_status defaults to tender OK, status ACTIVE, and all computed counters (pending/posted rewards, lifetime charged, strikes) start at 0."
        test_recipe:
          setup: ["Club exists"]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Club MD", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { status: $.data.status, tender: $.data.tender_status, pend: $.data.cash_rewards_pending_cents, posted: $.data.cash_rewards_posted_cents, charged: $.data.lifetime_charged_cents, strikes: $.data.unscanned_strikes }
          assert:
            - "status == ACTIVE and tender == OK"
            - "pend == 0 and posted == 0 and charged == 0 and strikes == 0"

      - name: catalog_item_weighted_missing_price_rejected
        claim_type: required_fields
        grounds: [entities.CatalogItem.fields.price_per_pound_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "WEIGHTED item without price_per_pound_cents violates the pricing-mode-conditional required field and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Club exists"]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Club RF", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
          trigger:
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "APL", item_name: "Apples", pricing_mode: "WEIGHTED" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: session_creation_sets_open_with_zero_totals
        claim_type: creation
        grounds: [entities.ScanSession.fields.status, entities.ScanSession.fields.provisional_total_cents]
        distinguishing_aspect: "A new scan session is OPEN with provisional_total_cents 0, scanned_item_count 0, and null receipt_code before payment."
        test_recipe:
          setup: ["Club, CLUB member, clock 12:00"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club SC", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
          trigger:
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { status: $.data.status, prov: $.data.provisional_total_cents, cnt: $.data.scanned_item_count, code: $.data.receipt_code }
          assert:
            - "status == OPEN and prov == 0 and cnt == 0 and code is null"

      - name: session_scanned_item_count_computed_across_modes
        claim_type: computed_fields
        grounds: [calculations.scanned_item_count, entities.ScanSession.fields.scanned_item_count]
        distinguishing_aspect: "scanned_item_count sums UNIT quantities but counts each WEIGHTED line once: 2 units of milk + one 300g banana bag = 3 physical items."
        test_recipe:
          setup: ["Club, UNIT item (400c) and WEIGHTED item (250c/lb), CLUB member, clock 12:00, session"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club CIC", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "CV_ARCH" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK", item_name: "Milk", pricing_mode: "UNIT", unit_price_cents: 400 }
              as: PlatformAdmin
              captures: { unit_item: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "BAN", item_name: "Banana", pricing_mode: "WEIGHTED", price_per_pound_cents: 250 }
              as: PlatformAdmin
              captures: { w_item: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${unit_item}", quantity: 2 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${w_item}", weight_grams: 300 }
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /scan-sessions/${session_id}"
              as: Member
              as_user_id: "${member_id}"
              captures: { cnt: $.data.scanned_item_count, prov: $.data.provisional_total_cents }
          assert:
            - "cnt == 3"
            - "prov == 965 (2*400=800 plus round_half_up(300*250/454)=round_half_up(165.198)=165)"

      - name: get_session_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SCAN_SESSION_NOT_FOUND]"]
        distinguishing_aspect: "GET /scan-sessions/{id} with a well-formed but unknown id returns 404 ERR_SCAN_SESSION_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /scan-sessions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SCAN_SESSION_NOT_FOUND"

      - name: get_club_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CLUB_NOT_FOUND]"]
        distinguishing_aspect: "Unknown club id returns ERR_CLUB_NOT_FOUND (distinct error id per resource type)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clubs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLUB_NOT_FOUND"

      - name: get_member_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "Unknown member id returns ERR_MEMBER_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MEMBER_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: abandon_paid_session_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ScanSession.transitions, "errors[ERR_SESSION_NOT_OPEN]"]
        distinguishing_aspect: "abandon is only defined from OPEN/REVIEW_HOLD/OFFLINE_PAUSED; a PAID session rejects abandon with ERR_SESSION_NOT_OPEN and stays PAID."
        test_recipe:
          setup: ["Club, UNIT item 500c, CLUB member, clock 12:00, paid session"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club AB", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK", item_name: "Milk", pricing_mode: "UNIT", unit_price_cents: 500 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /scan-sessions/${session_id}/abandon"
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SESSION_NOT_OPEN"
            - "ScanSession.${session_id}.status == PAID"

      - name: pay_voided_session_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ScanSession.PAID_to_VOIDED, "errors[ERR_SESSION_NOT_OPEN]"]
        distinguishing_aspect: "VOIDED is terminal: a second pay attempt on a voided session fails with ERR_SESSION_NOT_OPEN; no double charge occurs."
        test_recipe:
          setup: ["Club, UNIT item 500c, CLUB member, clock 12:00, paid-then-voided session"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club TL", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK", item_name: "Milk", pricing_mode: "UNIT", unit_price_cents: 500 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/void-payment"
              as: LossPreventionOfficer
          trigger:
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SESSION_NOT_OPEN"
            - "Member.${member_id}.lifetime_charged_cents == 0"

      - name: resolve_intercept_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.RestrictedIntercept.PENDING_to_APPROVED, "errors[ERR_INTERCEPT_NOT_PENDING]"]
        distinguishing_aspect: "A second resolve on an APPROVED (terminal) intercept fails with ERR_INTERCEPT_NOT_PENDING; the line is not re-cleared and the session is unaffected."
        test_recipe:
          setup: ["Club, ALCOHOL item 1500c, PLUS member birth_year 1990, clock 12:00, session with one intercepted line"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club RI", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "WINE", item_name: "Wine", pricing_mode: "UNIT", unit_price_cents: 1500, restricted_class: "ALCOHOL" }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /scan-sessions/${session_id}/intercepts"
              as: Associate
              captures: { int_id: "$.data[0].id" }
            - call: "POST /intercepts/${int_id}/resolve"
              payload: { decision: "APPROVE", birth_year_verified: true }
              as: Associate
          trigger:
            - call: "POST /intercepts/${int_id}/resolve"
              payload: { decision: "DENY" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INTERCEPT_NOT_PENDING"
            - "ScanSession.${session_id}.provisional_total_cents == 1500"

      - name: intercept_deny_removes_line_and_recomputes_totals
        claim_type: side_effect_execution
        grounds: [state_machines.RestrictedIntercept.PENDING_to_DENIED, state_machines.ScanLine.INTERCEPTED_to_REMOVED]
        distinguishing_aspect: "DENY compensates the scan: line REMOVED, provisional total drops by the line amount, session reopens to OPEN."
        test_recipe:
          setup: ["Club, ALCOHOL item 1500c + NONE item 400c, PLUS member, clock 12:00, session with both scanned (alcohol intercepted)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club DN", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "WINE", item_name: "Wine", pricing_mode: "UNIT", unit_price_cents: 1500, restricted_class: "ALCOHOL" }
              as: PlatformAdmin
              captures: { alc_item: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK", item_name: "Milk", pricing_mode: "UNIT", unit_price_cents: 400 }
              as: PlatformAdmin
              captures: { milk_item: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${milk_item}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${alc_item}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
              captures: { alc_line: $.data.id }
            - call: "GET /scan-sessions/${session_id}/intercepts"
              as: Associate
              captures: { int_id: "$.data[0].id" }
          trigger:
            - call: "POST /intercepts/${int_id}/resolve"
              payload: { decision: "DENY" }
              as: Associate
            - call: "GET /scan-sessions/${session_id}"
              as: Associate
              captures: { sess_status: $.data.status, prov: $.data.provisional_total_cents }
            - call: "GET /scan-lines/${alc_line}"
              as: Associate
              captures: { line_status: $.data.status }
          assert:
            - "line_status == REMOVED"
            - "sess_status == OPEN"
            - "prov == 400"

      - name: offline_pause_and_restore_cycle
        claim_type: valid_transition
        grounds: [state_machines.ScanSession.OPEN_to_OFFLINE_PAUSED, state_machines.ScanSession.OFFLINE_PAUSED_to_OPEN]
        distinguishing_aspect: "Connectivity drop pauses an OPEN session; restoring connectivity returns it to OPEN — a cyclic transition driven by a different entity (Club)."
        test_recipe:
          setup: ["Club, UNIT item 500c, CLUB member, clock 12:00, session with one line"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club OF", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK", item_name: "Milk", pricing_mode: "UNIT", unit_price_cents: 500 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /clubs/${club_id}/connectivity"
              payload: { posture: "OFFLINE_FALLBACK" }
              as: ClubManager
            - call: "GET /scan-sessions/${session_id}"
              as: ClubManager
              captures: { paused_status: $.data.status }
            - call: "POST /clubs/${club_id}/connectivity"
              payload: { posture: "ONLINE" }
              as: ClubManager
            - call: "GET /scan-sessions/${session_id}"
              as: ClubManager
              captures: { restored_status: $.data.status, prov: $.data.provisional_total_cents }
          assert:
            - "paused_status == OFFLINE_PAUSED"
            - "restored_status == OPEN"
            - "prov == 500 (cart survives the outage)"

      - name: restricted_scan_blocked_during_offline_fallback
        claim_type: precondition_enforcement
        grounds: ["validations[priority=5]", "errors[ERR_RESTRICTED_BLOCKED_OFFLINE]"]
        distinguishing_aspect: "During OFFLINE_FALLBACK non-restricted scans still succeed but restricted scans are rejected with ERR_RESTRICTED_BLOCKED_OFFLINE — the safety gate is reachable because offline scanning is otherwise allowed."
        test_recipe:
          setup: ["Club, ALCOHOL item 1500c, PLUS member, clock 12:00, session OPEN then club goes OFFLINE_FALLBACK"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club RB", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "WINE", item_name: "Wine", pricing_mode: "UNIT", unit_price_cents: 1500, restricted_class: "ALCOHOL" }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /clubs/${club_id}/connectivity"
              payload: { posture: "OFFLINE_FALLBACK" }
              as: ClubManager
          trigger:
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RESTRICTED_BLOCKED_OFFLINE"
            - "ScanSession.${session_id}.provisional_total_cents == 0"

      - name: receipt_verification_happy_path_exits_session
        claim_type: valid_transition
        grounds: [state_machines.ExitVerification.PENDING_to_VERIFIED, state_machines.ScanSession.EXIT_PENDING_to_EXITED]
        distinguishing_aspect: "RECEIPT_CODE flow end-to-end: pay mints the receipt code, exit-scan creates a PENDING verification, the matching code verifies it and the session lands in terminal EXITED."
        test_recipe:
          setup: ["Club RECEIPT_CODE, UNIT item 600c, CLUB member, clock 12:00, paid session at EXIT_PENDING with captured receipt_code"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club RC", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
