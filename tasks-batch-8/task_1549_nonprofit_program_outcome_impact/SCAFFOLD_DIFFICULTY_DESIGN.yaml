              captures: { rep_status: $.data.status, rep_idx: $.data.snapshot_overall_impact_index, rep_dq: $.data.snapshot_dq_score, rep_comp: $.data.snapshot_data_completeness_pct }
          assert:
            - "status sequence DRAFT -> GENERATED -> DELIVERED -> RETURNED -> GENERATED all succeed"
            - "after regenerate: snapshot_dq_score == 100.00, snapshot_overall_impact_index == 60.00, snapshot_data_completeness_pct == 100.00, generated_at refreshed (non-null)"

      - name: improvement_action_ineffective_loop
        grounds:
          - state_machines.ImprovementAction.IMPLEMENTED_to_VERIFIED_INEFFECTIVE
          - state_machines.ImprovementAction.VERIFIED_INEFFECTIVE_to_PROPOSED
        distinguishing_aspect: |
          ImprovementAction loops VERIFIED_INEFFECTIVE -> PROPOSED so the
          continuous-improvement cycle can run twice on the same entity; the
          second pass reaches VERIFIED_EFFECTIVE (terminal), which a linear
          pipeline could not express.
        test_recipe:
          setup:
            - "Program ACTIVE; improvement action proposed by EvaluationLead user lead-1"
          setup_api_calls:
