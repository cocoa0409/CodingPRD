            - { call: "POST /v1/conversion-orders", payload: { studio_film_id: "${f1_id}", target_format: "PREMIUM_2D", scheduled_post_start_date: "2026-09-01T00:00:00Z", scheduled_post_end_date: "2026-09-03T00:00:00Z" }, as: StudioRelationshipManager, captures: { conv1_id: $.data.id } }
            - { call: "POST /v1/conversion-orders/${conv1_id}/begin-post", payload: {}, as: PostProductionScheduler }
            - { call: "POST /v1/conversion-orders", payload: { studio_film_id: "${f2_id}", target_format: "PREMIUM_2D", scheduled_post_start_date: "2026-09-03T00:00:00Z", scheduled_post_end_date: "2026-09-05T00:00:00Z" }, as: StudioRelationshipManager, captures: { conv2_id: $.data.id } }
          trigger:
            - { call: "POST /v1/conversion-orders/${conv2_id}/begin-post", payload: {}, as: PostProductionScheduler, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 409"
            - "error_id == ERR_POST_SCHEDULE_OVERLAP"
            - "ConversionOrder.${conv2_id}.status remains SUBMITTED"

  # ===========================================================================
  # Rule 9: compensating_invariant — different conserved quantities
  # ===========================================================================
