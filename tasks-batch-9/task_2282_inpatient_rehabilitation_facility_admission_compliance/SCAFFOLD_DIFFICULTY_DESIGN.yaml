# =============================================================================
# task_2282 — §1.8 Scaffold Difficulty Design (test targeting index)
# Nine §0.5 difficulty rules × ≥2 instances each. Every `grounds:` entry resolves
# into SCAFFOLD.yaml §1.1–§1.7; every chain starts from an empty database and the
# logical clock's documented default of 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: three_hour_rule_daily_vs_weekly_variant_divergence
        grounds:
          - calculations.three_hour_rule_evaluation
          - entities.TherapyWeek.fields.evaluation_mode
          - entities.OverallPlanOfCare.fields.three_hour_rule_mode
          - state_machines.TherapyWeek.OPEN_to_MET
          - state_machines.TherapyWeek.OPEN_to_NOT_MET
        distinguishing_aspect: |
          Two admissions receive byte-identical therapy volume (three calendar dates of
          300 credited minutes each, 900 total); the DAILY_3HR-pinned week resolves
          NOT_MET on qualifying_days_count 3 < 5 while the WEEKLY_15HR-pinned week
          resolves MET on delivered_credited_minutes 900 >= 900, so the divergence is
          caused only by the variant selector pinned from the plan of care.
        test_recipe:
          setup:
            - "One facility with default compliance_threshold_pct 60.00 and daily_therapy_cap_minutes 300."
            - "Two patients, each with a PHYSICIAN_CONCURRED screening and an ADMITTED admission dated 2026-08-04T12:00:00Z."
            - "Admission A holds an ACTIVE plan of care with three_hour_rule_mode DAILY_3HR; admission B holds one with WEEKLY_15HR."
            - "Each admission has TherapyWeek week_index 1 starting 2026-08-04, and three DELIVERED 300-minute INDIVIDUAL PT sessions on 2026-08-04, 2026-08-05 and 2026-08-06 given by two different physical therapists so no clinician interval overlaps."
            - "Logical clock advanced to 2026-08-06T18:00:00Z before delivery so every session is documented in the past."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "100001", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Nina Nurse", credential: "NURSE", npi: "1000000001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { nurse_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Paul Physician", credential: "REHAB_PHYSICIAN", npi: "1000000002" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { phys_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Tara Therapist", credential: "THERAPIST_PT", npi: "1000000003" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { pt1_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Theo Therapist", credential: "THERAPIST_PT", npi: "1000000005" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { pt2_id: $.data.id }
            - call: "POST /patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN-A", full_name: "Ann Patient", birth_date: "1958-04-11", impairment_group_code: "0008", etiologic_diagnosis_code: "I63.9", comorbidity_tier: "TIER_2" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { pat_a_id: $.data.id }
            - call: "POST /patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN-B", full_name: "Ben Patient", birth_date: "1961-09-02", impairment_group_code: "0704", etiologic_diagnosis_code: "S72.001A", comorbidity_tier: "NONE" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { pat_b_id: $.data.id }
            - call: "POST /screenings"
              payload: { patient_id: "${pat_a_id}", conducted_by_clinician_id: "${nurse_id}", expected_admission_at: "2026-08-04T12:00:00Z", intensive_therapy_documented: true, expected_functional_improvement_documented: true, prior_functional_level_documented: true, medical_supervision_documented: true }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { scr_a_id: $.data.id }
            - call: "POST /screenings/${scr_a_id}/submit"
              payload: {}
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
            - call: "POST /screenings/${scr_a_id}/review"
              payload: { decision: "CONCUR", reviewer_note: "Intensive rehab appropriate" }
              as: RehabPhysician
              as_user_id: "${phys_id}"
            - call: "POST /screenings"
              payload: { patient_id: "${pat_b_id}", conducted_by_clinician_id: "${nurse_id}", expected_admission_at: "2026-08-04T12:00:00Z", intensive_therapy_documented: true, expected_functional_improvement_documented: true, prior_functional_level_documented: true, medical_supervision_documented: true }
