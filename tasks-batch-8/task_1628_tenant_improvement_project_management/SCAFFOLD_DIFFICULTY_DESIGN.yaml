  # =====================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: occupancy_certificate_three_hop_cascade
        grounds:
          - state_machines.TIProject.PUNCH_to_CLOSEOUT
          - state_machines.OverageInvoice.DRAFT_to_ISSUED
          - calculations.rent_abatement
        distinguishing_aspect: |
          Depth-3 chain from trigger issue-occupancy-certificate: TIProject
          PUNCH->CLOSEOUT (hop 1) mutates Lease (hop 2: actual commencement +
          abatement set), and the lease finalization itself flips the project's
          DRAFT OverageInvoice to ISSUED (hop 3) with due_date = issued date + 30.
        test_recipe:
          setup:
            - "Project in PUNCH with one VERIFIED-exempt punch state (no punch items), CO beyond headroom approved (share 2100000) and invoiced as DRAFT"
            - "Lease CALENDAR basis, rent 36500000, scheduled RCD 2026-09-01; cert issued_on 2026-09-11, delay LANDLORD"
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "Tower H", address: "8 Main St", max_concurrent_construction_projects: 2 }
              as: LandlordPM
              captures: { prop_id: $.data.id }
