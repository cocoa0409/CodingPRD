              captures: { err: $.data.error_id }
          assert:
            - "PretreatmentStage.${st1}.status == OUT_OF_RANGE (hop 1)"
            - "PaintLine.${line1}.posture == CHEM_HOLD (hop 2, caused by hop 1)"
            - "start rejected: err == ERR_LINE_ON_CHEM_HOLD (409)"
            - "RunSlot.${slot1}.status == SCHEDULED (unchanged by the rejected start)"

  # ---------------------------------------------------------------- Rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: slot_create_state_error_precedes_chem_safety_error
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_LOT_NOT_QUEUED]
          - errors[ERR_STAGE_OUT_OF_RANGE]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: the request violates both (lot is
          RECEIVED, not QUEUED; the line's stage is OUT_OF_RANGE) and the state-category
          error ERR_LOT_NOT_QUEUED must win because priority 6 sorts before priority 7.
        test_recipe:
          setup:
            - "Customer, spec, line, stage driven OUT_OF_RANGE by a 19.9 gpl reading, permit cap 500.0"
            - "Lot qty 100 exists but was never accepted (status RECEIVED)"
