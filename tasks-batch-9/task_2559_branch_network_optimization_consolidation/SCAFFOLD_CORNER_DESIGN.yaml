              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
