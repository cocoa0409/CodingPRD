        distinguishing_aspect: |
          An empty formula cannot be cleared: the linked_ingredient_count gate fires before any
          per-ingredient status check, so a product with zero lines gets
          ERR_NO_INGREDIENTS_LINKED rather than ERR_INGREDIENT_NOT_APPROVED, and its
          formula_status stays DRAFT with formula_cleared_by_user_id null.
        test_recipe:
          setup:
            - "One applicant with one facility and one product that has no ProductIngredient rows."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
