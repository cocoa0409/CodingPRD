              captures: { e_restart: $.data.error_id }
            - call: "POST /epr/verification-engagements/${eng_id}/issue-opinion"
              payload: { opinion: "UNQUALIFIED" }
              as: IndependentVerifier
              as_user_id: "verifier-1"
              captures: { e_reopinion: $.data.error_id }
          assert:
            - "${e_restart} == ERR_INVALID_STATE with HTTP 409, not ERR_REPORT_NOT_UNDER_VERIFICATION"
            - "${e_reopinion} == ERR_INVALID_STATE with HTTP 409"
            - "VerificationEngagement.${eng_id}.status == OPINION_ISSUED, opinion == QUALIFIED and version == ${eng_ver} (no version movement from either rejected call)"
            - "PackagingReport.${rep_id}.submission_status == CORRECTION_REQUIRED and correction_due_at == 2026-08-31T00:00:00Z — the second opinion did not overwrite the first"
            - "Registration.${reg_id}.compliance_posture == AT_RISK"

      - name: report_parallel_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.PackagingReport
          - state_machines.PackagingReport_fee_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / report_parallel_dimensions_and_correction_cycle
          rationale: "That instance walks submission_status and fee_status through the full independent grid and asserts the combined state after every hop."

      - name: report_correction_cycle_loops_back_and_conserves_the_tonnage_ledger
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.PackagingReport.transitions.CORRECTION_REQUIRED_to_SUBMITTED
          - calculations.reported_weight_ytd_rollup
        excluded_because:
          difficulty_instance: compensating_invariant / correction_cycle_restores_reported_weight_ytd
          rationale: "That instance drives the loop twice and asserts reported_weight_kg_ytd returns to the exact pre-cycle value."

      - name: registration_active_suspended_cycle_recovers_its_derived_fields
        claim_type: cyclic
        grounds:
          - state_machines.Registration.transitions.ACTIVE_to_SUSPENDED
          - state_machines.Registration.transitions.SUSPENDED_to_ACTIVE
        excluded_because:
          difficulty_instance: non_linear_state_machine / registration_suspend_reinstate_cycle
          rationale: "That instance cycles the registration and asserts posture, suspension_reason and membership reconciliation at each pass."

      - name: membership_approval_guarded_by_published_fee_schedule
        claim_type: guarded_transitions
        grounds:
          - state_machines.Membership.transitions.PENDING_to_ACTIVE
          - validations.priority_9
          - errors[ERR_FEE_SCHEDULE_NOT_PUBLISHED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / membership_create_blocked_by_draft_fee_schedule
          rationale: "That instance asserts the DRAFT-schedule rejection and the success path after publication."

      - name: revenue_restatement_cascades_down_to_registrations_and_reports
        claim_type: cascade_down
        grounds:
          - state_machines.Producer.transitions.OBLIGATION_DETERMINED_to_DRAFT
          - endpoints.POST /epr/producers/{id}/restate-revenue
        excluded_because:
          difficulty_instance: transitive_cascade / restate_revenue_three_hop_cascade
          rationale: "That instance asserts every hop of the restatement cascade including the DRAFT-only report blocking and the posture rewrite."

      - name: report_submit_ledger_syncs_the_registration_tonnage
        claim_type: ledger_sync
        grounds:
          - endpoints.POST /epr/reports/{id}/submit
          - calculations.reported_weight_ytd_rollup
        excluded_because:
          difficulty_instance: transitive_cascade / adverse_opinion_six_hop_cascade
          rationale: "That instance asserts the ledger-sync hop into and out of the counted set as part of the six-hop chain."

      - name: invoice_void_compensates_the_producer_fee_balance
        claim_type: compensation
        grounds:
          - state_machines.Invoice.transitions.ISSUED_to_VOID
          - calculations.producer_fee_balance_rollup
        excluded_because:
          difficulty_instance: compensating_invariant / invoice_issue_void_reissue_restores_fee_balance_exactly
          rationale: "That instance asserts the exact integer restoration of assessed_fee_balance_cents across issue/void/reissue."

      - name: final_assessment_precondition_requires_verified_submission_status
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PackagingReport_fee_status.transitions.UNASSESSED_to_FINAL
          - validations.priority_21
          - errors[ERR_VERIFICATION_REQUIRED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / final_assessment_blocked_until_engagement_issues_unqualified
          rationale: "That instance asserts the 409 before the opinion and the success immediately after the UNQUALIFIED opinion."

  - section: calculations
    instances:

      - name: producer_weight_rollup_rounds_each_sku_before_summing
        claim_type: precision
        grounds:
          - calculations.producer_annual_packaging_weight
          - entities.Sku.fields.unit_packaging_weight_grams
          - entities.Producer.fields.annual_packaging_weight_kg
        distinguishing_aspect: "Two 0.0005 kg SKUs each round up to 0.001 kg BEFORE the sum, so the producer rollup is 5.502 kg; summing first and rounding once would yield 5.501 kg."
        test_recipe:
          setup:
            - "One producer with three ACTIVE SKUs: 110 x 50.00 g GLASS, 1 x 0.50 g PLASTIC and 1 x 0.50 g PAPER."
          setup_api_calls:
            - call: "POST /epr/producers"
              payload: { legal_name: "Northlake Beverages LLC", brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 5000000, contact_email: "compliance@northlake.example" }
              as: ProgramRegulator
              captures: { p1_id: $.data.id }
            - call: "POST /epr/skus"
              payload: { producer_id: "${p1_id}", gtin: "00000000000017", name: "Sparkling Water 750ml", product_category: "BEVERAGE", units_sold_annual_estimate: 110 }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { sku_a_id: $.data.id }
            - call: "POST /epr/skus/${sku_a_id}/components"
              payload: { material_type: "GLASS", unit_weight_grams: 50.00, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus/${sku_a_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus"
              payload: { producer_id: "${p1_id}", gtin: "00000000000062", name: "Sample Sachet A", product_category: "FOOD_DRY", units_sold_annual_estimate: 1 }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { sku_b_id: $.data.id }
            - call: "POST /epr/skus/${sku_b_id}/components"
              payload: { material_type: "PLASTIC", unit_weight_grams: 0.50, recyclability_class: "LIMITED", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus/${sku_b_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus"
              payload: { producer_id: "${p1_id}", gtin: "00000000000079", name: "Sample Sachet B", product_category: "FOOD_DRY", units_sold_annual_estimate: 1 }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { sku_c_id: $.data.id }
            - call: "POST /epr/skus/${sku_c_id}/components"
              payload: { material_type: "PAPER", unit_weight_grams: 0.50, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus/${sku_c_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /epr/producers/${p1_id}/determine-obligation"
              payload: {}
              as: ProgramRegulator
          assert:
            - "Sku.${sku_a_id}.unit_packaging_weight_grams == 50.00 and Sku.${sku_b_id}.unit_packaging_weight_grams == 0.50 and Sku.${sku_c_id}.unit_packaging_weight_grams == 0.50"
            - "Producer.${p1_id}.annual_packaging_weight_kg == 5.502"
            - "Producer.${p1_id}.annual_packaging_weight_kg != 5.501 (the sum-then-round order is wrong)"
            - "Producer.${p1_id}.obligated_party_role == BRAND_OWNER and status == OBLIGATION_DETERMINED and determination_stale == false"

      - name: producer_weight_excludes_draft_skus_and_superseded_components
        claim_type: input_set_filtering
        grounds:
          - calculations.producer_annual_packaging_weight.input_set
          - endpoints.POST /epr/skus/{id}/revise-packaging
          - entities.Sku.fields.revision_count
        distinguishing_aspect: "A 100.000 kg DRAFT SKU never enters the rollup, and after revise-packaging the superseded 50.00 g component is excluded so the producer weight drops from 5.500 kg to 2.200 kg with determination_stale flipped to true."
        test_recipe:
          setup:
            - "One OBLIGATION_DETERMINED producer with the GLASS-mini SKU ACTIVE and a second SKU left DRAFT that would weigh 100.000 kg if counted."
          setup_api_calls:
            - call: "POST /epr/producers"
              payload: { legal_name: "Northlake Beverages LLC", brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 5000000, contact_email: "compliance@northlake.example" }
              as: ProgramRegulator
              captures: { p1_id: $.data.id }
            - call: "POST /epr/skus"
              payload: { producer_id: "${p1_id}", gtin: "00000000000017", name: "Sparkling Water 750ml", product_category: "BEVERAGE", units_sold_annual_estimate: 110 }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { sku_a_id: $.data.id }
            - call: "POST /epr/skus/${sku_a_id}/components"
              payload: { material_type: "GLASS", unit_weight_grams: 50.00, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus/${sku_a_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus"
              payload: { producer_id: "${p1_id}", gtin: "00000000000086", name: "Bulk Case Pack", product_category: "HOUSEHOLD_CHEM", units_sold_annual_estimate: 1000 }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { sku_d_id: $.data.id }
            - call: "POST /epr/skus/${sku_d_id}/components"
              payload: { material_type: "PLASTIC", unit_weight_grams: 100.00, recyclability_class: "NOT_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/producers/${p1_id}/determine-obligation"
              payload: {}
              as: ProgramRegulator
          trigger:
            - call: "POST /epr/skus/${sku_a_id}/revise-packaging"
              payload: { components: [{ material_type: "PLASTIC", unit_weight_grams: 20.00, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 40, is_reusable: false }], reason: "Lightweighted from glass to rPET" }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
          assert:
            - "Before the revision: Producer.${p1_id}.annual_packaging_weight_kg == 5.500 — the DRAFT SKU's 100.000 kg is excluded"
            - "Sku.${sku_d_id}.status == DRAFT and Sku.${sku_d_id}.unit_packaging_weight_grams == 100.00"
            - "After the revision: Sku.${sku_a_id}.unit_packaging_weight_grams == 20.00, revision_count == 1 and len(components) == 2 with exactly one component in status ACTIVE"
            - "After the revision: Producer.${p1_id}.annual_packaging_weight_kg == 2.200"
            - "After the revision: Producer.${p1_id}.determination_stale == true and status == OBLIGATION_DETERMINED"

      - name: eco_modulation_pcr_floor_step_cap_and_reuse_bonus_constants_applied
        claim_type: constants_applied
        grounds:
          - calculations.eco_modulation_adjustment.constants
          - entities.ReportLine.fields.eco_mod_detail
          - endpoints.POST /epr/reports/{id}/assess
        distinguishing_aspect: "A LIMITED component with 47% PCR and is_reusable true scores malus 20, pcr bonus floor(47/10)*5 = 20 capped at 25, reuse bonus 15, net -15 — so the 10.000 kg line prices at 10.000 * 42 * 0.85 = 357.0000 exact cents."
        test_recipe:
          setup:
            - "Program CA (BONUS_MALUS, PER_LINE_THEN_SUM), an ACTIVE registration with a PAID membership on a PLASTIC-rate schedule, and a SUBMITTED report with one line of 100 units of a 100.00 g PLASTIC SKU."
