              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_id}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 1, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-10T09:00:00Z", end_time: "2026-06-10T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt_id: $.data.id }
            - call: "GET /clinic/authorizations/${auth_id}"
              payload: {}
              as: ClinicAdmin
              captures: { v_req: $.data.version }
            - call: "POST /clinic/authorizations/${auth_id}/request-reauth"
              payload: { expected_authorization_version: "${v_req}" }
              as: ClinicAdmin
              captures: { v_now: $.data.version }
          trigger:
