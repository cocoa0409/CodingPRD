        distinguishing_aspect: "The write-off floor is temporal: at 89 days past due the write-off is rejected 409 ERR_WRITE_OFF_TOO_EARLY; at exactly 90 days past due it succeeds."
        test_recipe:
          setup: ["Alice's unpaid September invoice (due 2026-09-08) escalated to COLLECTIONS; clock at 2026-12-06 (89 days past due)."]
