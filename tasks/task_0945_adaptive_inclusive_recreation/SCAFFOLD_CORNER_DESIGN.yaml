            - "Enrollment.${e_edge}.enrollment_status == REQUESTED and funding_status == QUOTED"

  # =========================================================================
  # Errors
  # =========================================================================
  - section: errors
    instances:
      - name: global_write_gate_freezes_everything_then_restricted_blocks_only_money
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.OperatingPeriod.OPEN_to_FROZEN
          - state_machines.OperatingPeriod.FROZEN_to_OPEN
          - state_machines.OperatingPeriod.OPEN_to_RESTRICTED
          - errors[ERR_PERIOD_FROZEN]
          - errors[ERR_PERIOD_RESTRICTED]
        distinguishing_aspect: "Under FROZEN every mutating endpoint returns 409 ERR_PERIOD_FROZEN while the clock and posture endpoints still work; under RESTRICTED only the seven financial-write endpoints return 409 ERR_PERIOD_RESTRICTED and ordinary intake writes succeed."
        test_recipe:
          setup: ["One OperatingPeriod FY26 covering 2026-01-01..2026-12-31, currently OPEN, and the clock at its 2026-05-01 default."]
          setup_api_calls:
            - call: "POST /recreation/operating-periods"
              payload: { name: "FY26", starts_on: "2026-01-01", ends_on: "2026-12-31" }
              as: ProgramAdmin
              captures: { op: "$.data.id" }
          trigger:
            - call: "POST /recreation/operating-periods/${op}/posture"
              payload: { target_status: "FROZEN" }
              as: ProgramAdmin
              captures: { st_frozen: "$.data.status" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Blocked Person", date_of_birth: "2010-03-04", household_id: "HH-9", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { err_frozen: "$.data.error_id" }
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { clock_ok: "$.data.current_utc" }
            - call: "POST /recreation/operating-periods/${op}/posture"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /recreation/operating-periods/${op}/posture"
              payload: { target_status: "RESTRICTED" }
              as: ProgramAdmin
              captures: { st_restricted: "$.data.status" }
            - call: "POST /recreation/funding-sources"
              payload: { operating_period_id: "${op}", name: "Blocked Fund", source_kind: "GENERAL_FUND", priority_rank: 2, award_mode: "FLAT_CAP", award_pct_bp: 0, flat_award_cents: 1000, total_budget_cents: 1000 }
              as: FundingOfficer
              as_user_id: "officer-1"
              captures: { err_restricted: "$.data.error_id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Allowed Person", date_of_birth: "2010-03-04", household_id: "HH-8", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p_ok: "$.data.id" }
          assert:
            - "Under FROZEN the participant create returns HTTP 409 with data.error_id == ERR_PERIOD_FROZEN"
            - "Under FROZEN the clock call still succeeds and returns current_utc == '2026-05-02T00:00:00Z'"
            - "Under RESTRICTED the funding-source create returns HTTP 409 with data.error_id == ERR_PERIOD_RESTRICTED"
            - "Under RESTRICTED the participant create returns HTTP 201 and Participant.${p_ok}.status == INTAKE"
            - "OperatingPeriod.${op}.status == RESTRICTED at the end"

  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: missing_or_unknown_role_headers_return_unauthenticated
        claim_type: Role denial
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_MISSING_ROLE_HEADER]
          - errors[ERR_MISSING_USER_ID_HEADER]
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: "The first three ladder rungs fire in order on the same read endpoint: no X-User-Role gives ERR_MISSING_ROLE_HEADER, a present role with no X-User-ID gives ERR_MISSING_USER_ID_HEADER, and an undeclared role name gives ERR_UNKNOWN_ROLE — all 401."
        test_recipe:
          setup:
            - "One participant exists so the endpoint has data to return."
            - "Call 1 omits the X-User-Role header entirely; call 2 sends X-User-Role IntakeCoordinator but omits X-User-ID; call 3 sends X-User-Role SuperUser with a user id."
          setup_api_calls:
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id" }
          trigger:
            - call: "GET /recreation/participants"
              payload: {}
              as: IntakeCoordinator
              captures: { err_no_role: "$.data.error_id" }
            - call: "GET /recreation/participants"
              payload: {}
              as: IntakeCoordinator
              captures: { err_no_user: "$.data.error_id" }
            - call: "GET /recreation/participants"
              payload: {}
              as: SuperUser
              captures: { err_unknown: "$.data.error_id" }
          assert:
            - "Call 1 (no X-User-Role header) returns HTTP 401 with data.error_id == ERR_MISSING_ROLE_HEADER"
            - "Call 2 (X-User-Role IntakeCoordinator, no X-User-ID header) returns HTTP 401 with data.error_id == ERR_MISSING_USER_ID_HEADER"
            - "Call 3 (X-User-Role SuperUser) returns HTTP 401 with data.error_id == ERR_UNKNOWN_ROLE"

