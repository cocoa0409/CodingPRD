# =============================================================================
# Task 1928 — E-Rate Funding Application (schools & libraries)
# Scaffold seed tables: §1.0–§1.7
# =============================================================================

scenario: |
  1928. E-Rate Funding Application (schools & libraries): eligible services inventory & category one/two budget, competitive bidding posting & 28-day window, vendor selection with price as primary factor, discount rate calculation from student eligibility, funding request filing & PIA review, invoicing method & reimbursement, service substitution & appeal, document retention for audit

domain_name: e-rate-funding-application
api_prefix: /erate

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # government procurement: mandatory windows, price-primary rule, SoD, retention
  secondary_archetype: quota_allocation      # Category Two five-year budget pool per applicant
  complexity_layers:
    - optimistic_concurrency                 # OCC on FundingRequest.version (PIA response) and FundingRequestLine.version (substitution supersede)
    - derived_field_reconciliation           # C2 budget available/committed, line reimbursement ledger, pinned discount snapshot
    - rate_threshold_triggers                # discount matrix band edges; budget floor; window boundaries
    - scheduled_actions                      # logical clock drives 28-day bid window, filing window, appeal window, retention purge
  entity_topology: flat                      # peer entities joined by FK references; no nested URL ownership
  state_machine_shape: cyclic                # PIA review loop, invoice reject/resubmit loop, hold/release loop, denial->commit reversal
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # Appeal -> FundingRequest decision; InvoiceSubmission -> FundingRequestLine -> Contract
    - self_referential                       # ServiceSubstitution.supersedes_substitution_id chains substitutions
  role_model: segregation_of_duties          # bid selector != contract certifier; PIA reviewer != commitment officer
  consistency_model: immediate               # all side effects atomic within the triggering request

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: FundingCycle
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Funding year label, unique (e.g. FY2027)" }
      - { name: window_open_date, type: string, source: input, description: "First date (YYYY-MM-DD) a funding request may be certified; filing window is closed-interval [window_open_date, window_close_date]" }
      - { name: window_close_date, type: string, source: input, description: "Last date (YYYY-MM-DD) a funding request may be certified (inclusive)" }
      - { name: service_delivery_deadline, type: string, source: input, description: "YYYY-MM-DD; anchors invoice deadlines (+120 days) and document retention (+10 years)" }

  - name: EligibleService
    parent: null
    common_fields: true
    fields:
      - { name: funding_cycle_id, type: string, source: input, description: "FK -> FundingCycle.id; the cycle this inventory entry belongs to" }
      - { name: service_description, type: string, source: input, description: "Inventory entry text (e.g. 'Wireless Access Points')" }
      - { name: category, type: enum, source: input, description: "CATEGORY_ONE | CATEGORY_TWO" }
      - { name: service_type, type: enum, source: input, description: "INTERNET_ACCESS | DATA_TRANSMISSION | VOICE_SERVICE | INTERNAL_CONNECTIONS | BASIC_MAINTENANCE" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Billed entity name (school, district, or library)" }
      - { name: entity_type, type: enum, source: input, description: "SCHOOL | LIBRARY" }
      - { name: urban_rural, type: enum, source: input, description: "URBAN | RURAL" }
      - { name: student_count, type: integer, source: input, description: "Enrollment; required when entity_type=SCHOOL, must be > 0", constraints: "required iff SCHOOL" }
      - { name: square_feet, type: integer, source: input, description: "Building area; required when entity_type=LIBRARY, must be > 0", constraints: "required iff LIBRARY" }
      - { name: audit_hold_active, type: boolean, source: system, default: false, description: "When true, invoice approvals are blocked (compliance hold placed by Auditor)" }

  - name: NSLPSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: funding_cycle_id, type: string, source: input, description: "FK -> FundingCycle.id" }
      - { name: total_students, type: integer, source: input, description: "Total enrollment in snapshot; must be > 0" }
      - { name: free_lunch_eligible_students, type: integer, source: input, description: "Directly certified / NSLP-free students; 0 <= value <= total_students" }
      - { name: cep_participating, type: boolean, source: input, description: "When true, discount uses CEP variant of discount_rate_lookup" }
      - { name: cep_identified_student_pct, type: number, source: input, description: "Identified student percentage 0..100; required iff cep_participating is true", constraints: "required iff cep_participating" }
      - { name: effective_share_pct, type: number, source: computed, description: "Direct: round_half_up(100*free/total, 2). CEP: min(cep_identified_student_pct * 1.6, 100.00)" }

  - name: ApplicantUser
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; organization this user acts for" }
      - { name: display_name, type: string, source: input, description: "User display name" }
      - { name: function, type: enum, source: input, description: "COORDINATOR | CERTIFIER" }

  - name: ServiceProvider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor name" }
      - { name: spin, type: string, source: input, description: "Service provider identification number; unique", constraints: "unique" }

  - name: ProcurementPosting
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: funding_cycle_id, type: string, source: input, description: "FK -> FundingCycle.id" }
      - { name: category, type: enum, source: input, description: "CATEGORY_ONE | CATEGORY_TWO" }
      - { name: description, type: string, source: input, description: "Requested services narrative" }
      - { name: price_weight_pct, type: integer, source: input, description: "Evaluation weight of eligible price; must be >= every other factor weight (price is primary factor)", constraints: "0 < price_weight_pct <= 100; price_weight_pct >= max(other_factor_weights.weight_pct)" }
      - { name: other_factor_weights, type: array, source: input, default: "[]", description: "Array of { factor_name: string, weight_pct: integer } for non-price evaluation factors" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | WINDOW_CLOSED | AWARDED | CANCELLED" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock timestamp at publish; null while DRAFT" }
      - { name: window_close_at, type: datetime, source: computed, description: "posted_at + 28 days; bid window is half-open [posted_at, window_close_at)" }
      - { name: selected_bid_id, type: string, source: system, description: "Winning bid id set by select-winner; null until AWARDED" }
      - { name: selected_by_user_id, type: string, source: system, description: "X-User-ID of the ApplicantUser who ran select-winner; contract certifier must differ (segregation of duties)" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: posting_id, type: string, source: input, description: "FK -> ProcurementPosting.id" }
      - { name: service_provider_id, type: string, source: system, description: "FK -> ServiceProvider.id; taken from the calling VendorRepresentative identity, never from the request body" }
      - { name: eligible_price_cents, type: integer, source: input, description: "Price of eligible goods/services; must be > 0" }
      - { name: ineligible_price_cents, type: integer, source: input, default: 0, description: "Ineligible portion price; >= 0" }
      - { name: factor_scores, type: array, source: input, description: "Array of { factor_name, score } with score integer 0..100; must cover exactly the posting's other_factor_weights factor_name set" }
      - { name: total_score, type: number, source: computed, description: "winning_bid_score result; null until select-winner runs; 2 decimal places" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | QUALIFIED | DISQUALIFIED | SELECTED | NOT_SELECTED" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: service_provider_id, type: string, source: input, description: "FK -> ServiceProvider.id; must equal the winning bid's provider" }
      - { name: posting_id, type: string, source: input, description: "FK -> ProcurementPosting.id; posting must be AWARDED" }
      - { name: winning_bid_id, type: string, source: input, description: "FK -> Bid.id; must equal posting.selected_bid_id" }
      - { name: category, type: enum, source: input, description: "CATEGORY_ONE | CATEGORY_TWO; must equal posting.category" }
      - { name: total_eligible_cents, type: integer, source: input, description: "Contracted eligible cost ceiling; must equal winning bid's eligible_price_cents; > 0" }
      - { name: service_start_date, type: string, source: input, description: "YYYY-MM-DD; term start" }
      - { name: service_end_date, type: string, source: input, description: "YYYY-MM-DD; term end; must be >= service_start_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | CERTIFIED | TERMINATED" }
      - { name: certified_date, type: string, source: system, description: "YYYY-MM-DD of certification; null while DRAFT" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifier; must differ from posting.selected_by_user_id" }

  - name: FundingRequest
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: funding_cycle_id, type: string, source: input, description: "FK -> FundingCycle.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | PIA_REVIEW | INFORMATION_REQUESTED | COMMITTED | DENIED | CLOSED" }
      - { name: nslp_share_pct, type: number, source: computed, description: "Effective share pinned from the latest NSLPSnapshot at certify; null while DRAFT" }
      - { name: discount_rate_c1_pct, type: integer, source: computed, description: "Category One discount pinned at certify via discount_rate_lookup; null while DRAFT" }
      - { name: discount_rate_c2_pct, type: integer, source: computed, description: "Category Two discount pinned at certify; null while DRAFT" }
      - { name: committed_total_share_cents, type: integer, source: computed, description: "Sum of committed_share_cents over lines with status COMMITTED (per-line-rounded shares summed; never recomputed by summing pre-discount first)" }
      - { name: services_started, type: boolean, source: system, default: false, description: "Set true by service-start; gates invoice creation" }
      - { name: service_start_date, type: string, source: system, description: "YYYY-MM-DD set by service-start; null until then" }
      - { name: pia_reviewer_user_ids, type: array, source: system, default: "[]", description: "X-User-ID strings of PIAReviewer callers on begin-review / request-info; commitment officer must not be in this list (segregation of duties)" }
      - { name: decision_date, type: string, source: system, description: "YYYY-MM-DD of the commitment decision; anchors the 60-day appeal window; null until first decide" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of CommitmentOfficer who issued the latest decision" }

  - name: FundingRequestLine
    parent: null
    common_fields: true
    fields:
      - { name: funding_request_id, type: string, source: input, description: "FK -> FundingRequest.id" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract must be CERTIFIED, same applicant, same category as the referenced eligible service" }
      - { name: eligible_service_id, type: string, source: input, description: "FK -> EligibleService.id; rewritten by approved ServiceSubstitution" }
      - { name: category, type: enum, source: system, description: "CATEGORY_ONE | CATEGORY_TWO; copied from EligibleService at creation, immutable thereafter" }
      - { name: requested_pre_discount_cents, type: integer, source: input, description: "Requested eligible cost before discount; must be > 0" }
      - { name: committed_pre_discount_cents, type: integer, source: computed, description: "Capped committed cost: min(requested, C2 budget remaining at allocation turn); equals requested for CATEGORY_ONE; 0 until decided" }
      - { name: committed_share_cents, type: integer, source: computed, description: "round_half_up(committed_pre_discount_cents * pinned discount rate / 100) computed per line at decision; 0 until COMMITTED" }
      - { name: reimbursed_cents, type: integer, source: computed, default: 0, description: "Sum of approved_reimbursement_cents over PAID InvoiceSubmissions for this line" }
      - { name: remaining_reimbursable_cents, type: integer, source: computed, description: "committed_share_cents - reimbursed_cents while COMMITTED; forced to 0 on CANCELLED" }
      - { name: invoice_deadline_date, type: string, source: computed, description: "cycle.service_delivery_deadline + 120 days, set at commitment; submission allowed on the date itself (closed interval)" }
      - { name: status, type: enum, source: system, description: "PENDING | COMMITTED | DENIED | CANCELLED" }
      - { name: denial_reason, type: enum, source: system, description: "REQUEST_DENIED | INSUFFICIENT_BUDGET | CONTRACT_TERMINATED; null unless DENIED/CANCELLED" }

  - name: InvoiceSubmission
    parent: null
    common_fields: true
    fields:
      - { name: frn_line_id, type: string, source: input, description: "FK -> FundingRequestLine.id; line must be COMMITTED with services_started on its request" }
      - { name: method, type: enum, source: input, description: "BEAR (applicant paid vendor in full or part, claims reimbursement) | SPI (vendor discounted bills, claims USAC share)" }
      - { name: submitted_by_provider_id, type: string, source: system, description: "FK -> ServiceProvider.id; set from caller identity for SPI, null for BEAR" }
      - { name: gross_invoiced_cents, type: integer, source: input, description: "Pre-discount invoiced amount; must be > 0" }
      - { name: applicant_paid_cents, type: integer, source: input, description: "BEAR only: amount the applicant actually paid the vendor; required iff method=BEAR; forbidden when method=SPI; 0 < value <= gross_invoiced_cents", constraints: "required iff BEAR; forbidden iff SPI" }
      - { name: approved_reimbursement_cents, type: integer, source: computed, description: "Set at approve per invoice_reimbursement variant; null until APPROVED" }
      - { name: rejection_reason, type: string, source: system, description: "Processor-supplied reason text on REJECTED; null otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | PAID | REJECTED" }

  - name: ServiceSubstitution
    parent: null
    common_fields: true
    fields:
      - { name: frn_line_id, type: string, source: input, description: "FK -> FundingRequestLine.id; line must be COMMITTED" }
      - { name: from_eligible_service_id, type: string, source: system, description: "FK -> EligibleService.id; snapshot of the line's eligible_service_id at creation" }
      - { name: to_eligible_service_id, type: string, source: input, description: "FK -> EligibleService.id; must be in the same funding cycle inventory and same category as from-service" }
      - { name: supersedes_substitution_id, type: string, source: input, description: "FK -> ServiceSubstitution.id; optional; when present the referenced substitution must be APPROVED on the same line and flips to SUPERSEDED on approval of this one", constraints: "nullable" }
      - { name: reason, type: string, source: input, description: "Free-text justification", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | SUPERSEDED" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: funding_request_id, type: string, source: input, description: "FK -> FundingRequest.id; request must be DENIED" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds text" }
      - { name: filed_date, type: string, source: system, description: "YYYY-MM-DD from logical clock at filing; must be within closed interval [decision_date, decision_date + 60 days]" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | GRANTED | DENIED" }
      - { name: outcome_date, type: string, source: system, description: "YYYY-MM-DD of decide; null until terminal" }

  - name: RetainedDocument
    parent: null
    common_fields: true
    fields:
      - { name: subject_type, type: enum, source: system, description: "CONTRACT | FUNDING_REQUEST | INVOICE_SUBMISSION | SERVICE_SUBSTITUTION | APPEAL" }
      - { name: subject_id, type: string, source: system, description: "FK -> FundingRequest.id; polymorphic subject reference resolved by subject_type (also Contract, InvoiceSubmission, ServiceSubstitution, Appeal ids)" }
      - { name: funding_cycle_id, type: string, source: system, description: "FK -> FundingCycle.id; cycle resolved through the subject for retention anchoring" }
      - { name: document_kind, type: string, source: system, description: "e.g. CONTRACT_CERTIFICATION, COMMITMENT_DECISION, DISBURSEMENT_RECORD, SUBSTITUTION_APPROVAL, APPEAL_DECISION" }
      - { name: retained_until_date, type: string, source: computed, description: "cycle.service_delivery_deadline + 10 years; purge requires clock date strictly greater than this" }
      - { name: status, type: enum, source: system, description: "RETAINED | HELD | PURGED" }
      - { name: hold_start_date, type: string, source: system, description: "Audit hold interval start (YYYY-MM-DD); null when RETAINED", constraints: "nullable" }
      - { name: hold_end_date, type: string, source: system, description: "Audit hold interval end (YYYY-MM-DD, exclusive); hold containment is half-open [hold_start_date, hold_end_date)", constraints: "nullable" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: ProcurementPosting
    initial_state: DRAFT
    terminal_states: [CANCELLED, AWARDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /erate/procurement-postings/{id}/publish"
        actor: ApplicantCoordinator
        preconditions:
          - "posting.status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "posted_at = logical clock now; window_close_at = posted_at + 28 days; increments ProcurementPosting.version by 1"
      - from: POSTED
        to: WINDOW_CLOSED
        trigger: "POST /erate/procurement-postings/{id}/close-window"
        actor: ApplicantCoordinator
        preconditions:
          - "posting.status == POSTED (else ERR_INVALID_STATE_TRANSITION)"
          - "logical clock >= window_close_at (else ERR_BID_WINDOW_STILL_OPEN); 28-day window must have fully elapsed"
        side_effects: ["increments ProcurementPosting.version by 1"]
      - from: WINDOW_CLOSED
        to: AWARDED
        trigger: "POST /erate/procurement-postings/{id}/select-winner"
        actor: ApplicantCoordinator | ApplicantCertifier
        preconditions:
          - "posting.status == WINDOW_CLOSED (else ERR_INVALID_STATE_TRANSITION)"
          - "at least one Bid with status QUALIFIED exists for the posting (else ERR_NO_QUALIFIED_BIDS)"
        side_effects:
          - "winning_bid_score computed for every QUALIFIED bid; winner = highest total_score, tie -> lower eligible_price_cents, tie -> earlier Bid.created_at"
          - "winning bid status -> SELECTED; all other QUALIFIED bids -> NOT_SELECTED; SUBMITTED/DISQUALIFIED bids unchanged"
          - "posting.selected_bid_id and selected_by_user_id (caller's X-User-ID) stored; increments ProcurementPosting.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /erate/procurement-postings/{id}/cancel"
        actor: ApplicantCoordinator
        preconditions: ["posting.status == DRAFT"]
        side_effects: ["increments ProcurementPosting.version by 1"]
      - from: POSTED
        to: CANCELLED
        trigger: "POST /erate/procurement-postings/{id}/cancel"
        actor: ApplicantCoordinator
        preconditions: ["posting.status == POSTED"]
        side_effects:
          - "all SUBMITTED/QUALIFIED bids -> DISQUALIFIED (cascade down)"
          - "increments ProcurementPosting.version by 1"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [SELECTED, NOT_SELECTED, DISQUALIFIED]
    transitions:
      - from: SUBMITTED
        to: QUALIFIED
        trigger: "POST /erate/bids/{id}/qualify"
        actor: ApplicantCoordinator
        preconditions: ["bid.status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["increments Bid.version by 1"]
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: "POST /erate/bids/{id}/disqualify"
        actor: ApplicantCoordinator
        preconditions: ["bid.status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["increments Bid.version by 1"]
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /erate/bids/{id}/disqualify"
        actor: ApplicantCoordinator
        preconditions: ["bid.status == QUALIFIED; posting.status != AWARDED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["increments Bid.version by 1"]
      - from: QUALIFIED
        to: SELECTED
        trigger: "system (posting select-winner)"
        actor: system
        preconditions: ["bid is the winning_bid_score winner"]
        side_effects: []
      - from: QUALIFIED
        to: NOT_SELECTED
        trigger: "system (posting select-winner)"
        actor: system
        preconditions: ["bid is QUALIFIED but not the winner"]
        side_effects: []

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /erate/contracts/{id}/certify"
        actor: ApplicantCertifier
        preconditions:
          - "contract.status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID != contract.posting.selected_by_user_id (else ERR_SOD_CONTRACT_CERTIFIER — segregation of duties)"
          - "no other CERTIFIED contract with same (applicant_id, service_provider_id, category) has a term overlapping [service_start_date, service_end_date] under closed-interval semantics (shared endpoint counts as overlap; else ERR_CONTRACT_TERM_OVERLAP)"
        side_effects:
          - "certified_date = clock date; certified_by_user_id = X-User-ID; increments Contract.version by 1"
          - "RetainedDocument created (subject_type=CONTRACT, document_kind=CONTRACT_CERTIFICATION)"
      - from: CERTIFIED
        to: TERMINATED
        trigger: "POST /erate/contracts/{id}/terminate"
        actor: ApplicantCertifier
        preconditions: ["contract.status == CERTIFIED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "LINK1: every FundingRequestLine with contract_id == this contract and status in {PENDING, COMMITTED} -> CANCELLED (denial_reason=CONTRACT_TERMINATED)"
          - "LINK2 (caused by LINK1 line cancellation): for each cancelled CATEGORY_TWO line, Applicant.c2 committed ledger released by line.committed_pre_discount_cents; each affected FundingRequest.recommitted totals recomputed over remaining COMMITTED lines"
          - "LINK3 (caused by LINK2 recompute): any COMMITTED FundingRequest left with zero COMMITTED lines -> CLOSED"
          - "RetainedDocument created (subject_type=CONTRACT, document_kind=CONTRACT_TERMINATION); increments Contract.version by 1"

  - entity: FundingRequest
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /erate/funding-requests/{id}/certify"
        actor: ApplicantCertifier
        preconditions:
          - "request.status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "clock date in closed interval [cycle.window_open_date, cycle.window_close_date] (else ERR_FILING_WINDOW_CLOSED)"
          - "at least one PENDING line exists (else ERR_EMPTY_REQUEST)"
          - "an NSLPSnapshot exists for (applicant_id, funding_cycle_id) (else ERR_DISCOUNT_SNAPSHOT_MISSING)"
        side_effects:
          - "discount_rate_lookup runs on latest snapshot (by created_at): pins nslp_share_pct, discount_rate_c1_pct, discount_rate_c2_pct on the request"
          - "RetainedDocument created (document_kind=REQUEST_CERTIFICATION); increments FundingRequest.version by 1"
      - from: FILED
        to: PIA_REVIEW
        trigger: "POST /erate/funding-requests/{id}/begin-review"
        actor: PIAReviewer
        preconditions: ["request.status == FILED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "append caller X-User-ID to pia_reviewer_user_ids; increments FundingRequest.version by 1"
      - from: PIA_REVIEW
        to: INFORMATION_REQUESTED
        trigger: "POST /erate/funding-requests/{id}/request-info"
        actor: PIAReviewer
        preconditions: ["request.status == PIA_REVIEW (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["append caller X-User-ID to pia_reviewer_user_ids; increments FundingRequest.version by 1"]
      - from: INFORMATION_REQUESTED
        to: INFORMATION_REQUESTED
        trigger: "POST /erate/funding-requests/{id}/request-info"
        actor: PIAReviewer
        preconditions: ["request.status == INFORMATION_REQUESTED"]
        side_effects: ["follow-up information request in the same review round; append caller X-User-ID; increments FundingRequest.version by 1"]
        note: "self-loop is what makes a stale pia-response a true OCC race: state is unchanged while version advances"
      - from: INFORMATION_REQUESTED
        to: PIA_REVIEW
        trigger: "POST /erate/funding-requests/{id}/pia-responses"
        actor: ApplicantCoordinator
        preconditions:
          - "request.status == INFORMATION_REQUESTED (else ERR_INVALID_STATE_TRANSITION)"
          - "expected_request_version == request.version (else ERR_STALE_VERSION, 412 — OCC rule pia-response-stale-request)"
        side_effects: ["increments FundingRequest.version by 1"]
      - from: PIA_REVIEW
        to: COMMITTED
        trigger: "POST /erate/funding-requests/{id}/decide with outcome=COMMITTED"
        actor: CommitmentOfficer
        preconditions:
          - "request.status == PIA_REVIEW (else ERR_INVALID_STATE_TRANSITION; an outstanding INFORMATION_REQUESTED blocks decision)"
          - "X-User-ID not in request.pia_reviewer_user_ids (else ERR_SOD_COMMITMENT_OFFICER)"
        side_effects:
          - "frn_line_commitment runs per PENDING line; c2_budget_allocation_order reserves CATEGORY_TWO budget in line created_at ASC order"
          - "lines with capped amount 0 -> DENIED (denial_reason=INSUFFICIENT_BUDGET); others -> COMMITTED with committed_pre_discount_cents, committed_share_cents, remaining_reimbursable_cents, invoice_deadline_date set"
          - "committed_total_share_cents = sum of per-line committed_share_cents; decision_date = clock date; decided_by_user_id stored"
          - "RetainedDocument created (document_kind=COMMITMENT_DECISION); increments FundingRequest.version by 1"
      - from: PIA_REVIEW
        to: DENIED
        trigger: "POST /erate/funding-requests/{id}/decide with outcome=DENIED"
        actor: CommitmentOfficer
        preconditions:
          - "request.status == PIA_REVIEW"
          - "X-User-ID not in request.pia_reviewer_user_ids (else ERR_SOD_COMMITMENT_OFFICER)"
        side_effects:
          - "all PENDING lines -> DENIED (denial_reason=REQUEST_DENIED); decision_date = clock date"
          - "RetainedDocument created (document_kind=COMMITMENT_DECISION); increments FundingRequest.version by 1"
      - from: DENIED
        to: COMMITTED
        trigger: "system (Appeal decide with outcome=GRANTED)"
        actor: system
        preconditions: ["appeal on this request reached GRANTED"]
        side_effects:
          - "LINK1 of appeal cascade: request status flips; then per-line recommit (see Appeal machine)"
          - "increments FundingRequest.version by 1"
      - from: COMMITTED
        to: CLOSED
        trigger: "system (contract termination cascade leaves zero COMMITTED lines)"
        actor: system
        preconditions: ["all lines of this request are in {DENIED, CANCELLED}"]
        side_effects: ["increments FundingRequest.version by 1"]
      - from: COMMITTED
        to: COMMITTED
        trigger: "POST /erate/funding-requests/{id}/service-start"
        actor: ApplicantCoordinator
        preconditions:
          - "request.status == COMMITTED (else ERR_INVALID_STATE_TRANSITION)"
          - "services_started == false (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["services_started = true; service_start_date = clock date; increments FundingRequest.version by 1"]
        note: "self-loop marker transition: unlocks invoice creation for COMMITTED lines"

  - entity: FundingRequestLine
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: COMMITTED
        trigger: "system (FundingRequest decide COMMITTED or appeal-grant recommit)"
        actor: system
        preconditions: ["capped allocation > 0"]
        side_effects: ["commitment fields set; remaining_reimbursable_cents = committed_share_cents; increments FundingRequestLine.version by 1"]
      - from: PENDING
        to: DENIED
        trigger: "system (FundingRequest decide)"
        actor: system
        preconditions: []
        side_effects: ["denial_reason set; increments FundingRequestLine.version by 1"]
      - from: DENIED
        to: COMMITTED
        trigger: "system (appeal GRANTED recommit)"
        actor: system
        preconditions: ["recomputed capped allocation > 0 against current C2 availability"]
        side_effects: ["commitment fields recomputed against current budget; increments FundingRequestLine.version by 1"]
      - from: PENDING
        to: CANCELLED
        trigger: "system (contract termination)"
        actor: system
        preconditions: []
        side_effects: ["denial_reason=CONTRACT_TERMINATED; increments FundingRequestLine.version by 1"]
      - from: COMMITTED
        to: CANCELLED
        trigger: "system (contract termination)"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_reimbursable_cents forced to 0; reimbursed_cents preserved as historical"
          - "LINK2 trigger: applicant C2 committed ledger released by committed_pre_discount_cents (CATEGORY_TWO only); parent request totals recomputed"
          - "increments FundingRequestLine.version by 1"

  - entity: InvoiceSubmission
    initial_state: SUBMITTED
    terminal_states: [PAID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /erate/invoice-submissions/{id}/begin-review"
        actor: InvoiceProcessor
        preconditions: ["invoice.status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["increments InvoiceSubmission.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /erate/invoice-submissions/{id}/approve"
        actor: InvoiceProcessor
        preconditions:
          - "invoice.status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "applicant.audit_hold_active == false (else ERR_AUDIT_HOLD_ACTIVE — compliance check precedes fiscal check)"
          - "computed tentative reimbursement <= line.remaining_reimbursable_cents (else ERR_REIMBURSEMENT_EXCEEDS_REMAINING; equality allowed and drains remaining to exactly 0)"
        side_effects:
          - "approved_reimbursement_cents = invoice_reimbursement result for the invoice's method variant; increments InvoiceSubmission.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /erate/invoice-submissions/{id}/pay"
        actor: InvoiceProcessor
        preconditions: ["invoice.status == APPROVED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "line.reimbursed_cents += approved_reimbursement_cents; line.remaining_reimbursable_cents -= approved_reimbursement_cents (ledger sync; committed_share conserved)"
          - "increments FundingRequestLine.version by 1"
          - "RetainedDocument created (document_kind=DISBURSEMENT_RECORD); increments InvoiceSubmission.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /erate/invoice-submissions/{id}/reject"
        actor: InvoiceProcessor
        preconditions: ["invoice.status == UNDER_REVIEW"]
        side_effects: ["rejection_reason stored; no money fields change (compensation: approve was never reached or its reservation is void)"]
      - from: APPROVED
        to: REJECTED
        trigger: "POST /erate/invoice-submissions/{id}/reject"
        actor: InvoiceProcessor
        preconditions: ["invoice.status == APPROVED"]
        side_effects:
          - "approved_reimbursement_cents cleared to null (compensating action: approval revoked before any disbursement; line.reimbursed_cents and remaining_reimbursable_cents unchanged)"
          - "increments InvoiceSubmission.version by 1"
      - from: REJECTED
        to: UNDER_REVIEW
        trigger: "POST /erate/invoice-submissions/{id}/resubmit"
        actor: ApplicantCoordinator | VendorRepresentative
        preconditions:
          - "invoice.status == REJECTED (else ERR_INVALID_STATE_TRANSITION)"
          - "for SPI method: caller provider must equal submitted_by_provider_id; for BEAR: caller user must belong to the line's applicant"
        side_effects: ["rejection_reason cleared; increments InvoiceSubmission.version by 1 (review cycle loop)"]

  - entity: ServiceSubstitution
    initial_state: REQUESTED
    terminal_states: [DENIED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /erate/service-substitutions/{id}/approve"
        actor: ProgramAdmin
        preconditions: ["substitution.status == REQUESTED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "line.eligible_service_id = to_eligible_service_id (committed amounts unchanged)"
          - "if supersedes_substitution_id set: that substitution APPROVED -> SUPERSEDED"
          - "RetainedDocument created (document_kind=SUBSTITUTION_APPROVAL); increments FundingRequestLine.version by 1 and ServiceSubstitution.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /erate/service-substitutions/{id}/deny"
        actor: ProgramAdmin
        preconditions: ["substitution.status == REQUESTED"]
        side_effects: ["increments ServiceSubstitution.version by 1"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a later substitution with supersedes_substitution_id == this id is approved)"
        actor: system
        preconditions: []
        side_effects: ["increments ServiceSubstitution.version by 1"]

  - entity: Appeal
    initial_state: FILED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /erate/appeals/{id}/begin-review"
        actor: AppealOfficer
        preconditions: ["appeal.status == FILED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["increments Appeal.version by 1"]
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /erate/appeals/{id}/decide with outcome=GRANTED"
        actor: AppealOfficer
        preconditions: ["appeal.status == UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "LINK1: FundingRequest DENIED -> COMMITTED"
          - "LINK2 (caused by LINK1): each DENIED line re-runs frn_line_commitment + c2_budget_allocation_order against current availability in created_at ASC order; line -> COMMITTED or stays DENIED (INSUFFICIENT_BUDGET)"
          - "LINK3 (caused by LINK2): applicant C2 committed ledger increased by each recommitted line's committed_pre_discount_cents; request.committed_total_share_cents recomputed"
          - "outcome_date = clock date; RetainedDocument created (document_kind=APPEAL_DECISION); increments Appeal.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /erate/appeals/{id}/decide with outcome=DENIED"
        actor: AppealOfficer
        preconditions: ["appeal.status == UNDER_REVIEW"]
        side_effects: ["outcome_date = clock date; RetainedDocument created (document_kind=APPEAL_DECISION); increments Appeal.version by 1"]

  - entity: RetainedDocument
    initial_state: RETAINED
    terminal_states: [PURGED]
    transitions:
      - from: RETAINED
        to: HELD
        trigger: "POST /erate/retained-documents/{id}/place-hold"
        actor: Auditor
        preconditions:
          - "document.status == RETAINED (else ERR_INVALID_STATE_TRANSITION)"
          - "hold_end_date > hold_start_date (else ERR_INVALID_REQUEST)"
        side_effects: ["hold dates stored; increments RetainedDocument.version by 1"]
      - from: HELD
        to: RETAINED
        trigger: "POST /erate/retained-documents/{id}/release-hold"
        actor: Auditor
        preconditions: ["document.status == HELD (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["hold dates cleared to null; increments RetainedDocument.version by 1"]
      - from: RETAINED
        to: PURGED
        trigger: "POST /erate/retained-documents/{id}/purge"
        actor: Auditor
        preconditions:
          - "clock date strictly greater than retained_until_date (else ERR_DOCUMENT_NOT_PURGEABLE; purging ON retained_until_date is forbidden)"
          - "no audit hold covering clock date under half-open containment [hold_start_date, hold_end_date)"
        side_effects: ["increments RetainedDocument.version by 1"]
      - from: HELD
        to: PURGED
        trigger: "POST /erate/retained-documents/{id}/purge"
        actor: Auditor
        preconditions:
          - "clock date strictly greater than retained_until_date (else ERR_DOCUMENT_NOT_PURGEABLE)"
          - "clock date not in half-open interval [hold_start_date, hold_end_date) (else ERR_AUDIT_HOLD_ACTIVE; on hold_end_date itself purge is allowed)"
        side_effects: ["increments RetainedDocument.version by 1"]

# =============================================================================
# §1.2.1: Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: pia-response-stale-request
    parent_entity: FundingRequest
    write_endpoint: "POST /erate/funding-requests/{id}/pia-responses"
    occ_field: "expected_request_version"
    description: |
      Posting a PIA response against a FundingRequest whose version has advanced
      beyond the version the applicant last observed is rejected. This captures the
      case where the reviewer has issued a further information request (the
      INFORMATION_REQUESTED -> INFORMATION_REQUESTED self-loop, which legitimately
      advances request.version without changing status) and the applicant's
      response is therefore predicated on a stale review round.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: substitution-supersede-stale-line
    parent_entity: FundingRequestLine
    write_endpoint: "POST /erate/service-substitutions"
    occ_field: "expected_line_version"
    description: |
      Creating a ServiceSubstitution against a FundingRequestLine whose version has
      advanced beyond the version the coordinator last observed is rejected. This
      captures the case where a prior substitution on the same line has just been
      approved (legitimately rewriting line.eligible_service_id and advancing
      line.version) and the new substitution's from-service premise is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: discount_rate_lookup
    trigger: "FundingRequest certify (result pinned on request); GET budget-summary (computed live, not pinned)"
    algorithm: threshold
    formula: |
      share = snapshot.effective_share_pct            # 2-decimal percentage, HALF_UP
      band = first band with BAND_LO <= share < BAND_HI   # half-open; last band hi is 100 inclusive
      rate = MATRIX[category][applicant.urban_rural][band_index]
      Matrix rows are band indices 0..5 for bands [0,1) [1,20) [20,35) [35,50) [50,75) [75,100].
      Boundary precision: share exactly equal to a band lower bound enters that band
      (35.00 -> band index 3 -> C1_URBAN 60), one centile below does not (34.99 -> 50).
    input_set: "latest NSLPSnapshot for (applicant_id, funding_cycle_id) by created_at; ties impossible because created_at has millisecond precision and snapshots are created sequentially"
    constants:
      BAND_EDGES: "[0, 1, 20, 35, 50, 75, 100]"
      C1_URBAN: "[20, 40, 50, 60, 80, 90]"
      C1_RURAL: "[25, 50, 60, 70, 80, 90]"
      C2_URBAN: "[20, 40, 50, 60, 80, 85]"
      C2_RURAL: "[25, 50, 60, 70, 80, 85]"
      CEP_MULTIPLIER: 1.6
      CEP_SHARE_CAP: 100.00
    precision: "share: 2 decimal places, round_half_up; rate: integer percent"
    variants:
      - name: DIRECT_SNAPSHOT
        when: "latest snapshot has cep_participating == false"
        difference: "effective_share_pct = round_half_up(100 * free_lunch_eligible_students / total_students, 2)"
      - name: CEP_PROJECTED
        when: "latest snapshot has cep_participating == true"
        difference: "effective_share_pct = min(cep_identified_student_pct * 1.6, 100.00); same matrix afterwards — identical snapshot cohort yields a different share and therefore a different rate"

  - name: category_two_budget_cap
    trigger: "budget-summary read; FundingRequest decide (COMMITTED) and appeal-grant recommit"
    algorithm: aggregation
    formula: |
      if applicant.entity_type == SCHOOL:
        cap = max(C2_PER_STUDENT_CENTS * applicant.student_count, C2_FLOOR_CENTS)
      else:  # LIBRARY
        cap = max(C2_PER_SQFT_CENTS * applicant.square_feet, C2_FLOOR_CENTS)
      committed = sum(line.committed_pre_discount_cents for CATEGORY_TWO lines of this applicant
                      with line.status == COMMITTED)   # CANCELLED lines excluded (released)
      available = cap - committed                       # invariant: cap == committed + available
    input_set: "FundingRequestLine rows of this applicant: status == COMMITTED only; PENDING and DENIED never consume; CANCELLED released"
    constants:
      C2_PER_STUDENT_CENTS: 16700
      C2_PER_SQFT_CENTS: 450
      C2_FLOOR_CENTS: 2500000
    precision: "integer cents; no rounding"
    variants:
      - name: SCHOOL_ENROLLMENT
        when: "entity_type == SCHOOL"
        difference: "cap scales with student_count"
      - name: LIBRARY_SQUARE_FOOTAGE
        when: "entity_type == LIBRARY"
        difference: "cap scales with square_feet at a different per-unit rate; a 3000 sqft library (1,350,000) lands on the floor (2,500,000) while a 1000-student school (16,700,000) exceeds it"

  - name: winning_bid_score
    trigger: "ProcurementPosting select-winner"
    algorithm: weighted_scoring
    formula: |
      candidates = bids with status == QUALIFIED on this posting
      lowest_price = min(b.eligible_price_cents for b in candidates)
      for each candidate b:
        price_points = round_half_up(lowest_price / b.eligible_price_cents * posting.price_weight_pct, 2)
        factor_points = sum(w.weight_pct * score_of(b, w.factor_name) / 100
                            for w in posting.other_factor_weights)   # each term exact to 2dp
        b.total_score = round_half_up(price_points + factor_points, 2)
      winner = argmax(total_score); tie -> lower eligible_price_cents; tie -> earlier Bid.created_at
      # price is structurally primary: validation ERR_PRICE_NOT_PRIMARY forces
      # price_weight_pct >= max(other weights), and price_points falls quadratically
      # with relative price, so non-price factors can only break near-ties.
    input_set: "QUALIFIED bids only; SUBMITTED and DISQUALIFIED excluded from candidate set and from lowest_price"
    constants: {}
    precision: "2 decimal places, round_half_up per component and for the total"

  - name: frn_line_commitment
    trigger: "FundingRequest decide outcome=COMMITTED; appeal-grant recommit"
    algorithm: tiered_pricing
    formula: |
      for each PENDING (or recommitting DENIED) line:
        rate = request.discount_rate_c1_pct if line.category == CATEGORY_ONE else request.discount_rate_c2_pct
        capped_pre = min(line.requested_pre_discount_cents, c2_remaining_at_turn)  # C1: c2 rule not applied, capped_pre = requested
        committed_share_cents = round_half_up(capped_pre * rate / 100)             # integer cents, PER LINE
      request.committed_total_share_cents = sum(per-line committed_share_cents)
      # PINNED ROUNDING ORDER: per-line rounding first, then sum. Summing pre-discount
      # amounts and rounding once afterwards is FORBIDDEN (two 999-cent lines at 50%
      # give 500+500=1000 per-line vs 999 sum-first).
    input_set: "lines of the request in created_at ASC processing order; PENDING on initial decide, DENIED on appeal recommit"
    constants: {}
    precision: "integer cents, round_half_up applied per line before summation"

  - name: c2_budget_allocation_order
    trigger: "FundingRequest decide outcome=COMMITTED; appeal-grant recommit"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order pinned to break the circular look of
      # 'line commitment depends on budget remaining' vs 'budget remaining = cap - committed':
      remaining = category_two_budget_cap.available  (computed before this decision)
      process CATEGORY_TWO lines of the request in created_at ASC (millisecond timestamps;
      creation is sequential so no tie; UUID id never used):
        allocation = min(line.requested_pre_discount_cents, remaining)
        line.committed_pre_discount_cents = allocation
        remaining -= allocation          # decrement before the next line's turn
        if allocation == 0: line -> DENIED (INSUFFICIENT_BUDGET)
      CATEGORY_ONE lines are uncapped: committed_pre_discount_cents = requested (no budget draw).
    input_set: "CATEGORY_TWO lines of the request being decided, created_at ASC; C1 lines excluded from the waterfall"
    constants: {}
    precision: "integer cents"

  - name: invoice_reimbursement
    trigger: "InvoiceSubmission approve"
    algorithm: aggregation
    formula: |
      rate = pinned discount rate on the line's FundingRequest for the line's category
      BEAR: base = min(invoice.applicant_paid_cents, invoice.gross_invoiced_cents)
      SPI:  base = invoice.gross_invoiced_cents
      tentative = round_half_up(base * rate / 100)
      if tentative > line.remaining_reimbursable_cents: reject with ERR_REIMBURSEMENT_EXCEEDS_REMAINING
      approved_reimbursement_cents = tentative
    input_set: "the single invoice under approval; line.remaining_reimbursable_cents at approval time"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: BEAR_APPLICANT_PAID
        when: "method == BEAR"
        difference: "base is capped by applicant_paid_cents, so a partially paid bill (paid 30,000 of 40,000 gross at 50%) reimburses 15,000 — the applicant-fronted amount drives the claim"
      - name: SPI_VENDOR_DISCOUNTED
        when: "method == SPI"
        difference: "base is the full gross (vendor already discounted the bills), so the same 40,000 gross at 50% reimburses 20,000 — identical inputs, different result from the BEAR variant"

  - name: deadline_windows
    trigger: "bid creation; posting close-window; request certify; appeal filing; invoice creation"
    algorithm: interval_merge
    formula: |
      bid window:        [posted_at, posted_at + 28 days)              half-open; a bid at exactly posted_at+28d is LATE (ERR_BID_WINDOW_CLOSED)
      close-window gate: clock >= posted_at + 28 days                  (else ERR_BID_WINDOW_STILL_OPEN)
      filing window:     [cycle.window_open_date, cycle.window_close_date]  closed; certification ON window_close_date is allowed
      appeal window:     [request.decision_date, decision_date + 60 days]   closed; filing on day 60 is allowed, day 61 -> ERR_APPEAL_WINDOW_PASSED
      invoice window:    submission date <= line.invoice_deadline_date      closed; deadline = cycle.service_delivery_deadline + 120 days
      All date math uses the logical clock's UTC date; all arithmetic is calendar days.
    input_set: "logical clock plus the anchoring field on the relevant entity"
    constants:
      BID_WINDOW_DAYS: 28
      APPEAL_WINDOW_DAYS: 60
      INVOICE_WINDOW_DAYS: 120
    precision: "date granularity (YYYY-MM-DD) except bid window, which is timestamp-exact"

  - name: retention_expiry
    trigger: "RetainedDocument creation; purge evaluation"
    algorithm: threshold
    formula: |
      retained_until_date = cycle.service_delivery_deadline + 10 years (same month-day; leap-safe addition)
      purge allowed iff clock_date > retained_until_date          # strict; equality is NOT purgeable
      and not (hold_start_date <= clock_date < hold_end_date)   # half-open hold containment
    input_set: "single document under purge; cycle resolved via document.funding_cycle_id"
    constants:
      RETENTION_YEARS: 10
    precision: "date granularity"

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "caller role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "ownership scope: ApplicantCoordinator/ApplicantCertifier user's applicant_id must match the target resource's applicant chain (posting/contract/request/line/invoice/appeal); VendorRepresentative's provider must match the SPI invoice's contract provider (bids are open to any provider)"
    error_id: ERR_APPLICANT_ACCESS_DENIED | ERR_PROVIDER_ACCESS_DENIED
    http_status: 403
    applies_to: "all ApplicantCoordinator/ApplicantCertifier/VendorRepresentative endpoints except bid creation"
  - priority: 4
    category: existence
    check: "request shape and required fields: unknown/missing fields, bad enum members, non-positive amounts, malformed dates, missing conditional fields (applicant_paid_cents on BEAR, cep_identified_student_pct when cep_participating, student_count/square_feet per entity_type), applicant_paid_cents present on SPI"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "every id in path and body exists, validated left-to-right (path first, then body fields in declared order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 6
    category: state
    check: "target resource is in a from-state of the invoked transition (incl. contract CERTIFIED for line creation, line COMMITTED + request services_started for invoice creation, request DENIED for appeal filing, posting AWARDED for contract creation)"
    error_id: ERR_INVALID_STATE_TRANSITION | ERR_CONTRACT_NOT_CERTIFIED | ERR_LINE_NOT_COMMITTED | ERR_SERVICES_NOT_STARTED
    http_status: 409
    applies_to: all action endpoints and state-gated creates
  - priority: 7
    category: state
    check: "optimistic concurrency: expected_request_version / expected_line_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /erate/funding-requests/{id}/pia-responses; POST /erate/service-substitutions"
  - priority: 8
    category: business_safety
    check: "compliance gates: segregation of duties (contract certifier != bid selector; commitment officer not among the request's PIA reviewers); applicant audit hold blocks invoice approval"
    error_id: ERR_SOD_CONTRACT_CERTIFIER | ERR_SOD_COMMITMENT_OFFICER | ERR_AUDIT_HOLD_ACTIVE
    http_status: 409
    applies_to: "contract certify; funding-request decide; invoice approve"
  - priority: 9
    category: business_temporal
    check: "window and deadline rules from deadline_windows: bid inside half-open 28-day window; close-window only after elapse; certify inside closed filing window; appeal inside closed 60-day window; invoice on/before closed invoice deadline"
    error_id: ERR_BID_WINDOW_CLOSED | ERR_BID_WINDOW_STILL_OPEN | ERR_FILING_WINDOW_CLOSED | ERR_APPEAL_WINDOW_PASSED | ERR_INVOICE_DEADLINE_PASSED
    http_status: 409
    applies_to: "bid create; posting close-window; request certify; appeal create; invoice create"
  - priority: 10
    category: business_constraint
    check: "structural business rules: price_weight_pct >= every other factor weight (price primary); contract term closed-interval overlap on (applicant, provider, category); at least one QUALIFIED bid to award; substitution target eligible in cycle inventory; substitution preserves category; at most one non-terminal Appeal per request; request has >= 1 line at certify; purge timing"
    error_id: ERR_PRICE_NOT_PRIMARY | ERR_CONTRACT_TERM_OVERLAP | ERR_NO_QUALIFIED_BIDS | ERR_SERVICE_NOT_ELIGIBLE | ERR_SUBSTITUTION_CATEGORY_MISMATCH | ERR_APPEAL_ALREADY_ACTIVE | ERR_EMPTY_REQUEST | ERR_DOCUMENT_NOT_PURGEABLE
    http_status: 409
    applies_to: "posting create; contract create/certify; select-winner; substitution create; appeal create; request certify; document purge"
  - priority: 11
    category: business_referential
    check: "cross-entity FK consistency: winning_bid_id == posting.selected_bid_id; contract provider == winning bid provider; contract category == posting category; line contract applicant == request applicant; line service in request cycle; NSLP snapshot exists for (applicant, cycle); substitution supersedes target belongs to same line"
    error_id: ERR_BID_NOT_AWARDED | ERR_CROSS_ENTITY_MISMATCH | ERR_DISCOUNT_SNAPSHOT_MISSING
    http_status: 409
    applies_to: "contract create; line create; request certify; substitution create"
  - priority: 12
    category: business_fiscal
    check: "money checks last: contract eligible-cost capacity across its lines; invoice tentative reimbursement within remaining_reimbursable_cents"
    error_id: ERR_CONTRACT_CAPACITY_EXCEEDED | ERR_REIMBURSEMENT_EXCEEDS_REMAINING
    http_status: 409
    applies_to: "line create; invoice approve"

# =============================================================================
# §1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/erate/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. All window/deadline/retention rules read this clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["clock advanced; no entity mutations fire automatically"]

  # --- FundingCycle ---
  - method: POST
    path: "/erate/funding-cycles"
    description: "Create a funding cycle"
    roles: [ProgramAdmin]
    code: 201
    input: [label, window_open_date, window_close_date, service_delivery_deadline]
    output: FundingCycle
    side_effects: ["ERR_INVALID_REQUEST if window_close_date < window_open_date"]
  - method: GET
    path: "/erate/funding-cycles"
    description: "List funding cycles (paginated)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "FundingCycle[]"
    side_effects: []
  - method: GET
    path: "/erate/funding-cycles/{id}"
    description: "Get a funding cycle"
    roles: [Any]
    code: 200
    input: []
    output: FundingCycle
    side_effects: []

  # --- EligibleService (eligible services inventory per cycle) ---
  - method: POST
    path: "/erate/eligible-services"
    description: "Add an eligible services inventory entry to a cycle"
    roles: [ProgramAdmin]
    code: 201
    input: [funding_cycle_id, service_description, category, service_type]
    output: EligibleService
    side_effects: []
  - method: GET
    path: "/erate/eligible-services"
    description: "List eligible services; FK reverse lookup by funding_cycle_id"
    roles: [Any]
    code: 200
    input: ["funding_cycle_id?", "category?", "limit?", "offset?"]
    output: "EligibleService[]"
    side_effects: []
  - method: GET
    path: "/erate/eligible-services/{id}"
    description: "Get an eligible service"
    roles: [Any]
    code: 200
    input: []
    output: EligibleService
    side_effects: []

  # --- Applicant ---
  - method: POST
    path: "/erate/applicants"
    description: "Register an applicant (school or library)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, entity_type, urban_rural, "student_count?", "square_feet?"]
    output: Applicant
    side_effects: ["audit_hold_active=false; ERR_INVALID_REQUEST if entity_type=SCHOOL without student_count or LIBRARY without square_feet"]
  - method: GET
    path: "/erate/applicants"
    description: "List applicants (paginated)"
    roles: [Any]
    code: 200
    input: ["entity_type?", "limit?", "offset?"]
    output: "Applicant[]"
    side_effects: []
  - method: GET
    path: "/erate/applicants/{id}"
    description: "Get an applicant"
    roles: [Any]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: "/erate/applicants/{id}/budget-summary"
    description: "Computed read: live C2 budget and discount rates for a cycle (latest snapshot; ERR_DISCOUNT_SNAPSHOT_MISSING when none)"
    roles: [Any]
    code: 200
    input: [funding_cycle_id]
    output: { c2_cap_cents: integer, c2_committed_cents: integer, c2_available_cents: integer, discount_rate_c1_pct: integer, discount_rate_c2_pct: integer, nslp_share_pct: number }
    side_effects: ["runs category_two_budget_cap and discount_rate_lookup live"]
  - method: POST
    path: "/erate/applicants/{id}/set-audit-hold"
    description: "Place or lift an applicant-level audit hold (blocks invoice approvals)"
    roles: [Auditor]
    code: 200
    input: [active]
    output: Applicant
    side_effects: ["audit_hold_active := active; increments Applicant.version by 1"]

  # --- NSLPSnapshot ---
  - method: POST
    path: "/erate/nslp-snapshots"
    description: "Record an NSLP/CEP eligibility snapshot for an applicant in a cycle; latest by created_at is effective"
    roles: [ProgramAdmin]
    code: 201
    input: [applicant_id, funding_cycle_id, total_students, free_lunch_eligible_students, cep_participating, "cep_identified_student_pct?"]
    output: NSLPSnapshot
    side_effects: ["effective_share_pct computed per discount_rate_lookup variant; ERR_INVALID_REQUEST when free_lunch_eligible_students > total_students or cep_participating without cep_identified_student_pct"]
  - method: GET
    path: "/erate/nslp-snapshots"
    description: "List snapshots; FK reverse lookup by applicant_id / funding_cycle_id"
    roles: [Any]
    code: 200
    input: ["applicant_id?", "funding_cycle_id?", "limit?", "offset?"]
    output: "NSLPSnapshot[]"
    side_effects: []
  - method: GET
    path: "/erate/nslp-snapshots/{id}"
    description: "Get a snapshot"
    roles: [Any]
    code: 200
    input: []
    output: NSLPSnapshot
    side_effects: []

  # --- ApplicantUser ---
  - method: POST
    path: "/erate/applicant-users"
    description: "Provision an applicant user (coordinator or certifier function)"
    roles: [ProgramAdmin]
    code: 201
    input: [applicant_id, display_name, function]
    output: ApplicantUser
    side_effects: []
  - method: GET
    path: "/erate/applicant-users"
    description: "List applicant users; FK reverse lookup by applicant_id"
    roles: [Any]
    code: 200
    input: ["applicant_id?", "limit?", "offset?"]
    output: "ApplicantUser[]"
    side_effects: []
  - method: GET
    path: "/erate/applicant-users/{id}"
    description: "Get an applicant user"
    roles: [Any]
    code: 200
    input: []
    output: ApplicantUser
    side_effects: []

  # --- ServiceProvider ---
  - method: POST
    path: "/erate/service-providers"
    description: "Register a service provider (vendor)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, spin]
    output: ServiceProvider
    side_effects: ["ERR_INVALID_REQUEST when spin already registered (unique)"]
  - method: GET
    path: "/erate/service-providers"
    description: "List service providers (paginated)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceProvider[]"
    side_effects: []
  - method: GET
    path: "/erate/service-providers/{id}"
    description: "Get a service provider"
    roles: [Any]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: []

  # --- ProcurementPosting (competitive bidding) ---
  - method: POST
    path: "/erate/procurement-postings"
    description: "Create a competitive bidding posting (Form 470 equivalent); starts DRAFT"
    roles: [ApplicantCoordinator]
    code: 201
    input: [applicant_id, funding_cycle_id, category, description, price_weight_pct, "other_factor_weights?"]
    output: ProcurementPosting
    side_effects: ["ERR_PRICE_NOT_PRIMARY when price_weight_pct < any other factor weight_pct"]
  - method: GET
    path: "/erate/procurement-postings"
    description: "List postings; FK reverse lookup by applicant_id / funding_cycle_id"
    roles: [Any]
    code: 200
    input: ["applicant_id?", "funding_cycle_id?", "status?", "limit?", "offset?"]
    output: "ProcurementPosting[]"
    side_effects: []
  - method: GET
    path: "/erate/procurement-postings/{id}"
    description: "Get a posting"
    roles: [Any]
    code: 200
    input: []
    output: ProcurementPosting
    side_effects: []
  - method: POST
    path: "/erate/procurement-postings/{id}/publish"
    description: "Publish posting; opens the half-open 28-day bid window [posted_at, posted_at+28d)"
    roles: [ApplicantCoordinator]
    code: 200
    input: []
    output: ProcurementPosting
    side_effects: ["status DRAFT->POSTED; posted_at=clock; window_close_at computed; increments ProcurementPosting.version by 1"]
  - method: POST
    path: "/erate/procurement-postings/{id}/close-window"
    description: "Close the bid window after it fully elapses"
    roles: [ApplicantCoordinator]
    code: 200
    input: []
    output: ProcurementPosting
    side_effects: ["status POSTED->WINDOW_CLOSED; ERR_BID_WINDOW_STILL_OPEN before window_close_at; increments ProcurementPosting.version by 1"]
  - method: POST
    path: "/erate/procurement-postings/{id}/cancel"
    description: "Cancel a DRAFT or POSTED posting"
    roles: [ApplicantCoordinator]
    code: 200
    input: []
    output: ProcurementPosting
    side_effects: ["status -> CANCELLED; SUBMITTED/QUALIFIED bids cascade to DISQUALIFIED; increments ProcurementPosting.version by 1"]
  - method: POST
    path: "/erate/procurement-postings/{id}/select-winner"
    description: "Evaluate QUALIFIED bids and award; winner per winning_bid_score selector (score desc, price asc, created_at asc)"
    roles: [ApplicantCoordinator, ApplicantCertifier]
    code: 200
    input: []
    output: ProcurementPosting
    side_effects: ["status WINDOW_CLOSED->AWARDED; winner SELECTED, other QUALIFIED -> NOT_SELECTED; selected_bid_id + selected_by_user_id stored; ERR_NO_QUALIFIED_BIDS on empty candidate pool; increments ProcurementPosting.version by 1"]

  # --- Bid ---
  - method: POST
    path: "/erate/bids"
    description: "Vendor submits a bid against a POSTED posting within the half-open window"
    roles: [VendorRepresentative]
    code: 201
    input: [posting_id, eligible_price_cents, "ineligible_price_cents?", factor_scores]
    output: Bid
    side_effects: ["service_provider_id taken from caller identity; ERR_BID_WINDOW_CLOSED when clock >= window_close_at (exactly at close is late); ERR_INVALID_REQUEST when factor_scores do not cover the posting's factor set"]
  - method: GET
    path: "/erate/bids"
    description: "List bids; FK reverse lookup by posting_id / service_provider_id"
    roles: [Any]
    code: 200
    input: ["posting_id?", "service_provider_id?", "status?", "limit?", "offset?"]
    output: "Bid[]"
    side_effects: []
  - method: GET
    path: "/erate/bids/{id}"
    description: "Get a bid"
    roles: [Any]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: POST
    path: "/erate/bids/{id}/qualify"
    description: "Mark a SUBMITTED bid as qualified for evaluation"
    roles: [ApplicantCoordinator]
    code: 200
    input: []
    output: Bid
    side_effects: ["status SUBMITTED->QUALIFIED; increments Bid.version by 1"]
  - method: POST
    path: "/erate/bids/{id}/disqualify"
    description: "Disqualify a SUBMITTED or QUALIFIED bid (not after award)"
    roles: [ApplicantCoordinator]
    code: 200
    input: ["reason?"]
    output: Bid
    side_effects: ["status -> DISQUALIFIED; increments Bid.version by 1"]

  # --- Contract ---
  - method: POST
    path: "/erate/contracts"
    description: "Create a DRAFT contract from an awarded posting and its winning bid"
    roles: [ApplicantCoordinator]
    code: 201
    input: [applicant_id, service_provider_id, posting_id, winning_bid_id, category, total_eligible_cents, service_start_date, service_end_date]
    output: Contract
    side_effects: ["ERR_BID_NOT_AWARDED when winning_bid_id != posting.selected_bid_id; ERR_CROSS_ENTITY_MISMATCH on provider/category mismatch; ERR_CONTRACT_TERM_OVERLAP vs CERTIFIED contracts with same (applicant, provider, category), closed-interval semantics; ERR_INVALID_REQUEST when total_eligible_cents != winning bid eligible_price_cents or end < start"]
  - method: GET
    path: "/erate/contracts"
    description: "List contracts; FK reverse lookup by applicant_id / service_provider_id / posting_id"
    roles: [Any]
    code: 200
    input: ["applicant_id?", "service_provider_id?", "posting_id?", "winning_bid_id?", "status?", "limit?", "offset?"]
    output: "Contract[]"
    side_effects: []
  - method: GET
    path: "/erate/contracts/{id}"
    description: "Get a contract"
    roles: [Any]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: POST
    path: "/erate/contracts/{id}/certify"
    description: "Certify a DRAFT contract; certifier must differ from the bid selector (segregation of duties)"
    roles: [ApplicantCertifier]
    code: 200
    input: []
    output: Contract
    side_effects: ["status DRAFT->CERTIFIED; certified_date/certified_by_user_id set; re-checks closed-interval term overlap; RetainedDocument created; increments Contract.version by 1"]
  - method: POST
    path: "/erate/contracts/{id}/terminate"
    description: "Terminate a CERTIFIED contract; cascades to lines, budget release, and request closure"
    roles: [ApplicantCertifier]
    code: 200
    input: ["reason?"]
    output: Contract
    side_effects: ["status CERTIFIED->TERMINATED; LINK1 lines -> CANCELLED; LINK2 C2 budget released + request totals recomputed; LINK3 empty COMMITTED requests -> CLOSED; RetainedDocument created; increments Contract.version by 1"]

  # --- FundingRequest (Form 471 equivalent) ---
  - method: POST
    path: "/erate/funding-requests"
    description: "Create a DRAFT funding request for an applicant in a cycle"
    roles: [ApplicantCoordinator]
    code: 201
    input: [applicant_id, funding_cycle_id]
    output: FundingRequest
    side_effects: ["status=DRAFT; services_started=false"]
  - method: GET
    path: "/erate/funding-requests"
    description: "List funding requests; FK reverse lookup by applicant_id / funding_cycle_id"
    roles: [Any]
    code: 200
    input: ["applicant_id?", "funding_cycle_id?", "status?", "limit?", "offset?"]
    output: "FundingRequest[]"
    side_effects: []
  - method: GET
    path: "/erate/funding-requests/{id}"
    description: "Get a funding request"
    roles: [Any]
    code: 200
    input: []
    output: FundingRequest
    side_effects: []
  - method: POST
    path: "/erate/funding-requests/{id}/certify"
    description: "Certify and file the request; pins discount rates from the latest NSLP snapshot"
    roles: [ApplicantCertifier]
    code: 200
    input: []
    output: FundingRequest
    side_effects: ["status DRAFT->FILED; discount_rate_lookup pins nslp_share_pct/discount_rate_c1_pct/discount_rate_c2_pct; ERR_FILING_WINDOW_CLOSED outside [window_open_date, window_close_date]; ERR_EMPTY_REQUEST with zero lines; ERR_DISCOUNT_SNAPSHOT_MISSING without snapshot; RetainedDocument created; increments FundingRequest.version by 1"]
  - method: POST
    path: "/erate/funding-requests/{id}/begin-review"
    description: "PIA reviewer opens review of a FILED request"
    roles: [PIAReviewer]
    code: 200
    input: []
    output: FundingRequest
    side_effects: ["status FILED->PIA_REVIEW; caller X-User-ID appended to pia_reviewer_user_ids; increments FundingRequest.version by 1"]
  - method: POST
    path: "/erate/funding-requests/{id}/request-info"
    description: "PIA reviewer issues an information request (allowed from PIA_REVIEW and again from INFORMATION_REQUESTED as a follow-up)"
    roles: [PIAReviewer]
    code: 200
    input: [info_request_text]
    output: FundingRequest
    side_effects: ["status -> INFORMATION_REQUESTED (self-loop on follow-up); caller X-User-ID appended to pia_reviewer_user_ids; increments FundingRequest.version by 1"]
  - method: POST
    path: "/erate/funding-requests/{id}/pia-responses"
    description: "Applicant responds to an information request; OCC-guarded on request version"
    roles: [ApplicantCoordinator]
    code: 200
    input: [response_text, expected_request_version]
    output: FundingRequest
    side_effects: ["status INFORMATION_REQUESTED->PIA_REVIEW; ERR_STALE_VERSION when expected_request_version != current version; increments FundingRequest.version by 1"]
  - method: POST
    path: "/erate/funding-requests/{id}/decide"
    description: "Commitment officer issues the funding decision; runs per-line commitment and C2 waterfall on COMMITTED"
    roles: [CommitmentOfficer]
    code: 200
    input: [outcome, "rationale?"]
    output: FundingRequest
    side_effects: ["status PIA_REVIEW->COMMITTED|DENIED; ERR_SOD_COMMITMENT_OFFICER when caller is in pia_reviewer_user_ids; frn_line_commitment + c2_budget_allocation_order run on COMMITTED; decision_date/decided_by_user_id set; RetainedDocument created; increments FundingRequest.version by 1"]
  - method: POST
    path: "/erate/funding-requests/{id}/service-start"
    description: "Record that services have started (Form 486 equivalent); unlocks invoicing"
    roles: [ApplicantCoordinator]
    code: 200
    input: []
    output: FundingRequest
    side_effects: ["services_started=true; service_start_date=clock date; ERR_INVALID_STATE_TRANSITION unless COMMITTED and not already started; increments FundingRequest.version by 1"]

  # --- FundingRequestLine ---
  - method: POST
    path: "/erate/funding-request-lines"
    description: "Add a funding request line (FRN line) referencing a certified contract and an eligible service"
    roles: [ApplicantCoordinator]
    code: 201
    input: [funding_request_id, contract_id, eligible_service_id, requested_pre_discount_cents]
    output: FundingRequestLine
    side_effects: ["status=PENDING; category copied from EligibleService; ERR_INVALID_STATE_TRANSITION unless request is DRAFT; ERR_CONTRACT_NOT_CERTIFIED unless contract CERTIFIED; ERR_CROSS_ENTITY_MISMATCH on applicant/category/cycle mismatch; ERR_CONTRACT_CAPACITY_EXCEEDED when sum of non-CANCELLED line requests would exceed contract.total_eligible_cents"]
  - method: GET
    path: "/erate/funding-request-lines"
    description: "List FRN lines; FK reverse lookup by funding_request_id / contract_id / eligible_service_id"
    roles: [Any]
    code: 200
    input: ["funding_request_id?", "contract_id?", "eligible_service_id?", "status?", "limit?", "offset?"]
    output: "FundingRequestLine[]"
    side_effects: []
  - method: GET
    path: "/erate/funding-request-lines/{id}"
    description: "Get an FRN line"
    roles: [Any]
    code: 200
    input: []
    output: FundingRequestLine
    side_effects: []

  # --- InvoiceSubmission (BEAR / SPI) ---
  - method: POST
    path: "/erate/invoice-submissions"
    description: "Submit an invoice claim against a COMMITTED line with services started"
    roles: [ApplicantCoordinator, VendorRepresentative]
    code: 201
    input: [frn_line_id, method, gross_invoiced_cents, "applicant_paid_cents?"]
    output: InvoiceSubmission
    side_effects: ["status=SUBMITTED; BEAR only by the applicant's coordinator (applicant_paid_cents required); SPI only by the contract's provider representative (submitted_by_provider_id set from caller); ERR_LINE_NOT_COMMITTED / ERR_SERVICES_NOT_STARTED / ERR_INVOICE_DEADLINE_PASSED / ERR_PROVIDER_ACCESS_DENIED / ERR_APPLICANT_ACCESS_DENIED / ERR_INVALID_REQUEST"]
  - method: GET
    path: "/erate/invoice-submissions"
    description: "List invoice submissions; FK reverse lookup by frn_line_id"
    roles: [Any]
    code: 200
    input: ["frn_line_id?", "submitted_by_provider_id?", "status?", "method?", "limit?", "offset?"]
    output: "InvoiceSubmission[]"
    side_effects: []
  - method: GET
    path: "/erate/invoice-submissions/{id}"
    description: "Get an invoice submission"
    roles: [Any]
    code: 200
    input: []
    output: InvoiceSubmission
    side_effects: []
  - method: POST
    path: "/erate/invoice-submissions/{id}/begin-review"
    description: "Processor opens review of a SUBMITTED invoice"
    roles: [InvoiceProcessor]
    code: 200
    input: []
    output: InvoiceSubmission
    side_effects: ["status SUBMITTED->UNDER_REVIEW; increments InvoiceSubmission.version by 1"]
  - method: POST
    path: "/erate/invoice-submissions/{id}/approve"
    description: "Approve an invoice; computes reimbursement per method variant"
    roles: [InvoiceProcessor]
    code: 200
    input: []
    output: InvoiceSubmission
    side_effects: ["status UNDER_REVIEW->APPROVED; invoice_reimbursement computes approved_reimbursement_cents; ERR_AUDIT_HOLD_ACTIVE (safety, before fiscal); ERR_REIMBURSEMENT_EXCEEDS_REMAINING when tentative > remaining (equality allowed); increments InvoiceSubmission.version by 1"]
  - method: POST
    path: "/erate/invoice-submissions/{id}/pay"
    description: "Disburse an APPROVED invoice; moves the line reimbursement ledger"
    roles: [InvoiceProcessor]
    code: 200
    input: []
    output: InvoiceSubmission
    side_effects: ["status APPROVED->PAID; line.reimbursed_cents += approved; line.remaining_reimbursable_cents -= approved; RetainedDocument created; increments InvoiceSubmission.version and FundingRequestLine.version by 1"]
  - method: POST
    path: "/erate/invoice-submissions/{id}/reject"
    description: "Reject an invoice under review or revoke an un-paid approval (compensating action)"
    roles: [InvoiceProcessor]
    code: 200
    input: [rejection_reason]
    output: InvoiceSubmission
    side_effects: ["status UNDER_REVIEW|APPROVED -> REJECTED; approved_reimbursement_cents cleared; line ledger unchanged; increments InvoiceSubmission.version by 1"]
  - method: POST
    path: "/erate/invoice-submissions/{id}/resubmit"
    description: "Resubmit a REJECTED invoice for review (review cycle loop)"
    roles: [ApplicantCoordinator, VendorRepresentative]
    code: 200
    input: []
    output: InvoiceSubmission
    side_effects: ["status REJECTED->UNDER_REVIEW; rejection_reason cleared; ownership re-checked (BEAR applicant / SPI provider); increments InvoiceSubmission.version by 1"]

  # --- ServiceSubstitution ---
  - method: POST
    path: "/erate/service-substitutions"
    description: "Request a service substitution on a COMMITTED line; OCC-guarded on line version; supports supersede chaining"
    roles: [ApplicantCoordinator]
    code: 201
    input: [frn_line_id, to_eligible_service_id, expected_line_version, "supersedes_substitution_id?", "reason?"]
    output: ServiceSubstitution
    side_effects: ["status=REQUESTED; from_eligible_service_id snapshotted from line; ERR_STALE_VERSION on expected_line_version mismatch; ERR_SERVICE_NOT_ELIGIBLE / ERR_SUBSTITUTION_CATEGORY_MISMATCH / ERR_CROSS_ENTITY_MISMATCH (supersede target must be APPROVED on same line); increments FundingRequestLine.version by 1"]
  - method: GET
    path: "/erate/service-substitutions"
    description: "List substitutions; FK reverse lookup by frn_line_id / supersedes_substitution_id"
    roles: [Any]
    code: 200
    input: ["frn_line_id?", "supersedes_substitution_id?", "from_eligible_service_id?", "to_eligible_service_id?", "status?", "limit?", "offset?"]
    output: "ServiceSubstitution[]"
    side_effects: []
  - method: GET
    path: "/erate/service-substitutions/{id}"
    description: "Get a substitution"
    roles: [Any]
    code: 200
    input: []
    output: ServiceSubstitution
    side_effects: []
  - method: POST
    path: "/erate/service-substitutions/{id}/approve"
    description: "Approve a substitution; rewrites the line's eligible service and supersedes any chained predecessor"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ServiceSubstitution
    side_effects: ["status REQUESTED->APPROVED; line.eligible_service_id := to_eligible_service_id; superseded substitution -> SUPERSEDED; RetainedDocument created; increments ServiceSubstitution.version and FundingRequestLine.version by 1"]
  - method: POST
    path: "/erate/service-substitutions/{id}/deny"
    description: "Deny a substitution"
    roles: [ProgramAdmin]
    code: 200
    input: ["denial_reason?"]
    output: ServiceSubstitution
    side_effects: ["status REQUESTED->DENIED; increments ServiceSubstitution.version by 1"]

  # --- Appeal ---
  - method: POST
    path: "/erate/appeals"
    description: "File an appeal of a DENIED funding request within the closed 60-day window"
    roles: [ApplicantCoordinator]
    code: 201
    input: [funding_request_id, grounds]
    output: Appeal
    side_effects: ["status=FILED; filed_date=clock date; ERR_INVALID_STATE_TRANSITION unless request DENIED; ERR_APPEAL_WINDOW_PASSED after decision_date + 60 days (day 60 itself allowed); ERR_APPEAL_ALREADY_ACTIVE when a FILED/UNDER_REVIEW appeal exists for the request"]
  - method: GET
    path: "/erate/appeals"
    description: "List appeals; FK reverse lookup by funding_request_id"
    roles: [Any]
    code: 200
    input: ["funding_request_id?", "status?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []
  - method: GET
    path: "/erate/appeals/{id}"
    description: "Get an appeal"
    roles: [Any]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/erate/appeals/{id}/begin-review"
    description: "Appeal officer opens review"
    roles: [AppealOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: ["status FILED->UNDER_REVIEW; increments Appeal.version by 1"]
  - method: POST
    path: "/erate/appeals/{id}/decide"
    description: "Decide an appeal; GRANTED triggers the recommit cascade on the funding request"
    roles: [AppealOfficer]
    code: 200
    input: [outcome, "rationale?"]
    output: Appeal
    side_effects: ["status UNDER_REVIEW->GRANTED|DENIED; GRANTED: LINK1 request DENIED->COMMITTED, LINK2 lines recommitted against current C2 availability in created_at ASC order, LINK3 budget ledger + request totals recomputed; outcome_date set; RetainedDocument created; increments Appeal.version by 1"]

  # --- RetainedDocument (document retention for audit) ---
  - method: GET
    path: "/erate/retained-documents"
    description: "List retained documents; FK reverse lookup by subject (subject_type + subject_id) or funding_cycle_id"
    roles: [Any]
    code: 200
    input: ["subject_type?", "subject_id?", "funding_cycle_id?", "status?", "limit?", "offset?"]
    output: "RetainedDocument[]"
    side_effects: []
  - method: GET
    path: "/erate/retained-documents/{id}"
    description: "Get a retained document"
    roles: [Any]
    code: 200
    input: []
    output: RetainedDocument
    side_effects: []
  - method: POST
    path: "/erate/retained-documents/{id}/place-hold"
    description: "Place an audit hold with half-open interval [hold_start_date, hold_end_date)"
    roles: [Auditor]
    code: 200
    input: [hold_start_date, hold_end_date]
    output: RetainedDocument
    side_effects: ["status RETAINED->HELD; ERR_INVALID_REQUEST unless hold_end_date > hold_start_date; increments RetainedDocument.version by 1"]
  - method: POST
    path: "/erate/retained-documents/{id}/release-hold"
    description: "Release an audit hold"
    roles: [Auditor]
    code: 200
    input: []
    output: RetainedDocument
    side_effects: ["status HELD->RETAINED; hold dates cleared; increments RetainedDocument.version by 1"]
  - method: POST
    path: "/erate/retained-documents/{id}/purge"
    description: "Purge a document whose 10-year retention has lapsed and which is not inside an audit hold"
    roles: [Auditor]
    code: 200
    input: []
    output: RetainedDocument
    side_effects: ["status RETAINED|HELD -> PURGED; ERR_DOCUMENT_NOT_PURGEABLE while clock date <= retained_until_date (strict >); ERR_AUDIT_HOLD_ACTIVE when clock date in [hold_start_date, hold_end_date) (purge on hold_end_date allowed); increments RetainedDocument.version by 1"]

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: unknown/missing required field, bad enum, non-positive amount, malformed date, violated conditional-field rule (BEAR without applicant_paid_cents, SPI with applicant_paid_cents, cep_participating without cep_identified_student_pct, SCHOOL without student_count, LIBRARY without square_feet, free_lunch_eligible_students > total_students, hold_end_date <= hold_start_date, window_close_date < window_open_date, service_end_date < service_start_date, factor_scores not covering posting factors, total_eligible_cents != winning bid price, duplicate spin)"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role not in the endpoint's roles list"
  - id: ERR_APPLICANT_ACCESS_DENIED
    http: 403
    condition: "ApplicantUser's applicant_id does not match the target resource's applicant chain"
  - id: ERR_PROVIDER_ACCESS_DENIED
    http: 403
    condition: "VendorRepresentative's ServiceProvider does not own the SPI invoice's contract (or mismatched on resubmit)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced id (path or body) does not exist"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Target resource not in a from-state of the invoked transition (covers double transitions, terminal lockdown, wrong-state actions)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_request_version / expected_line_version mismatches the parent's current version (OCC)"
  - id: ERR_SOD_CONTRACT_CERTIFIER
    http: 409
    condition: "Contract certifier's X-User-ID equals the posting's selected_by_user_id (segregation of duties)"
  - id: ERR_SOD_COMMITMENT_OFFICER
    http: 409
    condition: "Commitment officer's X-User-ID appears in the request's pia_reviewer_user_ids (segregation of duties)"
  - id: ERR_AUDIT_HOLD_ACTIVE
    http: 409
    condition: "Applicant audit hold blocks invoice approval; or document purge attempted while clock date is inside the half-open hold interval"
  - id: ERR_BID_WINDOW_CLOSED
    http: 409
    condition: "Bid submitted at or after posting.window_close_at (half-open window; exactly at close is late)"
  - id: ERR_BID_WINDOW_STILL_OPEN
    http: 409
    condition: "close-window called before the 28-day window fully elapsed (clock < window_close_at)"
  - id: ERR_FILING_WINDOW_CLOSED
    http: 409
    condition: "Request certification attempted outside the closed filing window [window_open_date, window_close_date]"
  - id: ERR_APPEAL_WINDOW_PASSED
    http: 409
    condition: "Appeal filed after decision_date + 60 days (filing on day 60 itself is allowed)"
  - id: ERR_INVOICE_DEADLINE_PASSED
    http: 409
    condition: "Invoice submitted after line.invoice_deadline_date (submission on the deadline date is allowed)"
  - id: ERR_PRICE_NOT_PRIMARY
    http: 409
    condition: "Posting price_weight_pct is below at least one other evaluation factor weight"
  - id: ERR_CONTRACT_TERM_OVERLAP
    http: 409
    condition: "Closed-interval term collision with another CERTIFIED contract for the same (applicant_id, service_provider_id, category); shared endpoint date counts as overlap"
  - id: ERR_NO_QUALIFIED_BIDS
    http: 409
    condition: "select-winner with zero QUALIFIED bids (empty candidate pool)"
  - id: ERR_SERVICE_NOT_ELIGIBLE
    http: 409
    condition: "Substitution target service is not in the funding cycle's eligible services inventory"
  - id: ERR_SUBSTITUTION_CATEGORY_MISMATCH
    http: 409
    condition: "Substitution target service category differs from the line's category"
  - id: ERR_APPEAL_ALREADY_ACTIVE
    http: 409
    condition: "A FILED or UNDER_REVIEW appeal already exists for the funding request"
  - id: ERR_EMPTY_REQUEST
    http: 409
    condition: "Request certification attempted with zero lines"
  - id: ERR_CONTRACT_NOT_CERTIFIED
    http: 409
    condition: "Line creation references a contract that is not CERTIFIED"
  - id: ERR_LINE_NOT_COMMITTED
    http: 409
    condition: "Invoice creation references a line that is not COMMITTED"
  - id: ERR_SERVICES_NOT_STARTED
    http: 409
    condition: "Invoice creation before the request's service-start"
  - id: ERR_CROSS_ENTITY_MISMATCH
    http: 409
    condition: "FK consistency violation: provider/category mismatch on contract create; contract applicant/category vs line/request mismatch; substitution supersedes target not APPROVED on the same line"
  - id: ERR_BID_NOT_AWARDED
    http: 409
    condition: "Contract winning_bid_id differs from posting.selected_bid_id"
  - id: ERR_DISCOUNT_SNAPSHOT_MISSING
    http: 409
    condition: "No NSLPSnapshot exists for (applicant, funding cycle) at certify or budget-summary"
  - id: ERR_CONTRACT_CAPACITY_EXCEEDED
    http: 409
    condition: "Sum of non-CANCELLED line requested_pre_discount_cents would exceed contract.total_eligible_cents"
  - id: ERR_REIMBURSEMENT_EXCEEDS_REMAINING
    http: 409
    condition: "Tentative reimbursement exceeds line.remaining_reimbursable_cents (equality allowed)"
  - id: ERR_DOCUMENT_NOT_PURGEABLE
    http: 409
    condition: "Purge attempted while clock date <= retained_until_date (strict-greater rule)"

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "USAC program administrator: provisions cycles, eligible services inventory, applicants, users, providers; decides service substitutions; operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /erate/_clock/set_current_utc"
      - "POST /erate/funding-cycles"
      - "POST /erate/eligible-services"
      - "POST /erate/applicants"
      - "POST /erate/nslp-snapshots"
      - "POST /erate/applicant-users"
      - "POST /erate/service-providers"
      - "POST /erate/service-substitutions/{id}/approve"
      - "POST /erate/service-substitutions/{id}/deny"
    shared_operations: []
  - name: ApplicantCoordinator
    description: "Applicant-side coordinator: runs procurement, evaluates bids, builds funding requests and lines, responds to PIA, files BEAR invoices, substitutions, and appeals"
    identity: "entity_backed:ApplicantUser"
    exclusive_operations:
      - "POST /erate/procurement-postings, .../publish, .../close-window, .../cancel"
      - "POST /erate/bids/{id}/qualify, .../disqualify"
      - "POST /erate/contracts"
      - "POST /erate/funding-requests, /erate/funding-request-lines"
      - "POST /erate/funding-requests/{id}/pia-responses, .../service-start"
      - "POST /erate/service-substitutions"
      - "POST /erate/appeals"
    shared_operations:
      - "POST /erate/procurement-postings/{id}/select-winner (shared with ApplicantCertifier)"
      - "POST /erate/invoice-submissions (BEAR; shared role list with VendorRepresentative)"
      - "POST /erate/invoice-submissions/{id}/resubmit (BEAR)"
  - name: ApplicantCertifier
    description: "Applicant-side certifier (business official): certifies contracts and funding requests; terminates contracts; may also run bid selection, which then bars that same user from certifying the resulting contract"
    identity: "entity_backed:ApplicantUser"
    exclusive_operations:
      - "POST /erate/contracts/{id}/certify, .../terminate"
      - "POST /erate/funding-requests/{id}/certify"
    shared_operations:
      - "POST /erate/procurement-postings/{id}/select-winner (shared with ApplicantCoordinator)"
  - name: VendorRepresentative
    description: "Service provider sales representative: submits bids; files and resubmits SPI invoices"
    identity: "entity_backed:ServiceProvider"
    exclusive_operations:
      - "POST /erate/bids"
    shared_operations:
      - "POST /erate/invoice-submissions (SPI; shared role list with ApplicantCoordinator)"
      - "POST /erate/invoice-submissions/{id}/resubmit (SPI)"
  - name: PIAReviewer
    description: "USAC Program Integrity Assurance reviewer: opens review, issues information requests; barred from deciding any request they touched"
    identity: opaque
    exclusive_operations:
      - "POST /erate/funding-requests/{id}/begin-review"
      - "POST /erate/funding-requests/{id}/request-info"
    shared_operations: []
  - name: CommitmentOfficer
    description: "USAC commitment officer: issues funding decisions (FCDL equivalent)"
    identity: opaque
    exclusive_operations:
      - "POST /erate/funding-requests/{id}/decide"
    shared_operations: []
  - name: InvoiceProcessor
    description: "USAC invoice processor: reviews, approves, pays, and rejects invoice submissions"
    identity: opaque
    exclusive_operations:
      - "POST /erate/invoice-submissions/{id}/begin-review, .../approve, .../pay, .../reject"
    shared_operations: []
  - name: AppealOfficer
    description: "USAC appeal officer: reviews and decides appeals"
    identity: opaque
    exclusive_operations:
      - "POST /erate/appeals/{id}/begin-review, .../decide"
    shared_operations: []
  - name: Auditor
    description: "Compliance auditor: places applicant audit holds; manages retained-document holds and purges"
    identity: opaque
    exclusive_operations:
      - "POST /erate/applicants/{id}/set-audit-hold"
      - "POST /erate/retained-documents/{id}/place-hold, .../release-hold, .../purge"
    shared_operations: []
  - name: Any
    description: "Shared read access for every authenticated role across all GET endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints under /erate"
