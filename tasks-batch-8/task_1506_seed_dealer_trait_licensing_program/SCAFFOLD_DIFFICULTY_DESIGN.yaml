            - "agreement status == SUSPENDED"
            - "link 2: order status == COMPLIANCE_HOLD"
            - "link 3: line reserved_units == 0 and inventory_lot_id == null"
            - "link 3: lot reserved_units == 0 (reservation released)"
            - "link 4: commission statement net_sales_cents == 0 (held order left the provisional inclusion set {CONFIRMED, CLOSED})"

