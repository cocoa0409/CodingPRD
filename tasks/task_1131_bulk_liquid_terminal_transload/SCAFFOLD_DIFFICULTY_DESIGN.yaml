            - { call: "GET /movements/${mb_id}", payload: {}, as: Scheduler }
          assert:
            - "conflict_err == ERR_WINDOW_CONFLICT (B was blocked before the cancel)"
            - "Movement.${mb_id}.status == SCHEDULED"
            - "Movement.${mb_id}.resource_id == ${r_id}"
            - "Movement.${ma_id}.status == CANCELLED"

  - rule_id: priority_pair_validation_conflict
