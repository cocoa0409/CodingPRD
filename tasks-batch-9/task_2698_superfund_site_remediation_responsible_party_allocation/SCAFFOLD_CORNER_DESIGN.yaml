          trigger:
            - call: "POST /sites/${site_id}/allocation-rounds"
              payload: { weight_volume_bp: 5000, weight_toxicity_bp: 3000, weight_ownership_bp: 2000, expected_site_version: "${site_v}" }
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { round_1: $.data.id }
            - call: "POST /sites/${site_id}/allocation-rounds"
              payload: { weight_volume_bp: 4000, weight_toxicity_bp: 4000, weight_ownership_bp: 2000, expected_site_version: "${site_v}" }
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { err_1: $.data.error_id }
