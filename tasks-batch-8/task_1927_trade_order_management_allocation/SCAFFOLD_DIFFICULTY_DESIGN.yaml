            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /trading/allocation-plans/${plan}/post", as: Trader }
            - { call: "GET /trading/allocations?plan_id=${plan}", as: SettlementOps, captures: { al: "$.data[0].id" } }
            - { call: "GET /trading/settlement-instructions?allocation_id=${al}", as: SettlementOps, captures: { si: "$.data[0].id" } }
            - { call: "POST /trading/settlement-instructions/${si}/instruct", as: SettlementOps }
            - { call: "POST /trading/settlement-instructions/${si}/fail", payload: { fail_reason: BROKER_NON_DELIVERY }, as: SettlementOps, captures: { fc1: $.data.fail_count } }
          trigger:
            - { call: "POST /trading/settlement-instructions/${si}/repair", as: SettlementOps, captures: { st: $.data.instruction_status, fc2: $.data.fail_count } }
          assert:
            - "After fail: SettlementInstruction.${si}.fail_count == 1 and status FAILED"
            - "After repair: instruction_status == INSTRUCTED (FAILED -> INSTRUCTED cycle) and fail_count == 1 (not reset)"

  - rule_id: transitive_cascade
    instances:
      - name: plan_post_transitive_cascade
        grounds:
          - state_machines.AllocationPlan.APPROVED_to_POSTED
          - state_machines.Allocation.PROPOSED_to_POSTED
          - calculations.commission_per_line
          - calculations.position_net_qty
        distinguishing_aspect: |
          Depth >= 3 cascade from the plan-post trigger: post mutates
          AllocationPlan -> each Allocation PROPOSED -> POSTED mutation itself
          creates a SettlementInstruction, updates Position.net_qty, and accrues
          the CommissionBudget whose accrual in turn drives OPEN -> EXHAUSTED;
          the allocation mutation also bubbles the owning Order to ALLOCATED and
          advances the block watermark — every hop caused by the previous link.
        test_recipe:
          setup:
            - "Accounts A1 (budget exactly 1000), A2 (budget 100000); EQUITY security; broker 50bp"
            - "Block orders 100 (A1) + 300 (A2); fill 400@2000 -> FILLED; plan PRO_RATA approved (lines 100/300 @2000, commissions 1000/3000)"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/accounts", payload: { account_code: "A2", display_name: "A2", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a2: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 1000 }, as: DeskAdmin, captures: { b1: $.data.id } }
            - { call: "POST /trading/accounts/${a2}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin, captures: { b2: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a2}", security_id: "${sec}", side: BUY, order_qty: 300, order_type: MARKET }, as: Trader, captures: { o2: $.data.id } }
            - { call: "POST /trading/orders/${o2}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o2}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 400, fill_price_cents: 2000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /trading/allocation-plans/${plan}/post", as: Trader, captures: { plan_st: $.data.status } }
            - { call: "GET /trading/allocations?plan_id=${plan}", as: Trader, captures: { l1: "$.data[0].id", l1_st: "$.data[0].status", l2_st: "$.data[1].status" } }
            - { call: "GET /trading/positions?account_id=${a1}", as: Trader, captures: { pos1: "$.data[0].net_qty" } }
            - { call: "GET /trading/positions?account_id=${a2}", as: Trader, captures: { pos2: "$.data[0].net_qty" } }
            - { call: "GET /trading/commission-budgets/${b1}", as: Trader, captures: { b1_acc: $.data.accrued_commission_cents, b1_st: $.data.status } }
            - { call: "GET /trading/commission-budgets/${b2}", as: Trader, captures: { b2_acc: $.data.accrued_commission_cents, b2_st: $.data.status } }
            - { call: "GET /trading/orders/${o1}", as: Trader, captures: { o1_st: $.data.status, o1_qty: $.data.allocated_qty, o1_px: $.data.avg_executed_price_cents } }
            - { call: "GET /trading/settlement-instructions?allocation_id=${l1}", as: Trader, captures: { si1: "$.data[0].id", si1_st: "$.data[0].instruction_status", si1_sd: "$.data[0].settle_date" } }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_seq: $.data.allocated_through_seq, blk_as: $.data.allocation_status } }
          assert:
            - "AllocationPlan.${plan}.status == POSTED; both Allocation lines status == POSTED"
            - "Hop allocation->position: Position A1 net_qty == 100, A2 net_qty == 300"
            - "Hop allocation->budget->status: CommissionBudget.${b1} accrued == 1000 and status == EXHAUSTED (exact equality); ${b2} accrued == 3000 and status == OPEN"
            - "Hop allocation->order: Order.${o1} status == ALLOCATED, allocated_qty == 100, avg_executed_price_cents == 2000"
            - "Hop allocation->settlement: one PENDING SettlementInstruction per line; ${si1}.settle_date == 2026-08-02 (EQUITY lag 1 from trade_date 2026-08-01)"
            - "Hop post->block: allocated_through_seq == 1, allocation_status == FULL, status == FILLED"

      - name: settlement_fail_escalation_cascade
        grounds:
          - state_machines.SettlementInstruction.INSTRUCTED_to_FAILED
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.Order.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (settlement fail, not plan
          post): second fail mutates the instruction (FAILED, fail_count 2),
          that mutation escalates the allocation's Account to SUSPENDED, and the
          suspension mutation cancels the account's unrelated APPROVED order —
          SI -> Account -> Order, each link caused by the previous one.
        test_recipe:
          setup:
            - "Account A1 ACTIVE with budget 100000; EQUITY security; broker 50bp"
            - "Order1 100 BUY allocated via posted plan (fill 100@1000); its instruction INSTRUCTED, failed once (fail_count 1), repaired"
            - "Order2 50 BUY on A1 APPROVED and not attached to any block"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /trading/allocation-plans/${plan}/post", as: Trader }
            - { call: "GET /trading/allocations?plan_id=${plan}", as: SettlementOps, captures: { al: "$.data[0].id" } }
            - { call: "GET /trading/settlement-instructions?allocation_id=${al}", as: SettlementOps, captures: { si: "$.data[0].id" } }
            - { call: "POST /trading/settlement-instructions/${si}/instruct", as: SettlementOps }
            - { call: "POST /trading/settlement-instructions/${si}/fail", payload: { fail_reason: BROKER_NON_DELIVERY }, as: SettlementOps }
            - { call: "POST /trading/settlement-instructions/${si}/repair", as: SettlementOps }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 50, order_type: MARKET }, as: Trader, captures: { o2: $.data.id } }
            - { call: "POST /trading/orders/${o2}/compliance-check", as: ComplianceOfficer }
          trigger:
            - { call: "POST /trading/settlement-instructions/${si}/fail", payload: { fail_reason: CUSTODIAN_MISMATCH }, as: SettlementOps, captures: { si_st: $.data.instruction_status, si_fc: $.data.fail_count } }
            - { call: "GET /trading/accounts/${a1}", as: SettlementOps, captures: { a1_st: $.data.status } }
            - { call: "GET /trading/orders/${o2}", as: SettlementOps, captures: { o2_st: $.data.status } }
            - { call: "GET /trading/orders/${o1}", as: SettlementOps, captures: { o1_st: $.data.status } }
          assert:
            - "SettlementInstruction.${si}: FAILED, fail_count == 2 (second failure crosses FAIL_ESCALATION_THRESHOLD)"
            - "Account.${a1}.status == SUSPENDED (escalation hop SI -> Account)"
            - "Order.${o2}.status == CANCELLED (suspension hop Account -> Order; it was APPROVED)"
            - "Order.${o1}.status == ALLOCATED (ALLOCATED orders are outside the cancellation set)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: plan_post_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=12]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): a post on a PROPOSED plan
          violates both the from-state rule (ERR_PLAN_NOT_POSTABLE) and the
          budget sufficiency rule (ERR_COMMISSION_BUDGET_EXCEEDED, budget 500 <
          required 1000); priority 6 state must win over priority 12 fiscal.
        test_recipe:
          setup:
            - "Account A1 with budget only 500; EQUITY security; broker 50bp; block order 100, fill 100@2000 (commission would be 1000 > 500)"
            - "Plan PRO_RATA created and proposed (line 100@2000) but NOT approved"
          setup_api_calls:
