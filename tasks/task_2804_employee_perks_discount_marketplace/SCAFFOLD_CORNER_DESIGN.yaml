      - name: eligibility_apply_writes_its_three_membership_counts_and_suspends_the_omitted_reference
        claim_type: side_effect_execution
        grounds:
          - state_machines.EligibilityFile.status.VALIDATED_to_APPLIED
          - state_machines.EmployeeMembership.status.ELIGIBLE_to_SUSPENDED
          - state_machines.EmployeeMembership.status.SUSPENDED_to_ELIGIBLE
          - state_machines.Employer.integration_status.VALIDATED_to_SYNCED
          - entities.EligibilityFile.fields.created_membership_count
          - entities.EligibilityFile.fields.updated_membership_count
          - entities.EligibilityFile.fields.suspended_membership_count
          - entities.Employer.fields.last_sync_at
          - calculations.employer_eligible_headcount
        distinguishing_aspect: |
          Three successive applies exercise every side effect of the VALIDATED -> APPLIED
          transition on the same roster: batch 1 reports 2 created / 0 updated / 0 suspended,
          batch 2 (which omits E-002) reports 0 / 1 / 1 and drives that membership to
          SUSPENDED, and batch 3 (which reinstates it) reports 0 / 2 / 0 with the membership
          back to ELIGIBLE, while Employer.last_sync_at advances to each apply's clock instant
          and eligible_headcount tracks 2 -> 1 -> 2.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; employer Northwind Co branded, then batch 1 with E-001 and E-002 (both ACTIVE/CA, window 2026-07-01 to 2027-07-01) validated and applied, then the storefront published so program_posture is LIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 2, revenue_share_enabled: true, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id }
            - call: "POST /perks/employers/${employer_id}/storefront"
              payload: { brand_color_hex: "#1155CC", logo_url: "https://cdn.example/nw.png", hero_headline: "Your Northwind perks", featured_categories: ["DINING"] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { employer_v1: $.data.version }
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload: { expected_employer_version: "${employer_v1}", effective_from: "2026-08-01T00:00:00Z", checksum: "sha-sideeffect-1", records: [{ external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }, { external_employee_ref: "E-002", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { file1_id: $.data.id }
            - call: "POST /perks/eligibility-files/${file1_id}/validate"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/eligibility-files/${file1_id}/apply"
