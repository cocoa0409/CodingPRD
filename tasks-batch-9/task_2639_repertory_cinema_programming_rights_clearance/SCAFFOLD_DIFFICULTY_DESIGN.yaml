      - name: kdm_valid_until_equal_to_showtime_end_at_still_covers
        grounds:
          - calculations.kdm_coverage_and_window_overlap
          - state_machines.Showtime[UNVERIFIED -> KEY_PENDING]
          - state_machines.Showtime[KEY_PENDING -> PLAYBACK_VERIFIED]
          - errors[ERR_NO_COVERING_KDM]
          - entities.Showtime.end_at
        distinguishing_aspect: |
          Coverage is `valid_until >= end_at`, so a key whose validity ends at the EXACT millisecond the
          feature ends does cover the screening, while a key one minute shorter does not. Two showtimes
          identical in every other respect are separated purely by that single boundary comparison, and
          coverage is measured against end_at rather than blocked_until - the turnaround is not keyed.
