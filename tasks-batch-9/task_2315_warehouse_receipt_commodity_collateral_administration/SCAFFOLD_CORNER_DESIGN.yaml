        grounds: ["validations[priority 50]", "validations[priority 55]", "concurrency_rules[deposit-accept-stale-bin]", "errors[ERR_STALE_BIN_VERSION]"]
        distinguishing_aspect: "Both checks are violated on a second accept of the same ticket (ticket already ACCEPTED, and the captured bin version is now stale); priority 50 runs first, so the response is 412 ERR_STALE_BIN_VERSION, never 409 ERR_INVALID_STATE."
        test_recipe:
