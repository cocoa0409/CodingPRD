  - rule_id: combinatorial_formula
    instances:
      - name: waste_tier_length_grade_interaction
        grounds:
          - calculations.line_lumber_requirement
          - entities.CutListLine.fields.waste_pct
          - entities.CutListLine.fields.required_board_feet
        distinguishing_aspect: |
          Mode (a) formula with 4 interacting inputs (dimension factor, qty, length
          tier, grade base) plus a min() cap: length 12/16/20 ft on MSR yields waste
          0.05/0.07/0.09, while SPF_NO2 at 20 ft clamps to the 0.11 cap instead of
          the raw 0.12 — the length effect is grade-dependent.
        test_recipe:
          setup:
            - "Job confirmed; designs TR-MSR (ROOF_TRUSS, SPF_MSR2400, P20, qty 1) and TR-NO2 (ROOF_TRUSS, SPF_NO2, P20, qty 1) both SEALED"
            - "Cut list cl_msr lines: TC-1 L2X6 12.0ft x10; BC-16 L2X4 16.0ft x10; BC-20 L2X4 20.0ft x5"
            - "Cut list cl_no2 line: CAP-1 L2X6 20.0ft x1"
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 100000000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E2", license_number: "PE-2", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng2: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Waste Job", jobsite_address: "2 Pine St", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 1000000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-ROOF-A", component_type_supported: "ROOF_TRUSS", plate_class: "P20", changeover_minutes_from: {} }, as: PlantManager, captures: { jig_roof: $.data.id } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-MSR", component_type: "ROOF_TRUSS", span_ft: 32.0, pitch_degrees: 26.57, design_load_psf: 40.0, lumber_grade: "SPF_MSR2400", plating: "P20", quantity_required: 1, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg_msr: $.data.id } }
