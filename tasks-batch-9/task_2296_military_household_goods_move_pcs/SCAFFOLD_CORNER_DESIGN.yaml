          assert:
            - "${err_id} == ERR_UNAUTHORIZED with HTTP 403 (the identity is valid, only the role is wrong)"
            - "${status_after} == DRAFT and ${by_user} is null: the denied call applied no side effect"
            - "${ok_status} == AUTHORIZED for the identical payload sent by MoveCounselor"

      - name: service_member_cannot_read_another_members_shipment
