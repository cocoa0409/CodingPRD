            - "BEFORE: ElectionEvent.${ee2_id}.status is still UNDER_REVIEW and resulting_enrollment_id is null"
            - "BEFORE: PlanOption.${po_med_id}.enrolled_count == 0"
            - "BEFORE: PlanOption.${po_med_id}.status was ACTIVE the whole time, so the block came from the orthogonal subsidy_certification_status dimension"
            - "UNBLOCK: PlanOption.${po_med_id}.subsidy_certification_status == CERTIFIED with certified_by_user_id == compliance-01, while status is still ACTIVE"
            - "AFTER: the byte-identical third call returns HTTP 200 and ElectionEvent.${ee2_id}.status == APPROVED"
            - "AFTER: Enrollment.${enr2_id}.coverage_status == PENDING, because the clock 2026-10-20 precedes coverage_effective_date 2027-01-01"
            - "AFTER: Enrollment.${enr2_id}.billing_status == CURRENT"
            - "AFTER: Enrollment.${enr2_id}.payer_order == GROUP_PRIMARY_WORKING_AGED and msp_basis_code == WORKING_AGED_LARGE_EMPLOYER, because employer size 25 >= WORKING_AGED_EMPLOYER_THRESHOLD 20"
            - "AFTER: Enrollment.${enr2_id}.monthly_retiree_premium_cents == 3406, from base 32900, fee 1151, gross 34051 and a 9000-bps subsidy of 30645"
            - "AFTER: PlanOption.${po_med_id}.enrolled_count == 1"

