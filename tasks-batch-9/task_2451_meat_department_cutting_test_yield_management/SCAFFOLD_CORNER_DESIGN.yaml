              captures: { lot_status: $.data.status, lot_alloc: $.data.allocated_lb, lot_remaining: $.data.remaining_lb }
            - call: "GET /meat-ops/grind-runs/${gr1_id}"
              payload: {}
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { run_batch: $.data.batch_weight_lb, run_lean: $.data.blended_lean_pct, run_cost: $.data.blend_cost_per_lb_cents, run_coo: $.data.coo_label, run_status: $.data.status }
          assert:
            - "${err_lot} == ERR_TRIM_LOT_NOT_FOUND with HTTP 404 and GrindRun.${gr1_id}.batch_weight_lb stays 0.00 — the junction row is not created when one endpoint of the edge is missing"
            - "${gi1_run} == ${gr1_id}, ${gi1_lot} == ${tl1_id}, ${gi1_weight} == 4.00 and ${gi1_consumed} == false — the link names both endpoints and is not consumed until the run completes"
            - "${run_lean} == 80.00, ${run_cost} == 200.0000 and ${run_coo} == USA — the lot's lean, cost and country flow into the run's blend fields through the link"
            - "${by_run_total} == 1 with ${by_run_first} == ${gi1_id}, and ${by_lot_total} == 1 — the same edge is reachable from the run side and from the lot side"
            - "${lot_status} == PARTIALLY_COMMITTED with ${lot_alloc} == 4.00 and ${lot_remaining} == 6.00"
            - "${run_batch} == 4.00 while ${run_status} == SCHEDULED — inputs may be attached before the run starts"

      - name: department_read_recomputes_the_posture_from_the_reading_stream
        claim_type: computed_read
        grounds:
          - endpoints[GET /meat-ops/departments/{id}]
          - endpoints[GET /meat-ops/departments/{id}/temperature-logs]
          - endpoints[POST /_clock/set_current_utc]
          - calculations.case_posture_derivation
        distinguishing_aspect: "The department read exposes only derived counters — case_posture and the open/contained failure counts — and they change without any write against the Department itself; the reading list confirms that out_of_spec is decided by strict inequality against max_safe_case_temp_c, and each log's taken_at follows the logical clock rather than wall time."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config (max_safe_case_temp_c 4.4, critical_case_temp_c 7.0); clock at 2026-08-05T08:00:00Z."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "GET /meat-ops/departments/${dept_id}"
              payload: {}
              as: ServiceClerk
              as_user_id: "clerk-01"
              captures: { p0: $.data.case_posture, open0: $.data.open_case_failure_count, cont0: $.data.contained_case_failure_count }
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.4 }
              as: ServiceClerk
              as_user_id: "clerk-01"
              captures: { r1_spec: $.data.out_of_spec, r1_at: $.data.taken_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:30:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.5 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { r2_spec: $.data.out_of_spec, r2_at: $.data.taken_at }
            - call: "GET /meat-ops/departments/${dept_id}"
              payload: {}
              as: ServiceClerk
              as_user_id: "clerk-01"
              captures: { p1: $.data.case_posture, open1: $.data.open_case_failure_count }
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.6 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "GET /meat-ops/departments/${dept_id}"
              payload: {}
              as: ServiceClerk
              as_user_id: "clerk-01"
              captures: { p2: $.data.case_posture, open2: $.data.open_case_failure_count }
            - call: "GET /meat-ops/departments/${dept_id}/temperature-logs"
              payload: { out_of_spec: true, case_code: "CASE-A" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { oos_total: $.meta.total_count }
          assert:
            - "${p0} == SALES_OPEN with ${open0} == 0 and ${cont0} == 0 on a department that has never been read against a failure"
            - "${r1_spec} == false at exactly 4.4 (the gate is strictly greater than max_safe_case_temp_c) and ${r1_at} == 2026-08-05T08:00:00Z"
            - "${r2_spec} == true at 4.5 and ${r2_at} == 2026-08-05T08:30:00Z — taken_at tracks the logical clock"
            - "${p1} == SALES_OPEN and ${open1} == 0 — one out-of-spec reading is below CONSECUTIVE_FAILURE_THRESHOLD"
            - "${p2} == SALES_HALTED and ${open2} == 1 after the second consecutive out-of-spec reading, with no write ever issued against the Department"
            - "${oos_total} == 2 — the in-spec 4.4 reading is excluded by the filter"

      - name: price_activation_is_permitted_only_once_the_basis_is_approved
        claim_type: conditional_action
        grounds:
          - endpoints[POST /meat-ops/retail-items/{id}/price-activations]
