            - "Order B (committed 500): billed_total_cents == 4850000 (gross 5,000,000 - discount round(5,000,000 x 0.03) = 150,000; tier boundary is inclusive)"

      - name: price_hold_end_and_escalation_boundary
        claim_type: boundary_edge
        grounds:
          - "calculations.release_price_at_date"
        distinguishing_aspect: "Both date boundaries are inclusive in opposite branches: scheduled_ship_date == price_hold_end prices at BASE; == escalation_effective_date prices ESCALATED."
        test_recipe:
          setup: ["COATED product; contract ACTIVE base 10000c, price_hold_end 2026-12-31, escalation 4% effective 2027-01-01, term to 2027-12-31; blanket order committed 100 OPEN"]
