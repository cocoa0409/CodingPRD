  - rule_id: boundary_precision_check
    instances:
      - name: group_discount_tier_boundary_seats_5_vs_6
        grounds:
          - calculations.booking_charge
          - entities.Booking.fields.seats_requested
        distinguishing_aspect: |
          Numeric threshold boundary on the group-discount tier (endpoint POST /culinary/bookings):
          seats_requested=5 takes the 5% tier (subtotal 48500 -> charge 46075) while seats_requested=6
          takes the 10% tier (subtotal 58200 -> charge 52380). The >=6 boundary is exact.
        test_recipe:
          setup:
            - "OPEN GROUP session ADVANCED base 8500, planned_seats=11; two bookings of 5 and 6 seats"
          setup_api_calls:
