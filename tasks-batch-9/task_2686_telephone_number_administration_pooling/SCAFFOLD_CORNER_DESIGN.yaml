            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
