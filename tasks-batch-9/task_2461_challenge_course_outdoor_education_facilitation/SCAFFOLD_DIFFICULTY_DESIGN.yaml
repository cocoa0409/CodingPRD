              captures: { asg2_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/program-blocks/${blk3_id}/block-assignments"
              payload: { facilitator_id: "${f1_id}", assignment_role: "LEAD" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
            - call: "POST /challenge-course/program-blocks/${blk4_id}/block-assignments"
              payload: { facilitator_id: "${f1_id}", assignment_role: "LEAD" }
              as: ProgramDirector
              captures: { asg4_id: $.data.id }
          assert:
            - "http_status == 409"
            - "${err} == ERR_FACILITATOR_SCHEDULE_CONFLICT"
            - "ProgramBlock.${blk3_id}.assigned_facilitator_count == 0"
            - "BlockAssignment.${asg4_id}.program_block_id == ${blk4_id}"
            - "BlockAssignment.${asg4_id}.facilitator_id == ${f1_id}"
            - "BlockAssignment.${asg4_id}.rescue_current_at_assignment == true"
            - "ProgramBlock.${blk4_id}.assigned_facilitator_count == 1"
            - "ProgramBlock.${blk2_id}.assigned_facilitator_count == 1"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: client_funds_conserved_across_confirm_then_cancel
        grounds:
          - state_machines.Booking.QUOTED_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.booking_cancellation_settlement
          - entities.GroupClient.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity = client money. Confirm debits the 341-cent deposit
          from credit_balance_cents and cancel at 36 days notice credits the full
          amount back, so payments_received_cents must equal
          credit_balance_cents + deposit_allocated_cents + retained_cents (20000
          == 20000 + 0 + 0) both before and after the round trip; any drift, or a
          refund that forgets to zero deposit_allocated_cents, breaks the identity.
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course with two ACTIVE facilitators; a PARTNER client funded with a single 20000-cent payment; a CONFIRMED two-block booking for 2026-09-15 holding a 341-cent deposit (credit_balance_cents is 19659 immediately after confirm)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Dana Reyes", staff_type: "SAFETY_OFFICER", certification_level: "LEVEL_3", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { so_id: $.data.id }
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${so_id}", kind: "RESCUE_DRILL", completed_on: "2026-07-15" }
              as: ProgramDirector
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${so_id}", kind: "REFRESHER", completed_on: "2026-07-15", hours: 8 }
              as: ProgramDirector
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Kim Alvarez", staff_type: "STAFF_FACILITATOR", certification_level: "LEVEL_2", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { f1_id: $.data.id }
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${f1_id}", kind: "RESCUE_DRILL", completed_on: "2026-07-15" }
              as: ProgramDirector
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${f1_id}", kind: "REFRESHER", completed_on: "2026-07-15", hours: 8 }
              as: ProgramDirector
            - call: "POST /challenge-course/group-clients"
              payload: { client_name: "Ridgeview Middle School", org_type: "SCHOOL", tier: "PARTNER" }
              as: ProgramDirector
              captures: { gc_id: $.data.id }
            - call: "POST /challenge-course/group-clients/${gc_id}/payments"
              payload: { amount_cents: 20000, reference: "CHK-8801" }
              as: ProgramDirector
            - call: "POST /challenge-course/bookings"
              payload: { course_id: "${course_id}", group_client_id: "${gc_id}", program_date: "2026-09-15", expected_participant_count: 1 }
              as: ProgramDirector
              captures: { b_id: $.data.id, b_v0: $.data.version }
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${b_id}", expected_booking_version: "${b_v0}", full_name: "Alex Stone", birth_date: "1990-04-12", weight_kg: 78.0, is_chaperone: false }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /challenge-course/participants/${p1_id}/screening-packet"
              payload: { agreement_signed: true, guardian_signature_provided: false, health_flags: ["NONE"] }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${b_id}", sequence_index: 1, phase: "ICEBREAKER", planned_start_at: "2026-09-15T09:00:00Z", planned_end_at: "2026-09-15T09:45:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${b_id}", sequence_index: 2, phase: "DEBRIEF", planned_start_at: "2026-09-15T09:45:00Z", planned_end_at: "2026-09-15T10:15:00Z" }
              as: ProgramDirector
            - call: "GET /challenge-course/bookings/${b_id}"
              payload: {}
              as: ProgramDirector
              captures: { b_v1: $.data.version }
            - call: "POST /challenge-course/bookings/${b_id}/quote"
              payload: { expected_booking_version: "${b_v1}" }
              as: ProgramDirector
            - call: "POST /challenge-course/bookings/${b_id}/confirm"
              payload: {}
              as: GroupCoordinator
              as_user_id: "${gc_id}"
            - call: "GET /challenge-course/group-clients/${gc_id}"
              payload: {}
              as: ProgramDirector
              captures: { credit_after_confirm: $.data.credit_balance_cents }
          trigger:
            - call: "POST /challenge-course/bookings/${b_id}/cancel"
              payload: { reason: "Group cancelled well ahead of the program date" }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
          assert:
            - "${credit_after_confirm} == 19659"
            - "Booking.${b_id}.status == CANCELLED"
            - "Booking.${b_id}.cancellation_variant == CLIENT_INITIATED"
            - "Booking.${b_id}.notice_days_at_cancel == 36"
            - "Booking.${b_id}.cancellation_fee_cents == 0"
            - "Booking.${b_id}.refund_cents == 341"
            - "Booking.${b_id}.retained_cents == 0"
            - "Booking.${b_id}.deposit_allocated_cents == 0"
            - "GroupClient.${gc_id}.credit_balance_cents == 20000"
            - "GroupClient.${gc_id}.payments_received_cents == 20000"
            - "GroupClient.${gc_id}.late_cancellation_count == 0"

      - name: restriction_counters_restored_by_return_to_service
        grounds:
          - state_machines.Element.RESTRICTED_to_SERVICEABLE
          - state_machines.ProgramBlock.BLOCKED_UNSAFE_to_SCHEDULED
          - state_machines.Booking.AT_RISK_to_CONFIRMED
          - calculations.course_posture
        distinguishing_aspect: |
          A different conserved quantity — the course's derived restriction
          counters and the blocked/at-risk bookkeeping, not money. The
          DEFECT_MAJOR restriction raises restricted_element_count,
          blocked_block_count and at_risk_booking_count to 1 each, and
          return-to-service must drive every one of them back to exactly 0 with
          restricting_log_id cleared and posture back to OPEN/NONE, proving the
          compensating path reverses each forward side effect rather than merely
          flipping the element's own status.
        test_recipe:
          setup:
            - "The depth-4 cascade fixture: clock at 2026-08-10, one course with two ACTIVE facilitators, a LOW_ELEMENT element, a PARTNER client funded with 20000 cents, and a CONFIRMED three-block booking whose sequence-2 block rigs that element."
