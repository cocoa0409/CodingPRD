        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_UNAUTHENTICATED]", roles]
        distinguishing_aspect: "A request with a missing or unrecognized X-User-Role is rejected 401 before any role list is consulted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: UnknownRole, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, HTTP 401"

