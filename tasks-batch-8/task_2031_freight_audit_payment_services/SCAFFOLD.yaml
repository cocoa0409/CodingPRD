  # --- PaymentRun ---
  - method: POST
    path: "/fap/clients/{id}/payment-runs"
    description: "Create payment run (DRAFT); run_date must be >= current logical date"
    roles: [FinanceController]
    code: 201
    input: [run_date, currency, "country_scope?"]
    output: PaymentRun
    side_effects: ["created_by_user_id := X-User-ID", "ERR_RUN_DATE_PAST"]
  - method: GET
    path: "/fap/payment-runs/{id}"
    description: "Get a payment run"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: []
    output: PaymentRun
    side_effects: []
  - method: GET
    path: "/fap/payment-runs"
    description: "List payment runs"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: "PaymentRun[]"
    side_effects: []
  - method: POST
    path: "/fap/payment-runs/{id}/items"
    description: "Add one item by invoice_id; OCC-guarded"
    roles: [FinanceController]
    code: 201
    input: [expected_payment_run_version, invoice_id]
    output: PaymentRunItem
    side_effects:
      - "increments PaymentRun.version by 1"
      - "scheduled_amount_minor computed via fx_conversion payment_date variant"
      - "ERR_INVOICE_NOT_PAYABLE, ERR_CARRIER_NOT_ACTIVE, ERR_FX_RATE_MISSING"
  - method: POST
    path: "/fap/payment-runs/{id}/auto_fill"
    description: "Add one item per eligible invoice per run_item_selection ranking; OCC-guarded"
    roles: [FinanceController]
    code: 200
    input: [expected_payment_run_version]
    output: PaymentRun
    side_effects:
      - "increments PaymentRun.version by 1"
      - "run_item_selection adds items in due_date ASC, created_at ASC order"
      - "Zero eligible invoices adds zero items (lock then fails ERR_EMPTY_PAYMENT_RUN)"
  - method: GET
    path: "/fap/payment-runs/{id}/items"
    description: "List items of a run"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: []
    output: "PaymentRunItem[]"
    side_effects: []
  - method: GET
    path: "/fap/invoices/{id}/payment-run-items"
    description: "List run items covering an invoice"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: []
    output: "PaymentRunItem[]"
    side_effects: []
  - method: POST
    path: "/fap/payment-runs/{id}/lock"
    description: "DRAFT -> LOCKED; computes discount tiers"
    roles: [FinanceController]
    code: 200
    input: []
    output: PaymentRun
    side_effects: ["run_discount_tier", "ERR_EMPTY_PAYMENT_RUN"]
  - method: POST
    path: "/fap/payment-runs/{id}/unlock"
    description: "LOCKED -> DRAFT; deletes items and zeroes totals (compensation)"
    roles: [FinanceController]
    code: 200
    input: []
    output: PaymentRun
    side_effects: ["items deleted", "totals reset to 0"]
  - method: POST
    path: "/fap/payment-runs/{id}/release"
    description: "LOCKED -> RELEASED; segregation of duties enforced; cascades to items, invoices, advices"
    roles: [TreasuryApprover]
    code: 200
    input: []
    output: PaymentRun
    side_effects: ["items RELEASED", "invoices payment SCHEDULED + scheduled_minor", "RemittanceAdvice GENERATED per carrier", "ERR_SEGREGATION_OF_DUTIES"]
  - method: POST
    path: "/fap/payment-runs/{id}/settle"
    description: "RELEASED -> SETTLED; pays items, advances invoice payment, sends advices"
    roles: [TreasuryApprover]
    code: 200
    input: []
    output: PaymentRun
    side_effects: ["items PAID", "invoices PAID/SHORT_PAID + paid_minor", "advices GENERATED -> SENT", "shipments INVOICED -> CLOSED"]
  - method: POST
    path: "/fap/payment-runs/{id}/cancel"
    description: "DRAFT -> CANCELLED"
    roles: [FinanceController]
    code: 200
    input: []
    output: PaymentRun
    side_effects: []

