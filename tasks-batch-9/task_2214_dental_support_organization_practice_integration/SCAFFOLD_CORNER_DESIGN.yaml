            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: DsoIntegrationLead
          trigger:
            - call: "POST /dso/migration-batches/${b1_id}/validate"
              payload: { quarantined_count: 100 }
              as: DsoIntegrationLead
            - call: "POST /dso/migration-batches/${b1_id}/reconcile"
              payload: {}
              as: DsoIntegrationLead
          assert:
            - "While STAGED: MigrationBatch.${b1_id}.records_pending == 5000, records_validated == 0, records_quarantined == 0, and Practice.${prac_id}.charts_migrated_count == 0"
            - "After validate: MigrationBatch.${b1_id}.status == VALIDATED with 5000 == 4900 + 100 + 0 and Practice.${prac_id}.charts_migrated_count == 4900"
            - "After reconcile: MigrationBatch.${b1_id}.status == RECONCILED and Practice.${prac_id}.charts_migrated_count == 4900 (unchanged)"
            - "Practice.${prac_id}.integration_posture == STABILIZING (4900 < 5000) and quarantined_batch_count == 0"

      - name: earnout_payout_variant_divergence_on_same_period
        claim_type: Variant Divergence
        grounds:
          - calculations.earnout_payout.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / earnout_provisional_annualization_vs_final_lag_holdback
          rationale: "Both variants and the delta between them are computed on one tranche by the named §1.8 instance."

      - name: earnout_payout_variant_selected_by_endpoint
        claim_type: Variant Selection
        grounds:
          - calculations.earnout_payout.variants
          - entities.EarnoutTranche.fields.variant_applied
        excluded_because:
          difficulty_instance: dual_variant_calc / earnout_provisional_annualization_vs_final_lag_holdback
          rationale: "That instance asserts variant_applied PROVISIONAL after reserve and FINAL after settle on the same row."

      - name: earnout_reserved_to_settled_reconciliation
        claim_type: Reconciliation
        grounds:
          - calculations.earnout_pool_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / earnout_pool_conserved_across_reserve_settle_clawback
          rationale: "The ledger delta on every variant switch is reconciled before and after each transition there."

      - name: doctor_compensation_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.doctor_compensation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / doctor_comp_monthly_guarantee_vs_annual_true_up
          rationale: "The two comp models are run on identical collections with the delta asserted by the named §1.8 instance."

      - name: fee_schedule_impact_rounds_at_the_line
        claim_type: Precision
        grounds:
          - calculations.fee_schedule_blended_impact
        excluded_because:
          difficulty_instance: combinatorial_formula / fee_schedule_round_per_line_then_sum
          rationale: "Round-per-line versus round-of-sum is separated by exactly one cent in the named §1.8 instance."

      - name: earnout_multiple_tier_ladder_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.earnout_payout
        excluded_because:
          difficulty_instance: boundary_precision_check / earnout_growth_multiple_tier_boundary_on_settlement
          rationale: "Growth exactly at GROWTH_TIER_2_BPS and one basis point below are both settled there."

      - name: chart_validation_tolerance_threshold
        claim_type: threshold
        grounds:
          - calculations.chart_migration_validation
        excluded_because:
          difficulty_instance: boundary_precision_check / chart_validation_error_rate_at_exact_tolerance
          rationale: "The at-tolerance and one-basis-point-above cases are both asserted there."

      - name: credentialing_lead_time_threshold
        claim_type: threshold
        grounds:
          - calculations.credentialing_lead_time
        excluded_because:
          difficulty_instance: boundary_precision_check / credentialing_lead_time_at_exactly_ninety_days
          rationale: "Exactly 90 and 89 lead_days are both driven through activate-fee-schedule there."

  # ===========================================================================
  - section: validations
    instances:

      - name: license_state_mismatch_blocks_employment_offer
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=19]
          - errors.ERR_LICENSE_STATE_MISMATCH
          - entities.Doctor.fields.license_state
          - entities.Practice.fields.state_code
        distinguishing_aspect: "Validity depends on another entity: a WI-licensed doctor cannot be offered employment at an IL practice, and the same doctor is accepted once an IL licence is on file."
        test_recipe:
          setup:
            - "One Affiliation in DRAFT with one Practice whose state_code is IL."
            - "One Doctor licensed in WI and one Doctor licensed in IL."
          setup_api_calls:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DsoIntegrationLead
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
              as: DsoDealCounsel
              captures: { aff_id: "$.data.id" }
            - call: "POST /dso/conversion-vendors"
              payload: { name: "ChartBridge Conversions", max_concurrent_windows: 3 }
              as: DsoIntegrationLead
              captures: { vendor_id: "$.data.id" }
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "${vendor_id}", name: "Elm Street Dental", state_code: "IL", charts_total_expected: 5000 }
              as: DsoIntegrationLead
              captures: { prac_id: "$.data.id" }
            - call: "POST /dso/doctors"
              payload: { full_name: "Wes Nolan", npi: "1710000031", license_number: "WI-DDS-7788", license_state: "WI", specialty: "GENERAL", is_seller_owner: false }
              as: DsoIntegrationLead
              captures: { doc_wi_id: "$.data.id" }
            - call: "POST /dso/doctors"
              payload: { full_name: "Ana Reyes", npi: "1710000001", license_number: "IL-DDS-4410", license_state: "IL", specialty: "GENERAL", is_seller_owner: true }
              as: DsoIntegrationLead
              captures: { doc_il_id: "$.data.id" }
          trigger:
            - call: "POST /dso/doctor-employments"
              payload: { practice_id: "${prac_id}", doctor_id: "${doc_wi_id}", base_salary_monthly_cents: 1800000, collections_pct_bps: 3000, legacy_annual_comp_cents: 24000000, post_close_term_months: 36, non_compete_months: 24, non_compete_radius_miles: 10 }
              as: DsoIntegrationLead
              captures: { err: "$.data.error_id" }
            - call: "POST /dso/doctor-employments"
