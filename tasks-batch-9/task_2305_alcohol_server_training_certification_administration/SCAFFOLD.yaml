scenario: "2305. Alcohol Server Training & Certification Administration (TIPS training program): course catalog by state approval and on-premise/off-premise track, trainer certification and class roster management, exam proctoring, passing threshold and retake policy, certificate issuance with expiration and state registry submission, employer account enrollment with compliance dashboards by location, state-mandated versus voluntary training rule mapping, dram-shop insurance discount documentation, recertification reminder and lapsed-server work restriction"
domain_name: "alcohol-server-training-certification"
api_prefix: ""   # routes are mounted at root; every collection is a top-level path segment

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: CourseApproval is a Course x StateJurisdiction junction, Enrollment is a
  # ClassSession x AlcoholServer junction, ServerAssignment is an EmployerLocation x
  # AlcoholServer junction; Course and Certificate are additionally self-referential.

  state_machine_shape: cyclic
  # Enrollment loops EXAM_SCHEDULED -> EXAM_IN_PROGRESS -> EXAM_FAILED -> EXAM_IN_PROGRESS
  # (retakes), CourseApproval loops SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED (review
  # rounds), Trainer loops CERTIFIED -> LAPSED -> CERTIFIED (re-credentialing),
  # AlcoholServer loops ELIGIBLE -> GRACE -> RESTRICTED -> ELIGIBLE (recertification).
  # Certificate additionally carries two independent state dimensions
  # (validity_state x registry_state) on the same row.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The provider side (ProgramAdmin) submits course approvals and never decides them;
  # the StateRegulator decides approvals and acknowledges registry submissions and can
  # never author catalog content. Within a class, the instructing Trainer cannot proctor
  # the exam when the jurisdiction requires proctor separation, and only the assigned
  # proctor may open or submit exam attempts.

  consistency_model: immediate
  # All derived fields (roster counts, seat-credit ledger, server eligibility, location
  # compliance metrics, account rate, dram-shop document state) are recomputed inside the
  # mutating request. The ONLY exception is the passage of time: expiry/lapse/reminder
  # transitions are epoch-driven and happen exclusively inside POST /compliance-runs.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: StateJurisdiction
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code; unique across all StateJurisdiction rows"
        constraints: "exactly 2 uppercase letters; unique"
      - name: mandate_type
        type: enum
        source: input
        description: "State-mandated versus voluntary training rule mapping"
        constraints: "MANDATORY | CONDITIONAL | VOLUNTARY"
      - name: mandated_tracks
        type: array
        source: input
        description: "Tracks for which server training is legally required in this state"
        constraints: "subset of [ON_PREMISE, OFF_PREMISE]; MANDATORY requires exactly 2 entries, CONDITIONAL exactly 1, VOLUNTARY exactly 0"
      - name: certificate_validity_months
        type: integer
        source: input
        description: "Months a certificate stays valid from its anchor instant"
        default: 36
        constraints: "1..120"
      - name: renewal_grace_days
        type: integer
        source: input
        description: "Days after expires_at during which a certificate is GRACE rather than LAPSED"
        default: 30
        constraints: "0..180"
      - name: new_hire_training_days
        type: integer
        source: input
        description: "Days an UNCERTIFIED server may work at a mandated location after assignment"
        default: 30
        constraints: "0..180"
      - name: registry_submission_required
        type: boolean
        source: input
        description: "Whether issued certificates must be submitted to the state registry"
        default: true
      - name: registry_deadline_days
        type: integer
        source: input
        description: "Days after issuance by which the registry submission is due"
        default: 30
        constraints: "1..365"
      - name: registry_late_fee_cents_per_day
        type: integer
        source: input
        description: "Per-day late fee applied to a late registry submission"
        default: 250
        constraints: ">= 0"
      - name: min_passing_score_pct
        type: number
        source: input
        description: "Passing threshold; an attempt passes when score_pct >= this value"
        default: 70
        constraints: "50.00..100.00, 2 decimals"
      - name: max_retakes_allowed
        type: integer
        source: input
        description: "Retakes allowed after the first counted attempt (total counted attempts = 1 + this)"
        default: 2
        constraints: "0..5"
      - name: retake_cooling_off_hours
        type: integer
        source: input
        description: "Hours that must elapse after a counted failed attempt before the next attempt"
        default: 24
        constraints: "0..168"
      - name: proctor_separation_required
        type: boolean
        source: input
        description: "When true, the session's instructing trainer may not be its exam proctor"
        default: true
      - name: reminder_lead_days
        type: integer
        source: input
        description: "Recertification reminder window before expires_at"
        default: 60
        constraints: "0..365"
      - name: certificates_issued_count
        type: integer
        source: system
        description: "Monotonic issuance counter used to mint certificate_number for this state"
        default: 0

  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Catalog title"
        constraints: "1..160 chars"
      - name: track
        type: enum
        source: input
        description: "On-premise versus off-premise curriculum track"
        constraints: "ON_PREMISE | OFF_PREMISE"
      - name: delivery_mode
        type: enum
        source: input
        description: "How the course is delivered"
        constraints: "CLASSROOM | ONLINE"
      - name: contact_hours
        type: number
        source: input
        description: "Instructional hours of the course"
        constraints: "> 0, <= 24, 2 decimals"
      - name: question_count
        type: integer
        source: input
        description: "Exam question count; snapshotted onto each ExamAttempt"
        constraints: "10..200"
      - name: version_label
        type: string
        source: input
        description: "Human-readable catalog version label"
        constraints: "1..32 chars"
      - name: supersedes_course_id
        type: string
        source: input
        description: "FK -> Course.id; the older catalog entry this course replaces when published (self-referential, nullable)"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Catalog lifecycle state"
        default: "DRAFT"
        constraints: "DRAFT | PUBLISHED | RETIRED"
      - name: content_revision_count
        type: integer
        source: computed
        description: "Number of accepted PATCH content revisions"
        default: 0
      - name: retired_at
        type: datetime
        source: computed
        description: "Logical clock instant at which this course was retired by a superseding publish"
        default: null

  - name: CourseApproval
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the course being approved"
      - name: state_jurisdiction_id
        type: string
        source: input
        description: "FK -> StateJurisdiction.id; the approving state"
      - name: approval_status
        type: enum
        source: computed
        description: "Approval lifecycle state"
        default: "SUBMITTED"
        constraints: "SUBMITTED | CHANGES_REQUESTED | APPROVED | REJECTED | STALE | SUPERSEDED | EXPIRED"
      - name: approval_number
        type: string
        source: input
        description: "State-issued approval number, set on the APPROVE decision"
        default: null
      - name: effective_from
        type: datetime
        source: input
        description: "First instant the approval covers class sessions; set on APPROVE"
        default: null
      - name: expires_at
        type: datetime
        source: input
        description: "Instant the approval stops covering class sessions (exclusive); set on APPROVE"
        default: null
      - name: review_round
        type: integer
        source: computed
        description: "Review round counter; starts at 1 and increments on each resubmit"
        default: 1
      - name: pinned_course_version
        type: integer
        source: computed
        description: "Course.version captured at the APPROVE decision; content drift invalidates the approval"
        default: null
      - name: submission_note
        type: string
        source: input
        description: "Provider note attached to the current submission"
        default: null
      - name: changes_requested_note
        type: string
        source: input
        description: "Regulator note attached to a REQUEST_CHANGES decision"
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical clock instant of the most recent regulator decision"
        default: null

  - name: Trainer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Trainer legal name"
        constraints: "1..120 chars"
      - name: email
        type: string
        source: input
        description: "Login/contact email; unique across Trainer rows"
        constraints: "unique, contains '@'"
      - name: trainer_status
        type: enum
        source: computed
        description: "Trainer credential state"
        default: "PROVISIONAL"
        constraints: "PROVISIONAL | CERTIFIED | SUSPENDED | LAPSED"
      - name: certified_tracks
        type: array
        source: input
        description: "Tracks this trainer may instruct or proctor"
        default: []
        constraints: "subset of [ON_PREMISE, OFF_PREMISE]"
      - name: certified_state_codes
        type: array
        source: input
        description: "State codes this trainer is credentialed in"
        default: []
      - name: credential_expires_at
        type: datetime
        source: input
        description: "Credential expiry; a session's scheduled_end_at must be strictly before it"
        default: null
      - name: sessions_taught_count
        type: integer
        source: computed
        description: "Count of ClassSession rows with session_status COMPLETED where trainer_id is this trainer"
        default: 0
      - name: graded_enrollments_count
        type: integer
        source: computed
        description: "Count of Enrollment rows in {PASSED, EXAM_FAILED} on this trainer's COMPLETED sessions"
        default: 0
      - name: pass_rate_pct
        type: number
        source: computed
        description: "PASSED / (PASSED + EXAM_FAILED) over this trainer's COMPLETED sessions, 2 decimals; 0.00 when graded_enrollments_count == 0"
        default: 0
      - name: suspension_reason
        type: string
        source: input
        description: "Reason recorded on suspension"
        default: null

  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the curriculum being delivered"
      - name: state_jurisdiction_id
        type: string
        source: input
        description: "FK -> StateJurisdiction.id; the jurisdiction whose rules govern this class"
      - name: trainer_id
        type: string
        source: input
        description: "FK -> Trainer.id; the instructing trainer"
      - name: proctor_trainer_id
        type: string
        source: input
        description: "FK -> Trainer.id; the exam proctor, set by the open-exam transition (nullable before that)"
        default: null
      - name: pinned_course_approval_id
        type: string
        source: computed
        description: "FK -> CourseApproval.id; the APPROVED approval selected at creation and frozen onto the session"
      - name: pinned_course_version
        type: integer
        source: computed
        description: "Course.version captured at session creation"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Class window start (inclusive)"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Class window end (exclusive); must be strictly after scheduled_start_at"
      - name: capacity
        type: integer
        source: input
        description: "Maximum simultaneous non-withdrawn enrollments"
        constraints: "1..40"
      - name: enrolled_count
        type: integer
        source: computed
        description: "Count of Enrollment rows on this session whose enrollment_state != WITHDRAWN"
        default: 0
      - name: passed_count
        type: integer
        source: computed
        description: "Count of Enrollment rows on this session in enrollment_state PASSED"
        default: 0
      - name: session_status
        type: enum
        source: computed
        description: "Roster/exam lifecycle state"
        default: "SCHEDULED"
        constraints: "SCHEDULED | ROSTER_LOCKED | EXAM_OPEN | COMPLETED | CANCELLED"
      - name: exam_opened_at
        type: datetime
        source: computed
        description: "Logical clock instant the exam window opened"
        default: null
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical clock instant the session completed"
        default: null
      - name: cancellation_reason
        type: string
        source: input
        description: "Reason recorded on cancellation (system-supplied for cascaded cancellations)"
        default: null

  - name: AlcoholServer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Server legal name"
        constraints: "1..120 chars"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across AlcoholServer rows"
        constraints: "unique, contains '@'"
      - name: state_jurisdiction_id
        type: string
        source: input
        description: "FK -> StateJurisdiction.id; the server's home jurisdiction"
      - name: active_certificate_id
        type: string
        source: computed
        description: "FK -> Certificate.id; the governing certificate selected by the certificate_selector rule (nullable)"
        default: null
      - name: work_eligibility
        type: enum
        source: computed
        description: "Derived work eligibility used by every compliance count"
        default: "UNCERTIFIED"
        constraints: "UNCERTIFIED | ELIGIBLE | GRACE | RESTRICTED"
      - name: certification_count
        type: integer
        source: computed
        description: "Count of Certificate rows issued to this server"
        default: 0
      - name: restricted_since
        type: datetime
        source: computed
        description: "Logical clock instant work_eligibility last became RESTRICTED"
        default: null

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: class_session_id
        type: string
        source: input
        description: "FK -> ClassSession.id; the roster this enrollment belongs to"
      - name: alcohol_server_id
        type: string
        source: input
        description: "FK -> AlcoholServer.id; the enrolled server"
      - name: sponsoring_employer_account_id
        type: string
        source: input
        description: "FK -> EmployerAccount.id; the employer paying with seat credits (nullable => self-pay)"
        default: null
      - name: enrollment_state
        type: enum
        source: computed
        description: "Roster/exam state of this seat"
        default: "REGISTERED"
        constraints: "REGISTERED | ATTENDED | NO_SHOW | EXAM_SCHEDULED | EXAM_IN_PROGRESS | EXAM_FAILED | PASSED | INCOMPLETE | WITHDRAWN"
      - name: paid_by
        type: enum
        source: computed
        description: "Funding source resolved at creation"
        constraints: "EMPLOYER_CREDIT | SELF_PAY"
      - name: seat_credit_charged
        type: boolean
        source: computed
        description: "True when one seat credit was debited from the sponsoring account and not yet refunded"
        default: false
      - name: attempt_count
        type: integer
        source: computed
        description: "Count of ExamAttempt rows on this enrollment whose outcome != VOIDED"
        default: 0
      - name: best_score_pct
        type: number
        source: computed
        description: "Maximum score_pct over this enrollment's ExamAttempt rows with outcome in {PASS, FAIL}; null when none"
        default: null
      - name: last_counted_attempt_ended_at
        type: datetime
        source: computed
        description: "submitted_at of the most recent ExamAttempt with outcome in {PASS, FAIL}"
        default: null
      - name: retake_eligible_at
        type: datetime
        source: computed
        description: "last_counted_attempt_ended_at + jurisdiction.retake_cooling_off_hours; null when no counted attempt exists"
        default: null
      - name: withdrawal_reason
        type: string
        source: input
        description: "Reason recorded on withdrawal (system-supplied for cascaded withdrawals)"
        default: null

  - name: ExamAttempt
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the seat being examined"
      - name: attempt_number
        type: integer
        source: computed
        description: "1 + count of prior ExamAttempt rows on this enrollment with outcome != VOIDED"
      - name: question_count
        type: integer
        source: computed
        description: "Course.question_count snapshotted at attempt creation"
      - name: raw_correct_count
        type: integer
        source: input
        description: "Correct answers reported at submit"
        default: null
        constraints: "0..question_count"
      - name: score_pct
        type: number
        source: computed
        description: "round_half_up(raw_correct_count / question_count * 100, 2); null until submitted"
        default: null
      - name: outcome
        type: enum
        source: computed
        description: "Attempt result; VOIDED attempts do not count toward the retake cap"
        default: "IN_PROGRESS"
        constraints: "IN_PROGRESS | PASS | FAIL | VOIDED"
      - name: proctor_attestation
        type: boolean
        source: input
        description: "Proctor's attestation that the attempt was supervised; false voids the attempt"
        default: null
      - name: started_at
        type: datetime
        source: computed
        description: "Logical clock instant the attempt opened"
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical clock instant the attempt was submitted"
        default: null
      - name: void_reason
        type: string
        source: computed
        description: "Set to PROCTOR_ATTESTATION_WITHHELD when the attempt is voided"
        default: null

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: alcohol_server_id
        type: string
        source: input
        description: "FK -> AlcoholServer.id; the certificate holder"
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the passing seat that produced this certificate"
      - name: state_jurisdiction_id
        type: string
        source: input
        description: "FK -> StateJurisdiction.id; the issuing jurisdiction (the session's jurisdiction)"
      - name: renews_certificate_id
        type: string
        source: computed
        description: "FK -> Certificate.id; the prior certificate this issuance renews (self-referential, nullable)"
        default: null
      - name: certificate_number
        type: string
        source: system
        description: "'{state_code}-{issued_year}-{sequence:05d}' where sequence is jurisdiction.certificates_issued_count after increment"
      - name: track
        type: enum
        source: computed
        description: "Course.track snapshotted at issuance"
        constraints: "ON_PREMISE | OFF_PREMISE"
      - name: issued_at
        type: datetime
        source: computed
        description: "Logical clock instant of the issuing session completion"
      - name: expires_at
        type: datetime
        source: computed
        description: "Expiry computed by certificate_expiry_and_anchor"
      - name: expiry_anchor_mode
        type: enum
        source: computed
        description: "Which expiry variant produced expires_at"
        constraints: "ISSUANCE_ANCHORED | ANNIVERSARY_ANCHORED"
      - name: validity_state
        type: enum
        source: computed
        description: "Validity dimension; evolves independently of registry_state"
        default: "ACTIVE"
        constraints: "ACTIVE | GRACE | LAPSED | SUSPENDED | SUPERSEDED"
      - name: registry_state
        type: enum
        source: computed
        description: "State-registry dimension; evolves independently of validity_state"
        constraints: "NOT_REQUIRED | PENDING_SUBMISSION | SUBMITTED | ACCEPTED | RESUBMIT_REQUIRED"
      - name: registry_due_at
        type: datetime
        source: computed
        description: "issued_at + jurisdiction.registry_deadline_days; null when registry_state is NOT_REQUIRED"
        default: null
      - name: reminder_sent_count
        type: integer
        source: computed
        description: "Recertification reminders emitted by compliance runs (max 2)"
        default: 0
      - name: last_reminder_at
        type: datetime
        source: computed
        description: "Logical clock instant of the most recent reminder"
        default: null

  - name: RegistrySubmission
    parent: null
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: input
        description: "FK -> Certificate.id; the certificate transmitted to the state registry"
      - name: batch_reference
        type: string
        source: input
        description: "Provider batch reference for this transmission"
        default: null
      - name: submission_state
        type: enum
        source: computed
        description: "Transmission state"
        default: "TRANSMITTED"
        constraints: "TRANSMITTED | ACCEPTED | REJECTED"
      - name: attempt_number
        type: integer
        source: computed
        description: "1 + count of prior RegistrySubmission rows for this certificate"
      - name: transmitted_at
        type: datetime
        source: computed
        description: "Logical clock instant of transmission"
      - name: due_at
        type: datetime
        source: computed
        description: "Certificate.registry_due_at snapshotted at transmission"
      - name: late_days
        type: integer
        source: computed
        description: "Whole days late per registry_submission_penalty (0 when on time)"
        default: 0
      - name: penalty_fee_cents
        type: integer
        source: computed
        description: "Late fee for this transmission per registry_submission_penalty"
        default: 0
      - name: rejection_code
        type: enum
        source: input
        description: "Registry rejection reason recorded on a REJECTED acknowledgement"
        default: "NONE"
        constraints: "NONE | DUPLICATE_SERVER_RECORD | INVALID_COURSE_APPROVAL | NAME_MISMATCH"
      - name: acknowledged_at
        type: datetime
        source: computed
        description: "Logical clock instant the registry acknowledged this transmission"
        default: null

  - name: EmployerAccount
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Employer legal name"
        constraints: "1..160 chars"
      - name: billing_state_code
        type: string
        source: input
        description: "Billing state code (informational; not a jurisdiction reference)"
        constraints: "exactly 2 uppercase letters"
      - name: account_status
        type: enum
        source: computed
        description: "Billing/standing state"
        default: "ACTIVE"
        constraints: "ACTIVE | DELINQUENT | SUSPENDED"
      - name: seat_credit_balance
        type: integer
        source: computed
        description: "Prepaid seats available; equals seat_credits_purchased_total - seat_credits_consumed_total + seat_credits_refunded_total"
        default: 0
      - name: seat_credits_purchased_total
        type: integer
        source: computed
        description: "Lifetime granted seats (purchased quantity plus volume bonus credits)"
        default: 0
      - name: seat_credits_consumed_total
        type: integer
        source: computed
        description: "Lifetime seats debited by employer-sponsored enrollments"
        default: 0
      - name: seat_credits_refunded_total
        type: integer
        source: computed
        description: "Lifetime seats credited back by withdrawals and cascaded cancellations"
        default: 0
      - name: last_purchase_discount_pct
        type: number
        source: computed
        description: "volume_discount_pct of the most recent purchase, 2 decimals"
        default: 0
      - name: last_purchase_total_charged_cents
        type: integer
        source: computed
        description: "total_charged_cents of the most recent purchase"
        default: 0
      - name: lifetime_charged_cents
        type: integer
        source: computed
        description: "Sum of total_charged_cents over all purchases"
        default: 0
      - name: location_count
        type: integer
        source: computed
        description: "Count of EmployerLocation rows under this account"
        default: 0
      - name: account_compliance_rate_pct
        type: number
        source: computed
        description: "Strict compliance rate across all locations of this account, 2 decimals; 0.00 when the account has no live assignment"
        default: 0
      - name: dram_shop_discount_status
        type: enum
        source: computed
        description: "Dram-shop documentation standing"
        default: "NOT_DOCUMENTED"
        constraints: "NOT_DOCUMENTED | ELIGIBLE | DOCUMENTED | EXPIRED"
      - name: first_documented_at
        type: datetime
        source: computed
        description: "Logical clock instant of the first ISSUED DramShopDocument; drives the tenure bonus"
        default: null
      - name: status_reason
        type: string
        source: input
        description: "Reason recorded on the most recent account_status change"
        default: null

  - name: EmployerLocation
    parent: EmployerAccount
    common_fields: true
    fields:
      - name: employer_account_id
        type: string
        source: input
        description: "FK -> EmployerAccount.id; owning account"
      - name: location_name
        type: string
        source: input
        description: "Location name"
        constraints: "1..120 chars"
      - name: state_jurisdiction_id
        type: string
        source: input
        description: "FK -> StateJurisdiction.id; the jurisdiction whose mandate mapping governs this location"
      - name: premise_type
        type: enum
        source: input
        description: "On-premise or off-premise operation"
        constraints: "ON_PREMISE | OFF_PREMISE"
      - name: annual_premium_cents
        type: integer
        source: input
        description: "Annual dram-shop liability premium used by the discount-credit calculation"
        constraints: "0..100000000"
      - name: training_requirement
        type: enum
        source: computed
        description: "MANDATED when premise_type is in jurisdiction.mandated_tracks, else VOLUNTARY"
        constraints: "MANDATED | VOLUNTARY"
      - name: assigned_server_count
        type: integer
        source: computed
        description: "Count of ServerAssignment rows here with assignment_state in {ACTIVE, WORK_RESTRICTED}"
        default: 0
      - name: compliant_server_count
        type: integer
        source: computed
        description: "Of those, count whose server work_eligibility == ELIGIBLE"
        default: 0
      - name: grace_server_count
        type: integer
        source: computed
        description: "Of those, count whose server work_eligibility == GRACE"
        default: 0
      - name: restricted_server_count
        type: integer
        source: computed
        description: "Of those, count with assignment_state == WORK_RESTRICTED"
        default: 0
      - name: compliance_rate_strict_pct
        type: number
        source: computed
        description: "STRICT variant of location_compliance_metrics, 2 decimals"
        default: 100
      - name: compliance_rate_grace_inclusive_pct
        type: number
        source: computed
        description: "GRACE_INCLUSIVE variant of location_compliance_metrics, 2 decimals"
        default: 100
      - name: compliance_posture
        type: enum
        source: computed
        description: "Posture thresholded off compliance_rate_grace_inclusive_pct; NOT_APPLICABLE when training_requirement == VOLUNTARY"
        default: "NOT_APPLICABLE"
        constraints: "COMPLIANT | AT_RISK | NON_COMPLIANT | NOT_APPLICABLE"

  - name: ServerAssignment
    parent: EmployerLocation
    common_fields: true
    fields:
      - name: employer_location_id
        type: string
        source: input
        description: "FK -> EmployerLocation.id; the work location"
      - name: alcohol_server_id
        type: string
        source: input
        description: "FK -> AlcoholServer.id; the assigned server"
      - name: role_title
        type: string
        source: input
        description: "Job title at the location"
        constraints: "1..80 chars"
      - name: assignment_state
        type: enum
        source: computed
        description: "Staffing state; WORK_RESTRICTED means the server may not serve alcohol here"
        default: "ACTIVE"
        constraints: "ACTIVE | WORK_RESTRICTED | ENDED"
      - name: restriction_reason
        type: enum
        source: computed
        description: "Why the assignment is work-restricted"
        default: "NONE"
        constraints: "NONE | CERTIFICATE_LAPSED | REGISTRY_SUSPENDED | NO_CERTIFICATE"
      - name: assigned_at
        type: datetime
        source: computed
        description: "Logical clock instant of assignment creation; starts the new-hire training window"
      - name: restricted_at
        type: datetime
        source: computed
        description: "Logical clock instant the assignment last became WORK_RESTRICTED"
        default: null
      - name: ended_at
        type: datetime
        source: computed
        description: "Logical clock instant the assignment ended"
        default: null
      - name: end_reason
        type: string
        source: input
        description: "Reason recorded when the assignment is ended"
        default: null

  - name: DramShopDocument
    parent: EmployerAccount
    common_fields: true
    fields:
      - name: employer_account_id
        type: string
        source: input
        description: "FK -> EmployerAccount.id; the documented account"
      - name: insurer_name
        type: string
        source: input
        description: "Dram-shop carrier name"
        constraints: "1..120 chars"
      - name: policy_number
        type: string
        source: input
        description: "Carrier policy number"
        constraints: "1..64 chars"
      - name: coverage_period_start
        type: datetime
        source: input
        description: "Coverage window start (inclusive)"
      - name: coverage_period_end
        type: datetime
        source: input
        description: "Coverage window end (exclusive); must be strictly after coverage_period_start"
      - name: snapshot_at
        type: datetime
        source: computed
        description: "Logical clock instant the compliance snapshot was taken"
      - name: document_state
        type: enum
        source: computed
        description: "Documentation state"
        default: "ISSUED"
        constraints: "ISSUED | SUPERSEDED | VOIDED"
      - name: strict_compliance_rate_pct
        type: number
        source: computed
        description: "EmployerAccount.account_compliance_rate_pct snapshotted at issuance"
      - name: months_documented
        type: integer
        source: computed
        description: "Whole months between account.first_documented_at and snapshot_at; 0 for the first document"
        default: 0
      - name: discount_tier
        type: enum
        source: computed
        description: "Tier selected by dram_shop_discount_pct"
        constraints: "NONE | TIER_1 | TIER_2 | TIER_3"
      - name: discount_pct
        type: number
        source: computed
        description: "Certified discount percentage, 2 decimals"
      - name: discount_credit_cents
        type: integer
        source: computed
        description: "Premium credit per dram_shop_discount_credit (per-location rounding then sum)"
      - name: location_count
        type: integer
        source: computed
        description: "EmployerLocation rows included in the credit computation"
      - name: void_reason
        type: string
        source: computed
        description: "COMPLIANCE_RATE_FELL_BELOW_FLOOR or COVERAGE_PERIOD_ENDED when voided"
        default: null

  - name: ComplianceRun
    parent: null
    common_fields: false
    fields:
      - name: run_at
        type: datetime
        source: computed
        description: "Logical clock instant of the run; the epoch every time-based transition is evaluated against"
      - name: trainers_lapsed_count
        type: integer
        source: computed
        description: "Phase 1 count: CERTIFIED -> LAPSED trainers"
      - name: approvals_expired_count
        type: integer
        source: computed
        description: "Phase 2 count: APPROVED -> EXPIRED course approvals"
      - name: certificates_graced_count
        type: integer
        source: computed
        description: "Phase 3 count: ACTIVE -> GRACE certificates"
      - name: certificates_lapsed_count
        type: integer
        source: computed
        description: "Phase 3 count: GRACE -> LAPSED certificates"
      - name: reminders_sent_count
        type: integer
        source: computed
        description: "Phase 4 count: recertification reminders emitted"
      - name: assignments_restricted_count
        type: integer
        source: computed
        description: "Phase 6 count: ACTIVE -> WORK_RESTRICTED assignments"
      - name: assignments_restored_count
        type: integer
        source: computed
        description: "Phase 6 count: WORK_RESTRICTED -> ACTIVE assignments"
      - name: locations_recomputed_count
        type: integer
        source: computed
        description: "Phase 7 count: EmployerLocation rows whose metrics were recomputed"
      - name: documents_voided_count
        type: integer
        source: computed
        description: "Phase 8 count: ISSUED -> VOIDED dram-shop documents"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
# Shared recompute chain R (referenced by name from side_effects below). R runs
# inside the mutating request, in this exact order, over the affected rows only:
#   R1: recompute AlcoholServer.active_certificate_id via certificate_selector, then
#       work_eligibility (no certificate -> UNCERTIFIED; governing certificate
#       ACTIVE -> ELIGIBLE; GRACE -> GRACE; LAPSED or SUSPENDED -> RESTRICTED).
#   R2: for each ServerAssignment of that server with assignment_state in
#       {ACTIVE, WORK_RESTRICTED} whose location has training_requirement == MANDATED:
#       eligibility RESTRICTED -> WORK_RESTRICTED (restriction_reason CERTIFICATE_LAPSED
#       when the governing certificate is LAPSED, REGISTRY_SUSPENDED when it is
#       SUSPENDED); eligibility UNCERTIFIED and clock >= assigned_at +
#       new_hire_training_days -> WORK_RESTRICTED (NO_CERTIFICATE); eligibility in
#       {ELIGIBLE, GRACE} and state == WORK_RESTRICTED -> ACTIVE (reason NONE).
#       Locations with training_requirement == VOLUNTARY are never restricted.
#   R3: recompute the touched EmployerLocation counts, both compliance rates and
#       compliance_posture (location_compliance_metrics).
#   R4: recompute the owning EmployerAccount.location_count and
#       account_compliance_rate_pct; when dram_shop_discount_status == NOT_DOCUMENTED
#       and account_compliance_rate_pct >= 80.00, set it to ELIGIBLE.
#   R5: if the account has a DramShopDocument in document_state ISSUED and
#       account_compliance_rate_pct < 80.00, set that document to VOIDED
#       (void_reason COMPLIANCE_RATE_FELL_BELOW_FLOOR) and set
#       dram_shop_discount_status = EXPIRED.
state_machines:
  - entity: Course
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /courses/{id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "course.status == DRAFT"
          - "if supersedes_course_id is not null, that course exists and its status == PUBLISHED"
        side_effects:
          - "sets status = PUBLISHED, increments Course.version by 1"
          - "cascade hop 1: when supersedes_course_id is not null, the superseded Course moves PUBLISHED -> RETIRED with retired_at = clock"
          - "cascade hop 2: because that course is now RETIRED, every CourseApproval of it in approval_status APPROVED moves APPROVED -> SUPERSEDED"
          - "cascade hop 3: because those approvals are now SUPERSEDED, every ClassSession whose pinned_course_approval_id is one of them and whose session_status is SCHEDULED or ROSTER_LOCKED moves to CANCELLED with cancellation_reason = 'COURSE_SUPERSEDED', processed in ascending ClassSession.created_at"
          - "cascade hop 4: because those sessions are now CANCELLED, each of their Enrollment rows with enrollment_state != WITHDRAWN moves to WITHDRAWN (withdrawal_reason = 'SESSION_CANCELLED'), processed in ascending Enrollment.created_at, and each session's enrolled_count becomes 0"
          - "cascade hop 5: because those enrollments are now WITHDRAWN, every one with seat_credit_charged == true refunds one seat credit to its sponsoring EmployerAccount (seat_credits_refunded_total += 1, seat_credit_balance += 1, seat_credit_charged = false)"
      - from: PUBLISHED
        to: PUBLISHED
        trigger: "PATCH /courses/{id} (content revision)"
        actor: ProgramAdmin
        preconditions:
          - "course.status in {DRAFT, PUBLISHED}"
          - "expected_course_version == course.version"
        side_effects:
          - "applies supplied field changes, content_revision_count += 1, increments Course.version by 1"
          - "every CourseApproval of this course in approval_status APPROVED moves APPROVED -> STALE (its pinned_course_version no longer equals course.version)"
        note: "Sessions already pinned to a now-STALE approval keep their pin; open-exam then fails ERR_APPROVAL_STALE_CONTENT."
      - from: PUBLISHED
        to: RETIRED
        trigger: "system: a superseding Course is published"
        actor: system
        preconditions:
          - "another Course with supersedes_course_id == this course's id moves DRAFT -> PUBLISHED"
        side_effects:
          - "sets retired_at = clock; drives cascade hops 2-5 documented on the DRAFT -> PUBLISHED transition"

  - entity: CourseApproval
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /course-approvals/{id}/decision (decision = APPROVE)"
        actor: StateRegulator
        preconditions:
          - "approval.approval_status == SUBMITTED"
          - "course.status == PUBLISHED"
          - "approval_number, effective_from and expires_at supplied with expires_at > effective_from"
        side_effects:
          - "sets approval_number, effective_from, expires_at, decided_at = clock"
          - "pins pinned_course_version = course.version"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /course-approvals/{id}/decision (decision = REQUEST_CHANGES)"
        actor: StateRegulator
        preconditions:
          - "approval.approval_status == SUBMITTED"
        side_effects:
          - "records changes_requested_note, decided_at = clock"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /course-approvals/{id}/decision (decision = REJECT)"
        actor: StateRegulator
        preconditions:
          - "approval.approval_status == SUBMITTED"
        side_effects:
          - "records decided_at = clock; the (course, jurisdiction) pair is free for a new submission"
        note: "Branch set differs per decision: APPROVE pins a course version, REQUEST_CHANGES keeps the round open, REJECT closes it."
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /course-approvals/{id}/resubmit"
        actor: ProgramAdmin
        preconditions:
          - "approval.approval_status in {CHANGES_REQUESTED, STALE}"
          - "course.status == PUBLISHED"
        side_effects:
          - "review_round += 1, records submission_note"
          - "when the resulting review_round > MAX_REVIEW_ROUNDS (3) the approval moves directly to REJECTED instead of SUBMITTED"
      - from: STALE
        to: SUBMITTED
        trigger: "POST /course-approvals/{id}/resubmit"
        actor: ProgramAdmin
        preconditions:
          - "approval.approval_status == STALE"
        side_effects:
          - "review_round += 1; pinned_course_version is cleared until the next APPROVE decision"
      - from: APPROVED
        to: STALE
        trigger: "system: PATCH /courses/{id} content revision on the approved course"
        actor: system
        preconditions:
          - "approval.approval_status == APPROVED and approval.pinned_course_version != course.version after the revision"
        side_effects:
          - "no session repinning occurs; sessions pinned to this approval fail open-exam with ERR_APPROVAL_STALE_CONTENT"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: the approved course is RETIRED by a superseding publish"
        actor: system
        preconditions:
          - "approval.approval_status == APPROVED and course.status becomes RETIRED"
        side_effects:
          - "drives cancellation of SCHEDULED/ROSTER_LOCKED sessions pinned to this approval (cascade hops 3-5 on Course)"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /compliance-runs (phase 2)"
        actor: system
        preconditions:
          - "approval.approval_status == APPROVED and clock >= approval.expires_at"
        side_effects:
          - "increments ComplianceRun.approvals_expired_count; already-created sessions keep their pin and remain schedulable"

  - entity: Trainer
    initial_state: PROVISIONAL
    terminal_states: [SUSPENDED]
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /trainers/{id}/credential"
        actor: ProgramAdmin
        preconditions:
          - "trainer.trainer_status in {PROVISIONAL, CERTIFIED, LAPSED}"
          - "credential_expires_at > clock"
          - "certified_tracks non-empty and certified_state_codes non-empty"
        side_effects:
          - "sets certified_tracks, certified_state_codes, credential_expires_at"
      - from: LAPSED
        to: CERTIFIED
        trigger: "POST /trainers/{id}/credential (re-credentialing)"
        actor: ProgramAdmin
        preconditions:
          - "trainer.trainer_status == LAPSED"
          - "credential_expires_at > clock"
        side_effects:
          - "restores instructing and proctoring eligibility; closes the CERTIFIED -> LAPSED -> CERTIFIED cycle"
      - from: CERTIFIED
        to: LAPSED
        trigger: "POST /compliance-runs (phase 1)"
        actor: system
        preconditions:
          - "trainer.trainer_status == CERTIFIED and clock >= trainer.credential_expires_at"
        side_effects:
          - "increments ComplianceRun.trainers_lapsed_count; already-scheduled sessions are left untouched"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /trainers/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "trainer.trainer_status != SUSPENDED"
        side_effects:
          - "cascade hop 1: every ClassSession with trainer_id == this trainer and session_status in {SCHEDULED, ROSTER_LOCKED} moves to CANCELLED (cancellation_reason = 'TRAINER_SUSPENDED'), in ascending ClassSession.created_at"
          - "cascade hop 2: because those sessions are CANCELLED, their non-WITHDRAWN Enrollment rows move to WITHDRAWN and each session's enrolled_count becomes 0"
          - "cascade hop 3: because those enrollments are WITHDRAWN, every charged seat credit is refunded to its sponsoring EmployerAccount"

  - entity: ClassSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ROSTER_LOCKED
        trigger: "POST /class-sessions/{id}/lock-roster"
        actor: Trainer
        preconditions:
          - "session.session_status == SCHEDULED"
          - "acting Trainer id == session.trainer_id (ProgramAdmin may act without ownership)"
          - "session.enrolled_count >= 1"
        side_effects:
          - "sets session_status = ROSTER_LOCKED; further enrollments are rejected with ERR_SESSION_INVALID_STATE"
      - from: ROSTER_LOCKED
        to: EXAM_OPEN
        trigger: "POST /class-sessions/{id}/open-exam"
        actor: Trainer
        preconditions:
          - "session.session_status == ROSTER_LOCKED"
          - "clock >= session.scheduled_start_at"
          - "no Enrollment on this session is in enrollment_state REGISTERED"
          - "pinned CourseApproval.approval_status == APPROVED"
          - "pinned CourseApproval.pinned_course_version == session.pinned_course_version"
          - "proctor trainer_status == CERTIFIED, session course track in proctor.certified_tracks, jurisdiction.state_code in proctor.certified_state_codes, proctor.credential_expires_at > clock"
          - "if jurisdiction.proctor_separation_required, proctor_trainer_id != session.trainer_id"
        side_effects:
          - "sets proctor_trainer_id, exam_opened_at = clock, session_status = EXAM_OPEN"
          - "every Enrollment on this session in enrollment_state ATTENDED moves to EXAM_SCHEDULED"
      - from: EXAM_OPEN
        to: COMPLETED
        trigger: "POST /class-sessions/{id}/complete"
        actor: Trainer
        preconditions:
          - "session.session_status == EXAM_OPEN"
          - "no Enrollment on this session is in enrollment_state EXAM_IN_PROGRESS"
        side_effects:
          - "sets completed_at = clock, session_status = COMPLETED"
          - "Enrollment rows still in EXAM_SCHEDULED move to INCOMPLETE"
          - "for each Enrollment in PASSED, in ascending Enrollment.created_at: issues one Certificate (certificate_expiry_and_anchor decides expires_at and expiry_anchor_mode; jurisdiction.certificates_issued_count += 1 mints certificate_number; registry_state = PENDING_SUBMISSION when jurisdiction.registry_submission_required else NOT_REQUIRED; registry_due_at set accordingly), and marks the renewed prior Certificate (when any) validity_state = SUPERSEDED"
          - "recompute chain R runs for every certified server (R1 -> R2 -> R3 -> R4 -> R5)"
          - "recomputes trainer.sessions_taught_count, graded_enrollments_count and pass_rate_pct"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /class-sessions/{id}/cancel, or system cascade (course superseded / trainer suspended)"
        actor: Trainer
        preconditions:
          - "session.session_status in {SCHEDULED, ROSTER_LOCKED}"
        side_effects:
          - "sets cancellation_reason, session_status = CANCELLED"
          - "every Enrollment with enrollment_state != WITHDRAWN moves to WITHDRAWN, in ascending Enrollment.created_at; enrolled_count becomes 0"
          - "each of those enrollments with seat_credit_charged == true refunds one seat credit to its sponsoring EmployerAccount"
      - from: ROSTER_LOCKED
        to: CANCELLED
        trigger: "POST /class-sessions/{id}/cancel"
        actor: Trainer
        preconditions:
          - "session.session_status == ROSTER_LOCKED"
        side_effects:
          - "identical withdrawal and refund cascade as the SCHEDULED -> CANCELLED transition"

  - entity: Enrollment
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN, PASSED, NO_SHOW, INCOMPLETE]
    transitions:
      - from: REGISTERED
        to: ATTENDED
        trigger: "POST /enrollments/{id}/attendance (attended = true)"
        actor: Trainer
        preconditions:
          - "enrollment.enrollment_state == REGISTERED"
          - "session.session_status == ROSTER_LOCKED"
          - "acting Trainer id == session.trainer_id"
        side_effects: ["sets enrollment_state = ATTENDED"]
      - from: REGISTERED
        to: NO_SHOW
        trigger: "POST /enrollments/{id}/attendance (attended = false)"
        actor: Trainer
        preconditions:
          - "enrollment.enrollment_state == REGISTERED"
          - "session.session_status == ROSTER_LOCKED"
        side_effects:
          - "sets enrollment_state = NO_SHOW; the seat credit is NOT refunded (no-shows forfeit the seat)"
      - from: ATTENDED
        to: EXAM_SCHEDULED
        trigger: "system: POST /class-sessions/{id}/open-exam"
        actor: system
        preconditions: ["session moves ROSTER_LOCKED -> EXAM_OPEN"]
        side_effects: ["sets enrollment_state = EXAM_SCHEDULED"]
      - from: EXAM_SCHEDULED
        to: EXAM_IN_PROGRESS
        trigger: "POST /enrollments/{id}/exam-attempts"
        actor: Trainer
        preconditions:
          - "enrollment.enrollment_state in {EXAM_SCHEDULED, EXAM_FAILED}"
          - "session.session_status == EXAM_OPEN"
          - "acting Trainer id == session.proctor_trainer_id"
          - "attempt_count < 1 + jurisdiction.max_retakes_allowed"
          - "retake_eligible_at is null or clock >= retake_eligible_at"
        side_effects:
          - "creates ExamAttempt (attempt_number = attempt_count + 1, question_count snapshotted, outcome IN_PROGRESS, started_at = clock)"
          - "sets enrollment_state = EXAM_IN_PROGRESS"
      - from: EXAM_IN_PROGRESS
        to: EXAM_FAILED
        trigger: "POST /exam-attempts/{id}/submit (score below threshold, attestation true)"
        actor: Trainer
        preconditions:
          - "attempt.outcome == IN_PROGRESS"
          - "proctor_attestation == true and score_pct < jurisdiction.min_passing_score_pct"
        side_effects:
          - "attempt outcome = FAIL, score_pct set, submitted_at = clock"
          - "enrollment attempt_count += 1, best_score_pct recomputed, last_counted_attempt_ended_at = clock, retake_eligible_at = clock + retake_cooling_off_hours"
      - from: EXAM_FAILED
        to: EXAM_IN_PROGRESS
        trigger: "POST /enrollments/{id}/exam-attempts (retake)"
        actor: Trainer
        preconditions:
          - "enrollment.enrollment_state == EXAM_FAILED"
          - "attempt_count < 1 + jurisdiction.max_retakes_allowed"
          - "clock >= retake_eligible_at"
        side_effects: ["creates the next ExamAttempt; closes the retake cycle"]
      - from: EXAM_IN_PROGRESS
        to: PASSED
        trigger: "POST /exam-attempts/{id}/submit (score at or above threshold, attestation true)"
        actor: Trainer
        preconditions:
          - "attempt.outcome == IN_PROGRESS"
          - "proctor_attestation == true and score_pct >= jurisdiction.min_passing_score_pct"
        side_effects:
          - "attempt outcome = PASS; enrollment attempt_count += 1, best_score_pct recomputed"
          - "session.passed_count += 1; certificate issuance is deferred to session completion"
      - from: EXAM_IN_PROGRESS
        to: EXAM_SCHEDULED
        trigger: "POST /exam-attempts/{id}/submit (proctor_attestation = false)"
        actor: Trainer
        preconditions: ["attempt.outcome == IN_PROGRESS and proctor_attestation == false"]
        side_effects:
          - "attempt outcome = VOIDED, void_reason = PROCTOR_ATTESTATION_WITHHELD, score_pct set from raw_correct_count"
          - "enrollment returns to EXAM_SCHEDULED; attempt_count, best_score_pct, last_counted_attempt_ended_at and retake_eligible_at are unchanged (voided attempts never consume a retake)"
      - from: EXAM_SCHEDULED
        to: INCOMPLETE
        trigger: "system: POST /class-sessions/{id}/complete"
        actor: system
        preconditions: ["enrollment.enrollment_state == EXAM_SCHEDULED at completion"]
        side_effects: ["sets enrollment_state = INCOMPLETE; no certificate is issued"]
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw, or system cascade from session cancellation"
        actor: EmployerAdmin
        preconditions:
          - "enrollment.enrollment_state in {REGISTERED, ATTENDED, NO_SHOW}"
          - "session.session_status in {SCHEDULED, ROSTER_LOCKED}"
          - "acting EmployerAdmin id == enrollment.sponsoring_employer_account_id, or acting AlcoholServer id == enrollment.alcohol_server_id"
        side_effects:
          - "sets enrollment_state = WITHDRAWN, withdrawal_reason recorded"
          - "session.enrolled_count -= 1 and session.version += 1"
          - "when seat_credit_charged == true: sponsoring account seat_credits_refunded_total += 1, seat_credit_balance += 1, seat_credit_charged = false"

  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: GRACE
        trigger: "POST /compliance-runs (phase 3)"
        actor: system
        preconditions:
          - "validity_state == ACTIVE and clock >= expires_at"
        side_effects:
          - "sets validity_state = GRACE; recompute chain R sets the holder's work_eligibility = GRACE (grace servers count as compliant only in the GRACE_INCLUSIVE variant)"
          - "increments ComplianceRun.certificates_graced_count"
      - from: GRACE
        to: LAPSED
        trigger: "POST /compliance-runs (phase 3)"
        actor: system
        preconditions:
          - "validity_state == GRACE and clock >= expires_at + jurisdiction.renewal_grace_days"
        side_effects:
          - "cascade hop 1: sets validity_state = LAPSED and increments ComplianceRun.certificates_lapsed_count"
          - "cascade hop 2: because the governing certificate is LAPSED, chain R1 sets AlcoholServer.work_eligibility = RESTRICTED and restricted_since = clock"
          - "cascade hop 3: because the server is RESTRICTED, chain R2 moves each of its ServerAssignment rows at MANDATED locations from ACTIVE to WORK_RESTRICTED with restriction_reason = CERTIFICATE_LAPSED"
          - "cascade hop 4: because those assignments are WORK_RESTRICTED, chain R3 recomputes the locations' counts, both rates and compliance_posture, and chain R4 recomputes account_compliance_rate_pct"
          - "cascade hop 5: because the account rate fell below 80.00, chain R5 voids the account's ISSUED DramShopDocument (void_reason COMPLIANCE_RATE_FELL_BELOW_FLOOR) and sets dram_shop_discount_status = EXPIRED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: POST /registry-submissions/{id}/acknowledge (result = REJECTED)"
        actor: system
        preconditions:
          - "validity_state in {ACTIVE, GRACE} and jurisdiction.registry_submission_required == true"
        side_effects:
          - "cascade hop 1: registry_state moves SUBMITTED -> RESUBMIT_REQUIRED"
          - "cascade hop 2: because the registry refused the record, validity_state moves to SUSPENDED"
          - "cascade hop 3: because the governing certificate is SUSPENDED, chain R1 sets work_eligibility = RESTRICTED"
          - "cascade hop 4: because the server is RESTRICTED, chain R2 moves its MANDATED-location assignments to WORK_RESTRICTED with restriction_reason = REGISTRY_SUSPENDED, then R3/R4 recompute location and account metrics"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: POST /registry-submissions/{id}/acknowledge (result = ACCEPTED) on a later submission"
        actor: system
        preconditions:
          - "validity_state == SUSPENDED and clock < expires_at"
        side_effects:
          - "registry_state = ACCEPTED, validity_state = ACTIVE"
          - "chain R restores work_eligibility = ELIGIBLE, moves WORK_RESTRICTED assignments back to ACTIVE (reason NONE) and recomputes location/account metrics — the compensating counterpart of the rejection cascade"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a renewal Certificate is issued to the same holder"
        actor: system
        preconditions:
          - "a new Certificate is issued with renews_certificate_id == this certificate's id"
        side_effects:
          - "sets validity_state = SUPERSEDED; the certificate is excluded from certificate_selector candidates"
      - from: GRACE
        to: SUPERSEDED
        trigger: "system: a renewal Certificate is issued to the same holder"
        actor: system
        preconditions: ["a new Certificate renews this one while it is GRACE"]
        side_effects:
          - "sets validity_state = SUPERSEDED; the renewal uses the ANNIVERSARY_ANCHORED expiry variant"
      - from: LAPSED
        to: SUPERSEDED
        trigger: "system: a renewal Certificate is issued to the same holder"
        actor: system
        preconditions: ["a new Certificate renews this one while it is LAPSED"]
        side_effects:
          - "sets validity_state = SUPERSEDED; the renewal uses the ISSUANCE_ANCHORED expiry variant"
    note: |
      Certificate carries two independent state dimensions on the same row. The
      registry dimension (registry_state: NOT_REQUIRED | PENDING_SUBMISSION |
      SUBMITTED | ACCEPTED | RESUBMIT_REQUIRED) advances on POST
      /certificates/{id}/registry-submissions (PENDING_SUBMISSION or
      RESUBMIT_REQUIRED -> SUBMITTED) and POST /registry-submissions/{id}/acknowledge
      (SUBMITTED -> ACCEPTED or SUBMITTED -> RESUBMIT_REQUIRED). The validity
      dimension advances on compliance runs and renewals. A certificate may be
      ACTIVE/PENDING_SUBMISSION, GRACE/ACCEPTED, or SUSPENDED/RESUBMIT_REQUIRED;
      neither dimension constrains the other except via the two cross-dimension
      transitions listed above (rejection suspends, later acceptance restores).

  - entity: AlcoholServer
    initial_state: UNCERTIFIED
    terminal_states: []
    transitions:
      - from: UNCERTIFIED
        to: ELIGIBLE
        trigger: "system: first Certificate issued at session completion (chain R1)"
        actor: system
        preconditions: ["a Certificate with validity_state ACTIVE becomes the governing certificate"]
        side_effects: ["sets active_certificate_id, work_eligibility = ELIGIBLE, certification_count += 1"]
      - from: ELIGIBLE
        to: GRACE
        trigger: "system: governing certificate moves ACTIVE -> GRACE (chain R1)"
        actor: system
        preconditions: ["governing certificate validity_state == GRACE"]
        side_effects: ["sets work_eligibility = GRACE; assignments stay ACTIVE (grace servers may still work)"]
      - from: GRACE
        to: RESTRICTED
        trigger: "system: governing certificate moves GRACE -> LAPSED (chain R1)"
        actor: system
        preconditions: ["governing certificate validity_state in {LAPSED, SUSPENDED}"]
        side_effects: ["sets work_eligibility = RESTRICTED, restricted_since = clock; drives chain R2"]
      - from: RESTRICTED
        to: ELIGIBLE
        trigger: "system: renewal certificate issued, or SUSPENDED certificate restored (chain R1)"
        actor: system
        preconditions: ["the new governing certificate has validity_state == ACTIVE"]
        side_effects:
          - "sets work_eligibility = ELIGIBLE, active_certificate_id = renewal certificate"
          - "chain R2 moves WORK_RESTRICTED assignments back to ACTIVE with restriction_reason = NONE; closes the eligibility cycle"

  - entity: ServerAssignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: WORK_RESTRICTED
        trigger: "system: chain R2 after certificate lapse, registry suspension, or new-hire window expiry"
        actor: system
        preconditions:
          - "location.training_requirement == MANDATED"
          - "server work_eligibility == RESTRICTED, or work_eligibility == UNCERTIFIED and clock >= assigned_at + jurisdiction.new_hire_training_days"
        side_effects:
          - "sets assignment_state = WORK_RESTRICTED, restricted_at = clock, restriction_reason per cause"
          - "location.restricted_server_count += 1 and both compliance rates are recomputed (assigned_server_count is unchanged — restriction never removes headcount)"
      - from: WORK_RESTRICTED
        to: ACTIVE
        trigger: "system: chain R2 after renewal or registry restoration"
        actor: system
        preconditions: ["server work_eligibility in {ELIGIBLE, GRACE}"]
        side_effects:
          - "sets assignment_state = ACTIVE, restriction_reason = NONE, restricted_at cleared"
          - "location counts and both rates recomputed; assigned_server_count unchanged"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /server-assignments/{id}/end"
        actor: EmployerAdmin
        preconditions:
          - "assignment_state in {ACTIVE, WORK_RESTRICTED}"
          - "acting EmployerAdmin id == location's employer_account_id"
        side_effects:
          - "sets assignment_state = ENDED, ended_at = clock"
          - "location assigned_server_count -= 1, counts and both rates recomputed, posture re-thresholded, then chains R4 and R5 run"
      - from: WORK_RESTRICTED
        to: ENDED
        trigger: "POST /server-assignments/{id}/end"
        actor: EmployerAdmin
        preconditions: ["assignment_state == WORK_RESTRICTED"]
        side_effects: ["same as ACTIVE -> ENDED; restricted_server_count decreases with assigned_server_count"]

  - entity: RegistrySubmission
    initial_state: TRANSMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: TRANSMITTED
        to: ACCEPTED
        trigger: "POST /registry-submissions/{id}/acknowledge (result = ACCEPTED)"
        actor: StateRegulator
        preconditions:
          - "submission_state == TRANSMITTED"
        side_effects:
          - "sets acknowledged_at = clock; certificate registry_state = ACCEPTED"
          - "when the certificate's validity_state == SUSPENDED and clock < expires_at, the certificate returns to ACTIVE and chain R restores the holder's assignments"
      - from: TRANSMITTED
        to: REJECTED
        trigger: "POST /registry-submissions/{id}/acknowledge (result = REJECTED)"
        actor: StateRegulator
        preconditions:
          - "submission_state == TRANSMITTED"
          - "rejection_code supplied and != NONE"
        side_effects:
          - "sets acknowledged_at = clock, rejection_code; certificate registry_state = RESUBMIT_REQUIRED"
          - "certificate validity_state moves to SUSPENDED, then chain R restricts the holder's MANDATED-location assignments (see Certificate ACTIVE -> SUSPENDED)"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: enrollment-create-stale-session
    parent_entity: ClassSession
    write_endpoint: "POST /enrollments"
    occ_field: "expected_class_session_version"
    description: |
      Creating an Enrollment against a ClassSession whose version has advanced since
      the client last read the roster is rejected. A seat is a finite resource: the
      caller's view of enrolled_count and remaining capacity is stale once any other
      enrollment, withdrawal or roster transition has bumped the session version, and
      the caller must re-read the roster before claiming a seat.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
  - rule_id: course-revision-stale-course
    parent_entity: Course
    write_endpoint: "PATCH /courses/{id}"
    occ_field: "expected_course_version"
    description: |
      Applying a content revision to a Course whose version has advanced since the
      editor last read it is rejected. Each accepted revision invalidates every
      APPROVED CourseApproval of the course, so an edit computed against an earlier
      body would silently re-stale approvals the editor never saw.
    error_id: ERR_STALE_COURSE_VERSION
    http_status: 412
  - rule_id: dram-shop-document-stale-account
    parent_entity: EmployerAccount
    write_endpoint: "POST /employer-accounts/{id}/dram-shop-documents"
    occ_field: "expected_employer_account_version"
    description: |
      Issuing a DramShopDocument supersedes the account's prior ISSUED document and
      freezes a compliance snapshot. When the account version has advanced since the
      client read it, the snapshot the client believes it is certifying no longer
      matches the account, so the issuance is rejected.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: exam_attempt_scoring
    trigger: "POST /exam-attempts/{id}/submit"
    algorithm: threshold
    formula: |
      score_pct = round_half_up(raw_correct_count / attempt.question_count * 100, 2)
      threshold  = jurisdiction(session.state_jurisdiction_id).min_passing_score_pct
      if proctor_attestation == false:
          outcome = VOIDED   # score_pct still recorded, attempt_count NOT incremented
      elif score_pct >= threshold:          # inclusive at the boundary
          outcome = PASS
      else:
          outcome = FAIL
    input_set: "The single ExamAttempt being submitted; question_count is the value snapshotted at attempt creation, never the course's current question_count."
    constants:
      COMPARISON: ">= (a score exactly equal to min_passing_score_pct passes)"
    precision: "score_pct to 2 decimal places, round_half_up"

  - name: certificate_expiry_and_anchor
    trigger: "system: certificate issuance inside POST /class-sessions/{id}/complete"
    algorithm: forward_looking
    formula: |
      # step 1 - pick the prior certificate via certificate_renewal_selector (below)
      prior = certificate_renewal_selector(server, jurisdiction, track)
      issued_at = clock
      months = jurisdiction.certificate_validity_months
      # step 2 - variant selection is fully determined by prior's validity_state
      if prior is null or prior.validity_state in {LAPSED, SUSPENDED}:
          expiry_anchor_mode = ISSUANCE_ANCHORED
          expires_at = add_months(issued_at, months)
      else:                       # prior.validity_state in {ACTIVE, GRACE}
          expiry_anchor_mode = ANNIVERSARY_ANCHORED
          expires_at = add_months(prior.expires_at, months)
      renews_certificate_id = prior.id if prior is not null else null
      # add_months clamps the day-of-month to the last valid day of the target month
      # (2026-01-31 + 1 month = 2026-02-28) and preserves the anchor's time-of-day.
    input_set: "certificate_renewal_selector candidate set = Certificate rows where alcohol_server_id == the passing enrollment's server AND state_jurisdiction_id == session.state_jurisdiction_id AND track == course.track AND validity_state IN {ACTIVE, GRACE, LAPSED, SUSPENDED} (SUPERSEDED excluded). Ranking: expires_at DESC; tie-break: created_at ASC; empty candidate set: prior = null."
    constants:
      DAY_CLAMP: "last valid day of target month"
    precision: "whole seconds, UTC, three fractional digits preserved from the anchor"
    variants:
      - name: ISSUANCE_ANCHORED
        when: "no prior certificate, or the prior certificate is LAPSED or SUSPENDED"
        difference: "expires_at = add_months(issued_at, validity_months) — the lapse gap is forfeited"
      - name: ANNIVERSARY_ANCHORED
        when: "the prior certificate is ACTIVE (early renewal) or GRACE (renewal inside the grace window)"
        difference: "expires_at = add_months(prior.expires_at, validity_months) — the original anniversary is preserved, producing an EARLIER expiry than the issuance-anchored value for the same issuance instant"

  - name: location_compliance_metrics
    trigger: "system: chain R3 on every assignment create/end, certificate issuance, registry acknowledgement, and POST /compliance-runs phase 7"
    algorithm: aggregation
    formula: |
      live = ServerAssignment rows where employer_location_id == location.id
             AND assignment_state IN {ACTIVE, WORK_RESTRICTED}
      assigned_server_count   = count(live)
      compliant_server_count  = count(a in live where server(a).work_eligibility == ELIGIBLE)
      grace_server_count      = count(a in live where server(a).work_eligibility == GRACE)
      restricted_server_count = count(a in live where a.assignment_state == WORK_RESTRICTED)

      if assigned_server_count == 0:
          compliance_rate_strict_pct          = 100.00   # empty location: nothing out of compliance
          compliance_rate_grace_inclusive_pct = 100.00
      else:
          compliance_rate_strict_pct = round_half_up(
              compliant_server_count / assigned_server_count * 100, 2)
          compliance_rate_grace_inclusive_pct = round_half_up(
              (compliant_server_count + grace_server_count) / assigned_server_count * 100, 2)

      training_requirement = MANDATED if location.premise_type in
                             jurisdiction(location.state_jurisdiction_id).mandated_tracks
                             else VOLUNTARY
      if training_requirement == VOLUNTARY:
          compliance_posture = NOT_APPLICABLE
      elif compliance_rate_grace_inclusive_pct >= 95.00: compliance_posture = COMPLIANT
      elif compliance_rate_grace_inclusive_pct >= 80.00: compliance_posture = AT_RISK
      else:                                              compliance_posture = NON_COMPLIANT

      # account roll-up (chain R4) uses the STRICT numerators/denominators summed
      # across every location of the account, with the OPPOSITE empty convention:
      total_live = sum(assigned_server_count over the account's locations)
      account_compliance_rate_pct = 0.00 if total_live == 0 else round_half_up(
          sum(compliant_server_count) / total_live * 100, 2)
    input_set: "Only assignments in {ACTIVE, WORK_RESTRICTED}; ENDED assignments are excluded from both numerator and denominator. Server eligibility is read from the stored AlcoholServer.work_eligibility field (epoch-driven), never recomputed from certificate dates at read time."
    constants:
      COMPLIANT_MIN_PCT: 95.00
      AT_RISK_MIN_PCT: 80.00
      LOCATION_EMPTY_RATE_PCT: 100.00
      ACCOUNT_EMPTY_RATE_PCT: 0.00
    precision: "rates to 2 decimal places, round_half_up"
    variants:
      - name: STRICT
        when: "dram-shop documentation eligibility and the account roll-up"
        difference: "only work_eligibility == ELIGIBLE counts as compliant; GRACE servers count against the rate"
      - name: GRACE_INCLUSIVE
        when: "the per-location compliance dashboard and compliance_posture thresholding"
        difference: "work_eligibility IN {ELIGIBLE, GRACE} counts as compliant, so a location whose whole roster sits in the renewal grace window reads 100.00 here and 0.00 under STRICT"

  - name: dram_shop_discount_pct
    trigger: "POST /employer-accounts/{id}/dram-shop-documents"
    algorithm: tiered_pricing
    formula: |
      rate = account.account_compliance_rate_pct        # STRICT variant, already stored
      if   rate >= 98.00: tier, base = TIER_3, 10.00
      elif rate >= 90.00: tier, base = TIER_2,  7.00
      elif rate >= 80.00: tier, base = TIER_1,  4.00
      else:               tier, base = NONE,    0.00     # unreachable: priority 38 rejects first
      months_documented = whole_months(account.first_documented_at, clock)   # 0 when null
      tenure_bonus_pct  = min(3.00, floor(months_documented / 12) * 1.00)
      min_location_strict_rate = min(compliance_rate_strict_pct over the account's locations)
      multi_bonus_pct = 2.00 if (account.location_count >= 3 and
                                 min_location_strict_rate >= 90.00) else 0.00
      if account.account_status != ACTIVE:
          discount_tier, discount_pct = NONE, 0.00       # conditional branch on entity state
      else:
          discount_tier = tier
          discount_pct  = round_half_up(min(MAX_DISCOUNT_PCT,
                                            max(0.00, base + tenure_bonus_pct + multi_bonus_pct)), 2)
    input_set: "account_compliance_rate_pct as stored at request time; all EmployerLocation rows of the account (locations with zero live assignments contribute compliance_rate_strict_pct = 100.00 to min_location_strict_rate); months_documented measured from first_documented_at to the logical clock."
    constants:
      MAX_DISCOUNT_PCT: 12.00
      TIER_3_MIN_RATE_PCT: 98.00
      TIER_2_MIN_RATE_PCT: 90.00
      TIER_1_MIN_RATE_PCT: 80.00
      TENURE_BONUS_CAP_PCT: 3.00
      MULTI_LOCATION_BONUS_PCT: 2.00
      MULTI_LOCATION_MIN_COUNT: 3
      MULTI_LOCATION_MIN_RATE_PCT: 90.00
    precision: "2 decimal places, round_half_up, applied once after the min/max nesting"

  - name: dram_shop_discount_credit
    trigger: "POST /employer-accounts/{id}/dram-shop-documents (after dram_shop_discount_pct)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round each location's credit to whole cents FIRST,
      # then sum the rounded values. Summing premiums first and rounding once at the
      # end is WRONG and can differ by one or more cents.
      credit = 0
      for loc in account's EmployerLocation rows ordered by created_at ASC:
          credit += round_half_up(loc.annual_premium_cents * discount_pct / 100.0, 0)
      discount_credit_cents = credit
      location_count        = count(account's EmployerLocation rows)
    input_set: "Every EmployerLocation of the account, regardless of premise_type, training_requirement or assignment count; ordered by created_at ASC (order does not change the sum but pins the audit trail)."
    constants:
      ROUNDING_ORDER: "per-location round, then sum"
    precision: "whole cents, round_half_up per location"

  - name: seat_credit_purchase_settlement
    trigger: "POST /employer-accounts/{id}/seat-credit-purchases"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED 1..8. The dependency looks circular (the bonus
      # credits depend on the net charge, the net charge depends on a discount tier
      # keyed on the gross subtotal, and the fee is capped off the net), so the order
      # below is the definition.
      1. subtotal_cents = seat_quantity * unit_price_cents
      2. volume_discount_pct = 0.00  if subtotal_cents <  50000
                               3.00  if 50000  <= subtotal_cents < 150000
                               6.00  if 150000 <= subtotal_cents < 500000
                               10.00 if subtotal_cents >= 500000
      3. discount_cents        = round_half_up(subtotal_cents * volume_discount_pct / 100, 0)
      4. net_cents             = subtotal_cents - discount_cents
      5. processing_fee_cents  = min(PROCESSING_FEE_CAP_CENTS,
                                     round_half_up(net_cents * PROCESSING_FEE_RATE, 0))
      6. total_charged_cents   = net_cents + processing_fee_cents
      7. bonus_credits         = floor(net_cents / BONUS_CREDIT_NET_CENTS)
      8. seat_credits_granted  = seat_quantity + bonus_credits
      # persisted: seat_credits_purchased_total += seat_credits_granted,
      # seat_credit_balance += seat_credits_granted,
      # last_purchase_discount_pct = volume_discount_pct,
      # last_purchase_total_charged_cents = total_charged_cents,
      # lifetime_charged_cents += total_charged_cents
    input_set: "The single purchase request; tier boundaries are evaluated on the GROSS subtotal, never on the net."
    constants:
      PROCESSING_FEE_RATE: 0.029
      PROCESSING_FEE_CAP_CENTS: 2500
      BONUS_CREDIT_NET_CENTS: 100000
    precision: "whole cents, round_half_up at steps 3 and 5 only"

  - name: registry_submission_penalty
    trigger: "POST /certificates/{id}/registry-submissions"
    algorithm: threshold
    formula: |
      due_at = certificate.registry_due_at        # issued_at + registry_deadline_days
      transmitted_at = clock
      if transmitted_at <= due_at:
          late_days = 0
      else:
          late_days = ceil((transmitted_at - due_at) / 86400 seconds)   # any part day counts
      escalation_factor = 1 + 0.05 * (attempt_number - 1)
      penalty_fee_cents = round_half_up(
          late_days * jurisdiction.registry_late_fee_cents_per_day * escalation_factor, 0)
    input_set: "The single submission being created; attempt_number = 1 + count of prior RegistrySubmission rows for this certificate (including rejected ones)."
    constants:
      ESCALATION_PER_ATTEMPT: 0.05
      DAY_SECONDS: 86400
      BOUNDARY: "<= due_at is on time; one second past due_at is one late day"
    precision: "whole cents, round_half_up once per submission"

  - name: retake_gate_evaluation
    trigger: "POST /enrollments/{id}/exam-attempts"
    algorithm: threshold
    formula: |
      counted = enrollment.attempt_count            # VOIDED attempts excluded by definition
      max_counted = 1 + jurisdiction.max_retakes_allowed
      if counted >= max_counted:  reject ERR_RETAKE_LIMIT_EXCEEDED     # checked FIRST
      if enrollment.retake_eligible_at is not null and clock < enrollment.retake_eligible_at:
          reject ERR_RETAKE_COOLING_OFF
      retake_eligible_at = last_counted_attempt_ended_at
                           + jurisdiction.retake_cooling_off_hours hours
    input_set: "ExamAttempt rows of the enrollment with outcome IN {PASS, FAIL} only; IN_PROGRESS attempts block via ERR_ENROLLMENT_INVALID_STATE and VOIDED attempts are invisible to both the cap and the cooling-off clock."
    constants:
      CAP_COMPARISON: ">= max_counted rejects"
      COOLING_OFF_COMPARISON: "clock >= retake_eligible_at passes (inclusive)"
    precision: "whole seconds"

  - name: seat_credit_ledger
    trigger: "system: every seat-credit purchase, employer-sponsored enrollment, withdrawal and cascaded cancellation"
    algorithm: aggregation
    formula: |
      seat_credit_balance == seat_credits_purchased_total
                             - seat_credits_consumed_total
                             + seat_credits_refunded_total
      # enrollment (paid_by == EMPLOYER_CREDIT): consumed_total += 1, balance -= 1,
      #                                          seat_credit_charged = true
      # withdrawal / cascaded cancellation of a charged seat:
      #                                          refunded_total += 1, balance += 1,
      #                                          seat_credit_charged = false
      # NO_SHOW: nothing (the seat is forfeited; balance stays debited)
    input_set: "All Enrollment rows whose sponsoring_employer_account_id == account.id; SELF_PAY enrollments never touch the ledger."
    constants:
      SEATS_PER_ENROLLMENT: 1
    precision: "whole seats (integers only)"

  - name: trainer_pass_rate
    trigger: "system: POST /class-sessions/{id}/complete"
    algorithm: aggregation
    formula: |
      completed = ClassSession rows where trainer_id == trainer.id
                  AND session_status == COMPLETED
      sessions_taught_count = count(completed)
      graded = Enrollment rows on those sessions with enrollment_state IN {PASSED, EXAM_FAILED}
      graded_enrollments_count = count(graded)
      pass_rate_pct = 0.00 if graded_enrollments_count == 0 else round_half_up(
          count(g in graded where g.enrollment_state == PASSED)
          / graded_enrollments_count * 100, 2)
    input_set: "Only COMPLETED sessions; CANCELLED sessions and enrollments in {NO_SHOW, INCOMPLETE, WITHDRAWN} are excluded from both numerator and denominator."
    constants:
      EMPTY_RATE_PCT: 0.00
    precision: "2 decimal places, round_half_up"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request shape: required body fields present; enum members valid; numeric ranges honored (capacity 1..40, seat_quantity 1..500, unit_price_cents >= 1, raw_correct_count 0..attempt.question_count, contact_hours > 0, question_count 10..200, min_passing_score_pct 50..100, annual_premium_cents 0..100000000); scheduled_end_at > scheduled_start_at; coverage_period_end > coverage_period_start; expires_at > effective_from; limit 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Every id in the path resolves, validated left-to-right"
    error_id: "ERR_CATALOG_NOT_FOUND | ERR_TRAINING_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND (by entity family)"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: auth
    check: "Entity-backed ownership: Trainer acting on lock-roster/attendance/complete/cancel must equal session.trainer_id; Trainer acting on exam-attempts/submit must equal session.proctor_trainer_id; EmployerAdmin must equal the account id in the path, the location's employer_account_id, the assignment's location's employer_account_id, or the enrollment's sponsoring_employer_account_id; AlcoholServer must equal the enrollment's alcohol_server_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /class-sessions/{id}/lock-roster, /open-exam, /complete, /cancel, POST /enrollments/{id}/attendance, /withdraw, POST /enrollments/{id}/exam-attempts, POST /exam-attempts/{id}/submit, POST /employer-accounts/{id}/* , POST /employer-locations/{id}/server-assignments, POST /server-assignments/{id}/end"
  - priority: 6
    category: existence
    check: "Every foreign-key id in the request body resolves (course_id, state_jurisdiction_id, trainer_id, proctor_trainer_id, class_session_id, alcohol_server_id, sponsoring_employer_account_id, supersedes_course_id)"
    error_id: "ERR_CATALOG_NOT_FOUND | ERR_TRAINING_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND (by entity family)"
    http_status: 404
    applies_to: "POST /courses, POST /course-approvals, POST /class-sessions, POST /class-sessions/{id}/open-exam, POST /enrollments, POST /alcohol-servers, POST /employer-accounts/{id}/locations, POST /employer-locations/{id}/server-assignments"
  - priority: 7
    category: state
    check: "expected_class_session_version equals ClassSession.version"
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    applies_to: "POST /enrollments"
  - priority: 8
    category: state
    check: "expected_course_version equals Course.version"
    error_id: ERR_STALE_COURSE_VERSION
    http_status: 412
    applies_to: "PATCH /courses/{id}"
  - priority: 9
    category: state
    check: "expected_employer_account_version equals EmployerAccount.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /employer-accounts/{id}/dram-shop-documents"
  - priority: 10
    category: state
    check: "Course.status is DRAFT for publish and in {DRAFT, PUBLISHED} for a content revision; supersedes target is PUBLISHED"
    error_id: ERR_COURSE_INVALID_STATE
    http_status: 409
    applies_to: "POST /courses/{id}/publish, PATCH /courses/{id}, POST /course-approvals"
  - priority: 11
    category: state
    check: "CourseApproval.approval_status is SUBMITTED for a decision and in {CHANGES_REQUESTED, STALE} for a resubmit"
    error_id: ERR_APPROVAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /course-approvals/{id}/decision, POST /course-approvals/{id}/resubmit"
  - priority: 12
    category: state
    check: "Trainer.trainer_status != SUSPENDED for credentialing and for suspension"
    error_id: ERR_TRAINER_INVALID_STATE
    http_status: 409
    applies_to: "POST /trainers/{id}/credential, POST /trainers/{id}/suspend"
  - priority: 13
    category: state
    check: "ClassSession.session_status equals the from-state of the requested transition (SCHEDULED for enrollment/lock-roster, ROSTER_LOCKED for attendance/open-exam, EXAM_OPEN for exam-attempts/complete, {SCHEDULED, ROSTER_LOCKED} for cancel and withdraw)"
    error_id: ERR_SESSION_INVALID_STATE
    http_status: 409
    applies_to: "POST /enrollments, POST /enrollments/{id}/attendance, /withdraw, /exam-attempts, POST /class-sessions/{id}/lock-roster, /open-exam, /complete, /cancel"
  - priority: 14
    category: state
    check: "Enrollment.enrollment_state equals the from-state of the requested transition (REGISTERED for attendance, {EXAM_SCHEDULED, EXAM_FAILED} for a new attempt, {REGISTERED, ATTENDED, NO_SHOW} for withdraw, IN_PROGRESS attempt for submit)"
    error_id: ERR_ENROLLMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /enrollments/{id}/attendance, /withdraw, /exam-attempts, POST /exam-attempts/{id}/submit"
  - priority: 15
    category: state
    check: "Certificate.registry_state in {PENDING_SUBMISSION, RESUBMIT_REQUIRED} and validity_state != SUPERSEDED"
    error_id: ERR_CERTIFICATE_INVALID_STATE
    http_status: 409
    applies_to: "POST /certificates/{id}/registry-submissions"
  - priority: 16
    category: state
    check: "RegistrySubmission.submission_state == TRANSMITTED"
    error_id: ERR_SUBMISSION_INVALID_STATE
    http_status: 409
    applies_to: "POST /registry-submissions/{id}/acknowledge"
  - priority: 17
    category: state
    check: "EmployerAccount.account_status != SUSPENDED (a suspended account may neither sponsor seats nor be documented)"
    error_id: ERR_ACCOUNT_INVALID_STATE
    http_status: 409
    applies_to: "POST /enrollments (when sponsoring_employer_account_id is supplied), POST /employer-accounts/{id}/seat-credit-purchases, POST /employer-accounts/{id}/dram-shop-documents"
  - priority: 18
    category: business_safety
    check: "An APPROVED CourseApproval exists for (course_id, state_jurisdiction_id) with effective_from <= scheduled_start_at AND scheduled_start_at < expires_at (session creation); at open-exam the pinned approval is still APPROVED"
    error_id: ERR_APPROVAL_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /class-sessions, POST /class-sessions/{id}/open-exam"
  - priority: 19
    category: business_safety
    check: "The pinned CourseApproval.pinned_course_version equals the session's pinned_course_version (course content has not been revised since approval)"
    error_id: ERR_APPROVAL_STALE_CONTENT
    http_status: 409
    applies_to: "POST /class-sessions, POST /class-sessions/{id}/open-exam"
  - priority: 20
    category: business_safety
    check: "Instructing trainer (and, at open-exam, the proctor) has trainer_status == CERTIFIED, the course track in certified_tracks, the jurisdiction's state_code in certified_state_codes, and credential_expires_at > scheduled_end_at (open-exam compares against the logical clock)"
    error_id: ERR_TRAINER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /class-sessions, POST /class-sessions/{id}/open-exam"
  - priority: 21
    category: business_safety
    check: "When jurisdiction.proctor_separation_required is true, proctor_trainer_id != session.trainer_id"
    error_id: ERR_PROCTOR_SEPARATION_REQUIRED
    http_status: 422
    applies_to: "POST /class-sessions/{id}/open-exam"
  - priority: 22
    category: business_safety
    check: "At a location whose training_requirement == MANDATED, the server's work_eligibility must not be RESTRICTED"
    error_id: ERR_SERVER_WORK_RESTRICTED
    http_status: 422
    applies_to: "POST /employer-locations/{id}/server-assignments"
  - priority: 23
    category: business_referential
    check: "mandate_type and mandated_tracks agree: MANDATORY requires exactly 2 tracks, CONDITIONAL exactly 1, VOLUNTARY exactly 0"
    error_id: ERR_MANDATE_TRACK_MISMATCH
    http_status: 422
    applies_to: "POST /state-jurisdictions"
  - priority: 24
    category: business_referential
    check: "Uniqueness of natural keys: StateJurisdiction.state_code, Trainer.email, AlcoholServer.email"
    error_id: ERR_IDENTITY_ALREADY_REGISTERED
    http_status: 409
    applies_to: "POST /state-jurisdictions, POST /trainers, POST /alcohol-servers"
  - priority: 25
    category: business_referential
    check: "At most one CourseApproval per (course_id, state_jurisdiction_id) in approval_status {SUBMITTED, CHANGES_REQUESTED, APPROVED, STALE}"
    error_id: ERR_DUPLICATE_APPROVAL_REQUEST
    http_status: 409
    applies_to: "POST /course-approvals"
  - priority: 26
    category: business_referential
    check: "At most one Enrollment per (class_session_id, alcohol_server_id) in enrollment_state != WITHDRAWN"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 27
    category: business_referential
    check: "At most one ServerAssignment per (employer_location_id, alcohol_server_id) in assignment_state {ACTIVE, WORK_RESTRICTED}"
    error_id: ERR_DUPLICATE_ASSIGNMENT
    http_status: 409
    applies_to: "POST /employer-locations/{id}/server-assignments"
  - priority: 28
    category: business_constraint
    check: "ClassSession.enrolled_count < ClassSession.capacity"
    error_id: ERR_SESSION_AT_CAPACITY
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 29
    category: business_constraint
    check: "ClassSession.enrolled_count >= 1"
    error_id: ERR_EMPTY_ROSTER
    http_status: 422
    applies_to: "POST /class-sessions/{id}/lock-roster"
  - priority: 30
    category: business_constraint
    check: "No Enrollment on the session remains in enrollment_state REGISTERED"
    error_id: ERR_ATTENDANCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /class-sessions/{id}/open-exam"
  - priority: 31
    category: business_constraint
    check: "Enrollment.attempt_count < 1 + jurisdiction.max_retakes_allowed"
    error_id: ERR_RETAKE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /enrollments/{id}/exam-attempts"
  - priority: 32
    category: business_temporal
    check: "Trainer schedule conflict: reject when the requested [scheduled_start_at - 60min, scheduled_end_at + 60min] CLOSED buffered interval intersects the [scheduled_start_at, scheduled_end_at] CLOSED interval of any other ClassSession with the same trainer_id in session_status {SCHEDULED, ROSTER_LOCKED, EXAM_OPEN} — back-to-back classes are rejected"
    error_id: ERR_TRAINER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /class-sessions"
  - priority: 33
    category: business_temporal
    check: "Server session overlap: reject when the requested session's HALF-OPEN [scheduled_start_at, scheduled_end_at) window intersects the half-open window of another ClassSession on which this server holds an Enrollment in enrollment_state {REGISTERED, ATTENDED, EXAM_SCHEDULED, EXAM_IN_PROGRESS, EXAM_FAILED} — a session starting exactly when another ends is allowed (zero buffer)"
    error_id: ERR_SERVER_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 34
    category: business_temporal
    check: "clock >= Enrollment.retake_eligible_at (cooling-off elapsed)"
    error_id: ERR_RETAKE_COOLING_OFF
    http_status: 422
    applies_to: "POST /enrollments/{id}/exam-attempts"
  - priority: 35
    category: business_temporal
    check: "clock >= ClassSession.scheduled_start_at"
    error_id: ERR_EXAM_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /class-sessions/{id}/open-exam"
  - priority: 36
    category: business_temporal
    check: "scheduled_start_at > clock at session creation"
    error_id: ERR_SESSION_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /class-sessions"
  - priority: 37
    category: business_fiscal
    check: "Sponsoring EmployerAccount.seat_credit_balance >= 1"
    error_id: ERR_INSUFFICIENT_SEAT_CREDITS
    http_status: 402
    applies_to: "POST /enrollments (when sponsoring_employer_account_id is supplied)"
  - priority: 38
    category: business_fiscal
    check: "EmployerAccount.account_compliance_rate_pct >= 80.00 (the dram-shop documentation floor; an account with no live assignment reads 0.00 and is therefore rejected)"
    error_id: ERR_COMPLIANCE_RATE_TOO_LOW
    http_status: 422
    applies_to: "POST /employer-accounts/{id}/dram-shop-documents"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every expiry, grace, cooling-off and deadline rule is evaluated against this clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; time-based transitions still require POST /compliance-runs"]

  # --- jurisdictions ---
  - method: POST
    path: "/state-jurisdictions"
    description: "Registers a state's training rule mapping (mandatory versus voluntary), certificate validity, retake policy, registry and reminder configuration."
    roles: [ProgramAdmin]
    code: 201
    input: [state_code, mandate_type, mandated_tracks, "certificate_validity_months?", "renewal_grace_days?", "new_hire_training_days?", "registry_submission_required?", "registry_deadline_days?", "registry_late_fee_cents_per_day?", "min_passing_score_pct?", "max_retakes_allowed?", "retake_cooling_off_hours?", "proctor_separation_required?", "reminder_lead_days?"]
    output: StateJurisdiction
    side_effects: ["initializes certificates_issued_count = 0"]

  # --- course catalog ---
  - method: POST
    path: "/courses"
    description: "Creates a DRAFT catalog entry for a track and delivery mode, optionally superseding an older published course."
    roles: [ProgramAdmin]
    code: 201
    input: [title, track, delivery_mode, contact_hours, question_count, version_label, "supersedes_course_id?"]
    output: Course
    side_effects: ["status = DRAFT, content_revision_count = 0"]
  - method: PATCH
    path: "/courses/{id}"
    description: "Applies a content revision to a course under optimistic concurrency; every APPROVED approval of the course becomes STALE."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_course_version, revision_note, "title?", "contact_hours?", "question_count?"]
    output: Course
    side_effects: ["content_revision_count += 1", "increments Course.version by 1", "APPROVED CourseApproval rows of this course move to STALE"]
  - method: POST
    path: "/courses/{id}/publish"
    description: "Publishes a DRAFT course; when it supersedes another course, retires that course and cascades approval supersession, session cancellation, enrollment withdrawal and seat-credit refunds."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Course
    side_effects: ["status = PUBLISHED", "superseded Course -> RETIRED", "its APPROVED approvals -> SUPERSEDED", "pinned SCHEDULED/ROSTER_LOCKED sessions -> CANCELLED", "their enrollments -> WITHDRAWN", "charged seat credits refunded"]
  - method: GET
    path: "/courses/{id}"
    description: "Reads one catalog entry."
    roles: [ProgramAdmin, StateRegulator, Trainer, EmployerAdmin]
    code: 200
    input: []
    output: Course
    side_effects: []
  - method: GET
    path: "/courses"
    description: "Lists the catalog, filterable by track, status, superseded predecessor, and the state that has an APPROVED approval for the course."
    roles: [ProgramAdmin, StateRegulator, Trainer, EmployerAdmin]
    code: 200
    input: ["track?", "status?", "supersedes_course_id?", "approved_state_code?", "limit?", "offset?"]
    output: Course[]
    side_effects: []

  # --- state approvals ---
  - method: POST
    path: "/course-approvals"
    description: "Submits a published course to a state for approval (provider side of the segregation of duties)."
    roles: [ProgramAdmin]
    code: 201
    input: [course_id, state_jurisdiction_id, "submission_note?"]
    output: CourseApproval
    side_effects: ["approval_status = SUBMITTED, review_round = 1"]
  - method: POST
    path: "/course-approvals/{id}/decision"
    description: "Regulator decision on a submitted approval: APPROVE (pins the course version and the effective window), REQUEST_CHANGES (opens another review round) or REJECT (terminal)."
    roles: [StateRegulator]
    code: 200
    input: [decision, "approval_number?", "effective_from?", "expires_at?", "changes_requested_note?"]
    output: CourseApproval
    side_effects: ["APPROVE pins pinned_course_version = Course.version", "sets decided_at"]
  - method: POST
    path: "/course-approvals/{id}/resubmit"
    description: "Provider resubmits an approval that was sent back for changes or invalidated by a content revision; the fourth round is auto-rejected."
    roles: [ProgramAdmin]
    code: 200
    input: ["submission_note?"]
    output: CourseApproval
    side_effects: ["review_round += 1", "approval_status = SUBMITTED, or REJECTED when review_round would exceed 3"]
  - method: GET
    path: "/course-approvals/{id}"
    description: "Reads one approval record."
    roles: [ProgramAdmin, StateRegulator, Trainer]
    code: 200
    input: []
    output: CourseApproval
    side_effects: []
  - method: GET
    path: "/course-approvals"
    description: "Lists approvals filterable by course, state and status."
    roles: [ProgramAdmin, StateRegulator, Trainer]
    code: 200
    input: ["course_id?", "state_jurisdiction_id?", "approval_status?", "limit?", "offset?"]
    output: CourseApproval[]
    side_effects: []

  # --- trainers ---
  - method: POST
    path: "/trainers"
    description: "Registers a trainer in PROVISIONAL status."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, email]
    output: Trainer
    side_effects: ["trainer_status = PROVISIONAL"]
  - method: POST
    path: "/trainers/{id}/credential"
    description: "Grants or renews a trainer credential for a set of tracks and states; also used to re-credential a LAPSED trainer."
    roles: [ProgramAdmin]
    code: 200
    input: [certified_tracks, certified_state_codes, credential_expires_at]
    output: Trainer
    side_effects: ["trainer_status = CERTIFIED"]
  - method: POST
    path: "/trainers/{id}/suspend"
    description: "Suspends a trainer and cascades cancellation of their scheduled classes, withdrawal of those enrollments and refund of charged seat credits."
    roles: [ProgramAdmin]
    code: 200
    input: ["suspension_reason?"]
    output: Trainer
    side_effects: ["trainer_status = SUSPENDED", "their SCHEDULED/ROSTER_LOCKED sessions -> CANCELLED", "enrollments -> WITHDRAWN", "seat credits refunded"]
  - method: GET
    path: "/trainers/{id}"
    description: "Reads one trainer with credential state and teaching metrics."
    roles: [ProgramAdmin, StateRegulator, Trainer]
    code: 200
    input: []
    output: Trainer
    side_effects: []

  # --- class sessions & rosters ---
  - method: POST
    path: "/class-sessions"
    description: "Schedules a class; pins the effective APPROVED approval and the course version, and enforces trainer credentialing plus the buffered trainer-schedule rule."
    roles: [Trainer, ProgramAdmin]
    code: 201
    input: [course_id, state_jurisdiction_id, trainer_id, scheduled_start_at, scheduled_end_at, capacity]
    output: ClassSession
    side_effects: ["pins pinned_course_approval_id and pinned_course_version", "session_status = SCHEDULED"]
  - method: POST
    path: "/class-sessions/{id}/lock-roster"
    description: "Locks a non-empty roster so attendance can be marked."
    roles: [Trainer, ProgramAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["session_status = ROSTER_LOCKED"]
  - method: POST
    path: "/class-sessions/{id}/open-exam"
    description: "Opens the proctored exam window, assigning a proctor subject to the jurisdiction's proctor-separation rule and re-validating the pinned approval."
    roles: [Trainer, ProgramAdmin]
    code: 200
    input: [proctor_trainer_id]
    output: ClassSession
    side_effects: ["session_status = EXAM_OPEN, exam_opened_at set", "ATTENDED enrollments -> EXAM_SCHEDULED"]
  - method: POST
    path: "/class-sessions/{id}/complete"
    description: "Completes the class, issues certificates for passed seats (with expiry anchoring and registry queueing) and runs the compliance recompute chain."
    roles: [Trainer, ProgramAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["session_status = COMPLETED", "Certificate issued per PASSED enrollment in ascending Enrollment.created_at", "prior certificates -> SUPERSEDED", "EXAM_SCHEDULED enrollments -> INCOMPLETE", "recompute chain R1-R5", "trainer metrics recomputed"]
  - method: POST
    path: "/class-sessions/{id}/cancel"
    description: "Cancels a scheduled or roster-locked class, withdrawing every live enrollment and refunding charged seat credits."
    roles: [Trainer, ProgramAdmin]
    code: 200
    input: [cancellation_reason]
    output: ClassSession
    side_effects: ["session_status = CANCELLED", "enrollments -> WITHDRAWN, enrolled_count = 0", "charged seat credits refunded"]
  - method: GET
    path: "/class-sessions/{id}"
    description: "Reads one class session with roster counts and pins."
    roles: [ProgramAdmin, StateRegulator, Trainer, EmployerAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects: []
  - method: GET
    path: "/class-sessions"
    description: "Lists class sessions filterable by course, jurisdiction, instructing trainer, proctor, pinned approval and status."
    roles: [ProgramAdmin, StateRegulator, Trainer, EmployerAdmin]
    code: 200
    input: ["course_id?", "state_jurisdiction_id?", "trainer_id?", "proctor_trainer_id?", "pinned_course_approval_id?", "session_status?", "limit?", "offset?"]
    output: ClassSession[]
    side_effects: []

  # --- servers ---
  - method: POST
    path: "/alcohol-servers"
    description: "Registers an alcohol server with a home jurisdiction; work_eligibility starts UNCERTIFIED."
    roles: [ProgramAdmin, EmployerAdmin]
    code: 201
    input: [full_name, email, state_jurisdiction_id]
    output: AlcoholServer
    side_effects: ["work_eligibility = UNCERTIFIED"]
  - method: GET
    path: "/alcohol-servers/{id}"
    description: "Reads one server with governing certificate and derived work eligibility."
    roles: [ProgramAdmin, StateRegulator, Trainer, EmployerAdmin, AlcoholServer]
    code: 200
    input: []
    output: AlcoholServer
    side_effects: []
  - method: GET
    path: "/alcohol-servers"
    description: "Lists servers filterable by home jurisdiction, derived work eligibility and governing certificate."
    roles: [ProgramAdmin, StateRegulator, EmployerAdmin]
    code: 200
    input: ["state_jurisdiction_id?", "work_eligibility?", "active_certificate_id?", "limit?", "offset?"]
    output: AlcoholServer[]
    side_effects: []
  - method: GET
    path: "/alcohol-servers/{id}/server-assignments"
    description: "Lists every employment assignment of one server across locations."
    roles: [ProgramAdmin, EmployerAdmin, AlcoholServer]
    code: 200
    input: ["limit?", "offset?"]
    output: ServerAssignment[]
    side_effects: []

  # --- enrollments, attendance, exams ---
  - method: POST
    path: "/enrollments"
    description: "Enrolls a server into a scheduled class under optimistic concurrency on the session version; an employer sponsor debits one seat credit, otherwise the seat is self-pay."
    roles: [EmployerAdmin, AlcoholServer, ProgramAdmin]
    code: 201
    input: [class_session_id, alcohol_server_id, expected_class_session_version, "sponsoring_employer_account_id?"]
    output: Enrollment
    side_effects: ["enrollment_state = REGISTERED, paid_by resolved", "session.enrolled_count += 1", "increments ClassSession.version by 1", "sponsoring account: seat_credits_consumed_total += 1, seat_credit_balance -= 1, seat_credit_charged = true"]
  - method: POST
    path: "/enrollments/{id}/attendance"
    description: "Marks a locked-roster seat as attended or a no-show (no-shows forfeit the seat credit)."
    roles: [Trainer, ProgramAdmin]
    code: 200
    input: [attended]
    output: Enrollment
    side_effects: ["enrollment_state = ATTENDED or NO_SHOW"]
  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Withdraws a seat before the exam window opens and refunds the charged seat credit."
    roles: [EmployerAdmin, AlcoholServer, ProgramAdmin]
    code: 200
    input: ["withdrawal_reason?"]
    output: Enrollment
    side_effects: ["enrollment_state = WITHDRAWN", "session.enrolled_count -= 1", "increments ClassSession.version by 1", "seat credit refunded when charged"]
  - method: POST
    path: "/enrollments/{id}/exam-attempts"
    description: "Opens a proctored exam attempt; only the session's assigned proctor may call it, and the retake cap is checked before the cooling-off window."
    roles: [Trainer]
    code: 201
    input: []
    output: ExamAttempt
    side_effects: ["creates ExamAttempt with outcome IN_PROGRESS and snapshotted question_count", "enrollment_state = EXAM_IN_PROGRESS"]
  - method: POST
    path: "/exam-attempts/{id}/submit"
    description: "Submits a proctored attempt; scoring is inclusive at the passing threshold, and a withheld attestation voids the attempt without consuming a retake."
    roles: [Trainer]
    code: 200
    input: [raw_correct_count, proctor_attestation]
    output: ExamAttempt
    side_effects: ["outcome = PASS | FAIL | VOIDED, score_pct set", "enrollment attempt_count/best_score_pct/retake_eligible_at updated for counted attempts", "session.passed_count += 1 on PASS"]
  - method: GET
    path: "/enrollments/{id}"
    description: "Reads one enrollment with attempt counters and retake window."
    roles: [ProgramAdmin, Trainer, EmployerAdmin, AlcoholServer]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments"
    description: "Lists enrollments filterable by session, server, sponsoring account and state."
    roles: [ProgramAdmin, Trainer, EmployerAdmin, AlcoholServer]
    code: 200
    input: ["class_session_id?", "alcohol_server_id?", "sponsoring_employer_account_id?", "enrollment_state?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/enrollments/{id}/exam-attempts"
    description: "Lists every attempt on a seat, including voided ones, in ascending created_at."
    roles: [ProgramAdmin, StateRegulator, Trainer, AlcoholServer]
    code: 200
    input: ["limit?", "offset?"]
    output: ExamAttempt[]
    side_effects: []

  # --- certificates & registry ---
  - method: GET
    path: "/certificates/{id}"
    description: "Reads one certificate with both state dimensions, expiry anchoring and reminder counters."
    roles: [ProgramAdmin, StateRegulator, EmployerAdmin, AlcoholServer]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/certificates"
    description: "Lists certificates filterable by holder, issuing enrollment, jurisdiction, renewed predecessor, validity dimension and registry dimension."
    roles: [ProgramAdmin, StateRegulator, EmployerAdmin, AlcoholServer]
    code: 200
    input: ["alcohol_server_id?", "enrollment_id?", "state_jurisdiction_id?", "renews_certificate_id?", "validity_state?", "registry_state?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: POST
    path: "/certificates/{id}/registry-submissions"
    description: "Transmits a certificate to the state registry, computing whole-day lateness and the escalating per-submission penalty."
    roles: [ProgramAdmin]
    code: 201
    input: ["batch_reference?"]
    output: RegistrySubmission
    side_effects: ["submission_state = TRANSMITTED, late_days and penalty_fee_cents computed", "certificate.registry_state = SUBMITTED"]
  - method: POST
    path: "/registry-submissions/{id}/acknowledge"
    description: "Records the registry's answer; a rejection suspends the certificate and restricts the holder's mandated assignments, a later acceptance restores them."
    roles: [StateRegulator]
    code: 200
    input: [result, "rejection_code?"]
    output: RegistrySubmission
    side_effects: ["submission_state = ACCEPTED or REJECTED", "certificate.registry_state = ACCEPTED or RESUBMIT_REQUIRED", "on rejection: certificate validity_state = SUSPENDED then recompute chain R", "on acceptance of a suspended certificate: validity_state = ACTIVE then chain R restores assignments"]
  - method: GET
    path: "/certificates/{id}/registry-submissions"
    description: "Lists every registry transmission for a certificate in ascending created_at."
    roles: [ProgramAdmin, StateRegulator]
    code: 200
    input: ["limit?", "offset?"]
    output: RegistrySubmission[]
    side_effects: []

  # --- employers, seats, locations, assignments, dram-shop ---
  - method: POST
    path: "/employer-accounts"
    description: "Opens an employer training account in ACTIVE standing with a zero seat-credit ledger."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, billing_state_code]
    output: EmployerAccount
    side_effects: ["account_status = ACTIVE, all ledger totals 0, dram_shop_discount_status = NOT_DOCUMENTED"]
  - method: POST
    path: "/employer-accounts/{id}/status"
    description: "Sets the account's billing standing; DELINQUENT zeroes any future dram-shop discount and SUSPENDED blocks sponsoring and documentation."
    roles: [ProgramAdmin]
    code: 200
    input: [account_status, "status_reason?"]
    output: EmployerAccount
    side_effects: ["account_status set, status_reason recorded"]
  - method: POST
    path: "/employer-accounts/{id}/seat-credit-purchases"
    description: "Buys prepaid training seats; the settlement calculation applies a gross-subtotal volume tier, a capped processing fee and net-based bonus credits in a pinned order."
    roles: [EmployerAdmin, ProgramAdmin]
    code: 200
    input: [seat_quantity, unit_price_cents]
    output: EmployerAccount
    side_effects: ["seat_credits_purchased_total and seat_credit_balance increased by seat_credits_granted", "last_purchase_discount_pct, last_purchase_total_charged_cents, lifetime_charged_cents updated"]
  - method: POST
    path: "/employer-accounts/{id}/locations"
    description: "Adds a work location; its jurisdiction's mandate mapping decides whether training is MANDATED or VOLUNTARY there."
    roles: [EmployerAdmin, ProgramAdmin]
    code: 201
    input: [location_name, state_jurisdiction_id, premise_type, annual_premium_cents]
    output: EmployerLocation
    side_effects: ["training_requirement resolved", "metrics initialized (both rates 100.00)", "account.location_count += 1, then chains R4 and R5"]
  - method: POST
    path: "/employer-accounts/{id}/dram-shop-documents"
    description: "Issues dram-shop insurance discount documentation under optimistic concurrency: snapshots the strict compliance rate, selects a discount tier and computes the premium credit with per-location rounding."
    roles: [EmployerAdmin, ProgramAdmin]
    code: 201
    input: [insurer_name, policy_number, coverage_period_start, coverage_period_end, expected_employer_account_version]
    output: DramShopDocument
    side_effects: ["prior ISSUED document -> SUPERSEDED", "document_state = ISSUED with discount_tier, discount_pct, discount_credit_cents", "account.dram_shop_discount_status = DOCUMENTED, first_documented_at set on the first issuance", "increments EmployerAccount.version by 1"]
  - method: GET
    path: "/employer-accounts/{id}"
    description: "Reads one employer account with its seat-credit ledger and strict compliance roll-up."
    roles: [ProgramAdmin, StateRegulator, EmployerAdmin]
    code: 200
    input: []
    output: EmployerAccount
    side_effects: []
  - method: GET
    path: "/employer-accounts/{id}/dram-shop-documents"
    description: "Lists the account's dram-shop documents in ascending created_at."
    roles: [ProgramAdmin, StateRegulator, EmployerAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DramShopDocument[]
    side_effects: []
  - method: GET
    path: "/employer-locations/{id}"
    description: "Reads one location with both compliance rates and its posture."
    roles: [ProgramAdmin, StateRegulator, EmployerAdmin]
    code: 200
    input: []
    output: EmployerLocation
    side_effects: []
  - method: GET
    path: "/employer-locations"
    description: "Lists locations filterable by owning account, jurisdiction and posture."
    roles: [ProgramAdmin, StateRegulator, EmployerAdmin]
    code: 200
    input: ["employer_account_id?", "state_jurisdiction_id?", "compliance_posture?", "limit?", "offset?"]
    output: EmployerLocation[]
    side_effects: []
  - method: GET
    path: "/employer-locations/{id}/compliance-dashboard"
    description: "Per-location compliance dashboard. Returns the STORED derived metrics (both variants) exactly as last recomputed by a mutation or a compliance run; it never recomputes time-based state on read."
    roles: [ProgramAdmin, StateRegulator, EmployerAdmin]
    code: 200
    input: []
    output: "{ employer_location_id: string, training_requirement: string, assigned_server_count: integer, compliant_server_count: integer, grace_server_count: integer, restricted_server_count: integer, compliance_rate_strict_pct: number, compliance_rate_grace_inclusive_pct: number, compliance_posture: string }"
    side_effects: []
  - method: POST
    path: "/employer-locations/{id}/server-assignments"
    description: "Assigns a server to a work location; at MANDATED locations a RESTRICTED server is refused, while an UNCERTIFIED server starts a new-hire training window."
    roles: [EmployerAdmin, ProgramAdmin]
    code: 201
    input: [alcohol_server_id, role_title]
    output: ServerAssignment
    side_effects: ["assignment_state = ACTIVE, assigned_at = clock", "location counts and both rates recomputed, posture re-thresholded", "chains R4 and R5"]
  - method: POST
    path: "/server-assignments/{id}/end"
    description: "Ends an assignment, removing the server from the location's compliance denominator."
    roles: [EmployerAdmin, ProgramAdmin]
    code: 200
    input: ["end_reason?"]
    output: ServerAssignment
    side_effects: ["assignment_state = ENDED, ended_at = clock", "location counts and both rates recomputed", "chains R4 and R5"]
  - method: GET
    path: "/employer-locations/{id}/server-assignments"
    description: "Lists the assignments at one location in ascending created_at."
    roles: [ProgramAdmin, StateRegulator, EmployerAdmin]
    code: 200
    input: ["assignment_state?", "limit?", "offset?"]
    output: ServerAssignment[]
    side_effects: []

  # --- compliance epoch ---
  - method: POST
    path: "/compliance-runs"
    description: "Advances the compliance epoch against the logical clock, running eight ordered phases: trainer lapse, approval expiry, certificate grace/lapse, recertification reminders, server eligibility, assignment restriction/restoration, location metrics, account roll-up and dram-shop voiding."
    roles: [ProgramAdmin]
    code: 201
    input: []
    output: ComplianceRun
    side_effects:
      - "phase counters recorded on the returned ComplianceRun"
      - "certificate, server, assignment, location, account and document rows mutated per phases 1-8"
      - "phase 3 evaluates each certificate exactly once per run and applies AT MOST ONE validity transition, so a certificate whose expiry and whose grace window have both elapsed needs two runs to reach LAPSED (ACTIVE -> GRACE on the first, GRACE -> LAPSED on the second)"
      - "phase 4 emits at most one recertification reminder per certificate per run, only while validity_state is ACTIVE or GRACE and clock >= expires_at - jurisdiction.reminder_lead_days, and stops once reminder_sent_count reaches 2"

# ---------------------------------------------------------------------------
# 1.6 Error Catalog
# ---------------------------------------------------------------------------
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    when: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    when: "The caller's role is not listed in the endpoint's roles"
  - error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    when: "An entity-backed role acts on a resource it does not own (wrong trainer, wrong proctor, wrong employer account, wrong server)"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    when: "Missing required field, unknown enum member, out-of-range number, inverted datetime interval, or bad pagination parameter"
  - error_id: ERR_CATALOG_NOT_FOUND
    http_status: 404
    when: "A Course, CourseApproval or StateJurisdiction id (path or body) does not resolve"
  - error_id: ERR_TRAINING_NOT_FOUND
    http_status: 404
    when: "A ClassSession, Enrollment or ExamAttempt id (path or body) does not resolve"
  - error_id: ERR_CREDENTIAL_NOT_FOUND
    http_status: 404
    when: "A Trainer, AlcoholServer, Certificate or RegistrySubmission id (path or body) does not resolve"
  - error_id: ERR_EMPLOYER_NOT_FOUND
    http_status: 404
    when: "An EmployerAccount, EmployerLocation, ServerAssignment or DramShopDocument id (path or body) does not resolve"
  - error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    when: "expected_class_session_version does not equal ClassSession.version on POST /enrollments"
  - error_id: ERR_STALE_COURSE_VERSION
    http_status: 412
    when: "expected_course_version does not equal Course.version on PATCH /courses/{id}"
  - error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    when: "expected_employer_account_version does not equal EmployerAccount.version on POST /employer-accounts/{id}/dram-shop-documents"
  - error_id: ERR_COURSE_INVALID_STATE
    http_status: 409
    when: "Publishing a non-DRAFT course, revising a RETIRED course, superseding a non-PUBLISHED course, or submitting a non-PUBLISHED course for approval"
  - error_id: ERR_APPROVAL_INVALID_STATE
    http_status: 409
    when: "Deciding an approval that is not SUBMITTED, or resubmitting one that is not CHANGES_REQUESTED or STALE"
  - error_id: ERR_TRAINER_INVALID_STATE
    http_status: 409
    when: "Credentialing or suspending a trainer that is already SUSPENDED"
  - error_id: ERR_SESSION_INVALID_STATE
    http_status: 409
    when: "The class session is not in the from-state required by the requested transition (for example enrolling into a ROSTER_LOCKED session)"
  - error_id: ERR_ENROLLMENT_INVALID_STATE
    http_status: 409
    when: "The enrollment is not in the from-state required by the requested transition, or the exam attempt is no longer IN_PROGRESS"
  - error_id: ERR_CERTIFICATE_INVALID_STATE
    http_status: 409
    when: "Transmitting a certificate whose registry_state is not PENDING_SUBMISSION or RESUBMIT_REQUIRED, or whose validity_state is SUPERSEDED"
  - error_id: ERR_SUBMISSION_INVALID_STATE
    http_status: 409
    when: "Acknowledging a registry submission that is not TRANSMITTED"
  - error_id: ERR_ACCOUNT_INVALID_STATE
    http_status: 409
    when: "A SUSPENDED employer account attempts to sponsor a seat, buy seat credits, or be documented"
  - error_id: ERR_APPROVAL_NOT_EFFECTIVE
    http_status: 422
    when: "No APPROVED CourseApproval covers the requested session window for the (course, state) pair, or the pinned approval is no longer APPROVED at open-exam"
  - error_id: ERR_APPROVAL_STALE_CONTENT
    http_status: 409
    when: "The approval's pinned_course_version no longer matches, because the course content was revised after approval"
  - error_id: ERR_TRAINER_NOT_CERTIFIED
    http_status: 422
    when: "The instructing trainer or proctor is not CERTIFIED, lacks the track or state, or the credential expires before the session ends"
  - error_id: ERR_PROCTOR_SEPARATION_REQUIRED
    http_status: 422
    when: "The jurisdiction requires proctor separation and the nominated proctor is the instructing trainer"
  - error_id: ERR_SERVER_WORK_RESTRICTED
    http_status: 422
    when: "Assigning a RESTRICTED server to a location whose training_requirement is MANDATED"
  - error_id: ERR_MANDATE_TRACK_MISMATCH
    http_status: 422
    when: "mandate_type and the mandated_tracks cardinality disagree"
  - error_id: ERR_IDENTITY_ALREADY_REGISTERED
    http_status: 409
    when: "Duplicate StateJurisdiction.state_code, Trainer.email or AlcoholServer.email"
  - error_id: ERR_DUPLICATE_APPROVAL_REQUEST
    http_status: 409
    when: "A live approval already exists for the (course, state) pair"
  - error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    when: "The server already holds a non-withdrawn enrollment on this session"
  - error_id: ERR_DUPLICATE_ASSIGNMENT
    http_status: 409
    when: "The server already holds a live assignment at this location"
  - error_id: ERR_SESSION_AT_CAPACITY
    http_status: 409
    when: "enrolled_count has reached capacity"
  - error_id: ERR_EMPTY_ROSTER
    http_status: 422
    when: "Locking a roster with no live enrollment"
  - error_id: ERR_ATTENDANCE_INCOMPLETE
    http_status: 422
    when: "Opening the exam while at least one enrollment is still REGISTERED"
  - error_id: ERR_RETAKE_LIMIT_EXCEEDED
    http_status: 422
    when: "attempt_count has reached 1 + max_retakes_allowed"
  - error_id: ERR_TRAINER_SCHEDULE_CONFLICT
    http_status: 409
    when: "The requested window, widened by the 60-minute buffer, intersects another live session of the same trainer"
  - error_id: ERR_SERVER_SESSION_OVERLAP
    http_status: 409
    when: "The requested session's half-open window intersects a session the server is already enrolled in"
  - error_id: ERR_RETAKE_COOLING_OFF
    http_status: 422
    when: "The logical clock has not reached retake_eligible_at"
  - error_id: ERR_EXAM_WINDOW_NOT_OPEN
    http_status: 422
    when: "Opening the exam before scheduled_start_at"
  - error_id: ERR_SESSION_WINDOW_IN_PAST
    http_status: 422
    when: "scheduled_start_at is at or before the logical clock at session creation"
  - error_id: ERR_INSUFFICIENT_SEAT_CREDITS
    http_status: 402
    when: "The sponsoring account's seat_credit_balance is zero"
  - error_id: ERR_COMPLIANCE_RATE_TOO_LOW
    http_status: 422
    when: "account_compliance_rate_pct is below the 80.00 dram-shop documentation floor (including the 0.00 no-assignment case)"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
rbac:
  roles:
    - role: ProgramAdmin
      backing: opaque
      description: "Training provider staff. Authors the catalog, submits approvals, credentials trainers, transmits certificates to registries, runs the compliance epoch, and may act on any session, roster or employer resource without ownership."
      exclusive_operations:
        - "POST /_clock/set_current_utc"
        - "POST /state-jurisdictions"
        - "POST /courses"
        - "PATCH /courses/{id}"
        - "POST /courses/{id}/publish"
        - "POST /course-approvals"
        - "POST /course-approvals/{id}/resubmit"
        - "POST /trainers"
        - "POST /trainers/{id}/credential"
        - "POST /trainers/{id}/suspend"
        - "POST /certificates/{id}/registry-submissions"
        - "POST /employer-accounts"
        - "POST /employer-accounts/{id}/status"
        - "POST /compliance-runs"
      shared_operations:
        - "POST /class-sessions and every /class-sessions/{id}/* transition (shared with Trainer, no ownership requirement)"
        - "POST /enrollments, /enrollments/{id}/attendance, /enrollments/{id}/withdraw"
        - "POST /alcohol-servers"
        - "POST /employer-accounts/{id}/seat-credit-purchases, /locations, /dram-shop-documents"
        - "POST /employer-locations/{id}/server-assignments, POST /server-assignments/{id}/end"
        - "every GET"
    - role: StateRegulator
      backing: opaque
      description: "State licensing authority. Decides course approvals and acknowledges registry submissions. Segregation of duties: the regulator can never author or publish catalog content, submit an approval, resubmit one, or transmit a certificate — only decide what the provider submitted."
      exclusive_operations:
        - "POST /course-approvals/{id}/decision"
        - "POST /registry-submissions/{id}/acknowledge"
      shared_operations:
        - "GET /courses, GET /courses/{id}, GET /course-approvals*, GET /trainers/{id}, GET /class-sessions*, GET /alcohol-servers*, GET /enrollments/{id}/exam-attempts, GET /certificates*, GET /employer-accounts/{id}, GET /employer-locations*, GET /employer-locations/{id}/compliance-dashboard, GET /employer-locations/{id}/server-assignments, GET /employer-accounts/{id}/dram-shop-documents"
      denied_operations:
        - "POST /courses, PATCH /courses/{id}, POST /courses/{id}/publish, POST /course-approvals, POST /course-approvals/{id}/resubmit, POST /certificates/{id}/registry-submissions, POST /compliance-runs, POST /enrollments, POST /employer-accounts/{id}/dram-shop-documents"
    - role: Trainer
      backing: entity_backed
      backing_entity: Trainer
      ownership_rule: "X-User-ID must equal the ClassSession.trainer_id for lock-roster, attendance, complete and cancel; it must equal ClassSession.proctor_trainer_id for POST /enrollments/{id}/exam-attempts and POST /exam-attempts/{id}/submit. Under a jurisdiction with proctor_separation_required, these two ownership tests are mutually exclusive for the same session, so no single trainer can both instruct and score it."
      exclusive_operations:
        - "POST /enrollments/{id}/exam-attempts"
        - "POST /exam-attempts/{id}/submit"
      shared_operations:
        - "POST /class-sessions, POST /class-sessions/{id}/lock-roster, /open-exam, /complete, /cancel (shared with ProgramAdmin, ownership enforced)"
        - "POST /enrollments/{id}/attendance"
        - "GET /courses*, GET /course-approvals*, GET /trainers/{id}, GET /class-sessions*, GET /alcohol-servers/{id}, GET /enrollments*, GET /enrollments/{id}/exam-attempts"
      denied_operations:
        - "POST /courses, POST /course-approvals/{id}/decision, POST /trainers/{id}/credential, POST /enrollments, POST /certificates/{id}/registry-submissions, POST /employer-accounts/*, POST /compliance-runs"
    - role: EmployerAdmin
      backing: entity_backed
      backing_entity: EmployerAccount
      ownership_rule: "X-User-ID must equal the EmployerAccount.id in the path, the EmployerLocation's employer_account_id, the ServerAssignment's location's employer_account_id, or the Enrollment's sponsoring_employer_account_id."
      exclusive_operations: []
      shared_operations:
        - "POST /employer-accounts/{id}/seat-credit-purchases, /locations, /dram-shop-documents"
        - "POST /employer-locations/{id}/server-assignments, POST /server-assignments/{id}/end"
        - "POST /enrollments, POST /enrollments/{id}/withdraw"
        - "POST /alcohol-servers"
        - "GET /courses*, GET /class-sessions*, GET /alcohol-servers*, GET /alcohol-servers/{id}/server-assignments, GET /enrollments*, GET /certificates*, GET /employer-accounts/{id}, GET /employer-accounts/{id}/dram-shop-documents, GET /employer-locations*, GET /employer-locations/{id}/compliance-dashboard, GET /employer-locations/{id}/server-assignments"
      denied_operations:
        - "POST /courses*, POST /course-approvals*, POST /trainers*, POST /class-sessions*, POST /enrollments/{id}/attendance, POST /enrollments/{id}/exam-attempts, POST /exam-attempts/{id}/submit, POST /certificates/{id}/registry-submissions, POST /registry-submissions/{id}/acknowledge, POST /employer-accounts, POST /employer-accounts/{id}/status, POST /compliance-runs"
    - role: AlcoholServer
      backing: entity_backed
      backing_entity: AlcoholServer
      ownership_rule: "X-User-ID must equal the Enrollment's alcohol_server_id for POST /enrollments (the alcohol_server_id in the body) and POST /enrollments/{id}/withdraw, and must equal the AlcoholServer id for the assignment listing."
      exclusive_operations: []
      shared_operations:
        - "POST /enrollments (self-pay self-enrollment), POST /enrollments/{id}/withdraw"
        - "GET /alcohol-servers/{id}, GET /alcohol-servers/{id}/server-assignments, GET /enrollments*, GET /enrollments/{id}/exam-attempts, GET /certificates*"
      denied_operations:
        - "POST /courses*, POST /course-approvals*, POST /trainers*, POST /class-sessions*, POST /enrollments/{id}/attendance, POST /enrollments/{id}/exam-attempts, POST /exam-attempts/{id}/submit, POST /alcohol-servers, POST /certificates/{id}/registry-submissions, POST /registry-submissions/{id}/acknowledge, POST /employer-accounts*, POST /employer-locations/{id}/server-assignments, POST /server-assignments/{id}/end, POST /compliance-runs, GET /employer-locations/{id}/compliance-dashboard"
