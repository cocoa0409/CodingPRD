          - endpoints["POST /brand-protection/ops/run-enforcement-sweep"]
        distinguishing_aspect: "Sweep step 4 expires the recordation but deliberately does NOT touch the OPEN investigation that hangs off it, so evidence can still be filed inside the original 7-business-day detention window after the parent recordation has lapsed."
