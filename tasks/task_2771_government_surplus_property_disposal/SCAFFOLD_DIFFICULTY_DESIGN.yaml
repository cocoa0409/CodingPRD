  - rule_id: non_linear_state_machine
    instances:

      - name: nlsm_asset_dual_axis_disposition_and_clearance_independence
        grounds:
          - state_machines.SurplusAsset.clearance_status
          - state_machines.SurplusAsset.disposition_status
          - entities.SurplusAsset.fields.clearance_status
          - entities.ClearanceCertificate
          - validations[priority=59]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          SurplusAsset carries two independent state dimensions. The clearance axis walks
          REQUIRED_PENDING -> REQUIRED_PENDING -> BLOCKED -> CLEARED -> BLOCKED, including a regression
          out of the non-terminal CLEARED state, while the disposition axis independently walks
          INTAKE -> ASSESSED -> SCREENING. A BLOCKED clearance does not stop the disposition axis from
          entering screening, and a CLEARED clearance does not advance it; only the release gate reads
          both axes together.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one STATE_AGENCY organization DOT-01"
            - "asset D on a DRAFT turn-in: HEAVY_EQUIPMENT, cost 10472195, acquired 2026-01-10, is_data_bearing true, is_restricted true, demil_code C — so two certificate families are required"
            - "the turn-in is SUBMITTED so assessment is permitted; assessor-01 appraises, tech-01 certifies (distinct users, satisfying the segregation barrier)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag_st: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag_st}", custody_location: "Camp Mabry Motor Pool" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { ti1: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti1}", category: "HEAVY_EQUIPMENT", description: "Armored recovery vehicle with onboard mission computer", acquisition_cost_cents: 10472195, acquisition_date: "2026-01-10", is_data_bearing: true, is_restricted: true, demil_code: "C" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { asset_d: "$.data.id", asset_d_v: "$.data.version" }
            - call: "POST /turn-ins/${ti1}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag_st}"
          trigger:
            - call: "POST /assets/${asset_d}/condition-assessments"
              payload: { condition_code: "C1", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${asset_d_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /assets/${asset_d}/clearance-certificates"
              payload: { cert_type: "DATA_SANITIZATION", method: "NIST_PURGE", serials_verified: true, certified_on: "2026-08-01" }
              as: ClearanceTechnician
              as_user_id: "tech-01"
            - call: "POST /assets/${asset_d}/clearance-certificates"
              payload: { cert_type: "DEMILITARIZATION", method: "MUTILATE", serials_verified: false, certified_on: "2026-08-01", notes: "Cutting torch unavailable; turret ring left intact" }
              as: ClearanceTechnician
              as_user_id: "tech-01"
            - call: "POST /turn-ins/${ti1}/review"
              payload: { decision: "ACCEPT" }
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles"
              payload: { asset_id: "${asset_d}", opens_at: "2026-08-01T00:00:00Z", tier_window_days: 5 }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { cyc_d: "$.data.id" }
            - call: "POST /assets/${asset_d}/clearance-certificates"
              payload: { cert_type: "DEMILITARIZATION", method: "MUTILATE", serials_verified: true, certified_on: "2026-08-01", notes: "Turret ring cut and hull plate removed" }
              as: ClearanceTechnician
              as_user_id: "tech-01"
            - call: "POST /assets/${asset_d}/clearance-certificates"
              payload: { cert_type: "DATA_SANITIZATION", method: "NIST_CLEAR", serials_verified: false, certified_on: "2026-08-01", notes: "Re-inspection found an undocumented spare drive" }
              as: ClearanceTechnician
              as_user_id: "tech-01"
          assert:
            - "immediately after POST /assets: SurplusAsset.${asset_d}.clearance_status == REQUIRED_PENDING and disposition_status == INTAKE — the clearance axis starts loaded, not NOT_REQUIRED"
            - "after the assessment: disposition_status == ASSESSED, clearance_status still REQUIRED_PENDING, fair_market_value_cents == 10472195"
            - "after the verified DATA_SANITIZATION certificate: clearance_status == REQUIRED_PENDING — the DEMILITARIZATION family is still outstanding, so this is the self-transition, not CLEARED"
            - "after the unverified DEMILITARIZATION certificate: clearance_status == BLOCKED and disposition_status is still ASSESSED"
            - "POST /screening-cycles succeeds with 201 while clearance_status == BLOCKED: disposition_status == SCREENING, ScreeningCycle.${cyc_d}.status == OPEN, current_tier == STATE_AGENCY"
            - "after the verified DEMILITARIZATION certificate: clearance_status == CLEARED and disposition_status is still SCREENING — clearance does not push the disposition axis forward"
            - "after the final unverified DATA_SANITIZATION certificate: clearance_status == BLOCKED again (CLEARED is not terminal) and disposition_status is still SCREENING"
            - "GET /assets/${asset_d}/clearance-certificates returns total_count == 4 including both failed certificates, which are retained for audit"
            - "SurplusAsset.${asset_d}.version == 7 — one increment each for create, assessment, four certificates and the screening-cycle transition; review with decision == ACCEPT touches only the TurnIn"
            - "TurnIn.${ti1}.status == ACCEPTED and TurnIn.${ti1}.appraised_total_cents == 10472195"

      - name: nlsm_screening_cycle_award_then_void_returns_to_open
        grounds:
          - state_machines.ScreeningCycle.AWARDED_to_OPEN
          - state_machines.ScreeningCycle.OPEN_to_AWARDED
          - state_machines.ScreeningRequest.APPROVED_to_DENIED
          - state_machines.SurplusAsset.AWARDED_TRANSFER_to_SCREENING
          - endpoints[POST /transfer-orders/{id}/void]
          - entities.ScreeningCycle.fields.tier_opened_at
        distinguishing_aspect: |
          The ScreeningCycle re-enters a state it already left: OPEN -> AWARDED -> OPEN -> AWARDED. The
          second OPEN is not a fresh cycle — current_tier and tier_advance_count are preserved while
          tier_opened_at and tier_deadline_at are re-stamped from the logical clock, so the cycle is
          re-armed at the same tier with a later deadline and awarded_at is cleared before the second
          award re-stamps it.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, later advanced to 2026-08-04T00:00:00Z"
            - "three STATE_AGENCY organizations: DOT-01 turning in, DPS-02 and TWC-03 competing"
            - "one ACCEPTED turn-in with a 2019 pickup assessed C4 / functional / repair 185000 -> fair_market_value_cents 297620"
            - "a ScreeningCycle opened 2026-08-01 with tier_window_days 5 (tier_deadline_at 2026-08-06T00:00:00Z), still at the STATE_AGENCY tier"
            - "two competing requests r1 (DPS-02) and r2 (TWC-03), both SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag_st: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "State Department of Public Safety", agency_code: "DPS-02", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag_st2: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "State Workforce Commission", agency_code: "TWC-03", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
