# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 Difficulty Rules x 2 instances each = 18 instances
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: custody_provisional_vs_certified_volume
        grounds:
          - calculations.custody_transfer_volume
          - state_machines.CustodyTransfer.PROVISIONAL_to_CERTIFIED
        distinguishing_aspect: |
          CustodyTransfer-domain dual variant: identical gauge pair yields
          provisional_volume_bbl == 4069 (temperature correction only) but
          certified_volume_bbl == 4021 (extra specific-gravity ratio 0.84/0.85),
          proving the two variants produce different results for identical inputs.
        test_recipe:
          setup:
            - "ACTIVE lease (DIESEL, loss_allowance_pct 0.005) with ACTIVE allocation 50000 bbl on a 200000-bbl DIESEL tank (working 189900)"
            - "COMPLETED RECEIPT movement declared 4069 bbl; OPENING 1000 bbl @60F, CLOSING 5100 bbl @70F"
            - "Sample PASSED with specific_gravity 0.84 (DIESEL standard is 0.85)"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Acme Oil", contact_email: "ops@acme.example" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-101", product_grade: "DIESEL", capacity_bbl: 200000, heel_bbl: 100 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 100000, min_monthly_throughput_bbl: 1000, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 50000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-1", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 4069, window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T20:00:00Z" }, as: Scheduler, captures: { m_id: $.data.id } }
            - { call: "POST /movements/${m_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/arrive", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "OPENING", observed_volume_bbl: 1000, observed_temp_f: 60, observed_at: "2026-05-10T10:05:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /movements/${m_id}/start", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "CLOSING", observed_volume_bbl: 5100, observed_temp_f: 70, observed_at: "2026-05-10T16:05:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T16:10:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/complete", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/samples", payload: { sample_type: "INLINE" }, as: QualityInspector, as_user_id: "qi-1", captures: { s_id: $.data.id } }
            - { call: "POST /quality-samples/${s_id}/record-result", payload: { lab_result: "PASSED", specific_gravity: 0.84 }, as: QualityInspector, as_user_id: "qi-2" }
            - { call: "GET /movements/${m_id}/custody-transfers", payload: {}, as: TerminalManager, captures: { ct_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /custody-transfers/${ct_id}/certify", payload: {}, as: TerminalManager, as_user_id: "tm-1" }
            - { call: "GET /custody-transfers/${ct_id}", payload: {}, as: TerminalManager }
          assert:
            - "CustodyTransfer.${ct_id}.provisional_volume_bbl == 4069"
            - "CustodyTransfer.${ct_id}.certified_volume_bbl == 4021"
            - "CustodyTransfer.${ct_id}.certified_volume_bbl != CustodyTransfer.${ct_id}.provisional_volume_bbl"
            - "CustodyTransfer.${ct_id}.status == CERTIFIED"

      - name: demurrage_estimate_vs_actual_settlement
        grounds:
          - calculations.demurrage_charge
          - state_machines.Movement.NOMINATED_to_SCHEDULED
          - state_machines.Movement.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Movement-domain dual variant: the same VESSEL movement yields
          demurrage_estimated_amount == 7200.00 (forward-looking from the 30h
          window vs 24h free) but demurrage_actual_amount == 2400.00
          (chronological from actual 26h elapsed), different results on the
          same movement.
        test_recipe:
          setup:
            - "ACTIVE lease (GASOLINE) with ACTIVE allocation on a GASOLINE tank"
            - "VESSEL RECEIPT movement declared 100 bbl, window 2026-05-10T00:00:00Z..2026-05-11T06:00:00Z (30h)"
            - "Arrival at window start; completion 26h after arrival"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Beacon Fuels", contact_email: "sched@beacon.example" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-201", product_grade: "GASOLINE", capacity_bbl: 100000, heel_bbl: 50 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "GASOLINE", committed_capacity_bbl: 50000, min_monthly_throughput_bbl: 500, throughput_fee_per_bbl: 0.40, shortfall_fee_per_bbl: 0.40, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 40.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 40000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-2", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "GASOLINE", declared_volume_bbl: 100, window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-11T06:00:00Z" }, as: Scheduler, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /movements/${m_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/arrive", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "OPENING", observed_volume_bbl: 0, observed_temp_f: 60, observed_at: "2026-05-10T00:05:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /movements/${m_id}/start", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "CLOSING", observed_volume_bbl: 100, observed_temp_f: 60, observed_at: "2026-05-11T01:30:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T02:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/complete", payload: {}, as: Scheduler }
            - { call: "GET /movements/${m_id}", payload: {}, as: Scheduler }
          assert:
            - "Movement.${m_id}.demurrage_estimated_amount == 7200.00"
            - "Movement.${m_id}.demurrage_actual_amount == 2400.00"
            - "Movement.${m_id}.demurrage_estimated_amount != Movement.${m_id}.demurrage_actual_amount"
            - "Movement.${m_id}.status == COMPLETED"

  - rule_id: combinatorial_formula
    instances:
      - name: tiered_throughput_fee_straddling
        grounds:
          - calculations.throughput_fee_tiered
          - state_machines.MonthlyStatement.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (a) tiered-rate selection with >=3 inputs and non-linear tier
          interaction: 60000 certified barrels at base 0.50 straddle tier1/tier2
          giving 50000*0.50 + 10000*0.45 = 29500.00 (not 60000*0.50=30000.00
          nor 60000*0.45=27000.00).
        test_recipe:
          setup:
            - "ACTIVE lease (DIESEL, base fee 0.50, min commitment 55000) with 100000-bbl ACTIVE allocation on a 200000-bbl DIESEL tank"
            - "One RECEIPT movement certified at exactly 60000 bbl in period 2026-05 (gauges 0->60000 @60F, sample sg 0.85 == standard)"
            - "OPEN MonthlyStatement for 2026-05; clock advanced to 2026-06-01"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Coastal Energy", contact_email: "billing@coastal.example" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-301", product_grade: "DIESEL", capacity_bbl: 200000, heel_bbl: 100 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 200000, min_monthly_throughput_bbl: 55000, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.005, excess_loss_rate_per_bbl: 50.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 100000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /lease-agreements/${l_id}/statements", payload: { period: "2026-05" }, as: BillingClerk, captures: { st_id: $.data.id } }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-3", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 60000, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T20:00:00Z" }, as: Scheduler, captures: { m_id: $.data.id } }
            - { call: "POST /movements/${m_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/arrive", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "OPENING", observed_volume_bbl: 0, observed_temp_f: 60, observed_at: "2026-05-10T08:05:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /movements/${m_id}/start", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/gauge-tickets", payload: { ticket_type: "CLOSING", observed_volume_bbl: 60000, observed_temp_f: 60, observed_at: "2026-05-10T10:00:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:05:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/complete", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m_id}/samples", payload: { sample_type: "ALL_LEVELS" }, as: QualityInspector, as_user_id: "qi-1", captures: { s_id: $.data.id } }
            - { call: "POST /quality-samples/${s_id}/record-result", payload: { lab_result: "PASSED", specific_gravity: 0.85 }, as: QualityInspector, as_user_id: "qi-2" }
            - { call: "GET /movements/${m_id}/custody-transfers", payload: {}, as: TerminalManager, captures: { ct_id: "$.data[0].id" } }
            - { call: "POST /custody-transfers/${ct_id}/certify", payload: {}, as: TerminalManager, as_user_id: "tm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: TerminalManager }
          trigger:
            - { call: "POST /monthly-statements/${st_id}/close", payload: {}, as: BillingClerk }
            - { call: "GET /monthly-statements/${st_id}", payload: {}, as: BillingClerk }
          assert:
            - "MonthlyStatement.${st_id}.total_throughput_bbl == 60000"
            - "MonthlyStatement.${st_id}.throughput_fee_amount == 29500.00"
            - "MonthlyStatement.${st_id}.shortfall_bbl == 0"
            - "MonthlyStatement.${st_id}.status == CLOSED"

      - name: statement_per_line_rounding_order
        grounds:
          - calculations.monthly_statement_aggregation
          - calculations.shrinkage_and_excess_loss
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: two custody transfers each
          produce excess_loss_charge 55.555 -> 55.56 rounded per line, summing to
          111.12; the forbidden sum-then-round of raw values yields 111.11, so the
          pinned per-line-then-sum order is observable.
        test_recipe:
          setup:
            - "ACTIVE lease (DIESEL, loss_allowance_pct 0.002, excess_loss_rate_per_bbl 55.555, min commitment 100) with ACTIVE allocation 50000 on a 200000-bbl tank (working 189900)"
            - "Two RECEIPT movements in 2026-05, each declared 1000 bbl and certified at 997 bbl (sg 0.85 == standard): shrinkage 3, allowed 2, excess 1, line charge 55.555 -> 55.56"
            - "OPEN MonthlyStatement 2026-05; clock at 2026-06-01"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Delta Petrochem", contact_email: "ops@delta.example" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-401", product_grade: "DIESEL", capacity_bbl: 200000, heel_bbl: 100 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "DIESEL", committed_capacity_bbl: 100000, min_monthly_throughput_bbl: 100, throughput_fee_per_bbl: 0.50, shortfall_fee_per_bbl: 0.50, loss_allowance_pct: 0.002, excess_loss_rate_per_bbl: 55.555, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 50000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
            - { call: "POST /tank-allocations/${a_id}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /lease-agreements/${l_id}/activate", payload: {}, as: TerminalManager }
            - { call: "POST /lease-agreements/${l_id}/statements", payload: { period: "2026-05" }, as: BillingClerk, captures: { st_id: $.data.id } }
            - { call: "POST /terminal-resources", payload: { resource_code: "DOCK-4", resource_type: "DOCK" }, as: TerminalOperator, captures: { r_id: $.data.id } }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 1000, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Scheduler, captures: { m1_id: $.data.id } }
            - { call: "POST /movements/${m1_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m1_id}/arrive", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m1_id}/gauge-tickets", payload: { ticket_type: "OPENING", observed_volume_bbl: 0, observed_temp_f: 60, observed_at: "2026-05-10T08:05:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /movements/${m1_id}/start", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m1_id}/gauge-tickets", payload: { ticket_type: "CLOSING", observed_volume_bbl: 997, observed_temp_f: 60, observed_at: "2026-05-10T10:00:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:05:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m1_id}/complete", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m1_id}/samples", payload: { sample_type: "INLINE" }, as: QualityInspector, as_user_id: "qi-1", captures: { s1_id: $.data.id } }
            - { call: "POST /quality-samples/${s1_id}/record-result", payload: { lab_result: "PASSED", specific_gravity: 0.85 }, as: QualityInspector, as_user_id: "qi-2" }
            - { call: "GET /movements/${m1_id}/custody-transfers", payload: {}, as: TerminalManager, captures: { ct1_id: "$.data[0].id" } }
            - { call: "POST /custody-transfers/${ct1_id}/certify", payload: {}, as: TerminalManager, as_user_id: "tm-1" }
            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 1000, window_start: "2026-05-11T08:00:00Z", window_end: "2026-05-11T12:00:00Z" }, as: Scheduler, captures: { m2_id: $.data.id } }
            - { call: "POST /movements/${m2_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T08:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m2_id}/arrive", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m2_id}/gauge-tickets", payload: { ticket_type: "OPENING", observed_volume_bbl: 997, observed_temp_f: 60, observed_at: "2026-05-11T08:05:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /movements/${m2_id}/start", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m2_id}/gauge-tickets", payload: { ticket_type: "CLOSING", observed_volume_bbl: 1994, observed_temp_f: 60, observed_at: "2026-05-11T10:00:00Z" }, as: Gauger, as_user_id: "gauger-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T10:05:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m2_id}/complete", payload: {}, as: Scheduler }
            - { call: "POST /movements/${m2_id}/samples", payload: { sample_type: "INLINE" }, as: QualityInspector, as_user_id: "qi-1", captures: { s2_id: $.data.id } }
            - { call: "POST /quality-samples/${s2_id}/record-result", payload: { lab_result: "PASSED", specific_gravity: 0.85 }, as: QualityInspector, as_user_id: "qi-2" }
            - { call: "GET /movements/${m2_id}/custody-transfers", payload: {}, as: TerminalManager, captures: { ct2_id: "$.data[0].id" } }
            - { call: "POST /custody-transfers/${ct2_id}/certify", payload: {}, as: TerminalManager, as_user_id: "tm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: TerminalManager }
          trigger:
            - { call: "POST /monthly-statements/${st_id}/close", payload: {}, as: BillingClerk }
            - { call: "GET /monthly-statements/${st_id}", payload: {}, as: BillingClerk }
          assert:
            - "MonthlyStatement.${st_id}.total_excess_loss_bbl == 2"
            - "MonthlyStatement.${st_id}.excess_loss_amount == 111.12"
            - "CustodyTransfer.${ct1_id}.excess_loss_charge == 55.56 (re-readable via GET /custody-transfers/${ct1_id})"
            - "MonthlyStatement.${st_id}.excess_loss_amount != 111.11"

  - rule_id: non_linear_state_machine
    instances:
      - name: lease_suspend_reactivate_cycle
        grounds:
          - state_machines.LeaseAgreement.ACTIVE_to_SUSPENDED
          - state_machines.LeaseAgreement.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on LeaseAgreement: ACTIVE -> SUSPENDED -> ACTIVE loop is
          legal and suspension_reason flips MANUAL -> null, whereas a linear
          pipeline would forbid the return edge.
        test_recipe:
          setup:
            - "ACTIVE lease with one ACTIVE allocation"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Harbor Trading", contact_email: "ops@harbor.example" }, as: TerminalManager, captures: { c_id: $.data.id } }
            - { call: "POST /tanks", payload: { tank_code: "T-501", product_grade: "JET", capacity_bbl: 80000, heel_bbl: 50 }, as: TerminalOperator, captures: { t_id: $.data.id } }
            - { call: "POST /lease-agreements", payload: { customer_id: "${c_id}", product_grade: "JET", committed_capacity_bbl: 40000, min_monthly_throughput_bbl: 500, throughput_fee_per_bbl: 0.60, shortfall_fee_per_bbl: 0.60, loss_allowance_pct: 0.004, excess_loss_rate_per_bbl: 70.00, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CustomerRep, as_user_id: "${c_id}", captures: { l_id: $.data.id } }
            - { call: "POST /lease-agreements/${l_id}/allocations", payload: { tank_id: "${t_id}", allocated_bbl: 30000, period_start: "2026-01-01", period_end: "2026-12-31" }, as: TerminalOperator, captures: { a_id: $.data.id } }
