              payload: { expected_terminal_version: "${t_v1}" }
              as: YardPlanner
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v2: $.data.version}
            - call: "POST /terminals/${tid}/containers/${c2}/ground"
              payload: { expected_terminal_version: "${t_v2}" }
              as: YardPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:00:00Z" }
              as: TerminalManager
            - call: "POST /terminals/${tid}/appointments"
              payload: { carrier_id: "${car}", container_id: "${c1}", direction: "OUT", window_start_utc: "2026-08-02T09:00:00Z", window_end_utc: "2026-08-02T11:00:00Z" }
              as: GateSupervisor
              captures: {appt1: $.data.id}
            - call: "POST /terminals/${tid}/appointments"
              payload: { carrier_id: "${car}", container_id: "${c2}", direction: "OUT", window_start_utc: "2026-08-02T09:00:00Z", window_end_utc: "2026-08-02T11:00:00Z" }
              as: GateSupervisor
              captures: {appt2: $.data.id}
            - call: "POST /terminals/${tid}/appointments/${appt1}/check_in"
