scaffold_difficulty_design:
  # =========================================================================
  # RULE 1 — dual_variant_calc: two calculations in DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: record_book_provisional_vs_final_score
        grounds:
          - calculations.record_book_score
          - state_machines.RecordBook.DRAFT_to_SUBMITTED
          - state_machines.RecordBook.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Record book scoring has a provisional variant (plain weighted sum, computed at submit)
          and a final variant (adds officer bonus capped at 100, subtracts late penalty, computed
          at approval). For identical section scores 80/90/70/85 with an officer member 2 days
          late, provisional == 81.00 but final == 80.00; the two variants diverge on the RecordBook entity.
        test_recipe:
          setup:
            - "Club, cleared Volunteer, ACTIVE officer Member, ACTIVE project, RecordBook with one POSTED ledger entry"
            - "logical clock set to 2026-07-17T10:00:00Z (2 days past the 2026-07-15 deadline)"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Prairie View 4-H", county_code: "PV" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol One", email: "v1@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem A", birth_date: "2009-05-01", club_id: "${club_id}", is_club_officer: true }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books"
              payload: { project_id: "${proj_id}", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_id: $.data.id, rb_v: $.data.version }
            - call: "POST /api/ledger-entries"
              payload: { record_book_id: "${rb_id}", entry_kind: "EXPENSE", amount_cents: 15000, hours: 0, recorded_on: "2026-06-01" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-17T10:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v}", completeness: 80, accuracy: 90, financial: 70, reflection: 85 }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books/${rb_id}/begin-review"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/record-books/${rb_id}/approve"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { rb_final: $.data.final_score, rb_prov_after: $.data.provisional_score }
          assert:
            - "RecordBook.${rb_id}.provisional_score == 81.00"
            - "RecordBook.${rb_id}.late_days == 2"
            - "RecordBook.${rb_id}.final_score == 80.00"
            - "RecordBook.${rb_id}.final_score != RecordBook.${rb_id}.provisional_score"

      - name: scholarship_round_per_line_vs_sum_then_round
        grounds:
          - calculations.scholarship_points
          - state_machines.ScholarshipApp.OPEN_to_UNDER_REVIEW
        distinguishing_aspect: |
          Scholarship points operate on the Member's completed projects (a different entity domain
          than RecordBook scoring) and pin a round-per-line-then-sum order. With base=7 and grades
          A,A,B,C the per-line-rounded total is 37, whereas the rejected sum-then-round order yields
          36; the scaffold pins 37, so the two valid interpretations diverge on the Member domain.
        test_recipe:
          setup:
            - "Member with four COMPLETED projects graded A, A, B, C"
            - "A SCHOLARSHIP-track AwardApplication for the member in EVALUATED status with tier GOLD"
            - "A ScholarshipApp in OPEN status linked to that award application"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Riverbend FFA", county_code: "RB" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol S", email: "vs@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
