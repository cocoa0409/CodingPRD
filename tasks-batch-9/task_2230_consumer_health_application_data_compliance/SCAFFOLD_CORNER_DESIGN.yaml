              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "CT", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
