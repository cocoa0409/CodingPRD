              payload: {}
              as: AuthorizerStaff
          trigger:
            - call: "POST /authorizer/applications/${app_b}/interviews"
              payload: { scheduled_start: "2026-06-08T11:00:00Z", scheduled_end: "2026-06-08T12:00:00Z", panelist_user_ids: ["rev_p1"] }
              as: AuthorizerStaff
              captures: { int_b: $.data.id, int_b_status: $.data.status }
            - call: "POST /authorizer/applications/${app_c}/interviews"
              payload: { scheduled_start: "2026-06-08T10:30:00Z", scheduled_end: "2026-06-08T11:30:00Z", panelist_user_ids: ["rev_p1"] }
              as: AuthorizerStaff
              captures: { overlap_err: $.data.error_id }
          assert:
            - "adjacent schedule (11:00 start == 11:00 end) succeeded: captured status == 'SCHEDULED'"
            - "overlapping schedule (10:30-11:30 vs 10:00-11:00 and 11:00-12:00) captured error_id == 'ERR_PANEL_TIME_OVERLAP'"

