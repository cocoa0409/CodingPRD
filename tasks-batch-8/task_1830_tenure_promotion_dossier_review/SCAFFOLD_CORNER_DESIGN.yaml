            - { call: "POST /api/dossier-items", payload: { case_id: "${case_pg}", category: "SERVICE", title: "P3", page_count: 4, expected_case_version: "${case_pg_v} + 2" }, as: Candidate, as_user_id: "${cand_pg}" }
          trigger:
            - { call: "GET /api/dossier-items?case_id=${case_pg}&limit=2&offset=0", as: Any, captures: { pg_first_id: "$.data[0].id" } }
            - { call: "GET /api/dossier-items?case_id=${case_pg}&limit=2&offset=2", as: Any, captures: { pg_third_id: "$.data[0].id" } }
            - { call: "GET /api/dossier-items?case_id=${case_pg}&limit=0", as: Any, captures: { err_pg1: $.data.error_id } }
            - { call: "GET /api/dossier-items?case_id=${case_pg}&limit=101", as: Any, captures: { err_pg2: $.data.error_id } }
          assert:
            - "page 1 (limit=2, offset=0): 2 items, total_count == 3, has_more == true"
            - "page 2 (limit=2, offset=2): exactly 1 item (pg_third_id is its only element), total_count == 3, has_more == false"
            - "pg_first_id != pg_third_id (disjoint pages in created_at ASC order)"
            - "err_pg1 == ERR_INVALID_REQUEST AND err_pg2 == ERR_INVALID_REQUEST (limit outside 1..100)"

