          assert:
            - "rejected ERR_SEARCH_ALREADY_ACTIVE; only one search row exists for the file"
      - name: v_trust_overlap_on_accept
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_TRUST_OVERLAP]"]
        distinguishing_aspect: "Accepting a trust whose [effective, expiry] strictly overlaps an already-ACCEPTED trust on the same aircraft fails ERR_TRUST_OVERLAP; a merely touching term (prior expiry == new effective) is accepted — closed-interval adjacency semantics."
        test_recipe:
          setup: ["aircraft; verified trustee; trust T1 ACCEPTED for 2026-01-01..2026-06-30; trust T2 SUBMITTED overlapping (2026-06-01..2026-12-31); trust T3 SUBMITTED touching (2026-07-01..2026-12-31)"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N144TO", serial_number: "S-29", make_model: "HondaJet", year: 2021 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "TRUSTEE", legal_name: "Trustee Co", is_citizenship_verified: true }, as: EscrowOfficer, captures: { tr: $.data.id } }
            - { call: "POST /api/trust-agreements", payload: { aircraft_id: "${ac}", trustee_party_id: "${tr}", beneficiary_name: "Ben One", beneficiary_citizenship: "NON_US_CITIZEN", effective_date: "2026-01-01", expiry_date: "2026-06-30" }, as: EscrowOfficer, captures: { t1: $.data.id } }
            - { call: "POST /api/trust-agreements/${t1}/submit", payload: {}, as: EscrowOfficer }
            - { call: "POST /api/trust-agreements/${t1}/accept", payload: {}, as: EscrowManager }
            - { call: "POST /api/trust-agreements", payload: { aircraft_id: "${ac}", trustee_party_id: "${tr}", beneficiary_name: "Ben Two", beneficiary_citizenship: "NON_US_CITIZEN", effective_date: "2026-06-01", expiry_date: "2026-12-31" }, as: EscrowOfficer, captures: { t2: $.data.id } }
            - { call: "POST /api/trust-agreements/${t2}/submit", payload: {}, as: EscrowOfficer }
            - { call: "POST /api/trust-agreements", payload: { aircraft_id: "${ac}", trustee_party_id: "${tr}", beneficiary_name: "Ben Three", beneficiary_citizenship: "US_CITIZEN", effective_date: "2026-07-01", expiry_date: "2026-12-31" }, as: EscrowOfficer, captures: { t3: $.data.id } }
            - { call: "POST /api/trust-agreements/${t3}/submit", payload: {}, as: EscrowOfficer }
          trigger:
            - { call: "POST /api/trust-agreements/${t2}/accept", payload: {}, as: EscrowManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/trust-agreements/${t3}/accept", payload: {}, as: EscrowManager, captures: { st3: $.data.status } }
          assert:
            - "T2 (interior overlap 2026-06-01..2026-06-30) rejected ERR_TRUST_OVERLAP"
            - "T3 (touching: T1 expiry 2026-06-30 < T3 effective 2026-07-01) accepted — adjacency allowed"
      - name: v_trustee_not_qualified_on_submit
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_TRUSTEE_NOT_QUALIFIED]"]
        distinguishing_aspect: "Submitting a trust whose trustee party lacks citizenship verification fails ERR_TRUSTEE_NOT_QUALIFIED (422) — business_safety gate at submit time, not creation."
        test_recipe:
          setup: ["aircraft; trustee with is_citizenship_verified false; DRAFT trust"]
          setup_api_calls:
