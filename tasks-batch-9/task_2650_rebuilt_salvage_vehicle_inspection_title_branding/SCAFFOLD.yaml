  - method: GET
    path: "/v1/appeals"
    description: "list appeals; reverse-reachability for Appeal.inspection_id"
    roles: [ProgramAdmin, StateTitleClerk, Rebuilder, Inspector, HearingOfficer]
    code: 200
    input: ["inspection_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: GET
    path: "/v1/fraud-referrals/{id}"
    description: "read one fraud referral"
    roles: [ProgramAdmin, StateTitleClerk, Inspector, FraudInvestigator, HearingOfficer]
    code: 200
    input: []
    output: FraudReferral
    side_effects: []

  - method: GET
    path: "/v1/fraud-referrals"
    description: >-
      list fraud referrals; reverse-reachability for FraudReferral.vehicle_id,
      FraudReferral.application_id and FraudReferral.inspection_id
    roles: [ProgramAdmin, StateTitleClerk, Inspector, FraudInvestigator, HearingOfficer]
    code: 200
    input: ["vehicle_id?", "application_id?", "inspection_id?", "referral_type?", "status?", "limit?", "offset?"]
    output: FraudReferral[]
    side_effects: []

  - method: GET
    path: "/v1/recognition-requests/{id}"
    description: "read one interstate recognition request"
    roles: [ProgramAdmin, StateTitleClerk, Rebuilder, HearingOfficer]
    code: 200
    input: []
    output: InterstateRecognitionRequest
    side_effects: []

  - method: GET
    path: "/v1/recognition-requests"
    description: "list interstate recognition requests; reverse-reachability for InterstateRecognitionRequest.title_record_id"
    roles: [ProgramAdmin, StateTitleClerk, Rebuilder, HearingOfficer]
    code: 200
    input: ["title_record_id?", "requesting_state_code?", "status?", "limit?", "offset?"]
    output: InterstateRecognitionRequest[]
    side_effects: []

  - method: GET
    path: "/v1/title-transfers/{id}"
    description: "read one recorded transfer with its odometer_flag and carried_brand_code"
    roles: [ProgramAdmin, StateTitleClerk, Rebuilder, FraudInvestigator, HearingOfficer]
    code: 200
    input: []
    output: TitleTransfer
    side_effects: []

  - method: GET
    path: "/v1/title-transfers"
    description: >-
      list recorded transfers; reverse-reachability for TitleTransfer.from_title_id and
      TitleTransfer.to_title_id
    roles: [ProgramAdmin, StateTitleClerk, Rebuilder, FraudInvestigator, HearingOfficer]
    code: 200
    input: ["from_title_id?", "to_title_id?", "odometer_flag?", "limit?", "offset?"]
    output: TitleTransfer[]
    side_effects: []

  # --------------------------------------------------------------- writes ----
  - method: POST
    path: "/v1/vehicles"
    description: "register a vehicle record"
    roles: [StateTitleClerk]
    code: 201
    input: [vin, model_year, make, model, body_class, registered_state_code]
    output: Vehicle
    side_effects: ["fraud_hold = NONE, active_brand_code = NONE, brand_history = []"]

  - method: POST
    path: "/v1/rebuilders"
    description: "license a rebuilder"
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, license_number, license_expires_at, bond_amount_cents]
    output: Rebuilder
    side_effects: ["license_status = ACTIVE; every fee counter starts at 0"]

  - method: POST
    path: "/v1/rebuilders/{id}/deposits"
    description: "credit program funds the rebuilder can escrow against applications"
    roles: [ProgramAdmin]
    code: 200
    input: [amount_cents]
    output: Rebuilder
    side_effects:
      - "fees_deposited_cents += amount_cents; fee_balance_cents += amount_cents"
      - "increments Rebuilder.version by 1"

  - method: POST
    path: "/v1/rebuilders/{id}/license-actions"
    description: >-
      apply a license action (PROBATION, CLEAR_PROBATION, SUSPEND, REINSTATE, REVOKE); REINSTATE
      is gated by segregation of duties and by the rolling record-keeping score, REVOKE by the
      lifetime score
    roles: [ProgramAdmin]
    code: 200
    input: [action, "note?"]
    output: Rebuilder
    side_effects:
      - "moves license_status per state_machines.Rebuilder"
      - "sets suspended_by_user_id on SUSPEND and clears it on REINSTATE"
      - "last_license_action_by_user_id = acting X-User-ID; increments Rebuilder.version by 1"

  - method: POST
    path: "/v1/inspectors"
    description: "commission an inspector"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, badge_number, credential_expires_at, certifications, home_state_code]
    output: Inspector
    side_effects: ["credential_status derived from credential_expires_at against the logical clock"]

  - method: POST
    path: "/v1/inspection-stations"
    description: "open an inspection station with a fixed number of bays"
    roles: [ProgramAdmin]
    code: 201
    input: [station_code, bay_count, address_state_code, "supports_flood?"]
    output: InspectionStation
    side_effects: ["scheduled_occupancy_count = 0"]

  - method: POST
    path: "/v1/damage-reports"
    description: >-
      file an insurer total-loss evaluation; runs calculations.damage_threshold_evaluation to
      publish damage_ratio and recommended_brand_code (the salvage-title issuance trigger)
    roles: [InsurerAdjuster]
    code: 201
    input: [vehicle_id, insurer_name, claim_number, basis_code, acv_cents, repair_estimate_cents, damage_type, odometer_reading_miles, report_effective_at, total_loss_declared, "salvage_retention_cents?", "flood_water_depth_cm?"]
    output: InsurerDamageReport
    side_effects:
      - "computes damage_ratio and recommended_brand_code"
      - "recomputes Vehicle.last_odometer_miles"

  - method: POST
    path: "/v1/title-records"
    description: >-
      issue a title; when source_damage_report_id is supplied the brand is taken from that
      report's recommended_brand_code, which is how SALVAGE, FLOOD and NON_REPAIRABLE brands enter
      the system
    roles: [StateTitleClerk]
    code: 201
    input: [vehicle_id, issuing_state_code, owner_name, "source_damage_report_id?", "predecessor_title_id?"]
    output: TitleRecord
    side_effects:
      - "brand_code = report.recommended_brand_code when a report is supplied, else NONE"
      - "issued_at = logical clock; is_current = true; transfer_sequence = chain length"
      - "any predecessor title: ACTIVE -> SUPERSEDED with is_current -> false"
      - "recomputes Vehicle.active_brand_code and Vehicle.brand_history"

  - method: POST
    path: "/v1/title-records/{id}/surrender"
    description: "surrender a NON_REPAIRABLE title so the vehicle can never be retitled"
    roles: [StateTitleClerk]
    code: 200
    input: ["surrender_note?"]
    output: TitleRecord
    side_effects:
      - "status ACTIVE -> SURRENDERED, is_current -> false"
      - "Vehicle.active_brand_code -> NONE while brand_history keeps NON_REPAIRABLE"
      - "increments TitleRecord.version by 1"

  - method: POST
    path: "/v1/applications"
    description: "open a rebuilt-inspection application in DRAFT against a salvage-branded title"
    roles: [Rebuilder]
    code: 201
    input: [vehicle_id, rebuilder_id, salvage_title_id, declared_repair_cost_cents, "expedite_requested?"]
    output: RebuiltApplication
    side_effects:
      - "status = DRAFT, attempt_limit = 3, assessed_fee_cents = 7500, fee_escrowed_cents = 0"
      - "recomputes Vehicle.open_application_count"

  - method: POST
    path: "/v1/applications/{id}/parts-documents"
    description: "file a receipt, invoice, donor certificate or photograph against a DRAFT application"
    roles: [Rebuilder]
    code: 201
    input: [doc_type, part_class, source_type, "amount_cents?", "vendor_name?", "part_serial_number?", "donor_vin?", "donor_title_id?", "photo_view_code?"]
    output: PartsDocument
    side_effects:
      - "status = SUBMITTED; traceable computed from source_type and donor_title_id"
      - "recomputes application.photo_view_count and application.documentation_completeness_pct"

  - method: POST
    path: "/v1/parts-documents/{id}/verify"
    description: "inspector accepts a parts document, admitting its amount into the documented parts cost"
    roles: [Inspector]
    code: 200
    input: ["verification_note?"]
    output: PartsDocument
    side_effects:
      - "status SUBMITTED -> VERIFIED; verified_by_inspector_id = acting inspector"
      - "application.documented_parts_cost_cents += amount_cents"
      - "recomputes application.documentation_completeness_pct and assessed_fee_cents"

  - method: POST
    path: "/v1/parts-documents/{id}/reject"
    description: >-
      inspector rejects a parts document; when the document was VERIFIED this is the compensating
      action that must leave documented_parts_cost_cents equal to the sum over VERIFIED documents
    roles: [Inspector]
    code: 200
    input: [rejection_reason, "rejection_note?"]
    output: PartsDocument
    side_effects:
      - "status -> REJECTED with rejection_reason recorded"
      - "when the prior status was VERIFIED: application.documented_parts_cost_cents -= amount_cents"
      - "recomputes application.documentation_completeness_pct and assessed_fee_cents"

  - method: POST
    path: "/v1/applications/{id}/submit"
    description: >-
      submit the application for rebuilt inspection; assesses the fee, escrows the program charge
      and enforces the documentation, photograph, window and license gates
    roles: [Rebuilder]
    code: 200
    input: [attestation_signed]
    output: RebuiltApplication
    side_effects:
      - "runs calculations.inspection_fee_assessment then calculations.total_program_charge"
      - "fee_escrowed_cents = total_program_charge_cents"
      - "Rebuilder.fee_balance_cents -= charge; Rebuilder.escrowed_fee_total_cents += charge"
      - "status DRAFT -> SUBMITTED"

  - method: POST
    path: "/v1/applications/{id}/docs-review"
    description: "clerk opens (OPEN), accepts (ACCEPT) or returns for correction (RETURN) the documentation package"
    roles: [StateTitleClerk]
    code: 200
    input: [decision, "review_note?"]
    output: RebuiltApplication
    side_effects:
      - "OPEN: SUBMITTED -> DOCS_UNDER_REVIEW"
      - "ACCEPT: DOCS_UNDER_REVIEW -> DOCS_ACCEPTED"
      - "RETURN: DOCS_UNDER_REVIEW -> DRAFT with the escrow retained"

  - method: POST
    path: "/v1/applications/{id}/inspections"
    description: >-
      schedule (or re-schedule) a physical inspection attempt; guarded by OCC on the
      application's version, by the inspector half-open interval rule and by station bay capacity
    roles: [StateTitleClerk]
    code: 201
    input: [inspector_id, station_id, scheduled_start_at, scheduled_end_at, expected_application_version]
    output: Inspection
    side_effects:
      - "creates Inspection(status = SCHEDULED) and computes effective_end_at"
      - "a still-SCHEDULED prior attempt: SCHEDULED -> CANCELLED with cancellation_reason = RESCHEDULED"
      - "application status -> SCHEDULED; increments RebuiltApplication.version by 1"
      - "re-inspection from FAILED adds REINSPECTION_FEE_CENTS to total_program_charge_cents and raises the escrow"
      - "increments Inspector.scheduled_inspection_count and InspectionStation.scheduled_occupancy_count"

  - method: POST
    path: "/v1/inspections/{id}/start"
    description: "assigned inspector begins the attempt"
    roles: [Inspector]
    code: 200
    input: ["start_note?"]
    output: Inspection
    side_effects:
      - "Inspection SCHEDULED -> IN_PROGRESS with started_at = logical clock"
      - "application SCHEDULED -> IN_INSPECTION"

  - method: POST
    path: "/v1/inspections/{id}/findings"
    description: >-
      record a defect observed during the attempt; a blocking finding latches forced_fail and, for
      STOLEN_COMPONENT, cascades into the cited parts document, a fraud referral and the
      rebuilder's licence posture
    roles: [Inspector]
    code: 201
    input: [category, severity, description, "parts_document_id?"]
    output: InspectionFinding
    side_effects:
      - "blocking computed; Inspection.blocking_findings_count += 1 when blocking"
      - "Inspection.forced_fail latches true once blocking_findings_count >= 1"
      - "for category = STOLEN_COMPONENT with a cited document: that PartsDocument -> REJECTED (rejection_reason = STOLEN_COMPONENT) and application.documented_parts_cost_cents -= amount_cents"
      - "because that document was rejected, a FraudReferral(referral_type = IDENTITY_TAMPERING, origin = AUTO_CASCADE, status = OPEN) is created and Vehicle.fraud_hold -> UNDER_REFERRAL"
      - "because the referral exists, Rebuilder.open_referral_count += 1 and the license moves ACTIVE -> PROBATION once it reaches 2"

  - method: POST
    path: "/v1/inspections/{id}/complete"
    description: >-
      close the attempt; runs calculations.structural_adequacy_score, applies the auto-fail
      overrides and the VIN verification rule, then drives the application to PASSED or FAILED
    roles: [Inspector]
    code: 200
    input: [checkpoint_results, vin_plate_reading]
    output: Inspection
    side_effects:
      - "adequacy_score computed; result and status set to PASS/COMPLETED_PASS or FAIL/COMPLETED_FAIL"
      - "application -> PASSED or FAILED; attempts_completed and last_inspection_result recomputed"
      - "releases the inspector interval and the station bay"

  - method: POST
    path: "/v1/inspections/{id}/cancel"
    description: "clerk cancels a scheduled attempt, releasing the inspector interval and the station bay"
    roles: [StateTitleClerk]
    code: 200
    input: ["cancellation_note?"]
    output: Inspection
    side_effects:
      - "status SCHEDULED -> CANCELLED with cancellation_reason = CLERK_REQUEST"
      - "application falls back to DOCS_ACCEPTED when attempts_completed == 0, else to FAILED"
      - "decrements Inspector.scheduled_inspection_count and InspectionStation.scheduled_occupancy_count"

  - method: POST
    path: "/v1/applications/{id}/withdraw"
    description: "rebuilder withdraws the application; the escrow is refunded in full"
    roles: [Rebuilder]
    code: 200
    input: [withdrawn_reason]
    output: RebuiltApplication
    side_effects:
      - "Rebuilder.fee_balance_cents += fee_escrowed_cents, then fee_escrowed_cents = 0"
      - "Rebuilder.escrowed_fee_total_cents drops by the refunded amount"
      - "any SCHEDULED Inspection -> CANCELLED (cancellation_reason = APPLICATION_VOIDED)"
      - "status -> WITHDRAWN, terminal_at = clock"

  - method: POST
    path: "/v1/applications/{id}/issue-rebuilt-title"
    description: "mint the REBUILT-branded title for a passed application and supersede the salvage title"
    roles: [StateTitleClerk]
    code: 201
    input: [issuing_state_code, owner_name]
    output: TitleRecord
    side_effects:
      - "mints TitleRecord(brand_code = REBUILT, predecessor_title_id = salvage_title_id)"
      - "salvage title ACTIVE -> SUPERSEDED; Vehicle.active_brand_code -> REBUILT"
      - "escrow captured: Rebuilder.fees_consumed_cents += fee_escrowed_cents then fee_escrowed_cents = 0"
      - "Rebuilder.applications_titled_count += 1; application -> TITLE_ISSUED"

  - method: POST
    path: "/v1/appeals"
    description: "rebuilder appeals a failed inspection within the 30-day window"
    roles: [Rebuilder]
    code: 201
    input: [inspection_id, grounds, narrative]
    output: Appeal
    side_effects:
      - "status = FILED, filed_at = clock"
      - "application -> APPEAL_PENDING, blocking re-inspection scheduling"

  - method: POST
    path: "/v1/appeals/{id}/review"
    description: "hearing officer takes up a FILED or REMANDED appeal"
    roles: [HearingOfficer]
    code: 200
    input: ["review_note?"]
    output: Appeal
    side_effects: ["status -> UNDER_REVIEW; hearing_officer_user_id = acting X-User-ID"]

  - method: POST
    path: "/v1/appeals/{id}/decide"
    description: "hearing officer grants, denies or remands the appeal"
    roles: [HearingOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: Appeal
    side_effects:
      - "GRANT: findings resolved, application.attempt_limit += 1, application -> DOCS_ACCEPTED"
      - "DENY: application -> FAILED, or -> DENIED_FINAL with escrow capture when no attempts remain"
      - "REMAND: remand_count += 1, appeal -> REMANDED, application stays APPEAL_PENDING"

  - method: POST
    path: "/v1/title-transfers"
    description: >-
      record a conveyance; carries the brand forward onto a freshly minted successor title and
      replays the odometer history to flag rollbacks
    roles: [StateTitleClerk]
    code: 201
    input: [from_title_id, buyer_name, transfer_effective_at, odometer_reading_miles, sale_price_cents]
    output: TitleTransfer
    side_effects:
      - "runs calculations.brand_carry_forward -> carried_brand_code and the successor title's brand_code/brand_history"
      - "mints the successor TitleRecord (predecessor_title_id = from_title_id) and sets to_title_id"
      - "from_title ACTIVE -> SUPERSEDED; a PENDING recognition request on it -> SUPERSEDED and recognition_state -> STALE"
      - "runs calculations.odometer_continuity_replay -> odometer_flag"
      - "when odometer_flag == ROLLBACK_SUSPECTED: a FraudReferral(referral_type = ODOMETER, origin = AUTO_CASCADE) is created, which drives Vehicle.fraud_hold -> UNDER_REFERRAL, which in turn cancels every SCHEDULED Inspection of the vehicle's non-terminal applications"

  - method: POST
    path: "/v1/fraud-referrals"
    description: "file an odometer, identity-tampering or document-forgery referral"
    roles: [Inspector, StateTitleClerk]
    code: 201
    input: [vehicle_id, referral_type, evidence_summary, "application_id?", "inspection_id?"]
    output: FraudReferral
    side_effects:
      - "status = OPEN, origin = MANUAL, opened_by_user_id = acting X-User-ID"
      - "Vehicle.fraud_hold NONE -> UNDER_REFERRAL"
      - "Rebuilder.open_referral_count += 1 when application_id is supplied"

  - method: POST
    path: "/v1/fraud-referrals/{id}/investigate"
    description: "investigator takes the referral up"
    roles: [FraudInvestigator]
    code: 200
    input: ["investigation_note?"]
    output: FraudReferral
    side_effects: ["status OPEN -> INVESTIGATING; investigator_user_id = acting X-User-ID"]

  - method: POST
    path: "/v1/fraud-referrals/{id}/resolve"
    description: >-
      substantiate or clear the referral; substantiation voids the vehicle's title chain, voids
      every non-terminal application with escrow refunded, cancels their inspections and moves the
      rebuilder's license
    roles: [FraudInvestigator]
    code: 200
    input: [outcome, "resolution_note?"]
    output: FraudReferral
    side_effects:
      - "SUBSTANTIATED: Vehicle.fraud_hold -> CONFIRMED; the ACTIVE TitleRecord -> VOID; non-terminal applications -> VOID_FRAUD with escrow refunded to fee_balance_cents; their SCHEDULED/IN_PROGRESS inspections -> CANCELLED; Rebuilder.substantiated_referral_count += 1 and license -> SUSPENDED"
      - "UNSUBSTANTIATED: Vehicle.fraud_hold -> NONE when no other referral holds it; Rebuilder.open_referral_count -= 1"

  - method: POST
    path: "/v1/recognition-requests"
    description: >-
      submit a branded title to another state for recognition; guarded by OCC on the title's
      version because a later request supersedes an earlier PENDING one
    roles: [StateTitleClerk]
    code: 201
    input: [title_record_id, requesting_state_code, expected_title_version]
    output: InterstateRecognitionRequest
    side_effects:
      - "submitted_brand_code snapshots TitleRecord.brand_code"
      - "any PENDING request for the same title -> SUPERSEDED"
      - "TitleRecord.recognition_state -> RECOGNITION_PENDING; increments TitleRecord.version by 1"

  - method: POST
    path: "/v1/recognition-requests/{id}/decide"
    description: "record the requesting state's mapping decision; brands may be carried or downgraded, never escalated"
    roles: [ProgramAdmin]
    code: 200
    input: [mapped_brand_code, "decision_note?"]
    output: InterstateRecognitionRequest
    side_effects:
      - "outcome = RECOGNIZED | DOWNGRADED | REJECTED per the severity comparison"
      - "TitleRecord.recognition_state -> RECOGNIZED or DOWNGRADED; decided_at = clock"

  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: >-
      test-driving endpoint that moves the server's logical clock, which stamps every created_at,
      updated_at, issued_at, started_at, completed_at and drives every window/expiry comparison.
      Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to
      real wall-clock time.
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["recomputes every clock-derived field (Inspector.credential_status, window gates, rolling score window)"]

# =============================================================================
# 1.6 ERROR CODE CATALOG
# =============================================================================

errors:
  # ---- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or not a declared role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed actor targets a resource whose owning FK is not the acting X-User-ID (Rebuilder on another rebuilder's application, Inspector on an inspection assigned to someone else)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the incompatible earlier step: the ProgramAdmin who suspended a rebuilder cannot reinstate it, the inspector who recorded a blocking finding cannot verify the parts document it cites, and the hearing officer who reviewed an appeal cannot open the fraud referral raised from it"

  # ---- existence -----------------------------------------------------------
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "vehicle path segment or vehicle_id body field does not resolve"
  - id: ERR_REBUILDER_NOT_FOUND
    http: 404
    condition: "rebuilder path segment or rebuilder_id body field does not resolve"
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "inspector path segment or inspector_id body field does not resolve"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "station path segment or station_id body field does not resolve"
  - id: ERR_DAMAGE_REPORT_NOT_FOUND
    http: 404
    condition: "damage report path segment or source_damage_report_id body field does not resolve"
  - id: ERR_TITLE_NOT_FOUND
    http: 404
    condition: "title path segment or a title FK body field (salvage_title_id, predecessor_title_id, donor_title_id, from_title_id, title_record_id) does not resolve"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application path segment or application_id body field does not resolve"
  - id: ERR_PARTS_DOCUMENT_NOT_FOUND
    http: 404
    condition: "parts document path segment or parts_document_id body field does not resolve"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection path segment or inspection_id body field does not resolve"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "inspection finding path segment does not resolve"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "appeal path segment does not resolve"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "fraud referral path segment does not resolve"
  - id: ERR_RECOGNITION_REQUEST_NOT_FOUND
    http: 404
    condition: "recognition request path segment does not resolve"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "title transfer path segment does not resolve"

  # ---- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, negative money or mileage, non-ISO-8601 timestamp, scheduled_end_at at or before scheduled_start_at, checkpoint_results missing a weighted checkpoint, or attestation_signed not true"
  - id: ERR_DUPLICATE_NATURAL_KEY
    http: 409
    condition: "vehicle vin, rebuilder license_number, inspector badge_number, station station_code, or the (insurer_name, claim_number) pair of a damage report already exists"

  # ---- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not equal the stored RebuiltApplication.version when scheduling an inspection"
  - id: ERR_STALE_TITLE_VERSION
    http: 412
    condition: "expected_title_version does not equal the stored TitleRecord.version when submitting a recognition request"

  # ---- state ---------------------------------------------------------------
  - id: ERR_APPLICATION_NOT_DRAFT
    http: 409
    condition: "documents are filed on, or a submit is attempted for, an application whose status is not DRAFT"
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "the application's status does not permit the requested transition (docs-review on a non-SUBMITTED/non-DOCS_UNDER_REVIEW application, scheduling from DRAFT or a terminal status, issue-rebuilt-title from anything but PASSED, withdraw from a terminal status)"
  - id: ERR_INSPECTION_NOT_SCHEDULED
    http: 409
    condition: "start or cancel is attempted on an inspection whose status is not SCHEDULED"
  - id: ERR_INSPECTION_NOT_IN_PROGRESS
    http: 409
    condition: "a finding is recorded on, or complete is called for, an inspection whose status is not IN_PROGRESS"
  - id: ERR_PARTS_DOCUMENT_STATE_INVALID
    http: 409
    condition: "verify targets a document that is not SUBMITTED, or reject targets an already REJECTED document"
  - id: ERR_TITLE_NOT_ACTIVE
    http: 409
    condition: "a transfer, surrender, recognition request or successor issuance targets a title whose status is not ACTIVE"
  - id: ERR_APPEAL_STATE_INVALID
    http: 409
    condition: "review targets an appeal that is not FILED or REMANDED, decide targets an appeal that is not UNDER_REVIEW, or a REMAND is attempted after remand_count already reached MAX_APPEAL_REMANDS"
  - id: ERR_REFERRAL_STATE_INVALID
    http: 409
    condition: "investigate targets a referral that is not OPEN, or resolve targets a referral that is not INVESTIGATING"
  - id: ERR_LICENSE_ACTION_INVALID
    http: 409
    condition: "the requested license action is not a declared transition out of the rebuilder's current license_status (REINSTATE on an ACTIVE licence, any action on a REVOKED licence)"
  - id: ERR_RECOGNITION_ALREADY_DECIDED
    http: 409
    condition: "decide targets a recognition request whose status is DECIDED or SUPERSEDED"

  # ---- business safety -----------------------------------------------------
  - id: ERR_VEHICLE_FRAUD_HOLD
    http: 409
    condition: "the vehicle's fraud_hold is UNDER_REFERRAL or CONFIRMED and the request would advance titling, scheduling or transfer for that vehicle"
  - id: ERR_NON_REPAIRABLE_BRAND
    http: 409
    condition: "an application or a rebuilt title is attempted for a vehicle whose brand_history contains NON_REPAIRABLE"
  - id: ERR_STOLEN_COMPONENT_UNRESOLVED
    http: 409
    condition: "an inspection is completed as PASS, or a rebuilt title is issued, while an unresolved STOLEN_COMPONENT or VIN_ALTERATION finding stands against the application"

  # ---- business referential ------------------------------------------------
  - id: ERR_REBUILDER_LICENSE_INACTIVE
    http: 403
    condition: "the acting rebuilder's license_status is SUSPENDED or REVOKED, or is PROBATION for an action that requires an ACTIVE licence"
  - id: ERR_INSPECTOR_CREDENTIAL_EXPIRED
    http: 409
    condition: "the inspector's credential_expires_at is at or before the logical clock at scheduling, start or completion time"
  - id: ERR_SALVAGE_TITLE_REQUIRED
    http: 409
    condition: "the referenced salvage_title_id is not a SALVAGE- or FLOOD-branded ACTIVE title for the same vehicle"
  - id: ERR_DONOR_TITLE_NOT_TRACEABLE
    http: 422
    condition: "a USED_DONOR or RECYCLER parts document is verified without a donor_title_id, or its donor title is VOID or NON_REPAIRABLE"
  - id: ERR_STATION_NOT_FLOOD_CAPABLE
    http: 409
    condition: "a FLOOD-branded vehicle is scheduled at a station whose supports_flood is false"

  # ---- business constraint -------------------------------------------------
  - id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http: 409
    condition: "the vehicle already has a non-terminal RebuiltApplication"
  - id: ERR_DOCUMENTATION_INCOMPLETE
    http: 422
    condition: "documentation_completeness_pct is below 100.00 for the vehicle's required part classes at submit time"
  - id: ERR_PHOTO_SET_INCOMPLETE
    http: 422
    condition: "fewer than REQUIRED_PHOTO_VIEWS distinct photo_view_code values are on file at submit time"
  - id: ERR_ATTEMPT_LIMIT_EXCEEDED
    http: 409
    condition: "a further inspection is scheduled once attempts_completed has reached attempt_limit"
  - id: ERR_APPEAL_PENDING_BLOCKS_SCHEDULING
    http: 409
    condition: "a re-inspection is scheduled while an appeal for the application is FILED, UNDER_REVIEW or REMANDED"
  - id: ERR_STATION_CAPACITY_EXCEEDED
    http: 409
    condition: "the count of scheduled inspections at the station whose closed [start, end] intervals touch the requested closed interval already equals bay_count"
  - id: ERR_VIN_MISMATCH
    http: 422
    condition: "vin_plate_reading at completion differs from the vehicle's recorded vin, or a donor_vin equals the subject vehicle's vin"
  - id: ERR_BRAND_ESCALATION_FORBIDDEN
    http: 422
    condition: "a recognition decision maps a brand to a strictly higher severity than the submitted brand, or a transfer would carry a brand less severe than the chain maximum"

  # ---- business temporal ---------------------------------------------------
  - id: ERR_INSPECTOR_INTERVAL_CONFLICT
    http: 409
    condition: "the requested half-open [start, end) interval, widened by the FLOOD decontamination buffer, overlaps another SCHEDULED or IN_PROGRESS inspection for the same inspector"
  - id: ERR_SUBMISSION_WINDOW_EXPIRED
    http: 422
    condition: "submit is attempted more than SUBMISSION_WINDOW_DAYS after the salvage title's issued_at"
  - id: ERR_INSPECTION_SLOT_IN_PAST
    http: 422
    condition: "scheduled_start_at is at or before the logical clock"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "an appeal is filed more than APPEAL_WINDOW_DAYS after the failed inspection's completed_at"
  - id: ERR_TRANSFER_PREDATES_TITLE
    http: 422
    condition: "transfer_effective_at is before the from_title's issued_at or before the latest recorded transfer on the chain"

  # ---- business fiscal -----------------------------------------------------
  - id: ERR_INSUFFICIENT_FEE_BALANCE
    http: 402
    condition: "the rebuilder's fee_balance_cents is below the program charge being escrowed at submit or re-inspection time"
  - id: ERR_RECORDKEEPING_SCORE_BLOCKS_ACTION
    http: 422
    condition: "REINSTATE is requested while the rolling 12-month record-keeping score is below REINSTATE_SCORE_THRESHOLD, or REVOKE is requested while the lifetime score is above REVOKE_SCORE_CEILING"

# =============================================================================
# 1.7 RBAC MATRIX
# =============================================================================

roles:
  - name: ProgramAdmin
    description: "state program administrator: licenses rebuilders and inspectors, opens stations, credits fee deposits, takes licence actions, decides interstate recognition, and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/rebuilders"
      - "POST /v1/rebuilders/{id}/deposits"
      - "POST /v1/rebuilders/{id}/license-actions"
      - "POST /v1/inspectors"
      - "POST /v1/inspection-stations"
      - "POST /v1/recognition-requests/{id}/decide"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "GET on every collection and single resource"

  - name: StateTitleClerk
    description: "title office clerk: registers vehicles, issues and surrenders titles, reviews documentation packages, schedules and cancels inspection attempts, records transfers, submits recognition requests, and may file fraud referrals"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/vehicles"
      - "POST /v1/title-records"
      - "POST /v1/title-records/{id}/surrender"
      - "POST /v1/applications/{id}/docs-review"
      - "POST /v1/applications/{id}/inspections"
      - "POST /v1/inspections/{id}/cancel"
      - "POST /v1/applications/{id}/issue-rebuilt-title"
      - "POST /v1/title-transfers"
      - "POST /v1/recognition-requests"
    shared_operations:
      - "POST /v1/fraud-referrals"
      - "GET on every collection and single resource"

  - name: InsurerAdjuster
    description: "insurer adjuster: files the total-loss damage evaluation whose damage ratio triggers the salvage brand"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/damage-reports"
    shared_operations:
      - "GET on every collection and single resource"

  - name: Rebuilder
    description: "licensed rebuilder: opens applications, files parts documentation and photographs, submits for inspection, withdraws, and appeals failures; acts only on its own applications"
    identity: "entity_backed:Rebuilder"
    exclusive_operations:
      - "POST /v1/applications"
      - "POST /v1/applications/{id}/parts-documents"
      - "POST /v1/applications/{id}/submit"
      - "POST /v1/applications/{id}/withdraw"
      - "POST /v1/appeals"
    shared_operations:
      - "GET on every collection and single resource"

  - name: Inspector
    description: "commissioned inspector: verifies or rejects parts documents, starts and completes attempts, records findings, and may file fraud referrals"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /v1/parts-documents/{id}/verify"
      - "POST /v1/parts-documents/{id}/reject"
      - "POST /v1/inspections/{id}/start"
      - "POST /v1/inspections/{id}/findings"
      - "POST /v1/inspections/{id}/complete"
    shared_operations:
      - "POST /v1/fraud-referrals"
      - "GET on every collection and single resource"

  - name: HearingOfficer
    description: "administrative hearing officer: reviews and decides appeals of failed inspections; cannot inspect, title or investigate"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/appeals/{id}/review"
      - "POST /v1/appeals/{id}/decide"
    shared_operations:
      - "GET on every collection and single resource"

  - name: FraudInvestigator
    description: "fraud unit investigator: takes up and resolves odometer, identity-tampering and forgery referrals; substantiation voids titles and applications"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/fraud-referrals/{id}/investigate"
      - "POST /v1/fraud-referrals/{id}/resolve"
    shared_operations:
      - "GET on every collection and single resource"
