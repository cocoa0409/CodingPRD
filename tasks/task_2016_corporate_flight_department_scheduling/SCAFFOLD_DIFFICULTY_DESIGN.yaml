  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: aircraft_buffered_half_open_interval
        grounds:
          - calculations.aircraft_interval_overlap
          - validations[priority=9]
        distinguishing_aspect: |
          Aircraft interval semantics: 90-minute TURN_BUFFER applied to both
          ends, half-open. Leg2 departing exactly 90 min after Leg1 arrives is
          PERMITTED (buffered start == prior buffered end, half-open excludes
          equality). Leg2 departing 89 min after Leg1 arrives is REJECTED.
        test_recipe:
          setup:
            - "One LIGHT_JET aircraft"
            - "Trip1 leg1: 10:00–12:00, AIRCRAFT_ASSIGNED"
            - "Trip2 leg2: 13:30–14:30 (exactly 90 min after 12:00) — permitted"
            - "Trip3 leg3: 13:29–14:30 (89 min after) — rejected"
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-O1", name: "O1", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
