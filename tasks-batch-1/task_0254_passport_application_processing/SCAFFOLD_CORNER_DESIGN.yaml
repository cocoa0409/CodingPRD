            - "FeeAssessment.execution_fee_cents == 3500"
            - "FeeAssessment.total_due_cents == 6500"

      - name: photo_validation_multiple_failure_reasons
        claim_type: Correct Result
        grounds:
          - calculations.photo_validation
          - entities.Photo.fields.failure_reasons
          - entities.Photo.fields.validation_result
        distinguishing_aspect: "A photo 500x500 (below 600), ratio 1.0, head fraction 0.40 (below 0.50), background not white fails three rules: failure_reasons contains DIMENSION_TOO_SMALL, HEAD_OUT_OF_RANGE, BACKGROUND_NOT_WHITE and validation_result==FAIL."
        test_recipe:
          setup:
            - "A DRAFT application exists."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "MultiFail", date_of_birth: "1990-01-01", email: "multifail@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 500, height_px: 500, head_height_fraction: 0.40, background_is_white: false }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { res: "$.data.validation_result", reasons: "$.data.failure_reasons" }
          assert:
            - "Photo.validation_result == \"FAIL\""
            - "Photo.failure_reasons contains \"DIMENSION_TOO_SMALL\""
            - "Photo.failure_reasons contains \"HEAD_OUT_OF_RANGE\""
            - "Photo.failure_reasons contains \"BACKGROUND_NOT_WHITE\""
            - "Photo.failure_reasons does NOT contain \"NOT_SQUARE\" (500/500 ratio 1.0 within 0.98..1.02)"

      - name: photo_validation_not_square_ratio_boundary_fail
        claim_type: Precision
        grounds:
          - calculations.photo_validation
          - entities.Photo.fields.failure_reasons
        distinguishing_aspect: "Ratio boundary: 600x630 gives ratio 0.952 which is below RATIO_MIN 0.98, so failure_reasons contains NOT_SQUARE and validation_result==FAIL — exercises the square-ratio rule the §1.8 head-fraction boundary instance does not."
        test_recipe:
          setup:
            - "A DRAFT application exists."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Square", date_of_birth: "1990-01-01", email: "square@x.com" }
