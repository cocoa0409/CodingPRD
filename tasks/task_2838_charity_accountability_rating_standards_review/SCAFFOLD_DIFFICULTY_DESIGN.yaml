  - rule_id: resource_temporal_overlap
    instances:
      - name: rating_cycle_period_half_open_adjacency_allowed
        grounds:
          - validations[priority=18]
          - errors.ERR_CYCLE_PERIOD_OVERLAP
          - entities.RatingCycle.fields.period_start
          - entities.RatingCycle.fields.period_end
          - state_machines.RatingCycle.SCORED_to_WITHDRAWN
        distinguishing_aspect: |
          The contended resource is an ORGANIZATION's rating timeline and the
          interval semantics are HALF-OPEN [period_start, period_end): touching
          endpoints do not collide, so a FY2024 cycle ending exactly when the
          FY2025 cycle starts is admissible with no buffer. A six-month shift of
          the same duration does collide, and withdrawing a cycle releases its
          interval for reuse - occupancy is a function of state, not of existence.
        test_recipe:
          setup:
            - "Methodology M1 adopted and effective, logical clock at 2026-09-01T00:00:00Z"
            - "One organization with a single FY2025 cycle occupying [2025-01-01T00:00:00Z, 2026-01-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/close-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/adopt"
              payload: { effective_from: "2026-08-31T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /rating-cycles"
              payload: { organization_id: "${org1}", methodology_version_id: "${m1}", fiscal_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", assigned_analyst_user_id: "analyst-1" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /rating-cycles"
              payload: { organization_id: "${org1}", methodology_version_id: "${m1}", fiscal_year: 2024, period_start: "2024-01-01T00:00:00Z", period_end: "2025-01-01T00:00:00Z", assigned_analyst_user_id: "analyst-1" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { c_adjacent: $.data.id }
            - call: "POST /rating-cycles"
              payload: { organization_id: "${org1}", methodology_version_id: "${m1}", fiscal_year: 2023, period_start: "2024-06-01T00:00:00Z", period_end: "2025-06-01T00:00:00Z", assigned_analyst_user_id: "analyst-1" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /rating-cycles/${c_adjacent}/withdraw"
              payload: { withdrawal_reason: "duplicate engagement, timeline released" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /rating-cycles"
              payload: { organization_id: "${org1}", methodology_version_id: "${m1}", fiscal_year: 2024, period_start: "2024-01-01T00:00:00Z", period_end: "2025-01-01T00:00:00Z", assigned_analyst_user_id: "analyst-1" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { c_reused: $.data.id }
          assert:
            - "The adjacent FY2024 cycle was created with HTTP 201 even though its period_end equals the FY2025 cycle's period_start exactly"
            - "${err_overlap} == ERR_CYCLE_PERIOD_OVERLAP with HTTP 409"
            - "Only two RatingCycle rows existed for ${org1} after the refused attempt"
            - "RatingCycle.${c_adjacent}.status == WITHDRAWN after the withdraw call"
            - "${c_reused} is a new cycle occupying exactly the interval the WITHDRAWN cycle used to hold, created with HTTP 201"
            - "${c_reused} != ${c_adjacent}"
            - "GET /rating-cycles?organization_id=${org1} returns three rows, one of them WITHDRAWN"

      - name: methodology_effectivity_closed_interval_with_thirty_day_buffer
        grounds:
          - validations[priority=17]
          - validations[priority=15]
          - errors.ERR_METHODOLOGY_WINDOW_CONFLICT
          - errors.ERR_METHODOLOGY_NOT_EFFECTIVE
          - calculations.workflow_deadline_windows
          - state_machines.MethodologyVersion.COMMENT_CLOSED_to_ADOPTED
        distinguishing_aspect: |
          A different contended resource - the METHODOLOGY REGISTRY rather than an
          organization's timeline - and the opposite interval polarity: the
          effectivity window is CLOSED [effective_from, effective_until], so the
          upper endpoint is still inside the window. It also carries a forward
          BUFFER the cycle-period rule has none of: effective_from must be at
          least 30 days after the logical clock, inclusive at exactly 30 days.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default"
            - "A draft methodology M1 whose comment period has been opened and closed with no comments filed"
            - "One organization registered, with no rating cycle yet"
          setup_api_calls:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/close-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
          trigger:
            - call: "POST /methodology-versions/${m1}/adopt"
              payload: { effective_from: "2026-08-30T23:59:59Z", effective_until: "2026-12-31T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { err_buffer: $.data.error_id }
            - call: "POST /methodology-versions/${m1}/adopt"
              payload: { effective_from: "2026-08-31T00:00:00Z", effective_until: "2026-12-31T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1_status: $.data.status, m1_from: $.data.effective_from }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /rating-cycles"
              payload: { organization_id: "${org1}", methodology_version_id: "${m1}", fiscal_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", assigned_analyst_user_id: "analyst-1" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { c_at_upper_bound: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:01Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /rating-cycles"
              payload: { organization_id: "${org1}", methodology_version_id: "${m1}", fiscal_year: 2024, period_start: "2024-01-01T00:00:00Z", period_end: "2025-01-01T00:00:00Z", assigned_analyst_user_id: "analyst-1" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { err_not_effective: $.data.error_id }
          assert:
            - "${err_buffer} == ERR_METHODOLOGY_WINDOW_CONFLICT with HTTP 409, one second short of the 30-day buffer"
            - "After the refusal MethodologyVersion.${m1}.status was still COMMENT_CLOSED with effective_from == null and adopted_at == null"
            - "${m1_status} == ADOPTED"
            - "${m1_from} == 2026-08-31T00:00:00Z, exactly 30 days after the clock at adopt time"
            - "MethodologyVersion.${m1}.adopted_at == 2026-08-01T00:00:00Z, the clock at adoption, not effective_from"
            - "${c_at_upper_bound} was created with HTTP 201 at the clock instant 2026-12-31T00:00:00Z, which equals effective_until: the interval is closed at its upper end"
            - "${err_not_effective} == ERR_METHODOLOGY_NOT_EFFECTIVE with HTTP 409 one second later"
            - "GET /rating-cycles?organization_id=${org1} returns exactly one row"

  - rule_id: compensating_invariant
    instances:
      - name: standards_partition_conserved_across_waive_and_revoke
        grounds:
          - state_machines.StandardEvaluation.NOT_MET_to_WAIVED
          - state_machines.StandardEvaluation.WAIVED_to_NOT_MET
          - endpoints.POST_/standard-evaluations/{standard_evaluation_id}/revoke-waiver
          - calculations.dimension_raw_points
          - entities.GovernanceProfile.fields.standards_waived_count
        distinguishing_aspect: |
          The conserved quantity is a PARTITION CARDINALITY: standards_met_count +
          standards_not_met_count + standards_waived_count +
          standards_not_applicable_count always equals 8, before, between and
          after the waiver pair. A waiver moves one unit between two buckets and
          is worth 2 points where a met standard is worth 3, so the accountability
          raw points move 21 -> 23 -> 21 while the partition never changes size.
