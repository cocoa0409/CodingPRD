              as: PreservationOfficer
              as_user_id: "preserv-b"
          assert:
            - "MigrationJob.${jobB_id}.status == CANCELLED"
            - "MigrationJob.${jobB_id}.committed_cost_cents == 175266"
            - "MigrationJob.${jobA_id}.status == APPROVED"
            - "PreservationPlan.${plan_id}.budget_committed_cents == 46000"
            - "PreservationPlan.${plan_id}.budget_spent_cents == 0"
            - "PreservationPlan.${plan_id}.budget_cents == 300000"
            - "PreservationPlan.${plan_id}.status == ACTIVE"

      - name: unit_custody_triple_restored_exactly_by_exhibit_loan_return
        grounds:
          - calculations.unit_custody_conservation
          - state_machines.ExhibitLoan.OUT_to_RETURNED
          - state_machines.ArchivalItem.ON_LOAN_to_ACCESSIONED
          - entities.ArchivalItem.fields.units_on_shelf
          - entities.ArchivalItem.fields.units_on_loan
        distinguishing_aspect: |
          Conserved quantity #2: PHYSICAL UNITS on a single ArchivalItem. Check-out moves
          2 of 5 units shelf -> loan (3 / 2 / 0) and the return moves exactly the same 2
          back (5 / 0 / 0), so unit_count == on_shelf + on_loan + deaccessioned holds at
          every step with DRIFT_TOLERANCE_UNITS 0. The compensation is partial in a
          second sense: condition_grade is deliberately NOT restored — it is overwritten
          with the returned grade FAIR — proving the reversal is scoped to the custody
          triple. The partner instance conserves a money ledger on a PreservationPlan.
        test_recipe:
          setup:
            - "One ACCESSIONED ArchivalItem with unit_count 5, units_on_shelf 5, units_on_loan 0, units_deaccessioned 0 and condition_grade GOOD."
            - "One ExhibitLoan for 2 units with window [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z), confirmed by officer-a."
            - "The logical clock is moved to 2026-08-15T00:00:00Z, inside the loan window, so check-out is permitted."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "INV-02", retention_years: 13, disposition_action: "REVIEW", legal_citation: "Exhibit Loan Policy 8.6", min_appraisal_score_for_permanent: 66.00 }
