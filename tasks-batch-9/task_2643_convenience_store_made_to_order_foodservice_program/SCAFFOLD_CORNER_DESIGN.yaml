              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err_id} == ERR_BATCH_STATE_INVALID"
            - "ProductionBatch.${batch_id}.status == PLANNED"
            - "ProductionBatch.${batch_id}.hold_started_at == null"
            - "ProductionBatch.${batch_id}.hold_expires_at == null"
            - "ProductionBatch.${batch_id}.baked_qty == 0"
            - "Store.${store_id}.hot_case_slots_used == 0"

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.ProductionBatch.initial_state
          - state_machines.HoldingUnit.initial_state
          - state_machines.StaffingPlan.initial_state
          - state_machines.Order.production_status.initial_state
          - state_machines.Order.settlement_status.initial_state
        distinguishing_aspect: |
          Five initial states in one chain, including the two-axis Order which must start DRAFT on the
          production axis AND UNPAID on the settlement axis in the SAME response. A HoldingUnit starts
          OPERATIONAL rather than in an "unverified" pseudo-state, and a StaffingPlan starts DRAFT rather
          than PUBLISHED, so no order can be placed on it yet.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T06:00:00Z; store WAWA-0101 in BREAKFAST"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id, st_v: $.data.version }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
          trigger:
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id, unit_status: $.data.status }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id, batch_status: $.data.status }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "BREAKFAST", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id, plan_status: $.data.status }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id, prod: $.data.production_status, sett: $.data.settlement_status }
          assert:
            - "${unit_status} == OPERATIONAL"
            - "${batch_status} == PLANNED"
            - "${plan_status} == DRAFT"
            - "${prod} == DRAFT"
            - "${sett} == UNPAID"
            - "ProductionBatch.${batch_id}.remaining_qty == 0"
            - "StaffingPlan.${plan_id}.version == 1"
            - "Order.${order_id}.daypart_at_placement == null"
            - "Order.${order_id}.total_cents == 0"
            - "Order.${order_id}.rework_count == 0"

      - name: a_discarded_batch_rejects_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ProductionBatch.terminal_states
          - errors[ERR_BATCH_STATE_INVALID]
          - endpoints[POST /production-batches/{id}/discard]
        distinguishing_aspect: |
          DISCARDED is terminal, so all three batch verbs must bounce off it with ERR_BATCH_STATE_INVALID:
          a second discard, a top-off bake and a pull. The ledger must also stay frozen at
          remaining 0 / discarded 40 with exactly ONE WasteLog row - a rejected call must not append waste.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T06:00:00Z; one pretzel batch of 40 baked, pulled and then fully written off with reason QUALITY_REJECT"
            - "the batch version is 3 after create/bake/pull, so the discard carries expected_batch_version 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id }
            - call: "POST /production-batches/${batch_id}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { b_v: $.data.version }
            - call: "POST /production-batches/${batch_id}/discard"
              payload: { qty: 40, reason: "QUALITY_REJECT", expected_batch_version: "${b_v}" }
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { s_disc: $.data.status, b_v2: $.data.version }
          trigger:
            - call: "POST /production-batches/${batch_id}/discard"
              payload: { qty: 1, reason: "QUALITY_REJECT", expected_batch_version: "${b_v2}" }
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { err_discard: $.data.error_id }
            - call: "POST /production-batches/${batch_id}/bake"
              payload: { additional_qty: 12 }
              as: KitchenAssociate
              captures: { err_bake: $.data.error_id }
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { err_pull: $.data.error_id }
          assert:
            - "${b_v} == 3"
            - "${s_disc} == DISCARDED"
            - "${err_discard} == ERR_BATCH_STATE_INVALID"
            - "${err_bake} == ERR_BATCH_STATE_INVALID"
            - "${err_pull} == ERR_BATCH_STATE_INVALID"
            - "all three trigger calls return HTTP status 409"
            - "ProductionBatch.${batch_id}.status == DISCARDED"
            - "ProductionBatch.${batch_id}.remaining_qty == 0"
            - "ProductionBatch.${batch_id}.discarded_qty == 40"
            - "ProductionBatch.${batch_id}.baked_qty == 40"
            - "GET /production-batches/${batch_id}/waste-logs -> total_count == 1"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].reason == QUALITY_REJECT"
            - "GET /production-batches/${batch_id}/waste-logs -> data[0].logged_by_user_id == lead-1"
            - "Store.${store_id}.waste_cost_cents_mtd == 1600"
            - "Store.${store_id}.hot_case_slots_used == 0"

      - name: publishing_an_already_published_plan_returns_plan_state_invalid
        claim_type: idempotency
        grounds:
