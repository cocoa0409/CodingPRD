            - "no double-return occurred: the final balance is 600000, not 700000 or 800000, and both projects read reserve_draw_cents 0"
            - "the ledger never went negative and never exceeded 600000 at any of the four observation points"

      - name: counted_voting_weight_conserved_across_revoke_recast_and_lien_void
        grounds:
          - "entities.SpecialAssessmentProposal.fields.counted_weight_total"
          - "state_machines.Ballot.CAST_to_REVOKED"
          - "state_machines.Ballot.CAST_to_VOIDED"
          - "calculations.member_voting_weight"
        distinguishing_aspect: >
          counted_weight_total must always equal the sum of weight_snapshot over
          the proposal's CAST ballots, and yes plus no plus abstain must always
          equal counted_weight_total, across five mutations that each remove or
          add exactly one unit: cast, cast, revoke, re-cast, and a lien cascade
          that voids a ballot from three entities away. The compensation is
          deliberately asymmetric — paying the charge releases the lien and
          restores the member to GOOD_STANDING, but the VOIDED ballot is terminal
          and is NOT restored, so counted_weight_total stays 1 and quorum_met
          stays false. An implementation that recomputes the tally from
          "members currently eligible" instead of from CAST ballot rows silently
          resurrects the voided vote at exactly that step.
        test_recipe:
          setup: |
            Build FULL_3 (P1 290 ft RESIDENTIAL_YEAR_ROUND, P2 400 ft SEASONAL,
            P3 250 ft AGRICULTURAL; units 290/240/200) with quorum_bps 5000 and
            PER_PARCEL voting, and levy an FY2027 FRONTAGE_WEIGHTED roll for
            4000000, which produces charges 1589041 / 1315068 / 1095890 with
            due_date 2026-11-15. Draft a GRADING proposal for 1500000 EQUAL_SHARE
            and open balloting to close 2027-01-05, snapshotting
            eligible_weight_total 3 at PER_PARCEL weight 1 each. Quorum needs
            counted*10000 >= 3*5000, i.e. at least 2 counted units.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Pine Hollow Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Pine Hollow Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P42", frontage_feet: 400, usage_class: "SEASONAL", trips_per_day: 3, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p2_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P43", frontage_feet: 250, usage_class: "AGRICULTURAL", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p3_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB120-P41", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p2_id}", owner_name: "Bo Nakamura", deed_book_page: "DB120-P42", deed_recorded_date: "2020-06-03" }
              as: AssociationSecretary
              captures: { m2_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p3_id}", owner_name: "Cyd Okonjo", deed_book_page: "DB120-P43", deed_recorded_date: "2021-02-18" }
