scaffold_corner_design:
- section: entities
  instances:
  - name: association_create_returns_envelope_and_system_defaults
    claim_type: creation
    grounds:
    - entities.Association
    - endpoints[POST /associations]
    - response_envelope
    distinguishing_aspect: Create returns the fixed envelope (meta.api_request_id, response_type object) with system defaults review_index 0, empty disaster list, version 1.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /associations
        payload:
          name: Blackhawk FCS
          charter_number: CH-1850
        as: AssociationBoard
        captures:
          assoc: $.data.id
          ri: $.data.review_index
          v: $.data.version
      assert:
      - HTTP 201; envelope has meta.api_request_id, meta.api_request_timestamp, response_type == object
      - review_index == 0 (${ri}), active_disaster_declarations == [], version == 1 (${v})
      - id ${assoc} is a server-minted UUID (no type prefix)
  - name: borrower_missing_required_field_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Borrower.fields.county
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required input county yields ERR_INVALID_REQUEST (400); no borrower row is created.
    test_recipe:
      setup:
      - association exists
      setup_api_calls:
      - call: POST /associations
        payload:
          name: Blackhawk FCS
          charter_number: CH-1850
        as: AssociationBoard
        captures:
          assoc: $.data.id
      trigger:
      - call: POST /borrowers
        payload:
          association_id: ${assoc}
          legal_name: No County Farms
          tax_id: 41-9
        as: LoanOfficer
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (${err}), HTTP 400
      - GET /borrowers?association_id=${assoc} returns total_count == 0
  - name: collateral_default_prior_lien_applied
    claim_type: defaults
    grounds:
    - entities.Collateral.fields.prior_lien_cents
    distinguishing_aspect: Omitting optional prior_lien_cents defaults it to 0.
    test_recipe:
      setup:
      - DRAFT loan exists
      setup_api_calls:
      - call: POST /associations
        payload:
          name: Blackhawk FCS
          charter_number: CH-1850
        as: AssociationBoard
        captures:
          assoc: $.data.id
      - call: POST /borrowers
        payload:
          association_id: ${assoc}
          legal_name: Sunrise Farms LLC
          tax_id: 41-0000001
          county: BLACKHAWK
        as: LoanOfficer
        captures:
          bor: $.data.id
      - call: POST /loan-accounts
        payload:
          borrower_id: ${bor}
          requested_commitment_cents: 50000000
          rate_bps: 700
          season_year: 2026
          maturity_date: '2027-02-28T00:00:00Z'
        as: LoanOfficer
        captures:
          loan: $.data.id
      trigger:
      - call: POST /collateral
        payload:
          loan_account_id: ${loan}
          collateral_type: EQUIPMENT
          description: Planter
          appraised_value_cents: 4000000
        as: LoanOfficer
        captures:
          pl: $.data.prior_lien_cents
          pst: $.data.status
          perf: $.data.perfection_state
      assert:
      - prior_lien_cents == 0 (${pl}); status == PLEDGED (${pst}); perfection_state == UNPERFECTED (${perf})
  - name: loan_create_computed_field_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.LoanAccount.fields.outstanding_principal_cents
    - entities.LoanAccount.fields.borrowing_base_cents
    distinguishing_aspect: 'Client-supplied values for computed fields are ignored: a create carrying outstanding_principal_cents 999999 still persists 0.'
    test_recipe:
      setup:
      - borrower exists
      setup_api_calls:
      - call: POST /associations
        payload:
          name: Blackhawk FCS
          charter_number: CH-1850
        as: AssociationBoard
        captures:
          assoc: $.data.id
      - call: POST /borrowers
        payload:
          association_id: ${assoc}
          legal_name: Sunrise Farms LLC
          tax_id: 41-0000001
          county: BLACKHAWK
        as: LoanOfficer
        captures:
          bor: $.data.id
      trigger:
      - call: POST /loan-accounts
        payload:
          borrower_id: ${bor}
          requested_commitment_cents: 50000000
          rate_bps: 700
          season_year: 2026
          maturity_date: '2027-02-28T00:00:00Z'
          outstanding_principal_cents: 999999
          borrowing_base_cents: 1
        as: LoanOfficer
        captures:
          prin: $.data.outstanding_principal_cents
          bb: $.data.borrowing_base_cents
          st: $.data.status
      assert:
      - outstanding_principal_cents == 0 (${prin}); borrowing_base_cents == 0 (${bb}); status == DRAFT (${st})
  - name: loan_get_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - validations[priority=5]
    distinguishing_aspect: GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404).
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: GET /loan-accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: LoanOfficer
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND (${err}), HTTP 404
  - name: collateral_invalid_enum_value_returns_invalid_request
    claim_type: type_constraints
    grounds:
    - entities.Collateral.fields.collateral_type
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: collateral_type GOLD is outside the declared enum and is rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - DRAFT loan exists
      setup_api_calls:
      - call: POST /associations
        payload:
          name: Blackhawk FCS
          charter_number: CH-1850
        as: AssociationBoard
        captures:
          assoc: $.data.id
      - call: POST /borrowers
        payload:
          association_id: ${assoc}
          legal_name: Sunrise Farms LLC
          tax_id: 41-0000001
          county: BLACKHAWK
        as: LoanOfficer
        captures:
          bor: $.data.id
      - call: POST /loan-accounts
        payload:
          borrower_id: ${bor}
          requested_commitment_cents: 50000000
          rate_bps: 700
          season_year: 2026
          maturity_date: '2027-02-28T00:00:00Z'
        as: LoanOfficer
        captures:
          loan: $.data.id
      trigger:
      - call: POST /collateral
        payload:
          loan_account_id: ${loan}
          collateral_type: GOLD
          description: Gold bars
          appraised_value_cents: 100
        as: LoanOfficer
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (${err}), HTTP 400
  - name: draw_list_pagination_and_status_filter
    claim_type: listing
    grounds:
    - response_envelope
    - endpoints[GET /draw-requests
    distinguishing_aspect: limit/offset paginate with total_count and has_more; the status filter selects only matching draws.
    test_recipe:
      setup:
      - 'ACTIVE loan (BB/commitment 50,000,000) with three draws: one APPROVED, one DENIED, one REQUESTED'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-03-01T00:00:00Z'
        as: System
      - call: POST /associations
        payload:
          name: Blackhawk FCS
          charter_number: CH-1850
        as: AssociationBoard
        captures:
          assoc: $.data.id
      - call: POST /borrowers
        payload:
          association_id: ${assoc}
          legal_name: Sunrise Farms LLC
          tax_id: 41-0000001
          county: BLACKHAWK
        as: LoanOfficer
        captures:
          bor: $.data.id
      - call: POST /loan-accounts
        payload:
          borrower_id: ${bor}
          requested_commitment_cents: 50000000
          rate_bps: 700
          season_year: 2026
          maturity_date: '2027-02-28T00:00:00Z'
        as: LoanOfficer
        captures:
          loan: $.data.id
      - call: POST /loan-accounts/${loan}/submit
        as: LoanOfficer
      - call: POST /loan-accounts/${loan}/approve
        payload:
          approved_commitment_cents: 50000000
        as: CreditCommittee
        captures:
          loan_v: $.data.version
      - call: POST /crop-budgets
        payload:
          loan_account_id: ${loan}
          season_year: 2026
          crop_type: CORN
          acres: 4000
          projected_revenue_cents: 80000000
          projected_expenses_cents: 50000000
          expected_loan_version: ${loan_v}
        as: Borrower
        as_user_id: ${bor}
        captures:
          bud: $.data.id
      - call: POST /crop-budgets/${bud}/approve
        as: LoanOfficer
      - call: POST /collateral
        payload:
          loan_account_id: ${loan}
          collateral_type: REAL_ESTATE
          description: 640 acres
          appraised_value_cents: 60000000
        as: LoanOfficer
        captures:
          col: $.data.id
      - call: POST /ucc-filings
        payload:
          collateral_id: ${col}
          filing_number: UCC-26-001
          jurisdiction: STATE_UCC_OFFICE
          filed_date: '2026-03-05T00:00:00Z'
        as: LoanOfficer
      - call: POST /insurance-policies
        payload:
          borrower_id: ${bor}
          policy_number: POL-001
          crop_type: CORN
          county: BLACKHAWK
          coverage_start: '2026-03-01T00:00:00Z'
          coverage_end: '2027-03-01T00:00:00Z'
          coverage_amount_cents: 40000000
        as: LoanOfficer
        captures:
          pol: $.data.id
      - call: POST /insurance-policies/${pol}/assign
        payload:
          loan_account_id: ${loan}
        as: LoanOfficer
      - call: POST /loan-accounts/${loan}/activate
        as: LoanOfficer
      - call: POST /draw-requests
        payload:
          loan_account_id: ${loan}
          amount_cents: 100000
          purpose: FUEL
        as: LoanOfficer
        captures:
          d1: $.data.id
      - call: POST /draw-requests/${d1}/approve
        as: LoanOfficer
      - call: POST /draw-requests
        payload:
          loan_account_id: ${loan}
          amount_cents: 200000
          purpose: SEED
        as: LoanOfficer
        captures:
          d2: $.data.id
      - call: POST /draw-requests/${d2}/deny
        payload:
          reason: purpose not covered
        as: LoanOfficer
      - call: POST /draw-requests
        payload:
          loan_account_id: ${loan}
          amount_cents: 300000
          purpose: LABOR
        as: LoanOfficer
        captures:
          d3: $.data.id
      trigger:
      - call: GET /draw-requests?loan_account_id=${loan}&limit=2&offset=0
        as: LoanOfficer
      - call: GET /draw-requests?loan_account_id=${loan}&status=DENIED
        as: LoanOfficer
      assert:
      - 'first list: response_type array, total_count == 3, has_more == true, exactly 2 items'
      - 'DENIED filter: total_count == 1, has_more == false, sole item id == ${d2}'
- section: state_machines
