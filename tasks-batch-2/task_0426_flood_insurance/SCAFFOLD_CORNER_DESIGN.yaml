  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_each_policy_mutation
        claim_type: optimistic_concurrency
        grounds:
          - "entities.Policy.fields.version"
          - "state_machines.Policy.QUOTED_to_BOUND"
        distinguishing_aspect: "Policy.version starts at 1 on quote and increments by 1 on each mutation: 1 (quote) -> 2 (bind) -> 3 (activate)."
        test_recipe:
          setup: ["A QUOTED lender policy on an X property; clock 2026-03-01."]
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Ver Town", county_code: "C131" }
              as: FemaAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties"
              payload: { community_id: "${cid}", owner_id: "h-vr", address: "VR1", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "h-vr"
              captures: { pid: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${pid}", surveyor_license: "SURV-VR", lowest_floor_elevation_ft: 11.0 }
              as: PolicyHolder
              as_user_id: "h-vr"
            - call: "POST /properties/${pid}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 100000, contents_coverage: 40000, is_lender_required: true }
              as: Underwriter
              captures: { pol_id: $.data.id, v0: $.data.version }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
              captures: { v2: $.data.version }
          assert:
            - "Policy.${pol_id}.version == 3"

      - name: transfer_stale_policy_version_already_covered
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[transfer-stale-policy]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / policy_branching_active_to_transferred_vs_cancelled
          rationale: "The transfer/cancel OCC version flow on Policy is exercised by the named §1.8 branching instance; the positive-version path is asserted there and the stale path mirrors the §1.6 ERR_STALE_POLICY_VERSION rule."

      - name: repetitive_loss_cascade_already_covered
        claim_type: cascading_side_effects
        grounds:
          - "entities.Property.fields.is_repetitive_loss"
        excluded_because:
          difficulty_instance: transitive_cascade / claim_approve_cascade_to_repetitive_loss_depth3
          rationale: "The claim-approve -> policy ledger -> property loss-history -> repetitive-loss cascade is asserted by the named §1.8 instance."

