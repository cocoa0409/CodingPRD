              payload: { name: "Full P7b", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Pending Holder", email: "pend@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /parking-addons"
              payload: { subscription_id: "${sub_id}", parking_zone_id: "${zone_id}" }
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: seat_closed_interval_window_adjacency_conflict
        grounds:
          - validations[priority=9]
          - entities.Seat.fields.season_start_date
          - endpoints[POST /seat-assignments]
        distinguishing_aspect: |
          Pairwise-exclusion interval semantics on a Seat: a seat already backing
          an ASSIGNED assignment for window [2026-10-01,2027-04-01] rejects a new
          assignment for window [2027-04-01,2027-09-01] because closed-interval
          adjacency (shared endpoint 2027-04-01) counts as overlap ->
          ERR_SEAT_WINDOW_CONFLICT. Geometric treatment: closed intervals,
          adjacency = collision.
        test_recipe:
          setup:
            - "One physical seat row/number reused across two Seat rows with adjacent closed windows; the first window's seat is already ASSIGNED to subscription A; subscription B tries to assign the adjacent-window seat at the same physical location"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 190", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "R", seat_number: 7, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_w1: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "R", seat_number: 7, season_start_date: "2027-04-01T00:00:00.000Z", season_end_date: "2027-09-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_w2: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full P8a", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Holder A8", email: "a8@x.com" }
              as: BoxOfficeAgent
              captures: { accA_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Holder B8", email: "b8@x.com" }
              as: BoxOfficeAgent
              captures: { accB_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${accA_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { subA_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${accB_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { subB_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${subA_id}", seat_id: "${seat_w1}" }
              as: BoxOfficeAgent
          trigger:
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${subB_id}", seat_id: "${seat_w2}" }
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_SEAT_WINDOW_CONFLICT"

      - name: parking_zone_aggregate_capacity_conflict
        grounds:
          - validations[priority=10]
          - entities.ParkingZone.fields.capacity
          - endpoints[POST /parking-addons]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on a ParkingZone: the zone holds
          up to `capacity` concurrent ACTIVE passes (n-way capacity counting), NOT
          pairwise interval exclusion. A capacity=2 zone with 2 ACTIVE passes
          rejects a third -> ERR_PARKING_ZONE_FULL. Different geometric treatment
          (aggregate count vs pairwise adjacency) on a different resource entity.
        test_recipe:
          setup:
            - "ParkingZone capacity=2 already holding 2 ACTIVE passes from two ACTIVE subscriptions; a third ACTIVE subscription attempts a pass"
          setup_api_calls:
            - call: "POST /parking-zones"
              payload: { name: "Lot Two", capacity: 2, price_cents: 30000 }
              as: BoxOfficeAgent
              captures: { zone_id: $.data.id }
            - call: "POST /sections"
              payload: { name: "Lower 200", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "S", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat1: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "S", seat_number: 2, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat2: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "S", seat_number: 3, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat3: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full P8b", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Pk1", email: "pk1@x.com" }
              as: BoxOfficeAgent
              captures: { a1: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Pk2", email: "pk2@x.com" }
              as: BoxOfficeAgent
              captures: { a2: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Pk3", email: "pk3@x.com" }
              as: BoxOfficeAgent
              captures: { a3: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${a1}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub1: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${a2}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub2: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${a3}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub3: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub1}", seat_id: "${seat1}" }
              as: BoxOfficeAgent
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub2}", seat_id: "${seat2}" }
              as: BoxOfficeAgent
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub3}", seat_id: "${seat3}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub1}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub2}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub3}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /parking-addons"
              payload: { subscription_id: "${sub1}", parking_zone_id: "${zone_id}" }
              as: BoxOfficeAgent
            - call: "POST /parking-addons"
              payload: { subscription_id: "${sub2}", parking_zone_id: "${zone_id}" }
              as: BoxOfficeAgent
          trigger:
            - call: "POST /parking-addons"
              payload: { subscription_id: "${sub3}", parking_zone_id: "${zone_id}" }
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_PARKING_ZONE_FULL"
            - "ParkingZone.${zone_id}.active_pass_count == 2"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_conserves_section_seat_inventory
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - entities.Section.fields.available_seats
          - entities.Seat.fields.status
        distinguishing_aspect: |
          Conserved quantity = section seat inventory. Invariant pinned as
          Section.available_seats(after cancel) == Section.available_seats(before
          activation). Activate SOLD one seat (available 2->1); cancel RELEASES it
          (available 1->2). The forward (assign->SOLD) and compensating
          (cancel->AVAILABLE) actions leave Section.available_seats unchanged.
        test_recipe:
          setup:
            - "Section with exactly 2 seats (available_seats=2); a subscription assigned ONE of them and activated (available_seats=1)"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 210", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "T", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat1: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "T", seat_number: 2, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat2: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full P9a", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Cons Holder", email: "cons@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat1}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Section.${sec_id}.available_seats == 2"
            - "Seat.${seat1}.status == AVAILABLE"
            - "Subscription.${sub_id}.seat_count == 0"

      - name: cancel_conserves_account_priority_points
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - calculations.priority_points_accrual
          - entities.Account.fields.priority_points
        distinguishing_aspect: |
          Conserved quantity = Account.priority_points (a different conserved
          quantity than seat inventory). Activation accrued 100 points
          (priority_points 0->100); cancel claws back exactly the points granted
          for this subscription (100->0). Invariant: priority_points(after cancel)
          == priority_points(before activation) == 0.
        test_recipe:
          setup:
            - "BRONZE account (priority_points=0, consecutive_seasons=0) with an ACTIVE 1-seat FULL non-playoff subscription that accrued 100 points at activation"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 220", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "U", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full P9b", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000, includes_playoffs: false }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Points Holder", email: "pts@x.com", consecutive_seasons: 0 }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Account.${acc_id}.priority_points == 0"
            - "Account.${acc_id}.loyalty_tier == BRONZE"
