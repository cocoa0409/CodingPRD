scenario: "Personal Income Tax Filing (TurboTax style): W-2/1099-NEC/INT/DIV/B import, Schedule A/B/C/D/E, tax credits (EITC/CTC/AOTC), electronic filing, amended 1040X, Estimated Tax quarterly"
domain_name: "income-tax-filing"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Optimistic concurrency"
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Rate / threshold triggers"

  entity_topology: hybrid
  # TaxReturn is the aggregate root (tree: IncomeDocument, Schedule, CreditClaim, Dependent
  # hang under a return); EstimatedTaxPayment and EFilingSubmission cross-cut by FK; AmendedReturn
  # self-references the prior TaxReturn it supersedes.

  state_machine_shape: cyclic
  # TaxReturn: DRAFT -> READY -> FILED, with REJECTED -> DRAFT revision loop (cyclic).
  # EFilingSubmission: branching (TRANSMITTED -> {ACCEPTED, REJECTED}).
  # AmendedReturn: linear with cross-entity guard on the original return.

  relationship_patterns:
    - one_to_many        # TaxReturn -> IncomeDocument / Schedule / CreditClaim / Dependent / EstimatedTaxPayment
    - self_referential   # AmendedReturn.original_return_id -> TaxReturn.id (a return amends a prior return)
    - cross_aggregate    # EFilingSubmission references TaxReturn across the filing boundary

  role_model: segregation_of_duties
  # Taxpayer prepares and owns the return; Preparer (paid preparer) can edit/compute but the
  # Taxpayer alone authorizes e-file (sign); IrsGateway (opaque) records accept/reject outcomes.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Taxpayer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "login identity; unique across taxpayers"
        constraints: "unique, non-empty"
      - name: full_name
        type: string
        source: input
        description: "legal name on the return"
      - name: filing_status
        type: enum
        source: input
        description: "default filing status for new returns"
        constraints: "one of SINGLE, MARRIED_JOINT, MARRIED_SEPARATE, HEAD_OF_HOUSEHOLD"
      - name: prior_year_agi_cents
        type: integer
        source: input
        description: "prior tax year adjusted gross income, in cents; used by the safe-harbor estimated-tax variant"
        default: 0
      - name: prior_year_total_tax_cents
        type: integer
        source: input
        description: "prior tax year total tax liability, in cents; baseline for the prior-year safe-harbor"
        default: 0

  - name: TaxReturn
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK -> Taxpayer.id"
      - name: tax_year
        type: integer
        source: input
        description: "filing tax year, e.g. 2025"
        constraints: ">= 2020"
      - name: filing_status
        type: enum
        source: input
        description: "filing status for this return; SINGLE, MARRIED_JOINT, MARRIED_SEPARATE, HEAD_OF_HOUSEHOLD"
      - name: status
        type: enum
        source: system
        description: "lifecycle state; DRAFT, READY, FILED, REJECTED, AMENDED, SUPERSEDED"
        default: "DRAFT"
      - name: deduction_method
        type: enum
        source: input
        description: "which deduction the taxpayer elects; STANDARD or ITEMIZED"
        default: "STANDARD"
      - name: total_income_cents
        type: integer
        source: computed
        description: "sum of all income across IncomeDocuments plus Schedule C/D/E net amounts; recomputed on compute"
        default: 0
      - name: agi_cents
        type: integer
        source: computed
        description: "adjusted gross income in cents; recomputed on compute"
        default: 0
      - name: taxable_income_cents
        type: integer
        source: computed
        description: "AGI minus the elected deduction, floored at 0; recomputed on compute"
        default: 0
      - name: tax_before_credits_cents
        type: integer
        source: computed
        description: "bracket tax on taxable income; recomputed on compute"
        default: 0
      - name: total_credits_cents
        type: integer
        source: computed
        description: "sum of allowed CreditClaim.allowed_amount_cents; recomputed on compute"
        default: 0
      - name: tax_after_credits_cents
        type: integer
        source: computed
        description: "tax_before_credits minus nonrefundable credits floored at 0, minus refundable credits; recomputed on compute"
        default: 0
      - name: total_payments_cents
        type: integer
        source: computed
        description: "withholding from IncomeDocuments plus sum of applied EstimatedTaxPayment.amount_cents; recomputed on compute"
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "tax_after_credits minus total_payments; positive = owed, negative = refund; recomputed on compute"
        default: 0
      - name: computed_at
        type: datetime
        source: system
        description: "timestamp of the last successful compute; null until first compute"
        default: null

  - name: IncomeDocument
    parent: TaxReturn
    common_fields: true
    fields:
      - name: return_id
        type: string
        source: input
        description: "FK -> TaxReturn.id"
      - name: doc_type
        type: enum
        source: input
        description: "W2, 1099_NEC, 1099_INT, 1099_DIV, 1099_B"
      - name: payer_name
        type: string
        source: input
        description: "employer or payer name as printed on the form"
      - name: box_amount_cents
        type: integer
        source: input
        description: "principal money box: W2 wages (box 1), 1099-NEC nonemployee comp, 1099-INT interest, 1099-DIV ordinary dividends; in cents"
        constraints: ">= 0"
      - name: federal_withholding_cents
        type: integer
        source: input
        description: "federal income tax withheld reported on this document, in cents"
        default: 0
        constraints: ">= 0"
      - name: qualified_dividends_cents
        type: integer
        source: input
        description: "1099-DIV qualified dividends subset of box_amount_cents; ignored unless doc_type=1099_DIV"
        default: 0
        constraints: ">= 0, <= box_amount_cents"
      - name: proceeds_cents
        type: integer
        source: input
        description: "1099-B gross proceeds; ignored unless doc_type=1099_B"
        default: 0
        constraints: ">= 0"
      - name: cost_basis_cents
        type: integer
        source: input
        description: "1099-B cost basis; ignored unless doc_type=1099_B"
        default: 0
        constraints: ">= 0"
      - name: holding_long_term
        type: boolean
        source: input
        description: "1099-B: true if the lot was held > 1 year (long-term); ignored for other doc types"
        default: false

  - name: Schedule
    parent: TaxReturn
    common_fields: true
    fields:
      - name: return_id
        type: string
        source: input
        description: "FK -> TaxReturn.id"
      - name: schedule_type
        type: enum
        source: input
        description: "A (itemized deductions), B (interest/dividends), C (business P/L), D (capital gains), E (rental/royalty); one Schedule per type per return"
        constraints: "one of A, B, C, D, E"
      - name: gross_amount_cents
        type: integer
        source: input
        description: "schedule-specific gross figure: A=total itemized deductions, C=gross receipts, E=gross rents; in cents"
        default: 0
        constraints: ">= 0"
      - name: expense_amount_cents
        type: integer
        source: input
        description: "deductible expenses for C/E; ignored for A/B/D; in cents"
        default: 0
        constraints: ">= 0"
      - name: net_amount_cents
        type: integer
        source: computed
        description: "C/E: gross_amount - expense_amount (may be negative); A: itemized total; D: net capital gain/loss from 1099-B lots; B: 0; recomputed on compute"
        default: 0

  - name: Dependent
    parent: TaxReturn
    common_fields: true
    fields:
      - name: return_id
        type: string
        source: input
        description: "FK -> TaxReturn.id"
      - name: full_name
        type: string
        source: input
        description: "dependent legal name"
      - name: age_years
        type: integer
        source: input
        description: "dependent age in whole years at year end"
        constraints: ">= 0"
      - name: is_student
        type: boolean
        source: input
        description: "true if a qualifying full-time student (affects AOTC eligibility)"
        default: false
      - name: qualifies_ctc
        type: boolean
        source: computed
        description: "true when age_years < 17 at year end; drives Child Tax Credit per-child count"
        default: false

  - name: CreditClaim
    parent: TaxReturn
    common_fields: true
    fields:
      - name: return_id
        type: string
        source: input
        description: "FK -> TaxReturn.id"
      - name: credit_type
        type: enum
        source: input
        description: "EITC (refundable), CTC (partly refundable, treated nonrefundable here), AOTC (40% refundable); one claim per type per return"
        constraints: "one of EITC, CTC, AOTC"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "amount the filer claims before eligibility/phase-out; in cents"
        default: 0
        constraints: ">= 0"
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "amount allowed after eligibility, per-child caps, and AGI phase-out; recomputed on compute"
        default: 0
      - name: refundable_cents
        type: integer
        source: computed
        description: "portion of allowed_amount_cents that is refundable (EITC full, AOTC 40%, CTC 0); recomputed on compute"
        default: 0

  - name: EstimatedTaxPayment
    parent: null
    common_fields: true
    fields:
      - name: return_id
        type: string
        source: input
        description: "FK -> TaxReturn.id"
      - name: quarter
        type: enum
        source: input
        description: "quarterly installment; Q1, Q2, Q3, Q4"
        constraints: "one of Q1, Q2, Q3, Q4; unique per (return_id, quarter)"
      - name: amount_cents
        type: integer
        source: input
        description: "installment amount paid, in cents"
        constraints: "> 0"
      - name: paid_on
        type: datetime
        source: input
        description: "date the installment was paid (ISO 8601)"
      - name: period_start
        type: datetime
        source: input
        description: "start of the income period this installment covers (ISO 8601); used for half-open [start, end) overlap detection against other payments on the same return"
      - name: period_end
        type: datetime
        source: input
        description: "end of the income period this installment covers (ISO 8601, exclusive); period_end MUST be > period_start"
      - name: on_time
        type: boolean
        source: computed
        description: "true if paid_on is on or before the quarter's statutory due date; drives the underpayment-penalty variant"
        default: false

  - name: EFilingSubmission
    parent: null
    common_fields: true
    fields:
      - name: return_id
        type: string
        source: input
        description: "FK -> TaxReturn.id"
      - name: status
        type: enum
        source: system
        description: "TRANSMITTED, ACCEPTED, REJECTED"
        default: "TRANSMITTED"
      - name: signature_pin
        type: string
        source: input
        description: "self-select PIN the Taxpayer signs with at transmission"
      - name: ack_code
        type: string
        source: input
        description: "IRS acknowledgement / reject reason code, set by the gateway on accept/reject"
        default: null
      - name: snapshot_balance_due_cents
        type: integer
        source: system
        description: "balance_due_cents copied from the return at transmission; frozen for audit"
        default: 0
      - name: superseded_by_amendment
        type: boolean
        source: system
        description: "set true by cascade when the parent return is moved to AMENDED by a filed 1040X; an ACCEPTED submission whose return is later amended is marked superseded for audit"
        default: false

  - name: AmendedReturn
    parent: null
    common_fields: true
    fields:
      - name: original_return_id
        type: string
        source: input
        description: "FK -> TaxReturn.id; the prior FILED return this 1040X amends"
      - name: taxpayer_id
        type: string
        source: input
        description: "FK -> Taxpayer.id"
      - name: status
        type: enum
        source: system
        description: "DRAFT, FILED; mirrors a simplified 1040X lifecycle"
        default: "DRAFT"
      - name: corrected_balance_due_cents
        type: integer
        source: input
        description: "recomputed balance due on the corrected figures, in cents (signed)"
      - name: correction_period_start
        type: datetime
        source: input
        description: "first day of the closed correction window [start, end] this 1040X covers (ISO 8601)"
      - name: correction_period_end
        type: datetime
        source: input
        description: "last day of the closed correction window [start, end] this 1040X covers (ISO 8601, inclusive); two amendments on the SAME original_return_id whose closed [start,end] windows touch or overlap (inclusive-endpoint adjacency counts as overlap) conflict"
      - name: delta_cents
        type: integer
        source: computed
        description: "corrected_balance_due_cents minus the original return's frozen balance_due_cents; signed; recomputed on file"
        default: 0

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: TaxReturn
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: READY
        trigger: "POST /tax-returns/{id}/compute"
        actor: Taxpayer
        preconditions:
          - "return has >= 1 IncomeDocument"
          - "if deduction_method=ITEMIZED then a Schedule of schedule_type=A exists"
        side_effects:
          - "run compute_return_tax: recompute total_income_cents, agi_cents, taxable_income_cents, tax_before_credits_cents, total_credits_cents, tax_after_credits_cents, total_payments_cents, balance_due_cents"
          - "run compute_credit_allowance for every CreditClaim: set allowed_amount_cents and refundable_cents"
          - "recompute each Schedule.net_amount_cents and each Dependent.qualifies_ctc"
          - "set computed_at = now"
          - "increments TaxReturn.version by 1"
        note: "compute is idempotent on a DRAFT and re-runnable; it advances DRAFT to READY"
      - from: READY
        to: READY
        trigger: "POST /tax-returns/{id}/compute"
        actor: Taxpayer
        preconditions:
          - "return has >= 1 IncomeDocument"
        side_effects:
          - "re-run compute_return_tax and compute_credit_allowance with current children"
          - "set computed_at = now"
          - "increments TaxReturn.version by 1"
        note: "recompute after editing children while still READY"
      - from: READY
        to: FILED
        trigger: "POST /tax-returns/{id}/efile (EFilingSubmission accepted)"
        actor: system
        preconditions:
          - "computed_at is not null and reflects current children (no edits since last compute)"
          - "an EFilingSubmission for this return reaches ACCEPTED"
        side_effects:
          - "set status=FILED"
          - "increments TaxReturn.version by 1"
        note: "return becomes FILED only when its e-file submission is ACCEPTED by the gateway"
      - from: READY
        to: DRAFT
        trigger: "POST /tax-returns/{id}/compute after a child edit invalidated the prior compute"
        actor: Taxpayer
        preconditions: []
        side_effects: []
        note: "editing an IncomeDocument/Schedule/CreditClaim/Dependent on a READY return resets status to DRAFT; see cross-entity dependency rules"
      - from: READY
        to: REJECTED
        trigger: "POST /tax-returns/{id}/efile (EFilingSubmission rejected)"
        actor: system
        preconditions:
          - "an EFilingSubmission for this return reaches REJECTED"
        side_effects:
          - "set status=REJECTED"
          - "increments TaxReturn.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "PATCH /tax-returns/{id} (taxpayer reopens to correct)"
        actor: Taxpayer
        preconditions: []
        side_effects:
          - "set status=DRAFT"
          - "increments TaxReturn.version by 1"
        note: |
          revision loop: a rejected return is reopened to DRAFT, edited, recomputed, and re-filed (cyclic).
          CONSERVED-QUANTITY INVARIANT (payments ledger): the forward reopen (REJECTED->DRAFT) and the
          compensating recompute (DRAFT->READY) MUST leave total_payments_cents unchanged from its value
          before rejection when no IncomeDocument/EstimatedTaxPayment is added or removed in between —
          total_payments_cents == sum(IncomeDocument.federal_withholding_cents) + sum(EstimatedTaxPayment.amount_cents)
          is invariant across a payment-neutral reopen/recompute cycle (zero drift).
      - from: FILED
        to: AMENDED
        trigger: "system: a 1040X AmendedReturn for this return is filed (POST /amended-returns/{id}/file)"
        actor: system
        preconditions:
          - "return.status == FILED"
        side_effects:
          - "set status=AMENDED on the original return"
          - "cascade: set superseded_by_amendment=true on this return's ACCEPTED EFilingSubmission (third cascade hop, caused by the AMENDED transition)"
          - "increments TaxReturn.version by 1"
          - "increments the affected EFilingSubmission.version by 1"
        note: "filing a 1040X marks the original FILED return AMENDED, which in turn marks its accepted e-file submission superseded"

  - entity: EFilingSubmission
    initial_state: TRANSMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: TRANSMITTED
        to: ACCEPTED
        trigger: "POST /efilings/{id}/acknowledge with outcome=ACCEPTED"
        actor: IrsGateway
        preconditions:
          - "submission.status == TRANSMITTED"
        side_effects:
          - "set status=ACCEPTED, ack_code from request"
          - "drive the parent TaxReturn READY -> FILED"
          - "increments EFilingSubmission.version by 1"
      - from: TRANSMITTED
        to: REJECTED
        trigger: "POST /efilings/{id}/acknowledge with outcome=REJECTED"
        actor: IrsGateway
        preconditions:
          - "submission.status == TRANSMITTED"
        side_effects:
          - "set status=REJECTED, ack_code from request"
          - "drive the parent TaxReturn READY -> REJECTED"
          - "increments EFilingSubmission.version by 1"
        note: "branching fork: TRANSMITTED resolves to exactly one of ACCEPTED / REJECTED with divergent parent side-effects"

  - entity: AmendedReturn
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /amended-returns/{id}/file"
        actor: Taxpayer
        preconditions:
          - "the original_return_id TaxReturn.status == FILED (guarded cross-entity precondition)"
        side_effects:
          - "run compute_amendment_delta: set delta_cents = corrected_balance_due_cents - original.balance_due_cents"
          - "set status=FILED (hop 1)"
          - "transition the original TaxReturn FILED -> AMENDED (hop 2, caused by this AmendedReturn reaching FILED)"
          - "the original's AMENDED transition cascades to set superseded_by_amendment=true on its ACCEPTED EFilingSubmission (hop 3, caused by hop 2)"
          - "increments AmendedReturn.version by 1"
        note: |
          cross-entity guard: a 1040X may only be filed against a return currently in FILED.
          Transitive cascade depth 3: AmendedReturn.file -> AmendedReturn FILED -> original TaxReturn AMENDED -> EFilingSubmission superseded.
          CONSERVED-QUANTITY INVARIANT (balance-due ledger): the identity
          original.balance_due_cents + amended.delta_cents == amended.corrected_balance_due_cents
          MUST hold exactly after filing. The original's frozen balance_due_cents is the forward
          figure; delta_cents is its compensating adjustment; their sum reconstructs the corrected
          balance with zero drift.

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: efile-create-stale-return
    parent_entity: TaxReturn
    write_endpoint: "POST /tax-returns/{id}/efile"
    occ_field: "expected_return_version"
    description: |
      Transmitting an e-file submission against a TaxReturn whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A compute (which bumps the return's version) may have changed
      balance_due_cents after the client read it; the snapshot the e-file would
      freeze is then stale, so the transmission carrying the old expected version
      is refused.
    error_id: ERR_STALE_RETURN_VERSION
    http_status: 412
  - rule_id: amend-create-stale-return
    parent_entity: TaxReturn
    write_endpoint: "POST /amended-returns"
    occ_field: "expected_return_version"
    description: |
      Creating a 1040X AmendedReturn against an original TaxReturn whose version
      has advanced since the client last read it is rejected. Another amendment
      may have already moved the original toward AMENDED (legitimately superseding
      the prior corrected figures), so the current creator's view of the original
      return is stale.
    error_id: ERR_STALE_RETURN_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: compute_return_tax
    trigger: "POST /tax-returns/{id}/compute (DRAFT->READY and READY->READY)"
    algorithm: tiered_pricing
    formula: |
      # --- income aggregation (all cents, integer arithmetic) ---
      wages       = sum(d.box_amount_cents for d in docs if d.doc_type == 'W2')
      nec         = sum(d.box_amount_cents for d in docs if d.doc_type == '1099_NEC')
      interest    = sum(d.box_amount_cents for d in docs if d.doc_type == '1099_INT')
      dividends   = sum(d.box_amount_cents for d in docs if d.doc_type == '1099_DIV')
      # Schedule net contributions (Schedule.net_amount_cents already recomputed first):
      sched_c_net = Schedule(C).net_amount_cents  if exists else 0   # gross - expense
      sched_e_net = Schedule(E).net_amount_cents  if exists else 0   # gross - expense
      sched_d_net = Schedule(D).net_amount_cents  if exists else 0   # net cap gain/loss from 1099_B lots
      total_income_cents = wages + nec + interest + dividends + sched_c_net + sched_e_net + sched_d_net

      # AGI: no above-the-line adjustments modeled -> agi == total_income (floored at 0)
      agi_cents = max(0, total_income_cents)

      # deduction
      if deduction_method == 'STANDARD':
          deduction = STANDARD_DEDUCTION[filing_status]
      else:  # ITEMIZED
          deduction = Schedule(A).net_amount_cents   # == Schedule(A).gross_amount_cents
      taxable_income_cents = max(0, agi_cents - deduction)

      # bracket tax: marginal tiered rates on taxable_income_cents
      tax_before_credits_cents = bracket_tax(taxable_income_cents, filing_status)

      # credits (compute_credit_allowance has set allowed/refundable on each CreditClaim)
      nonrefundable = sum(c.allowed_amount_cents - c.refundable_cents for c in claims)
      refundable    = sum(c.refundable_cents for c in claims)
      total_credits_cents = sum(c.allowed_amount_cents for c in claims)
      tax_after_credits_cents = max(0, tax_before_credits_cents - nonrefundable) - refundable

      # payments
      withholding = sum(d.federal_withholding_cents for d in docs)
      est_paid    = sum(p.amount_cents for p in estimated_payments)   # all payments for the return
      total_payments_cents = withholding + est_paid

      balance_due_cents = tax_after_credits_cents - total_payments_cents
    input_set: "All IncomeDocument, Schedule, CreditClaim, Dependent, EstimatedTaxPayment rows whose return_id == this return. No status filter on children (they have no lifecycle of their own)."
    constants:
      STANDARD_DEDUCTION:
        SINGLE: 1500000           # $15,000.00
        MARRIED_JOINT: 3000000    # $30,000.00
        MARRIED_SEPARATE: 1500000
        HEAD_OF_HOUSEHOLD: 2250000
      BRACKETS_SINGLE: "10% to 1,160,000; 12% to 4,715,000; 22% above (cents thresholds)"
      BRACKETS_MARRIED_JOINT: "10% to 2,320,000; 12% to 9,430,000; 22% above (cents thresholds)"
    precision: "integer cents throughout; bracket_tax rounds each tier's tax DOWN to the nearest cent (floor) BEFORE summing tiers — round-per-tier-then-sum order is pinned"
    variants:
      - name: standard_deduction
        when: "deduction_method == STANDARD"
        difference: "deduction = STANDARD_DEDUCTION[filing_status]; Schedule A is ignored even if present"
      - name: itemized_deduction
        when: "deduction_method == ITEMIZED"
        difference: "deduction = Schedule(A).gross_amount_cents; same income/credits but different taxable_income -> different balance_due for identical income data"

  - name: compute_credit_allowance
    trigger: "POST /tax-returns/{id}/compute (runs before compute_return_tax within the same compute)"
    algorithm: threshold
    formula: |
      # CTC: $2,000 per dependent with qualifies_ctc (age < 17). Nonrefundable here (refundable=0).
      ctc_children = count(dep for dep in dependents if dep.age_years < 17)
      ctc_allowed  = min(claim_CTC.claimed_amount_cents, ctc_children * CTC_PER_CHILD)

      # AOTC: up to $2,500 per student dependent; 40% refundable. AGI phase-out:
      #   if agi_cents <= AOTC_PHASEOUT_START -> full
      #   if agi_cents >= AOTC_PHASEOUT_END   -> zero
      #   else linear: allowed = claimed * (END - agi) / (END - START), floored to cents (floor)
      aotc_base = min(claim_AOTC.claimed_amount_cents, count(students) * AOTC_PER_STUDENT)
      if   agi_cents <= AOTC_PHASEOUT_START: aotc_allowed = aotc_base
      elif agi_cents >= AOTC_PHASEOUT_END:   aotc_allowed = 0
      else: aotc_allowed = floor(aotc_base * (AOTC_PHASEOUT_END - agi_cents) / (AOTC_PHASEOUT_END - AOTC_PHASEOUT_START))
      aotc_refundable = floor(aotc_allowed * 40 / 100)

      # EITC: fully refundable; phases out above EITC_PHASEOUT_START at EITC_PHASEOUT_RATE.
      eitc_max     = min(claim_EITC.claimed_amount_cents, EITC_MAX[ctc_children_band])
      excess       = max(0, agi_cents - EITC_PHASEOUT_START)
      eitc_allowed = max(0, eitc_max - floor(excess * EITC_PHASEOUT_RATE_PCT / 100))
    input_set: "CreditClaim rows for this return; Dependent rows for this return; uses agi_cents from compute_return_tax's income aggregation step (income is aggregated first, then credits, then tax-after-credits)."
    constants:
      CTC_PER_CHILD: 200000        # $2,000.00
      AOTC_PER_STUDENT: 250000     # $2,500.00
      AOTC_PHASEOUT_START: 8000000 # $80,000.00 AGI
      AOTC_PHASEOUT_END: 9000000   # $90,000.00 AGI
      EITC_PHASEOUT_START: 2000000 # $20,000.00 AGI
      EITC_PHASEOUT_RATE_PCT: 21   # 21% phase-out on AGI excess
      EITC_MAX: { "0": 60000, "1": 396000, "2": 655000 }
    precision: "integer cents; phase-out multiplications floored (round_down) to the nearest cent. AOTC two-step rounding ORDER is pinned: first floor the prorated allowed amount, THEN take floor(allowed * 40 / 100) for the refundable portion — refundable is computed from the already-floored allowed, NOT from the unfloored base, so 'floor-then-percent' and 'percent-then-floor' can diverge by a cent."
    variants:
      - name: aotc_below_phaseout
        when: "agi_cents <= AOTC_PHASEOUT_START"
        difference: "AOTC allowed at full base; no proration"
      - name: aotc_in_phaseout
        when: "AOTC_PHASEOUT_START < agi_cents < AOTC_PHASEOUT_END"
        difference: "AOTC linearly prorated by remaining phase-out fraction; floored to cents — same claimed amount yields a smaller allowed amount than the below-phaseout variant"

  - name: compute_capital_gain
    trigger: "POST /tax-returns/{id}/compute (Schedule D net recompute, before income aggregation)"
    algorithm: aggregation
    formula: |
      # Schedule D net = sum over 1099_B docs of (proceeds - cost_basis), short and long combined.
      # Net is signed; a net loss is capped at the annual deduction limit.
      raw_net = sum(d.proceeds_cents - d.cost_basis_cents for d in docs if d.doc_type == '1099_B')
      if raw_net >= 0:
          sched_d_net = raw_net
      else:
          sched_d_net = max(raw_net, -CAPITAL_LOSS_LIMIT)   # losses limited to -$3,000.00
    input_set: "All IncomeDocument rows with doc_type == 1099_B for this return; written onto Schedule(D).net_amount_cents (Schedule D auto-materialized/refreshed if 1099_B docs exist)."
    constants:
      CAPITAL_LOSS_LIMIT: 300000   # $3,000.00 maximum deductible net capital loss
    precision: "integer cents; no rounding (subtraction only)"

  - name: compute_underpayment_penalty
    trigger: "GET /tax-returns/{id}/estimated-tax-status (read-time projection) and POST /tax-returns/{id}/efile snapshot"
    algorithm: dual_variant_calc
    formula: |
      # Required annual estimated payment is the LESSER of two safe harbors:
      #   current-year:  90% of tax_after_credits_cents
      #   prior-year:    100% of taxpayer.prior_year_total_tax_cents
      #                  (110% if taxpayer.prior_year_agi_cents > HIGH_INCOME_AGI)
      required_current = floor(tax_after_credits_cents * 90 / 100)
      py_rate          = 110 if taxpayer.prior_year_agi_cents > HIGH_INCOME_AGI else 100
      required_prior   = floor(taxpayer.prior_year_total_tax_cents * py_rate / 100)
      required_annual  = min(required_current, required_prior)

      # Only ON-TIME installments count toward the required amount.
      paid_on_time = sum(p.amount_cents for p in estimated_payments if p.on_time == true)
      withholding  = sum(d.federal_withholding_cents for d in docs)   # withholding is always timely
      covered      = paid_on_time + withholding

      shortfall = max(0, required_annual - covered)
      penalty   = floor(shortfall * PENALTY_RATE_PCT / 100)
    input_set: "EstimatedTaxPayment rows for this return (on_time computed per quarter due date); withholding from IncomeDocuments; tax_after_credits_cents from the return; prior-year figures from the Taxpayer."
    constants:
      HIGH_INCOME_AGI: 15000000    # $150,000.00 prior-year AGI -> 110% safe harbor
      PENALTY_RATE_PCT: 8          # 8% annualized underpayment penalty on the shortfall
      QUARTER_DUE_DATES:
        Q1: "2025-04-15T23:59:59Z"
        Q2: "2025-06-16T23:59:59Z"
        Q3: "2025-09-15T23:59:59Z"
        Q4: "2026-01-15T23:59:59Z"
    precision: "integer cents; each safe-harbor and the penalty floored (round_down)"
    variants:
      - name: current_year_safe_harbor
        when: "required_current <= required_prior"
        difference: "required_annual = 90% of current-year tax_after_credits_cents"
      - name: prior_year_safe_harbor
        when: "required_prior < required_current"
        difference: "required_annual = prior-year tax * (100% or 110% if prior AGI high); identical current-year figures yield a different required amount and therefore a different penalty"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for Taxpayer-owned resources, X-User-ID equals the owning Taxpayer.id (return.taxpayer_id, or amended_return.taxpayer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Taxpayer/Preparer operations on a specific return or amendment"
  - priority: 4
    category: existence
    check: "path-referenced resources exist, validated left-to-right"
    error_id: ERR_RETURN_NOT_FOUND
    http_status: 404
    applies_to: "all /tax-returns/{id}/* , /efilings/{id}/* , /amended-returns/{id}/*"
  - priority: 5
    category: existence
    check: "body FK targets exist (taxpayer_id, return_id, original_return_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST /tax-returns, POST .../income-documents, .../schedules, .../credit-claims, .../dependents, POST /estimated-tax-payments, POST /efilings, POST /amended-returns"
  - priority: 6
    category: business_constraint
    check: "request body well-formed: required fields present, enums in range, money fields satisfy declared >=0 / >0 / <= constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH"
  - priority: 7
    category: state
    check: "target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "compute, efile, acknowledge, amended-returns/{id}/file, PATCH reopen"
  - priority: 8
    category: business_referential
    check: "uniqueness: at most one Schedule per (return_id, schedule_type); at most one CreditClaim per (return_id, credit_type); at most one EstimatedTaxPayment per (return_id, quarter)"
    error_id: ERR_DUPLICATE_CHILD
    http_status: 409
    applies_to: "POST .../schedules, POST .../credit-claims, POST /estimated-tax-payments"
  - priority: 9
    category: business_constraint
    check: "compute requires >= 1 IncomeDocument on the return"
    error_id: ERR_NO_INCOME_DOCUMENTS
    http_status: 409
    applies_to: "POST /tax-returns/{id}/compute"
  - priority: 10
    category: business_constraint
    check: "ITEMIZED deduction_method requires a Schedule A on the return at compute time"
    error_id: ERR_ITEMIZED_REQUIRES_SCHEDULE_A
    http_status: 409
    applies_to: "POST /tax-returns/{id}/compute"
  - priority: 11
    category: business_temporal
    check: "e-file requires the return's computed_at to reflect current children (no edit since last compute, i.e. status READY not DRAFT)"
    error_id: ERR_RETURN_NOT_COMPUTED
    http_status: 409
    applies_to: "POST /tax-returns/{id}/efile"
  - priority: 12
    category: business_constraint
    check: "OCC: expected_return_version equals the current TaxReturn.version on efile and amend creation"
    error_id: ERR_STALE_RETURN_VERSION
    http_status: 412
    applies_to: "POST /tax-returns/{id}/efile, POST /amended-returns"
  - priority: 13
    category: business_referential
    check: "a return may not be e-filed twice while a non-REJECTED EFilingSubmission exists for it"
    error_id: ERR_ALREADY_EFILED
    http_status: 409
    applies_to: "POST /tax-returns/{id}/efile"
  - priority: 14
    category: business_safety
    check: "1040X can only target an original return in FILED status; not DRAFT/READY/AMENDED"
    error_id: ERR_ORIGINAL_NOT_FILED
    http_status: 409
    applies_to: "POST /amended-returns, POST /amended-returns/{id}/file"
  - priority: 15
    category: business_temporal
    check: "new EstimatedTaxPayment's half-open income period [period_start, period_end) must not overlap any existing payment's [period_start, period_end) on the same return; touching at a shared endpoint (existing.period_end == new.period_start) is allowed (half-open, no overlap)"
    error_id: ERR_PAYMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /estimated-tax-payments"
  - priority: 16
    category: business_temporal
    check: "new AmendedReturn's closed correction window [correction_period_start, correction_period_end] must not overlap any existing amendment's closed window on the same original_return_id; closed-interval adjacency (touching endpoints, existing.end == new.start) DOES count as overlap (inclusive endpoints)"
    error_id: ERR_CORRECTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /amended-returns"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # --- Taxpayer ---
  - method: POST
    path: "/taxpayers"
    description: "register a taxpayer"
    roles: [Taxpayer, Preparer]
    code: 201
    input: ["email", "full_name", "filing_status", "prior_year_agi_cents?", "prior_year_total_tax_cents?"]
    output: Taxpayer
    side_effects: []
  - method: GET
    path: "/taxpayers/{id}"
    description: "fetch a taxpayer"
    roles: [Taxpayer, Preparer]
    code: 200
    input: []
    output: Taxpayer
    side_effects: []

  # --- TaxReturn root ---
  - method: POST
    path: "/tax-returns"
    description: "create a draft return for a taxpayer"
    roles: [Taxpayer, Preparer]
    code: 201
    input: ["taxpayer_id", "tax_year", "filing_status", "deduction_method?"]
    output: TaxReturn
    side_effects: ["create TaxReturn in DRAFT, version=1"]
  - method: GET
    path: "/tax-returns/{id}"
    description: "fetch a return with computed fields"
    roles: [Taxpayer, Preparer]
    code: 200
    input: []
    output: TaxReturn
    side_effects: []
  - method: GET
    path: "/tax-returns"
    description: "list returns, filterable by taxpayer"
    roles: [Taxpayer, Preparer]
    code: 200
    input: ["taxpayer_id?", "status?", "limit?", "offset?"]
    output: TaxReturn[]
    side_effects: []
  - method: PATCH
    path: "/tax-returns/{id}"
    description: "edit return-level fields (deduction_method, filing_status) or reopen REJECTED->DRAFT"
    roles: [Taxpayer, Preparer]
    code: 200
    input: ["deduction_method?", "filing_status?", "reopen?"]
    output: TaxReturn
    side_effects: ["if reopen=true and status=REJECTED set status=DRAFT", "increments TaxReturn.version by 1"]
  - method: POST
    path: "/tax-returns/{id}/compute"
    description: "compute the return: aggregate income, credits, tax, payments, balance"
    roles: [Taxpayer, Preparer]
    code: 200
    input: []
    output: TaxReturn
    side_effects:
      - "run compute_capital_gain, compute_credit_allowance, compute_return_tax"
      - "recompute Dependent.qualifies_ctc, Schedule.net_amount_cents"
      - "set computed_at; DRAFT->READY (or READY->READY)"
      - "increments TaxReturn.version by 1"
  - method: GET
    path: "/tax-returns/{id}/estimated-tax-status"
    description: "computed read: required estimated tax, on-time coverage, and underpayment penalty"
    roles: [Taxpayer, Preparer]
    code: 200
    input: []
    output: "{ required_annual_cents: integer, covered_cents: integer, shortfall_cents: integer, penalty_cents: integer, safe_harbor_used: string }"
    side_effects: ["run compute_underpayment_penalty (read-only projection)"]

  # --- IncomeDocument (sub-resource) ---
  - method: POST
    path: "/tax-returns/{id}/income-documents"
    description: "add an income document (W-2/1099) to a return"
    roles: [Taxpayer, Preparer]
    code: 201
    input: ["doc_type", "payer_name", "box_amount_cents", "federal_withholding_cents?", "qualified_dividends_cents?", "proceeds_cents?", "cost_basis_cents?", "holding_long_term?"]
    output: IncomeDocument
    side_effects: ["if return.status==READY reset to DRAFT (invalidates prior compute)", "increments TaxReturn.version by 1"]
  - method: GET
    path: "/tax-returns/{id}/income-documents"
    description: "list income documents for a return"
    roles: [Taxpayer, Preparer]
    code: 200
    input: []
    output: IncomeDocument[]
    side_effects: []

  # --- Schedule (sub-resource) ---
  - method: POST
    path: "/tax-returns/{id}/schedules"
    description: "add a schedule (A/B/C/D/E) to a return"
    roles: [Taxpayer, Preparer]
    code: 201
    input: ["schedule_type", "gross_amount_cents?", "expense_amount_cents?"]
    output: Schedule
    side_effects: ["if return.status==READY reset to DRAFT", "increments TaxReturn.version by 1"]
  - method: GET
    path: "/tax-returns/{id}/schedules"
    description: "list schedules for a return"
    roles: [Taxpayer, Preparer]
    code: 200
    input: []
    output: Schedule[]
    side_effects: []

  # --- Dependent (sub-resource) ---
  - method: POST
    path: "/tax-returns/{id}/dependents"
    description: "add a dependent to a return"
    roles: [Taxpayer, Preparer]
    code: 201
    input: ["full_name", "age_years", "is_student?"]
    output: Dependent
    side_effects: ["if return.status==READY reset to DRAFT", "increments TaxReturn.version by 1"]
  - method: GET
    path: "/tax-returns/{id}/dependents"
    description: "list dependents for a return"
    roles: [Taxpayer, Preparer]
    code: 200
    input: []
    output: Dependent[]
    side_effects: []

  # --- CreditClaim (sub-resource) ---
  - method: POST
    path: "/tax-returns/{id}/credit-claims"
    description: "claim a tax credit (EITC/CTC/AOTC) on a return"
    roles: [Taxpayer, Preparer]
    code: 201
    input: ["credit_type", "claimed_amount_cents?"]
    output: CreditClaim
    side_effects: ["if return.status==READY reset to DRAFT", "increments TaxReturn.version by 1"]
  - method: GET
    path: "/tax-returns/{id}/credit-claims"
    description: "list credit claims for a return"
    roles: [Taxpayer, Preparer]
    code: 200
    input: []
    output: CreditClaim[]
    side_effects: []

  # --- EstimatedTaxPayment (flat, FK to return) ---
  - method: POST
    path: "/estimated-tax-payments"
    description: "record a quarterly estimated tax payment"
    roles: [Taxpayer, Preparer]
    code: 201
    input: [return_id, quarter, amount_cents, paid_on, period_start, period_end]
    output: EstimatedTaxPayment
    side_effects: ["compute on_time from quarter due date vs paid_on", "increments TaxReturn.version by 1"]
  - method: GET
    path: "/estimated-tax-payments/{id}"
    description: "fetch a single estimated tax payment"
    roles: [Taxpayer, Preparer]
    code: 200
    input: []
    output: EstimatedTaxPayment
    side_effects: []
  - method: GET
    path: "/estimated-tax-payments"
    description: "list estimated tax payments, filterable by return"
    roles: [Taxpayer, Preparer]
    code: 200
    input: ["return_id?", "limit?", "offset?"]
    output: EstimatedTaxPayment[]
    side_effects: []

  # --- EFilingSubmission (flat, FK to return) ---
  - method: POST
    path: "/tax-returns/{id}/efile"
    description: "transmit the return for e-filing (Taxpayer signs)"
    roles: [Taxpayer]
    code: 201
    input: [signature_pin, expected_return_version]
    output: EFilingSubmission
    side_effects:
      - "create EFilingSubmission in TRANSMITTED with snapshot_balance_due_cents = return.balance_due_cents"
      - "increments TaxReturn.version by 1"
  - method: GET
    path: "/efilings/{id}"
    description: "fetch an e-file submission"
    roles: [Taxpayer, Preparer, IrsGateway]
    code: 200
    input: []
    output: EFilingSubmission
    side_effects: []
  - method: GET
    path: "/efilings"
    description: "list e-file submissions, filterable by return"
    roles: [Taxpayer, Preparer, IrsGateway]
    code: 200
    input: ["return_id?", "limit?", "offset?"]
    output: EFilingSubmission[]
    side_effects: []
  - method: POST
    path: "/efilings/{id}/acknowledge"
    description: "IRS gateway records an accept or reject acknowledgement"
    roles: [IrsGateway]
    code: 200
    input: [outcome, ack_code]
    output: EFilingSubmission
    side_effects:
      - "TRANSMITTED->ACCEPTED drives return READY->FILED; TRANSMITTED->REJECTED drives return READY->REJECTED"
      - "increments EFilingSubmission.version by 1"
      - "increments TaxReturn.version by 1"

  # --- AmendedReturn (1040X, self-referential to TaxReturn) ---
  - method: POST
    path: "/amended-returns"
    description: "create a 1040X amendment draft against a FILED return"
    roles: [Taxpayer]
    code: 201
    input: [original_return_id, taxpayer_id, corrected_balance_due_cents, correction_period_start, correction_period_end, expected_return_version]
    output: AmendedReturn
    side_effects: ["create AmendedReturn in DRAFT", "increments TaxReturn.version by 1"]
  - method: GET
    path: "/amended-returns/{id}"
    description: "fetch a 1040X amendment"
    roles: [Taxpayer, Preparer]
    code: 200
    input: []
    output: AmendedReturn
    side_effects: []
  - method: GET
    path: "/amended-returns"
    description: "list amendments, filterable by original return or taxpayer"
    roles: [Taxpayer, Preparer]
    code: 200
    input: ["original_return_id?", "taxpayer_id?", "limit?", "offset?"]
    output: AmendedReturn[]
    side_effects: []
  - method: POST
    path: "/amended-returns/{id}/file"
    description: "file the 1040X; computes delta and marks the original return AMENDED"
    roles: [Taxpayer]
    code: 200
    input: []
    output: AmendedReturn
    side_effects:
      - "run compute_amendment_delta"
      - "AmendedReturn DRAFT->FILED"
      - "original TaxReturn FILED->AMENDED"
      - "increments AmendedReturn.version by 1"
      - "increments TaxReturn.version by 1"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for this operation (e.g. Preparer attempts efile, IrsGateway attempts compute)"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Taxpayer X-User-ID is not the owner of the target return/amendment"
  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "path id does not resolve to a TaxReturn/EFilingSubmission/AmendedReturn"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "body FK (taxpayer_id, return_id, original_return_id) does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, enum out of range, or money constraint (>=0 / >0 / <=) violated"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_DUPLICATE_CHILD
    http: 409
    condition: "second Schedule of same type, CreditClaim of same type, or EstimatedTaxPayment of same quarter on a return"
  - id: ERR_NO_INCOME_DOCUMENTS
    http: 409
    condition: "compute attempted on a return with zero IncomeDocuments"
  - id: ERR_ITEMIZED_REQUIRES_SCHEDULE_A
    http: 409
    condition: "compute with deduction_method=ITEMIZED but no Schedule A present"
  - id: ERR_RETURN_NOT_COMPUTED
    http: 409
    condition: "efile attempted while return is DRAFT (computed_at stale or absent)"
  - id: ERR_STALE_RETURN_VERSION
    http: 412
    condition: "expected_return_version != current TaxReturn.version on efile or amend creation"
  - id: ERR_ALREADY_EFILED
    http: 409
    condition: "efile attempted while a non-REJECTED EFilingSubmission already exists for the return"
  - id: ERR_ORIGINAL_NOT_FILED
    http: 409
    condition: "1040X targets an original return whose status is not FILED"
  - id: ERR_PAYMENT_PERIOD_OVERLAP
    http: 409
    condition: "estimated tax payment's half-open income period overlaps an existing payment's period on the same return"
  - id: ERR_CORRECTION_WINDOW_OVERLAP
    http: 409
    condition: "1040X correction window (closed, inclusive endpoints) overlaps or touches an existing amendment's window on the same original return"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Taxpayer
    description: "the filer; owns returns, dependents, schedules, credits; the only role that may sign and transmit an e-file or file a 1040X"
    identity: "entity_backed:Taxpayer"
    exclusive_operations:
      - "POST /tax-returns/{id}/efile (sign and transmit)"
      - "POST /amended-returns (file 1040X)"
      - "POST /amended-returns/{id}/file"
    shared_operations:
      - "POST /tax-returns, PATCH /tax-returns/{id}, POST /tax-returns/{id}/compute"
      - "POST/GET income-documents, schedules, dependents, credit-claims"
      - "POST/GET estimated-tax-payments"
      - "GET tax-returns, efilings, amended-returns, taxpayers"
  - name: Preparer
    description: "paid preparer who may build and compute a return on the taxpayer's behalf but cannot sign/transmit the e-file nor file the 1040X (segregation of duties)"
    identity: "entity_backed:Taxpayer"
    exclusive_operations: []
    shared_operations:
      - "POST /tax-returns, PATCH /tax-returns/{id}, POST /tax-returns/{id}/compute"
      - "POST/GET income-documents, schedules, dependents, credit-claims"
      - "POST/GET estimated-tax-payments"
      - "GET tax-returns, efilings, amended-returns, taxpayers, estimated-tax-status"
    note: "Preparer's X-User-ID is the represented Taxpayer.id (entity_backed); ownership checks still apply, but the e-file/amend authorization steps are denied with ERR_FORBIDDEN_ROLE."
  - name: IrsGateway
    description: "external acknowledgement actor; records accept/reject on transmitted submissions only"
    identity: "opaque"
    exclusive_operations:
      - "POST /efilings/{id}/acknowledge"
    shared_operations:
      - "GET /efilings/{id}, GET /efilings"
