            - "The identical submit now returns 200 with Submission.${sub_a}.status == SUBMITTED, is_late == false and lateness_minutes == 0"
            - "ReportingWindow.${win_1}.total_head_reported == 0 (a SUBMITTED filing is not yet in the ledger; only acceptance books it)"

      - name: report_publish_requires_locked_window
        grounds:
          - validations[priority=48]
          - errors.ERR_WINDOW_NOT_LOCKED
          - state_machines.ReportingWindow.OPEN_to_LOCKED
          - state_machines.MarketReport.PUB_UNPUBLISHED_to_PUB_PUBLISHED
        dependency_pair: "MarketReport depends on ReportingWindow (its collection period)"
        distinguishing_aspect: |
          Entity pair MarketReport -> ReportingWindow, a different pair from
          Submission -> Registration. Here the dependency runs both ways in one call:
          publication is refused while the parent window is still OPEN, and the
          successful publication then pushes the parent LOCKED -> PUBLISHED. So the same
          foreign row is first a precondition and then a side-effect target.
