scenario: |
  Clinical Documentation Improvement (CDI): case prioritization by DRG/severity
  opportunity, query generation with compliant non-leading language, provider
  response tracking & escalation, CDI-coder DRG mismatch reconciliation,
  severity-of-illness/risk-of-mortality capture, denial-prevention documentation
  targets, provider education by pattern, impact reporting on case mix index.

domain_name: clinical-documentation-improvement
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: CDIProgram
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: facility_name, type: string, source: input, description: "Facility / hospital name" }
      - { name: program_code, type: string, source: input, description: "Unique program code; immutable after creation" }
      - { name: baseline_cmi, type: number, source: input, description: "Case mix index at program launch (>= 0.1000)" }
      - { name: current_period_index, type: integer, source: system, default: 0, description: "Logical clock; advanced by CDIManager via /clock/advance" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: EscalationPolicy
    parent: CDIProgram
    common_fields: true
    fields:
      - { name: cdi_program_id, type: string, source: input, description: "FK -> CDIProgram.id; owning program" }
      - { name: name, type: string, source: input, description: "Policy name, unique per program" }
      - { name: response_due_periods, type: integer, source: input, description: "Periods a provider has to respond before escalation stage 1 (>= 1)" }
      - { name: escalation_stage_periods, type: integer, source: input, description: "Periods per escalation stage (>= 1)" }
      - { name: max_escalation_stage, type: integer, source: input, description: "Highest stage; query auto-closes as NO_RESPONSE at next expiry (>= 1, <= 5)" }
      - { name: is_default, type: boolean, source: input, default: false, description: "Exactly one default per program; enforced on write" }

  - name: Provider
    parent: CDIProgram
    common_fields: true
    fields:
      - { name: cdi_program_id, type: string, source: input, description: "FK -> CDIProgram.id; owning program" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier, unique per program" }
      - { name: full_name, type: string, source: input, description: "Provider name" }
      - { name: specialty, type: string, source: input, description: "Specialty label used by education-pattern grouping" }
      - { name: education_score, type: integer, source: computed, default: 100, description: "Starts at 100; decremented by pattern penalties; drives education flags" }
      - { name: pattern_tally_json, type: object, source: computed, default: "{}", description: "Map of pattern_tag -> count of NON_COMPLIANT / NO_RESPONSE / CLINICALLY_UNSUPPORTED outcomes attributed to this provider" }
      - { name: education_flag, type: enum, source: computed, default: NONE, description: "NONE | WATCH | COACHING | INTENSIVE_REVIEW, derived from education_score bands" }

  - name: PatientCase
    parent: CDIProgram
    common_fields: true
    fields:
      - { name: cdi_program_id, type: string, source: input, description: "FK -> CDIProgram.id; owning program" }
      - { name: mrn, type: string, source: input, description: "Medical record number, unique per program" }
      - { name: admission_period, type: integer, source: input, description: "Logical period index of admission (>= 0)" }
      - { name: discharge_period, type: integer, source: input, description: "Logical period index of discharge (>= admission_period)" }
      - { name: attending_provider_id, type: string, source: input, description: "FK -> Provider.id; attending of record" }
      - { name: initial_drg_code, type: string, source: input, description: "DRG produced by HIM coder on initial coding" }
      - { name: initial_drg_weight, type: number, source: input, description: "Weight of initial DRG (>= 0.1000, 4-decimal)" }
      - { name: working_drg_code, type: string, source: system, description: "Current best-supported DRG; starts equal to initial_drg_code" }
      - { name: working_drg_weight, type: number, source: system, description: "Current best-supported DRG weight; starts equal to initial_drg_weight" }
      - { name: working_soi, type: integer, source: system, default: 1, description: "Severity-of-illness 1..4; starts at 1" }
      - { name: working_rom, type: integer, source: system, default: 1, description: "Risk-of-mortality 1..4; starts at 1" }
      - { name: priority_score, type: number, source: computed, description: "Computed by case_priority_score; higher = review sooner" }
      - { name: reconciliation_status, type: enum, source: system, default: NOT_REQUIRED, description: "NOT_REQUIRED | PENDING | RESOLVED_CDI_PREVAILS | RESOLVED_CODER_PREVAILS | ESCALATED" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_REVIEW | RECONCILED | FINAL_CODED | CLOSED" }

  - name: CDIReview
    parent: PatientCase
    common_fields: true
    fields:
      - { name: patient_case_id, type: string, source: input, description: "FK -> PatientCase.id; case under review" }
      - { name: cdi_program_id, type: string, source: system, description: "Denormalized from patient_case.cdi_program_id for filtering" }
      - { name: cdi_specialist_id, type: string, source: system, description: "X-User-ID of the CDISpecialist who opened the review" }
      - { name: opened_period, type: integer, source: system, description: "Period when review opened" }
      - { name: opportunity_weight_delta, type: number, source: computed, default: 0, description: "Signed DRG weight delta this review has realized (cumulative over finalized queries)" }
      - { name: opportunity_soi_delta, type: integer, source: computed, default: 0, description: "Signed SOI delta realized by this review" }
      - { name: opportunity_rom_delta, type: integer, source: computed, default: 0, description: "Signed ROM delta realized by this review" }
      - { name: closed_reason, type: enum, source: system, description: "NULL | OPPORTUNITY_CAPTURED | NO_OPPORTUNITY | SUPERSEDED | CASE_DISCHARGED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | ON_HOLD | CLOSED" }

  - name: CDIQuery
    parent: CDIReview
    common_fields: true
    fields:
      - { name: cdi_review_id, type: string, source: input, description: "FK -> CDIReview.id; owning review" }
      - { name: patient_case_id, type: string, source: system, description: "Denormalized from cdi_review.patient_case_id for provider inbox filtering" }
      - { name: cdi_program_id, type: string, source: system, description: "Denormalized from patient_case.cdi_program_id for filtering" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; query recipient" }
      - { name: escalation_policy_id, type: string, source: input, description: "FK -> EscalationPolicy.id; drives due/escalation windows" }
      - { name: query_text, type: string, source: input, description: "Free-text clinical query; must pass non-leading lint" }
      - { name: clinical_indicators, type: array, source: input, description: "List of objective indicator strings cited in the query" }
      - { name: proposed_drg_code, type: string, source: input, description: "DRG the CDI specialist believes is supported" }
      - { name: proposed_drg_weight, type: number, source: input, description: "Weight of proposed DRG (>= 0.1000, 4-decimal)" }
      - { name: proposed_soi, type: integer, source: input, description: "Proposed SOI 1..4" }
      - { name: proposed_rom, type: integer, source: input, description: "Proposed ROM 1..4" }
      - { name: compliant_language, type: boolean, source: computed, description: "Set by non-leading lint at submit; stored for audit" }
      - { name: lint_findings, type: array, source: computed, description: "List of lint finding codes recorded at submit time" }
      - { name: sent_period, type: integer, source: system, description: "Period query transitioned DRAFT -> SENT" }
      - { name: due_period, type: integer, source: system, description: "= sent_period + policy.response_due_periods" }
      - { name: escalation_stage, type: integer, source: system, default: 0, description: "0 = not escalated; increments on each escalation; capped by policy" }
      - { name: last_escalated_period, type: integer, source: system, description: "Period of most recent escalation (null when stage=0)" }
      - { name: response_id, type: string, source: system, description: "Set to the QueryResponse.id once a response is recorded (null before); not a true FK because response is created after the query" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SENT | RESPONDED | ESCALATED | NO_RESPONSE | CANCELLED" }

  - name: QueryResponse
    parent: CDIQuery
    common_fields: true
    fields:
      - { name: cdi_query_id, type: string, source: system, description: "FK -> CDIQuery.id; owning query (1:1)" }
      - { name: patient_case_id, type: string, source: system, description: "Denormalized from cdi_query.patient_case_id" }
      - { name: responder_provider_id, type: string, source: system, description: "X-User-ID of the responding Provider; MUST equal query.provider_id" }
      - { name: response_type, type: enum, source: input, description: "AGREE | DISAGREE | CLARIFICATION_REQUESTED | CLINICALLY_UNSUPPORTED" }
      - { name: response_text, type: string, source: input, description: "Free-text provider response (>= 1 char)" }
      - { name: responded_period, type: integer, source: system, description: "Period at record time" }
      - { name: was_overdue, type: boolean, source: computed, description: "true iff responded_period > query.due_period" }

  - name: ReconciliationEvent
    parent: PatientCase
    common_fields: true
    fields:
      - { name: patient_case_id, type: string, source: input, description: "FK -> PatientCase.id; case in mismatch" }
      - { name: cdi_program_id, type: string, source: system, description: "Denormalized from patient_case.cdi_program_id" }
      - { name: coder_user_id, type: string, source: system, description: "X-User-ID of the HIMCoder whose final coding conflicts" }
      - { name: coder_drg_code, type: string, source: input, description: "DRG asserted by the coder at final coding" }
      - { name: coder_drg_weight, type: number, source: input, description: "Coder's DRG weight" }
      - { name: cdi_drg_code, type: string, source: system, description: "Snapshot of case.working_drg_code at event creation" }
      - { name: cdi_drg_weight, type: number, source: system, description: "Snapshot of case.working_drg_weight at event creation" }
      - { name: resolution_note, type: string, source: system, description: "Recorded on resolve; null until then" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RESOLVED_CDI_PREVAILS | RESOLVED_CODER_PREVAILS | ESCALATED" }

  - name: DenialRiskTarget
    parent: CDIProgram
    common_fields: true
    fields:
      - { name: cdi_program_id, type: string, source: input, description: "FK -> CDIProgram.id; owning program" }
      - { name: drg_code, type: string, source: input, description: "DRG this target applies to" }
      - { name: required_evidence_tags, type: array, source: input, description: "Tags that must ALL appear in the union of clinical_indicators across the case's AGREEd queries before final coding" }
      - { name: severity_floor, type: integer, source: input, description: "Minimum working_soi required at final coding for this DRG (1..4)" }
      - { name: active_from_period, type: integer, source: input, description: "First period (inclusive) this target applies" }
      - { name: active_to_period, type: integer, source: input, description: "Last period (inclusive) this target applies; must be >= active_from_period" }

  - name: ProviderEducationEvent
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; recipient" }
      - { name: cdi_program_id, type: string, source: system, description: "Denormalized from provider.cdi_program_id" }
      - { name: pattern_tag, type: enum, source: input, description: "LEADING_LANGUAGE | NO_RESPONSE_PATTERN | CLINICALLY_UNSUPPORTED_PATTERN | OVERDUE_PATTERN" }
      - { name: points_deducted, type: integer, source: input, description: "Points subtracted from education_score (1..25)" }
      - { name: source_query_id, type: string, source: input, description: "Query whose outcome triggered this event; for manual events may be any CDIQuery id within the program" }
      - { name: note, type: string, source: input, description: "Free-text education note" }
      - { name: recorded_period, type: integer, source: system, description: "Period when event was recorded" }

  - name: CMISnapshot
    parent: CDIProgram
    common_fields: true
    fields:
      - { name: cdi_program_id, type: string, source: system, description: "FK -> CDIProgram.id; owning program" }
      - { name: as_of_period, type: integer, source: system, description: "Period the snapshot was taken" }
      - { name: case_count, type: integer, source: computed, description: "Cases included (status in RECONCILED | FINAL_CODED | CLOSED)" }
      - { name: unadjusted_cmi, type: number, source: computed, description: "Mean of initial_drg_weight across included cases" }
      - { name: adjusted_cmi, type: number, source: computed, description: "Mean of working_drg_weight across included cases" }
      - { name: cdi_lift, type: number, source: computed, description: "adjusted_cmi - unadjusted_cmi" }
      - { name: denial_target_misses, type: integer, source: computed, description: "Included cases that violated >= 1 active DenialRiskTarget at finalize time" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: CDIProgram
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /api/cdi-programs/{programId}/suspend
        actor: CDIManager
        preconditions:
          - "Program in ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "increments CDIProgram.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /api/cdi-programs/{programId}/resume
        actor: CDIManager
        preconditions:
          - "Program in SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "increments CDIProgram.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: POST /api/cdi-programs/{programId}/close
        actor: CDIManager
        preconditions:
          - "Program in ACTIVE or SUSPENDED (ERR_INVALID_STATE)"
          - "No PatientCase with status in {OPEN, UNDER_REVIEW, RECONCILED} (ERR_OPEN_CASES_REMAIN)"
        side_effects:
          - "increments CDIProgram.version by 1"

      - from: SUSPENDED
        to: CLOSED
        trigger: POST /api/cdi-programs/{programId}/close
        actor: CDIManager
        preconditions:
          - "Program in ACTIVE or SUSPENDED (ERR_INVALID_STATE)"
          - "No PatientCase with status in {OPEN, UNDER_REVIEW, RECONCILED} (ERR_OPEN_CASES_REMAIN)"
        side_effects:
          - "increments CDIProgram.version by 1"

  - entity: PatientCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "system (auto when first CDIReview transitions DRAFT -> ACTIVE on this case)"
        actor: system
        preconditions: []
        side_effects:
          - "PatientCase.version increments by 1 (cascaded from CDIReview activation)"

      - from: UNDER_REVIEW
        to: RECONCILED
        trigger: "system (auto when the case's only OPEN ReconciliationEvent resolves, and no other OPEN ReconciliationEvents remain)"
        actor: system
        preconditions:
          - "All ReconciliationEvents for the case are in {RESOLVED_CDI_PREVAILS, RESOLVED_CODER_PREVAILS, ESCALATED}"
        side_effects:
          - "PatientCase.version increments by 1"

      - from: UNDER_REVIEW
        to: OPEN
        trigger: "system (auto when last ACTIVE CDIReview on this case closes AND no OPEN ReconciliationEvent exists)"
        actor: system
        preconditions: []
        side_effects:
          - "PatientCase.version increments by 1"

      - from: OPEN
        to: FINAL_CODED
        trigger: POST /api/patient-cases/{caseId}/finalize-coding
        actor: HIMCoder
        preconditions:
          - "Case status in {OPEN, UNDER_REVIEW, RECONCILED} (ERR_INVALID_STATE)"
          - "current_period_index >= discharge_period (ERR_CASE_NOT_DISCHARGED)"
          - "No CDIReview in {DRAFT, ACTIVE, ON_HOLD} for this case (ERR_OPEN_REVIEW_EXISTS)"
          - "No CDIQuery in {SENT, ESCALATED} for this case (ERR_UNRESOLVED_QUERY_EXISTS)"
          - "If coder_drg_code != working_drg_code OR coder_drg_weight != working_drg_weight: a ReconciliationEvent is created instead and finalization is blocked (ERR_DRG_MISMATCH)"
          - "For every DenialRiskTarget where target.drg_code == working_drg_code AND active window contains current_period_index: every required_evidence_tag must appear in the union of clinical_indicators over the case's RESPONDED-with-AGREE queries (ERR_DENIAL_TARGET_UNMET)"
          - "For every such target: working_soi >= target.severity_floor (ERR_DENIAL_TARGET_UNMET)"
        side_effects:
          - "status -> FINAL_CODED"
          - "reconciliation_status unchanged (already NOT_REQUIRED or resolved earlier)"
          - "increments PatientCase.version by 1"

      - from: UNDER_REVIEW
        to: FINAL_CODED
        trigger: POST /api/patient-cases/{caseId}/finalize-coding
        actor: HIMCoder
        preconditions: ["(same as OPEN -> FINAL_CODED)"]
        side_effects: ["(same as OPEN -> FINAL_CODED)"]

      - from: RECONCILED
        to: FINAL_CODED
        trigger: POST /api/patient-cases/{caseId}/finalize-coding
        actor: HIMCoder
        preconditions: ["(same as OPEN -> FINAL_CODED)"]
        side_effects: ["(same as OPEN -> FINAL_CODED)"]

      - from: FINAL_CODED
        to: CLOSED
        trigger: POST /api/patient-cases/{caseId}/close
        actor: CDIManager
        preconditions:
          - "Case status == FINAL_CODED (ERR_INVALID_STATE)"
        side_effects:
          - "increments PatientCase.version by 1"

  - entity: CDIReview
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /api/cdi-reviews/{reviewId}/activate
        actor: CDISpecialist
        preconditions:
          - "Review in DRAFT (ERR_INVALID_STATE)"
          - "Parent case in {OPEN, UNDER_REVIEW} (ERR_CASE_NOT_REVIEWABLE)"
          - "Program in ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "No other CDIReview in ACTIVE for the same case (ERR_REVIEW_ALREADY_ACTIVE)"
        side_effects:
          - "If case.status == OPEN: case -> UNDER_REVIEW (cascade up)"
          - "increments CDIReview.version by 1"

      - from: ACTIVE
        to: ON_HOLD
        trigger: POST /api/cdi-reviews/{reviewId}/hold
        actor: CDISpecialist
        preconditions:
          - "Review in ACTIVE (ERR_INVALID_STATE)"
          - "No query of this review in SENT or ESCALATED (ERR_UNRESOLVED_QUERY_EXISTS)"
        side_effects:
          - "increments CDIReview.version by 1"

      - from: ON_HOLD
        to: ACTIVE
        trigger: POST /api/cdi-reviews/{reviewId}/resume
        actor: CDISpecialist
        preconditions:
          - "Review in ON_HOLD (ERR_INVALID_STATE)"
          - "Case in {OPEN, UNDER_REVIEW} (ERR_CASE_NOT_REVIEWABLE)"
          - "No other ACTIVE review on the same case (ERR_REVIEW_ALREADY_ACTIVE)"
        side_effects:
          - "increments CDIReview.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: POST /api/cdi-reviews/{reviewId}/close
        actor: CDISpecialist
        preconditions:
          - "Review in {ACTIVE, ON_HOLD} (ERR_INVALID_STATE)"
          - "No query of this review in {DRAFT, SENT, ESCALATED} (ERR_UNRESOLVED_QUERY_EXISTS)"
          - "closed_reason in {OPPORTUNITY_CAPTURED, NO_OPPORTUNITY, CASE_DISCHARGED}"
        side_effects:
          - "If case has no other ACTIVE review AND no OPEN ReconciliationEvent: case -> OPEN (cascade up)"
          - "increments CDIReview.version by 1"

      - from: ON_HOLD
        to: CLOSED
        trigger: POST /api/cdi-reviews/{reviewId}/close
        actor: CDISpecialist
        preconditions: ["(same as ACTIVE -> CLOSED)"]
        side_effects: ["(same as ACTIVE -> CLOSED)"]

  - entity: CDIQuery
    initial_state: DRAFT
    terminal_states: [RESPONDED, NO_RESPONSE, CANCELLED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: POST /api/cdi-queries/{queryId}/send
        actor: CDISpecialist
        preconditions:
          - "Query in DRAFT (ERR_INVALID_STATE)"
          - "Parent review in ACTIVE (ERR_REVIEW_NOT_ACTIVE)"
          - "Program in ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "Non-leading lint MUST pass on query_text + clinical_indicators (ERR_LEADING_LANGUAGE); sets compliant_language and lint_findings"
          - "Provider must belong to the same program as the review's case (ERR_PROVIDER_NOT_IN_PROGRAM)"
        side_effects:
          - "sent_period = program.current_period_index"
          - "due_period = sent_period + policy.response_due_periods"
          - "increments CDIQuery.version by 1"

      - from: SENT
        to: RESPONDED
        trigger: POST /api/cdi-queries/{id}/responses
        actor: Provider
        preconditions:
          - "Query in {SENT, ESCALATED} (ERR_INVALID_STATE)"
          - "X-User-ID == query.provider_id (ERR_NOT_QUERY_RECIPIENT) — segregation of duties: only the addressed provider may respond"
          - "responder's education_flag != INTENSIVE_REVIEW OR response_type == CLARIFICATION_REQUESTED (ERR_PROVIDER_UNDER_INTENSIVE_REVIEW)"
        side_effects:
          - "creates QueryResponse (response_id linked)"
          - "if response_type == AGREE: case.working_drg_code = proposed_drg_code; case.working_drg_weight = proposed_drg_weight; case.working_soi = proposed_soi; case.working_rom = proposed_rom; review.opportunity_*_delta recomputed"
          - "if response_type == AGREE: case.priority_score recomputed"
          - "if response_type == CLINICALLY_UNSUPPORTED: create ProviderEducationEvent(pattern_tag=CLINICALLY_UNSUPPORTED_PATTERN, points_deducted=4) on responder (cascade to Provider)"
          - "if was_overdue: create ProviderEducationEvent(pattern_tag=OVERDUE_PATTERN, points_deducted=2) on responder"
          - "increments CDIQuery.version by 1"

      - from: ESCALATED
        to: RESPONDED
        trigger: POST /api/cdi-queries/{id}/responses
        actor: Provider
        preconditions: ["(same as SENT -> RESPONDED)"]
        side_effects: ["(same as SENT -> RESPONDED)"]

      - from: SENT
        to: ESCALATED
        trigger: "system (auto on POST /api/cdi-programs/{programId}/clock/advance crossing due_period + escalation_stage * escalation_stage_periods, while stage < policy.max_escalation_stage)"
        actor: system
        preconditions:
          - "Query in {SENT, ESCALATED}"
          - "current_period_index > due_period + escalation_stage * escalation_stage_periods"
          - "escalation_stage < policy.max_escalation_stage"
        side_effects:
          - "escalation_stage += 1"
          - "last_escalated_period = current_period_index"
          - "create ProviderEducationEvent(pattern_tag=NO_RESPONSE_PATTERN, points_deducted=3) on query.provider_id"
          - "increments CDIQuery.version by 1"

      - from: ESCALATED
        to: ESCALATED
        trigger: "system (auto on clock advance, as above)"
        actor: system
        preconditions: ["(same as SENT -> ESCALATED)"]
        side_effects: ["(same as SENT -> ESCALATED)"]

      - from: SENT
        to: NO_RESPONSE
        trigger: "system (auto on clock advance when stage == policy.max_escalation_stage and current_period_index > due_period + max_escalation_stage * escalation_stage_periods)"
        actor: system
        preconditions:
          - "Query in {SENT, ESCALATED}"
          - "escalation_stage == policy.max_escalation_stage"
          - "current_period_index > due_period + max_escalation_stage * escalation_stage_periods"
        side_effects:
          - "create ProviderEducationEvent(pattern_tag=NO_RESPONSE_PATTERN, points_deducted=6) on query.provider_id"
          - "review.opportunity_*_delta unchanged"
          - "increments CDIQuery.version by 1"

      - from: ESCALATED
        to: NO_RESPONSE
        trigger: "system (auto on clock advance, as above)"
        actor: system
        preconditions: ["(same as SENT -> NO_RESPONSE)"]
        side_effects: ["(same as SENT -> NO_RESPONSE)"]

      - from: DRAFT
        to: CANCELLED
        trigger: POST /api/cdi-queries/{queryId}/cancel
        actor: CDISpecialist
        preconditions:
          - "Query in {DRAFT, SENT, ESCALATED} (ERR_INVALID_STATE)"
        side_effects:
          - "increments CDIQuery.version by 1"

      - from: SENT
        to: CANCELLED
        trigger: POST /api/cdi-queries/{queryId}/cancel
        actor: CDISpecialist
        preconditions: ["(same as DRAFT -> CANCELLED)"]
        side_effects:
          - "If was SENT or ESCALATED: no education event is created; no score change"
          - "increments CDIQuery.version by 1"

      - from: ESCALATED
        to: CANCELLED
        trigger: POST /api/cdi-queries/{queryId}/cancel
        actor: CDISpecialist
        preconditions: ["(same as DRAFT -> CANCELLED)"]
        side_effects: ["(same as SENT -> CANCELLED)"]

  - entity: ReconciliationEvent
    initial_state: OPEN
    terminal_states: [RESOLVED_CDI_PREVAILS, RESOLVED_CODER_PREVAILS, ESCALATED]
    transitions:
      - from: OPEN
        to: RESOLVED_CDI_PREVAILS
        trigger: POST /api/reconciliation-events/{eventId}/resolve
        actor: CDIManager
        preconditions:
          - "Event in OPEN (ERR_INVALID_STATE)"
          - "outcome in {CDI_PREVAILS, CODER_PREVAILS}"
          - "resolution_note non-empty"
        side_effects:
          - "case.reconciliation_status -> RESOLVED_CDI_PREVAILS"
          - "case.working_drg_* left unchanged (CDI values win)"
          - "If no other OPEN ReconciliationEvent on the case: case.status -> RECONCILED (cascade up)"
          - "increments ReconciliationEvent.version by 1"

      - from: OPEN
        to: RESOLVED_CODER_PREVAILS
        trigger: POST /api/reconciliation-events/{eventId}/resolve
        actor: CDIManager
        preconditions: ["(same as OPEN -> RESOLVED_CDI_PREVAILS)"]
        side_effects:
          - "case.reconciliation_status -> RESOLVED_CODER_PREVAILS"
          - "case.working_drg_code = coder_drg_code; case.working_drg_weight = coder_drg_weight (coder values win)"
          - "case.priority_score recomputed"
          - "If no other OPEN ReconciliationEvent on the case: case.status -> RECONCILED (cascade up)"
          - "increments ReconciliationEvent.version by 1"

      - from: OPEN
        to: ESCALATED
        trigger: POST /api/reconciliation-events/{eventId}/escalate
        actor: CDIManager
        preconditions:
          - "Event in OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "case.reconciliation_status -> ESCALATED"
          - "If no other OPEN ReconciliationEvent on the case: case.status -> RECONCILED (cascade up)"
          - "increments ReconciliationEvent.version by 1"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: cdi-review-close-stale-version
    parent_entity: CDIReview
    write_endpoint: "POST /api/cdi-reviews/{reviewId}/close"
    occ_field: "expected_review_version"
    description: |
      Closing a CDIReview whose version has advanced since the caller last
      observed it is rejected with ERR_STALE_VERSION (412). This captures the
      case where a side effect (e.g., a query response that mutated
      opportunity_*_delta, or an auto-escalation that bumped the review's
      child query) has legitimately moved the review forward; the closer's
      view is stale and they must re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: patient-case-finalize-stale-version
    parent_entity: PatientCase
    write_endpoint: "POST /api/patient-cases/{caseId}/finalize-coding"
    occ_field: "expected_case_version"
    description: |
      Finalizing a PatientCase whose version has advanced since the caller
      last observed it is rejected with ERR_STALE_VERSION (412). A prior
      query response (AGREE) or a reconciliation resolution may have updated
      working_drg_* fields; finalizing against a stale snapshot would
      silently overwrite newer CDI decisions.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: query-send-stale-version
    parent_entity: CDIQuery
    write_endpoint: "POST /api/cdi-queries/{queryId}/send"
    occ_field: "expected_query_version"
    description: |
      Sending a CDIQuery whose version has advanced since the caller last
      observed it is rejected with ERR_STALE_VERSION (412). Edits to
      query_text or clinical_indicators that occurred after the caller's
      last read invalidate the caller's lint assumptions.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: case_priority_score
    trigger: "PatientCase creation; any change to initial_drg_weight, working_drg_weight, working_soi, working_rom, admission/discharge period, or clock advance that crosses discharge_period"
    algorithm: weighted_scoring
    formula: |
      # Tier 1 — base opportunity (provisional vs residual variant)
      base_opportunity = max(0, working_drg_weight - initial_drg_weight)

      # Tier 2 — acuity multiplier (non-linear in SOI/ROM)
      acuity_multiplier =
          1.00                              if working_soi == 1 and working_rom == 1
          1.10                              if working_soi == 2 and working_rom <= 2
          1.25                              if working_soi == 3 or  working_rom == 3
          1.50                              if working_soi == 4 or  working_rom == 4

      # Tier 3 — length-of-stay pressure (discharged cases prioritized)
      los_factor =
          1.30                              if current_period_index >  discharge_period
          1.15                              if current_period_index == discharge_period
          1.00                              if current_period_index <  discharge_period

      priority_score = round(base_opportunity * acuity_multiplier * los_factor * 100, 4)
      # round to 4 decimal places, round_half_up
    input_set: "All PatientCase rows in {OPEN, UNDER_REVIEW, RECONCILED}; excluded once FINAL_CODED or CLOSED"
    constants:
      SOI_ROM_TIER_2_MULT: 1.10
      SOI_ROM_TIER_3_MULT: 1.25
      SOI_ROM_TIER_4_MULT: 1.50
      LOS_POST_DISCHARGE: 1.30
      LOS_ON_DISCHARGE: 1.15
      LOS_PRE_DISCHARGE: 1.00
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Case is OPEN or UNDER_REVIEW and at least one query is in {DRAFT, SENT, ESCALATED}"
        difference: "base_opportunity uses max(working_drg_weight, max(proposed_drg_weight across open queries)) - initial_drg_weight; optimistic — treats open proposals as achievable"
      - name: residual
        when: "Case has no open queries OR is RECONCILED"
        difference: "base_opportunity uses working_drg_weight - initial_drg_weight only; pessimistic — only realized deltas count"

  - name: cmi_snapshot_computation
    trigger: "POST /api/cdi-programs/{id}/cmi-snapshots"
    algorithm: aggregation
    formula: |
      included = cases where status in {RECONCILED, FINAL_CODED, CLOSED}
                 AND discharge_period <= as_of_period
      case_count      = |included|
      unadjusted_cmi  = round( sum(initial_drg_weight) / case_count, 4 )
      adjusted_cmi    = round( sum(working_drg_weight) / case_count, 4 )
      cdi_lift        = round( adjusted_cmi - unadjusted_cmi, 4 )
      # Rounding order: round each ratio FIRST, then subtract.
      # If case_count == 0, all four numeric fields are 0.0000 (no division).
    input_set: "Cases belonging to the snapshot's program with status in {RECONCILED, FINAL_CODED, CLOSED} AND discharge_period <= as_of_period"
    constants:
      DECIMALS: 4
    precision: "4 decimal places, round_half_up; ratio rounding happens before subtraction"
    variants:
      - name: unadjusted
        when: "always reported alongside adjusted"
        difference: "uses initial_drg_weight (coder's first-pass DRG, before any CDI query)"
      - name: adjusted
        when: "always reported alongside unadjusted"
        difference: "uses working_drg_weight (post-CDI DRG)"

  - name: denial_target_miss_count
    trigger: "POST /api/cdi-programs/{id}/cmi-snapshots"
    algorithm: aggregation
    formula: |
      For each case included in the snapshot (per cmi_snapshot_computation):
        targets = DenialRiskTarget where target.drg_code == case.working_drg_code
                  AND target.active_from_period <= case.finalized_period <= target.active_to_period
        agreed_indicators = union of clinical_indicators over the case's
                            queries with status == RESPONDED AND response_type == AGREE
        miss_if = any(target where
                        not all(tag in agreed_indicators for tag in target.required_evidence_tags)
                        OR case.working_soi < target.severity_floor)
        if miss_if: denial_target_misses += 1
      # Cases finalized BEFORE the target's window or AFTER its window do not
      # count against that target (window is checked against finalized_period).
    input_set: "Same as cmi_snapshot_computation.input_set"
    constants: {}
    precision: "integer count"

  - name: provider_education_band
    trigger: "ProviderEducationEvent creation (education_score recomputed); also read on every CDIQuery send to gate by education_flag"
    algorithm: threshold
    formula: |
      education_score = max(0, 100 - sum(points_deducted across all ProviderEducationEvents for this provider))
      education_flag =
          NONE              if education_score >= 85
          WATCH             if 70 <= education_score <  85
          COACHING          if 50 <= education_score <  70
          INTENSIVE_REVIEW  if education_score <  50
      # Boundary precision: 85 is NONE (>=85); 84 is WATCH. 70 is WATCH; 69 is COACHING. 50 is COACHING; 49 is INTENSIVE_REVIEW.
    input_set: "All ProviderEducationEvents for a single provider, regardless of age"
    constants:
      NONE_FLOOR: 85
      WATCH_FLOOR: 70
      COACHING_FLOOR: 50
    precision: "integer points"

  - name: non_leading_lint
    trigger: "CDIQuery DRAFT -> SENT transition"
    algorithm: pattern_matching
    formula: |
      For each phrase P in LEADING_PHRASES (case-insensitive):
        if P appears in query_text: record finding LEADING_PHRASE(P)
      If proposed_drg_code appears as a literal token inside query_text:
        record finding ANSWER_IN_QUESTION
      If clinical_indicators is empty:
        record finding NO_INDICATORS
      compliant_language = (lint_findings is empty)
      If any finding is present: transition fails with ERR_LEADING_LANGUAGE.
    input_set: "The candidate query_text + clinical_indicators + proposed_drg_code"
    constants:
      LEADING_PHRASES:
        - "do you agree that"
        - "isn't it true"
        - "clearly indicates"
        - "should be coded as"
        - "please document"
        - "the patient has"
        - "confirm the diagnosis of"
    precision: "boolean + findings list"

  - name: review_opportunity_deltas
    trigger: "QueryResponse created with response_type == AGREE; QueryResponse with CLINICALLY_UNSUPPORTED does not change review deltas (case was not updated)"
    algorithm: aggregation
    formula: |
      # For the owning review, computed cumulatively:
      opportunity_weight_delta =
          sum over queries in review where status == RESPONDED AND response_type == AGREE
          of (proposed_drg_weight - case.initial_drg_weight)
      opportunity_soi_delta =
          sum over same set of (proposed_soi - 1)   # baseline SOI is 1 at case creation
      opportunity_rom_delta =
          sum over same set of (proposed_rom - 1)
      # NOTE: deltas are NOT recomputed when a later AGREE overwrites an earlier one;
      # they are cumulative realizations. Two AGREEs on the same case stack.
    input_set: "CDIQuery rows belonging to the review, filtered to status == RESPONDED AND response_type == AGREE"
    constants: {}
    precision: "weight: 4 decimal places; soi/rom: integer"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role in {CDISpecialist, Provider, HIMCoder, CDIManager, ComplianceAuditor, SystemAdmin}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path IDs resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: state
    check: "Program in ACTIVE state (for write operations on resources belonging to that program)"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "all POST/PUT/PATCH endpoints under /api except /api/cdi-programs/{programId}/clock/advance, /suspend, /resume, /close, and /api/_clock/*"

  - priority: 5
    category: state
    check: "Target resource in correct state for the requested transition (per §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Query lint: non-leading language, indicators non-empty, no answer-in-question"
    error_id: ERR_LEADING_LANGUAGE
    http_status: 422
    applies_to: "POST /api/cdi-queries/{queryId}/send"

  - priority: 7
    category: business_referential
    check: "Provider referenced by query.provider_id belongs to same CDIProgram as the review's case"
    error_id: ERR_PROVIDER_NOT_IN_PROGRAM
    http_status: 422
    applies_to: "POST /api/cdi-queries (create), POST /api/cdi-queries/{queryId}/send"

  - priority: 8
    category: business_constraint
    check: "Only one ACTIVE CDIReview per PatientCase at any moment"
    error_id: ERR_REVIEW_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /api/cdi-reviews/{reviewId}/activate, POST /api/cdi-reviews/{reviewId}/resume"

  - priority: 9
    category: business_constraint
    check: "Review closure blocked while any of its queries is in {DRAFT, SENT, ESCALATED}"
    error_id: ERR_UNRESOLVED_QUERY_EXISTS
    http_status: 409
    applies_to: "POST /api/cdi-reviews/{reviewId}/close, POST /api/cdi-reviews/{reviewId}/hold, POST /api/patient-cases/{caseId}/finalize-coding"

  - priority: 10
    category: business_temporal
    check: "Finalize-coding requires current_period_index >= case.discharge_period"
    error_id: ERR_CASE_NOT_DISCHARGED
    http_status: 422
    applies_to: "POST /api/patient-cases/{caseId}/finalize-coding"

  - priority: 11
    category: business_fiscal
    check: "Coder DRG must equal case.working_drg_* (else ReconciliationEvent created and finalize rejected)"
    error_id: ERR_DRG_MISMATCH
    http_status: 409
    applies_to: "POST /api/patient-cases/{caseId}/finalize-coding"

  - priority: 12
    category: business_safety
    check: "All active DenialRiskTargets for working_drg_code must be satisfied (evidence tags + severity_floor)"
    error_id: ERR_DENIAL_TARGET_UNMET
    http_status: 422
    applies_to: "POST /api/patient-cases/{caseId}/finalize-coding"

  - priority: 13
    category: business_constraint
    check: "Only the addressed provider may respond (X-User-ID == query.provider_id)"
    error_id: ERR_NOT_QUERY_RECIPIENT
    http_status: 403
    applies_to: "POST /api/cdi-queries/{id}/responses"

  - priority: 14
    category: business_safety
    check: "Provider under INTENSIVE_REVIEW may only submit CLARIFICATION_REQUESTED responses"
    error_id: ERR_PROVIDER_UNDER_INTENSIVE_REVIEW
    http_status: 403
    applies_to: "POST /api/cdi-queries/{id}/responses"

  - priority: 15
    category: business_constraint
    check: "Exactly one default EscalationPolicy per program; setting is_default=true on another clears the previous"
    error_id: ERR_DEFAULT_POLICY_CONFLICT
    http_status: 409
    applies_to: "POST /api/escalation-policies, PUT /api/escalation-policies/{policyId}"

  - priority: 16
    category: business_constraint
    check: "Program close blocked while any case is in {OPEN, UNDER_REVIEW, RECONCILED}"
    error_id: ERR_OPEN_CASES_REMAIN
    http_status: 409
    applies_to: "POST /api/cdi-programs/{programId}/close"

  - priority: 17
    category: business_temporal
    check: "active_to_period >= active_from_period on DenialRiskTarget"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /api/denial-risk-targets"

  - priority: 18
    category: business_referential
    check: "QueryResponse.responder (X-User-ID) must equal query.provider_id (segregation of duties: CDI specialist cannot self-respond)"
    error_id: ERR_NOT_QUERY_RECIPIENT
    http_status: 403
    applies_to: "POST /api/cdi-queries/{id}/responses"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- CDI Programs ---
  - method: POST
    path: "/api/cdi-programs"
    description: "Create a CDI program"
    roles: [CDIManager]
    code: 201
    input: [facility_name, program_code, baseline_cmi]
    output: CDIProgram
    side_effects: ["current_period_index = 0", "status = ACTIVE", "version = 1"]

  - method: GET
    path: "/api/cdi-programs"
    description: "List CDI programs (paginated)"
    roles: [CDIManager, CDISpecialist, HIMCoder, Provider, ComplianceAuditor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CDIProgram[]"
    side_effects: []

  - method: GET
    path: "/api/cdi-programs/{programId}"
    description: "Get a CDI program"
    roles: [CDIManager, CDISpecialist, HIMCoder, Provider, ComplianceAuditor, SystemAdmin]
    code: 200
    input: []
    output: CDIProgram
    side_effects: []

  - method: POST
    path: "/api/cdi-programs/{programId}/suspend"
    description: "Suspend a program (ACTIVE -> SUSPENDED)"
    roles: [CDIManager]
    code: 200
    input: []
    output: CDIProgram
    side_effects: ["status -> SUSPENDED", "increments CDIProgram.version by 1"]

  - method: POST
    path: "/api/cdi-programs/{programId}/resume"
    description: "Resume a program (SUSPENDED -> ACTIVE)"
    roles: [CDIManager]
    code: 200
    input: []
    output: CDIProgram
    side_effects: ["status -> ACTIVE", "increments CDIProgram.version by 1"]

  - method: POST
    path: "/api/cdi-programs/{programId}/close"
    description: "Close a program"
    roles: [CDIManager]
    code: 200
    input: []
    output: CDIProgram
    side_effects: ["status -> CLOSED", "increments CDIProgram.version by 1"]

  - method: POST
    path: "/api/cdi-programs/{programId}/clock/advance"
    description: "Advance logical clock by N periods; triggers auto-escalation / NO_RESPONSE / los_factor recompute; server startup default time is 2026-08-01T00:00:00Z (period 0)"
    roles: [CDIManager, SystemAdmin]
    code: 200
    input: [by_periods]
    output: CDIProgram
    side_effects:
      - "current_period_index += by_periods"
      - "for every SENT/ESCALATED query: re-evaluate auto-escalation and NO_RESPONSE per §1.2"
      - "for every case in {OPEN, UNDER_REVIEW, RECONCILED}: recompute priority_score (los_factor may cross a boundary)"
      - "increments CDIProgram.version by 1"

  - method: GET
    path: "/api/cdi-programs/{id}/cmi-snapshots"
    description: "Sub-resource list of CMI snapshots for a program (FK reverse-reachability for CMISnapshot.cdi_program_id)"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "CMISnapshot[]"
    side_effects: []

  - method: POST
    path: "/api/cdi-programs/{id}/cmi-snapshots"
    description: "Take a CMI snapshot at current_period_index"
    roles: [CDIManager, ComplianceAuditor]
    code: 201
    input: []
    output: CMISnapshot
    side_effects:
      - "as_of_period = current_period_index"
      - "computes case_count, unadjusted_cmi, adjusted_cmi, cdi_lift, denial_target_misses per calculations"

  # --- Escalation Policies ---
  - method: POST
    path: "/api/escalation-policies"
    description: "Create escalation policy"
    roles: [CDIManager]
    code: 201
    input: [cdi_program_id, name, response_due_periods, escalation_stage_periods, max_escalation_stage, "is_default?"]
    output: EscalationPolicy
    side_effects: ["if is_default=true: clear is_default on all other policies of this program"]

  - method: GET
    path: "/api/escalation-policies"
    description: "List escalation policies; filterable by cdi_program_id"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "cdi_program_id?"]
    output: "EscalationPolicy[]"
    side_effects: []

  - method: GET
    path: "/api/escalation-policies/{policyId}"
    description: "Get one escalation policy"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: []
    output: EscalationPolicy
    side_effects: []

  - method: PUT
    path: "/api/escalation-policies/{policyId}"
    description: "Update an escalation policy"
    roles: [CDIManager]
    code: 200
    input: ["name?", "response_due_periods?", "escalation_stage_periods?", "max_escalation_stage?", "is_default?"]
    output: EscalationPolicy
    side_effects: ["if is_default=true: clear is_default on all other policies", "increments EscalationPolicy.version by 1"]

  # --- Providers ---
  - method: POST
    path: "/api/providers"
    description: "Register a provider"
    roles: [CDIManager]
    code: 201
    input: [cdi_program_id, npi, full_name, specialty]
    output: Provider
    side_effects: ["education_score = 100", "education_flag = NONE", "pattern_tally_json = {}"]

  - method: GET
    path: "/api/providers"
    description: "List providers; filterable by cdi_program_id, education_flag and specialty"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "cdi_program_id?", "education_flag?", "specialty?"]
    output: "Provider[]"
    side_effects: []

  - method: GET
    path: "/api/providers/{providerId}"
    description: "Get a provider"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor, Provider]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/api/providers/{id}/education-events"
    description: "Sub-resource list of education events for a provider (FK reverse-reachability for ProviderEducationEvent.provider_id)"
    roles: [CDIManager, CDISpecialist, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "pattern_tag?"]
    output: "ProviderEducationEvent[]"
    side_effects: []

  # --- Patient Cases ---
  - method: POST
    path: "/api/patient-cases"
    description: "Register a patient case"
    roles: [HIMCoder]
    code: 201
    input: [cdi_program_id, mrn, admission_period, discharge_period, attending_provider_id, initial_drg_code, initial_drg_weight]
    output: PatientCase
    side_effects:
      - "working_drg_* initialized from initial_*"
      - "working_soi = working_rom = 1"
      - "priority_score computed (residual variant — no open queries at creation, so base_opportunity = 0)"
      - "status = OPEN; reconciliation_status = NOT_REQUIRED"

  - method: GET
    path: "/api/patient-cases"
    description: "List cases; filterable by cdi_program_id, status, attending_provider_id, priority_score_min"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "cdi_program_id?", "status?", "attending_provider_id?", "priority_score_min?"]
    output: "PatientCase[]"
    side_effects: []

  - method: GET
    path: "/api/patient-cases/{caseId}"
    description: "Get a case"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor, Provider]
    code: 200
    input: []
    output: PatientCase
    side_effects: []

  - method: GET
    path: "/api/patient-cases/{id}/reviews"
    description: "Sub-resource list of reviews for a case (FK reverse-reachability for CDIReview.patient_case_id)"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CDIReview[]"
    side_effects: []

  - method: GET
    path: "/api/patient-cases/{id}/reconciliations"
    description: "Sub-resource list of reconciliation events for a case (FK reverse-reachability for ReconciliationEvent.patient_case_id)"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ReconciliationEvent[]"
    side_effects: []

  - method: POST
    path: "/api/patient-cases/{caseId}/finalize-coding"
    description: "HIM coder attempts final coding; on DRG match case moves to FINAL_CODED, on mismatch creates ReconciliationEvent and rejects"
    roles: [HIMCoder]
    code: 200
    input: [coder_drg_code, coder_drg_weight, expected_case_version]
    output: PatientCase
    side_effects:
      - "on match: status -> FINAL_CODED"
      - "on mismatch: creates ReconciliationEvent (status=OPEN), case.reconciliation_status=PENDING, case.status -> UNDER_REVIEW if it was OPEN; rejects with ERR_DRG_MISMATCH"
      - "increments PatientCase.version by 1"

  - method: POST
    path: "/api/patient-cases/{caseId}/close"
    description: "Close a FINAL_CODED case"
    roles: [CDIManager]
    code: 200
    input: []
    output: PatientCase
    side_effects: ["status -> CLOSED", "increments PatientCase.version by 1"]

  # --- CDI Reviews ---
  - method: POST
    path: "/api/cdi-reviews"
    description: "Open a CDI review on a case"
    roles: [CDISpecialist]
    code: 201
    input: [patient_case_id]
    output: CDIReview
    side_effects: ["status = DRAFT", "cdi_specialist_id = X-User-ID", "opened_period = current_period_index"]

  - method: GET
    path: "/api/cdi-reviews"
    description: "List reviews; filterable by patient_case_id, cdi_program_id, status"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "patient_case_id?", "cdi_program_id?", "status?"]
    output: "CDIReview[]"
    side_effects: []

  - method: GET
    path: "/api/cdi-reviews/{reviewId}"
    description: "Get a review"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: []
    output: CDIReview
    side_effects: []

  - method: GET
    path: "/api/cdi-reviews/{id}/queries"
    description: "Sub-resource list of queries for a review (FK reverse-reachability for CDIQuery.cdi_review_id)"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor, Provider]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CDIQuery[]"
    side_effects: []

  - method: POST
    path: "/api/cdi-reviews/{reviewId}/activate"
    description: "Activate a review"
    roles: [CDISpecialist]
    code: 200
    input: []
    output: CDIReview
    side_effects: ["status -> ACTIVE", "if case was OPEN: case -> UNDER_REVIEW", "increments CDIReview.version by 1"]

  - method: POST
    path: "/api/cdi-reviews/{reviewId}/hold"
    description: "Put review on hold"
    roles: [CDISpecialist]
    code: 200
    input: []
    output: CDIReview
    side_effects: ["status -> ON_HOLD", "increments CDIReview.version by 1"]

  - method: POST
    path: "/api/cdi-reviews/{reviewId}/resume"
    description: "Resume a held review"
    roles: [CDISpecialist]
    code: 200
    input: []
    output: CDIReview
    side_effects: ["status -> ACTIVE", "increments CDIReview.version by 1"]

  - method: POST
    path: "/api/cdi-reviews/{reviewId}/close"
    description: "Close a review (with OCC expected_review_version)"
    roles: [CDISpecialist]
    code: 200
    input: [closed_reason, expected_review_version]
    output: CDIReview
    side_effects:
      - "status -> CLOSED"
      - "closed_reason recorded"
      - "if no other ACTIVE review and no OPEN ReconciliationEvent: case -> OPEN"
      - "increments CDIReview.version by 1"

  # --- CDI Queries ---
  - method: POST
    path: "/api/cdi-queries"
    description: "Create a query draft"
    roles: [CDISpecialist]
    code: 201
    input: [cdi_review_id, provider_id, escalation_policy_id, query_text, clinical_indicators, proposed_drg_code, proposed_drg_weight, proposed_soi, proposed_rom]
    output: CDIQuery
    side_effects: ["status = DRAFT", "escalation_stage = 0"]

  - method: GET
    path: "/api/cdi-queries"
    description: "List queries; filterable by cdi_review_id, patient_case_id, cdi_program_id, provider_id, escalation_policy_id, status"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor, Provider]
    code: 200
    input: ["limit?", "offset?", "cdi_review_id?", "patient_case_id?", "cdi_program_id?", "provider_id?", "escalation_policy_id?", "status?"]
    output: "CDIQuery[]"
    side_effects: []

  - method: GET
    path: "/api/cdi-queries/{queryId}"
    description: "Get a query"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor, Provider]
    code: 200
    input: []
    output: CDIQuery
    side_effects: []

  - method: PUT
    path: "/api/cdi-queries/{queryId}"
    description: "Edit a DRAFT query (text, indicators, proposed values)"
    roles: [CDISpecialist]
    code: 200
    input: ["query_text?", "clinical_indicators?", "proposed_drg_code?", "proposed_drg_weight?", "proposed_soi?", "proposed_rom?", "provider_id?", "escalation_policy_id?"]
    output: CDIQuery
    side_effects: ["increments CDIQuery.version by 1"]

  - method: POST
    path: "/api/cdi-queries/{queryId}/send"
    description: "Send a query (with OCC expected_query_version); runs non-leading lint"
    roles: [CDISpecialist]
    code: 200
    input: [expected_query_version]
    output: CDIQuery
    side_effects:
      - "compliant_language + lint_findings recorded"
      - "status -> SENT"
      - "sent_period = current_period_index; due_period = sent_period + policy.response_due_periods"
      - "increments CDIQuery.version by 1"

  - method: POST
    path: "/api/cdi-queries/{queryId}/cancel"
    description: "Cancel a query in DRAFT / SENT / ESCALATED"
    roles: [CDISpecialist]
    code: 200
    input: []
    output: CDIQuery
    side_effects: ["status -> CANCELLED", "increments CDIQuery.version by 1"]

  # --- Query Responses ---
  - method: POST
    path: "/api/cdi-queries/{id}/responses"
    description: "Provider responds to a query"
    roles: [Provider]
    code: 201
    input: [response_type, response_text]
    output: QueryResponse
    side_effects:
      - "query.status -> RESPONDED"
      - "query.response_id set"
      - "was_overdue computed"
      - "on AGREE: case working_* updated; review opportunity_*_delta recomputed"
      - "on CLINICALLY_UNSUPPORTED: ProviderEducationEvent(CLINICALLY_UNSUPPORTED_PATTERN, 4) on responder"
      - "if was_overdue: ProviderEducationEvent(OVERDUE_PATTERN, 2) on responder"
      - "provider education_score and education_flag recomputed"

  - method: GET
    path: "/api/cdi-queries/{id}/responses"
    description: "Get the (0-or-1) response on a query (FK reverse-reachability for QueryResponse.cdi_query_id)"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor, Provider]
    code: 200
    input: []
    output: "QueryResponse[]"
    side_effects: []

  # --- Reconciliation Events ---
  - method: GET
    path: "/api/reconciliation-events"
    description: "List reconciliation events; filterable by patient_case_id, cdi_program_id, status"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "patient_case_id?", "cdi_program_id?", "status?"]
    output: "ReconciliationEvent[]"
    side_effects: []

  - method: GET
    path: "/api/reconciliation-events/{eventId}"
    description: "Get a reconciliation event"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: []
    output: ReconciliationEvent
    side_effects: []

  - method: POST
    path: "/api/reconciliation-events/{eventId}/resolve"
    description: "Resolve a reconciliation event"
    roles: [CDIManager]
    code: 200
    input: [outcome, resolution_note]
    output: ReconciliationEvent
    side_effects:
      - "status -> RESOLVED_CDI_PREVAILS or RESOLVED_CODER_PREVAILS"
      - "case.reconciliation_status updated"
      - "if CODER_PREVAILS: case.working_drg_* <- coder_drg_*"
      - "if no other OPEN event on the case: case.status -> RECONCILED"
      - "increments ReconciliationEvent.version by 1"

  - method: POST
    path: "/api/reconciliation-events/{eventId}/escalate"
    description: "Escalate a reconciliation event (cannot agree)"
    roles: [CDIManager]
    code: 200
    input: []
    output: ReconciliationEvent
    side_effects:
      - "status -> ESCALATED"
      - "case.reconciliation_status -> ESCALATED"
      - "if no other OPEN event on the case: case.status -> RECONCILED"
      - "increments ReconciliationEvent.version by 1"

  # --- Denial Risk Targets ---
  - method: POST
    path: "/api/denial-risk-targets"
    description: "Create denial risk target"
    roles: [CDIManager, ComplianceAuditor]
    code: 201
    input: [cdi_program_id, drg_code, required_evidence_tags, severity_floor, active_from_period, active_to_period]
    output: DenialRiskTarget
    side_effects: []

  - method: GET
    path: "/api/denial-risk-targets"
    description: "List denial risk targets; filterable by cdi_program_id, drg_code"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "cdi_program_id?", "drg_code?"]
    output: "DenialRiskTarget[]"
    side_effects: []

  - method: GET
    path: "/api/denial-risk-targets/{targetId}"
    description: "Get a denial risk target"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: []
    output: DenialRiskTarget
    side_effects: []

  # --- Provider Education Events ---
  - method: POST
    path: "/api/provider-education-events"
    description: "Manually record a provider education event (in addition to auto-generated ones)"
    roles: [CDIManager, CDISpecialist]
    code: 201
    input: [provider_id, pattern_tag, points_deducted, source_query_id, note]
    output: ProviderEducationEvent
    side_effects:
      - "provider.education_score -= points_deducted (floor 0)"
      - "provider.education_flag recomputed per provider_education_band"
      - "pattern_tally_json[pattern_tag] += 1"

  - method: GET
    path: "/api/provider-education-events"
    description: "List provider education events; filterable by provider_id, cdi_program_id, pattern_tag"
    roles: [CDIManager, CDISpecialist, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "provider_id?", "cdi_program_id?", "pattern_tag?"]
    output: "ProviderEducationEvent[]"
    side_effects: []

  # --- CMI Snapshots ---
  - method: GET
    path: "/api/cmi-snapshots"
    description: "List CMI snapshots; filterable by cdi_program_id"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "cdi_program_id?"]
    output: "CMISnapshot[]"
    side_effects: []

  - method: GET
    path: "/api/cmi-snapshots/{snapshotId}"
    description: "Get a CMI snapshot"
    roles: [CDIManager, CDISpecialist, HIMCoder, ComplianceAuditor]
    code: 200
    input: []
    output: CMISnapshot
    side_effects: []

  # --- Test-driving endpoints (logical clock; startup default 2026-08-01T00:00:00Z = period 0) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Test-driving endpoint: reset the logical clock to an absolute ISO8601 timestamp; period 0 is 2026-08-01T00:00:00Z and each day = one period. Server startup default is 2026-08-01T00:00:00Z (period 0). This endpoint does NOT bypass per-program clock state — prefer /api/cdi-programs/{programId}/clock/advance for scenario control."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, period_index: integer }"
    side_effects: ["sets the logical epoch used by period calculations"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-ID / X-User-Role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path ID does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema/type violation, or business-constraint violation that has no more specific code (e.g., active_to < active_from)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in the required state for this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version mismatch" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Write attempted while program is SUSPENDED or CLOSED" }
  - { id: ERR_OPEN_CASES_REMAIN, http: 409, condition: "Program close blocked by cases in {OPEN, UNDER_REVIEW, RECONCILED}" }
  - { id: ERR_CASE_NOT_REVIEWABLE, http: 409, condition: "Review activation/resume attempted on a case not in {OPEN, UNDER_REVIEW}" }
  - { id: ERR_REVIEW_ALREADY_ACTIVE, http: 409, condition: "Second concurrent ACTIVE review on same case" }
  - { id: ERR_REVIEW_NOT_ACTIVE, http: 409, condition: "Query send attempted on a review not in ACTIVE" }
  - { id: ERR_UNRESOLVED_QUERY_EXISTS, http: 409, condition: "Review close/hold or case finalize attempted while a query is in {DRAFT, SENT, ESCALATED}" }
  - { id: ERR_LEADING_LANGUAGE, http: 422, condition: "Query lint failed (leading phrase, answer-in-question, or no clinical indicators)" }
  - { id: ERR_PROVIDER_NOT_IN_PROGRAM, http: 422, condition: "provider_id does not belong to the case's program" }
  - { id: ERR_NOT_QUERY_RECIPIENT, http: 403, condition: "Responder is not the addressed provider (segregation of duties)" }
  - { id: ERR_PROVIDER_UNDER_INTENSIVE_REVIEW, http: 403, condition: "Provider education_flag == INTENSIVE_REVIEW and response_type != CLARIFICATION_REQUESTED" }
  - { id: ERR_CASE_NOT_DISCHARGED, http: 422, condition: "finalize-coding before current_period_index >= discharge_period" }
  - { id: ERR_DRG_MISMATCH, http: 409, condition: "Coder DRG != working DRG; ReconciliationEvent created" }
  - { id: ERR_DENIAL_TARGET_UNMET, http: 422, condition: "Active DenialRiskTarget evidence tags or severity_floor unmet at finalize" }
  - { id: ERR_DEFAULT_POLICY_CONFLICT, http: 409, condition: "Attempt to clear default policy or to introduce a second default" }
  - { id: ERR_OPEN_REVIEW_EXISTS, http: 409, condition: "Finalize attempted while a review is in {DRAFT, ACTIVE, ON_HOLD}" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CDIManager
    description: "Owns the CDI program; manages policies, providers, reconciliation, program lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /api/cdi-programs"
      - "POST /api/cdi-programs/{programId}/suspend"
      - "POST /api/cdi-programs/{programId}/resume"
      - "POST /api/cdi-programs/{programId}/close"
      - "POST /api/cdi-programs/{programId}/clock/advance"
      - "POST /api/escalation-policies"
      - "PUT /api/escalation-policies/{policyId}"
      - "POST /api/providers"
      - "POST /api/patient-cases/{caseId}/close"
      - "POST /api/reconciliation-events/{eventId}/resolve"
      - "POST /api/reconciliation-events/{eventId}/escalate"
    shared_operations:
      - "GET endpoints"
      - "POST /api/denial-risk-targets"
      - "POST /api/provider-education-events"
      - "POST /api/cdi-programs/{id}/cmi-snapshots"

  - name: CDISpecialist
    description: "Opens reviews, drafts/sends/cancels queries, manually records education events"
    identity: opaque
    exclusive_operations:
      - "POST /api/cdi-reviews"
      - "POST /api/cdi-reviews/{reviewId}/activate"
      - "POST /api/cdi-reviews/{reviewId}/hold"
      - "POST /api/cdi-reviews/{reviewId}/resume"
      - "POST /api/cdi-reviews/{reviewId}/close"
      - "POST /api/cdi-queries"
      - "PUT /api/cdi-queries/{queryId}"
      - "POST /api/cdi-queries/{queryId}/send"
      - "POST /api/cdi-queries/{queryId}/cancel"
    shared_operations:
      - "GET endpoints"
      - "POST /api/provider-education-events"

  - name: HIMCoder
    description: "Registers patient cases; performs final coding"
    identity: opaque
    exclusive_operations:
      - "POST /api/patient-cases"
      - "POST /api/patient-cases/{caseId}/finalize-coding"
    shared_operations:
      - "GET endpoints"

  - name: Provider
    description: "Responds to queries addressed to them; identity equals a persisted Provider row"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /api/cdi-queries/{id}/responses"
    shared_operations:
      - "GET endpoints (limited — sees provider inbox via /api/cdi-queries?provider_id= and own provider record)"

  - name: ComplianceAuditor
    description: "Read-mostly; can create denial-risk targets and CMI snapshots"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET endpoints"
      - "POST /api/denial-risk-targets"
      - "POST /api/cdi-programs/{id}/cmi-snapshots"

  - name: SystemAdmin
    description: "Test-driving and low-level operations (logical clock)"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
      - "POST /api/cdi-programs/{programId}/clock/advance"
