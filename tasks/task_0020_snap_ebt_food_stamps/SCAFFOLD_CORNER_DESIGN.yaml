scaffold_corner_design:

  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_household_missing_case_number_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Household.fields.case_number", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /snap/households without case_number returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /snap/households"
              payload: { state_code: "CA", address_line: "X" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == 'ERR_INVALID_REQUEST' (HTTP 400)"

      - name: get_household_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Household", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /snap/households/{nonexistent-uuid} returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /snap/households/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == 'ERR_NOT_FOUND' (HTTP 404)"

      - name: create_household_default_heap_recipient_is_false
        claim_type: defaults
        grounds: ["entities.Household.fields.heap_recipient"]
        distinguishing_aspect: "Omitting heap_recipient applies default false."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /snap/households"
              payload: { case_number: "CA-DEF001", state_code: "CA", address_line: "1 X" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id", heap: "$.data.heap_recipient", status: "$.data.status", size: "$.data.size" }
          assert:
            - "Household.${hh_id}.heap_recipient == false (default applied)"
            - "Household.${hh_id}.status == 'PENDING' (initial state)"
            - "Household.${hh_id}.size == 0 (no members yet)"

      - name: create_member_with_default_earned_zero
        claim_type: defaults
        grounds: ["entities.HouseholdMember.fields.monthly_earned_income_cents", "entities.HouseholdMember.fields.monthly_unearned_income_cents"]
        distinguishing_aspect: "Omitting earned/unearned income defaults to 0."
        test_recipe:
          setup: ["Household HH PENDING"]
          setup_api_calls:
            - call: "POST /snap/households"
              payload: { case_number: "CA-DEF002", state_code: "CA", address_line: "1 X" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
          trigger:
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "M", date_of_birth: "1970-01-01", relationship: "HEAD" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { m_id: "$.data.id", earned: "$.data.monthly_earned_income_cents", unearned: "$.data.monthly_unearned_income_cents" }
          assert:
            - "HouseholdMember.${m_id}.monthly_earned_income_cents == 0 (default)"
            - "HouseholdMember.${m_id}.monthly_unearned_income_cents == 0 (default)"

      - name: eligible_item_category_has_no_version_field
        claim_type: immutability
        grounds: ["entities.EligibleItemCategory"]
        distinguishing_aspect: "EligibleItemCategory declared common_fields=false; response lacks `version`/`updated_at` (only id+created_at)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /snap/eligible-item-categories"
              payload: { code: "TOBACCO", name: "Tobacco", eligible: false }
              as: PolicyAdmin
              as_user_id: "pa_001"
              captures: { cat_id: "$.data.id" }
          assert:
            - "Response data has 'id' and 'created_at' but no 'version' field (common_fields=false per §1.1)"
            - "EligibleItemCategory.${cat_id}.eligible == false"

      - name: parent_not_found_on_create_member
        claim_type: parent_relationship
        grounds: ["entities.HouseholdMember.fields.household_id", "errors[ERR_PARENT_NOT_FOUND]"]
        distinguishing_aspect: "POST /snap/household-members with unknown household_id returns ERR_PARENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /snap/household-members"
              payload: { household_id: "00000000-0000-0000-0000-000000000000", full_name: "X", date_of_birth: "1970-01-01", relationship: "HEAD" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == 'ERR_PARENT_NOT_FOUND' (HTTP 404)"

      - name: monthly_allotment_benefit_month_format_invalid
        claim_type: type_constraints
        grounds: ["entities.MonthlyAllotment.fields.benefit_month", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "benefit_month=='2026-13' (month out of range) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Household HH ACTIVE"]
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "CA-C00001", state_code: "CA", address_line: "X" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "ok" }
              as: Caseworker
              as_user_id: "cw_001"
          trigger:
            - call: "POST /snap/monthly-allotments"
              payload: { household_id: "${hh_id}", benefit_month: "2026-13" }
              as: BenefitIssuer
              as_user_id: "bi_001"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == 'ERR_INVALID_REQUEST' (benefit_month format violation)"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: approve_already_approved_application_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Application.SUBMITTED_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: state_beats_business_fiscal_on_double_approve
          rationale: "The double-approve invalid_transition is asserted as the §1.8 dual-failure scenario (ERR_INVALID_STATE wins over ERR_INCOME_LIMIT_EXCEEDED)."

      - name: terminate_already_terminated_household_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Household", "entities.Household.fields.status"]
        distinguishing_aspect: "Household in TERMINATED (terminal) rejects /terminate."
        test_recipe:
          setup:
            - "Household HH was ACTIVE then TERMINATED"
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "CA-T00001", state_code: "CA", address_line: "X" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "ok" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/households/${hh_id}/terminate"
              payload: { decision_reason: "fraud confirmed" }
              as: Caseworker
              as_user_id: "cw_001"
          trigger:
            - call: "POST /snap/households/${hh_id}/terminate"
              payload: { decision_reason: "again" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == 'ERR_INVALID_STATE' (TERMINATED is terminal)"

      - name: reinstate_household_not_suspended_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Household.SUSPENDED_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /snap/households/{id}/reinstate on ACTIVE (not SUSPENDED) household returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Household ACTIVE (never suspended)"]
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "CA-R00001", state_code: "CA", address_line: "X" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "ok" }
              as: Caseworker
              as_user_id: "cw_001"
          trigger:
            - call: "POST /snap/households/${hh_id}/reinstate"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == 'ERR_INVALID_STATE'"

      - name: fraud_flag_not_claiming_investigator_substantiate_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.FraudFlag.UNDER_REVIEW_to_SUBSTANTIATED", "validations[priority=9]", "errors[ERR_NOT_CLAIMING_INVESTIGATOR]"]
        distinguishing_aspect: "Investigator B attempts /substantiate on flag claimed by Investigator A; ERR_NOT_CLAIMING_INVESTIGATOR returned (403)."
        test_recipe:
          setup: ["FraudFlag FF claimed by inv_001, status UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "CA-F00001", state_code: "CA", address_line: "X" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "ok" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/fraud-flags"
              payload: { household_id: "${hh_id}", trigger_rule: "VELOCITY_SPIKE" }
              as: FraudInvestigator
              as_user_id: "inv_001"
              captures: { ff_id: "$.data.id" }
            - call: "POST /snap/fraud-flags/${ff_id}/claim"
              payload: {}
              as: FraudInvestigator
              as_user_id: "inv_001"
              captures: { ff_v: "$.data.version" }
          trigger:
            - call: "POST /snap/fraud-flags/${ff_id}/substantiate"
              payload: { resolution_note: "I'm not the claiming investigator", expected_fraudflag_version: "${ff_v}" }
              as: FraudInvestigator
              as_user_id: "inv_002"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == 'ERR_NOT_CLAIMING_INVESTIGATOR' (HTTP 403)"

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: net_income_zero_when_deductions_exceed_gross
        claim_type: correct_result
        grounds: ["calculations.net_monthly_income", "entities.Household.fields.net_income_cents"]
        distinguishing_aspect: "size=1 gross=5000 heap=false → earned_ded=floor(1000)=1000, std_ded=19800. gross-deductions = -15800; max(0, ...) clamps net_income_cents=0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "CA-N00001", state_code: "CA", address_line: "X", heap_recipient: false }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
          trigger:
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", monthly_earned_income_cents: 5000, disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "GET /snap/households/${hh_id}"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { net: "$.data.net_income_cents", gross: "$.data.gross_income_cents" }
          assert:
            - "Household.${hh_id}.gross_income_cents == 5000"
            - "Household.${hh_id}.net_income_cents == 0 (clamped at 0)"

      - name: monthly_allotment_min_floor_2300_for_size_1_high_income
        claim_type: correct_result
        grounds: ["calculations.monthly_allotment", "calculations.monthly_allotment.constants.MIN_ALLOTMENT_1_2"]
        distinguishing_aspect: "size=1, net high enough that 29100 - floor(0.3*net) would be below 2300 → floored to MIN_ALLOTMENT_1_2=2300. Construct: net=115500. floor(0.3*115500)=34650. 29100-34650 = -5550 → max(2300, -5550)=2300."
        test_recipe:
          setup: ["Household HH ACTIVE size=1 net=115500"]
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "CA-M00001", state_code: "CA", address_line: "X", heap_recipient: false }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            # gross such that net (LIMIT_CHECK and BENEFIT_CALC both, heap=false) == 115500
            # net = gross - floor(0.2*gross) - 19800; pick gross=169125: floor(33825)=33825; net=169125-33825-19800=115500.
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", monthly_earned_income_cents: 169125, disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "ok" }
              as: Caseworker
              as_user_id: "cw_001"
          trigger:
            - call: "POST /snap/monthly-allotments"
              payload: { household_id: "${hh_id}", benefit_month: "2026-09" }
              as: BenefitIssuer
              as_user_id: "bi_001"
              captures: { ma_id: "$.data.id", std: "$.data.standard_allotment_cents" }
          assert:
            - "Household.${hh_id}.net_income_cents == 115500"
            - "MonthlyAllotment.${ma_id}.standard_allotment_cents == 2300 (MIN_ALLOTMENT_1_2 floor)"

      - name: emergency_supplement_uses_min_floor_when_gap_smaller
        claim_type: correct_result
        grounds: ["calculations.monthly_allotment.variants.EMERGENCY", "calculations.monthly_allotment.constants.MAX_ALLOTMENT_BY_SIZE"]
        distinguishing_aspect: "When max-standard gap (29100-29100=0 for net=0 size=1) < proclamation.min_supplement (9500), emergency = max(9500, 0) = 9500; issued_total = 29100+9500 = 38600."
        test_recipe:
          setup: ["Household HH ACTIVE size=1 net=0 state=CA; proclamation ACTIVE for (CA, 2026-09)"]
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "CA-E00001", state_code: "CA", address_line: "X", heap_recipient: false }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", monthly_earned_income_cents: 0, disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "ok" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/emergency-allotments"
              payload: { state_code: "CA", benefit_month: "2026-09", min_supplement_cents: 9500 }
              as: PolicyAdmin
              as_user_id: "pa_001"
              captures: { proc_id: "$.data.id" }
            - call: "POST /snap/emergency-allotments/${proc_id}/activate"
              payload: {}
              as: PolicyAdmin
              as_user_id: "pa_001"
          trigger:
            - call: "POST /snap/monthly-allotments"
              payload: { household_id: "${hh_id}", benefit_month: "2026-09" }
              as: BenefitIssuer
              as_user_id: "bi_001"
              captures: { ma_id: "$.data.id", std: "$.data.standard_allotment_cents", emerg: "$.data.emergency_supplement_cents", total: "$.data.issued_total_cents" }
          assert:
            - "MonthlyAllotment.${ma_id}.standard_allotment_cents == 29100"
            - "MonthlyAllotment.${ma_id}.emergency_supplement_cents == 9500 (min floor wins over gap=0)"
            - "MonthlyAllotment.${ma_id}.issued_total_cents == 38600"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: duplicate_case_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_CASE_NUMBER]"]
        distinguishing_aspect: "Two POST /snap/households with same case_number; second rejected with ERR_DUPLICATE_CASE_NUMBER (409)."
        test_recipe:
          setup: ["First household exists"]
          setup_api_calls:
            - call: "POST /snap/households"
              payload: { case_number: "CA-D00001", state_code: "CA", address_line: "X" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh1_id: "$.data.id" }
          trigger:
            - call: "POST /snap/households"
              payload: { case_number: "CA-D00001", state_code: "TX", address_line: "Y" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == 'ERR_DUPLICATE_CASE_NUMBER' (HTTP 409)"

      - name: duplicate_waiver_quarter_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_WAIVER_QUARTER]"]
        distinguishing_aspect: "Second POST /snap/abawd-waivers with same (household_member_id, quarter) → ERR_DUPLICATE_WAIVER_QUARTER."
        test_recipe:
          setup: ["Household member exists; one waiver exists for 2026-Q3"]
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "CA-W00001", state_code: "CA", address_line: "X" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Adult", date_of_birth: "1996-01-01", relationship: "HEAD" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { m_id: "$.data.id" }
            - call: "POST /snap/abawd-waivers"
              payload: { household_member_id: "${m_id}", quarter: "2026-Q3", county_unemployment_pct: 8.00, monthly_work_hours: 0 }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { w1_id: "$.data.id" }
          trigger:
            - call: "POST /snap/abawd-waivers"
