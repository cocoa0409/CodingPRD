              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0005", age_years: 30, sex: "F", weight_kg: 72.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d5_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc_d1: "$.data[0].id", mc_d5: "$.data[1].id" }
            - call: "POST /registry/match-candidates/${mc_d1}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct_d1: "$.data.id", ct_d1_deadline: "$.data.deadline_at" }
            - call: "POST /registry/match-candidates/${mc_d5}/typing-requests"
