scaffold_corner_design:
  - section: entities
    instances:
      - name: employer_partner_create_initialises_safety_score_and_prospect_posture
        claim_type: Creation
        grounds:
          - entities.EmployerPartner
          - endpoints["POST /wbl/employer-partners"]
          - calculations.employer_safety_score_posture
        distinguishing_aspect: |
          A freshly recruited partner with no worksites and no incidents must come back with
          safety_score 100, posture PROSPECT, all three substantiated_* counters at 0,
          wage_liability_cents 0 and version 1 — the computed score is initialised by the create
          endpoint, not left null until the first safety review.
        test_recipe:
          setup:
            - "empty database with the logical clock at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: WblCoordinator
          trigger:
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Vantage Hospitality Group", naics_code: "721110", industry_sector: "FOOD_SERVICE", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10001", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
              captures: { emp_id: $.data.id }
          assert:
            - "response status == 201"
            - "response data.legal_name == Vantage Hospitality Group"
            - "response data.safety_score == 100"
            - "response data.posture == PROSPECT"
            - "response data.substantiated_minor_count == 0"
            - "response data.substantiated_moderate_count == 0"
            - "response data.substantiated_critical_count == 0"
            - "response data.wage_liability_cents == 0"
            - "response data.version == 1"

      - name: employer_partners_list_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /wbl/employer-partners"]
        distinguishing_aspect: |
          With exactly three partners stored and limit 2 / offset 0, the page must carry 2 rows while
          meta.total_count reports 3 and meta.has_more is true — the count is over the whole filtered
          set, not over the returned page.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T08:00:00Z"
            - "exactly three EmployerPartner rows, created in name order"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Anchor Foods", naics_code: "722511", industry_sector: "FOOD_SERVICE", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10011", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Basalt Engineering", naics_code: "541330", industry_sector: "MANUFACTURING", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10012", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Cordial Care Clinic", naics_code: "621111", industry_sector: "HEALTHCARE", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10013", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
          trigger:
            - call: "GET /wbl/employer-partners"
              payload: { limit: 2, offset: 0 }
              as: WblCoordinator
          assert:
            - "response status == 200"
            - "response data length == 2"
            - "response meta.total_count == 3"
            - "response meta.has_more == true"
            - "response meta.limit == 2"
            - "response meta.offset == 0"

      - name: worksite_get_with_unknown_id_returns_worksite_not_found
        claim_type: Not Found
        grounds:
          - endpoints["GET /wbl/worksites/{worksiteId}"]
          - validations[priority=6]
          - errors[ERR_WORKSITE_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid UUID that no Worksite row carries must produce 404
          ERR_WORKSITE_NOT_FOUND — the path-parameter existence check at priority 6 names the error per
          resource type, so a generic ERR_NOT_FOUND or a 200 with a null body both fail.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T08:00:00Z and no Worksite rows"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: WblCoordinator
          trigger:
            - call: "GET /wbl/worksites/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: WblCoordinator
          assert:
            - "response status == 404"
            - "response error.code == ERR_WORKSITE_NOT_FOUND"
            - "response data == null"

      - name: worksite_create_missing_required_max_concurrent_students_rejected
        claim_type: Required Fields
        grounds:
          - endpoints["POST /wbl/worksites"]
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          max_concurrent_students is a required input with no default at the endpoint, so omitting it
          must fail with 422 ERR_INVALID_REQUEST rather than silently defaulting the capacity — a
          worksite created with an implicit capacity would let the aggregate capacity rule pass forever.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T08:00:00Z"
            - "one EmployerPartner exists"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Dunmore Freight", naics_code: "488510", industry_sector: "TRANSPORTATION", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10021", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /wbl/worksites"
              payload: { employer_partner_id: "${emp_id}", site_name: "Dunmore Cross Dock", address_line: "9 Dunmore Way", hazard_class: "NON_HAZARDOUS", has_power_machinery: false, displaces_paid_employee: false }
              as: WblCoordinator
          assert:
            - "response status == 422"
            - "response error.code == ERR_INVALID_REQUEST"
            - "no Worksite row exists for EmployerPartner ${emp_id}"

      - name: worksite_create_with_invalid_hazard_class_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Worksite.fields.hazard_class
          - validations[priority=8]
        distinguishing_aspect: |
          hazard_class is closed over {NON_HAZARDOUS, LIMITED_HAZARD, PROHIBITED_HAZARD}; the
          out-of-enum literal SOMEWHAT_HAZARDOUS must be rejected with ERR_INVALID_REQUEST at create
          time, because the hazardous-occupation gate later compares against exact enum values.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T08:00:00Z"
            - "one EmployerPartner exists"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Everline Fabrication", naics_code: "332323", industry_sector: "MANUFACTURING", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10031", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /wbl/worksites"
              payload: { employer_partner_id: "${emp_id}", site_name: "Everline Weld Shop", address_line: "77 Everline Rd", hazard_class: "SOMEWHAT_HAZARDOUS", has_power_machinery: true, displaces_paid_employee: false, max_concurrent_students: 2 }
              as: WblCoordinator
          assert:
            - "response status == 422"
            - "response error.code == ERR_INVALID_REQUEST"
            - "no Worksite row exists for EmployerPartner ${emp_id}"

      - name: employer_partner_create_system_and_computed_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.EmployerPartner.fields.safety_score
          - entities.EmployerPartner.fields.posture
          - endpoints["POST /wbl/employer-partners"]
        distinguishing_aspect: |
          id, created_at, version, safety_score and posture are server-owned; a create request that
          also carries safety_score 20 and posture SUSPENDED must have those values ignored and come
          back with the system-derived 100 / PROSPECT, proving the create path does not trust client
          input for computed compliance state.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: WblCoordinator
          trigger:
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Fairhaven Nursery", naics_code: "111421", industry_sector: "RETAIL", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10041", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
          assert:
            - "the request also carried safety_score 20, posture SUSPENDED, version 9 and a client-chosen id, all of which are ignored"
            - "response status == 201"
            - "response data.safety_score == 100"
            - "response data.posture == PROSPECT"
            - "response data.version == 1"
            - "response data.id is a server-minted UUID different from the client-supplied id"
            - "response data.created_at reflects the logical clock 2026-09-01T08:00:00.000Z"

      - name: work_permit_create_with_unknown_student_returns_student_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=7]
          - errors[ERR_STUDENT_NOT_FOUND]
          - endpoints["POST /wbl/work-permits"]
        distinguishing_aspect: |
          Body foreign keys are resolved at priority 7 in §1.1 declaration order, so a permit request
          naming a student_id that does not exist must fail 404 ERR_STUDENT_NOT_FOUND before any
          permit row is written — flat-topology cross-reference integrity, not a hierarchical URL check.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T08:00:00Z and no Student rows"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: WblCoordinator
          trigger:
            - call: "POST /wbl/work-permits"
              payload: { student_id: "99999999-8888-4777-8666-555555555555", permit_class: "MINOR_16_17", hazardous_endorsement: false }
              as: WblCoordinator
          assert:
            - "response status == 404"
            - "response error.code == ERR_STUDENT_NOT_FOUND"
            - "no WorkPermit row was created"

      - name: placement_create_omitting_required_evaluation_cycles_applies_default_two
        claim_type: Defaults
        grounds:
          - entities.Placement.fields.required_evaluation_cycles
          - endpoints["POST /wbl/placements"]
        distinguishing_aspect: |
          required_evaluation_cycles is an optional input with default 2; omitting it must store 2 (not
          null, not 1), which is what the completion gate later counts CLOSED cycles against.
        test_recipe:
          setup:
            - "logical clock at 2026-09-07T08:00:00Z"
            - "APPROVED worksite with a trained supervisor and an EXECUTED agreement"
            - "eligible student with an ISSUED MINOR_16_17 permit"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Gladstone Hardware", naics_code: "444140", industry_sector: "RETAIL", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10051", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /wbl/worksites"
              payload: { employer_partner_id: "${emp_id}", site_name: "Gladstone Sales Floor", address_line: "15 Gladstone St", hazard_class: "NON_HAZARDOUS", has_power_machinery: false, displaces_paid_employee: false, max_concurrent_students: 2 }
              as: WblCoordinator
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /wbl/safety-reviews"
              payload: { worksite_id: "${ws_id}", machinery_guarding_ok: true, hazard_findings_count: 0, orientation_documented: true, emergency_plan_on_file: true, expected_worksite_version: "${ws_v1}" }
              as: SafetyReviewer
              captures: { rev_id: $.data.id }
            - call: "POST /wbl/safety-reviews/${rev_id}/decision"
              payload: { decision: "APPROVED" }
              as: SafetyReviewer
            - call: "POST /wbl/supervisors"
              payload: { worksite_id: "${ws_id}", full_name: "Pat Ellery", email: "pat@gladstone.example", training_completed_on: "2026-03-15", max_student_load: 2 }
              as: WblCoordinator
              captures: { sup_id: $.data.id }
            - call: "POST /wbl/agreements"
              payload: { employer_partner_id: "${emp_id}", worksite_id: "${ws_id}", employer_signer_supervisor_id: "${sup_id}", effective_on: "2026-09-01", expires_on: "2027-06-30", insurance_rider: true }
              as: WblCoordinator
              as_user_id: "coord-drafter-1"
              captures: { agr_id: $.data.id }
            - call: "POST /wbl/agreements/${agr_id}/employer-sign"
              payload: {}
              as: EmployerSupervisor
              as_user_id: "${sup_id}"
            - call: "POST /wbl/agreements/${agr_id}/execute"
              payload: {}
              as: WblCoordinator
              as_user_id: "coord-signer-2"
            - call: "POST /wbl/students"
              payload: { full_name: "Hana Ilves", birth_date: "2009-04-27", grade_level: 11, gpa: 3.10, attendance_rate: 0.95, student_learner_certificate: true, guardian_consent_on_file: true }
              as: WblCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /wbl/work-permits"
              payload: { student_id: "${stu_id}", permit_class: "MINOR_16_17", hazardous_endorsement: false }
              as: WblCoordinator
              captures: { per_id: $.data.id }
            - call: "POST /wbl/work-permits/${per_id}/issue"
              payload: { expires_on: "2027-06-30" }
              as: ComplianceOfficer
            - call: "GET /wbl/worksites/${ws_id}"
              payload: {}
              as: WblCoordinator
              captures: { ws_v2: $.data.version }
          trigger:
            - call: "POST /wbl/placements"
              payload: { student_id: "${stu_id}", worksite_id: "${ws_id}", agreement_id: "${agr_id}", supervisor_id: "${sup_id}", pay_classification: "PAID", hourly_wage_cents: 1500, stipend_total_cents: 0, scheduled_weekly_hours: 12.00, start_on: "2026-09-07", end_on: "2026-12-18", credit_target_credits: 0.50, credit_award_mode: "HOURS_BASED", transportation_mode: "PUBLIC_TRANSIT", commute_round_trip_miles: 0.00, expected_worksite_version: "${ws_v2}" }
              as: WblCoordinator
              captures: { pl_id: $.data.id }
          assert:
            - "response status == 201"
            - "response data.required_evaluation_cycles == 2"
            - "response data.lifecycle_status == PROPOSED"
            - "response data.compliance_status == PENDING_REVIEW"
            - "response data.permit_class_at_start == MINOR_16_17"
            - "response data.student_age_at_start == 17"
            - "Worksite.${ws_id}.slots_committed == 1"

      - name: learning_objective_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.LearningObjective
          - endpoints["POST /wbl/learning-objectives"]
          - endpoints["GET /wbl/training-plans/{planId}/objectives"]
        distinguishing_aspect: |
          LearningObjective is declared common_fields: false, so it carries only id and created_at:
          the create response and the sub-resource listing must expose no version and no updated_at,
          and §1.5 offers no update or delete route for it — objectives are append-only evidence.
        test_recipe:
          setup:
            - "logical clock at 2026-09-07T08:00:00Z"
            - "APPROVED worksite, EXECUTED agreement, eligible student with an ISSUED permit"
            - "PROPOSED placement carrying a DRAFT training plan for course CTE-500"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Ironwood Cabinetry", naics_code: "337110", industry_sector: "MANUFACTURING", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10061", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /wbl/worksites"
              payload: { employer_partner_id: "${emp_id}", site_name: "Ironwood Finishing Room", address_line: "3 Ironwood Ct", hazard_class: "NON_HAZARDOUS", has_power_machinery: false, displaces_paid_employee: false, max_concurrent_students: 2 }
              as: WblCoordinator
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /wbl/safety-reviews"
              payload: { worksite_id: "${ws_id}", machinery_guarding_ok: true, hazard_findings_count: 0, orientation_documented: true, emergency_plan_on_file: true, expected_worksite_version: "${ws_v1}" }
              as: SafetyReviewer
              captures: { rev_id: $.data.id }
            - call: "POST /wbl/safety-reviews/${rev_id}/decision"
              payload: { decision: "APPROVED" }
              as: SafetyReviewer
            - call: "POST /wbl/supervisors"
              payload: { worksite_id: "${ws_id}", full_name: "Lex Moreau", email: "lex@ironwood.example", training_completed_on: "2026-03-22", max_student_load: 2 }
              as: WblCoordinator
              captures: { sup_id: $.data.id }
            - call: "POST /wbl/agreements"
              payload: { employer_partner_id: "${emp_id}", worksite_id: "${ws_id}", employer_signer_supervisor_id: "${sup_id}", effective_on: "2026-09-01", expires_on: "2027-06-30", insurance_rider: true }
              as: WblCoordinator
              as_user_id: "coord-drafter-1"
              captures: { agr_id: $.data.id }
            - call: "POST /wbl/agreements/${agr_id}/employer-sign"
              payload: {}
              as: EmployerSupervisor
              as_user_id: "${sup_id}"
            - call: "POST /wbl/agreements/${agr_id}/execute"
              payload: {}
              as: WblCoordinator
              as_user_id: "coord-signer-2"
            - call: "POST /wbl/students"
              payload: { full_name: "Milo Bergstrom", birth_date: "2009-05-30", grade_level: 12, gpa: 3.20, attendance_rate: 0.94, student_learner_certificate: true, guardian_consent_on_file: true }
              as: WblCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /wbl/work-permits"
              payload: { student_id: "${stu_id}", permit_class: "MINOR_16_17", hazardous_endorsement: false }
              as: WblCoordinator
              captures: { per_id: $.data.id }
            - call: "POST /wbl/work-permits/${per_id}/issue"
              payload: { expires_on: "2027-06-30" }
              as: ComplianceOfficer
            - call: "GET /wbl/worksites/${ws_id}"
              payload: {}
              as: WblCoordinator
              captures: { ws_v2: $.data.version }
            - call: "POST /wbl/placements"
              payload: { student_id: "${stu_id}", worksite_id: "${ws_id}", agreement_id: "${agr_id}", supervisor_id: "${sup_id}", pay_classification: "PAID", hourly_wage_cents: 1500, stipend_total_cents: 0, scheduled_weekly_hours: 12.00, start_on: "2026-09-07", end_on: "2026-12-18", credit_target_credits: 0.50, credit_award_mode: "HOURS_BASED", required_evaluation_cycles: 1, transportation_mode: "PUBLIC_TRANSIT", commute_round_trip_miles: 0.00, expected_worksite_version: "${ws_v2}" }
              as: WblCoordinator
              captures: { pl_id: $.data.id, pl_v1: $.data.version }
            - call: "POST /wbl/training-plans"
              payload: { placement_id: "${pl_id}", course_code: "CTE-500", credit_hours_target: 60.00, expected_placement_version: "${pl_v1}" }
              as: WblCoordinator
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /wbl/learning-objectives"
              payload: { training_plan_id: "${tp_id}", competency_code: "IW-1", description: "Sand and seal a face frame to spec", aligned_course_code: "CTE-500", assessment_method: "SUPERVISOR_RATING" }
              as: WblCoordinator
              captures: { obj_id: $.data.id }
          assert:
            - "response status == 201"
            - "response data has keys id and created_at but no version and no updated_at"
            - "TrainingPlan.${tp_id}.objective_count == 1"
            - "TrainingPlan.${tp_id}.aligned_objective_count == 1"
            - "GET /wbl/training-plans/${tp_id}/objectives returns exactly one row whose id == ${obj_id} and which carries no version field"

      - name: placement_computed_wage_and_credit_fields_match_the_calculations
        claim_type: Computed Fields
        grounds:
          - entities.Placement.fields.provisional_wage_cents
          - entities.Placement.fields.credits_awarded
        excluded_because:
          difficulty_instance: dual_variant_calc / wage_provisional_vs_final_diverge_on_placement_money
          rationale: "Computed-field correctness for the wage and credit derivations is asserted with pre-computed literals by that §1.8 instance and its credit sibling."

  - section: state_machines
    instances:
      - name: safety_review_second_decision_cannot_be_recorded
        claim_type: Idempotency
        grounds:
          - state_machines.WorksiteSafetyReview
          - validations[priority=12]
          - errors[ERR_REVIEW_ALREADY_DECIDED]
        distinguishing_aspect: |
          The decision endpoint is not idempotent by design: once the review has left SUBMITTED, a
          second APPROVED decision must fail 409 ERR_REVIEW_ALREADY_DECIDED and must not re-run the
          side effects — Worksite.version must stay where the first decision left it rather than
          incrementing again.
        test_recipe:
          setup:
            - "logical clock at 2026-09-07T08:00:00Z"
            - "worksite whose SUBMITTED review has already been decided APPROVED"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Junction Point Media", naics_code: "512110", industry_sector: "PUBLIC_ADMINISTRATION", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10071", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /wbl/worksites"
              payload: { employer_partner_id: "${emp_id}", site_name: "Junction Point Edit Suite", address_line: "4 Junction Way", hazard_class: "NON_HAZARDOUS", has_power_machinery: false, displaces_paid_employee: false, max_concurrent_students: 2 }
              as: WblCoordinator
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /wbl/safety-reviews"
              payload: { worksite_id: "${ws_id}", machinery_guarding_ok: true, hazard_findings_count: 0, orientation_documented: true, emergency_plan_on_file: true, expected_worksite_version: "${ws_v1}" }
              as: SafetyReviewer
              captures: { rev_id: $.data.id }
            - call: "POST /wbl/safety-reviews/${rev_id}/decision"
              payload: { decision: "APPROVED" }
              as: SafetyReviewer
            - call: "GET /wbl/worksites/${ws_id}"
              payload: {}
              as: WblCoordinator
              captures: { ws_v2: $.data.version }
          trigger:
