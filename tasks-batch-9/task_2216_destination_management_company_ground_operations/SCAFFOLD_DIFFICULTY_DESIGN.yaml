              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Museum Private Tour", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T13:00:00Z", planned_headcount: 25, guaranteed_headcount: 25, per_person_cost_cents: 7000, is_weather_dependent: false, expected_program_version: "${prog_v1}" }
