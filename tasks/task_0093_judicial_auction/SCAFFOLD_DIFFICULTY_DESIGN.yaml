# =============================================================================
# Judicial Auction Platform — Scaffold Difficulty Design (§1.8)
#
# Test Targeting Index — every rule_id from §0.5 with ≥2 grounded instances.
# Every `grounds:` reference resolves into SCAFFOLD.yaml §1.1–§1.6.
# Every test_recipe reconstructs its scenario from empty DB using only
# endpoints declared in §1.5.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: starting_price_first_vs_reauction
        grounds:
          - calculations.starting_price_calc
          - state_machines.Lot.AUCTIONED_to_ANNOUNCED
          - entities.Lot.fields.round_number
          - entities.Auction.fields.starting_price_cents
        distinguishing_aspect: |
          Two calculation variants on the Auction entity domain produce
          different starting prices for the same Lot. Variant `first_auction`
          uses Lot.assessment_value_cents × 0.70 → 70_000_000 cents; variant
          `reauction` uses prior_auction.starting_price_cents × 0.80 →
          56_000_000 cents on round 2. Identical assessment, divergent
          numeric result by formula choice.
        test_recipe:
          setup:
            - "POST /lots with assessment_value_cents=100000000 (round 1 Auction auto-created)."
            - "POST /auctions/{round1.id}/open after clock-advance past scheduled_start_at."
            - "Clock-advance past effective_end_at with no bids → Auction.status = UNSOLD; Lot.AUCTIONED_to_ANNOUNCED triggers round-2 Auction creation."
          trigger:
            - "GET /lots/{lot_id} and GET /auctions for the new round-2 row."
          assert:
            - "round1.starting_price_cents == 70000000"
            - "round2.starting_price_cents == 56000000"
            - "round2.starting_price_cents != round1.starting_price_cents"

      - name: late_payment_linear_vs_capped
        grounds:
          - calculations.late_payment_penalty
          - state_machines.Payment.PENDING_to_OVERDUE
          - entities.Payment.fields.penalty_accrued_cents
        distinguishing_aspect: |
          Two calculation variants on the Payment entity domain — `linear_accrual`
          (days_overdue < 20) and `capped` (days_overdue >= 20) — yield
          different penalty values for the same balance_due_cents = 68_000_000.
          Day 5 → 1_700_000 (linear); day 30 → 6_800_000 (cap at 10%).
          Operates on Payment, a different entity domain than starting_price_calc.
        test_recipe:
          setup:
            - "Run a Lot/Auction/Bid/Deposit/Confirmation pipeline ending in Payment with balance_due_cents = 68000000 and due_at = T."
          trigger:
            - "POST /_clock/advance to T + 5 days; GET /payments/{id}."
            - "POST /_clock/advance to T + 30 days; GET /payments/{id} again."
          assert:
            - "After 5 days: Payment.penalty_accrued_cents == 1700000"
            - "After 30 days: Payment.penalty_accrued_cents == 6800000"
            - "6800000 == 68000000 * 0.10 (cap reached, no further accrual)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: collusion_risk_score_weighted_max
        grounds:
          - calculations.collusion_risk_score
          - state_machines.BidderAccount.ACTIVE_to_SUSPENDED
          - state_machines.BidderAccount.ACTIVE_to_BLOCKED
          - entities.BidderAccount.fields.collusion_risk_score
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs (shared_ip, alternating_pattern,
          identical_increment, young_account) combined via weighted sum then
          MAX across peers (NOT sum across peers — pinning prevents
          double-counting). Conditional branches on BidderAccount.status
          gate eligibility. Non-linear interaction: enabling identical_increment
          alone (20) ≠ 60 → ACTIVE; adding shared_ip (40+20=60) → SUSPENDED;
          adding alternating (40+30+20=90) → BLOCKED.
        test_recipe:
          setup:
            - "Two BidderAccounts A and B sharing ip_fingerprint='IP1'; account_age_days both >= 30."
            - "Both post + pay PERCENT-mode deposit on Auction with starting_price=70000000 (deposit=7000000)."
            - "Place 4 alternating VALID bids A,B,A,B with identical increment 500000."
          trigger:
            - "POST /bids by A at amount 72000000."
          assert:
            - "BidderAccount A.collusion_risk_score == 90 (40 shared_ip + 30 alternating + 20 identical_increment, MAX over peers = {B})"
            - "BidderAccount A.status transitioned to BLOCKED (>= 80 threshold)"
            - "AuditEvent.kind = COLLUSION_FLAGGED was emitted with subject = A"

      - name: penalty_round_order_pinned
        grounds:
          - calculations.late_payment_penalty
          - entities.Payment.fields.penalty_accrued_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Formula pins
          "multiply balance × bps × days at full precision, divide by 10000,
          THEN round_half_up; cap comparison uses pre-round full-precision
          intermediates." Wrong order ("round each daily slice then sum")
          would diverge on fractional-cent days. With balance_due_cents
          = 68_000_001 and days=3: correct = round(68000001 * 50 * 3 / 10000)
          = round(1020000.015) = 1020000. Per-day-rounded would give
          3 * round(68000001 * 50 / 10000) = 3 * round(340000.005) =
          3 * 340000 = 1020000 — same here, but at balance_due_cents =
          68_000_007 the two orders diverge.
        test_recipe:
          setup:
            - "Build a Payment with balance_due_cents = 68000007 and due_at = T (full pipeline up to Confirmation.ISSUE)."
          trigger:
            - "POST /_clock/advance to T + 3 days; GET /payments/{id}."
          assert:
            - "Payment.penalty_accrued_cents == round_half_up(68000007 * 50 * 3 / 10000) == 1020000 (pinned order: aggregate-then-round, NOT per-day-round-then-sum which would give 3*round(340000.035)=3*340000=1020000 here but diverges at other inputs)"
            - "Order is documented as aggregate-then-round in calculations.late_payment_penalty.formula"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:

      - name: payment_cyclic_pending_overdue_pending
        grounds:
          - state_machines.Payment.PENDING_to_OVERDUE
          - state_machines.Payment.OVERDUE_to_PENDING
          - state_machines.Payment.PENDING_to_PAID
          - state_machines.Payment.OVERDUE_to_FORFEITED
        distinguishing_aspect: |
          Cyclic shape on the Payment entity: PENDING → OVERDUE → PENDING (via
          court grace extension), allowing arbitrarily many cycles before
          terminal PAID/FORFEITED. This is a cycle, not a linear pipeline.
          The Payment entity is distinct from the Lot/Auction/Confirmation
          machines used in the other non-linear instance below.
        test_recipe:
          setup:
            - "Full pipeline to Payment with balance_due_cents = 68000000, due_at = T."
          trigger:
            - "POST /_clock/advance to T + 1s → Payment.status auto-flips to OVERDUE."
            - "POST /payments/{id}/extend with extension_days=7 → Payment.status back to PENDING."
            - "POST /_clock/advance another 8 days → OVERDUE again."
          assert:
            - "After first auto-transition: Payment.status == 'OVERDUE'"
            - "After extend: Payment.status == 'PENDING'"
            - "After second clock-advance: Payment.status == 'OVERDUE' (cycle completed)"
            - "AuditEvent kind=PAYMENT_OVERDUE appears twice for this payment_id"

      - name: lot_branching_announced_to_auctioned_back_to_announced
        grounds:
          - state_machines.Lot.ANNOUNCED_to_AUCTIONED
          - state_machines.Lot.AUCTIONED_to_ANNOUNCED
          - state_machines.Lot.AUCTIONED_to_TRANSFERRED
          - entities.Lot.fields.round_number
        distinguishing_aspect: |
          Branching fork on the Lot entity at state AUCTIONED with two divergent
          side-effect sets: {AUCTIONED→ANNOUNCED creates a NEW Auction row and
          increments round_number} vs. {AUCTIONED→TRANSFERRED bubbles up
          from TransferOrder.COMPLETED and emits no new Auction}. Different
          side-effects per branch — meets §0.5 branching definition. Lot is
          a different entity from Payment (the other instance).
        test_recipe:
          setup:
            - "POST /lots; clock-advance; open Auction with no bids; clock-advance past end → UNSOLD → Lot.status = AUCTIONED with new round-2 Auction row."
          trigger:
            - "GET /lots/{lot_id}; GET /auctions to enumerate."
          assert:
            - "Lot.round_number == 2"
            - "Two Auction rows exist for this lot_id"
            - "Lot.status == 'ANNOUNCED' (after AUCTIONED→ANNOUNCED branch taken)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:

      - name: payment_forfeit_cascade_depth_3
        grounds:
          - state_machines.Payment.OVERDUE_to_FORFEITED
          - state_machines.Deposit.PAID_to_FORFEITED
          - state_machines.Lot.AUCTIONED_to_ANNOUNCED
          - entities.Lot.fields.round_number
        distinguishing_aspect: |
          Originating transition: POST /payments/{id}/forfeit (depth 1
          mutates Payment.status to FORFEITED). The FORFEITED-Payment
          mutation itself (not the original call) triggers depth 2 — winner
          Deposit.status PAID→FORFEITED. The FORFEITED-Deposit mutation
          itself triggers depth 3 — Lot.round_number++ and creation of a new
          Auction row (Lot.AUCTIONED→ANNOUNCED). Each link is caused by the
          previous link; this is a chain, not fan-out. Trigger differs from
          the other cascade instance below (different starting transition).
        test_recipe:
          setup:
            - "Full pipeline to Payment with status=OVERDUE past GRACE_FORFEITURE_DAYS."
          trigger:
            - "POST /payments/{id}/forfeit"
          assert:
            - "Payment.status == 'FORFEITED' (depth 1)"
            - "Winner Deposit.status == 'FORFEITED' (depth 2, caused by Payment update)"
            - "Lot.round_number == 2 (depth 3, caused by Deposit update)"
            - "A new Auction row exists with round_number=2"

      - name: auction_close_refund_cascade_depth_2
        grounds:
          - state_machines.Auction.LIVE_to_SOLD
          - state_machines.Deposit.PAID_to_REFUNDED
          - entities.Deposit.fields.refund_due_at
        distinguishing_aspect: |
          Originating transition: clock-advance past Auction.effective_end_at
          (depth 1 mutates Auction.status LIVE→SOLD). The SOLD-Auction
          mutation itself triggers depth 2 — every non-winner Deposit
          PAID→REFUNDED with refund_due_at = now + 72h pinned on each. Trigger
          (auction close) differs from payment-forfeit cascade (POST forfeit).
        test_recipe:
          setup:
            - "Three PAID deposits A, B, C; bids by A (100), B (200), C (300) in cents (above starting); only C wins."
          trigger:
            - "POST /_clock/advance past Auction.effective_end_at."
          assert:
            - "Auction.status == 'SOLD' (depth 1)"
            - "Deposit A.status == 'REFUNDED' (depth 2)"
            - "Deposit B.status == 'REFUNDED' (depth 2)"
            - "Deposit C.status == 'PAID' (winner, NOT refunded — discriminates real cascade from fan-out)"
            - "Deposit A.refund_due_at and B.refund_due_at == close_time + 72h"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_fiscal_partial_payment_on_forfeited
        grounds:
          - validations[priority=5]
          - validations[priority=15]
          - errors.ERR_INVALID_STATE
          - errors.ERR_PARTIAL_PAYMENT_REJECTED
        distinguishing_aspect: |
          Dual-failure: caller POSTs /payments/{id}/settle with amount LESS
          than balance_due AND on a Payment whose status already advanced
          to FORFEITED. Both `state` (priority 5) and `business_fiscal`
          (priority 15) fail. Pinned priority returns ERR_INVALID_STATE (5
          wins over 15). Categories: state vs business_fiscal.
        test_recipe:
          setup:
            - "Build a Payment, clock-forward to FORFEITED."
          trigger:
            - "POST /payments/{id}/settle with amount_cents = 1 (also a partial)."
          assert:
            - "Response status code == 409"
            - "Response error_id == 'ERR_INVALID_STATE' (priority 5 wins over priority 15)"

      - name: safety_vs_referential_real_estate_handover
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors.ERR_BIDDER_NOT_ACTIVE
          - errors.ERR_TENANCY_NOT_CLEARED
        distinguishing_aspect: |
          Dual-failure: caller is a SUSPENDED Bidder attempting
          POST /transfer-orders/{id}/complete-handover on a REAL_ESTATE
          asset where tenancy_cleared is still false. Both
          business_safety (priority 6) and business_referential (priority 17)
          fail. But wait — handover endpoint allowed for AuctionAdmin only,
          so the more reachable dual is RBAC vs referential. Instead use:
          AuctionAdmin (allowed) calls complete-handover and BOTH the
          handover-not-yet-scheduled state check (priority 5 ERR_INVALID_STATE,
          if status != AGENCY_NOTIFIED) AND tenancy_not_cleared (priority 17)
          fail. State (priority 5) wins. Different pair from the first
          instance — here state vs business_referential, there state vs
          business_fiscal.
        test_recipe:
          setup:
            - "Build a REAL_ESTATE Lot and TransferOrder with status=INITIATED (NOT yet AGENCY_NOTIFIED), tenancy_cleared=false."
          trigger:
            - "POST /transfer-orders/{id}/complete-handover."
          assert:
            - "Response status code == 409"
            - "Response error_id == 'ERR_INVALID_STATE' (priority 5 wins over priority 17 ERR_TENANCY_NOT_CLEARED)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: soft_close_window_strict_less_than
        grounds:
          - calculations.soft_close_extension
          - entities.Auction.fields.effective_end_at
          - entities.Auction.fields.soft_close_window_seconds
        distinguishing_aspect: |
          Numeric boundary on time-delta metric: strict `<`. Bid arriving
          when (effective_end_at - now) == 300s does NOT extend; bid at
          299s DOES extend. Exercised via POST /bids — distinct endpoint
          from the empty-set boundary below.
        test_recipe:
          setup:
            - "Auction LIVE with soft_close_window_seconds=300, soft_close_extension_seconds=300, current effective_end_at = T."
            - "Bidder with PAID deposit ready."
          trigger:
            - "POST /_clock/advance to (T - 300s); POST /bids → observe effective_end_at unchanged."
            - "POST /_clock/advance by +1s (so delta = 299s); POST /bids → observe extension."
          assert:
            - "After first bid at delta=300: Auction.effective_end_at == T (NOT extended — strict '<' boundary)"
            - "After second bid at delta=299: Auction.effective_end_at == new_now + 300s (extension applied)"

      - name: empty_set_no_valid_bids_on_confirmation
        grounds:
          - validations[priority=19]
          - errors.ERR_NO_VALID_BIDS
          - entities.Auction.fields.current_high_cents
        distinguishing_aspect: |
          Empty-set / zero-count boundary on a different metric (collection
          cardinality vs numeric threshold). POST /confirmations against an
          Auction whose current_high_cents is null (zero VALID bids) is
          rejected. Different endpoint (POST /confirmations) from the
          /bids endpoint used by the time-boundary instance above.
        test_recipe:
          setup:
            - "Auction in SOLD status is impossible without bids — but admin can attempt confirmation prematurely on UNSOLD: build an UNSOLD Auction (clock-advance with no bids)."
          trigger:
            - "POST /confirmations with auction_id of the UNSOLD auction."
          assert:
            - "Response status code == 422"
            - "Response error_id == 'ERR_NO_VALID_BIDS'"
            - "Auction.current_high_cents == null"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:

      - name: confirmation_issue_requires_auction_sold
        grounds:
          - state_machines.Confirmation.DRAFT_to_ISSUED
          - state_machines.Auction.LIVE_to_SOLD
          - entities.Auction.fields.status
          - entities.Confirmation.fields.auction_id
        distinguishing_aspect: |
          Confirmation.DRAFT → ISSUED requires the referenced Auction to be
          in state SOLD. Entity pair = (Confirmation, Auction). Differs
          from the second instance (TransferOrder, Payment).
        test_recipe:
          setup:
            - "Auction in LIVE status with one VALID bid; create Confirmation in DRAFT."
          trigger:
            - "POST /confirmations/{id}/issue while Auction.status is still LIVE."
          assert:
            - "Response status code == 409"
            - "Response error_id == 'ERR_INVALID_STATE'"
            - "Confirmation.status remains 'DRAFT'"

      - name: transfer_notify_requires_payment_paid
        grounds:
          - state_machines.TransferOrder.INITIATED_to_AGENCY_NOTIFIED
          - state_machines.Payment.PENDING_to_PAID
          - entities.Payment.fields.status
          - entities.TransferOrder.fields.confirmation_id
        distinguishing_aspect: |
          TransferOrder.INITIATED → AGENCY_NOTIFIED requires the related
          Payment (via confirmation_id) to be in state PAID. Entity pair =
          (TransferOrder, Payment). Different pair from (Confirmation,
          Auction). Foreign-key path is named explicitly:
          TransferOrder.confirmation_id → Confirmation.id; Payment.confirmation_id
          → same Confirmation.id.
        test_recipe:
          setup:
            - "Confirmation ISSUED with Payment.status = PENDING. TransferOrder created in INITIATED."
          trigger:
            - "POST /transfer-orders/{id}/notify-agency before Payment is settled."
          assert:
            - "Response status code == 409"
            - "Response error_id == 'ERR_INVALID_STATE'"
            - "TransferOrder.status remains 'INITIATED'"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:

      - name: inspection_window_closed_interval_adjacency_rejected
        grounds:
          - validations[priority=10]
          - errors.ERR_INSPECTION_WINDOW_CONFLICT
          - entities.Lot.fields.inspection_window_start_at
          - entities.Lot.fields.inspection_window_end_at
        distinguishing_aspect: |
          Interval semantics = CLOSED. Two inspection windows on the SAME
          Lot are rejected even when adjacent (end_at_A == start_at_B).
          Resource entity = Lot. Differs from handover-buffer instance
          below which uses half-open semantics on a different entity.
        test_recipe:
          setup:
            - "POST /lots with inspection_window_start_at = T, end_at = T + 4h."
          trigger:
            - "POST /lots/{id}/inspection-windows with start_at = T + 4h, end_at = T + 8h (adjacent, touching)."
          assert:
            - "Response status code == 409"
            - "Response error_id == 'ERR_INSPECTION_WINDOW_CONFLICT'"
            - "Only one inspection window persists on the Lot (the original)"

      - name: handover_agency_half_open_buffer_4h
        grounds:
          - validations[priority=11]
          - errors.ERR_HANDOVER_AGENCY_BUSY
          - entities.TransferOrder.fields.counterpart_agency
          - entities.TransferOrder.fields.handover_scheduled_at
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN with explicit buffer
          (HANDOVER_BUFFER_HOURS = 4h). Two TransferOrders on the same
          counterpart_agency on the same calendar day must have
          handover_scheduled_at separated by >= 4h; gap == 4h is allowed
          (half-open), gap == 3h59m is rejected. Resource entity =
          TransferOrder (different from Lot). Geometric treatment differs
          from closed-interval adjacency in the other instance.
        test_recipe:
          setup:
            - "Two REAL_ESTATE Lots fully wired through Confirmation+Payment.PAID."
            - "POST /transfer-orders for Lot1 with handover_scheduled_at = T."
          trigger:
            - "POST /transfer-orders for Lot2 with handover_scheduled_at = T + 3h59m."
          assert:
            - "Response status code == 409"
            - "Response error_id == 'ERR_HANDOVER_AGENCY_BUSY'"
            - "Repeating with handover_scheduled_at = T + 4h succeeds (boundary allowed under half-open semantics)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: deposit_refund_preserves_total_escrow_plus_refunded
        grounds:
          - state_machines.Deposit.PAID_to_REFUNDED
          - state_machines.Auction.LIVE_to_SOLD
          - entities.Deposit.fields.amount_cents
          - entities.Deposit.fields.status
        distinguishing_aspect: |
          Conserved quantity: total deposit cents across all bidders on an
          auction = SUM(Deposit.amount_cents) for that auction, partitioned
          into in-escrow (status=PAID) + refunded (status=REFUNDED) +
          forfeited (status=FORFEITED). Forward action (auction close)
          paired with compensating action (cascade refund) MUST leave
          SUM(amount_cents WHERE status IN {PAID, REFUNDED, FORFEITED})
          unchanged. Specifically: pre-close escrow_paid = N * D; post-close
          (winner stays PAID, losers all REFUNDED) escrow_paid + refunded =
          D + (N-1)*D = N*D. Quantity type: monetary cents conservation.
        test_recipe:
          setup:
            - "Auction with deposit_amount_cents = 7000000. Three PAID deposits."
            - "Bids in order: A(70000000), B(70500000), C(71000000)."
          trigger:
            - "POST /_clock/advance past Auction.effective_end_at."
          assert:
            - "pre_total = 3 * 7000000 = 21000000"
            - "post_total = sum(Deposit.amount_cents for all 3) == 21000000 (status partition: 1 PAID winner + 2 REFUNDED losers)"
            - "Specifically: 7000000 (winner PAID) + 7000000 (loser1 REFUNDED) + 7000000 (loser2 REFUNDED) == 21000000"
            - "Invariant: pre_total == post_total"

      - name: reauction_preserves_round_count_invariant
        grounds:
          - state_machines.Lot.AUCTIONED_to_ANNOUNCED
          - state_machines.Confirmation.DRAFT_to_FAILED
          - entities.Lot.fields.round_number
          - entities.Auction.fields.lot_id
        distinguishing_aspect: |
          Conserved quantity: Lot.round_number == COUNT(Auction WHERE
          lot_id == this.id). Different quantity type from monetary
          conservation — this is structural/ordinal (count integrity).
          Forward action (Confirmation.FAIL trigger) paired with
          compensating action (new Auction row creation) MUST leave the
          invariant `Lot.round_number == COUNT(Auction rows)` intact.
          A naive impl that increments round_number without creating the
          new Auction (or vice versa) breaks the invariant.
        test_recipe:
          setup:
            - "Full pipeline: Lot → Auction(round=1)→ SOLD → Confirmation(DRAFT)."
          trigger:
            - "POST /confirmations/{id}/fail with failure_reason=COLLUSION_FOUND."
          assert:
            - "Lot.round_number == 2"
            - "COUNT(Auction WHERE lot_id == this.id) == 2"
            - "Lot.round_number == COUNT(Auction rows for this lot) (invariant holds)"
