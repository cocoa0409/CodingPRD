            - "LossJob.${job_id}.drying_status == DRY_STANDARD_MET"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_state_vs_safety_priority
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.LossJob.FNOL_to_DISPATCHED
        distinguishing_aspect: |
          state (ERR_INVALID_STATE, p6) vs business_safety (ERR_CERTIFICATION_MISMATCH, p8):
          dispatching an already-DISPATCHED job with a wrong-certification technician violates
          both; the lower-priority-number state check wins, so ERR_INVALID_STATE (409) is returned.
        test_recipe:
          setup:
            - "A WATER job already DISPATCHED; a registered technician with WRT cert that would also pass dispatch, plus a second AMRT-only tech that mismatches WATER."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P9", peril: "WATER", coverage_limit_cents: 500000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Good Tech", certification: "WRT" }
              as: PlatformAdmin
              captures: { good_tech: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Mold Tech", certification: "AMRT" }
              as: PlatformAdmin
              captures: { mold_tech: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "9 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${good_tech}" }
              as: Dispatcher
          trigger:
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${mold_tech}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "data.error_id == ERR_INVALID_STATE (state p6 beats certification p8)"

      - name: approve_state_vs_fiscal_priority
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - state_machines.ScopeEstimate.DRAFT_to_APPROVED
        distinguishing_aspect: |
          state (ERR_INVALID_STATE, p6) vs business_fiscal (ERR_OVER_COVERAGE_LIMIT, p12), a
          different category pair than the dispatch instance: approving an already-SUPERSEDED estimate
          whose total also exceeds coverage returns the lower-number ERR_INVALID_STATE (409).
        test_recipe:
          setup:
            - "A claim coverage_limit_cents=30000; a WATER job with no chambers; estimate E1 (scope 50000, total 50000 > limit) then a newer E2 which supersedes E1 (E1 -> SUPERSEDED)."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P10", peril: "WATER", coverage_limit_cents: 30000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "10 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v1: $.data.version }
            - call: "POST /restoration/estimates"
              payload: { job_id: "${job_id}", estimated_drying_days: 1, line_items: [ { qty: 5, unit_price_cents: 10000 } ], expected_job_version: "${job_v1}" }
              as: Estimator
              captures: { e1: $.data.id, e1_total: $.data.estimate_total_cents }
            - call: "GET /restoration/jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_v_now: $.data.version }
            - call: "POST /restoration/estimates"
              payload: { job_id: "${job_id}", estimated_drying_days: 1, line_items: [ { qty: 5, unit_price_cents: 10000 } ], expected_job_version: "${job_v_now}" }
              as: Estimator
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /restoration/estimates/${e1}/approve"
              payload: {}
              as: Adjuster
              as_user_id: "adj-1"
              captures: { err: $.data.error_id }
          assert:
            - "ScopeEstimate.${e1}.status == SUPERSEDED before the trigger"
            - "trigger response status == 409"
            - "data.error_id == ERR_INVALID_STATE (state p6 beats fiscal p12)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: dry_threshold_inclusive_boundary
        grounds:
          - calculations.chamber_dry_determination
          - entities.DryingChamber.fields.is_dry
        distinguishing_aspect: |
          Numeric <= boundary on the readings endpoint: with dry_standard_pct=12 and DRY_TOLERANCE_PCT=4,
          a reading mc=16 (exactly 12+4) is DRY (is_dry true), while mc=17 (one above) is NOT DRY.
        test_recipe:
          setup:
            - "A WATER chamber R1 with dry_standard_pct=12; one reading mc=16 then a higher chamber R2 reading mc=17 (separate chamber) for the false side."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P11", peril: "WATER", coverage_limit_cents: 500000 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Tech A", certification: "WRT" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "11 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/jobs/${job_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch1: $.data.id }
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R2", floor_area_sqft: 100, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { ch2: $.data.id }
            - call: "POST /restoration/chambers/${ch2}/readings"
              payload: { temp_f: 78, relative_humidity_pct: 55, moisture_content_pct: 17 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /restoration/chambers/${ch1}/readings"
              payload: { temp_f: 78, relative_humidity_pct: 55, moisture_content_pct: 16 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { gpp16: $.data.gpp }
          assert:
            - "DryingChamber.${ch1}.is_dry == true (mc=16 == 12+4, inclusive)"
            - "DryingChamber.${ch2}.is_dry == false (mc=17 > 12+4)"

      - name: contents_waterfall_empty_included_set
        grounds:
          - calculations.contents_valuation_waterfall
          - entities.ContentsItem.fields.allocated_value_cents
          - entities.ContentsItem.fields.status
        distinguishing_aspect: |
          Empty-collection boundary on a different endpoint (contents/value): when every contents item
          is RETURNED (the included set {PACKED_OUT, STORED} is empty), the waterfall allocates 0 —
          allocated_total_cents == 0, distinct from the numeric dry-threshold metric above.
        test_recipe:
          setup:
            - "A WATER job with one ContentsItem packed out then RETURNED so the included set {PACKED_OUT, STORED} is empty; claim coverage 100000 deductible 0."
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "P12", peril: "WATER", coverage_limit_cents: 100000, deductible_cents: 0 }
              as: Adjuster
              as_user_id: "adj-1"
              captures: { claim_id: $.data.id }
            - call: "POST /restoration/technicians"
              payload: { full_name: "Tech A", certification: "WRT" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /restoration/jobs"
              payload: { claim_id: "${claim_id}", property_address: "12 Main", loss_type: "WATER", water_category: 1, water_class: 1 }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /restoration/contents"
              payload: { job_id: "${job_id}", description: "Sofa", declared_value_cents: 50000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { item1: $.data.id }
            - call: "POST /restoration/contents/${item1}/return"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /restoration/jobs/${job_id}/contents/value"
              payload: {}
              as: Adjuster
              as_user_id: "adj-1"
              captures: { alloc_total: $.data.allocated_total_cents }
          assert:
            - "ContentsItem.${item1}.status == RETURNED"
            - "data.allocated_total_cents == 0"
            - "ContentsItem.${item1}.allocated_value_cents == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: job_complete_requires_all_chambers_dried
        grounds:
          - state_machines.LossJob.MONITORING_to_COMPLETED
          - entities.DryingChamber.fields.status
          - entities.LossJob.fields.drying_status
        distinguishing_aspect: |
          Entity pair LossJob -> DryingChamber: LossJob's MONITORING->COMPLETED transition is gated on
          every non-DECOMMISSIONED DryingChamber being DRIED; a wet chamber blocks completion with
          ERR_DRY_STANDARD_NOT_MET.
