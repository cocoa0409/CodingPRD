  - rule_id: resource_temporal_overlap
    instances:

      - name: stage_changeover_buffer_boundary_one_minute_either_side
        grounds:
          - validations[priority=33]
          - entities.MixStage.fields.changeover_minutes
          - calculations.stage_booking_cost
          - calculations.stage_hours_ledger
          - errors.ERR_STAGE_WINDOW_CONFLICT
        distinguishing_aspect: |
          Stage occupancy is half-open AND buffered on both sides: with changeover_minutes 45 and an
          existing window ending 13:00, a new window starting 13:44 conflicts while 13:45 — exactly
          end + buffer — does not. The accepted booking reserves 2.00 hours at 240000 cents and
          lifts the project's reserved hours to 5.00, proving the boundary call was a real
          reservation and not a silent no-op.
        test_recipe:
          setup:
            - "Stage with changeover_minutes 45 and hourly_rate_cents 120000."
            - "Mixer certified for THEATRICAL; STANDARD project with 40.00 authorized hours, picture LOCKED."
            - "Existing RESERVED PREMIX booking 2026-09-14T10:00:00Z -> 13:00:00Z (3.00 hours, provisional 360000)."
            - "Two candidate FINAL_MIX windows: 13:44 -> 15:44 (inside the buffer) and 13:45 -> 15:45 (exactly at the buffer edge)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
