# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3116_electronic_prescribing_network_routing_directory_medication_history
#
# Nine Difficulty Rules from SKILL.md §0.5, 20 instances total (≥2 per rule).
# Every instance grounds in §1.1–§1.6 of SCAFFOLD.yaml and every test_recipe is
# an ordered chain of §1.5 endpoint calls driving empty-DB to the setup state.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: reliability_ratio_dual_variant_on_directory_endpoint
        grounds:
          - calculations.reliability_factor
          - calculations.reliability_factor.variants.chronological_window
          - calculations.reliability_factor.variants.ewma_decay
          - entities.DirectoryEndpoint.fields.reliability_ratio
          - entities.DirectoryEndpoint.fields.reliability_ratio_ewma
          - state_machines.DirectoryEndpoint.transitions.ACTIVE_to_DEGRADED
        distinguishing_aspect: "On the DirectoryEndpoint domain the identical delivered attempt history yields reliability_ratio 0.6667 (which trips the ACTIVE->DEGRADED gate at < 0.90) and reliability_ratio_ewma 0.93300000 (which would not), so the two variants disagree about whether this endpoint should degrade."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Riverbend Pharmacy is CERTIFIED and owns two in-window NEW_RX endpoints, both ACTIVE with empty attempt history. One prescription has been signed and re-routed three times, its first two attempts reported ACKNOWLEDGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "Northside Family Clinic", participant_type: "PRESCRIBER_CLINIC", npi: "1111111111", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0100" }
              as: NetworkOperator
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /network/participants"
              payload: { name: "Riverbend Pharmacy", participant_type: "PHARMACY", npi: "2222222222", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0200" }
              as: NetworkOperator
              captures: { ph_id: $.data.id, ph_v: $.data.version }
            - call: "POST /network/participants"
              payload: { name: "Meridian Health Plan", participant_type: "PAYER", npi: "3333333333", plan_copay_cents: 1500, plan_coinsurance_pct: 0.2, plan_deductible_cents: 10000, plan_deductible_met_cents: 4000, plan_brand_fee_cents: 300, formulary_preferred_pct: 0.3, plan_benefit_cap_cents: 50000 }
              as: NetworkOperator
              captures: { payer_id: $.data.id, payer_v: $.data.version }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 15, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_a_id: $.data.id }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 30, message_standard: "NCPDP_SCRIPT_2017071", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_b_id: $.data.id }
            - call: "POST /network/participants/${ph_id}/certification/start"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certification/tests"
              payload: { test_code: "CONNECTIVITY", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certification/tests"
              payload: { test_code: "SCRIPT_NEW_RX", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certify"
              payload: { expected_participant_version: "${ph_v}" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${cl_id}/certification/start"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certification/tests"
              payload: { test_code: "CONNECTIVITY", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certification/tests"
              payload: { test_code: "SCRIPT_NEW_RX", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certify"
              payload: { expected_participant_version: "${cl_v}" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/patients"
              payload: { full_name: "Iris Nakamura", date_of_birth: "1979-04-02T00:00:00Z", home_state: "MA", covered_plan_payer_id: "${payer_id}" }
              as: PatientService
              captures: { pa_id: $.data.id }
            - call: "POST /network/prescriptions"
              payload: { prescriber_id: "${cl_id}", receiving_pharmacy_id: "${ph_id}", patient_id: "${pa_id}", drug_ndc: "00093314905", transaction_type: "NEW_RX", controlled_schedule: "NON_CONTROLLED", message_standard: "NCPDP_SCRIPT_2022011", days_supply: 30, quantity: 60, refills_authorized: 3 }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp_code: $.data.otp_challenge_code }
            - call: "POST /network/signing-sessions/${ss_id}/verify-otp"
              payload: { otp_code: "${otp_code}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/prescriptions/${rx_id}/sign"
              payload: { signing_session_id: "${ss_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { v_after_sign: $.data.version }
            - call: "POST /network/prescriptions/${rx_id}/route"
              payload: { expected_prescription_version: "${v_after_sign}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { v_after_route1: $.data.version }
            - call: "GET /network/prescriptions/${rx_id}/attempts"
              payload: {}
              as: NetworkOperator
              captures: { att1_id: "$.data[0].id" }
            - call: "POST /network/routing-attempts/${att1_id}/report-acknowledged"
              payload: {}
              as: NetworkOperator
            - call: "GET /network/prescriptions/${rx_id}"
              payload: {}
              as: NetworkOperator
              captures: { v_before_route2: $.data.version }
            - call: "POST /network/prescriptions/${rx_id}/route"
              payload: { expected_prescription_version: "${v_before_route2}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "GET /network/prescriptions/${rx_id}/attempts"
              payload: {}
              as: NetworkOperator
              captures: { att2_id: "$.data[1].id" }
            - call: "POST /network/routing-attempts/${att2_id}/report-acknowledged"
              payload: {}
              as: NetworkOperator
            - call: "GET /network/prescriptions/${rx_id}"
              payload: {}
              as: NetworkOperator
              captures: { v_before_route3: $.data.version }
            - call: "POST /network/prescriptions/${rx_id}/route"
              payload: { expected_prescription_version: "${v_before_route3}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "GET /network/prescriptions/${rx_id}/attempts"
              payload: {}
              as: NetworkOperator
              captures: { att3_id: "$.data[2].id" }
          trigger:
            - call: "POST /network/routing-attempts/${att3_id}/report-undeliverable"
              payload: { failure_code: "TRANSMISSION_TIMEOUT" }
              as: NetworkOperator
          assert:
            - "DirectoryEndpoint.${ep_a_id}.reported_attempt_count == 3"
            - "DirectoryEndpoint.${ep_a_id}.acknowledged_count == 2"
            - "DirectoryEndpoint.${ep_a_id}.reliability_ratio == 0.6667"
            - "DirectoryEndpoint.${ep_a_id}.reliability_ratio_ewma == 0.93300000"
            - "the two variants disagree at the gate: reliability_ratio < 0.90 is true while reliability_ratio_ewma < 0.90 is false"
            - "DirectoryEndpoint.${ep_a_id}.status == DEGRADED"
            - "DirectoryEndpoint.${ep_b_id}.status == ACTIVE and DirectoryEndpoint.${ep_b_id}.reliability_ratio == 1.0"

      - name: benefit_cost_estimate_dual_variant_on_benefit_check
        grounds:
          - calculations.benefit_cost_estimate
          - calculations.benefit_cost_estimate.variants.provisional_at_prescribe
          - calculations.benefit_cost_estimate.variants.final_at_fill
          - entities.BenefitCheck.fields.pricing_variant
          - entities.BenefitCheck.fields.estimated_patient_pay_cents
          - entities.BenefitCheck.fields.estimated_plan_pay_cents
        distinguishing_aspect: "On the BenefitCheck domain the brand fee sits outside the deductible-credit basis in the provisional variant and inside it in the final variant, so the same check priced at the point of prescribing and again at fill time splits 3100/5200 then 3400/4900 — the same 8300 total with 300 cents moving from the plan to the patient."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The patient holds an ACTIVE BOTH-scope consent of 365 days, granting through 2027-09-01T00:00:00Z. The payer plan deductible is already at 4000 of 10000 — the snapshot the check must freeze."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "Northside Family Clinic", participant_type: "PRESCRIBER_CLINIC", npi: "1111111111", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0100" }
              as: NetworkOperator
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /network/participants"
              payload: { name: "Riverbend Pharmacy", participant_type: "PHARMACY", npi: "2222222222", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0200" }
              as: NetworkOperator
              captures: { ph_id: $.data.id, ph_v: $.data.version }
            - call: "POST /network/participants"
              payload: { name: "Meridian Health Plan", participant_type: "PAYER", npi: "3333333333", plan_copay_cents: 1500, plan_coinsurance_pct: 0.2, plan_deductible_cents: 10000, plan_deductible_met_cents: 4000, plan_brand_fee_cents: 300, formulary_preferred_pct: 0.3, plan_benefit_cap_cents: 50000 }
              as: NetworkOperator
              captures: { payer_id: $.data.id, payer_v: $.data.version }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 15, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_id: $.data.id }
            - call: "POST /network/participants/${cl_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "SENDER", service_level: "ELIGIBLE_A", sla_response_minutes: 15, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
              captures: { clep_id: $.data.id }
            - call: "POST /network/participants/${ph_id}/certification/start"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certification/tests"
              payload: { test_code: "CONNECTIVITY", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certification/tests"
              payload: { test_code: "SCRIPT_NEW_RX", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certify"
              payload: { expected_participant_version: "${ph_v}" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${cl_id}/certification/start"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certification/tests"
              payload: { test_code: "CONNECTIVITY", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certification/tests"
              payload: { test_code: "SCRIPT_NEW_RX", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certify"
              payload: { expected_participant_version: "${cl_v}" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/patients"
              payload: { full_name: "Marta Osei", date_of_birth: "1965-11-20T00:00:00Z", home_state: "MA", covered_plan_payer_id: "${payer_id}" }
              as: PatientService
              captures: { pa_id: $.data.id }
            - call: "POST /network/patients/${pa_id}/consents"
              payload: { scope: "BOTH", duration_days: 365 }
              as: PatientService
              captures: { cns_id: $.data.id }
            - call: "POST /network/prescriptions"
              payload: { prescriber_id: "${cl_id}", receiving_pharmacy_id: "${ph_id}", patient_id: "${pa_id}", drug_ndc: "00093314905", transaction_type: "NEW_RX", controlled_schedule: "NON_CONTROLLED", message_standard: "NCPDP_SCRIPT_2022011", days_supply: 30, quantity: 60, refills_authorized: 0 }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /network/benefit-checks"
              payload: { prescription_id: "${rx_id}", payer_id: "${payer_id}", benchmark_price_cents: 8000 }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { bc_id: $.data.id, bc_snapshot: $.data.deductible_met_snapshot_cents }
          trigger:
            - call: "POST /network/benefit-checks/${bc_id}/evaluate"
              payload: {}
              as: Pharmacy
              as_user_id: "${ph_id}"
              captures: { prov_patient: $.data.estimated_patient_pay_cents, prov_plan: $.data.estimated_plan_pay_cents }
            - call: "POST /network/benefit-checks/${bc_id}/complete"
              payload: {}
              as: Pharmacy
              as_user_id: "${ph_id}"
              captures: { fin_patient: $.data.estimated_patient_pay_cents, fin_plan: $.data.estimated_plan_pay_cents }
          assert:
            - "BenefitCheck.${bc_id}.deductible_met_snapshot_cents == 4000"
            - "the evaluate response carries pricing_variant == PROVISIONAL, estimated_patient_pay_cents == 3100 and estimated_plan_pay_cents == 5200"
            - "the complete response carries pricing_variant == FINAL, estimated_patient_pay_cents == 3400 and estimated_plan_pay_cents == 4900"
            - "the variants agree on the sum but not the split: 3100 + 5200 == 3400 + 4900 == 8300"
            - "NetworkParticipant.${payer_id}.plan_deductible_met_cents == 6700 — the final variant credited min(10000 - 4000, 3100 + 300), while the provisional variant would have credited only 3100 and left 6400"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: routing_endpoint_selection_clamped_marginal_schedule
        grounds:
          - calculations.routing_endpoint_selection
          - entities.DirectoryEndpoint.fields.service_level
          - entities.DirectoryEndpoint.fields.sla_response_minutes
          - entities.DirectoryEndpoint.fields.reliability_ratio
          - entities.DirectoryEndpoint.fields.message_standard
          - validations[priority=7]
        distinguishing_aspect: "Mode (a): the selector chains six ranked keys over the eligibility-filtered candidate set — message-standard match outranks service level, which outranks the contracted SLA, which outranks the chronological reliability ratio — so an ELIGIBLE_B endpoint with a 5-minute SLA loses to an ELIGIBLE_A endpoint with a 15-minute SLA and a standard-matched endpoint loses to nothing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three in-window NEW_RX endpoints on Riverbend Pharmacy, all ACTIVE with empty attempt history: ELIGIBLE_A/15min on 2022011, ELIGIBLE_A/10min on 2017071, ELIGIBLE_B/5min on 2022011. The order is a non-controlled NEW_RX on the 2022011 standard."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "Northside Family Clinic", participant_type: "PRESCRIBER_CLINIC", npi: "1111111111", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0100" }
              as: NetworkOperator
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /network/participants"
              payload: { name: "Riverbend Pharmacy", participant_type: "PHARMACY", npi: "2222222222", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0200" }
              as: NetworkOperator
              captures: { ph_id: $.data.id, ph_v: $.data.version }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 15, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_winner_id: $.data.id }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 10, message_standard: "NCPDP_SCRIPT_2017071", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_std_mismatch_id: $.data.id }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_B", sla_response_minutes: 5, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_servb_id: $.data.id }
            - call: "POST /network/participants/${cl_id}/endpoints"
              payload: { service_set: "NEW_RX", endpoint_role: "SENDER", service_level: "ELIGIBLE_A", sla_response_minutes: 15, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${ph_id}/certification/start"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certification/tests"
              payload: { test_code: "CONNECTIVITY", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certification/tests"
              payload: { test_code: "SCRIPT_NEW_RX", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certify"
              payload: { expected_participant_version: "${ph_v}" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${cl_id}/certification/start"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certification/tests"
              payload: { test_code: "CONNECTIVITY", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certification/tests"
              payload: { test_code: "SCRIPT_NEW_RX", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/participants/${cl_id}/certify"
              payload: { expected_participant_version: "${cl_v}" }
              as: ParticipantAdmin
              as_user_id: "${cl_id}"
            - call: "POST /network/patients"
              payload: { full_name: "Colm Dwyer", date_of_birth: "1988-02-14T00:00:00Z", home_state: "MA" }
              as: PatientService
              captures: { pa_id: $.data.id }
            - call: "POST /network/prescriptions"
              payload: { prescriber_id: "${cl_id}", receiving_pharmacy_id: "${ph_id}", patient_id: "${pa_id}", drug_ndc: "00093314905", transaction_type: "NEW_RX", controlled_schedule: "NON_CONTROLLED", message_standard: "NCPDP_SCRIPT_2022011", days_supply: 30, quantity: 60, refills_authorized: 3 }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp_code: $.data.otp_challenge_code }
            - call: "POST /network/signing-sessions/${ss_id}/verify-otp"
              payload: { otp_code: "${otp_code}" }
              as: Prescriber
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /network/prescriptions/${rx_id}/sign"
              payload: { signing_session_id: "${ss_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { v_signed: $.data.version }
            - call: "POST /network/prescriptions/${rx_id}/route"
              payload: { expected_prescription_version: "${v_signed}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { chosen_ep: $.data.routed_endpoint_id }
          assert:
            - "Prescription.${rx_id}.routed_endpoint_id == ${ep_winner_id}"
            - "the ELIGIBLE_B endpoint at a 5-minute SLA (${ep_servb_id}) is not selected: rank key 3 (service level) outranks rank key 4 (SLA)"
            - "the ELIGIBLE_A endpoint at a 10-minute SLA on the 2017071 standard (${ep_std_mismatch_id}) is not selected: rank key 2 (standard match) outranks rank key 3 (service level)"
            - "Prescription.${rx_id}.routing_status == ROUTED and clinical_status == ROUTED"
            - "GET /network/participants/${ph_id}/endpoints returns exactly 3 rows, all ACTIVE"

      - name: transaction_fee_settlement_clamp_before_tiering
        grounds:
          - calculations.transaction_fee_settlement
          - calculations.transaction_fee_settlement.variants.monthly_settlement
          - entities.TransactionFeeEntry.fields.fee_tier
          - entities.TransactionFeeEntry.fields.fee_cents
          - entities.NetworkParticipant.fields.volume_billing_mode
        distinguishing_aspect: "Mode (b): the chargeable total is clamped to the 7500 monthly ceiling before the marginal tier schedule is applied rather than after, so a 7825-count sender cell and an 8000-count sender cell both settle at 60100 where the unclamped schedule would give 82275 and 88975."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Northside Family Clinic is a MONTHLY sender and Riverbend Pharmacy a ROLLING_90_DAY sender. No fee rows exist for either participant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "Northside Family Clinic", participant_type: "PRESCRIBER_CLINIC", npi: "1111111111", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0100" }
              as: NetworkOperator
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /network/participants"
              payload: { name: "Riverbend Pharmacy", participant_type: "PHARMACY", npi: "2222222222", volume_billing_mode: "ROLLING_90_DAY", fallback_channel: "FAX", fax_number: "+1-555-0200" }
              as: NetworkOperator
              captures: { ph_id: $.data.id }
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 7825 }
              as: NetworkOperator
              captures: { e_hi_id: $.data.id }
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 8000 }
              as: NetworkOperator
              captures: { e_over_id: $.data.id }
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${ph_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 500 }
              as: NetworkOperator
              captures: { e_mid_id: $.data.id }
          trigger:
            - call: "POST /network/transaction-fees/${e_hi_id}/reverse"
              payload: { expected_participant_version: "${cl_v}" }
              as: NetworkOperator
              captures: { comp_fee: $.data.fee_cents, comp_count: $.data.transaction_count, comp_entry_id: $.data.id }
          assert:
            - "TransactionFeeEntry.${e_hi_id}.transaction_count == 7825, fee_tier == VOLUME and fee_cents == 60100"
            - "TransactionFeeEntry.${e_over_id}.transaction_count == 8000 and fee_cents == 60100 — the pre-tier clamp makes 7825 and 8000 settle identically"
            - "the unclamped marginal schedule would have produced 5500*12 + 2325*7 == 82275 for 7825, which is the value this scaffold must NOT produce"
            - "TransactionFeeEntry.${e_mid_id}.fee_cents == 3600 (300*12 + 0*7) for the 500-count cell"
            - "TransactionFeeEntry.${comp_entry_id}.fee_cents == -60100, transaction_count == -7825 and entry_type == MANUAL_REVERSAL"
            - "TransactionFeeEntry.${e_hi_id}.status == REVERSED and its reversal_entry_id == ${comp_entry_id}"
            - "the conserved quantity is unchanged: NetworkParticipant.${cl_id}.period_net_total_cents == 60100 before the reversal (60100 + 60100) and still 60100 after it (60100 + 60100 + -60100)"
            - "the conserved count is unchanged: the 2026-09 NEW_RX/SENT cell sums transaction_count to 15825 both before and after the compensating row"
