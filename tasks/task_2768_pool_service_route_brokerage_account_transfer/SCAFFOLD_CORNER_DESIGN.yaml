      - name: offer_from_a_buyer_still_pending_qualification_rejected
        claim_type: violation_to_error
        grounds:
          - "errors.ERR_BUYER_NOT_QUALIFIED"
          - "validations[priority=39]"
          - "entities.Buyer.fields.qualification_status"
          - "endpoints[POST /deals]"
        distinguishing_aspect: "PENDING is not a soft state: the buyer is LICENSED and prequalified to 30000000, far above the 340000 offer, yet the offer is refused until the brokerage records its own APPROVE decision -- so the prequalification amount and the qualification verdict are two independent gates."
        test_recipe:
          setup:
