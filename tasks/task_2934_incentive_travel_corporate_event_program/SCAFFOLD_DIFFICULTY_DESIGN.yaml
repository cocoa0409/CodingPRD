        (44-minute gap), A3 13:45:00Z-16:30:00Z (exactly 45 minutes).'
      - A already holds a BOOKED signup on A1, so A1 is the only interval in the comparison set.
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Presidents Circle
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2026-01-01T00:00:00Z'
