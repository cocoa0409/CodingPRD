# =============================================================================
# Task 0021: Flight Delay Claims — SCAFFOLD_DIFFICULTY_DESIGN.yaml
# §1.8 Test Targeting Index. Every instance grounds in elements declared in
# SCAFFOLD.yaml §1.1–§1.6. §0.5 of the scaffold-generator skill is authoritative
# for each rule_id's full text and differentiation clause.
# =============================================================================

scaffold_difficulty_design:

  # --------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # --------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: delay_basis_departure_vs_arrival
        grounds:
          - calculations.delay_duration
          - entities.Policy.fields.delay_basis
          - entities.ClaimSegment.fields.delay_minutes_used
          - state_machines.Claim.MATCHED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Operates on the ClaimSegment/Flight domain (per-flight time math). Computes
          two different delay_minutes values for the SAME Flight: variant A subtracts
          scheduled_departure from actual_departure, variant B subtracts
          scheduled_arrival from actual_arrival. Same flight can land in TIER_A
          under DEPARTURE basis and TIER_B under ARRIVAL basis when the aircraft
          made up time in flight (or lost time arriving).
        test_recipe:
          setup:
            - "Create insurer with currency=EUR; clock at 0"
            - "Create policy P_DEP (delay_basis=DEPARTURE, payout_mode=FIXED, deductible=2500, limit=150000, quota=1000000, waiting_period_ms=0)"
            - "Create policy P_ARR identical to P_DEP but delay_basis=ARRIVAL"
            - "Create flight F (scheduled_departure=10_000_000, scheduled_arrival=15_000_000 — i.e. 5000s nominal)"
            - "Ingest 2 FlightStatusEvents from AIRLINE+AVIATION_AUTHORITY: actual_departure=10_000_000+200*60_000 (200 min late dep), actual_arrival=15_000_000+90*60_000 (only 90 min late arr) — flight made up 110 min in air"
            - "Advance clock past arrival, run /_sweep/run; flight transitions ACTIVE→LANDED"
            - "Create ticket T_DEP under P_DEP and T_ARR under P_ARR, each on F (same passenger doc)"
            - "Create claim C_DEP (ticket_ids=[T_DEP]) and C_ARR (ticket_ids=[T_ARR]), both auto-MATCHED"
            - "Submit both for review"
          trigger:
            - "GET /claims/C_DEP"
            - "GET /claims/C_ARR"
          assert:
            - "C_DEP.segments[0].delay_minutes_used == 200 (DEPARTURE variant)"
            - "C_ARR.segments[0].delay_minutes_used == 90 (ARRIVAL variant)"
            - "C_DEP.segments[0].tier_selected == 'TIER_B'"
            - "C_ARR.segments[0].tier_selected == 'TIER_A'"
            - "C_DEP.segments[0].gross_segment_payout_cents == 25000"
            - "C_ARR.segments[0].gross_segment_payout_cents == 10000"

      - name: optimistic_vs_pessimistic_reserve_balance
        grounds:
          - calculations.reserve_balance
          - entities.Policy.fields.reserve_balance_cents
          - endpoints[GET /insurers/{id}/policies/{id}/risk_view]
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Operates on the Policy domain (cumulative reserve accounting), structurally
          different from the per-segment Flight time-math of delay_basis. Same policy
          state yields two different reserve numbers: variant A (stored
          reserve_balance_cents) counts only APPROVED claims; variant B
          (risk_view.pessimistic_reserve_cents) also counts UNDER_REVIEW claims.
          Numbers diverge whenever ≥1 UNDER_REVIEW claim exists.
        test_recipe:
          setup:
            - "Create insurer; create policy P with deductible=2500, limit=150000, quota=10_000_000"
            - "Create flight F1 (actual delay 200 min, basis DEPARTURE), flight F2 (actual delay 200 min)"
            - "Create tickets T1 on F1 and T2 on F2 under P; both ATTACHED"
            - "Create claim C1=[T1] and C2=[T2]; both auto-MATCHED"
            - "Submit both for review (review_status=UNDER_REVIEW); each segment computes gross=25000"
            - "Approve C1 only (review_status=APPROVED, estimated_payout=22500); leave C2 in UNDER_REVIEW"
          trigger:
            - "GET /policies/P (returns stored reserve_balance_cents)"
            - "GET /policies/P/risk_view"
          assert:
            - "Policy.reserve_balance_cents == 22500   # variant A: only APPROVED"
            - "risk_view.optimistic_reserve_cents == 22500"
            - "risk_view.pessimistic_reserve_cents == 45000   # variant B: APPROVED 22500 + UNDER_REVIEW 22500"
            - "risk_view.pessimistic_reserve_cents > risk_view.optimistic_reserve_cents"

  # --------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # --------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_compensation_three_input_nonlinear
        grounds:
          - calculations.tiered_compensation
          - entities.Policy.fields.payout_mode
          - entities.Policy.fields.reimbursement_rate_bps
          - entities.ClaimSegment.fields.claimed_actual_loss_cents
          - entities.ClaimSegment.fields.gross_segment_payout_cents
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs with non-linear interaction. Inputs are
          delay_minutes_used (selects tier breakpoint), payout_mode (branches FIXED
          vs ACTUAL_LOSS), reimbursement_rate_bps, and claimed_actual_loss_cents.
          The branch chosen by payout_mode picks between a tiered constant and a
          floor-rate computation, and the rate computation is then capped by the
          tiered constant — a nested min over a tier-selected ceiling. Two valid
          decomposition orders (rate-cap-then-deductible vs deductible-then-cap)
          would give different totals; the scaffold pins rate-then-cap-per-segment,
          deductible-once-per-claim.
        test_recipe:
          setup:
            - "Create insurer; create policy P (delay_basis=DEPARTURE, payout_mode=ACTUAL_LOSS, reimbursement_rate_bps=5000, deductible=2500, limit=150000, quota=10_000_000, waiting_period_ms=0)"
            - "Create flight F with departure delay = 200 min (TIER_B → cap 25000 per segment)"
            - "Create ticket T on F under P (auto-matched)"
            - "Create claim C = [T] with claimed_actual_loss_cents = 4501 on the segment (set via /claims body)"
            - "Submit for review"
          trigger:
            - "GET /claims/C"
          assert:
            - "C.segments[0].delay_minutes_used == 200"
            - "C.segments[0].tier_selected == 'TIER_B'"
            - "C.segments[0].gross_segment_payout_cents == 2250   # floor(4501 * 5000 / 10000) = 2250; not capped (well below 25000)"

      - name: multi_segment_rounding_order_pinned_per_then_sum
        grounds:
          - calculations.multi_segment_combined_payout
          - calculations.tiered_compensation
          - entities.Claim.fields.estimated_payout_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. With 3 segments each
          ACTUAL_LOSS-claiming 4501/4502/4503 cents at 50% rate: per-segment then
          sum yields 2250+2251+2251=6752; sum then round yields floor(13506*0.5)=
          6753. The scaffold pins per-segment-then-sum. After deductible 2500,
          claim.estimated_payout_cents = 6752 − 2500 = 4252 (NOT 4253).
        test_recipe:
          setup:
            - "Create insurer; create policy P (delay_basis=DEPARTURE, payout_mode=ACTUAL_LOSS, reimbursement_rate_bps=5000, deductible=2500, limit=150000, quota=10_000_000, waiting_period_ms=0)"
            - "Create three flights F1, F2, F3 each with 200 min departure delay"
            - "Create tickets T1/T2/T3 under P (one per flight, same passenger doc)"
            - "Create claim C = [T1, T2, T3] with claimed_actual_loss_cents = 4501, 4502, 4503 respectively"
            - "Submit for review (computes per-segment grosses 2250, 2251, 2251)"
            - "Approve claim with X-User-ID = approver_user (assigned_approver_id set)"
          trigger:
            - "GET /claims/C"
          assert:
            - "[seg.gross_segment_payout_cents for seg in C.segments] == [2250, 2251, 2251]   # per-segment floor"
            - "sum_gross_segments == 6752"
            - "C.estimated_payout_cents == 4252   # 6752 - 2500 deductible; NOT 4253 (which sum-then-round would give)"

      - name: reinsurance_waterfall_circular_pinned_order
        grounds:
          - calculations.reinsurance_waterfall
          - entities.ReinsuranceAllocation.fields.primary_share_cents
          - entities.ReinsuranceAllocation.fields.reinsurer_share_cents
          - state_machines.Claim.EXECUTING_to_PAID
        distinguishing_aspect: |
          Mode (c): circular-looking dependency. Primary insurer's total share
          depends on whether reinsurer absorbs anything, which depends on whether
          final exceeds PRIMARY_RETENTION; but if final exceeds PRIMARY_RETENTION +
          REINSURER_LAYER, primary absorbs the excess too — looking like a feedback
          loop. The scaffold pins evaluation order: primary_first → reinsurer →
          primary_excess. For final=150000 cents (cap-bound payout), this yields
          primary=120000, reinsurer=30000 — NOT primary=150000 reinsurer=0 (which
          would happen if rate-cap were applied before the layer).
        test_recipe:
          setup:
            - "Create insurer; create policy P (delay_basis=DEPARTURE, payout_mode=FIXED, deductible=2500, limit=150000, quota=10_000_000, waiting_period_ms=0)"
            - "Create three flights each with 360+ min delay (TIER_C, fixed=60000 per segment)"
            - "Create ticket per flight, then claim C with 3 segments → sum_gross=180000, after deductible 177500, capped at 150000"
            - "Submit, approve, batch (BatchApprover != approver), execute (BatchExecutor != approver), banking confirms"
          trigger:
            - "POST /claims/C/settle"
            - "GET reinsurance_allocations for claim_id=C (via the audit/list path)"
          assert:
            - "C.final_payout_cents == 150000"
            - "ReinsuranceAllocation.primary_share_cents == 120000   # 50000 retention + 70000 excess"
            - "ReinsuranceAllocation.reinsurer_share_cents == 30000"
            - "ReinsuranceAllocation.primary_share_cents + ReinsuranceAllocation.reinsurer_share_cents == 150000"

  # --------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # --------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_review_revision_cycle
        grounds:
          - state_machines.Claim.MATCHED_to_UNDER_REVIEW
          - state_machines.Claim.UNDER_REVIEW_to_MATCHED
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Claim.fields.review_status
        distinguishing_aspect: |
          Cycle on the Claim entity: MATCHED → UNDER_REVIEW → MATCHED → UNDER_REVIEW
          → APPROVED. The same claim can traverse the loop multiple times via
          /submit_review and /return_to_match before final approval, with
          assigned_reviewer_id cleared on each return. This is non-linear (a cycle).
        test_recipe:
          setup:
            - "Set up an insurer/policy/flight/ticket so a claim auto-MATCHES (delay 200 min)"
          trigger:
            - "POST /claims/C/submit_review (assigned_reviewer_id=R1) → UNDER_REVIEW"
            - "POST /claims/C/return_to_match → MATCHED, assigned_reviewer_id cleared"
            - "POST /claims/C/submit_review (assigned_reviewer_id=R2) → UNDER_REVIEW"
            - "POST /claims/C/approve (assigned_approver_id=A1, A1 != R2) → APPROVED"
          assert:
            - "Final claim.review_status == 'APPROVED'"
            - "claim.assigned_reviewer_id == 'R2' (overwritten in second submit_review)"
            - "claim.assigned_approver_id == 'A1'"
            - "AuditLog has ≥4 STATUS_CHANGE entries on this claim subject reflecting the cycle"

      - name: payout_batch_parallel_phases
        grounds:
          - state_machines.PayoutBatch.STAGED_to_APPROVED
          - state_machines.PayoutBatch.PENDING_to_EXECUTING
          - state_machines.PayoutBatch.EXECUTING_to_EXCEPTIONS
          - state_machines.PayoutBatch.EXCEPTIONS_to_EXECUTING
          - entities.PayoutBatch.fields.review_phase
          - entities.PayoutBatch.fields.execution_phase
        distinguishing_aspect: |
          Parallel state dimensions on a different entity (PayoutBatch). review_phase
          (STAGED → APPROVED|REJECTED) and execution_phase (PENDING → EXECUTING →
          {SETTLED | EXCEPTIONS} ↔ EXECUTING) advance independently on the same
          row. EXECUTING ↔ EXCEPTIONS itself is a cycle within the execution axis.
          Distinct entity from rule 3 instance 1 (Claim), and a different
          non-linear shape (parallel dimensions vs cycle).
        test_recipe:
          setup:
            - "Insurer/policy/flight; create 2 claims, both APPROVED on the same flight"
            - "Create PayoutBatch B for that flight with both claim_ids"
            - "POST /payout_batches/B/approve (review_phase APPROVED; execution_phase still PENDING)"
            - "POST /payout_batches/B/execute (execution_phase EXECUTING; both claims EXECUTING)"
            - "POST /claims/{c1}/mark_exception → batch.execution_phase=EXCEPTIONS, but review_phase stays APPROVED"
          trigger:
            - "POST /payout_batches/B/retry_exceptions → execution_phase EXECUTING again"
            - "POST /claims/{c1}/settle and /claims/{c2}/settle"
            - "POST /_sweep/run"
          assert:
            - "B.review_phase == 'APPROVED' throughout"
            - "B.execution_phase traversed PENDING → EXECUTING → EXCEPTIONS → EXECUTING → SETTLED"
            - "Final B.execution_phase == 'SETTLED' and review_phase == 'APPROVED' (different axes)"

  # --------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # --------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: settle_claim_four_hop_cascade
        grounds:
          - state_machines.Claim.EXECUTING_to_PAID
          - entities.Policy.fields.reserve_balance_cents
          - entities.Policy.fields.claim_quota_used_cents
          - entities.ReinsuranceAllocation
          - entities.ReserveAdjustment
          - entities.OutboxEvent
          - state_machines.PayoutBatch.EXECUTING_to_SETTLED
        distinguishing_aspect: |
          Originating trigger: POST /claims/{id}/settle (Claim EXECUTING→PAID).
          Each link is caused by the previous, depth ≥ 4:
            (1) Claim mutates → final_payout_cents pinned, payout_status=PAID.
            (2) That mutation on the Claim mutates the Policy (reserve_balance
                released, claim_quota_used_cents incremented; ReserveAdjustment
                row appended).
            (3) That Policy mutation (combined with the still-ongoing PAID write)
                writes a NEW ReinsuranceAllocation row — caused by the PAID write,
                not by the original API call.
            (4) The PAID transition causes the parent PayoutBatch.execution_phase
                to re-evaluate; if all children are PAID/REVERSED with no
                exceptions, batch transitions EXECUTING→SETTLED.
        test_recipe:
          setup:
            - "Insurer/policy/flight; 1 claim approved into a 1-claim batch; batch approved+executed (claim payout_status=EXECUTING)"
            - "claim.estimated_payout_cents == 22500 (single-segment Tier B − deductible 2500)"
            - "Snapshot pre-settle: policy.reserve_balance_cents=22500, policy.claim_quota_used_cents=0, batch.execution_phase=EXECUTING"
          trigger:
            - "POST /claims/C/settle"
            - "POST /_sweep/run   # for batch SETTLED auto-transition"
          assert:
            - "claim.payout_status == 'PAID' and claim.final_payout_cents == 22500"
            - "policy.reserve_balance_cents == 0   # released — hop 2"
            - "policy.claim_quota_used_cents == 22500   # debited — hop 2"
            - "Exactly one ReinsuranceAllocation row exists for claim with primary_share_cents=22500, reinsurer_share_cents=0   # hop 3"
            - "PayoutBatch.execution_phase == 'SETTLED'   # hop 4"

      - name: flight_cancellation_three_hop_eligibility_cascade
        grounds:
          - state_machines.Flight.SCHEDULED_to_CANCELLED
          - state_machines.Flight.ACTIVE_to_CANCELLED
          - entities.ClaimSegment.fields.eligibility
          - entities.ClaimSegment.fields.tier_selected
          - calculations.delay_duration
          - calculations.tiered_compensation
          - entities.Claim.fields.review_status
        distinguishing_aspect: |
          Originating trigger: POST /flights/{id}/events causing the Flight
          quorum-driven CANCELLED transition. Different from instance 1's settle
          trigger. Depth ≥ 3 with each hop caused by the previous:
            (1) FlightStatusEvent ingest causes Flight to mutate to CANCELLED.
            (2) That CANCELLED Flight mutation causes ClaimSegment recomputation
                (delay_minutes_used := +∞ sentinel, tier_selected := TIER_C,
                eligibility flips from prior value to ELIGIBLE-or-EXCLUDED_CAUSE
                depending on classified_cause). This cascade is caused by the
                FLIGHT mutation, not by the original event ingest.
            (3) That ClaimSegment recomputation causes any UNDER_REVIEW Claim
                referencing the segment to have its gross_segment_payout
                recomputed and its eligibility re-aggregated; if a previously-
                ineligible segment becomes ELIGIBLE (or vice versa) the claim's
                approvability flips.
        test_recipe:
          setup:
            - "Insurer/policy/flight (scheduled but not yet cancelled). Policy.excluded_delay_causes = []"
            - "Ticket+claim (claim still in MATCHED state, NOT yet submitted because flight not finalized)"
            - "Snapshot pre-cancel: ClaimSegment.eligibility is null (not computed), Flight.status=SCHEDULED"
          trigger:
            - "POST /flights/F/events  source=AIRLINE source_event_id=A1 reported_status=CANCELLED reported_cause=AIRLINE"
            - "POST /flights/F/events  source=AVIATION_AUTHORITY source_event_id=AA1 reported_status=CANCELLED reported_cause=AIRLINE"
            - "POST /claims/C/submit_review"
          assert:
            - "Flight.status == 'CANCELLED' and Flight.classified_cause == 'AIRLINE'   # hop 1"
            - "ClaimSegment.delay_minutes_used == 99999999 (+∞ sentinel) and tier_selected == 'TIER_C' and eligibility == 'ELIGIBLE'   # hop 2"
            - "Claim.review_status == 'UNDER_REVIEW' and Claim.segments[0].gross_segment_payout_cents == 60000   # hop 3"

  # --------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # --------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sod_versus_state_on_claim_approve
        grounds:
          - validations[priority=5]   # business_safety: SoD
          - validations[priority=6]   # state
          - errors.ERR_SOD_VIOLATION
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Pair: business_safety (SoD) vs state. Caller attempts /claims/C/approve
          where (a) X-User-ID == claim.assigned_reviewer_id (SoD violation, prio 5)
          AND (b) claim.review_status != UNDER_REVIEW (state violation, prio 6).
          Per the priority table, the SoD check fires first, so the loser sees
          ERR_SOD_VIOLATION (403) — NOT ERR_INVALID_STATE (409).
        test_recipe:
          setup:
            - "Setup MATCHED claim (review_status=MATCHED, NOT UNDER_REVIEW)"
            - "claim.assigned_reviewer_id was set to user R1 in a prior submit_review then cleared by return_to_match — re-submit so R1 is again assigned_reviewer_id, then return_to_match again so it lingers in MATCHED with assigned_reviewer_id=R1"
            - "(Or simpler: directly submit_review with R1 then call this approve endpoint while in UNDER_REVIEW first; for this conflict, set review_status to MATCHED via return_to_match while assigned_reviewer_id remains R1 — but our state-machine clears it; so use a setup where claim is freshly reset to MATCHED but assigned_reviewer_id sticks because the caller's role-check is only on the approve attempt.)"
          trigger:
            - "POST /claims/C/approve with X-User-ID=R1, X-User-Role=ClaimsApprover (R1 == assigned_reviewer_id) AND claim.review_status==MATCHED (state mismatch)"
          assert:
            - "Response status == 403"
            - "response.data.error_id == 'ERR_SOD_VIOLATION'   # SoD (priority 5) wins over state (priority 6)"

      - name: existence_versus_temporal_on_submit_review
        grounds:
          - validations[priority=4]   # existence (body-referenced)
          - validations[priority=8]   # business_temporal (waiting_period)
          - errors.ERR_NOT_FOUND
          - errors.ERR_WAITING_PERIOD_NOT_MET
        distinguishing_aspect: |
          Pair: existence vs business_temporal — distinct from instance 1's
          (business_safety vs state). Caller attempts /claims/C/submit_review
          where (a) C does not exist in this insurer (ERR_NOT_FOUND, prio 4)
          AND (b) the implied waiting period would also fail (ERR_WAITING_
          PERIOD_NOT_MET, prio 8). The 404 must win because existence is checked
          first.
        test_recipe:
          setup:
            - "Insurer A1; create insurer A2; create a policy with waiting_period_ms=10_000_000_000 (huge) and a claim CC under A2"
          trigger:
            - "POST /insurers/A1/claims/CC/submit_review (CC exists in A2 only — under A1 it does not exist, AND waiting period would fail)"
          assert:
            - "Response status == 404"
            - "response.data.error_id == 'ERR_NOT_FOUND'   # existence (priority 4) wins over temporal (priority 8)"

  # --------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # --------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: tier_a_minimum_60_minutes_inclusive
        grounds:
          - calculations.tiered_compensation
          - entities.ClaimSegment.fields.delay_minutes_used
          - entities.ClaimSegment.fields.tier_selected
          - validations[priority=10]   # DELAY_BELOW_THRESHOLD
        distinguishing_aspect: |
          Numeric boundary: TIER_A_MIN_MINUTES = 60, applied as `>=` not `>`.
          Reachable through POST /claims/{id}/submit_review (which triggers
          tier selection per segment). At exactly 60 min, segment is TIER_A
          (gross 10000); at 59 min, segment is NONE (eligibility
          DELAY_BELOW_THRESHOLD).
        test_recipe:
          setup:
            - "Insurer/policy P1 (delay_basis=DEPARTURE, payout_mode=FIXED, deductible=2500, limit=150000, quota=10_000_000, waiting_period_ms=0)"
            - "Two flights F60 (scheduled_departure=10_000_000, scheduled_arrival=15_000_000) and F59 (same scheduled times)"
            - "Ingest 2 quorum events for F60 (AIRLINE+AVIATION_AUTHORITY, reported_actual_departure=10_000_000+60*60_000) → Flight.status=LANDED, actual delay=60 min"
            - "Ingest 2 quorum events for F59 (AIRLINE+AVIATION_AUTHORITY, reported_actual_departure=10_000_000+59*60_000) → Flight.status=LANDED, actual delay=59 min"
            - "Advance clock past both arrivals; create one ticket per flight under P1"
            - "Create claim C60=[T60] and claim C59=[T59], both auto-MATCHED"
          trigger:
            - "POST /claims/C60/submit_review   (Claim C60 → UNDER_REVIEW)"
            - "POST /claims/C59/submit_review   (Claim C59 → UNDER_REVIEW)"
          assert:
            - "C60.segments[0].delay_minutes_used == 60 and tier_selected == 'TIER_A' and eligibility == 'ELIGIBLE'"
            - "C60.segments[0].gross_segment_payout_cents == 10000"
            - "C59.segments[0].delay_minutes_used == 59 and tier_selected == 'NONE' and eligibility == 'DELAY_BELOW_THRESHOLD'"
            - "C59.segments[0].gross_segment_payout_cents == 0"

      - name: empty_eligible_segment_set_yields_zero_payout
        grounds:
          - calculations.multi_segment_combined_payout
          - entities.Claim.fields.estimated_payout_cents
          - validations[priority=9]   # EXCLUDED_CAUSE
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Different metric (set-cardinality) and different endpoint
          (/claims/{id}/approve). When every segment becomes non-ELIGIBLE
          (empty eligible set: cardinality = 0), the calculation must short-
          circuit and the approve transition must fail with
          ERR_CLAIM_NOT_ELIGIBLE — not silently produce estimated_payout=0.
        test_recipe:
          setup:
            - "Policy P with excluded_delay_causes=[WEATHER]"
            - "Two flights F1, F2, both ultimately classified WEATHER (quorum events with reported_cause=WEATHER), each delay 200 min"
            - "Two tickets, claim C=[T1,T2] auto-MATCHED, submit_review computes both segments → eligibility=EXCLUDED_CAUSE (eligible set empty)"
          trigger:
            - "POST /claims/C/approve  (X-User-ID = approver != reviewer)"
          assert:
            - "Response status == 409"
            - "response.data.error_id == 'ERR_CLAIM_NOT_ELIGIBLE'"
            - "claim.review_status == 'UNDER_REVIEW' (unchanged)"
            - "claim.estimated_payout_cents == 0 (no reserve debited)"
            - "policy.reserve_balance_cents == 0 (no reserve change)"

  # --------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # --------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_review_requires_flight_finalized
        grounds:
          - state_machines.Claim.MATCHED_to_UNDER_REVIEW
          - state_machines.Flight.SCHEDULED_to_LANDED
          - validations[priority=7]
          - errors.ERR_FLIGHT_NOT_FINALIZED
        distinguishing_aspect: |
          Entity pair: Claim ↔ Flight. Claim.review_status MATCHED→UNDER_REVIEW
          requires every referenced Flight.status ∈ {LANDED, CANCELLED, DIVERTED,
          RETURNED}. Submit_review while flight is SCHEDULED or ACTIVE → 409
          ERR_FLIGHT_NOT_FINALIZED. Once the flight crosses to LANDED via
          quorum events, the same submit_review succeeds.
        test_recipe:
          setup:
            - "Insurer; create policy/ticket/claim where flight F starts in SCHEDULED"
            - "Claim C is MATCHED but flight not yet finalized"
          trigger:
            - "POST /claims/C/submit_review   (first call, flight SCHEDULED)"
            - "Ingest 2 quorum events (AIRLINE+AVIATION_AUTHORITY) reporting LANDED with cause=AIRLINE"
            - "POST /claims/C/submit_review   (second call, flight LANDED)"
          assert:
            - "First call: status==409, error_id=='ERR_FLIGHT_NOT_FINALIZED'; claim.review_status remains MATCHED"
            - "After events: Flight.status == 'LANDED'"
            - "Second call: status==200; claim.review_status == 'UNDER_REVIEW'"

      - name: payout_batch_execution_requires_claim_approved
        grounds:
          - state_machines.PayoutBatch.PENDING_to_EXECUTING
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - validations[priority=7]
          - errors.ERR_CLAIM_NOT_APPROVED
        distinguishing_aspect: |
          Different entity pair: PayoutBatch ↔ Claim (distinct from Claim↔Flight
          in instance 1). PayoutBatch.execution_phase PENDING→EXECUTING requires
          every claim_id's Claim.review_status == APPROVED. If any included
          claim is rejected before execute, the call fails 409
          ERR_CLAIM_NOT_APPROVED.
        test_recipe:
          setup:
            - "Two approved claims C1, C2 on the same flight; PayoutBatch B = [C1, C2], review_phase=APPROVED, execution_phase=PENDING"
            - "Reject C2 via /claims/C2/reject (review_status → REJECTED)"
          trigger:
            - "POST /payout_batches/B/execute"
          assert:
            - "Response status == 409"
            - "response.data.error_id == 'ERR_CLAIM_NOT_APPROVED'"
            - "B.execution_phase remains PENDING"
            - "C1.payout_status remains PAYABLE (no half-execute)"

  # --------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # --------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: flight_status_event_quorum_window_30_min_inclusive
        grounds:
          - calculations.flight_status_quorum
          - entities.FlightStatusEvent.fields.ingested_epoch_ms
          - entities.FlightStatusEvent.fields.source
          - state_machines.Flight.ACTIVE_to_LANDED
        distinguishing_aspect: |
          Resource: Flight (status quorum window). Interval semantics: a
          half-open buffer window of QUORUM_WINDOW_MS = 30*60_000 ms anchored
          at the most-recent event's ingested_epoch_ms — events older than
          (anchor - QUORUM_WINDOW_MS) are EXCLUDED from quorum even if from a
          distinct source. This is a TRAILING-buffer adjacency rule: events
          land in or out of the quorum based on whether they fall inside a
          backwards-looking window from the anchor.
        test_recipe:
          setup:
            - "Insurer (clock advance is the lever); create flight F"
            - "Ingest event E1 from AIRLINE at ingested_epoch_ms=0 (clock=0), reported_status=LANDED"
            - "Advance clock to 31 minutes (1860000 ms — outside 30-min window)"
            - "Ingest event E2 from AVIATION_AUTHORITY at ingested_epoch_ms=1860000, reported_status=LANDED"
          trigger:
            - "GET /flights/F"
          assert:
            - "Flight.status == 'SCHEDULED' (NOT 'LANDED'): only E2 is within the trailing 30-min window of itself, and the window contains 1 distinct source — quorum NOT reached. E1 is dropped from the window."

      - name: ticket_pnr_uniqueness_concurrent_active_window
        grounds:
          - entities.Ticket.fields.pnr_code
          - entities.Ticket.fields.status
          - errors.ERR_DUPLICATE_PNR
          - state_machines.Ticket.ATTACHED_to_REFUNDED
        distinguishing_aspect: |
          Different resource (Ticket) and different interval semantics from
          rule 8 instance 1's trailing-buffer time window. Ticket pnr_code
          uniqueness is enforced over a STATUS-bounded interval (not a time
          window): the PNR must be unique among Ticket rows whose status ∈
          {ATTACHED, CHANGED} simultaneously. A REFUNDED or UNMATCHED ticket
          with the same PNR does NOT block a new ATTACHED ticket. Adjacency
          here is in status-state space rather than time space.
        test_recipe:
          setup:
            - "Insurer A1; policy P; flight F"
            - "Create Ticket T1 (pnr_code='ABC123') under P → ATTACHED"
            - "POST /tickets/T1/refund → status=REFUNDED"
            - "Create Ticket T2 with pnr_code='ABC123' under P (same flight) → succeeds because T1 is REFUNDED, not ATTACHED/CHANGED"
            - "Now attempt a 3rd Ticket T3 with the same pnr_code while T2 is ATTACHED"
          trigger:
            - "POST /insurers/A1/tickets {pnr_code:'ABC123', ...}"
          assert:
            - "T2 creation succeeded (status==201) — REFUNDED predecessor does NOT collide"
            - "T3 creation: status==409 and error_id=='ERR_DUPLICATE_PNR' — collision under the active-status interval"

  # --------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # --------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: approve_then_reject_preserves_reserve_balance
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - state_machines.Claim.UNDER_REVIEW_to_REJECTED
          - entities.Policy.fields.reserve_balance_cents
          - entities.ReserveAdjustment
          - calculations.reserve_balance
        distinguishing_aspect: |
          Conserved quantity: Policy.reserve_balance_cents (a stored derived
          balance). Forward action: claim approve (debits reserve by
          estimated_payout_cents). Compensating action: claim reject AFTER an
          earlier approve was undone via return_to_match (or a separate flow:
          approve → reverse). Wait, reject from UNDER_REVIEW does NOT debit
          reserve, so the obvious pair is APPROVE→PAID→REVERSE. We use that:
          forward = approve+settle (debit then release-and-quota-debit);
          compensating = reverse (rebuild reserve and refund quota). Pinned
          formula: after Approve → Settle → Reverse, the named global quantity
          policy.reserve_balance_cents and policy.claim_quota_used_cents BOTH
          equal their pre-approval values. Cascade runs end-to-end and
          restores BOTH conserved quantities.
        test_recipe:
          setup:
            - "Insurer; policy P (deductible=2500, limit=150000, quota=10_000_000); flight F (delay 200 min, basis=DEPARTURE, classified_cause=AIRLINE)"
            - "Pre-snapshot: policy.reserve_balance_cents = 0, policy.claim_quota_used_cents = 0"
            - "Single-segment claim C; approve → settle → reverse path"
          trigger:
            - "POST /claims/C/submit_review (R1)"
            - "POST /claims/C/approve (A1)"
            - "Create batch B=[C], approve (BA1!=A1), execute (BX1!=BA1)"
            - "POST /claims/C/settle"
            - "POST /claims/C/reverse"
          assert:
            - "After /reverse: policy.reserve_balance_cents == 0   # pre-approval value restored (rebuilt)"
            - "After /reverse: policy.claim_quota_used_cents == 0   # pre-approval value restored (refunded)"
            - "Invariant formula: (post.reserve_balance_cents - pre.reserve_balance_cents) == 0 AND (post.claim_quota_used_cents - pre.claim_quota_used_cents) == 0"
            - "ReserveAdjustment chain: APPROVE_DEBIT(+22500), SETTLE_RELEASE(-22500), REVERSE_REBUILD(+22500) — net delta on reserve == 0 over the whole compensating cycle"

      - name: ticket_change_then_confirm_preserves_pnr_active_count
        grounds:
          - state_machines.Ticket.ATTACHED_to_CHANGED
          - state_machines.Ticket.CHANGED_to_ATTACHED
          - entities.Ticket.fields.pnr_code
          - entities.Ticket.fields.status
        distinguishing_aspect: |
          Different conserved quantity: cardinality of active-PNR set, i.e.
          count(Ticket where insurer_id=X AND pnr_code=Y AND status ∈
          {ATTACHED, CHANGED}). Forward action: change (ATTACHED → CHANGED).
          Compensating action: confirm (CHANGED → ATTACHED). Pinned formula:
          before and after the compensating cycle, the count is exactly 1
          (the ticket lingers in the active set throughout). Distinct from
          monetary-balance instance 1.
        test_recipe:
          setup:
            - "Insurer A1; policy P; flights F1 and F2"
            - "Create Ticket T (pnr='XYZ999', flight=F1) → ATTACHED"
            - "Pre-snapshot: count of (insurer=A1, pnr='XYZ999', status IN {ATTACHED, CHANGED}) == 1"
          trigger:
            - "POST /tickets/T/change with flight_id=F2 → CHANGED"
            - "POST /tickets/T/confirm → ATTACHED"
          assert:
            - "After /change: count of active-PNR rows for ('A1','XYZ999') == 1 (T is now CHANGED, still in active set)"
            - "After /confirm: count of active-PNR rows for ('A1','XYZ999') == 1 (T is back to ATTACHED)"
            - "Conservation: the count is invariant across the compensating cycle: pre==during==post==1"
            - "T.scheduled_departure_epoch_ms == F2.scheduled_departure_epoch_ms (re-snapshot persisted)"
