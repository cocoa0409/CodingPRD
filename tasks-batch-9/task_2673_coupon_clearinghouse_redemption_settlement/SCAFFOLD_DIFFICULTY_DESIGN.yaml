              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 120, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/verify-count"
              payload: { verified_count: 120 }
              as: IntakeClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 39 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot39_id: $.data.id }
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 40 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot40_id: $.data.id }
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 41 }
              as: IntakeClerk
              as_user_id: "clerk-1"
