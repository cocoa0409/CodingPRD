            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T09:00:00Z" }
              as: PrivacyOfficer
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
            - call: "POST /dsar-requests/${req_id}/verify-identity"
              payload: { evidence_reference: "ev-7" }
              as: IntakeAgent
              as_user_id: "intake-7"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-05T09:00:00Z" }
              as: PrivacyOfficer
          assert:
            - "DsarRequest.${req_id}.status == CLOSED_EXPIRED"
            - "Controller.${ctrl_id}.open_request_count == 0"

