scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: share_price_quoted_vs_locked_variant
    grounds:
    - calculations.share_price_quote
    - entities.ShareOrder.fields.tier
    - entities.ShareOrder.fields.unit_price_cents
    - endpoints.GET_/markets/{id}/price-quote
    distinguishing_aspect: 'Same market and share size: the quoted variant reprices with live allocated_bps

      while the locked variant frozen at activation keeps the tier-1 price — after a

      6000-bps activation pushes the market into tier 2, an identical 4000-bps order

      quotes unit 11875 while the already-active order keeps its locked 9000.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market CA/90210 base 10000.
      - 'Brokerage B1; agents A1 (order1: 6000 bps, ACTIVE, locked tier 1 unit 9000) and A2.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '90210'
          state_code: CA
          base_lead_price_cents: 10000
          participation_agreement: IDX_FULL
        as: PlatformAdmin
        captures:
          mkt: $.data.id
          mkt_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: B1 Realty
          primary_state: CA
        as: PlatformAdmin
        captures:
          bro: $.data.id
      - call: POST /agents
        payload:
          full_name: Agent One
          email: a1@x.com
          license_number: L-A1
          license_state: CA
          brokerage_id: ${bro}
        as: PlatformAdmin
        captures:
          a1: $.data.id
      - call: POST /agents
        payload:
          full_name: Agent Two
          email: a2@x.com
          license_number: L-A2
          license_state: CA
          brokerage_id: ${bro}
        as: PlatformAdmin
        captures:
          a2: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mkt}
          buyer_agent_id: ${a1}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${a1}
        captures:
          o1: $.data.id
          o1_unit: $.data.unit_price_cents
          o1_tier: $.data.tier
      - call: POST /share-orders/${o1}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mkt_v}
        as: Agent
        as_user_id: ${a1}
      trigger:
      - call: GET /markets/${mkt}/price-quote
        payload:
          share_bps: 4000
        as: Agent
        as_user_id: ${a2}
      - call: POST /share-orders
        payload:
          market_id: ${mkt}
          buyer_agent_id: ${a2}
          share_bps: 4000
          duration_days: 30
        as: Agent
        as_user_id: ${a2}
        captures:
          o2_unit: $.data.unit_price_cents
          o2_tier: $.data.tier
          o2_dep: $.data.deposit_cents
      assert:
      - ShareOrder.${o1}.tier == 1 and ShareOrder.${o1}.unit_price_cents == 9000 (locked variant, tier evaluated at allocated 0)
      - the price-quote response for share_bps 4000 shows tier == 2 and unit_price_cents == 11875 (quoted variant repriced at allocated 6000)
      - the new order's captured o2_tier == 2 and o2_unit == 11875 and o2_dep == 2375000
      - Market.${mkt}.allocated_bps == 6000 and available_bps == 4000 and current_unit_price_cents == 12500
  - name: agent_score_rolling_vs_official_window
    grounds:
    - calculations.agent_performance_score
    - entities.Agent.fields.rolling_score
    - entities.Agent.fields.official_score
    - entities.PerformanceSnapshot
    distinguishing_aspect: 'Identical counter history, two entity domains from Rule 1''s other instance

      (agent scoring, not order pricing): ROLLING scores all-time counters while

      OFFICIAL scores only events inside (prior_run, this_run]; after a second

      snapshot with no new events, official becomes 0 while rolling keeps 65.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market NV/89101 base 10000; brokerage; agent AS with one ACTIVE 6000-bps order.
      - Lead (consumer c-roll@x.com) offered to AS and accepted at +60s.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '89101'
          state_code: NV
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mkt2: $.data.id
          mkt2_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: B2 Realty
          primary_state: NV
        as: PlatformAdmin
        captures:
          bro2: $.data.id
      - call: POST /agents
        payload:
          full_name: Agent Score
          email: as@x.com
          license_number: L-AS
          license_state: NV
          brokerage_id: ${bro2}
        as: PlatformAdmin
        captures:
          as1: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mkt2}
          buyer_agent_id: ${as1}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${as1}
        captures:
          o3: $.data.id
      - call: POST /share-orders/${o3}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mkt2_v}
        as: Agent
        as_user_id: ${as1}
      - call: POST /leads
        payload:
          market_id: ${mkt2}
          listing_id: null
          consumer_key: c-roll@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          ld1: $.data.id
          ld1_v: $.data.version
      - call: GET /leads/${ld1}/assignments
        payload: {}
        as: MarketplaceOps
        captures:
          asg1: $.data[0].id
      - call: POST /lead-assignments/${asg1}/accept
        payload:
          expected_lead_version: ${ld1_v}
        as: Agent
        as_user_id: ${as1}
      trigger:
      - call: POST /ops-runs
        payload: {}
        as: MarketplaceOps
        captures:
          run1: $.data.seq
      - call: POST /ops-runs
        payload: {}
        as: MarketplaceOps
        captures:
          run2: $.data.seq
      assert:
      - 'Agent.${as1}.rolling_score == 65 (all-time ROLLING variant: 1 offer, 1 accept at 60s)'
      - PerformanceSnapshot for run ${run1} on agent ${as1} has windowed_score == 65 (accept fell in window)
      - PerformanceSnapshot for run ${run2} on agent ${as1} has windowed_score == 0 (no events in second window)
      - Agent.${as1}.official_score == 0 after the second run while rolling_score stays 65
      - Agent.${as1}.performance_tier == INELIGIBLE after the second run (official 0 < 40)
- rule_id: combinatorial_formula
  instances:
  - name: share_price_tier_volume_combinator
    grounds:
    - calculations.share_price_quote
    - entities.Market.fields.base_lead_price_cents
    distinguishing_aspect: 'Mode (a): >= 3 inputs with non-linear interaction — demand tier flips at

      allocated_bps >= 5000 and >= 8000 while the volume discount flips at

      share_bps >= 2500 and >= 5000; the tier-2 step (x1.25) compounds with the

      5% discount to yield 11875, not 11875 +/- any linear combination.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market WA/98101 base 10000; one ACTIVE 6000-bps order (allocated 6000 -> tier 2 band).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '98101'
          state_code: WA
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mkt3: $.data.id
          mkt3_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: B3 Realty
          primary_state: WA
        as: PlatformAdmin
        captures:
          bro3: $.data.id
      - call: POST /agents
        payload:
          full_name: Agent Three
          email: a3@x.com
          license_number: L-A3
          license_state: WA
          brokerage_id: ${bro3}
        as: PlatformAdmin
        captures:
          a3: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mkt3}
          buyer_agent_id: ${a3}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${a3}
        captures:
          o4: $.data.id
      - call: POST /share-orders/${o4}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mkt3_v}
        as: Agent
        as_user_id: ${a3}
      trigger:
      - call: GET /markets/${mkt3}/price-quote
        payload:
          share_bps: 2499
        as: Agent
        as_user_id: ${a3}
        captures:
          q2499: $.data.unit_price_cents
      - call: GET /markets/${mkt3}/price-quote
        payload:
          share_bps: 2500
        as: Agent
        as_user_id: ${a3}
        captures:
          q2500: $.data.unit_price_cents
          t2500: $.data.tier
      assert:
      - q2499 == 12500 (tier 2 x 1.25, no volume discount below 2500 bps)
      - q2500 == 11875 and t2500 == 2 (tier 2 x 1.25 x 0.95, floor at exact cents)
      - the 625-cent gap between adjacent share_bps values proves the volume-discount branch is evaluated at >= 2500, not > 2500
  - name: team_charge_split_remainder_allocation
    grounds:
    - calculations.team_charge_split
    - entities.TeamMembership.fields.allocated_charge_cents
    distinguishing_aspect: 'Mode (b): nested rounding where order matters — the charge is floored

      per-member first (floor(8500*2/3)=5666, floor(8500/3)=2833) and the 1-cent

      remainder then goes to the largest weight, so the split is 5667/2833; a

      sum-then-round implementation would produce 5666/2834 or 5667/2833 by

      accident only for some charges.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market OR/97201 base 10000; brokerage; team lead TL plus members TM1 (weight 2) and TM2 (weight 1); team
        order 6000 bps ACTIVE.
      - Lead c-t1@x.com routed to the team and accepted by TM1 at +60s.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '97201'
          state_code: OR
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mkt4: $.data.id
          mkt4_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: B4 Realty
          primary_state: OR
        as: PlatformAdmin
        captures:
          bro4: $.data.id
      - call: POST /agents
        payload:
          full_name: Team Lead
          email: tl@x.com
          license_number: L-TL
          license_state: OR
          brokerage_id: ${bro4}
        as: PlatformAdmin
        captures:
          tl: $.data.id
      - call: POST /agents
        payload:
          full_name: Member One
          email: tm1@x.com
          license_number: L-TM1
          license_state: OR
          brokerage_id: ${bro4}
        as: PlatformAdmin
        captures:
          tm1: $.data.id
      - call: POST /agents
        payload:
          full_name: Member Two
          email: tm2@x.com
          license_number: L-TM2
          license_state: OR
          brokerage_id: ${bro4}
        as: PlatformAdmin
        captures:
          tm2: $.data.id
      - call: POST /team-accounts
        payload:
          team_name: Team T
          lead_agent_id: ${tl}
          market_id: ${mkt4}
        as: Agent
        as_user_id: ${tl}
        captures:
          team: $.data.id
      - call: POST /team-memberships
        payload:
          team_id: ${team}
          agent_id: ${tm1}
          allocation_weight: 2
        as: Agent
        as_user_id: ${tl}
        captures:
          mem1: $.data.id
      - call: POST /team-memberships
        payload:
          team_id: ${team}
          agent_id: ${tm2}
          allocation_weight: 1
        as: Agent
        as_user_id: ${tl}
        captures:
          mem2: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mkt4}
          buyer_agent_id: ${tl}
          share_bps: 6000
          duration_days: 30
          team_id: ${team}
        as: Agent
        as_user_id: ${tl}
        captures:
          o5: $.data.id
      - call: POST /share-orders/${o5}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mkt4_v}
        as: Agent
        as_user_id: ${tl}
      - call: POST /leads
        payload:
          market_id: ${mkt4}
          listing_id: null
          consumer_key: c-t1@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          ld2: $.data.id
          ld2_v: $.data.version
      - call: GET /leads/${ld2}/assignments
        payload: {}
        as: MarketplaceOps
        captures:
          asg2: $.data[0].id
      - call: POST /lead-assignments/${asg2}/accept
        payload:
          expected_lead_version: ${ld2_v}
        as: Agent
        as_user_id: ${tm1}
      trigger:
      - call: GET /team-memberships
        payload:
          team_id: ${team}
        as: MarketplaceOps
        captures:
          m1_charge: $.data.0.allocated_charge_cents
          m2_charge: $.data.1.allocated_charge_cents
      assert:
      - TeamMembership.${mem1}.allocated_charge_cents == 5667 (floor 5666 plus 1-cent remainder to the largest weight)
      - TeamMembership.${mem2}.allocated_charge_cents == 2833
      - m1_charge + m2_charge == 8500 == ShareOrder.${o5}.unit_price_cents == Lead charge for the finalized accept
      - ShareOrder.${o5}.charged_cents == 8500 and leads_charged == 1
- rule_id: non_linear_state_machine
  instances:
  - name: share_order_pause_resume_cycle
    grounds:
    - state_machines.ShareOrder.ACTIVE_to_PAUSED
    - state_machines.ShareOrder.PAUSED_to_ACTIVE
    - state_machines.ShareOrder.PAUSED_to_CANCELLED
    - entities.Market.fields.allocated_bps
    distinguishing_aspect: 'ShareOrder exhibits a true cycle ACTIVE->PAUSED->ACTIVE (repeatable) plus a

      branch out of PAUSED to CANCELLED; each pass through the cycle releases and

      re-acquires market allocation, and resume re-checks capacity, so the cycle

      can fail on the second lap even though the first succeeded.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market CO/80202 base 10000; agents A (order 6000 ACTIVE) and B (order 4000, still PENDING_PAYMENT).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          zip_code: '80202'
          state_code: CO
          base_lead_price_cents: 10000
        as: PlatformAdmin
        captures:
          mkt5: $.data.id
          mkt5_v: $.data.version
      - call: POST /brokerages
        payload:
          legal_name: B5 Realty
          primary_state: CO
        as: PlatformAdmin
        captures:
          bro5: $.data.id
      - call: POST /agents
        payload:
          full_name: Cyc A
          email: ca@x.com
          license_number: L-CA
          license_state: CO
          brokerage_id: ${bro5}
        as: PlatformAdmin
        captures:
          ca: $.data.id
      - call: POST /agents
        payload:
          full_name: Cyc B
          email: cb@x.com
          license_number: L-CB
          license_state: CO
          brokerage_id: ${bro5}
        as: PlatformAdmin
        captures:
          cb: $.data.id
      - call: POST /share-orders
        payload:
          market_id: ${mkt5}
          buyer_agent_id: ${ca}
          share_bps: 6000
          duration_days: 30
        as: Agent
        as_user_id: ${ca}
        captures:
          oa: $.data.id
      - call: POST /share-orders/${oa}/payments
        payload:
          amount_cents: 900000
          outcome: SUCCEEDED
          expected_market_version: ${mkt5_v}
        as: Agent
        as_user_id: ${ca}
      - call: POST /share-orders
        payload:
          market_id: ${mkt5}
          buyer_agent_id: ${cb}
          share_bps: 4000
          duration_days: 30
        as: Agent
        as_user_id: ${cb}
        captures:
          ob: $.data.id
      trigger:
      - call: POST /share-orders/${oa}/pause
        payload: {}
        as: Agent
        as_user_id: ${ca}
        captures:
          mkt_v_after_pause: $.data.version
      - call: POST /share-orders/${ob}/payments
        payload:
          amount_cents: 2375000
          outcome: SUCCEEDED
          expected_market_version: ${mkt_v_after_pause}
        as: Agent
        as_user_id: ${cb}
      - call: POST /share-orders/${oa}/resume
        payload: {}
        as: Agent
        as_user_id: ${ca}
        captures:
          resume_err: $.data.error_id
      assert:
      - after pause, Market.${mkt5}.allocated_bps == 0 and ShareOrder.${oa}.order_status == PAUSED
      - B's activation succeeds while A is paused (allocated 4000) — the cycle released capacity
      - resume_err == ERR_SHARE_CAPACITY_EXCEEDED (resume of 6000 would exceed 10000 against B's 4000)
      - ShareOrder.${oa}.order_status remains PAUSED; the ACTIVE->PAUSED->ACTIVE cycle is blocked at re-entry, proving resume is capacity-guarded
  - name: lead_reroute_self_loop
    grounds:
    - state_machines.Lead.ROUTED_to_ROUTED
    - state_machines.Lead.ROUTED_to_UNASSIGNED
    - state_machines.LeadAssignment.OFFERED_to_EXPIRED
    distinguishing_aspect: 'Lead has a self-loop ROUTED->ROUTED with mutation (each expiry consumes one

      routing attempt and bans 3 more agents), on a different entity than the

      ShareOrder cycle; after the second sweep exhausts the pool, the same trigger

      takes the divergent ROUTED->UNASSIGNED branch with a credit side effect.

      '
    test_recipe:
      setup:
      - Clock at 2026-09-01T00:00:00Z. Market TX/73301 base 10000; 7 eligible agents; agent R0 holds the only order (6000 bps ACTIVE). Lead c-race@x.com
        (hash 4911 < 6000) routes to R0.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
