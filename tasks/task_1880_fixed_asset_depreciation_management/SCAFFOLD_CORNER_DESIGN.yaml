  # ===========================================================================
  - section: endpoints
    instances:
      - name: capitalized_asset_discoverable_both_directions
        claim_type: cross_reference_link
        grounds:
          - "endpoints[POST /capital-projects/{id}/capitalize]"
          - "endpoints[GET /capital-projects]"
          - "endpoints[GET /fixed-assets/{id}]"
        distinguishing_aspect: "The cascade-created asset (not in the capitalize response body) is discoverable via capitalized_asset_id on the project and via the capitalized_asset_id list filter."
        test_recipe:
          setup: ["AssetClass MACH; project PROJ-DISC with a 300000 POSTED line"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-DISC", name: "Discoverable", asset_class_id: "${cls}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { pj: $.data.id }
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${pj}", amount_cents: 300000, cost_type: "VENDOR_INVOICE", incurred_date: "2026-01-15" }
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /capital-projects/${pj}/capitalize"
              payload: { asset_tag: "A-060", description: "From CIP" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { asset: $.data.capitalized_asset_id }
            - call: "GET /capital-projects"
              payload: { capitalized_asset_id: "${asset}" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "GET /fixed-assets/${asset}"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
          assert:
            - "capitalize response carries capitalized_asset_id; project status == CAPITALIZED"
            - "GET /capital-projects?capitalized_asset_id returns exactly [${pj}]"
            - "asset shows source == CIP_CAPITALIZATION, status == DRAFT, acquisition_cost_cents == 300000, asset_tag == 'A-060'"

      - name: filtered_lists_scope_results
        claim_type: computed_read
        grounds:
          - "endpoints[GET /capital-projects/{id}/cost-lines]"
          - "endpoints[GET /depreciation-entries]"
        distinguishing_aspect: "Scoped reads actually scope: the per-project cost-line sub-resource returns only that project's lines (ledger-filtered entry lists are exercised in the dual-variant difficulty instances) — no cross-contamination."
        test_recipe:
          setup: ["Two OPEN projects PROJ-F1 (lines 100, 200) and PROJ-F2 (line 300)"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-F1", name: "Filter 1", asset_class_id: "${cls}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { p1: $.data.id }
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-F2", name: "Filter 2", asset_class_id: "${cls}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { p2: $.data.id }
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${p1}", amount_cents: 100, cost_type: "MATERIAL", incurred_date: "2026-01-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${p1}", amount_cents: 200, cost_type: "LABOR", incurred_date: "2026-01-02" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /cip-cost-lines"
              payload: { project_id: "${p2}", amount_cents: 300, cost_type: "OTHER", incurred_date: "2026-01-03" }
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "GET /capital-projects/${p1}/cost-lines"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
          assert:
            - "GET /capital-projects/${p1}/cost-lines returns exactly 2 lines (amounts 100 and 200), none from PROJ-F2"
            - "total_count == 2, has_more == false"

