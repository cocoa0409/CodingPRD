          - state_machines.MisrepresentationCase.OPEN_to_SUBSTANTIATED
          - state_machines.RightsHolder.ENROLLED_to_SUSPENDED
          - state_machines.ReferenceFile.ACTIVE_to_QUARANTINED
          - state_machines.NoticeClaim.DISABLED_to_WITHDRAWN
          - state_machines.StrikeRecord.ACTIVE_to_VOIDED
          - calculations.rights_holder_abuse_score
