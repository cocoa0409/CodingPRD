scaffold_difficulty_design:

  # =====================================================================================
  # RULE 1 — dual-variant calculations on different entity domains
  #   instance 1: HotelBlock pickup pace (room nights, two projection geometries)
  #   instance 2: CommissionInvoice money (two commission bases, one selected)
  # =====================================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pickup_pace_two_projection_variants_diverge_on_hotel_block
        grounds:
          - calculations.block_pickup_pace
          - entities.PickupReport.fields.reported_room_nights
          - entities.HotelBlock.fields.contracted_room_nights
        distinguishing_aspect: |
          The dual variance lives on the HotelBlock pickup-reporting domain and is measured in room
          nights: forward_looking_projection extrapolates the average pace over the whole report
          history (first..last) and returns 38, while chronological_run_rate extrapolates only the
          most recent consecutive report pair and returns 42 on the identical three reports, so
          pace_variance_room_nights == 4 and only the forward-looking figure decides on_pace.
        test_recipe:
          setup:
            - "One event (night_count 4) and one hotel; one CONTRACTED block of 10 rooms per night, so contracted_room_nights == 40 and pace_target_room_nights == 32."
            - "Three cumulative pickup reports on the block: 2026-08-05 -> 6 room nights, 2026-08-11 -> 12, 2026-08-17 -> 30; block cutoff_date is 2026-08-21, so days_remaining_to_cutoff == 4."
            - "Pickup acceleration is deliberate: the whole-window pace is 2.0 room nights/day while the last pair's pace is 3.0 room nights/day."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
            - call: "POST /housing/hotel-blocks/${block_id}/pickup-reports"
              payload: { as_of_date: "2026-08-05", reported_rooms_picked_up: 3, reported_room_nights: 6, reported_gross_revenue_cents: 131400 }
              as: HotelManager
              as_user_id: "${hotel_id}"
            - call: "POST /housing/hotel-blocks/${block_id}/pickup-reports"
              payload: { as_of_date: "2026-08-11", reported_rooms_picked_up: 5, reported_room_nights: 12, reported_gross_revenue_cents: 262800 }
              as: HotelManager
              as_user_id: "${hotel_id}"
            - call: "POST /housing/hotel-blocks/${block_id}/pickup-reports"
              payload: { as_of_date: "2026-08-17", reported_rooms_picked_up: 8, reported_room_nights: 30, reported_gross_revenue_cents: 657000 }
              as: HotelManager
              as_user_id: "${hotel_id}"
          trigger:
            - call: "GET /housing/hotel-blocks/${block_id}/pickup-pace"
              payload: {}
              as: EventOrganizer
              as_user_id: "${event_id}"
          assert:
            - "response.data.report_count == 3"
            - "response.data.latest_reported_room_nights == 30"
            - "response.data.days_remaining_to_cutoff == 4"
            - "response.data.forward_looking_projection_room_nights == 38"
            - "response.data.chronological_run_rate_projection_room_nights == 42"
            - "response.data.pace_variance_room_nights == 4"
            - "response.data.pace_target_room_nights == 32"
            - "response.data.on_pace == true"

      - name: commission_two_basis_variants_diverge_on_invoice
        grounds:
          - calculations.commission_due
          - entities.CommissionInvoice.fields.bureau_confirmed_commission_cents
          - entities.CommissionInvoice.fields.hotel_reported_commission_cents
          - entities.CommissionInvoice.fields.variance_cents
        distinguishing_aspect: |
          This dual variance lives on the CommissionInvoice money domain, not on room-night pace:
          bureau_confirmed_basis bills the bureau's own reservation ledger (131400 pre-tax cents ->
          15768 commission cents) while hotel_reported_basis bills the hotel's latest pickup report
          (109500 pre-tax cents -> 13140), and the invoice issued on HOTEL_REPORTED shows the delta
          as variance_cents == 2628 with billable_room_nights == 5 instead of 6.
        test_recipe:
          setup:
            - "Event night_count 4; block of 10 rooms at 21900 cents, commission_pct 0.12, rebate 700 cents per room night; one APPROVED GENERAL sub-block of 6 rooms; block OPEN."
            - "Two CONFIRMED reservations: attendee 1 for 2026-09-14..2026-09-18 (4 room nights) and attendee 2 for 2026-09-15..2026-09-17 (2 room nights) -> bureau side 6 room nights, 131400 pre-tax cents."
            - "One pickup report (2026-08-19) reporting only 5 room nights and 109500 pre-tax cents -> the hotel failed to attribute one room night to the block."
            - "Clock advanced to the cutoff and the block swept to CUTOFF_PASSED, the post-event posture in which the bureau bills commission."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 6, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a2@example.com", full_name: "Attendee Two", registration_id: "REG-2", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att2_id: $.data.id }
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att1_id}", check_in_date: "2026-09-14", check_out_date: "2026-09-18", occupants: 2 }
              as: Attendee
              as_user_id: "${att1_id}"
              captures: { res1_id: $.data.id }
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att2_id}", check_in_date: "2026-09-15", check_out_date: "2026-09-17", occupants: 1 }
              as: Attendee
              as_user_id: "${att2_id}"
              captures: { res2_id: $.data.id }
            - call: "POST /housing/hotel-blocks/${block_id}/pickup-reports"
              payload: { as_of_date: "2026-08-19", reported_rooms_picked_up: 2, reported_room_nights: 5, reported_gross_revenue_cents: 109500 }
              as: HotelManager
              as_user_id: "${hotel_id}"
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: BureauCoordinator
            - call: "POST /housing/hotel-blocks/${block_id}/cutoff"
              payload: {}
              as: BureauCoordinator
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/commission-invoice"
              payload: { basis: "HOTEL_REPORTED" }
              as: BureauCoordinator
              captures: { inv_id: $.data.id }
          assert:
            - "CommissionInvoice.${inv_id}.bureau_confirmed_commission_cents == 15768"
            - "CommissionInvoice.${inv_id}.hotel_reported_commission_cents == 13140"
            - "CommissionInvoice.${inv_id}.commission_due_cents == 13140"
            - "CommissionInvoice.${inv_id}.billable_room_nights == 5"
            - "CommissionInvoice.${inv_id}.rebate_due_cents == 3500"
            - "CommissionInvoice.${inv_id}.variance_cents == 2628"
            - "CommissionInvoice.${inv_id}.outstanding_cents == 13140"
            - "CommissionInvoice.${inv_id}.status == ISSUED"

  # =====================================================================================
  # RULE 2 — combinatorial formulas in DIFFERENT modes
  #   instance 1: mode (b) nested rounding whose order changes the cents
  #   instance 2: mode (a) >=3 inputs, nested max() + tiered-rate selection
  # =====================================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: reservation_charge_rounds_per_night_before_multiplying
        grounds:
          - calculations.reservation_total_charge
          - entities.Reservation.fields.total_room_charge_cents
          - entities.Reservation.fields.room_tax_pct_snapshot
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order decides the cents. The scaffold pins
          round_half_up(21900 * 1.1475) = 25130 per night FIRST and then multiplies by 4 nights,
          giving 100520; the forbidden order (sum 87600 untaxed nights, then tax and round) gives
          100521, so the single cent difference falsifies a wrong rounding order.
        test_recipe:
          setup:
            - "Hotel room_tax_pct 0.1475; block negotiated_nightly_rate_cents 21900; APPROVED GENERAL sub-block of 6 rooms on an OPEN block."
            - "One attendee booking the full four-night window 2026-09-14..2026-09-18."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 6, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
          trigger:
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att1_id}", check_in_date: "2026-09-14", check_out_date: "2026-09-18", occupants: 2 }
              as: Attendee
              as_user_id: "${att1_id}"
              captures: { res1_id: $.data.id }
          assert:
            - "Reservation.${res1_id}.room_nights == 4"
            - "Reservation.${res1_id}.quoted_nightly_rate_cents == 21900"
            - "Reservation.${res1_id}.room_tax_pct_snapshot == 0.1475"
            - "Reservation.${res1_id}.total_room_charge_cents == 100520"
            - "Reservation.${res1_id}.total_room_charge_cents != 100521"

      - name: attrition_penalty_combines_no_show_nights_with_nested_max_and_tier
        grounds:
          - calculations.attrition_penalty_exposure
          - calculations.no_show_billing
          - state_machines.HotelBlock.CUTOFF_PASSED_to_CLOSED
          - state_machines.Reservation.reservation_status.CONFIRMED_to_NO_SHOW
        distinguishing_aspect: |
          Mode (a) — one formula over three interacting inputs (adjusted contracted room nights 8,
          CONFIRMED room nights 4, NO_SHOW nights 1) with a nested max(0, ...) and a tiered-rate
          selection: protected 6, shortfall max(0, 6 - 5) = 1, ratio 0.125 selects TIER_2_PCT 0.70,
          so attrition_liability_cents == 15330 and the NO_SHOW row is simultaneously billed 25130.
        test_recipe:
          setup:
            - "Small block: 2 contracted rooms per night over a 4-night event -> contracted_room_nights 8; rate 21900, tax 0.1475."
            - "APPROVED GENERAL sub-block of 2 rooms; two CONFIRMED reservations overlapping nights 2026-09-14 and 2026-09-15 (peak committed 2 == allotment)."
            - "Clock walked to the cutoff (block CUTOFF_PASSED), then to 2026-09-15 so the hotel can report attendee 2 as a no-show, then to the event end so the block can close."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 2, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.50 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.50, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-002" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 2, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a2@example.com", full_name: "Attendee Two", registration_id: "REG-2", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att2_id: $.data.id }
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att1_id}", check_in_date: "2026-09-14", check_out_date: "2026-09-18", occupants: 1 }
              as: Attendee
              as_user_id: "${att1_id}"
              captures: { res1_id: $.data.id }
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att2_id}", check_in_date: "2026-09-14", check_out_date: "2026-09-16", occupants: 1 }
              as: Attendee
              as_user_id: "${att2_id}"
              captures: { res2_id: $.data.id }
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: BureauCoordinator
            - call: "POST /housing/hotel-blocks/${block_id}/cutoff"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BureauCoordinator
            - call: "POST /housing/reservations/${res2_id}/no-show"
              payload: {}
              as: HotelManager
              as_user_id: "${hotel_id}"
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-18T00:00:00Z" }
              as: BureauCoordinator
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/close"
              payload: {}
              as: BureauCoordinator
          assert:
            - "HotelBlock.${block_id}.status == CLOSED"
            - "HotelBlock.${block_id}.attrition_liability_cents == 15330"
            - "Reservation.${res2_id}.reservation_status == NO_SHOW"
            - "Reservation.${res2_id}.no_show_billed_cents == 25130"
            - "Attendee.${att2_id}.no_show_strikes == 1"
            - "Event.${event_id}.total_confirmed_room_nights == 4"

  # =====================================================================================
  # RULE 3 — non-linear state machines on DIFFERENT entities
  #   instance 1: HotelBlock revision cycle (cyclic, bounded at 3 submissions)
  #   instance 2: Reservation parallel dimensions (occupancy x transmission)
  # =====================================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: hotel_block_terms_negotiation_cycle_caps_at_three_submissions
        grounds:
          - state_machines.HotelBlock.DRAFT_to_TERMS_SUBMITTED
          - state_machines.HotelBlock.TERMS_SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.HotelBlock.CHANGES_REQUESTED_to_TERMS_SUBMITTED
          - validations[priority=98]
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          Non-linearity on HotelBlock is a true cycle: TERMS_SUBMITTED -> CHANGES_REQUESTED ->
          TERMS_SUBMITTED is traversed three times, revision_round monotonically reaches 3, and the
          fourth submission from the same legal CHANGES_REQUESTED state is refused with
          ERR_NEGOTIATION_ROUNDS_EXHAUSTED, proving the loop is bounded rather than linear.
        test_recipe:
          setup:
            - "One event, one hotel, one DRAFT block."
            - "Three terms submissions each answered by the hotel with request-changes, so the block sits in CHANGES_REQUESTED with revision_round == 3."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/request-changes"
              payload: {}
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 22400, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              captures: { block_v4: $.data.version }
