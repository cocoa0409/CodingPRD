            - "err == ERR_STALE_VERSION on the second execute with the same (now stale) pv_stale"
            - "retry with pv_fresh succeeds: Commitment.${com2}.status == EXECUTED"
            - "FoFProgram.${prog}.committed_total == 10000000.00"

      - name: occ_stale_version_on_plan_supersede
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pacing-plan-supersede-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on supersede: a ledger append between the client's read and the supersede call bumps FoFProgram.version, so the supersede carrying the old expected_program_version fails with 412; the same call with the fresh version succeeds."
        test_recipe:
          setup: ["Program open; plan A APPROVED; plan B DRAFT; client reads version V; a CONTRIBUTION entry bumps version to V+1"]
          setup_api_calls:
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ops X2", staff_role: "OPS_ANALYST", email: "opsx2@x.com" }
              as: CIO
              captures: { ops: $.data.id }
