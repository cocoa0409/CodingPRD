            - "Charge total for the message == 120 before cancel and == 120 after cancel (no refund, no new fee)"

      - name: campaign_suspend_reactivate_conserves_number_pool
        grounds:
          - state_machines.Campaign.APPROVED_to_SUSPENDED
          - state_machines.Campaign.SUSPENDED_to_APPROVED
