- section: consistency_model
  instances:
  - name: immediate_consistency_mutation_visible_in_response
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: 'Immediate consistency: the begin-negotiation response itself shows contract_status IN_NEGOTIATION and the incremented version — no re-read is needed to observe the mutation.'
    test_recipe:
      setup:
      - contract in DRAFT
      setup_api_calls:
      - call: POST /networks
        payload:
          name: PPO-NET
          line_of_business: COMMERCIAL_PPO
        as: PlanAdmin
        captures:
          net_id: $.data.id
      - call: POST /providers
        payload:
          legal_name: Prov A
          tin: TIN-A
          npi: NPI-A
          locality_code: L01
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /providers/${prov_id}/contracts
        payload:
          network_id: ${net_id}
          base_effective_date: '2026-07-01'
          term_months: 36
          escalator_bps: 0
          escalator_mode: ANNIVERSARY
          auto_renew: false
        as: ContractManager
        captures:
          ct_id: $.data.id
      trigger:
      - call: POST /contracts/${ct_id}/begin-negotiation
        as: ContractManager
        captures:
          st: $.data.contract_status
          v: $.data.version
      assert:
      - st == IN_NEGOTIATION
      - v == 2 (created at 1, one mutation)
