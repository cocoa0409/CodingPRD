        distinguishing_aspect: |
          The topology is flat, so cross-references arrive in request bodies rather than in the URL
          and must still be checked: an unused cedent_id on POST /programs is 404
          ERR_CEDENT_NOT_FOUND and an unused reinsurer_id on POST /layers/{id}/market-submissions is
