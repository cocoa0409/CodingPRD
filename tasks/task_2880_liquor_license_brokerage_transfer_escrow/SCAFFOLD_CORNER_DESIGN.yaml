              as: PlatformAdmin
              captures: { lic_id: $.data.id, lic_v1: $.data.version }
            - call: "POST /safekeeping-filings"
              payload: { license_id: "${lic_id}", filing_type: "INITIAL", requested_months: 12, expected_license_version: "${lic_v1}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { fil1: $.data.id }
            - call: "POST /safekeeping-filings/${fil1}/decide"
              payload: { decision: "GRANT" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { lic_v3: $.data.version }
          trigger:
            - call: "POST /safekeeping-filings"
              payload: { license_id: "${lic_id}", filing_type: "EXTENSION", requested_months: 9, expected_license_version: "${lic_v3}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { fil2: $.data.id }
            - call: "POST /safekeeping-filings/${fil2}/decide"
              payload: { decision: "GRANT" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
          assert:
            - "SafekeepingFiling.${fil1}.fee_cents == 20000 with extension_index 0, effective_from 2026-08-01T00:00:00Z and expires_at 2027-08-01T00:00:00Z"
            - "License.${lic_id}.status == SAFEKEEPING with safekeeping_expires_at == 2027-08-01T00:00:00Z after the first grant"
            - "SafekeepingFiling.${fil2}.extension_index == 1 and granted_months == 6 (requested 9 clamped to EXTENSION_MAX_MONTHS)"
            - "SafekeepingFiling.${fil2}.fee_cents == 40000 (20000 * 2**1)"
            - "SafekeepingFiling.${fil2}.effective_from == 2027-08-01T00:00:00Z (chained off the licence, not off clock_now)"
            - "SafekeepingFiling.${fil2}.expires_at == 2028-02-01T00:00:00Z"
            - "License.${lic_id}.safekeeping_extensions_count == 1 and safekeeping_filing_pending == false"
            - "GET /safekeeping-filings?license_id=${lic_id} returns total_count == 2"

      - name: deposit_requirement_threshold_clamps_at_floor_and_cap
        claim_type: correct_result
        grounds:
          - calculations.escrow_deposit_requirement
        excluded_because:
          difficulty_instance: "combinatorial_formula / escrow_deposit_nested_clamp_mode_a"
          rationale: "Both the linear-region value 2405001 and the DEPOSIT_CAP_CENTS clamp to 7500000 are asserted there."

      - name: filing_fee_tier_keyed_on_subtotal
        claim_type: tiered_pricing
        grounds:
          - calculations.transfer_filing_fee
        excluded_because:
          difficulty_instance: "combinatorial_formula / transfer_filing_fee_pinned_evaluation_order_mode_c"
          rationale: "That instance walks all three deficiency rounds and asserts 173250 / 204750 / 243000 against the naive tier-on-total readings."

      - name: commission_rounding_precision_per_line
        claim_type: precision
        grounds:
          - calculations.commission_disbursement
        excluded_because:
