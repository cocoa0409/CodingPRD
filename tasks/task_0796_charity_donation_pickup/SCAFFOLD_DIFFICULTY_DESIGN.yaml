  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_requires_route_open
        grounds:
          - validations[priority=7]
          - state_machines.PickupRequest.REQUESTED_to_SCHEDULED
          - errors[ERR_ROUTE_NOT_OPEN]
          - entities.Route.fields.status
        distinguishing_aspect: |
          Scheduling onto a PLANNED (never opened) route returns ERR_ROUTE_NOT_OPEN — the PickupRequest
          REQUESTED->SCHEDULED transition is gated by the referenced Route.status (PickupRequest->Route pair).
        test_recipe:
          setup:
            - "Partner accepts FURNITURE; vehicle capacity 100; route created but NOT opened (PLANNED)."
            - "DONATION request with one FURNITURE item volume 20."
