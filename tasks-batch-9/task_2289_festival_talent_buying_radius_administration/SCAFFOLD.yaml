  - method: POST
    path: /festival-ops/competing-performances/{id}/adjudicate
    description: "Rule the report cleared or a violation; a violation fires the depth-4 enforcement cascade."
    roles: [BusinessAffairs]
    input: [finding, "finding_note?"]
    output: CompetingPerformance
    success_code: 200
    side_effects:
      - "finding CLEARED: status REPORTED -> CLEARED; Artist.reported_conflict_count -= 1; no clause, booking or installment is touched"
      - "finding VIOLATION requires conflict_assessment == CONFLICT (otherwise ERR_ADJUDICATION_MISMATCH)"
      - "CASCADE-3 hop 1: status REPORTED -> VIOLATION; Artist.reported_conflict_count -= 1, radius_breach_count += 1, both risk scores re-derived"
      - "CASCADE-3 hop 2: the conflicting RadiusClause moves ACTIVE -> BREACHED and breach_count += 1"
      - "CASCADE-3 hop 3: every PaymentInstallment of that clause's booking with status == SCHEDULED moves to HELD"
      - "CASCADE-3 hop 4: Booking.settlement_status -> WITHHELD, which blocks countersign, release and mark-paid"

