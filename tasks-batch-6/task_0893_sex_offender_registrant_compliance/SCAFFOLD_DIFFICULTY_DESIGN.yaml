# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — task 0893
# 9 Difficulty Rules x 2 instances = 18 instances.
# Clock default before any set: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_provisional_vs_adjudicated
        grounds:
          - calculations.risk_score
          - entities.Registrant.fields.risk_score
          - entities.Petition.fields.adjudicated_risk_score
        distinguishing_aspect: |
          The provisional variant (Registrant.risk_score, OPEN flags only) yields 5 while
          the adjudicated variant (Petition.adjudicated_risk_score, ALL flags OPEN+RESOLVED)
          yields 20 for the identical flag history — two variants, two entity domains.
        test_recipe:
          setup:
            - "ACTIVE TIER_1 registrant with one RESOLVED MAJOR flag (UNREPORTED_MOVE, 15) and one OPEN MINOR flag (TRAVEL_VIOLATION, 5); clock fixed at 2026-05-01 so decay factor is 1.0."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA", verification_grace_days: 3, est_households_per_notification: 100 }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "John Roe", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "UNREPORTED_MOVE" }, as: RegistrationOfficer, captures: { flag_major: "$.data.id" } }
            - { call: "POST /sorna/compliance-flags/${flag_major}/resolve", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "TRAVEL_VIOLATION" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/petitions", payload: { petition_type: "DEREGISTER" }, as: RegistrationOfficer, captures: { pet: "$.data.id", adj: "$.data.adjudicated_risk_score" } }
          assert:
            - "Registrant.${reg}.risk_score == 5"
            - "Petition.${pet}.adjudicated_risk_score == 20"

      - name: notification_estimated_vs_actual_recipients
        grounds:
          - calculations.notification_recipients
          - entities.NotificationRecord.fields.estimated_recipients
          - entities.NotificationRecord.fields.actual_recipients
        distinguishing_aspect: |
          For a TIER_2 subject (radius 500) the estimated variant returns
          est_households(100)*tier_mult(3)=300 while the actual variant counts real VERIFIED
          RESIDENCE addresses within radius = 1 — divergent results on the NotificationRecord domain.
        test_recipe:
          setup:
            - "Subject registrant TIER_2 (one CLASS_A offense), ACTIVE, RESIDENCE at grid (0,0); one OTHER ACTIVE registrant with RESIDENCE at grid (0,0); jurisdiction est_households_per_notification=100; no exclusion zones."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA", est_households_per_notification: 100 }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Subject S", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_A", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer, captures: { reg_v: "$.data.version" } }
            - { call: "POST /sorna/registrants/${reg}/addresses", payload: { address_type: "RESIDENCE", line1: "1 A St", city: "Metro", state_code: "CA", postal_code: "90001", grid_x: 0, grid_y: 0, expected_registrant_version: "${reg_v}" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Other O", date_of_birth: "1979-02-02T00:00:00Z" }, as: RegistrationOfficer, captures: { reg2: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg2}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2019-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg2}/activate", payload: {}, as: RegistrationOfficer, captures: { reg2_v: "$.data.version" } }
            - { call: "POST /sorna/registrants/${reg2}/addresses", payload: { address_type: "RESIDENCE", line1: "2 A St", city: "Metro", state_code: "CA", postal_code: "90001", grid_x: 0, grid_y: 0, expected_registrant_version: "${reg2_v}" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/notifications", payload: { audience_scope: "PUBLIC" }, as: RegistrationOfficer, captures: { notif: "$.data.id", est: "$.data.estimated_recipients", act: "$.data.actual_recipients" } }
          assert:
            - "NotificationRecord.${notif}.radius_meters == 500"
            - "NotificationRecord.${notif}.estimated_recipients == 300"
            - "NotificationRecord.${notif}.actual_recipients == 1"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tier_score_multiplier_and_tier_selection
        grounds:
          - calculations.tier_score
          - entities.Offense.fields.offense_points
          - entities.Registrant.fields.tier
        distinguishing_aspect: |
          Mode (a): offense_points = round((base 30 + AGG 10) * MINOR_MULT 1.5) = 60 combines
          three inputs (class, aggravating, victim_minor) non-linearly, then tiered selection
          picks TIER_3 at the tier_score>=60 breakpoint.
        test_recipe:
          setup:
            - "PENDING registrant with a single CLASS_A, aggravated, victim_minor offense; then activated."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Max Points", date_of_birth: "1975-03-03T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P288", offense_class: "CLASS_A", is_aggravated: true, victim_minor: true, conviction_date: "2018-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { off: "$.data.id", off_pts: "$.data.offense_points" } }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer, captures: { tier: "$.data.tier", tscore: "$.data.tier_score", intv: "$.data.verification_interval_days" } }
          assert:
            - "Offense.${off}.offense_points == 60"
            - "Registrant.${reg}.tier_score == 60"
            - "Registrant.${reg}.tier == TIER_3"
            - "Registrant.${reg}.verification_interval_days == 90"

      - name: risk_score_round_per_flag_then_sum
        grounds:
          - calculations.risk_score
          - entities.Registrant.fields.risk_score
        distinguishing_aspect: |
          Mode (b): with two OPEN flags at decay factor 0.97 the pinned per-flag rounding gives
          round(15*0.97)=15 plus round(5*0.97)=5 => 20; the forbidden sum-then-round order
          (round(14.55+4.85)=round(19.4)=19) would differ.
        test_recipe:
          setup:
            - "ACTIVE TIER_1 registrant; MAJOR flag (UNREPORTED_MOVE,15) and MINOR flag (TRAVEL_VIOLATION,5) both opened at 2026-05-01; clock then advanced to 2026-05-04 (days_open=3, decay 0.97)."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Decay D", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "UNREPORTED_MOVE" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "TRAVEL_VIOLATION" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: RegistryAdmin }
            - { call: "GET /sorna/registrants/${reg}", payload: {}, as: RegistrationOfficer, captures: { rs: "$.data.risk_score" } }
          assert:
            - "Registrant.${reg}.risk_score == 20"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: registrant_active_delinquent_active_cycle
        grounds:
          - state_machines.Registrant.ACTIVE_to_DELINQUENT
          - state_machines.Registrant.DELINQUENT_to_ACTIVE
          - calculations.risk_score
        distinguishing_aspect: |
          Registrant cycles ACTIVE->DELINQUENT (MAJOR flag pushes risk to 15) then DELINQUENT->ACTIVE
          on resolve when zero OPEN flags remain — a revert loop, not a one-way pipeline.
        test_recipe:
          setup:
            - "ACTIVE TIER_1 registrant with one OPEN MAJOR flag (UNREPORTED_MOVE) => status DELINQUENT, risk_score 15."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Cyc C", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "UNREPORTED_MOVE" }, as: RegistrationOfficer, captures: { fl: "$.data.id" } }
          trigger:
            - { call: "POST /sorna/compliance-flags/${fl}/resolve", payload: {}, as: RegistrationOfficer }
          assert:
            - "Registrant.${reg}.status == ACTIVE"
            - "Registrant.${reg}.risk_score == 0"
            - "ComplianceFlag.${fl}.status == RESOLVED"

      - name: travel_notice_submitted_fork_approve
        grounds:
          - state_machines.TravelNotice.SUBMITTED_to_APPROVED
          - state_machines.TravelNotice.SUBMITTED_to_DENIED
          - entities.Jurisdiction.fields.active_travel_hold_count
        distinguishing_aspect: |
          TravelNotice forks SUBMITTED->{APPROVED,DENIED}; the APPROVE branch increments destination
          active_travel_hold_count to 1 whereas the DENY branch leaves it 0 — divergent side effects.
        test_recipe:
          setup:
            - "ACTIVE registrant in jur1; ACTIVE destination jur2; one SUBMITTED TEMPORARY travel notice to jur2 for 2026-06-01..2026-06-10."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Home", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/jurisdictions", payload: { name: "Dest", state_code: "NV" }, as: RegistryAdmin, captures: { jur2: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Trav T", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/travel-notices", payload: { destination_jurisdiction_id: "${jur2}", travel_type: "TEMPORARY", departure_date: "2026-06-01T00:00:00Z", return_date: "2026-06-10T00:00:00Z" }, as: RegistrationOfficer, captures: { tn: "$.data.id" } }
          trigger:
            - { call: "POST /sorna/travel-notices/${tn}/decision", payload: { decision: "APPROVE" }, as: RegistrationOfficer, captures: { tn_status: "$.data.status" } }
          assert:
            - "TravelNotice.${tn}.status == APPROVED"
            - "Jurisdiction.${jur2}.active_travel_hold_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: missed_verification_cascades_to_petition_denial
        grounds:
          - state_machines.Registrant.ACTIVE_to_DELINQUENT
          - state_machines.Petition.PENDING_to_DENIED
          - calculations.verification_schedule
          - calculations.risk_score
        distinguishing_aspect: |
          Depth-3 chain: verification-check opens a LATE_VERIFICATION flag (link1) -> that flag pushes
          risk_score>=15 flipping Registrant ACTIVE->DELINQUENT (link2) -> the DELINQUENT flip auto-DENIES
          the PENDING petition (link3), each hop caused by the previous.
        test_recipe:
          setup:
            - "ACTIVE TIER_1 registrant (next_verification_due 2027-05-01, grace 3) with one PENDING DEREGISTER petition; clock advanced to 2027-05-04."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA", verification_grace_days: 3 }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Late L", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/petitions", payload: { petition_type: "DEREGISTER" }, as: RegistrationOfficer, captures: { pet: "$.data.id" } }
            - { call: "POST /sorna/_clock/set_current_utc", payload: { to_iso8601: "2027-05-04T00:00:00Z" }, as: RegistryAdmin }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/verification-check", payload: {}, as: RegistrationOfficer, captures: { st: "$.data.status" } }
          assert:
            - "Registrant.${reg}.status == DELINQUENT"
            - "Petition.${pet}.decision == DENIED"

      - name: petition_grant_cascades_addresses_historical
        grounds:
          - state_machines.Petition.PENDING_to_GRANTED
          - state_machines.Registrant.ACTIVE_to_DEREGISTERED
          - entities.Address.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (petition GRANT): GRANT flips Registrant
          ACTIVE->DEREGISTERED (link1) which itself flips every VERIFIED Address to HISTORICAL (link2).
        test_recipe:
          setup:
            - "ACTIVE TIER_1 registrant (registered 2026-05-01) with one VERIFIED RESIDENCE address and one PENDING DEREGISTER petition; clock advanced to 2036-05-01 (>=10y, eligible, zero flags)."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Free F", date_of_birth: "1970-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2016-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer, captures: { reg_v: "$.data.version" } }
            - { call: "POST /sorna/registrants/${reg}/addresses", payload: { address_type: "RESIDENCE", line1: "9 Home Rd", city: "Metro", state_code: "CA", postal_code: "90001", grid_x: 5000, grid_y: 5000, expected_registrant_version: "${reg_v}" }, as: RegistrationOfficer, captures: { addr: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/petitions", payload: { petition_type: "DEREGISTER" }, as: RegistrationOfficer, captures: { pet: "$.data.id" } }
            - { call: "POST /sorna/_clock/set_current_utc", payload: { to_iso8601: "2036-05-01T00:00:00Z" }, as: RegistryAdmin }
          trigger:
            - { call: "POST /sorna/petitions/${pet}/decision", payload: { decision: "GRANT", reviewer_ref: "rev-7" }, as: ComplianceReviewer, captures: { dec: "$.data.decision" } }
          assert:
            - "Petition.${pet}.decision == GRANTED"
            - "Registrant.${reg}.status == DEREGISTERED"
            - "Address.${addr}.status == HISTORICAL"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: travel_state_beats_referential
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_REGISTRANT_NOT_ACTIVE]
        distinguishing_aspect: |
          A DELINQUENT registrant (state, priority 4) submitting travel with a non-existent
          destination_jurisdiction_id (business_referential, priority 5) receives ERR_REGISTRANT_NOT_ACTIVE
          — state outranks referential.
        test_recipe:
          setup:
            - "DELINQUENT registrant (one OPEN MAJOR flag) in an ACTIVE jurisdiction."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Delq D", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "UNREPORTED_MOVE" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/travel-notices", payload: { destination_jurisdiction_id: "00000000-0000-0000-0000-000000000000", travel_type: "TEMPORARY", departure_date: "2026-06-01T00:00:00Z", return_date: "2026-06-10T00:00:00Z" }, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_REGISTRANT_NOT_ACTIVE"

      - name: travel_temporal_beats_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_TRAVEL_DATES]
        distinguishing_aspect: |
          A travel notice with a past departure (business_temporal, priority 6) whose window also
          overlaps an existing SUBMITTED window (business_constraint, priority 8) returns
          ERR_INVALID_TRAVEL_DATES — temporal outranks constraint (a different category pair).
        test_recipe:
          setup:
            - "ACTIVE registrant with one SUBMITTED TEMPORARY travel window 2026-06-01..2026-06-10; clock at 2026-05-01."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Over O", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/travel-notices", payload: { destination_jurisdiction_id: "${jur}", travel_type: "TEMPORARY", departure_date: "2026-06-01T00:00:00Z", return_date: "2026-06-10T00:00:00Z" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/travel-notices", payload: { destination_jurisdiction_id: "${jur}", travel_type: "TEMPORARY", departure_date: "2026-04-01T00:00:00Z", return_date: "2026-06-05T00:00:00Z" }, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_TRAVEL_DATES"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: verification_overdue_at_exact_due_plus_grace
        grounds:
          - calculations.verification_schedule
          - state_machines.Registrant.ACTIVE_to_DELINQUENT
          - entities.Jurisdiction.fields.verification_grace_days
        distinguishing_aspect: |
          At clock == next_verification_due(2027-05-01) + grace(3) = 2027-05-04 the >= comparison
          marks the registrant overdue and DELINQUENT; at 2027-05-03 it would not — a date-threshold
          boundary reached through verification-check.
        test_recipe:
          setup:
            - "ACTIVE TIER_1 registrant, next_verification_due 2027-05-01, grace 3; clock set to exactly 2027-05-04."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA", verification_grace_days: 3 }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Edge E", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/_clock/set_current_utc", payload: { to_iso8601: "2027-05-04T00:00:00Z" }, as: RegistryAdmin }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/verification-check", payload: {}, as: RegistrationOfficer, captures: { st: "$.data.status" } }
          assert:
            - "Registrant.${reg}.status == DELINQUENT"

      - name: exclusion_zone_prohibits_at_exact_radius_plus_buffer
        grounds:
          - calculations.exclusion_proximity
          - validations[priority=7]
          - errors[ERR_EXCLUSION_ZONE_VIOLATION]
        distinguishing_aspect: |
          A RESIDENCE at grid (600,0) is exactly radius(500)+buffer(100)=600 meters from the zone
          center (0,0); the <= comparison prohibits it with ERR_EXCLUSION_ZONE_VIOLATION, whereas (601,0)
          would be allowed — a spatial-distance boundary reached through POST addresses.
        test_recipe:
          setup:
            - "ACTIVE registrant whose jurisdiction has an ACTIVE SCHOOL exclusion zone at (0,0) radius 500 buffer 100."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/jurisdictions/${jur}/exclusion-zones", payload: { name: "Lincoln Elementary", zone_type: "SCHOOL", center_x: 0, center_y: 0, radius_meters: 500, buffer_meters: 100 }, as: RegistryAdmin }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Near N", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer, captures: { reg_v: "$.data.version" } }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/addresses", payload: { address_type: "RESIDENCE", line1: "600 Edge Ln", city: "Metro", state_code: "CA", postal_code: "90001", grid_x: 600, grid_y: 0, expected_registrant_version: "${reg_v}" }, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_EXCLUSION_ZONE_VIOLATION"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: petition_grant_requires_registrant_clean
        grounds:
          - state_machines.Petition.PENDING_to_GRANTED
          - calculations.deregistration_eligibility
          - errors[ERR_PETITION_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Petition GRANT depends on the Registrant/ComplianceFlag pair: with one OPEN MINOR flag the
          registrant is not clean, so GRANT is rejected ERR_PETITION_NOT_ELIGIBLE even though duration is met.
        test_recipe:
          setup:
            - "TIER_1 registrant registered 2026-05-01, clock 2036-05-01 (10y met), with one OPEN MINOR flag (TRAVEL_VIOLATION, registrant stays ACTIVE) and a PENDING DEREGISTER petition."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Dirty D", date_of_birth: "1970-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2016-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/_clock/set_current_utc", payload: { to_iso8601: "2036-05-01T00:00:00Z" }, as: RegistryAdmin }
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "TRAVEL_VIOLATION" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/petitions", payload: { petition_type: "DEREGISTER" }, as: RegistrationOfficer, captures: { pet: "$.data.id" } }
          trigger:
            - { call: "POST /sorna/petitions/${pet}/decision", payload: { decision: "GRANT", reviewer_ref: "rev-1" }, as: ComplianceReviewer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PETITION_NOT_ELIGIBLE"
            - "Petition.${pet}.decision == PENDING"

      - name: travel_approve_requires_destination_active
        grounds:
          - state_machines.TravelNotice.SUBMITTED_to_APPROVED
          - entities.Jurisdiction.fields.status
          - errors[ERR_JURISDICTION_INACTIVE]
        distinguishing_aspect: |
          TravelNotice APPROVE depends on the destination Jurisdiction: an INACTIVE destination yields
          ERR_JURISDICTION_INACTIVE — a different entity pair (TravelNotice<->Jurisdiction).
        test_recipe:
          setup:
            - "ACTIVE registrant in ACTIVE jur1; destination jur2 seeded INACTIVE; one SUBMITTED travel notice to jur2."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Home", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/jurisdictions", payload: { name: "Closed", state_code: "NV", status: "INACTIVE" }, as: RegistryAdmin, captures: { jur2: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Trip T", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/travel-notices", payload: { destination_jurisdiction_id: "${jur2}", travel_type: "TEMPORARY", departure_date: "2026-06-01T00:00:00Z", return_date: "2026-06-10T00:00:00Z" }, as: RegistrationOfficer, captures: { tn: "$.data.id" } }
          trigger:
            - { call: "POST /sorna/travel-notices/${tn}/decision", payload: { decision: "APPROVE" }, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_JURISDICTION_INACTIVE"
            - "TravelNotice.${tn}.status == SUBMITTED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: travel_window_half_open_overlap_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_TRAVEL_WINDOW_CONFLICT]
          - entities.TravelNotice.fields.departure_date
        distinguishing_aspect: |
          Two travel windows on the same registrant use half-open [departure,return) semantics:
          [2026-06-05,2026-06-15) overlaps the interior of [2026-06-01,2026-06-10) and is rejected,
          while an adjacent [2026-06-10,...) touching the prior return would be allowed.
        test_recipe:
          setup:
            - "ACTIVE registrant with one SUBMITTED travel window [2026-06-01,2026-06-10)."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Win W", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/travel-notices", payload: { destination_jurisdiction_id: "${jur}", travel_type: "TEMPORARY", departure_date: "2026-06-01T00:00:00Z", return_date: "2026-06-10T00:00:00Z" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/travel-notices", payload: { destination_jurisdiction_id: "${jur}", travel_type: "TEMPORARY", departure_date: "2026-06-05T00:00:00Z", return_date: "2026-06-15T00:00:00Z" }, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_TRAVEL_WINDOW_CONFLICT"

      - name: temporary_address_closed_touching_overlap_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_ADDRESS_PERIOD_CONFLICT]
          - entities.Address.fields.effective_from
        distinguishing_aspect: |
          TEMPORARY address windows use closed [effective_from,effective_to] semantics: a new window
          starting exactly on the prior window's effective_to (2026-06-10) conflicts (touching endpoints
          collide) — the opposite adjacency rule from the half-open travel windows.
        test_recipe:
          setup:
            - "ACTIVE registrant with one TEMPORARY address [2026-06-01,2026-06-10]; no RESIDENCE created so registrant.version stays at its post-activation value."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Temp T", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer, captures: { reg_v: "$.data.version" } }
            - { call: "POST /sorna/registrants/${reg}/addresses", payload: { address_type: "TEMPORARY", line1: "1 Motel", city: "Metro", state_code: "CA", postal_code: "90001", grid_x: 8000, grid_y: 8000, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-10T00:00:00Z", expected_registrant_version: "${reg_v}" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/registrants/${reg}/addresses", payload: { address_type: "TEMPORARY", line1: "2 Motel", city: "Metro", state_code: "CA", postal_code: "90001", grid_x: 8100, grid_y: 8000, effective_from: "2026-06-10T00:00:00Z", effective_to: "2026-06-15T00:00:00Z", expected_registrant_version: "${reg_v}" }, as: RegistrationOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ADDRESS_PERIOD_CONFLICT"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: flag_open_resolve_conserves_risk_score
        grounds:
          - state_machines.Registrant.ACTIVE_to_DELINQUENT
          - state_machines.Registrant.DELINQUENT_to_ACTIVE
          - calculations.risk_score
        distinguishing_aspect: |
          Conserved quantity Registrant.risk_score: opening a MAJOR flag adds exactly 15 and resolving
          it removes exactly 15, so risk_score returns to its pre-flag value 0 (== sum of contributions
          over OPEN flags, which is empty afterward).
        test_recipe:
          setup:
            - "ACTIVE TIER_1 registrant with risk_score 0; MAJOR flag opened (risk_score 15, DELINQUENT)."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Metro", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Cons C", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/flags", payload: { flag_type: "UNREPORTED_MOVE" }, as: RegistrationOfficer, captures: { fl: "$.data.id" } }
          trigger:
            - { call: "POST /sorna/compliance-flags/${fl}/resolve", payload: {}, as: RegistrationOfficer, captures: { rs: "$.data.registrant_id" } }
          assert:
            - "Registrant.${reg}.risk_score == 0"
            - "Registrant.${reg}.status == ACTIVE"

      - name: travel_approve_cancel_conserves_hold_count
        grounds:
          - state_machines.TravelNotice.SUBMITTED_to_APPROVED
          - state_machines.TravelNotice.APPROVED_to_CANCELLED
          - entities.Jurisdiction.fields.active_travel_hold_count
        distinguishing_aspect: |
          Conserved quantity destination Jurisdiction.active_travel_hold_count: APPROVE increments it to 1
          and CANCEL decrements it back to 0 — a different conserved quantity than risk_score.
        test_recipe:
          setup:
            - "ACTIVE registrant in jur1; ACTIVE destination jur2 (hold_count 0); one SUBMITTED then APPROVED travel notice to jur2 (jur2 hold_count 1)."
          setup_api_calls:
            - { call: "POST /sorna/jurisdictions", payload: { name: "Home", state_code: "CA" }, as: RegistryAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /sorna/jurisdictions", payload: { name: "Dest", state_code: "NV" }, as: RegistryAdmin, captures: { jur2: "$.data.id" } }
            - { call: "POST /sorna/registrants", payload: { jurisdiction_id: "${jur}", full_name: "Hold H", date_of_birth: "1980-01-01T00:00:00Z" }, as: RegistrationOfficer, captures: { reg: "$.data.id" } }
            - { call: "POST /sorna/registrants/${reg}/offenses", payload: { statute_code: "P290", offense_class: "CLASS_B", conviction_date: "2020-01-01T00:00:00Z" }, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/activate", payload: {}, as: RegistrationOfficer }
            - { call: "POST /sorna/registrants/${reg}/travel-notices", payload: { destination_jurisdiction_id: "${jur2}", travel_type: "TEMPORARY", departure_date: "2026-06-01T00:00:00Z", return_date: "2026-06-10T00:00:00Z" }, as: RegistrationOfficer, captures: { tn: "$.data.id" } }
            - { call: "POST /sorna/travel-notices/${tn}/decision", payload: { decision: "APPROVE" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /sorna/travel-notices/${tn}/cancel", payload: {}, as: RegistrationOfficer, captures: { st: "$.data.status" } }
          assert:
            - "TravelNotice.${tn}.status == CANCELLED"
            - "Jurisdiction.${jur2}.active_travel_hold_count == 0"
