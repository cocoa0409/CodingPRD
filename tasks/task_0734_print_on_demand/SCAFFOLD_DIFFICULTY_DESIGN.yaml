  # ==========================================================================
  # Rule 9 — compensating_invariant (≥2, different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payout_release_return_conserves_creator_wallet
        grounds:
          - state_machines.PayoutCycle.DRAFT_to_RELEASED
          - state_machines.PayoutCycle.RELEASED_to_RETURNED
