    input: []
    output: PurchaseOrder
    side_effects: []
  - method: GET
    path: "/purchase-orders/{id}/lines"
    description: "List lines of an order"
    roles: [WholesaleAdmin, SalesRep, StoreManager, RouteDriver]
    code: 200
    input: []
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "Filtered list of order lines"
    roles: [WholesaleAdmin]
    code: 200
    input: ["order_id?", "product_id?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/order-lines/{id}"
    description: "Fetch an order line"
    roles: [WholesaleAdmin, SalesRep, StoreManager, RouteDriver]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: POST
    path: "/purchase-orders/{id}/submit"
    description: "Submit a DRAFT order (OCC on order version); runs pricing engine and credit gate"
    roles: [StoreManager]
    code: 200
    input: [expected_order_version]
    output: PurchaseOrder
    side_effects:
      - "runs order_line_merch_calc, promo_allowance_calc, pick_fee_calc, min_drop_fee_calc, tax_stamp_cost_calc"
      - "sets provisional_total_cents; transitions DRAFT -> SUBMITTED"
      - "Retailer.exposure_forward_cents recomputed"
      - "increments PurchaseOrder.version by 1"
  - method: POST
    path: "/purchase-orders/{id}/cancel"
    description: "Cancel a DRAFT or SUBMITTED order"
    roles: [StoreManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["if SUBMITTED: exposure_forward_cents decreases and credit_status is re-evaluated", "increments PurchaseOrder.version by 1"]
  - method: POST
    path: "/purchase-orders/{id}/confirm-delivery"
    description: "Driver confirms delivery; computes final totals and issues the invoice"
    roles: [RouteDriver]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "order transitions CLOSED -> DELIVERED -> INVOICED"
      - "creates Invoice (OPEN) with invoiced_total_cents = final_total_cents"
      - "Retailer.ar_balance_cents increases; exposure_forward_cents releases the pipeline amount"
  - method: GET
    path: "/invoices"
    description: "List invoices"
    roles: [WholesaleAdmin, CreditManager, StoreManager]
    code: 200
    input: ["order_id?", "retailer_id?", "status?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch invoice"
    roles: [WholesaleAdmin, CreditManager, StoreManager]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/payments"
    description: "Apply a payment (COD at the door or terms payment)"
    roles: [CreditManager]
    code: 201
    input: [amount_cents, method]
    output: Payment
    side_effects: ["Invoice.balance_cents decreases; invoice status may advance; Retailer.ar_balance_cents decreases; credit_status re-evaluated"]
  - method: GET
    path: "/invoices/{id}/payments"
    description: "List payments of an invoice"
    roles: [WholesaleAdmin, CreditManager]
    code: 200
    input: []
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/credit-memos"
    description: "List credit memos is GET; creates a manual DRAFT credit memo"
    roles: [CreditManager]
    code: 201
    input: [origin, amount_cents]
    output: CreditMemo
    side_effects: []
  - method: GET
    path: "/invoices/{id}/credit-memos"
    description: "List credit memos of an invoice"
    roles: [WholesaleAdmin, CreditManager]
    code: 200
    input: []
    output: CreditMemo[]
    side_effects: []
  - method: GET
    path: "/credit-memos"
    description: "Filtered list of credit memos"
    roles: [WholesaleAdmin, CreditManager]
    code: 200
    input: ["invoice_id?", "exception_id?", "status?"]
    output: CreditMemo[]
    side_effects: []
  - method: GET
    path: "/credit-memos/{id}"
    description: "Fetch a credit memo"
    roles: [WholesaleAdmin, CreditManager]
    code: 200
    input: []
    output: CreditMemo
    side_effects: []
  - method: POST
    path: "/credit-memos/{id}/post"
    description: "Post a DRAFT credit memo against its invoice"
    roles: [CreditManager]
    code: 200
    input: []
    output: CreditMemo
    side_effects: ["Invoice.balance_cents decreases; Retailer.ar_balance_cents decreases; credit_status re-evaluated"]
  - method: POST
    path: "/credit-memos/{id}/void"
    description: "Void a POSTED credit memo (compensating action)"
    roles: [CreditManager]
    code: 200
    input: []
    output: CreditMemo
    side_effects: ["Invoice.balance_cents increases; Retailer.ar_balance_cents increases; credit_status re-evaluated"]
  - method: POST
    path: "/payments/{id}/reverse"
    description: "Reverse an APPLIED payment (compensating action)"
    roles: [CreditManager]
    code: 200
    input: []
    output: Payment
    side_effects: ["payment.status = REVERSED; Invoice.balance_cents increases; invoice may return PAID -> OPEN; Retailer.ar_balance_cents increases"]
  - method: POST
    path: "/new-item-requests"
    description: "Sales rep files a slotting / new-item authorization request"
    roles: [SalesRep]
    code: 201
    input: [retailer_id, product_id, proposed_shelf_price_cents]
    output: NewItemRequest
    side_effects: []
  - method: GET
    path: "/new-item-requests"
    description: "List new-item requests"
    roles: [WholesaleAdmin, SalesRep]
    code: 200
    input: ["retailer_id?", "product_id?", "status?"]
    output: NewItemRequest[]
    side_effects: []
  - method: GET
    path: "/new-item-requests/{id}"
    description: "Fetch a new-item request"
    roles: [WholesaleAdmin, SalesRep]
    code: 200
    input: []
    output: NewItemRequest
    side_effects: []
  - method: POST
    path: "/new-item-requests/{id}/start-review"
    description: "Move request SUBMITTED -> UNDER_REVIEW and compute slotting fee"
    roles: [WholesaleAdmin]
    code: 200
    input: []
    output: NewItemRequest
    side_effects: ["computes slotting_fee_cents"]
  - method: POST
    path: "/new-item-requests/{id}/request-revision"
    description: "Move UNDER_REVIEW -> REVISION_REQUESTED"
    roles: [WholesaleAdmin]
    code: 200
    input: [revision_notes]
    output: NewItemRequest
    side_effects: []
  - method: POST
    path: "/new-item-requests/{id}/resubmit"
    description: "Move REVISION_REQUESTED -> SUBMITTED (cycle leg)"
    roles: [SalesRep]
    code: 200
    input: ["proposed_shelf_price_cents?"]
    output: NewItemRequest
    side_effects: ["clears revision_notes"]
  - method: POST
    path: "/new-item-requests/{id}/authorize"
    description: "Authorize the item: adds it to the store order guide and publishes its retail price record"
    roles: [WholesaleAdmin]
    code: 200
    input: []
    output: NewItemRequest
    side_effects: ["appends line to ACTIVE OrderGuide", "creates RetailPriceRecord superseding prior ACTIVE record"]
  - method: POST
    path: "/new-item-requests/{id}/reject"
    description: "Reject the request (terminal)"
    roles: [WholesaleAdmin]
    code: 200
    input: []
    output: NewItemRequest
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. Server startup default is exactly 2026-05-01T00:00:00Z before any set call; the logical clock never falls back to wall-clock time"
    roles: [WholesaleAdmin]
    code: 200
    input: [to_iso8601]
    output: object
    side_effects: ["advances logical clock; may trigger PAST_DUE auto-transitions on open invoices"]

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or unrecognized auth headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted or entity-backed caller does not own the resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "malformed payload, missing required field, or type mismatch" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "target resource not in a legal from-state for the requested transition" }
  - { id: ERR_MANIFEST_NOT_OPEN, http: 409, condition: "assign-order attempted when manifest not in {SCHEDULED, LOADING}" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected version does not match current parent entity version (OCC)" }
  - { id: ERR_TOBACCO_LICENSE_MISSING, http: 422, condition: "tobacco line on order for retailer without tobacco_license_id" }
  - { id: ERR_TAX_STAMP_UNAVAILABLE, http: 422, condition: "no ACTIVE TaxStampSupply for the retailer's jurisdiction" }
  - { id: ERR_ORDER_CUTOFF_PASSED, http: 422, condition: "submit attempted after the order guide cutoff for the delivery day" }
  - { id: ERR_DELIVERY_WINDOW_OVERLAP, http: 409, condition: "new route window overlaps an existing window under half-open intervals plus turnaround buffer" }
  - { id: ERR_PROMO_WINDOW_OVERLAP, http: 409, condition: "new promo overlaps an existing promo on the same product under closed inclusive date intervals" }
  - { id: ERR_PRODUCT_NOT_ON_GUIDE, http: 422, condition: "ordered product absent from the store's ACTIVE order guide" }
  - { id: ERR_SPLIT_CASE_NOT_ALLOWED, http: 422, condition: "split_units_qty > 0 on a product with split_case_allowed == false" }
  - { id: ERR_MANIFEST_OVERWEIGHT, http: 422, condition: "assign-order blocked because manifest overweight_flag is true" }
  - { id: ERR_MEMO_EXCEEDS_INVOICE, http: 422, condition: "credit memo amount exceeds invoice balance_cents" }
  - { id: ERR_CREDIT_HOLD, http: 422, condition: "order submit blocked while retailer is on CREDIT_HOLD" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "order would push exposure_forward_cents above credit_limit_cents" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "payment amount exceeds invoice balance_cents" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "product sku already exists" }
  - { id: ERR_DUPLICATE_RATE_WEEK, http: 409, condition: "fuel surcharge rate already published for that week_start_date" }
  - { id: ERR_DUPLICATE_JURISDICTION, http: 409, condition: "tax stamp supply already exists for jurisdiction_code" }
  - { id: ERR_GUIDE_DAY_MISMATCH, http: 422, condition: "order guide delivery_day does not match retailer delivery_day" }

roles:
  - name: WholesaleAdmin
    description: "Distributor operator: item master, manifests, routes, rates, stamp supplies, item authorization"
    identity: opaque
    exclusive_operations: [create_product, create_manifest, begin_loading, assign_order, close_manifest, create_delivery_window, create_fuel_rate, create_stamp_supply, authorize_item, start_review, request_revision, reject_item, set_clock]
    shared_operations: [read_any_resource]
  - name: SalesRep
    description: "Field rep: order guides, promos, retail price maintenance, new-item requests"
    identity: opaque
    exclusive_operations: [create_order_guide, create_promo_event, publish_retail_price, file_new_item_request, resubmit_new_item_request]
    shared_operations: [read_any_resource]
  - name: StoreManager
    description: "Store-side user; acts as the retailer entity"
    identity: "entity_backed:Retailer"
    exclusive_operations: [create_purchase_order, submit_order, cancel_order]
    shared_operations: [read_own_resources]
  - name: RouteDriver
    description: "Driver on the route; records shorts/damages and confirms delivery"
    identity: opaque
    exclusive_operations: [record_delivery_exception, confirm_delivery]
    shared_operations: [read_manifest, read_order]
  - name: CreditManager
    description: "Credit desk: terms, holds, payments, credit memos"
    identity: opaque
    exclusive_operations: [update_credit_terms, set_credit_hold, apply_payment, reverse_payment, create_credit_memo, post_credit_memo, void_credit_memo]
    shared_operations: [read_any_resource]
