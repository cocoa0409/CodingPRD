  - rule_id: boundary_precision_check
    instances:

      - name: sufficiency_lower_gate_inclusive_boundary
        grounds:
          - calculations.sample_projection
          - calculations.sufficiency_band_determination
          - endpoints[POST /verification-rounds/{round_id}/tally]
          - state_machines.Petition.SAMPLE_VERIFICATION_to_CURE_PERIOD
        distinguishing_aspect: |
          Metric: projected_valid_count measured against lower_gate == floor(required *
          sufficiency_lower_bps / 10000). The fixture lands the projection exactly ON the gate
          (projected 1, lower_gate 1) where the specified comparison is inclusive (<=), so the
          determination must be INSUFFICIENT. An implementation using a strict < returns
          FULL_CHECK_REQUIRED and moves the petition to FULL_CHECK instead of CURE_PERIOD, which is
          how the boundary is falsified. Endpoint under test: POST /verification-rounds/{round_id}/tally.
        test_recipe:
          setup:
            - "Standard SOS-FULL: gubernatorial_vote_total 100 and signature_pct_bps 200, so required_valid_signatures == ceil(100 * 200 / 10000) == 2; sufficiency_lower_bps 5000 gives lower_gate == floor(2 * 5000 / 10000) == 1 and sufficiency_upper_bps 15000 gives upper_gate == ceil(2 * 15000 / 10000) == 3."
            - "sample_pct_bps 10000 with sample_min_count 1, so the RANDOM_SAMPLE draw is a census of the four-line pool and sample_size == 4."
            - "County ALPHA (registered_voter_count 20); voters VA1 ACTIVE, VA2 / VA3 / VA4 INACTIVE, so exactly one of the four sampled lines can be VALID."
            - "cure_eligibility_floor_bps 5000, so a projection of 1 satisfies 1 * 10000 >= 2 * 5000 exactly and the petition is cure-eligible at the boundary."
