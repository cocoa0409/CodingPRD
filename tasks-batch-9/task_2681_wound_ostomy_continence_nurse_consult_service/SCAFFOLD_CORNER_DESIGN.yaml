            - "SupportSurfaceOrder.${o1_id}.vendor_service_fee_cents == 6780 and authorized_cost_cents == 232780, because 226000 >= FEE_TIER_3_FLOOR 200000 selects FEE_PCT_TIER_3 0.03"
            - "After approve: HTTP 200, fulfillment_status == APPROVED, billing_status == ENCUMBERED"
            - "Unit.${u1_id}.rental_encumbered_cents == 232780 and rental_available_cents == 267220"

