            - call: "POST /berry-ops/fruit-lots/${lot}/start-cooling"
              payload: { cooling_tunnel_id: "${tun}", cool_start_at: "2026-08-03T13:00:00Z", planned_cool_end_at: "2026-08-03T17:00:00Z", entry_pulp_temp_f: 60.0, pallet_slots: 1, expected_cooling_tunnel_version: "${tv}" }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/fruit-lots/${lot}/complete-cooling"
              payload: { cool_complete_at: "2026-08-03T17:00:00Z", exit_pulp_temp_f: 34.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/buyer-commitments"
              payload: { buyer_name: "Buyer V14", buyer_user_id: "buyer-6", variety: "STRAWBERRY", volume_commitment_lbs: 200.00, price_cents_per_lb: 400, shelf_life_guarantee_days: 5, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
