  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: welder_continuity_expiry_instant_inclusive
        grounds:
          - state_machines.Welder.QUALIFIED_to_LAPSED
          - entities.Welder.fields.continuity_expires_at_utc
          - validations.priority_25
        distinguishing_aspect: |
          Metric: an ISO-8601 instant compared to the second, on
          POST /weld-seams/{weld_seam_id}/weld-log. A welder qualified 2026-06-01 with a
          180-day continuity limit expires at exactly 2026-11-28T00:00:00Z, and at that
          instant the welder is still QUALIFIED; one second later the same welder is
          LAPSED. Nothing numeric and nothing monetary is involved.
        test_recipe:
          setup:
            - "A tank at ERECTION_IN_PROGRESS with one ADEQUATE course fitted up and two seams V1 and V2."
            - "Two welders W-07 and W-08, both qualified 2026-06-01T00:00:00Z with continuity_limit_days 180, so both carry continuity_expires_at_utc 2026-11-28T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
