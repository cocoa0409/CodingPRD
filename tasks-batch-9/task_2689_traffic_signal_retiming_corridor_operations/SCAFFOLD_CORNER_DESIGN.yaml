            - "${day0_count} == 1 while ${day0_total} == 2 — the CLOSED_NO_ACTION row is inside the window but outside the status set"
            - "${day0_score} == 92.50 (age component capped at 1.0, volume 20.0/25.0 == 0.8, complaint 1/20 == 0.05, ARTERIAL 1.25)"
            - "${bound_count} == 1 — at exactly 365 days the complaint's received_at equals the inclusive lower bound and is still counted; ${bound_score} == 92.50"
