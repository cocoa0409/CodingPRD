              as_user_id: "u_plan_1"
            - call: "GET /distributors/${dist_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { out_after_a: $.data.units_outstanding, rem_after_a: $.data.stock_allowance_remaining_units }
            - call: "POST /customer-orders/${ob_id}/confirm"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "GET /distributors/${dist_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { out_after_b: $.data.units_outstanding, rem_after_b: $.data.stock_allowance_remaining_units }
            - call: "POST /customer-orders/${oa_id}/cancel"
              payload: { cancellation_reason: "Customer deferred the 300-unit release to next year." }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
            - call: "GET /distributors/${dist_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { out_after_cancel: $.data.units_outstanding, rem_after_cancel: $.data.stock_allowance_remaining_units }
            - call: "POST /customer-orders/${oc_id}/confirm"
