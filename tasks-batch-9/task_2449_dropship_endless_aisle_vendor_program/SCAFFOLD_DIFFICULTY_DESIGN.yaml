    - entities.VendorScorecard.fields.metric_variant
    - entities.VendorScorecard.fields.composite_score
    - entities.VendorScorecard.fields.tier
    - entities.VendorScorecard.fields.promise_padding_days
    - endpoints[POST /dropship/vendors/{id}/scorecards]
    distinguishing_aspect: 'This instance lives in the VENDOR/performance domain and switches the weighting basis
      rather than the time basis: over one shipped line of 1 unit and one vendor-cancelled line of 9 units, EVENT_EQUAL
      yields cancellation_rate_bps 5000 / composite_score 85.00 / tier SILVER while UNIT_WEIGHTED yields 9000 /
