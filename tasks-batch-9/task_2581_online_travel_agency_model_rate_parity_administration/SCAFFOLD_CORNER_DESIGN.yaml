            - "Booking.${bk_init}.collection_model == AGENCY, arrival_at == 2026-09-20T15:00:00Z, booked_by_user_id == ba-1"
            - "Offer.${off}.allotment_held == 1 and allotment_remaining == 2"

      - name: resolve_an_already_resolved_dispute_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DisputeCase.FILED_to_RESOLVED
          - errors[ERR_DISPUTE_ALREADY_RESOLVED]
          - calculations.dispute_settlement_total
        distinguishing_aspect: "RESOLVED is the DisputeCase terminal state: a second resolve returns HTTP 409 ERR_DISPUTE_ALREADY_RESOLVED and leaves outcome SPLIT with binding_marketplace_cents 2112 unchanged."
        test_recipe:
          setup:
            - "A CAPTURED booking on the 24240 offer with refunded_cents 0."
            - "A REFUND_PASSTHROUGH dispute filed by co-3 claiming 1000 cents, so refund_due 1000, mediation_fee 2520 and settlement_total 3520."
            - "The case has been resolved SPLIT by co-4 against the 0.60 AGENCY agreement, giving 2112 / 1408."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_off_pub
            - *c_bk
            - *c_bk_cap
            - call: "POST /bookings/${bk}/dispute-cases"
              payload: { dispute_type: "REFUND_PASSTHROUGH", claim_cents: 1000, narrative: "traveller claims a resort fee was double charged" }
