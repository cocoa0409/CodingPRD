              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", basis: "REGULATORY_ADJUSTED", goodwill_created_usd: 40000000, core_deposit_intangible_usd: 10000000, aoci_markdown_usd: 25000000, deferred_tax_asset_usd: 12000000, transaction_costs_usd: 5000000, cash_consideration_usd: 20000000 }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { sch_good_id: "$.data.id" }
            - call: "POST /merger-applications/${app_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${acq_id}"
              captures: { app_v_after_submit: "$.data.version" }
            - call: "POST /pro-forma-schedules"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v_after_submit}", basis: "REGULATORY_ADJUSTED", goodwill_created_usd: 180000000, core_deposit_intangible_usd: 30000000, aoci_markdown_usd: 25000000, deferred_tax_asset_usd: 40000000, transaction_costs_usd: 8000000, cash_consideration_usd: 60000000 }
