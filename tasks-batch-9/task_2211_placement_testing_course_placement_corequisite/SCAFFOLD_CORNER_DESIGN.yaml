          state_machine_shape is cyclic and this is the return edge. While CLOSED the
          section rejects holds with ERR_SECTION_NOT_OPEN, and reopening restores the
          exact capability without disturbing the seat ledger — the ENROLLED row taken
          before the close still occupies its seat. Re-driving CLOSED -> OPEN from
          OPEN must fail with the distinct ERR_SECTION_NOT_CLOSED, so the two
          directions cannot share one lax guard.
