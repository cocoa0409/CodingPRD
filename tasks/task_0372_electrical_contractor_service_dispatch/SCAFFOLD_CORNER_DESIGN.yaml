              as: Dispatcher
          assert:
            - "At create (quantity 3, threshold 3): TruckStockItem.${stock_id}.low_stock == true"   # 3 <= 3
            - "After restock +1 (quantity 4): TruckStockItem.${stock_id}.low_stock == false"        # 4 > 3

      - name: cascade_estimate_accept_supersedes_sibling
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Estimate.SENT_to_ACCEPTED
          - state_machines.Estimate.SENT_to_SUPERSEDED
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_estimate_accept_supersede_chain_depth3
          rationale: "The accept -> sibling SUPERSEDED + job QUOTED cascade is asserted by the named §1.8 instance."

      - name: stale_version_estimate_create_occ
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[estimate-create-stale-job]'
          - 'errors[ERR_STALE_VERSION]'
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_invoice_round_then_sum_half_up
          rationale: "OCC stale-version on estimate create is fully exercised by the validations-section corner stale_version_on_estimate_create; placeholder cross-link retained for taxonomy completeness."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_invoice_visible_same_response
        claim_type: immediate
        grounds:
          - entities.ServiceJob.fields.total_due_cents
          - state_machines.ServiceJob.COMPLETED_to_INVOICED
        distinguishing_aspect: "Under the immediate consistency model, the invoice transition's computed total_due_cents and warranty_until are visible in the SAME /invoice response (no re-read needed)."
        test_recipe:
          setup: ["A job carried to COMPLETED with FLAT_RATE 10000, nonmember, no materials; clock set deterministically."]
          setup_api_calls:
            - call: "POST /v1/_clock/set"
              payload: { to_iso8601: "2026-08-19T08:00:00Z" }
              as: Dispatcher
            - call: "POST /v1/customers"
              payload: { full_name: "IM Cust", email: "im@x.com", service_zip: "53001", phone: "1" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /v1/technicians"
              payload: { full_name: "IM Tech", license_class: "JOURNEYMAN", service_zone: "530", hourly_rate_cents: 9000, on_call: false }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /v1/service-jobs"
              payload: { customer_id: "${cust_id}", scope: "OUTLET", job_class: "SERVICE" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 10000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-08-19T09:00:00Z", window_end: "2026-08-19T10:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /v1/dispatches/${disp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/dispatches/${disp_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /v1/service-jobs/${job_id}/invoice"
              payload: {}
              as: Dispatcher
              captures: { due: $.data.total_due_cents, warr: $.data.warranty_until }
          assert:
            - "The /invoice response itself has data.status == INVOICED and data.total_due_cents == 18900"
            - "The /invoice response itself has data.warranty_until non-null"
