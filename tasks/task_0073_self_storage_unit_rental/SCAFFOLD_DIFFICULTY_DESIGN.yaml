  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_lease_activate_requires_unit_available
        grounds:
          - state_machines.Lease.PENDING_to_ACTIVE
          - validations[priority=6]
          - entities.Unit.fields.status
        distinguishing_aspect: |
          Entity pair Lease->Unit: a PENDING Lease may only activate when its Unit.status == AVAILABLE.
          When the unit is already OCCUPIED by another lease, activation fails ERR_UNIT_NOT_AVAILABLE.
        test_recipe:
          setup:
            - "Two PENDING leases L1, L2 created on the SAME unit U1 with non-overlapping occupancy windows; L1 activated first occupies U1."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F13", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
