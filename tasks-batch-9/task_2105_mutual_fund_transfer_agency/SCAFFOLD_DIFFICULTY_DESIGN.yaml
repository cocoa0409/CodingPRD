              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T10:00:00Z" }
              as: FundAccountant
          trigger:
            - call: "POST /trades"
              payload: { account_id: "${acc_t}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 5000.00, as_of_date: "2026-08-03" }
