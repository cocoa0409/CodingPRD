      - name: the_posture_cascade_selects_by_source_status_and_only_partly_reverses
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Petition.transitions.POSTURE_OPEN_to_POSTURE_BLOCKED
          - state_machines.Petition.transitions.POSTURE_BLOCKED_to_POSTURE_OPEN
          - entities.CampaignCommunication.fields.blocked_reason
          - entities.PollSession.fields.status
        distinguishing_aspect: |
          The blocking cascade is narrower than the other two fan-outs over the same field: it blocks only
          APPROVED messages, so a DRAFT and a PENDING_LEGAL_REVIEW message on the same petition must be left
          exactly where they are (the dismissal cascade would have taken all three). The reverse cascade is
          deliberately partial: the SUSPENDED round returns to SCHEDULED and the POSTURE_BLOCKED message
          returns to APPROVED, but the cancelled poll sessions are gone for good and scheduled_session_count
          stays at 0 until the Board lays out a replacement.
        test_recipe:
          setup:
            - "petition 07-RC-340703 in ELECTION_SET with two SCHEDULED poll sessions"
            - "three email messages: one DRAFT, one PENDING_LEGAL_REVIEW, one APPROVED"
