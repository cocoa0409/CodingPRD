          - entities.EligibilityDetermination.fields.outcome
        distinguishing_aspect: |
          Threshold-boundary semantics of RULE_OF_75_POINTS on a single
          calculation. Two retirees differ only in credited_service_months,
          150 versus 143, which floor-divides to 12 versus 11 service years and
          therefore 75 versus 74 points against an inclusive >= 75 gate. The
          equal case must be ELIGIBLE and the one-point-below case INELIGIBLE,
          so the pair pins down both the inclusive comparison and the floor
          division: 143 / 12 is 11.9167 and truncating to 11 rather than
          rounding to 12 is what makes the second retiree fail.
