        captures:
          ob: $.data.id
      - call: POST /operating-budgets/${ob}/activate
        payload: {}
        as: Comptroller
      - call: POST /royalty-participants
        payload:
          production_id: ${pr}
          participant_name: A. Author
          role: AUTHOR
          fixed_gross_pct: 0.04
          pool_points: 4
          min_guarantee_cents: 400000
        as: GeneralManager
        captures:
          rp1: $.data.id
      - call: POST /royalty-participants
        payload:
          production_id: ${pr}
          participant_name: C. Composer
          role: COMPOSER
          fixed_gross_pct: 0.02
          pool_points: 3
          min_guarantee_cents: 250000
        as: GeneralManager
        captures:
          rp2: $.data.id
      - call: POST /royalty-participants
        payload:
          production_id: ${pr}
          participant_name: D. Director
          role: DIRECTOR
          fixed_gross_pct: 0.015
          pool_points: 2
          min_guarantee_cents: 150000
        as: GeneralManager
        captures:
          rp3: $.data.id
      - call: POST /productions/${pr}/convert-royalties-to-pool
        payload: {}
        as: LeadProducer
      - call: GET /royalty-participants?production_id=${pr}
        as: GeneralManager
      - call: POST /royalty-participants/${rp3}/terminate
        payload: {}
        as: LeadProducer
