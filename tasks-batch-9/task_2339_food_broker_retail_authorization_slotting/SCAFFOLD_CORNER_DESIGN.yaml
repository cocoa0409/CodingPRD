              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /category-reviews/${rev}/lock"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /category-reviews/${rev}/reopen"
              payload: { new_submission_deadline: "2026-09-05T00:00:00Z" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e2: $.data.error_id }
            - call: "POST /category-reviews/${rev}/reopen"
              payload: { new_submission_deadline: "2026-08-25T00:00:00Z" }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
