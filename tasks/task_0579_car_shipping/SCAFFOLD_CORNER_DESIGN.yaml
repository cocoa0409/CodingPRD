              payload: { expected_order_version: "${order_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { quote_id: $.data.id }
          assert:
            - "Quote.${quote_id}.base_cents == 85000"
            - "Quote.${quote_id}.inoperable_surcharge_cents == 15000"
            - "Quote.${quote_id}.total_cents == 100000"

      - name: claim_approved_capped_by_declared_value
        claim_type: Correct Result
        grounds: [calculations.claim_adjudication, entities.Claim.fields.approved_cents]
        distinguishing_aspect: "Claimed 2500000 against a single vehicle declared 1000000 (insurance 3000000): approved_cents = min(2500000, 1000000, 3000000) = 1000000 — capped by declared value."
        test_recipe:
