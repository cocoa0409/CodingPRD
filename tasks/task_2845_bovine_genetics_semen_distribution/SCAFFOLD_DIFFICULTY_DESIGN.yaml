  - rule_id: transitive_cascade
    instances:
      - name: clock_advance_expiry_suspension_void_chain_depth_three
        grounds:
          - state_machines.HealthTest.NEGATIVE_to_EXPIRED
          - state_machines.Sire.ELIGIBLE_to_SUSPENDED
          - state_machines.CollectionBooking.SCHEDULED_to_VOIDED
          - calculations.sire_required_test_compliance
        distinguishing_aspect: |
          Trigger is the CLOCK ADVANCE and the chain is three causally-linked hops: the clock expires the
          BLUETONGUE test (hop 1), the expiry - not the clock - breaks the sire's required-test coverage and
          suspends it (hop 2), and the suspension - not the clock - voids its future booking (hop 3). Removing
          hop 2 leaves hop 3 unreachable, which is what makes this transitive rather than fan-out.
        test_recipe:
          setup:
            - "Facility F-IA-06 (US, housing_capacity 2, bench_capacity 1) is APPROVED."
            - "Sire REG-B is RESIDENT and ELIGIBLE at F-IA-06."
            - "Its BLUETONGUE test was sampled 2026-08-01 with validity_days 40, so valid_until is 2026-09-10T00:00:00.000Z; IBR, BVD and TRICHOMONIASIS all run to 2027-08-01."
            - "A SCHEDULED booking for REG-B occupies 2026-09-20T08:00:00Z - 2026-09-20T10:00:00Z."
            - "The logical clock stands at 2026-08-31T00:00:00Z."
