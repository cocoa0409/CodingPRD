  # --- Ops / Clock ---
  - method: POST
    path: "/api/ops/run-daily-cycle"
    description: "Run the nightly circulation batch at the logical clock's current date. Pinned step order: (1) activate PENDING_START subscriptions with start_date <= today; (2) activate SCHEDULED holds; (3) complete ACTIVE holds with end_date <= today (proration credits issued); (4) weekly charge catch-up for billing_status IN {ACTIVE, GRACE, CANCEL_PENDING}; (5) expire OFFERED save offers past expires_at (CANCEL_PENDING -> CANCELLED); (6) lapse-cycle evaluation; (7) apply pending plan changes with effective_date <= today"
    roles: [CirculationDirector]
    code: 200
    input: []
    output: "{ activated_subscriptions: integer, holds_activated: integer, holds_completed: integer, charges_generated: integer, offers_expired: integer, status_changes: integer, plan_changes_applied: integer }"
    side_effects: ["All seven batch steps in pinned order"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. 'today' for all date rules = UTC date of the logical clock."
    roles: [CirculationDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock set; does NOT itself run the daily cycle"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Authenticated role not permitted for this endpoint" }
  - { id: ERR_NOT_OWN_RESOURCE, http: 403, condition: "Subscriber-role caller targets a resource outside their own account chain" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid fields: bad enum, non-positive amount, end_date <= start_date, non-Monday week_start_date, copies_returned > copies_delivered, effective_date <= today, hold length outside 1..21 days" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_subscription_version does not match Subscription.version (OCC)" }

  - { id: ERR_PLAN_RETIRED, http: 409, condition: "New subscription or plan-change targets a RETIRED plan" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "Operation requires billing_status in a specific active set (varies per endpoint: {ACTIVE, GRACE} for holds/assignments/cancel; non-terminal for offers/plan-change)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure (e.g., ending an ENDED assignment, disputing a non-SUBMITTED report)" }
  - { id: ERR_SERVICE_ADDRESS_REQUIRED, http: 409, condition: "Print-capable plan but subscriber.service_address is null" }
  - { id: ERR_DIGITAL_ONLY_PLAN, http: 409, condition: "Hold/complaint/assignment on a plan with issues_per_week == 0" }
  - { id: ERR_OFFER_NOT_OPEN, http: 409, condition: "Save offer not OFFERED, or expired (today >= expires_at)" }
  - { id: ERR_HOLD_NOT_CANCELLABLE, http: 409, condition: "Hold cancel requires status SCHEDULED" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "Hold resume requires status ACTIVE" }
  - { id: ERR_COMPLAINT_NOT_OPEN, http: 409, condition: "Complaint credit/deny requires status OPEN" }
  - { id: ERR_COMPLAINT_WINDOW_CLOSED, http: 409, condition: "service_date older than 7 days before today" }
  - { id: ERR_DUPLICATE_COMPLAINT, http: 409, condition: "Non-DENIED complaint already exists for (subscription_id, service_date)" }
  - { id: ERR_REPORT_NOT_EDITABLE, http: 409, condition: "PATCH outside DRAFT/DISPUTED" }
  - { id: ERR_REPORT_NOT_SUBMITTABLE, http: 409, condition: "submit requires status DRAFT or DISPUTED" }
  - { id: ERR_REPORT_NOT_RECONCILABLE, http: 409, condition: "reconcile requires status SUBMITTED" }
  - { id: ERR_REPORT_WEEK_CONFLICT, http: 409, condition: "Another report exists for the same rack and week_start_date" }
  - { id: ERR_PAYMENT_NOT_INITIATED, http: 409, condition: "mark-cleared/mark-failed requires INITIATED" }
  - { id: ERR_PAYMENT_NOT_CLEARED, http: 409, condition: "reverse requires CLEARED" }
  - { id: ERR_CHARGE_NOT_OPEN, http: 409, condition: "write-off requires OPEN or PARTIALLY_PAID" }
  - { id: ERR_AUDIT_NOT_DRAFT, http: 409, condition: "certify requires DRAFT" }
  - { id: ERR_AUDIT_NOT_CERTIFIED, http: 409, condition: "submit requires CERTIFIED" }
  - { id: ERR_AUDIT_PERIOD_OVERLAP, http: 409, condition: "Audit period overlaps an existing DRAFT/CERTIFIED/SUBMITTED report" }
  - { id: ERR_UNRECONCILED_RACK_VARIANCE, http: 409, condition: "Certify blocked: an in-period RackSalesReport is not RECONCILED" }
  - { id: ERR_HOLD_WINDOW_INVALID, http: 409, condition: "Hold start_date in the past relative to today (temporal validity)" }
  - { id: ERR_HOLD_OVERLAP, http: 409, condition: "Hold [start,end) overlaps a SCHEDULED/ACTIVE hold; adjacency (new.start == existing.end) is allowed" }
  - { id: ERR_HOLD_LIMIT_EXCEEDED, http: 409, condition: "Annual hold budget: SCHEDULED/ACTIVE/COMPLETED days in calendar year + new hold > 30" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "Closed-interval [start,end] collision with another ACTIVE assignment of the same subscription; touching ends (new.start == existing.end) collide" }
  - { id: ERR_ROUTE_AT_CAPACITY, http: 409, condition: "route.assigned_stop_count >= max_stops" }
  - { id: ERR_ROUTE_INACTIVE, http: 409, condition: "Assignment into an INACTIVE route" }
  - { id: ERR_CREDIT_MEMO_LOCKED, http: 409, condition: "Void requires applied_cents == 0" }
  - { id: ERR_GOODWILL_CAP_EXCEEDED, http: 409, condition: "Monthly GOODWILL+COMPLAINT credit total would exceed 5000 cents" }
  - { id: ERR_CREDIT_EXCEEDS_COMPLAINT_CAP, http: 409, condition: "Complaint credit exceeds 2000 cents" }
  - { id: ERR_SUBSCRIBER_NOT_SETTLED, http: 409, condition: "Subscriber close requires balance_due_cents == 0 and unapplied_cash_cents == 0" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Subscriber
    description: "Self-service account holder; may only touch resources in their own account chain"
    identity: "entity_backed:Subscriber"
    exclusive_operations: []
    shared_operations:
      - "POST /api/subscriptions (own), POST /api/subscriptions/{id}/plan-change (own), POST /api/subscriptions/{id}/cancel (own)"
      - "POST /api/subscriptions/{id}/vacation-holds (own), POST /api/vacation-holds/{id}/cancel|resume (own)"
      - "POST /api/complaints (own), POST /api/payments (own)"
      - "POST /api/save-offers/{id}/accept|decline (own)"
      - "GET own subscriptions, holds, complaints, payments, charges, offers, plans, own subscriber record"
  - name: ServiceRep
    description: "Customer service representative: subscriber care, complaints, credits, payments, retention offers"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/complaints/{id}/credit — issue complaint credit"
      - "POST /api/complaints/{id}/deny — deny complaint"
      - "POST /api/credit-memos — goodwill credit"
      - "POST /api/payments/{id}/mark-cleared — clear payment"
      - "POST /api/payments/{id}/mark-failed — fail payment"
    shared_operations:
      - "POST /api/subscribers; subscription create/cancel/plan-change; holds; complaints; payments create; save-offer create/accept/decline; most GETs"
  - name: DistrictManager
    description: "Distribution operations: routes, carriers, assignments, racks, rack sales reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/routes, PATCH /api/routes/{id}"
      - "POST /api/carriers"
      - "POST /api/route-assignments, POST /api/route-assignments/{id}/end"
      - "POST /api/rack-locations, PATCH /api/rack-locations/{id}"
      - "POST /api/rack-sales-reports, PATCH /api/rack-sales-reports/{id}, POST /api/rack-sales-reports/{id}/submit"
    shared_operations:
      - "GET distribution resources, subscribers, subscriptions, complaints (settlement attribution), settlement read"
  - name: CirculationDirector
    description: "Hierarchical override: everything below plus plan config, audit bureau reporting, financial overrides, batch cycle, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/subscription-plans, POST /api/subscription-plans/{id}/retire"
      - "POST /api/audit-reports, POST /api/audit-reports/{id}/certify, POST /api/audit-reports/{id}/submit"
      - "POST /api/payments/{id}/reverse — reverse cleared payment"
      - "POST /api/billing-charges/{id}/write-off"
      - "POST /api/credit-memos/{id}/void"
      - "POST /api/rack-sales-reports/{id}/reconcile, POST /api/rack-sales-reports/{id}/dispute"
      - "POST /api/ops/run-daily-cycle, POST /_clock/set_current_utc"
    shared_operations:
      - "All operations of ServiceRep and DistrictManager"
