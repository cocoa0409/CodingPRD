# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_0273_museum_zoo_membership_admission  (Expert)
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_provisional_vs_final_diverge_on_member_pricing
        grounds:
          - calculations.order_total
          - entities.AdmissionOrder.fields.quoted_total_cents
          - entities.AdmissionOrder.fields.final_total_cents
          - state_machines.AdmissionOrder.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          Dual-variant lives on the AdmissionOrder domain: the provisional quote prices a MEMBER
          ticket at plan.member_admission_cents even when the membership is only ACTIVE at confirm;
          the final variant locks member pricing only when Membership.status==ACTIVE, so the two
          variants are computed on the same order from the same tickets yet are authoritative at
          different lifecycle points.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Plan PLAN_HH: member_admission_cents=1500, annual_fee_cents=12000, guest_passes_granted=2, household_max=3, term_days=365."
            - "Patron P owns ACTIVE Membership M on PLAN_HH (settled)."
            - "Slot S window 2026-06-10T10:00Z..12:00Z, capacity 10, non_member_admission_cents=2500."
            - "DRAFT order O on S linked to M with 1 MEMBER ticket and 1 NON_MEMBER ticket."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "HOUSEHOLD", annual_fee_cents: 12000, household_max: 3, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}", membership_id: "${m_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "MEMBER", person_name: "P One" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "Guest A" }
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { conf_total: $.data.final_total_cents }
          assert:
            - "AdmissionOrder.${o_id}.quoted_total_cents == 4000"
            - "AdmissionOrder.${o_id}.final_total_cents == 4000"
            - "AdmissionOrder.${o_id}.status == CONFIRMED"

      - name: renewal_fee_early_vs_lapsed_diverge_on_membership_domain
        grounds:
          - calculations.renewal_fee
          - entities.Membership.fields.last_paid_fee_cents
          - state_machines.Membership.GRACE_to_ACTIVE
        distinguishing_aspect: |
          The second dual-variant calculation operates on the Membership domain (not AdmissionOrder):
          renewing while ACTIVE charges annual_fee_cents (early) and extends from prior expiry, while
          reinstating while GRACE charges annual_fee_cents + reinstatement_fee_cents (lapsed) and
          restarts the term at clock.now — different result for the same plan inputs.
        test_recipe:
          setup:
            - "Plan PLAN_RE: annual_fee_cents=12000, reinstatement_fee_cents=3000, term_days=365, guest_passes_granted=2."
            - "Patron P owns Membership M activated 2026-06-01, expires 2027-06-01."
            - "Clock advanced past expiry+grace-window-open: 2027-06-15 (M in GRACE, grace_until=2027-07-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "INDIVIDUAL", annual_fee_cents: 12000, household_max: 0, guest_passes_granted: 2, member_admission_cents: 1500, reinstatement_fee_cents: 3000 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "p2@x.com", full_name: "P Two" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}", auto_renew: false }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /_jobs/run_expirations"
              payload: {}
              as: MembershipAdmin
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_v}" }
              as: Patron
              as_user_id: "${p_id}"
          assert:
            - "Membership.${m_id}.status == ACTIVE"
            - "Membership.${m_id}.last_paid_fee_cents == 15000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_total_nested_branch_member_nonmember_reciprocal_with_surcharge
        grounds:
          - calculations.order_total
          - entities.AdmissionTicket.fields.ticket_type
          - entities.ReciprocalPartner.fields.benefit_type
          - entities.SpecialExhibit.fields.member_surcharge_discount_pct
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — per-ticket base selected by a nested
          branch over ticket_type (MEMBER / NON_MEMBER / RECIPROCAL-DISCOUNT), combined with a
          special-exhibit surcharge that is itself member-discounted, plus a donation add-on.
        test_recipe:
          setup:
            - "Plan PLAN_HH member_admission_cents=1500, exhibit_surcharge_waived=false."
            - "Patron P, ACTIVE Membership M on PLAN_HH."
            - "Slot S non_member_admission_cents=2500, window 2026-06-10T10:00..12:00Z."
            - "Exhibit E surcharge_cents=1000, member_surcharge_discount_pct=0.25, buffer_minutes=0; session ES window 2026-06-10T10:30..11:30Z capacity 10."
            - "Reciprocal partner RP benefit_type=DISCOUNT, discount_pct=0.5."
            - "DRAFT order O on S, membership M, exhibit_session_id ES, donation_cents=500, tickets: 1 MEMBER, 1 NON_MEMBER, 1 RECIPROCAL(RP)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "HOUSEHOLD", annual_fee_cents: 12000, household_max: 3, guest_passes_granted: 2, member_admission_cents: 1500, exhibit_surcharge_waived: false }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "p3@x.com", full_name: "P Three" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /special-exhibits"
              payload: { name: "Dinosaurs", surcharge_cents: 1000, member_surcharge_discount_pct: 0.25, buffer_minutes: 0 }
              as: MembershipAdmin
              captures: { ex_id: $.data.id }
            - call: "POST /special-exhibits/${ex_id}/sessions"
              payload: { starts_at: "2026-06-10T10:30:00Z", ends_at: "2026-06-10T11:30:00Z", capacity_total: 10 }
              as: MembershipAdmin
              captures: { es_id: $.data.id }
            - call: "POST /reciprocal-partners"
              payload: { org_name: "Sister Museum", benefit_type: "DISCOUNT", discount_pct: 0.5 }
              as: MembershipAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}", membership_id: "${m_id}", exhibit_session_id: "${es_id}", donation_cents: 500 }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "MEMBER", person_name: "P Three" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "Guest B" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "RECIPROCAL", person_name: "Guest C", reciprocal_partner_id: "${rp_id}" }
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          assert:
            - "AdmissionOrder.${o_id}.final_total_cents == 8500"
            - "AdmissionOrder.${o_id}.status == CONFIRMED"

      - name: surcharge_rounding_per_ticket_then_sum_not_sum_then_discount
        grounds:
          - calculations.order_total
          - entities.SpecialExhibit.fields.member_surcharge_discount_pct
          - entities.SpecialExhibit.fields.surcharge_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins round-per-ticket-then-sum.
          With surcharge_cents=1000 and member_surcharge_discount_pct=0.3333 over 3 MEMBER tickets,
          per-ticket-then-sum yields 3*667=2001 surcharge cents, whereas sum-then-discount would yield
          round(3000*0.6667)=2000; the pinned order produces 2001.
        test_recipe:
          setup:
            - "Plan member_admission_cents=1500, exhibit_surcharge_waived=false."
            - "Patron P, ACTIVE Membership M."
            - "Slot S capacity 10, window 2026-06-10T10:00..12:00Z."
            - "Exhibit E surcharge_cents=1000, member_surcharge_discount_pct=0.3333, buffer_minutes=0; session ES window 2026-06-10T10:30..11:30Z capacity 10."
            - "DRAFT order O on S, membership M, exhibit_session_id ES, 3 MEMBER tickets, donation 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "HOUSEHOLD", annual_fee_cents: 12000, household_max: 3, guest_passes_granted: 2, member_admission_cents: 1500, exhibit_surcharge_waived: false }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "p4@x.com", full_name: "P Four" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /special-exhibits"
              payload: { name: "Frogs", surcharge_cents: 1000, member_surcharge_discount_pct: 0.3333, buffer_minutes: 0 }
              as: MembershipAdmin
              captures: { ex_id: $.data.id }
            - call: "POST /special-exhibits/${ex_id}/sessions"
              payload: { starts_at: "2026-06-10T10:30:00Z", ends_at: "2026-06-10T11:30:00Z", capacity_total: 10 }
              as: MembershipAdmin
              captures: { es_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}", membership_id: "${m_id}", exhibit_session_id: "${es_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "MEMBER", person_name: "A" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "MEMBER", person_name: "B" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "MEMBER", person_name: "C" }
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          assert:
            - "AdmissionOrder.${o_id}.final_total_cents == 6501"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_cyclic_active_grace_active_via_reinstatement
        grounds:
          - state_machines.Membership.ACTIVE_to_GRACE
          - state_machines.Membership.GRACE_to_ACTIVE
        distinguishing_aspect: |
          Membership exhibits a cycle ACTIVE -> GRACE -> ACTIVE: the expiry job moves an ACTIVE
          membership to GRACE, then a reinstatement renew returns it to ACTIVE, the same status it
          held before — a non-linear loop on the Membership entity.
        test_recipe:
          setup:
            - "Patron P, Membership M ACTIVE, expires 2027-06-01; clock advanced to 2027-06-15 (GRACE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "INDIVIDUAL", annual_fee_cents: 12000, household_max: 0, guest_passes_granted: 2, member_admission_cents: 1500, reinstatement_fee_cents: 3000 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "p5@x.com", full_name: "P Five" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}", auto_renew: false }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /_jobs/run_expirations"
              payload: {}
              as: MembershipAdmin
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_v}" }
              as: Patron
              as_user_id: "${p_id}"
          assert:
            - "Membership.${m_id}.status == ACTIVE"
            - "Membership.${m_id}.term_count == 2"

      - name: admission_order_branching_confirmed_to_checkin_or_cancel
        grounds:
          - state_machines.AdmissionOrder.CONFIRMED_to_CHECKED_IN
          - state_machines.AdmissionOrder.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          AdmissionOrder branches from CONFIRMED into two targets with divergent side-effect sets:
          check-in scans tickets and redeems guest passes, whereas cancel voids tickets and releases
          slot capacity — a branching (fork) shape on a different entity than Membership.
        test_recipe:
          setup:
            - "Patron P, ACTIVE membership; slot S window 2026-06-10T10:00..12:00Z capacity 10."
            - "CONFIRMED order O on S with 1 NON_MEMBER ticket (no membership link)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /patrons"
              payload: { email: "p6@x.com", full_name: "P Six" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "P Six" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /admission-orders/${o_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          assert:
            - "AdmissionOrder.${o_id}.status == CANCELLED"
            - "TimedEntrySlot.${slot_id}.reserved_count == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: membership_cancel_cascade_depth3_to_guestpass_ticket_slot
        grounds:
          - state_machines.Membership.transitions
          - state_machines.GuestPass.RESERVED_to_UNUSED
          - state_machines.AdmissionTicket.ACTIVE_to_VOIDED
          - calculations.slot_reserved_count
        distinguishing_aspect: |
          Depth-3 cascade originating at membership cancel: Membership CANCELLED -> each RESERVED
          GuestPass released -> the GuestPass's linked GUEST AdmissionTicket VOIDED -> that void
          decrements the order's TimedEntrySlot.reserved_count. Each hop is caused by the previous,
          not by the cancel directly.
        test_recipe:
          setup:
            - "Patron P, ACTIVE membership M (guest_passes_granted=2)."
            - "Slot S capacity 10, window 2026-06-10T10:00..12:00Z."
            - "CONFIRMED order O on S, membership M, party_size 1: a single GUEST ticket (1 pass RESERVED). slot.reserved_count==1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "HOUSEHOLD", annual_fee_cents: 12000, household_max: 3, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "p7@x.com", full_name: "P Seven" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}", membership_id: "${m_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "GUEST", person_name: "Visitor" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /memberships/${m_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          assert:
            - "Membership.${m_id}.status == CANCELLED"
            - "TimedEntrySlot.${slot_id}.reserved_count == 0"

      - name: order_cancel_cascade_depth2_to_ticket_then_slot
        grounds:
          - state_machines.AdmissionOrder.CONFIRMED_to_CANCELLED
          - state_machines.AdmissionTicket.ACTIVE_to_VOIDED
          - calculations.slot_reserved_count
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (order cancel, not membership cancel): order
          CANCELLED -> its AdmissionTickets VOIDED -> that void decrements TimedEntrySlot.reserved_count.
        test_recipe:
          setup:
            - "Patron P; slot S capacity 10, window 2026-06-10T10:00..12:00Z."
            - "CONFIRMED order O on S with 2 NON_MEMBER tickets; slot.reserved_count==2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /patrons"
              payload: { email: "p8@x.com", full_name: "P Eight" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /timed-entry-slots"
