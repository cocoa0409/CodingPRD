  # ============================================================ calculations
  - section: calculations
    instances:
      - name: rebate_accrual_daily_amount
        claim_type: correct_result
        grounds: [calculations.rebate_accrual]
        distinguishing_aspect: "Rebate on 10,200,000c of cash collateral at 150bps accrues exactly 425c per day as a NEGATIVE entry (income owed to the borrower)."
        test_recipe:
          setup: ["CASH loan qty 10,000 @ 1000c BOOKED, cash pledge 10,200,000c, rebate rate 150bps"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "CL1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Cl1", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Cl1", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 10000, collateral_type: "CASH", rate_bps: 150 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 10200000 }, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "GET /api/ledger-entries?loan_id=${loan}&entry_type=REBATE_ACCRUAL", as: OpsSettler, captures: { reb: "$.data[0].amount_cents" } }
          assert:
            - "${reb} == -425 (round_half_up(10200000 x 150 / 10000 / 360), posted negative)"
            - "Exactly 1 REBATE_ACCRUAL entry exists for 2026-08-01"

      - name: on_time_recall_delivery_accrues_zero_fail_fee
        claim_type: correct_result
        grounds: [calculations.fail_fee_accrual, state_machines.Recall.ISSUED_to_COMPLETED]
        distinguishing_aspect: "Boundary of the fee window: delivery on the deadline day itself accrues zero days (deadline exclusive) — recall COMPLETED, fail_fee_cents stays 0, no FAIL_FEE entry is posted."
        test_recipe:
          setup: ["BOOKED loan qty 1000; recall issued 2026-08-01 deadline 2026-08-03; clock advanced to 2026-08-03T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "CL2", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Cl2", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Cl2", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/recalls", payload: { quantity: 1000, reason: "CORPORATE_ACTION", deadline_date: "2026-08-03" }, as: OwnerRep, as_user_id: "${own}", captures: { rec: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: DeskAdmin }
          trigger:
            - { call: "POST /api/loans/${loan}/returns", payload: { quantity: 1000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { lst: $.data.status } }
            - { call: "GET /api/recalls/${rec}", as: DeskTrader, captures: { rst: $.data.status, fee: $.data.fail_fee_cents } }
          assert:
            - "${lst} == SETTLED and ${rst} == COMPLETED"
            - "${fee} == 0 and GET /api/ledger-entries?loan_id=${loan}&entry_type=FAIL_FEE returns an empty array"

      - name: utilization_ignores_proposed_loans
        claim_type: input_set_filtering
        grounds: [calculations.borrower_utilization_bps, entities.Borrower.fields.utilization_cents]
        distinguishing_aspect: "Only BOOKED/RECALLED loans count: a borrower holding nothing but a PROPOSED loan shows utilization_cents 0 and utilization_bps 0."
        test_recipe:
          setup: ["borrower limit 100000000c with one PROPOSED loan qty 50,000 @ 1000c"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "CL3", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Cl3", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Cl3", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 50000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader }
          trigger:
            - { call: "GET /api/borrowers/${bor}", as: DeskTrader, captures: { uc: $.data.utilization_cents, ub: $.data.utilization_bps } }
          assert:
            - "${uc} == 0 and ${ub} == 0 (PROPOSED is outside the input set)"

      - name: no_indemnity_credit_when_owner_not_opted_in
        claim_type: variant_selection
        grounds: [calculations.indemnity_shortfall, entities.BeneficialOwner.fields.indemnification_opt_in]
        distinguishing_aspect: "Same default mechanics as the cascade difficulty instance but with indemnification_opt_in=false: the shortfall is borne by the owner and NO INDEMNITY_CREDIT entry is written."
        test_recipe:
          setup: ["owner indemnification_opt_in=false; CASH loan qty 1000 BOOKED @1000c, pledged 1,020,000c; price moved to 1100c"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "CL4", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Cl4", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Cl4", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/securities/${sec}/price", payload: { price_cents: 1100 }, as: DeskAdmin }
          trigger:
            - { call: "POST /api/borrowers/${bor}/default", payload: {}, as: RiskOfficer }
            - { call: "GET /api/ledger-entries?loan_id=${loan}&entry_type=INDEMNITY_CREDIT", as: RiskOfficer }
            - { call: "GET /api/ledger-entries?loan_id=${loan}&entry_type=COLLATERAL_SEIZURE", as: RiskOfficer, captures: { sz: "$.data[0].amount_cents" } }
          assert:
            - "The INDEMNITY_CREDIT list is empty (owner not indemnified: 80,000c shortfall stays with the owner)"
            - "${sz} == 1020000 (seizure entry still posted)"

  # ============================================================ validations
  - section: validations
    instances:
      - name: create_security_missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "An invalid/absent X-User-Role is rejected 401 before any role or existence logic runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/securities", payload: { symbol: "NAU1", asset_class: "EQUITY", price_cents: 100 }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: role_check_fires_before_existence_on_confirm
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=5]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "BorrowerRep is not in confirm's roles: the 403 fires even though the loan id does not exist — authz (priority 2) precedes existence (priority 5)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/loans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/confirm", payload: {}, as: BorrowerRep, as_user_id: "00000000-0000-4000-8000-000000000001", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN (not ERR_NOT_FOUND)"

      - name: request_shape_fires_before_existence_on_pledge
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A pledge payload missing pledge_type fails with ERR_VALIDATION (priority 4) even when the loan id in the path does not exist (priority 5)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/loans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/pledges", payload: { amount_cents: 100 }, as: BorrowerRep, as_user_id: "00000000-0000-4000-8000-000000000001", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION (not ERR_NOT_FOUND)"

      - name: owner_cannot_suspend_other_owners_position
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "Entity-backed scoping: OwnerRep A's X-User-ID does not equal position.owner_id of Owner B's position — 403 even though the role is allowed on the endpoint."
        test_recipe:
          setup: ["two owners A and B; B has a position"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SCP1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner A", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { ownA: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner B", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { ownB: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${ownB}", security_id: "${sec}", quantity_total: 1000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${ownB}", captures: { posB: $.data.id } }
          trigger:
            - { call: "POST /api/lendable-positions/${posB}/suspend", payload: {}, as: OwnerRep, as_user_id: "${ownA}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
            - "LendablePosition.${posB}.status remains OPEN"

  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: match_selector_ranks_by_min_fee_then_created
        claim_type: conditional_action
        grounds: [endpoints, calculations.forward_capacity_check, "errors[ERR_NO_INVENTORY]"]
        distinguishing_aspect: "Selector determinism: with position_id omitted, the desk's match picks the eligible position with the lowest min_fee_bps (25 beats 30), and the proposal inherits that rate."
        test_recipe:
          setup: ["two eligible positions on the same security: P1 min_fee 30 (created first), P2 min_fee 25 (created second); SUBMITTED request qty 1000 max_rate 40"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SEL1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Sel", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Sel", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 10000, min_fee_bps: 30 }, as: OwnerRep, as_user_id: "${own}", captures: { p1: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 10000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { p2: $.data.id } }
            - { call: "POST /api/borrow-requests", payload: { borrower_id: "${bor}", security_id: "${sec}", quantity: 1000, max_rate_bps: 40, collateral_type: "SECURITIES", needed_by_date: "2026-08-20" }, as: BorrowerRep, as_user_id: "${bor}", captures: { req: $.data.id } }
          trigger:
            - { call: "POST /api/borrow-requests/${req}/match", payload: {}, as: DeskTrader, captures: { mpos: $.data.position_id, mrate: $.data.rate_bps, mstat: $.data.status } }
          assert:
            - "${mpos} == ${p2} (min_fee_bps ASC ranks the 25bps position first)"
            - "${mrate} == 25 (proposal priced at the position's min_fee)"
            - "${mstat} == PROPOSED and BorrowRequest.${req}.status == MATCHED"

      - name: match_with_empty_eligible_pool_returns_no_inventory
        claim_type: conditional_action
        grounds: ["errors[ERR_NO_INVENTORY]", endpoints]
        distinguishing_aspect: "Empty-set boundary: the only position holds 500 shares but the request needs 1000 — the selector pool is empty after the capacity filter."
        test_recipe:
          setup: ["one position qty 500; SUBMITTED request qty 1000"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SEL2", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Sel2", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Sel2", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 500, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}" }
            - { call: "POST /api/borrow-requests", payload: { borrower_id: "${bor}", security_id: "${sec}", quantity: 1000, max_rate_bps: 40, collateral_type: "SECURITIES", needed_by_date: "2026-08-20" }, as: BorrowerRep, as_user_id: "${bor}", captures: { req: $.data.id } }
          trigger:
            - { call: "POST /api/borrow-requests/${req}/match", payload: {}, as: DeskTrader, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NO_INVENTORY"
            - "BorrowRequest.${req}.status remains SUBMITTED"

      - name: price_update_recomputes_market_value_immediately
        claim_type: computed_read
        grounds: [entities.Loan.fields.market_value_cents, calculations.required_collateral_value]
        distinguishing_aspect: "Derived fields reconcile on write (immediate consistency), not at the next MTM: after the price moves 1000 -> 1200, the loan read shows market_value 1,200,000c and required 1,224,000c with no MTM run."
        test_recipe:
          setup: ["CASH loan qty 1000 BOOKED @ 1000c"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "DRV1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Drv", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Drv", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/securities/${sec}/price", payload: { price_cents: 1200 }, as: DeskAdmin }
            - { call: "GET /api/loans/${loan}", as: DeskTrader, captures: { mv: $.data.market_value_cents, req: $.data.required_collateral_cents } }
          assert:
            - "${mv} == 1200000 and ${req} == 1224000 (no mark-to-market run was executed)"
            - "No MarginCall exists yet (issuance stays batched at the ops run)"

      - name: release_of_deficit_creating_pledge_rejected
        claim_type: conditional_action
        grounds: ["errors[ERR_MARGIN_DEFICIT]", state_machines.CollateralPledge.ACTIVE_to_RELEASED]
        distinguishing_aspect: "A release that would push posted below required is rejected; a release that keeps coverage at or above required succeeds."
        test_recipe:
          setup: ["CASH loan qty 1000 BOOKED @ 1000c (required 1,020,000c); two cash pledges: 1,020,000c and 50,000c"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "REL1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Rel", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Rel", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { big: $.data.id } }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 50000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { small: $.data.id } }
          trigger:
            - { call: "POST /api/pledges/${big}/release", payload: {}, as: DeskTrader, captures: { err: $.data.error_id } }
            - { call: "POST /api/pledges/${small}/release", payload: {}, as: DeskTrader, captures: { rel_st: $.data.status } }
          assert:
            - "${err} == ERR_MARGIN_DEFICIT (releasing 1,020,000 would leave 50,000 < 1,020,000)"
            - "${rel_st} == RELEASED (releasing the 50,000 excess leaves exactly 1,020,000 >= 1,020,000 — equality passes)"

  # ============================================================ errors
  - section: errors
    instances:
      - name: month_end_double_close_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERIOD_ALREADY_CLOSED]", entities.PeriodClose]
        distinguishing_aspect: "PeriodClose.period is unique: closing 2026-08 twice yields ERR_PERIOD_ALREADY_CLOSED on the repeat."
        test_recipe:
          setup: ["period 2026-08 already closed"]
          setup_api_calls:
            - { call: "POST /api/ops/month-end-close", payload: { period: "2026-08" }, as: OpsSettler }
          trigger:
            - { call: "POST /api/ops/month-end-close", payload: { period: "2026-08" }, as: OpsSettler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PERIOD_ALREADY_CLOSED"

      - name: report_finalize_before_period_close_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERIOD_NOT_CLOSED]", state_machines.RegulatoryReport.DRAFT_to_FINALIZED]
        distinguishing_aspect: "A report for unclosed period 2026-09 cannot finalize; after closing the period the same report finalizes."
        test_recipe:
          setup: ["DRAFT report for 2026-09; no PeriodClose for 2026-09"]
          setup_api_calls:
            - { call: "POST /api/regulatory-reports", payload: { period: "2026-09", report_type: "FAILS_AND_BUYINS" }, as: OpsSettler, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /api/regulatory-reports/${rep}/finalize", payload: {}, as: OpsSettler, captures: { err: $.data.error_id } }
            - { call: "POST /api/ops/month-end-close", payload: { period: "2026-09" }, as: OpsSettler }
            - { call: "POST /api/regulatory-reports/${rep}/finalize", payload: {}, as: OpsSettler, captures: { st: $.data.status, fc: $.data.fail_count } }
          assert:
            - "${err} == ERR_PERIOD_NOT_CLOSED"
            - "${st} == FINALIZED and ${fc} == 0 after the close exists"

      - name: offboard_blocked_while_loans_open
        claim_type: violation_to_error
        grounds: ["errors[ERR_OWNER_HAS_OPEN_LOANS]", state_machines.BeneficialOwner.ACTIVE_to_OFFBOARDED]
        distinguishing_aspect: "Owner with a BOOKED loan cannot offboard; after the loan settles, offboard succeeds and suspends the open position."
        test_recipe:
          setup: ["owner with position and one BOOKED loan qty 500"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "OFF1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Off", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Off", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 10000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 500, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/beneficial-owners/${own}/offboard", payload: {}, as: RiskOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /api/loans/${loan}/returns", payload: { quantity: 500 }, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/beneficial-owners/${own}/offboard", payload: {}, as: RiskOfficer, captures: { ost: $.data.status } }
            - { call: "GET /api/lendable-positions/${pos}", as: RiskOfficer, captures: { pst: $.data.status } }
          assert:
            - "${err} == ERR_OWNER_HAS_OPEN_LOANS"
            - "${ost} == OFFBOARDED after settlement"
            - "${pst} == SUSPENDED (offboard cascades to open positions)"

      - name: return_exceeding_outstanding_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_RETURN_EXCEEDS_LOAN]", state_machines.Loan]
        distinguishing_aspect: "Return quantity greater than outstanding_quantity is a fiscal-order rejection (422) and does not change any bucket."
        test_recipe:
          setup: ["BOOKED loan qty 1000; 400 already returned (outstanding 600)"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "RET1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Ret", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Ret", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/returns", payload: { quantity: 400 }, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/loans/${loan}/returns", payload: { quantity: 601 }, as: BorrowerRep, as_user_id: "${bor}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_RETURN_EXCEEDS_LOAN"
            - "Loan.${loan}.outstanding_quantity remains 600"

      - name: cash_pledge_field_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLEDGE_TYPE_MISMATCH]", "validations[priority=8]"]
        distinguishing_aspect: "pledge_type=CASH carrying a quantity field violates the pledge shape contract (422)."
        test_recipe:
          setup: ["CASH loan qty 1000 BOOKED"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "PTY1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Pty", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Pty", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000, quantity: 5 }, as: BorrowerRep, as_user_id: "${bor}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PLEDGE_TYPE_MISMATCH"

      - name: recall_deadline_must_be_strictly_after_issue
        claim_type: violation_to_error
        grounds: ["errors[ERR_RECALL_WINDOW_INVALID]", "validations[priority=9]"]
        distinguishing_aspect: "deadline_date equal to the issue date (2026-08-01) is rejected; the earliest legal deadline is the next calendar day."
        test_recipe:
          setup: ["BOOKED loan qty 1000"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "RW1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Rw", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Rw", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/loans/${loan}/recalls", payload: { quantity: 1000, reason: "SALE", deadline_date: "2026-08-01" }, as: OwnerRep, as_user_id: "${own}", captures: { err: $.data.error_id } }
            - { call: "POST /api/loans/${loan}/recalls", payload: { quantity: 1000, reason: "SALE", deadline_date: "2026-08-02" }, as: OwnerRep, as_user_id: "${own}", captures: { rst: $.data.status } }
          assert:
            - "${err} == ERR_RECALL_WINDOW_INVALID (same-day deadline rejected)"
            - "${rst} == ISSUED (next-day deadline accepted) and Loan.${loan}.status == RECALLED"

      - name: override_window_inverted_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_WINDOW]", "validations[priority=9]"]
        distinguishing_aspect: "effective_from >= expires_at fails the temporal window rule at request creation."
        test_recipe:
          setup: ["borrower exists"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Win2", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
          trigger:
            - { call: "POST /api/borrowers/${bor}/limit-overrides", payload: { new_limit_cents: 200000000, effective_from: "2026-10-01", expires_at: "2026-09-01" }, as: DeskTrader, as_user_id: "trader-9", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_WINDOW"

      - name: counter_above_request_max_rate_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_RATE_ABOVE_MAX]", state_machines.Loan.PROPOSED_to_COUNTERED]
        distinguishing_aspect: "On a request-linked proposal the borrower's counter may not exceed the request's max_rate_bps (40): counter 41 rejected, counter 40 accepted."
        test_recipe:
          setup: ["request max_rate_bps 40 matched to a position min_fee 25 -> proposal at 25bps"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "RTE1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Rte", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Rte", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 10000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/borrow-requests", payload: { borrower_id: "${bor}", security_id: "${sec}", quantity: 1000, max_rate_bps: 40, collateral_type: "SECURITIES", needed_by_date: "2026-08-20" }, as: BorrowerRep, as_user_id: "${bor}", captures: { req: $.data.id } }
            - { call: "POST /api/borrow-requests/${req}/match", payload: { position_id: "${pos}" }, as: DeskTrader, captures: { loan: $.data.id } }
          trigger:
            - { call: "POST /api/loans/${loan}/counter", payload: { rate_bps: 41 }, as: BorrowerRep, as_user_id: "${bor}", captures: { err: $.data.error_id } }
            - { call: "POST /api/loans/${loan}/counter", payload: { rate_bps: 40 }, as: BorrowerRep, as_user_id: "${bor}", captures: { st: $.data.status, rate: $.data.rate_bps } }
          assert:
            - "${err} == ERR_RATE_ABOVE_MAX"
            - "${st} == COUNTERED and ${rate} == 40 (the max itself is allowed — boundary is inclusive)"

      - name: reinvestment_over_uninvested_cash_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_REINVEST_EXCEEDS_CASH]", "errors[ERR_INSUFFICIENT_UNINVESTED_CASH]", "errors[ERR_LOAN_NOT_CASH_COLLATERAL]"]
        distinguishing_aspect: "Three fiscal guards on the cash-collateral rail: invest above uninvested cash, release cash whose principal is currently invested (release passes the deficit check but fails the uninvested-cash check — order pinned in the pledge transition), and invest against a SECURITIES-collateral loan."
        test_recipe:
          setup: ["CASH loan L1 qty 1000 (required 1,020,000c) with cash pledges 1,020,000c + 200,000c and 1,100,000c invested (uninvested 120,000c); SECURITIES loan L2 qty 1000 BOOKED"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "CSH1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Csh", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Csh", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { l1: $.data.id } }
            - { call: "POST /api/loans/${l1}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${l1}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${l1}/pledges", payload: { pledge_type: "CASH", amount_cents: 200000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { plg: $.data.id } }
            - { call: "POST /api/loans/${l1}/reinvestments", payload: { instrument_type: "MMF", principal_cents: 1100000, stated_yield_bps: 360 }, as: DeskTrader }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { l2: $.data.id } }
            - { call: "POST /api/loans/${l2}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/loans/${l1}/reinvestments", payload: { instrument_type: "MMF", principal_cents: 120001, stated_yield_bps: 360 }, as: DeskTrader, captures: { err1: $.data.error_id } }
            - { call: "POST /api/pledges/${plg}/release", payload: {}, as: DeskTrader, captures: { err2: $.data.error_id } }
            - { call: "POST /api/loans/${l2}/reinvestments", payload: { instrument_type: "MMF", principal_cents: 1000, stated_yield_bps: 360 }, as: DeskTrader, captures: { err3: $.data.error_id } }
          assert:
            - "${err1} == ERR_REINVEST_EXCEEDS_CASH (120,001 > 120,000 uninvested)"
            - "${err2} == ERR_INSUFFICIENT_UNINVESTED_CASH (releasing 200,000c leaves posted 1,020,000 >= required — deficit check passes — but only 120,000c is uninvested)"
            - "${err3} == ERR_LOAN_NOT_CASH_COLLATERAL"

      - name: substitute_with_lower_value_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_COLLATERAL_SHORTFALL]", state_machines.CollateralPledge.ACTIVE_to_SUBSTITUTED]
        distinguishing_aspect: "A substitution whose replacement marked value is below the outgoing pledge's is rejected even with a correct OCC version."
        test_recipe:
          setup: ["CASH loan qty 1000 pledged 1,020,000c (single ACTIVE pledge)"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SUB1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Sub", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Sub", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { plg: $.data.id } }
            - { call: "GET /api/loans/${loan}", as: BorrowerRep, as_user_id: "${bor}", captures: { v: $.data.version } }
          trigger:
            - { call: "POST /api/loans/${loan}/pledges/${plg}/substitute", payload: { expected_loan_version: "${v}", pledge_type: "CASH", amount_cents: 1019999 }, as: BorrowerRep, as_user_id: "${bor}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_COLLATERAL_SHORTFALL"
            - "CollateralPledge.${plg}.status remains ACTIVE"

  # ============================================================ rbac
  - section: rbac
    instances:
      - name: borrower_rep_cannot_create_loan
        claim_type: role_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /api/loans lists DeskTrader only; a BorrowerRep is rejected 403 regardless of payload validity."
        test_recipe:
          setup: ["security, owner, borrower, position exist"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "RB1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Rb1", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Rb1", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 10000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
          trigger:
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 100, collateral_type: "CASH", rate_bps: 0 }, as: BorrowerRep, as_user_id: "${bor}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"

      - name: desk_trader_cannot_approve_own_or_any_override
        claim_type: role_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "approve is RiskOfficer-only; a DeskTrader (even a different user than the requester) gets 403 — the SoD wall is role-shaped first, user-shaped second."
        test_recipe:
          setup: ["borrower with a REQUESTED override by trader-1"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Rb2", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/borrowers/${bor}/limit-overrides", payload: { new_limit_cents: 200000000, effective_from: "2026-09-01", expires_at: "2026-10-01" }, as: DeskTrader, as_user_id: "trader-1", captures: { ov: $.data.id } }
          trigger:
            - { call: "POST /api/limit-overrides/${ov}/approve", payload: {}, as: DeskTrader, as_user_id: "trader-2", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
            - "LimitOverride.${ov}.status remains REQUESTED"

      - name: ops_settler_cannot_file_report
        claim_type: role_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "file is DeskAdmin-only; the OpsSettler who finalized the report cannot also file it — 403 at the role layer."
        test_recipe:
          setup: ["period closed; report FINALIZED by ops-1"]
          setup_api_calls:
            - { call: "POST /api/ops/month-end-close", payload: { period: "2026-08" }, as: OpsSettler }
            - { call: "POST /api/regulatory-reports", payload: { period: "2026-08", report_type: "COLLATERAL_SUMMARY" }, as: OpsSettler, captures: { rep: $.data.id } }
            - { call: "POST /api/regulatory-reports/${rep}/finalize", payload: {}, as: OpsSettler, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/regulatory-reports/${rep}/file", payload: {}, as: OpsSettler, as_user_id: "ops-2", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"

      - name: report_file_by_finalizing_user_rejected_sod
        claim_type: segregation_of_duties
        grounds: [state_machines.RegulatoryReport.FINALIZED_to_FILED, "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "User-level SoD on the reporting rail: the DeskAdmin role may file, but not when X-User-ID equals finalized_by_user_id."
        test_recipe:
          setup: ["period closed; report FINALIZED by ops-1"]
          setup_api_calls:
            - { call: "POST /api/ops/month-end-close", payload: { period: "2026-08" }, as: OpsSettler }
            - { call: "POST /api/regulatory-reports", payload: { period: "2026-08", report_type: "MONTHLY_LOAN_ACTIVITY" }, as: OpsSettler, captures: { rep: $.data.id } }
            - { call: "POST /api/regulatory-reports/${rep}/finalize", payload: {}, as: OpsSettler, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/regulatory-reports/${rep}/file", payload: {}, as: DeskAdmin, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SOD_VIOLATION (same person, different hat)"
            - "RegulatoryReport.${rep}.status remains FINALIZED"

      - name: borrower_scoped_reads_hide_other_borrowers
        claim_type: ownership_scoping
        grounds: [roles, "validations[priority=3]"]
        distinguishing_aspect: "BorrowerRep reads auto-scope to X-User-ID: an unfiltered list shows only own loans; explicitly filtering by another borrower's id is 403."
        test_recipe:
          setup: ["borrowers B1 and B2 each hold one BOOKED loan (B1 qty 1000, B2 qty 2000) on the same security"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "RB3", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Rb3", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Rb3a", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { b1: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Rb3b", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { b2: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${b1}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { l1: $.data.id } }
            - { call: "POST /api/loans/${l1}/accept", payload: {}, as: BorrowerRep, as_user_id: "${b1}" }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${b2}", security_id: "${sec}", position_id: "${pos}", quantity: 2000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { l2: $.data.id } }
            - { call: "POST /api/loans/${l2}/accept", payload: {}, as: BorrowerRep, as_user_id: "${b2}" }
          trigger:
            - { call: "GET /api/loans", as: BorrowerRep, as_user_id: "${b1}" }
            - { call: "GET /api/loans?borrower_id=${b2}", as: BorrowerRep, as_user_id: "${b1}", captures: { err: $.data.error_id } }
          assert:
            - "Unscoped GET /api/loans as ${b1} returns exactly 1 loan and its id == ${l1} (auto-scoped)"
            - "${err} == ERR_FORBIDDEN (explicit filter on another borrower's id)"

      - name: owner_cannot_create_position_for_another_owner
        claim_type: ownership_scoping
        grounds: [roles, "validations[priority=3]"]
        distinguishing_aspect: "Body-level scoping: OwnerRep A sending owner_id = B's id is rejected 403 at creation time."
        test_recipe:
          setup: ["owners A and B; security exists"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "RB4", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Rb4a", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { ownA: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Rb4b", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { ownB: $.data.id } }
          trigger:
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${ownB}", security_id: "${sec}", quantity_total: 1000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${ownA}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"

  # ============================================================ cross-cutting complexity layers
  - section: complexity_layers
    instances:
      - name: occ_amendment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[loan-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Amendment OCC: a second amendment carrying the pre-first-amendment version is rejected 412; the successful amendment bumped Loan.version from 2 to 3."
        test_recipe:
          setup: ["SECURITIES loan qty 1000 BOOKED (create v1, accept v2)"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "OC1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Oc1", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Oc1", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}", captures: { v: $.data.version } }
          trigger:
            - { call: "POST /api/loans/${loan}/amendments", payload: { expected_loan_version: "${v}", rate_bps: 30 }, as: DeskTrader, captures: { v2: $.data.version, r2: $.data.rate_bps } }
            - { call: "POST /api/loans/${loan}/amendments", payload: { expected_loan_version: "${v}", rate_bps: 32 }, as: DeskTrader, captures: { err: $.data.error_id } }
          assert:
            - "${r2} == 30 and ${v2} == 3 (first amendment succeeded and bumped the version)"
            - "${err} == ERR_STALE_VERSION (HTTP 412) — the replayed version ${v} == 2 is now stale"
            - "Loan.${loan}.rate_bps remains 30"

      - name: occ_substitute_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pledge-substitute-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Substitution OCC on the same parent: after one successful substitution bumps the loan version, a second substitution of the new pledge with the old version is rejected 412."
        test_recipe:
          setup: ["CASH loan qty 1000 BOOKED with one ACTIVE cash pledge of 1,020,000c"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "OC2", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Oc2", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Oc2", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { p1: $.data.id } }
            - { call: "GET /api/loans/${loan}", as: BorrowerRep, as_user_id: "${bor}", captures: { v: $.data.version } }
          trigger:
            - { call: "POST /api/loans/${loan}/pledges/${p1}/substitute", payload: { expected_loan_version: "${v}", pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { p2: $.data.id } }
            - { call: "POST /api/loans/${loan}/pledges/${p2}/substitute", payload: { expected_loan_version: "${v}", pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { err: $.data.error_id } }
          assert:
            - "CollateralPledge.${p1}.status == SUBSTITUTED and ${p2} is ACTIVE (first substitution succeeded)"
            - "${err} == ERR_STALE_VERSION (the second substitution reused version ${v}, already advanced by the first)"

      - name: mtm_rerun_same_day_never_double_accrues
        claim_type: ops_run_checkpoint
        grounds: [calculations.loan_fee_accrual, endpoints]
        distinguishing_aspect: "The accrual epoch is (loan, accrual_date): a second mark-to-market run on the same clock date posts zero new provisional entries and reports loans_accrued 0."
        test_recipe:
          setup: ["SECURITIES loan qty 50,000 @ 25bps BOOKED on 2026-08-01"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "EP1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Ep1", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Ep1", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 50000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler, captures: { accrued1: $.data.loans_accrued } }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler, captures: { accrued2: $.data.loans_accrued } }
            - { call: "GET /api/ledger-entries?loan_id=${loan}&entry_type=FEE_ACCRUAL_PROVISIONAL", as: OpsSettler }
          assert:
            - "${accrued1} == 1 and ${accrued2} == 0"
            - "Exactly 1 FEE_ACCRUAL_PROVISIONAL entry exists for the loan (amount 347), not 2"

      - name: settlement_cascade_releases_everything
        claim_type: cascading_side_effects
        grounds: [state_machines.Loan.BOOKED_to_SETTLED, state_machines.MarginCall.OPEN_to_CURED, state_machines.CollateralPledge.ACTIVE_to_RELEASED, state_machines.ReinvestmentTranche.INVESTED_to_UNWOUND]
        distinguishing_aspect: "One full return unwinds the whole stack: OPEN margin call auto-cures, the pledge releases, the invested tranche unwinds and posts its final income — all inside the return request."
        test_recipe:
          setup: ["CASH loan qty 1000 BOOKED @1000c, pledged 1,020,000c, tranche 500,000c @360bps marked 505,000c; price moved to 1100c; MTM issued an OPEN margin call (deficit 102,000c)"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "EP2", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Ep2", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Ep2", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { plg: $.data.id } }
            - { call: "POST /api/loans/${loan}/reinvestments", payload: { instrument_type: "REPO", principal_cents: 500000, stated_yield_bps: 360 }, as: DeskTrader, captures: { tr: $.data.id } }
            - { call: "POST /api/reinvestments/${tr}/mark", payload: { current_nav_cents: 505000 }, as: OpsSettler }
            - { call: "POST /api/securities/${sec}/price", payload: { price_cents: 1100 }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "GET /api/margin-calls?loan_id=${loan}", as: OpsSettler, captures: { mc: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/loans/${loan}/returns", payload: { quantity: 1000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { lst: $.data.status, outs: $.data.outstanding_quantity } }
            - { call: "GET /api/margin-calls/${mc}", as: OpsSettler, captures: { mcs: $.data.status } }
            - { call: "GET /api/pledges/${plg}", as: OpsSettler, captures: { ps: $.data.status } }
            - { call: "GET /api/reinvestments/${tr}", as: OpsSettler, captures: { ts: $.data.status, ti: $.data.realized_income_cents } }
          assert:
            - "${lst} == SETTLED and ${outs} == 0"
            - "${mcs} == CURED (settlement cures the open call)"
            - "${ps} == RELEASED"
            - "${ts} == UNWOUND and ${ti} == 5000 (505,000 - 500,000)"
            - "Loan.${loan}.margin_status == CURRENT"

      - name: margin_status_threshold_flip
        claim_type: rate_threshold_triggers
        grounds: [calculations.margin_deficit_and_call_issuance, entities.Loan.fields.margin_status]
        excluded_because:
          difficulty_instance: margin_deficit_zero_no_call_one_cent_call
          rationale: "The threshold flip (CURRENT vs CALL_OPEN at exact deficit 0 vs 1 cent) is asserted by the named §1.8 instance."

      - name: utilization_tier_gate
        claim_type: rate_threshold_triggers
        grounds: [calculations.borrower_utilization_bps]
        excluded_because:
          difficulty_instance: utilization_exactly_9000bps_blocked_8999_allowed
          rationale: "The >= 9000bps cumulative threshold is exercised at both adjacent values by the named §1.8 instance."

      - name: borrower_suspension_booking_gate
        claim_type: cross_entity_guard
        grounds: [state_machines.Borrower.ACTIVE_to_SUSPENDED, "errors[ERR_BORROWER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: loan_booking_requires_borrower_active
          rationale: "The suspension gate and its error are the assertion core of the named §1.8 instance."

      - name: override_window_overlap_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_OVERRIDE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: limit_override_window_half_open_exclusion
          rationale: "Overlap and half-open adjacency are both asserted by the named §1.8 instance."

  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: return_response_reflects_final_state_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.Loan.BOOKED_to_SETTLED]
        distinguishing_aspect: "Immediate model: the POST /returns response body itself carries status SETTLED and outstanding_quantity 0 — no re-read, no lag."
        test_recipe:
          setup: ["SECURITIES loan qty 500 BOOKED"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "IC1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Ic1", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Ic1", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 500, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/loans/${loan}/returns", payload: { quantity: 500 }, as: BorrowerRep, as_user_id: "${bor}", captures: { st: $.data.status, outs: $.data.outstanding_quantity, ver: $.data.version } }
          assert:
            - "${st} == SETTLED and ${outs} == 0 in the mutation response itself"
            - "${ver} == 3 (create 1, accept 2, return 3)"
