    roles: [QualityManager]
    code: 200
    input: []
    output: RecallNotice
    side_effects: ["four-hop cascade per RecallNotice DRAFT -> ISSUED", "increments RecallNotice.version by 1"]
  - method: POST
    path: "/lab/recalls/{recallId}/close"
    description: "Close an issued recall: pulls covered quarantined lots to RECALLED terminal; PRODUCT_ALL flips the product back to LISTED"
    roles: [QualityManager]
    code: 200
    input: []
    output: RecallNotice
    side_effects: ["lot pull per RecallNotice ISSUED -> CLOSED", "increments RecallNotice.version by 1"]

  # --- Kits ---
  - method: POST
    path: "/lab/kits"
