            - "${r1_status} == SETTLED because settle_immediately was true, while refunds 2 and 3 are PENDING"
            - "refund 2 (COOK, 300): ${r2_cook} == 300 (bucket 1 has 1418 of headroom), ${r2_comm} == 0 (bucket 2 already drained), ${r2_plat} == 0"
