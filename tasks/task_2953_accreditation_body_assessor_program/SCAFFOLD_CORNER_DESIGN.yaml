          captures: {nc_id: $.data.id}
        - call: POST /accreditation/applications/${app_id}/close-assessment
          payload: {}
          as: AssessmentManager
        - call: GET /accreditation/nonconformities/${nc_id}
          payload: {}
          as: ApplicantContact
          as_user_id: ${org_id}
          captures: {nc_v1: $.data.version}
        - call: POST /accreditation/nonconformities/${nc_id}/responses
          payload: {expected_nonconformity_version: '${nc_v1}', root_cause: method validation backlog, action_plan: revalidate the mass calibration method}
          as: ApplicantContact
          as_user_id: ${org_id}
        - call: POST /accreditation/nonconformities/${nc_id}/review
          payload: {outcome: REJECT, review_note: the plan covers one method of five}
          as: LeadAssessor
          as_user_id: ${lead_id}
        trigger:
        - call: POST /accreditation/nonconformities/${nc_id}/responses
          payload: {expected_nonconformity_version: '${nc_v1}', root_cause: method validation backlog, action_plan: revalidate the mass calibration method and retrain one technician}
          as: ApplicantContact
          as_user_id: ${org_id}
        - call: GET /accreditation/nonconformities/${nc_id}
          payload: {}
          as: ApplicantContact
          as_user_id: ${org_id}
          captures: {nc_v2: $.data.version}
        - call: POST /accreditation/nonconformities/${nc_id}/responses
          payload: {expected_nonconformity_version: '${nc_v2}', root_cause: method validation backlog, action_plan: revalidate all five calibration methods and retrain two technicians}
          as: ApplicantContact
          as_user_id: ${org_id}
        assert: ['the resubmission carrying ${nc_v1} returns HTTP 412 with data.error_id == "ERR_STALE_NONCONFORMITY_VERSION"', 'the state was not the obstacle: Nonconformity.${nc_id}.status was OPEN at that moment, a legal state for this write', 'Nonconformity.${nc_id}.action_plan still read "revalidate the mass calibration method" after the rejection', 'the re-read yields ${nc_v2} == ${nc_v1} + 2, one increment for the accepted submission and one for the REJECT review', 'the resubmission carrying ${nc_v2} returns HTTP 200 with status RESPONSE_SUBMITTED and the new action_plan text', 'response_round == 2 and the finding is on its second pass, so the cycle counter advanced exactly once per accepted submission']
    - name: assessor_capacity_threshold_at_the_exact_annual_limit_is_accepted
      claim_type: rate_threshold_triggers
      grounds: [complexity_profile.complexity_layers.rate_threshold_triggers, entities.Assessor.fields.annual_witness_capacity_days, entities.Assessor.fields.committed_witness_days, 'validations[priority=13].ERR_ASSESSOR_CAPACITY_EXCEEDED', calculations.witness_session_day_count]
      distinguishing_aspect: 'The annual witness capacity is a cumulative threshold measured in whole days: a single 32-hour

        session booking exactly 4 of a 4-day capacity must be accepted and drive available_witness_days to

        0, and only the next day - a further 1-day session - crosses the limit with

        ERR_ASSESSOR_CAPACITY_EXCEEDED (422). Booking at the limit is legal; booking past it is not.

        '
      test_recipe:
        setup: ['Clock 2026-08-10; one PUBLISHED scheme (witness_min_count 2); one GRANTED, QUALIFIED, SCREENED LEAD_ASSESSOR whose annual_witness_capacity_days is 4 and whose committed_witness_days is 0.', 'One INITIAL 3-line cycle with that lead CONFIRMED, planned MIXED (3 on-site, 2 remote) and APPROVED, so witness_days_planned is 2 and the cycle is PLANNED.']
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-10T00:00:00Z'}
          as: SchemeManager
        - call: POST /accreditation/schemes
          payload: {program_code: ISO17025-CAL, name: Calibration laboratories, standard_ref: ISO_IEC_17025, complexity_multiplier: 1.0725, witness_min_count: 2, qualification_points_required: 60.0}
          as: SchemeManager
          captures: {scheme_id: $.data.id}
        - call: POST /accreditation/schemes/${scheme_id}/status
          payload: {to_status: UNDER_REVIEW}
          as: SchemeManager
        - call: POST /accreditation/schemes/${scheme_id}/status
          payload: {to_status: PUBLISHED}
          as: SchemeManager
        - call: POST /accreditation/assessors
          payload: {full_name: Lena Ahlgren, email: lena.ahlgren@ab.test, employment_type: INTERNAL, annual_witness_capacity_days: 4}
          as: AssessmentManager
          captures: {lead_id: $.data.id}
        - call: POST /accreditation/assessors/${lead_id}/qualifications
          payload: {scheme_id: '${scheme_id}', role_type: LEAD_ASSESSOR, years_experience: 8, declared_witness_days: 5, declared_training_modules: 2, last_witness_on: '2026-05-10'}
          as: AssessmentManager
          captures: {lead_q_id: $.data.id}
        - call: POST /accreditation/qualifications/${lead_q_id}/verify-evidence
          payload: {verified_years_experience: 8, verified_witness_days: 5, verified_training_modules: 2}
          as: SchemeManager
        - call: POST /accreditation/assessors/${lead_id}/screen
          payload: {}
          as: SchemeManager
        - call: POST /accreditation/organizations
          payload: {legal_name: Northlight Testing AB, country_code: SE, contact_email: qa@northlight.test}
          as: AssessmentManager
          captures: {org_id: $.data.id}
        - call: POST /accreditation/applications
          payload:
            organization_id: ${org_id}
            scheme_id: ${scheme_id}
            cycle_type: INITIAL
            requested_scope_lines: *id001
            notice_days: 30
          as: AssessmentManager
          captures: {app_id: $.data.id}
        - call: POST /accreditation/applications/${app_id}/team-assignments
          payload: {assessor_id: '${lead_id}', role_type: LEAD_ASSESSOR}
          as: AssessmentManager
          captures: {ta_lead: $.data.id}
        - call: POST /accreditation/team-assignments/${ta_lead}/confirm
          payload: {}
          as: AssessmentManager
        - call: GET /accreditation/applications/${app_id}
          payload: {}
          as: AssessmentManager
          captures: {app_v1: $.data.version}
        - call: POST /accreditation/applications/${app_id}/assessment-plans
          payload: {expected_application_version: '${app_v1}', mode: MIXED, planned_start: '2026-09-07', planned_end: '2026-09-18', on_site_days: 3, remote_days: 2}
          as: AssessmentManager
          captures: {plan_id: $.data.id}
        - call: POST /accreditation/assessment-plans/${plan_id}/approve
          payload: {}
          as: AssessmentManager
        trigger:
        - call: POST /accreditation/assessment-plans/${plan_id}/witness-sessions
          payload: {assessor_id: '${lead_id}', activity_type: CALIBRATION, site_ref: NORTHLIGHT-LAB-1, delivery_mode: ON_SITE, starts_at: '2026-09-07T08:00:00Z', ends_at: '2026-09-08T16:00:00Z'}
          as: AssessmentManager
          captures: {ws1: $.data.id}
        - call: POST /accreditation/assessment-plans/${plan_id}/witness-sessions
          payload: {assessor_id: '${lead_id}', activity_type: CALIBRATION, site_ref: NORTHLIGHT-LAB-1, delivery_mode: ON_SITE, starts_at: '2026-09-14T08:00:00Z', ends_at: '2026-09-14T16:00:00Z'}
          as: AssessmentManager
        assert: ['the first booking returns HTTP 201 with WitnessSession.${ws1}.day_count == 4, computed as ceil(32 / 8)', 'Assessor.${lead_id}.committed_witness_days == 4 and available_witness_days == 0, so the booking at exactly the limit is accepted', the second booking of a single 8-hour day returns HTTP 422 with data.error_id == "ERR_ASSESSOR_CAPACITY_EXCEEDED", 'Assessor.${lead_id}.committed_witness_days is still 4 and GET /accreditation/witness-sessions?plan_id=${plan_id} returns total_count == 1', 'the threshold is cumulative rather than per-session: the rejected session is 1 day, well under the 4-day capacity on its own', 'the ledger releases on abort but not on completion, so a later ABORT of ${ws1} restores available_witness_days to 4']
    - name: effectiveness_verification_cascades_through_four_levels
      claim_type: cascading_side_effects
      grounds: [complexity_profile.complexity_layers.cascading_side_effects, state_machines.Nonconformity.RESPONSE_ACCEPTED_to_CLOSED, state_machines.AccreditationApplication.NC_OPEN_to_DECISION_PENDING]
      excluded_because: {difficulty_instance: transitive_cascade / effectiveness_pass_closes_finding_then_ledger_then_decision_then_risk, rationale: 'That §1.8 instance walks the full four-hop chain from the PASS verdict through the finding, the application''s finding ledger, the newly created DecisionRecord and the organization''s recomputed risk score, asserting every hop and the ordering between them, so the cascading-side-effects layer is covered there.'}
    - name: competence_points_differ_between_the_provisional_and_final_variants
      claim_type: dual_variant_calculation
      grounds: [complexity_profile.complexity_layers.dual_variant_calculation, calculations.assessor_competence_points.variants]
      excluded_because: {difficulty_instance: dual_variant_calc / competence_points_declared_provisional_vs_verified_final_diverge, rationale: 'That §1.8 instance runs the same assessor through both variants and pins the divergence - 92.00 under DECLARED_PROVISIONAL against 87.00 under VERIFIED_FINAL on the verified evidence - together with the grant verdict that follows the final variant, so the dual-variant layer is covered there.'}
  - section: consistency_model
    instances:
    - name: team_confirmation_cascade_is_visible_in_the_same_response
      claim_type: immediate
      grounds: [complexity_profile.consistency_model.immediate, 'endpoints.POST /accreditation/team-assignments/{assignment_id}/confirm', state_machines.AccreditationApplication.SUBMITTED_to_TEAM_ASSIGNED, state_machines.ApplicantOrganization.APPLIED_to_UNDER_ASSESSMENT]
      distinguishing_aspect: 'The declared consistency model is immediate, so the two-hop cascade fired by the first CONFIRMED

        lead assignment must be fully readable the moment the confirm call returns: no re-read delay, no

        lagging denormalized counter, and the cycle''s version increment already applied.

        '
      test_recipe:
        setup: ['Clock 2026-08-10; one PUBLISHED scheme (complexity_multiplier 1.0725, witness_min_count 2, qualification_points_required 60.0, unannounced_authority false); one GRANTED, QUALIFIED, SCREENED LEAD_ASSESSOR with a 20-day annual capacity; one applicant organization; one INITIAL 3-line cycle whose lead TeamAssignment is only PROPOSED, so the cycle is still SUBMITTED and the organization still APPLIED.', 'The cycle''s version is read as ${app_v1} immediately before the confirmation.']
        setup_api_calls:
        - call: POST /_clock/set_current_utc
