            - { call: "POST /tea-ops/certificates", payload: { supplier_id: "${sup}", cert_type: "ORGANIC", total_volume_kg: 1000.0, valid_from: "2026-01-01", valid_until: "2026-12-31" }, as: CertificationOfficer, as_user_id: "co-1", captures: { cert: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-01", weight_kg: 35.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { la: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${la}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${la}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${la}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-02", weight_kg: 15.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lb: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lb}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lb}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lb}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "R16", certification_target: "ORGANIC", pack_format: "LOOSE_PACK", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r16: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r16}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r16}", target_weight_kg: 50.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv2: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${la}", allocated_kg: 35.0, expected_batch_version: "${bv2}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "GET /tea-ops/batches/${b}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv3: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lb}", allocated_kg: 15.0, expected_batch_version: "${bv3}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/blend", payload: { measured_moisture_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/release", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { b_st: $.data.status } }
            - { call: "GET /tea-ops/certificates/${cert}", payload: {}, as: CertificationOfficer, as_user_id: "co-1", captures: { cons1: $.data.consumed_volume_kg } }
