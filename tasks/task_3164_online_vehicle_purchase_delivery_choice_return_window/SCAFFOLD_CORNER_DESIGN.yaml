scaffold_corner_design:
- section: endpoints
  instances:
  - name: response_envelope_success_and_error_shape
    claim_type: response_envelope
    grounds:
    - response_envelope
    distinguishing_aspect: Every response carries meta.api_request_id + api_request_timestamp; success has response_type object|array, error responses carry data.error_id and data.message.
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Env U
          email: env@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          env_cust: $.data.id
      trigger:
      - call: GET /vehicle-hub/customers/${env_cust}
        as: PlatformAdmin
      - call: GET /vehicle-hub/customers/00000000-0000-4000-8000-000000000000
        as: PlatformAdmin
        captures:
          env_err: $.data.error_id
      assert:
      - 'success response: meta.api_request_id present, response_type == ''object'', data.id == ${env_cust}'
      - 'error response: response_type == ''error'', data.error_id == ERR_NOT_FOUND (http 404), data.message present'
      - list responses include pagination fields limit, offset, total_count, has_more (GET /vehicle-hub/customers)
  - name: customer_registration_default_fulfillment_choice
    claim_type: creation_with_defaults
    grounds:
    - entities.Customer.fields.default_fulfillment_choice
    distinguishing_aspect: Omitting default_fulfillment_choice yields HOME_DELIVERY; computed id/created_at/version are server-minted and input values for them are ignored.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Dflt U
          email: dflt@x.com
          state_code: TX
        as: PlatformAdmin
        captures:
          dflt_cust: $.data.id
      assert:
      - Customer.${dflt_cust}.default_fulfillment_choice == HOME_DELIVERY
      - Customer.${dflt_cust}.version == 1 and created_at == current logical clock
      - Customer.${dflt_cust}.state_code == TX
  - name: customer_unsupported_state_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=21]
    - errors[ERR_UNSUPPORTED_STATE]
    distinguishing_aspect: state_code outside the supported tax table {GA, TX, CA, FL, NY} is rejected at customer creation.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Bad St
          email: badst@x.com
          state_code: ZZ
        as: PlatformAdmin
        captures:
          badst_err: $.data.error_id
      assert:
      - error_id == ERR_UNSUPPORTED_STATE (http 422)
  - name: trade_in_initial_offer_computed_from_questionnaire
    claim_type: computed_field_correctness
    grounds:
    - calculations.trade_in_initial_offer
    distinguishing_aspect: MID band base 2,000,000 with a clean questionnaire (no flags, GOOD tires, 45,000 odometer under the 60,000 soft cap) yields exactly 2,000,000.
    test_recipe:
      setup:
      - one customer exists
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: TI U
          email: ti@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          ti_cust: $.data.id
      trigger:
      - call: POST /vehicle-hub/trade-ins
        payload:
          vin: 1HGCV1F30LA000001
          questionnaire:
            vehicle_band: MID
            accident_history: false
            mechanical_issues: false
            tire_condition: GOOD
            odometer: 45000
            smoker_vehicle: false
        as: Customer
        as_user_id: ${ti_cust}
        captures:
          ti_offer: $.data.id
      assert:
      - TradeInOffer.${ti_offer}.initial_offer_cents == 2000000
      - TradeInOffer.${ti_offer}.status == OFFERED
      - TradeInOffer.${ti_offer}.expires_at == created_at + 7 days
  - name: trade_in_adjustment_severe_haircut_band
    claim_type: correct_result
    grounds:
    - calculations.trade_in_adjustment
    distinguishing_aspect: 3+ contradicted questionnaire items switch the adjustment from linear deduction to a 30% integer-floor haircut with the 50,000 floor.
    test_recipe:
      setup:
      - a customer with an OFFERED trade-in whose questionnaire declared ECONOMY band, no accident, no mechanical issues, GOOD tires, odometer 30,000 (initial offer 1,200,000)
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Adj U
          email: adj@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          adj_cust: $.data.id
      - call: POST /vehicle-hub/trade-ins
        payload:
          vin: 1HGCV1F30LA000002
          questionnaire:
            vehicle_band: ECONOMY
            accident_history: false
            mechanical_issues: false
            tire_condition: GOOD
            odometer: 30000
            smoker_vehicle: false
        as: Customer
        as_user_id: ${adj_cust}
        captures:
          adj_offer: $.data.id
      trigger:
      - call: POST /vehicle-hub/trade-ins/${adj_offer}/inspect
        payload:
          accident_history_found: true
          mechanical_issues_found: true
          smoker_detected: true
          tire_condition_observed: GOOD
        as: CustomerAdvocate
      assert:
      - TradeInOffer.${adj_offer}.status == INSPECTED
      - TradeInOffer.${adj_offer}.adjusted_offer_cents == 840000 (1,200,000 * 70 // 100)
      - mismatches == 3 selects the severe band, not 3 * 40,000 = 120,000 linear deduction
  - name: appointment_interior_overlap_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=12]
    - errors[ERR_APPOINTMENT_CONFLICT]
    distinguishing_aspect: An interior-overlapping home-delivery booking (10:30-11:30 against 10:00-11:00) in the same market is rejected, complementing the half-open adjacency difficulty instance.
    test_recipe:
      setup:
      - two STRUCTURED cash orders A and B in market ATL-A; A holds SCHEDULED home-delivery 10:00-11:00
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Ovl2 U
          email: ovl2@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          ov2_cust: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 2T3W1RFV5MW000301
          make: Toyota
          model: RAV4
          year: 2022
          mileage: 19000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          ov2_veh1: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 2T3W1RFV5MW000302
          make: Toyota
          model: RAV4
          year: 2022
          mileage: 19000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          ov2_veh2: $.data.id
      - call: POST /vehicle-hub/vehicles/${ov2_veh1}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${ov2_veh1}/list
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${ov2_veh2}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${ov2_veh2}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${ov2_veh1}
          fulfillment_choice: HOME_DELIVERY
        as: Customer
        as_user_id: ${ov2_cust}
        captures:
          ov2_ord1: $.data.id
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${ov2_veh2}
          fulfillment_choice: HOME_DELIVERY
        as: Customer
        as_user_id: ${ov2_cust}
        captures:
          ov2_ord2: $.data.id
      - call: POST /vehicle-hub/orders/${ov2_ord1}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${ov2_cust}
        captures:
          vehicles_v1: $.data.version
      - call: POST /vehicle-hub/orders/${ov2_ord2}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${ov2_cust}
      - call: POST /vehicle-hub/orders/${ov2_ord1}/structure
        payload: {}
        as: Customer
        as_user_id: ${ov2_cust}
      - call: POST /vehicle-hub/orders/${ov2_ord2}/structure
        payload: {}
        as: Customer
        as_user_id: ${ov2_cust}
      - call: POST /vehicle-hub/orders/${ov2_ord1}/appointments
        payload:
          expected_order_version: ${orders_v1}
          market_code: ATL-A
          address_region: ATL-CORE
          start_at: '2026-09-02T10:00:00Z'
          end_at: '2026-09-02T11:00:00Z'
        as: Customer
        as_user_id: ${ov2_cust}
        captures:
          orders_v1: $.data.version
      trigger:
      - call: POST /vehicle-hub/orders/${ov2_ord2}/appointments
        payload:
          expected_order_version: ${orders_v2}
          market_code: ATL-A
          address_region: ATL-CORE
          start_at: '2026-09-02T10:30:00Z'
          end_at: '2026-09-02T11:30:00Z'
        as: Customer
        as_user_id: ${ov2_cust}
        captures:
          ov2_err: $.data.error_id
          orders_v2: $.data.version
      assert:
      - error_id == ERR_APPOINTMENT_CONFLICT (http 409)
      - PurchaseOrder.${ov2_ord2}.status remains STRUCTURED and delivery_status NOT_SCHEDULED
  - name: vending_machine_site_scoped_overlap
