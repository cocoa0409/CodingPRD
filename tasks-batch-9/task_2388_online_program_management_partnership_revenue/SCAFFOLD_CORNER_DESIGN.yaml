              payload: { entry_type: "SPEND", channel: "PAID_SEARCH", amount_cents: 4000001, spend_date: "2026-08-01" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { e10: $.data.error_id }
          assert:
            - "response status == 422"
            - "${e10} == ERR_MARKETING_BUDGET_EXCEEDED"
            - "Partnership.${ps_id}.marketing_budget_remaining_cents == 4000000"

      - name: marketing_spend_exactly_at_the_remaining_budget_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 45 ERR_MARKETING_BUDGET_EXCEEDED]
        distinguishing_aspect: "The same rule uses <=, so a SPEND of exactly the remaining 4000000 cents succeeds and drives marketing_budget_remaining_cents to exactly 0 — the inclusive twin of the previous instance."
        test_recipe:
          setup:
            - "EXECUTED Partnership with marketing_budget_cents 4000000 and no spend posted yet, and a DRAFT Program under it."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
          trigger:
            - call: "POST /programs/${pg_id}/marketing-spend-entries"
