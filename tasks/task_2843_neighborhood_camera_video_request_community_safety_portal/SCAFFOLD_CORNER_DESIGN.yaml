              captures: { c_id: "$.data.id", c_status: "$.data.status", c_variant: "$.data.retention_variant", c_expiry: "$.data.retention_expires_at", c_dur: "$.data.duration_seconds" }
            - call: "GET /neighborhood-safety/consent-solicitations/${sol1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { s_status: "$.data.status", s_clips: "$.data.clip_count", s_at: "$.data.responded_at" }
            - call: "GET /neighborhood-safety/video-requests/${vr_id}"
              payload: {}
              as: Officer
              as_user_id: "${off_id}"
              captures: { v_shared: "$.data.shared_clip_count", v_pending: "$.data.pending_count", v_secs: "$.data.shared_count", v_ls: "$.data.lifecycle_state" }
            - call: "GET /neighborhood-safety/residents/${r1_id}"
              payload: {}
              as: Resident
              as_user_id: "${r1_id}"
              captures: { r_ret: "$.data.retained_footage_seconds", r_life: "$.data.lifetime_shared_footage_seconds", r_purged: "$.data.purged_footage_seconds" }
            - call: "GET /neighborhood-safety/shared-clips"
              payload: { video_request_id: "${vr_id}", limit: 10, offset: 0 }
              as: Officer
              as_user_id: "${off_id}"
              captures: { clip_total: "$.meta.total_count", clip_first: "$.data[0].id" }
          assert:
            - "the share returns 201 with ${c_status} == RETAINED, ${c_variant} == DEVICE_ANCHORED and ${c_dur} == 1800, i.e. the half-open interval [2026-08-08T01:00:00Z, 2026-08-08T01:30:00Z)"
            - "${c_expiry} == 2026-09-07T01:00:00Z — the device-anchored branch, 30 days after recorded_start_utc"
            - "${s_status} == SHARED, ${s_clips} == 1 and ${s_at} == 2026-08-12T00:00:00Z, all visible on the very next read"
            - "${v_shared} == 1, ${v_pending} == 2, ${v_secs} == 1 (shared_count) and ${v_ls} == SOLICITING"
            - "${r_ret} == 1800, ${r_life} == 1800 and ${r_purged} == 0"
            - "${clip_total} == 1 and ${clip_first} == ${c_id} — the clip is already listable under the request"
