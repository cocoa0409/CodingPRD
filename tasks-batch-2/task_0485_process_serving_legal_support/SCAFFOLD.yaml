    roles: [Admin, Dispatcher, Server]
    code: 200
    input: []
    output: SkipTrace[]
    side_effects: []

  - method: POST
    path: "/service-requests/{id}/assignments"
    description: "Offer the request to a Server (creates an OFFERED Assignment). OCC-guarded on the request version."
    roles: [Dispatcher]
    code: 201
    input: [server_id, expected_service_request_version]
    output: Assignment
    side_effects:
      - "Create OFFERED Assignment"
      - "Supersede any prior OFFERED assignment for this request (status->REASSIGNED, superseded=true)"
      - "increments ServiceRequest.version by 1"

  - method: GET
    path: "/service-requests/{id}/assignments"
    description: "List Assignments for a request (reverse-reachability for Assignment.service_request_id)"
    roles: [Admin, Dispatcher, Client, Server]
    code: 200
    input: []
    output: Assignment[]
    side_effects: []

  - method: POST
    path: "/service-requests/{id}/reassign"
    description: "Dispatcher pulls the active/offered assignment, returning the request to the offer pool"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["Active assignment->REASSIGNED; attempts superseded; status->SUBMITTED; assignment_id=null"]

  - method: POST
    path: "/service-requests/{id}/services"
    description: "Record effective service (PERSONAL/SUBSTITUTE/POSTING)"
    roles: [Server]
    code: 201
    input: [assignment_id, service_type, served_at_utc, "recipient_relation?"]
    output: Service
    side_effects: ["IN_PROGRESS->SERVED; set service_type; create Affidavit DRAFT; bubble Assignment->COMPLETED; update Server counters & reliability"]

  - method: GET
    path: "/service-requests/{id}/services"
    description: "List Services for a request (reverse-reachability for Service.service_request_id)"
    roles: [Admin, Dispatcher, Client, Server]
    code: 200
    input: []
    output: Service[]
    side_effects: []

  - method: GET
    path: "/assignments/{id}/services"
    description: "List Services effected under an assignment (reverse-reachability for Service.assignment_id)"
    roles: [Admin, Dispatcher, Client, Server]
    code: 200
    input: []
    output: Service[]
    side_effects: []

  - method: POST
    path: "/service-requests/{id}/non-est"
