      - name: anonymous_cannot_register_a_facility
        claim_type: role denial
        grounds: [roles.Anonymous, roles.Operator, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Anonymous may register operators and file complaints but not create facilities; POST /facilities as Anonymous returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["One operator exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "GET /facilities?operator_id=${op_id} returns zero rows"

      - name: operator_cannot_write_to_another_operators_facility
        claim_type: peer_roles
        grounds: ["validations[priority=10]", "errors[ERR_NOT_RESOURCE_OWNER]", roles.Operator]
        distinguishing_aspect: "Operator identity is entity_backed:Operator, so operator B acting on operator A's facility receives ERR_NOT_RESOURCE_OWNER (403), which is distinct from the role-level ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Two operators exist; only the first owns a facility."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Operator A", contact_email: "a@example.com" }
              as: Anonymous
              captures: { op_a_id: $.data.id }
            - call: "POST /operators"
              payload: { legal_name: "Operator B", contact_email: "b@example.com" }
              as: Anonymous
              captures: { op_b_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_a_id}", name: "A Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_a_id}"
              captures: { fac_a_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_a_id}/water-readings"
              payload: { sampled_at: "2026-05-01T00:00:00Z", source: "OPERATOR_LOG", free_chlorine_ppm: 2.0, combined_chloramine_ppm: 0.1, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_b_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_a_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_b_id}"
              captures: { err_id2: $.data.error_id }
          assert:
            - "Both calls return HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "GET /facilities/${fac_a_id}/water-readings returns zero rows and GET /permits?facility_id=${fac_a_id} returns zero rows"

      - name: unknown_role_header_returns_unauthenticated
        claim_type: role denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "An X-User-Role value outside the five declared roles, and an empty X-User-ID on a non-Anonymous role, both yield ERR_UNAUTHENTICATED (401) — never ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["One operator and one pool facility exist."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: Regulator
              as_user_id: "reg-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: Operator
              as_user_id: ""
              captures: { err_id2: $.data.error_id }
          assert:
            - "Both calls return HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "The response body carries the error envelope with response_type == error"

      - name: reopen_decision_by_the_ordering_inspector_rejected
        claim_type: Segregation of duties
        grounds: ["validations[priority=21]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.ClosureOrder.fields.ordered_by_user_id]
        distinguishing_aspect: "The four-eyes rule compares X-User-ID with ClosureOrder.ordered_by_user_id, so insp-1 cannot approve the reopen of the closure insp-1 ordered, while insp-2 can."
        test_recipe:
          setup: ["Inspector insp-1 ordered a CHEMICAL closure at 2026-05-01T00:00:00Z; the clock now reads 02:00 and an IN_RANGE reading sampled at 01:30 backs a pending reopen request."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /closure-orders"
              payload: { facility_id: "${fac_id}", closure_reason: "CHEMICAL", expected_facility_version: "${fac_v}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { co_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T02:00:00Z" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T01:30:00Z", source: "REOPEN_VERIFICATION", free_chlorine_ppm: 2.5, combined_chloramine_ppm: 0.1, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd_id: $.data.id }
            - call: "POST /closure-orders/${co_id}/reopen-request"
              payload: { verification_reading_id: "${rd_id}" }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /closure-orders/${co_id}/reopen-decision"
              payload: { decision: "APPROVE" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /closure-orders/${co_id}/reopen-decision"
              payload: { decision: "APPROVE" }
              as: Inspector
              as_user_id: "insp-2"
          assert:
            - "The insp-1 attempt returns 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "ClosureOrder.${co_id}.status is still REOPEN_REQUESTED after the refusal"
            - "The insp-2 approval succeeds: ClosureOrder.${co_id}.status == CLEARED with reopen_decided_by_user_id == insp-2"
            - "Facility.${fac_id}.operating_posture == CLOSED and posture_reason == PERMIT_MISSING once the closure clears"

      - name: permit_issue_by_the_plan_review_decider_rejected
        claim_type: Segregation of duties
        grounds: ["validations[priority=21]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.PlanReview.fields.decided_by_user_id]
        distinguishing_aspect: "The second four-eyes rule compares the issuing X-User-ID with PlanReview.decided_by_user_id, so the user id pr-1 that approved the plan cannot also issue the permit that relies on it, even when acting as HealthAuthorityAdmin."
        test_recipe:
