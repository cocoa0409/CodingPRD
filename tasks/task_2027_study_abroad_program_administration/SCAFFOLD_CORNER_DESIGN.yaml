  # ===========================================================================
  # Endpoints (Table 5 claims)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape
        claim_type: computed_read
        grounds:
          - response_envelope
        distinguishing_aspect: "Every response carries the fixed envelope: meta.api_request_id + meta.api_request_timestamp, response_type 'object' for single-entity reads and 'array' for list reads, with limit/offset/total_count/has_more on list responses."
        test_recipe:
          setup: ["one DRAFT program exists"]
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /api/v1/programs/${prog_id}"
              as: ProgramCoordinator
            - call: "GET /api/v1/programs"
              payload: { limit: 5, offset: 0 }
              as: ProgramCoordinator
          assert:
            - "single read: body has meta.api_request_id and meta.api_request_timestamp, response_type == 'object', data.id == ${prog_id}"
            - "list read: response_type == 'array' and pagination fields limit == 5, offset == 0, total_count == 1, has_more == false present"

