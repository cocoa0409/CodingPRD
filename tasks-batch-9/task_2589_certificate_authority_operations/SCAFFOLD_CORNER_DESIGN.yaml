            - "the edge mass-revoke returns HTTP 422 and ${err_no_scope} == ERR_NO_CERTIFICATES_IN_SCOPE"
            - "MisissuanceIncident.${inc_edge}.state is still DISCLOSED with revoked_certificate_count == 0 and penalty_total_cents == 0"
            - "the second mass-revoke returns HTTP 200, ${hit_state} == REMEDIATED, ${hit_revoked} == 1 and ${hit_remaining} == 0"
            - "${hit_penalty} == 2000 (residual_fraction 1.0 at clock == not_before, times BASE_PENALTY_CENTS 1000 and DOMAIN_MISISSUANCE weight 2.0)"
            - "Certificate.${cert_id}.revocation_status == REVOKED with revoked_at == 2026-08-01T00:30:00Z"
            - "GET /ca/revocation-requests?incident_id=${inc_hit} returns total_count == 1 with origin == MASS_REVOCATION and state == EXECUTED"
            - "Subscriber.${sub_id}.account_status == ACTIVE (the category is not KEY_COMPROMISE) and revocation_pending_count == 0"

      - name: charge_expedite_fee_is_computed_after_the_volume_discount
        claim_type: correct_result
        excluded_because:
          difficulty_instance: issuance_charge_pinned_six_step_evaluation_order
          rationale: "The §1.8 combinatorial_formula instance already pins all six steps of issuance_charge_settlement on one request (unit rounding, subtotal, pre-discount band lookup, discount, expedite fee on the discounted subtotal, total 56729) and enumerates the wrong-order totals it must not equal."
      - name: remediation_penalty_rounds_each_certificate_before_summing
        claim_type: precision
        excluded_because:
          difficulty_instance: remediation_penalty_round_per_certificate_then_sum
          rationale: "The §1.8 combinatorial_formula instance already revokes a two-certificate batch with different residual fractions and asserts penalty_total_cents 2250, distinguishing per-certificate rounding from summing the unrounded terms."
      - name: validity_window_variants_diverge_between_clearance_and_issuance
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: validity_window_projected_at_clearance_vs_final_at_issuance
          rationale: "The §1.8 dual_variant_calc instance already computes both variants on one request and asserts the projection (profile cap only) against the final window (additionally floored by the authorization expiry and the attestation cap), including validity_days_final."
      - name: risk_score_variant_selection_depends_on_the_triggering_context
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: subscriber_risk_operational_vs_audit_final_variant
          rationale: "The §1.8 dual_variant_calc instance already shows the OPERATIONAL variant written on incident state changes and the AUDIT_FINAL variant written only by opine, on identical incident data, with both numbers asserted."
      - name: ceremony_windows_conflict_when_they_fall_inside_the_buffer
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: ceremony_windows_are_closed_intervals_with_a_sixty_minute_buffer
          rationale: "The §1.8 resource_temporal_overlap instance already walks the closed-interval geometry of ceremony_window_occupation at the buffer edge, accepting a window exactly 61 minutes clear and rejecting one exactly 60 minutes clear."
      - name: crl_series_requires_thirty_minutes_of_overlap_and_must_advance
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: crl_series_windows_are_half_open_and_must_overlap
          rationale: "The §1.8 resource_temporal_overlap instance already drives crl_window_coverage through ERR_CRL_COVERAGE_GAP, ERR_CRL_WINDOW_NOT_ADVANCING and the accepted overlap case on one profile's CRL series."
      - name: crl_publication_aggregates_every_unpublished_revocation
        claim_type: aggregation
        excluded_because:
          difficulty_instance: crl_entry_ledger_conservation_across_publications
          rationale: "The §1.8 compensating_invariant instance already publishes two CRLs over a growing revocation set and asserts entry_count, revoked_serials ordering, last_crl_number and the conserved identity total_crl_entries_published + pending_crl_entry_count == revoked_certificate_count."
      - name: disclosure_breach_sweep_uses_a_strict_comparison
        claim_type: threshold
        excluded_because:
          difficulty_instance: disclosure_exactly_at_deadline_is_still_on_time
          rationale: "The §1.8 boundary_precision_check instance already moves the clock to exactly disclosure_due_at and then one second past it, asserting that sweep 3 leaves disclosure_breached false at equality and flips it only strictly after."
      - name: sct_threshold_is_satisfied_at_exact_equality
        claim_type: threshold
        excluded_because:
          difficulty_instance: sct_count_exactly_equal_to_required_threshold_permits_activation
          rationale: "The §1.8 boundary_precision_check instance already tests activation at sct_count == required_sct_count - 1 (ERR_INSUFFICIENT_SCTS) and at exact equality (success), which is the threshold boundary for sct_sufficiency."

  - section: validations
    instances:
      - name: dcv_method_outside_the_profile_allow_list_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=72]
          - errors[ERR_DCV_METHOD_NOT_ALLOWED]
          - entities.CertificateProfile.fields.allowed_dcv_methods
          - endpoints[POST /ca/domain-authorizations]
        distinguishing_aspect: "The method is checked against the profile's allowed_dcv_methods rather than against the global enum: HTTP_TOKEN is a valid enum value and still returns HTTP 422 ERR_DCV_METHOD_NOT_ALLOWED (not ERR_INVALID_ENUM_VALUE) on a profile that allows DNS_TXT only, and no authorization row is created."
        test_recipe:
          setup:
            - "One ACTIVE DV profile whose allowed_dcv_methods is [DNS_TXT] and one ACTIVE subscriber."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/certificate-profiles"
              payload: { name: "corner-dv-method", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 0, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { profile_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${profile_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Corner Method Ltd", jurisdiction_code: "US-DE", registry_id: "REG-2023", contact_email: "ops@method.example", callback_phone: "+1-202-555-0123", credit_limit_cents: 500000 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /ca/domain-authorizations"
              payload: { subscriber_id: "${sub_id}", profile_id: "${profile_id}", domain_name: "www.method.example", method: "HTTP_TOKEN" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { err_method: $.data.error_id }
          assert:
            - "the call returns HTTP 422 and ${err_method} == ERR_DCV_METHOD_NOT_ALLOWED"
            - "${err_method} != ERR_INVALID_ENUM_VALUE (HTTP_TOKEN is a declared enum member)"
            - "GET /ca/domain-authorizations?subscriber_id=${sub_id} returns total_count == 0"

      - name: an_allowed_dcv_method_is_accepted_and_opens_a_thirty_day_reuse_window
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=72]
          - entities.DomainAuthorization.fields.expires_at
          - entities.CertificateProfile.fields.dcv_reuse_days
          - state_machines.DomainAuthorization.transitions.PENDING_to_VALIDATED
        distinguishing_aspect: "TLS_ALPN passes because it is listed in allowed_dcv_methods; expires_at stays null while the authorization is PENDING and is only stamped at validation as validated_at + dcv_reuse_days (2026-08-31T00:00:00Z for 30 days from 2026-08-01T00:00:00Z), not at creation time."
        test_recipe:
          setup:
            - "One ACTIVE DV profile whose allowed_dcv_methods is [DNS_TXT, TLS_ALPN] with dcv_reuse_days 30, and one ACTIVE subscriber."
