            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_k", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_k
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_k", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_k
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_k
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:59:59Z" }
              as: PlatformAdmin
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "INCREMENTAL" }
              as: Consumer
              as_user_id: cons_k
              captures: { err_soon: $.data.error_id }
