              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-F", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 800 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-F1", product_category: "FLOWER", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg_pass_id: $.data.id }
            - call: "POST /compliance/packages"
