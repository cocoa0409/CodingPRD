          - endpoints.POST_/platform/fairness-reviews/{id}/decide
        distinguishing_aspect: "A VARIABLE_EXCLUSION review is created with outcome PENDING and transitions to FAILED on decide; the row persists the details text verbatim and model_version_id linkage is navigable via the filtered list."
        test_recipe:
          setup:
            - "Logical clock at default. One DRAFT model."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-N-1", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "fr", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "VARIABLE_EXCLUSION", details: "exclude zip-derived variable" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_id}/decide"
              payload: { outcome: "FAILED" }
