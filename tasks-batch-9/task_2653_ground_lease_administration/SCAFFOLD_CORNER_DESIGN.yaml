            - "trigger[1] returns ERR_UNAUTHORIZED (403) - the tenant cannot open its own revaluation even though it may lodge the LESSEE-side appraisal inside one"
            - "trigger[2] and trigger[3] both return ERR_UNAUTHORIZED (403) - the sweep is LessorAdmin-exclusive and opening a reversion assessment is AssetManager-exclusive"
            - "trigger[4] returns ERR_UNAUTHORIZED (403) - the asset manager decides alteration requests but cannot file one on the tenant's behalf"
            - "trigger[5] returns ERR_UNAUTHORIZED (403) - the new-lease election belongs to the MortgageeAgent, not to the lessor who recorded the mortgage"
            - "trigger[6] returns ERR_UNAUTHORIZED (403) - the Arbitrator's read scope stops at the lease, the revaluation, its appraisals and the proceeding"
            - "trigger[7] returns ERR_UNAUTHORIZED (403) - the MortgageeAgent may read a lease and its mortgages but not the lessee register"
            - "trigger[8] returns ERR_UNAUTHORIZED (403) and NOT ERR_INVALID_REQUEST (400): authorization at priority 2 is decided before the negative amount_cents is ever examined at priority 3"
            - "after all nine refusals GET /portfolio/leases/${lease_id} still shows version 1 and arrears_balance_cents 0 - recording a mortgage writes no lease field, and not one refused call mutated anything"

      - name: each_role_performs_its_own_exclusive_and_shared_operations
        claim_type: exclusive_operations
        grounds:
          - roles.LessorAdmin
          - roles.AssetManager
          - roles.LeaseAccountant
          - roles.GroundTenant
          - endpoints.POST_/portfolio/leases/{id}/insurance-endorsements
          - endpoints.POST_/portfolio/alteration-requests/{id}/decision
        distinguishing_aspect: |
          The positive half of the fence. Every role exercises one of its own exclusive operations on the
          same lease, and the shared operation - filing an insurance endorsement, which both the lessor
          desk and the tenant may do - succeeds for BOTH principals in sequence, with the later
          endorsement superseding the earlier one on the lease's computed insurance fields. A scaffold
          that implemented the role table as a single global allow-list would pass the refusal instance
          above and fail here.
        test_recipe:
          setup:
            - "A single lease, then one operation per role in role order."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
