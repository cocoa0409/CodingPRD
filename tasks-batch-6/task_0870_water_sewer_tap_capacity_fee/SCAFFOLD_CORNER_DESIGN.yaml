            - "data.error_id == ERR_STALE_VERSION"

      - name: create_project_unknown_application_fk_rejected
        claim_type: fk_integrity
        grounds: [entities.MainExtensionProject.fields.application_id, "validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /main-extension-projects with a non-existent application_id returns 404 ERR_NOT_FOUND."
