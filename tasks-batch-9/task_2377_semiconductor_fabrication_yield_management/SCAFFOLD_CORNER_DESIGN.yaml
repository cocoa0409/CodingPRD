          - calculations.die_yield_and_speed_grade_allocation
        distinguishing_aspect: "The Excursion raised by a sort loss carries BOTH foreign keys — die_sort_run_id and lot_id — plus the failure_signature copied from the wafer map, so it is reachable from either side: 3 wafers of 100 tested / 80 good give sort_yield 0.8000 and yield_loss_ratio 0.1304 above the 0.1 sort threshold, and the excursion filters by die_sort_run_id."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with one step seq 10 LITHO 2.0h; CH_L1 QUALIFIED; operator OP-001 GOWNED and LITHO-certified."
            - "PLAN-A COMMITTED; LOT-001 (3 wafers) RELEASED, tracked in and tracked out, so its flow_state is AT_SORT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
