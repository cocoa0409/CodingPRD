              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28.0, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0 }
              as: ProcessEngineer
              captures: { first_prod: $.data.id }
          trigger:
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.25, source: "COMEX" }
              as: ProcurementBuyer
              captures: { e_quote: $.data.error_id }
            - call: "POST /metal-price-quotes"
              payload: { metal: "ALUMINUM", effective_date: "2026-07-30", settlement_price_usd_per_lb: 1.20, source: "LME" }
              as: ProcurementBuyer
              captures: { al_quote: $.data.id }
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "8", conductor_metal: "ALUMINUM", conductor_construction: "STRANDED_7", application_rating: "XHHW_2", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 45.0, conductor_lbs_per_kft: 30.0, insulation_compound_id: "${ins_id}", listing_certification_id: "${cert_id}", base_target_kft: 50.0 }
              as: ProcessEngineer
              captures: { e_prod: $.data.error_id }
            - call: "POST /catalog-products"
              payload: { product_code: "XHHW-8-AL", awg_size: "8", conductor_metal: "ALUMINUM", conductor_construction: "STRANDED_7", application_rating: "XHHW_2", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 45.0, conductor_lbs_per_kft: 30.0, insulation_compound_id: "${ins_id}", listing_certification_id: "${cert_id}", base_target_kft: 50.0 }
              as: ProcessEngineer
              captures: { second_prod: $.data.id }
            - call: "GET /metal-price-quotes"
              payload: { metal: "COPPER" }
              as: ProcurementBuyer
              captures: { cu_price: "$.data[0].settlement_price_usd_per_lb" }
            - call: "GET /catalog-products"
              payload: {}
              as: ProcessEngineer
          assert:
            - "${e_quote} == \"ERR_DUPLICATE_METAL_QUOTE\" with HTTP 409 - the (COPPER, 2026-07-30) pair is taken"
            - "the refused quote did NOT overwrite the incumbent: total_count == 1 for COPPER and ${cu_price} == 4.10, not 4.25 - quotes are immutable, so a conflicting post is a conflict, not an update"
            - "${al_quote} is a new id: (ALUMINUM, 2026-07-30) is a different composite key, so the same date is free for the other metal"
            - "${e_prod} == \"ERR_DUPLICATE_PRODUCT_CODE\" with HTTP 409 even though every other field differs from ${first_prod} - the key is product_code alone"
            - "the two conflicts return different error_ids at the same priority 33 and the same HTTP status; an implementation that emits one shared id for both keys fails here"
            - "${second_prod} is created once the code is unique, and GET /catalog-products reports total_count == 2 - exactly one SKU was added by the four attempts"

      - name: reinstatement_is_refused_while_a_lapsed_corrective_action_stands
        claim_type: error_triggerable
        grounds:
          - validations[priority=46]
          - errors[ERR_OPEN_VARIATION_UNRESOLVED]
          - errors[ERR_INVALID_CERTIFICATION_STATE]
          - state_machines.ListingCertification.transitions.VARIATION_NOTICE_to_ACTIVE
          - state_machines.FactoryInspection.transitions.OPEN_to_CLOSED
        distinguishing_aspect: "The reinstate guard compares the OPEN variation's corrective_action_due_date against the LOGICAL clock, not against the inspection date, so the same file and the same inspection row flip from refused to accepted purely by moving the clock back inside the 30-day corrective window - and reinstating an already ACTIVE file is a different error entirely."
        test_recipe:
          setup:
            - "UL file E12345 listed 2026-01-01 with inspection_interval_days 90; a PASS visit on 2026-04-01 makes it ACTIVE; a VARIATION visit on 2026-06-01 (61 days later, so the 60-day cadence gap is satisfied) opens a variation with corrective_action_due_date 2026-07-01 and moves the file to VARIATION_NOTICE."
            - "The logical clock stands at 2026-08-01, one month past the corrective deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-01-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-04-01", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-01", inspector_code: "INS-9", findings_count: 3, outcome: "VARIATION" }
              as: CertificationOfficer
              captures: { var_id: $.data.id, var_due: $.data.corrective_action_due_date, var_status: $.data.status }
            - call: "GET /listing-certifications/${cert_id}"
              payload: {}
              as: CertificationOfficer
              captures: { cert_v1: $.data.version }
          trigger:
            - call: "POST /listing-certifications/${cert_id}/reinstate"
              payload: {}
              as: CertificationOfficer
              captures: { e_lapsed: $.data.error_id }
            - call: "GET /listing-certifications/${cert_id}"
              payload: {}
              as: ProcessEngineer
              captures: { st_after_refusal: $.data.status, count_after_refusal: $.data.open_variation_count, v_after_refusal: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /listing-certifications/${cert_id}/reinstate"
              payload: {}
              as: CertificationOfficer
              captures: { st_reinstated: $.data.status, count_reinstated: $.data.open_variation_count }
            - call: "GET /listing-certifications/${cert_id}/inspections"
              payload: {}
              as: CertificationOfficer
              captures: { insp_first_status: "$.data[0].status", insp_second_status: "$.data[1].status" }
            - call: "POST /listing-certifications/${cert_id}/reinstate"
              payload: {}
              as: CertificationOfficer
              captures: { e_already: $.data.error_id }
          assert:
            - "setup facts: ${var_due} == \"2026-07-01\" (inspection_date + CAP_DAYS 30) and ${var_status} == \"OPEN\" - a VARIATION row is born OPEN while a PASS row is born CLOSED"
            - "${e_lapsed} == \"ERR_OPEN_VARIATION_UNRESOLVED\" with HTTP 409: 2026-07-01 is earlier than the logical date 2026-08-01"
            - "the refusal is inert: ${st_after_refusal} == \"VARIATION_NOTICE\", ${count_after_refusal} == 1 and ${v_after_refusal} == ${cert_v1} - no version was burned"
            - "after the clock moves back to 2026-06-15 the identical call succeeds: ${st_reinstated} == \"ACTIVE\" and ${count_reinstated} == 0 - nothing about the inspection row changed, only the clock"
            - "the reinstatement closed the open variation: ${insp_first_status} == \"CLOSED\" (the PASS visit, inspection_date ASC first) and ${insp_second_status} == \"CLOSED\" (the 2026-06-01 variation), total_count == 2"
            - "${e_already} == \"ERR_INVALID_CERTIFICATION_STATE\" with HTTP 409, not ERR_OPEN_VARIATION_UNRESOLVED: with the file already ACTIVE the state check at priority 40 answers before the variation check at 46"

      - name: every_error_class_shares_one_envelope_and_writes_nothing
        claim_type: error_envelope
        grounds:
          - response_envelope.error
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_DUPLICATE_METAL_QUOTE]
        distinguishing_aspect: "Five different failure classes - 401, 403, 400, 404, 409 - must all come back in the SAME envelope: response_type \"error\", a data object carrying exactly error_id and a non-empty message, and the usual meta block. None of them may leak a partially built entity, and none of them may leave a trace in the store."
        test_recipe:
          setup:
            - "One COPPER quote effective 2026-07-30 at 4.10 and one customer ACME."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /customers"
              payload: { account_code: "ACME", name: "Acme Electric Supply", market_region: "NORTHEAST", credit_limit_usd: 100000.00, pass_through_enabled: true, reel_program: "RETURNABLE" }
              as: BillingAnalyst
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: NONE
              captures: { e_401: $.data.error_id, m_401: $.data.message }
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-31", settlement_price_usd_per_lb: 4.20, source: "COMEX" }
              as: BillingAnalyst
              captures: { e_403: $.data.error_id, m_403: $.data.message }
            - call: "GET /metal-price-quotes"
              payload: { metal: "COPPER", limit: 500 }
              as: BillingAnalyst
              captures: { e_400: $.data.error_id, m_400: $.data.message }
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingAnalyst
              captures: { e_404: $.data.error_id, m_404: $.data.message }
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.30, source: "COMEX" }
              as: ProcurementBuyer
              captures: { e_409: $.data.error_id, m_409: $.data.message }
            - call: "GET /metal-price-quotes"
              payload: {}
              as: ProcurementBuyer
              captures: { survivor_price: "$.data[0].settlement_price_usd_per_lb" }
          assert:
            - "${e_401} == \"ERR_UNAUTHENTICATED\" with HTTP 401 (both auth headers omitted)"
            - "${e_403} == \"ERR_UNAUTHORIZED\" with HTTP 403 (BillingAnalyst is not listed on POST /metal-price-quotes)"
            - "${e_400} == \"ERR_INVALID_REQUEST\" with HTTP 400 (limit 500 exceeds the declared maximum of 100)"
            - "${e_404} == \"ERR_CUSTOMER_NOT_FOUND\" with HTTP 404 for the bogus path id"
            - "${e_409} == \"ERR_DUPLICATE_METAL_QUOTE\" with HTTP 409"
            - "all five responses carry response_type == \"error\", a meta.api_request_id and meta.api_request_timestamp, and a data object whose only keys are error_id and message"
            - "${m_401}, ${m_403}, ${m_400}, ${m_404} and ${m_409} are all non-empty strings, and none of them is an entity payload - no id, no version, no partially built row"
            - "the store is untouched by all five: GET /metal-price-quotes returns total_count == 1 with ${survivor_price} == 4.10 - neither the 403 attempt at 4.20 nor the 409 attempt at 4.30 was persisted"

  # ===========================================================================
  # Section 7 - RBAC (1.7)
  # ===========================================================================
  - section: rbac
    instances:

      - name: peer_roles_cannot_reach_each_others_exclusive_operations
        claim_type: role_denial
        grounds:
          - roles
          - validations[priority=20]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The seven staff roles are peers, not a hierarchy, so each one's exclusive operations are closed to all the others - and because the role check sits at priority 20, ahead of existence at 30, every one of these attempts returns 403 while pointing at a resource id that does not even exist. Only PlantAdmin holds the clock."
        test_recipe:
          setup:
            - "An empty store apart from the logical clock; the id 00000000-0000-4000-8000-000000000000 matches no row of any type."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: BillingAnalyst
              captures: { e_quote: $.data.error_id }
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcurementBuyer
              captures: { e_compound: $.data.error_id }
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: ProcessEngineer
              captures: { e_cert: $.data.error_id }
            - call: "POST /catalog-products/00000000-0000-4000-8000-000000000000/release"
              payload: {}
              as: QualityEngineer
              captures: { e_release_sku: $.data.error_id }
            - call: "POST /production-lots/00000000-0000-4000-8000-000000000000/tests"
              payload: { test_type: "SPARK", duration_sec: 60, faults_detected: 0 }
              as: ProcessEngineer
              captures: { e_test: $.data.error_id }
            - call: "POST /production-lots/00000000-0000-4000-8000-000000000000/process-steps"
              payload: { step: "DRAWING" }
              as: QualityEngineer
              captures: { e_step: $.data.error_id }
            - call: "POST /reels"
              payload: { reel_serial: "R-001", reel_type: "WOOD_RETURNABLE", deposit_usd: 450.00, capacity_ft: 6000 }
              as: CertificationOfficer
              captures: { e_reel: $.data.error_id }
            - call: "POST /reels/00000000-0000-4000-8000-000000000000/load"
              payload: { lot_id: "00000000-0000-4000-8000-000000000000", load_length_ft: 5000, occupancy_start_at: "2026-08-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { e_load: $.data.error_id }
            - call: "POST /shipments/00000000-0000-4000-8000-000000000000/invoice"
              payload: {}
              as: ShippingClerk
              captures: { e_invoice: $.data.error_id }
            - call: "PATCH /customers/00000000-0000-4000-8000-000000000000"
              payload: { credit_limit_usd: 1.00 }
              as: ShippingClerk
              captures: { e_patch: $.data.error_id }
            - call: "POST /customer-orders/00000000-0000-4000-8000-000000000000/cancel"
              payload: { reason: "not my job" }
              as: ProcessEngineer
              captures: { e_cancel: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProcessEngineer
              captures: { e_clock: $.data.error_id }
            - call: "GET /catalog-products"
              payload: {}
              as: ShippingClerk
          assert:
            - "every one of ${e_quote}, ${e_compound}, ${e_cert}, ${e_release_sku}, ${e_test}, ${e_step}, ${e_reel}, ${e_load}, ${e_invoice}, ${e_patch}, ${e_cancel} and ${e_clock} == \"ERR_UNAUTHORIZED\" with HTTP 403"
            - "the eight attempts that name 00000000-0000-4000-8000-000000000000 still return 403, never 404: priority 20 is evaluated before priority 30, so an unauthorised caller learns nothing about what exists"
            - "the clock did not move: it is still 2026-08-01T00:00:00Z, because POST /_clock/set_current_utc is PlantAdmin's only exclusive operation"
            - "shared reads still work for the same peers that were just refused writes: GET /catalog-products as ShippingClerk returns HTTP 200 with response_type \"array\", 0 rows and total_count 0"

      - name: segregation_of_duties_blocks_every_tester_of_the_lot_from_releasing_it
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=57]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles[QualityEngineer]
          - complexity_profile.role_model
        distinguishing_aspect: "The rule is keyed on X-User-ID against EVERY CableTest operator on the lot, not just the last one: with SPARK run by qe-001 and HIPOT by qe-002 both of them are barred, a third engineer can release, and holding the PlantAdmin role does not buy an exemption when the acting user id is one of the testers."
        test_recipe:
          setup:
            - "Lot LOT-A of THHN-12-CU extruded within tolerance and marked correctly; SPARK recorded by qe-001 and HIPOT by qe-002, so the lot is TESTED / PENDING with two distinct operator_user_ids."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28.0, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", lot_code: "LOT-A", planned_length_ft: 5000, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_id: $.data.id }
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 25.5, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/tests"
              payload: { test_type: "SPARK", duration_sec: 60, faults_detected: 0 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_id}/tests"
              payload: { test_type: "HIPOT", duration_sec: 300, test_voltage_kv: 2.5, breakdown_detected: false }
              as: QualityEngineer
              as_user_id: "qe-002"
          trigger:
            - call: "POST /production-lots/${lot_id}/release"
              payload: { packaged_length_ft: 5000 }
              as: QualityEngineer
              as_user_id: "qe-001"
              captures: { e_first_tester: $.data.error_id }
            - call: "POST /production-lots/${lot_id}/release"
              payload: { packaged_length_ft: 5000 }
              as: QualityEngineer
              as_user_id: "qe-002"
              captures: { e_second_tester: $.data.error_id }
            - call: "POST /production-lots/${lot_id}/release"
              payload: { packaged_length_ft: 5000 }
              as: PlantAdmin
              as_user_id: "qe-001"
              captures: { e_admin_as_tester: $.data.error_id }
            - call: "POST /production-lots/${lot_id}/release"
              payload: { packaged_length_ft: 5000 }
              as: QualityEngineer
              as_user_id: "qe-003"
              captures: { released_quality: $.data.quality_state, released_length: $.data.packaged_length_ft }
          assert:
            - "${e_first_tester} == \"ERR_SEGREGATION_OF_DUTIES\" with HTTP 403 - qe-001 ran the SPARK test"
            - "${e_second_tester} == \"ERR_SEGREGATION_OF_DUTIES\" with HTTP 403 - qe-002 ran the HIPOT test, so the rule scans every CableTest operator, not only the most recent"
            - "${e_admin_as_tester} == \"ERR_SEGREGATION_OF_DUTIES\" with HTTP 403: the check is on X-User-ID, so PlantAdmin's blanket authorisation does not exempt the acting user id"
            - "all three refusals are inert: after them ProductionLot.${lot_id}.quality_state is still \"PENDING\" and packaged_length_ft is still null"
            - "qe-003 releases the lot: ${released_quality} == \"CONFORMING\" and ${released_length} == 5000"
            - "the release is a quality-dimension move only: process_state stays \"TESTED\" until a reel load packages the lot"

      - name: customer_role_is_scoped_to_its_own_account_orders_and_shipments
        claim_type: role_scoping
        grounds:
          - roles[Customer]
          - validations[priority=20]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Customer is the one entity_backed role: X-User-ID is a Customer id, so the very same list endpoint returns different rows for different callers, and a cross-account read is a 403 rather than a 404 even though the row plainly exists. The scoping reaches shipments through their order, not through any field the customer can see."
