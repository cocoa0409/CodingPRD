              captures: { order0_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-orders/${order0_id}/submit"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - call: "GET /vaccine-distribution/site-orders/${order0_id}"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { rounded_zero: "$.data.rounded_from_doses" }
          trigger:
            - call: "POST /vaccine-distribution/site-orders/${order0_id}/accept"
              payload: { accepted_cartons: 2, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: DistributionPlanner
              captures: { accepted_zero: "$.data.accepted_cartons" }
          assert:
            - "rounded_zero == 0 because requested_doses is exactly 0 and the waterfall is skipped"
            - "SiteOrder.${order0_id}.min_order_shortfall_cartons == 2, equal to the whole governing minimum rather than to a gap against a rounded need"
            - "accepted_zero == 2 and SiteOrder.${order0_id}.accepted_doses == 2340"
            - "SiteOrder.${order0_id}.materialization_variance_doses == 2340, the signed difference between accepted and requested doses"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_acceptance_requires_certified_destination
        grounds:
          - state_machines.SiteOrder.transitions.SUBMITTED_to_ACCEPTED
          - validations[priority=10]
          - entities.StorageSite.fields.equipment_certified
          - endpoints.POST_/site-orders/{id}/accept
        distinguishing_aspect: "The order's own transition is gated by the destination StorageSite's equipment_certified flag, which flips true only when a RECORDED, unexpired PASSED verification exists — so the same order is refused before the verification row and accepted after it."
        test_recipe:
          setup:
            - "The anchored base fixture, plus uncertified site MI-RIV-03 with ULTRA_COLD capability and one submitted order for that site."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - call: "POST /vaccine-distribution/storage-sites"
              payload: { site_code: "MI-RIV-03", site_name: "Riverside Mobile Unit", jurisdiction_program_id: "${prog_id}", storage_capability: "ULTRA_COLD", ultra_cold_capacity_cartons: 6, refrigerated_capacity_cartons: 6, cold_chain_equipment_type: "ULTRA_COLD_FREEZER", equipment_certificate_expires_at: "2027-01-01T00:00:00Z", expected_weekly_doses: 900 }
              as: DistributionPlanner
              captures: { site3_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-orders"
              payload: { allocation_entitlement_id: "${ent_id}", storage_site_id: "${site3_id}", requested_cartons: 2, requested_doses: 0 }
              as: SiteCoordinator
              as_user_id: "${site3_id}"
              captures: { order3_id: "$.data.id" }
            - call: "GET /vaccine-distribution/storage-sites/${site3_id}"
              payload: {}
              as: DistributionPlanner
              captures: { certified_before: "$.data.equipment_certified" }
          trigger:
            - call: "POST /vaccine-distribution/site-orders/${order3_id}/submit"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site3_id}"
              captures: { submit_before_error: "$.data.error_id" }
            - call: "POST /vaccine-distribution/site-equipment-verifications"
              payload: { storage_site_id: "${site3_id}", equipment_type: "ULTRA_COLD_FREEZER", certificate_number: "CERT-MI-0003", certificate_expires_at: "2027-01-01T00:00:00Z", verified_at: "2026-09-01T00:00:00Z", outcome: "PASSED" }
              as: ColdChainReviewer
              captures: { cert_after: "$.data.status" }
            - call: "POST /vaccine-distribution/site-orders/${order3_id}/submit"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site3_id}"
              captures: { submitted_after: "$.data.order_status" }
          assert:
            - "certified_before is false and the first submit returns ERR_SITE_EQUIPMENT_NOT_CERTIFIED"
            - "cert_after == RECORDED and GET /vaccine-distribution/storage-sites/${site3_id} then reports equipment_certified == true"
            - "the second submit succeeds with submitted_after == SUBMITTED"
            - "SiteOrder.${order3_id}.requested_cartons_snapshot == 2"

      - name: transfer_dispatchability_tracks_the_carton_expiry
        grounds:
          - state_machines.SiteTransfer.transitions.APPROVED_to_DISPATCHED
          - validations[priority=15]
          - entities.Carton.fields.current_expires_at
          - endpoints.POST_/site-transfers/{id}/dispatch
        distinguishing_aspect: "The transfer's own dispatch transition is gated by the Carton's current_expires_at, so the transfer is approved while the carton is live and refused with the thaw-window error once the logical clock has passed that instant — a SiteTransfer transition driven by Carton state."
        test_recipe:
          setup:
            - "The anchored base fixture with carton C-01 thawed at 2026-09-01T08:00:00Z, plus a known destination site MI-RIV-04 with REFRIGERATED capability and a PASSED verification, and an approved transfer of C-01 to it."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
            - *c_accept
            - *c_disp
            - *c_pack
            - *c_shipper
            - *c_attach
            - *c_readings
            - *c_read_delivered
            - *c_ship_v
            - *c_seal
            - *c_dispatch
            - *c_deliver
            - *c_thaw_base
            - *c_thaw_call
            - call: "POST /vaccine-distribution/storage-sites"
              payload: { site_code: "MI-RIV-04", site_name: "Riverside Cold Room", jurisdiction_program_id: "${prog_id}", storage_capability: "REFRIGERATED", ultra_cold_capacity_cartons: 0, refrigerated_capacity_cartons: 8, cold_chain_equipment_type: "THERMAL_SHIPPER", equipment_certificate_expires_at: "2027-01-01T00:00:00Z", expected_weekly_doses: 700 }
              as: DistributionPlanner
              captures: { site4_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-equipment-verifications"
              payload: { storage_site_id: "${site4_id}", equipment_type: "THERMAL_SHIPPER", certificate_number: "CERT-MI-0004", certificate_expires_at: "2027-01-01T00:00:00Z", verified_at: "2026-09-01T00:00:00Z", outcome: "PASSED" }
              as: ColdChainReviewer
            - call: "POST /vaccine-distribution/site-transfers"
              payload: { from_site_id: "${site_id}", to_site_id: "${site4_id}", carton_id: "${c01}", requested_at: "2026-09-01T10:00:00Z" }
              as: DistributionPlanner
              captures: { tr_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-transfers/${tr_id}/approve"
              payload: {}
              as: DistributionPlanner
              captures: { tr_admissible: "$.data.admissibility" }
            - call: "POST /vaccine-distribution/_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vaccine-distribution/site-transfers/${tr_id}/dispatch"
              payload: {}
              as: LogisticsOperator
              captures: { expired_error: "$.data.error_id" }
            - call: "GET /vaccine-distribution/cartons/${c01}"
              payload: {}
              as: DistributionPlanner
              captures: { c01_state: "$.data.temperature_state" }
          assert:
            - "tr_admissible == ADMITTED while the carton was live at 2026-09-01"
            - "the dispatch returns 422 with expired_error == ERR_THAW_WINDOW_EXPIRED"
            - "c01_state == EXPIRED and Carton.${c01}.expired_at == 2026-09-06T08:00:00Z, the instant the 120-hour thaw window closed"
            - "SiteTransfer.${tr_id}.status is still APPROVED"

  - rule_id: resource_temporal_overlap
    instances:

      - name: touching_reservation_intervals_are_free_and_interior_overlap_is_not
        grounds:
          - calculations.storage_capacity_interval
          - validations[priority=12]
          - entities.CartonStorageReservation.fields.resolved_conflict_minutes
          - endpoints.POST_/carton-storage-reservations
        distinguishing_aspect: "Two reservations whose intervals merely touch at a single instant have zero overlap and are admitted, while two reservations that share interior minutes above the site's capacity are refused — the half-open rule is applied with an inclusive-duration ceiling of 10 cartons."
        test_recipe:
          setup:
            - "The anchored base fixture. MI-RIV-01 has ultra_cold_capacity_cartons 10 and an existing HELD reservation of 6 cartons over [09:00, 12:00)."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
            - *c_accept
            - *c_disp
            - *c_pack
            - *c_shipper
            - *c_attach
            - *c_readings
            - *c_read_delivered
            - *c_ship_v
            - *c_seal
            - *c_dispatch
            - *c_deliver
            - call: "POST /vaccine-distribution/carton-storage-reservations"
              payload: { storage_site_id: "${site_id}", carton_id: "${c01}", entry_type: "ULTRA_COLD", temp_state: "FROZEN", reserved_capacity_cartons: 6, start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T12:00:00Z", resolve_method: "RESERVATION_BOUNDARY" }
              as: DistributionPlanner
              captures: { res_a_id: "$.data.id" }
          trigger:
            - call: "POST /vaccine-distribution/carton-storage-reservations"
              payload: { storage_site_id: "${site_id}", carton_id: "${c01}", entry_type: "ULTRA_COLD", temp_state: "FROZEN", reserved_capacity_cartons: 6, start_at: "2026-09-01T11:00:00Z", end_at: "2026-09-01T14:00:00Z", resolve_method: "RESERVATION_BOUNDARY" }
              as: DistributionPlanner
              captures: { interior_error: "$.data.error_id" }
            - call: "POST /vaccine-distribution/carton-storage-reservations"
              payload: { storage_site_id: "${site_id}", carton_id: "${c01}", entry_type: "ULTRA_COLD", temp_state: "FROZEN", reserved_capacity_cartons: 4, start_at: "2026-09-01T12:00:00Z", end_at: "2026-09-01T13:00:00Z", resolve_method: "RESERVATION_BOUNDARY" }
              as: DistributionPlanner
              captures: { touching_id: "$.data.id", touching_conflict: "$.data.resolved_conflict_minutes" }
          assert:
            - "the interior overlap returns 409 with interior_error == ERR_STORAGE_RESERVATION_CONFLICT"
            - "the touching reservation succeeds because in_end == out_start gives zero overlap minutes"
            - "CartonStorageReservation.${touching_id}.resolved_conflict_minutes == 0 and its status is HELD"
            - "the pooled quantity on the touching pair is exactly 10, equal to ultra_cold_capacity_cartons, and is admitted"

      - name: boundary_resolution_vs_pooled_capacity_semantics
        grounds:
          - calculations.storage_capacity_interval
          - entities.CartonStorageReservation.fields.resolved_conflict_minutes
          - endpoints.POST_/carton-storage-reservations
          - validations[priority=12]
        distinguishing_aspect: "The identical interval pair is refused under the boundary arithmetic and admitted under the pooled arithmetic with the overlap recorded, so the two instances differ in interval semantics rather than in the numbers."
        test_recipe:
          setup:
            - "The anchored base fixture with a HELD 6-carton reservation on MI-RIV-01 over [09:00, 12:00) and ultra_cold_capacity_cartons 10."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
            - *c_accept
            - *c_disp
            - *c_pack
            - *c_shipper
            - *c_attach
            - *c_readings
            - *c_read_delivered
            - *c_ship_v
            - *c_seal
            - *c_dispatch
            - *c_deliver
            - call: "POST /vaccine-distribution/carton-storage-reservations"
              payload: { storage_site_id: "${site_id}", carton_id: "${c01}", entry_type: "ULTRA_COLD", temp_state: "FROZEN", reserved_capacity_cartons: 6, start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T12:00:00Z", resolve_method: "RESERVATION_BOUNDARY" }
              as: DistributionPlanner
              captures: { res_a_id: "$.data.id" }
          trigger:
            - call: "POST /vaccine-distribution/carton-storage-reservations"
              payload: { storage_site_id: "${site_id}", carton_id: "${c01}", entry_type: "ULTRA_COLD", temp_state: "FROZEN", reserved_capacity_cartons: 6, start_at: "2026-09-01T11:00:00Z", end_at: "2026-09-01T14:00:00Z", resolve_method: "RESERVATION_BOUNDARY" }
              as: DistributionPlanner
              captures: { boundary_error: "$.data.error_id" }
            - call: "POST /vaccine-distribution/carton-storage-reservations"
              payload: { storage_site_id: "${site_id}", carton_id: "${c01}", entry_type: "ULTRA_COLD", temp_state: "FROZEN", reserved_capacity_cartons: 6, start_at: "2026-09-01T11:00:00Z", end_at: "2026-09-01T14:00:00Z", resolve_method: "CAPACITY_POOLED" }
              as: DistributionPlanner
              captures: { pooled_id: "$.data.id", pooled_conflict: "$.data.resolved_conflict_minutes" }
          assert:
            - "the boundary call returns 409 with boundary_error == ERR_STORAGE_RESERVATION_CONFLICT"
            - "the pooled call on the identical interval succeeds with status HELD"
            - "CartonStorageReservation.${pooled_id}.resolved_conflict_minutes == 60, the interior minutes shared with the incumbent"
            - "the pooled reservation's reserved_capacity_cartons is 6 and the incumbent stays HELD"

  - rule_id: compensating_invariant
    instances:

      - name: fulfillment_reversal_conserves_the_released_dose_total
        grounds:
          - state_machines.SiteOrder.transitions.FULFILLED_to_ACCEPTED
          - state_machines.DoseLedgerEntry.transitions.RECONCILED_to_RECORDED
          - calculations.dose_accountability_variants
          - endpoints.POST_/site-orders/{id}/fulfillment/reverse
        distinguishing_aspect: "For every carton the invariant cumulative_released_doses - remaining_doses - administered_doses == 0 holds after the ORDER fulfillment reversal and again after a manual RELEASE reversal, so the pair of compensating actions leaves the conserved dose quantity at zero drift."
        test_recipe:
          setup:
            - "The anchored base fixture after a two-carton order has been dispatched and delivered, so each carton carries one RELEASE entry of 2340 doses and cumulative_released_doses is 2340."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
            - *c_accept
            - *c_disp
            - *c_pack
            - *c_shipper
            - *c_attach
            - *c_readings
            - *c_read_delivered
            - *c_ship_v
            - *c_seal
            - *c_dispatch
            - *c_deliver
            - call: "GET /vaccine-distribution/storage-sites/${site_id}/usable-doses"
              payload: {}
              as: DistributionPlanner
              captures: { usable_after_delivery: "$.data.usable_doses" }
          trigger:
            - call: "POST /vaccine-distribution/site-orders/${order_id}/fulfillment/reverse"
              payload: {}
              as: DistributionPlanner
              captures: { order_after_reverse: "$.data.order_status" }
            - call: "POST /vaccine-distribution/dose-ledger-entries"
              payload: { carton_id: "${c01}", entry_type: "RELEASE", quantity_doses: 468, occurred_at: "2026-09-02T00:00:00Z" }
              as: DistributionPlanner
              captures: { manual_release_id: "$.data.id" }
            - call: "POST /vaccine-distribution/dose-ledger-entries/${manual_release_id}/reverse"
              payload: { occurred_at: "2026-09-02T01:00:00Z", reason: "Release recorded against the wrong carton." }
              as: DistributionPlanner
              captures: { reverse_entry_id: "$.data.id" }
          assert:
            - "usable_after_delivery == 2340 and every carton on the order reports cumulative_released_doses == 2340"
            - "order_after_reverse == ACCEPTED and each carton's cumulative_released_doses falls back to 0 while remaining_doses returns to 2340"
            - "GET /vaccine-distribution/storage-sites/${site_id}/usable-doses reports usable_doses == 4680 after the reversal, restoring the order's full release"
            - "the manual RELEASE entry is fully offset: Σ(RELEASE + TRANSFER_IN) − Σ(remaining_doses) − administered equals 0 for both cartons after the reversal"

      - name: rejection_and_lapse_conserve_the_entitlement_carton_total
        grounds:
          - state_machines.SiteOrder.transitions.SUBMITTED_to_REJECTED
          - state_machines.AllocationWindow.transitions.OPEN_to_CLOSED
          - state_machines.AllocationEntitlement.transitions.PENDING_to_LAPSED
          - entities.AllocationEntitlement.fields.available_cartons
          - endpoints.POST_/site-orders/{id}/reject
        distinguishing_aspect: "The invariant available_cartons + held_cartons + lapsed_cartons == computed_cartons holds after every step, so rejecting an accepted order returns its cartons and lapses the remainder without leaking a single carton, ending at available 0 and lapsed 10."
        test_recipe:
          setup:
            - "The anchored base fixture with the entitlement holding 2 cartons against an accepted order, so available_cartons is 8 and held_cartons is 2 of a computed 10."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_prog
            - *c_batch
            - *c_cartons
            - *c_release
            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - *c_order
            - *c_submit
            - *c_accept
          trigger:
            - call: "POST /vaccine-distribution/site-orders/${order_id}/reject"
              payload: { rejected_cartons: 2, reason_code: "CAPACITY_UNAVAILABLE" }
              as: DistributionPlanner
              captures: { released_cartons: "$.data.rejected_cartons" }
            - call: "POST /vaccine-distribution/allocation-windows/${win_id}/close"
              payload: {}
              as: DistributionPlanner
              captures: { closed_status: "$.data.status" }
            - call: "GET /vaccine-distribution/shipping-window-lapses"
              payload: {}
              as: DistributionPlanner
              captures: { lapsed_cartons: "$.data[0].lapsed_cartons" }
          assert:
            - "the reject restores the entitlement to available_cartons 10 with held_cartons 0"
            - "closed_status == CLOSED and lapsed_cartons == 10"
            - "AllocationEntitlement.${ent_id}.acceptance_status == LAPSED with available_cartons 0 and held_cartons 0"
            - "the invariant available_cartons + held_cartons + lapsed_cartons == computed_cartons holds at 10 before and after every compensating step"
            - "JurisdictionProgram.${prog_id}.lapsed_carton_count == 10"
