  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_fein_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_DUPLICATE_FEIN]"]
        distinguishing_aspect: "Second registrant with the same fein -> 409 ERR_DUPLICATE_FEIN."
        test_recipe:
          setup: ["one registrant with fein 12-3456789"]
          setup_api_calls:
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /registrants", payload: { legal_name: "Acme Clone", fein: "12-3456789" }, as: ComplianceAdmin, captures: { err: $.data.error_id } }
          assert: ["409 ERR_DUPLICATE_FEIN"]

      - name: duplicate_jurisdiction_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "Second jurisdiction with code CA-BOE -> 409 ERR_DUPLICATE_CODE."
        test_recipe:
          setup: ["jurisdiction CA-BOE exists"]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California Again", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { err: $.data.error_id } }
          assert: ["409 ERR_DUPLICATE_CODE"]

      - name: duplicate_registration_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_DUPLICATE_REGISTRATION]"]
        distinguishing_aspect: "A second non-REVOKED registration for the same (registrant, jurisdiction) -> 409 ERR_DUPLICATE_REGISTRATION."
        test_recipe:
          setup: ["registrant R and jurisdiction CA-BOE; one PENDING registration"]
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "ACTUAL" }, as: ComplianceAdmin, captures: { err: $.data.error_id } }
          assert: ["409 ERR_DUPLICATE_REGISTRATION"]

