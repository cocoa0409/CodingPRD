  - rule_id: non_linear_state_machine
    instances:

      - name: appeal_negotiation_cycle_returns_to_filed_and_caps_at_three_rounds
        grounds:
          - state_machines.Appeal.FILED_to_MORE_EVIDENCE_REQUIRED
          - state_machines.Appeal.MORE_EVIDENCE_REQUIRED_to_FILED
          - state_machines.Appeal.FILED_to_UPHELD
          - entities.Appeal.fields.round_no
          - validations.priority_26_ERR_APPEAL_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          The Appeal machine is cyclic on the Appeal entity: FILED ->
          MORE_EVIDENCE_REQUIRED -> FILED revisits an already-occupied state
          twice, so a linear implementation that forbids re-entering FILED
          fails on the first evidence submission. The cycle is bounded by
          round_no, not by state: at round_no 3 the MORE_EVIDENCE decision is
          refused with ERR_APPEAL_ROUNDS_EXHAUSTED (409) while the terminal
          UPHELD decision from the very same FILED state still succeeds - the
          state alone does not determine which triggers are legal.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "Page classified HUMAN with [ARMS] and CONFIRMED by analyst-2, so the page sits in HUMAN_CONFIRMED at HIGH_RISK and is appealable."
            - "The publisher files an appeal the same logical day, inside the 14-day filing window."
            - "The cycle is walked twice: decide MORE_EVIDENCE (round stays 1), submit evidence (round 2), decide MORE_EVIDENCE (round stays 2), submit evidence (round 3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/arms-review" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id, page_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver}", classifier_kind: "HUMAN", category_codes: ["ARMS"], ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_id: $.data.id }
            - call: "POST /page-classifications/${cls_id}/review"
              payload: { decision: "CONFIRM", review_note: "Weapons editorial confirmed" }
              as: ClassificationAnalyst
              as_user_id: "analyst-2"
            - call: "POST /appeals"
              payload: { classification_id: "${cls_id}", reason_code: "CONTEXT_IGNORED", evidence_note: "Historical documentary context, not arms promotion" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { outcome: "MORE_EVIDENCE", decision_note: "Supply the editorial standards page" }
              as: DisputeOfficer
              as_user_id: "officer-1"
            - call: "POST /appeals/${appeal_id}/evidence"
              payload: { evidence_note: "Editorial standards URL supplied" }
              as: Publisher
              as_user_id: "${pub_id}"
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { outcome: "MORE_EVIDENCE", decision_note: "Standards page insufficient, supply crawl sample" }
              as: DisputeOfficer
              as_user_id: "officer-1"
            - call: "POST /appeals/${appeal_id}/evidence"
              payload: { evidence_note: "Crawl sample of 50 comparable URLs supplied" }
              as: Publisher
              as_user_id: "${pub_id}"
          trigger:
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { outcome: "MORE_EVIDENCE", decision_note: "One more round please" }
              as: DisputeOfficer
              as_user_id: "officer-1"
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { outcome: "UPHELD", decision_note: "Original HIGH_RISK classification stands" }
              as: DisputeOfficer
              as_user_id: "officer-1"
          assert:
            - "Appeal.${appeal_id}.appeal_state is FILED -> MORE_EVIDENCE_REQUIRED -> FILED -> MORE_EVIDENCE_REQUIRED -> FILED across the setup, revisiting FILED twice"
            - "Appeal.${appeal_id}.round_no == 3 and evidence_note == 'Crawl sample of 50 comparable URLs supplied' after the second evidence submission"
            - "The first trigger call returns 409 ERR_APPEAL_ROUNDS_EXHAUSTED and leaves appeal_state FILED and round_no 3 unchanged"
            - "The second trigger call succeeds from that same FILED state: appeal_state == UPHELD and decided_by_user_id == 'officer-1'"
            - "Page.${page_id}.classification_state == APPEALED before the terminal decision and HUMAN_CONFIRMED after it, with current_tier still HIGH_RISK"
            - "Page.${page_id}.appeal_count == 1; Publisher.${pub_id}.decided_appeal_count == 1 and overturned_appeal_count == 0"

