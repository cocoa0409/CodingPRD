          candidate case is both attached to the wrong surgeon's block AND only 5 minutes behind an
          incumbent case in the same room with a 15-minute turnover buffer. The referential error
          wins. Re-issuing the identical hold against the correct surgeon's block in the same room
          then yields the turnover error, so both rules are proven live and correctly ordered. No
          permit is involved: both cases are LOCAL_ONLY, which the privilege gate always allows.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
