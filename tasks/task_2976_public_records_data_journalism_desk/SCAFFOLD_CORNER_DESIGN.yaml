            max_waiver_cents 10000 through all eight steps and asserts every intermediate cent
            (12250 / 3000 / 15250 / 0.85 / 10000 / 5250), which is exactly the constants_applied claim:
            the cap that binds is the Agency row's own value, not a global.

      - name: desk_ledger_running_total_survives_add_and_reversal
        claim_type: aggregation
        grounds:
