        distinguishing_aspect: |
          Depth-4 cascade triggered by a TradeAreaModel lock: lock(M2)
          supersedes M1 (link 1); the COMMITTEE_LOCKED forecast pinning M1
          becomes SUPERSEDED (link 2); the OPEN review pinning that forecast
          becomes EXPIRED (link 3); the IN_COMMITTEE site regresses to MODELED
          (link 4) — each link caused by the previous link's mutation, not by
          the lock directly.
