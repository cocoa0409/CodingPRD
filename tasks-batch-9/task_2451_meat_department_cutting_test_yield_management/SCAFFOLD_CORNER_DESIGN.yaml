            - "${real_tests} == 0 — the childless purchase lists nothing but still answers 200"

  # ===========================================================================
  - section: rbac
    instances:

      - name: transition_actions_are_gated_per_action_not_per_endpoint
        claim_type: exclusive_operations
        grounds:
          - rbac.MeatCutter.exclusive_operations
          - rbac.MeatManager.exclusive_operations
          - validations[priority=2]
          - validations[priority=6]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_TRANSITION_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The cutting-test transitions endpoint admits both MeatCutter and MeatManager, so role screening happens twice: a role outside the endpoint list is stopped at priority 2 with ERR_ROLE_NOT_PERMITTED (403), while a listed role asking for an action reserved to the other role is stopped at priority 6 with ERR_TRANSITION_ROLE_NOT_PERMITTED (403) — before the state check at priority 8 ever runs."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "Purchase P1 (net 98.50 lb) carries CuttingTest T1 with a SALABLE_CUT line (62.0 lb @1450 -> RIB01), a GRIND_TRIM line (18.5 lb @420, lean 78.0) and a FAT_BONE_LOSS line (18.0 lb)."
            - "T1 was submitted by cutter-01 and sits in SUBMITTED."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t1_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 1, subprimal_code: "RIBEYE_STEAK", disposition: "SALABLE_CUT", yield_weight_lb: 62.0, market_value_per_lb_cents: 1450, retail_item_id: "${ri1_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 2, subprimal_code: "RIBEYE_TRIM_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 18.5, market_value_per_lb_cents: 420, lean_pct: 78.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 3, subprimal_code: "RIBEYE_FAT_BONE", disposition: "FAT_BONE_LOSS", yield_weight_lb: 18.0, market_value_per_lb_cents: 0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: MeatCutter
              as_user_id: "cutter-01"
          trigger:
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "APPROVE" }
              as: MeatCutter
              as_user_id: "cutter-02"
              captures: { err_action: $.data.error_id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "REJECT", rejection_reason: "trim weights do not match the bench sheet" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { rej_status: $.data.status, rej_count: $.data.revision_count }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "REVISE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { err_revise: $.data.error_id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "REVISE" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { rev_status: $.data.status }
          assert:
            - "${err_action} == ERR_TRANSITION_ROLE_NOT_PERMITTED with HTTP 403 — MeatCutter is on the endpoint's role list but APPROVE belongs to MeatManager, and CuttingTest.${t1_id}.status stays SUBMITTED"
            - "${rej_status} == REJECTED with ${rej_count} == 0 — REJECT is accepted for MeatManager because mgr-01 is not the submitter cutter-01"
            - "${err_revise} == ERR_TRANSITION_ROLE_NOT_PERMITTED with HTTP 403 — MeatManager may not REVISE, and CuttingTest.${t1_id}.status stays REJECTED"
            - "${rev_status} == DRAFT with revision_count == 1 once the cutter issues the same REVISE"
            - "The identical POST issued with X-User-Role: PricingAnalyst (a role absent from the endpoint's §1.5 list) returns ERR_ROLE_NOT_PERMITTED (403) at priority 2, never ERR_TRANSITION_ROLE_NOT_PERMITTED"
            - "The identical POST issued with no X-User-Role and no X-User-ID header returns ERR_UNAUTHENTICATED (401) at priority 1"

      - name: segregation_of_duties_blocks_self_approval_and_self_resolution
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=15]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.CuttingTest.SUBMITTED_to_APPROVED
          - state_machines.CaseFailure.CONTAINED_to_RESOLVED
          - calculations.case_posture_derivation
        distinguishing_aspect: "Roles are opaque, so the same X-User-ID can present a different X-User-Role: user u-77 who submitted the cutting test is refused its APPROVE with ERR_SEGREGATION_OF_DUTIES (403) even while carrying the MeatManager role, and the same u-77 whose reading opened a case failure is refused its RESOLVE — both actions succeed for mgr-01."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "CuttingTest T1 on purchase P1 (net 98.50 lb) is SUBMITTED by user u-77 acting as MeatCutter."
            - "Readings 4.5 then 4.6 C on CASE-A, both posted by u-77 as MeatCutter, opened CaseFailure CF1 with reported_by_user_id u-77; CF1 was then CONTAINED and an in-spec 4.0 C reading reset the consecutive counter to 0."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
