            - call: "POST /foundry/casting-units/${u4}/inspect"
              payload: { outcome: PASS, measured_weight_oz: 128.0, measured_diameter_in: 10.25, measured_wall_thickness_in: 0.19 }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/casting-units/${u5}/inspect"
              payload: { outcome: PASS, measured_weight_oz: 128.0, measured_diameter_in: 10.25, measured_wall_thickness_in: 0.19 }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/casting-units/${u6}/inspect"
              payload: { outcome: PASS, measured_weight_oz: 128.0, measured_diameter_in: 10.25, measured_wall_thickness_in: 0.19 }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/casting-units/${u7}/inspect"
              payload: { outcome: PASS, measured_weight_oz: 128.0, measured_diameter_in: 10.25, measured_wall_thickness_in: 0.19 }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/casting-units/${u8}/inspect"
              payload: { outcome: PASS, measured_weight_oz: 128.0, measured_diameter_in: 10.25, measured_wall_thickness_in: 0.19 }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/casting-units/${u9}/inspect"
              payload: { outcome: PASS, measured_weight_oz: 128.0, measured_diameter_in: 10.25, measured_wall_thickness_in: 0.19 }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/casting-units/${u10}/inspect"
              payload: { outcome: PASS, measured_weight_oz: 128.0, measured_diameter_in: 10.25, measured_wall_thickness_in: 0.19 }
              as: QualityInspector
              as_user_id: qi-1
            - call: "POST /foundry/seasoning-batches"
