              payload: { expected_permit_version: "${pv2}", service_days_used: 40, client_count: 8, gross_revenue_cents: 2499999, allowable_deductions_cents: 0 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { r1c_id: "$.data.id" }
