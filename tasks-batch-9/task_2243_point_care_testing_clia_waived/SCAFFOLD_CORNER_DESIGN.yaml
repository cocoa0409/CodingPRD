            - "the first submission returns HTTP 422 with ${err} == \"ERR_OPERATOR_COMPETENCY_LAPSED\" (NOT ERR_OPERATOR_ACCESS_LOCKED - priority 52 does not list this endpoint) and NOT ERR_INSUFFICIENT_COMPETENCY_METHODS (methods_demonstrated is 6)"
