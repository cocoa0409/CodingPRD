  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_hold_visible_in_same_flow
        claim_type: immediate
        grounds:
          - calculations.hold_propagation
          - entities.Lot.fields.hold_status
        distinguishing_aspect: "Issuing a hold makes the target lot's hold_status HELD immediately observable on the next GET (no lag)."
        test_recipe:
          setup: ["Released lot, then a hold issued."]
          setup_api_calls:
            - call: "POST /traceability/facilities"
              payload: { name: "F", gln: "C-29", initial_utc: "2026-01-01T00:00:00Z" }
              as: QualityManager
              captures: { fid: $.data.id }
            - call: "POST /traceability/suppliers"
              payload: { facility_id: "${fid}", name: "S", coa_required: false }
              as: QualityManager
              captures: { sup: $.data.id }
            - call: "POST /traceability/ingredients"
              payload: { facility_id: "${fid}", name: "I", storage_target_c: 4, shelf_life_days: 30 }
              as: QualityManager
              captures: { ing: $.data.id }
            - call: "POST /traceability/lots"
              payload: { facility_id: "${fid}", ingredient_id: "${ing}", lot_code: "L", lot_kind: "RAW_MATERIAL", received_qty: 5, production_date: "2026-01-01T00:00:00Z", supplier_id: "${sup}" }
              as: ReceivingClerk
              captures: { lot: $.data.id }
            - call: "POST /traceability/lots/${lot}/release"
              payload: {}
              as: QualityManager
          trigger:
            - call: "POST /traceability/hold-orders"
              payload: { facility_id: "${fid}", target_lot_id: "${lot}", reason: "ALLERGEN" }
