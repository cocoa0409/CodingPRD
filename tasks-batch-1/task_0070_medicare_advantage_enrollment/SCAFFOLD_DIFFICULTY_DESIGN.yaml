  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_period_closed_interval_adjacency_collides
        grounds:
          - validations[priority=15]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.EnrollmentPeriod.fields.window_start
          - entities.EnrollmentPeriod.fields.window_end
        distinguishing_aspect: "EnrollmentPeriod overlap uses CLOSED-interval [window_start, window_end] semantics: two AEP periods for consecutive years are fine, but creating a second IEP for the same beneficiary (whose derived window equals the first's) collides because the windows are identical/touching — adjacency collides under closed semantics."
        test_recipe:
          setup:
            - "A beneficiary with one IEP period already created; attempt to create a second IEP (identical derived window) -> overlap"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Margaret H", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep1_id: $.data.id }
          trigger:
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PERIOD_OVERLAP"

      - name: medigap_half_open_interval_adjacency_allowed
        grounds:
          - validations[priority=16]
          - errors[ERR_MEDIGAP_OVERLAP]
          - entities.MedigapPolicy.fields.coverage_start
          - entities.MedigapPolicy.fields.coverage_end
        distinguishing_aspect: "MedigapPolicy overlap uses HALF-OPEN [coverage_start, coverage_end) semantics on a different entity: a second policy whose coverage_start equals the first's coverage_end (adjacency) is ALLOWED and issues successfully — the opposite adjacency rule from the closed-interval EnrollmentPeriod check."
        test_recipe:
          setup:
            - "A beneficiary with one ISSUED Medigap policy covering [2026-01-15, 2026-07-15); a second GI window; a second policy starting exactly 2026-07-15"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Radia P", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "GI_MEDIGAP", source_event_date: "2026-01-10T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { gi1_id: $.data.id }
            - call: "POST /medigap-policies"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${gi1_id}", coverage_start: "2026-01-15T00:00:00.000Z", coverage_end: "2026-07-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { mp1_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "GI_MEDIGAP", source_event_date: "2026-07-10T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { gi2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-12T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "POST /medigap-policies"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${gi2_id}", coverage_start: "2026-07-15T00:00:00.000Z", coverage_end: "2027-07-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { mp2_id: $.data.id, mp2_status: $.data.status }
          assert:
            - "response.status == 201"
            - "MedigapPolicy.${mp2_id}.status == ISSUED"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: penalty_assess_then_waive_zeroes_total_penalty_burden
        grounds:
          - state_machines.PenaltyAssessment.ASSESSED_to_WAIVED
          - calculations.partb_lep
          - entities.PenaltyAssessment.fields.monthly_penalty_cents
        distinguishing_aspect: "Conserved quantity = the beneficiary's total assessed penalty cents (sum of monthly_penalty_cents over PenaltyAssessments in status ASSESSED). Assess (forward) adds 1747c; waive (compensating) zeroes that row's monthly_penalty_cents, so the ASSESSED-status total returns exactly to its pre-assessment value of 0."
        test_recipe:
          setup:
            - "A beneficiary with one PART_B PenaltyAssessment (uncovered_months=12 -> 1747c), then waived"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Vint C", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { beneficiary_id: "${ben_id}", penalty_type: "PART_B", uncovered_months: 12 }
              as: ComplianceOfficer
              captures: { pa_id: $.data.id, pa_before: $.data.monthly_penalty_cents }
          trigger:
            - call: "POST /penalty-assessments/${pa_id}/waive"
              payload: {}
              as: ComplianceOfficer
              captures: { pa_after: $.data.monthly_penalty_cents, pa_status: $.data.status }
          assert:
            - "PenaltyAssessment.${pa_id}.monthly_penalty_cents == 1747 before waive"
            - "PenaltyAssessment.${pa_id}.monthly_penalty_cents == 0"
            - "PenaltyAssessment.${pa_id}.status == WAIVED"

      - name: partb_activate_then_drop_restores_part_b_coverage_count
        grounds:
          - state_machines.PartBEnrollment.FILED_to_ACTIVE
          - state_machines.PartBEnrollment.ACTIVE_to_DROPPED
          - entities.Beneficiary.fields.part_b_status
        distinguishing_aspect: "Conserved quantity = the beneficiary's active Part B coverage indicator (part_b_status, a coverage count of 0 or 1) — a different conserved quantity than penalty cents. Activate (forward) sets ENROLLED (count 1); drop (compensating) sets NONE (count 0), restoring the pre-activation value."
        test_recipe:
          setup:
            - "Beneficiary with Part A established; Part B filed, activated (ENROLLED), then dropped (NONE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Whitfield D", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id, pb_init: $.data.part_b_status }
            - call: "POST /beneficiaries/${ben_id}/establish-part-a"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /part-b-enrollments"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pbe_id: $.data.id }
            - call: "POST /part-b-enrollments/${pbe_id}/activate"
              payload: {}
              as: EnrollmentAdmin
              captures: { pb_after_activate: $.data.status }
          trigger:
            - call: "POST /part-b-enrollments/${pbe_id}/drop"
              payload: {}
              as: EnrollmentAdmin
          assert:
            - "Beneficiary.${ben_id}.part_b_status == ENROLLED after activate"
            - "PartBEnrollment.${pbe_id}.status == DROPPED"
            - "Beneficiary.${ben_id}.part_b_status == NONE"
