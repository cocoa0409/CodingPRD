      - name: composite_score_sums_three_components_at_the_exact_overlap_peak
        claim_type: weighted_scoring
        grounds:
          - calculations.mission_program_alignment_score
          - endpoints.POST_/alignment-assessments
          - entities.AlignmentAssessment.fields.composite_score
        distinguishing_aspect: |
          The overlap component is deliberately NON-monotonic: it peaks at index 0.5
          (complementary programmes) and falls to zero at both 0.0 and 1.0. Two
          initiator programmes against four target programmes with exactly one matching
          category-and-county pair give denom = min(2, 4) = 2 and index 0.5000, which is
          the only point that pays the full 30.00. The denominator is the MINIMUM of the
          two counts, not the total of 6 and not the target count of 4 - any other
          denominator moves the index off the peak and the composite off 90.00.
        test_recipe:
          setup:
            - "Two CA organizations with identical mission_code YM-YOUTH_MENTORING, annual_expense_cents 100000002 each and unrestricted_net_assets_cents 59916670 and 40000000"
            - "Two Programs on the initiator and four on the target, of which exactly one initiator/target pair shares both service_category and county_code"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
