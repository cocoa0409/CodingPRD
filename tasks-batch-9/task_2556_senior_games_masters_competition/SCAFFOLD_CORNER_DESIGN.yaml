              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Fenn", email: "ada.fenn@example.org", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_id: $.data.id }
          trigger:
            - call: "GET /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", limit: 101 }
              as: RegistrationOfficer
              captures: { err_over: $.data.error_id }
            - call: "GET /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", limit: 0 }
              as: RegistrationOfficer
              captures: { err_zero: $.data.error_id }
            - call: "GET /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", offset: -1 }
              as: RegistrationOfficer
              captures: { err_neg: $.data.error_id }
