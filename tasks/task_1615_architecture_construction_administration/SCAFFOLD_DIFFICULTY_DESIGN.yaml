        test_recipe:
          setup:
            - "Project in SUBSTANTIAL_COMPLETION_ACHIEVED (punch inspection visit V1 REPORT_ISSUED beforehand)."
            - "All four record document types ACCEPTED (so only the punch gate can fail)."
