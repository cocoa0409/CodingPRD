              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_f18", security_reviewer_id: "u_s18", compliance_reviewer_id: "u_c18" }
              as: VendorRelationshipManager
              captures: { p_bd: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_bd}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_bd}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_bd}"
              payload: {}
              as: RiskOfficer
              captures: { e_bd_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_bd}/approve"
              payload: { expected_engagement_version: "${e_bd_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_bd}/contracts"
              payload: { contract_reference: "BD-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: false, has_sla_terms: true, has_exit_plan_section: false, sla_uptime_pct: 99.5, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_bd: $.data.id }
            - call: "GET /tprm/engagements/${e_bd}"
              payload: {}
              as: RiskOfficer
              captures: { e_bd_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_bd}/execute"
              payload: { expected_engagement_version: "${e_bd_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/vendors/${v_bd}/activate"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_bd}/fourth-parties"
              payload: { name: "Sub Co", service_provided: "sub-processing", data_access_level: "NONE" }
              as: VendorRelationshipManager
              captures: { fp_bd: $.data.id }
            # leave fp_bd PENDING (-15)
            # advance clock past monitoring cycle due_at to trigger OVERDUE (-10)
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            # now initiate exit to compute exit_readiness_score
            - call: "POST /tprm/engagements/${e_bd}/initiate-exit"
              payload: {}
              as: VendorRelationshipManager
          trigger:
            - call: "POST /tprm/engagements/${e_bd}/finalize-exit"
              payload: {}
              as: RiskOfficer
              captures: { err3: $.data.error_id }
          assert:
            - "VendorEngagement.${e_bd}.exit_readiness_score == 75.00  # 100 - 15 (PENDING_FP) - 10 (OVERDUE_CYCLE) = 75"
            - "error_id == ERR_EXIT_READINESS_TOO_LOW  # 75 < 80"

      - name: bcp_actual_rto_at_target_boundary
