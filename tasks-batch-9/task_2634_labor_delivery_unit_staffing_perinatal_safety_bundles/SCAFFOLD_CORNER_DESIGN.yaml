              captures: { e_criteria: $.data.error_id }
            - call: POST /bundle-activations
              payload: { encounter_id: "${enc_id}", bundle_type: "OBSTETRIC_HEMORRHAGE", activation_trigger: "QBL_THRESHOLD", quantitative_blood_loss_ml: 1200 }
              as: ObstetricianAttending
