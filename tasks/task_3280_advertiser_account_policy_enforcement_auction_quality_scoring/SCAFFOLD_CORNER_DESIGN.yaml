        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[campaign-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a successful budget PUT bumps version 1 -> 2, a second PUT still carrying expected_campaign_version 1 returns 412 ERR_STALE_VERSION while a fresh GET + PUT with 2 succeeds and bumps to 3."
        test_recipe:
          setup: ["Clock 2026-09-01. Verified ACTIVE account with DRAFT campaign (version 1 captured at create)."]
          setup_api_calls:
            - *clock0
            - call: "POST /advertiser-accounts"
              payload: { business_name: "OCC Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "OCC Corp LLC", registration_number: "RN-C15", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "OC", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id, cv0: $.data.version }
          trigger:
            - call: "PUT /campaigns/${camp}"
              payload: { daily_budget_cents: 2000, expected_campaign_version: "${cv0}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { cv1: $.data.version }
            - call: "PUT /campaigns/${camp}"
              payload: { daily_budget_cents: 3000, expected_campaign_version: "${cv0}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
            - call: "PUT /campaigns/${camp}"
              payload: { daily_budget_cents: 3000, expected_campaign_version: "${cv1}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { cv2: $.data.version, bud: $.data.daily_budget_cents }
          assert:
            - "cv1 == 2 (first PUT bumped the version)"
            - "err == ERR_STALE_VERSION with http 412 (stale ${cv0} reused)"
            - "cv2 == 3 and bud == 3000 (fresh version succeeds)"

      - name: occ_verification_supersede_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[verification-supersede-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Creating a superseding verification with the account version observed BEFORE the rejection decide returns 412; re-reading the account and retrying with the fresh version succeeds and sets supersedes_id."
        test_recipe:
          setup: ["Clock 2026-09-01. Account with one REJECTED verification; account version captured BEFORE the decide call."]
          setup_api_calls:
            - *clock0
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Sup Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, av0: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Sup Corp LLC", registration_number: "RN-C16", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${av0}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { v1: $.data.id }
            - call: "GET /advertiser-accounts/${acct}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { av1: $.data.version }
            - call: "POST /identity-verifications/${v1}/decide"
              payload: { outcome: "REJECTED", rejection_reason: "document expired" }
              as: PlatformAdmin
          trigger:
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Sup Corp LLC", registration_number: "RN-C16B", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${av1}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
            - call: "GET /advertiser-accounts/${acct}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { av2: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Sup Corp LLC", registration_number: "RN-C16B", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${av2}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { v2: $.data.id, sup: $.data.supersedes_id }
          assert:
            - "err == ERR_STALE_VERSION (decide bumped the account version after ${av1} was captured)"
            - "sup == ${v1} (fresh retry supersedes the REJECTED record)"

      - name: clock_default_is_fixed_at_startup
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "Without any set_current_utc call, a created account's created_at is exactly 2026-09-01T00:00:00.000Z — the server never falls back to wall-clock."
        test_recipe:
          setup: ["Empty database; clock never set."]
          setup_api_calls: []
          trigger:
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Clock Corp", country_code: "US" }
              as: Anonymous
              captures: { ca: $.data.created_at }
          assert:
            - "ca == 2026-09-01T00:00:00.000Z"

