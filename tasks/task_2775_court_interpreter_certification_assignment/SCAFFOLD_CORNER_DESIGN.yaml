  # =========================================================================
  - section: RBAC
    instances:

      - name: every_role_runs_its_own_exclusive_operations_along_one_end_to_end_case
        claim_type: Exclusive operations
        grounds: [roles.ProgramAdmin, roles.CredentialingOfficer, roles.SchedulingCoordinator, roles.FiscalOfficer, roles.QualityReviewer, roles.Interpreter, "validations[priority=2]"]
        distinguishing_aspect: "The six roles are a pipeline, not a hierarchy: one case cannot reach payment or discipline unless every role in turn is allowed to run precisely the operations §1.7 reserves to it. A single case walked from language setup to warrant and sanction exercises at least one exclusive operation of all six roles with no role ever borrowing another's."
        test_recipe:
          setup:
            - "Logical clock starts at its default 2026-08-01T00:00:00Z."
            - "ProgramAdmin (X-User-ID pa-001) publishes the configuration: Language spa, Courthouse Central Justice Center (county CAS, CERTIFIED_VRI, capacity 2, budget 5000000) and an open-ended RateSchedule from 2026-01-01."
            - "CredentialingOfficer (co-001) enrols Ana Reyes, records ethics, then runs the whole credential pipeline: create, two exam attempts and three advances, ending ACTIVE at CERTIFIED."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Central Justice Center", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 2, pay_budget_cents: 5000000 }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
            - call: "POST /rate-schedules"
              payload: { effective_from: "2026-01-01", master_hourly_cents: 10500, certified_hourly_cents: 8750, registered_hourly_cents: 6500, provisional_hourly_cents: 4900, minimum_call_hours: 2.0, travel_mileage_rate_cents: 67.5, travel_free_radius_miles: 30.0, remote_rate_multiplier: 0.90, late_cancellation_hours: 48, late_cancellation_pay_hours: 2.0, rare_premium_low_pct: 0.10, rare_premium_high_pct: 0.15, rare_premium_bracket_cents: 30000 }
              as: ProgramAdmin
              captures: { rs1: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
              captures: { iA: "$.data.id" }
            - call: "POST /interpreters/${iA}/ethics-training"
              payload: { completed_on: "2026-08-01", provider: "AOC Court Interpreter Ethics" }
              as: CredentialingOfficer
              captures: { iA_v2: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${iA}", language_id: "${lang_spa}", target_tier: "CERTIFIED", expected_interpreter_version: "${iA_v2}" }
              as: CredentialingOfficer
              captures: { credA: "$.data.id" }
            - call: "POST /credentials/${credA}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 86, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/exam-attempts"
              payload: { exam_type: "ORAL", score: 74, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${credA}/advance"
              payload: {}
              as: CredentialingOfficer
              captures: { credA_status: "$.data.status" }
          trigger:
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CR-2026-5001", hearing_type: "PLEA", in_custody: true, scheduled_start: "2026-09-15T09:00:00.000Z", scheduled_end: "2026-09-15T10:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { h1: "$.data.id", h1_v1: "$.data.version" }
            - call: "POST /assignments"
              payload: { hearing_id: "${h1}", interpreter_id: "${iA}", delivery_mode: "IN_PERSON", expected_hearing_version: "${h1_v1}" }
              as: SchedulingCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /assignments/${a1}/confirm"
              payload: {}
              as: Interpreter
              captures: { a1_s2: "$.data.service_status" }
            - call: "GET /pay-claims"
              payload: { assignment_id: "${a1}" }
              as: FiscalOfficer
              captures: { pc1: "$.data[0].id", pc1_status: "$.data[0].status", pc1_prov: "$.data[0].provisional_total_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00.000Z" }
              as: ProgramAdmin
              captures: { clock_start: "$.data.current_utc" }
            - call: "POST /assignments/${a1}/check-in"
              payload: {}
              as: Interpreter
              captures: { a1_s3: "$.data.service_status", a1_checkin: "$.data.check_in_utc" }
            - call: "POST /assignments/${a1}/complete"
              payload: { actual_end_utc: "2026-09-15T10:30:00.000Z" }
              as: Interpreter
              captures: { a1_s4: "$.data.service_status" }
            - call: "POST /pay-claims/${pc1}/submit"
              payload: {}
              as: Interpreter
              captures: { pc1_status2: "$.data.status" }
            - call: "POST /pay-claims/${pc1}/approve"
              payload: {}
              as: FiscalOfficer
              captures: { pc1_status3: "$.data.status" }
            - call: "POST /pay-claims/${pc1}/pay"
              payload: { payment_reference: "WARRANT-2026-0091" }
              as: FiscalOfficer
              captures: { pc1_status4: "$.data.status", pc1_ref: "$.data.payment_reference" }
            - call: "POST /complaints"
              payload: { interpreter_id: "${iA}", assignment_id: "${a1}", category: "PROFESSIONALISM", severity: "MINOR", narrative: "Counsel reports the interpreter arrived without a badge." }
              as: QualityReviewer
              captures: { cx: "$.data.id" }
            - call: "POST /complaints/${cx}/review"
              payload: { recommendation: "DISMISS", findings: "Badge was reissued the same morning by court security." }
              as: QualityReviewer
              captures: { cx_s2: "$.data.status" }
            - call: "POST /complaints/${cx}/adjudicate"
              payload: { disposition: "DISMISSED" }
              as: ProgramAdmin
              captures: { cx_s3: "$.data.status" }
            - call: "POST /credentials/${credA}/revoke"
              payload: { reason: "Interpreter relinquished the credential on relocating out of state." }
              as: ProgramAdmin
              captures: { credA_status2: "$.data.status" }
            - call: "POST /ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { sweep_at: "$.data.swept_at" }
          assert:
            - "${credA_status} == ACTIVE — the four CredentialingOfficer-exclusive operations (create, exam-attempts, advance, and later renew) all succeed under co-001"
            - "the three SchedulingCoordinator-exclusive calls (POST /hearings, POST /assignments) return 201 and ${a1_s2} == CONFIRMED after the Interpreter's shared confirm"
            - "${pc1_status} == ENCUMBERED and ${pc1_prov} == 17500 (2.0 minimum-call hours * 8750, no travel, no rare premium)"
            - "${clock_start} == 2026-09-15T09:00:00.000Z, ${a1_checkin} == 2026-09-15T09:00:00.000Z and ${a1_s3} == CHECKED_IN — check-in is Interpreter-exclusive and stamps the clock"
            - "${a1_s4} == COMPLETED and the claim reaches FINALIZED with final_total_cents == 17500 (09:00-10:30 is 1.5 hours, lifted to the 2.0-hour minimum call)"
            - "${pc1_status2} == SUBMITTED under the Interpreter-exclusive submit, ${pc1_status3} == APPROVED and ${pc1_status4} == PAID under the two FiscalOfficer-exclusive calls, with ${pc1_ref} == WARRANT-2026-0091"
            - "${cx_s2} == REVIEWED under the QualityReviewer-exclusive review (filed by qr-001, reviewed by qr-002) and ${cx_s3} == DISMISSED under the ProgramAdmin-exclusive adjudicate"
            - "GET /assignments/${a1} returns compliance_status == UNDER_QUALITY_REVIEW between the complaint and the adjudication, and CLEAR after the dismissal, while service_status stays COMPLETED throughout"
            - "${credA_status2} == REVOKED under the ProgramAdmin-exclusive revoke, and GET /interpreters/${iA} then returns roster_status == INACTIVE with credential_tier == NONE"
            - "${sweep_at} is the current logical clock, proving POST /ops/daily-sweep and POST /_clock/set_current_utc both answer to ProgramAdmin"
            - "GET /pay-claims/${pc1} still returns status == PAID with final_total_cents == 17500 — none of the later discipline touches settled money"

