# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Livestock Transport & Hauling
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: shipper_create_applies_default_shrink_pct
        claim_type: defaults
        grounds:
          - "entities.Shipper.fields.default_shrink_allowance_pct"
        distinguishing_aspect: "Omitting default_shrink_allowance_pct stores the documented default 2.0; system fields id/created_at/version==1 are server-generated."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
          trigger:
            - { call: "GET /haul/shippers/${sh}", as: Any }
          assert:
            - "Shipper.${sh}.default_shrink_allowance_pct == 2.0"
            - "Shipper.${sh}.version == 1 and created_at is non-null"

      - name: shipper_create_missing_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Shipper.fields.name"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST without required name fails 400 ERR_INVALID_REQUEST; no row persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /haul/shippers", payload: {}, as: CarrierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"
            - "GET /haul/shippers returns 0 rows"

      - name: driver_create_duplicate_license_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Driver.fields.license_no"
          - "validations[priority=29]"
          - "errors[ERR_DUPLICATE_LICENSE_NO]"
        distinguishing_aspect: "Second driver with an existing license_no is rejected 409 ERR_DUPLICATE_LICENSE_NO."
        test_recipe:
          setup: ["driver CDL-X1 exists"]
          setup_api_calls:
            - { call: "POST /haul/drivers", payload: { name: "Ann", license_no: "CDL-X1" }, as: CarrierAdmin }
          trigger:
            - { call: "POST /haul/drivers", payload: { name: "Bob", license_no: "CDL-X1" }, as: CarrierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_LICENSE_NO (http 409)"

      - name: trailer_create_initializes_dirty_with_compartments
        claim_type: creation_side_effects
        grounds:
          - "entities.Trailer.fields.washout_status"
          - "entities.TrailerCompartment.fields.trailer_id"
        distinguishing_aspect: "New trailer starts washout_status DIRTY (must be washed before first load) and atomically creates its compartment rows ordered by compartment_index ASC."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /haul/trailers", payload: { trailer_no: "T-C1", max_gross_weight_lb: 50000, compartments: [ { compartment_index: 2, max_head_count: 10, max_weight_lb: 20000 }, { compartment_index: 1, max_head_count: 20, max_weight_lb: 26000 } ] }, as: CarrierAdmin, captures: { tr: $.data.id } }
          trigger:
            - { call: "GET /haul/trailers/${tr}", as: Any }
            - { call: "GET /haul/trailers/${tr}/compartments", as: Any }
          assert:
            - "Trailer.${tr}.washout_status == DIRTY and last_washed_at == null and washout_valid_until == null"
            - "GET compartments returns 2 rows, first with compartment_index == 1 and max_head_count == 20"
            - "Both compartments have occupied_head_count == 0 and occupied_weight_lb == 0"

      - name: weight_ticket_net_weight_computed
        claim_type: computed_fields
        grounds:
          - "entities.WeightTicket.fields.net_weight_lb"
        distinguishing_aspect: "net_weight_lb is server-computed as gross_lb - tare_lb (46000 - 6000 = 40000)."
        test_recipe:
          setup: ["shipper + DRAFT load exist (ORIGIN tickets allowed in DRAFT)"]
          setup_api_calls:
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 40, declared_weight_lb: 40000, origin: "A", destination: "B", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 10, rate_per_loaded_mile_cents: 300, loaded_miles: 500 }, as: Dispatcher, captures: { ld: $.data.id } }
          trigger:
            - { call: "POST /haul/loads/${ld}/weight-tickets", payload: { ticket_type: "ORIGIN", gross_lb: 46000, tare_lb: 6000, weighed_at: "2026-08-01T00:00:00Z" }, as: ConsigneeAgent, captures: { tk: $.data.id } }
          assert:
            - "WeightTicket.${tk}.net_weight_lb == 40000"

      - name: weight_ticket_gross_not_greater_than_tare_rejected
        claim_type: violation_to_error
        grounds:
          - "entities.WeightTicket.fields.gross_lb"
          - "errors[ERR_INVALID_TICKET_WEIGHT]"
        distinguishing_aspect: "gross_lb == tare_lb (not strictly greater) is rejected 422 ERR_INVALID_TICKET_WEIGHT."
        test_recipe:
          setup: ["shipper + DRAFT load exist"]
          setup_api_calls:
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 40, declared_weight_lb: 40000, origin: "A", destination: "B", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 10, rate_per_loaded_mile_cents: 300, loaded_miles: 500 }, as: Dispatcher, captures: { ld: $.data.id } }
          trigger:
            - { call: "POST /haul/loads/${ld}/weight-tickets", payload: { ticket_type: "ORIGIN", gross_lb: 6000, tare_lb: 6000, weighed_at: "2026-08-01T00:00:00Z" }, as: ConsigneeAgent, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_TICKET_WEIGHT (http 422)"

      - name: allocation_weight_rounds_per_allocation
        claim_type: computed_fields
        grounds:
          - "entities.CompartmentAllocation.fields.weight_lb"
          - "calculations.allocation_weight_and_load_totals"
        distinguishing_aspect: "3 head x 333.33 lb avg = 999.99 lb rounds half-up per allocation to 1000 lb; the load total sums the rounded 1000, not a re-rounded 999.99."
        test_recipe:
          setup: ["shipper, trailer with compartment c1 (10 head / 50000 lb), DRAFT load 40/40000"]
          setup_api_calls:
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/trailers", payload: { trailer_no: "T-C7", max_gross_weight_lb: 50000, compartments: [ { compartment_index: 1, max_head_count: 10, max_weight_lb: 50000 } ] }, as: CarrierAdmin, captures: { tr: $.data.id } }
            - { call: "GET /haul/trailers/${tr}/compartments", as: Any, captures: { c1: "$.data[0].id" } }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 40, declared_weight_lb: 40000, origin: "A", destination: "B", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 10, rate_per_loaded_mile_cents: 300, loaded_miles: 500 }, as: Dispatcher, captures: { ld: $.data.id, ld_v: $.data.version } }
          trigger:
            - { call: "POST /haul/loads/${ld}/allocations", payload: { trailer_compartment_id: "${c1}", head_count: 3, avg_weight_lb: 333.33, expected_load_version: "${ld_v}" }, as: Dispatcher, captures: { al: $.data.id } }
          assert:
            - "CompartmentAllocation.${al}.weight_lb == 1000"
            - "Load.${ld}.allocated_weight_lb == 1000 and allocated_head_count == 3"

      - name: shipper_create_client_supplied_id_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Shipper"
        distinguishing_aspect: "Client-supplied id/version fields are ignored; the server mints a UUID id != client value and version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /haul/shippers", payload: { id: "client-1", version: 99, name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id, sh_v: $.data.version } }
          assert:
            - "Shipper id ${sh} != 'client-1' and version == 1 (client input ignored)"

      - name: get_load_not_found_returns_error_envelope
        claim_type: not_found
        grounds:
          - "errors[ERR_LOAD_NOT_FOUND]"
          - "response_envelope"
        distinguishing_aspect: "GET with a non-existent UUID returns 404 ERR_LOAD_NOT_FOUND inside the fixed error envelope (response_type error, data.error_id, meta.api_request_id)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /haul/loads/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LOAD_NOT_FOUND (http 404)"
            - "envelope has response_type == 'error', data.message non-empty, meta.api_request_id non-empty"

      - name: washout_event_is_append_only_without_version
        claim_type: immutability
        grounds:
          - "entities.WashoutEvent"
        distinguishing_aspect: "WashoutEvent declares common_fields false: the response carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["trailer exists; clock 2026-08-01T01:00:00Z"]
          setup_api_calls:
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/trailers", payload: { trailer_no: "T-C10", max_gross_weight_lb: 50000, compartments: [ { compartment_index: 1, max_head_count: 20, max_weight_lb: 26000 } ] }, as: CarrierAdmin, captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /haul/trailers/${tr}/washouts", payload: { washed_at: "2026-08-01T00:30:00Z", method: "STEAM" }, as: WashoutOperator, captures: { w: $.data.id } }
          assert:
            - "WashoutEvent.${w} response has id and created_at and no version key"
            - "GET /haul/trailers/${tr}/washouts returns exactly 1 row with method == STEAM"

  - section: state_machines
    instances:
      - name: load_created_in_draft_initial_state
        claim_type: initial_state
        grounds:
          - "state_machines.Load"
        distinguishing_aspect: "A new load starts DRAFT with zero allocations and null driver/trailer."
        test_recipe:
          setup: ["shipper exists"]
          setup_api_calls:
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
          trigger:
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 40, declared_weight_lb: 40000, origin: "A", destination: "B", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 10, rate_per_loaded_mile_cents: 300, loaded_miles: 500 }, as: Dispatcher, captures: { ld: $.data.id } }
          assert:
            - "Load.${ld}.status == DRAFT, allocated_head_count == 0, driver_id == null, trailer_id == null, is_backhaul == false"

      - name: finalize_plan_from_planned_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Load.DRAFT_to_PLANNED"
          - "errors[ERR_LOAD_NOT_DRAFT]"
        distinguishing_aspect: "finalize-plan is only legal from DRAFT; a second finalize on the PLANNED load fails 409 ERR_LOAD_NOT_DRAFT with no side effects."
        test_recipe:
          setup: ["load PLANNED (40 head on one compartment)"]
          setup_api_calls:
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/trailers", payload: { trailer_no: "T-S2", max_gross_weight_lb: 50000, compartments: [ { compartment_index: 1, max_head_count: 40, max_weight_lb: 45000 } ] }, as: CarrierAdmin, captures: { tr: $.data.id } }
            - { call: "GET /haul/trailers/${tr}/compartments", as: Any, captures: { c1: "$.data[0].id" } }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 40, declared_weight_lb: 40000, origin: "A", destination: "B", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 10, rate_per_loaded_mile_cents: 300, loaded_miles: 500 }, as: Dispatcher, captures: { ld: $.data.id, ld_v: $.data.version } }
            - { call: "POST /haul/loads/${ld}/allocations", payload: { trailer_compartment_id: "${c1}", head_count: 40, avg_weight_lb: 1000, expected_load_version: "${ld_v}" }, as: Dispatcher }
            - { call: "POST /haul/loads/${ld}/finalize-plan", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /haul/loads/${ld}/finalize-plan", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LOAD_NOT_DRAFT (http 409)"
            - "Load.${ld}.status == PLANNED (unchanged)"

      - name: depart_from_weather_hold_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Load.ASSIGNED_to_IN_TRANSIT"
          - "errors[ERR_LOAD_NOT_ASSIGNED]"
        distinguishing_aspect: "A load held before departure is in WEATHER_HOLD, so depart fails 409 ERR_LOAD_NOT_ASSIGNED until the hold is released."
        test_recipe:
          setup: ["standard cattle load ASSIGNED; weather hold placed at 2026-08-02T07:00 -> WEATHER_HOLD"]
          setup_api_calls:
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/drivers", payload: { name: "Dan", license_no: "CDL-S3" }, as: CarrierAdmin, captures: { dr: $.data.id } }
            - { call: "POST /haul/trailers", payload: { trailer_no: "T-S3", max_gross_weight_lb: 50000, compartments: [ { compartment_index: 1, max_head_count: 40, max_weight_lb: 45000 } ] }, as: CarrierAdmin, captures: { tr: $.data.id } }
            - { call: "GET /haul/trailers/${tr}/compartments", as: Any, captures: { c1: "$.data[0].id" } }
            - { call: "POST /haul/trailers/${tr}/washouts", payload: { washed_at: "2026-08-01T00:30:00Z", method: "HIGH_PRESSURE" }, as: WashoutOperator }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 40, declared_weight_lb: 40000, origin: "A", destination: "B", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 10, rate_per_loaded_mile_cents: 300, loaded_miles: 500 }, as: Dispatcher, captures: { ld: $.data.id, ld_v: $.data.version } }
            - { call: "POST /haul/loads/${ld}/allocations", payload: { trailer_compartment_id: "${c1}", head_count: 40, avg_weight_lb: 1000, expected_load_version: "${ld_v}" }, as: Dispatcher }
            - { call: "POST /haul/loads/${ld}/finalize-plan", payload: {}, as: Dispatcher }
            - { call: "POST /haul/loads/${ld}/health-papers", payload: { cert_number: "CVI-S3", species: "CATTLE", head_count_listed: 40, issued_at: "2026-07-30T00:00:00Z", expires_at: "2026-08-29T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { hp: $.data.id } }
            - { call: "POST /haul/health-papers/${hp}/verify", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${ld}/brand-inspections", payload: { inspection_no: "BI-S3", inspected_at: "2026-08-01T06:30:00Z", brand_owner: "Ranchco", head_count_inspected: 40 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { bi: $.data.id } }
            - { call: "POST /haul/brand-inspections/${bi}/verify", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/loads/${ld}/verify-paperwork", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "GET /haul/drivers/${dr}", as: Any, captures: { dr_v: $.data.version } }
            - { call: "POST /haul/loads/${ld}/assign-driver", payload: { driver_id: "${dr}", expected_driver_version: "${dr_v}" }, as: Dispatcher }
            - { call: "POST /haul/loads/${ld}/weather-holds", payload: { hold_type: "HEAT", temperature_f: 97 }, as: Dispatcher }
          trigger:
            - { call: "POST /haul/loads/${ld}/depart", payload: { origin_temperature_f: 70 }, as: Driver, as_user_id: "${dr}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LOAD_NOT_ASSIGNED (http 409)"
            - "Load.${ld}.status == WEATHER_HOLD (unchanged)"

      - name: cancel_from_delivered_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Load.ARRIVED_to_DELIVERED"
          - "errors[ERR_LOAD_NOT_CANCELLABLE]"
        distinguishing_aspect: "DELIVERED is terminal for cancel; attempt fails 409 ERR_LOAD_NOT_CANCELLABLE and settlement stays PENDING."
        test_recipe:
          setup: ["standard cattle load delivered at 2026-08-02T16:30 (net 40000)"]
          setup_api_calls:
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/drivers", payload: { name: "Dan", license_no: "CDL-S4" }, as: CarrierAdmin, captures: { dr: $.data.id } }
            - { call: "POST /haul/trailers", payload: { trailer_no: "T-S4", max_gross_weight_lb: 50000, compartments: [ { compartment_index: 1, max_head_count: 40, max_weight_lb: 45000 } ] }, as: CarrierAdmin, captures: { tr: $.data.id } }
            - { call: "GET /haul/trailers/${tr}/compartments", as: Any, captures: { c1: "$.data[0].id" } }
            - { call: "POST /haul/trailers/${tr}/washouts", payload: { washed_at: "2026-08-01T00:30:00Z", method: "HIGH_PRESSURE" }, as: WashoutOperator }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 40, declared_weight_lb: 40000, origin: "A", destination: "B", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 10, rate_per_loaded_mile_cents: 300, loaded_miles: 500 }, as: Dispatcher, captures: { ld: $.data.id, ld_v: $.data.version } }
            - { call: "POST /haul/loads/${ld}/allocations", payload: { trailer_compartment_id: "${c1}", head_count: 40, avg_weight_lb: 1000, expected_load_version: "${ld_v}" }, as: Dispatcher }
            - { call: "POST /haul/loads/${ld}/finalize-plan", payload: {}, as: Dispatcher }
            - { call: "POST /haul/loads/${ld}/health-papers", payload: { cert_number: "CVI-S4", species: "CATTLE", head_count_listed: 40, issued_at: "2026-07-30T00:00:00Z", expires_at: "2026-08-29T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { hp: $.data.id } }
            - { call: "POST /haul/health-papers/${hp}/verify", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${ld}/brand-inspections", payload: { inspection_no: "BI-S4", inspected_at: "2026-08-01T06:30:00Z", brand_owner: "Ranchco", head_count_inspected: 40 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { bi: $.data.id } }
            - { call: "POST /haul/brand-inspections/${bi}/verify", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /haul/loads/${ld}/verify-paperwork", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "GET /haul/drivers/${dr}", as: Any, captures: { dr_v: $.data.version } }
            - { call: "POST /haul/loads/${ld}/assign-driver", payload: { driver_id: "${dr}", expected_driver_version: "${dr_v}" }, as: Dispatcher }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${ld}/depart", payload: { origin_temperature_f: 70 }, as: Driver, as_user_id: "${dr}" }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T16:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${ld}/arrive", payload: {}, as: Driver, as_user_id: "${dr}" }
            - { call: "POST /haul/loads/${ld}/weight-tickets", payload: { ticket_type: "DELIVERY", gross_lb: 46000, tare_lb: 6000, weighed_at: "2026-08-02T15:30:00Z" }, as: ConsigneeAgent }
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T16:30:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/loads/${ld}/deliver", payload: {}, as: ConsigneeAgent }
          trigger:
            - { call: "POST /haul/loads/${ld}/cancel", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LOAD_NOT_CANCELLABLE (http 409)"
            - "Load.${ld}.status == DELIVERED (unchanged)"

      - name: cancel_from_assigned_releases_without_dirtying_trailer
        claim_type: side_effect_conditional
        grounds:
          - "state_machines.Load.ASSIGNED_to_CANCELLED"
          - "state_machines.CompartmentAllocation.ACTIVE_to_RELEASED"
        distinguishing_aspect: "Cancel from ASSIGNED releases allocations with reason CANCELLED, clears the driver, frees the trailer window, but — unlike delivery — does NOT dirty the trailer (conditional cascade on release reason)."
        test_recipe:
          setup: ["standard cattle load ASSIGNED (trailer washed, still CLEAN)"]
          setup_api_calls:
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/drivers", payload: { name: "Dan", license_no: "CDL-S5" }, as: CarrierAdmin, captures: { dr: $.data.id } }
            - { call: "POST /haul/trailers", payload: { trailer_no: "T-S5", max_gross_weight_lb: 50000, compartments: [ { compartment_index: 1, max_head_count: 40, max_weight_lb: 45000 } ] }, as: CarrierAdmin, captures: { tr: $.data.id } }
            - { call: "GET /haul/trailers/${tr}/compartments", as: Any, captures: { c1: "$.data[0].id" } }
            - { call: "POST /haul/trailers/${tr}/washouts", payload: { washed_at: "2026-08-01T00:30:00Z", method: "HIGH_PRESSURE" }, as: WashoutOperator }
