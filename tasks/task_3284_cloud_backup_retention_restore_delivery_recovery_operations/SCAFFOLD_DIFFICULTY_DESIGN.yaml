              payload: {}
              as: RetentionOfficer
              captures: { rcr_c_until: $.data.cooling_off_until_utc }
          trigger:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T23:59:59Z" }
              as: SystemOperator
            - call: "POST /backup-provider/retention-change-requests/${rcr_c_id}/apply"
              payload: {}
              as: RetentionOfficer
              captures: { early_error: $.data.error_id }
            - call: "GET /backup-provider/backup-groups/${grp_p_id}"
              payload: {}
              as: RetentionOfficer
              captures: { grp_ret_before: $.data.group_retention_days }
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:00Z" }
