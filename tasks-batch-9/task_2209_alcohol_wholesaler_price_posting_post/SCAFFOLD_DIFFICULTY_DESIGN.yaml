          The metric probed is Wholesaler.off_posted_violation_count against TIER_1_MAX_PRIOR, read through
          POST /compliance-audits/{id}/assess: a prior count of exactly 2 must still yield tier_multiplier 1.00 while
          a prior count of 3 yields 1.50, so the November audit assesses 4000 and the December audit 12000 on bases of
          4000 and 8000. An exclusive comparison at the first tier boundary would charge the November audit 6000.
