      - call: POST /prescriptions
        payload:
          customer_id: ${cust_id}
          product_id: ${p1_id}
          prescriber_id: ${presc_id}
          capture_mode: UPLOAD
          document_reference: scan-1
          issue_date: '2026-07-01'
