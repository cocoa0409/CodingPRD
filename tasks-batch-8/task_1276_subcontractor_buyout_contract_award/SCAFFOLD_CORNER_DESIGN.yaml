              captures: { lv: $.data.leveled_value_cents }
          assert:
            - "lv == 9000000 (no negotiation round exists, so no allowance adjustment applies)"

      - name: award_does_not_autopick_low_bidder
        claim_type: correct_result
        grounds: [calculations.bid_leveling_selection, state_machines.Bid.PLACED_to_AWARDED]
        distinguishing_aspect: "The award endpoint awards the caller-named bid only: awarding the 9000000 bid while an 8500000 bid is PLACED succeeds (200) — the selector defines eligibility, not forced lowest-price award."
        test_recipe:
          setup: ["package UNDER_LEVELING; bid LOW 8500000 PLACED; bid HIGH 9000000 PLACED"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-C3", project_number: "C3", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "C3-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Q-LOW", contact_email: "ql@x.com", base_bid_cents: 8500000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_low: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Q-HIGH", contact_email: "qh@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_high: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
          trigger:
            - call: "POST /trade-packages/${tp_id}/bids/${bid_high}/award"
              as: BuyoutLead
              captures: { high_status: $.data.status }
            - call: "GET /bids/${bid_low}"
              as: BuyoutLead
              captures: { low_status: $.data.status }
          assert:
            - "high_status == AWARDED (explicit award of the higher bid succeeds)"
            - "low_status == PLACED (losing bid untouched)"

      - name: buyout_posture_target_boundary_favorable_vs_neutral
        claim_type: correct_result
        grounds: [calculations.buyout_savings_vs_estimate]
        distinguishing_aspect: "Posture boundary at exactly target: FINAL basis, savings == target 500000 -> FAVORABLE (inclusive >=), savings == 499999 (one cent below) -> NEUTRAL. Two sibling packages differ by exactly one cent of awarded value."
