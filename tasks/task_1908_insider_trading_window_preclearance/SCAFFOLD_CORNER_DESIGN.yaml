          rationale: "Dual-failure priority asserted by the named §1.8 instance."

      - name: safety_vs_temporal_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=9]"]
        excluded_because:
          difficulty_instance: restricted_security_beats_blackout_on_create
          rationale: "Dual-failure priority asserted by the named §1.8 instance."

      - name: overlapping_approval_lane
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_OVERLAPPING_APPROVAL]"]
        excluded_because:
          difficulty_instance: approval_lane_closed_interval_containment
          rationale: "Closed-interval containment, including the endpoint-touch boundary, asserted by the named §1.8 instance."

      - name: duplicate_quarterly_window
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_DUPLICATE_QUARTER_WINDOW]"]
        excluded_because:
          difficulty_instance: quarterly_window_half_open_adjacency
          rationale: "Overlap rejection and adjacency acceptance asserted by the named §1.8 instance."

