        grounds:
          - roles.NetworkAdmin.identity
          - roles.PlatformAdmin.identity
          - roles.PracticeAdmin.identity
        distinguishing_aspect: "Multi-role memberships are independent: the same string is a valid NetworkAdmin user id and a valid PracticeAdmin user id, but PlatformAdmin's identity is opaque and borrows nothing from practice ids — a PlatformAdmin id does not become a practice's own X-User-ID for ownership checks."
        test_recipe:
          setup:
            - "Network N and practice P exist; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
