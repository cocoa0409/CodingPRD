  - { method: POST, path: "/daily-reports/{id}/lock", description: "APPROVED -> LOCKED (terminal; retention finalized)", roles: [SystemAdmin], code: 200, input: [], output: DailyReport, side_effects: ["calc_retention_release finalized", "increments DailyReport.version by 1"] }

