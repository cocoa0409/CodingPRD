      - name: nomination_create_rejects_role_then_shape_then_lookup_then_ownership_in_turn
        claim_type: priority_ordering
        grounds:
          - validations.priority_2_ERR_UNAUTHORIZED
          - validations.priority_3_ERR_INVALID_REQUEST
          - validations.priority_5_ERR_CONTRACT_NOT_FOUND
          - validations.priority_6_ERR_CONTRACT_NOT_OWNED
          - errors.ERR_CONTRACT_NOT_OWNED
        distinguishing_aspect: |
          A single request carrying FOUR defects at once — wrong role, an unparseable direction, an
          unresolvable contract_id and someone else's contract — must be reported strictly by priority:
          ERR_UNAUTHORIZED (403), then ERR_INVALID_REQUEST (400), then ERR_CONTRACT_NOT_FOUND (404),
          then ERR_CONTRACT_NOT_OWNED (403). The last two share nothing but the shape of the mistake,
          and the ownership check is what distinguishes a foreign contract (403) from a nonexistent one
          (404) — an implementation that looks up ownership first leaks the existence of other
          shippers' contracts.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1; shippers NORTHLINE and SOUTHLINE, each with an ACTIVE FIRM contract on the field (CN-1 for NORTHLINE, CS-2 for SOUTHLINE)."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Southline Gas Trading", duns_number: "987654321", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s2: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s2}", storage_field_id: "${f1}", contract_code: "CS-2", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c2: $.data.id }
            - call: "POST /storage-contracts/${c2}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c2}"
              payload: {}
              as: SchedulingCoordinator
              captures: { cv2: $.data.version }
          trigger:
            - call: "POST /nominations"
              payload: { contract_id: "00000000-0000-4000-8000-000000000000", gas_day: "2026-08-20", direction: "SIDEWAYS", nominated_volume_dth: 80000, expected_contract_version: "${cv2}" }
              as: FieldOperator
              captures: { e1: $.data.error_id }
            - call: "POST /nominations"
              payload: { contract_id: "00000000-0000-4000-8000-000000000000", gas_day: "2026-08-20", direction: "SIDEWAYS", nominated_volume_dth: 80000, expected_contract_version: "${cv2}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { e2: $.data.error_id }
            - call: "POST /nominations"
              payload: { contract_id: "00000000-0000-4000-8000-000000000000", gas_day: "2026-08-20", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv2}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { e3: $.data.error_id }
            - call: "POST /nominations"
              payload: { contract_id: "${c2}", gas_day: "2026-08-20", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv2}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { e4: $.data.error_id }
            - call: "POST /nominations"
              payload: { contract_id: "${c2}", gas_day: "2026-08-20", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv2}" }
              as: Shipper
              as_user_id: "${s2}"
              captures: { n1: $.data.id }
          assert:
            - "${e1} == ERR_UNAUTHORIZED with HTTP 403 — FieldOperator is not in the endpoint's roles, so nothing about the body is examined"
            - "${e2} == ERR_INVALID_REQUEST with HTTP 400 — the unknown direction enum outranks the unresolvable contract_id"
            - "${e3} == ERR_CONTRACT_NOT_FOUND with HTTP 404 for the bogus id 00000000-0000-4000-8000-000000000000"
            - "${e4} == ERR_CONTRACT_NOT_OWNED with HTTP 403 — the contract exists but belongs to SOUTHLINE, and the code differs from the 404 above"
            - "the owner's identical request returns HTTP 201 with Nomination.${n1}.contract_id == ${c2} and status == DRAFT"
            - "every error body carries error_id and message under data, and no Nomination row exists for the four refused calls (GET /nominations as ${s2} with limit 100 returns total_count == 1)"

      - name: ticket_creation_reports_well_integrity_ahead_of_well_availability
        claim_type: priority_ordering
        grounds:
          - validations.priority_11_ERR_WELL_INTEGRITY_FAILED
          - validations.priority_12_ERR_WELL_NOT_IN_SERVICE
          - errors.ERR_WELL_INTEGRITY_FAILED
          - errors.ERR_WELL_NOT_IN_SERVICE
          - entities.Well.fields.well_type
        distinguishing_aspect: |
          Priority 12 covers two unrelated disqualifications — an IN_SERVICE well of the wrong TYPE and
          a well that is not in service at all — while priority 11 covers integrity. The failed well is
          simultaneously SHUT_IN and MIT_FAILED with an OPEN remediation program, so it violates 11 and
          12 at once and must report ERR_WELL_INTEGRITY_FAILED; the OBSERVATION well violates only 12
          and reports ERR_WELL_NOT_IN_SERVICE even though it is perfectly healthy and IN_SERVICE.
        test_recipe:
          setup:
            - "Field F_MINI with three wells: MINI-1 (healthy INJECTION_WITHDRAWAL), MINI-OBS (OBSERVATION, IN_SERVICE) and MINI-2 (INJECTION_WITHDRAWAL)."
            - "Shipper NORTHLINE with ACTIVE FIRM contract CN-1; three INJECTION nominations of 10000 Dth on gas days 2026-08-20, 2026-08-21 and 2026-08-22, all confirmed in full BEFORE the integrity failure."
            - "MINI-2 then fails a PRESSURE_TEST recorded by eng-a at clock 2026-08-02T07:00:00Z, so it is SHUT_IN / MIT_FAILED with an OPEN RemediationProgram."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
