      - name: reserve_with_a_discontinued_variant_returns_variant_not_sellable
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "entities.Variant.fields.status", "errors[ERR_VARIANT_NOT_SELLABLE]"]
        distinguishing_aspect: "A variant discontinued AFTER the draft was priced blocks the reserve with ERR_VARIANT_NOT_SELLABLE (409); the check is on Variant.status, distinct from launch_status gating."
        test_recipe:
          setup: ["DRAFT order for 1 unit; the variant is then PATCHed to DISCONTINUED."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
