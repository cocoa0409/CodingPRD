scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: pro_forma_capital_dual_basis_diverges_on_identical_transaction_inputs
        grounds:
          - calculations.pro_forma_capital_ratios
          - entities.ProFormaCapitalSchedule.fields.capital_adequacy_flag
          - concurrency_rules[pro-forma-schedule-create-stale-application]
        distinguishing_aspect: |
          On the capital-accounting domain (ProFormaCapitalSchedule over two Institutions), the identical
          transaction adjustments produce REGULATORY_ADJUSTED cet1 7.74 / leverage 6.52 / WELL_CAPITALIZED
          but INTERNAL_STRESS cet1 5.77 / leverage 5.02 / ADEQUATELY_CAPITALIZED, because the regulatory
          basis caps the DTA deduction at 10% of post-intangible CET1 and ignores the AOCI markdown while
          the stress basis deducts the full DTA plus a 2.5% credit mark and inflates the target's RWA by 5%.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "acquirer Northbay National Bank with CET1 200,000,000, tier 1 210,000,000, RWA 2,000,000,000, average total assets 2,600,000,000 and total loans 1,500,000,000"
            - "target Harbor Community Bank with CET1 60,000,000, tier 1 62,000,000, RWA 700,000,000, average total assets 800,000,000 and total loans 520,000,000"
            - "a DRAFT MergerApplication between them at version 1"
            - "a CURRENT REGULATORY_ADJUSTED schedule built from goodwill 40,000,000, CDI 10,000,000, AOCI markdown 25,000,000, DTA 12,000,000, transaction costs 5,000,000 and cash consideration 20,000,000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Harbor Community Bank", charter_type: "STATE_NONMEMBER", primary_regulator: "FDIC", cet1_capital_usd: 60000000, tier1_capital_usd: 62000000, total_capital_usd: 70000000, risk_weighted_assets_usd: 700000000, average_total_assets_usd: 800000000, total_loans_usd: 520000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { tgt_id: "$.data.id" }
            - call: "POST /merger-applications"
              payload: { acquirer_id: "${acq_id}", target_id: "${tgt_id}", structure: "STATUTORY_MERGER", consideration_type: "MIXED", total_consideration_usd: 250000000, officer_experience_score: 72, risk_management_score: 68, compliance_history_score: 67, integration_readiness_score: 73 }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { app_id: "$.data.id", app_v1: "$.data.version" }
            - call: "POST /pro-forma-schedules"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", basis: "REGULATORY_ADJUSTED", goodwill_created_usd: 40000000, core_deposit_intangible_usd: 10000000, aoci_markdown_usd: 25000000, deferred_tax_asset_usd: 12000000, transaction_costs_usd: 5000000, cash_consideration_usd: 20000000 }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { sch_reg_id: "$.data.id" }
            - call: "GET /merger-applications/${app_id}"
              payload: {}
              as: Filer
              as_user_id: "${acq_id}"
              captures: { app_v2: "$.data.version" }
          trigger:
            - call: "POST /pro-forma-schedules"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v2}", basis: "INTERNAL_STRESS", goodwill_created_usd: 40000000, core_deposit_intangible_usd: 10000000, aoci_markdown_usd: 25000000, deferred_tax_asset_usd: 12000000, transaction_costs_usd: 5000000, cash_consideration_usd: 20000000 }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { sch_stress_id: "$.data.id" }
          assert:
            - "ProFormaCapitalSchedule.${sch_reg_id}.pro_forma_cet1_ratio_pct == 7.74"
            - "ProFormaCapitalSchedule.${sch_reg_id}.pro_forma_tier1_leverage_pct == 6.52"
            - "ProFormaCapitalSchedule.${sch_reg_id}.capital_adequacy_flag == WELL_CAPITALIZED"
            - "ProFormaCapitalSchedule.${sch_stress_id}.pro_forma_cet1_ratio_pct == 5.77"
            - "ProFormaCapitalSchedule.${sch_stress_id}.pro_forma_tier1_leverage_pct == 5.02"
            - "ProFormaCapitalSchedule.${sch_stress_id}.capital_adequacy_flag == ADEQUATELY_CAPITALIZED"
            - "ProFormaCapitalSchedule.${sch_reg_id}.status == CURRENT (a different basis never supersedes)"
            - "ProFormaCapitalSchedule.${sch_stress_id}.status == CURRENT"
            - "MergerApplication.${app_id}.version == 3"

      - name: commitment_fulfillment_dual_basis_flips_review_outcome
        grounds:
          - calculations.commitment_fulfillment
          - entities.CommitmentPerformanceReport.fields.alternate_fulfillment_pct
          - state_machines.CommitmentPerformanceReport.FILED_to_ACCEPTED
        distinguishing_aspect: |
          On the community-commitment domain (CommitmentPerformanceReport over a CommunityBenefitsPlan) the
          identical second-quarter report yields CUMULATIVE_TO_DATE 97.19 (ACCEPTED) but ANNUAL_PRO_RATA
          76.53 (would be DEFICIENT); the plan's stored measurement_basis picks the governing number and the
          other is retained as alternate_fulfillment_pct. This is a monetary-fulfilment subject, not the
          capital-ratio subject of the first instance.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an application UNDER_REVIEW with a WELL_CAPITALIZED CURRENT REGULATORY_ADJUSTED schedule"
            - "an EXECUTED CommunityBenefitsPlan with measurement_basis CUMULATIVE_TO_DATE, term_years 3, total_committed_usd 392,000,000 and quarterly_target_total_usd 32,666,666"
            - "report 2027Q1 already ACCEPTED with credited_usd 38,500,000, leaving plan.credited_to_date_usd 38,500,000 and filed_report_count 1"
            - "report 2027Q2 FILED with achieved MORTGAGE_LENDING 20,000,000 and SMALL_BUSINESS_LENDING 5,000,000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Harbor Community Bank", charter_type: "STATE_NONMEMBER", primary_regulator: "FDIC", cet1_capital_usd: 60000000, tier1_capital_usd: 62000000, total_capital_usd: 70000000, risk_weighted_assets_usd: 700000000, average_total_assets_usd: 800000000, total_loans_usd: 520000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { tgt_id: "$.data.id" }
            - call: "POST /merger-applications"
              payload: { acquirer_id: "${acq_id}", target_id: "${tgt_id}", structure: "STATUTORY_MERGER", consideration_type: "MIXED", total_consideration_usd: 250000000, officer_experience_score: 72, risk_management_score: 68, compliance_history_score: 67, integration_readiness_score: 73 }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { app_id: "$.data.id", app_v1: "$.data.version" }
            - call: "POST /pro-forma-schedules"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", basis: "REGULATORY_ADJUSTED", goodwill_created_usd: 40000000, core_deposit_intangible_usd: 10000000, aoci_markdown_usd: 25000000, deferred_tax_asset_usd: 12000000, transaction_costs_usd: 5000000, cash_consideration_usd: 20000000 }
              as: Filer
              as_user_id: "${acq_id}"
            - call: "POST /merger-applications/${app_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${acq_id}"
            - call: "POST /merger-applications/${app_id}/accept"
              payload: {}
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { app_v3: "$.data.version" }
            - call: "POST /community-benefits-plans"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v3}", term_years: 3, measurement_basis: "CUMULATIVE_TO_DATE" }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { plan_id: "$.data.id" }
            - call: "POST /commitment-line-items"
              payload: { plan_id: "${plan_id}", category: "MORTGAGE_LENDING", committed_usd: 250000000 }
              as: Filer
              as_user_id: "${acq_id}"
            - call: "POST /commitment-line-items"
              payload: { plan_id: "${plan_id}", category: "SMALL_BUSINESS_LENDING", committed_usd: 120000000 }
              as: Filer
              as_user_id: "${acq_id}"
            - call: "POST /commitment-line-items"
              payload: { plan_id: "${plan_id}", category: "PHILANTHROPY", committed_usd: 7000000 }
              as: Filer
              as_user_id: "${acq_id}"
            - call: "POST /commitment-line-items"
              payload: { plan_id: "${plan_id}", category: "CDFI_INVESTMENT", committed_usd: 15000000 }
              as: Filer
              as_user_id: "${acq_id}"
            - call: "POST /community-benefits-plans/${plan_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${acq_id}"
            - call: "POST /performance-reports"
              payload: { plan_id: "${plan_id}", period_label: "2027Q1", period_index: 1, achieved_by_category: { MORTGAGE_LENDING: 30000000, SMALL_BUSINESS_LENDING: 8000000, PHILANTHROPY: 500000, BRANCH_RETENTION: 1000000 } }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /performance-reports/${r1_id}/review"
              payload: {}
              as: ComplianceMonitor
              as_user_id: "monitor-1"
            - call: "POST /performance-reports"
              payload: { plan_id: "${plan_id}", period_label: "2027Q2", period_index: 2, achieved_by_category: { MORTGAGE_LENDING: 20000000, SMALL_BUSINESS_LENDING: 5000000 } }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { r2_id: "$.data.id" }
          trigger:
            - call: "POST /performance-reports/${r2_id}/review"
              payload: {}
              as: ComplianceMonitor
              as_user_id: "monitor-1"
          assert:
            - "CommunityBenefitsPlan.${plan_id}.total_committed_usd == 392000000"
            - "CommunityBenefitsPlan.${plan_id}.quarterly_target_total_usd == 32666666"
            - "CommitmentPerformanceReport.${r2_id}.credited_usd == 25000000"
            - "CommitmentPerformanceReport.${r2_id}.measurement_basis == CUMULATIVE_TO_DATE"
            - "CommitmentPerformanceReport.${r2_id}.fulfillment_pct == 97.19"
            - "CommitmentPerformanceReport.${r2_id}.alternate_fulfillment_pct == 76.53"
            - "CommitmentPerformanceReport.${r2_id}.status == ACCEPTED"
            - "CommunityBenefitsPlan.${plan_id}.credited_to_date_usd == 63500000"
            - "CommunityBenefitsPlan.${plan_id}.remaining_commitment_usd == 328500000"
            - "CommunityBenefitsPlan.${plan_id}.consecutive_deficient_periods == 0"
            - "CommunityBenefitsPlan.${plan_id}.compliance_status == COMPLIANT"

  - rule_id: combinatorial_formula
    instances:
      - name: hhi_screen_nonlinear_combination_across_three_institutions
        mode: a
        grounds:
          - calculations.market_deposit_aggregation
          - calculations.hhi_competitive_screen
          - calculations.required_divestiture
          - entities.CompetitiveAnalysis.fields.screen_result
        distinguishing_aspect: |
          Mode (a): screen_result is a non-linear (sum-of-squared-shares) combination of four independent
          inputs - the market's includable deposit base, the acquirer's in-market deposits, the target's
          in-market deposits and the market_type that selects the absolute threshold. Changing any one input
          alone moves hhi_post_unmitigated and hhi_delta_unmitigated by different amounts, so the verdict
          MITIGATION_REQUIRED (post 5800 at or above 2500 but delta exactly 400, not strictly above it)
          cannot be reproduced by any single-input or additive model.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an MSA deposit market Kestrel MSA"
            - "acquirer Northbay National Bank with one branch of 200,000,000 in the market"
            - "target Harbor Community Bank with two branches of 60,000,000 and 40,000,000 in the market"
            - "unrelated Lakeside Trust Company with one branch of 700,000,000 in the market, so the includable base is 1,000,000,000 across 3 participants"
            - "a DRAFT MergerApplication from Northbay to Harbor"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /deposit-markets"
              payload: { market_code: "KESTREL-MSA", market_name: "Kestrel MSA", market_type: "MSA" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { mkt_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Harbor Community Bank", charter_type: "STATE_NONMEMBER", primary_regulator: "FDIC", cet1_capital_usd: 60000000, tier1_capital_usd: 62000000, total_capital_usd: 70000000, risk_weighted_assets_usd: 700000000, average_total_assets_usd: 800000000, total_loans_usd: 520000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { tgt_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Lakeside Trust Company", charter_type: "STATE_MEMBER", primary_regulator: "FRB", cet1_capital_usd: 500000000, tier1_capital_usd: 520000000, total_capital_usd: 560000000, risk_weighted_assets_usd: 4000000000, average_total_assets_usd: 5000000000, total_loans_usd: 3000000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { oth_id: "$.data.id" }
            - call: "POST /branches"
              payload: { institution_id: "${acq_id}", market_id: "${mkt_id}", branch_name: "Northbay Kestrel Main", deposits_usd: 200000000, service_type: "FULL_SERVICE" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { br_a1: "$.data.id" }
            - call: "POST /branches"
              payload: { institution_id: "${tgt_id}", market_id: "${mkt_id}", branch_name: "Harbor Kestrel East", deposits_usd: 60000000, service_type: "FULL_SERVICE" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { br_t1: "$.data.id" }
            - call: "POST /branches"
              payload: { institution_id: "${tgt_id}", market_id: "${mkt_id}", branch_name: "Harbor Kestrel West", deposits_usd: 40000000, service_type: "FULL_SERVICE" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { br_t2: "$.data.id" }
            - call: "POST /branches"
              payload: { institution_id: "${oth_id}", market_id: "${mkt_id}", branch_name: "Lakeside Kestrel Center", deposits_usd: 700000000, service_type: "FULL_SERVICE" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { br_o1: "$.data.id" }
            - call: "POST /merger-applications"
              payload: { acquirer_id: "${acq_id}", target_id: "${tgt_id}", structure: "STATUTORY_MERGER", consideration_type: "MIXED", total_consideration_usd: 250000000, officer_experience_score: 72, risk_management_score: 68, compliance_history_score: 67, integration_readiness_score: 73 }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /competitive-analyses"
              payload: { application_id: "${app_id}", market_id: "${mkt_id}" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { ca_id: "$.data.id" }
          assert:
            - "DepositMarket.${mkt_id}.total_deposits_usd == 1000000000"
            - "DepositMarket.${mkt_id}.participant_count == 3"
            - "DepositMarket.${mkt_id}.hhi_current == 5400"
            - "CompetitiveAnalysis.${ca_id}.combined_market_deposits_usd == 300000000"
            - "CompetitiveAnalysis.${ca_id}.hhi_pre_merger == 5400"
            - "CompetitiveAnalysis.${ca_id}.hhi_post_unmitigated == 5800"
            - "CompetitiveAnalysis.${ca_id}.hhi_delta_unmitigated == 400"
            - "CompetitiveAnalysis.${ca_id}.screen_result == MITIGATION_REQUIRED"
            - "CompetitiveAnalysis.${ca_id}.required_divestiture_deposits_usd == 39000000"
            - "CompetitiveAnalysis.${ca_id}.designated_divestiture_deposits_usd == 0"
            - "CompetitiveAnalysis.${ca_id}.hhi_post_mitigated == 5800"
            - "CompetitiveAnalysis.${ca_id}.mitigation_satisfied == false"
            - "MergerApplication.${app_id}.competitive_posture == MITIGATION_REQUIRED"

      - name: management_composite_per_product_rounding_order
        mode: b
        grounds:
          - calculations.management_composite_score
          - entities.MergerApplication.fields.management_composite_score
          - entities.MergerApplication.fields.management_rating
        distinguishing_aspect: |
          Mode (b): the four weighted products are each rounded HALF_UP to 2 decimals BEFORE being summed,
          and the sum is then rounded again. Scores 72/68/67/73 give products 25.20, 20.40, 11.73 and 12.78
          which sum to exactly 70.11, whereas rounding only at the end (25.2 + 20.4 + 11.725 + 12.775)
          yields 70.10. The two orders straddle nothing else in the response, so 70.11 versus 70.10 is a
          pure witness of the nesting order; both remain SATISFACTORY so the rating cannot mask the digit.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "acquirer Northbay National Bank and target Harbor Community Bank, both ACTIVE"
            - "no application yet - the composite is computed at application creation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /institutions"
              payload: { legal_name: "Harbor Community Bank", charter_type: "STATE_NONMEMBER", primary_regulator: "FDIC", cet1_capital_usd: 60000000, tier1_capital_usd: 62000000, total_capital_usd: 70000000, risk_weighted_assets_usd: 700000000, average_total_assets_usd: 800000000, total_loans_usd: 520000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { tgt_id: "$.data.id" }
          trigger:
            - call: "POST /merger-applications"
              payload: { acquirer_id: "${acq_id}", target_id: "${tgt_id}", structure: "STATUTORY_MERGER", consideration_type: "MIXED", total_consideration_usd: 250000000, officer_experience_score: 72, risk_management_score: 68, compliance_history_score: 67, integration_readiness_score: 73 }
              as: Filer
              as_user_id: "${acq_id}"
              captures: { app_id: "$.data.id" }
          assert:
            - "MergerApplication.${app_id}.management_composite_score == 70.11"
            - "MergerApplication.${app_id}.management_composite_score != 70.10"
            - "MergerApplication.${app_id}.management_rating == SATISFACTORY"
            - "MergerApplication.${app_id}.filing_status == DRAFT"
            - "MergerApplication.${app_id}.public_review_status == NOT_OPEN"
            - "MergerApplication.${app_id}.competitive_posture == NOT_ANALYZED"
            - "MergerApplication.${app_id}.version == 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: merger_application_parallel_review_dimension_advances_while_filing_dimension_holds
        shape: parallel_dimensions
        grounds:
          - state_machines.MergerApplication.filing_status
          - state_machines.MergerApplication.public_review_status
          - state_machines.PublicCommentPeriod.status
          - calculations.comment_window_semantics
        distinguishing_aspect: |
          MergerApplication carries two independent state dimensions. Granting a hearing drives
          public_review_status through OPEN_FOR_COMMENT -> PROTEST_PENDING -> HEARING_PENDING ->
          HEARING_GRANTED and extends the comment window (closes_at 2026-08-31 becomes 2026-09-30),
          while filing_status stays pinned at UNDER_REVIEW and amendment_round stays 0. The combined
          state (UNDER_REVIEW, HEARING_GRANTED) is only reachable because the dimensions advance on
          different triggers, and earliest_decision_at 2026-10-15 is derived from the review dimension
          alone.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "acquirer Northbay National Bank (CRA SATISFACTORY) and target Harbor Community Bank"
            - "an application with examiner scores 72/68/67/73 and a CURRENT WELL_CAPITALIZED REGULATORY_ADJUSTED schedule"
            - "the application submitted and accepted, so filing_status is UNDER_REVIEW and a comment period opened 2026-08-01 closing 2026-08-31"
            - "one substantive PROTEST comment inside the window, then a hearing request citing it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
            - call: "POST /institutions"
              payload: { legal_name: "Northbay National Bank", charter_type: "NATIONAL", primary_regulator: "OCC", cet1_capital_usd: 200000000, tier1_capital_usd: 210000000, total_capital_usd: 240000000, risk_weighted_assets_usd: 2000000000, average_total_assets_usd: 2600000000, total_loans_usd: 1500000000, latest_cra_rating: "SATISFACTORY" }
              as: CaseAnalyst
              as_user_id: "analyst-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /institutions"
