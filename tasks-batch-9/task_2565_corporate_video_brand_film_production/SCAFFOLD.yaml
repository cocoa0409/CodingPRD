scenario: |
  Generate task harder than expert level!

  2565. Corporate Video & Brand Film Production (video production company): project scoping with creative brief, deliverable formats and usage rights across channels and duration, budget construction with crew, equipment, location, talent and post-production line items, talent casting with usage-based buyout structures or union session and reuse fees, location scouting, permitting and insurance certificates for shoot days, production scheduling with call sheets, crew booking and equipment rental coordination, review cycles with defined revision rounds and change order triggers for additional rounds, deliverable versioning across aspect ratios, lengths and caption requirements, archive and asset handover with raw footage retention terms

domain_name: corporate-video-brand-film-production

# Flat topology: every collection is a top-level path and children carry explicit
# foreign keys in the request body. No nesting of ids inside URL paths except for
# reverse-reachability sub-resource reads.
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer collections joined by FK fields in request bodies; no id nesting in write
  # paths. Sub-resource GETs exist only as reverse-reachability read channels.

  state_machine_shape: cyclic
  # Deliverable loops PENDING -> IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW; the
  # loop count is bounded by a revision-round entitlement that change orders
  # extend. DeliverableVersion additionally carries two independent state axes
  # (review_status x technical_status), and Project is compound (its IN_POST and
  # DELIVERED transitions are derived from child aggregates).

  relationship_patterns:
    - one_to_many          # Project -> BudgetLine / Deliverable / ShootDay / TalentEngagement
    - self_referential     # DeliverableVersion.supersedes_version_id -> DeliverableVersion.id
    - cross_aggregate      # ComplianceCert spans Project and ShootDay; CrewBooking spans ShootDay and CrewMember
    - polymorphic          # ComplianceCert.cert_type selects which FK/coverage fields are mandatory

  role_model: segregation_of_duties
  # The X-User-ID that submits a cut may not record its review decision, and the
  # X-User-ID whose REQUEST_CHANGES decision spawned a change order may not
  # approve that change order.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 44 endpoints / 30 error codes / 9 state machines / 9 calculation
  # rules with 8 declared variants / 1 OCC race. Density, not volume: every
  # entity participates in at least one cascade, one gate, or one ledger.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: client_name
        type: string
        source: input
        description: "Corporate client commissioning the brand film"
        constraints: "1..120 chars, non-blank"
      - name: campaign_title
        type: string
        source: input
        description: "Internal campaign / production title"
        constraints: "1..120 chars, non-blank"
      - name: creative_brief_summary
        type: string
        source: input
        description: "Condensed creative brief agreed with the client at scoping"
        constraints: "10..2000 chars, non-blank"
      - name: channel_scope
        type: array
        source: input
        description: "Distribution channels licensed by the master agreement"
        constraints: "non-empty array, no duplicates, each element IN {BROADCAST, OLV, SOCIAL, INTERNAL, OOH}"
      - name: usage_term_months
        type: integer
        source: input
        description: "Licensed usage term for all deliverables, in months"
        constraints: "1..60"
      - name: contracted_revision_rounds
        type: integer
        source: input
        default: 2
        description: "Client review rounds included in the contract, per deliverable"
        constraints: "0..10"
      - name: budget_ceiling_cents
        type: integer
        source: input
        description: "Contracted not-to-exceed production budget in whole cents"
        constraints: "> 0"
      - name: raw_footage_retention_months
        type: integer
        source: input
        default: 12
        description: "Months the production company must retain raw footage after handover"
        constraints: "0..120"
      - name: raw_footage_terabytes
        type: number
        source: input
        default: 0
        description: "Raw camera-negative volume declared for the archive package"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Project lifecycle state"
        constraints: "one of {DRAFT, SCOPED, IN_PRODUCTION, IN_POST, DELIVERED, ARCHIVED}"
      - name: provisional_cost_cents
        type: integer
        source: computed
        description: "Forward-looking cost estimate (calculations.project_cost_ledger, variant provisional_estimate)"
      - name: committed_cost_cents
        type: integer
        source: computed
        description: "Contractually committed cost (calculations.project_cost_ledger, variant committed_actual)"
      - name: approved_budget_cents
        type: integer
        source: system
        default: null
        description: "Snapshot of provisional_cost_cents taken at POST /projects/{id}/approve-budget; null before approval"
      - name: budget_variance_cents
        type: integer
        source: computed
        description: "provisional_cost_cents - approved_budget_cents; 0 while approved_budget_cents is null"
      - name: round_entitlement_balance
        type: integer
        source: computed
        description: "Conserved round quantity (calculations.round_entitlement_balance)"
      - name: review_gate
        type: enum
        source: computed
        description: "CHANGE_ORDER_PENDING when any ChangeOrder of any of this project's Deliverables has status PENDING_APPROVAL, else OPEN"
        constraints: "one of {OPEN, CHANGE_ORDER_PENDING}"
      - name: archive_status
        type: enum
        source: computed
        description: "NOT_PACKAGED while handover_at is null; RETENTION_EXPIRED when handover_at is set and clock now > retention_expires_at; otherwise HANDED_OVER"
        constraints: "one of {NOT_PACKAGED, HANDED_OVER, RETENTION_EXPIRED}"
      - name: handover_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the archive package was handed to the client"
      - name: handover_recipient
        type: string
        source: system
        default: null
        description: "Client-side custodian recorded at handover"
      - name: retention_expires_at
        type: datetime
        source: computed
        description: "handover_at + raw_footage_retention_months * 30 days (calculations.raw_footage_retention_window); null before handover"

  - name: BudgetLine
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this line belongs to"
      - name: category
        type: enum
        source: input
        description: "Budget category the line rolls up to"
        constraints: "one of {CREW, EQUIPMENT, LOCATION, TALENT, POST}"
      - name: description
        type: string
        source: input
        description: "Line item description as it appears on the budget top sheet"
        constraints: "1..200 chars, non-blank"
      - name: quantity
        type: number
        source: input
        description: "Billable units (days, weeks, or each) for this line"
        constraints: "> 0"
      - name: unit_rate_cents
        type: integer
        source: input
        description: "Rate per unit in whole cents"
        constraints: ">= 0"
      - name: markup_pct
        type: number
        source: input
        default: 0
        description: "Production-company markup applied to this line's raw amount"
        constraints: "0 <= markup_pct <= 0.35"
      - name: extended_cents
        type: integer
        source: computed
        description: "Line total (calculations.budget_line_extended_cents)"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: "PLANNED at creation while Project.status IN {DRAFT, SCOPED}; COMMITTED once the budget is approved (or at creation for lines added after approval)"
        constraints: "one of {PLANNED, COMMITTED}"

  - name: Deliverable
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this deliverable belongs to"
      - name: title
        type: string
        source: input
        description: "Deliverable name, e.g. 'Hero film 60s'"
        constraints: "1..120 chars, non-blank"
      - name: channel
        type: enum
        source: input
        description: "Single distribution channel this cut is licensed for; must be a member of Project.channel_scope"
        constraints: "one of {BROADCAST, OLV, SOCIAL, INTERNAL, OOH}"
      - name: aspect_ratio
        type: enum
        source: input
        description: "Required frame aspect ratio for every accepted version"
        constraints: "one of {'16:9', '9:16', '1:1', '4:5', '2.39:1'}"
      - name: target_duration_seconds
        type: integer
        source: input
        description: "Contracted running length in seconds"
        constraints: "> 0 and <= 3600"
      - name: caption_requirement
        type: enum
        source: input
        description: "Caption deliverable required alongside the picture"
        constraints: "one of {NONE, CLOSED_SRT, BURNED_IN_SUBTITLES, OPEN_CAPTIONS}"
      - name: usage_rights_months
        type: integer
        source: input
        description: "Usage-rights window for this deliverable; must be <= Project.usage_term_months"
        constraints: "1..60"
      - name: air_date
        type: datetime
        source: input
        description: "Contracted first-air instant; drives change-order rush tiering"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Review lifecycle state of the deliverable"
        constraints: "one of {PENDING, IN_REVIEW, CHANGES_REQUESTED, APPROVED, HANDED_OVER}"
      - name: consumed_review_rounds
        type: integer
        source: computed
        default: 0
        description: "Count of review decisions with decision=REQUEST_CHANGES recorded against this deliverable's versions"
      - name: granted_extra_rounds
        type: integer
        source: computed
        description: "Sum of additional_rounds_granted over this deliverable's ChangeOrders with status = APPROVED"
      - name: round_entitlement
        type: integer
        source: computed
        description: "Project.contracted_revision_rounds + granted_extra_rounds"
      - name: version_count
        type: integer
        source: computed
        description: "Count of DeliverableVersion rows whose deliverable_id equals this id"

  - name: DeliverableVersion
    parent: Deliverable
    common_fields: true
    fields:
      - name: deliverable_id
        type: string
        source: input
        description: "FK -> Deliverable.id; the deliverable this cut belongs to"
      - name: supersedes_version_id
        type: string
        source: input
        default: null
        description: "FK -> DeliverableVersion.id; self-referential link to the cut this one replaces; must belong to the same deliverable_id"
      - name: cut_label
        type: string
        source: input
        description: "Editorial label, e.g. 'RC2 client cut'"
        constraints: "1..80 chars, non-blank"
      - name: round_index
        type: integer
        source: computed
        description: "1 + count of DeliverableVersion rows already existing for this deliverable_id at creation time"
      - name: aspect_ratio
        type: enum
        source: input
        description: "Delivered frame aspect ratio of this cut"
        constraints: "one of {'16:9', '9:16', '1:1', '4:5', '2.39:1'}"
      - name: duration_seconds
        type: integer
        source: input
        description: "Delivered running length of this cut in seconds"
        constraints: "> 0 and <= 3600"
      - name: has_captions
        type: boolean
        source: input
        default: false
        description: "Whether a caption asset accompanies this cut"
      - name: caption_format
        type: enum
        source: input
        default: NONE
        description: "Format of the accompanying caption asset"
        constraints: "one of {NONE, CLOSED_SRT, BURNED_IN_SUBTITLES, OPEN_CAPTIONS}"
      - name: file_size_gb
        type: number
        source: input
        default: 0
        description: "Master file size handed to the archive package"
        constraints: ">= 0"
      - name: review_status
        type: enum
        source: system
        default: DRAFT
        description: "Client-review axis of this row's parallel state machine"
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, CHANGES_REQUESTED, SUPERSEDED}"
      - name: technical_status
        type: enum
        source: system
        default: PENDING_QC
        description: "Technical-QC axis of this row's parallel state machine; evolves independently of review_status"
        constraints: "one of {PENDING_QC, QC_PASSED, QC_FAILED}"
      - name: qc_failure_reasons
        type: array
        source: computed
        description: "Ordered QC findings (calculations.version_qc_evaluation); empty array while technical_status is PENDING_QC or QC_PASSED"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the PostSupervisor that submitted this cut for review; segregation-of-duties input"
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ClientApprover that recorded the review decision"
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of submission"
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the review decision"

  - name: ChangeOrder
    parent: Deliverable
    common_fields: true
    fields:
      - name: deliverable_id
        type: string
        source: input
        description: "FK -> Deliverable.id; the deliverable whose scope or round count triggered this change order"
      - name: trigger_reason
        type: enum
        source: system
        description: "Why the system raised the change order"
        constraints: "one of {REVISION_ROUND_EXCEEDED, DELIVERABLE_ADDED_AFTER_SCOPE_LOCK}"
      - name: additional_rounds_granted
        type: integer
        source: system
        description: "Extra review rounds this change order buys: 1 for REVISION_ROUND_EXCEEDED, 0 for DELIVERABLE_ADDED_AFTER_SCOPE_LOCK"
        constraints: "0..1"
      - name: labor_cents
        type: integer
        source: computed
        description: "Post-production labour component (calculations.change_order_amount)"
      - name: rush_pct
        type: number
        source: computed
        description: "Rush tier selected from days between clock now and Deliverable.air_date"
      - name: rush_cents
        type: integer
        source: computed
        description: "Rounded rush surcharge component"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "labor_cents + rush_cents; the fee tier is keyed on THIS value, never on amount_cents"
      - name: producer_fee_pct
        type: number
        source: computed
        description: "Producer fee tier selected from subtotal_cents"
      - name: producer_fee_cents
        type: integer
        source: computed
        description: "Rounded producer fee component"
      - name: amount_cents
        type: integer
        source: computed
        description: "subtotal_cents + producer_fee_cents"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID whose action spawned this change order; may not approve it"
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID that approved, rejected or voided this change order"
      - name: status
        type: enum
        source: system
        default: PENDING_APPROVAL
        description: "Change-order lifecycle state"
        constraints: "one of {PENDING_APPROVAL, APPROVED, REJECTED, VOIDED}"

  - name: TalentEngagement
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project casting this performer"
      - name: talent_name
        type: string
        source: input
        description: "Performer name as it appears on the deal memo"
        constraints: "1..120 chars, non-blank"
      - name: union_affiliation
        type: enum
        source: input
        description: "Performer's union status; UNION performers may not be bought out"
        constraints: "one of {UNION, NON_UNION}"
      - name: compensation_model
        type: enum
        source: input
        description: "Selects which calculations.talent_compensation variant family applies"
        constraints: "one of {USAGE_BUYOUT, UNION_SESSION_REUSE}"
      - name: session_fee_cents
        type: integer
        source: input
        description: "Agreed day rate for a shooting session, in whole cents"
        constraints: "> 0"
      - name: session_days
        type: integer
        source: input
        description: "Number of session (shooting) days on the deal memo"
        constraints: "1..30"
      - name: channel_basis_count
        type: integer
        source: computed
        description: "Channel count fed into the buyout multiplier: len(Project.channel_scope) under the PROVISIONAL basis, count of distinct Deliverable.channel under the FINAL basis"
      - name: term_basis_months
        type: integer
        source: computed
        description: "Usage term fed into the multipliers: Project.usage_term_months under the PROVISIONAL basis, max(Deliverable.usage_rights_months) under the FINAL basis"
      - name: reuse_cycles
        type: integer
        source: computed
        description: "ceil(term_basis_months * 30 / 91) 13-week reuse cycles; 0 for USAGE_BUYOUT engagements"
      - name: base_fee_cents
        type: integer
        source: computed
        description: "session_fee_cents * session_days"
      - name: usage_load_cents
        type: integer
        source: computed
        description: "Buyout usage load component; 0 for UNION_SESSION_REUSE engagements"
      - name: reuse_fee_cents
        type: integer
        source: computed
        description: "Union reuse component; 0 for USAGE_BUYOUT engagements"
      - name: pension_health_cents
        type: integer
        source: computed
        description: "Union pension and health contribution; 0 for USAGE_BUYOUT engagements"
      - name: agent_fee_cents
        type: integer
        source: computed
        description: "Agent commission component"
      - name: total_comp_cents
        type: integer
        source: computed
        description: "Engagement total (calculations.talent_compensation)"
      - name: comp_basis
        type: enum
        source: system
        default: PROVISIONAL
        description: "Which basis produced the current computed columns; flips to FINAL at confirmation"
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Engagement lifecycle state"
        constraints: "one of {DRAFT, CONFIRMED, COMPLETED}"

  - name: Location
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Scouted location or stage name"
        constraints: "1..120 chars, non-blank"
      - name: address
        type: string
        source: input
        description: "Street address used on permits and call sheets"
        constraints: "1..200 chars, non-blank"
      - name: stage_count
        type: integer
        source: input
        description: "Independently bookable stages/areas; caps concurrent shoot days at this location"
        constraints: "1..12"
      - name: daily_fee_cents
        type: integer
        source: input
        description: "Location fee per shoot day in whole cents"
        constraints: ">= 0"
      - name: insurance_minimum_cents
        type: integer
        source: input
        description: "Minimum general-liability coverage the venue requires before a shoot day may be confirmed"
        constraints: ">= 0"
      - name: permit_authority
        type: string
        source: input
        description: "Jurisdiction that issues film permits for this address"
        constraints: "1..120 chars, non-blank"
      - name: scheduled_shoot_day_count
        type: integer
        source: computed
        description: "Count of ShootDay rows at this location with status IN {PLANNED, CONFIRMED}"
      - name: scouting_status
        type: enum
        source: computed
        description: "CONFIRMED when >=1 ShootDay here has status CONFIRMED; HOLD when >=1 has status PLANNED and none is CONFIRMED; SCOUTED otherwise"
        constraints: "one of {SCOUTED, HOLD, CONFIRMED}"

  - name: ShootDay
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this shoot day belongs to"
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id; the venue occupied by this shoot day"
      - name: shoot_date
        type: string
        source: input
        description: "Calendar date of the shoot in YYYY-MM-DD (UTC); must equal the UTC date part of call_time"
        constraints: "ISO 8601 date"
      - name: call_time
        type: datetime
        source: input
        description: "General crew call; start of the location occupation interval"
      - name: wrap_time
        type: datetime
        source: input
        description: "Planned wrap; end of the location occupation interval; must be > call_time"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: "Shoot-day lifecycle state"
        constraints: "one of {PLANNED, CONFIRMED, WRAPPED, CANCELLED}"
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived gate over permits, insurance and crew (calculations.shoot_day_compliance_posture)"
        constraints: "one of {OPEN, RESTRICTED, BLOCKED}"
      - name: confirmed_crew_count
        type: integer
        source: computed
        description: "Count of CrewBooking rows for this shoot day with status IN {CONFIRMED, COMPLETED}"
      - name: call_sheet_status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT until the call sheet is published; PUBLISHED afterwards"
        constraints: "one of {DRAFT, PUBLISHED}"
      - name: call_sheet_published_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the call sheet was published"
      - name: day_cost_cents
        type: integer
        source: computed
        description: "Display-only day total (calculations.shoot_day_cost); NOT summed into Project ledgers"
      - name: cancellation_reason
        type: string
        source: system
        default: null
        description: "Reason recorded when the shoot day is cancelled"

  - name: ComplianceCert
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project the certificate is filed under"
      - name: shoot_day_id
        type: string
        source: input
        default: null
        description: "FK -> ShootDay.id; required when cert_type is FILM_PERMIT, must be omitted when cert_type is LIABILITY_COI"
      - name: cert_type
        type: enum
        source: input
        description: "Certificate family; selects which fields are mandatory"
        constraints: "one of {FILM_PERMIT, LIABILITY_COI}"
      - name: carrier_or_authority
        type: string
        source: input
        description: "Issuing insurer (COI) or permitting authority (permit)"
        constraints: "1..120 chars, non-blank"
      - name: reference_code
        type: string
        source: input
        description: "Policy number or permit application reference"
        constraints: "1..64 chars, non-blank"
      - name: coverage_amount_cents
        type: integer
        source: input
        default: 0
        description: "General-liability coverage in whole cents; must be > 0 when cert_type is LIABILITY_COI"
        constraints: ">= 0"
      - name: fee_cents
        type: integer
        source: input
        default: 0
        description: "Filing or premium fee; recorded for reference only and never summed into Project ledgers"
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        description: "Start of the certificate's coverage interval (inclusive)"
      - name: effective_to
        type: datetime
        source: input
        description: "End of the certificate's coverage interval (inclusive); must be > effective_from"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Filing lifecycle state as recorded by the ComplianceOfficer"
        constraints: "one of {SUBMITTED, ISSUED, DENIED}"
      - name: effective_status
        type: enum
        source: computed
        description: "EXPIRED when status = ISSUED and clock now > effective_to; otherwise equal to status"
        constraints: "one of {SUBMITTED, ISSUED, DENIED, EXPIRED}"
      - name: decision_note
        type: string
        source: system
        default: null
        description: "Free-text note captured with the issue/deny decision"
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the issue/deny decision"

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Crew member's name as booked"
        constraints: "1..120 chars, non-blank"
      - name: department
        type: enum
        source: input
        description: "Department the crew member is booked into"
        constraints: "one of {CAMERA, GRIP_ELECTRIC, SOUND, ART, PRODUCTION, POST}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Straight-time hourly rate in whole cents"
        constraints: "> 0"
      - name: min_turnaround_hours
        type: integer
        source: input
        default: 10
        description: "Contractual rest hours required between the wrap of one booking and the call of the next"
        constraints: "0..24"
      - name: union_local
        type: string
        source: input
        default: null
        description: "Union local designation, or null for non-union crew"

  - name: CrewBooking
    parent: ShootDay
    common_fields: true
    fields:
      - name: shoot_day_id
        type: string
        source: input
        description: "FK -> ShootDay.id; the shoot day being crewed"
      - name: crew_member_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the person occupied by this booking"
      - name: department_role
        type: string
        source: input
        description: "Position title on the call sheet, e.g. '1st AC'"
        constraints: "1..80 chars, non-blank"
      - name: call_time
        type: datetime
        source: input
        description: "Start of this crew member's occupation interval (inclusive)"
      - name: wrap_time
        type: datetime
        source: input
        description: "End of this crew member's occupation interval (inclusive); must be > call_time"
      - name: scheduled_hours
        type: number
        source: computed
        description: "(wrap_time - call_time) expressed in hours, exact to two decimals"
      - name: straight_time_cents
        type: integer
        source: computed
        description: "Straight-time component (calculations.crew_booking_cost)"
      - name: overtime_tier1_cents
        type: integer
        source: computed
        description: "Hours 10..12 at 1.5x (calculations.crew_booking_cost)"
      - name: overtime_tier2_cents
        type: integer
        source: computed
        description: "Hours beyond 12 at 2.0x (calculations.crew_booking_cost)"
      - name: cost_cents
        type: integer
        source: computed
        description: "Booking total (calculations.crew_booking_cost)"
      - name: status
        type: enum
        source: system
        default: HELD
        description: "Booking lifecycle state"
        constraints: "one of {HELD, CONFIRMED, COMPLETED, RELEASED}"

  - name: EquipmentReservation
    parent: ShootDay
    common_fields: true
    fields:
      - name: shoot_day_id
        type: string
        source: input
        description: "FK -> ShootDay.id; the shoot day the kit is rented for"
      - name: vendor_name
        type: string
        source: input
        description: "Rental house supplying the kit"
        constraints: "1..120 chars, non-blank"
      - name: kit_label
        type: string
        source: input
        description: "Kit description, e.g. 'A-cam package + 4 primes'"
        constraints: "1..120 chars, non-blank"
      - name: unit_count
        type: integer
        source: input
        description: "Number of identical kits reserved"
        constraints: "1..50"
      - name: daily_rate_cents
        type: integer
        source: input
        description: "Rental rate per kit per rental day in whole cents"
        constraints: "> 0"
      - name: pickup_at
        type: datetime
        source: input
        description: "Kit pickup instant; must be >= ShootDay.call_time - 48h"
      - name: return_at
        type: datetime
        source: input
        description: "Kit return instant; must be > pickup_at and <= ShootDay.wrap_time + 48h"
      - name: rental_days
        type: integer
        source: computed
        description: "max(1, ceil((return_at - pickup_at) / 24h)) (calculations.equipment_reservation_cost)"
      - name: total_cost_cents
        type: integer
        source: computed
        description: "unit_count * daily_rate_cents * rental_days (calculations.equipment_reservation_cost)"
      - name: status
        type: enum
        source: system
        default: RESERVED
        description: "Reservation lifecycle state"
        constraints: "one of {RESERVED, RETURNED, RELEASED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
#   `state_field:` names the column the machine drives. DeliverableVersion
#   carries TWO machines (review_status x technical_status) that advance
#   independently on the same row.
# ---------------------------------------------------------------------------
state_machines:
  - entity: Project
    state_field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: SCOPED
        trigger: "POST /projects/{id}/lock-scope"
        actor: LineProducer
        preconditions:
          - "Project.status == DRAFT"
          - "count(Deliverable where project_id == Project.id) >= 1"
          - "every Deliverable of the project satisfies usage_rights_months <= Project.usage_term_months"
        side_effects:
          - "Scope becomes binding: any later POST /deliverables against this project raises a ChangeOrder with trigger_reason = DELIVERABLE_ADDED_AFTER_SCOPE_LOCK"
          - "Project.version += 1, Project.updated_at = clock now"
        note: "Creative brief text is validated at creation, so lock-scope only re-checks deliverable coverage and usage-rights containment."
      - from: SCOPED
        to: IN_PRODUCTION
        trigger: "POST /projects/{id}/approve-budget"
        actor: ClientApprover
        preconditions:
          - "Project.status == SCOPED"
          - "count(BudgetLine where project_id == Project.id) >= 1"
          - "Project.provisional_cost_cents <= Project.budget_ceiling_cents (strict ceiling, no tolerance at approval)"
        side_effects:
          - "Project.approved_budget_cents = Project.provisional_cost_cents evaluated at this instant"
          - "cascade down: every BudgetLine of this project with status PLANNED transitions to COMMITTED"
          - "caused by the line cascade: Project.committed_cost_cents is recomputed and now includes those lines"
          - "Project.budget_variance_cents recomputed (= 0 at this instant)"
      - from: IN_PRODUCTION
        to: IN_POST
        trigger: "system (bubble up): the last ShootDay of the project leaves {PLANNED, CONFIRMED} via POST /shoot-days/{id}/wrap or POST /shoot-days/{id}/cancel"
        actor: system
        preconditions:
          - "Project.status == IN_PRODUCTION"
          - "count(ShootDay where project_id == Project.id AND status IN {PLANNED, CONFIRMED}) == 0"
          - "count(ShootDay where project_id == Project.id) >= 1"
        side_effects:
          - "Project.version += 1, Project.updated_at = clock now"
      - from: IN_POST
        to: DELIVERED
        trigger: "system (bubble up): POST /deliverable-versions/{id}/review-decision with decision = APPROVE approves the last outstanding deliverable"
        actor: system
        preconditions:
          - "Project.status == IN_POST"
          - "every Deliverable where project_id == Project.id has status == APPROVED"
        side_effects:
          - "cascade cross-entity: every TalentEngagement of the project with status CONFIRMED transitions to COMPLETED (total_comp_cents untouched, so committed_cost_cents does not move)"
      - from: DELIVERED
        to: ARCHIVED
        trigger: "POST /projects/{id}/handover"
        actor: LineProducer
        preconditions:
          - "Project.status == DELIVERED"
          - "Project.handover_at is null"
        side_effects:
          - "Project.handover_at = clock now; Project.handover_recipient = request handover_recipient"
          - "Project.retention_expires_at = handover_at + raw_footage_retention_months * 30 days (calculations.raw_footage_retention_window)"
          - "Project.archive_status becomes HANDED_OVER (and derives RETENTION_EXPIRED once clock now > retention_expires_at)"
          - "cascade down: every Deliverable of the project with status APPROVED transitions to HANDED_OVER"

  - entity: BudgetLine
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMMITTED]
    transitions:
      - from: PLANNED
        to: COMMITTED
        trigger: "system (cascade down): POST /projects/{id}/approve-budget"
        actor: system
        preconditions:
          - "BudgetLine.status == PLANNED"
          - "parent Project.status == SCOPED at the moment of approval"
        side_effects:
          - "Project.committed_cost_cents increases by this line's extended_cents"
      - from: PLANNED
        to: COMMITTED
        trigger: "system (immediate auto-commit at creation): POST /budget-lines while Project.status IN {IN_PRODUCTION, IN_POST}"
        actor: system
        preconditions:
          - "parent Project.status IN {IN_PRODUCTION, IN_POST}"
        side_effects:
          - "Project.committed_cost_cents increases by this line's extended_cents in the same request that created the line"
        note: "Lines created while Project.status IN {DRAFT, SCOPED} stay PLANNED until approve-budget."

  - entity: Deliverable
    state_field: status
    initial_state: PENDING
    terminal_states: [HANDED_OVER]
    transitions:
      - from: PENDING
        to: IN_REVIEW
        trigger: "system (bubble up): POST /deliverable-versions/{id}/submit"
        actor: system
        preconditions:
          - "Deliverable.status == PENDING"
          - "the submitted DeliverableVersion.deliverable_id == Deliverable.id"
        side_effects:
          - "Deliverable.version += 1, Deliverable.updated_at = clock now"
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "system (bubble up): POST /deliverable-versions/{id}/submit on a later cut"
        actor: system
        preconditions:
          - "Deliverable.status == CHANGES_REQUESTED"
          - "Deliverable.consumed_review_rounds < Deliverable.round_entitlement"
        side_effects:
          - "Deliverable.version += 1, Deliverable.updated_at = clock now"
        note: "This edge closes the review cycle PENDING -> IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW; the number of laps is bounded by round_entitlement, which approved change orders raise."
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /deliverable-versions/{id}/review-decision with decision = REQUEST_CHANGES"
        actor: ClientApprover
        preconditions:
          - "Deliverable.status == IN_REVIEW"
          - "the version under review has review_status == SUBMITTED"
        side_effects:
          - "Deliverable.consumed_review_rounds += 1 (round accounting hop 1 of the review cascade)"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /deliverable-versions/{id}/review-decision with decision = APPROVE"
        actor: ClientApprover
        preconditions:
          - "Deliverable.status == IN_REVIEW"
          - "the version under review has review_status == SUBMITTED"
        side_effects:
          - "bubble up: when every Deliverable of the project is APPROVED and Project.status == IN_POST, Project transitions IN_POST -> DELIVERED"
      - from: APPROVED
        to: HANDED_OVER
        trigger: "system (cascade down): POST /projects/{id}/handover"
        actor: system
        preconditions:
          - "Deliverable.status == APPROVED"
          - "Project.status == DELIVERED at the moment of handover"
        side_effects:
          - "Deliverable.version += 1, Deliverable.updated_at = clock now"

  - entity: DeliverableVersion
    state_field: review_status
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /deliverable-versions/{id}/submit"
        actor: PostSupervisor
        preconditions:
          - "DeliverableVersion.review_status == DRAFT"
          - "DeliverableVersion.technical_status == QC_PASSED (cross-axis guard on the same row)"
          - "parent Deliverable.status IN {PENDING, CHANGES_REQUESTED}"
          - "Project.status IN {IN_PRODUCTION, IN_POST}"
          - "Project.review_gate == OPEN"
          - "Deliverable.consumed_review_rounds < Deliverable.round_entitlement"
        side_effects:
          - "DeliverableVersion.submitted_by_user_id = acting X-User-ID; submitted_at = clock now"
          - "bubble up: Deliverable.status PENDING -> IN_REVIEW or CHANGES_REQUESTED -> IN_REVIEW"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /deliverable-versions/{id}/review-decision with decision = APPROVE"
        actor: ClientApprover
        preconditions:
          - "DeliverableVersion.review_status == SUBMITTED"
          - "acting X-User-ID != DeliverableVersion.submitted_by_user_id (segregation of duties)"
          - "Project.status IN {IN_PRODUCTION, IN_POST}"
        side_effects:
          - "reviewed_by_user_id = acting X-User-ID; decided_at = clock now"
          - "bubble up: Deliverable.status IN_REVIEW -> APPROVED"
          - "bubble up (second hop): when that leaves every Deliverable of the project APPROVED and Project.status == IN_POST, Project transitions IN_POST -> DELIVERED, which in turn completes every CONFIRMED TalentEngagement"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /deliverable-versions/{id}/review-decision with decision = REQUEST_CHANGES"
        actor: ClientApprover
        preconditions:
          - "DeliverableVersion.review_status == SUBMITTED"
          - "acting X-User-ID != DeliverableVersion.submitted_by_user_id (segregation of duties)"
          - "Project.status IN {IN_PRODUCTION, IN_POST}"
        side_effects:
          - "reviewed_by_user_id = acting X-User-ID; decided_at = clock now"
          - "CASCADE hop 1 — Deliverable.status IN_REVIEW -> CHANGES_REQUESTED and Deliverable.consumed_review_rounds += 1"
          - "CASCADE hop 2 (caused by hop 1, not by this request): if the incremented Deliverable.consumed_review_rounds >= Deliverable.round_entitlement, a ChangeOrder row is created for that Deliverable with trigger_reason = REVISION_ROUND_EXCEEDED, additional_rounds_granted = 1, status = PENDING_APPROVAL, requested_by_user_id = the reviewing X-User-ID, and every money column from calculations.change_order_amount"
          - "CASCADE hop 3 (caused by hop 2): the new PENDING_APPROVAL ChangeOrder enters the provisional inclusion set, so Project.provisional_cost_cents += ChangeOrder.amount_cents, and Project.review_gate flips OPEN -> CHANGE_ORDER_PENDING, which blocks every further DeliverableVersion submit across the whole project"
          - "CASCADE hop 4 (caused by hop 3): Project.budget_variance_cents is recomputed as provisional_cost_cents - approved_budget_cents"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (cascade cross-entity): POST /deliverable-versions carrying supersedes_version_id == this id"
        actor: system
        preconditions:
          - "DeliverableVersion.review_status IN {DRAFT, CHANGES_REQUESTED}"
          - "the superseding version's deliverable_id == this version's deliverable_id"
        side_effects:
          - "DeliverableVersion.version += 1, updated_at = clock now"
      - from: CHANGES_REQUESTED
        to: SUPERSEDED
        trigger: "system (cascade cross-entity): POST /deliverable-versions carrying supersedes_version_id == this id"
        actor: system
        preconditions:
          - "DeliverableVersion.review_status IN {DRAFT, CHANGES_REQUESTED}"
          - "the superseding version's deliverable_id == this version's deliverable_id"
        side_effects:
          - "DeliverableVersion.version += 1, updated_at = clock now"
        note: "A version with review_status == SUBMITTED may NOT be superseded — the client still owes a decision on it."

  - entity: DeliverableVersion
    state_field: technical_status
    initial_state: PENDING_QC
    terminal_states: [QC_PASSED, QC_FAILED]
    transitions:
      - from: PENDING_QC
        to: QC_PASSED
        trigger: "POST /deliverable-versions/{id}/qc"
        actor: PostSupervisor
        preconditions:
          - "DeliverableVersion.technical_status == PENDING_QC"
          - "calculations.version_qc_evaluation yields an empty findings list"
        side_effects:
          - "qc_failure_reasons = []"
          - "review_status is NOT touched by this transition (independent axis)"
      - from: PENDING_QC
        to: QC_FAILED
        trigger: "POST /deliverable-versions/{id}/qc"
        actor: PostSupervisor
        preconditions:
          - "DeliverableVersion.technical_status == PENDING_QC"
          - "calculations.version_qc_evaluation yields a non-empty findings list"
        side_effects:
          - "qc_failure_reasons = the ordered findings list"
          - "review_status is NOT touched by this transition (independent axis); the cut can never be submitted, so a new version must be created"
        note: "A failing QC is a recorded 200 outcome, not a request error. Re-running QC on the same row is rejected with ERR_QC_ALREADY_RECORDED."

  - entity: ChangeOrder
    state_field: status
    initial_state: PENDING_APPROVAL
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /change-orders/{id}/decision with decision = APPROVE"
        actor: ClientApprover
        preconditions:
          - "ChangeOrder.status == PENDING_APPROVAL"
          - "acting X-User-ID != ChangeOrder.requested_by_user_id (segregation of duties)"
        side_effects:
          - "approved_by_user_id = acting X-User-ID"
          - "Deliverable.granted_extra_rounds += additional_rounds_granted, so Deliverable.round_entitlement rises by the same amount"
          - "caused by the entitlement rise: Project.round_entitlement_balance += additional_rounds_granted"
          - "Project.review_gate returns to OPEN once no PENDING_APPROVAL ChangeOrder remains for the project"
          - "Project.committed_cost_cents += amount_cents (APPROVED enters the committed inclusion set); provisional_cost_cents is unchanged because PENDING_APPROVAL was already inside the provisional set"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /change-orders/{id}/decision with decision = REJECT"
        actor: ClientApprover
        preconditions:
          - "ChangeOrder.status == PENDING_APPROVAL"
          - "acting X-User-ID != ChangeOrder.requested_by_user_id (segregation of duties)"
        side_effects:
          - "approved_by_user_id = acting X-User-ID"
          - "Project.provisional_cost_cents -= amount_cents (the row leaves the provisional set); budget_variance_cents recomputed"
          - "Project.review_gate returns to OPEN once no PENDING_APPROVAL ChangeOrder remains; no extra rounds are granted, so a deliverable at its entitlement stays blocked from further submits"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /change-orders/{id}/decision with decision = VOID"
        actor: ClientApprover | LineProducer
        preconditions:
          - "ChangeOrder.status == APPROVED"
        side_effects:
          - "approved_by_user_id = acting X-User-ID"
          - "Deliverable.granted_extra_rounds -= additional_rounds_granted; Deliverable.round_entitlement falls by the same amount"
          - "caused by the entitlement fall: Project.round_entitlement_balance -= additional_rounds_granted, restoring the value it held before the approval"
          - "Project.committed_cost_cents -= amount_cents and Project.provisional_cost_cents -= amount_cents; budget_variance_cents recomputed"
        note: "APPROVE followed by VOID is the compensating pair for the round-entitlement invariant."

  - entity: TalentEngagement
    state_field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /talent-engagements/{id}/confirm"
        actor: LineProducer
        preconditions:
          - "TalentEngagement.status == DRAFT"
          - "Project.status IN {SCOPED, IN_PRODUCTION, IN_POST}"
          - "count(Deliverable where project_id == TalentEngagement.project_id) >= 1"
        side_effects:
          - "comp_basis flips PROVISIONAL -> FINAL and every computed money column is rewritten by calculations.talent_compensation on the FINAL basis"
          - "Project.committed_cost_cents += the FINAL total_comp_cents (CONFIRMED enters the committed set)"
          - "Project.provisional_cost_cents is recomputed with the FINAL total replacing the PROVISIONAL total for this engagement; budget_variance_cents recomputed"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (cascade cross-entity): Project transitions IN_POST -> DELIVERED"
        actor: system
        preconditions:
          - "TalentEngagement.status == CONFIRMED"
        side_effects:
          - "no ledger movement: COMPLETED remains inside both the provisional and the committed inclusion sets"

  - entity: ShootDay
    state_field: status
    initial_state: PLANNED
    terminal_states: [WRAPPED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /shoot-days/{id}/confirm"
        actor: ProductionCoordinator
        preconditions:
          - "ShootDay.status == PLANNED"
          - "Project.status == IN_PRODUCTION"
          - "guarded cross-entity: compliance_posture evaluated on pre-transition state IN {OPEN, RESTRICTED} — i.e. an ISSUED, unexpired FILM_PERMIT for this shoot day covering [call_time, wrap_time] AND an ISSUED, unexpired LIABILITY_COI on the project covering [call_time, wrap_time] with coverage_amount_cents >= Location.insurance_minimum_cents"
        side_effects:
          - "Location.scouting_status recomputed to CONFIRMED"
          - "no crew or equipment sweep: CrewBooking rows keep their own status"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /shoot-days/{id}/cancel"
        actor: ProductionCoordinator | LineProducer
        preconditions:
          - "ShootDay.status == PLANNED"
        side_effects:
          - "cancellation_reason recorded"
          - "CASCADE hop 1 — every CrewBooking of this shoot day with status IN {HELD, CONFIRMED} transitions to RELEASED"
          - "CASCADE hop 2 (caused by hop 1): each booking that left CONFIRMED debits Project.committed_cost_cents by its own cost_cents; bookings released out of HELD debit nothing"
          - "CASCADE hop 3 (caused by hop 2): Project.budget_variance_cents recomputed as provisional_cost_cents - approved_budget_cents"
          - "parallel: every EquipmentReservation of this shoot day with status RESERVED transitions to RELEASED, each debiting Project.committed_cost_cents and Project.provisional_cost_cents by its total_cost_cents"
          - "parallel: Location.scheduled_shoot_day_count and Location.scouting_status recomputed"
          - "bubble up: when no ShootDay of the project remains in {PLANNED, CONFIRMED} and at least one exists, Project transitions IN_PRODUCTION -> IN_POST"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /shoot-days/{id}/cancel"
        actor: ProductionCoordinator | LineProducer
        preconditions:
          - "ShootDay.status == CONFIRMED"
        side_effects:
          - "identical cascade to the PLANNED -> CANCELLED edge (hops 1-3 plus the parallel equipment, location and project bubble-up effects)"
      - from: CONFIRMED
        to: WRAPPED
        trigger: "POST /shoot-days/{id}/wrap"
        actor: ProductionCoordinator
        preconditions:
          - "ShootDay.status == CONFIRMED"
          - "clock now >= ShootDay.wrap_time"
        side_effects:
          - "cascade down: every CrewBooking of this shoot day with status CONFIRMED transitions to COMPLETED; committed_cost_cents does not move because COMPLETED stays inside the committed inclusion set"
          - "cascade down: every CrewBooking still in HELD transitions to RELEASED (never worked, never billed)"
          - "cascade down: every EquipmentReservation with status RESERVED transitions to RETURNED; committed_cost_cents does not move because RETURNED stays inside the committed inclusion set"
          - "bubble up: when no ShootDay of the project remains in {PLANNED, CONFIRMED} and at least one exists, Project transitions IN_PRODUCTION -> IN_POST"

  - entity: ComplianceCert
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [ISSUED, DENIED]
    transitions:
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /compliance-certs/{id}/decision with decision = ISSUE"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceCert.status == SUBMITTED"
        side_effects:
          - "decided_at = clock now; decision_note recorded"
          - "cascade cross-entity: for cert_type == FILM_PERMIT the linked ShootDay.compliance_posture is recomputed; for cert_type == LIABILITY_COI every ShootDay of the project has compliance_posture recomputed"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /compliance-certs/{id}/decision with decision = DENY"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceCert.status == SUBMITTED"
        side_effects:
          - "decided_at = clock now; decision_note recorded"
          - "cascade cross-entity: the same posture recomputation as ISSUE; a DENIED certificate never satisfies a posture gate"
        note: "effective_status derives EXPIRED from an ISSUED row once clock now > effective_to; no stored transition performs that flip."

  - entity: CrewBooking
    state_field: status
    initial_state: HELD
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /crew-bookings/{id}/confirm"
        actor: ProductionCoordinator
        preconditions:
          - "CrewBooking.status == HELD"
          - "guarded cross-entity: ShootDay.status IN {PLANNED, CONFIRMED}"
        side_effects:
          - "ledger sync: Project.committed_cost_cents += CrewBooking.cost_cents; budget_variance_cents recomputed"
          - "ShootDay.confirmed_crew_count += 1"
          - "caused by the count change: ShootDay.compliance_posture recomputed (RESTRICTED -> OPEN once the count reaches MIN_CONFIRMED_CREW_FOR_CALL_SHEET)"
      - from: HELD
        to: RELEASED
        trigger: "POST /crew-bookings/{id}/release, or system cascade from POST /shoot-days/{id}/cancel or /wrap"
        actor: ProductionCoordinator | system
        preconditions:
          - "CrewBooking.status == HELD"
        side_effects:
          - "no ledger movement (a HELD booking was never inside the committed set)"
          - "ShootDay.day_cost_cents recomputed"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /crew-bookings/{id}/release, or system cascade from POST /shoot-days/{id}/cancel"
        actor: ProductionCoordinator | system
        preconditions:
          - "CrewBooking.status == CONFIRMED"
        side_effects:
          - "compensating ledger sync: Project.committed_cost_cents -= CrewBooking.cost_cents (exactly the amount credited on confirmation); budget_variance_cents recomputed"
          - "ShootDay.confirmed_crew_count -= 1; ShootDay.compliance_posture recomputed"
          - "the released interval stops occupying the CrewMember, so a later booking may reuse it"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (cascade down): POST /shoot-days/{id}/wrap"
        actor: system
        preconditions:
          - "CrewBooking.status == CONFIRMED"
          - "ShootDay.status == CONFIRMED at the moment of wrap"
        side_effects:
          - "no ledger movement: COMPLETED remains inside the committed inclusion set"

  - entity: EquipmentReservation
    state_field: status
    initial_state: RESERVED
    terminal_states: [RETURNED, RELEASED]
    transitions:
      - from: RESERVED
        to: RETURNED
        trigger: "system (cascade down): POST /shoot-days/{id}/wrap"
        actor: system
        preconditions:
          - "EquipmentReservation.status == RESERVED"
        side_effects:
          - "no ledger movement: RETURNED remains inside both inclusion sets"
      - from: RESERVED
        to: RELEASED
        trigger: "system (cascade down): POST /shoot-days/{id}/cancel"
        actor: system
        preconditions:
          - "EquipmentReservation.status == RESERVED"
        side_effects:
          - "Project.committed_cost_cents -= total_cost_cents and Project.provisional_cost_cents -= total_cost_cents; budget_variance_cents recomputed"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: version-create-stale-deliverable
    parent_entity: Deliverable
    write_endpoint: "POST /deliverable-versions"
    occ_field: "expected_deliverable_version"
    description: |
      Creating a DeliverableVersion against a Deliverable whose version has
      advanced since the client last read it is rejected. Two successive
      creates are both legitimate under the product rules — the second cut
      supersedes the first via supersedes_version_id — so a writer working
      from a stale read would otherwise silently branch the cut history and
      corrupt round_index ordering. The check is a stale-version comparison,
      never a timing question: expected_deliverable_version must equal the
      Deliverable.version stored at the moment the create is processed.
    error_id: ERR_STALE_DELIVERABLE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
#   All money is whole cents. `round_half_up(x)` rounds a rational to the
#   nearest integer cent with ties going away from zero.
# ---------------------------------------------------------------------------
calculations:
  - name: budget_line_extended_cents
    trigger: "On POST /budget-lines (line creation) and whenever a Project ledger is recomputed"
    algorithm: aggregation
    formula: |
      raw_cents      = quantity * unit_rate_cents          # exact rational, no rounding
      markup_cents   = round_half_up(raw_cents * markup_pct)
      extended_cents = raw_cents + markup_cents
      # PINNED ROUNDING ORDER for every roll-up over lines:
      #   round per line first (markup_cents above), THEN sum extended_cents.
      #   Summing raw_cents across lines and applying markup_pct to the sum is
      #   FORBIDDEN and produces different cents.
      project_line_total = sum(extended_cents for each included BudgetLine)
    input_set: "BudgetLine rows of one Project; the status filter is supplied by whichever ledger variant calls this rule"
    constants:
      MAX_MARKUP_PCT: 0.35
    precision: "whole cents, round_half_up, applied once per line to markup_cents only"
    variants:
      - name: per_line_then_sum
        when: "Always — this is the only sanctioned order"
        difference: "Three lines whose raw_cents are each 22220 at markup_pct 0.075 give 1667 markup each, so extended_cents is 23887 each and the roll-up is 71661"
      - name: sum_then_round
        when: "Never — documented only to name the trap"
        difference: "Summing raw first (66660) and rounding once (4999.5 -> 5000) yields 71660, one cent short of the pinned answer"

  - name: project_cost_ledger
    trigger: "Recomputed on every mutation that adds, removes or re-states a BudgetLine, TalentEngagement, CrewBooking, EquipmentReservation or ChangeOrder of the project; surfaced on GET /projects/{id}"
    algorithm: aggregation
    formula: |
      # VARIANT A — provisional_estimate -> Project.provisional_cost_cents
      provisional_cost_cents =
          sum(BudgetLine.extended_cents            where status IN {PLANNED, COMMITTED})
        + sum(TalentEngagement.total_comp_cents    where status IN {DRAFT, CONFIRMED, COMPLETED})
        + sum(CrewBooking.cost_cents               where status IN {HELD, CONFIRMED, COMPLETED})
        + sum(EquipmentReservation.total_cost_cents where status IN {RESERVED, RETURNED})
        + sum(ChangeOrder.amount_cents             where status IN {PENDING_APPROVAL, APPROVED})

      # VARIANT B — committed_actual -> Project.committed_cost_cents
      committed_cost_cents =
          sum(BudgetLine.extended_cents            where status == COMMITTED)
        + sum(TalentEngagement.total_comp_cents    where status IN {CONFIRMED, COMPLETED})
        + sum(CrewBooking.cost_cents               where status IN {CONFIRMED, COMPLETED})
        + sum(EquipmentReservation.total_cost_cents where status IN {RESERVED, RETURNED})
        + sum(ChangeOrder.amount_cents             where status == APPROVED)

      budget_variance_cents = provisional_cost_cents - approved_budget_cents
                              (0 while approved_budget_cents is null)
    input_set: |
      Rows whose FK chain reaches the Project: BudgetLine.project_id, TalentEngagement.project_id,
      ShootDay.project_id -> CrewBooking.shoot_day_id, ShootDay.project_id -> EquipmentReservation.shoot_day_id,
      Deliverable.project_id -> ChangeOrder.deliverable_id. ShootDay.day_cost_cents and
      ComplianceCert.fee_cents are display-only and NEVER enter either variant (no double counting).
      RELEASED CrewBookings, RELEASED EquipmentReservations, REJECTED and VOIDED ChangeOrders are
      excluded from both variants. Both sums are order-independent; no tie-break is needed.
    constants: {}
    precision: "whole cents; every addend is already an integer, so no rounding occurs at roll-up time"
    variants:
      - name: provisional_estimate
        when: "Every read of Project.provisional_cost_cents, and every fiscal gate on a commitment-creating endpoint"
        difference: "Includes not-yet-committed rows: PLANNED lines, DRAFT engagements, HELD bookings, PENDING_APPROVAL change orders"
      - name: committed_actual
        when: "Every read of Project.committed_cost_cents and the Rule 9 conservation invariant"
        difference: "Excludes exactly those four not-yet-committed status sets, so identical data yields a strictly smaller number whenever any such row exists"

  - name: talent_compensation
    trigger: "On POST /talent-engagements (PROVISIONAL basis) and again on POST /talent-engagements/{id}/confirm (FINAL basis)"
    algorithm: tiered_pricing
    formula: |
      # ---- basis selection (this is what makes provisional and final diverge) ----
      if comp_basis == PROVISIONAL:
          channel_basis_count = count(distinct members of Project.channel_scope)
          term_basis_months   = Project.usage_term_months
      else:  # FINAL, evaluated at confirmation
          channel_basis_count = count(distinct Deliverable.channel where Deliverable.project_id == project_id)
          term_basis_months   = max(Deliverable.usage_rights_months where Deliverable.project_id == project_id)

      base_fee_cents = session_fee_cents * session_days

      # ---- variant family USAGE_BUYOUT ----
      channel_mult = BUYOUT_CHANNEL_MULT[min(channel_basis_count, 4)]
      term_mult    = 1.00 if term_basis_months <= 12
                     else 1.35 if term_basis_months <= 24
                     else 1.65 if term_basis_months <= 36
                     else 2.00
      usage_load_cents     = round_half_up(base_fee_cents * channel_mult * term_mult)
      reuse_cycles         = 0
      reuse_fee_cents      = 0
      pension_health_cents = 0
      agent_fee_cents      = round_half_up((base_fee_cents + usage_load_cents) * AGENT_FEE_PCT)
      total_comp_cents     = base_fee_cents + usage_load_cents + agent_fee_cents

      # ---- variant family UNION_SESSION_REUSE ----
      usage_load_cents     = 0
      reuse_cycles         = ceil(term_basis_months * 30 / REUSE_CYCLE_DAYS)
      reuse_fee_cents      = round_half_up(base_fee_cents * REUSE_CYCLE_PCT * max(0, reuse_cycles - 1))
      pension_health_cents = round_half_up((base_fee_cents + reuse_fee_cents) * UNION_PENSION_HEALTH_PCT)
      agent_fee_cents      = round_half_up((base_fee_cents + reuse_fee_cents) * AGENT_FEE_PCT)
      total_comp_cents     = base_fee_cents + reuse_fee_cents + pension_health_cents + agent_fee_cents

      # PINNED ROUNDING ORDER: every component is rounded to whole cents on its own,
      # THEN the components are summed. The sum itself is never re-rounded.
    input_set: "One TalentEngagement row plus, on the FINAL basis, every Deliverable of its Project regardless of Deliverable.status"
    constants:
      BUYOUT_CHANNEL_MULT: { 1: 0.50, 2: 0.85, 3: 1.20, 4: 1.60 }
      AGENT_FEE_PCT: 0.10
      UNION_PENSION_HEALTH_PCT: 0.1975
      REUSE_CYCLE_PCT: 0.35
      REUSE_CYCLE_DAYS: 91
    precision: "whole cents, round_half_up, per component"
    variants:
      - name: usage_buyout_provisional
        when: "compensation_model == USAGE_BUYOUT and comp_basis == PROVISIONAL"
        difference: "session_fee 250000 x 2 days, channel_scope of 3, term 24 months -> base 500000, usage_load 810000, agent_fee 131000, total 1441000"
      - name: usage_buyout_final
        when: "compensation_model == USAGE_BUYOUT and comp_basis == FINAL"
        difference: "Same row after confirmation when the project's deliverables cover only 2 distinct channels and max usage_rights_months is 24 -> usage_load 573750, agent_fee 107375, total 1181125 (259875 lower than the provisional figure on identical inputs)"
      - name: union_session_reuse_provisional
        when: "compensation_model == UNION_SESSION_REUSE and comp_basis == PROVISIONAL"
        difference: "Same session inputs with term 24 months -> 8 reuse cycles, reuse_fee 1225000, pension_health 340688, agent_fee 172500, total 2238188"
      - name: union_session_reuse_final
        when: "compensation_model == UNION_SESSION_REUSE and comp_basis == FINAL"
        difference: "Same row after confirmation when max Deliverable.usage_rights_months is 12 -> 4 reuse cycles, reuse_fee 525000, pension_health 202438, agent_fee 102500, total 1329938"

  - name: change_order_amount
    trigger: "On ChangeOrder creation (system cascade from a REQUEST_CHANGES review decision, or from POST /deliverables after scope lock); never recomputed afterwards"
    algorithm: threshold
    formula: |
      labor_cents = EXTRA_ROUND_LABOR_CENTS * additional_rounds_granted
                    if trigger_reason == REVISION_ROUND_EXCEEDED
                    else NEW_DELIVERABLE_LABOR_CENTS          # additional_rounds_granted is 0 here

      days_to_air = floor((Deliverable.air_date - clock now) / 86400 seconds)   # may be negative
      rush_pct    = 0.25 if days_to_air <= 7
                    else 0.15 if days_to_air <= 14
                    else 0.00
      rush_cents  = round_half_up(labor_cents * rush_pct)

      subtotal_cents = labor_cents + rush_cents

      # EVALUATION ORDER IS PINNED HERE. producer_fee_pct is keyed on
      # subtotal_cents (pre-fee) and NEVER on amount_cents, even though
      # amount_cents is what the client is invoiced. Keying the tier on
      # amount_cents would be self-referential and yields a different number.
      producer_fee_pct   = 0.12 if subtotal_cents >= 1000000
                           else 0.15 if subtotal_cents >= 500000
                           else 0.18
      producer_fee_cents = round_half_up(subtotal_cents * producer_fee_pct)
      amount_cents       = subtotal_cents + producer_fee_cents
    input_set: "One ChangeOrder row plus its Deliverable's air_date and the logical clock at creation time"
    constants:
      EXTRA_ROUND_LABOR_CENTS: 480000
      NEW_DELIVERABLE_LABOR_CENTS: 620000
      RUSH_TIER_7_DAY_PCT: 0.25
      RUSH_TIER_14_DAY_PCT: 0.15
    precision: "whole cents, round_half_up, once for rush_cents and once for producer_fee_cents"
    variants:
      - name: subtotal_keyed_fee
        when: "Always — the pinned order"
        difference: "labor 480000 with rush_pct 0.00 gives subtotal 480000, which sits in the < 500000 band -> 18% -> fee 86400 -> amount 566400"
      - name: total_keyed_fee
        when: "Never — documented only to name the trap"
        difference: "Keying the tier on the 566400 total would select the >= 500000 band -> 15% -> fee 72000 -> amount 552000, a 14400-cent divergence on identical inputs"

  - name: crew_booking_cost
    trigger: "On POST /crew-bookings; the value is frozen on the row and reused by every ledger movement of that booking"
    algorithm: tiered_pricing
    formula: |
      scheduled_hours = (wrap_time - call_time) / 3600 seconds        # exact rational, 2 dp
      h = scheduled_hours
      r = CrewMember.hourly_rate_cents

      straight_time_cents  = min(h, STRAIGHT_TIME_HOURS) * r
      overtime_tier1_cents = min(max(h - STRAIGHT_TIME_HOURS, 0), OT1_SPAN_HOURS) * r * OT1_MULT
      overtime_tier2_cents = max(h - (STRAIGHT_TIME_HOURS + OT1_SPAN_HOURS), 0) * r * OT2_MULT

      # PINNED ROUNDING ORDER, deliberately the OPPOSITE of
      # budget_line_extended_cents: the three components are summed as exact
      # rationals and the SUM is rounded exactly once.
      cost_cents = round_half_up(straight_time_cents + overtime_tier1_cents + overtime_tier2_cents)
    input_set: "One CrewBooking row plus the hourly_rate_cents of its CrewMember; no other bookings participate"
    constants:
      STRAIGHT_TIME_HOURS: 10
      OT1_SPAN_HOURS: 2
      OT1_MULT: 1.5
      OT2_MULT: 2.0
    precision: "whole cents, round_half_up, applied once to the summed components"
    variants: []

  - name: shoot_day_compliance_posture
    trigger: "Recomputed on ShootDay read and before every ShootDay confirm / call-sheet publish gate, and as a cascade of any ComplianceCert decision or CrewBooking status change"
    algorithm: threshold
    formula: |
      permit_ok = exists ComplianceCert cert where
                    cert.shoot_day_id == ShootDay.id
                    AND cert.cert_type == FILM_PERMIT
                    AND cert.status == ISSUED
                    AND cert.effective_from <= ShootDay.call_time
                    AND cert.effective_to   >= ShootDay.wrap_time
                    AND clock now <= cert.effective_to           # i.e. effective_status != EXPIRED

      coi_ok    = exists ComplianceCert cert where
                    cert.project_id == ShootDay.project_id
                    AND cert.cert_type == LIABILITY_COI
                    AND cert.status == ISSUED
                    AND cert.coverage_amount_cents >= Location.insurance_minimum_cents
                    AND cert.effective_from <= ShootDay.call_time
                    AND cert.effective_to   >= ShootDay.wrap_time
                    AND clock now <= cert.effective_to

      confirmed_crew_count = count(CrewBooking where shoot_day_id == ShootDay.id
                                   AND status IN {CONFIRMED, COMPLETED})

      compliance_posture = BLOCKED    if not (permit_ok and coi_ok)
                           RESTRICTED if permit_ok and coi_ok and confirmed_crew_count < MIN_CONFIRMED_CREW_FOR_CALL_SHEET
                           OPEN       otherwise
    input_set: "One ShootDay, its Location, every ComplianceCert reachable by shoot_day_id or by project_id, and every CrewBooking of the shoot day. An empty CrewBooking set yields confirmed_crew_count == 0, which is RESTRICTED (never OPEN)."
    constants:
      MIN_CONFIRMED_CREW_FOR_CALL_SHEET: 3
    precision: "integer count comparison; the crew threshold is a strict `<` so exactly 3 confirmed bookings clears it"
    variants: []

  - name: version_qc_evaluation
    trigger: "On POST /deliverable-versions/{id}/qc"
    algorithm: constraint_propagation
    formula: |
      findings = []                                  # order is PINNED as written below
      if version.aspect_ratio != deliverable.aspect_ratio:
          findings.append("ASPECT_RATIO_MISMATCH")
      if abs(version.duration_seconds - deliverable.target_duration_seconds) > DURATION_TOLERANCE_SECONDS:
          findings.append("DURATION_OUT_OF_TOLERANCE")
      if deliverable.caption_requirement != NONE and
         (version.has_captions == false or version.caption_format != deliverable.caption_requirement):
          findings.append("CAPTION_REQUIREMENT_UNMET")
      if deliverable.caption_requirement == NONE and version.has_captions == true:
          findings.append("UNREQUESTED_CAPTION_ASSET")

      technical_status    = QC_PASSED if findings is empty else QC_FAILED
      qc_failure_reasons  = findings
    input_set: "One DeliverableVersion row and its parent Deliverable's spec columns"
    constants:
      DURATION_TOLERANCE_SECONDS: 1
    precision: "The tolerance comparison is `abs(delta) > 1` — a delta of exactly 1 second PASSES, a delta of 2 seconds FAILS"
    variants: []

  - name: equipment_reservation_cost
    trigger: "On POST /equipment-reservations"
    algorithm: aggregation
    formula: |
      span_hours       = (return_at - pickup_at) / 3600 seconds
      rental_days      = max(1, ceil(span_hours / 24))
      total_cost_cents = unit_count * daily_rate_cents * rental_days
    input_set: "One EquipmentReservation row"
    constants:
      PREP_WINDOW_HOURS: 48
      RETURN_WINDOW_HOURS: 48
    precision: "integer cents; rental_days is a ceiling so any partial day bills as a full day"
    variants: []

  - name: shoot_day_cost
    trigger: "Recomputed on ShootDay read and after any CrewBooking or EquipmentReservation status change on that day"
    algorithm: aggregation
    formula: |
      day_cost_cents = Location.daily_fee_cents
                     + sum(CrewBooking.cost_cents          where shoot_day_id == ShootDay.id AND status IN {CONFIRMED, COMPLETED})
                     + sum(EquipmentReservation.total_cost_cents where shoot_day_id == ShootDay.id AND status IN {RESERVED, RETURNED})
    input_set: "One ShootDay, its Location, and its non-released children"
    constants: {}
    precision: "integer cents"
    variants:
      - name: display_only
        when: "Always"
        difference: "This figure is never added into Project.provisional_cost_cents or Project.committed_cost_cents; the location fee reaches the project ledger only through a BudgetLine of category LOCATION"

  - name: round_entitlement_balance
    trigger: "Recomputed on every review decision, on every ChangeOrder decision, and on Project read"
    algorithm: aggregation
    formula: |
      round_entitlement_balance =
            Project.contracted_revision_rounds
          + sum(ChangeOrder.additional_rounds_granted
                where ChangeOrder.status == APPROVED
                  AND ChangeOrder.deliverable_id IN (Deliverable ids of this project))
          - sum(Deliverable.consumed_review_rounds where project_id == Project.id)

      # Per-deliverable gate used by the submit precondition:
      Deliverable.granted_extra_rounds = sum(ChangeOrder.additional_rounds_granted
                                             where deliverable_id == Deliverable.id AND status == APPROVED)
      Deliverable.round_entitlement    = Project.contracted_revision_rounds + Deliverable.granted_extra_rounds
    input_set: "The Project, every Deliverable of the project, and every ChangeOrder of those deliverables; PENDING_APPROVAL, REJECTED and VOIDED change orders contribute zero"
    constants: {}
    precision: "integer count; may go negative only if a VOID removes rounds already consumed, which the VOID edge permits and the invariant tracks"
    variants: []

  - name: commitment_budget_allowance
    trigger: "Evaluated before persisting any commitment-creating write: POST /budget-lines, POST /talent-engagements, POST /crew-bookings, POST /equipment-reservations"
    algorithm: threshold
    formula: |
      allowance_cents = Project.budget_ceiling_cents
                        if Project.status IN {DRAFT, SCOPED}
                        else round_half_up(Project.budget_ceiling_cents * (1 + OVERAGE_TOLERANCE_PCT))
                        # i.e. IN_PRODUCTION, IN_POST and any later status
                        # i.e. after approve-budget the project may run 5% hot

      projected_provisional_cents = Project.provisional_cost_cents
                                    + (the provisional contribution the new row would add)

      reject with ERR_BUDGET_CEILING_EXCEEDED when
          projected_provisional_cents > allowance_cents      # strictly greater; equality passes
    input_set: "The Project's current provisional ledger plus the single row being created; no other pending writes participate"
    constants:
      OVERAGE_TOLERANCE_PCT: 0.05
    precision: "whole cents; the tolerance multiplication is rounded half-up once (ceiling 300000 -> allowance 315000)"
    variants:
      - name: pre_approval_strict
        when: "Project.status IN {DRAFT, SCOPED}"
        difference: "allowance equals budget_ceiling_cents exactly; no tolerance"
      - name: post_approval_tolerant
        when: "Project.status IN {IN_PRODUCTION, IN_POST}"
        difference: "allowance is the ceiling grossed up by 5%, so the identical write is accepted after approval and rejected before it"

  - name: raw_footage_retention_window
    trigger: "On POST /projects/{id}/handover"
    algorithm: decay_function
    formula: |
      handover_at         = clock now
      retention_expires_at = handover_at + (Project.raw_footage_retention_months * RETENTION_MONTH_DAYS) days
      archive_status       = NOT_PACKAGED       if handover_at is null
                             RETENTION_EXPIRED  if clock now > retention_expires_at
                             HANDED_OVER        otherwise
    input_set: "One Project row and the logical clock"
    constants:
      RETENTION_MONTH_DAYS: 30
    precision: "Whole days added to the handover instant; calendar month lengths are deliberately NOT used, so 12 months is exactly 360 days"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
#   Domain ordering of business rules: production safety / compliance first,
#   then temporal feasibility of a shoot day, then scope & entitlement
#   constraints, then referential rights coherence, and money LAST — a shoot
#   that is illegal or unstaffable must be refused for that reason even when
#   it also blows the budget.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the six roles declared in §1.7; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "A CrewMember caller may only read CrewBooking rows whose crew_member_id equals its X-User-ID; GET /crew-bookings without a crew_member_id filter, or with a different crew_member_id, is refused"
    error_id: ERR_CREW_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "GET /crew-bookings, GET /crew-bookings/{id}"

  - priority: 4
    category: auth
    check: "Request body parses, every required input field of the endpoint is present and of the declared type, enum fields carry a declared member, monetary and count fields are non-negative integers, and interval fields satisfy start < end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: auth
    check: "limit is an integer in 1..100 and offset is an integer >= 0 on every list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "GET /deliverable-versions, GET /shoot-days, GET /compliance-certs, GET /crew-bookings"

  - priority: 6
    category: existence
    check: "project_id in the path or payload resolves to a Project"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "GET /projects/{id}, GET /projects/{id}/budget-lines, GET /projects/{id}/deliverables, GET /projects/{id}/talent-engagements, POST /projects/{id}/lock-scope, POST /projects/{id}/approve-budget, POST /projects/{id}/handover, POST /budget-lines, POST /deliverables, POST /talent-engagements, POST /shoot-days, POST /compliance-certs"

  - priority: 7
    category: existence
    check: "deliverable_id in the path or payload resolves to a Deliverable"
    error_id: ERR_DELIVERABLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /deliverables/{id}, GET /deliverables/{id}/change-orders, POST /deliverable-versions"

  - priority: 8
    category: existence
    check: "version_id in the path resolves to a DeliverableVersion; supersedes_version_id in the payload, when present, resolves to a DeliverableVersion"
    error_id: ERR_DELIVERABLE_VERSION_NOT_FOUND
    http_status: 404
    applies_to: "GET /deliverable-versions/{id}, POST /deliverable-versions, POST /deliverable-versions/{id}/qc, POST /deliverable-versions/{id}/submit, POST /deliverable-versions/{id}/review-decision"

  - priority: 9
    category: existence
    check: "change_order_id in the path resolves to a ChangeOrder"
    error_id: ERR_CHANGE_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /change-orders/{id}/decision"

  - priority: 10
    category: existence
    check: "shoot_day_id in the path or payload resolves to a ShootDay"
    error_id: ERR_SHOOT_DAY_NOT_FOUND
    http_status: 404
    applies_to: "GET /shoot-days/{id}, GET /shoot-days/{id}/equipment-reservations, POST /shoot-days/{id}/confirm, POST /shoot-days/{id}/publish-call-sheet, POST /shoot-days/{id}/cancel, POST /shoot-days/{id}/wrap, POST /crew-bookings, POST /equipment-reservations, POST /compliance-certs"

  - priority: 11
    category: existence
    check: "location_id in the path or payload resolves to a Location"
    error_id: ERR_LOCATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /locations/{id}, POST /shoot-days"

  - priority: 12
    category: existence
    check: "crew_member_id in the path or payload resolves to a CrewMember"
    error_id: ERR_CREW_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "GET /crew-members/{id}, POST /crew-bookings"

  - priority: 13
    category: existence
    check: "crew_booking_id in the path resolves to a CrewBooking"
    error_id: ERR_CREW_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "GET /crew-bookings/{id}, POST /crew-bookings/{id}/confirm, POST /crew-bookings/{id}/release"

  - priority: 14
    category: existence
    check: "cert_id in the path resolves to a ComplianceCert; engagement_id in the path resolves to a TalentEngagement"
    error_id: ERR_COMPLIANCE_CERT_NOT_FOUND
    http_status: 404
    applies_to: "GET /compliance-certs/{id}, POST /compliance-certs/{id}/decision"

  - priority: 15
    category: existence
    check: "engagement_id in the path resolves to a TalentEngagement"
    error_id: ERR_TALENT_ENGAGEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /talent-engagements/{id}/confirm"

  - priority: 16
    category: state
    check: "expected_deliverable_version in the payload equals the current Deliverable.version of the parent deliverable (§1.2.1 rule version-create-stale-deliverable)"
    error_id: ERR_STALE_DELIVERABLE_VERSION
    http_status: 412
    applies_to: "POST /deliverable-versions"

  - priority: 17
    category: state
    check: "Project.status permits the operation: lock-scope requires DRAFT; approve-budget requires SCOPED; budget-line creation requires DRAFT, SCOPED, IN_PRODUCTION or IN_POST; talent-engagement creation requires DRAFT, SCOPED or IN_PRODUCTION; deliverable creation requires DRAFT, SCOPED, IN_PRODUCTION or IN_POST; shoot-day creation requires SCOPED or IN_PRODUCTION; shoot-day confirm requires IN_PRODUCTION; version submit and review-decision require IN_PRODUCTION or IN_POST; handover requires DELIVERED"
    error_id: ERR_PROJECT_STATE_INVALID
    http_status: 409
    applies_to: "POST /projects/{id}/lock-scope, POST /projects/{id}/approve-budget, POST /projects/{id}/handover, POST /budget-lines, POST /deliverables, POST /talent-engagements, POST /shoot-days, POST /deliverable-versions/{id}/submit, POST /deliverable-versions/{id}/review-decision, POST /shoot-days/{id}/confirm"

  - priority: 18
    category: state
    check: "Deliverable.status permits the operation: version creation requires PENDING, IN_REVIEW or CHANGES_REQUESTED; an APPROVED or HANDED_OVER deliverable accepts no further versions"
    error_id: ERR_DELIVERABLE_STATE_INVALID
    http_status: 409
    applies_to: "POST /deliverable-versions"

  - priority: 19
    category: state
    check: "DeliverableVersion.review_status permits the operation: submit requires DRAFT; review-decision requires SUBMITTED; a SUPERSEDED, APPROVED or CHANGES_REQUESTED version accepts neither"
    error_id: ERR_VERSION_REVIEW_STATE_INVALID
    http_status: 409
    applies_to: "POST /deliverable-versions/{id}/submit, POST /deliverable-versions/{id}/review-decision"

  - priority: 20
    category: state
    check: "QC may be recorded exactly once per version: technical_status must be PENDING_QC"
    error_id: ERR_QC_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /deliverable-versions/{id}/qc"

  - priority: 21
    category: state
    check: "A version may only be submitted for review when its technical_status is QC_PASSED; PENDING_QC and QC_FAILED are both refused"
    error_id: ERR_VERSION_QC_NOT_PASSED
    http_status: 409
    applies_to: "POST /deliverable-versions/{id}/submit"

  - priority: 22
    category: state
    check: "ShootDay.status permits the operation: confirm requires PLANNED; publish-call-sheet requires CONFIRMED; wrap requires CONFIRMED; cancel requires PLANNED or CONFIRMED; crew-booking and equipment-reservation creation require PLANNED or CONFIRMED"
    error_id: ERR_SHOOT_DAY_STATE_INVALID
    http_status: 409
    applies_to: "POST /shoot-days/{id}/confirm, POST /shoot-days/{id}/publish-call-sheet, POST /shoot-days/{id}/cancel, POST /shoot-days/{id}/wrap, POST /crew-bookings, POST /equipment-reservations"

  - priority: 23
    category: state
    check: "CrewBooking.status permits the operation: confirm requires HELD; release requires HELD or CONFIRMED; a COMPLETED or RELEASED booking accepts neither"
    error_id: ERR_CREW_BOOKING_STATE_INVALID
    http_status: 409
    applies_to: "POST /crew-bookings/{id}/confirm, POST /crew-bookings/{id}/release"

  - priority: 24
    category: state
    check: "ComplianceCert.status must be SUBMITTED for a decision to be recorded; ISSUED and DENIED are terminal"
    error_id: ERR_COMPLIANCE_CERT_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance-certs/{id}/decision"

  - priority: 25
    category: state
    check: "ChangeOrder.status must be PENDING_APPROVAL for an APPROVE or REJECT decision, and APPROVED for a VOID decision"
    error_id: ERR_CHANGE_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /change-orders/{id}/decision"

  - priority: 26
    category: state
    check: "TalentEngagement.status must be DRAFT for confirmation"
    error_id: ERR_TALENT_ENGAGEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /talent-engagements/{id}/confirm"

  - priority: 27
    category: state
    check: "A project may be handed over only once: Project.archive_status must be NOT_PACKAGED"
    error_id: ERR_ARCHIVE_ALREADY_HANDED_OVER
    http_status: 409
    applies_to: "POST /projects/{id}/handover"

  - priority: 28
    category: business_safety
    check: "Segregation of duties on X-User-ID: the user who submitted a version may not record its review decision; the user who requested a change order may not decide it; the user who submitted a compliance cert may not decide it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /deliverable-versions/{id}/review-decision, POST /change-orders/{id}/decision, POST /compliance-certs/{id}/decision"

  - priority: 29
    category: business_safety
    check: "The shoot day's FILM_PERMIT must be ISSUED and its effective window must cover [call_time, wrap_time] with clock now at or before effective_to"
    error_id: ERR_PERMIT_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /shoot-days/{id}/confirm, POST /shoot-days/{id}/publish-call-sheet"

  - priority: 30
    category: business_safety
    check: "An ISSUED LIABILITY_COI covering [call_time, wrap_time] must exist on the project with coverage_amount_cents >= Location.insurance_minimum_cents"
    error_id: ERR_INSUFFICIENT_COI_COVERAGE
    http_status: 422
    applies_to: "POST /shoot-days/{id}/confirm, POST /shoot-days/{id}/publish-call-sheet"

  - priority: 31
    category: business_safety
    check: "compliance_posture must not be BLOCKED at the moment of the operation (re-evaluated live, so a cert that expired after confirmation blocks the later publish)"
    error_id: ERR_COMPLIANCE_POSTURE_BLOCKED
    http_status: 422
    applies_to: "POST /shoot-days/{id}/publish-call-sheet, POST /shoot-days/{id}/wrap"

  - priority: 32
    category: business_safety
    check: "confirmed_crew_count must be at least MIN_CONFIRMED_CREW_FOR_CALL_SHEET (3) before a call sheet is published; an empty booking set counts as 0"
    error_id: ERR_MIN_CREW_NOT_MET
    http_status: 422
    applies_to: "POST /shoot-days/{id}/publish-call-sheet"

  - priority: 33
    category: business_temporal
    check: "A call sheet may only be published while clock now is at or before call_time minus CALL_SHEET_LEAD_HOURS (12h); publishing inside the lead window is refused"
    error_id: ERR_CALL_SHEET_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /shoot-days/{id}/publish-call-sheet"

  - priority: 34
    category: business_temporal
    check: "The crew member has no other HELD or CONFIRMED booking whose [call_time, wrap_time] CLOSED interval intersects the requested booking's closed interval; touching endpoints count as an intersection, so a booking that starts exactly when another ends is refused"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /crew-bookings"

  - priority: 35
    category: business_temporal
    check: "For every other HELD or CONFIRMED booking of the same crew member, the rest gap between the two non-overlapping intervals (requested.call_time minus other.wrap_time, or other.call_time minus requested.wrap_time, whichever is the positive one) is at least CrewMember.min_turnaround_hours; a gap of exactly min_turnaround_hours passes and 8.5 hours against a 10-hour minimum is refused"
    error_id: ERR_CREW_TURNAROUND_VIOLATION
    http_status: 409
    applies_to: "POST /crew-bookings"

  - priority: 36
    category: business_temporal
    check: "pickup_at must be no earlier than call_time minus PREP_WINDOW_HOURS (48h) and return_at no later than wrap_time plus RETURN_WINDOW_HOURS (48h)"
    error_id: ERR_EQUIPMENT_WINDOW_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /equipment-reservations"

  - priority: 37
    category: business_constraint
    check: "The count of PLANNED or CONFIRMED shoot days at this Location whose [call_time, wrap_time) half-open interval overlaps the requested one must be strictly less than Location.stage_count; back-to-back days that merely touch at an endpoint do not overlap"
    error_id: ERR_LOCATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /shoot-days"

  - priority: 38
    category: business_constraint
    check: "A cut may be submitted only while Deliverable.consumed_review_rounds is STRICTLY LESS than Deliverable.round_entitlement (contracted_revision_rounds + rounds granted by APPROVED change orders); the cut being submitted takes round_index = consumed_review_rounds + 1"
    error_id: ERR_REVISION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /deliverable-versions/{id}/submit"

  - priority: 39
    category: business_constraint
    check: "No new version may be submitted while Project.review_gate is CHANGE_ORDER_PENDING (a change order awaiting a decision freezes the review loop)"
    error_id: ERR_CHANGE_ORDER_PENDING
    http_status: 409
    applies_to: "POST /deliverable-versions/{id}/submit"

  - priority: 40
    category: business_constraint
    check: "Scope lock requires the project to carry at least one Deliverable AND at least one BudgetLine"
    error_id: ERR_SCOPE_INCOMPLETE
    http_status: 422
    applies_to: "POST /projects/{id}/lock-scope"

  - priority: 41
    category: business_referential
    check: "Deliverable.channel must be a member of Project.channel_scope"
    error_id: ERR_CHANNEL_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /deliverables"

  - priority: 42
    category: business_referential
    check: "Deliverable.usage_rights_months must not exceed Project.usage_term_months"
    error_id: ERR_USAGE_RIGHTS_EXCEED_TERM
    http_status: 422
    applies_to: "POST /deliverables"

  - priority: 43
    category: business_referential
    check: "A TalentEngagement whose union_affiliation is UNION must use compensation_model UNION_SESSION_REUSE, and a NON_UNION engagement must use USAGE_BUYOUT"
    error_id: ERR_TALENT_COMP_MODEL_INVALID
    http_status: 422
    applies_to: "POST /talent-engagements"

  - priority: 44
    category: business_referential
    check: "supersedes_version_id, when present, must reference a version of the same Deliverable, and that version's review_status must be CHANGES_REQUESTED"
    error_id: ERR_VERSION_DELIVERABLE_MISMATCH
    http_status: 422
    applies_to: "POST /deliverable-versions"

  - priority: 45
    category: business_referential
    check: "A FILM_PERMIT cert must carry a shoot_day_id belonging to the named project; a LIABILITY_COI cert must omit shoot_day_id"
    error_id: ERR_CERT_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /compliance-certs"

  - priority: 46
    category: business_fiscal
    check: "Projected provisional cost after this write must not exceed the allowance from commitment_budget_allowance (ceiling before budget approval, ceiling x 1.05 after); evaluated LAST so a state or safety defect always reports first"
    error_id: ERR_BUDGET_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /budget-lines, POST /talent-engagements, POST /crew-bookings, POST /equipment-reservations"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
#   api_prefix is "" so every path below is absolute. All list endpoints
#   accept limit? / offset?, set response_type "array", return the rows as the
#   envelope's `data` array (so `$.data[0]` is the first row), and carry
#   limit / offset / total_count / has_more as the §1.0 pagination fields.
# ---------------------------------------------------------------------------
endpoints:
  # ---------------------------- reads: Project ----------------------------
  - method: GET
    path: "/projects/{id}"
    description: "Read one project with its live provisional/committed ledger, budget variance, round entitlement balance, review gate and archive status"
    roles: [ProductionCoordinator, LineProducer, PostSupervisor, ClientApprover, ComplianceOfficer]
    code: 200
    input: []
    output: Project
    side_effects: ["recomputes provisional_cost_cents, committed_cost_cents, budget_variance_cents, round_entitlement_balance, review_gate, archive_status and retention_expires_at for the response"]

  - method: GET
    path: "/projects/{id}/budget-lines"
    description: "List every budget line of a project (reverse reachability for BudgetLine.project_id)"
    roles: [ProductionCoordinator, LineProducer, ClientApprover]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: BudgetLine[]
    side_effects: []

  - method: GET
    path: "/projects/{id}/deliverables"
    description: "List every deliverable of a project (reverse reachability for Deliverable.project_id)"
    roles: [ProductionCoordinator, LineProducer, PostSupervisor, ClientApprover]
    code: 200
    input: ["status?", "channel?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []

  - method: GET
    path: "/projects/{id}/talent-engagements"
    description: "List every talent engagement of a project (reverse reachability for TalentEngagement.project_id)"
    roles: [ProductionCoordinator, LineProducer]
    code: 200
    input: ["status?", "compensation_model?", "limit?", "offset?"]
    output: TalentEngagement[]
    side_effects: []

  # ------------------------ reads: deliverable side ------------------------
  - method: GET
    path: "/deliverables/{id}"
    description: "Read one deliverable including consumed_review_rounds, granted_extra_rounds, round_entitlement and version_count"
    roles: [ProductionCoordinator, LineProducer, PostSupervisor, ClientApprover]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["recomputes consumed_review_rounds, granted_extra_rounds, round_entitlement and version_count for the response"]

  - method: GET
    path: "/deliverables/{id}/change-orders"
    description: "List change orders raised against a deliverable, newest last (reverse reachability for ChangeOrder.deliverable_id); the only channel through which a cascade-created change order can be discovered"
    roles: [ProductionCoordinator, LineProducer, ClientApprover]
    code: 200
    input: ["status?", "trigger_reason?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: GET
    path: "/deliverable-versions/{id}"
    description: "Read one cut with its QC verdict, failure reasons, review status and audit user ids"
    roles: [ProductionCoordinator, LineProducer, PostSupervisor, ClientApprover]
    code: 200
    input: []
    output: DeliverableVersion
    side_effects: []

  - method: GET
    path: "/deliverable-versions"
    description: "Filtered list of cuts; reverse reachability for DeliverableVersion.deliverable_id and for the self-referential DeliverableVersion.supersedes_version_id, ordered by created_at ASC"
    roles: [ProductionCoordinator, LineProducer, PostSupervisor, ClientApprover]
    code: 200
    input: ["deliverable_id?", "supersedes_version_id?", "review_status?", "technical_status?", "limit?", "offset?"]
    output: DeliverableVersion[]
    side_effects: []

  # -------------------------- reads: physical side --------------------------
  - method: GET
    path: "/locations/{id}"
    description: "Read one location with its derived scouting_status and scheduled_shoot_day_count"
    roles: [ProductionCoordinator, LineProducer, ComplianceOfficer]
    code: 200
    input: []
    output: Location
    side_effects: ["recomputes scheduled_shoot_day_count and scouting_status for the response"]

  - method: GET
    path: "/shoot-days/{id}"
    description: "Read one shoot day with live compliance_posture, confirmed_crew_count and day_cost_cents"
    roles: [ProductionCoordinator, LineProducer, ComplianceOfficer, CrewMember]
    code: 200
    input: []
    output: ShootDay
    side_effects: ["recomputes compliance_posture, confirmed_crew_count and day_cost_cents for the response"]

  - method: GET
    path: "/shoot-days"
    description: "Filtered list of shoot days; reverse reachability for ShootDay.project_id and ShootDay.location_id, ordered by call_time ASC then created_at ASC"
    roles: [ProductionCoordinator, LineProducer, ComplianceOfficer]
    code: 200
    input: ["project_id?", "location_id?", "status?", "limit?", "offset?"]
    output: ShootDay[]
    side_effects: []

  - method: GET
    path: "/shoot-days/{id}/equipment-reservations"
    description: "List kit reserved for a shoot day (reverse reachability for EquipmentReservation.shoot_day_id)"
    roles: [ProductionCoordinator, LineProducer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EquipmentReservation[]
    side_effects: []

  - method: GET
    path: "/compliance-certs/{id}"
    description: "Read one permit or certificate of insurance with its derived effective_status"
    roles: [ProductionCoordinator, LineProducer, ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceCert
    side_effects: ["recomputes effective_status against the logical clock for the response"]

  - method: GET
    path: "/compliance-certs"
    description: "Filtered list of certificates; reverse reachability for ComplianceCert.project_id and the nullable ComplianceCert.shoot_day_id, ordered by created_at ASC"
    roles: [ProductionCoordinator, LineProducer, ComplianceOfficer]
    code: 200
    input: ["project_id?", "shoot_day_id?", "cert_type?", "status?", "limit?", "offset?"]
    output: ComplianceCert[]
    side_effects: []

  - method: GET
    path: "/crew-members/{id}"
    description: "Read one crew member including hourly_rate_cents and min_turnaround_hours"
    roles: [ProductionCoordinator, LineProducer, CrewMember]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  - method: GET
    path: "/crew-bookings/{id}"
    description: "Read one crew booking with its frozen cost breakdown; a CrewMember caller may only read a booking whose crew_member_id equals its X-User-ID"
    roles: [ProductionCoordinator, LineProducer, CrewMember]
    code: 200
    input: []
    output: CrewBooking
    side_effects: []

  - method: GET
    path: "/crew-bookings"
    description: "Filtered list of bookings; reverse reachability for CrewBooking.shoot_day_id and CrewBooking.crew_member_id, ordered by call_time ASC then created_at ASC. A CrewMember caller MUST pass crew_member_id equal to its own X-User-ID"
    roles: [ProductionCoordinator, LineProducer, CrewMember]
    code: 200
    input: ["shoot_day_id?", "crew_member_id?", "status?", "limit?", "offset?"]
    output: CrewBooking[]
    side_effects: []

  # --------------------------- writes: Project ---------------------------
  - method: POST
    path: "/projects"
    description: "Open a new production project from a signed creative brief; status starts at DRAFT"
    roles: [LineProducer]
    code: 201
    input: ["client_name", "campaign_title", "creative_brief_summary", "channel_scope", "usage_term_months", "budget_ceiling_cents", "contracted_revision_rounds?", "raw_footage_retention_months?", "raw_footage_terabytes?"]
    output: Project
    side_effects: ["initialises provisional_cost_cents and committed_cost_cents to 0", "sets review_gate = OPEN and archive_status = NOT_PACKAGED", "sets round_entitlement_balance = contracted_revision_rounds"]

  - method: POST
    path: "/projects/{id}/lock-scope"
    description: "Freeze the creative scope: DRAFT -> SCOPED. Any deliverable added after this point raises a scope-addition change order"
    roles: [LineProducer]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status DRAFT -> SCOPED", "increments Project.version by 1"]

  - method: POST
    path: "/projects/{id}/approve-budget"
    description: "Client signs off the budget: SCOPED -> IN_PRODUCTION, and every PLANNED budget line commits"
    roles: [ClientApprover]
    code: 200
    input: ["approved_budget_cents"]
    output: Project
    side_effects: ["Project.status SCOPED -> IN_PRODUCTION", "cascade: every BudgetLine PLANNED -> COMMITTED", "recomputes committed_cost_cents and budget_variance_cents", "raises the fiscal allowance to budget_ceiling_cents x 1.05", "increments Project.version by 1"]

  - method: POST
    path: "/projects/{id}/handover"
    description: "Package the archive and hand assets to the client: DELIVERED -> ARCHIVED; starts the raw-footage retention clock"
    roles: [LineProducer]
    code: 200
    input: ["handover_recipient"]
    output: Project
    side_effects: ["Project.status DELIVERED -> ARCHIVED", "sets handover_at = clock now and archive_status = HANDED_OVER", "computes retention_expires_at = handover_at + raw_footage_retention_months x 30 days", "cascade: every APPROVED Deliverable -> HANDED_OVER", "increments Project.version by 1"]

  - method: POST
    path: "/budget-lines"
    description: "Add a crew, equipment, location, talent or post line to the project budget"
    roles: [LineProducer]
    code: 201
    input: ["project_id", "category", "description", "quantity", "unit_rate_cents", "markup_pct?"]
    output: BudgetLine
    side_effects: ["computes extended_cents per budget_line_extended_cents (markup rounded on this line, then summed into the project)", "status starts PLANNED, or auto-commits to COMMITTED when Project.status IN {IN_PRODUCTION, IN_POST}", "recomputes Project.provisional_cost_cents and, on auto-commit, Project.committed_cost_cents", "enforces commitment_budget_allowance last"]

  # -------------------------- writes: deliverables --------------------------
  - method: POST
    path: "/deliverables"
    description: "Register a deliverable format (channel, aspect ratio, length, caption requirement, usage term). Adding one after scope lock raises a DELIVERABLE_ADDED_AFTER_SCOPE_LOCK change order"
    roles: [ProductionCoordinator, LineProducer]
    code: 201
    input: ["project_id", "title", "channel", "aspect_ratio", "target_duration_seconds", "caption_requirement", "usage_rights_months", "air_date"]
    output: Deliverable
    side_effects: ["status starts PENDING with consumed_review_rounds 0", "sets round_entitlement = Project.contracted_revision_rounds", "when Project.status is not DRAFT: creates a PENDING_APPROVAL ChangeOrder with trigger_reason DELIVERABLE_ADDED_AFTER_SCOPE_LOCK and additional_rounds_granted 0, priced by change_order_amount from NEW_DELIVERABLE_LABOR_CENTS", "that change order adds its amount_cents to Project.provisional_cost_cents and sets Project.review_gate = CHANGE_ORDER_PENDING"]

  - method: POST
    path: "/deliverable-versions"
    description: "Upload a new cut of a deliverable. Requires the caller's last observed Deliverable.version (§1.2.1 OCC). Passing supersedes_version_id retires the prior cut"
    roles: [PostSupervisor]
    code: 201
    input: ["deliverable_id", "expected_deliverable_version", "cut_label", "aspect_ratio", "duration_seconds", "has_captions?", "caption_format?", "file_size_gb?", "supersedes_version_id?"]
    output: DeliverableVersion
    side_effects: ["increments Deliverable.version by 1", "review_status starts DRAFT and technical_status starts PENDING_QC", "computes round_index = Deliverable.consumed_review_rounds + 1", "when supersedes_version_id is present: cascade the referenced version DRAFT or CHANGES_REQUESTED -> SUPERSEDED", "recomputes Deliverable.version_count"]

  - method: POST
    path: "/deliverable-versions/{id}/qc"
    description: "Record the technical QC pass against the deliverable spec; the verdict is derived, never supplied"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: DeliverableVersion
    side_effects: ["runs version_qc_evaluation: technical_status PENDING_QC -> QC_PASSED or QC_FAILED", "writes qc_failure_reasons in the pinned finding order"]

  - method: POST
    path: "/deliverable-versions/{id}/submit"
    description: "Send a QC-passed cut to the client for review; consumes nothing yet but is gated on the round entitlement and on the review gate"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: DeliverableVersion
    side_effects: ["review_status DRAFT -> SUBMITTED", "records submitted_by_user_id = X-User-ID and submitted_at = clock now", "bubble up: Deliverable.status PENDING or CHANGES_REQUESTED -> IN_REVIEW"]

  - method: POST
    path: "/deliverable-versions/{id}/review-decision"
    description: "Client approves the cut or requests changes. REQUEST_CHANGES consumes a revision round and, once the entitlement is used up, raises a priced change order for the extra round"
    roles: [ClientApprover]
    code: 200
    input: ["decision", "review_note?"]
    output: DeliverableVersion
    side_effects: ["review_status SUBMITTED -> APPROVED or SUBMITTED -> CHANGES_REQUESTED", "records reviewed_by_user_id = X-User-ID and decided_at = clock now", "cascade hop 1 on REQUEST_CHANGES: Deliverable IN_REVIEW -> CHANGES_REQUESTED and consumed_review_rounds += 1", "cascade hop 2: when the increment makes consumed_review_rounds reach round_entitlement (the entitlement is now spent), create a PENDING_APPROVAL ChangeOrder with trigger_reason REVISION_ROUND_EXCEEDED and additional_rounds_granted 1", "cascade hop 3: Project.provisional_cost_cents += ChangeOrder.amount_cents and Project.review_gate OPEN -> CHANGE_ORDER_PENDING", "cascade hop 4: Project.budget_variance_cents and round_entitlement_balance recomputed", "on APPROVE: Deliverable IN_REVIEW -> APPROVED, and when it was the last outstanding deliverable, Project IN_POST -> DELIVERED and every CONFIRMED TalentEngagement -> COMPLETED"]

  - method: POST
    path: "/change-orders/{id}/decision"
    description: "Client approves or rejects a change order; a producer may VOID an approved one. APPROVE releases the extra revision round and commits the money"
    roles: [ClientApprover, LineProducer]
    code: 200
    input: ["decision", "decision_note?"]
    output: ChangeOrder
    side_effects: ["status PENDING_APPROVAL -> APPROVED or REJECTED, or APPROVED -> VOIDED", "records approved_by_user_id = X-User-ID", "on APPROVE: Project.committed_cost_cents += amount_cents, Deliverable.granted_extra_rounds += additional_rounds_granted, Project.review_gate CHANGE_ORDER_PENDING -> OPEN", "on REJECT: Project.provisional_cost_cents -= amount_cents and review_gate returns to OPEN", "on VOID: both provisional_cost_cents and committed_cost_cents are debited by amount_cents and the granted rounds are withdrawn", "recomputes Project.round_entitlement_balance and budget_variance_cents"]

  # ---------------------------- writes: talent ----------------------------
  - method: POST
    path: "/talent-engagements"
    description: "Cast a performer on either a usage-based buyout or a union session-and-reuse structure; compensation is priced on the PROVISIONAL basis from the project's channel scope and usage term"
    roles: [LineProducer]
    code: 201
    input: ["project_id", "talent_name", "union_affiliation", "compensation_model", "session_fee_cents", "session_days"]
    output: TalentEngagement
    side_effects: ["runs talent_compensation on the PROVISIONAL basis and writes the whole component breakdown", "comp_basis = PROVISIONAL, status = DRAFT", "recomputes Project.provisional_cost_cents", "enforces commitment_budget_allowance last"]

  - method: POST
    path: "/talent-engagements/{id}/confirm"
    description: "Countersign the deal memo. Compensation is re-priced on the FINAL basis from the deliverables actually scoped, so the confirmed figure normally differs from the provisional one"
    roles: [LineProducer]
    code: 200
    input: []
    output: TalentEngagement
    side_effects: ["status DRAFT -> CONFIRMED and comp_basis PROVISIONAL -> FINAL", "re-runs talent_compensation on the FINAL basis, overwriting channel_basis_count, term_basis_months, reuse_cycles and every money component", "recomputes Project.provisional_cost_cents and Project.committed_cost_cents with the reconciled delta"]

  # ------------------------- writes: physical side -------------------------
  - method: POST
    path: "/locations"
    description: "Register a scouted location with its stage capacity, daily fee, insurance minimum and permitting authority"
    roles: [ProductionCoordinator, LineProducer]
    code: 201
    input: ["name", "address", "stage_count", "daily_fee_cents", "insurance_minimum_cents", "permit_authority"]
    output: Location
    side_effects: ["scouting_status starts SCOUTED with scheduled_shoot_day_count 0"]

  - method: POST
    path: "/shoot-days"
    description: "Schedule a shoot day at a location; refused when the location's overlapping half-open day intervals already occupy every stage"
    roles: [ProductionCoordinator]
    code: 201
    input: ["project_id", "location_id", "shoot_date", "call_time", "wrap_time"]
    output: ShootDay
    side_effects: ["status starts PLANNED with call_sheet_status DRAFT", "evaluates location capacity over the half-open [call_time, wrap_time) interval", "recomputes compliance_posture (BLOCKED until permit and COI exist) and Location.scheduled_shoot_day_count / scouting_status"]

  - method: POST
    path: "/shoot-days/{id}/confirm"
    description: "Lock the shoot day. Requires an ISSUED film permit covering the day and an ISSUED certificate of insurance meeting the location's minimum"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: ShootDay
    side_effects: ["status PLANNED -> CONFIRMED", "re-evaluates compliance_posture", "sets Location.scouting_status to CONFIRMED"]

  - method: POST
    path: "/shoot-days/{id}/publish-call-sheet"
    description: "Publish the call sheet to crew and talent. Requires a live compliance posture, at least three confirmed crew, and at least 12 hours of lead time before call"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: ShootDay
    side_effects: ["call_sheet_status DRAFT -> PUBLISHED and call_sheet_published_at = clock now", "re-evaluates compliance_posture immediately before publishing, so a certificate that expired after confirmation blocks this call"]

  - method: POST
    path: "/shoot-days/{id}/cancel"
    description: "Cancel a planned or confirmed shoot day; every held or confirmed booking is released and the committed ledger is unwound"
    roles: [ProductionCoordinator, LineProducer]
    code: 200
    input: ["cancellation_reason"]
    output: ShootDay
    side_effects: ["status PLANNED or CONFIRMED -> CANCELLED", "cascade hop 1: every CrewBooking in {HELD, CONFIRMED} -> RELEASED and every EquipmentReservation RESERVED -> RELEASED", "cascade hop 2: Project.provisional_cost_cents and committed_cost_cents debited by the released rows", "cascade hop 3: Project.budget_variance_cents recomputed, and when this was the last non-terminal shoot day, Project IN_PRODUCTION -> IN_POST", "recomputes Location.scheduled_shoot_day_count"]

  - method: POST
    path: "/shoot-days/{id}/wrap"
    description: "Wrap the day: confirmed crew complete, reserved kit returns, and the last wrapped day moves the project into post"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: ShootDay
    side_effects: ["status CONFIRMED -> WRAPPED", "cascade: CrewBooking CONFIRMED -> COMPLETED, HELD -> RELEASED, EquipmentReservation RESERVED -> RETURNED", "when this was the last non-terminal shoot day: Project IN_PRODUCTION -> IN_POST", "recomputes Project.committed_cost_cents and day_cost_cents"]

  - method: POST
    path: "/compliance-certs"
    description: "File a film permit for one shoot day, or a liability certificate of insurance for the whole project; starts in SUBMITTED"
    roles: [ComplianceOfficer]
    code: 201
    input: ["project_id", "cert_type", "carrier_or_authority", "reference_code", "effective_from", "effective_to", "shoot_day_id?", "coverage_amount_cents?", "fee_cents?"]
    output: ComplianceCert
    side_effects: ["status starts SUBMITTED, which leaves the shoot day's compliance_posture BLOCKED", "records the submitting X-User-ID for the segregation-of-duties check on the decision"]

  - method: POST
    path: "/compliance-certs/{id}/decision"
    description: "Record the authority's or carrier's decision; a different officer from the filer must decide"
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "decision_note?"]
    output: ComplianceCert
    side_effects: ["status SUBMITTED -> ISSUED or SUBMITTED -> DENIED, decided_at = clock now", "cascade: recomputes compliance_posture of every ShootDay the certificate covers"]

  - method: POST
    path: "/crew-members"
    description: "Add a crew member to the roster with an hourly rate and a contractual minimum turnaround"
    roles: [ProductionCoordinator, LineProducer]
    code: 201
    input: ["full_name", "department", "hourly_rate_cents", "union_local?", "min_turnaround_hours?"]
    output: CrewMember
    side_effects: ["min_turnaround_hours defaults to 10 when omitted"]

  - method: POST
    path: "/crew-bookings"
    description: "Book a crew member onto a shoot day. Refused on an overlapping closed interval or on a rest gap shorter than the member's minimum turnaround"
    roles: [ProductionCoordinator]
    code: 201
    input: ["shoot_day_id", "crew_member_id", "department_role", "call_time", "wrap_time"]
    output: CrewBooking
    side_effects: ["status starts HELD", "computes scheduled_hours and the three overtime tiers per crew_booking_cost, rounding the summed components once", "recomputes Project.provisional_cost_cents and ShootDay.day_cost_cents", "enforces commitment_budget_allowance last, after the double-booking and turnaround checks"]

  - method: POST
    path: "/crew-bookings/{id}/confirm"
    description: "Convert a held booking into a confirmed one, moving its cost from provisional-only into the committed ledger"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: CrewBooking
    side_effects: ["status HELD -> CONFIRMED", "Project.committed_cost_cents += cost_cents", "recomputes ShootDay.confirmed_crew_count and compliance_posture"]

  - method: POST
    path: "/crew-bookings/{id}/release"
    description: "Drop a booking; whatever it contributed to either ledger is reversed exactly, leaving no drift"
    roles: [ProductionCoordinator]
    code: 200
    input: ["release_reason?"]
    output: CrewBooking
    side_effects: ["status HELD or CONFIRMED -> RELEASED", "Project.provisional_cost_cents -= cost_cents, and when the booking was CONFIRMED, Project.committed_cost_cents -= cost_cents", "recomputes ShootDay.confirmed_crew_count, compliance_posture and day_cost_cents"]

  - method: POST
    path: "/equipment-reservations"
    description: "Reserve a camera, lighting or grip package for a shoot day within the prep and return windows"
    roles: [ProductionCoordinator]
    code: 201
    input: ["shoot_day_id", "vendor_name", "kit_label", "unit_count", "daily_rate_cents", "pickup_at", "return_at"]
    output: EquipmentReservation
    side_effects: ["status starts RESERVED", "computes rental_days by ceiling and total_cost_cents", "recomputes Project.provisional_cost_cents, Project.committed_cost_cents and ShootDay.day_cost_cents", "enforces commitment_budget_allowance last"]

  # ------------------------- test-driving surface -------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every window, expiry and lead-time rule reads. Before any call to this endpoint the logical clock reads exactly the startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time"
    roles: [ProductionCoordinator, LineProducer, PostSupervisor, ClientApprover, ComplianceOfficer]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: datetime }"
    side_effects: ["all derived effective_status, compliance_posture, archive_status and rush_pct evaluations read the new instant"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog — 46 codes, one per §1.4 rule, every one triggerable
#   by at least one §1.5 endpoint call from an empty database.
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_CREW_SCOPE_FORBIDDEN
    http: 403
    condition: "A CrewMember caller reads a booking, or lists bookings, outside its own crew_member_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong type, undeclared enum member, negative money or count, or an interval whose start is not before its end"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset below 0 on a list endpoint"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "No Project matches the project_id in the path or payload"
  - id: ERR_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "No Deliverable matches the deliverable_id in the path or payload"
  - id: ERR_DELIVERABLE_VERSION_NOT_FOUND
    http: 404
    condition: "No DeliverableVersion matches the version_id in the path or the supersedes_version_id in the payload"
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "No ChangeOrder matches the change order id in the path"
  - id: ERR_SHOOT_DAY_NOT_FOUND
    http: 404
    condition: "No ShootDay matches the shoot_day_id in the path or payload"
  - id: ERR_LOCATION_NOT_FOUND
    http: 404
    condition: "No Location matches the location_id in the path or payload"
  - id: ERR_CREW_MEMBER_NOT_FOUND
    http: 404
    condition: "No CrewMember matches the crew_member_id in the path or payload"
  - id: ERR_CREW_BOOKING_NOT_FOUND
    http: 404
    condition: "No CrewBooking matches the booking id in the path"
  - id: ERR_COMPLIANCE_CERT_NOT_FOUND
    http: 404
    condition: "No ComplianceCert matches the certificate id in the path"
  - id: ERR_TALENT_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "No TalentEngagement matches the engagement id in the path"
  - id: ERR_STALE_DELIVERABLE_VERSION
    http: 412
    condition: "expected_deliverable_version does not equal the parent Deliverable's current version on POST /deliverable-versions"
  - id: ERR_PROJECT_STATE_INVALID
    http: 409
    condition: "Project.status does not permit the requested operation (e.g. approve-budget on a DRAFT project, handover on an IN_POST project, shoot-day creation on a DRAFT project, cut submitted while the project is still SCOPED)"
  - id: ERR_DELIVERABLE_STATE_INVALID
    http: 409
    condition: "A new cut is uploaded against an APPROVED or HANDED_OVER deliverable"
  - id: ERR_VERSION_REVIEW_STATE_INVALID
    http: 409
    condition: "submit on a version that is not DRAFT, or review-decision on a version that is not SUBMITTED"
  - id: ERR_QC_ALREADY_RECORDED
    http: 409
    condition: "QC is recorded a second time on a version whose technical_status has already left PENDING_QC"
  - id: ERR_VERSION_QC_NOT_PASSED
    http: 409
    condition: "A version is submitted for review while its technical_status is PENDING_QC or QC_FAILED"
  - id: ERR_SHOOT_DAY_STATE_INVALID
    http: 409
    condition: "The shoot day's status does not permit the operation (e.g. wrap on a PLANNED day, publish on a PLANNED day, booking creation on a CANCELLED or WRAPPED day)"
  - id: ERR_CREW_BOOKING_STATE_INVALID
    http: 409
    condition: "confirm on a booking that is not HELD, or release on a COMPLETED or already RELEASED booking"
  - id: ERR_COMPLIANCE_CERT_STATE_INVALID
    http: 409
    condition: "A decision is recorded on a certificate already ISSUED or DENIED"
  - id: ERR_CHANGE_ORDER_STATE_INVALID
    http: 409
    condition: "APPROVE or REJECT on a change order that is not PENDING_APPROVAL, or VOID on one that is not APPROVED"
  - id: ERR_TALENT_ENGAGEMENT_STATE_INVALID
    http: 409
    condition: "confirm on an engagement that is already CONFIRMED or COMPLETED"
  - id: ERR_ARCHIVE_ALREADY_HANDED_OVER
    http: 409
    condition: "handover is called on a project whose archive_status has already left NOT_PACKAGED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals the submitter or requester recorded on the row being decided (version review, change-order decision, certificate decision)"
  - id: ERR_PERMIT_WINDOW_MISMATCH
    http: 422
    condition: "The shoot day has no ISSUED FILM_PERMIT whose effective window covers [call_time, wrap_time] and which has not expired against the logical clock"
  - id: ERR_INSUFFICIENT_COI_COVERAGE
    http: 422
    condition: "No ISSUED LIABILITY_COI on the project covers the shoot window with coverage_amount_cents at or above the location's insurance_minimum_cents"
  - id: ERR_COMPLIANCE_POSTURE_BLOCKED
    http: 422
    condition: "compliance_posture is BLOCKED at the instant of publish or wrap, including the case of a certificate that expired after the day was confirmed"
  - id: ERR_MIN_CREW_NOT_MET
    http: 422
    condition: "Fewer than three CONFIRMED or COMPLETED crew bookings exist on the shoot day when the call sheet is published; an empty booking set counts as zero"
  - id: ERR_CALL_SHEET_WINDOW_CLOSED
    http: 422
    condition: "The logical clock is later than call_time minus 12 hours when the call sheet is published"
  - id: ERR_CREW_DOUBLE_BOOKED
    http: 409
    condition: "The crew member already holds a HELD or CONFIRMED booking whose closed interval intersects the requested one, endpoints inclusive"
  - id: ERR_CREW_TURNAROUND_VIOLATION
    http: 409
    condition: "The rest gap to the crew member's nearest neighbouring booking is shorter than that member's min_turnaround_hours; a gap of exactly the minimum is accepted"
  - id: ERR_EQUIPMENT_WINDOW_OUT_OF_RANGE
    http: 422
    condition: "pickup_at is earlier than call_time minus 48 hours, or return_at is later than wrap_time plus 48 hours"
  - id: ERR_LOCATION_CAPACITY_EXCEEDED
    http: 409
    condition: "Overlapping PLANNED or CONFIRMED half-open day intervals at the location already occupy every stage; days that merely touch at an endpoint do not count"
  - id: ERR_REVISION_ROUNDS_EXHAUSTED
    http: 409
    condition: "A cut is submitted while Deliverable.consumed_review_rounds already equals (or exceeds) Deliverable.round_entitlement and no APPROVED change order has granted a further round"
  - id: ERR_CHANGE_ORDER_PENDING
    http: 409
    condition: "A cut is submitted while the project's review_gate is CHANGE_ORDER_PENDING"
  - id: ERR_SCOPE_INCOMPLETE
    http: 422
    condition: "lock-scope is called on a project that has no deliverable, or no budget line, or neither"
  - id: ERR_CHANNEL_OUT_OF_SCOPE
    http: 422
    condition: "The deliverable's channel is not a member of the project's channel_scope"
  - id: ERR_USAGE_RIGHTS_EXCEED_TERM
    http: 422
    condition: "The deliverable's usage_rights_months exceeds the project's usage_term_months"
  - id: ERR_TALENT_COMP_MODEL_INVALID
    http: 422
    condition: "A UNION engagement is priced as USAGE_BUYOUT, or a NON_UNION engagement as UNION_SESSION_REUSE"
  - id: ERR_VERSION_DELIVERABLE_MISMATCH
    http: 422
    condition: "supersedes_version_id points at a cut of a different deliverable, or at a cut whose review_status is not CHANGES_REQUESTED"
  - id: ERR_CERT_SCOPE_MISMATCH
    http: 422
    condition: "A FILM_PERMIT omits shoot_day_id or names a shoot day of another project, or a LIABILITY_COI supplies a shoot_day_id"
  - id: ERR_BUDGET_CEILING_EXCEEDED
    http: 422
    condition: "The projected provisional cost after the write exceeds the ceiling (before budget approval) or the ceiling grossed up by 5% (after approval)"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties: the producer builds the money,
#   the client approves it, post supplies the cuts, the client judges them,
#   compliance files and decides paperwork, and crew only reads its own calls.
# ---------------------------------------------------------------------------
roles:
  - name: ProductionCoordinator
    description: "Runs the physical production: locations, shoot days, call sheets, crew bookings and equipment rentals"
    identity: opaque
    exclusive_operations:
      - "POST /shoot-days"
      - "POST /shoot-days/{id}/confirm"
      - "POST /shoot-days/{id}/publish-call-sheet"
      - "POST /shoot-days/{id}/wrap"
      - "POST /crew-bookings"
      - "POST /crew-bookings/{id}/confirm"
      - "POST /crew-bookings/{id}/release"
      - "POST /equipment-reservations"
    shared_operations:
      - "POST /locations (with LineProducer)"
      - "POST /crew-members (with LineProducer)"
      - "POST /deliverables (with LineProducer)"
      - "POST /shoot-days/{id}/cancel (with LineProducer)"
      - "every GET except GET /crew-bookings scoped reads reserved to CrewMember"
      - "POST /_clock/set_current_utc"

  - name: LineProducer
    description: "Owns the money: opens the project, builds the budget, casts talent, and may void an approved change order"
    identity: opaque
    exclusive_operations:
      - "POST /projects"
      - "POST /projects/{id}/lock-scope"
      - "POST /projects/{id}/handover"
      - "POST /budget-lines"
      - "POST /talent-engagements"
      - "POST /talent-engagements/{id}/confirm"
    shared_operations:
      - "POST /locations (with ProductionCoordinator)"
      - "POST /crew-members (with ProductionCoordinator)"
      - "POST /deliverables (with ProductionCoordinator)"
      - "POST /shoot-days/{id}/cancel (with ProductionCoordinator)"
      - "POST /change-orders/{id}/decision (with ClientApprover; VOID is in practice the producer's move)"
      - "GET /projects/{id} and every other project, deliverable, shoot-day, cert, crew and booking read"
      - "POST /_clock/set_current_utc"

  - name: PostSupervisor
    description: "Delivers cuts: uploads versions, records technical QC, and submits for client review"
    identity: opaque
    exclusive_operations:
      - "POST /deliverable-versions"
      - "POST /deliverable-versions/{id}/qc"
      - "POST /deliverable-versions/{id}/submit"
    shared_operations:
      - "GET /projects/{id}, GET /projects/{id}/deliverables, GET /deliverables/{id}, GET /deliverables/{id}/change-orders, GET /deliverable-versions, GET /deliverable-versions/{id}"
      - "POST /_clock/set_current_utc"

  - name: ClientApprover
    description: "The client side: approves the budget, judges each cut, and pays for extra revision rounds by approving change orders"
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/approve-budget"
      - "POST /deliverable-versions/{id}/review-decision"
    shared_operations:
      - "POST /change-orders/{id}/decision (with LineProducer)"
      - "GET /projects/{id}, GET /projects/{id}/budget-lines, GET /projects/{id}/deliverables, GET /deliverables/{id}, GET /deliverables/{id}/change-orders, GET /deliverable-versions, GET /deliverable-versions/{id}"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Files film permits and certificates of insurance and records the authority's or carrier's decision; a different officer must decide what an officer filed"
    identity: opaque
    exclusive_operations:
      - "POST /compliance-certs"
      - "POST /compliance-certs/{id}/decision"
    shared_operations:
      - "GET /projects/{id}, GET /locations/{id}, GET /shoot-days, GET /shoot-days/{id}, GET /compliance-certs, GET /compliance-certs/{id}"
      - "POST /_clock/set_current_utc"

  - name: CrewMember
    description: "A booked crew member; may read only its own bookings and the shoot days and roster entry those bookings reference, and may write nothing"
    identity: "entity_backed:CrewMember"
    exclusive_operations: []
    shared_operations:
      - "GET /crew-bookings with crew_member_id equal to its own X-User-ID"
      - "GET /crew-bookings/{id} for a booking whose crew_member_id equals its own X-User-ID"
      - "GET /shoot-days/{id}"
      - "GET /crew-members/{id}"
