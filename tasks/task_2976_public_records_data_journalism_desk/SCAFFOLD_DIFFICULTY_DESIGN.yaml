            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_id}", investigation_id: "${inv_id}", name: "narrative-scans", negotiated_format: "PDF_SCAN", expected_field_count: 1, sensitivity_tier: "SOURCE_LINKED" }
              as: DataReporter
              captures: { ds_id: $.data.id }
            - call: "POST /records-desk/datasets/${ds_id}/delivery"
              payload: { delivered_format: "PDF_SCAN", record_count: 500 }
              as: DataReporter
            - call: "POST /records-desk/datasets/${ds_id}/field-definitions"
              payload: { field_name: "narrative_text", data_type: "STRING", null_rate_pct: 0.0, reidentification_risk: 7, is_source_identifying: false }
              as: DataReporter
