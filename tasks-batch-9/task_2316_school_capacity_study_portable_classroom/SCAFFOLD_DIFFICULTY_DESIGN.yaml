      - name: reliance_share_rounded_per_school_then_averaged
        grounds:
          calculations: [reliance_metrics]
          entities: [School, CapacityStudy, PortableUnit, PlacementSite]
          endpoints: ["GET /facilities/reliance-summary", "GET /facilities/schools/{id}/reliance-report"]
        mode: b
        formula_shape: "district_average_portable_share_pct = round_half_up(sum(round_half_up(hosted*100/(permanent+hosted), 1) for each qualifying school) / count(qualifying schools), 1) - rounding happens per school BEFORE the average, never once over pooled district seats"
        distinguishing_aspect: >
          Two campuses each have 56 permanent seats. One hosts a 24 seat portable
          and one hosts none. Rounding per campus first gives 30.0 and 0.0, whose
          average is exactly 15.0. Pooling the district first gives 24 * 100 / 136
          = 17.6, a 2.6 point difference that lands on the opposite side of the
          15.0 long-term reliance threshold. Both orders use the same inputs and
          the same round_half_up to one decimal, so only the pinned per-campus
          order reproduces 15.0.
