  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stale_version_beats_window_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - concurrency_rules[appointment-book-stale-routeday]
        distinguishing_aspect: |
          Error-category pair concurrency(p6) vs business_temporal(p12): a booking carrying a stale
          expected_route_day_version AND requesting a window that overlaps an existing stop returns
          ERR_ROUTE_DAY_VERSION_STALE (412), not ERR_APPOINTMENT_WINDOW_CONFLICT — the lower-priority-number
          concurrency check wins.
        test_recipe:
          setup:
            - "Route day rd with one booked appointment 09:00-09:30 (version advanced to 2); a second ORDERED order O2 holding the stale version 1"
          setup_api_calls:
            - call: "POST /test-panels"
              payload: { panel_code: "CMP14", name: "CMP", required_tube_count: 3, base_lab_fee_cents: 4000 }
              as: LabOps
              captures: { panel_id: $.data.id }
            - call: "POST /lab-partners"
              payload: { name: "Quest", courier_sla_hours: 24, accepted_panel_codes: ["CMP14"] }
              as: LabOps
              captures: { partner_id: $.data.id }
            - call: "POST /phlebotomists"
              payload: { full_name: "Pat", territory_code: "SF_BAY" }
              as: Dispatcher
              captures: { phleb_id: $.data.id }
            - call: "POST /phlebotomists/${phleb_id}/route-days"
