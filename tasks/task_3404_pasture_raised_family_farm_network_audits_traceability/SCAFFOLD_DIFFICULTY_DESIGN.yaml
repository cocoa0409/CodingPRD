            - "superseded contract shows status SUPERSEDED in GET /farm-network/farms/${f_id}/contracts"

  - rule_id: resource_temporal_overlap
    instances:
      - name: audit_minimum_gap_buffer_semantics
        grounds:
          - validations[priority=11]
          - errors[ERR_AUDIT_TOO_SOON]
        distinguishing_aspect: |
          Buffer-gap interval semantics on the Audit resource: two audits of the same farm
          must sit at least 30 days apart; a 28-day gap is rejected with ERR_AUDIT_TOO_SOON
          while exactly 30 days is accepted (>= semantics on the gap buffer).
        test_recipe:
          setup:
            - "farm F (ONBOARDING suffices for scheduling) with an INITIAL audit scheduled for 2026-09-03T00:00:00Z"
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Gap Test Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "FOR_CAUSE", scheduled_for: "2026-10-01T00:00:00Z" }
              as: NetworkManager
              captures: { err: $.data.error_id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "FOR_CAUSE", scheduled_for: "2026-10-03T00:00:00Z" }
              as: NetworkManager
              captures: { a2_id: $.data.id }
          assert:
            - "audit at +28 days (2026-10-01): error_id == ERR_AUDIT_TOO_SOON, http 422"
            - "audit at exactly +30 days (2026-10-03): accepted (201), Audit.${a2_id}.status == SCHEDULED"
            - "gap measured against every non-CANCELLED audit of the same farm regardless of type"

      - name: farm_route_date_exclusivity_point_semantics
        grounds:
          - validations[priority=11]
          - errors[ERR_STOP_DATE_CONFLICT]
        distinguishing_aspect: |
          Point/date-equality interval semantics on the Route resource (different semantics
          than the audit gap buffer): a farm may occupy at most one SCHEDULED/COLLECTED stop
          across all routes sharing a route_date — the collision predicate is date equality,
          not a minimum-distance buffer.
        test_recipe:
          setup:
            - "ACTIVE farm F (CERTIFIED, contract) with a SCHEDULED stop on route R1 dated 2026-09-08"
            - "empty routes R2 (same date 2026-09-08) and R3 (next date 2026-09-09), each capacity 4"
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Twin Route Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-08", driver_name: "Dale", capacity_cases: 4 }
              as: PlantOperator
              captures: { r1_id: $.data.id }
            - call: "POST /farm-network/routes/${r1_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 2 }
              as: PlantOperator
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-08", driver_name: "Erin", capacity_cases: 4 }
              as: PlantOperator
              captures: { r2_id: $.data.id }
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-09", driver_name: "Erin", capacity_cases: 4 }
              as: PlantOperator
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /farm-network/routes/${r2_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 2 }
              as: PlantOperator
              captures: { err: $.data.error_id }
            - call: "POST /farm-network/routes/${r3_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 2 }
              as: PlantOperator
          assert:
            - "same farm + same route_date on a different route: error_id == ERR_STOP_DATE_CONFLICT, http 409"
            - "same farm + next route_date (2026-09-09): accepted (201), stop SCHEDULED"
            - "the conflict fires even though R2 has ample capacity — the semantics is date equality, not capacity"

  - rule_id: compensating_invariant
    instances:
      - name: lot_dozen_conservation_pack_and_destroy
        grounds:
          - entities.EggLot.fields.remaining_dozens
          - state_machines.EggLot
        distinguishing_aspect: |
          Conserved quantity = physical dozens per lot: received_dozens ==
          remaining_dozens + packed_dozens + destroyed_dozens after every forward action
          (packing) and every compensating-style action (hold-reject destruction), checked
          on two lots taking opposite branches.
        test_recipe:
          setup:
            - "ACTIVE farm F; lot L1 of 120 dozens graded A (score 90); lot L2 of 60 dozens auto-held (score 60)"
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Ledger Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
