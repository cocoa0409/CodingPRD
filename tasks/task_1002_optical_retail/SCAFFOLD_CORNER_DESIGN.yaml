scaffold_corner_design:

  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: customer_creation_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Customer.fields.fsa_balance_cents
          - entities.Customer.fields.return_risk_score
          - entities.Customer.fields.lifetime_kit_count
          - entities.Customer.fields.insurance_policy_id
        distinguishing_aspect: "A customer created with only the three required fields comes back with fsa_balance_cents 0, insurance_policy_id null, lifetime_kit_count 0, return_risk_score 0 and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /optical/customers"
              payload: { full_name: "Dee Fault", email: "dee.fault@x.com", dob: "1990-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Customer.${cust_id}.fsa_balance_cents == 0"
            - "Customer.${cust_id}.insurance_policy_id == null"
            - "Customer.${cust_id}.lifetime_kit_count == 0"
            - "Customer.${cust_id}.return_risk_score == 0"
            - "Customer.${cust_id}.version == 1"

      - name: get_frame_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: [entities.Frame, "errors[ERR_FRAME_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but unknown Frame UUID returns ERR_FRAME_NOT_FOUND with HTTP 404, not an empty object."
        test_recipe:
          setup: ["Empty catalog."]
          setup_api_calls: []
          trigger:
            - call: "GET /optical/frames/00000000-0000-4000-8000-000000000000"
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_FRAME_NOT_FOUND"

      - name: prescription_missing_required_pd_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Prescription.fields.pd_mm, "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "pd_mm has source input and no default, so omitting it yields ERR_INVALID_REQUEST (400) at priority 3 — before any existence or business check."
        test_recipe:
          setup: ["One customer exists."]
          setup_api_calls:
            - call: "POST /optical/customers"
              payload: { full_name: "Nora Field", email: "nora@x.com", dob: "1990-02-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"

      - name: order_computed_money_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Order.fields.lens_upcharge_cents
          - entities.Order.fields.customer_due_cents
          - calculations.lens_upcharge
        distinguishing_aspect: "lens_upcharge_cents has source computed; a client-supplied value of 1 is discarded and the server writes 6000 (M160 base price, rx_power 2.00, no coatings, no prism, no high-power surcharge)."
        test_recipe:
          setup: ["Self-pay customer with a VERIFIED low-power prescription; frame 9500c; LensOption M160 (index 1.60, 6000c)."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C01", name: "Durand", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M160", category: "MATERIAL", base_price_cents: 6000, material_index: 1.60 }
              as: PlatformAdmin
              captures: { m160_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Cora Computed", email: "cora@x.com", dob: "1990-03-03T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -2.00, od_cylinder: 0.00, os_sphere: -2.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
          trigger:
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m160_id}", delivery_method: "SHIP", lens_upcharge_cents: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Order.${ord_id}.lens_upcharge_cents == 6000"
            - "Order.${ord_id}.subtotal_cents == 15500"
            - "Order.${ord_id}.discount_cents == 0"
            - "Order.${ord_id}.customer_due_cents == 15500"

      - name: customer_list_returns_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Customer]
        distinguishing_aspect: "GET /optical/customers with limit 1 and offset 1 returns exactly one row, total_count 2 and has_more false, in the array response envelope."
        test_recipe:
          setup: ["Two customers exist."]
          setup_api_calls:
            - call: "POST /optical/customers"
              payload: { full_name: "P One", email: "p1@x.com", dob: "1990-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /optical/customers"
              payload: { full_name: "P Two", email: "p2@x.com", dob: "1991-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /optical/customers?limit=1&offset=1"
              as: PlatformAdmin
          assert:
            - "HTTP status == 200"
            - "response_type == 'array'"
            - "len(data) == 1"
            - "total_count == 2"
            - "has_more == false"
            - "limit == 1 and offset == 1"

      - name: try_on_kit_item_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds: [entities.TryOnKitItem, entities.TryOnKitItem.fields.outcome]
        distinguishing_aspect: "TryOnKitItem declares common_fields false: items surfaced by GET /optical/home-try-on-kits/{id}/items carry id, created_at, kit_id, frame_id and outcome but no version and no updated_at, and there is no endpoint that mutates one directly."
        test_recipe:
          setup: ["A customer with a REQUESTED kit holding one frame."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C02", name: "Wright", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 50.0, max_pd_mm: 75.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Imm Utable", email: "imm@x.com", dob: "1990-04-04T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-05-05T00:00:00Z", due_date: "2026-05-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { kit_id: $.data.id }
          trigger:
            - call: "GET /optical/home-try-on-kits/${kit_id}/items"
              as: StoreAssociate
              captures: { item_frame: "$.data[0].frame_id" }
          assert:
            - "HTTP status == 200"
            - "len(data) == 1"
            - "${item_frame} == ${frame_id}"
            - "data[0].outcome == 'PENDING'"
            - "data[0] has no 'version' key"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: shipping_an_already_shipped_kit_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.HomeTryOnKit.REQUESTED_to_SHIPPED, "validations[priority=40]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /ship on a kit already in SHIPPED has no declared from-state and returns ERR_INVALID_STATE (409); the kit's version does not advance."
        test_recipe:
          setup: ["A kit in SHIPPED."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C03", name: "Wright", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 50.0, max_pd_mm: 75.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Idem Potent", email: "idem@x.com", dob: "1990-05-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-05-05T00:00:00Z", due_date: "2026-05-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { kit_id: $.data.id }
            - call: "POST /optical/home-try-on-kits/${kit_id}/ship"
              payload: {}
              as: StoreAssociate
              captures: { kit_v: $.data.version }
          trigger:
            - call: "POST /optical/home-try-on-kits/${kit_id}/ship"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_STATE"
            - "HomeTryOnKit.${kit_id}.status == SHIPPED"
            - "HomeTryOnKit.${kit_id}.version == ${kit_v}"

      - name: cancelling_a_delivered_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order.CONFIRMED_to_CANCELLED, "validations[priority=40]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "fulfillment_status DELIVERED is terminal: POST /orders/{id}/cancel is refused with ERR_INVALID_STATE (409), the LabOrder stays DELIVERED and payment stays CAPTURED."
        test_recipe:
          setup: ["A self-pay order whose LabOrder ran QUEUED -> IN_PRODUCTION -> QC_PASSED -> SHIPPED -> DELIVERED, so the order is DELIVERED / CAPTURED."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C04", name: "Reilly", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M150", category: "MATERIAL", base_price_cents: 0, material_index: 1.50 }
              as: PlatformAdmin
              captures: { m150_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Terry Minal", email: "terry@x.com", dob: "1990-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m150_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /optical/lab-orders?order_id=${ord_id}"
              as: LabTechnician
              captures: { lab_id: "$.data[0].id" }
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/qc"
              payload: { result: "PASS" }
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/ship"
              payload: {}
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/deliver"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /optical/orders/${ord_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_STATE"
            - "Order.${ord_id}.fulfillment_status == DELIVERED"
            - "Order.${ord_id}.payment_status == CAPTURED"
            - "LabOrder.${lab_id}.status == DELIVERED"

      - name: third_qc_failure_returns_remake_limit_exceeded
        claim_type: Precondition Enforcement
        grounds: [state_machines.LabOrder.IN_PRODUCTION_to_REMAKE_QUEUED, "validations[priority=71]", "errors[ERR_REMAKE_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "The QC-fail precondition is remake_count < 2 (strictly): the first two FAILs are accepted (remake_count 1 then 2) and the third is refused with ERR_REMAKE_LIMIT_EXCEEDED (409) while the lab order stays IN_PRODUCTION."
        test_recipe:
          setup: ["A confirmed self-pay order whose LabOrder has already failed QC twice (remake_count 2) and has been restarted, so it sits IN_PRODUCTION."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C05", name: "Durand", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M150", category: "MATERIAL", base_price_cents: 0, material_index: 1.50 }
              as: PlatformAdmin
              captures: { m150_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Rem Ake", email: "rem@x.com", dob: "1990-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m150_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /optical/lab-orders?order_id=${ord_id}"
              as: LabTechnician
              captures: { lab_id: "$.data[0].id" }
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/qc"
              payload: { result: "FAIL", failure_reason: "coating haze" }
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/qc"
              payload: { result: "FAIL", failure_reason: "edge chip" }
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "POST /optical/lab-orders/${lab_id}/qc"
              payload: { result: "FAIL", failure_reason: "third strike" }
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_REMAKE_LIMIT_EXCEEDED"
            - "LabOrder.${lab_id}.status == IN_PRODUCTION"
            - "LabOrder.${lab_id}.remake_count == 2"
            - "LabOrder.${lab_id}.qc_failure_reason == 'edge chip'"

      - name: rejected_prescription_resubmits_back_to_submitted
        claim_type: Valid Transition
        grounds: [state_machines.Prescription.SUBMITTED_to_REJECTED, state_machines.Prescription.REJECTED_to_SUBMITTED, entities.Prescription.fields.resubmit_count]
        distinguishing_aspect: "The Prescription revert loop: verify(REJECTED) then resubmit returns status to SUBMITTED, bumps resubmit_count to 1, clears rejection_reason, and overwrites the measurement fields from the resubmit payload."
        test_recipe:
          setup: ["A customer with a SUBMITTED prescription."]
          setup_api_calls:
            - call: "POST /optical/customers"
              payload: { full_name: "Rea Submit", email: "rea@x.com", dob: "1990-08-08T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "REJECTED", rejection_reason: "PD looks transposed" }
              as: OpticianVerifier
          trigger:
            - call: "POST /optical/prescriptions/${rx_id}/resubmit"
              payload: { od_sphere: -1.25, od_cylinder: -0.25, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 64.0, issued_at: "2026-04-05T00:00:00Z", expires_at: "2027-04-05T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "HTTP status == 200"
            - "Prescription.${rx_id}.status == SUBMITTED"
            - "Prescription.${rx_id}.resubmit_count == 1"
            - "Prescription.${rx_id}.rejection_reason == null"
            - "Prescription.${rx_id}.pd_mm == 64.0"
            - "Prescription.${rx_id}.od_sphere == -1.25"

      - name: clock_advance_expires_a_verified_prescription
        claim_type: Initial State
        grounds: [state_machines.Prescription.VERIFIED_to_EXPIRED, endpoints]
        distinguishing_aspect: "Advancing the logical clock to exactly the prescription's expires_at flips it VERIFIED -> EXPIRED (the rule uses >=, not >), and the clock endpoint reports the id in expired_prescription_ids."
        test_recipe:
          setup: ["A VERIFIED prescription with expires_at 2026-09-01T00:00:00Z; the clock sits at its 2026-05-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /optical/customers"
              payload: { full_name: "Ex Pyre", email: "ex@x.com", dob: "1990-09-09T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2025-09-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
          trigger:
            - call: "POST /optical/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { now: $.data.current_utc }
          assert:
            - "HTTP status == 200"
            - "${now} == '2026-09-01T00:00:00Z'"
            - "expired_prescription_ids contains ${rx_id}"
            - "Prescription.${rx_id}.status == EXPIRED"

      - name: warranty_approval_mints_a_remake_lab_order
        claim_type: Side Effect Execution
        grounds: [state_machines.WarrantyClaim.OPEN_to_APPROVED, entities.LabOrder.fields.is_remake, entities.WarrantyClaim.fields.remake_lab_order_id, calculations.remake_liability]
        distinguishing_aspect: "Approving a MANUFACTURER_DEFECT claim mints a second LabOrder on the same order_id with status QUEUED, remake_count 0 and is_remake true, links it via remake_lab_order_id, and leaves customer_charge_cents at 0."
        test_recipe:
          setup: ["A self-pay order whose LabOrder is DELIVERED at the default clock, with an OPEN MANUFACTURER_DEFECT warranty claim filed against it."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C06", name: "Reilly", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M160", category: "MATERIAL", base_price_cents: 6000, material_index: 1.60 }
              as: PlatformAdmin
              captures: { m160_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Dee Fect", email: "defect@x.com", dob: "1990-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -2.00, od_cylinder: 0.00, os_sphere: -2.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m160_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /optical/lab-orders?order_id=${ord_id}"
              as: LabTechnician
              captures: { lab_id: "$.data[0].id" }
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/qc"
              payload: { result: "PASS" }
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/ship"
              payload: {}
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/deliver"
              payload: {}
              as: StoreAssociate
              captures: { lab_v: $.data.version }
            - call: "POST /optical/warranty-claims"
              payload: { lab_order_id: "${lab_id}", customer_id: "${cust_id}", reason: "MANUFACTURER_DEFECT", expected_lab_order_version: "${lab_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wc_id: $.data.id }
          trigger:
            - call: "POST /optical/warranty-claims/${wc_id}/decide"
              payload: { decision: "APPROVED" }
              as: StoreAssociate
              captures: { remake_id: $.data.remake_lab_order_id }
          assert:
            - "HTTP status == 200"
            - "WarrantyClaim.${wc_id}.status == APPROVED"
            - "WarrantyClaim.${wc_id}.customer_charge_cents == 0"
            - "LabOrder.${remake_id}.status == QUEUED"
            - "LabOrder.${remake_id}.is_remake == true"
            - "LabOrder.${remake_id}.remake_count == 0"
            - "LabOrder.${remake_id}.order_id == ${ord_id}"
            - "GET /optical/lab-orders?order_id=${ord_id} returns total_count == 2"

      - name: exam_completion_links_the_resulting_prescription
        claim_type: Valid Transition
        grounds: [state_machines.ExamAppointment.BOOKED_to_COMPLETED, entities.ExamAppointment.fields.resulting_prescription_id]
        distinguishing_aspect: "Completing a BOOKED exam sets resulting_prescription_id to the supplied Prescription and moves status to COMPLETED; the appointment is then reachable from GET /optical/exam-appointments?resulting_prescription_id=."
        test_recipe:
          setup: ["A store, a customer with a SUBMITTED prescription, and a BOOKED exam."]
          setup_api_calls:
            - call: "POST /optical/stores"
              payload: { name: "Flatiron", exam_chairs: 2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Ex Amme", email: "exam@x.com", dob: "1990-11-11T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
