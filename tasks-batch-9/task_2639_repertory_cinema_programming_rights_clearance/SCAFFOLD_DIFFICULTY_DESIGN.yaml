      - name: ingest_lane_window_touching_at_endpoint_counts_as_concurrent
        grounds:
          - calculations.ingest_lane_capacity
          - validations[priority=16]
          - errors[ERR_INGEST_LANE_CAPACITY_EXCEEDED]
          - entities.Venue.dcp_ingest_lane_count
          - entities.DcpAsset.ingest_window_end_at
        distinguishing_aspect: |
          The ingest window is a CLOSED interval, so a candidate starting at the exact instant an existing
          window ends is concurrent with it at that shared instant. With two lanes already occupied at that
          instant the candidate is the third and is refused; shifting the candidate start by one minute drops
          concurrency to two and it is accepted. One minute separates 422 from 201.
        test_recipe:
          setup:
            - "Canonical venue with dcp_ingest_lane_count 2, distributor and title."
            - "Asset A1 occupies the closed window [2026-08-02T08:00:00Z, 2026-08-03T08:00:00Z] and stays in REQUESTED (a lane-occupying status)."
            - "Asset A2 occupies the closed window [2026-08-02T12:00:00Z, 2026-08-03T12:00:00Z] and also stays REQUESTED - they already overlap at two lanes, which is legal."
            - "At the instant 2026-08-03T08:00:00Z both A1 (its inclusive end) and A2 are occupying lanes."
          setup_api_calls:
