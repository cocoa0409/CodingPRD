      - name: stale_employer_version_on_eligibility_file_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[eligibility-file-stale-employer]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /perks/employers/{id}/eligibility-files]
          - state_machines.Employer.integration_status.NOT_CONFIGURED_to_FILE_RECEIVED
        distinguishing_aspect: |
          The employer version read at creation is invalidated by the storefront write, and the
          version read before the first file is invalidated by applying it, so each replay returns
          ERR_STALE_VERSION with HTTP 412 and leaves integration_status untouched, while a fresh read
          in between makes the same upload succeed.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; employer Northwind Co is created (version captured) and then a DRAFT storefront is written, which bumps the employer version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 2, revenue_share_enabled: true, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id, employer_v0: $.data.version, integration_0: $.data.integration_status }
            - call: "POST /perks/employers/${employer_id}/storefront"
              payload: { brand_color_hex: "#1155CC", logo_url: "https://cdn.example/nw.png", hero_headline: "Your Northwind perks", featured_categories: ["DINING"] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { employer_v1: $.data.version }
          trigger:
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload: { expected_employer_version: "${employer_v0}", effective_from: "2026-08-01T00:00:00Z", checksum: "sha-occ-emp-1", records: [{ external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { e_stale_1: $.data.error_id }
            - call: "GET /perks/employers/${employer_id}"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { integration_after_refusal: $.data.integration_status, employer_v_read: $.data.version }
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload: { expected_employer_version: "${employer_v_read}", effective_from: "2026-08-01T00:00:00Z", checksum: "sha-occ-emp-1", records: [{ external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { file_1: $.data.id, file_1_status: $.data.status }
            - call: "POST /perks/eligibility-files/${file_1}/validate"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "POST /perks/eligibility-files/${file_1}/apply"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { file_1_applied: $.data.status }
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload: { expected_employer_version: "${employer_v_read}", effective_from: "2026-08-05T00:00:00Z", checksum: "sha-occ-emp-2", records: [{ external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }, { external_employee_ref: "E-002", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { e_stale_2: $.data.error_id }
            - call: "GET /perks/employers/${employer_id}"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { employer_v_now: $.data.version, integration_now: $.data.integration_status, headcount_now: $.data.eligible_headcount }
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload: { expected_employer_version: "${employer_v_now}", effective_from: "2026-08-05T00:00:00Z", checksum: "sha-occ-emp-2", records: [{ external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }, { external_employee_ref: "E-002", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
