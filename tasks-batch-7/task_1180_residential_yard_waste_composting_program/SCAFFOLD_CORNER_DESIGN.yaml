  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_object_shape
        claim_type: envelope
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Success object response carries meta.api_request_id, meta.api_request_timestamp, response_type 'object', and data holding the created entity."
        test_recipe:
          setup: ["one zone exists"]
          setup_api_calls:
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
          trigger:
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { h: $.data.id } }
          assert:
            - "response.meta.api_request_id is present and non-empty"
            - "response.meta.api_request_timestamp is ISO8601"
            - "response.response_type == object"
            - "response.data.id == ${h}"

      - name: route_draft_blocks_ticket_then_publish_allows
        claim_type: conditional_action
        grounds:
          - "errors[ERR_ROUTE_NOT_PUBLISHED]"
          - "state_machines.CollectionRoute.DRAFT_to_PUBLISHED"
        distinguishing_aspect: "Ticket scheduling against a DRAFT route fails with ERR_ROUTE_NOT_PUBLISHED; after publish the identical request succeeds."
        test_recipe:
          setup: ["universal household ACTIVE; route created but not published"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_u}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
          trigger:
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { err: $.data.error_id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { tk: $.data.id, tk_st: $.data.status } }
          assert:
            - "capture ${err} == ERR_ROUTE_NOT_PUBLISHED"
            - "capture ${tk_st} == SCHEDULED"

      - name: receive_reject_path_records_zero_acceptance
        claim_type: side_effect_execution
        grounds:
          - "state_machines.FacilityDelivery.SCHEDULED_to_REJECTED"
        distinguishing_aspect: "Operator-declared REJECT bypasses safety/capacity checks, records the weights, sets accepted_weight_lbs 0, and does not raise facility.season_accepted_lbs."
        test_recipe:
          setup: ["zone with published route; facility OPEN; delivery scheduled 2026-06-15"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /facilities", payload: { name: "Compost Central", daily_receiving_capacity_lbs: 50000, safety_contamination_item_limit: 5 }, as: ProgramAdmin, captures: { fac: $.data.id } }
            - { call: "POST /facility-deliveries", payload: { facility_id: "${fac}", route_id: "${route_a}", delivery_date: "2026-06-15", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { del: $.data.id } }
          trigger:
            - { call: "POST /facility-deliveries/${del}/receive", payload: { outcome: "REJECT", gross_weight_lbs: 3000, contaminated_item_count: 9 }, as: RouteSupervisor, as_user_id: "sup_1", captures: { dst: $.data.status, daw: $.data.accepted_weight_lbs } }
            - { call: "GET /facilities/${fac}", as: ProgramAdmin, captures: { fac_lbs: $.data.season_accepted_lbs } }
          assert:
            - "capture ${dst} == REJECTED"
            - "capture ${daw} == 0"
            - "capture ${fac_lbs} == 0"

