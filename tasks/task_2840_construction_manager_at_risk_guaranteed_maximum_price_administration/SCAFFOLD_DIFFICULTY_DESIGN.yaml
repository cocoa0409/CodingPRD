              payload: {}
              as: ConstructionManager
          assert:
            - "${draw_needs_approval} == false (45000.00 <= DRAW_OWNER_APPROVAL_THRESHOLD 50000.00 and the posture is OPEN, so priority 120 is NOT the live rule)"
            - "${draw_amount} == 45000.00"
            - "the trigger response is 409 with error.code == ERR_DRAW_STATE_INVALID"
            - "the trigger response is NOT 422 ERR_CONTINGENCY_INSUFFICIENT even though 45000.00 > 40000.00"
            - "ContingencyDraw.${draw}.status == DENIED (the rejected post left no partial effect)"
            - "CmarProject.${proj}.construction_contingency_remaining == 40000.00 and contingency_drawn_to_cost_total == 0.00"
            - "single-violation control A - repeating the setup but approving the draw with approve true and then posting it returns 422 ERR_CONTINGENCY_INSUFFICIENT, proving priority 121 is live on its own"
            - "single-violation control B - repeating the setup with estimated_amount 30000.00, denying the draw and then posting it returns 409 ERR_DRAW_STATE_INVALID, proving priority 69 is live on its own"

      - name: open_book_disclosure_priority_81_outranks_solicitation_still_open_priority_100
