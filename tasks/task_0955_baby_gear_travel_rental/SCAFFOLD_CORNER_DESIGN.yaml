  # ------------------------------------------------------------- cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_amend_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential amends carrying the same observed version: the first succeeds (version 1 -> 2), the second with the now-stale version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["QUOTED reservation at version 1"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Don Ei", email: "don@x.com", phone: "030" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib AZ", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "56 Yew St", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id, res_v: $.data.version } }
          trigger:
            - { call: "POST /reservations/${res}/amend-dates", payload: { start_date: "2026-06-11", end_date: "2026-06-14", expected_reservation_version: "${res_v}" }, as: Customer, as_user_id: "${cust}", captures: { v_after: $.data.version } }
            - { call: "POST /reservations/${res}/amend-dates", payload: { start_date: "2026-06-12", end_date: "2026-06-15", expected_reservation_version: "${res_v}" }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "first amend succeeds, version becomes 2 and quote recomputed for [06-11, 06-14)"
            - "second amend with stale version rejected: error_id == ERR_STALE_VERSION (412)"

      - name: occ_extension_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[extension-create-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Extension create bumps Reservation.version; a second create carrying the pre-first-create version is rejected 412 (the supersede path requires a fresh view)."
        test_recipe:
          setup: ["CONFIRMED reservation; version observed before any extension"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Eva Fi", email: "eva@x.com", phone: "031" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib BA", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-BA1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "57 Zelkova Rd", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "GET /reservations/${res}", payload: {}, as: OperationsAdmin, captures: { res_v: $.data.version } }
          trigger:
            - { call: "POST /reservations/${res}/extensions", payload: { requested_end_date: "2026-06-15", expected_reservation_version: "${res_v}" }, as: Customer, as_user_id: "${cust}", captures: { ext1: $.data.id } }
            - { call: "POST /reservations/${res}/extensions", payload: { requested_end_date: "2026-06-16", expected_reservation_version: "${res_v}" }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "first extension created PENDING (id ${ext1})"
            - "second create with stale version rejected: error_id == ERR_STALE_VERSION (412)"

  # ------------------------------------------------------------- consistency model
  - section: consistency_model
    instances:
      - name: immediate_consistency_confirm_response
        claim_type: immediate_read_after_write
        grounds: [complexity_profile.consistency_model, state_machines.Reservation.QUOTED_to_CONFIRMED]
        distinguishing_aspect: "The confirm response itself (no re-read) shows status CONFIRMED, payment_status DEPOSIT_HELD, deposit_hold_cents 15000 — all cascade results visible in the same request."
        test_recipe:
          setup: ["QUOTED reservation; one unit available"]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Fox Gi", email: "fox@x.com", phone: "032" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib BB", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-BB1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "58 Acacia Ave", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
          trigger:
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}", captures: { st: $.data.status, ps: $.data.payment_status, hold: $.data.deposit_hold_cents } }
          assert:
            - "confirm response: status == CONFIRMED, payment_status == DEPOSIT_HELD, deposit_hold_cents == 15000"
