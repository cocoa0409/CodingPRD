      - name: royalty_versus_per_acre_greater_of_exact_tie
        endpoint: "POST /land-origination/leases/{leaseId}/rent-invoices"
        metric: "royalty_component_cents measured against per_acre_component_cents"
        boundary: "the greater-of crossover, where royalty_component_cents == per_acre_component_cents == 11760000"
        probes: ["79999 MWh -> royalty 11759853 (one cent-band below)", "80000 MWh -> royalty 11760000 (exact tie)", "80001 MWh -> royalty 11760147 (one cent-band above)"]
        grounds:
          - calculations.annual_rent_amount
          - calculations.annual_rent_amount.variants.FINAL_AS_BUILT
          - entities.RentInvoice.fields.gross_rent_cents
          - entities.OptionAgreement.fields.rent_structure_type
        distinguishing_aspect: |
          A comparison-crossover boundary rather than a threshold-ladder boundary:
          base_rent_per_acre_cents is tuned to 117600 so that on 100.00 buildable
          acres the per-acre component is exactly 11760000 and, at the royalty
          rate of 147 cents per MWh (4200 * 350 bps), production of exactly 80000
          MWh makes the two components equal to the cent. At the tie the
          greater-of must return that shared value once, not sum the components and
          not prefer the royalty leg by accident, and one extra MWh flips the
          winner by 147 cents. Unlike the tier-edge instance above, no constant
          ladder is consulted at all.
        test_recipe:
          setup:
            - "One Landowner 'Caprock Ranch Holdings LLC' with w9_on_file true and payment_hold false, three 48453 SetbackRule rows and the 125.00-acre Parcel with buildable_acres 100.00."
            - "One OptionAgreement with rent_structure_type ROYALTY_HYBRID, base_rent_per_acre_cents 117600, royalty_rate_bps 350, escalator_pct_bps 200, escalator_mode COMPOUND; executed by pm-user-01 and exercised by pm-user-02."
            - "The resulting LeaseAgreement fully secured at 5225000, memo submitted and recorded, so recording_status is RECORDED and every invoice created from here on is FINAL_AS_BUILT with acre_basis 100.00 and a live royalty leg."
            - "period_year 1 is used for all three probes, with the previous probe invoice voided each time so the (lease, period_year) slot is free; escalation_factor is therefore exactly 1 in every probe."
