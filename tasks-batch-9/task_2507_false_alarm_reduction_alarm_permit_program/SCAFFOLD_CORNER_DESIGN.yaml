      - name: nightly_run_advances_every_delinquent_invoice_in_one_call
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/false-alarm-program/_program-runs/nightly
          - calculations.delinquency_escalation.formula
          - state_machines.PenaltyInvoice.CURRENT_to_NOTICE
        distinguishing_aspect: "The nightly run is the program's only bulk endpoint and it must be per-item, not first-item-only: two invoices sharing one due date each independently take a 550-cent late penalty and advance CURRENT -> NOTICE in a single call, and the penalty is applied ONCE — a second nightly run at the same clock changes nothing."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; two systems permitted at one premises, raising two 5500-cent invoices both due 2026-08-31. The clock then moves to 2026-09-05T00:00:00Z (5 days past due)."
          setup_api_calls:
            - *k_clock
