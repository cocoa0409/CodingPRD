              captures: { acu_v2: $.data.acuity_verified }
          assert:
            - "NeedsAssessment.${a2_id}.status == VERIFIED (m1)"
            - "NeedsAssessment.${a1_id}.status == SUPERSEDED (m2, caused by m1)"
            - "CasePlan.${plan_id}.status == DRAFT and plan_revision == 2 (m3, caused by the supersession; basis was ${a1_id})"
            - "Case.${case_id}.acuity_verified == 100.0 (all-4 scores: base 1.0 * 1.25 clamped to 1.0 -> 100.0, no bonuses)"

