            - "RemoteSupportAssignment.${rsa_id}.safe_stop_required == false while the monitoring window is in MONITORING"

      - name: run_plan_exposure_nested_rounding_order
        grounds:
          - calculations.run_plan_exposure
          - calculations.run_plan_exposure.variants.per_line_rounded
          - calculations.run_plan_exposure.constants.LATE_RATE
          - calculations.run_plan_exposure.constants.WEATHER_ATTRIBUTION_CENTS
        distinguishing_aspect: "run_plan_exposure folds an order-sensitive fee term (0.0105 of the committed rate per late day) and a fractional weather term (8.037 per weather point) into a total that is additionally rounded per term rather than once, so the pinned order 'round each term, then sum' yields 762.28 where 'sum, then round' yields 762.27 for the same run plan."
