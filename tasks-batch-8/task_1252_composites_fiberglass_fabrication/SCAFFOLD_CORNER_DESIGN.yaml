          trigger:
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NO_ACTIVE_PERMIT (default clock 2026-05-01T00:00:00Z precedes the permit period)"

      - name: autoclave_turnaround_buffer_enforced
        claim_type: violation_to_error
        grounds: [calculations.equipment_window_capacity, "errors[ERR_TURNAROUND_BUFFER_VIOLATION]"]
        distinguishing_aspect: "Autoclave windows carry a 30-minute turnaround pad: a follow-up starting 15 minutes after the prior end is rejected even with ample capacity, while one starting exactly at end+30 is admitted (>= boundary)."
        test_recipe:
          setup: ["Clock T0; permit; approved PN-100; three production molds; three work orders at AWAITING_CURE; autoclave AC-1 turnaround 30, capacity 5"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
