      - name: coordinator_call_without_user_id_header_is_unauthorized
        claim_type: shared_operations
        grounds:
          - roles.DataCoordinator
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "DataCoordinator is entity_backed:Department, so the identity header is mandatory: omitting X-User-ID fails at 401 before the role check (403) or the department-scope check (403) can run."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Department DOT registered"
            - "The dataset-create request carries X-User-Role: DataCoordinator but NO X-User-ID header"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
          trigger:
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly traffic counts", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92, policy_value_score: 96 }
              as: DataCoordinator
          assert:
            - "Response is 401 with error_id ERR_UNAUTHENTICATED"
            - "error_id is NOT ERR_DEPARTMENT_SCOPE_VIOLATION and NOT ERR_ROLE_NOT_PERMITTED"
            - "GET /open-data/datasets returns total_count 0"

