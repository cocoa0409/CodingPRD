            - "no EquipmentInstallation row exists for ${uo} after all three attempts"

      - name: build_configuration_rejects_unknown_chassis_model_foreign_key
        claim_type: Foreign key references validated
        grounds:
          - complexity_profile.entity_topology
          - entities.BuildConfiguration.fields.chassis_model_id
          - entities.BuildConfiguration.fields.body_spec_id
        distinguishing_aspect: |
          On a flat topology the configuration is the join that makes a chassis model and a body spec
          into a buildable pair; both FKs must be resolved BEFORE the geometric compatibility gates
          (priorities 70 and 71) run, otherwise a bogus model id would surface as a cab-to-axle
          failure instead of a not-found.
        test_recipe:
          setup:
            - "A real SERVICE body spec exists but no chassis model with the id used in the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/body-specs"
              payload: { code: "SERVICE-11FT", body_type: "SERVICE", weight_lb: 2100, cg_from_body_front_in: 62, cargo_cg_from_body_front_in: 66, length_in: 132, required_min_ca_in: 84, required_min_wheelbase_in: 189, aux_amp_draw: 12, requires_hydraulics: false, list_price_cents: 1450000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bs_svc: "$.data.id" }
          trigger:
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-GHOST", chassis_model_id: "00000000-0000-4000-8000-000000000404", body_spec_id: "${bs_svc}", standardization_tier: "TIER_A" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "error_id == ERR_CHASSIS_MODEL_NOT_FOUND"
            - "error_id != ERR_CAB_TO_AXLE_INSUFFICIENT and error_id != ERR_WHEELBASE_INSUFFICIENT"
            - "no BuildConfiguration row with config_code CFG-GHOST exists"

  # =========================================================================
  # 2. From Table 2 (State Machines)
  # =========================================================================
  - section: state_machines
    instances:

      - name: chassis_and_order_dimensions_start_in_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.Chassis.initial_state
          - state_machines.UpfitOrder.build_status.initial_state
          - state_machines.UpfitOrder.compliance_status.initial_state
          - state_machines.UpfitOrder.body_install_status.initial_state
        distinguishing_aspect: |
          The order carries THREE independent state dimensions (§1.0 state_machine_shape: parallel),
          so a fresh order must land on the initial state of each one at once — DRAFT / NOT_STARTED /
          PLANNED — while the freshly received unit sits at RECEIVED. Getting one dimension right and
          leaving another null is the realistic failure.
        test_recipe:
          setup:
            - "A published CUSTOM service configuration, a customer, and a freshly received chassis."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
