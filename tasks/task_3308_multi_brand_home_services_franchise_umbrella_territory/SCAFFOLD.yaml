    input: [account_name, account_type, contracted_brands, service_level_hours, sla_credit_per_breach_cents, breach_tolerance, annual_commitment_cents]
    output: NationalAccount
    side_effects: ["status := ACTIVE", "open_breach_count := 0", "sla_credit_accrued_cents := 0", "accumulated_revenue_cents := 0"]
  - method: GET
    path: "/franchise/national-accounts/{id}"
    description: "Read one NationalAccount"
    roles: [FranchiseAdmin, ComplianceAuditor]
    code: 200
    input: []
    output: NationalAccount
    side_effects: []
  - method: GET
    path: "/franchise/national-accounts"
    description: "List NationalAccounts"
    roles: [FranchiseAdmin, ComplianceAuditor]
    code: 200
    input: ["account_type?", "status?", "limit?", "offset?"]
    output: NationalAccount[]
    side_effects: []

  # --- WorkOrder -----------------------------------------------------------
  - method: POST
    path: "/franchise/work-orders"
    description: "Open a work order against a performing agreement"
    roles: [FranchiseAdmin]
    code: 201
    input: [agreement_id, source, priority, service_level_hours, "parts_cents?", "national_account_id?", "lead_id?", "referral_id?"]
    output: WorkOrder
    side_effects: ["status := CREATED", "labor_cents := 0", "revenue_cents := 0"]
  - method: GET
    path: "/franchise/work-orders/{id}"
    description: "Read one WorkOrder"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/franchise/work-orders"
    description: "List WorkOrders; all four foreign keys collapse into this one filtered list"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: ["agreement_id?", "national_account_id?", "lead_id?", "referral_id?", "status?", "priority?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/franchise/work-orders/{id}/dispatch"
    description: "Dispatch a work order, setting its SLA due instant"
    roles: [FranchiseeOperator]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "status := DISPATCHED"
      - "dispatched_clock_iso := logical clock"
      - "sla_due_iso := logical clock + priority-scaled service_level_hours, rounded up to whole hours"
  - method: POST
    path: "/franchise/work-orders/{id}/start"
    description: "Start work on a dispatched order"
    roles: [FranchiseeOperator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status := IN_PROGRESS"]
  - method: POST
    path: "/franchise/work-orders/{id}/complete"
    description: "Complete a work order, computing labor and revenue"
    roles: [FranchiseeOperator]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "status := COMPLETED"
      - "closed_clock_iso := logical clock"
      - "labor_cents := labor_charge_calculation output"
      - "revenue_cents := labor_cents + parts_cents"
      - "national_account.accumulated_revenue_cents += revenue_cents when a program applies"
      - "When referral_id is set and that Referral is ACCEPTED, the referral moves to COMPLETED"
  - method: POST
    path: "/franchise/work-orders/{id}/breach"
    description: "Cross the SLA due instant and cascade the program breach"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "status := SLA_BREACHED"
      - "closed_clock_iso := logical clock"
      - "national_account.open_breach_count += 1"
      - "national_account.sla_credit_accrued_cents += the program's sla_credit_per_breach_cents"
      - "national_account.accumulated_revenue_cents += revenue_cents"
      - "When the recomputed open_breach_count > the program's breach_tolerance: national_account.status := SUSPENDED"

  # --- BrandStandardsAudit -------------------------------------------------
  - method: POST
    path: "/franchise/brand-standards-audits"
    description: "Schedule a brand standards audit or mystery shop"
    roles: [FranchiseAdmin]
    code: 201
    input: [agreement_id, audit_kind, conducted_iso, raw_score, findings_count, "auditor_operator_id?", "critical_findings_count?"]
    output: BrandStandardsAudit
    side_effects: ["audit_status := SCHEDULED", "remediation_status := NONE", "weighted_score := 0", "outcome := FAIL"]
  - method: GET
    path: "/franchise/brand-standards-audits/{id}"
    description: "Read one BrandStandardsAudit with both of its state dimensions"
    roles: [FranchiseAdmin, ComplianceAuditor]
    code: 200
    input: []
    output: BrandStandardsAudit
    side_effects: []
  - method: GET
    path: "/franchise/brand-standards-audits"
    description: "List audits; both foreign keys collapse into this one filtered list"
    roles: [FranchiseAdmin, ComplianceAuditor]
    code: 200
    input: ["agreement_id?", "verification_audit_id?", "audit_status?", "remediation_status?", "audit_kind?", "limit?", "offset?"]
    output: BrandStandardsAudit[]
    side_effects: []
  - method: POST
    path: "/franchise/brand-standards-audits/{id}/conduct"
    description: "Conduct a scheduled audit, recording the auditor and computing the weighted score and outcome"
    roles: [FranchiseAdmin]
    code: 200
    input: ["auditor_operator_id?"]
    output: BrandStandardsAudit
    side_effects:
      - "auditor_operator_id := the supplied operator when provided, otherwise the value already on the audit"
      - "audit_status := CONDUCTED"
      - "weighted_score := standards_audit_score_calculation output"
      - "outcome := PASS | WATCH | FAIL"
  - method: POST
    path: "/franchise/brand-standards-audits/{id}/publish"
    description: "Publish a conducted audit, advancing the audit cycle and opening remediation on failure"
    roles: [FranchiseAdmin]
    code: 200
    input: [expected_agreement_version]
    output: BrandStandardsAudit
    side_effects:
      - "audit_status := PUBLISHED"
      - "agreement.audit_due_iso := conducted_iso + brand.audit_cycle_months"
      - "Earlier PUBLISHED audits for the same agreement move to audit_status SUPERSEDED"
      - "When outcome is FAIL: remediation_status := OPEN, remediation_owner_operator_id set, remediation_opened_clock_iso := logical clock, remediation_due_iso := logical clock + STANDARDS_REMEDIATION_HOURS"
      - "agreement.open_remediation_count recomputed"
      - "agreement.standards_status recomputed as the worst of COMPLIANT < WATCH < REMEDIATION_REQUIRED < DEFAULT"
      - "increments FranchiseAgreement.version by 1"
  - method: POST
    path: "/franchise/brand-standards-audits/{id}/reopen"
    description: "Reopen a just-published audit inside its 24-hour window, reverting the remediation"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: BrandStandardsAudit
    side_effects:
      - "audit_status := CONDUCTED"
      - "remediation_status := NONE, remediation_opened_clock_iso := null, remediation_due_iso := null"
      - "agreement.open_remediation_count recomputed"
      - "agreement.standards_status recomputed"
  - method: POST
    path: "/franchise/brand-standards-audits/{id}/remediation-transitions"
    description: "Advance the remediation dimension: submit, acknowledge, resolve, reject, escalate or default"
    roles: [FranchiseAdmin]
    code: 200
    input: [action, "verifier_operator_id?", "verification_audit_id?", "reason?"]
    output: BrandStandardsAudit
    side_effects:
      - "action SUBMIT: verification_audit_id bound, remediation_status := SUBMITTED"
      - "action ACKNOWLEDGE: verifier_operator_id set, remediation_status := RE_VERIFICATION"
      - "action RESOLVE: remediation_status := RESOLVED, remediation_resolved_clock_iso := logical clock"
      - "action REJECT: remediation_status := RE_VERIFICATION"
      - "action ESCALATE: remediation_status := ESCALATED"
      - "action DEFAULT: remediation_status := DEFAULTED, agreement.standards_status := DEFAULT, agreement franchisee.status := SUSPENDED"
      - "agreement.open_remediation_count recomputed"
      - "agreement.standards_status recomputed"

  # --- RoyaltyStatement ----------------------------------------------------
  - method: POST
    path: "/franchise/royalty-statements"
    description: "Open a draft royalty statement period"
    roles: [FranchiseAdmin]
    code: 201
    input: [agreement_id, period_start, period_end, gross_revenue_cents]
    output: RoyaltyStatement
    side_effects: ["status := DRAFT", "accrual_variant := DRAFT_PROPORTIONAL"]
  - method: GET
    path: "/franchise/royalty-statements/{id}"
    description: "Read one RoyaltyStatement"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []
  - method: GET
    path: "/franchise/royalty-statements/{id}/preview"
    description: "Recompute the provisional accrual without issuing the statement"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: { accrual_variant: string, royalty_cents: integer, ad_fund_cents: integer, referral_offset_cents: integer, net_remittance_cents: integer }
    side_effects: []
  - method: GET
    path: "/franchise/royalty-statements"
    description: "List RoyaltyStatements, optionally filtered by agreement"
    roles: [FranchiseAdmin, ComplianceAuditor]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    side_effects: []
  - method: POST
    path: "/franchise/royalty-statements/{id}/issue"
    description: "Issue the statement, switching to the final netted accrual"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects:
      - "status := ISSUED"
      - "royalty_cents := royalty_accrual_calculation output under FINAL_NETTED"
      - "ad_fund_cents := national ad fund component"
      - "referral_offset_cents := referral_offset_calculation output"
      - "net_remittance_cents := max(0, royalty_cents + ad_fund_cents - referral_offset_cents)"
      - "accrual_variant := FINAL_NETTED"
      - "issued_clock_iso := logical clock"
      - "agreement.cumulative_royalty_cents += royalty_cents"
  - method: POST
    path: "/franchise/royalty-statements/{id}/pay"
    description: "Mark an issued statement paid"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["status := PAID"]
  - method: POST
    path: "/franchise/royalty-statements/{id}/void"
    description: "Void an issued statement and reverse its accrual"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["status := VOIDED", "agreement.cumulative_royalty_cents -= royalty_cents"]

  # --- TerritoryAssignment -------------------------------------------------
  - method: GET
    path: "/franchise/territory-assignments/{id}"
    description: "Read one TerritoryAssignment"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: []
    output: TerritoryAssignment
    side_effects: []
  - method: GET
    path: "/franchise/territory-assignments"
    description: "List TerritoryAssignments; all three foreign keys collapse into this one filtered list"
    roles: [FranchiseAdmin, FranchiseeOperator, ComplianceAuditor]
    code: 200
    input: ["territory_id?", "franchisee_id?", "source_agreement_id?", "active?", "limit?", "offset?"]
    output: TerritoryAssignment[]
    side_effects: []

  # --- Test-driving endpoints ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default is 2026-09-01T00:00:00Z and never falls back to wall-clock time; every deadline, expiry and window rule reads this clock. Setting the clock does NOT itself fire any automatic transition — call POST /_ops/run_sweep afterwards to apply them."
    roles: [FranchiseAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "The logical clock advances to current_utc"
      - "No automatic transition fires during clock set; the advance is applied only by POST /_ops/run_sweep"
  - method: POST
    path: "/_ops/run_sweep"
    description: "Apply every automatic clock-crossing transition the current logical clock has reached, then return what fired. This is the administrator's periodic sweep: the system never advances these transitions merely because the clock moved, so a test can inspect a pre-sweep state."
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: { work_orders_breached: "string[]", agreements_expired: "string[]", remediations_escalated: "string[]" }
    side_effects:
      - "Every WorkOrder row in status IN {DISPATCHED, IN_PROGRESS} whose sla_due_iso is at or before the logical clock moves to SLA_BREACHED, with its national-account cascade"
      - "Every FranchiseAgreement row in lifecycle_status IN {ACTIVE, RENEWAL_PENDING} whose expires_on is at or before the logical clock moves to EXPIRED, with its territory and franchisee cascade"
      - "Every BrandStandardsAudit row in remediation_status OPEN whose remediation_due_iso is at or before the logical clock moves its remediation to ESCALATED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth + ownership
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or naming an undeclared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The authenticated role is not listed in the endpoint's roles"
  - id: ERR_NOT_RECEIVING_FRANCHISEE
    http: 403
    condition: "A referral or lead action was attempted by a franchisee that is not the receiving party"
  - id: ERR_NOT_PERFORMING_FRANCHISEE
    http: 403
    condition: "A work-order action was attempted by a franchisee that does not own the performing agreement"
  - id: ERR_NOT_REFERRAL_PARTY
    http: 403
    condition: "A dispute was raised by a franchisee that is neither the originating nor the receiving party"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The second operator of a two-step control equals the first (reviewer vs approver, remediation owner vs verifier)"

  # request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is absent, an enum member is undeclared, an unknown field is supplied, or critical_findings_count exceeds findings_count"
  - id: ERR_AUDITOR_REQUIRED
    http: 400
    condition: "Conducting an audit without auditor_operator_id"
  - id: ERR_APPROVER_REQUIRED
    http: 400
    condition: "Approving a transfer application without approval_operator_id"
  - id: ERR_INVALID_PERIOD
    http: 400
    condition: "A statement period has period_end <= period_start"

  # existence
  - id: ERR_BRAND_NOT_FOUND
    http: 404
    condition: "brand_id names no Brand"
  - id: ERR_FRANCHISEE_NOT_FOUND
    http: 404
    condition: "franchisee_id names no Franchisee"
  - id: ERR_TERRITORY_NOT_FOUND
    http: 404
    condition: "territory_id names no Territory"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement_id names no FranchiseAgreement"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "referral_id names no Referral"
  - id: ERR_LEAD_NOT_FOUND
    http: 404
    condition: "lead_id names no Lead"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "national_account_id names no NationalAccount"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "The path work-order id names no WorkOrder"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "The path audit id names no BrandStandardsAudit"
  - id: ERR_VERIFICATION_AUDIT_NOT_FOUND
    http: 404
    condition: "verification_audit_id names no BrandStandardsAudit for the same agreement"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "The path statement id names no RoyaltyStatement"
  - id: ERR_TRANSFER_APPLICATION_NOT_FOUND
    http: 404
    condition: "The path transfer-application id names no TransferApplication"

  # state
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which the requested transition is declared"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target resource has already reached a terminal state"
  - id: ERR_REFERRAL_DISPUTED
    http: 409
    condition: "Settling a referral that still carries an open dispute"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version in the request body does not match the stored parent version"

  # trade qualification
  - id: ERR_CERTIFICATION_TOO_LOW
    http: 422
    condition: "The performing agreement's certification_level ranks below the brand's min_certification_level"
  - id: ERR_ACCOUNT_BRAND_NOT_CONTRACTED
    http: 422
    condition: "The performing brand is not a member of the program's contracted_brands"
  - id: ERR_SHARED_SERVICES_REQUIRED
    http: 422
    condition: "The receiving franchisee has shared_services_enrolled false"

  # cross-entity linkage
  - id: ERR_AGREEMENT_REQUIRED_FOR_AWARD
    http: 409
    condition: "Awarding a territory with no matching agreement in lifecycle_status IN {OFFERED, ACTIVE}"
  - id: ERR_AGREEMENT_TERRITORY_NOT_AWARDED
    http: 409
    condition: "Activating an agreement whose bound territory is not AWARDED"
  - id: ERR_OPEN_REMEDIATION
    http: 409
    condition: "The agreement carries an open remediation where a clean standards record is required"
  - id: ERR_STANDARDS_DEFAULTED
    http: 409
    condition: "The agreement's standards_status is DEFAULT"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "Dispatching work for a national account whose status is not ACTIVE"
  - id: ERR_REMEDIATION_FAILED
    http: 422
    condition: "Resolving a remediation whose verification audit weighted_score is below PASS_MIN"

  # uniqueness / set / threshold
  - id: ERR_TERRITORY_POSTAL_OVERLAP
    http: 409
    condition: "A postal code would belong to two non-reclaimed territories of the same brand"
  - id: ERR_DUPLICATE_BRAND_CODE
    http: 409
    condition: "brand_code already exists"
  - id: ERR_DUPLICATE_TERRITORY_CODE
    http: 409
    condition: "territory_code already exists"
  - id: ERR_DUPLICATE_AGREEMENT_NUMBER
    http: 409
    condition: "agreement_number already exists"
  - id: ERR_DUPLICATE_REFERRAL_CODE
    http: 409
    condition: "referral_code already exists"
  - id: ERR_TERRITORY_ALREADY_AGREED
    http: 409
    condition: "Another agreement for the same territory is in lifecycle_status IN {ACTIVE, RENEWAL_PENDING, TRANSFER_PENDING}"
  - id: ERR_LEAD_BRAND_MISMATCH
    http: 409
    condition: "The receiving agreement's brand_id does not match the lead's brand_id"
  - id: ERR_TARGET_TERRITORY_INVALID
    http: 409
    condition: "A reallocation target id names no non-reclaimed territory of the same brand"
  - id: ERR_TRANSFER_ALREADY_PENDING
    http: 409
    condition: "Another transfer application for the same agreement is not yet closed or rejected"
  - id: ERR_EXPANSION_THRESHOLD_NOT_MET
    http: 409
    condition: "household_count is strictly below expansion_right_households"
  - id: ERR_LEAD_POOL_EMPTY
    http: 409
    condition: "recipient_selection_calculation found no eligible agreement"

  # temporal windows
  - id: ERR_SLA_WINDOW_EXCEEDS_PROGRAM
    http: 422
    condition: "The work order's service_level_hours exceeds the program's service_level_hours"
  - id: ERR_RENEWAL_WINDOW_CLOSED
    http: 409
    condition: "renew was called while expires_on is at or beyond the logical clock plus 90 days"
  - id: ERR_AUDIT_CYCLE_EXCEEDED
    http: 409
    condition: "The audit's conducted_iso is at or after the agreement's audit_due_iso"
  - id: ERR_REMEDIATION_WINDOW_CLOSED
    http: 409
    condition: "The verification audit's conducted_iso is after remediation_due_iso"
  - id: ERR_HOLD_WINDOW_ACTIVE
    http: 409
    condition: "Releasing a lead allocation at or before allocation_hold_until_iso"
  - id: ERR_REFERRAL_EXPIRED
    http: 409
    condition: "Accepting a referral at or after expires_clock_iso"
  - id: ERR_REOPEN_WINDOW_CLOSED
    http: 409
    condition: "Reopening a published audit at or after conducted_iso plus 24 hours"
  - id: ERR_REMEDIATION_NOT_OVERDUE
    http: 409
    condition: "Escalating a remediation strictly before remediation_due_iso"
  - id: ERR_AGREEMENT_NOT_EXPIRABLE
    http: 422
    condition: "Expiring an agreement while the logical clock is strictly before expires_on"
  - id: ERR_SLA_NOT_BREACHED
    http: 422
    condition: "Breaching a work order while the logical clock is strictly before sla_due_iso"

  # fiscal
  - id: ERR_HOUSEHOLD_CAP_EXCEEDED
    http: 422
    condition: "The franchisee's cumulative protected household_count would exceed 250000"
  - id: ERR_STATEMENT_PERIOD_OVERLAP
    http: 422
    condition: "The period overlaps a non-voided statement for the same agreement"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FranchiseAdmin
    description: "Franchisor-side operator: defines brands and territories, awards and reclaims, activates and expires agreements, publishes audits, settles referrals, allocates leads, issues statements, and drives the test clock."
    identity: opaque
    exclusive_operations:
      - "POST /franchise/brands"
      - "POST /franchise/franchisees"
      - "POST /franchise/franchisees/{id}/suspend"
      - "POST /franchise/territories/{id}/offer"
      - "POST /franchise/territories/{id}/award"
      - "POST /franchise/territories/{id}/reallocate"
      - "POST /franchise/territories/{id}/reclaim"
      - "POST /franchise/agreements/{id}/activate"
      - "POST /franchise/agreements/{id}/activate-renewal"
      - "POST /franchise/agreements/{id}/suspend"
      - "POST /franchise/agreements/{id}/reinstate"
      - "POST /franchise/agreements/{id}/expire"
      - "POST /franchise/transfer-applications/{id}/begin-review"
      - "POST /franchise/transfer-applications/{id}/request-revision"
      - "POST /franchise/transfer-applications/{id}/approve"
      - "POST /franchise/transfer-applications/{id}/reject"
      - "POST /franchise/transfer-applications/{id}/close"
      - "POST /franchise/referrals/{id}/resolve-dispute"
      - "POST /franchise/referrals/{id}/settle"
      - "POST /franchise/leads/{id}/allocate"
      - "POST /franchise/leads/{id}/convert"
      - "POST /franchise/brand-standards-audits"
      - "POST /franchise/brand-standards-audits/{id}/conduct"
      - "POST /franchise/brand-standards-audits/{id}/publish"
      - "POST /franchise/brand-standards-audits/{id}/reopen"
      - "POST /franchise/brand-standards-audits/{id}/remediation-transitions"
      - "POST /franchise/royalty-statements"
      - "POST /franchise/royalty-statements/{id}/issue"
      - "POST /franchise/royalty-statements/{id}/pay"
      - "POST /franchise/royalty-statements/{id}/void"
      - "POST /franchise/work-orders/{id}/breach"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run_sweep"
    shared_operations:
      - "GET /franchise/brands/{id}"
      - "GET /franchise/agreements"
      - "GET /franchise/referrals"
      - "GET /franchise/work-orders"
      - "GET /franchise/brand-standards-audits"

  - name: FranchiseeOperator
    description: "Franchisee-side operator acting as a specific Franchisee. Requests expansion, renews and transfers its own agreements, accepts and completes referrals, releases lead allocations, and performs work orders."
    identity: entity_backed:Franchisee
    exclusive_operations:
      - "POST /franchise/territories/{id}/request-expansion"
      - "POST /franchise/territories/{id}/withdraw-expansion"
      - "POST /franchise/agreements/{id}/renew"
      - "POST /franchise/transfer-applications"
      - "POST /franchise/transfer-applications/{id}/revise"
      - "POST /franchise/transfer-applications/{id}/withdraw"
      - "POST /franchise/referrals"
      - "POST /franchise/referrals/{id}/accept"
      - "POST /franchise/referrals/{id}/decline"
      - "POST /franchise/referrals/{id}/complete"
      - "POST /franchise/referrals/{id}/dispute"
      - "POST /franchise/leads/{id}/release"
      - "POST /franchise/work-orders/{id}/dispatch"
      - "POST /franchise/work-orders/{id}/start"
      - "POST /franchise/work-orders/{id}/complete"
    shared_operations:
      - "GET /franchise/agreements/{id}"
      - "GET /franchise/territories"
      - "GET /franchise/work-orders"
      - "GET /franchise/leads"

  - name: ComplianceAuditor
    description: "Franchisor compliance operator with read-only visibility across brands, agreements, audits, referrals and statements for standards review."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /franchise/brands/{id}"
      - "GET /franchise/brands"
      - "GET /franchise/agreements/{id}"
      - "GET /franchise/agreements"
      - "GET /franchise/brand-standards-audits/{id}"
      - "GET /franchise/brand-standards-audits"
      - "GET /franchise/referrals"
      - "GET /franchise/royalty-statements"
      - "GET /franchise/work-orders"
      - "GET /franchise/national-accounts"