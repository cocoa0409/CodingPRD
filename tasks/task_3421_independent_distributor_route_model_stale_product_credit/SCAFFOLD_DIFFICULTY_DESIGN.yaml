              as: CompanyAdmin
              captures: { terr2_id: $.data.id }
            - call: "POST /territories/${terr2_id}/list-for-sale"
              payload: {}
              as: CompanyAdmin
          trigger:
            - call: "POST /agreements"
              payload: { territory_id: "${terr2_id}", distributor_id: "${dist_id}", bakery_id: "${bakery_id}", purchase_price_cents: 800000, financed_amount_cents: 0, discount_pct: 0.20, start_date: "2027-06-01", end_date: "2028-06-01" }
              as: RouteOpsManager
              captures: { overlap_err: $.data.error_id }
            - call: "POST /agreements"
              payload: { territory_id: "${terr2_id}", distributor_id: "${dist_id}", bakery_id: "${bakery_id}", purchase_price_cents: 800000, financed_amount_cents: 0, discount_pct: 0.20, start_date: "2027-09-01", end_date: "2028-09-01" }
              as: RouteOpsManager
              captures: { agr2_id: $.data.id }
          assert:
            - "overlapping [2027-06-01, 2028-06-01) returns 409 and overlap_err == ERR_DISTRIBUTOR_AGREEMENT_OVERLAP"
            - "adjacent [2027-09-01, 2028-09-01) succeeds (201) because the first agreement's end equals the new start under half-open semantics"
            - "RouteAgreement.${agr2_id}.status == DRAFT and Territory.${terr2_id}.status == UNDER_AGREEMENT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: confirm_cancel_capacity_conservation
        grounds:
          - state_machines.DailyOrder.SUBMITTED_to_CONFIRMED
          - state_machines.DailyOrder.CONFIRMED_to_CANCELLED
          - entities.ProductionDay.fields.allocated_units
        distinguishing_aspect: "Conserved quantity is production capacity: confirm (+25) followed by its compensating cancel (-25) leaves ProductionDay.allocated_units + (capacity_units - allocated_units) == capacity_units == 100 invariant at every observation, with version advancing 1 -> 2 -> 3."
        test_recipe:
          setup:
            - "Active cash agreement; production day 2026-09-04 capacity 100; a SUBMITTED 25-unit order."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr
            - *k_activate
            - *k_day0904
            - call: "POST /distributors/${dist_id}/orders"
              payload: { delivery_date: "2026-09-04", lines: [{ sku: "WHT-24", qty: 25 }] }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ord_h_id: $.data.id }
            - call: "POST /orders/${ord_h_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /orders/${ord_h_id}/confirm"
              payload: { expected_production_day_version: "${day0904_v}" }
              as: RouteOpsManager
            - call: "GET /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-04" }
              as: RouteOpsManager
              captures: { alloc_mid: "$.data[0].allocated_units", v_mid: "$.data[0].version" }
            - call: "POST /orders/${ord_h_id}/cancel"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "GET /bakeries/${bakery_id}/production-days"
              payload: { date: "2026-09-04" }
              as: RouteOpsManager
              captures: { alloc_end: "$.data[0].allocated_units", v_end: "$.data[0].version" }
          assert:
            - "before confirm: allocated_units == 0 and capacity_units == 100 (0 + 100 == 100)"
            - "after confirm: alloc_mid == 25 (25 + 75 == 100) and v_mid == 2"
            - "after cancel: alloc_end == 0 (0 + 100 == 100) and v_end == 3"
            - "DailyOrder.${ord_h_id}.status == CANCELLED and cancelled_reason == DISTRIBUTOR_CANCELLED"

      - name: transfer_settle_valuation_equals_payoff_plus_payout
        grounds:
          - calculations.transfer_valuation
          - calculations.financing_payoff
          - entities.TerritoryTransfer.fields.distributor_payout_cents
        distinguishing_aspect: "Conserved quantity is valuation cents (different from production capacity): after one payment (interest 100, principal 5155), settle on 2026-09-09 conserves gross_valuation == financing_payoff + distributor_payout exactly — 1000000 == 46935 + 953065."
        test_recipe:
          setup:
            - "Financed agreement ACTIVE, plan disbursed 2026-09-01; one payment of 5255 on 2026-09-02 (outstanding 46845); exit VOLUNTARY initiated 2026-09-09."
          setup_api_calls:
            - *k_clock0901
            - *k_bakery
            - *k_terr1
            - *k_terr1_list
            - *k_dist
            - *k_agr_fin
            - *k_plan
            - *k_disburse
            - *k_activate_fin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T09:00:00Z" }
              as: CompanyAdmin
            - call: "POST /financing-plans/${plan_id}/payments"
              payload: { amount_cents: 5255 }
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-09T10:00:00Z" }
              as: CompanyAdmin
            - call: "POST /agreements/${agrf_id}/exit"
              payload: { mode: "VOLUNTARY" }
              as: RouteOpsManager
            - call: "GET /agreements/${agrf_id}/transfers"
              payload: {}
              as: CreditAnalyst
              captures: { transfer2_id: "$.data[0].id" }
          trigger:
            - call: "POST /transfers/${transfer2_id}/settle"
              payload: {}
              as: CreditAnalyst
          assert:
            - "TerritoryTransfer.${transfer2_id}.gross_valuation_cents == 1000000"
            - "TerritoryTransfer.${transfer2_id}.financing_payoff_cents == 46935 (46845 + round_half_up(46845 * 0.10 * 7 / 365) = 46845 + 90)"
            - "TerritoryTransfer.${transfer2_id}.distributor_payout_cents == 953065"
            - "conservation: 46935 + 953065 == 1000000 == gross_valuation_cents (to the cent, no drift)"
            - "FinancingPlan.${plan_id}.status == SETTLED_ON_EXIT and outstanding_principal_cents == 0"
