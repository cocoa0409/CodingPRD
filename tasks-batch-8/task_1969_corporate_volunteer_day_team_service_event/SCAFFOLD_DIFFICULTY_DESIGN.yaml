# =============================================================================
# Task 1969 — SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8 Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# All times are ISO8601 UTC against the logical clock (default 2026-08-01T00:00:00Z).
# Canonical event window used below: 2026-08-20T09:00:00Z .. 2026-08-20T15:00:00Z (6.0 h).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: sponsorship_provisional_vs_settled_checkin_divergence
        grounds:
          - calculations.sponsorship_amount
          - entities.Sponsorship.fields.provisional_amount_cents
          - entities.Sponsorship.fields.settled_amount_cents
          - state_machines.Sponsorship.COMMITTED_to_SETTLED
        distinguishing_aspect: |
          Dual-variant divergence on the SPONSORSHIP (money) domain: for identical registration
          data (2 confirmed, 1 checks in, 1 no-shows) the forward-looking provisional variant
          counts CONFIRMED+CHECKED_IN headcount (2 x 2500 = 5000) while the chronological
          settled variant counts only CHECKED_IN (1 x 2500 = 2500).
        test_recipe:
          setup:
            - "Event 2026-08-20 09:00-15:00Z, project LOCKED (posture READY), two adult volunteers CONFIRMED (reg1 waiver VERIFIED, reg2 only SIGNED), one ACTIVE lead, received supply order"
            - "PER_CHECK_IN sponsorship rate 2500 cap 100000, COMMITTED, while 2 confirmed and 0 checked in"
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day A", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 1000000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol One", email: "v1@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { vol1: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol Two", email: "v2@corp.com", department: "Eng", date_of_birth: "1992-02-02" }, as: CommunityEngagementManager, captures: { vol2: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Lead One", email: "lead1@corp.com", department: "Ops", date_of_birth: "1985-03-03", is_staff_lead: true }, as: CommunityEngagementManager, captures: { lead1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false, wants_transport: false }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { reg1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false, wants_transport: false }, as: EmployeeVolunteer, as_user_id: "${vol2}", captures: { reg2: $.data.id } }
            - { call: "POST /registrations/${reg1}/sign-waiver", payload: { signer_name: "Vol One", signer_relation: "SELF", media_consent: true }, as: EmployeeVolunteer, as_user_id: "${vol1}" }
            - { call: "POST /registrations/${reg2}/sign-waiver", payload: { signer_name: "Vol Two", signer_relation: "SELF", media_consent: false }, as: EmployeeVolunteer, as_user_id: "${vol2}" }
            - { call: "POST /registrations/${reg1}/verify-waiver", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations/${reg1}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations/${reg2}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /supervision-assignments", payload: { project_id: "${proj1}", lead_volunteer_id: "${lead1}" }, as: CommunityEngagementManager, captures: { sup1: $.data.id } }
            - { call: "POST /procurement-orders", payload: { event_id: "${ev1}", project_id: "${proj1}", lines: [ { item_name: "Gloves", quantity: 2, unit_cost_cents: 500 } ] }, as: CommunityEngagementManager, as_user_id: "cem-1", captures: { ord1: $.data.id } }
            - { call: "POST /procurement-orders/${ord1}/submit", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders/${ord1}/approve", payload: {}, as: ProcurementOfficer, as_user_id: "po-1" }
            - { call: "POST /procurement-orders/${ord1}/receive", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/lock", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /sponsorships", payload: { event_id: "${ev1}", sponsor_name: "CorpCo", match_type: "PER_CHECK_IN", rate_cents: 2500, pledge_cap_cents: 100000 }, as: FinanceController, captures: { sp1: $.data.id } }
            - { call: "POST /sponsorships/${sp1}/commit", payload: {}, as: FinanceController }
            - { call: "POST /service-events/${ev1}/lock-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "GET /sponsorships/${sp1}", payload: {}, as: Any, captures: { prov_amt: $.data.provisional_amount_cents } }
            - { call: "POST /service-events/${ev1}/begin", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations/${reg1}/check-in", payload: {}, as: StaffLead, as_user_id: "${lead1}" }
            - { call: "POST /service-events/${ev1}/complete", payload: {}, as: CommunityEngagementManager }
          trigger:
            - { call: "POST /sponsorships/${sp1}/settle", payload: {}, as: FinanceController, captures: { settled_amt: $.data.settled_amount_cents, sp_status: $.data.status } }
          assert:
            - "provisional variant: ${prov_amt} == 5000 (2 confirmed x 2500, forward-looking set)"
            - "settled variant: ${settled_amt} == 2500 (1 checked-in x 2500, chronological actuals)"
            - "${prov_amt} != ${settled_amt} for identical underlying registrations"
            - "Sponsorship.${sp1}.status == SETTLED"
            - "Registration.${reg2}.rsvp_status == NO_SHOW (complete cascade)"

      - name: volunteer_hours_scheduled_vs_verified_divergence
        grounds:
          - calculations.volunteer_hours_credit
          - entities.Registration.fields.scheduled_hours_credit
          - entities.Registration.fields.verified_hours_credit
        distinguishing_aspect: |
          Dual-variant divergence on the REGISTRATION/IMPACT (hours) domain — a different entity
          domain from sponsorship money: a checked-in volunteer on a 6.0h event with only a 2.5h
          VERIFIED impact record shows scheduled_hours_credit 6.0 vs verified_hours_credit 2.5.
        test_recipe:
          setup:
            - "Event 2026-08-20 09:00-15:00Z (6.0 scheduled hours), project LOCKED, one adult volunteer CHECKED_IN with VERIFIED waiver, one ACTIVE lead, received order"
            - "Impact record of 2.5 hours submitted by the nonprofit and VERIFIED"
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day B", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 1000000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol One", email: "v1@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { vol1: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Lead One", email: "lead1@corp.com", department: "Ops", date_of_birth: "1985-03-03", is_staff_lead: true }, as: CommunityEngagementManager, captures: { lead1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false, wants_transport: false }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { reg1: $.data.id } }
            - { call: "POST /registrations/${reg1}/sign-waiver", payload: { signer_name: "Vol One", signer_relation: "SELF", media_consent: true }, as: EmployeeVolunteer, as_user_id: "${vol1}" }
            - { call: "POST /registrations/${reg1}/verify-waiver", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations/${reg1}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /supervision-assignments", payload: { project_id: "${proj1}", lead_volunteer_id: "${lead1}" }, as: CommunityEngagementManager, captures: { sup1: $.data.id } }
            - { call: "POST /procurement-orders", payload: { event_id: "${ev1}", project_id: "${proj1}", lines: [ { item_name: "Gloves", quantity: 2, unit_cost_cents: 500 } ] }, as: CommunityEngagementManager, as_user_id: "cem-1", captures: { ord1: $.data.id } }
            - { call: "POST /procurement-orders/${ord1}/submit", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders/${ord1}/approve", payload: {}, as: ProcurementOfficer, as_user_id: "po-1" }
            - { call: "POST /procurement-orders/${ord1}/receive", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/lock", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/lock-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/begin", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations/${reg1}/check-in", payload: {}, as: StaffLead, as_user_id: "${lead1}" }
            - { call: "POST /impact-records", payload: { registration_id: "${reg1}", project_id: "${proj1}", hours_attended: 2.5, photo_count: 0 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { ir1: $.data.id } }
            - { call: "POST /impact-records/${ir1}/verify", payload: {}, as: CommunityEngagementManager }
          trigger:
            - { call: "GET /registrations/${reg1}", payload: {}, as: Any, captures: { sched_h: $.data.scheduled_hours_credit, ver_h: $.data.verified_hours_credit } }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { ev_sched: $.data.total_scheduled_hours, ev_ver: $.data.total_verified_hours } }
          assert:
            - "Registration.${reg1}.scheduled_hours_credit == 6.0 (CHECKED_IN whole-window credit)"
            - "Registration.${reg1}.verified_hours_credit == 2.5 (VERIFIED impact only)"
            - "${sched_h} != ${ver_h} for identical underlying data"
            - "ServiceEvent.${ev1}.total_scheduled_hours == 6.0 and total_verified_hours == 2.5"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: supervision_requirement_dual_ceiling_mixed_minors
        grounds:
          - calculations.supervision_requirement
          - entities.ServiceProject.fields.required_staff_leads
        distinguishing_aspect: |
          Mode (a): a formula with >=3 inputs (adult_confirmed, minor_confirmed, two ratio
          constants) and non-linear interaction (two independent ceilings plus a zero-set
          branch). 1 adult + 4 minors -> ceil(1/8)+ceil(4/4) = 2; adding a 5th minor ->
          ceil(1/8)+ceil(5/4) = 3. Adult-only and minor-only ratios would each give different
          answers; the interaction is the point.
        test_recipe:
          setup:
            - "Project (min 1, max 12) MATCHED to an OPEN event; 1 adult + 4 minors CONFIRMED; minors signed by GUARDIAN"
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Park Build", min_volunteers: 1, max_volunteers: 12 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day C", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 1000000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Adult A", email: "a@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { volA: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Minor One", email: "m1@corp.com", department: "Intern", date_of_birth: "2011-05-01" }, as: CommunityEngagementManager, captures: { volM1: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Minor Two", email: "m2@corp.com", department: "Intern", date_of_birth: "2011-05-01" }, as: CommunityEngagementManager, captures: { volM2: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Minor Three", email: "m3@corp.com", department: "Intern", date_of_birth: "2011-05-01" }, as: CommunityEngagementManager, captures: { volM3: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Minor Four", email: "m4@corp.com", department: "Intern", date_of_birth: "2011-05-01" }, as: CommunityEngagementManager, captures: { volM4: $.data.id } }
            - { call: "POST /employee-volunteers", payload: { full_name: "Minor Five", email: "m5@corp.com", department: "Intern", date_of_birth: "2011-05-01" }, as: CommunityEngagementManager, captures: { volM5: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${volA}", captures: { regA: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${volM1}", captures: { regM1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${volM2}", captures: { regM2: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${volM3}", captures: { regM3: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${volM4}", captures: { regM4: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${volM5}", captures: { regM5: $.data.id } }
            - { call: "POST /registrations/${regA}/sign-waiver", payload: { signer_name: "Adult A", signer_relation: "SELF", media_consent: true }, as: EmployeeVolunteer, as_user_id: "${volA}" }
            - { call: "POST /registrations/${regM1}/sign-waiver", payload: { signer_name: "Guard One", signer_relation: "GUARDIAN", media_consent: false, guardian_name: "Guard One" }, as: EmployeeVolunteer, as_user_id: "${volM1}" }
            - { call: "POST /registrations/${regM2}/sign-waiver", payload: { signer_name: "Guard Two", signer_relation: "GUARDIAN", media_consent: false, guardian_name: "Guard Two" }, as: EmployeeVolunteer, as_user_id: "${volM2}" }
            - { call: "POST /registrations/${regM3}/sign-waiver", payload: { signer_name: "Guard Three", signer_relation: "GUARDIAN", media_consent: false, guardian_name: "Guard Three" }, as: EmployeeVolunteer, as_user_id: "${volM3}" }
            - { call: "POST /registrations/${regM4}/sign-waiver", payload: { signer_name: "Guard Four", signer_relation: "GUARDIAN", media_consent: false, guardian_name: "Guard Four" }, as: EmployeeVolunteer, as_user_id: "${volM4}" }
            - { call: "POST /registrations/${regM5}/sign-waiver", payload: { signer_name: "Guard Five", signer_relation: "GUARDIAN", media_consent: false, guardian_name: "Guard Five" }, as: EmployeeVolunteer, as_user_id: "${volM5}" }
            - { call: "POST /registrations/${regA}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations/${regM1}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations/${regM2}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations/${regM3}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /registrations/${regM4}/confirm", payload: {}, as: CommunityEngagementManager }
          trigger:
            - { call: "GET /service-projects/${proj1}", payload: {}, as: Any, captures: { req_5: $.data.required_staff_leads } }
            - { call: "POST /registrations/${regM5}/confirm", payload: {}, as: CommunityEngagementManager }
            - { call: "GET /service-projects/${proj1}", payload: {}, as: Any, captures: { req_6: $.data.required_staff_leads, conf_6: $.data.confirmed_volunteer_count } }
          assert:
            - "After 1 adult + 4 minors: required_staff_leads == 2 (ceil(1/8)=1 + ceil(4/4)=1)"
            - "After the 5th minor confirms: required_staff_leads == 3 (ceil(1/8)=1 + ceil(5/4)=2)"
            - "confirmed_volunteer_count == 6"
            - "${req_5} == 2 and ${req_6} == 3 (minor ceiling moved while adult ceiling stayed)"

      - name: procurement_total_per_line_rounding_order_pinned
        grounds:
          - calculations.procurement_order_total
          - entities.ProcurementOrder.fields.order_total_cents
        distinguishing_aspect: |
          Mode (b) — a DIFFERENT mode from instance supervision_requirement_dual_ceiling_mixed_minors
          (mode a): nested rounding where order matters. The scaffold pins round-per-line-then-sum:
          lines (3 x 999) and (7 x 149) at tax 0.0875 give per-line 3259 + 1134 = 4393, whereas
          sum-then-round would give round_half_up(4393.5) = 4394.
        test_recipe:
          setup:
            - "Project MATCHED to an event in PLANNING; nothing else required (order creation computes the total)"
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Park Build", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day D", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 1000000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
          trigger:
            - { call: "POST /procurement-orders", payload: { event_id: "${ev1}", project_id: "${proj1}", lines: [ { item_name: "Lumber", quantity: 3, unit_cost_cents: 999 }, { item_name: "Screws", quantity: 7, unit_cost_cents: 149 } ] }, as: CommunityEngagementManager, as_user_id: "cem-1", captures: { ord_total: $.data.order_total_cents } }
          assert:
            - "ProcurementOrder.order_total_cents == 4393 (round_half_up per line: 3259 + 1134), NOT 4394 (sum-then-round)"
            - "ProcurementOrder.status == DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: registration_independent_rsvp_waiver_dimensions
        grounds:
          - state_machines.Registration.REGISTERED_to_CONFIRMED
          - state_machines.Registration.WAIVER_PENDING_to_WAIVER_SIGNED
          - state_machines.Registration.WAIVER_SIGNED_to_WAIVER_VERIFIED
          - entities.Registration.fields.rsvp_status
          - entities.Registration.fields.waiver_status
        distinguishing_aspect: |
          Registration carries two INDEPENDENT state dimensions on one row (rsvp_status x
          waiver_status): signing the waiver leaves rsvp at REGISTERED; confirming leaves waiver
          at WAIVER_SIGNED; verifying leaves rsvp at CONFIRMED; cancelling the rsvp leaves the
          waiver dimension untouched at WAIVER_VERIFIED. Non-linear shape on the Registration entity.
        test_recipe:
          setup:
            - "Project (min 1, max 5) MATCHED to an OPEN event; one adult volunteer registered"
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 5 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day E", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 1000000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol One", email: "v1@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { vol1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { reg1: $.data.id, d0_rsvp: $.data.rsvp_status, d0_waiver: $.data.waiver_status } }
            - { call: "POST /registrations/${reg1}/sign-waiver", payload: { signer_name: "Vol One", signer_relation: "SELF", media_consent: true }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { d1_rsvp: $.data.rsvp_status, d1_waiver: $.data.waiver_status } }
            - { call: "POST /registrations/${reg1}/confirm", payload: {}, as: CommunityEngagementManager, captures: { d2_rsvp: $.data.rsvp_status, d2_waiver: $.data.waiver_status } }
            - { call: "POST /registrations/${reg1}/verify-waiver", payload: {}, as: CommunityEngagementManager, captures: { d3_rsvp: $.data.rsvp_status, d3_waiver: $.data.waiver_status } }
          trigger:
            - { call: "POST /registrations/${reg1}/cancel", payload: {}, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { d4_rsvp: $.data.rsvp_status, d4_waiver: $.data.waiver_status } }
          assert:
            - "at creation: rsvp_status == REGISTERED and waiver_status == WAIVER_PENDING"
            - "after sign: rsvp_status == REGISTERED (unchanged) and waiver_status == WAIVER_SIGNED"
            - "after confirm: rsvp_status == CONFIRMED and waiver_status == WAIVER_SIGNED (unchanged)"
            - "after verify-waiver: rsvp_status == CONFIRMED (unchanged) and waiver_status == WAIVER_VERIFIED"
