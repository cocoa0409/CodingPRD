# =============================================================================
# §1.8: Scaffold Difficulty Design — folding-carton-plant
# 19 instances across the nine Difficulty Rules (>= 2 per rule).
# Money in integer cents; dims in cin; delta-E in milli-units.
# Logical clock default 2026-08-01T00:00:00Z; booking windows use 2026-08-1x.
# Standard fixture chain legend (written out per instance below):
#   blanks 900x600, rot allowed, coat, slots ["BRAND_RED"], substrate SBS18/18pt
#   plan sheet 4800x3600 g30 e60 gr90 -> ups 25; qty 3000 -> net 120, gross 130
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: sheets vs money)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: nesting_theoretical_vs_realized_yield
        grounds:
          - calculations.nesting_yield
          - state_machines.PressBooking.SCHEDULED_to_COMPLETED
          - entities.ImpositionPlan.fields.realized_waste_milli_pct
        distinguishing_aspect: |
          Sheet-domain dual variant on ImpositionPlan: the theoretical variant (spoilage-constant
          gross_sheets computed at plan creation) stays fixed at 130, while the realized variant,
          driven by booking actuals, ends at 130 printed / 120 good / 7692 milli-pct waste — same
          plan, two algorithm variants, different observable fields.
        test_recipe:
          setup:
            - "Customer; ACTIVE standard for BRAND_RED (tolerance 200); board stock 5000 @300c"
            - "OFFSET job qty 3000 in IN_PRODUCTION; LOCKED plan ups=25 net=120 gross=130; one SCHEDULED booking"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5300, a_target: 6800, b_target: 3200, tolerance_delta_e_milli: 200, substrate_class: "COATED" }, as: PlantAdmin, captures: { std: $.data.id } }
            - { call: "POST /plant/color-standards/${std}/submit", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/color-standards/${std}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/board-stocks", payload: { substrate_code: "SBS18", caliper_pts: 18, sheet_w_cin: 4800, sheet_h_cin: 3600, unit_cost_cents: 300, received_sheets: 5000 }, as: PlantAdmin, captures: { stock: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: ["BRAND_RED"], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${job_v2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev: $.data.id } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/design-revisions/${rev}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${job}", design_revision_id: "${rev}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plan: $.data.id } }
            - { call: "POST /plant/imposition-plans/${plan}/lock", payload: { expected_job_version: "${job_v3}" }, as: StructuralDesigner }
            - { call: "POST /plant/jobs/${job}/mark-press-ready", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/press-approvals", payload: { job_id: "${job}", color_standard_id: "${std}", ink_slot: "BRAND_RED", measured_delta_e_milli: 150 }, as: PressOperator, captures: { appr: $.data.id } }
            - { call: "POST /plant/press-approvals/${appr}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/presses", payload: { press_code: "P-OFF-1", press_type: "OFFSET", max_sheet_w_cin: 5000, max_sheet_h_cin: 4000, max_sheets_per_booking: 1000 }, as: PlantAdmin, captures: { press: $.data.id } }
            - { call: "POST /plant/press-bookings", payload: { job_id: "${job}", press_id: "${press}", planned_sheets: 130, start_utc: "2026-08-10T10:00:00Z", end_utc: "2026-08-10T12:00:00Z" }, as: PressOperator, captures: { bk: $.data.id } }
            - { call: "POST /plant/jobs/${job}/start-production", payload: {}, as: PressOperator }
          trigger:
            - { call: "POST /plant/press-bookings/${bk}/complete", payload: { sheets_printed: 130, sheets_good: 120 }, as: PressOperator }
            - { call: "GET /plant/imposition-plans/${plan}", payload: {}, as: PlantAdmin, captures: { g_gross: $.data.gross_sheets, g_rp: $.data.realized_sheets_printed, g_rg: $.data.realized_good_sheets, g_rw: $.data.realized_waste_milli_pct } }
          assert:
            - "ImpositionPlan.${plan}.gross_sheets == 130 (theoretical variant unchanged by actuals)"
            - "ImpositionPlan.${plan}.net_sheets == 120"
            - "realized_sheets_printed == 130 AND realized_good_sheets == 120"
            - "realized_waste_milli_pct == 7692 (floor((130-120)*100000/130))"
            - "captured ${g_gross} == 130 and ${g_rw} == 7692"

      - name: provisional_vs_final_settlement_money
        grounds:
          - calculations.provisional_quote
          - calculations.final_settlement
          - entities.Job.fields.provisional_total_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Money-domain dual variant (different entity domain from nesting sheets): the forward-looking
          provisional quote at job creation totals 931000c (planned sheets at reference cost, finishing
          on ordered qty), while the chronological final settlement on actuals totals 930875c — identical
          nominal job, two valid algorithms, different cents.
        test_recipe:
          setup:
            - "OFFSET job qty 20000, coat only, blanks 900x600; plan ups 25 -> net 800, gross 864"
            - "Board stock 5000 @300c; booking completed with printed=1400, good=1300 (32500 cartons)"
            - "Job COMPLETE; DRAFT invoice exists"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Beta", brand_code: "BTA" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5300, a_target: 6800, b_target: 3200, tolerance_delta_e_milli: 200, substrate_class: "COATED" }, as: PlantAdmin, captures: { std: $.data.id } }
            - { call: "POST /plant/color-standards/${std}/submit", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/color-standards/${std}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/board-stocks", payload: { substrate_code: "SBS18", caliper_pts: 18, sheet_w_cin: 4800, sheet_h_cin: 3600, unit_cost_cents: 300, received_sheets: 5000 }, as: PlantAdmin, captures: { stock: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 20000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: ["BRAND_RED"], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id, job_v1: $.data.version, prov_sub: $.data.provisional_subtotal_cents, prov_tot: $.data.provisional_total_cents } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${job_v2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev: $.data.id } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/design-revisions/${rev}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${job}", design_revision_id: "${rev}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plan: $.data.id } }
            - { call: "POST /plant/imposition-plans/${plan}/lock", payload: { expected_job_version: "${job_v3}" }, as: StructuralDesigner }
            - { call: "POST /plant/jobs/${job}/mark-press-ready", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/press-approvals", payload: { job_id: "${job}", color_standard_id: "${std}", ink_slot: "BRAND_RED", measured_delta_e_milli: 100 }, as: PressOperator, captures: { appr: $.data.id } }
            - { call: "POST /plant/press-approvals/${appr}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/presses", payload: { press_code: "P-OFF-2", press_type: "OFFSET", max_sheet_w_cin: 5000, max_sheet_h_cin: 4000, max_sheets_per_booking: 2000 }, as: PlantAdmin, captures: { press: $.data.id } }
            - { call: "POST /plant/press-bookings", payload: { job_id: "${job}", press_id: "${press}", planned_sheets: 864, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T12:00:00Z" }, as: PressOperator, captures: { bk: $.data.id } }
            - { call: "POST /plant/jobs/${job}/start-production", payload: {}, as: PressOperator }
            - { call: "POST /plant/press-bookings/${bk}/complete", payload: { sheets_printed: 1400, sheets_good: 1300 }, as: PressOperator }
            - { call: "POST /plant/jobs/${job}/complete-press", payload: {}, as: PressOperator }
            - { call: "POST /plant/finishing-lines", payload: { line_code: "L-COAT", supported_ops: ["COAT"], setup_buffer_minutes: 0 }, as: PlantAdmin, captures: { line: $.data.id } }
            - { call: "POST /plant/finishing-bookings", payload: { job_id: "${job}", line_id: "${line}", operation: "COAT", start_utc: "2026-08-11T08:00:00Z", end_utc: "2026-08-11T09:00:00Z" }, as: FinishingOperator, captures: { fb: $.data.id } }
            - { call: "POST /plant/finishing-bookings/${fb}/complete", payload: {}, as: FinishingOperator }
            - { call: "POST /plant/jobs/${job}/complete-finishing", payload: {}, as: FinishingOperator }
            - { call: "POST /plant/jobs/${job}/complete", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/invoices", payload: { job_id: "${job}" }, as: BillingClerk, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /plant/invoices/${inv}/finalize", payload: {}, as: BillingClerk, captures: { f_sub: $.data.subtotal_cents, f_tot: $.data.total_cents, f_waived: $.data.make_ready_waived } }
          assert:
            - "Job.${job}.provisional_subtotal_cents == 931000 AND provisional_total_cents == 931000 (print 480000 + board 1350*320=432000 + coat 19000; make-ready waived)"
            - "Invoice.${inv}.subtotal_cents == 930875 (print 480000 + board 1400*300=420000 + coat rhu(32500*0.95)=30875 + make_ready 0)"
            - "Invoice.${inv}.total_cents == 930875 AND minimum_recovery_cents == 0 AND make_ready_waived == true"
            - "provisional (931000) != final (930875): variants diverge by 125c"
            - "captured ${prov_tot} == 931000 and ${f_tot} == 930875"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three DIFFERENT modes: a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: nesting_rotation_branch_floors
        grounds:
          - calculations.nesting_yield
          - entities.ImpositionPlan.fields.ups
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — nested floors per orientation, a max()
          across orientations, and a conditional branch on grain_rotation_allowed. Same blanks
          (500x1200) and same sheet: rotation-allowed yields ups=18 ROTATED, rotation-forbidden
          yields ups=16 NORMAL; nets 167 vs 188 and yields 62500 vs 55555 diverge.
        test_recipe:
          setup:
            - "Two jobs (both qty 3000, blanks 500x1200): jobR grain_rotation_allowed=true, jobN =false"
            - "Each has a design revision carrying the same grain flag, and one DRAFT imposition plan on sheet 4800x3600 g30 e60 gr90"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Gamma", brand_code: "GMA" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 500, blank_h_cin: 1200, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { jobr: $.data.id, jobr_v1: $.data.version } }
            - { call: "POST /plant/jobs/${jobr}/start-engineering", payload: {}, as: PlantAdmin, captures: { jobr_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${jobr}", expected_job_version: "${jobr_v2}", cad_ref: "CAD-R", blank_w_cin: 500, blank_h_cin: 1200, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { revr: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 500, blank_h_cin: 1200, grain_rotation_allowed: false, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { jobn: $.data.id, jobn_v1: $.data.version } }
            - { call: "POST /plant/jobs/${jobn}/start-engineering", payload: {}, as: PlantAdmin, captures: { jobn_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${jobn}", expected_job_version: "${jobn_v2}", cad_ref: "CAD-N", blank_w_cin: 500, blank_h_cin: 1200, grain_rotation_allowed: false }, as: StructuralDesigner, captures: { revn: $.data.id } }
          trigger:
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${jobr}", design_revision_id: "${revr}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { planr_ups: $.data.ups, planr_orient: $.data.orientation, planr_net: $.data.net_sheets, planr_gross: $.data.gross_sheets, planr_yield: $.data.layout_yield_milli_pct } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${jobn}", design_revision_id: "${revn}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plann_ups: $.data.ups, plann_orient: $.data.orientation, plann_net: $.data.net_sheets, plann_gross: $.data.gross_sheets, plann_yield: $.data.layout_yield_milli_pct } }
          assert:
            - "rotation-allowed plan: ups == 18, orientation == ROTATED, net_sheets == 167, gross_sheets == 181 (OFFSET 8% spoilage), layout_yield_milli_pct == 62500"
            - "rotation-forbidden plan: ups == 16, orientation == NORMAL, net_sheets == 188, gross_sheets == 204, layout_yield_milli_pct == 55555 (floor)"
            - "captured ${planr_ups} == 18, ${planr_orient} == ROTATED, ${plann_ups} == 16, ${plann_orient} == NORMAL"
            - "usable dims 4680x3450: A 8x2=16 vs B 3x6=18; grain constraint removes the max() branch"

      - name: finishing_per_line_rounding_order
        grounds:
          - calculations.final_settlement
          - entities.Invoice.fields.lines
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins per-line round-half-up
          BEFORE summation. With good_cartons_actual = 20750 and COAT+FOIL+EMBOSS at 950/2650/1775
          cents-per-thousand, per-line rounding gives 19713+54988+36831 = 111532; the forbidden
          aggregate-rounded order gives 111531 — a 1-cent observable difference at subtotal 1011532.
        test_recipe:
          setup:
            - "OFFSET job qty 20000 with all three finishes; plan ups 25; stock 5000 @300c"
            - "Booking completed printed=1400 good=830 -> good_cartons_actual = 830*25 = 20750"
            - "COAT/FOIL/EMBOSS bookings all COMPLETED; job COMPLETE; DRAFT invoice"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Delta", brand_code: "DLT" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5300, a_target: 6800, b_target: 3200, tolerance_delta_e_milli: 200, substrate_class: "COATED" }, as: PlantAdmin, captures: { std: $.data.id } }
            - { call: "POST /plant/color-standards/${std}/submit", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/color-standards/${std}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/board-stocks", payload: { substrate_code: "SBS18", caliper_pts: 18, sheet_w_cin: 4800, sheet_h_cin: 3600, unit_cost_cents: 300, received_sheets: 5000 }, as: PlantAdmin, captures: { stock: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 20000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: true, finish_emboss: true, required_ink_slots: ["BRAND_RED"], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${job_v2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev: $.data.id } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/design-revisions/${rev}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${job}", design_revision_id: "${rev}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plan: $.data.id } }
            - { call: "POST /plant/imposition-plans/${plan}/lock", payload: { expected_job_version: "${job_v3}" }, as: StructuralDesigner }
            - { call: "POST /plant/jobs/${job}/mark-press-ready", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/press-approvals", payload: { job_id: "${job}", color_standard_id: "${std}", ink_slot: "BRAND_RED", measured_delta_e_milli: 100 }, as: PressOperator, captures: { appr: $.data.id } }
            - { call: "POST /plant/press-approvals/${appr}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/presses", payload: { press_code: "P-OFF-3", press_type: "OFFSET", max_sheet_w_cin: 5000, max_sheet_h_cin: 4000, max_sheets_per_booking: 2000 }, as: PlantAdmin, captures: { press: $.data.id } }
            - { call: "POST /plant/press-bookings", payload: { job_id: "${job}", press_id: "${press}", planned_sheets: 864, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T12:00:00Z" }, as: PressOperator, captures: { bk: $.data.id } }
            - { call: "POST /plant/jobs/${job}/start-production", payload: {}, as: PressOperator }
            - { call: "POST /plant/press-bookings/${bk}/complete", payload: { sheets_printed: 1400, sheets_good: 830 }, as: PressOperator }
            - { call: "POST /plant/jobs/${job}/complete-press", payload: {}, as: PressOperator }
            - { call: "POST /plant/finishing-lines", payload: { line_code: "L-ALL", supported_ops: ["COAT", "FOIL", "EMBOSS"], setup_buffer_minutes: 0 }, as: PlantAdmin, captures: { line: $.data.id } }
            - { call: "POST /plant/finishing-bookings", payload: { job_id: "${job}", line_id: "${line}", operation: "COAT", start_utc: "2026-08-11T08:00:00Z", end_utc: "2026-08-11T09:00:00Z" }, as: FinishingOperator, captures: { fb1: $.data.id } }
            - { call: "POST /plant/finishing-bookings", payload: { job_id: "${job}", line_id: "${line}", operation: "FOIL", start_utc: "2026-08-11T09:00:00Z", end_utc: "2026-08-11T10:00:00Z" }, as: FinishingOperator, captures: { fb2: $.data.id } }
            - { call: "POST /plant/finishing-bookings", payload: { job_id: "${job}", line_id: "${line}", operation: "EMBOSS", start_utc: "2026-08-11T10:00:00Z", end_utc: "2026-08-11T11:00:00Z" }, as: FinishingOperator, captures: { fb3: $.data.id } }
            - { call: "POST /plant/finishing-bookings/${fb1}/complete", payload: {}, as: FinishingOperator }
            - { call: "POST /plant/finishing-bookings/${fb2}/complete", payload: {}, as: FinishingOperator }
            - { call: "POST /plant/finishing-bookings/${fb3}/complete", payload: {}, as: FinishingOperator }
            - { call: "POST /plant/jobs/${job}/complete-finishing", payload: {}, as: FinishingOperator }
            - { call: "POST /plant/jobs/${job}/complete", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/invoices", payload: { job_id: "${job}" }, as: BillingClerk, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /plant/invoices/${inv}/finalize", payload: {}, as: BillingClerk, captures: { f_sub: $.data.subtotal_cents, f_tot: $.data.total_cents } }
          assert:
            - "Job.${job}.good_cartons_actual == 20750 (830 good sheets * locked_ups 25)"
            - "Invoice.${inv}.lines contains {code: FINISH_COAT, amount_cents: 19713} — rhu(20750*950/1000)=rhu(19712.5)"
            - "Invoice.${inv}.lines contains {code: FINISH_FOIL, amount_cents: 54988} — rhu(54987.5)"
            - "Invoice.${inv}.lines contains {code: FINISH_EMBOSS, amount_cents: 36831} — rhu(36831.25)"
            - "Invoice.${inv}.subtotal_cents == 1011532 (= 480000 print + 420000 board + 111532 finishing + 0 make-ready waived)"
            - "subtotal != 1011531 (the aggregate-rounded value); per-line-then-sum order is the pinned behavior"
            - "captured ${f_sub} == 1011532"

      - name: makeready_waiver_and_minimum_chain
        grounds:
          - calculations.minimum_makeready_recovery
          - entities.Invoice.fields.make_ready_waived
        distinguishing_aspect: |
          Mode (c): circular-looking dependency made well-defined by the pinned evaluation order —
          tier rate <- billable_quantity; waiver <- print_line alone; subtotal <- waiver outcome;
          minimum recovery <- subtotal. qty 16666 gives print 399984 (< 400000, NOT waived, make-ready
          180000) while qty 16667 gives 400008 (>= 400000, waived, 0) — totals 940304 vs 760328.
        test_recipe:
          setup:
            - "Two OFFSET jobs, no finishes, blanks 900x600: jobA qty 16666, jobB qty 16667"
            - "Both in QUOTED; DRAFT (PROVISIONAL) invoice created for each"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Epsilon", brand_code: "EPS" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 16666, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { joba: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 16667, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { jobb: $.data.id } }
          trigger:
            - { call: "POST /plant/invoices", payload: { job_id: "${joba}" }, as: BillingClerk, captures: { inva: $.data.id, inva_sub: $.data.subtotal_cents, inva_mk: $.data.make_ready_line_cents, inva_waived: $.data.make_ready_waived } }
            - { call: "POST /plant/invoices", payload: { job_id: "${jobb}" }, as: BillingClerk, captures: { invb: $.data.id, invb_sub: $.data.subtotal_cents, invb_mk: $.data.make_ready_line_cents, invb_waived: $.data.make_ready_waived } }
          assert:
            - "jobA invoice: make_ready_waived == false, make_ready_line_cents == 180000, subtotal_cents == 940304 (399984 print + 360320 board + 180000), minimum_recovery_cents == 0, total_cents == 940304"
            - "jobB invoice: make_ready_waived == true, make_ready_line_cents == 0, subtotal_cents == 760328 (400008 + 360320), total_cents == 760328"
            - "one extra carton flips the waiver because step 3 reads print_line from step 2 only (captured ${inva_waived} == false, ${invb_waived} == true)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (cycles on DIFFERENT entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: design_revision_sample_reject_loop
        grounds:
          - state_machines.DesignRevision.SAMPLE_MADE_to_DRAFT
          - state_machines.DesignRevision.DRAFT_to_SAMPLE_MADE
          - state_machines.DesignRevision.SAMPLE_MADE_to_BRAND_APPROVED
        distinguishing_aspect: |
          Cyclic machine on DesignRevision (distinct entity from PressApproval): SAMPLE_MADE ->
          DRAFT -> SAMPLE_MADE -> BRAND_APPROVED; the loop keeps the same revision id and
          revision_number while version increments on every pass (ends at 5).
        test_recipe:
          setup:
            - "Job qty 3000 in ENGINEERING with one DRAFT design revision (job.version consumed via OCC)"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Zeta", brand_code: "ZTA" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${job_v2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev: $.data.id, rev_v1: $.data.version, rev_num: $.data.revision_number } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner }
          trigger:
            - { call: "POST /plant/design-revisions/${rev}/brand-reject", payload: {}, as: BrandQuality, as_user_id: "${cust}", captures: { rev_v3: $.data.version, rev_st3: $.data.status } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner, captures: { rev_v4: $.data.version, rev_st4: $.data.status } }
            - { call: "POST /plant/design-revisions/${rev}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}", captures: { rev_v5: $.data.version, rev_st5: $.data.status } }
          assert:
            - "after brand-reject: status == DRAFT (cycle back), version == 3"
            - "after second make-sample: status == SAMPLE_MADE, version == 4"
            - "after brand-accept: status == BRAND_APPROVED, version == 5"
            - "revision_number == 1 throughout (loop reuses the same revision, no supersede)"
            - "captured ${rev_st5} == BRAND_APPROVED and ${rev_v5} == 5"

      - name: press_approval_reject_resubmit_round
        grounds:
          - state_machines.PressApproval.REJECTED_to_SUBMITTED
          - state_machines.PressApproval.SUBMITTED_to_REJECTED
          - state_machines.PressApproval.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on PressApproval (distinct entity from DesignRevision): SUBMITTED ->
          REJECTED -> SUBMITTED -> APPROVED; resubmit replaces measured_delta_e_milli (250 -> 180,
          the new value now within tolerance 200) and increments submission_index to 2.
        test_recipe:
          setup:
            - "Job qty 3000 in PRESS_READY (standard tolerance 200 ACTIVE, design approved, plan locked, stock reserved)"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Eta", brand_code: "ETA" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5300, a_target: 6800, b_target: 3200, tolerance_delta_e_milli: 200, substrate_class: "COATED" }, as: PlantAdmin, captures: { std: $.data.id } }
            - { call: "POST /plant/color-standards/${std}/submit", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/color-standards/${std}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/board-stocks", payload: { substrate_code: "SBS18", caliper_pts: 18, sheet_w_cin: 4800, sheet_h_cin: 3600, unit_cost_cents: 300, received_sheets: 5000 }, as: PlantAdmin, captures: { stock: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: ["BRAND_RED"], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${job_v2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev: $.data.id } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/design-revisions/${rev}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${job}", design_revision_id: "${rev}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plan: $.data.id } }
            - { call: "POST /plant/imposition-plans/${plan}/lock", payload: { expected_job_version: "${job_v3}" }, as: StructuralDesigner }
            - { call: "POST /plant/jobs/${job}/mark-press-ready", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/press-approvals", payload: { job_id: "${job}", color_standard_id: "${std}", ink_slot: "BRAND_RED", measured_delta_e_milli: 250 }, as: PressOperator, captures: { appr: $.data.id, appr_v1: $.data.version, appr_si1: $.data.submission_index } }
          trigger:
            - { call: "POST /plant/press-approvals/${appr}/reject", payload: {}, as: BrandQuality, as_user_id: "${cust}", captures: { appr_st2: $.data.status } }
            - { call: "POST /plant/press-approvals/${appr}/resubmit", payload: { measured_delta_e_milli: 180 }, as: PressOperator, captures: { appr_st3: $.data.status, appr_si2: $.data.submission_index, appr_m3: $.data.measured_delta_e_milli } }
            - { call: "POST /plant/press-approvals/${appr}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}", captures: { appr_st4: $.data.status, appr_v4: $.data.version } }
          assert:
            - "reject leaves status == REJECTED (not terminal; INVALIDATED is the only terminal)"
            - "resubmit: status == SUBMITTED, submission_index == 2, measured_delta_e_milli == 180"
            - "approve succeeds because 180 <= 200: status == APPROVED, version == 4"
            - "captured ${appr_si2} == 2 and ${appr_st4} == APPROVED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: color_standard_supersede_cascade
        grounds:
          - state_machines.ColorStandard.PENDING_BRAND_to_ACTIVE
          - state_machines.PressApproval.APPROVED_to_INVALIDATED
          - state_machines.Job.PRESS_READY_to_ENGINEERING
        distinguishing_aspect: |
          Trigger = POST /plant/color-standards/{id}/approve (depth 3, each link caused by the
          previous): L1 old standard S1 -> SUPERSEDED; L2 approval A1 pinned to S1 (job not yet
          IN_PRODUCTION) -> INVALIDATED; L3 the PRESS_READY job loses its approved clearance ->
          ENGINEERING and its 130-sheet reservation is released back to the stock.
        test_recipe:
          setup:
            - "Job qty 3000 PRESS_READY; S1 ACTIVE; A1 APPROVED pinned to S1; stock reserved_sheets == 130"
            - "S2 exists as PENDING_BRAND for the same (customer, ink_slot)"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Theta", brand_code: "THT" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5300, a_target: 6800, b_target: 3200, tolerance_delta_e_milli: 200, substrate_class: "COATED" }, as: PlantAdmin, captures: { std1: $.data.id } }
            - { call: "POST /plant/color-standards/${std1}/submit", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/color-standards/${std1}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/board-stocks", payload: { substrate_code: "SBS18", caliper_pts: 18, sheet_w_cin: 4800, sheet_h_cin: 3600, unit_cost_cents: 300, received_sheets: 5000 }, as: PlantAdmin, captures: { stock: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 3000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: ["BRAND_RED"], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${job_v2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev: $.data.id } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/design-revisions/${rev}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${job}", design_revision_id: "${rev}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plan: $.data.id } }
            - { call: "POST /plant/imposition-plans/${plan}/lock", payload: { expected_job_version: "${job_v3}" }, as: StructuralDesigner }
            - { call: "POST /plant/jobs/${job}/mark-press-ready", payload: {}, as: StructuralDesigner, captures: { job_st: $.data.status, job_res: $.data.reserved_sheets } }
            - { call: "POST /plant/press-approvals", payload: { job_id: "${job}", color_standard_id: "${std1}", ink_slot: "BRAND_RED", measured_delta_e_milli: 100 }, as: PressOperator, captures: { appr: $.data.id } }
            - { call: "POST /plant/press-approvals/${appr}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5400, a_target: 6700, b_target: 3300, tolerance_delta_e_milli: 250, substrate_class: "COATED" }, as: PlantAdmin, captures: { std2: $.data.id } }
            - { call: "POST /plant/color-standards/${std2}/submit", payload: {}, as: PlantAdmin }
          trigger:
            - { call: "POST /plant/color-standards/${std2}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/color-standards/${std1}", payload: {}, as: PlantAdmin, captures: { s1_st: $.data.status } }
            - { call: "GET /plant/press-approvals/${appr}", payload: {}, as: PlantAdmin, captures: { a1_st: $.data.status } }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { j_st: $.data.status, j_res: $.data.reserved_sheets } }
            - { call: "GET /plant/board-stocks/${stock}", payload: {}, as: PlantAdmin, captures: { st_res: $.data.reserved_sheets, st_avail: $.data.available_sheets } }
          assert:
            - "pre-cascade: job was PRESS_READY with reserved_sheets == 130 (${job_st}, ${job_res})"
            - "L1: S1.status == SUPERSEDED (${s1_st}); S2.status == ACTIVE"
            - "L2: A1.status == INVALIDATED (${a1_st}) — pinned to superseded standard while job not in production"
            - "L3: job.status == ENGINEERING AND job.reserved_sheets == 0 (${j_st}, ${j_res})"
            - "stock restored: reserved_sheets == 0 AND available_sheets == 5000 (${st_res}, ${st_avail})"

      - name: press_booking_completion_cascade
        grounds:
          - state_machines.PressBooking.SCHEDULED_to_COMPLETED
          - entities.BoardStock.fields.consumed_sheets
          - entities.Job.fields.good_cartons_actual
          - entities.ImpositionPlan.fields.realized_sheets_printed
        distinguishing_aspect: |
          Trigger = POST /plant/press-bookings/{id}/complete (depth 3, different trigger from the
          color-standard cascade): L1 stock consumed/reserved move by sheets_printed; L2 job actuals
          (consumed/good sheets, good_cartons_actual = good * locked_ups) recompute; L3 the LOCKED
          plan's realized fields refresh from the job mutation.
        test_recipe:
          setup:
            - "OFFSET job qty 5000 IN_PRODUCTION; plan ups 25 -> gross 216 reserved; stock 5000 @300c"
            - "One SCHEDULED booking planned_sheets 216"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Iota", brand_code: "IOT" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5300, a_target: 6800, b_target: 3200, tolerance_delta_e_milli: 200, substrate_class: "COATED" }, as: PlantAdmin, captures: { std: $.data.id } }
            - { call: "POST /plant/color-standards/${std}/submit", payload: {}, as: PlantAdmin }
            - { call: "POST /plant/color-standards/${std}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/board-stocks", payload: { substrate_code: "SBS18", caliper_pts: 18, sheet_w_cin: 4800, sheet_h_cin: 3600, unit_cost_cents: 300, received_sheets: 5000 }, as: PlantAdmin, captures: { stock: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 5000, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: true, finish_foil: false, finish_emboss: false, required_ink_slots: ["BRAND_RED"], requires_retail_compliance: false }, as: PlantAdmin, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /plant/jobs/${job}/start-engineering", payload: {}, as: PlantAdmin, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/design-revisions", payload: { job_id: "${job}", expected_job_version: "${job_v2}", cad_ref: "CAD-1", blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true }, as: StructuralDesigner, captures: { rev: $.data.id } }
            - { call: "POST /plant/design-revisions/${rev}/make-sample", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/design-revisions/${rev}/brand-accept", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { job_v3: $.data.version } }
            - { call: "POST /plant/imposition-plans", payload: { job_id: "${job}", design_revision_id: "${rev}", sheet_w_cin: 4800, sheet_h_cin: 3600, gutter_cin: 30, edge_margin_cin: 60, gripper_cin: 90 }, as: StructuralDesigner, captures: { plan: $.data.id } }
            - { call: "POST /plant/imposition-plans/${plan}/lock", payload: { expected_job_version: "${job_v3}" }, as: StructuralDesigner }
            - { call: "POST /plant/jobs/${job}/mark-press-ready", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/press-approvals", payload: { job_id: "${job}", color_standard_id: "${std}", ink_slot: "BRAND_RED", measured_delta_e_milli: 100 }, as: PressOperator, captures: { appr: $.data.id } }
            - { call: "POST /plant/press-approvals/${appr}/approve", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/presses", payload: { press_code: "P-OFF-4", press_type: "OFFSET", max_sheet_w_cin: 5000, max_sheet_h_cin: 4000, max_sheets_per_booking: 1000 }, as: PlantAdmin, captures: { press: $.data.id } }
            - { call: "POST /plant/press-bookings", payload: { job_id: "${job}", press_id: "${press}", planned_sheets: 216, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T12:00:00Z" }, as: PressOperator, captures: { bk: $.data.id } }
            - { call: "POST /plant/jobs/${job}/start-production", payload: {}, as: PressOperator }
          trigger:
            - { call: "POST /plant/press-bookings/${bk}/complete", payload: { sheets_printed: 216, sheets_good: 200 }, as: PressOperator }
            - { call: "GET /plant/board-stocks/${stock}", payload: {}, as: PlantAdmin, captures: { st_con: $.data.consumed_sheets, st_res: $.data.reserved_sheets } }
            - { call: "GET /plant/jobs/${job}", payload: {}, as: PlantAdmin, captures: { j_con: $.data.sheets_consumed_actual, j_good: $.data.good_sheets_actual, j_cart: $.data.good_cartons_actual } }
            - { call: "GET /plant/imposition-plans/${plan}", payload: {}, as: PlantAdmin, captures: { p_rp: $.data.realized_sheets_printed, p_rg: $.data.realized_good_sheets, p_rw: $.data.realized_waste_milli_pct } }
          assert:
            - "L1: stock consumed_sheets == 216 AND reserved_sheets == 0 (${st_con}, ${st_res})"
            - "L2: job sheets_consumed_actual == 216, good_sheets_actual == 200, good_cartons_actual == 5000 (200*25) (${j_cart})"
            - "L3: plan realized_sheets_printed == 216, realized_good_sheets == 200, realized_waste_milli_pct == 7407 (${p_rw})"
            - "invariant: received 5000 == available 4784 + reserved 0 + consumed 216"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booking_state_trumps_window_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_PRESS_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Category pair state (p6) vs business_temporal (p8): one request violates both — the job is
          QUOTED (booking endpoint requires PRESS_READY/IN_PRODUCTION) AND the window collides with an
          existing booking on the same press. The state error ERR_INVALID_STATE_TRANSITION must win.
        test_recipe:
          setup:
            - "JobA fully driven to PRESS_READY; press P holds booking [2026-08-10T10:00,12:00) for jobA"
            - "JobB exists but is only QUOTED (never engineered)"
          setup_api_calls:
