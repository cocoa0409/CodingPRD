  # ===========================================================================
  - section: validations
    instances:
      - name: auth_missing_role_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pallet-ops/specs"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status 401"

      - name: seasonal_window_overlap_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_SEASON_WINDOW_OVERLAP]"]
        distinguishing_aspect: "Seasonal bands overlap regardless of season_code: a second band intersecting an existing one is rejected even with a different code."
        test_recipe:
          setup: ["existing band PEAK-2026-Q3 [2026-08-01, 2026-09-01)"]
          setup_api_calls:
            - call: "POST /pallet-ops/seasonal-index"
