        distinguishing_aspect: "CANCELLED is a declared terminal state of VendorAssignment, so an accept aimed at a CANCELLED assignment reports 409 ERR_ALREADY_TERMINAL at rung 49 rather than the plain ERR_INVALID_STATE that rung 48 would give for a non-terminal wrong from-state."
