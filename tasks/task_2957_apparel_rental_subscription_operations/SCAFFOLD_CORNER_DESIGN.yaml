          Both actors hold the same Member role, so this is not a role failure but an ownership failure: Ilse is
          refused with 403 ERR_NOT_RESOURCE_OWNER on Nora's reservation and on Nora's member record, while Nora
          reads the identical reservation successfully. An implementation that only checks the role header returns
          200 for Ilse.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "membership plan SIG4"
            - "style AUR-GOWN-01 with one size-M grade-A unit AUR-GOWN-001"
