  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: comp_mass_control_tonnes_return_to_zero_residual_after_separation_then_reopen
        grounds:
          - calculations.mass_control_invariant
          - calculations.digestate_separation
          - state_machines.OperationsDay.CLOSED_to_OPEN
          - entities.DigesterFacility.fields.mass_control_residual_tonnes
          - entities.DigesterFacility.fields.unseparated_manure_tonnes
        distinguishing_aspect: |
          Conserved quantity: MANURE AND DIGESTATE TONNES. record-separation moves 150.000 t
          out of unseparated_manure_tonnes into 26.000 t of solids plus 124.000 t of liquid,
          and the compensating reopen moves all 150.000 t back, with
          mass_control_residual_tonnes reading exactly 0.000 both before and after; an
          implementation that recorded the split without clearing unseparated_manure_tonnes
          would show a residual of -150.000 after separation.
        test_recipe:
          setup:
            - "One facility with one ACTIVE agreement and one CLOSED operations day 2026-08-03 carrying a single ACCEPTED 150.000 t delivery at 8.0 percent solids."
            - "No nomination is confirmed, no batch claimed and no application applied, so the reopen preconditions hold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
