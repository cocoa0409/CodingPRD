  - rule_id: resource_temporal_overlap
    instances:

      - name: tee_slot_half_open_upper_bound_and_group_capacity
        grounds:
          - validations.priority_71
          - errors.ERR_TEE_SLOT_FULL
          - entities.Tournament.fields.tee_group_size
          - entities.Tournament.fields.tee_interval_minutes
          - endpoints.POST_rounds
        distinguishing_aspect: |
          The tee sheet is a HALF-OPEN aggregate capacity window [tee_time, tee_time + 10) scoped to
          one round_number. With tee_group_size 2 and existing round-1 cards at 13:05 and 13:10, a
          request at 13:00 occupies a window that contains 13:05 but NOT 13:10 (exactly 10 minutes
          later is adjacent, not overlapping), so the count is 1 and the request must SUCCEED. A
          closed-interval implementation counts 2 and wrongly rejects it. The second trigger then
          repeats the same 13:00 request, which now finds 13:00 and 13:05 inside the window and must
          be rejected - proving the capacity is aggregate rather than a per-tee-time uniqueness rule.
          A round-2 card also sits at 13:05 and must be ignored by both triggers.
