  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: rush_capacity_exactly_at_capacity_rejected
        grounds:
          - calculations.rush_capacity_check
          - errors[ERR_RUSH_CAPACITY_FULL]
        distinguishing_aspect: |
          Integer-count boundary on POST /search-orders: occupant_count ==
          capacity - 1 (0 of 1) accepts the first RUSH order; occupant_count ==
          capacity (1 of 1) rejects the second with ERR_RUSH_CAPACITY_FULL —
          the >= comparison is exact.
        test_recipe:
          setup:
            - "Jurisdiction rush_daily_capacity 1, one rush-capable department, statute in force; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL", rush_daily_capacity: 1 }
              as: ProviderAdmin
              captures: { j_id: $.data.id}
            - call: "POST /statutes"
              payload: { jurisdiction_id: "${j_id}", effective_from: "2026-01-01", effective_to: null, estoppel_response_days: 10, estoppel_fee_cap_cents: 12000, estoppel_validity_days: 30 }
              as: ProviderAdmin
