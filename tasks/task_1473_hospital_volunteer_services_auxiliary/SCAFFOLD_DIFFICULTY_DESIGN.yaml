  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: placement_accept_rescind_slot_conservation
        grounds:
          - calculations.slot_fill_evaluation
          - state_machines.Placement.ACCEPTED_to_RESCINDED
          - entities.DepartmentRequest.fields.slots_filled
        distinguishing_aspect: |
          Conserved quantity = request slot count: at every step
          slots_filled == count(ACCEPTED placements). Accept+accept (2/2, FILLED),
          rescind (1/2, OPEN), fresh offer + accept (2/2, FILLED) — forward and
          compensating actions interleave with zero drift.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; request R slots_needed 2 OPEN; volunteers V1, V2, V3 cleared (ONBOARDING, posture not FROZEN)"
            - "P1 (V1), P2 (V2) OFFERED"
