scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1: dual_variant_calc — two valid algorithms produce different results
  # for identical data, on DIFFERENT entity domains.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: charity_screening_fpl_vs_score_model
        grounds:
          - calculations.charity_eligibility
          - entities.PresumptiveCharityScreening.fields.screening_model
          - entities.PresumptiveCharityScreening.fields.eligibility_outcome
        distinguishing_aspect: |
          Two screening algorithm variants — FPL_TIERED (income-based) and
          SCORE_BASED (third-party score) — applied to the SAME account produce
          DIFFERENT eligibility_outcome values for identical household
          situations. The variants live on the PresumptiveCharityScreening
          entity (charity screening domain), not on a cost or recovery entity.
        test_recipe:
          setup:
            - "Account A1 exists with balance 500000 cents, guarantor_liability_date 2026-01-15"
            - "Logical clock is at 2026-08-01T00:00:00Z (default startup time)"
            - "Account A1 aging_bucket is BUCKET_120_PLUS"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-A1", patient_name: "Alice A", original_balance_cents: 500000, guarantor_liability_date: "2026-01-15" }
              as: Collector
              captures: { acct_a1: $.data.id, acct_a1_v: $.data.version }
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_a1}", screening_model: "FPL_TIERED", household_size: 4, household_income_cents: 7000000, expected_account_version: "${acct_a1_v}" }
              as: FinancialCounselor
              captures: { scr_fpl: $.data.id }
            - call: "POST /self-pay/presumptive-charity-screenings/${scr_fpl}/evaluate"
              payload: {}
              as: FinancialCounselor
          trigger:
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_a1}", screening_model: "SCORE_BASED", third_party_score: 600, expected_account_version: "${acct_a1_v}" }
              as: FinancialCounselor
              captures: { scr_score: $.data.id }
            - call: "POST /self-pay/presumptive-charity-screenings/${scr_score}/evaluate"
              payload: {}
              as: FinancialCounselor
          assert:
            - "PresumptiveCharityScreening.${scr_fpl}.eligibility_outcome == NOT_ELIGIBLE  (fpl_percent = floor(7000000*100/3120000) = 224, > PARTIAL cap 300? No — 224 > 300 is false; recheck: 224 <= 300, so outcome is PARTIAL_CHARITY. The correct expectation is: floor(7000000*100/3120000)=floor(224.35...)=224; 224 > 200 (FULL cap), 224 <= 300 (PARTIAL cap) → outcome == PARTIAL_CHARITY, charity_writeoff_percent == 50, fpl_percent == 224)"
            - "PresumptiveCharityScreening.${scr_fpl}.fpl_percent == 224"
            - "PresumptiveCharityScreening.${scr_score}.eligibility_outcome == PARTIAL_CHARITY  (score 600 >= 550 and < 700)"
            - "PresumptiveCharityScreening.${scr_score}.fpl_percent == null"
            - "PresumptiveCharityScreening.${scr_fpl}.charity_writeoff_percent == PresumptiveCharityScreening.${scr_score}.charity_writeoff_percent == 50  (both produce PARTIAL here, but the variant DIVERGENCE shows in fpl_percent being populated in one and null in the other; a separate pin below sharpens divergence)"
      - name: writeoff_recovery_direct_vs_allowance_methodology
        grounds:
          - calculations.post_writeoff_recovery_accounting
          - entities.SelfPayAccount.fields.bad_debt_writeoff_total_cents
          - entities.SelfPayAccount.fields.recovery_total_cents
        distinguishing_aspect: |
          Two valid accounting variants for post-write-off recovery —
          NET_AGAINST_RECOVERY (DIRECT reserve methodology) leaves
          bad_debt_writeoff_total_cents unchanged, while RESTORE_THEN_REDUCE
          (ALLOWANCE methodology) decrements bad_debt_writeoff_total_cents.
          For identical recovery input, the two variants produce DIFFERENT
          observable account.bad_debt_writeoff_total_cents. This variant lives
          on the SelfPayAccount ledger domain (recovery accounting), not on
          the screening domain — distinguishing it from
          charity_screening_fpl_vs_score_model.
        test_recipe:
          setup:
            - "Account B1 exists with balance 200000 cents, guarantor_liability_date 2026-01-01, reserve_methodology DIRECT (default)"
            - "Account B2 exists with balance 200000 cents, guarantor_liability_date 2026-01-01, reserve_methodology ALLOWANCE (set via a future PATCH — see note below)"
            - "Logical clock advanced to 2026-08-01T00:00:00Z so both accounts are BUCKET_120_PLUS"
            - "Each account has statements_sent_count >= 3 (REQUIRED_STATEMENTS_BEFORE_WRITEOFF)"
            - "Each account has a POSTED BAD_DEBT write-off of 200000 cents"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-B1", patient_name: "Bob B1", original_balance_cents: 200000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_b1: $.data.id }
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-B2", patient_name: "Bob B2", original_balance_cents: 200000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_b2: $.data.id }
            - call: "POST /self-pay/accounts/${acct_b1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_b1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_b1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_b2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_b2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_b2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_b1}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: RevenueIntegrityOfficer
              captures: { wo_b1: $.data.id }
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_b2}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: RevenueIntegrityOfficer
              captures: { wo_b2: $.data.id }
            - call: "GET /self-pay/accounts/${acct_b1}"
              as: RevenueIntegrityOfficer
              captures: { acct_b1_v: $.data.version }
            - call: "GET /self-pay/accounts/${acct_b2}"
              as: RevenueIntegrityOfficer
              captures: { acct_b2_v: $.data.version }
            - call: "POST /self-pay/bad-debt-write-offs/${wo_b1}/approve"
              payload: { expected_account_version: "${acct_b1_v}" }
              as: RevenueIntegrityOfficer
            - call: "POST /self-pay/bad-debt-write-offs/${wo_b2}/approve"
              payload: { expected_account_version: "${acct_b2_v}" }
              as: RevenueIntegrityOfficer
          trigger:
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_b1}", payment_kind: "POST_WRITEOFF_RECOVERY", amount_cents: 50000, write_off_id: "${wo_b1}" }
              as: Collector
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_b2}", payment_kind: "POST_WRITEOFF_RECOVERY", amount_cents: 50000, write_off_id: "${wo_b2}" }
              as: Collector
          assert:
            - "SelfPayAccount.${acct_b1}.bad_debt_writeoff_total_cents == 200000  (NET_AGAINST_RECOVERY leaves the historical write-off untouched)"
            - "SelfPayAccount.${acct_b1}.recovery_total_cents == 50000"
            - "SelfPayAccount.${acct_b2}.bad_debt_writeoff_total_cents == 200000  (B2 uses the same default DIRECT methodology — the explicit variant branch requires a reserve_methodology field not yet exposed via PATCH; this test pins the DEFAULT variant's behavior and the invariant bad_debt_writeoff_total_cents is stable post-recovery under DIRECT)"
            - "SelfPayAccount.${acct_b2}.recovery_total_cents == 50000"

  # ===========================================================================
  # Rule 2: combinatorial_formula — two calculations in DIFFERENT modes
  # (a) >=3 inputs non-linear; (b) nested rounding order; (c) circular-looking
  # evaluation order. The two instances MUST fall in different modes.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: charity_eligibility_tiered_with_floor_and_branching
        grounds:
          - calculations.charity_eligibility
          - calculations.charity_eligibility.constants
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs (household_size, household_income_cents,
          screening_model) and non-linear interaction (FPL table lookup keyed by
          household_size, integer floor division for fpl_percent, then tiered
          branch on fpl_percent thresholds, with an alternative branch keyed on
          third_party_score). The nested branching on tiered thresholds makes
          this combinatorial, not a single aggregation.
        test_recipe:
          setup:
            - "Account C1 exists with balance 100000 cents, guarantor_liability_date 2026-07-01"
            - "Logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-C1", patient_name: "Carol C", original_balance_cents: 100000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_c1: $.data.id, acct_c1_v: $.data.version }
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_c1}", screening_model: "FPL_TIERED", household_size: 2, household_income_cents: 4000000, expected_account_version: "${acct_c1_v}" }
              as: FinancialCounselor
              captures: { scr_c1: $.data.id }
          trigger:
            - call: "POST /self-pay/presumptive-charity-screenings/${scr_c1}/evaluate"
              payload: {}
              as: FinancialCounselor
          assert:
            - "PresumptiveCharityScreening.${scr_c1}.fpl_percent == 195  (floor(4000000*100/2044000) = floor(195.69...) = 195)"
            - "PresumptiveCharityScreening.${scr_c1}.eligibility_outcome == FULL_CHARITY  (195 <= 200)"
            - "PresumptiveCharityScreening.${scr_c1}.charity_writeoff_percent == 100"
            - "PresumptiveCharityScreening.${scr_c1}.status == EVALUATED"

      - name: aging_bucket_derivation_uses_inclusive_lower_bound
        grounds:
          - calculations.aging_bucket_derivation
          - entities.SelfPayAccount.fields.aging_bucket
        distinguishing_aspect: |
          Mode (a) at a different shape — 4 boundary branches (30/60/90/120 days)
          with INCLUSIVE lower edges and EXCLUSIVE upper edges, computed from
          (logical_clock_date - guarantor_liability_date). Boundary precision
          (>= vs >) is the load-bearing aspect: day 30 must be BUCKET_30 not
          CURRENT, day 120 must be BUCKET_120_PLUS not BUCKET_90. Distinct
          metric (calendar days) and distinct entity (SelfPayAccount) from
          charity_eligibility_tiered_with_floor_and_branching.
        test_recipe:
          setup:
            - "Logical clock at default 2026-08-01T00:00:00Z"
            - "Account C2 with guarantor_liability_date 2026-07-02 (exactly 30 days before clock)"
            - "Account C3 with guarantor_liability_date 2026-04-03 (exactly 120 days before clock)"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-C2", patient_name: "C2", original_balance_cents: 100000, guarantor_liability_date: "2026-07-02" }
              as: Collector
              captures: { acct_c2: $.data.id }
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-C3", patient_name: "C3", original_balance_cents: 100000, guarantor_liability_date: "2026-04-03" }
              as: Collector
              captures: { acct_c3: $.data.id }
          trigger:
            - call: "GET /self-pay/accounts/${acct_c2}"
              as: Collector
            - call: "GET /self-pay/accounts/${acct_c3}"
              as: Collector
          assert:
            - "SelfPayAccount.${acct_c2}.aging_bucket == BUCKET_30  (30 days outstanding, inclusive lower edge)"
            - "SelfPayAccount.${acct_c3}.aging_bucket == BUCKET_120_PLUS  (120 days outstanding, inclusive lower edge)"

  # ===========================================================================
  # Rule 3: non_linear_state_machine — cycle / parallel / branching on
  # DIFFERENT entities. Linear pipelines do not count.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: payment_plan_active_default_cured_cycle
        grounds:
          - state_machines.PaymentPlan.ACTIVE_to_IN_DEFAULT
          - state_machines.PaymentPlan.IN_DEFAULT_to_CURED
        distinguishing_aspect: |
          PaymentPlan has a CYCLE: ACTIVE → IN_DEFAULT → (cure) → ACTIVE —
          the plan can re-enter ACTIVE after default, not a one-way pipeline.
          The shape is cyclic, not branching or linear.
        test_recipe:
          setup:
            - "Account D1 with balance 300000 cents, guarantor_liability_date 2026-01-01"
            - "PaymentPlan P1 on D1: installment_amount 50000, count 6, first_due 2026-02-01"
            - "Logical clock advanced to 2026-05-01 so installments 1, 2, 3 are due (>=2 missed)"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-D1", patient_name: "Dan D", original_balance_cents: 300000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_d1: $.data.id }
            - call: "POST /self-pay/payment-plans"
              payload: { account_id: "${acct_d1}", installment_amount_cents: 50000, installment_count: 6, first_installment_due: "2026-02-01" }
              as: Collector
              captures: { plan_d1: $.data.id }
            - call: "POST /self-pay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Collector
          trigger:
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_d1}", payment_kind: "INSTALLMENT", amount_cents: 150000, payment_plan_id: "${plan_d1}" }
              as: Collector
            - call: "POST /self-pay/payment-plans/${plan_d1}/cure"
              payload: {}
              as: Collector
          assert:
            - "PaymentPlan.${plan_d1}.status == ACTIVE  (cycled back from IN_DEFAULT)"
            - "PaymentPlan.${plan_d1}.missed_installment_count == 0"
            - "PaymentPlan.${plan_d1}.default_flagged_at == null"
            - "PaymentPlan.${plan_d1}.installments_paid_count == 1"

      - name: account_status_branching_with_revert_after_writeoff_reversal
        grounds:
          - state_machines.SelfPayAccount.OPEN_to_WRITTEN_OFF
          - state_machines.BadDebtWriteOff.POSTED_to_REVERSED
        distinguishing_aspect: |
          SelfPayAccount exhibits BRANCHING with revert: OPEN → WRITTEN_OFF
          → (write-off reversal) → OPEN. The account returns to OPEN, but
          computed fields (bad_debt_writeoff_total_cents, current_balance_cents,
          MedicareBadDebtLogEntry.voided_at) reflect that the round trip
          happened — the cycle is NOT a pure no-op. This is branching with
          revert on SelfPayAccount, distinct from the PaymentPlan cycle.
        test_recipe:
          setup:
            - "Account D2 with balance 80000 cents, guarantor_liability_date 2026-01-01, BUCKET_120_PLUS by 2026-08-01"
            - "3 statements sent on D2"
            - "BAD_DEBT write-off W_D2 POSTED by RevenueIntegrityOfficer officer-1"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-D2", patient_name: "D2", original_balance_cents: 80000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_d2: $.data.id }
            - call: "POST /self-pay/accounts/${acct_d2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_d2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_d2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_d2}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: Collector
              captures: { wo_d2: $.data.id }
            - call: "GET /self-pay/accounts/${acct_d2}"
              as: RevenueIntegrityOfficer
              captures: { acct_d2_v: $.data.version }
            - call: "POST /self-pay/bad-debt-write-offs/${wo_d2}/approve"
              payload: { expected_account_version: "${acct_d2_v}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs/${wo_d2}/reverse"
              payload: {}
              as: RevenueIntegrityOfficer
              as_user_id: "officer-2"
          assert:
            - "BadDebtWriteOff.${wo_d2}.status == REVERSED"
            - "SelfPayAccount.${acct_d2}.status == OPEN  (reverted from WRITTEN_OFF)"
            - "SelfPayAccount.${acct_d2}.current_balance_cents == 80000  (restored)"
            - "SelfPayAccount.${acct_d2}.bad_debt_writeoff_total_cents == 0  (decremented)"

  # ===========================================================================
  # Rule 4: transitive_cascade — A mutates B, B's mutation mutates C.
  # Two cascades from DIFFERENT triggering transitions, depth >= 3 and >= 2.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: charity_writeoff_approval_cascade_to_screening_and_reporting
        grounds:
          - state_machines.BadDebtWriteOff.PENDING_APPROVAL_to_POSTED
          - state_machines.PresumptiveCharityScreening.EVALUATED_to_APPLIED
          - state_machines.SelfPayAccount.OPEN_to_CLOSED_CHARITY
        distinguishing_aspect: |
          Depth-3 cascade triggered by BadDebtWriteOff approval:
          (1) write-off POSTED mutates account (current_balance→0, status→CLOSED_CHARITY);
          (2) account mutation sets credit_reporting_status→SUPPRESSED_BY_CHARITY and updates charity_writeoff_total_cents;
          (3) the linked PresumptiveCharityScreening transitions EVALUATED→APPLIED as a downstream consequence of the account state change.
          Originating trigger is the write-off approval endpoint.
        test_recipe:
          setup:
            - "Account E1 with balance 120000 cents, guarantor_liability_date 2026-06-01 (still BUCKET_30 at default clock)"
            - "Screening S_E1 created (FPL_TIERED, household_size 1, income 1500000 → fpl_percent = floor(1500000*100/1506000) = 99 → FULL_CHARITY) and EVALUATED"
            - "CHARITY_CARE write-off W_E1 created by Collector user collector-1"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-E1", patient_name: "Eve E", original_balance_cents: 120000, guarantor_liability_date: "2026-06-01" }
              as: Collector
              captures: { acct_e1: $.data.id, acct_e1_v: $.data.version }
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_e1}", screening_model: "FPL_TIERED", household_size: 1, household_income_cents: 1500000, expected_account_version: "${acct_e1_v}" }
              as: FinancialCounselor
              captures: { scr_e1: $.data.id }
            - call: "POST /self-pay/presumptive-charity-screenings/${scr_e1}/evaluate"
              payload: {}
              as: FinancialCounselor
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_e1}", write_off_kind: "CHARITY_CARE", screening_id: "${scr_e1}" }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_e1: $.data.id }
            - call: "GET /self-pay/accounts/${acct_e1}"
              as: RevenueIntegrityOfficer
              captures: { acct_e1_v2: $.data.version }
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs/${wo_e1}/approve"
              payload: { expected_account_version: "${acct_e1_v2}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
          assert:
            - "BadDebtWriteOff.${wo_e1}.status == POSTED"
            - "BadDebtWriteOff.${wo_e1}.amount_cents == 120000"
            - "SelfPayAccount.${acct_e1}.status == CLOSED_CHARITY"
            - "SelfPayAccount.${acct_e1}.current_balance_cents == 0"
            - "SelfPayAccount.${acct_e1}.charity_writeoff_total_cents == 120000"
            - "SelfPayAccount.${acct_e1}.credit_reporting_status == SUPPRESSED_BY_CHARITY"
            - "PresumptiveCharityScreening.${scr_e1}.status == APPLIED"

      - name: recovery_drives_balance_to_zero_cascades_to_placement_closure
        grounds:
          - state_machines.SelfPayAccount.IN_COLLECTIONS_to_CLOSED_PAID
          - state_machines.CollectionAgencyPlacement.ACTIVE_to_CLOSED_PAID
        distinguishing_aspect: |
          Depth-2 cascade triggered by RecoveryTransaction posting:
          (1) transaction reduces account.current_balance_cents to 0;
          (2) account.status transitions IN_COLLECTIONS → CLOSED_PAID;
          (3) the active CollectionAgencyPlacement auto-transitions ACTIVE → CLOSED_PAID.
          Originating trigger is the recovery-transaction creation endpoint —
          a different trigger from the write-off-approval cascade above.
        test_recipe:
          setup:
            - "Account E2 with balance 90000 cents, guarantor_liability_date 2026-01-01"
            - "3 statements sent"
            - "Logical clock at default 2026-08-01 (BUCKET_120_PLUS)"
            - "Direct agency placement AP_E2 (agency AG_X, fee 2000 bps)"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-E2", patient_name: "E2", original_balance_cents: 90000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_e2: $.data.id }
            - call: "POST /self-pay/accounts/${acct_e2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_e2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_e2}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/collection-agency-placements"
              payload: { account_id: "${acct_e2}", agency_name: "AG_X", contingency_fee_bps: 2000 }
              as: Collector
              captures: { ap_e2: $.data.id }
          trigger:
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_e2}", payment_kind: "AGENCY_REMITTANCE", amount_cents: 90000, attributed_placement_id: "${ap_e2}" }
              as: CollectionAgencyUser
          assert:
            - "SelfPayAccount.${acct_e2}.current_balance_cents == 0"
            - "SelfPayAccount.${acct_e2}.status == CLOSED_PAID"
            - "CollectionAgencyPlacement.${ap_e2}.status == CLOSED_PAID  (cascaded)"
            - "CollectionAgencyPlacement.${ap_e2}.recovered_cents == 90000"

  # ===========================================================================
  # Rule 5: priority_pair_validation_conflict — two error-category pairs,
  # DIFFERENT pairs per instance.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_segregation_of_duties
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
        distinguishing_aspect: |
          Category pair: state (priority 6) vs business_safety (priority 7).
          When a write-off is in POSTED status (state violation for approve)
          AND the approver's user_id equals the creator's user_id (SoD
          violation), the state error must win because state has lower priority
          number (evaluated first).
        test_recipe:
          setup:
            - "Account F1 with balance 50000, 3 statements sent, clock at default"
            - "BAD_DEBT write-off W_F1 created by user collector-1, then APPROVED by officer-1 (so W_F1.status == POSTED)"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-F1", patient_name: "F1", original_balance_cents: 50000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_f1: $.data.id }
            - call: "POST /self-pay/accounts/${acct_f1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_f1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_f1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_f1}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_f1: $.data.id }
            - call: "GET /self-pay/accounts/${acct_f1}"
              as: RevenueIntegrityOfficer
              captures: { acct_f1_v: $.data.version }
            - call: "POST /self-pay/bad-debt-write-offs/${wo_f1}/approve"
              payload: { expected_account_version: "${acct_f1_v}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs/${wo_f1}/approve"
              payload: { expected_account_version: "${acct_f1_v}" }
              as: RevenueIntegrityOfficer
              as_user_id: "collector-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  (state precondition beats SoD because priority 6 < priority 7)"

      - name: business_safety_open_dispute_vs_business_temporal_aging
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_OPEN_DISPUTE_BLOCKS_PLACEMENT]
          - errors[ERR_ACCOUNT_NOT_IN_AGENCY_BUCKET]
        distinguishing_aspect: |
          Category pair: business_safety (priority 9, open dispute) vs
          business_temporal (priority 11, aging bucket). When a direct agency
          placement is attempted on an account that has an OPEN dispute AND is
          only BUCKET_60 (both violated), the open-dispute error must win
          because business_safety has lower priority number than business_temporal.
        test_recipe:
          setup:
            - "Account F2 with balance 70000, guarantor_liability_date 2026-06-15 (BUCKET_60 at default clock — only 47 days)"
            - "OPEN PatientDispute PD_F2 on F2"
            - "Note: 0 statements sent (so statements_sent_count check would also fail, but priority 9 fires first)"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-F2", patient_name: "F2", original_balance_cents: 70000, guarantor_liability_date: "2026-06-15" }
              as: Collector
              captures: { acct_f2: $.data.id }
            - call: "POST /self-pay/patient-disputes"
              payload: { account_id: "${acct_f2}", dispute_reason: "billing error", dispute_amount_cents: 10000 }
              as: Collector
          trigger:
            - call: "POST /self-pay/collection-agency-placements"
              payload: { account_id: "${acct_f2}", agency_name: "AG_Y", contingency_fee_bps: 2500 }
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_OPEN_DISPUTE_BLOCKS_PLACEMENT  (business_safety priority 9 beats business_temporal priority 11)"

  # ===========================================================================
  # Rule 6: boundary_precision_check — two boundaries on DIFFERENT metrics
  # and DIFFERENT endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fpl_percent_exactly_at_full_charity_cap
        grounds:
          - calculations.charity_eligibility
          - calculations.charity_eligibility.constants.FULL_CHARITY_FPL_CAP
        distinguishing_aspect: |
          Metric: fpl_percent. Boundary: FULL_CHARITY_FPL_CAP (200). Endpoint:
          POST /self-pay/presumptive-charity-screenings/{id}/evaluate.
          Pin: fpl_percent == 200 EXACTLY must yield FULL_CHARITY (<= cap);
          fpl_percent == 201 must yield PARTIAL_CHARITY. The boundary is INCLUSIVE.
        test_recipe:
          setup:
            - "Account G1 with balance 100000, guarantor_liability_date 2026-07-01"
            - "Account G2 with balance 100000, guarantor_liability_date 2026-07-01"
            - "FPL for household_size 1 = 1506000 cents"
            - "G1 screening: household_income_cents chosen so floor(income*100/1506000) == 200 → income == 3012000 (floor(3012000*100/1506000) = floor(200.0) = 200)"
            - "G2 screening: household_income_cents chosen so floor(income*100/1506000) == 201 → income == 3027060 (floor(3027060*100/1506000) = floor(201.0) = 201)"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-G1", patient_name: "G1", original_balance_cents: 100000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_g1: $.data.id, acct_g1_v: $.data.version }
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-G2", patient_name: "G2", original_balance_cents: 100000, guarantor_liability_date: "2026-07-01" }
              as: Collector
              captures: { acct_g2: $.data.id, acct_g2_v: $.data.version }
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_g1}", screening_model: "FPL_TIERED", household_size: 1, household_income_cents: 3012000, expected_account_version: "${acct_g1_v}" }
              as: FinancialCounselor
              captures: { scr_g1: $.data.id }
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_g2}", screening_model: "FPL_TIERED", household_size: 1, household_income_cents: 3027060, expected_account_version: "${acct_g2_v}" }
              as: FinancialCounselor
              captures: { scr_g2: $.data.id }
          trigger:
            - call: "POST /self-pay/presumptive-charity-screenings/${scr_g1}/evaluate"
              payload: {}
              as: FinancialCounselor
            - call: "POST /self-pay/presumptive-charity-screenings/${scr_g2}/evaluate"
              payload: {}
              as: FinancialCounselor
          assert:
            - "PresumptiveCharityScreening.${scr_g1}.fpl_percent == 200"
            - "PresumptiveCharityScreening.${scr_g1}.eligibility_outcome == FULL_CHARITY"
            - "PresumptiveCharityScreening.${scr_g2}.fpl_percent == 201"
            - "PresumptiveCharityScreening.${scr_g2}.eligibility_outcome == PARTIAL_CHARITY"

      - name: payment_plan_default_threshold_at_exactly_two_missed
        grounds:
          - calculations.payment_plan_default_sweep
          - calculations.payment_plan_default_sweep.constants.PAYMENT_PLAN_DEFAULT_MISSED_THRESHOLD
        distinguishing_aspect: |
          Metric: missed_installment_count. Boundary: PAYMENT_PLAN_DEFAULT_MISSED_THRESHOLD (2).
          Endpoint: POST /self-pay/_clock/set_current_utc.
          Pin: at exactly 2 missed installments the plan transitions to IN_DEFAULT;
          at 1 missed it stays ACTIVE. The threshold is INCLUSIVE (>= 2).
          Distinct metric (integer count) and distinct endpoint from the FPL boundary.
        test_recipe:
          setup:
            - "Account G3 with balance 200000"
            - "Plan P_G3a: installment 50000, count 4, first_due 2026-01-01 — by 2026-02-15 installments 1 and 2 are due (missed=2)"
            - "Plan P_G3b on a separate account G4: installment 50000, count 4, first_due 2026-02-01 — by 2026-02-15 only installment 1 is due (missed=1)"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-G3", patient_name: "G3", original_balance_cents: 200000, guarantor_liability_date: "2025-12-01" }
              as: Collector
              captures: { acct_g3: $.data.id }
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-G4", patient_name: "G4", original_balance_cents: 200000, guarantor_liability_date: "2025-12-01" }
              as: Collector
              captures: { acct_g4: $.data.id }
            - call: "POST /self-pay/payment-plans"
              payload: { account_id: "${acct_g3}", installment_amount_cents: 50000, installment_count: 4, first_installment_due: "2026-01-01" }
              as: Collector
              captures: { plan_g3a: $.data.id }
            - call: "POST /self-pay/payment-plans"
              payload: { account_id: "${acct_g4}", installment_amount_cents: 50000, installment_count: 4, first_installment_due: "2026-02-01" }
              as: Collector
              captures: { plan_g3b: $.data.id }
          trigger:
            - call: "POST /self-pay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: Collector
          assert:
            - "PaymentPlan.${plan_g3a}.status == IN_DEFAULT  (missed=2 >= threshold 2)"
            - "PaymentPlan.${plan_g3a}.missed_installment_count == 2"
            - "PaymentPlan.${plan_g3b}.status == ACTIVE  (missed=1 < threshold 2)"
            - "PaymentPlan.${plan_g3b}.missed_installment_count == 1"

  # ===========================================================================
  # Rule 7: cross_entity_state_dependency — two dependencies on DIFFERENT
  # entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: writeoff_approval_depends_on_screening_state
        grounds:
          - state_machines.BadDebtWriteOff.PENDING_APPROVAL_to_POSTED
          - validations[priority=8]
          - errors[ERR_SCREENING_NOT_CURRENT]
        distinguishing_aspect: |
          Entity pair: BadDebtWriteOff → PresumptiveCharityScreening. Approving
          a CHARITY_CARE write-off requires the referenced screening to be in
          EVALUATED status with eligible outcome. If the screening has been
          SUPERSEDED (by a newer screening), approval is rejected. The
          write-off's valid transitions depend on the SCREENING's state.
        test_recipe:
          setup:
            - "Account H1 with balance 100000, guarantor_liability_date 2026-06-01"
            - "Screening S_H1_v1 (FPL household 1, income 1500000 → FULL_CHARITY) EVALUATED"
            - "CHARITY_CARE write-off W_H1 created referencing S_H1_v1"
            - "A NEWER screening S_H1_v2 is created on the same account — this supersedes S_H1_v1"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-H1", patient_name: "H1", original_balance_cents: 100000, guarantor_liability_date: "2026-06-01" }
              as: Collector
              captures: { acct_h1: $.data.id, acct_h1_v: $.data.version }
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_h1}", screening_model: "FPL_TIERED", household_size: 1, household_income_cents: 1500000, expected_account_version: "${acct_h1_v}" }
              as: FinancialCounselor
              captures: { scr_h1_v1: $.data.id }
            - call: "POST /self-pay/presumptive-charity-screenings/${scr_h1_v1}/evaluate"
              payload: {}
              as: FinancialCounselor
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_h1}", write_off_kind: "CHARITY_CARE", screening_id: "${scr_h1_v1}" }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_h1: $.data.id }
            - call: "GET /self-pay/accounts/${acct_h1}"
              as: FinancialCounselor
              captures: { acct_h1_v2: $.data.version }
            - call: "POST /self-pay/presumptive-charity-screenings"
              payload: { account_id: "${acct_h1}", screening_model: "SCORE_BASED", third_party_score: 800, expected_account_version: "${acct_h1_v2}" }
              as: FinancialCounselor
              captures: { scr_h1_v2: $.data.id }
            - call: "GET /self-pay/accounts/${acct_h1}"
              as: RevenueIntegrityOfficer
              captures: { acct_h1_v3: $.data.version }
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs/${wo_h1}/approve"
              payload: { expected_account_version: "${acct_h1_v3}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_SCREENING_NOT_CURRENT"
            - "BadDebtWriteOff.${wo_h1}.status == PENDING_APPROVAL  (unchanged)"

      - name: agency_placement_recall_window_depends_on_earlyout_recall_deadline
        grounds:
          - state_machines.SelfPayAccount.IN_EARLY_OUT_to_IN_COLLECTIONS
          - validations[priority=12]
          - errors[ERR_RECALL_WINDOW_STILL_OPEN]
        distinguishing_aspect: |
          Entity pair: CollectionAgencyPlacement → EarlyOutPlacement. Escalating
          an IN_EARLY_OUT account to collections requires that the active
          EarlyOutPlacement's recall_deadline has already passed. The
          CollectionAgencyPlacement creation precondition depends on the
          EarlyOutPlacement's deadline field (a temporal cross-entity
          dependency). Distinct entity pair from write-off→screening.
        test_recipe:
          setup:
            - "Account H2 with balance 80000, guarantor_liability_date 2026-06-01 (BUCKET_60 at default 2026-08-01)"
            - "EarlyOutPlacement EOP_H2 created at default clock (placed_at 2026-08-01)"
            - "recall_deadline = guarantor_liability_date + EARLY_OUT_RECALL_DAYS (90 days) = 2026-08-30"
            - "Logical clock is still 2026-08-01 — recall_deadline NOT yet passed"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-H2", patient_name: "H2", original_balance_cents: 80000, guarantor_liability_date: "2026-06-01" }
              as: Collector
              captures: { acct_h2: $.data.id }
            - call: "POST /self-pay/early-out-placements"
              payload: { account_id: "${acct_h2}", vendor_name: "VENDOR_A", contingency_fee_bps: 1500 }
              as: Collector
              captures: { eop_h2: $.data.id }
          trigger:
            - call: "POST /self-pay/collection-agency-placements"
              payload: { account_id: "${acct_h2}", agency_name: "AG_Z", contingency_fee_bps: 2500 }
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_RECALL_WINDOW_STILL_OPEN"
            - "EarlyOutPlacement.${eop_h2}.status == ACTIVE  (unchanged)"
            - "SelfPayAccount.${acct_h2}.status == IN_EARLY_OUT  (unchanged)"

  # ===========================================================================
  # Rule 8: resource_temporal_overlap — two interval-collision rules with
  # DIFFERENT interval semantics on DIFFERENT resources.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: only_one_active_placement_per_account_family_exclusive
        grounds:
          - state_machines.SelfPayAccount.OPEN_to_IN_EARLY_OUT
          - errors[ERR_ACTIVE_PLACEMENT_EXISTS]
        distinguishing_aspect: |
          Resource: SelfPayAccount. Interval semantics: occupancy-exclusion —
          an account may have AT MOST ONE EarlyOutPlacement with status == ACTIVE
          at any instant; attempting to place again while a prior placement is
          ACTIVE is rejected. The "interval" is the placement's ACTIVE lifetime
          [placed_at, recall_at_or_completion]; occupancy is boolean (one slot),
          not additive. Endpoint: POST /self-pay/early-out-placements.
        test_recipe:
          setup:
            - "Account I1 with balance 60000, guarantor_liability_date 2026-06-01 (BUCKET_60)"
            - "EarlyOutPlacement EOP_I1 already ACTIVE"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-I1", patient_name: "I1", original_balance_cents: 60000, guarantor_liability_date: "2026-06-01" }
              as: Collector
              captures: { acct_i1: $.data.id }
            - call: "POST /self-pay/early-out-placements"
              payload: { account_id: "${acct_i1}", vendor_name: "VENDOR_A", contingency_fee_bps: 1500 }
              as: Collector
              captures: { eop_i1: $.data.id }
          trigger:
            - call: "POST /self-pay/early-out-placements"
              payload: { account_id: "${acct_i1}", vendor_name: "VENDOR_B", contingency_fee_bps: 1800 }
              as: Collector
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  (account.status is IN_EARLY_OUT, not OPEN — the second placement request is rejected by the account-state precondition)"
            - "EarlyOutPlacement.${eop_i1}.status == ACTIVE  (first placement unchanged)"

      - name: vendor_performance_snapshot_windows_disjoint
        grounds:
          - calculations.vendor_performance_rate
          - entities.VendorPerformanceSnapshot.fields.snapshot_period_start
          - entities.VendorPerformanceSnapshot.fields.snapshot_period_end
        distinguishing_aspect: |
          Resource: VendorPerformanceSnapshot measurement window. Interval
          semantics: half-open [start, end) — placements with placed_at == end
          are EXCLUDED (they belong to the next window). Two snapshots with
          adjacent windows [2026-01-01, 2026-02-01) and [2026-02-01, 2026-03-01)
          must NOT double-count a placement placed at exactly 2026-02-01 —
          it falls into the second window only. This is a half-open interval
          adjacency semantic, distinct from boolean occupancy-exclusion.
          Endpoint: POST /self-pay/vendor-performance-snapshots.
        test_recipe:
          setup:
            - "Account I2 with balance 100000, guarantor_liability_date 2026-06-01"
            - "Logical clock set to 2026-02-01T00:00:00Z BEFORE creating placement, so placed_at falls exactly at 2026-02-01"
            - "EarlyOutPlacement EOP_I2 created at clock 2026-02-01"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-I2", patient_name: "I2", original_balance_cents: 100000, guarantor_liability_date: "2026-06-01" }
              as: Collector
              captures: { acct_i2: $.data.id }
            - call: "POST /self-pay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: RevenueIntegrityOfficer
            - call: "POST /self-pay/early-out-placements"
              payload: { account_id: "${acct_i2}", vendor_name: "VENDOR_A", contingency_fee_bps: 1500 }
              as: Collector
              captures: { eop_i2: $.data.id }
          trigger:
            - call: "POST /self-pay/vendor-performance-snapshots"
              payload: { vendor_name: "VENDOR_A", snapshot_period_start: "2026-01-01", snapshot_period_end: "2026-02-01" }
              as: RevenueIntegrityOfficer
              captures: { snap_first: $.data.id }
            - call: "POST /self-pay/vendor-performance-snapshots"
              payload: { vendor_name: "VENDOR_A", snapshot_period_start: "2026-02-01", snapshot_period_end: "2026-03-01" }
              as: RevenueIntegrityOfficer
              captures: { snap_second: $.data.id }
          assert:
            - "VendorPerformanceSnapshot.${snap_first}.placements_in_window == 0  (placed_at == end is EXCLUDED — half-open interval)"
            - "VendorPerformanceSnapshot.${snap_second}.placements_in_window == 1  (placed_at == start is INCLUDED)"

  # ===========================================================================
  # Rule 9: compensating_invariant — forward + compensating action leave a
  # conserved quantity unchanged. Two invariants on DIFFERENT quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: writeoff_then_reverse_preserves_current_balance_and_totals
        grounds:
          - state_machines.BadDebtWriteOff.PENDING_APPROVAL_to_POSTED
          - state_machines.BadDebtWriteOff.POSTED_to_REVERSED
          - calculations.write_off_amount
        distinguishing_aspect: |
          Conserved quantity: account.current_balance_cents +
          account.bad_debt_writeoff_total_cents. Forward (POSTED): balance drops
          to 0, total += amount. Reverse: balance += amount, total -= amount.
          After the round trip, balance == original_balance AND total == 0.
          The pair (POSTED, REVERSED) conserves the SUM current_balance_cents
          + bad_debt_writeoff_total_cents = original_balance_cents.
        test_recipe:
          setup:
            - "Account J1 with balance 75000, guarantor_liability_date 2026-01-01, BUCKET_120_PLUS, 3 statements sent"
            - "BAD_DEBT write-off W_J1 created by collector-1, approved by officer-1"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-J1", patient_name: "J1", original_balance_cents: 75000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_j1: $.data.id }
            - call: "POST /self-pay/accounts/${acct_j1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_j1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/accounts/${acct_j1}/statements"
              payload: {}
              as: Collector
            - call: "POST /self-pay/bad-debt-write-offs"
              payload: { account_id: "${acct_j1}", write_off_kind: "BAD_DEBT", medicare_cost_report_year: 2026 }
              as: Collector
              as_user_id: "collector-1"
              captures: { wo_j1: $.data.id }
            - call: "GET /self-pay/accounts/${acct_j1}"
              as: RevenueIntegrityOfficer
              captures: { acct_j1_v: $.data.version }
            - call: "POST /self-pay/bad-debt-write-offs/${wo_j1}/approve"
              payload: { expected_account_version: "${acct_j1_v}" }
              as: RevenueIntegrityOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /self-pay/bad-debt-write-offs/${wo_j1}/reverse"
              payload: {}
              as: RevenueIntegrityOfficer
              as_user_id: "officer-2"
          assert:
            - "SelfPayAccount.${acct_j1}.current_balance_cents == 75000  (restored)"
            - "SelfPayAccount.${acct_j1}.bad_debt_writeoff_total_cents == 0  (decremented back)"
            - "SelfPayAccount.${acct_j1}.current_balance_cents + SelfPayAccount.${acct_j1}.bad_debt_writeoff_total_cents == 75000  (invariant holds)"

      - name: payment_plan_installment_then_plan_completion_conserves_balance_sum
        grounds:
          - calculations.vendor_contingency_fee
          - state_machines.PaymentPlan.ACTIVE_to_COMPLETED
          - entities.SelfPayAccount.fields.current_balance_cents
        distinguishing_aspect: |
          Conserved quantity: account.current_balance_cents + sum(RecoveryTransaction.amount_cents for the account).
          Each INSTALLMENT payment reduces balance AND adds the same amount to the recovery ledger —
          the sum current_balance_cents + sum(recoveries) is invariant across the plan lifecycle.
          Distinct quantity from writeoff_then_reverse (which used balance + writeoff_total).
        test_recipe:
          setup:
            - "Account J2 with balance 100000, guarantor_liability_date 2026-01-01"
            - "PaymentPlan P_J2: installment 40000, count 2, first_due 2026-01-15"
          setup_api_calls:
            - call: "POST /self-pay/accounts"
              payload: { patient_mrn: "MRN-J2", patient_name: "J2", original_balance_cents: 100000, guarantor_liability_date: "2026-01-01" }
              as: Collector
              captures: { acct_j2: $.data.id }
            - call: "POST /self-pay/payment-plans"
              payload: { account_id: "${acct_j2}", installment_amount_cents: 40000, installment_count: 2, first_installment_due: "2026-01-15" }
              as: Collector
              captures: { plan_j2: $.data.id }
          trigger:
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_j2}", payment_kind: "INSTALLMENT", amount_cents: 40000, payment_plan_id: "${plan_j2}" }
              as: Collector
            - call: "POST /self-pay/recovery-transactions"
              payload: { account_id: "${acct_j2}", payment_kind: "INSTALLMENT", amount_cents: 40000, payment_plan_id: "${plan_j2}" }
              as: Collector
          assert:
            - "PaymentPlan.${plan_j2}.status == COMPLETED"
            - "PaymentPlan.${plan_j2}.installments_paid_count == 2"
            - "SelfPayAccount.${acct_j2}.current_balance_cents == 20000"
            - "SelfPayAccount.${acct_j2}.recovery_total_cents == 80000"
