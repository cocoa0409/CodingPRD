            - call: "POST /voucher-redemptions/${red}/reconcile"
              payload: {}
              as: MarketManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: token_overdraw_at_exact_issuance_boundary
        grounds:
          - validations[priority=11]
          - errors[ERR_TOKEN_OVERDRAW]
          - state_machines.VoucherRedemption.SUBMITTED_to_RECONCILED
        distinguishing_aspect: |
          Numeric threshold (>= vs >): reconciling tokens summing to exactly tokens_issued (50+50? no:
