      - name: compound_ingredient_parent_from_another_applicant_is_rejected
        claim_type: cycle_constraints
        grounds:
          - endpoints."POST /gfco/ingredients"
          - validations.priority_44
          - errors.ERR_INGREDIENT_GRAPH_CYCLE
          - entities.Ingredient.fields.parent_ingredient_id
          - complexity_profile.relationship_patterns.self_referential
        distinguishing_aspect: |
          The self-referential parent chain is constrained twice: the parent must belong to
          the same applicant AND the link must not close a cycle. Setup proves a legal
          two-level chain inside one applicant is accepted, so the rejection isolates the
          cross-applicant case - a graph edge that would let one applicant's compound
          ingredient depend on a component it does not own and cannot get documents for.
        test_recipe:
          setup:
            - "Two applicants, Northgate and Southbank, sharing one supplier."
            - "Northgate owns a DRAFT sub-component ingredient and a compound ingredient that legally names it as parent_ingredient_id."
            - "Southbank owns a DRAFT ingredient of its own that the trigger will try to hang under Northgate's sub-component."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
