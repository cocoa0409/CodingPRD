          - errors.ERR_CONTRACT_LAPSED
        excluded_because:
          difficulty_instance: order_confirmation_requires_live_affiliation_contract
          rationale: "The temporal gate on order confirmation is asserted as the failure path of the named §1.8 instance, which confirms an order before term_end and re-confirms the same shape after the clock passes it."

      - name: frozen_terms_change_behavior_on_the_same_agreement
        claim_type: conditional_feature_flags
        grounds:
          - state_machines.OncologyNetwork.ACTIVE_to_ACTIVE
          - calculations.practice_observed_unit_price_cents
          - errors.ERR_TERMS_FROZEN
        distinguishing_aspect: "The freeze flag flips observable behavior twice on identical data: a new agreement create is refused with ERR_TERMS_FROZEN while frozen, and an existing order prices at list rather than at its agreement discount."
        test_recipe:
          setup:
            - "Practice P affiliated with an ACTIVE agreement at discount_pct 0.10 and a product at 1000 cents; clock at 2026-09-01T00:00:00Z."
