              as: Archivist
              captures: { seriesA_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Divested Subsidiary Files", business_unit: "CORP", retention_schedule_id: "${schedB_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 120, earliest_record_year: 1915, latest_record_year: 1994 }
              as: Archivist
              captures: { seriesB_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "STACK-6", temperature_c: 17.0, relative_humidity_pct: 43.0, max_overlapping_migration_jobs: 1 }
              as: PreservationOfficer
              captures: { zone_id: $.data.id }
