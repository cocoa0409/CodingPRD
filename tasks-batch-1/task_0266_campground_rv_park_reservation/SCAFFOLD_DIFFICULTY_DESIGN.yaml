# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Campground & RV Park Reservation (private) — Expert
# 9 rules x 2 instances = 18 instances.
# Standard rate plan (RV): nightly=5000, weekly=30000, monthly=100000.
# Park: deposit_pct=0.30, tax_rate=0.08, long_stay_nights_threshold=28.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: stay_charge_provisional_vs_final_on_early_checkout
        grounds:
          - calculations.stay_charge
          - entities.Reservation.fields.priced_nights
          - entities.Reservation.fields.total_due_cents
          - state_machines.Reservation.reservation_status.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: |
          On the Reservation domain, the provisional charge prices all 10 requested
          nights (stay_charge 45000, total_due 48600) while the final charge at an
          early checkout (5 actual nights) re-selects the cheapest tier over 5 nights
          (stay_charge 25000, total_due 27000) — different numbers from identical
          booking inputs.
        test_recipe:
          setup:
            - "Park P with deposit_pct=0.30, tax_rate=0.08; RV RatePlan (5000/30000/100000); RV Site S max_stay=30, no seasons."
            - "Guest G (lifetime 0). Reservation R for 10 nights 2026-08-01..2026-08-11, deposit paid, CONFIRMED, CHECKED_IN; clock advanced to 2026-08-06."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08, long_stay_nights_threshold: 28 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/cancellation-policies"
              payload: { full_refund_min_days: 14, half_refund_min_days: 7 }
              as: Operator
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, dep_due: $.data.deposit_due_cents }
            - call: "POST /reservations/${res_id}/payments"
              payload: { type: "DEPOSIT", amount_cents: "${dep_due}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: Operator
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-08-06T12:00:00Z" }
              as: Operator
          trigger:
            - call: "POST /reservations/${res_id}/check-out"
              payload: {}
              as: Operator
              captures: { final_total: $.data.total_due_cents, final_nights: $.data.priced_nights }
          assert:
            - "Reservation.${res_id}.reservation_status == CHECKED_OUT"
            - "Reservation.${res_id}.priced_nights == 5"
            - "Reservation.${res_id}.stay_charge_cents == 25000"
            - "Reservation.${res_id}.total_due_cents == 27000"
            - "Provisional total_due before checkout was 48600 (10 nights); final 27000 differs."

      - name: loyalty_discount_lifetime_tier_vs_trailing_12mo
        grounds:
          - calculations.loyalty_discount
          - entities.Guest.fields.lifetime_spend_cents
          - entities.Reservation.fields.discount_cents
          - state_machines.Reservation.reservation_status.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          On the Guest domain, the APPLIED lifetime_tier variant reads cumulative
          lifetime_spend_cents (216000 -> SILVER 5%) and freezes discount_cents=2250
          (total_due 46170); the trailing_12mo variant would see 0 recent spend
          (clock moved >12 months past the prior checkout) -> 0% -> discount 0
          (total 48600). Different number from identical data; the system uses
          lifetime_tier.
        test_recipe:
          setup:
            - "Guest G completes a 56-night prior stay (final total 216000) so lifetime_spend_cents=216000; clock then advanced to 2026-08-01 (>12 months after the prior checkout 2024-02-27)."
            - "A fresh 10-night reservation is created for G on an available RV site, deposit paid, then confirmed."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2024-01-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08, long_stay_nights_threshold: 28 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/cancellation-policies"
              payload: { full_refund_min_days: 14, half_refund_min_days: 7 }
              as: Operator
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 60 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2024-01-02", check_out_date: "2024-02-27", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { prior_id: $.data.id, prior_dep: $.data.deposit_due_cents }
            - call: "POST /reservations/${prior_id}/payments"
              payload: { type: "DEPOSIT", amount_cents: "${prior_dep}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /reservations/${prior_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /reservations/${prior_id}/check-in"
              payload: {}
              as: Operator
            - call: "POST /_clock/set"
              payload: { current_utc: "2024-02-27T12:00:00Z" }
              as: Operator
            - call: "POST /reservations/${prior_id}/check-out"
              payload: {}
              as: Operator
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: Operator
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Operator
              captures: { site_v1: $.data.version }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-09-05", check_out_date: "2026-09-15", expected_site_version: "${site_v1}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, dep_due: $.data.deposit_due_cents }
            - call: "POST /reservations/${res_id}/payments"
              payload: { type: "DEPOSIT", amount_cents: "${dep_due}" }
              as: Guest
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { disc: $.data.discount_cents, tot: $.data.total_due_cents }
          assert:
            - "Guest.${g_id}.lifetime_spend_cents == 216000"
            - "Reservation.${res_id}.discount_cents == 2250"
            - "Reservation.${res_id}.total_due_cents == 46170"
            - "Trailing-12mo interpretation would give discount 0 / total 48600; applied is lifetime_tier."

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_decomposition_min_over_three_bucketings
        grounds:
          - calculations.stay_charge
          - entities.RatePlan.fields.weekly_rate_cents
          - entities.RatePlan.fields.monthly_rate_cents
          - entities.Reservation.fields.stay_charge_cents
        distinguishing_aspect: |
          MODE (a): non-linear nested min over three decomposition candidates with
          floor-division branches — cand_nightly=50000, cand_weekly=45000,
          cand_monthly=45000 for 10 nights; stay_charge = min = 45000 (weekly tier
          beats nightly). Three inputs (nightly/weekly/monthly) interact non-linearly.
        test_recipe:
          setup:
            - "RV RatePlan (5000/30000/100000); RV Site; clock 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
          assert:
            - "Reservation.${res_id}.nights == 10"
            - "Reservation.${res_id}.stay_charge_cents == 45000"

      - name: season_surcharge_round_per_night_then_sum
        grounds:
          - calculations.season_surcharge
          - entities.Season.fields.surcharge_pct
          - entities.Reservation.fields.season_surcharge_cents
        distinguishing_aspect: |
          MODE (b): pinned rounding order. nightly=4444, surcharge_pct=12.5; per-night
          surcharge round_half_up(4444*0.125)=556, summed over 2 in-season nights =
          1112. Summing raw (555.5*2=1111.0) then rounding gives 1111 — the WRONG
          order; the asserted value is the round-then-sum result 1112.
        test_recipe:
          setup:
            - "RV RatePlan B (nightly=4444, weekly=999999, monthly=9999999 so tiered picks nightly); Season PEAK 2026-08-01..2026-08-31 surcharge_pct=12.5; Site on plan B; clock 2026-07-01."
            - "Reservation for 2 nights entirely inside PEAK (2026-08-10..2026-08-12)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 4444, weekly_rate_cents: 999999, monthly_rate_cents: 9999999 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/seasons"
              payload: { name: "PEAK", start_date: "2026-08-01", end_date: "2026-08-31", surcharge_pct: 12.5 }
              as: Operator
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "B-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-10", check_out_date: "2026-08-12", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
          assert:
            - "Reservation.${res_id}.nights == 2"
            - "Reservation.${res_id}.stay_charge_cents == 8888"
            - "Reservation.${res_id}.season_surcharge_cents == 1112"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_parallel_payment_and_reservation_dimensions
        grounds:
          - state_machines.Reservation.payment_status.UNPAID_to_DEPOSIT_PAID
          - state_machines.Reservation.reservation_status.REQUESTED_to_CONFIRMED
          - entities.Reservation.fields.payment_status
          - entities.Reservation.fields.reservation_status
        distinguishing_aspect: |
          On Reservation, payment_status advances UNPAID->DEPOSIT_PAID independently
          of reservation_status (a deposit can be recorded while still REQUESTED);
          two orthogonal dimensions evolve on the same row — a parallel-dimension
          (non-linear) shape.
        test_recipe:
          setup:
            - "RV Site; Guest; Reservation R created REQUESTED/UNPAID (10 nights)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/cancellation-policies"
              payload: { full_refund_min_days: 14, half_refund_min_days: 7 }
              as: Operator
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, dep_due: $.data.deposit_due_cents }
          trigger:
            - call: "POST /reservations/${res_id}/payments"
              payload: { type: "DEPOSIT", amount_cents: "${dep_due}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { pay_id: $.data.id }
          assert:
            - "Reservation.${res_id}.payment_status == DEPOSIT_PAID"
            - "Reservation.${res_id}.reservation_status == REQUESTED"

      - name: site_cyclic_active_maintenance_active
        grounds:
          - state_machines.Site.status.ACTIVE_to_MAINTENANCE
          - state_machines.Site.status.MAINTENANCE_to_ACTIVE
          - entities.Site.fields.status
        distinguishing_aspect: |
          On Site (a different entity from Reservation), status cycles
          ACTIVE->MAINTENANCE->ACTIVE — a cyclic (non-linear) shape, distinct from
          the RETIRED terminal branch.
        test_recipe:
          setup:
            - "RV Site S in ACTIVE; clock 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood" }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /sites/${site_id}/maintenance"
              payload: { expected_site_version: "${site_v0}" }
              as: Operator
              captures: { site_v1: $.data.version }
          trigger:
            - call: "POST /sites/${site_id}/reactivate"
              payload: { expected_site_version: "${site_v1}" }
              as: Operator
              captures: { final_status: $.data.status }
          assert:
            - "Site.${site_id}.status == ACTIVE"
            - "Site.${site_id}.version == 3"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: site_retire_cancels_reservations_refunds_payments_recompute_guest
        grounds:
          - state_machines.Site.status.ACTIVE_to_RETIRED
          - state_machines.Reservation.reservation_status.REQUESTED_to_CANCELLED
          - state_machines.Reservation.payment_status.DEPOSIT_PAID_to_REFUNDED
          - entities.Payment.fields.type
          - entities.Guest.fields.lifetime_spend_cents
        distinguishing_aspect: |
          Depth-3 cascade from Site retire: (L1) Site->RETIRED cancels the live
          Reservation; (L2) that cancellation creates a REFUND Payment and flips
          payment_status->REFUNDED; (L3) the refund triggers a Guest recompute. Each
          hop is caused by the prior hop, not by the retire action directly.
        test_recipe:
          setup:
            - "RV Site S with a CONFIRMED reservation R (deposit paid, full refund window)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/cancellation-policies"
              payload: { full_refund_min_days: 14, half_refund_min_days: 7 }
              as: Operator
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, dep_due: $.data.deposit_due_cents }
            - call: "POST /reservations/${res_id}/payments"
              payload: { type: "DEPOSIT", amount_cents: "${dep_due}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Operator
              captures: { site_v1: $.data.version }
          trigger:
            - call: "POST /sites/${site_id}/retire"
              payload: { expected_site_version: "${site_v1}" }
              as: Operator
              captures: { final_status: $.data.status }
          assert:
            - "Site.${site_id}.status == RETIRED"
            - "Reservation.${res_id}.reservation_status == CANCELLED"
            - "Reservation.${res_id}.payment_status == REFUNDED"
            - "Reservation.${res_id}.balance_cents == 0"
            - "Site.${site_id}.booked_night_count == 0"

      - name: checkout_reconciles_charge_settles_balance_updates_guest
        grounds:
          - state_machines.Reservation.reservation_status.CHECKED_IN_to_CHECKED_OUT
          - entities.Reservation.fields.total_due_cents
          - entities.Guest.fields.completed_stays_count
          - entities.Guest.fields.lifetime_spend_cents
        distinguishing_aspect: |
          Depth-2 cascade from Reservation checkout (a DIFFERENT trigger than retire):
          (L1) CHECKED_IN->CHECKED_OUT reconciles total_due and auto-records a BALANCE
          Payment settling payment_status->PAID_IN_FULL; (L2) that settlement triggers
          the Guest's completed_stays_count and lifetime_spend_cents recompute.
        test_recipe:
          setup:
            - "RV Site; Guest G (lifetime 0); Reservation R 10 nights, deposit paid, CONFIRMED, CHECKED_IN; clock at/after check_out_date for full-stay checkout."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/cancellation-policies"
              payload: { full_refund_min_days: 14, half_refund_min_days: 7 }
              as: Operator
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
