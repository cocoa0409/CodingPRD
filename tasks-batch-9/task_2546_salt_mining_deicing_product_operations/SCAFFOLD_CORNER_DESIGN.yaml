            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
          trigger:
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "FOOD_GRADE", screen_spec: "FINE", anticaking_ppm: 8.00, corrosion_inhibitor_pct: 0.00, input_tons: 500, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id", pur: "$.data.purity_pct_nacl", yld: "$.data.yield_tons" }
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${batch_id}"
              payload: {}
              as: QualityLab
