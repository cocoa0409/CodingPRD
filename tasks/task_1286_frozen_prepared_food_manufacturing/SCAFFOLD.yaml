  # --- FinishedGoodsLot ---
  - method: GET
    path: "/plant/lots"
    description: "List finished goods lots"
    roles: [PlantManager, ProductionPlanner, LineOperator, QATechnician, QAManager, WarehouseLead, CoPackCustomer]
    code: 200
    input: ["batch_id?", "slot_id?", "status?", "limit?", "offset?"]
    output: FinishedGoodsLot[]
    side_effects: []
  - method: GET
    path: "/plant/lots/{lotId}"
    description: "Get a lot"
    roles: [PlantManager, ProductionPlanner, LineOperator, QATechnician, QAManager, WarehouseLead, CoPackCustomer]
    code: 200
    input: []
    output: FinishedGoodsLot
    side_effects: []
  - method: POST
    path: "/plant/lots/{lotId}/put-away"
    description: "Put cases away into a slot (lot QA_PENDING/RELEASED/QUARANTINED; first put-away pins slot_id)"
    roles: [WarehouseLead]
    code: 200
    input: [slot_id, cases]
    output: FinishedGoodsLot
    side_effects: ["lot.stored_cases += cases", "slot.occupied_cases += cases"]
  - method: POST
    path: "/plant/lots/{lotId}/withdraw"
    description: "Withdraw stored cases (lot must be RELEASED; SHIPMENT blocked after final_expiry_date)"
    roles: [WarehouseLead]
    code: 200
    input: [cases, purpose]
    output: FinishedGoodsLot
    side_effects: ["lot.stored_cases -= cases; lot.cases_on_hand -= cases", "slot.occupied_cases -= cases", "purpose SHIPMENT: lot.cases_shipped += cases", "cases_on_hand == 0 -> DEPLETED (auto)"]
  - method: POST
    path: "/plant/lots/{lotId}/quarantine"
    description: "Manually quarantine a released lot"
    roles: [QATechnician]
    code: 200
    input: []
    output: FinishedGoodsLot
    side_effects: ["release_status -> QUARANTINED", "order.releasable_cases -= cases_on_hand"]
  - method: POST
    path: "/plant/lots/{lotId}/release"
    description: "Release a lot (QA_PENDING/QUARANTINED -> RELEASED; CCP, expiry, segregation gates)"
    roles: [QAManager]
    code: 200
    input: []
    output: FinishedGoodsLot
    side_effects: ["release_status -> RELEASED", "order.releasable_cases += cases_on_hand", "order.billed_amount_cents recomputed"]
  - method: POST
    path: "/plant/lots/{lotId}/reject"
    description: "Reject a lot"
    roles: [QAManager]
    code: 200
    input: [reason]
    output: FinishedGoodsLot
    side_effects: ["release_status -> REJECTED"]
  - method: POST
    path: "/plant/lots/{lotId}/rework"
