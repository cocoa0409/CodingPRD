  - section: cross_cutting_complexity_layers
    instances:
      - name: tier_override_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tier-override-stale-salon]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on SalonAccount.version: after a successful override bumps the version, a second override carrying the previously observed version is rejected with ERR_STALE_VERSION (412); sequential requests, no wall-clock dependence."
        test_recipe:
          setup: ["ACTIVE salon; caller captured version V via GET"]
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C 46", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon 46", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-46", issuing_state: "CA", license_type: BARBER, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic: "$.data.id" } }
            - { call: "POST /api/licenses/${lic}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "GET /api/salon-accounts/${s_id}", payload: {}, as: DistributionAdmin, captures: { s_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/salon-accounts/${s_id}/tier-override", payload: { tier: GOLD, expected_salon_account_version: "${s_v}" }, as: DistributionAdmin }
            - { call: "POST /api/salon-accounts/${s_id}/tier-override", payload: { tier: PLATINUM, expected_salon_account_version: "${s_v}" }, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "First override succeeds (tier GOLD, version V -> V+1)"
            - "Second override with the same captured version: error_id == ERR_STALE_VERSION (http 412), tier stays GOLD"

      - name: budget_adjust_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[promotion-budget-adjust-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Promotion.version: budget adjustments are otherwise always legal, so a stale expected_promotion_version is the only failure mode - rejected with ERR_STALE_VERSION."
        test_recipe:
          setup: ["ACTIVE promotion (budget 10, remaining 10); caller captured version V"]
          setup_api_calls:
            - { call: "POST /api/brands", payload: { name: "Brand47" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-47", name: "Sachet", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 500, weight_grams: 10 }, as: DistributionAdmin, captures: { sp: "$.data.id" } }
            - { call: "POST /api/promotions", payload: { code: "OCC47", promo_type: SAMPLE, eligible_tiers: [SILVER], starts_at: "2026-07-01T00:00:00Z", ends_at: "2027-01-01T00:00:00Z", budget_units: 10, per_salon_cap: 5, sample_product_id: "${sp}", sample_units_per_redemption: 1 }, as: DistributionAdmin, captures: { promo: "$.data.id" } }
            - { call: "POST /api/promotions/${promo}/activate", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/promotions/${promo}", payload: {}, as: DistributionAdmin, captures: { p_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/promotions/${promo}/budget-adjustments", payload: { delta_units: 5, expected_promotion_version: "${p_v}" }, as: DistributionAdmin }
            - { call: "POST /api/promotions/${promo}/budget-adjustments", payload: { delta_units: 5, expected_promotion_version: "${p_v}" }, as: DistributionAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "First adjustment succeeds: budget_units == 15, remaining_budget_units == 15"
            - "Second adjustment with the stale version: error_id == ERR_STALE_VERSION; budget stays 15"

      - name: order_item_add_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-item-add-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Order.version for DRAFT item adds: a second add reusing the create-time version is rejected with ERR_STALE_VERSION even though the order is still DRAFT."
        test_recipe:
          setup: ["DRAFT order (version captured at create); two products"]
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C 48", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
