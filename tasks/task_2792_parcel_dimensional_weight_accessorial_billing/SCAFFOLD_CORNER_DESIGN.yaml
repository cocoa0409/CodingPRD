          - calculations.accessorial_assessment
          - entities.Shipment.fields.accessorial_total_cents
        distinguishing_aspect: |
          REFUSED is the only movement transition that mints TWO AccessorialCharge rows in
          one request — REFUSAL 1350 plus RETURN_UNDELIVERABLE 1800 — so
          accessorial_total_cents becomes 3150 and the preview line total 5810, while the
          endpoint's response body is the updated Shipment rather than either charge.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 that overrides no accessorial rates, so REFUSAL prices at its 1350 default and RETURN_UNDELIVERABLE at 1800."
