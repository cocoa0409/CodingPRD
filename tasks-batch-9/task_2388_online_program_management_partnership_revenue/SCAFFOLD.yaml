scenario: "2388. Online Program Management Partnership & Revenue Share (online program management partner): program selection and market demand analysis before launch, revenue share versus fee-for-service contract structure with term length, marketing spend, lead generation and enrollment counselor performance standards, course design and faculty ownership of academic content, student support services scope split between university and partner, tuition collection, revenue recognition and partner remittance, incentive compensation rules for enrollment staff, contract exit with teach-out obligations and asset transfer"
domain_name: "online-program-management-partnership"
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Cyclic is the dominant shape (Partnership DRAFT<->UNDER_REVIEW, Program
    SUBMITTED<->REVISION_REQUESTED and LAUNCHED<->SUSPENDED, Course
    FACULTY_REVIEW<->IN_DESIGN, RemittanceStatement CALCULATED<->STALE), but two
    additional non-linear shapes coexist: EnrollmentCounselor carries parallel
    state dimensions (performance_status x incentive_eligibility) and
    RemittanceStatement carries a branching fork-join (APPROVE branch vs
    DISPUTE->RESOLVE branch joining at UNIVERSITY_APPROVED before REMITTED).

entities:
  - name: Partnership
    parent: null
    common_fields: true
    fields:
      - name: university_name
        type: string
        source: input
        description: legal name of the contracting university
      - name: university_ipeds_id
        type: string
        source: input
        description: IPEDS unit id of the university; used as the exclusivity scope key
        constraints: 6 numeric characters
      - name: partner_org_name
        type: string
        source: input
        description: legal name of the online program management partner
      - name: contract_structure
        type: enum
        source: input
        description: economic model of the agreement
        constraints: "REVENUE_SHARE | FEE_FOR_SERVICE"
      - name: term_months
        type: integer
        source: input
        description: contract term length in whole months measured from effective_date
        constraints: 12..120
      - name: effective_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) on which the term begins
      - name: expiry_date
        type: string
        source: computed
        description: effective_date plus term_months, minus one day; recomputed whenever term_months or effective_date changes
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.Partnership
        default: DRAFT
        constraints: "DRAFT | UNDER_REVIEW | EXECUTED | WIND_DOWN | CLOSED_OUT"
      - name: revenue_share_tiers
        type: array
        source: input
        description: ordered marginal revenue-share tiers, each object { through_cents, partner_rate }; the final tier uses through_cents null meaning unbounded
        default: DEFAULT_REVENUE_SHARE_TIERS (see calculations.partner_share_gross.constants)
      - name: fee_schedule_monthly_cents
        type: integer
        source: input
        description: flat monthly service fee owed to the partner under FEE_FOR_SERVICE; must be 0 when contract_structure == REVENUE_SHARE
        default: 0
      - name: refund_schedule
        type: array
        source: input
        description: ordered withdrawal refund bands, each object { through_day, refund_pct }; matched by the first band whose through_day >= days_elapsed_at_withdrawal
        default: DEFAULT_REFUND_SCHEDULE (see calculations.withdrawal_refund_and_clawback.constants)
      - name: revenue_recognition_method
        type: enum
        source: input
        description: which recognition variant statements apply by default
        constraints: "PERIOD_STRAIGHT_LINE | MILESTONE_CHRONOLOGICAL"
      - name: exclusivity_cip_codes
        type: array
        source: input
        description: CIP codes over which the partner holds launch exclusivity at this university
        default: []
      - name: bundled_services_exception_claimed
        type: boolean
        source: input
        description: whether the partnership claims the bundled-services exception permitting salary adjustments not based solely on enrollment counts
        default: false
      - name: marketing_budget_cents
        type: integer
        source: input
        description: total marketing envelope the partner may consume across all programs of this partnership
      - name: marketing_budget_remaining_cents
        type: integer
        source: computed
        description: marketing_budget_cents minus net posted marketing spend; see calculations and invariant INV-2
      - name: unrecouped_marketing_spend_cents
        type: integer
        source: computed
        description: net posted marketing spend that has not yet been recouped by any REMITTED statement
      - name: collected_tuition_cents
        type: integer
        source: computed
        description: sum of TuitionPayment.amount_cents with entry_type == PAYMENT minus sum with entry_type == REFUND, across all Enrollments of all Programs of this Partnership (invariant INV-1)
      - name: recognized_revenue_cents
        type: integer
        source: computed
        description: cumulative recognized revenue across all Enrollments of this Partnership
      - name: contract_year_recognized_cents
        type: integer
        source: computed
        description: recognized revenue attributable to statement periods whose period_start falls in the current contract year, used for marginal tier selection
      - name: remitted_to_partner_cents
        type: integer
        source: computed
        description: sum of RemittanceStatement.net_payable_cents for statements in status REMITTED
      - name: holdback_balance_cents
        type: integer
        source: computed
        description: sum of RemittanceStatement.holdback_cents for statements in status REMITTED minus holdback released by CERTIFIED TeachOutPlans
      - name: change_request_count
        type: integer
        source: computed
        description: number of times the Partnership has been returned from UNDER_REVIEW to DRAFT
        default: 0
      - name: executed_date
        type: string
        source: system
        description: ISO date on which the Partnership entered EXECUTED; null before that
      - name: wind_down_effective_date
        type: string
        source: input
        description: ISO date on which wind-down takes effect; set by the WIND_DOWN contract action, null otherwise

  - name: Program
    parent: Partnership
    common_fields: true
    fields:
      - name: partnership_id
        type: string
        source: input
        description: FK -> Partnership.id; the partnership that governs this program
      - name: program_name
        type: string
        source: input
        description: marketed name of the online program
      - name: cip_code
        type: string
        source: input
        description: CIP code of the academic discipline, format NN.NNNN
      - name: delivery_modality
        type: enum
        source: input
        description: how instruction is delivered; feeds the demand-score modality factor
        constraints: "ASYNCHRONOUS | SYNCHRONOUS | HYBRID"
      - name: credential_level
        type: enum
        source: input
        description: credential awarded on completion
        constraints: "CERTIFICATE | BACHELORS | MASTERS | DOCTORATE"
      - name: tuition_per_credit_cents
        type: integer
        source: input
        description: list tuition per credit hour at the time of enrollment
      - name: credits_to_complete
        type: integer
        source: input
        description: total credits required for the credential
      - name: enrollment_cap
        type: integer
        source: input
        description: maximum number of Enrollments in status ENROLLED, ACTIVE or COMPLETED allowed for this program
      - name: projected_annual_enrollments
        type: integer
        source: input
        description: partner's projected annual new enrollments, a demand-score input
      - name: competitor_program_count
        type: integer
        source: input
        description: number of competing online programs in the same CIP code, a demand-score input
      - name: regional_wage_premium_pct
        type: number
        source: input
        description: percentage wage premium for credential holders in the region, a demand-score input
      - name: employer_partner_count
        type: integer
        source: input
        description: number of committed employer partners, a demand-score input
      - name: prior_year_inquiry_volume
        type: integer
        source: input
        description: observed prior-year inquiry volume for the discipline, used only by the CONFIRMED demand variant
      - name: launch_window_start
        type: string
        source: input
        description: ISO date on or after which the program may be launched
      - name: launch_window_end
        type: string
        source: input
        description: ISO date before which the program must be launched; the launch window is the half-open interval [launch_window_start, launch_window_end)
      - name: required_service_domains
        type: array
        source: input
        description: service domains that must each carry a ServiceScopeAssignment before the program may be approved
        default: ["MARKETING", "LEAD_GENERATION", "ENROLLMENT_COUNSELING", "COURSE_DESIGN", "STUDENT_ADVISING", "ACCESSIBILITY_ACCOMMODATIONS"]
      - name: demand_score_screening
        type: number
        source: computed
        description: SCREENING variant of calculations.program_demand_score, recomputed on create and on every REQUEST_REVISION/SUBMIT cycle
      - name: demand_score_confirmed
        type: number
        source: computed
        description: CONFIRMED variant of calculations.program_demand_score, recomputed at APPROVE evaluation time
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines.Program
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | LAUNCHED | SUSPENDED | TEACH_OUT | CLOSED | REJECTED"
      - name: revision_round
        type: integer
        source: computed
        description: number of completed REQUEST_REVISION loops on this program
        default: 0
      - name: active_enrollment_count
        type: integer
        source: computed
        description: count of Enrollments of this Program in status ENROLLED or ACTIVE
        default: 0
      - name: total_enrollment_count
        type: integer
        source: computed
        description: count of Enrollments of this Program in status ENROLLED, ACTIVE or COMPLETED; compared against enrollment_cap
        default: 0
      - name: marketing_spend_net_cents
        type: integer
        source: computed
        description: sum of MarketingSpendEntry.amount_cents with entry_type == SPEND minus sum with entry_type == CREDIT_MEMO for this Program
        default: 0
      - name: blended_cac_cents
        type: integer
        source: computed
        description: marketing_spend_net_cents divided by total_enrollment_count, round_half_up to whole cents; null when total_enrollment_count == 0
      - name: recognized_revenue_cents
        type: integer
        source: computed
        description: cumulative recognized revenue across all Enrollments of this Program
        default: 0
      - name: launched_at
        type: datetime
        source: system
        description: logical-clock instant at which the Program entered LAUNCHED; null before that
      - name: teach_out_started_at
        type: datetime
        source: system
        description: logical-clock instant at which the Program entered TEACH_OUT; null otherwise
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant at which the Program entered CLOSED; null otherwise

  - name: Course
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program this course belongs to
      - name: prerequisite_course_id
        type: string
        source: input
        description: FK -> Course.id; self-referential prerequisite edge, null when the course has no prerequisite
      - name: course_code
        type: string
        source: input
        description: catalog code, unique within the Program
      - name: title
        type: string
        source: input
        description: course title
      - name: credits
        type: integer
        source: input
        description: credit hours awarded
      - name: required_for_launch
        type: boolean
        source: input
        description: whether this course must reach APPROVED before the Program may launch
        default: true
      - name: content_owner
        type: enum
        source: input
        description: which party owns the academic content copyright
        constraints: "UNIVERSITY | PARTNER | JOINT"
      - name: ip_license_grant_back
        type: boolean
        source: input
        description: whether the university receives a perpetual grant-back licence when content_owner is PARTNER or JOINT
        default: false
      - name: design_cost_cents
        type: integer
        source: input
        description: one-time course design cost borne by the partner
      - name: design_status
        type: enum
        source: system
        description: design lifecycle state; see state_machines.Course
        default: NOT_STARTED
        constraints: "NOT_STARTED | IN_DESIGN | FACULTY_REVIEW | APPROVED | DESIGN_SUSPENDED | RETIRED"
      - name: faculty_approver_name
        type: string
        source: input
        description: name of the faculty member of record who approved the content; null until APPROVED
      - name: revision_round
        type: integer
        source: computed
        description: number of completed FACULTY_REVIEW -> IN_DESIGN revision loops
        default: 0

  - name: ServiceScopeAssignment
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program whose support-services scope this row splits
      - name: service_domain
        type: enum
        source: input
        description: the student-support or operations domain being assigned; unique per Program
        constraints: "MARKETING | LEAD_GENERATION | ENROLLMENT_COUNSELING | COURSE_DESIGN | FACULTY_TRAINING | TECH_PLATFORM | STUDENT_ADVISING | TUTORING | RETENTION_OUTREACH | CAREER_SERVICES | ACCESSIBILITY_ACCOMMODATIONS | FIELD_PLACEMENT"
      - name: responsible_party
        type: enum
        source: input
        description: which organisation performs the domain
        constraints: "UNIVERSITY | PARTNER"
      - name: sla_response_hours
        type: integer
        source: input
        description: contractual first-response SLA in hours for this domain
        default: 24
      - name: cost_bearer
        type: enum
        source: input
        description: which organisation bears the cost of the domain
        default: PARTNER
        constraints: "UNIVERSITY | PARTNER"

  - name: EnrollmentCounselor
    parent: Partnership
    common_fields: true
    fields:
      - name: partnership_id
        type: string
        source: input
        description: FK -> Partnership.id; the partnership that employs or contracts this counselor
      - name: full_name
        type: string
        source: input
        description: counselor name
      - name: employer
        type: enum
        source: input
        description: which organisation employs the counselor
        constraints: "UNIVERSITY | PARTNER"
      - name: monthly_base_salary_cents
        type: integer
        source: input
        description: monthly base salary at onboarding, before any compensation plan is filed
      - name: comp_plan_type
        type: enum
        source: system
        description: compensation-plan shape currently on file; set by the compensation-plan endpoint
        default: NONE_ON_FILE
        constraints: "NONE_ON_FILE | FIXED_SALARY | SALARY_PLUS_QUALITATIVE | GRADUATION_MILESTONE"
      - name: annual_base_cents
        type: integer
        source: input
        description: annual base compensation declared on the filed plan; 0 until a plan is filed
        default: 0
      - name: variable_component_cents
        type: integer
        source: input
        description: annual variable compensation declared on the filed plan; the clawback base
        default: 0
      - name: variable_basis
        type: enum
        source: input
        description: what the variable component is measured against on the filed plan
        default: NONE
        constraints: "NONE | QUALITATIVE_MULTI_FACTOR | GRADUATION_COUNT"
      - name: performance_status
        type: enum
        source: system
        description: performance dimension of the counselor's parallel state; see state_machines.EnrollmentCounselor
        default: NOT_RATED
        constraints: "NOT_RATED | MEETS_STANDARD | WATCH | PROBATION | INACTIVE_PENDING_REVIEW"
      - name: incentive_eligibility
        type: enum
        source: system
        description: incentive-compliance dimension of the counselor's parallel state; evolves independently of performance_status
        default: PENDING_COMPLIANCE_REVIEW
        constraints: "PENDING_COMPLIANCE_REVIEW | ELIGIBLE | SUSPENDED | PROHIBITED_PLAN_ON_FILE"
      - name: conversion_rate
        type: number
        source: computed
        description: enrolled_lead_count divided by rated_lead_count, 4 decimal places, round_half_up; 0.0000 when rated_lead_count == 0
        default: 0.0
      - name: open_pipeline_count
        type: integer
        source: computed
        description: count of this counselor's Leads in status NEW, CONTACTED or APPLIED
        default: 0
      - name: rated_lead_count
        type: integer
        source: computed
        description: count of this counselor's Leads in status CONTACTED, APPLIED, ENROLLED or DISQUALIFIED whose created_at falls inside the last performance-run window
        default: 0
      - name: enrolled_lead_count
        type: integer
        source: computed
        description: count of this counselor's Leads in status ENROLLED whose created_at falls inside the last performance-run window
        default: 0
      - name: sla_breach_count
        type: integer
        source: computed
        description: count of this counselor's Leads whose hours_to_first_contact exceeds the ENROLLMENT_COUNSELING ServiceScopeAssignment.sla_response_hours of the lead's Program, within the last performance-run window
        default: 0
      - name: clawback_pending_cents
        type: integer
        source: computed
        description: accrued clawback against the counselor's variable component from withdrawals inside the clawback window
        default: 0
      - name: last_review_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceAuditor who last decided this counselor's compliance review; null before the first review

  - name: Lead
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program the prospect inquired about
      - name: counselor_id
        type: string
        source: input
        description: FK -> EnrollmentCounselor.id; the counselor who owns the lead
      - name: source_channel
        type: enum
        source: input
        description: acquisition channel that produced the lead
        constraints: "PAID_SEARCH | PAID_SOCIAL | ORGANIC | EMPLOYER_REFERRAL | LIST_PURCHASE"
      - name: prospect_external_id
        type: string
        source: input
        description: partner-side prospect identifier, unique within the Program
      - name: status
        type: enum
        source: system
        description: lead lifecycle state; see state_machines.Lead
        default: NEW
        constraints: "NEW | CONTACTED | APPLIED | ENROLLED | DISQUALIFIED"
      - name: hours_to_first_contact
        type: integer
        source: input
        description: hours between lead creation and first counselor contact; null until CONTACTED
      - name: qualified_at
        type: datetime
        source: system
        description: logical-clock instant at which the lead reached APPLIED; null otherwise
      - name: disqualification_reason
        type: enum
        source: input
        description: why the lead was disqualified; null unless status == DISQUALIFIED
        constraints: "NOT_QUALIFIED | UNREACHABLE | WITHDREW_INTEREST | PROGRAM_TEACH_OUT"

  - name: Enrollment
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program the student enrolled in
      - name: lead_id
        type: string
        source: input
        description: FK -> Lead.id; the lead that converted into this enrollment
      - name: student_external_id
        type: string
        source: input
        description: university student identifier; also the secondary line-order tie-break key in calculations.partner_share_gross
      - name: credits_enrolled
        type: integer
        source: input
        description: credits the student registered for in this term
      - name: credits_completed
        type: integer
        source: input
        description: credits recorded complete so far; drives MILESTONE_CHRONOLOGICAL recognition
        default: 0
      - name: tuition_per_credit_snapshot_cents
        type: integer
        source: computed
        description: Program.tuition_per_credit_cents copied at enrollment time so later list-price changes do not restate revenue
      - name: tuition_charged_cents
        type: integer
        source: computed
        description: credits_enrolled multiplied by tuition_per_credit_snapshot_cents
      - name: term_start_date
        type: string
        source: input
        description: ISO date on which the term begins; the straight-line recognition start
      - name: term_end_date
        type: string
        source: input
        description: ISO date on which the term ends; the straight-line recognition end
      - name: status
        type: enum
        source: system
        description: enrollment lifecycle state; see state_machines.Enrollment
        default: ENROLLED
        constraints: "ENROLLED | ACTIVE | COMPLETED | WITHDRAWN"
      - name: collected_cents
        type: integer
        source: computed
        description: sum of this enrollment's TuitionPayment.amount_cents with entry_type == PAYMENT
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: sum of this enrollment's TuitionPayment.amount_cents with entry_type == REFUND
        default: 0
      - name: recognized_to_date_cents
        type: integer
        source: computed
        description: cumulative recognized revenue for this enrollment across all CALCULATED-or-later statements
        default: 0
      - name: withdrawal_date
        type: string
        source: input
        description: ISO date of withdrawal; null unless status == WITHDRAWN
      - name: refund_pct_applied
        type: number
        source: computed
        description: refund percentage selected from Partnership.refund_schedule at withdrawal; null unless status == WITHDRAWN
      - name: days_elapsed_at_withdrawal
        type: integer
        source: computed
        description: whole days from term_start_date to withdrawal_date inclusive of the first day; null unless status == WITHDRAWN

  - name: TuitionPayment
    parent: Enrollment
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; the enrollment this cash entry belongs to
      - name: entry_type
        type: enum
        source: input
        description: direction of the cash entry
        constraints: "PAYMENT | REFUND"
      - name: amount_cents
        type: integer
        source: input
        description: positive magnitude of the entry; direction is carried by entry_type
      - name: posted_date
        type: string
        source: input
        description: ISO date the entry posts to the bursar ledger
      - name: reference_note
        type: string
        source: input
        description: free-text bursar reference
      - name: generated_by
        type: enum
        source: system
        description: what produced the entry
        default: BURSAR_POST
        constraints: "BURSAR_POST | WITHDRAWAL_REFUND"

  - name: MarketingSpendEntry
    parent: Program
    common_fields: false
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program the marketing spend is attributed to
      - name: entry_type
        type: enum
        source: input
        description: direction of the marketing ledger entry
        constraints: "SPEND | CREDIT_MEMO"
      - name: channel
        type: enum
        source: input
        description: media channel the spend was placed in
        constraints: "PAID_SEARCH | PAID_SOCIAL | DISPLAY | EVENTS | LIST_PURCHASE"
      - name: amount_cents
        type: integer
        source: input
        description: positive magnitude of the entry; direction is carried by entry_type
      - name: spend_date
        type: string
        source: input
        description: ISO date the spend or credit memo is recognised in the marketing ledger
      - name: reversal_note
        type: string
        source: input
        description: free-text explanation; required on CREDIT_MEMO entries

  - name: RemittanceStatement
    parent: Partnership
    common_fields: true
    fields:
      - name: partnership_id
        type: string
        source: input
        description: FK -> Partnership.id; the partnership being settled
      - name: period_start
        type: string
        source: input
        description: ISO date of the first day of the settlement period
      - name: period_end
        type: string
        source: input
        description: ISO date of the last day of the settlement period; the period is the fully closed interval [period_start, period_end]
      - name: status
        type: enum
        source: system
        description: settlement lifecycle state; see state_machines.RemittanceStatement
        default: CALCULATED
        constraints: "CALCULATED | UNIVERSITY_APPROVED | DISPUTED | RESOLVED_ADJUSTED | STALE | REMITTED"
      - name: recognition_method_applied
        type: enum
        source: computed
        description: which recognition variant produced recognized_revenue_cents on this statement
        constraints: "PERIOD_STRAIGHT_LINE | MILESTONE_CHRONOLOGICAL"
      - name: recognized_revenue_cents
        type: integer
        source: computed
        description: revenue recognised in this period per calculations.recognized_tuition_revenue
      - name: share_gross_cents
        type: integer
        source: computed
        description: gross partner share per calculations.partner_share_gross; 0 under FEE_FOR_SERVICE
      - name: marketing_recoupment_cents
        type: integer
        source: computed
        description: marketing spend recouped from the partner share this period
      - name: subtotal_cents
        type: integer
        source: computed
        description: share_gross_cents minus marketing_recoupment_cents
      - name: holdback_pct
        type: number
        source: computed
        description: holdback rate applied to subtotal_cents, selected by the teach-out holdback threshold
      - name: holdback_cents
        type: integer
        source: computed
        description: subtotal_cents multiplied by holdback_pct, round_half_up
      - name: fee_for_service_cents
        type: integer
        source: computed
        description: flat monthly fee owed for this period; 0 under REVENUE_SHARE
      - name: net_payable_cents
        type: integer
        source: computed
        description: final amount remittable to the partner per calculations.net_remittance_payable
      - name: line_count
        type: integer
        source: computed
        description: number of per-enrollment recognition lines that entered the share computation
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the UniversityBursar who created the statement
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the UniversityProvost who approved the statement; null before approval
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who resolved a dispute; null unless a dispute was resolved
      - name: adjustment_delta_cents
        type: integer
        source: computed
        description: net_payable_cents after dispute resolution minus net_payable_cents before it; 0 when no dispute occurred
        default: 0
      - name: requires_recalculation
        type: boolean
        source: computed
        description: true when a late withdrawal invalidated this statement's period figures
        default: false
      - name: dispute_reason
        type: string
        source: input
        description: partner's stated reason for disputing; null unless the statement was disputed
      - name: remittance_reference
        type: string
        source: input
        description: payment reference recorded at REMIT; null before that
      - name: remitted_at
        type: datetime
        source: system
        description: logical-clock instant of REMIT; null before that

  - name: TeachOutPlan
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> Program.id; the program being taught out
      - name: teach_out_end_date
        type: string
        source: input
        description: ISO date by which all remaining students must be able to complete
      - name: student_notification_date
        type: string
        source: input
        description: ISO date on which affected students are notified
      - name: asset_transfer_scope
        type: enum
        source: input
        description: which partner-held assets transfer to the university at exit
        constraints: "NONE | COURSE_CONTENT_ONLY | COURSE_CONTENT_AND_LEAD_DATA | FULL_PLATFORM"
      - name: status
        type: enum
        source: system
        description: plan lifecycle state; see state_machines.TeachOutPlan
        default: DRAFT
        constraints: "DRAFT | CERTIFIED | SUPERSEDED"
      - name: affected_enrollment_count
        type: integer
        source: computed
        description: count of the program's Enrollments in status ENROLLED or ACTIVE at plan creation
      - name: remaining_credit_count
        type: integer
        source: computed
        description: sum over affected Enrollments of credits_enrolled minus credits_completed
      - name: teach_out_cost_cents
        type: integer
        source: computed
        description: remaining_credit_count multiplied by TEACH_OUT_COST_PER_CREDIT_CENTS
      - name: holdback_applied_cents
        type: integer
        source: computed
        description: portion of Partnership.holdback_balance_cents consumed by this plan, per the waterfall in calculations.teach_out_obligation_liability
      - name: partner_obligation_cents
        type: integer
        source: computed
        description: partner's cash obligation after the holdback pool is exhausted, capped by PARTNER_OBLIGATION_CAP_PCT
      - name: university_residual_cents
        type: integer
        source: computed
        description: teach-out cost the university absorbs after holdback and the capped partner obligation
      - name: transferred_asset_value_cents
        type: integer
        source: computed
        description: book value of assets transferring under asset_transfer_scope
      - name: partner_obligation_note
        type: string
        source: input
        description: free-text note on the partner's teach-out obligations
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceAuditor who certified the plan; null before certification
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant of certification; null before certification

state_machines:
  - entity: Partnership
    initial_state: DRAFT
    terminal_states: [CLOSED_OUT]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /partnerships/{id}/contract-actions with action == SUBMIT_FOR_REVIEW"
        actor: PartnerAccountLead
        preconditions:
          - "Partnership.status == DRAFT"
          - "Partnership.contract_structure == FEE_FOR_SERVICE implies Partnership.fee_schedule_monthly_cents > 0"
          - "Partnership.contract_structure == REVENUE_SHARE implies Partnership.fee_schedule_monthly_cents == 0"
        side_effects:
          - "recompute Partnership.expiry_date"
          - "increments Partnership.version by 1"
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /partnerships/{id}/contract-actions with action == REQUEST_CHANGES"
        actor: UniversityProvost
        preconditions:
          - "Partnership.status == UNDER_REVIEW"
        side_effects:
          - "Partnership.change_request_count += 1"
          - "increments Partnership.version by 1"
        note: "Cycle edge — DRAFT -> UNDER_REVIEW -> DRAFT may repeat any number of times; change_request_count records the loop count."
      - from: UNDER_REVIEW
        to: EXECUTED
        trigger: "POST /partnerships/{id}/contract-actions with action == EXECUTE"
        actor: UniversityProvost
        preconditions:
          - "Partnership.status == UNDER_REVIEW"
        side_effects:
          - "Partnership.executed_date = the executed_date supplied on the action, else the logical clock date"
          - "Partnership.marketing_budget_remaining_cents = Partnership.marketing_budget_cents"
          - "increments Partnership.version by 1"
      - from: EXECUTED
        to: WIND_DOWN
        trigger: "POST /partnerships/{id}/contract-actions with action == WIND_DOWN"
        actor: UniversityProvost
        preconditions:
          - "Partnership.status == EXECUTED"
          - "wind_down_effective_date is supplied and is >= the logical clock date"
        side_effects:
          - "Partnership.wind_down_effective_date = the supplied wind_down_effective_date"
          - "CASCADE A hop 1: every Program of this Partnership with status IN {LAUNCHED, SUSPENDED} transitions to TEACH_OUT, processed in Program.created_at ASC order; each sets Program.teach_out_started_at to the logical clock"
          - "CASCADE A hop 2 (caused by hop 1, not by this action): each Program entering TEACH_OUT transitions its own Leads with status IN {NEW, CONTACTED, APPLIED} to DISQUALIFIED with disqualification_reason = PROGRAM_TEACH_OUT, and its own Courses with design_status IN {IN_DESIGN, FACULTY_REVIEW} to DESIGN_SUSPENDED"
          - "CASCADE A hop 3 (caused by hop 2): every EnrollmentCounselor whose Leads were disqualified by hop 2 recomputes open_pipeline_count; any counselor whose recomputed open_pipeline_count == 0 transitions performance_status to INACTIVE_PENDING_REVIEW, leaving incentive_eligibility untouched"
          - "increments Partnership.version by 1"
      - from: WIND_DOWN
        to: CLOSED_OUT
        trigger: "POST /partnerships/{id}/contract-actions with action == CLOSE_OUT"
        actor: UniversityProvost
        preconditions:
          - "Partnership.status == WIND_DOWN"
          - "every Program of this Partnership has status IN {CLOSED, REJECTED, DRAFT}"
          - "no RemittanceStatement of this Partnership has status IN {CALCULATED, UNIVERSITY_APPROVED, DISPUTED, RESOLVED_ADJUSTED, STALE}"
        side_effects:
          - "increments Partnership.version by 1"

  - entity: Program
    initial_state: DRAFT
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /programs/{id}/lifecycle-actions with action == SUBMIT"
        actor: PartnerAccountLead
        preconditions:
          - "Program.status == DRAFT"
          - "the parent Partnership.status == EXECUTED"
          - "at least one Course exists for this Program"
          - "Program.demand_score_screening >= SUBMIT_MIN_SCORE"
        side_effects:
          - "recompute Program.demand_score_screening via calculations.program_demand_score variant SCREENING"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /programs/{id}/lifecycle-actions with action == REQUEST_REVISION"
        actor: UniversityProvost
        preconditions:
          - "Program.status == SUBMITTED"
        side_effects:
          - "Program.revision_round += 1"
        note: "Cycle edge with the next transition — SUBMITTED -> REVISION_REQUESTED -> SUBMITTED may repeat."
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /programs/{id}/lifecycle-actions with action == SUBMIT"
        actor: PartnerAccountLead
        preconditions:
          - "Program.status == REVISION_REQUESTED"
          - "Program.demand_score_screening >= SUBMIT_MIN_SCORE after applying any revised inputs supplied on the action"
        side_effects:
          - "Program.projected_annual_enrollments = revised_projected_annual_enrollments when supplied"
          - "Program.prior_year_inquiry_volume = revised_prior_year_inquiry_volume when supplied"
          - "recompute Program.demand_score_screening via calculations.program_demand_score variant SCREENING"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /programs/{id}/lifecycle-actions with action == APPROVE"
        actor: UniversityProvost
        preconditions:
          - "Program.status == SUBMITTED"
          - "every service_domain in Program.required_service_domains has a ServiceScopeAssignment for this Program"
          - "every Course of this Program with required_for_launch == true has design_status == APPROVED"
          - "Program.demand_score_confirmed >= APPROVAL_MIN_SCORE"
        side_effects:
          - "recompute Program.demand_score_confirmed via calculations.program_demand_score variant CONFIRMED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /programs/{id}/lifecycle-actions with action == REJECT"
        actor: UniversityProvost
        preconditions:
          - "Program.status == SUBMITTED"
        side_effects:
          - "no further transitions are possible from REJECTED"
      - from: APPROVED
        to: LAUNCHED
        trigger: "POST /programs/{id}/lifecycle-actions with action == LAUNCH"
        actor: PartnerAccountLead
        preconditions:
          - "Program.status == APPROVED"
          - "the parent Partnership.status == EXECUTED"
          - "the logical clock date is >= Program.launch_window_start and < Program.launch_window_end"
          - "the logical clock date is <= the parent Partnership.expiry_date"
          - "no other Program with status IN {LAUNCHED, SUSPENDED, TEACH_OUT} under a Partnership sharing this Partnership.university_ipeds_id has the same cip_code with a launch window overlapping this Program's half-open [launch_window_start, launch_window_end), when the cip_code appears in either Partnership.exclusivity_cip_codes"
        side_effects:
          - "Program.launched_at = the logical clock instant"
      - from: LAUNCHED
        to: SUSPENDED
        trigger: "POST /programs/{id}/lifecycle-actions with action == SUSPEND"
        actor: UniversityProvost
        preconditions:
          - "Program.status == LAUNCHED"
        side_effects:
          - "no new Lead may be created for this Program while SUSPENDED"
      - from: SUSPENDED
        to: LAUNCHED
        trigger: "POST /programs/{id}/lifecycle-actions with action == RESUME"
        actor: UniversityProvost
        preconditions:
          - "Program.status == SUSPENDED"
          - "the parent Partnership.status == EXECUTED"
        side_effects:
          - "Lead creation is permitted again for this Program"
        note: "Cycle edge — LAUNCHED -> SUSPENDED -> LAUNCHED may repeat."
      - from: LAUNCHED
        to: TEACH_OUT
        trigger: "POST /programs/{id}/lifecycle-actions with action == BEGIN_TEACH_OUT"
        actor: UniversityProvost
        preconditions:
          - "Program.status == LAUNCHED"
        side_effects:
          - "Program.teach_out_started_at = the logical clock instant"
          - "this Program's Leads with status IN {NEW, CONTACTED, APPLIED} transition to DISQUALIFIED with disqualification_reason = PROGRAM_TEACH_OUT"
          - "this Program's Courses with design_status IN {IN_DESIGN, FACULTY_REVIEW} transition to DESIGN_SUSPENDED"
          - "every EnrollmentCounselor whose Leads were disqualified recomputes open_pipeline_count; a counselor reaching open_pipeline_count == 0 transitions performance_status to INACTIVE_PENDING_REVIEW"
      - from: SUSPENDED
        to: TEACH_OUT
        trigger: "POST /programs/{id}/lifecycle-actions with action == BEGIN_TEACH_OUT"
        actor: UniversityProvost
        preconditions:
          - "Program.status == SUSPENDED"
        side_effects:
          - "Program.teach_out_started_at = the logical clock instant"
          - "same Lead, Course and counselor cascade as the LAUNCHED -> TEACH_OUT edge"
      - from: TEACH_OUT
        to: CLOSED
        trigger: "POST /programs/{id}/lifecycle-actions with action == CLOSE"
        actor: UniversityProvost
        preconditions:
          - "Program.status == TEACH_OUT"
          - "a TeachOutPlan for this Program exists with status == CERTIFIED"
          - "Program.active_enrollment_count == 0"
        side_effects:
          - "Program.closed_at = the logical clock instant"

  - entity: Course
    initial_state: NOT_STARTED
    terminal_states: [RETIRED, DESIGN_SUSPENDED]
    transitions:
      - from: NOT_STARTED
        to: IN_DESIGN
        trigger: "POST /courses/{id}/design-actions with action == START_DESIGN"
        actor: PartnerAccountLead
        preconditions:
          - "Course.design_status == NOT_STARTED"
          - "the parent Program.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, LAUNCHED}"
        side_effects: []
      - from: IN_DESIGN
        to: FACULTY_REVIEW
        trigger: "POST /courses/{id}/design-actions with action == SUBMIT_FOR_FACULTY_REVIEW"
        actor: PartnerAccountLead
        preconditions:
          - "Course.design_status == IN_DESIGN"
          - "Course.prerequisite_course_id is null OR the prerequisite Course.design_status IN {FACULTY_REVIEW, APPROVED}"
        side_effects: []
      - from: FACULTY_REVIEW
        to: IN_DESIGN
        trigger: "POST /courses/{id}/design-actions with action == REQUEST_REVISION"
        actor: FacultyChair
        preconditions:
          - "Course.design_status == FACULTY_REVIEW"
        side_effects:
          - "Course.revision_round += 1"
        note: "Cycle edge — IN_DESIGN -> FACULTY_REVIEW -> IN_DESIGN may repeat."
      - from: FACULTY_REVIEW
        to: APPROVED
        trigger: "POST /courses/{id}/design-actions with action == APPROVE"
        actor: FacultyChair
        preconditions:
          - "Course.design_status == FACULTY_REVIEW"
          - "faculty_approver_name is supplied on the action"
          - "Course.content_owner == UNIVERSITY OR Course.ip_license_grant_back == true"
        side_effects:
          - "Course.faculty_approver_name = the supplied faculty_approver_name"
      - from: APPROVED
        to: RETIRED
        trigger: "POST /courses/{id}/design-actions with action == RETIRE"
        actor: FacultyChair
        preconditions:
          - "Course.design_status == APPROVED"
          - "no other Course of this Program has prerequisite_course_id == this Course.id with design_status IN {NOT_STARTED, IN_DESIGN, FACULTY_REVIEW}"
        side_effects: []
      - from: IN_DESIGN
        to: DESIGN_SUSPENDED
        trigger: "system event: the parent Program enters TEACH_OUT (Cascade A hop 2 or the BEGIN_TEACH_OUT edge)"
        actor: system
        preconditions:
          - "Course.design_status == IN_DESIGN"
        side_effects: []
      - from: FACULTY_REVIEW
        to: DESIGN_SUSPENDED
        trigger: "system event: the parent Program enters TEACH_OUT (Cascade A hop 2 or the BEGIN_TEACH_OUT edge)"
        actor: system
        preconditions:
          - "Course.design_status == FACULTY_REVIEW"
        side_effects: []

  - entity: EnrollmentCounselor
    initial_state: NOT_RATED
    terminal_states: []
    note: |
      Parallel state dimensions on one row: the performance dimension
      (performance_status: NOT_RATED / MEETS_STANDARD / WATCH / PROBATION /
      INACTIVE_PENDING_REVIEW) and the incentive-compliance dimension
      (incentive_eligibility: PENDING_COMPLIANCE_REVIEW / ELIGIBLE / SUSPENDED /
      PROHIBITED_PLAN_ON_FILE) advance independently. initial_state names the
      performance dimension; the incentive dimension starts at
      PENDING_COMPLIANCE_REVIEW. No transition on either dimension reads or
      writes the other.
    transitions:
      - from: "performance:NOT_RATED"
        to: "performance:MEETS_STANDARD|WATCH|PROBATION"
        trigger: "POST /partnerships/{id}/counselor-performance-runs"
        actor: PartnerAccountLead
        preconditions:
          - "EnrollmentCounselor.performance_status != INACTIVE_PENDING_REVIEW"
          - "EnrollmentCounselor.rated_lead_count >= MIN_RATED_PIPELINE after the window recompute"
        side_effects:
          - "recompute rated_lead_count, enrolled_lead_count, sla_breach_count and conversion_rate over the run window"
          - "assign performance_status per calculations.counselor_conversion_performance; incentive_eligibility is not read or written"
      - from: "performance:MEETS_STANDARD"
        to: "performance:WATCH|PROBATION"
        trigger: "POST /partnerships/{id}/counselor-performance-runs"
        actor: PartnerAccountLead
        preconditions:
          - "EnrollmentCounselor.performance_status == MEETS_STANDARD"
          - "EnrollmentCounselor.rated_lead_count >= MIN_RATED_PIPELINE after the window recompute"
        side_effects:
          - "assign performance_status per calculations.counselor_conversion_performance, including the SLA-breach one-step downgrade"
      - from: "performance:WATCH|PROBATION"
        to: "performance:MEETS_STANDARD"
        trigger: "POST /partnerships/{id}/counselor-performance-runs"
        actor: PartnerAccountLead
        preconditions:
          - "EnrollmentCounselor.performance_status IN {WATCH, PROBATION}"
          - "EnrollmentCounselor.rated_lead_count >= MIN_RATED_PIPELINE after the window recompute"
        side_effects:
          - "assign performance_status per calculations.counselor_conversion_performance"
        note: "Cycle edge on the performance dimension — a counselor may recover to MEETS_STANDARD and be downgraded again on a later run."
      - from: "performance:NOT_RATED|MEETS_STANDARD|WATCH|PROBATION"
        to: "performance:INACTIVE_PENDING_REVIEW"
        trigger: "system event: Cascade A hop 3 or the Program BEGIN_TEACH_OUT cascade drives open_pipeline_count to 0"
        actor: system
        preconditions:
          - "EnrollmentCounselor.open_pipeline_count == 0 after the cascade recompute"
        side_effects:
          - "incentive_eligibility is left unchanged, demonstrating dimension independence"
      - from: "incentive:PENDING_COMPLIANCE_REVIEW"
        to: "incentive:ELIGIBLE"
        trigger: "POST /enrollment-counselors/{id}/compliance-review with decision == APPROVE"
        actor: ComplianceAuditor
        preconditions:
          - "EnrollmentCounselor.incentive_eligibility == PENDING_COMPLIANCE_REVIEW"
          - "EnrollmentCounselor.comp_plan_type != NONE_ON_FILE"
          - "the acting X-User-ID differs from EnrollmentCounselor.last_review_user_id when a prior review exists"
        side_effects:
          - "EnrollmentCounselor.last_review_user_id = the acting X-User-ID"
      - from: "incentive:PENDING_COMPLIANCE_REVIEW"
        to: "incentive:PROHIBITED_PLAN_ON_FILE"
        trigger: "POST /enrollment-counselors/{id}/compliance-review with decision == REJECT_PLAN"
        actor: ComplianceAuditor
        preconditions:
          - "EnrollmentCounselor.incentive_eligibility == PENDING_COMPLIANCE_REVIEW"
        side_effects:
          - "EnrollmentCounselor.last_review_user_id = the acting X-User-ID"
          - "no Lead may be created with this counselor_id while incentive_eligibility == PROHIBITED_PLAN_ON_FILE"
      - from: "incentive:PENDING_COMPLIANCE_REVIEW|ELIGIBLE"
        to: "incentive:SUSPENDED"
        trigger: "POST /enrollment-counselors/{id}/compliance-review with decision == SUSPEND"
        actor: ComplianceAuditor
        preconditions:
          - "EnrollmentCounselor.incentive_eligibility IN {PENDING_COMPLIANCE_REVIEW, ELIGIBLE}"
        side_effects:
          - "EnrollmentCounselor.last_review_user_id = the acting X-User-ID"
      - from: "incentive:ELIGIBLE"
        to: "incentive:SUSPENDED"
        trigger: "system event: Cascade B hop 3 — clawback_pending_cents reaches CLAWBACK_SUSPENSION_TRIGGER_CENTS"
        actor: system
        preconditions:
          - "EnrollmentCounselor.incentive_eligibility == ELIGIBLE"
          - "EnrollmentCounselor.clawback_pending_cents >= CLAWBACK_SUSPENSION_TRIGGER_CENTS after the accrual"
        side_effects:
          - "performance_status is left unchanged"
      - from: "incentive:ELIGIBLE|SUSPENDED|PROHIBITED_PLAN_ON_FILE"
        to: "incentive:PENDING_COMPLIANCE_REVIEW"
        trigger: "POST /enrollment-counselors/{id}/compensation-plan"
        actor: PartnerAccountLead
        preconditions:
          - "the parent Partnership.status == EXECUTED"
        side_effects:
          - "comp_plan_type, annual_base_cents, variable_component_cents and variable_basis are replaced by the filed plan"
          - "incentive_eligibility resets to PENDING_COMPLIANCE_REVIEW"
        note: "Cycle edge on the incentive dimension — filing a new plan returns the counselor to review."

  - entity: Lead
    initial_state: NEW
    terminal_states: [ENROLLED, DISQUALIFIED]
    transitions:
      - from: NEW
        to: CONTACTED
        trigger: "POST /leads/{id}/advance with action == CONTACT"
        actor: PartnerAccountLead
        preconditions:
          - "Lead.status == NEW"
          - "hours_to_first_contact is supplied"
        side_effects:
          - "Lead.hours_to_first_contact = the supplied value"
      - from: CONTACTED
        to: APPLIED
        trigger: "POST /leads/{id}/advance with action == APPLY"
        actor: PartnerAccountLead
        preconditions:
          - "Lead.status == CONTACTED"
          - "the Lead's Program.status == LAUNCHED"
        side_effects:
          - "Lead.qualified_at = the logical clock instant"
      - from: APPLIED
        to: ENROLLED
        trigger: "POST /leads/{id}/enroll"
        actor: UniversityBursar
        preconditions:
          - "Lead.status == APPLIED"
          - "the Lead's Program.status == LAUNCHED"
          - "the Lead's Program.total_enrollment_count < the Lead's Program.enrollment_cap"
          - "the Lead's EnrollmentCounselor.incentive_eligibility != PROHIBITED_PLAN_ON_FILE"
        side_effects:
          - "an Enrollment is created in status ENROLLED with tuition_per_credit_snapshot_cents and tuition_charged_cents computed"
          - "Program.active_enrollment_count += 1 and Program.total_enrollment_count += 1"
          - "recompute Program.blended_cac_cents"
          - "recompute EnrollmentCounselor.open_pipeline_count"
      - from: "NEW|CONTACTED|APPLIED"
        to: DISQUALIFIED
        trigger: "POST /leads/{id}/advance with action == DISQUALIFY, or system event: the Program enters TEACH_OUT"
        actor: PartnerAccountLead
        preconditions:
          - "Lead.status IN {NEW, CONTACTED, APPLIED}"
          - "disqualification_reason is supplied on the manual action; the cascade supplies PROGRAM_TEACH_OUT"
        side_effects:
          - "Lead.disqualification_reason is set"
          - "recompute EnrollmentCounselor.open_pipeline_count"

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "system event: the first TuitionPayment with entry_type == PAYMENT posts to this Enrollment"
        actor: system
        preconditions:
          - "Enrollment.status == ENROLLED"
          - "Enrollment.collected_cents > 0 after the posting"
        side_effects:
          - "recompute Enrollment.collected_cents"
          - "recompute Partnership.collected_tuition_cents (invariant INV-1)"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /enrollments/{id}/academic-actions with action == RECORD_PROGRESS"
        actor: UniversityProvost
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "0 <= credits_completed <= Enrollment.credits_enrolled"
        side_effects:
          - "Enrollment.credits_completed = the supplied credits_completed"
        note: "Self-loop — progress may be recorded repeatedly; it changes the MILESTONE_CHRONOLOGICAL recognition base without changing status."
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /enrollments/{id}/academic-actions with action == COMPLETE"
        actor: UniversityProvost
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "Enrollment.credits_completed == Enrollment.credits_enrolled"
        side_effects:
          - "Program.active_enrollment_count -= 1"
      - from: "ENROLLED|ACTIVE"
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/academic-actions with action == WITHDRAW"
        actor: UniversityBursar
        preconditions:
          - "Enrollment.status IN {ENROLLED, ACTIVE}"
          - "withdrawal_date is supplied and is >= Enrollment.term_start_date"
        side_effects:
          - "Enrollment.withdrawal_date, days_elapsed_at_withdrawal and refund_pct_applied are set per calculations.withdrawal_refund_and_clawback"
          - "CASCADE B hop 1: a TuitionPayment with entry_type == REFUND and generated_by == WITHDRAWAL_REFUND is created for the computed refund amount; Enrollment.refunded_cents, Program.active_enrollment_count and Partnership.collected_tuition_cents are recomputed"
          - "CASCADE B hop 2 (caused by hop 1's refund entry, not by the WITHDRAW action itself): the owning EnrollmentCounselor accrues clawback_pending_cents += round_half_up(variable_component_cents * Enrollment.refund_pct_applied) when the withdrawal falls inside CLAWBACK_WINDOW_DAYS of term_start_date"
          - "CASCADE B hop 3 (caused by hop 2's accrual): a counselor whose clawback_pending_cents has reached CLAWBACK_SUSPENSION_TRIGGER_CENTS and whose incentive_eligibility == ELIGIBLE transitions incentive_eligibility to SUSPENDED"
          - "every RemittanceStatement of the Partnership with status IN {CALCULATED, UNIVERSITY_APPROVED} whose closed period [period_start, period_end] contains Enrollment.term_start_date transitions to STALE with requires_recalculation = true"

  - entity: RemittanceStatement
    initial_state: CALCULATED
    terminal_states: [REMITTED]
    note: |
      Branching fork-join: from CALCULATED the statement forks into an APPROVE
      branch (straight to UNIVERSITY_APPROVED, no figure change) or a DISPUTE
      branch (DISPUTED -> RESOLVED_ADJUSTED, which recomputes figures and pins
      adjustment_delta_cents); both branches join at UNIVERSITY_APPROVED before
      the single REMITTED exit. A separate STALE <-> CALCULATED cycle exists.
    transitions:
      - from: CALCULATED
        to: UNIVERSITY_APPROVED
        trigger: "POST /remittance-statements/{id}/actions with action == APPROVE"
        actor: UniversityProvost
        preconditions:
          - "RemittanceStatement.status == CALCULATED"
          - "RemittanceStatement.requires_recalculation == false"
          - "the acting X-User-ID != RemittanceStatement.authored_by_user_id"
        side_effects:
          - "RemittanceStatement.approved_by_user_id = the acting X-User-ID"
          - "RemittanceStatement.adjustment_delta_cents remains 0 on this branch"
      - from: CALCULATED
        to: DISPUTED
        trigger: "POST /remittance-statements/{id}/actions with action == DISPUTE"
        actor: PartnerAccountLead
        preconditions:
          - "RemittanceStatement.status == CALCULATED"
          - "dispute_reason is supplied"
        side_effects:
          - "RemittanceStatement.dispute_reason is set"
      - from: DISPUTED
        to: RESOLVED_ADJUSTED
        trigger: "POST /remittance-statements/{id}/actions with action == RESOLVE"
        actor: UniversityBursar
        preconditions:
          - "RemittanceStatement.status == DISPUTED"
        side_effects:
          - "recognition_method_applied = recognition_method_override when supplied, else unchanged"
          - "recognized_revenue_cents, share_gross_cents, marketing_recoupment_cents, subtotal_cents, holdback_pct, holdback_cents, fee_for_service_cents and net_payable_cents are recomputed"
          - "RemittanceStatement.adjustment_delta_cents = new net_payable_cents minus the pre-resolution net_payable_cents"
          - "RemittanceStatement.resolved_by_user_id = the acting X-User-ID"
      - from: RESOLVED_ADJUSTED
        to: UNIVERSITY_APPROVED
        trigger: "POST /remittance-statements/{id}/actions with action == APPROVE"
        actor: UniversityProvost
        preconditions:
          - "RemittanceStatement.status == RESOLVED_ADJUSTED"
          - "the acting X-User-ID != RemittanceStatement.authored_by_user_id"
        side_effects:
          - "RemittanceStatement.approved_by_user_id = the acting X-User-ID"
        note: "Join edge — both branches converge here."
      - from: UNIVERSITY_APPROVED
        to: REMITTED
        trigger: "POST /remittance-statements/{id}/actions with action == REMIT"
        actor: UniversityBursar
        preconditions:
          - "RemittanceStatement.status == UNIVERSITY_APPROVED"
          - "RemittanceStatement.net_payable_cents > 0"
          - "remittance_reference is supplied"
        side_effects:
          - "RemittanceStatement.remitted_at = the logical clock instant"
          - "Partnership.remitted_to_partner_cents += net_payable_cents"
          - "Partnership.holdback_balance_cents += holdback_cents"
          - "Partnership.unrecouped_marketing_spend_cents -= marketing_recoupment_cents"
      - from: "CALCULATED|UNIVERSITY_APPROVED"
        to: STALE
        trigger: "system event: an Enrollment whose term_start_date lies inside this statement's closed period [period_start, period_end] transitions to WITHDRAWN"
        actor: system
        preconditions:
          - "RemittanceStatement.status IN {CALCULATED, UNIVERSITY_APPROVED}"
        side_effects:
          - "RemittanceStatement.requires_recalculation = true"
      - from: STALE
        to: CALCULATED
        trigger: "POST /remittance-statements/{id}/actions with action == RECALCULATE"
        actor: UniversityBursar
        preconditions:
          - "RemittanceStatement.status == STALE"
        side_effects:
          - "all computed money fields are recomputed against current data"
          - "RemittanceStatement.requires_recalculation = false"
          - "RemittanceStatement.approved_by_user_id = null"
        note: "Cycle edge — CALCULATED -> STALE -> CALCULATED may repeat as later withdrawals land."

  - entity: TeachOutPlan
    initial_state: DRAFT
    terminal_states: [CERTIFIED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /teach-out-plans/{id}/certify"
        actor: ComplianceAuditor
        preconditions:
          - "TeachOutPlan.status == DRAFT"
          - "the parent Program.status == TEACH_OUT"
          - "asset_transfer_confirmed == true on the request"
          - "TeachOutPlan.student_notification_date is at least TEACH_OUT_NOTICE_MIN_DAYS before TeachOutPlan.teach_out_end_date"
        side_effects:
          - "holdback_applied_cents, partner_obligation_cents, university_residual_cents and transferred_asset_value_cents are computed per calculations.teach_out_obligation_liability"
          - "Partnership.holdback_balance_cents -= holdback_applied_cents"
          - "TeachOutPlan.certified_by_user_id = the acting X-User-ID and certified_at = the logical clock instant"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: a newer TeachOutPlan is created for the same Program"
        actor: system
        preconditions:
          - "TeachOutPlan.status == DRAFT"
        side_effects:
          - "no further transitions are possible from SUPERSEDED"

concurrency_rules:
  - rule_id: statement-create-stale-partnership
    parent_entity: Partnership
    write_endpoint: "POST /partnerships/{id}/remittance-statements"
    occ_field: "expected_partnership_version"
    description: |
      Creating a RemittanceStatement against a Partnership whose version has
      advanced since the client last read it is rejected. A statement legitimately
      supersedes the partner's prior view of period economics, so a second create
      carrying a stale expected_partnership_version cannot be distinguished from a
      correct one by state alone; the OCC check on Partnership.version is what
      makes the stale writer deterministically fail.
    error_id: ERR_STALE_PARTNERSHIP_VERSION
    http_status: 412
  - rule_id: terms-patch-stale-partnership
    parent_entity: Partnership
    write_endpoint: "PATCH /partnerships/{id}/terms"
    occ_field: "expected_partnership_version"
    description: |
      Amending contract terms against a stale view of the Partnership is rejected.
      Term amendments are legitimately repeatable — a second amendment observing
      the same status would itself succeed — so the OCC check on
      Partnership.version is the only deterministic guard against an amendment
      computed from superseded tiers, budget or recognition method.
    error_id: ERR_STALE_PARTNERSHIP_VERSION
    http_status: 412

calculations:
  - name: program_demand_score
    trigger: "on POST /programs (both variants), on Program SUBMIT and REVISION_REQUESTED -> SUBMITTED (SCREENING variant), and on Program SUBMITTED -> APPROVED evaluation (CONFIRMED variant)"
    algorithm: weighted_scoring
    formula: |
      # projection_effective depends on the variant (see variants:)
      enrollment_component  = min(projection_effective / PROJECTION_CAP, 1) * W_ENROLLMENT
      competition_component = max(0, 1 - Program.competitor_program_count / COMPETITOR_CAP) * W_COMPETITION
      wage_component        = min(Program.regional_wage_premium_pct / WAGE_PREMIUM_CAP, 1) * W_WAGE
      employer_component    = min(Program.employer_partner_count / EMPLOYER_CAP, 1) * W_EMPLOYER
      raw = enrollment_component + competition_component + wage_component + employer_component
      score = round_half_up(raw * MODALITY_FACTOR[Program.delivery_modality], 2)
      # gates:
      #   SUBMIT   requires Program.demand_score_screening >= SUBMIT_MIN_SCORE   (inclusive)
      #   APPROVE  requires Program.demand_score_confirmed >= APPROVAL_MIN_SCORE (inclusive)
    input_set: "a single Program row; no other entities participate. Both variants read the same five Program input fields; only projection_effective differs."
    constants:
      W_ENROLLMENT: 40
      W_COMPETITION: 25
      W_WAGE: 20
      W_EMPLOYER: 15
      PROJECTION_CAP: 400
      COMPETITOR_CAP: 30
      WAGE_PREMIUM_CAP: 20
      EMPLOYER_CAP: 15
      MODALITY_FACTOR: { ASYNCHRONOUS: 1.00, SYNCHRONOUS: 0.92, HYBRID: 0.96 }
      CONFIRMED_INQUIRY_YIELD: 0.10
      SUBMIT_MIN_SCORE: 45.00
      APPROVAL_MIN_SCORE: 62.00
    precision: "2 decimal places, round_half_up; the multiplication by MODALITY_FACTOR happens once on the summed raw score, never per component"
    variants:
      - name: SCREENING
        when: "on Program creation and on every SUBMIT transition, written to Program.demand_score_screening"
        difference: "projection_effective = Program.projected_annual_enrollments — the partner's own unverified projection is taken at face value"
      - name: CONFIRMED
        when: "at SUBMITTED -> APPROVED evaluation, written to Program.demand_score_confirmed"
        difference: "projection_effective = min(Program.projected_annual_enrollments, round_half_up(Program.prior_year_inquiry_volume * CONFIRMED_INQUIRY_YIELD)) — the projection is capped by observed inquiry volume converted at the yield constant, so identical Program data yields a lower score than SCREENING whenever the observed funnel cannot support the projection"

  - name: recognized_tuition_revenue
    trigger: "on POST /partnerships/{id}/remittance-statements, and on RemittanceStatement RESOLVE and RECALCULATE"
    algorithm: chronological
    formula: |
      # per recognition line, one line per in-scope Enrollment
      term_days = (Enrollment.term_end_date - Enrollment.term_start_date) in days + 1
      elapsed(d) = 0 when d < Enrollment.term_start_date,
                   else min((d - Enrollment.term_start_date) in days + 1, term_days)

      # PERIOD_STRAIGHT_LINE variant
      cum(d)      = round_half_up(Enrollment.tuition_charged_cents * elapsed(d) / term_days)
      line_amount = cum(RemittanceStatement.period_end) - cum(RemittanceStatement.period_start - 1 day)

      # MILESTONE_CHRONOLOGICAL variant
      cum_milestone = round_half_up(Enrollment.tuition_charged_cents
                                    * Enrollment.credits_completed / Enrollment.credits_enrolled)
      line_amount   = cum_milestone - Enrollment.recognized_to_date_cents

      recognized_revenue_cents = sum of line_amount over all lines
      RemittanceStatement.line_count = number of lines
      # RECOMPUTE SEMANTICS (RESOLVE / RECALCULATE): the statement's own previously
      # recorded line contributions are first removed from
      # Enrollment.recognized_to_date_cents and from
      # Partnership.contract_year_recognized_cents, so a recompute of the same period under
      # the other variant sees the same baseline the original computation saw. Without
      # this the MILESTONE_CHRONOLOGICAL recompute of an already-recognised period would
      # net against itself.
      # each line then feeds calculations.partner_share_gross in the pinned line order
    input_set: "Enrollments whose Program.partnership_id == this Partnership.id and whose status IS IN {ENROLLED, ACTIVE, COMPLETED, WITHDRAWN}, and whose term_start_date <= RemittanceStatement.period_end. Lines are ordered by Enrollment.created_at ASC, tie-broken by Enrollment.student_external_id ASC."
    constants: {}
    precision: "whole cents, round_half_up; the cumulative-minus-prior form is mandatory so that period lines never drift from the cumulative curve"
    variants:
      - name: PERIOD_STRAIGHT_LINE
        when: "RemittanceStatement.recognition_method_applied == PERIOD_STRAIGHT_LINE (inherited from Partnership.revenue_recognition_method, or forced by recognition_method_override at RESOLVE)"
        difference: "revenue accrues by elapsed calendar days of the term, so a 30-day slice of a 106-day term recognises 30/106 of tuition regardless of academic progress"
      - name: MILESTONE_CHRONOLOGICAL
        when: "RemittanceStatement.recognition_method_applied == MILESTONE_CHRONOLOGICAL"
        difference: "revenue accrues by credits_completed / credits_enrolled, so identical enrollment data produces a different period figure than PERIOD_STRAIGHT_LINE whenever academic progress and elapsed time disagree"

  - name: partner_share_gross
    trigger: "on POST /partnerships/{id}/remittance-statements, and on RemittanceStatement RESOLVE and RECALCULATE, immediately after calculations.recognized_tuition_revenue"
    algorithm: tiered_pricing
    formula: |
      running = Partnership.contract_year_recognized_cents   # cumulative before this statement
      share_gross_cents = 0
      for each line in the pinned line order of calculations.recognized_tuition_revenue:
          remaining = line.line_amount
          line_share = 0                                    # exact decimal accumulator
          for tier in Partnership.revenue_share_tiers (in declared order):
              room = tier.through_cents - running when tier.through_cents is not null else remaining
              if room <= 0: continue
              take = min(remaining, room)
              line_share = line_share + take * tier.partner_rate
              remaining = remaining - take
              running   = running + take
              if remaining == 0: break
          share_gross_cents = share_gross_cents + round_half_up(line_share)   # ROUND PER LINE, THEN SUM
      # PINNED ROUNDING ORDER: round_half_up is applied to each line's share and the
      # rounded integers are summed. Summing exact line shares and rounding once at the
      # end is FORBIDDEN — the two orders differ by whole cents (e.g. lines 187500 and
      # 62500 at rate 0.575 give 107813 + 35938 = 143751 per-line versus 143750
      # sum-then-round).
      # Under contract_structure == FEE_FOR_SERVICE, share_gross_cents = 0 and the loop is skipped.
    input_set: "the recognition lines produced by calculations.recognized_tuition_revenue for this statement, in Enrollment.created_at ASC order tie-broken by Enrollment.student_external_id ASC; tier position starts at Partnership.contract_year_recognized_cents and advances line by line so a line may straddle two marginal tiers"
    constants:
      DEFAULT_REVENUE_SHARE_TIERS: [{ through_cents: 25000000, partner_rate: 0.575 }, { through_cents: 75000000, partner_rate: 0.485 }, { through_cents: null, partner_rate: 0.395 }]
    precision: "whole cents, round_half_up, applied once per line before summation (see the pinned order above)"

  - name: net_remittance_payable
    trigger: "on POST /partnerships/{id}/remittance-statements, and on RemittanceStatement RESOLVE and RECALCULATE, immediately after calculations.partner_share_gross"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED — each step reads only the steps above it.
      # Step 1: recognized_revenue_cents      <- calculations.recognized_tuition_revenue
      # Step 2: share_gross_cents             <- calculations.partner_share_gross
      # Step 3: recoup_cap_cents               = floor(share_gross_cents * RECOUP_CAP_PCT)
      # Step 4: marketing_recoupment_cents     = min(Partnership.unrecouped_marketing_spend_cents,
      #                                             recoup_cap_cents)
      # Step 5: subtotal_cents                 = share_gross_cents - marketing_recoupment_cents
      # Step 6: holdback_pct                   = HOLDBACK_HIGH_PCT when subtotal_cents >= HOLDBACK_TRIGGER_CENTS
      #                                          else HOLDBACK_LOW_PCT
      #         holdback_cents                 = round_half_up(subtotal_cents * holdback_pct)
      # Step 7: fee_for_service_cents          = Partnership.fee_schedule_monthly_cents when
      #                                          Partnership.contract_structure == FEE_FOR_SERVICE else 0
      #         net_payable_cents              = subtotal_cents - holdback_cents + fee_for_service_cents
      #
      # The circular-looking dependency is resolved by this order: the recoupment cap is a
      # function of share_gross_cents (not of subtotal_cents), and the holdback tier is a
      # function of subtotal_cents (i.e. AFTER recoupment), so a larger recoupment can move the
      # statement into the lower holdback tier. Evaluating holdback before recoupment, or capping
      # recoupment on subtotal_cents, is FORBIDDEN.
      # Step 3 uses floor, NOT round_half_up — the cap never rounds up in the partner's favour.
    input_set: "one RemittanceStatement plus its parent Partnership's contract_structure, fee_schedule_monthly_cents and unrecouped_marketing_spend_cents as of the moment of computation"
    constants:
      RECOUP_CAP_PCT: 0.15
      HOLDBACK_TRIGGER_CENTS: 10000000
      HOLDBACK_HIGH_PCT: 0.10
      HOLDBACK_LOW_PCT: 0.05
    precision: "whole cents; floor at step 3, round_half_up at step 6, exact integer arithmetic elsewhere"

  - name: withdrawal_refund_and_clawback
    trigger: "on Enrollment ENROLLED|ACTIVE -> WITHDRAWN (POST /enrollments/{id}/academic-actions with action == WITHDRAW)"
    algorithm: threshold
    formula: |
      days_elapsed_at_withdrawal = (Enrollment.withdrawal_date - Enrollment.term_start_date) in days + 1
      refund_pct_applied = the refund_pct of the FIRST band of Partnership.refund_schedule
                           whose through_day is null OR through_day >= days_elapsed_at_withdrawal
      refund_amount_cents = min(Enrollment.collected_cents - Enrollment.refunded_cents,
                                round_half_up(Enrollment.tuition_charged_cents * refund_pct_applied))
      # clawback hop (Cascade B hop 2), applied to the Lead's EnrollmentCounselor:
      if days_elapsed_at_withdrawal <= CLAWBACK_WINDOW_DAYS:
          EnrollmentCounselor.clawback_pending_cents +=
              round_half_up(EnrollmentCounselor.variable_component_cents * refund_pct_applied)
      # suspension hop (Cascade B hop 3):
      if EnrollmentCounselor.clawback_pending_cents >= CLAWBACK_SUSPENSION_TRIGGER_CENTS
         and EnrollmentCounselor.incentive_eligibility == ELIGIBLE:
          EnrollmentCounselor.incentive_eligibility = SUSPENDED
    input_set: "one Enrollment, its Lead's EnrollmentCounselor, and the Partnership.refund_schedule in effect at the moment of withdrawal"
    constants:
      DEFAULT_REFUND_SCHEDULE: [{ through_day: 7, refund_pct: 1.00 }, { through_day: 21, refund_pct: 0.50 }, { through_day: 35, refund_pct: 0.25 }, { through_day: null, refund_pct: 0.00 }]
      CLAWBACK_WINDOW_DAYS: 45
      CLAWBACK_SUSPENSION_TRIGGER_CENTS: 50000
    precision: "whole cents, round_half_up; band selection uses >= on through_day so day 7 takes the 1.00 band and day 8 takes the 0.50 band"

  - name: counselor_conversion_performance
    trigger: "on POST /partnerships/{id}/counselor-performance-runs, for every EnrollmentCounselor of the Partnership whose performance_status != INACTIVE_PENDING_REVIEW"
    algorithm: threshold
    formula: |
      rated_lead_count    = count of the counselor's Leads with status IN {CONTACTED, APPLIED, ENROLLED, DISQUALIFIED}
                            and created_at within [window_start 00:00:00Z, window_end 23:59:59.999Z]
      enrolled_lead_count = count of the counselor's Leads with status == ENROLLED in the same window
      sla_breach_count    = count of the counselor's Leads in the same window whose hours_to_first_contact
                            is not null and exceeds the sla_response_hours of the ENROLLMENT_COUNSELING
                            ServiceScopeAssignment of that Lead's Program
      if rated_lead_count < MIN_RATED_PIPELINE:
          conversion_rate = 0.0000
          performance_status = NOT_RATED           # too little signal to rate
      else:
          conversion_rate = round_half_up(enrolled_lead_count / rated_lead_count, 4)
          base = MEETS_STANDARD when conversion_rate >= MEETS_THRESHOLD
                 else WATCH     when conversion_rate >= WATCH_THRESHOLD
                 else PROBATION
          sla_breach_ratio = round_half_up(sla_breach_count / rated_lead_count, 4)
          performance_status = one step down the ladder MEETS_STANDARD -> WATCH -> PROBATION
                               when sla_breach_ratio > SLA_BREACH_MAX_RATIO (PROBATION absorbs
                               the downgrade), else base
    input_set: "Leads of each EnrollmentCounselor of the Partnership whose created_at falls in the supplied window; counselors with performance_status == INACTIVE_PENDING_REVIEW are excluded from the run entirely and keep their status"
    constants:
      MIN_RATED_PIPELINE: 4
      MEETS_THRESHOLD: 0.2500
      WATCH_THRESHOLD: 0.1500
      SLA_BREACH_MAX_RATIO: 0.3000
    precision: "4 decimal places, round_half_up; MEETS_THRESHOLD and WATCH_THRESHOLD are inclusive (>=), SLA_BREACH_MAX_RATIO is exclusive (>)"

  - name: teach_out_obligation_liability
    trigger: "on POST /teach-out-plans/{id}/certify (TeachOutPlan DRAFT -> CERTIFIED)"
    algorithm: waterfall_allocation
    formula: |
      # buckets are filled strictly in this order
      teach_out_cost_cents      = TeachOutPlan.remaining_credit_count * TEACH_OUT_COST_PER_CREDIT_CENTS
      holdback_applied_cents    = min(Partnership.holdback_balance_cents, teach_out_cost_cents)
      residual_after_holdback   = teach_out_cost_cents - holdback_applied_cents
      partner_obligation_cents  = min(residual_after_holdback,
                                      floor(teach_out_cost_cents * PARTNER_OBLIGATION_CAP_PCT))
      university_residual_cents = teach_out_cost_cents - holdback_applied_cents - partner_obligation_cents
      # exact conservation: holdback_applied + partner_obligation + university_residual == teach_out_cost
      transferred_asset_value_cents =
          0 when TeachOutPlan.asset_transfer_scope == NONE
          else round_half_up(
              (sum of Course.design_cost_cents over Courses of this Program with
               design_status IN {APPROVED, DESIGN_SUSPENDED, RETIRED})
              * ASSET_TRANSFER_SCOPE_FACTOR[TeachOutPlan.asset_transfer_scope])
    input_set: "the TeachOutPlan's affected Enrollments (status IN {ENROLLED, ACTIVE} at plan creation) for remaining_credit_count, the Courses of the Program for asset value, and Partnership.holdback_balance_cents as of certification"
    constants:
      TEACH_OUT_COST_PER_CREDIT_CENTS: 18000
      PARTNER_OBLIGATION_CAP_PCT: 0.40
      TEACH_OUT_NOTICE_MIN_DAYS: 90
      ASSET_TRANSFER_SCOPE_FACTOR: { NONE: 0.00, COURSE_CONTENT_ONLY: 0.50, COURSE_CONTENT_AND_LEAD_DATA: 0.75, FULL_PLATFORM: 1.00 }
    precision: "whole cents; floor on the partner obligation cap, round_half_up on the asset value; the three liability buckets must sum exactly to teach_out_cost_cents"

  - name: blended_customer_acquisition_cost
    trigger: "on POST /programs/{id}/marketing-spend-entries and on Lead ENROLLED (POST /leads/{id}/enroll)"
    algorithm: aggregation
    formula: |
      Program.marketing_spend_net_cents =
          (sum of MarketingSpendEntry.amount_cents for this Program with entry_type == SPEND)
        - (sum of MarketingSpendEntry.amount_cents for this Program with entry_type == CREDIT_MEMO)
      Program.blended_cac_cents =
          null when Program.total_enrollment_count == 0
          else round_half_up(Program.marketing_spend_net_cents / Program.total_enrollment_count)
    input_set: "all MarketingSpendEntry rows of the Program with no state filter (the entity is append-only), and Program.total_enrollment_count which counts Enrollments with status IN {ENROLLED, ACTIVE, COMPLETED}"
    constants: {}
    precision: "whole cents, round_half_up; the zero-denominator case yields null, never 0"

  - name: cash_position_reconciliation
    trigger: "on POST /enrollments/{id}/tuition-payments and on the refund entry created by Enrollment WITHDRAW (Cascade B hop 1)"
    algorithm: aggregation
    formula: |
      # INV-1 — conserved quantity: cash collected on the partnership
      Enrollment.collected_cents  = sum of this Enrollment's TuitionPayment.amount_cents with entry_type == PAYMENT
      Enrollment.refunded_cents   = sum of this Enrollment's TuitionPayment.amount_cents with entry_type == REFUND
      Partnership.collected_tuition_cents =
          (sum of TuitionPayment.amount_cents with entry_type == PAYMENT
           over every Enrollment of every Program of this Partnership)
        - (sum of TuitionPayment.amount_cents with entry_type == REFUND over the same set)
      # Compensating-action invariant: a PAYMENT of X followed by a REFUND of X on the same
      # Enrollment MUST leave Partnership.collected_tuition_cents at its pre-PAYMENT value, and
      # Enrollment.collected_cents - Enrollment.refunded_cents at its pre-PAYMENT value. No
      # intermediate cascade (status flip to ACTIVE, statement staling, clawback accrual) may
      # leave drift in this quantity.
    input_set: "every TuitionPayment row of every Enrollment of every Program of the Partnership, with no state filter — the entity is append-only and both directions are always included"
    constants: {}
    precision: "exact integer cents; no rounding participates"

  - name: marketing_envelope_reconciliation
    trigger: "on POST /programs/{id}/marketing-spend-entries"
    algorithm: aggregation
    formula: |
      # INV-2 — conserved quantity: the marketing budget envelope
      posted_net = sum over every Program of this Partnership of Program.marketing_spend_net_cents
      Partnership.marketing_budget_remaining_cents = Partnership.marketing_budget_cents - posted_net
      Partnership.unrecouped_marketing_spend_cents =
          posted_net - (sum of RemittanceStatement.marketing_recoupment_cents
                        over statements of this Partnership with status == REMITTED)
      # Compensating-action invariant: a SPEND of X followed by a CREDIT_MEMO of X on the same
      # Program MUST restore Partnership.marketing_budget_remaining_cents to
      # Partnership.marketing_budget_cents exactly, and restore
      # Program.marketing_spend_net_cents to its pre-SPEND value. The identity
      # marketing_budget_cents == marketing_budget_remaining_cents + posted_net holds after
      # every write.
    input_set: "every MarketingSpendEntry row of every Program of the Partnership (append-only, no state filter), plus RemittanceStatements with status == REMITTED for the recoupment leg"
    constants: {}
    precision: "exact integer cents; no rounding participates"

validations:
  - priority: 1
    category: auth
    check: "both X-User-Role and X-User-ID request headers are present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role names one of the six roles declared in the RBAC matrix"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the role in X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "the request body contains every required input field of the endpoint, no unknown fields, every value has the declared type, every enum value is a declared member, integers representing cents are >= 0, and every date field parses as an ISO date with period_start <= period_end, launch_window_start < launch_window_end, term_start_date <= term_end_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: auth
    check: "for multi-action endpoints, the acting role is permitted for the specific action value: contract-actions SUBMIT_FOR_REVIEW is PartnerAccountLead-only while REQUEST_CHANGES, EXECUTE, WIND_DOWN and CLOSE_OUT are UniversityProvost-only; lifecycle-actions SUBMIT and LAUNCH are PartnerAccountLead-only while REQUEST_REVISION, APPROVE, REJECT, SUSPEND, RESUME, BEGIN_TEACH_OUT and CLOSE are UniversityProvost-only; design-actions START_DESIGN and SUBMIT_FOR_FACULTY_REVIEW are PartnerAccountLead-only while REQUEST_REVISION, APPROVE and RETIRE are FacultyChair-only; statement actions APPROVE is UniversityProvost-only, DISPUTE is PartnerAccountLead-only, RESOLVE / REMIT / RECALCULATE are UniversityBursar-only; academic-actions WITHDRAW is UniversityBursar-only while RECORD_PROGRESS and COMPLETE are UniversityProvost-only"
    error_id: ERR_ACTION_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /partnerships/{id}/contract-actions, POST /programs/{id}/lifecycle-actions, POST /courses/{id}/design-actions, POST /remittance-statements/{id}/actions, POST /enrollments/{id}/academic-actions"
  - priority: 6
    category: existence
    check: "the Partnership named by the path id or by partnership_id exists"
    error_id: ERR_PARTNERSHIP_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints under /partnerships/{id}, POST /programs, POST /enrollment-counselors"
  - priority: 7
    category: existence
    check: "the Program named by the path id or by program_id exists"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints under /programs/{id}, POST /leads"
  - priority: 8
    category: existence
    check: "the Course named by the path id exists"
    error_id: ERR_COURSE_NOT_FOUND
    http_status: 404
    applies_to: "GET /courses/{id}, PATCH /courses/{id}, POST /courses/{id}/design-actions"
  - priority: 9
    category: existence
    check: "when prerequisite_course_id is supplied it names an existing Course belonging to the same Program"
    error_id: ERR_PREREQUISITE_COURSE_NOT_FOUND
    http_status: 404
    applies_to: "POST /programs/{id}/courses, PATCH /courses/{id}"
  - priority: 10
    category: existence
    check: "the EnrollmentCounselor named by the path id or by counselor_id exists"
    error_id: ERR_COUNSELOR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints under /enrollment-counselors/{id}, POST /leads"
  - priority: 11
    category: existence
    check: "the Lead named by the path id exists"
    error_id: ERR_LEAD_NOT_FOUND
    http_status: 404
    applies_to: "GET /leads/{id}, POST /leads/{id}/advance, POST /leads/{id}/enroll"
  - priority: 12
    category: existence
    check: "the Enrollment named by the path id exists"
    error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints under /enrollments/{id}"
  - priority: 13
    category: existence
    check: "the RemittanceStatement named by the path id exists"
    error_id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /remittance-statements/{id}, POST /remittance-statements/{id}/actions"
  - priority: 14
    category: existence
    check: "the TeachOutPlan named by the path id exists"
    error_id: ERR_TEACH_OUT_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /teach-out-plans/{id}/certify"
  - priority: 15
    category: auth
    check: "when the acting role is PartnerAccountLead, X-User-ID equals the id of the Partnership that governs the target resource, resolved through Program.partnership_id, EnrollmentCounselor.partnership_id, Lead.program_id -> Program.partnership_id, Course.program_id -> Program.partnership_id or RemittanceStatement.partnership_id"
    error_id: ERR_PARTNERSHIP_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose roles list includes PartnerAccountLead"
  - priority: 16
    category: business_safety
    check: "segregation of duties: the X-User-ID approving a RemittanceStatement differs from RemittanceStatement.authored_by_user_id, and the X-User-ID deciding a counselor compliance review differs from EnrollmentCounselor.last_review_user_id when a prior review exists"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /remittance-statements/{id}/actions with action == APPROVE, POST /enrollment-counselors/{id}/compliance-review"
  - priority: 17
    category: state
    check: "expected_partnership_version equals the current Partnership.version"
    error_id: ERR_STALE_PARTNERSHIP_VERSION
    http_status: 412
    applies_to: "PATCH /partnerships/{id}/terms, POST /partnerships/{id}/remittance-statements"
  - priority: 18
    category: state
    check: "Partnership.status permits the requested contract action or child write per state_machines.Partnership; Program creation, counselor compensation filing and marketing spend posting require Partnership.status == EXECUTED, and terms amendment requires Partnership.status IN {DRAFT, UNDER_REVIEW, EXECUTED}"
    error_id: ERR_PARTNERSHIP_INVALID_STATE
    http_status: 409
    applies_to: "POST /partnerships/{id}/contract-actions, PATCH /partnerships/{id}/terms, POST /programs, POST /enrollment-counselors/{id}/compensation-plan, POST /programs/{id}/marketing-spend-entries, POST /partnerships/{id}/remittance-statements"
  - priority: 19
    category: state
    check: "Program.status permits the requested lifecycle action or child write per state_machines.Program; Course creation and ServiceScopeAssignment creation require Program.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED}, Lead creation requires Program.status == LAUNCHED, TeachOutPlan creation requires Program.status == TEACH_OUT"
    error_id: ERR_PROGRAM_INVALID_STATE
    http_status: 409
    applies_to: "POST /programs/{id}/lifecycle-actions, POST /programs/{id}/courses, POST /programs/{id}/service-scope-assignments, POST /programs/{id}/teach-out-plans, POST /leads, POST /leads/{id}/advance, POST /leads/{id}/enroll"
  - priority: 20
    category: state
    check: "Course.design_status permits the requested design action per state_machines.Course, including the prerequisite gate on SUBMIT_FOR_FACULTY_REVIEW which requires the Course named by prerequisite_course_id to have design_status IN {FACULTY_REVIEW, APPROVED}; and a PATCH /courses/{id} amendment is accepted only while design_status IN {NOT_STARTED, IN_DESIGN, DESIGN_SUSPENDED}"
    error_id: ERR_COURSE_INVALID_DESIGN_STATE
    http_status: 409
    applies_to: "POST /courses/{id}/design-actions, PATCH /courses/{id}"
  - priority: 21
    category: state
    check: "EnrollmentCounselor.incentive_eligibility permits the requested compliance decision per state_machines.EnrollmentCounselor incentive dimension"
    error_id: ERR_COUNSELOR_INVALID_REVIEW_STATE
    http_status: 409
    applies_to: "POST /enrollment-counselors/{id}/compliance-review"
  - priority: 22
    category: state
    check: "Lead.status permits the requested advance action or enrollment per state_machines.Lead"
    error_id: ERR_LEAD_INVALID_STATE
    http_status: 409
    applies_to: "POST /leads/{id}/advance, POST /leads/{id}/enroll"
  - priority: 23
    category: state
    check: "Enrollment.status permits the requested academic action or tuition posting; TuitionPayment creation requires Enrollment.status IN {ENROLLED, ACTIVE}"
    error_id: ERR_ENROLLMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /enrollments/{id}/academic-actions, POST /enrollments/{id}/tuition-payments"
  - priority: 24
    category: state
    check: "RemittanceStatement.status permits the requested action per state_machines.RemittanceStatement, and requires_recalculation == false when the action is APPROVE"
    error_id: ERR_STATEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /remittance-statements/{id}/actions"
  - priority: 25
    category: state
    check: "TeachOutPlan.status == DRAFT when certifying"
    error_id: ERR_TEACH_OUT_PLAN_INVALID_STATE
    http_status: 409
    applies_to: "POST /teach-out-plans/{id}/certify"
  - priority: 26
    category: business_safety
    check: "the filed compensation plan is permitted under the incentive-compensation ban: variable_basis IN {ENROLLMENT_COUNT, APPLICATION_COUNT} and comp_plan_type IN {PER_ENROLLMENT_COMMISSION, PER_APPLICATION_BOUNTY} are always prohibited; comp_plan_type == SALARY_PLUS_QUALITATIVE with variable_basis == QUALITATIVE_MULTI_FACTOR is permitted only when the parent Partnership.bundled_services_exception_claimed == true; comp_plan_type IN {FIXED_SALARY, GRADUATION_MILESTONE} is always permitted"
    error_id: ERR_INCENTIVE_COMP_PROHIBITED
    http_status: 422
    applies_to: "POST /enrollment-counselors/{id}/compensation-plan"
  - priority: 27
    category: business_safety
    check: "the Lead's EnrollmentCounselor.incentive_eligibility is not PROHIBITED_PLAN_ON_FILE when enrolling, and is not PROHIBITED_PLAN_ON_FILE when creating a Lead for that counselor"
    error_id: ERR_COUNSELOR_INCENTIVE_SUSPENDED
    http_status: 409
    applies_to: "POST /leads, POST /leads/{id}/enroll"
  - priority: 28
    category: business_safety
    check: "faculty ownership of academic content: a Course may be APPROVED only when content_owner == UNIVERSITY, or content_owner IN {PARTNER, JOINT} together with ip_license_grant_back == true"
    error_id: ERR_FACULTY_IP_OWNERSHIP_VIOLATION
    http_status: 422
    applies_to: "POST /courses/{id}/design-actions with action == APPROVE"
  - priority: 29
    category: business_safety
    check: "non-delegable service domains COURSE_DESIGN, FACULTY_TRAINING and ACCESSIBILITY_ACCOMMODATIONS must have responsible_party == UNIVERSITY; assigning them to PARTNER is rejected"
    error_id: ERR_NON_DELEGABLE_SERVICE_DOMAIN
    http_status: 422
    applies_to: "POST /programs/{id}/service-scope-assignments"
  - priority: 30
    category: business_safety
    check: "student_notification_date is at least TEACH_OUT_NOTICE_MIN_DAYS = 90 whole days before teach_out_end_date"
    error_id: ERR_TEACH_OUT_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /teach-out-plans/{id}/certify"
  - priority: 31
    category: business_safety
    check: "a Program may be CLOSED only when a CERTIFIED TeachOutPlan exists for it and Program.active_enrollment_count == 0; a Partnership may be CLOSED_OUT only when every Program of the Partnership has status IN {CLOSED, REJECTED, DRAFT} and no RemittanceStatement is still open"
    error_id: ERR_TEACH_OUT_OBLIGATIONS_UNMET
    http_status: 409
    applies_to: "POST /programs/{id}/lifecycle-actions with action == CLOSE, POST /partnerships/{id}/contract-actions with action == CLOSE_OUT"
  - priority: 32
    category: business_referential
    check: "service_domain is not already assigned for this Program"
    error_id: ERR_DUPLICATE_SERVICE_DOMAIN
    http_status: 409
    applies_to: "POST /programs/{id}/service-scope-assignments"
  - priority: 33
    category: business_referential
    check: "the prerequisite edge does not create a cycle in the Program's Course prerequisite graph, following prerequisite_course_id transitively; a self-edge (prerequisite_course_id == the Course's own id) is also a cycle"
    error_id: ERR_PREREQUISITE_CYCLE
    http_status: 422
    applies_to: "POST /programs/{id}/courses, PATCH /courses/{id}"
  - priority: 34
    category: business_referential
    check: "every service_domain listed in Program.required_service_domains has a ServiceScopeAssignment for this Program before APPROVE"
    error_id: ERR_SERVICE_SCOPE_INCOMPLETE
    http_status: 409
    applies_to: "POST /programs/{id}/lifecycle-actions with action == APPROVE"
  - priority: 35
    category: business_referential
    check: "every Course of the Program with required_for_launch == true has design_status == APPROVED before APPROVE"
    error_id: ERR_COURSE_DESIGN_INCOMPLETE
    http_status: 409
    applies_to: "POST /programs/{id}/lifecycle-actions with action == APPROVE"
  - priority: 36
    category: business_referential
    check: "the Program has at least one Course before SUBMIT"
    error_id: ERR_NO_COURSES_DEFINED
    http_status: 409
    applies_to: "POST /programs/{id}/lifecycle-actions with action == SUBMIT"
  - priority: 37
    category: business_temporal
    check: "the logical clock date is <= the parent Partnership.expiry_date"
    error_id: ERR_CONTRACT_TERM_EXPIRED
    http_status: 409
    applies_to: "POST /programs/{id}/lifecycle-actions with action IN {LAUNCH, RESUME}, POST /leads, POST /leads/{id}/enroll, POST /partnerships/{id}/remittance-statements"
  - priority: 38
    category: business_temporal
    check: "the logical clock date lies in the half-open interval [Program.launch_window_start, Program.launch_window_end) at LAUNCH"
    error_id: ERR_OUTSIDE_LAUNCH_WINDOW
    http_status: 422
    applies_to: "POST /programs/{id}/lifecycle-actions with action == LAUNCH"
  - priority: 39
    category: business_temporal
    check: "no other Program with status IN {LAUNCHED, SUSPENDED, TEACH_OUT} under any Partnership sharing this Partnership.university_ipeds_id holds the same cip_code with a launch window overlapping this Program's half-open [launch_window_start, launch_window_end), where the cip_code is listed in either Partnership.exclusivity_cip_codes. Half-open semantics: two windows that merely touch (one's end equals the other's start) do NOT overlap."
    error_id: ERR_CIP_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /programs/{id}/lifecycle-actions with action == LAUNCH"
  - priority: 40
    category: business_temporal
    check: "the requested [period_start, period_end] does not overlap any existing RemittanceStatement of this Partnership with status IN {CALCULATED, UNIVERSITY_APPROVED, DISPUTED, RESOLVED_ADJUSTED, STALE, REMITTED}. Fully-closed semantics: two periods that merely touch (one's period_end equals the other's period_start) DO overlap."
    error_id: ERR_STATEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /partnerships/{id}/remittance-statements"
  - priority: 41
    category: business_temporal
    check: "period_end is strictly before the logical clock date — a statement may not be cut for a period that has not fully elapsed"
    error_id: ERR_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /partnerships/{id}/remittance-statements"
  - priority: 42
    category: business_constraint
    check: "Program.demand_score_screening >= SUBMIT_MIN_SCORE (45.00, inclusive) at SUBMIT, evaluated after applying any revised inputs supplied on the action"
    error_id: ERR_DEMAND_SCORE_BELOW_SUBMIT_THRESHOLD
    http_status: 422
    applies_to: "POST /programs/{id}/lifecycle-actions with action == SUBMIT"
  - priority: 43
    category: business_constraint
    check: "Program.demand_score_confirmed >= APPROVAL_MIN_SCORE (62.00, inclusive) at APPROVE"
    error_id: ERR_DEMAND_SCORE_BELOW_APPROVAL_THRESHOLD
    http_status: 422
    applies_to: "POST /programs/{id}/lifecycle-actions with action == APPROVE"
  - priority: 44
    category: business_fiscal
    check: "Program.total_enrollment_count < Program.enrollment_cap before the enrollment is created"
    error_id: ERR_ENROLLMENT_CAP_REACHED
    http_status: 409
    applies_to: "POST /leads/{id}/enroll"
  - priority: 45
    category: business_fiscal
    check: "for entry_type == SPEND, amount_cents <= Partnership.marketing_budget_remaining_cents"
    error_id: ERR_MARKETING_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /programs/{id}/marketing-spend-entries"
  - priority: 46
    category: business_fiscal
    check: "fee_schedule_monthly_cents > 0 requires contract_structure == FEE_FOR_SERVICE, and contract_structure == REVENUE_SHARE requires fee_schedule_monthly_cents == 0, both at partnership creation and after any terms amendment"
    error_id: ERR_FEE_STRUCTURE_MISMATCH
    http_status: 422
    applies_to: "POST /partnerships, PATCH /partnerships/{id}/terms, POST /partnerships/{id}/contract-actions with action == SUBMIT_FOR_REVIEW"
  - priority: 47
    category: business_fiscal
    check: "variable_component_cents <= 20 percent of annual_base_cents on the filed compensation plan"
    error_id: ERR_COMP_EXCEEDS_APPROVED_ENVELOPE
    http_status: 422
    applies_to: "POST /enrollment-counselors/{id}/compensation-plan"
  - priority: 48
    category: business_fiscal
    check: "RemittanceStatement.net_payable_cents > 0 at REMIT"
    error_id: ERR_NOTHING_TO_REMIT
    http_status: 409
    applies_to: "POST /remittance-statements/{id}/actions with action == REMIT"
  - priority: 49
    category: business_fiscal
    check: "for entry_type == REFUND, amount_cents <= Enrollment.collected_cents - Enrollment.refunded_cents"
    error_id: ERR_REFUND_EXCEEDS_COLLECTED
    http_status: 422
    applies_to: "POST /enrollments/{id}/tuition-payments"

endpoints:
  - method: POST
    path: "/partnerships"
    description: "Register a new OPM partnership in DRAFT with its economic model, term length, recognition method, marketing envelope and exclusivity scope."
    roles: [PlatformAdmin]
    code: 201
    input: [university_name, university_ipeds_id, partner_org_name, contract_structure, term_months, effective_date, revenue_recognition_method, marketing_budget_cents, "revenue_share_tiers?", "fee_schedule_monthly_cents?", "refund_schedule?", "exclusivity_cip_codes?", "bundled_services_exception_claimed?"]
    output: Partnership
    side_effects:
      - "Partnership.status = DRAFT, version = 1"
      - "computes Partnership.expiry_date from effective_date and term_months"
      - "applies DEFAULT_REVENUE_SHARE_TIERS and DEFAULT_REFUND_SCHEDULE when omitted"
      - "initialises marketing_budget_remaining_cents = 0 until execution"
  - method: GET
    path: "/partnerships/{id}"
    description: "Read one Partnership including all computed ledger fields and the current version for OCC."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, FacultyChair, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: []
    output: Partnership
    side_effects: []
  - method: GET
    path: "/partnerships"
    description: "List Partnerships with pagination and optional status / IPEDS filters."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor]
    code: 200
    input: ["status?", "university_ipeds_id?", "limit?", "offset?"]
    output: Partnership[]
    side_effects: []
  - method: PATCH
    path: "/partnerships/{id}/terms"
    description: "Amend contract terms under optimistic concurrency control on Partnership.version."
    roles: [PartnerAccountLead]
    code: 200
    input: [expected_partnership_version, "term_months?", "revenue_share_tiers?", "marketing_budget_cents?", "refund_schedule?", "revenue_recognition_method?", "fee_schedule_monthly_cents?"]
    output: Partnership
    side_effects:
      - "recomputes Partnership.expiry_date when term_months changes"
      - "recomputes Partnership.marketing_budget_remaining_cents when marketing_budget_cents changes"
      - "increments Partnership.version by 1"
  - method: POST
    path: "/partnerships/{id}/contract-actions"
    description: "Drive the Partnership lifecycle: SUBMIT_FOR_REVIEW, REQUEST_CHANGES, EXECUTE, WIND_DOWN, CLOSE_OUT."
    roles: [PartnerAccountLead, UniversityProvost]
    code: 200
    input: [action, "change_request_note?", "executed_date?", "wind_down_reason?", "wind_down_effective_date?"]
    output: Partnership
    side_effects:
      - "applies the matching state_machines.Partnership transition"
      - "WIND_DOWN fires Cascade A across Programs, Leads, Courses and EnrollmentCounselors"
      - "increments Partnership.version by 1"
  - method: POST
    path: "/programs"
    description: "Create a Program in DRAFT under an EXECUTED Partnership and compute its SCREENING demand score."
    roles: [PartnerAccountLead]
    code: 201
    input: [partnership_id, program_name, cip_code, delivery_modality, credential_level, tuition_per_credit_cents, credits_to_complete, enrollment_cap, projected_annual_enrollments, competitor_program_count, regional_wage_premium_pct, employer_partner_count, prior_year_inquiry_volume, launch_window_start, launch_window_end, "required_service_domains?"]
    output: Program
    side_effects:
      - "computes Program.demand_score_screening and Program.demand_score_confirmed via calculations.program_demand_score"
      - "increments Partnership.version by 1"
  - method: GET
    path: "/programs/{id}"
    description: "Read one Program including demand scores, enrollment counters and marketing aggregates."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, FacultyChair, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/programs"
    description: "List Programs with pagination and optional partnership / status / CIP filters."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, FacultyChair, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: ["partnership_id?", "status?", "cip_code?", "limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: POST
    path: "/programs/{id}/lifecycle-actions"
    description: "Drive the Program lifecycle: SUBMIT, REQUEST_REVISION, APPROVE, REJECT, LAUNCH, SUSPEND, RESUME, BEGIN_TEACH_OUT, CLOSE."
    roles: [PartnerAccountLead, UniversityProvost]
    code: 200
    input: [action, "revised_projected_annual_enrollments?", "revised_prior_year_inquiry_volume?", "revision_note?", "teach_out_reason?"]
    output: Program
    side_effects:
      - "applies the matching state_machines.Program transition"
      - "SUBMIT recomputes Program.demand_score_screening; APPROVE recomputes Program.demand_score_confirmed"
      - "BEGIN_TEACH_OUT disqualifies open Leads, suspends in-flight Course designs and may drive counselors to INACTIVE_PENDING_REVIEW"
  - method: POST
    path: "/programs/{id}/courses"
    description: "Add a Course to a Program, optionally declaring a prerequisite Course of the same Program."
    roles: [PartnerAccountLead, FacultyChair]
    code: 201
    input: [course_code, title, credits, content_owner, design_cost_cents, "required_for_launch?", "prerequisite_course_id?", "ip_license_grant_back?"]
    output: Course
    side_effects:
      - "Course.design_status = NOT_STARTED"
      - "rejects prerequisite edges that would create a cycle"
  - method: GET
    path: "/courses/{id}"
    description: "Read one Course including design status, ownership and revision round."
    roles: [PlatformAdmin, UniversityProvost, FacultyChair, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: []
    output: Course
    side_effects: []
  - method: GET
    path: "/courses"
    description: "List Courses with pagination, filterable by owning Program, by prerequisite Course, or by design status."
    roles: [PlatformAdmin, UniversityProvost, FacultyChair, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: ["program_id?", "prerequisite_course_id?", "design_status?", "limit?", "offset?"]
    output: Course[]
    side_effects: []
  - method: PATCH
    path: "/courses/{id}"
    description: "Amend the design metadata of a Course that has not yet reached faculty review — title, credits, design cost, IP grant-back and the prerequisite edge. Accepted only while design_status IN {NOT_STARTED, IN_DESIGN, DESIGN_SUSPENDED}; re-pointing prerequisite_course_id is cycle-checked across the Program's whole prerequisite graph."
    roles: [PartnerAccountLead, FacultyChair]
    code: 200
    input: ["title?", "credits?", "design_cost_cents?", "required_for_launch?", "prerequisite_course_id?", "ip_license_grant_back?"]
    output: Course
    side_effects:
      - "the amended design_cost_cents and credits are what calculations.teach_out_obligation_liability later reads for transferred_asset_value_cents and remaining_credit_count"
      - "rejects a prerequisite edge that would create a cycle in the Program's Course prerequisite graph"
  - method: POST
    path: "/courses/{id}/design-actions"
    description: "Drive the Course design lifecycle: START_DESIGN, SUBMIT_FOR_FACULTY_REVIEW, REQUEST_REVISION, APPROVE, RETIRE."
    roles: [PartnerAccountLead, FacultyChair]
    code: 200
    input: [action, "revision_note?", "faculty_approver_name?"]
    output: Course
    side_effects:
      - "applies the matching state_machines.Course transition"
      - "APPROVE enforces the faculty content-ownership rule and records faculty_approver_name"
  - method: POST
    path: "/programs/{id}/service-scope-assignments"
    description: "Assign one student-support or operations domain to the university or the partner for this Program."
    roles: [UniversityProvost]
    code: 201
    input: [service_domain, responsible_party, "sla_response_hours?", "cost_bearer?"]
    output: ServiceScopeAssignment
    side_effects:
      - "rejects delegation of non-delegable domains to PARTNER"
      - "rejects a duplicate service_domain for the same Program"
  - method: GET
    path: "/programs/{id}/service-scope-assignments"
    description: "List the service-scope split of a Program."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, FacultyChair, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceScopeAssignment[]
    side_effects: []
  - method: POST
    path: "/enrollment-counselors"
    description: "Onboard an enrollment counselor under a Partnership with no compensation plan on file."
    roles: [PartnerAccountLead]
    code: 201
    input: [partnership_id, full_name, employer, monthly_base_salary_cents]
    output: EnrollmentCounselor
    side_effects:
      - "performance_status = NOT_RATED and incentive_eligibility = PENDING_COMPLIANCE_REVIEW"
      - "comp_plan_type = NONE_ON_FILE"
  - method: GET
    path: "/enrollment-counselors/{id}"
    description: "Read one EnrollmentCounselor including both parallel state dimensions and all performance counters."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: []
    output: EnrollmentCounselor
    side_effects: []
  - method: GET
    path: "/enrollment-counselors"
    description: "List EnrollmentCounselors with pagination, filterable by Partnership and by either state dimension."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: ["partnership_id?", "performance_status?", "incentive_eligibility?", "limit?", "offset?"]
    output: EnrollmentCounselor[]
    side_effects: []
  - method: POST
    path: "/enrollment-counselors/{id}/compensation-plan"
    description: "File or replace the counselor's incentive compensation plan; the plan is screened against the incentive-compensation ban and resets the compliance dimension to PENDING_COMPLIANCE_REVIEW."
    roles: [PartnerAccountLead]
    code: 200
    input: [comp_plan_type, annual_base_cents, "variable_component_cents?", "variable_basis?"]
    output: EnrollmentCounselor
    side_effects:
      - "replaces comp_plan_type, annual_base_cents, variable_component_cents and variable_basis"
      - "incentive_eligibility resets to PENDING_COMPLIANCE_REVIEW; performance_status is untouched"
    note: "comp_plan_type accepts the request-only members PER_ENROLLMENT_COMMISSION and PER_APPLICATION_BOUNTY, and variable_basis accepts the request-only members ENROLLMENT_COUNT and APPLICATION_COUNT, so that the prohibited shapes are expressible and rejectable; neither is ever persisted."
  - method: POST
    path: "/enrollment-counselors/{id}/compliance-review"
    description: "Record a compliance decision on the counselor's filed plan: APPROVE, SUSPEND or REJECT_PLAN."
    roles: [ComplianceAuditor]
    code: 200
    input: [decision, "reviewer_note?"]
    output: EnrollmentCounselor
    side_effects:
      - "moves incentive_eligibility to ELIGIBLE, SUSPENDED or PROHIBITED_PLAN_ON_FILE"
      - "records last_review_user_id; a repeat review by the same X-User-ID is refused"
  - method: POST
    path: "/partnerships/{id}/counselor-performance-runs"
    description: "Run counselor performance evaluation over a closed date window for every counselor of the Partnership."
    roles: [PartnerAccountLead, UniversityProvost]
    code: 200
    input: [window_start, window_end]
    output: { evaluated_count: integer, rated_count: integer, downgraded_count: integer, run_completed_at: datetime }
    side_effects:
      - "recomputes rated_lead_count, enrolled_lead_count, sla_breach_count and conversion_rate per counselor"
      - "assigns performance_status via calculations.counselor_conversion_performance; incentive_eligibility is untouched"
  - method: POST
    path: "/leads"
    description: "Create a Lead for a LAUNCHED Program, owned by an enrollment counselor of the same Partnership."
    roles: [PartnerAccountLead]
    code: 201
    input: [program_id, counselor_id, source_channel, prospect_external_id]
    output: Lead
    side_effects:
      - "Lead.status = NEW"
      - "recomputes EnrollmentCounselor.open_pipeline_count"
  - method: GET
    path: "/leads/{id}"
    description: "Read one Lead."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: []
    output: Lead
    side_effects: []
  - method: GET
    path: "/leads"
    description: "List Leads with pagination, filterable by Program, by owning counselor, or by status."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: ["program_id?", "counselor_id?", "status?", "limit?", "offset?"]
    output: Lead[]
    side_effects: []
  - method: POST
    path: "/leads/{id}/advance"
    description: "Advance a Lead through the funnel: CONTACT, APPLY, DISQUALIFY."
    roles: [PartnerAccountLead]
    code: 200
    input: [action, "hours_to_first_contact?", "disqualification_reason?"]
    output: Lead
    side_effects:
      - "applies the matching state_machines.Lead transition"
      - "recomputes EnrollmentCounselor.open_pipeline_count"
  - method: POST
    path: "/leads/{id}/enroll"
    description: "Convert an APPLIED Lead into an Enrollment, snapshotting tuition and advancing the program counters."
    roles: [UniversityBursar]
    code: 201
    input: [student_external_id, credits_enrolled, term_start_date, term_end_date]
    output: Enrollment
    side_effects:
      - "creates the Enrollment in status ENROLLED with tuition_per_credit_snapshot_cents and tuition_charged_cents computed"
      - "Lead.status = ENROLLED; Program.active_enrollment_count and total_enrollment_count increase"
      - "recomputes Program.blended_cac_cents and EnrollmentCounselor.open_pipeline_count"
  - method: GET
    path: "/enrollments/{id}"
    description: "Read one Enrollment including cash and recognition counters."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments"
    description: "List Enrollments with pagination, filterable by Program, by originating Lead, or by status."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: ["program_id?", "lead_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/academic-actions"
    description: "Record academic progress or terminate an Enrollment: RECORD_PROGRESS, COMPLETE, WITHDRAW."
    roles: [UniversityBursar, UniversityProvost]
    code: 200
    input: [action, "credits_completed?", "withdrawal_date?", "withdrawal_reason?"]
    output: Enrollment
    side_effects:
      - "applies the matching state_machines.Enrollment transition"
      - "WITHDRAW fires Cascade B: refund entry, counselor clawback accrual, incentive suspension, and stales overlapping statements"
  - method: POST
    path: "/enrollments/{id}/tuition-payments"
    description: "Post a tuition payment or a manual refund to the bursar ledger for this Enrollment."
    roles: [UniversityBursar]
    code: 201
    input: [entry_type, amount_cents, posted_date, "reference_note?"]
    output: TuitionPayment
    side_effects:
      - "recomputes Enrollment.collected_cents / refunded_cents and Partnership.collected_tuition_cents"
      - "the first PAYMENT moves the Enrollment from ENROLLED to ACTIVE"
  - method: GET
    path: "/enrollments/{id}/tuition-payments"
    description: "List the append-only bursar ledger entries of one Enrollment in created_at ASC order."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: ["limit?", "offset?"]
    output: TuitionPayment[]
    side_effects: []
  - method: POST
    path: "/programs/{id}/marketing-spend-entries"
    description: "Post a marketing spend or a compensating credit memo against a Program's media ledger."
    roles: [PartnerAccountLead]
    code: 201
    input: [entry_type, channel, amount_cents, spend_date, "reversal_note?"]
    output: MarketingSpendEntry
    side_effects:
      - "recomputes Program.marketing_spend_net_cents and Program.blended_cac_cents"
      - "recomputes Partnership.marketing_budget_remaining_cents and unrecouped_marketing_spend_cents (invariant INV-2)"
  - method: GET
    path: "/programs/{id}/marketing-spend-entries"
    description: "List the append-only marketing ledger entries of one Program in created_at ASC order."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: ["limit?", "offset?"]
    output: MarketingSpendEntry[]
    side_effects: []
  - method: POST
    path: "/partnerships/{id}/remittance-statements"
    description: "Cut a settlement statement for a fully elapsed, non-overlapping period under OCC on Partnership.version."
    roles: [UniversityBursar]
    code: 201
    input: [period_start, period_end, expected_partnership_version]
    output: RemittanceStatement
    side_effects:
      - "runs calculations.recognized_tuition_revenue, partner_share_gross and net_remittance_payable"
      - "records authored_by_user_id from X-User-ID; status = CALCULATED"
      - "increments Partnership.version by 1"
  - method: GET
    path: "/remittance-statements/{id}"
    description: "Read one RemittanceStatement including every computed settlement figure."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: []
    output: RemittanceStatement
    side_effects: []
  - method: GET
    path: "/remittance-statements"
    description: "List RemittanceStatements with pagination, filterable by Partnership and status."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: ["partnership_id?", "status?", "limit?", "offset?"]
    output: RemittanceStatement[]
    side_effects: []
  - method: POST
    path: "/remittance-statements/{id}/actions"
    description: "Drive the settlement lifecycle: APPROVE, DISPUTE, RESOLVE, REMIT, RECALCULATE."
    roles: [UniversityProvost, UniversityBursar, PartnerAccountLead]
    code: 200
    input: [action, "dispute_reason?", "recognition_method_override?", "adjustment_note?", "remittance_reference?"]
    output: RemittanceStatement
    side_effects:
      - "applies the matching state_machines.RemittanceStatement transition"
      - "RESOLVE re-runs the three settlement calculations and pins adjustment_delta_cents"
      - "REMIT updates Partnership.remitted_to_partner_cents, holdback_balance_cents and unrecouped_marketing_spend_cents"
  - method: POST
    path: "/programs/{id}/teach-out-plans"
    description: "Draft a teach-out plan for a Program in TEACH_OUT, snapshotting affected enrollments and remaining credits."
    roles: [UniversityProvost]
    code: 201
    input: [teach_out_end_date, student_notification_date, asset_transfer_scope, "partner_obligation_note?"]
    output: TeachOutPlan
    side_effects:
      - "computes affected_enrollment_count, remaining_credit_count and teach_out_cost_cents"
      - "supersedes any existing DRAFT TeachOutPlan for the same Program"
  - method: GET
    path: "/programs/{id}/teach-out-plans"
    description: "List the teach-out plans of a Program in created_at ASC order."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: ["limit?", "offset?"]
    output: TeachOutPlan[]
    side_effects: []
  - method: POST
    path: "/teach-out-plans/{id}/certify"
    description: "Certify a DRAFT teach-out plan, allocating the teach-out liability waterfall and releasing holdback."
    roles: [ComplianceAuditor]
    code: 200
    input: [asset_transfer_confirmed, "certification_note?"]
    output: TeachOutPlan
    side_effects:
      - "runs calculations.teach_out_obligation_liability"
      - "decrements Partnership.holdback_balance_cents by holdback_applied_cents"
      - "records certified_by_user_id and certified_at"
  - method: GET
    path: "/partnerships/{id}/revenue-summary"
    description: "Computed read: the Partnership's consolidated cash, recognition, remittance, holdback and marketing position."
    roles: [PlatformAdmin, UniversityProvost, UniversityBursar, ComplianceAuditor, PartnerAccountLead]
    code: 200
    input: []
    output: { collected_tuition_cents: integer, recognized_revenue_cents: integer, remitted_to_partner_cents: integer, holdback_balance_cents: integer, unrecouped_marketing_spend_cents: integer, marketing_budget_remaining_cents: integer, open_statement_count: integer, program_count: integer }
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call to this endpoint the logical clock reads exactly the fixed startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, launch window, elapsed-period and expiry rule in this scaffold is evaluated against this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects:
      - "replaces the logical clock value used by every subsequent request; no entity is mutated"

errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the called endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown field, wrong type, undeclared enum member, negative cents, unparseable date, or an inverted date range"
  - id: ERR_ACTION_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role may call the multi-action endpoint but not the specific action value supplied"
  - id: ERR_PARTNERSHIP_NOT_FOUND
    http: 404
    condition: "the referenced Partnership does not exist"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "the referenced Program does not exist"
  - id: ERR_COURSE_NOT_FOUND
    http: 404
    condition: "the referenced Course does not exist"
  - id: ERR_PREREQUISITE_COURSE_NOT_FOUND
    http: 404
    condition: "prerequisite_course_id does not name an existing Course of the same Program"
  - id: ERR_COUNSELOR_NOT_FOUND
    http: 404
    condition: "the referenced EnrollmentCounselor does not exist"
  - id: ERR_LEAD_NOT_FOUND
    http: 404
    condition: "the referenced Lead does not exist"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "the referenced Enrollment does not exist"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "the referenced RemittanceStatement does not exist"
  - id: ERR_TEACH_OUT_PLAN_NOT_FOUND
    http: 404
    condition: "the referenced TeachOutPlan does not exist"
  - id: ERR_PARTNERSHIP_SCOPE_VIOLATION
    http: 403
    condition: "a PartnerAccountLead acts on a resource governed by a Partnership other than the one its X-User-ID names"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID both authored and approved a statement, or decided two consecutive compliance reviews of one counselor"
  - id: ERR_STALE_PARTNERSHIP_VERSION
    http: 412
    condition: "expected_partnership_version does not equal the current Partnership.version"
  - id: ERR_PARTNERSHIP_INVALID_STATE
    http: 409
    condition: "the Partnership's status does not permit the requested contract action or child write"
  - id: ERR_PROGRAM_INVALID_STATE
    http: 409
    condition: "the Program's status does not permit the requested lifecycle action or child write"
  - id: ERR_COURSE_INVALID_DESIGN_STATE
    http: 409
    condition: "the Course's design_status does not permit the requested design action"
  - id: ERR_COUNSELOR_INVALID_REVIEW_STATE
    http: 409
    condition: "the counselor's incentive_eligibility does not permit the requested compliance decision"
  - id: ERR_LEAD_INVALID_STATE
    http: 409
    condition: "the Lead's status does not permit the requested advance action or enrollment"
  - id: ERR_ENROLLMENT_INVALID_STATE
    http: 409
    condition: "the Enrollment's status does not permit the requested academic action or tuition posting"
  - id: ERR_STATEMENT_INVALID_STATE
    http: 409
    condition: "the statement's status does not permit the requested action, or approval was attempted while requires_recalculation is true"
  - id: ERR_TEACH_OUT_PLAN_INVALID_STATE
    http: 409
    condition: "certification was attempted on a plan whose status is not DRAFT"
  - id: ERR_INCENTIVE_COMP_PROHIBITED
    http: 422
    condition: "the filed compensation plan pays on enrollment or application counts, or claims the qualitative bundled-services shape without the partnership having claimed the bundled-services exception"
  - id: ERR_COUNSELOR_INCENTIVE_SUSPENDED
    http: 409
    condition: "a Lead creation or enrollment was attempted for a counselor whose incentive_eligibility is PROHIBITED_PLAN_ON_FILE"
  - id: ERR_FACULTY_IP_OWNERSHIP_VIOLATION
    http: 422
    condition: "a Course with content_owner IN {PARTNER, JOINT} and ip_license_grant_back == false was submitted for faculty approval"
  - id: ERR_NON_DELEGABLE_SERVICE_DOMAIN
    http: 422
    condition: "COURSE_DESIGN, FACULTY_TRAINING or ACCESSIBILITY_ACCOMMODATIONS was assigned to PARTNER"
  - id: ERR_TEACH_OUT_NOTICE_TOO_SHORT
    http: 422
    condition: "student_notification_date is fewer than 90 whole days before teach_out_end_date"
  - id: ERR_TEACH_OUT_OBLIGATIONS_UNMET
    http: 409
    condition: "a Program close was attempted without a CERTIFIED teach-out plan or with active enrollments, or a Partnership close-out was attempted with open Programs or open statements"
  - id: ERR_DUPLICATE_SERVICE_DOMAIN
    http: 409
    condition: "the service_domain is already assigned for this Program"
  - id: ERR_PREREQUISITE_CYCLE
    http: 422
    condition: "the prerequisite edge would create a cycle in the Program's Course prerequisite graph"
  - id: ERR_SERVICE_SCOPE_INCOMPLETE
    http: 409
    condition: "approval was attempted while at least one required service domain has no ServiceScopeAssignment"
  - id: ERR_COURSE_DESIGN_INCOMPLETE
    http: 409
    condition: "approval was attempted while a launch-required Course is not APPROVED"
  - id: ERR_NO_COURSES_DEFINED
    http: 409
    condition: "submission was attempted on a Program with no Courses"
  - id: ERR_CONTRACT_TERM_EXPIRED
    http: 409
    condition: "the logical clock date is after the Partnership's expiry_date"
  - id: ERR_OUTSIDE_LAUNCH_WINDOW
    http: 422
    condition: "the logical clock date is before launch_window_start or on/after launch_window_end"
  - id: ERR_CIP_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "an exclusive CIP code is already occupied at the same university by an overlapping launch window"
  - id: ERR_STATEMENT_PERIOD_OVERLAP
    http: 409
    condition: "the requested settlement period overlaps an existing statement period of the same Partnership"
  - id: ERR_PERIOD_NOT_ELAPSED
    http: 422
    condition: "period_end is on or after the logical clock date"
  - id: ERR_DEMAND_SCORE_BELOW_SUBMIT_THRESHOLD
    http: 422
    condition: "demand_score_screening is below 45.00 at submission"
  - id: ERR_DEMAND_SCORE_BELOW_APPROVAL_THRESHOLD
    http: 422
    condition: "demand_score_confirmed is below 62.00 at approval"
  - id: ERR_ENROLLMENT_CAP_REACHED
    http: 409
    condition: "the Program's total_enrollment_count already equals its enrollment_cap"
  - id: ERR_MARKETING_BUDGET_EXCEEDED
    http: 422
    condition: "a SPEND entry exceeds the Partnership's remaining marketing budget"
  - id: ERR_FEE_STRUCTURE_MISMATCH
    http: 422
    condition: "fee_schedule_monthly_cents and contract_structure disagree"
  - id: ERR_COMP_EXCEEDS_APPROVED_ENVELOPE
    http: 422
    condition: "variable_component_cents exceeds 20 percent of annual_base_cents"
  - id: ERR_NOTHING_TO_REMIT
    http: 409
    condition: "REMIT was attempted on a statement whose net_payable_cents is 0 or negative"
  - id: ERR_REFUND_EXCEEDS_COLLECTED
    http: 422
    condition: "a manual REFUND entry exceeds the Enrollment's uncollected-net balance"

roles:
  - name: PlatformAdmin
    description: "Operator of the shared OPM administration platform; registers partnerships and controls the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /partnerships"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /partnerships/{id}, GET /partnerships"
      - "all read endpoints"
  - name: UniversityProvost
    description: "University academic officer; owns program approval, the service-scope split, academic progress, statement approval and teach-out drafting."
    identity: opaque
    exclusive_operations:
      - "POST /partnerships/{id}/contract-actions with action IN {REQUEST_CHANGES, EXECUTE, WIND_DOWN, CLOSE_OUT}"
      - "POST /programs/{id}/lifecycle-actions with action IN {REQUEST_REVISION, APPROVE, REJECT, SUSPEND, RESUME, BEGIN_TEACH_OUT, CLOSE}"
      - "POST /programs/{id}/service-scope-assignments"
      - "POST /programs/{id}/teach-out-plans"
      - "POST /remittance-statements/{id}/actions with action == APPROVE"
      - "POST /enrollments/{id}/academic-actions with action IN {RECORD_PROGRESS, COMPLETE}"
    shared_operations:
      - "POST /partnerships/{id}/counselor-performance-runs"
      - "all read endpoints"
  - name: UniversityBursar
    description: "University financial officer; owns tuition collection, withdrawals, statement authoring, dispute resolution and remittance."
    identity: opaque
    exclusive_operations:
      - "POST /leads/{id}/enroll"
      - "POST /enrollments/{id}/tuition-payments"
      - "POST /enrollments/{id}/academic-actions with action == WITHDRAW"
      - "POST /partnerships/{id}/remittance-statements"
      - "POST /remittance-statements/{id}/actions with action IN {RESOLVE, REMIT, RECALCULATE}"
    shared_operations:
      - "all read endpoints"
  - name: FacultyChair
    description: "Faculty owner of academic content; the only role that may approve, revise or retire course content."
    identity: opaque
    exclusive_operations:
      - "POST /courses/{id}/design-actions with action IN {REQUEST_REVISION, APPROVE, RETIRE}"
    shared_operations:
      - "POST /programs/{id}/courses"
      - "PATCH /courses/{id}"
      - "GET /courses/{id}, GET /courses, GET /programs/{id}, GET /programs"
  - name: ComplianceAuditor
    description: "Independent compliance reviewer; screens incentive compensation plans and certifies teach-out plans. Held to segregation of duties across consecutive reviews of the same counselor."
    identity: opaque
    exclusive_operations:
      - "POST /enrollment-counselors/{id}/compliance-review"
      - "POST /teach-out-plans/{id}/certify"
    shared_operations:
      - "all read endpoints"
  - name: PartnerAccountLead
    description: "The OPM partner's account lead. X-User-ID equals the id of the Partnership the lead manages, so every write is scoped to that partnership's own programs, courses, counselors, leads, marketing ledger and statements."
    identity: "entity_backed:Partnership"
    exclusive_operations:
      - "PATCH /partnerships/{id}/terms"
      - "POST /partnerships/{id}/contract-actions with action == SUBMIT_FOR_REVIEW"
      - "POST /programs"
      - "POST /programs/{id}/lifecycle-actions with action IN {SUBMIT, LAUNCH}"
      - "POST /courses/{id}/design-actions with action IN {START_DESIGN, SUBMIT_FOR_FACULTY_REVIEW}"
      - "POST /enrollment-counselors"
      - "POST /enrollment-counselors/{id}/compensation-plan"
      - "POST /leads"
      - "POST /leads/{id}/advance"
      - "POST /programs/{id}/marketing-spend-entries"
