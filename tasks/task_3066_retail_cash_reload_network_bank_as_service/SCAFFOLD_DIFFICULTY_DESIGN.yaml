            - call: "POST /v1/brand-partners"
              payload: { program_id: "${prog_id}", brand_name: "Sunrise Brand", services_scope: ["CARD_ISSUANCE", "LEDGERING"], card_issuance_enabled: true, ledgering_enabled: true, compliance_oversight_enabled: false, expected_program_version: "${prog_v}" }
              as: ComplianceOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /v1/retailer-agreements"
              payload: { program_id: "${prog_id}", retailer_name: "QuickMart", fee_split_retailer_pct: 0.35, per_transaction_limit_cents: 15000, daily_location_limit_cents: 3000000, settlement_period_hours: 24, reload_enabled: true }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /v1/retailer-agreements/${agr_id}/state"
              payload: { to_status: "ACTIVE" }
              as: ProgramManager
              as_user_id: "${prog_id}"
            - call: "POST /v1/reload-locations"
              payload: { retailer_agreement_id: "${agr_id}", location_code: "QM-001", state_code: "TX", register_count: 2 }
              as: ProgramManager
              as_user_id: "${prog_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /v1/float-windows"
              payload: { reload_location_id: "${loc_id}", window_start_at: "2026-09-01T14:00:00Z", window_end_at: "2026-09-01T15:00:00Z", armored_carrier: "Loomis", float_amount_cents: 500000, buffer_minutes: 120 }
              as: SettlementOperator
              captures: { fw1: $.data.id }
          trigger:
            - call: "POST /v1/float-windows"
              payload: { reload_location_id: "${loc_id}", window_start_at: "2026-09-01T17:00:00Z", window_end_at: "2026-09-01T18:00:00Z", armored_carrier: "Brinks", float_amount_cents: 400000, buffer_minutes: 120 }
              as: SettlementOperator
              captures: { err1: $.data.error_id }
            - call: "POST /v1/float-windows"
              payload: { reload_location_id: "${loc_id}", window_start_at: "2026-09-01T17:01:00Z", window_end_at: "2026-09-01T18:01:00Z", armored_carrier: "Brinks", float_amount_cents: 400000, buffer_minutes: 120 }
              as: SettlementOperator
              captures: { fw2: $.data.id }
          assert:
            - "the window starting exactly two hours after the first window ends returns error_id == ERR_FLOAT_WINDOW_OVERLAP (409) — occupancy is closed-interval plus buffer on both sides, so the touching instants collide"
            - "shifting the same start by exactly one minute is accepted and returns FloatWindow.${fw2}.window_status == REQUESTED"
            - "FloatWindow.${fw1}.window_status is unchanged by the rejected request"
            - "the two surviving windows differ only in the one-minute offset of their start instants"

