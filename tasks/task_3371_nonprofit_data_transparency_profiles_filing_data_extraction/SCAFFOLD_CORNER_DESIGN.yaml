          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns 0 rows with total_count == 0 and has_more == false"
            - "no error_id is present in the response"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 runs before everything else: a request with no X-User-Role and no X-User-ID is rejected 401 ERR_UNAUTHENTICATED even when the path id does not exist, so auth outranks the priority-3 existence check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /nonprofits/organizations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err_noauth: "$.data.error_id" }
          assert:
            - "the response status is 401 and err_noauth == ERR_UNAUTHENTICATED"
            - "err_noauth != ERR_ORGANIZATION_NOT_FOUND — auth is checked before existence"
            - "response_type is error"

      - name: organization_user_role_cannot_award_a_transparency_seal
        claim_type: Violation to Error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - endpoints.POST_/nonprofits/organizations/{id}/seals
        distinguishing_aspect: "Seal award is exclusive to PlatformVerifier: the owning organization acting as OrganizationUser is rejected 403 ERR_FORBIDDEN_ROLE even though it owns the resource."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization whose disclosure_pct is comfortably above 0.50."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
          trigger:
            - call: "POST /nonprofits/organizations/${o_id}/seals"
              payload: {}
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { err_role: "$.data.error_id" }
          assert:
            - "the response status is 403 and err_role == ERR_FORBIDDEN_ROLE"
            - "err_role != ERR_SEAL_DISCLOSURE_INSUFFICIENT — authorization precedes the disclosure floor"
            - "GET /nonprofits/organizations/${o_id}/seals returns 0 rows"

      - name: path_resources_are_resolved_left_to_right_before_body_fields
        claim_type: Violation to Error
        grounds:
          - validations[priority=3]
          - errors[ERR_LICENSE_NOT_FOUND]
          - errors[ERR_USAGE_EVENT_NOT_FOUND]
        distinguishing_aspect: "With both the license id and the usage-event id unknown, the leftmost path segment is reported: ERR_LICENSE_NOT_FOUND, never ERR_USAGE_EVENT_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /nonprofits/licenses/00000000-0000-4000-8000-0000000000aa/usage-events/00000000-0000-4000-8000-0000000000bb/void"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { err_leftmost: "$.data.error_id" }
          assert:
            - "the response status is 404 and err_leftmost == ERR_LICENSE_NOT_FOUND"
            - "err_leftmost != ERR_USAGE_EVENT_NOT_FOUND"

      - name: correction_request_against_a_pending_field_returns_field_not_correctable
        claim_type: Violation to Error
        grounds:
          - validations[priority=9]
          - errors[ERR_FIELD_NOT_CORRECTABLE]
          - state_machines.ExtractedField.initial_state
        distinguishing_aspect: "A correction request may only target a NORMALIZED or CORRECTED line; a PENDING line is refused 422 ERR_FIELD_NOT_CORRECTABLE, distinct from the 409 ERR_INVALID_STATE a wrong-state parent would give."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with one filing whose TOTREV line was extracted but never normalized, so the field is still PENDING."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
            - *c_extract
            - call: "GET /nonprofits/filings/${f_id}/extracted-fields"
              payload: {}
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { ef_pending: "$.data[0].id", ef_pending_v: "$.data[0].version" }
          trigger:
            - call: "POST /nonprofits/extracted-fields/${ef_pending}/correction-requests"
              payload: { requested_value: "2000.00", evidence_url: "https://evidence.example.org/willow-2025.pdf", justification: "Audited statement shows 2000.00.", expected_extracted_field_version: "${ef_pending_v}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { err_not_correctable: "$.data.error_id" }
          assert:
            - "the response status is 422 and err_not_correctable == ERR_FIELD_NOT_CORRECTABLE"
            - "GET /nonprofits/extracted-fields/${ef_pending}/correction-requests returns 0 rows"
            - "ExtractedField.${ef_pending}.normalization_status == PENDING"

      - name: usage_event_beyond_the_quota_hard_cap_returns_quota_exceeded
        claim_type: Violation to Error
        grounds:
          - validations[priority=8]
          - errors[ERR_QUOTA_EXCEEDED]
          - calculations.license_annual_fee_cents
        distinguishing_aspect: "The hard cap is included_records * 4 = 40000 for RESEARCHER: a 30000-record event on top of 10000 already consumed is refused 402, while 10000 on top of 10000 lands exactly on the cap and succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization holding an ACTIVE RESEARCHER license with 10000 records already posted."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - call: "POST /nonprofits/organizations/${o_id}/licenses"
              payload: { tier: "RESEARCHER", permitted_use: "AGGREGATE_RESEARCH", term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z", projected_annual_records: 12000 }
              as: DataConsumer
              as_user_id: "${o_id}"
              captures: { lic_id: "$.data.id" }
            - call: "POST /nonprofits/licenses/${lic_id}/activate"
              payload: {}
              as: DataConsumer
              as_user_id: "${o_id}"
            - call: "POST /nonprofits/licenses/${lic_id}/usage-events"
              payload: { dataset_scope: "ORGANIZATION_PROFILES", record_count: 10000, purpose_code: "FIRST_BATCH" }
              as: DataConsumer
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /nonprofits/licenses/${lic_id}/usage-events"
              payload: { dataset_scope: "FILING_FINANCIALS", record_count: 30000, purpose_code: "AT_CAP" }
              as: DataConsumer
              as_user_id: "${o_id}"
              captures: { at_cap_ok: "$.data.id" }
            - call: "POST /nonprofits/licenses/${lic_id}/usage-events"
              payload: { dataset_scope: "GRANT_HISTORY", record_count: 1, purpose_code: "ONE_OVER" }
              as: DataConsumer
              as_user_id: "${o_id}"
              captures: { err_quota: "$.data.error_id" }
            - call: "GET /nonprofits/licenses/${lic_id}"
              payload: {}
              as: DataConsumer
              as_user_id: "${o_id}"
          assert:
            - "the first trigger returns 201 — 10000 + 30000 lands exactly on the 40000 cap and the cap is inclusive"
            - "the second trigger returns 402 and err_quota == ERR_QUOTA_EXCEEDED — one record past the cap is refused"
            - "DataLicense.${lic_id}.records_accessed == 40000 and overage_records == 30000"
            - "GET /nonprofits/licenses/${lic_id}/usage-events returns exactly 2 rows"

      - name: usage_event_outside_the_license_term_returns_license_term_closed
        claim_type: Violation to Error
        grounds:
          - validations[priority=10]
          - errors[ERR_LICENSE_TERM_CLOSED]
          - entities.DataLicense.fields.term_end
        distinguishing_aspect: "The half-open term is enforced against the logical clock: a license whose term has not opened yet is already ACTIVE but an event at 2026-09-01 falls outside [2026-10-01, 2027-10-01) and is refused 409 ERR_LICENSE_TERM_CLOSED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization holding an ACTIVE RESEARCHER license whose term is [2026-10-01T00:00:00Z, 2027-10-01T00:00:00Z) — the term has not opened yet, but activation does not gate on the clock."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - call: "POST /nonprofits/organizations/${o_id}/licenses"
              payload: { tier: "RESEARCHER", permitted_use: "AGGREGATE_RESEARCH", term_start: "2026-10-01T00:00:00Z", term_end: "2027-10-01T00:00:00Z", projected_annual_records: 12000 }
              as: DataConsumer
              as_user_id: "${o_id}"
              captures: { lic_id: "$.data.id" }
            - call: "POST /nonprofits/licenses/${lic_id}/activate"
              payload: {}
              as: DataConsumer
              as_user_id: "${o_id}"
              captures: { lic_status: "$.data.status" }
          trigger:
            - call: "POST /nonprofits/licenses/${lic_id}/usage-events"
              payload: { dataset_scope: "GRANT_HISTORY", record_count: 500, purpose_code: "EARLY_READ" }
              as: DataConsumer
              as_user_id: "${o_id}"
              captures: { err_closed: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /nonprofits/licenses/${lic_id}/usage-events"
              payload: { dataset_scope: "GRANT_HISTORY", record_count: 500, purpose_code: "OPENING_READ" }
              as: DataConsumer
              as_user_id: "${o_id}"
              captures: { ev_open: "$.data.id" }
          assert:
            - "lic_status == ACTIVE and DataLicense.${lic_id}.status == ACTIVE"
            - "the first trigger returns 409 and err_closed == ERR_LICENSE_TERM_CLOSED — the clock is before term_start"
            - "DataLicense.${lic_id}.records_accessed == 0 after the rejection"
            - "after the clock reaches exactly 2026-10-01T00:00:00Z the same call succeeds and DataLicense.${lic_id}.records_accessed == 500 — term_start is inclusive"

      - name: seal_award_below_the_disclosure_floor_returns_seal_disclosure_insufficient
        claim_type: Violation to Error
        grounds:
          - validations[priority=11]
          - errors[ERR_SEAL_DISCLOSURE_INSUFFICIENT]
          - calculations.seal_level_award
        distinguishing_aspect: "A bare profile with disclosure_pct 0.0000 is refused the award with 422 ERR_SEAL_DISCLOSURE_INSUFFICIENT rather than being granted the lowest BRONZE level."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization whose mission statement and NTEE code have been cleared, leaving disclosure_pct at 0.4000 — PROGRAMS 0.15 plus LEADERSHIP 0.20 plus the 0.5 GOVERNANCE step of 0.10 — which is below the 0.50 award floor."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - call: "PATCH /nonprofits/organizations/${o_id}"
              payload: { expected_organization_version: "${o_v1}", mission_statement: null, ntee_code: null }
              as: OrganizationUser
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /nonprofits/organizations/${o_id}/seals"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_floor: "$.data.error_id" }
          assert:
            - "the response status is 422 and err_floor == ERR_SEAL_DISCLOSURE_INSUFFICIENT"
            - "GET /nonprofits/organizations/${o_id}/seals returns 0 rows"
            - "Organization.${o_id}.transparency_seal_level == NONE"

      - name: verifying_a_profile_the_same_operator_last_edited_returns_segregation_of_duties
        claim_type: Violation to Error
        grounds:
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.Organization.fields.last_profile_editor_user_id
        distinguishing_aspect: "The operator id that created the profile is recorded as last_profile_editor_user_id, and that same X-User-ID is refused when it tries to verify the profile — the same person cannot both author and attest."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An organization created by operator admin-root with a program, three officers and a mission statement, so profile_completeness_score is 60 and the score gate would pass."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
          trigger:
            - call: "POST /nonprofits/organizations/${o_id}/verify"
              payload: { target_level: "DOCUMENT_VERIFIED", evidence_count: 1 }
              as: PlatformVerifier
              as_user_id: "admin-root"
              captures: { err_sod: "$.data.error_id" }
            - call: "POST /nonprofits/organizations/${o_id}/verify"
              payload: { target_level: "INDEPENDENTLY_AUDITED", evidence_count: 1 }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_step: "$.data.error_id" }
          assert:
            - "the first trigger returns 403 and err_sod == ERR_SEGREGATION_OF_DUTIES"
            - "err_sod != ERR_PROFILE_INCOMPLETE — the segregation gate is checked before the score gate"
            - "Organization.${o_id}.profile_status is still DRAFT and verification_level is still SELF_REPORTED"
            - "the second trigger returns 409 and err_step == ERR_VERIFICATION_STEP_INVALID — the level may only advance one step at a time"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: filing_extract_action_creates_one_field_per_line_and_reports_confidence
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/nonprofits/filings/{id}/extract
          - entities.Filing.fields.extraction_confidence_pct
          - entities.ExtractedField.fields.confidence_pct
        distinguishing_aspect: "Extraction is an action endpoint whose side effects are observable only through the reverse-reachability GET: three raw lines produce three PENDING rows and a mean confidence of 92.0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with one RECEIVED filing."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
          trigger:
            - call: "POST /nonprofits/filings/${f_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "1000.00", raw_format: "USD_WHOLE", is_revenue_component: true }, { line_code: "PROGREV", raw_value: "500.00", raw_format: "USD_THOUSANDS", is_revenue_component: true }, { line_code: "CONTRIB", raw_value: "0.25", raw_format: "USD_MILLIONS", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
          assert:
            - "the response status is 200 and Filing.${f_id}.status == EXTRACTED"
            - "Filing.${f_id}.extracted_field_count == 3 and extraction_confidence_pct == 92.0"
            - "GET /nonprofits/filings/${f_id}/extracted-fields returns exactly 3 rows, all normalization_status PENDING"
            - "GET /nonprofits/filings/${f_id}/extracted-fields?is_revenue_component=true returns 3 rows"

      - name: identity_case_finalize_withdraw_leaves_the_organization_graph_untouched
        claim_type: Conditional action
        grounds:
          - state_machines.IdentityResolutionCase.OPEN_to_WITHDRAWN
          - endpoints.POST_/nonprofits/identity-cases/{id}/finalize
        distinguishing_aspect: "The same action endpoint branches on resolution_decision: WITHDRAW finalizes the case as WITHDRAWN and mutates no Organization, unlike FINALIZE which applies the merge."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two DRAFT organizations and one OPEN MERGE case naming the second as surviving."
          setup_api_calls:
            - *c_clock
            - *c_org
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "Prairie Food Bank", ein: "900100201", org_type: "501C3", state_code: "IL" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { pf_id: "$.data.id", pf_v: "$.data.version" }
            - call: "POST /nonprofits/identity-cases"
              payload: { subject_organization_id: "${o_id}", case_type: "MERGE", effective_date: "2026-09-01T00:00:00Z", surviving_organization_id: "${pf_id}", resolution_note: "Proposed merger." }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /nonprofits/identity-cases/${case_id}/finalize"
              payload: { resolution_decision: "WITHDRAW" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { case_status: "$.data.status" }
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
          assert:
            - "case_status == WITHDRAWN and the response status is 200"
            - "Organization.${o_id}.profile_status is still DRAFT and successor_organization_id is null"
            - "Organization.${pf_id}.distinct_funder_count == 0"
            - "GET /nonprofits/organizations?successor_organization_id=${pf_id} returns 0 rows"

      - name: grant_rematch_flips_ambiguous_to_matched_once_the_ein_is_supplied
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/nonprofits/grants/{id}/match-recipient
          - calculations.grant_recipient_match_score
        distinguishing_aspect: "Re-running the match with the EIN the funder has since obtained moves the same Grant from UNMATCHED 30 to MATCHED 90 without creating a new row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Willow Creek Collective is ACTIVE with ein 900100200 and ntee_code B82; one Grant exists with a matching recipient_name_raw but no recipient_ein and no subject_code, so it scored 30."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "Kestrel Giving Fund", ein: "900100250", org_type: "501C3", state_code: "IL" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { k_id: "$.data.id" }
            - call: "POST /nonprofits/organizations/${o_id}/grants"
              payload: { funder_organization_id: "${k_id}", funder_name_raw: "Kestrel Giving Fund", recipient_name_raw: "Willow Creek Collective", amount_cents: 500000, fiscal_year: 2025 }
              as: DataConsumer
              as_user_id: "${k_id}"
              captures: { g_id: "$.data.id" }
          trigger:
            - call: "POST /nonprofits/grants/${g_id}/match-recipient"
              payload: {}
              as: DataConsumer
              as_user_id: "${k_id}"
              captures: { rescore_plain: "$.data.match_score" }
            - call: "POST /nonprofits/grants/${g_id}/match-recipient"
              payload: { recipient_ein: "900100200" }
              as: DataConsumer
              as_user_id: "${k_id}"
              captures: { rescore_ein: "$.data.match_score" }
            - call: "GET /nonprofits/organizations/${o_id}/grants"
              payload: {}
              as: DataConsumer
              as_user_id: "${o_id}"
          assert:
            - "the Grant was created with match_score 30 and recipient_match_status UNMATCHED"
            - "the bare re-match returns 200 and rescore_plain == 30 — re-running identical inputs is deterministic and does not invent a match"
            - "the re-match carrying the EIN returns 200 and rescore_ein == 90 (exact name 30 + ein 60) with recipient_match_status MATCHED"
            - "GET /nonprofits/organizations/${o_id}/grants still returns exactly 1 row, so re-matching updates in place"
            - "Grant.${g_id}.recipient_ein == \"900100200\" and Grant.${g_id}.version == 3"

      - name: response_envelope_shape_is_stable_across_object_and_array_responses
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - response_envelope.pagination_fields
          - endpoints.GET_/nonprofits/organizations
        distinguishing_aspect: "Object and array responses carry the same meta block, and array responses additionally carry all four pagination fields; the pagination defaults clamp limit into [1, 100]."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One organization."
          setup_api_calls:
            - *c_clock
            - *c_org
          trigger:
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { obj_meta: "$.meta.api_request_id" }
            - call: "GET /nonprofits/organizations"
              payload: { limit: 100, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { arr_meta: "$.meta.api_request_id" }
          assert:
            - "both responses carry meta.api_request_id and meta.api_request_timestamp"
            - "the object response has response_type object and the array response has response_type array"
            - "the array response carries all four pagination fields limit, offset, total_count and has_more"
            - "the array response reports total_count == 1 and has_more == false at limit 100"

  # ===========================================================================
  - section: errors
    instances:

      - name: gov_grants_line_on_a_2019_form_returns_unsupported_form_version
        claim_type: Violation to Error
        grounds:
          - errors[ERR_UNSUPPORTED_FORM_VERSION]
          - calculations.form_version_line_membership
        distinguishing_aspect: "GOV_GRANTS does not exist in the 2019 line map, so the same line code that is accepted on a 2020 form is rejected 422 on a 2019 form."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with one RECEIVED 2019-version filing."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${o_id}", form_type: "FORM_990", form_version_year: 2019, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${o_v1}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { f19: "$.data.id" }
          trigger:
            - call: "POST /nonprofits/filings/${f19}/extract"
              payload: { raw_lines: [{ line_code: "GOV_GRANTS", raw_value: "500.00", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_line: "$.data.error_id" }
          assert:
            - "the trigger returns 422 and err_line == ERR_UNSUPPORTED_FORM_VERSION"
            - "Filing.${f19}.status is still RECEIVED and extracted_field_count == 0"
            - "GET /nonprofits/filings/${f19}/extracted-fields returns 0 rows"

      - name: merge_case_whose_successor_chain_loops_returns_merge_cycle_detected
        claim_type: Violation to Error
        grounds:
          - errors[ERR_MERGE_CYCLE_DETECTED]
          - state_machines.IdentityResolutionCase.OPEN_to_FINALIZED
        distinguishing_aspect: "After organization A has merged into B, a second MERGE naming B as subject and A as surviving would close the successor chain into a cycle and is refused 409 ERR_MERGE_CYCLE_DETECTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization A has already been merged into organization B by a finalized MERGE case, so A.successor_organization_id is B."
          setup_api_calls:
            - *c_clock
            - *c_org
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "Prairie Food Bank", ein: "900100201", org_type: "501C3", state_code: "IL" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { pf_id: "$.data.id" }
            - call: "POST /nonprofits/identity-cases"
              payload: { subject_organization_id: "${o_id}", case_type: "MERGE", effective_date: "2026-09-01T00:00:00Z", surviving_organization_id: "${pf_id}", resolution_note: "First merger." }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { case1: "$.data.id" }
            - call: "POST /nonprofits/identity-cases/${case1}/finalize"
              payload: { resolution_decision: "FINALIZE" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /nonprofits/identity-cases"
              payload: { subject_organization_id: "${pf_id}", case_type: "MERGE", effective_date: "2026-09-01T00:00:00Z", surviving_organization_id: "${o_id}", resolution_note: "Reverse merger attempt." }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { case2: "$.data.id" }
          trigger:
            - call: "POST /nonprofits/identity-cases/${case2}/finalize"
              payload: { resolution_decision: "FINALIZE" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { err_cycle: "$.data.error_id" }
          assert:
            - "the trigger returns 409 and err_cycle == ERR_MERGE_CYCLE_DETECTED"
            - "IdentityResolutionCase.${case2}.status is still OPEN"
            - "Organization.${pf_id}.profile_status is still DRAFT and successor_organization_id is null"
            - "Organization.${o_id}.successor_organization_id == ${pf_id}"

      - name: dissolution_case_carrying_a_surviving_organization_returns_identity_case_invalid
        claim_type: Violation to Error
        grounds:
          - errors[ERR_IDENTITY_CASE_INVALID]
          - state_machines.IdentityResolutionCase.OPEN_to_FINALIZED
        distinguishing_aspect: "A DISSOLUTION case must carry a null surviving_organization_id; supplying one is refused 409 ERR_IDENTITY_CASE_INVALID and the subject organization is not dissolved."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two DRAFT organizations and one OPEN DISSOLUTION case that wrongly names the second as surviving."
          setup_api_calls:
            - *c_clock
            - *c_org
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "Prairie Food Bank", ein: "900100201", org_type: "501C3", state_code: "IL" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { pf_id: "$.data.id" }
            - call: "POST /nonprofits/identity-cases"
              payload: { subject_organization_id: "${o_id}", case_type: "DISSOLUTION", effective_date: "2026-09-01T00:00:00Z", surviving_organization_id: "${pf_id}" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /nonprofits/identity-cases/${case_id}/finalize"
              payload: { resolution_decision: "FINALIZE" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { err_invalid_case: "$.data.error_id" }
          assert:
            - "the trigger returns 409 and err_invalid_case == ERR_IDENTITY_CASE_INVALID"
            - "Organization.${o_id}.profile_status is still DRAFT and dissolution_date is null"
            - "IdentityResolutionCase.${case_id}.status is still OPEN"

      - name: extract_with_an_empty_raw_lines_array_returns_no_extracted_fields
        claim_type: Violation to Error
        grounds:
          - errors[ERR_NO_EXTRACTED_FIELDS]
          - state_machines.Filing.RECEIVED_to_EXTRACTION_FAILED
        distinguishing_aspect: "An empty raw_lines array is a 422 ERR_NO_EXTRACTED_FIELDS that leaves the filing in RECEIVED, while a non-empty array of unparseable values instead drives the filing to EXTRACTION_FAILED without an error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with one RECEIVED filing."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
          trigger:
            - call: "POST /nonprofits/filings/${f_id}/extract"
              payload: { raw_lines: [] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_empty: "$.data.error_id" }
            - call: "POST /nonprofits/filings/${f_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "not-a-number", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { status_after_unparseable: "$.data.status" }
          assert:
            - "the first trigger returns 422 and err_empty == ERR_NO_EXTRACTED_FIELDS"
            - "Filing.${f_id}.status is still RECEIVED after the empty extract"
            - "status_after_unparseable == EXTRACTION_FAILED — a non-empty but unparseable batch is a state transition, not an error"
            - "Filing.${f_id}.extracted_field_count == 0 and extraction_confidence_pct is null"

  # ===========================================================================
  - section: roles
    instances:

      - name: platform_verifier_cannot_create_an_organization
        claim_type: RBAC denial
        grounds:
          - roles[PlatformVerifier]
          - roles[PlatformAdmin]
          - endpoints.POST_/nonprofits/organizations
        distinguishing_aspect: "Organization creation is exclusive to PlatformAdmin: the opaque PlatformVerifier operator is refused 403 ERR_FORBIDDEN_ROLE even though it may verify the same organization afterwards."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "Unauthorized Assembly", ein: "900100900", org_type: "501C3", state_code: "IL" }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_verifier_create: "$.data.error_id" }
          assert:
            - "the trigger returns 403 and err_verifier_create == ERR_FORBIDDEN_ROLE"
            - "GET /nonprofits/organizations returns 0 rows"

      - name: organization_user_cannot_patch_another_organization
        claim_type: RBAC denial
        grounds:
          - roles[OrganizationUser]
          - entities.Organization.fields.last_profile_editor_user_id
          - endpoints.PATCH_/nonprofits/organizations/{id}
        distinguishing_aspect: "OrganizationUser is entity_backed, so X-User-ID must equal the organization id in the path: acting on a sibling organization is refused 403 and the victim's last_profile_editor_user_id is untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two DRAFT organizations."
          setup_api_calls:
            - *c_clock
            - *c_org
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "Prairie Food Bank", ein: "900100201", org_type: "501C3", state_code: "IL" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { pf_id: "$.data.id", pf_v: "$.data.version" }
          trigger:
            - call: "PATCH /nonprofits/organizations/${pf_id}"
              payload: { expected_organization_version: "${pf_v}", display_name: "Hijacked" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { err_cross_org: "$.data.error_id" }
          assert:
            - "the trigger returns 403 and err_cross_org == ERR_FORBIDDEN_ROLE"
            - "Organization.${pf_id}.display_name is null and last_profile_editor_user_id == \"admin-root\""
            - "Organization.${pf_id}.version == ${pf_v} — the rejected write advanced nothing"

      - name: data_consumer_cannot_activate_another_organizations_license
        claim_type: RBAC denial
        grounds:
          - roles[DataConsumer]
          - endpoints.POST_/nonprofits/licenses/{id}/activate
        distinguishing_aspect: "Activation is exclusive to the licensee acting as itself: a different organization presenting a valid DataConsumer role is refused 403 and the license stays DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two ACTIVE organizations, the first holding a DRAFT RESEARCHER license."
          setup_api_calls:
