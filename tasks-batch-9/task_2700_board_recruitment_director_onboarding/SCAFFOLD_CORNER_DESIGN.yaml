              as: CorporateSecretary
              captures: { mem1_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Nia Member", email: "nia@issuer.example", birth_date: "1966-01-01", appointed_on: "2020-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { mem2_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Rex Recused", email: "rex@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { nomdir_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Ned Nominee", email: "ned@issuer.example", birth_date: "1969-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { nom2dir_id: $.data.id }
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id, slate_v1: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, incumbent_director_id: "${nomdir_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { nom1_id: $.data.id }
            - call: "GET /governance/slates/${slate_id}"
              payload: {}
              as: GovernanceStaff
              captures: { slate_v2: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 2, incumbent_director_id: "${nom2dir_id}", expected_slate_version: "${slate_v2}" }
              as: GovernanceStaff
              captures: { nom2_id: $.data.id }
            - call: "POST /governance/slates/${slate_id}/submit-for-review"
              payload: {}
              as: GovernanceStaff
          trigger:
            - call: "POST /governance/slates/${slate_id}/votes"
              payload: { voting_director_id: "${chair_id}", ballot: "FOR" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /governance/slates/${slate_id}/votes"
              payload: { voting_director_id: "${mem1_id}", ballot: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem1_id}"
              captures: { v2_id: $.data.id }
            - call: "POST /governance/slates/${slate_id}/votes"
              payload: { voting_director_id: "${nomdir_id}", ballot: "RECUSED" }
              as: CommitteeMember
              as_user_id: "${nomdir_id}"
              captures: { v3_id: $.data.id }
            - call: "POST /governance/slates/${slate_id}/votes"
              payload: { voting_director_id: "${mem2_id}", ballot: "AGAINST" }
              as: CommitteeMember
