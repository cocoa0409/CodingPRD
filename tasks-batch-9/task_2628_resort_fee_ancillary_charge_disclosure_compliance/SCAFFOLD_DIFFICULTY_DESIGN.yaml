              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_free: $.data.id }
            - call: "POST /taxability-rules"
              payload: { jurisdiction_id: "${j_ban}", fee_code: "RESORT", taxability: "TAXABLE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /taxability-rules"
              payload: { jurisdiction_id: "${j_free}", fee_code: "RESORT", taxability: "TAXABLE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_ban}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p_ban: $.data.id, p_ban_v: $.data.version }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_free}", name: "Desert Bloom Suites", brand_code: "DBS", base_room_rate_cents: 24900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p_free: $.data.id, p_free_v: $.data.version }
            - call: "POST /fee-programs"
              payload: { property_id: "${p_ban}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p_ban_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp_ban: $.data.id }
            - call: "POST /fee-programs/${fp_ban}/fees"
              payload: { code: "RESORT", label: "Resort Fee", classification: "MANDATORY", basis: "PERCENT_OF_ROOM", percent_bps: 750, disclosure_text: "Resort fee of 7.5% of the nightly room rate." }
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs/${fp_ban}/submit-review"
              payload: {}
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs"
              payload: { property_id: "${p_free}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p_free_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { fp_free: $.data.id }
            - call: "POST /fee-programs/${fp_free}/fees"
              payload: { code: "RESORT", label: "Resort Fee", classification: "MANDATORY", basis: "PERCENT_OF_ROOM", percent_bps: 750, disclosure_text: "Resort fee of 7.5% of the nightly room rate." }
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "POST /fee-programs/${fp_free}/submit-review"
              payload: {}
