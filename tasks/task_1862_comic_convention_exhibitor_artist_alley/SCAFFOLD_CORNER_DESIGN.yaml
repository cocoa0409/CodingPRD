        distinguishing_aspect: "OperationsStaff runs the freight/badge desk but cannot verify tax permits (ShowDirector-only)."
        test_recipe:
          setup: ["no setup required"]
          setup_api_calls: []
          trigger:
            - { call: "POST /applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/verify-permit", payload: {}, as: OperationsStaff, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "http 403 and error_id == ERR_FORBIDDEN_ROLE"

      - name: anonymous_cannot_create_application
        claim_type: role_denied
        grounds: [roles."Anonymous"]
        distinguishing_aspect: "Anonymous may only self-register as an exhibitor; every other verb is role-denied."
        test_recipe:
          setup: ["no setup required"]
          setup_api_calls: []
          trigger:
            - { call: "POST /applications", payload: { convention_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 100 }, as: Anonymous, as_user_id: "anon-1", captures: { err: $.data.error_id } }
          assert:
            - "http 403 and error_id == ERR_FORBIDDEN_ROLE"

      - name: exhibitor_reads_own_record
        claim_type: role_exclusive_allowed
        grounds: [roles."Exhibitor"]
        distinguishing_aspect: "The entity_backed Exhibitor role reads its own record with X-User-ID equal to the exhibitor id."
        test_recipe:
          setup: ["one registered exhibitor"]
          setup_api_calls:
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
          trigger:
            - { call: "GET /exhibitors/${ex}", payload: {}, as: Exhibitor, as_user_id: "${ex}", captures: { name: $.data.legal_name } }
          assert:
            - "http 200 and legal_name == Dealer One LLC"

      - name: exhibitor_reading_another_exhibitor_forbidden
        claim_type: role_denied
        grounds: ["errors[ERR_FORBIDDEN_OWNERSHIP]", "validations[priority=4]"]
        distinguishing_aspect: "Ownership scoping: Exhibitor B reading exhibitor A's record yields ERR_FORBIDDEN_OWNERSHIP, distinct from role denial."
        test_recipe:
          setup: ["two registered exhibitors"]
          setup_api_calls:
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer A LLC", category: "DEALER" }, as: Anonymous, captures: { exA: $.data.id } }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer B LLC", category: "DEALER" }, as: Anonymous, captures: { exB: $.data.id } }
          trigger:
            - { call: "GET /exhibitors/${exA}", payload: {}, as: Exhibitor, as_user_id: "${exB}", captures: { err: $.data.error_id } }
          assert:
            - "http 403 and error_id == ERR_FORBIDDEN_OWNERSHIP"

  # ============================================================
  - section: endpoints
    instances:
      - name: success_envelope_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response wraps data with meta.api_request_id, meta.api_request_timestamp and a response_type discriminator."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
          assert:
            - "envelope: meta.api_request_id present, meta.api_request_timestamp ISO-8601, response_type == object, data.id == captured id"

      - name: error_envelope_shape
        claim_type: standard_crud
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type == error with data.error_id and data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /space-units/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ShowDirector, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty"

  # ============================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_application_version_rejected_and_increment_verified
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[application-revision-stale-version]", "errors[ERR_STALE_APPLICATION_VERSION]"]
        distinguishing_aspect: "PATCH carries expected_application_version: a replay of the pre-mutation version is rejected 412, and the successful PATCH incremented version by exactly 1."
        test_recipe:
          setup: ["C1 in APPLICATIONS_OPEN; application in DRAFT at version 1"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "PATCH /applications/${app}", payload: { expected_application_version: "${v0}", requested_space_count: 2 }, as: Exhibitor, as_user_id: "${ex}", captures: { v1: $.data.version } }
            - { call: "PATCH /applications/${app}", payload: { expected_application_version: "${v0}", requested_space_count: 3 }, as: Exhibitor, as_user_id: "${ex}", captures: { err: $.data.error_id } }
          assert:
            - "first PATCH: version == ${v0} + 1 (exactly one increment)"
            - "second PATCH replaying ${v0}: http 412 with error_id == ERR_STALE_APPLICATION_VERSION; requested_space_count stays 2"

      - name: occ_stale_convention_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[convention-config-stale-version]", "errors[ERR_STALE_CONVENTION_VERSION]"]
        distinguishing_aspect: "PUT /conventions is OCC-guarded: after one accepted update bumps the version, a writer holding the old observation is rejected 412."
        test_recipe:
          setup: ["C1 exists at version 1"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [], dock_doors: [] }, as: ShowDirector, captures: { conv: $.data.id, cv0: $.data.version } }
          trigger:
            - { call: "PUT /conventions/${conv}", payload: { expected_convention_version: "${cv0}", sales_tax_rate_bp: 900 }, as: ShowDirector, captures: { cv1: $.data.version } }
            - { call: "PUT /conventions/${conv}", payload: { expected_convention_version: "${cv0}", sales_tax_rate_bp: 950 }, as: ShowDirector, captures: { err: $.data.error_id } }
          assert:
            - "first PUT: version == ${cv0} + 1 and sales_tax_rate_bp == 900"
            - "second PUT with the stale version: http 412 ERR_STALE_CONVENTION_VERSION; rate stays 900"

      - name: badge_fees_reconcile_into_balance_due
        claim_type: derived_field_reconciliation
        grounds: [calculations.badge_allocation, entities.Application.fields.balance_due_cents]
        distinguishing_aspect: "Derived-field reconciliation: buying 2 extra badges moves badge_fees_cents to 15000 and balance_due_cents from 67500 to 82500 in the same request."
        test_recipe:
          setup: ["C1 in LOGISTICS; application PLACED on S1 (included_badges 4; final invoice 90000; deposit 22500 paid; balance 67500)"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [{category: "DEALER", max_accepted: 1, max_waitlisted: 1}], dock_doors: [] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /applications", payload: { convention_id: "${conv}", category: "DEALER", channel: "OPEN", requested_space_kinds: ["BOOTH_10X10"], requested_space_count: 1, estimated_daily_sales_cents: 33333 }, as: Exhibitor, as_user_id: "${ex}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 80, craft: 90, category_fit: 70, professionalism: 60 }, as: JuryMember, as_user_id: "juror-1" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 90, craft: 80, category_fit: 80, professionalism: 80 }, as: JuryMember, as_user_id: "juror-2" }
            - { call: "POST /jury-scores", payload: { application_id: "${app}", originality: 70, craft: 70, category_fit: 80, professionalism: 70 }, as: JuryMember, as_user_id: "juror-3" }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPTED" }, as: ShowDirector }
            - { call: "POST /conventions/${conv}/advance-phase", payload: {}, as: ShowDirector }
            - { call: "POST /placements", payload: { application_id: "${app}", space_unit_id: "${sp1}" }, as: ShowDirector, captures: { plc: $.data.id } }
            - { call: "POST /applications/${app}/submit-permit", payload: { permit_number: "ST-4432", permit_expires_at: "2027-01-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /applications/${app}/verify-permit", payload: {}, as: ShowDirector }
            - { call: "POST /applications/${app}/accept-offer", payload: { deposit_cents: 22500 }, as: Exhibitor, as_user_id: "${ex}" }
            - { call: "POST /placements/${plc}/confirm", payload: {}, as: ShowDirector }
          trigger:
            - { call: "POST /applications/${app}/badge-extras", payload: { quantity: 2 }, as: Exhibitor, as_user_id: "${ex}", captures: { fees: $.data.badge_fees_cents, bal: $.data.balance_due_cents, extra: $.data.purchased_extra_badges } }
          assert:
            - "purchased_extra_badges == 2; badge_fees_cents == 15000 (2 x 7500)"
            - "balance_due_cents == 82500 (90000 - 22500 + 15000)"

      - name: standing_suspension_threshold_at_five
        claim_type: rate_threshold_triggers
        grounds: [calculations.strike_standing_threshold]
        distinguishing_aspect: "Cumulative threshold: two MAJOR findings (4 points) leave PROBATION; a further MINOR hits exactly 5 and flips SUSPENDED."
        test_recipe:
          setup: ["C1; exhibitor with 4 strike points (two MAJOR guilty) -> PROBATION"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [], dock_doors: [] }, as: ShowDirector, captures: { conv: $.data.id } }
            - { call: "POST /exhibitors", payload: { legal_name: "Dealer One LLC", category: "DEALER" }, as: Anonymous, captures: { ex: $.data.id } }
            - { call: "POST /issue-tickets", payload: { convention_id: "${conv}", exhibitor_id: "${ex}", category: "NOISE", severity: "MAJOR", description: "m1" }, as: OperationsStaff, as_user_id: "ops-1", captures: { i1: $.data.id } }
            - { call: "POST /issue-tickets/${i1}/resolve", payload: { outcome: "GUILTY" }, as: ShowDirector, as_user_id: "dir-1" }
            - { call: "POST /issue-tickets", payload: { convention_id: "${conv}", exhibitor_id: "${ex}", category: "NOISE", severity: "MAJOR", description: "m2" }, as: OperationsStaff, as_user_id: "ops-1", captures: { i2: $.data.id } }
            - { call: "POST /issue-tickets/${i2}/resolve", payload: { outcome: "GUILTY" }, as: ShowDirector, as_user_id: "dir-1" }
            - { call: "GET /exhibitors/${ex}", payload: {}, as: ShowDirector, captures: { st4: $.data.standing } }
          trigger:
            - { call: "POST /issue-tickets", payload: { convention_id: "${conv}", exhibitor_id: "${ex}", category: "ENCROACHMENT", severity: "MINOR", description: "m3" }, as: OperationsStaff, as_user_id: "ops-1", captures: { i3: $.data.id } }
            - { call: "POST /issue-tickets/${i3}/resolve", payload: { outcome: "GUILTY" }, as: ShowDirector, as_user_id: "dir-1" }
            - { call: "GET /exhibitors/${ex}", payload: {}, as: ShowDirector, captures: { st5: $.data.standing, pts5: $.data.strike_points } }
          assert:
            - "at 4 points: standing == PROBATION; at exactly 5 points: standing == SUSPENDED (inclusive threshold)"

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.Exhibitor.SUSPENDED_to_EVICTED]
        excluded_because:
          difficulty_instance: "transitive_cascade / eviction_cascade_depth_four"
          rationale: "The N-level cascade is exercised end-to-end by the named §1.8 instance (issue -> strikes -> standing -> cancellation -> space/badge/freight -> promotion)."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.space_pricing, calculations.sales_tax_settlement]
        excluded_because:
          difficulty_instance: "dual_variant_calc / provisional_quote_vs_final_invoice_space_count_divergence"
          rationale: "Both variant pairs (pricing on Application, tax on SalesReport) are asserted with literal divergence in §1.8."

  # ============================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a created SpaceUnit is visible in the filtered list within the next request — no lag, no read-your-writes violation."
        test_recipe:
          setup: ["C1 exists"]
          setup_api_calls:
            - { call: "POST /conventions", payload: { name: "InkExpo 2026", starts_at: "2026-10-15T09:00:00Z", ends_at: "2026-10-18T18:00:00Z", renewal_open_at: "2026-08-05T00:00:00Z", application_open_at: "2026-08-12T00:00:00Z", application_close_at: "2026-08-25T00:00:00Z", early_bird_deadline: "2026-08-20T00:00:00Z", tax_permit_required: true, sales_tax_rate_bp: 875, category_quotas: [], dock_doors: [] }, as: ShowDirector, captures: { conv: $.data.id } }
          trigger:
            - { call: "POST /space-units", payload: { convention_id: "${conv}", space_code: "A-101", block: "A", unit_number: 101, hall: "MAIN", kind: "BOOTH_10X10", base_price_cents: 100000 }, as: ShowDirector, captures: { sp1: $.data.id } }
            - { call: "GET /space-units?convention_id=${conv}&status=AVAILABLE", payload: {}, as: ShowDirector, captures: { first_id: "$.data[0].id" } }
          assert:
            - "the immediate GET lists exactly one unit and its id equals the created id"
