            - "the refused probe left no NegotiationRound behind — the list has exactly 2 rows, not 3"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: sale_ledger_conservation_reverses_a_settled_sale_and_posts_nothing_for_an_unsettled_one
        grounds:
          - calculations.sale_ledger_conservation
          - state_machines.AuctionSale.settlement_status_SETTLED_to_REVERSED
          - state_machines.AuctionSale.settlement_status_UNSETTLED_to_REVERSED
          - endpoints[GET /arbitration/sales/{id}/ledger-entries]
          - entities.SettlementLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Invariant L1/L2 of the sale ledger, probed with the compensation ARMED and
          DISARMED in the same test: an unwind of a settled sale must post an exactly
          equal-and-opposite SALE_PROCEEDS_REVERSAL pair so that every party nets to zero,
          while an unwind of a never-settled sale must post NOTHING at all. An
          implementation that always posts the reversal breaks the second sale's ledger by
          1450000 in the buyer's favour; one that never posts it breaks the first.
        test_recipe:
          setup:
            - "one Seller, one Buyer and the FRAME_DAMAGE policy with max_allowance_bps 3000"
            - "TWO AuctionSale rows at hammer_time_utc 2026-08-01T00:00:00Z: sale 1 at 1450000 cents and sale 2 at 900000 cents"
            - "one FRAME_DAMAGE case per sale, each evidenced with a verified INSPECTION_REPORT and a verified THIRD_PARTY_VERIFICATION, each reviewed by arb-intake-01 and DISPUTEd into ARBITRATOR_REVIEW"
            - "sale 1 is SETTLED before its decision (2 SALE_PROCEEDS rows already on its ledger); sale 2 is never settled"
            - "with only 2 in-window sales the seller stays GOOD_STANDING throughout, so no settlement-hold cascade can interfere"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "FRAME_DAMAGE", window_hours: 168, mileage_limit: 1000, min_claim_amount_cents: 50000, requires_third_party_verification: true, max_allowance_bps: 3000, psi_extension_hours: 72, psi_clean_waives_rights: false }
              as: AuctionAdmin
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "RED", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale1_id: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE22222", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 900000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 61000, light_channel: "RED", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale2_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale1_id}", defect_class: "FRAME_DAMAGE", claim_amount_cents: 285000, odometer_at_claim: 84120, complaint_text: "Frame rail repair found on the lift" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case1_id: $.data.id }
            - call: "POST /arbitration/cases/${case1_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "AutoCheck Bay 4", document_reference: "IR-88120", repair_estimate_cents: 285000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case1_id}/evidence"
              payload: { evidence_type: "THIRD_PARTY_VERIFICATION", provider_name: "National Frame Verify", document_reference: "TPV-4471" }
              as: Inspector
              as_user_id: "insp-01"
            - call: "POST /arbitration/cases/${case1_id}/open-review"
              payload: {}
              as: Arbitrator
              as_user_id: "arb-intake-01"
            - call: "POST /arbitration/cases/${case1_id}/seller-response"
              payload: { response_type: "DISPUTE", response_note: "Damage predates consignment" }
              as: SellerRep
              as_user_id: "${seller_id}"
            - call: "POST /arbitration/sales/${sale1_id}/settle"
              payload: {}
              as: AuctionAdmin
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale2_id}", defect_class: "FRAME_DAMAGE", claim_amount_cents: 190000, odometer_at_claim: 61080, complaint_text: "Unibody kink behind the strut tower" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case2_id: $.data.id }
            - call: "POST /arbitration/cases/${case2_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "AutoCheck Bay 4", document_reference: "IR-88222", repair_estimate_cents: 190000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case2_id}/evidence"
              payload: { evidence_type: "THIRD_PARTY_VERIFICATION", provider_name: "National Frame Verify", document_reference: "TPV-4472" }
              as: Inspector
              as_user_id: "insp-01"
            - call: "POST /arbitration/cases/${case2_id}/open-review"
              payload: {}
              as: Arbitrator
              as_user_id: "arb-intake-01"
            - call: "POST /arbitration/cases/${case2_id}/seller-response"
              payload: { response_type: "DISPUTE", response_note: "Unit was straight when consigned" }
              as: SellerRep
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /arbitration/cases/${case1_id}/decision"
              payload: { outcome: "UNWIND", fault_party: "SELLER", rationale: "Undisclosed frame damage on a settled sale" }
              as: Arbitrator
              as_user_id: "arb-decide-02"
            - call: "POST /arbitration/cases/${case2_id}/decision"
              payload: { outcome: "UNWIND", fault_party: "SELLER", rationale: "Undisclosed unibody damage on an unsettled sale" }
              as: Arbitrator
              as_user_id: "arb-decide-02"
          assert:
            - "compensation ARMED — GET /arbitration/sales/${sale1_id}/ledger-entries returns exactly 4 rows in created_at ASC order: (SELLER, SALE_PROCEEDS, +1450000), (BUYER, SALE_PROCEEDS, -1450000), (BUYER, SALE_PROCEEDS_REVERSAL, +1450000), (SELLER, SALE_PROCEEDS_REVERSAL, -1450000)"
            - "invariant L1 on sale 1 — the sum of amount_signed_cents over all 4 rows is exactly 0"
            - "invariant L2 on sale 1 — the SELLER rows net to 0 (+1450000 - 1450000) and the BUYER rows net to 0 (-1450000 + 1450000); no party is left holding a balance"
            - "compensation DISARMED — GET /arbitration/sales/${sale2_id}/ledger-entries returns exactly 0 rows, because no proceeds were ever released on sale 2"
            - "decision 1 returns sale_price_refund_cents == 1450000, fee_offset_applied_cents == 0, total_buyer_payout_cents == 1450000 and every transport share == 0"
            - "decision 2 returns sale_price_refund_cents == 900000, fee_offset_applied_cents == 0 and total_buyer_payout_cents == 900000 — the payout figure is identical in shape whether or not reversal rows were posted"
            - "GET /arbitration/sales/${sale1_id} returns settlement_status == \"REVERSED\" and arbitration_status == \"RESOLVED\"; GET /arbitration/sales/${sale2_id} returns settlement_status == \"REVERSED\" and arbitration_status == \"RESOLVED\""
            - "both cases reach status \"UNWOUND\" and GET /arbitration/cases/${case1_id}/decision and ${case2_id}/decision each return exactly 1 row"
            - "no tier consequence — GET /arbitration/sellers/${seller_id}/scorecard returns rolling_window_sales_count == 2, rolling_window_upheld_count == 2, rolling_arbitration_rate_bps == 10000 and policy_tier == \"GOOD_STANDING\", because 2 sales is below MIN_SCORECARD_SALES 4"

      - name: open_claim_counters_restored_by_withdraw_and_by_sweep_expiry
        grounds:
          - calculations.open_claim_counter_invariant
          - state_machines.ArbitrationCase.SUBMITTED_to_WITHDRAWN
          - state_machines.ArbitrationCase.SUBMITTED_to_EXPIRED
          - state_machines.AuctionSale.arbitration_status_ACTIVE_to_NONE
          - calculations.sweep_processing
        distinguishing_aspect: |
          Invariants C1-C4 released by TWO different compensating paths in one test — an
          explicit buyer withdrawal and an implicit sweep expiry — and the invariant is
          asymmetric: open_claim_count on the buyer, the seller and the sale must all
          return to their pre-claim values and the sale's arbitration_status must fall back
          to NONE, while Buyer.lifetime_claim_count is a monotonic counter that must NOT be
          reversed by either path. The trailing idempotent sweep proves the release is
          applied once, not once per call.
        test_recipe:
          setup:
            - "one Seller, one Buyer and the MECHANICAL policy with window_hours 48 and min_claim_amount_cents 60000"
            - "TWO AuctionSale rows at hammer_time_utc 2026-08-01T00:00:00Z"
            - "one MECHANICAL case on each sale, both filed at the default clock 2026-08-01T00:00:00Z and both left in SUBMITTED (no review is ever opened)"
            - "before the trigger the counters read: Buyer.open_claim_count 2 and lifetime_claim_count 2, Seller.open_claim_count 2, and each sale ACTIVE with open_case_count 1"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "YELLOW", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale1_id: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE22222", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 900000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 61000, light_channel: "YELLOW", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale2_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale1_id}", defect_class: "MECHANICAL", claim_amount_cents: 100000, odometer_at_claim: 84100, complaint_text: "Transmission slips in third" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_withdraw_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale2_id}", defect_class: "MECHANICAL", claim_amount_cents: 100000, odometer_at_claim: 61100, complaint_text: "Engine misfire under load" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_expire_id: $.data.id }
            - call: "GET /arbitration/buyers/${buyer_id}"
              payload: {}
              as: AuctionAdmin
            - call: "GET /arbitration/sellers/${seller_id}"
              payload: {}
              as: AuctionAdmin
          trigger:
            - call: "POST /arbitration/cases/${case_withdraw_id}/withdraw"
              payload: { withdraw_reason: "Shop found the fault was pre-existing wear the buyer accepted" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:01Z" }
              as: AuctionAdmin
            - call: "POST /_ops/run-arbitration-sweep"
              payload: {}
              as: AuctionAdmin
            - call: "POST /_ops/run-arbitration-sweep"
              payload: {}
              as: AuctionAdmin
          assert:
            - "pre-trigger state — the setup GET /arbitration/buyers/${buyer_id} returns open_claim_count == 2 and lifetime_claim_count == 2, and the setup GET /arbitration/sellers/${seller_id} returns open_claim_count == 2"
            - "path 1 (explicit withdraw) — HTTP 200 with status == \"WITHDRAWN\"; GET /arbitration/sales/${sale1_id} returns open_case_count == 0 and arbitration_status == \"NONE\""
            - "path 2 (sweep expiry) — the first sweep returns inspections_expired == 0, rounds_expired == 0, seller_response_timeouts == 0 and cases_expired == 1"
            - "path 2 — GET /arbitration/cases/${case_expire_id} returns status == \"EXPIRED\"; GET /arbitration/sales/${sale2_id} returns open_case_count == 0 and arbitration_status == \"NONE\""
            - "invariants C1-C3 restored — GET /arbitration/buyers/${buyer_id} returns open_claim_count == 0 and GET /arbitration/sellers/${seller_id} returns open_claim_count == 0, back to their pre-claim values"
            - "invariant C4 is monotonic and NOT compensated — GET /arbitration/buyers/${buyer_id} still returns lifetime_claim_count == 2 after both releases"
            - "the second sweep at the same clock returns all four counters == 0 and leaves every counter above unchanged"
            - "neither release moved money — GET /arbitration/sales/${sale1_id}/ledger-entries and GET /arbitration/sales/${sale2_id}/ledger-entries both return 0 rows, and both sales are still settlement_status \"UNSETTLED\" with settlement_hold false"
            - "no seller consequence — GET /arbitration/sellers/${seller_id}/scorecard returns rolling_window_upheld_count == 0, rolling_arbitration_rate_bps == 0 and policy_tier == \"GOOD_STANDING\""
