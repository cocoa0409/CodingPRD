            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "R1", recipient_email: "r1@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { minutes_pre: "$.data.booked_chair_minutes" } }
          trigger:
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "R2", recipient_email: "r2@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${acct_id}", captures: { c2: "$.data.id" } }
            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { minutes_mid: "$.data.booked_chair_minutes" } }
            - { call: "POST /chair-massage/slot-claims/${c2}/cancel", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { minutes_post: "$.data.booked_chair_minutes" } }
          assert:
            - "Pre pair: booked_chair_minutes == 15"
            - "Mid pair (after claim): booked_chair_minutes == 30"
            - "Post pair (after cancel): booked_chair_minutes == 15 — invariant restored"

      - name: outstanding_balance_invariant_under_issue_and_void
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.DISPUTED_to_VOID
