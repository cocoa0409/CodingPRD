- section: consistency_model
  instances:
  - name: derived_fields_are_visible_in_the_same_mutation_response
    claim_type: Immediate visibility
    grounds:
    - complexity_profile.consistency_model
    - entities.TreatmentEpisode.fields.care_level_status
    - entities.Facility.fields.facility_posture
    distinguishing_aspect: Every derived value a mutation produces is returned in that mutation's own
      response envelope rather than only on a subsequent read, so no re-read is needed to observe admitted_at,
      care_level_status or facility_posture.
    test_recipe:
      setup:
      - Logical clock advances 2026-09-01 → 2026-09-08. A fully prepared AWAITING_ADMISSION episode on
        a licensed facility.
