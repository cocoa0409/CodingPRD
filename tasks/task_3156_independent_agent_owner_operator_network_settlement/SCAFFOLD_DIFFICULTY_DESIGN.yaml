              payload: { effective_at: "2026-09-03T00:00:00Z" }
              as: SettlementOperator
              as_user_id: "so-ops-1"
          assert:
            - "before the settle CapacityOwner.${bco_id}.maintenance_balance_cents == ${maint_before} == 0"
            - "the settle returns 200 and creates exactly 1 MAINTENANCE_DEPOSIT row whose amount_cents == 2400"
            - "immediately after the settle CapacityOwner.${bco_id}.maintenance_balance_cents == 2400, equal to ceil(1237/1000)*1200"
            - "after the reversal CapacityOwner.${bco_id}.maintenance_balance_cents == 0, exactly the pre-settle value — zero drift"
            - "the reversal row carries transaction_type MAINTENANCE_WITHDRAWAL and reverses_transaction_id == ${mtx_id}"
            - "CapacityOwner.${bco_id}.escrow_balance_cents is unchanged by the reversal pair: 250000 before the settle and 250000 after the reversal"

      - name: advance_and_repayment_are_escrow_balance_neutral
        grounds:
          - endpoints.POST_/_events/run_advance_post
          - endpoints.POST_/network/escrow-transactions/{id}/reverse
          - entities.CapacityOwner.fields.escrow_balance_cents
          - entities.EscrowTransaction.fields.resulting_escrow_balance_cents
          - errors.ERR_ESCROW_ALREADY_MATCHED
        distinguishing_aspect: "The conserved quantity is CapacityOwner.escrow_balance_cents, and the pair is the advance-forward versus its ADVANCE_REPAYMENT compensation: 250000 is observed, dips to exactly 50000 on the advance, and returns to exactly 250000 — while the escrow floor crossing flips qualification_posture to QUALIFICATION_RESTRICTED and back, giving a second independent observation of the same invariant."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One enrolled BCO carrying a 250000 escrow deposit and no advance history."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-TX-102", legal_name: "Medina Valley Trucking LLC", home_terminal_city: "Hondo", revenue_split_pct: 0.68, oa_enrolled: false, liability_insurance_deductible_cents: 250000 }
              as: NetworkAdministrator
              captures: { bco_id: $.data.id }
            - call: "POST /network/escrow-transactions"
              payload: { capacity_owner_id: "${bco_id}", transaction_type: "ESCROW_DEPOSIT", amount_cents: 250000, effective_at: "2026-09-01T00:00:00Z" }
              as: SettlementOperator
            - call: "GET /network/capacity-owners/${bco_id}"
              payload: {}
              as: SettlementOperator
              captures: { escrow_snapshot: $.data.escrow_balance_cents }
          trigger:
            - call: "POST /_events/run_advance_post"
              payload: { capacity_owner_id: "${bco_id}", amount_cents: 200000, effective_at: "2026-09-01T05:00:00Z" }
              as: SettlementOperator
              captures: { adv_tx: $.data.advance_transaction_id, adv_bal: $.data.escrow_balance_cents }
            - call: "POST /network/escrow-transactions/${adv_tx}/reverse"
              payload: { effective_at: "2026-09-01T06:00:00Z" }
              as: SettlementOperator
          assert:
            - "the pre-advance snapshot reports escrow_balance_cents == 250000"
            - "the advance response reports adv_bal == 50000, a net debit of exactly 200000"
            - "CapacityOwner.${bco_id}.outstanding_advance_cents == 200000 immediately after the advance"
            - "CapacityOwner.${bco_id}.qualification_posture == QUALIFICATION_RESTRICTED after the advance, because 50000 is below the 100000 escrow floor"
            - "after the reversal CapacityOwner.${bco_id}.escrow_balance_cents == 250000, exactly the snapshot value"
            - "after the reversal CapacityOwner.${bco_id}.outstanding_advance_cents == 0 and qualification_posture == QUALIFICATION_CLEAR"
            - "a second POST /network/escrow-transactions/${adv_tx}/reverse returns 402 ERR_ESCROW_ALREADY_MATCHED, so the compensation cannot be applied twice and inflate the balance"
