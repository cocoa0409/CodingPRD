              as: ConversionEngineer
              captures: { a1: $.data.id }
            - call: "POST /api/v1/accounts"
              payload: {project_id: "${pid}",  legacy_account_number: "L-2", account_type: "DEPOSIT", product_type_id: "${pt}", opening_principal_cents: 2000, statement_cycle_day: 1, accrual_start_date: "2026-09-01" }
              as: ConversionEngineer
              captures: { a2: $.data.id }
            - call: "GET /api/v1/conversions/${pid}"
              payload: {}
              as: ConversionEngineer
              captures: { v0: $.data.version }
            - call: "POST /api/v1/accounts/${a1}/map"
              payload: { gl_account_id: "${gl}", expected_project_version: "${v0}" }
              as: ConversionEngineer
          trigger:
            - call: "POST /api/v1/accounts/${a2}/map"
              payload: { gl_account_id: "${gl}", expected_project_version: "${v0} - 0" }
              as: ConversionEngineer
              captures: { err: $.data.error_id }
            - call: "GET /api/v1/conversions/${pid}"
              payload: {}
              as: ConversionEngineer
              captures: { v1: $.data.version }
            - call: "POST /api/v1/accounts/${a2}/map"
              payload: { gl_account_id: "${gl}", expected_project_version: "${v1}" }
              as: ConversionEngineer
              captures: { st: $.data.status }
          assert:
            - "err == ERR_STALE_VERSION and http 412 (${v0} is now stale after A1's map bumped the project version)"
            - "st == MAPPED (retry with fresh version succeeds)"

