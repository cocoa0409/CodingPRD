scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_provisional_vs_final_on_assignment
        grounds:
          - calculations.assignment_fee
          - entities.Assignment.fields.provisional_fee_cents
          - entities.Assignment.fields.final_fee_cents
          - state_machines.Assignment.ACTIVE_to_ENDED
        distinguishing_aspect: "Same MEDIUM assignment yields provisional 6000 (base+deposit) at creation but final 7012 at settle (adds water overage + work-hour penalty, credits deposit) — the dual variant lives on the Assignment/money domain."
        test_recipe:
          setup:
            - "MEDIUM plot directly assigned to a gardener; provisional_fee_cents == 6000 (5000 base + 1000 deposit)"
            - "3 water readings 201 gal each (free 200/period) and 10 logged work hours (required 12) before settle"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Elm Community Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "M-1", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Ada Root", email: "ada@example.com" }
              as: GardenManager
              captures: { ada_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${ada_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id", prov: "$.data.provisional_fee_cents" }
            - call: "POST /water-readings"
              payload: { assignment_id: "${asg_id}", period_index: 1, gallons_used: 201, recorded_on: "2026-04-01T00:00:00Z" }
              as: Gardener
              as_user_id: "${ada_id}"
            - call: "POST /water-readings"
              payload: { assignment_id: "${asg_id}", period_index: 2, gallons_used: 201, recorded_on: "2026-05-01T00:00:00Z" }
              as: Gardener
              as_user_id: "${ada_id}"
            - call: "POST /water-readings"
              payload: { assignment_id: "${asg_id}", period_index: 3, gallons_used: 201, recorded_on: "2026-06-01T00:00:00Z" }
              as: Gardener
              as_user_id: "${ada_id}"
            - call: "POST /work-logs"
              payload: { assignment_id: "${asg_id}", hours: 10, logged_on: "2026-06-15T00:00:00Z" }
              as: Gardener
              as_user_id: "${ada_id}"
          trigger:
            - call: "POST /assignments/${asg_id}/settle"
              payload: {}
              as: GardenManager
          assert:
            - "Assignment.${asg_id}.provisional_fee_cents == 6000"
            - "Assignment.${asg_id}.final_fee_cents == 7012"
            - "Assignment.${asg_id}.final_fee_cents != Assignment.${asg_id}.provisional_fee_cents"

      - name: priority_score_snapshot_vs_live
        grounds:
          - calculations.renewal_priority_score
          - entities.Application.fields.priority_score_at_submission
          - entities.Gardener.fields.strike_count
          - state_machines.Application.WAITLISTED_to_OFFERED
        distinguishing_aspect: "The live as_of_allocation score (Gardener domain) drops GA to -3 after a strike so the LARGE offer goes to GB (score 5); the frozen snapshot (both 5, GA earlier) would have picked GA — winner flips, proving live recomputation."
        test_recipe:
          setup:
            - "GA holds a MEDIUM assignment and applies for a LARGE plot; snapshot score 5 (tenure0/GOOD/0 strikes)"
            - "GB applies for the same LARGE plot; score 5"
            - "a compliance case then strikes GA (strike_count 1, standing PROBATION) so GA live score becomes -3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Oak Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "M-0", size: "MEDIUM" }
              as: GardenManager
              captures: { p0_id: "$.data.id", p0_v: "$.data.version" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "L-1", size: "LARGE" }
              as: GardenManager
              captures: { pL_id: "$.data.id" }
            - call: "POST /gardeners"
              payload: { full_name: "Gia Alder", email: "ga@example.com" }
              as: GardenManager
              captures: { ga_id: "$.data.id" }
            - call: "POST /gardeners"
              payload: { full_name: "Gil Birch", email: "gb@example.com" }
              as: GardenManager
              captures: { gb_id: "$.data.id" }
            - call: "POST /plots/${p0_id}/assign"
              payload: { gardener_id: "${ga_id}", expected_plot_version: "${p0_v}" }
              as: GardenManager
              captures: { asg0_id: "$.data.id" }
            - call: "POST /applications"
              payload: { gardener_id: "${ga_id}", garden_id: "${garden_id}", requested_size: "LARGE" }
              as: Gardener
              as_user_id: "${ga_id}"
              captures: { appA_id: "$.data.id", snapA: "$.data.priority_score_at_submission" }
            - call: "POST /applications"
              payload: { gardener_id: "${gb_id}", garden_id: "${garden_id}", requested_size: "LARGE" }
              as: Gardener
              as_user_id: "${gb_id}"
              captures: { appB_id: "$.data.id" }
            - call: "POST /compliance-cases"
              payload: { assignment_id: "${asg0_id}", violation_type: "NEGLECT" }
              as: GardenManager
              captures: { cc_id: "$.data.id" }
          trigger:
            - call: "POST /plots/${pL_id}/offer"
              payload: {}
              as: GardenManager
              captures: { offered_app: "$.data.id" }
          assert:
            - "Application.${appA_id}.priority_score_at_submission == 5"
            - "Application.${appB_id}.status == OFFERED"
            - "Application.${appA_id}.status == WAITLISTED"

  # =================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_fee_nonlinear_three_inputs
        grounds:
          - calculations.assignment_fee
          - calculations.water_overage_charge
          - entities.Assignment.fields.final_fee_cents
          - state_machines.Assignment.ACTIVE_to_ENDED
        distinguishing_aspect: "Mode (a): the SMALL final fee 7245 = max(0, base 3000 + water overage 245 + work penalty 4500 - deposit 500) combines three interacting inputs (size tier, water usage, work shortfall) through a nested max floor."
        test_recipe:
          setup:
            - "SMALL plot assigned; readings 150/120/100 gal (free 100) and only 5 of 8 required hours logged before settle"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Fir Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "S-1", size: "SMALL" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Sol Vine", email: "sol@example.com" }
              as: GardenManager
              captures: { sol_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${sol_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /water-readings"
              payload: { assignment_id: "${asg_id}", period_index: 1, gallons_used: 150, recorded_on: "2026-04-01T00:00:00Z" }
              as: Gardener
              as_user_id: "${sol_id}"
            - call: "POST /water-readings"
              payload: { assignment_id: "${asg_id}", period_index: 2, gallons_used: 120, recorded_on: "2026-05-01T00:00:00Z" }
              as: Gardener
              as_user_id: "${sol_id}"
            - call: "POST /water-readings"
              payload: { assignment_id: "${asg_id}", period_index: 3, gallons_used: 100, recorded_on: "2026-06-01T00:00:00Z" }
              as: Gardener
              as_user_id: "${sol_id}"
            - call: "POST /work-logs"
              payload: { assignment_id: "${asg_id}", hours: 5, logged_on: "2026-06-15T00:00:00Z" }
              as: Gardener
              as_user_id: "${sol_id}"
          trigger:
            - call: "POST /assignments/${asg_id}/settle"
              payload: {}
              as: GardenManager
          assert:
            - "Assignment.${asg_id}.final_fee_cents == 7245"

      - name: water_overage_rounding_order
        grounds:
          - calculations.water_overage_charge
          - entities.WaterReading.fields.gallons_used
          - entities.Assignment.fields.final_fee_cents
          - state_machines.Assignment.ACTIVE_to_ENDED
        distinguishing_aspect: "Mode (b): rounding order is pinned — three periods of 201 gal (overage 1 each, 3.5 cents rounds to 4) sum to 12 cents; summing overage first (3 gal * 3.5 = 10.5 -> 11) is wrong, so final 4012 not 4011."
        test_recipe:
          setup:
            - "MEDIUM plot assigned; readings 201/201/201 (free 200/period), 12 hours logged (requirement met, no penalty)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Ash Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "M-2", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Fen Reed", email: "fen@example.com" }
              as: GardenManager
              captures: { fen_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${fen_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /water-readings"
              payload: { assignment_id: "${asg_id}", period_index: 1, gallons_used: 201, recorded_on: "2026-04-01T00:00:00Z" }
              as: Gardener
              as_user_id: "${fen_id}"
            - call: "POST /water-readings"
              payload: { assignment_id: "${asg_id}", period_index: 2, gallons_used: 201, recorded_on: "2026-05-01T00:00:00Z" }
              as: Gardener
              as_user_id: "${fen_id}"
            - call: "POST /water-readings"
              payload: { assignment_id: "${asg_id}", period_index: 3, gallons_used: 201, recorded_on: "2026-06-01T00:00:00Z" }
              as: Gardener
              as_user_id: "${fen_id}"
            - call: "POST /work-logs"
              payload: { assignment_id: "${asg_id}", hours: 12, logged_on: "2026-06-15T00:00:00Z" }
              as: Gardener
              as_user_id: "${fen_id}"
          trigger:
            - call: "POST /assignments/${asg_id}/settle"
              payload: {}
              as: GardenManager
          assert:
            - "Assignment.${asg_id}.final_fee_cents == 4012"

  # =================================================================
  # Rule 3 — non-linear state-machine shapes on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_parallel_occupancy_and_fee_axes
        grounds:
          - state_machines.Assignment.UNPAID_to_PAID
          - state_machines.Assignment.ACTIVE_to_RENEWAL_PENDING
          - entities.Assignment.fields.occupancy_status
          - entities.Assignment.fields.fee_status
        distinguishing_aspect: "Assignment carries two independent axes: fee_status advances UNPAID->PAID while occupancy stays ACTIVE, then occupancy advances ACTIVE->RENEWAL_PENDING with fee_status still PAID — parallel dimensions on one entity."
        test_recipe:
          setup:
            - "MEDIUM plot assigned to GA (balance 6000); fee paid in full (balance 0), then renewal requested"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Birch Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "M-3", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Ivy Cole", email: "ivy@example.com" }
              as: GardenManager
              captures: { ivy_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${ivy_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /assignments/${asg_id}/pay"
              payload: { amount_cents: 6000 }
              as: Treasurer
          trigger:
            - call: "POST /assignments/${asg_id}/request-renewal"
              payload: {}
              as: Gardener
              as_user_id: "${ivy_id}"
          assert:
            - "Assignment.${asg_id}.fee_status == PAID"
            - "Assignment.${asg_id}.occupancy_status == RENEWAL_PENDING"

      - name: compliance_case_branches_cured_vs_escalated
        grounds:
          - state_machines.ComplianceCase.WARNED_to_CURED
          - state_machines.ComplianceCase.WARNED_to_ESCALATED
          - entities.ComplianceCase.fields.status
          - entities.ComplianceCase.fields.cure_deadline
        distinguishing_aspect: "From WARNED the ComplianceCase forks to CURED (within deadline) here, versus ESCALATED past deadline — a branching (fork) shape on ComplianceCase, a different entity than Assignment."
        test_recipe:
          setup:
            - "compliance case on an assignment, WARNED at 2026-03-15 (cure_deadline 2026-03-29); resolved while clock still before deadline"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Cedar Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "M-4", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Rue Hale", email: "rue@example.com" }
              as: GardenManager
              captures: { rue_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${rue_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /compliance-cases"
              payload: { assignment_id: "${asg_id}", violation_type: "RULE_BREACH" }
              as: GardenManager
              captures: { cc_id: "$.data.id" }
            - call: "POST /compliance-cases/${cc_id}/warn"
              payload: {}
              as: GardenManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: GardenManager
          trigger:
            - call: "POST /compliance-cases/${cc_id}/resolve"
              payload: {}
              as: GardenManager
          assert:
            - "ComplianceCase.${cc_id}.status == CURED"
            - "Assignment.${asg_id}.occupancy_status == ACTIVE"

  # =================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: forfeiture_reassignment_cascade
        grounds:
          - state_machines.Assignment.ACTIVE_to_FORFEITED
          - state_machines.Plot.ASSIGNED_to_AVAILABLE
          - state_machines.Plot.AVAILABLE_to_RESERVED
          - state_machines.Application.WAITLISTED_to_OFFERED
        distinguishing_aspect: "Depth-3 chain from POST /forfeit: Assignment->FORFEITED mutates the Plot->AVAILABLE, which itself triggers the auto-offer mutating the top waitlisted Application->OFFERED (Plot->RESERVED)."
        test_recipe:
          setup:
            - "MEDIUM plot assigned to GA; GB is WAITLISTED for a MEDIUM plot in the same garden"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Maple Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "M-5", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Ada Fern", email: "adaf@example.com" }
              as: GardenManager
              captures: { ga_id: "$.data.id" }
            - call: "POST /gardeners"
              payload: { full_name: "Bo Sage", email: "bo@example.com" }
              as: GardenManager
              captures: { gb_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${ga_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /applications"
              payload: { gardener_id: "${gb_id}", garden_id: "${garden_id}", requested_size: "MEDIUM" }
              as: Gardener
              as_user_id: "${gb_id}"
              captures: { appB_id: "$.data.id" }
          trigger:
            - call: "POST /assignments/${asg_id}/forfeit"
              payload: {}
              as: GardenManager
          assert:
            - "Assignment.${asg_id}.occupancy_status == FORFEITED"
            - "Plot.${plot_id}.status == RESERVED"
            - "Plot.${plot_id}.current_assignment_id == null"
            - "Application.${appB_id}.status == OFFERED"

      - name: abandonment_forfeiture_cascade
        grounds:
          - state_machines.ComplianceCase.WARNED_to_ESCALATED
          - state_machines.Assignment.ACTIVE_to_FORFEITED
          - state_machines.Plot.ASSIGNED_to_AVAILABLE
          - entities.ComplianceCase.fields.cure_deadline
        distinguishing_aspect: "Depth-3 chain from POST /escalate (a different trigger): ComplianceCase->ESCALATED forces its Assignment->FORFEITED, which frees the Plot->AVAILABLE; no waitlist exists so the chain stops at the plot."
        test_recipe:
          setup:
            - "assignment with a WARNED compliance case (deadline 2026-03-29); clock advanced to 2026-03-30 past the deadline; no waitlisted applicants"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Pine Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "M-6", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Cy Thorn", email: "cy@example.com" }
              as: GardenManager
              captures: { cy_id: "$.data.id" }
            - call: "POST /plots/${plot_id}/assign"
              payload: { gardener_id: "${cy_id}", expected_plot_version: "${plot_v}" }
              as: GardenManager
              captures: { asg_id: "$.data.id" }
            - call: "POST /compliance-cases"
              payload: { assignment_id: "${asg_id}", violation_type: "NEGLECT" }
              as: GardenManager
              captures: { cc_id: "$.data.id" }
            - call: "POST /compliance-cases/${cc_id}/warn"
              payload: {}
              as: GardenManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-30T00:00:00Z" }
              as: GardenManager
          trigger:
            - call: "POST /compliance-cases/${cc_id}/escalate"
              payload: {}
              as: GardenManager
          assert:
            - "ComplianceCase.${cc_id}.status == ESCALATED"
            - "Assignment.${asg_id}.occupancy_status == FORFEITED"
            - "Plot.${plot_id}.status == AVAILABLE"
            - "Plot.${plot_id}.current_assignment_id == null"

  # =================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: plot_not_available_beats_season_conflict_returns_state_error
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_PLOT_NOT_AVAILABLE]
          - errors[ERR_PLOT_SEASON_CONFLICT]
        distinguishing_aspect: "On assign, an ASSIGNED plot triggers BOTH the state check (ERR_PLOT_NOT_AVAILABLE, priority 5) and the temporal season-overlap check (ERR_PLOT_SEASON_CONFLICT, priority 10); the state error wins — the pair is state vs business_temporal."
        test_recipe:
          setup:
            - "MEDIUM plot already assigned to GA (ASSIGNED, with a season-overlapping non-terminal assignment); GB attempts a second assign with a fresh plot version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: GardenManager
            - call: "POST /gardens"
              payload: { name: "Willow Garden", season_label: "2026-MAIN", season_start: "2026-03-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: GardenManager
              captures: { garden_id: "$.data.id" }
            - call: "POST /plots"
              payload: { garden_id: "${garden_id}", label: "M-7", size: "MEDIUM" }
              as: GardenManager
              captures: { plot_id: "$.data.id", plot_v: "$.data.version" }
            - call: "POST /gardeners"
              payload: { full_name: "Ada Moss", email: "adam@example.com" }
              as: GardenManager
              captures: { ga_id: "$.data.id" }
            - call: "POST /gardeners"
