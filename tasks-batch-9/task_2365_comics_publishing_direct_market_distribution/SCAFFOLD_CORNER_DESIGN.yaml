        as: EditorInChief
        captures: {t1: $.data.id, tv0: $.data.version}
      trigger:
      - call: POST /comics/titles/${t1}/greenlight
        payload: {}
        as: EditorInChief
        captures: {tv1: $.data.version}
      assert: ['Title.${t1}.status == GREENLIT', 'Title.${t1}.greenlit_at == ''2026-08-01T00:00:00Z''',
        '${tv1} == ${tv0} + 1 (the transition bumps Title.version exactly once)', 'Title.${t1}.committed_share_bps
          == 0 (greenlight touches no ledger)']
