          - calculations.markdown_reserve
        distinguishing_aspect: "One month, two weeks of actuals, and the SAME row read twice: basis=PROJECTED_BASIS returns otb_planned 16,585,000 while basis=PLANNED_BASIS returns 18,835,000 - a 2,250,000 spread that is exactly projected_bom minus the authored bom. Neither read persists anything: the PlanMonth row keeps active_basis PROJECTED_BASIS and the projected numbers the second ActualsPost wrote, and its version does not move across either call. The PLANNED_BASIS read is not a rewind to the month's original state either - it reuses the PERSISTED markdown_reserve_cents of 1,335,000, which was recomputed on projected figures, so it does not equal the 700,000 reserve the month carried at approval."
