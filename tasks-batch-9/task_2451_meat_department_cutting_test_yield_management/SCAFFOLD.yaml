# =============================================================================
# PRD Benchmark Scaffold — Meat Department Cutting Test & Yield Management
# §1.0 Response Envelope, §1.1 Entities, §1.2 State Machines, §1.2.1 Concurrency
# Rules, §1.3 Calculations, §1.4 Validations, §1.5 Endpoints, §1.6 Errors,
# §1.7 RBAC.  Difficulty design (§1.8) and corner design (§1.9) live in the two
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2451. Meat Department Cutting Test & Yield Management (supermarket meat department): primal purchase cost and cutting test yield percentages by subprimal, retail price setting from yield-adjusted cost and target margin, case plan by facing counts and expected movement, grind schedule with trim usage and country-of-origin segregation, sell-by dating, re-work rules and prohibited re-grind practices, temperature log compliance and case-failure response, special order and holiday roast pre-order management, shrink and markdown reconciliation to the yield model

domain_name: "meat-department-yield-management"
api_prefix: "/meat-ops"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Peer entities linked by FKs plus a many-to-many junction (GrindInput joins
  # GrindRun x TrimLot) and a self-referential edge (TrimLot.source_trim_lot_id
  # for re-worked trim). No URL nesting beyond one sub-resource level.

  state_machine_shape: cyclic
  # Cycles: CuttingTest SUBMITTED->REJECTED->DRAFT->SUBMITTED (bounded by
  # revision_count), CasePlanLine FILLED->HELD->FILLED, CaseFailure
  # CONTAINED->OPEN, PreOrder CONFIRMED->REQUESTED, ShrinkReconciliation
  # DRAFT->DISPUTED->DRAFT. CasePlan additionally carries two independent state
  # dimensions (plan_status x fill_status) and GrindRun branches
  # IN_PROGRESS->{COMPLETED, ABORTED} with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- Department
  - name: Department
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        required: true
        description: "Meat department display name."
        constraints: "1..120 chars"
      - name: store_code
        type: string
        source: input
        required: true
        description: "Store identifier for the department."
        constraints: "unique across Department; 2..16 chars uppercase"
      - name: target_margin_pct
        type: number
        source: input
        required: false
        description: "Default gross-margin target used by retail_price_per_lb when a RetailItem does not override it."
        default: 0.32
        constraints: "0 <= target_margin_pct <= 0.60; 4 decimal places"
      - name: shelf_life_days_ground
        type: integer
        source: input
        required: false
        description: "Sell-by shelf life in days for GROUND product and for any re-worked trim."
        default: 2
        constraints: "1..10"
      - name: shelf_life_days_whole_muscle
        type: integer
        source: input
        required: false
        description: "Sell-by shelf life in days for WHOLE_MUSCLE product."
        default: 5
        constraints: "1..20"
      - name: shelf_life_days_vac_packed
        type: integer
        source: input
        required: false
        description: "Sell-by shelf life in days for VAC_PACKED product."
        default: 14
        constraints: "1..45"
      - name: max_safe_case_temp_c
        type: number
        source: input
        required: false
        description: "Highest in-spec case temperature in Celsius; a TemperatureLog reading strictly above this value is out of spec."
        default: 4.4
        constraints: "0.0 <= max_safe_case_temp_c < critical_case_temp_c; 1 decimal place"
      - name: critical_case_temp_c
        type: number
        source: input
        required: false
        description: "Celsius reading at or above which a single TemperatureLog immediately opens a CaseFailure."
        default: 7.0
        constraints: "> max_safe_case_temp_c; 1 decimal place"
      - name: pickup_slot_capacity
        type: integer
        source: input
        required: false
        description: "Maximum number of already-scheduled PreOrder pickup windows that a new pickup window may collide with."
        default: 2
        constraints: "1..10"
      - name: grind_sanitation_buffer_min
        type: integer
        source: input
        required: false
        description: "Minutes of grinder idle time required between two GrindRun windows whose country-of-origin labels differ."
        default: 30
        constraints: "0..240"
      - name: markdown_floor_pct
        type: number
        source: input
        required: false
        description: "Markdown price floor expressed as a markup over a RetailItem's yield_adjusted_cost_per_lb_cents."
        default: 0.10
        constraints: "0 <= markdown_floor_pct <= 0.50; 4 decimal places"
      - name: shrink_tolerance_pct
        type: number
        source: input
        required: false
        description: "Absolute variance_pct tolerance a ShrinkReconciliation must satisfy to post without an override reason."
        default: 0.015
        constraints: "0 < shrink_tolerance_pct <= 0.25; 4 decimal places"
      - name: deposit_rate
        type: number
        source: input
        required: false
        description: "Fraction of a PreOrder's quoted extended price collected as a deposit."
        default: 0.25
        constraints: "0 <= deposit_rate <= 1.0; 4 decimal places"
      - name: case_posture
        type: enum
        source: computed
        required: false
        description: "Derived operating posture gating case-plan fills and grind starts; recomputed by case_posture_derivation."
        default: "SALES_OPEN"
        constraints: "SALES_OPEN | SALES_RESTRICTED | SALES_HALTED"
      - name: open_case_failure_count
        type: integer
        source: computed
        required: false
        description: "Count of CaseFailure rows for this department whose status == OPEN or ESCALATED."
        default: 0
        constraints: ">= 0"
      - name: contained_case_failure_count
        type: integer
        source: computed
        required: false
        description: "Count of CaseFailure rows for this department whose status == CONTAINED."
        default: 0
        constraints: ">= 0"
      - name: consecutive_out_of_spec_readings
        type: integer
        source: computed
        required: false
        description: "Length of the current run of out-of-spec TemperatureLog readings for this department, in created_at ASC order; reset to 0 by an in-spec reading."
        default: 0
        constraints: "0..2"

  # ----------------------------------------------------------- PrimalPurchase
  - name: PrimalPurchase
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        required: true
        description: "FK -> Department.id; the department that received this primal."
      - name: primal_code
        type: enum
        source: input
        required: true
        description: "Primal identifier as invoiced by the vendor."
        constraints: "BEEF_RIBEYE_LIP_ON | BEEF_STRIP_LOIN | PORK_LOIN_BONELESS | BEEF_CHUCK_ROLL"
      - name: product_class
        type: enum
        source: input
        required: true
        description: "Packaging class of the received primal; constrains which RetailItem classes its cuts may price."
        constraints: "WHOLE_MUSCLE | VAC_PACKED"
      - name: country_of_origin
        type: enum
        source: input
        required: true
        description: "Country-of-origin code carried by every cut and every trim lot derived from this primal."
        constraints: "USA | CAN | MEX | AUS"
      - name: vendor_name
        type: string
        source: input
        required: true
        description: "Supplying vendor name as printed on the invoice."
        constraints: "1..120 chars"
      - name: gross_weight_lb
        type: number
        source: input
        required: true
        description: "Invoiced gross weight in pounds."
        constraints: "> 0; 2 decimal places"
      - name: invoice_cost_cents
        type: integer
        source: input
        required: true
        description: "Vendor invoice extended cost in cents."
        constraints: "> 0"
      - name: freight_cost_cents
        type: integer
        source: input
        required: false
        description: "Freight charged on this primal in cents."
        default: 0
        constraints: ">= 0"
      - name: vendor_allowance_cents
        type: integer
        source: input
        required: false
        description: "Vendor allowance/credit in cents, subtracted from landed cost."
        default: 0
        constraints: ">= 0"
      - name: receiving_shrink_lb
        type: number
        source: input
        required: false
        description: "Pounds discarded at receiving (purge, packaging) and excluded from net weight."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: received_at
        type: datetime
        source: input
        required: true
        description: "Receiving timestamp, ISO 8601 UTC."
      - name: net_weight_lb
        type: number
        source: computed
        required: false
        description: "gross_weight_lb - receiving_shrink_lb, per landed_cost_derivation."
        constraints: "> 0; 2 decimal places"
      - name: landed_cost_total_cents
        type: integer
        source: computed
        required: false
        description: "invoice_cost_cents + freight_cost_cents - vendor_allowance_cents, per landed_cost_derivation."
        constraints: ">= 0"
      - name: landed_cost_per_lb_cents
        type: number
        source: computed
        required: false
        description: "landed_cost_total_cents / net_weight_lb, per landed_cost_derivation."
        constraints: "4 decimal places, round_half_up"
      - name: allocated_cost_cents
        type: integer
        source: computed
        required: false
        description: "Sum of CuttingTestLine.allocated_cost_cents over the lines of this purchase's APPROVED CuttingTest; 0 when no test is APPROVED."
        default: 0
        constraints: "0 <= allocated_cost_cents <= landed_cost_total_cents"
      - name: unallocated_cost_cents
        type: integer
        source: computed
        required: false
        description: "landed_cost_total_cents - allocated_cost_cents; the conserved residual of the cost ledger."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        required: false
        description: "Purchase lifecycle state; see §1.2 PrimalPurchase."
        default: "RECEIVED"
        constraints: "RECEIVED | CUT_TESTED | RECONCILED"

  # --------------------------------------------------------------- CuttingTest
  - name: CuttingTest
    parent: null
    common_fields: true
    fields:
      - name: primal_purchase_id
        type: string
        source: input
        required: true
        description: "FK -> PrimalPurchase.id; the primal broken down by this cutting test."
      - name: test_weight_lb
        type: number
        source: input
        required: true
        description: "Pounds placed on the bench for the test; must equal the purchase's net_weight_lb."
        constraints: "> 0; 2 decimal places"
      - name: submitted_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID captured on the DRAFT -> SUBMITTED transition; segregation-of-duties source for approval."
      - name: approved_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID captured on the SUBMITTED -> APPROVED transition."
      - name: rejection_reason
        type: string
        source: input
        required: false
        description: "Reason recorded on the SUBMITTED -> REJECTED transition."
        constraints: "1..280 chars when supplied"
      - name: revision_count
        type: integer
        source: computed
        required: false
        description: "Number of completed REJECTED -> DRAFT revisions; the cycle is bounded by REVISION_LIMIT."
        default: 0
        constraints: "0..2"
      - name: total_yield_weight_lb
        type: number
        source: computed
        required: false
        description: "Sum of CuttingTestLine.yield_weight_lb over all lines of this test, per cutting_test_yield_metrics."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: unaccounted_lb
        type: number
        source: computed
        required: false
        description: "test_weight_lb - total_yield_weight_lb; must satisfy |unaccounted_lb| <= UNACCOUNTED_TOLERANCE_LB at submit."
        default: 0
        constraints: "2 decimal places, may be negative"
      - name: salable_yield_pct
        type: number
        source: computed
        required: false
        description: "Share of test_weight_lb in lines with disposition == SALABLE_CUT, per cutting_test_yield_metrics."
        default: 0
        constraints: "4 decimal places, round_half_up"
      - name: trim_yield_pct
        type: number
        source: computed
        required: false
        description: "Share of test_weight_lb in lines with disposition == GRIND_TRIM, per cutting_test_yield_metrics."
        default: 0
        constraints: "4 decimal places, round_half_up"
      - name: loss_pct
        type: number
        source: computed
        required: false
        description: "Share of test_weight_lb in lines with disposition == FAT_BONE_LOSS, per cutting_test_yield_metrics."
        default: 0
        constraints: "4 decimal places, round_half_up"
      - name: status
        type: enum
        source: computed
        required: false
        description: "Cutting-test lifecycle state; see §1.2 CuttingTest."
        default: "DRAFT"
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED"

  # ----------------------------------------------------------- CuttingTestLine
  - name: CuttingTestLine
    parent: CuttingTest
    common_fields: true
    fields:
      - name: cutting_test_id
        type: string
        source: input
        required: true
        description: "FK -> CuttingTest.id; the test this yield line belongs to."
      - name: retail_item_id
        type: string
        source: input
        required: false
        description: "FK -> RetailItem.id; the retail item this salable cut prices, required when disposition == SALABLE_CUT and forbidden otherwise."
      - name: line_seq
        type: integer
        source: input
        required: true
        description: "Author-assigned line order; pins the deterministic rounding order of subprimal_cost_allocation."
        constraints: "1..40; unique per cutting_test_id"
      - name: subprimal_code
        type: string
        source: input
        required: true
        description: "Subprimal or by-product name for this yield line."
        constraints: "1..60 chars"
      - name: disposition
        type: enum
        source: input
        required: true
        description: "How this yield line leaves the bench."
        constraints: "SALABLE_CUT | GRIND_TRIM | FAT_BONE_LOSS"
      - name: yield_weight_lb
        type: number
        source: input
        required: true
        description: "Pounds recorded for this line on the bench scale."
        constraints: ">= 0; 2 decimal places"
      - name: market_value_per_lb_cents
        type: integer
        source: input
        required: true
        description: "Market value per pound used as the cost-allocation weight; must be 0 when disposition == FAT_BONE_LOSS and > 0 otherwise."
        constraints: ">= 0"
      - name: lean_pct
        type: number
        source: input
        required: false
        description: "Lean percentage of this line's trim, required when disposition == GRIND_TRIM and forbidden otherwise."
        constraints: "50.0 <= lean_pct <= 99.0; 1 decimal place"
      - name: allocated_cost_cents
        type: integer
        source: computed
        required: false
        description: "Share of the purchase's landed_cost_total_cents assigned to this line by subprimal_cost_allocation; 0 until the test is APPROVED and 0 again once SUPERSEDED."
        default: 0
        constraints: ">= 0"
      - name: allocated_cost_per_lb_cents
        type: number
        source: computed
        required: false
        description: "allocated_cost_cents / yield_weight_lb; the yield-adjusted cost basis for salable cuts and trim."
        default: 0
        constraints: "4 decimal places, round_half_up"

  # ----------------------------------------------------------------- RetailItem
  - name: RetailItem
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        required: true
        description: "FK -> Department.id; the department that merchandises this item."
      - name: item_code
        type: string
        source: input
        required: true
        description: "Scale/PLU code for the item."
        constraints: "unique per department_id; 2..24 chars"
      - name: subprimal_code
        type: string
        source: input
        required: true
        description: "Subprimal or blend name this item is cut from."
        constraints: "1..60 chars"
      - name: product_class
        type: enum
        source: input
        required: true
        description: "Merchandising class; drives cost_basis_source, facing pounds and shelf life."
        constraints: "GROUND | WHOLE_MUSCLE | VAC_PACKED"
      - name: country_of_origin_label
        type: enum
        source: computed
        required: false
        description: "Country-of-origin label printed on the package: for GROUND items the label of the most recent COMPLETED GrindRun targeting this item, for other classes the country_of_origin of the PrimalPurchase behind the item's cost basis."
        default: "PENDING"
        constraints: "PENDING | USA | CAN | MEX | AUS | MULTIPLE"
      - name: target_margin_pct
        type: number
        source: input
        required: false
        description: "Item-level gross-margin override; when null the Department.target_margin_pct applies."
        constraints: "0 <= target_margin_pct <= 0.60; 4 decimal places"
      - name: cost_basis_source
        type: enum
        source: computed
        required: false
        description: "CUT_TEST_LINE when product_class IN {WHOLE_MUSCLE, VAC_PACKED}; GRIND_BLEND when product_class == GROUND."
        constraints: "CUT_TEST_LINE | GRIND_BLEND"
      - name: pricing_yield_pct_snapshot
        type: number
        source: computed
        required: false
        description: "Salable-yield fraction used to build provisional_price_per_lb_cents: STANDARD_SALABLE_YIELD_PCT at proposal time, replaced by the approved CuttingTest.salable_yield_pct at activation."
        default: 0
        constraints: "4 decimal places, round_half_up"
      - name: yield_adjusted_cost_per_lb_cents
        type: number
        source: computed
        required: false
        description: "Cost basis fed into retail_price_per_lb: the APPROVED CuttingTestLine.allocated_cost_per_lb_cents for CUT_TEST_LINE items, or the latest COMPLETED GrindRun blend cost per pound for GRIND_BLEND items."
        default: 0
        constraints: ">= 0; 4 decimal places, round_half_up"
      - name: provisional_price_per_lb_cents
        type: integer
        source: computed
        required: false
        description: "Price produced by the provisional_price variant of retail_price_per_lb at proposal time."
        default: 0
        constraints: ">= 0; ends in digit 9 when > 0"
      - name: final_price_per_lb_cents
        type: integer
        source: computed
        required: false
        description: "Price produced by the final_price variant of retail_price_per_lb at activation time."
        default: 0
        constraints: ">= 0; ends in digit 9 when > 0"
      - name: active_price_per_lb_cents
        type: integer
        source: computed
        required: false
        description: "Price currently charged at the scale: provisional_price_per_lb_cents while price_status == PROPOSED, final_price_per_lb_cents once PRICED."
        default: 0
        constraints: ">= 0"
      - name: price_variance_pct
        type: number
        source: computed
        required: false
        description: "(final_price_per_lb_cents - provisional_price_per_lb_cents) / provisional_price_per_lb_cents, recorded at activation; 0 when no provisional price exists."
        default: 0
        constraints: "4 decimal places, round_half_up; may be negative"
      - name: shelf_life_days
        type: integer
        source: computed
        required: false
        description: "Shelf life copied from the Department field matching product_class; used by sell_by_dating."
        default: 0
        constraints: ">= 0"
      - name: price_status
        type: enum
        source: computed
        required: false
        description: "Pricing lifecycle state; see §1.2 RetailItem."
        default: "UNPRICED"
        constraints: "UNPRICED | PROPOSED | PRICED | REPRICE_REQUIRED | SUSPENDED"

  # ------------------------------------------------------------------ CasePlan
  - name: CasePlan
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        required: true
        description: "FK -> Department.id; the department this service-day plan belongs to."
      - name: service_date
        type: string
        source: input
        required: true
        description: "Service day the plan covers, ISO 8601 date."
        constraints: "unique per department_id; YYYY-MM-DD"
      - name: published_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID captured on the DRAFT -> PUBLISHED transition."
      - name: total_expected_movement_lb
        type: number
        source: computed
        required: false
        description: "Sum of CasePlanLine.expected_movement_lb over all lines of this plan."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: total_required_fill_lb
        type: number
        source: computed
        required: false
        description: "Sum of CasePlanLine.required_fill_lb over all lines of this plan."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: total_actual_fill_lb
        type: number
        source: computed
        required: false
        description: "Sum of CasePlanLine.actual_fill_lb over all lines of this plan."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: price_stale_line_count
        type: integer
        source: computed
        required: false
        description: "Count of this plan's CasePlanLine rows whose price_stale == true."
        default: 0
        constraints: ">= 0"
      - name: plan_status
        type: enum
        source: computed
        required: false
        description: "Publication dimension of the plan state; evolves independently of fill_status. See §1.2 CasePlan."
        default: "DRAFT"
        constraints: "DRAFT | PUBLISHED | SUSPENDED | CLOSED"
      - name: fill_status
        type: enum
        source: computed
        required: false
        description: "Execution dimension of the plan state, derived from total_actual_fill_lb versus total_required_fill_lb; evolves independently of plan_status."
        default: "UNFILLED"
        constraints: "UNFILLED | PARTIAL | FILLED"

  # -------------------------------------------------------------- CasePlanLine
  - name: CasePlanLine
    parent: CasePlan
    common_fields: true
    fields:
      - name: case_plan_id
        type: string
        source: input
        required: true
        description: "FK -> CasePlan.id; the plan this line belongs to."
      - name: retail_item_id
        type: string
        source: input
        required: true
        description: "FK -> RetailItem.id; the item merchandised on this line."
      - name: line_seq
        type: integer
        source: input
        required: true
        description: "Author-assigned line order within the plan."
        constraints: "1..60; unique per case_plan_id"
      - name: facings
        type: integer
        source: input
        required: true
        description: "Number of case facings allotted to the item."
        constraints: "1..12"
      - name: expected_movement_lb
        type: number
        source: input
        required: true
        description: "Forecast pounds of movement for the service day."
        constraints: "> 0; 2 decimal places"
      - name: required_fill_lb
        type: number
        source: computed
        required: false
        description: "Pounds the case must be filled with, per required_fill_derivation; halved when the department posture is SALES_RESTRICTED at line creation."
        default: 0
        constraints: ">= 0; 2 decimal places, round_half_up"
      - name: actual_fill_lb
        type: number
        source: computed
        required: false
        description: "Cumulative pounds recorded against this line by fill events."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: staged_lb
        type: number
        source: computed
        required: false
        description: "Pounds of actual_fill_lb reserved for STAGED PreOrder rows pointing at this line."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: pack_date
        type: string
        source: computed
        required: false
        description: "Date of the first fill event on this line, taken from the logical clock; ISO 8601 date."
      - name: sell_by_date
        type: string
        source: computed
        required: false
        description: "pack_date + RetailItem.shelf_life_days, per sell_by_dating; ISO 8601 date."
      - name: markdown_lb
        type: number
        source: computed
        required: false
        description: "Cumulative pounds marked down on this line."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: markdown_price_per_lb_cents
        type: integer
        source: computed
        required: false
        description: "Marked-down price per pound recorded by the most recent markdown event on this line."
        default: 0
        constraints: ">= 0"
      - name: markdown_dollars_cents
        type: integer
        source: computed
        required: false
        description: "Cumulative markdown give-up in cents, per markdown_valuation."
        default: 0
        constraints: ">= 0"
      - name: shrink_lb
        type: number
        source: computed
        required: false
        description: "Cumulative pounds discarded from this line by shrink events."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: price_stale
        type: boolean
        source: computed
        required: false
        description: "true when the line's RetailItem entered REPRICE_REQUIRED after this line was published."
        default: false
      - name: held_from_status
        type: enum
        source: computed
        required: false
        description: "Line status recorded when a posture cascade moved the line to HELD; restored when the hold is released."
        constraints: "FILLED | MARKED_DOWN"
      - name: line_status
        type: enum
        source: computed
        required: false
        description: "Line lifecycle state; see §1.2 CasePlanLine."
        default: "PLANNED"
        constraints: "PLANNED | FILLED | MARKED_DOWN | HELD | SHRUNK_OUT"

  # -------------------------------------------------------------------- TrimLot
  - name: TrimLot
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        required: true
        description: "FK -> Department.id; the department holding this trim lot."
      - name: cutting_test_line_id
        type: string
        source: input
        required: false
        description: "FK -> CuttingTestLine.id; the GRIND_TRIM line this lot was harvested from. Exactly one of cutting_test_line_id and source_trim_lot_id MUST be supplied."
      - name: source_trim_lot_id
        type: string
        source: input
        required: false
        description: "FK -> TrimLot.id; the parent lot this lot was re-worked from. Exactly one of cutting_test_line_id and source_trim_lot_id MUST be supplied."
      - name: lot_code
        type: string
        source: input
        required: true
        description: "Lot identifier printed on the combo tag."
        constraints: "unique per department_id; 2..24 chars"
      - name: received_lb
        type: number
        source: input
        required: true
        description: "Pounds placed into the lot at creation."
        constraints: "> 0; 2 decimal places"
      - name: pack_date
        type: string
        source: input
        required: true
        description: "Date the lot was packed, ISO 8601 date."
      - name: country_of_origin
        type: enum
        source: computed
        required: false
        description: "Country of origin inherited from the source CuttingTestLine's PrimalPurchase, or from source_trim_lot_id for a re-worked lot."
        constraints: "USA | CAN | MEX | AUS"
      - name: lean_pct
        type: number
        source: computed
        required: false
        description: "Lean percentage inherited from the source CuttingTestLine.lean_pct, or from source_trim_lot_id for a re-worked lot."
        constraints: "50.0 <= lean_pct <= 99.0; 1 decimal place"
      - name: cost_per_lb_cents
        type: number
        source: computed
        required: false
        description: "Cost per pound inherited from the source CuttingTestLine.allocated_cost_per_lb_cents, or from source_trim_lot_id for a re-worked lot."
        default: 0
        constraints: ">= 0; 4 decimal places, round_half_up"
      - name: rework_generation
        type: integer
        source: computed
        required: false
        description: "0 for a lot harvested from a CuttingTestLine; source lot's rework_generation + 1 for a re-worked lot. Values above REGRIND_GENERATION_LIMIT are prohibited."
        default: 0
        constraints: "0..1"
      - name: allocated_lb
        type: number
        source: computed
        required: false
        description: "Pounds committed to GrindRun rows in status SCHEDULED or IN_PROGRESS via GrindInput."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: consumed_lb
        type: number
        source: computed
        required: false
        description: "Pounds consumed by COMPLETED GrindRun rows via GrindInput."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: discarded_lb
        type: number
        source: computed
        required: false
        description: "Pounds written off by the AVAILABLE/PARTIALLY_COMMITTED -> DISCARDED transition."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: remaining_lb
        type: number
        source: computed
        required: false
        description: "received_lb - allocated_lb - consumed_lb - discarded_lb; the lot's uncommitted balance."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: sell_by_date
        type: string
        source: computed
        required: false
        description: "pack_date + Department.shelf_life_days_ground, per sell_by_dating; ISO 8601 date."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Trim lot lifecycle state; see §1.2 TrimLot."
        default: "AVAILABLE"
        constraints: "AVAILABLE | PARTIALLY_COMMITTED | FULLY_COMMITTED | CONSUMED | DISCARDED"

  # ------------------------------------------------------------------- GrindRun
  - name: GrindRun
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        required: true
        description: "FK -> Department.id; the department whose grinder is occupied by this run."
      - name: target_retail_item_id
        type: string
        source: input
        required: true
        description: "FK -> RetailItem.id; the GROUND item this run produces."
      - name: fill_case_plan_line_id
        type: string
        source: input
        required: false
        description: "FK -> CasePlanLine.id; the case line the finished batch fills on completion."
      - name: scheduled_start_at
        type: datetime
        source: input
        required: true
        description: "Start of the grinder occupation window, ISO 8601 UTC; windows are half-open [start, end)."
      - name: scheduled_end_at
        type: datetime
        source: input
        required: true
        description: "End of the grinder occupation window, ISO 8601 UTC, exclusive; must be strictly after scheduled_start_at."
      - name: declared_coo
        type: enum
        source: input
        required: true
        description: "Country-of-origin segregation block the run is scheduled under; the grinder must be sanitized between blocks with different declared_coo values, and the blend's derived coo_label must match this declaration at completion."
        constraints: "USA | CAN | MEX | AUS | MULTIPLE"
      - name: target_lean_pct
        type: number
        source: input
        required: true
        description: "Lean percentage the finished blend must hit."
        constraints: "60.0 <= target_lean_pct <= 95.0; 1 decimal place"
      - name: lean_tolerance_pct
        type: number
        source: input
        required: false
        description: "Allowed absolute deviation of blended_lean_pct from target_lean_pct at completion."
        default: 2.0
        constraints: "0.0 < lean_tolerance_pct <= 10.0; 1 decimal place"
      - name: batch_weight_lb
        type: number
        source: computed
        required: false
        description: "Sum of GrindInput.weight_lb over the run's inputs, per grind_blend_derivation."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: blended_lean_pct
        type: number
        source: computed
        required: false
        description: "Weight-weighted lean percentage of the run's inputs, per grind_blend_derivation."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: blend_cost_per_lb_cents
        type: number
        source: computed
        required: false
        description: "Weight-weighted TrimLot.cost_per_lb_cents of the run's inputs, per grind_blend_derivation; becomes the target item's yield_adjusted_cost_per_lb_cents on completion."
        default: 0
        constraints: ">= 0; 4 decimal places, round_half_up"
      - name: coo_label
        type: enum
        source: computed
        required: false
        description: "Country-of-origin label of the blend: the single shared TrimLot.country_of_origin when all inputs agree, MULTIPLE when they differ, PENDING while the run has no inputs."
        default: "PENDING"
        constraints: "PENDING | USA | CAN | MEX | AUS | MULTIPLE"
      - name: started_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID captured on the SCHEDULED -> IN_PROGRESS transition."
      - name: abort_reason
        type: string
        source: input
        required: false
        description: "Reason recorded on the IN_PROGRESS -> ABORTED transition."
        constraints: "1..280 chars when supplied"
      - name: completed_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock timestamp of the IN_PROGRESS -> COMPLETED transition."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Grind run lifecycle state; see §1.2 GrindRun."
        default: "SCHEDULED"
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | ABORTED"

  # ----------------------------------------------------------------- GrindInput
  - name: GrindInput
    parent: GrindRun
    common_fields: true
    fields:
      - name: grind_run_id
        type: string
        source: input
        required: true
        description: "FK -> GrindRun.id; the run consuming this trim."
      - name: trim_lot_id
        type: string
        source: input
        required: true
        description: "FK -> TrimLot.id; the lot supplying this trim."
        constraints: "unique per (grind_run_id, trim_lot_id)"
      - name: input_seq
        type: integer
        source: input
        required: true
        description: "Author-assigned input order within the run."
        constraints: "1..20; unique per grind_run_id"
      - name: weight_lb
        type: number
        source: input
        required: true
        description: "Pounds drawn from the trim lot into this run."
        constraints: "> 0; 2 decimal places"
      - name: consumed
        type: boolean
        source: computed
        required: false
        description: "true once the owning GrindRun reaches COMPLETED; reset to false is impossible because COMPLETED is terminal."
        default: false

  # ------------------------------------------------------------- TemperatureLog
  - name: TemperatureLog
    parent: Department
    common_fields: false
    fields:
      - name: department_id
        type: string
        source: input
        required: true
        description: "FK -> Department.id; the department whose case was read."
      - name: case_code
        type: string
        source: input
        required: true
        description: "Identifier of the display case that was read."
        constraints: "1..24 chars"
      - name: reading_c
        type: number
        source: input
        required: true
        description: "Case temperature in Celsius at the moment of reading."
        constraints: "-10.0 <= reading_c <= 15.0; 1 decimal place"
      - name: taken_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock timestamp stamped when the reading is posted."
      - name: recorded_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the clerk who posted the reading."
      - name: out_of_spec
        type: boolean
        source: computed
        required: false
        description: "true when reading_c > Department.max_safe_case_temp_c, per case_posture_derivation."
        default: false
      - name: consecutive_index
        type: integer
        source: computed
        required: false
        description: "Value of Department.consecutive_out_of_spec_readings after this reading was applied, in created_at ASC order."
        default: 0
        constraints: "0..2"

  # ---------------------------------------------------------------- CaseFailure
  - name: CaseFailure
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        required: true
        description: "FK -> Department.id; the department whose case failed."
      - name: trigger_temperature_log_id
        type: string
        source: input
        required: true
        description: "FK -> TemperatureLog.id; the reading whose posting opened this failure."
      - name: case_code
        type: string
        source: computed
        required: false
        description: "case_code copied from the triggering TemperatureLog."
      - name: opened_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock timestamp at which the failure was opened; escalation is measured from this instant."
      - name: reported_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the clerk whose reading opened the failure; segregation-of-duties source for resolution."
      - name: peak_reading_c
        type: number
        source: computed
        required: false
        description: "Highest reading_c observed on this case while the failure has been open."
        constraints: "1 decimal place"
      - name: reopen_count
        type: integer
        source: computed
        required: false
        description: "Number of completed CONTAINED -> OPEN cycles on this failure."
        default: 0
        constraints: ">= 0"
      - name: containment_note
        type: string
        source: input
        required: false
        description: "Note recorded on the OPEN -> CONTAINED transition."
        constraints: "1..280 chars when supplied"
      - name: disposition
        type: enum
        source: input
        required: false
        description: "Product disposition decided at resolution."
        default: "NONE"
        constraints: "NONE | MARKDOWN | DISCARD"
      - name: affected_line_count
        type: integer
        source: computed
        required: false
        description: "Count of CasePlanLine rows moved to HELD by this failure's posture cascade."
        default: 0
        constraints: ">= 0"
      - name: contained_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock timestamp of the most recent OPEN -> CONTAINED transition."
      - name: escalated_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock timestamp of the OPEN -> ESCALATED transition."
      - name: resolved_at
        type: datetime
        source: computed
        required: false
        description: "Logical-clock timestamp of the transition into RESOLVED."
      - name: resolved_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID captured on the transition into RESOLVED; must differ from reported_by_user_id."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Case-failure lifecycle state; see §1.2 CaseFailure."
        default: "OPEN"
        constraints: "OPEN | CONTAINED | ESCALATED | RESOLVED"

  # ------------------------------------------------------------------- PreOrder
  - name: PreOrder
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        required: true
        description: "FK -> Department.id; the department taking the special order."
      - name: retail_item_id
        type: string
        source: input
        required: true
        description: "FK -> RetailItem.id; the item ordered."
      - name: staged_case_plan_line_id
        type: string
        source: input
        required: false
        description: "FK -> CasePlanLine.id; the case line the order is staged against."
      - name: customer_name
        type: string
        source: input
        required: true
        description: "Customer name on the order ticket."
        constraints: "1..120 chars"
      - name: customer_phone
        type: string
        source: input
        required: true
        description: "Customer callback number."
        constraints: "7..20 chars"
      - name: requested_weight_lb
        type: number
        source: input
        required: true
        description: "Pounds the customer reserved."
        constraints: "> 0; 2 decimal places"
      - name: pickup_window_start_at
        type: datetime
        source: input
        required: true
        description: "Start of the promised pickup window, ISO 8601 UTC; pickup windows are closed intervals [start, end]."
      - name: pickup_window_end_at
        type: datetime
        source: input
        required: true
        description: "End of the promised pickup window, ISO 8601 UTC, inclusive; must be strictly after pickup_window_start_at."
      - name: quoted_price_per_lb_cents
        type: integer
        source: computed
        required: false
        description: "RetailItem.active_price_per_lb_cents pinned at confirmation time."
        default: 0
        constraints: ">= 0"
      - name: pinned_retail_item_version
        type: integer
        source: computed
        required: false
        description: "RetailItem.version pinned at confirmation time, so later repricing does not move the quote."
        default: 0
        constraints: ">= 0"
      - name: deposit_cents
        type: integer
        source: computed
        required: false
        description: "Deposit collected at confirmation, per pre_order_deposit_settlement."
        default: 0
        constraints: ">= 0"
      - name: deposit_applied_cents
        type: integer
        source: computed
        required: false
        description: "Deposit applied to the sale at pickup."
        default: 0
        constraints: ">= 0"
      - name: deposit_refund_cents
        type: integer
        source: computed
        required: false
        description: "Deposit returned to the customer on cancellation, per pre_order_deposit_settlement."
        default: 0
        constraints: ">= 0"
      - name: deposit_forfeited_cents
        type: integer
        source: computed
        required: false
        description: "Deposit retained by the store on forfeiture or partial cancellation refund, per pre_order_deposit_settlement."
        default: 0
        constraints: ">= 0"
      - name: amend_count
        type: integer
        source: computed
        required: false
        description: "Number of completed CONFIRMED -> REQUESTED amendment cycles; bounded by AMEND_LIMIT."
        default: 0
        constraints: "0..2"
      - name: status
        type: enum
        source: computed
        required: false
        description: "Pre-order lifecycle state; see §1.2 PreOrder."
        default: "REQUESTED"
        constraints: "REQUESTED | CONFIRMED | STAGED | HELD | PICKED_UP | CANCELLED | FORFEITED"

  # ------------------------------------------------------ ShrinkReconciliation
  - name: ShrinkReconciliation
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        required: true
        description: "FK -> Department.id; the department being reconciled."
      - name: period_start_date
        type: string
        source: input
        required: true
        description: "First service day in the reconciled period, inclusive; ISO 8601 date."
      - name: period_end_date
        type: string
        source: input
        required: true
        description: "Last service day in the reconciled period, inclusive; must be >= period_start_date; ISO 8601 date."
      - name: basis
        type: enum
        source: input
        required: true
        description: "Which variant of shrink_variance_reconciliation computes this row."
        constraints: "YIELD_MODEL | PHYSICAL_COUNT"
      - name: expected_salable_lb
        type: number
        source: computed
        required: false
        description: "Expected salable pounds for the period under the selected basis, per shrink_variance_reconciliation."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: physical_salable_lb
        type: number
        source: computed
        required: false
        description: "Observed salable pounds for the period under the selected basis, per shrink_variance_reconciliation."
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: variance_lb
        type: number
        source: computed
        required: false
        description: "physical_salable_lb - expected_salable_lb."
        default: 0
        constraints: "2 decimal places; may be negative"
      - name: variance_pct
        type: number
        source: computed
        required: false
        description: "variance_lb / expected_salable_lb; 0 when expected_salable_lb == 0."
        default: 0
        constraints: "4 decimal places, round_half_up; may be negative"
      - name: within_tolerance
        type: boolean
        source: computed
        required: false
        description: "true when abs(variance_pct) <= Department.shrink_tolerance_pct."
        default: false
      - name: markdown_dollars_cents
        type: integer
        source: computed
        required: false
        description: "Sum of CasePlanLine.markdown_dollars_cents over the period's in-scope lines."
        default: 0
        constraints: ">= 0"
      - name: shrink_dollars_cents
        type: integer
        source: computed
        required: false
        description: "Retail value of discarded pounds for the period, per shrink_variance_reconciliation."
        default: 0
        constraints: ">= 0"
      - name: override_reason
        type: string
        source: input
        required: false
        description: "Reason required to post a reconciliation whose within_tolerance == false."
        constraints: "1..280 chars when supplied"
      - name: dispute_reason
        type: string
        source: input
        required: false
        description: "Reason recorded on the POSTED -> DISPUTED transition."
        constraints: "1..280 chars when supplied"
      - name: posted_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID captured on the DRAFT -> POSTED transition."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Reconciliation lifecycle state; see §1.2 ShrinkReconciliation."
        default: "DRAFT"
        constraints: "DRAFT | POSTED | DISPUTED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ------------------------------------------------- CuttingTest (revision cycle)
  - entity: CuttingTest
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /meat-ops/cutting-tests/{id}/transitions action=SUBMIT"
        actor: MeatCutter
        preconditions:
          - "test has >= 1 CuttingTestLine"
          - "test has >= 1 line with disposition == SALABLE_CUT, else ERR_NO_SALABLE_YIELD"
          - "abs(unaccounted_lb) <= UNACCOUNTED_TOLERANCE_LB, else ERR_YIELD_NOT_RECONCILED"
          - "every line with disposition IN {SALABLE_CUT, GRIND_TRIM} has market_value_per_lb_cents > 0, else ERR_NO_MARKET_VALUE_BASIS"
        side_effects:
          - "sets submitted_by_user_id to the caller's X-User-ID"
          - "recomputes total_yield_weight_lb, unaccounted_lb, salable_yield_pct, trim_yield_pct, loss_pct per cutting_test_yield_metrics"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /meat-ops/cutting-tests/{id}/transitions action=APPROVE"
        actor: MeatManager
        preconditions:
          - "X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the parent PrimalPurchase.status == RECEIVED"
        side_effects:
          - "sets approved_by_user_id to the caller's X-User-ID"
          - "runs subprimal_cost_allocation and writes CuttingTestLine.allocated_cost_cents / allocated_cost_per_lb_cents for every line"
          - "CASCADE A hop 1: PrimalPurchase.allocated_cost_cents and unallocated_cost_cents are recomputed and PrimalPurchase.status becomes CUT_TESTED"
          - "CASCADE A hop 2: each SALABLE_CUT line's RetailItem has yield_adjusted_cost_per_lb_cents recomputed from allocated_cost_per_lb_cents (derived-field reconciliation)"
          - "CASCADE A hop 3: each such RetailItem whose price_status == PRICED recomputes final_price_per_lb_cents via retail_price_per_lb (final_price variant); when abs(new - active_price_per_lb_cents) / active_price_per_lb_cents > REPRICE_THRESHOLD_PCT the item moves PRICED -> REPRICE_REQUIRED"
          - "CASCADE A hop 4: every CasePlanLine of a PUBLISHED CasePlan that references an item moved to REPRICE_REQUIRED sets price_stale = true and increments its CasePlan.price_stale_line_count"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /meat-ops/cutting-tests/{id}/transitions action=REJECT"
        actor: MeatManager
        preconditions:
          - "X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "rejection_reason supplied"
        side_effects:
          - "stores rejection_reason"
          - "leaves every CuttingTestLine.allocated_cost_cents at 0"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /meat-ops/cutting-tests/{id}/transitions action=REVISE"
        actor: MeatCutter
        preconditions:
          - "revision_count < REVISION_LIMIT, else ERR_REVISION_LIMIT_REACHED"
        side_effects:
          - "increments revision_count by 1"
          - "clears rejection_reason and submitted_by_user_id"
        note: "Closes the DRAFT -> SUBMITTED -> REJECTED -> DRAFT cycle; REVISION_LIMIT bounds it at 2 revisions."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /meat-ops/cutting-tests (a newer test is created against the same PrimalPurchase)"
        actor: system
        preconditions:
          - "the creating request carries a non-stale expected_primal_purchase_version, else ERR_STALE_PARENT_VERSION"
        side_effects:
          - "COMPENSATION: every CuttingTestLine of the superseded test has allocated_cost_cents and allocated_cost_per_lb_cents reset to 0"
          - "PrimalPurchase.allocated_cost_cents returns to 0, unallocated_cost_cents returns to landed_cost_total_cents, status returns to RECEIVED"
          - "increments PrimalPurchase.version by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /meat-ops/cutting-tests (a newer test is created against the same PrimalPurchase)"
        actor: system
        preconditions:
          - "the creating request carries a non-stale expected_primal_purchase_version, else ERR_STALE_PARENT_VERSION"
        side_effects:
          - "increments PrimalPurchase.version by 1"

  # ----------------------------------------------- PrimalPurchase (revert cycle)
  - entity: PrimalPurchase
    initial_state: RECEIVED
    terminal_states: [RECONCILED]
    transitions:
      - from: RECEIVED
        to: CUT_TESTED
        trigger: "POST /meat-ops/cutting-tests/{id}/transitions action=APPROVE on a test of this purchase"
        actor: system
        preconditions:
          - "the approving test's primal_purchase_id == this purchase id"
        side_effects:
          - "allocated_cost_cents becomes the sum of the approved test's line allocations; unallocated_cost_cents becomes landed_cost_total_cents - allocated_cost_cents"
      - from: CUT_TESTED
        to: RECEIVED
        trigger: "POST /meat-ops/cutting-tests (a newer test supersedes the approved one)"
        actor: system
        preconditions:
          - "an APPROVED CuttingTest exists on this purchase"
        side_effects:
          - "allocated_cost_cents returns to 0 and unallocated_cost_cents returns to landed_cost_total_cents"
        note: "CUT_TESTED -> RECEIVED -> CUT_TESTED is the purchase-side cost-ledger cycle."
      - from: CUT_TESTED
        to: RECONCILED
        trigger: "POST /meat-ops/shrink-reconciliations/{id}/transitions action=POST covering this purchase's received_at date"
        actor: system
        preconditions:
          - "the posting reconciliation's department_id == this purchase's department_id"
          - "date(received_at) BETWEEN period_start_date AND period_end_date, inclusive"
        side_effects:
          - "purchase becomes read-only: no further CuttingTest may be created against it (ERR_INVALID_STATE_TRANSITION)"

  # ------------------------------------------------------- RetailItem (pricing)
  - entity: RetailItem
    initial_state: UNPRICED
    terminal_states: []
    transitions:
      - from: UNPRICED
        to: PROPOSED
        trigger: "POST /meat-ops/retail-items/{id}/price-proposals"
        actor: PricingAnalyst
        preconditions:
          - "the referenced PrimalPurchase belongs to the same department, else ERR_DEPARTMENT_MISMATCH"
          - "the referenced PrimalPurchase.product_class is compatible with this item's product_class, else ERR_PRODUCT_CLASS_MISMATCH"
        side_effects:
          - "sets pricing_yield_pct_snapshot = STANDARD_SALABLE_YIELD_PCT"
          - "computes provisional_price_per_lb_cents via retail_price_per_lb (provisional_price variant) and copies it into active_price_per_lb_cents"
          - "sets shelf_life_days from the Department shelf-life field matching product_class"
      - from: PROPOSED
        to: PRICED
        trigger: "POST /meat-ops/retail-items/{id}/price-activations"
        actor: MeatManager
        preconditions:
          - "expected_retail_item_version matches the item's current version, else ERR_STALE_PARENT_VERSION"
          - "for cost_basis_source == CUT_TEST_LINE the referenced CuttingTest.status == APPROVED, else ERR_SOURCE_TEST_NOT_APPROVED"
          - "for cost_basis_source == GRIND_BLEND a COMPLETED GrindRun targeting this item exists, else ERR_COST_BASIS_UNAVAILABLE"
        side_effects:
          - "sets pricing_yield_pct_snapshot from the approved CuttingTest.salable_yield_pct (CUT_TEST_LINE) or leaves it at 0 (GRIND_BLEND)"
          - "computes final_price_per_lb_cents via retail_price_per_lb (final_price variant) and copies it into active_price_per_lb_cents"
          - "computes price_variance_pct from provisional versus final price"
          - "sets country_of_origin_label from the cost-basis source"
          - "increments version by 1"
      - from: PRICED
        to: REPRICE_REQUIRED
        trigger: "POST /meat-ops/cutting-tests/{id}/transitions action=APPROVE (cost basis moved) or POST /meat-ops/grind-runs/{id}/transitions action=COMPLETE (blend cost moved)"
        actor: system
        preconditions:
          - "abs(recomputed final price - active_price_per_lb_cents) / active_price_per_lb_cents > REPRICE_THRESHOLD_PCT"
        side_effects:
          - "final_price_per_lb_cents is refreshed while active_price_per_lb_cents keeps the stale value charged at the scale"
          - "every CasePlanLine of a PUBLISHED CasePlan referencing this item sets price_stale = true and increments its CasePlan.price_stale_line_count"
      - from: REPRICE_REQUIRED
        to: PRICED
        trigger: "POST /meat-ops/retail-items/{id}/price-activations"
        actor: MeatManager
        preconditions:
          - "expected_retail_item_version matches the item's current version, else ERR_STALE_PARENT_VERSION"
        side_effects:
          - "active_price_per_lb_cents catches up to final_price_per_lb_cents"
          - "every CasePlanLine referencing this item sets price_stale = false and decrements its CasePlan.price_stale_line_count"
          - "increments version by 1"
      - from: PRICED
        to: SUSPENDED
        trigger: "POST /meat-ops/retail-items/{id}/transitions action=SUSPEND"
        actor: MeatManager
        preconditions:
          - "no PreOrder referencing this item is in status STAGED"
        side_effects:
          - "no new CasePlanLine or PreOrder may reference the item while SUSPENDED (ERR_ITEM_NOT_PRICED)"
      - from: PROPOSED
        to: SUSPENDED
        trigger: "POST /meat-ops/retail-items/{id}/transitions action=SUSPEND"
        actor: MeatManager
        preconditions:
          - "no PreOrder referencing this item is in status STAGED"
        side_effects:
          - "no new CasePlanLine or PreOrder may reference the item while SUSPENDED (ERR_ITEM_NOT_PRICED)"
      - from: SUSPENDED
        to: PRICED
        trigger: "POST /meat-ops/retail-items/{id}/transitions action=REINSTATE"
        actor: MeatManager
        preconditions:
          - "final_price_per_lb_cents > 0"
        side_effects:
          - "active_price_per_lb_cents is restored to final_price_per_lb_cents"

  # --------------------------------- CasePlan (two independent state dimensions)
  - entity: CasePlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /meat-ops/case-plans/{id}/transitions action=PUBLISH"
        actor: MeatManager
        preconditions:
          - "plan has >= 1 CasePlanLine"
          - "Department.case_posture != SALES_HALTED, else ERR_POSTURE_SALES_HALTED"
          - "every line's RetailItem.price_status IN {PROPOSED, PRICED}, else ERR_ITEM_NOT_PRICED"
        side_effects:
          - "sets published_by_user_id"
          - "recomputes total_expected_movement_lb and total_required_fill_lb"
          - "fill_status is left on its own dimension (UNFILLED until fills arrive)"
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "POST /meat-ops/case-plans/{id}/transitions action=SUSPEND, or the case_posture cascade of POST /meat-ops/temperature-logs"
        actor: MeatManager
        preconditions:
          - "service_date >= the logical clock's current date"
        side_effects:
          - "CASCADE B hop 2: every CasePlanLine in status FILLED or MARKED_DOWN records held_from_status and moves to HELD"
          - "CASCADE B hop 3: every PreOrder in status STAGED whose staged_case_plan_line_id points at one of those lines moves to HELD"
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /meat-ops/case-plans/{id}/transitions action=RESUME"
        actor: MeatManager
        preconditions:
          - "Department.case_posture != SALES_HALTED, else ERR_POSTURE_SALES_HALTED"
        side_effects:
          - "every HELD CasePlanLine returns to its held_from_status and clears held_from_status"
          - "every HELD PreOrder staged on those lines returns to STAGED"
        note: "PUBLISHED -> SUSPENDED -> PUBLISHED is the plan-side cycle; fill_status is untouched by both hops."
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /meat-ops/case-plans/{id}/transitions action=CLOSE"
        actor: MeatManager
        preconditions:
          - "no CasePlanLine is in status PLANNED, else ERR_CASE_PLAN_HAS_UNFILLED_LINES"
        side_effects:
          - "the plan becomes eligible for ShrinkReconciliation scope"
      - from: UNFILLED
        to: PARTIAL
        trigger: "POST /meat-ops/case-plan-lines/{id}/fills on any line of this plan"
        actor: system
        preconditions:
          - "0 < total_actual_fill_lb < total_required_fill_lb"
        side_effects:
          - "fill_status is recomputed from the plan's line totals without touching plan_status"
        note: "fill_status is the second, independent state dimension of CasePlan."
      - from: PARTIAL
        to: FILLED
        trigger: "POST /meat-ops/case-plan-lines/{id}/fills on any line of this plan"
        actor: system
        preconditions:
          - "total_actual_fill_lb >= total_required_fill_lb"
        side_effects:
          - "fill_status is recomputed from the plan's line totals without touching plan_status"
      - from: FILLED
        to: PARTIAL
        trigger: "POST /meat-ops/pre-orders/{id}/transitions action=PICK_UP releasing pounds from a line of this plan"
        actor: system
        preconditions:
          - "total_actual_fill_lb < total_required_fill_lb after the picked-up pounds leave the line"
        side_effects:
          - "fill_status is recomputed from the plan's line totals without touching plan_status"

  # -------------------------------------------------- CasePlanLine (hold cycle)
  - entity: CasePlanLine
    initial_state: PLANNED
    terminal_states: [SHRUNK_OUT]
    transitions:
      - from: PLANNED
        to: FILLED
        trigger: "POST /meat-ops/case-plan-lines/{id}/fills"
        actor: MeatCutter
        preconditions:
          - "parent CasePlan.plan_status == PUBLISHED, else ERR_CASE_PLAN_NOT_PUBLISHED"
          - "Department.case_posture != SALES_HALTED, else ERR_POSTURE_SALES_HALTED"
          - "actual_fill_lb + filled_lb <= required_fill_lb * FILL_OVERAGE_CAP, else ERR_FILL_EXCEEDS_REQUIRED"
        side_effects:
          - "adds filled_lb to actual_fill_lb"
          - "on the first fill sets pack_date from the logical clock and sell_by_date per sell_by_dating"
          - "recomputes CasePlan.total_actual_fill_lb and CasePlan.fill_status"
      - from: FILLED
        to: MARKED_DOWN
        trigger: "POST /meat-ops/case-plan-lines/{id}/markdowns"
        actor: PricingAnalyst
        preconditions:
          - "line_status == FILLED, else ERR_LINE_ON_HOLD when HELD"
          - "markdown_price_per_lb_cents >= markdown floor per markdown_valuation, else ERR_MARKDOWN_BELOW_FLOOR"
          - "markdown_lb + requested pounds <= actual_fill_lb - staged_lb"
        side_effects:
          - "adds to markdown_lb, stores markdown_price_per_lb_cents, adds to markdown_dollars_cents per markdown_valuation"
      - from: FILLED
        to: HELD
        trigger: "POST /meat-ops/temperature-logs (posture cascade) or POST /meat-ops/case-plans/{id}/transitions action=SUSPEND"
        actor: system
        preconditions:
          - "parent CasePlan.plan_status moved to SUSPENDED"
        side_effects:
          - "records held_from_status = FILLED"
          - "increments the triggering CaseFailure.affected_line_count when the hold came from the posture cascade"
      - from: MARKED_DOWN
        to: HELD
        trigger: "POST /meat-ops/temperature-logs (posture cascade) or POST /meat-ops/case-plans/{id}/transitions action=SUSPEND"
        actor: system
        preconditions:
          - "parent CasePlan.plan_status moved to SUSPENDED"
        side_effects:
          - "records held_from_status = MARKED_DOWN"
          - "increments the triggering CaseFailure.affected_line_count when the hold came from the posture cascade"
      - from: HELD
        to: FILLED
        trigger: "POST /meat-ops/case-plans/{id}/transitions action=RESUME"
        actor: system
        preconditions:
          - "held_from_status == FILLED"
        side_effects:
          - "clears held_from_status"
        note: "FILLED -> HELD -> FILLED is the line-side cycle driven by posture."
      - from: HELD
        to: MARKED_DOWN
        trigger: "POST /meat-ops/case-plans/{id}/transitions action=RESUME"
        actor: system
        preconditions:
          - "held_from_status == MARKED_DOWN"
        side_effects:
          - "clears held_from_status"
      - from: FILLED
        to: FILLED
        trigger: "POST /meat-ops/case-plan-lines/{id}/fills (a later fill on an already filled line) or POST /meat-ops/case-plan-lines/{id}/shrink-events (a partial write-off)"
        actor: MeatCutter
        preconditions:
          - "parent CasePlan.plan_status == PUBLISHED, else ERR_CASE_PLAN_NOT_PUBLISHED"
          - "for a fill: actual_fill_lb + filled_lb <= required_fill_lb * FILL_OVERAGE_CAP, else ERR_FILL_EXCEEDS_REQUIRED"
          - "for a shrink event: shrink_lb + requested pounds < actual_fill_lb - staged_lb (the line is not emptied)"
        side_effects:
          - "a fill adds to actual_fill_lb and refreshes CasePlan.total_actual_fill_lb and fill_status"
          - "a partial shrink event adds to shrink_lb and leaves actual_fill_lb untouched"
      - from: MARKED_DOWN
        to: MARKED_DOWN
        trigger: "POST /meat-ops/case-plan-lines/{id}/markdowns (a deeper markdown) or POST /meat-ops/case-plan-lines/{id}/shrink-events (a partial write-off)"
        actor: PricingAnalyst
        preconditions:
          - "parent CasePlan.plan_status == PUBLISHED, else ERR_CASE_PLAN_NOT_PUBLISHED"
          - "for a markdown: markdown_price_per_lb_cents >= the markdown floor, else ERR_MARKDOWN_BELOW_FLOOR"
          - "for a shrink event: shrink_lb + requested pounds < actual_fill_lb - staged_lb (the line is not emptied)"
        side_effects:
          - "a markdown adds to markdown_lb and markdown_dollars_cents per markdown_valuation"
          - "a partial shrink event adds to shrink_lb"
      - from: FILLED
        to: SHRUNK_OUT
        trigger: "POST /meat-ops/case-plan-lines/{id}/shrink-events"
        actor: MeatManager
        preconditions:
          - "shrink_lb + requested pounds == actual_fill_lb - staged_lb (the line is emptied)"
        side_effects:
          - "adds to shrink_lb and recomputes CasePlan.fill_status"
      - from: MARKED_DOWN
        to: SHRUNK_OUT
        trigger: "POST /meat-ops/case-plan-lines/{id}/shrink-events"
        actor: MeatManager
        preconditions:
          - "shrink_lb + requested pounds == actual_fill_lb - staged_lb (the line is emptied)"
        side_effects:
          - "adds to shrink_lb and recomputes CasePlan.fill_status"

  # ----------------------------------------------- TrimLot (commitment lifecycle)
  - entity: TrimLot
    initial_state: AVAILABLE
    terminal_states: [CONSUMED, DISCARDED]
    transitions:
      - from: AVAILABLE
        to: PARTIALLY_COMMITTED
        trigger: "POST /meat-ops/grind-runs/{id}/inputs"
        actor: system
        preconditions:
          - "weight_lb < remaining_lb"
        side_effects:
          - "adds weight_lb to allocated_lb and reduces remaining_lb by the same pounds"
      - from: AVAILABLE
        to: FULLY_COMMITTED
        trigger: "POST /meat-ops/grind-runs/{id}/inputs"
        actor: system
        preconditions:
          - "weight_lb == remaining_lb"
        side_effects:
          - "adds weight_lb to allocated_lb and drives remaining_lb to 0"
      - from: PARTIALLY_COMMITTED
        to: FULLY_COMMITTED
        trigger: "POST /meat-ops/grind-runs/{id}/inputs"
        actor: system
        preconditions:
          - "weight_lb == remaining_lb"
        side_effects:
          - "adds weight_lb to allocated_lb and drives remaining_lb to 0"
      - from: FULLY_COMMITTED
        to: PARTIALLY_COMMITTED
        trigger: "POST /meat-ops/grind-runs/{id}/transitions action=ABORT"
        actor: system
        preconditions:
          - "the aborted run holds a GrindInput on this lot and received_lb > the restored pounds"
        side_effects:
          - "COMPENSATION: the aborted run's pounds move out of allocated_lb back into remaining_lb with zero drift"
      - from: PARTIALLY_COMMITTED
        to: AVAILABLE
        trigger: "POST /meat-ops/grind-runs/{id}/transitions action=ABORT"
        actor: system
        preconditions:
          - "restoring the aborted run's pounds returns allocated_lb to 0"
        side_effects:
          - "COMPENSATION: allocated_lb returns to 0 and remaining_lb returns to received_lb - consumed_lb - discarded_lb"
        note: "AVAILABLE -> committed -> AVAILABLE is the trim-side cycle that the pounds invariant is measured across."
      - from: FULLY_COMMITTED
        to: CONSUMED
        trigger: "POST /meat-ops/grind-runs/{id}/transitions action=COMPLETE"
        actor: system
        preconditions:
          - "the completing run holds a GrindInput on this lot and remaining_lb == 0"
        side_effects:
          - "moves the run's pounds from allocated_lb to consumed_lb and sets GrindInput.consumed = true"
      - from: PARTIALLY_COMMITTED
        to: PARTIALLY_COMMITTED
        trigger: "POST /meat-ops/grind-runs/{id}/transitions action=COMPLETE"
        actor: system
        preconditions:
          - "remaining_lb > 0 after the run's pounds are consumed"
        side_effects:
          - "moves the run's pounds from allocated_lb to consumed_lb and sets GrindInput.consumed = true"
      - from: AVAILABLE
        to: DISCARDED
        trigger: "POST /meat-ops/trim-lots/{id}/transitions action=DISCARD"
        actor: MeatCutter
        preconditions:
          - "allocated_lb == 0, else ERR_TRIM_LOT_COMMITTED"
        side_effects:
          - "moves remaining_lb into discarded_lb and drives remaining_lb to 0"
      - from: PARTIALLY_COMMITTED
        to: DISCARDED
        trigger: "POST /meat-ops/trim-lots/{id}/transitions action=DISCARD"
        actor: MeatCutter
        preconditions:
          - "allocated_lb == 0, else ERR_TRIM_LOT_COMMITTED"
        side_effects:
          - "moves remaining_lb into discarded_lb and drives remaining_lb to 0"

  # ---------------------------------------------------- GrindRun (branching fork)
  - entity: GrindRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /meat-ops/grind-runs/{id}/transitions action=START"
        actor: MeatCutter
        preconditions:
          - "Department.case_posture != SALES_HALTED, else ERR_POSTURE_SALES_HALTED"
          - "batch_weight_lb > 0"
          - "target_retail_item_id item's price_status IN {PROPOSED, PRICED, REPRICE_REQUIRED}, else ERR_ITEM_NOT_PRICED"
        side_effects:
          - "sets started_by_user_id"
          - "recomputes batch_weight_lb, blended_lean_pct, blend_cost_per_lb_cents and coo_label per grind_blend_derivation"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /meat-ops/grind-runs/{id}/transitions action=COMPLETE"
        actor: MeatCutter
        preconditions:
          - "abs(blended_lean_pct - target_lean_pct) <= lean_tolerance_pct, else ERR_LEAN_OUT_OF_TOLERANCE"
          - "coo_label == declared_coo, else ERR_COO_LABEL_MISMATCH"
        side_effects:
          - "sets completed_at from the logical clock"
          - "every input TrimLot moves its run pounds from allocated_lb to consumed_lb; GrindInput.consumed becomes true"
          - "target RetailItem.yield_adjusted_cost_per_lb_cents becomes blend_cost_per_lb_cents and country_of_origin_label becomes coo_label"
          - "when the target item's price_status == PRICED and the recomputed final price moves by more than REPRICE_THRESHOLD_PCT the item moves to REPRICE_REQUIRED"
          - "when fill_case_plan_line_id is set, batch_weight_lb is recorded as a fill on that CasePlanLine (pack_date and sell_by_date follow sell_by_dating)"
        note: "COMPLETED and ABORTED are the two branches of the fork; their side-effect sets are disjoint."
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /meat-ops/grind-runs/{id}/transitions action=ABORT"
        actor: MeatManager
        preconditions:
          - "abort_reason supplied"
        side_effects:
          - "COMPENSATION: every input TrimLot moves its run pounds out of allocated_lb back into remaining_lb; GrindInput.consumed stays false"
          - "no cost, price, label or fill side effect of the COMPLETED branch is applied"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /meat-ops/grind-runs/{id}/transitions action=ABORT"
        actor: MeatManager
        preconditions:
          - "abort_reason supplied"
        side_effects:
          - "COMPENSATION: every input TrimLot moves its run pounds out of allocated_lb back into remaining_lb"

  # ------------------------------------------------- CaseFailure (reopen cycle)
  - entity: CaseFailure
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: CONTAINED
        trigger: "POST /meat-ops/case-failures/{id}/transitions action=CONTAIN"
        actor: MeatCutter
        preconditions:
          - "containment_note supplied"
        side_effects:
          - "sets contained_at from the logical clock"
          - "Department.open_case_failure_count decreases by 1 and contained_case_failure_count increases by 1; case_posture is recomputed per case_posture_derivation (SALES_HALTED -> SALES_RESTRICTED when no other failure is open)"
      - from: CONTAINED
        to: OPEN
        trigger: "POST /meat-ops/temperature-logs with an out-of-spec reading on the same case_code"
        actor: system
        preconditions:
          - "the new reading's case_code == this failure's case_code and reading_c > Department.max_safe_case_temp_c"
        side_effects:
          - "increments reopen_count by 1 and refreshes peak_reading_c"
          - "Department.open_case_failure_count increases by 1, contained_case_failure_count decreases by 1, case_posture returns to SALES_HALTED"
        note: "OPEN -> CONTAINED -> OPEN is the failure-side cycle; a reopen re-halts the department."
      - from: OPEN
        to: ESCALATED
        trigger: "POST /meat-ops/case-failures/{id}/transitions action=ESCALATE"
        actor: MeatManager
        preconditions:
          - "logical clock >= opened_at + ESCALATION_MINUTES minutes (inclusive), else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "sets escalated_at; the department stays SALES_HALTED because ESCALATED counts toward open_case_failure_count"
      - from: CONTAINED
        to: RESOLVED
        trigger: "POST /meat-ops/case-failures/{id}/transitions action=RESOLVE"
        actor: MeatManager
        preconditions:
          - "X-User-ID != reported_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "disposition supplied"
        side_effects:
          - "sets resolved_at and resolved_by_user_id"
          - "Department.contained_case_failure_count decreases by 1 and case_posture returns to SALES_OPEN when no failure remains and consecutive_out_of_spec_readings == 0"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /meat-ops/case-failures/{id}/transitions action=RESOLVE"
        actor: MeatManager
        preconditions:
          - "X-User-ID != reported_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "disposition supplied"
        side_effects:
          - "sets resolved_at and resolved_by_user_id"
          - "Department.open_case_failure_count decreases by 1 and case_posture is recomputed"

  # ---------------------------------------------------- PreOrder (amend cycle)
  - entity: PreOrder
    initial_state: REQUESTED
    terminal_states: [PICKED_UP, CANCELLED, FORFEITED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /meat-ops/pre-orders/{id}/transitions action=CONFIRM"
        actor: ServiceClerk
        preconditions:
          - "RetailItem.price_status IN {PROPOSED, PRICED, REPRICE_REQUIRED}, else ERR_ITEM_NOT_PRICED"
          - "the count of already-CONFIRMED or STAGED PreOrder rows in the department whose pickup window collides with this one is < Department.pickup_slot_capacity, else ERR_PICKUP_SLOT_CAPACITY_EXCEEDED"
        side_effects:
          - "pins quoted_price_per_lb_cents = RetailItem.active_price_per_lb_cents and pinned_retail_item_version = RetailItem.version"
          - "computes deposit_cents per pre_order_deposit_settlement"
      - from: CONFIRMED
        to: REQUESTED
        trigger: "POST /meat-ops/pre-orders/{id}/transitions action=AMEND"
        actor: ServiceClerk
        preconditions:
          - "amend_count < AMEND_LIMIT, else ERR_REVISION_LIMIT_REACHED"
        side_effects:
          - "increments amend_count by 1"
          - "releases the pinned quote: quoted_price_per_lb_cents, pinned_retail_item_version and deposit_cents return to 0"
        note: "REQUESTED -> CONFIRMED -> REQUESTED is the pre-order amendment cycle, bounded at 2 amendments."
      - from: CONFIRMED
        to: STAGED
        trigger: "POST /meat-ops/pre-orders/{id}/transitions action=STAGE"
        actor: MeatCutter
        preconditions:
          - "staged_case_plan_line_id supplied and that line's line_status IN {FILLED, MARKED_DOWN}, else ERR_LINE_ON_HOLD"
          - "the line's RetailItem is this order's retail_item_id, else ERR_PRODUCT_CLASS_MISMATCH"
          - "requested_weight_lb <= line.actual_fill_lb - line.staged_lb - line.markdown_lb - line.shrink_lb"
          - "the line's sell_by_date >= the logical clock's current date, else ERR_SELL_BY_EXPIRED"
        side_effects:
          - "adds requested_weight_lb to CasePlanLine.staged_lb"
      - from: STAGED
        to: HELD
        trigger: "POST /meat-ops/temperature-logs (posture cascade) or POST /meat-ops/case-plans/{id}/transitions action=SUSPEND"
        actor: system
        preconditions:
          - "the staged CasePlanLine moved to HELD"
        side_effects:
          - "the order is not pickable while HELD (ERR_LINE_ON_HOLD)"
      - from: HELD
        to: STAGED
        trigger: "POST /meat-ops/case-plans/{id}/transitions action=RESUME"
        actor: system
        preconditions:
          - "the staged CasePlanLine returned to FILLED or MARKED_DOWN"
        side_effects:
          - "the order becomes pickable again"
      - from: STAGED
        to: PICKED_UP
        trigger: "POST /meat-ops/pre-orders/{id}/transitions action=PICK_UP"
        actor: ServiceClerk
        preconditions:
          - "logical clock is within [pickup_window_start_at, pickup_window_end_at], inclusive"
        side_effects:
          - "deposit_applied_cents becomes deposit_cents"
          - "requested_weight_lb leaves CasePlanLine.staged_lb and actual_fill_lb"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /meat-ops/pre-orders/{id}/transitions action=CANCEL"
        actor: ServiceClerk
        preconditions:
          - "status != PICKED_UP"
        side_effects:
          - "splits deposit_cents into deposit_refund_cents and deposit_forfeited_cents per pre_order_deposit_settlement"
      - from: STAGED
        to: CANCELLED
        trigger: "POST /meat-ops/pre-orders/{id}/transitions action=CANCEL"
        actor: ServiceClerk
        preconditions:
          - "status != PICKED_UP"
        side_effects:
          - "splits deposit_cents into deposit_refund_cents and deposit_forfeited_cents per pre_order_deposit_settlement"
          - "requested_weight_lb is released from CasePlanLine.staged_lb"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /meat-ops/pre-orders/{id}/transitions action=CANCEL"
        actor: ServiceClerk
        preconditions:
          - "status != PICKED_UP"
        side_effects:
          - "deposit_refund_cents and deposit_forfeited_cents both stay 0 because no deposit was collected"
      - from: STAGED
        to: FORFEITED
        trigger: "POST /meat-ops/pre-orders/{id}/transitions action=FORFEIT"
        actor: MeatManager
        preconditions:
          - "logical clock > pickup_window_end_at"
        side_effects:
          - "deposit_forfeited_cents becomes deposit_cents and deposit_refund_cents stays 0"
          - "requested_weight_lb is released from CasePlanLine.staged_lb"

  # ------------------------------------- ShrinkReconciliation (dispute cycle)
  - entity: ShrinkReconciliation
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /meat-ops/shrink-reconciliations/{id}/transitions action=POST"
        actor: MeatManager
        preconditions:
          - "no CasePlan of the department with service_date inside the period is in plan_status SUSPENDED, else ERR_PERIOD_HAS_SUSPENDED_PLAN"
          - "within_tolerance == true, or override_reason supplied, else ERR_SHRINK_EXCEEDS_TOLERANCE"
        side_effects:
          - "sets posted_by_user_id"
          - "every PrimalPurchase of the department in status CUT_TESTED whose received_at date falls inside the period moves to RECONCILED"
      - from: POSTED
        to: DISPUTED
        trigger: "POST /meat-ops/shrink-reconciliations/{id}/transitions action=DISPUTE"
        actor: PricingAnalyst
        preconditions:
          - "dispute_reason supplied"
        side_effects:
          - "the row's figures are frozen pending redraft"
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /meat-ops/shrink-reconciliations/{id}/transitions action=REDRAFT"
        actor: PricingAnalyst
        preconditions:
          - "dispute_reason recorded"
        side_effects:
          - "clears posted_by_user_id and recomputes every figure via shrink_variance_reconciliation from current line data"
        note: "DRAFT -> POSTED -> DISPUTED -> DRAFT is the reconciliation cycle."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: cutting-test-create-stale-purchase
    parent_entity: PrimalPurchase
    write_endpoint: "POST /meat-ops/cutting-tests"
    occ_field: "expected_primal_purchase_version"
    description: |
      Creating a CuttingTest against a PrimalPurchase whose version has advanced
      since the client last read it is rejected. A new test legitimately
      supersedes an existing SUBMITTED or APPROVED test on the same purchase and
      rewinds the purchase's cost ledger, so the write cannot be resolved by a
      state precondition alone: the client must prove it observed the purchase
      version that its supersede decision was based on.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

  - rule_id: price-activation-stale-item
    parent_entity: RetailItem
    write_endpoint: "POST /meat-ops/retail-items/{id}/price-activations"
    occ_field: "expected_retail_item_version"
    description: |
      Activating a price on a RetailItem whose version has advanced since the
      client last read it is rejected. Activation legitimately overwrites
      active_price_per_lb_cents and price_variance_pct from whichever cost basis
      the client evaluated, so a stale view must not be allowed to publish a
      price computed from a superseded cost basis.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: landed_cost_derivation
    description: "Turns invoice, freight, allowance and receiving shrink into the purchase's landed cost and cost per usable pound."
    trigger: "POST /meat-ops/primal-purchases (creation)"
    inputs: [gross_weight_lb, receiving_shrink_lb, invoice_cost_cents, freight_cost_cents, vendor_allowance_cents]
    algorithm: aggregation
    formula: |
      net_weight_lb = gross_weight_lb - receiving_shrink_lb
      if net_weight_lb <= 0: reject with ERR_NET_WEIGHT_NOT_POSITIVE
      landed_cost_total_cents = invoice_cost_cents + freight_cost_cents - vendor_allowance_cents
      landed_cost_per_lb_cents = round_half_up(landed_cost_total_cents / net_weight_lb, 4)
      allocated_cost_cents = 0
      unallocated_cost_cents = landed_cost_total_cents
    input_set: "The single PrimalPurchase being created; no other rows participate."
    constants: {}
    precision: "net_weight_lb 2 decimal places; landed_cost_total_cents whole cents; landed_cost_per_lb_cents 4 decimal places, round_half_up"

  - name: subprimal_cost_allocation
    description: "Distributes the purchase's landed cost across the cutting test's value-bearing lines by market value, pinning the rounding order so the cents always reconcile."
    trigger: "POST /meat-ops/cutting-tests/{id}/transitions action=APPROVE"
    inputs: [PrimalPurchase.landed_cost_total_cents, CuttingTestLine.yield_weight_lb, CuttingTestLine.market_value_per_lb_cents, CuttingTestLine.disposition, CuttingTestLine.line_seq]
    algorithm: waterfall_allocation
    formula: |
      # Mode (b): rounding order is pinned — round PER LINE, then reconcile the
      # remainder. Summing the unrounded shares and rounding once at the end is
      # explicitly NOT this rule and produces different cents.
      candidates = lines of this test with disposition IN {SALABLE_CUT, GRIND_TRIM}
                   ordered by line_seq ASC
      w(line)    = market_value_per_lb_cents * yield_weight_lb        # value weight
      W          = sum(w(line) for line in candidates)
      if W == 0: reject with ERR_NO_MARKET_VALUE_BASIS
      for line in candidates (line_seq ASC):
          allocated_cost_cents(line) = round_half_up(
              PrimalPurchase.landed_cost_total_cents * w(line) / W, 0)
      remainder = PrimalPurchase.landed_cost_total_cents
                  - sum(allocated_cost_cents(line) for line in candidates)
      # remainder may be positive or negative; it is assigned ENTIRELY to one line
      remainder_line = candidate with the greatest yield_weight_lb;
                       tie-break: lowest line_seq   (never id, never created_at)
      allocated_cost_cents(remainder_line) += remainder
      for every line: allocated_cost_per_lb_cents = (yield_weight_lb == 0)
              ? 0 : round_half_up(allocated_cost_cents / yield_weight_lb, 4)
      lines with disposition == FAT_BONE_LOSS keep allocated_cost_cents = 0
    input_set: "CuttingTestLine rows of the CuttingTest being APPROVED whose disposition IN {SALABLE_CUT, GRIND_TRIM}; FAT_BONE_LOSS lines are excluded from the weight base and receive nothing."
    constants: {}
    precision: "allocated_cost_cents whole cents (round_half_up per line, remainder reconciled onto one line); allocated_cost_per_lb_cents 4 decimal places, round_half_up"

  - name: cutting_test_yield_metrics
    description: "Computes salable, trim and loss yield percentages plus the unaccounted-pounds gate for a cutting test."
    trigger: "POST /meat-ops/cutting-tests/{id}/lines and POST /meat-ops/cutting-tests/{id}/transitions action=SUBMIT"
    inputs: [CuttingTest.test_weight_lb, CuttingTestLine.yield_weight_lb, CuttingTestLine.disposition]
    algorithm: aggregation
    formula: |
      total_yield_weight_lb = sum(yield_weight_lb over ALL lines of the test)
      unaccounted_lb        = round_half_up(test_weight_lb - total_yield_weight_lb, 2)
      salable_yield_pct = round_half_up(
          sum(yield_weight_lb where disposition == SALABLE_CUT) / test_weight_lb, 4)
      trim_yield_pct    = round_half_up(
          sum(yield_weight_lb where disposition == GRIND_TRIM) / test_weight_lb, 4)
      loss_pct          = round_half_up(
          sum(yield_weight_lb where disposition == FAT_BONE_LOSS) / test_weight_lb, 4)
      # SUBMIT gate
      if abs(unaccounted_lb) > UNACCOUNTED_TOLERANCE_LB: reject ERR_YIELD_NOT_RECONCILED
    input_set: "All CuttingTestLine rows of the test regardless of disposition; no state filter (lines are immutable once the test leaves DRAFT)."
    constants:
      UNACCOUNTED_TOLERANCE_LB: 0.05
      REVISION_LIMIT: 2
    precision: "unaccounted_lb 2 decimal places; the three percentages 4 decimal places, round_half_up"

  - name: retail_price_per_lb
    description: "Prices a retail item from a yield-adjusted cost basis and a margin target whose tier is itself selected from the first-pass price."
    trigger: "POST /meat-ops/retail-items/{id}/price-proposals and POST /meat-ops/retail-items/{id}/price-activations"
    inputs: [cost_basis_per_lb_cents, RetailItem.target_margin_pct, Department.target_margin_pct]
    algorithm: tiered_pricing
    formula: |
      # Mode (c): circular-looking dependency — the margin tier depends on the
      # price, and the price depends on the margin. Evaluation order is PINNED to
      # exactly one pass; the tier is NEVER re-evaluated against p2.
      base_margin = RetailItem.target_margin_pct if not null
                    else Department.target_margin_pct
      p1  = round_half_up(cost_basis_per_lb_cents / (1 - base_margin), 0)
      bump = 0.00                       if p1 <  TIER_1_CEILING_CENTS
             MARGIN_BUMP_TIER_2         if TIER_1_CEILING_CENTS <= p1 < TIER_2_CEILING_CENTS
             MARGIN_BUMP_TIER_3         if p1 >= TIER_2_CEILING_CENTS
      eff = min(base_margin + bump, MARGIN_CAP_PCT)
      p2  = round_half_up(cost_basis_per_lb_cents / (1 - eff), 0)   # single pass
      # psychological rounding: always UP to the next price ending in 9
      price_per_lb_cents = p2 + ((9 - (p2 % 10)) % 10)
    input_set: "The single RetailItem being priced; the cost basis comes from the variant below."
    constants:
      TIER_1_CEILING_CENTS: 800
      TIER_2_CEILING_CENTS: 1600
      MARGIN_BUMP_TIER_2: 0.02
      MARGIN_BUMP_TIER_3: 0.04
      MARGIN_CAP_PCT: 0.60
      STANDARD_SALABLE_YIELD_PCT: 0.62
      REPRICE_THRESHOLD_PCT: 0.02
    precision: "p1, p2 and the final price are whole cents, round_half_up; the 9-ending adjustment is applied after rounding, never before"
    variants:
      - name: provisional_price
        when: "POST /meat-ops/retail-items/{id}/price-proposals — before any CuttingTest on the source purchase is APPROVED"
        difference: |
          cost_basis_per_lb_cents = round_half_up(
              (PrimalPurchase.invoice_cost_cents / PrimalPurchase.net_weight_lb)
              / STANDARD_SALABLE_YIELD_PCT, 4)
          Freight and vendor allowance are EXCLUDED and the yield is the book
          constant, so the basis ignores this primal's measured yield entirely.
          The result lands in provisional_price_per_lb_cents.
      - name: final_price
        when: "POST /meat-ops/retail-items/{id}/price-activations — after the CuttingTest is APPROVED (CUT_TEST_LINE items) or a GrindRun COMPLETED (GRIND_BLEND items)"
        difference: |
          cost_basis_per_lb_cents = the item's yield_adjusted_cost_per_lb_cents,
          i.e. the APPROVED CuttingTestLine.allocated_cost_per_lb_cents (which
          already carries freight and allowance and this primal's measured
          yield) or the COMPLETED GrindRun.blend_cost_per_lb_cents. The result
          lands in final_price_per_lb_cents; price_variance_pct =
          round_half_up((final - provisional) / provisional, 4) when
          provisional_price_per_lb_cents > 0, else 0.

  - name: required_fill_derivation
    description: "Sets the pounds a case line must be filled with from facing presentation, forecast movement and shelf-life carrying capacity, then applies the posture haircut."
    trigger: "POST /meat-ops/case-plans/{id}/lines"
    inputs: [CasePlanLine.facings, CasePlanLine.expected_movement_lb, RetailItem.product_class, RetailItem.shelf_life_days, Department.case_posture]
    algorithm: threshold
    formula: |
      # Mode (a): 4 inputs, nested min/max, and a branch on department posture.
      facing_lb = FACING_LB_GROUND        if product_class == GROUND
                  FACING_LB_WHOLE_MUSCLE  if product_class == WHOLE_MUSCLE
                  FACING_LB_VAC_PACKED    if product_class == VAC_PACKED
      presentation_lb = facings * facing_lb
      demand_lb       = expected_movement_lb * DEMAND_MULTIPLIER
      carry_cap_lb    = expected_movement_lb * shelf_life_days * SHELF_LIFE_DAILY_CAP_FACTOR
      base_lb         = max(presentation_lb, min(demand_lb, carry_cap_lb))
      required_fill_lb = round_half_up(base_lb, 2)                if posture == SALES_OPEN
                         round_half_up(base_lb * RESTRICTED_FILL_FACTOR, 2)
                                                                  if posture == SALES_RESTRICTED
                         # posture == SALES_HALTED rejects the line with ERR_POSTURE_SALES_HALTED
    input_set: "The single CasePlanLine being created, its RetailItem, and the owning Department's case_posture at creation time. Later posture changes do NOT retroactively rewrite required_fill_lb."
    constants:
      FACING_LB_GROUND: 4.0
      FACING_LB_WHOLE_MUSCLE: 6.0
      FACING_LB_VAC_PACKED: 8.0
      DEMAND_MULTIPLIER: 1.15
      SHELF_LIFE_DAILY_CAP_FACTOR: 0.30
      RESTRICTED_FILL_FACTOR: 0.5
      FILL_OVERAGE_CAP: 1.25
    precision: "2 decimal places, round_half_up; the haircut is applied to the rounded base and re-rounded"

  - name: grind_blend_derivation
    description: "Derives a grind run's batch weight, weight-weighted lean, weight-weighted cost and country-of-origin label from its trim inputs."
    trigger: "POST /meat-ops/grind-runs/{id}/inputs and POST /meat-ops/grind-runs/{id}/transitions action=START"
    inputs: [GrindInput.weight_lb, TrimLot.lean_pct, TrimLot.cost_per_lb_cents, TrimLot.country_of_origin]
    algorithm: weighted_scoring
    formula: |
      inputs = GrindInput rows of this run, ordered by input_seq ASC
      batch_weight_lb = sum(weight_lb)
      blended_lean_pct = (batch_weight_lb == 0) ? 0 : round_half_up(
          sum(weight_lb * TrimLot.lean_pct) / batch_weight_lb, 2)
      blend_cost_per_lb_cents = (batch_weight_lb == 0) ? 0 : round_half_up(
          sum(weight_lb * TrimLot.cost_per_lb_cents) / batch_weight_lb, 4)
      labels = distinct TrimLot.country_of_origin over the inputs
      coo_label = PENDING              if inputs is empty
                  the single member    if len(labels) == 1
                  MULTIPLE             if len(labels) >= 2
      # COMPLETE gates
      if abs(blended_lean_pct - target_lean_pct) > lean_tolerance_pct:
          reject with ERR_LEAN_OUT_OF_TOLERANCE
      if coo_label != declared_coo: reject with ERR_COO_LABEL_MISMATCH
    input_set: "All GrindInput rows of the run (a run in SCHEDULED or IN_PROGRESS); inputs of other runs never participate."
    constants: {}
    precision: "batch_weight_lb 2 decimal places; blended_lean_pct 2 decimal places, round_half_up; blend_cost_per_lb_cents 4 decimal places, round_half_up"

  - name: sell_by_dating
    description: "Stamps sell-by dates on packed case lines and trim lots, with re-worked trim inheriting the ground shelf life."
    trigger: "POST /meat-ops/case-plan-lines/{id}/fills (first fill) and POST /meat-ops/trim-lots (creation)"
    inputs: [pack_date, RetailItem.product_class, TrimLot.rework_generation, Department.shelf_life_days_ground, Department.shelf_life_days_whole_muscle, Department.shelf_life_days_vac_packed]
    algorithm: chronological
    formula: |
      # CasePlanLine
      pack_date    = date(logical clock at the first fill event on the line)
      shelf_days   = RetailItem.shelf_life_days   # copied from the Department field
                                                 # matching RetailItem.product_class
      sell_by_date = pack_date + shelf_days days
      # TrimLot — any re-worked lot is treated as ground regardless of its source
      shelf_days   = Department.shelf_life_days_ground
      sell_by_date = TrimLot.pack_date + shelf_days days
      # Staging gate: a PreOrder may only be STAGED on a line whose
      # sell_by_date >= date(logical clock), else ERR_SELL_BY_EXPIRED
    input_set: "The single CasePlanLine or TrimLot being dated."
    constants:
      REGRIND_GENERATION_LIMIT: 1
    precision: "whole days; dates are ISO 8601 calendar dates in UTC"

  - name: markdown_valuation
    description: "Enforces the markdown price floor over yield-adjusted cost and accumulates the markdown give-up in cents."
    trigger: "POST /meat-ops/case-plan-lines/{id}/markdowns"
    inputs: [RetailItem.yield_adjusted_cost_per_lb_cents, RetailItem.active_price_per_lb_cents, Department.markdown_floor_pct, markdown_lb, markdown_price_per_lb_cents]
    algorithm: threshold
    formula: |
      floor_cents = round_half_up(
          RetailItem.yield_adjusted_cost_per_lb_cents
          * (1 + Department.markdown_floor_pct), 0)
      if markdown_price_per_lb_cents < floor_cents:
          reject with ERR_MARKDOWN_BELOW_FLOOR      # >= floor is accepted
      event_give_up_cents = round_half_up(
          markdown_lb * (RetailItem.active_price_per_lb_cents
                         - markdown_price_per_lb_cents), 0)
      CasePlanLine.markdown_dollars_cents += event_give_up_cents   # per-event rounding
      CasePlanLine.markdown_lb            += markdown_lb
    input_set: "The single CasePlanLine being marked down and its RetailItem; rounding is applied per markdown event, never to the running total."
    constants: {}
    precision: "floor and give-up in whole cents, round_half_up; markdown_lb 2 decimal places"

  - name: shrink_variance_reconciliation
    description: "Reconciles a period's salable pounds against the yield model or against the physical count, with the two bases disagreeing on identical line data."
    trigger: "POST /meat-ops/shrink-reconciliations and POST /meat-ops/shrink-reconciliations/{id}/transitions action=REDRAFT"
    inputs: [CasePlanLine.required_fill_lb, CasePlanLine.actual_fill_lb, CasePlanLine.markdown_lb, CasePlanLine.shrink_lb, CasePlanLine.markdown_dollars_cents, RetailItem.active_price_per_lb_cents, Department.shrink_tolerance_pct]
    algorithm: aggregation
    formula: |
      scope_plans = CasePlan rows where department_id == this department
                    AND plan_status IN {PUBLISHED, CLOSED}
                    AND period_start_date <= service_date <= period_end_date   # both inclusive
      scope_lines = every CasePlanLine of scope_plans, ordered by
                    CasePlan.service_date ASC, then CasePlanLine.line_seq ASC
      # ---- basis-specific pounds (see variants) ----
      variance_lb  = round_half_up(physical_salable_lb - expected_salable_lb, 2)
      variance_pct = (expected_salable_lb == 0) ? 0
                     : round_half_up(variance_lb / expected_salable_lb, 4)
      within_tolerance = abs(variance_pct) <= Department.shrink_tolerance_pct
      markdown_dollars_cents = sum(CasePlanLine.markdown_dollars_cents over scope_lines)
      shrink_dollars_cents   = sum( round_half_up(
              CasePlanLine.shrink_lb * RetailItem.active_price_per_lb_cents, 0)
          over scope_lines )                       # per-line rounding, then summed
      # POST gate: within_tolerance == false requires override_reason,
      # else ERR_SHRINK_EXCEEDS_TOLERANCE
    input_set: "CasePlanLine rows belonging to CasePlan rows of the department with plan_status IN {PUBLISHED, CLOSED} and service_date inside the inclusive period. DRAFT and SUSPENDED plans are excluded (a SUSPENDED plan inside the period blocks the POST outright)."
    constants: {}
    precision: "pounds 2 decimal places; variance_pct 4 decimal places, round_half_up; cents whole, round_half_up per line"
    variants:
      - name: yield_model_basis
        when: "basis == YIELD_MODEL"
        difference: |
          expected_salable_lb = sum(required_fill_lb over scope_lines)
          physical_salable_lb = sum(actual_fill_lb   over scope_lines)
          Measures the plan against what the yield model said the case needed;
          markdowns and discards are NOT deducted from the physical side.
      - name: physical_count_basis
        when: "basis == PHYSICAL_COUNT"
        difference: |
          expected_salable_lb = sum(actual_fill_lb over scope_lines)
          physical_salable_lb = sum(actual_fill_lb - markdown_lb - shrink_lb
                                    over scope_lines)
          Measures what actually stayed salable against what was put in the
          case; the required_fill_lb model is ignored entirely, so the same
          lines yield a different variance_lb and a different within_tolerance.

  - name: pre_order_deposit_settlement
    description: "Collects, applies, refunds or forfeits a pre-order deposit, with the refund split keyed on the pickup window."
    trigger: "POST /meat-ops/pre-orders/{id}/transitions actions CONFIRM, PICK_UP, CANCEL, FORFEIT"
    inputs: [PreOrder.quoted_price_per_lb_cents, PreOrder.requested_weight_lb, Department.deposit_rate, PreOrder.pickup_window_start_at, logical_clock]
    algorithm: threshold
    formula: |
      # CONFIRM
      extended_cents = quoted_price_per_lb_cents * requested_weight_lb
      deposit_cents  = ceil(extended_cents * Department.deposit_rate)   # always rounded UP
      # PICK_UP
      deposit_applied_cents = deposit_cents; refund = 0; forfeited = 0
      # CANCEL
      if logical_clock < pickup_window_start_at:      # strictly before the window opens
          deposit_refund_cents    = deposit_cents
          deposit_forfeited_cents = 0
      else:                                          # at or after the window opens
          deposit_refund_cents    = round_half_up(deposit_cents * CANCEL_REFUND_FACTOR, 0)
          deposit_forfeited_cents = deposit_cents - deposit_refund_cents
      # FORFEIT
      deposit_forfeited_cents = deposit_cents; deposit_refund_cents = 0
      # INVARIANT (all terminal states):
      # deposit_cents == deposit_applied_cents + deposit_refund_cents
      #                  + deposit_forfeited_cents
    input_set: "The single PreOrder being settled; the quote is the version-pinned quoted_price_per_lb_cents, never the item's current price."
    constants:
      CANCEL_REFUND_FACTOR: 0.5
      AMEND_LIMIT: 2
    precision: "deposit_cents rounded UP to whole cents (ceil); the cancellation split uses round_half_up on the refund and assigns the residual to forfeiture"

  - name: case_posture_derivation
    description: "Derives the department's operating posture from temperature-log runs and case-failure counts, and drives the temperature cascade."
    trigger: "POST /meat-ops/temperature-logs and every CaseFailure transition"
    inputs: [TemperatureLog.reading_c, Department.max_safe_case_temp_c, Department.critical_case_temp_c, Department.open_case_failure_count, Department.contained_case_failure_count, Department.consecutive_out_of_spec_readings]
    algorithm: projection
    formula: |
      # ---- per reading, applied in created_at ASC order ----
      out_of_spec = reading_c > max_safe_case_temp_c          # strictly greater
      consecutive_out_of_spec_readings =
          0                                        if not out_of_spec
          min(consecutive_out_of_spec_readings + 1, CONSECUTIVE_FAILURE_THRESHOLD)
                                                   if out_of_spec
      TemperatureLog.consecutive_index = consecutive_out_of_spec_readings
      # ---- CASCADE B, hop 1: failure creation ----
      open_new_failure = (reading_c >= critical_case_temp_c)          # single spike
                      OR (consecutive_out_of_spec_readings
                          >= CONSECUTIVE_FAILURE_THRESHOLD)          # 2nd in a row
      if open_new_failure and a CONTAINED failure exists on the same case_code:
          that failure returns to OPEN (reopen_count += 1)
      elif open_new_failure:
          a CaseFailure is created in status OPEN with
          trigger_temperature_log_id = this reading
      # ---- posture ----
      case_posture = SALES_HALTED       if open_case_failure_count >= 1
                     SALES_RESTRICTED   if contained_case_failure_count >= 1
                                        OR consecutive_out_of_spec_readings >= 1
                     SALES_OPEN         otherwise
      # ---- CASCADE B, hops 2-4 (only when posture becomes SALES_HALTED) ----
      # hop 2: every CasePlan of the department with plan_status == PUBLISHED and
      #        service_date >= date(logical clock) moves to SUSPENDED
      # hop 3: each suspended plan's CasePlanLine rows in FILLED or MARKED_DOWN
      #        record held_from_status and move to HELD (CaseFailure
      #        .affected_line_count counts them)
      # hop 4: each PreOrder in STAGED whose staged_case_plan_line_id points at
      #        one of those lines moves to HELD
    input_set: "TemperatureLog rows of the department in created_at ASC order (the only sanctioned common-field ordering), plus the department's CaseFailure rows by status."
    constants:
      CONSECUTIVE_FAILURE_THRESHOLD: 2
      ESCALATION_MINUTES: 240
    precision: "readings 1 decimal place; counters are integers; comparisons are strict `>` for out-of-spec and inclusive `>=` for the critical spike and the consecutive threshold"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first violated rule determines the response)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint per §1.7"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the request path exists, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: required fields present, enum members valid, numeric ranges honored, dates and datetimes ISO 8601, scheduled_end_at > scheduled_start_at, pickup_window_end_at > pickup_window_start_at, period_end_date >= period_start_date, exactly one of TrimLot.cutting_test_line_id / source_trim_lot_id supplied, lean_pct present only for GRIND_TRIM lines, retail_item_id present only for SALABLE_CUT lines"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: existence
    check: "Every foreign-key id in the request body exists"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"

  - priority: 6
    category: auth
    check: "The requested transition action is permitted for the caller's role (e.g. only MeatManager may APPROVE a cutting test, only MeatCutter may REVISE it)"
    error_id: ERR_TRANSITION_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all /transitions endpoints"

  - priority: 7
    category: state
    check: "expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
    applies_to: "POST /meat-ops/cutting-tests, POST /meat-ops/retail-items/{id}/price-activations"

  - priority: 8
    category: state
    check: "The requested transition exists from the resource's current state in §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all /transitions endpoints and all sub-resource write endpoints"

  - priority: 9
    category: state
    check: "The APPROVED CuttingTest that supplies the cost basis exists for a CUT_TEST_LINE price activation"
    error_id: ERR_SOURCE_TEST_NOT_APPROVED
    http_status: 409
    applies_to: "POST /meat-ops/retail-items/{id}/price-activations"

  - priority: 10
    category: state
    check: "A COMPLETED GrindRun supplies the blend cost basis for a GRIND_BLEND price activation"
    error_id: ERR_COST_BASIS_UNAVAILABLE
    http_status: 409
    applies_to: "POST /meat-ops/retail-items/{id}/price-activations"

  - priority: 11
    category: state
    check: "The referenced RetailItem.price_status IN {PROPOSED, PRICED, REPRICE_REQUIRED}"
    error_id: ERR_ITEM_NOT_PRICED
    http_status: 409
    applies_to: "POST /meat-ops/case-plans/{id}/lines, POST /meat-ops/case-plans/{id}/transitions action=PUBLISH, POST /meat-ops/pre-orders/{id}/transitions action=CONFIRM, POST /meat-ops/grind-runs/{id}/transitions action=START"

  - priority: 12
    category: state
    check: "The owning CasePlan.plan_status == PUBLISHED"
    error_id: ERR_CASE_PLAN_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /meat-ops/case-plan-lines/{id}/fills, POST /meat-ops/case-plan-lines/{id}/markdowns, POST /meat-ops/case-plan-lines/{id}/shrink-events"

  - priority: 13
    category: state
    check: "The GrindRun.status IN {SCHEDULED, IN_PROGRESS} before inputs may be added"
    error_id: ERR_GRIND_RUN_NOT_OPEN
    http_status: 409
    applies_to: "POST /meat-ops/grind-runs/{id}/inputs"

  - priority: 14
    category: state
    check: "The TrimLot.status IN {AVAILABLE, PARTIALLY_COMMITTED}"
    error_id: ERR_TRIM_LOT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /meat-ops/grind-runs/{id}/inputs, POST /meat-ops/trim-lots (re-work source), POST /meat-ops/trim-lots/{id}/transitions"

  - priority: 15
    category: business_safety
    check: "The acting X-User-ID differs from the user who performed the segregated prior step (CuttingTest.submitted_by_user_id on APPROVE/REJECT, CaseFailure.reported_by_user_id on RESOLVE)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /meat-ops/cutting-tests/{id}/transitions actions APPROVE and REJECT, POST /meat-ops/case-failures/{id}/transitions action=RESOLVE"

  - priority: 16
    category: business_safety
    check: "Department.case_posture != SALES_HALTED"
    error_id: ERR_POSTURE_SALES_HALTED
    http_status: 409
    applies_to: "POST /meat-ops/case-plans/{id}/lines, POST /meat-ops/case-plans/{id}/transitions actions PUBLISH and RESUME, POST /meat-ops/case-plan-lines/{id}/fills, POST /meat-ops/grind-runs/{id}/transitions action=START"

  - priority: 17
    category: business_safety
    check: "The CasePlanLine.sell_by_date is not earlier than the logical clock's current date"
    error_id: ERR_SELL_BY_EXPIRED
    http_status: 422
    applies_to: "POST /meat-ops/pre-orders/{id}/transitions action=STAGE, POST /meat-ops/case-plan-lines/{id}/markdowns"

  - priority: 18
    category: business_safety
    check: "The source TrimLot.rework_generation < REGRIND_GENERATION_LIMIT — re-grinding already re-worked trim is prohibited"
    error_id: ERR_PROHIBITED_REGRIND
    http_status: 422
    applies_to: "POST /meat-ops/trim-lots"

  - priority: 19
    category: business_safety
    check: "The GrindRun.coo_label derived from the run inputs equals the run's declared_coo"
    error_id: ERR_COO_LABEL_MISMATCH
    http_status: 422
    applies_to: "POST /meat-ops/grind-runs/{id}/transitions action=COMPLETE"

  - priority: 20
    category: business_safety
    check: "The CasePlanLine.line_status != HELD and the PreOrder.status != HELD"
    error_id: ERR_LINE_ON_HOLD
    http_status: 409
    applies_to: "POST /meat-ops/case-plan-lines/{id}/markdowns, POST /meat-ops/pre-orders/{id}/transitions actions STAGE and PICK_UP"

  - priority: 21
    category: business_referential
    check: "Every entity referenced in one request belongs to the same Department"
    error_id: ERR_DEPARTMENT_MISMATCH
    http_status: 422
    applies_to: "POST /meat-ops/case-plans/{id}/lines, POST /meat-ops/grind-runs, POST /meat-ops/grind-runs/{id}/inputs, POST /meat-ops/pre-orders, POST /meat-ops/retail-items/{id}/price-proposals, POST /meat-ops/retail-items/{id}/price-activations, POST /meat-ops/trim-lots"

  - priority: 22
    category: business_referential
    check: "Product classes are compatible: a GrindRun targets a GROUND RetailItem; a CUT_TEST_LINE item's price basis comes from a PrimalPurchase whose product_class equals the item's product_class (WHOLE_MUSCLE or VAC_PACKED) on both the proposal and the activation; a GRIND_BLEND (GROUND) item's provisional proposal may cite any PrimalPurchase of the same department, while its activation must cite a COMPLETED GrindRun; a staged PreOrder line carries the ordered item"
    error_id: ERR_PRODUCT_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /meat-ops/grind-runs, POST /meat-ops/retail-items/{id}/price-proposals, POST /meat-ops/retail-items/{id}/price-activations, POST /meat-ops/pre-orders/{id}/transitions action=STAGE"

  - priority: 23
    category: business_referential
    check: "Scoped uniqueness holds: Department.store_code, RetailItem.item_code per department, TrimLot.lot_code per department, CasePlan.service_date per department, CuttingTestLine.line_seq per test, CasePlanLine.line_seq per plan, GrindInput.input_seq and trim_lot_id per run"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /meat-ops/departments, POST /meat-ops/retail-items, POST /meat-ops/trim-lots, POST /meat-ops/case-plans, POST /meat-ops/cutting-tests/{id}/lines, POST /meat-ops/case-plans/{id}/lines, POST /meat-ops/grind-runs/{id}/inputs"

  - priority: 24
    category: business_temporal
    check: "The requested grinder window [scheduled_start_at, scheduled_end_at) does not overlap any other SCHEDULED or IN_PROGRESS GrindRun window in the department (half-open: touching windows do not overlap)"
    error_id: ERR_GRINDER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /meat-ops/grind-runs"

  - priority: 25
    category: business_temporal
    check: "When the nearest neighbouring SCHEDULED or IN_PROGRESS GrindRun window in the department carries a different declared_coo, the gap between the two windows is >= Department.grind_sanitation_buffer_min minutes (a gap exactly equal to the buffer is accepted)"
    error_id: ERR_SANITATION_BUFFER_REQUIRED
    http_status: 409
    applies_to: "POST /meat-ops/grind-runs"

  - priority: 26
    category: business_temporal
    check: "The count of CONFIRMED or STAGED PreOrder rows in the department whose closed pickup interval [start, end] intersects the requested interval is < Department.pickup_slot_capacity"
    error_id: ERR_PICKUP_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /meat-ops/pre-orders/{id}/transitions action=CONFIRM"

  - priority: 27
    category: business_temporal
    check: "The pickup transition happens inside the closed pickup window, and FORFEIT only after it closes"
    error_id: ERR_PICKUP_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /meat-ops/pre-orders/{id}/transitions actions PICK_UP and FORFEIT"

  - priority: 28
    category: business_constraint
    check: "abs(CuttingTest.unaccounted_lb) <= UNACCOUNTED_TOLERANCE_LB and CuttingTest.test_weight_lb == PrimalPurchase.net_weight_lb"
    error_id: ERR_YIELD_NOT_RECONCILED
    http_status: 422
    applies_to: "POST /meat-ops/cutting-tests, POST /meat-ops/cutting-tests/{id}/transitions action=SUBMIT"

  - priority: 29
    category: business_constraint
    check: "The cutting test has at least one line with disposition == SALABLE_CUT"
    error_id: ERR_NO_SALABLE_YIELD
    http_status: 422
    applies_to: "POST /meat-ops/cutting-tests/{id}/transitions action=SUBMIT"

  - priority: 30
    category: business_constraint
    check: "The revision or amendment budget is not exhausted: CuttingTest.revision_count < REVISION_LIMIT, PreOrder.amend_count < AMEND_LIMIT"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /meat-ops/cutting-tests/{id}/transitions action=REVISE, POST /meat-ops/pre-orders/{id}/transitions action=AMEND"

  - priority: 31
    category: business_constraint
    check: "abs(GrindRun.blended_lean_pct - target_lean_pct) <= lean_tolerance_pct"
    error_id: ERR_LEAN_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /meat-ops/grind-runs/{id}/transitions action=COMPLETE"

  - priority: 32
    category: business_constraint
    check: "PrimalPurchase.gross_weight_lb - receiving_shrink_lb > 0"
    error_id: ERR_NET_WEIGHT_NOT_POSITIVE
    http_status: 422
    applies_to: "POST /meat-ops/primal-purchases"

  - priority: 33
    category: business_constraint
    check: "No CasePlan of the department inside the reconciled period is in plan_status SUSPENDED"
    error_id: ERR_PERIOD_HAS_SUSPENDED_PLAN
    http_status: 422
    applies_to: "POST /meat-ops/shrink-reconciliations/{id}/transitions action=POST"

  - priority: 34
    category: business_constraint
    check: "No CasePlanLine of the plan is still in line_status PLANNED when the plan is closed"
    error_id: ERR_CASE_PLAN_HAS_UNFILLED_LINES
    http_status: 422
    applies_to: "POST /meat-ops/case-plans/{id}/transitions action=CLOSE"

  - priority: 35
    category: business_constraint
    check: "A TrimLot whose allocated_lb > 0 may not be discarded"
    error_id: ERR_TRIM_LOT_COMMITTED
    http_status: 422
    applies_to: "POST /meat-ops/trim-lots/{id}/transitions action=DISCARD"

  - priority: 36
    category: business_fiscal
    check: "GrindInput.weight_lb <= TrimLot.remaining_lb"
    error_id: ERR_TRIM_INSUFFICIENT
    http_status: 422
    applies_to: "POST /meat-ops/grind-runs/{id}/inputs"

  - priority: 37
    category: business_fiscal
    check: "markdown_price_per_lb_cents >= round_half_up(RetailItem.yield_adjusted_cost_per_lb_cents * (1 + Department.markdown_floor_pct), 0)"
    error_id: ERR_MARKDOWN_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /meat-ops/case-plan-lines/{id}/markdowns"

  - priority: 38
    category: business_fiscal
    check: "CasePlanLine.actual_fill_lb + filled_lb <= required_fill_lb * FILL_OVERAGE_CAP"
    error_id: ERR_FILL_EXCEEDS_REQUIRED
    http_status: 422
    applies_to: "POST /meat-ops/case-plan-lines/{id}/fills"

  - priority: 39
    category: business_fiscal
    check: "Pounds requested against a case line are available: markdown_lb, shrink_lb and staged pounds together never exceed actual_fill_lb"
    error_id: ERR_LINE_POUNDS_UNAVAILABLE
    http_status: 422
    applies_to: "POST /meat-ops/case-plan-lines/{id}/markdowns, POST /meat-ops/case-plan-lines/{id}/shrink-events, POST /meat-ops/pre-orders/{id}/transitions action=STAGE"

  - priority: 40
    category: business_fiscal
    check: "A reconciliation whose within_tolerance == false carries an override_reason"
    error_id: ERR_SHRINK_EXCEEDS_TOLERANCE
    http_status: 422
    applies_to: "POST /meat-ops/shrink-reconciliations/{id}/transitions action=POST"

  - priority: 41
    category: business_fiscal
    check: "The cutting test's value-bearing lines carry a positive market-value weight base"
    error_id: ERR_NO_MARKET_VALUE_BASIS
    http_status: 422
    applies_to: "POST /meat-ops/cutting-tests/{id}/transitions actions SUBMIT and APPROVE"

# =============================================================================
# §1.5 API Endpoint Table  (27 writes + 27 reads = 54 endpoints)
# =============================================================================
endpoints:

  # ------------------------------------------------------------------- writes
  - method: POST
    path: "/meat-ops/departments"
    description: "Create a meat department with its pricing, shelf-life, temperature and tolerance configuration."
    roles: [StoreAdmin]
    code: 201
    input: [name, store_code, "target_margin_pct?", "shelf_life_days_ground?", "shelf_life_days_whole_muscle?", "shelf_life_days_vac_packed?", "max_safe_case_temp_c?", "critical_case_temp_c?", "pickup_slot_capacity?", "grind_sanitation_buffer_min?", "markdown_floor_pct?", "shrink_tolerance_pct?", "deposit_rate?"]
    output: Department
    side_effects: ["initializes case_posture = SALES_OPEN, all failure counters and consecutive_out_of_spec_readings = 0"]

  - method: POST
    path: "/meat-ops/primal-purchases"
    description: "Record a received primal and derive its landed cost."
    roles: [MeatCutter, MeatManager]
    code: 201
    input: [department_id, primal_code, product_class, country_of_origin, vendor_name, gross_weight_lb, invoice_cost_cents, "freight_cost_cents?", "vendor_allowance_cents?", "receiving_shrink_lb?", received_at]
    output: PrimalPurchase
    side_effects: ["runs landed_cost_derivation", "status becomes RECEIVED with unallocated_cost_cents == landed_cost_total_cents"]

  - method: POST
    path: "/meat-ops/retail-items"
    description: "Create a retail item in the case with its merchandising class."
    roles: [StoreAdmin, MeatManager]
    code: 201
    input: [department_id, item_code, subprimal_code, product_class, "target_margin_pct?"]
    output: RetailItem
    side_effects: ["sets cost_basis_source from product_class", "price_status becomes UNPRICED and country_of_origin_label becomes PENDING"]

  - method: POST
    path: "/meat-ops/cutting-tests"
    description: "Open a cutting test on a received primal. Carries OCC on the purchase because a new test supersedes any SUBMITTED or APPROVED test on the same purchase."
    roles: [MeatCutter]
    code: 201
    input: [primal_purchase_id, test_weight_lb, expected_primal_purchase_version]
    output: CuttingTest
    side_effects:
      - "rejects with ERR_STALE_PARENT_VERSION (412) when expected_primal_purchase_version does not match PrimalPurchase.version"
      - "any existing SUBMITTED or APPROVED CuttingTest on the purchase moves to SUPERSEDED and its line allocations are reset to 0"
      - "PrimalPurchase.status returns to RECEIVED with allocated_cost_cents = 0 and unallocated_cost_cents = landed_cost_total_cents"
      - "increments PrimalPurchase.version by 1"
      - "new test starts in DRAFT"

  - method: POST
    path: "/meat-ops/cutting-tests/{id}/lines"
    description: "Add a yield line to a DRAFT cutting test."
    roles: [MeatCutter]
    code: 201
    input: [line_seq, subprimal_code, disposition, yield_weight_lb, market_value_per_lb_cents, "lean_pct?", "retail_item_id?"]
    output: CuttingTestLine
    side_effects: ["recomputes CuttingTest.total_yield_weight_lb, unaccounted_lb and the three yield percentages via cutting_test_yield_metrics"]

  - method: POST
    path: "/meat-ops/cutting-tests/{id}/transitions"
    description: "Drive the cutting-test state machine: SUBMIT, APPROVE, REJECT, REVISE."
    roles: [MeatCutter, MeatManager]
    code: 200
    input: [action, "rejection_reason?"]
    output: CuttingTest
    side_effects:
      - "SUBMIT: captures submitted_by_user_id and re-runs cutting_test_yield_metrics"
      - "APPROVE: runs subprimal_cost_allocation, drives PrimalPurchase to CUT_TESTED, recomputes each salable line's RetailItem cost basis and final price, and flags stale case-plan lines (cascade of depth 4)"
      - "REJECT: stores rejection_reason and leaves every allocation at 0"
      - "REVISE: increments revision_count and returns the test to DRAFT"

  - method: POST
    path: "/meat-ops/retail-items/{id}/price-proposals"
    description: "Propose a provisional shelf price from the invoice-only cost basis and the standard book yield. A GROUND item may be proposed from any PrimalPurchase of its department (its measured basis only arrives with a COMPLETED GrindRun), which is what makes a ground item eligible for a grind run at all."
    roles: [PricingAnalyst]
    code: 201
    input: [primal_purchase_id]
    output: RetailItem
    side_effects: ["runs retail_price_per_lb (provisional_price variant)", "price_status becomes PROPOSED and active_price_per_lb_cents becomes provisional_price_per_lb_cents", "sets shelf_life_days and pricing_yield_pct_snapshot"]

  - method: POST
    path: "/meat-ops/retail-items/{id}/price-activations"
    description: "Activate the final shelf price from the approved cutting test or the completed grind blend. Carries OCC on the item."
    roles: [MeatManager]
    code: 201
    input: [expected_retail_item_version, "cutting_test_id?", "grind_run_id?"]
    output: RetailItem
    side_effects:
      - "rejects with ERR_STALE_PARENT_VERSION (412) when expected_retail_item_version does not match RetailItem.version"
      - "runs retail_price_per_lb (final_price variant) and writes final_price_per_lb_cents, active_price_per_lb_cents and price_variance_pct"
      - "price_status becomes PRICED and country_of_origin_label is set from the cost basis"
      - "clears price_stale on every CasePlanLine referencing the item and decrements CasePlan.price_stale_line_count"
      - "increments RetailItem.version by 1"

  - method: POST
    path: "/meat-ops/retail-items/{id}/transitions"
    description: "Drive the retail-item pricing state machine: SUSPEND, REINSTATE."
    roles: [MeatManager]
    code: 200
    input: [action]
    output: RetailItem
    side_effects: ["SUSPEND: item becomes ineligible for new case-plan lines and pre-orders", "REINSTATE: active_price_per_lb_cents is restored from final_price_per_lb_cents"]

  - method: POST
    path: "/meat-ops/case-plans"
    description: "Create a service-day case plan."
    roles: [MeatManager]
    code: 201
    input: [department_id, service_date]
    output: CasePlan
    side_effects: ["plan_status becomes DRAFT and fill_status becomes UNFILLED (two independent dimensions)"]

  - method: POST
    path: "/meat-ops/case-plans/{id}/lines"
    description: "Add a facing line to a case plan and derive its required fill."
    roles: [MeatManager]
    code: 201
    input: [retail_item_id, line_seq, facings, expected_movement_lb]
    output: CasePlanLine
    side_effects: ["runs required_fill_derivation using the department's current case_posture", "recomputes CasePlan.total_expected_movement_lb and total_required_fill_lb"]

  - method: POST
    path: "/meat-ops/case-plans/{id}/transitions"
    description: "Drive the case-plan publication dimension: PUBLISH, SUSPEND, RESUME, CLOSE."
    roles: [MeatManager]
    code: 200
    input: [action]
    output: CasePlan
    side_effects:
      - "PUBLISH: captures published_by_user_id and recomputes the plan totals"
      - "SUSPEND: holds every FILLED or MARKED_DOWN line and every PreOrder staged on those lines"
      - "RESUME: restores each held line to held_from_status and each held PreOrder to STAGED"
      - "CLOSE: makes the plan eligible for reconciliation scope"

  - method: POST
    path: "/meat-ops/case-plan-lines/{id}/fills"
    description: "Record pounds filled into the case for a published plan line."
    roles: [MeatCutter]
    code: 201
    input: [filled_lb]
    output: CasePlanLine
    side_effects: ["adds to actual_fill_lb", "on the first fill sets pack_date and sell_by_date via sell_by_dating", "recomputes CasePlan.total_actual_fill_lb and the fill_status dimension"]

  - method: POST
    path: "/meat-ops/case-plan-lines/{id}/markdowns"
    description: "Mark down pounds on a filled case line, floored at yield-adjusted cost plus the department markdown floor."
    roles: [PricingAnalyst]
    code: 201
    input: [markdown_lb, markdown_price_per_lb_cents]
    output: CasePlanLine
    side_effects: ["runs markdown_valuation", "adds to markdown_lb and markdown_dollars_cents", "line_status becomes MARKED_DOWN"]

  - method: POST
    path: "/meat-ops/case-plan-lines/{id}/shrink-events"
    description: "Write off pounds discarded from a case line."
    roles: [MeatManager]
    code: 201
    input: [shrink_lb]
    output: CasePlanLine
    side_effects: ["adds to shrink_lb", "line_status becomes SHRUNK_OUT when the write-off empties the line, otherwise the line keeps its status", "leaves actual_fill_lb and therefore the CasePlan fill_status dimension untouched"]

  - method: POST
    path: "/meat-ops/trim-lots"
    description: "Create a trim lot from a grind-trim cutting-test line, or re-work an existing lot into a new one."
    roles: [MeatCutter]
    code: 201
    input: [department_id, lot_code, received_lb, pack_date, "cutting_test_line_id?", "source_trim_lot_id?"]
    output: TrimLot
    side_effects:
      - "inherits country_of_origin, lean_pct and cost_per_lb_cents from the source line or source lot"
      - "sets rework_generation (0 from a cutting-test line, source + 1 from a lot) and rejects generation > REGRIND_GENERATION_LIMIT with ERR_PROHIBITED_REGRIND"
      - "runs sell_by_dating using the department's ground shelf life"
      - "status becomes AVAILABLE with remaining_lb == received_lb"

  - method: POST
    path: "/meat-ops/trim-lots/{id}/transitions"
    description: "Drive the trim-lot state machine: DISCARD."
    roles: [MeatCutter]
    code: 200
    input: [action]
    output: TrimLot
    side_effects: ["DISCARD: moves remaining_lb into discarded_lb and drives remaining_lb to 0"]

  - method: POST
    path: "/meat-ops/grind-runs"
    description: "Schedule a grinder window for a ground item."
    roles: [MeatCutter, MeatManager]
    code: 201
    input: [department_id, target_retail_item_id, declared_coo, scheduled_start_at, scheduled_end_at, target_lean_pct, "lean_tolerance_pct?", "fill_case_plan_line_id?"]
    output: GrindRun
    side_effects:
      - "rejects half-open window overlaps with ERR_GRINDER_WINDOW_CONFLICT and insufficient country-of-origin changeover gaps with ERR_SANITATION_BUFFER_REQUIRED"
      - "status becomes SCHEDULED with coo_label PENDING"

  - method: POST
    path: "/meat-ops/grind-runs/{id}/inputs"
    description: "Commit pounds of trim from a lot into a grind run."
    roles: [MeatCutter]
    code: 201
    input: [trim_lot_id, input_seq, weight_lb]
    output: GrindInput
    side_effects: ["moves weight_lb from TrimLot.remaining_lb into TrimLot.allocated_lb and advances the lot's commitment status", "recomputes the run's batch_weight_lb, blended_lean_pct, blend_cost_per_lb_cents and coo_label via grind_blend_derivation"]

  - method: POST
    path: "/meat-ops/grind-runs/{id}/transitions"
    description: "Drive the grind-run fork: START, COMPLETE, ABORT."
    roles: [MeatCutter, MeatManager]
    code: 200
    input: [action, "abort_reason?"]
    output: GrindRun
    side_effects:
      - "START: captures started_by_user_id and refreshes the blend derivation"
      - "COMPLETE: consumes every input lot's pounds, republishes the target item's cost basis, label and final price, and fills fill_case_plan_line_id when set"
      - "ABORT: restores every input lot's pounds to remaining_lb and applies none of the COMPLETE side effects"

  - method: POST
    path: "/meat-ops/temperature-logs"
    description: "Post a case temperature reading; drives posture and the case-failure cascade."
    roles: [MeatCutter, ServiceClerk]
    code: 201
    input: [department_id, case_code, reading_c]
    output: TemperatureLog
    side_effects:
      - "runs case_posture_derivation: sets out_of_spec, consecutive_index and Department.consecutive_out_of_spec_readings"
      - "opens a CaseFailure (or reopens the CONTAINED failure on the same case_code) on a critical single reading or on the second consecutive out-of-spec reading"
      - "recomputes Department.case_posture and, when it becomes SALES_HALTED, suspends published plans, holds their filled lines and holds the pre-orders staged on them"

  - method: POST
    path: "/meat-ops/case-failures/{id}/transitions"
    description: "Drive the case-failure state machine: CONTAIN, ESCALATE, RESOLVE."
    roles: [MeatCutter, MeatManager]
    code: 200
    input: [action, "containment_note?", "disposition?"]
    output: CaseFailure
    side_effects:
      - "CONTAIN: sets contained_at and moves the department from SALES_HALTED to SALES_RESTRICTED when no other failure is open"
      - "ESCALATE: sets escalated_at once the escalation window has elapsed"
      - "RESOLVE: sets resolved_at and resolved_by_user_id and recomputes case_posture"

  - method: POST
    path: "/meat-ops/pre-orders"
    description: "Take a special-order or holiday-roast pre-order."
    roles: [ServiceClerk, MeatManager]
    code: 201
    input: [department_id, retail_item_id, customer_name, customer_phone, requested_weight_lb, pickup_window_start_at, pickup_window_end_at]
    output: PreOrder
    side_effects: ["status becomes REQUESTED with every deposit field at 0"]

  - method: POST
    path: "/meat-ops/pre-orders/{id}/transitions"
    description: "Drive the pre-order state machine: CONFIRM, AMEND, STAGE, PICK_UP, CANCEL, FORFEIT."
    roles: [ServiceClerk, MeatCutter, MeatManager]
    code: 200
    input: [action, "staged_case_plan_line_id?"]
    output: PreOrder
    side_effects:
      - "CONFIRM: pins quoted_price_per_lb_cents and pinned_retail_item_version, computes deposit_cents, and enforces pickup-slot capacity over closed intervals"
      - "AMEND: increments amend_count and releases the pinned quote and deposit"
      - "STAGE: adds requested_weight_lb to CasePlanLine.staged_lb"
      - "PICK_UP: applies the deposit and releases the staged pounds"
      - "CANCEL / FORFEIT: settles the deposit per pre_order_deposit_settlement"

  - method: POST
    path: "/meat-ops/shrink-reconciliations"
    description: "Draft a shrink and markdown reconciliation for a period under one of the two bases."
    roles: [PricingAnalyst]
    code: 201
    input: [department_id, period_start_date, period_end_date, basis]
    output: ShrinkReconciliation
    side_effects: ["runs shrink_variance_reconciliation for the selected basis and writes every figure", "status becomes DRAFT"]

  - method: POST
    path: "/meat-ops/shrink-reconciliations/{id}/transitions"
    description: "Drive the reconciliation state machine: POST, DISPUTE, REDRAFT."
    roles: [MeatManager, PricingAnalyst]
    code: 200
    input: [action, "override_reason?", "dispute_reason?"]
    output: ShrinkReconciliation
    side_effects:
      - "POST: captures posted_by_user_id and moves the period's CUT_TESTED purchases to RECONCILED"
      - "DISPUTE: freezes the figures"
      - "REDRAFT: recomputes every figure from current line data"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. Before any call the logical clock reads exactly the fixed startup default 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [StoreAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["all subsequent date and window evaluations (pack dates, sell-by gates, escalation windows, pickup windows, reconciliation periods) read this instant"]

  # -------------------------------------------------------------------- reads
