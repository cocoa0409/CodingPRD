          - entities.SubstitutionEndorsement.fields.substitute_qty_per_car
        distinguishing_aspect: "The same substitution endorsement leaves the quote at 1614500 cents while it is PENDING and moves it to 1617500 cents once APPROVED, so only endorsements in {APPROVED, APPLIED} enter the effective-quantity term."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z, the order's own order_date, so the forecast lapse uplift is empty."
            - "Car type BOX-200 (BOXCAR, build_hours 30, line_count_family LINE-B) with WS-210 WHEELSET qty 4 cost 18000 on_hand 40, CS-210 CASTING qty 2 cost 40000 on_hand 20, CT-210 COATING qty 3 cost 12500 on_hand 100; substitute WS-220 WHEELSET costs 20000 with on_hand_qty 100."
            - "SOLD order of 5 cars (planned_shop_days 150) reserved so the committed quote 1614500 is on the row before the endorsement is raised."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
