          setup:
            - "Program P (DRAFT) has a SPOUSE AUDIT documentation rule and one enrolled SPOUSE dependent D1 under employee E1."
            - "One FULL_CENSUS scope run has already succeeded using version ${pv}, so AuditProgram.version has advanced past ${pv}."
