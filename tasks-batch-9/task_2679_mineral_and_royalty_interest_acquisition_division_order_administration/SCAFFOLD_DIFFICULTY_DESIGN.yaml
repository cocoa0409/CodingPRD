          - state_machines.UnitTractAllocation.ACTIVE_to_TERMINATED
          - endpoints[POST /division-orders]
        dependency:
          acting_entity: DivisionOrder
          gating_entity: UnitTractAllocation
          gating_state: "allocation_status IN {ACTIVE, PUGH_RELEASED}"
        distinguishing_aspect: |
          Creating a DivisionOrder depends on the state of a UnitTractAllocation the request
          never names. The selector is interval-first and status-second: a TERMINATED
          allocation still covers the logical clock date, so priority 72 is satisfied and the
          request fails at priority 73 with ERR_ALLOCATION_NOT_ACTIVE rather than with
          ERR_NO_ACTIVE_ALLOCATION. Creating a fresh allocation over the same interval - legal
          because the overlap rule only looks at ACTIVE and PUGH_RELEASED rows - unblocks the
          identical division-order request.
