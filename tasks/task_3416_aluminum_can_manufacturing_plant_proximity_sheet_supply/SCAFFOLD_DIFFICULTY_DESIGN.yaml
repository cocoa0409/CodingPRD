# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3416_aluminum_can_manufacturing_plant_proximity_sheet_supply
# 9 rules x 2 instances = 18 instances. All numeric asserts pre-computed.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: unit_price_provisional_prior_month_vs_final_delivery_month
        grounds:
          - calculations.can_unit_price
          - state_machines.ProductionRun.IN_PROGRESS_to_COMPLETED
          - state_machines.ProductionRun.COMPLETED_to_SETTLED
        distinguishing_aspect: |
          Pricing-domain dual variant: the SAME run prices at 5032.80 cents/1000 under the
          PROVISIONAL variant (prior-month 2026-08 index 128.00) and at 5226.00 cents/1000
          under the FINAL variant (delivery-month 2026-09 index 135.00) — identical run,
          identical agreement terms, different index-selection rule.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Plant cap 1000000; customer same region (NEAR); agreement committed 12000000, pass-through 0.92, conversion 1500; indices 2026-08=128.00 and 2026-09=135.00 published; line L base spoilage 0.04; format F STANDARD non-specialty 30.0 lbs/1000, QUALIFIED; run R scheduled 250000, window 2026-09-10T08:00:00Z..2026-09-10T16:00:00Z, STARTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "Phoenix Can Plant", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Desert Beverage Co", home_region: "US-SW", filling_lines_count: 3 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /metal-price-indices"
              payload: { period: "2026-08", index_cents_per_lb: 128.0 }
              as: PlatformAdmin
            - call: "POST /metal-price-indices"
              payload: { period: "2026-09", index_cents_per_lb: 135.0 }
              as: PlatformAdmin
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 0.92, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id, agr_v: $.data.version }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { agr_v: $.data.version }
            - call: "POST /plants/${plant_id}/lines"
              payload: { name: "Line 1", nominal_speed_cans_per_hour: 120000, base_spoilage_pct: 0.04 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /plants/${plant_id}/formats"
              payload: { customer_id: "${cust_id}", size_code: "12OZ", shape: "STANDARD", is_specialty: false, metal_lbs_per_1000_units: 30.0, tooling_investment_cents: 0, min_volume_commitment_units: 0 }
              as: PlantManager
              captures: { fmt_id: $.data.id }
            - call: "POST /formats/${fmt_id}/tool"
              payload: {}
              as: PlantManager
            - call: "POST /formats/${fmt_id}/qualify"
              payload: {}
              as: PlantManager
            - call: "POST /supply-agreements/${agr_id}/production-runs"
              payload: { line_id: "${line_id}", format_id: "${fmt_id}", scheduled_qty: 250000, graphics_code: "STD-RED", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z", expected_agreement_version: "${agr_v}" }
              as: LineScheduler
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/start"
              payload: {}
              as: LineScheduler
          trigger:
            - call: "POST /production-runs/${run_id}/complete"
              payload: { produced_qty: 250000, spoiled_qty: 5000 }
              as: LineScheduler
              captures: { prov_price: $.data.provisional_unit_price_cents_per_1000 }
            - call: "POST /production-runs/${run_id}/settle"
              payload: {}
              as: PlantManager
              captures: { final_price: $.data.final_unit_price_cents_per_1000, settled_amt: $.data.settled_amount_cents }
          assert:
            - "prov_price == 5032.80  (30.0 * 128.00 * 0.92 + 1500 = 3532.80 + 1500)"
            - "final_price == 5226.00  (30.0 * 135.00 * 0.92 + 1500 = 3726.00 + 1500)"
            - "prov_price != final_price for identical run and agreement terms"
            - "settled_amt == 1306500.00  (5226.00 * 250000 / 1000)"
            - "ProductionRun.${run_id}.status == SETTLED"

      - name: forecast_accuracy_rolling_mean_vs_lifetime_ratio
        grounds:
          - calculations.forecast_accuracy
          - state_machines.CustomerForecast.OPEN_to_CLOSED
          - entities.SupplyAgreement.fields.rolling_accuracy_pct
          - entities.SupplyAgreement.fields.lifetime_accuracy_pct
        distinguishing_aspect: |
          Forecast-domain dual variant: over the same three CLOSED forecasts (90.00, 80.00,
          100.00), rolling_accuracy_pct (mean-of-ratios over last 3) == 90.00 while
          lifetime_accuracy_pct (ratio-of-aggregates over all) == 94.29 — same input set,
          two valid aggregations, different results. Distinct entity domain from pricing.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Plant, customer, ACTIVE agreement (committed 12000000, pass-through 0.9, conversion 1500). Three forecasts: 2026-06 f=100000 closed a=90000; 2026-07 f=120000 closed a=150000; 2026-08 f=110000 closed a=110000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
            - call: "POST /supply-agreements/${agr_id}/forecasts"
              payload: { period: "2026-06", forecast_qty: 100000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /supply-agreements/${agr_id}/forecasts"
              payload: { period: "2026-07", forecast_qty: 120000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { f2_id: $.data.id }
            - call: "POST /supply-agreements/${agr_id}/forecasts"
              payload: { period: "2026-08", forecast_qty: 110000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { f3_id: $.data.id }
            - call: "POST /forecasts/${f1_id}/close"
              payload: { actual_qty: 90000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
            - call: "POST /forecasts/${f2_id}/close"
              payload: { actual_qty: 150000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /forecasts/${f3_id}/close"
              payload: { actual_qty: 110000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
            - call: "GET /supply-agreements/${agr_id}"
              payload: {}
              as: PlantManager
              captures: { rolling: $.data.rolling_accuracy_pct, lifetime: $.data.lifetime_accuracy_pct }
          assert:
            - "CustomerForecast.${f1_id}.accuracy_pct == 90.00  (1 - 10000/100000)"
            - "CustomerForecast.${f2_id}.accuracy_pct == 80.00  (1 - 30000/150000)"
            - "CustomerForecast.${f3_id}.accuracy_pct == 100.00"
            - "rolling == 90.00  ((90.00 + 80.00 + 100.00) / 3)"
            - "lifetime == 94.29  (100 * (1 - |330000 - 350000| / 350000) = 94.2857 -> 94.29)"
            - "rolling != lifetime over the identical closed forecast set"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: spoilage_expected_capped_multifactor_with_changeover_branch
        grounds:
          - calculations.expected_spoilage_pct
          - entities.ProductionRun.fields.spoilage_flag
        distinguishing_aspect: |
          Mode (a) combinatorial: expected spoilage = min(0.15, base 0.04 + specialty 0.03 +
          changeover 0.02) = 0.09 when graphics change, but 0.07 when the previous run shares
          graphics — the SAME produced/spoiled pair (100000/8000, effective 0.0741) yields
          spoilage_flag false under the 0.09 branch and true under the 0.07 branch.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Plant cap 1000000; customer; ACTIVE agreement (committed 12000000, pass 1.0, conversion 1500); indices 2026-08 and 2026-09 = 128.0; line base_spoilage 0.04; SPECIALTY format (tooling 100000, min commitment 1000000, 30.0 lbs/1000) QUALIFIED. Prev run PREV graphics SUMMER window 2026-09-02T08:00..16:00 SCHEDULED. Run A graphics OKTOBERFEST window 2026-09-03T08:00..16:00 IN_PROGRESS. Run B graphics OKTOBERFEST window 2026-09-04T08:00..16:00 IN_PROGRESS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /metal-price-indices"
              payload: { period: "2026-08", index_cents_per_lb: 128.0 }
              as: PlatformAdmin
            - call: "POST /metal-price-indices"
              payload: { period: "2026-09", index_cents_per_lb: 128.0 }
              as: PlatformAdmin
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 1.0, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id, agr_v: $.data.version }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { agr_v: $.data.version }
            - call: "POST /plants/${plant_id}/lines"
              payload: { name: "L", nominal_speed_cans_per_hour: 120000, base_spoilage_pct: 0.04 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /plants/${plant_id}/formats"
              payload: { customer_id: "${cust_id}", size_code: "8OZ-SLEEK", shape: "SLEEK", is_specialty: true, metal_lbs_per_1000_units: 30.0, tooling_investment_cents: 100000, min_volume_commitment_units: 1000000 }
              as: PlantManager
              captures: { fmt_id: $.data.id }
            - call: "POST /formats/${fmt_id}/tool"
              payload: {}
              as: PlantManager
            - call: "POST /formats/${fmt_id}/qualify"
              payload: {}
              as: PlantManager
            - call: "POST /supply-agreements/${agr_id}/production-runs"
              payload: { line_id: "${line_id}", format_id: "${fmt_id}", scheduled_qty: 100000, graphics_code: "SUMMER", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-02T16:00:00Z", expected_agreement_version: "${agr_v}" }
              as: LineScheduler
              captures: { prev_run_id: $.data.id }
            - call: "GET /supply-agreements/${agr_id}"
              payload: {}
              as: PlantManager
              captures: { agr_v: $.data.version }
            - call: "POST /supply-agreements/${agr_id}/production-runs"
              payload: { line_id: "${line_id}", format_id: "${fmt_id}", scheduled_qty: 100000, graphics_code: "OKTOBERFEST", window_start: "2026-09-03T08:00:00Z", window_end: "2026-09-03T16:00:00Z", expected_agreement_version: "${agr_v}" }
              as: LineScheduler
              captures: { run_a_id: $.data.id }
            - call: "POST /production-runs/${run_a_id}/start"
              payload: {}
              as: LineScheduler
            - call: "GET /supply-agreements/${agr_id}"
              payload: {}
              as: PlantManager
              captures: { agr_v: $.data.version }
            - call: "POST /supply-agreements/${agr_id}/production-runs"
              payload: { line_id: "${line_id}", format_id: "${fmt_id}", scheduled_qty: 100000, graphics_code: "OKTOBERFEST", window_start: "2026-09-04T08:00:00Z", window_end: "2026-09-04T16:00:00Z", expected_agreement_version: "${agr_v}" }
              as: LineScheduler
              captures: { run_b_id: $.data.id }
            - call: "POST /production-runs/${run_b_id}/start"
              payload: {}
              as: LineScheduler
          trigger:
            - call: "POST /production-runs/${run_a_id}/complete"
              payload: { produced_qty: 100000, spoiled_qty: 8000 }
              as: LineScheduler
              captures: { flag_a: $.data.spoilage_flag, eff_a: $.data.effective_spoilage_pct }
            - call: "POST /production-runs/${run_b_id}/complete"
              payload: { produced_qty: 100000, spoiled_qty: 8000 }
              as: LineScheduler
              captures: { flag_b: $.data.spoilage_flag, eff_b: $.data.effective_spoilage_pct }
          assert:
            - "eff_a == eff_b == 0.0741 (8000 / 108000, 4dp)"
            - "flag_a == false — previous run graphics SUMMER differs from OKTOBERFEST, so changeover applies: expected = min(0.15, 0.04 + 0.03 + 0.02) = 0.09, and 0.0741 <= 0.09"
            - "flag_b == true — previous run is run A with the same graphics OKTOBERFEST, so no changeover: expected = min(0.15, 0.04 + 0.03) = 0.07, and 0.0741 > 0.07"
            - "identical produced/spoiled inputs flip the flag purely via the changeover branch"

      - name: invoice_round_per_run_then_sum_beats_sum_then_round
        grounds:
          - calculations.run_invoice_amount
          - entities.SupplyAgreement.fields.delivered_revenue_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: unit price 3189.74 cents/1000 (= round_half_up(13.5 *
          101.3 * 0.87 + 2000, 2)) times 7777 units rounds per run to 24806.61; summing two
          settled runs gives 49613.22, whereas the forbidden sum-then-round order over
          unrounded components gives 49613.19 — a one-cent divergence the scaffold pins away.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Plant cap 1000000; customer; ACTIVE agreement A2 committed 1000000, pass 0.87, conversion 2000; indices 2026-08=101.3 and 2026-09=101.3; line; STANDARD format 13.5 lbs/1000 QUALIFIED; runs R1 (2026-09-10T08:00..16:00) and R2 (2026-09-11T08:00..16:00) each scheduled 7777, graphics G1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /metal-price-indices"
              payload: { period: "2026-08", index_cents_per_lb: 101.3 }
              as: PlatformAdmin
            - call: "POST /metal-price-indices"
              payload: { period: "2026-09", index_cents_per_lb: 101.3 }
              as: PlatformAdmin
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 1000000, pass_through_pct: 0.87, conversion_cost_cents_per_1000: 2000, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id, agr_v: $.data.version }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { agr_v: $.data.version }
            - call: "POST /plants/${plant_id}/lines"
              payload: { name: "L", nominal_speed_cans_per_hour: 120000, base_spoilage_pct: 0.04 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /plants/${plant_id}/formats"
              payload: { customer_id: "${cust_id}", size_code: "16OZ", shape: "STANDARD", is_specialty: false, metal_lbs_per_1000_units: 13.5, tooling_investment_cents: 0, min_volume_commitment_units: 0 }
              as: PlantManager
              captures: { fmt_id: $.data.id }
            - call: "POST /formats/${fmt_id}/tool"
              payload: {}
              as: PlantManager
            - call: "POST /formats/${fmt_id}/qualify"
              payload: {}
              as: PlantManager
            - call: "POST /supply-agreements/${agr_id}/production-runs"
              payload: { line_id: "${line_id}", format_id: "${fmt_id}", scheduled_qty: 7777, graphics_code: "G1", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z", expected_agreement_version: "${agr_v}" }
              as: LineScheduler
              captures: { r1_id: $.data.id }
            - call: "POST /production-runs/${r1_id}/start"
              payload: {}
              as: LineScheduler
            - call: "POST /production-runs/${r1_id}/complete"
              payload: { produced_qty: 7777, spoiled_qty: 0 }
              as: LineScheduler
            - call: "GET /supply-agreements/${agr_id}"
              payload: {}
              as: PlantManager
              captures: { agr_v: $.data.version }
            - call: "POST /supply-agreements/${agr_id}/production-runs"
              payload: { line_id: "${line_id}", format_id: "${fmt_id}", scheduled_qty: 7777, graphics_code: "G1", window_start: "2026-09-11T08:00:00Z", window_end: "2026-09-11T16:00:00Z", expected_agreement_version: "${agr_v}" }
              as: LineScheduler
              captures: { r2_id: $.data.id }
            - call: "POST /production-runs/${r2_id}/start"
              payload: {}
              as: LineScheduler
            - call: "POST /production-runs/${r2_id}/complete"
              payload: { produced_qty: 7777, spoiled_qty: 0 }
              as: LineScheduler
          trigger:
            - call: "POST /production-runs/${r1_id}/settle"
              payload: {}
              as: PlantManager
              captures: { r1_amt: $.data.settled_amount_cents }
            - call: "POST /production-runs/${r2_id}/settle"
              payload: {}
              as: PlantManager
              captures: { r2_amt: $.data.settled_amount_cents }
            - call: "GET /supply-agreements/${agr_id}"
              payload: {}
              as: PlantManager
              captures: { revenue: $.data.delivered_revenue_cents }
          assert:
