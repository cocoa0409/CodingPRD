scaffold_corner_design:
  # =========================================================================
  # Cross-Cutting Complexity Layers — Optimistic Concurrency (OCC)
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_invoice_payment_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[invoice-payment-stale-version]", entities.Invoice.fields.version]
        distinguishing_aspect: "First payment with expected_invoice_version=1 succeeds and bumps invoice version to 2; a second payment still carrying version 1 is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "ACTIVE subscription with one ISSUED invoice (total_due 6000, version 1); one partial payment already applied so version is now 2."
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tec", region: "North" }, as: ProgramAdmin, captures: { t_id: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub_id}", technician_id: "${t_id}", scheduled_start_at: "2026-06-01T09:00:00Z" }, as: Dispatcher, captures: { io_id: "$.data.id" } }
            - { call: "POST /install-orders/${io_id}/complete", payload: {}, as: FieldTech, as_user_id: "${t_id}" }
            - { call: "POST /subscriptions/${sub_id}/activate", payload: {}, as: CustomerCare }
            - { call: "POST /subscriptions/${sub_id}/invoices", payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: Billing, captures: { inv_id: "$.data.id", inv_v: "$.data.version" } }
            - { call: "POST /invoices/${inv_id}/payments", payload: { amount_cents: 1000, expected_invoice_version: "${inv_v}" }, as: Billing }
          trigger:
            - { call: "POST /invoices/${inv_id}/payments", payload: { amount_cents: 1000, expected_invoice_version: "${inv_v}" }, as: Billing, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_VERSION (412)"
            - "Invoice.${inv_id}.amount_paid_cents == 1000 (second payment not applied)"

      - name: occ_grant_claim_create_stale_grant_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[grant-claim-create-stale-grant]", entities.Grant.fields.version]
        distinguishing_aspect: "First claim create with expected_grant_version=1 succeeds and bumps grant version to 2; a second create still carrying version 1 is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Grant (version 1) with one SERVICEABLE area; one claim already created against it (grant version now 2)."
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /grants/${g_id}/claims", payload: { claim_period_start: "2026-06-01T00:00:00Z", claim_period_end: "2026-07-01T00:00:00Z", service_area_ids: ["${a_id}"], expected_grant_version: "${g_v}" }, as: ComplianceAnalyst, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /grants/${g_id}/claims", payload: { claim_period_start: "2026-07-01T00:00:00Z", claim_period_end: "2026-08-01T00:00:00Z", service_area_ids: ["${a_id}"], expected_grant_version: "${g_v}" }, as: ComplianceAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_VERSION (412)"

  # =========================================================================
  # Entities — creation, defaults, computed/system fields, not-found, required
  # =========================================================================
  - section: entities
    instances:
      - name: service_area_default_fiber_ready_false
        claim_type: defaults
        grounds: [entities.ServiceArea.fields.fiber_ready]
        distinguishing_aspect: "Omitting fiber_ready on create applies the default false."
        test_recipe:
          setup: ["A grant exists."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area X", census_block_group: "010010009999", homes_passed: 50 }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
          assert:
            - "ServiceArea.${a_id}.fiber_ready == false"
            - "ServiceArea.${a_id}.status == PLANNED"

      - name: subscription_price_snapshot_computed
        claim_type: computed_fields
        grounds: [entities.Subscription.fields.monthly_price_cents]
        distinguishing_aspect: "monthly_price_cents is computed as a snapshot of the plan's 6000, not client-supplied."
        test_recipe:
          setup: ["A SERVICEABLE area and a STANDARD plan (6000)."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
          assert:
            - "Subscription.${sub_id}.monthly_price_cents == 6000"
            - "Subscription.${sub_id}.service_status == PENDING_INSTALL"
            - "Subscription.${sub_id}.billing_status == CURRENT"

      - name: subscriber_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SUBSCRIBER_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent subscriber id returns ERR_SUBSCRIBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "GET /subscribers/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerCare, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SUBSCRIBER_NOT_FOUND (404)"

      - name: subscription_create_missing_required_field
        claim_type: required_fields
        grounds: ["endpoints.POST /subscriptions", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Creating a subscription without plan_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A SERVICEABLE area and a subscriber exist."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION (400)"

  # =========================================================================
  # State machines — invalid transitions, terminal lockdown, cyclic self-loop
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_subscription_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a subscription already in CANCELLED returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["An ACTIVE subscription already cancelled once (service_status CANCELLED)."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
            - { call: "POST /subscriptions/${sub_id}/cancel", payload: {}, as: CustomerCare }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/cancel", payload: {}, as: CustomerCare, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"
            - "Subscription.${sub_id}.service_status == CANCELLED"

      - name: approve_claim_from_draft_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.GrantClaim.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a claim still in DRAFT (never submitted) fails the state precondition (priority 4) before the SoD check, returning ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT claim on a SERVICEABLE-area grant."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /grants/${g_id}/claims", payload: { claim_period_start: "2026-06-01T00:00:00Z", claim_period_end: "2026-07-01T00:00:00Z", service_area_ids: ["${a_id}"], expected_grant_version: "${g_v}" }, as: ComplianceAnalyst, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /grant-claims/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"
            - "GrantClaim.${c_id}.status == DRAFT"

      - name: install_reschedule_self_loop_increments_count
        claim_type: cyclic
        grounds: [state_machines.InstallOrder.SCHEDULED_to_SCHEDULED, entities.InstallOrder.fields.reschedule_count]
        distinguishing_aspect: "Rescheduling a SCHEDULED install to a non-overlapping window keeps status SCHEDULED (self-loop) and increments reschedule_count to 1."
        test_recipe:
          setup: ["A SCHEDULED install for a subscription with a technician."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tec", region: "North" }, as: ProgramAdmin, captures: { t_id: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub_id}", technician_id: "${t_id}", scheduled_start_at: "2026-06-02T09:00:00Z" }, as: Dispatcher, captures: { io_id: "$.data.id" } }
          trigger:
            - { call: "POST /install-orders/${io_id}/reschedule", payload: { scheduled_start_at: "2026-06-03T09:00:00Z" }, as: Dispatcher }
          assert:
            - "InstallOrder.${io_id}.status == SCHEDULED"
            - "InstallOrder.${io_id}.reschedule_count == 1"

      - name: outage_resolve_ended_before_started_invalid
        claim_type: invalid_transition
        grounds: [state_machines.OutageEvent.OPEN_to_RESOLVED, "errors[ERR_OUTAGE_NOT_ENDED]"]
        distinguishing_aspect: "Resolving an outage with ended_at before started_at returns ERR_OUTAGE_NOT_ENDED (422); outage stays OPEN."
        test_recipe:
          setup: ["A SERVICEABLE area with an OPEN outage started 2026-06-01T06:00Z."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /outages", payload: { service_area_id: "${a_id}", started_at: "2026-06-01T06:00:00Z", severity: "FULL" }, as: NocOperator, captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /outages/${o_id}/resolve", payload: { ended_at: "2026-06-01T05:00:00Z" }, as: NocOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_OUTAGE_NOT_ENDED (422)"
            - "OutageEvent.${o_id}.status == OPEN"

      - name: verify_ineligible_enrollment_denied
        claim_type: valid_transition
        grounds: [state_machines.Enrollment.SUBMITTED_to_DENIED, calculations.enrollment_fpl_pct]
        distinguishing_aspect: "Verify of an enrollment whose fpl_pct (245.82) exceeds the 200 ceiling branches to DENIED (a terminal business outcome, not an error)."
        test_recipe:
          setup: ["Subsidy ceiling 200; a SUBMITTED enrollment household_size 2 income 5000000 (fpl 245.82)."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100 }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /subsidy-programs", payload: { name: "Digital Equity Credit", monthly_discount_cents: 3000, device_benefit_cents: 12000, eligibility_fpl_pct: 200 }, as: ProgramAdmin, captures: { sp_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Rich Doe", email: "rich@x.com", service_address: "9 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /enrollments", payload: { subscriber_id: "${s_id}", subsidy_program_id: "${sp_id}", household_size: 2, annual_income_cents: 5000000 }, as: EligibilityWorker, captures: { e_id: "$.data.id" } }
          trigger:
            - { call: "POST /enrollments/${e_id}/verify", payload: {}, as: EligibilityWorker }
          assert:
            - "Enrollment.${e_id}.fpl_pct == 245.82"
            - "Enrollment.${e_id}.status == DENIED"

  # =========================================================================
  # Validations — business-constraint error paths not covered by §1.8
  # =========================================================================
  - section: validations
    instances:
      - name: duplicate_active_enrollment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_ACTIVE_ENROLLMENT]"]
        distinguishing_aspect: "Verifying a second enrollment for a subscriber who already has an ACTIVE enrollment returns ERR_DUPLICATE_ACTIVE_ENROLLMENT (409)."
        test_recipe:
          setup: ["A subscriber with one ACTIVE enrollment and a second SUBMITTED enrollment."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100 }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /subsidy-programs", payload: { name: "Digital Equity Credit", monthly_discount_cents: 3000, device_benefit_cents: 12000, eligibility_fpl_pct: 200 }, as: ProgramAdmin, captures: { sp_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /enrollments", payload: { subscriber_id: "${s_id}", subsidy_program_id: "${sp_id}", household_size: 2, annual_income_cents: 3000000 }, as: EligibilityWorker, captures: { e1: "$.data.id" } }
            - { call: "POST /enrollments/${e1}/verify", payload: {}, as: EligibilityWorker }
            - { call: "POST /enrollments", payload: { subscriber_id: "${s_id}", subsidy_program_id: "${sp_id}", household_size: 2, annual_income_cents: 3000000 }, as: EligibilityWorker, captures: { e2: "$.data.id" } }
          trigger:
            - { call: "POST /enrollments/${e2}/verify", payload: {}, as: EligibilityWorker, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_DUPLICATE_ACTIVE_ENROLLMENT (409)"

      - name: device_assign_not_available_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DEVICE_NOT_AVAILABLE]"]
        distinguishing_aspect: "Assigning a device already in ASSIGNED status returns ERR_DEVICE_NOT_AVAILABLE (409)."
        test_recipe:
          setup: ["A subscription and a device already ASSIGNED to it."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
