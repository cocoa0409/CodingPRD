      - name: obsolete_product_blocked_from_new_order_line
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_PRODUCT_NOT_ACTIVE]"
          - "state_machines.Product"
        distinguishing_aspect: "Lifecycle gating flows into ordering: a product walked ACTIVE -> PHASEOUT -> OBSOLETE cannot be added to a new order line."
