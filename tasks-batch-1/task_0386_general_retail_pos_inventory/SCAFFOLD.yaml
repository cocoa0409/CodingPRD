# =============================================================================
# task_0386 — General Retail POS & Inventory
# Scaffold seed tables (§1.0–§1.7). Difficulty band: Expert (§0.4).
# =============================================================================

scenario: |
  386. General Retail POS & Inventory: SKU/barcode & price, sale/return/exchange
  transaction, tender & split payment, inventory count & reorder point,
  discount/promo & loyalty, layaway/special order, end-of-day cash reconciliation,
  multi-store transfer

domain_name: general-retail-pos
api_prefix: /

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Derived field reconciliation"

  entity_topology: hybrid
  # Store is the aggregate root (tree: Store -> CashSession -> Sale). Product is a
  # flat catalog referenced by SKU. InventoryItem, Transfer, Layaway, LoyaltyAccount
  # are peers with cross-aggregate FK references (Store + Product). Hence hybrid.

  state_machine_shape: parallel
  # Sale carries TWO independent state dimensions (settlement_status × stock_status)
  # that evolve on their own axes; CashSession is linear-with-revert; Transfer is
  # branching fork (DISPATCHED -> {RECEIVED, REJECTED}); Layaway is cyclic
  # (ACTIVE -> DELINQUENT -> ACTIVE payment loop).

  relationship_patterns:
    - one_to_many        # Store has many InventoryItems, CashSessions, Sales
    - cross_aggregate    # Sale lines reference Product + InventoryItem across stores
    - many_to_many       # Transfer links a source Store and a destination Store via one Product

  role_model: peer_roles
  # Cashier owns sales/tenders; InventoryClerk owns counts/transfers/reorder;
  # StoreManager owns cash reconciliation + promotions + layaway overrides;
  # Customer is entity-backed (loyalty + layaway ownership).

  consistency_model: immediate
  # All inventory, ledger, loyalty, and cash effects are atomic within a request.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: code, type: string, source: input, description: "Short store code, unique across stores (e.g., 'NYC01')" }
      - { name: tax_rate_bps, type: integer, source: input, description: "Sales tax in basis points (e.g., 875 = 8.75%)", constraints: "0..2000" }
      - { name: loyalty_earn_rate_bps, type: integer, source: input, default: 100, description: "Loyalty points earned per currency unit of net merchandise, in bps (100 = 1 point per $1)", constraints: ">=0" }
      - { name: posture, type: enum, source: computed, description: "DRAWER_OPEN | LOCKED — derived by the store_posture calc: LOCKED while no CashDrawerSession is OPEN (blocks tender capture); DRAWER_OPEN when exactly one session is OPEN", constraints: "DRAWER_OPEN | LOCKED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  # ---------------------------------------------------------------------------
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: sku, type: string, source: input, description: "Stock-keeping unit, unique across catalog" }
      - { name: barcode, type: string, source: input, description: "Scannable barcode (UPC/EAN), unique across catalog" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog unit price in cents", constraints: ">=0" }
      - { name: tax_exempt, type: boolean, source: input, default: false, description: "If true, line is excluded from tax base" }
      - { name: loyalty_eligible, type: boolean, source: input, default: true, description: "If false, line's net does not accrue loyalty points" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED", default: "ACTIVE", constraints: "ACTIVE | DISCONTINUED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  # ---------------------------------------------------------------------------
  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store holding this stock" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the catalogued product" }
      - { name: on_hand_qty, type: integer, source: computed, description: "Physical units present (sellable + reserved). Mutated by counts, sales, returns, transfers", default: 0, constraints: ">=0" }
      - { name: reserved_qty, type: integer, source: computed, description: "Units committed to ACTIVE Layaways/Transfers but still physically present", default: 0, constraints: ">=0" }
      - { name: available_qty, type: integer, source: computed, description: "on_hand_qty - reserved_qty; the sellable count" }
      - { name: reorder_point, type: integer, source: input, description: "Available threshold at or below which the item is flagged below_reorder", default: 0, constraints: ">=0" }
      - { name: reorder_qty, type: integer, source: input, description: "Suggested replenishment quantity when below reorder point", default: 0, constraints: ">=0" }
      - { name: below_reorder, type: boolean, source: computed, description: "True when available_qty <= reorder_point" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }
    note: "Uniqueness: at most one InventoryItem per (store_id, product_id) pair."

  # ---------------------------------------------------------------------------
  - name: LoyaltyAccount
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_name, type: string, source: input, description: "Member display name" }
      - { name: phone, type: string, source: input, description: "Member phone, unique across loyalty accounts" }
      - { name: points_balance, type: integer, source: computed, description: "Redeemable loyalty points. Earned on settled sales, debited on redemption, restored on return", default: 0, constraints: ">=0" }
      - { name: lifetime_points, type: integer, source: computed, description: "Cumulative points ever earned (never decremented); drives tier", default: 0, constraints: ">=0" }
      - { name: tier, type: enum, source: computed, description: "STANDARD | SILVER | GOLD — derived from lifetime_points thresholds", default: "STANDARD", constraints: "STANDARD | SILVER | GOLD" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  # ---------------------------------------------------------------------------
  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: code, type: string, source: input, description: "Promo code entered at sale time, unique across promotions" }
      - { name: kind, type: enum, source: input, description: "PERCENT_OFF | AMOUNT_OFF | BOGO_50 — discount mechanics", constraints: "PERCENT_OFF | AMOUNT_OFF | BOGO_50" }
      - { name: value, type: integer, source: input, description: "For PERCENT_OFF: percent (0..100). For AMOUNT_OFF: cents off the eligible subtotal. For BOGO_50: ignored (fixed 50% off the cheaper of each qualifying pair)", constraints: ">=0" }
      - { name: min_subtotal_cents, type: integer, source: input, default: 0, description: "Minimum pre-discount merchandise subtotal required to apply", constraints: ">=0" }
      - { name: stackable, type: boolean, source: input, default: false, description: "If false, cannot combine with loyalty redemption on the same sale" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED", default: "ACTIVE", constraints: "ACTIVE | DISABLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  # ---------------------------------------------------------------------------
  - name: CashDrawerSession
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store this drawer belongs to" }
      - { name: opening_float_cents, type: integer, source: input, description: "Starting cash placed in the drawer", constraints: ">=0" }
      - { name: expected_cash_cents, type: integer, source: computed, description: "opening_float_cents + cash tender in - cash change out - cash refunds out, over the session", default: 0 }
      - { name: counted_cash_cents, type: integer, source: input, description: "Manager-counted cash at close; null until CLOSE_REQUESTED", default: null }
      - { name: variance_cents, type: integer, source: computed, description: "counted_cash_cents - expected_cash_cents; signed; populated at reconciliation" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSE_REQUESTED | RECONCILED | FORCE_CLOSED", default: "OPEN", constraints: "OPEN | CLOSE_REQUESTED | RECONCILED | FORCE_CLOSED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }
    note: "At most one CashDrawerSession in {OPEN, CLOSE_REQUESTED} per store at a time."

  # ---------------------------------------------------------------------------
  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; selling store" }
      - { name: cash_session_id, type: string, source: system, description: "FK -> CashDrawerSession.id; the OPEN session bound at sale creation" }
      - { name: loyalty_account_id, type: string, source: input, description: "FK -> LoyaltyAccount.id; optional member attached to the sale", default: null }
      - { name: kind, type: enum, source: input, description: "SALE | RETURN | EXCHANGE", constraints: "SALE | RETURN | EXCHANGE" }
      - { name: original_sale_id, type: string, source: input, description: "FK -> Sale.id; required for RETURN/EXCHANGE — the settled SALE being returned against", default: null }
      - { name: promo_code, type: string, source: input, description: "Optional Promotion.code applied to this sale", default: null }
      - { name: redeem_points, type: integer, source: input, description: "Loyalty points the customer asks to redeem on this sale (each point = 1 cent off)", default: 0, constraints: ">=0" }
      - { name: lines, type: array, source: input, description: "Array of {product_id, quantity, return_of_line_no?} — return_of_line_no required for RETURN/EXCHANGE return lines" }
      - { name: merchandise_subtotal_cents, type: integer, source: computed, description: "Sum of line list_price * quantity before discounts" }
      - { name: discount_cents, type: integer, source: computed, description: "Total promo discount applied" }
      - { name: loyalty_redeemed_cents, type: integer, source: computed, description: "Points redeemed * 1 cent, capped by post-discount-pre-tax subtotal" }
      - { name: tax_cents, type: integer, source: computed, description: "Tax on the taxable, post-discount, post-redemption base" }
      - { name: total_due_cents, type: integer, source: computed, description: "Net amount owed (negative for net refund on RETURN/EXCHANGE)" }
      - { name: tendered_cents, type: integer, source: computed, description: "Sum of captured TenderLine amounts (positive=collected, negative=refunded)" }
      - { name: points_earned, type: integer, source: computed, description: "Loyalty points accrued at settlement", default: 0 }
      - { name: settlement_status, type: enum, source: system, description: "DRAFT | TENDERING | SETTLED | VOIDED — payment dimension", default: "DRAFT", constraints: "DRAFT | TENDERING | SETTLED | VOIDED" }
      - { name: stock_status, type: enum, source: system, description: "PENDING | COMMITTED | RESTOCKED — inventory dimension, evolves independently of settlement_status", default: "PENDING", constraints: "PENDING | COMMITTED | RESTOCKED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  # ---------------------------------------------------------------------------
  - name: TenderLine
    parent: Sale
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id; the sale being tendered" }
      - { name: method, type: enum, source: input, description: "CASH | CARD | STORE_CREDIT | GIFT_CARD", constraints: "CASH | CARD | STORE_CREDIT | GIFT_CARD" }
      - { name: amount_cents, type: integer, source: input, description: "Amount on this tender; positive collects from customer, negative refunds to customer" }
      - { name: change_due_cents, type: integer, source: computed, description: "For CASH overpayment on a SALE: amount returned as change; 0 otherwise", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "Append order timestamp; tenders are immutable once recorded" }

  # ---------------------------------------------------------------------------
  - name: Layaway
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; holding store" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; reserved product" }
      - { name: customer_id, type: string, source: input, description: "FK -> LoyaltyAccount.id; the owning customer" }
      - { name: quantity, type: integer, source: input, description: "Units reserved", constraints: ">=1" }
      - { name: total_price_cents, type: integer, source: computed, description: "list_price_cents * quantity at creation (price locked)" }
      - { name: deposit_paid_cents, type: integer, source: computed, description: "Cumulative deposits collected", default: 0 }
      - { name: balance_cents, type: integer, source: computed, description: "total_price_cents - deposit_paid_cents" }
      - { name: due_date, type: datetime, source: input, description: "ISO 8601 date the balance must be fully paid by" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELINQUENT | FULFILLED | FORFEITED | CANCELLED", default: "ACTIVE", constraints: "ACTIVE | DELINQUENT | FULFILLED | FORFEITED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  # ---------------------------------------------------------------------------
  - name: Transfer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: from_store_id, type: string, source: input, description: "FK -> Store.id; shipping store" }
      - { name: to_store_id, type: string, source: input, description: "FK -> Store.id; receiving store" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product moved" }
      - { name: quantity, type: integer, source: input, description: "Units to move", constraints: ">=1" }
      - { name: received_qty, type: integer, source: input, description: "Units acknowledged at destination on receive; may be < quantity (shrinkage)", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED | DISPATCHED | RECEIVED | REJECTED | CANCELLED", default: "REQUESTED", constraints: "REQUESTED | DISPATCHED | RECEIVED | REJECTED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  # ---------------------------------------------------------------------------
  - name: CountSheet
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: inventory_item_id, type: string, source: input, description: "FK -> InventoryItem.id; the item being counted" }
      - { name: counted_qty, type: integer, source: input, description: "Physically counted on-hand units", constraints: ">=0" }
      - { name: snapshot_on_hand_qty, type: integer, source: system, description: "InventoryItem.on_hand_qty captured when the sheet was opened" }
      - { name: variance_qty, type: integer, source: computed, description: "counted_qty - snapshot_on_hand_qty; signed; populated at posting" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | DISCARDED", default: "DRAFT", constraints: "DRAFT | POSTED | DISCARDED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Store.posture (compound/derived; gates tender) -----------------------
  - entity: Store
    field: posture
    initial_state: LOCKED
    terminal_states: []
    note: "posture is derived from the store's open CashDrawerSession; never set directly."
    transitions:
      - from: LOCKED
        to: DRAWER_OPEN
        trigger: "system (a CashDrawerSession for this store transitions to OPEN)"
        actor: system
        preconditions: ["Exactly one CashDrawerSession for the store is OPEN"]
        side_effects: ["Tender capture on sales becomes permitted for this store"]
      - from: DRAWER_OPEN
        to: LOCKED
        trigger: "system (the store's open CashDrawerSession leaves OPEN — CLOSE_REQUESTED, RECONCILED, or FORCE_CLOSED)"
        actor: system
        preconditions: ["No CashDrawerSession for the store remains OPEN"]
        side_effects: ["New tender capture is blocked until a new session opens"]

  # ---- CashDrawerSession (linear with force-close branch) -------------------
  - entity: CashDrawerSession
    field: status
    initial_state: OPEN
    terminal_states: [RECONCILED, FORCE_CLOSED]
    transitions:
      - from: OPEN
        to: CLOSE_REQUESTED
        trigger: "POST /cash-sessions/{id}/request-close"
        actor: StoreManager
        preconditions:
          - "No Sale bound to this session is in TENDERING (every sale is DRAFT, SETTLED, or VOIDED)"
        side_effects:
          - "expected_cash_cents frozen for reconciliation"
          - "Store.posture recomputed (drops to LOCKED if this was the only OPEN session)"
          - "increments CashDrawerSession.version by 1"
      - from: CLOSE_REQUESTED
        to: RECONCILED
        trigger: "POST /cash-sessions/{id}/reconcile"
        actor: StoreManager
        preconditions:
          - "counted_cash_cents supplied in request"
        side_effects:
          - "variance_cents = counted_cash_cents - expected_cash_cents computed"
          - "increments CashDrawerSession.version by 1"
      - from: CLOSE_REQUESTED
        to: OPEN
        trigger: "POST /cash-sessions/{id}/reopen"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "counted_cash_cents and variance_cents cleared"
          - "Store.posture recomputed back to DRAWER_OPEN"
          - "increments CashDrawerSession.version by 1"
      - from: OPEN
        to: FORCE_CLOSED
        trigger: "POST /cash-sessions/{id}/force-close"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "All sales bound to this session still in DRAFT are VOIDED (settlement_status->VOIDED) and any reservations released"
          - "All sales bound to this session in TENDERING are VOIDED and captured tenders reversed (compensating refund TenderLines appended), restoring InventoryItem and LoyaltyAccount state"
          - "Store.posture recomputed to LOCKED"
          - "increments CashDrawerSession.version by 1"
        note: "Cascade: force-close -> sale VOIDED -> tender reversal -> inventory restock -> loyalty restore."

  # ---- Sale.settlement_status (payment axis; parallel dimension #1) ---------
  - entity: Sale
    field: settlement_status
    initial_state: DRAFT
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: DRAFT
        to: TENDERING
        trigger: "POST /sales/{id}/tenders (first tender)"
        actor: Cashier
        preconditions:
          - "Store.posture == DRAWER_OPEN"
          - "Sale.total_due_cents is finalized (computed at creation/recompute)"
        side_effects:
          - "First TenderLine appended; tendered_cents updated"
      - from: TENDERING
        to: TENDERING
        trigger: "POST /sales/{id}/tenders (subsequent split tender)"
        actor: Cashier
        preconditions:
          - "Sum of tenders has not yet reached total_due_cents"
        side_effects:
          - "Additional TenderLine appended; tendered_cents updated"
      - from: TENDERING
        to: SETTLED
        trigger: "system (a tender brings tendered_cents to >= total_due_cents for a SALE, or to <= total_due_cents for a net-refund RETURN/EXCHANGE)"
        actor: system
        preconditions:
          - "For SALE: tendered_cents >= total_due_cents; cash overpayment yields change_due_cents on the closing CASH tender"
          - "For RETURN/EXCHANGE net refund: tendered_cents <= total_due_cents (both negative or zero)"
        side_effects:
          - "stock_status transitions COMMITTED (SALE) or RESTOCKED (RETURN) per the stock-axis machine"
          - "points_earned credited to attached LoyaltyAccount (SALE); redeemed points debited; returns reverse both"
          - "CashDrawerSession.expected_cash_cents updated by net CASH movement"
      - from: [DRAFT, TENDERING]
        to: VOIDED
        trigger: "POST /sales/{id}/void"
        actor: Cashier
        preconditions:
          - "Sale.settlement_status != SETTLED"
        side_effects:
          - "Any captured tenders reversed via compensating TenderLines"
          - "Any inventory reservation/commit released; stock_status reverts to PENDING semantics (no net inventory change)"
          - "Any provisionally-debited loyalty redemption restored"

  # ---- Sale.stock_status (inventory axis; parallel dimension #2) ------------
  - entity: Sale
    field: stock_status
    initial_state: PENDING
    terminal_states: [COMMITTED, RESTOCKED]
    transitions:
      - from: PENDING
        to: COMMITTED
        trigger: "system (a SALE reaches settlement_status SETTLED)"
        actor: system
        preconditions:
          - "Sale.kind == SALE"
          - "For each line: InventoryItem.available_qty >= line.quantity at settlement"
        side_effects:
          - "InventoryItem.on_hand_qty decremented by line.quantity for each line; available_qty recomputed; below_reorder recomputed"
      - from: PENDING
        to: RESTOCKED
        trigger: "system (a RETURN/EXCHANGE reaches settlement_status SETTLED)"
        actor: system
        preconditions:
          - "Sale.kind in {RETURN, EXCHANGE}"
          - "Each return line maps to a line on original_sale_id not already fully returned"
        side_effects:
          - "InventoryItem.on_hand_qty incremented by returned quantity (resellable returns only); EXCHANGE outbound lines decrement on_hand_qty"

  # ---- Layaway (cyclic: ACTIVE <-> DELINQUENT payment loop) -----------------
  - entity: Layaway
    field: status
    initial_state: ACTIVE
    terminal_states: [FULFILLED, FORFEITED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /_clock/advance (system: now > due_date and balance_cents > 0)"
        actor: system
        preconditions: ["current_utc > due_date", "balance_cents > 0"]
        side_effects: ["Reservation retained; further deposits still accepted"]
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /layaways/{id}/payments (a deposit is recorded while DELINQUENT and balance remains > 0)"
        actor: Cashier
        preconditions: ["deposit amount_cents > 0", "resulting balance_cents > 0"]
        side_effects: ["deposit_paid_cents increased; balance_cents recomputed"]
      - from: [ACTIVE, DELINQUENT]
        to: FULFILLED
        trigger: "POST /layaways/{id}/payments (a deposit brings balance_cents to 0)"
        actor: Cashier
        preconditions: ["resulting balance_cents == 0"]
        side_effects:
          - "InventoryItem.reserved_qty decremented by quantity; on_hand_qty decremented by quantity (goods leave with customer); available_qty recomputed; below_reorder recomputed"
      - from: [ACTIVE, DELINQUENT]
        to: FORFEITED
        trigger: "POST /layaways/{id}/forfeit"
        actor: StoreManager
        preconditions: ["status == DELINQUENT"]
        side_effects:
          - "InventoryItem.reserved_qty decremented by quantity; on_hand_qty unchanged (goods return to sellable floor); available_qty recomputed"
          - "deposit_paid_cents retained by store (no refund)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /layaways/{id}/cancel"
        actor: StoreManager
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "InventoryItem.reserved_qty decremented by quantity; available_qty recomputed; below_reorder recomputed"
          - "deposit_paid_cents refunded to customer (recorded, not modeled as a tender)"

  # ---- Transfer (branching fork: DISPATCHED -> {RECEIVED, REJECTED}) --------
  - entity: Transfer
    field: status
    initial_state: REQUESTED
    terminal_states: [RECEIVED, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /transfers/{id}/dispatch"
        actor: InventoryClerk
        preconditions:
          - "Source InventoryItem (from_store_id, product_id) exists with available_qty >= quantity"
        side_effects:
          - "Source InventoryItem.reserved_qty incremented by quantity; available_qty recomputed; below_reorder recomputed"
      - from: DISPATCHED
        to: RECEIVED
        trigger: "POST /transfers/{id}/receive"
        actor: InventoryClerk
        preconditions:
          - "received_qty supplied, 0 <= received_qty <= quantity"
          - "Destination InventoryItem (to_store_id, product_id) exists"
        side_effects:
          - "Source InventoryItem.on_hand_qty decremented by quantity; reserved_qty decremented by quantity; available_qty recomputed; below_reorder recomputed"
          - "Destination InventoryItem.on_hand_qty incremented by received_qty; available_qty recomputed; below_reorder recomputed"
        note: "Shrinkage = quantity - received_qty is written off (never lands anywhere)."
      - from: DISPATCHED
        to: REJECTED
        trigger: "POST /transfers/{id}/reject"
        actor: InventoryClerk
        preconditions: []
        side_effects:
          - "Source InventoryItem.reserved_qty decremented by quantity; available_qty recomputed; below_reorder recomputed (units returned to source floor)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /transfers/{id}/cancel"
        actor: InventoryClerk
        preconditions: ["status == REQUESTED"]
        side_effects: ["No inventory effect (reservation never placed)"]

  # ---- CountSheet (linear with discard branch) ------------------------------
  - entity: CountSheet
    field: status
    initial_state: DRAFT
    terminal_states: [POSTED, DISCARDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /count-sheets/{id}/post"
        actor: InventoryClerk
        preconditions:
          - "InventoryItem.on_hand_qty currently equals snapshot_on_hand_qty (no stock movement since the sheet opened)"
          - "counted_qty - (snapshot_on_hand_qty - InventoryItem.reserved_qty) >= 0 is NOT required; counted_qty may be below reserved_qty only if it does not drive available_qty negative"
        side_effects:
          - "variance_qty = counted_qty - snapshot_on_hand_qty"
          - "InventoryItem.on_hand_qty set to counted_qty; available_qty recomputed; below_reorder recomputed"
      - from: DRAFT
        to: DISCARDED
        trigger: "POST /count-sheets/{id}/discard"
        actor: InventoryClerk
        preconditions: []
        side_effects: ["No inventory effect"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: tender-stale-sale
    parent_entity: Sale
    write_endpoint: "POST /sales/{id}/tenders"
    occ_field: "expected_sale_version"
    description: |
      Appending a TenderLine to a Sale whose version has advanced since the
      client last observed it is rejected. A prior tender (split payment) or a
      recompute legitimately advanced Sale.version; the current writer's view of
      total_due_cents / tendered_cents is therefore stale and the new tender
      could over-collect or settle against an outdated total.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: layaway-payment-stale
    parent_entity: Layaway
    write_endpoint: "POST /layaways/{id}/payments"
    occ_field: "expected_layaway_version"
    description: |
      Recording a deposit against a Layaway whose version has advanced since the
      client last read it is rejected. Another deposit (or a clock-driven
      ACTIVE->DELINQUENT transition) already advanced Layaway.version, so the
      client's view of balance_cents is stale and the deposit could overpay or
      misfire the FULFILLED transition.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: transfer-dispatch-stale
    parent_entity: Transfer
    write_endpoint: "POST /transfers/{id}/dispatch"
    occ_field: "expected_transfer_version"
    description: |
      Dispatching a Transfer whose version has advanced since the client last
      read it is rejected. A concurrent cancel or an edit advanced
      Transfer.version, so dispatching against the stale view could reserve
      source stock for a transfer that is no longer REQUESTED.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- (A) Sale pricing — combinatorial mode (a): >=3 inputs, nested branches
  - name: sale_total_pricing
    trigger: "Sale create, Sale lines recompute (POST /sales, PUT /sales/{id}/lines)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (combinatorial mode (c): fee/discount keyed on a tier
      # derived from the total it feeds — order must be explicit):
      #   STEP 1  merchandise_subtotal_cents = sum(product.list_price_cents * line.quantity)   # over all lines
      #   STEP 2  promo discount on the eligible subtotal:
      #            if promo absent OR promo.status != ACTIVE OR merchandise_subtotal < promo.min_subtotal_cents: discount_cents = 0
      #            elif promo.kind == PERCENT_OFF: discount_cents = floor(merchandise_subtotal * promo.value / 100)
      #            elif promo.kind == AMOUNT_OFF:  discount_cents = min(promo.value, merchandise_subtotal)
      #            elif promo.kind == BOGO_50:     # 50% off the cheaper unit of each qualifying pair, per product line
      #                                            # qualifying pairs = floor(line.quantity / 2) per line
      #                                            discount_cents = sum over lines of floor(line.quantity/2) * floor(product.list_price_cents / 2)
      #   STEP 3  post_discount_subtotal = merchandise_subtotal_cents - discount_cents
      #   STEP 4  loyalty redemption (only if redeem_points > 0):
      #            if promo present AND promo.stackable == false AND discount_cents > 0: reject ERR_PROMO_NOT_STACKABLE
      #            loyalty_redeemed_cents = min(redeem_points, post_discount_subtotal)     # 1 point = 1 cent
      #   STEP 5  taxable_base = sum over NON-tax_exempt lines of their share of (post_discount_subtotal - loyalty_redeemed_cents),
      #            allocated proportionally to each line's pre-discount extended price, summed, then ONE rounding:
      #            tax_cents = round_half_up(taxable_base * store.tax_rate_bps / 10000)     # SUM-THEN-ROUND (pinned, mode (b))
      #   STEP 6  total_due_cents = post_discount_subtotal - loyalty_redeemed_cents + tax_cents
      # For RETURN/EXCHANGE, line prices and tax are taken from the ORIGINAL settled sale (see return_value_provisional_vs_final).
    input_set: "All lines on the Sale; promo resolved by promo_code at compute time; store.tax_rate_bps."
    constants:
      POINT_VALUE_CENTS: 1
    precision: "Integer cents. Discounts floor. Tax: SUM all taxable line bases first, THEN one round_half_up. Never round per-line."
    variants:
      - name: tax_rounding_order
        when: "Multiple taxable lines"
        difference: "Pinned SUM-THEN-ROUND. Rounding per-line then summing can differ by 1 cent; the per-line order is forbidden."

  # ---- (B) Return value — DUAL VARIANT (provisional vs final) on Sale domain
  - name: return_value_provisional_vs_final
    trigger: "RETURN/EXCHANGE create (provisional) vs RETURN/EXCHANGE settlement (final)"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL (at create): refund_estimate = for each return line, the line's ORIGINAL
      #   effective unit price * returned quantity, where original effective unit price is the
      #   original line's net (post-discount, post-redemption) divided by its original quantity,
      #   FLOORED per unit, plus its proportional original tax. Computed line-by-line, summed.
      # FINAL (at settlement): refund_final = the ORIGINAL sale's net contribution for exactly the
      #   returned units, reconstructed by re-running the ORIGINAL sale_total_pricing with the
      #   reduced quantities and taking the DELTA (original_total_due - recomputed_total_due_without_returned_units).
      #   This DELTA method captures promo/loyalty interaction the per-line floor cannot.
      # The two differ whenever a promo (esp. BOGO_50 or AMOUNT_OFF) or loyalty redemption was on
      # the original sale: provisional floors each unit independently; final re-derives the basket.
    input_set: "Return lines + their original_sale lines (matched by return_of_line_no)."
    constants: {}
    precision: "Integer cents."
    variants:
      - name: provisional
        when: "RETURN/EXCHANGE creation — shown as the estimated refund (Sale.total_due_cents provisional)"
        difference: "Per-unit floored original effective price; ignores basket-level promo/loyalty redistribution."
      - name: final
        when: "RETURN/EXCHANGE settlement (tender capture closes it)"
        difference: "Basket-delta recomputation of the original sale minus returned units; reconciles promo + loyalty exactly."

  # ---- (C) Loyalty points — DUAL VARIANT domain #2 (LoyaltyAccount domain)
  - name: loyalty_points_earned
    trigger: "Sale settlement (SALE accrues; RETURN reverses)"
    algorithm: weighted_scoring
    formula: |
      # eligible_net = sum over loyalty_eligible lines of that line's share of
      #   (post_discount_subtotal - loyalty_redeemed_cents), allocated proportionally to the
      #   line's pre-discount extended price (same allocation basis as tax), floored per line, summed.
      # points_earned = floor(eligible_net_cents * store.loyalty_earn_rate_bps / 10000)
      # tier multiplier applies to the EARN side only:
      #   if account.tier == SILVER: points_earned = floor(points_earned * 1.25)
      #   if account.tier == GOLD:   points_earned = floor(points_earned * 1.50)
      # On RETURN settlement: points originally earned for returned units are clawed back
      #   (lifetime_points is NOT decremented; only points_balance), and any redeemed points are restored.
    input_set: "Settled SALE lines flagged loyalty_eligible; account.tier at settlement time."
    constants:
      SILVER_MULT_PCT: 125
      GOLD_MULT_PCT: 150
    precision: "Integer points, floor after multiplier."
    variants:
      - name: earn_at_sale
        when: "SALE settlement"
        difference: "Credits points_balance and lifetime_points; tier multiplier applied."
      - name: clawback_at_return
        when: "RETURN settlement against the original sale"
        difference: "Debits points_balance by the points originally earned for the returned units; lifetime_points untouched, so tier never downgrades."

  # ---- (D) Loyalty tier — threshold with boundary precision (LoyaltyAccount)
  - name: loyalty_tier_recompute
    trigger: "Any change to LoyaltyAccount.lifetime_points (sale settlement)"
    algorithm: threshold
    formula: |
      if lifetime_points >= 5000: tier = GOLD
      elif lifetime_points >= 1000: tier = SILVER
      else: tier = STANDARD
    input_set: "LoyaltyAccount.lifetime_points."
    constants:
      SILVER_AT: 1000
      GOLD_AT: 5000
    precision: "Boundary is inclusive: lifetime_points == 1000 -> SILVER; == 5000 -> GOLD; == 999 -> STANDARD."

  # ---- (E) Cash reconciliation — aggregation over session tenders (Cash domain)
  - name: cash_reconciliation
    trigger: "CashDrawerSession reconcile (POST /cash-sessions/{id}/reconcile)"
    algorithm: aggregation
    formula: |
      expected_cash_cents = opening_float_cents
        + sum(t.amount_cents for CASH TenderLine t with t.amount_cents > 0 on SETTLED sales bound to this session)   # cash collected
        - sum(t.change_due_cents for CASH TenderLine t on SETTLED sales bound to this session)                       # change given
        + sum(t.amount_cents for CASH TenderLine t with t.amount_cents < 0 on SETTLED sales bound to this session)   # cash refunds (negative -> reduces drawer)
      variance_cents = counted_cash_cents - expected_cash_cents
    input_set: "All CASH TenderLines on SETTLED sales whose cash_session_id == this session. Sales VOIDED before settlement contribute nothing."
    constants: {}
    precision: "Integer cents. Tie/ordering not applicable (commutative sum)."

  # ---- (F) Available quantity / reorder — derived reconciliation (Inventory)
  - name: inventory_available_and_reorder
    trigger: "Any mutation of InventoryItem.on_hand_qty or reserved_qty (sale commit, return restock, transfer, layaway, count post)"
    algorithm: aggregation
    formula: |
      available_qty = on_hand_qty - reserved_qty
      below_reorder = (available_qty <= reorder_point)
    input_set: "Single InventoryItem row."
    constants: {}
    precision: "Integer units. below_reorder uses <= (inclusive at the reorder_point)."

  # ---- (G) Store posture — derived gating field (Store domain)
  - name: store_posture
    trigger: "Any CashDrawerSession open/close transition for the store (open, request-close, reconcile, reopen, force-close)"
    algorithm: aggregation
    formula: |
      if exactly one CashDrawerSession with status == OPEN exists for the store: posture = DRAWER_OPEN
      else: posture = LOCKED
    input_set: "All CashDrawerSession rows whose store_id == this store; only status == OPEN counts toward DRAWER_OPEN."
    constants: {}
    precision: "Categorical. posture gates tender capture (see validation priority 9)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right in the path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: business_referential
    check: "All FK body references (store_id, product_id, loyalty_account_id, original_sale_id, inventory_item_id, customer_id, from_store_id, to_store_id) resolve to existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "create endpoints and tender/transfer/layaway/count endpoints"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enum values valid; quantities >= constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: business_constraint
    check: "Uniqueness: Store.code, Product.sku, Product.barcode, Promotion.code, LoyaltyAccount.phone are unique; at most one InventoryItem per (store_id, product_id)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "Store/Product/Promotion/LoyaltyAccount/InventoryItem create"

  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_<parent>_version matches the parent's current version on guarded write endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "tenders, layaway payments, transfer dispatch"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 9
    category: state
    check: "Tender capture requires the selling Store.posture == DRAWER_OPEN (an OPEN cash session exists)"
    error_id: ERR_DRAWER_NOT_OPEN
    http_status: 409
    applies_to: "POST /sales/{id}/tenders"

  - priority: 10
    category: business_referential
    check: "RETURN/EXCHANGE: original_sale_id present, that sale is SETTLED & kind==SALE, and each return_of_line_no maps to a line not already fully returned"
    error_id: ERR_INVALID_RETURN_REFERENCE
    http_status: 422
    applies_to: "POST /sales (kind RETURN/EXCHANGE)"

  - priority: 11
    category: business_constraint
    check: "Promo applicability: promo.status==ACTIVE and merchandise_subtotal_cents >= promo.min_subtotal_cents"
    error_id: ERR_PROMO_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /sales, PUT /sales/{id}/lines"

  - priority: 12
    category: business_constraint
    check: "Stacking: if promo non-stackable and a discount was applied, redeem_points must be 0"
    error_id: ERR_PROMO_NOT_STACKABLE
    http_status: 422
    applies_to: "POST /sales, PUT /sales/{id}/lines"

  - priority: 13
    category: business_constraint
    check: "Loyalty redemption cannot exceed the post-discount, pre-tax subtotal, and account must hold >= redeem_points"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "POST /sales, PUT /sales/{id}/lines"

  - priority: 14
    category: business_fiscal
    check: "Inventory availability: at SALE settlement each line's InventoryItem.available_qty >= line.quantity; transfer dispatch / layaway create require available_qty >= quantity"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "sale settlement, transfer dispatch, layaway create"

  - priority: 15
    category: business_fiscal
    check: "Tender amount on a SALE must not over-collect beyond total_due_cents except by CASH (which yields change_due_cents); CARD/STORE_CREDIT/GIFT_CARD overpayment rejected"
    error_id: ERR_OVERTENDER
    http_status: 422
    applies_to: "POST /sales/{id}/tenders"

  - priority: 16
    category: business_temporal
    check: "CountSheet post requires InventoryItem.on_hand_qty == snapshot_on_hand_qty (no movement since the sheet opened)"
    error_id: ERR_COUNT_STALE
    http_status: 409
    applies_to: "POST /count-sheets/{id}/post"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Stores ----
  - method: POST
    path: "/stores"
    description: "Create a store"
    roles: [StoreManager]
    code: 201
    input: [name, code, tax_rate_bps, "loyalty_earn_rate_bps?"]
    output: Store
    side_effects: ["posture=LOCKED"]

  - method: GET
    path: "/stores/{store_id}"
    description: "Read a store (includes derived posture)"
    roles: [StoreManager, Cashier, InventoryClerk, Customer]
    code: 200
    input: []
    output: Store
    side_effects: []

  # ---- Cash drawer sessions (flat) ----
  - method: POST
    path: "/cash-sessions"
    description: "Open a cash drawer session for a store"
    roles: [StoreManager]
    code: 201
    input: [store_id, opening_float_cents]
    output: CashDrawerSession
    side_effects: ["status=OPEN", "Store.posture -> DRAWER_OPEN"]

  - method: GET
    path: "/cash-sessions/{id}"
    description: "Read a cash drawer session"
    roles: [StoreManager, Cashier]
    code: 200
    input: []
    output: CashDrawerSession
    side_effects: []

  - method: GET
    path: "/cash-sessions"
    description: "List cash drawer sessions; filter by store_id, status"
    roles: [StoreManager, Cashier]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: CashDrawerSession[]
    side_effects: []

  - method: POST
    path: "/cash-sessions/{id}/request-close"
    description: "Freeze the session for reconciliation"
    roles: [StoreManager]
    code: 200
    input: []
    output: CashDrawerSession
    side_effects: ["status OPEN->CLOSE_REQUESTED", "expected_cash_cents frozen", "Store.posture recomputed", "increments CashDrawerSession.version by 1"]

  - method: POST
    path: "/cash-sessions/{id}/reconcile"
    description: "Submit counted cash and reconcile"
    roles: [StoreManager]
    code: 200
    input: [counted_cash_cents]
    output: CashDrawerSession
    side_effects: ["status CLOSE_REQUESTED->RECONCILED", "variance_cents computed", "increments CashDrawerSession.version by 1"]

  - method: POST
    path: "/cash-sessions/{id}/reopen"
    description: "Reopen a close-requested session"
    roles: [StoreManager]
    code: 200
    input: []
    output: CashDrawerSession
    side_effects: ["status CLOSE_REQUESTED->OPEN", "counted_cash_cents/variance_cents cleared", "Store.posture -> DRAWER_OPEN", "increments CashDrawerSession.version by 1"]

  - method: POST
    path: "/cash-sessions/{id}/force-close"
    description: "Force-close a session, voiding and reversing all unsettled bound sales"
    roles: [StoreManager]
    code: 200
    input: []
    output: CashDrawerSession
    side_effects: ["status OPEN->FORCE_CLOSED", "cascade: bound DRAFT/TENDERING sales VOIDED, tenders reversed, inventory restocked, loyalty restored", "Store.posture -> LOCKED", "increments CashDrawerSession.version by 1"]

  # ---- Products ----
  - method: POST
    path: "/products"
    description: "Create a catalog product"
    roles: [StoreManager, InventoryClerk]
    code: 201
    input: [sku, barcode, name, list_price_cents, "tax_exempt?", "loyalty_eligible?"]
    output: Product
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/products/{id}"
    description: "Read a product"
    roles: [StoreManager, Cashier, InventoryClerk, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "List/lookup products (filter by sku or barcode for scanning)"
    roles: [StoreManager, Cashier, InventoryClerk, Customer]
    code: 200
    input: ["sku?", "barcode?", "status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: POST
    path: "/products/{id}/discontinue"
    description: "Mark a product DISCONTINUED"
    roles: [StoreManager]
    code: 200
    input: []
    output: Product
    side_effects: ["status ACTIVE->DISCONTINUED"]

  # ---- Inventory items ----
  - method: POST
    path: "/inventory-items"
    description: "Create per-store stock record for a product"
    roles: [InventoryClerk, StoreManager]
    code: 201
    input: [store_id, product_id, "reorder_point?", "reorder_qty?"]
    output: InventoryItem
    side_effects: ["on_hand_qty=0", "reserved_qty=0", "available_qty/below_reorder computed"]

  - method: GET
    path: "/inventory-items/{id}"
    description: "Read an inventory item"
    roles: [StoreManager, Cashier, InventoryClerk]
    code: 200
    input: []
    output: InventoryItem
    side_effects: []

  - method: GET
    path: "/inventory-items"
    description: "List inventory items; filter by store_id, product_id, below_reorder"
    roles: [StoreManager, Cashier, InventoryClerk]
    code: 200
    input: ["store_id?", "product_id?", "below_reorder?", "limit?", "offset?"]
    output: InventoryItem[]
    side_effects: []

  # ---- Count sheets ----
  - method: POST
    path: "/count-sheets"
    description: "Open a count sheet snapshotting an inventory item's on_hand_qty"
    roles: [InventoryClerk]
    code: 201
    input: [inventory_item_id, counted_qty]
    output: CountSheet
    side_effects: ["status=DRAFT", "snapshot_on_hand_qty captured"]

  - method: GET
    path: "/count-sheets/{id}"
    description: "Read a count sheet"
    roles: [StoreManager, InventoryClerk]
    code: 200
    input: []
    output: CountSheet
    side_effects: []

  - method: GET
    path: "/count-sheets"
    description: "List count sheets; filter by inventory_item_id"
    roles: [StoreManager, InventoryClerk]
    code: 200
    input: ["inventory_item_id?", "status?", "limit?", "offset?"]
    output: CountSheet[]
    side_effects: []

  - method: POST
    path: "/count-sheets/{id}/post"
    description: "Post a count sheet, overwriting on_hand_qty to counted_qty"
    roles: [InventoryClerk]
    code: 200
    input: []
    output: CountSheet
    side_effects: ["status DRAFT->POSTED", "variance_qty computed", "InventoryItem.on_hand_qty=counted_qty", "available_qty/below_reorder recomputed"]

  - method: POST
    path: "/count-sheets/{id}/discard"
    description: "Discard a draft count sheet"
    roles: [InventoryClerk]
    code: 200
    input: []
    output: CountSheet
    side_effects: ["status DRAFT->DISCARDED"]

  # ---- Loyalty accounts ----
  - method: POST
    path: "/loyalty-accounts"
    description: "Enroll a loyalty member"
    roles: [StoreManager, Cashier]
    code: 201
    input: [customer_name, phone]
    output: LoyaltyAccount
    side_effects: ["points_balance=0", "lifetime_points=0", "tier=STANDARD"]

  - method: GET
    path: "/loyalty-accounts/{id}"
    description: "Read a loyalty account"
    roles: [StoreManager, Cashier, Customer]
    code: 200
    input: []
    output: LoyaltyAccount
    side_effects: []

  - method: POST
    path: "/_loyalty/grant"
    description: "Test-driving: credit lifetime/balance points directly to set tier or balance for tests"
    roles: [StoreManager]
    code: 200
    input: [loyalty_account_id, add_points]
    output: LoyaltyAccount
    side_effects: ["points_balance += add_points", "lifetime_points += add_points", "tier recomputed"]

  # ---- Promotions ----
  - method: POST
    path: "/promotions"
    description: "Create a promotion"
    roles: [StoreManager]
    code: 201
    input: [code, kind, value, "min_subtotal_cents?", "stackable?"]
    output: Promotion
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/promotions/{id}"
    description: "Read a promotion"
    roles: [StoreManager, Cashier]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  - method: POST
    path: "/promotions/{id}/disable"
    description: "Disable a promotion"
    roles: [StoreManager]
    code: 200
    input: []
    output: Promotion
    side_effects: ["status ACTIVE->DISABLED"]

  # ---- Sales (flat) ----
  - method: POST
    path: "/sales"
    description: "Create a sale/return/exchange in DRAFT; prices it"
    roles: [Cashier]
    code: 201
    input: [store_id, kind, lines, "loyalty_account_id?", "promo_code?", "redeem_points?", "original_sale_id?"]
    output: Sale
    side_effects: ["settlement_status=DRAFT", "stock_status=PENDING", "cash_session_id bound to current OPEN session", "pricing computed"]

  - method: GET
    path: "/sales/{id}"
    description: "Read a sale"
    roles: [StoreManager, Cashier, Customer]
    code: 200
    input: []
    output: Sale
    side_effects: []

  - method: GET
    path: "/sales"
    description: "List sales; filter by store_id, settlement_status, cash_session_id, loyalty_account_id, original_sale_id"
    roles: [StoreManager, Cashier]
    code: 200
    input: ["store_id?", "settlement_status?", "cash_session_id?", "loyalty_account_id?", "original_sale_id?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []

  - method: PUT
    path: "/sales/{id}/lines"
    description: "Replace lines on a DRAFT sale and reprice"
    roles: [Cashier]
    code: 200
    input: [lines, "promo_code?", "redeem_points?"]
    output: Sale
    side_effects: ["pricing recomputed", "increments Sale.version by 1"]

  - method: POST
    path: "/sales/{id}/tenders"
    description: "Append a tender (split payment); may settle the sale"
    roles: [Cashier]
    code: 201
    input: [method, amount_cents, expected_sale_version]
    output: TenderLine
    side_effects: ["TenderLine appended", "settlement_status DRAFT->TENDERING or TENDERING->SETTLED", "on settle: stock + loyalty + cash side-effects", "increments Sale.version by 1"]

  - method: GET
    path: "/sales/{id}/tenders"
    description: "List tender lines for a sale (FK reverse-reachability for TenderLine.sale_id)"
    roles: [StoreManager, Cashier]
    code: 200
    input: ["limit?", "offset?"]
    output: TenderLine[]
    side_effects: []

  - method: POST
    path: "/sales/{id}/void"
    description: "Void a non-settled sale, reversing tenders and reservations"
    roles: [Cashier]
    code: 200
    input: []
    output: Sale
    side_effects: ["settlement_status -> VOIDED", "tenders reversed", "reservations/commits released", "loyalty redemption restored"]

  # ---- Layaways ----
  - method: POST
    path: "/layaways"
    description: "Create a layaway, reserving stock and locking price"
    roles: [Cashier, StoreManager]
    code: 201
    input: [store_id, product_id, customer_id, quantity, due_date, "initial_deposit_cents?"]
    output: Layaway
    side_effects: ["status=ACTIVE", "InventoryItem.reserved_qty += quantity", "available_qty/below_reorder recomputed", "total_price_cents/balance_cents computed"]

  - method: GET
    path: "/layaways/{id}"
    description: "Read a layaway"
    roles: [StoreManager, Cashier, Customer]
    code: 200
    input: []
    output: Layaway
    side_effects: []

  - method: GET
    path: "/layaways"
    description: "List layaways; filter by store_id, product_id, customer_id, status"
    roles: [StoreManager, Cashier, Customer]
    code: 200
    input: ["store_id?", "product_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: Layaway[]
    side_effects: []

  - method: POST
    path: "/layaways/{id}/payments"
    description: "Record a deposit; may settle (FULFILLED) or clear delinquency"
    roles: [Cashier, StoreManager]
    code: 200
    input: [amount_cents, expected_layaway_version]
    output: Layaway
    side_effects: ["deposit_paid_cents/balance_cents recomputed", "status transitions per balance", "on FULFILLED: inventory drawn down", "increments Layaway.version by 1"]

  - method: POST
    path: "/layaways/{id}/forfeit"
    description: "Forfeit a delinquent layaway"
    roles: [StoreManager]
    code: 200
    input: []
    output: Layaway
    side_effects: ["status -> FORFEITED", "reserved_qty released to floor", "deposit retained"]

  - method: POST
    path: "/layaways/{id}/cancel"
    description: "Cancel an active layaway and refund deposit"
    roles: [StoreManager]
    code: 200
    input: []
    output: Layaway
    side_effects: ["status -> CANCELLED", "reserved_qty released", "deposit refunded"]

  # ---- Transfers ----
  - method: POST
    path: "/transfers"
    description: "Request a multi-store inventory transfer"
    roles: [InventoryClerk, StoreManager]
    code: 201
    input: [from_store_id, to_store_id, product_id, quantity]
    output: Transfer
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/transfers/{id}"
    description: "Read a transfer"
    roles: [StoreManager, InventoryClerk]
    code: 200
    input: []
    output: Transfer
    side_effects: []

  - method: GET
    path: "/transfers"
    description: "List transfers; filter by from_store_id, to_store_id, product_id, status"
    roles: [StoreManager, InventoryClerk]
    code: 200
    input: ["from_store_id?", "to_store_id?", "product_id?", "status?", "limit?", "offset?"]
    output: Transfer[]
    side_effects: []

  - method: POST
    path: "/transfers/{id}/dispatch"
    description: "Dispatch a transfer, reserving source stock"
    roles: [InventoryClerk]
    code: 200
    input: [expected_transfer_version]
    output: Transfer
    side_effects: ["status REQUESTED->DISPATCHED", "source reserved_qty += quantity", "increments Transfer.version by 1"]

  - method: POST
    path: "/transfers/{id}/receive"
    description: "Receive a dispatched transfer at destination"
    roles: [InventoryClerk]
    code: 200
    input: [received_qty]
    output: Transfer
    side_effects: ["status DISPATCHED->RECEIVED", "source on_hand/reserved decremented by quantity", "destination on_hand += received_qty", "available/below_reorder recomputed both ends"]

  - method: POST
    path: "/transfers/{id}/reject"
    description: "Reject a dispatched transfer; return reserved units to source floor"
    roles: [InventoryClerk]
    code: 200
    input: []
    output: Transfer
    side_effects: ["status DISPATCHED->REJECTED", "source reserved_qty -= quantity", "available/below_reorder recomputed"]

  - method: POST
    path: "/transfers/{id}/cancel"
    description: "Cancel a still-requested transfer"
    roles: [InventoryClerk, StoreManager]
    code: 200
    input: []
    output: Transfer
    side_effects: ["status REQUESTED->CANCELLED"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-driving: set current UTC; triggers layaway due-date sweep (ACTIVE->DELINQUENT)"
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["current_utc set", "ACTIVE layaways past due_date with balance>0 -> DELINQUENT"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a recognized role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "A foreign-key reference in the body does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/ill-typed field, invalid enum, or constraint-violating quantity" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Unique field collision (store code, sku, barcode, promo code, phone, or duplicate (store,product) inventory item)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_DRAWER_NOT_OPEN, http: 409, condition: "Tender attempted while the selling store has no OPEN cash drawer session (posture != DRAWER_OPEN)" }
  - { id: ERR_INVALID_RETURN_REFERENCE, http: 422, condition: "RETURN/EXCHANGE original_sale_id missing/not a SETTLED SALE, or a return line over-returns its original line" }
  - { id: ERR_PROMO_NOT_APPLICABLE, http: 422, condition: "Promo disabled or merchandise subtotal below promo.min_subtotal_cents" }
  - { id: ERR_PROMO_NOT_STACKABLE, http: 422, condition: "Non-stackable promo discount combined with loyalty redemption on the same sale" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "redeem_points exceeds account balance or the post-discount pre-tax subtotal" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Available quantity is below the requested quantity at sale settlement, transfer dispatch, or layaway create" }
  - { id: ERR_OVERTENDER, http: 422, condition: "Non-cash tender over-collects beyond total_due_cents on a SALE" }
  - { id: ERR_COUNT_STALE, http: 409, condition: "Count sheet post attempted after on_hand_qty moved since the sheet was opened" }
  - { id: ERR_VALIDATION, http: 400, condition: "Generic body validation failure not covered by a more specific code (e.g., pagination limit out of range)" }
  - { id: ERR_LAYAWAY_NOT_DELINQUENT, http: 409, condition: "Forfeit requested on a layaway that is not DELINQUENT" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StoreManager
    description: "Store manager: stores, promotions, cash reconciliation, layaway/transfer overrides"
    identity: "opaque"
    exclusive_operations:
      - "POST /stores — Create store"
      - "POST /cash-sessions — Open drawer"
      - "POST /cash-sessions/{id}/request-close — Freeze drawer"
      - "POST /cash-sessions/{id}/reconcile — Reconcile drawer"
      - "POST /cash-sessions/{id}/reopen — Reopen drawer"
      - "POST /cash-sessions/{id}/force-close — Force-close drawer"
      - "POST /products/{id}/discontinue — Discontinue product"
      - "POST /promotions — Create promotion"
      - "POST /promotions/{id}/disable — Disable promotion"
      - "POST /layaways/{id}/forfeit — Forfeit layaway"
      - "POST /layaways/{id}/cancel — Cancel layaway"
      - "POST /_loyalty/grant — (test) grant points"
      - "POST /_clock/advance — (test) advance clock"
    shared_operations:
      - "POST /products — with InventoryClerk"
      - "POST /inventory-items — with InventoryClerk"
      - "POST /loyalty-accounts — with Cashier"
      - "POST /layaways — with Cashier"
      - "POST /layaways/{id}/payments — with Cashier"
      - "POST /transfers — with InventoryClerk"
      - "POST /transfers/{id}/cancel — with InventoryClerk"
      - "GET reads across stores, sessions, products, inventory, sales, layaways, transfers, promotions, loyalty"

  - name: Cashier
    description: "Cashier: creates and tenders sales/returns/exchanges, enrolls loyalty, takes layaway deposits"
    identity: "opaque"
    exclusive_operations:
      - "POST /sales — Create sale/return/exchange"
      - "PUT /sales/{id}/lines — Edit draft sale lines"
      - "POST /sales/{id}/tenders — Append tender"
      - "POST /sales/{id}/void — Void sale"
    shared_operations:
      - "POST /loyalty-accounts — with StoreManager"
      - "POST /layaways — with StoreManager"
      - "POST /layaways/{id}/payments — with StoreManager"
      - "GET reads on stores, sessions, products, inventory, sales, layaways, loyalty"

  - name: InventoryClerk
    description: "Inventory clerk: catalogs products, manages stock, counts, and transfers"
    identity: "opaque"
    exclusive_operations:
      - "POST /count-sheets — Open count"
      - "POST /count-sheets/{id}/post — Post count"
      - "POST /count-sheets/{id}/discard — Discard count"
      - "POST /transfers/{id}/dispatch — Dispatch transfer"
      - "POST /transfers/{id}/receive — Receive transfer"
      - "POST /transfers/{id}/reject — Reject transfer"
    shared_operations:
      - "POST /products — with StoreManager"
      - "POST /inventory-items — with StoreManager"
      - "POST /transfers — with StoreManager"
      - "POST /transfers/{id}/cancel — with StoreManager"
      - "GET reads on stores, products, inventory, count-sheets, transfers"

  - name: Customer
    description: "Loyalty member: reads own loyalty account, layaways, and sales"
    identity: "entity_backed:LoyaltyAccount"
    exclusive_operations: []
    shared_operations:
      - "GET /loyalty-accounts/{id} — own account"
      - "GET /layaways, /layaways/{id} — own layaways"
      - "GET /sales/{id} — own sales"
      - "GET /products, /products/{id}, /stores/{store_id} — catalog/store reads"
