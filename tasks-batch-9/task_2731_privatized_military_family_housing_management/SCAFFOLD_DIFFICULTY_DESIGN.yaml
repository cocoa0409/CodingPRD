      - name: hazard_clearance_gated_on_remediation_work_order_completion
        grounds:
          - validations[priority=19]
          - state_machines.HazardCase.DISPLACEMENT_ACTIVE_to_CLEARANCE_PENDING
          - state_machines.HazardCase.CLEARANCE_PENDING_to_CLOSED
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - entities.HazardCase.fields.remediation_work_order_id
          - endpoints.POST_/hazard-cases/{id}/clearance
        distinguishing_aspect: |
          The clearance request is authorised, correctly shaped and carries
          clearance_test_passed true from an EnvironmentalSpecialist who is not
          the assessor, so the segregation-of-duties rule at priority 31 is
