      - name: coordination_accept_applies_the_negotiated_plan_to_the_requesting_sector
        claim_type: side_effect_execution
        grounds:
          - state_machines.InterferenceCoordination.REQUESTED_to_ACCEPTED
          - entities.Sector.fields.tx_power_dbm
          - entities.Sector.fields.eirp_dbm
          - endpoints.POST /interference-coordinations/{id}/responses
        distinguishing_aspect: |
          ACCEPT writes back into the REQUESTING sector only: its channel becomes 3565.0/10.0, its
          tx_power_dbm is back-solved as proposed_eirp_dbm - antenna_gain_dbi = 44.0 - 17.0 = 27.0
          (not set to 44.0), its edges recompute to 3560.0/3570.0 and eirp_dbm lands exactly on the
          negotiated 44.0, while the neighbour sector is untouched at 3620.0/10.0 and version 1.
          The responder deliberately reuses the requester's own X-User-ID to show this machine has no
          segregation-of-duties gate.
        test_recipe:
          setup:
            - "Two Towers, one shared licence 3550.0-3650.0 MHz, Sector A on tower 1 (3555.0/10.0, tx 25.0, gain 17.0) and Sector B on tower 2 (3620.0/10.0)."
            - "One REQUESTED InterferenceCoordination from A to B created by X-User-ID eng-3001 proposing 3565.0/10.0 at 44.0 dBm with a 2.0 MHz guard band."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower1_id: $.data.id }
