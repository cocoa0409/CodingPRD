            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/subcontractors", payload: { name: "DrillCo", license_no: "LIC-1", day_rate_cents: 90000, max_concurrent_rigs: 2 }, as: FirmAdmin, captures: { s_id: "$.data.id", h0: "$.data.committed_rig_hours" } }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
          trigger:
            - { call: "POST /geo/borings/${b_id}/rig-assignments", payload: { subcontractor_id: "${s_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T16:00:00Z" }, as: ProjectManager, captures: { ra_id: "$.data.id" } }
            - { call: "GET /geo/subcontractors/${s_id}", payload: {}, as: ProjectManager, captures: { h1: "$.data.committed_rig_hours" } }
            - { call: "POST /geo/rig-assignments/${ra_id}/transition", payload: { to: "CANCELLED" }, as: ProjectManager }
            - { call: "GET /geo/subcontractors/${s_id}", payload: {}, as: ProjectManager, captures: { h2: "$.data.committed_rig_hours" } }
          assert:
            - "captured h0 == 0"
            - "captured h1 == 8.0 (forward action commits the 8-hour window)"
            - "captured h2 == 0 (compensating cancel restores the conserved quantity exactly)"
      - name: authorization_approve_revoke_restores_committed_budget
        grounds:
          - state_machines.ExplorationAuthorization.PROPOSED_to_APPROVED
          - state_machines.ExplorationAuthorization.APPROVED_to_REVOKED
          - entities.Project.fields.additional_committed_cents
        distinguishing_aspect: |
          Conserved quantity: Project.additional_committed_cents (budget cents — a different
          quantity than rig-hours). Approve (0 -> 200000) paired with revoke (200000 -> 0)
          leaves the committed total unchanged.
        test_recipe:
          setup:
            - "Project in FIELDWORK (additional_auth_cap_cents=500000), authorization PROPOSED for 200000 cents"
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 1, planned_total_footage_ft: 30, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/subcontractors", payload: { name: "DrillCo", license_no: "LIC-1", day_rate_cents: 90000, max_concurrent_rigs: 2 }, as: FirmAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
            - { call: "POST /geo/borings/${b_id}/clearances", payload: { ticket_number: "T-1", issued_on: "2026-08-01T00:00:00Z", valid_days: 14 }, as: StaffEngineer, captures: { cl_id: "$.data.id" } }
            - { call: "POST /geo/borings/${b_id}/rig-assignments", payload: { subcontractor_id: "${s_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T16:00:00Z" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "SCOPED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELD_AUTHORIZED" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/transition", payload: { to: "FIELDWORK" }, as: ProjectManager }
            - { call: "POST /geo/projects/${p_id}/exploration-authorizations", payload: { authorized_amount_cents: 200000, extra_boring_count: 2 }, as: ProjectManager, captures: { au_id: "$.data.id" } }
            - { call: "GET /geo/projects/${p_id}", payload: {}, as: ProjectManager, captures: { com0: "$.data.additional_committed_cents", pv1: "$.data.version" } }
          trigger:
            - { call: "POST /geo/exploration-authorizations/${au_id}/transition", payload: { to: "APPROVED", expected_project_version: "${pv1}" }, as: ClientRep, as_user_id: "${c_id}" }
            - { call: "GET /geo/projects/${p_id}", payload: {}, as: ProjectManager, captures: { com1: "$.data.additional_committed_cents", pv2: "$.data.version" } }
            - { call: "POST /geo/exploration-authorizations/${au_id}/transition", payload: { to: "REVOKED", expected_project_version: "${pv2}" }, as: ClientRep, as_user_id: "${c_id}" }
            - { call: "GET /geo/projects/${p_id}", payload: {}, as: ProjectManager, captures: { com2: "$.data.additional_committed_cents" } }
          assert:
            - "captured com0 == 0"
            - "captured com1 == 200000 (approve commits the authorized amount)"
            - "captured com2 == 0 (revoke compensates; invariant restored)"
