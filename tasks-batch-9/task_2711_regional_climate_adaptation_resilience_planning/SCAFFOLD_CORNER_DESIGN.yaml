        distinguishing_aspect: "One commitment is reachable by pact_id, by requesting_jurisdiction_id and by asset_id, and the asset it names belongs to the host rather than the requester — the cross-aggregate reference is queryable from either end."
        test_recipe:
          setup:
            - "Two ACTIVE Jurisdictions, one shared LifelineAsset owned by Harbor, one OPEN MutualAidPact hosted by Harbor and one COMMITTED commitment requested by Ridge."
          setup_api_calls:
