        distinguishing_aspect: "Path existence (priority 4) is evaluated before any state rule: cancelling a nonexistent order id returns 404 ERR_NOT_FOUND, never a state error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /compound-orders/00000000-0000-0000-0000-000000000000/cancel", payload: {}, as: Pharmacist, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_NOT_FOUND (http 404)"
