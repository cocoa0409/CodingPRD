          A third metric — the stacked running total against the CAPPED_TOTAL pair cap — on a
          third endpoint, POST /incentives/claims. Two deliveries differing by 25 cents of MSRP
          straddle the cap: one lands on exactly 400000 and is accepted because the comparison is
          strict >, the other computes 400001 and is refused. The 25-cent MSRP gap is chosen so
          the round_half_up in the lease leg moves the total by exactly one cent.
