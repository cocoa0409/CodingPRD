              as: PlatformAdmin
              captures: { cust_a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Bob", address_line: "2 Ave", region_code: "CA", geo_lat: 34.1, geo_lng: -118.1 }
