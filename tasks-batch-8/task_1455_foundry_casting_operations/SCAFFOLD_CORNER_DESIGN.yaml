# =============================================================================
# Task 1455 — Foundry & Casting Operations — Scaffold Corner Design (§1.9)
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: pattern_create_computes_dimensions_and_defaults
        claim_type: computed_fields
        grounds: [entities.Pattern.fields.pattern_dimensions_mm, entities.Pattern.fields.qualification_attempts]
        distinguishing_aspect: "Server computes pattern_dimensions_mm at creation and initializes qualification_attempts=0, status=DRAFT; client-supplied status/attempts are not accepted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-A", alloy_shrink_class: "ALUMINUM", mold_process: "SAND", finish_dimensions_mm: [200.0], machining_allowance_mm: 3.0, impressions: 2 }, as: PatternMaker, captures: { pat: $.data } }
          assert:
            - "Pattern.pattern_dimensions_mm == [205.6] ((200.0 + min(3.0, 6.0)) * 1.0130, 1dp round_half_up)"
            - "Pattern.status == DRAFT and qualification_attempts == 0"
            - "Response carries server-minted id (UUID), created_at, updated_at, version == 1"

      - name: foundry_create_initializes_posture_embargo
        claim_type: defaults
        grounds: [entities.Foundry.fields.posture, calculations.foundry_posture]
        distinguishing_aspect: "A fresh foundry has zero IN_SERVICE sand, so posture computes EMBARGO at sand_available_kg == 0 and ops_run_index starts at 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f: $.data } }
          assert:
            - "Foundry.posture == EMBARGO and sand_available_kg == 0 and alloy_available_kg == 0"
            - "Foundry.ops_run_index == 0 and version == 1"

      - name: get_missing_pattern_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns the 404 error envelope."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/patterns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PatternMaker, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404, error envelope carries meta.api_request_id"

      - name: list_patterns_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count/has_more per the fixed envelope."
        test_recipe:
          setup: ["Three patterns exist in one foundry"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [10.0], machining_allowance_mm: 1.0, impressions: 1 }, as: PatternMaker }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-2", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [10.0], machining_allowance_mm: 1.0, impressions: 1 }, as: PatternMaker }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-3", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [10.0], machining_allowance_mm: 1.0, impressions: 1 }, as: PatternMaker }
          trigger:
            - { call: "GET /api/patterns?foundry_id=${f_id}&limit=2&offset=0", as: PatternMaker, captures: { page: $.data } }
          assert:
            - "Response meta contains limit==2, offset==0, total_count==3, has_more==true"
            - "data is an array of length 2"

      - name: pattern_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Pattern.fields.part_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input part_number yields ERR_INVALID_REQUEST (400) before any state is persisted."
        test_recipe:
          setup: ["One foundry"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [10.0], machining_allowance_mm: 1.0, impressions: 1 }, as: PatternMaker, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http 400"

      - name: pattern_create_extra_undeclared_field_rejected
        claim_type: system_fields
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Strict input schema: a client-supplied status or version field in the create payload is rejected, proving system/computed fields cannot be forged."
        test_recipe:
          setup: ["One foundry"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-X", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [10.0], machining_allowance_mm: 1.0, impressions: 1, status: "ACTIVE" }, as: PatternMaker, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (undeclared payload key 'status')"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pattern_qualify_fail_loops_back_to_draft
        claim_type: valid_transition
        grounds: [state_machines.Pattern.QUALIFICATION_to_DRAFT, calculations.qualification_evaluation]
        distinguishing_aspect: "A measured axis deviating more than 0.3mm from the computed pattern dimension fails qualification and returns the pattern to DRAFT (revision loop), incrementing qualification_attempts."
        test_recipe:
          setup: ["Pattern with computed dimensions [107.1, 56.6, 31.3]"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0, 50.0, 25.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_id: $.data.id } }
          trigger:
            - { call: "POST /api/patterns/${pat_id}/qualify", payload: { measured_dimensions_mm: [108.0, 56.6, 31.3] }, as: PatternMaker, captures: { pat: $.data } }
          assert:
            - "status == DRAFT (deviation 0.9 > 0.3 on axis 1) and qualification_attempts == 1"
      # second leg of the boundary contrast:
      - name: pattern_qualify_passes_at_exact_tolerance
        claim_type: valid_transition
        grounds: [state_machines.Pattern.QUALIFICATION_to_ACTIVE, calculations.qualification_evaluation]
        distinguishing_aspect: "Deviation exactly 0.3mm on every axis passes (<= boundary) and flips the pattern to ACTIVE."
        test_recipe:
          setup: ["Pattern with computed dimensions [107.1, 56.6, 31.3]"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0, 50.0, 25.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_id: $.data.id } }
          trigger:
            - { call: "POST /api/patterns/${pat_id}/qualify", payload: { measured_dimensions_mm: [107.4, 56.3, 31.0] }, as: PatternMaker, captures: { pat: $.data } }
          assert:
            - "status == ACTIVE (all deviations exactly 0.3, inclusive tolerance)"

      - name: pattern_revision_activation_supersedes_parent
        claim_type: side_effect_execution
        grounds: [state_machines.Pattern.ACTIVE_to_SUPERSEDED, entities.Pattern.fields.parent_pattern_id]
        distinguishing_aspect: "Self-referential revision chain: qualifying revision B (parent_pattern_id = A) automatically moves ACTIVE A to SUPERSEDED."
        test_recipe:
          setup: ["Pattern A ACTIVE; pattern B DRAFT with parent_pattern_id = A and identical dimensions"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_a: $.data.id } }
            - { call: "POST /api/patterns/${pat_a}/qualify", payload: { measured_dimensions_mm: [107.1] }, as: PatternMaker }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0], machining_allowance_mm: 8.0, impressions: 1, parent_pattern_id: "${pat_a}" }, as: PatternMaker, captures: { pat_b: $.data.id } }
          trigger:
            - { call: "POST /api/patterns/${pat_b}/qualify", payload: { measured_dimensions_mm: [107.1] }, as: PatternMaker, captures: { b_after: $.data.status } }
          assert:
            - "B: status == ACTIVE"
            - "GET /api/patterns/${pat_a}.status == SUPERSEDED (automatic side effect)"

      - name: pattern_retire_with_open_mold_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Pattern.ACTIVE_to_RETIRED, "errors[ERR_PATTERN_HAS_OPEN_MOLDS]"]
        distinguishing_aspect: "Retire is rejected while any referencing mold is ASSEMBLED/POURED/COOLED; after the mold is poured and shaken out the same retire succeeds."
        test_recipe:
          setup: ["ACTIVE pattern with one ASSEMBLED mold"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/customers", payload: { foundry_id: "${f_id}", company_name: "Acme", credit_limit_cents: 100000000 }, as: FoundryAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/sand-batches", payload: { foundry_id: "${f_id}", virgin_weight_kg: 1000, max_loi_pct: 3.0 }, as: LineOperator, captures: { sb_id: $.data.id } }
            - { call: "POST /api/sand-batches/${sb_id}/test", payload: { loi_pct: 2.5 }, as: QualityInspector }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_id: $.data.id } }
            - { call: "POST /api/patterns/${pat_id}/qualify", payload: { measured_dimensions_mm: [107.1] }, as: PatternMaker }
            - { call: "POST /api/orders", payload: { foundry_id: "${f_id}", customer_id: "${cust_id}", pattern_id: "${pat_id}", quantity: 1, unit_price_cents: 100000, machining_allowance_pct: 0.15, warranty_months: 12, warranty_budget_cents: 500000 }, as: FoundryAdmin, captures: { ord_id: $.data.id } }
            - { call: "POST /api/molds", payload: { pattern_id: "${pat_id}", sand_batch_id: "${sb_id}", order_id: "${ord_id}", sand_weight_kg: 50, metal_weight_kg: 200, cooling_hours: 2 }, as: LineOperator, captures: { mold_id: $.data.id } }
          trigger:
            - { call: "POST /api/patterns/${pat_id}/retire", payload: {}, as: PatternMaker, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PATTERN_HAS_OPEN_MOLDS and pattern stays ACTIVE"

      - name: mold_shakeout_before_cooling_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Mold.COOLED_to_SHAKEOUT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Shakeout from ASSEMBLED (never poured) is not in the transition table and returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["One ASSEMBLED mold"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/customers", payload: { foundry_id: "${f_id}", company_name: "Acme", credit_limit_cents: 100000000 }, as: FoundryAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/sand-batches", payload: { foundry_id: "${f_id}", virgin_weight_kg: 1000, max_loi_pct: 3.0 }, as: LineOperator, captures: { sb_id: $.data.id } }
            - { call: "POST /api/sand-batches/${sb_id}/test", payload: { loi_pct: 2.5 }, as: QualityInspector }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_id: $.data.id } }
            - { call: "POST /api/patterns/${pat_id}/qualify", payload: { measured_dimensions_mm: [107.1] }, as: PatternMaker }
            - { call: "POST /api/orders", payload: { foundry_id: "${f_id}", customer_id: "${cust_id}", pattern_id: "${pat_id}", quantity: 1, unit_price_cents: 100000, machining_allowance_pct: 0.15, warranty_months: 12, warranty_budget_cents: 500000 }, as: FoundryAdmin, captures: { ord_id: $.data.id } }
            - { call: "POST /api/molds", payload: { pattern_id: "${pat_id}", sand_batch_id: "${sb_id}", order_id: "${ord_id}", sand_weight_kg: 50, metal_weight_kg: 200, cooling_hours: 2 }, as: LineOperator, captures: { mold_id: $.data.id } }
          trigger:
            - { call: "POST /api/molds/${mold_id}/shakeout", payload: {}, as: LineOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; mold remains ASSEMBLED; batch weights unchanged (committed 50.0)"

      - name: terminal_poured_out_heat_rejects_tap
        claim_type: terminal_lockdown
        grounds: [state_machines.MeltHeat.TAPPED_to_POURED_OUT, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Once run-ops moves a TAPPED heat with no BOOKED slots to POURED_OUT, a further tap attempt hits the terminal lockdown."
        test_recipe:
          setup: ["Heat TAPPED with its only slot COMPLETED; run-ops executed"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/customers", payload: { foundry_id: "${f_id}", company_name: "Acme", credit_limit_cents: 100000000 }, as: FoundryAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "MOLDING_LINE", label: "Line-A", daily_minute_capacity: 480, cleanup_buffer_minutes: 30 }, as: FoundryAdmin, captures: { line_id: $.data.id } }
            - { call: "POST /api/sand-batches", payload: { foundry_id: "${f_id}", virgin_weight_kg: 1000, max_loi_pct: 3.0 }, as: LineOperator, captures: { sb_id: $.data.id } }
            - { call: "POST /api/sand-batches/${sb_id}/test", payload: { loi_pct: 2.5 }, as: QualityInspector }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_id: $.data.id } }
            - { call: "POST /api/patterns/${pat_id}/qualify", payload: { measured_dimensions_mm: [107.1] }, as: PatternMaker }
            - { call: "POST /api/orders", payload: { foundry_id: "${f_id}", customer_id: "${cust_id}", pattern_id: "${pat_id}", quantity: 1, unit_price_cents: 100000, machining_allowance_pct: 0.15, warranty_months: 12, warranty_budget_cents: 500000 }, as: FoundryAdmin, captures: { ord_id: $.data.id } }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 } } } }, as: MeltSupervisor, captures: { heat_id: $.data.id, heat_v: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v}", additions: [ { source: "VIRGIN", weight_kg: 1000, composition: { C: 3.40 } } ] }, as: MeltSupervisor, captures: { heat_v2: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v2}", reading: { C: 3.40 } }, as: Spectrographer, as_user_id: "spectro_1" }
            - { call: "POST /api/heats/${heat_id}/tap", payload: { tap_weight_kg: 500 }, as: MeltSupervisor }
            - { call: "POST /api/molds", payload: { pattern_id: "${pat_id}", sand_batch_id: "${sb_id}", order_id: "${ord_id}", sand_weight_kg: 50, metal_weight_kg: 200, cooling_hours: 2 }, as: LineOperator, captures: { mold_id: $.data.id } }
            - { call: "POST /api/pour-slots", payload: { molding_line_id: "${line_id}", heat_id: "${heat_id}", mold_ids: ["${mold_id}"], start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: LineOperator, captures: { slot_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:30:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/pour-slots/${slot_id}/complete", payload: {}, as: LineOperator }
            - { call: "GET /api/foundries/${f_id}", as: FoundryAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/foundries/${f_id}/run-ops", payload: { expected_foundry_version: "${f_v}" }, as: FoundryAdmin, captures: { f_after: $.data } }
          trigger:
            - { call: "POST /api/heats/${heat_id}/tap", payload: { tap_weight_kg: 100 }, as: MeltSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "run-ops moved the heat to POURED_OUT (no BOOKED slots remain)"
            - "Second tap: error_id == ERR_ALREADY_TERMINAL (409)"

      - name: run_ops_expires_stale_booked_slot
        claim_type: side_effect_execution
        grounds: [state_machines.PourSlot.BOOKED_to_EXPIRED, endpoints]
        distinguishing_aspect: "Ops-run checkpoint: a BOOKED slot whose end_at is in the past transitions to EXPIRED and its mold's pour_slot_id is cleared (mold stays ASSEMBLED)."
        test_recipe:
          setup: ["Heat CERTIFIED; mold ASSEMBLED on BOOKED slot 10:00-11:00; clock advanced to 12:00"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/customers", payload: { foundry_id: "${f_id}", company_name: "Acme", credit_limit_cents: 100000000 }, as: FoundryAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "MOLDING_LINE", label: "Line-A", daily_minute_capacity: 480, cleanup_buffer_minutes: 30 }, as: FoundryAdmin, captures: { line_id: $.data.id } }
            - { call: "POST /api/sand-batches", payload: { foundry_id: "${f_id}", virgin_weight_kg: 1000, max_loi_pct: 3.0 }, as: LineOperator, captures: { sb_id: $.data.id } }
            - { call: "POST /api/sand-batches/${sb_id}/test", payload: { loi_pct: 2.5 }, as: QualityInspector }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_id: $.data.id } }
            - { call: "POST /api/patterns/${pat_id}/qualify", payload: { measured_dimensions_mm: [107.1] }, as: PatternMaker }
            - { call: "POST /api/orders", payload: { foundry_id: "${f_id}", customer_id: "${cust_id}", pattern_id: "${pat_id}", quantity: 1, unit_price_cents: 100000, machining_allowance_pct: 0.15, warranty_months: 12, warranty_budget_cents: 500000 }, as: FoundryAdmin, captures: { ord_id: $.data.id } }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 } } } }, as: MeltSupervisor, captures: { heat_id: $.data.id, heat_v: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v}", additions: [ { source: "VIRGIN", weight_kg: 1000, composition: { C: 3.40 } } ] }, as: MeltSupervisor, captures: { heat_v2: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v2}", reading: { C: 3.40 } }, as: Spectrographer, as_user_id: "spectro_1" }
            - { call: "POST /api/molds", payload: { pattern_id: "${pat_id}", sand_batch_id: "${sb_id}", order_id: "${ord_id}", sand_weight_kg: 50, metal_weight_kg: 200, cooling_hours: 2 }, as: LineOperator, captures: { mold_id: $.data.id } }
            - { call: "POST /api/pour-slots", payload: { molding_line_id: "${line_id}", heat_id: "${heat_id}", mold_ids: ["${mold_id}"], start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: LineOperator, captures: { slot_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: FoundryAdmin }
          trigger:
            - { call: "GET /api/foundries/${f_id}", as: FoundryAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/foundries/${f_id}/run-ops", payload: { expected_foundry_version: "${f_v}" }, as: FoundryAdmin }
          assert:
            - "GET /api/pour-slots/${slot_id}.status == EXPIRED"
