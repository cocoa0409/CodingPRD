      - name: assigned_training_expires_lazily_once_the_due_date_passes
        claim_type: side_effect_execution
        grounds:
          - state_machines.TrainingAssignment.ASSIGNED_to_EXPIRED
          - calculations.contact_eligibility_derivation
        distinguishing_aspect: |
          An assignment that is never started expires by clock alone: at due_at the row is
          EXPIRED with started_at and completed_at still null, and because an EXPIRED
          assignment contributes no training expiry the member's training_status stays NEVER
          rather than becoming LAPSED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with course SS101 published and member m_ex"
            - "assignment ta_ex is ASSIGNED with due_at 2026-09-01T00:00:00Z and was never started"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
