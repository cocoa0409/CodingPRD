# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# task_2646_outfitter_guide_special_use_permit_administration
#
# §1.8 Test Targeting Index. Every instance grounds in SCAFFOLD.yaml §1.1-§1.7;
# deleting this file leaves the declared behavior unchanged.
#
# Shared numeric fixture (all figures below were computed by executing the
# §1.3 formulas as code, not estimated):
#
#   UseArea BRW-01: total_allocated 1000, reserved_admin 100 -> allocatable 900,
#     season 2027-05-15 .. 2027-09-30, party_size_max 12, max_clients_per_guide 8,
#     min_liability_coverage_cents 100000000.
#   Guide "Rita Long" LEAD / WFR / 7 seasons -> base_client_capacity 10,
#     frozen authorized_client_capacity min(8, 10) = 8.
#   Guide "Ben Cruz" ASSISTANT / BASIC_FIRST_AID / 2 seasons -> base 4, frozen 4.
#   Permit with authorized_service_days 200 -> required_financial_assurance
#     clamp(200 * 5000, 250000, 5000000) = 1000000 cents.
#   Season 2027 reports on the GRADUATED schedule:
#     R1 2027-05-15 -> 2027-06-15  gross 1800050  ded 200000  AGR 1600050
#     R2 2027-06-15 -> 2027-07-15  gross 1500000  ded 100000  AGR 1400000
#     R3 2027-07-15 -> 2027-08-15  gross  900000  ded      0  AGR  900000
#     PROVISIONAL_PER_REPORT components 48002 / 42000 / 36000 -> 126002
#     FINAL_AGGREGATE on total AGR 3900050 -> 75000 + 56002    -> 131002
#     switch delta                                             ->   5000
#   Default logical clock before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: fee_assessment_provisional_per_report_versus_final_aggregate
        grounds:
          - calculations.permit_fee_assessment
          - entities.FeeAssessment.fields.variant_applied
          - entities.FeeAssessment.fields.assessed_fee_cents
          - entities.TripUseReport.fields.applied_rate_bp
          - entities.TripUseReport.fields.fee_component_cents
          - state_machines.FeeAssessment.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          The two variants of permit_fee_assessment are selected along the LIFECYCLE-EVENT dimension
          (report acceptance versus season finalization) and diverge on money: the same three accepted
          reports yield assessed_fee_cents 126002 under PROVISIONAL_PER_REPORT and 131002 under
          FINAL_AGGREGATE, a delta of exactly 5000 cents, because A charges each report entirely at the
          bracket its pre-report cumulative sits in and rounds N times while B splits the season total
          across graduated brackets and rounds once.
        test_recipe:
          setup:
            - "logical clock at 2027-09-01T00:00:00Z"
            - "UseArea BRW-01 with a PUBLISHED NEED_EXISTS needs assessment for 2027"
            - "Outfitter Alpine holding one ISSUED permit on the GRADUATED fee schedule with authorized_service_days 200"
            - "one QUALIFIED LEAD/WFR guide authorized to the permit, so authorized_client_capacity_total is 8"
            - "three ACCEPTED TripUseReports for season 2027 with adjusted gross revenues 1600050, 1400000 and 900000"
            - "the season FeeAssessment exists in PROVISIONAL with variant_applied PROVISIONAL_PER_REPORT and no payments"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Alpine 2027 float operation" }
              as: PermitSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${app_id}/issue-permit"
              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31", fee_schedule_code: "GRADUATED", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { p_id: "$.data.id" }
            - call: "POST /osup/outfitters/${oa_id}/guides"
              payload: { full_name: "Rita Long", qualification_level: "LEAD", first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30", seasons_experience: 7 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { g1_id: "$.data.id" }
            - call: "POST /osup/guides/${g1_id}/qualify"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permits/${p_id}/guide-authorizations"
              payload: { guide_id: "${g1_id}" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/permits/${p_id}/trip-use-reports"
              payload: { period_start_date: "2027-05-15", period_end_date: "2027-06-15", service_days_used: 60, client_count: 8, gross_revenue_cents: 1800050, allowable_deductions_cents: 200000 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /osup/permits/${p_id}/trip-use-reports"
              payload: { period_start_date: "2027-06-15", period_end_date: "2027-07-15", service_days_used: 60, client_count: 8, gross_revenue_cents: 1500000, allowable_deductions_cents: 100000 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { r2_id: "$.data.id" }
            - call: "POST /osup/permits/${p_id}/trip-use-reports"
              payload: { period_start_date: "2027-07-15", period_end_date: "2027-08-15", service_days_used: 40, client_count: 8, gross_revenue_cents: 900000, allowable_deductions_cents: 0 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { r3_id: "$.data.id" }
            - call: "POST /osup/trip-use-reports/${r1_id}/accept"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/trip-use-reports/${r2_id}/accept"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/trip-use-reports/${r3_id}/accept"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/permits/${p_id}/fee-assessments"
              payload: { season_year: 2027 }
              as: PermitSpecialist
              captures: { fa_id: "$.data[0].id", prov_assessed: "$.data[0].assessed_fee_cents" }
          trigger:
            - call: "POST /osup/fee-assessments/${fa_id}/finalize"
              payload: {}
              as: PermitSpecialist
              captures: { final_assessed: "$.data.assessed_fee_cents" }
          assert:
            - "before the trigger, FeeAssessment.${fa_id}.variant_applied == PROVISIONAL_PER_REPORT and ${prov_assessed} == 126002"
            - "TripUseReport.${r1_id}.applied_rate_bp == 300 and TripUseReport.${r1_id}.fee_component_cents == 48002"
            - "TripUseReport.${r2_id}.applied_rate_bp == 300 and TripUseReport.${r2_id}.fee_component_cents == 42000"
            - "TripUseReport.${r3_id}.applied_rate_bp == 400 and TripUseReport.${r3_id}.fee_component_cents == 36000"
            - "after the trigger, FeeAssessment.${fa_id}.status == FINAL and FeeAssessment.${fa_id}.variant_applied == FINAL_AGGREGATE"
            - "FeeAssessment.${fa_id}.reported_agr_cents == 3900050"
            - "${final_assessed} == 131002"
            - "${final_assessed} - ${prov_assessed} == 5000"
            - "FeeAssessment.${fa_id}.balance_due_cents == 5000, paid_to_date_cents == 0, credit_balance_cents == 0"
            - "FeeAssessment.${fa_id}.minimum_fee_applied == false"

      - name: prospectus_scoring_preliminary_versus_final_rank_flip
        grounds:
          - calculations.prospectus_evaluation_score
          - calculations.prospectus_award_selector
          - entities.PermitApplication.fields.preliminary_evaluation_score
          - entities.PermitApplication.fields.final_evaluation_score
          - entities.Outfitter.fields.prequalification_insurance_verified
          - state_machines.Prospectus.EVALUATING_to_AWARDED
        distinguishing_aspect: |
          The two variants of prospectus_evaluation_score are selected along the REVIEW-STAGE dimension
          on a non-monetary entity domain (competitive scoring, not money), and they reverse the
          ranking: PRELIMINARY scores Delta 77.50 above Cedar 70.00, FINAL scores Cedar 50.00 above
          Delta 47.50, so the award goes to the applicant that lost the preliminary ranking.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "UseArea BRW-02 with allocatable 200 service days, a PUBLISHED 2027 needs assessment determining capacity for 200 days (the area's whole allocatable pool, which is the ceiling the entity constraint allows), and a PUBLISHED 2026 assessment so the prior-season application can be screened"
            - "both 2027 applications request 300 days against an area that has only 150 left after the 2026 permit, so each one routes PROSPECTUS on the NEW-application branch of prospectus_requirement_determination and the area is EXHAUSTED at award time — which the award deliberately does not gate on"
            - "Outfitter Delta: one prior permit on the area (prior_permit_count 1), prequalification_insurance_verified true, two guides both left in PENDING_QUALIFICATION"
            - "Outfitter Cedar: no prior permit (prior_permit_count 0), prequalification_insurance_verified false, one QUALIFIED guide"
            - "a Prospectus offering 300 service days with min_qualifying_score 40.0, EVALUATING, carrying both applications as PROSPECTUS_RESPONDED responses each requesting exactly 300 days"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-02", name: "Cedar Basin", total_allocated_service_days: 200, season_year: 2027, season_open_date: "2027-06-01", season_close_date: "2027-09-15", party_size_max: 10, max_clients_per_guide: 6, reserved_admin_service_days: 0, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua2_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua2_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 200, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na2_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na2_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/use-areas/${ua2_id}/needs-assessments"
              payload: { assessment_year: 2026, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 200, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na2p_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na2p_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Delta River Guides", ein: "420000004", contact_email: "ops@delta.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { od_id: "$.data.id" }
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Cedar Creek Outfitters", ein: "420000003", contact_email: "ops@cedar.example", prequalification_insurance_verified: false }
              as: PermitSpecialist
              captures: { oc_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${od_id}", use_area_id: "${ua2_id}", application_type: "NEW", season_year: 2026, requested_service_days: 50, proposed_activity_type: "FISHING", narrative: "Delta prior season" }
              as: PermitSpecialist
              captures: { appd0_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${appd0_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${od_id}"
            - call: "POST /osup/permit-applications/${appd0_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${appd0_id}/issue-permit"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { pd0_id: "$.data.id" }
            - call: "POST /osup/outfitters/${od_id}/guides"
              payload: { full_name: "Dana Frost", qualification_level: "LEAD", first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30", seasons_experience: 6 }
              as: OutfitterRepresentative
              as_user_id: "${od_id}"
              captures: { gd1_id: "$.data.id" }
            - call: "POST /osup/outfitters/${od_id}/guides"
              payload: { full_name: "Dev Ortiz", qualification_level: "ASSISTANT", first_aid_cert_type: "WFR", first_aid_expires_on: "2030-06-30", seasons_experience: 3 }
              as: OutfitterRepresentative
              as_user_id: "${od_id}"
              captures: { gd2_id: "$.data.id" }
            - call: "POST /osup/outfitters/${oc_id}/guides"
              payload: { full_name: "Cara Bell", qualification_level: "LEAD", first_aid_cert_type: "WEMT", first_aid_expires_on: "2030-06-30", seasons_experience: 9 }
              as: OutfitterRepresentative
              as_user_id: "${oc_id}"
              captures: { gc1_id: "$.data.id" }
            - call: "POST /osup/guides/${gc1_id}/qualify"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oc_id}", use_area_id: "${ua2_id}", application_type: "NEW", season_year: 2027, requested_service_days: 300, proposed_activity_type: "FISHING", narrative: "Cedar 2027 bid" }
              as: PermitSpecialist
              captures: { appc_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${appc_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oc_id}"
            - call: "POST /osup/permit-applications/${appc_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${od_id}", use_area_id: "${ua2_id}", application_type: "NEW", season_year: 2027, requested_service_days: 300, proposed_activity_type: "FISHING", narrative: "Delta 2027 bid" }
              as: PermitSpecialist
              captures: { appd_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${appd_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${od_id}"
            - call: "POST /osup/permit-applications/${appd_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/prospectuses"
              payload: { use_area_id: "${ua2_id}", needs_assessment_id: "${na2_id}", offered_service_days: 300, submission_deadline_date: "2027-03-31", min_qualifying_score: 40.0 }
              as: PermitSpecialist
              captures: { pr_id: "$.data.id" }
            - call: "POST /osup/prospectuses/${pr_id}/responses"
              payload: { application_id: "${appc_id}" }
              as: OutfitterRepresentative
              as_user_id: "${oc_id}"
            - call: "POST /osup/prospectuses/${pr_id}/responses"
              payload: { application_id: "${appd_id}" }
              as: OutfitterRepresentative
              as_user_id: "${od_id}"
            - call: "POST /osup/prospectuses/${pr_id}/close-submissions"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/use-areas/${ua2_id}"
              payload: {}
              as: AuthorizedOfficer
              captures: { ua2_v: "$.data.version" }
          trigger:
            - call: "POST /osup/prospectuses/${pr_id}/award"
              payload: { expected_use_area_version: "${ua2_v}" }
              as: AuthorizedOfficer
              captures: { awarded_app: "$.data.awarded_application_id" }
          assert:
            - "after close-submissions, PermitApplication.${appc_id}.preliminary_evaluation_score == 70.00 and PermitApplication.${appd_id}.preliminary_evaluation_score == 77.50"
            - "after the trigger, PermitApplication.${appc_id}.final_evaluation_score == 50.00 and PermitApplication.${appd_id}.final_evaluation_score == 47.50"
            - "the PRELIMINARY ranking puts ${appd_id} first, the FINAL ranking puts ${appc_id} first — the two variants order the same pool differently"
            - "${awarded_app} == ${appc_id} and Prospectus.${pr_id}.status == AWARDED"
            - "PermitApplication.${appc_id}.status == AWARDED"
            - "PermitApplication.${appd_id}.status == DENIED and PermitApplication.${appd_id}.denial_reason_code == NOT_SELECTED"
            - "both final scores are at or above Prospectus.${pr_id}.min_qualifying_score of 40.0, so the flip is a ranking outcome and not an eligibility filter"

  - rule_id: combinatorial_formula
    instances:

      - name: guide_client_capacity_four_input_min_interaction
        grounds:
          - calculations.guide_client_capacity
          - entities.Guide.fields.base_client_capacity
          - entities.GuideAreaAuthorization.fields.authorized_client_capacity
          - entities.Permit.fields.authorized_client_capacity_total
          - entities.UseArea.fields.max_clients_per_guide
        distinguishing_aspect: |
          MODE (a) INTERACTING INPUTS. Four independent inputs — qualification_level,
          first_aid_cert_type, seasons_experience and the area's max_clients_per_guide — combine
          non-additively: the two tiers are joined by min(), the experience bonus is added AFTER
          that min and capped at 2, the area ceiling is a second min() applied last, and two
          categorical values short-circuit the whole expression to 0. No single input predicts the
          result: LEAD/WFR/7 gives 10 while LEAD/BASIC_FIRST_AID/9 gives 6 even though the second
          guide has the higher level and more seasons, and TRAINEE/WEMT/12 gives 0 despite holding
          the top certification and the maximum experience bonus.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "UseArea BRW-01 with max_clients_per_guide 8 and a PUBLISHED 2027 needs assessment"
            - "Outfitter Alpine holding one ISSUED permit on BRW-01 with authorized_service_days 200"
            - "five guides covering the input grid: LEAD/WFR/7, ASSISTANT/BASIC_FIRST_AID/2, LEAD/BASIC_FIRST_AID/9, TRAINEE/WEMT/12 and ASSISTANT/NONE/12"
            - "the three eligible guides are QUALIFIED; the TRAINEE and the uncertified guide are left in PENDING_QUALIFICATION"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
