            - { call: "POST /mutual-aid/assistance-requests/${req_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${req_id}", crew_type: "LINE", home_base: "Depot 7", roster: [{ member_ref: "M1", member_role: "foreman" }], equipment_units: [] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { crew_id: "$.data.id" } }
            - { call: "POST /mutual-aid/lodging-blocks", payload: { event_id: "${ev_id}", hotel_name: "Storm Inn", block_code: "BLK-1", total_rooms: 2, nightly_rate_cents: 15000 }, as: HostCoordinator, as_user_id: "${host_id}", captures: { blk_id: "$.data.id" } }
            - { call: "POST /mutual-aid/lodging-assignments", payload: { block_id: "${blk_id}", crew_id: "${crew_id}", room_count: 1, check_in_date: "2026-05-03", check_out_date: "2026-05-08" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { asg_id: "$.data.id" } }
            - { call: "POST /mutual-aid/crews/${crew_id}/confirm_arrival", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
          trigger:
            - { call: "POST /mutual-aid/crews/${crew_id}/release", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
