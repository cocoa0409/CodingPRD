      - name: blood_drive_site_window_aggregate_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_BLOOD_DRIVE_WINDOW_OVERLAP]
          - entities.BloodDrive.fields.scheduled_start_at
          - entities.BloodDrive.fields.scheduled_end_at
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the blood drive resource: overlap is evaluated
          per collection site across the whole drive window rather than per unit or per volunteer,
          so a second drive at the same site may not intersect while an adjacent or different-site
          drive is accepted.
        test_recipe:
          setup:
            - "region GL with one scheduled blood drive D1 at VFW Hall, window 2026-09-10T08:00Z to 2026-09-10T18:00Z, target_units 120"
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/blood-drives"
              payload: { region_id: "${reg_gl}", site_name: "VFW Hall", scheduled_start_at: "2026-09-10T08:00:00Z", scheduled_end_at: "2026-09-10T18:00:00Z", target_units: 120 }
              as: BloodServicesCoordinator
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /api/v1/blood-drives"
              payload: { region_id: "${reg_gl}", site_name: "VFW Hall", scheduled_start_at: "2026-09-10T17:00:00Z", scheduled_end_at: "2026-09-10T21:00:00Z", target_units: 60 }
              as: BloodServicesCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /api/v1/blood-drives"
              payload: { region_id: "${reg_gl}", site_name: "VFW Hall", scheduled_start_at: "2026-09-10T18:00:00Z", scheduled_end_at: "2026-09-10T21:00:00Z", target_units: 60 }
              as: BloodServicesCoordinator
              captures: { d3_status: $.data.status }
            - call: "POST /api/v1/blood-drives"
              payload: { region_id: "${reg_gl}", site_name: "Elks Lodge", scheduled_start_at: "2026-09-10T17:00:00Z", scheduled_end_at: "2026-09-10T21:00:00Z", target_units: 60 }
              as: BloodServicesCoordinator
              captures: { d4_status: $.data.status }
          assert:
            - "a second drive at VFW Hall starting 17:00Z intersects D1 08:00Z-18:00Z and returns 409 with error_id ERR_BLOOD_DRIVE_WINDOW_OVERLAP"
            - "a drive at VFW Hall starting exactly at 18:00Z is accepted with status PLANNED"
            - "a drive at Elks Lodge over the same 17:00Z-21:00Z window is accepted with status PLANNED, because overlap is scoped to the site"

  - rule_id: compensating_invariant
    instances:
      - name: fund_pool_remaining_cents_conserved
        grounds:
          - calculations.restricted_fund_balance
          - state_machines.AssistanceRequest.DISBURSED_to_REVERSED
          - entities.FundPool.fields.remaining_cents
        distinguishing_aspect: |
          Conserved quantity = donor money: approving and redeeming an award then reversing it must
          leave FundPool.remaining_cents exactly equal to the value captured before the award, with
          no drift in the named field.
        test_recipe:
          setup:
            - "region GL, operation DR-9101, client registered at an open shelter, ClientCase eligibility VERIFIED"
            - "DONOR_RESTRICTED_DISASTER fund pool with 300000 cents and a pre-award remaining_cents captured as 300000"
            - "one assistance request for 75000 cents, SUBMITTED"
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "FLOOD", declared_at: "2026-09-02T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op_id: $.data.id }
            - call: "POST /api/v1/shelter-sites"
              payload: { facility_name: "Lincoln High", address_line: "1 Main St", region_id: "${reg_gl}", capacity_beds: 8, accessibility_rating: "FULL", functional_needs_support: true, generator_onsite: true, agreement_expires_at: "2027-09-01T00:00:00Z" }
              as: RegionalCoordinator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /api/v1/shelter-sites/${site_id}/inspections"
              payload: { expected_shelter_site_version: "${site_v}", inspected_at: "2026-09-02T12:00:00Z", inspector_user_id: "rc_gl", capacity_verified_beds: 8, accessibility_verified: true, functional_needs_verified: true, deficiency_count: 0, result: "PASS" }
              as: RegionalCoordinator
            - call: "POST /api/v1/volunteers"
              payload: { full_name: "Dana Ruiz", home_region_id: "${reg_gl}", qualified_role_codes: ["SHELTER_MANAGER"] }
              as: RegionalCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /api/v1/volunteers/${vol_id}/credential-refresh"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/shelter-operations"
              payload: { shelter_site_id: "${site_id}", disaster_relief_operation_id: "${op_id}" }
              as: RegionalCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments"
              payload: { volunteer_id: "${vol_id}", disaster_relief_operation_id: "${op_id}", shelter_operation_id: "${so_id}", role_code: "SHELTER_MANAGER", travel_mode: "AIR", rotation_start_at: "2026-09-03T00:00:00Z", rotation_days: 14 }
              as: RegionalCoordinator
              captures: { dep_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments/${dep_id}/approve"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NationalHQAdmin
            - call: "POST /api/v1/shelter-operations/${so_id}/open"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/clients"
              payload: { full_name: "Ana Lopez", household_size: 5, region_id: "${reg_gl}" }
              as: ShelterManager
              captures: { cl_id: $.data.id }
            - call: "POST /api/v1/shelter-operations/${so_id}/registrations"
              payload: { client_id: "${cl_id}", occupied_from_at: "2026-09-03T20:00:00Z", functional_needs_flag: false }
              as: ShelterManager
            - call: "POST /api/v1/fund-pools"
              payload: { fund_code: "DR-9101-RESTRICTED", restriction_type: "DONOR_RESTRICTED_DISASTER", region_id: "${reg_gl}", total_received_cents: 300000 }
              as: FinanceOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /api/v1/client-cases"
              payload: { client_id: "${cl_id}", disaster_relief_operation_id: "${op_id}", assigned_caseworker_id: "cw_1" }
              as: Caseworker
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/client-cases/${case_id}/verify-eligibility"
              payload: { eligibility_status: "VERIFIED" }
              as: Caseworker
            - call: "POST /api/v1/client-cases/${case_id}/assistance-requests"
              payload: { fund_pool_id: "${pool_id}", assistance_type: "HOUSING", requested_amount_cents: 75000 }
              as: Caseworker
              captures: { ar_id: $.data.id }
            - call: "GET /api/v1/fund-pools/${pool_id}"
              payload: {}
              as: FinanceOfficer
              captures: { remaining_pre: $.data.remaining_cents }
          trigger:
            - call: "POST /api/v1/assistance-requests/${ar_id}/approve"
              payload: {}
              as: FinanceOfficer
            - call: "POST /api/v1/assistance-requests/${ar_id}/approve"
              payload: {}
              as: FinanceOfficer
            - call: "POST /api/v1/assistance-requests/${ar_id}/issue-card"
              payload: {}
              as: FinanceOfficer
            - call: "POST /api/v1/assistance-requests/${ar_id}/redeem-card"
              payload: {}
              as: FinanceOfficer
              captures: { remaining_disbursed: $.data.approved_amount_cents }
            - call: "POST /api/v1/assistance-requests/${ar_id}/reverse"
              payload: {}
              as: FinanceOfficer
              captures: { ar_status: $.data.status }
            - call: "GET /api/v1/fund-pools/${pool_id}"
              payload: {}
              as: FinanceOfficer
              captures: { remaining_post: $.data.remaining_cents, committed_post: $.data.committed_cents, disbursed_post: $.data.disbursed_cents }
          assert:
            - "FundPool.${pool_id}.remaining_cents == 300000 before the award"
            - "FundPool.${pool_id}.remaining_cents == 225000 while the award is disbursed"
            - "AssistanceRequest.${ar_id}.status == REVERSED"
            - "FundPool.${pool_id}.remaining_cents == 300000 after the reversal, exactly equal to the pre-award value"
            - "FundPool.${pool_id}.committed_cents == 0 and disbursed_cents == 0 after the reversal"

