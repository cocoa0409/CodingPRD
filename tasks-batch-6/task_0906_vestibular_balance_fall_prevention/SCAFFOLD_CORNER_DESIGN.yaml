              as: IntakeCoordinator
              captures: { cp_v2: $.data.version }
          trigger:
            - call: "POST /community-linkages"
              payload: { patient_id: "${pid}", care_plan_id: "${cpid}", assessment_id: "${aid}", program_name: "OTAGO", expected_care_plan_version: "${cp_v2}" }
