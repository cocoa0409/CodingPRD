    input: ["status?", "limit?", "offset?"]
    output: "Supplier[]"
    side_effects: []

  # --- Part ---
  - method: POST
    path: "/plm/parts"
    description: "Create a Part (MAKE/BUY/PHANTOM). BUY requires default_supplier_id."
    roles: [Designer]
    code: 201
    input: [part_number, name, part_type, "base_cost_cents?", "default_supplier_id?"]
    output: Part
    side_effects: ["revision_count=0, released_revision_id=null"]

  - method: GET
    path: "/plm/parts/{id}"
    description: "Get a Part"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: []
    output: Part
    side_effects: []

  - method: GET
    path: "/plm/parts"
    description: "List Parts; filter by part_type, default_supplier_id (FK reverse-reachability), released_revision_id (FK reverse-reachability)"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: ["part_type?", "default_supplier_id?", "released_revision_id?", "limit?", "offset?"]
    output: "Part[]"
    side_effects: []

  - method: GET
    path: "/plm/parts/{id}/where-used"
    description: "Where-used impact analysis (computed): distinct parent counts as_designed and as_released (calc where_used_blast_radius)"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
