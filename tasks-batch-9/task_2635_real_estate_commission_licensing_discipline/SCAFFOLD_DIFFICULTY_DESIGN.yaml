              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "no trust account required" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Rae Field", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { sp_id: $.data.id }
            - call: "POST /commission/licensees/${sp_id}/exam-results"
              payload: { score: 84, taken_on: "2026-07-05" }
              as: LicensingAnalyst
            - call: "GET /commission/brokerages/${bkg_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { bkg_v2: $.data.version }
            - call: "POST /commission/licensees/${sp_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v2}" }
              as: LicensingAnalyst
            - call: "POST /commission/complaints"
              payload: { complainant_name: "Ora Buyer", respondent_licensee_id: "${sp_id}", allegation_type: "MISREPRESENTATION", alleged_loss_cents: 500000, narrative: "listing square footage overstated" }
              as: Public
              captures: { c_id: $.data.id }
            - call: "POST /commission/complaints/${c_id}/disposition"
              payload: { disposition: "INVESTIGATE", investigator_user_id: "counsel-09" }
              as: CommissionCounsel
              as_user_id: "counsel-09"
            - call: "POST /commission/complaints/${c_id}/disposition"
              payload: { disposition: "PROBABLE_CAUSE", note: "score clears the floor" }
              as: CommissionCounsel
              as_user_id: "counsel-09"
            - call: "POST /commission/complaints/${c_id}/consent-agreements"
