          assert:
            - "${err_reverse} == ERR_INVALID_STATE and the reverse returned 409"
            - "${err_cancel} == ERR_INVALID_STATE and the cancel returned 409"
            - "RestoreRequest.${rr_c_id}.state == COMPLETED"
            - "Account.${acct_id}.restore_download_gb == 9.0 (the completed egress was not clawed back by the rejected reverse)"

  # ===========================================================================
  - section: calculations
    instances:

      - name: account_usage_gb_excludes_staged_delete_versions
        claim_type: Input Set Filtering
        grounds:
          - calculations.account_usage_gb
          - entities.FileVersion.fields.is_deleted
          - entities.Account.fields.usage_gb
        distinguishing_aspect: "usage_gb sums only live versions: a recoverable file that was DELETEd still counts as a version_chain but contributes 0 bytes, so a 100 GB file deleted inside its retention window leaves usage_gb agreed at 0.0 while the version row remains queryable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with an ACTIVE set holding one 100 GB file."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/doomed.bin", version_number: 1, operation: "CREATE", size_bytes: 107374182400, content_hash: "sha256-doom-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
          trigger:
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/doomed.bin", version_number: 2, operation: "DELETE", size_bytes: 0, content_hash: "sha256-doom-del", event_utc: "2026-09-03T00:00:00Z" }
              as: BackupOperator
              captures: { del_id: $.data.id }
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: SystemOperator
              captures: { usage_after_delete: $.data.usage_gb, peak_after_delete: $.data.peak_usage_gb }
          assert:
            - "FileVersion.${del_id}.is_deleted == true and is_expired == false"
            - "${usage_after_delete} == 0.0"
            - "${peak_after_delete} == 100.0 (the high-water mark is retained)"
            - "GET /backup-provider/backup-sets/${set_id}/file-versions?include_expired=true returns 2 rows"
            - "BackupSet.${set_id}.version_chain_depth == 0"

      - name: version_chain_depth_collapses_after_a_delete_event
        claim_type: Correct Result
        grounds:
          - calculations.version_chain_depth
          - entities.BackupSet.fields.version_chain_depth
        distinguishing_aspect: "The chain collapses on DELETE rather than continuing: CREATE, MODIFY, MODIFY, DELETE, CREATE yields depth 1, because a DELETE resets the count to 0 and the following CREATE restarts it at 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with an ACTIVE set."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/x.bin", version_number: 1, operation: "CREATE", size_bytes: 1073741824, content_hash: "sha256-x-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/x.bin", version_number: 2, operation: "MODIFY", size_bytes: 2147483648, content_hash: "sha256-x-v2", event_utc: "2026-09-03T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/x.bin", version_number: 3, operation: "MODIFY", size_bytes: 3221225472, content_hash: "sha256-x-v3", event_utc: "2026-09-04T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
          trigger:
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/x.bin", version_number: 4, operation: "DELETE", size_bytes: 0, content_hash: "sha256-x-del", event_utc: "2026-09-05T00:00:00Z" }
              as: BackupOperator
            - call: "GET /backup-provider/backup-sets/${set_id}"
              payload: {}
              as: BackupOperator
              captures: { depth_after_delete: $.data.version_chain_depth }
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/x.bin", version_number: 5, operation: "CREATE", size_bytes: 1073741824, content_hash: "sha256-x-v5", event_utc: "2026-09-06T00:00:00Z" }
              as: BackupOperator
            - call: "GET /backup-provider/backup-sets/${set_id}"
              payload: {}
              as: BackupOperator
              captures: { depth_after_recreate: $.data.version_chain_depth }
          assert:
            - "${depth_after_delete} == 0"
            - "${depth_after_recreate} == 1 (the CREATE restarts the chain, it does not resume at 4)"

      - name: pod_shard_geometry_branches_at_the_parity_boundary
        claim_type: Precision
        grounds:
          - calculations.pod_shard_geometry
          - entities.StoragePod.fields.parity_shards
          - entities.StoragePod.fields.is_reconstructable
        distinguishing_aspect: "The status branch is inclusive at the parity bound: a 16/12 pod with exactly 4 failed shards stays DEGRADED with is_reconstructable true, and only the 5th failure moves it to FAILED with is_reconstructable false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One 16-shard, 12-data storage pod with no failures."
          setup_api_calls:
            - *clk
            - call: "POST /backup-provider/storage-pods"
              payload: { region: "US_WEST", total_shards: 16, data_shards: 12, failed_shards: 0 }
              as: SystemOperator
              captures: { pod_id: $.data.id }
          trigger:
            - call: "POST /backup-provider/storage-pods/${pod_id}/shards/fail"
              payload: { failed_shards_delta: 4 }
              as: SystemOperator
              captures: { at_parity_state: $.data.status, at_parity_recon: $.data.is_reconstructable, at_parity_count: $.data.failed_shards }
            - call: "POST /backup-provider/storage-pods/${pod_id}/shards/fail"
              payload: { failed_shards_delta: 1 }
              as: SystemOperator
              captures: { over_state: $.data.status, over_recon: $.data.is_reconstructable, over_count: $.data.failed_shards }
            - call: "POST /backup-provider/storage-pods/${pod_id}/begin-repair"
              payload: {}
              as: SystemOperator
              captures: { unrecoverable_error: $.data.error_id }
          assert:
            - "StoragePod.${pod_id}.parity_shards == 4"
            - "${at_parity_count} == 4 and ${at_parity_state} == DEGRADED and ${at_parity_recon} == true"
            - "${over_count} == 5 and ${over_state} == FAILED and ${over_recon} == false"
            - "${unrecoverable_error} == ERR_POD_UNRECOVERABLE and the begin-repair returned 409"
            - "StoragePod.${pod_id}.status == FAILED (the refused repair did not move the pod)"
  # ===========================================================================
  - section: validations
    instances:

      - name: deletion_approve_while_litigation_hold_active_returns_hold_error
        claim_type: Violation -> Error
        grounds:
          - validations[priority=5]
          - errors.ERR_LITIGATION_HOLD_ACTIVE
          - state_machines.DataDeletionRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: "The business_safety layer outranks the referential layer: approving a deletion request while a LITIGATION_HOLD retention change governs one of the account's groups returns 422 ERR_LITIGATION_HOLD_ACTIVE and the request stays SUBMITTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with a group whose retention override is 45 and an in-flight LITIGATION_HOLD retention change request; a deletion request is SUBMITTED."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - call: "POST /backup-provider/retention-change-requests"
              payload: { account_id: "${acct_id}", group_id: "${grp_id}", requested_retention_days: 365, reason_code: "LITIGATION_HOLD", expected_group_version: "${grp_v}" }
              as: RetentionOfficer
              captures: { rcr_hold_id: $.data.id }
            - call: "POST /backup-provider/retention-change-requests/${rcr_hold_id}/begin-cooling-off"
              payload: {}
              as: RetentionOfficer
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { acct_v_hold: $.data.version }
            - call: "POST /backup-provider/data-deletion-requests"
              payload: { account_id: "${acct_id}", deletion_scope: "DELETED_FILES", authorization_ref: "ticket-DSR-7788", expected_account_version: "${acct_v_hold}" }
              as: ComplianceOfficer
              captures: { ddr_hold_id: $.data.id }
          trigger:
            - call: "POST /backup-provider/data-deletion-requests/${ddr_hold_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the approve returns 422 and error_id == ERR_LITIGATION_HOLD_ACTIVE"
            - "DataDeletionRequest.${ddr_hold_id}.state == SUBMITTED"
            - "DataDeletionRequest.${ddr_hold_id}.approved_at_utc is null"

      - name: backup_set_delete_inside_retention_window_returns_hold_active
        claim_type: Violation -> Error
        grounds:
          - validations[priority=6]
          - errors.ERR_RETENTION_HOLD_ACTIVE
          - state_machines.BackupSet.ACTIVE_to_DELETED
        distinguishing_aspect: "A set cannot be deleted while any of its versions is still inside the retention window: the same delete succeeds once the clock passes recoverable_until_utc and is refused with 409 ERR_RETENTION_HOLD_ACTIVE before it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. PERSONAL account with an ACTIVE set holding one 10 GB file whose recoverable_until_utc is 2026-10-17."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/hold.bin", version_number: 1, operation: "CREATE", size_bytes: 10737418240, content_hash: "sha256-hold-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
          trigger:
            - call: "POST /backup-provider/backup-sets/${set_id}/delete"
              payload: {}
              as: BackupOperator
              captures: { error_id: $.data.error_id }
          assert:
            - "the delete returns 409 and error_id == ERR_RETENTION_HOLD_ACTIVE"
            - "BackupSet.${set_id}.state == ACTIVE"
            - "GET /backup-provider/backup-sets/${set_id}/file-versions returns 1 row"

      - name: drive_shipment_begin_on_personal_account_returns_not_permitted
        claim_type: Violation -> Error
        grounds:
          - validations[priority=7]
          - errors.ERR_DRIVE_SHIPMENT_NOT_PERMITTED
          - state_machines.RestoreRequest.VALIDATING_to_IN_PROGRESS
        distinguishing_aspect: "The account-type gate is fiscal-layer: a PERSONAL account may create and validate a DRIVE_SHIPMENT restore but the begin call is refused with 402 ERR_DRIVE_SHIPMENT_NOT_PERMITTED, while the same call on a BUSINESS account succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T00:00:00Z. PERSONAL account with an ACTIVE set holding a 10 GB file; no group policy requires MFA."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - call: "POST /backup-provider/backup-groups/${grp_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: false, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/drive.bin", version_number: 1, operation: "CREATE", size_bytes: 10737418240, content_hash: "sha256-drive-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { acct_v_ds: $.data.version }
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_id}", subject_agent_id: "${agt_id}", restore_point_in_utc: "2026-09-03T00:00:00Z", restore_type: "DRIVE_SHIPMENT", requested_file_count: 1, requested_size_gb: 10.0, restore_transaction_count: 0, drive_capacity_gb: 50.0, drive_count: 1, deposit_fee_cents: 5000, expected_account_version: "${acct_v_ds}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { rr_ds_id: $.data.id }
            - call: "POST /backup-provider/restore-requests/${rr_ds_id}/validate"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /backup-provider/restore-requests/${rr_ds_id}/begin"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the begin returns 402 and error_id == ERR_DRIVE_SHIPMENT_NOT_PERMITTED"
            - "RestoreRequest.${rr_ds_id}.state == VALIDATING"
            - "GET /backup-provider/drive-shipments?restore_request_id=${rr_ds_id} returns 0 rows"

      - name: restore_validate_with_mfa_ticket_satisfies_the_safety_gate
        claim_type: Satisfaction -> Pass
        grounds:
          - validations[priority=5]
          - state_machines.RestoreRequest.REQUESTED_to_VALIDATING
          - entities.GroupPolicy.fields.require_mfa_for_restore
        distinguishing_aspect: "The inverse of the MFA conflict: with require_mfa_for_restore true, supplying a non-empty requester_mfa_ticket in the validate body satisfies the safety gate and the request advances to VALIDATING rather than being refused."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T00:00:00Z. PERSONAL account with an ACTIVE set holding a 10 GB file and a policy that requires MFA for restore."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/mfa.bin", version_number: 1, operation: "CREATE", size_bytes: 10737418240, content_hash: "sha256-mfa-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { acct_v_m: $.data.version }
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_id}", subject_agent_id: "${agt_id}", restore_point_in_utc: "2026-09-03T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 1, requested_size_gb: 10.0, restore_transaction_count: 0, requester_mfa_ticket: "mfa-ticket-777", expected_account_version: "${acct_v_m}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { rr_ok_id: $.data.id }
          trigger:
            - call: "POST /backup-provider/restore-requests/${rr_ok_id}/validate"
              payload: { requester_mfa_ticket: "mfa-ticket-777" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { rr_ok_state: $.data.state }
          assert:
            - "the validate returns 200 and ${rr_ok_state} == VALIDATING"
            - "no error envelope is returned"

      - name: backup_group_create_with_unknown_account_returns_account_not_found
        claim_type: Violation -> Error
        grounds:
          - validations[priority=3]
          - errors.ERR_ACCOUNT_NOT_FOUND
          - endpoints.POST_/backup-provider/backup-groups
        distinguishing_aspect: "The existence layer reports the specific missing parent: creating a group against an unallocated account id yields 404 ERR_ACCOUNT_NOT_FOUND rather than a generic 400, and no group row is written."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *clk
          trigger:
            - call: "POST /backup-provider/backup-groups"
              payload: { account_id: "00000000-0000-4000-8000-000000000009", name: "Ghost Group", tier: "STANDARD" }
              as: SystemOperator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ACCOUNT_NOT_FOUND"
            - "GET /backup-provider/backup-groups returns 0 rows"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: agent_lifecycle_create_get_then_retire
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/backup-provider/agents
          - endpoints.GET_/backup-provider/agents/{id}
          - endpoints.POST_/backup-provider/agents/{id}/retire
          - state_machines.Agent.PENDING_AUTH_to_RETIRED
        distinguishing_aspect: "The full read path is consistent across a write: an agent created PENDING_AUTH reads back with the same hostname and os_type, and can be retired directly from PENDING_AUTH because it never held a live backup set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with a group and a policy."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
          trigger:
            - call: "POST /backup-provider/agents"
              payload: { account_id: "${acct_id}", group_id: "${grp_id}", hostname: "nw-crud-01", os_type: "WINDOWS", license_type: "PERSONAL", throttle_month: 202609 }
              as: BackupOperator
              captures: { agt_crud_id: $.data.id, agt_crud_state: $.data.status, agt_crud_os: $.data.os_type }
            - call: "GET /backup-provider/agents/${agt_crud_id}"
              payload: {}
              as: BackupOperator
              captures: { agt_read_os: $.data.os_type }
            - call: "POST /backup-provider/agents/${agt_crud_id}/retire"
              payload: {}
              as: BackupOperator
              captures: { agt_retired_state: $.data.status }
          assert:
            - "${agt_crud_state} == PENDING_AUTH and ${agt_crud_os} == WINDOWS"
            - "${agt_read_os} == WINDOWS (the read agrees with the create response)"
            - "${agt_retired_state} == RETIRED"
            - "BackupGroup.${grp_id}.agent_count == 0 (the retire from PENDING_AUTH never decremented an un-incremented count)"

      - name: account_get_exposes_computed_group_count_and_effective_retention
        claim_type: Computed Read
        grounds:
          - endpoints.GET_/backup-provider/accounts/{id}
          - entities.Account.fields.group_count
          - entities.Account.fields.retention_days
          - calculations.effective_retention_days
        distinguishing_aspect: "The account read surfaces two derived values rather than stored ones: group_count counts the account's groups and retention_days is the maximum of the two group windows (45 and 60), not the account tier default."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with two groups whose overrides are 45 and 60, each with a permissive RETENTION policy."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - call: "POST /backup-provider/backup-groups"
              payload: { account_id: "${acct_id}", name: "Personal Phones", tier: "STANDARD", retention_days_override: 60 }
              as: SystemOperator
              captures: { grp2_id: $.data.id }
            - call: "POST /backup-provider/backup-groups/${grp2_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: true, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
          trigger:
            - call: "GET /backup-provider/accounts/${acct_id}"
              payload: {}
              as: SystemOperator
              captures: { gc: $.data.group_count, rd: $.data.retention_days }
          assert:
            - "${gc} == 2"
            - "${rd} == 60 (the maximum of the 45 and 60 day group windows, not the 30-day tier default)"
            - "BackupGroup.${grp_id}.group_retention_days == 45 and BackupGroup.${grp2_id}.group_retention_days == 60"

      - name: agent_block_cascades_every_set_to_suspended
        claim_type: Action Endpoint
        grounds:
          - endpoints.POST_/backup-provider/agents/{id}/block
          - state_machines.Agent.ACTIVE_to_BLOCKED
          - state_machines.BackupSet.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "One agent-level block fans out to every set of that agent in ACTIVE: after the call both sets read SUSPENDED and the agent reads BLOCKED, with no per-set endpoint called."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. PERSONAL account with an activated agent and two ACTIVE backup sets."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
            - *pol
            - *agt
            - *act
            - *setb
            - call: "POST /backup-provider/backup-sets/${set_id}/file-versions"
              payload: { file_path: "/home/u/one.bin", version_number: 1, operation: "CREATE", size_bytes: 1073741824, content_hash: "sha256-one-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets"
              payload: { agent_id: "${agt_id}", account_id: "${acct_id}", durability_class: "STANDARD" }
              as: BackupOperator
              captures: { set2_id: $.data.id }
            - call: "POST /backup-provider/backup-sets/${set2_id}/file-versions"
              payload: { file_path: "/home/u/two.bin", version_number: 1, operation: "CREATE", size_bytes: 2147483648, content_hash: "sha256-two-v1", event_utc: "2026-09-02T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set2_id}/complete-initial"
              payload: {}
              as: BackupOperator
          trigger:
            - call: "POST /backup-provider/agents/${agt_id}/block"
