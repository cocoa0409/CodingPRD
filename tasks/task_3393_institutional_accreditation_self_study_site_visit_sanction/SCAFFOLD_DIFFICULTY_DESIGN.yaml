  - rule_id: cross_entity_state_dependency
    instances:

      - name: substantive_change_gated_on_accredited_institution
        grounds:
          - validations[priority=7]
          - state_machines.SubstantiveChangeRequest
          - entities.Institution.fields.accreditation_status
        distinguishing_aspect: |
          Entity pair SubstantiveChangeRequest -> Institution: creating a
          change request against an institution whose accreditation_status is
          CANDIDATE (not ACCREDITED) fails ERR_INSTITUTION_NOT_ACCREDITED even
          though every other precondition holds.
        test_recipe:
          setup:
            - "Institution advanced to CANDIDATE via an approved STANDARD-pathway eligibility application; zero dues arrears; no sanctions."
          setup_api_calls:
            - *a_clock
            - *a_inst_priv
            - *a_elig_new
            - *a_elig_file
            - *a_elig_ok
          trigger:
            - call: "POST /accreditation/institutions/${inst_id}/substantive-change-requests"
              payload: { change_type: "DISTANCE_DELIVERY" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "creation fails with error_id == ERR_INSTITUTION_NOT_ACCREDITED (HTTP 409)"
            - "no SubstantiveChangeRequest is persisted for the institution (subsequent filtered list is empty)"

      - name: cycle_advance_gated_on_argument_submission
        grounds:
          - validations[priority=6]
          - state_machines.ReviewCycle.MATERIALS_OPEN_to_EVALUATION_ACTIVE
