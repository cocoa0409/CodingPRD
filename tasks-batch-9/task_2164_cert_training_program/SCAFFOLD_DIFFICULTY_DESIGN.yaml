  - rule_id: transitive_cascade
    instances:
      - name: void_passed_core_completion_cascades_through_credential_to_activation_fill
        grounds:
          - state_machines.ModuleCompletion.PASSED_to_VOIDED
          - state_machines.Trainee.enrollment_status.GRADUATED_to_ENROLLED
          - state_machines.Credential.ACTIVE_to_SUSPENDED
          - state_machines.RosterAssignment.NOTIFIED_to_WITHDRAWN
          - entities.Activation.fields.fill_status
          - entities.Program.fields.pending_graduation_count
        distinguishing_aspect: |
          Cascade A originates from the ModuleCompletion PASSED -> VOIDED transition and runs five
          causally chained hops: the void zeroes credited hours, THAT drops passed_core_count below the
          core requirement which demotes the Trainee GRADUATED -> ENROLLED, THAT demotion suspends the
          Credential, THAT suspension withdraws the RosterAssignment, and THAT withdrawal recomputes the
          Activation from FILLED to UNFILLED. No hop is caused directly by the void call.
