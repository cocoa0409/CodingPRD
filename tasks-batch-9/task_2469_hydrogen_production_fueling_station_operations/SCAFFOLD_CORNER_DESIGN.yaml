          and the vessel exist, so priority 60 passes, yet the vessel belongs to a DIFFERENT
          station and the booking is refused at priority 218 with a 409 rather than a 404.
        test_recipe:
          setup:
            - "Two stations under one agreement: STN-E11A (with vessel VA) and STN-E11B (with vessel VB)."
            - "One PRODUCED lot so priority 60 resolves production_lot_id."
