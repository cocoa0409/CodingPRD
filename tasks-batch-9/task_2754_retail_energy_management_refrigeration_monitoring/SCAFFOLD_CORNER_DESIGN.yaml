      - name: fault_score_weighting_chain_and_inclusive_urgent_threshold
        claim_type: precision
        grounds: "§1.3 calculations.fault_score (severity weights, PERSISTENCE_STEP 0.1 with PERSISTENCE_MAX_OCCURRENCES 10, LOAD_DIVISOR_KW 200.0 with LOAD_FACTOR_CAP 1.25, REFRIGERATION_BONUS 15.0, SCORE_CAP 100.0, WORK_ORDER_URGENT_THRESHOLD 70.0, rounding: 2 dp at steps 2/4/5, 4 dp at step 3, 1 dp final, ROUND_HALF_UP); §1.2 fault_triage_work_order link 1"
        distinguishing_aspect: |
          Three faults pin the score chain at its awkward points in one fixture:
          (a) CRITICAL / occurrence_count 1 / affected_load_kw 0.0 / HVAC lands
          EXACTLY on 70.0, so the URGENT threshold is proved inclusive without a
          rounding cushion, and because the class is HVAC the URGENT work order
          must NOT degrade the BMS; (b) MINOR / 4 occurrences / 50.0 kW /
          REFRIGERATION exercises the persistence factor 1.30, the load factor at
          its 1.25 cap (1 + 50/200 = 1.25 exactly) and the +15.0 class bonus to
          give 47.50 -> 47.5; (c) CRITICAL / 6 occurrences / 50.0 kW /
          REFRIGERATION overflows to 146.25 and must be clamped to 100.0 by
          SCORE_CAP rather than reported raw.
        test_recipe:
          setup: "commissioned store; faults (b) and (c) created first so their scores can be read back"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-FS", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "CASE-12", equipment_class: "REFRIGERATION", fault_code: "DEFROST-SHORT", severity: "MINOR", occurrence_count: 4, affected_load_kw: 50.0 }
              as: MaintenanceTech
              captures: { fault_b: "$.data.id", score_b: "$.data.fault_score" }
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RACK-B", equipment_class: "REFRIGERATION", fault_code: "COMP-TRIP", severity: "CRITICAL", occurrence_count: 6, affected_load_kw: 50.0 }
              as: MaintenanceTech
              captures: { fault_c: "$.data.id", score_c: "$.data.fault_score" }
          trigger:
            call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
            payload: { equipment_ref: "AHU-3", equipment_class: "HVAC", fault_code: "VFD-FAULT", severity: "CRITICAL", occurrence_count: 1, affected_load_kw: 0.0 }
            as: MaintenanceTech
            captures: { fault_a: "$.data.id", score_a: "$.data.fault_score" }
          assert: |
            Setup: ${score_b} == 47.5
              (persistence round(1 + 0.1 * 3, 2) = 1.30; weighted
               round(20 * 1.30, 2) = 26.00; load factor
               min(1.25, round(1 + 50.0/200.0, 4)) = 1.25; loaded
               round(26.00 * 1.25, 2) = 32.50; + 15.00 bonus = 47.50 -> 47.5)
            ${score_c} == 100.0
              (persistence 1.50, weighted 105.00, loaded 131.25, + 15.00 =
               146.25, clamped by SCORE_CAP to 100.0 - not 146.3)
            Trigger: 201. ${score_a} == 70.0 exactly
              (persistence round(1 + 0.1 * 0, 2) = 1.00; load factor
               round(1 + 0.0/200.0, 4) = 1.0000; no class bonus for HVAC),
            state == "DETECTED".
            Follow-up, same test: POST /energy-ops/fault-diagnostics/${fault_a}/triage
            with outcome "WORK_ORDER" returns work_order_priority == "URGENT"
            (70.0 >= 70.0 is inclusive), fault_state "TRIAGED",
            urgent_work_order_count 1, store_bms_status "ACTIVE" (the degrade
            link requires equipment_class REFRIGERATION) and
            store_energy_posture "CONSTRAINED".

      - name: dr_baseline_uses_top_three_of_the_eligible_lookback
        claim_type: correct_result
        grounds: "§1.3 calculations.dr_baseline_kw (BASELINE_LOOKBACK_INTERVALS 10, BASELINE_TOP_N 3, steps 1-3) and its input_set (is_on_peak true AND is_dr_event_day false AND interval_start_iso < curtailment_start_iso); §1.2 dr_notify; §1.5 POST /energy-ops/demand-response-events/{id}/notify"
        distinguishing_aspect: |
          The baseline is asserted at 1291.83, the mean of the THREE highest
          eligible intervals (1310.0, 1290.5, 1275.0) rounded to 2 dp, while
          three decoys sit in the table: a higher on-peak interval flagged
          is_dr_event_day (1500.0), a higher off-peak interval (1400.0) and a
          higher on-peak interval AFTER curtailment_start (1450.0). Each decoy
          would raise the mean if the wrong filter were applied, and averaging
          all five eligible rows instead of the top three would give 1264.10.
        test_recipe:
          setup: |
            store; TOU_DEMAND account; eight intervals - five eligible
            (1200.0, 1290.5, 1275.0, 1245.0, 1310.0 on 2026-08-05..2026-08-09,
            all on-peak, is_dr_event_day false) plus the three decoys; one
            SCHEDULED demand-response event for 2026-08-10T14:00Z..18:00Z.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-09T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-BL", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-08-05T14:00:00Z", kw_demand: 1200.0, is_on_peak: true }, { interval_start_iso: "2026-08-06T14:00:00Z", kw_demand: 1290.5, is_on_peak: true }, { interval_start_iso: "2026-08-07T14:00:00Z", kw_demand: 1275.0, is_on_peak: true }, { interval_start_iso: "2026-08-08T14:00:00Z", kw_demand: 1245.0, is_on_peak: true }, { interval_start_iso: "2026-08-09T14:00:00Z", kw_demand: 1310.0, is_on_peak: true }, { interval_start_iso: "2026-08-09T15:00:00Z", kw_demand: 1500.0, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-09T03:00:00Z", kw_demand: 1400.0, is_on_peak: false }, { interval_start_iso: "2026-08-10T15:00:00Z", kw_demand: 1450.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "DR-PEAK-A", curtailment_start_iso: "2026-08-10T14:00:00Z", curtailment_end_iso: "2026-08-10T18:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { dr_id: "$.data.id" }
          trigger:
            call: "POST /energy-ops/demand-response-events/${dr_id}/notify"
            payload: {}
            as: EnergyManager
          assert: |
            200. event_state == "NOTIFIED";
            notified_at_iso == "2026-08-09T20:00:00Z";
            baseline_kw == 1291.83
              (round((1310.0 + 1290.5 + 1275.0) / 3, 2); NOT 1264.10, which is
               the mean of all five eligible rows, and NOT any value inflated by
               the 1500.0 event-day, 1400.0 off-peak or 1450.0 post-start decoy);
            settlement_state still "PENDING"; total_reduction_kwh,
            performance_pct still null; incentive_usd == 0.0;
            penalty_usd == 0.0.
            GET /energy-ops/utility-accounts/${acct_id}/demand-intervals returns
            8 elements with total_count == 8: notification consumed intervals
            without mutating them.

      - name: measured_savings_verification_floor_is_inclusive
        claim_type: precision
        grounds: "§1.3 calculations.measured_savings_verification (CLIMATE_ADJUST_HOT_HUMID 1.08, DAYS_PER_YEAR 365, VERIFY_FLOOR_RATE 0.8, realization_rate at 4 dp, steps 3-8); §1.2 retrofit_measure_shortfall and retrofit_measure_verified; §1.5 POST /energy-ops/retrofit-projects/{id}/submit-measurement"
        distinguishing_aspect: |
          The same project is measured twice from the same baseline: the first
          submission realises 0.4991 and BRANCHES to SHORTFALL_REVIEW with no
          ledger credit, the second lands on realization_rate EXACTLY 0.8000 and
          must therefore VERIFY (the floor is inclusive at 4 dp) and credit
          Store.verified_savings_kwh_ytd by exactly measured_savings_kwh. The
          climate factor is asserted through adjusted_baseline_kwh (1.08, not
          1.0), and Store.portfolio_realization_rate must be re-derived from the
          project's CURRENT rate (0.8000), not accumulated from the earlier
          0.4991.
        test_recipe:
          setup: |
            HOT_HUMID / SUPERCENTER store, commissioned and ACTIVE; a retrofit
            project proposed by u_analyst_mv (capex 260000.00,
            projected_annual_savings_kwh 520000.00) and approved by a different
            user u_mgr_mv; one shortfall measurement already submitted
            (post_period_kwh 260000.00, mv_period_days 90).
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-MV", climate_zone: "HOT_HUMID", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "HOT_HUMID", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 75.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/retrofit-projects"
              payload: { measure_type: "ECM_MOTORS", capex_usd: 260000.00, projected_annual_savings_kwh: 520000.00 }
              as: EnergyAnalyst
              as_user_id: "u_analyst_mv"
              captures: { proj_id: "$.data.id", basis0: "$.data.priority_basis", score0: "$.data.priority_score" }
            - call: "POST /energy-ops/retrofit-projects/${proj_id}/approve"
              payload: { decision: "APPROVE" }
              as: EnergyManager
              as_user_id: "u_mgr_mv"
              captures: { basis1: "$.data.priority_basis", score1: "$.data.priority_score" }
            - call: "POST /energy-ops/retrofit-projects/${proj_id}/submit-measurement"
              payload: { install_completed_iso: "2026-07-01T00:00:00Z", baseline_period_kwh: 300000.00, post_period_kwh: 260000.00, mv_period_days: 90 }
              as: EnergyAnalyst
              as_user_id: "u_analyst_mv"
              captures: { state1: "$.data.state", rr1: "$.data.realization_rate", ms1: "$.data.measured_savings_kwh" }
          trigger:
            call: "POST /energy-ops/retrofit-projects/${proj_id}/submit-measurement"
            payload: { install_completed_iso: "2026-07-01T00:00:00Z", baseline_period_kwh: 300000.00, post_period_kwh: 221424.66, mv_period_days: 90 }
            as: EnergyAnalyst
            as_user_id: "u_analyst_mv"
          assert: |
            Setup: ${basis0} == "SIMPLE_PAYBACK" with ${score0} == 54.5
            (annual_savings_usd 57200.00 at the store's default blended rate
            0.11, payback 4.55) and after approval ${basis1} == "RISK_ADJUSTED"
            with ${score1} == 46.5 (savings 48620.00, payback 5.35, no fault
            density bonus).
            First measurement: ${state1} == "SHORTFALL_REVIEW",
            ${ms1} == 64000.00, ${rr1} == 0.4991
            (adjusted_baseline 324000.00, expected 128219.18); at that point
            Store.verified_savings_kwh_ytd was still 0.0 and
            Store.portfolio_realization_rate was 0.4991.
            Trigger: 200. adjusted_baseline_kwh == 324000.00
            (300000.00 * 1.08); measured_savings_kwh == 102575.34;
            realization_rate == 0.8000 exactly; state == "VERIFIED" (the floor
            comparison is >=, so 0.8000 verifies).
            GET /energy-ops/stores/${store_id}: verified_savings_kwh_ytd ==
            102575.34 (credited exactly once, with no residue of the shortfall
            submission) and portfolio_realization_rate == 0.8000.

      - name: lighting_override_projection_charges_and_releases_the_budget
        claim_type: correct_result
        grounds: "§1.3 calculations.lighting_override_projection (steps 1-3, OVERRIDE_MAX_HOURS 12, REVOKED rows excluded from the monthly sum); §1.2 override_created_active and override_revoke_user; §1.5 POST /energy-ops/stores/{id}/lighting-overrides, POST /energy-ops/lighting-overrides/{id}/revoke"
        distinguishing_aspect: |
          Exercises the ledger in both directions with a non-integer window: a
          7.5-hour window at 40.0 kW is 300.00 kWh (window_hours must stay exact
          rather than being rounded to 8 hours, which would give 320.00), the
          store's monthly usage accumulates to 450.00 across two zones, and the
          revocation of the first override RELEASES its 150.00 so the ledger
          falls back to exactly 300.00 - the release path that step 3 encodes by
          excluding REVOKED rows.
        test_recipe:
          setup: |
            commissioned store (override_budget_kwh_month default 500.0), clock
            2026-08-01T12:00:00Z; override 1 on SALES_FLOOR 25.0 kW for
            10:00..16:00 (6 h -> 150.00, ACTIVE because the clock is inside the
            window); override 2 on PARKING 40.0 kW for 10:00..17:30 (7.5 h ->
            300.00, also ACTIVE, different zone so no overlap conflict).
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-OV", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-01T10:00:00Z", end_iso: "2026-08-01T16:00:00Z", zone_load_kw: 25.0, requested_reason: "night inventory count" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ovr1: "$.data.id", kwh1: "$.data.projected_kwh", state1: "$.data.state" }
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "PARKING", override_type: "OCCUPANCY_DISABLE", start_iso: "2026-08-01T10:00:00Z", end_iso: "2026-08-01T17:30:00Z", zone_load_kw: 40.0, requested_reason: "lot restriping" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ovr2: "$.data.id", kwh2: "$.data.projected_kwh", state2: "$.data.state" }
          trigger:
            call: "POST /energy-ops/lighting-overrides/${ovr1}/revoke"
            payload: {}
            as: EnergyManager
            as_user_id: "u_mgr_ov"
          assert: |
            Setup: ${kwh1} == 150.00 with ${state1} == "ACTIVE";
            ${kwh2} == 300.00 with ${state2} == "ACTIVE" (7.5 exact hours x
            40.0 kW, not 320.00); after the second create,
            GET /energy-ops/stores/${store_id} reported
            override_kwh_used_month == 450.00.
            Trigger: 200. data.state == "REVOKED"; revoke_source == "USER";
            revoked_by_user_id == "u_mgr_ov"; projected_kwh still 150.00 (the
            projection is not zeroed, it is excluded from the sum).
            GET /energy-ops/stores/${store_id}: override_kwh_used_month ==
            300.00 - exactly ${kwh2}, so the revocation released 150.00.
            GET /energy-ops/stores/${store_id}/lighting-overrides?state=ACTIVE
            returns 1 element (${ovr2}); ?state=REVOKED returns 1 element
            (${ovr1}).

      - name: bill_peak_basis_variants_diverge_on_the_same_intervals
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: "dual_variant_calc / bill_peak_basis_variant_divergence_on_utility_bill"
          rationale: |
            calculations.period_peak_demand is the scaffold's canonical
            dual-variant rule, and that difficulty instance already posts one
            identical interval set against two accounts differing only in
            rate_family, then asserts billable_demand_kw 1310.5 /
            COINCIDENT_PEAK against 1402.0 / ANYTIME_PEAK and the resulting
            two-variant money delta down to the surcharge. Re-testing divergence
            here would duplicate that fixture exactly.

      - name: retrofit_priority_basis_is_reselected_at_approval
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: "dual_variant_calc / retrofit_priority_basis_variant_divergence_on_capital_project"
          rationale: |
            The Variant Selection row (correct variant applied in the correct
            context: simple_payback at proposal, risk_adjusted at approval) is
            the whole subject of that difficulty instance, which asserts
            priority_basis SIMPLE_PAYBACK with its score at creation and the
            rewritten RISK_ADJUSTED basis, payback_years and score after
            approval, including the fault-density bonus at its cap. The
            measured-savings instance above additionally re-asserts the
            proposal/approval score pair (54.5 -> 46.5) as a by-product.

      - name: dr_settlement_rounds_each_interval_before_summing
        claim_type: precision
        excluded_because:
          difficulty_instance: "combinatorial_formula / dr_settlement_round_per_interval_then_sum"
          rationale: |
            calculations.dr_event_settlement pins a round-each-then-sum order
            that differs from sum-then-round only in the cent digit. That
            difficulty instance settles a multi-interval event whose two orders
            disagree, asserting total_reduction_kwh, performance_pct against the
            75.0 floor, incentive_usd and the account's accrued ledger at exact
            literals. A corner precision test would have to reuse the same
            interval set to be meaningful.

      - name: verified_savings_ledger_reconciles_on_revocation
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: "compensating_invariant / verified_savings_ledger_conserved_on_verification_revocation"
          rationale: |
            The Reconciliation row (when the variant switches, the delta is
            correctly applied to the ledger) maps onto the VERIFIED ->
            SHORTFALL_REVIEW revocation path, where Store.verified_savings_kwh_ytd
            must give back exactly the credited measured_savings_kwh and
            portfolio_realization_rate must be re-derived. That difficulty
            instance drives the full credit-then-revoke-then-recredit cycle and
            asserts the ledger returns to its pre-credit value with no drift.

  # ===========================================================================
  - section: validations
    instances:

      - name: commissioning_rejects_draft_then_out_of_scope_standard
        claim_type: violation_to_error
        grounds: "§1.4 priority 90 -> ERR_STANDARD_NOT_PUBLISHED (409) and priority 91 -> ERR_STANDARD_SCOPE_MISMATCH (422); §1.2 bms_commission_initial preconditions 2 and 3"
        distinguishing_aspect: |
          The two conditional guards on the commissioning body are violated one
          at a time against the SAME store, so their ordering is pinned as well
          as their error ids: a DRAFT standard fails at priority 90 even though
          its scope matches, and a PUBLISHED standard for the wrong
          (climate_zone, store_format) pair then fails at priority 91. Neither
          attempt may leave the store in COMMISSIONING or bump its version, which
          is what makes the third, valid attempt in the next instance meaningful.
        test_recipe:
          setup: |
            one MIXED/SUPERCENTER store; standard D drafted for
            MIXED/SUPERCENTER (left in DRAFT) and standard E published for
            COLD/EXPRESS.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-SC", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_draft: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "COLD", store_format: "EXPRESS", season: "WINTER", cooling_setpoint_f: 72.0, heating_setpoint_f: 66.0, deadband_f: 2.0, lighting_lux_target: 600 }
              as: EnergyManager
              captures: { std_wrong: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_wrong}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_draft}", expected_store_version: "${store_v1}" }
              as: EnergyManager
              captures: { err_draft: "$.data.error_id" }
          trigger:
            call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
            payload: { standard_id: "${std_wrong}", expected_store_version: "${store_v1}" }
            as: EnergyManager
            captures: { err_scope: "$.data.error_id" }
          assert: |
            Setup call 6 (DRAFT standard, matching scope): 409,
            ${err_draft} == "ERR_STANDARD_NOT_PUBLISHED".
            Trigger (PUBLISHED standard, wrong scope): 422,
            ${err_scope} == "ERR_STANDARD_SCOPE_MISMATCH".
            GET /energy-ops/stores/${store_id} after both attempts: bms_status
            still "NOT_DEPLOYED", active_standard_id still null, version still 1
            (so ${store_v1} is still a fresh OCC token).

      - name: commissioning_admitted_when_standard_published_and_in_scope
        claim_type: satisfaction_to_pass
        grounds: "§1.4 priorities 60, 72, 80, 90 and 91 all satisfied; §1.2 bms_commission_initial (all five preconditions) and bms_activate; §1.5 POST /energy-ops/stores/{id}/bms-commissioning"
        distinguishing_aspect: |
          The satisfaction mirror of every guard that gates commissioning:
          bms_status is NOT_DEPLOYED (60), the OCC token is current (72), the
          store's posture is NORMAL rather than LOCKED (80), the standard is
          PUBLISHED (90) and its scope matches exactly (91). The call must
          succeed and produce the declared side effects - the binding, the
          version bump and the COMMISSIONING state - proving the guards are not
          simply rejecting everything.
        test_recipe:
          setup: "one MIXED/SUPERCENTER store and one PUBLISHED MIXED/SUPERCENTER standard"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-OK", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
          trigger:
            call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
            payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
            as: EnergyManager
          assert: |
            200. bms_status == "COMMISSIONING";
            active_standard_id == ${std_id}; energy_posture == "NORMAL";
            version == 2; updated_at == "2026-08-01T00:00:00Z".
            A following POST /energy-ops/stores/${store_id}/bms-activation
            returns 200 with bms_status "ACTIVE" and version 3, after which
            POST /energy-ops/stores/${store_id}/refrigeration-cases is admitted
            (priority 92 satisfied) - the same call that a NOT_DEPLOYED store
            rejects with ERR_BMS_NOT_COMMISSIONED.

      - name: duplicate_standard_scope_rejected_unless_successor_names_predecessor
        claim_type: violation_to_error
        grounds: "§1.4 priority 100 -> ERR_DUPLICATE_STANDARD_SCOPE (409) with its supersedes exemption; §1.1 SetpointStandard.supersedes_standard_id (self_referential)"
        distinguishing_aspect: |
          A CONDITIONAL uniqueness rule: the same (climate_zone, store_format,
          season) triple is rejected for a bare second draft, then ADMITTED for a
          draft that names the existing PUBLISHED standard in
          supersedes_standard_id. Both halves are needed - an implementation that
          enforces uniqueness unconditionally blocks the whole supersession
          workflow, and one that skips the check lets two live standards govern
          the same scope.
        test_recipe:
          setup: "standard A published for HOT_DRY/EXPRESS/SUMMER"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "HOT_DRY", store_format: "EXPRESS", season: "SUMMER", cooling_setpoint_f: 76.0, heating_setpoint_f: 69.0, deadband_f: 2.0, lighting_lux_target: 650 }
              as: EnergyManager
              captures: { std_a: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_a}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "HOT_DRY", store_format: "EXPRESS", season: "SUMMER", cooling_setpoint_f: 77.0, heating_setpoint_f: 69.0, deadband_f: 2.0, lighting_lux_target: 660 }
              as: EnergyManager
              captures: { err_dup: "$.data.error_id" }
          trigger:
            call: "POST /energy-ops/setpoint-standards"
            payload: { climate_zone: "HOT_DRY", store_format: "EXPRESS", season: "SUMMER", cooling_setpoint_f: 77.0, heating_setpoint_f: 69.0, deadband_f: 2.0, lighting_lux_target: 660, supersedes_standard_id: "${std_a}" }
            as: EnergyManager
            captures: { std_b: "$.data.id" }
          assert: |
            Setup call 4 (no supersedes_standard_id): 409,
            ${err_dup} == "ERR_DUPLICATE_STANDARD_SCOPE"; nothing persisted.
            Trigger: 201. status == "DRAFT"; supersedes_standard_id == ${std_a};
            revision == 1.
            GET /energy-ops/setpoint-standards?climate_zone=HOT_DRY&store_format=EXPRESS&season=SUMMER
            returns exactly 2 elements: ${std_a} PUBLISHED and ${std_b} DRAFT.
            GET /energy-ops/setpoint-standards?supersedes_standard_id=${std_a}
            returns 1 element (${std_b}).
            A third draft naming ${std_a} while ${std_b} is still DRAFT is
            rejected again with ERR_DUPLICATE_STANDARD_SCOPE, because the
            exemption admits one successor at a time.

      - name: work_order_window_conflict_on_the_same_equipment_ref
        claim_type: violation_to_error
        grounds: "§1.4 priority 103 -> ERR_WORK_ORDER_WINDOW_CONFLICT (409) with its CLOSED-interval semantics and its self-exclusion clause; §1.2 work_order_schedule and work_order_reschedule; §1.5 POST /energy-ops/work-orders/{id}/schedule"
        distinguishing_aspect: |
          A TEMPORAL rule with two twists that pull in opposite directions: the
          windows are CLOSED, so a second work order starting exactly when the
          first ends still conflicts (adjacency is a conflict here, unlike the
          HALF-OPEN lighting-override rule at priority 101), and yet
          RESCHEDULING the first work order onto a window that overlaps its own
          current window is admitted because a row is excluded from its own
          conflict set. A third work order on a DIFFERENT equipment_ref sharing
          the same window is admitted, proving the rule is scoped by
          equipment_ref rather than by store.
        test_recipe:
          setup: |
            commissioned store; two REFRIGERATION faults on equipment_ref
            "RACK-A" and one HVAC fault on "AHU-9", each triaged to a work order.
            Work order 1 is scheduled for 2026-08-02T09:00Z..12:00Z.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-WC", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RACK-A", equipment_class: "REFRIGERATION", fault_code: "SUCTION-HI", severity: "MINOR", occurrence_count: 2, affected_load_kw: 20.0 }
              as: MaintenanceTech
              captures: { f1: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RACK-A", equipment_class: "REFRIGERATION", fault_code: "OIL-LOW", severity: "MINOR", occurrence_count: 2, affected_load_kw: 20.0 }
              as: MaintenanceTech
              captures: { f2: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "AHU-9", equipment_class: "HVAC", fault_code: "FAN-AMPS", severity: "MINOR", occurrence_count: 2, affected_load_kw: 20.0 }
              as: MaintenanceTech
              captures: { f3: "$.data.id" }
            - call: "POST /energy-ops/fault-diagnostics/${f1}/triage"
              payload: { outcome: "WORK_ORDER" }
              as: MaintenanceTech
              captures: { wo1: "$.data.work_order_id", pri1: "$.data.work_order_priority" }
            - call: "POST /energy-ops/fault-diagnostics/${f2}/triage"
              payload: { outcome: "WORK_ORDER" }
              as: MaintenanceTech
              captures: { wo2: "$.data.work_order_id" }
            - call: "POST /energy-ops/fault-diagnostics/${f3}/triage"
              payload: { outcome: "WORK_ORDER" }
              as: MaintenanceTech
              captures: { wo3: "$.data.work_order_id" }
            - call: "POST /energy-ops/work-orders/${wo1}/schedule"
              payload: { scheduled_start_iso: "2026-08-02T09:00:00Z", scheduled_end_iso: "2026-08-02T12:00:00Z" }
              as: MaintenanceTech
              captures: { wo1_state: "$.data.state" }
          trigger:
            call: "POST /energy-ops/work-orders/${wo2}/schedule"
            payload: { scheduled_start_iso: "2026-08-02T12:00:00Z", scheduled_end_iso: "2026-08-02T15:00:00Z" }
            as: MaintenanceTech
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${pri1} == "ROUTINE" (fault_score 39.2 - MINOR weight 20,
            persistence 1.10, weighted 22.00, load_factor 1.1000, loaded 24.20,
            plus the 15.00 REFRIGERATION bonus - which is below the URGENT
            threshold of 70.0, so no URGENT cascade fires and the store stays
            ACTIVE / NORMAL); ${wo1_state} == "SCHEDULED".
            Trigger (starts exactly when ${wo1} ends, same equipment_ref
            "RACK-A"): 409, data.error_id == "ERR_WORK_ORDER_WINDOW_CONFLICT" -
            CLOSED intervals make touching endpoints a conflict.
            GET /energy-ops/fault-diagnostics/${f2}/work-orders shows ${wo2}
            still in state "OPEN" with null scheduled_* fields.
            Same test, two admitted follow-ups:
              POST /energy-ops/work-orders/${wo1}/schedule with
              2026-08-02T11:00:00Z..14:00:00Z -> 200, state "SCHEDULED" (the row
              is excluded from its own conflict set, so overlapping itself is a
              legal reschedule) and the stored window is the new one;
              POST /energy-ops/work-orders/${wo3}/schedule with
              2026-08-02T11:00:00Z..14:00:00Z -> 200 (different equipment_ref
              "AHU-9"; only 2 SCHEDULED work orders of this store overlap, so
              priority 121's capacity of 2 is not exceeded).

      - name: dr_activation_before_curtailment_start_is_refused
        claim_type: violation_to_error
        grounds: "§1.4 priority 110 -> ERR_CURTAILMENT_NOT_ELAPSED (422); §1.2 dr_activate; §1.5 POST /energy-ops/demand-response-events/{id}/activate"
        distinguishing_aspect: |
          A TEMPORAL guard read against the logical clock: with the clock one
          minute before curtailment_start the activation is refused, and the same
          call is admitted after the clock is set EXACTLY to curtailment_start,
          so the boundary is proved inclusive. The event's state precondition
          (NOTIFIED, priority 63) is satisfied throughout, so nothing but the
          clock comparison can produce the rejection.
        test_recipe:
          setup: |
            store; TOU_DEMAND account with one eligible on-peak interval so
            notification can compute a baseline; one event for
            2026-08-10T14:00Z..18:00Z, notified while the clock is
            2026-08-10T13:00:00Z; clock then moved to 2026-08-10T13:59:00Z.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-CT", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-08-09T14:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "DR-PEAK-A", curtailment_start_iso: "2026-08-10T14:00:00Z", curtailment_end_iso: "2026-08-10T18:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { dr_id: "$.data.id" }
            - call: "POST /energy-ops/demand-response-events/${dr_id}/notify"
              payload: {}
              as: EnergyManager
              captures: { dr_state: "$.data.event_state", baseline: "$.data.baseline_kw" }
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T13:59:00Z" }
              as: PlatformAdmin
          trigger:
            call: "POST /energy-ops/demand-response-events/${dr_id}/activate"
            payload: {}
            as: EnergyManager
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${dr_state} == "NOTIFIED" with ${baseline} == 1200.0 (a single
            eligible interval is enough, so priority 104 is satisfied).
            Trigger at 13:59:00Z: 422, data.error_id ==
            "ERR_CURTAILMENT_NOT_ELAPSED"; the event is still "NOTIFIED" and
            GET /energy-ops/stores/${store_id} still reports energy_posture
            "NORMAL" (no CURTAILED cascade fired).
            Same test: after POST /energy-ops/_clock/set_current_utc with
            2026-08-10T14:00:00Z, the identical activate call returns 200 with
            event_state "ACTIVE" and the store's energy_posture becomes
            "CURTAILED" - the boundary is inclusive at curtailment_start.

      - name: bill_recompute_without_eligible_intervals_is_refused
        claim_type: violation_to_error
        grounds: "§1.4 priority 105 -> ERR_DEMAND_DATA_MISSING (422); §1.3 calculations.period_peak_demand variant coincident_peak (eligible = is_on_peak true) and its empty-set behaviour"
        distinguishing_aspect: |
          The account HAS interval data - two off-peak rows inside the bill
          period - but none of it is eligible under the TOU_DEMAND variant, so
          the empty-set rejection depends on the variant's FILTER rather than on
          an empty table. An implementation that falls back to the anytime peak
          when the on-peak set is empty would return a bill total instead of the
          422.
        test_recipe:
          setup: |
            store; TOU_DEMAND account; two off-peak intervals inside the bill
            period plus one on-peak interval OUTSIDE it (2026-07-15, after
            period_end); one RECEIVED bill for 2026-06-01..2026-07-01.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-DM", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-10T02:00:00Z", kw_demand: 1100.0, is_on_peak: false }, { interval_start_iso: "2026-06-20T03:00:00Z", kw_demand: 1150.0, is_on_peak: false }, { interval_start_iso: "2026-07-15T14:00:00Z", kw_demand: 1300.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 60000, off_peak_kwh: 120000, billed_kwh: 180000, billed_peak_kw: 900.0, billed_amount_usd: 37294.33 }
              as: EnergyAnalyst
              captures: { bill_id: "$.data.id" }
          trigger:
            call: "POST /energy-ops/utility-bills/${bill_id}/recompute"
            payload: {}
            as: EnergyAnalyst
            captures: { err: "$.data.error_id" }
          assert: |
            422. data.error_id == "ERR_DEMAND_DATA_MISSING".
            GET /energy-ops/utility-accounts/${acct_id}/utility-bills: the bill
            is still in "RECEIVED" with every recomputed_* field null,
            billable_demand_kw null, peak_basis null, variance_pct null and
            recomputed_by_user_id null - the failed recompute wrote nothing.

      - name: tariff_switch_without_projected_savings_is_refused
        claim_type: violation_to_error
        grounds: "§1.4 priority 122 -> ERR_TARIFF_SWITCH_NOT_JUSTIFIED (422); §1.3 calculations.tariff_switch_projection (SWITCH_MIN_SAVINGS_USD 2500.00, step 5 switch_recommended = annual_delta_usd <= -2500.00)"
        distinguishing_aspect: |
          The candidate tariff is genuinely priced - it is only 0.67% more
          expensive - so the rejection depends on the SIGN and MAGNITUDE
          convention of step 5: a positive annual delta of +4700.88 is not a
          saving, and an implementation comparing abs(delta) >= 2500.00 would
          wrongly authorise a switch that costs the chain money.
        test_recipe:
          setup: |
            store; TOU_DEMAND account (0.1450 / 0.0800 / 14.50) whose candidate
            tariff is 0.1460 / 0.0805 / 14.60, also TOU_DEMAND; one on-peak
            interval of 1200.0; one bill for 2026-06-01..2026-07-01 recomputed to
            VALIDATED at 58208.15.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-TN", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, candidate_rate_schedule_code: "GS-4", candidate_rate_family: "TOU_DEMAND", candidate_demand_charge_per_kw: 14.60, candidate_rate_on_peak: 0.1460, candidate_rate_off_peak: 0.0805 }
              as: EnergyManager
              captures: { acct_id: "$.data.id", acct_v1: "$.data.version" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-15T14:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 144000, off_peak_kwh: 216000, billed_kwh: 360000, billed_peak_kw: 1200.0, billed_amount_usd: 58208.15 }
              as: EnergyAnalyst
              captures: { bill_id: "$.data.id" }
            - call: "POST /energy-ops/utility-bills/${bill_id}/recompute"
              payload: {}
              as: EnergyAnalyst
              captures: { bill_state: "$.data.validation_state", recomputed: "$.data.recomputed_amount_usd" }
          trigger:
            call: "POST /energy-ops/utility-accounts/${acct_id}/tariff-switch"
            payload: { effective_from_iso: "2026-09-01T00:00:00Z", expected_utility_account_version: "${acct_v1}" }
            as: EnergyManager
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${bill_state} == "VALIDATED" and ${recomputed} == 58208.15.
            GET /energy-ops/utility-accounts/${acct_id}/tariff-comparison reports
            current_annual_cost_usd 698497.80, candidate_annual_cost_usd
            703198.68, annual_delta_usd 4700.88 and switch_recommended false.
            Trigger: 422, data.error_id == "ERR_TARIFF_SWITCH_NOT_JUSTIFIED"
            (NOT ERR_STALE_ACCOUNT_VERSION - the OCC token is current, and NOT
            ERR_TARIFF_LOCK_ACTIVE - effective_from_iso is strictly after the
            clock and tariff_locked_until_iso is null).
            GET /energy-ops/utility-accounts/${acct_id}: tariff_state still
            "STABLE", tariff_switch_effective_from_iso null, version still 1.

      - name: unauthenticated_request_outranks_path_resolution
        claim_type: priority_ordering
        grounds: "§1.4 priority 10 -> ERR_UNAUTHENTICATED (401) versus priority 40 -> ERR_STORE_NOT_FOUND (404) and priority 20 -> ERR_UNAUTHORIZED (403); §1.6 ERR_UNAUTHENTICATED"
        distinguishing_aspect: |
          Three rules are violated by one request - no X-User-ID header, a store
          id that does not exist, and a body that omits required fields - and the
          lowest priority number must win. This is the ordering an
          implementation gets wrong by resolving the path (or validating the
          body) before authenticating, which leaks the existence of ids to
          anonymous callers.
        test_recipe:
          setup: "clock pinned; no stores exist"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            call: "POST /energy-ops/stores/str_00000000-0000-0000-0000-000000000000/refrigeration-cases"
            payload: { case_code: "CASE-NA" }
            as: NONE
            captures: { err: "$.data.error_id" }
          assert: |
            401. data.error_id == "ERR_UNAUTHENTICATED" - not
            ERR_STORE_NOT_FOUND (priority 40), not ERR_INVALID_REQUEST
            (priority 30) and not ERR_UNAUTHORIZED (priority 20, which needs an
            identified caller to evaluate a role at all).
            The trigger is sent with NO X-User-ID header; an empty-string header
            behaves identically.

      - name: override_conflict_outranks_budget_exhaustion
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / override_window_conflict_outranks_budget_exceeded"
          rationale: |
            The Priority conflict pattern row (violate rule at priority P and
            rule at priority P+N, expect P's error) is covered three times over
            in §1.8: this instance pins 101 over 120 on the same
            lighting-override create, dr_state_invalid_outranks_food_safety_hold
            pins 63 over 80, and segregation_of_duties_outranks_bill_state_invalid
            pins 54 over 62 - each with the mirror call proving the lower-priority
            rule really was violated too.

      - name: notify_with_no_eligible_baseline_intervals_is_refused
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "boundary_precision_check / baseline_empty_candidate_set_rejects_notify"
          rationale: |
            Priority 104 (ERR_BASELINE_DATA_INSUFFICIENT) is driven by that
            difficulty instance, which surrounds the event with intervals that are
            each excluded by exactly one clause of the dr_baseline_kw input set
            (off-peak, event-day flagged, at or after curtailment_start) so the
            candidate set is empty by filtering rather than by absence. The
            positive counterpart - one eligible interval is enough - is asserted
            in dr_activation_before_curtailment_start_is_refused above.

  # ===========================================================================
  - section: endpoints
    instances:

      - name: setpoint_standard_create_read_and_filtered_list_agree
        claim_type: standard_crud
        grounds: "§1.5 POST /energy-ops/setpoint-standards, GET /energy-ops/setpoint-standards/{id}, GET /energy-ops/setpoint-standards (input climate_zone?, store_format?, season?, status?, supersedes_standard_id?, limit?, offset?); §1.0 pagination_fields"
        distinguishing_aspect: |
          The read-after-write triangle for the one entity that is NOT reached
          through a store path: the POST response, the single GET and the row
          inside the list GET must all carry the same values, and the
          supersedes_standard_id filter must behave as the declared
          reverse-reachability filter for the self-referential FK. The scaffold
          declares no PUT or DELETE for any entity - every mutation after
          creation is an action endpoint - so the "update" corner is asserted as
          the immutability of the drafted body across the publish action instead.
        test_recipe:
          setup: "empty standards table; clock pinned at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MARINE", store_format: "NEIGHBORHOOD", season: "WINTER", cooling_setpoint_f: 73.0, heating_setpoint_f: 67.5, deadband_f: 2.5, lighting_lux_target: 700 }
              as: EnergyManager
              captures: { std_id: "$.data.id", std_status: "$.data.status", std_rev: "$.data.revision" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "COLD", store_format: "NEIGHBORHOOD", season: "WINTER", cooling_setpoint_f: 72.0, heating_setpoint_f: 66.0, deadband_f: 2.0, lighting_lux_target: 700 }
              as: EnergyManager
              captures: { other_id: "$.data.id" }
          trigger:
            call: "GET /energy-ops/setpoint-standards/${std_id}"
            payload: {}
            as: EnergyAnalyst
          assert: |
            Creation: 201 with ${std_status} == "DRAFT" and ${std_rev} == 1.
            Trigger: 200 and the retrieved row equals the created one field for
            field - climate_zone "MARINE", store_format "NEIGHBORHOOD", season
            "WINTER", cooling_setpoint_f 73.0, heating_setpoint_f 67.5,
            deadband_f 2.5, lighting_lux_target 700, status "DRAFT", revision 1,
            supersedes_standard_id null, published_at_iso null,
            published_by_user_id null, version 1, created_at ==
            "2026-08-01T00:00:00Z".
            GET /energy-ops/setpoint-standards?status=DRAFT&store_format=NEIGHBORHOOD
            returns total_count 2, has_more false, limit 10, offset 0 (the
            declared pagination defaults) and both ids.
            GET /energy-ops/setpoint-standards?climate_zone=MARINE returns
            total_count 1 and only ${std_id}; ${other_id} is absent.
            GET /energy-ops/setpoint-standards?supersedes_standard_id=${std_id}
            returns total_count 0 with data [] - the filter matches the FK's
            value, not the id itself.
            After POST /energy-ops/setpoint-standards/${std_id}/publish the
            single GET still returns the same setpoints and lighting_lux_target
            (only status, published_at_iso, published_by_user_id and version
            move), and GET /energy-ops/setpoint-standards?status=DRAFT no longer
            contains ${std_id}.

      - name: demand_interval_bulk_ingest_is_all_or_nothing
        claim_type: bulk_action
        grounds: "§1.5 POST /energy-ops/utility-accounts/{id}/demand-intervals (notes: the batch is all-or-nothing, rejected with ERR_INVALID_REQUEST, nothing persisted; side effect: one row per element in the order supplied); §1.1 DemandInterval.kw_demand constraint >= 0"
        distinguishing_aspect: |
          The scaffold's only bulk endpoint declares ROLLBACK rather than partial
          success, so a batch whose THIRD element violates the kw_demand
          constraint must leave the first two unpersisted. The obvious
          implementation - loop, insert, validate per element - passes a
          per-element test suite and fails this one. The retry of the corrected
          batch then proves ordering: the returned array is in submission order,
          not sorted by interval_start_iso, even though the batch is deliberately
          submitted out of chronological order.
        test_recipe:
          setup: "store with a TOU_DEMAND utility account; no intervals yet"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-BK", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
          trigger:
            call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
            payload: { intervals: [ { interval_start_iso: "2026-06-15T14:00:00Z", kw_demand: 1200.0, is_on_peak: true }, { interval_start_iso: "2026-06-15T13:45:00Z", kw_demand: 1150.0, is_on_peak: true }, { interval_start_iso: "2026-06-15T14:15:00Z", kw_demand: -5.0, is_on_peak: true } ] }
            as: EnergyAnalyst
            captures: { err: "$.data.error_id" }
          assert: |
            Trigger: 400, data.error_id == "ERR_INVALID_REQUEST" (kw_demand
            -5.0 violates ">= 0").
            GET /energy-ops/utility-accounts/${acct_id}/demand-intervals:
            total_count 0, data [] - elements 1 and 2 were NOT kept.
            Same test, corrected retry with the third element's kw_demand set to
            1100.0: 201 with 3 elements in SUBMISSION order -
            data[0].interval_start_iso "2026-06-15T14:00:00Z",
            data[1].interval_start_iso "2026-06-15T13:45:00Z",
            data[2].interval_start_iso "2026-06-15T14:15:00Z" - each with
            utility_account_id == ${acct_id}, is_dr_event_day false (default) and
            created_at "2026-08-01T00:00:00Z"; the subsequent list GET reports
            total_count 3.
            An empty array (intervals: []) is also rejected 400
            ERR_INVALID_REQUEST, and no bill state changes anywhere: any RECEIVED
            bill of the account is still "RECEIVED" with recomputed_amount_usd
            null, because ingest never triggers a recompute.

      - name: bms_commissioning_links_a_standard_to_a_store_by_reference
        claim_type: cross_reference_link
        grounds: "§1.5 POST /energy-ops/stores/{id}/bms-commissioning (input standard_id, expected_store_version; side effect sets active_standard_id); §1.4 priority 40 ERR_STORE_NOT_FOUND and priority 41 ERR_STANDARD_NOT_FOUND"
        distinguishing_aspect: |
          The cross-cutting association of the hybrid topology: a flat
          SetpointStandard is bound to a hub Store by an id in the BODY rather
          than in the path, so BOTH referents must be resolved and the path
          referent must be resolved FIRST. The test drives the three
          combinations - bad store + good standard, good store + bad standard,
          both good - and the first two must not create a partial binding.
        test_recipe:
          setup: "one store; one PUBLISHED in-scope standard"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-XR", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/str_00000000-0000-0000-0000-000000000000/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
              captures: { err_store: "$.data.error_id" }
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "std_00000000-0000-0000-0000-000000000000", expected_store_version: "${store_v1}" }
              as: EnergyManager
              captures: { err_std: "$.data.error_id" }
          trigger:
            call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
            payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
            as: EnergyManager
          assert: |
            Setup call 5 (unknown store in the path, resolvable standard in the
            body): 404, ${err_store} == "ERR_STORE_NOT_FOUND".
            Setup call 6 (resolvable store, unknown standard in the body): 404,
            ${err_std} == "ERR_STANDARD_NOT_FOUND" - the path referent resolves
            first (priority 40 before 41), and the store's version is still 1 so
            the OCC token was never consumed.
            Trigger: 200. active_standard_id == ${std_id}, bms_status
            "COMMISSIONING", version 2.
            GET /energy-ops/stores?active_standard_id=${std_id} returns exactly
            ${store_id}; GET /energy-ops/setpoint-standards/${std_id} still shows
            status "PUBLISHED" and version 2 (publishing bumped it; the binding
            does not touch the standard again).

      - name: tariff_comparison_is_a_computed_read_over_the_latest_validated_bill
        claim_type: computed_read
        grounds: "§1.5 GET /energy-ops/utility-accounts/{id}/tariff-comparison (all seven output fields, notes: every field null when the account has no VALIDATED or ADJUSTED bill); §1.3 calculations.tariff_switch_projection"
        distinguishing_aspect: |
          A pure read that must (a) SELECT its own input - the latest eligible
          bill by period_end, not the most recently created row, not the first
          one - and (b) re-price that bill's kWh split and recomputed billable
          demand under the candidate tariff without mutating anything. The
          account carries TWO validated bills whose creation order is the
          reverse of their period order, so an implementation that picks
          max(created_at) or min(period_start) reports the wrong reference bill
          and a wrong annual delta. The null-envelope case pins the
          empty-input behaviour.
        test_recipe:
          setup: |
            store; TOU_DEMAND account 0.1450 / 0.0800 / 14.50 with candidate
            0.1460 / 0.0805 / 14.60 (also TOU_DEMAND); one on-peak interval of
            300.0 in May and one of 1200.0 in June; the JUNE bill is recorded
            FIRST and the MAY bill second, both recomputed to VALIDATED.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-TC", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, candidate_rate_schedule_code: "GS-4", candidate_rate_family: "TOU_DEMAND", candidate_demand_charge_per_kw: 14.60, candidate_rate_on_peak: 0.1460, candidate_rate_off_peak: 0.0805 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-05-15T14:00:00Z", kw_demand: 300.0, is_on_peak: true }, { interval_start_iso: "2026-06-15T14:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 144000, off_peak_kwh: 216000, billed_kwh: 360000, billed_peak_kw: 1200.0, billed_amount_usd: 58208.15 }
              as: EnergyAnalyst
              captures: { june_bill: "$.data.id" }
            - call: "POST /energy-ops/utility-bills/${june_bill}/recompute"
              payload: {}
              as: EnergyAnalyst
              captures: { june_state: "$.data.validation_state", june_amount: "$.data.recomputed_amount_usd", june_demand: "$.data.billable_demand_kw" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-05-01T00:00:00Z", period_end_iso: "2026-06-01T00:00:00Z", on_peak_kwh: 36000, off_peak_kwh: 54000, billed_kwh: 90000, billed_peak_kw: 300.0, billed_amount_usd: 14410.88 }
              as: EnergyAnalyst
              captures: { may_bill: "$.data.id" }
            - call: "POST /energy-ops/utility-bills/${may_bill}/recompute"
              payload: {}
              as: EnergyAnalyst
              captures: { may_state: "$.data.validation_state", may_amount: "$.data.recomputed_amount_usd" }
          trigger:
            call: "GET /energy-ops/utility-accounts/${acct_id}/tariff-comparison"
            payload: {}
            as: EnergyAnalyst
          assert: |
            Setup: ${june_state} == "VALIDATED", ${june_amount} == 58208.15,
            ${june_demand} == 1200.0; ${may_state} == "VALIDATED",
            ${may_amount} == 14410.88 (energy 9540.00 = 36000*0.1450 +
            54000*0.0800, demand 4350.00 = 300.0*14.50, rider 520.88, surcharge
            0.00 because base+rider 14410.88 is below 20000.00).
            Trigger: 200 with
              reference_bill_id == ${june_bill}   (latest period_end wins, even
                                                   though ${may_bill} was created
                                                   later),
              current_annual_cost_usd == 698497.80   (58208.15 * 12),
              candidate_peak_basis == "COINCIDENT_PEAK",
              candidate_billable_demand_kw == 1200.0,
              candidate_annual_cost_usd == 703198.68 (energy 38412.00 = 144000 *
                0.1460 + 216000 * 0.0805, demand 17520.00 = 1200.0 * 14.60, base
                55932.00, rider 2097.45, surcharge 570.44 on the 38029.45 excess,
                monthly 58599.89, * 12),
              annual_delta_usd == 4700.88,
              switch_recommended == false.
            Nothing mutated: both bills keep their states and the account's
            version is still 1 with tariff_state "STABLE".
            Same test on a SECOND account with a candidate tariff but only a
            RECEIVED bill: 200 with reference_bill_id null,
            current_annual_cost_usd null, candidate_annual_cost_usd null,
            annual_delta_usd null, switch_recommended null, candidate_peak_basis
            null and candidate_billable_demand_kw null - the endpoint does not
            404 and does not fall back to the un-recomputed billed_amount_usd.

      - name: tariff_switch_is_admitted_only_when_the_projection_justifies_it
        claim_type: conditional_action
        grounds: "§1.5 POST /energy-ops/utility-accounts/{id}/tariff-switch (side effects: tariff_state PENDING_SWITCH, effective-from stamp, version increment, a second switch supersedes the pending one); §1.4 priority 122 ERR_TARIFF_SWITCH_NOT_JUSTIFIED; §1.3 tariff_switch_projection step 5"
        distinguishing_aspect: |
          The mirror of tariff_switch_without_projected_savings_is_refused on an
          account whose candidate tariff really is cheaper: the SAME endpoint,
          the same OCC token position and the same effective-from must now
          succeed, and the second switch on the already PENDING_SWITCH account
          must OVERWRITE rather than stack - one pending switch per account, with
          the version advancing each time and tariff_locked_until_iso still
          untouched because no scheduled switch has been applied yet.
        test_recipe:
          setup: |
            store; TOU_DEMAND account 0.1450 / 0.0800 / 14.50 with candidate
            0.1100 / 0.0700 / 11.00; one on-peak interval of 1200.0; one bill for
            2026-06-01..2026-07-01 recomputed to VALIDATED at 58208.15.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-TJ", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, candidate_rate_schedule_code: "GS-9", candidate_rate_family: "TOU_DEMAND", candidate_demand_charge_per_kw: 11.00, candidate_rate_on_peak: 0.1100, candidate_rate_off_peak: 0.0700 }
              as: EnergyManager
              captures: { acct_id: "$.data.id", acct_v1: "$.data.version" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-15T14:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 144000, off_peak_kwh: 216000, billed_kwh: 360000, billed_peak_kw: 1200.0, billed_amount_usd: 58208.15 }
              as: EnergyAnalyst
              captures: { bill_id: "$.data.id" }
            - call: "POST /energy-ops/utility-bills/${bill_id}/recompute"
              payload: {}
              as: EnergyAnalyst
              captures: { bill_state: "$.data.validation_state" }
          trigger:
            call: "POST /energy-ops/utility-accounts/${acct_id}/tariff-switch"
            payload: { effective_from_iso: "2026-09-01T00:00:00Z", expected_utility_account_version: "${acct_v1}" }
            as: EnergyManager
            captures: { acct_v2: "$.data.version", state_after: "$.data.tariff_state" }
          assert: |
            Setup: ${bill_state} == "VALIDATED".
            GET /energy-ops/utility-accounts/${acct_id}/tariff-comparison:
            current_annual_cost_usd 698497.80, candidate_annual_cost_usd
            554438.88 (energy 30960.00, demand 13200.00, base 44160.00, rider
            1656.00, surcharge 387.24, monthly 46203.24), annual_delta_usd
            -144058.92, switch_recommended true.
            Trigger: 200 with ${state_after} == "PENDING_SWITCH",
            tariff_switch_effective_from_iso "2026-09-01T00:00:00Z",
            ${acct_v2} == 2, tariff_locked_until_iso still null, and
            rate_schedule_code STILL "GS-3" (the live rates do not change until
            the switch is applied).
            Same test, superseding switch: a second call with
            effective_from_iso "2026-10-01T00:00:00Z" and
            expected_utility_account_version ${acct_v2} returns 200, leaves
            tariff_state "PENDING_SWITCH", overwrites
            tariff_switch_effective_from_iso to "2026-10-01T00:00:00Z" and takes
            version to 3 - there is exactly ONE pending switch, not two.

      - name: retrofit_rejection_is_terminal_and_keeps_the_simple_payback_basis
        claim_type: action_endpoint
        grounds: "§1.5 POST /energy-ops/retrofit-projects/{id}/approve (input decision, REJECT branch: PROPOSED -> REJECTED with priority_basis left at SIMPLE_PAYBACK, approved_by_user_id stamped in both cases); §1.3 retrofit_priority_score worked example 1; §1.4 priority 66 ERR_RETROFIT_STATE_INVALID"
        distinguishing_aspect: |
          One action endpoint with two branches selected by a body field, and the
          REJECT branch is the one that must do LESS: no re-scoring, no variant
          switch, no ledger touch - only the state move and the approver stamp.
          The rejected project is then terminal, so submit-measurement,
          revoke-verification and a second approve are all refused, which is what
          separates a real terminal state from a state that merely has no
          outgoing APPROVE.
        test_recipe:
          setup: |
            commissioned + activated MIXED/SUPERCENTER store (blended rate 0.11);
            one PROPOSED retrofit with capex_usd 240240.00 and
            projected_annual_savings_kwh 520000.00, proposed by u_analyst_rt.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-RJ", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/retrofit-projects"
              payload: { measure_type: "LED_RETROFIT", capex_usd: 240240.00, projected_annual_savings_kwh: 520000.00 }
              as: EnergyAnalyst
              as_user_id: "u_analyst_rt"
              captures: { rp_id: "$.data.id", rp_score: "$.data.priority_score", rp_basis: "$.data.priority_basis" }
          trigger:
            call: "POST /energy-ops/retrofit-projects/${rp_id}/approve"
            payload: { decision: "REJECT" }
            as: EnergyManager
            as_user_id: "u_mgr_rt"
          assert: |
            Setup: ${rp_basis} == "SIMPLE_PAYBACK" and ${rp_score} == 58.0
            (annual_savings_usd 57200.00 = 520000.00 * 0.11, payback_years 4.20,
            100 - 10 * 4.20).
            Trigger: 200. state == "REJECTED"; priority_basis STILL
            "SIMPLE_PAYBACK"; annual_savings_usd still 57200.00; payback_years
            still 4.20; priority_score still 58.0 (the risk_adjusted variant,
            which would have produced 48620.00 / 4.94 / 50.6, did NOT run);
            approved_by_user_id == "u_mgr_rt"; escalated_review still false.
            GET /energy-ops/stores/${store_id}: verified_savings_kwh_ytd still
            0.0 and portfolio_realization_rate still 0.85.
            Same test, terminal lockdown - each of these returns 409 with
            data.error_id "ERR_RETROFIT_STATE_INVALID" and changes nothing:
              POST /energy-ops/retrofit-projects/${rp_id}/approve
                with { decision: "APPROVE" } as EnergyManager,
              POST /energy-ops/retrofit-projects/${rp_id}/submit-measurement
                with { install_completed_iso: "2026-08-01T00:00:00Z",
                       baseline_period_kwh: 300000.00,
                       post_period_kwh: 200000.00, mv_period_days: 90 }
                as EnergyAnalyst,
              POST /energy-ops/retrofit-projects/${rp_id}/revoke-verification
                with { revocation_reason: "meter fault" } as EnergyManager.
            GET /energy-ops/stores/${store_id}/retrofit-projects?state=REJECTED
            returns total_count 1; ?state=PROPOSED returns total_count 0.

  # ===========================================================================
  - section: errors
    instances:

      - name: every_remaining_not_found_code_is_reachable_on_its_own_path
        claim_type: error_triggerable
        grounds: "§1.6 ERR_ACCOUNT_NOT_FOUND, ERR_BILL_NOT_FOUND, ERR_DR_EVENT_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_OVERRIDE_NOT_FOUND, ERR_FAULT_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_RETROFIT_NOT_FOUND; §1.4 priorities 40-50"
        distinguishing_aspect: |
          Eleven distinct 404 codes share one priority band, and the whole point
          of the band is that each entity family reports its OWN code. A single
          generic ERR_NOT_FOUND, or a handler that reuses the parent's code on a
          child path, passes any test that only checks the status. Each call
          below is authorised for its endpoint's roles, so nothing but path
          resolution can fail. (ERR_STORE_NOT_FOUND, ERR_STANDARD_NOT_FOUND and
          ERR_EXCURSION_NOT_FOUND are asserted in the entities and endpoints
          sections.)
        test_recipe:
          setup: "an empty database; every id below is a well-formed but unknown id"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /energy-ops/utility-accounts/ua_00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EnergyAnalyst
              captures: { e_acct: "$.data.error_id" }
            - call: "POST /energy-ops/utility-bills/ub_00000000-0000-0000-0000-000000000000/recompute"
              payload: {}
              as: EnergyAnalyst
              captures: { e_bill: "$.data.error_id" }
            - call: "POST /energy-ops/demand-response-events/dr_00000000-0000-0000-0000-000000000000/notify"
              payload: {}
              as: EnergyManager
              captures: { e_dr: "$.data.error_id" }
            - call: "GET /energy-ops/refrigeration-cases/rc_00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FoodSafetyOfficer
              captures: { e_case: "$.data.error_id" }
            - call: "POST /energy-ops/lighting-overrides/lo_00000000-0000-0000-0000-000000000000/revoke"
              payload: {}
              as: EnergyManager
              captures: { e_ov: "$.data.error_id" }
            - call: "POST /energy-ops/fault-diagnostics/fd_00000000-0000-0000-0000-000000000000/triage"
              payload: { outcome: "WORK_ORDER" }
              as: MaintenanceTech
              captures: { e_fault: "$.data.error_id" }
            - call: "POST /energy-ops/work-orders/wo_00000000-0000-0000-0000-000000000000/schedule"
              payload: { scheduled_start_iso: "2026-08-02T09:00:00Z", scheduled_end_iso: "2026-08-02T12:00:00Z" }
              as: MaintenanceTech
              captures: { e_wo: "$.data.error_id" }
          trigger:
            call: "POST /energy-ops/retrofit-projects/rp_00000000-0000-0000-0000-000000000000/approve"
            payload: { decision: "APPROVE" }
            as: EnergyManager
            captures: { e_rp: "$.data.error_id" }
          assert: |
            Every call returns 404 with its own code:
              ${e_acct}  == "ERR_ACCOUNT_NOT_FOUND"
              ${e_bill}  == "ERR_BILL_NOT_FOUND"
              ${e_dr}    == "ERR_DR_EVENT_NOT_FOUND"
              ${e_case}  == "ERR_CASE_NOT_FOUND"
              ${e_ov}    == "ERR_OVERRIDE_NOT_FOUND"
              ${e_fault} == "ERR_FAULT_NOT_FOUND"
              ${e_wo}    == "ERR_WORK_ORDER_NOT_FOUND"
              ${e_rp}    == "ERR_RETROFIT_NOT_FOUND"
            Each response is a well-formed envelope: meta.api_request_id present,
            meta.api_request_timestamp == "2026-08-01T00:00:00Z", response_type
            "error", and data carries error_id plus its declared message.
            The body-level violations in the fault, work-order and retrofit calls
            (a valid enum, a valid window) are irrelevant here; the same calls
            with an unknown id and a MALFORMED body return
            "ERR_INVALID_REQUEST" instead, because priority 30 precedes the
            404 band.

      - name: fault_suppression_is_forbidden_at_exactly_the_score_ceiling
        claim_type: error_triggerable
        grounds: "§1.6 ERR_FAULT_SUPPRESSION_FORBIDDEN (422) and ERR_FAULT_STATE_INVALID (409); §1.4 priorities 68 and 83; §1.3 fault_score constants SUPPRESSION_MAX_SCORE 50.0 and worked examples 5-6"
        distinguishing_aspect: |
          The suppression gate is a STRICT inequality, so the fault that scores
          exactly 50.0 must be refused while the one at 23.1 is suppressed -
          the mirror-image convention of the URGENT threshold on the same score
          (>= 70.0 is inclusive). Both faults are LIGHTING so the 15.00
          refrigeration bonus never fires and the score is exactly the boundary
          value. The suppressed fault is then terminal for triage, giving
          ERR_FAULT_STATE_INVALID from a state that is neither DETECTED nor
          TRIAGED.
        test_recipe:
          setup: |
            commissioned + activated store; fault A MAJOR / occurrence_count 2 /
            affected_load_kw 2.0 / LIGHTING (score 50.0) and fault B MINOR /
            occurrence_count 2 / affected_load_kw 10.0 / LIGHTING (score 23.1).
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-FS", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "LTG-A", equipment_class: "LIGHTING", fault_code: "DRIVER-FAIL", severity: "MAJOR", occurrence_count: 2, affected_load_kw: 2.0 }
              as: MaintenanceTech
              captures: { fa: "$.data.id", fa_score: "$.data.fault_score" }
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "LTG-B", equipment_class: "LIGHTING", fault_code: "LAMP-OUT", severity: "MINOR", occurrence_count: 2, affected_load_kw: 10.0 }
              as: MaintenanceTech
              captures: { fb: "$.data.id", fb_score: "$.data.fault_score" }
            - call: "POST /energy-ops/fault-diagnostics/${fb}/triage"
              payload: { outcome: "SUPPRESS" }
              as: MaintenanceTech
              captures: { fb_state: "$.data.fault_state", fb_wo: "$.data.work_order_id" }
          trigger:
            call: "POST /energy-ops/fault-diagnostics/${fa}/triage"
            payload: { outcome: "SUPPRESS" }
            as: MaintenanceTech
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${fa_score} == 50.0 (weight 45, persistence 1.10, weighted
            49.50, load_factor 1.0100, loaded 50.00, no class bonus) and
            ${fb_score} == 23.1 (weight 20, persistence 1.10, weighted 22.00,
            load_factor 1.0500, loaded 23.10). The B suppression succeeded with
            ${fb_state} == "SUPPRESSED" and ${fb_wo} null.
            Trigger: 422, data.error_id == "ERR_FAULT_SUPPRESSION_FORBIDDEN" -
            50.0 is NOT < 50.0. GET /energy-ops/stores/${store_id}/fault-diagnostics?state=DETECTED
            still contains ${fa}, and no work order exists for it.
            Same test, follow-ups:
              POST /energy-ops/fault-diagnostics/${fb}/triage with
              { outcome: "WORK_ORDER" } -> 409 "ERR_FAULT_STATE_INVALID" (only
              DETECTED may be triaged) and still no work order;
              POST /energy-ops/fault-diagnostics/${fa}/triage with
              { outcome: "WORK_ORDER" } -> 200 with work_order_priority
              "ROUTINE" (50.0 < 70.0), after which the same call again returns
              409 "ERR_FAULT_STATE_INVALID" from TRIAGED;
              POST /energy-ops/fault-diagnostics/${fa}/triage with
              { outcome: "CLOSE" } -> 400 "ERR_INVALID_REQUEST" (outcome is one
              of WORK_ORDER | SUPPRESS).

      - name: discard_mandate_forbids_a_retain_disposition_and_closure_is_terminal
        claim_type: error_triggerable
        grounds: "§1.6 ERR_DISPOSITION_MANDATE_VIOLATION (422) and ERR_EXCURSION_STATE_INVALID (409); §1.4 priorities 66 and 81; §1.3 excursion_exposure step 6 (DISPOSITION_MINUTES 240 -> mandatory_disposition DISCARD)"
        distinguishing_aspect: |
          The mandate is DERIVED, not supplied: it appears only once
          exposure_minutes reaches 240, and from that moment the food-safety
          officer's discretion is removed - RETAIN is refused even though it is a
          legal enum member and the officer holds the exclusive role. After the
          DISCARD is documented and the excursion closed, the excursion is
          terminal, so acknowledge and document-disposition both fail with the
          state code rather than silently reopening a closed food-safety record.
        test_recipe:
          setup: |
            commissioned + activated store; one MEDIUM_TEMP / DAIRY case with
            alarm_high_f 41.0 and alarm_low_f 28.0; readings at 04:00, 04:15 and
            08:00 on 2026-08-01, all breaching, with the clock at 09:00.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-DP", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-DP", case_type: "MEDIUM_TEMP", product_class: "DAIRY", alarm_high_f: 41.0, alarm_low_f: 28.0, product_value_usd: 5200.00 }
              as: EnergyManager
              captures: { case_id: "$.data.id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 43.0, reading_iso: "2026-08-01T04:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { c1: "$.data.consecutive_breach_count", x1: "$.data.excursion_id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 43.0, reading_iso: "2026-08-01T04:15:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { exc_id: "$.data.excursion_id", s2: "$.data.excursion_state", m2: "$.data.exposure_minutes" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 43.5, reading_iso: "2026-08-01T08:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { s3: "$.data.excursion_state", m3: "$.data.exposure_minutes", mand: "$.data.mandatory_disposition", peak: "$.data.peak_temp_f", posture: "$.data.store_energy_posture" }
          trigger:
            call: "POST /energy-ops/excursions/${exc_id}/document-disposition"
            payload: { disposition: "RETAIN", corrective_action_note: "product still within spec by probe check" }
            as: FoodSafetyOfficer
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${c1} == 1 with ${x1} null (GRACE_READINGS is 2, so the first
            breach opens nothing); ${s2} == "OPEN" with ${m2} == 15;
            ${s3} == "DISPOSITION_REQUIRED", ${m3} == 240 (04:00 -> 08:00, the
            >= 240 boundary is inclusive), ${mand} == "DISCARD",
            ${peak} == 43.5 and ${posture} == "LOCKED".
            Trigger: 422, data.error_id == "ERR_DISPOSITION_MANDATE_VIOLATION";
            GET /energy-ops/excursions/${exc_id} still has disposition null,
            corrective_action_note null, documented_by_user_id null and
            documented_at_iso null.
            Same test, the mandated path and the terminal lockdown:
              document-disposition with { disposition: "DISCARD",
              corrective_action_note: "5200.00 USD of dairy destroyed, log 41-A" }
              -> 200, state STILL "DISPOSITION_REQUIRED" (documentation does not
              transition), documented_at_iso "2026-08-01T09:00:00Z";
              POST /energy-ops/excursions/${exc_id}/close as FoodSafetyOfficer
              -> 200, state "CLOSED", closed_at_iso "2026-08-01T09:00:00Z", the
              case back to "ARMED" with consecutive_breach_count 0 and the store
              back to energy_posture "NORMAL";
              POST /energy-ops/excursions/${exc_id}/acknowledge as StoreManager
              with X-User-ID ${store_id} -> 409 "ERR_EXCURSION_STATE_INVALID";
              POST /energy-ops/excursions/${exc_id}/document-disposition with
              { disposition: "RETAIN", corrective_action_note: "reversal" }
              -> 409 "ERR_EXCURSION_STATE_INVALID" (the state code outranks the
              mandate code: priority 66 before 81);
              POST /energy-ops/excursions/${exc_id}/close -> 409
              "ERR_EXCURSION_STATE_INVALID".

      - name: three_system_opt_outs_suspend_the_demand_response_enrollment
        claim_type: error_triggerable
        grounds: "§1.6 ERR_DR_ENROLLMENT_SUSPENDED (409); §1.4 priority 93; §1.3 store_energy_posture coupled cascade (DR_OPTOUT_SUSPEND_COUNT 3); §1.5 POST /energy-ops/refrigeration-cases/{id}/readings cascade links 4-5"
        distinguishing_aspect: |
          The suspension is reached only through the coupled cascade: ONE
          breaching reading that pushes an excursion to ESCALATED must opt out
          ALL THREE notified events in the same request, take dr_optout_count
          from 0 straight to 3 and flip dr_enrollment_state to SUSPENDED. An
          implementation that opts out one event per reading, or that compares
          with > 3 instead of >= 3, leaves the account ENROLLED and the
          subsequent event creation succeeds.
        test_recipe:
          setup: |
            commissioned + activated store with an account holding three
            NOTIFIED events whose windows respect the 240-minute recovery gap,
            plus one eligible on-peak baseline interval; one case with
            alarm_high_f 41.0.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-SU", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-07-15T14:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "DR-A", curtailment_start_iso: "2026-08-20T14:00:00Z", curtailment_end_iso: "2026-08-20T16:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { ev1: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "DR-B", curtailment_start_iso: "2026-08-20T21:00:00Z", curtailment_end_iso: "2026-08-20T23:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { ev2: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "DR-C", curtailment_start_iso: "2026-08-21T04:00:00Z", curtailment_end_iso: "2026-08-21T06:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { ev3: "$.data.id" }
            - call: "POST /energy-ops/demand-response-events/${ev1}/notify"
              payload: {}
              as: EnergyManager
              captures: { b1: "$.data.baseline_kw" }
            - call: "POST /energy-ops/demand-response-events/${ev2}/notify"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/demand-response-events/${ev3}/notify"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-SU", case_type: "MEDIUM_TEMP", product_class: "DAIRY", alarm_high_f: 41.0, alarm_low_f: 28.0, product_value_usd: 3000.00 }
              as: EnergyManager
              captures: { case_id: "$.data.id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 42.0, reading_iso: "2026-08-01T04:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 42.0, reading_iso: "2026-08-01T04:15:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { st_open: "$.data.excursion_state", opt0: "$.data.dr_events_opted_out" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 42.0, reading_iso: "2026-08-01T06:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { st_esc: "$.data.excursion_state", mins: "$.data.exposure_minutes", opt3: "$.data.dr_events_opted_out", posture: "$.data.store_energy_posture" }
          trigger:
            call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
            payload: { program_code: "DR-D", curtailment_start_iso: "2026-08-25T14:00:00Z", curtailment_end_iso: "2026-08-25T16:00:00Z", target_reduction_kw: 200.0 }
            as: EnergyManager
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${b1} == 1200.00 (a single eligible interval); the three
            windows are legal - 16:00 to 21:00 and 23:00 to 04:00 are both
            300 minutes apart, above the 240-minute recovery gap.
            Second reading: ${st_open} == "OPEN" and ${opt0} == 0 (an OPEN
            excursion only makes the store CONSTRAINED - no opt-outs).
            Third reading: ${st_esc} == "ESCALATED", ${mins} == 120,
            ${opt3} == 3 and ${posture} == "LOCKED", all in ONE request.
            GET /energy-ops/utility-accounts/${acct_id}: dr_optout_count == 3 and
            dr_enrollment_state == "SUSPENDED".
            GET /energy-ops/utility-accounts/${acct_id}/demand-response-events:
            ${ev1}, ${ev2} and ${ev3} are each in event_state "OPTED_OUT" with
            opt_out_reason "FOOD_SAFETY_POSTURE".
            Trigger: 409, data.error_id == "ERR_DR_ENROLLMENT_SUSPENDED"; the
            list still returns total_count 3.
            Same test: POST /energy-ops/demand-response-events/${ev1}/notify now
            returns 409 as well - priority 63 (ERR_DR_EVENT_STATE_INVALID, an
            OPTED_OUT event is not SCHEDULED) precedes priority 93 on the notify
            path.

      - name: revoking_an_already_revoked_override_is_refused_and_releases_nothing_twice
        claim_type: error_triggerable
        grounds: "§1.6 ERR_OVERRIDE_STATE_INVALID (409); §1.4 priority 67 (SCHEDULED or ACTIVE only); §1.5 POST /energy-ops/lighting-overrides/{id}/revoke (releases projected_kwh)"
        distinguishing_aspect: |
          The refusal protects a LEDGER, not just a state: the first revoke
          releases 150.00 kWh from Store.override_kwh_used_month and the second
          must release nothing. An implementation that makes revoke idempotent -
          returning 200 and subtracting again - drives the monthly counter
          negative and silently enlarges the override budget, which no
          state-only assertion would catch.
        test_recipe:
          setup: |
            commissioned + activated store (override_budget_kwh_month 500.0,
            override_kwh_used_month 0.0); clock 2026-08-01T00:00:00Z; one
            SALES_FLOOR SCHEDULE_EXTEND override 00:00Z..06:00Z with
            zone_load_kw 25.0, created ACTIVE.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-OR", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-01T00:00:00Z", end_iso: "2026-08-01T06:00:00Z", zone_load_kw: 25.0, requested_reason: "inventory night" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ov_id: "$.data.id", ov_state: "$.data.state", ov_kwh: "$.data.projected_kwh" }
            - call: "POST /energy-ops/lighting-overrides/${ov_id}/revoke"
              payload: {}
              as: EnergyManager
              as_user_id: "u_mgr_ov"
              captures: { rev_state: "$.data.state", rev_src: "$.data.revoke_source" }
          trigger:
            call: "POST /energy-ops/lighting-overrides/${ov_id}/revoke"
            payload: {}
            as: EnergyManager
            as_user_id: "u_mgr_ov"
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${ov_state} == "ACTIVE" (start_iso <= clock < end_iso) and
            ${ov_kwh} == 150.00 (6 exact hours * 25.0 kW); the store's
            override_kwh_used_month is 150.0 at that point. First revoke:
            ${rev_state} == "REVOKED", ${rev_src} == "USER",
            revoked_by_user_id "u_mgr_ov", and
            GET /energy-ops/stores/${store_id} reports override_kwh_used_month
            back to 0.0.
            Trigger: 409, data.error_id == "ERR_OVERRIDE_STATE_INVALID", and
            override_kwh_used_month is STILL 0.0 - not -150.0.
            Same test: after POST /energy-ops/_clock/set_current_utc with
            2026-08-01T07:00:00Z (which reports overrides_expired 0, because the
            override left the sweep's SCHEDULED|ACTIVE set when it was revoked),
            the revoke still returns 409 ERR_OVERRIDE_STATE_INVALID; an override
            that reaches EXPIRED through the sweep instead keeps its
            projected_kwh charged and also refuses revocation with the same code.

      - name: settlement_actions_are_refused_outside_their_settlement_state
        claim_type: error_triggerable
        grounds: "§1.6 ERR_SETTLEMENT_STATE_INVALID (409); §1.4 priority 64 (PENDING for settle with event_state COMPLETED, SETTLED for reverse-settlement); §1.3 dr_event_settlement empty_set_behavior"
        distinguishing_aspect: |
          One error code guards TWO endpoints against three different wrong
          moments: reverse-settlement while settlement_state is still PENDING,
          settle while the event has not yet reached COMPLETED, and settle a
          second time. The event's settlement dimension is orthogonal to its
          lifecycle dimension, so an implementation that keys the guard on
          event_state alone admits the double settlement - and doubles the
          accrued incentive.
        test_recipe:
          setup: |
            store; account with one eligible baseline interval on 2026-07-15 and
            NO interval inside the event window; event 2026-08-20T14:00Z..16:00Z
            notified, activated at 14:00 and completed by the sweep at 16:30.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-ST", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-07-15T14:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "DR-S", curtailment_start_iso: "2026-08-20T14:00:00Z", curtailment_end_iso: "2026-08-20T16:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { ev: "$.data.id" }
            - call: "POST /energy-ops/demand-response-events/${ev}/notify"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/demand-response-events/${ev}/settle"
              payload: {}
              as: EnergyAnalyst
              captures: { e_early: "$.data.error_id" }
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/demand-response-events/${ev}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T16:30:00Z" }
              as: PlatformAdmin
              captures: { completed: "$.data.dr_events_completed" }
          trigger:
            call: "POST /energy-ops/demand-response-events/${ev}/reverse-settlement"
            payload: { reversal_reason: "utility recalculation" }
            as: EnergyManager
            captures: { err: "$.data.error_id" }
          assert: |
            Setup call 7 (settle while the event is NOTIFIED): 409,
            ${e_early} == "ERR_SETTLEMENT_STATE_INVALID" - settle requires
            event_state COMPLETED even though settlement_state is already
            PENDING.
            Sweep: ${completed} == 1, so the event is COMPLETED with
            settlement_state still "PENDING" and the store's energy_posture back
            to "NORMAL".
            Trigger (reverse before settle): 409, data.error_id ==
            "ERR_SETTLEMENT_STATE_INVALID"; reversal_reason is NOT stored and
            the account's dr_incentive_accrued_usd is still 0.00.
            Same test, the legal settle and the double settle:
              POST /energy-ops/demand-response-events/${ev}/settle as
              EnergyAnalyst -> 200 with settlement_state "SETTLED", event_state
              still "COMPLETED", total_reduction_kwh 0.00, performance_pct 0.0,
              incentive_usd 0.00 and penalty_usd 0.00 (the input set is empty:
              the only interval is outside [14:00, 16:00)), leaving
              dr_incentive_accrued_usd at 0.00;
              the identical settle again -> 409
              "ERR_SETTLEMENT_STATE_INVALID" (settlement_state is no longer
              PENDING).

      - name: measurement_period_below_the_minimum_is_refused
        claim_type: error_triggerable
        grounds: "§1.6 ERR_MV_PERIOD_TOO_SHORT (422); §1.4 priority 112 (mv_period_days >= 60 and install_completed_iso at or before the clock); §1.3 measured_savings_verification steps 1-8"
        distinguishing_aspect: |
