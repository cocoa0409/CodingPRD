            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert1}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/stores/${store_id}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/inspections", payload: { scheduled_start_utc: "2026-09-03T09:00:00Z", scheduled_end_utc: "2026-09-03T10:00:00Z" }, as: BrandInspector, as_user_id: "insp-Z", captures: { insp_a: $.data.id } }
          trigger:
            - { call: "POST /licensing/stores/${store_id}/inspections", payload: { scheduled_start_utc: "2026-09-03T10:00:00Z", scheduled_end_utc: "2026-09-03T11:00:00Z" }, as: BrandInspector, as_user_id: "insp-Z", captures: { insp_b: $.data.id } }
            - { call: "POST /licensing/stores/${store_id}/inspections", payload: { scheduled_start_utc: "2026-09-03T09:30:00Z", scheduled_end_utc: "2026-09-03T10:30:00Z" }, as: BrandInspector, as_user_id: "insp-Z", captures: { err: $.data.error_id } }
          assert:
            - "Adjacent inspection created: HTTP 201 and Inspection.${insp_b}.status == SCHEDULED (half-open end == start is NOT an overlap)"
            - "err == \"ERR_INSPECTOR_SCHEDULE_CONFLICT\" with HTTP 409 for the strictly overlapping 09:30-10:30 request"

      - name: promotion_closed_interval_boundary_conflicts
        grounds:
          - validations[priority=30]
          - entities.PromotionCampaign.fields.start_date
        distinguishing_aspect: |
          Resource store under CLOSED date-interval semantics (different semantics and different
          resource than the inspector half-open rule): a campaign whose start_date equals the
          prior campaign's end_date (2026-10-10 shared) conflicts, while one starting the next day
          (2026-10-11) is accepted.
        test_recipe:
          setup:
            - "OPERATING store; campaign A PLANNED for 2026-10-01..2026-10-10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
