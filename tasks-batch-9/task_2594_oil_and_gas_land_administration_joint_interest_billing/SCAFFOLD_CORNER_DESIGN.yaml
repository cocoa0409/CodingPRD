      - name: a_cost_entry_naming_an_afe_of_another_well_is_rejected
        claim_type: cross_reference_link
        grounds:
          - "validations[priority=65, error_id=ERR_COST_AFE_MISMATCH]"
          - errors.ERR_COST_AFE_MISMATCH
          - endpoints.POST_/land-admin/wells/{well_id}/cost-entries
        distinguishing_aspect: |
          Both referenced rows exist, so this is not a not-found case: the AFE is real but belongs to
          Sandstone 2H while the cost entry is being booked on Sandstone 1H, which returns
          ERR_COST_AFE_MISMATCH (422) and leaves the first well with no cost rows.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Wells Sandstone 1H and Sandstone 2H"
            - "AFE AFE-002 created on Sandstone 2H, cost_class CAPITAL, election_deadline_date 2026-07-31"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well1_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 2H", api_number: "42-123-45679", product_type: "OIL", total_depth_ft: 9000 }
              as: LandAdministrator
              captures: { well2_id: $.data.id }
            - call: "POST /land-admin/wells/${well2_id}/afes"
              payload: { afe_number: "AFE-002", operation_type: "COMPLETION", estimated_cost_cents: 2000000, cost_class: "CAPITAL", election_deadline_date: "2026-07-31" }
              as: LandAdministrator
              captures: { afe2_id: $.data.id }
          trigger:
            - call: "POST /land-admin/wells/${well1_id}/cost-entries"
              payload: { cost_category: "COMPLETION", cost_class: "CAPITAL", amount_cents: 2000000, incurred_date: "2026-06-05", afe_id: "${afe2_id}" }
              as: JointInterestAccountant
              as_user_id: "u-jib-1"
          assert:
            - "HTTP 422 with error_id ERR_COST_AFE_MISMATCH"
            - "the response error_id is not ERR_AFE_NOT_FOUND - the AFE exists, it is simply on another well"
            - "GET /land-admin/cost-entries?well_id=${well1_id} returns total_count == 0"
            - "the same body posted to /land-admin/wells/${well2_id}/cost-entries succeeds with 201"

      - name: a_second_obligation_run_at_the_same_clock_reports_zero_transitions
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/land-admin/obligation-runs
          - state_machines.Lease.PRIMARY_TERM_to_EXPIRED
          - roles.ComplianceOfficer
        distinguishing_aspect: |
          The sweep is idempotent per clock value: the first run at 2026-07-10 expires the one lease
          whose primary term ended 2026-06-30 and reports leases_expired 1, and the immediately
          following run over the same data reports every counter as 0 because the lease is now in the
          terminal tenure state.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "A single lease L-004, 200.00 gross acres, primary_term_end_date 2026-06-30, no wells and no allocations"
            - "One obligation run already executed at this clock value, which reported leases_expired == 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-004", lessor_name: "Zeta Minerals", gross_acres: 200.00, royalty_rate: 0.200000, primary_term_end_date: "2026-06-30" }
              as: LandAdministrator
              captures: { lease4_id: $.data.id }
            - call: "POST /land-admin/obligation-runs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          trigger:
            - call: "POST /land-admin/obligation-runs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          assert:
            - "HTTP 200"
            - "the response reports leases_expired == 0, leases_flagged_obligation_due == 0, leases_in_breach == 0, allocations_withdrawn == 0, revenues_suspended == 0, disbursements_suspended == 0, disputes_escalated == 0, disputes_expired == 0 and transfers_deemed_waived == 0"
            - "evaluated_at == 2026-07-10T00:00:00Z"
            - "Lease.${lease4_id}.tenure_status == EXPIRED with the same version the first run left behind"

