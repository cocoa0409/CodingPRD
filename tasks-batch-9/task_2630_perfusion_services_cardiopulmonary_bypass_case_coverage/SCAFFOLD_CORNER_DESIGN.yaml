              payload: { relief_slot_id: "${slot6}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
          assert:
            - "before the trigger EcmoRun.${run1}.status == RELIEF_PENDING with uninterrupted_minutes == 600, staffing_breach == false and primary_perfusionist_id == ${p1}"
            - "the handoff returns HTTP 200 with EcmoRun.${run1}.status == RUNNING and primary_perfusionist_id == ${p6}"
            - "EcmoRun.${run1}.relief_slot_id == ${slot6} and last_handoff_at == '2026-08-01T10:00:00Z'"
            - "EcmoRun.${run1}.uninterrupted_minutes == 0 and staffing_breach == false - the handoff restarts the uninterrupted clock from last_handoff_at"
            - "EcmoRun.${run1}.cannulated_at is still '2026-08-01T00:00:00Z' - the handoff does not rewrite the cannulation instant that drives billable_hours"
            - "CallRotationSlot.${slot6}.status == ACTIVE with consumed == true and version == ${slot6_v} + 1"
            - "CallRotationSlot.${slot_p1}.status is still ACTIVE - the primary call slot that carried the case is untouched by the ECMO relief"
            - "BypassCase.${case1}.bypass_status is still ON_BYPASS"

      - name: pack_read_returns_materialised_lines_and_the_case_read_returns_its_fees
        claim_type: computed_read
        grounds:
          - endpoints[GET /disposable-packs/{id}]
          - endpoints[GET /bypass-cases/{id}]
          - entities.DisposablePack.fields.line_items
          - entities.DisposablePack.fields.prime_volume_ml
          - calculations.disposable_pack_cost
        distinguishing_aspect: |
          The pack read must expose each materialised line with its own rounded line_total_cents in
          ascending line_code order, and those three literals must sum to the pack_cost_cents the case was
          configured with, so a reader that recomputes on the fly or reorders the array is caught.
        test_recipe:
          setup:
            - "LEAN BASE chain through disposable-pack configuration with no substitutions, so pack1 is materialised from pc1 at markup 0.20 and discount 0.10."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
