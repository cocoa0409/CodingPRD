            - call: "POST /production-runs/${run_a}/start-cure"
              payload: { avg_zone_temp_f: 470.0, line_speed_fpm: 40.0, binder_applied_kg: 900.0 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /thermal-tests"
              payload: { production_run_id: "${run_a}", product_line_id: "${pl_a}", certification_program_id: "${prog_ps}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T12:00:00Z" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { test_a: "$.data.id" }
            - call: "POST /thermal-tests/${test_a}/start-lab"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
          trigger:
            - call: "POST /thermal-tests/${test_a}/record-result"
              payload: { specimen_r_values: [12.40, 12.90, 12.90] }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /product-lines/${pl_a}/submit-certification"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /product-lines/${pl_a}/certification-decision"
              payload: { decision: "DERATE", decision_note: "declared value cannot be sustained" }
              as: CertificationOfficer
              as_user_id: "co-1"
          assert:
            - "ThermalTest.${test_a}.min_r_value == 12.40, mean_r_value == 12.73 (38.20 / 3 = 12.7333... at 2 dp) and specimen_count == 3"
            - "floor_r == 12.70 (13.0 - 0.30) and PER_SPECIMEN compares the minimum: 12.40 >= 12.70 is false, so conformance_verdict == NONCONFORMING"
            - "ProductionRun.${run_a}.qc_status == NONCONFORMING while run_status is still CURING"
            - "ProductLine.${pl_a}.certification_status == DERATED and effective_declared_r_value == 12.00"
            - "the derate arithmetic uses basis_value 12.40: steps = floor(12.40 / 0.5) = floor(24.8) = 24, so 24 * 0.5 = 12.00 — the snap is DOWN a whole step, never a round-to-nearest 12.50"
            - "the same specimens on a LOT_MEAN program would derate to 12.50 (floor(12.73 / 0.5) = 25), so the basis choice alone moves the declared value by one step"
            - "12.00 is strictly between 0 and the declared 13.0, so ERR_DERATE_NOT_PERMITTED does not fire"

