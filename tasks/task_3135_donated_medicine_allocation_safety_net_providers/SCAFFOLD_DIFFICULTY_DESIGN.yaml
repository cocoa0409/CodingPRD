              as: QAPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /medicine-relief/lots/${lot_id}/release"
              payload: {}
              as: QAPharmacist
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "C", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_id: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${site_id}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L-1", expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /medicine-relief/licenses/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/sites/${site_id}/qualify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /medicine-relief/allocation-requests"
              payload: { site_id: "${site_id}", ndc_code: "N1", quantity_requested: 10, justification_text: "r" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { req_id: $.data.id }
            - call: "POST /medicine-relief/allocation-requests/${req_id}/begin-review"
              payload: {}
              as: AllocationOfficer
            - call: "GET /medicine-relief/allocation-requests/${req_id}"
              payload: {}
              as: AllocationOfficer
              captures: { req_v: $.data.version }
            - call: "POST /medicine-relief/allocation-decisions"
              payload: { request_id: "${req_id}", rationale: "r", lines: [{ lot_id: "${lot_id}", quantity: 10 }] }
              as: AllocationOfficer
              captures: { dec_id: $.data.id }
            - call: "POST /medicine-relief/allocation-decisions/${dec_id}/finalize"
              payload: { expected_request_version: "${req_v}" }
              as: AllocationOfficer
          trigger:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "at 2026-09-03T23:59:59Z the line is still RESERVED and ProductLot.${lot_id}.quantity_committed == 10"
            - "at 2026-09-04T00:00:00Z the line transitions to FORFEITED (inclusive >= boundary)"
            - "ProductLot.${lot_id}.quantity_committed == 0 after the sweep"
            - "ProductLot.${lot_id}.quantity_available == 100 after the sweep"
            - "AllocationRequest.${req_id}.status transitions to REJECTED (quantity_approved drops to 0)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: shipment_cancel_restores_lot_quantity_committed_and_available
        grounds:
          - state_machines.Shipment.PACKING_to_CANCELLED
          - state_machines.AllocationLine.RESERVED_to_PICKED
          - calculations.lot_available_quantity
        distinguishing_aspect: |
          Conserved quantity = ProductLot.quantity_received. Forward action:
          shipment create converts RESERVED -> PICKED (decrements
          quantity_committed but quantity still bound). Compensating action:
          shipment cancel returns PICKED -> RESERVED (re-increments
          quantity_committed). Invariant: quantity_received ==
          quantity_quarantined + quantity_committed + quantity_shipped +
          quantity_expired + quantity_available holds before and after the
          round-trip.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Donor D, RELEASABLE lot L quantity_received=100."
            - "Site S QUALIFIED. FINALIZED decision D with line of 10 against L (quantity_committed=10)."
