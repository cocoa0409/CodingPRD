            - call: "POST /expense-claims/${claim_id}/pay"
              payload: {}
              as: FinanceSpecialist
          assert:
            - "after resubmit: ExpenseClaim.${claim_id}.status == SUBMITTED, amount_cents == 45000, reject_reason == null"
            - "final: ExpenseClaim.${claim_id}.status == PAID"
            - "ExpenseClaim.${claim_id}.gross_up_cents == 12692 (round_half_up(45000 x 0.22 / 0.78))"
            - "ExpenseClaim.${claim_id}.total_payment_cents == 57692"
            - "RelocationCase.${case_id}.total_paid_cents == 57692"

  # ===========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers; depth 3 / 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: early_departure_depth3_cascade
        grounds:
          - state_machines.RelocationCase.IN_PROGRESS_to_CLOSED_EARLY
          - state_machines.ServiceBooking.CONFIRMED_to_CANCELLED
          - calculations.case_cost_ledger
          - calculations.repayment_schedule
        distinguishing_aspect: |
          Depth-3 chain from the terminate-early trigger: case -> CLOSED_EARLY
          causes the CONFIRMED booking -> CANCELLED (hop 1); that cancellation
          itself releases 135000 committed cents into total_released_cents
          (hop 2); the finalized paid ledger then seeds RepaymentAgreement
          creation with total_owed_cents 45750 (hop 3). Trigger differs from
          the sibling's plain cancel.
        test_recipe:
          setup:
            - "MANAGER/DOMESTIC/RENTER policy (repayment_window_months 24); case IN_PROGRESS"
            - "TEMP_HOUSING booking Sep 1-10 (9 nights x 15000 = 135000) CONFIRMED (committed 135000)"
            - "TRAVEL booking 61000 COMPLETED (paid 61000)"
            - "Clock at 2027-02-01; employee terminated"
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
