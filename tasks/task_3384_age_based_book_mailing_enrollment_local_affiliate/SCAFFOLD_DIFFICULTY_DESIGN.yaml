          - state_machines.Child.UNDELIVERABLE_HOLD_to_ACTIVE
        distinguishing_aspect: |
          Child machine is cyclic: ACTIVE -> UNDELIVERABLE_HOLD (first return)
          -> ACTIVE (approved in-area address change resets consecutive_returns
          to 0) — a revert loop, not a pipeline.
        test_recipe:
          setup:
            - "Bootstrap through wave 2026-10 manifest (3 items, not reconciled). c1's item returned once."
          setup_api_calls:
