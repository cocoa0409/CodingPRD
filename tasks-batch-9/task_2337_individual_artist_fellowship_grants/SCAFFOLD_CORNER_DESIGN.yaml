      - name: appeal_family_from_the_window_through_the_remedy_map
        claim_type: triggerable
        grounds:
          - errors[ERR_APPEAL_WINDOW_CLOSED]
          - errors[ERR_NON_PROCEDURAL_APPEAL_GROUNDS]
          - errors[ERR_APPEAL_STATE_INVALID]
          - errors[ERR_REMEDY_NOT_PERMITTED_FOR_GROUNDS]
          - errors[ERR_DUPLICATE_APPEAL]
        distinguishing_aspect: |
          Five appeal codes on one struck application. The window is 30 days from
          notified_at 2026-10-16, so 2026-11-16 is closed while 2026-11-15 is
          still open (inclusive). A SUBSTANTIVE_SCORE_DISAGREEMENT appeal cannot
          be screened but can be denied straight from FILED, whereas a procedural
          appeal decided before screening is ERR_APPEAL_STATE_INVALID — the two
          grounds families take opposite paths through the same endpoints. Only
          RESCORE_BY_NEW_PANEL is permitted for SCORING_PROCEDURE_DEFECT, and the
          DENIED appeal does not block a second filing while a FILED one does.
        test_recipe:
          setup:
            - "CornerMain slot struck at 2026-10-16 so the application is NOT_RECOMMENDED with notified_at set"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
            - *n_srev1
            - *n_rev2
            - *n_srev2
            - *n_rev3
            - *n_srev3
            - *n_closeround
            - *n_board
            - *n_getpan
            - *n_slate
            - *n_getslot
            - *n_getcyc
            - { call: "POST /grants/recommendation-slots/${slot}/board-action", payload: { action: STRIKE, expected_cycle_version: "${cyc_v}", struck_reason_code: BUDGET_CONSTRAINT }, as: CouncilBoardMember, as_user_id: "board-1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-16T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/appeals", payload: { application_id: "${app}", grounds_code: SCORING_PROCEDURE_DEFECT, statement: "The panel did not record a second-round score." }, as: Artist, as_user_id: "${art}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/appeals", payload: { application_id: "${app}", grounds_code: SUBSTANTIVE_SCORE_DISAGREEMENT, statement: "The panel undervalued the manuscript." }, as: Artist, as_user_id: "${art}", captures: { ap1: "$.data.id" } }
            - { call: "POST /grants/appeals/${ap1}/screen", payload: {}, as: AppealsOfficer, as_user_id: "appeals-1" }
            - { call: "POST /grants/appeals/${ap1}/decide", payload: { decision: DENY }, as: AppealsOfficer, as_user_id: "appeals-1" }
            - { call: "POST /grants/appeals", payload: { application_id: "${app}", grounds_code: SCORING_PROCEDURE_DEFECT, statement: "The panel did not record a second-round score." }, as: Artist, as_user_id: "${art}", captures: { ap2: "$.data.id" } }
            - { call: "POST /grants/appeals", payload: { application_id: "${app}", grounds_code: CONFLICT_NOT_MANAGED, statement: "A third filing while the second is open." }, as: Artist, as_user_id: "${art}" }
            - { call: "POST /grants/appeals/${ap2}/decide", payload: { decision: UPHOLD, remedy_code: RESCORE_BY_NEW_PANEL }, as: AppealsOfficer, as_user_id: "appeals-1" }
            - { call: "POST /grants/appeals/${ap2}/screen", payload: {}, as: AppealsOfficer, as_user_id: "appeals-1" }
            - { call: "POST /grants/appeals/${ap2}/decide", payload: { decision: UPHOLD, remedy_code: REISSUE_SLATE }, as: AppealsOfficer, as_user_id: "appeals-1" }
            - { call: "POST /grants/appeals/${ap2}/decide", payload: { decision: UPHOLD, remedy_code: RESCORE_BY_NEW_PANEL }, as: AppealsOfficer, as_user_id: "appeals-1" }
            - { call: "GET /grants/panels/${pan}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The 2026-11-16 filing returns 409 ERR_APPEAL_WINDOW_CLOSED (31 days after notified_at)"
            - "The 2026-11-15 filing returns 201 with status \"FILED\" and filed_by_artist_id equal to the application's artist_id — the 30th day is inside the window"
            - "Screening the substantive appeal returns 409 ERR_NON_PROCEDURAL_APPEAL_GROUNDS and it stays \"FILED\""
            - "Denying it returns 200 with status \"DENIED\" and screened_by still null"
            - "The procedural appeal filed afterwards returns 201 — a DENIED appeal does not block a new filing — while the further filing returns 409 ERR_DUPLICATE_APPEAL"
            - "Deciding the unscreened procedural appeal returns 409 ERR_APPEAL_STATE_INVALID; after screening it returns 200 with status \"SCREENED\""
            - "UPHOLD with REISSUE_SLATE returns 409 ERR_REMEDY_NOT_PERMITTED_FOR_GROUNDS; UPHOLD with RESCORE_BY_NEW_PANEL returns 200 with status \"UPHELD\" and decided_by \"appeals-1\""
            - "The panel read shows status \"SCORING\" with round_number 2 and assigned_application_count 0; the application reads status \"ELIGIBLE\", assigned_panel_id null, valid_review_count 0 and final_composite_score null, with its three reviews \"INVALIDATED\" for reason \"APPEAL_REMEDY\""

      - name: upheld_composition_appeal_reissues_the_struck_slate
        claim_type: triggerable
        grounds:
          - state_machines.RecommendationSlot[BOARD_STRUCK->PROPOSED]
          - endpoints[POST /grants/appeals/{appeal_id}/decide]
        distinguishing_aspect: |
          PANEL_COMPOSITION_DEFECT is the only grounds that permits either remedy,
          and REISSUE_SLATE must restore the struck slot to PROPOSED with
          board_action_by and struck_reason_code cleared and the application back
          to SCORED — without invalidating any review. The board can then approve
          the reissued slot, which an implementation that treats BOARD_STRUCK as
          irreversibly terminal cannot do.
        test_recipe:
          setup:
            - "CornerMain slot struck at 2026-10-16; a PANEL_COMPOSITION_DEFECT appeal filed and screened"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
