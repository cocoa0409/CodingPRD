# =============================================================================
# Example: event-staffing benchmark seed tables (v1)
# =============================================================================

scenario: |
  Event staffing platform managing the full lifecycle of staffing engagements.
  Coordinates between event organizers, staffing coordinators, and staff members.
  Handles staffing contracts, events, shifts, staff profiles with certifications,
  assignments with overtime calculations, conflict pairings, compliance risk scoring,
  budget ledgers, and payroll finalization with cascading effects.

domain_name: event-staffing
api_prefix: /staffing-contracts

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: StaffingContract
    parent: null
    common_fields: true  # id, created_at, updated_at
    fields:
      - { name: client_name, type: string, source: input, description: "Name of the client for this engagement" }
      - { name: status, type: enum, source: system, description: "PLANNING → ACTIVE → PAYROLL_PENDING → CLOSED" }
      - { name: total_budget, type: number, source: input, description: "Total budget for staffing the contract" }
      - { name: budget_balance, type: number, source: computed, description: "Read-only: total_budget - provisional_debits - finalized_debits" }
      - { name: compliance_risk_score, type: integer, source: computed, description: "Read-only: current value of ComplianceRiskLedger, starts at 0" }

  - name: Event
    parent: StaffingContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "Parent StaffingContract ID" }
      - { name: name, type: string, source: input, description: "Human-readable event name" }
      - { name: status, type: enum, source: system, description: "PLANNING | READY_FOR_EXECUTION | CANCELLED" }
      - { name: start_time, type: integer, source: input, description: "Event start time as Unix timestamp (seconds)" }
      - { name: end_time, type: integer, source: input, description: "Event end time as Unix timestamp (seconds)" }

  - name: Shift
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "Parent Event ID" }
      - { name: contract_id, type: string, source: system, description: "Parent StaffingContract ID" }
      - { name: role_name, type: string, source: input, description: "Role to be filled (e.g., Bartender)" }
      - { name: status, type: enum, source: system, description: "OPEN | PENDING_CONFIRMATION | FILLED | CANCELLED" }
      - { name: certification_needed, type: enum, source: input, default: "NONE", description: "FOOD_HANDLER_PERMIT | ALCOHOL_SERVICE_LICENSE | NONE" }
      - { name: start_time, type: integer, source: input, description: "Shift start time as Unix timestamp" }
      - { name: end_time, type: integer, source: input, description: "Shift end time as Unix timestamp" }
      - { name: duration_hours, type: number, source: computed, description: "Read-only: end_time - start_time (in hours)" }

  - name: StaffProfile
    parent: StaffingContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "Parent StaffingContract ID" }
      - { name: first_name, type: string, source: input, description: "Staff member's first name" }
      - { name: last_name, type: string, source: input, description: "Staff member's last name" }
      - { name: base_pay_rate_per_hour, type: number, source: input, description: "Standard hourly pay rate" }
      - { name: certifications, type: array, source: system, description: "List of certifications, each with id, name, issued_date, expiry_date" }

  - name: Assignment
    parent: StaffingContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "Parent StaffingContract ID" }
      - { name: shift_id, type: string, source: input, description: "Associated Shift ID" }
      - { name: staff_profile_id, type: string, source: input, description: "Associated StaffProfile ID" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | CONFIRMED | PAID | DECLINED | CANCELLED" }
      - { name: override_risk_check, type: boolean, source: input, default: false, description: "Whether to bypass compliance risk threshold check" }
      - { name: risk_override_penalty_applied, type: boolean, source: computed, description: "True if override penalty (+10 points) was applied" }
      - { name: is_overtime_eligible, type: boolean, source: computed, description: "True if any portion is paid at overtime rate" }
      - { name: provisional_cost, type: number, source: computed, description: "Estimated cost including potential overtime" }
      - { name: final_payout, type: number, source: computed, description: "Final cost calculated during payroll finalization" }

  - name: ConflictPairing
    parent: StaffingContract
    common_fields: false  # has id + created_at only
    fields:
      - { name: contract_id, type: string, source: system, description: "Parent StaffingContract ID" }
      - { name: staff_profile_id_1, type: string, source: input, description: "First staff member" }
      - { name: staff_profile_id_2, type: string, source: input, description: "Second staff member" }
      - { name: reason, type: string, source: input, required: false, description: "Optional explanation for the conflict" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: StaffingContract
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: POST /staffing-contracts/{contractId}/activate
        actor: Any
        preconditions:
          - "Contract must be in PLANNING state (ERR_CONTRACT_NOT_IN_PLANNING)"
        side_effects: []

      - from: ACTIVE
        to: PAYROLL_PENDING
        trigger: POST /staffing-contracts/{contractId}/initiate-payroll
        actor: StaffingCoordinator
        preconditions:
          - "Contract must be ACTIVE"
          - "All assignments must be in terminal status: CONFIRMED, CANCELLED, or DECLINED (ERR_UNRESOLVED_ASSIGNMENTS_EXIST)"
        side_effects: []

      - from: PAYROLL_PENDING
        to: CLOSED
        trigger: POST /staffing-contracts/{contractId}/finalize-payroll
        actor: StaffingCoordinator
        preconditions:
          - "Contract must be PAYROLL_PENDING (ERR_CONTRACT_NOT_READY_FOR_PAYROLL)"
          - "Total final_payouts must not exceed total_budget (ERR_PAYROLL_EXCEEDS_BUDGET)"
        side_effects:
          - "All CONFIRMED assignments: compute final_payout → PAID"
          - "Provisional ledger cleared"
          - "compliance_risk_score reconciled based on final overtime state"
          - "budget_balance finalized"

  - entity: Event
    initial_state: PLANNING
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNING
        to: READY_FOR_EXECUTION
        trigger: PUT /staffing-contracts/{contractId}/events/{eventId}
        actor: StaffingCoordinator
        preconditions:
          - "Event Readiness Invariant: at least one shift, all shifts FILLED"
          - "compliance_risk_score < 15 (ERR_SHIFTS_NOT_FILLED if shifts not ready)"
        side_effects: []

      - from: READY_FOR_EXECUTION
        to: PLANNING
        trigger: "system (automatic when readiness invariant no longer met, e.g., assignment cancelled)"
        actor: system
        preconditions:
          - "Event no longer meets Event Readiness Invariant"
        side_effects: []

      - from: PLANNING
        to: CANCELLED
        trigger: PUT /staffing-contracts/{contractId}/events/{eventId}
        actor: StaffingCoordinator
        preconditions: []
        side_effects:
          - "All associated Shifts → CANCELLED"
          - "All associated non-terminal Assignments → CANCELLED with ledger reversals"

      - from: READY_FOR_EXECUTION
        to: CANCELLED
        trigger: PUT /staffing-contracts/{contractId}/events/{eventId}
        actor: StaffingCoordinator
        preconditions: []
        side_effects:
          - "Same cascade as PLANNING → CANCELLED"

  - entity: Shift
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: PENDING_CONFIRMATION
        trigger: "system (automatic when assignment proposed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING_CONFIRMATION
        to: FILLED
        trigger: "system (automatic when assignment confirmed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING_CONFIRMATION
        to: OPEN
        trigger: "system (automatic when assignment cancelled/declined)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FILLED
        to: OPEN
        trigger: "system (automatic when confirmed assignment cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CANCELLED
        trigger: "system (cascade from event cancellation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING_CONFIRMATION
        to: CANCELLED
        trigger: "system (cascade from event cancellation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FILLED
        to: CANCELLED
        trigger: "system (cascade from event cancellation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Assignment
    initial_state: PROPOSED
    terminal_states: [PAID, DECLINED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: POST /staffing-contracts/{contractId}/assignments/{assignmentId}/accept
        actor: StaffMember
        preconditions:
          - "Assignment must be PROPOSED (ERR_ASSIGNMENT_NOT_PROPOSED)"
        side_effects: []

      - from: PROPOSED
        to: DECLINED
        trigger: POST /staffing-contracts/{contractId}/assignments/{assignmentId}/decline
        actor: StaffMember
        preconditions:
          - "Assignment must be PROPOSED (ERR_ASSIGNMENT_NOT_PROPOSED)"
        side_effects:
          - "Shift reverts to OPEN"
          - "Provisional cost reversed from BudgetLedger"
          - "Compliance risk score penalties reversed"

      - from: ACCEPTED
        to: CONFIRMED
        trigger: POST /staffing-contracts/{contractId}/assignments/{assignmentId}/confirm
        actor: StaffingCoordinator
        preconditions:
          - "Assignment must be ACCEPTED (ERR_ASSIGNMENT_NOT_ACCEPTED)"
          - "Shift must be PENDING_CONFIRMATION (ERR_SHIFT_NOT_PENDING_CONFIRMATION)"
          - "Rest period re-check passes"
          - "Recalculated provisional_cost passes Fiscal Integrity Invariant"
        side_effects:
          - "Shift → FILLED"
          - "provisional_cost and is_overtime_eligible recalculated"
          - "BudgetLedger and ComplianceRiskLedger adjusted for any cost/overtime changes"

      - from: PROPOSED
        to: CANCELLED
        trigger: POST /staffing-contracts/{contractId}/assignments/{assignmentId}/cancel
        actor: StaffingCoordinator
        preconditions:
          - "Assignment must not be PAID, DECLINED, or CANCELLED (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects:
          - "Shift reverts to OPEN"
          - "Provisional cost reversed from BudgetLedger"
          - "All compliance_risk_score points reversed (overtime + override penalty)"
          - "If parent Event was READY_FOR_EXECUTION, revert to PLANNING"

      - from: ACCEPTED
        to: CANCELLED
        trigger: POST /staffing-contracts/{contractId}/assignments/{assignmentId}/cancel
        actor: StaffingCoordinator
        preconditions:
          - "Same as PROPOSED → CANCELLED"
        side_effects:
          - "Same as PROPOSED → CANCELLED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /staffing-contracts/{contractId}/assignments/{assignmentId}/cancel
        actor: StaffingCoordinator
        preconditions:
          - "Same as PROPOSED → CANCELLED"
        side_effects:
          - "Shift reverts to OPEN"
          - "Provisional cost reversed from BudgetLedger"
          - "All compliance_risk_score points reversed"
          - "If parent Event was READY_FOR_EXECUTION, revert to PLANNING"

      - from: CONFIRMED
        to: PAID
        trigger: "system (automatic during finalize-payroll)"
        actor: system
        preconditions: []
        side_effects:
          - "final_payout calculated (chronological, with overtime at 1.5x for hours > 40)"
          - "Provisional cost cleared, final_payout added to finalized_debits"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_cost
    trigger: "assignment proposal and confirmation"
    algorithm: overtime_calculation
    formula: |
      1. Aggregate total hours for the staff member across relevant assignments:
         - At proposal: assignments in PROPOSED, ACCEPTED, CONFIRMED status
         - At confirmation: assignments in ACCEPTED, CONFIRMED status plus current
      2. Determine how many hours of THIS assignment cross the 40-hour threshold
      3. Hours within threshold: base_pay_rate_per_hour * hours
         Hours beyond threshold: base_pay_rate_per_hour * 1.5 * overtime_hours
      4. provisional_cost = normal_cost + overtime_cost
    constants:
      OVERTIME_THRESHOLD: 40  # hours
      OVERTIME_MULTIPLIER: 1.5
    precision: "2 decimal places"
    note: "Recalculated at confirmation; may differ from proposal estimate"

  - name: is_overtime_eligible
    trigger: "Calculated in sync with provisional_cost"
    algorithm: threshold
    formula: |
      If any portion of the assignment's hours would be paid at overtime rate:
        is_overtime_eligible = true
      else:
        is_overtime_eligible = false
    constants:
      OVERTIME_THRESHOLD: 40

  - name: final_payout
    trigger: "payroll finalization"
    algorithm: chronological
    formula: |
      1. Collect all CONFIRMED assignments for the staff member
      2. Sort by shift.start_time ascending, then assignment.created_at ascending
      3. running_total_hours = 0
      4. For each assignment in sorted order:
           running_total_hours += duration_hours
           if running_total_hours > OVERTIME_THRESHOLD:
             overtime_hours = min(duration_hours, running_total_hours - OVERTIME_THRESHOLD)
             normal_hours = duration_hours - overtime_hours
             final_payout = normal_hours * rate + overtime_hours * rate * OVERTIME_MULTIPLIER
           else:
             final_payout = duration_hours * rate
    constants:
      OVERTIME_THRESHOLD: 40
      OVERTIME_MULTIPLIER: 1.5
    precision: "2 decimal places"

  - name: budget_balance_update
    trigger: "assignment propose, confirm, cancel, decline, finalize"
    algorithm: aggregation
    formula: |
      budget_balance = total_budget - provisional_debits - finalized_debits
      Proposal: provisional_debits += provisional_cost
      Confirmation: provisional_debits adjusted (old cost removed, new cost added)
      Cancel/Decline: provisional_debits -= provisional_cost
      Finalize: finalized_debits += final_payout, provisional cleared

  - name: compliance_risk_score
    trigger: "assignment propose, accept, confirm, cancel, decline, finalize"
    algorithm: aggregation
    formula: |
      Proposal:
        if is_overtime_eligible: score += 5
        if score would reach >= 20 and not override_risk_check: reject ERR_RISK_THRESHOLD_EXCEEDED
        if override_risk_check used to bypass: score += 10 (override penalty)
      Cancel/Decline: reverse all points (overtime + override)
      Confirmation: recalculate overtime; adjust +/- 5 if status changed
      Finalize: reconcile based on actual overtime state
      Floor: score never goes below 0
    constants:
      OVERTIME_PENALTY: 5
      OVERRIDE_PENALTY: 10
      THRESHOLD: 20  # blocks new assignments at this threshold unless override
    note: "Financial constraints evaluated before risk constraints at proposal"

  - name: rest_period_check
    trigger: "assignment proposal and confirmation"
    algorithm: time_gap
    formula: |
      For the staff member within the same contract:
        gap = |shift_A.end_time - shift_B.start_time| or |shift_B.end_time - shift_A.start_time|
        if gap < REST_PERIOD: reject ERR_REST_PERIOD_VIOLATION
      At proposal: check against PROPOSED, ACCEPTED, CONFIRMED, PAID assignments
      At confirmation: check against ACCEPTED, CONFIRMED, PAID assignments
    constants:
      REST_PERIOD: 28800  # 8 hours in seconds

  - name: interpersonal_conflict_check
    trigger: "assignment proposal"
    algorithm: pairing
    formula: |
      If a ConflictPairing exists for the staff member and another staff member:
        and the other staff member has an assignment (PROPOSED, ACCEPTED, CONFIRMED)
        for a shift in the same Event:
        reject ERR_INTERPERSONAL_CONFLICT

  - name: fiscal_integrity_invariant
    trigger: "assignment propose, confirm, finalize"
    algorithm: constraint
    formula: |
      (provisional_debits + finalized_debits) <= total_budget
      Violation results in ERR_INSUFFICIENT_BUDGET

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: existence
    check: "Resource IDs in path must exist and belong to the correct parent"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_CONTRACT_NOT_FOUND, ERR_EVENT_NOT_FOUND, ERR_SHIFT_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_CONFLICT_PAIRING_NOT_FOUND)"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 3
    category: state
    check: "Parent contract must be in ACTIVE state for write operations"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "Create events, shifts, staff profiles, assignments, conflict pairings, certifications"

  - priority: 4
    category: state
    check: "Target resource must be in correct state for the operation"
    error_id: "varies (ERR_SHIFT_NOT_OPEN, ERR_ASSIGNMENT_NOT_PROPOSED, etc.)"
    http_status: 409
    applies_to: state transition endpoints

  - priority: 5
    category: business_safety
    check: "Certification matching: staff must hold valid, non-expired certification matching shift requirement"
    error_id: ERR_CERTIFICATION_MISSING
    http_status: 400
    applies_to: "POST /assignments (proposal)"

  - priority: 6
    category: business_safety
    check: "Rest period: minimum 8 hours between shifts for same staff member"
    error_id: ERR_REST_PERIOD_VIOLATION
    http_status: 409
    applies_to: "POST /assignments (proposal), POST /assignments/{id}/confirm"

  - priority: 7
    category: business_safety
    check: "Interpersonal conflict: conflicted staff cannot work same event"
    error_id: ERR_INTERPERSONAL_CONFLICT
    http_status: 409
    applies_to: "POST /assignments (proposal)"

  - priority: 8
    category: business_fiscal
    check: "Fiscal Integrity Invariant: (provisional_debits + finalized_debits) <= total_budget"
    error_id: ERR_INSUFFICIENT_BUDGET
    http_status: 402
    applies_to: "POST /assignments (proposal), POST /assignments/{id}/confirm"

  - priority: 9
    category: business_risk
    check: "Compliance risk threshold: score must not reach 20 unless override"
    error_id: ERR_RISK_THRESHOLD_EXCEEDED
    http_status: 403
    applies_to: "POST /assignments (proposal)"

# =============================================================================
# Table 5: API Endpoint Table (27 endpoints)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- StaffingContract ---
  - method: POST
    path: "/staffing-contracts"
    description: "Create a new Staffing Contract"
    roles: [Any]
    code: 201
    input: [client_name, total_budget]
    output: StaffingContract
    side_effects: ["budget_balance initialized to total_budget, compliance_risk_score to 0, status to PLANNING"]

  - method: GET
    path: "/staffing-contracts"
    description: "List all Staffing Contracts"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "StaffingContract[]"
    side_effects: []

  - method: GET
    path: "/staffing-contracts/{contractId}"
    description: "Get a specific Staffing Contract"
    roles: [Any]
    code: 200
    input: []
    output: StaffingContract
    side_effects: []

  - method: POST
    path: "/staffing-contracts/{contractId}/activate"
    description: "Activate a contract"
    roles: [Any]
    code: 200
    input: []
    output: StaffingContract
    side_effects: ["status → ACTIVE"]

  # --- Event ---
  - method: POST
    path: "/staffing-contracts/{contractId}/events"
    description: "Create a new Event within a Contract"
    roles: [StaffingCoordinator]
    code: 201
    input: [name, start_time, end_time]
    output: Event
    side_effects: []

  - method: GET
    path: "/staffing-contracts/{contractId}/events"
    description: "List Events for a Contract"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "Event[]"
    side_effects: []

  - method: GET
    path: "/staffing-contracts/{contractId}/events/{eventId}"
    description: "Get a specific Event"
    roles: [Any]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: PUT
    path: "/staffing-contracts/{contractId}/events/{eventId}"
    description: "Update an Event's status"
    roles: [StaffingCoordinator]
    code: 200
    input: [status]
    output: Event
    side_effects:
      - "PLANNING → READY_FOR_EXECUTION (requires Event Readiness Invariant)"
      - "PLANNING/READY_FOR_EXECUTION → CANCELLED (cascading cancellation)"

  # --- Shift ---
  - method: POST
    path: "/staffing-contracts/{contractId}/events/{eventId}/shifts"
    description: "Create a new Shift for an Event"
    roles: [StaffingCoordinator]
    code: 201
    input: [role_name, certification_needed, start_time, end_time]
    output: Shift
    side_effects: ["duration_hours auto-calculated"]

  - method: GET
    path: "/staffing-contracts/{contractId}/events/{eventId}/shifts"
    description: "List Shifts for an Event"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "Shift[]"
    side_effects: []

  - method: GET
    path: "/staffing-contracts/{contractId}/events/{eventId}/shifts/{shiftId}"
    description: "Get a specific Shift"
    roles: [Any]
    code: 200
    input: []
    output: Shift
    side_effects: []

  # --- StaffProfile ---
  - method: POST
    path: "/staffing-contracts/{contractId}/staff-profiles"
    description: "Create a new Staff Profile"
    roles: [StaffingCoordinator]
    code: 201
    input: [first_name, last_name, base_pay_rate_per_hour]
    output: StaffProfile
    side_effects: ["certifications initialized to empty array"]

  - method: GET
    path: "/staffing-contracts/{contractId}/staff-profiles"
    description: "List Staff Profiles for a Contract"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "StaffProfile[]"
    side_effects: []

  - method: GET
    path: "/staffing-contracts/{contractId}/staff-profiles/{staffProfileId}"
    description: "Get a specific Staff Profile"
    roles: [Any]
    code: 200
    input: []
    output: StaffProfile
    side_effects: []

  - method: POST
    path: "/staffing-contracts/{contractId}/staff-profiles/{staffProfileId}/certifications"
    description: "Add a certification to a Staff Profile"
    roles: [StaffingCoordinator]
    code: 201
    input: ["name (FOOD_HANDLER_PERMIT | ALCOHOL_SERVICE_LICENSE), issued_date, expiry_date"]
    output: StaffProfile
    side_effects: ["Certification added to certifications array"]

  # --- Assignment ---
  - method: POST
    path: "/staffing-contracts/{contractId}/assignments"
    description: "Propose a new Assignment"
    roles: [AccountManager]
    code: 201
    input: [shift_id, staff_profile_id, "override_risk_check?"]
    output: Assignment
    side_effects:
      - "Calculate provisional_cost and is_overtime_eligible"
      - "Debit provisional_cost to BudgetLedger"
      - "Update compliance_risk_score (overtime penalty + possible override penalty)"
      - "Shift → PENDING_CONFIRMATION"
      - "Full validation chain: certification, rest period, conflict, budget, risk"

  - method: GET
    path: "/staffing-contracts/{contractId}/assignments"
    description: "List all Assignments for a Contract"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/staffing-contracts/{contractId}/assignments/{assignmentId}"
    description: "Get a specific Assignment"
    roles: [Any]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/staffing-contracts/{contractId}/assignments/{assignmentId}/accept"
    description: "Staff member accepts a proposed assignment"
    roles: [StaffMember]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status → ACCEPTED"]

  - method: POST
    path: "/staffing-contracts/{contractId}/assignments/{assignmentId}/decline"
    description: "Staff member declines a proposed assignment"
    roles: [StaffMember]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "status → DECLINED"
      - "Shift → OPEN"
      - "Provisional cost reversed, risk score penalties reversed"

  - method: POST
    path: "/staffing-contracts/{contractId}/assignments/{assignmentId}/confirm"
    description: "Coordinator confirms an accepted assignment"
    roles: [StaffingCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "status → CONFIRMED"
      - "Shift → FILLED"
      - "provisional_cost and is_overtime_eligible recalculated"
      - "BudgetLedger and ComplianceRiskLedger adjusted"
      - "Rest period re-checked"

  - method: POST
    path: "/staffing-contracts/{contractId}/assignments/{assignmentId}/cancel"
    description: "Cancel an assignment"
    roles: [StaffingCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "status → CANCELLED"
      - "Shift → OPEN"
      - "Provisional cost reversed"
      - "All compliance_risk_score points reversed (overtime + override)"
      - "If parent Event was READY_FOR_EXECUTION, revert to PLANNING"

  # --- ConflictPairing ---
  - method: POST
    path: "/staffing-contracts/{contractId}/conflict-pairings"
    description: "Create a Conflict Pairing"
    roles: [StaffingCoordinator]
    code: 201
    input: [staff_profile_id_1, staff_profile_id_2, "reason?"]
    output: ConflictPairing
    side_effects: []

  - method: GET
    path: "/staffing-contracts/{contractId}/conflict-pairings"
    description: "List Conflict Pairings for a Contract"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "ConflictPairing[]"
    side_effects: []

  - method: GET
    path: "/staffing-contracts/{contractId}/conflict-pairings/{conflictPairingId}"
    description: "Get a specific Conflict Pairing"
    roles: [Any]
    code: 200
    input: []
    output: ConflictPairing
    side_effects: []

  # --- Contract Lifecycle ---
  - method: POST
    path: "/staffing-contracts/{contractId}/initiate-payroll"
    description: "Move contract to payroll pending state"
    roles: [StaffingCoordinator]
    code: 200
    input: []
    output: StaffingContract
    side_effects:
      - "status → PAYROLL_PENDING"
      - "Precondition: all assignments in terminal state"

  - method: POST
    path: "/staffing-contracts/{contractId}/finalize-payroll"
    description: "Finalize payroll and close the contract"
    roles: [StaffingCoordinator]
    code: 200
    input: []
    output: StaffingContract
    side_effects:
      - "status → CLOSED"
      - "All CONFIRMED assignments: calculate final_payout chronologically → PAID"
      - "compliance_risk_score reconciled"
      - "Provisional ledger cleared"
      - "Budget validated: total final_payouts <= total_budget"

# =============================================================================
# Table 6: Error Code Catalogue (26 error codes)
# =============================================================================
errors:
  # --- Authentication ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  # --- Resource Not Found ---
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "Staffing contract with given contractId does not exist"

  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "Event with given eventId does not exist in the contract"

  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "Shift with given shiftId does not exist"

  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "Staff profile with given staffProfileId does not exist in the contract"

  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "Assignment with given assignmentId does not exist in the contract"

  - id: ERR_CONFLICT_PAIRING_NOT_FOUND
    http: 404
    condition: "Conflict pairing with given conflictPairingId does not exist"

  # --- State Constraints ---
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "Operation requires contract to be in ACTIVE state"

  - id: ERR_CONTRACT_NOT_IN_PLANNING
    http: 409
    condition: "Operation requires contract to be in PLANNING state"

  - id: ERR_CONTRACT_NOT_READY_FOR_PAYROLL
    http: 409
    condition: "finalize-payroll requires contract to be in PAYROLL_PENDING state"

  - id: ERR_SHIFT_NOT_OPEN
    http: 409
    condition: "Shift must be in OPEN state to accept assignment proposal"

  - id: ERR_SHIFT_NOT_PENDING_CONFIRMATION
    http: 409
    condition: "Shift must be PENDING_CONFIRMATION for assignment confirmation"

  - id: ERR_SHIFTS_NOT_FILLED
    http: 409
    condition: "Not all shifts are FILLED when transitioning event to READY_FOR_EXECUTION"

  - id: ERR_ILLEGAL_EVENT_STATE_TRANSITION
    http: 409
    condition: "Event state transition is invalid"

  - id: ERR_INVALID_SHIFT_TIMES
    http: 400
    condition: "Shift time parameters are invalid (end_time not after start_time)"

  # --- Assignment State ---
  - id: ERR_ASSIGNMENT_NOT_PROPOSED
    http: 409
    condition: "accept/decline requires assignment to be in PROPOSED state"

  - id: ERR_ASSIGNMENT_NOT_ACCEPTED
    http: 409
    condition: "confirm requires assignment to be in ACCEPTED state"

  - id: ERR_ASSIGNMENT_NOT_CANCELLABLE
    http: 409
    condition: "cancel requires assignment to not be in PAID, DECLINED, or CANCELLED state"

  - id: ERR_UNRESOLVED_ASSIGNMENTS_EXIST
    http: 409
    condition: "Unresolved assignments exist when initiating payroll"

  # --- Business Validation ---
  - id: ERR_CERTIFICATION_MISSING
    http: 400
    condition: "Staff member does not hold required valid, non-expired certification"

  - id: ERR_REST_PERIOD_VIOLATION
    http: 409
    condition: "Insufficient rest period (< 8 hours) between shifts for staff member"

  - id: ERR_INTERPERSONAL_CONFLICT
    http: 409
    condition: "Staff member has conflict pairing with another assigned staff in the same event"

  - id: ERR_SELF_CONFLICT_PAIRING
    http: 400
    condition: "Cannot pair a staff member with themselves"

  # --- Financial & Risk ---
  - id: ERR_INSUFFICIENT_BUDGET
    http: 402
    condition: "provisional_cost would cause (provisional_debits + finalized_debits) > total_budget"

  - id: ERR_PAYROLL_EXCEEDS_BUDGET
    http: 402
    condition: "Total final_payouts exceed total_budget during payroll finalization"

  - id: ERR_RISK_THRESHOLD_EXCEEDED
    http: 403
    condition: "Assignment would cause compliance_risk_score to reach/exceed 20 and override not set"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: AccountManager
    description: "Responsible for proposing staff assignments"
    exclusive_operations:
      - "POST /staffing-contracts/{contractId}/assignments — Propose assignment"

  - name: StaffingCoordinator
    description: "Responsible for event management, shift creation, staff profiles, assignment workflow, and payroll"
    exclusive_operations:
      - "POST .../events — Create event"
      - "PUT .../events/{id} — Update event status"
      - "POST .../shifts — Create shift"
      - "POST .../staff-profiles — Create staff profile"
      - "POST .../staff-profiles/{id}/certifications — Add certification"
      - "POST .../assignments/{id}/confirm — Confirm assignment"
      - "POST .../assignments/{id}/cancel — Cancel assignment"
      - "POST .../conflict-pairings — Create conflict pairing"
      - "POST .../initiate-payroll — Initiate payroll"
      - "POST .../finalize-payroll — Finalize payroll"

  - name: StaffMember
    description: "Responsible for accepting or declining proposed assignments"
    exclusive_operations:
      - "POST .../assignments/{id}/accept — Accept assignment"
      - "POST .../assignments/{id}/decline — Decline assignment"

  - name: Any
    description: "Shared across all roles"
    shared_operations:
      - "POST /staffing-contracts — Create contract"
      - "GET /staffing-contracts — List contracts"
      - "GET /staffing-contracts/{contractId} — Get contract"
      - "POST .../activate — Activate contract"
      - "GET .../events — List events"
      - "GET .../events/{id} — Get event"
      - "GET .../shifts — List shifts"
      - "GET .../shifts/{id} — Get shift"
      - "GET .../staff-profiles — List staff profiles"
      - "GET .../staff-profiles/{id} — Get staff profile"
      - "GET .../assignments — List assignments"
      - "GET .../assignments/{id} — Get assignment"
      - "GET .../conflict-pairings — List conflict pairings"
      - "GET .../conflict-pairings/{id} — Get conflict pairing"
