  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_double_book_touching_intervals_allowed
        grounds:
          - validations[priority=11]
          - state_machines.Appointment.REQUESTED_to_CONFIRMED
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
        distinguishing_aspect: "Technician overlap uses pure half-open [start,end) arithmetic with NO buffer: a second appointment starting exactly at the first's end_at touches but does not overlap (allowed), whereas a 1-minute-earlier start overlaps and is rejected ERR_TECHNICIAN_DOUBLE_BOOKED."
        test_recipe:
          setup:
            - "Clock 2026-04-15T12:00:00Z. One technician, two distinct stations (so station buffer is not the binding constraint). Service duration 60 min."
            - "First appointment 13:00-14:00 CONFIRMED. Second appointment for same tech tested at 14:00 start (touching, OK) and 13:59 start (overlap, reject)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-TO1a", requires_autoclave: false }
              as: SalonManager
              captures: { st1: $.data.id }
            - call: "POST /stations"
              payload: { name: "Mani-TO1b", requires_autoclave: false }
              as: SalonManager
              captures: { st2: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Mani TO1", category: "MANICURE", duration_minutes: 60, base_price_cents: 4000, loyalty_points_award: 0, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech TO1", license_number: "LIC-TO1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st1}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client TO1", email: "cto1@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st1}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-04-15T13:00:00Z" }
              as: FrontDesk
              captures: { a1: $.data.id }
            - call: "POST /appointments/${a1}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st2}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-04-15T13:59:00Z" }
              as: FrontDesk
              captures: { a_overlap: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st2}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-04-15T14:00:00Z" }
              as: FrontDesk
              captures: { a_touch: $.data.id }
          trigger:
            - call: "POST /appointments/${a_overlap}/confirm"
              payload: {}
              as: FrontDesk
              captures: { err_ov: $.data.error_id }
            - call: "POST /appointments/${a_touch}/confirm"
              payload: {}
              as: FrontDesk
              captures: { bstat: $.data.booking_status }
          assert:
            - "confirming the 13:59 appointment returns error_id == ERR_TECHNICIAN_DOUBLE_BOOKED"
            - "confirming the 14:00 (touching) appointment succeeds: Appointment.${a_touch}.booking_status == CONFIRMED"

      - name: station_turnover_buffer_blocks_adjacent
        grounds:
          - validations[priority=12]
          - state_machines.Appointment.REQUESTED_to_CONFIRMED
          - errors[ERR_STATION_TURNOVER_CONFLICT]
        distinguishing_aspect: "Station overlap uses a DIFFERENT interval geometry: the leading edge is expanded by STATION_TURNOVER_MINUTES, so an appointment starting exactly at the prior's end_at still overlaps the buffer and is rejected ERR_STATION_TURNOVER_CONFLICT — unlike the technician's zero-buffer touching rule. Different resource entity (Station), different interval semantics."
        test_recipe:
          setup:
            - "Clock 2026-04-16T12:00:00Z. Two distinct technicians (so tech overlap is not binding), one station. Service 60 min."
            - "First appt 13:00-14:00 on the station CONFIRMED. Second appt at 14:00 start on same station — within turnover buffer, rejected. Then 14:10 start succeeds."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-16T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Pedi-TO2", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Pedi TO2", category: "PEDICURE", duration_minutes: 60, base_price_cents: 5000, loyalty_points_award: 0, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech TO2a", license_number: "LIC-TO2a", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t1: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech TO2b", license_number: "LIC-TO2b", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t2: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client TO2", email: "cto2@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t1}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-04-16T13:00:00Z" }
              as: FrontDesk
              captures: { a1: $.data.id }
            - call: "POST /appointments/${a1}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t2}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-04-16T14:00:00Z" }
              as: FrontDesk
              captures: { a_buf: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t2}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-04-16T14:10:00Z" }
              as: FrontDesk
              captures: { a_ok: $.data.id }
          trigger:
            - call: "POST /appointments/${a_buf}/confirm"
              payload: {}
              as: FrontDesk
              captures: { err_buf: $.data.error_id }
            - call: "POST /appointments/${a_ok}/confirm"
              payload: {}
              as: FrontDesk
              captures: { bstat: $.data.booking_status }
          assert:
            - "confirming the 14:00 appointment returns error_id == ERR_STATION_TURNOVER_CONFLICT (within 10-min buffer)"
            - "confirming the 14:10 appointment succeeds: Appointment.${a_ok}.booking_status == CONFIRMED"

  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: giftcard_balance_conserved_on_draw_and_refund
        grounds:
          - state_machines.Appointment.IN_SERVICE_to_COMPLETED
          - state_machines.GiftCard.DEPLETED_to_ACTIVE
          - calculations.checkout_settlement
          - entities.GiftCard.fields.balance_cents
        distinguishing_aspect: "Conserved quantity = GiftCard.balance_cents: a checkout draw of D cents followed by the compensating refund-settled leaves balance_cents exactly equal to its pre-checkout value (4500 -> 0 -> 4500); invariant formula balance_after_refund == initial_balance_cents."
        test_recipe:
          setup:
            - "Clock 2026-04-20T12:00:00Z. Gift card 4500c, gel manicure 4500c. Appointment IN_SERVICE, gift card supplied at checkout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-CI1", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Gel Mani CI1", category: "MANICURE", duration_minutes: 45, base_price_cents: 4500, loyalty_points_award: 0, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech CI1", license_number: "LIC-CI1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client CI1", email: "cci1@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /gift-cards"
              payload: { code: "GC-CI-1", initial_balance_cents: 4500 }
              as: FrontDesk
              captures: { gc: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-04-20T13:00:00Z" }
              as: FrontDesk
              captures: { a: $.data.id }
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${t}"
              captures: { a_v: $.data.version }
            - call: "POST /appointments/${a}/checkout"
              payload: { expected_appointment_version: "${a_v}", gift_card_id: "${gc}" }
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${a}/refund-settled"
              payload: {}
              as: SalonManager
            - call: "GET /gift-cards/${gc}"
              payload: {}
              as: FrontDesk
              captures: { bal: $.data.balance_cents }
          assert:
            - "GiftCard.${gc}.balance_cents == 4500 (equals initial_balance_cents: draw fully compensated)"
            - "GiftCard.${gc}.status == ACTIVE"

      - name: loyalty_points_conserved_on_redeem_and_refund
        grounds:
          - state_machines.Appointment.IN_SERVICE_to_COMPLETED
          - calculations.checkout_settlement
          - entities.Client.fields.loyalty_points_balance
        distinguishing_aspect: "Different conserved quantity = Client.loyalty_points_balance: checkout consumes points_consumed then awards loyalty_points_award; refund-settled reverses both, restoring loyalty_points_balance to its pre-checkout value (50 redeemed of 60, +0 award -> 10; refund restores to 60)."
        test_recipe:
          setup:
            - "Clock 2026-04-21T12:00:00Z. Client injected loyalty_points_balance=60. Service 4500c (award 0). Appointment IN_SERVICE, redeem 50 points at checkout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-21T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-CI2", requires_autoclave: false }
