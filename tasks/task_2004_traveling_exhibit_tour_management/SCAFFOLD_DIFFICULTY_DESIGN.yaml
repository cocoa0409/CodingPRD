              payload: { crate_label: "CRATE-01", contents_value_cents: 4000000 }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Castle Hall", city: "Boston", climate_controlled: true, max_gallery_sqm: 1000, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tour_v: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-05T00:00:00Z", close_date: "2026-10-01T00:00:00Z", teardown_end: "2026-10-07T00:00:00Z", projected_attendance: 5000, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop1_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-15T00:00:00Z", open_date: "2026-09-20T00:00:00Z", close_date: "2026-10-20T00:00:00Z", teardown_end: "2026-10-25T00:00:00Z", projected_attendance: 3000, expected_tour_version: "${tour_v} - 1" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION  # priority 4 state beats priority 8 business_temporal"

      - name: safety_beats_fiscal_on_claim_approve
        grounds:
          - validations[priority=5]
          - validations[priority=16]
        distinguishing_aspect: |
          Pair (state, business_fiscal): APPROVING a claim that is still FILED
