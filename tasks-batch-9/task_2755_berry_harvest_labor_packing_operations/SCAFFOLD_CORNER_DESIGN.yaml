            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-04", variety: "STRAWBERRY", grade: "A", clamshell_count: 50, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-04T09:00:00Z", field_pulp_temp_f: 68.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
