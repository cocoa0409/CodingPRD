              payload: { project_id: "${proj}", test_type: "CAPACITY", scheduled_at: "2026-08-11T09:00:00Z", expected_project_version: "${pv}" }
              as: UtilityCoordinator
              captures: { e7: $.data.error_id }
            - call: "POST /solar/projects/${proj}/payroll-weeks"
              payload: { week_start_date: "2026-08-10" }
              as: OwnerEngineer
              captures: { e8: $.data.error_id }
            - call: "GET /solar/projects"
              payload: { limit: 10, offset: 0 }
              as: EpcProjectManager
              captures: { n: $.meta.total_count }
          assert:
            - "${e1} through ${e8} are all ERR_FORBIDDEN_ROLE with HTTP 403"
            - "${e3} and ${e5} are 403 rather than 404 even though their path ids do not exist — the role check sits at priority 2 and the existence check at priority 5"
            - "${n} == 1 — only the setup project exists, so none of the eight refused writes created anything"
            - "Project.${proj}.version == ${pv} still — no refused write bumped the version"

      - name: shared_read_operations_are_open_to_all_eight_roles
        claim_type: shared_operations
        grounds:
          - roles
          - endpoints[GET /solar/projects/{id}]
          - endpoints[GET /solar/projects]
        distinguishing_aspect: "Reads are declared shared by all eight roles, so the same project row is retrievable under every header with an identical payload — the peer model restricts writes only, and no role is scoped to a subset of the data."
        test_recipe:
          setup:
            - "One project created by the EpcProjectManager"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Shared Read", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id, pv: $.data.version }
          trigger:
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: EpcProjectManager
              captures: { r1: $.data.id, v1: $.data.version }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: CivilSuperintendent
              captures: { r2: $.data.id }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: ProcurementCoordinator
              captures: { r3: $.data.id }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: InstallationForeman
              captures: { r4: $.data.id }
            - call: "GET /solar/projects/${proj}"
