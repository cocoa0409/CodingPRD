              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
            - call: "POST /ad-groups/${ag}/keywords"
              payload: { text: "shoes", match_type: "PHRASE", max_cpc_cents: 200 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ok: $.data.id }
          assert:
            - "err == ERR_DUPLICATE_KEYWORD (normalized_text collides despite casing)"
            - "PHRASE variant with same text created (201)"

      - name: negative_keyword_blocking_canonical_query_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_NEGATIVE_KEYWORD_CONFLICT]
        distinguishing_aspect: "Adding a negative EXACT 'shoes' to an ad group that already has a positive EXACT 'shoes' would block the positive keyword's own canonical query and is rejected; a negative 'boots' is fine."
        test_recipe:
          setup: ["Clock 2026-09-01. Account with campaign, ad group, positive keyword 'shoes' EXACT."]
