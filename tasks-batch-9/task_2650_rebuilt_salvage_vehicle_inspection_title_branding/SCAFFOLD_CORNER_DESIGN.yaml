      - name: interstate_recognition_downgrade_is_accepted_but_escalation_is_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=92]
          - errors[ERR_BRAND_ESCALATION_FORBIDDEN]
          - calculations.brand_carry_forward
        distinguishing_aspect: "Priority 92 compares BRAND_SEVERITY of the mapped brand against the title's own severity: mapping a SALVAGE title (30) to NON_REPAIRABLE (90) is refused with ERR_BRAND_ESCALATION_FORBIDDEN (422), while mapping the same title to NONE (0) is accepted, proving the rule is one-directional rather than an equality check."
        test_recipe:
          setup: ["a SALVAGE title record whose brand_severity is 30, and a PENDING recognition request from AZ opened against it under the title OCC guard"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007309", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-93009", basis_code: "GROSS_ESTIMATE", acv_cents: 1000000, repair_estimate_cents: 800000, damage_type: "COLLISION", odometer_reading_miles: 68000, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { title_id: $.data.id, title_v: $.data.version }
            - call: "POST /v1/recognition-requests"
              payload: { title_record_id: "${title_id}", requesting_state_code: "AZ", expected_title_version: "${title_v}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /v1/recognition-requests/${req_id}/decide"
              payload: { mapped_brand_code: "NON_REPAIRABLE", decision_note: "AZ proposes a non-repairable equivalent" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
            - call: "POST /v1/recognition-requests/${req_id}/decide"
              payload: { mapped_brand_code: "NONE", decision_note: "AZ recognises no equivalent brand" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "the first response status is 422 and error_id == ERR_BRAND_ESCALATION_FORBIDDEN"
            - "after the first call InterstateRecognitionRequest.${req_id}.status == PENDING and mapped_brand_code is null and outcome is null"
            - "the second response status is 200 and InterstateRecognitionRequest.${req_id}.status == DECIDED"
            - "InterstateRecognitionRequest.${req_id}.mapped_brand_code == NONE and outcome == DOWNGRADED"
            - "InterstateRecognitionRequest.${req_id}.submitted_brand_code == SALVAGE"
            - "TitleRecord.${title_id}.brand_code == SALVAGE and brand_severity == 30 and status == ACTIVE"

