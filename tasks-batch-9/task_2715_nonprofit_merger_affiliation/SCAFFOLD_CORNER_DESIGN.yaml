              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal_family: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_c}", confidentiality_tier: "RESTRICTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal_unrelated: $.data.id }
          trigger:
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal_family}", variant: "SCREENING" }
