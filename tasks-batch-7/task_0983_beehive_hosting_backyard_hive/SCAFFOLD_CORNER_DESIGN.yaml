            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-20T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/seasons/${s1}/rollover", payload: { name: "S2026-close", frost_date: "2027-10-15T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/allocations/${alloc}/distribute", payload: {}, as: PlatformOps, captures: { st: $.data.status, host_kg: $.data.host_kg } }
            - { call: "GET /api/hosts/${h}", payload: {}, as: PlatformOps, captures: { credit: $.data.honey_credit_kg } }
            - { call: "GET /api/harvests/${har}", payload: {}, as: PlatformOps, captures: { har_st: $.data.status } }
          assert:
