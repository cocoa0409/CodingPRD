      - name: actuator_margin_tier_keyed_on_rounded_required_torque
        grounds:
          - calculations.required_actuator_torque_nm
          - entities.ActuatorPackage.fields.safety_margin_pct
          - concurrency_rules[actuator-package-create-stale-unit]
        distinguishing_aspect: |
          Mode (a) — nested rounding: base 485.4 x 1.03 = 499.962 rounds to required_torque_nm 500.0, which lands
          exactly on the 500 tier edge and therefore takes margin 0.25 giving sized_torque_nm 625.0; keying the
          tier on the unrounded 499.962 would take margin 0.30 and give 650.0.
