  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: income_ratio_exact_threshold_passes
        grounds:
          - calculations.rent_to_income_ratio
          - entities.ScreeningApplication.fields.affordability_passes
        distinguishing_aspect: |
          Numeric-threshold boundary on the score endpoint: the >= comparison is inclusive, so verified
          income exactly equal to round_half_up(3.0 * 200000) = 600000 passes affordability while 599999
          fails — one cent of difference flips the recommendation from RECOMMEND_APPROVE to RECOMMEND_DENY.
        test_recipe:
          setup:
            - "Landlord with published criteria (multiplier 3.0, min credit 650); two TX applications (rent 200000, credit 700, no records): appA verified income 600000, appB verified income 599999; both in SCREENING with income verification resolved"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Bound", contact_email: "lbnd@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR1", disclosure_summary: "Standard criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { cr: "$.data.id" }
            - { call: "POST /api/criteria/${cr}/publish", payload: { expected_landlord_version: "${ll_v}" }, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann A", dob: "1990-01-01T00:00:00Z", email: "a@x.com", ssn_last4: "1111", residence_state: "TX" }
              as: Screener
              captures: { ap1: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap1}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { appA: "$.data.id" }
            - { call: "POST /api/applications/${appA}/consent", payload: {}, as: Applicant, as_user_id: "${ap1}" }
            - { call: "POST /api/applications/${appA}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${appA}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/applications/${appA}/record-searches", payload: { credit_score: 700, records: [] }, as: Screener }
            - call: "POST /api/applications/${appA}/income-verifications"
              payload: { employer_name: "Acme" }
              as: Screener
              captures: { ivA: "$.data.id" }
            - { call: "POST /api/income-verifications/${ivA}/resolve", payload: { outcome: "VERIFIED", verified_monthly_income_cents: 600000 }, as: Screener }
            - call: "POST /api/applicants"
              payload: { full_name: "Bob B", dob: "1991-01-01T00:00:00Z", email: "b@x.com", ssn_last4: "2222", residence_state: "TX" }
              as: Screener
              captures: { ap2: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap2}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { appB: "$.data.id" }
            - { call: "POST /api/applications/${appB}/consent", payload: {}, as: Applicant, as_user_id: "${ap2}" }
            - { call: "POST /api/applications/${appB}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${appB}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/applications/${appB}/record-searches", payload: { credit_score: 700, records: [] }, as: Screener }
            - call: "POST /api/applications/${appB}/income-verifications"
              payload: { employer_name: "Acme" }
              as: Screener
              captures: { ivB: "$.data.id" }
            - { call: "POST /api/income-verifications/${ivB}/resolve", payload: { outcome: "VERIFIED", verified_monthly_income_cents: 599999 }, as: Screener }
          trigger:
            - { call: "POST /api/applications/${appA}/score", payload: {}, as: Screener }
            - { call: "POST /api/applications/${appB}/score", payload: {}, as: Screener }
          assert:
