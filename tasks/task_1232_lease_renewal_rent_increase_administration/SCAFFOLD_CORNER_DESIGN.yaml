              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH: min9 == 9 and v2 == 2"
            - "second PATCH (stale version 1): err == ERR_STALE_PROPERTY_VERSION (http 412); min_term_months remains 9"

