scaffold_corner_design:
- section: entities
  instances:
  - name: rights_grant_create_returns_defaults_and_version_one
    claim_type: Creation
    grounds:
    - entities.RightsGrant
    - endpoints.POST_/rights-grants
    distinguishing_aspect: A grant created with all required inputs returns 201 with status ACTIVE (never client-supplied), version 1, and system id/created_at/updated_at; scope OUT_OF_MARKET is the only
      accepted member.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /rights-grants
        payload:
          distributor_name: StreamMax
          scope: OUT_OF_MARKET
          exclusivity: EXCLUSIVE
          effective_from: '2026-01-01T00:00:00Z'
          effective_until: '2027-06-01T00:00:00Z'
          max_commercial_occupancy_cap: 2000
        as: PlatformAdmin
        captures:
          rg_id: $.data.id
      assert:
      - response status 201 and response_type object
      - RightsGrant.${rg_id}.status == ACTIVE and version == 1
      - RightsGrant.${rg_id}.distributor_name == "StreamMax" and max_commercial_occupancy_cap == 2000
      - non-null id, created_at, updated_at on the response; meta.api_request_id present
  - name: market_get_returns_stored_row_unchanged
    claim_type: Retrieval
    grounds:
    - entities.Market
    - endpoints.GET_/markets/{id}
    distinguishing_aspect: Every Market field round-trips through GET exactly as posted, including the two-element zip_prefixes array and the home_team_codes array.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; Market NYC created.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          code: NYC
          name: New York
          zip_prefixes:
          - '100'
          - '101'
          home_team_codes:
          - NYC
        as: LeagueOps
        captures:
          m_id: $.data.id
      trigger:
      - call: GET /markets/${m_id}
        payload: {}
        as: SupportAgent
        as_user_id: sa-jane
      assert:
      - response status 200
      - Market.${m_id}.code == "NYC" and zip_prefixes == ["100", "101"] and home_team_codes == ["NYC"]
  - name: subscriptions_list_paginates_total_count_and_has_more
    claim_type: Listing
    grounds:
    - endpoints.GET_/subscriptions
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: "With three subscriptions on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the remaining row with has_more false \u2014 total_count\
      \ counts the filtered set, not the page."
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; season with BASE offer; three accounts each holding one subscription.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /rights-grants
        payload:
          distributor_name: StreamMax
          scope: OUT_OF_MARKET
          exclusivity: EXCLUSIVE
          effective_from: '2026-01-01T00:00:00Z'
          effective_until: '2027-06-01T00:00:00Z'
          max_commercial_occupancy_cap: 2000
        as: PlatformAdmin
        captures:
          rg_id: $.data.id
      - call: POST /seasons
        payload:
          rights_grant_id: ${rg_id}
          label: 2026-Regular
          regular_season_weeks: 18
          season_start_date: '2026-08-05T00:00:00Z'
          season_end_date: '2026-12-09T00:00:00Z'
        as: LeagueOps
        captures:
          season_id: $.data.id
      - call: POST /offers
        payload:
          season_id: ${season_id}
          plan_tier: BASE
          base_price_cents: 20000
          includes_multiview: false
          includes_companion: false
          valid_from: '2026-08-01T00:00:00Z'
          valid_until: '2026-12-31T00:00:00Z'
        as: PlatformAdmin
        captures:
          offer_id: $.data.id
      - call: POST /accounts/register
        payload:
          email: p1@x.com
          full_name: P One
          account_kind: RESIDENTIAL
          billing_zip: '10001'
        as: Anonymous
        captures:
          a1: $.data.id
      - call: POST /accounts/register
        payload:
          email: p2@x.com
          full_name: P Two
          account_kind: RESIDENTIAL
          billing_zip: '10001'
        as: Anonymous
        captures:
          a2: $.data.id
      - call: POST /accounts/register
        payload:
          email: p3@x.com
          full_name: P Three
          account_kind: RESIDENTIAL
          billing_zip: '10001'
        as: Anonymous
        captures:
          a3: $.data.id
      - call: POST /subscriptions
        payload:
          account_id: ${a1}
          offer_id: ${offer_id}
        as: Subscriber
        as_user_id: ${a1}
      - call: POST /subscriptions
        payload:
          account_id: ${a2}
          offer_id: ${offer_id}
        as: Subscriber
        as_user_id: ${a2}
      - call: POST /subscriptions
        payload:
          account_id: ${a3}
          offer_id: ${offer_id}
        as: Subscriber
        as_user_id: ${a3}
      trigger:
      - call: GET /subscriptions
        payload:
          limit: 2
          offset: 0
        as: PlatformAdmin
        captures:
          page1_total: $.meta.total_count
      - call: GET /subscriptions
        payload:
          limit: 2
          offset: 2
        as: PlatformAdmin
      assert:
      - page 1 returns 2 rows with meta.total_count == 3 and meta.has_more == true
      - page 2 (offset 2) returns 1 row with meta.total_count == 3 and meta.has_more == false
  - name: nonexistent_subscription_returns_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/subscriptions/{id}
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND with the error envelope shape, not a 500 or empty 200.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /subscriptions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - response status 404 with data.error_id == ERR_NOT_FOUND
      - error envelope carries meta.api_request_id and data.message
  - name: account_register_missing_required_field_rejected
    claim_type: Required Fields
    grounds:
    - entities.Account
    - validations[priority=22]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting billing_zip (a required input with no default) returns 400 ERR_INVALID_REQUEST and creates no account row.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /accounts/register
        payload:
          email: nozip@x.com
          full_name: No Zip
          account_kind: RESIDENTIAL
        as: Anonymous
        captures:
          err: $.data.error_id
      assert:
      - response status 400 with error_id == ERR_INVALID_REQUEST
      - a subsequent GET /accounts list contains zero rows
  - name: season_optional_fields_take_declared_defaults
    claim_type: Defaults
    grounds:
    - entities.Season.fields.grace_days
    - entities.Season.fields.student_discount_pct
    distinguishing_aspect: Omitting grace_days and student_discount_pct on season creation applies the declared defaults 7 and 50, not null or zero.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; one rights grant.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /rights-grants
        payload:
          distributor_name: StreamMax
          scope: OUT_OF_MARKET
          exclusivity: EXCLUSIVE
          effective_from: '2026-01-01T00:00:00Z'
          effective_until: '2027-06-01T00:00:00Z'
          max_commercial_occupancy_cap: 2000
        as: PlatformAdmin
        captures:
          rg_id: $.data.id
      trigger:
      - call: POST /seasons
        payload:
          rights_grant_id: ${rg_id}
          label: 2026-Regular
          regular_season_weeks: 18
          season_start_date: '2026-08-05T00:00:00Z'
          season_end_date: '2026-12-09T00:00:00Z'
        as: LeagueOps
        captures:
          season_id: $.data.id
      assert:
      - Season.${season_id}.grace_days == 7 and student_discount_pct == 50
  - name: account_billing_market_code_is_computed_not_client_supplied
    claim_type: Computed Fields
    grounds:
    - entities.Account.fields.billing_market_code
    - calculations.territory_determination
    distinguishing_aspect: Registering with billing_zip 75023 resolves billing_market_code DAL from the 3-digit prefix; the client cannot inject a different market and the resolved value follows the ZIP
      when billing_zip is updated.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; Markets NYC [100] and DAL [750].
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /markets
        payload:
          code: NYC
          name: New York
          zip_prefixes:
          - '100'
          home_team_codes:
          - NYC
        as: LeagueOps
      - call: POST /markets
        payload:
          code: DAL
          name: Dallas
          zip_prefixes:
          - '750'
          home_team_codes:
          - DAL
        as: LeagueOps
      - call: POST /accounts/register
        payload:
          email: mv2@x.com
          full_name: Mover
          account_kind: RESIDENTIAL
          billing_zip: '75023'
        as: Anonymous
        captures:
          acct_id: $.data.id
          m0: $.data.billing_market_code
      trigger:
      - call: PUT /accounts/${acct_id}
        payload:
          billing_zip: '10044'
        as: SupportAgent
        as_user_id: sa-jane
        captures:
          m1: $.data.billing_market_code
      assert:
      - 'after register: billing_market_code == "DAL"'
      - 'after ZIP update: billing_market_code == "NYC" (recomputed, not sticky)'
  - name: system_fields_ignore_client_input
    claim_type: System Fields
    grounds:
    - entities.RightsGrant
    distinguishing_aspect: Client-supplied id / created_at / version in the create payload are ignored; the server mints its own values.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /rights-grants
        payload:
          distributor_name: StreamMax
          scope: OUT_OF_MARKET
          exclusivity: EXCLUSIVE
          effective_from: '2026-01-01T00:00:00Z'
          effective_until: '2027-06-01T00:00:00Z'
          max_commercial_occupancy_cap: 2000
        as: PlatformAdmin
        captures:
          rg_id: $.data.id
          rg_v: $.data.version
      assert:
      - the returned id is a server-minted UUID distinct from any client value and version == 1
      - created_at == the logical clock instant 2026-09-01T00:00:00Z
  - name: invalid_enum_and_zip_shape_rejected
    claim_type: Type Constraints
    grounds:
    - validations[priority=22]
    - entities.Account.fields.account_kind
    - entities.Game.fields.week_index
    distinguishing_aspect: account_kind CORPORATE (not an enum member) and a 4-digit billing_zip both fail 400 ERR_INVALID_REQUEST; a Game with away == home team fails 422 ERR_SEASON_STRUCTURE.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; season 18 weeks; Market DAL.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /rights-grants
        payload:
          distributor_name: StreamMax
          scope: OUT_OF_MARKET
          exclusivity: EXCLUSIVE
          effective_from: '2026-01-01T00:00:00Z'
          effective_until: '2027-06-01T00:00:00Z'
          max_commercial_occupancy_cap: 2000
        as: PlatformAdmin
        captures:
          rg_id: $.data.id
      - call: POST /seasons
        payload:
          rights_grant_id: ${rg_id}
          label: 2026-Regular
          regular_season_weeks: 18
          season_start_date: '2026-08-05T00:00:00Z'
          season_end_date: '2026-12-09T00:00:00Z'
        as: LeagueOps
        captures:
          season_id: $.data.id
      - call: POST /markets
        payload:
          code: DAL
          name: Dallas
          zip_prefixes:
          - '750'
          home_team_codes:
          - DAL
        as: LeagueOps
      trigger:
      - call: POST /accounts/register
        payload:
          email: bad@x.com
          full_name: Bad Enum
          account_kind: CORPORATE
          billing_zip: '75001'
        as: Anonymous
        captures:
          err1: $.data.error_id
      - call: POST /accounts/register
        payload:
          email: bad2@x.com
          full_name: Bad Zip
          account_kind: RESIDENTIAL
          billing_zip: '7500'
        as: Anonymous
        captures:
          err2: $.data.error_id
      - call: POST /games
        payload:
          season_id: ${season_id}
          week_index: 4
          away_team_code: DAL
          home_team_code: DAL
          kickoff_at: '2026-08-30T17:00:00Z'
          home_market_code: DAL
        as: LeagueOps
        captures:
          err3: $.data.error_id
      assert:
      - invalid enum returns 400 ERR_INVALID_REQUEST
      - 4-digit ZIP returns 400 ERR_INVALID_REQUEST
      - away == home team returns 422 ERR_SEASON_STRUCTURE
  - name: payment_and_territory_check_rows_are_immutable
    claim_type: Immutability
    grounds:
    - entities.Payment
    - entities.TerritoryCheck
    distinguishing_aspect: "Payment and TerritoryCheck (common_fields false) are append-only rows: no update or delete transition exists in \xA71.2, no mutation endpoint exists in \xA71.5, and a TerritoryCheck\
      \ row's verdict/effective_market_code captured at creation re-read identically after later state changes (proof no in-place mutation occurs)."
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; account with ACTIVE paid subscription and one complaint refund (so a REFUND Payment row exists).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /rights-grants
        payload:
          distributor_name: StreamMax
          scope: OUT_OF_MARKET
          exclusivity: EXCLUSIVE
          effective_from: '2026-01-01T00:00:00Z'
          effective_until: '2027-06-01T00:00:00Z'
          max_commercial_occupancy_cap: 2000
        as: PlatformAdmin
        captures:
          rg_id: $.data.id
      - call: POST /seasons
        payload:
          rights_grant_id: ${rg_id}
          label: 2026-Regular
          regular_season_weeks: 18
          season_start_date: '2026-08-05T00:00:00Z'
          season_end_date: '2026-12-09T00:00:00Z'
        as: LeagueOps
        captures:
          season_id: $.data.id
      - call: POST /markets
        payload:
          code: DAL
          name: Dallas
          zip_prefixes:
          - '750'
          home_team_codes:
          - DAL
        as: LeagueOps
      - call: POST /week-slates
        payload:
          season_id: ${season_id}
          week_index: 4
        as: LeagueOps
      - call: POST /games
        payload:
          season_id: ${season_id}
          week_index: 4
          away_team_code: KC
          home_team_code: DAL
          kickoff_at: '2026-08-30T17:00:00Z'
          home_market_code: DAL
        as: LeagueOps
        captures:
          game_id: $.data.id
      - call: POST /offers
        payload:
          season_id: ${season_id}
          plan_tier: BASE
          base_price_cents: 20000
          includes_multiview: false
          includes_companion: false
          valid_from: '2026-08-01T00:00:00Z'
          valid_until: '2026-12-31T00:00:00Z'
        as: PlatformAdmin
        captures:
          offer_id: $.data.id
      - call: POST /accounts/register
        payload:
          email: im@x.com
          full_name: Im Mutable
          account_kind: RESIDENTIAL
          billing_zip: '75001'
        as: Anonymous
        captures:
          acct_id: $.data.id
      - call: POST /subscriptions
        payload:
          account_id: ${acct_id}
          offer_id: ${offer_id}
        as: Subscriber
        as_user_id: ${acct_id}
        captures:
          sub_id: $.data.id
      - call: POST /_payments/simulate
        payload:
          subscription_id: ${sub_id}
          outcome: SUCCEEDED
        as: PlatformAdmin
      - call: POST /territory-checks
        payload:
          account_id: ${acct_id}
          subscription_id: ${sub_id}
          game_id: ${game_id}
          device_zip: '75001'
        as: Subscriber
        as_user_id: ${acct_id}
        captures:
          tc_id: $.data.id
          verdict0: $.data.verdict
          em0: $.data.effective_market_code
      - call: POST /subscriptions/${sub_id}/cancel
        payload: {}
        as: Subscriber
        as_user_id: ${acct_id}
      trigger:
      - call: GET /territory-checks/${tc_id}
        payload: {}
        as: PlatformAdmin
        captures:
          verdict1: $.data.verdict
          em1: $.data.effective_market_code
      assert:
      - 'TerritoryCheck.${tc_id} re-read after the subscription cancel returns the identical verdict and effective_market_code captured at creation (append-only: later state changes never mutate the evidence
        row)'
      - "no PUT/PATCH/DELETE endpoint exists for TerritoryCheck or Payment anywhere in \xA71.5"
  - name: child_creation_requires_existing_parent
    claim_type: Parent Relationships
    grounds:
    - entities.Season.fields.rights_grant_id
    - entities.Subscription.fields.offer_id
    distinguishing_aspect: POST /seasons with a nonexistent rights_grant_id and POST /subscriptions with a nonexistent offer_id both fail 404 ERR_NOT_FOUND; no orphan children are created.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database with one account.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /accounts/register
        payload:
          email: orp@x.com
          full_name: Or Phan
          account_kind: RESIDENTIAL
          billing_zip: '10001'
        as: Anonymous
        captures:
          acct_id: $.data.id
      trigger:
      - call: POST /seasons
        payload:
          rights_grant_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
          label: 2026-Regular
          regular_season_weeks: 18
          season_start_date: '2026-08-05T00:00:00Z'
          season_end_date: '2026-12-09T00:00:00Z'
        as: LeagueOps
        captures:
          err1: $.data.error_id
      - call: POST /subscriptions
        payload:
          account_id: ${acct_id}
          offer_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: Subscriber
        as_user_id: ${acct_id}
        captures:
          err2: $.data.error_id
      assert:
      - both calls return 404 ERR_NOT_FOUND
      - GET /seasons and GET /subscriptions lists remain empty
- section: state_machines
