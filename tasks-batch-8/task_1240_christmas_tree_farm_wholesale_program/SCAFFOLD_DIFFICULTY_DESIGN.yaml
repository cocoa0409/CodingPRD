            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 300, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 10, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ov: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 10, expected_order_version: "${ov}" }, as: FarmManager }
            - { call: "GET /api/allocations?order_id=${ord}", payload: {}, as: FarmManager, captures: { alc: "$.data[0].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T08:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
            - { call: "POST /api/crews", payload: { season_id: "${s}", crew_code: "C-1", size: 5 }, as: FarmManager, captures: { crw: $.data.id } }
          trigger:
            - { call: "POST /api/harvest-tickets", payload: { crew_id: "${crw}", block_id: "${blk}", work_date: "2026-11-05", hours_worked: 8, lines: [ { allocation_id: "${alc}", cut_count: 5 } ] }, as: CrewLead, as_user_id: "${crw}" }
          assert:
            - "response 409 with error_id == ERR_BLOCK_NOT_HARVESTABLE (block is GROWING, not HARVESTABLE)"
            - "no ticket persisted: GET /api/harvest-tickets?crew_id=${crw} returns total_count == 0"
            - "StandBucket H_6_7 standing_count unchanged at 300"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_whole_day_double_booking
        grounds:
          - validations[priority=24]
        distinguishing_aspect: |
          Interval semantics = whole-day date equality on resource Crew: a second
          POSTED ticket for the same crew on the same work_date conflicts; the
          next calendar day does not. No interval arithmetic, just date equality.
        test_recipe:
          setup:
            - "Season in HARVEST; block HARVESTABLE; crew with a POSTED ticket on 2026-11-05; allocation of 20"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 300, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 20, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ov: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 20, expected_order_version: "${ov}" }, as: FarmManager }
            - { call: "GET /api/allocations?order_id=${ord}", payload: {}, as: FarmManager, captures: { alc: "$.data[0].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T08:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
            - { call: "POST /api/crews", payload: { season_id: "${s}", crew_code: "C-1", size: 5 }, as: FarmManager, captures: { crw: $.data.id } }
            - { call: "POST /api/harvest-tickets", payload: { crew_id: "${crw}", block_id: "${blk}", work_date: "2026-11-05", hours_worked: 8, lines: [ { allocation_id: "${alc}", cut_count: 5 } ] }, as: CrewLead, as_user_id: "${crw}" }
          trigger:
            - { call: "POST /api/harvest-tickets", payload: { crew_id: "${crw}", block_id: "${blk}", work_date: "2026-11-05", hours_worked: 4, lines: [ { allocation_id: "${alc}", cut_count: 5 } ] }, as: CrewLead, as_user_id: "${crw}" }
            - { call: "POST /api/harvest-tickets", payload: { crew_id: "${crw}", block_id: "${blk}", work_date: "2026-11-06", hours_worked: 4, lines: [ { allocation_id: "${alc}", cut_count: 5 } ] }, as: CrewLead, as_user_id: "${crw}", captures: { t3: $.data.id } }
          assert:
            - "same crew + same work_date: 409 with error_id == ERR_CREW_DOUBLE_BOOKED"
            - "same crew + next day succeeds: HarvestTicket.${t3}.status == POSTED"
            - "StandBucket H_6_7 cut_cumulative == 10 (5 from the first ticket + 5 from the next-day ticket; the rejected ticket contributed nothing)"

      - name: dock_pickup_window_thirty_minute_buffer
        grounds:
          - validations[priority=25]
        distinguishing_aspect: |
          Interval semantics = buffered half-open intervals on the season's
          loading dock (different resource and different arithmetic than crew
          date-equality): a gap of exactly 30 minutes after an existing window is
          allowed; 29 minutes conflicts.
        test_recipe:
          setup:
            - "Season in HARVEST; loadA occupies the dock 2026-11-20T09:00:00Z..10:00:00Z"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T08:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
            - { call: "POST /api/loads", payload: { season_id: "${s}", carrier_name: "Carrier A", capacity_units: 100, pickup_window_start: "2026-11-20T09:00:00Z", pickup_window_end: "2026-11-20T10:00:00Z" }, as: FarmManager, captures: { lda: $.data.id } }
          trigger:
            - { call: "POST /api/loads", payload: { season_id: "${s}", carrier_name: "Carrier B", capacity_units: 100, pickup_window_start: "2026-11-20T10:30:00Z", pickup_window_end: "2026-11-20T11:30:00Z" }, as: FarmManager, captures: { ldb: $.data.id } }
            - { call: "POST /api/loads", payload: { season_id: "${s}", carrier_name: "Carrier C", capacity_units: 100, pickup_window_start: "2026-11-20T10:29:00Z", pickup_window_end: "2026-11-20T11:00:00Z" }, as: FarmManager }
          assert:
            - "exactly-30-minute gap accepted: Load.${ldb}.status == BUILDING (201 Created)"
            - "29-minute gap rejected: 409 with error_id == ERR_DOCK_WINDOW_CONFLICT"
            - "no third load persisted: GET /api/loads?season_id=${s} returns total_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ticket_post_void_bucket_tree_conservation
        grounds:
          - entities.StandBucket.fields.baseline_count
          - state_machines.HarvestTicket.POSTED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = physical tree accounting per bucket:
          baseline_count == standing_count + tagged_active_count + cut_cumulative
          + culled_cumulative + ucut_sold_cumulative + consigned_cumulative.
          Posting a 40-tree ticket then voiding it returns every counter to its
          pre-ticket value — zero drift in the named quantity.
        test_recipe:
          setup:
            - "Season in HARVEST; block HARVESTABLE; bucket H_6_7 baseline 300; order of 100 allocated (reserved 100, standing 300)"
            - "Ticket posts 40 cuts, then is voided"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 300, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 100, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ov: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 100, expected_order_version: "${ov}" }, as: FarmManager }
            - { call: "GET /api/allocations?order_id=${ord}", payload: {}, as: FarmManager, captures: { alc: "$.data[0].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T08:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
            - { call: "POST /api/crews", payload: { season_id: "${s}", crew_code: "C-1", size: 5 }, as: FarmManager, captures: { crw: $.data.id } }
            - { call: "POST /api/harvest-tickets", payload: { crew_id: "${crw}", block_id: "${blk}", work_date: "2026-11-05", hours_worked: 8, lines: [ { allocation_id: "${alc}", cut_count: 40 } ] }, as: CrewLead, as_user_id: "${crw}", captures: { tkt: $.data.id } }
            - { call: "GET /api/crop-lots/${lot}/stand-buckets", payload: {}, as: FarmManager, captures: { st_mid: "$.data[2].standing_count", cut_mid: "$.data[2].cut_cumulative", res_mid: "$.data[2].reserved_count" } }
          trigger:
            - { call: "POST /api/harvest-tickets/${tkt}/void", payload: {}, as: FarmManager }
          assert:
            - "mid-state obeys the invariant: baseline 300 == ${st_mid} 260 + ${cut_mid} 40 (tagged/culled/ucut/consigned all 0); reserved ${res_mid} == 60"
            - "post-void: standing_count == 300, cut_cumulative == 0, reserved_count == 100 — identical to the pre-ticket snapshot"
            - "invariant holds again with zero drift: 300 == 300 + 0 + 0 + 0 + 0 + 0"
            - "Allocation.${alc}.status == RESERVED with cut_qty == 0 (CUT reverted); HarvestTicket.${tkt}.status == VOIDED"

      - name: order_submit_cancel_buyer_exposure_conservation
        grounds:
          - calculations.buyer_exposure
          - entities.BuyerAccount.fields.exposure_cents
        distinguishing_aspect: |
          Conserved quantity = money exposure in cents (different type than tree
          counts): submitting two orders accumulates 48500 + 276000 = 324500, and
          cancelling the first removes exactly its invoice_total — exposure
          returns to 276000 with no drift from the submit/cancel pair.
        test_recipe:
          setup:
            - "Season in BOOKING; buyer credit_limit 100000000; order1 100x500 (tier 3% -> 48500) and order2 600x500 (tier 8% -> 276000) both SUBMITTED"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 100, unit_price_cents: 500 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { o1: $.data.id } }
            - { call: "POST /api/wholesale-orders/${o1}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { inv1: $.data.invoice_total_cents } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "GRAND_FIR", height_class: "H_7_8", quantity: 600, unit_price_cents: 500 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { o2: $.data.id } }
            - { call: "POST /api/wholesale-orders/${o2}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { inv2: $.data.invoice_total_cents } }
            - { call: "GET /api/buyer-accounts/${buy}", payload: {}, as: Owner, captures: { exp_mid: $.data.exposure_cents } }
          trigger:
            - { call: "POST /api/wholesale-orders/${o1}/cancel", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}" }
          assert:
            - "invoice literals: ${inv1} == 48500 (50000 - round_half_up(50000*0.03)=1500) and ${inv2} == 276000 (300000 - 24000)"
            - "exposure with both submitted: ${exp_mid} == 324500"
            - "after cancelling order1: BuyerAccount.${buy}.exposure_cents == 276000 — exactly order2's invoice, no drift"
            - "WholesaleOrder.${o1}.status == CANCELLED"

