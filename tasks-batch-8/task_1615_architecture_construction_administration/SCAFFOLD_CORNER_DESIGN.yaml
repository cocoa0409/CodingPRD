  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_pagination_defaults_and_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "Pagination envelope: limit=2 over 3 RFIs returns 2 items with total_count 3 and has_more true; offset=2 returns the last item with has_more false; omitting limit applies the default 10."
        test_recipe:
          setup: ["ACTIVE project with three RFIs created at the default clock."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj EP1", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/rfis"
              payload: { project_id: "${p_id}", question: "Q1" }
              as: Contractor
              as_user_id: "user-contractor-1"
            - call: "POST /ca/rfis"
              payload: { project_id: "${p_id}", question: "Q2" }
              as: Contractor
              as_user_id: "user-contractor-1"
            - call: "POST /ca/rfis"
              payload: { project_id: "${p_id}", question: "Q3" }
              as: Contractor
              as_user_id: "user-contractor-1"
          trigger:
            - call: "GET /ca/rfis?project_id=${p_id}&limit=2"
              as: Owner
              as_user_id: "user-owner-1"
            - call: "GET /ca/rfis?project_id=${p_id}&limit=2&offset=2"
              as: Owner
              as_user_id: "user-owner-1"
            - call: "GET /ca/rfis?project_id=${p_id}"
              as: Owner
              as_user_id: "user-owner-1"
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page 2 (offset=2): data length == 1, total_count == 3, has_more == false"
            - "no-limit request: data length == 3 (default limit 10 not exceeded)"
            - "every response carries meta.api_request_id and meta.api_request_timestamp"

      - name: list_filter_by_status
        claim_type: listing
        grounds: ["endpoints"]
        distinguishing_aspect: "Filter semantics on the list endpoint: status=APPROVED returns only the approved submittal; status=UNDER_REVIEW returns only the unreviewed one."
        test_recipe:
          setup: ["ACTIVE project; submittal S1 reviewed APPROVED at the default clock; submittal S2 still UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj EP3", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "03 30 00", required_on_site_date: "2026-08-25" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s1_id: $.data.id }
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "05 12 00", required_on_site_date: "2026-08-26" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s2_id: $.data.id }
            - call: "POST /ca/submittals/${s1_id}/review"
              payload: { outcome: "APPROVED" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          trigger:
            - call: "GET /ca/submittals?project_id=${p_id}&status=APPROVED"
              as: FirmAdmin
            - call: "GET /ca/submittals?project_id=${p_id}&status=UNDER_REVIEW"
              as: FirmAdmin
          assert:
            - "status=APPROVED: exactly 1 item and it is ${s1_id}"
            - "status=UNDER_REVIEW: exactly 1 item and it is ${s2_id}"

  # ---------------------------------------------------------------------------
  # Section: errors
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: get_nonexistent_child_resources_return_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_SITE_VISIT_NOT_FOUND]", "errors[ERR_PAYMENT_APPLICATION_NOT_FOUND]", "errors[ERR_CHANGE_ORDER_NOT_FOUND]", "errors[ERR_INVOICE_NOT_FOUND]"]
        distinguishing_aspect: "Each child resource type has its own domain-specific 404: site visit, payment application, change order, and invoice ids that do not exist return their distinct error ids."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /ca/site-visits/00000000-0000-0000-0000-000000000000"
              as: ArchitectCA
              captures: { e1: $.data.error_id }
            - call: "GET /ca/payment-applications/00000000-0000-0000-0000-000000000000"
              as: ArchitectCA
              captures: { e2: $.data.error_id }
            - call: "GET /ca/change-orders/00000000-0000-0000-0000-000000000000"
              as: ArchitectCA
              captures: { e3: $.data.error_id }
            - call: "GET /ca/additional-service-invoices/00000000-0000-0000-0000-000000000000"
              as: ArchitectCA
              captures: { e4: $.data.error_id }
          assert:
            - "${e1} == ERR_SITE_VISIT_NOT_FOUND (http 404)"
            - "${e2} == ERR_PAYMENT_APPLICATION_NOT_FOUND (http 404)"
            - "${e3} == ERR_CHANGE_ORDER_NOT_FOUND (http 404)"
            - "${e4} == ERR_INVOICE_NOT_FOUND (http 404)"

      - name: get_nonexistent_remaining_resources_return_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_FIELD_REPORT_NOT_FOUND]", "errors[ERR_CLARIFICATION_DRAWING_NOT_FOUND]", "errors[ERR_PUNCH_ITEM_NOT_FOUND]", "errors[ERR_RECORD_DOCUMENT_NOT_FOUND]"]
        distinguishing_aspect: "The remaining four resource types likewise surface their own 404 ids: field report, clarification drawing, punch item, record document."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /ca/field-reports/00000000-0000-0000-0000-000000000000"
              as: ArchitectCA
              captures: { e5: $.data.error_id }
            - call: "GET /ca/clarification-drawings/00000000-0000-0000-0000-000000000000"
              as: ArchitectCA
              captures: { e6: $.data.error_id }
            - call: "GET /ca/punch-list-items/00000000-0000-0000-0000-000000000000"
              as: ArchitectCA
              captures: { e7: $.data.error_id }
            - call: "GET /ca/record-documents/00000000-0000-0000-0000-000000000000"
              as: ArchitectCA
              captures: { e8: $.data.error_id }
          assert:
            - "${e5} == ERR_FIELD_REPORT_NOT_FOUND (http 404)"
            - "${e6} == ERR_CLARIFICATION_DRAWING_NOT_FOUND (http 404)"
            - "${e7} == ERR_PUNCH_ITEM_NOT_FOUND (http 404)"
            - "${e8} == ERR_RECORD_DOCUMENT_NOT_FOUND (http 404)"

      - name: answer_withdrawn_rfi_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: ["state_machines.Rfi.OPEN_to_WITHDRAWN", "errors[ERR_RFI_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal for Rfi: answering a withdrawn RFI fails with ERR_RFI_INVALID_STATE and stamps no answered_at."
        test_recipe:
          setup: ["ACTIVE project; RFI created and then withdrawn (OPEN -> WITHDRAWN)."]
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj ER3", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 10000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL" }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/rfis"
              payload: { project_id: "${p_id}", question: "Confirm roof drain model" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { rfi_id: $.data.id }
            - call: "POST /ca/rfis/${rfi_id}/withdraw"
              payload: {}
              as: Contractor
              as_user_id: "user-contractor-1"
          trigger:
            - call: "POST /ca/rfis/${rfi_id}/answer"
              payload: { answer_text: "Per submittal 22 14 13", requires_clarification_drawing: false }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "http 409 and ${err_id} == ERR_RFI_INVALID_STATE"
            - "Rfi.${rfi_id}.status == WITHDRAWN and answered_at == null"

      - name: error_envelope_shape_on_not_found
        claim_type: violation_to_error
        grounds: ["response_envelope", "errors[ERR_SUBMITTAL_NOT_FOUND]"]
        distinguishing_aspect: "Error envelope shape: a 404 response carries response_type 'error' with data.error_id and a non-empty data.message, plus the meta block."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /ca/submittals/00000000-0000-0000-0000-000000000000"
              as: ArchitectCA
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "http 404 and response_type == error"
            - "${err_id} == ERR_SUBMITTAL_NOT_FOUND"
            - "${err_msg} is a non-empty string"
            - "response carries meta.api_request_id and meta.api_request_timestamp"

