# =============================================================================
# task_2627 — Home Improvement Point-of-Sale Financing (GreenSky-style program)
# Seed tables §1.0–§1.7. Difficulty target: EXPERT+ (deliberately harder than
# the Expert band in §0.4 — density first: 14 tightly-coupled entities, 10 state
# machines, 10 calculations, three OCC races, three temporal-overlap geometries).
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2627. Home Improvement Point-of-Sale Financing (GreenSky style program): merchant
  enrollment, license verification and program approval with trade-specific rules,
  consumer application at the point of sale with instant decision and deferred interest
  promotion terms, staged funding tied to project milestones and completion certification,
  merchant discount rate by promotion type and settlement timing, consumer dispute over
  incomplete work with merchant chargeback and holdback reserve, deferred interest
  expiration handling and disclosure requirements, merchant fraud monitoring for phantom
  projects, portfolio performance by merchant with program termination

domain_name: home-improvement-pos-financing

# Flat topology: peer collections live at the root, so `api_prefix` is empty and
# every §1.5 path is a root-level collection (`/merchants`, `/credit-applications`,
# `/funding-draws`, ...). Children are reached from parents through filtered-list
# GETs (`GET /funding-draws?loan_account_id=`) or sub-resource GETs
# (`GET /merchants/{id}/licenses`), never through nested creation paths.
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation      # provisional draw economics vs final settlement economics; promo payoff vs post-expiration payoff
    - cascading_side_effects        # chargeback → reserve → suspension → enrollment/draw cascade (depth 4)
    - rate_threshold_triggers       # DTI ceiling, staged-release cap, reserve coverage, phantom risk score
    - ops_run_checkpoint            # POST /servicing/expiration-sweeps advances promo expiry, offer expiry, dispute escalation
    - optimistic_concurrency        # OCC on Merchant.version and LoanAccount.version (§1.2.1)

  entity_topology: flat
  state_machine_shape: parallel
  # CreditApplication (decision × disclosure_status) and LoanAccount
  # (promo_status × balance_status) carry independent state dimensions;
  # Merchant.enrollment_status and ProjectMilestone.status are cyclic;
  # FundingDraw and DisputeCase are branching with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Merchant → MerchantLicense / FraudAlert; Project → ProjectMilestone
    - many_to_many         # MerchantPromotionEnrollment junction (Merchant × PromotionPlan)
    - self_referential     # DisputeCase.reopens_case_id -> DisputeCase.id
    - cross_aggregate      # FundingDraw spans LoanAccount (credit aggregate) and ProjectMilestone (project aggregate)

  role_model: segregation_of_duties
  # The ProgramUnderwriter operator recorded in Merchant.approved_by_user_id may not
  # close that merchant's fraud investigation; the ServicingAgent operator recorded in
  # FundingDraw.released_by_user_id may not resolve a dispute against the same project.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# All money is integer cents. All rates are integer basis points (bps).
# =============================================================================
entities:
  - name: TradeRule
    parent: null
    common_fields: true
    fields:
      - { name: trade_type, type: enum, source: input, description: "ROOFING | HVAC | SOLAR | WINDOWS | GENERAL_REMODEL — unique across TradeRule rows", constraints: "unique" }
      - { name: max_ticket_cents, type: integer, source: input, description: "Hard ceiling on CreditApplication.project_amount_cents for this trade" }
      - { name: holdback_pct_bps, type: integer, source: input, description: "Base per-draw holdback rate in bps applied to funded_amount_cents" }
      - { name: max_precompletion_release_bps, type: integer, source: input, description: "Maximum cumulative share of contract_amount_cents fundable while Project.completion_status != CERTIFIED_COMPLETE" }
      - { name: velocity_cap_cents, type: integer, source: input, description: "Maximum SETTLED funded volume for one merchant inside the 7-day rolling window (see calculations.funding_velocity_window)" }
      - { name: requires_completion_certificate, type: boolean, source: input, description: "When true, funding beyond verified milestones requires Project.completion_status == CERTIFIED_COMPLETE" }
      - { name: min_license_months, type: integer, source: input, description: "Minimum remaining license coverage (whole months) required at enrollment approval" }

  - name: PromotionPlan
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Program-wide unique promotion code", constraints: "unique" }
      - { name: promotion_type, type: enum, source: input, description: "DEFERRED_INTEREST | ZERO_INTEREST_EQUAL_PAY | REDUCED_APR | STANDARD_REVOLVING" }
      - { name: promo_term_months, type: integer, source: input, description: "Promotional term in whole months; sets LoanAccount.promo_expires_on at acceptance" }
      - { name: deferred_apr_bps, type: integer, source: input, description: "APR (bps) that accrues during the promotional window and is waived on timely payoff" }
      - { name: post_promo_apr_bps, type: integer, source: input, description: "APR (bps) written onto LoanAccount.apr_bps once the promotion expires" }
      - { name: merchant_discount_bps, type: integer, source: input, description: "Plan-level merchant discount rate used by the PROVISIONAL draw variant" }
      - { name: min_ticket_cents, type: integer, source: input, description: "Minimum project_amount_cents accepted on this plan" }
      - { name: max_ticket_cents, type: integer, source: input, description: "Maximum project_amount_cents accepted on this plan" }
      - { name: disclosure_template_version, type: string, source: input, description: "Current disclosure template id merchants must deliver and consumers must acknowledge" }
      - { name: allowed_trade_types, type: array, source: input, description: "Trade types eligible to enroll in this plan" }

  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Merchant legal entity name" }
      - { name: trade_type, type: enum, source: input, description: "ROOFING | HVAC | SOLAR | WINDOWS | GENERAL_REMODEL — selects the governing TradeRule row by trade_type" }
      - { name: state_code, type: string, source: input, description: "Two-letter state of operation" }
      - { name: contact_email, type: string, source: input, description: "Program contact email" }
      - { name: enrollment_status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | DOCS_REQUIRED | APPROVED | SUSPENDED | DECLINED | TERMINATED", default: DRAFT }
      - { name: attestation_ref, type: string, source: input, description: "Signed program attestation reference captured at enrollment submission" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramUnderwriter that APPROVED enrollment; drives the fraud-investigation segregation-of-duties check" }
      - { name: approved_on, type: datetime, source: system, description: "Logical-clock instant of enrollment approval; promotion windows may not start before this date" }
      - { name: suspension_reason_code, type: string, source: system, description: "Reason for the current SUSPENDED state (RESERVE_COVERAGE | FRAUD_CONFIRMED | ANALYST_ACTION), null otherwise" }
      - { name: termination_reason_code, type: string, source: system, description: "Reason recorded when enrollment_status became TERMINATED, null otherwise" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | STANDARD | ELEVATED | HIGH — see calculations.merchant_portfolio_performance" }
      - { name: funded_volume_cents, type: integer, source: computed, description: "Sum of FundingDraw.funded_amount_cents where status == SETTLED for this merchant (all time)", default: 0 }
      - { name: holdback_reserve_cents, type: integer, source: computed, description: "Reserve ledger balance: withheld on SETTLED draws + DEPOSIT adjustments - RELEASE adjustments - chargeback amounts absorbed from reserve", default: 0 }
      - { name: holdback_target_cents, type: integer, source: computed, description: "Target reserve = trailing-180-day SETTLED volume x TARGET_BPS(risk_tier); see calculations.holdback_reserve_target", default: 0 }
      - { name: reserve_coverage_bps, type: integer, source: computed, description: "round_half_up(holdback_reserve_cents * 10000 / holdback_target_cents), or 10000 when holdback_target_cents == 0", default: 10000 }
      - { name: settlement_offset_receivable_cents, type: integer, source: computed, description: "Chargeback remainder billed back to the merchant after reserve absorption", default: 0 }
      - { name: program_write_off_cents, type: integer, source: computed, description: "Chargeback remainder beyond the receivable cap, absorbed by the program", default: 0 }
      - { name: dispute_rate_bps, type: integer, source: computed, description: "Open-or-consumer-favor DisputeCase count per LoanAccount, in bps", default: 0 }
      - { name: delinquency_rate_bps, type: integer, source: computed, description: "LoanAccounts in DELINQUENT or CHARGED_OFF per LoanAccount, in bps", default: 0 }
      - { name: phantom_risk_score, type: integer, source: computed, description: "0-100 fraud score over this merchant's FraudAlert rows; see calculations.phantom_fraud_score", default: 0 }
      - { name: portfolio_grade, type: enum, source: computed, description: "A | B | C | D — graded from dispute_rate_bps, delinquency_rate_bps and phantom_risk_score", default: A }
      - { name: termination_recommended, type: boolean, source: computed, description: "True when portfolio_grade == D or phantom_risk_score >= 60 or dispute_rate_bps >= 2500", default: false }

  - name: MerchantLicense
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; taken from the path, never from the body" }
      - { name: trade_type, type: enum, source: input, description: "Trade the license authorizes; must equal Merchant.trade_type for the enrollment-approval coverage check" }
      - { name: license_number, type: string, source: input, description: "State-issued license number" }
      - { name: state_code, type: string, source: input, description: "Two-letter issuing state" }
      - { name: effective_from, type: string, source: input, description: "ISO date (YYYY-MM-DD); inclusive start of the coverage interval" }
      - { name: expires_on, type: string, source: input, description: "ISO date (YYYY-MM-DD); EXCLUSIVE end of the coverage interval (half-open [effective_from, expires_on))" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED | REJECTED | EXPIRED", default: UNVERIFIED }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramUnderwriter that decided verification, null while UNVERIFIED" }
      - { name: verification_note, type: string, source: input, description: "Free-text note recorded with the verification decision" }
      - { name: verified_on, type: datetime, source: system, description: "Logical-clock instant of the verification decision, null while UNVERIFIED" }

  - name: MerchantPromotionEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; taken from the path" }
      - { name: promotion_plan_id, type: string, source: input, description: "FK -> PromotionPlan.id" }
      - { name: window_start_date, type: string, source: input, description: "ISO date; INCLUSIVE start of the enrollment window (closed interval)" }
      - { name: window_end_date, type: string, source: input, description: "ISO date; INCLUSIVE end of the enrollment window (closed interval)" }
      - { name: negotiated_discount_bps, type: integer, source: input, description: "Merchant-specific discount rate used by the FINAL settlement variant; falls back to PromotionPlan.merchant_discount_bps when null" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", default: ACTIVE }

  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Consumer legal name" }
      - { name: ssn_last4, type: string, source: input, description: "Last four digits of the tax id; with full_name forms the duplicate-identity fraud signal" }
      - { name: annual_income_cents, type: integer, source: input, description: "Stated annual income in cents; denominator of the DTI calculation", constraints: "> 0" }
      - { name: fico_score, type: integer, source: input, description: "Bureau score 300-850; selects the FICO tier in calculations.instant_credit_decision" }
      - { name: state_code, type: string, source: input, description: "Two-letter state of residence" }
      - { name: existing_program_debt_cents, type: integer, source: computed, description: "Sum of LoanAccount.principal_balance_cents + capitalized_interest_cents over this consumer's loans whose balance_status NOT IN {PAID_OFF, CHARGED_OFF}", default: 0 }
      - { name: active_loan_count, type: integer, source: computed, description: "Count of this consumer's LoanAccounts with balance_status IN {CURRENT, DELINQUENT}", default: 0 }

  - name: CreditApplication
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id; the point-of-sale merchant submitting the application" }
      - { name: consumer_id, type: string, source: input, description: "FK -> Consumer.id" }
      - { name: promotion_plan_id, type: string, source: input, description: "FK -> PromotionPlan.id" }
      - { name: project_amount_cents, type: integer, source: input, description: "Ticket amount requested at the point of sale", constraints: "> 0" }
      - { name: decision, type: enum, source: computed, description: "PENDING | APPROVED | COUNTER_OFFERED | DECLINED | ACTIVATED | REVOKED | EXPIRED — instant decision dimension", default: PENDING }
      - { name: approved_limit_cents, type: integer, source: computed, description: "Credit-derived ceiling written at decision time; 0 when DECLINED", default: 0 }
      - { name: decision_dti_bps, type: integer, source: computed, description: "Debt-to-income ratio in bps evaluated at decision time", default: 0 }
      - { name: decision_reason_codes, type: array, source: computed, description: "Ordered reason codes: FICO_BELOW_FLOOR | DTI_ABOVE_CEILING | LIMIT_BELOW_TICKET | WITHIN_LIMIT | REVOKED_DTI_BREACH | OFFER_LAPSED", default: [] }
      - { name: disclosure_status, type: enum, source: system, description: "NOT_SENT | DELIVERED | ACKNOWLEDGED | EXPIRED_UNACKNOWLEDGED — disclosure dimension, evolves independently of decision", default: NOT_SENT }
      - { name: disclosure_template_version, type: string, source: input, description: "Template version delivered to the consumer; must equal PromotionPlan.disclosure_template_version" }
      - { name: disclosure_delivered_at, type: datetime, source: system, description: "Logical-clock instant of disclosure delivery, null while NOT_SENT" }
      - { name: disclosure_acknowledged_at, type: datetime, source: system, description: "Logical-clock instant of consumer acknowledgement, null until ACKNOWLEDGED" }
      - { name: consumer_signature_ref, type: string, source: input, description: "Signature artifact reference captured with the acknowledgement" }
      - { name: offer_expires_at, type: datetime, source: computed, description: "decision instant + OFFER_VALIDITY_DAYS(14); acceptance after this instant is rejected" }
      - { name: promo_disclosure_summary, type: object, source: computed, description: "Frozen deferred-interest disclosure facts (promo_term_months, deferred_apr_bps, post_promo_apr_bps, expiration_date, interest_at_risk_note) pinned at delivery" }

  - name: LoanAccount
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> CreditApplication.id; the accepted offer that originated this account" }
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id" }
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; copied from the originating application for portfolio aggregation" }
      - { name: promotion_plan_id, type: string, source: system, description: "FK -> PromotionPlan.id" }
      - { name: credit_limit_cents, type: integer, source: system, description: "Frozen copy of CreditApplication.approved_limit_cents at acceptance" }
      - { name: principal_balance_cents, type: integer, source: computed, description: "Sum of SETTLED FundingDraw.funded_amount_cents - principal-applied payments - consumer-favor chargebacks", default: 0 }
      - { name: capitalized_interest_cents, type: integer, source: computed, description: "Deferred interest folded into the balance when the promotion expired unsatisfied", default: 0 }
      - { name: accrued_deferred_interest_cents, type: integer, source: computed, description: "Interest accrued but not yet capitalized; 0 once promo_status leaves PROMO_ACTIVE", default: 0 }
      - { name: waived_interest_cents, type: integer, source: computed, description: "Deferred interest forgiven when promo_status became PROMO_SATISFIED", default: 0 }
      - { name: promo_status, type: enum, source: system, description: "PROMO_ACTIVE | PROMO_SATISFIED | PROMO_EXPIRED_CAPITALIZED — promotional dimension", default: PROMO_ACTIVE }
      - { name: balance_status, type: enum, source: system, description: "CURRENT | DELINQUENT | PAID_OFF | CHARGED_OFF — repayment dimension, evolves independently of promo_status", default: CURRENT }
      - { name: promo_expires_on, type: string, source: computed, description: "ISO date = acceptance date + PromotionPlan.promo_term_months; INCLUSIVE last day of the promotional window" }
      - { name: apr_bps, type: integer, source: computed, description: "PromotionPlan.deferred_apr_bps while PROMO_ACTIVE, PromotionPlan.post_promo_apr_bps after capitalization" }
      - { name: first_funding_on, type: string, source: computed, description: "ISO date of the earliest SETTLED draw; accrual start, null before first settlement" }
      - { name: last_payment_on, type: string, source: computed, description: "ISO date of the most recent Payment, null when none" }
      - { name: total_funded_cents, type: integer, source: computed, description: "Sum of funded_amount_cents over SETTLED draws (reversals excluded)", default: 0 }
      - { name: promo_payoff_cents, type: integer, source: computed, description: "PROMO variant payoff: principal_balance_cents only (accrued interest waived on timely payoff)" }
      - { name: standard_payoff_cents, type: integer, source: computed, description: "POST-EXPIRATION variant payoff: principal_balance_cents + capitalized_interest_cents + accrued_deferred_interest_cents" }
      - { name: deferred_interest_at_risk_cents, type: integer, source: computed, description: "accrued_deferred_interest_cents while PROMO_ACTIVE, else 0 — the disclosure figure", default: 0 }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> CreditApplication.id; must be an ACTIVATED application" }
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; copied from the application" }
      - { name: loan_account_id, type: string, source: system, description: "FK -> LoanAccount.id; the account funding this project" }
      - { name: scope_description, type: string, source: input, description: "Contracted scope of work" }
      - { name: contract_amount_cents, type: integer, source: input, description: "Signed contract amount; must be <= LoanAccount.credit_limit_cents", constraints: "> 0" }
      - { name: completion_status, type: enum, source: system, description: "IN_PROGRESS | SUBSTANTIALLY_COMPLETE | CERTIFIED_COMPLETE | ABANDONED", default: IN_PROGRESS }
      - { name: completion_certificate_ref, type: string, source: input, description: "Consumer-signed completion certificate reference, null until certified" }
      - { name: certified_on, type: datetime, source: system, description: "Logical-clock instant of completion certification, null otherwise" }
      - { name: verified_release_bps, type: integer, source: computed, description: "Sum of release_pct_bps over this project's milestones with status == VERIFIED", default: 0 }
      - { name: settled_funded_cents, type: integer, source: computed, description: "Sum of funded_amount_cents over this project's draws with status == SETTLED", default: 0 }
      - { name: funded_pct_bps, type: integer, source: computed, description: "round_half_up(settled_funded_cents * 10000 / contract_amount_cents)", default: 0 }
      - { name: max_fundable_now_cents, type: integer, source: computed, description: "Remaining staged-funding headroom; see calculations.staged_funding_availability", default: 0 }
      - { name: disputed_amount_cents, type: integer, source: computed, description: "Sum of claimed_incomplete_amount_cents over this project's disputes in a non-terminal status", default: 0 }

  - name: ProjectMilestone
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; taken from the path" }
      - { name: sequence_no, type: integer, source: input, description: "1-based ordering, unique per project", constraints: ">= 1" }
      - { name: name, type: string, source: input, description: "Milestone label" }
      - { name: release_pct_bps, type: integer, source: input, description: "Share of contract_amount_cents this milestone releases; the project's milestones may not exceed 10000 bps in total" }
      - { name: requires_consumer_signoff, type: boolean, source: input, description: "When true only the owning Consumer may verify; when false a ServicingAgent may verify as well", default: true }
      - { name: status, type: enum, source: system, description: "PENDING | CLAIMED | VERIFIED | REJECTED", default: PENDING }
      - { name: claimed_at, type: datetime, source: system, description: "Logical-clock instant of the most recent merchant claim, null while PENDING" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock instant of verification, null unless VERIFIED" }
      - { name: rejection_count, type: integer, source: computed, description: "Number of times verification returned REJECT; the re-claim loop increments it", default: 0 }
      - { name: evidence_ref, type: string, source: input, description: "Photo/inspection artifact reference supplied with the claim" }
      - { name: is_funded, type: boolean, source: computed, description: "True when a FundingDraw with status IN {REQUESTED, SETTLED} references this milestone", default: false }

  - name: FundingDraw
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id; the account debited on settlement" }
      - { name: project_milestone_id, type: string, source: input, description: "FK -> ProjectMilestone.id; the milestone this draw releases against" }
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; copied from the milestone's project" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount the merchant asks to draw", constraints: "> 0" }
      - { name: settlement_speed, type: enum, source: input, description: "NEXT_DAY | STANDARD_3DAY — selects the speed surcharge in the FINAL variant" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SETTLED | DENIED | REVERSED", default: REQUESTED }
      - { name: funded_amount_cents, type: integer, source: computed, description: "Equals requested_amount_cents once the fiscal gates pass; frozen at request time" }
      - { name: provisional_discount_cents, type: integer, source: computed, description: "PROVISIONAL variant merchant discount, computed at request from PromotionPlan.merchant_discount_bps" }
      - { name: provisional_holdback_cents, type: integer, source: computed, description: "PROVISIONAL variant holdback, computed at request from TradeRule.holdback_pct_bps only" }
      - { name: provisional_net_settlement_cents, type: integer, source: computed, description: "funded_amount_cents - provisional_discount_cents - provisional_holdback_cents" }
      - { name: effective_discount_bps, type: integer, source: computed, description: "FINAL variant discount rate: MerchantPromotionEnrollment.negotiated_discount_bps or PromotionPlan.merchant_discount_bps when null; null until settlement" }
      - { name: volume_tier_credit_bps, type: integer, source: computed, description: "FINAL variant volume-tier credit in bps from trailing-90-day SETTLED volume EXCLUDING this draw; null until settlement", default: 0 }
      - { name: merchant_discount_cents, type: integer, source: computed, description: "FINAL variant discount = discount component + speed component - volume credit, each rounded separately; null until settlement" }
      - { name: holdback_withheld_cents, type: integer, source: computed, description: "FINAL variant holdback actually withheld into the merchant reserve; null until settlement" }
      - { name: net_settlement_cents, type: integer, source: computed, description: "funded_amount_cents - merchant_discount_cents - holdback_withheld_cents; null until settlement" }
      - { name: settled_on, type: string, source: computed, description: "ISO date of settlement, null unless status == SETTLED or REVERSED" }
      - { name: released_by_user_id, type: string, source: system, description: "X-User-ID of the ServicingAgent that settled the draw; drives the dispute-resolution segregation-of-duties check" }
      - { name: denial_reason_code, type: string, source: input, description: "Reason recorded when the settlement decision was DENY, null otherwise" }
      - { name: reversal_reason_code, type: string, source: input, description: "Reason recorded when the draw was reversed, null otherwise" }

  - name: DisputeCase
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; the work under dispute" }
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; copied from the project" }
      - { name: reopens_case_id, type: string, source: input, description: "FK -> DisputeCase.id; set when this case reopens a prior RESOLVED_MERCHANT_FAVOR case, null otherwise" }
      - { name: claimed_incomplete_amount_cents, type: integer, source: input, description: "Consumer's claimed value of incomplete work", constraints: "> 0" }
      - { name: description, type: string, source: input, description: "Consumer narrative of the incomplete work" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | MERCHANT_RESPONSE_PENDING | ESCALATED_NO_RESPONSE | RESOLVED_CONSUMER_FAVOR | RESOLVED_MERCHANT_FAVOR", default: SUBMITTED }
      - { name: opened_on, type: string, source: computed, description: "ISO date the case was filed (logical clock)" }
      - { name: response_due_at, type: datetime, source: computed, description: "opened_on + MERCHANT_RESPONSE_DAYS(10) at 00:00:00Z; merchant responses at or after this instant are rejected" }
      - { name: merchant_responded_at, type: datetime, source: system, description: "Logical-clock instant of the merchant response, null when none" }
      - { name: response_type, type: enum, source: input, description: "WORK_COMPLETE_EVIDENCE | CONCEDE — null until the merchant responds" }
      - { name: evidence_ref, type: string, source: input, description: "Merchant evidence artifact reference supplied with the response" }
      - { name: chargeback_amount_cents, type: integer, source: computed, description: "Total chargeback assessed on resolution; 0 unless RESOLVED_CONSUMER_FAVOR", default: 0 }
      - { name: chargeback_absorbed_from_reserve_cents, type: integer, source: computed, description: "Waterfall bucket 1 — amount taken from Merchant.holdback_reserve_cents", default: 0 }
      - { name: chargeback_receivable_cents, type: integer, source: computed, description: "Waterfall bucket 2 — amount added to Merchant.settlement_offset_receivable_cents", default: 0 }
      - { name: chargeback_write_off_cents, type: integer, source: computed, description: "Waterfall bucket 3 — remainder absorbed by the program", default: 0 }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of the ServicingAgent that resolved the case, null while unresolved" }
      - { name: resolved_on, type: string, source: computed, description: "ISO date of resolution, null while unresolved" }

  - name: FraudAlert
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; taken from the path for analyst alerts and from the draw's merchant for system alerts" }
      - { name: alert_type, type: enum, source: input, description: "PHANTOM_PROJECT | PRE_COMPLETION_FULL_DRAW | VELOCITY_SPIKE | DUPLICATE_CONSUMER" }
      - { name: severity_weight, type: integer, source: input, description: "Score contribution 1-100 for this alert", constraints: "1..100" }
      - { name: source, type: enum, source: system, description: "ANALYST | SYSTEM — SYSTEM alerts are minted by the pre-completion draw detector", default: ANALYST }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | CLEARED", default: OPEN }
      - { name: evidence_ref, type: string, source: input, description: "Evidence artifact reference" }
      - { name: opened_on, type: string, source: computed, description: "ISO date the alert was raised (logical clock)" }
      - { name: investigated_by_user_id, type: string, source: system, description: "X-User-ID of the RiskAnalyst that closed the investigation, null while OPEN" }
      - { name: investigation_note, type: string, source: input, description: "Note recorded with the investigation outcome" }

  - name: Payment
    parent: null
    common_fields: false      # immutable event: id + created_at only, no version, no mutation endpoint
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount", constraints: "> 0" }
      - { name: posted_on, type: string, source: computed, description: "ISO date of posting, taken from the logical clock" }
      - { name: applied_to_capitalized_interest_cents, type: integer, source: computed, description: "Waterfall bucket 1 — only non-zero after promo capitalization", default: 0 }
      - { name: applied_to_principal_cents, type: integer, source: computed, description: "Waterfall bucket 2 — principal reduction" }
      - { name: resulting_principal_balance_cents, type: integer, source: computed, description: "LoanAccount.principal_balance_cents immediately after this payment posted" }
      - { name: source_role, type: enum, source: system, description: "CONSUMER | SERVICING_AGENT — X-User-Role of the poster", default: CONSUMER }

# =============================================================================
# §1.2 State Machine Table
# Merchant.enrollment_status and ProjectMilestone.status are CYCLIC.
# CreditApplication (decision x disclosure_status) and LoanAccount
# (promo_status x balance_status) carry PARALLEL dimensions.
# FundingDraw and DisputeCase are BRANCHING with divergent side-effect sets.
# =============================================================================
state_machines:
  - entity: MerchantLicense
    initial_state: UNVERIFIED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /merchants/{id}/licenses/{license_id}/verification with outcome=VERIFIED"
        actor: ProgramUnderwriter
        preconditions:
          - "license.verification_status == UNVERIFIED"
          - "merchant.enrollment_status NOT IN {TERMINATED}"
        side_effects:
          - "sets verified_by_user_id = X-User-ID, verified_on = logical clock"
          - "increments MerchantLicense.version by 1"
      - from: UNVERIFIED
        to: REJECTED
        trigger: "POST /merchants/{id}/licenses/{license_id}/verification with outcome=REJECTED"
        actor: ProgramUnderwriter
        preconditions: ["license.verification_status == UNVERIFIED"]
        side_effects:
          - "sets verified_by_user_id, verified_on; the license no longer participates in the enrollment coverage check"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system event during POST /servicing/expiration-sweeps"
        actor: system
        preconditions: ["clock_date >= license.expires_on (half-open interval has closed)"]
        side_effects:
          - "verification_status = EXPIRED; the merchant loses trade coverage, so subsequent POST /credit-applications fail with ERR_LICENSE_EXPIRED"
        note: "expires_on is EXCLUSIVE: coverage holds while clock_date < expires_on."

  - entity: Merchant
    initial_state: DRAFT
    terminal_states: [DECLINED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /merchants/{id}/enrollment-submission"
        actor: Merchant
        preconditions:
          - "merchant.enrollment_status IN {DRAFT, DOCS_REQUIRED}"
          - "at least one MerchantLicense exists for this merchant with verification_status IN {UNVERIFIED, VERIFIED}"
        side_effects: ["stores attestation_ref", "increments Merchant.version by 1"]
      - from: DOCS_REQUIRED
        to: PENDING_REVIEW
        trigger: "POST /merchants/{id}/enrollment-submission (resubmission)"
        actor: Merchant
        preconditions: ["merchant.enrollment_status == DOCS_REQUIRED"]
        side_effects: ["overwrites attestation_ref", "increments Merchant.version by 1"]
        note: "CYCLE: DOCS_REQUIRED -> PENDING_REVIEW -> DOCS_REQUIRED may repeat without bound."
      - from: PENDING_REVIEW
        to: DOCS_REQUIRED
        trigger: "POST /merchants/{id}/enrollment-decision with decision=REQUEST_DOCS"
        actor: ProgramUnderwriter
        preconditions: ["merchant.enrollment_status == PENDING_REVIEW"]
        side_effects: ["records decision_note", "increments Merchant.version by 1"]
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /merchants/{id}/enrollment-decision with decision=APPROVE"
        actor: ProgramUnderwriter
        preconditions:
          - "merchant.enrollment_status == PENDING_REVIEW"
          - "a MerchantLicense exists with verification_status == VERIFIED, trade_type == merchant.trade_type, state_code == merchant.state_code, effective_from <= clock_date < expires_on"
          - "that license satisfies expires_on >= clock_date + TradeRule(merchant.trade_type).min_license_months whole months, else ERR_LICENSE_COVERAGE_INSUFFICIENT"
        side_effects:
          - "sets approved_by_user_id = X-User-ID and approved_on = logical clock"
          - "recomputes risk_tier (STANDARD for a zero-volume merchant), portfolio_grade, termination_recommended"
          - "increments Merchant.version by 1"
      - from: PENDING_REVIEW
        to: DECLINED
        trigger: "POST /merchants/{id}/enrollment-decision with decision=DECLINE"
        actor: ProgramUnderwriter
        preconditions: ["merchant.enrollment_status == PENDING_REVIEW"]
        side_effects: ["records decision_note; terminal — no further enrollment transitions"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /merchants/{id}/program-action with action=SUSPEND, or system cascade from dispute resolution / confirmed fraud"
        actor: ProgramAdmin | system
        preconditions: ["merchant.enrollment_status == APPROVED"]
        side_effects:
          - "sets suspension_reason_code (ANALYST_ACTION | RESERVE_COVERAGE | FRAUD_CONFIRMED)"
          - "CASCADE hop: every MerchantPromotionEnrollment of this merchant with status == ACTIVE becomes SUSPENDED"
          - "CASCADE hop: every FundingDraw of this merchant with status == REQUESTED becomes DENIED with denial_reason_code = MERCHANT_SUSPENDED"
          - "increments Merchant.version by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /merchants/{id}/program-action with action=REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "merchant.enrollment_status == SUSPENDED"
          - "merchant.reserve_coverage_bps >= 5000"
          - "no FraudAlert of this merchant has status == OPEN"
        side_effects:
          - "clears suspension_reason_code"
          - "CASCADE hop: every MerchantPromotionEnrollment of this merchant with status == SUSPENDED returns to ACTIVE"
          - "increments Merchant.version by 1"
        note: "CYCLE: APPROVED -> SUSPENDED -> APPROVED may repeat without bound."
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /merchants/{id}/program-action with action=TERMINATE"
        actor: ProgramAdmin
        preconditions:
          - "merchant.enrollment_status IN {APPROVED, SUSPENDED}"
          - "merchant.termination_recommended == true"
        side_effects:
          - "sets termination_reason_code"
          - "CASCADE hop: every MerchantPromotionEnrollment of this merchant with status IN {ACTIVE, SUSPENDED} becomes TERMINATED"
          - "CASCADE hop: every FundingDraw of this merchant with status == REQUESTED becomes DENIED with denial_reason_code = MERCHANT_TERMINATED"
          - "CASCADE hop: every CreditApplication of this merchant with decision IN {PENDING, APPROVED, COUNTER_OFFERED} becomes REVOKED with reason code MERCHANT_TERMINATED"
          - "increments Merchant.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /merchants/{id}/program-action with action=TERMINATE"
        actor: ProgramAdmin
        preconditions: ["merchant.enrollment_status == SUSPENDED", "merchant.termination_recommended == true"]
        side_effects: ["same cascade set as APPROVED -> TERMINATED"]

  - entity: MerchantPromotionEnrollment
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade from Merchant APPROVED -> SUSPENDED"
        actor: system
        preconditions: ["enrollment.status == ACTIVE"]
        side_effects: ["the plan stops satisfying the promotion-enrollment gate on POST /credit-applications"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade from Merchant SUSPENDED -> APPROVED"
        actor: system
        preconditions: ["enrollment.status == SUSPENDED"]
        side_effects: ["the plan again satisfies the promotion-enrollment gate"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "system cascade from Merchant -> TERMINATED"
        actor: system
        preconditions: ["enrollment.status IN {ACTIVE, SUSPENDED}"]
        side_effects: ["window is released: a later enrollment may reuse the same date range for this (merchant, plan) pair"]

  - entity: CreditApplication
    initial_state: PENDING
    terminal_states: [ACTIVATED, DECLINED, REVOKED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /credit-applications (instant decision at the point of sale)"
        actor: Merchant
        preconditions:
          - "calculations.instant_credit_decision yields decision == APPROVED"
        side_effects:
          - "writes approved_limit_cents, decision_dti_bps, decision_reason_codes=[WITHIN_LIMIT], offer_expires_at = clock + 14 days"
      - from: PENDING
        to: COUNTER_OFFERED
        trigger: "POST /credit-applications"
        actor: Merchant
        preconditions: ["instant_credit_decision yields decision == COUNTER_OFFERED (credit ceiling below the ticket but >= 200000 cents)"]
        side_effects: ["writes approved_limit_cents = credit ceiling, decision_reason_codes=[LIMIT_BELOW_TICKET], offer_expires_at"]
      - from: PENDING
        to: DECLINED
        trigger: "POST /credit-applications"
        actor: Merchant
        preconditions: ["instant_credit_decision yields decision == DECLINED"]
        side_effects: ["writes decision_reason_codes ([FICO_BELOW_FLOOR] or [DTI_ABOVE_CEILING] or [LIMIT_BELOW_TICKET]); approved_limit_cents stays 0"]
      - from: APPROVED
        to: ACTIVATED
        trigger: "POST /credit-applications/{id}/acceptance"
        actor: Consumer
        preconditions:
          - "application.decision == APPROVED"
          - "application.disclosure_status == ACKNOWLEDGED"
          - "clock <= application.offer_expires_at"
          - "merchant.enrollment_status == APPROVED"
          - "recomputed DTI over Consumer.existing_program_debt_cents <= DTI_CEILING_BPS, else ERR_DTI_LIMIT_EXCEEDED"
        side_effects:
          - "creates a LoanAccount (promo_status=PROMO_ACTIVE, balance_status=CURRENT, credit_limit_cents = approved_limit_cents, promo_expires_on = acceptance date + promo_term_months)"
          - "recomputes Consumer.active_loan_count and Consumer.existing_program_debt_cents"
      - from: COUNTER_OFFERED
        to: ACTIVATED
        trigger: "POST /credit-applications/{id}/acceptance with accept_counter_offer=true"
        actor: Consumer
        preconditions:
          - "application.decision == COUNTER_OFFERED and accept_counter_offer == true"
          - "same disclosure, offer-window, merchant-state and DTI preconditions as APPROVED -> ACTIVATED"
        side_effects: ["creates a LoanAccount with credit_limit_cents = approved_limit_cents (the counter-offered ceiling, below project_amount_cents)"]
        note: "accept_counter_offer=false on a COUNTER_OFFERED application is rejected with ERR_COUNTER_OFFER_NOT_ACCEPTED."
      - from: APPROVED
        to: EXPIRED
        trigger: "system event during POST /servicing/expiration-sweeps"
        actor: system
        preconditions: ["clock > application.offer_expires_at", "decision IN {APPROVED, COUNTER_OFFERED}"]
        side_effects: ["appends OFFER_LAPSED to decision_reason_codes"]
      - from: APPROVED
        to: REVOKED
        trigger: "system cascade from Consumer.existing_program_debt_cents recomputation (promo capitalization) or Merchant -> TERMINATED"
        actor: system
        preconditions: ["decision IN {APPROVED, COUNTER_OFFERED}", "recomputed DTI > DTI_CEILING_BPS or the merchant was terminated"]
        side_effects: ["appends REVOKED_DTI_BREACH (or MERCHANT_TERMINATED) to decision_reason_codes; the offer can no longer be accepted"]
      - from: NOT_SENT
        to: DELIVERED
        trigger: "POST /credit-applications/{id}/disclosure-delivery"
        actor: Merchant
        preconditions:
          - "application.disclosure_status IN {NOT_SENT, EXPIRED_UNACKNOWLEDGED}"
          - "application.decision IN {APPROVED, COUNTER_OFFERED}"
          - "template_version == PromotionPlan.disclosure_template_version, else ERR_DISCLOSURE_TEMPLATE_MISMATCH"
        side_effects:
          - "sets disclosure_delivered_at = logical clock and freezes promo_disclosure_summary (promo_term_months, deferred_apr_bps, post_promo_apr_bps, expiration_date = clock date + promo_term_months, interest_at_risk_note)"
        note: "DISCLOSURE DIMENSION — evolves independently of the decision dimension on the same row."
      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /credit-applications/{id}/disclosure-acknowledgement"
        actor: Consumer
        preconditions:
          - "application.disclosure_status == DELIVERED"
          - "clock <= disclosure_delivered_at + DISCLOSURE_ACK_WINDOW_DAYS(3), else ERR_DISCLOSURE_WINDOW_EXPIRED"
          - "acknowledged_template_version == application.disclosure_template_version"
        side_effects: ["sets disclosure_acknowledged_at = logical clock"]
      - from: EXPIRED_UNACKNOWLEDGED
        to: DELIVERED
        trigger: "POST /credit-applications/{id}/disclosure-delivery (re-delivery)"
        actor: Merchant
        preconditions:
          - "application.disclosure_status == EXPIRED_UNACKNOWLEDGED"
          - "application.decision IN {APPROVED, COUNTER_OFFERED}"
        side_effects: ["resets disclosure_delivered_at to the current logical clock, restarting the 3-day acknowledgement window"]
        note: "DISCLOSURE CYCLE: DELIVERED -> EXPIRED_UNACKNOWLEDGED -> DELIVERED."
      - from: DELIVERED
        to: EXPIRED_UNACKNOWLEDGED
        trigger: "system event during POST /servicing/expiration-sweeps"
        actor: system
        preconditions: ["clock > disclosure_delivered_at + 3 days", "disclosure_status == DELIVERED"]
        side_effects: ["acceptance is blocked with ERR_DISCLOSURE_NOT_ACKNOWLEDGED until a fresh delivery is made"]

  - entity: LoanAccount
    initial_state: PROMO_ACTIVE
    terminal_states: [PROMO_SATISFIED, PROMO_EXPIRED_CAPITALIZED, PAID_OFF, CHARGED_OFF]
    transitions:
      - from: PROMO_ACTIVE
        to: PROMO_SATISFIED
        trigger: "POST /payments that brings principal_balance_cents to 0"
        actor: ServicingAgent | Consumer
        preconditions:
          - "loan.promo_status == PROMO_ACTIVE"
          - "principal_balance_cents - applied_to_principal_cents == 0"
          - "payment posted_on <= loan.promo_expires_on (INCLUSIVE — a payment posted exactly on the expiration date still satisfies the promotion)"
        side_effects:
          - "waived_interest_cents = accrued_deferred_interest_cents at that instant; accrued_deferred_interest_cents = 0; deferred_interest_at_risk_cents = 0"
          - "balance_status transitions CURRENT -> PAID_OFF on the repayment dimension"
          - "recomputes Consumer.existing_program_debt_cents and Consumer.active_loan_count"
        note: "PROMOTIONAL DIMENSION."
      - from: PROMO_ACTIVE
        to: PROMO_EXPIRED_CAPITALIZED
        trigger: "system event during POST /servicing/expiration-sweeps"
        actor: system
        preconditions:
          - "loan.promo_status == PROMO_ACTIVE"
          - "clock_date > loan.promo_expires_on (STRICTLY after — a sweep run on the expiration date changes nothing)"
          - "principal_balance_cents > 0"
        side_effects:
          - "capitalized_interest_cents = accrued_deferred_interest_cents computed through promo_expires_on inclusive; accrued_deferred_interest_cents = 0; deferred_interest_at_risk_cents = 0"
          - "apr_bps = PromotionPlan.post_promo_apr_bps"
          - "CASCADE hop 2: Consumer.existing_program_debt_cents recomputed upward by the capitalized amount"
          - "CASCADE hop 3: every CreditApplication of that Consumer with decision IN {APPROVED, COUNTER_OFFERED} whose recomputed DTI now exceeds DTI_CEILING_BPS becomes REVOKED"
      - from: CURRENT
        to: DELINQUENT
        trigger: "system event during POST /servicing/expiration-sweeps"
        actor: system
        preconditions:
          - "loan.balance_status == CURRENT"
          - "clock_date > loan.promo_expires_on + DELINQUENCY_GRACE_DAYS(30)"
          - "principal_balance_cents + capitalized_interest_cents > 0"
        side_effects: ["recomputes Merchant.delinquency_rate_bps, portfolio_grade and termination_recommended for the originating merchant"]
        note: "REPAYMENT DIMENSION — independent of promo_status."
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /payments with amount_cents >= CURE_PAYMENT_BPS(500) of (principal_balance_cents + capitalized_interest_cents)"
        actor: ServicingAgent | Consumer
        preconditions: ["loan.balance_status == DELINQUENT", "amount_cents >= round_half_up((principal_balance_cents + capitalized_interest_cents) * 500 / 10000)"]
        side_effects: ["recomputes Merchant.delinquency_rate_bps and portfolio_grade"]
        note: "CYCLE: CURRENT -> DELINQUENT -> CURRENT."
      - from: DELINQUENT
        to: CHARGED_OFF
        trigger: "system event during POST /servicing/expiration-sweeps"
        actor: system
        preconditions: ["loan.balance_status == DELINQUENT", "clock_date > loan.promo_expires_on + CHARGE_OFF_DAYS(120)"]
        side_effects:
          - "removes the loan from Consumer.existing_program_debt_cents and Consumer.active_loan_count"
          - "recomputes Merchant.delinquency_rate_bps, portfolio_grade, termination_recommended"
      - from: CURRENT
        to: PAID_OFF
        trigger: "POST /payments that clears principal_balance_cents and capitalized_interest_cents"
        actor: ServicingAgent | Consumer
        preconditions: ["loan.balance_status == CURRENT", "principal_balance_cents + capitalized_interest_cents - amount_cents == 0"]
        side_effects: ["recomputes Consumer.existing_program_debt_cents and Consumer.active_loan_count"]

  - entity: Project
    initial_state: IN_PROGRESS
    terminal_states: [ABANDONED]
    transitions:
      - from: IN_PROGRESS
        to: SUBSTANTIALLY_COMPLETE
        trigger: "system re-derivation after POST /projects/{id}/milestones/{milestone_id}/verification with outcome=VERIFY"
        actor: system
        preconditions: ["project.verified_release_bps >= SUBSTANTIAL_COMPLETION_BPS(8000) after the verification"]
        side_effects: ["recomputes max_fundable_now_cents"]
        note: "COMPOUND: parent state derived from the aggregate of child milestone states."
      - from: SUBSTANTIALLY_COMPLETE
        to: IN_PROGRESS
        trigger: "system re-derivation after a verification with outcome=REJECT drops verified_release_bps below 8000"
        actor: system
        preconditions: ["project.completion_status == SUBSTANTIALLY_COMPLETE", "project.verified_release_bps < 8000 after the rejection"]
        side_effects: ["recomputes max_fundable_now_cents downward"]
      - from: IN_PROGRESS
        to: CERTIFIED_COMPLETE
        trigger: "POST /projects/{id}/completion-certification"
        actor: Consumer
        preconditions:
          - "project.completion_status IN {IN_PROGRESS, SUBSTANTIALLY_COMPLETE}"
          - "CONDITIONAL (mirrors validations priority 29): when TradeRule(merchant.trade_type).requires_completion_certificate == true, every milestone of the project has status IN {CLAIMED, VERIFIED} (no PENDING and no REJECTED milestone remains) and completion_certificate_ref is non-empty, else ERR_COMPLETION_CERTIFICATE_REQUIRED; when the flag is false neither clause is enforced and certification succeeds with PENDING milestones outstanding"
          - "the acting Consumer owns the project's LoanAccount"
        side_effects:
          - "sets completion_certificate_ref and certified_on; the staged-release cap rises from TradeRule.max_precompletion_release_bps to 10000 bps"
          - "recomputes max_fundable_now_cents"
      - from: SUBSTANTIALLY_COMPLETE
        to: CERTIFIED_COMPLETE
        trigger: "POST /projects/{id}/completion-certification"
        actor: Consumer
        preconditions: ["same as IN_PROGRESS -> CERTIFIED_COMPLETE"]
        side_effects: ["same as IN_PROGRESS -> CERTIFIED_COMPLETE"]
      - from: CERTIFIED_COMPLETE
        to: ABANDONED
        trigger: "system cascade from POST /dispute-cases/{id}/resolution with outcome=CONSUMER_FAVOR"
        actor: system
        preconditions: ["a DisputeCase on this project resolved RESOLVED_CONSUMER_FAVOR"]
        side_effects:
          - "clears completion_certificate_ref and certified_on; no further draws may be requested (ERR_INVALID_PROJECT_STATE)"
          - "recomputes settled_funded_cents, funded_pct_bps, max_fundable_now_cents (which becomes 0)"
      - from: IN_PROGRESS
        to: ABANDONED
        trigger: "system cascade from a consumer-favor dispute resolution"
        actor: system
        preconditions: ["a DisputeCase on this project resolved RESOLVED_CONSUMER_FAVOR"]
        side_effects: ["same as CERTIFIED_COMPLETE -> ABANDONED"]

  - entity: ProjectMilestone
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLAIMED
        trigger: "POST /projects/{id}/milestones/{milestone_id}/claim"
        actor: Merchant
        preconditions:
          - "milestone.status IN {PENDING, REJECTED}"
          - "project.completion_status != ABANDONED"
          - "merchant.enrollment_status == APPROVED"
        side_effects: ["sets claimed_at and evidence_ref"]
      - from: REJECTED
        to: CLAIMED
        trigger: "POST /projects/{id}/milestones/{milestone_id}/claim (re-claim after rejection)"
        actor: Merchant
        preconditions: ["milestone.status == REJECTED"]
        side_effects: ["sets claimed_at and a fresh evidence_ref"]
        note: "CYCLE: CLAIMED -> REJECTED -> CLAIMED may repeat without bound; rejection_count keeps incrementing."
      - from: CLAIMED
        to: VERIFIED
        trigger: "POST /projects/{id}/milestones/{milestone_id}/verification with outcome=VERIFY"
        actor: Consumer | ServicingAgent
        preconditions:
          - "milestone.status == CLAIMED"
          - "if milestone.requires_consumer_signoff == true the actor MUST be the owning Consumer, else ERR_CONSUMER_SIGNOFF_REQUIRED"
        side_effects:
          - "sets verified_at; adds release_pct_bps to Project.verified_release_bps and recomputes Project.max_fundable_now_cents"
          - "may bubble the project up to SUBSTANTIALLY_COMPLETE"
      - from: CLAIMED
        to: REJECTED
        trigger: "POST /projects/{id}/milestones/{milestone_id}/verification with outcome=REJECT"
        actor: Consumer | ServicingAgent
        preconditions: ["milestone.status == CLAIMED"]
        side_effects:
          - "increments rejection_count; clears verified_at"
          - "recomputes Project.verified_release_bps and max_fundable_now_cents; may bubble SUBSTANTIALLY_COMPLETE back to IN_PROGRESS"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /projects/{id}/milestones/{milestone_id}/verification with outcome=REJECT (verification rescinded)"
        actor: Consumer
        preconditions: ["milestone.status == VERIFIED", "milestone.is_funded == false"]
        side_effects: ["increments rejection_count; recomputes Project.verified_release_bps and max_fundable_now_cents"]
        note: "A funded milestone cannot be rescinded — ERR_MILESTONE_ALREADY_FUNDED."

  - entity: FundingDraw
    initial_state: REQUESTED
    terminal_states: [DENIED, REVERSED]
    transitions:
      - from: REQUESTED
        to: SETTLED
        trigger: "POST /funding-draws/{id}/settlement with decision=SETTLE"
        actor: ServicingAgent
        preconditions:
          - "draw.status == REQUESTED"
          - "merchant.enrollment_status == APPROVED"
          - "the draw's milestone is still VERIFIED, or CLAIMED while project.completion_status == CERTIFIED_COMPLETE"
          - "the merchant's trailing 7-day SETTLED volume including this draw is within TradeRule.velocity_cap_cents, else ERR_FUNDING_VELOCITY_EXCEEDED"
        side_effects:
          - "computes the FINAL variant (effective_discount_bps, volume_tier_credit_bps, merchant_discount_cents, holdback_withheld_cents, net_settlement_cents) per calculations.draw_settlement_economics"
          - "sets settled_on = clock date and released_by_user_id = X-User-ID"
          - "LEDGER SYNC: LoanAccount.principal_balance_cents += funded_amount_cents; total_funded_cents += funded_amount_cents; first_funding_on set when null"
          - "LEDGER SYNC: Merchant.funded_volume_cents += funded_amount_cents; Merchant.holdback_reserve_cents += holdback_withheld_cents; holdback_target_cents / reserve_coverage_bps recomputed"
          - "recomputes Project.settled_funded_cents, funded_pct_bps, max_fundable_now_cents and LoanAccount.accrued_deferred_interest_cents"
          - "increments LoanAccount.version by 1 and Merchant.version by 1"
        note: "BRANCH A of the fork — full ledger effects."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /funding-draws/{id}/settlement with decision=DENY, or system cascade from merchant suspension / termination"
        actor: ServicingAgent | system
        preconditions: ["draw.status == REQUESTED"]
        side_effects:
          - "records denial_reason_code; NO ledger effects — principal, reserve and volume are untouched"
          - "Project.max_fundable_now_cents recomputed upward because the pending draw no longer reserves headroom"
        note: "BRANCH B of the fork — divergent side-effect set: zero ledger movement."
      - from: SETTLED
        to: REVERSED
        trigger: "POST /funding-draws/{id}/reversal (operator-driven only)"
        actor: ServicingAgent
        preconditions:
          - "draw.status == SETTLED"
          - "loan.balance_status != CHARGED_OFF"
        side_effects:
          - "COMPENSATION: LoanAccount.principal_balance_cents -= funded_amount_cents; total_funded_cents -= funded_amount_cents"
          - "COMPENSATION: Merchant.funded_volume_cents -= funded_amount_cents; Merchant.holdback_reserve_cents -= holdback_withheld_cents (returned to the merchant); holdback_target_cents and reserve_coverage_bps recomputed"
          - "recomputes Project.settled_funded_cents, funded_pct_bps, max_fundable_now_cents; ProjectMilestone.is_funded returns to false so the milestone may be re-drawn"
          - "recomputes LoanAccount.accrued_deferred_interest_cents on the reduced balance from the reversal date forward"
          - "increments LoanAccount.version by 1 and Merchant.version by 1"
        note: |
          A consumer-favor dispute resolution NEVER reverses draws — it reduces
          LoanAccount.principal_balance_cents by chargeback_amount_cents and leaves
          Merchant.funded_volume_cents, holdback_target_cents and every SETTLED draw
          untouched. Reversing the draws as well would debit the same advance twice.

  - entity: DisputeCase
    initial_state: SUBMITTED
    terminal_states: [RESOLVED_CONSUMER_FAVOR, RESOLVED_MERCHANT_FAVOR]
    transitions:
      - from: SUBMITTED
        to: MERCHANT_RESPONSE_PENDING
        trigger: "POST /dispute-cases (the case is opened directly into the response window)"
        actor: system
        preconditions: ["the project has at least one SETTLED draw", "no other DisputeCase on this project is in a non-terminal status"]
        side_effects:
          - "sets opened_on = clock date and response_due_at = opened_on + MERCHANT_RESPONSE_DAYS(10) at 00:00:00Z"
          - "recomputes Project.disputed_amount_cents and Merchant.dispute_rate_bps, portfolio_grade, termination_recommended"
        note: "SUBMITTED is the write-time initial state; the create call leaves the row in MERCHANT_RESPONSE_PENDING."
      - from: MERCHANT_RESPONSE_PENDING
        to: RESOLVED_MERCHANT_FAVOR
        trigger: "POST /dispute-cases/{id}/resolution with outcome=MERCHANT_FAVOR"
        actor: ServicingAgent
        preconditions:
          - "case.status == MERCHANT_RESPONSE_PENDING"
          - "case.merchant_responded_at IS NOT NULL and case.response_type == WORK_COMPLETE_EVIDENCE"
          - "the acting ServicingAgent is not the released_by_user_id of any SETTLED draw on this project, else ERR_SEGREGATION_OF_DUTIES"
          - "expected_merchant_version matches Merchant.version"
        side_effects:
          - "chargeback_amount_cents stays 0; no reserve, receivable or write-off movement"
          - "recomputes Project.disputed_amount_cents and Merchant.dispute_rate_bps / portfolio_grade"
          - "increments Merchant.version by 1"
        note: "BRANCH A — the merchant keeps the funds; the case becomes reopenable for 30 days."
      - from: MERCHANT_RESPONSE_PENDING
        to: RESOLVED_CONSUMER_FAVOR
        trigger: "POST /dispute-cases/{id}/resolution with outcome=CONSUMER_FAVOR"
        actor: ServicingAgent
        preconditions:
          - "case.status IN {MERCHANT_RESPONSE_PENDING, ESCALATED_NO_RESPONSE}"
          - "the acting ServicingAgent is not the released_by_user_id of any SETTLED draw on this project"
          - "expected_merchant_version matches Merchant.version"
        side_effects:
          - "CASCADE hop 1: chargeback_amount_cents computed per calculations.chargeback_allocation_waterfall and split across chargeback_absorbed_from_reserve_cents / chargeback_receivable_cents / chargeback_write_off_cents"
          - "CASCADE hop 2 (caused by hop 1): Merchant.holdback_reserve_cents -= absorbed; settlement_offset_receivable_cents += receivable; program_write_off_cents += write_off; reserve_coverage_bps recomputed"
          - "CASCADE hop 3 (caused by hop 2): when reserve_coverage_bps < RESERVE_SUSPENSION_BPS(5000) the Merchant transitions APPROVED -> SUSPENDED with suspension_reason_code = RESERVE_COVERAGE"
          - "CASCADE hop 4 (caused by hop 3): every ACTIVE MerchantPromotionEnrollment becomes SUSPENDED and every REQUESTED FundingDraw of that merchant becomes DENIED with denial_reason_code = MERCHANT_SUSPENDED"
          - "LoanAccount.principal_balance_cents -= chargeback_amount_cents effective on resolved_on; accrued_deferred_interest_cents recomputed forward from that date (not retroactively)"
          - "Project.completion_status -> ABANDONED; Project.disputed_amount_cents recomputed"
          - "increments Merchant.version by 1 and LoanAccount.version by 1"
        note: "BRANCH B — four-hop transitive cascade, each hop caused by the previous one."
      - from: MERCHANT_RESPONSE_PENDING
        to: ESCALATED_NO_RESPONSE
        trigger: "system event during POST /servicing/expiration-sweeps"
        actor: system
        preconditions: ["case.status == MERCHANT_RESPONSE_PENDING", "clock >= case.response_due_at", "case.merchant_responded_at IS NULL"]
        side_effects: ["the merchant response window is closed; only CONSUMER_FAVOR resolution remains reachable"]
      - from: ESCALATED_NO_RESPONSE
        to: RESOLVED_CONSUMER_FAVOR
        trigger: "POST /dispute-cases/{id}/resolution with outcome=CONSUMER_FAVOR"
        actor: ServicingAgent
        preconditions: ["case.status == ESCALATED_NO_RESPONSE", "expected_merchant_version matches Merchant.version"]
        side_effects: ["identical cascade to MERCHANT_RESPONSE_PENDING -> RESOLVED_CONSUMER_FAVOR"]
        note: "An ESCALATED_NO_RESPONSE case may NOT resolve MERCHANT_FAVOR — ERR_INVALID_DISPUTE_STATE."

  - entity: FraudAlert
    initial_state: OPEN
    terminal_states: [CONFIRMED, CLEARED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /merchants/{id}/fraud-alerts/{alert_id}/investigation with outcome=CONFIRMED"
        actor: RiskAnalyst
        preconditions:
          - "alert.status == OPEN"
          - "X-User-ID != merchant.approved_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "CASCADE hop 1: Merchant.phantom_risk_score recomputed with this alert at full severity_weight (OPEN alerts count at half weight)"
          - "CASCADE hop 2 (caused by hop 1): risk_tier, portfolio_grade and termination_recommended recomputed; when phantom_risk_score >= FRAUD_SUSPENSION_SCORE(60) the Merchant transitions APPROVED -> SUSPENDED with suspension_reason_code = FRAUD_CONFIRMED"
          - "CASCADE hop 3 (caused by hop 2): every ACTIVE MerchantPromotionEnrollment becomes SUSPENDED and every REQUESTED FundingDraw becomes DENIED"
          - "increments Merchant.version by 1"
      - from: OPEN
        to: CLEARED
        trigger: "POST /merchants/{id}/fraud-alerts/{alert_id}/investigation with outcome=CLEARED"
        actor: RiskAnalyst
        preconditions: ["alert.status == OPEN", "X-User-ID != merchant.approved_by_user_id"]
        side_effects:
          - "Merchant.phantom_risk_score recomputed dropping this alert entirely (CLEARED alerts contribute 0)"
          - "risk_tier, portfolio_grade, termination_recommended and holdback_target_cents recomputed"
          - "increments Merchant.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# Each entry passes the serial-observability filter: a second sequential request
# with the same payload would legitimately succeed under the product semantics,
# so only a stale-version check makes the outcome deterministic.
# =============================================================================
concurrency_rules:
  - rule_id: holdback-adjustment-stale-merchant
    parent_entity: Merchant
    write_endpoint: "POST /merchants/{id}/holdback-adjustments"
    occ_field: "expected_merchant_version"
    description: |
      A reserve DEPOSIT or RELEASE carrying a Merchant.version that has already
      advanced (for example because a draw settled and withheld holdback, or a
      chargeback absorbed reserve) is rejected. Reserve adjustments are
      legitimately repeatable — the same DEPOSIT amount may be posted twice on
      purpose — so no state precondition can distinguish an intentional second
      adjustment from one computed against a stale reserve balance; only the
      version check can.
    error_id: ERR_STALE_MERCHANT_VERSION
    http_status: 412
  - rule_id: funding-draw-create-stale-loan-account
    parent_entity: LoanAccount
    write_endpoint: "POST /funding-draws"
    occ_field: "expected_loan_account_version"
    description: |
      A draw request whose expected_loan_account_version predates the account's
      current version is rejected. Draw creation against a different verified
      milestone is legitimately repeatable, so the staged-funding headroom the
      client used to size requested_amount_cents may already have been consumed
      by an earlier settlement; the version check turns that stale view into a
      deterministic 412 instead of an over-draw.
    error_id: ERR_STALE_LOAN_ACCOUNT_VERSION
    http_status: 412
  - rule_id: dispute-resolution-stale-merchant
    parent_entity: Merchant
    write_endpoint: "POST /dispute-cases/{id}/resolution"
    occ_field: "expected_merchant_version"
    description: |
      Resolving a dispute consumes merchant reserve through the chargeback
      waterfall, and resolving a different case on the same merchant is
      legitimately repeatable, so a resolver working from a stale
      Merchant.version would allocate against reserve and receivable figures
      that no longer exist. The stale version is rejected before any waterfall
      bucket is written.
    error_id: ERR_STALE_MERCHANT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules — every money figure is integer cents, every rate is
# integer bps, every division is round_half_up unless the step says otherwise,
# and every multi-step formula pins its evaluation order explicitly.
# Tie-breaks and processing orders use `created_at` ascending; `id` is never a
# decision input.
# =============================================================================
calculations:

  - name: instant_credit_decision
    trigger: "POST /credit-applications (point-of-sale instant decision), and re-run on POST /credit-applications/{id}/acceptance to re-test DTI against the consumer's current program debt"
    algorithm: threshold
    input_set: |
      Consumer.fico_score, Consumer.annual_income_cents, Consumer.existing_program_debt_cents
      (recomputed over that consumer's LoanAccounts whose balance_status NOT IN
      {PAID_OFF, CHARGED_OFF}), the requested project_amount_cents, and the FICO tier
      table below. Applications belonging to other consumers are never included.
    constants:
      FICO_FLOOR: 620
      FICO_TIERS: "T1 fico >= 760 -> income_factor_bps 6000, tier_cap_cents 7500000; T2 700..759 -> 4500 / 5000000; T3 660..699 -> 3000 / 3000000; T4 620..659 -> 2000 / 1500000"
      DTI_CEILING_BPS: 4500
      COUNTER_OFFER_FLOOR_CENTS: 200000
      OFFER_VALIDITY_DAYS: 14
    formula: |
      STEP 1 (FICO gate, evaluated first):
        if fico_score < FICO_FLOOR:
            decision = DECLINED; approved_limit_cents = 0
            decision_reason_codes = [FICO_BELOW_FLOOR]
            decision_dti_bps = 0            # DTI is NOT computed when the FICO gate fails
            RETURN
      STEP 2 (tier selection): the first tier row whose fico band contains fico_score
        wins; bands are closed on both ends and do not overlap.
      STEP 3 (DTI, evaluated BEFORE the limit comparison):
        decision_dti_bps = round_half_up(
            (existing_program_debt_cents + project_amount_cents) * 10000
            / annual_income_cents )
        if decision_dti_bps > DTI_CEILING_BPS:
            decision = DECLINED; approved_limit_cents = 0
            decision_reason_codes = [DTI_ABOVE_CEILING]
            RETURN                          # a DTI failure is NEVER counter-offered
      STEP 4 (credit ceiling):
        income_ceiling_cents = round_half_up(annual_income_cents * income_factor_bps / 10000)
        credit_ceiling_cents = min(income_ceiling_cents, tier_cap_cents)
      STEP 5 (ticket comparison, inclusive):
        if project_amount_cents <= credit_ceiling_cents:
            decision = APPROVED
            approved_limit_cents = credit_ceiling_cents   # the LINE, not the ticket
            decision_reason_codes = [WITHIN_LIMIT]
        elif credit_ceiling_cents >= COUNTER_OFFER_FLOOR_CENTS:
            decision = COUNTER_OFFERED
            approved_limit_cents = credit_ceiling_cents
            decision_reason_codes = [LIMIT_BELOW_TICKET]
        else:
            decision = DECLINED; approved_limit_cents = 0
            decision_reason_codes = [LIMIT_BELOW_TICKET]
      STEP 6: offer_expires_at = decision instant + OFFER_VALIDITY_DAYS days.
    precision: "integer cents, integer bps, round_half_up on both divisions; comparisons at STEP 3 use `>` (4500 passes) and at STEP 5 use `<=` (equal ticket passes)"
    worked_example: |
      fico 742 (T2: 4500 / 5000000), annual_income_cents 9600000,
      existing_program_debt_cents 0, project_amount_cents 3500000:
        dti = round_half_up(3500000 * 10000 / 9600000) = round_half_up(3645.8333) = 3646 <= 4500
        income_ceiling = round_half_up(9600000 * 4500 / 10000) = 4320000
        credit_ceiling = min(4320000, 5000000) = 4320000
        3500000 <= 4320000 -> APPROVED, approved_limit_cents = 4320000, [WITHIN_LIMIT]
      Same consumer, project_amount_cents 4320479:
        dti = round_half_up(4500.4989) = 4500 (passes) -> ticket > ceiling
        -> COUNTER_OFFERED at 4320000, [LIMIT_BELOW_TICKET]
      Same consumer, project_amount_cents 4320480 (one cent more):
        dti = round_half_up(4500.5000) = 4501 > 4500
        -> DECLINED, [DTI_ABOVE_CEILING], approved_limit_cents 0
        (STEP 3 precedes STEP 5, so the DTI failure masks the limit failure)

  - name: deferred_interest_accrual
    trigger: "recomputed on every draw settlement, draw reversal, payment, chargeback and expiration sweep; read through LoanAccount.accrued_deferred_interest_cents, deferred_interest_at_risk_cents, promo_payoff_cents and standard_payoff_cents"
    algorithm: chronological
    input_set: |
      The principal-balance timeline of ONE LoanAccount: every event that changes
      principal_balance_cents (SETTLED draws in settled_on order, REVERSED draws at
      their reversal date, principal-applied payments in posted_on order, consumer-favor
      chargebacks at resolved_on). Events sharing a date are applied in `created_at`
      ascending order. DENIED and REQUESTED draws contribute nothing.
    constants:
      DAY_COUNT_BASIS: 365
      ACCRUAL_INTERVAL_SEMANTICS: "half-open [segment_start_date, segment_end_date) — the event date itself begins the new balance and is not charged at the old balance"
    formula: |
      Build segments from first_funding_on to the as-of date:
        segments = [(balance_i, days_i)] where days_i = segment_end - segment_start in
        whole days and balance_i is principal_balance_cents during that segment.
      EXACT SUM FIRST, ROUND ONCE LAST (pinned):
        numerator = SUM_over_i( balance_i * apr_bps * days_i )
        accrued_deferred_interest_cents = round_half_up(numerator / (10000 * 365))
      Rounding each segment and then summing is WRONG and is observably different.
      As-of dates:
        - normal read: as-of = current logical clock date (exclusive)
        - capitalization: as-of = promo_expires_on + 1 day, so the final promotional
          day accrues
    precision: "single round_half_up applied to the fully accumulated rational numerator; never per segment"
    variants:
      - name: promo_satisfied
        when: "principal_balance_cents reaches 0 on or before promo_expires_on (inclusive) — promo_status becomes PROMO_SATISFIED"
        difference: |
          The whole accrual is FORGIVEN: waived_interest_cents = accrued balance at that
          instant, accrued_deferred_interest_cents = 0, capitalized_interest_cents stays
          0, and promo_payoff_cents (= principal only) is the amount that settles the
          account.
      - name: promo_expired_capitalized
        when: "the expiration sweep runs with clock date > promo_expires_on and principal_balance_cents > 0"
        difference: |
          The whole accrual is CHARGED: capitalized_interest_cents = accrual through
          promo_expires_on + 1 day, accrued_deferred_interest_cents resets to 0,
          waived_interest_cents stays 0, apr_bps switches to
          PromotionPlan.post_promo_apr_bps, and standard_payoff_cents
          (= principal + capitalized + newly accruing) becomes the settling amount.
    worked_example: |
      apr_bps 2699, draw 1000050 settled 2026-08-10, draw 1400000 settled 2026-09-05.
      As of 2026-10-01: segments (1000050, 26 days) and (2400050, 26 days).
        numerator = 26*1000050 + 26*2400050 = 88402600 (balance-days)
        accrued = round_half_up(88402600 * 2699 / 3650000) = round_half_up(65369.4842)
                = 65369
        (per-segment rounding would give 19227 + 46143 = 65370 — one cent adrift)
      As of 2027-08-02 (promo_expires_on 2027-08-01 + 1 day):
        segments (1000050, 26) and (2400050, 331) -> numerator 820417850
        accrued = round_half_up(606659.6...) = 606660
        promo_expired_capitalized -> capitalized_interest_cents = 606660
      Paying 2400050 on 2027-08-01 instead: accrual to that date is 604885, all of it
      waived; promo_payoff_cents = 2400050; capitalized_interest_cents stays 0.

  - name: draw_settlement_economics
    trigger: "PROVISIONAL variant at POST /funding-draws; FINAL variant at POST /funding-draws/{id}/settlement with decision=SETTLE"
    algorithm: tiered_pricing
    input_set: |
      The draw's funded_amount_cents, its settlement_speed, the governing
      PromotionPlan.merchant_discount_bps, the MerchantPromotionEnrollment
      negotiated_discount_bps for (merchant, plan) when the enrollment is ACTIVE, the
      TradeRule row for merchant.trade_type, and — FINAL variant only — the merchant's
      trailing-90-day SETTLED funded volume EXCLUDING this draw (settled_on within
      [clock_date - 90 days, clock_date), draws in REQUESTED, DENIED or REVERSED never
      count).
    constants:
      SPEED_SURCHARGE_BPS: "NEXT_DAY 75, STANDARD_3DAY 0"
      VOLUME_TIER_CREDIT_BPS: "trailing90 >= 50000000 -> 40; >= 20000000 -> 25; >= 5000000 -> 10; otherwise 0"
    formula: |
      PROVISIONAL (write-time estimate, plan rates only, speed ignored):
        provisional_discount_cents  = round_half_up(funded * PromotionPlan.merchant_discount_bps / 10000)
        provisional_holdback_cents  = round_half_up(funded * TradeRule.holdback_pct_bps / 10000)
        provisional_net_settlement_cents = funded - provisional_discount_cents - provisional_holdback_cents

      FINAL (settlement, negotiated rate + speed surcharge - volume credit):
        effective_discount_bps  = enrollment.negotiated_discount_bps ?? PromotionPlan.merchant_discount_bps
        speed_bps               = SPEED_SURCHARGE_BPS[settlement_speed]
        volume_tier_credit_bps  = first matching VOLUME_TIER_CREDIT_BPS row
        PINNED COMPOSITION (mode a — component-wise, three independent roundings):
          merchant_discount_cents = round_half_up(funded * effective_discount_bps / 10000)
                                  + round_half_up(funded * speed_bps / 10000)
                                  - round_half_up(funded * volume_tier_credit_bps / 10000)
        holdback_withheld_cents  = calculations.holdback_reserve_target (see below)
        net_settlement_cents     = funded - merchant_discount_cents - holdback_withheld_cents

      REJECTED ALTERNATIVES (both are observably different and MUST NOT be used):
        mode b — collapse the rates first:
          round_half_up(funded * (effective + speed - volume_credit) / 10000)
        mode c — round the rate sum to whole percent before applying it.
    precision: "each of the three FINAL components is rounded half-up independently before the additive combination; the volume credit may not push merchant_discount_cents below 0 (floor at 0)"
    variants:
      - name: provisional
        when: "at draw creation, before any servicing review"
        difference: "uses the PLAN discount rate, ignores settlement_speed and volume tiers, and computes holdback from TradeRule.holdback_pct_bps alone with no reserve-target gap and no per-draw cap"
      - name: final
        when: "at settlement, when the money actually moves"
        difference: "uses the NEGOTIATED discount rate plus the speed surcharge minus the volume-tier credit, and computes holdback through the six-step reserve-target algorithm; the delta between the two variants is the reconciliation figure"
    worked_example: |
      Draw 1 — funded 1000050, NEXT_DAY, plan rate 525, negotiated 449,
      TradeRule.holdback_pct_bps 500, trailing90 (excluding this draw) 0:
        PROVISIONAL: discount round_half_up(52502.625) = 52503
                     holdback round_half_up(50002.5)  = 50003
                     net = 1000050 - 52503 - 50003 = 897544
        FINAL:  volume_tier_credit_bps = 0 (trailing90 0 < 5000000)
                discount = round_half_up(44902.245) + round_half_up(7500.375) - 0
                         = 44902 + 7500 = 52402
                (mode b would give round_half_up(1000050 * 524 / 10000)
                 = round_half_up(52402.62) = 52403 — one cent higher)
                holdback = 40002 (see holdback_reserve_target)
                net = 1000050 - 52402 - 40002 = 907646
        reconciliation delta = 907646 - 897544 = 10102
      Draw 2 — funded 1400000, STANDARD_3DAY, trailing90 = 1000050 -> credit 0:
        FINAL: discount = round_half_up(62860.0) + 0 - 0 = 62860
               holdback = 56000, net = 1400000 - 62860 - 56000 = 1281140

  - name: holdback_reserve_target
    trigger: "FINAL variant of every draw settlement; also recomputed (target only) after reversals, chargebacks, reserve adjustments and risk-tier changes"
    algorithm: constraint_propagation
    input_set: |
      Merchant.holdback_reserve_cents (current balance), the merchant's trailing-180-day
      SETTLED funded volume INCLUDING the draw being settled (settled_on within
      [clock_date - 180 days, clock_date]), Merchant.risk_tier, and
      TradeRule.holdback_pct_bps.
    constants:
      TARGET_BPS_BY_RISK_TIER: "LOW 200, STANDARD 400, ELEVATED 700, HIGH 1200"
      HOLDBACK_CAP_BPS_OF_DRAW: 1500
      TRAILING_TARGET_WINDOW_DAYS: 180
    formula: |
      PINNED SIX-STEP ORDER (reordering any pair changes the result):
        1. trailing180_including_this_draw = SETTLED volume in the window + funded_amount_cents
        2. target_after_cents = round_half_up(trailing180_including_this_draw
                                              * TARGET_BPS_BY_RISK_TIER[risk_tier] / 10000)
        3. gap_cents = max(0, target_after_cents - Merchant.holdback_reserve_cents)
        4. base_withhold_cents = round_half_up(funded_amount_cents
                                              * TradeRule.holdback_pct_bps / 10000)
        5. per_draw_cap_cents = round_half_up(funded_amount_cents
                                              * HOLDBACK_CAP_BPS_OF_DRAW / 10000)
        6. holdback_withheld_cents = min(base_withhold_cents, gap_cents, per_draw_cap_cents)
      Then, as a consequence of settlement:
        Merchant.holdback_reserve_cents += holdback_withheld_cents
        Merchant.holdback_target_cents   = target_after_cents
        Merchant.reserve_coverage_bps    = round_half_up(holdback_reserve_cents * 10000
                                                         / holdback_target_cents)
                                           or 10000 when holdback_target_cents == 0
      ORDER SENSITIVITY (all wrong, all observably different):
        - computing the target from volume EXCLUDING the current draw makes the first
          draw of a merchant withhold 0 forever
        - applying the per-draw cap before the target gap yields the base rate whenever
          the cap is loose
        - rounding the target after subtracting the reserve instead of before
    precision: "round_half_up at steps 2, 4, 5 and on reserve_coverage_bps; the min() at step 6 is exact"
    worked_example: |
      risk_tier STANDARD (400 bps), TradeRule.holdback_pct_bps 500.
      Draw 1, funded 1000050, reserve 0, prior trailing180 volume 0:
        trailing180 = 1000050; target_after = round_half_up(40002.0) = 40002
        gap = 40002; base = round_half_up(50002.5) = 50003;
        cap = round_half_up(150007.5) = 150008
        withheld = min(50003, 40002, 150008) = 40002  (the GAP binds)
        reserve -> 40002; target -> 40002; coverage_bps -> 10000
      Draw 2, funded 1400000, reserve 40002:
        trailing180 = 1000050 + 1400000 = 2400050; target_after = 96002
        gap = 96002 - 40002 = 56000; base = 70000; cap = 210000
        withheld = min(70000, 56000, 210000) = 56000  (the GAP binds again)
        reserve -> 96002; target -> 96002; coverage_bps -> 10000

  - name: staged_funding_availability
    trigger: "POST /funding-draws (fiscal gate on requested_amount_cents) and every recompute of Project.max_fundable_now_cents"
    algorithm: threshold
    input_set: |
      The project's milestones with status == VERIFIED (PENDING, CLAIMED and REJECTED
      milestones release nothing), the project's SETTLED draws, the project's REQUESTED
      draws (pending draws reserve headroom), Project.completion_status and the
      TradeRule row for the merchant's trade_type.
    constants:
      CERTIFIED_RELEASE_BPS: 10000
      SUBSTANTIAL_COMPLETION_BPS: 8000
    formula: |
      verified_release_bps = SUM(release_pct_bps of milestones with status == VERIFIED)
      completion_cap_bps =
          CERTIFIED_RELEASE_BPS                        if completion_status == CERTIFIED_COMPLETE
          TradeRule.max_precompletion_release_bps      otherwise
      release_cap_bps = min(verified_release_bps, completion_cap_bps)
      releasable_cents = round_half_up(contract_amount_cents * release_cap_bps / 10000)
      max_fundable_now_cents = max(0, releasable_cents
                                      - settled_funded_cents
                                      - SUM(requested_amount_cents of REQUESTED draws))
      GATE: requested_amount_cents <= max_fundable_now_cents  (inclusive — an exactly
      exhausting draw is allowed; one cent more raises ERR_STAGED_FUNDING_LIMIT_EXCEEDED)
    precision: "round_half_up on releasable_cents; the gate comparison is `<=` on exact integers"
    worked_example: |
      contract 3500000, ROOFING max_precompletion_release_bps 7000,
      milestone 1 release_pct_bps 3000, milestone 2 release_pct_bps 7000.
      Only milestone 1 VERIFIED, IN_PROGRESS:
        release_cap = min(3000, 7000) = 3000 -> releasable 1050000
        max_fundable_now = 1050000; a draw of 1050000 is allowed, 1050001 is not.
      Both milestones VERIFIED, SUBSTANTIALLY_COMPLETE, 1000050 already settled:
        release_cap = min(10000, 7000) = 7000 -> releasable 2450000
        max_fundable_now = 2450000 - 1000050 = 1449950
      After CERTIFIED_COMPLETE with 2400050 settled:
        release_cap = min(10000, 10000) = 10000 -> releasable 3500000
        max_fundable_now = 3500000 - 2400050 = 1099950

  - name: funding_velocity_window
    trigger: "POST /funding-draws/{id}/settlement with decision=SETTLE, before any ledger movement"
    algorithm: interval_merge
    input_set: |
      All SETTLED draws of the merchant whose settled_on falls in the ROLLING window
      [clock_date - 6 days, clock_date] — a CLOSED 7-calendar-day window that includes
      both endpoints — plus the draw being settled. REVERSED draws are excluded from the
      window even if they settled inside it.
    constants:
      VELOCITY_WINDOW_DAYS: 7
      WINDOW_SEMANTICS: "closed [clock_date - 6 days, clock_date]; a draw settled exactly 7 days ago has already left the window"
    formula: |
      window_volume_cents = SUM(funded_amount_cents of qualifying SETTLED draws)
                          + funded_amount_cents of this draw
      if window_volume_cents > TradeRule.velocity_cap_cents:
          raise ERR_FUNDING_VELOCITY_EXCEEDED   # strict `>`; equal to the cap passes
    precision: "exact integer comparison, no rounding; the boundary is `>` so a draw that lands exactly on velocity_cap_cents settles"
    worked_example: |
      ROOFING velocity_cap_cents 15000000. Draws of 1000050 (2026-08-10) and 1400000
      (2026-09-05) never share a window, so window_volume equals each draw alone.
      Three same-day draws of 5000000 each: the first two settle (10000000), the third
      would make 15000000 which equals the cap and therefore also settles; a fourth of
      1 cent raises ERR_FUNDING_VELOCITY_EXCEEDED.

  - name: chargeback_allocation_waterfall
    trigger: "POST /dispute-cases/{id}/resolution with outcome=CONSUMER_FAVOR"
    algorithm: waterfall_allocation
    input_set: |
      DisputeCase.claimed_incomplete_amount_cents, Merchant.holdback_reserve_cents at
      resolution time, and the merchant's trailing-180-day SETTLED funded volume
      (settled_on within [resolved_on - 180 days, resolved_on]) which sizes the
      receivable cap. REVERSED and DENIED draws are excluded from that volume.
    constants:
      RECEIVABLE_CAP_BPS_OF_TRAILING_VOLUME: 5000
      RESERVE_SUSPENSION_BPS: 5000
    formula: |
      chargeback_amount_cents = claimed_incomplete_amount_cents
      BUCKET 1 — merchant reserve (fills first, exactly):
        chargeback_absorbed_from_reserve_cents = min(chargeback_amount_cents,
                                                    Merchant.holdback_reserve_cents)
      BUCKET 2 — merchant receivable, capped:
        remainder_1 = chargeback_amount_cents - chargeback_absorbed_from_reserve_cents
        receivable_cap_cents = round_half_up(trailing180_settled_volume_cents
                                             * RECEIVABLE_CAP_BPS_OF_TRAILING_VOLUME / 10000)
        chargeback_receivable_cents = min(remainder_1, receivable_cap_cents)
      BUCKET 3 — program write-off (absorbs the overflow, never negative):
        chargeback_write_off_cents = remainder_1 - chargeback_receivable_cents
      CONSERVATION INVARIANT (must hold exactly, no rounding slack):
        absorbed + receivable + write_off == chargeback_amount_cents
      Ledger consequences, in this order:
        Merchant.holdback_reserve_cents            -= absorbed
        Merchant.settlement_offset_receivable_cents += receivable
        Merchant.program_write_off_cents            += write_off
        Merchant.reserve_coverage_bps recomputed against the UNCHANGED holdback_target_cents
        LoanAccount.principal_balance_cents         -= chargeback_amount_cents
        if reserve_coverage_bps < RESERVE_SUSPENSION_BPS: Merchant APPROVED -> SUSPENDED
    precision: "round_half_up only on receivable_cap_cents; every bucket subtraction is exact so the three buckets always re-sum to the claim"
    worked_example: |
      reserve 96002, trailing180 volume 2400050, claim 2400050:
        absorbed = min(2400050, 96002) = 96002
        remainder_1 = 2304048
        cap = round_half_up(2400050 * 5000 / 10000) = 1200025
        receivable = min(2304048, 1200025) = 1200025
        write_off = 2304048 - 1200025 = 1104023
        96002 + 1200025 + 1104023 = 2400050 (conserved)
        reserve -> 0, coverage_bps -> 0 < 5000 -> merchant SUSPENDED
      Same state, claim 40000:
        absorbed 40000, remainder_1 0, receivable 0, write_off 0
        reserve -> 56002, coverage_bps = round_half_up(56002 * 10000 / 96002)
                 = round_half_up(5833.42) = 5833 >= 5000 -> NO suspension
      Boundary: claim 48005 -> reserve 47997 -> coverage round_half_up(4999.583) = 5000
                -> no suspension; claim 48006 -> reserve 47996
                -> coverage round_half_up(4999.479) = 4999 -> SUSPENDED

  - name: payment_application_waterfall
    trigger: "POST /payments"
    algorithm: waterfall_allocation
    input_set: "The target LoanAccount's capitalized_interest_cents and principal_balance_cents at posting time. accrued_deferred_interest_cents is NOT payable while promo_status == PROMO_ACTIVE — that is the whole point of a deferred-interest promotion."
    constants:
      CURE_PAYMENT_BPS: 500
    formula: |
      BUCKET 1 — capitalized interest (0 while PROMO_ACTIVE):
        applied_to_capitalized_interest_cents = min(amount_cents, capitalized_interest_cents)
      BUCKET 2 — principal:
        applied_to_principal_cents = amount_cents - applied_to_capitalized_interest_cents
      OVERPAYMENT GATE (checked before either bucket is written):
        if amount_cents > capitalized_interest_cents + principal_balance_cents:
            raise ERR_PAYMENT_EXCEEDS_PAYOFF
      resulting_principal_balance_cents = principal_balance_cents - applied_to_principal_cents
      Status consequences:
        - principal reaches 0 on or before promo_expires_on -> promo_status PROMO_SATISFIED,
          waived_interest_cents = accrued_deferred_interest_cents, accrued reset to 0
        - capitalized_interest_cents and principal both 0 -> balance_status PAID_OFF
        - DELINQUENT and amount_cents >= round_half_up((principal_balance_cents
          + capitalized_interest_cents) * CURE_PAYMENT_BPS / 10000) -> balance_status CURRENT
    precision: "exact integer allocation; round_half_up only on the cure threshold"
    worked_example: |
      PROMO_ACTIVE, principal 2400050, capitalized 0, accrued 604885, payment 2400050
      on 2027-08-01 (promo_expires_on): bucket 1 = 0, bucket 2 = 2400050,
      resulting principal 0 -> PROMO_SATISFIED, waived_interest_cents 604885, PAID_OFF.
      After capitalization instead (capitalized 606660, principal 2400050): the same
      2400050 payment applies 606660 to interest and 1793390 to principal, leaving
      principal 606660 and the account NOT paid off.

  - name: merchant_portfolio_performance
    trigger: "recomputed after every draw settlement or reversal, dispute filing or resolution, loan status change, reserve movement and fraud-alert investigation"
    algorithm: weighted_scoring
    input_set: |
      All LoanAccounts whose merchant_id is this merchant (every balance_status counts in
      the denominator), all DisputeCases of this merchant with status IN {SUBMITTED,
      MERCHANT_RESPONSE_PENDING, ESCALATED_NO_RESPONSE, RESOLVED_CONSUMER_FAVOR}
      (RESOLVED_MERCHANT_FAVOR cases are excluded), and Merchant.phantom_risk_score.
    constants:
      GRADE_TABLE: "A: dispute<=200 AND delinq<=300 AND phantom<=20; B: dispute<=500 AND delinq<=700 AND phantom<=40; C: dispute<=1000 AND delinq<=1500 AND phantom<=60; otherwise D"
      MIN_SEASONED_DRAWS: 5
      TERMINATION_DISPUTE_RATE_BPS: 2500
      FRAUD_SUSPENSION_SCORE: 60
    formula: |
      loan_count = COUNT(LoanAccount where merchant_id == merchant.id)
      if loan_count == 0: dispute_rate_bps = 0 and delinquency_rate_bps = 0
      else:
        dispute_rate_bps     = round_half_up(counted_disputes * 10000 / loan_count)
        delinquency_rate_bps = round_half_up(
            COUNT(LoanAccount with balance_status IN {DELINQUENT, CHARGED_OFF})
            * 10000 / loan_count)
      portfolio_grade = the FIRST row of GRADE_TABLE whose three conditions ALL hold,
        evaluated strictly A -> B -> C, else D. (An otherwise-clean merchant with
        phantom_risk_score 41 is a C, not an A: every condition of a row must hold.)
      risk_tier:
        STANDARD                                   if COUNT(SETTLED draws) < MIN_SEASONED_DRAWS
        else A -> LOW, B -> STANDARD, C -> ELEVATED, D -> HIGH
        (an unseasoned merchant is held at the STANDARD reserve rate no matter how clean
         its grade looks — this is why the very first draw of a new merchant withholds
         400 bps rather than 200 bps)
      termination_recommended = (portfolio_grade == D)
                             OR (phantom_risk_score >= FRAUD_SUSPENSION_SCORE)
                             OR (dispute_rate_bps >= TERMINATION_DISPUTE_RATE_BPS)
    precision: "round_half_up on both rate divisions; grade comparisons are inclusive (`<=`)"
    worked_example: |
      1 LoanAccount, 0 disputes, 0 delinquent, phantom 0, 2 SETTLED draws:
        dispute_rate 0, delinquency_rate 0 -> grade A, but 2 < 5 SETTLED draws so
        risk_tier = STANDARD (400 bps target), termination_recommended false.
      Same merchant after one RESOLVED_CONSUMER_FAVOR dispute:
        dispute_rate_bps = round_half_up(1 * 10000 / 1) = 10000 -> grade D
        (still risk_tier STANDARD — unseasoned), termination_recommended true.

  - name: phantom_fraud_score
    trigger: "recomputed on FraudAlert creation and on every investigation outcome; the SYSTEM detector also runs inside POST /funding-draws/{id}/settlement"
    algorithm: weighted_scoring
    input_set: "All FraudAlert rows of the merchant. CONFIRMED alerts count at full severity_weight, OPEN alerts at half weight, CLEARED alerts at zero."
    constants:
      OPEN_ALERT_WEIGHT_DIVISOR: 2
      SCORE_CEILING: 100
      SYSTEM_ALERT_SEVERITY_WEIGHT: 40
      FRAUD_SUSPENSION_SCORE: 60
    formula: |
      confirmed_total = SUM(severity_weight where status == CONFIRMED)
      open_total      = SUM(severity_weight where status == OPEN)
      PINNED: halve the AGGREGATE once, not each alert:
        phantom_risk_score = min(SCORE_CEILING,
            confirmed_total + round_half_up(open_total / OPEN_ALERT_WEIGHT_DIVISOR))
      (Halving per alert and then summing is WRONG: two OPEN alerts of weight 35 give
       round_half_up(70/2) = 35 under the pinned rule but 18 + 18 = 36 per-alert.)
      SYSTEM DETECTOR (minted during draw settlement, source = SYSTEM,
      alert_type = PRE_COMPLETION_FULL_DRAW, severity_weight = 40):
        fires when, AFTER this settlement,
          project.settled_funded_cents * 10000
            >= TradeRule.max_precompletion_release_bps * project.contract_amount_cents
          AND project.completion_status != CERTIFIED_COMPLETE
        The comparison is cross-multiplied integer arithmetic with NO rounding, so the
        boundary is exact. At most one SYSTEM alert of this type may be OPEN per project.
      CASCADE: whenever phantom_risk_score >= FRAUD_SUSPENSION_SCORE and the merchant is
      APPROVED, the merchant transitions to SUSPENDED with
      suspension_reason_code = FRAUD_CONFIRMED.
    precision: "single round_half_up applied to open_total / 2; the score is clamped to [0, 100]"
    worked_example: |
      contract 3500000, ROOFING max_precompletion_release_bps 7000, settled 2400050:
        2400050 * 10000 = 24000500000 < 7000 * 3500000 = 24500000000 -> no alert
      A third draw of 49950 settles (settled 2450000):
        24500000000 >= 24500000000 -> SYSTEM PRE_COMPLETION_FULL_DRAW alert, weight 40
        phantom_risk_score = 0 + round_half_up(40/2) = 20 (still below 60)
      An analyst adds an OPEN PHANTOM_PROJECT alert of weight 35:
        score = 0 + round_half_up(75/2) = round_half_up(37.5) = 38
      Confirming the weight-40 SYSTEM alert:
        score = 40 + round_half_up(35/2) = 40 + 18 = 58 -> still no suspension
      Confirming the weight-35 alert as well:
        score = 75 >= 60 -> merchant SUSPENDED (FRAUD_CONFIRMED)
      A third draw of 49949 instead (settled 2449999): 24499990000 < 24500000000 -> no
      SYSTEM alert at all.

# =============================================================================
# §1.4 Validation Rules — evaluated top to bottom on EVERY request. The first
# rule whose condition is violated wins and short-circuits: no later rule runs
# and no side effect is written. Domain ordering inside the business band is
# safety/compliance -> referential -> constraint -> temporal -> fiscal, because a
# consumer-protection defect (undisclosed deferred interest, unverified license)
# is a regulatory finding while a fiscal defect is only money.
# =============================================================================
validations:

  # ---- auth band -------------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the six §1.7 roles; X-User-ID header present and non-empty on every non-GET request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's `roles:` list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  # ---- schema band -----------------------------------------------------------
  - priority: 3
    category: existence
    check: "request body parses; every required input field is present; enums are members of their declared set; *_cents and *_bps integers are >= 0 (and > 0 where §1.1 says so); ISO dates match YYYY-MM-DD and instants end in Z"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "date-range coherence within one payload: MerchantLicense.effective_from < expires_on (half-open, so equal dates describe an empty interval), MerchantPromotionEnrollment.window_start_date <= window_end_date (closed, so equal dates describe a one-day window)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /merchants/{id}/licenses, POST /merchants/{id}/promotion-enrollments, POST /promotion-plans"

  # ---- existence band --------------------------------------------------------
  - priority: 5
    category: existence
    check: "path identifiers resolve, validated LEFT TO RIGHT: the merchant before the license, the project before the milestone, the application before its sub-resource"
    error_id: "ERR_MERCHANT_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_LOAN_ACCOUNT_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_DRAW_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_ALERT_NOT_FOUND"
    http_status: 404
    applies_to: "all paths carrying an identifier"
  - priority: 6
    category: existence
    check: "body foreign keys resolve, validated in payload-declaration order: consumer_id, merchant_id, promotion_plan_id, loan_account_id, project_milestone_id, project_id, reopens_case_id; then, LAST in this band, the TradeRule row for the acting merchant's trade_type must exist whenever a trade-specific rule is about to be applied (enrollment approval, application ticket ceiling, draw settlement)"
    error_id: "ERR_CONSUMER_NOT_FOUND | ERR_MERCHANT_NOT_FOUND | ERR_PROMOTION_PLAN_NOT_FOUND | ERR_LOAN_ACCOUNT_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_TRADE_RULE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /credit-applications, POST /projects, POST /funding-draws, POST /funding-draws/{id}/settlement, POST /dispute-cases, POST /merchants/{id}/promotion-enrollments, POST /merchants/{id}/enrollment-decision, POST /payments"

  # ---- identity / scope band -------------------------------------------------
  - priority: 7
    category: auth
    check: "for the entity-backed roles, X-User-ID resolves to an existing row: role Merchant -> a Merchant.id, role Consumer -> a Consumer.id"
    error_id: ERR_IDENTITY_UNKNOWN
    http_status: 403
    applies_to: "every endpoint whose roles include Merchant or Consumer"
  - priority: 8
    category: auth
    check: "role Merchant may only act on its own merchant_id: the path merchant, the application's merchant, the milestone's project's merchant, the draw's merchant, the dispute's merchant"
    error_id: ERR_MERCHANT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose roles include Merchant"
  - priority: 9
    category: auth
    check: "role Consumer may only act on its own consumer_id: the application's consumer, the loan account's consumer, the project's application's consumer, the milestone's project's consumer"
    error_id: ERR_CONSUMER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose roles include Consumer"
  - priority: 10
    category: business_safety
    check: "fraud-investigation segregation of duties: the RiskAnalyst X-User-ID closing an alert MUST NOT equal Merchant.approved_by_user_id for that merchant"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /merchants/{id}/fraud-alerts/{alert_id}/investigation"
  - priority: 11
    category: business_safety
    check: "dispute-resolution segregation of duties: the ServicingAgent X-User-ID resolving a case MUST NOT equal the released_by_user_id of ANY SETTLED FundingDraw on the disputed project"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /dispute-cases/{id}/resolution"

  # ---- optimistic concurrency band ------------------------------------------
  - priority: 12
    category: state
    check: "expected_merchant_version equals Merchant.version"
    error_id: ERR_STALE_MERCHANT_VERSION
    http_status: 412
    applies_to: "POST /merchants/{id}/holdback-adjustments, POST /dispute-cases/{id}/resolution"
  - priority: 13
    category: state
    check: "expected_loan_account_version equals LoanAccount.version"
    error_id: ERR_STALE_LOAN_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /funding-draws"

  # ---- state band ------------------------------------------------------------
  - priority: 14
    category: state
    check: "the merchant's enrollment_status admits the requested transition or dependent write (submission from DRAFT/DOCS_REQUIRED, decision from PENDING_REVIEW, SUSPEND/TERMINATE from APPROVED or SUSPENDED, REINSTATE from SUSPENDED, and APPROVED for every funding-side write)"
    error_id: ERR_INVALID_MERCHANT_STATE
    http_status: 409
    applies_to: "POST /merchants/{id}/enrollment-submission, .../enrollment-decision, .../program-action, .../promotion-enrollments, POST /credit-applications, POST /funding-draws, POST /funding-draws/{id}/settlement"
  - priority: 15
    category: state
    check: "the license is still UNVERIFIED when a verification decision arrives"
    error_id: ERR_LICENSE_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /merchants/{id}/licenses/{license_id}/verification"
  - priority: 16
    category: state
    check: "the application's decision dimension admits the operation: disclosure-delivery from NOT_SENT or EXPIRED_UNACKNOWLEDGED, acknowledgement from DELIVERED, acceptance from APPROVED or COUNTER_OFFERED; and a COUNTER_OFFERED application may only be accepted with accept_counter_offer == true, else ERR_COUNTER_OFFER_NOT_ACCEPTED"
    error_id: "ERR_INVALID_APPLICATION_STATE | ERR_COUNTER_OFFER_NOT_ACCEPTED"
    http_status: 409
    applies_to: "POST /credit-applications/{id}/disclosure-delivery, .../disclosure-acknowledgement, .../acceptance, POST /projects"
  - priority: 17
    category: state
    check: "the milestone's status admits the operation: claim from PENDING or REJECTED, verification from CLAIMED or (rescission) VERIFIED; and when requires_consumer_signoff == true the verifying actor MUST be the owning Consumer, else ERR_CONSUMER_SIGNOFF_REQUIRED"
    error_id: "ERR_INVALID_MILESTONE_STATE | ERR_CONSUMER_SIGNOFF_REQUIRED"
    http_status: 409
    applies_to: "POST /projects/{id}/milestones/{milestone_id}/claim, .../verification, POST /funding-draws"
  - priority: 18
    category: state
    check: "a VERIFIED milestone may not be rescinded once a REQUESTED or SETTLED draw references it, and a milestone may not back more than one live draw"
    error_id: ERR_MILESTONE_ALREADY_FUNDED
    http_status: 409
    applies_to: "POST /projects/{id}/milestones/{milestone_id}/verification, POST /funding-draws"
  - priority: 19
    category: state
    check: "the draw's status admits the operation: settlement decision from REQUESTED, reversal from SETTLED"
    error_id: ERR_INVALID_DRAW_STATE
    http_status: 409
    applies_to: "POST /funding-draws/{id}/settlement, POST /funding-draws/{id}/reversal"
  - priority: 20
    category: state
    check: "the project's completion_status admits the operation: certification from IN_PROGRESS or SUBSTANTIALLY_COMPLETE, milestone and draw writes only while not ABANDONED"
    error_id: ERR_INVALID_PROJECT_STATE
    http_status: 409
    applies_to: "POST /projects/{id}/completion-certification, POST /projects/{id}/milestones, POST /funding-draws, POST /dispute-cases"
  - priority: 21
    category: state
    check: "the dispute's status admits the operation: merchant-response from MERCHANT_RESPONSE_PENDING, CONSUMER_FAVOR resolution from MERCHANT_RESPONSE_PENDING or ESCALATED_NO_RESPONSE, MERCHANT_FAVOR resolution ONLY from MERCHANT_RESPONSE_PENDING and only after a WORK_COMPLETE_EVIDENCE response"
    error_id: ERR_INVALID_DISPUTE_STATE
    http_status: 409
    applies_to: "POST /dispute-cases/{id}/merchant-response, POST /dispute-cases/{id}/resolution"
  - priority: 22
    category: state
    check: "the fraud alert is still OPEN when an investigation outcome arrives"
    error_id: ERR_INVALID_ALERT_STATE
    http_status: 409
    applies_to: "POST /merchants/{id}/fraud-alerts/{alert_id}/investigation"
  - priority: 23
    category: state
    check: "the loan account still accepts money movement: balance_status NOT IN {PAID_OFF, CHARGED_OFF}"
    error_id: ERR_LOAN_CLOSED
    http_status: 409
    applies_to: "POST /payments, POST /funding-draws, POST /funding-draws/{id}/settlement, POST /funding-draws/{id}/reversal"

  # ---- business_safety band (consumer protection / licensing / compliance) ---
  - priority: 24
    category: business_safety
    check: "enrollment approval requires at least one MerchantLicense with verification_status == VERIFIED whose trade_type equals Merchant.trade_type and whose state_code equals Merchant.state_code"
    error_id: ERR_LICENSE_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /merchants/{id}/enrollment-decision (decision=APPROVE)"
  - priority: 25
    category: business_safety
    check: "the covering license must still have TradeRule.min_license_months whole months of coverage left, measured from the clock date to expires_on (exclusive end): whole_months_remaining >= min_license_months"
    error_id: ERR_LICENSE_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /merchants/{id}/enrollment-decision (decision=APPROVE)"
  - priority: 26
    category: business_safety
    check: "the delivered disclosure_template_version must equal the application's PromotionPlan.disclosure_template_version at delivery time"
    error_id: ERR_DISCLOSURE_TEMPLATE_MISMATCH
    http_status: 422
    applies_to: "POST /credit-applications/{id}/disclosure-delivery"
  - priority: 27
    category: business_safety
    check: "acknowledgement must arrive within DISCLOSURE_ACK_WINDOW_DAYS(3) of disclosure_delivered_at (inclusive: clock <= delivered_at + 3 days)"
    error_id: ERR_DISCLOSURE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /credit-applications/{id}/disclosure-acknowledgement"
  - priority: 28
    category: business_safety
    check: "an offer may only be accepted once disclosure_status == ACKNOWLEDGED — the deferred-interest terms must be acknowledged before any credit is extended"
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /credit-applications/{id}/acceptance"
  - priority: 29
    category: business_safety
    check: "when TradeRule.requires_completion_certificate is true, completion certification requires a non-empty completion_certificate_ref AND every milestone of the project in status CLAIMED or VERIFIED (no PENDING or REJECTED milestone may remain)"
    error_id: ERR_COMPLETION_CERTIFICATE_REQUIRED
    http_status: 422
    applies_to: "POST /projects/{id}/completion-certification"

  # ---- business_referential band --------------------------------------------
  - priority: 30
    category: business_referential
    check: "the merchant's trade_type must appear in PromotionPlan.allowed_trade_types"
    error_id: ERR_TRADE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /merchants/{id}/promotion-enrollments"
  - priority: 31
    category: business_referential
    check: "the application's promotion_plan_id must have a MerchantPromotionEnrollment for this merchant with status == ACTIVE whose CLOSED window [window_start_date, window_end_date] contains the clock date; and the merchant must still hold a licence with verification_status == VERIFIED (not EXPIRED) for its trade_type and state_code, else ERR_LICENSE_EXPIRED"
    error_id: "ERR_PROMOTION_NOT_ENROLLED | ERR_LICENSE_EXPIRED"
    http_status: 422
    applies_to: "POST /credit-applications"
  - priority: 32
    category: business_referential
    check: "cross-aggregate coherence of a draw: the milestone's Project.loan_account_id must equal the draw's loan_account_id"
    error_id: ERR_MILESTONE_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /funding-draws"
  - priority: 33
    category: business_referential
    check: "the disputed project's loan_account_id must equal the case's loan_account_id"
    error_id: ERR_DISPUTE_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /dispute-cases"

  # ---- business_constraint band ---------------------------------------------
  - priority: 34
    category: business_constraint
    check: "TradeRule.trade_type is unique; PromotionPlan.code is unique"
    error_id: "ERR_DUPLICATE_TRADE_RULE | ERR_DUPLICATE_PROMOTION_CODE"
    http_status: 409
    applies_to: "POST /trade-rules, POST /promotion-plans"
  - priority: 35
    category: business_constraint
    check: "HALF-OPEN license coverage may not overlap for the same (merchant_id, trade_type, state_code) among licenses with verification_status IN {UNVERIFIED, VERIFIED}: two intervals conflict when a.effective_from < b.expires_on AND b.effective_from < a.expires_on. Touching endpoints (a.expires_on == b.effective_from) do NOT conflict."
    error_id: ERR_LICENSE_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /merchants/{id}/licenses"
  - priority: 36
    category: business_constraint
    check: "CLOSED enrollment windows may not overlap for the same (merchant_id, promotion_plan_id) among enrollments with status IN {ACTIVE, SUSPENDED}: two intervals conflict when a.window_start_date <= b.window_end_date AND b.window_start_date <= a.window_end_date. Touching endpoints (a.window_end_date == b.window_start_date) DO conflict — the opposite of the license rule."
    error_id: ERR_ENROLLMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /merchants/{id}/promotion-enrollments"
  - priority: 37
    category: business_constraint
    check: "sequence_no is unique within a project's milestones"
    error_id: ERR_DUPLICATE_MILESTONE_SEQUENCE
    http_status: 409
    applies_to: "POST /projects/{id}/milestones"
  - priority: 38
    category: business_constraint
    check: "the sum of release_pct_bps over a project's milestones may not exceed 10000 bps (aggregate check: each milestone is individually legal but the collection is not)"
    error_id: ERR_MILESTONE_RELEASE_TOTAL_EXCEEDED
    http_status: 422
    applies_to: "POST /projects/{id}/milestones"
  - priority: 39
    category: business_constraint
    check: "at most one Project may exist per ACTIVATED CreditApplication"
    error_id: ERR_PROJECT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /projects"
  - priority: 40
    category: business_constraint
    check: "no second DisputeCase may be opened on a project while one is in a non-terminal status (SUBMITTED, MERCHANT_RESPONSE_PENDING, ESCALATED_NO_RESPONSE)"
    error_id: ERR_DISPUTE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /dispute-cases"
  - priority: 41
    category: business_constraint
    check: "when reopens_case_id is supplied it must reference a case on the same project whose status is RESOLVED_MERCHANT_FAVOR and whose resolved_on is within REOPEN_WINDOW_DAYS(30) of the clock date (inclusive)"
    error_id: ERR_DISPUTE_NOT_REOPENABLE
    http_status: 422
    applies_to: "POST /dispute-cases"

  # ---- business_temporal band ------------------------------------------------
  - priority: 42
    category: business_temporal
    check: "the logical clock may only move forward or stay put: the supplied current_utc must be >= the stored clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 43
    category: business_temporal
    check: "an enrollment window may not start before the merchant was approved: window_start_date >= date(Merchant.approved_on)"
    error_id: ERR_ENROLLMENT_WINDOW_BEFORE_APPROVAL
    http_status: 422
    applies_to: "POST /merchants/{id}/promotion-enrollments"
  - priority: 44
    category: business_temporal
    check: "acceptance must occur at or before offer_expires_at (inclusive)"
    error_id: ERR_OFFER_EXPIRED
    http_status: 422
    applies_to: "POST /credit-applications/{id}/acceptance"
  - priority: 45
    category: business_temporal
    check: "a merchant response must arrive strictly before response_due_at"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /dispute-cases/{id}/merchant-response"

  # ---- business_fiscal band (money last) ------------------------------------
  - priority: 46
    category: business_fiscal
    check: "project_amount_cents >= PromotionPlan.min_ticket_cents"
    error_id: ERR_TICKET_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /credit-applications"
  - priority: 47
    category: business_fiscal
    check: "project_amount_cents <= min(PromotionPlan.max_ticket_cents, TradeRule.max_ticket_cents for the merchant's trade)"
    error_id: ERR_TICKET_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /credit-applications"
  - priority: 48
    category: business_fiscal
    check: "at acceptance the DTI is recomputed over the consumer's CURRENT existing_program_debt_cents and must still be <= DTI_CEILING_BPS(4500); a breach revokes the offer instead of activating it"
    error_id: ERR_DTI_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /credit-applications/{id}/acceptance"
  - priority: 49
    category: business_fiscal
    check: "Project.contract_amount_cents <= LoanAccount.credit_limit_cents"
    error_id: ERR_CONTRACT_EXCEEDS_CREDIT_LIMIT
    http_status: 422
    applies_to: "POST /projects"
  - priority: 50
    category: business_fiscal
    check: "requested_amount_cents <= Project.max_fundable_now_cents per calculations.staged_funding_availability (inclusive)"
    error_id: ERR_STAGED_FUNDING_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /funding-draws"
  - priority: 51
    category: business_fiscal
    check: "the merchant's rolling 7-day SETTLED volume including this draw must not exceed TradeRule.velocity_cap_cents (strict `>` fails)"
    error_id: ERR_FUNDING_VELOCITY_EXCEEDED
    http_status: 422
    applies_to: "POST /funding-draws/{id}/settlement"
  - priority: 52
    category: business_fiscal
    check: "a RELEASE holdback adjustment may not exceed Merchant.holdback_reserve_cents"
    error_id: ERR_RESERVE_RELEASE_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /merchants/{id}/holdback-adjustments"
  - priority: 53
    category: business_fiscal
    check: "claimed_incomplete_amount_cents <= Project.settled_funded_cents — a consumer cannot dispute money the program never advanced"
    error_id: ERR_DISPUTE_CLAIM_EXCEEDS_FUNDED
    http_status: 422
    applies_to: "POST /dispute-cases"
  - priority: 54
    category: business_fiscal
    check: "amount_cents <= LoanAccount.capitalized_interest_cents + principal_balance_cents"
    error_id: ERR_PAYMENT_EXCEEDS_PAYOFF
    http_status: 422
    applies_to: "POST /payments"

# =============================================================================
# §1.5 API Endpoint Table — flat root collections (api_prefix is ""). The FIRST
# path parameter of every path is `{id}`; deeper parameters keep descriptive
# names. Trailing `?` in `input:` marks an optional field.
# Reverse-reachability map (every FK in §1.1 is discoverable):
#   MerchantLicense.merchant_id                -> GET /merchants/{id}/licenses
#   MerchantPromotionEnrollment.merchant_id    -> GET /merchants/{id}/promotion-enrollments
#   MerchantPromotionEnrollment.promotion_plan_id -> GET /promotion-enrollments?promotion_plan_id
#   FraudAlert.merchant_id                     -> GET /merchants/{id}/fraud-alerts
#   ProjectMilestone.project_id                -> GET /projects/{id}/milestones
#   Payment.loan_account_id                    -> GET /loan-accounts/{id}/payments
#   CreditApplication.{merchant_id, consumer_id, promotion_plan_id}
#                                              -> GET /credit-applications?...
#   LoanAccount.{application_id, consumer_id, merchant_id, promotion_plan_id}
#                                              -> GET /loan-accounts?...
#   Project.{application_id, merchant_id, loan_account_id} -> GET /projects?...
#   FundingDraw.{loan_account_id, project_milestone_id, merchant_id}
#                                              -> GET /funding-draws?...
#   DisputeCase.{loan_account_id, project_id, merchant_id, reopens_case_id}
#                                              -> GET /dispute-cases?...
# =============================================================================
endpoints:

  # ---- logical clock and ops checkpoint --------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical UTC clock, which every date/deadline rule reads. MANDATORY STARTUP DEFAULT: before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to wall-clock time. The clock may only move forward or stay put."
    roles: [ProgramAdmin, ServicingAgent]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects: ["no entity is mutated; subsequent requests evaluate every window, expiry and accrual against the new instant"]
  - method: POST
    path: "/servicing/expiration-sweeps"
    description: "Ops-run checkpoint: advances every clock-driven transition in one pass — license expiry, credit-offer expiry, disclosure-acknowledgement expiry, deferred-interest capitalization, delinquency, charge-off and dispute escalation. Idempotent for a fixed clock: a second call with the clock unchanged reports all zeros."
    roles: [ServicingAgent, ProgramAdmin]
    code: 200
    input: []
    output: "{ expired_licenses: integer, expired_offers: integer, expired_disclosures: integer, capitalized_loans: integer, delinquent_loans: integer, charged_off_loans: integer, escalated_disputes: integer }"
    side_effects:
      - "MerchantLicense VERIFIED -> EXPIRED when clock_date >= expires_on"
      - "CreditApplication APPROVED -> EXPIRED when clock > offer_expires_at"
      - "CreditApplication disclosure_status DELIVERED -> EXPIRED_UNACKNOWLEDGED after 3 days"
      - "LoanAccount PROMO_ACTIVE -> PROMO_EXPIRED_CAPITALIZED with capitalized_interest_cents written per calculations.deferred_interest_accrual"
      - "LoanAccount CURRENT -> DELINQUENT and DELINQUENT -> CHARGED_OFF on the promo-expiry grace/charge-off clocks"
      - "DisputeCase MERCHANT_RESPONSE_PENDING -> ESCALATED_NO_RESPONSE when clock >= response_due_at with no response"

  # ---- program reference data -------------------------------------------------
  - method: POST
    path: "/trade-rules"
    description: "Registers the trade-specific program rules (ticket ceiling, holdback rate, pre-completion release cap, velocity cap, certificate requirement, licence seasoning)."
    roles: [ProgramAdmin]
    code: 201
    input: [trade_type, max_ticket_cents, holdback_pct_bps, max_precompletion_release_bps, velocity_cap_cents, requires_completion_certificate, min_license_months]
    output: TradeRule
    side_effects: ["trade_type uniqueness enforced (ERR_DUPLICATE_TRADE_RULE)"]
  - method: GET
    path: "/trade-rules"
    description: "Lists trade rules, optionally filtered by trade_type."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant]
    code: 200
    input: ["trade_type?", "limit?", "offset?"]
    output: TradeRule[]
    side_effects: []
  - method: POST
    path: "/promotion-plans"
    description: "Creates a promotion plan (deferred-interest, zero-interest equal-pay, reduced-APR or standard revolving) with its disclosure template, ticket band, merchant discount rate and eligible trades."
    roles: [ProgramAdmin]
    code: 201
    input: [code, promotion_type, promo_term_months, deferred_apr_bps, post_promo_apr_bps, merchant_discount_bps, min_ticket_cents, max_ticket_cents, disclosure_template_version, allowed_trade_types]
    output: PromotionPlan
    side_effects: ["code uniqueness enforced (ERR_DUPLICATE_PROMOTION_CODE)"]
  - method: GET
    path: "/promotion-plans"
    description: "Lists promotion plans, optionally filtered by code or promotion_type."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant]
    code: 200
    input: ["code?", "promotion_type?", "limit?", "offset?"]
    output: PromotionPlan[]
    side_effects: []

  # ---- merchant enrollment ---------------------------------------------------
  - method: POST
    path: "/merchants"
    description: "Registers a merchant in DRAFT."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, trade_type, state_code, contact_email]
    output: Merchant
    side_effects: ["enrollment_status = DRAFT; version = 1; every portfolio metric initialised (funded_volume 0, reserve 0, coverage 10000, grade A, risk_tier STANDARD)"]
  - method: GET
    path: "/merchants/{id}"
    description: "Reads one merchant including every computed portfolio, reserve and fraud figure."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant]
    code: 200
    input: []
    output: Merchant
    side_effects: []
  - method: GET
    path: "/merchants"
    description: "Lists merchants with filtering and pagination."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent]
    code: 200
    input: ["enrollment_status?", "trade_type?", "risk_tier?", "portfolio_grade?", "termination_recommended?", "limit?", "offset?"]
    output: Merchant[]
    side_effects: []
  - method: POST
    path: "/merchants/{id}/licenses"
    description: "Files a state licence for the merchant in UNVERIFIED. Coverage is the HALF-OPEN interval [effective_from, expires_on); touching intervals do not conflict."
    roles: [Merchant, ProgramAdmin]
    code: 201
    input: [trade_type, license_number, state_code, effective_from, expires_on]
    output: MerchantLicense
    side_effects: ["half-open coverage-overlap check against the merchant's UNVERIFIED/VERIFIED licences of the same (trade_type, state_code)"]
  - method: GET
    path: "/merchants/{id}/licenses"
    description: "Lists the merchant's licences (FK reverse path for MerchantLicense.merchant_id)."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant]
    code: 200
    input: ["verification_status?"]
    output: MerchantLicense[]
    side_effects: []
  - method: POST
    path: "/merchants/{id}/licenses/{license_id}/verification"
    description: "Underwriter decision on a filed licence: VERIFIED or REJECTED."
    roles: [ProgramUnderwriter]
    code: 200
    input: [outcome, "verification_note?"]
    output: MerchantLicense
    side_effects: ["writes verification_status, verified_by_user_id = X-User-ID, verified_on = clock"]
  - method: POST
    path: "/merchants/{id}/enrollment-submission"
    description: "Submits (or resubmits) the merchant for program review, capturing the signed attestation."
    roles: [Merchant, ProgramAdmin]
    code: 200
    input: [attestation_ref]
    output: Merchant
    side_effects: ["enrollment_status DRAFT|DOCS_REQUIRED -> PENDING_REVIEW; version += 1"]
  - method: POST
    path: "/merchants/{id}/enrollment-decision"
    description: "Underwriter program decision: APPROVE, DECLINE or REQUEST_DOCS. APPROVE runs the trade-specific licence gates (verified licence covering the merchant's trade and state, with TradeRule.min_license_months of coverage left)."
    roles: [ProgramUnderwriter]
    code: 200
    input: [decision, "decision_note?"]
    output: Merchant
    side_effects: ["on APPROVE: enrollment_status = APPROVED, approved_by_user_id = X-User-ID (the segregation-of-duties anchor), approved_on = clock, version += 1"]
  - method: POST
    path: "/merchants/{id}/program-action"
    description: "Program-level posture change: SUSPEND, REINSTATE or TERMINATE."
    roles: [ProgramAdmin]
    code: 200
    input: [action, "reason_code?"]
    output: Merchant
    side_effects:
      - "SUSPEND: ACTIVE enrollments -> SUSPENDED, REQUESTED draws -> DENIED"
      - "REINSTATE: SUSPENDED enrollments -> ACTIVE"
      - "TERMINATE: enrollments -> TERMINATED, REQUESTED draws -> DENIED, APPROVED/COUNTER_OFFERED applications -> REVOKED"
      - "version += 1"
  - method: POST
    path: "/merchants/{id}/promotion-enrollments"
    description: "Enrolls the merchant in a promotion plan for a CLOSED date window [window_start_date, window_end_date] with an optional negotiated discount rate. Touching windows DO conflict."
    roles: [ProgramUnderwriter, ProgramAdmin]
    code: 201
    input: [promotion_plan_id, window_start_date, window_end_date, "negotiated_discount_bps?"]
    output: MerchantPromotionEnrollment
    side_effects: ["trade-eligibility, window-after-approval and closed-interval overlap checks"]
  - method: GET
    path: "/merchants/{id}/promotion-enrollments"
    description: "Lists the merchant's promotion enrollments (FK reverse path for MerchantPromotionEnrollment.merchant_id)."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant]
    code: 200
    input: ["status?"]
    output: MerchantPromotionEnrollment[]
    side_effects: []
  - method: GET
    path: "/promotion-enrollments/{id}"
    description: "Reads one promotion enrollment."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant]
    code: 200
    input: []
    output: MerchantPromotionEnrollment
    side_effects: []
  - method: GET
    path: "/promotion-enrollments"
    description: "Lists promotion enrollments across merchants (FK reverse path for MerchantPromotionEnrollment.promotion_plan_id)."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent]
    code: 200
    input: ["merchant_id?", "promotion_plan_id?", "status?", "limit?", "offset?"]
    output: MerchantPromotionEnrollment[]
    side_effects: []
  - method: POST
    path: "/merchants/{id}/holdback-adjustments"
    description: "Posts a DEPOSIT or RELEASE against the merchant's holdback reserve. OCC-guarded on Merchant.version because reserve adjustments are legitimately repeatable."
    roles: [ServicingAgent]
    code: 200
    input: [adjustment_type, amount_cents, expected_merchant_version, "reason_code?"]
    output: Merchant
    side_effects: ["holdback_reserve_cents +/- amount_cents; reserve_coverage_bps recomputed; version += 1"]
  - method: POST
    path: "/merchants/{id}/fraud-alerts"
    description: "Raises an analyst fraud alert (phantom project, pre-completion full draw, velocity spike, duplicate consumer) with a severity weight."
    roles: [RiskAnalyst]
    code: 201
    input: [alert_type, severity_weight, "evidence_ref?"]
    output: FraudAlert
    side_effects: ["status = OPEN, source = ANALYST, opened_on = clock date; Merchant.phantom_risk_score, portfolio_grade, termination_recommended recomputed; Merchant.version += 1"]
  - method: GET
    path: "/merchants/{id}/fraud-alerts"
    description: "Lists the merchant's fraud alerts (FK reverse path for FraudAlert.merchant_id, and the only discovery channel for SYSTEM-minted alerts)."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent]
    code: 200
    input: ["status?", "alert_type?", "source?"]
    output: FraudAlert[]
    side_effects: []
  - method: POST
    path: "/merchants/{id}/fraud-alerts/{alert_id}/investigation"
    description: "Closes a fraud alert as CONFIRMED or CLEARED. Segregation of duties: the analyst may not be the underwriter who approved this merchant."
    roles: [RiskAnalyst]
    code: 200
    input: [outcome, "investigation_note?"]
    output: FraudAlert
    side_effects: ["recomputes phantom_risk_score; may cascade Merchant APPROVED -> SUSPENDED and suspend enrollments / deny REQUESTED draws; Merchant.version += 1"]

  # ---- consumer and point-of-sale application --------------------------------
  - method: POST
    path: "/consumers"
    description: "Registers a consumer at the point of sale (income, FICO, tax-id last four)."
    roles: [Merchant, ProgramAdmin]
    code: 201
    input: [full_name, ssn_last4, annual_income_cents, fico_score, state_code]
    output: Consumer
    side_effects: ["existing_program_debt_cents = 0, active_loan_count = 0"]
  - method: GET
    path: "/consumers/{id}"
    description: "Reads one consumer including the computed program-debt and active-loan aggregates."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant, Consumer]
    code: 200
    input: []
    output: Consumer
    side_effects: []
  - method: POST
    path: "/credit-applications"
    description: "Point-of-sale application with an INSTANT decision: APPROVED, COUNTER_OFFERED or DECLINED per calculations.instant_credit_decision. Requires an ACTIVE promotion enrollment covering the clock date."
    roles: [Merchant]
    code: 201
    input: [merchant_id, consumer_id, promotion_plan_id, project_amount_cents]
    output: CreditApplication
    side_effects: ["writes decision, approved_limit_cents, decision_dti_bps, decision_reason_codes, offer_expires_at; disclosure_status = NOT_SENT"]
  - method: GET
    path: "/credit-applications/{id}"
    description: "Reads one application including both state dimensions and the frozen disclosure summary."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant, Consumer]
    code: 200
    input: []
    output: CreditApplication
    side_effects: []
  - method: GET
    path: "/credit-applications"
    description: "Lists applications (FK reverse path for merchant_id, consumer_id and promotion_plan_id)."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant]
    code: 200
    input: ["merchant_id?", "consumer_id?", "promotion_plan_id?", "decision?", "disclosure_status?", "limit?", "offset?"]
    output: CreditApplication[]
    side_effects: []
  - method: POST
    path: "/credit-applications/{id}/disclosure-delivery"
    description: "Delivers (or re-delivers) the deferred-interest disclosure. Freezes promo_disclosure_summary and starts the 3-day acknowledgement window."
    roles: [Merchant]
    code: 200
    input: [disclosure_template_version]
    output: CreditApplication
    side_effects: ["disclosure_status NOT_SENT|EXPIRED_UNACKNOWLEDGED -> DELIVERED; disclosure_delivered_at = clock; promo_disclosure_summary pinned from the plan"]
  - method: POST
    path: "/credit-applications/{id}/disclosure-acknowledgement"
    description: "Consumer acknowledges the disclosure with a signature reference, within 3 days of delivery."
    roles: [Consumer]
    code: 200
    input: [consumer_signature_ref]
    output: CreditApplication
    side_effects: ["disclosure_status DELIVERED -> ACKNOWLEDGED; disclosure_acknowledged_at = clock"]
  - method: POST
    path: "/credit-applications/{id}/acceptance"
    description: "Consumer accepts the offer (or the counter-offer). Re-runs the DTI gate against current program debt, then originates the LoanAccount. The new account is discoverable through GET /loan-accounts?application_id=."
    roles: [Consumer]
    code: 200
    input: ["accept_counter_offer?"]
    output: CreditApplication
    side_effects:
      - "decision APPROVED|COUNTER_OFFERED -> ACTIVATED"
      - "creates a LoanAccount (PROMO_ACTIVE / CURRENT, credit_limit_cents = approved_limit_cents, promo_expires_on = acceptance date + promo_term_months, apr_bps = plan.deferred_apr_bps)"
      - "recomputes Consumer.active_loan_count and existing_program_debt_cents"
  - method: GET
    path: "/loan-accounts/{id}"
    description: "Reads one loan account including both payoff variants, accrued deferred interest and the at-risk disclosure figure."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant, Consumer]
    code: 200
    input: []
    output: LoanAccount
    side_effects: []
  - method: GET
    path: "/loan-accounts"
    description: "Lists loan accounts (FK reverse path for application_id, consumer_id, merchant_id and promotion_plan_id)."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant, Consumer]
    code: 200
    input: ["application_id?", "consumer_id?", "merchant_id?", "promotion_plan_id?", "promo_status?", "balance_status?", "limit?", "offset?"]
    output: LoanAccount[]
    side_effects: []

  # ---- project, milestones and completion ------------------------------------
  - method: POST
    path: "/projects"
    description: "Opens the contracted project against an ACTIVATED application; contract_amount_cents may not exceed the account's credit limit."
    roles: [Merchant]
    code: 201
    input: [application_id, scope_description, contract_amount_cents]
    output: Project
    side_effects: ["completion_status = IN_PROGRESS; merchant_id and loan_account_id copied from the application; verified_release_bps 0; max_fundable_now_cents 0"]
  - method: GET
    path: "/projects/{id}"
    description: "Reads one project including verified_release_bps, settled_funded_cents, funded_pct_bps, max_fundable_now_cents and disputed_amount_cents."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant, Consumer]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/projects"
    description: "Lists projects (FK reverse path for application_id, merchant_id and loan_account_id)."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant, Consumer]
    code: 200
    input: ["application_id?", "merchant_id?", "loan_account_id?", "completion_status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/milestones"
    description: "Adds a milestone with its release share in bps; sequence_no is unique per project and the project's shares may not exceed 10000 bps in total."
    roles: [Merchant]
    code: 201
    input: [sequence_no, name, release_pct_bps, "requires_consumer_signoff?"]
    output: ProjectMilestone
    side_effects: ["status = PENDING; rejection_count 0; is_funded false"]
  - method: GET
    path: "/projects/{id}/milestones"
    description: "Lists the project's milestones (FK reverse path for ProjectMilestone.project_id)."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant, Consumer]
    code: 200
    input: ["status?"]
    output: ProjectMilestone[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/milestones/{milestone_id}/claim"
    description: "Merchant claims a milestone complete with evidence; re-claimable after a rejection."
    roles: [Merchant]
    code: 200
    input: [evidence_ref]
    output: ProjectMilestone
    side_effects: ["status PENDING|REJECTED -> CLAIMED; claimed_at = clock"]
  - method: POST
    path: "/projects/{id}/milestones/{milestone_id}/verification"
    description: "Verification decision on a claimed milestone (VERIFY or REJECT). When requires_consumer_signoff is true only the owning Consumer may decide; otherwise a ServicingAgent may decide too. VERIFY may also be rescinded to REJECT while the milestone is unfunded."
    roles: [Consumer, ServicingAgent]
    code: 200
    input: [outcome]
    output: ProjectMilestone
    side_effects:
      - "VERIFY: status -> VERIFIED, verified_at = clock; Project.verified_release_bps and max_fundable_now_cents recomputed; Project IN_PROGRESS -> SUBSTANTIALLY_COMPLETE once verified_release_bps >= 8000"
      - "REJECT: status -> REJECTED, rejection_count += 1; Project recomputed and may fall back from SUBSTANTIALLY_COMPLETE to IN_PROGRESS"
  - method: POST
    path: "/projects/{id}/completion-certification"
    description: "Consumer certifies the project complete, lifting the pre-completion release cap to 10000 bps."
    roles: [Consumer]
    code: 200
    input: [completion_certificate_ref]
    output: Project
    side_effects: ["completion_status -> CERTIFIED_COMPLETE, certified_on = clock; max_fundable_now_cents recomputed against the full contract"]

  # ---- staged funding --------------------------------------------------------
  - method: POST
    path: "/funding-draws"
    description: "Merchant requests a staged draw against a VERIFIED milestone. Computes the PROVISIONAL economics and enforces the staged-funding headroom. OCC-guarded on LoanAccount.version."
    roles: [Merchant]
    code: 201
    input: [loan_account_id, project_milestone_id, requested_amount_cents, settlement_speed, expected_loan_account_version]
    output: FundingDraw
    side_effects:
      - "status = REQUESTED; funded_amount_cents frozen = requested_amount_cents"
      - "provisional_discount_cents / provisional_holdback_cents / provisional_net_settlement_cents written from plan and trade rates"
      - "ProjectMilestone.is_funded = true; Project.max_fundable_now_cents reduced by the pending request"
  - method: GET
    path: "/funding-draws/{id}"
    description: "Reads one draw with both the provisional and (once settled) the final economics."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant]
    code: 200
    input: []
    output: FundingDraw
    side_effects: []
  - method: GET
    path: "/funding-draws"
    description: "Lists draws (FK reverse path for loan_account_id, project_milestone_id and merchant_id)."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant]
    code: 200
    input: ["loan_account_id?", "project_milestone_id?", "merchant_id?", "status?", "settlement_speed?", "limit?", "offset?"]
    output: FundingDraw[]
    side_effects: []
  - method: POST
    path: "/funding-draws/{id}/settlement"
    description: "Servicing decision on a requested draw: SETTLE (compute the FINAL economics and move the money) or DENY (no ledger effect at all)."
    roles: [ServicingAgent]
    code: 200
    input: [decision, "denial_reason_code?"]
    output: FundingDraw
    side_effects:
      - "SETTLE: FINAL discount/holdback/net written, settled_on and released_by_user_id set, LoanAccount principal and Merchant funded_volume/reserve updated, project aggregates and accrual recomputed, LoanAccount.version and Merchant.version += 1, and the SYSTEM pre-completion fraud detector may mint a FraudAlert"
      - "DENY: denial_reason_code recorded, no ledger movement, ProjectMilestone.is_funded returns to false, Project.max_fundable_now_cents restored"
  - method: POST
    path: "/funding-draws/{id}/reversal"
    description: "Reverses a settled draw, unwinding every ledger effect exactly (principal, funded volume, reserve, project aggregates, milestone fundability)."
    roles: [ServicingAgent]
    code: 200
    input: [reversal_reason_code]
    output: FundingDraw
    side_effects: ["status SETTLED -> REVERSED; all settlement side effects compensated with no drift; LoanAccount.version and Merchant.version += 1"]

  # ---- disputes, chargebacks and payments ------------------------------------
  - method: POST
    path: "/dispute-cases"
    description: "Consumer disputes incomplete work. The case opens straight into MERCHANT_RESPONSE_PENDING with a 10-day response clock."
    roles: [Consumer]
    code: 201
    input: [loan_account_id, project_id, claimed_incomplete_amount_cents, description, "reopens_case_id?"]
    output: DisputeCase
    side_effects: ["opened_on and response_due_at written; Project.disputed_amount_cents and the merchant's dispute_rate_bps / portfolio_grade / termination_recommended recomputed"]
  - method: GET
    path: "/dispute-cases/{id}"
    description: "Reads one dispute case including the three chargeback waterfall buckets."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant, Consumer]
    code: 200
    input: []
    output: DisputeCase
    side_effects: []
  - method: GET
    path: "/dispute-cases"
    description: "Lists dispute cases (FK reverse path for loan_account_id, project_id, merchant_id and the self-referential reopens_case_id)."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant, Consumer]
    code: 200
    input: ["loan_account_id?", "project_id?", "merchant_id?", "reopens_case_id?", "status?", "limit?", "offset?"]
    output: DisputeCase[]
    side_effects: []
  - method: POST
    path: "/dispute-cases/{id}/merchant-response"
    description: "Merchant responds inside the 10-day window with WORK_COMPLETE_EVIDENCE or CONCEDE."
    roles: [Merchant]
    code: 200
    input: [response_type, "evidence_ref?"]
    output: DisputeCase
    side_effects: ["merchant_responded_at = clock; a WORK_COMPLETE_EVIDENCE response is the precondition for any MERCHANT_FAVOR resolution"]
  - method: POST
    path: "/dispute-cases/{id}/resolution"
    description: "Servicing resolves the case CONSUMER_FAVOR (runs the chargeback waterfall and its four-hop cascade) or MERCHANT_FAVOR (no money moves). OCC-guarded on Merchant.version; segregation of duties bars the agent who released a draw on this project."
    roles: [ServicingAgent]
    code: 200
    input: [outcome, expected_merchant_version]
    output: DisputeCase
    side_effects:
      - "CONSUMER_FAVOR: chargeback buckets written, merchant reserve/receivable/write-off updated, coverage recomputed, merchant may be SUSPENDED with enrollment and draw cascades, loan principal reduced, project -> ABANDONED"
      - "MERCHANT_FAVOR: resolution recorded only; the case becomes reopenable for 30 days"
      - "Merchant.version += 1 in both branches"
  - method: POST
    path: "/payments"
    description: "Posts a payment against a loan account through the capitalized-interest-then-principal waterfall. Payment is an immutable event: no update or delete endpoint exists."
    roles: [Consumer, ServicingAgent]
    code: 201
    input: [loan_account_id, amount_cents]
    output: Payment
    side_effects:
      - "applied_to_capitalized_interest_cents then applied_to_principal_cents allocated; resulting_principal_balance_cents recorded"
      - "may drive promo_status -> PROMO_SATISFIED (with waived_interest_cents), balance_status -> PAID_OFF, or DELINQUENT -> CURRENT"
      - "LoanAccount.version += 1; Consumer.existing_program_debt_cents recomputed"
  - method: GET
    path: "/loan-accounts/{id}/payments"
    description: "Lists the account's payments in posted_on then created_at order (FK reverse path for Payment.loan_account_id)."
    roles: [ProgramAdmin, ProgramUnderwriter, RiskAnalyst, ServicingAgent, Merchant, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog — every entry is triggerable through §1.5 and is
# reachable from at least one §1.4 rule or §1.2 precondition.
# =============================================================================
errors:

  # ---- auth / schema ---------------------------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role missing or not one of the six §1.7 roles, or X-User-ID missing on a non-GET request" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "the acting role is not listed in the endpoint's `roles:`" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong scalar type, enum value outside its declared set, negative money or bps amount, malformed ISO date or instant" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "licence effective_from >= expires_on (half-open), or enrollment window_start_date > window_end_date (closed)" }

  # ---- existence -------------------------------------------------------------
  - { id: ERR_MERCHANT_NOT_FOUND, http: 404, condition: "path or body merchant_id does not resolve" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "license_id does not resolve, or resolves to a licence of a different merchant" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "promotion-enrollment id does not resolve" }
  - { id: ERR_CONSUMER_NOT_FOUND, http: 404, condition: "consumer_id does not resolve" }
  - { id: ERR_PROMOTION_PLAN_NOT_FOUND, http: 404, condition: "promotion_plan_id does not resolve" }
  - { id: ERR_TRADE_RULE_NOT_FOUND, http: 404, condition: "no TradeRule row exists for the merchant's trade_type when a trade-specific rule must be applied (enrollment approval, application ticket ceiling, draw settlement)" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "application id does not resolve" }
  - { id: ERR_LOAN_ACCOUNT_NOT_FOUND, http: 404, condition: "loan_account_id does not resolve" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "project id does not resolve" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "milestone_id does not resolve, or resolves to a milestone of a different project" }
  - { id: ERR_DRAW_NOT_FOUND, http: 404, condition: "funding-draw id does not resolve" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "dispute-case id (path or reopens_case_id) does not resolve" }
  - { id: ERR_ALERT_NOT_FOUND, http: 404, condition: "alert_id does not resolve, or resolves to an alert of a different merchant" }

  # ---- identity / scope / duties ---------------------------------------------
  - { id: ERR_IDENTITY_UNKNOWN, http: 403, condition: "X-User-ID does not resolve to a row of the entity backing the acting role (Merchant or Consumer)" }
  - { id: ERR_MERCHANT_SCOPE_VIOLATION, http: 403, condition: "a Merchant acts on a resource belonging to another merchant" }
  - { id: ERR_CONSUMER_SCOPE_VIOLATION, http: 403, condition: "a Consumer acts on a resource belonging to another consumer" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "the analyst closing a fraud alert approved that merchant's enrollment, or the servicing agent resolving a dispute released a SETTLED draw on the disputed project" }

  # ---- optimistic concurrency ------------------------------------------------
  - { id: ERR_STALE_MERCHANT_VERSION, http: 412, condition: "expected_merchant_version does not match Merchant.version on a holdback adjustment or dispute resolution" }
  - { id: ERR_STALE_LOAN_ACCOUNT_VERSION, http: 412, condition: "expected_loan_account_version does not match LoanAccount.version on draw creation" }

  # ---- state -----------------------------------------------------------------
  - { id: ERR_INVALID_MERCHANT_STATE, http: 409, condition: "the merchant's enrollment_status does not admit the requested transition or dependent write (for example a funding write while SUSPENDED, or REINSTATE from APPROVED)" }
  - { id: ERR_LICENSE_ALREADY_DECIDED, http: 409, condition: "a verification decision arrives for a licence that is no longer UNVERIFIED" }
  - { id: ERR_INVALID_APPLICATION_STATE, http: 409, condition: "the application's decision or disclosure dimension does not admit the operation (acceptance of a DECLINED/EXPIRED/ACTIVATED offer, acknowledgement without delivery, delivery over an ACKNOWLEDGED disclosure)" }
  - { id: ERR_CONSUMER_SIGNOFF_REQUIRED, http: 409, condition: "a ServicingAgent verifies a milestone whose requires_consumer_signoff is true; only the owning Consumer may decide" }
  - { id: ERR_COUNTER_OFFER_NOT_ACCEPTED, http: 409, condition: "acceptance of a COUNTER_OFFERED application without accept_counter_offer == true" }
  - { id: ERR_INVALID_MILESTONE_STATE, http: 409, condition: "claim on a CLAIMED or VERIFIED milestone, verification of a PENDING or REJECTED milestone, or a draw against a milestone that is not VERIFIED" }
  - { id: ERR_MILESTONE_ALREADY_FUNDED, http: 409, condition: "rescinding verification of a milestone that already backs a REQUESTED or SETTLED draw, or opening a second live draw on the same milestone" }
  - { id: ERR_INVALID_DRAW_STATE, http: 409, condition: "settlement decision on a draw that is not REQUESTED, or reversal of a draw that is not SETTLED" }
  - { id: ERR_INVALID_PROJECT_STATE, http: 409, condition: "certification of an ABANDONED or already CERTIFIED_COMPLETE project, or a milestone/draw/dispute write against an ABANDONED project" }
  - { id: ERR_INVALID_DISPUTE_STATE, http: 409, condition: "response on a case outside MERCHANT_RESPONSE_PENDING, resolution of a terminal case, or a MERCHANT_FAVOR resolution of an ESCALATED_NO_RESPONSE case or one with no WORK_COMPLETE_EVIDENCE response" }
  - { id: ERR_INVALID_ALERT_STATE, http: 409, condition: "an investigation outcome arrives for an alert that is no longer OPEN" }
  - { id: ERR_LOAN_CLOSED, http: 409, condition: "money movement attempted on a PAID_OFF or CHARGED_OFF loan account" }

  # ---- business_safety (consumer protection / licensing) ---------------------
  - { id: ERR_LICENSE_NOT_VERIFIED, http: 422, condition: "enrollment approval with no VERIFIED licence covering the merchant's trade_type and state_code" }
  - { id: ERR_LICENSE_EXPIRED, http: 422, condition: "a point-of-sale application is filed after the merchant's covering licence has been swept to EXPIRED" }
  - { id: ERR_LICENSE_COVERAGE_INSUFFICIENT, http: 422, condition: "the covering licence has fewer whole months of remaining coverage than TradeRule.min_license_months" }
  - { id: ERR_DISCLOSURE_TEMPLATE_MISMATCH, http: 422, condition: "the delivered disclosure_template_version differs from the promotion plan's current template version" }
  - { id: ERR_DISCLOSURE_WINDOW_EXPIRED, http: 422, condition: "acknowledgement more than DISCLOSURE_ACK_WINDOW_DAYS(3) after delivery" }
  - { id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED, http: 422, condition: "acceptance while disclosure_status is not ACKNOWLEDGED" }
  - { id: ERR_COMPLETION_CERTIFICATE_REQUIRED, http: 422, condition: "certification without completion_certificate_ref, or with a PENDING/REJECTED milestone remaining, when the trade requires a completion certificate" }

  # ---- business_referential --------------------------------------------------
  - { id: ERR_TRADE_NOT_ELIGIBLE, http: 422, condition: "the merchant's trade_type is not in PromotionPlan.allowed_trade_types" }
  - { id: ERR_PROMOTION_NOT_ENROLLED, http: 422, condition: "no ACTIVE MerchantPromotionEnrollment for (merchant, plan) whose closed window contains the clock date" }
  - { id: ERR_MILESTONE_PROJECT_MISMATCH, http: 422, condition: "the milestone's project is funded by a different loan account than the draw names" }
  - { id: ERR_DISPUTE_PROJECT_MISMATCH, http: 422, condition: "the disputed project is funded by a different loan account than the case names" }

  # ---- business_constraint ---------------------------------------------------
  - { id: ERR_DUPLICATE_TRADE_RULE, http: 409, condition: "a TradeRule already exists for this trade_type" }
  - { id: ERR_DUPLICATE_PROMOTION_CODE, http: 409, condition: "a PromotionPlan already uses this code" }
  - { id: ERR_LICENSE_COVERAGE_OVERLAP, http: 409, condition: "half-open coverage overlaps an existing UNVERIFIED/VERIFIED licence for the same (merchant, trade_type, state_code); touching endpoints are allowed" }
  - { id: ERR_ENROLLMENT_WINDOW_OVERLAP, http: 409, condition: "closed enrollment window overlaps an ACTIVE/SUSPENDED enrollment for the same (merchant, plan); touching endpoints conflict" }
  - { id: ERR_DUPLICATE_MILESTONE_SEQUENCE, http: 409, condition: "sequence_no already used on this project" }
  - { id: ERR_MILESTONE_RELEASE_TOTAL_EXCEEDED, http: 422, condition: "the project's milestone release shares would exceed 10000 bps in total" }
  - { id: ERR_PROJECT_ALREADY_EXISTS, http: 409, condition: "a Project already exists for this application" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "another dispute on the project is still in a non-terminal status" }
  - { id: ERR_DISPUTE_NOT_REOPENABLE, http: 422, condition: "reopens_case_id targets a case that is not RESOLVED_MERCHANT_FAVOR, belongs to another project, or was resolved more than REOPEN_WINDOW_DAYS(30) ago" }

  # ---- business_temporal -----------------------------------------------------
  - { id: ERR_CLOCK_NOT_MONOTONIC, http: 422, condition: "the supplied current_utc is earlier than the stored logical clock" }
  - { id: ERR_ENROLLMENT_WINDOW_BEFORE_APPROVAL, http: 422, condition: "window_start_date precedes the merchant's approval date" }
  - { id: ERR_OFFER_EXPIRED, http: 422, condition: "acceptance after offer_expires_at" }
  - { id: ERR_RESPONSE_WINDOW_CLOSED, http: 422, condition: "merchant response at or after response_due_at" }

  # ---- business_fiscal -------------------------------------------------------
  - { id: ERR_TICKET_BELOW_MINIMUM, http: 422, condition: "project_amount_cents below the plan's min_ticket_cents" }
  - { id: ERR_TICKET_LIMIT_EXCEEDED, http: 422, condition: "project_amount_cents above min(plan max_ticket_cents, trade max_ticket_cents)" }
  - { id: ERR_DTI_LIMIT_EXCEEDED, http: 422, condition: "the DTI recomputed at acceptance exceeds DTI_CEILING_BPS(4500)" }
  - { id: ERR_CONTRACT_EXCEEDS_CREDIT_LIMIT, http: 422, condition: "contract_amount_cents above the loan account's credit_limit_cents" }
  - { id: ERR_STAGED_FUNDING_LIMIT_EXCEEDED, http: 422, condition: "requested_amount_cents above Project.max_fundable_now_cents" }
  - { id: ERR_FUNDING_VELOCITY_EXCEEDED, http: 422, condition: "the rolling 7-day settled volume including this draw exceeds TradeRule.velocity_cap_cents" }
  - { id: ERR_RESERVE_RELEASE_EXCEEDS_BALANCE, http: 422, condition: "a RELEASE adjustment exceeds the merchant's holdback reserve balance" }
  - { id: ERR_DISPUTE_CLAIM_EXCEEDS_FUNDED, http: 422, condition: "claimed_incomplete_amount_cents above the project's settled_funded_cents" }
  - { id: ERR_PAYMENT_EXCEEDS_PAYOFF, http: 422, condition: "amount_cents above capitalized_interest_cents + principal_balance_cents" }

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties role model. Merchant and Consumer are
# entity-backed (X-User-ID IS the row id); the four operator roles are opaque
# identifiers, two of which are recorded on entities to enforce duty separation
# (Merchant.approved_by_user_id, FundingDraw.released_by_user_id).
# =============================================================================
roles:
  - name: Merchant
    description: "The enrolled home-improvement contractor. Files licences, submits for enrollment, sells at the point of sale, runs the project and requests staged draws."
    identity: "entity_backed:Merchant"
    exclusive_operations:
      - "POST /credit-applications"
      - "POST /credit-applications/{id}/disclosure-delivery"
      - "POST /projects"
      - "POST /projects/{id}/milestones"
      - "POST /projects/{id}/milestones/{milestone_id}/claim"
      - "POST /funding-draws"
      - "POST /dispute-cases/{id}/merchant-response"
    shared_operations:
      - "POST /merchants/{id}/licenses (with ProgramAdmin)"
      - "POST /merchants/{id}/enrollment-submission (with ProgramAdmin)"
      - "POST /consumers (with ProgramAdmin)"
      - "every GET scoped to its own merchant_id"
  - name: Consumer
    description: "The homeowner borrower. Acknowledges disclosures, accepts offers, verifies milestones requiring signoff, certifies completion, disputes incomplete work and pays."
    identity: "entity_backed:Consumer"
    exclusive_operations:
      - "POST /credit-applications/{id}/disclosure-acknowledgement"
      - "POST /credit-applications/{id}/acceptance"
      - "POST /projects/{id}/completion-certification"
      - "POST /dispute-cases"
    shared_operations:
      - "POST /projects/{id}/milestones/{milestone_id}/verification (with ServicingAgent, and exclusively when requires_consumer_signoff is true)"
      - "POST /payments (with ServicingAgent)"
      - "every GET scoped to its own consumer_id"
  - name: ProgramUnderwriter
    description: "Credit-program operator who verifies licences, decides merchant enrollment and grants promotion enrollments. Recorded in Merchant.approved_by_user_id, which bars it from later clearing that merchant's fraud alerts."
    identity: opaque
    exclusive_operations:
      - "POST /merchants/{id}/licenses/{license_id}/verification"
      - "POST /merchants/{id}/enrollment-decision"
    shared_operations:
      - "POST /merchants/{id}/promotion-enrollments (with ProgramAdmin)"
      - "read-only access to every program, merchant, application, loan, project, draw and dispute collection"
  - name: RiskAnalyst
    description: "Fraud operator who raises and investigates phantom-project alerts. May not close an alert on a merchant it approved (it never approves, but the check is enforced against Merchant.approved_by_user_id whatever role wrote it)."
    identity: opaque
    exclusive_operations:
      - "POST /merchants/{id}/fraud-alerts"
      - "POST /merchants/{id}/fraud-alerts/{alert_id}/investigation"
    shared_operations:
      - "read-only access to merchants, alerts, applications, loans, projects, draws and disputes"
  - name: ServicingAgent
    description: "Money-movement operator: settles and reverses draws, posts reserve adjustments, resolves disputes, posts payments and runs the expiration sweep. Recorded in FundingDraw.released_by_user_id, which bars it from resolving disputes on projects it funded."
    identity: opaque
    exclusive_operations:
      - "POST /funding-draws/{id}/settlement"
      - "POST /funding-draws/{id}/reversal"
      - "POST /merchants/{id}/holdback-adjustments"
      - "POST /dispute-cases/{id}/resolution"
    shared_operations:
      - "POST /servicing/expiration-sweeps (with ProgramAdmin)"
      - "POST /_clock/set_current_utc (with ProgramAdmin)"
      - "POST /payments (with Consumer)"
      - "POST /projects/{id}/milestones/{milestone_id}/verification (with Consumer, only when requires_consumer_signoff is false)"
      - "read-only access to every collection"
  - name: ProgramAdmin
    description: "Program owner: maintains trade rules and promotion plans, registers merchants and changes program posture (suspend, reinstate, terminate)."
    identity: opaque
    exclusive_operations:
      - "POST /trade-rules"
      - "POST /promotion-plans"
      - "POST /merchants"
      - "POST /merchants/{id}/program-action"
    shared_operations:
      - "POST /merchants/{id}/licenses (with Merchant)"
      - "POST /merchants/{id}/enrollment-submission (with Merchant)"
      - "POST /merchants/{id}/promotion-enrollments (with ProgramUnderwriter)"
      - "POST /consumers (with Merchant)"
      - "POST /servicing/expiration-sweeps (with ServicingAgent)"
      - "POST /_clock/set_current_utc (with ServicingAgent)"
      - "read-only access to every collection"
