              as: OpsAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 1, license_type: "LCSW", geography: "CA", cpt_code: "90837", rate_cents: 15000, effective_from: "2026-01-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/clinicians"
              payload: { full_name: "Dana Reyes", license_type: "LCSW", primary_state: "CA", specialty_tags: ["ANXIETY"], weekly_caseload_target: 8, availability_blocks: [{ weekday: 2, start_minute: 480, end_minute: 1080 }, { weekday: 3, start_minute: 480, end_minute: 1080 }] }
              as: OpsAdmin
              captures: { clinician_id: $.data.id }
            - call: "POST /network/clinicians/${clinician_id}/licenses"
              payload: { license_number: "LCSW-CA-77120", license_type: "LCSW", issuing_state: "CA", expires_on: "2027-06-30T00:00:00Z", telehealth_eligible: true }
              as: OpsAdmin
              captures: { license_id: $.data.id }
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - call: "POST /network/payer-enrollments"
              payload: { clinician_id: "${clinician_id}", payer_id: "${payer_id}", delegated: true, effective_from: "2026-02-01T00:00:00Z" }
              as: OpsAdmin
              captures: { enrollment_id: $.data.id }
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /network/patients"
              payload: { full_name: "Priya Anand", member_id: "MBR-4410", payer_id: "${payer_id}", plan_code: "PPO-2000", state_code: "CA", deductible_cents: 100000, coinsurance_rate: 0.20, oop_max_cents: 200000 }
