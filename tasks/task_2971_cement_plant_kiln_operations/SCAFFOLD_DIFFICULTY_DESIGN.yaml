            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-08-01T12:00:00Z" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/complete", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.20, kiln_run_id: "${r0}" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/release-clinker", as: QualityManager, payload: {} }
            - { call: "GET /cement-ops/silos/${sc1}", as: ProcessEngineer, payload: {}, captures: { sc1_v: "$.data.version" } }
          trigger:
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_IL", clinker_tonnes_drawn: 500.00, gypsum_pct: 5.00, limestone_pct: 8.00, blaine_target_m2_per_kg: 400, expected_clinker_silo_version: "${sc1_v}" }, captures: { b1: "$.data.id", cement: "$.data.cement_tonnes" } }
          assert:
            - "the trigger returns 201 with total_batch_tonnes 574.71, gypsum_tonnes 28.74, limestone_tonnes 45.98"
            - "cement_tonnes == 574.72 and is NOT equal to total_batch_tonnes 574.71"
            - "so3_pct == 2.85, computed as (500.00*0.60 + 28.74*46.50 + 45.98*0.05) / 574.72"
            - "status PLANNED, feed_state FEED_READY, strength_branch_state PENDING, fineness_branch_state PENDING"
            - "the clinker silo now shows reserved_tonnes 500.00 and available_tonnes 83.78"
            - "a later mill certificate for exactly 574.72 t must be issuable; an implementation that reports 574.71 fails that certificate with ERR_CERTIFIED_TONNES_EXCEED_BATCH"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: kiln_run_quality_dimension_cycles_while_process_dimension_stays_completed
        grounds: >
          §1.2 KilnRun declares two independent dimensions: process_state
          (SCHEDULED -> BURNING -> COMPLETED | ABORTED) and quality_state
          (PENDING_LAB <-> QUARANTINED, PENDING_LAB -> RELEASED, RELEASED -> QUARANTINED). The
          quality dimension is a cycle driven entirely by POST /cement-ops/lab-tests, and
          release-clinker is gated on BOTH dimensions at once.
        distinguishing_aspect: >
          A single-status implementation either overwrites COMPLETED with QUARANTINED (losing the
          process dimension, so the run can never be released) or refuses the second free-lime test
          as an illegal transition. The correct behaviour walks PENDING_LAB -> QUARANTINED ->
          PENDING_LAB -> RELEASED -> QUARANTINED while process_state stays COMPLETED for all four
          steps, and each hop moves the silo's unreleased_tonnes.
        test_recipe:
          setup: >
            One completed gas-fired run R0 (583.78 t of clinker sitting unreleased in SC1). Plant
            clinker_free_lime_max_pct is 1.50. LAB1 records a failing 1.62, then a passing 1.40,
            QM1 releases, then LAB1 records a failing 1.70 on the released run.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "GAS-1", category: "NATURAL_GAS", lhv_gj_per_tonne: 48.00, nox_kg_per_gj: 0.10, co2_kg_per_gj: 56.0, chlorine_pct: 0.00 }, captures: { gas: "$.data.id" } }
            - { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K1", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 }, captures: { k1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D2", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d2: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/approve", as: QualityManager, payload: {}, captures: { d2_v: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PA", expected_raw_mix_design_version: "${d2_v}" }, captures: { pa: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 836.73, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 204.55, moisture_pct: 12.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }, captures: { r0: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${r0}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${gas}", tonnes: 45.00 } }
            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-08-01T12:00:00Z" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/complete", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.62, kiln_run_id: "${r0}" } }
            - { call: "GET /cement-ops/kiln-runs/${r0}", as: QualityManager, payload: {}, captures: { q_after_fail: "$.data.quality_state" } }
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.40, kiln_run_id: "${r0}" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/release-clinker", as: QualityManager, payload: {} }
          trigger:
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.70, kiln_run_id: "${r0}" }, captures: { in_spec: "$.data.in_spec" } }
          assert:
            - "the 1.62 test returns in_spec false with spec_max 1.50 and moves the run to quality_state QUARANTINED while process_state stays COMPLETED"
            - "the 1.40 test returns in_spec true and moves quality_state back to PENDING_LAB (the cycle), still process_state COMPLETED"
            - "the release moves quality_state to RELEASED and drops Silo.unreleased_tonnes to 0.00, available_tonnes 583.78"
            - "the trigger returns in_spec false and the run is QUARANTINED again: quality_state QUARANTINED, process_state COMPLETED, free_lime_pct 1.70"
            - "the silo is back to unreleased_tonnes 583.78 and available_tonnes 0.00 after the trigger"
            - "POST /cement-ops/kiln-runs/${r0}/light at any point after the completion returns ERR_INVALID_RUN_STATE — the process dimension never re-opens"

      - name: design_revision_cycle_is_capped_at_three_rounds_then_rejected
        grounds: >
          §1.2 RawMixDesign cycles DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT with
          revision_count incremented on each request-revision, and validation priority 93 caps the
          loop at MAX_DESIGN_REVISIONS = 3 with ERR_REVISION_LIMIT_EXCEEDED.
        distinguishing_aspect: >
          A linear implementation refuses the very first REVISION_REQUESTED -> DRAFT PATCH as an
          illegal transition; an uncapped cyclic implementation accepts a 4th revision round and
          reports revision_count 4. The correct behaviour accepts exactly three full loops
          (revision_count 3) and then refuses the 4th request-revision with 409
          ERR_REVISION_LIMIT_EXCEEDED while leaving the design in SUBMITTED.
        test_recipe:
          setup: >
            ENG1 authors design D3 and walks the revise loop three times with QM1; on the third
            re-submission the design is still SUBMITTED with revision_count 3.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D3", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d3: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d3}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d3}/request-revision", as: QualityManager, payload: { revision_reason: "raise the silica modulus" } }
            - { call: "PATCH /cement-ops/raw-mix-designs/${d3}", as: ProcessEngineer, payload: { target_sm: 2.40 }, captures: { status_after_patch: "$.data.status" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d3}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d3}/request-revision", as: QualityManager, payload: { revision_reason: "check the alumina modulus" } }
            - { call: "PATCH /cement-ops/raw-mix-designs/${d3}", as: ProcessEngineer, payload: { target_am: 2.45 } }
            - { call: "POST /cement-ops/raw-mix-designs/${d3}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d3}/request-revision", as: QualityManager, payload: { revision_reason: "tighten the pile tolerance" } }
            - { call: "PATCH /cement-ops/raw-mix-designs/${d3}", as: ProcessEngineer, payload: { pile_lsf_tolerance: 2.00 } }
            - { call: "POST /cement-ops/raw-mix-designs/${d3}/submit", as: ProcessEngineer, payload: {}, captures: { rev3: "$.data.revision_count" } }
          trigger:
            - { call: "POST /cement-ops/raw-mix-designs/${d3}/request-revision", as: QualityManager, payload: { revision_reason: "one more look" }, captures: { err: "$.data.error_id" } }
          assert:
            - "each PATCH out of REVISION_REQUESTED returns status DRAFT — the cycle really closes"
            - "revision_count reads 1, 2 then 3 after the three request-revision calls and never decreases"
            - "the trigger returns 409 with error_id ERR_REVISION_LIMIT_EXCEEDED"
            - "after the refusal the design is still status SUBMITTED with revision_count 3, and POST /cement-ops/raw-mix-designs/${d3}/approve then succeeds"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: certificate_revocation_cascades_four_hops_to_the_customer_ledger
        grounds: >
          §1.2 MillCertificate's revoke transition declares four numbered hops, each caused by the
          previous one: hop 1 CementBatch CERTIFIED -> DECERTIFIED with certified_tonnes_allocated
          reset, hop 2 the batch's cement Silo OPEN -> BLOCKED with block_reason DECERTIFIED_CEMENT,
          hop 3 every RESERVED/LOADING LoadoutOrder on that silo -> CANCELLED_BY_QUALITY with the
          silo's block_reason and Silo.reserved_tonnes decremented, hop 4 each affected
          Customer.open_reserved_tonnes recomputed downward.
        distinguishing_aspect: >
          A one-hop implementation revokes the certificate and stops, leaving the batch CERTIFIED,
          the silo OPEN, the order RESERVED, reserved_tonnes 120.00 and
          Customer.open_reserved_tonnes 120.00 — the loadout would still be loadable from
          decertified cement. A two- or three-hop implementation gets the batch and silo right but
          leaves the customer ledger at 120.00. Only the full chain reports order status
          CANCELLED_BY_QUALITY with void_reason DECERTIFIED_CEMENT and both ledgers at 0.00.
        test_recipe:
          setup: >
            The canonical certificate chain: one plant, LS/CL materials, gas fuel, kiln K1, clinker
            silo SC1 and cement silo SM1 (2 spouts), approved design D2, sealed pile PA, run R0
            burned and released (583.78 t of clinker), TYPE_IL batch B1 (500.00 t drawn, 5.00%
            gypsum, 8.00% limestone -> cement_tonnes 574.72), both lab branches passed by LAB1 so
            B1 is QUALIFIED, customer CU1 (TYPE_IL, max_so3 3.00), certificate MC1 for 574.72 t
            issued by QM1, and loadout order LO1 for 120.00 t in the 08-05 06:00-08:00 window.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "GAS-1", category: "NATURAL_GAS", lhv_gj_per_tonne: 48.00, nox_kg_per_gj: 0.10, co2_kg_per_gj: 56.0, chlorine_pct: 0.00 }, captures: { gas: "$.data.id" } }
            - { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K1", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 }, captures: { k1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
