            - "the third trigger returns HTTP 403 and ${e_self_case} == ERR_SEGREGATION_OF_DUTIES"
            - "SubscriberCase.${case_id}.status == UNDER_REVIEW, decision == null and decided_by_ref == null after the third trigger"
            - "the last trigger returns HTTP 200 with ${case_final} == DENIED, ${case_by} == PA-3 and ${case_reinstated} == false"
            - "Enrollment.${enr2_id}.benefit_status == DE_ENROLLED and de_enrolled_by_ref == PA-1 - the DENY arm leaves the enrollment untouched"
            - "Provider.${prov_id}.claim_gross_cents == 1850, recouped_cents == 0 and audit_hold_flag == false"

  # =========================================================================
  # SECTION 8 - cross_cutting_complexity_layers
  # (claim-extraction-guide "From Cross-Cutting Complexity Layers"; the active
  #  layers in complexity_profile are optimistic_concurrency,
  #  cascading_side_effects, dual_variant_calculation, rate_threshold_triggers)
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_enrollment_version_blocks_the_port_request
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.transfer-request-stale-enrollment
          - errors[ERR_STALE_ENROLLMENT_VERSION]
          - endpoints[POST /lifeline/service-transfers]
        distinguishing_aspect: |
          The OCC field guards the PARENT enrollment, not the transfer being created, and the
          version it must match moves on writes that have nothing to do with porting: a
          single usage post between the read and the write is enough to make the request
          stale (412, ERR_STALE_ENROLLMENT_VERSION, no ServiceTransfer row created), and the
          re-read version succeeds and itself bumps the enrollment version by exactly one.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; carrier P1 (holding) and carrier P2 (gaining), both ACTIVE, licensed in TX, cap 50."
            - "One VOICE enrollment E1 on P1 with an explicit benefit_start_date of 2026-05-01, so port_freeze_until (2026-06-30) is already in the past."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143180", study_area_code: "489180", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /lifeline/providers"
              payload: { name: "Assurance Mobile", spin_id: "143181", study_area_code: "489181", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { p2_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { addr_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-U1" }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { chk_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub_id}", provider_id: "${p1_id}", eligibility_check_id: "${chk_id}", certified_address_id: "${addr_id}", service_type: "VOICE", one_per_household_attested: true, benefit_start_date: "2026-05-01T00:00:00Z" }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { enr_id: $.data.id, freeze: $.data.port_freeze_until }
            - call: "GET /lifeline/enrollments/${enr_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { ver_stale: $.data.version }
            - call: "POST /lifeline/enrollments/${enr_id}/usage"
              payload: { usage_kind: "VOICE_CALL" }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { ver_after_usage: $.data.version }
          trigger:
            - call: "POST /lifeline/service-transfers"
