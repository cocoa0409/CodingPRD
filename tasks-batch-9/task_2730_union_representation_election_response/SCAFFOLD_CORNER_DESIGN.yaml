      - name: a_three_hop_cascade_is_visible_to_every_reader_in_the_same_instant
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Supervisor.transitions.TRAINED_to_UNTRAINED
          - entities.Petition.fields.retraining_required
          - entities.CampaignCommunication.fields.blocked_reason
          - endpoints.GET_supervisors
        distinguishing_aspect: |
          The point is the visibility of a cascade, not the cascade itself: the moment record-violation returns,
          the decertification is already reflected three hops away - in the message row, in the petition flag,
          and in every filtered collection read of both collections, with no re-read and no lag. The reverse
          is also immediate and, unlike the blocking-charge cascade, deliberately not compensating: retraining
          shows TRAINED in its own response body while the blocked message and the petition flag stay exactly
          where the cascade left them, because no declared side effect restores them.
        test_recipe:
          setup:
            - "petition 07-RC-340802 in ELECTION_SET with supervisor Marta Chen TRAINED at 2026-08-20T15:00:00Z"
            - "one APPROVED small-group-meeting message presented by her"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-03T09:00:00Z"}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: {"case_number": "07-RC-340802", "petition_type": "RC", "union_name": "United Plant Workers Local 812", "filed_date": "2026-08-03", "proposed_unit_description": "All production and maintenance employees at Plant 1", "claimed_employee_count": 120, "payroll_period_end": "2026-08-14"}
              as: LaborRelationsDirector
              captures: {"pet_id": "$.data.id"}
