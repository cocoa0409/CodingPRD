            - { call: "POST /wire-ops/investigations", payload: { wire_id: "${s13_w}", type: "NON_RECEIPT", note: "beneficiary claims non-receipt" }, as: WireInvestigator, as_user_id: "inv-1", captures: { s13_inv: $.data.id, s13_inv_status: $.data.status } }
          trigger:
            - { call: "POST /wire-ops/investigations/${s13_inv}/respond", payload: { body: "premature reply" }, as: WireInvestigator, as_user_id: "inv-1", captures: { s13_err: $.data.error_id } }
          assert:
            - "Investigation started OPEN (${s13_inv_status}); respond from OPEN: ${s13_err} == ERR_INVALID_STATE (a tracer must be dispatched first)"

      - name: sanctions_hit_double_disposition_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.SanctionsHit.OPEN_to_RELEASED_FALSE_POSITIVE", "validations[priority=13]", "errors[ERR_HIT_ALREADY_RESOLVED]"]
        distinguishing_aspect: "A hit in a terminal disposition (RELEASED_FALSE_POSITIVE) rejects both a second release and a confirm with ERR_HIT_ALREADY_RESOLVED — dispositions are single-shot."
        test_recipe:
          setup:
            - "Customer CS14 (MEDIUM), Account AS14, Beneficiary BS14, BusinessDate 2026-09-09 OPEN"
            - "Wire WS14 (300000) submitted; OPEN hit HS14 injected"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "SM Fourteen", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cs14: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cs14}", account_number: "A-S014", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { as14: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cs14}", name: "SM Ben14", bank_name: "SMBank14", account_number: "B-S014", country_code: "US" }, as: WireOperator, captures: { bs14: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-09" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${as14}", beneficiary_id: "${bs14}", amount_cents: 300000, method: "Fedwire", purpose: "disposition probe" }, as: WireOperator, as_user_id: "op-1", captures: { s14_w: $.data.id } }
            - { call: "POST /wire-ops/wires/${s14_w}/submit", payload: { business_date: "2026-09-09" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/_screening/simulate", payload: { wire_id: "${s14_w}", matched_list: "INTERNAL_WATCH", matched_party: "SM Ben14", match_score: 66 }, as: SanctionsScreener, captures: { s14_hit: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/sanctions-hits/${s14_hit}/release", payload: { rationale: "false positive" }, as: SanctionsScreener, as_user_id: "ss-1", captures: { s14_h: $.data.status } }
            - { call: "POST /wire-ops/sanctions-hits/${s14_hit}/release", payload: { rationale: "again" }, as: SanctionsScreener, as_user_id: "ss-1", captures: { s14_err1: $.data.error_id } }
            - { call: "POST /wire-ops/sanctions-hits/${s14_hit}/confirm", payload: { rationale: "changed my mind" }, as: SanctionsScreener, as_user_id: "ss-1", captures: { s14_err2: $.data.error_id } }
          assert:
            - "First release succeeds: ${s14_h} == RELEASED_FALSE_POSITIVE"
            - "Second release: ${s14_err1} == ERR_HIT_ALREADY_RESOLVED; confirm after release: ${s14_err2} == ERR_HIT_ALREADY_RESOLVED"

      - name: account_close_blocked_by_open_wire
        claim_type: precondition_enforcement
        grounds: ["state_machines.Account.ACTIVE_to_CLOSED", "validations[priority=29]", "errors[ERR_ACCOUNT_NOT_SETTLED]"]
        distinguishing_aspect: "An account with a non-terminal wire cannot be closed; once the wire is cancelled the same close succeeds."
        test_recipe:
          setup:
            - "Customer CS15 (MEDIUM), Account AS15, Beneficiary BS15, BusinessDate 2026-09-10 OPEN, Wire WS15 (100000) submitted (PENDING_APPROVAL)"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "SM Fifteen", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cs15: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cs15}", account_number: "A-S015", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { as15: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cs15}", name: "SM Ben15", bank_name: "SMBank15", account_number: "B-S015", country_code: "US" }, as: WireOperator, captures: { bs15: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-10" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${as15}", beneficiary_id: "${bs15}", amount_cents: 100000, method: "Fedwire", purpose: "acct close probe" }, as: WireOperator, as_user_id: "op-1", captures: { s15_w: $.data.id } }
            - { call: "POST /wire-ops/wires/${s15_w}/submit", payload: { business_date: "2026-09-10" }, as: WireOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /wire-ops/accounts/${as15}/close", payload: {}, as: WireOpsAdmin, captures: { s15_err: $.data.error_id } }
            - { call: "POST /wire-ops/wires/${s15_w}/cancel", payload: {}, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/accounts/${as15}/close", payload: {}, as: WireOpsAdmin, captures: { s15_st: $.data.status } }
          assert:
            - "First close: ${s15_err} == ERR_ACCOUNT_NOT_SETTLED; after wire CANCELLED: Account.${as15}.status == CLOSED (${s15_st})"

      - name: customer_close_blocked_by_open_wire
        claim_type: precondition_enforcement
        grounds: ["state_machines.Customer.ACTIVE_to_CLOSED", "validations[priority=28]", "errors[ERR_CUSTOMER_NOT_SETTLED]"]
        distinguishing_aspect: "A customer with any non-terminal wire across any of its accounts cannot be closed (ERR_CUSTOMER_NOT_SETTLED); rejecting the wire settles the customer and the close succeeds."
        test_recipe:
          setup:
            - "Customer CS16 (MEDIUM), Account AS16, Beneficiary BS16, BusinessDate 2026-09-11 OPEN, Wire WS16 (100000) submitted"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "SM Sixteen", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cs16: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cs16}", account_number: "A-S016", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { as16: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cs16}", name: "SM Ben16", bank_name: "SMBank16", account_number: "B-S016", country_code: "US" }, as: WireOperator, captures: { bs16: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-11" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${as16}", beneficiary_id: "${bs16}", amount_cents: 100000, method: "Fedwire", purpose: "cust close probe" }, as: WireOperator, as_user_id: "op-1", captures: { s16_w: $.data.id } }
            - { call: "POST /wire-ops/wires/${s16_w}/submit", payload: { business_date: "2026-09-11" }, as: WireOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /wire-ops/customers/${cs16}/close", payload: {}, as: WireOpsAdmin, captures: { s16_err: $.data.error_id } }
            - { call: "POST /wire-ops/wires/${s16_w}/reject", payload: { reason: "settle" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "POST /wire-ops/customers/${cs16}/close", payload: {}, as: WireOpsAdmin, captures: { s16_st: $.data.status } }
          assert:
            - "First close: ${s16_err} == ERR_CUSTOMER_NOT_SETTLED; after wire REJECTED: Customer.${cs16}.status == CLOSED (${s16_st})"

      - name: callback_denied_cancels_wire
        claim_type: side_effect_execution
        grounds: ["state_machines.CallbackVerification.OPEN_to_DENIED", "state_machines.WireTransfer.CALLBACK_PENDING_to_CANCELLED"]
        distinguishing_aspect: "A DENIED callback outcome resolves the case and cascades the wire to CANCELLED with callback_status reset to NONE — the customer disavowing the payment kills it."
        test_recipe:
          setup:
            - "Customer CS17 (MEDIUM), Account AS17 (limit 500000000), Beneficiary BS17, Wire WS17 (150000000) in CALLBACK_PENDING with OPEN case CBS17"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "SM Seventeen", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cs17: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cs17}", account_number: "A-S017", daily_outgoing_limit_cents: 500000000 }, as: WireOpsAdmin, captures: { as17: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cs17}", name: "SM Ben17", bank_name: "SMBank17", account_number: "B-S017", country_code: "US" }, as: WireOperator, captures: { bs17: $.data.id } }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${as17}", beneficiary_id: "${bs17}", amount_cents: 150000000, method: "Fedwire", purpose: "deny probe" }, as: WireOperator, as_user_id: "op-1", captures: { s17_w: $.data.id } }
            - { call: "GET /wire-ops/wires/${s17_w}/callbacks", as: WireOperator, captures: { s17_cb: "$.data[0].id" } }
          trigger:
            - { call: "POST /wire-ops/callbacks/${s17_cb}/record", payload: { outcome: "DENIED", contact_name: "Treasurer", contact_phone: "+1-555-0102" }, as: WireOperator, as_user_id: "op-1", captures: { s17_cb_status: $.data.status } }
            - { call: "GET /wire-ops/wires/${s17_w}", as: WireOperator, captures: { s17_w_status: $.data.status, s17_w_cb: $.data.callback_status } }
          assert:
            - "CallbackVerification.${s17_cb}.status == DENIED (${s17_cb_status})"
            - "WireTransfer.${s17_w}.status == CANCELLED (${s17_w_status}) and callback_status == NONE (${s17_w_cb})"

  # ======================================================= 3. calculations
  - section: calculations
    instances:
      - name: risk_score_amount_band_edges
        claim_type: boundary_edge
        grounds: ["calculations.risk_score", "entities.WireTransfer.fields.risk_score"]
        distinguishing_aspect: "The amount band boundary is inclusive at $1M: a 99999999-cent wire scores band 0 while a 100000000-cent wire scores band 25, with all other components held at zero by reusing an already-executed beneficiary."
        test_recipe:
          setup:
            - "Customer CC1 (LOW, high_risk_jurisdiction false), Account AC1 (limit 500000000, ACTIVE), Beneficiary BC1, BusinessDate 2026-09-14 OPEN"
            - "Wire W1C (99999999) fully EXECUTED — BC1.first_used_at now set; submit-time score captured"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Calc One", risk_rating: "LOW", high_risk_jurisdiction: false }, as: WireOpsAdmin, captures: { cc1: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cc1}", account_number: "A-C101", daily_outgoing_limit_cents: 500000000 }, as: WireOpsAdmin, captures: { ac1: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cc1}", name: "Calc Ben", bank_name: "CalcBank", account_number: "B-C101", country_code: "US" }, as: WireOperator, captures: { bc1: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-14" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ac1}", beneficiary_id: "${bc1}", amount_cents: 99999999, method: "Fedwire", purpose: "band lo" }, as: WireOperator, as_user_id: "op-1", captures: { c1_w1: $.data.id } }
            - { call: "POST /wire-ops/wires/${c1_w1}/submit", payload: { business_date: "2026-09-14" }, as: WireOperator, as_user_id: "op-1", captures: { c1_r1: $.data.risk_score } }
            - { call: "GET /wire-ops/wires/${c1_w1}", as: WireOperator, captures: { c1_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${c1_w1}/approve", payload: { expected_wire_version: "${c1_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${c1_w1}", as: WireOperator, captures: { c1_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${c1_w1}/approve", payload: { expected_wire_version: "${c1_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${c1_w1}", as: WireOperator, captures: { c1_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${c1_w1}/release", payload: { expected_wire_version: "${c1_v3}" }, as: WireOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ac1}", beneficiary_id: "${bc1}", amount_cents: 100000000, method: "Fedwire", purpose: "band hi" }, as: WireOperator, as_user_id: "op-1", captures: { c1_w2: $.data.id } }
            - { call: "POST /wire-ops/wires/${c1_w2}/submit", payload: { business_date: "2026-09-14", waive_callback: true }, as: WireOperator, as_user_id: "op-1", captures: { c1_r2: $.data.risk_score, c1_cb2: $.data.callback_status } }
          assert:
            - "Wire W1C submit risk_score == 10 (${c1_r1}): band 0 + new-beneficiary 10, all else 0 — 99999999 cents is below the $1M band"
            - "Wire W2C submit risk_score == 25 (${c1_r2}): band 25 (100000000 >= AMOUNT_BAND_1, inclusive) with new-beneficiary now 0 (BC1 executed once); velocity 0 (99999999 <= 1000000000)"
            - "W2C callback obligation waived on a LOW-risk customer: callback_status == WAIVED (${c1_cb2}) and submit succeeded"

      - name: fee_components_chips_normal_no_charges
        claim_type: correct_result
        grounds: ["calculations.fee_assessment", "entities.FeeAssessment.fields.total_fee_cents"]
        distinguishing_aspect: "Constants applied with an EMPTY charge set: a CHIPS NORMAL wire with charge_mode OUR and zero correspondent charges assesses exactly the CHIPS base 1800 and nothing else; net principal equals the full amount."
        test_recipe:
          setup:
            - "Customer CC2 (MEDIUM), Account AC2 (limit 250000000), Beneficiary BC2, BusinessDate 2026-09-15 OPEN, Wire W2C (500000, CHIPS, NORMAL, OUR) fully EXECUTED"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Calc Two", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cc2: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cc2}", account_number: "A-C202", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ac2: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cc2}", name: "Calc Ben2", bank_name: "CalcBank2", account_number: "B-C202", country_code: "US" }, as: WireOperator, captures: { bc2: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-15" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ac2}", beneficiary_id: "${bc2}", amount_cents: 500000, method: "CHIPS", purpose: "fee zero" }, as: WireOperator, as_user_id: "op-1", captures: { c2_w: $.data.id } }
            - { call: "POST /wire-ops/wires/${c2_w}/submit", payload: { business_date: "2026-09-15" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${c2_w}", as: WireOperator, captures: { c2_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${c2_w}/approve", payload: { expected_wire_version: "${c2_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${c2_w}", as: WireOperator, captures: { c2_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${c2_w}/approve", payload: { expected_wire_version: "${c2_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${c2_w}", as: WireOperator, captures: { c2_v3: $.data.version } }
          trigger:
            - { call: "POST /wire-ops/wires/${c2_w}/release", payload: { expected_wire_version: "${c2_v3}" }, as: WireOperator, as_user_id: "op-1", captures: { c2_fee: $.data.fee_assessed_cents, c2_net: $.data.net_principal_cents } }
            - { call: "GET /wire-ops/wires/${c2_w}/fees", as: WireOperator, captures: { c2_fid: "$.data[0].id", c2_fbase: "$.data[0].base_fee_cents", c2_fprio: "$.data[0].priority_fee_cents", c2_fben: "$.data[0].beneficiary_share_cents", c2_fcorr: "$.data[0].correspondent_share_cents", c2_ftotal: "$.data[0].total_fee_cents", c2_fkind: "$.data[0].kind" } }
          assert:
            - "Exactly one assessment, kind FINAL (${c2_fkind}): base 1800 (${c2_fbase}), priority 0 (${c2_fprio}), beneficiary 0 (${c2_fben}), correspondent 0 (${c2_fcorr}), total 1800 (${c2_ftotal})"
            - "WireTransfer.${c2_w}.fee_assessed_cents == 1800 (${c2_fee}); net_principal_cents == 500000 (${c2_net})"

      - name: fee_assessment_kind_state_gating
        claim_type: variant_selection
        grounds: ["calculations.fee_assessment", "endpoints[POST /wire-ops/wires/{wireId}/fees/assess]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Variant selection is context-gated: FINAL is rejected while the wire is not yet EXECUTED and PROVISIONAL is rejected once it is — each kind has exactly one valid window."
        test_recipe:
          setup:
            - "Customer CC3 (MEDIUM), Account AC3, Beneficiary BC3, BusinessDate 2026-09-16 OPEN, Wire W3C (500000, Fedwire) submitted (PENDING_APPROVAL)"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Calc Three", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cc3: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cc3}", account_number: "A-C303", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ac3: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cc3}", name: "Calc Ben3", bank_name: "CalcBank3", account_number: "B-C303", country_code: "US" }, as: WireOperator, captures: { bc3: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-16" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ac3}", beneficiary_id: "${bc3}", amount_cents: 500000, method: "Fedwire", purpose: "gating probe" }, as: WireOperator, as_user_id: "op-1", captures: { c3_w: $.data.id } }
            - { call: "POST /wire-ops/wires/${c3_w}/submit", payload: { business_date: "2026-09-16" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${c3_w}", as: WireOperator, captures: { c3_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${c3_w}/approve", payload: { expected_wire_version: "${c3_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${c3_w}", as: WireOperator, captures: { c3_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${c3_w}/approve", payload: { expected_wire_version: "${c3_v2}" }, as: WireApprover, as_user_id: "ap-2" }
          trigger:
            - { call: "POST /wire-ops/wires/${c3_w}/fees/assess", payload: { kind: "FINAL" }, as: WireOperator, as_user_id: "op-1", captures: { c3_err1: $.data.error_id } }
            - { call: "GET /wire-ops/wires/${c3_w}", as: WireOperator, captures: { c3_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${c3_w}/release", payload: { expected_wire_version: "${c3_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/wires/${c3_w}/fees/assess", payload: { kind: "PROVISIONAL" }, as: WireOperator, as_user_id: "op-1", captures: { c3_err2: $.data.error_id } }
          assert:
            - "FINAL while APPROVED (pre-execution): ${c3_err1} == ERR_INVALID_STATE"
            - "PROVISIONAL after EXECUTED: ${c3_err2} == ERR_INVALID_STATE"

  # ======================================================== 4. validations
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails priority-1 with ERR_MISSING_AUTH (400) before role, existence, or business checks."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "No Auth", risk_rating: "LOW" }, captures: { v1_err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_AUTH (${v1_err}), HTTP 400; no customer is created"

      - name: role_forbidden_precedes_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "errors[ERR_FORBIDDEN_ROLE]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A WireOperator calling approve on a NONEXISTENT wire id gets ERR_FORBIDDEN_ROLE (403), proving authorization (priority 2) runs before existence (priority 3)."
        test_recipe:
          setup:
            - "One real wire exists (to source a well-formed version value); the targeted wire id is a random UUID present nowhere"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Val Two", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cv2: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cv2}", account_number: "A-V002", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { av2: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cv2}", name: "Val Ben2", bank_name: "ValBank2", account_number: "B-V002", country_code: "US" }, as: WireOperator, captures: { bv2: $.data.id } }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${av2}", beneficiary_id: "${bv2}", amount_cents: 100000, method: "Fedwire", purpose: "priority order probe" }, as: WireOperator, as_user_id: "op-1", captures: { wv2: $.data.id, wv2_v: $.data.version } }
          trigger:
            - { call: "POST /wire-ops/wires/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/approve", payload: { expected_wire_version: "${wv2_v}" }, as: WireOperator, as_user_id: "op-1", captures: { v2_err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (${v2_err}), HTTP 403 — NOT ERR_NOT_FOUND, even though the wire id does not exist"

      - name: recall_amount_exceeds_principal_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", "errors[ERR_RECALL_AMOUNT_EXCEEDS]"]
        distinguishing_aspect: "amount_to_recall_cents is bounded by (0, wire.amount_cents]: one cent over the principal and a zero amount are both rejected with ERR_RECALL_AMOUNT_EXCEEDS (422) while exactly the principal passes validation."
        test_recipe:
          setup:
            - "Customer CV3 (MEDIUM), Account AV3, Beneficiary BV3, BusinessDate 2026-09-17 OPEN, Wire WV3 (1000000) fully EXECUTED"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Val Three", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cv3: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cv3}", account_number: "A-V003", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { av3: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cv3}", name: "Val Ben3", bank_name: "ValBank3", account_number: "B-V003", country_code: "US" }, as: WireOperator, captures: { bv3: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-17" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${av3}", beneficiary_id: "${bv3}", amount_cents: 1000000, method: "Fedwire", purpose: "recall amount probe" }, as: WireOperator, as_user_id: "op-1", captures: { wv3: $.data.id } }
            - { call: "POST /wire-ops/wires/${wv3}/submit", payload: { business_date: "2026-09-17" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wv3}", as: WireOperator, captures: { v3_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wv3}/approve", payload: { expected_wire_version: "${v3_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wv3}", as: WireOperator, captures: { v3_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wv3}/approve", payload: { expected_wire_version: "${v3_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${wv3}", as: WireOperator, captures: { v3_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${wv3}/release", payload: { expected_wire_version: "${v3_v3}" }, as: WireOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /wire-ops/recalls", payload: { wire_id: "${wv3}", reason: "ERROR_AMOUNT", amount_to_recall_cents: 1000001 }, as: WireOperator, as_user_id: "op-1", captures: { v3_err1: $.data.error_id } }
            - { call: "POST /wire-ops/recalls", payload: { wire_id: "${wv3}", reason: "ERROR_AMOUNT", amount_to_recall_cents: 0 }, as: WireOperator, as_user_id: "op-1", captures: { v3_err2: $.data.error_id } }
            - { call: "POST /wire-ops/recalls", payload: { wire_id: "${wv3}", reason: "ERROR_AMOUNT", amount_to_recall_cents: 1000000 }, as: WireOperator, as_user_id: "op-1", captures: { v3_ok: $.data.status } }
          assert:
            - "1000001 (one cent over): ${v3_err1} == ERR_RECALL_AMOUNT_EXCEEDS (422); 0: ${v3_err2} == ERR_RECALL_AMOUNT_EXCEEDS"
            - "Exactly the principal (1000000) is accepted: RecallRequest status == REQUESTED (${v3_ok})"

      - name: unfreeze_blocked_by_open_fraud_hold
        claim_type: cross_entity
        grounds: ["validations[priority=28]", "state_machines.Customer.FROZEN_to_ACTIVE", "errors[ERR_CUSTOMER_STILL_FROZEN]"]
        distinguishing_aspect: "Customer unfreeze is gated on a DIFFERENT entity's lifecycle: while any FraudHold on the customer's wires is OPEN the unfreeze fails; once the hold reaches a terminal disposition the same unfreeze succeeds."
        test_recipe:
          setup:
            - "Customer CV4 (MEDIUM), Account AV4, Beneficiary BV4, BusinessDate 2026-09-18 OPEN, Wire WV4 (100000) APPROVED with an OPEN FraudHold HV4; CV4 frozen by admin while the hold is open"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Val Four", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cv4: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cv4}", account_number: "A-V004", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { av4: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cv4}", name: "Val Ben4", bank_name: "ValBank4", account_number: "B-V004", country_code: "US" }, as: WireOperator, captures: { bv4: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-18" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${av4}", beneficiary_id: "${bv4}", amount_cents: 100000, method: "Fedwire", purpose: "unfreeze gate" }, as: WireOperator, as_user_id: "op-1", captures: { wv4: $.data.id } }
            - { call: "POST /wire-ops/wires/${wv4}/submit", payload: { business_date: "2026-09-18" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wv4}", as: WireOperator, captures: { v4_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wv4}/approve", payload: { expected_wire_version: "${v4_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wv4}", as: WireOperator, captures: { v4_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wv4}/approve", payload: { expected_wire_version: "${v4_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "POST /wire-ops/wires/${wv4}/fraud-holds", payload: { reason_code: "MULE_SUSPECT", note: "mule pattern" }, as: FraudAnalyst, as_user_id: "fa-1", captures: { hv4: $.data.id } }
            - { call: "POST /wire-ops/customers/${cv4}/freeze", payload: {}, as: WireOpsAdmin }
          trigger:
            - { call: "POST /wire-ops/customers/${cv4}/unfreeze", payload: {}, as: WireOpsAdmin, captures: { v4_err: $.data.error_id } }
            - { call: "POST /wire-ops/fraud-holds/${hv4}/customer-confirm", payload: { confirmation: "LEGITIMATE" }, as: FraudAnalyst, as_user_id: "fa-1" }
            - { call: "POST /wire-ops/customers/${cv4}/unfreeze", payload: {}, as: WireOpsAdmin, captures: { v4_status: $.data.status } }
          assert:
            - "Unfreeze with OPEN hold: ${v4_err} == ERR_CUSTOMER_STILL_FROZEN (409)"
            - "After the hold is CLEARED: unfreeze succeeds, Customer.${cv4}.status == ACTIVE (${v4_status}), frozen_at == null"

      - name: sod_initiator_and_repeat_approver_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "state_machines.ApprovalRecord", "errors[ERR_SOD_APPROVER_MISMATCH]"]
        distinguishing_aspect: "Segregation of duties pins actor identity, not just role: the initiating operator (acting with the WireApprover role) cannot approve their own wire, and one approver cannot supply both approvals of the dual pair."
        test_recipe:
          setup:
            - "Customer CV5 (MEDIUM), Account AV5, Beneficiary BV5, BusinessDate 2026-09-21 OPEN, Wire WV5 (100000) initiated by op-1 and submitted"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Val Five", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cv5: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cv5}", account_number: "A-V005", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { av5: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cv5}", name: "Val Ben5", bank_name: "ValBank5", account_number: "B-V005", country_code: "US" }, as: WireOperator, captures: { bv5: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-21" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${av5}", beneficiary_id: "${bv5}", amount_cents: 100000, method: "Fedwire", purpose: "sod probe" }, as: WireOperator, as_user_id: "op-1", captures: { wv5: $.data.id } }
            - { call: "POST /wire-ops/wires/${wv5}/submit", payload: { business_date: "2026-09-21" }, as: WireOperator, as_user_id: "op-1" }
          trigger:
            - { call: "GET /wire-ops/wires/${wv5}", as: WireOperator, captures: { v5_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wv5}/approve", payload: { expected_wire_version: "${v5_v1}" }, as: WireApprover, as_user_id: "op-1", captures: { v5_err1: $.data.error_id } }
            - { call: "POST /wire-ops/wires/${wv5}/approve", payload: { expected_wire_version: "${v5_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wv5}", as: WireOperator, captures: { v5_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wv5}/approve", payload: { expected_wire_version: "${v5_v2}" }, as: WireApprover, as_user_id: "ap-1", captures: { v5_err2: $.data.error_id } }
          assert:
            - "Initiator op-1 (as WireApprover) approving own wire: ${v5_err1} == ERR_SOD_APPROVER_MISMATCH"
            - "ap-1's second approval of the same wire: ${v5_err2} == ERR_SOD_APPROVER_MISMATCH — dual approval needs two DISTINCT non-initiator approvers"
            - "WireTransfer.${wv5}.status remains PENDING_APPROVAL after both rejections"

      - name: submit_callback_pending_unverified_returns_error
        claim_type: satisfaction_pass
        grounds: ["validations[priority=11]", "state_machines.WireTransfer.CALLBACK_PENDING_to_PENDING_APPROVAL", "errors[ERR_CALLBACK_NOT_VERIFIED]"]
        distinguishing_aspect: "With the business date OPEN (temporal rule satisfied), the callback gate is what blocks: submit fails with ERR_CALLBACK_NOT_VERIFIED; recording a CONFIRMED callback then lets the identical submit succeed."
        test_recipe:
          setup:
            - "Customer CV6 (MEDIUM), Account AV6 (limit 500000000), Beneficiary BV6, BusinessDate 2026-09-22 OPEN"
            - "Wire WV6 (150000000) in CALLBACK_PENDING with OPEN case CBV6"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Val Six", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cv6: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cv6}", account_number: "A-V006", daily_outgoing_limit_cents: 500000000 }, as: WireOpsAdmin, captures: { av6: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cv6}", name: "Val Ben6", bank_name: "ValBank6", account_number: "B-V006", country_code: "US" }, as: WireOperator, captures: { bv6: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-22" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${av6}", beneficiary_id: "${bv6}", amount_cents: 150000000, method: "Fedwire", purpose: "callback gate" }, as: WireOperator, as_user_id: "op-1", captures: { wv6: $.data.id } }
            - { call: "GET /wire-ops/wires/${wv6}/callbacks", as: WireOperator, captures: { cbv6: "$.data[0].id" } }
          trigger:
            - { call: "POST /wire-ops/wires/${wv6}/submit", payload: { business_date: "2026-09-22" }, as: WireOperator, as_user_id: "op-1", captures: { v6_err: $.data.error_id } }
            - { call: "POST /wire-ops/callbacks/${cbv6}/record", payload: { outcome: "CONFIRMED", contact_name: "Treasurer", contact_phone: "+1-555-0103" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/wires/${wv6}/submit", payload: { business_date: "2026-09-22" }, as: WireOperator, as_user_id: "op-1", captures: { v6_status: $.data.status, v6_vd: $.data.value_date } }
          assert:
            - "Unverified submit: ${v6_err} == ERR_CALLBACK_NOT_VERIFIED (409)"
            - "After CONFIRMED: submit succeeds, status == PENDING_APPROVAL (${v6_status}), value_date == 2026-09-22 (${v6_vd}), callback_status == VERIFIED"

      - name: second_recall_in_progress_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_RECALL_IN_PROGRESS]"]
        distinguishing_aspect: "Only one OPEN recall per wire: a second POST /recalls against a wire whose first recall is still REQUESTED fails with ERR_RECALL_IN_PROGRESS (409)."
        test_recipe:
          setup:
            - "Customer CV7 (MEDIUM), Account AV7, Beneficiary BV7, BusinessDate 2026-09-23 OPEN, Wire WV7 (1000000) fully EXECUTED, Recall RV7a REQUESTED"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Val Seven", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cv7: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cv7}", account_number: "A-V007", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { av7: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cv7}", name: "Val Ben7", bank_name: "ValBank7", account_number: "B-V007", country_code: "US" }, as: WireOperator, captures: { bv7: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-23" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${av7}", beneficiary_id: "${bv7}", amount_cents: 1000000, method: "Fedwire", purpose: "dup recall probe" }, as: WireOperator, as_user_id: "op-1", captures: { wv7: $.data.id } }
            - { call: "POST /wire-ops/wires/${wv7}/submit", payload: { business_date: "2026-09-23" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wv7}", as: WireOperator, captures: { v7_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wv7}/approve", payload: { expected_wire_version: "${v7_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wv7}", as: WireOperator, captures: { v7_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wv7}/approve", payload: { expected_wire_version: "${v7_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${wv7}", as: WireOperator, captures: { v7_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${wv7}/release", payload: { expected_wire_version: "${v7_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/recalls", payload: { wire_id: "${wv7}", reason: "DUPLICATE", amount_to_recall_cents: 500000 }, as: WireOperator, as_user_id: "op-1", captures: { rv7a: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/recalls", payload: { wire_id: "${wv7}", reason: "FRAUD", amount_to_recall_cents: 100000 }, as: WireOperator, as_user_id: "op-1", captures: { v7_err: $.data.error_id } }
          assert:
            - "error_id == ERR_RECALL_IN_PROGRESS (${v7_err}) — RecallRequest.${rv7a} is still in non-terminal REQUESTED"

  # ========================================================== 5. endpoints
  - section: endpoints
    instances:
      - name: wire_summary_computed_read
        claim_type: computed_read
        grounds: ["endpoints[GET /wire-ops/wires/{wireId}/summary]", "entities.WireTransfer.fields.reservation_active"]
        distinguishing_aspect: "The summary endpoint aggregates across SIX satellite entities in one document: approval count, open hits, open holds, recalls, open fees, and the live reservation amount."
        test_recipe:
          setup:
            - "Customer CP1 (MEDIUM), Account AP1 (limit 250000000), Beneficiary BP1, BusinessDate 2026-09-24 OPEN"
            - "Wire WP1 (300000) submitted, dual-approved (APPROVED); one OPEN fraud hold; one OPEN sanctions hit (hold_reason_code stays FRAUD_HOLD — never overwritten)"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "EP One", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cp1: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cp1}", account_number: "A-P001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ap1: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cp1}", name: "EP Ben", bank_name: "EPBank", account_number: "B-P001", country_code: "US" }, as: WireOperator, captures: { bp1: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-24" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ap1}", beneficiary_id: "${bp1}", amount_cents: 300000, method: "Fedwire", purpose: "summary probe" }, as: WireOperator, as_user_id: "op-1", captures: { wp1: $.data.id } }
            - { call: "POST /wire-ops/wires/${wp1}/submit", payload: { business_date: "2026-09-24" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wp1}", as: WireOperator, captures: { p1_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wp1}/approve", payload: { expected_wire_version: "${p1_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wp1}", as: WireOperator, captures: { p1_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wp1}/approve", payload: { expected_wire_version: "${p1_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "POST /wire-ops/wires/${wp1}/fraud-holds", payload: { reason_code: "ACCOUNT_TAKEOVER", note: "ato suspicion" }, as: FraudAnalyst, as_user_id: "fa-1" }
            - { call: "POST /wire-ops/_screening/simulate", payload: { wire_id: "${wp1}", matched_list: "INTERNAL_WATCH", matched_party: "EP Ben", match_score: 58 }, as: SanctionsScreener }
          trigger:
            - { call: "GET /wire-ops/wires/${wp1}/summary", as: WireOpsAdmin, captures: { p1_approvals: $.data.approvals, p1_hits: $.data.open_hits, p1_holds: $.data.open_holds, p1_recalls: $.data.recalls, p1_fees: $.data.open_fees, p1_res: $.data.reserved_cents } }
          assert:
            - "approvals == 2 (${p1_approvals}), open_hits == 1 (${p1_hits}), open_holds == 1 (${p1_holds}), recalls == 0 (${p1_recalls}), open_fees == 0 (${p1_fees})"
            - "reserved_cents == 300000 (${p1_res}) — reservation survives approval and holds"

      - name: release_happy_path_full_execution_effects
        claim_type: action_endpoint
        grounds: ["endpoints[POST /wire-ops/wires/{wireId}/release]", "state_machines.WireTransfer.RELEASING_to_EXECUTED"]
        distinguishing_aspect: "The happy-path release executes synchronously: executed_at is stamped, the reservation converts to the released tally, a FINAL assessment is created, and version advances — all observable in one response plus one list call."
        test_recipe:
          setup:
            - "Customer CP2 (MEDIUM), Account AP2 (limit 250000000), Beneficiary BP2, BusinessDate 2026-09-25 OPEN, Wire WP2 (200000, Fedwire NORMAL) dual-approved"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "EP Two", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cp2: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cp2}", account_number: "A-P002", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ap2: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cp2}", name: "EP Ben2", bank_name: "EPBank2", account_number: "B-P002", country_code: "US" }, as: WireOperator, captures: { bp2: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-25" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ap2}", beneficiary_id: "${bp2}", amount_cents: 200000, method: "Fedwire", purpose: "release happy" }, as: WireOperator, as_user_id: "op-1", captures: { wp2: $.data.id } }
            - { call: "POST /wire-ops/wires/${wp2}/submit", payload: { business_date: "2026-09-25" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wp2}", as: WireOperator, captures: { p2_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wp2}/approve", payload: { expected_wire_version: "${p2_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wp2}", as: WireOperator, captures: { p2_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wp2}/approve", payload: { expected_wire_version: "${p2_v2}" }, as: WireApprover, as_user_id: "ap-2", captures: { p2_v_approved: $.data.version } }
          trigger:
            - { call: "POST /wire-ops/wires/${wp2}/release", payload: { expected_wire_version: "${p2_v_approved}" }, as: WireOperator, as_user_id: "op-1", captures: { p2_status: $.data.status, p2_exec: $.data.executed_at, p2_res: $.data.reservation_active, p2_ver: $.data.version, p2_fee: $.data.fee_assessed_cents } }
            - { call: "GET /wire-ops/accounts/${ap2}", as: WireOperator, captures: { p2_reserved: $.data.daily_reserved_cents, p2_released: $.data.daily_released_cents } }
            - { call: "GET /wire-ops/wires/${wp2}/fees", as: WireOperator, captures: { p2_fee_total: "$.data[0].total_fee_cents", p2_fee_kind: "$.data[0].kind", p2_fee_status: "$.data[0].status" } }
          assert:
            - "status == EXECUTED (${p2_status}), executed_at non-null (${p2_exec}), reservation_active == false (${p2_res})"
            - "version advanced from ${p2_v_approved} to ${p2_ver} (exactly +1)"
            - "Account: daily_reserved_cents == 0 (${p2_reserved}), daily_released_cents == 200000 (${p2_released})"
            - "FINAL assessment auto-created: kind FINAL (${p2_fee_kind}), status OPEN (${p2_fee_status}), total 2500 (${p2_fee_total} == Fedwire base, no charges); wire.fee_assessed_cents == 2500 (${p2_fee})"

      - name: fee_bill_happy_and_rebill_rejected
        claim_type: action_endpoint
        grounds: ["endpoints[POST /wire-ops/fees/{feeId}/bill]", "state_machines.FeeAssessment.OPEN_to_BILLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Billing an OPEN assessment on an EXECUTED wire succeeds once; billing the now-BILLED assessment again is rejected with ERR_INVALID_STATE (BILLED is terminal for billing)."
        test_recipe:
          setup:
            - "Customer CP3 (MEDIUM), Account AP3, Beneficiary BP3, BusinessDate 2026-09-28 OPEN, Wire WP3 (200000, Fedwire) EXECUTED with its auto-created FINAL assessment FP3 (OPEN)"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "EP Three", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cp3: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cp3}", account_number: "A-P003", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ap3: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cp3}", name: "EP Ben3", bank_name: "EPBank3", account_number: "B-P003", country_code: "US" }, as: WireOperator, captures: { bp3: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-09-28" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ap3}", beneficiary_id: "${bp3}", amount_cents: 200000, method: "Fedwire", purpose: "bill probe" }, as: WireOperator, as_user_id: "op-1", captures: { wp3: $.data.id } }
            - { call: "POST /wire-ops/wires/${wp3}/submit", payload: { business_date: "2026-09-28" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wp3}", as: WireOperator, captures: { p3_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wp3}/approve", payload: { expected_wire_version: "${p3_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wp3}", as: WireOperator, captures: { p3_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wp3}/approve", payload: { expected_wire_version: "${p3_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${wp3}", as: WireOperator, captures: { p3_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${wp3}/release", payload: { expected_wire_version: "${p3_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wp3}/fees", as: WireOperator, captures: { fp3: "$.data[0].id" } }
          trigger:
            - { call: "POST /wire-ops/fees/${fp3}/bill", payload: {}, as: WireOperator, as_user_id: "op-1", captures: { p3_billed: $.data.status } }
            - { call: "POST /wire-ops/fees/${fp3}/bill", payload: {}, as: WireOperator, as_user_id: "op-1", captures: { p3_err: $.data.error_id } }
          assert:
            - "First bill: status == BILLED (${p3_billed}); second bill: ${p3_err} == ERR_INVALID_STATE"

      - name: callback_unreachable_then_confirmed_retry
        claim_type: conditional_action
        grounds: ["endpoints[POST /wire-ops/callbacks/{callbackId}/record]", "state_machines.CallbackVerification"]
        distinguishing_aspect: "UNREACHABLE is a non-terminal outcome: the case stays OPEN inside its window and a later CONFIRMED record succeeds — record is retry-safe until the window lapses."
        test_recipe:
          setup:
            - "Customer CP4 (MEDIUM), Account AP4 (limit 500000000), Beneficiary BP4, Wire WP4 (150000000) CALLBACK_PENDING with OPEN case CBP4"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "EP Four", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cp4: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cp4}", account_number: "A-P004", daily_outgoing_limit_cents: 500000000 }, as: WireOpsAdmin, captures: { ap4: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cp4}", name: "EP Ben4", bank_name: "EPBank4", account_number: "B-P004", country_code: "US" }, as: WireOperator, captures: { bp4: $.data.id } }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ap4}", beneficiary_id: "${bp4}", amount_cents: 150000000, method: "Fedwire", purpose: "retry probe" }, as: WireOperator, as_user_id: "op-1", captures: { wp4: $.data.id } }
            - { call: "GET /wire-ops/wires/${wp4}/callbacks", as: WireOperator, captures: { cbp4: "$.data[0].id" } }
          trigger:
            - { call: "POST /wire-ops/callbacks/${cbp4}/record", payload: { outcome: "UNREACHABLE", contact_name: "Treasurer", contact_phone: "+1-555-0104" }, as: WireOperator, as_user_id: "op-1", captures: { p4_s1: $.data.status } }
            - { call: "POST /wire-ops/callbacks/${cbp4}/record", payload: { outcome: "CONFIRMED", contact_name: "Treasurer", contact_phone: "+1-555-0104" }, as: WireOperator, as_user_id: "op-1", captures: { p4_s2: $.data.status, p4_resolved: $.data.resolved_at } }
            - { call: "GET /wire-ops/wires/${wp4}", as: WireOperator, captures: { p4_cb: $.data.callback_status } }
          assert:
            - "UNREACHABLE keeps the case OPEN (${p4_s1}); CONFIRMED then resolves it (${p4_s2} == CONFIRMED, resolved_at non-null: ${p4_resolved})"
            - "WireTransfer.${wp4}.callback_status == VERIFIED (${p4_cb})"

  # ============================================================= 6. errors
  - section: errors
    instances:
      - name: error_tracer_limit_exceeded_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRACER_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: investigation_tracer_answer_loop_with_cap
          rationale: "The fourth-tracer rejection is asserted as the failure path of the named §1.8 instance (trigger captures $.data.error_id == ERR_TRACER_LIMIT_EXCEEDED)."

      - name: error_cutoff_passed_on_submit_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUTOFF_PASSED]", "validations[priority=8]"]
        excluded_because:
          difficulty_instance: submit_cutoff_temporal_beats_callback_safety
          rationale: "ERR_CUTOFF_PASSED on submit is the asserted outcome of the named §1.8 priority-conflict instance."

  # =============================================================== 7. rbac
  - section: rbac
    instances:
      - name: wire_creation_forbidden_for_approver
        claim_type: role_denied
        grounds: ["roles[WireApprover]", "endpoints[POST /wire-ops/wires]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "WireApprover is an approve-only role: initiating a wire is outside its grant and fails 403."
        test_recipe:
          setup:
            - "Customer CR1 (MEDIUM), Account AR1, Beneficiary BR1"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "RBAC One", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cr1: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cr1}", account_number: "A-R001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { ar1: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cr1}", name: "RBAC Ben", bank_name: "RBACBank", account_number: "B-R001", country_code: "US" }, as: WireOperator, captures: { br1: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${ar1}", beneficiary_id: "${br1}", amount_cents: 100000, method: "Fedwire", purpose: "rbac probe" }, as: WireApprover, as_user_id: "ap-9", captures: { r1_err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (${r1_err}), HTTP 403; no wire created"

