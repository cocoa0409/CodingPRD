      - name: governance_decision_reject_reverts_segment_to_draft
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /cdp/segments/{segmentId}/governance-decision]
          - state_machines.Segment.PENDING_GOVERNANCE_REVIEW_to_DRAFT
          - entities.Segment.fields.rejection_count
        distinguishing_aspect: "The REJECT arm of the action endpoint is a real transition with its own bookkeeping: the segment returns to DRAFT, rejection_count rises, sensitive_use_approved is forced back to false and approved_at stays null, so no activation can be created against it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Segment on postal_code EQ 10001 submitted for review by u_analyst, so it sits in PENDING_GOVERNANCE_REVIEW."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/segments"
              payload:
                name: "Rejected Segment"
                criteria:
                  - { attribute: "postal_code", operator: "EQ", value: "10001" }
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_id: "$.data.id" }
            - call: "POST /cdp/segments/${seg_id}/submit-for-review"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
          trigger:
            - call: "POST /cdp/segments/${seg_id}/governance-decision"
              payload: { decision: "REJECT", sensitive_use_approved: false }
              as: DataGovernanceOfficer
              as_user_id: "u_gov"
          assert:
            - "the response status is 200"
            - "Segment.${seg_id}.status == DRAFT and rejection_count == 1"
            - "Segment.${seg_id}.decided_by_user_id == u_gov and submitted_by_user_id == u_analyst"
            - "Segment.${seg_id}.approved_at == null, governance_expires_at == null and sensitive_use_approved == false"
            - "Segment.${seg_id}.version has increased by 1 relative to the value after submit"
            - "a re-submit by u_analyst returns 200 and moves the segment back to PENDING_GOVERNANCE_REVIEW — DRAFT is not terminal"

      - name: propagate_mints_one_vendor_task_per_qualifying_destination
