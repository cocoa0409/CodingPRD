  - { method: GET, path: "/mill/fabric-specs", description: "List fabric specs", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["limit?", "offset?"], output: "FabricSpec[]", side_effects: [] }
  - { method: GET, path: "/mill/fabric-specs/{id}", description: "Get a fabric spec", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: FabricSpec, side_effects: [] }

  # --- DealerAccount ---
  - { method: POST, path: "/mill/dealer-accounts", description: "Create a dealer account", roles: [SalesRep], code: 201, input: [dealer_code, name, credit_limit_cents, sample_allowance_cents], output: DealerAccount, side_effects: ["status = ACTIVE", "outstanding_sample_value_cents = 0"] }
  - { method: GET, path: "/mill/dealer-accounts", description: "List dealer accounts", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["limit?", "offset?"], output: "DealerAccount[]", side_effects: [] }
  - { method: GET, path: "/mill/dealer-accounts/{id}", description: "Get a dealer account", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: DealerAccount, side_effects: [] }
  - { method: POST, path: "/mill/dealer-accounts/{id}/set-status", description: "Suspend or reinstate a dealer", roles: [SalesRep], code: 200, input: [status], output: DealerAccount, side_effects: ["status set to ACTIVE or SUSPENDED"] }

  # --- CustomerOrder ---
  - { method: POST, path: "/mill/customer-orders", description: "Create an order (DRAFT)", roles: [SalesRep], code: 201, input: [order_number, dealer_id, ship_to_state, delivery_method], output: CustomerOrder, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/mill/customer-orders", description: "List orders, optionally by dealer", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["dealer_id?", "limit?", "offset?"], output: "CustomerOrder[]", side_effects: [] }
  - { method: GET, path: "/mill/customer-orders/{id}", description: "Get an order", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: CustomerOrder, side_effects: [] }
  - { method: POST, path: "/mill/customer-orders/{id}/confirm", description: "Confirm: pricing, provisional yardage, FEFO reservation; lands CONFIRMED or MATERIAL_HOLD", roles: [SalesRep], code: 200, input: [], output: CustomerOrder, side_effects: ["computes pricing (order_pricing)", "computes required_yards_provisional per line", "creates RESERVE allocations for PLANT_STOCK lines via lot_selector_fefo", "line statuses set; confirmed_at set"] }
  - { method: POST, path: "/mill/customer-orders/{id}/cancel", description: "Cancel an order and cascade releases", roles: [SalesRep], code: 200, input: [], output: CustomerOrder, side_effects: ["lines → CANCELLED; allocations → RELEASED; requisitions → CANCELLED; cut plans → VOID; BOOKED bookings → RELEASED; DRAFT certificates → VOID"] }
  - { method: POST, path: "/mill/customer-orders/{id}/pass-quality", description: "Pass final quality (requires CERTIFIED compliance certificate)", roles: [QualityInspector], code: 200, input: [], output: CustomerOrder, side_effects: ["quality_result = PASSED; lines UPHOLSTERED → COMPLETED; status → READY_TO_SHIP"] }
  - { method: POST, path: "/mill/customer-orders/{id}/fail-quality", description: "Fail quality; listed lines loop back to SEWN", roles: [QualityInspector], code: 200, input: [rework_line_ids], output: CustomerOrder, side_effects: ["quality_result = FAILED; listed lines → SEWN; status → IN_PRODUCTION"] }

  # --- OrderLine ---
  - { method: POST, path: "/mill/order-lines", description: "Add a line to a DRAFT order; validates the option matrix", roles: [SalesRep], code: 201, input: [order_id, model_id, fabric_spec_id, fabric_source, finish_code, quantity], output: OrderLine, side_effects: ["matched_surcharge_pct, unit_price_cents, line_total_cents computed", "order.common_flammability_standard set on first line / checked on later lines"] }
  - { method: GET, path: "/mill/order-lines", description: "List order lines with filters", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["order_id?", "model_id?", "fabric_spec_id?", "limit?", "offset?"], output: "OrderLine[]", side_effects: [] }
  - { method: GET, path: "/mill/order-lines/{id}", description: "Get an order line", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: OrderLine, side_effects: [] }

  # --- MaterialLot ---
  - { method: POST, path: "/mill/material-lots", description: "Register an expected lot (plant replenishment or inbound COM)", roles: [MaterialReceiver], code: 201, input: [fabric_spec_id, "order_line_id?", expected_yards], output: MaterialLot, side_effects: ["ownership copied from spec.origin", "status = EXPECTED"] }
  - { method: GET, path: "/mill/material-lots", description: "List lots with filters", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["fabric_spec_id?", "order_line_id?", "parent_lot_id?", "status?", "limit?", "offset?"], output: "MaterialLot[]", side_effects: [] }
  - { method: GET, path: "/mill/material-lots/{id}", description: "Get a lot", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: MaterialLot, side_effects: [] }
  - { method: POST, path: "/mill/material-lots/{id}/receive", description: "Record physical receipt of an EXPECTED lot", roles: [MaterialReceiver], code: 200, input: [received_yards], output: MaterialLot, side_effects: ["status → RECEIVED; received_at set"] }
  - { method: POST, path: "/mill/material-lots/{id}/inspect", description: "Inspect a RECEIVED lot; PASS → AVAILABLE (COM lots auto-allocate), FAIL → REJECTED", roles: [QualityInspector], code: 200, input: [result, usable_yards, rejected_yards, "measured_width_inches?"], output: MaterialLot, side_effects: ["on PASS: measured_width set; COM auto-allocation to bound line; line shortfall re-evaluated (calculation shortfall_evaluation)", "on FAIL: usable 0, rejected = received", "inspected_by = X-User-ID"] }
  - { method: POST, path: "/mill/material-lots/{id}/reject-lot", description: "Quality recall of an AVAILABLE lot; cascades allocation release → shortfall → order hold → booking release", roles: [QualityInspector], code: 200, input: [], output: MaterialLot, side_effects: ["status → REJECTED; ACTIVE allocations → RELEASED; lines re-evaluated; orders may → MATERIAL_HOLD; BOOKED bookings → RELEASED"] }
  - { method: POST, path: "/mill/material-lots/{id}/return-to-customer", description: "Ship a REJECTED COM lot back to the customer", roles: [MaterialReceiver], code: 200, input: [], output: MaterialLot, side_effects: ["status → RETURNED"] }
  - { method: POST, path: "/mill/material-lots/{id}/split", description: "Split yards off an AVAILABLE lot into a child lot (parent_lot_id set on child)", roles: [MaterialReceiver], code: 201, input: [yards_to_move], output: MaterialLot, side_effects: ["child lot created AVAILABLE with usable_yards = yards_to_move; parent usable_yards decremented; conservation: parent.usable_after + child.usable == parent.usable_before"] }

  # --- MaterialAllocation ---
  - { method: POST, path: "/mill/material-allocations", description: "Manually reserve yards from an AVAILABLE lot to a line in MATERIAL_SHORTFALL or ALLOCATED", roles: [ProductionPlanner], code: 201, input: [lot_id, order_line_id, yards], output: MaterialAllocation, side_effects: ["requires line status ∈ {MATERIAL_SHORTFALL, ALLOCATED} (ERR_LINE_STAGE_MISMATCH)", "COM lots may only allocate to their bound line; PLANT lots to PLANT_STOCK lines of the same spec (ERR_LOT_BINDING_INVALID)", "lot.allocated_yards/available_yards recomputed; line.allocated_yards/shortfall recomputed (calculation shortfall_evaluation); line may → ALLOCATED; order may MATERIAL_HOLD → CONFIRMED; com_credit recomputed (calculation order_pricing)"] }
  - { method: GET, path: "/mill/material-allocations", description: "List allocations with filters", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["lot_id?", "order_line_id?", "status?", "limit?", "offset?"], output: "MaterialAllocation[]", side_effects: [] }
  - { method: GET, path: "/mill/material-allocations/{id}", description: "Get an allocation", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: MaterialAllocation, side_effects: [] }
  - { method: POST, path: "/mill/material-allocations/{id}/release", description: "Release an ACTIVE allocation", roles: [ProductionPlanner], code: 200, input: [], output: MaterialAllocation, side_effects: ["status → RELEASED; lot/line derived fields recomputed; line may → MATERIAL_SHORTFALL; order may → MATERIAL_HOLD"] }

