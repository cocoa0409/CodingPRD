      - name: mdf_period_capacity_over_inclusive_intersecting_periods
        grounds:
          - validations[priority=51]
          - calculations.mdf_allocation_sizing
          - errors[ERR_MDF_PERIOD_CAPACITY_EXCEEDED]
          - entities.MdfAllocation.fields.period_start
          - entities.MdfAllocation.fields.period_end
        distinguishing_aspect: |
          A different resource (the partner's ANNUAL_MDF_CAP_CENTS budget, not an account slot)
          under the opposite interval geometry: intersection is CLOSED on both endpoints, so a
          period whose period_start equals an existing period's period_end already intersects and
          is refused at 587,000 + 587,000 > 900,000, while a period starting one instant-block
          later (2026-07-01) is disjoint and is accepted even though the two accepted allocations
