              captures: { r_1_status1: $.data.status }
            - call: "POST /outschool/class-reports/${r_1}/disposition"
              payload: { action: "DISMISS" }
              as: PlatformAdmin
              captures: { r_1_status2: $.data.status, r_1_disp1: $.data.disposition }
          trigger:
            - call: "POST /outschool/class-reports/${r_1}/disposition"
              payload: { action: "START_REVIEW" }
              as: PlatformAdmin
              captures: { r_1_reopened: $.data.status }
            - call: "POST /outschool/class-reports/${r_1}/disposition"
              payload: { action: "UPHOLD_MORE_SEVERE" }
              as: PlatformAdmin
              captures: { r_1_final: $.data.status }
          assert:
            - "ParentReport.${r_1}.status == CLOSED"
            - "ParentReport.${r_1}.disposition == MORE_SEVERE"
            - "The report passed through RESOLVED and back into UNDER_REVIEW before reaching CLOSED, so the machine traversed a cycle rather than a linear pipeline"
            - "Teacher.${t_ada}.upheld_report_risk_score == 5"
            - "Teacher.${t_ada}.actionable_risk_score == 5"

