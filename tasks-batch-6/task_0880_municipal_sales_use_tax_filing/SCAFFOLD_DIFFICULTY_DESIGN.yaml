        distinguishing_aspect: |
          Date metric on POST /tax/returns/{id}/file: filing exactly on filing_due_date
          (2026-04-20) is timely (<=), so vendor_discount_cents == 1020 and net_return_due_cents == 66980.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; a DRAFT return with tax_due 68000 and filing_due_date 2026-04-20; clock set to exactly 2026-04-20 before filing."
          setup_api_calls:
