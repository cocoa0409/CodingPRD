# =============================================================================
# Scaffold Difficulty Design (§1.8 Test Targeting Index)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty Rules.
# =============================================================================

scaffold_difficulty_design:

  # ============================================================
  # Rule 1: dual_variant_calc — different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_credit_quota_student_domain
        grounds:
          - calculations.dynamic_credit_quota
          - calculations.dynamic_credit_quota.variants[variant_provisional]
          - calculations.dynamic_credit_quota.variants[variant_final]
          - validations[priority=12]
          - entities.Student.fields.year_in_program
          - entities.EnrollmentRequest.fields.academic_status
        distinguishing_aspect: |
          variant_provisional treats academic_status IN {APPROVED, WAITLISTED} as consuming credit budget,
          while variant_final treats only academic_status IN {APPROVED, SETTLED}; for an identical Student snapshot
          containing one WAITLISTED 5.0-credit row, the two variants therefore yield current_load values that
          differ by exactly 5.0 credits, which is the dual-variant divergence on the Student credit-budget domain.
        test_recipe:
          setup:
            - "Term T1 created with registration_open_at = now and registration_close_at = now + 86400; status auto-transitions to REGISTRATION_OPEN."
            - "Course CA (credits=4.0), Course CB (credits=5.0), Course CC (credits=5.0), Course CD (credits=5.0), Course CE (credits=2.0); all owned by Department D1 with no prereqs and no equivalents."
            - "CourseOfferings O_A, O_B, O_C, O_D, O_E created in T1; O_A/O_B/O_C/O_E have base_capacity=10 (plenty), O_D has base_capacity=1; all transitioned to OPEN."
            - "Student S1 in year_in_program=2 (base_quota=20.0), program_department_id=D1, completed_course_ids=[]."
            - "Pre-fill O_D's seat: a different student S0 already APPROVED in O_D so O_D is full."
            - "S1 successfully submits and gets APPROVED for O_A, O_B, O_C (current APPROVED credits = 4+5+5 = 14.0)."
            - "S1 submits for O_D — no seat available, so academic_status = WAITLISTED (current WAITLISTED credits = 5.0); under variant_provisional, S1's current_load = 14.0 + 5.0 = 19.0."
          trigger:
            - "POST /enrollment-requests with body {student_id: S1.id, offering_id: O_E.id} as Student S1."
          assert:
            - "Response HTTP status == 402."
            - "Response body data.error_id == 'ERR_CREDIT_QUOTA_EXCEEDED'."
            - "Verifies variant_provisional: 19.0 (current_load including WAITLISTED) + 2.0 (CE.credits) = 21.0 > 20.0 (effective_quota), so the gate fires; under variant_final the WAITLISTED 5.0 would be excluded, yielding current_load = 14.0 and 14.0 + 2.0 = 16.0 ≤ 20.0 — no rejection. The two variants disagree by construction."

      - name: dual_variant_transferable_credits_policy_domain
        grounds:
          - calculations.transferable_credits
          - calculations.transferable_credits.variants[variant_estimated]
          - calculations.transferable_credits.variants[variant_approved]
          - entities.CreditEquivalencePolicy.fields.transfer_factor
          - entities.Student.fields.completed_course_ids
        distinguishing_aspect: |
          variant_estimated reads CreditEquivalencePolicy rows as of CURRENT clock; variant_approved reads them as of
          Term.exam_window_end_at. Adding a new CreditEquivalencePolicy row between these two times changes
          variant_estimated immediately while leaving variant_approved unchanged once the term has concluded —
          this is the dual-variant divergence on the policy-driven cross-program credit-recognition domain,
          structurally distinct from Student-credit-budget domain in dual_variant_credit_quota_student_domain.
        test_recipe:
          setup:
            - "Two programs exist: program_id='SRC_PRG' rooted in Department D_SRC, program_id='TGT_PRG' rooted in Department D_TGT."
            - "Course C_SRC: code='SRC-101', credits=1.0, owning_department_id=D_SRC."
            - "Course C_TGT: code='TGT-201', credits=1.0, owning_department_id=D_TGT."
            - "Student S2 created with program_id='TGT_PRG', program_department_id=D_TGT, completed_course_ids=[C_SRC.id]."
            - "First, no CreditEquivalencePolicy rows exist."
            - "GET /students/{S2.id}/degree-plan returns transferable_credits = 0.00 under variant_estimated."
            - "Registrar creates CreditEquivalencePolicy P1: source_program_id='SRC_PRG', target_program_id='TGT_PRG', source_course_id=C_SRC.id, target_course_id=C_TGT.id, transfer_factor=0.625."
            - "Then a second matching policy P2 with identical source_program/target_program/source_course but a different target_course (Course C_TGT2 created similarly) and transfer_factor=0.625 is created."
          trigger:
            - "GET /students/{S2.id}/degree-plan."
          assert:
            - "Response HTTP status == 200."
            - "Response body data.transferable_credits == 1.26."
            - "Verifies the per-course-rounded-then-summed pinned order: each per_course_value = round(1.0 * 0.625, 2, round_half_up) = 0.63; sum across two policy matches = 0.63 + 0.63 = 1.26. Sum-then-round would yield 1.25 — the pin matters."

  # ============================================================
  # Rule 2: combinatorial_formula — different modes from {a, b, c}
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_priority_score_mode_a
        grounds:
          - calculations.priority_score
          - entities.Student.fields.year_in_program
          - entities.Student.fields.fraud_score
          - entities.Course.fields.prerequisite_course_ids
          - entities.WaitlistEntry.fields.priority_score
        distinguishing_aspect: |
          priority_score sums four inputs (year_factor, gap_count, prereq_strength, fraud_penalty) with non-linear
          interaction: fraud_penalty = max(0, fraud_score - FRAUD_GRACE) introduces a piecewise-zero floor at
          fraud_score=10, and year_factor = min(year_in_program, 5) clamps at 5. This is mode (a) — ≥3 inputs and
          non-linear interaction (max/min branches on entity state).
        test_recipe:
          setup:
            - "Student S3 with year_in_program=4 (so year_factor=4), fraud_score=15 (so fraud_penalty = max(0, 15-10) = 5)."
            - "Course CX (credits=3.0) declared as a REQUIRED prereq of two other Courses CY, CZ (downstream count = 2 → prereq_strength = 2)."
            - "S3's degree_plan_gap_analysis: CX is in gap_courses (S3 has not completed CX) — gap_count = 1."
            - "CourseOffering O_CX in T1, base_capacity=1, opened. Another student S0 already APPROVED, so O_CX is full."
            - "S3 submits POST /enrollment-requests for O_CX → academic_status = WAITLISTED with priority_score computed."
          trigger:
            - "GET /course-offerings/{O_CX.id}/waitlist."
          assert:
            - "Response HTTP status == 200."
            - "data[0].priority_score == (10 * 4) + (15 * 1) + (8 * 2) - (2 * 5) = 40 + 15 + 16 - 10 = 61."
            - "data[0].position == 1."

      - name: combinatorial_transferable_credits_rounding_mode_b
        grounds:
          - calculations.transferable_credits
          - calculations.transferable_credits.formula
          - entities.CreditEquivalencePolicy.fields.transfer_factor
        distinguishing_aspect: |
          transferable_credits pins per-course rounding BEFORE summing. With two matching policies each yielding
          raw_value=0.625, per-course-then-sum = round(0.625,2)+round(0.625,2) = 0.63+0.63 = 1.26, while
          sum-then-round = round(0.625+0.625,2) = round(1.25,2) = 1.25 — a one-cent divergence that the scaffold's
          PINNED rounding order resolves to 1.26. This is mode (b) — nested rounding where the order matters.
        test_recipe:
          setup:
            - "Two programs SRC_PRG and TGT_PRG; Department D_SRC owns Course C_SRC (1.0 credits); Department D_TGT owns Courses C_TGT and C_TGT2 (1.0 credits each)."
            - "Student S4 with program_id='TGT_PRG', program_department_id=D_TGT, completed_course_ids=[C_SRC.id]."
            - "Two CreditEquivalencePolicy rows: (SRC_PRG, TGT_PRG, C_SRC, C_TGT, 0.625) and (SRC_PRG, TGT_PRG, C_SRC, C_TGT2, 0.625)."
          trigger:
            - "GET /students/{S4.id}/degree-plan."
          assert:
            - "Response HTTP status == 200."
            - "data.transferable_credits == 1.26."
            - "Sum-then-round would yield 1.25; per-course-then-sum (the pinned order) yields 1.26. The literal in the assertion is the pinned-order outcome."

  # ============================================================
  # Rule 3: non_linear_state_machine — different entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: non_linear_overlimit_application_revision_cycle
        grounds:
          - state_machines.OverLimitApplication.REJECTED_to_DRAFT
          - state_machines.OverLimitApplication.AWAITING_PRIMARY_to_REJECTED
          - state_machines.OverLimitApplication.AWAITING_PRIMARY_to_AWAITING_SECONDARY
          - state_machines.OverLimitApplication.AWAITING_SECONDARY_to_APPROVED
          - entities.OverLimitApplication.fields.status
        distinguishing_aspect: |
          OverLimitApplication.status admits a true cycle: AWAITING_PRIMARY → REJECTED → DRAFT → AWAITING_PRIMARY,
          a revision loop where the application returns to a previously-occupied state. This is non-linear
          (cycle), in contrast to a linear A→B→C pipeline; the entity it lives on is OverLimitApplication.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN."
            - "Department D1 with chair_professor PC and non-chair professor P1."
            - "Student S5 in D1, year_in_program=2."
            - "OverLimitApplication A1: student_id=S5.id, term_id=T1.id, requested_extension_credits=4.0, justification='need extra', primary_signer_id=P1.id, secondary_signer_id=PC.id; created in DRAFT."
            - "POST /over-limit-applications/{A1.id}/submit as Student S5 → status = AWAITING_PRIMARY."
            - "POST /over-limit-applications/{A1.id}/reject as Professor P1 (with version) → status = REJECTED."
            - "POST /over-limit-applications/{A1.id}/revise as Student S5 → status = DRAFT."
            - "POST /over-limit-applications/{A1.id}/submit as Student S5 → status = AWAITING_PRIMARY (cycle complete)."
          trigger:
            - "GET /over-limit-applications/{A1.id}."
          assert:
            - "Response HTTP status == 200."
            - "data.status == 'AWAITING_PRIMARY'."
            - "data.version == 5 (1 create + 4 transitions: submit, reject, revise, submit)."
            - "data.granted_credits == 0."

      - name: non_linear_enrollment_request_parallel_dimensions
        grounds:
          - state_machines.EnrollmentRequest.SUBMITTED_to_APPROVED
          - entities.EnrollmentRequest.fields.academic_status
          - entities.EnrollmentRequest.fields.financial_status
        distinguishing_aspect: |
          EnrollmentRequest carries TWO orthogonal state dimensions on the same row — academic_status
          (SUBMITTED|APPROVED|WAITLISTED|REJECTED|CANCELED|SETTLED) and financial_status (UNBILLED|BILLED|PAID) —
          which evolve independently for most of the lifecycle. This is non-linear (parallel dimensions); the
          entity it lives on is EnrollmentRequest, structurally different from OverLimitApplication's cycle.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN; Course CG (credits=3.0); CourseOffering O_G with base_capacity=10, OPEN."
            - "Student S6, year_in_program=1."
            - "POST /enrollment-requests as S6 with body {student_id: S6.id, offering_id: O_G.id} → academic_status=APPROVED, financial_status=BILLED."
          trigger:
            - "POST /enrollment-requests/{ER.id}/settle-tuition as Finance role."
          assert:
            - "Response HTTP status == 200."
            - "data.academic_status == 'APPROVED' (academic dimension unchanged by financial transition)."
            - "data.financial_status == 'PAID' (financial dimension advanced independently)."
            - "Demonstrates that financial_status: BILLED → PAID does NOT advance academic_status, confirming the two dimensions are parallel."

  # ============================================================
  # Rule 4: transitive_cascade — different triggers, depths ≥3 and ≥2
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_student_cancel_promotes_waitlist_depth_3
        grounds:
          - state_machines.EnrollmentRequest.APPROVED_to_CANCELED
          - state_machines.WaitlistEntry.ACTIVE_to_PROMOTED
          - state_machines.EnrollmentRequest.WAITLISTED_to_APPROVED
          - entities.EnrollmentRequest.fields.academic_status
          - entities.EnrollmentRequest.fields.financial_status
          - entities.WaitlistEntry.fields.status
        distinguishing_aspect: |
          A single student cancel triggers a 3-link transitive chain: (1) the cancel mutates the canceler's
          EnrollmentRequest.academic_status APPROVED→CANCELED; (2) THAT mutation (the freed seat) causes the top
          WaitlistEntry on the same offering to mutate ACTIVE→PROMOTED; (3) THAT mutation in turn causes the
          promoted student's EnrollmentRequest.academic_status to mutate WAITLISTED→APPROVED (and financial_status
          → BILLED as a parallel-axis side effect of step 3). Each link is caused by the previous link, not by the
          original API call. Trigger: POST /enrollment-requests/{id}/cancel.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN; Course CH (credits=3.0); CourseOffering O_H, base_capacity=1, OPEN."
            - "Student S7 (year=2): POST /enrollment-requests for O_H → APPROVED, BILLED."
            - "Student S8 (year=2): POST /enrollment-requests for O_H → WAITLISTED, priority_score computed; WaitlistEntry W1 created with position=1, status=ACTIVE."
          trigger:
            - "POST /enrollment-requests/{S7's request id}/cancel as Student S7."
          assert:
            - "Response HTTP status == 200."
            - "S7's EnrollmentRequest.academic_status == 'CANCELED' (link 1)."
            - "GET /course-offerings/{O_H.id}/waitlist data[0].status == 'PROMOTED' OR W1 row no longer in ACTIVE list (link 2)."
            - "S8's EnrollmentRequest.academic_status == 'APPROVED' (link 3)."
            - "S8's EnrollmentRequest.financial_status == 'BILLED' (parallel-axis side effect of link 3)."
            - "GET /students/{S8.id}/sync-events contains an event with event_type == 'WAITLIST_PROMOTED' (link 2 emitted observable)."

      - name: cascade_capacity_reduction_cancels_lowest_priority_depth_3
        grounds:
          - state_machines.CourseOffering
          - entities.CourseOffering.fields.capacity
          - state_machines.EnrollmentRequest.APPROVED_to_CANCELED
          - entities.EnrollmentRequest.fields.financial_status
          - entities.SyncEvent.fields.event_type
        distinguishing_aspect: |
          A capacity-reduction PATCH triggers a 3-link chain ORIGINATING FROM A DIFFERENT TRIGGER than the cancel
          cascade: (1) PATCH /course-offerings/{id}/capacity mutates CourseOffering.capacity; (2) THAT mutation
          (capacity now < enrolled_count) causes the lowest-priority APPROVED EnrollmentRequest to mutate
          academic_status APPROVED→REJECTED (with reason CAPACITY_REDUCED); (3) THAT mutation causes the same
          row's financial_status to mutate BILLED→UNBILLED (parallel-axis cascade) AND a SyncEvent of type
          CAPACITY_REDUCED_CANCELED to be appended. Trigger: PATCH /course-offerings/{id}/capacity, distinct from
          the cancel-cascade trigger above.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN; Course CI (credits=3.0); CourseOffering O_I, base_capacity=2, OPEN."
            - "Student S9 (year=4, fraud_score=0, gap=1): POST /enrollment-requests for O_I → APPROVED, BILLED. (Higher priority_score)"
            - "Student S10 (year=1, fraud_score=0, gap=0): POST /enrollment-requests for O_I → APPROVED, BILLED. (Lower priority_score)"
            - "GET O_I shows enrolled_count=2, capacity=2, version=v_current."
          trigger:
            - "PATCH /course-offerings/{O_I.id}/capacity as Registrar, body {new_capacity: 1, version: v_current}."
          assert:
            - "Response HTTP status == 200."
            - "data.capacity == 1 (link 1)."
            - "S10's EnrollmentRequest.academic_status == 'REJECTED' (link 2 — lowest-priority canceled)."
            - "S10's EnrollmentRequest.financial_status == 'UNBILLED' (link 3 — parallel-axis cascade)."
            - "GET /students/{S10.id}/sync-events contains event with event_type == 'CAPACITY_REDUCED_CANCELED' (link 3 observable)."
            - "S9's EnrollmentRequest.academic_status remains 'APPROVED' (only the lowest priority was cut)."

  # ============================================================
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: conflict_state_vs_business_safety
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors.ERR_OFFERING_NOT_OPEN
          - errors.ERR_CROSS_DEPARTMENT_ACCESS_DENIED
        distinguishing_aspect: |
          Two simultaneous failures: the CourseOffering is in CLOSED status (priority 4 — state) AND no ACTIVE
          DepartmentAccessGrant exists for the cross-department enrollment (priority 6 — business_safety). Per
          ascending priority, the state error wins. Pair: state(4) vs business_safety(6).
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN."
            - "Departments D1 (Student S11's home dept) and D2."
            - "Course CJ owned by D2; CourseOffering O_J in T1, base_capacity=10, transitioned to OPEN then to CLOSED."
            - "No DepartmentAccessGrant from D1→D2."
            - "Student S11 in D1 with completed_course_ids satisfying any prereqs of CJ (none in this setup)."
          trigger:
            - "POST /enrollment-requests as Student S11, body {student_id: S11.id, offering_id: O_J.id}."
          assert:
            - "Response HTTP status == 409 (state error wins over the 403 business_safety error)."
            - "Response body data.error_id == 'ERR_OFFERING_NOT_OPEN'."

      - name: conflict_business_constraint_vs_business_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors.ERR_PREREQUISITE_NOT_MET
          - errors.ERR_CREDIT_QUOTA_EXCEEDED
        distinguishing_aspect: |
          Two simultaneous failures: the student lacks a REQUIRED prereq for the course (priority 7 —
          business_constraint) AND would exceed their credit quota (priority 12 — business_fiscal). Per ascending
          priority, the business_constraint error wins. Pair: business_constraint(7) vs business_fiscal(12),
          structurally different from the state(4)-vs-business_safety(6) pair above.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN."
            - "Student S12, year_in_program=1 (base_quota=18.0), program_department_id=D1, completed_course_ids=[]."
            - "Course CK (credits=4.0) with REQUIRED prereq pointing to Course C_PRE (which S12 has NOT completed)."
            - "Pre-fill S12's quota: 5 APPROVED enrollments at 4.0 credits each = 20.0 credits → over quota already (the gate at submission would refuse, so instead build via 4 APPROVED at 4.0 credits = 16.0 credits, then S12 attempts the 4.0-credit CK: 16.0+4.0 = 20.0 > 18.0)."
            - "All these prior offerings have NO prereq requirements so they pass priority 7."
            - "Course CK's offering O_K has base_capacity=10, OPEN, owned by D1 (no cross-department gate)."
          trigger:
            - "POST /enrollment-requests as Student S12, body {student_id: S12.id, offering_id: O_K.id}."
          assert:
            - "Response HTTP status == 422 (business_constraint at priority 7 wins over priority 12 fiscal)."
            - "Response body data.error_id == 'ERR_PREREQUISITE_NOT_MET'."

  # ============================================================
  # Rule 6: boundary_precision_check — different metrics, different endpoints
  # ============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_time_overlap_half_open_endpoint_enrollment
        grounds:
          - validations[priority=8]
          - calculations.conflict_detection
          - entities.CourseOffering.fields.scheduled_meetings
          - errors.ERR_TIME_CONFLICT
        distinguishing_aspect: |
          Two CourseOfferings on the same day where one ends at minute 600 and the other starts at minute 600 —
          half-open semantics [start, end) mean these DO NOT conflict (boundary point belongs to neither
          interval). The boundary metric is "minutes-of-day equality at the seam"; the endpoint is
          POST /enrollment-requests. Distinct from the credit-equality boundary below.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN; Department D1; Student S13 in D1, year_in_program=1."
            - "Course CL with scheduled_meetings = [{day_of_week:1, start_minute_of_day:480, end_minute_of_day:600}]; CourseOffering O_L in T1, OPEN."
            - "Course CM with scheduled_meetings = [{day_of_week:1, start_minute_of_day:600, end_minute_of_day:720}]; CourseOffering O_M in T1, OPEN."
            - "S13 successfully enrolls in O_L (day=1, 480–600)."
          trigger:
            - "POST /enrollment-requests as Student S13, body {student_id: S13.id, offering_id: O_M.id}."
          assert:
            - "Response HTTP status == 201 (boundary touch at minute 600 — adjacent half-open intervals do NOT overlap)."
            - "Response body data.academic_status == 'APPROVED'."
            - "If the implementation used CLOSED intervals, both would include minute 600 and the request would erroneously fail with 409 ERR_TIME_CONFLICT."

      - name: boundary_instructor_teaching_load_aggregate_endpoint_open
        grounds:
          - validations[priority=14]
          - calculations.conflict_detection
          - entities.Professor.fields.max_concurrent_teaching_minutes_per_week
          - errors.ERR_INSTRUCTOR_TEACHING_LOAD_EXCEEDED
        distinguishing_aspect: |
          Per validations[priority=14] using check '… must not exceed …', equality at the boundary passes (the
          rule is strict-greater >). With max_concurrent_teaching_minutes_per_week = 240 and existing weekly
          minutes = 120, opening a new 120-minute offering yields a sum of exactly 240 — equality must PASS.
          The metric (aggregate weekly minutes) and endpoint (POST /course-offerings/{id}/open) both differ from
          the time-overlap-half-open boundary above.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN; Department D1; Professor P_INST with max_concurrent_teaching_minutes_per_week = 240, rank=ASSISTANT, is_chair=false."
            - "Course CN; CourseOffering O_N1 with instructor=P_INST, scheduled_meetings = [{day:1, start:480, end:600}] (120 minutes/week), transitioned to OPEN successfully."
            - "Course CO; CourseOffering O_N2 with instructor=P_INST, scheduled_meetings = [{day:2, start:480, end:600}] (120 additional minutes/week), in PLANNED."
          trigger:
            - "POST /course-offerings/{O_N2.id}/open as Registrar."
          assert:
            - "Response HTTP status == 200 (120 + 120 == 240, equality is allowed: rule is strict-greater)."
            - "Response body data.status == 'OPEN'."
            - "If the implementation used >= comparison, this would erroneously fail with 409 ERR_INSTRUCTOR_TEACHING_LOAD_EXCEEDED."

  # ============================================================
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_enrollment_request_depends_on_course_offering
        grounds:
          - state_machines.EnrollmentRequest.SUBMITTED_to_APPROVED
          - state_machines.CourseOffering
          - entities.CourseOffering.fields.status
          - errors.ERR_OFFERING_NOT_OPEN
        distinguishing_aspect: |
          EnrollmentRequest's SUBMITTED→APPROVED transition is gated on CourseOffering.status == OPEN; if the
          offering is in PLANNED or CLOSED, the request's transition is impossible and ERR_OFFERING_NOT_OPEN is
          returned. Entity pair: EnrollmentRequest → CourseOffering.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN; Department D1; Student S14 in D1; Course CP; CourseOffering O_P in PLANNED status (never opened)."
          trigger:
            - "POST /enrollment-requests as Student S14, body {student_id: S14.id, offering_id: O_P.id}."
          assert:
            - "Response HTTP status == 409."
            - "Response body data.error_id == 'ERR_OFFERING_NOT_OPEN'."

      - name: cross_entity_overlimit_application_depends_on_term
        grounds:
          - state_machines.OverLimitApplication.DRAFT_to_AWAITING_PRIMARY
          - state_machines.Term
          - entities.Term.fields.status
          - errors.ERR_TERM_NOT_OPEN_FOR_REGISTRATION
        distinguishing_aspect: |
          OverLimitApplication's DRAFT→AWAITING_PRIMARY transition (POST /submit) is gated on Term.status ==
          REGISTRATION_OPEN. If the term is in PLANNING or REGISTRATION_CLOSED, the submit fails with
          ERR_TERM_NOT_OPEN_FOR_REGISTRATION. Entity pair: OverLimitApplication → Term, structurally distinct
          from the EnrollmentRequest→CourseOffering pair above.
        test_recipe:
          setup:
            - "Term T_FUTURE created in PLANNING (registration_open_at far in the future); status remains PLANNING."
            - "Department D1 with chair PC and non-chair professor P1; Student S15 in D1."
            - "OverLimitApplication A_F created in DRAFT for (S15, T_FUTURE)."
          trigger:
            - "POST /over-limit-applications/{A_F.id}/submit as Student S15."
          assert:
            - "Response HTTP status == 409."
            - "Response body data.error_id == 'ERR_TERM_NOT_OPEN_FOR_REGISTRATION'."

  # ============================================================
  # Rule 8: resource_temporal_overlap — different interval semantics, different resources
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_student_schedule_half_open_intervals
        grounds:
          - calculations.conflict_detection
          - validations[priority=8]
          - entities.CourseOffering.fields.scheduled_meetings
          - errors.ERR_TIME_CONFLICT
        distinguishing_aspect: |
          Same student tries to enroll in two offerings whose half-open meeting intervals truly overlap (not just
          touch at the seam). Resource: the student's weekly schedule. Interval semantics: half-open [start, end)
          with pairwise overlap test m1.start < m2.end AND m2.start < m1.end.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN; Department D1; Student S16 in D1, year_in_program=1."
            - "Course CQ with scheduled_meetings = [{day:1, start:480, end:600}]; CourseOffering O_Q in T1, OPEN."
            - "Course CR with scheduled_meetings = [{day:1, start:540, end:660}] (overlap with O_Q from 540–600); CourseOffering O_R in T1, OPEN."
            - "S16 successfully enrolls in O_Q."
          trigger:
            - "POST /enrollment-requests as Student S16, body {student_id: S16.id, offering_id: O_R.id}."
          assert:
            - "Response HTTP status == 409."
            - "Response body data.error_id == 'ERR_TIME_CONFLICT'."

      - name: overlap_lab_equipment_half_open_with_setup_buffer
        grounds:
          - calculations.conflict_detection
          - validations[priority=11]
          - entities.LabEquipment.fields.setup_buffer_minutes
          - entities.CourseOffering.fields.requires_lab_equipment_ids
          - errors.ERR_LAB_EQUIPMENT_CONFLICT
        distinguishing_aspect: |
          Two offerings (potentially across different students) require the same LabEquipment whose
          setup_buffer_minutes=30. Even a half-hour gap between a 480–600 meeting and a 630–750 meeting (gap=30)
          fails because the rule uses (start1 < end2 + buffer AND start2 < end1 + buffer); a strictly larger gap
          (e.g., 631) is required. Resource: LabEquipment (cross-student, cross-offering); interval semantics:
          half-open + per-equipment additive buffer — different from the student-schedule no-buffer case above.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN; Department D1; Campus C1; LabEquipment L1 with setup_buffer_minutes=30, campus_id=C1."
            - "Two students S17 and S18 (no shared time-conflict)."
            - "Course CS with scheduled_meetings = [{day:1, start:480, end:600}], requires_lab_equipment_ids=[L1.id]; CourseOffering O_S, OPEN; S17 successfully enrolls."
            - "Course CT with scheduled_meetings = [{day:1, start:629, end:749}], requires_lab_equipment_ids=[L1.id] (gap = 629-600 = 29 minutes — strictly less than buffer=30, so the rule fires); CourseOffering O_T, OPEN."
          trigger:
            - "POST /enrollment-requests as Student S18, body {student_id: S18.id, offering_id: O_T.id}."
          assert:
            - "Response HTTP status == 409."
            - "Response body data.error_id == 'ERR_LAB_EQUIPMENT_CONFLICT'."
            - "Verifies the buffer-inclusive overlap rule: (start_new=629) < (end_existing=600 + buffer=30) → 629 < 630 = TRUE; rule fires. If buffer were 0 the strict-less test would yield 629 < 600 = FALSE and no conflict — the per-equipment buffer is what produces the divergence from the no-buffer student-schedule case in the sibling instance."

  # ============================================================
  # Rule 9: compensating_invariant — different conserved quantities
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_student_credit_budget_create_then_cancel
        grounds:
          - state_machines.EnrollmentRequest.SUBMITTED_to_APPROVED
          - state_machines.EnrollmentRequest.APPROVED_to_CANCELED
          - calculations.dynamic_credit_quota
          - entities.EnrollmentRequest.fields.provisional_credit_charge
        distinguishing_aspect: |
          Conserved quantity: the student's provisional credit budget remaining = effective_quota - sum(Course.credits
          for ER in {APPROVED, WAITLISTED}). The invariant: a successful POST /enrollment-requests followed by a
          POST /enrollment-requests/{id}/cancel on the SAME enrollment leaves the student's budget remaining
          identical to the pre-create value. Conserved quantity TYPE: aggregated credit hours (a fractional number),
          structurally distinct from the request count below.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN; Department D1; Student S19 (year=2, base_quota=20.0); Course CU (credits=3.0); CourseOffering O_U in T1, OPEN, base_capacity=10."
            - "GET /students/{S19.id}/degree-plan returns remaining_credits = R0 (initial baseline)."
          trigger:
            - "POST /enrollment-requests as S19, body {student_id: S19.id, offering_id: O_U.id} → APPROVED, BILLED."
            - "POST /enrollment-requests/{ER.id}/cancel as S19."
          assert:
            - "After step 1 (create): GET /enrollment-requests/{ER.id} returns provisional_credit_charge == 3.00 and academic_status == 'APPROVED'."
            - "After step 2 (cancel): GET /enrollment-requests/{ER.id} returns academic_status == 'CANCELED'."
            - "Sum of Course.credits over EnrollmentRequests of S19 in T1 with academic_status IN {APPROVED, WAITLISTED} == 0.00 (post-cancel) — equal to pre-create value of 0.00. Conserved quantity invariant: drift == 0.00 credit hours."

      - name: invariant_offering_seat_ledger_create_then_cancel
        grounds:
          - state_machines.EnrollmentRequest.SUBMITTED_to_APPROVED
          - state_machines.EnrollmentRequest.APPROVED_to_CANCELED
          - entities.CourseOffering.fields.enrolled_count
          - entities.CourseOffering.fields.capacity
        distinguishing_aspect: |
          Conserved quantity: the offering's available seat count = capacity - enrolled_count. The invariant: a
          successful POST /enrollment-requests against an offering followed by POST /enrollment-requests/{id}/cancel
          on the same row leaves available seats identical to the pre-create value. Conserved quantity TYPE: integer
          seat count (non-negative integer), structurally distinct from the credit-hours quantity above.
        test_recipe:
          setup:
            - "Term T1 in REGISTRATION_OPEN; Department D1; Student S20 (year=2); Course CV (credits=3.0); CourseOffering O_V in T1, OPEN, base_capacity=5, enrolled_count=0."
            - "GET /course-offerings/{O_V.id} → capacity=5, enrolled_count=0; available_seats baseline = 5."
          trigger:
            - "POST /enrollment-requests as S20, body {student_id: S20.id, offering_id: O_V.id}."
            - "POST /enrollment-requests/{ER.id}/cancel as S20."
          assert:
            - "After step 1: GET /course-offerings/{O_V.id} returns enrolled_count == 1, capacity == 5 (1 seat consumed)."
            - "After step 2: GET /course-offerings/{O_V.id} returns enrolled_count == 0, capacity == 5 (seat returned)."
            - "Conserved seat ledger invariant: capacity - enrolled_count == 5 (post-cancel) == 5 (pre-create); drift == 0 seats."
