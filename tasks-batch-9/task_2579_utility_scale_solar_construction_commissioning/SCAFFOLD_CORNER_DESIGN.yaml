              captures: { pile: $.data.id }
            - call: "POST /solar/piles/${pile}/drive-results"
              payload: { actual_embedment_mm: 3000, plumb_deviation_mm: 5.0, blow_count: 42, refusal: false }
              as: InstallationForeman
            - call: "GET /solar/blocks/${blk}"
              payload: {}
              as: InstallationForeman
              captures: { ms0: $.data.mechanical_status, bv0: $.data.version }
