      - name: an_unsupported_claim_answers_before_the_hangtag_text_comparison
        claim_type: error_triggerable
        grounds:
          - errors.ERR_HANGTAG_CLAIM_UNSUPPORTED
          - errors.ERR_HANGTAG_INCONSISTENT
          - validations[priority=59]
          - validations[priority=82]
          - calculations.hangtag_consistency
        distinguishing_aspect: "Both hangtag gates are evaluated against the parent, and priority 59 answers before 82: a MADE_IN_USA claim over a parent that says Made in VN is refused even when the two texts match perfectly, and it is still the answer when the texts diverge as well. A WRINKLE_FREE claim over a care run whose shrinkage is exactly 2.0 is accepted, because the claim ceiling is inclusive - and none of the three refusals bumps the parent's version."
        test_recipe:
          setup:
            - "Market US is registered. Brand B1 owns style NL-4410, declared 100.0 COTTON, with an ISSUED determination naming VN and a PASSED care run whose dimensional_change_pct is exactly 2.0. A DRAFT PERMANENT_LABEL L1 exists at version 1 with fiber_content_text \"100.0% COTTON\" and origin_text \"Made in VN\"."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
