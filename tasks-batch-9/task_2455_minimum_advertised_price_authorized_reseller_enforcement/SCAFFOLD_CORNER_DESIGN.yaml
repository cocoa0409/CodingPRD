      # --- priority 11: temporal windows ------------------------------------
      - name: observation_older_than_thirty_days_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]"]
        distinguishing_aspect: "observed_at must sit inside [now - 30 days, now]: a 2026-07-01 sighting recorded at clock 2026-08-20 is ERR_OBSERVATION_STALE and no CAPTURED row is written."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product SKU-AUDIO-1; clock 2026-08-20."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
          trigger:
            - call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "GreyBox Deals", listing_url: "https://mkt.example/l/old", listed_price_cents: 14000, observed_at: "2026-07-01T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == 'ERR_OBSERVATION_STALE'"
            - "GET /price-observations returns 0 rows"

      - name: observation_exactly_thirty_days_old_is_accepted
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=11]"]
        distinguishing_aspect: "The staleness window is closed at both ends: observed_at 2026-08-01 recorded at clock 2026-08-31 is exactly 30 days old and is accepted."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED effective 2026-08-01; product SKU-AUDIO-1; clock advanced to 2026-08-31."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0831
          trigger:
            - call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "GreyBox Deals", listing_url: "https://mkt.example/l/edge", listed_price_cents: 14000, observed_at: "2026-08-01T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obsedge: $.data.id }
          assert:
            - "HTTP 201"
            - "PriceObservation.${obsedge}.status == CAPTURED"
            - "PriceObservation.${obsedge}.observed_at == '2026-08-01T00:00:00Z'"

      - name: overlapping_exception_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]"]
        distinguishing_aspect: "An ALL-scope APPROVED exception over [2026-08-10, 2026-08-25) intersects a MARKETPLACE request starting 2026-08-19, so the second request is ERR_EXCEPTION_WINDOW_OVERLAP: 'ALL' intersects every channel."
        test_recipe:
          setup: ["An APPROVED ALL-scope exception over [2026-08-10, 2026-08-25) at 13000 on SKU-AUDIO-1; clock 2026-08-01."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *EXC13000
            - *EXCAPPROVE
          trigger:
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-08-19T00:00:00Z", ends_at: "2026-08-30T00:00:00Z", channel_scope: "MARKETPLACE", requested_override_floor_cents: 13500, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_EXCEPTION_WINDOW_OVERLAP'"
            - "Product.${prod}.open_exception_count == 1"
            - "GET /pricing-exceptions?product_id=${prod} returns 1 row"

      - name: exception_window_of_exactly_one_hundred_eighty_days_is_accepted
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=11]"]
        distinguishing_aspect: "The 180-day exception ceiling is inclusive: [2026-08-01, 2027-01-28) is exactly 180 days and is created without complaint."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product SKU-AUDIO-1; clock 2026-08-01; no other exception exists."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
          trigger:
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-08-01T00:00:00Z", ends_at: "2027-01-28T00:00:00Z", channel_scope: "ALL", requested_override_floor_cents: 13000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { exc180: $.data.id }
          assert:
            - "HTTP 201"
            - "PricingException.${exc180}.status == REQUESTED"
            - "PricingException.${exc180}.ends_at == '2027-01-28T00:00:00Z'"
            - "Product.${prod}.open_exception_count == 0"

      - name: retroactive_exception_starting_before_the_thirty_day_floor_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]"]
        distinguishing_aspect: "A retroactive starts_at is bounded separately from the 180-day duration rule: 2026-07-01 at clock 2026-08-20 is ERR_RETROACTIVE_WINDOW_TOO_OLD, not ERR_EXCEPTION_WINDOW_OVERLAP."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product SKU-AUDIO-1; clock 2026-08-20; no other exception exists."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
          trigger:
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-08-25T00:00:00Z", channel_scope: "ALL", requested_override_floor_cents: 13000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == 'ERR_RETROACTIVE_WINDOW_TOO_OLD'"
            - "GET /pricing-exceptions returns 0 rows"

      - name: suspension_inside_the_cooling_off_period_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]"]
        distinguishing_aspect: "suspension_cooling_off_days 14 measured from last_suspension_ended_at 2026-09-10 bars any new suspension before 2026-09-24, so a window starting 2026-09-23 is ERR_SUSPENSION_COOLING_OFF."
        test_recipe:
          setup: ["Acme served a suspension over [2026-09-01, 2026-09-10] and was reinstated by the 2026-09-11 sweep, setting last_suspension_ended_at to 2026-09-10; a fresh violation is DETECTED."]
          setup_api_calls:
