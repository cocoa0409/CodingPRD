# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: ON_SALE
        trigger: "POST /events/{id}/advance-status with target_status=ON_SALE"
        actor: VenueAdmin
        preconditions:
          - "Event has at least one AccessZone"
          - "Event has at least one Gate"
        side_effects:
          - "Ticket issuance and CredentialRequest submission become permitted"
      - from: ON_SALE
        to: DOORS_OPEN
        trigger: "POST /events/{id}/advance-status with target_status=DOORS_OPEN"
        actor: VenueAdmin
        preconditions: []
        side_effects:
          - "ScanSession creation becomes permitted"
      - from: DOORS_OPEN
        to: IN_PROGRESS
        trigger: "POST /events/{id}/advance-status with target_status=IN_PROGRESS"
        actor: VenueAdmin
        preconditions: []
        side_effects:
          - "TransferRequest creation is refused from this state onward (ERR_EVENT_STATE_FORBIDS_TRANSFER)"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /events/{id}/advance-status with target_status=CLOSED"
        actor: VenueAdmin
        preconditions:
          - "no ScanSession on any Gate of this event has status IN {OPEN, SYNCING}"
        side_effects:
          - "every Gate of this event has status set to IDLE"
          - "ReconciliationReport creation becomes permitted"
      - from: CLOSED
        to: RECONCILED
        trigger: "system, on the transition ReconciliationReport DRAFT_to_FINAL or REOPENED_to_FINAL for this event"
        actor: system
        preconditions:
          - "the finalizing ReconciliationReport belongs to this event"
        side_effects:
          - "Event.status set to RECONCILED; further ReconciliationReport creation is refused with ERR_EVENT_ALREADY_RECONCILED"

  - entity: Ticket
    dimension: lifecycle_status
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: LISTED
        trigger: "POST /resale-listings"
        actor: Patron
        preconditions:
          - "acting patron id == Ticket.holder_patron_id"
          - "Event.status IN {ON_SALE, DOORS_OPEN}"
          - "Patron.identity_verified == true"
          - "Patron.fraud_risk_score < 40"
          - "Ticket.ticket_type == PAID"
          - "Ticket.admission_status == NOT_ADMITTED"
          - "payload expected_ticket_version == Ticket.version"
        side_effects:
          - "ResaleListing created in LISTED with cap_price_cents from calculations.resale_price_cap"
          - "Ticket.version incremented by 1"
          - "AuditLogEntry appended with subject_type=RESALE_LISTING, action=RESALE_LISTED"
      - from: LISTED
        to: ISSUED
        trigger: "POST /resale-listings/{id}/delist"
        actor: Patron
        preconditions:
          - "ResaleListing.status == LISTED"
          - "acting patron id == ResaleListing.seller_patron_id"
        side_effects:
          - "ResaleListing.status set to DELISTED"
          - "Ticket.lifecycle_status reverted to ISSUED; Event.entitlements_outstanding unchanged"
      - from: LISTED
        to: ISSUED
        trigger: "system, cascade link 4 of the DENIED_DEVICE_MISMATCH chain: a ResaleListing was set to SUSPENDED because its seller's recomputed fraud_risk_score reached FRAUD_BLOCK_THRESHOLD"
        actor: system
        preconditions:
          - "the suspended ResaleListing references this ticket"
        side_effects:
          - "Ticket.lifecycle_status reverted to ISSUED"
          - "AuditLogEntry appended with subject_type=RESALE_LISTING, action=RESALE_LISTING_SUSPENDED"
      - from: LISTED
        to: RESOLD
        trigger: "POST /resale-listings/{id}/purchase"
        actor: Patron
        preconditions:
          - "ResaleListing.status == LISTED"
          - "ResaleListing.marketplace IN {VERIFIED_PRIMARY, VERIFIED_PARTNER}"
          - "acting patron id != ResaleListing.seller_patron_id"
          - "acting Patron.identity_verified == true"
          - "Event.status IN {ON_SALE, DOORS_OPEN}"
        side_effects:
          - "ResaleListing.status set to SOLD, buyer_patron_id set to the acting patron"
          - "calculations.resale_settlement_split writes platform_fee_cents, venue_royalty_cents, processing_fee_cents, seller_payout_cents on the listing"
          - "seller Patron.payout_balance_cents increased by seller_payout_cents"
          - "Event.settlement_pool_cents increased by venue_royalty_cents"
          - "Ticket.holder_patron_id set to the buyer; Ticket.device_binding_status set to RELEASED and bound_device_fingerprint set to null"
          - "AuditLogEntry appended with subject_type=RESALE_LISTING, action=RESALE_SOLD"
      - from: ISSUED
        to: TRANSFERRED
        trigger: "POST /transfer-requests/{id}/accept"
        actor: Patron
        preconditions:
          - "TransferRequest.status == PENDING"
          - "acting patron id == TransferRequest.to_patron_id"
          - "logical clock < Event.transfer_window_closes_at"
          - "Ticket.transfer_count < Event.transfer_limit_per_ticket"
          - "recipient Patron.identity_verified == true"
        side_effects:
          - "Ticket.holder_patron_id set to TransferRequest.to_patron_id"
          - "Ticket.transfer_count incremented by 1"
          - "Ticket.device_binding_status set to RELEASED, bound_device_fingerprint set to null"
          - "Event.entitlements_outstanding unchanged (entitlement conservation invariant)"
      - from: TRANSFERRED
        to: TRANSFERRED
        trigger: "POST /transfer-requests/{id}/accept on a later TransferRequest for the same ticket"
        actor: Patron
        preconditions:
          - "same preconditions as ISSUED_to_TRANSFERRED"
        side_effects:
          - "same side effects as ISSUED_to_TRANSFERRED; transfer_count keeps accumulating toward Event.transfer_limit_per_ticket"
      - from: TRANSFERRED
        to: LISTED
        trigger: "POST /resale-listings"
        actor: Patron
        preconditions:
          - "same preconditions as ISSUED_to_LISTED, evaluated against the new holder"
        side_effects:
          - "same side effects as ISSUED_to_LISTED"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /tickets/{id}/void"
        actor: SecurityInvestigator
        preconditions:
          - "Ticket.lifecycle_status != VOIDED"
        side_effects:
          - "Event.entitlements_outstanding decremented by 1; AccessZone.issued_entitlement_count decremented by 1 and AccessZone.posture recomputed"
          - "when refund_to_holder == true and Ticket.ticket_type == PAID: Event.settlement_pool_cents decreased by face_value_cents and holder Patron.remediation_credit_cents increased by face_value_cents"
          - "AuditLogEntry appended with subject_type=TICKET, action=TICKET_VOIDED"
      - from: LISTED
        to: VOIDED
        trigger: "POST /tickets/{id}/void"
        actor: SecurityInvestigator
        preconditions:
          - "Ticket.lifecycle_status != VOIDED"
        side_effects:
          - "the ticket's ResaleListing with status == LISTED is set to SUSPENDED"
          - "all side effects of ISSUED_to_VOIDED"
      - from: RESOLD
        to: VOIDED
        trigger: "POST /tickets/{id}/void"
        actor: SecurityInvestigator
        preconditions:
          - "Ticket.lifecycle_status != VOIDED"
        side_effects:
          - "all side effects of ISSUED_to_VOIDED"

  - entity: Ticket
    dimension: admission_status
    initial_state: NOT_ADMITTED
    terminal_states: []
    note: "Independent of lifecycle_status: a VOIDED ticket whose holder is already INSIDE keeps admission_status == INSIDE, and an INSIDE ticket may still be LISTED-and-delisted on the commercial dimension."
    transitions:
      - from: NOT_ADMITTED
        to: INSIDE
        trigger: "POST /scan-sessions/{id}/scan-events with direction=IN adjudicated ADMITTED"
        actor: GateOperator
        preconditions:
          - "ScanSession.status == OPEN and Gate.status == SCANNING"
          - "Event.status IN {DOORS_OPEN, IN_PROGRESS}"
          - "presented barcode passes calculations.rotating_barcode_token acceptance"
          - "device_fingerprint == Ticket.bound_device_fingerprint"
          - "Gate.access_zone_id == Ticket.access_zone_id"
          - "Ticket.lifecycle_status != VOIDED"
          - "AccessZone.occupancy_count + 1 <= AccessZone.fire_code_capacity"
          - "Event.live_occupancy + 1 <= Event.fire_code_capacity"
        side_effects:
          - "ScanEvent persisted with result=ADMITTED, source=ONLINE"
          - "Ticket.last_admitted_at and admitted_scan_count updated"
          - "AccessZone.occupancy_count incremented by 1; Event.live_occupancy incremented by 1; Event.peak_live_occupancy raised when exceeded"
          - "Gate.admitted_scan_count and ScanSession.online_scan_count incremented by 1"
      - from: INSIDE
        to: EXITED
        trigger: "POST /scan-sessions/{id}/scan-events with direction=OUT"
        actor: GateOperator
        preconditions:
          - "Ticket.admission_status == INSIDE"
          - "ScanSession.status == OPEN"
        side_effects:
          - "ScanEvent persisted with result=EXIT_RECORDED"
          - "Ticket.last_exited_at set to the logical clock"
          - "AccessZone.occupancy_count decremented by 1; Event.live_occupancy decremented by 1 (occupancy conservation invariant)"
      - from: EXITED
        to: INSIDE
        trigger: "POST /scan-sessions/{id}/scan-events with direction=IN adjudicated ADMITTED (re-entry)"
        actor: GateOperator
        preconditions:
          - "all NOT_ADMITTED_to_INSIDE preconditions"
          - "logical clock > Ticket.last_exited_at + RE_ENTRY_LOCKOUT_SECONDS (closed lower bound: equality is rejected with ERR_REENTRY_LOCKOUT)"
        side_effects:
          - "all NOT_ADMITTED_to_INSIDE side effects"
      - from: INSIDE
        to: DENIED_FLAGGED
        trigger: "POST /scan-sessions/{id}/scan-events with direction=IN adjudicated DENIED_DUPLICATE"
        actor: GateOperator
        preconditions:
          - "Ticket.admission_status == INSIDE and direction == IN"
        side_effects:
          - "ScanEvent persisted with result=DENIED_DUPLICATE, denied_reason_code=ERR_DUPLICATE_SCAN"
          - "cascade link 1: DeniedEntryIncident created with category=DUPLICATE, status=OPEN"
          - "occupancy counters unchanged"
      - from: NOT_ADMITTED
        to: DENIED_FLAGGED
        trigger: "POST /scan-sessions/{id}/scan-events with direction=IN adjudicated DENIED_DEVICE_MISMATCH, DENIED_ZONE or DENIED_STALE_BARCODE"
        actor: GateOperator
        preconditions:
          - "the barcode seed resolves to this ticket"
        side_effects:
          - "ScanEvent persisted with the denial result and denied_reason_code"
          - "cascade link 1: DeniedEntryIncident created with the mapped category, status=OPEN"
          - "occupancy counters unchanged"

  - entity: Gate
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: SCANNING
        trigger: "POST /scan-sessions"
        actor: GateOperator
        preconditions:
          - "Event.status IN {DOORS_OPEN, IN_PROGRESS}"
          - "no ScanSession on this gate has status IN {OPEN, SYNCING}"
          - "the logical clock does not fall inside the half-open interval [opened_at, closed_at) of any ScanSession on this gate"
          - "payload expected_gate_version == Gate.version"
        side_effects:
          - "ScanSession created in OPEN with opened_at = logical clock"
          - "Gate.version incremented by 1"
      - from: SCANNING
        to: IDLE
        trigger: "POST /scan-sessions/{id}/close"
        actor: GateOperator
        preconditions:
          - "ScanSession.status IN {OPEN, SYNCING}"
        side_effects:
          - "ScanSession.status set to CLOSED, closed_at = logical clock"
          - "Gate.last_session_closed_at set to that closed_at; Gate.version incremented by 1"

  - entity: ScanSession
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SYNCING
        trigger: "POST /scan-sessions/{id}/offline-batch"
        actor: GateOperator
        preconditions:
          - "ScanSession.mode == OFFLINE_CAPABLE"
          - "ScanSession.status == OPEN"
        side_effects:
          - "each batch item adjudicated and persisted as a ScanEvent with source=OFFLINE_BATCH"
          - "ScanSession.offline_uploaded_count and duplicate_suppressed_count updated"
          - "session moves to SYNCING and accepts no further ONLINE scan (ERR_SESSION_SYNCING)"
      - from: SYNCING
        to: CLOSED
        trigger: "POST /scan-sessions/{id}/close"
        actor: GateOperator
        preconditions: []
        side_effects:
          - "closed_at set; Gate returns to IDLE"
      - from: OPEN
        to: CLOSED
        trigger: "POST /scan-sessions/{id}/close"
        actor: GateOperator
        preconditions: []
        side_effects:
          - "closed_at set; Gate returns to IDLE"

  - entity: TransferRequest
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /transfer-requests/{id}/accept"
        actor: Patron
        preconditions:
          - "acting patron id == to_patron_id"
          - "logical clock < Event.transfer_window_closes_at"
          - "Ticket.transfer_count < Event.transfer_limit_per_ticket"
          - "recipient Patron.identity_verified == true"
          - "Ticket.lifecycle_status IN {ISSUED, TRANSFERRED}"
        side_effects:
          - "decided_at set to the logical clock"
          - "Ticket lifecycle transition to TRANSFERRED with its side effects"
          - "every other PENDING TransferRequest on the same ticket is set to DECLINED with decided_at set"
      - from: PENDING
        to: DECLINED
        trigger: "POST /transfer-requests/{id}/decline"
        actor: Patron
        preconditions:
          - "acting patron id IN {to_patron_id, from_patron_id}"
        side_effects:
          - "decided_at set to the logical clock; ticket untouched"

  - entity: ResaleListing
    initial_state: LISTED
    terminal_states: [SOLD, DELISTED, SUSPENDED]
    transitions:
      - from: LISTED
        to: SOLD
        trigger: "POST /resale-listings/{id}/purchase"
        actor: Patron
        preconditions:
          - "see Ticket lifecycle LISTED_to_RESOLD preconditions"
        side_effects:
          - "see Ticket lifecycle LISTED_to_RESOLD side effects"
      - from: LISTED
        to: DELISTED
        trigger: "POST /resale-listings/{id}/delist"
        actor: Patron
        preconditions:
          - "acting patron id == seller_patron_id"
        side_effects:
          - "Ticket.lifecycle_status reverted to ISSUED"
      - from: LISTED
        to: SUSPENDED
        trigger: "system, cascade link 3: the seller's fraud_risk_score was recomputed to >= FRAUD_BLOCK_THRESHOLD by a DeniedEntryIncident creation, or the ticket was voided"
        actor: system
        preconditions:
          - "ResaleListing.status == LISTED"
        side_effects:
          - "cascade link 4: Ticket.lifecycle_status reverted to ISSUED unless the ticket is being VOIDED"
          - "AuditLogEntry appended with action=RESALE_LISTING_SUSPENDED"

  - entity: CredentialRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /credential-requests/{id}/submit"
        actor: BoxOfficeAgent
        preconditions:
          - "Event.status IN {ON_SALE, DOORS_OPEN}"
          - "AccessZone.posture != FROZEN"
        side_effects:
          - "requested_by_user_id set to the acting X-User-ID"
          - "AuditLogEntry appended with action=CREDENTIAL_REQUEST_SUBMITTED"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /credential-requests/{id}/request-changes"
        actor: TicketingApprover
        preconditions:
          - "CredentialRequest.status == SUBMITTED"
        side_effects:
          - "AuditLogEntry appended with action=CREDENTIAL_REQUEST_CHANGES_REQUESTED"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /credential-requests/{id}/submit (revision loop)"
        actor: BoxOfficeAgent
        preconditions:
          - "Event.status IN {ON_SALE, DOORS_OPEN}"
          - "AccessZone.posture != FROZEN"
          - "revision_count < MAX_CREDENTIAL_REVISIONS"
        side_effects:
          - "revision_count incremented by 1"
          - "requested_by_user_id overwritten with the acting X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /credential-requests/{id}/approve"
        actor: TicketingApprover
        preconditions:
          - "CredentialRequest.status == SUBMITTED"
          - "acting X-User-ID != requested_by_user_id (segregation of duties)"
          - "AccessZone.posture != FROZEN"
          - "for distribution_type == CREDENTIAL: quantity plus the summed quantity of APPROVED CredentialRequests whose [valid_from, valid_until) window overlaps this one <= AccessZone.credential_capacity"
        side_effects:
          - "approved_by_user_id set; forgone_revenue_cents computed by calculations.credential_forgone_revenue"
          - "cascade link 1: quantity Tickets auto-issued, holder = recipient_patron_id, ticket_type = COMP for COMP, CREDENTIAL for CREDENTIAL, WILL_CALL for WILL_CALL, face_value_cents = 0, credential_request_id = this request"
          - "cascade link 2: per issued ticket AccessZone.issued_entitlement_count and Event.entitlements_outstanding incremented by 1, AccessZone.comp_forgone_cents increased by the per-ticket forgone amount"
          - "cascade link 3: AccessZone.posture recomputed from the new issued_entitlement_count (calculations.zone_posture)"
          - "issued_ticket_count set to quantity; AuditLogEntry appended with action=CREDENTIAL_REQUEST_APPROVED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /credential-requests/{id}/reject"
        actor: TicketingApprover
        preconditions:
          - "CredentialRequest.status == SUBMITTED"
          - "acting X-User-ID != requested_by_user_id (segregation of duties)"
        side_effects:
          - "approved_by_user_id set to the acting X-User-ID; no ticket issued"
          - "AuditLogEntry appended with action=CREDENTIAL_REQUEST_REJECTED"

  - entity: DeniedEntryIncident
    initial_state: OPEN
    terminal_states: [REMEDIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /denied-entry-incidents/{id}/start-review"
        actor: SecurityInvestigator
        preconditions:
          - "DeniedEntryIncident.status == OPEN"
        side_effects:
          - "reviewer_user_id set to the acting X-User-ID"
      - from: UNDER_REVIEW
        to: REMEDIATED
        trigger: "POST /denied-entry-incidents/{id}/remediate"
        actor: SecurityInvestigator
        preconditions:
          - "DeniedEntryIncident.status == UNDER_REVIEW"
          - "DeniedEntryIncident.ticket_id is not null"
          - "Event.settlement_pool_cents >= the credit computed by calculations.denied_entry_remediation_credit"
        side_effects:
          - "remediation_credit_cents written from calculations.denied_entry_remediation_credit"
          - "holder Patron.remediation_credit_cents increased by that amount; Event.settlement_pool_cents decreased by the same amount (money conservation invariant)"
          - "Patron.fraud_risk_score recomputed with the ADJUDICATED variant; fraud_risk_basis set to ADJUDICATED"
          - "AuditLogEntry appended with action=DENIED_ENTRY_REMEDIATED"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /denied-entry-incidents/{id}/dismiss"
        actor: SecurityInvestigator
        preconditions:
          - "DeniedEntryIncident.status == UNDER_REVIEW"
        side_effects:
          - "no credit granted; remediation_credit_cents stays null"
          - "holder Patron.strike_count decremented by 1 (the strike booked at incident creation is withdrawn)"
          - "Patron.fraud_risk_score recomputed with the ADJUDICATED variant, which excludes DISMISSED incidents entirely; fraud_risk_basis set to ADJUDICATED"
          - "AuditLogEntry appended with action=DENIED_ENTRY_DISMISSED"

  - entity: ReconciliationReport
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /reconciliation-reports/{id}/finalize"
        actor: VenueAdmin
        preconditions:
          - "ReconciliationReport.status IN {DRAFT, REOPENED}"
          - "abs(variance_pct) <= MAX_VARIANCE_PCT, or override_reason is a non-empty string"
        side_effects:
          - "finalized_by_user_id set; scan_derived_attendance, variance_count, variance_pct and fire_code_breach recomputed at finalization"
          - "Event.status set to RECONCILED"
          - "AuditLogEntry appended with action=RECONCILIATION_FINALIZED"
      - from: FINAL
        to: REOPENED
        trigger: "POST /reconciliation-reports/{id}/reopen"
        actor: VenueAdmin
        preconditions:
          - "ReconciliationReport.status == FINAL"
        side_effects:
          - "finalized_by_user_id cleared to null; Event.status returned to CLOSED"
      - from: REOPENED
        to: FINAL
        trigger: "POST /reconciliation-reports/{id}/finalize"
        actor: VenueAdmin
        preconditions:
          - "same as DRAFT_to_FINAL"
        side_effects:
          - "same as DRAFT_to_FINAL"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's version only
# =============================================================================
concurrency_rules:
  - rule_id: resale-listing-create-stale-ticket
    parent_entity: Ticket
    write_endpoint: "POST /resale-listings"
    occ_field: "expected_ticket_version"
    description: |
      Creating a ResaleListing against a Ticket whose version has advanced since
      the client last read it is rejected. A relisting legitimately supersedes the
      prior DELISTED or SUSPENDED listing on the same ticket, so the write itself
      is valid product behaviour; the stale-version check is what stops a client
      from listing on top of a ticket whose holder, binding or lifecycle has moved
      since it was read.
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412
  - rule_id: scan-session-open-stale-gate
    parent_entity: Gate
    write_endpoint: "POST /scan-sessions"
    occ_field: "expected_gate_version"
    description: |
      Opening a ScanSession against a Gate whose version has advanced since the
      client last read it is rejected. A new session legitimately succeeds the
      previous closed one on the same gate, so the check is the only thing that
      stops an operator from opening a session on a stale view of the gate's lane
      configuration and session history.
    error_id: ERR_STALE_GATE_VERSION
    http_status: 412
  - rule_id: reconciliation-create-stale-event
    parent_entity: Event
    write_endpoint: "POST /events/{id}/reconciliation-reports"
    occ_field: "expected_event_version"
    description: |
      Creating a ReconciliationReport against an Event whose version has advanced
      since the client last read it is rejected. A later report legitimately
      supersedes an earlier DRAFT one, so the stale-version check is what stops a
      report from being cut against out-of-date occupancy and settlement figures.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rotating_barcode_token
    trigger: "GET /tickets/{id}/barcode, and on every POST /scan-sessions/{id}/scan-events or offline-batch item before any other admission check"
    algorithm: threshold
    formula: |
      # epoch index is computed from the LOGICAL clock, never wall-clock time
      epoch_index(t) = floor( (t - Event.barcode_anchor_at) / BARCODE_ROTATION_SECONDS )   # floor toward -infinity
      current_barcode(ticket, t) = concat(ticket.barcode_seed, "-", str(epoch_index(t)))

      # acceptance, evaluated left to right; the first failing clause decides the result
      seed_part, epoch_part = split_last(presented_barcode, "-")
      if no Ticket has barcode_seed == seed_part:            -> DENIED_COUNTERFEIT (ERR_COUNTERFEIT_BARCODE)
      if epoch_part is not an integer:                       -> DENIED_COUNTERFEIT (ERR_COUNTERFEIT_BARCODE)
      now_epoch = epoch_index(logical_clock)
      if epoch_part > now_epoch:                             -> DENIED_STALE_BARCODE (ERR_BARCODE_EPOCH_INVALID)
      if epoch_part < now_epoch - SKEW_TOLERANCE_EPOCHS:     -> DENIED_STALE_BARCODE (ERR_BARCODE_EPOCH_INVALID)
      # accepted window is exactly the closed integer range [now_epoch - 1, now_epoch]
    input_set: "The presented barcode string plus the ticket resolved from its seed part; no ticket state is consulted at this stage"
    constants:
      BARCODE_ROTATION_SECONDS: 30
      SKEW_TOLERANCE_EPOCHS: 1
    precision: "integer epoch indices; timestamps compared at whole-second resolution"

  - name: zone_posture
    trigger: "recomputed whenever AccessZone.issued_entitlement_count changes (ticket issuance, credential approval cascade, ticket void)"
    algorithm: threshold
    formula: |
      ratio = issued_entitlement_count / fire_code_capacity        # exact rational, not rounded
      posture = FROZEN     if ratio >= 1.00
              = RESTRICTED if ratio >= 0.90
              = OPEN       otherwise
      # FROZEN blocks CredentialRequest submit/approve; RESTRICTED still allows them
    input_set: "Tickets of this zone with lifecycle_status IN {ISSUED, LISTED, TRANSFERRED, RESOLD}; VOIDED tickets are excluded"
    constants:
      RESTRICTED_RATIO: 0.90
      FROZEN_RATIO: 1.00
    precision: "ratio compared as an exact rational; boundary is inclusive (>=)"

  - name: resale_price_cap
    trigger: "POST /resale-listings, before the ask_price_cents comparison"
    algorithm: tiered_pricing
    formula: |
      # mode (a): 4 inputs, nested min, conditional branches on two entity states
      if Ticket.ticket_type IN {COMP, CREDENTIAL}:
          cap = 0                                     # non-transferable give-aways may never be resold
      elif Event.price_cap_regime == NONE:
          cap = null                                  # uncapped: any ask_price_cents >= 0 accepted
      else:
          pct = STATUTORY_CAP_PCT if Event.price_cap_regime == STATUTORY else VENUE_POLICY_CAP_PCT
          markup = min( round_half_up(Ticket.face_value_cents * pct), MAX_ABS_MARKUP_CENTS )
          cap = Ticket.face_value_cents + markup
          if Event.price_cap_regime == STATUTORY and Patron(seller).identity_verified == false:
              cap = Ticket.face_value_cents           # statutory regime forbids any markup by unverified sellers
      accept iff cap is null or ask_price_cents <= cap             # boundary: equality is ACCEPTED
    input_set: "The listed Ticket, its Event's price_cap_regime, and the acting seller Patron"
    constants:
      STATUTORY_CAP_PCT: 0.10
      VENUE_POLICY_CAP_PCT: 0.30
      MAX_ABS_MARKUP_CENTS: 2500
    precision: "whole cents, round_half_up on the percentage markup before the min()"
    worked_examples:
      - "face_value_cents 12000, VENUE_POLICY: markup = min(3600, 2500) = 2500 -> cap 14500"
      - "face_value_cents 12000, STATUTORY, verified seller: markup = min(1200, 2500) = 1200 -> cap 13200"
      - "face_value_cents 12000, STATUTORY, unverified seller: cap 12000"

  - name: resale_settlement_split
    trigger: "POST /resale-listings/{id}/purchase"
    algorithm: waterfall_allocation
    formula: |
      # mode (b): rounding order is PINNED to round-per-component-then-sum.
      platform_fee_cents   = round_half_up(sale_price_cents * PLATFORM_FEE_PCT)
      venue_royalty_cents  = round_half_up(sale_price_cents * VENUE_ROYALTY_PCT)
      processing_fee_cents = round_half_up(sale_price_cents * PROCESSING_FEE_PCT) + PROCESSING_FIXED_CENTS
      total_deductions     = platform_fee_cents + venue_royalty_cents + processing_fee_cents
      seller_payout_cents  = sale_price_cents - total_deductions
      # FORBIDDEN alternative: round_half_up(sale_price_cents * (sum of the three pcts)) + fixed,
      # which yields 2009 instead of 2010 on a 14500-cent sale. The per-component order above wins.
      # sale_price_cents is ResaleListing.ask_price_cents at the moment of purchase.
    input_set: "The SOLD ResaleListing's ask_price_cents only; no patron or event attribute enters the split"
    constants:
      PLATFORM_FEE_PCT: 0.0725
      VENUE_ROYALTY_PCT: 0.0350
      PROCESSING_FEE_PCT: 0.0290
      PROCESSING_FIXED_CENTS: 30
    precision: "whole cents, round_half_up per component, then integer addition"
    worked_examples:
      - "ask 14500 -> platform 1051, venue 508, processing 451, deductions 2010, seller payout 12490"

  - name: credential_forgone_revenue
    trigger: "POST /credential-requests/{id}/approve"
    algorithm: aggregation
    formula: |
      # mode (b) on a multi-line batch: rounding is PINNED to per-ticket, then summed.
      per_ticket_forgone_cents = round_half_up( AccessZone.face_value_reference_cents * (1 - AccessZone.comp_discount_pct) )
      forgone_revenue_cents    = per_ticket_forgone_cents * CredentialRequest.quantity
      # FORBIDDEN alternative: round_half_up(face_value_reference_cents * (1 - comp_discount_pct) * quantity),
      # which yields 5250 instead of 5252 for reference 8750, discount 0.85, quantity 4.
      AccessZone.comp_forgone_cents += forgone_revenue_cents
    input_set: "The approved CredentialRequest's quantity and its AccessZone's face_value_reference_cents and comp_discount_pct"
    constants: {}
    precision: "whole cents, round_half_up per issued ticket, then integer multiplication"
    worked_examples:
      - "reference 8750, discount 0.85, quantity 4 -> per ticket 1313, total 5252"

  - name: denied_entry_remediation_credit
    trigger: "POST /denied-entry-incidents/{id}/remediate"
    algorithm: threshold
    formula: |
      # mode (c): the goodwill tier LOOKS like it should be keyed on the credit the patron
      # ultimately receives, which would be circular. Evaluation order is PINNED:
      #   step 1 base_credit_cents, step 2 tier selected FROM base_credit_cents,
      #   step 3 goodwill, step 4 strike penalty, step 5 total.
      base_credit_cents = Ticket.face_value_cents if Ticket.ticket_type == PAID else 0
      goodwill_pct = GOODWILL_LOW_PCT  if base_credit_cents <= GOODWILL_TIER1_CENTS
                   = GOODWILL_MID_PCT  if base_credit_cents <= GOODWILL_TIER2_CENTS
                   = GOODWILL_HIGH_PCT otherwise
      goodwill_cents = round_half_up(base_credit_cents * goodwill_pct)
      strike_penalty_cents = min( Patron.strike_count * STRIKE_PENALTY_CENTS, STRIKE_PENALTY_CAP_CENTS )
      total_credit_cents = max( base_credit_cents + goodwill_cents - strike_penalty_cents, 0 )
      # Patron.strike_count is read AFTER the strike booked by this incident's creation,
      # i.e. the incident under remediation counts against its own credit.
    input_set: "The incident's Ticket and its holder Patron at remediation time"
    constants:
      GOODWILL_TIER1_CENTS: 5000
      GOODWILL_TIER2_CENTS: 15000
      GOODWILL_LOW_PCT: 0.10
      GOODWILL_MID_PCT: 0.15
      GOODWILL_HIGH_PCT: 0.20
      STRIKE_PENALTY_CENTS: 500
      STRIKE_PENALTY_CAP_CENTS: 2000
    precision: "whole cents, round_half_up on the goodwill component"
    worked_examples:
      - "face 14000, strike_count 1 -> base 14000, tier 0.15, goodwill 2100, penalty 500, total 15600 (keying the tier on base+goodwill = 16100 would wrongly select 0.20, giving goodwill 2800 and total 16300)"
      - "face 5000, strike_count 0 -> base 5000, tier 0.10 (boundary is inclusive), goodwill 500, penalty 0, total 5500"
      - "face 12000, strike_count 2 -> base 12000, tier 0.15, goodwill 1800, penalty 1000, total 12800"
      - "COMP ticket, strike_count 1 -> base 0, goodwill 0, penalty 500, total max(-500, 0) = 0"

  - name: live_occupancy
    trigger: "recomputed on every persisted ScanEvent; read by GET /events/{id}/occupancy and by the capacity preconditions of the IN scan transitions"
    algorithm: projection
    formula: |
      # dual variant on the OCCUPANCY domain: same ScanEvent stream, two inclusion sets.
      variant GATE_LIVE (persisted as Event.live_occupancy and AccessZone.occupancy_count):
        replay ScanEvents with source == ONLINE ordered by recorded_at ASC, tie-break created_at ASC:
          result == ADMITTED       -> +1
          result == EXIT_RECORDED  -> -1
          any DENIED_* result      ->  0
        occupancy is clamped at a floor of 0
      variant RECONCILED (persisted as ReconciliationReport.scan_derived_attendance):
        count DISTINCT ticket_id over ScanEvents with result == ADMITTED and ANY source
        (OFFLINE_BATCH included), ordered by scanned_at ASC, tie-break recorded_at ASC;
        EXIT_RECORDED events do NOT reduce this count because it measures attendance, not presence
    input_set: "GATE_LIVE: ScanEvents of the event with source == ONLINE. RECONCILED: all ScanEvents of the event regardless of source."
    constants: {}
    precision: "integer head counts"
    variants:
      - name: GATE_LIVE
        when: "real-time fire-code gating during scan-in and GET /events/{id}/occupancy"
        difference: "Excludes every OFFLINE_BATCH scan, so an un-uploaded scanner cache is invisible to the capacity gate; nets exits against entries."
      - name: RECONCILED
        when: "ReconciliationReport creation and finalization"
        difference: "Includes OFFLINE_BATCH scans and counts distinct admitted tickets without netting exits, so it can exceed GATE_LIVE for the identical event."

  - name: patron_fraud_risk_score
    trigger: "recomputed on DeniedEntryIncident creation (PROVISIONAL), on DeniedEntryIncident remediate/dismiss (ADJUDICATED), and read as a precondition of POST /resale-listings and POST /transfer-requests"
    algorithm: weighted_scoring
    formula: |
      # dual variant on the PATRON RISK domain (a different entity domain from live_occupancy).
      weight(category) = { COUNTERFEIT: 50, DEVICE_MISMATCH: 45, UNAUTHORIZED_RESALE: 30,
                           DUPLICATE: 20, ZONE_VIOLATION: 15 }
      churn_points = DEVICE_CHURN_WEIGHT * max(Patron.device_rebind_count - 1, 0)
      variant PROVISIONAL:
        raw = churn_points + sum( weight(i.category) for i in incidents(patron)
                                  where i.status IN {OPEN, UNDER_REVIEW, REMEDIATED} )
      variant ADJUDICATED:
        raw = churn_points
            + sum( weight(i.category)                       for i in incidents where i.status IN {OPEN, UNDER_REVIEW} )
            + sum( round_half_up(weight(i.category) * REMEDIATED_DISCOUNT) for i in incidents where i.status == REMEDIATED )
            + 0                                             for i in incidents where i.status == DISMISSED
      fraud_risk_score = min(raw, SCORE_CAP)
      # gating: POST /resale-listings and POST /transfer-requests require fraud_risk_score < FRAUD_BLOCK_THRESHOLD
      # (a score of exactly 40 is BLOCKED)
    input_set: "DeniedEntryIncidents whose patron_id == this patron, filtered by status per variant; plus the patron's device_rebind_count"
    constants:
      DEVICE_CHURN_WEIGHT: 4
      REMEDIATED_DISCOUNT: 0.5
      SCORE_CAP: 100
      FRAUD_BLOCK_THRESHOLD: 40
    precision: "integer score, round_half_up on each discounted incident weight before summation"
    variants:
      - name: PROVISIONAL
        when: "written the moment an incident is created, i.e. while nobody has adjudicated it"
        difference: "Counts REMEDIATED incidents at full weight and counts every OPEN incident, so it is the strictest reading."
      - name: ADJUDICATED
        when: "written when an incident reaches REMEDIATED or DISMISSED"
        difference: "Halves REMEDIATED weights (round_half_up) and drops DISMISSED incidents entirely, so the identical incident set yields a lower score than PROVISIONAL (a single DEVICE_MISMATCH: 45 provisional vs 23 adjudicated)."

  - name: reconciliation_variance
    trigger: "POST /events/{id}/reconciliation-reports and POST /reconciliation-reports/{id}/finalize"
    algorithm: aggregation
    formula: |
      scan_derived_attendance = live_occupancy.RECONCILED(event)
      variance_count = reported_attendance - scan_derived_attendance
      variance_pct = 0.00 if scan_derived_attendance == 0
                     else round_half_up( variance_count / scan_derived_attendance * 100, 2 )
      fire_code_breach = (scan_derived_attendance > Event.fire_code_capacity)
      # finalization gate: abs(variance_pct) <= MAX_VARIANCE_PCT, else override_reason must be non-empty
    input_set: "All ScanEvents of the event with result == ADMITTED (any source) plus the report's reported_attendance"
    constants:
      MAX_VARIANCE_PCT: 2.00
    precision: "variance_pct to 2 decimal places, round_half_up; division by a zero attendance is defined as 0.00 rather than an error"
    worked_examples:
      - "reported 3, derived 2 -> variance_count 1, variance_pct 50.00, finalization refused without override_reason"
      - "reported 0, derived 0 -> variance_count 0, variance_pct 0.00, finalization allowed"

  - name: gate_clearance_projection
    trigger: "GET /events/{id}/occupancy"
    algorithm: forward_looking
    formula: |
      capacity_per_minute = sum( g.throughput_per_minute * g.lanes_open
                                 for g in Gates(event) where g.status == SCANNING )
      waiting = count( Ticket of event where lifecycle_status IN {ISSUED, LISTED, TRANSFERRED, RESOLD}
                                        and admission_status == NOT_ADMITTED )
      projected_clearance_minutes = null if capacity_per_minute == 0
                                    else ceil( waiting / capacity_per_minute )
    input_set: "Gates with status == SCANNING only (IDLE gates contribute no throughput); Tickets not VOIDED and never admitted"
    constants: {}
    precision: "integer minutes, ceiling; null when no gate is scanning (empty-set edge)"
    worked_examples:
      - "3 waiting tickets, one SCANNING gate at 20/min x 2 lanes -> ceil(3/40) = 1"
      - "3 waiting tickets, every gate IDLE -> null"

  - name: reentry_lockout_window
    trigger: "POST /scan-sessions/{id}/scan-events with direction == IN against a Ticket whose admission_status == EXITED"
    algorithm: interval_merge
    formula: |
      # The lockout is a CLOSED interval anchored on the ticket's own last exit, so a
      # patron cannot hand a phone back over the fence and re-enter on the same barcode.
      lockout_interval(ticket) = [ Ticket.last_exited_at,
                                   Ticket.last_exited_at + RE_ENTRY_LOCKOUT_SECONDS ]   # BOTH ends inclusive
      re_entry_allowed iff logical_clock > Ticket.last_exited_at + RE_ENTRY_LOCKOUT_SECONDS
      # Equality at the upper bound is REJECTED (ERR_REENTRY_LOCKOUT); the first accepted
      # instant is exactly one second later. The interval is per ticket, not per patron:
      # a second ticket held by the same patron carries its own independent window.
    input_set: "The single Ticket resolved from the presented barcode; only its own last_exited_at is consulted"
    constants: { RE_ENTRY_LOCKOUT_SECONDS: 120 }
    precision: "whole-second comparison against the logical clock"
    worked_examples:
      - "last_exited_at 2026-09-12T18:10:30Z: an IN scan at 18:12:30Z is REJECTED (upper bound inclusive), one at 18:12:31Z is ADMITTED"

  - name: credential_window_overlap_capacity
    trigger: "POST /credential-requests/{id}/submit (revision ceiling) and POST /credential-requests/{id}/approve (window capacity)"
    algorithm: interval_merge
    formula: |
      # Aggregate temporal capacity: BACK_OF_HOUSE credential passes are limited per zone
      # per instant, not per event, so two non-overlapping shifts may each fill the zone.
      overlaps(a, b) iff a.valid_from < b.valid_until AND b.valid_from < a.valid_until
      # HALF-OPEN windows: a.valid_until == b.valid_from means the shifts merely TOUCH and
      # therefore do NOT overlap, so the later shift starts from a clean capacity slate.
      committed(zone, window) = sum( r.quantity for r in CredentialRequests(zone)
                                     where r.status == APPROVED
                                       and r.distribution_type == CREDENTIAL
                                       and overlaps(r, window) )
      approve_allowed iff committed(zone, this.window) + this.quantity <= AccessZone.credential_capacity
      # boundary: equality is ACCEPTED; one more pass is ERR_ZONE_CREDENTIAL_WINDOW_CAPACITY

      # Revision ceiling on the SUBMITTED <-> CHANGES_REQUESTED cycle:
      resubmit_allowed iff CredentialRequest.revision_count < MAX_CREDENTIAL_REVISIONS
      # revision_count is incremented only on a CHANGES_REQUESTED -> SUBMITTED resubmission,
      # never on the first DRAFT -> SUBMITTED submission.
    input_set: "APPROVED CredentialRequests of the same AccessZone with distribution_type == CREDENTIAL whose window overlaps the candidate window; plus the candidate's own quantity and revision_count"
    constants: { MAX_CREDENTIAL_REVISIONS: 2 }
    precision: "integer pass counts; window bounds compared at whole-second resolution"
    worked_examples:
      - "credential_capacity 4, an APPROVED request of quantity 3 over [18:00Z, 20:00Z): approving quantity 1 over [19:00Z, 21:00Z) succeeds (3 + 1 == 4), quantity 2 fails"
      - "credential_capacity 4, an APPROVED request of quantity 4 over [18:00Z, 20:00Z): approving quantity 4 over [20:00Z, 22:00Z) succeeds because the windows only touch"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
#
# Scan adjudication note (POST /scan-sessions/{id}/scan-events and each offline-batch
# item), in three bands:
#
#   priorities 1-19  : hard request errors. NOTHING is persisted — no ScanEvent, no
#                      DeniedEntryIncident, no counter movement, no strike.
#   priorities 20-27 : the request is a well-formed scan whose ADJUDICATION failed. The
#                      server PERSISTS a ScanEvent carrying the mapped denial result and
#                      denied_reason_code (the error_id string), and THEN returns the
#                      mapped error_id with HTTP 422/409.
#   incident opening : only the five FRAUD-BEARING denials open a DeniedEntryIncident and
#                      book a Patron strike, under this result -> category map:
#                        DENIED_COUNTERFEIT      -> COUNTERFEIT
#                        DENIED_STALE_BARCODE    -> COUNTERFEIT      (screenshot replay)
#                        DENIED_DEVICE_MISMATCH  -> DEVICE_MISMATCH
#                        DENIED_DUPLICATE        -> DUPLICATE
#                        DENIED_ZONE             -> ZONE_VIOLATION
#                      The three OPERATIONAL denials — DENIED_CAPACITY (priorities 26-27),
#                      DENIED_REENTRY_LOCKOUT (priority 24) and DENIED_VOIDED — persist the
#                      ScanEvent but open NO incident, book NO strike and leave
#                      Patron.fraud_risk_score untouched: a full house is not the patron's
#                      fault. UNAUTHORIZED_RESALE incidents are never scan-derived; they are
#                      raised by the ERR_MARKETPLACE_NOT_VERIFIED path on listing creation.
#   DENIED_VOIDED    : produced ONLY by offline-batch items. A live scan of a VOIDED ticket
#                      is stopped at priority 10 and therefore persists nothing, whereas the
#                      batch is best-effort per item and records the voided item instead of
#                      aborting the upload.
#   admission_status : only the declared §1.2 transitions move it. DENIED_CAPACITY,
#                      DENIED_REENTRY_LOCKOUT and DENIED_VOIDED have no transition, so the
#                      ticket keeps its prior admission_status.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body shape: every required field present, enums within their declared set, integers within their declared range, valid_until strictly after valid_from, ISO-8601 timestamps parseable"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 4
    category: existence
    check: "path resources exist, validated left to right"
    error_id: ERR_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids (each collection raises its own ERR_*_NOT_FOUND: ERR_EVENT_NOT_FOUND, ERR_TICKET_NOT_FOUND, ERR_PATRON_NOT_FOUND, ERR_GATE_NOT_FOUND, ERR_ZONE_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_SCAN_EVENT_NOT_FOUND, ERR_TRANSFER_NOT_FOUND, ERR_LISTING_NOT_FOUND, ERR_CREDENTIAL_REQUEST_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_REPORT_NOT_FOUND)"
  - priority: 5
    category: existence
    check: "body foreign keys resolve: event_id, access_zone_id, holder_patron_id, to_patron_id, recipient_patron_id, gate_id, ticket_id"
    error_id: ERR_ZONE_NOT_FOUND
    http_status: 404
    applies_to: "POST /tickets, POST /events/{id}/gates, POST /transfer-requests, POST /resale-listings, POST /credential-requests, POST /scan-sessions"
  - priority: 6
    category: business_referential
    check: "the referenced AccessZone / Gate belongs to the same Event as the resource being created or acted on"
    error_id: ERR_CROSS_EVENT_REFERENCE
    http_status: 422
    applies_to: "POST /tickets, POST /events/{id}/gates, POST /credential-requests"
  - priority: 7
    category: auth
    check: "for entity_backed role Patron, the acting X-User-ID equals the ownership field the operation requires (Ticket.holder_patron_id for device binding, transfer creation and listing; TransferRequest.to_patron_id for accept; ResaleListing.seller_patron_id for delist)"
    error_id: ERR_NOT_TICKET_HOLDER
    http_status: 403
    applies_to: "POST /tickets/{id}/device-binding, POST /tickets/{id}/device-binding/release, POST /transfer-requests, POST /transfer-requests/{id}/accept, POST /transfer-requests/{id}/decline, POST /resale-listings, POST /resale-listings/{id}/delist"
  - priority: 8
    category: state
    check: "OCC: payload expected_ticket_version / expected_gate_version / expected_event_version equals the parent's current version"
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412
    applies_to: "POST /resale-listings (ERR_STALE_TICKET_VERSION), POST /scan-sessions (ERR_STALE_GATE_VERSION), POST /events/{id}/reconciliation-reports (ERR_STALE_EVENT_VERSION)"
  - priority: 9
    category: state
    check: "the acted-on resource is in a state from which this trigger is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 10
    category: state
    check: "the target Ticket is not VOIDED"
    error_id: ERR_TICKET_VOIDED
    http_status: 409
    applies_to: "POST /tickets/{id}/device-binding, POST /transfer-requests, POST /resale-listings, POST /scan-sessions/{id}/scan-events, POST /scan-sessions/{id}/offline-batch"
  - priority: 11
    category: state
    check: "cross-entity: the Gate of the session has status == SCANNING. Deliberately ordered ABOVE the session-state check at priority 15 so that BOTH errors stay reachable: closing a session flips the gate to IDLE and the session to CLOSED, and this ordering makes that combination report ERR_GATE_NOT_SCANNING, leaving ERR_SESSION_NOT_OPEN to the SYNCING case where the gate is still SCANNING"
    error_id: ERR_GATE_NOT_SCANNING
    http_status: 409
    applies_to: "POST /scan-sessions/{id}/scan-events, POST /scan-sessions/{id}/offline-batch"
  - priority: 12
    category: business_constraint
    check: "the offline batch is uploaded to a session whose mode == OFFLINE_CAPABLE"
    error_id: ERR_SESSION_NOT_OFFLINE_CAPABLE
    http_status: 409
    applies_to: "POST /scan-sessions/{id}/offline-batch"
  - priority: 13
    category: state
    check: "cross-entity: Event.status permits the operation — access-zone and gate creation need DRAFT; issuance and credential submission/approval need {ON_SALE, DOORS_OPEN}; scanning needs {DOORS_OPEN, IN_PROGRESS}; reconciliation needs {CLOSED, RECONCILED} (RECONCILED passes this rule so that the more specific priority 17 owns the already-reconciled refusal instead of being shadowed here)"
    error_id: ERR_EVENT_STATE_FORBIDS_OPERATION
    http_status: 409
    applies_to: "POST /events/{id}/access-zones, POST /events/{id}/gates, POST /tickets, POST /credential-requests/{id}/submit, POST /credential-requests/{id}/approve, POST /scan-sessions, POST /scan-sessions/{id}/scan-events, POST /scan-sessions/{id}/offline-batch, POST /events/{id}/reconciliation-reports"
  - priority: 14
    category: business_temporal
    check: "cross-entity: transfers require the logical clock strictly before Event.transfer_window_closes_at and Event.status IN {ON_SALE, DOORS_OPEN}"
    error_id: ERR_EVENT_STATE_FORBIDS_TRANSFER
    http_status: 409
    applies_to: "POST /transfer-requests, POST /transfer-requests/{id}/accept"
  - priority: 15
    category: state
    check: "the ScanSession is OPEN; a SYNCING session (one that has already taken an offline upload) refuses further online scans. Scoped to scan-events only: a second offline-batch against a SYNCING or CLOSED session is not a declared §1.2 ScanSession transition and is therefore caught earlier, at priority 9, as ERR_INVALID_STATE"
    error_id: ERR_SESSION_NOT_OPEN
    http_status: 409
    applies_to: "POST /scan-sessions/{id}/scan-events"
  - priority: 16
    category: state
    check: "cross-entity: AccessZone.posture != FROZEN for credential submission and approval"
    error_id: ERR_ZONE_FROZEN
    http_status: 409
    applies_to: "POST /credential-requests/{id}/submit, POST /credential-requests/{id}/approve"
  - priority: 17
    category: business_constraint
    check: "the Event already carries a ReconciliationReport in status FINAL, or Event.status == RECONCILED"
    error_id: ERR_EVENT_ALREADY_RECONCILED
    http_status: 409
    applies_to: "POST /events/{id}/reconciliation-reports"
  - priority: 18
    category: auth
    check: "segregation of duties: the approving/rejecting X-User-ID differs from CredentialRequest.requested_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /credential-requests/{id}/approve, POST /credential-requests/{id}/reject"
  - priority: 19
    category: business_constraint
    check: "dedupe_key is unique within the ScanSession"
    error_id: ERR_DUPLICATE_DEDUPE_KEY
    http_status: 409
    applies_to: "POST /scan-sessions/{id}/scan-events"
  - priority: 20
    category: business_safety
    check: "the presented barcode's seed part resolves to a Ticket of this event (counterfeit detection). An unresolvable seed has no holder, so the persisted ScanEvent and the COUNTERFEIT DeniedEntryIncident both carry ticket_id null and the incident carries patron_id null, no Patron strike is booked and no fraud_risk_score moves; the incident still opens so that the denial is auditable"
    error_id: ERR_COUNTERFEIT_BARCODE
    http_status: 422
    applies_to: "POST /scan-sessions/{id}/scan-events, POST /scan-sessions/{id}/offline-batch"
  - priority: 21
    category: business_safety
    check: "the presented barcode's epoch index lies in the closed range [now_epoch - SKEW_TOLERANCE_EPOCHS, now_epoch] (screenshot-replay defence)"
    error_id: ERR_BARCODE_EPOCH_INVALID
    http_status: 422
    applies_to: "POST /scan-sessions/{id}/scan-events, POST /scan-sessions/{id}/offline-batch"
  - priority: 22
    category: business_safety
    check: "the ticket has device_binding_status == BOUND and the presented device_fingerprint equals Ticket.bound_device_fingerprint"
    error_id: ERR_DEVICE_MISMATCH
    http_status: 422
    applies_to: "POST /scan-sessions/{id}/scan-events, POST /scan-sessions/{id}/offline-batch"
  - priority: 23
    category: business_safety
    check: "an IN scan is refused when the ticket is already INSIDE (duplicate scan detection)"
    error_id: ERR_DUPLICATE_SCAN
    http_status: 409
    applies_to: "POST /scan-sessions/{id}/scan-events, POST /scan-sessions/{id}/offline-batch"
  - priority: 24
    category: business_temporal
    check: "re-entry lockout: an IN scan on an EXITED ticket is refused while the logical clock is inside the closed interval [Ticket.last_exited_at, Ticket.last_exited_at + RE_ENTRY_LOCKOUT_SECONDS]"
    error_id: ERR_REENTRY_LOCKOUT
    http_status: 409
    applies_to: "POST /scan-sessions/{id}/scan-events"
  - priority: 25
    category: business_referential
    check: "access-zone enforcement: Gate.access_zone_id == Ticket.access_zone_id, and Ticket.ticket_type == CREDENTIAL whenever the zone's required_entitlement_level == BACK_OF_HOUSE"
    error_id: ERR_ZONE_NOT_ENTITLED
    http_status: 403
    applies_to: "POST /scan-sessions/{id}/scan-events, POST /scan-sessions/{id}/offline-batch"
  - priority: 26
    category: business_safety
    check: "fire code, zone level: AccessZone.occupancy_count + 1 <= AccessZone.fire_code_capacity"
    error_id: ERR_ZONE_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /scan-sessions/{id}/scan-events"
  - priority: 27
    category: business_safety
    check: "fire code, event level: Event.live_occupancy + 1 <= Event.fire_code_capacity"
    error_id: ERR_EVENT_FIRE_CODE_FULL
    http_status: 409
    applies_to: "POST /scan-sessions/{id}/scan-events"
  - priority: 28
    category: business_safety
    check: "the acting patron's fraud_risk_score is strictly below FRAUD_BLOCK_THRESHOLD (40)"
    error_id: ERR_PATRON_FRAUD_BLOCKED
    http_status: 403
    applies_to: "POST /resale-listings, POST /transfer-requests"
  - priority: 29
    category: business_constraint
    check: "temporal overlap on a Gate: the logical clock must not fall inside the half-open interval [opened_at, closed_at) of any existing ScanSession of that gate, where a still-OPEN or SYNCING session is treated as having closed_at = +infinity; a new session opening exactly at a prior session's closed_at is ACCEPTED. This is the ONLY rule that governs gate occupancy at session creation: priority 9 is scoped to the state of the resource named in the path, and POST /scan-sessions names no existing ScanSession, so an attempt to open a second session on a gate whose status is already SCANNING must report ERR_GATE_SESSION_OVERLAP and never ERR_INVALID_STATE"
    error_id: ERR_GATE_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /scan-sessions"
  - priority: 30
    category: business_constraint
    check: "transfer limit: Ticket.transfer_count < Event.transfer_limit_per_ticket"
    error_id: ERR_TRANSFER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /transfer-requests, POST /transfer-requests/{id}/accept"
  - priority: 31
    category: business_constraint
    check: "aggregate temporal capacity on an AccessZone: for distribution_type == CREDENTIAL, quantity plus the summed quantity of APPROVED CredentialRequests whose [valid_from, valid_until) windows overlap this request's window must not exceed AccessZone.credential_capacity; windows that merely touch (valid_until == valid_from) do not overlap"
    error_id: ERR_ZONE_CREDENTIAL_WINDOW_CAPACITY
    http_status: 409
    applies_to: "POST /credential-requests/{id}/approve"
  - priority: 32
    category: business_referential
    check: "identity: the transfer recipient Patron has identity_verified == true, and a resale buyer has identity_verified == true"
    error_id: ERR_RECIPIENT_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /transfer-requests, POST /transfer-requests/{id}/accept, POST /resale-listings/{id}/purchase"
  - priority: 33
    category: business_referential
    check: "COMP and CREDENTIAL tickets may neither be transferred nor listed for resale"
    error_id: ERR_TICKET_NOT_TRANSFERABLE
    http_status: 422
    applies_to: "POST /transfer-requests, POST /resale-listings"
  - priority: 34
    category: business_fiscal
    check: "the listing marketplace is a verified channel (VERIFIED_PRIMARY or VERIFIED_PARTNER); UNVERIFIED is refused. Offering an entitlement through an unverified channel IS the unauthorized-resale signal, so this is the one adjudication failure outside the scan ladder that still persists a DeniedEntryIncident: category UNAUTHORIZED_RESALE, ticket_id = the offered ticket, patron_id = the acting seller, with a Patron strike booked and the seller's fraud_risk_score recomputed under the PROVISIONAL variant. No ResaleListing row is created and Ticket.lifecycle_status is unchanged"
    error_id: ERR_MARKETPLACE_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /resale-listings"
  - priority: 35
    category: business_fiscal
    check: "ask_price_cents <= cap_price_cents from calculations.resale_price_cap (equality accepted)"
    error_id: ERR_PRICE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /resale-listings"
  - priority: 36
    category: business_fiscal
    check: "remediation: Event.settlement_pool_cents >= the computed remediation credit"
    error_id: ERR_SETTLEMENT_POOL_INSUFFICIENT
    http_status: 409
    applies_to: "POST /denied-entry-incidents/{id}/remediate"
  - priority: 37
    category: business_fiscal
    check: "finalization: abs(variance_pct) <= MAX_VARIANCE_PCT unless a non-empty override_reason is supplied"
    error_id: ERR_ATTENDANCE_VARIANCE_UNRESOLVED
    http_status: 409
    applies_to: "POST /reconciliation-reports/{id}/finalize"
  - priority: 38
    category: business_constraint
    check: "zone_code is unique within the event; gate_code is unique within the event"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /events/{id}/access-zones, POST /events/{id}/gates"
  - priority: 39
    category: business_constraint
    check: "Patron.email is globally unique, compared case-insensitively"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /patrons"
  - priority: 40
    category: business_constraint
    check: "revision_count < MAX_CREDENTIAL_REVISIONS (2) when resubmitting a CHANGES_REQUESTED request"
    error_id: ERR_MAX_REVISIONS_EXCEEDED
    http_status: 409
    applies_to: "POST /credential-requests/{id}/submit"
  - priority: 41
    category: business_referential
    check: "the purchasing patron is not the listing's seller"
    error_id: ERR_SELF_PURCHASE
    http_status: 422
    applies_to: "POST /resale-listings/{id}/purchase"

# =============================================================================
# §1.5 API Endpoint Table  (flat top-level collections; `{id}` is the resource id)
# =============================================================================
endpoints:
  # ---- logical clock (test-driving, /_ namespace) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, barcode epoch, lockout and validity window is evaluated against this clock."
    roles: [VenueAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects: ["no entity is mutated; subsequent reads of derived time-dependent values use the new clock"]

  # ---- Event ----
  - method: POST
    path: "/events"
    description: "Creates an Event in DRAFT."
    roles: [VenueAdmin]
    code: 201
    input: [name, venue_name, fire_code_capacity, barcode_anchor_at, doors_open_at, event_start_at, transfer_window_closes_at, "price_cap_regime?", "transfer_limit_per_ticket?"]
    output: Event
    side_effects: ["Event.status = DRAFT, live_occupancy = 0, entitlements_outstanding = 0, settlement_pool_cents = 0, version = 1"]
  - method: GET
    path: "/events/{id}"
    description: "Reads one Event including its computed occupancy and settlement fields."
    roles: [Patron, BoxOfficeAgent, TicketingApprover, GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: GET
    path: "/events"
    description: "Lists Events with pagination."
    roles: [Patron, BoxOfficeAgent, TicketingApprover, GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []
  - method: POST
    path: "/events/{id}/advance-status"
    description: "Advances the Event along its declared status chain."
    roles: [VenueAdmin]
    code: 200
    input: [target_status]
    output: Event
    side_effects: ["Event.status set to target_status per §1.2", "on CLOSED: every Gate of the event set to IDLE", "increments Event.version by 1"]
  - method: GET
    path: "/events/{id}/occupancy"
    description: "Computed read: real-time occupancy, reconciled attendance and gate clearance projection."
    roles: [GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: { event_id: string, live_occupancy: integer, peak_live_occupancy: integer, reconciled_attendance: integer, fire_code_capacity: integer, headroom: integer, projected_clearance_minutes: integer, zone_occupancy: array }
    side_effects: []
  - method: GET
    path: "/events/{id}/audit-log-entries"
    description: "Append-only audit trail for the event; newest first by occurred_at DESC, tie-break created_at DESC."
    roles: [SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["subject_type?", "subject_id?", "action?", "limit?", "offset?"]
    output: AuditLogEntry[]
    side_effects: []

  # ---- AccessZone ----
  - method: POST
    path: "/events/{id}/access-zones"
    description: "Creates an AccessZone under the event; only while Event.status == DRAFT."
    roles: [VenueAdmin]
    code: 201
    input: [zone_code, required_entitlement_level, fire_code_capacity, face_value_reference_cents, "credential_capacity?", "comp_discount_pct?"]
    output: AccessZone
    side_effects: ["AccessZone.posture = OPEN, occupancy_count = 0, issued_entitlement_count = 0"]
  - method: GET
    path: "/access-zones/{id}"
    description: "Reads one AccessZone including posture and occupancy."
    roles: [Patron, BoxOfficeAgent, TicketingApprover, GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: AccessZone
    side_effects: []
  - method: GET
    path: "/access-zones"
    description: "Lists AccessZones, filterable by event and posture."
    roles: [Patron, BoxOfficeAgent, TicketingApprover, GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["event_id?", "posture?", "required_entitlement_level?", "limit?", "offset?"]
    output: AccessZone[]
    side_effects: []

  # ---- Gate ----
  - method: POST
    path: "/events/{id}/gates"
    description: "Creates a Gate serving one AccessZone; only while Event.status == DRAFT."
    roles: [VenueAdmin]
    code: 201
    input: [gate_code, access_zone_id, throughput_per_minute, "lanes_open?"]
    output: Gate
    side_effects: ["Gate.status = IDLE, admitted_scan_count = 0, version = 1"]
  - method: GET
    path: "/gates/{id}"
    description: "Reads one Gate including status and version (the OCC input for opening a session)."
    roles: [GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: Gate
    side_effects: []
  - method: GET
    path: "/gates"
    description: "Lists Gates, filterable by event, zone and status."
    roles: [GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["event_id?", "access_zone_id?", "status?", "limit?", "offset?"]
    output: Gate[]
    side_effects: []

  # ---- Patron ----
  - method: POST
    path: "/patrons"
    description: "Registers a Patron account; identity_verified starts false."
    roles: [BoxOfficeAgent]
    code: 201
    input: [email, display_name]
    output: Patron
    side_effects: ["Patron.identity_verified = false, fraud_risk_score = 0, fraud_risk_basis = PROVISIONAL"]
  - method: GET
    path: "/patrons/{id}"
    description: "Reads one Patron including fraud score and credit balances."
    roles: [Patron, BoxOfficeAgent, TicketingApprover, GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: Patron
    side_effects: []
  - method: GET
    path: "/patrons"
    description: "Lists Patrons, filterable by email and verification state."
    roles: [BoxOfficeAgent, SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["email?", "identity_verified?", "limit?", "offset?"]
    output: Patron[]
    side_effects: []
  - method: POST
    path: "/patrons/{id}/verify-identity"
    description: "Records a government-ID check, flipping identity_verified to true."
    roles: [BoxOfficeAgent]
    code: 200
    input: [document_reference]
    output: Patron
    side_effects: ["Patron.identity_verified = true", "increments Patron.version by 1"]

  # ---- Ticket ----
  - method: POST
    path: "/tickets"
    description: "Issues a ticket directly (paid sale or manual will-call), minting its barcode_seed."
    roles: [BoxOfficeAgent]
    code: 201
    input: [event_id, access_zone_id, holder_patron_id, ticket_type, face_value_cents]
    output: Ticket
    side_effects:
      - "barcode_seed minted; lifecycle_status = ISSUED, admission_status = NOT_ADMITTED, device_binding_status = UNBOUND"
      - "AccessZone.issued_entitlement_count incremented by 1 and AccessZone.posture recomputed (calculations.zone_posture)"
      - "Event.entitlements_outstanding incremented by 1"
      - "for ticket_type == PAID: Event.settlement_pool_cents increased by face_value_cents"
  - method: GET
    path: "/tickets/{id}"
    description: "Reads one Ticket including barcode_seed, both status dimensions and version (the OCC input for listing)."
    roles: [Patron, BoxOfficeAgent, TicketingApprover, GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: Ticket
    side_effects: []
  - method: GET
    path: "/tickets"
    description: "Lists Tickets, filterable by event, zone, holder, originating credential request and either status dimension."
    roles: [Patron, BoxOfficeAgent, TicketingApprover, GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["event_id?", "access_zone_id?", "holder_patron_id?", "credential_request_id?", "lifecycle_status?", "admission_status?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []
  - method: GET
    path: "/tickets/{id}/barcode"
    description: "Computed read: the rotating barcode valid at the current logical clock (calculations.rotating_barcode_token)."
    roles: [Patron, BoxOfficeAgent, GateOperator, VenueAdmin]
    code: 200
    input: []
    output: { ticket_id: string, barcode_seed: string, barcode_epoch_index: integer, current_barcode: string, accepted_epoch_floor: integer }
    side_effects: []
  - method: POST
    path: "/tickets/{id}/device-binding"
    description: "Binds the holder's device to the ticket so that a screenshotted barcode alone cannot be admitted."
    roles: [Patron]
    code: 200
    input: [device_fingerprint]
    output: Ticket
    side_effects:
      - "Ticket.bound_device_fingerprint set, device_binding_status = BOUND"
      - "when the ticket already had device_binding_status IN {BOUND, RELEASED}: holder Patron.device_rebind_count incremented by 1 and Patron.fraud_risk_score recomputed (PROVISIONAL)"
      - "increments Ticket.version by 1"
  - method: POST
    path: "/tickets/{id}/device-binding/release"
    description: "Releases the current device binding, e.g. when the holder changes phones."
    roles: [Patron]
    code: 200
    input: []
    output: Ticket
    side_effects: ["Ticket.bound_device_fingerprint = null, device_binding_status = RELEASED", "increments Ticket.version by 1"]
  - method: POST
    path: "/tickets/{id}/void"
    description: "Voids an entitlement after a fraud finding, optionally refunding the holder from the settlement pool."
    roles: [SecurityInvestigator]
    code: 200
    input: [reason, refund_to_holder]
    output: Ticket
    side_effects:
      - "Ticket.lifecycle_status = VOIDED; admission_status untouched"
      - "any ResaleListing of this ticket with status == LISTED set to SUSPENDED"
      - "AccessZone.issued_entitlement_count decremented by 1, posture recomputed; Event.entitlements_outstanding decremented by 1"
      - "when refund_to_holder == true and ticket_type == PAID: Event.settlement_pool_cents decreased by face_value_cents and holder Patron.remediation_credit_cents increased by face_value_cents"
      - "AuditLogEntry appended (subject_type = TICKET, action = TICKET_VOIDED)"

  # ---- TransferRequest ----
  - method: POST
    path: "/transfer-requests"
    description: "Offers an entitlement to another patron."
    roles: [Patron]
    code: 201
    input: [ticket_id, to_patron_id]
    output: TransferRequest
    side_effects: ["TransferRequest.status = PENDING, from_patron_id = acting patron"]
  - method: GET
    path: "/transfer-requests/{id}"
    description: "Reads one TransferRequest."
    roles: [Patron, BoxOfficeAgent, SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []
  - method: GET
    path: "/transfer-requests"
    description: "Lists TransferRequests, filterable by ticket, sender, recipient and status."
    roles: [Patron, BoxOfficeAgent, SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["ticket_id?", "from_patron_id?", "to_patron_id?", "status?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []
  - method: POST
    path: "/transfer-requests/{id}/accept"
    description: "Recipient accepts the handover."
    roles: [Patron]
    code: 200
    input: []
    output: TransferRequest
    side_effects:
      - "TransferRequest.status = ACCEPTED, decided_at set"
      - "Ticket.holder_patron_id = to_patron_id, transfer_count incremented by 1, device binding released"
      - "every other PENDING TransferRequest on the same ticket set to DECLINED"
      - "increments Ticket.version by 1"
  - method: POST
    path: "/transfer-requests/{id}/decline"
    description: "Recipient or sender declines the handover."
    roles: [Patron]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["TransferRequest.status = DECLINED, decided_at set; ticket untouched"]

  # ---- ResaleListing ----
  - method: POST
    path: "/resale-listings"
    description: "Lists an entitlement on a verified resale marketplace under the event's price-cap regime."
    roles: [Patron]
    code: 201
    input: [ticket_id, ask_price_cents, marketplace, expected_ticket_version]
    output: ResaleListing
    side_effects:
      - "cap_price_cents computed (calculations.resale_price_cap); ResaleListing.status = LISTED"
      - "superseded_listing_id set to the most recent DELISTED or SUSPENDED listing on the same ticket, ordered by created_at DESC, null when none"
      - "Ticket.lifecycle_status = LISTED"
      - "increments Ticket.version by 1"
      - "AuditLogEntry appended (subject_type = RESALE_LISTING, action = RESALE_LISTED)"
  - method: GET
    path: "/resale-listings/{id}"
    description: "Reads one ResaleListing including cap and settlement components."
    roles: [Patron, BoxOfficeAgent, SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: ResaleListing
    side_effects: []
  - method: GET
    path: "/resale-listings"
    description: "Lists ResaleListings, filterable by ticket, seller, buyer, superseded predecessor and status."
    roles: [Patron, BoxOfficeAgent, SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["ticket_id?", "seller_patron_id?", "buyer_patron_id?", "superseded_listing_id?", "status?", "limit?", "offset?"]
    output: ResaleListing[]
    side_effects: []
  - method: POST
    path: "/resale-listings/{id}/purchase"
    description: "Buyer purchases a listed entitlement; settlement is split per calculations.resale_settlement_split."
    roles: [Patron]
    code: 200
    input: []
    output: ResaleListing
    side_effects:
      - "ResaleListing.status = SOLD, buyer_patron_id = acting patron, fee and payout components written"
      - "seller Patron.payout_balance_cents increased by seller_payout_cents; Event.settlement_pool_cents increased by venue_royalty_cents"
      - "Ticket.lifecycle_status = RESOLD, holder_patron_id = buyer, device binding released"
      - "AuditLogEntry appended (subject_type = RESALE_LISTING, action = RESALE_SOLD)"
  - method: POST
    path: "/resale-listings/{id}/delist"
    description: "Seller withdraws a listing."
    roles: [Patron]
    code: 200
    input: []
    output: ResaleListing
    side_effects: ["ResaleListing.status = DELISTED", "Ticket.lifecycle_status reverted to ISSUED", "increments Ticket.version by 1"]

  # ---- CredentialRequest ----
  - method: POST
    path: "/credential-requests"
    description: "Drafts a complimentary, will-call or back-of-house credential distribution."
    roles: [BoxOfficeAgent]
    code: 201
    input: [event_id, access_zone_id, recipient_patron_id, distribution_type, quantity, valid_from, valid_until, justification]
    output: CredentialRequest
    side_effects: ["CredentialRequest.status = DRAFT, revision_count = 0, issued_ticket_count = 0"]
  - method: GET
    path: "/credential-requests/{id}"
    description: "Reads one CredentialRequest including approval identities and forgone revenue."
    roles: [BoxOfficeAgent, TicketingApprover, SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: CredentialRequest
    side_effects: []
  - method: GET
    path: "/credential-requests"
    description: "Lists CredentialRequests, filterable by event, zone, recipient and status."
    roles: [BoxOfficeAgent, TicketingApprover, SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["event_id?", "access_zone_id?", "recipient_patron_id?", "status?", "distribution_type?", "limit?", "offset?"]
    output: CredentialRequest[]
    side_effects: []
  - method: POST
    path: "/credential-requests/{id}/submit"
    description: "Submits a DRAFT request, or resubmits one returned as CHANGES_REQUESTED (revision loop)."
    roles: [BoxOfficeAgent]
    code: 200
    input: []
    output: CredentialRequest
    side_effects:
      - "status = SUBMITTED; requested_by_user_id set to the acting X-User-ID"
      - "from CHANGES_REQUESTED: revision_count incremented by 1"
      - "AuditLogEntry appended (subject_type = CREDENTIAL_REQUEST, action = CREDENTIAL_REQUEST_SUBMITTED)"
  - method: POST
    path: "/credential-requests/{id}/request-changes"
    description: "Approver returns a submitted request for revision."
    roles: [TicketingApprover]
    code: 200
    input: [note]
    output: CredentialRequest
    side_effects: ["status = CHANGES_REQUESTED", "AuditLogEntry appended (action = CREDENTIAL_REQUEST_CHANGES_REQUESTED)"]
  - method: POST
    path: "/credential-requests/{id}/approve"
    description: "Approver approves the distribution, which auto-issues the entitlements."
    roles: [TicketingApprover]
    code: 200
    input: ["note?"]
    output: CredentialRequest
    side_effects:
      - "status = APPROVED, approved_by_user_id set; forgone_revenue_cents computed (calculations.credential_forgone_revenue)"
      - "cascade: quantity Tickets auto-issued to recipient_patron_id in the request's AccessZone, each with ticket_type = the request's distribution_type, face_value_cents = 0, credential_request_id set, lifecycle_status = ISSUED and device_binding_status = UNBOUND; Event.settlement_pool_cents is NOT increased because face_value_cents is 0"
      - "cascade: AccessZone.issued_entitlement_count and comp_forgone_cents updated, Event.entitlements_outstanding updated"
      - "cascade: AccessZone.posture recomputed (calculations.zone_posture)"
      - "AuditLogEntry appended (action = CREDENTIAL_REQUEST_APPROVED)"
  - method: POST
    path: "/credential-requests/{id}/reject"
    description: "Approver rejects the distribution."
    roles: [TicketingApprover]
    code: 200
    input: [note]
    output: CredentialRequest
    side_effects: ["status = REJECTED, approved_by_user_id set; no ticket issued", "AuditLogEntry appended (action = CREDENTIAL_REQUEST_REJECTED)"]

  # ---- ScanSession / ScanEvent ----
  - method: POST
    path: "/scan-sessions"
    description: "Opens a scanning session on a gate."
    roles: [GateOperator]
    code: 201
    input: [gate_id, operator_device_id, mode, expected_gate_version]
    output: ScanSession
    side_effects: ["ScanSession.status = OPEN, opened_at = logical clock", "Gate.status = SCANNING", "increments Gate.version by 1"]
  - method: GET
    path: "/scan-sessions/{id}"
    description: "Reads one ScanSession including its scan counters."
    roles: [GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: ScanSession
    side_effects: []
  - method: GET
    path: "/scan-sessions"
    description: "Lists ScanSessions, filterable by gate and status."
    roles: [GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["gate_id?", "status?", "mode?", "limit?", "offset?"]
    output: ScanSession[]
    side_effects: []
  - method: POST
    path: "/scan-sessions/{id}/scan-events"
    description: "Adjudicates one live gate scan. Returns 201 with the ScanEvent when the result is ADMITTED or EXIT_RECORDED; on a denial the ScanEvent is still persisted with the denial result and denied_reason_code, a DeniedEntryIncident is opened, and the mapped error_id is returned."
    roles: [GateOperator]
    code: 201
    input: [presented_barcode, device_fingerprint, direction, dedupe_key, "scanned_at?"]
    output: ScanEvent
    side_effects:
      - "ScanEvent persisted with source = ONLINE and recorded_at = logical clock"
      - "on ADMITTED: Ticket.admission_status = INSIDE, occupancy counters and Gate/session counters incremented"
      - "on EXIT_RECORDED: Ticket.admission_status = EXITED, occupancy counters decremented"
      - "on any DENIED_* result: DeniedEntryIncident opened, holder Patron.strike_count incremented, Patron.fraud_risk_score recomputed (PROVISIONAL), and any LISTED ResaleListing of that seller suspended when the recomputed score reaches 40"
  - method: POST
    path: "/scan-sessions/{id}/offline-batch"
    description: "Uploads a scanner's offline cache. Best-effort per item: each item is adjudicated independently, admitted items count toward reconciled attendance but NOT toward the live fire-code gate, and items duplicating an already-admitted ticket are persisted as DENIED_DUPLICATE. `scans` is a non-empty array of objects, each carrying exactly { presented_barcode, device_fingerprint, direction, dedupe_key, scanned_at } — scanned_at is MANDATORY per item and is the instant against which that item's barcode epoch (calculations.rotating_barcode_token) is evaluated, so a cache recorded before the uplink came back is still accepted. Items are adjudicated in ascending scanned_at order, tie-broken by their index in the array. Counter semantics are pinned: accepted_count counts items adjudicated ADMITTED or EXIT_RECORDED, duplicate_suppressed_count counts items adjudicated DENIED_DUPLICATE, denied_count counts EVERY non-admitted item including those duplicates (so accepted_count + denied_count always equals the number of items), scan_event_ids holds one id per item in adjudication order, and ScanSession.offline_uploaded_count counts every item persisted whatever its result."
    roles: [GateOperator]
    code: 200
    input: [scans]
    output: { accepted_count: integer, duplicate_suppressed_count: integer, denied_count: integer, scan_event_ids: array }
    side_effects:
      - "one ScanEvent per item with source = OFFLINE_BATCH, recorded_at = logical clock, scanned_at = the item's client time"
      - "ScanSession.status = SYNCING, offline_uploaded_count and duplicate_suppressed_count updated"
      - "admitted items set Ticket.admission_status = INSIDE and update Ticket.last_admitted_at, but leave Event.live_occupancy and AccessZone.occupancy_count unchanged (GATE_LIVE excludes OFFLINE_BATCH)"
      - "denied items open DeniedEntryIncidents exactly as online denials do"
  - method: POST
    path: "/scan-sessions/{id}/close"
    description: "Closes a scanning session."
    roles: [GateOperator]
    code: 200
    input: []
    output: ScanSession
    side_effects: ["ScanSession.status = CLOSED, closed_at = logical clock", "Gate.status = IDLE, Gate.last_session_closed_at set", "increments Gate.version by 1"]
  - method: GET
    path: "/scan-events/{id}"
    description: "Reads one immutable ScanEvent."
    roles: [GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: ScanEvent
    side_effects: []
  - method: GET
    path: "/scan-events"
    description: "Lists ScanEvents, filterable by session, ticket, result and source; ordered by recorded_at ASC, tie-break created_at ASC."
    roles: [GateOperator, SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["scan_session_id?", "ticket_id?", "result?", "source?", "direction?", "limit?", "offset?"]
    output: ScanEvent[]
    side_effects: []

  # ---- DeniedEntryIncident ----
  - method: GET
    path: "/denied-entry-incidents/{id}"
    description: "Reads one denied-entry incident."
    roles: [SecurityInvestigator, VenueAdmin, BoxOfficeAgent]
    code: 200
    input: []
    output: DeniedEntryIncident
    side_effects: []
  - method: GET
    path: "/denied-entry-incidents"
    description: "Lists incidents, filterable by scan event, ticket, patron, category and status."
    roles: [SecurityInvestigator, VenueAdmin, BoxOfficeAgent]
    code: 200
    input: ["scan_event_id?", "ticket_id?", "patron_id?", "category?", "status?", "limit?", "offset?"]
    output: DeniedEntryIncident[]
    side_effects: []
  - method: POST
    path: "/denied-entry-incidents/{id}/start-review"
    description: "Investigator takes ownership of an OPEN incident."
    roles: [SecurityInvestigator]
    code: 200
    input: []
    output: DeniedEntryIncident
    side_effects: ["status = UNDER_REVIEW, reviewer_user_id set to the acting X-User-ID"]
  - method: POST
    path: "/denied-entry-incidents/{id}/remediate"
    description: "Grants the patron goodwill remediation and closes the incident."
    roles: [SecurityInvestigator]
    code: 200
    input: [resolution_note]
    output: DeniedEntryIncident
    side_effects:
      - "status = REMEDIATED, remediation_credit_cents computed (calculations.denied_entry_remediation_credit)"
      - "holder Patron.remediation_credit_cents increased and Event.settlement_pool_cents decreased by the same amount"
      - "Patron.fraud_risk_score recomputed with the ADJUDICATED variant; fraud_risk_basis = ADJUDICATED"
      - "AuditLogEntry appended (action = DENIED_ENTRY_REMEDIATED)"
  - method: POST
    path: "/denied-entry-incidents/{id}/dismiss"
    description: "Closes the incident with no credit; withdraws the strike booked at creation."
    roles: [SecurityInvestigator]
    code: 200
    input: [resolution_note]
    output: DeniedEntryIncident
    side_effects:
      - "status = DISMISSED, remediation_credit_cents stays null"
      - "holder Patron.strike_count decremented by 1; fraud_risk_score recomputed with the ADJUDICATED variant (DISMISSED incidents excluded); fraud_risk_basis = ADJUDICATED"
      - "AuditLogEntry appended (action = DENIED_ENTRY_DISMISSED)"

  # ---- ReconciliationReport ----
  - method: POST
    path: "/events/{id}/reconciliation-reports"
    description: "Cuts a post-event reconciliation report against reported attendance."
    roles: [VenueAdmin]
    code: 201
    input: [reported_attendance, expected_event_version]
    output: ReconciliationReport
    side_effects:
      - "scan_derived_attendance, variance_count, variance_pct and fire_code_breach computed (calculations.reconciliation_variance)"
      - "status = DRAFT; increments Event.version by 1"
  - method: GET
    path: "/reconciliation-reports/{id}"
    description: "Reads one reconciliation report."
    roles: [SecurityInvestigator, VenueAdmin]
    code: 200
    input: []
    output: ReconciliationReport
    side_effects: []
  - method: GET
    path: "/reconciliation-reports"
    description: "Lists reconciliation reports, filterable by event and status."
    roles: [SecurityInvestigator, VenueAdmin]
    code: 200
    input: ["event_id?", "status?", "limit?", "offset?"]
    output: ReconciliationReport[]
    side_effects: []
  - method: POST
    path: "/reconciliation-reports/{id}/finalize"
    description: "Finalizes the report; refuses an out-of-tolerance variance unless override_reason is supplied."
    roles: [VenueAdmin]
    code: 200
    input: ["override_reason?"]
    output: ReconciliationReport
    side_effects:
      - "figures recomputed, status = FINAL, finalized_by_user_id set"
      - "Event.status = RECONCILED"
      - "AuditLogEntry appended (action = RECONCILIATION_FINALIZED)"
  - method: POST
    path: "/reconciliation-reports/{id}/reopen"
    description: "Reopens a finalized report for correction."
    roles: [VenueAdmin]
    code: 200
    input: [reason]
    output: ReconciliationReport
    side_effects: ["status = REOPENED, finalized_by_user_id = null", "Event.status returned to CLOSED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, enum value outside the declared set, integer outside its range, unparseable timestamp, or valid_until not strictly after valid_from"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "no Event with the given id"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "no AccessZone with the given id, in the path or in the body"
  - id: ERR_GATE_NOT_FOUND
    http: 404
    condition: "no Gate with the given id"
  - id: ERR_PATRON_NOT_FOUND
    http: 404
    condition: "no Patron with the given id, in the path or in the body"
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "no Ticket with the given id"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "no TransferRequest with the given id"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "no ResaleListing with the given id"
  - id: ERR_CREDENTIAL_REQUEST_NOT_FOUND
    http: 404
    condition: "no CredentialRequest with the given id"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "no ScanSession with the given id"
  - id: ERR_SCAN_EVENT_NOT_FOUND
    http: 404
    condition: "no ScanEvent with the given id"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "no DeniedEntryIncident with the given id"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "no ReconciliationReport with the given id"
  - id: ERR_CROSS_EVENT_REFERENCE
    http: 422
    condition: "referenced AccessZone or Gate belongs to a different Event than the resource being created or acted on"
  - id: ERR_NOT_TICKET_HOLDER
    http: 403
    condition: "acting Patron's X-User-ID is not the ownership field the operation requires (ticket holder, transfer recipient, or listing seller)"
  - id: ERR_STALE_TICKET_VERSION
    http: 412
    condition: "expected_ticket_version does not equal Ticket.version on POST /resale-listings"
  - id: ERR_STALE_GATE_VERSION
    http: 412
    condition: "expected_gate_version does not equal Gate.version on POST /scan-sessions"
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_event_version does not equal Event.version on POST /events/{id}/reconciliation-reports"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the trigger is not declared from the resource's current state in §1.2 (e.g. approving a DRAFT credential request, finalizing a FINAL report, closing a CLOSED session)"
  - id: ERR_TICKET_VOIDED
    http: 409
    condition: "the target Ticket has lifecycle_status == VOIDED"
  - id: ERR_SESSION_NOT_OPEN
    http: 409
    condition: "an online scan arrives at a SYNCING ScanSession whose Gate is still SCANNING (priority 15)"
  - id: ERR_SESSION_NOT_OFFLINE_CAPABLE
    http: 409
    condition: "offline batch uploaded to a session whose mode == ONLINE"
  - id: ERR_EVENT_STATE_FORBIDS_OPERATION
    http: 409
    condition: "Event.status does not permit the operation (issuance outside {ON_SALE, DOORS_OPEN}, scanning outside {DOORS_OPEN, IN_PROGRESS}, reconciliation outside {CLOSED, RECONCILED}, zone/gate creation outside DRAFT)"
  - id: ERR_EVENT_STATE_FORBIDS_TRANSFER
    http: 409
    condition: "transfer attempted at or after Event.transfer_window_closes_at, or with Event.status outside {ON_SALE, DOORS_OPEN}"
  - id: ERR_GATE_NOT_SCANNING
    http: 409
    condition: "the session's Gate has status == IDLE when a scan or offline upload arrives, which is the state a closed session leaves behind (priority 11)"
  - id: ERR_ZONE_FROZEN
    http: 409
    condition: "AccessZone.posture == FROZEN when a credential request is submitted or approved"
  - id: ERR_EVENT_ALREADY_RECONCILED
    http: 409
    condition: "a ReconciliationReport is cut for an Event whose status is RECONCILED or that already has a FINAL report"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approving or rejecting X-User-ID equals CredentialRequest.requested_by_user_id"
  - id: ERR_DUPLICATE_DEDUPE_KEY
    http: 409
    condition: "dedupe_key already used by another ScanEvent in the same ScanSession"
  - id: ERR_COUNTERFEIT_BARCODE
    http: 422
    condition: "the presented barcode's seed part matches no Ticket, or its epoch part is not an integer; a ScanEvent with result DENIED_COUNTERFEIT is persisted and a COUNTERFEIT incident opened, both with ticket_id null and no strike booked because no holder is identifiable"
  - id: ERR_BARCODE_EPOCH_INVALID
    http: 422
    condition: "the presented epoch index is above now_epoch or below now_epoch - 1 (screenshot replay); a ScanEvent with result DENIED_STALE_BARCODE is persisted"
  - id: ERR_DEVICE_MISMATCH
    http: 422
    condition: "the ticket is UNBOUND/RELEASED, or the presented device_fingerprint differs from Ticket.bound_device_fingerprint; a ScanEvent with result DENIED_DEVICE_MISMATCH is persisted and a DEVICE_MISMATCH incident opened"
  - id: ERR_DUPLICATE_SCAN
    http: 409
    condition: "an IN scan arrives for a ticket whose admission_status is already INSIDE; a ScanEvent with result DENIED_DUPLICATE is persisted and a DUPLICATE incident opened"
  - id: ERR_REENTRY_LOCKOUT
    http: 409
    condition: "an IN scan arrives for an EXITED ticket while the logical clock is still inside [last_exited_at, last_exited_at + 120s] (inclusive at both ends)"
  - id: ERR_ZONE_NOT_ENTITLED
    http: 403
    condition: "Gate.access_zone_id differs from Ticket.access_zone_id, or a non-CREDENTIAL ticket is presented at a BACK_OF_HOUSE zone; a ScanEvent with result DENIED_ZONE is persisted and a ZONE_VIOLATION incident opened"
  - id: ERR_ZONE_CAPACITY_FULL
    http: 409
    condition: "admitting the scan would push AccessZone.occupancy_count above AccessZone.fire_code_capacity; a ScanEvent with result DENIED_CAPACITY is persisted"
  - id: ERR_EVENT_FIRE_CODE_FULL
    http: 409
    condition: "admitting the scan would push Event.live_occupancy above Event.fire_code_capacity while the zone still has headroom"
  - id: ERR_PATRON_FRAUD_BLOCKED
    http: 403
    condition: "the acting patron's fraud_risk_score is >= 40 when listing for resale or creating a transfer"
  - id: ERR_GATE_SESSION_OVERLAP
    http: 409
    condition: "the logical clock falls inside the half-open interval [opened_at, closed_at) of an existing ScanSession on that gate, an OPEN or SYNCING session counting as unbounded above; this, not ERR_INVALID_STATE, is the answer when the gate is already SCANNING"
  - id: ERR_TRANSFER_LIMIT_EXCEEDED
    http: 409
    condition: "Ticket.transfer_count has already reached Event.transfer_limit_per_ticket"
  - id: ERR_ZONE_CREDENTIAL_WINDOW_CAPACITY
    http: 409
    condition: "approving a CREDENTIAL request would push the summed quantity of window-overlapping APPROVED requests above AccessZone.credential_capacity"
  - id: ERR_RECIPIENT_NOT_VERIFIED
    http: 422
    condition: "the transfer recipient or resale buyer has identity_verified == false"
  - id: ERR_TICKET_NOT_TRANSFERABLE
    http: 422
    condition: "a COMP or CREDENTIAL ticket is offered for transfer or listed for resale"
  - id: ERR_MARKETPLACE_NOT_VERIFIED
    http: 422
    condition: "marketplace == UNVERIFIED on POST /resale-listings; no listing row is created but an UNAUTHORIZED_RESALE DeniedEntryIncident is opened against the acting seller and a strike is booked (priority 34)"
  - id: ERR_PRICE_CAP_EXCEEDED
    http: 422
    condition: "ask_price_cents is strictly greater than the cap from calculations.resale_price_cap"
  - id: ERR_SETTLEMENT_POOL_INSUFFICIENT
    http: 409
    condition: "Event.settlement_pool_cents is below the remediation credit being granted"
  - id: ERR_ATTENDANCE_VARIANCE_UNRESOLVED
    http: 409
    condition: "abs(variance_pct) exceeds 2.00 at finalization and no override_reason was supplied"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "zone_code or gate_code already used within the same Event"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Patron.email already registered, compared case-insensitively"
  - id: ERR_MAX_REVISIONS_EXCEEDED
    http: 409
    condition: "a CHANGES_REQUESTED credential request is resubmitted when revision_count has already reached 2"
  - id: ERR_SELF_PURCHASE
    http: 422
    condition: "the purchasing patron is the listing's seller"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: Patron
    description: "Ticket holder acting on their own entitlements: device binding, transfers, resale listing and purchase."
    identity: "entity_backed:Patron"
    exclusive_operations:
      - "POST /tickets/{id}/device-binding"
      - "POST /tickets/{id}/device-binding/release"
      - "POST /transfer-requests"
      - "POST /transfer-requests/{id}/accept"
      - "POST /transfer-requests/{id}/decline"
      - "POST /resale-listings"
      - "POST /resale-listings/{id}/purchase"
      - "POST /resale-listings/{id}/delist"
    shared_operations:
      - "GET /events, GET /events/{id}, GET /tickets, GET /tickets/{id}, GET /tickets/{id}/barcode"
      - "GET /patrons/{id}, GET /access-zones, GET /access-zones/{id}"
      - "GET /transfer-requests, GET /transfer-requests/{id}, GET /resale-listings, GET /resale-listings/{id}"
  - name: BoxOfficeAgent
    description: "Box office staff: registers patrons, verifies identity, issues tickets, drafts and submits credential/comp/will-call distributions."
    identity: opaque
    exclusive_operations:
      - "POST /patrons"
      - "POST /patrons/{id}/verify-identity"
      - "POST /tickets"
      - "POST /credential-requests"
      - "POST /credential-requests/{id}/submit"
    shared_operations:
      - "GET /patrons, GET /patrons/{id}, GET /tickets, GET /tickets/{id}, GET /tickets/{id}/barcode"
      - "GET /credential-requests, GET /credential-requests/{id}"
      - "GET /denied-entry-incidents, GET /denied-entry-incidents/{id}"
  - name: TicketingApprover
    description: "Approval authority for non-sale distributions; may never approve a request it submitted itself."
    identity: opaque
    exclusive_operations:
      - "POST /credential-requests/{id}/request-changes"
      - "POST /credential-requests/{id}/approve"
      - "POST /credential-requests/{id}/reject"
    shared_operations:
      - "GET /credential-requests, GET /credential-requests/{id}, GET /events/{id}, GET /access-zones/{id}, GET /tickets"
  - name: GateOperator
    description: "Gate staff: opens and closes scan sessions, records live scans, uploads offline caches."
    identity: opaque
    exclusive_operations:
      - "POST /scan-sessions"
      - "POST /scan-sessions/{id}/scan-events"
      - "POST /scan-sessions/{id}/offline-batch"
      - "POST /scan-sessions/{id}/close"
    shared_operations:
      - "GET /gates, GET /gates/{id}, GET /scan-sessions, GET /scan-sessions/{id}"
      - "GET /scan-events, GET /scan-events/{id}, GET /events/{id}/occupancy"
      - "GET /tickets, GET /tickets/{id}, GET /tickets/{id}/barcode"
  - name: SecurityInvestigator
    description: "Fraud investigation: adjudicates denied-entry incidents, remediates patrons, voids compromised entitlements."
    identity: opaque
    exclusive_operations:
      - "POST /tickets/{id}/void"
      - "POST /denied-entry-incidents/{id}/start-review"
      - "POST /denied-entry-incidents/{id}/remediate"
      - "POST /denied-entry-incidents/{id}/dismiss"
    shared_operations:
      - "GET /denied-entry-incidents, GET /denied-entry-incidents/{id}, GET /scan-events, GET /scan-events/{id}"
      - "GET /events/{id}/occupancy, GET /events/{id}/audit-log-entries"
      - "GET /patrons, GET /patrons/{id}, GET /tickets, GET /tickets/{id}, GET /reconciliation-reports"
  - name: VenueAdmin
    description: "Venue operations: configures events, zones and gates, advances event status, cuts and finalizes reconciliation reports, and owns the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /events"
      - "POST /events/{id}/access-zones"
      - "POST /events/{id}/gates"
      - "POST /events/{id}/advance-status"
      - "POST /events/{id}/reconciliation-reports"
      - "POST /reconciliation-reports/{id}/finalize"
      - "POST /reconciliation-reports/{id}/reopen"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on every collection declared in §1.5"
      - "GET /events/{id}/occupancy, GET /events/{id}/audit-log-entries"






