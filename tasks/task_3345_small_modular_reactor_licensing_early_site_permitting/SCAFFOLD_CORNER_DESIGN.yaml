  - section: errors
    instances:
      - name: stale_version_occ_on_withdraw
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[subscription-withdraw-stale-csa]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two sequential withdrawals: first succeeds and bumps CSA version; second carrying the stale expected version gets 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["DCA with CSA; two EXECUTED subscriptions u1, u2; client observed CSA version at creation"]
          setup_api_calls:
            - call: "POST /licensing/dcas"
              payload: { docket_number: "52-960", reactor_model: "SMR-1", target_power_mwt: 100, plant_net_capacity_mw: 100, source_term_fraction: 0.5, site_boundary_miles: 1.0 }
              as: DcaApplicant
              captures: { dca_id: $.data.id }
            - call: "POST /licensing/cost-share-agreements"
              payload: { dca_id: "${dca_id}", total_cost_usd: 500, gov_contribution_usd: 0 }
              as: DoeProgram
              captures: { csa_id: $.data.id, csa_v: $.data.version }
            - call: "POST /licensing/dcas/${dca_id}/subscriptions"
              payload: { utility_id: "u1", committed_mw: 10, price_per_mwh_usd: 50.0 }
              as: UtilityParticipant
              as_user_id: "u1"
              captures: { sub1: $.data.id }
            - call: "POST /licensing/dcas/${dca_id}/subscriptions"
              payload: { utility_id: "u2", committed_mw: 10, price_per_mwh_usd: 50.0 }
              as: UtilityParticipant
              as_user_id: "u2"
              captures: { sub2: $.data.id }
            - call: "POST /licensing/subscriptions/${sub1}/execute"
              payload: {}
              as: UtilityParticipant
              as_user_id: "u1"
            - call: "POST /licensing/subscriptions/${sub2}/execute"
              payload: {}
              as: UtilityParticipant
              as_user_id: "u2"
          trigger:
            - call: "POST /licensing/subscriptions/${sub1}/withdraw"
              payload: { expected_cost_share_agreement_version: "${csa_v}" }
              as: UtilityParticipant
              as_user_id: "u1"
            - call: "POST /licensing/subscriptions/${sub2}/withdraw"
              payload: { expected_cost_share_agreement_version: "${csa_v}" }
              as: UtilityParticipant
              as_user_id: "u2"
              captures: { err: $.data.error_id }
          assert:
            - "first withdraw succeeds (CSA version advanced)"
            - "second withdraw with stale version: err == ERR_STALE_VERSION (412)"
