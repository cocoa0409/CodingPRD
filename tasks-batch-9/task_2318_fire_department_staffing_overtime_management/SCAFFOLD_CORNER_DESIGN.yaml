# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
#
# Walked row-by-row against references/claim-extraction-guide.md. `section:`
# values and `claim_type:` values come only from that guide. Corners already
# asserted by a §1.8 instance are emitted as `excluded_because:` stubs.
#
# Fixture conventions match §1.8: the logical clock defaults to
# 2026-08-01T00:00:00Z, the rotation calendar puts platoon B on 2026-08-10,
# platoon C on 2026-08-11 and platoon D on 2026-08-12, and the Kelly slot on all
# three of those dates is 8, so members created with kelly_day_cycle_position in
# {1..4} are never on a Kelly day unless the corner deliberately puts them there.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: station_creation_returns_persisted_and_derived_budget_fields
        claim_type: Creation
        grounds:
          - entities.Station
          - endpoints["POST /fire-ops/stations"]
        distinguishing_aspect: "POST with all six required fields returns 201 with every input echoed and the derived ledger fields initialised to 0 / WITHIN."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 60", battalion_code: "D1", minimum_staffing_floor: 3, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st60: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Station.${st60}.name == \"Station 60\", battalion_code == \"D1\", minimum_staffing_floor == 3, fiscal_ot_budget_cents == 500000"
            - "Station.${st60}.fiscal_period_start_date == \"2026-08-01\" and fiscal_period_end_date == \"2026-09-30\""
            - "Station.${st60}.ot_committed_cents == 0, ot_actual_cents == 0, budget_posture == \"WITHIN\""
            - "Station.${st60}.version == 1 and id is a non-empty string"

      - name: firefighter_retrieval_returns_stored_record
        claim_type: Retrieval
        grounds:
          - entities.Firefighter
          - endpoints["GET /fire-ops/firefighters/{firefighter_id}"]
        distinguishing_aspect: "GET /{id} returns exactly the member stored by the create call, including the ledger counters at their initial zero values."
        test_recipe:
          setup:
            - "One station and one member created with rate 4321 cents, platoon C, Kelly position 2, holding PARAMEDIC."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 61", battalion_code: "D1", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st61: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st61}", full_name: "P Prior", rank: "PARAMEDIC", platoon: "C", seniority_rank: 5, kelly_day_cycle_position: 2, certifications: ["PARAMEDIC"], hourly_rate_cents: 4321 }
              as: StaffingOfficer
              captures: { ff61: "$.data.id" }
          trigger:
            - call: "GET /fire-ops/firefighters/${ff61}"
              payload: {}
              as: CompanyOfficer
              as_user_id: "${ff61}"
          assert:
            - "HTTP 200 and data.id == ${ff61}"
            - "full_name == \"P Prior\", rank == \"PARAMEDIC\", platoon == \"C\", seniority_rank == 5, kelly_day_cycle_position == 2, hourly_rate_cents == 4321"
            - "certifications == [\"PARAMEDIC\"] and station_id == ${st61}"
            - "employment_status == \"ACTIVE\", roster_standing == \"AVAILABLE\", voluntary_ot_hours_charged == 0, mandatory_holdover_count == 0, callback_count == 0, ot_pass_count == 0, pending_offer_count == 0"

      - name: duty_shift_listing_paginates_and_reports_total_count
        claim_type: Listing
        grounds:
          - endpoints["GET /fire-ops/duty-shifts"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three shifts on one station, limit 2 returns 2 rows in shift_date ASC order with total_count 3 and has_more true; offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One station with three DRAFT shifts: 2026-08-10 (platoon B), 2026-08-11 (platoon C) and 2026-08-12 (platoon D), created out of chronological order."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 62", battalion_code: "D1", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st62: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st62}", shift_date: "2026-08-12", platoon: "D" }
              as: StaffingOfficer
              captures: { sh62c: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st62}", shift_date: "2026-08-10", platoon: "B" }
              as: StaffingOfficer
              captures: { sh62a: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st62}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh62b: "$.data.id" }
          trigger:
            - call: "GET /fire-ops/duty-shifts"
              payload: { station_id: "${st62}", limit: 2, offset: 0 }
              as: PayrollAnalyst
            - call: "GET /fire-ops/duty-shifts"
              payload: { station_id: "${st62}", limit: 2, offset: 2 }
              as: PayrollAnalyst
          assert:
            - "FIRST PAGE: HTTP 200, response_type == \"array\", 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "FIRST PAGE: data[0].id == ${sh62a} and data[1].id == ${sh62b} — shift_date ASC, not creation order"
            - "SECOND PAGE: 1 row, data[0].id == ${sh62c}, total_count == 3, has_more == false, offset == 2"

      - name: get_firefighter_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_FIREFIGHTER_NOT_FOUND]
          - endpoints["GET /fire-ops/firefighters/{firefighter_id}"]
        distinguishing_aspect: "A syntactically valid but unknown member id returns ERR_FIREFIGHTER_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "One station exists so the database is non-empty, but no member with the probed id was ever created."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 63", battalion_code: "D1", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st63: "$.data.id" }
          trigger:
            - call: "GET /fire-ops/firefighters/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StaffingOfficer
              captures: { err63: "$.data.error_id" }
          assert:
            - "HTTP 404 and error_id == \"ERR_FIREFIGHTER_NOT_FOUND\""
            - "response_type == \"error\" and data.message is a non-empty string"

      - name: apparatus_create_missing_required_minimum_crew_size_rejected
        claim_type: Required Fields
        grounds:
          - entities.Apparatus.fields.minimum_crew_size
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /fire-ops/apparatus"]
        distinguishing_aspect: "minimum_crew_size has source input and no default, so omitting it returns ERR_INVALID_REQUEST (400) and no Apparatus row is created."
        test_recipe:
          setup:
            - "One station exists to satisfy the FK."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 64", battalion_code: "D2", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st64: "$.data.id" }
          trigger:
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st64}", unit_designation: "ENGINE-64", apparatus_type: "ENGINE", required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { err64: "$.data.error_id" }
          assert:
            - "HTTP 400 and error_id == \"ERR_INVALID_REQUEST\""
            - "GET /fire-ops/apparatus?station_id=${st64} returns total_count == 0"

      - name: apparatus_create_applies_closure_exempt_and_status_defaults
        claim_type: Defaults
        grounds:
          - entities.Apparatus.fields.closure_exempt
          - entities.Apparatus.fields.status
          - endpoints["POST /fire-ops/apparatus"]
        distinguishing_aspect: "Omitting the two optional inputs yields closure_exempt false and status IN_SERVICE, and an explicitly supplied status OUT_OF_SERVICE is honoured on a second company."
        test_recipe:
          setup:
            - "One station exists."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 65", battalion_code: "D2", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st65: "$.data.id" }
          trigger:
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st65}", unit_designation: "ENGINE-65", apparatus_type: "ENGINE", minimum_crew_size: 3, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng65: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st65}", unit_designation: "MEDIC-65", apparatus_type: "MEDIC", minimum_crew_size: 2, required_certifications: ["PARAMEDIC"], closure_priority: 40, closure_exempt: true, status: "OUT_OF_SERVICE" }
              as: StaffingOfficer
              captures: { med65: "$.data.id" }
          assert:
            - "Apparatus.${eng65}.closure_exempt == false and Apparatus.${eng65}.status == \"IN_SERVICE\""
            - "Apparatus.${med65}.closure_exempt == true and Apparatus.${med65}.status == \"OUT_OF_SERVICE\""
            - "Apparatus.${med65}.required_certifications == [\"PARAMEDIC\"] and closure_priority == 40"

      - name: duty_shift_computed_staffing_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - calculations.required_staffing
          - calculations.leave_floor_headcount
          - entities.DutyShift.fields.required_staffing
          - endpoints["POST /fire-ops/duty-shifts"]
        distinguishing_aspect: "required_staffing is derived from the station's IN_SERVICE companies (5 + 2 = 7) and leave_floor_headcount from max(floor, 7 - 2) == 5; a client-supplied required_staffing of 1 in the payload is ignored because it is not a declared input."
        test_recipe:
          setup:
            - "Station 66 with minimum_staffing_floor 2 and three companies: ENGINE-66 (crew 5, IN_SERVICE), MEDIC-66 (crew 2, IN_SERVICE) and TRUCK-66 (crew 4, created OUT_OF_SERVICE so it must not count)."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 66", battalion_code: "D2", minimum_staffing_floor: 2, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st66: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st66}", unit_designation: "ENGINE-66", apparatus_type: "ENGINE", minimum_crew_size: 5, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng66: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st66}", unit_designation: "MEDIC-66", apparatus_type: "MEDIC", minimum_crew_size: 2, required_certifications: [], closure_priority: 20 }
              as: StaffingOfficer
              captures: { med66: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st66}", unit_designation: "TRUCK-66", apparatus_type: "LADDER", minimum_crew_size: 4, required_certifications: [], closure_priority: 30, status: "OUT_OF_SERVICE" }
              as: StaffingOfficer
              captures: { trk66: "$.data.id" }
          trigger:
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st66}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh66: "$.data.id" }
          assert:
            - "DutyShift.${sh66}.required_staffing == 7 — the OUT_OF_SERVICE company contributes nothing"
            - "DutyShift.${sh66}.leave_floor_headcount == 5 (max(2, 7 - 2))"
            - "DutyShift.${sh66}.assigned_headcount == 0, staffing_gap == 7, certification_gap_count == 0, staffing_posture == \"CRITICAL\""
            - "DutyShift.${sh66}.status == \"DRAFT\", ops_run_index == 0, closed_apparatus_ids == [], open_vacancy_count == 0"

      - name: station_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Station.fields.ot_committed_cents
          - entities.Station.fields.budget_posture
          - endpoints["POST /fire-ops/stations"]
        distinguishing_aspect: "id, created_at, updated_at and version are generated server-side and a client-supplied id / ot_actual_cents in the payload is ignored, with the created station still starting at version 1 and ot_actual_cents 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 67", battalion_code: "D3", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st67: "$.data.id" }
          assert:
            - "Station.${st67}.id is server-generated and does not equal any client-supplied value"
            - "Station.${st67}.version == 1, created_at and updated_at are present ISO-8601 timestamps"
            - "Station.${st67}.ot_actual_cents == 0 and ot_committed_cents == 0 regardless of any client-supplied ledger value"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response envelope"

      - name: firefighter_create_invalid_platoon_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Firefighter.fields.platoon
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /fire-ops/firefighters"]
        distinguishing_aspect: "platoon is constrained to A|B|C|D and kelly_day_cycle_position to 1..8, so platoon \"E\" is rejected with ERR_INVALID_REQUEST and so is kelly_day_cycle_position 9."
        test_recipe:
          setup:
            - "One station exists."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 68", battalion_code: "D3", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st68: "$.data.id" }
          trigger:
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st68}", full_name: "Q Quist", rank: "FIREFIGHTER", platoon: "E", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { err68a: "$.data.error_id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st68}", full_name: "R Reyes", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 9, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { err68b: "$.data.error_id" }
          assert:
            - "BOTH calls: HTTP 400 and error_id == \"ERR_INVALID_REQUEST\""
            - "GET /fire-ops/firefighters?station_id=${st68} returns total_count == 0"

      - name: apparatus_create_with_unknown_station_returns_station_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Apparatus.fields.station_id
          - errors[ERR_STATION_NOT_FOUND]
          - endpoints["POST /fire-ops/apparatus"]
        distinguishing_aspect: "The station_id FK is resolved before any field validation completes, so an unknown station id returns ERR_STATION_NOT_FOUND (404) rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A real station exists but is not the one referenced by the request."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 69", battalion_code: "D3", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st69: "$.data.id" }
          trigger:
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "00000000-0000-4000-8000-000000000001", unit_designation: "ENGINE-69", apparatus_type: "ENGINE", minimum_crew_size: 2, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { err69: "$.data.error_id" }
          assert:
            - "HTTP 404 and error_id == \"ERR_STATION_NOT_FOUND\""
            - "GET /fire-ops/apparatus?station_id=${st69} returns total_count == 0"

      - name: self_referential_and_polymorphic_reference_filters_resolve
        claim_type: cross_reference_integrity
        grounds:
          - entities.Firefighter.fields.acting_supervisor_id
          - entities.Vacancy.fields.driver_source_id
          - endpoints["GET /fire-ops/firefighters"]
          - endpoints["GET /fire-ops/vacancies"]
        distinguishing_aspect: "In this flat topology the self-referential acting_supervisor_id link and the polymorphic driver_source_id reference are both queryable: filtering members by supervisor returns exactly the one subordinate, and filtering vacancies by the approved leave request's id returns exactly its backfill vacancy."
        test_recipe:
          setup:
            - "Station 70 with staffing floor 1 and one company ENGINE-70 (crew 2, no required certifications)."
            - "ff70sup is the captain; ff70a is created with acting_supervisor_id = ff70sup; ff70b is created without a supervisor."
            - "The 2026-08-11 shift is published and both ff70a and ff70b hold REGULAR seats, so the shift is STAFFED."
            - "ff70a's VACATION leave was adjudicated APPROVED, minting a LEAVE-driver vacancy whose driver_source_id is the leave request id."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 70", battalion_code: "D4", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 900000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st70: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st70}", unit_designation: "ENGINE-70", apparatus_type: "ENGINE", minimum_crew_size: 2, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng70: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st70}", full_name: "S Silva", rank: "CAPTAIN", platoon: "C", seniority_rank: 9, kelly_day_cycle_position: 3, certifications: [], hourly_rate_cents: 5000 }
              as: StaffingOfficer
              captures: { ff70sup: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st70}", full_name: "T Tobin", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000, acting_supervisor_id: "${ff70sup}" }
              as: StaffingOfficer
              captures: { ff70a: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st70}", full_name: "U Uribe", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 2, kelly_day_cycle_position: 2, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff70b: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st70}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh70: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh70}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh70_v0: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh70}", firefighter_id: "${ff70a}", apparatus_id: "${eng70}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh70_v0}" }
              as: CompanyOfficer
              as_user_id: "${ff70sup}"
            - call: "GET /fire-ops/duty-shifts/${sh70}"
              payload: {}
              as: StaffingOfficer
              captures: { sh70_v1: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh70}", firefighter_id: "${ff70b}", apparatus_id: "${eng70}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh70_v1}" }
              as: CompanyOfficer
              as_user_id: "${ff70sup}"
            - call: "POST /fire-ops/leave-requests"
              payload: { firefighter_id: "${ff70a}", duty_shift_id: "${sh70}", leave_type: "VACATION", requested_hours: 24 }
              as: Firefighter
              as_user_id: "${ff70a}"
              captures: { lr70: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh70}/leave-adjudication"
              payload: {}
              as: CompanyOfficer
              as_user_id: "${ff70sup}"
          trigger:
            - call: "GET /fire-ops/firefighters"
              payload: { acting_supervisor_id: "${ff70sup}" }
              as: StaffingOfficer
            - call: "GET /fire-ops/vacancies"
              payload: { driver: "LEAVE", driver_source_id: "${lr70}" }
              as: StaffingOfficer
          assert:
            - "SUPERVISOR FILTER: total_count == 1 and data[0].id == ${ff70a}; ${ff70b} and ${ff70sup} are excluded"
            - "POLYMORPHIC FILTER: total_count == 1, data[0].driver == \"LEAVE\", data[0].driver_source_id == ${lr70}, data[0].duty_shift_id == ${sh70}, data[0].status == \"OPEN\""
            - "LeaveRequest.${lr70}.backfill_vacancy_id equals the id returned by the polymorphic filter"

      - name: every_supporting_collection_is_listable_and_the_vacancy_is_readable_by_id
        claim_type: Listing
        grounds:
          - endpoints["GET /fire-ops/hiring-rosters"]
          - endpoints["GET /fire-ops/overtime-offers"]
          - endpoints["GET /fire-ops/leave-requests"]
          - endpoints["GET /fire-ops/trade-requests"]
          - endpoints["GET /fire-ops/vacancies/{vacancy_id}"]
        distinguishing_aspect: "Each supporting collection answers a filtered list — rosters by station, offers by vacancy, leave by member — the empty trade-request collection returns total_count 0 rather than a 404, and the vacancy detail read exposes driver and filled_by_assignment_id that the list rows alone do not settle."
        test_recipe:
          setup:
            - "Station 135 with floor 1, budget 900000, one company ENGINE-135 (crew 2, no required certifications) and a VOLUNTARY_OT roster scoped NONE."
            - "Members ff135a (platoon C, Kelly 1, seniority 1, rate 4000) and ff135b (platoon C, Kelly 2, seniority 2, rate 4000); officer ff135o (Kelly 3)."
            - "The 2026-08-11 shift is published with two vacancies; ff135a takes a REGULAR seat (filling the first vacancy), a VOLUNTARY 24-hour offer is dispatched against the second vacancy (which the selector routes to ff135b, ff135a already being seated), and ff135a files a VACATION request that is left QUEUED. No trade is ever proposed."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 135", battalion_code: "G6", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 900000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-08-31" }
              as: StaffingOfficer
              captures: { st135: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st135}", unit_designation: "ENGINE-135", apparatus_type: "ENGINE", minimum_crew_size: 2, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng135: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st135}", full_name: "A Alcott", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff135a: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st135}", full_name: "B Brill", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 2, kelly_day_cycle_position: 2, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff135b: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st135}", full_name: "C Calder", rank: "CAPTAIN", platoon: "C", seniority_rank: 9, kelly_day_cycle_position: 3, certifications: [], hourly_rate_cents: 5000 }
              as: StaffingOfficer
              captures: { ff135o: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st135}", roster_type: "VOLUNTARY_OT", certification_scope: "NONE" }
              as: StaffingOfficer
              captures: { r135: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st135}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh135: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh135}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh135_v: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh135}", firefighter_id: "${ff135a}", apparatus_id: "${eng135}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh135_v}" }
              as: CompanyOfficer
              as_user_id: "${ff135o}"
              captures: { asg135: "$.data.id" }
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh135}", status: "OPEN" }
