# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_2887_fiber_route_engineering_permitting
# Section 1.9 breadth probe. Nine sections taken verbatim from
# references/claim-extraction-guide.md; claim_type values are the guide's
# per-section table rows. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN
# are emitted as excluded_because stubs citing the covering instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1 — entities
  # ===========================================================================
  - section: entities
    instances:
      - name: route_creation_returns_all_declared_fields_with_defaults
        claim_type: Creation
        grounds:
          - entities.Route
          - endpoints[POST /routes]
          - calculations.route_budget_ledger
        distinguishing_aspect: "POST /routes with the four required inputs returns 201 and every declared Route field, with budget_available_cents seeded to budget_authorized_cents and both complexity indexes null."
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
          trigger:
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
          assert:
            - "response HTTP status is 201 and response_type == object"
            - "Route.${route_id}.name == Harbor Loop and topology_objective == RING_CLOSURE and target_in_service_date == 2027-03-01"
            - "Route.${route_id}.status == PLANNING and scope_locked_at == null"
            - "Route.${route_id}.budget_authorized_cents == 250000000 and budget_committed_cents == 0 and budget_available_cents == 250000000"
            - "Route.${route_id}.segment_count == 0 and design_total_length_feet == 0"
            - "Route.${route_id}.total_preliminary_cost_cents == 0 and total_bid_ready_cost_cents == 0"
            - "Route.${route_id}.planned_complexity_index == null and live_complexity_index == null"
            - "Route.${route_id}.id, created_at, updated_at and version are all present, version == 1"

      - name: route_detail_get_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints[GET /routes/{id}]
          - entities.Route
        distinguishing_aspect: "GET /routes/{id} returns the same field values POST /routes returned, with no version bump from the read."
        test_recipe:
          setup:
            - "one Route 'Harbor Loop' (RING_CLOSURE), budget_authorized_cents 250000000, created at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id, v_at_create: $.data.version }
          trigger:
            - call: "GET /routes/${route_id}"
              payload: {}
              as: PermitCoordinator
          assert:
            - "response HTTP status is 200 and response_type == object"
            - "Route.${route_id}.id == ${route_id}"
            - "Route.${route_id}.name == Harbor Loop and budget_available_cents == 250000000"
            - "Route.${route_id}.created_at == 2026-08-10T00:00:00Z"
            - "Route.${route_id}.version == ${v_at_create}, so a read does not bump the version"

      - name: route_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /routes]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three routes stored, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true, and limit 2 / offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "three Routes created in this order: 'Alpha Ring' (RING_CLOSURE), 'Bravo Spur' (SPUR), 'Charlie Ring' (RING_CLOSURE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Alpha Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 100000000 }
              as: RouteEngineer
              captures: { r1_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "Bravo Spur", topology_objective: "SPUR", target_in_service_date: "2027-04-01", budget_authorized_cents: 100000000 }
              as: RouteEngineer
              captures: { r2_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "Charlie Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-05-01", budget_authorized_cents: 100000000 }
              as: RouteEngineer
              captures: { r3_id: $.data.id }
          trigger:
            - call: "GET /routes"
              payload: { limit: 2, offset: 0 }
              as: NetworkRecordsAdmin
            - call: "GET /routes"
              payload: { limit: 2, offset: 2 }
              as: NetworkRecordsAdmin
            - call: "GET /routes"
              payload: { topology_objective: "SPUR" }
              as: NetworkRecordsAdmin
          assert:
            - "the first call returns HTTP 200, response_type == array, 2 rows, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second call returns 1 row, total_count == 3, offset == 2 and has_more == false"
            - "the third call returns exactly 1 row whose id == ${r2_id}, total_count == 1 and has_more == false"
            - "an unparameterised GET /routes returns 3 rows because the default limit is 10"

      - name: route_get_with_unknown_id_returns_route_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_ROUTE_NOT_FOUND]
          - endpoints[GET /routes/{id}]
        distinguishing_aspect: "A syntactically valid id that names no stored Route returns 404 ERR_ROUTE_NOT_FOUND, not 400 and not an empty 200."
        test_recipe:
          setup:
            - "empty database except one unrelated Route, so the collection itself is non-empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
          trigger:
            - call: "GET /routes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RouteEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status is 404, response_type == error and $.data.error_id == ERR_ROUTE_NOT_FOUND"
            - "$.data.message is a non-empty string"
            - "GET /routes still returns 1 row, so nothing was created by the failed read"

      - name: segment_create_missing_terrain_class_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /segments]
          - entities.RouteSegment.fields.terrain_class
        distinguishing_aspect: "Omitting the required input terrain_class returns 400 ERR_INVALID_REQUEST and creates no RouteSegment, leaving Route.segment_count at 0."
        test_recipe:
          setup:
            - "one Route 'Harbor Loop' in PLANNING with segment_count 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status is 400 and $.data.error_id == ERR_INVALID_REQUEST"
            - "GET /routes/${route_id}/segments returns 0 rows"
            - "Route.${route_id}.segment_count == 0 and design_total_length_feet == 0"
            - "each of route_id, sequence_index, street_name, municipality_code, length_feet, planned_work_start_on and planned_work_end_on omitted in turn produces the same 400 ERR_INVALID_REQUEST"

      - name: walkout_create_omitting_optional_inputs_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.FieldWalkout.fields.obstruction_count
          - entities.FieldWalkout.fields.conduit_available_confirmed
          - entities.FieldWalkout.fields.surveyor_note
          - endpoints[POST /walkouts]
        distinguishing_aspect: "Omitting obstruction_count, conduit_available_confirmed and surveyor_note yields 0, false and null respectively, and status OPEN with review_round 0."
        test_recipe:
          setup:
            - "one Route in PLANNING with one RouteSegment (sequence_index 1, 400 feet, URBAN_PAVED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
          assert:
            - "response HTTP status is 201"
            - "FieldWalkout.${wo_id}.obstruction_count == 0"
            - "FieldWalkout.${wo_id}.conduit_available_confirmed == false"
            - "FieldWalkout.${wo_id}.surveyor_note == null"
            - "FieldWalkout.${wo_id}.status == OPEN and review_round == 0 and reviewed_by_user_id == null and rejection_reason == null"
            - "FieldWalkout.${wo_id}.worst_pole_condition_grade == NONE and make_ready_flagged_pole_count == 0"
            - "the segment created without existing_conduit_available carries the declared default false"

      - name: segment_computed_fields_are_derived_and_a_client_supplied_value_is_rejected
        claim_type: Computed Fields
        grounds:
          - entities.RouteSegment.fields.required_authority_type
          - entities.RouteSegment.fields.preliminary_cost_cents
          - calculations.route_permitting_complexity_index.constants.AUTHORITY_BY_TERRAIN
          - validations[priority=3]
        distinguishing_aspect: "required_authority_type is derived from terrain_class (RAIL_CROSSING implies RAILROAD) and sending it in the request body is refused as an unknown field with 400."
        test_recipe:
          setup:
            - "one Route 'Harbor Loop' in PLANNING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Rail Yard Cut", municipality_code: "MUN-014", length_feet: 600, terrain_class: "RAIL_CROSSING", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20", required_authority_type: "MUNICIPAL_ROW" }
              as: RouteEngineer
              captures: { err: $.data.error_id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Rail Yard Cut", municipality_code: "MUN-014", length_feet: 600, terrain_class: "RAIL_CROSSING", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
          assert:
            - "the first call returns HTTP 400 with $.data.error_id == ERR_INVALID_REQUEST because required_authority_type is not a declared input"
            - "the second call returns HTTP 201 with RouteSegment.${seg_id}.required_authority_type == RAILROAD, derived from terrain_class RAIL_CROSSING"
            - "RouteSegment.${seg_id}.moratorium_class == NONE and restoration_cost_cents == 0 and accepted_obstruction_count == 0"
            - "RouteSegment.${seg_id}.preliminary_cost_cents == null and bid_ready_cost_cents == null, because no construction method has been selected yet"

      - name: route_system_fields_are_server_minted_and_a_status_input_is_rejected
        claim_type: System Fields
        grounds:
          - entities.Route.fields.status
          - entities.Route.fields.scope_locked_at
          - validations[priority=3]
          - response_envelope.success
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server and status is system-owned: a body carrying status is refused with 400, while a clean create returns status PLANNING."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
          trigger:
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000, status: "CONSTRUCTION_READY" }
              as: RouteEngineer
              captures: { err: $.data.error_id }
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
          assert:
            - "the first call returns HTTP 400 with $.data.error_id == ERR_INVALID_REQUEST"
            - "the second call returns HTTP 201 with Route.${route_id}.status == PLANNING"
            - "Route.${route_id}.created_at == 2026-08-10T00:00:00Z and updated_at == 2026-08-10T00:00:00Z, both taken from the logical clock at whole-second precision with a trailing Z"
            - "Route.${route_id}.version == 1 and Route.${route_id}.id is a non-empty server-minted string"
            - "meta.api_request_id and meta.api_request_timestamp are present on both responses"

      - name: segment_create_with_out_of_set_enum_or_reversed_dates_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.RouteSegment.fields.terrain_class
          - entities.RouteSegment.fields.planned_work_end_on
        distinguishing_aspect: "Three distinct shape faults on the same endpoint all collapse to 400 ERR_INVALID_REQUEST: an enum outside the declared set, planned_work_end_on before planned_work_start_on, and a pagination limit of 0."
        test_recipe:
          setup:
            - "one Route 'Harbor Loop' in PLANNING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "SWAMP_CROSSING", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { err: $.data.error_id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-20", planned_work_end_on: "2026-09-15" }
              as: RouteEngineer
            - call: "GET /routes"
              payload: { limit: 0 }
              as: RouteEngineer
          assert:
            - "the SWAMP_CROSSING call returns HTTP 400 with $.data.error_id == ERR_INVALID_REQUEST"
            - "the reversed-date call returns HTTP 400 with $.data.error_id == ERR_INVALID_REQUEST because planned_work_end_on >= planned_work_start_on is a declared ordering constraint"
            - "the limit 0 call returns HTTP 400 with $.data.error_id == ERR_INVALID_REQUEST because the declared minimum limit is 1"
            - "GET /routes/${route_id}/segments returns 0 rows after all three failures"

      - name: pole_observation_is_immutable_and_exposes_no_version_field
        claim_type: Immutability
        grounds:
          - entities.PoleObservation
          - endpoints[POST /pole-observations]
          - endpoints[GET /walkouts/{id}/pole-observations]
        distinguishing_aspect: "PoleObservation is declared common_fields false: the response carries no version, created_at or updated_at, no update or delete endpoint exists for it, and requires_make_ready is derived from condition_grade D."
        test_recipe:
          setup:
            - "one Route in PLANNING with one RouteSegment and one OPEN FieldWalkout on it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "ELECTRIC_UTILITY", condition_grade: "D", available_vertical_clearance_in: 38, existing_attachment_count: 4 }
              as: FieldSurveyor
          assert:
            - "response HTTP status is 201 and the payload carries walkout_id, pole_tag, pole_owner, condition_grade, available_vertical_clearance_in, existing_attachment_count, requires_make_ready and id only"
            - "the response contains no version, no created_at and no updated_at field"
            - "PoleObservation.requires_make_ready == true, derived from condition_grade D"
            - "GET /walkouts/${wo_id}/pole-observations with requires_make_ready true returns exactly this 1 row"
            - "FieldWalkout.${wo_id}.worst_pole_condition_grade == D and make_ready_flagged_pole_count == 1"
            - "the §1.5 endpoint surface declares no PATCH, PUT or DELETE for /pole-observations"

      - name: walkout_create_with_unknown_segment_id_returns_segment_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_SEGMENT_NOT_FOUND]
          - entities.FieldWalkout.fields.segment_id
        distinguishing_aspect: "A body foreign key that names no stored RouteSegment returns 404 ERR_SEGMENT_NOT_FOUND, distinct from the 400 returned when the key is absent altogether."
        test_recipe:
          setup:
            - "one Route in PLANNING with one RouteSegment, so the segment collection is non-empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /walkouts"
              payload: { segment_id: "00000000-0000-4000-8000-000000000000", walked_on: "2026-08-11" }
              as: FieldSurveyor
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status is 404 and $.data.error_id == ERR_SEGMENT_NOT_FOUND"
            - "GET /segments/${seg_id}/walkouts returns 0 rows"
            - "the same call with segment_id omitted returns 400 ERR_INVALID_REQUEST instead, because shape validation at priority 3 runs before body-FK existence at priority 5"

      - name: segment_predecessor_on_another_route_returns_predecessor_segment_mismatch
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_PREDECESSOR_SEGMENT_MISMATCH]
          - entities.RouteSegment.fields.predecessor_segment_id
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology's self-reference is checked for cross-reference integrity, not mere existence: a predecessor that exists but belongs to a different route returns 422 ERR_PREDECESSOR_SEGMENT_MISMATCH rather than 404."
        test_recipe:
          setup:
            - "Route A 'Harbor Loop' with one RouteSegment at sequence_index 1"
            - "Route B 'Inland Spur' with no segments yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_a_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "Inland Spur", topology_objective: "SPUR", target_in_service_date: "2027-06-01", budget_authorized_cents: 90000000 }
              as: RouteEngineer
              captures: { route_b_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_a_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_a1_id: $.data.id }
          trigger:
            - call: "POST /segments"
              payload: { route_id: "${route_b_id}", sequence_index: 2, street_name: "Mill Street", municipality_code: "MUN-022", length_feet: 300, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-10-05", planned_work_end_on: "2026-10-09", predecessor_segment_id: "${seg_a1_id}" }
              as: RouteEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status is 422 and $.data.error_id == ERR_PREDECESSOR_SEGMENT_MISMATCH"
            - "GET /routes/${route_b_id}/segments returns 0 rows and Route.${route_b_id}.segment_count == 0"
            - "a predecessor on the same route but with a HIGHER sequence_index than the new segment yields the same 422"
