    code: 200
    input: ["substation_id?", "asset_class?", "status?", "upstream_asset_id?", "limit?", "offset?"]
    output: "Asset[]"
    side_effects: []
  - method: GET
    path: "/assets/{id}"
    description: "Get one asset"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
