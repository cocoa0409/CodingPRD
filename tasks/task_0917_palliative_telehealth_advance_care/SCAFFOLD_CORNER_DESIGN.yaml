              captures: { he_v_before: $.data.version }
          trigger:
            - call: "POST /palliative/hospice-elections/${he_id}/periods"
              payload: { expected_election_version: "${he_v_before}", period_start: "2026-06-02T00:00:00Z" }
              as: HospiceMedicalDirector
              as_user_id: "u_hospice_md_1"
            - call: "POST /palliative/hospice-elections/${he_id}/periods"
