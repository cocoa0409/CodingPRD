          setup:
            - "Clock 2026-08-03. NA group, CLOUD_ARCH skill, one CONSULTANT-level consultant (cost 120.00) with a proficiency-4 ACTIVE assertion, one QUALIFIED INTERNAL demand at 250.00/250.00."
