              captures: { rc250: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath", allowed_revenue_code_values: ["0300"] }
              as: SystemAdmin
              captures: { dept_a: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Central Supply", cost_center_code: "CC-200", manager_user_id: "mgr_supply" }
              as: SystemAdmin
              captures: { dept_b: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept_a}", revenue_code_id: "${rc250}", cdm_number: "CDM-2001", description: "STERILE DRESSING KIT", code_type: "HCPCS", cost_basis_cents: 4000, medicare_rate_cents: 2000, market_p75_cents: 30000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { e_map: $.data.error_id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept_a}", revenue_code_id: "${rc250}", cdm_number: "CDM-2001", description: "STERILE DRESSING KIT", code_type: "HCPCS", code_value: "A4550", cost_basis_cents: 4000, medicare_rate_cents: 2000, market_p75_cents: 30000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
