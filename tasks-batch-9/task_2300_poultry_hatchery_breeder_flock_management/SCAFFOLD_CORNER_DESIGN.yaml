        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNIT_TYPE_MISMATCH
          - errors.ERR_UNIT_CAPACITY_EXCEEDED
          - validations.priority_31.ERR_NO_EGGS_LOADED
        distinguishing_aspect: "Three distinct machine-fit failures split across two endpoints: planning a setter load in a HATCHER unit is rejected at creation, starting a load with no ACTIVE item is rejected before any capacity arithmetic, and 10000 eggs in a 5000-egg setter is rejected only once the items exist."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; SETTER U1 has capacity 5000 and is SANITIZED, HATCHER U2 has capacity 20000; lot L1 holds 10000 settable eggs stored at 15.0 C."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 10500}, as: FlockManager, captures: {l1: "$.data.id"}}
            - {call: "POST /egg-lots/${l1}/grade", payload: {grade_a_count: 10000, cracked_count: 300, dirty_count: 150, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${l1}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {l1v: "$.data.version"}}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 5000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /incubation-units/${u1}/sanitize", payload: {}, as: IncubationOperator}
            - {call: "POST /incubation-units", payload: {code: "U2", unit_type: "HATCHER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u2: "$.data.id"}}
            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
          trigger:
            - {call: "POST /setter-loads", payload: {unit_id: "${u2}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {e1: "$.data.error_id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {s1: "$.data.id"}}
            - {call: "POST /setter-loads/${s1}/start", payload: {}, as: IncubationOperator, captures: {e2: "$.data.error_id"}}
            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${l1}", eggs_taken: 10000, expected_egg_lot_version: "${l1v}"}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/start", payload: {}, as: IncubationOperator, captures: {e3: "$.data.error_id"}}
          assert:
            - "First call: HTTP 422 ERR_UNIT_TYPE_MISMATCH - a HATCHER unit cannot host a setter load; no SetterLoad row is created"
            - "Second call: HTTP 201 with SetterLoad.${s1}.status == PLANNED"
            - "Third call: HTTP 422 ERR_NO_EGGS_LOADED; status stays PLANNED, set_at stays null, IncubationUnit.${u1}.occupancy_status stays FREE"
            - "Fourth call: HTTP 201, total_eggs_set == 10000"
            - "Fifth call: HTTP 422 ERR_UNIT_CAPACITY_EXCEEDED (10000 > 5000); status stays PLANNED and IncubationUnit.${u1} is still SANITIZED and FREE"
            - "EggLot.${l1}.status is still ALLOCATED with eggs_remaining 0: the failed start did not roll the draw back"

      - name: pagination_bounds_and_below_minimum_counts_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_7.ERR_INVALID_PAGINATION
          - validations.priority_8.ERR_NON_POSITIVE_COUNT
          - calculations.chick_allocation_waterfall.constants.BOX_SIZE
        distinguishing_aspect: "limit is bounded on BOTH sides ([1, 100]) so limit=0 and limit=101 are equally invalid, and priority 8 is a minimum check rather than a sign check: requested_chicks 50 is positive yet still rejected because it is below BOX_SIZE."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; farm FM1 exists and is CLEARED."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /grower-farms", payload: {code: "FM1", operator_user_id: "u_grower_1", capacity_chicks: 20000}, as: HatcheryManager, captures: {fm1: "$.data.id"}}
            - {call: "POST /grower-farms/${fm1}/clear", payload: {}, as: Veterinarian}
          trigger:
            - {call: "GET /egg-lots", payload: {limit: 0}, as: HatcheryManager, captures: {e1: "$.data.error_id"}}
            - {call: "GET /egg-lots", payload: {limit: 101}, as: HatcheryManager, captures: {e2: "$.data.error_id"}}
            - {call: "GET /placement-orders", payload: {offset: -1}, as: HatcheryManager, captures: {e3: "$.data.error_id"}}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm1}", requested_breed: "ROSS_308", requested_placement_date: "2026-08-22T00:00:00Z", requested_chicks: 50}, as: HatcheryManager, captures: {e4: "$.data.error_id"}}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm1}", requested_breed: "ROSS_308", requested_placement_date: "2026-08-22T00:00:00Z", requested_chicks: 100}, as: HatcheryManager}
          assert:
            - "limit=0: HTTP 400 data.error_id == ERR_INVALID_PAGINATION"
            - "limit=101: HTTP 400 data.error_id == ERR_INVALID_PAGINATION"
            - "offset=-1: HTTP 400 data.error_id == ERR_INVALID_PAGINATION"
            - "requested_chicks=50: HTTP 400 data.error_id == ERR_NON_POSITIVE_COUNT and no order row is created"
            - "requested_chicks=100 (exactly BOX_SIZE): HTTP 201 with status REQUESTED, allocated_chicks 0, remaining_need 100"

      - name: client_timestamps_outside_admissible_range_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_25.ERR_TIMESTAMP_OUT_OF_RANGE
          - entities.GrowerPlacementOrder.fields.requested_placement_date
          - entities.EggLot.fields.collected_at
        distinguishing_aspect: "The admissible range is direction-sensitive per field: collected_at and a lab sample's collected_at may not be in the FUTURE of the logical clock, while requested_placement_date may not be in the PAST - the same error code guards opposite directions."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; flock F1 is IN_LAY; farm FM1 is CLEARED."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /grower-farms", payload: {code: "FM1", operator_user_id: "u_grower_1", capacity_chicks: 20000}, as: HatcheryManager, captures: {fm1: "$.data.id"}}
            - {call: "POST /grower-farms/${fm1}/clear", payload: {}, as: Veterinarian}
          trigger:
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-08-02T00:00:00Z", collected_count: 500}, as: FlockManager, captures: {e1: "$.data.error_id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "MYCOPLASMA_GALLISEPTICUM", collected_at: "2026-08-01T18:00:00Z"}, as: Veterinarian, captures: {e2: "$.data.error_id"}}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm1}", requested_breed: "ROSS_308", requested_placement_date: "2026-07-31T00:00:00Z", requested_chicks: 5000}, as: HatcheryManager, captures: {e3: "$.data.error_id"}}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-08-01T12:00:00Z", collected_count: 500}, as: FlockManager}
          assert:
            - "Future collected_at on the egg lot: HTTP 422 data.error_id == ERR_TIMESTAMP_OUT_OF_RANGE and no lot is created"
            - "Future collected_at on the lab sample: HTTP 422 ERR_TIMESTAMP_OUT_OF_RANGE"
            - "Past requested_placement_date: HTTP 422 ERR_TIMESTAMP_OUT_OF_RANGE"
            - "collected_at exactly equal to the clock: HTTP 201 - the boundary instant is admissible"
            - "GET /egg-lots?flock_id=${f1} returns total_count 1"

      - name: breed_mismatch_and_retired_program_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_35.ERR_BREED_MISMATCH
          - validations.priority_20.ERR_PROGRAM_RETIRED
          - state_machines.FlockProgram.ACTIVE_to_RETIRED
        distinguishing_aspect: "A retired program blocks BOTH the flock that has not been created yet and photostimulation of a flock that was created while the program was still ACTIVE, and the breed agreement check fires against the program's breed before any of that."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z. Program P1 (ROSS_308) is ACTIVE; program P2 (ROSS_308) is ACTIVE; flock F1 was created against P2 and has a NEGATIVE clearance on file."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /flock-programs", payload: {code: "P2", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p2: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p2}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
          trigger:
            - {call: "POST /breeder-flocks", payload: {code: "F2", program_id: "${p1}", breed: "COBB_500", house_code: "H2", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {e1: "$.data.error_id"}}
            - {call: "POST /flock-programs/${p1}/retire", payload: {}, as: HatcheryManager}
            - {call: "POST /breeder-flocks", payload: {code: "F3", program_id: "${p1}", breed: "ROSS_308", house_code: "H3", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {e2: "$.data.error_id"}}
            - {call: "POST /flock-programs/${p2}/retire", payload: {}, as: HatcheryManager}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager, captures: {e3: "$.data.error_id"}}
          assert:
            - "First call: HTTP 422 data.error_id == ERR_BREED_MISMATCH (COBB_500 flock against a ROSS_308 program); no flock is created"
            - "Second call: HTTP 200 with FlockProgram.${p1}.status == RETIRED"
            - "Third call: HTTP 409 data.error_id == ERR_PROGRAM_RETIRED even though the breeds agree"
            - "Fifth call: HTTP 409 ERR_PROGRAM_RETIRED - the flock has clearance and is mature, but its program was retired after placement"
            - "BreederFlock.${f1}.status stays PLACED and settable_forecast is unchanged"

