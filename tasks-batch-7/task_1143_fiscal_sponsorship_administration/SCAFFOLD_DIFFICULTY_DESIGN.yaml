            - "st3 == ACTIVE (cycle completed: ACTIVE -> CLASSIFICATION_REVIEW -> VETTED -> ACTIVE)"

  - rule_id: transitive_cascade
    instances:
      - name: escalate_suspends_project_rejects_inflight_releases_funds
        grounds:
          - state_machines.ComplianceReview.FINDINGS_ISSUED_to_ESCALATED
          - state_machines.Project.ACTIVE_to_SUSPENDED
          - state_machines.DisbursementRequest.SUBMITTED_to_REJECTED
          - entities.FundAccount.fields.committed_cents
        distinguishing_aspect: |
          Depth-4 chain with trigger POST /compliance-reviews/{id}/escalate:
          review ESCALATED -> project SUSPENDED -> fund FROZEN and in-flight
          disbursement auto-REJECTED -> commitment released into fund totals and
          COMMITMENT_RELEASE ledger entry. Each hop is caused by the previous one.
        test_recipe:
          setup:
            - "COMPREHENSIVE project ACTIVE; received 300,000 (fee 24,000; available 276,000); disbursement 50,000 SUBMITTED (committed 50,000; available 226,000); review FINDINGS_ISSUED with 1 MEDIUM finding"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Kappa", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "k@x.org" }, as: Applicant, as_user_id: user_app_j, captures: { app_j: $.data.id } }
            - { call: "POST /fsa/applications/${app_j}/submit", payload: {}, as: Applicant, as_user_id: user_app_j }
            - { call: "POST /fsa/applications/${app_j}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_j}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_j: $.data.project_id, ag_j: $.data.agreement_id, f_j: $.data.fund_account_id } }
            - { call: "POST /fsa/agreements/${ag_j}/countersign", payload: {}, as: Applicant, as_user_id: user_app_j }
            - { call: "POST /fsa/projects/${p_j}/donations", payload: { amount_cents: 300000, donor_name: "D Ten", donor_email: "d10@x.org", payment_method: "ACH" }, as: Donor, as_user_id: user_donor_1, captures: { d_j1: $.data.id } }
            - { call: "POST /fsa/donations/${d_j1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p_j}/disbursement-requests", payload: { amount_cents: 50000, purpose: "supplies", payee_type: "VENDOR", payee_name: "SupplyCo", spend_date: "2026-06-05" }, as: ProjectLead, as_user_id: "${p_j}", captures: { dr_j: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr_j}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_j}" }
            - { call: "POST /fsa/projects/${p_j}/compliance-reviews", payload: { review_type: "TRIGGERED" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { rv_j: $.data.id } }
            - { call: "POST /fsa/compliance-reviews/${rv_j}/issue-findings", payload: { findings_count: 1, severity_max: "MEDIUM" }, as: ComplianceOfficer, as_user_id: user_co_1 }
          trigger:
            - { call: "POST /fsa/compliance-reviews/${rv_j}/escalate", payload: { reason: "unremediated fraud risk" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { rv_st: $.data.status } }
            - { call: "GET /fsa/projects/${p_j}", payload: {}, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_st: $.data.status, p_reason: $.data.suspension_reason } }
            - { call: "GET /fsa/fund-accounts/${f_j}", payload: {}, as: ComplianceOfficer, as_user_id: user_co_1, captures: { f_st: $.data.status, f_comm: $.data.committed_cents, f_avail: $.data.available_cents } }
            - { call: "GET /fsa/disbursement-requests/${dr_j}", payload: {}, as: ComplianceOfficer, as_user_id: user_co_1, captures: { dr_st: $.data.status, dr_ar: $.data.auto_reject_reason } }
            - { call: "GET /fsa/fund-ledger-entries", payload: { disbursement_id: "${dr_j}" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { le_type: "$.data[0].entry_type", le_amt: "$.data[0].amount_cents" } }
          assert:
            - "review ${rv_j}.status == ESCALATED"
            - "Project.${p_j}.status == SUSPENDED and suspension_reason == ESCALATED_REVIEW (hop 2)"
            - "FundAccount.${f_j}.status == FROZEN (hop 3a)"
            - "DisbursementRequest.${dr_j}.status == REJECTED and auto_reject_reason == SUSPENSION (hop 3b, caused by suspension — not by the escalate call directly)"
            - "fund committed_cents == 0 and available_cents == 276000 (hop 4: release caused by the auto-reject)"
            - "ledger entry for the disbursement: entry_type == COMMITMENT_RELEASE, amount_cents == 50000 (release is a credit against the hold)"

      - name: refund_approval_voids_receipt_and_debits_fund
        grounds:
          - state_machines.Donation.REFUND_REQUESTED_to_REFUNDED
          - state_machines.TaxReceipt.ISSUED_to_VOIDED
          - entities.FundAccount.fields.total_refunded_cents
        distinguishing_aspect: |
          Depth-2+ chain with a DIFFERENT trigger (decide-refund APPROVE, not
          escalate): refund posts to the fund -> linked ISSUED receipt is VOIDED
          because the refund posted -> fund totals and DONATION_REFUND_DEBIT
          ledger entry follow from the refund posting.
        test_recipe:
          setup:
            - "COMPREHENSIVE project ACTIVE; donation 100,000 RECEIVED (fee 8,000) and RECEIPTED; receipt FS-2026-000001 ISSUED"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Lambda", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "l@x.org" }, as: Applicant, as_user_id: user_app_k, captures: { app_k: $.data.id } }
            - { call: "POST /fsa/applications/${app_k}/submit", payload: {}, as: Applicant, as_user_id: user_app_k }
            - { call: "POST /fsa/applications/${app_k}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_k}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_k: $.data.project_id, ag_k: $.data.agreement_id, f_k: $.data.fund_account_id } }
            - { call: "POST /fsa/agreements/${ag_k}/countersign", payload: {}, as: Applicant, as_user_id: user_app_k }
            - { call: "POST /fsa/projects/${p_k}/donations", payload: { amount_cents: 100000, donor_name: "D Eleven", donor_email: "d11@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d_k1: $.data.id } }
            - { call: "POST /fsa/donations/${d_k1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/donations/${d_k1}/issue-receipt", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "GET /fsa/donations/${d_k1}/receipts", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { r_k1: "$.data[0].id" } }
          trigger:
            - { call: "POST /fsa/donations/${d_k1}/request-refund", payload: { amount_cents: 100000, reason: "donor remorse" }, as: Donor, as_user_id: user_donor_1 }
            - { call: "POST /fsa/donations/${d_k1}/decide-refund", payload: { decision: "APPROVE" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { d_st: $.data.status, d_ref: $.data.refunded_cents } }
            - { call: "GET /fsa/receipts/${r_k1}", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { r_st: $.data.status, r_vr: $.data.void_reason } }
            - { call: "GET /fsa/fund-accounts/${f_k}", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { f_ref: $.data.total_refunded_cents, f_avail: $.data.available_cents } }
          assert:
            - "Donation.${d_k1}.status == REFUNDED and refunded_cents == 100000"
            - "TaxReceipt.${r_k1}.status == VOIDED and void_reason == FULL_REFUND (hop 2, caused by the refund posting)"
            - "fund.total_refunded_cents == 100000 and available_cents == -8000 (100,000 - 100,000 - 8,000 fee retained until period close)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_state_error_beats_insufficient_funds
        grounds:
          - validations[priority=7]
          - validations[priority=25]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a submit on a SUSPENDED project
          whose amount also exceeds available must surface ERR_PROJECT_NOT_ACTIVE
          (priority 7), never ERR_INSUFFICIENT_FUNDS (priority 25).
        test_recipe:
          setup:
            - "COMPREHENSIVE project SUSPENDED; available 92,000; a DRAFT disbursement of 150,000 (over balance) exists"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Mu", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "m@x.org" }, as: Applicant, as_user_id: user_app_l, captures: { app_l: $.data.id } }
            - { call: "POST /fsa/applications/${app_l}/submit", payload: {}, as: Applicant, as_user_id: user_app_l }
            - { call: "POST /fsa/applications/${app_l}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_l}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_l: $.data.project_id, ag_l: $.data.agreement_id, f_l: $.data.fund_account_id } }
            - { call: "POST /fsa/agreements/${ag_l}/countersign", payload: {}, as: Applicant, as_user_id: user_app_l }
            - { call: "POST /fsa/projects/${p_l}/donations", payload: { amount_cents: 100000, donor_name: "D Twelve", donor_email: "d12@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d_l1: $.data.id } }
            - { call: "POST /fsa/donations/${d_l1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p_l}/suspend", payload: { reason: "audit hold" }, as: SponsorAdmin, as_user_id: user_sa_1 }
            - { call: "POST /fsa/projects/${p_l}/disbursement-requests", payload: { amount_cents: 150000, purpose: "over-balance spend", payee_type: "VENDOR", payee_name: "BigCo", spend_date: "2026-06-05" }, as: ProjectLead, as_user_id: "${p_l}", captures: { dr_l: $.data.id } }
          trigger:
            - { call: "POST /fsa/disbursement-requests/${dr_l}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_l}", captures: { e: $.data.error_id } }
          assert:
            - "error_id == ERR_PROJECT_NOT_ACTIVE (state priority 7 wins over fiscal priority 25)"
            - "DisbursementRequest.${dr_l}.status remains DRAFT; fund.committed_cents unchanged at 0"

      - name: employment_safety_error_beats_duplicate_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=14]
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint (different pair
          from state-vs-fiscal): creating an EMPLOYEE engagement under a
          PRE_APPROVED_GRANT agreement for a worker who already holds a PROPOSED
          engagement must surface ERR_MODEL_FORBIDS_EMPLOYMENT (priority 8),
          never ERR_DUPLICATE_ENGAGEMENT (priority 14).
        test_recipe:
          setup:
            - "PRE_APPROVED_GRANT project ACTIVE; worker dup@x.org already has a PROPOSED CONTRACTOR engagement"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Nu", mission_statement: "m", requested_model: "PRE_APPROVED_GRANT", budget_estimate_cents: 100000, contact_email: "n@x.org" }, as: Applicant, as_user_id: user_app_m, captures: { app_m: $.data.id } }
            - { call: "POST /fsa/applications/${app_m}/submit", payload: {}, as: Applicant, as_user_id: user_app_m }
            - { call: "POST /fsa/applications/${app_m}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_m}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "PRE_APPROVED_GRANT" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_m: $.data.project_id, ag_m: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_m}/countersign", payload: {}, as: Applicant, as_user_id: user_app_m }
            - { call: "POST /fsa/projects/${p_m}/staff-engagements", payload: { worker_name: "Dup", worker_email: "dup@x.org", engagement_type: "CONTRACTOR", compensation_type: "HOURLY", rate_cents: 5000, start_date: "2026-06-01", end_date: "2026-09-01" }, as: ProjectLead, as_user_id: "${p_m}" }
          trigger:
            - { call: "POST /fsa/projects/${p_m}/staff-engagements", payload: { worker_name: "Dup", worker_email: "dup@x.org", engagement_type: "EMPLOYEE", compensation_type: "SALARY", rate_cents: 500000, start_date: "2026-06-01" }, as: ProjectLead, as_user_id: "${p_m}", captures: { e: $.data.error_id } }
          assert:
            - "error_id == ERR_MODEL_FORBIDS_EMPLOYMENT (safety priority 8 wins over constraint priority 14)"

  - rule_id: boundary_precision_check
    instances:
      - name: mission_score_exactly_7000_advances
        grounds:
          - calculations.mission_alignment_score
          - validations[priority=13]
        distinguishing_aspect: |
          Boundary on the mission-score metric via the mission-score endpoint:
          exactly 70.00 ADVANCES (>= inclusive), 69.99 is rejected; the 70.00
          case only reaches the boundary because of the pinned per-component
          rounding (sum-first would give 69.99).
        test_recipe:
          setup:
            - "Two applications in SUBMITTED"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Xi", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "x@x.org" }, as: Applicant, as_user_id: user_app_n, captures: { app_n: $.data.id } }
            - { call: "POST /fsa/applications/${app_n}/submit", payload: {}, as: Applicant, as_user_id: user_app_n }
            - { call: "POST /fsa/applications", payload: { project_name: "Omicron", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "o@x.org" }, as: Applicant, as_user_id: user_app_o, captures: { app_o: $.data.id } }
            - { call: "POST /fsa/applications/${app_o}/submit", payload: {}, as: Applicant, as_user_id: user_app_o }
          trigger:
            - { call: "POST /fsa/applications/${app_n}/mission-score", payload: { purpose_pts: 50, benefit_pts: 61, capacity_pts: 95, risk_pts: 10, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1, captures: { ms_hi: $.data.mission_score, st_hi: $.data.status } }
            - { call: "POST /fsa/applications/${app_o}/mission-score", payload: { purpose_pts: 50, benefit_pts: 54, capacity_pts: 95, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1, captures: { e_lo: $.data.error_id } }
          assert:
            - "scorecard 50/61/95/10 -> mission_score == 70.00 exactly (16.75+16.17+20.43+16.65) and status == COMPLIANCE_REVIEW (>= 70.00 inclusive)"
            - "scorecard 50/54/95/0 -> error_id == ERR_MISSION_SCORE_BELOW_THRESHOLD at 69.99 (one component lower)"

      - name: contractor_ytd_exactly_60000_flags_1099
        grounds:
          - calculations.contractor_ytd_accumulation
          - entities.StaffEngagement.fields.requires_1099
