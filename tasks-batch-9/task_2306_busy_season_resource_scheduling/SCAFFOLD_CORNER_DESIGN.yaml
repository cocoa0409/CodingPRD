              as: FirmAdmin
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Mel Arbogast", level: "MANAGER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 260.00 }
              as: FirmAdmin
              captures: { m1_id: $.data.id }
          trigger:
