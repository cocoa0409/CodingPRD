  # ===========================================================================
  # Rule 9 — compensating_invariant (fleet count vs fuel volume)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserve_then_cancel_restores_available_pool
        grounds:
          - state_machines.EquipmentUnit.AVAILABLE_to_RESERVED
          - state_machines.EquipmentUnit.RESERVED_to_AVAILABLE
          - state_machines.RentalContract.QUOTED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = count of AVAILABLE fleet units: an EQUIPMENT
          line-add (reserve) followed by contract cancel (compensating release)
          returns the pool to its exact pre-pair count — a count-type
          invariant, distinct from the fuel-volume invariant.
        test_recipe:
          setup:
            - "Customer C1, Site S1 (TX-TCEQ); Units U1, U2 both AVAILABLE (available pool == 2)"
            - "Contract K1 QUOTED with U1 RESERVED via line L1"
          setup_api_calls:
