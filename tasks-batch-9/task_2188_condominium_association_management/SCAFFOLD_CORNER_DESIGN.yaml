        distinguishing_aspect: "With the default board_quorum_seats of 3, two seated directors in attendance is 409 ERR_BOARD_QUORUM_NOT_MET and quorum_met must remain false; only the count of SEATED attendees matters, so adding an unseated director does not fix it while adding a third seated one does."
