        grounds:
          - endpoints[GET /estates/{estate_id}/authority-resolution]
          - calculations.platform_authority_precedence
          - entities.AuthorityGrant.fields.granted_scope
        distinguishing_aspect: |
          GET /estates/{estate_id}/authority-resolution is a pure projection with no side effects: it
          re-resolves the precedence ladder on every call, so a later ONLINE_TOOL directive with scope
          NONE flips the projection to NONE/ONLINE_TOOL while the already-approved request and its
          AuthorityGrant keep the CATALOG_AND_CONTENT/WILL_PROVISION values frozen at APPROVE, and the
          asset keeps CONTENT_DISCLOSED.
