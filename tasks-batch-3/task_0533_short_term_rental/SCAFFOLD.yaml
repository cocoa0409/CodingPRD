# =============================================================================
# Short-Term Rental City Registration & Lodging Tax — seed tables (v1)
# Difficulty: Expert
# =============================================================================

scenario: |
  Short-Term Rental City Registration & Lodging Tax: host/property registration & permit
  cap, zoning/eligibility & primary-residence rule, occupancy & safety attestation,
  transient-occupancy-tax (TOT) filing & remittance, platform data-sharing match,
  complaint/nuisance & strike, renewal & revocation, density/lottery limit .

domain_name: short-term-rental
api_prefix: ""

# Flat topology: all collections (/zones, /hosts, /properties, /permits,
# /tax-filings, /listing-reports, /complaints, /lottery-rounds, /platforms,
# /_clock) are top-level siblings referenced by foreign key. api_prefix is the
# empty root so every collection resolves at the URL root.

# =============================================================================
# Table 1.0: Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# complexity_profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - rate_threshold_triggers
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities (Host, Property, Permit, Zone, TaxFiling, ListingReport,
  # Complaint, LotteryRound) linked by explicit foreign keys, no nested URLs.

  state_machine_shape: branching
  # Permit: DRAFT -> {ISSUED | LOTTERY_PENDING | REJECTED}; ISSUED -> {ACTIVE,
  # SUSPENDED<->ACTIVE, REVOKED, EXPIRED}. Complaint: OPEN -> {DISMISSED |
  # UPHELD}. TaxFiling: DRAFT -> FILED -> {REMITTED | DELINQUENT} with amend
  # loop. Multiple non-linear machines on distinct entities.

  relationship_patterns:
    - one_to_many          # Host 1..* Property; Property 1..* Permit(historical); Permit 1..* TaxFiling
    - flat                 # peer FK references, no nesting in URL paths
    - cross_aggregate      # ListingReport references Permit across the tax aggregate

  role_model: peer_roles
  # CityRegistrar (opaque operator), TaxOfficer (opaque operator),
  # Host (entity_backed:Host), Platform (entity_backed:Platform data-share agent).

  consistency_model: immediate

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Zone
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique zoning district code, e.g. 'R1'", constraints: "unique across all Zones" }
      - { name: str_eligible, type: boolean, source: input, default: true, description: "Whether short-term rentals are permitted at all in this zone" }
      - { name: whole_home_allowed, type: boolean, source: input, default: false, description: "Whether non-primary-residence (whole-home) permits are allowed; if false only primary-residence permits may issue" }
      - { name: permit_cap, type: integer, source: input, description: "Maximum number of permits in ACTIVE or SUSPENDED status this zone may hold at once (density cap); >= 0" }
      - { name: active_permit_count, type: integer, source: computed, default: 0, description: "Count of Permits FK-linked to this zone whose status IN {ACTIVE, SUSPENDED}" }
      - { name: lottery_enabled, type: boolean, source: input, default: false, description: "When true, a permit application at or beyond the cap enters LOTTERY_PENDING instead of being rejected" }

  - name: Host
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Host contact email", constraints: "unique across all Hosts" }
      - { name: full_name, type: string, source: input, description: "Host legal name" }
      - { name: primary_residence_property_id, type: string, source: system, description: "FK -> Property.id; the single property the host has attested as their primary residence, null until set via attestation" }
      - { name: strike_total, type: integer, source: computed, default: 0, description: "Sum of strike_points across all UPHELD Complaints on all Permits owned by this host" }
      - { name: standing, type: enum, source: computed, default: "GOOD", description: "GOOD when strike_total < 3, BARRED when strike_total >= 3; BARRED hosts cannot receive new ISSUED permits" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> Host.id; owning host" }
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; zoning district of the property" }
      - { name: street_address, type: string, source: input, description: "Full street address", constraints: "unique across all Properties" }
      - { name: bedroom_count, type: integer, source: input, description: "Number of bedrooms; >= 1; drives max_occupancy" }
      - { name: is_primary_residence, type: boolean, source: system, default: false, description: "True when this property equals its host's primary_residence_property_id" }
      - { name: max_occupancy, type: integer, source: computed, description: "= 2 * bedroom_count + 1 (occupancy calc); attestations may not exceed this" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the property this permit authorizes" }
      - { name: host_id, type: string, source: input, description: "FK -> Host.id; denormalized owner, copied from Property.host_id at creation" }
      - { name: zone_id, type: string, source: system, description: "FK -> Zone.id; denormalized from Property.zone_id at creation, drives density cap" }
      - { name: permit_type, type: enum, source: input, description: "PRIMARY_RESIDENCE | WHOLE_HOME; PRIMARY_RESIDENCE requires the property be the host primary residence" }
      - { name: attested_occupancy, type: integer, source: input, description: "Host-attested max guests; must be >= 1 and <= Property.max_occupancy at issuance" }
      - { name: safety_attested, type: boolean, source: input, default: false, description: "Whether the safety attestation (smoke/CO detectors, egress) was affirmed; must be true to issue" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp when the permit transitioned to ISSUED, null in DRAFT/REJECTED/LOTTERY_PENDING" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at + 365 days; null until issued; drives EXPIRED auto-transition and renewal window" }
      - { name: nightly_base_rate_cents, type: integer, source: input, description: "Advertised nightly rate in cents, used as TOT tax base per night; >= 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | LOTTERY_PENDING | ISSUED | ACTIVE | SUSPENDED | REVOKED | EXPIRED | REJECTED" }

  - name: LotteryRound
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; the zone this lottery draws for" }
      - { name: seats_available, type: integer, source: input, description: "Number of permit seats to award this round; >= 0" }
      - { name: awarded_permit_ids, type: array, source: computed, description: "Ordered list of Permit ids awarded, in award order (by Permit.created_at ASC among LOTTERY_PENDING entrants)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> DRAWN; DRAWN is terminal" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; the permit complained about" }
      - { name: category, type: enum, source: input, description: "NOISE | TRASH | OVER_OCCUPANCY | UNPERMITTED; drives strike_points on upholding" }
      - { name: strike_points, type: integer, source: computed, default: 0, description: "0 while OPEN/DISMISSED; on UPHELD set to 1 for NOISE/TRASH, 2 for OVER_OCCUPANCY/UNPERMITTED" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> {DISMISSED | UPHELD}; both terminal" }

  - name: TaxFiling
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; the permit whose lodging revenue this filing reports" }
      - { name: period_year, type: integer, source: input, description: "Filing period calendar year" }
      - { name: period_month, type: integer, source: input, description: "Filing period month 1..12; (permit_id, period_year, period_month) unique" }
      - { name: nights_booked, type: integer, source: input, description: "Number of occupied nights in the period; >= 0" }
      - { name: gross_revenue_cents, type: integer, source: input, description: "Total gross lodging revenue in cents for the period; >= 0" }
      - { name: tot_due_cents, type: integer, source: computed, description: "Transient-occupancy-tax owed (TOT calc), computed at FILED transition from gross_revenue_cents, nights_booked, and zone tier" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Late-remittance penalty accrued when a filing goes DELINQUENT (penalty calc)" }
      - { name: amount_remitted_cents, type: integer, source: computed, default: 0, description: "Cumulative amount paid across remittances against this filing" }
      - { name: due_at, type: datetime, source: computed, description: "Remittance deadline = end of period + 30 days; drives DELINQUENT auto-transition" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> FILED -> {REMITTED | DELINQUENT}; DELINQUENT -> REMITTED on full pay+penalty; amend loop FILED -> DRAFT" }

  - name: ListingReport
    parent: null
    common_fields: false  # id + created_at only (append-only reconciliation event)
    fields:
      - { name: platform_id, type: string, source: input, description: "FK -> Platform.id; the platform that submitted this data-share row" }
      - { name: claimed_permit_number, type: string, source: input, description: "Permit id string the platform claims the listing displays; may be blank/unknown" }
      - { name: street_address, type: string, source: input, description: "Listing street address as advertised on the platform" }
      - { name: reported_nights, type: integer, source: input, description: "Nights the platform reports as booked in the match window; >= 0" }
      - { name: match_result, type: enum, source: computed, description: "MATCHED | ADDRESS_MISMATCH | NO_PERMIT | PERMIT_INACTIVE; computed at submission (platform-match calc)" }
      - { name: matched_permit_id, type: string, source: computed, description: "FK -> Permit.id; the Permit the row resolved to, or null when NO_PERMIT" }

  - name: Platform
    parent: null
    common_fields: true
    fields:
      - { name: platform_name, type: string, source: input, description: "Data-sharing platform display name", constraints: "unique across all Platforms" }
      - { name: api_key, type: string, source: system, description: "Server-minted opaque key the platform presents as X-User-ID for data-share submissions" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [REVOKED, EXPIRED, REJECTED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /permits/{id}/issue"
        actor: CityRegistrar
        preconditions:
          - "Property exists and Property.zone.str_eligible == true (else ERR_ZONE_INELIGIBLE)"
          - "If permit_type == WHOLE_HOME then Property.zone.whole_home_allowed == true (else ERR_WHOLE_HOME_FORBIDDEN)"
          - "If permit_type == PRIMARY_RESIDENCE then Property.is_primary_residence == true (else ERR_NOT_PRIMARY_RESIDENCE)"
          - "safety_attested == true (else ERR_SAFETY_NOT_ATTESTED)"
          - "attested_occupancy >= 1 and attested_occupancy <= Property.max_occupancy (else ERR_OCCUPANCY_EXCEEDS_MAX)"
          - "Host.standing == GOOD (else ERR_HOST_BARRED)"
          - "zone.active_permit_count < zone.permit_cap (else, if zone.lottery_enabled route to LOTTERY_PENDING, otherwise ERR_PERMIT_CAP_REACHED)"
        side_effects:
          - "set issued_at = clock.now, expires_at = issued_at + 365 days"
          - "increment zone.active_permit_count by 1 (bubble-up: ISSUED counts toward cap alongside ACTIVE/SUSPENDED)"
          - "increment Permit.version by 1"
        note: "When cap is reached and lottery_enabled the registrar's issue attempt instead lands the permit in LOTTERY_PENDING (see next transition); active_permit_count is NOT incremented for LOTTERY_PENDING."

      - from: DRAFT
        to: LOTTERY_PENDING
        trigger: "POST /permits/{id}/issue (auto-routed when cap reached and zone.lottery_enabled)"
        actor: CityRegistrar
        preconditions:
          - "All ISSUED preconditions except the cap check pass"
          - "zone.active_permit_count >= zone.permit_cap and zone.lottery_enabled == true"
        side_effects:
          - "does NOT change zone.active_permit_count"
          - "increment Permit.version by 1"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /permits/{id}/reject"
        actor: CityRegistrar
        preconditions: []
        side_effects:
          - "increment Permit.version by 1"

      - from: LOTTERY_PENDING
        to: ISSUED
        trigger: "system: LotteryRound draw awards this permit a seat"
        actor: system
        preconditions:
          - "permit is among the first seats_available LOTTERY_PENDING permits by created_at ASC in the zone"
        side_effects:
          - "set issued_at = clock.now, expires_at = issued_at + 365 days"
          - "increment zone.active_permit_count by 1"
          - "increment Permit.version by 1"

      - from: LOTTERY_PENDING
        to: REJECTED
        trigger: "system: LotteryRound draw does not award this permit (unseated entrant)"
        actor: system
        preconditions:
          - "permit is NOT among the first seats_available LOTTERY_PENDING permits by created_at ASC"
        side_effects:
          - "increment Permit.version by 1"

      - from: ISSUED
        to: ACTIVE
        trigger: "POST /permits/{id}/activate"
        actor: Host
        preconditions:
          - "acting Host owns the permit (X-User-ID == Permit.host_id, else ERR_UNAUTHORIZED)"
          - "clock.now < expires_at (else the permit auto-transitions to EXPIRED first, see auto-transition)"
        side_effects:
          - "increment Permit.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: an UPHELD Complaint pushes the permit's own upheld strike_points to >= 2 within a single active period"
        actor: system
        preconditions:
          - "cumulative UPHELD strike_points on THIS permit >= 2 and < 4"
        side_effects:
          - "increment Permit.version by 1"
        note: "Cross-entity cascade origin: Complaint UPHELD -> permit strike aggregation -> SUSPENDED."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /permits/{id}/reinstate"
        actor: CityRegistrar
        preconditions:
          - "cumulative UPHELD strike_points on THIS permit < 4 (a permit at >= 4 is REVOKED, not reinstatable)"
        side_effects:
          - "increment Permit.version by 1"

      - from: ACTIVE
        to: REVOKED
        trigger: "system: an UPHELD Complaint pushes the permit's cumulative UPHELD strike_points to >= 4"
        actor: system
        preconditions:
          - "cumulative UPHELD strike_points on THIS permit >= 4"
        side_effects:
          - "decrement zone.active_permit_count by 1 (cascade: revocation frees a density seat)"
          - "increment Permit.version by 1"

      - from: SUSPENDED
        to: REVOKED
        trigger: "system: an UPHELD Complaint pushes cumulative UPHELD strike_points to >= 4 while suspended"
        actor: system
        preconditions:
          - "cumulative UPHELD strike_points on THIS permit >= 4"
        side_effects:
          - "decrement zone.active_permit_count by 1"
          - "increment Permit.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock.now >= expires_at (auto-transition on any read/mutation touching the permit)"
        actor: system
        preconditions:
          - "clock.now >= expires_at"
        side_effects:
          - "decrement zone.active_permit_count by 1 (cascade: expiry frees a density seat)"
          - "increment Permit.version by 1"

      - from: ISSUED
        to: EXPIRED
        trigger: "system: clock.now >= expires_at"
        actor: system
        preconditions:
          - "clock.now >= expires_at"
        side_effects:
          - "decrement zone.active_permit_count by 1"
          - "increment Permit.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /permits/{id}/renew (within 30 days of expiry)"
        actor: Host
        preconditions:
          - "acting Host owns the permit (else ERR_UNAUTHORIZED)"
          - "clock.now >= expires_at - 30 days and clock.now < expires_at (else ERR_RENEWAL_WINDOW_CLOSED)"
          - "expected_permit_version matches current Permit.version (else ERR_STALE_VERSION)"
          - "Host.standing == GOOD (else ERR_HOST_BARRED)"
        side_effects:
          - "set expires_at = expires_at + 365 days (renewal extends the existing anchor, not clock.now)"
          - "increment Permit.version by 1"
        note: "Self-loop cyclic renewal on the ACTIVE state; does not touch zone.active_permit_count."

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [DISMISSED, UPHELD]
    transitions:
      - from: OPEN
        to: DISMISSED
        trigger: "POST /complaints/{id}/dismiss"
        actor: CityRegistrar
        preconditions: []
        side_effects:
          - "strike_points remains 0"
          - "increment Complaint.version by 1"

      - from: OPEN
        to: UPHELD
        trigger: "POST /complaints/{id}/uphold"
        actor: CityRegistrar
        preconditions:
          - "target Permit.status IN {ISSUED, ACTIVE, SUSPENDED} (else ERR_PERMIT_NOT_ENFORCEABLE)"
        side_effects:
          - "set strike_points = 1 if category IN {NOISE, TRASH} else 2 (category IN {OVER_OCCUPANCY, UNPERMITTED})"
          - "recompute target Permit cumulative UPHELD strike_points (bubble-up)"
          - "cascade: if cumulative >= 4 -> Permit REVOKED (and decrement zone.active_permit_count); else if cumulative >= 2 and Permit ACTIVE -> Permit SUSPENDED"
          - "recompute owning Host.strike_total and Host.standing (bubble-up second hop)"
          - "increment Complaint.version by 1"
        note: "Cascade depth-3 origin: uphold -> permit strike recompute -> {SUSPENDED|REVOKED + zone seat release} -> host standing recompute."

  - entity: TaxFiling
    initial_state: DRAFT
    terminal_states: [REMITTED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /tax-filings/{id}/file"
        actor: TaxOfficer
        preconditions:
          - "target Permit.status IN {ISSUED, ACTIVE, SUSPENDED, EXPIRED, REVOKED} (a filing may report past revenue even after revocation; only DRAFT/REJECTED/LOTTERY_PENDING permits cannot be filed -> ERR_PERMIT_NOT_FILEABLE)"
          - "nights_booked >= 1 (a zero-night period cannot be filed -> ERR_NO_NIGHTS_TO_FILE)"
        side_effects:
          - "compute tot_due_cents (TOT calc)"
          - "set due_at = last day of period + 30 days"
          - "increment TaxFiling.version by 1"

      - from: FILED
        to: DRAFT
        trigger: "POST /tax-filings/{id}/amend"
        actor: TaxOfficer
        preconditions:
          - "amount_remitted_cents == 0 (a filing with remittances cannot be amended -> ERR_FILING_HAS_REMITTANCES)"
        side_effects:
          - "reset tot_due_cents to null and due_at to null"
          - "increment TaxFiling.version by 1"
        note: "Amend loop: FILED -> DRAFT re-open for correction; cyclic."

      - from: FILED
        to: REMITTED
        trigger: "POST /tax-filings/{id}/remit (full payment before due_at)"
        actor: Host
        preconditions:
          - "acting Host owns target Permit (X-User-ID == Permit.host_id, else ERR_UNAUTHORIZED)"
          - "clock.now < due_at"
          - "amount_remitted_cents + payment_cents >= tot_due_cents (else remains FILED, partial payment recorded, ERR not raised)"
        side_effects:
          - "increment amount_remitted_cents by payment_cents"
          - "increment TaxFiling.version by 1"

      - from: FILED
        to: DELINQUENT
        trigger: "system: clock.now >= due_at with amount_remitted_cents < tot_due_cents"
        actor: system
        preconditions:
          - "clock.now >= due_at and amount_remitted_cents < tot_due_cents"
        side_effects:
          - "compute penalty_cents (penalty calc)"
          - "increment TaxFiling.version by 1"

      - from: DELINQUENT
        to: REMITTED
        trigger: "POST /tax-filings/{id}/remit (pays remaining tot_due + penalty)"
        actor: Host
        preconditions:
          - "acting Host owns target Permit (else ERR_UNAUTHORIZED)"
          - "amount_remitted_cents + payment_cents >= tot_due_cents + penalty_cents (else remains DELINQUENT, partial recorded)"
        side_effects:
          - "increment amount_remitted_cents by payment_cents"
          - "increment TaxFiling.version by 1"

  - entity: LotteryRound
    initial_state: OPEN
    terminal_states: [DRAWN]
    transitions:
      - from: OPEN
        to: DRAWN
        trigger: "POST /lottery-rounds/{id}/draw"
        actor: CityRegistrar
        preconditions:
          - "expected_lottery_round_version matches current LotteryRound.version (else ERR_STALE_VERSION)"
        side_effects:
          - "order the zone's LOTTERY_PENDING permits by created_at ASC (created_at, never id)"
          - "award the first seats_available permits: each LOTTERY_PENDING -> ISSUED (cascade: issued_at/expires_at set, zone.active_permit_count += 1 per award)"
          - "unseated LOTTERY_PENDING permits -> REJECTED"
          - "set awarded_permit_ids to the ordered awarded ids"
          - "increment LotteryRound.version by 1"
        note: "Waterfall allocation of a fixed seat pool across entrants ordered by created_at."

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: renew-stale-permit
    parent_entity: Permit
    write_endpoint: "POST /permits/{id}/renew"
    occ_field: "expected_permit_version"
    description: |
      Renewing a Permit whose version has advanced since the client last
      observed it is rejected on a stale expected_permit_version. A renewal
      legitimately re-anchors expires_at and bumps version; a second renewal
      still carrying the pre-renewal version observes a stale value and is
      rejected. This is a true supersede case: from an ACTIVE permit both
      renewals would independently succeed under §renewal semantics, so the
      guard cannot reduce to a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: draw-stale-lottery-round
    parent_entity: LotteryRound
    write_endpoint: "POST /lottery-rounds/{id}/draw"
    occ_field: "expected_lottery_round_version"
    description: |
      Drawing a LotteryRound whose version has advanced since the client last
      observed it is rejected on a stale expected_lottery_round_version. A draw
      commits an award set derived from the current pool of LOTTERY_PENDING
      entrants and bumps the round version; a client that re-issues a draw
      against a stale round view (e.g. after new entrants were added and the
      round's version advanced by an amendment endpoint) is rejected rather
      than silently re-drawing on a different pool.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: occupancy_max
    trigger: "on Property creation and whenever bedroom_count is read (derived field)"
    algorithm: aggregation
    formula: |
      max_occupancy = 2 * bedroom_count + 1
    input_set: "the single Property's bedroom_count"
    constants:
      OCCUPANTS_PER_BEDROOM: 2
      COMMON_AREA_ALLOWANCE: 1
    precision: "integer, exact"
    variants: []

  - name: tot_due
    trigger: "on TaxFiling FILED transition (POST /tax-filings/{id}/file)"
    algorithm: tiered_pricing
    formula: |
      # Two-tier transient-occupancy tax with a per-night flat fee plus a
      # marginal percentage on gross revenue. Tier boundary is TOT_TIER_NIGHTS.
      # ORDER PINNED (mode b nested rounding): compute the percentage component
      # to whole cents FIRST (round half up), then add the flat per-night fee
      # component (already integer cents), then compare to REVENUE for the cap.
      base_pct = TOT_BASE_RATE_BP / 10000            # 8% base
      surge_pct = TOT_SURGE_RATE_BP / 10000          # 12% surge on nights over tier
      if nights_booked <= TOT_TIER_NIGHTS:
          pct_component = round_half_up(gross_revenue_cents * base_pct)
      else:
          # blended: base on the revenue share of the first TOT_TIER_NIGHTS
          # nights, surge on the revenue share of the remaining nights.
          per_night_rev = gross_revenue_cents / nights_booked   # exact rational, not rounded here
          base_share = round_half_up(per_night_rev * TOT_TIER_NIGHTS * base_pct)
          surge_share = round_half_up(per_night_rev * (nights_booked - TOT_TIER_NIGHTS) * surge_pct)
          pct_component = base_share + surge_share
      flat_component = nights_booked * TOT_FLAT_PER_NIGHT_CENTS
      tot_due_cents = pct_component + flat_component
    input_set: "one TaxFiling's gross_revenue_cents and nights_booked; zone tier constants"
    constants:
      TOT_BASE_RATE_BP: 800          # 8.00% in basis points
      TOT_SURGE_RATE_BP: 1200        # 12.00% in basis points
      TOT_TIER_NIGHTS: 14            # first 14 nights taxed at base, remainder at surge
      TOT_FLAT_PER_NIGHT_CENTS: 300  # $3.00 flat lodging fee per night
    precision: "cents, round_half_up; percentage components rounded to whole cents BEFORE summation (per-line-then-sum), flat fee is exact integer"
    variants: []

  - name: tax_penalty
    trigger: "on TaxFiling DELINQUENT transition (system, clock.now >= due_at unpaid)"
    algorithm: threshold
    formula: |
      # Late penalty: flat delinquency fee plus a per-day interest accrual on
      # the UNPAID balance, capped at PENALTY_CAP_BP of the unpaid balance.
      unpaid = tot_due_cents - amount_remitted_cents
      days_late = floor((clock.now - due_at) / 1 day)      # >= 0 at transition
      interest = round_half_up(unpaid * PENALTY_DAILY_BP / 10000 * days_late)
      raw_penalty = PENALTY_FLAT_CENTS + interest
      cap = round_half_up(unpaid * PENALTY_CAP_BP / 10000)
      penalty_cents = min(raw_penalty, cap)
    input_set: "one TaxFiling's tot_due_cents, amount_remitted_cents, due_at vs clock.now"
    constants:
      PENALTY_FLAT_CENTS: 2500       # $25 flat delinquency fee
      PENALTY_DAILY_BP: 50           # 0.50% per day of unpaid balance
      PENALTY_CAP_BP: 2500           # penalty capped at 25% of unpaid balance
    precision: "cents, round_half_up; min() applied AFTER both raw_penalty and cap computed"
    variants:
      - name: at_transition
        when: "computed once at the moment of DELINQUENT transition"
        difference: "days_late frozen at the transition instant; not recomputed on later reads"

  - name: host_strike_standing
    trigger: "on Complaint UPHELD side-effect (bubble-up recompute)"
    algorithm: aggregation
    formula: |
      # Host-level risk scoring (distinct entity domain from tot_due, which is
      # cost accounting on TaxFiling). Sums UPHELD strike_points across ALL the
      # host's permits, not a single permit.
      strike_total = sum(Complaint.strike_points
                         for c in Complaints
                         if c.status == UPHELD
                         and c.permit.host_id == host.id)
      standing = BARRED if strike_total >= HOST_BAR_THRESHOLD else GOOD
    input_set: "all UPHELD Complaints whose permit.host_id == this host; excludes OPEN and DISMISSED"
    constants:
      HOST_BAR_THRESHOLD: 3
    precision: "integer, exact"
    variants:
      - name: permit_scoped
        when: "for a single permit's SUSPEND/REVOKE cascade decision"
        difference: "sums strike_points only over UPHELD Complaints where c.permit_id == this permit.id (permit-scoped), thresholds at 2 (suspend) and 4 (revoke) — a different input set and different thresholds than the host-scoped standing variant"

  - name: platform_match
    trigger: "on ListingReport submission (POST /listing-reports)"
    algorithm: projection
    formula: |
      # Reconcile a platform-reported listing against the permit registry.
      # ORDER PINNED (circular-looking dependency, mode c): resolve permit
      # identity FIRST (by claimed_permit_number if present, else by address),
      # THEN evaluate the permit's enforceable status. The status branch
      # depends on the resolved permit, and the resolution depends on which
      # key is present — evaluation order is pinned so match_result is defined.
      if claimed_permit_number is non-empty and a Permit with that id exists:
          p = that Permit
          if p.property.street_address == report.street_address:
              if p.status IN {ISSUED, ACTIVE}: result = MATCHED
              else: result = PERMIT_INACTIVE          # SUSPENDED/REVOKED/EXPIRED/etc
          else: result = ADDRESS_MISMATCH
      else:
          # fall back to address resolution
          matches = Permits whose property.street_address == report.street_address
          if matches is empty: result = NO_PERMIT
          else:
              p = the match with the latest issued_at (tie-break created_at ASC, never id)
              if p.status IN {ISSUED, ACTIVE}: result = MATCHED
              else: result = PERMIT_INACTIVE
      matched_permit_id = p.id where p is defined, else null
    input_set: "one ListingReport row against the full Permit registry filtered by id or street_address"
    constants: {}
    precision: "exact enum resolution"
    variants: []

# =============================================================================
# Table 1.4: Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which is open to CityRegistrar and TaxOfficer"

  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7 (role-level), and for entity_backed roles the X-User-ID owns the target resource where ownership is required"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all mutation endpoints"

  - priority: 3
    category: existence
    check: "every path/body FK resolves to an existing resource, validated left-to-right (Zone, Host, Property, Permit, TaxFiling, Complaint, LotteryRound, Platform)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a resource id or FK"

  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_referential
    check: "on Permit issue, referenced Property.zone is str_eligible"
    error_id: ERR_ZONE_INELIGIBLE
    http_status: 422
    applies_to: "POST /permits/{id}/issue"

  - priority: 6
    category: business_safety
    check: "on Permit issue, if permit_type == WHOLE_HOME the zone must allow whole-home"
    error_id: ERR_WHOLE_HOME_FORBIDDEN
    http_status: 422
    applies_to: "POST /permits/{id}/issue"

  - priority: 7
    category: business_safety
    check: "on Permit issue, if permit_type == PRIMARY_RESIDENCE the property must be the host primary residence"
    error_id: ERR_NOT_PRIMARY_RESIDENCE
    http_status: 422
    applies_to: "POST /permits/{id}/issue"

  - priority: 8
    category: business_safety
    check: "on Permit issue, safety_attested must be true"
    error_id: ERR_SAFETY_NOT_ATTESTED
    http_status: 422
    applies_to: "POST /permits/{id}/issue"

  - priority: 9
    category: business_safety
    check: "on Permit issue, attested_occupancy must be within [1, Property.max_occupancy]"
    error_id: ERR_OCCUPANCY_EXCEEDS_MAX
    http_status: 422
    applies_to: "POST /permits/{id}/issue"

  - priority: 10
    category: business_constraint
    check: "on Permit issue and renew, owning Host.standing must be GOOD"
    error_id: ERR_HOST_BARRED
    http_status: 422
    applies_to: "POST /permits/{id}/issue, POST /permits/{id}/renew"

  - priority: 11
    category: business_temporal
    check: "on Permit renew, clock.now must be within [expires_at - 30d, expires_at)"
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /permits/{id}/renew"

  - priority: 12
    category: business_constraint
    check: "on Permit issue, zone.active_permit_count < zone.permit_cap OR (zone.lottery_enabled routes to LOTTERY_PENDING); only when cap reached AND lottery disabled is this raised"
    error_id: ERR_PERMIT_CAP_REACHED
    http_status: 422
    applies_to: "POST /permits/{id}/issue"

  - priority: 13
    category: business_constraint
    check: "on TaxFiling file, nights_booked must be >= 1"
    error_id: ERR_NO_NIGHTS_TO_FILE
    http_status: 422
    applies_to: "POST /tax-filings/{id}/file"

  - priority: 14
    category: business_referential
    check: "on TaxFiling file, target Permit must be in a fileable state (not DRAFT/REJECTED/LOTTERY_PENDING)"
    error_id: ERR_PERMIT_NOT_FILEABLE
    http_status: 422
    applies_to: "POST /tax-filings/{id}/file"

  - priority: 15
    category: business_referential
    check: "on Complaint uphold, target Permit must be enforceable (status IN {ISSUED, ACTIVE, SUSPENDED})"
    error_id: ERR_PERMIT_NOT_ENFORCEABLE
    http_status: 422
    applies_to: "POST /complaints/{id}/uphold"

  - priority: 16
    category: business_constraint
    check: "on TaxFiling amend, amount_remitted_cents must be 0"
    error_id: ERR_FILING_HAS_REMITTANCES
    http_status: 422
    applies_to: "POST /tax-filings/{id}/amend"

  - priority: 17
    category: business_constraint
    check: "on TaxFiling create, (permit_id, period_year, period_month) must be unique"
    error_id: ERR_DUPLICATE_FILING_PERIOD
    http_status: 409
    applies_to: "POST /tax-filings"

  - priority: 18
    category: business_constraint
    check: "on attest-primary-residence, a host may have at most one primary residence property; setting a second is rejected"
    error_id: ERR_PRIMARY_RESIDENCE_CONFLICT
    http_status: 409
    applies_to: "POST /hosts/{id}/attest-primary-residence"

  - priority: 19
    category: business_constraint
    check: "OCC expected_*_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /permits/{id}/renew, POST /lottery-rounds/{id}/draw"

  - priority: 20
    category: business_constraint
    check: "request body has all required fields with valid types/enums/ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Zones ----
  - method: POST
    path: "/zones"
    description: "Create a zoning district."
    roles: [CityRegistrar]
    code: 201
    input: [zone_code, "str_eligible?", "whole_home_allowed?", permit_cap, "lottery_enabled?"]
    output: Zone
    side_effects: []

  - method: GET
    path: "/zones/{id}"
    description: "Fetch a zone including computed active_permit_count."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: []
    output: Zone
    side_effects: ["recompute active_permit_count from FK-linked permits"]

  - method: GET
    path: "/zones"
    description: "List zones."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: ["limit?", "offset?"]
    output: Zone[]
    side_effects: []

  # ---- Hosts ----
  - method: POST
    path: "/hosts"
    description: "Register a host."
    roles: [CityRegistrar, Host]
    code: 201
    input: [email, full_name]
    output: Host
    side_effects: []

  - method: GET
    path: "/hosts/{id}"
    description: "Fetch a host including computed strike_total and standing."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: []
    output: Host
    side_effects: ["recompute strike_total and standing"]

  - method: GET
    path: "/hosts"
    description: "List/filter hosts, including by primary_residence_property_id (FK reverse-reachability for Property->Host primary-residence link)."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: ["primary_residence_property_id?", "limit?", "offset?"]
    output: Host[]
    side_effects: []

  - method: POST
    path: "/hosts/{id}/attest-primary-residence"
    description: "Set the host's single primary-residence property. Fails if one is already set to a different property."
    roles: [Host]
    code: 200
    input: [property_id]
    output: Host
    side_effects:
      - "set Host.primary_residence_property_id = property_id"
      - "set that Property.is_primary_residence = true"
      - "increment Host.version by 1"

  # ---- Properties ----
  - method: POST
    path: "/properties"
    description: "Register a property under a host and zone. max_occupancy computed."
    roles: [CityRegistrar, Host]
    code: 201
    input: [host_id, zone_id, street_address, bedroom_count]
    output: Property
    side_effects: ["compute max_occupancy = 2*bedroom_count + 1"]

  - method: GET
    path: "/properties/{id}"
    description: "Fetch a property."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List/filter properties by host or zone (FK reverse-reachability for Host->Property and Zone->Property)."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: ["host_id?", "zone_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  # ---- Permits ----
  - method: POST
    path: "/permits"
    description: "Create a DRAFT permit application for a property."
    roles: [CityRegistrar, Host]
    code: 201
    input: [property_id, permit_type, attested_occupancy, "safety_attested?", nightly_base_rate_cents]
    output: Permit
    side_effects:
      - "copy host_id from Property.host_id and zone_id from Property.zone_id"
      - "set status = DRAFT"

  - method: GET
    path: "/permits/{id}"
    description: "Fetch a permit. Applies EXPIRED auto-transition if clock.now >= expires_at."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: []
    output: Permit
    side_effects: ["auto-transition ISSUED/ACTIVE -> EXPIRED if clock.now >= expires_at (decrement zone.active_permit_count)"]

  - method: GET
    path: "/permits"
    description: "List/filter permits by property, host, or zone (FK reverse-reachability for Property->Permit, Host->Permit, Zone->Permit)."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: ["property_id?", "host_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/permits/{id}/issue"
    description: "Registrar issues a DRAFT permit; runs all eligibility/safety/cap checks. Routes to LOTTERY_PENDING when cap reached and zone.lottery_enabled."
    roles: [CityRegistrar]
    code: 200
    input: []
    output: Permit
    side_effects:
      - "DRAFT -> ISSUED (or LOTTERY_PENDING): set issued_at, expires_at; increment zone.active_permit_count when ISSUED"
      - "increment Permit.version by 1"

  - method: POST
    path: "/permits/{id}/reject"
    description: "Registrar rejects a DRAFT permit."
    roles: [CityRegistrar]
    code: 200
    input: []
    output: Permit
    side_effects: ["DRAFT -> REJECTED", "increment Permit.version by 1"]

  - method: POST
    path: "/permits/{id}/activate"
    description: "Owning host activates an ISSUED permit for operation."
    roles: [Host]
    code: 200
    input: []
    output: Permit
    side_effects: ["ISSUED -> ACTIVE", "increment Permit.version by 1"]

  - method: POST
    path: "/permits/{id}/renew"
    description: "Owning host renews an ACTIVE permit within the 30-day window; extends expires_at by 365 days. OCC-guarded."
    roles: [Host]
    code: 200
    input: [expected_permit_version]
    output: Permit
    side_effects: ["ACTIVE -> ACTIVE (self-loop): expires_at += 365 days", "increment Permit.version by 1"]

  - method: POST
    path: "/permits/{id}/reinstate"
    description: "Registrar reinstates a SUSPENDED permit to ACTIVE when cumulative UPHELD strike_points < 4."
    roles: [CityRegistrar]
    code: 200
    input: []
    output: Permit
    side_effects: ["SUSPENDED -> ACTIVE", "increment Permit.version by 1"]

  # ---- Complaints ----
  - method: POST
    path: "/complaints"
    description: "File a nuisance complaint against a permit."
    roles: [CityRegistrar, Host]
    code: 201
    input: [permit_id, category]
    output: Complaint
    side_effects: ["status = OPEN, strike_points = 0"]

  - method: GET
    path: "/complaints/{id}"
    description: "Fetch a complaint."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/complaints"
    description: "List/filter complaints by permit (FK reverse-reachability for Permit->Complaint)."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: ["permit_id?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/complaints/{id}/dismiss"
    description: "Registrar dismisses an OPEN complaint."
    roles: [CityRegistrar]
    code: 200
    input: []
    output: Complaint
    side_effects: ["OPEN -> DISMISSED", "increment Complaint.version by 1"]

  - method: POST
    path: "/complaints/{id}/uphold"
    description: "Registrar upholds an OPEN complaint; assigns strike_points and cascades to permit suspend/revoke and host standing."
    roles: [CityRegistrar]
    code: 200
    input: []
    output: Complaint
    side_effects:
      - "OPEN -> UPHELD, set strike_points"
      - "cascade permit strike aggregation -> SUSPENDED/REVOKED (+ zone seat release on revoke)"
      - "cascade host strike_total/standing recompute"
      - "increment Complaint.version by 1"

  # ---- Tax Filings ----
  - method: POST
    path: "/tax-filings"
    description: "Create a DRAFT tax filing for a permit and period."
    roles: [TaxOfficer, Host]
    code: 201
    input: [permit_id, period_year, period_month, nights_booked, gross_revenue_cents]
    output: TaxFiling
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/tax-filings/{id}"
    description: "Fetch a tax filing. Applies DELINQUENT auto-transition if clock.now >= due_at and underpaid."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: []
    output: TaxFiling
    side_effects: ["auto-transition FILED -> DELINQUENT (compute penalty_cents) if clock.now >= due_at and underpaid"]

  - method: GET
    path: "/tax-filings"
    description: "List/filter tax filings by permit (FK reverse-reachability for Permit->TaxFiling)."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: ["permit_id?", "status?", "limit?", "offset?"]
    output: TaxFiling[]
    side_effects: []

  - method: POST
    path: "/tax-filings/{id}/file"
    description: "Tax officer files a DRAFT filing; computes tot_due_cents and due_at."
    roles: [TaxOfficer]
    code: 200
    input: []
    output: TaxFiling
    side_effects: ["DRAFT -> FILED", "compute tot_due_cents, set due_at", "increment TaxFiling.version by 1"]

  - method: POST
    path: "/tax-filings/{id}/amend"
    description: "Tax officer re-opens a FILED filing (no remittances) for correction."
    roles: [TaxOfficer]
    code: 200
    input: []
    output: TaxFiling
    side_effects: ["FILED -> DRAFT", "reset tot_due_cents and due_at to null", "increment TaxFiling.version by 1"]

  - method: POST
    path: "/tax-filings/{id}/remit"
    description: "Owning host remits payment against a FILED or DELINQUENT filing; full payment (incl. penalty when delinquent) transitions to REMITTED."
    roles: [Host]
    code: 200
    input: [payment_cents]
    output: TaxFiling
    side_effects: ["increment amount_remitted_cents", "-> REMITTED when fully paid", "increment TaxFiling.version by 1"]

  # ---- Lottery ----
  - method: POST
    path: "/lottery-rounds"
    description: "Registrar opens a lottery round for a zone with a fixed seat pool."
    roles: [CityRegistrar]
    code: 201
    input: [zone_id, seats_available]
    output: LotteryRound
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/lottery-rounds/{id}"
    description: "Fetch a lottery round including awarded_permit_ids."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: []
    output: LotteryRound
    side_effects: []

  - method: GET
    path: "/lottery-rounds"
    description: "List/filter lottery rounds by zone (FK reverse-reachability for Zone->LotteryRound)."
    roles: [CityRegistrar, TaxOfficer, Host]
    code: 200
    input: ["zone_id?", "status?", "limit?", "offset?"]
    output: LotteryRound[]
    side_effects: []

  - method: POST
    path: "/lottery-rounds/{id}/draw"
    description: "Registrar draws the round: awards seats to the earliest LOTTERY_PENDING entrants by created_at, rejects the rest. OCC-guarded."
    roles: [CityRegistrar]
    code: 200
    input: [expected_lottery_round_version]
    output: LotteryRound
    side_effects:
      - "OPEN -> DRAWN"
      - "award first seats_available LOTTERY_PENDING permits (by created_at ASC) -> ISSUED; zone.active_permit_count += 1 each"
      - "unseated LOTTERY_PENDING -> REJECTED"
      - "set awarded_permit_ids; increment LotteryRound.version by 1"

  # ---- Platforms & data-sharing match ----
  - method: POST
    path: "/platforms"
    description: "Register a data-sharing platform; server mints api_key."
    roles: [CityRegistrar]
    code: 201
    input: [platform_name]
    output: Platform
    side_effects: ["mint api_key"]

  - method: GET
    path: "/platforms/{id}"
    description: "Fetch a platform (including api_key for the registrar)."
    roles: [CityRegistrar]
    code: 200
    input: []
    output: Platform
    side_effects: []

  - method: POST
    path: "/listing-reports"
    description: "Platform submits a listing data-share row; server computes match_result and matched_permit_id."
    roles: [Platform]
    code: 201
    input: [platform_id, "claimed_permit_number?", street_address, reported_nights]
    output: ListingReport
    side_effects: ["compute match_result and matched_permit_id (platform-match calc)"]

  - method: GET
    path: "/listing-reports/{id}"
    description: "Fetch a listing report with its resolved match."
    roles: [CityRegistrar, TaxOfficer]
    code: 200
    input: []
    output: ListingReport
    side_effects: []

  - method: GET
    path: "/listing-reports"
    description: "List/filter listing reports by platform or matched permit (FK reverse-reachability for Platform->ListingReport and Permit->ListingReport)."
    roles: [CityRegistrar, TaxOfficer]
    code: 200
    input: ["platform_id?", "matched_permit_id?", "match_result?", "limit?", "offset?"]
    output: ListingReport[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set the clock reads exactly this default and never falls back to wall-clock time. Advancing the clock past a permit's expires_at or a filing's due_at makes those auto-transitions observable on the next read/mutation."
    roles: [CityRegistrar, TaxOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set logical clock to to_iso8601"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted for the operation, or entity_backed owner mismatch" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "referenced resource id / FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, bad type, bad enum, out-of-range value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "requested transition not defined from the resource's current state" }
  - { id: ERR_ZONE_INELIGIBLE, http: 422, condition: "permit issue in a zone whose str_eligible == false" }
  - { id: ERR_WHOLE_HOME_FORBIDDEN, http: 422, condition: "WHOLE_HOME permit issue in a zone with whole_home_allowed == false" }
  - { id: ERR_NOT_PRIMARY_RESIDENCE, http: 422, condition: "PRIMARY_RESIDENCE permit issue where the property is not the host primary residence" }
  - { id: ERR_SAFETY_NOT_ATTESTED, http: 422, condition: "permit issue with safety_attested != true" }
  - { id: ERR_OCCUPANCY_EXCEEDS_MAX, http: 422, condition: "attested_occupancy outside [1, Property.max_occupancy] at issue" }
  - { id: ERR_HOST_BARRED, http: 422, condition: "permit issue/renew for a host whose standing == BARRED (strike_total >= 3)" }
  - { id: ERR_PERMIT_CAP_REACHED, http: 422, condition: "permit issue when zone.active_permit_count >= permit_cap and lottery disabled" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 422, condition: "renew outside [expires_at - 30d, expires_at)" }
  - { id: ERR_NO_NIGHTS_TO_FILE, http: 422, condition: "tax filing file with nights_booked < 1" }
  - { id: ERR_PERMIT_NOT_FILEABLE, http: 422, condition: "tax filing file when target permit is DRAFT/REJECTED/LOTTERY_PENDING" }
  - { id: ERR_PERMIT_NOT_ENFORCEABLE, http: 422, condition: "complaint uphold when target permit not in {ISSUED, ACTIVE, SUSPENDED}" }
  - { id: ERR_FILING_HAS_REMITTANCES, http: 422, condition: "tax filing amend when amount_remitted_cents > 0" }
  - { id: ERR_DUPLICATE_FILING_PERIOD, http: 409, condition: "tax filing create with an existing (permit_id, period_year, period_month)" }
  - { id: ERR_PRIMARY_RESIDENCE_CONFLICT, http: 409, condition: "attest-primary-residence for a host that already has a different primary residence set" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match current parent version" }
  - { id: ERR_DUPLICATE_ZONE_CODE, http: 409, condition: "zone create with an existing zone_code" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "host create with an existing email" }
  - { id: ERR_DUPLICATE_ADDRESS, http: 409, condition: "property create with an existing street_address" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: CityRegistrar
    description: "City operator who administers zones, hosts, properties, permits, complaints, lotteries, and platforms."
    identity: "opaque"
    exclusive_operations:
      - "POST /zones"
      - "POST /platforms"
      - "GET /platforms/{id}"
      - "POST /permits/{id}/issue"
      - "POST /permits/{id}/reject"
      - "POST /permits/{id}/reinstate"
      - "POST /complaints/{id}/dismiss"
      - "POST /complaints/{id}/uphold"
      - "POST /lottery-rounds"
      - "POST /lottery-rounds/{id}/draw"
    shared_operations:
      - "POST /hosts"
      - "POST /properties"
      - "POST /permits"
      - "POST /complaints"
      - "POST /_clock/set_current_utc"
      - "GET (all read endpoints)"

  - name: TaxOfficer
    description: "Revenue operator who manages TOT filings and remittance status; read-only elsewhere."
    identity: "opaque"
    exclusive_operations:
      - "POST /tax-filings/{id}/file"
      - "POST /tax-filings/{id}/amend"
    shared_operations:
      - "POST /tax-filings"
      - "POST /_clock/set_current_utc"
      - "GET (all read endpoints except GET /platforms/{id})"

  - name: Host
    description: "Property owner who registers properties/permits, activates and renews permits, remits taxes on own permits, and attests primary residence."
    identity: "entity_backed:Host"
    exclusive_operations:
      - "POST /hosts/{id}/attest-primary-residence"
      - "POST /permits/{id}/activate"
      - "POST /permits/{id}/renew"
      - "POST /tax-filings/{id}/remit"
    shared_operations:
      - "POST /hosts"
      - "POST /properties"
      - "POST /permits"
      - "POST /complaints"
      - "POST /tax-filings"
      - "GET (own-scope read endpoints)"

  - name: Platform
    description: "Data-sharing agent that submits listing reports for registry reconciliation."
    identity: "entity_backed:Platform"
    exclusive_operations:
      - "POST /listing-reports"
    shared_operations: []
