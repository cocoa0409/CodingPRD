# =============================================================================
# PRD Benchmark Seed Tables — Environmental Justice Screening & Permit Review
# Difficulty band: beyond Expert (§0.4) — 14 entities, 56 endpoints, 52 error
# codes, 9 calculations (4 with divergent variants), 7 state machines
# (cyclic + parallel dimensions + branching), 3 OCC races.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2474. Environmental Justice Screening & Permit Review (state environmental agency): screening tool application with demographic, health and pollution burden indicators to identify overburdened communities, permit applicability determination for enhanced review with facility type and location triggers, cumulative impact assessment methodology combining existing burdens with proposed emissions, enhanced public participation with translated materials, accessible meeting locations and extended comment periods, permit condition development including additional controls, monitoring and community benefit commitments, permit denial authority where disproportionate impacts cannot be mitigated, community complaint intake with inspection prioritization in identified areas, program evaluation and reporting on permit outcomes in overburdened communities

domain_name: environmental-justice-permit-review
api_prefix: /ej

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # flat: every entity is a peer collection directly under /ej; parent linkage is
  # expressed by FK fields in request bodies, never by URL nesting of ids.
  # Sub-resource GETs exist only as reverse-reachability read channels.

  state_machine_shape: cyclic
  # PermitApplication loops ENHANCED_REVIEW -> RETURNED_FOR_REVISION -> SUBMITTED ->
  # ENHANCED_REVIEW and ISSUED -> ENHANCED_REVIEW (rescission); ParticipationPlan loops
  # CLOSED -> OPEN; CommunityComplaint loops RESOLVED -> TRIAGED. ScreeningArea carries
  # two independent state dimensions (designation x data_status) on the same row.

  relationship_patterns:
    - one_to_many          # ScreeningArea -> BurdenIndicator / Facility / CommunityComplaint
    - self_referential     # PermitApplication.prior_application_id -> PermitApplication.id
    - cross_aggregate      # PublicMeeting -> Venue; Inspection -> Facility

  role_model: segregation_of_duties
  # The analyst who authors a CumulativeImpactAssessment may not QA it, and the
  # PermitManager who issues/denies may be neither its author nor its QA reviewer.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ScreeningArea
    parent: null
    common_fields: true
    fields:
      - name: area_code
        type: string
        source: input
        description: Census block-group screening code, e.g. "BG-06-101"
        constraints: unique across all ScreeningArea rows; 1-32 chars
      - name: county
        type: string
        source: input
        description: County name the block group sits in
      - name: population
        type: integer
        source: input
        description: Resident population of the block group
        constraints: ">= 1"
      - name: limited_english_pct
        type: number
        source: input
        description: Percent of households that are limited-English-proficient
        constraints: "0.0 <= value <= 100.0; 1 decimal"
      - name: required_translation_languages
        type: array
        source: input
        description: ISO 639-1 codes the agency must translate materials into
        default: []
        constraints: array of 2-char lower-case codes; must be non-empty when limited_english_pct >= 10.0
      - name: baseline_load_tpy
        type: number
        source: input
        description: Existing aggregate criteria-pollutant load in the area, tons per year
        constraints: "> 0; 2 decimals"
      - name: demographic_component_statewide
        type: number
        source: computed
        description: Mean statewide_percentile over qualifying DEMOGRAPHIC indicators (calculations.ej_screen_score)
        default: 0.00
      - name: health_component_statewide
        type: number
        source: computed
        description: Mean statewide_percentile over qualifying HEALTH indicators (calculations.ej_screen_score)
        default: 0.00
      - name: pollution_component_statewide
        type: number
        source: computed
        description: Mean statewide_percentile over qualifying POLLUTION indicators (calculations.ej_screen_score)
        default: 0.00
      - name: ej_screen_score_statewide
        type: number
        source: computed
        description: STATEWIDE variant of calculations.ej_screen_score; drives designation and cumulative impact
        default: 0.00
        constraints: "0.00 <= value <= 100.00"
      - name: ej_screen_score_county
        type: number
        source: computed
        description: COUNTY variant of calculations.ej_screen_score; drives complaint inspection priority only
        default: 0.00
        constraints: "0.00 <= value <= 100.00"
      - name: enforcement_burden_points
        type: integer
        source: computed
        description: ENFORCEMENT_POINTS_PER_VIOLATION per confirmed inspection violation at any facility in the area
        default: 0
      - name: designation
        type: enum
        source: computed
        description: Overburdened-community designation derived from ej_screen_score_statewide
        default: UNDESIGNATED
        constraints: "one of {UNDESIGNATED, OVERBURDENED, SEVERELY_OVERBURDENED}"
      - name: data_status
        type: enum
        source: computed
        description: Independent second state dimension - certification freshness of the area's burden data
        default: CURRENT
        constraints: "one of {CURRENT, STALE}"
      - name: active_indicator_count
        type: integer
        source: computed
        description: Count of BurdenIndicator rows for this area with status ACTIVE inside the vintage window
        default: 0
      - name: permitted_load_tpy
        type: number
        source: computed
        description: Emissions ledger - sum of approved_net_emissions_tpy over ISSUED applications at facilities in this area
        default: 0.00
      - name: open_complaint_count
        type: integer
        source: computed
        description: Count of CommunityComplaint rows for this area whose status is in the open set
        default: 0
      - name: open_plan_count
        type: integer
        source: computed
        description: Count of ParticipationPlan rows in status OPEN or EXTENDED whose application's facility is in this area
        default: 0
      - name: translation_required
        type: boolean
        source: computed
        description: True when limited_english_pct >= TRANSLATION_TRIGGER_PCT
        default: false

  - name: BurdenIndicator
    parent: null
    common_fields: true
    fields:
      - name: screening_area_id
        type: string
        source: input
        description: FK -> ScreeningArea.id; the block group this indicator measures
      - name: indicator_code
        type: enum
        source: input
        description: Indicator identity; each code has exactly one canonical category
        constraints: "one of {PM25, DIESEL_PM, TOXIC_RELEASE, DRINKING_WATER, ASTHMA_ED_RATE, LOW_BIRTH_WEIGHT, CARDIOVASCULAR, POVERTY_RATE, LINGUISTIC_ISOLATION, EDUCATIONAL_ATTAINMENT}"
      - name: category
        type: enum
        source: input
        description: Indicator family; must equal the canonical category of indicator_code (constants.INDICATOR_CATEGORY_MAP)
        constraints: "one of {POLLUTION, HEALTH, DEMOGRAPHIC}"
      - name: raw_value
        type: number
        source: input
        description: Raw measured value in the indicator's native unit
      - name: statewide_percentile
        type: number
        source: input
        description: Percentile of this block group among all state block groups
        constraints: "0.00 <= value <= 100.00"
      - name: county_percentile
        type: number
        source: input
        description: Percentile of this block group among block groups in the same county
        constraints: "0.00 <= value <= 100.00"
      - name: vintage_year
        type: integer
        source: input
        description: Calendar year the measurement is attributed to
        constraints: "clock_year - INDICATOR_VALIDITY_YEARS <= value <= clock_year"
      - name: status
        type: enum
        source: computed
        description: ACTIVE until a newer indicator with the same (screening_area_id, indicator_code) supersedes it
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"
      - name: area_version_after
        type: integer
        source: computed
        description: Provenance stamp - ScreeningArea.version observed immediately after this indicator's latest state change
      - name: superseded_indicator_id
        type: string
        source: computed
        description: Id of the BurdenIndicator this row superseded on creation, null when none
        default: null

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: screening_area_id
        type: string
        source: input
        description: FK -> ScreeningArea.id; block group containing the facility
      - name: name
        type: string
        source: input
        description: Facility name
      - name: facility_type
        type: enum
        source: input
        description: Regulated category; four of these are enhanced-review facility-type triggers
        constraints: "one of {MAJOR_SOURCE, INCINERATOR, LANDFILL, CHEMICAL_BULK_STORAGE, MINOR_SOURCE, AUTO_BODY_SHOP}"
      - name: distance_to_area_centroid_m
        type: integer
        source: input
        description: Metres from the facility stack to the block-group centroid; drives the PROXIMITY trigger
        constraints: ">= 0"
      - name: existing_load_tpy
        type: number
        source: computed
        description: Sum of approved_net_emissions_tpy over this facility's ISSUED applications
        default: 0.00
      - name: compliance_status
        type: enum
        source: computed
        description: Flips to VIOLATION_ON_RECORD when an inspection at this facility is completed with finding VIOLATION_CONFIRMED
        default: IN_COMPLIANCE
        constraints: "one of {IN_COMPLIANCE, VIOLATION_ON_RECORD}"
      - name: confirmed_violation_count
        type: integer
        source: computed
        description: Count of Inspection rows for this facility with status COMPLETED and finding VIOLATION_CONFIRMED
        default: 0

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the applicant identity for RBAC ownership checks
      - name: prior_application_id
        type: string
        source: input
        description: FK -> PermitApplication.id; predecessor application this filing replaces, null for a first filing
        default: null
      - name: permit_type
        type: enum
        source: input
        description: Kind of authorisation requested
        constraints: "one of {NEW_SOURCE, MODIFICATION, RENEWAL}"
      - name: proposed_emissions_tpy
        type: number
        source: input
        description: Proposed new emissions in tons per year
        constraints: "> 0; 2 decimals"
      - name: proposed_operating_hours_per_year
        type: integer
        source: input
        description: Proposed annual operating hours
        constraints: "1 <= value <= 8760"
      - name: status
        type: enum
        source: computed
        description: Review lifecycle state (state_machines.PermitApplication)
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, STANDARD_REVIEW, ENHANCED_REVIEW, PENDING_DECISION, RETURNED_FOR_REVISION, ISSUED, DENIED, WITHDRAWN}"
      - name: review_track
        type: enum
        source: computed
        description: Track set by the governing ApplicabilityDetermination
        default: UNDETERMINED
        constraints: "one of {UNDETERMINED, STANDARD, ENHANCED}"
      - name: revision_round
        type: integer
        source: computed
        description: Number of completed RETURNED_FOR_REVISION -> SUBMITTED loops
        default: 0
      - name: screening_stale_flag
        type: boolean
        source: computed
        description: True while the application's area has data_status STALE and no fresh assessment has been accepted since
        default: false
      - name: pre_mitigation_index
        type: number
        source: computed
        description: cumulative_impact_index of the governing assessment (calculations.governing_assessment_selector), 0.00 when none
        default: 0.00
      - name: total_mitigation_credit_tpy
        type: number
        source: computed
        description: calculations.mitigation_credit_aggregation output over ACTIVE PermitCondition rows
        default: 0.00
      - name: residual_impact_index
        type: number
        source: computed
        description: calculations.residual_impact_index output; gates issuance and supports denial authority
        default: 0.00
      - name: approved_net_emissions_tpy
        type: number
        source: computed
        description: Net emissions booked to the ledgers on issuance; 0.00 unless status is ISSUED
        default: 0.00

  - name: ApplicabilityDetermination
    parent: null
    common_fields: false
    fields:
      - name: permit_application_id
        type: string
        source: input
        description: FK -> PermitApplication.id; the application screened
      - name: result
        type: enum
        source: computed
        description: Whether enhanced review is required (calculations.applicability_determination)
        constraints: "one of {STANDARD, ENHANCED_REQUIRED}"
      - name: trigger_codes
        type: array
        source: computed
        description: Ordered subset of {FACILITY_TYPE, PROXIMITY, DESIGNATION, EMISSIONS_THRESHOLD, PRIOR_VIOLATION} that fired
      - name: area_designation_snapshot
        type: enum
        source: computed
        description: ScreeningArea.designation at determination time
        constraints: "one of {UNDESIGNATED, OVERBURDENED, SEVERELY_OVERBURDENED}"
      - name: ej_screen_score_snapshot
        type: number
        source: computed
        description: ScreeningArea.ej_screen_score_statewide at determination time
      - name: revision_round
        type: integer
        source: computed
        description: PermitApplication.revision_round at determination time
      - name: determined_by_user_id
        type: string
        source: system
        description: X-User-ID of the EJAnalyst who ran the screen, or "system" for cascaded re-determinations
      - name: application_version_after
        type: integer
        source: computed
        description: Provenance stamp - PermitApplication.version observed immediately after this determination was written

  - name: CumulativeImpactAssessment
    parent: null
    common_fields: true
    fields:
      - name: permit_application_id
        type: string
        source: input
        description: FK -> PermitApplication.id; the application assessed
      - name: method
        type: enum
        source: input
        description: Assessment methodology variant
        constraints: "one of {SCREENING_LEVEL, REFINED}"
      - name: dispersion_factor
        type: number
        source: input
        description: Modelled dispersion attenuation, required when method is REFINED
        default: null
        constraints: "0.10 <= value <= 1.00 when present"
      - name: receptor_distance_m
        type: integer
        source: input
        description: Distance to the nearest sensitive receptor, required when method is REFINED
        default: null
        constraints: ">= 0 when present"
      - name: author_user_id
        type: string
        source: system
        description: X-User-ID of the EJAnalyst who created or last revised this assessment
      - name: qa_user_id
        type: string
        source: system
        description: X-User-ID of the QAReviewer who accepted or returned it, null before QA
        default: null
      - name: baseline_burden_score
        type: number
        source: computed
        description: ScreeningArea.ej_screen_score_statewide snapshot used as the existing-burden term
      - name: proposed_increment_pct
        type: number
        source: computed
        description: Proposed emissions as a percent of the area's baseline_load_tpy
      - name: exposure_factor
        type: number
        source: computed
        description: 1.0000 for SCREENING_LEVEL; dispersion_factor x proximity decay for REFINED
      - name: cumulative_impact_index
        type: number
        source: computed
        description: calculations.cumulative_impact_index output, 0.00-100.00
      - name: disproportionate_flag
        type: boolean
        source: computed
        description: True when cumulative_impact_index >= DISPROPORTIONATE_THRESHOLD
        default: false
      - name: data_confidence
        type: enum
        source: computed
        description: LOW when the area has no qualifying indicators or data_status STALE, else HIGH
        constraints: "one of {HIGH, LOW}"
      - name: status
        type: enum
        source: computed
        description: QA lifecycle state (state_machines.CumulativeImpactAssessment)
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED_FOR_QA, ACCEPTED, RETURNED, SUPERSEDED, INVALIDATED, VOIDED}"
      - name: application_version_after
        type: integer
        source: computed
        description: Provenance stamp - PermitApplication.version observed immediately after this assessment's latest state change

  - name: ParticipationPlan
    parent: null
    common_fields: true
    fields:
      - name: permit_application_id
        type: string
        source: input
        description: FK -> PermitApplication.id; the enhanced-review application this plan serves
      - name: required_comment_days
        type: integer
        source: computed
        description: calculations.required_comment_days output
      - name: granted_extension_days
        type: integer
        source: computed
        description: Cumulative days added by extensions and reopenings
        default: 0
      - name: comment_start_date
        type: string
        source: input
        description: First day of the comment period, ISO date (UTC), set on open
        default: null
      - name: comment_end_date
        type: string
        source: computed
        description: Last day of the comment period inclusive, ISO date (UTC)
        default: null
      - name: translated_languages
        type: array
        source: input
        description: ISO 639-1 codes the plan's materials are translated into
        default: []
      - name: materials_translated
        type: boolean
        source: input
        description: Liaison attestation that translated materials were published
        default: false
      - name: meeting_count
        type: integer
        source: computed
        description: Count of PublicMeeting rows for this plan with status SCHEDULED
        default: 0
      - name: comment_count
        type: integer
        source: computed
        description: Count of PublicComment rows for this plan
        default: 0
      - name: adequacy_status
        type: enum
        source: computed
        description: calculations.participation_adequacy output, evaluated on close
        default: PENDING
        constraints: "one of {PENDING, COMPLIANT, DEFICIENT}"
      - name: deficiency_codes
        type: array
        source: computed
        description: Ordered subset of {SHORT_COMMENT_PERIOD, NO_ACCESSIBLE_MEETING, MISSING_TRANSLATION, LANGUAGE_ACCESS_GAP}
        default: []
      - name: status
        type: enum
        source: computed
        description: Participation lifecycle state (state_machines.ParticipationPlan)
        default: PLANNED
        constraints: "one of {PLANNED, OPEN, EXTENDED, CLOSED, CANCELLED}"

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Venue name
      - name: address
        type: string
        source: input
        description: Street address
      - name: capacity
        type: integer
        source: input
        description: Seated capacity
        constraints: ">= 1"
      - name: transit_accessible
        type: boolean
        source: input
        description: Within 400 m of a scheduled transit stop
      - name: ada_accessible
        type: boolean
        source: input
        description: Meets ADA physical-access requirements
      - name: interpretation_capable
        type: boolean
        source: input
        description: Has simultaneous-interpretation equipment
      - name: status
        type: enum
        source: input
        description: Bookability of the venue
        default: ACTIVE
        constraints: "one of {ACTIVE, DECOMMISSIONED}"
      - name: booked_meeting_count
        type: integer
        source: computed
        description: Slot-occupancy ledger - count of PublicMeeting rows at this venue with status SCHEDULED
        default: 0

  - name: PublicMeeting
    parent: null
    common_fields: true
    fields:
      - name: participation_plan_id
        type: string
        source: input
        description: FK -> ParticipationPlan.id; the comment period this meeting belongs to
      - name: venue_id
        type: string
        source: input
        description: FK -> Venue.id; the reserved meeting location
      - name: starts_at
        type: datetime
        source: input
        description: Meeting start, ISO 8601 UTC
      - name: ends_at
        type: datetime
        source: input
        description: Meeting end, ISO 8601 UTC; must be strictly after starts_at
      - name: interpretation_languages
        type: array
        source: input
        description: ISO 639-1 codes interpreted live at this meeting
        default: []
      - name: accessibility_verified
        type: boolean
        source: computed
        description: True when the venue had both ada_accessible and transit_accessible true at booking time
        default: false
      - name: status
        type: enum
        source: computed
        description: SCHEDULED until cancelled directly or by an application withdrawal cascade
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CANCELLED}"

  - name: PublicComment
    parent: null
    common_fields: false
    fields:
      - name: participation_plan_id
        type: string
        source: input
        description: FK -> ParticipationPlan.id; the comment period the comment was filed in
      - name: submitter_name
        type: string
        source: input
        description: Name given by the commenter
      - name: language
        type: string
        source: input
        description: ISO 639-1 code the comment was written in
        constraints: 2-char lower-case code
      - name: body
        type: string
        source: input
        description: Comment text
        constraints: 1-4000 chars
      - name: requires_response
        type: boolean
        source: input
        description: Commenter requested a written agency response
        default: false
      - name: in_required_language
        type: boolean
        source: computed
        description: True when language is "en" or a member of the plan's translated_languages at filing time
        default: true

  - name: PermitCondition
    parent: null
    common_fields: true
    fields:
      - name: permit_application_id
        type: string
        source: input
        description: FK -> PermitApplication.id; the application this condition is attached to
      - name: condition_type
        type: enum
        source: input
        description: Condition family; sets the efficacy factor used for mitigation credit
        constraints: "one of {ADDITIONAL_CONTROL, MONITORING, COMMUNITY_BENEFIT}"
      - name: reduction_tpy
        type: number
        source: input
        description: Claimed emissions reduction in tons per year
        default: 0.00
        constraints: ">= 0; 2 decimals"
      - name: enforceable
        type: boolean
        source: input
        description: Whether the condition is written as a federally enforceable limit
        default: false
      - name: monitoring_frequency
        type: enum
        source: input
        description: Required when condition_type is MONITORING
        default: null
        constraints: "one of {CONTINUOUS, QUARTERLY, ANNUAL} when present"
      - name: benefit_value_usd
        type: number
        source: input
        description: Required when condition_type is COMMUNITY_BENEFIT; committed community benefit value
        default: null
        constraints: ">= 0; 2 decimals when present"
      - name: credit_tpy
        type: number
        source: computed
        description: Per-condition mitigation credit, rounded to 2 decimals before any summation
        default: 0.00
      - name: status
        type: enum
        source: computed
        description: ACTIVE until deleted or voided by a withdrawal cascade
        default: ACTIVE
        constraints: "one of {ACTIVE, VOIDED}"
      - name: application_version_after
        type: integer
        source: computed
        description: Provenance stamp - PermitApplication.version observed immediately after this condition's latest state change

  - name: PermitDecision
    parent: null
    common_fields: true
    fields:
      - name: permit_application_id
        type: string
        source: input
        description: FK -> PermitApplication.id; the application decided
      - name: disposition
        type: enum
        source: input
        description: Requested disposition
        constraints: "one of {ISSUE, DENY}"
      - name: denial_basis
        type: enum
        source: input
        description: Required when disposition is DENY
        default: null
        constraints: "one of {UNMITIGABLE_DISPROPORTIONATE_IMPACT, INADEQUATE_PARTICIPATION, INCOMPLETE_ASSESSMENT} when present"
      - name: community_benefit_base_usd
        type: number
        source: input
        description: Base community benefit commitment; required on ISSUE when the area is designated
        default: null
        constraints: ">= 0; 2 decimals when present"
      - name: community_benefit_surcharge_usd
        type: number
        source: computed
        description: calculations.community_benefit_obligation surcharge term
        default: 0.00
      - name: community_benefit_total_usd
        type: number
        source: computed
        description: calculations.community_benefit_obligation total term
        default: 0.00
      - name: residual_index_at_decision
        type: number
        source: computed
        description: PermitApplication.residual_impact_index snapshot at decision time
      - name: approved_net_emissions_tpy
        type: number
        source: computed
        description: Net emissions booked to the facility and area ledgers, 0.00 for DENY
        default: 0.00
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the PermitManager who decided
      - name: status
        type: enum
        source: computed
        description: Decision lifecycle state (state_machines.PermitDecision)
        constraints: "one of {ISSUED, DENIED, RESCINDED}"

  - name: CommunityComplaint
    parent: null
    common_fields: true
    fields:
      - name: screening_area_id
        type: string
        source: input
        description: FK -> ScreeningArea.id; block group the complaint is about
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; suspected source, null when the complainant could not name one
        default: null
      - name: complaint_type
        type: enum
        source: input
        description: Nuisance or release category
        constraints: "one of {ODOR, DUST, NOISE, WATER_DISCHARGE, ILLEGAL_DUMPING, SMOKE}"
      - name: severity
        type: enum
        source: input
        description: Intake severity as recorded by the taker
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: description
        type: string
        source: input
        description: Complaint narrative
        constraints: 1-2000 chars
      - name: submitter_language
        type: string
        source: input
        description: ISO 639-1 code the complaint was filed in
        default: "en"
      - name: repeat_count_180d
        type: integer
        source: computed
        description: Prior non-dismissed complaints of the same type in the same area inside the trailing window
        default: 0
      - name: priority_score
        type: number
        source: computed
        description: calculations.inspection_priority_score output
        default: 0.00
      - name: priority_tier
        type: enum
        source: computed
        description: Tier derived from priority_score
        default: TIER_3
        constraints: "one of {TIER_1, TIER_2, TIER_3}"
      - name: reopen_count
        type: integer
        source: computed
        description: Number of RESOLVED -> TRIAGED reopen loops
        default: 0
      - name: status
        type: enum
        source: computed
        description: Complaint lifecycle state (state_machines.CommunityComplaint)
        default: RECEIVED
        constraints: "one of {RECEIVED, TRIAGED, INSPECTION_ASSIGNED, INSPECTED, RESOLVED, REFERRED_ENFORCEMENT, DISMISSED}"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: community_complaint_id
        type: string
        source: input
        description: FK -> CommunityComplaint.id; the complaint that earned this inspection
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; copied from the selected complaint's facility_id
      - name: inspector_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the Inspector the visit is assigned to
      - name: scheduled_date
        type: string
        source: input
        description: Visit date, ISO date (UTC)
      - name: priority_score_at_assignment
        type: number
        source: computed
        description: CommunityComplaint.priority_score snapshot when the selector picked it
      - name: finding
        type: enum
        source: computed
        description: Field result recorded on completion, null while SCHEDULED
        default: null
        constraints: "one of {NO_VIOLATION, VIOLATION_CONFIRMED} when present"
      - name: status
        type: enum
        source: computed
        description: Inspection lifecycle state (state_machines.Inspection)
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED}"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: PermitApplication
    state_field: status
    initial_state: DRAFT
    terminal_states: [DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ej/permit-applications/{id}/submit"
        actor: ApplicantRepresentative
        preconditions:
          - "X-User-ID == PermitApplication.facility_id"
          - "PermitApplication.status == DRAFT"
        side_effects:
          - "increments PermitApplication.version by 1"

      - from: SUBMITTED
        to: STANDARD_REVIEW
        trigger: "POST /ej/permit-applications/{id}/screen"
        actor: EJAnalyst
        preconditions:
          - "PermitApplication.status == SUBMITTED"
          - "calculations.applicability_determination yields trigger_codes == [] (result STANDARD)"
        side_effects:
          - "creates ApplicabilityDetermination{result: STANDARD, trigger_codes: [], revision_round: PermitApplication.revision_round}"
          - "sets PermitApplication.review_track = STANDARD"
          - "increments PermitApplication.version by 1"
        note: "Branch A of the fork - no ParticipationPlan and no assessment are required on this path."

      - from: SUBMITTED
        to: ENHANCED_REVIEW
        trigger: "POST /ej/permit-applications/{id}/screen"
        actor: EJAnalyst
        preconditions:
          - "PermitApplication.status == SUBMITTED"
          - "calculations.applicability_determination yields at least one trigger code (result ENHANCED_REQUIRED)"
        side_effects:
          - "creates ApplicabilityDetermination{result: ENHANCED_REQUIRED, trigger_codes: <fired codes>}"
          - "sets PermitApplication.review_track = ENHANCED"
          - "creates ParticipationPlan{status: PLANNED, required_comment_days: calculations.required_comment_days} when the application has no ParticipationPlan with status != CANCELLED; otherwise recomputes required_comment_days on the existing plan"
          - "increments PermitApplication.version by 1"
        note: "Branch B of the fork - divergent side-effect set: a participation plan is created and an accepted assessment becomes mandatory."

      - from: STANDARD_REVIEW
        to: ENHANCED_REVIEW
        trigger: "system: ScreeningArea.designation escalated to OVERBURDENED or SEVERELY_OVERBURDENED (cascade from POST /ej/burden-indicators)"
        actor: system
        preconditions:
          - "PermitApplication.status == STANDARD_REVIEW"
          - "the application's Facility.screening_area_id == the escalating ScreeningArea.id"
        side_effects:
          - "creates ApplicabilityDetermination{result: ENHANCED_REQUIRED, trigger_codes: includes DESIGNATION, determined_by_user_id: \"system\"}"
          - "sets PermitApplication.review_track = ENHANCED"
          - "creates ParticipationPlan{status: PLANNED, required_comment_days: calculations.required_comment_days}"
          - "increments PermitApplication.version by 1"

      - from: STANDARD_REVIEW
        to: PENDING_DECISION
        trigger: "POST /ej/permit-applications/{id}/advance-to-decision"
        actor: EJAnalyst
        preconditions:
          - "PermitApplication.status == STANDARD_REVIEW"
          - "PermitApplication.review_track == STANDARD"
        side_effects:
          - "increments PermitApplication.version by 1"

      - from: ENHANCED_REVIEW
        to: PENDING_DECISION
        trigger: "POST /ej/permit-applications/{id}/advance-to-decision"
        actor: EJAnalyst
        preconditions:
          - "PermitApplication.status == ENHANCED_REVIEW"
          - "the governing CumulativeImpactAssessment (calculations.governing_assessment_selector) exists and its status == ACCEPTED"
          - "the application's ParticipationPlan (ParticipationPlan.permit_application_id == PermitApplication.id, status != CANCELLED) has status == CLOSED"
        side_effects:
          - "recomputes PermitApplication.residual_impact_index (calculations.residual_impact_index)"
          - "increments PermitApplication.version by 1"

      - from: ENHANCED_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /ej/permit-applications/{id}/return-for-revision"
        actor: EJAnalyst
        preconditions:
          - "PermitApplication.status IN {ENHANCED_REVIEW, PENDING_DECISION}"
        side_effects:
          - "every CumulativeImpactAssessment of this application with status IN {SUBMITTED_FOR_QA, ACCEPTED} -> INVALIDATED"
          - "recomputes PermitApplication.pre_mitigation_index and residual_impact_index"
          - "increments PermitApplication.version by 1"

      - from: PENDING_DECISION
        to: RETURNED_FOR_REVISION
        trigger: "POST /ej/permit-applications/{id}/return-for-revision"
        actor: EJAnalyst
        preconditions:
          - "PermitApplication.status IN {ENHANCED_REVIEW, PENDING_DECISION}"
        side_effects:
          - "every CumulativeImpactAssessment of this application with status IN {SUBMITTED_FOR_QA, ACCEPTED} -> INVALIDATED"
          - "recomputes PermitApplication.pre_mitigation_index and residual_impact_index"
          - "increments PermitApplication.version by 1"

      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /ej/permit-applications/{id}/resubmit"
        actor: ApplicantRepresentative
        preconditions:
          - "X-User-ID == PermitApplication.facility_id"
          - "PermitApplication.status == RETURNED_FOR_REVISION"
        side_effects:
          - "increments PermitApplication.revision_round by 1"
          - "sets PermitApplication.screening_stale_flag = false"
          - "every CumulativeImpactAssessment of this application with status IN {DRAFT, SUBMITTED_FOR_QA, RETURNED, ACCEPTED, INVALIDATED} -> VOIDED"
          - "the application's ParticipationPlan with status == CLOSED -> OPEN via calculations.plan_reopen_extension"
          - "recomputes PermitApplication.pre_mitigation_index and residual_impact_index"
          - "increments PermitApplication.version by 1"
        note: "Closes the revision cycle: RETURNED_FOR_REVISION -> SUBMITTED -> (screen) -> ENHANCED_REVIEW."

      - from: PENDING_DECISION
        to: ISSUED
        trigger: "POST /ej/permit-decisions with disposition ISSUE"
        actor: PermitManager
        preconditions:
          - "PermitApplication.status == PENDING_DECISION"
          - "X-User-ID NOT IN {governing assessment.author_user_id, governing assessment.qa_user_id}"
          - "for review_track ENHANCED: ParticipationPlan.adequacy_status == COMPLIANT"
          - "PermitApplication.residual_impact_index < DENIAL_THRESHOLD"
          - "calculations.community_benefit_obligation total >= its minimum when the area is designated"
          - "ScreeningArea.permitted_load_tpy + approved_net_emissions_tpy <= round(AREA_LOAD_CAP_MULTIPLIER * ScreeningArea.baseline_load_tpy, 2)"
        side_effects:
          - "creates PermitDecision{status: ISSUED, approved_net_emissions_tpy, community_benefit_surcharge_usd, community_benefit_total_usd, residual_index_at_decision}"
          - "sets PermitApplication.approved_net_emissions_tpy = round(max(0.00, proposed_emissions_tpy - total_mitigation_credit_tpy), 2)"
          - "increments Facility.existing_load_tpy by PermitApplication.approved_net_emissions_tpy"
          - "increments ScreeningArea.permitted_load_tpy by PermitApplication.approved_net_emissions_tpy"
          - "increments PermitApplication.version by 1"

      - from: PENDING_DECISION
        to: DENIED
        trigger: "POST /ej/permit-decisions with disposition DENY"
        actor: PermitManager
        preconditions:
          - "PermitApplication.status == PENDING_DECISION"
          - "X-User-ID NOT IN {governing assessment.author_user_id, governing assessment.qa_user_id}"
          - "denial_basis is present and supported (UNMITIGABLE_DISPROPORTIONATE_IMPACT requires residual_impact_index >= DENIAL_THRESHOLD; INADEQUATE_PARTICIPATION requires ParticipationPlan.adequacy_status == DEFICIENT; INCOMPLETE_ASSESSMENT requires governing assessment data_confidence == LOW)"
        side_effects:
          - "creates PermitDecision{status: DENIED, approved_net_emissions_tpy: 0.00, residual_index_at_decision}"
          - "leaves Facility.existing_load_tpy and ScreeningArea.permitted_load_tpy unchanged"
          - "increments PermitApplication.version by 1"

      - from: PENDING_DECISION
        to: ENHANCED_REVIEW
        trigger: "system: the governing CumulativeImpactAssessment was INVALIDATED by the ScreeningArea data_status STALE cascade (POST /ej/inspections/{id}/complete with finding VIOLATION_CONFIRMED)"
        actor: system
        preconditions:
          - "PermitApplication.status == PENDING_DECISION"
          - "PermitApplication.review_track == ENHANCED"
          - "the governing CumulativeImpactAssessment transitioned ACCEPTED -> INVALIDATED in this cascade"
        side_effects:
          - "sets PermitApplication.screening_stale_flag = true"
          - "recomputes PermitApplication.pre_mitigation_index and residual_impact_index"
          - "increments PermitApplication.version by 1"

      - from: ISSUED
        to: ENHANCED_REVIEW
        trigger: "POST /ej/permit-decisions/{id}/rescind on an ENHANCED-track application"
        actor: PermitManager
        preconditions:
          - "PermitDecision.status == ISSUED"
          - "PermitApplication.status == ISSUED"
          - "PermitApplication.review_track == ENHANCED"
        side_effects:
          - "sets PermitDecision.status = RESCINDED"
          - "decrements Facility.existing_load_tpy by PermitApplication.approved_net_emissions_tpy"
          - "decrements ScreeningArea.permitted_load_tpy by PermitApplication.approved_net_emissions_tpy"
          - "sets PermitApplication.approved_net_emissions_tpy = 0.00"
          - "the governing CumulativeImpactAssessment with status ACCEPTED -> INVALIDATED"
          - "the application's ParticipationPlan with status == CLOSED -> OPEN via calculations.plan_reopen_extension"
          - "increments PermitApplication.version by 1"

      - from: ISSUED
        to: STANDARD_REVIEW
        trigger: "POST /ej/permit-decisions/{id}/rescind on a STANDARD-track application"
        actor: PermitManager
        preconditions:
          - "PermitDecision.status == ISSUED"
          - "PermitApplication.status == ISSUED"
          - "PermitApplication.review_track == STANDARD"
        side_effects:
          - "sets PermitDecision.status = RESCINDED"
          - "decrements Facility.existing_load_tpy by PermitApplication.approved_net_emissions_tpy"
          - "decrements ScreeningArea.permitted_load_tpy by PermitApplication.approved_net_emissions_tpy"
          - "sets PermitApplication.approved_net_emissions_tpy = 0.00"
          - "increments PermitApplication.version by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /ej/permit-applications/{id}/withdraw"
        actor: ApplicantRepresentative
        preconditions:
          - "X-User-ID == PermitApplication.facility_id"
          - "PermitApplication.status IN {DRAFT, SUBMITTED, STANDARD_REVIEW, ENHANCED_REVIEW, PENDING_DECISION, RETURNED_FOR_REVISION}"
        side_effects:
          - "increments PermitApplication.version by 1"

      - from: ENHANCED_REVIEW
        to: WITHDRAWN
        trigger: "POST /ej/permit-applications/{id}/withdraw"
        actor: ApplicantRepresentative
        preconditions:
          - "X-User-ID == PermitApplication.facility_id"
          - "PermitApplication.status IN {DRAFT, SUBMITTED, STANDARD_REVIEW, ENHANCED_REVIEW, PENDING_DECISION, RETURNED_FOR_REVISION}"
        side_effects:
          - "the application's ParticipationPlan with status IN {PLANNED, OPEN, EXTENDED, CLOSED} -> CANCELLED"
          - "every PublicMeeting of that plan with status SCHEDULED -> CANCELLED, each decrementing its Venue.booked_meeting_count by 1"
          - "every CumulativeImpactAssessment with status IN {DRAFT, SUBMITTED_FOR_QA, RETURNED, ACCEPTED} -> VOIDED"
          - "every PermitCondition with status ACTIVE -> VOIDED"
          - "recomputes PermitApplication.total_mitigation_credit_tpy, pre_mitigation_index, residual_impact_index"
          - "recomputes ScreeningArea.open_plan_count"
          - "increments PermitApplication.version by 1"
        note: "Same withdraw endpoint; this row spells out the full ENHANCED-track cascade."

  - entity: ScreeningArea
    state_field: designation
    initial_state: UNDESIGNATED
    terminal_states: []
    transitions:
      - from: UNDESIGNATED
        to: OVERBURDENED
        trigger: "system: calculations.designation re-evaluated after POST /ej/burden-indicators, POST /ej/screening-areas/{id}/recertify, or an enforcement-point cascade"
        actor: system
        preconditions:
          - "DESIGNATION_THRESHOLD <= ej_screen_score_statewide < SEVERE_THRESHOLD"
        side_effects:
          - "every PermitApplication in status STANDARD_REVIEW at a Facility in this area -> ENHANCED_REVIEW (see PermitApplication machine)"
          - "recomputes calculations.required_comment_days on every ParticipationPlan of this area's applications whose status IN {PLANNED, OPEN, EXTENDED}"
          - "increments ScreeningArea.version by 1"
      - from: OVERBURDENED
        to: SEVERELY_OVERBURDENED
        trigger: "system: calculations.designation re-evaluated"
        actor: system
        preconditions:
          - "ej_screen_score_statewide >= SEVERE_THRESHOLD"
        side_effects:
          - "recomputes calculations.required_comment_days on every ParticipationPlan of this area's applications whose status IN {PLANNED, OPEN, EXTENDED}"
          - "lowers the area's concurrent-open-plan cap to MAX_CONCURRENT_OPEN_PLANS_SEVERE for future opens"
          - "increments ScreeningArea.version by 1"
      - from: SEVERELY_OVERBURDENED
        to: OVERBURDENED
        trigger: "system: calculations.designation re-evaluated after a superseding indicator lowers ej_screen_score_statewide"
        actor: system
        preconditions:
          - "DESIGNATION_THRESHOLD <= ej_screen_score_statewide < SEVERE_THRESHOLD"
        side_effects:
          - "recomputes calculations.required_comment_days on every ParticipationPlan of this area's applications whose status IN {PLANNED, OPEN, EXTENDED}"
          - "increments ScreeningArea.version by 1"
      - from: OVERBURDENED
        to: UNDESIGNATED
        trigger: "system: calculations.designation re-evaluated after a superseding indicator lowers ej_screen_score_statewide"
        actor: system
        preconditions:
          - "ej_screen_score_statewide < DESIGNATION_THRESHOLD"
        side_effects:
          - "already-ENHANCED applications keep review_track ENHANCED (de-designation never downgrades an in-flight review)"
          - "increments ScreeningArea.version by 1"
        note: "Cycle: UNDESIGNATED -> OVERBURDENED -> UNDESIGNATED is reachable through indicator supersession."

  - entity: ScreeningArea
    state_field: data_status
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: STALE
        trigger: "system: ScreeningArea.enforcement_burden_points increased by the inspection-violation cascade"
        actor: system
        preconditions:
          - "a Facility in this area flipped compliance_status to VIOLATION_ON_RECORD in this cascade"
        side_effects:
          - "every CumulativeImpactAssessment with status ACCEPTED belonging to an application at a Facility in this area -> INVALIDATED"
          - "each such application sets screening_stale_flag = true and, when in PENDING_DECISION, regresses to ENHANCED_REVIEW"
          - "increments ScreeningArea.version by 1"
        note: "Second, independent state dimension: designation is unaffected by this transition except through the recomputed score."
      - from: STALE
        to: CURRENT
        trigger: "POST /ej/screening-areas/{id}/recertify"
        actor: ProgramAdmin
        preconditions:
          - "ScreeningArea.data_status == STALE"
        side_effects:
          - "recomputes both variants of calculations.ej_screen_score and re-evaluates calculations.designation"
          - "increments ScreeningArea.version by 1"

  - entity: CumulativeImpactAssessment
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED_FOR_QA
        trigger: "POST /ej/cumulative-impact-assessments/{id}/submit-qa"
        actor: EJAnalyst
        preconditions:
          - "CumulativeImpactAssessment.status == DRAFT"
          - "PermitApplication.status IN {ENHANCED_REVIEW, PENDING_DECISION}"
        side_effects:
          - "increments CumulativeImpactAssessment.version by 1"
      - from: SUBMITTED_FOR_QA
        to: ACCEPTED
        trigger: "POST /ej/cumulative-impact-assessments/{id}/qa-decision with outcome ACCEPT"
        actor: QAReviewer
        preconditions:
          - "CumulativeImpactAssessment.status == SUBMITTED_FOR_QA"
          - "X-User-ID != CumulativeImpactAssessment.author_user_id"
        side_effects:
          - "sets qa_user_id = X-User-ID"
          - "any other CumulativeImpactAssessment of the same application with status ACCEPTED -> SUPERSEDED"
          - "sets PermitApplication.pre_mitigation_index = this assessment's cumulative_impact_index and recomputes residual_impact_index"
          - "recomputes calculations.required_comment_days on the application's ParticipationPlan when its status IN {PLANNED, OPEN, EXTENDED}"
          - "increments PermitApplication.version by 1"
          - "increments CumulativeImpactAssessment.version by 1"
      - from: SUBMITTED_FOR_QA
        to: RETURNED
        trigger: "POST /ej/cumulative-impact-assessments/{id}/qa-decision with outcome RETURN"
        actor: QAReviewer
        preconditions:
          - "CumulativeImpactAssessment.status == SUBMITTED_FOR_QA"
          - "X-User-ID != CumulativeImpactAssessment.author_user_id"
        side_effects:
          - "sets qa_user_id = X-User-ID"
          - "increments CumulativeImpactAssessment.version by 1"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /ej/cumulative-impact-assessments/{id}/revise"
        actor: EJAnalyst
        preconditions:
          - "CumulativeImpactAssessment.status == RETURNED"
        side_effects:
          - "sets author_user_id = X-User-ID"
          - "recomputes calculations.cumulative_impact_index with the current method inputs and the area's current scores"
          - "increments CumulativeImpactAssessment.version by 1"
        note: "Cycle: DRAFT -> SUBMITTED_FOR_QA -> RETURNED -> DRAFT."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /ej/cumulative-impact-assessments (a newer assessment is created for the same application)"
        actor: EJAnalyst
        preconditions:
          - "an existing assessment of this application has status IN {DRAFT, RETURNED}"
        side_effects:
          - "increments CumulativeImpactAssessment.version by 1"
      - from: RETURNED
        to: SUPERSEDED
        trigger: "POST /ej/cumulative-impact-assessments (a newer assessment is created for the same application)"
        actor: EJAnalyst
        preconditions:
          - "an existing assessment of this application has status IN {DRAFT, RETURNED}"
        side_effects:
          - "increments CumulativeImpactAssessment.version by 1"
      - from: ACCEPTED
        to: INVALIDATED
        trigger: "system: ScreeningArea.data_status CURRENT -> STALE cascade, POST /ej/permit-applications/{id}/return-for-revision, or POST /ej/permit-decisions/{id}/rescind"
        actor: system
        preconditions:
          - "CumulativeImpactAssessment.status == ACCEPTED"
        side_effects:
          - "recomputes PermitApplication.pre_mitigation_index and residual_impact_index"
          - "increments CumulativeImpactAssessment.version by 1"
      - from: SUBMITTED_FOR_QA
        to: INVALIDATED
        trigger: "POST /ej/permit-applications/{id}/return-for-revision"
        actor: system
        preconditions:
          - "CumulativeImpactAssessment.status == SUBMITTED_FOR_QA"
        side_effects:
          - "increments CumulativeImpactAssessment.version by 1"
      - from: ACCEPTED
        to: VOIDED
        trigger: "system: POST /ej/permit-applications/{id}/resubmit or .../withdraw"
        actor: system
        preconditions:
          - "CumulativeImpactAssessment.status IN {DRAFT, SUBMITTED_FOR_QA, RETURNED, ACCEPTED, INVALIDATED}"
        side_effects:
          - "recomputes PermitApplication.pre_mitigation_index and residual_impact_index"
          - "increments CumulativeImpactAssessment.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "system: POST /ej/permit-applications/{id}/resubmit or .../withdraw"
        actor: system
        preconditions:
          - "CumulativeImpactAssessment.status IN {DRAFT, SUBMITTED_FOR_QA, RETURNED, ACCEPTED, INVALIDATED}"
        side_effects:
          - "increments CumulativeImpactAssessment.version by 1"
      - from: INVALIDATED
        to: VOIDED
        trigger: "system: POST /ej/permit-applications/{id}/resubmit or .../withdraw"
        actor: system
        preconditions:
          - "CumulativeImpactAssessment.status IN {DRAFT, SUBMITTED_FOR_QA, RETURNED, ACCEPTED, INVALIDATED}"
        side_effects:
          - "increments CumulativeImpactAssessment.version by 1"

  - entity: ParticipationPlan
    state_field: status
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /ej/participation-plans/{id}/open"
        actor: CommunityLiaison
        preconditions:
          - "ParticipationPlan.status == PLANNED"
          - "comment_start_date >= current logical clock date (UTC)"
          - "opening keeps the area within calculations.area_engagement_capacity"
        side_effects:
          - "sets comment_end_date = comment_start_date + required_comment_days + granted_extension_days - 1 day"
          - "increments ScreeningArea.open_plan_count by 1"
          - "increments ParticipationPlan.version by 1"
      - from: OPEN
        to: EXTENDED
        trigger: "POST /ej/participation-plans/{id}/extend"
        actor: CommunityLiaison
        preconditions:
          - "ParticipationPlan.status IN {OPEN, EXTENDED}"
          - "required_comment_days + granted_extension_days + additional_days <= MAX_COMMENT_DAYS"
          - "the extended window keeps the area within calculations.area_engagement_capacity"
        side_effects:
          - "increments granted_extension_days by additional_days"
          - "sets comment_end_date = comment_end_date + additional_days"
          - "increments ParticipationPlan.version by 1"
      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /ej/participation-plans/{id}/extend"
        actor: CommunityLiaison
        preconditions:
          - "ParticipationPlan.status IN {OPEN, EXTENDED}"
          - "required_comment_days + granted_extension_days + additional_days <= MAX_COMMENT_DAYS"
        side_effects:
          - "increments granted_extension_days by additional_days"
          - "sets comment_end_date = comment_end_date + additional_days"
          - "increments ParticipationPlan.version by 1"
        note: "Self-loop: extensions may be granted repeatedly up to the day cap."
      - from: OPEN
        to: CLOSED
        trigger: "POST /ej/participation-plans/{id}/close"
        actor: CommunityLiaison
        preconditions:
          - "ParticipationPlan.status IN {OPEN, EXTENDED}"
          - "current logical clock date (UTC) > comment_end_date"
        side_effects:
          - "computes calculations.participation_adequacy -> adequacy_status and deficiency_codes"
          - "decrements ScreeningArea.open_plan_count by 1"
          - "increments ParticipationPlan.version by 1"
      - from: EXTENDED
        to: CLOSED
        trigger: "POST /ej/participation-plans/{id}/close"
        actor: CommunityLiaison
        preconditions:
          - "ParticipationPlan.status IN {OPEN, EXTENDED}"
          - "current logical clock date (UTC) > comment_end_date"
        side_effects:
          - "computes calculations.participation_adequacy -> adequacy_status and deficiency_codes"
          - "decrements ScreeningArea.open_plan_count by 1"
          - "increments ParticipationPlan.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "system: POST /ej/permit-applications/{id}/resubmit or POST /ej/permit-decisions/{id}/rescind"
        actor: system
        preconditions:
          - "ParticipationPlan.status == CLOSED"
        side_effects:
          - "applies calculations.plan_reopen_extension to granted_extension_days and comment_end_date"
          - "sets adequacy_status = PENDING and deficiency_codes = []"
          - "increments ScreeningArea.open_plan_count by 1"
          - "increments ParticipationPlan.version by 1"
        note: "Cycle: OPEN -> CLOSED -> OPEN."
      - from: OPEN
        to: CANCELLED
        trigger: "system: POST /ej/permit-applications/{id}/withdraw"
        actor: system
        preconditions:
          - "ParticipationPlan.status IN {PLANNED, OPEN, EXTENDED, CLOSED}"
        side_effects:
          - "every PublicMeeting of this plan with status SCHEDULED -> CANCELLED (each decrements Venue.booked_meeting_count by 1)"
          - "decrements ScreeningArea.open_plan_count by 1 when the prior status was OPEN or EXTENDED"
          - "increments ParticipationPlan.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "system: POST /ej/permit-applications/{id}/withdraw"
        actor: system
        preconditions:
          - "ParticipationPlan.status IN {PLANNED, OPEN, EXTENDED, CLOSED}"
        side_effects:
          - "increments ParticipationPlan.version by 1"
      - from: CLOSED
        to: CANCELLED
        trigger: "system: POST /ej/permit-applications/{id}/withdraw"
        actor: system
        preconditions:
          - "ParticipationPlan.status IN {PLANNED, OPEN, EXTENDED, CLOSED}"
        side_effects:
          - "increments ParticipationPlan.version by 1"

  - entity: PublicMeeting
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ej/public-meetings/{id}/cancel"
        actor: CommunityLiaison
        preconditions:
          - "PublicMeeting.status == SCHEDULED"
        side_effects:
          - "decrements Venue.booked_meeting_count by 1"
          - "decrements ParticipationPlan.meeting_count by 1"
          - "releases the buffer-expanded interval so a previously conflicting booking succeeds"
          - "increments PublicMeeting.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: POST /ej/permit-applications/{id}/withdraw cascade through ParticipationPlan -> CANCELLED"
        actor: system
        preconditions:
          - "PublicMeeting.status == SCHEDULED"
        side_effects:
          - "decrements Venue.booked_meeting_count by 1"
          - "decrements ParticipationPlan.meeting_count by 1"
          - "increments PublicMeeting.version by 1"

  - entity: PermitDecision
    state_field: status
    initial_state: ISSUED
    terminal_states: [DENIED, RESCINDED]
    transitions:
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /ej/permit-decisions/{id}/rescind"
        actor: PermitManager
        preconditions:
          - "PermitDecision.status == ISSUED"
        side_effects:
          - "reverses both emissions ledgers and returns the PermitApplication to ENHANCED_REVIEW or STANDARD_REVIEW by review_track"
          - "increments PermitDecision.version by 1"
        note: "A DENIED decision is created directly in the DENIED state and is terminal; only ISSUED decisions are rescindable."

  - entity: CommunityComplaint
    state_field: status
    initial_state: RECEIVED
    terminal_states: [DISMISSED, REFERRED_ENFORCEMENT]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /ej/community-complaints/{id}/triage with outcome ACCEPT"
        actor: EJAnalyst
        preconditions:
          - "CommunityComplaint.status == RECEIVED"
        side_effects:
          - "recomputes calculations.inspection_priority_score and priority_tier"
          - "increments CommunityComplaint.version by 1"
      - from: RECEIVED
        to: DISMISSED
        trigger: "POST /ej/community-complaints/{id}/triage with outcome DISMISS"
        actor: EJAnalyst
        preconditions:
          - "CommunityComplaint.status == RECEIVED"
          - "dismissal_reason is present"
        side_effects:
          - "decrements ScreeningArea.open_complaint_count by 1"
          - "increments CommunityComplaint.version by 1"
      - from: TRIAGED
        to: INSPECTION_ASSIGNED
        trigger: "POST /ej/inspections/assign-next (this complaint won calculations.next_inspection_selector)"
        actor: EJAnalyst
        preconditions:
          - "CommunityComplaint.status == TRIAGED"
          - "CommunityComplaint.facility_id IS NOT NULL"
          - "no Inspection row for this complaint has status SCHEDULED"
        side_effects:
          - "creates Inspection{status: SCHEDULED, priority_score_at_assignment: CommunityComplaint.priority_score}"
          - "increments CommunityComplaint.version by 1"
      - from: INSPECTION_ASSIGNED
        to: INSPECTED
        trigger: "POST /ej/inspections/{id}/complete"
        actor: Inspector
        preconditions:
          - "CommunityComplaint.status == INSPECTION_ASSIGNED"
          - "Inspection.status == SCHEDULED"
        side_effects:
          - "when finding == VIOLATION_CONFIRMED, starts the facility -> area -> assessment -> application cascade"
          - "increments CommunityComplaint.version by 1"
      - from: INSPECTED
        to: RESOLVED
        trigger: "POST /ej/community-complaints/{id}/resolve with resolution RESOLVED"
        actor: EJAnalyst
        preconditions:
          - "CommunityComplaint.status == INSPECTED"
        side_effects:
          - "decrements ScreeningArea.open_complaint_count by 1"
          - "increments CommunityComplaint.version by 1"
      - from: INSPECTED
        to: REFERRED_ENFORCEMENT
        trigger: "POST /ej/community-complaints/{id}/resolve with resolution REFERRED_ENFORCEMENT"
        actor: EJAnalyst
        preconditions:
          - "CommunityComplaint.status == INSPECTED"
          - "the complaint's latest COMPLETED Inspection has finding == VIOLATION_CONFIRMED"
        side_effects:
          - "decrements ScreeningArea.open_complaint_count by 1"
          - "increments CommunityComplaint.version by 1"
      - from: RESOLVED
        to: TRIAGED
        trigger: "POST /ej/community-complaints/{id}/reopen"
        actor: CommunityLiaison
        preconditions:
          - "CommunityComplaint.status == RESOLVED"
        side_effects:
          - "increments reopen_count by 1"
          - "increments ScreeningArea.open_complaint_count by 1"
          - "recomputes calculations.inspection_priority_score and priority_tier"
          - "increments CommunityComplaint.version by 1"
        note: "Cycle: TRIAGED -> ... -> RESOLVED -> TRIAGED."

  - entity: Inspection
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /ej/inspections/{id}/complete"
        actor: Inspector
        preconditions:
          - "Inspection.status == SCHEDULED"
          - "X-User-ID == Inspection.inspector_user_id"
        side_effects:
          - "sets finding from the request"
          - "sets CommunityComplaint.status = INSPECTED"
          - "when finding == VIOLATION_CONFIRMED: sets Facility.compliance_status = VIOLATION_ON_RECORD and increments Facility.confirmed_violation_count by 1 (cascade link 1)"
          - "when finding == VIOLATION_CONFIRMED: that facility change increments ScreeningArea.enforcement_burden_points by ENFORCEMENT_POINTS_PER_VIOLATION, recomputes both ej_screen_score variants, re-evaluates designation, and sets data_status = STALE (cascade link 2)"
          - "when finding == VIOLATION_CONFIRMED: the STALE data_status invalidates every ACCEPTED CumulativeImpactAssessment of applications at facilities in that area (cascade link 3)"
          - "when finding == VIOLATION_CONFIRMED: each invalidated assessment regresses its application from PENDING_DECISION to ENHANCED_REVIEW and sets screening_stale_flag = true (cascade link 4)"
          - "increments Inspection.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: indicator-create-stale-area
    parent_entity: ScreeningArea
    write_endpoint: "POST /ej/burden-indicators"
    occ_field: "expected_screening_area_version"
    description: |
      Filing a BurdenIndicator against a ScreeningArea whose version has advanced
      since the client last observed it is rejected. A newly filed indicator
      legitimately supersedes the prior ACTIVE row for the same indicator_code and
      rewrites both ej_screen_score variants, so a writer working from a stale view
      of the area would silently supersede data it never saw.
    error_id: ERR_STALE_AREA_VERSION
    http_status: 412

  - rule_id: assessment-create-stale-application
    parent_entity: PermitApplication
    write_endpoint: "POST /ej/cumulative-impact-assessments"
    occ_field: "expected_application_version"
    description: |
      Creating a CumulativeImpactAssessment against a PermitApplication whose
      version has advanced since the client last observed it is rejected. A new
      assessment legitimately supersedes an existing DRAFT or RETURNED assessment
      and rewrites the application's pre_mitigation_index, so a stale view means the
      author is superseding an assessment or index they never read.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

  - rule_id: condition-create-stale-application
    parent_entity: PermitApplication
    write_endpoint: "POST /ej/permit-conditions"
    occ_field: "expected_application_version"
    description: |
      Attaching a PermitCondition to a PermitApplication whose version has advanced
      since the client last observed it is rejected. Every condition rewrites
      total_mitigation_credit_tpy and residual_impact_index, so an author working
      from a stale mitigation picture would size a control requirement against a
      residual index that no longer exists.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: ej_screen_score
    trigger: "On POST /ej/screening-areas (empty input set), on POST /ej/burden-indicators, on POST /ej/screening-areas/{id}/recertify, and on the enforcement-point cascade from POST /ej/inspections/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      # Input set (identical for both variants):
      #   BurdenIndicator rows with screening_area_id == area.id
      #     AND status == ACTIVE
      #     AND vintage_year >= clock_year - INDICATOR_VALIDITY_YEARS   (inclusive)
      #     AND vintage_year <= clock_year                              (inclusive)
      #   clock_year = calendar year (UTC) of the current logical clock.
      # percentile(i) = i.statewide_percentile   for variant STATEWIDE
      #               = i.county_percentile      for variant COUNTY
      #
      # Step 1 - component means, each rounded to 2 decimals BEFORE combination:
      component(cat) = 0.00                                  if no qualifying row has category == cat
                     = round(sum(percentile(i)) / count(i), 2)  over qualifying rows with category == cat
      # Step 2 - non-linear combination: the pollution/health burden term is scaled
      # by the demographic term (multiplicative EJ screening form).
      combined = ((POLLUTION_WEIGHT * component(POLLUTION))
                  + (HEALTH_WEIGHT * component(HEALTH)))
                 * (component(DEMOGRAPHIC) / 100)
      score_pre = round(combined, 2)
      # Step 3 - enforcement penalty, then clamp:
      score = round(min(100.00, score_pre
                        + ENFORCEMENT_POINT_WEIGHT * area.enforcement_burden_points), 2)
      # Writes: ej_screen_score_statewide (STATEWIDE), ej_screen_score_county (COUNTY),
      # the three *_component_statewide fields, and active_indicator_count
      # (= count of qualifying rows, both variants share it).
    input_set: "ACTIVE BurdenIndicator rows of the area whose vintage_year lies in [clock_year - INDICATOR_VALIDITY_YEARS, clock_year]; SUPERSEDED rows and out-of-window rows are excluded. Component means are unweighted over qualifying rows; no tie-break is needed because the mean is order-independent."
    constants:
      POLLUTION_WEIGHT: 0.55
      HEALTH_WEIGHT: 0.45
      ENFORCEMENT_POINT_WEIGHT: 0.50
      INDICATOR_VALIDITY_YEARS: 5
    precision: "components 2 decimals, score 2 decimals, round_half_up at each pinned step"
    variants:
      - name: STATEWIDE
        when: "Used for calculations.designation, ApplicabilityDetermination snapshots and calculations.cumulative_impact_index"
        difference: "Reads BurdenIndicator.statewide_percentile; written to ej_screen_score_statewide"
      - name: COUNTY
        when: "Used only for calculations.inspection_priority_score"
        difference: "Reads BurdenIndicator.county_percentile; written to ej_screen_score_county. Identical rows produce a different number, so an area may be OVERBURDENED on the statewide basis while its complaints score low on the county basis"

  - name: designation
    trigger: "Immediately after every calculations.ej_screen_score run"
    algorithm: threshold
    formula: |
      if ej_screen_score_statewide >= SEVERE_THRESHOLD      -> SEVERELY_OVERBURDENED
      elif ej_screen_score_statewide >= DESIGNATION_THRESHOLD -> OVERBURDENED
      else                                                   -> UNDESIGNATED
      # Both comparisons are >= (a score of exactly 65.00 designates the area).
      translation_required = (limited_english_pct >= TRANSLATION_TRIGGER_PCT)
    input_set: "The area's own ej_screen_score_statewide only; never the COUNTY variant"
    constants:
      DESIGNATION_THRESHOLD: 65.00
      SEVERE_THRESHOLD: 80.00
      TRANSLATION_TRIGGER_PCT: 10.0
    precision: "comparison on the 2-decimal stored score, no re-rounding"

  - name: applicability_determination
    trigger: "On POST /ej/permit-applications/{id}/screen and on the designation-escalation cascade"
    algorithm: threshold
    formula: |
      trigger_codes = []   # appended in exactly this order
      if facility.facility_type IN ENHANCED_FACILITY_TYPES:                append "FACILITY_TYPE"
      if facility.distance_to_area_centroid_m <= PROXIMITY_TRIGGER_M:      append "PROXIMITY"
      if area.designation IN {OVERBURDENED, SEVERELY_OVERBURDENED}:        append "DESIGNATION"
      if application.proposed_emissions_tpy >= EMISSIONS_TRIGGER_TPY:      append "EMISSIONS_THRESHOLD"
      if facility.compliance_status == VIOLATION_ON_RECORD:                append "PRIOR_VIOLATION"
      result = "ENHANCED_REQUIRED" if len(trigger_codes) >= 1 else "STANDARD"
      area_designation_snapshot = area.designation
      ej_screen_score_snapshot  = area.ej_screen_score_statewide
    input_set: "The application's Facility, that facility's ScreeningArea, and the application's own proposed_emissions_tpy at screen time"
    constants:
      ENHANCED_FACILITY_TYPES: ["MAJOR_SOURCE", "INCINERATOR", "LANDFILL", "CHEMICAL_BULK_STORAGE"]
      PROXIMITY_TRIGGER_M: 800
      EMISSIONS_TRIGGER_TPY: 25.00
    precision: "integer metres, 2-decimal tons; both comparisons are <= / >= inclusive"

  - name: governing_assessment_selector
    trigger: "Whenever PermitApplication.pre_mitigation_index, residual_impact_index, advance-to-decision preconditions or decision preconditions are evaluated"
    algorithm: aggregation
    formula: |
      # Eligibility filter (candidate set):
      candidates = CumulativeImpactAssessment rows with permit_application_id == application.id
                   AND status IN {ACCEPTED, DRAFT, SUBMITTED_FOR_QA, RETURNED}
      # Ranking expression:
      #   rank 0 = status ACCEPTED, rank 1 = status IN {DRAFT, SUBMITTED_FOR_QA, RETURNED}
      #   order by rank ASC, then created_at DESC
      # Tie-break when two candidates share rank and created_at: version DESC.
      # Fallback when candidates is empty: governing assessment is null,
      #   pre_mitigation_index = 0.00 and residual_impact_index = 0.00.
      governing = first row of candidates under that ordering
      application.pre_mitigation_index = governing.cumulative_impact_index if governing else 0.00
    input_set: "All assessments of the application except SUPERSEDED, INVALIDATED and VOIDED rows"
    constants: {}
    precision: "2 decimals, copied without re-rounding"

  - name: cumulative_impact_index
    trigger: "On POST /ej/cumulative-impact-assessments and on POST /ej/cumulative-impact-assessments/{id}/revise"
    algorithm: weighted_scoring
    formula: |
      baseline_burden_score = area.ej_screen_score_statewide            # snapshot at compute time
      proposed_increment_pct = round(application.proposed_emissions_tpy
                                     / area.baseline_load_tpy * 100, 2)
      if method == "SCREENING_LEVEL":
          exposure_factor = 1.0000
      else:  # REFINED
          decay = 1.00 if receptor_distance_m <= 300
                  else 0.75 if receptor_distance_m <= 800
                  else 0.50
          exposure_factor = round(dispersion_factor * decay, 4)
      weighted_increment = round(proposed_increment_pct * exposure_factor
                                 * INCREMENT_WEIGHT, 2)
      index_pre = round(baseline_burden_score * BASELINE_WEIGHT + weighted_increment, 2)
      cumulative_impact_index = round(min(100.00, index_pre), 2)
      disproportionate_flag = (cumulative_impact_index >= DISPROPORTIONATE_THRESHOLD)
      data_confidence = "LOW" if (area.active_indicator_count == 0
                                  OR area.data_status == "STALE") else "HIGH"
      # Evaluation order is pinned: increment -> exposure -> weighted increment ->
      # index_pre -> clamp. Rounding happens exactly at the four marked points.
    input_set: "The application's proposed_emissions_tpy, the area's ej_screen_score_statewide / baseline_load_tpy / active_indicator_count / data_status, plus the assessment's own method inputs"
    constants:
      BASELINE_WEIGHT: 0.70
      INCREMENT_WEIGHT: 1.50
      DISPROPORTIONATE_THRESHOLD: 70.00
      REFINED_DECAY_NEAR_M: 300
      REFINED_DECAY_MID_M: 800
    precision: "4 decimals for exposure_factor, 2 decimals elsewhere, round_half_up"
    variants:
      - name: SCREENING_LEVEL
        when: "Default methodology - no dispersion modelling submitted"
        difference: "exposure_factor is pinned at 1.0000, so the full proposed increment is weighted"
      - name: REFINED
        when: "Applicant submits dispersion modelling (dispersion_factor and receptor_distance_m both required)"
        difference: "exposure_factor = round(dispersion_factor * distance decay, 4) attenuates the increment; identical application and area inputs therefore yield a strictly lower cumulative_impact_index and can flip disproportionate_flag from true to false"

  - name: mitigation_credit_aggregation
    trigger: "On POST /ej/permit-conditions, on DELETE /ej/permit-conditions/{id}, and on the withdrawal cascade that voids conditions"
    algorithm: aggregation
    formula: |
      # Per-condition credit - rounded to 2 decimals BEFORE any summation:
      credit_tpy(c) = round(c.reduction_tpy
                            * EFFICACY[c.condition_type]
                            * (1.00 if c.enforceable else 0.50), 2)
      # Aggregate over ACTIVE conditions only, in created_at ASC order
      # (ties broken by version ASC; the order does not change the sum but is
      # pinned so partial-sum reporting is reproducible):
      total_mitigation_credit_tpy = round(sum(credit_tpy(c)
                                              for c in ACTIVE conditions), 2)
      # PINNED ORDER: round-per-condition-then-sum. The alternative reading
      # (round(sum(raw products), 2)) is NOT used and yields a different number
      # whenever raw products carry a third decimal, e.g. three MONITORING
      # conditions of 12.35 tpy each: 1.24 + 1.24 + 1.24 = 3.72 under the pinned
      # order versus round(3.705, 2) = 3.71 under sum-then-round.
      approved_net_emissions_tpy = round(max(0.00, application.proposed_emissions_tpy
                                             - total_mitigation_credit_tpy), 2)
    input_set: "PermitCondition rows of the application with status == ACTIVE; VOIDED rows are excluded from both the sum and the net emissions"
    constants:
      EFFICACY_ADDITIONAL_CONTROL: 1.00
      EFFICACY_MONITORING: 0.20
      EFFICACY_COMMUNITY_BENEFIT: 0.10
      NON_ENFORCEABLE_FACTOR: 0.50
    precision: "2 decimals per condition and 2 decimals on the total, round_half_up; rounding order is round-then-sum"

  - name: residual_impact_index
    trigger: "After every calculations.mitigation_credit_aggregation run, after governing-assessment changes, and on advance-to-decision"
    algorithm: threshold
    formula: |
      pre = application.pre_mitigation_index          # calculations.governing_assessment_selector
      credit_ratio = min(1.0000,
                         round(application.total_mitigation_credit_tpy
                               / application.proposed_emissions_tpy, 4))
      # Circular-looking dependency resolved by pinning the order: the cap tier is
      # keyed on the PRE-mitigation index, never on the residual it produces.
      mitigation_cap = 0.60 if pre >= CAP_TIER_HIGH_INDEX
                       else 0.75 if pre >= CAP_TIER_MID_INDEX
                       else 1.00
      effective_reduction = min(credit_ratio, mitigation_cap)
      residual_impact_index = round(pre * (1 - effective_reduction), 2)
      # Evaluation order: pre -> credit_ratio -> cap -> effective_reduction -> residual.
    input_set: "The application's own pre_mitigation_index, total_mitigation_credit_tpy and proposed_emissions_tpy"
    constants:
      CAP_TIER_HIGH_INDEX: 75.00
      CAP_TIER_MID_INDEX: 50.00
      DENIAL_THRESHOLD: 60.00
    precision: "credit_ratio 4 decimals, residual 2 decimals, round_half_up; both cap comparisons are >="

  - name: community_benefit_obligation
    trigger: "On POST /ej/permit-decisions with disposition ISSUE"
    algorithm: tiered_pricing
    formula: |
      base = request.community_benefit_base_usd
      # PINNED: the surcharge tier is selected from `base`, NOT from the total it
      # feeds. Keying the tier on the total is the circular reading and is wrong.
      surcharge_rate = 0.12 if base >= BENEFIT_TIER_HIGH_USD
                       else 0.08 if base >= BENEFIT_TIER_MID_USD
                       else 0.05
      designation_multiplier = 1.25 if area.designation == "SEVERELY_OVERBURDENED"
                               else 1.10 if area.designation == "OVERBURDENED"
                               else 1.00
      community_benefit_surcharge_usd = round(base * surcharge_rate
                                              * designation_multiplier, 2)
      community_benefit_total_usd = round(base + community_benefit_surcharge_usd, 2)
      minimum_required = round(MIN_BENEFIT_PER_TPY
                               * application.approved_net_emissions_tpy, 2)
      # Fiscal gate (only when area.designation != UNDESIGNATED):
      #   community_benefit_total_usd < minimum_required -> ERR_BENEFIT_COMMITMENT_INSUFFICIENT
      # Evaluation order: approved_net_emissions_tpy -> tier(base) -> surcharge ->
      #   total -> minimum_required -> gate.
    input_set: "The decision request's community_benefit_base_usd, the area's designation, and the application's approved_net_emissions_tpy computed by calculations.mitigation_credit_aggregation"
    constants:
      BENEFIT_TIER_HIGH_USD: 500000.00
      BENEFIT_TIER_MID_USD: 100000.00
      MIN_BENEFIT_PER_TPY: 1500.00
      AREA_LOAD_CAP_MULTIPLIER: 1.15
    precision: "2 decimals, round_half_up"

  - name: required_comment_days
    trigger: "On ParticipationPlan creation by the screen transition, on the designation cascade, on assessment ACCEPT, and on POST /ej/participation-plans/{id}/extend"
    algorithm: threshold
    formula: |
      days = BASE_COMMENT_DAYS
      if area.designation == "OVERBURDENED":            days += 15
      if area.designation == "SEVERELY_OVERBURDENED":   days += 30
      if area.translation_required:                     days += 15
      if governing assessment exists AND
         governing.cumulative_impact_index >= DISPROPORTIONATE_THRESHOLD: days += 10
      required_comment_days = min(days, MAX_COMMENT_DAYS)
      # Window arithmetic - CLOSED date interval, inclusive on both ends:
      comment_end_date = comment_start_date
                         + (required_comment_days + granted_extension_days) - 1 day
      # plan_reopen_extension (see own entry) is the only path that grows
      # granted_extension_days without an explicit extend call.
      # PINNED WRITE SCOPE: comment_end_date is written ONLY by
      # POST /ej/participation-plans/{id}/open (the formula above),
      # POST /ej/participation-plans/{id}/extend, and the CLOSED -> OPEN
      # reopen cascade (calculations.plan_reopen_extension). A later
      # required_comment_days recompute (screen, designation cascade, assessment
      # ACCEPT) rewrites required_comment_days ONLY and never moves an already
      # set comment_end_date.
    input_set: "The area's designation and translation_required, plus the governing assessment's cumulative_impact_index when one exists"
    constants:
      BASE_COMMENT_DAYS: 30
      MAX_COMMENT_DAYS: 120
    precision: "whole days; dates are UTC calendar dates"

  - name: plan_reopen_extension
    trigger: "On the ParticipationPlan CLOSED -> OPEN cascade (POST /ej/permit-applications/{id}/resubmit or POST /ej/permit-decisions/{id}/rescind)"
    algorithm: threshold
    formula: |
      headroom = MAX_COMMENT_DAYS - (required_comment_days + granted_extension_days)
      added = min(REOPEN_EXTENSION_DAYS, max(0, headroom))
      granted_extension_days += added
      comment_end_date = max(current logical clock date (UTC), comment_end_date) + added days
      # When headroom is 0 the plan reopens with no added days and the end date is
      # max(clock_date, comment_end_date) unchanged by addition.
    input_set: "The plan's own day counters and the current logical clock date"
    constants:
      REOPEN_EXTENSION_DAYS: 15
      MAX_COMMENT_DAYS: 120
    precision: "whole days"

  - name: participation_adequacy
    trigger: "On POST /ej/participation-plans/{id}/close"
    algorithm: aggregation
    formula: |
      deficiency_codes = []   # appended in exactly this order
      window_days = (comment_end_date - comment_start_date) + 1
      if window_days < required_comment_days:
          append "SHORT_COMMENT_PERIOD"
      accessible_meetings = count of PublicMeeting rows with
            participation_plan_id == plan.id
        AND status == "SCHEDULED"
        AND accessibility_verified == true
        AND ends_at <= current logical clock timestamp (UTC)
      if accessible_meetings == 0:
          append "NO_ACCESSIBLE_MEETING"
      if area.translation_required AND (materials_translated == false
            OR any code in area.required_translation_languages
               is not in plan.translated_languages):
          append "MISSING_TRANSLATION"
      if any PublicComment of this plan has in_required_language == false:
          append "LANGUAGE_ACCESS_GAP"
      adequacy_status = "COMPLIANT" if deficiency_codes == [] else "DEFICIENT"
    input_set: "PublicMeeting rows of the plan with status SCHEDULED that have already ended at the close clock, every PublicComment of the plan, the plan's own translation fields, and the area's translation requirement"
    constants: {}
    precision: "whole days for the window comparison; the zero-accessible-meeting edge is an explicit empty-set check"

  - name: inspection_priority_score
    trigger: "On POST /ej/community-complaints, on POST /ej/community-complaints/{id}/triage with outcome ACCEPT, on POST /ej/community-complaints/{id}/reopen, and on the ej_screen_score recompute cascade for complaints in status IN {RECEIVED, TRIAGED}"
    algorithm: weighted_scoring
    formula: |
      repeat_count_180d = count of CommunityComplaint rows with
            screening_area_id == this.screening_area_id
        AND complaint_type   == this.complaint_type
        AND status != "DISMISSED"
        AND id != this.id
        AND created_at >= (current logical clock timestamp - REPEAT_WINDOW_DAYS days)   # inclusive
        AND created_at <  this.created_at                                              # exclusive, excludes self and later filings
      priority_score = round(AREA_WEIGHT * area.ej_screen_score_county
                             + SEVERITY_POINTS[severity]
                             + min(REPEAT_CAP_POINTS, REPEAT_POINTS_PER_PRIOR * repeat_count_180d)
                             + (10 if facility IS NOT NULL
                                     AND facility.compliance_status == "VIOLATION_ON_RECORD" else 0)
                             + (5 if area.designation == "SEVERELY_OVERBURDENED" else 0), 2)
      priority_tier = "TIER_1" if priority_score >= TIER_1_MIN
                      else "TIER_2" if priority_score >= TIER_2_MIN
                      else "TIER_3"
    input_set: "The complaint's own severity and type, prior non-dismissed complaints of the same type in the same area inside the trailing 180-day window, the area's COUNTY screening score and designation, and the named facility's compliance_status when a facility was named"
    constants:
      AREA_WEIGHT: 0.40
      SEVERITY_POINTS_LOW: 5
      SEVERITY_POINTS_MEDIUM: 15
      SEVERITY_POINTS_HIGH: 30
      REPEAT_POINTS_PER_PRIOR: 4
      REPEAT_CAP_POINTS: 20
      REPEAT_WINDOW_DAYS: 180
      TIER_1_MIN: 70.00
      TIER_2_MIN: 45.00
    precision: "2 decimals, round_half_up; both tier comparisons are >="

  - name: next_inspection_selector
    trigger: "On POST /ej/inspections/assign-next"
    algorithm: waterfall_allocation
    formula: |
      # (a) Eligibility filter:
      candidates = CommunityComplaint rows with
            status == "TRIAGED"
        AND facility_id IS NOT NULL
        AND no Inspection row for that complaint has status == "SCHEDULED"
        AND (screening_area_id == request.screening_area_id when that field is supplied)
      # (b) Ranking expression: priority_score DESC
      # (c) Tie-break: created_at ASC (oldest filing first); if still tied, version ASC
      # (d) Empty-set fallback: no candidates -> ERR_NO_ELIGIBLE_COMPLAINT (409),
      #     no Inspection row is created and no complaint is mutated.
      selected = first row under (b)+(c)
      # Inspector day capacity is validated before selection:
      #   count of Inspection rows with inspector_user_id == request.inspector_user_id
      #   AND scheduled_date == request.scheduled_date AND status == "SCHEDULED"
      #   >= MAX_INSPECTIONS_PER_INSPECTOR_PER_DAY -> ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED
      Inspection.facility_id = selected.facility_id
      Inspection.priority_score_at_assignment = selected.priority_score
    input_set: "TRIAGED complaints with a named facility and no live inspection; optionally narrowed to one screening area"
    constants:
      MAX_INSPECTIONS_PER_INSPECTOR_PER_DAY: 3
    precision: "score comparison on 2-decimal stored values; created_at compared at millisecond precision"

  - name: venue_slot_conflict
    trigger: "On POST /ej/public-meetings"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval geometry with a symmetric turnover buffer.
      candidate = [starts_at - VENUE_TURNOVER_BUFFER_MINUTES,
                   ends_at   + VENUE_TURNOVER_BUFFER_MINUTES)
      for each existing PublicMeeting m with m.venue_id == request.venue_id
                                        AND m.status == "SCHEDULED":
          occupied = [m.starts_at, m.ends_at)          # half-open, no buffer on the stored side
          if candidate INTERSECTS occupied (non-empty overlap):
              -> ERR_VENUE_SLOT_CONFLICT (409)
      # Touching endpoints do NOT collide: a candidate whose buffered start equals an
      # existing meeting's ends_at is accepted (a 60-minute gap is exactly legal).
    input_set: "PublicMeeting rows at the same venue with status SCHEDULED; CANCELLED meetings free their interval immediately"
    constants:
      VENUE_TURNOVER_BUFFER_MINUTES: 60
    precision: "minute precision on ISO 8601 UTC timestamps"

  - name: area_engagement_capacity
    trigger: "On POST /ej/participation-plans/{id}/open and on POST /ej/participation-plans/{id}/extend"
    algorithm: interval_merge
    formula: |
      # CLOSED date-interval geometry with an aggregate per-area cap. This is
      # deliberately different arithmetic from calculations.venue_slot_conflict:
      # no buffer, and touching endpoints DO collide.
      cap = MAX_CONCURRENT_OPEN_PLANS_SEVERE
              if area.designation == "SEVERELY_OVERBURDENED"
            else MAX_CONCURRENT_OPEN_PLANS_DEFAULT
      candidate = [comment_start_date, comment_end_date]        # closed, inclusive both ends
      concurrent = count of ParticipationPlan rows p with
            p.id != this.id
        AND p.status IN {"OPEN", "EXTENDED"}
        AND the Facility of p's application has screening_area_id == this area.id
        AND [p.comment_start_date, p.comment_end_date] INTERSECTS candidate
            (shared endpoint counts as intersecting)
      if concurrent + 1 > cap:  -> ERR_AREA_ENGAGEMENT_CAPACITY (409)
    input_set: "ParticipationPlan rows in status OPEN or EXTENDED whose application's facility sits in the same ScreeningArea; CLOSED, PLANNED and CANCELLED plans are excluded"
    constants:
      MAX_CONCURRENT_OPEN_PLANS_DEFAULT: 2
      MAX_CONCURRENT_OPEN_PLANS_SEVERE: 1
    precision: "whole UTC calendar dates"

  - name: program_evaluation_metrics
    trigger: "On GET /ej/program-evaluation"
    algorithm: aggregation
    formula: |
      # Population filter:
      apps = PermitApplication rows with status IN {"ISSUED", "DENIED"}
             AND the Facility's ScreeningArea.designation IN designation_filter
             (designation_filter = [request.designation] when supplied,
              else ["OVERBURDENED", "SEVERELY_OVERBURDENED"])
      # Basis variant decides WHICH date the window is applied to:
      #   DECISION_DATE    -> governing PermitDecision.created_at date
      #   APPLICATION_DATE -> PermitApplication.created_at date
      # Window is closed on both ends: period_start <= date <= period_end
      # (defaults: period_start = 1970-01-01, period_end = 9999-12-31).
      # governing decision = the application's PermitDecision with status IN
      #   {ISSUED, DENIED} (at most one); RESCINDED decisions are excluded from the
      #   population entirely, so a rescinded permit stops counting as issued.
      total_decided = count(apps in window)
      issued_count  = count(apps in window with status ISSUED)
      denied_count  = count(apps in window with status DENIED)
      denial_rate   = 0.0000 if total_decided == 0
                      else round(denied_count / total_decided, 4)
      mean_residual_index = 0.00 if total_decided == 0
                      else round(sum(app.residual_impact_index) / total_decided, 2)
      total_mitigation_credit_tpy = round(sum(app.total_mitigation_credit_tpy), 2)
      total_community_benefit_usd = round(sum(decision.community_benefit_total_usd
                                              for ISSUED decisions in window), 2)
      mean_comment_days = 0.00 if no ENHANCED app in window
                      else round(sum(plan.required_comment_days
                                     + plan.granted_extension_days
                                     for ENHANCED apps in window) / count, 2)
    input_set: "Decided applications at facilities in designated areas; RESCINDED decisions and applications still in review are excluded"
    constants: {}
    precision: "denial_rate 4 decimals, currency and index means 2 decimals, round_half_up"
    variants:
      - name: DECISION_DATE
        when: "request.basis omitted or equal to DECISION_DATE (default)"
        difference: "The window filters on the governing PermitDecision.created_at date"
      - name: APPLICATION_DATE
        when: "request.basis == APPLICATION_DATE"
        difference: "The window filters on PermitApplication.created_at date, so an application filed before the window but decided inside it is excluded - identical data, different metrics"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the eight roles declared in the RBAC matrix"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The role is listed in the endpoint's roles set"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Request body and query parameters are well formed: required fields present, types correct, enum members valid, numeric ranges respected (proposed_emissions_tpy > 0, population >= 1, capacity >= 1, starts_at < ends_at, limit in [1,100], offset >= 0, dates ISO-8601)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Path ids resolve left to right; the first unresolved id decides the error"
    error_id: ERR_SCREENING_AREA_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints; sibling codes ERR_FACILITY_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_MEETING_NOT_FOUND, ERR_CONDITION_NOT_FOUND, ERR_DECISION_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_VENUE_NOT_FOUND apply per resource"

  - priority: 6
    category: existence
    check: "Body foreign keys resolve, checked in declaration order of the endpoint's input list (screening_area_id, facility_id, permit_application_id, participation_plan_id, venue_id, prior_application_id)"
    error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /ej/burden-indicators, POST /ej/facilities, POST /ej/permit-applications, POST /ej/cumulative-impact-assessments, POST /ej/public-meetings, POST /ej/public-comments, POST /ej/permit-conditions, POST /ej/permit-decisions, POST /ej/community-complaints"

  - priority: 7
    category: auth
    check: "ApplicantRepresentative acting on a PermitApplication must present X-User-ID equal to that application's facility_id"
    error_id: ERR_NOT_APPLICATION_OWNER
    http_status: 403
    applies_to: "POST /ej/permit-applications, POST /ej/permit-applications/{id}/submit, /resubmit, /withdraw"

  - priority: 8
    category: auth
    check: "Inspector completing an inspection must present X-User-ID equal to Inspection.inspector_user_id"
    error_id: ERR_NOT_ASSIGNED_INSPECTOR
    http_status: 403
    applies_to: "POST /ej/inspections/{id}/complete"

  - priority: 9
    category: state
    check: "The target resource is in a state from which this transition is declared in Table 2"
    error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    applies_to: "all application transitions; sibling codes ERR_INVALID_ASSESSMENT_STATE, ERR_INVALID_PLAN_STATE, ERR_INVALID_MEETING_STATE, ERR_INVALID_CONDITION_STATE, ERR_INVALID_DECISION_STATE, ERR_INVALID_COMPLAINT_STATE, ERR_INVALID_INSPECTION_STATE, ERR_AREA_NOT_STALE apply per resource"

  - priority: 10
    category: state
    check: "OCC: expected_screening_area_version equals ScreeningArea.version / expected_application_version equals PermitApplication.version"
    error_id: ERR_STALE_AREA_VERSION
    http_status: 412
    applies_to: "POST /ej/burden-indicators (ERR_STALE_AREA_VERSION); POST /ej/cumulative-impact-assessments and POST /ej/permit-conditions (ERR_STALE_APPLICATION_VERSION)"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: the QAReviewer's X-User-ID differs from the assessment's author_user_id, and the deciding PermitManager's X-User-ID is neither the governing assessment's author_user_id nor its qa_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ej/cumulative-impact-assessments/{id}/qa-decision, POST /ej/permit-decisions"

  - priority: 12
    category: business_constraint
    check: "BurdenIndicator.category equals the canonical category of indicator_code"
    error_id: ERR_INDICATOR_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /ej/burden-indicators"

  - priority: 13
    category: business_constraint
    check: "statewide_percentile and county_percentile are both within [0.00, 100.00]"
    error_id: ERR_PERCENTILE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /ej/burden-indicators"

  - priority: 14
    category: business_temporal
    check: "vintage_year lies within [clock_year - INDICATOR_VALIDITY_YEARS, clock_year]"
    error_id: ERR_INDICATOR_VINTAGE_INVALID
    http_status: 422
    applies_to: "POST /ej/burden-indicators"

  - priority: 15
    category: business_constraint
    check: "area_code is unique across ScreeningArea rows"
    error_id: ERR_AREA_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /ej/screening-areas"

  - priority: 16
    category: business_constraint
    check: "required_translation_languages is non-empty when limited_english_pct >= TRANSLATION_TRIGGER_PCT"
    error_id: ERR_TRANSLATION_LANGUAGES_REQUIRED
    http_status: 422
    applies_to: "POST /ej/screening-areas"

  - priority: 17
    category: business_referential
    check: "method REFINED requires both dispersion_factor and receptor_distance_m"
    error_id: ERR_REFINED_INPUTS_REQUIRED
    http_status: 422
    applies_to: "POST /ej/cumulative-impact-assessments, POST /ej/cumulative-impact-assessments/{id}/revise"

  - priority: 18
    category: business_referential
    check: "condition_type MONITORING requires monitoring_frequency; condition_type COMMUNITY_BENEFIT requires benefit_value_usd"
    error_id: ERR_CONDITION_INPUTS_REQUIRED
    http_status: 422
    applies_to: "POST /ej/permit-conditions"

  - priority: 19
    category: business_referential
    check: "For review_track ENHANCED, the governing CumulativeImpactAssessment exists and has status ACCEPTED"
    error_id: ERR_ASSESSMENT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /ej/permit-applications/{id}/advance-to-decision, POST /ej/permit-decisions"

  - priority: 20
    category: business_referential
    check: "For review_track ENHANCED, the application's ParticipationPlan has status CLOSED"
    error_id: ERR_PARTICIPATION_NOT_CLOSED
    http_status: 409
    applies_to: "POST /ej/permit-applications/{id}/advance-to-decision"

  - priority: 21
    category: business_temporal
    check: "comment_start_date is on or after the current logical clock date (UTC)"
    error_id: ERR_COMMENT_START_IN_PAST
    http_status: 422
    applies_to: "POST /ej/participation-plans/{id}/open"

  - priority: 22
    category: business_constraint
    check: "required_comment_days + granted_extension_days + additional_days <= MAX_COMMENT_DAYS"
    error_id: ERR_COMMENT_DAYS_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /ej/participation-plans/{id}/extend"

  - priority: 23
    category: business_constraint
    check: "calculations.area_engagement_capacity: concurrent OPEN/EXTENDED plans whose closed comment windows intersect the candidate window must stay within the area's cap"
    error_id: ERR_AREA_ENGAGEMENT_CAPACITY
    http_status: 409
    applies_to: "POST /ej/participation-plans/{id}/open, POST /ej/participation-plans/{id}/extend"

  - priority: 24
    category: business_temporal
    check: "Current logical clock date (UTC) is strictly after comment_end_date"
    error_id: ERR_COMMENT_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /ej/participation-plans/{id}/close"

  - priority: 25
    category: business_temporal
    check: "Comments are accepted only while the plan status is OPEN or EXTENDED and the clock date lies within [comment_start_date, comment_end_date]"
    error_id: ERR_COMMENT_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /ej/public-comments"

  - priority: 26
    category: business_temporal
    check: "The meeting's starts_at date and ends_at date both lie within the plan's closed comment window"
    error_id: ERR_MEETING_OUTSIDE_COMMENT_WINDOW
    http_status: 422
    applies_to: "POST /ej/public-meetings"

  - priority: 27
    category: business_constraint
    check: "Venue.status is ACTIVE"
    error_id: ERR_VENUE_DECOMMISSIONED
    http_status: 409
    applies_to: "POST /ej/public-meetings"

  - priority: 28
    category: business_constraint
    check: "Venue has ada_accessible == true and transit_accessible == true"
    error_id: ERR_VENUE_NOT_ACCESSIBLE
    http_status: 422
    applies_to: "POST /ej/public-meetings"

  - priority: 29
    category: business_constraint
    check: "calculations.venue_slot_conflict: the buffer-expanded candidate interval must not intersect any SCHEDULED meeting at the venue"
    error_id: ERR_VENUE_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /ej/public-meetings"

  - priority: 30
    category: business_safety
    check: "For review_track ENHANCED, ParticipationPlan.adequacy_status is COMPLIANT before a permit may be issued"
    error_id: ERR_PARTICIPATION_INADEQUATE
    http_status: 409
    applies_to: "POST /ej/permit-decisions with disposition ISSUE"

  - priority: 31
    category: business_safety
    check: "residual_impact_index < DENIAL_THRESHOLD; a disproportionate impact that mitigation cannot bring below the threshold may not be permitted"
    error_id: ERR_DISPROPORTIONATE_IMPACT_UNMITIGATED
    http_status: 409
    applies_to: "POST /ej/permit-decisions with disposition ISSUE"

  - priority: 32
    category: business_safety
    check: "denial_basis is supported by the record: UNMITIGABLE_DISPROPORTIONATE_IMPACT requires residual_impact_index >= DENIAL_THRESHOLD, INADEQUATE_PARTICIPATION requires adequacy_status DEFICIENT, INCOMPLETE_ASSESSMENT requires governing data_confidence LOW"
    error_id: ERR_DENIAL_BASIS_UNSUPPORTED
    http_status: 422
    applies_to: "POST /ej/permit-decisions with disposition DENY"

  - priority: 33
    category: business_referential
    check: "community_benefit_base_usd is present on ISSUE when the area designation is OVERBURDENED or SEVERELY_OVERBURDENED"
    error_id: ERR_BENEFIT_BASE_REQUIRED
    http_status: 422
    applies_to: "POST /ej/permit-decisions with disposition ISSUE"

  - priority: 34
    category: business_fiscal
    check: "community_benefit_total_usd >= round(MIN_BENEFIT_PER_TPY * approved_net_emissions_tpy, 2) when the area is designated"
    error_id: ERR_BENEFIT_COMMITMENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /ej/permit-decisions with disposition ISSUE"

  - priority: 35
    category: business_fiscal
    check: "ScreeningArea.permitted_load_tpy + approved_net_emissions_tpy <= round(AREA_LOAD_CAP_MULTIPLIER * baseline_load_tpy, 2)"
    error_id: ERR_AREA_LOAD_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /ej/permit-decisions with disposition ISSUE"

  - priority: 36
    category: business_referential
    check: "The selected complaint is inspectable: status TRIAGED, facility_id non-null, no SCHEDULED inspection already open"
    error_id: ERR_COMPLAINT_NOT_INSPECTABLE
    http_status: 422
    applies_to: "POST /ej/inspections/assign-next when screening_area_id narrows to a single non-inspectable complaint"

  - priority: 37
    category: business_constraint
    check: "The inspector has fewer than MAX_INSPECTIONS_PER_INSPECTOR_PER_DAY SCHEDULED inspections on scheduled_date"
    error_id: ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /ej/inspections/assign-next"

  - priority: 38
    category: business_constraint
    check: "calculations.next_inspection_selector candidate set is non-empty"
    error_id: ERR_NO_ELIGIBLE_COMPLAINT
    http_status: 409
    applies_to: "POST /ej/inspections/assign-next"

  - priority: 39
    category: business_referential
    check: "resolution REFERRED_ENFORCEMENT requires the complaint's latest COMPLETED inspection to have finding VIOLATION_CONFIRMED"
    error_id: ERR_REFERRAL_UNSUPPORTED
    http_status: 422
    applies_to: "POST /ej/community-complaints/{id}/resolve"

  - priority: 40
    category: business_referential
    check: "PermitCondition mutations require the application status to be in {STANDARD_REVIEW, ENHANCED_REVIEW, PENDING_DECISION}"
    error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    applies_to: "POST /ej/permit-conditions, DELETE /ej/permit-conditions/{id}"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- reference data ------------------------------------------------------
  - method: POST
    path: "/ej/screening-areas"
    description: "Register a census block group as a screening unit; scores start at 0.00 and designation at UNDESIGNATED"
    roles: [ProgramAdmin]
    code: 201
    input: [area_code, county, population, limited_english_pct, "required_translation_languages?", baseline_load_tpy]
    output: ScreeningArea
    side_effects:
      - "runs calculations.ej_screen_score over an empty input set (both variants 0.00)"
      - "runs calculations.designation (UNDESIGNATED, translation_required from limited_english_pct)"

  - method: GET
    path: "/ej/screening-areas/{id}"
    description: "Read one screening area including both score variants, designation, data_status and both ledgers"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, ApplicantRepresentative, PublicCommenter]
    code: 200
    input: []
    output: ScreeningArea
    side_effects: []

  - method: POST
    path: "/ej/burden-indicators"
    description: "File a demographic, health or pollution burden indicator for an area; supersedes the prior ACTIVE row with the same indicator_code"
    roles: [ProgramAdmin, EJAnalyst]
    code: 201
    input: [screening_area_id, indicator_code, category, raw_value, statewide_percentile, county_percentile, vintage_year, expected_screening_area_version]
    output: BurdenIndicator
    side_effects:
      - "prior ACTIVE BurdenIndicator with the same (screening_area_id, indicator_code) -> SUPERSEDED (cascade link 1)"
      - "recomputes both variants of calculations.ej_screen_score and active_indicator_count (cascade link 2)"
      - "re-evaluates calculations.designation, possibly moving the area between UNDESIGNATED / OVERBURDENED / SEVERELY_OVERBURDENED"
      - "on escalation, every STANDARD_REVIEW application in the area gains an ENHANCED_REQUIRED ApplicabilityDetermination and moves to ENHANCED_REVIEW (cascade link 3), each gaining a ParticipationPlan (cascade link 4)"
      - "recomputes calculations.inspection_priority_score for complaints in status RECEIVED or TRIAGED in this area"
      - "increments ScreeningArea.version by 1"
      - "stamps BurdenIndicator.area_version_after with the resulting ScreeningArea.version"

  - method: GET
    path: "/ej/screening-areas/{id}/burden-indicators"
    description: "List the area's burden indicators (reverse reachability for BurdenIndicator.screening_area_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, ApplicantRepresentative, PublicCommenter]
    code: 200
    input: ["status?", "indicator_code?", "limit?", "offset?"]
    output: BurdenIndicator[]
    side_effects: []

  - method: POST
    path: "/ej/screening-areas/{id}/recertify"
    description: "Recertify an area whose burden data went STALE after an enforcement finding"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ScreeningArea
    side_effects:
      - "ScreeningArea.data_status STALE -> CURRENT"
      - "recomputes both variants of calculations.ej_screen_score and re-evaluates calculations.designation"
      - "increments ScreeningArea.version by 1"

  - method: POST
    path: "/ej/facilities"
    description: "Register a regulated facility inside a screening area"
    roles: [ProgramAdmin]
    code: 201
    input: [screening_area_id, name, facility_type, distance_to_area_centroid_m]
    output: Facility
    side_effects: []

  - method: GET
    path: "/ej/facilities/{id}"
    description: "Read one facility including its emissions ledger and compliance status"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, ApplicantRepresentative, PublicCommenter]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: GET
    path: "/ej/screening-areas/{id}/facilities"
    description: "List facilities in an area (reverse reachability for Facility.screening_area_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, ApplicantRepresentative, PublicCommenter]
    code: 200
    input: ["facility_type?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []

  - method: POST
    path: "/ej/venues"
    description: "Register a public-meeting venue with its accessibility attributes"
    roles: [ProgramAdmin]
    code: 201
    input: [name, address, capacity, transit_accessible, ada_accessible, interpretation_capable, "status?"]
    output: Venue
    side_effects: []

  - method: GET
    path: "/ej/venues/{id}"
    description: "Read one venue including its slot-occupancy ledger booked_meeting_count"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, ApplicantRepresentative, PublicCommenter]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/ej/venues/{id}/meetings"
    description: "List meetings booked at a venue (reverse reachability for PublicMeeting.venue_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, ApplicantRepresentative, PublicCommenter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PublicMeeting[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time, so every deadline, vintage window and comment period is deterministic."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "no entity is mutated; subsequent calculations read the new clock"

  # ---- permit applications --------------------------------------------------
  - method: POST
    path: "/ej/permit-applications"
    description: "File a permit application in DRAFT for one of the applicant's facilities"
    roles: [ApplicantRepresentative]
    code: 201
    input: [facility_id, permit_type, proposed_emissions_tpy, proposed_operating_hours_per_year, "prior_application_id?"]
    output: PermitApplication
    side_effects:
      - "status DRAFT, review_track UNDETERMINED, revision_round 0"

  - method: GET
    path: "/ej/permit-applications/{id}"
    description: "Read one application including review_track, indices and version"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, ApplicantRepresentative]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []

  - method: GET
    path: "/ej/facilities/{id}/permit-applications"
    description: "List a facility's applications (reverse reachability for PermitApplication.facility_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, ApplicantRepresentative]
    code: 200
    input: ["status?", "review_track?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []

  - method: GET
    path: "/ej/permit-applications/{id}/revisions"
    description: "List applications that name this one as prior_application_id (reverse reachability for the self FK)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, ApplicantRepresentative]
    code: 200
    input: ["limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []

  - method: POST
    path: "/ej/permit-applications/{id}/submit"
    description: "Submit a DRAFT application for screening"
    roles: [ApplicantRepresentative]
    code: 200
    input: []
    output: PermitApplication
    side_effects:
      - "status DRAFT -> SUBMITTED"
      - "increments PermitApplication.version by 1"

  - method: POST
    path: "/ej/permit-applications/{id}/screen"
    description: "Run the enhanced-review applicability determination and route the application onto the STANDARD or ENHANCED track"
    roles: [EJAnalyst]
    code: 201
    input: []
    output: ApplicabilityDetermination
    side_effects:
      - "creates an ApplicabilityDetermination with the fired trigger_codes and both area snapshots"
      - "status SUBMITTED -> STANDARD_REVIEW when no trigger fires, or -> ENHANCED_REVIEW when at least one does"
      - "on the ENHANCED branch, creates a ParticipationPlan in PLANNED with calculations.required_comment_days, or recomputes required_comment_days on the existing non-CANCELLED plan"
      - "increments PermitApplication.version by 1 and stamps application_version_after"

  - method: GET
    path: "/ej/permit-applications/{id}/applicability-determinations"
    description: "List the application's determinations, newest first by revision_round DESC then created_at DESC (reverse reachability for ApplicabilityDetermination.permit_application_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, ApplicantRepresentative]
    code: 200
    input: ["limit?", "offset?"]
    output: ApplicabilityDetermination[]
    side_effects: []

  - method: POST
    path: "/ej/permit-applications/{id}/advance-to-decision"
    description: "Move a reviewed application into PENDING_DECISION"
    roles: [EJAnalyst]
    code: 200
    input: []
    output: PermitApplication
    side_effects:
      - "status STANDARD_REVIEW or ENHANCED_REVIEW -> PENDING_DECISION"
      - "recomputes calculations.residual_impact_index"
      - "increments PermitApplication.version by 1"

  - method: POST
    path: "/ej/permit-applications/{id}/return-for-revision"
    description: "Send an application back to the applicant, invalidating its live assessment"
    roles: [EJAnalyst]
    code: 200
    input: [reason]
    output: PermitApplication
    side_effects:
      - "status ENHANCED_REVIEW or PENDING_DECISION -> RETURNED_FOR_REVISION"
      - "assessments in SUBMITTED_FOR_QA or ACCEPTED -> INVALIDATED"
      - "recomputes pre_mitigation_index and residual_impact_index"
      - "increments PermitApplication.version by 1"

  - method: POST
    path: "/ej/permit-applications/{id}/resubmit"
    description: "Resubmit a returned application, optionally with revised emissions; closes one revision cycle"
    roles: [ApplicantRepresentative]
    code: 200
    input: ["proposed_emissions_tpy?", "proposed_operating_hours_per_year?"]
    output: PermitApplication
    side_effects:
      - "status RETURNED_FOR_REVISION -> SUBMITTED and revision_round += 1"
      - "all non-terminal assessments -> VOIDED, screening_stale_flag = false"
      - "the CLOSED ParticipationPlan -> OPEN via calculations.plan_reopen_extension"
      - "increments PermitApplication.version by 1"

  - method: POST
    path: "/ej/permit-applications/{id}/withdraw"
    description: "Withdraw an application; cancels the plan and its meetings, voids assessments and conditions"
    roles: [ApplicantRepresentative]
    code: 200
    input: ["reason?"]
    output: PermitApplication
    side_effects:
      - "status -> WITHDRAWN (terminal)"
      - "ParticipationPlan -> CANCELLED, its SCHEDULED meetings -> CANCELLED, each decrementing Venue.booked_meeting_count"
      - "non-terminal assessments -> VOIDED, ACTIVE conditions -> VOIDED"
      - "recomputes total_mitigation_credit_tpy, pre_mitigation_index, residual_impact_index and ScreeningArea.open_plan_count"
      - "increments PermitApplication.version by 1"

  # ---- cumulative impact assessments ---------------------------------------
  - method: POST
    path: "/ej/cumulative-impact-assessments"
    description: "Author a cumulative impact assessment combining the area's existing burden with the proposed emissions; supersedes an existing DRAFT or RETURNED assessment"
    roles: [EJAnalyst]
    code: 201
    input: [permit_application_id, method, "dispersion_factor?", "receptor_distance_m?", expected_application_version]
    output: CumulativeImpactAssessment
    side_effects:
      - "existing assessment of the application in DRAFT or RETURNED -> SUPERSEDED"
      - "runs calculations.cumulative_impact_index (variant by method) and sets disproportionate_flag and data_confidence"
      - "sets author_user_id from X-User-ID"
      - "recomputes PermitApplication.pre_mitigation_index and residual_impact_index"
      - "increments PermitApplication.version by 1 and stamps application_version_after"

  - method: GET
    path: "/ej/permit-applications/{id}/assessments"
    description: "List the application's assessments (reverse reachability for CumulativeImpactAssessment.permit_application_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, ApplicantRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CumulativeImpactAssessment[]
    side_effects: []

  - method: POST
    path: "/ej/cumulative-impact-assessments/{id}/submit-qa"
    description: "Submit a draft assessment for independent QA review"
    roles: [EJAnalyst]
    code: 200
    input: []
    output: CumulativeImpactAssessment
    side_effects:
      - "status DRAFT -> SUBMITTED_FOR_QA"
      - "increments CumulativeImpactAssessment.version by 1"

  - method: POST
    path: "/ej/cumulative-impact-assessments/{id}/qa-decision"
    description: "QA accept or return an assessment; the reviewer may not be its author"
    roles: [QAReviewer]
    code: 200
    input: [outcome, "note?"]
    output: CumulativeImpactAssessment
    side_effects:
      - "status SUBMITTED_FOR_QA -> ACCEPTED (outcome ACCEPT) or -> RETURNED (outcome RETURN)"
      - "on ACCEPT: any other ACCEPTED assessment of the application -> SUPERSEDED, PermitApplication.pre_mitigation_index and residual_impact_index recomputed, calculations.required_comment_days recomputed on a PLANNED / OPEN / EXTENDED plan"
      - "sets qa_user_id from X-User-ID"
      - "increments CumulativeImpactAssessment.version by 1 and stamps application_version_after"

  - method: POST
    path: "/ej/cumulative-impact-assessments/{id}/revise"
    description: "Take a returned assessment back into DRAFT and recompute it against current inputs"
    roles: [EJAnalyst]
    code: 200
    input: ["method?", "dispersion_factor?", "receptor_distance_m?"]
    output: CumulativeImpactAssessment
    side_effects:
      - "status RETURNED -> DRAFT"
      - "re-runs calculations.cumulative_impact_index with the current method inputs and the area's current score"
      - "sets author_user_id from X-User-ID"
      - "increments CumulativeImpactAssessment.version by 1"

  # ---- participation --------------------------------------------------------
  - method: GET
    path: "/ej/participation-plans/{id}"
    description: "Read one participation plan including required days, window dates, adequacy and deficiency codes"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, ApplicantRepresentative, PublicCommenter]
    code: 200
    input: []
    output: ParticipationPlan
    side_effects: []

  - method: GET
    path: "/ej/permit-applications/{id}/participation-plans"
    description: "List the application's participation plans (reverse reachability for ParticipationPlan.permit_application_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, ApplicantRepresentative, PublicCommenter]
    code: 200
    input: ["limit?", "offset?"]
    output: ParticipationPlan[]
    side_effects: []

  - method: PATCH
    path: "/ej/participation-plans/{id}"
    description: "Record translated-materials publication and the languages covered"
    roles: [CommunityLiaison]
    code: 200
    input: ["translated_languages?", "materials_translated?"]
    output: ParticipationPlan
    side_effects:
      - "increments ParticipationPlan.version by 1"

  - method: POST
    path: "/ej/participation-plans/{id}/open"
    description: "Open the comment period; the end date is derived from required and granted days as a closed interval"
    roles: [CommunityLiaison]
    code: 200
    input: [comment_start_date]
    output: ParticipationPlan
    side_effects:
      - "status PLANNED -> OPEN"
      - "sets comment_end_date = comment_start_date + required_comment_days + granted_extension_days - 1 day"
      - "increments ScreeningArea.open_plan_count by 1"
      - "increments ParticipationPlan.version by 1"

  - method: POST
    path: "/ej/participation-plans/{id}/extend"
    description: "Extend an open comment period, subject to the 120-day cap and the area engagement capacity"
    roles: [CommunityLiaison]
    code: 200
    input: [additional_days, reason]
    output: ParticipationPlan
    side_effects:
      - "status OPEN -> EXTENDED or EXTENDED -> EXTENDED"
      - "granted_extension_days += additional_days and comment_end_date += additional_days"
      - "increments ParticipationPlan.version by 1"

  - method: POST
    path: "/ej/participation-plans/{id}/close"
    description: "Close an elapsed comment period and compute participation adequacy"
    roles: [CommunityLiaison]
    code: 200
    input: []
    output: ParticipationPlan
    side_effects:
      - "status OPEN or EXTENDED -> CLOSED"
      - "runs calculations.participation_adequacy -> adequacy_status and deficiency_codes"
      - "decrements ScreeningArea.open_plan_count by 1"
      - "increments ParticipationPlan.version by 1"

  - method: POST
    path: "/ej/public-meetings"
    description: "Book an accessible public meeting inside the comment window"
    roles: [CommunityLiaison]
    code: 201
    input: [participation_plan_id, venue_id, starts_at, ends_at, "interpretation_languages?"]
    output: PublicMeeting
    side_effects:
      - "status SCHEDULED, accessibility_verified from the venue's flags"
      - "increments Venue.booked_meeting_count by 1"
      - "increments ParticipationPlan.meeting_count by 1"
      - "increments PublicMeeting.version by 1 on later mutations"

  - method: GET
    path: "/ej/participation-plans/{id}/meetings"
    description: "List the plan's meetings (reverse reachability for PublicMeeting.participation_plan_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, ApplicantRepresentative, PublicCommenter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PublicMeeting[]
    side_effects: []

  - method: POST
    path: "/ej/public-meetings/{id}/cancel"
    description: "Cancel a scheduled meeting and release its venue slot"
    roles: [CommunityLiaison]
    code: 200
    input: ["reason?"]
    output: PublicMeeting
    side_effects:
      - "status SCHEDULED -> CANCELLED"
      - "decrements Venue.booked_meeting_count by 1 and ParticipationPlan.meeting_count by 1"
      - "frees the buffer-expanded interval for re-booking"
      - "increments PublicMeeting.version by 1"

  - method: POST
    path: "/ej/public-comments"
    description: "File a public comment during an open comment period"
    roles: [PublicCommenter, CommunityLiaison]
    code: 201
    input: [participation_plan_id, submitter_name, language, body, "requires_response?"]
    output: PublicComment
    side_effects:
      - "sets in_required_language from the plan's translated_languages"
      - "increments ParticipationPlan.comment_count by 1"

  - method: GET
    path: "/ej/participation-plans/{id}/comments"
    description: "List the plan's comments (reverse reachability for PublicComment.participation_plan_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, ApplicantRepresentative, PublicCommenter]
    code: 200
    input: ["language?", "limit?", "offset?"]
    output: PublicComment[]
    side_effects: []

  # ---- conditions and decisions --------------------------------------------
  - method: POST
    path: "/ej/permit-conditions"
    description: "Attach an additional-control, monitoring or community-benefit condition and recompute mitigation credit"
    roles: [EJAnalyst]
    code: 201
    input: [permit_application_id, condition_type, "reduction_tpy?", "enforceable?", "monitoring_frequency?", "benefit_value_usd?", expected_application_version]
    output: PermitCondition
    side_effects:
      - "computes credit_tpy for this condition (rounded to 2 decimals before summation)"
      - "runs calculations.mitigation_credit_aggregation and calculations.residual_impact_index on the application"
      - "increments PermitApplication.version by 1 and stamps application_version_after"

  - method: GET
    path: "/ej/permit-applications/{id}/conditions"
    description: "List the application's conditions (reverse reachability for PermitCondition.permit_application_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, ApplicantRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PermitCondition[]
    side_effects: []

  - method: DELETE
    path: "/ej/permit-conditions/{id}"
    description: "Void a condition and recompute mitigation credit and residual impact"
    roles: [EJAnalyst]
    code: 204
    input: []
    output: null
    side_effects:
      - "PermitCondition.status ACTIVE -> VOIDED"
      - "runs calculations.mitigation_credit_aggregation and calculations.residual_impact_index"
      - "increments PermitApplication.version by 1"

  - method: POST
    path: "/ej/permit-decisions"
    description: "Issue or deny a permit; issuance books the emissions ledgers and the community benefit obligation, denial records the basis"
    roles: [PermitManager]
    code: 201
    input: [permit_application_id, disposition, "denial_basis?", "community_benefit_base_usd?"]
    output: PermitDecision
    side_effects:
      - "PermitApplication PENDING_DECISION -> ISSUED or -> DENIED"
      - "on ISSUE: runs calculations.community_benefit_obligation, sets approved_net_emissions_tpy, increments Facility.existing_load_tpy and ScreeningArea.permitted_load_tpy"
      - "snapshots residual_index_at_decision and decided_by_user_id"
      - "increments PermitApplication.version by 1"

  - method: GET
    path: "/ej/permit-applications/{id}/decisions"
    description: "List the application's decisions (reverse reachability for PermitDecision.permit_application_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, ApplicantRepresentative, PublicCommenter]
    code: 200
    input: ["limit?", "offset?"]
    output: PermitDecision[]
    side_effects: []

  - method: POST
    path: "/ej/permit-decisions/{id}/rescind"
    description: "Rescind an issued permit; reverses both emissions ledgers and returns the application to review"
    roles: [PermitManager]
    code: 200
    input: [reason]
    output: PermitDecision
    side_effects:
      - "PermitDecision.status ISSUED -> RESCINDED"
      - "decrements Facility.existing_load_tpy and ScreeningArea.permitted_load_tpy by approved_net_emissions_tpy, then sets it to 0.00"
      - "PermitApplication ISSUED -> ENHANCED_REVIEW or STANDARD_REVIEW by review_track"
      - "the ACCEPTED assessment -> INVALIDATED and the CLOSED plan -> OPEN via calculations.plan_reopen_extension (ENHANCED track only)"
      - "increments PermitApplication.version by 1"

  # ---- complaints and inspections ------------------------------------------
  - method: POST
    path: "/ej/community-complaints"
    description: "Intake a community complaint and score it for inspection prioritisation"
    roles: [PublicCommenter, CommunityLiaison]
    code: 201
    input: [screening_area_id, "facility_id?", complaint_type, severity, description, "submitter_language?"]
    output: CommunityComplaint
    side_effects:
      - "status RECEIVED, runs calculations.inspection_priority_score (repeat_count_180d, priority_score, priority_tier)"
      - "increments ScreeningArea.open_complaint_count by 1"

  - method: GET
    path: "/ej/community-complaints/{id}"
    description: "Read one complaint including its priority score and tier"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, PublicCommenter]
    code: 200
    input: []
    output: CommunityComplaint
    side_effects: []

  - method: GET
    path: "/ej/community-complaints"
    description: "List complaints with filters and pagination (reverse reachability for CommunityComplaint.screening_area_id and .facility_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, PublicCommenter]
    code: 200
    input: ["screening_area_id?", "facility_id?", "status?", "priority_tier?", "limit?", "offset?"]
    output: CommunityComplaint[]
    side_effects: []

  - method: POST
    path: "/ej/community-complaints/{id}/triage"
    description: "Accept a complaint into the inspection queue or dismiss it"
    roles: [EJAnalyst]
    code: 200
    input: [outcome, "dismissal_reason?"]
    output: CommunityComplaint
    side_effects:
      - "status RECEIVED -> TRIAGED (outcome ACCEPT) or -> DISMISSED (outcome DISMISS)"
      - "on ACCEPT: recomputes calculations.inspection_priority_score"
      - "on DISMISS: decrements ScreeningArea.open_complaint_count by 1"
      - "increments CommunityComplaint.version by 1"

  - method: POST
    path: "/ej/community-complaints/{id}/reopen"
    description: "Reopen a resolved complaint back into the inspection queue"
    roles: [CommunityLiaison]
    code: 200
    input: [reason]
    output: CommunityComplaint
    side_effects:
      - "status RESOLVED -> TRIAGED, reopen_count += 1"
      - "increments ScreeningArea.open_complaint_count by 1"
      - "recomputes calculations.inspection_priority_score"
      - "increments CommunityComplaint.version by 1"

  - method: POST
    path: "/ej/community-complaints/{id}/resolve"
    description: "Close out an inspected complaint as resolved or refer it to enforcement"
    roles: [EJAnalyst]
    code: 200
    input: [resolution, "note?"]
    output: CommunityComplaint
    side_effects:
      - "status INSPECTED -> RESOLVED or -> REFERRED_ENFORCEMENT"
      - "decrements ScreeningArea.open_complaint_count by 1"
      - "increments CommunityComplaint.version by 1"

  - method: POST
    path: "/ej/inspections/assign-next"
    description: "Assign the highest-priority inspectable complaint to an inspector, applying calculations.next_inspection_selector"
    roles: [EJAnalyst]
    code: 201
    input: [inspector_user_id, scheduled_date, "screening_area_id?"]
    output: Inspection
    side_effects:
      - "selects one TRIAGED complaint by priority_score DESC then created_at ASC"
      - "creates Inspection in SCHEDULED with priority_score_at_assignment and the complaint's facility_id"
      - "CommunityComplaint TRIAGED -> INSPECTION_ASSIGNED"

  - method: POST
    path: "/ej/inspections/{id}/complete"
    description: "Record the field finding; a confirmed violation starts the facility -> area -> assessment -> application cascade"
    roles: [Inspector]
    code: 200
    input: [finding, "notes?"]
    output: Inspection
    side_effects:
      - "status SCHEDULED -> COMPLETED and finding recorded"
      - "CommunityComplaint INSPECTION_ASSIGNED -> INSPECTED"
      - "on VIOLATION_CONFIRMED: Facility.compliance_status -> VIOLATION_ON_RECORD and confirmed_violation_count += 1 (link 1)"
      - "on VIOLATION_CONFIRMED: ScreeningArea.enforcement_burden_points += 5, both scores recomputed, designation re-evaluated, data_status -> STALE (link 2)"
      - "on VIOLATION_CONFIRMED: every ACCEPTED assessment of applications at facilities in that area -> INVALIDATED (link 3)"
      - "on VIOLATION_CONFIRMED: each such application in PENDING_DECISION -> ENHANCED_REVIEW with screening_stale_flag = true (link 4)"

  - method: GET
    path: "/ej/community-complaints/{id}/inspections"
    description: "List inspections raised from a complaint (reverse reachability for Inspection.community_complaint_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, PublicCommenter]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: GET
    path: "/ej/facilities/{id}/inspections"
    description: "List inspections at a facility (reverse reachability for Inspection.facility_id)"
    roles: [ProgramAdmin, EJAnalyst, QAReviewer, PermitManager, CommunityLiaison, Inspector, PublicCommenter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  # ---- program evaluation ---------------------------------------------------
  - method: GET
    path: "/ej/program-evaluation"
    description: "Program evaluation of permit outcomes in overburdened communities; basis selects the date the reporting window filters on"
    roles: [ProgramAdmin, EJAnalyst]
    code: 200
    input: ["basis?", "period_start?", "period_end?", "designation?"]
    output: "{ basis: string, total_decided: integer, issued_count: integer, denied_count: integer, denial_rate: number, mean_residual_index: number, total_mitigation_credit_tpy: number, total_community_benefit_usd: number, mean_comment_days: number }"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
