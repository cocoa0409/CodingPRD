              payload: { manufacturer_id: "${mfr_id}", billing_period_start: "2026-07-01", billing_period_end: "2026-07-31", statement_ids: ["${stmt_id}"] }
              as: SettlementOfficer
              as_user_id: "so-1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /manufacturer-invoices/${inv_id}/fund"
              payload: { amount_cents: 20 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /manufacturer-invoices/${inv_id}/fund"
              payload: { amount_cents: 39 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /manufacturer-invoices/${inv_id}"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /manufacturer-invoices/${inv_id}/fund"
              payload: { amount_cents: 38 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /manufacturers/${mfr_id}"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /settlement-statements/${stmt_id}"
              payload: {}
              as: SettlementOfficer
              as_user_id: "so-1"
          assert:
            - "the setup invoice was created with billed_face_value_cents 50, billed_handling_fee_cents 7, billed_clearing_fee_cents 1, billed_total_cents 58, funding_shortfall_cents 58"
            - "trigger call 1: 200 with data.status == \"SHORT_FUNDED\", data.funded_amount_cents == 20, data.funding_shortfall_cents == 38"
            - "trigger call 2: 422 with error.code == \"ERR_FUNDING_EXCEEDS_BILLED\" — 20 + 39 == 59 > 58, refused even though 39 alone is under the total"
            - "trigger call 3: data.funded_amount_cents is still 20 and data.status is still \"SHORT_FUNDED\" — the refused wire left no partial credit"
            - "trigger call 4: 200 with data.status == \"FUNDED\", data.funded_amount_cents == 58, data.funding_shortfall_cents == 0"
            - "trigger call 5: data.funded_total_cents == 58, data.disbursed_total_cents == 0, data.funding_balance_cents == 58 — the failed wire is absent from the ledger"
            - "trigger call 6: the statement is still \"DRAFT\" — it was never scheduled, so the SHORT_FUNDED and FUNDED cascades had no SCHEDULED statement to move"

      - name: state_check_beats_the_fiscal_ceiling_on_a_reconciled_invoice
        claim_type: priority_conflict
        grounds:
          - validations.priority_8.ERR_INVALID_STATE_TRANSITION
          - validations.priority_34.ERR_FUNDING_EXCEEDS_BILLED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_invoice_fund
          rationale: "The named §1.8 instance violates both rules with one overfunding wire at an invoice state that forbids funding and asserts the priority-8 error wins."

      - name: referential_and_clearability_and_grace_conflict_on_one_sort
        claim_type: priority_conflict
        grounds:
          - validations.priority_12.ERR_OFFER_MANUFACTURER_MISMATCH
          - validations.priority_13.ERR_OFFER_NOT_CLEARABLE
          - validations.priority_20.ERR_SUBMISSION_PAST_GRACE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_beats_clearability_beats_grace_on_lot_sort
          rationale: "The named §1.8 instance builds a single POST /submissions/{id}/lots body that violates all three rules and peels them off one at a time in priority order."

      - name: safety_and_temporal_and_capability_conflict_on_one_intake
        claim_type: priority_conflict
        grounds:
          - validations.priority_10.ERR_RETAILER_SUSPENDED
          - validations.priority_17.ERR_POSTMARK_WINDOW_OVERLAP
          - validations.priority_23.ERR_CHANNEL_NOT_SUPPORTED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_temporal_beats_capability_on_submission_intake
          rationale: "The named §1.8 instance stacks a suspended retailer, an overlapping postmark window and an uncontracted channel on one POST /submissions and asserts the ladder."

      - name: adjacent_postmark_windows_do_not_count_as_an_overlap
        claim_type: temporal_validation
        grounds:
          - validations.priority_17.ERR_POSTMARK_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / postmark_window_half_open_adjacency_allowed
          rationale: "The named §1.8 instance pins the half-open semantics: end == next start is accepted, one day of true overlap is refused, and the check is per retailer."

      - name: billing_period_buffer_is_enforced_on_both_sides
        claim_type: temporal_validation
        grounds:
          - validations.priority_18.ERR_BILLING_PERIOD_BUFFER_VIOLATION
        excluded_because:
          difficulty_instance: resource_temporal_overlap / billing_period_buffer_adjacency_rejected_both_sides
          rationale: "The named §1.8 instance tests the buffer before and after an existing invoice period on the same manufacturer, including the exact buffer-day boundary."

      - name: clip_concurrency_limit_is_an_aggregate_over_live_clips
        claim_type: aggregate_validation
        grounds:
          - validations.priority_19.ERR_CLIP_CONCURRENCY_LIMIT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / clip_concurrency_aggregate_limit_and_slot_release
          rationale: "The named §1.8 instance fills the per-offer concurrent-clip limit, shows the next clip refused, then frees a slot by expiry or match and shows the refusal lift."

      - name: release_payment_depends_on_the_invoice_being_funded
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_13.ERR_INVOICE_NOT_FUNDED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / statement_release_gated_on_invoice_funded
          rationale: "The named §1.8 instance drives the same statement against an unfunded and then a funded invoice and asserts both the 422 and the successful release."

      - name: schedule_depends_on_no_open_dispute_on_the_submission
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_13.ERR_DISPUTE_OPEN
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / statement_schedule_gated_on_no_open_dispute
          rationale: "The named §1.8 instance opens a dispute on a sibling lot of the same submission, shows the schedule refused, then closes the dispute and shows it allowed."

      - name: finalize_depends_on_the_retailer_not_being_suspended
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_10.ERR_RETAILER_SUSPENDED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lot_finalize_gated_on_retailer_not_suspended
          rationale: "The named §1.8 instance suspends the retailer between capture and finalize, asserts the 403, then reinstates and finalizes the same lot."

