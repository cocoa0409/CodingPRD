      - name: case_money_fields_derive_from_charges_payments_and_the_tanf_flag
        claim_type: computed_fields
        grounds:
          - "entities.SupportCase.fields.arrears_principal_cents"
          - "entities.SupportCase.fields.assigned_arrears_cents"
          - "entities.SupportCase.fields.unassigned_arrears_cents"
          - "entities.SupportCase.fields.interest_receivable_cents"
          - "calculations.payment_distribution_split"
          - "endpoints[POST /child-support/cases/{case_id}/payments]"
        distinguishing_aspect: >
          On a TANF case the four arrears money fields are recomputed from the
          charge and payment rows rather than stored: a 75000 charge part-paid by
          20000 leaves arrears_principal 55000 with assigned_arrears 55000 and
          unassigned_arrears 0, and the same 20000 splits 10000 to the family and
          10000 to the state under the pass-through cap.
        test_recipe:
          setup:
            - "PA_REFERRAL case with tanf_assistance true, child_count 2, CP income 200000 and NCP income 300000 both VERIFIED_WAGE_RECORD."
            - "PRESUMED_MARITAL paternity, one ENTERED CURRENT_SUPPORT order at the guideline amount 75000 effective 2026-08-01."
            - "One OPEN CURRENT_SUPPORT charge of 75000 for period 2026-08-01/2026-09-01 due 2026-08-15."
            - "Clock advanced to 2026-08-20 so the charge is due but no month end has passed since it became due."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "1414", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "1515", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "PA_REFERRAL", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: true, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: "$.data.id" }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
              captures: { pa_id: "$.data.id" }
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order_id: "$.data.id" }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { guideline: "$.data.guideline_monthly_cents" }
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monthly: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
              captures: { ch_id: "$.data.id" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /child-support/cases/${case_id}/payments"
              payload: { source: "DIRECT_PAY", amount_cents: 20000 }
              as: FinanceOfficer
              captures: { pay_id: "$.data.id", ac: "$.data.applied_current_cents", am: "$.data.applied_medical_cents", aa: "$.data.applied_arrears_cents", ai: "$.data.applied_interest_cents", ag: "$.data.applied_genetic_cost_cents", uc: "$.data.unapplied_credit_cents", dcp: "$.data.disbursed_to_cp_cents", rbs: "$.data.retained_by_state_cents" }
            - call: "GET /child-support/cases/${case_id}"
              as: FinanceOfficer
              captures: { ap: "$.data.arrears_principal_cents", asg: "$.data.assigned_arrears_cents", uasg: "$.data.unassigned_arrears_cents", irec: "$.data.interest_receivable_cents", tcp: "$.data.total_charged_principal_cents", tcol: "$.data.total_collected_principal_cents" }
            - call: "GET /child-support/charges/${ch_id}"
              as: FinanceOfficer
              captures: { paid: "$.data.paid_cents", unpaid: "$.data.unpaid_balance_cents", cst: "$.data.status" }
          assert:
            - "${ac} == 20000  # bucket 1 of the waterfall: received_at 2026-08-20 falls in [2026-08-01, 2026-09-01)"
            - "${am} == 0, ${aa} == 0, ${ai} == 0, ${ag} == 0, ${uc} == 0"
            - "${dcp} == 10000  # tanf branch: pass_through = min(applied_current 20000, TANF_PASS_THROUGH_CENTS 10000)"
            - "${rbs} == 10000  # distributable 20000 - pass_through 10000"
            - "${dcp} + ${rbs} + ${uc} == 20000  # the declared conservation invariant"
            - "${paid} == 20000, ${unpaid} == 55000, ${cst} == OPEN"
            - "${ap} == 55000  # sum of unpaid_balance over OPEN charges with due_date 2026-08-15 <= clock date 2026-08-20"
            - "${asg} == 55000 and ${uasg} == 0  # tanf_assistance true assigns the whole balance to the state"
            - "${irec} == 0  # the aggregate variant snapshots month ends strictly before 2026-08-20; the last one is 2026-07-31, when nothing was yet due"
            - "${tcp} == 75000 and ${tcol} == 20000"

      - name: system_fields_are_clock_derived_and_version_increments_on_patch
        claim_type: system_fields
        grounds:
          - "entities.Participant.common_fields"
          - "endpoints[POST /child-support/participants]"
          - "endpoints[PATCH /child-support/participants/{participant_id}/income]"
          - "endpoints[POST /child-support/_clock/set_current_utc]"
        distinguishing_aspect: >
          id, created_at, updated_at and version are minted by the server from the
          logical clock and never echoed from input: two participants created a
          month apart carry different created_at values equal to the clock at their
          creation, and a later PATCH moves updated_at and version to 2 while
          created_at and id stay frozen.
        test_recipe:
          setup:
            - "Empty database. The clock is moved explicitly between the two creates and again before the patch."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "1616", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { p1: "$.data.id", p1_created: "$.data.created_at", p1_updated: "$.data.updated_at", p1_ver: "$.data.version" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "1717", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { p2: "$.data.id", p2_created: "$.data.created_at", p2_ver: "$.data.version" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "PATCH /child-support/participants/${p1}/income"
              payload: { monthly_gross_income_cents: 330000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { p1b: "$.data.id", p1b_created: "$.data.created_at", p1b_updated: "$.data.updated_at", p1b_ver: "$.data.version", p1b_inc: "$.data.monthly_gross_income_cents" }
            - call: "GET /child-support/participants/${p2}"
              as: CaseWorker
              captures: { p2b_updated: "$.data.updated_at", p2b_ver: "$.data.version" }
          assert:
            - "${p1_created} == 2026-08-01T00:00:00Z and ${p1_updated} == 2026-08-01T00:00:00Z and ${p1_ver} == 1"
            - "${p2_created} == 2026-09-01T00:00:00Z and ${p2_ver} == 1  # the second create reads the moved clock, not the process start time"
            - "${p1_created} != ${p2_created}"
            - "${p1} != ${p2}  # ids are distinct server-minted uuids"
            - "${p1b} == ${p1} and ${p1b_created} == 2026-08-01T00:00:00Z  # id and created_at are frozen by the patch"
            - "${p1b_updated} == 2026-10-01T00:00:00Z and ${p1b_ver} == 2"
            - "${p1b_inc} == 330000"
            - "${p2b_updated} == 2026-09-01T00:00:00Z and ${p2b_ver} == 1  # patching one row leaves the other untouched"

