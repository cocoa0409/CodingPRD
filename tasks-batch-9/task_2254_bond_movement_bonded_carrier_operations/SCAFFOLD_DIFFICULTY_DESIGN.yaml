              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 41.75, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-300" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b3: $.data.id }
          trigger:
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0011", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b3}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m_edge: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0012", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b3}" }
              as: BondedCarrier
              as_user_id: "${c1}"
          assert:
            - "the first filing returned HTTP 201 with InBondMovement.${m_edge}.transit_status == FILED"
            - "InBondMovement.${m_edge}.obligation_amount == 41.75"
            - "CustomsBond.${b3}.obligated_amount == 41.75"
            - "CustomsBond.${b3}.available_amount == 0.00"
            - "CustomsBond.${b3}.status == SATURATED"
            - "CustomsBond.${b3}.open_movement_count == 1"
