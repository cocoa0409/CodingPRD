        grounds:
          - validations[priority=6]
          - errors[ERR_EMPLOYEE_NOT_ACTIVE]
          - endpoints.POST_/paychecks
          - entities.Employee.fields.status
        distinguishing_aspect: |
          Paycheck creation's validity depends on a different entity's state — Employee.status
          must be IN {ACTIVE, ON_LEAVE}, never TERMINATED. POST /paychecks against a TERMINATED
          employee is rejected with ERR_EMPLOYEE_NOT_ACTIVE (409). Entity pair: Paycheck -> Employee.
