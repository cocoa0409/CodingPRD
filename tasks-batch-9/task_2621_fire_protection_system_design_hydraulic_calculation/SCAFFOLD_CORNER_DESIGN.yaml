          The compound join fires only when BOTH dimensions of every acceptance test are terminal:
          the PUMP_FLOW_TEST passes at 2100.0 gpm / 55.00 psi against the frozen 2023.5 / 50.54
          thresholds (which also flips the SIZED pump to ACCEPTED), and only the following
