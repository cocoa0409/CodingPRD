              payload: {}
              as: Registrar
              captures: { v_after_reject: $.data.version, post_after_reject: $.data.continuity_posture }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
              captures: { v1: $.data.version }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
              captures: { v2: $.data.version, post_mid: $.data.continuity_posture }
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "ELEVATED", reason: "hurricane watch" }
              as: LmsAdmin
              captures: { post1: $.data.continuity_posture, life_mid: $.data.lifecycle_state, v3: $.data.version }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "FINALS" }
              as: Registrar
              captures: { life1: $.data.lifecycle_state, post2: $.data.continuity_posture, v4: $.data.version }
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "NORMAL" }
