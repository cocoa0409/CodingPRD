scenario: |
  Generate task harder than expert level!

  2564. Student Records Transfer & Education Records Requests (district student records office):
  withdrawal processing and records request routing between districts with statutory response
  windows, cumulative file assembly across academic, health, discipline and special education
  components, disciplinary record transfer rules and state-specific inclusion requirements,
  parent and eligible-student inspection requests with review appointments, amendment requests,
  hearings and statements of disagreement, directory information designation with opt-out
  enforcement, subpoena and law enforcement request handling with notification duties, records
  retention and destruction schedules

domain_name: "student-records-transfer"
api_prefix: "/records-office"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hybrid
  # Star-shaped: Student is the hub that Withdrawal / CumulativeFile / DisciplineIncident /
  # InspectionRequest / LegalDemand / DisclosureLogEntry hang off by FK, with one genuine
  # two-level hierarchy (CumulativeFile -> FileComponent -> RetentionSchedule anchor) and
  # cross-aggregate references (RecordsRequest -> two Districts; AmendmentRequest ->
  # FileComponent + HearingOfficer; ReviewAppointment -> InspectionRoom).

  state_machine_shape: compound
  # CumulativeFile.assembly_status is derived from its FileComponent statuses (compound), and
  # that derived value gates RecordsRequest.mark-ready. Two machines are additionally cyclic
  # (RecordsRequest READY_FOR_RELEASE -> ASSEMBLING; Withdrawal CLEARED -> HOLD -> CLEARED)
  # and two are branching (AmendmentRequest, LegalDemand).

  relationship_patterns:
    - one_to_many        # Student -> Withdrawal / DisciplineIncident / InspectionRequest / LegalDemand
    - cross_aggregate    # RecordsRequest -> requesting_district_id + responding_district_id
    - polymorphic        # DisclosureLogEntry.source_type + source_id resolve to three request families
    - natural_key_reference  # Withdrawal.destination_district_code -> District.district_code

  role_model: segregation_of_duties
  # The RecordsOfficer who issued an AmendmentRequest's initial denial MUST NOT issue the
  # post-hearing decision on the same request (FERPA "official without a direct interest").

  consistency_model: immediate

  difficulty_level: expert_plus
  # 16 entities / 65 endpoints / 77 error codes / 8 calculations (3 with variants) /
  # 46 priority-ordered validations / 10 state machines (3 cyclic, 2 branching, 1 compound) /
  # 2 OCC rules / 8 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: District legal name.
      - name: district_code
        type: string
        source: input
        description: Short district identifier, unique across all districts.
        constraints: "unique; 2-12 chars, uppercase alphanumeric"
      - name: state_code
        type: enum
        source: input
        description: State whose StateRecordsRule governs this district's records practice.
        constraints: "one of {CA, TX, NY}; a StateRecordsRule row with this state_code MUST already exist"
      - name: open_request_count
        type: integer
        source: computed
        description: >
          Count of RecordsRequest rows whose responding_district_id == this District.id and whose
          status IN {RECEIVED, VALIDATED, ASSEMBLING, READY_FOR_RELEASE}. Recomputed on every
          RecordsRequest status change (cross-entity derived field).
        default: 0

  - name: StateRecordsRule
    parent: null
    common_fields: false
    fields:
      - name: state_code
        type: enum
        source: input
        description: State this rule row governs; the natural key of the table.
        constraints: "one of {CA, TX, NY}; unique — a second POST with the same state_code is rejected"
      - name: transfer_response_days
        type: integer
        source: input
        description: Statutory business-day window for responding to an inter-district records request.
        constraints: ">= 1 and <= 90"
      - name: discipline_inclusion_mode
        type: enum
        source: input
        description: Which DisciplineIncident rows may be transferred out of this state.
        constraints: "one of {ALL_INCIDENTS, SUSPENSIONS_AND_EXPULSIONS, EXPULSIONS_ONLY}"
      - name: discipline_min_days_removed
        type: integer
        source: input
        description: >
          Under SUSPENSIONS_AND_EXPULSIONS, a SUSPENSION transfers only when
          DisciplineIncident.days_removed >= this value (inclusive). Ignored by the other modes.
        default: 10
      - name: include_pending_investigations
        type: boolean
        source: input
        description: Whether incidents with incident_status == PENDING_INVESTIGATION may transfer.
      - name: sped_requires_consent
        type: boolean
        source: input
        description: >
          Whether releasing a SPECIAL_EDUCATION component requires
          RecordsRequest.sped_consent_on_file == true, and whether the statutory window is
          extended by SPED_CONSENT_EXTENSION_DAYS.
      - name: amendment_hearing_days
        type: integer
        source: input
        description: Calendar days after an amendment denial within which the hearing must start.
        constraints: ">= 1 and <= 90"
      - name: destruction_min_age_years
        type: integer
        source: input
        description: Whole years that must elapse past the retention anchor before destruction.
        constraints: ">= 1 and <= 30"
      - name: directory_optout_grace_days
        type: integer
        source: input
        description: Calendar days after Student.created_at during which a directory opt-out is accepted.
        constraints: ">= 1 and <= 120"
      - name: notification_wait_days
        type: integer
        source: input
        description: Calendar days the district must wait after notifying the parent before producing records under a legal demand.
        constraints: ">= 0 and <= 30"

  - name: Student
    parent: District
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> District.id; the district of enrollment and the responding district for transfers."
      - name: first_name
        type: string
        source: input
        description: Student given name.
      - name: last_name
        type: string
        source: input
        description: Student family name.
      - name: dob
        type: string
        source: input
        description: Date of birth, ISO 8601 calendar date (YYYY-MM-DD).
        constraints: "must parse as a calendar date and be strictly before the current logical clock date"
      - name: grade_level
        type: integer
        source: input
        description: Current grade level.
        constraints: ">= 0 and <= 12"
      - name: has_iep
        type: boolean
        source: input
        description: Whether the student has an active IEP, which makes SPECIAL_EDUCATION a required cumulative-file component.
        default: false
      - name: guardian_user_id
        type: string
        source: input
        description: Opaque operator id of the parent/guardian who holds FERPA rights while the student is not eligible.
      - name: student_user_id
        type: string
        source: input
        description: Opaque operator id the student uses once rights transfer at ELIGIBLE_STUDENT_AGE_YEARS. Nullable.
        default: null
      - name: enrollment_status
        type: enum
        source: computed
        description: Enrollment lifecycle; see the Student state machine.
        default: ENROLLED
        constraints: "one of {ENROLLED, WITHDRAWAL_PENDING, WITHDRAWN, TRANSFERRED_OUT}"
      - name: is_eligible_student
        type: boolean
        source: computed
        description: >
          true iff whole_years_between(dob, clock_now) >= ELIGIBLE_STUDENT_AGE_YEARS (18).
          Recomputed on every read and on every mutation; see calculations.eligible_student_status.
        default: false
      - name: directory_optout_deadline_at
        type: datetime
        source: computed
        description: >
          created_at + StateRecordsRule[district.state_code].directory_optout_grace_days calendar
          days, at the identical time-of-day instant. Pinned at creation and never recomputed.
      - name: directory_optout_received_at
        type: datetime
        source: system
        description: Logical-clock instant of the accepted directory opt-out. Nullable.
        default: null
      - name: directory_optout_categories
        type: array
        source: input
        description: >
          Directory categories the opt-out covers; empty array while no opt-out is on file. Stored
          in the fixed order [NAME, ADDRESS, PHONE, PHOTO, HONORS, SPORTS_PARTICIPATION] regardless
          of the order supplied.
        constraints: "non-empty when supplied; every element one of {NAME, ADDRESS, PHONE, PHOTO, HONORS, SPORTS_PARTICIPATION}"
        default: []
      - name: directory_optout_effective
        type: boolean
        source: computed
        description: >
          true iff directory_optout_received_at IS NOT NULL AND
          directory_optout_received_at <= directory_optout_deadline_at (inclusive boundary).
        default: false
      - name: exit_effective_date
        type: string
        source: system
        description: Withdrawal.effective_date copied on withdrawal completion; the EXIT_ANCHORED retention anchor date. Nullable.
        default: null
      - name: records_disposition_date
        type: datetime
        source: computed
        description: >
          Mirror of the student's RetentionSchedule.destruction_eligible_at (derived-field
          reconciliation); NULL until a RetentionSchedule exists.
        default: null

  - name: Withdrawal
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the withdrawing student."
      - name: effective_date
        type: string
        source: input
        description: Last day of enrollment, ISO 8601 calendar date (YYYY-MM-DD).
      - name: destination_district_code
        type: string
        source: input
        description: >
          Natural-key reference resolved as District.district_code == this value; NOT an FK field.
          Nullable when the family did not name a receiving district.
        default: null
      - name: withdrawal_reason
        type: enum
        source: input
        description: Reason recorded on the withdrawal form.
        constraints: "one of {TRANSFER_OUT, MOVED, HOMESCHOOL, OTHER}"
      - name: status
        type: enum
        source: computed
        description: Clearance lifecycle; see the Withdrawal state machine.
        default: CLEARED
        constraints: "one of {CLEARED, HOLD, COMPLETED}"
      - name: hold_count
        type: integer
        source: computed
        description: Number of entries in active_hold_types; status == HOLD iff hold_count >= 1.
        default: 0
      - name: active_hold_types
        type: array
        source: computed
        description: >
          Distinct hold types currently blocking clearance, kept sorted ascending by hold_type
          enum name. Values drawn from {UNRETURNED_PROPERTY, LIBRARY_FINE, MEAL_ACCOUNT, SPED_EXIT_MEETING}.
        default: []
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant of completion. Nullable.
        default: null

  - name: CumulativeFile
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; exactly one CumulativeFile per Student, minted by POST /records-office/students."
      - name: assembly_status
        type: enum
        source: computed
        description: Compound state derived from the file's FileComponent statuses; see the CumulativeFile state machine.
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, IN_ASSEMBLY, COMPLETE}"
      - name: required_component_types
        type: array
        source: computed
        description: >
          [ACADEMIC, HEALTH, DISCIPLINE] plus SPECIAL_EDUCATION when Student.has_iep == true;
          pinned at file creation from the student's has_iep value.
      - name: certified_component_count
        type: integer
        source: computed
        description: Count of this file's FileComponent rows whose component_type is in required_component_types and whose status == CERTIFIED.
        default: 0
      - name: completeness_pct
        type: number
        source: computed
        description: See calculations.cumulative_file_completeness; one decimal place, round_half_up.
        default: 0.0
      - name: total_page_count
        type: integer
        source: computed
        description: Sum of FileComponent.page_count over ALL components of this file regardless of status. The conserved quantity of the page-custody invariant.
        default: 0
      - name: included_page_count
        type: integer
        source: computed
        description: Sum of FileComponent.page_count over components with status IN {COLLECTED, CERTIFIED}.
        default: 0
      - name: excluded_page_count
        type: integer
        source: computed
        description: Sum of FileComponent.page_count over components with status == EXCLUDED.
        default: 0
      - name: disclosable_page_count
        type: integer
        source: computed
        description: Sum of (page_count - redacted_page_count) over components with status IN {COLLECTED, CERTIFIED}.
        default: 0
      - name: last_packet_snapshot_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent RecordsRequest packet snapshot taken against this file. Nullable.
        default: null

  - name: FileComponent
    parent: CumulativeFile
    common_fields: true
    fields:
      - name: cumulative_file_id
        type: string
        source: system
        description: "FK -> CumulativeFile.id; set when the file seeds its components."
      - name: component_type
        type: enum
        source: system
        description: Which slice of the cumulative file this row holds.
        constraints: "one of {ACADEMIC, HEALTH, DISCIPLINE, SPECIAL_EDUCATION}; unique per cumulative_file_id"
      - name: status
        type: enum
        source: computed
        description: Assembly lifecycle of this component; see the FileComponent state machine.
        default: PENDING
        constraints: "one of {PENDING, COLLECTED, CERTIFIED, EXCLUDED}"
      - name: page_count
        type: integer
        source: input
        description: Pages held in this component. Required when moving PENDING -> COLLECTED.
        default: 0
        constraints: ">= 0 and <= 5000"
      - name: redacted_page_count
        type: integer
        source: input
        description: Pages withheld inside the component (other-student information); never exceeds page_count.
        default: 0
        constraints: ">= 0 and <= page_count"
      - name: disclosable_page_count
        type: integer
        source: computed
        description: page_count - redacted_page_count.
        default: 0
      - name: exclusion_reason
        type: enum
        source: input
        description: Required when status becomes EXCLUDED; cleared to null on reinstatement.
        default: null
        constraints: "one of {OTHER_STUDENT_INFO, SEALED_BY_COURT, DUPLICATE_OF_TRANSCRIPT}"
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who last certified this component. Nullable.
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent certification; cleared to null when the component leaves CERTIFIED. Nullable.
        default: null
      - name: amendment_count
        type: integer
        source: system
        description: Number of AmendmentRequest rows against this component that reached AMENDED.
        default: 0
      - name: statement_of_disagreement_present
        type: boolean
        source: system
        description: Set true when an AmendmentRequest against this component reaches STATEMENT_FILED; the statement adds STATEMENT_PAGE_COUNT pages to page_count.
        default: false
      - name: is_required
        type: boolean
        source: computed
        description: true iff component_type is in the parent CumulativeFile.required_component_types.
        default: true

  - name: DisciplineIncident
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the disciplined student."
      - name: incident_date
        type: string
        source: input
        description: Date of the incident, ISO 8601 calendar date (YYYY-MM-DD).
      - name: action_type
        type: enum
        source: input
        description: Disciplinary action imposed.
        constraints: "one of {SUSPENSION, EXPULSION, DETENTION, BEHAVIOR_PLAN}"
      - name: days_removed
        type: integer
        source: input
        description: Instructional days the student was removed; compared against StateRecordsRule.discipline_min_days_removed.
        default: 0
        constraints: ">= 0 and <= 365"
      - name: incident_status
        type: enum
        source: input
        description: Adjudication status of the incident inside the district.
        constraints: "one of {SUSTAINED, PENDING_INVESTIGATION, DISMISSED}"
      - name: adjudicated_by_court
        type: boolean
        source: input
        description: Whether a court adjudicated the underlying conduct; required for transfer under EXPULSIONS_ONLY.
        default: false
      - name: description
        type: string
        source: input
        description: Narrative summary recorded in the discipline component.
      - name: transfer_inclusion_state
        type: enum
        source: computed
        description: >
          Result of the governing discipline-inclusion pass for the most recent packet snapshot
          taken against this student; see calculations.discipline_inclusion_set.
        default: NOT_EVALUATED
        constraints: "one of {NOT_EVALUATED, INCLUDED, WITHHELD}"

  - name: RecordsRequest
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student whose records are demanded."
      - name: requesting_district_id
        type: string
        source: input
        description: "FK -> District.id; the receiving district asking for the record. MUST equal X-User-ID for role ReceivingRegistrar."
      - name: responding_district_id
        type: string
        source: input
        description: "FK -> District.id; the sending district that owns the record. MUST equal Student.district_id."
      - name: request_priority
        type: enum
        source: input
        description: STANDARD, or UNACCOMPANIED_YOUTH which caps the statutory window at EXPEDITED_CAP_DAYS.
        default: STANDARD
        constraints: "one of {STANDARD, UNACCOMPANIED_YOUTH}"
      - name: includes_special_education
        type: boolean
        source: input
        description: Whether the requesting district demands the SPECIAL_EDUCATION component.
        default: false
      - name: sped_consent_on_file
        type: boolean
        source: input
        description: Whether signed consent for special-education record release is on file.
        default: false
      - name: authorization_reference
        type: string
        source: input
        description: Enrollment-authorization document reference supplied by the requesting district. Nullable.
        default: null
      - name: authorization_verified
        type: boolean
        source: computed
        description: Set true by the validate transition when the responding district confirms the authorization reference.
        default: false
      - name: status
        type: enum
        source: computed
        description: Routing lifecycle; see the RecordsRequest state machine.
        default: RECEIVED
        constraints: "one of {RECEIVED, VALIDATED, ASSEMBLING, READY_FOR_RELEASE, RELEASED, DENIED}"
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant the request was logged; the statutory-window start instant.
      - name: statutory_days_allowed
        type: integer
        source: computed
        description: Business days granted by calculations.records_request_due_at for the current facts.
      - name: statutory_due_at
        type: datetime
        source: computed
        description: See calculations.records_request_due_at; recomputed on the validate transition and never afterwards.
      - name: is_overdue
        type: boolean
        source: computed
        description: >
          Set true by POST /records-office/compliance-sweeps when clock_now > statutory_due_at and
          status IN {RECEIVED, VALIDATED, ASSEMBLING, READY_FOR_RELEASE}; strict greater-than.
        default: false
      - name: packet_status
        type: enum
        source: computed
        description: NONE before any snapshot, SNAPSHOT after mark-ready, VOID after the file reopens under it.
        default: NONE
        constraints: "one of {NONE, SNAPSHOT, VOID}"
      - name: packet_page_count
        type: integer
        source: computed
        description: See calculations.disclosure_packet_page_count; NULL until the first snapshot. Nullable.
        default: null
      - name: included_incident_count
        type: integer
        source: computed
        description: Governing (RESPONDING_STATE) included-incident count from calculations.discipline_inclusion_set. Nullable.
        default: null
      - name: withheld_incident_count
        type: integer
        source: computed
        description: Governing withheld-incident count; included_incident_count + withheld_incident_count equals the student's DisciplineIncident row count. Nullable.
        default: null
      - name: receiving_state_inclusion_count
        type: integer
        source: computed
        description: Advisory REQUESTING_STATE variant count from calculations.discipline_inclusion_set. Nullable.
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: Number of times this request fell back from READY_FOR_RELEASE to ASSEMBLING.
        default: 0
      - name: denial_reason
        type: enum
        source: input
        description: Reason recorded on denial. Nullable.
        default: null
        constraints: "one of {NO_ENROLLMENT_AUTHORIZATION, STUDENT_NOT_IN_DISTRICT, DUPLICATE_REQUEST, COURT_SEALED}"
      - name: transmission_method
        type: enum
        source: input
        description: How the packet was transmitted on release. Nullable.
        default: null
        constraints: "one of {SECURE_PORTAL, ENCRYPTED_EMAIL, CERTIFIED_MAIL}"
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant of release. Nullable.
        default: null

  - name: InspectionRoom
    parent: null
    common_fields: true
    fields:
      - name: room_code
        type: string
        source: input
        description: Short room identifier, unique across all inspection rooms.
        constraints: "unique; 2-12 chars"
      - name: site_name
        type: string
        source: input
        description: Building or office where the room sits.
      - name: seats
        type: integer
        source: input
        description: Seat capacity of the room.
        constraints: ">= 1 and <= 40"
      - name: status
        type: enum
        source: input
        description: Whether the room may take new appointments.
        default: ACTIVE
        constraints: "one of {ACTIVE, CLOSED}"

  - name: InspectionRequest
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student whose record is to be inspected."
      - name: requester_user_id
        type: string
        source: system
        description: X-User-ID of the parent or eligible student who filed the request.
      - name: requester_role
        type: enum
        source: system
        description: Which rights-holder filed the request, derived from X-User-Role.
        constraints: "one of {PARENT, ELIGIBLE_STUDENT}"
      - name: requested_categories
        type: array
        source: input
        description: Component types the requester wants to inspect; non-empty subset of {ACADEMIC, HEALTH, DISCIPLINE, SPECIAL_EDUCATION}.
      - name: copies_requested
        type: boolean
        source: input
        description: Whether the requester wants copies, which assesses the copy fee.
        default: false
      - name: status
        type: enum
        source: computed
        description: Inspection lifecycle; see the InspectionRequest state machine.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, SCHEDULED, COMPLETED, EXPIRED}"
      - name: statutory_inspection_due_at
        type: datetime
        source: computed
        description: created_at + INSPECTION_WINDOW_DAYS (45) calendar days at the identical time-of-day instant; pinned at creation.
      - name: base_copy_fee_cents
        type: integer
        source: computed
        description: See calculations.inspection_copy_fee_cents; 0 when copies_requested == false.
        default: 0
      - name: certification_fee_cents
        type: integer
        source: computed
        description: See calculations.inspection_fee_assessment; tier keyed on base_copy_fee_cents only.
        default: 0
      - name: fee_assessed_cents
        type: integer
        source: computed
        description: base_copy_fee_cents + certification_fee_cents, pinned at creation and never recomputed.
        default: 0
      - name: fee_collected_cents
        type: integer
        source: computed
        description: Running total of PAYMENT fee transactions minus REVERSAL fee transactions.
        default: 0
      - name: fee_waived_cents
        type: integer
        source: computed
        description: Running total of WAIVER fee transactions.
        default: 0
      - name: fee_outstanding_cents
        type: integer
        source: computed
        description: fee_assessed_cents - fee_collected_cents - fee_waived_cents; the fee-custody invariant residual.
        default: 0
      - name: inspection_completed_at
        type: datetime
        source: system
        description: Logical-clock instant the review appointment was marked attended. Nullable.
        default: null

  - name: ReviewAppointment
    parent: InspectionRequest
    common_fields: true
    fields:
      - name: inspection_request_id
        type: string
        source: input
        description: "FK -> InspectionRequest.id; the request this appointment serves."
      - name: room_id
        type: string
        source: input
        description: "FK -> InspectionRoom.id; the room occupied for the review."
      - name: start_at
        type: datetime
        source: input
        description: Appointment start instant, ISO 8601 UTC.
      - name: end_at
        type: datetime
        source: input
        description: Appointment end instant, ISO 8601 UTC; MUST be strictly after start_at.
      - name: duration_minutes
        type: integer
        source: computed
        description: Whole minutes between start_at and end_at.
      - name: status
        type: enum
        source: computed
        description: Appointment lifecycle; see the ReviewAppointment state machine.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, ATTENDED, SUPERSEDED, EXPIRED}"
      - name: attended_at
        type: datetime
        source: system
        description: Logical-clock instant attendance was recorded. Nullable.
        default: null

  - name: HearingOfficer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Hearing officer name printed on the decision.
      - name: credential
        type: enum
        source: input
        description: Basis on which the officer may hear an amendment challenge.
        constraints: "one of {ADMINISTRATIVE_LAW_JUDGE, DISTRICT_DESIGNEE, EXTERNAL_CONTRACTOR}"
      - name: status
        type: enum
        source: input
        description: Whether the officer may take new hearings.
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: AmendmentRequest
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student whose record is challenged."
      - name: contested_component_id
        type: string
        source: input
        description: "FK -> FileComponent.id; the component holding the contested content. MUST belong to the student's CumulativeFile."
      - name: hearing_officer_id
        type: string
        source: input
        description: "FK -> HearingOfficer.id; assigned when a hearing is scheduled. Nullable."
        default: null
      - name: requester_user_id
        type: string
        source: system
        description: X-User-ID of the rights-holder who filed the challenge.
      - name: contested_field
        type: string
        source: input
        description: Name of the record element alleged to be inaccurate or misleading.
      - name: requested_change
        type: string
        source: input
        description: The correction the requester asks the district to make.
      - name: rationale
        type: string
        source: input
        description: Requester's stated basis for the challenge.
      - name: status
        type: enum
        source: computed
        description: Amendment lifecycle; see the AmendmentRequest state machine.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, AMENDED, DENIED, HEARING_REQUESTED, HEARING_SCHEDULED, UPHELD, STATEMENT_FILED}"
      - name: initial_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer who decided the pre-hearing review. Nullable.
        default: null
      - name: hearing_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer who decided after the hearing; MUST differ from initial_decided_by_user_id. Nullable.
        default: null
      - name: denied_at
        type: datetime
        source: system
        description: Logical-clock instant of the pre-hearing denial; the hearing-window anchor. Nullable.
        default: null
      - name: hearing_due_at
        type: datetime
        source: computed
        description: denied_at + StateRecordsRule[student.district.state_code].amendment_hearing_days calendar days, identical time-of-day. Nullable.
        default: null
      - name: hearing_start_at
        type: datetime
        source: input
        description: Scheduled hearing start instant. Nullable.
        default: null
      - name: hearing_end_at
        type: datetime
        source: input
        description: Scheduled hearing end instant; MUST be strictly after hearing_start_at. Nullable.
        default: null
      - name: hearing_duration_minutes
        type: integer
        source: computed
        description: Whole minutes between hearing_start_at and hearing_end_at; charged against the officer's daily cap. Nullable.
        default: null
      - name: statement_text
        type: string
        source: input
        description: Parent/eligible-student statement of disagreement filed after an upheld decision. Nullable.
        default: null
      - name: statement_filed_at
        type: datetime
        source: system
        description: Logical-clock instant the statement was filed. Nullable.
        default: null

  - name: LegalDemand
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student named in the demand."
      - name: demand_type
        type: enum
        source: input
        description: Legal instrument compelling or requesting disclosure.
        constraints: "one of {JUDICIAL_SUBPOENA, GRAND_JURY_SUBPOENA, LAW_ENFORCEMENT_REQUEST, EX_PARTE_ORDER}"
      - name: issuing_authority
        type: string
        source: input
        description: Court, grand jury, or agency that issued the instrument.
      - name: case_reference
        type: string
        source: input
        description: Docket or case number recorded in the disclosure log.
      - name: production_scope
        type: array
        source: input
        description: Component types the demand reaches; non-empty subset of {ACADEMIC, HEALTH, DISCIPLINE, SPECIAL_EDUCATION}.
      - name: notification_waived
        type: boolean
        source: input
        description: Whether the notification duty is waived by the instrument itself.
        default: false
      - name: waiver_basis
        type: enum
        source: input
        description: Statutory basis for waiving notification; required when notification_waived == true. Nullable.
        default: null
        constraints: "one of {GRAND_JURY_ORDER, EX_PARTE_COURT_ORDER, LAW_ENFORCEMENT_DIRECTIVE}"
      - name: status
        type: enum
        source: computed
        description: Handling lifecycle; see the LegalDemand state machine.
        default: RECEIVED
        constraints: "one of {RECEIVED, NOTIFIED, PRODUCED}"
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant the demand was logged.
      - name: notified_party
        type: enum
        source: input
        description: Who received the pre-production notification. Nullable.
        default: null
        constraints: "one of {PARENT, ELIGIBLE_STUDENT}"
      - name: notification_sent_at
        type: datetime
        source: system
        description: Logical-clock instant notification was sent. Nullable.
        default: null
      - name: production_allowed_at
        type: datetime
        source: computed
        description: >
          notification_sent_at + StateRecordsRule[student.district.state_code].notification_wait_days
          calendar days at the identical time-of-day instant. NULL while notification_waived == true. Nullable.
        default: null
      - name: produced_at
        type: datetime
        source: system
        description: Logical-clock instant of production. Nullable.
        default: null
      - name: produced_page_count
        type: integer
        source: input
        description: Pages actually produced under the demand. Nullable.
        default: null

  - name: DisclosureLogEntry
    parent: Student
    common_fields: false
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student whose record was disclosed."
      - name: disclosure_type
        type: enum
        source: system
        description: Channel through which the disclosure happened.
        constraints: "one of {INTERDISTRICT_TRANSFER, DIRECTORY_INFORMATION, LEGAL_DEMAND, PARENT_INSPECTION}"
      - name: source_type
        type: enum
        source: system
        description: Which request family produced this entry; resolves source_id polymorphically.
        constraints: "one of {RECORDS_REQUEST, LEGAL_DEMAND, STUDENT_DIRECTORY, INSPECTION_REQUEST}"
      - name: source_id
        type: string
        source: system
        description: >
          Polymorphic id of the originating row — RecordsRequest.id, LegalDemand.id,
          InspectionRequest.id, or the Student.id for STUDENT_DIRECTORY. Deliberately NOT an FK
          field because the target entity varies with source_type. Nullable.
        default: null
      - name: recipient_name
        type: string
        source: input
        description: Party the record went to, as recorded for the FERPA disclosure log.
      - name: disclosed_categories
        type: array
        source: input
        description: >
          Categories actually disclosed. Cascade-created entries fill this from the packet's
          component types in the fixed order [ACADEMIC, HEALTH, DISCIPLINE, SPECIAL_EDUCATION];
          directory disclosures fill it from the caller's directory-category list in the fixed
          order [NAME, ADDRESS, PHONE, PHOTO, HONORS, SPORTS_PARTICIPATION].
        constraints: "non-empty; elements drawn from the component-type set or the directory-category set depending on disclosure_type"
      - name: page_count
        type: integer
        source: system
        description: Pages disclosed in this event.
        default: 0
      - name: disclosed_at
        type: datetime
        source: system
        description: Logical-clock instant of the disclosure; the LAST_ACTIVITY retention anchor candidate.
      - name: logged_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who performed the disclosure.
      - name: legitimate_interest_note
        type: string
        source: input
        description: Statement of the recipient's legitimate educational interest or legal basis. Nullable.
        default: null

  - name: RetentionSchedule
    parent: CumulativeFile
    common_fields: true
    fields:
      - name: cumulative_file_id
        type: string
        source: system
        description: "FK -> CumulativeFile.id; exactly one schedule per file, minted when the file enters IN_ASSEMBLY."
      - name: exit_anchor_at
        type: datetime
        source: system
        description: Student.exit_effective_date at 00:00:00.000Z; the EXIT_ANCHORED variant anchor.
      - name: last_activity_at
        type: datetime
        source: computed
        description: See calculations.retention_destruction_eligible_at; the LAST_ACTIVITY_ANCHORED variant anchor.
      - name: destruction_min_age_years
        type: integer
        source: system
        description: StateRecordsRule[student.district.state_code].destruction_min_age_years copied at schedule creation.
      - name: destruction_eligible_at
        type: datetime
        source: computed
        description: Governing LAST_ACTIVITY_ANCHORED result — last_activity_at plus destruction_min_age_years whole years.
      - name: exit_anchored_eligible_at
        type: datetime
        source: computed
        description: Advisory EXIT_ANCHORED result — exit_anchor_at plus destruction_min_age_years whole years.
      - name: status
        type: enum
        source: computed
        description: Retention lifecycle; see the RetentionSchedule state machine.
        default: ACTIVE
        constraints: "one of {ACTIVE, DESTRUCTION_ELIGIBLE, DESTROYED}"
      - name: destruction_method
        type: enum
        source: input
        description: How the record was destroyed. Nullable.
        default: null
        constraints: "one of {CROSS_CUT_SHRED, INCINERATION, CERTIFIED_DIGITAL_WIPE}"
      - name: certification_note
        type: string
        source: input
        description: Destruction certificate note retained for audit. Nullable.
        default: null
      - name: destroyed_at
        type: datetime
        source: system
        description: Logical-clock instant of destruction. Nullable.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Student
    initial_state: ENROLLED
    terminal_states: [TRANSFERRED_OUT]
    transitions:
      - from: ENROLLED
        to: WITHDRAWAL_PENDING
        trigger: "POST /records-office/students/{id}/withdrawals"
        actor: RecordsClerk
        preconditions:
          - "Student.enrollment_status == ENROLLED"
          - "no Withdrawal row for this student with status IN {CLEARED, HOLD}"
        side_effects:
          - "Withdrawal row created with status CLEARED, hold_count 0, active_hold_types []"
          - "Student.enrollment_status := WITHDRAWAL_PENDING"
      - from: WITHDRAWAL_PENDING
        to: WITHDRAWN
        trigger: "POST /records-office/withdrawals/{id}/complete (cascade link 2)"
        actor: RecordsOfficer
        preconditions:
          - "the Withdrawal named in the path has status == CLEARED"
        side_effects:
          - "Student.enrollment_status := WITHDRAWN"
          - "Student.exit_effective_date := Withdrawal.effective_date"
          - "because Student.enrollment_status became WITHDRAWN, the student's CumulativeFile transitions NOT_STARTED -> IN_ASSEMBLY (cascade link 3)"
      - from: WITHDRAWN
        to: TRANSFERRED_OUT
        trigger: "POST /records-office/records-requests/{id}/release"
        actor: RecordsOfficer
        preconditions:
          - "Student.enrollment_status == WITHDRAWN"
          - "the released RecordsRequest.student_id == Student.id"
        side_effects:
          - "Student.enrollment_status := TRANSFERRED_OUT"
        note: >
          Releasing a packet for a still-ENROLLED student is legal and leaves enrollment_status
          untouched; only a WITHDRAWN student advances to TRANSFERRED_OUT.

  - entity: Withdrawal
    initial_state: CLEARED
    terminal_states: [COMPLETED]
    transitions:
      - from: CLEARED
        to: HOLD
        trigger: "POST /records-office/withdrawals/{id}/holds"
        actor: RecordsClerk
        preconditions:
          - "Withdrawal.status == CLEARED"
          - "hold_type NOT already in active_hold_types"
        side_effects:
          - "active_hold_types := active_hold_types + [hold_type], sorted ascending by enum name"
          - "hold_count := len(active_hold_types)"
      - from: HOLD
        to: HOLD
        trigger: "POST /records-office/withdrawals/{id}/holds (additional hold) or POST /records-office/withdrawals/{id}/hold-releases (non-final release)"
        actor: RecordsClerk
        preconditions:
          - "Withdrawal.status == HOLD"
          - "on place: hold_type NOT in active_hold_types; on release: hold_type IS in active_hold_types AND hold_count >= 2"
        side_effects:
          - "active_hold_types updated; hold_count := len(active_hold_types) which stays >= 1"
      - from: HOLD
        to: CLEARED
        trigger: "POST /records-office/withdrawals/{id}/hold-releases (final release)"
        actor: RecordsClerk
        preconditions:
          - "Withdrawal.status == HOLD"
          - "hold_type IS in active_hold_types AND hold_count == 1"
        side_effects:
          - "active_hold_types := []; hold_count := 0; status := CLEARED"
        note: "This is the cycle CLEARED -> HOLD -> CLEARED; a withdrawal may be held and released any number of times."
      - from: CLEARED
        to: COMPLETED
        trigger: "POST /records-office/withdrawals/{id}/complete"
        actor: RecordsOfficer
        preconditions:
          - "Withdrawal.status == CLEARED (hold_count == 0)"
          - "Student.enrollment_status == WITHDRAWAL_PENDING"
        side_effects:
          - "Withdrawal.status := COMPLETED; completed_at := clock_now (cascade link 1)"
          - "Student.enrollment_status := WITHDRAWN and Student.exit_effective_date := Withdrawal.effective_date (cascade link 2)"
          - "because the Student became WITHDRAWN, its CumulativeFile transitions NOT_STARTED -> IN_ASSEMBLY (cascade link 3)"
          - "because the CumulativeFile entered IN_ASSEMBLY, a RetentionSchedule row is minted with status ACTIVE, exit_anchor_at := Student.exit_effective_date at 00:00:00.000Z, last_activity_at and both eligible dates per calculations.retention_destruction_eligible_at (cascade link 4)"
          - "because the RetentionSchedule now exists, Student.records_disposition_date := RetentionSchedule.destruction_eligible_at (cascade link 5)"

  - entity: CumulativeFile
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: IN_ASSEMBLY
        trigger: "system — Student.enrollment_status becomes WITHDRAWN, or the first FileComponent of this file leaves PENDING"
        actor: system
        preconditions:
          - "CumulativeFile.assembly_status == NOT_STARTED"
        side_effects:
          - "assembly_status := IN_ASSEMBLY"
          - "when the trigger was the WITHDRAWN transition, a RetentionSchedule row is minted for this file"
      - from: IN_ASSEMBLY
        to: COMPLETE
        trigger: "system — bubble-up after PATCH /records-office/cumulative-files/{id}/components/{component_id}"
        actor: system
        preconditions:
          - "every component_type in required_component_types has a FileComponent with status == CERTIFIED"
        side_effects:
          - "assembly_status := COMPLETE; completeness_pct := 100.0"
      - from: COMPLETE
        to: IN_ASSEMBLY
        trigger: "system — bubble-up after a required component leaves CERTIFIED (excluded, reinstated, or amended)"
        actor: system
        preconditions:
          - "at least one component_type in required_component_types no longer has a CERTIFIED FileComponent"
        side_effects:
          - "assembly_status := IN_ASSEMBLY; completeness_pct recomputed per calculations.cumulative_file_completeness"
          - "because the file left COMPLETE, every RecordsRequest with this student_id and status == READY_FOR_RELEASE reverts to ASSEMBLING (cascade link 3 of the component cascade)"
        note: "This is the compound cycle IN_ASSEMBLY <-> COMPLETE; the parent's state is a pure function of its children's statuses."

  - entity: FileComponent
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: COLLECTED
        trigger: "PATCH /records-office/cumulative-files/{id}/components/{component_id} with status COLLECTED"
        actor: RecordsClerk
        preconditions:
          - "FileComponent.status == PENDING"
          - "page_count present in the request body"
          - "redacted_page_count (defaulting to 0) <= page_count"
        side_effects:
          - "status := COLLECTED; page_count and redacted_page_count stored; disclosable_page_count := page_count - redacted_page_count"
          - "parent CumulativeFile total_page_count / included_page_count / disclosable_page_count recomputed; parent version incremented by 1"
          - "parent CumulativeFile transitions NOT_STARTED -> IN_ASSEMBLY when it was NOT_STARTED"
      - from: COLLECTED
        to: CERTIFIED
        trigger: "PATCH /records-office/cumulative-files/{id}/components/{component_id} with status CERTIFIED"
        actor: RecordsOfficer
        preconditions:
          - "FileComponent.status == COLLECTED"
          - "FileComponent.page_count >= 1"
        side_effects:
          - "status := CERTIFIED; certified_by_user_id := X-User-ID; certified_at := clock_now"
          - "parent CumulativeFile certified_component_count and completeness_pct recomputed; parent version incremented by 1"
          - "parent may bubble IN_ASSEMBLY -> COMPLETE"
      - from: CERTIFIED
        to: EXCLUDED
        trigger: "PATCH /records-office/cumulative-files/{id}/components/{component_id} with status EXCLUDED"
        actor: RecordsOfficer
        preconditions:
          - "FileComponent.status IN {COLLECTED, CERTIFIED}"
          - "exclusion_reason present in the request body"
        side_effects:
          - "status := EXCLUDED; exclusion_reason stored; certified_by_user_id := null; certified_at := null (cascade link 1)"
          - "parent CumulativeFile.included_page_count -= page_count and excluded_page_count += page_count, leaving total_page_count unchanged; parent version incremented by 1"
          - "because a required component left CERTIFIED, the parent bubbles COMPLETE -> IN_ASSEMBLY (cascade link 2)"
          - "because the parent left COMPLETE, every RecordsRequest for this student in READY_FOR_RELEASE reverts to ASSEMBLING with reopen_count += 1 and packet_status := VOID (cascade link 3)"
          - "because those packets became VOID, their included_incident_count / withheld_incident_count / receiving_state_inclusion_count / packet_page_count are set to null and every DisciplineIncident of the student returns to transfer_inclusion_state NOT_EVALUATED (cascade link 4)"
      - from: COLLECTED
        to: EXCLUDED
        trigger: "PATCH /records-office/cumulative-files/{id}/components/{component_id} with status EXCLUDED"
        actor: RecordsOfficer
        preconditions:
          - "FileComponent.status == COLLECTED"
          - "exclusion_reason present in the request body"
        side_effects:
          - "status := EXCLUDED; exclusion_reason stored"
          - "parent CumulativeFile.included_page_count -= page_count and excluded_page_count += page_count; total_page_count unchanged; parent version incremented by 1"
      - from: EXCLUDED
        to: COLLECTED
        trigger: "PATCH /records-office/cumulative-files/{id}/components/{component_id} with status COLLECTED (reinstatement — the compensating action)"
        actor: RecordsOfficer
        preconditions:
          - "FileComponent.status == EXCLUDED"
        side_effects:
          - "status := COLLECTED; exclusion_reason := null; page_count and redacted_page_count unchanged unless supplied"
          - "parent CumulativeFile.excluded_page_count -= page_count and included_page_count += page_count, restoring the page-custody identity exactly; parent version incremented by 1"
      - from: CERTIFIED
        to: COLLECTED
        trigger: "system — an AmendmentRequest against this component reaches AMENDED"
        actor: system
        preconditions:
          - "FileComponent.status == CERTIFIED"
        side_effects:
          - "status := COLLECTED; certified_by_user_id := null; certified_at := null; amendment_count += 1"
          - "parent CumulativeFile bubbles COMPLETE -> IN_ASSEMBLY and its version is incremented by 1"
          - "because the parent left COMPLETE, READY_FOR_RELEASE RecordsRequests for the student revert to ASSEMBLING with packet_status := VOID"

  - entity: RecordsRequest
    initial_state: RECEIVED
    terminal_states: [RELEASED, DENIED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /records-office/records-requests/{id}/validate"
        actor: RecordsOfficer
        preconditions:
          - "RecordsRequest.status == RECEIVED"
          - "request body authorization_verified == true"
          - "RecordsRequest.authorization_reference IS NOT NULL"
        side_effects:
          - "authorization_verified := true; status := VALIDATED"
          - "statutory_days_allowed and statutory_due_at recomputed per calculations.records_request_due_at and frozen for the rest of the request's life"
      - from: VALIDATED
        to: ASSEMBLING
        trigger: "system — the student's CumulativeFile is in IN_ASSEMBLY or COMPLETE at the moment of validation, or enters IN_ASSEMBLY afterwards"
        actor: system
        preconditions:
          - "RecordsRequest.status == VALIDATED"
          - "the student's CumulativeFile.assembly_status IN {IN_ASSEMBLY, COMPLETE}"
        side_effects:
          - "status := ASSEMBLING"
          - "responding District.open_request_count recomputed"
      - from: ASSEMBLING
        to: READY_FOR_RELEASE
        trigger: "POST /records-office/records-requests/{id}/mark-ready"
        actor: RecordsOfficer
        preconditions:
          - "RecordsRequest.status == ASSEMBLING"
          - "the student's CumulativeFile.assembly_status == COMPLETE (cross-entity dependency)"
          - "expected_cumulative_file_version equals the student's CumulativeFile.version"
          - "when Student.has_iep == true AND the governing StateRecordsRule.sped_requires_consent == true, RecordsRequest.sped_consent_on_file == true"
          - "the CumulativeFile has at least one component with status == CERTIFIED"
        side_effects:
          - "calculations.discipline_inclusion_set runs both variants; included_incident_count / withheld_incident_count / receiving_state_inclusion_count stored; each DisciplineIncident.transfer_inclusion_state set to INCLUDED or WITHHELD"
          - "calculations.disclosure_packet_page_count runs; packet_page_count stored; packet_status := SNAPSHOT"
          - "CumulativeFile.last_packet_snapshot_at := clock_now and CumulativeFile.version incremented by 1"
          - "status := READY_FOR_RELEASE"
      - from: READY_FOR_RELEASE
        to: ASSEMBLING
        trigger: "system — the student's CumulativeFile leaves COMPLETE (component excluded, reinstated, or amended)"
        actor: system
        preconditions:
          - "RecordsRequest.status == READY_FOR_RELEASE"
          - "the student's CumulativeFile.assembly_status != COMPLETE"
        side_effects:
          - "status := ASSEMBLING; reopen_count += 1; packet_status := VOID"
          - "packet_page_count / included_incident_count / withheld_incident_count / receiving_state_inclusion_count := null; every DisciplineIncident of the student returns to NOT_EVALUATED"
        note: "This is the cycle ASSEMBLING -> READY_FOR_RELEASE -> ASSEMBLING; a request may be reopened any number of times."
      - from: READY_FOR_RELEASE
        to: RELEASED
        trigger: "POST /records-office/records-requests/{id}/release"
        actor: RecordsOfficer
        preconditions:
          - "RecordsRequest.status == READY_FOR_RELEASE"
          - "RecordsRequest.packet_status == SNAPSHOT"
          - "no LegalDemand for this student with status IN {RECEIVED, NOTIFIED} and demand_type == EX_PARTE_ORDER"
        side_effects:
          - "status := RELEASED; released_at := clock_now; transmission_method stored"
          - "a DisclosureLogEntry is appended with disclosure_type INTERDISTRICT_TRANSFER, source_type RECORDS_REQUEST, source_id := RecordsRequest.id, page_count := packet_page_count"
          - "because a new DisclosureLogEntry exists, the student's RetentionSchedule.last_activity_at := that entry's disclosed_at and destruction_eligible_at is recomputed; Student.records_disposition_date is re-mirrored"
          - "when Student.enrollment_status == WITHDRAWN it advances to TRANSFERRED_OUT"
          - "responding District.open_request_count recomputed"
      - from: RECEIVED
        to: DENIED
        trigger: "POST /records-office/records-requests/{id}/deny"
        actor: RecordsOfficer
        preconditions:
          - "RecordsRequest.status IN {RECEIVED, VALIDATED, ASSEMBLING}"
          - "denial_reason present in the request body"
        side_effects:
          - "status := DENIED; denial_reason stored"
          - "responding District.open_request_count recomputed"
      - from: VALIDATED
        to: DENIED
        trigger: "POST /records-office/records-requests/{id}/deny"
        actor: RecordsOfficer
        preconditions:
          - "RecordsRequest.status == VALIDATED"
          - "denial_reason present in the request body"
        side_effects:
          - "status := DENIED; denial_reason stored; responding District.open_request_count recomputed"
      - from: ASSEMBLING
        to: DENIED
        trigger: "POST /records-office/records-requests/{id}/deny"
        actor: RecordsOfficer
        preconditions:
          - "RecordsRequest.status == ASSEMBLING"
          - "denial_reason present in the request body"
        side_effects:
          - "status := DENIED; denial_reason stored; responding District.open_request_count recomputed"

  - entity: InspectionRequest
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: SCHEDULED
        trigger: "POST /records-office/inspection-requests/{id}/appointments"
        actor: RecordsOfficer
        preconditions:
          - "InspectionRequest.status IN {SUBMITTED, SCHEDULED}"
          - "expected_inspection_request_version equals InspectionRequest.version"
        side_effects:
          - "a ReviewAppointment row is created with status SCHEDULED"
          - "any prior ReviewAppointment of this request with status SCHEDULED transitions to SUPERSEDED"
          - "status := SCHEDULED; InspectionRequest.version incremented by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /records-office/review-appointments/{id}/attendance with attended == true"
        actor: RecordsOfficer
        preconditions:
          - "InspectionRequest.status == SCHEDULED"
          - "the named ReviewAppointment.status == SCHEDULED and belongs to this request"
        side_effects:
          - "ReviewAppointment.status := ATTENDED; attended_at := clock_now"
          - "because the appointment was attended, InspectionRequest.status := COMPLETED and inspection_completed_at := clock_now"
          - "a DisclosureLogEntry is appended with disclosure_type PARENT_INSPECTION, source_type INSPECTION_REQUEST, source_id := InspectionRequest.id"
          - "because a new DisclosureLogEntry exists, the student's RetentionSchedule.last_activity_at and destruction_eligible_at are recomputed when a schedule exists"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "POST /records-office/compliance-sweeps"
        actor: ComplianceOfficer
        preconditions:
          - "InspectionRequest.status == SUBMITTED"
          - "clock_now > statutory_inspection_due_at (strict greater-than)"
        side_effects:
          - "status := EXPIRED"

  - entity: ReviewAppointment
    initial_state: SCHEDULED
    terminal_states: [ATTENDED, SUPERSEDED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: ATTENDED
        trigger: "POST /records-office/review-appointments/{id}/attendance with attended == true"
        actor: RecordsOfficer
        preconditions:
          - "ReviewAppointment.status == SCHEDULED"
        side_effects:
          - "status := ATTENDED; attended_at := clock_now; parent InspectionRequest bubbles SCHEDULED -> COMPLETED"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system — a newer ReviewAppointment is created for the same InspectionRequest"
        actor: system
        preconditions:
          - "ReviewAppointment.status == SCHEDULED"
        side_effects:
          - "status := SUPERSEDED; the room-occupancy interval is released so it no longer participates in overlap detection"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "POST /records-office/compliance-sweeps"
        actor: ComplianceOfficer
        preconditions:
          - "ReviewAppointment.status == SCHEDULED"
          - "clock_now > end_at (strict greater-than)"
        side_effects:
          - "status := EXPIRED; the room-occupancy interval is released"

  - entity: AmendmentRequest
    initial_state: SUBMITTED
    terminal_states: [AMENDED, STATEMENT_FILED]
    transitions:
      - from: SUBMITTED
        to: AMENDED
        trigger: "POST /records-office/amendment-requests/{id}/decisions with outcome GRANT"
        actor: RecordsOfficer
        preconditions:
          - "AmendmentRequest.status == SUBMITTED"
        side_effects:
          - "status := AMENDED; initial_decided_by_user_id := X-User-ID"
          - "the contested FileComponent transitions CERTIFIED -> COLLECTED with amendment_count += 1, cascading the parent CumulativeFile COMPLETE -> IN_ASSEMBLY and any READY_FOR_RELEASE RecordsRequest back to ASSEMBLING with packet_status VOID"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /records-office/amendment-requests/{id}/decisions with outcome DENY"
        actor: RecordsOfficer
        preconditions:
          - "AmendmentRequest.status == SUBMITTED"
        side_effects:
          - "status := DENIED; initial_decided_by_user_id := X-User-ID; denied_at := clock_now"
          - "hearing_due_at := denied_at + StateRecordsRule[student.district.state_code].amendment_hearing_days calendar days"
      - from: DENIED
        to: HEARING_REQUESTED
        trigger: "POST /records-office/amendment-requests/{id}/hearing-requests"
        actor: Parent
        preconditions:
          - "AmendmentRequest.status == DENIED"
          - "clock_now <= hearing_due_at (inclusive)"
        side_effects:
          - "status := HEARING_REQUESTED"
      - from: HEARING_REQUESTED
        to: HEARING_SCHEDULED
        trigger: "POST /records-office/amendment-requests/{id}/hearing-schedules"
        actor: RecordsOfficer
        preconditions:
          - "AmendmentRequest.status IN {HEARING_REQUESTED, HEARING_SCHEDULED}"
          - "HearingOfficer exists with status == ACTIVE"
          - "hearing_start_at <= hearing_due_at (the hearing must start inside the statutory window)"
          - "no officer-interval collision and no daily-cap breach per validations priority 71 and 72"
        side_effects:
          - "hearing_officer_id, hearing_start_at, hearing_end_at stored; hearing_duration_minutes computed"
          - "status := HEARING_SCHEDULED"
      - from: HEARING_SCHEDULED
        to: HEARING_SCHEDULED
        trigger: "POST /records-office/amendment-requests/{id}/hearing-schedules (reschedule)"
        actor: RecordsOfficer
        preconditions:
          - "AmendmentRequest.status == HEARING_SCHEDULED"
          - "the previously reserved officer interval is released before the new interval is tested, so rescheduling onto the same slot with the same officer is allowed"
        side_effects:
          - "hearing_officer_id, hearing_start_at, hearing_end_at replaced; hearing_duration_minutes recomputed"
        note: "Self-loop cycle: a hearing may be rescheduled any number of times while the statutory window is open."
      - from: HEARING_SCHEDULED
        to: AMENDED
        trigger: "POST /records-office/amendment-requests/{id}/decisions with outcome GRANT"
        actor: RecordsOfficer
        preconditions:
          - "AmendmentRequest.status == HEARING_SCHEDULED"
          - "clock_now >= hearing_end_at (the hearing has been held)"
          - "X-User-ID != initial_decided_by_user_id (segregation of duties)"
        side_effects:
          - "status := AMENDED; hearing_decided_by_user_id := X-User-ID"
          - "the contested FileComponent transitions CERTIFIED -> COLLECTED with amendment_count += 1 and the parent/packet cascade fires"
      - from: HEARING_SCHEDULED
        to: UPHELD
        trigger: "POST /records-office/amendment-requests/{id}/decisions with outcome DENY"
        actor: RecordsOfficer
        preconditions:
          - "AmendmentRequest.status == HEARING_SCHEDULED"
          - "clock_now >= hearing_end_at"
          - "X-User-ID != initial_decided_by_user_id (segregation of duties)"
        side_effects:
          - "status := UPHELD; hearing_decided_by_user_id := X-User-ID"
      - from: UPHELD
        to: STATEMENT_FILED
        trigger: "POST /records-office/amendment-requests/{id}/statements"
        actor: Parent
        preconditions:
          - "AmendmentRequest.status == UPHELD"
        side_effects:
          - "statement_text stored; statement_filed_at := clock_now; status := STATEMENT_FILED"
          - "the contested FileComponent.statement_of_disagreement_present := true and its page_count += STATEMENT_PAGE_COUNT (1)"
          - "parent CumulativeFile total_page_count / included_page_count / disclosable_page_count recomputed; CumulativeFile.version incremented by 1"

  - entity: LegalDemand
    initial_state: RECEIVED
    terminal_states: [PRODUCED]
    transitions:
      - from: RECEIVED
        to: NOTIFIED
        trigger: "POST /records-office/legal-demands/{id}/notifications"
        actor: LegalAffairsOfficer
        preconditions:
          - "LegalDemand.status == RECEIVED"
          - "LegalDemand.notification_waived == false"
        side_effects:
          - "notified_party recorded; notification_sent_at := clock_now"
          - "production_allowed_at := notification_sent_at + StateRecordsRule[student.district.state_code].notification_wait_days calendar days"
          - "status := NOTIFIED"
      - from: NOTIFIED
        to: PRODUCED
        trigger: "POST /records-office/legal-demands/{id}/production"
        actor: LegalAffairsOfficer
        preconditions:
          - "LegalDemand.status == NOTIFIED"
          - "clock_now >= production_allowed_at (inclusive)"
        side_effects:
          - "status := PRODUCED; produced_at := clock_now; produced_page_count stored (cascade link 1)"
          - "because the demand was produced, a DisclosureLogEntry is appended with disclosure_type LEGAL_DEMAND, source_type LEGAL_DEMAND, source_id := LegalDemand.id (cascade link 2)"
          - "because a new DisclosureLogEntry exists, the student's RetentionSchedule.last_activity_at := that entry's disclosed_at and destruction_eligible_at is recomputed (cascade link 3)"
          - "because destruction_eligible_at changed, Student.records_disposition_date is re-mirrored (cascade link 4)"
      - from: RECEIVED
        to: PRODUCED
        trigger: "POST /records-office/legal-demands/{id}/production (notification waived branch)"
        actor: LegalAffairsOfficer
        preconditions:
          - "LegalDemand.status == RECEIVED"
          - "LegalDemand.notification_waived == true AND waiver_basis IS NOT NULL"
        side_effects:
          - "status := PRODUCED; produced_at := clock_now; produced_page_count stored"
          - "a DisclosureLogEntry is appended and the RetentionSchedule / Student.records_disposition_date cascade fires exactly as on the NOTIFIED branch"
        note: >
          Branching fork: the RECEIVED state forks into the notified path (which imposes the
          waiting-period gate) and the waived path (which produces immediately but requires a
          waiver_basis). The two branches write different side-effect sets — the waived branch
          never sets notification_sent_at or production_allowed_at.

  - entity: RetentionSchedule
    initial_state: ACTIVE
    terminal_states: [DESTROYED]
    transitions:
      - from: ACTIVE
        to: DESTRUCTION_ELIGIBLE
        trigger: "POST /records-office/compliance-sweeps"
        actor: ComplianceOfficer
        preconditions:
          - "RetentionSchedule.status == ACTIVE"
          - "clock_now >= destruction_eligible_at (inclusive)"
          - "no LegalDemand for the student with status IN {RECEIVED, NOTIFIED}"
        side_effects:
          - "status := DESTRUCTION_ELIGIBLE"
      - from: DESTRUCTION_ELIGIBLE
        to: DESTROYED
        trigger: "POST /records-office/retention-schedules/{id}/destruction"
        actor: ComplianceOfficer
        preconditions:
          - "RetentionSchedule.status == DESTRUCTION_ELIGIBLE"
          - "no LegalDemand for the student with status IN {RECEIVED, NOTIFIED} (litigation hold, cross-entity dependency)"
          - "no RecordsRequest for the student with status IN {RECEIVED, VALIDATED, ASSEMBLING, READY_FOR_RELEASE}"
        side_effects:
          - "status := DESTROYED; destroyed_at := clock_now; destruction_method and certification_note stored"
          - "every FileComponent of the file has page_count := 0 and redacted_page_count := 0, so CumulativeFile.total_page_count becomes 0"
          - "a DisclosureLogEntry is NOT appended — destruction is not a disclosure"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: packet-snapshot-stale-cumulative-file
    parent_entity: CumulativeFile
    write_endpoint: "POST /records-office/records-requests/{id}/mark-ready"
    occ_field: "expected_cumulative_file_version"
    description: |
      Marking a RecordsRequest ready snapshots the packet (page count, discipline inclusion set)
      out of the student's CumulativeFile. A mark-ready whose expected_cumulative_file_version is
      behind the file's current version is rejected: the client's view of the file predates a
      component or statement mutation, so the snapshot it is asking for is not the snapshot it
      would get. A second mark-ready is legitimate product behaviour — it re-snapshots and
      supersedes the previous packet — so the stale-version check, not a state precondition, is
      what distinguishes the two.
    error_id: ERR_STALE_CUMULATIVE_FILE_VERSION
    http_status: 412

  - rule_id: appointment-create-stale-inspection-request
    parent_entity: InspectionRequest
    write_endpoint: "POST /records-office/inspection-requests/{id}/appointments"
    occ_field: "expected_inspection_request_version"
    description: |
      Creating a ReviewAppointment supersedes any existing SCHEDULED appointment on the same
      InspectionRequest, which is legitimate rescheduling behaviour. A create whose
      expected_inspection_request_version is behind the request's current version is rejected,
      because the client is rescheduling against a view of the request that predates the
      appointment it is about to displace.
    error_id: ERR_STALE_INSPECTION_REQUEST_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: records_request_due_at
    trigger: "RecordsRequest creation (POST /records-office/records-requests) and again on the RECEIVED -> VALIDATED transition, after which the value is frozen"
    algorithm: business_day_offset
    formula: |
      rule = StateRecordsRule[ District(responding_district_id).state_code ]

      # Step 1 — pick the effective day budget (>= 3 inputs, nested min, branch on request state)
      if request.request_priority == "UNACCOMPANIED_YOUTH":
          effective_days = min(rule.transfer_response_days, EXPEDITED_CAP_DAYS)   # never extended
      else:
          effective_days = rule.transfer_response_days
          if request.includes_special_education == true and rule.sped_requires_consent == true:
              effective_days = effective_days + SPED_CONSENT_EXTENSION_DAYS

      # Step 2 — advance business days from the window start instant
      #   anchor = received_at on creation; anchor = received_at (NOT the validation instant) on
      #   the VALIDATED recompute, so validating late never buys the district extra days.
      cursor = anchor
      counted = 0
      while counted < effective_days:
          cursor = cursor + 1 calendar day
          if weekday(cursor) in {MON, TUE, WED, THU, FRI}:
              counted = counted + 1
      # the anchor's own calendar day is NEVER counted, even when it is a business day.
      # No holiday calendar exists: Saturday and Sunday are the only skipped weekdays.

      statutory_days_allowed = effective_days
      statutory_due_at       = date(cursor) at 23:59:59.999Z
    input_set: >
      Exactly one StateRecordsRule row (the responding district's state), plus the request's own
      request_priority / includes_special_education fields and its received_at instant. The
      requesting district's state rule is NOT consulted for the window.
    constants:
      EXPEDITED_CAP_DAYS: 5
      SPED_CONSENT_EXTENSION_DAYS: 10
    precision: "whole business days; statutory_due_at always ends at 23:59:59.999Z on the resolved UTC calendar date"
    variants:
      - name: STANDARD_WINDOW
        when: "request_priority == STANDARD"
        difference: "Uses the full state window and may be extended by SPED_CONSENT_EXTENSION_DAYS."
      - name: EXPEDITED_WINDOW
        when: "request_priority == UNACCOMPANIED_YOUTH"
        difference: >
          Caps the window at min(state window, 5) and suppresses the special-education extension
          entirely, so an unaccompanied-youth request against a 10-day state with
          includes_special_education == true gets 5 days, not 20.

  - name: discipline_inclusion_set
    trigger: "the ASSEMBLING -> READY_FOR_RELEASE transition (POST /records-office/records-requests/{id}/mark-ready)"
    algorithm: rule_filter
    formula: |
      def included(rule, inc):
          if inc.incident_status == "DISMISSED":
              return False
          if inc.incident_status == "PENDING_INVESTIGATION" and rule.include_pending_investigations == false:
              return False
          if rule.discipline_inclusion_mode == "ALL_INCIDENTS":
              return True
          if rule.discipline_inclusion_mode == "SUSPENSIONS_AND_EXPULSIONS":
              if inc.action_type == "EXPULSION":
                  return True
              if inc.action_type == "SUSPENSION":
                  return inc.days_removed >= rule.discipline_min_days_removed    # inclusive
              return False
          if rule.discipline_inclusion_mode == "EXPULSIONS_ONLY":
              return inc.action_type == "EXPULSION" and inc.adjudicated_by_court == true

      incidents = DisciplineIncident rows with student_id == request.student_id,
                  processed in ascending (incident_date, created_at) order

      # GOVERNING PASS — responding district's state
      gov_rule = StateRecordsRule[ District(request.responding_district_id).state_code ]
      included_incident_count = count(inc for inc in incidents if included(gov_rule, inc))
      withheld_incident_count = len(incidents) - included_incident_count
      for inc in incidents:
          inc.transfer_inclusion_state = "INCLUDED" if included(gov_rule, inc) else "WITHHELD"

      # ADVISORY PASS — requesting district's state, recorded but never used to filter pages
      rcv_rule = StateRecordsRule[ District(request.requesting_district_id).state_code ]
      receiving_state_inclusion_count = count(inc for inc in incidents if included(rcv_rule, inc))
    input_set: >
      Every DisciplineIncident of the student regardless of incident_date — there is no lookback
      window. Both passes read the identical incident set; only the StateRecordsRule row differs.
    constants: {}
    precision: "integer counts"
    variants:
      - name: RESPONDING_STATE
        when: "always — this is the governing pass"
        difference: >
          Applies the SENDING district's state rule and is the only pass that writes
          DisciplineIncident.transfer_inclusion_state, RecordsRequest.included_incident_count and
          RecordsRequest.withheld_incident_count.
      - name: REQUESTING_STATE
        when: "always — recorded alongside the governing pass"
        difference: >
          Applies the RECEIVING district's state rule to the same incident set and writes only
          RecordsRequest.receiving_state_inclusion_count. For identical incidents the two passes
          disagree whenever the two districts sit in states with different
          discipline_inclusion_mode / include_pending_investigations values, which is exactly the
          gap the receiving registrar must be told about.

  - name: retention_destruction_eligible_at
    trigger: >
      RetentionSchedule creation (the CumulativeFile NOT_STARTED -> IN_ASSEMBLY bubble driven by
      withdrawal completion) and again after every DisclosureLogEntry append or FileComponent
      certification for the student
    algorithm: anchor_offset
    formula: |
      def plus_whole_years(instant, years):
          target = instant with year := instant.year + years
          if that calendar date does not exist (Feb 29 -> non-leap year):
              target = same year/month with day := 28
          return target                                   # time-of-day preserved exactly

      exit_anchor_at  = Student.exit_effective_date at 00:00:00.000Z
      last_activity_at = max(
            exit_anchor_at,
            max(DisclosureLogEntry.disclosed_at for entries with this student_id)   # omit if none
            max(FileComponent.certified_at for components of this file where certified_at IS NOT NULL)  # omit if none
      )
      years = RetentionSchedule.destruction_min_age_years      # copied from the state rule at creation

      destruction_eligible_at   = plus_whole_years(last_activity_at, years)   # GOVERNING
      exit_anchored_eligible_at = plus_whole_years(exit_anchor_at,  years)    # ADVISORY
    input_set: >
      The student's own DisclosureLogEntry rows (all disclosure_type values, including
      DIRECTORY_INFORMATION) and the file's CERTIFIED-at timestamps. Components whose certified_at
      was cleared by exclusion or amendment drop out of the max immediately.
    constants:
      MAX_ANCHOR_TIE_BREAK: "when two candidate anchors are the identical instant the value is the same, so no tie-break is needed"
    precision: "millisecond-exact ISO 8601 UTC; the time-of-day of the winning anchor is preserved"
    variants:
      - name: LAST_ACTIVITY_ANCHORED
        when: "always — this is the governing value stored in destruction_eligible_at"
        difference: >
          Every later disclosure or certification pushes the destruction date forward, so an
          actively disclosed record is never destroyed on schedule.
      - name: EXIT_ANCHORED
        when: "always — recorded alongside in exit_anchored_eligible_at"
        difference: >
          Freezes the clock at the student's exit date and ignores subsequent activity, so it is
          always <= destruction_eligible_at and diverges the moment any disclosure is logged after
          the exit date.

  - name: inspection_copy_fee_cents
    trigger: "InspectionRequest creation with copies_requested == true (POST /records-office/students/{id}/inspection-requests)"
    algorithm: tiered_pricing
    formula: |
      # ROUNDING ORDER IS PINNED: round per component, THEN sum. Summing raw page charges and
      # rounding once at the end produces a different cent total and is WRONG.
      base_copy_fee_cents = 0
      for c in components of the student's CumulativeFile
              where c.status IN {COLLECTED, CERTIFIED}
                and c.component_type IN request.requested_categories
              processed in the fixed order [ACADEMIC, HEALTH, DISCIPLINE, SPECIAL_EDUCATION]:
          pages_c       = c.page_count - c.redacted_page_count
          base_c        = round_half_up(pages_c * PER_PAGE_CENTS)          # integer cents
          surcharged_c  = round_half_up(base_c * (1 + COPY_SURCHARGE_PCT)) # integer cents
          base_copy_fee_cents += surcharged_c

      if request.copies_requested == false:
          base_copy_fee_cents = 0
    input_set: >
      Only components with status IN {COLLECTED, CERTIFIED} whose component_type appears in
      requested_categories. PENDING components (page_count 0) and EXCLUDED components never
      contribute. The set is frozen at creation; later page changes do not re-price the request.
    constants:
      PER_PAGE_CENTS: 7.5
      COPY_SURCHARGE_PCT: 0.0825
    precision: "integer cents; round_half_up applied twice per component, never once over the sum"
    variants: []

  - name: inspection_fee_assessment
    trigger: "InspectionRequest creation, immediately after inspection_copy_fee_cents"
    algorithm: threshold
    formula: |
      # Circular-looking dependency, resolved by a PINNED evaluation order:
      #   fee_assessed_cents depends on certification_fee_cents, and the certification tier is a
      #   function of a copy-fee magnitude. The tier is keyed on base_copy_fee_cents ONLY and is
      #   NEVER re-evaluated against fee_assessed_cents, even when adding the certification fee
      #   pushes the total across a tier boundary.
      #
      # Step 1: base_copy_fee_cents  (calculations.inspection_copy_fee_cents)
      # Step 2: tier(base_copy_fee_cents):
      #           base <  CERT_TIER_B_FLOOR_CENTS                       -> 0
      #           CERT_TIER_B_FLOOR_CENTS <= base < CERT_TIER_C_FLOOR_CENTS -> CERT_TIER_B_FEE_CENTS
      #           base >= CERT_TIER_C_FLOOR_CENTS                       -> CERT_TIER_C_FEE_CENTS
      # Step 3: certification_fee_cents = tier(base_copy_fee_cents)
      # Step 4: fee_assessed_cents      = base_copy_fee_cents + certification_fee_cents
      # Step 5: fee_collected_cents = 0, fee_waived_cents = 0,
      #         fee_outstanding_cents = fee_assessed_cents
      #
      # Fee-custody identity, true after every fee transaction:
      #   fee_assessed_cents == fee_collected_cents + fee_waived_cents + fee_outstanding_cents
      #   and fee_assessed_cents itself is immutable after creation.
    input_set: "the single base_copy_fee_cents value produced in the same request; no entity scan"
    constants:
      CERT_TIER_B_FLOOR_CENTS: 2000
      CERT_TIER_C_FLOOR_CENTS: 10000
      CERT_TIER_B_FEE_CENTS: 500
      CERT_TIER_C_FEE_CENTS: 1500
    precision: "integer cents; tier floors are inclusive (>=)"
    variants: []

  - name: disclosure_packet_page_count
    trigger: "the ASSEMBLING -> READY_FOR_RELEASE transition (POST /records-office/records-requests/{id}/mark-ready)"
    algorithm: constraint_propagation
    formula: |
      raw_pages = sum(c.page_count - c.redacted_page_count
                      for c in components of the student's CumulativeFile
                      where c.status == CERTIFIED)

      discipline_pages = sum(c.page_count - c.redacted_page_count
                             for c in the same set where c.component_type == "DISCIPLINE")

      # SINGLE-PASS EVALUATION IS PINNED: the substitution test is evaluated exactly once against
      # raw_pages. After substitution the resulting packet_page_count is NEVER re-tested, even when
      # it falls back below SUMMARY_SUBSTITUTION_THRESHOLD_PAGES.
      if raw_pages > SUMMARY_SUBSTITUTION_THRESHOLD_PAGES:          # strict greater-than
          packet_page_count = raw_pages - discipline_pages + SUMMARY_PAGE_COUNT
      else:
          packet_page_count = raw_pages
    input_set: >
      Only CERTIFIED components. COLLECTED, PENDING and EXCLUDED components contribute nothing —
      which is why excluding a certified component both reopens the request and changes the page
      count of the next snapshot.
    constants:
      SUMMARY_SUBSTITUTION_THRESHOLD_PAGES: 500
      SUMMARY_PAGE_COUNT: 3
    precision: "integer pages"
    variants: []

  - name: cumulative_file_completeness
    trigger: "every FileComponent status change, and the AmendmentRequest STATEMENT_FILED transition"
    algorithm: aggregation
    formula: |
      required = CumulativeFile.required_component_types
                 # [ACADEMIC, HEALTH, DISCIPLINE] + [SPECIAL_EDUCATION] iff Student.has_iep
      certified_component_count = count(c for c in components
                                        if c.component_type in required and c.status == "CERTIFIED")
      completeness_pct = round_half_up(100 * certified_component_count / len(required), 1)

      assembly_status = "NOT_STARTED" if every component status == "PENDING"
                                         and Student.enrollment_status == "ENROLLED"
                        else "COMPLETE" if certified_component_count == len(required)
                        else "IN_ASSEMBLY"

      # Page-custody identity, true after every component mutation:
      #   total_page_count == included_page_count + excluded_page_count
      # where included_page_count sums page_count over status IN {COLLECTED, CERTIFIED},
      # excluded_page_count sums page_count over status == EXCLUDED, and PENDING components
      # always hold page_count 0. total_page_count is the conserved quantity: excluding a
      # component and reinstating it must leave it bit-identical.
      total_page_count      = sum(c.page_count for all components)
      included_page_count   = sum(c.page_count for c where c.status IN {COLLECTED, CERTIFIED})
      excluded_page_count   = sum(c.page_count for c where c.status == "EXCLUDED")
      disclosable_page_count= sum(c.page_count - c.redacted_page_count
                                  for c where c.status IN {COLLECTED, CERTIFIED})
    input_set: "all FileComponent rows of the file; EXCLUDED components count toward neither certified_component_count nor completeness_pct"
    constants:
      REQUIRED_BASE_TYPES: "[ACADEMIC, HEALTH, DISCIPLINE]"
    precision: "completeness_pct to one decimal place, round_half_up (3 of 4 required -> 75.0; 1 of 3 -> 33.3; 2 of 3 -> 66.7)"
    variants: []

  - name: eligible_student_status
    trigger: "every read or mutation of a Student, and every authorization check on an endpoint whose roles include Parent or EligibleStudent"
    algorithm: threshold
    formula: |
      years = clock_now.year - dob.year
      if (clock_now.month, clock_now.day) < (dob.month, dob.day):
          years = years - 1                                  # birthday not yet reached this year
      is_eligible_student = years >= ELIGIBLE_STUDENT_AGE_YEARS   # inclusive on the birthday itself

      # Rights transfer is total, not shared: while is_eligible_student == true the Parent role is
      # refused with ERR_RIGHTS_TRANSFERRED on every inspection / amendment / opt-out endpoint, and
      # while it is false the EligibleStudent role is refused with ERR_RIGHTS_NOT_TRANSFERRED.
    input_set: "the student's dob and the logical clock; no other entity participates"
    constants:
      ELIGIBLE_STUDENT_AGE_YEARS: 18
    precision: >
      whole years, evaluated on the UTC calendar date of the logical clock. A student born
      2008-08-01 is eligible from the instant 2026-08-01T00:00:00.000Z and NOT eligible at
      2026-07-31T23:59:59.999Z.
    variants: []

# =============================================================================
# §1.4 Validation Rules Table
# =============================================================================
# Priority ordering is TOTAL and MANDATORY: when a single request violates several rules the
# implementation MUST return the error of the lowest-numbered priority. Priority bands:
#   10  path_existence      404 — every {id} in the path resolves
#   20  authorization       403 — role, rights transfer, guardianship, segregation of duties
#   30  payload_schema      400 — required fields, types, enum membership, numeric ranges
#   40  optimistic_lock     412 — expected_<parent>_version matches the parent's current version
#   50  entity_state        409 — the entity is in a state that permits the transition
#   60  cross_entity_state  409 — a DIFFERENT entity is in the required state
#   70  temporal_conflict   409 — interval overlap / capacity over a time window
#   80  business_rule       422 — statutory windows, consent, custody, conservation
#   90  uniqueness          409 — natural-key and one-active-per-scope collisions
# Band 90 is deliberately LAST: a duplicate is only reported once the payload is otherwise sound.
validations:
  # ---- band 10: path existence -------------------------------------------------------------
  - priority: 10
    name: path_entities_exist
    category: path_existence
    condition: >
      Every {…_id} path parameter (and {state_code}) resolves to a stored row. Checked left to
      right, so a bad parent id is reported before a bad child id.
    error_id: "ERR_<ENTITY>_NOT_FOUND (ERR_DISTRICT_NOT_FOUND, ERR_STATE_RULE_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_WITHDRAWAL_NOT_FOUND, ERR_CUMULATIVE_FILE_NOT_FOUND, ERR_FILE_COMPONENT_NOT_FOUND, ERR_DISCIPLINE_INCIDENT_NOT_FOUND, ERR_RECORDS_REQUEST_NOT_FOUND, ERR_INSPECTION_ROOM_NOT_FOUND, ERR_INSPECTION_REQUEST_NOT_FOUND, ERR_REVIEW_APPOINTMENT_NOT_FOUND, ERR_HEARING_OFFICER_NOT_FOUND, ERR_AMENDMENT_REQUEST_NOT_FOUND, ERR_LEGAL_DEMAND_NOT_FOUND, ERR_RETENTION_SCHEDULE_NOT_FOUND)"
    http_status: 404
    applies_to: every endpoint carrying a path parameter
  - priority: 11
    name: body_reference_entities_exist
    category: path_existence
    condition: >
      Every FK supplied in a request BODY resolves: RecordsRequest.student_id /
      requesting_district_id / responding_district_id, AmendmentRequest.contested_component_id,
      ReviewAppointment.room_id, AmendmentRequest hearing_officer_id.
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: POST /records-requests, POST /students/{id}/amendment-requests, POST /inspection-requests/{id}/appointments, POST /amendment-requests/{id}/hearing-schedules

  # ---- band 20: authorization --------------------------------------------------------------
  - priority: 20
    name: role_permitted_for_endpoint
    category: authorization
    condition: "X-User-Role is present and appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: every endpoint
  - priority: 21
    name: rights_have_transferred_to_student
    category: authorization
    condition: >
      X-User-Role == "Parent" while the target Student has is_eligible_student == true. The transfer of
      rights is total — a parent of an 18-year-old has NO inspection, amendment or opt-out rights
      even though the parent is still the recorded guardian.
    error_id: ERR_RIGHTS_TRANSFERRED
    http_status: 403
    applies_to: POST /students/{id}/inspection-requests, POST /students/{id}/amendment-requests, PATCH /students/{id}/directory-optout, POST /amendment-requests/{id}/statements, POST /amendment-requests/{id}/hearing-requests
  - priority: 22
    name: rights_not_yet_transferred_to_student
    category: authorization
    condition: 'X-User-Role == "EligibleStudent" while the target Student has is_eligible_student == false.'
    error_id: ERR_RIGHTS_NOT_TRANSFERRED
    http_status: 403
    applies_to: the same endpoint set as rights_have_transferred_to_student
  - priority: 23
    name: requester_is_the_recorded_party
    category: authorization
    condition: >
      X-User-ID equals Student.guardian_user_id when X-User-Role == "Parent", or
      Student.student_user_id when X-User-Role == "EligibleStudent". Another family's guardian is
      refused even though the role itself is permitted.
    error_id: ERR_NOT_STUDENT_GUARDIAN
    http_status: 403
    applies_to: the same endpoint set as rights_have_transferred_to_student
  - priority: 24
    name: segregation_of_amendment_duties
    category: authorization
    condition: >
      On the post-hearing POST /amendment-requests/{id}/decisions call (status HEARING_SCHEDULED),
      X-User-ID MUST NOT equal
      AmendmentRequest.initial_decided_by_user_id. The official who denied the amendment may not
      decide its hearing.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: POST /amendment-requests/{id}/decisions (hearing decision, status HEARING_SCHEDULED)
  - priority: 25
    name: receiving_registrar_owns_requesting_district
    category: authorization
    condition: >
      When X-User-Role == "ReceivingRegistrar" (identity entity_backed:District), the body's
      requesting_district_id MUST equal X-User-ID: a registrar may only file requests in the name
      of their own district. A RecordsOfficer taking a mailed request in over the counter is
      exempt from this check.
    error_id: ERR_DISTRICT_MISMATCH
    http_status: 403
    applies_to: POST /records-requests

  # ---- band 30: payload schema ------------------------------------------------------------
  - priority: 30
    name: required_fields_present
    category: payload_schema
    condition: "Every non-optional field in the endpoint's input list is present and non-null."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: every POST / PATCH endpoint
  - priority: 31
    name: enum_membership
    category: payload_schema
    condition: >
      Every enum-typed input is a member of its declared set (state_code, component_type,
      action_type, incident_status, request_priority, exclusion_reason, demand_type, waiver_basis,
      transmission_method, destruction_method, requester_role, notified_party, denial_reason,
      hold_type, fee_transaction_type, retention_anchor_mode).
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: every endpoint accepting an enum
  - priority: 32
    name: numeric_and_temporal_ranges
    category: payload_schema
    condition: >
      page_count >= 0; redacted_page_count >= 0 and <= page_count; days_removed >= 0 and <= 365;
      seats >= 1; copies_requested is boolean; amount_cents >= 1; every ISO 8601 instant parses as
      UTC; end_at > start_at on both ReviewAppointment and hearing windows (equality rejected);
      duration is a whole number of minutes.
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: PATCH /cumulative-files/{id}/components/{component_id}, POST /inspection-requests/{id}/appointments, POST /amendment-requests/{id}/hearing-schedules, POST /inspection-rooms, POST /students/{id}/discipline-incidents, POST /inspection-requests/{id}/fee-payments
  - priority: 33
    name: waiver_basis_required_when_notification_waived
    category: payload_schema
    condition: >
      On POST /students/{id}/legal-demands, notification_waived == true requires a
      waiver_basis, and notification_waived == false requires waiver_basis to be absent/null.
      Additionally waiver_basis GRAND_JURY_ORDER is only accepted with demand_type
      GRAND_JURY_SUBPOENA, and EX_PARTE_COURT_ORDER only with EX_PARTE_ORDER.
    error_id: ERR_WAIVER_BASIS_REQUIRED
    http_status: 400
    applies_to: POST /students/{id}/legal-demands

  # ---- band 40: optimistic locking --------------------------------------------------------
  - priority: 40
    name: cumulative_file_version_current
    category: optimistic_lock
    condition: >
      On mark-ready, expected_cumulative_file_version equals the student's CumulativeFile.version.
      Any component collection, certification, exclusion or reinstatement since the caller read
      the file bumps that version and invalidates the snapshot.
    error_id: ERR_STALE_CUMULATIVE_FILE_VERSION
    http_status: 412
    applies_to: POST /records-requests/{id}/mark-ready
  - priority: 41
    name: inspection_request_version_current
    category: optimistic_lock
    condition: >
      On appointment creation, expected_inspection_request_version equals
      InspectionRequest.version. A superseding appointment must be booked against the version the
      caller actually saw.
    error_id: ERR_STALE_INSPECTION_REQUEST_VERSION
    http_status: 412
    applies_to: POST /inspection-requests/{id}/appointments

  # ---- band 50: entity state -------------------------------------------------------------
  - priority: 50
    name: student_enrolled_for_withdrawal
    category: entity_state
    condition: >
      Student.enrollment_status IN {ENROLLED, WITHDRAWAL_PENDING} when opening a Withdrawal: a
      WITHDRAWN or TRANSFERRED_OUT student can never open another one. A WITHDRAWAL_PENDING
      student passes this check and is caught instead by the sharper uniqueness rule at
      priority 92, which names the open Withdrawal row that is blocking.
    error_id: ERR_STUDENT_NOT_ENROLLED
    http_status: 409
    applies_to: POST /students/{id}/withdrawals
  - priority: 51
    name: withdrawal_not_already_completed
    category: entity_state
    condition: "Withdrawal.status != COMPLETED when adding a hold, releasing a hold, or completing."
    error_id: ERR_WITHDRAWAL_ALREADY_COMPLETED
    http_status: 409
    applies_to: POST /withdrawals/{id}/holds, POST /withdrawals/{id}/hold-releases, POST /withdrawals/{id}/complete
  - priority: 52
    name: component_state_permits_action
    category: entity_state
    condition: >
      collection requires status == PENDING or COLLECTED; certification requires status ==
      COLLECTED (ERR_COMPONENT_NOT_COLLECTED) and rejects an already-CERTIFIED component
      (ERR_COMPONENT_ALREADY_CERTIFIED); exclusion requires status IN {COLLECTED, CERTIFIED};
      reinstatement requires status == EXCLUDED (ERR_COMPONENT_NOT_EXCLUDED). A COLLECTED target
      against a CERTIFIED component is neither a collection nor a valid reinstatement and returns
      ERR_COMPONENT_NOT_EXCLUDED.
    error_id: "ERR_COMPONENT_NOT_COLLECTED / ERR_COMPONENT_ALREADY_CERTIFIED / ERR_COMPONENT_NOT_EXCLUDED"
    http_status: 409
    applies_to: PATCH /cumulative-files/{id}/components/{component_id} (every status target)
  - priority: 53
    name: records_request_state_permits_action
    category: entity_state
    condition: >
      validate requires RECEIVED (ERR_REQUEST_NOT_RECEIVED); mark-ready requires ASSEMBLING
      (ERR_REQUEST_NOT_ASSEMBLING) — a request still sitting in VALIDATED because the student's
      CumulativeFile has not started assembling also returns ERR_REQUEST_NOT_ASSEMBLING; release
      requires READY_FOR_RELEASE (ERR_REQUEST_NOT_READY); deny requires status IN {RECEIVED,
      VALIDATED, ASSEMBLING}. RELEASED and DENIED are terminal — every action against them returns
      ERR_REQUEST_TERMINAL.
    error_id: "ERR_REQUEST_NOT_RECEIVED / ERR_REQUEST_NOT_ASSEMBLING / ERR_REQUEST_NOT_READY / ERR_REQUEST_TERMINAL"
    http_status: 409
    applies_to: every POST under /records-requests/{id}/
  - priority: 54
    name: inspection_request_state_permits_action
    category: entity_state
    condition: >
      appointment creation requires status IN {SUBMITTED, SCHEDULED} and rejects COMPLETED
      (ERR_INSPECTION_ALREADY_COMPLETED) and EXPIRED (ERR_INSPECTION_EXPIRED); attendance requires
      the appointment's status == SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED); a SUPERSEDED or
      EXPIRED appointment can never be attended.
    error_id: "ERR_INSPECTION_ALREADY_COMPLETED / ERR_INSPECTION_EXPIRED / ERR_APPOINTMENT_NOT_SCHEDULED"
    http_status: 409
    applies_to: POST /inspection-requests/{id}/appointments, POST /review-appointments/{id}/attendance
  - priority: 55
    name: amendment_state_permits_action
    category: entity_state
    condition: >
      decisions with outcome GRANT|DENY require SUBMITTED for the initial decision (ERR_AMENDMENT_NOT_SUBMITTED); hearing-requests requires DENIED
      (ERR_AMENDMENT_NOT_DENIED); hearing-schedules requires status IN {HEARING_REQUESTED,
      HEARING_SCHEDULED} — the second call is a reschedule, not an error; a hearing decision requires
      HEARING_SCHEDULED (ERR_HEARING_NOT_SCHEDULED); statements requires UPHELD and rejects a second
      filing (ERR_STATEMENT_ALREADY_FILED). AMENDED and STATEMENT_FILED are terminal: a second
      statements call on a STATEMENT_FILED request returns the sharper ERR_STATEMENT_ALREADY_FILED,
      while every other action on a terminal request returns ERR_AMENDMENT_TERMINAL.
    error_id: "ERR_AMENDMENT_NOT_SUBMITTED / ERR_AMENDMENT_NOT_DENIED / ERR_HEARING_NOT_SCHEDULED / ERR_AMENDMENT_TERMINAL / ERR_STATEMENT_ALREADY_FILED"
    http_status: 409
    applies_to: every POST under /amendment-requests/{id}/
  - priority: 56
    name: legal_demand_state_permits_action
    category: entity_state
    condition: >
      notification requires status == RECEIVED and notification_waived == false
      (ERR_NOTIFICATION_WAIVED); production requires status IN {RECEIVED, NOTIFIED} and rejects an
      already-produced demand (ERR_DEMAND_ALREADY_PRODUCED).
    error_id: "ERR_DEMAND_NOT_RECEIVED / ERR_NOTIFICATION_WAIVED / ERR_DEMAND_ALREADY_PRODUCED"
    http_status: 409
    applies_to: POST /legal-demands/{id}/notifications, POST /legal-demands/{id}/production
  - priority: 57
    name: retention_state_permits_destruction
    category: entity_state
    condition: "RetentionSchedule.status == DESTRUCTION_ELIGIBLE; a DESTROYED schedule is terminal."
    error_id: "ERR_RETENTION_NOT_ELIGIBLE / ERR_ALREADY_DESTROYED"
    http_status: 409
    applies_to: POST /retention-schedules/{id}/destruction
  - priority: 58
    name: room_and_officer_active
    category: entity_state
    condition: "InspectionRoom.status == ACTIVE; HearingOfficer.status == ACTIVE."
    error_id: "ERR_ROOM_CLOSED / ERR_OFFICER_INACTIVE"
    http_status: 409
    applies_to: POST /inspection-requests/{id}/appointments, POST /amendment-requests/{id}/hearing-schedules

  # ---- band 60: cross-entity state -------------------------------------------------------
  - priority: 60
    name: withdrawal_cleared_before_completion
    category: cross_entity_state
    condition: >
      Completing a Withdrawal requires Withdrawal.status == CLEARED and hold_count == 0, and the
      Student must still be WITHDRAWAL_PENDING. A single outstanding hold blocks the student's exit
      even though the Withdrawal row itself is otherwise ready.
    error_id: ERR_WITHDRAWAL_NOT_CLEARED
    http_status: 409
    applies_to: POST /withdrawals/{id}/complete
  - priority: 61
    name: cumulative_file_complete_before_snapshot
    category: cross_entity_state
    condition: >
      mark-ready requires the student's CumulativeFile.assembly_status == COMPLETE — i.e. every
      required component CERTIFIED. Excluding a certified required component flips the file back to
      IN_ASSEMBLY and re-blocks the request.
    error_id: ERR_FILE_NOT_COMPLETE
    http_status: 409
    applies_to: POST /records-requests/{id}/mark-ready
  - priority: 62
    name: release_blocked_by_ex_parte_order
    category: cross_entity_state
    condition: >
      Releasing a RecordsRequest is refused while the student has any LegalDemand with
      demand_type == EX_PARTE_ORDER whose status IN {RECEIVED, NOTIFIED}: an unexecuted ex parte
      order freezes the file against outbound transfer. Producing that demand clears the block.
    error_id: ERR_EX_PARTE_HOLD_ACTIVE
    http_status: 409
    applies_to: POST /records-requests/{id}/release
  - priority: 63
    name: destruction_blocked_by_open_obligations
    category: cross_entity_state
    condition: >
      Destruction is refused while the student has any RecordsRequest with status IN {RECEIVED,
      VALIDATED, ASSEMBLING, READY_FOR_RELEASE} or any LegalDemand with status IN {RECEIVED,
      NOTIFIED} (litigation hold). Eligibility by date is necessary but never sufficient.
    error_id: ERR_DESTRUCTION_HOLD_ACTIVE
    http_status: 409
    applies_to: POST /retention-schedules/{id}/destruction
  - priority: 64
    name: court_sealed_component_never_released
    category: cross_entity_state
    condition: >
      Releasing a RecordsRequest is refused when any component of the file has status == EXCLUDED
      with exclusion_reason == SEALED_BY_COURT and the request's denial_reason was not set to
      COURT_SEALED; sealed material may not leave the district under a transfer request.
    error_id: ERR_COURT_SEALED_COMPONENT
    http_status: 409
    applies_to: POST /records-requests/{id}/release

  # ---- band 70: temporal conflict --------------------------------------------------------
  - priority: 70
    name: inspection_room_interval_free
    category: temporal_conflict
    condition: >
      A new ReviewAppointment must not overlap any SCHEDULED or ATTENDED appointment in the same
      room once both intervals are padded by ROOM_TURNOVER_BUFFER_MINUTES = 15 on each side.
      Semantics are CLOSED and buffer-padded: new_start <= existing_end + 15min AND
      new_end >= existing_start - 15min is a conflict, so touching the padded edge collides.
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: POST /inspection-requests/{id}/appointments
  - priority: 71
    name: hearing_officer_interval_free
    category: temporal_conflict
    condition: >
      A hearing window must not overlap another HEARING_SCHEDULED window for the same
      HearingOfficer. Semantics are HALF-OPEN [start_at, end_at) with NO buffer, so a hearing
      starting exactly when another ends is accepted. (Deliberately different from the room rule.)
    error_id: ERR_OFFICER_DOUBLE_BOOKED
    http_status: 409
    applies_to: POST /amendment-requests/{id}/hearing-schedules
  - priority: 72
    name: hearing_officer_daily_minute_cap
    category: temporal_conflict
    condition: >
      Summed hearing_duration_minutes for one officer on one UTC calendar date, including the
      window being booked, must be <= OFFICER_DAILY_MINUTE_CAP = 240. Exactly 240 is accepted; 241
      is refused. On a reschedule the window being replaced is excluded from the sum.
    error_id: ERR_OFFICER_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: POST /amendment-requests/{id}/hearing-schedules
  - priority: 73
    name: legal_demand_notification_wait_elapsed
    category: temporal_conflict
    condition: >
      Production under a non-waived demand requires clock_now >= production_allowed_at, where
      production_allowed_at = notification_sent_at + rule.notification_wait_days calendar days.
      The boundary is inclusive: exactly at production_allowed_at the production succeeds.
    error_id: ERR_NOTIFICATION_WAIT_NOT_ELAPSED
    http_status: 409
    applies_to: POST /legal-demands/{id}/production

  # ---- band 80: business rule ------------------------------------------------------------
  - priority: 80
    name: transfer_authorization_verified
    category: business_rule
    condition: >
      RECEIVED -> VALIDATED requires authorization_reference to be present and the request body's
      authorization_verified == true. An unverified request must be DENIED with
      NO_ENROLLMENT_AUTHORIZATION rather than validated.
    error_id: ERR_AUTHORIZATION_NOT_VERIFIED
    http_status: 422
    applies_to: POST /records-requests/{id}/validate
  - priority: 81
    name: special_education_consent_on_file
    category: business_rule
    condition: >
      When includes_special_education == true and the RESPONDING district's state rule has
      sped_requires_consent == true, mark-ready requires sped_consent_on_file == true. When the
      state rule is false the consent flag is irrelevant — the same payload passes.
    error_id: ERR_SPED_CONSENT_REQUIRED
    http_status: 422
    applies_to: POST /records-requests/{id}/mark-ready
  - priority: 82
    name: directory_optout_within_grace_window
    category: business_rule
    condition: >
      A directory opt-out is only effective when submitted at or before
      directory_optout_deadline_at = Student.created_at + rule.directory_optout_grace_days calendar
      days. The boundary is INCLUSIVE at the millisecond: at exactly the deadline the opt-out takes
      effect; one millisecond later the request is refused and directory_optout_effective stays false.
    error_id: ERR_OPTOUT_WINDOW_CLOSED
    http_status: 422
    applies_to: PATCH /students/{id}/directory-optout
  - priority: 83
    name: directory_disclosure_respects_optout
    category: business_rule
    condition: >
      Logging a directory disclosure is refused when directory_optout_effective == true and every
      requested category appears in directory_optout_categories; a category NOT opted out may still
      be disclosed in the same request.
    error_id: ERR_DIRECTORY_OPTOUT_ACTIVE
    http_status: 422
    applies_to: POST /students/{id}/directory-disclosures
  - priority: 84
    name: appointment_within_statutory_inspection_window
    category: business_rule
    condition: >
      ReviewAppointment.start_at <= InspectionRequest.statutory_inspection_due_at (created_at + 45
      calendar days, inclusive) and start_at >= clock_now: an inspection cannot be booked into the
      past or beyond the statutory window.
    error_id: ERR_APPOINTMENT_OUTSIDE_STATUTORY_WINDOW
    http_status: 422
    applies_to: POST /inspection-requests/{id}/appointments
  - priority: 85
    name: hearing_within_amendment_window
    category: business_rule
    condition: >
      hearing_start_at <= hearing_due_at, where hearing_due_at = AmendmentRequest.denied_at +
      rule.amendment_hearing_days calendar days (inclusive to the millisecond) using the state rule
      of the STUDENT's district.
    error_id: ERR_HEARING_WINDOW_EXCEEDED
    http_status: 422
    applies_to: POST /amendment-requests/{id}/hearing-schedules
  - priority: 86
    name: fee_settled_before_inspection_completion
    category: business_rule
    condition: >
      Marking a ReviewAppointment ATTENDED requires the parent's InspectionRequest to have
      fee_outstanding_cents == 0 whenever copies_requested == true.
    error_id: ERR_FEE_OUTSTANDING
    http_status: 422
    applies_to: POST /review-appointments/{id}/attendance
  - priority: 87
    name: fee_custody_conserved
    category: business_rule
    condition: >
      A payment or waiver may not exceed fee_outstanding_cents. After every transaction the
      identity fee_assessed_cents == fee_collected_cents + fee_waived_cents +
      fee_outstanding_cents MUST hold, and fee_assessed_cents itself is immutable.
    error_id: ERR_FEE_OVERPAYMENT
    http_status: 422
    applies_to: POST /inspection-requests/{id}/fee-payments
  - priority: 88
    name: amendment_targets_this_students_component
    category: business_rule
    condition: >
      contested_component_id must belong to the CumulativeFile of the student in the path, and the
      component's status must not be EXCLUDED.
    error_id: ERR_COMPONENT_NOT_FOR_STUDENT
    http_status: 422
    applies_to: POST /students/{id}/amendment-requests
  - priority: 89
    name: notification_required_before_production
    category: business_rule
    condition: >
      Production of a demand with notification_waived == false requires status == NOTIFIED. A
      waived demand skips notification entirely and may be produced directly from RECEIVED.
    error_id: ERR_NOTIFICATION_REQUIRED
    http_status: 422
    applies_to: POST /legal-demands/{id}/production

  # ---- band 90: uniqueness ---------------------------------------------------------------
  - priority: 90
    name: state_rule_unique_per_state
    category: uniqueness
    condition: "At most one StateRecordsRule per state_code."
    error_id: ERR_DUPLICATE_STATE_RULE
    http_status: 409
    applies_to: POST /state-rules
  - priority: 91
    name: district_code_unique
    category: uniqueness
    condition: "District.district_code is globally unique; InspectionRoom.room_code is globally unique."
    error_id: "ERR_DUPLICATE_DISTRICT_CODE / ERR_DUPLICATE_ROOM_CODE"
    http_status: 409
    applies_to: POST /districts, POST /inspection-rooms
  - priority: 92
    name: one_open_withdrawal_per_student
    category: uniqueness
    condition: "A student may not have two Withdrawal rows whose status != COMPLETED."
    error_id: ERR_OPEN_WITHDRAWAL_EXISTS
    http_status: 409
    applies_to: POST /students/{id}/withdrawals
  - priority: 93
    name: one_open_request_per_district_pair
    category: uniqueness
    condition: >
      A student may not have two RecordsRequest rows with the same requesting_district_id whose
      status IN {RECEIVED, VALIDATED, ASSEMBLING, READY_FOR_RELEASE}. A RELEASED or DENIED request
      does not block a fresh one.
    error_id: ERR_DUPLICATE_ACTIVE_REQUEST
    http_status: 409
    applies_to: POST /records-requests

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving surface --------------------------------------------------------------
  - method: POST
    path: "/records-office/_clock/set_current_utc"
    description: >
      Sets the server's logical clock, which every deadline, window and expiry rule in this domain
      reads as clock_now. MANDATORY DEFAULT: before any call to this endpoint the logical clock
      reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time.
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "clock_now := current_utc for every subsequent request; no entity is mutated and no sweep runs"
  - method: POST
    path: "/records-office/compliance-sweeps"
    description: >
      Operator-run compliance sweep. Idempotent with respect to clock_now: running it twice at the
      same instant produces the same set of affected rows the second time being empty.
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: null
    side_effects:
      - "every RecordsRequest with status IN {RECEIVED, VALIDATED, ASSEMBLING, READY_FOR_RELEASE} and clock_now > statutory_due_at gets is_overdue := true"
      - "every InspectionRequest with status == SUBMITTED and clock_now > statutory_inspection_due_at transitions to EXPIRED"
      - "every ReviewAppointment with status == SCHEDULED and clock_now > end_at transitions to EXPIRED"
      - "every RetentionSchedule with status == ACTIVE, clock_now >= destruction_eligible_at and no LegalDemand of the student in {RECEIVED, NOTIFIED} transitions to DESTRUCTION_ELIGIBLE"

