# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3384_age_based_book_mailing_enrollment_local_affiliate
#
# Breadth probe over §1.1–§1.7 claims not exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Anchors are document-scoped to THIS file.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: affiliate_create_applies_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Affiliate
          - endpoints.POST_/library/affiliates
        distinguishing_aspect: "A new affiliate comes back 201 with enrolled_count 0, operative false (no agreement yet), version 1, and server-minted id/created_at/updated_at — the caller supplies none of them."
        test_recipe:
          setup: ["Clock at default 2026-09-01T00:00:00Z (set explicitly). One state program."]
          setup_api_calls:
            - &c_sep
              call: "POST /library/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &prog
              call: "POST /library/state-programs"
              payload: { state_code: "TN", name: "TN Imagination Partnership", funding_share_bp: 4925, max_state_share_per_book_cents: 300 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - &aff_a
              call: "POST /library/affiliates"
              payload: { name: "Nashville Books Together", state_program_id: "${prog_id}", postal_prefixes: ["372", "370"], contact_email: "coord@nbt.org" }
              as: PlatformAdmin
              captures: { aff_a_id: $.data.id, aff_a_v: $.data.version }
          assert:
            - "status 201; Affiliate.${aff_a_id}.enrolled_count == 0 and operative == false"
            - "Affiliate.${aff_a_id}.version == 1 and ${aff_a_v} == 1"
            - "id, created_at, updated_at are non-null; created_at == \"2026-09-01T00:00:00Z\" (logical clock, not wall clock)"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: child_registration_missing_birth_date_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Child.fields.birth_date
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "Omitting required birth_date fails shape validation at priority 4 with 400 ERR_INVALID_REQUEST before any temporal or coverage rule runs."
        test_recipe:
          setup: ["Clock set; program; affiliate with approved agreement."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - &agr_a
              call: "POST /library/affiliates/${aff_a_id}/agreements"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", local_fundraising_commitment_cents: 5000000, expected_affiliate_version: "${aff_a_v}" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { agr_a_id: $.data.id }
            - &agr_a_ok
              call: "POST /library/agreements/${agr_a_id}/approve"
              payload: {}
              as: StateProgramOfficer
              as_user_id: "${prog_id}"
          trigger:
            - call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "No Date", family_name: "Nodate", mailing_address: { line1: "1 Oak St", city: "Nashville", region: "TN", postal_code: "37201", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 400 and data.error_id == \"ERR_INVALID_REQUEST\""

      - name: title_create_with_invalid_age_band_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Title.fields.age_band
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "age_band outside {INFANT, TODDLER, TWO, THREE, FOUR} is rejected 400; the enum is closed."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - *c_sep
          trigger:
            - call: "POST /library/titles"
              payload: { title_name: "Bad Band Book", author: "X", age_band: "FIVE", available_from_month: "2026-01", available_until_month: "2026-12" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status 400 and data.error_id == \"ERR_INVALID_REQUEST\""

      - name: get_child_with_unknown_id_returns_child_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/library/children/{id}
          - errors.ERR_CHILD_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated child id yields the entity-specific 404 ERR_CHILD_NOT_FOUND."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - *c_sep
          trigger:
            - call: "GET /library/children/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status 404 and data.error_id == \"ERR_CHILD_NOT_FOUND\""

      - name: children_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/library/children
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three children, limit=2&offset=0 returns 2 rows, total_count 3, has_more true; offset=2 returns 1 row, has_more false; enrollment_status=ACTIVE filter returns all 3."
        test_recipe:
          setup: ["Bootstrap core with affiliate A operative; children c1, c2, c3 registered."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - &c1
              call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "Ada Barnes", family_name: "Barnes", birth_date: "2026-05-10T00:00:00Z", mailing_address: { line1: "1 Oak St", city: "Nashville", region: "TN", postal_code: "37201", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { c1_id: $.data.id }
            - &c2
              call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "Bo Carter", family_name: "Carter", birth_date: "2026-06-15T00:00:00Z", mailing_address: { line1: "2 Elm St", city: "Nashville", region: "TN", postal_code: "37203", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { c2_id: $.data.id }
            - &c3
              call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "Cy Doyle", family_name: "Doyle", birth_date: "2026-07-04T00:00:00Z", mailing_address: { line1: "3 Pine St", city: "Nashville", region: "TN", postal_code: "37206", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { c3_id: $.data.id }
          trigger:
            - call: "GET /library/children"
              payload: { affiliate_id: "${aff_a_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response_type is array; 2 rows returned with total_count == 3 and has_more == true"
            - "GET with limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET with enrollment_status=ACTIVE returns 3 rows; with enrollment_status=GRADUATED returns 0 rows"
            - "GET with no params returns 3 rows (limit defaults to 10, offset 0)"

      - name: agreement_get_round_trips_window_fields
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/library/affiliates/{id}/agreements
          - entities.AffiliateAgreement
        distinguishing_aspect: "Every stored agreement field round-trips through the affiliate's agreements list exactly as posted, including the integer commitment and null decided_by before decision."
        test_recipe:
          setup: ["Bootstrap core; agreement created (PENDING_APPROVAL)."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
          trigger:
            - call: "GET /library/affiliates/${aff_a_id}/agreements"
              payload: {}
              as: PlatformAdmin
          assert:
            - "status 200; the single row's effective_from == \"2026-01-01T00:00:00Z\" and effective_to == \"2028-01-01T00:00:00Z\""
            - "the row's local_fundraising_commitment_cents == 5000000 and status == \"PENDING_APPROVAL\" and decided_by is null"
            - "the row's affiliate_id == ${aff_a_id} and total_count == 1"

      - name: child_computed_fields_on_registration
        claim_type: Computed Fields
        grounds:
          - entities.Child.fields.postal_prefix
          - entities.Child.fields.expected_final_mailing_month
          - entities.Child.fields.registered_month
        distinguishing_aspect: "Registration derives postal_prefix (first 3 chars of uppercased postal_code), registered_month from the logical clock, and expected_final_mailing_month = birth month + 59 — leap-day birth 2024-02-29 yields 2029-01."
        test_recipe:
          setup: ["Bootstrap core; affiliate A operative."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
          trigger:
            - call: "POST /library/children"
              payload: { affiliate_id: "${aff_a_id}", full_name: "Leap Day", family_name: "Day", birth_date: "2024-02-29T00:00:00Z", mailing_address: { line1: "5 Leap Ln", city: "Nashville", region: "TN", postal_code: "37206", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { leap_id: $.data.id }
          assert:
            - "Child.${leap_id}.postal_prefix == \"372\""
            - "Child.${leap_id}.registered_month == \"2026-09\""
            - "Child.${leap_id}.expected_final_mailing_month == \"2029-01\""
            - "enrollment_status == \"ACTIVE\", consecutive_returns == 0, unenroll_reason is null (initial state)"

      - name: affiliate_create_with_extra_system_fields_rejected
        claim_type: System Fields
        grounds:
          - entities.Affiliate
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Client-supplied id / version / enrolled_count in a create payload are rejected 400 — system and computed fields are never client-writable."
        test_recipe:
          setup: ["Clock set; program."]
          setup_api_calls:
            - *c_sep
            - *prog
          trigger:
            - call: "POST /library/affiliates"
              payload: { name: "Sneaky Affiliate", state_program_id: "${prog_id}", postal_prefixes: ["375"], contact_email: "x@y.org", id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 9, enrolled_count: 50 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status 400 and data.error_id == \"ERR_INVALID_REQUEST\""

  # ===========================================================================
  - section: state_machines
    instances:
      - name: agreement_approve_success_covered
        claim_type: Valid Transition
        grounds: [state_machines.AffiliateAgreement.PENDING_APPROVAL_to_ACTIVE]
        excluded_because:
          difficulty_instance: agreement_window_half_open_adjacency
          rationale: "The adjacent-window approve in that instance is the PENDING_APPROVAL -> ACTIVE success path asserted end-to-end."

      - name: selection_approve_success_covered
        claim_type: Valid Transition
        grounds: [state_machines.AgeBandSelection.PROPOSED_to_APPROVED]
        excluded_because:
          difficulty_instance: selection_approve_reopen_rework_cycle
          rationale: "The rework cycle instance asserts PROPOSED -> APPROVED twice with approved_by recorded."

      - name: child_hold_cycle_covered
        claim_type: Valid Transition
        grounds: [state_machines.Child.ACTIVE_to_UNDELIVERABLE_HOLD]
        excluded_because:
          difficulty_instance: child_undeliverable_hold_cycle
          rationale: "Both directions of the ACTIVE <-> UNDELIVERABLE_HOLD loop are asserted there."

      - name: invoice_dispute_overruled_returns_to_issued
        claim_type: Valid Transition
        grounds:
          - state_machines.AffiliateInvoice.DISPUTED_to_ISSUED
        distinguishing_aspect: "RESOLVE_OVERRULED closes the dispute cycle with zero financial drift: the invoice returns to ISSUED with gross/state/local exactly as issued and credit_memo_cents still 0."
        test_recipe:
          setup: ["Full bootstrap through wave 2026-10 reconcile; invoice issued (gross 672, state 330, local 342); dispute OPEN."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - &pop_a
              call: "POST /library/affiliates/${aff_a_id}/population-stats"
              payload: { effective_year: 2026, eligible_population: 10000 }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
            - &t_inf
              call: "POST /library/titles"
              payload: { title_name: "The Little Engine", author: "W Piper", age_band: "INFANT", available_from_month: "2026-01", available_until_month: "2027-12" }
              as: PlatformAdmin
              captures: { t_inf: $.data.id }
            - &t_tod
              call: "POST /library/titles"
              payload: { title_name: "Goodnight Cabin", author: "M Brown", age_band: "TODDLER", available_from_month: "2026-01", available_until_month: "2027-12" }
              as: PlatformAdmin
              captures: { t_tod: $.data.id }
            - &t_two
              call: "POST /library/titles"
              payload: { title_name: "Two at the Zoo", author: "K Ray", age_band: "TWO", available_from_month: "2026-01", available_until_month: "2027-12" }
              as: PlatformAdmin
              captures: { t_two: $.data.id }
            - &t_three
              call: "POST /library/titles"
              payload: { title_name: "Three Bears Bake", author: "L Hill", age_band: "THREE", available_from_month: "2026-01", available_until_month: "2027-12" }
              as: PlatformAdmin
              captures: { t_three: $.data.id }
            - &t_four
              call: "POST /library/titles"
              payload: { title_name: "Four Seasons Farm", author: "J Wren", age_band: "FOUR", available_from_month: "2026-01", available_until_month: "2027-12" }
              as: PlatformAdmin
              captures: { t_four: $.data.id }
            - &s_inf_o
              call: "POST /library/selections"
              payload: { mailing_month: "2026-10", age_band: "INFANT", title_id: "${t_inf}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_inf_o: $.data.id }
            - &s_inf_o_ok
              call: "POST /library/selections/${sel_inf_o}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - &s_tod_o
              call: "POST /library/selections"
              payload: { mailing_month: "2026-10", age_band: "TODDLER", title_id: "${t_tod}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_tod_o: $.data.id }
            - &s_tod_o_ok
              call: "POST /library/selections/${sel_tod_o}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - &s_two_o
              call: "POST /library/selections"
              payload: { mailing_month: "2026-10", age_band: "TWO", title_id: "${t_two}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_two_o: $.data.id }
            - &s_two_o_ok
              call: "POST /library/selections/${sel_two_o}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - &s_three_o
              call: "POST /library/selections"
              payload: { mailing_month: "2026-10", age_band: "THREE", title_id: "${t_three}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_three_o: $.data.id }
            - &s_three_o_ok
              call: "POST /library/selections/${sel_three_o}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - &s_four_o
              call: "POST /library/selections"
              payload: { mailing_month: "2026-10", age_band: "FOUR", title_id: "${t_four}" }
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ada"
              captures: { sel_four_o: $.data.id }
            - &s_four_o_ok
              call: "POST /library/selections/${sel_four_o}/approve"
              payload: {}
              as: AdvisoryCommitteeMember
              as_user_id: "acm-ben"
            - &p_inf_o
              call: "POST /library/print-orders"
              payload: { selection_id: "${sel_inf_o}", quantity: 6000, is_reprint: false }
              as: PublisherOps
              captures: { po_inf_o: $.data.id }
            - &p_inf_o_ok
              call: "POST /library/print-orders/${po_inf_o}/confirm"
              payload: {}
              as: PublisherOps
            - &p_tod_o
              call: "POST /library/print-orders"
              payload: { selection_id: "${sel_tod_o}", quantity: 6000, is_reprint: false }
              as: PublisherOps
              captures: { po_tod_o: $.data.id }
            - &p_tod_o_ok
              call: "POST /library/print-orders/${po_tod_o}/confirm"
              payload: {}
              as: PublisherOps
            - &p_two_o
              call: "POST /library/print-orders"
              payload: { selection_id: "${sel_two_o}", quantity: 6000, is_reprint: false }
              as: PublisherOps
              captures: { po_two_o: $.data.id }
            - &p_two_o_ok
              call: "POST /library/print-orders/${po_two_o}/confirm"
              payload: {}
              as: PublisherOps
            - &p_three_o
              call: "POST /library/print-orders"
              payload: { selection_id: "${sel_three_o}", quantity: 6000, is_reprint: false }
              as: PublisherOps
              captures: { po_three_o: $.data.id }
            - &p_three_o_ok
              call: "POST /library/print-orders/${po_three_o}/confirm"
              payload: {}
              as: PublisherOps
            - &p_four_o
              call: "POST /library/print-orders"
              payload: { selection_id: "${sel_four_o}", quantity: 6000, is_reprint: false }
              as: PublisherOps
              captures: { po_four_o: $.data.id }
            - &p_four_o_ok
              call: "POST /library/print-orders/${po_four_o}/confirm"
              payload: {}
              as: PublisherOps
            - *c1
            - *c2
            - *c3
            - &wave_o
              call: "POST /library/waves"
              payload: { mailing_month: "2026-10" }
              as: MailOps
              captures: { wave_o_id: $.data.id }
            - &wave_o_go
              call: "POST /library/waves/${wave_o_id}/manifest"
              payload: {}
              as: MailOps
            - &wave_o_rec
              call: "POST /library/waves/${wave_o_id}/reconcile"
              payload: {}
              as: MailOps
            - &inv_o
              call: "GET /library/invoices"
              payload: { wave_id: "${wave_o_id}" }
              as: PlatformAdmin
              captures: { inv_o_id: "$.data[0].id" }
            - call: "POST /library/invoices/${inv_o_id}/issue"
              payload: {}
              as: PlatformAdmin
            - call: "POST /library/invoices/${inv_o_id}/dispute"
              payload: { outcome: "OPEN" }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
          trigger:
            - call: "POST /library/invoices/${inv_o_id}/dispute"
              payload: { outcome: "RESOLVE_OVERRULED" }
              as: PlatformAdmin
          assert:
            - "AffiliateInvoice.${inv_o_id}.status == \"ISSUED\" again (DISPUTED -> ISSUED cycle)"
            - "gross_cents == 672, state_share_cents == 330, local_share_cents == 342, credit_memo_cents == 0 (no drift from the cycle)"

      - name: mark_returned_after_reconcile_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.MailingItem.MAILED_to_RETURNED_UNDELIVERABLE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "After reconcile auto-delivers all MAILED items, mark-returned hits a DELIVERED item in a RECONCILED wave — doubly invalid, still one clean 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Full bootstrap through wave 2026-10 reconcile; all three items DELIVERED."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - *t_inf
            - *t_tod
            - *t_two
            - *t_three
            - *t_four
            - *s_inf_o
            - *s_inf_o_ok
            - *s_tod_o
            - *s_tod_o_ok
            - *s_two_o
            - *s_two_o_ok
            - *s_three_o
            - *s_three_o_ok
            - *s_four_o
            - *s_four_o_ok
            - *p_inf_o
            - *p_inf_o_ok
            - *p_tod_o
            - *p_tod_o_ok
            - *p_two_o
            - *p_two_o_ok
            - *p_three_o
            - *p_three_o_ok
            - *p_four_o
            - *p_four_o_ok
            - *c1
            - *c2
            - *c3
            - *wave_o
            - *wave_o_go
            - *wave_o_rec
            - &item_o_c1
              call: "GET /library/items"
              payload: { wave_id: "${wave_o_id}", child_id: "${c1_id}" }
              as: PlatformAdmin
              captures: { item_o_c1: "$.data[0].id" }
          trigger:
            - call: "POST /library/items/${item_o_c1}/mark-returned"
              payload: {}
              as: MailOps
              captures: { err: $.data.error_id }
          assert:
            - "status 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "MailingItem.${item_o_c1}.status remains DELIVERED; MailingWave.${wave_o_id}.returned_item_count remains 0"

      - name: approve_rejected_agreement_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AffiliateAgreement.PENDING_APPROVAL_to_REJECTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "REJECTED is terminal: a subsequent approve (and any other transition) on the same agreement fails 409; a fresh agreement must be created instead."
        test_recipe:
          setup: ["Bootstrap core; agreement created then rejected."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - call: "POST /library/agreements/${agr_a_id}/reject"
              payload: {}
              as: StateProgramOfficer
              as_user_id: "${prog_id}"
          trigger:
            - call: "POST /library/agreements/${agr_a_id}/approve"
              payload: {}
              as: StateProgramOfficer
              as_user_id: "${prog_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 409 and data.error_id == \"ERR_INVALID_STATE\""
            - "AffiliateAgreement.${agr_a_id}.status remains REJECTED and decided_by remains the rejecting officer"

      - name: address_change_create_on_graduated_child_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Child.ACTIVE_to_GRADUATED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A GRADUATED child (terminal) rejects even the creation of an address-change request — terminal-state lockdown applies to child-scoped writes, not just transitions."
        test_recipe:
          setup: ["Bootstrap core; kid born 2021-10-15 registered 2026-09 (age 59); clock advanced to 2026-10-01, sweeping the kid to GRADUATED (expected_final 2026-09 < 2026-10)."]
          setup_api_calls:
            - *c_sep
            - *prog
            - *aff_a
            - *agr_a
            - *agr_a_ok
            - call: "POST /library/children"
