              captures: { err: $.data.error_id }
            - call: "POST /release-detection-records"
              payload: { tank_system_id: "${tank}", period_month: "2026-05", readings_summary: { log: "current" } }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { rec: $.data.id }
          assert:
            - "${err} == ERR_FUTURE_PERIOD (2026-06 is after the clock's month 2026-05)"
            - "${rec} non-null (recording the in-progress month is allowed)"

      - name: component_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_COMPONENT_MISMATCH]
        distinguishing_aspect: "CP_SURVEY with a SPILL_BUCKET component fails; symmetrically, TANK_TIGHTNESS carrying any component_id fails — component presence and type must match the service_type contract."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE with a SPILL_BUCKET component"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "Mismatch Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "SPILL_BUCKET", install_date: "2018-01-01T00:00:00Z", serial_no: "SB-2" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
          trigger:
            - call: "POST /service-orders"
              payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp", qty: 1, unit_price_cents: 40000 }] }
              as: ContractorAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /service-orders"
              payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", component_id: "${comp}", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }
              as: ContractorAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == ERR_COMPONENT_MISMATCH (CP_SURVEY requires a CATHODIC_PROTECTION component)"
            - "${err2} == ERR_COMPONENT_MISMATCH (tightness orders must carry null component_id)"

      - name: deficiency_link_wrong_tank_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
