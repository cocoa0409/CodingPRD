  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: consent_create_supersedes_prior_consent_and_repoints_connection
        claim_type: conditional_action
        grounds:
          - state_machines.ConsentRecord.ACTIVE_to_SUPERSEDED
          - endpoints."POST /recipients/{recipientId}/consents"
        distinguishing_aspect: "A new consent for the same (consumer_ref, recipient_id) pair with a SUPERSET scope set supersedes the prior consent and re-points its ACTIVE connection to the new consent instead of disconnecting it."
        test_recipe:
          setup: ["ACTIVE consent [BALANCE] with one ACTIVE connection; recipient tier covers [BALANCE, TRANSACTIONS]"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Supersede Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"], TRANSACTIONS: ["amount_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "SupersedeApp", declared_use_case: "consent upgrade", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "SupTier", scopes_included: ["BALANCE", "TRANSACTIONS"], rate_class: "MEDIUM" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v1: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_af", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v1}" }
              as: Consumer
              as_user_id: cons_af
              captures: { consent1_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_af", consent_id: "${consent1_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_af
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_af
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v2: $.data.version }
          trigger:
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_af", data_scopes: ["BALANCE", "TRANSACTIONS"], expires_at: "2027-06-30T00:00:00Z", expected_recipient_version: "${rec_id_v2}" }
              as: Consumer
              as_user_id: cons_af
              captures: { consent2_id: $.data.id }
            - call: "GET /consents/${consent1_id}"
              as: Consumer
              as_user_id: cons_af
              captures: { c1_st: $.data.status }
            - call: "GET /connections/${conn_id}"
              as: Consumer
              as_user_id: cons_af
              captures: { conn_st: $.data.status, conn_consent: $.data.consent_id }
          assert:
            - "Consent ${consent1_id}.status == SUPERSEDED (terminal)"
            - "Connection.${conn_id}.status remains ACTIVE and its consent_id now equals ${consent2_id} (re-pointed because superset)"
            - "Exactly 1 CONNECTION_MIGRATED WebhookEvent exists for connection ${conn_id}"

      - name: migrate_rejected_before_window_opens
        claim_type: conditional_action
        grounds:
          - validations[priority=12]
          - errors[ERR_MIGRATION_WINDOW_CLOSED]
        distinguishing_aspect: "The migrate action is rejected ERR_MIGRATION_WINDOW_CLOSED when the clock is before migration_window_start, independently of migration_state — one second before the window opens is enough."
        test_recipe:
          setup: ["ACTIVE CREDENTIALS connection at an institution whose window starts 2026-09-10; migration IN_PROGRESS started at window start, then clock moved back before start is impossible — instead start migration at window start, then test a SECOND institution-scoped migrate at a clock before its own window using a fresh connection at a second institution whose window has not opened"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "EarlyBird Bank", supported_methods: ["CREDENTIALS", "BANK_API"], target_method: "BANK_API", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "EarlyApp", declared_use_case: "early migrate", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "EarlyTier", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_ag", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_ag
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_ag", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_ag
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_ag
          trigger:
            - call: "POST /connections/${conn_id}/migrate"
              payload: {}
              as: Consumer
              as_user_id: cons_ag
              captures: { err: $.data.error_id }
          assert:
            - "http status == 422 and error_id == ERR_MIGRATION_WINDOW_CLOSED (clock 2026-09-01 < window start 2026-09-10, and migration_state still NOT_STARTED)"
            - "Connection.${conn_id} remains ACTIVE with method == CREDENTIALS"

      - name: stale_version_on_agreement_create_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[agreement-create-stale-institution]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Institution.version: after a first agreement create bumps the institution version, a second create carrying the pre-first-create version fails 412 ERR_STALE_VERSION while the first agreement remains the single ACTIVE one."
        test_recipe:
          setup: ["Institution created; client captured version 1"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "OccBank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v1: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 50, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v1}" }
              as: PlatformAdmin
              captures: { agr1: $.data.id }
          trigger:
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 75, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v1} - 1" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status == 412 and error_id == ERR_STALE_VERSION"
            - "GET /institutions/${inst_id}/agreements returns exactly 1 agreement (agr1, still ACTIVE)"
            - "Institution.version == 2 (bumped once by the successful create)"

      - name: cost_summary_computed_read_matches_formula
        claim_type: computed_read
        grounds:
          - calculations.connection_monthly_refresh_cost
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_connection_cost_final_vs_provisional
          rationale: "The finalized-variant figures (units=4, billable=0, cost_cents=0) are asserted literally in the named §1.8 instance."

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: err_unauthenticated_missing_role_header
        claim_type: error_trigger
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "A request without X-User-Role is rejected 401 ERR_UNAUTHENTICATED before any other processing."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /institutions"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "http status == 401 and error_id == ERR_UNAUTHENTICATED (no X-User-Role header supplied)"

      - name: err_unauthorized_wrong_role
        claim_type: error_trigger
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
        distinguishing_aspect: "A valid role that lacks the operation (Consumer attempting POST /institutions) is rejected 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /institutions"
              payload: { name: "Forbidden Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: Consumer
              as_user_id: cons_zz
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403 and error_id == ERR_UNAUTHORIZED"
            - "GET /institutions returns total_count == 0 (nothing persisted)"

      - name: err_invalid_request_bad_enum
        claim_type: error_trigger
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=20]
        distinguishing_aspect: "An out-of-set enum value (minimization_policy = EXTREME) fails field-level validation with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /recipients"
              payload: { name: "BadEnumApp", declared_use_case: "enum test", minimization_policy: "EXTREME" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: err_parent_not_operable_consent_on_pending_recipient
        claim_type: error_trigger
        grounds:
          - validations[priority=8]
          - errors[ERR_PARENT_NOT_OPERABLE]
        distinguishing_aspect: "Consent creation against a PENDING_REVIEW (not APPROVED) recipient fails 422 ERR_PARENT_NOT_OPERABLE even when state and OCC checks pass."
        test_recipe:
          setup: ["Recipient created but never reviewed"]
          setup_api_calls:
            - call: "POST /recipients"
              payload: { name: "PendingApp", declared_use_case: "pending gate", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id, rec_v: $.data.version }
          trigger:
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_ah", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_v}" }
              as: Consumer
              as_user_id: cons_ah
              captures: { err: $.data.error_id }
          assert:
            - "http status == 422 and error_id == ERR_PARENT_NOT_OPERABLE (priority 8 fires before minimization/tier checks)"
            - "GET /recipients/${rec_id}/consents returns an empty list"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: recipient_role_cannot_review_recipients
        claim_type: rbac_denial
        grounds:
          - roles.Recipient
          - roles.ComplianceReviewer
        distinguishing_aspect: "Recipient role holding a valid recipient id still cannot call POST /recipients/{id}/review — exclusive to ComplianceReviewer."
        test_recipe:
          setup: ["One PENDING_REVIEW recipient"]
          setup_api_calls:
            - call: "POST /recipients"
              payload: { name: "RbacApp", declared_use_case: "rbac test", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: Recipient
              as_user_id: "${rec_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403 and error_id == ERR_UNAUTHORIZED"
            - "Recipient.${rec_id}.status remains PENDING_REVIEW"

      - name: compliance_reviewer_cannot_suspend_recipient
        claim_type: rbac_denial
        grounds:
          - roles.ComplianceReviewer
          - roles.PlatformAdmin
        distinguishing_aspect: "Segregation of duties at the role level: the ComplianceReviewer who can approve cannot suspend — suspend is exclusive to PlatformAdmin."
        test_recipe:
          setup: ["One APPROVED recipient"]
          setup_api_calls:
            - call: "POST /recipients"
              payload: { name: "RbacSuspend", declared_use_case: "suspend rbac", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
          trigger:
            - call: "POST /recipients/${rec_id}/suspend"
              payload: {}
              as: ComplianceReviewer
              as_user_id: reviewer_2
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403 and error_id == ERR_UNAUTHORIZED"
            - "Recipient.${rec_id}.status remains APPROVED"

  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_consent_create_after_suspend
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consent-create-stale-recipient]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / conflict_state_beats_stale_version_on_consent_create
          rationale: "The named §1.8 instance already exercises the OCC-guarded consent create against a recipient whose version advanced; its assert pair pins both the 409 outcome and that ERR_STALE_VERSION was not returned."

      - name: derived_connectivity_mode_recomputed_through_migration
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Institution.fields.connectivity_mode
          - state_machines.InstitutionMigration.NOT_STARTED_to_IN_PROGRESS
          - state_machines.InstitutionMigration.IN_PROGRESS_to_COMPLETE
        distinguishing_aspect: "connectivity_mode is a derived field that must track migration_state exactly: LEGACY_MODE before start, HYBRID during IN_PROGRESS, API_ONLY after COMPLETE — verified at each migration step on the same institution."
        test_recipe:
          setup: ["Institution with BANK_API target and a window covering the clock; no connections (so completion precondition is vacuously true)"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "DerivedMode Bank", supported_methods: ["CREDENTIALS", "BANK_API"], target_method: "BANK_API", migration_window_start: "2026-09-01T00:00:00Z", migration_window_end: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, mode0: $.data.connectivity_mode }
          trigger:
            - call: "POST /institutions/${inst_id}/migration/start"
              payload: {}
              as: PlatformAdmin
              captures: { mode1: $.data.connectivity_mode }
            - call: "POST /institutions/${inst_id}/migration/complete"
              payload: {}
              as: PlatformAdmin
              captures: { mode2: $.data.connectivity_mode, mig2: $.data.migration_state }
          assert:
            - "mode0 == LEGACY_MODE, mode1 == HYBRID, mode2 == API_ONLY"
            - "mig2 == COMPLETE and Institution.version == 3 (create, start, complete)"

      - name: cascading_expiry_sweep_disconnects_and_notifies
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ConsentRecord.ACTIVE_to_EXPIRED
          - state_machines.Connection.ACTIVE_to_DISCONNECTED
        distinguishing_aspect: "Advancing the clock past expires_at triggers the eager sweep: consent EXPIRED, connection DISCONNECTED, CONSENT_EXPIRED webhook emitted — all from the single clock-set call, and the sweep reports the expired consent ids."
        test_recipe:
          setup: ["ACTIVE connection under a consent expiring 2026-09-02T00:00:00Z"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Sweep Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "SweepApp", declared_use_case: "expiry sweep", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "SweepTier", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_ai", data_scopes: ["BALANCE"], expires_at: "2026-09-02T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_ai
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_ai", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_ai
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_ai
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { expired: $.data.expired_consent_ids }
          assert:
            - "expired_consent_ids contains exactly [${consent_id}]"
            - "Consent.${consent_id}.status == EXPIRED and Connection.${conn_id}.status == DISCONNECTED"
            - "Exactly 1 CONSENT_EXPIRED WebhookEvent exists for connection ${conn_id}"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_refresh_effects_visible_in_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.RefreshJob.QUEUED_to_SUCCEEDED
        distinguishing_aspect: "Immediate consistency: the refresh response itself carries the executed RefreshJob (status SUCCEEDED, attempt_count 1, executed_at == clock), and a subsequent GET of the connection shows last_refreshed_at already updated — no async lag."
        test_recipe:
          setup: ["ACTIVE connection under a [BALANCE] consent"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "ImmedBank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /institutions/${inst_id}/agreements"
              payload: { rate_limit_per_hour: 100, permitted_fields_by_scope: { BALANCE: ["current_cents"] }, expected_institution_version: "${inst_v}" }
              as: PlatformAdmin
            - call: "POST /recipients"
              payload: { name: "ImmedApp", declared_use_case: "immediacy", minimization_policy: "BROAD" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /recipients/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: reviewer_1
            - call: "POST /tiers"
              payload: { tier_name: "ImmedTier", scopes_included: ["BALANCE"], rate_class: "LOW" }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_aj", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v}" }
              as: Consumer
              as_user_id: cons_aj
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_aj", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_aj
              captures: { conn_id: $.data.id }
            - call: "POST /connections/${conn_id}/complete_auth"
              payload: {}
              as: Consumer
              as_user_id: cons_aj
          trigger:
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL" }
              as: Consumer
              as_user_id: cons_aj
              captures: { job_st: $.data.status, job_at: $.data.executed_at, job_attempts: $.data.attempt_count }
            - call: "GET /connections/${conn_id}"
              as: Consumer
              as_user_id: cons_aj
              captures: { last_ref: $.data.last_refreshed_at }
          assert:
            - "job_st == SUCCEEDED, job_attempts == 1, job_at == 2026-09-01T00:00:00Z"
            - "last_refreshed_at == 2026-09-01T00:00:00Z on the very next read (immediate, not eventual)"
