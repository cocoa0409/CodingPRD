  - name: envelope_success_meta_carries_request_id_and_timestamp
    claim_type: Creation
    grounds:
    - response_envelope.success
    - endpoints.POST_/v1/shippers
    distinguishing_aspect: Every successful response, not just the first one, carries meta.api_request_id and meta.api_request_timestamp
      alongside response_type object and the data payload, and the two meta values differ between two successive calls.
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-09-20T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
          billing_state_code: TX
          payment_terms_days: 30
          quick_pay_discount_pct: 0.03
          credit_limit_cents: 20000000
          load_credit_limit: 10
        as: PlatformAdmin
        captures:
          shipper_id: $.data.id
      assert:
      - the response status is 201 and response_type is object
      - meta.api_request_id is a non-empty string on the response
      - meta.api_request_timestamp is a non-empty ISO-8601 string on the response
      - a second POST /v1/shippers returns a different meta.api_request_id
      - response_type is object and not array for a single-resource create
