            - *s_four_o
            - *s_four_o_ok
            - *p_inf_o
            - *p_inf_o_ok
            - *p_tod_o
            - *p_tod_o_ok
            - *p_two_o
            - *p_two_o_ok
            - *p_three_o
            - *p_three_o_ok
            - *p_four_o
            - *p_four_o_ok
            - *wave_o
          trigger:
            - *wave_o_go
            - *wave_o_rec
            - call: "GET /library/invoices"
              payload: { wave_id: "${wave_o_id}" }
              as: PlatformAdmin
          assert:
