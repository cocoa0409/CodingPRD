              captures: { pre_auto: $.data }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: StoreManager
            - call: "GET /parties/${party6}"
              payload: {}
              as: Customer
              as_user_id: "${cust6}"
              captures: { post_auto: $.data }
          assert:
            - "pre_auto.status == DEPOSIT_PAID (before crossing party_start - 24h)"
            - "post_auto.status == CONFIRMED (auto-transition fired when the clock crossed 2026-10-04T18:00:00Z)"

  # ===========================================================================
  # Rule 4 — transitive_cascade: two cascades from DIFFERENT triggers,
  # one of depth >= 3, the other >= 2; each link caused by the previous.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: party_payment_cascades_guest_attendance_then_final_bill
        grounds:
          - state_machines.WorkshopSession.DRESSED_to_PAID
          - state_machines.PartyGuest.CONFIRMED_to_ATTENDED
          - state_machines.PartyReservation.CONFIRMED_to_COMPLETED
          - calculations.party_final_amount_due
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: POST /workshops/{id}/payment
          mutates WorkshopSession -> PAID; that mutation mutates the linked
          PartyGuest -> ATTENDED; the attendance mutation is the input that
          party_final_amount_due consumes when a later finalize mutates
          PartyReservation -> COMPLETED with final_amount_due_cents. Removing
          the middle link (guest never ATTENDED) changes the final bill.
        test_recipe:
          setup:
            - "Store S7; Customer C7; BASIC party P7, 6 guests SELF_GUIDED, confirmed; one guest G confirmed"
            - "Clock at party time; G's session exists (created by auto-confirm); consumables/stations present"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Cascade Store", party_room_count: 1 }
              as: StoreManager
              captures: { store7: $.data.id }
            - call: "POST /customers"
              payload: { email: "c7@example.com", full_name: "Casey Seven" }
              as: Customer
              captures: { cust7: $.data.id }
