            - { call: "POST /freight/compliance-filings/${f2}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /freight/compliance-filings/${f2}/record-response", payload: { outcome: "ACCEPTED" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /freight/bill-of-lading/${bl}/release", payload: {}, as: DocumentationOfficer, as_user_id: "doc_2", captures: { err: $.data.error_id } }
            - { call: "POST /freight/bill-of-lading/${bl}/surrender", payload: {}, as: Shipper, as_user_id: "${s}", captures: { st1: $.data.status } }
            - { call: "POST /freight/bill-of-lading/${bl}/release", payload: {}, as: DocumentationOfficer, as_user_id: "doc_2", captures: { st2: $.data.status } }
          assert:
            - "release from ISSUED in ORIGINAL mode: error_id == ERR_BL_INVALID_STATE (direct path is SEAWAY-only)"
            - "surrender by owning shipper: status == SURRENDERED"
            - "release from SURRENDERED by doc_2 (filings cleared, COLLECT): status == RELEASED"

