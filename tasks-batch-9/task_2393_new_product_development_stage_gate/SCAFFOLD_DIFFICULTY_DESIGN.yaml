            - call: "POST /innovation-projects"
              payload: { name: "Idea Probe", brand: "SnackWorks", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 100000.00 }
