        test_recipe:
          setup: ["Two sponsors NRTH and SOUT exist; Account ACC-001 belongs to NRTH and holds 0c cash"]
          setup_api_calls:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
