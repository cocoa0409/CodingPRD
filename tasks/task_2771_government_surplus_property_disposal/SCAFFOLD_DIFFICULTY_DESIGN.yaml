            - "after that refusal SurplusAsset.${a_f}.disposition_status == ASSESSED and version == 2 — nothing was written"
            - "the screening-cycle create for ${a_c} at 2026-08-14 returns 201 because its period ended 2026-06-30: ScreeningCycle.${cyc_c}.status == OPEN and SurplusAsset.${a_c}.disposition_status == SCREENING"
