      - "applied MakeGoodCredits revert (remaining_cents restored; status OPEN or PARTIALLY_APPLIED)"
      - "client.outstanding_balance_cents recomputed"
      - "increments Invoice.version by 1"

  # --- Single-resource GETs needed to anchor lint collection derivation ---
  - method: GET
    path: "/btaa/weather_assessments/{id}"
    description: "Get a WeatherAssessment by id"
    roles: [PlatformAdmin, Dispatcher, ComplianceOfficer, Client, Pilot]
    code: 200
    input: []
    output: WeatherAssessment
    side_effects: []

  - method: GET
    path: "/btaa/flight_logs/{id}"
    description: "Get a FlightLog by id"
    roles: [PlatformAdmin, Dispatcher, FinanceOfficer, ComplianceOfficer, Client, Pilot]
    code: 200
    input: []
    output: FlightLog
    side_effects: []

  # --- FK reverse-reachability filtered lists ---
  - method: GET
    path: "/btaa/banners"
    description: "Filtered list of Banners; supports current_revision_id? filter (reverse-reach for Banner.current_revision_id FK)."
    roles: [PlatformAdmin, Dispatcher, GroundCrewLead, ComplianceOfficer, Client]
    code: 200
    input: ["current_revision_id?", "status?", "limit?", "offset?"]
    output: "Banner[]"
    side_effects: []

  - method: GET
    path: "/btaa/banner_revisions"
    description: "Filtered list of BannerRevisions; supports supersedes_revision_id? filter (reverse-reach for BannerRevision.supersedes_revision_id FK)."
    roles: [PlatformAdmin, Dispatcher, GroundCrewLead, ComplianceOfficer, Client]
    code: 200
    input: ["supersedes_revision_id?", "banner_id?", "status?", "limit?", "offset?"]
    output: "BannerRevision[]"
    side_effects: []

  - method: GET
    path: "/btaa/flight_slots"
    description: "Filtered list of FlightSlots; supports route_id?, airspace_approval_id?, banner_id?, assigned_aircraft_id?, assigned_pilot_id?, supersedes_slot_id?, consumed_make_good_credit_id? filters (reverse-reach for FlightSlot FKs)."
    roles: [PlatformAdmin, Dispatcher, FinanceOfficer, ComplianceOfficer, Client, Pilot, GroundCrewLead]
    code: 200
    input: ["route_id?", "airspace_approval_id?", "banner_id?", "assigned_aircraft_id?", "assigned_pilot_id?", "supersedes_slot_id?", "consumed_make_good_credit_id?", "campaign_id?", "status?", "date_local?", "limit?", "offset?"]
    output: "FlightSlot[]"
    side_effects: []

  - method: GET
    path: "/btaa/weather_assessments"
    description: "Filtered list of WeatherAssessments; supports assessed_by_pilot_id? filter (reverse-reach for WeatherAssessment.assessed_by_pilot_id FK)."
    roles: [PlatformAdmin, Dispatcher, ComplianceOfficer, Pilot]
    code: 200
    input: ["assessed_by_pilot_id?", "slot_id?", "limit?", "offset?"]
    output: "WeatherAssessment[]"
    side_effects: []

  - method: GET
    path: "/btaa/flight_logs"
    description: "Filtered list of FlightLogs; supports aircraft_id? and pilot_id? filters (reverse-reach for FlightLog FKs)."
    roles: [PlatformAdmin, Dispatcher, FinanceOfficer, ComplianceOfficer, Client, Pilot]
    code: 200
    input: ["aircraft_id?", "pilot_id?", "slot_id?", "limit?", "offset?"]
    output: "FlightLog[]"
    side_effects: []

  - method: GET
    path: "/btaa/make_good_credits"
    description: "Filtered list of MakeGoodCredits; supports source_slot_id? filter (reverse-reach for MakeGoodCredit.source_slot_id FK)."
    roles: [PlatformAdmin, FinanceOfficer, ComplianceOfficer, Client]
    code: 200
    input: ["source_slot_id?", "campaign_id?", "status?", "limit?", "offset?"]
    output: "MakeGoodCredit[]"
    side_effects: []

  # --- Ops run checkpoint ---
  - method: POST
    path: "/btaa/bases/{id}/run_ops"
    description: "Periodic ops checkpoint: expire stale MakeGoodCredits (expires_on_local < current local date)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ expired_credit_count: integer, expired_credit_ids: string[] }"
    side_effects:
      - "OPEN/PARTIALLY_APPLIED MakeGoodCredits whose expires_on_local < current local date → EXPIRED"
      - "campaign.unapplied_make_good_cents recomputed"

# =============================================================================
# §1.6 — Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per §1.7" }
  - { id: ERR_UNAUTHORIZED_OWNER, http: 403, condition: "Entity-backed caller does not own this resource (client/campaign mismatch, pilot/slot mismatch)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "ComplianceOfficer who granted an approval cannot file FlightLogs on slots using it" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a from-state permitting this transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no transitions permitted" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current parent entity version" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or out-of-range scalar" }
  - { id: ERR_INVALID_HOBBS, http: 422, condition: "hobbs_in <= hobbs_out on FlightLog filing" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value not in declared set" }
  - { id: ERR_TFR_BLOCKS_SLOT, http: 409, condition: "Stadium slot overlaps PUBLISHED TFR without waiver" }
  - { id: ERR_AIRSPACE_NOT_APPROVED, http: 409, condition: "AirspaceApproval not GRANTED, or slot window not contained in approval window" }
  - { id: ERR_OUTSIDE_APPROVAL_WINDOW, http: 409, condition: "Slot window exceeds approval window boundaries" }
  - { id: ERR_BOOKING_TOO_SOON, http: 409, condition: "planned_start_utc less than 24h in the future at booking time" }
  - { id: ERR_TOO_LATE_TO_SCHEDULE, http: 409, condition: "Attempt to schedule within T-2h of planned_start_utc" }
  - { id: ERR_SEASONAL_CAPACITY_EXCEEDED, http: 409, condition: "hours_remaining < planned_duration_hours for (base, month)" }
  - { id: ERR_NO_ELIGIBLE_AIRCRAFT, http: 409, condition: "aircraft_selector candidate set is empty" }
  - { id: ERR_NO_ELIGIBLE_PILOT, http: 409, condition: "pilot_selector candidate set is empty" }
  - { id: ERR_AIRCRAFT_DOUBLE_BOOKED, http: 409, condition: "Two FlightSlots for same aircraft overlap in time (half-open)" }
  - { id: ERR_BANNER_NOT_READY, http: 409, condition: "Banner.status != READY or no current_revision_id, or banner too short for route" }
  - { id: ERR_BANNER_TOO_SHORT, http: 409, condition: "banner_length_ft < route.min_banner_length_ft at fabrication time" }
  - { id: ERR_BANNER_IN_USE, http: 409, condition: "Attempt to retire a banner referenced by non-terminal FlightSlots" }
  - { id: ERR_NO_ACTIVE_REVISION, http: 409, condition: "Attempt to fabricate a banner with no ACTIVE revision" }
  - { id: ERR_INVALID_MAKE_GOOD_SOURCE, http: 409, condition: "supersedes_slot_id is not a CANCELLED_WEATHER slot, or its credit is not OPEN/PARTIALLY_APPLIED" }
  - { id: ERR_CAMPAIGN_HAS_OPEN_SLOTS, http: 409, condition: "Campaign cancel attempted with BOOKED/SCHEDULED/WEATHER_HOLD slots present" }
  - { id: ERR_CLIENT_CREDIT_HOLD, http: 402, condition: "Campaign creation blocked by client.credit_hold == true" }
  - { id: ERR_PICKUP_TECHNIQUE_NOT_ENDORSED, http: 409, condition: "AERIAL_PICKUP filed by TRAINEE pilot" }
  - { id: ERR_PILOT_SUSPENDED, http: 409, condition: "Attempt to schedule/assign a SUSPENDED pilot" }
  - { id: ERR_SLOT_NOT_FLOWN, http: 409, condition: "ProofOfFlight submitted for a slot not in FLOWN status" }

# =============================================================================
# §1.7 — RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator; full access; sole actor for clock-set, base/aircraft/pilot registration, ops_run"
    identity: "opaque"
    exclusive_operations:
      - "POST /btaa/_clock/set_current_utc"
      - "POST /btaa/bases"
      - "POST /btaa/bases/{id}/aircraft"
      - "POST /btaa/bases/{id}/pilots"
      - "POST /btaa/routes"
      - "POST /btaa/clients"
      - "POST /btaa/pilots/{id}/reinstate"
      - "POST /btaa/pilots/{id}/deactivate"
      - "POST /btaa/aircraft/{id}/retire"
      - "POST /btaa/bases/{id}/seasonal_capacities"
      - "POST /btaa/bases/{id}/run_ops"
    shared_operations:
      - "GET on all resources"

  - name: Client
    description: "Advertising client; owns Campaigns and Banners; approves/rejects BannerRevisions; books/cancels own slots"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /btaa/clients/{id}/campaigns (self only)"
      - "POST /btaa/campaigns/{id}/book"
      - "POST /btaa/campaigns/{id}/cancel"
      - "POST /btaa/campaigns/{id}/flight_slots"
      - "POST /btaa/campaigns/{id}/banners"
      - "POST /btaa/banner_revisions/{id}/approve"
      - "POST /btaa/banner_revisions/{id}/reject"
      - "POST /btaa/flight_slots/{id}/cancel_by_client"
    shared_operations:
      - "GET own campaigns/banners/slots/invoices/credits"
      - "GET /btaa/campaigns/{id}/billing_preview"

  - name: Dispatcher
    description: "Operations dispatcher; schedules slots, requests airspace approvals"
    identity: "opaque"
    exclusive_operations:
      - "POST /btaa/routes/{id}/airspace_approvals"
      - "POST /btaa/flight_slots/{id}/schedule"
      - "POST /btaa/flight_slots/{id}/reschedule_after_hold"
    shared_operations:
      - "GET on all resources"
      - "POST /btaa/flight_slots/{id}/weather_assessments"

  - name: Pilot
    description: "Tow pilot; files FlightLogs and ProofOfFlight; records WeatherAssessments"
    identity: "entity_backed:Pilot"
    exclusive_operations:
      - "POST /btaa/flight_slots/{id}/flight_log (assigned pilot only)"
      - "POST /btaa/flight_slots/{id}/proof_of_flight (assigned pilot only)"
    shared_operations:
      - "POST /btaa/flight_slots/{id}/weather_assessments"
      - "GET own resources"

  - name: GroundCrewLead
    description: "Fabrication & maintenance lead; fabricates banners, grounds aircraft"
    identity: "opaque"
    exclusive_operations:
      - "POST /btaa/banners/{id}/fabricate"
      - "POST /btaa/banners/{id}/mark_ready"
      - "POST /btaa/banners/{id}/retire"
      - "POST /btaa/aircraft/{id}/ground"
      - "POST /btaa/aircraft/{id}/return_to_service"
    shared_operations:
      - "GET on banner/aircraft/slot resources"

  - name: ComplianceOfficer
    description: "FAA liaison; grants/denies/revokes AirspaceApprovals; manages TFRs; finalizes ProofOfFlight. Segregation: cannot file FlightLogs on slots using approvals they granted."
    identity: "opaque"
    exclusive_operations:
      - "POST /btaa/airspace_approvals/{id}/grant"
      - "POST /btaa/airspace_approvals/{id}/deny"
      - "POST /btaa/airspace_approvals/{id}/revoke"
      - "POST /btaa/tfr_restrictions"
      - "POST /btaa/tfr_restrictions/{id}/cancel"
      - "POST /btaa/proof_of_flight/{id}/finalize"
    shared_operations:
      - "GET on all resources"

  - name: FinanceOfficer
    description: "Billing owner; issues and settles Invoices; manages credit holds"
    identity: "opaque"
    exclusive_operations:
      - "POST /btaa/campaigns/{id}/invoices"
      - "POST /btaa/invoices/{id}/mark_paid"
      - "POST /btaa/invoices/{id}/void"
      - "POST /btaa/clients/{id}/set_credit_hold"
    shared_operations:
      - "GET on all financial resources"
      - "GET /btaa/campaigns/{id}/billing_preview"
