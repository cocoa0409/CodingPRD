          trigger:
            - { call: "GET /revenue-statements", payload: { order_id: "${ord}" }, as: VanLineAdmin, captures: { stmt: "$.data[0].id" } }
            - { call: "GET /revenue-statements/${stmt}", as: VanLineAdmin }
          assert:
            - "RevenueStatement.${stmt}.linehaul_revenue_cents == 570240"
            - "RevenueStatement.${stmt}.booking_share_cents == 57024 (0.10 * L)"
            - "RevenueStatement.${stmt}.origin_share_cents == 119750 (round_half_up(0.21 * 570240) = round_half_up(119750.4))"
            - "RevenueStatement.${stmt}.hauling_share_cents == 313632 (round_half_up(0.56 * L) = 319334 minus floor deficit 5702)"
            - "RevenueStatement.${stmt}.destination_share_cents == 57024"
            - "RevenueStatement.${stmt}.van_line_share_cents == 22810 (floor round_half_up(0.04 * 570240) = round_half_up(22809.6); raw residual 17108 < floor so the branch fires)"
            - "booking+origin+hauling+destination+van_line == 570240 exactly (conservation)"
      - name: estimate_total_component_rounding_order
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.estimated_charges_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — linehaul 461193.75 raw rounds to 461194 and fuel
          34589.55 raw rounds to 34590, so pinned round-per-component-then-sum yields 495784, whereas the
          forbidden sum-then-round yields round(495783.28) = 495783. One cent of truth separates the orders.
        test_recipe:
          setup:
