  - section: calculations
    instances:
      - name: supplies_fee_stops_at_the_declared_cap
        claim_type: constants_applied
        grounds:
          - calculations.estimate_totals
          - entities.RepairOrder.fields.supplies_fee_cents
        distinguishing_aspect: >-
          One 60.0 h MECHANICAL line drives labor to 660000, and 4% of that is 26400 - above
          SUPPLIES_CAP_CENTS. The cap must bind at exactly 25000, and the capped figure must be the one
          that flows into pre_tax_total_cents (685000, not 686400) and from there into the bill split.
        test_recipe:
          setup:
            - "An Insurer with MECHANICAL rate_ceiling 11000 (below the 12500 shop rate) and an order with deductible 25000 and initial_authorized_cents 900000."
            - "One DRAFT MECHANICAL EstimateLine with guide_hours 60.0 and no parts."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Xen Kir", phone: "555-1023", email: "xen@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
