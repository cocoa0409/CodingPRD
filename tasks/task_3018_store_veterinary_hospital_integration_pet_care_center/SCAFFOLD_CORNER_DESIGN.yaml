          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/stores/{storeId}/_bump-occupancy-v1
        distinguishing_aspect: "The bump endpoint advances the store's version, so a second bump carrying the version observed before the first bump is refused with 412 while the same call with the refreshed version succeeds."
