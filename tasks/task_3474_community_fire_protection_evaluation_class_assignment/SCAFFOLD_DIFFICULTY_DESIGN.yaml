            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v1}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
          trigger:
            - { call: "POST /ppc/risk-reduction-credits/${crc}/transition", payload: { target_state: "REJECTED" }, as: FieldAnalyst }
            - { call: "POST /ppc/risk-reduction-credits/${crd}/transition", payload: { target_state: "VERIFIED" }, as: FieldAnalyst }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v2: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v2}" }, as: FieldAnalyst, captures: { sheet2: $.data.id } }
          assert:
            - "ScoreSheet.${sheet1}.adjusted_total_points == 90.00 and base_class == 1 (90.00 is inside class 1)"
            - "ScoreSheet.${sheet1}.split_class_beyond_hydrant == 4 (split total 65.00)"
            - "ScoreSheet.${sheet2}.adjusted_total_points == 89.99 and base_class == 2 (89.99 falls to class 2)"
            - "ScoreSheet.${sheet2}.crr_raw_points == 4.99"
            - "ScoreSheet.${sheet1}.status == SUPERSEDED after the second create"

      - name: hydrant_distance_boundary_1000ft_and_station_5mi
        grounds:
          - calculations.applicable_class_for_property
          - entities.PropertyRiskProfile.fields.applicable_class
        distinguishing_aspect: |
          Distance-metric boundary reachable via the property endpoint (different
          metric and endpoint than the points boundary): exactly 1000 ft from a
          hydrant is WITHIN (base class), 1001 ft is BEYOND (split class); exactly
          5.0 road miles from a station is WITHIN, 5.1 miles yields class 10.
        test_recipe:
          setup:
            - "Boundaryville-style community with EFFECTIVE classification base 1 / split 4"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Boundaryville2", state_code: "TX", population: 12000, area_sq_miles: 25, rural_area_pct: 30, dept_type: "CAREER", needed_fire_flow_gpm: 2000, storage_capacity_gal: 0, supply_works_capacity_gpm: 2500, daily_consumption_gpm: 300 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 6, volunteers_on_duty_avg: 0, training_hours_per_firefighter_annual: 240, training_facility_level: "B", live_fire_training: true, coverage_pct_within_5mi: 50 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "ENGINE", pump_capacity_gpm: 1800 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "LADDER", ladder_height_ft: 80 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "Main & 1st" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h1: $.data.id } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "Main & 5th" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h2: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h1}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 1200 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { t1: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h2}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 900 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { t2: $.data.id } }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 2, avg_alarm_to_dispatch_seconds: 55, redundant_circuits: true, backup_power: true }, as: CommsSupervisor }
            - { call: "POST /ppc/risk-reduction-credits", payload: { cycle_id: "${cy_id}", program_type: "PREVENTION_INSPECTION", activity_points: 2.5, evidence_note: "log A" }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { cra: $.data.id } }
            - { call: "POST /ppc/risk-reduction-credits", payload: { cycle_id: "${cy_id}", program_type: "CODE_ENFORCEMENT", activity_points: 3.0, evidence_note: "log B" }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { crb: $.data.id } }
            - { call: "POST /ppc/risk-reduction-credits", payload: { cycle_id: "${cy_id}", program_type: "PUBLIC_EDUCATION", activity_points: 1.0, evidence_note: "log C" }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { crc: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${t2}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${t2}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/risk-reduction-credits/${cra}/transition", payload: { target_state: "VERIFIED" }, as: FieldAnalyst }
            - { call: "POST /ppc/risk-reduction-credits/${crb}/transition", payload: { target_state: "VERIFIED" }, as: FieldAnalyst }
            - { call: "POST /ppc/risk-reduction-credits/${crc}/transition", payload: { target_state: "VERIFIED" }, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl1: $.data.id } }
            - { call: "POST /ppc/classifications/${cl1}/activate", payload: { effective_from: "2026-09-01" }, as: ClassRegistrar, as_user_id: "registrar-1" }
          trigger:
            - { call: "POST /ppc/property-risk-profiles", payload: { community_id: "${c_id}", address: "Within-1000", distance_to_nearest_hydrant_ft: 1000, distance_to_nearest_station_road_miles: 3.0, construction_type: "MASONRY", insured_value_cents: 100000000 }, as: EvaluationCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /ppc/property-risk-profiles", payload: { community_id: "${c_id}", address: "Beyond-1001", distance_to_nearest_hydrant_ft: 1001, distance_to_nearest_station_road_miles: 3.0, construction_type: "MASONRY", insured_value_cents: 100000000 }, as: EvaluationCoordinator, captures: { p2: $.data.id } }
            - { call: "POST /ppc/property-risk-profiles", payload: { community_id: "${c_id}", address: "Exactly-5mi", distance_to_nearest_hydrant_ft: 500, distance_to_nearest_station_road_miles: 5.0, construction_type: "MASONRY", insured_value_cents: 100000000 }, as: EvaluationCoordinator, captures: { p3: $.data.id } }
            - { call: "POST /ppc/property-risk-profiles", payload: { community_id: "${c_id}", address: "Beyond-5mi", distance_to_nearest_hydrant_ft: 500, distance_to_nearest_station_road_miles: 5.1, construction_type: "MASONRY", insured_value_cents: 100000000 }, as: EvaluationCoordinator, captures: { p4: $.data.id } }
          assert:
            - "PropertyRiskProfile.${p1}.applicable_class == 1 (exactly 1000 ft is WITHIN hydrant distance)"
            - "PropertyRiskProfile.${p2}.applicable_class == 4 (1001 ft gets the split class)"
            - "PropertyRiskProfile.${p3}.applicable_class == 1 (exactly 5.0 road miles is WITHIN station distance)"
            - "PropertyRiskProfile.${p4}.applicable_class == 10 (beyond 5 road miles is unprotected regardless of hydrant)"
            - "PropertyRiskProfile.${p2}.applicable_premium_modifier == 0.80 (class 4 modifier)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: scoring_gate_requires_cross_entity_data_completion
        grounds:
          - validations[priority=32]
          - state_machines.EvaluationCycle.FIELD_VERIFICATION_to_SCORING
          - entities.Community.fields.comms_attested
        distinguishing_aspect: |
          Pair EvaluationCycle x Community(comms): the FIELD_VERIFICATION -> SCORING
          transition is gated on a DIFFERENT entity's state — it fails with
          ERR_CYCLE_DATA_INCOMPLETE while the community's comms_attested is false or
          while any FlowTest of the water system is pending, and succeeds only after
          both foreign entities reach the required state.
        test_recipe:
          setup:
            - "Community A in FIELD_VERIFICATION with comms unattested; Community B in FIELD_VERIFICATION with comms attested but a flow test still SUBMITTED"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Gate A", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { ca: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${ca}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cya: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cya}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cya}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${ca}", as: EvaluationCoordinator, captures: { dept_a: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_a}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_a}" }
            - { call: "POST /ppc/evaluation-cycles/${cya}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/communities", payload: { name: "Gate B", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { cb: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${cb}", field_analyst_id: "analyst-2", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cyb: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cyb}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cyb}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${cb}", as: EvaluationCoordinator, captures: { dept_b: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_b}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_b}" }
            - { call: "PATCH /ppc/communities/${cb}/attest-comms", payload: { operators_on_duty_min: 2, avg_alarm_to_dispatch_seconds: 55, redundant_circuits: true, backup_power: true }, as: CommsSupervisor }
            - { call: "GET /ppc/water-supply-systems?community_id=${cb}", as: EvaluationCoordinator, captures: { sys_b: "$.data[0].id" } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_b}", location_descriptor: "H" }, as: WaterUtilityManager, as_user_id: "${sys_b}", captures: { hb: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_b}", hydrant_id: "${hb}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 1000 }, as: WaterUtilityManager, as_user_id: "${sys_b}", captures: { tb: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cyb}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
          trigger:
            - { call: "POST /ppc/evaluation-cycles/${cya}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator, captures: { err_a: $.data.error_id } }
            - { call: "POST /ppc/evaluation-cycles/${cyb}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator, captures: { err_b: $.data.error_id } }
            - { call: "PATCH /ppc/communities/${ca}/attest-comms", payload: { operators_on_duty_min: 2, avg_alarm_to_dispatch_seconds: 55, redundant_circuits: true, backup_power: true }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cya}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
          assert:
            - "first trigger on cycle A returns ERR_CYCLE_DATA_INCOMPLETE (comms_attested false on the Community)"
            - "trigger on cycle B returns ERR_CYCLE_DATA_INCOMPLETE (FlowTest.${tb} still SUBMITTED)"
            - "after attestation, cycle A reaches SCORING"
            - "EvaluationCycle.${cyb}.status remains FIELD_VERIFICATION until the test is certified or rejected"

      - name: quote_create_requires_effective_classification
        grounds:
          - validations[priority=34]
          - entities.PremiumQuote.fields.classification_id
        distinguishing_aspect: |
          Pair PremiumQuote x Classification: quote creation is gated on the state of
          a different entity — the community must hold an EFFECTIVE classification;
          a merely PUBLISHED one (or none) yields ERR_NO_EFFECTIVE_CLASSIFICATION,
          and only activation unlocks quote creation. Different pair than
          cycle x comms above.
        test_recipe:
          setup:
            - "Community with a fully computed classification left in PUBLISHED (never activated); one property registered"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Gate C", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/property-risk-profiles", payload: { community_id: "${c_id}", address: "3 Birch St", distance_to_nearest_hydrant_ft: 300, distance_to_nearest_station_road_miles: 1.0, construction_type: "FRAME", insured_value_cents: 100000000 }, as: EvaluationCoordinator, captures: { prop_id: $.data.id } }
          trigger:
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 1000000, base_rate_bp: 300, term_months: 6, coverage_start_date: "2027-01-01", coverage_end_date: "2027-06-30" }, as: Insurer, captures: { err1: $.data.error_id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl1: $.data.id } }
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 1000000, base_rate_bp: 300, term_months: 6, coverage_start_date: "2027-01-01", coverage_end_date: "2027-06-30" }, as: Insurer, captures: { err2: $.data.error_id } }
            - { call: "POST /ppc/classifications/${cl1}/activate", payload: { effective_from: "2026-09-01" }, as: ClassRegistrar, as_user_id: "registrar-1" }
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 1000000, base_rate_bp: 300, term_months: 6, coverage_start_date: "2027-01-01", coverage_end_date: "2027-06-30" }, as: Insurer, captures: { q1: $.data.id } }
          assert:
            - "first quote create returns ERR_NO_EFFECTIVE_CLASSIFICATION (no classification at all)"
            - "second quote create returns ERR_NO_EFFECTIVE_CLASSIFICATION (classification only PUBLISHED)"
            - "third quote create succeeds after activation; PremiumQuote.${q1}.classification_id == ${cl1} (pinned)"
            - "PropertyRiskProfile.${prop_id}.applicable_class is null before activation and 10 after"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: analyst_cycle_windows_half_open_overlap
        grounds:
          - validations[priority=38]
          - calculations.schedule_windows
        distinguishing_aspect: |
          Half-open interval semantics on the analyst-calendar resource: cycle
          windows [open, freeze) that merely touch (one opens the day the other's
          freeze falls) do NOT conflict, while a one-day interior overlap DOES —
          adjacency allowed, different semantics than the closed quote intervals.
        test_recipe:
          setup:
            - "Three registered communities; analyst-9 already assigned cycle W1 [2026-09-01, 2026-12-01)"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "WinA", state_code: "TX", population: 1000, area_sq_miles: 10, rural_area_pct: 50, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 50 }, as: EvaluationCoordinator, captures: { wa: $.data.id } }
            - { call: "POST /ppc/communities", payload: { name: "WinB", state_code: "TX", population: 1000, area_sq_miles: 10, rural_area_pct: 50, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 50 }, as: EvaluationCoordinator, captures: { wb: $.data.id } }
            - { call: "POST /ppc/communities", payload: { name: "WinC", state_code: "TX", population: 1000, area_sq_miles: 10, rural_area_pct: 50, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 50 }, as: EvaluationCoordinator, captures: { wc: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${wa}", field_analyst_id: "analyst-9", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy1: $.data.id } }
          trigger:
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${wb}", field_analyst_id: "analyst-9", scheduled_open_date: "2026-12-01", data_freeze_date: "2027-03-01" }, as: EvaluationCoordinator, captures: { cy2: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${wc}", field_analyst_id: "analyst-9", scheduled_open_date: "2026-11-15", data_freeze_date: "2027-02-01" }, as: EvaluationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "cycle for WinB is created (open 2026-12-01 == W1 freeze: touching half-open windows do not overlap)"
            - "cycle for WinC returns 409 ERR_CYCLE_WINDOW_CONFLICT (2026-11-15 is inside W1's window)"
            - "EvaluationCycle.${cy1}.community_id == ${wa} and remains SCHEDULED"

      - name: bound_quote_coverage_closed_interval_overlap
        grounds:
          - validations[priority=42]
          - state_machines.PremiumQuote.QUOTED_to_BOUND
        distinguishing_aspect: |
          Closed-interval semantics on the property resource: BOUND coverage windows
          conflict even when they share a single day (2027-12-31 vs 2027-12-31),
          while strictly disjoint windows bind freely — adjacency rejected, the
          opposite geometric treatment from the half-open cycle windows.
        test_recipe:
          setup:
            - "Community with EFFECTIVE classification; property insured 200,000,000; quote Q1 [2027-01-01, 2027-12-31] BOUND"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Overlapton", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl1: $.data.id } }
            - { call: "POST /ppc/classifications/${cl1}/activate", payload: { effective_from: "2026-09-01" }, as: ClassRegistrar, as_user_id: "registrar-1" }
            - { call: "POST /ppc/property-risk-profiles", payload: { community_id: "${c_id}", address: "9 Elm St", distance_to_nearest_hydrant_ft: 300, distance_to_nearest_station_road_miles: 1.0, construction_type: "FRAME", insured_value_cents: 200000000 }, as: EvaluationCoordinator, captures: { prop_id: $.data.id } }
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 10000000, base_rate_bp: 300, term_months: 12, coverage_start_date: "2027-01-01", coverage_end_date: "2027-12-31" }, as: Insurer, captures: { q1: $.data.id } }
            - { call: "GET /ppc/communities/${c_id}", as: Insurer, captures: { c_v1: $.data.version } }
            - { call: "POST /ppc/premium-quotes/${q1}/bind", payload: { expected_community_version: "${c_v1}" }, as: Insurer }
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 5000000, base_rate_bp: 300, term_months: 6, coverage_start_date: "2027-12-31", coverage_end_date: "2028-06-30" }, as: Insurer, captures: { q2: $.data.id } }
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 5000000, base_rate_bp: 300, term_months: 12, coverage_start_date: "2028-01-01", coverage_end_date: "2028-12-31" }, as: Insurer, captures: { q3: $.data.id } }
          trigger:
            - { call: "GET /ppc/communities/${c_id}", as: Insurer, captures: { c_v2: $.data.version } }
            - { call: "POST /ppc/premium-quotes/${q2}/bind", payload: { expected_community_version: "${c_v2}" }, as: Insurer, captures: { err: $.data.error_id } }
            - { call: "POST /ppc/premium-quotes/${q3}/bind", payload: { expected_community_version: "${c_v2}" }, as: Insurer }
          assert:
            - "binding Q2 returns 409 ERR_QUOTE_COVERAGE_OVERLAP (shared day 2027-12-31 collides under closed intervals)"
            - "binding Q3 succeeds (2028-01-01 is strictly after Q1's end: disjoint windows)"
            - "PremiumQuote.${q2}.status remains QUOTED; PremiumQuote.${q3}.status == BOUND"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: bind_void_exposure_ledger_conservation
        grounds:
          - calculations.exposure_ledger
          - state_machines.PremiumQuote.QUOTED_to_BOUND
          - state_machines.PremiumQuote.BOUND_to_VOIDED
          - entities.Community.fields.bound_exposure_cents
        distinguishing_aspect: |
          Conserved monetary quantity: community.bound_exposure_cents must equal the
          sum of coverage over BOUND quotes at every step — bind Q1 (25,000,000),
          bind Q2 (10,000,000) -> 35,000,000, void Q1 -> exactly 10,000,000, with no
          drift after the forward+compensating pair.
        test_recipe:
          setup:
            - "Community with EFFECTIVE class-10 classification; property insured 200,000,000; two quotes created"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Ledger Falls", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl1: $.data.id } }
            - { call: "POST /ppc/classifications/${cl1}/activate", payload: { effective_from: "2026-09-01" }, as: ClassRegistrar, as_user_id: "registrar-1" }
            - { call: "POST /ppc/property-risk-profiles", payload: { community_id: "${c_id}", address: "4 Maple Ave", distance_to_nearest_hydrant_ft: 300, distance_to_nearest_station_road_miles: 1.0, construction_type: "FRAME", insured_value_cents: 200000000 }, as: EvaluationCoordinator, captures: { prop_id: $.data.id } }
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 25000000, base_rate_bp: 300, term_months: 6, coverage_start_date: "2027-01-01", coverage_end_date: "2027-06-30" }, as: Insurer, captures: { q1: $.data.id } }
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 10000000, base_rate_bp: 300, term_months: 6, coverage_start_date: "2028-01-01", coverage_end_date: "2028-06-30" }, as: Insurer, captures: { q2: $.data.id } }
          trigger:
            - { call: "GET /ppc/communities/${c_id}", as: Insurer, captures: { v0: $.data.version } }
            - { call: "POST /ppc/premium-quotes/${q1}/bind", payload: { expected_community_version: "${v0}" }, as: Insurer }
            - { call: "GET /ppc/communities/${c_id}", as: Insurer, captures: { v1: $.data.version } }
            - { call: "POST /ppc/premium-quotes/${q2}/bind", payload: { expected_community_version: "${v1}" }, as: Insurer }
            - { call: "POST /ppc/premium-quotes/${q1}/void", payload: {}, as: Insurer }
            - { call: "GET /ppc/communities/${c_id}", as: Insurer }
          assert:
            - "after bind Q1: Community.${c_id}.bound_exposure_cents == 25000000"
            - "after bind Q2: bound_exposure_cents == 35000000"
            - "after void Q1: bound_exposure_cents == 10000000 == sum over BOUND quotes (only Q2)"
            - "PremiumQuote.${q1}.status == VOIDED and PremiumQuote.${q2}.status == BOUND"

      - name: hydrant_outage_reactivation_flow_conservation
        grounds:
          - state_machines.Hydrant.ACTIVE_to_OUT_OF_SERVICE
          - entities.WaterSupplySystem.fields.active_certified_flow_gpm
          - entities.WaterSupplySystem.fields.creditworthy_hydrant_count
        distinguishing_aspect: |
          Conserved hydraulic quantity (different conserved quantity than the
          monetary ledger): taking hydrant A OUT_OF_SERVICE drops
          active_certified_flow_gpm 3801 -> 1629 and creditworthy count 2 -> 1, and
          the compensating reactivation restores exactly 3801 and 2 — forward and
          compensating actions leave the system aggregates unchanged.
        test_recipe:
          setup:
            - "Community in FIELD_VERIFICATION with hydrants A (certified 2172 gpm) and B (certified 1629 gpm)"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Hydra Springs", state_code: "TX", population: 9000, area_sq_miles: 18, rural_area_pct: 10, dept_type: "CAREER", needed_fire_flow_gpm: 2000, storage_capacity_gal: 0, supply_works_capacity_gpm: 2500, daily_consumption_gpm: 300 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "A" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { ha: $.data.id } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "B" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { hb: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${ha}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 1200 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { ta: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${hb}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 900 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { tb: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/flow-tests/${ta}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${ta}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${tb}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${tb}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "GET /ppc/water-supply-systems/${sys_id}", as: FieldAnalyst }
            - { call: "PATCH /ppc/hydrants/${ha}", payload: { status: "OUT_OF_SERVICE" }, as: WaterUtilityManager, as_user_id: "${sys_id}" }
            - { call: "GET /ppc/water-supply-systems/${sys_id}", as: FieldAnalyst }
            - { call: "PATCH /ppc/hydrants/${ha}", payload: { status: "ACTIVE" }, as: WaterUtilityManager, as_user_id: "${sys_id}" }
            - { call: "GET /ppc/water-supply-systems/${sys_id}", as: FieldAnalyst }
          assert:
            - "initially active_certified_flow_gpm == 3801 and creditworthy_hydrant_count == 2"
            - "after OUT_OF_SERVICE: active_certified_flow_gpm == 1629 and creditworthy_hydrant_count == 1"
            - "after reactivation: active_certified_flow_gpm == 3801 and creditworthy_hydrant_count == 2 (no drift)"
