              as_user_id: "reg-alice"
              captures: { p: $.data.id }
            - call: "POST /pesticide-registry/registration-applications"
              payload: { product_id: "${p}", use_pattern: "NON_FOOD_USE", requested_classification: "GENERAL_USE", proposed_use_sites: [{ site_code: "TURF", pest_code: "GRUB", max_application_rate_lbs_acre: 1.0, max_applications_per_season: 2, preharvest_interval_days: 0, application_method: "GROUND", restricted_entry_interval_hours: 24 }] }
