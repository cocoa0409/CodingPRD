# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role, or missing X-User-ID for an entity_backed role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or entity_backed caller does not own the target resource (e.g. Client acting on another client's enrollment, Coach completing another coach's session)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, or numeric range violation (duration_minutes outside 30..120, outcome_rating outside 1..5, capacity < 2, target_count < 1)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's state machine does not permit the transition from its current state (generic state-precondition failure)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_enrollment_version != Enrollment.version on an OCC-guarded write" }
  - { id: ERR_COACH_NOT_CREDENTIALED, http: 422, condition: "Coach credential_status != VERIFIED or ethics_status != ACTIVE on a delivery-side action" }
  - { id: ERR_FIT_NOT_ESTABLISHED, http: 422, condition: "Enrollment creation against a discovery call with no FitAssessment or outcome=REFER_OUT" }
  - { id: ERR_SESSION_OVERLAP, http: 409, condition: "New/rescheduled session interval [start, start+duration+buffer) intersects another SCHEDULED session of the same coach (half-open, buffer-inclusive)" }
  - { id: ERR_DISCOVERY_CALL_OVERLAP, http: 409, condition: "New/rescheduled discovery call closed interval [start, start+duration] intersects another SCHEDULED discovery call of the same coach (closed semantics, no buffer; touching endpoints collide)" }
  - { id: ERR_OUTSIDE_PROGRAM_WINDOW, http: 422, condition: "scheduled_start outside [activated_at, activated_at + duration_days)" }
  - { id: ERR_RESCHEDULE_CAP_REACHED, http: 422, condition: "Late reschedule requested when late_reschedules_used >= tier.reschedule_cap" }
  - { id: ERR_NO_SESSIONS_REMAINING, http: 422, condition: "Booking when Enrollment.sessions_remaining == 0" }
  - { id: ERR_COACH_CAPACITY_FULL, http: 422, condition: "Activation would exceed Coach.max_concurrent_clients" }
  - { id: ERR_COHORT_NOT_JOINABLE, http: 409, condition: "Join against cohort_status not in {OPEN, IN_PROGRESS}, or duplicate membership for the same enrollment" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Uniqueness violation: second FitAssessment for a call, second Testimonial for an enrollment, second check-in for (goal,date), duplicate email" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Fit assessor equals the discovery call's coach, or a non-PracticeManager attempts credential verification" }
  - { id: ERR_TIER_RETIRED, http: 422, condition: "Enrollment creation against a ProgramTier with tier_status == RETIRED" }
  - { id: ERR_PAYMENT_PLAN_INVALID, http: 422, condition: "installment_count outside [1, tier.installment_count_allowed] on enrollment creation" }
  - { id: ERR_REFUND_NOT_ALLOWED, http: 422, condition: "Refund request against an enrollment not in {ACTIVE, PAUSED}, never activated, with paid_cents == 0, or with a prior APPROVED RefundRequest" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; superset of configuration powers (tiers, clock, payments simulation)"
    identity: opaque
    exclusive_operations:
      - "POST /coaching/program-tiers"
      - "POST /coaching/_clock/set_current_utc"
    shared_operations:
      - "POST /coaching/_payments/simulate"
      - "POST /coaching/coaches"
      - "POST /coaching/clients"
      - "all GET endpoints"

  - name: PracticeManager
    description: "Practice operations staff; owns compliance actions (credential verification, ethics suspension, refund adjudication, testimonial publishing)"
    identity: opaque
    exclusive_operations:
      - "POST /coaching/coaches/{id}/verify-credential"
      - "POST /coaching/coaches/{id}/revoke-credential"
      - "POST /coaching/coaches/{id}/suspend-ethics"
      - "POST /coaching/refund-requests/{id}/approve"
      - "POST /coaching/refund-requests/{id}/deny"
      - "POST /coaching/testimonials/{id}/publish"
    shared_operations:
      - "POST /coaching/_payments/simulate"
      - "POST /coaching/coaches"
      - "POST /coaching/clients"
      - "POST /coaching/discovery-calls"
      - "POST /coaching/enrollments"
      - "POST /coaching/refund-requests"
      - "all GET endpoints"

  - name: Coach
    description: "ICF-credentialed coach delivering sessions, discovery calls, and cohort facilitation"
    identity: "entity_backed:Coach"
