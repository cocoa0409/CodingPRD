  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_claim_pay
        grounds:
          - validations[priority=4]
          - validations[priority=21]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): a claim that is DENIED
          (wrong state) on a unit whose budget guard would also fail must surface
          ERR_INVALID_STATE (priority 4), not ERR_BUDGET_EXCEEDED (priority 20).
        test_recipe:
          setup:
            - "Clock 2026-08-01; budget line ICU-4W FY2027 allocated only 1 cent (guard will fail any payment)"
            - "Nurse F with CURRENT SPECIALTY cert; claim 50000 submitted then DENIED"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/budget-lines"
              payload: { unit: "ICU-4W", fiscal_year: 2027, allocated_cents: 1 }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-F", full_name: "Nurse F", hire_date: "2021-01-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { nf_id: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${nf_id}", track: "SPECIALTY", certifying_body: "ANCC", exam_fee_cents: 100000, obtained_on: "2026-07-01T00:00:00Z", expires_on: "2031-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { fc_id: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims"
              payload: { certification_id: "${fc_id}", claimed_amount_cents: 50000 }
              as: Nurse
              as_user_id: "${nf_id}"
              captures: { fclaim_id: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims/${fclaim_id}/deny"
              payload: { denial_reason: "duplicate receipt" }
              as: ProgramAdmin
          trigger:
            - call: "POST /clinical-ladder/reimbursement-claims/${fclaim_id}/pay"
              payload: {}
              as: PayrollOfficer
              captures: { pay_err: $.data.error_id }
          assert:
            - "pay_err == ERR_INVALID_STATE (state beats fiscal even though budget guard would also fail)"

      - name: sod_vs_temporal_on_decide
        grounds:
          - validations[priority=7]
          - validations[priority=25]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_temporal): a decide call
          where the decider is also a scored reviewer (segregation-of-duties) AND
          the applicant's certification has been revoked since submission (temporal
          re-check) must surface ERR_SEGREGATION_OF_DUTIES (priority 7), not
          ERR_STALE_REFERENCE (priority 25).
        test_recipe:
          setup:
            - "Clock 2026-08-01; CN_II criterion C1 (min_score 75); nurse G's application IN_REVIEW with three SCORED assignments"
            - "One scored reviewer is nurse H; the deciding call passes X-User-ID equal to H's nurse id, so the decider identity collides with a scored reviewer (SoD violation)"
            - "After scoring, G's BASIC certification is revoked, so the decide-time certification-currency re-check (priority 25) would also fail"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
