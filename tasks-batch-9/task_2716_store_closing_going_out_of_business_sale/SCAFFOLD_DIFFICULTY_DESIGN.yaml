  - rule_id: boundary_precision_check
    instances:

      - name: checkpoint_shortfall_exactly_zero_versus_one_band_short
        grounds:
          - calculations.markdown_escalation_adjustment
          - entities.MarkdownStage.fields.escalation_applied_pct
          - entities.MarkdownStage.fields.closed_reason
          - entities.Store.fields.realized_sell_through_pct
          - endpoints[POST /markdown-stages/{id}/checkpoint]
        distinguishing_aspect: |
          The escalation ladder is exercised exactly at its zero boundary: with an identical
          realized sell-through of 0.2500 on both stores, a target of 0.2500 gives shortfall
          0.0000 and must take the `shortfall <= 0.0000` branch (ON_SCHEDULE, successor discount
          left at 0.4000), while a target of 0.3000 gives shortfall 0.0500 — the smallest shortfall
          that still costs one full ESCALATION_BAND — and raises the successor to 0.4500. An
          implementation using `<` instead of `<=`, or ceil on a zero shortfall, escalates the
          first store by a whole band.
        test_recipe:
          setup:
            - "One FEE_BASED engagement with two stores S-201 and S-202 in NY, both SELLING under APPROVED licences for 2026-09-15..2026-10-14"
