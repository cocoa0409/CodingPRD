            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH CE2", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 3 }
              as: ClaimsAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_CLAIM_NOT_PAYABLE (parent Claim is SUBMITTED, not APPROVED)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: offset_window_closed_interval_touching_collides
        grounds:
          - validations[priority=8]
          - entities.OffsetAward.fields.start_month
          - entities.OffsetAward.fields.end_month
        distinguishing_aspect: |
          OffsetAward windows are CLOSED intervals with a one-month no-touch buffer: an existing SSDI award
          [3,5] and a new SSDI award [5,7] share endpoint month 5 -> ERR_OFFSET_WINDOW_OVERLAP. Touching
          rejected (closed-interval semantics on the OffsetAward resource).
        test_recipe:
          setup:
            - "Insurer at month 5; APPROVED TOTAL claim with one SSDI OffsetAward over [3,5]."
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "TO1 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 5 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 0 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH TO1", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/offset-awards"
              payload: { offset_source: "SSDI", monthly_offset_cents: 120000, start_month: 3, end_month: 5 }
              as: ClaimsAdjudicator
          trigger:
            - call: "POST /disability/claims/${c_id}/offset-awards"
              payload: { offset_source: "SSDI", monthly_offset_cents: 90000, start_month: 5, end_month: 7 }
              as: ClaimsAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_OFFSET_WINDOW_OVERLAP (closed [3,5] touches [5,7] at month 5)"

      - name: benefit_period_half_open_consecutive_months_allowed
        grounds:
          - validations[priority=9]
          - entities.BenefitPeriod.fields.coverage_month
        distinguishing_aspect: |
          BenefitPeriod months are HALF-OPEN single-month intervals: consecutive coverage_months 3 and 4
          touch but do NOT collide (both accrue), while a duplicate month 3 collides
          (ERR_COVERAGE_MONTH_OCCUPIED). Different interval semantics (half-open touching-allowed) and a
          different resource than OffsetAward's closed touching-rejected windows.
        test_recipe:
          setup:
            - "Insurer at month 6; ACTIVE ANY_OCC TOTAL policy, benefit_period_months 12, elimination 90d (elim_sat=3, next_proof_due 6)."
            - "Approved TOTAL claim with a BenefitPeriod already accrued at coverage_month 3."
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "TO2 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 6 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 0 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH TO2", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 3 }
              as: ClaimsAdjudicator
          trigger:
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 4 }
              as: ClaimsAdjudicator
              captures: { bp4_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 3 }
              as: ClaimsAdjudicator
              captures: { dup_err: $.data.error_id }
          assert:
            - "Consecutive month 4 accrues: BenefitPeriod.${bp4_id}.coverage_month == 4, status == ACCRUED"
            - "Duplicate month 3: HTTP 409, data.error_id == ERR_COVERAGE_MONTH_OCCUPIED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_reverse_restores_benefit_months_consumed
        grounds:
          - state_machines.Claim.transitions.APPROVED_to_DENIED
          - entities.Policy.fields.benefit_months_consumed
          - entities.BenefitPeriod.fields.status
        distinguishing_aspect: |
          Conserved quantity #1 = Policy.benefit_months_consumed (benefit-months). Forward: two TOTAL
          accruals drive consumed 0 -> 2.0. Compensating reverse REVERSES both BenefitPeriods and returns
          consumed to exactly 0.0 (no drift). Invariant: consumed == sum of ACCRUED benefit_fraction.
        test_recipe:
          setup:
            - "Insurer at month 6; ACTIVE ANY_OCC TOTAL policy, benefit_period_months 12, monthly_benefit 500000."
            - "Approved TOTAL claim with two BenefitPeriods accrued at coverage_month 3 and 4 (consumed 2.0)."
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "CI1 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 6 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 0 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH CI1", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 3 }
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 4 }
              as: ClaimsAdjudicator
          trigger:
            - call: "POST /disability/claims/${c_id}/reverse"
              payload: {}
              as: ClaimsAdjudicator
              captures: { c_status: $.data.status }
            - call: "GET /disability/policies/${p_id}"
              payload: {}
              as: Underwriter
              captures: { consumed_after: $.data.benefit_months_consumed }
          assert:
            - "Before reverse: Policy.${p_id}.benefit_months_consumed == 2.0"
            - "After reverse: Claim.${c_id}.status == DENIED"
            - "After reverse: Policy.${p_id}.benefit_months_consumed == 0.0 (both periods REVERSED, no drift)"

      - name: offset_void_restores_overpayment_balance
        grounds:
          - state_machines.OffsetAward.transitions.FINALIZED_to_VOID
          - entities.ClaimLedger.fields.overpayment_balance_cents
          - entities.OffsetAward.fields.estimated_offset_snapshot_cents
        distinguishing_aspect: |
          Conserved quantity #2 = ClaimLedger.overpayment_balance_cents (overpayment dollars), a DIFFERENT
          quantity from benefit-months. Finalizing an SSDI offset (estimate 120000 -> final 200000) over one
          accrued month books 80000 overpayment; voiding the finalized award returns overpayment_balance_cents
          to exactly 0 (the finalize delta is undone, no drift).
        test_recipe:
          setup:
            - "Insurer at month 5; ACTIVE ANY_OCC TOTAL policy, monthly_benefit 500000, benefit_period_months 12."
            - "Approved TOTAL claim; one BenefitPeriod accrued at coverage_month 3 (gross 500000)."
            - "SSDI OffsetAward ESTIMATED 120000 over [3,5] (estimated_offset_cents 120000, net recomputed to 380000)."
            - "Award FINALIZED at final_monthly_offset_cents 200000 -> overpayment_balance_cents 80000, net 300000."
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "CI2 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 5 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 0 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH CI2", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 3 }
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/offset-awards"
              payload: { offset_source: "SSDI", monthly_offset_cents: 120000, start_month: 3, end_month: 5 }
              as: ClaimsAdjudicator
              captures: { oa_id: $.data.id }
            - call: "POST /disability/offset-awards/${oa_id}/finalize"
              payload: { final_monthly_offset_cents: 200000 }
              as: ClaimsAdjudicator
          trigger:
            - call: "POST /disability/offset-awards/${oa_id}/void"
              payload: {}
              as: ClaimsAdjudicator
              captures: { oa_status: $.data.status }
            - call: "GET /disability/claims/${c_id}/ledger"
              payload: {}
              as: ClaimsAdjudicator
              captures: { overpay_after: "$.data[0].overpayment_balance_cents" }
          assert:
            - "After finalize (final 200000 vs estimate 120000), ClaimLedger overpayment_balance_cents == 80000"
            - "After void, OffsetAward.${oa_id}.status == VOID"
            - "After void, ClaimLedger overpayment_balance_cents == 0 (returned to pre-finalize value, no drift)"
            - "After void, the covered BenefitPeriod net_benefit_cents == 500000 (offset removed)"
