# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Perioperative Preference Card & Supply Picking
# Breadth probe across the claim-extraction-guide sections. Instances already
# exercised by §1.8 are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: surgeon_created_with_active_status_default
        claim_type: defaults
        grounds: [entities.Surgeon.fields.status]
        distinguishing_aspect: "A created surgeon starts ACTIVE with version 1 and a server-minted UUID id; no client input can set status."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. New", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id", s_status: "$.data.status", s_v: "$.data.version" } }
          trigger: []
          assert:
            - "${s_status} == ACTIVE (system default applied)"
            - "${s_v} == 1"
            - "response envelope: response_type == object; data.id is a server-minted UUID"

      - name: supply_item_created_with_system_defaults
        claim_type: defaults
        grounds: [entities.SupplyItem.fields.on_hand_quantity, entities.SupplyItem.fields.consignment_flag, entities.SupplyItem.fields.status]
        distinguishing_aspect: "Omitting initial_on_hand/consignment_flag yields on_hand_quantity 0, consignment_flag false, status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /perioperative/supply-items", payload: { sku: "SYR-10", name: "Syringe 10ml", unit_cost_cents: 75 }, as: SupplyChainAnalyst, captures: { i_id: "$.data.id" } }
          trigger:
            - { call: "GET /perioperative/supply-items/${i_id}", as: Any }
          assert:
            - "SupplyItem.${i_id}.on_hand_quantity == 0"
            - "SupplyItem.${i_id}.consignment_flag == false"
            - "SupplyItem.${i_id}.status == ACTIVE"

      - name: card_version_number_sequences_within_surgeon_procedure_pair
        claim_type: computed_fields
        grounds: [entities.PreferenceCard.fields.version_number]
        distinguishing_aspect: "version_number is scoped to the (surgeon_id, procedure_name) pair: two cards for the same pair get 1 then 2; a different procedure restarts at 1."
        test_recipe:
          setup: ["surgeon S exists"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Seq", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { c1_vn: "$.data.version_number" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { c2_vn: "$.data.version_number" } }
          trigger:
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "THA" }, as: SupplyChainAnalyst, captures: { c3_vn: "$.data.version_number" } }
          assert:
            - "${c1_vn} == 1 and ${c2_vn} == 2 (same pair increments)"
            - "${c3_vn} == 1 (different procedure restarts the sequence)"

      - name: card_estimated_cost_recomputed_on_line_add_and_delete
        claim_type: computed_fields
        grounds: [calculations.card_estimated_cost, entities.PreferenceCard.fields.estimated_cost_cents]
        distinguishing_aspect: "estimated_cost_cents tracks line mutations immediately: 0 -> 500 (2x250) -> 1500 (+1x1000) -> 500 (delete the 1000c line)."
        test_recipe:
          setup: ["surgeon S, items GLOVE-PR 250c and SUTURE-KIT 1000c, DRAFT card"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Est", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "SUTURE-KIT", name: "Suture kit", unit_cost_cents: 1000, substitute_group: "SUTURE", initial_on_hand: 50 }, as: SupplyChainAnalyst, captures: { item_b: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id", est0: "$.data.estimated_cost_cents" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 2, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { est1: "$.data.estimated_cost_cents" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_b}", quantity: 1, designation: "HOLD", pick_sequence: 2 }, as: SupplyChainAnalyst, captures: { line_b: "$.data.id" } }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { est2: "$.data.estimated_cost_cents" } }
          trigger:
            - { call: "DELETE /perioperative/preference-card-lines/${line_b}", as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { est3: "$.data.estimated_cost_cents" } }
          assert:
            - "estimates observed: ${est0} == 0, ${est1} == 500, ${est2} == 1500, ${est3} == 500"

      - name: get_unknown_surgeon_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A well-formed but nonexistent UUID yields the error envelope with ERR_NOT_FOUND, message, and meta block (http 404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /perioperative/surgeons/11111111-1111-1111-1111-111111111111", as: Any, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_NOT_FOUND with http 404"
            - "error envelope contains meta.api_request_id, response_type == error, data.message present"

      - name: surgeon_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required specialty fails input-shape validation before any existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Nofield" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (http 400); no surgeon persisted"

      - name: card_line_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.PreferenceCardLine.fields.designation, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "designation must be OPEN or HOLD; the value MAYBE is rejected at priority 3."
        test_recipe:
          setup: ["surgeon S, item A, DRAFT card"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Enum", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "MAYBE", pick_sequence: 1 }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (http 400)"

      - name: card_line_with_unknown_card_returns_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=4]", entities.PreferenceCardLine.fields.card_id]
        distinguishing_aspect: "A line referencing a nonexistent card_id fails FK existence with ERR_NOT_FOUND."
        test_recipe:
          setup: ["item A exists"]
          setup_api_calls:
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "22222222-2222-2222-2222-222222222222", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_NOT_FOUND (http 404)"

      - name: product_request_requester_stamped_from_x_user_id
        claim_type: system_fields
        grounds: [entities.ProductRequest.fields.surgeon_id, roles.Surgeon.identity]
        distinguishing_aspect: "The request's surgeon_id is taken from X-User-ID of the entity-backed Surgeon caller, not from any request field."
        test_recipe:
          setup: ["surgeon S exists"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Stamp", specialty: "CARD" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/product-requests", payload: { proposed_item_name: "Valve introducer", proposed_sku: "VALVE-INTRO-1", estimated_unit_cost_cents: 4000, rationale: "better implant tray system" }, as: Surgeon, as_user_id: "${s_id}", captures: { req_surgeon: "$.data.surgeon_id", req_status: "$.data.status" } }
          assert:
            - "${req_surgeon} == ${s_id} (stamped from header)"
            - "${req_status} == SUBMITTED and endorsements_count == 0"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: publish_supersedes_prior_active_version
        claim_type: side_effect_execution
        grounds: [state_machines.PreferenceCard.DRAFT_to_ACTIVE, state_machines.PreferenceCard.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Publishing v2 while v1 is ACTIVE moves v1 to SUPERSEDED (its version increments) and v2 to ACTIVE — exactly one ACTIVE card per pair."
        test_recipe:
          setup: ["surgeon S, item A; card v1 (1x A OPEN) published ACTIVE"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Sup", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { c1: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${c1}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${c1}", as: Any, captures: { c1_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${c1}/publish", payload: { expected_card_version: "${c1_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { c2: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${c2}", supply_item_id: "${item_a}", quantity: 3, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${c2}", as: Any, captures: { c2_v: "$.data.version" } }
          trigger:
            - { call: "POST /perioperative/preference-cards/${c2}/publish", payload: { expected_card_version: "${c2_v}" }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${c1}", as: Any, captures: { c1_st: "$.data.status" } }
            - { call: "GET /perioperative/preference-cards?surgeon_id=${s_id}&procedure_name=TKA&status=ACTIVE", as: Any }
          assert:
            - "PreferenceCard.${c1}.status == SUPERSEDED (${c1_st})"
            - "PreferenceCard.${c2}.status == ACTIVE"
            - "ACTIVE-filtered list for the pair returns total_count 1 (exactly one active version)"

      - name: publish_empty_card_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PreferenceCard.DRAFT_to_ACTIVE, "errors[ERR_CARD_EMPTY]"]
        distinguishing_aspect: "A DRAFT card with a matching OCC version but zero lines fails the >= 1 line constraint with ERR_CARD_EMPTY."
        test_recipe:
          setup: ["surgeon S; empty DRAFT card"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Empty", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
          trigger:
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CARD_EMPTY; card remains DRAFT"

      - name: retire_card_with_inflight_case_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PreferenceCard.ACTIVE_to_RETIRED, "errors[ERR_CARD_IN_USE]"]
        distinguishing_aspect: "A card pinned by a SCHEDULED case cannot be retired; ERR_CARD_IN_USE fires."
        test_recipe:
          setup: ["surgeon S, item A; card published; case scheduled against it (SCHEDULED, no pick list)"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Ret", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
          trigger:
            - { call: "POST /perioperative/preference-cards/${card_id}/retire", payload: {}, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CARD_IN_USE; card remains ACTIVE"

      - name: begin_picking_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PickList.GENERATED_to_IN_PICKING, "errors[ERR_PICK_LIST_INVALID_STATE]"]
        distinguishing_aspect: "begin-picking is accepted once (GENERATED -> IN_PICKING); the identical second call is rejected — the trigger is not idempotent."
        test_recipe:
          setup: ["released pick list for a 1-line card case"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Twice", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_PICK_LIST_INVALID_STATE; list remains IN_PICKING"

      - name: dispatch_with_pending_lines_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PickList.STAGED_to_DISPATCHED, "errors[ERR_PICK_LIST_INVALID_STATE]"]
        distinguishing_aspect: "Dispatch requires STAGED; a list still IN_PICKING (lines PENDING) rejects dispatch with ERR_PICK_LIST_INVALID_STATE."
        test_recipe:
          setup: ["released pick list, picking begun, line still PENDING"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Early", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
          trigger:
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_PICK_LIST_INVALID_STATE; list remains IN_PICKING; case remains PICKING_RELEASED"

      - name: accept_audit_twice_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CardAccuracyAudit, "errors[ERR_AUDIT_NOT_ACTIONABLE]"]
        distinguishing_aspect: "ACCEPTED is terminal: a second accept is rejected with ERR_AUDIT_NOT_ACTIONABLE."
        test_recipe:
          setup: ["completed case whose audit is GENERATED, then accepted once"]
          setup_api_calls:
            - { call: "POST /perioperative/surgeons", payload: { full_name: "Dr. Term", specialty: "ORTHO" }, as: SupplyChainAnalyst, captures: { s_id: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GLOVE-PR", name: "Gloves pair", unit_cost_cents: 250, substitute_group: "GLOVES", initial_on_hand: 100 }, as: SupplyChainAnalyst, captures: { item_a: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "TKA" }, as: SupplyChainAnalyst, captures: { card_id: "$.data.id" } }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_id}", supply_item_id: "${item_a}", quantity: 1, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_id}", as: Any, captures: { card_v: "$.data.version" } }
            - { call: "POST /perioperative/preference-cards/${card_id}/publish", payload: { expected_card_version: "${card_v}" }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/cases", payload: { surgeon_id: "${s_id}", card_id: "${card_id}", scheduled_start: "2026-09-05T08:00:00Z", expected_duration_min: 60, room: "OR-1" }, as: SupplyChainAnalyst, captures: { case_id: "$.data.id" } }
            - { call: "POST /perioperative/cases/${case_id}/release-pick-list", payload: {}, as: SupplyChainAnalyst, captures: { pl_id: "$.data.id" } }
            - { call: "GET /perioperative/pick-list-lines?pick_list_id=${pl_id}", as: Any, captures: { line_a: "$.data[0].id" } }
            - { call: "POST /perioperative/pick-lists/${pl_id}/begin-picking", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-list-lines/${line_a}/pick", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/dispatch", payload: {}, as: CartTechnician }
            - { call: "POST /perioperative/pick-lists/${pl_id}/return", payload: { return_entries: [] }, as: CartTechnician }
            - { call: "POST /perioperative/cases/${case_id}/complete", payload: { usage_entries: [ { pick_list_line_id: "${line_a}", qty_used: 1 } ] }, as: CirculatingNurse }
            - { call: "GET /perioperative/card-audits?case_id=${case_id}", as: Any, captures: { audit_id: "$.data[0].id" } }
            - { call: "POST /perioperative/card-audits/${audit_id}/accept", payload: {}, as: SupplyChainAnalyst }
          trigger:
            - { call: "POST /perioperative/card-audits/${audit_id}/accept", payload: {}, as: SupplyChainAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_AUDIT_NOT_ACTIONABLE; audit remains ACCEPTED"

      - name: reopen_generated_audit_returns_not_disputed
        claim_type: invalid_transition
