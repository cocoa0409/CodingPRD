            - call: "POST /easement-cases/${case_id}/permits/${p3_id}/record-inspection"
              payload: { result: "PASSED" }
              as: VegetationInspector
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { cv3: $.data.version }
            - call: "POST /easement-cases/${case_id}/permits/${p3_id}/approve"
              payload: { expected_case_version: "${cv3}" }
              as: RightOfWayAgent
          assert:
            - "Same-type overlapping approve error_id == ERR_PERMIT_OVERLAP"
            - "Different-type overlapping approve succeeded (approval_status == APPROVED)"

  # =====================================================================
  # Rule 9: compensating_invariant — different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: compensation_balance_invariant_across_tender_reject
        grounds:
          - calculations.compensation_balance
          - state_machines.AcquisitionOffer.DRAFT_to_TENDERED
          - state_machines.AcquisitionOffer.TENDERED_to_REJECTED_BY_OWNER
        distinguishing_aspect: |
          Conserved quantity: EasementCase.acquisition_budget_cents.
          Invariant: for any sequence of tender/reject/withdraw/expire,
          compensation_committed_cents + compensation_balance_cents ==
          acquisition_budget_cents. Forward action (tender) + compensating
          action (reject) leaves the case's fiscal state unchanged.
