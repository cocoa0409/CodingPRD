          With attainment pinned at exactly 80.00 (which PASSES), the verdict is decided by a single cent
          of opex: 11935543 rounds to 10.01 and fails the 10.00 ceiling. The UNDERPERFORMING verdict then
          re-scores the department's OTHER still-SCORED request in a different, still-SCORING cycle,
