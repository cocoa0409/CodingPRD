      - name: finance_operator_cannot_perform_policy_or_configuration_operations
        claim_type: role_cannot_perform_other_exclusive_operations
        grounds:
          - "roles[FinanceOperator].description"
          - "roles[PolicyReviewer].exclusive_operations"
          - "roles[PlatformAdmin].exclusive_operations"
        distinguishing_aspect: "The only money-moving role is denied on both flanks: rating content and opening an investigation are 403, and so are creating a product, creating a period and setting the clock."
        test_recipe:
          setup: ["One creator with one GREEN content item."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
