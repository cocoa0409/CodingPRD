            - call: "POST /campus/museums/${mus_id}/timed-entry-passes"
              payload: { visitor_name: "Slot One A", visit_date: "2026-09-20", entry_quarter_hour: 1 }
              as: Public
              as_user_id: "v-1a"
              captures: { p1: $.data.id }
            - call: "POST /campus/museums/${mus_id}/timed-entry-passes"
              payload: { visitor_name: "Slot One B", visit_date: "2026-09-20", entry_quarter_hour: 1 }
              as: Public
              as_user_id: "v-1b"
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /campus/museums/${mus_id}/timed-entry-passes"
              payload: { visitor_name: "Slot One C", visit_date: "2026-09-20", entry_quarter_hour: 1 }
              as: Public
              as_user_id: "v-1c"
              captures: { err_slot: $.data.error_id }
            - call: "POST /campus/museums/${mus_id}/timed-entry-passes"
              payload: { visitor_name: "Slot Two A", visit_date: "2026-09-20", entry_quarter_hour: 2 }
              as: Public
              as_user_id: "v-2a"
              captures: { p4: $.data.id }
            - call: "POST /campus/museums/${mus_id}/timed-entry-passes"
              payload: { visitor_name: "Slot Three A", visit_date: "2026-09-20", entry_quarter_hour: 3 }
              as: Public
              as_user_id: "v-3a"
              captures: { err_daily: $.data.error_id }
          assert:
            - "third pass on slot 1 fails err_slot == ERR_SLOT_QUOTA_EXHAUSTED (slot_used == quota == 2)"
            - "pass on slot 2 succeeds (TimedEntryPass.${p4}.status == RESERVED) — daily count now 3"
            - "pass on slot 3 fails err_daily == ERR_DAILY_QUOTA_EXHAUSTED even though slot 3 is empty (daily_used == daily quota == 3)"

      - name: indemnity_and_courier_term_gates
        claim_type: constants_applied
        grounds:
          - calculations.loan_terms_validation
          - errors[ERR_INDEMNITY_MINIMUM_NOT_MET]
          - errors[ERR_INDEMNITY_REQUIRES_COURIER]
          - errors[ERR_COURIER_REQUIRED]
        distinguishing_aspect: "All three loan-term gates fire at accept (never at propose): INDEMNITY below 500000000 declared fails ERR_INDEMNITY_MINIMUM_NOT_MET; INDEMNITY without courier fails ERR_INDEMNITY_REQUIRES_COURIER; INSURANCE at 150000000 declared without courier fails ERR_COURIER_REQUIRED; the compliant INDEMNITY loan accepts with premium 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One object; four PROPOSED loans, all windows [2026-10-01, 2027-01-01): L1 INDEMNITY declared 400000000 courier true; L2 INDEMNITY declared 600000000 courier false; L3 INDEMNITY declared 600000000 courier true; L4 INSURANCE declared 150000000 courier false."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0012", title: "Treaty of Canandaigua", declared_value_cents: 600000000, is_cultural_property: false }
