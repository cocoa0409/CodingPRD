  # ===========================================================================
  - section: validations
    instances:
      - name: missing_user_context_header_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request sent WITHOUT the X-User-ID header is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER at priority 1, before any role/existence/business check — even on a valid endpoint with a valid body."
        test_recipe:
          setup: ["empty DB", "the trigger request is dispatched with NO X-User-ID header (header omitted entirely)"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/projects"
              payload: { project_name: "No Header", owner_name: "Owner", jurisdiction_code: "US-FED", asset_type: "BRIDGE", warranty_budget_cents: 1000 }
              as: ProjectEngineer
          assert:
            - "HTTP 400 with error_id ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (the X-User-ID header is absent, so priority-1 auth fires regardless of the valid body)"

      - name: existence_checked_before_state_on_transition
        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=4]"
          - "errors[ERR_WORK_ORDER_NOT_FOUND]"
        distinguishing_aspect: "On a transition endpoint, path existence (priority 3) is validated before the state precondition (priority 4): begin-prep-inspection on a NONEXISTENT work order returns 404 ERR_WORK_ORDER_NOT_FOUND, never 409 ERR_INVALID_STATE — proving left-to-right existence precedes the state gate."
        test_recipe:
          setup:
            - "one project exists (so projectId resolves); the work order id in the path does NOT exist"
          setup_api_calls:
            - call: "POST /coating/projects"
              payload: { project_name: "Order Of Checks", owner_name: "Owner", jurisdiction_code: "US-FED", asset_type: "BRIDGE", warranty_budget_cents: 1000 }
              as: ProjectEngineer
              captures:
                proj_id: $.data.id
          trigger:
            - call: "POST /coating/projects/${proj_id}/work-orders/00000000-0000-4000-8000-000000000099/begin-prep-inspection"
              payload: {}
              as: ApplicatorRep
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
          assert:
            - "HTTP 404 with error_id ERR_WORK_ORDER_NOT_FOUND (existence beats state — a 409 ERR_INVALID_STATE would be wrong ordering)"

      - name: active_spec_exists_on_second_issue_without_supersede
        claim_type: violation_to_error
        grounds:
          - "state_machines.ProjectSpecification.transitions.DRAFT_to_ISSUED"
          - "errors[ERR_ACTIVE_SPEC_EXISTS]"
        distinguishing_aspect: "Issuing a second specification while another is already ISSUED on the same project — without naming it via supersedes_specification_id — is rejected 409 ERR_ACTIVE_SPEC_EXISTS; the current-version OCC passes, so the business referential rule is what fires."
        test_recipe:
          setup:
            - "clock; regulation; coating system; project PLANNING; spec1 DRAFT then ISSUED; spec2 DRAFT (different system, NO supersedes link)"
          setup_api_calls:
