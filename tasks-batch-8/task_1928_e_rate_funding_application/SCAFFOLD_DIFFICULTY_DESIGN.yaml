# =============================================================================
# Task 1928 — E-Rate Funding Application
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: discount_rate_direct_vs_cep
        grounds:
          - calculations.discount_rate_lookup
          - entities.NSLPSnapshot.fields.cep_participating
          - entities.NSLPSnapshot.fields.effective_share_pct
        distinguishing_aspect: |
          Entity domain: Applicant discounting. Two valid share computations over the same
          applicant+cycle cohort — DIRECT_SNAPSHOT (300/1000 = 30.00%) and CEP_PROJECTED
          (30.00 * 1.6 = 48.00%) — land in different matrix bands and yield different pinned
          rates (C1 50 vs 60); variant selection is driven by the latest snapshot's
          cep_participating flag, not by caller choice.
        test_recipe:
          setup:
            - "FY2027 cycle; applicant school URBAN 1000 students; snapshot S1 direct 300/1000"
            - "then snapshot S2 CEP participating with cep_identified_student_pct 30.00"
            - "logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /erate/applicants"
              payload: { name: "Unified School District 7", entity_type: "SCHOOL", urban_rural: "URBAN", student_count: 1000 }
              as: ProgramAdmin
              captures: { app: $.data.id }
            - call: "POST /erate/nslp-snapshots"
              payload: { applicant_id: "${app}", funding_cycle_id: "${cyc}", total_students: 1000, free_lunch_eligible_students: 300, cep_participating: false }
              as: ProgramAdmin
          trigger:
            - call: "GET /erate/applicants/${app}/budget-summary"
              payload: { funding_cycle_id: "${cyc}" }
              as: Any
              captures: { rate_c1_direct: $.data.discount_rate_c1_pct, share_direct: $.data.nslp_share_pct }
            - call: "POST /erate/nslp-snapshots"
              payload: { applicant_id: "${app}", funding_cycle_id: "${cyc}", total_students: 1000, free_lunch_eligible_students: 300, cep_participating: true, cep_identified_student_pct: 30.00 }
              as: ProgramAdmin
            - call: "GET /erate/applicants/${app}/budget-summary"
              payload: { funding_cycle_id: "${cyc}" }
              as: Any
              captures: { rate_c1_cep: $.data.discount_rate_c1_pct, share_cep: $.data.nslp_share_pct }
          assert:
            - "share_direct == 30.0 and rate_c1_direct == 50 (DIRECT_SNAPSHOT: band [20,35) of C1_URBAN)"
            - "share_cep == 48.0 and rate_c1_cep == 60 (CEP_PROJECTED: min(30.00*1.6,100)=48.00, band [35,50))"
            - "rate_c1_direct != rate_c1_cep — same cohort, two variants, different results"

      - name: invoice_bear_vs_spi_divergence
        grounds:
          - calculations.invoice_reimbursement
          - entities.InvoiceSubmission.fields.method
          - entities.InvoiceSubmission.fields.approved_reimbursement_cents
        distinguishing_aspect: |
          Entity domain: InvoiceSubmission reimbursement. For identical gross_invoiced_cents
          (40,000) and identical pinned rate (50%), the BEAR variant (applicant paid only
          30,000) approves 15,000 while the SPI variant (vendor-discounted) approves 20,000 —
          same inputs, different money, driven by the method variant.
        test_recipe:
          setup:
            - "FY2027; school applicant with direct snapshot 300/1000 (rate 50% C1)"
            - "C1 procurement awarded to VendorOne at 90,000 cents; contract CERTIFIED with total_eligible_cents 90000"
            - "request certified in filing window with two C1 lines: L1 requested 50000 (share 25000), L2 requested 40000 (share 20000); decided COMMITTED; services started"
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /erate/eligible-services"
              payload: { funding_cycle_id: "${cyc}", service_description: "Dedicated Internet Access 1Gbps", category: "CATEGORY_ONE", service_type: "INTERNET_ACCESS" }
              as: ProgramAdmin
              captures: { es_c1: $.data.id }
            - call: "POST /erate/applicants"
              payload: { name: "Unified School District 7", entity_type: "SCHOOL", urban_rural: "URBAN", student_count: 1000 }
              as: ProgramAdmin
              captures: { app: $.data.id }
            - call: "POST /erate/nslp-snapshots"
              payload: { applicant_id: "${app}", funding_cycle_id: "${cyc}", total_students: 1000, free_lunch_eligible_students: 300, cep_participating: false }
              as: ProgramAdmin
            - call: "POST /erate/applicant-users"
              payload: { applicant_id: "${app}", display_name: "Casey Coordinator", function: "COORDINATOR" }
              as: ProgramAdmin
              captures: { u_coord: $.data.id }
            - call: "POST /erate/applicant-users"
              payload: { applicant_id: "${app}", display_name: "Ceri Certifier", function: "CERTIFIER" }
              as: ProgramAdmin
              captures: { u_cert: $.data.id }
            - call: "POST /erate/service-providers"
              payload: { name: "VendorOne", spin: "SPIN-001" }
              as: ProgramAdmin
              captures: { sp1: $.data.id }
            - call: "POST /erate/procurement-postings"
              payload:
                applicant_id: "${app}"
                funding_cycle_id: "${cyc}"
                category: "CATEGORY_ONE"
                description: "Internet access for FY2027"
                price_weight_pct: 60
                other_factor_weights:
                  - { factor_name: "LOCAL_SUPPORT", weight_pct: 20 }
                  - { factor_name: "EXPERIENCE", weight_pct: 20 }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { p_c1: $.data.id }
            - call: "POST /erate/procurement-postings/${p_c1}/publish"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
            - call: "POST /erate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /erate/bids"
              payload:
                posting_id: "${p_c1}"
                eligible_price_cents: 90000
                factor_scores:
                  - { factor_name: "LOCAL_SUPPORT", score: 80 }
                  - { factor_name: "EXPERIENCE", score: 90 }
              as: VendorRepresentative
              as_user_id: "${sp1}"
              captures: { b1: $.data.id }
            - call: "POST /erate/bids/${b1}/qualify"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
            - call: "POST /erate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-29T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /erate/procurement-postings/${p_c1}/close-window"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
            - call: "POST /erate/procurement-postings/${p_c1}/select-winner"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
            - call: "POST /erate/contracts"
              payload: { applicant_id: "${app}", service_provider_id: "${sp1}", posting_id: "${p_c1}", winning_bid_id: "${b1}", category: "CATEGORY_ONE", total_eligible_cents: 90000, service_start_date: "2027-04-01", service_end_date: "2028-03-31" }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { ct: $.data.id }
            - call: "POST /erate/contracts/${ct}/certify"
              payload: {}
              as: ApplicantCertifier
              as_user_id: "${u_cert}"
            - call: "POST /erate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /erate/funding-requests"
              payload: { applicant_id: "${app}", funding_cycle_id: "${cyc}" }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { rq: $.data.id }
            - call: "POST /erate/funding-request-lines"
              payload: { funding_request_id: "${rq}", contract_id: "${ct}", eligible_service_id: "${es_c1}", requested_pre_discount_cents: 50000 }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { l1: $.data.id }
            - call: "POST /erate/funding-request-lines"
              payload: { funding_request_id: "${rq}", contract_id: "${ct}", eligible_service_id: "${es_c1}", requested_pre_discount_cents: 40000 }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { l2: $.data.id }
            - call: "POST /erate/funding-requests/${rq}/certify"
              payload: {}
              as: ApplicantCertifier
              as_user_id: "${u_cert}"
            - call: "POST /erate/funding-requests/${rq}/begin-review"
              payload: {}
              as: PIAReviewer
              as_user_id: "usac-emp-9"
            - call: "POST /erate/funding-requests/${rq}/decide"
              payload: { outcome: "COMMITTED" }
              as: CommitmentOfficer
              as_user_id: "usac-emp-7"
            - call: "POST /erate/funding-requests/${rq}/service-start"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
          trigger:
            - call: "POST /erate/invoice-submissions"
              payload: { frn_line_id: "${l1}", method: "BEAR", gross_invoiced_cents: 40000, applicant_paid_cents: 30000 }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { inv_bear: $.data.id }
            - call: "POST /erate/invoice-submissions/${inv_bear}/begin-review"
              payload: {}
              as: InvoiceProcessor
              as_user_id: "usac-inv-1"
            - call: "POST /erate/invoice-submissions/${inv_bear}/approve"
              payload: {}
              as: InvoiceProcessor
              as_user_id: "usac-inv-1"
              captures: { bear_approved: $.data.approved_reimbursement_cents }
            - call: "POST /erate/invoice-submissions"
              payload: { frn_line_id: "${l2}", method: "SPI", gross_invoiced_cents: 40000 }
              as: VendorRepresentative
              as_user_id: "${sp1}"
              captures: { inv_spi: $.data.id }
            - call: "POST /erate/invoice-submissions/${inv_spi}/begin-review"
              payload: {}
              as: InvoiceProcessor
              as_user_id: "usac-inv-1"
            - call: "POST /erate/invoice-submissions/${inv_spi}/approve"
              payload: {}
              as: InvoiceProcessor
              as_user_id: "usac-inv-1"
              captures: { spi_approved: $.data.approved_reimbursement_cents }
          assert:
            - "bear_approved == 15000 (min(30000 paid, 40000 gross) * 50%)"
            - "spi_approved == 20000 (40000 gross * 50%; vendor-discounted bills ignore applicant payment)"
            - "bear_approved != spi_approved for identical gross_invoiced_cents and rate"

  - rule_id: combinatorial_formula
    instances:
      - name: bid_scoring_weighted_price_primary
        grounds:
          - calculations.winning_bid_score
          - entities.ProcurementPosting.fields.price_weight_pct
          - entities.Bid.fields.total_score
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: price_points is a ratio
          (lowest_price / bid_price * price_weight) summed with weight*score factor terms
          under the price-primary weight constraint. B1 (50,000 cents, factors 80/90)
          scores 82.00; B2 (40,000 cents, factors 60/60) scores 84.00 and wins despite
          weaker qualitative factors — the quadratic-ish price ratio, not factor quality,
          decides.
        test_recipe:
          setup:
            - "FY2027 cycle; applicant school; C1 posting with weights price=60, LOCAL_SUPPORT=20, EXPERIENCE=20"
            - "two bids inside the window: B1 50000 scores [80,90]; B2 40000 scores [60,60]; both QUALIFIED; window closed"
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /erate/applicants"
              payload: { name: "Unified School District 7", entity_type: "SCHOOL", urban_rural: "URBAN", student_count: 1000 }
              as: ProgramAdmin
              captures: { app: $.data.id }
            - call: "POST /erate/applicant-users"
              payload: { applicant_id: "${app}", display_name: "Casey Coordinator", function: "COORDINATOR" }
              as: ProgramAdmin
              captures: { u_coord: $.data.id }
            - call: "POST /erate/service-providers"
              payload: { name: "VendorOne", spin: "SPIN-001" }
              as: ProgramAdmin
              captures: { sp1: $.data.id }
            - call: "POST /erate/service-providers"
              payload: { name: "VendorTwo", spin: "SPIN-002" }
              as: ProgramAdmin
              captures: { sp2: $.data.id }
            - call: "POST /erate/procurement-postings"
              payload:
                applicant_id: "${app}"
                funding_cycle_id: "${cyc}"
                category: "CATEGORY_ONE"
                description: "Internet access for FY2027"
                price_weight_pct: 60
                other_factor_weights:
                  - { factor_name: "LOCAL_SUPPORT", weight_pct: 20 }
                  - { factor_name: "EXPERIENCE", weight_pct: 20 }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { p1: $.data.id }
            - call: "POST /erate/procurement-postings/${p1}/publish"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
            - call: "POST /erate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /erate/bids"
              payload:
                posting_id: "${p1}"
                eligible_price_cents: 50000
                factor_scores:
                  - { factor_name: "LOCAL_SUPPORT", score: 80 }
                  - { factor_name: "EXPERIENCE", score: 90 }
              as: VendorRepresentative
              as_user_id: "${sp1}"
              captures: { b1: $.data.id }
            - call: "POST /erate/bids"
              payload:
                posting_id: "${p1}"
                eligible_price_cents: 40000
                factor_scores:
                  - { factor_name: "LOCAL_SUPPORT", score: 60 }
                  - { factor_name: "EXPERIENCE", score: 60 }
              as: VendorRepresentative
              as_user_id: "${sp2}"
              captures: { b2: $.data.id }
            - call: "POST /erate/bids/${b1}/qualify"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
            - call: "POST /erate/bids/${b2}/qualify"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
            - call: "POST /erate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-29T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /erate/procurement-postings/${p1}/close-window"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
          trigger:
            - call: "POST /erate/procurement-postings/${p1}/select-winner"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { winner: $.data.selected_bid_id }
            - call: "GET /erate/bids/${b1}"
              payload: {}
              as: Any
              captures: { b1_score: $.data.total_score, b1_status: $.data.status }
            - call: "GET /erate/bids/${b2}"
              payload: {}
              as: Any
              captures: { b2_score: $.data.total_score, b2_status: $.data.status }
          assert:
            - "b1_score == 82.0 (price_points round_half_up(40000/50000*60,2)=48.00 + 20*80/100=16.00 + 20*90/100=18.00)"
            - "b2_score == 84.0 (price_points 60.00 + 12.00 + 12.00)"
            - "winner == ${b2} and b2_status == SELECTED and b1_status == NOT_SELECTED"

      - name: commitment_per_line_rounding_then_sum
        grounds:
          - calculations.frn_line_commitment
          - entities.FundingRequest.fields.committed_total_share_cents
          - entities.FundingRequestLine.fields.committed_share_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the scaffold pins
          round-per-line-then-sum. Two 999-cent C2 lines at 50% yield 500 + 500 = 1000
          per-line, whereas summing first (1998 * 0.5 = 999) yields 999 — a 1-cent delta
          the request total must expose.
        test_recipe:
          setup:
            - "FY2027; school applicant 1000 students with direct snapshot (C2 rate 50%, C2 cap 16,700,000)"
            - "C2 contract CERTIFIED total_eligible_cents 100000; request with two C2 lines of 999 cents each, certified in window, in PIA_REVIEW"
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /erate/eligible-services"
              payload: { funding_cycle_id: "${cyc}", service_description: "Wireless Access Points", category: "CATEGORY_TWO", service_type: "INTERNAL_CONNECTIONS" }
              as: ProgramAdmin
              captures: { es_c2: $.data.id }
            - call: "POST /erate/applicants"
              payload: { name: "Unified School District 7", entity_type: "SCHOOL", urban_rural: "URBAN", student_count: 1000 }
              as: ProgramAdmin
              captures: { app: $.data.id }
            - call: "POST /erate/nslp-snapshots"
              payload: { applicant_id: "${app}", funding_cycle_id: "${cyc}", total_students: 1000, free_lunch_eligible_students: 300, cep_participating: false }
              as: ProgramAdmin
            - call: "POST /erate/applicant-users"
              payload: { applicant_id: "${app}", display_name: "Casey Coordinator", function: "COORDINATOR" }
              as: ProgramAdmin
              captures: { u_coord: $.data.id }
            - call: "POST /erate/applicant-users"
              payload: { applicant_id: "${app}", display_name: "Ceri Certifier", function: "CERTIFIER" }
              as: ProgramAdmin
              captures: { u_cert: $.data.id }
            - call: "POST /erate/service-providers"
              payload: { name: "VendorOne", spin: "SPIN-001" }
              as: ProgramAdmin
              captures: { sp1: $.data.id }
            - call: "POST /erate/procurement-postings"
              payload: { applicant_id: "${app}", funding_cycle_id: "${cyc}", category: "CATEGORY_TWO", description: "Internal connections", price_weight_pct: 100, other_factor_weights: [] }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { p_c2: $.data.id }
            - call: "POST /erate/procurement-postings/${p_c2}/publish"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
            - call: "POST /erate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /erate/bids"
              payload: { posting_id: "${p_c2}", eligible_price_cents: 100000, factor_scores: [] }
              as: VendorRepresentative
              as_user_id: "${sp1}"
              captures: { b1: $.data.id }
            - call: "POST /erate/bids/${b1}/qualify"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
            - call: "POST /erate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-29T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /erate/procurement-postings/${p_c2}/close-window"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
            - call: "POST /erate/procurement-postings/${p_c2}/select-winner"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
            - call: "POST /erate/contracts"
              payload: { applicant_id: "${app}", service_provider_id: "${sp1}", posting_id: "${p_c2}", winning_bid_id: "${b1}", category: "CATEGORY_TWO", total_eligible_cents: 100000, service_start_date: "2027-04-01", service_end_date: "2028-03-31" }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { ct: $.data.id }
            - call: "POST /erate/contracts/${ct}/certify"
              payload: {}
              as: ApplicantCertifier
              as_user_id: "${u_cert}"
            - call: "POST /erate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /erate/funding-requests"
              payload: { applicant_id: "${app}", funding_cycle_id: "${cyc}" }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { rq: $.data.id }
            - call: "POST /erate/funding-request-lines"
              payload: { funding_request_id: "${rq}", contract_id: "${ct}", eligible_service_id: "${es_c2}", requested_pre_discount_cents: 999 }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { l1: $.data.id }
            - call: "POST /erate/funding-request-lines"
              payload: { funding_request_id: "${rq}", contract_id: "${ct}", eligible_service_id: "${es_c2}", requested_pre_discount_cents: 999 }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { l2: $.data.id }
            - call: "POST /erate/funding-requests/${rq}/certify"
              payload: {}
              as: ApplicantCertifier
              as_user_id: "${u_cert}"
            - call: "POST /erate/funding-requests/${rq}/begin-review"
              payload: {}
              as: PIAReviewer
              as_user_id: "usac-emp-9"
          trigger:
            - call: "POST /erate/funding-requests/${rq}/decide"
              payload: { outcome: "COMMITTED" }
              as: CommitmentOfficer
              as_user_id: "usac-emp-7"
              captures: { total_share: $.data.committed_total_share_cents }
            - call: "GET /erate/funding-request-lines/${l1}"
              payload: {}
              as: Any
              captures: { l1_share: $.data.committed_share_cents }
            - call: "GET /erate/funding-request-lines/${l2}"
              payload: {}
              as: Any
              captures: { l2_share: $.data.committed_share_cents }
          assert:
            - "l1_share == 500 (round_half_up(999 * 50 / 100) = round_half_up(499.5) = 500)"
            - "l2_share == 500"
            - "total_share == 1000 (per-line-then-sum; sum-then-round would give 999)"

      - name: c2_budget_created_at_allocation_order
        grounds:
          - calculations.c2_budget_allocation_order
          - calculations.category_two_budget_cap
          - entities.FundingRequestLine.fields.committed_pre_discount_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: a line's
          commitment depends on budget remaining, while budget remaining is cap minus
          committed lines. The scaffold pins created_at ASC waterfall against a
          decrementing remainder: L1 (10,000,000, created first) commits in full; L2
          (8,000,000, created second) is capped at 6,700,000 = 16,700,000 - 10,000,000.
        test_recipe:
          setup:
            - "FY2027; school applicant 1000 students, direct snapshot (C2 cap 16,700,000; C2 rate 50%)"
            - "C2 contract CERTIFIED total 18,000,000; request in PIA_REVIEW with C2 lines L1 10,000,000 then L2 8,000,000 (created in that order)"
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
