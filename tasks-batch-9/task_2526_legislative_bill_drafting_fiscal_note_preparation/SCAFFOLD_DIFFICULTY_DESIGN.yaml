  - rule_id: non_linear_state_machine
    instances:

      - name: bill_fiscal_status_cycles_note_complete_stale_complete_while_legislative_status_holds_reported
        grounds:
          - state_machines.Bill.fiscal_status.NOTE_PENDING_to_NOTE_COMPLETE
          - state_machines.Bill.fiscal_status.NOTE_COMPLETE_to_NOTE_STALE
          - state_machines.Bill.fiscal_status.NOTE_STALE_to_NOTE_COMPLETE
          - state_machines.Bill.legislative_status.REFERRED_to_REPORTED
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Bill carries TWO independent state dimensions and the fiscal one is
          cyclic: fiscal_status walks NOTE_PENDING -> NOTE_COMPLETE -> NOTE_STALE ->
          NOTE_COMPLETE (re-entering a state it already left) while
          legislative_status stays pinned at REPORTED for the whole walk. Neither
          dimension is derivable from the other, and the second NOTE_COMPLETE is
          reached by a different trigger set than the first.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; CONVENED session, required_fiscal_years [2027, 2028], constrained_threshold_cents 50000000, fiscal_cap_cents 200000000, fiscal_note_default_days 21."
