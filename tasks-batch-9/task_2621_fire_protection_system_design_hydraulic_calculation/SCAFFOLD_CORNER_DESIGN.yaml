          - validations[priority=27]
          - calculations.project_design_posture
          - errors.ERR_PROJECT_POSTURE_GATED
          - errors.ERR_DRAWING_NOT_ISSUED
          - state_machines.ReviewComment.OPEN_to_WITHDRAWN
