# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Repair Café & Fix-It Clinic — 9 rules, 19 instances (rule 2 has 3)
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: diversion_kg_verified_vs_projected
        grounds:
          - calculations.diversion_kg
          - entities.RepairEvent.fields.diversion_kg_verified
          - entities.RepairEvent.fields.diversion_kg_projected
        distinguishing_aspect: |
          Same outcome data on the RepairEvent domain: the verified variant counts only
          VERIFIED outcomes while the projected variant additionally counts RECORDED
          (unverified) outcomes — with one FIXED outcome left unverified the two fields
          MUST differ (4.2 vs 9.2).
        test_recipe:
          setup:
            - "Event INTAKE_OPEN with posture ACCEPTING: one OPEN ELECTRONICS station, one checked-in fixer F (skill ELECTRONICS level 4)"
            - "item1 FIXED actual 3.2 kg, VERIFIED; item2 PARTIALLY_FIXED actual 2.0 kg, VERIFIED; item3 FIXED actual 5.0 kg, still RECORDED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Alpha", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
            # item1 -> VERIFIED FIXED 3.2
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Toaster dead", weight_kg_estimated: 3.0 }, as: IntakeVolunteer, captures: { it1: $.data.id, it1v: $.data.version } }
            - { call: "POST /api/repair-items/${it1}/triage-records", payload: { severity: 3, estimated_difficulty: 2, diagnosis: "fuse", expected_item_version: "${it1v}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it1}/enqueue", as: Coordinator }
            - { call: "POST /api/repair-items/${it1}/assign", payload: {}, as: Coordinator }
            - { call: "POST /api/repair-items/${it1}/start-repair", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it1}/outcomes", payload: { outcome: "FIXED", weight_kg_actual: 3.2 }, as: Fixer, as_user_id: "${fx}", captures: { oc1: $.data.id } }
            - { call: "POST /api/repair-outcomes/${oc1}/verify", as: Coordinator }
            # item2 -> VERIFIED PARTIALLY_FIXED 2.0
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Radio static", weight_kg_estimated: 2.5 }, as: IntakeVolunteer, captures: { it2: $.data.id, it2v: $.data.version } }
            - { call: "POST /api/repair-items/${it2}/triage-records", payload: { severity: 2, estimated_difficulty: 1, diagnosis: "loose wire", expected_item_version: "${it2v}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it2}/enqueue", as: Coordinator }
            - { call: "POST /api/repair-items/${it2}/assign", payload: {}, as: Coordinator }
            - { call: "POST /api/repair-items/${it2}/start-repair", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it2}/outcomes", payload: { outcome: "PARTIALLY_FIXED", weight_kg_actual: 2.0 }, as: Fixer, as_user_id: "${fx}", captures: { oc2: $.data.id } }
            - { call: "POST /api/repair-outcomes/${oc2}/verify", as: Coordinator }
            # item3 -> RECORDED FIXED 5.0 (unverified)
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Laptop no power", weight_kg_estimated: 4.0 }, as: IntakeVolunteer, captures: { it3: $.data.id, it3v: $.data.version } }
            - { call: "POST /api/repair-items/${it3}/triage-records", payload: { severity: 4, estimated_difficulty: 3, diagnosis: "psu", expected_item_version: "${it3v}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it3}/enqueue", as: Coordinator }
            - { call: "POST /api/repair-items/${it3}/assign", payload: {}, as: Coordinator }
            - { call: "POST /api/repair-items/${it3}/start-repair", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it3}/outcomes", payload: { outcome: "FIXED", weight_kg_actual: 5.0 }, as: Fixer, as_user_id: "${fx}" }
          trigger:
            - { call: "GET /api/repair-events/${ev}", as: Coordinator }
          assert:
            - "RepairEvent.${ev}.diversion_kg_verified == 4.2 (3.2 + 0.5*2.0; item3 excluded as unverified)"
            - "RepairEvent.${ev}.diversion_kg_projected == 9.2 (4.2 + 5.0; RECORDED outcome included)"
            - "diversion_kg_verified != diversion_kg_projected"

      - name: donation_receipt_vs_campaign_value
        grounds:
          - calculations.donation_receipt_value
          - entities.Donation.fields.receipt_value_cents
          - entities.Donation.fields.campaign_value_cents
        distinguishing_aspect: |
          Same Donation rows, Donation domain (distinct from the RepairOutcome/Event
          diversion domain): receipt value uses per-line depreciated rounding while
          campaign value uses 2x matching inside the event window / full declared value —
          both donations MUST show different values on the two fields.
        test_recipe:
          setup:
            - "Clock 2026-06-01T09:00:00Z; event window 2026-06-01T08:00:00Z..16:00:00Z"
            - "d1: MONETARY 5000 cents linked to the event, RECEIVED inside the window"
            - "d2: IN_KIND with lines [999c age 3, 501c age 3], RECEIVED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Beta", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/donations", payload: { donation_type: "MONETARY", event_id: "${ev}", amount_cents: 5000 }, as: IntakeVolunteer, captures: { d1: $.data.id } }
            - { call: "POST /api/donations/${d1}/receive", as: IntakeVolunteer }
            - { call: "POST /api/donations", payload: { donation_type: "IN_KIND", event_id: "${ev}", in_kind_lines: [ { description: "lamp", category: "ELECTRONICS", declared_value_cents: 999, age_years: 3 }, { description: "cable", category: "ELECTRONICS", declared_value_cents: 501, age_years: 3 } ] }, as: IntakeVolunteer, captures: { d2: $.data.id } }
            - { call: "POST /api/donations/${d2}/receive", as: IntakeVolunteer }
          trigger:
            - { call: "GET /api/donations/${d1}", as: Coordinator }
            - { call: "GET /api/donations/${d2}", as: Coordinator }
          assert:
            - "Donation.${d1}.receipt_value_cents == 5000"
            - "Donation.${d1}.campaign_value_cents == 10000 (2x match inside event window)"
            - "Donation.${d2}.receipt_value_cents == 751 (per-line round_half_up: 500 + 251)"
            - "Donation.${d2}.campaign_value_cents == 1500 (full declared value)"

  - rule_id: combinatorial_formula
    instances:
      - name: triage_priority_weighted_scoring_with_clamp
        grounds:
          - calculations.triage_priority_score
          - entities.RepairItem.fields.priority_score
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction (category base + 8*severity
          + 2*difficulty + conditional hazard bonus, clamped by min/max): ordinary inputs
          give 38; extreme inputs give the clamped 100, proving the conditional branch
          and the clamp.
        test_recipe:
          setup:
            - "Event INTAKE_OPEN with posture ACCEPTING; fixer F checked in; visitor with safety-clause waiver"
            - "item1: ELECTRONICS, hazard false; item2: ELECTRONICS, hazard true"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Gamma", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 5 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Toaster", weight_kg_estimated: 3.0 }, as: IntakeVolunteer, captures: { it1: $.data.id, it1v: $.data.version } }
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Mains heater", hazard_flag: true, weight_kg_estimated: 6.0 }, as: IntakeVolunteer, captures: { it2: $.data.id, it2v: $.data.version } }
          trigger:
            - { call: "POST /api/repair-items/${it1}/triage-records", payload: { severity: 3, estimated_difficulty: 2, diagnosis: "fuse", expected_item_version: "${it1v}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it2}/triage-records", payload: { severity: 10, estimated_difficulty: 5, diagnosis: "cracked element", expected_item_version: "${it2v}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "GET /api/repair-items/${it1}", as: Coordinator }
            - { call: "GET /api/repair-items/${it2}", as: Coordinator }
            - { call: "GET /api/safety-incidents?item_id=${it2}", as: Coordinator }
          assert:
            - "RepairItem.${it1}.priority_score == 38 (10 + 8*3 + 2*2 + 0)"
            - "RepairItem.${it2}.priority_score == 100 (raw 10 + 80 + 10 + 15 = 115 clamped)"
            - "RepairItem.${it2} triage auto-created exactly 1 SafetyIncident with severity CRITICAL and status REPORTED"
      - name: donation_receipt_per_line_rounding_order
        grounds:
          - calculations.donation_receipt_value
          - entities.Donation.fields.receipt_value_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters and the scaffold pins round-per-
          line-THEN-sum: lines 999c and 501c at 0.5 multiplier give 500 + 251 = 751, while
          the sum-then-round order would give round(1500*0.5) = 750.
        test_recipe:
          setup: ["IN_KIND donation with two lines: 999c age 3 and 501c age 3, RECEIVED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/donations", payload: { donation_type: "IN_KIND", in_kind_lines: [ { description: "lamp", category: "ELECTRONICS", declared_value_cents: 999, age_years: 3 }, { description: "cable", category: "ELECTRONICS", declared_value_cents: 501, age_years: 3 } ] }, as: IntakeVolunteer, captures: { d2: $.data.id } }
          trigger:
            - { call: "POST /api/donations/${d2}/receive", as: IntakeVolunteer }
          assert:
            - "Donation.${d2}.receipt_value_cents == 751 (NOT 750 — per-line rounding pinned)"
      - name: suggested_donation_circular_order_pinned
        grounds:
          - calculations.suggested_donation
          - entities.RepairOutcome.fields.suggested_donation_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency (recovery-rate tier keyed on job size
          while the total includes the parts share) resolved by the pinned evaluation
          order: rate keyed on category base (1500c ELECTRONICS -> 0.75), NOT on the
          total; with parts_cost 800c the result is exactly 1500 + round_half_up(800*0.75) = 2100.
        test_recipe:
          setup:
            - "Event INTAKE_OPEN; fixer F checked in; item IN_REPAIR with fixer F"
            - "PartStock unit_cost 400 on_hand 5; reservation of 2 units COMMITTED to the item (parts_cost 800)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Delta", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Toaster", weight_kg_estimated: 3.0 }, as: IntakeVolunteer, captures: { it: $.data.id, itv: $.data.version } }
            - { call: "POST /api/repair-items/${it}/triage-records", payload: { severity: 3, estimated_difficulty: 2, diagnosis: "fuse", expected_item_version: "${itv}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/enqueue", as: Coordinator }
            - { call: "POST /api/repair-items/${it}/assign", payload: {}, as: Coordinator }
            - { call: "POST /api/repair-items/${it}/start-repair", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/part-stocks", payload: { sku: "FUSE-10A", name: "10A fuse", category: "ELECTRONICS", unit_cost_cents: 400, quantity_on_hand: 5 }, as: Coordinator, captures: { stk: $.data.id } }
            - { call: "POST /api/part-reservations", payload: { part_stock_id: "${stk}", repair_item_id: "${it}", quantity: 2 }, as: Fixer, as_user_id: "${fx}", captures: { rs: $.data.id } }
            - { call: "POST /api/part-reservations/${rs}/commit", as: Fixer, as_user_id: "${fx}" }
          trigger:
            - { call: "POST /api/repair-items/${it}/outcomes", payload: { outcome: "FIXED", weight_kg_actual: 3.0 }, as: Fixer, as_user_id: "${fx}", captures: { oc: $.data.id } }
          assert:
            - "RepairOutcome.${oc}.parts_cost_cents == 800"
            - "RepairOutcome.${oc}.suggested_donation_cents == 2100 (base 1500 keyed tier 0.75; share 600)"

  - rule_id: non_linear_state_machine
    instances:
      - name: repair_item_cycle_return_reassign_reopen
        grounds:
          - state_machines.RepairItem.IN_REPAIR_to_QUEUED
          - state_machines.RepairItem.OUTCOME_RECORDED_to_QUEUED
          - state_machines.RepairItem.TRIAGED_to_TRIAGED
        distinguishing_aspect: |
          RepairItem is cyclic: IN_REPAIR -> QUEUED -> ASSIGNED -> IN_REPAIR loops and an
          OUTCOME_RECORDED (NOT_REPAIRABLE) -> QUEUED second-opinion reopen; the full
          loop MUST drive version to exactly 10 with assigned fields cleared on each
          return.
        test_recipe:
          setup:
            - "Event INTAKE_OPEN; fixer F checked in; item progressed to IN_REPAIR, then returned, reassigned, repaired, NOT_REPAIRABLE outcome, reopened"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Epsilon", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Dead TV", weight_kg_estimated: 8.0 }, as: IntakeVolunteer, captures: { it: $.data.id, itv: $.data.version } }
            - { call: "POST /api/repair-items/${it}/triage-records", payload: { severity: 5, estimated_difficulty: 3, diagnosis: "board", expected_item_version: "${itv}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/enqueue", as: Coordinator }
            - { call: "POST /api/repair-items/${it}/assign", payload: {}, as: Coordinator }
            - { call: "POST /api/repair-items/${it}/start-repair", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/return-to-queue", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/assign", payload: {}, as: Coordinator }
            - { call: "POST /api/repair-items/${it}/start-repair", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/outcomes", payload: { outcome: "NOT_REPAIRABLE" }, as: Fixer, as_user_id: "${fx}" }
          trigger:
            - { call: "POST /api/repair-items/${it}/reopen", as: Coordinator }
            - { call: "GET /api/repair-items/${it}", as: Coordinator }
          assert:
            - "RepairItem.${it}.status == QUEUED (second-opinion reopen from OUTCOME_RECORDED)"
            - "RepairItem.${it}.version == 10 (create, triage, enqueue, assign, start, return, assign, start, outcome, reopen)"
            - "RepairItem.${it}.assigned_fixer_id == null and assigned_station_id == null"
      - name: station_open_pause_cycle_with_auto_pause
        grounds:
          - state_machines.Station.OPEN_to_PAUSED
          - state_machines.Station.PAUSED_to_OPEN
        distinguishing_aspect: |
          Station is cyclic on a different entity than RepairItem: OPEN -> PAUSED -> OPEN
          by coordinator action, plus an automatic OPEN -> PAUSED when the last
          checked-in fixer checks out (compound side effect on the station seat count).
        test_recipe:
          setup: ["Event INTAKE_OPEN; station S OPEN with fixer F checked in (only fixer)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
