# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
#   Taxonomy: references/claim-extraction-guide.md, whose nine sections are the
#   `section:` values and whose per-section rows are the `claim_type:` values.
#   Instances 1..N below are ordered by section; §1.8-covered corners appear as
#   excluded_because stubs with no test_recipe.
#
# Order-independent handling of test_recipe chains
# ------------------------------------------------
# setup_api_calls entries and trigger entries are both step TYPES and may be
# interleaved by the caller in any order, so setup prose alone cannot pin an
# observable snapshot wherever a cascade is involved. Every recipe that exposes a
# cascade therefore pins ordered read pseudo-calls (a `GET` `call:` with no `as:`
# key) at each position where a distinct snapshot must be compared; the assert
# lines name the read position they belong to.
# =============================================================================

scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:

      - name: store_creation_returns_all_declared_fields_and_defaults
        claim_type: creation
        grounds:
          - entities.Store.fields
          - entities.Store.fields.dwell_capacity_minutes
          - entities.Store.fields.attraction_posture
        distinguishing_aspect: "POST /stores with the five required inputs returns 201 and a Store whose computed and system fields are initialised rather than echoed from the request."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          assert:
            - "Store.${st_id}.name == \"Ozark Flagship\" and Store.${st_id}.state_code == \"MO\""
            - "Store.${st_id}.dwell_committed_minutes == 0 and Store.${st_id}.dwell_free_minutes == 60000"
            - "Store.${st_id}.attraction_posture == OPEN, the computed default, not a client-supplied value"
            - "Store.${st_id}.remit_ledger_cents == 0 and Store.${st_id}.permit_remit_epoch == 0"
            - "Store.${st_id}.version == 1 and Store.${st_id}.id matches the UUID form with no type prefix"

      - name: store_retrieval_and_listing_paginate
        claim_type: listing
        grounds:
          - entities.Store.fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /stores returns the pagination envelope with total_count and has_more, and GET /stores/{store_id} returns the same body for one row."
        test_recipe:
          setup: ["two stores exist"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st1_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Delta Landing", state_code: "AR", dealer_license_no: "AR-DLR-1180", dwell_capacity_minutes: 45000, load_bays_total: 2 }
              as: PlatformAdmin
              captures: { st2_id: $.data.id }
          trigger:
            - call: "GET /stores?limit=1"
              as: PlatformAdmin
            - call: "GET /stores/${st2_id}"
              as: PlatformAdmin
          assert:
            - "the list response reports total_count == 2 and has_more == true for limit 1 with offset 0"
            - "the list data array has exactly 1 element"
            - "GET /stores/${st2_id} returns Store.${st2_id}.name == \"Delta Landing\" and state_code == \"AR\""

      - name: missing_store_id_returns_store_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_STORE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A well-formed but unknown store UUID on any store-scoped route returns ERR_STORE_NOT_FOUND with 404, before any body validation runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /stores/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is data.error_id == ERR_STORE_NOT_FOUND with http 404"
            - "the response_type is \\\"error\\\" and the data object carries no entity fields"

      - name: boat_unit_required_fields_and_missing_hull_id_rejected
        claim_type: required_fields
        grounds:
          - entities.BoatUnit.fields.hull_id_no
          - entities.BoatUnit.fields.stock_no
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required hull_id_no while supplying every other field returns ERR_INVALID_REQUEST, and no BoatUnit row is created."
        test_recipe:
          setup: ["one store"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-9001", model_name: "Angler 190", unit_price_cents: 9000000, unit_condition: "NEW" }
              as: DealDeskClerk
              captures: { err: $.data.error_id }
            - call: "GET /stores/boat-units?store_id=${st_id}"
              as: DealDeskClerk
          assert:
            - "the create is rejected with data.error_id == ERR_INVALID_REQUEST and http 400"
            - "the follow-up list returns total_count == 0, so the rejected unit left no row"

      - name: boat_unit_condition_defaults_and_optional_prices
        claim_type: defaults
        grounds:
          - entities.BoatUnit.fields.motor_price_cents
          - entities.BoatUnit.fields.trailer_price_cents
        distinguishing_aspect: "Omitting motor_price_cents and trailer_price_cents yields 0 on both rather than null, so a bare hull can be priced without the fields."
        test_recipe:
          setup: ["one store"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-HULL", model_name: "Bare 140", unit_price_cents: 1500000, unit_condition: "NEW", hull_id_no: "HINBARE000001" }
              as: DealDeskClerk
              captures: { bu_id: $.data.id }
          assert:
            - "BoatUnit.${bu_id}.motor_price_cents == 0 and BoatUnit.${bu_id}.trailer_price_cents == 0"
            - "BoatUnit.${bu_id}.prior_title_no == null and BoatUnit.${bu_id}.status == AVAILABLE"

      - name: attraction_requires_waiver_is_computed_not_client_supplied
        claim_type: computed_fields
        grounds:
          - entities.Attraction.fields.requires_waiver
          - entities.Attraction.fields.in_use_units
        distinguishing_aspect: "requires_waiver is derived from attraction_type, so an AQUARIUM reads false and an ARCHERY_RANGE reads true even when a client tries to supply the value."
        test_recipe:
          setup: ["one store"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 40, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { aq_id: $.data.id }
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "ARCHERY_RANGE", capacity_units: 12, dwell_cost_minutes: 45 }
              as: StoreManager
              captures: { ar_id: $.data.id }
          assert:
            - "Attraction.${aq_id}.requires_waiver == false and Attraction.${aq_id}.in_use_units == 0"
            - "Attraction.${ar_id}.requires_waiver == true, derived from attraction_type rather than from any request field"
            - "both attractions start in Attraction.status == PLANNED"

      - name: member_email_uniqueness_is_scoped_to_the_home_store
        claim_type: type_constraints
        grounds:
          - errors[ERR_DUPLICATE_MEMBER_EMAIL]
          - entities.Member.fields.email
        distinguishing_aspect: "The same email is accepted at a second store but rejected at the original store, so uniqueness is store-scoped rather than global."
        test_recipe:
          setup: ["two stores"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st1_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Delta Landing", state_code: "AR", dealer_license_no: "AR-DLR-1180", dwell_capacity_minutes: 45000, load_bays_total: 2 }
              as: PlatformAdmin
              captures: { st2_id: $.data.id }
            - call: "POST /stores/${st1_id}/members"
              payload: { email: "dup@x.com", full_name: "First Row", donation_opt_in: false }
              as: Anonymous
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /stores/${st1_id}/members"
              payload: { email: "dup@x.com", full_name: "Second Row", donation_opt_in: false }
              as: Anonymous
              captures: { err: $.data.error_id }
            - call: "POST /stores/${st2_id}/members"
              payload: { email: "dup@x.com", full_name: "Third Row", donation_opt_in: false }
              as: Anonymous
              captures: { m2_id: $.data.id }
          assert:
            - "the duplicate at the original store is rejected with data.error_id == ERR_DUPLICATE_MEMBER_EMAIL and http 409"
            - "the identical email at the second store is accepted: Member.${m2_id}.email == \"dup@x.com\" with a new id"
            - "Member.${m2_id}.id != Member.${m1_id}.id"

      - name: boat_unit_stock_and_hin_uniqueness_within_store
        claim_type: type_constraints
        grounds:
          - errors[ERR_DUPLICATE_STOCK_NO]
          - errors[ERR_DUPLICATE_HIN]
          - validations[priority=15]
        distinguishing_aspect: "stock_no and hull_id_no each hold store-scoped uniqueness, and the two violations surface with different error ids on separate attempts."
        test_recipe:
          setup: ["one store with one boat unit"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-9001", model_name: "Angler 190", unit_price_cents: 9000000, unit_condition: "NEW", hull_id_no: "HIN9001AA000" }
              as: DealDeskClerk
              captures: { bu_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-9001", model_name: "Angler 210", unit_price_cents: 11000000, unit_condition: "NEW", hull_id_no: "HIN9002AA000" }
              as: DealDeskClerk
              captures: { err: $.data.error_id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-9002", model_name: "Angler 210", unit_price_cents: 11000000, unit_condition: "NEW", hull_id_no: "HIN9001AA000" }
              as: DealDeskClerk
              captures: { err2: $.data.error_id }
          assert:
            - "the reused stock number is rejected with data.error_id == ERR_DUPLICATE_STOCK_NO and http 409"
            - "the reused HIN with a fresh stock number is rejected with data.error_id == ERR_DUPLICATE_HIN and http 409"
            - "BoatUnit.${bu_id} is unchanged and the unit count for the store remains 1"

      - name: point_event_appended_rows_are_immutable
        claim_type: immutability
        grounds:
          - entities.PointEvent.fields
          - entities.PointEvent.fields.created_seq
        distinguishing_aspect: "PointEvent is an append-only ledger row reached only through its creation and read routes, so no update route exists and created_seq is a server-assigned monotone value."
        test_recipe:
          setup: ["one store and one member"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_im@x.com", full_name: "Iris Mott", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "AWARD", points_delta: 100 }
              as: ClubCardSpecialist
              captures: { pe1_id: $.data.id, pe1_seq: $.data.created_seq }
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "AWARD", points_delta: 100 }
              as: ClubCardSpecialist
              captures: { pe2_id: $.data.id, pe2_seq: $.data.created_seq }
          assert:
            - "PointEvent.${pe1_id}.created_seq is a server-assigned integer and PointEvent.${pe2_id}.created_seq > PointEvent.${pe1_id}.created_seq"
            - "PointEvent.${pe1_id}.points_delta == 100 and PointEvent.${pe1_id}.event_kind == AWARD as supplied"
            - "PointEvent.${pe1_id}.id != PointEvent.${pe2_id}.id"
            - "there is no PUT or PATCH route for point events, so the first row's fields cannot be rewritten"

      - name: attraction_session_requires_existing_attraction
        claim_type: parent_relationships
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=4]
          - entities.AttractionSession.fields.attraction_id
        distinguishing_aspect: "An unknown attraction_id returns ERR_RESOURCE_NOT_FOUND with 404 rather than a business error, and an attraction belonging to a different store returns ERR_PARENT_MISMATCH."
        test_recipe:
          setup: ["two stores, each with one attraction"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st1_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Delta Landing", state_code: "AR", dealer_license_no: "AR-DLR-1180", dwell_capacity_minutes: 45000, load_bays_total: 2 }
              as: PlatformAdmin
              captures: { st2_id: $.data.id }
            - call: "POST /stores/${st1_id}/members"
              payload: { email: "m_pr@x.com", full_name: "Pax Rill", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st2_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 20, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at2_id: $.data.id }
          trigger:
            - call: "POST /stores/${st1_id}/attraction-sessions"
              payload: { attraction_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 2, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { err: $.data.error_id }
            - call: "POST /stores/${st1_id}/attraction-sessions"
              payload: { attraction_id: "${at2_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 2, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { err2: $.data.error_id }
          assert:
            - "the unknown attraction id is rejected with data.error_id == ERR_RESOURCE_NOT_FOUND and http 404"
            - "the real attraction that belongs to the other store is rejected with data.error_id == ERR_PARENT_MISMATCH and http 404"
            - "neither rejection created an AttractionSession row"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: attraction_session_initial_state_is_requested
        claim_type: initial_state
        grounds:
          - state_machines.AttractionSession.initial_state
          - state_machines.AttractionSession.transitions.REQUESTED_to_CONFIRMED
        distinguishing_aspect: "A session is created in REQUESTED and settles to CONFIRMED within the same request rather than being created straight into CONFIRMED."
        test_recipe:
          setup: ["a store with an open aquarium venue and one member"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 20, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_is@x.com", full_name: "Isla Reed", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 2, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { s_id: $.data.id }
          assert:
            - "AttractionSession.${s_id}.status == CONFIRMED, the settled state the REQUESTED initial state resolves to"
            - "AttractionSession.${s_id}.dwell_charge_minutes == 120"
            - "Attraction.${at_id}.in_use_units == 2, so the confirmation consumed capacity"

      - name: check_in_from_requested_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.AttractionSession.transitions.REQUESTED_to_CONFIRMED
          - state_machines.AttractionSession.transitions.CONFIRMED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Checking in a session that is still REQUESTED never happens through the API because requesting always settles, so the probe is a session driven straight to WAITLIST_FALLBACK and asked to check in."
        test_recipe:
          setup: ["a store with a capacity-1 aquarium venue and two members"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 1, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_it1@x.com", full_name: "Ivy Tarr", donation_opt_in: false }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_it2@x.com", full_name: "Ian Tarr", donation_opt_in: false }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m1_id}", session_kind: "GENERAL_ADMISSION", party_size: 1, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { s1_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m2_id}", session_kind: "GENERAL_ADMISSION", party_size: 1, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /stores/attraction-sessions/${s2_id}/check-in"
              payload: {}
              as: AttractionHost
              captures: { err: $.data.error_id }
          assert:
            - "AttractionSession.${s2_id}.status == WAITLIST_FALLBACK before the check-in, so the state is the waitlist branch"
            - "the check-in is rejected with data.error_id == ERR_INVALID_STATE and http 409"
            - "AttractionSession.${s2_id}.status remains WAITLIST_FALLBACK and Attraction.${at_id}.in_use_units is still 1"

      - name: cancelled_session_cannot_be_cancelled_again
        claim_type: invalid_transition
        grounds:
          - state_machines.AttractionSession.terminal_states
          - state_machines.AttractionSession.transitions.CONFIRMED_to_CANCELLED
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "CANCELLED is a terminal state, so a second cancel returns ERR_ALREADY_TERMINAL and releases no capacity twice."
        test_recipe:
          setup: ["a store with an open aquarium venue, one member and one confirmed session"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 20, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_tt@x.com", full_name: "Tess Toll", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 3, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { s_id: $.data.id }
            - call: "POST /stores/attraction-sessions/${s_id}/cancel"
              payload: {}
              as: AttractionHost
          trigger:
            - call: "POST /stores/attraction-sessions/${s_id}/cancel"
              payload: {}
              as: AttractionHost
              captures: { err: $.data.error_id }
            - call: "GET /stores/sessions/${s_id}"
              as: AttractionHost
          assert:
            - "the second cancel is rejected with data.error_id == ERR_ALREADY_TERMINAL and http 409"
            - "AttractionSession.${s_id}.status == CANCELLED both before and after the rejected retry"
            - "Attraction.${at_id}.in_use_units == 0, so the capacity was released exactly once"

      - name: settled_deal_rejects_further_funding
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BoatDeal.terminal_states
          - errors[ERR_INVALID_STATE]
          - validations[priority=6]
        distinguishing_aspect: "SETTLED is the deal's only terminal state and the funding dimension's preconditions exclude it, so no further funding or refund is accepted."
        test_recipe:
