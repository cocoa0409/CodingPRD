  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: project_rfi_cycle_bounded_at_two_rounds
        grounds:
          - state_machines.Project.UNDER_REVIEW_to_RFI_ISSUED
          - state_machines.Project.RFI_ISSUED_to_UNDER_REVIEW
          - entities.Project.fields.rfi_round_count
          - validations[priority=27]
        distinguishing_aspect: |
          The Project machine contains the cycle UNDER_REVIEW → RFI_ISSUED →
          UNDER_REVIEW, traversable twice and then permanently closed by
          MAX_RFI_ROUNDS = 2, so a third RFI on a project sitting legally in
          UNDER_REVIEW is rejected with ERR_RFI_ROUNDS_EXHAUSTED while the
          project stays in UNDER_REVIEW.
