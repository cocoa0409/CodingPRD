            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o_ref: "$.data.id" } }
            - { call: "POST /disputes", payload: { order_id: "${o_ref}", kind: "PRICING_OVERCHARGE", amount_cents: -200000 }, as: ComplianceOfficer }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o_target: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o_target}/submit", payload: {}, as: ResellerOps }
          assert:
            - "error_id == ERR_AGREEMENT_NOT_GOOD_STANDING"
            - "Order.${o_target}.compliance_status == DRAFT"

      - name: vehicle_authorize_gated_by_manufacturer_status
        grounds:
          - state_machines.ContractVehicle.PENDING_to_AUTHORIZED
          - entities.Manufacturer.fields.status
        distinguishing_aspect: |
          Pair (ContractVehicle, Manufacturer): vehicle authorize requires
          manufacturer.status == ACTIVE; once PlatformAdmin suspends the
          manufacturer the same authorize call returns ERR_MANUFACTURER_INACTIVE.
        test_recipe:
          setup:
            - "Manufacturer M ACTIVE; Agreement A ACTIVE; Vehicle V PENDING"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "M Corp", duns: "161616161", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /manufacturers/${m_id}/suspend", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
          assert:
            - "error_id == ERR_MANUFACTURER_INACTIVE"
            - "ContractVehicle.${v_id}.status == PENDING"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (>=2, different interval semantics, different resources)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_window_exclusive_end_vs_teaming_window_inclusive
        grounds:
          - entities.ContractVehicle.fields.effective_to
          - entities.TeamingArrangement.fields.window_end
        distinguishing_aspect: |
          Different interval semantics on different resources: vehicle.effective_to
          is EXCLUSIVE (order submit at exactly effective_to is rejected); teaming
          window_end is treated as inclusive-exclusive per the same half-open rule,
          but the RESOURCE differs (TeamingArrangement vs ContractVehicle) and the
          acceptance predicate differs (teaming approve requires window covers
          agreement; vehicle authorize requires logical clock strictly less than
          effective_to).
        test_recipe:
          setup:
            - "Vehicle V window [2026-01-01, 2026-10-01); logical clock exactly 2026-10-01T00:00:00Z"
            - "TeamingArrangement T window [2026-01-01, 2026-12-31) PROPOSED on V"
            - "Logical clock 2026-10-01 (== V.effective_to)"
          setup_api_calls:
            - { call: "POST /manufacturers", payload: { legal_name: "O Corp", duns: "171717171", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2026-10-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o_id}/submit", payload: {}, as: ResellerOps }
          assert:
            - "error_id == ERR_OUTSIDE_VEHICLE_WINDOW (effective_to is exclusive)"
            - "ContractVehicle.${v_id}.status lazily flips to EXPIRED on next read"

      - name: sales_report_period_overlap_uniqueness
        grounds:
          - entities.SalesReport.fields.period_label
          - validations[priority=21]
        distinguishing_aspect: |
          Aggregate-capacity semantics (not geometric adjacency): a second
          SalesReport for the same (agreement, period_label) is rejected with
          ERR_UNIQUENESS_VIOLATION even though the period interval is identical.
          Different interval semantics from vehicle window — set-membership
          overlap, not range overlap.
        test_recipe:
          setup:
            - "Agreement A ACTIVE; logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "N Corp", duns: "181818181", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /sales-reports", payload: { agreement_id: "${a_id}", period_label: "2026-09" }, as: FinanceOps }
          trigger:
            - { call: "POST /sales-reports", payload: { agreement_id: "${a_id}", period_label: "2026-09" }, as: FinanceOps }
          assert:
            - "error_id == ERR_UNIQUENESS_VIOLATION"

  # =========================================================================
  # Rule 9 — compensating_invariant (>=2, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dispute_ledger_invariant_resolve_reject_zero_drift
        grounds:
          - calculations.posture_derivation
          - state_machines.Dispute
        distinguishing_aspect: |
          Conserved quantity: agreement.dispute_credit_cents. Raise(OPEN) adds
          amount; resolve(REJECT) subtracts the same amount. Net drift over the
          raise->reject pair must be zero — posture returns to its pre-raise value.
        test_recipe:
          setup:
            - "Agreement A ACTIVE posture=GOOD_STANDING dispute_credit_cents=0"
            - "Order O exists to hang a dispute on"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "D Corp", duns: "191919191", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o_id: "$.data.id" } }
            - { call: "POST /disputes", payload: { order_id: "${o_id}", kind: "BILLING_ERROR", amount_cents: -150000 }, as: ComplianceOfficer, captures: { d_id: "$.data.id", a_mid: "$.data.id" } }
            - { call: "GET /agreements/${a_id}", payload: {}, as: ComplianceOfficer, captures: { a_debt: "$.data.dispute_credit_cents" } }
          trigger:
            - { call: "POST /disputes/${d_id}/resolve", payload: { outcome: "REJECT" }, as: ComplianceOfficer }
          assert:
            - "ManufacturerAgreement.${a_id}.dispute_credit_cents == 0 (raise added -150000, reject compensates +150000)"
            - "ManufacturerAgreement.${a_id}.posture == GOOD_STANDING"

      - name: invoice_void_invariant_sales_report_total_zero_drift
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.SalesReport.fields.total_sales_cents
        distinguishing_aspect: |
          Conserved quantity: SalesReport.total_sales_cents for a period.
          Invoice issue adds amount_cents; void subtracts the same amount_cents.
          Net drift over issue->void must be zero.
        test_recipe:
          setup:
            - "Full chain to DELIVERED order total=10000"
            - "Logical clock 2026-10-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /manufacturers", payload: { legal_name: "I Corp", duns: "202020202", manufacturer_type: "SOFTWARE_PUBLISHER", headquarters_country: "US" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /agreements", payload: { manufacturer_id: "${m_id}", scope_tiers: ["FEDERAL"], mfc_discount_pct: 0.20, small_business_goal_pct: 0.10, product_scope: ["SW-"], term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /agreements/${a_id}/activate", payload: {}, as: ContractsManager }
            - { call: "POST /vehicles", payload: { agreement_id: "${a_id}", vehicle_kind: "FED_SCHEDULE", buyer_tiers: ["FEDERAL"], ceiling_cents: 100000000, taa_required: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractsManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /vehicles/${v_id}/authorize", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists", payload: { vehicle_id: "${v_id}", period_from: "2026-01-01T00:00:00Z", period_to: "2027-01-01T00:00:00Z", lines: [{ sku: "SW-1", basis_price_cents: 20000, offered_price_cents: 10000, origin_country: "US" }] }, as: ContractsManager, captures: { pl_id: "$.data.id" } }
            - { call: "POST /price-lists/${pl_id}/submit", payload: {}, as: ContractsManager }
            - { call: "POST /price-lists/${pl_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /orders", payload: { vehicle_id: "${v_id}", price_list_id: "${pl_id}", buyer_tier: "FEDERAL", lines: [{ sku: "SW-1", qty: 1 }] }, as: ResellerOps, captures: { o_id: "$.data.id" } }
            - { call: "POST /orders/${o_id}/submit", payload: {}, as: ResellerOps }
            - { call: "POST /orders/${o_id}/deliver", payload: {}, as: ResellerOps }
            - { call: "POST /invoices", payload: { order_id: "${o_id}", period_label: "2026-10", payment_terms_days: 30 }, as: ResellerOps, captures: { inv_id: "$.data.id" } }
            - { call: "GET /sales-reports", payload: { agreement_id: "${a_id}", period_label: "2026-10" }, as: FinanceOps, captures: { sr_total_after_issue: "$.data[0].total_sales_cents", sr_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /invoices/${inv_id}/void", payload: {}, as: FinanceOps }
            - { call: "GET /sales-reports/${sr_id}", payload: {}, as: FinanceOps }
          assert:
            - "sr_total_after_issue == 10000 (issue added 10000)"
            - "after void: SalesReport.${sr_id}.total_sales_cents == 0"
            - "Order.${o_id}.billing_status == DELIVERED"
            - "Invoice.${inv_id}.status == VOID"



