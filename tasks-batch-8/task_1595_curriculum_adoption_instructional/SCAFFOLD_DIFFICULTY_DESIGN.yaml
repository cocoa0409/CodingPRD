  - rule_id: transitive_cascade
    instances:
      - name: challenge_removal_cascade
        grounds:
          - state_machines.ChallengeCase.COMMITTEE_REVIEW|HEARING_to_DECIDED
          - state_machines.InstructionalMaterial.UNDER_CHALLENGE,_RESTRICTED_to_REMOVED
          - state_machines.DistributionOrder.REQUESTED|APPROVED|BACKORDERED_to_CANCELLED
          - calculations.inventory_availability
        distinguishing_aspect: |
          Depth-3 cascade from the challenge-decide trigger: decision REMOVED -> material
          availability REMOVED -> every non-terminal DistributionOrder for the material CANCELLED
          (approved ones release their allocation) -> InventoryLot allocated/available recomputed
          and the cycle's replacement_due flag set. Distinct trigger from the PO-receipt cascade
          in receipt_backorder_promotion_cascade.
