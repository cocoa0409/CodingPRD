  - section: errors
    instances:
      - name: every_entity_not_found_code_is_triggerable_from_its_own_path
        claim_type: error_triggerable
        grounds:
          - errors.ERR_BOARD_CONFIG_NOT_FOUND
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_NURSE_NOT_FOUND
          - errors.ERR_APPLICATION_NOT_FOUND
          - errors.ERR_LICENSE_NOT_FOUND
          - errors.ERR_RENEWAL_NOT_FOUND
          - errors.ERR_CE_RECORD_NOT_FOUND
          - errors.ERR_COMPLAINT_NOT_FOUND
          - errors.ERR_EVIDENCE_REQUEST_NOT_FOUND
          - errors.ERR_MONITORING_AGREEMENT_NOT_FOUND
          - errors.ERR_PROCEEDING_NOT_FOUND
          - errors.ERR_NOTIFICATION_REPORT_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "Each of the twelve entity families owns a distinct 404 code, and a single well-formed UUID that belongs to no row must map to the code of the entity named by the path segment — never to a generic 404 and never to a neighbouring entity's code. All twelve are read paths, so no state is required beyond an empty store."
        test_recipe:
          setup:
            - "The store is empty apart from the seeded roles."
            - "00000000-0000-4000-8000-000000000009 is a syntactically valid UUID that matches no row of any entity."
          setup_api_calls: []
          trigger:
            - call: "GET /state-board-configs/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: SystemAdmin
              captures: { e_board: $.data.error_id }
            - call: "GET /education-programs/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: SystemAdmin
              captures: { e_prog: $.data.error_id }
            - call: "GET /nurses/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: LicensureAnalyst
              captures: { e_nurse: $.data.error_id }
            - call: "GET /license-applications/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: LicensureAnalyst
              captures: { e_app: $.data.error_id }
            - call: "GET /licenses/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: LicensureAnalyst
              captures: { e_lic: $.data.error_id }
            - call: "GET /renewal-applications/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: LicensureAnalyst
              captures: { e_ren: $.data.error_id }
            - call: "GET /ce-records/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: LicensureAnalyst
              captures: { e_ce: $.data.error_id }
            - call: "GET /complaints/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: Investigator
              captures: { e_comp: $.data.error_id }
            - call: "GET /evidence-requests/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: Investigator
              captures: { e_ev: $.data.error_id }
            - call: "GET /monitoring-agreements/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: MonitoringCoordinator
              captures: { e_mon: $.data.error_id }
            - call: "GET /disciplinary-proceedings/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: BoardMember
              captures: { e_proc: $.data.error_id }
            - call: "GET /notification-reports/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: SystemAdmin
              captures: { e_note: $.data.error_id }
          assert:
            - "every call returns HTTP 404 with an { error: { error_id, message } } envelope carrying a meta.request_id"
            - "${e_board} == ERR_BOARD_CONFIG_NOT_FOUND, ${e_prog} == ERR_PROGRAM_NOT_FOUND, ${e_nurse} == ERR_NURSE_NOT_FOUND, ${e_app} == ERR_APPLICATION_NOT_FOUND"
            - "${e_lic} == ERR_LICENSE_NOT_FOUND, ${e_ren} == ERR_RENEWAL_NOT_FOUND, ${e_ce} == ERR_CE_RECORD_NOT_FOUND, ${e_comp} == ERR_COMPLAINT_NOT_FOUND"
            - "${e_ev} == ERR_EVIDENCE_REQUEST_NOT_FOUND, ${e_mon} == ERR_MONITORING_AGREEMENT_NOT_FOUND, ${e_proc} == ERR_PROCEEDING_NOT_FOUND, ${e_note} == ERR_NOTIFICATION_REPORT_NOT_FOUND"
            - "no two of the twelve codes are equal"

      - name: unrecognised_role_header_value_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
          - validations[priority=3]
        distinguishing_aspect: "Authentication is priority 1, ahead of the role check at 2 and existence at 3, so a request whose X-User-Role is outside the six declared roles must report ERR_UNAUTHENTICATED even though the path id also does not exist — the identity gate answers before the store is consulted and leaks nothing about what exists."
        test_recipe:
          setup:
            - "Board OH exists."
            - "RegistryAuditor is not one of the six roles declared in §1.7."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
          trigger:
            - call: "GET /state-board-configs/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: RegistryAuditor
              as_user_id: "ghost-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 401 and ${err} == ERR_UNAUTHENTICATED"
            - "${err} != ERR_BOARD_CONFIG_NOT_FOUND and ${err} != ERR_FORBIDDEN_ROLE — priority 1 wins over both 2 and 3"
            - "a request carrying X-User-Role SystemAdmin but no X-User-ID header returns the same 401 ERR_UNAUTHENTICATED"
            - "the same path with role SystemAdmin and an id of ${board_id} returns 200"

      - name: stale_version_code_stub
        claim_type: error_triggerable
        grounds:
          - errors.ERR_STALE_VERSION
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / renewal_creation_blocked_by_suspended_license_encumbrance
          rationale: "The two dedicated OCC instances in the complexity_layers section of this document trigger ERR_STALE_VERSION on both declared §1.2.1 rules, and that cross-entity instance asserts the code is NOT returned when the version is fresh, so the code is covered from both sides."

      - name: disqualifying_offense_code_stub
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DISQUALIFYING_OFFENSE
        excluded_because:
          difficulty_instance: transitive_cascade / revocation_order_cascades_through_dependent_aprn_to_reports
          rationale: "The board-decision corner in the state_machines section of this document triggers ERR_DISQUALIFYING_OFFENSE directly against a screening hit inside the lookback window; that cascade instance supplies the surrounding disciplinary context."

      - name: presiding_and_conflict_vote_codes_stub
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PRESIDING_MEMBER_CANNOT_VOTE
          - errors.ERR_VOTER_CONFLICT_OF_INTEREST
        excluded_because:
          difficulty_instance: combinatorial_formula / panel_tally_walks_tier_ladder_from_revocation_downward
          rationale: "Both segregation-of-duties codes are triggered by the two dedicated rbac instances in this document, which seat the presiding member and the monitoring approver respectively; that tally instance depends on the surviving votes."

  - section: rbac
    instances:
      - name: investigator_cannot_mint_a_license_returns_forbidden_role
        claim_type: exclusive_operations
        grounds:
          - roles.LicensureAnalyst.exclusive_operations
          - roles.Investigator
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Issuance is exclusive to LicensureAnalyst, so an Investigator holding a fully APPROVED application is still refused at the role gate — the refusal is a 403 about the caller, not a 409 about the application, and no License row is created."
        test_recipe:
          setup:
            - "Board OH has an APPROVED BSN programme and nurse Dana Reed."
            - "Her EXAMINATION RN application is verified, screened clear and sits in APPROVED."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
