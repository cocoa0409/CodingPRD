            - call: "POST /aesthetics/injectable-lots"
              payload: { product: "BOTOX", lot_number: "LOT-AP", expiration_date: "2026-12-01T00:00:00Z", total_units: 100 }
              as: ClinicAdmin
              captures: { ap_lot: $.data.id }
            - call: "POST /aesthetics/patients"
              payload: { full_name: "Ap Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { ap_pat: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${ap_pat}", kind: "CONSENT", storage_uri: "s3://ap-c", signed: true }
              as: Provider
              as_user_id: "${ap_inj}"
            - call: "POST /aesthetics/consultations"
              payload: { patient_id: "${ap_pat}", exam_provider_id: "${ap_inj}", chief_complaint: "x" }
              as: Provider
              as_user_id: "${ap_inj}"
              captures: { ap_cons: $.data.id }
            - call: "POST /aesthetics/consultations/${ap_cons}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${ap_inj}"
            - call: "POST /aesthetics/standing-orders"
              payload: { consultation_id: "${ap_cons}", director_provider_id: "${ap_dir}", product: "BOTOX", max_units_authorized: 30, valid_until_utc: "2026-12-01T00:00:00Z" }
              as: Provider
              as_user_id: "${ap_dir}"
              captures: { ap_so: $.data.id }
            - call: "POST /aesthetics/treatment-plans"
              payload: { patient_id: "${ap_pat}", consultation_id: "${ap_cons}", product: "BOTOX", planned_sessions: 1, planned_units_per_session: 20, list_price_per_unit_cents: 1000, required_deposit_cents: 0 }
              as: Provider
              as_user_id: "${ap_inj}"
              captures: { ap_plan: $.data.id, ap_plan_v: $.data.version }
            - call: "POST /aesthetics/treatment-plans/${ap_plan}/activate"
              payload: { expected_treatment_plan_version: "${ap_plan_v}" }
              as: Provider
              as_user_id: "${ap_inj}"
              captures: { ap_plan_v2: $.data.version }
            - call: "POST /aesthetics/treatment-sessions"
              payload: { treatment_plan_id: "${ap_plan}", standing_order_id: "${ap_so}", injector_provider_id: "${ap_inj}", injectable_lot_id: "${ap_lot}", planned_units: 20, expected_treatment_plan_version: "${ap_plan_v2}" }
              as: Provider
              as_user_id: "${ap_inj}"
              captures: { ap_sess: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${ap_pat}", treatment_session_id: "${ap_sess}", kind: "BEFORE", storage_uri: "s3://ap-b" }
              as: Provider
              as_user_id: "${ap_inj}"
            - call: "POST /aesthetics/treatment-sessions/${ap_sess}/commit"
              payload: {}
              as: Provider
              as_user_id: "${ap_inj}"
          trigger:
            - call: "POST /aesthetics/treatment-sessions/${ap_sess}/resolve"
              payload: {}
              as: Provider
              as_user_id: "${ap_inj}"
              captures: { ap_err: $.data.error_id }
          assert:
            - "response error_id == ERR_AFTER_PHOTO_REQUIRED"
            - "response http_status == 409"

      - name: severe_complication_open_touchup_returns_severe_no_touchup
        claim_type: guarded transitions
        grounds:
          - state_machines.ComplicationCase.OPEN_to_IN_TOUCHUP
          - errors[ERR_SEVERE_NO_TOUCHUP]
        distinguishing_aspect: "Opening a touch-up on a SEVERE complication returns ERR_SEVERE_NO_TOUCHUP (409); SEVERE is refund-only."
        test_recipe:
          setup: ["a COMMITTED session with a SEVERE OPEN complication"]
          setup_api_calls:
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Sv Inj", license_number: "L-SV-I", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { sv_inj: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Sv Dir", license_number: "L-SV-D", role_kind: "MEDICAL_DIRECTOR" }
              as: ClinicAdmin
              captures: { sv_dir: $.data.id }
            - call: "POST /aesthetics/injectable-lots"
              payload: { product: "BOTOX", lot_number: "LOT-SV", expiration_date: "2026-12-01T00:00:00Z", total_units: 100 }
              as: ClinicAdmin
              captures: { sv_lot: $.data.id }
            - call: "POST /aesthetics/patients"
              payload: { full_name: "Sv Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { sv_pat: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${sv_pat}", kind: "CONSENT", storage_uri: "s3://sv-c", signed: true }
              as: Provider
              as_user_id: "${sv_inj}"
            - call: "POST /aesthetics/consultations"
              payload: { patient_id: "${sv_pat}", exam_provider_id: "${sv_inj}", chief_complaint: "x" }
              as: Provider
              as_user_id: "${sv_inj}"
              captures: { sv_cons: $.data.id }
            - call: "POST /aesthetics/consultations/${sv_cons}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${sv_inj}"
            - call: "POST /aesthetics/standing-orders"
              payload: { consultation_id: "${sv_cons}", director_provider_id: "${sv_dir}", product: "BOTOX", max_units_authorized: 30, valid_until_utc: "2026-12-01T00:00:00Z" }
              as: Provider
              as_user_id: "${sv_dir}"
              captures: { sv_so: $.data.id }
            - call: "POST /aesthetics/treatment-plans"
              payload: { patient_id: "${sv_pat}", consultation_id: "${sv_cons}", product: "BOTOX", planned_sessions: 1, planned_units_per_session: 20, list_price_per_unit_cents: 1000, required_deposit_cents: 0 }
              as: Provider
              as_user_id: "${sv_inj}"
              captures: { sv_plan: $.data.id, sv_plan_v: $.data.version }
            - call: "POST /aesthetics/treatment-plans/${sv_plan}/activate"
              payload: { expected_treatment_plan_version: "${sv_plan_v}" }
              as: Provider
