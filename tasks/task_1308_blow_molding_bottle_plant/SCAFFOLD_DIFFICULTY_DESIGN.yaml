          ERR_ORDER_NOT_RELEASED) and P6 (mold carries an OPEN QUALITY_HOLD
          blockout -> ERR_QUALITY_HOLD_BLOCKOUT); the state error must win. The
          companion instance exercises a different pair (business_temporal vs
          business_fiscal).
