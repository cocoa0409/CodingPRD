            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: "$.data.id" } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "GET /uro/conflicts/${c1}", payload: {}, as: UtilityCoordinator, captures: { c1v_stale: "$.data.version" } }
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v_stale}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11 }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: "$.data.id" } }
          trigger:
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v_stale}", estimated_cost_cents: 39000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.20, work_days: 11 }, as: UtilityOwnerRep, as_user_id: "${o1}" }
          assert:
            - "the first plan submittal succeeded with 201 and moved UtilityConflict.${c1}.status to RELOCATION_PLANNED, bumping its version past ${c1v_stale}"
            - "HTTP 412 with error_id ERR_STALE_VERSION"
            - "RelocationPlan.${pl1}.status is still SUBMITTED - the rejected submittal did not supersede it"
            - "no second RelocationPlan row exists and UtilityConflict.${c1}.version is unchanged by the rejected call"
            - "after GET /uro/conflicts/${c1} yields the current version, the identical body carrying it returns 201 and RelocationPlan.${pl1}.status becomes SUPERSEDED"
            - "every successful write in this instance increments the version of the row it touched by exactly 1"

      - name: a_stale_plan_version_stops_an_agreement_draft_that_would_have_voided_an_unseen_one
