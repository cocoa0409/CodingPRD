      - Listing.${listing_id}.marketing_status == WITHDRAWN
      - Listing.${listing_id}.ended_at == 2026-08-20T00:00:00.000Z
      - Listing.${listing2_id}.marketing_status == ACTIVE
      - Listing.${listing2_id}.days_on_market == 0
      - GET /short-sale/cases/${case_id}/listings returns exactly 2 Listings
