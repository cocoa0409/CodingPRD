      - name: notice_sent_exactly_at_deadline
        grounds:
          - calculations.notice_timeliness
          - entities.MeetingNotice.fields.deadline_at
        distinguishing_aspect: |
          Metric: time (seconds); endpoint: POST /meetings/{id}/send_notices. The boundary is
