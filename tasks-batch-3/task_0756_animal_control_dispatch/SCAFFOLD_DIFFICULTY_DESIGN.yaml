# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Animal-Control & Field-Services Dispatch — 9 rules x 2 instances = 18
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: citation_fine_standard_vs_escalated
        grounds:
          - calculations.citation_fine
          - entities.Citation.fields.fine_amount
          - state_machines.Citation.ISSUED_to_PAID
        distinguishing_aspect: "Dual-variant on the CITATION domain: identical DANGEROUS violation yields 250.00 (standard, no prior) vs 375.00 (escalated, one prior PAID citation for the same issued_to_ref)."
        test_recipe:
          setup:
            - "An UNDER_INVESTIGATION bite case exists with an officer and complaint."
            - "A first DANGEROUS citation for issued_to_ref OWNER-9 was issued (250.00) and then PAID."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R1", reporter_phone: "555-0001", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc A", badge_number: "B1", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
            - call: "POST /dispatch/citations"
              payload: { case_id: "${ca}", violation_code: "DANGEROUS", issued_to_name: "Sam Owner", issued_to_ref: "OWNER-9" }
              as: Supervisor
              captures: { cit1: $.data.id }
            - call: "POST /dispatch/citations/${cit1}/pay"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /dispatch/citations"
              payload: { case_id: "${ca}", violation_code: "DANGEROUS", issued_to_name: "Sam Owner", issued_to_ref: "OWNER-9" }
              as: Supervisor
              captures: { cit2: $.data.id, fee2: $.data.fine_amount }
          assert:
            - "Citation.${cit1}.fine_amount == 250.00"
            - "Citation.${cit2}.base_fine == 250.00"
            - "Citation.${cit2}.fine_amount == 375.00"
            - "${fee2} == 375.00"

      - name: case_risk_provisional_vs_final
        grounds:
          - calculations.case_risk_score
          - entities.Case.fields.risk_score
          - state_machines.Case.UNDER_INVESTIGATION_to_SUBSTANTIATED
        distinguishing_aspect: "Dual-variant on the CASE domain (distinct from the Citation dual-variant): the same bite case scores 70.00 provisional at investigate and 90.00 final at SUBSTANTIATED resolve (+20 substantiation bonus)."
        test_recipe:
          setup:
            - "A bite case linked to a DOG/BITE complaint (severity 60.00) exists in OPEN state."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R2", reporter_phone: "555-0002", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc B", badge_number: "B2", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
              captures: { prov_risk: $.data.risk_score }
            - call: "POST /dispatch/cases/${ca}/resolve"
              payload: { resolution: "SUBSTANTIATED" }
              as: Supervisor
              captures: { fin_risk: $.data.risk_score }
          assert:
            - "${prov_risk} == 70.00"
            - "${fin_risk} == 90.00"
            - "Case.${ca}.risk_score == 90.00"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: complaint_priority_multi_input_nonlinear
        grounds:
          - calculations.complaint_priority_score
          - entities.Complaint.fields.severity_score
          - entities.Complaint.fields.priority
        distinguishing_aspect: "Mode (a) non-linear multi-input: base*animal_mult + capped repeat_bonus + vulnerable_bonus = 50*1.5 + min(2*5,20) + 15 = 100.00 -> P1, exercising the min() cap and tiered threshold together."
        test_recipe:
          setup:
            - "Two prior NEW complaints already exist in zone NORTH (repeat count = 2)."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "P1", reporter_phone: "555-1001", zone: "NORTH", animal_type: "DOG", complaint_type: "NOISE" }
              as: Dispatcher
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "P2", reporter_phone: "555-1002", zone: "NORTH", animal_type: "CAT", complaint_type: "STRAY" }
              as: Dispatcher
          trigger:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "T", reporter_phone: "555-1003", zone: "NORTH", animal_type: "WILDLIFE", complaint_type: "BITE", involves_vulnerable_victim: true }
              as: Dispatcher
              captures: { tgt: $.data.id, sev: $.data.severity_score }
          assert:
            - "${sev} == 100.00"
            - "Complaint.${tgt}.severity_score == 100.00"
            - "Complaint.${tgt}.priority == P1"

      - name: impound_boarding_fee_per_line_rounding
        grounds:
          - calculations.impound_boarding_fee
          - entities.Impound.fields.boarding_fee
          - state_machines.Impound.HELD_to_REDEEMED
        distinguishing_aspect: "Mode (b) rounding-order: tax applied and rounded PER LINE then summed gives 40.31 + 16.13 + 24.46 = 80.90, which differs from the sum-then-round result 80.89."
        test_recipe:
          setup:
            - "A bite case is UNDER_INVESTIGATION; an unlicensed animal is impounded in kennel from 2026-03-01 with hold_until 2026-03-10."
            - "The logical clock is advanced to 2026-03-04 (3 boarding days) before release."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R3", reporter_phone: "555-0003", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc C", badge_number: "B3", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/kennels"
              payload: { code: "K-1", facility_zone: "NORTH" }
              as: Supervisor
              captures: { ken: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
              captures: { cav: $.data.version }
            - call: "POST /dispatch/impounds"
              payload: { case_id: "${ca}", kennel_id: "${ken}", impounded_at: "2026-03-01T00:00:00Z", hold_until: "2026-03-10T00:00:00Z", expected_case_version: "${cav}", licensed: false }
              as: Supervisor
              captures: { imp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T00:00:00Z" }
              as: Supervisor
          trigger:
            - call: "POST /dispatch/impounds/${imp}/release"
              payload: { disposition: "REDEEMED" }
              as: Supervisor
              captures: { fee: $.data.boarding_fee }
          assert:
            - "${fee} == 80.90"
            - "Impound.${imp}.boarding_fee == 80.90"
            - "Impound.${imp}.status == REDEEMED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: case_cyclic_reopen_after_substantiated
        grounds:
          - state_machines.Case.SUBSTANTIATED_to_UNDER_INVESTIGATION
          - entities.Case.fields.substantiated_at
          - entities.Case.fields.risk_score
        distinguishing_aspect: "Cycle on the CASE entity: UNDER_INVESTIGATION -> SUBSTANTIATED -> UNDER_INVESTIGATION (reopen), which clears substantiated_at and recomputes provisional risk 70.00."
        test_recipe:
          setup:
            - "A bite case (severity-60 complaint) has been investigated and resolved SUBSTANTIATED (risk 90.00, substantiated_at set)."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R4", reporter_phone: "555-0004", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc D", badge_number: "B4", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
            - call: "POST /dispatch/cases/${ca}/resolve"
              payload: { resolution: "SUBSTANTIATED" }
              as: Supervisor
          trigger:
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
              captures: { rs: $.data.risk_score }
          assert:
            - "Case.${ca}.status == UNDER_INVESTIGATION"
            - "Case.${ca}.substantiated_at == null"
            - "${rs} == 70.00"

      - name: quarantine_branching_divergent_side_effects
        grounds:
          - state_machines.QuarantineHold.ACTIVE_to_ESCALATED
          - state_machines.QuarantineHold.ACTIVE_to_RELEASED
          - state_machines.Impound.HELD_to_EUTHANIZED
        distinguishing_aspect: "Branching fork on the QUARANTINEHOLD entity (different entity from the Case cycle): ACTIVE forks to ESCALATED (euthanizes the linked HELD impound) vs RELEASED (no such side effect) vs VOIDED."
        test_recipe:
          setup:
            - "A bite case is UNDER_INVESTIGATION with a HELD impound and an ACTIVE quarantine hold."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R5", reporter_phone: "555-0005", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc E", badge_number: "B5", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/kennels"
              payload: { code: "K-2", facility_zone: "NORTH" }
              as: Supervisor
              captures: { ken: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
              captures: { cav: $.data.version }
            - call: "POST /dispatch/impounds"
              payload: { case_id: "${ca}", kennel_id: "${ken}", impounded_at: "2026-03-01T00:00:00Z", hold_until: "2026-03-20T00:00:00Z", expected_case_version: "${cav}" }
              as: Supervisor
              captures: { imp: $.data.id }
            - call: "POST /dispatch/quarantine-holds"
              payload: { case_id: "${ca}", hold_type: "FACILITY_QUARANTINE", start_at: "2026-03-01T00:00:00Z" }
              as: Supervisor
              captures: { qh: $.data.id }
          trigger:
            - call: "POST /dispatch/quarantine-holds/${qh}/escalate"
              payload: {}
              as: Supervisor
          assert:
            - "QuarantineHold.${qh}.status == ESCALATED"
            - "Impound.${imp}.status == EUTHANIZED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: escalate_hold_impound_rabies_case_depth3
        grounds:
          - state_machines.QuarantineHold.ACTIVE_to_ESCALATED
          - state_machines.Impound.HELD_to_EUTHANIZED
          - state_machines.RabiesReport.SUBMITTED_to_ESCALATED
        distinguishing_aspect: "Depth-3 cascade from the ESCALATE trigger: QuarantineHold(A) -> Impound euthanized(B) -> RabiesReport escalated(C) -> Case public_health flagged & risk +20(D), each hop caused by the prior."
        test_recipe:
          setup:
            - "A bite case (severity-60 complaint, provisional risk 70.00) is UNDER_INVESTIGATION with a HELD impound, an ACTIVE quarantine hold, and a SUBMITTED rabies report."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R6", reporter_phone: "555-0006", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc F", badge_number: "B6", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/kennels"
              payload: { code: "K-3", facility_zone: "NORTH" }
              as: Supervisor
              captures: { ken: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
              captures: { cav: $.data.version }
            - call: "POST /dispatch/impounds"
              payload: { case_id: "${ca}", kennel_id: "${ken}", impounded_at: "2026-03-01T00:00:00Z", hold_until: "2026-03-20T00:00:00Z", expected_case_version: "${cav}" }
              as: Supervisor
              captures: { imp: $.data.id }
            - call: "POST /dispatch/quarantine-holds"
              payload: { case_id: "${ca}", hold_type: "FACILITY_QUARANTINE", start_at: "2026-03-01T00:00:00Z" }
              as: Supervisor
              captures: { qh: $.data.id }
            - call: "POST /dispatch/rabies-reports"
              payload: { case_id: "${ca}", quarantine_hold_id: "${qh}", victim_name: "Pat V", exposure_date: "2026-03-01T00:00:00Z" }
              as: Supervisor
              captures: { rr: $.data.id }
          trigger:
            - call: "POST /dispatch/quarantine-holds/${qh}/escalate"
              payload: {}
              as: Supervisor
          assert:
            - "QuarantineHold.${qh}.status == ESCALATED"
            - "Impound.${imp}.status == EUTHANIZED"
            - "Kennel.${ken}.occupied_slots == 0"
            - "RabiesReport.${rr}.status == ESCALATED"
            - "Case.${ca}.public_health_flag == true"
            - "Case.${ca}.risk_score == 90.00"

      - name: unfounded_resolve_hold_rabies_depth2
        grounds:
          - state_machines.Case.UNDER_INVESTIGATION_to_UNFOUNDED
          - state_machines.QuarantineHold.ACTIVE_to_VOIDED
          - state_machines.RabiesReport.SUBMITTED_to_CLEARED
        distinguishing_aspect: "Depth-2 cascade from the RESOLVE-UNFOUNDED trigger (a different origin than escalate): Case(A) -> QuarantineHold voided(B) -> RabiesReport cleared(C)."
        test_recipe:
          setup:
            - "A bite case is UNDER_INVESTIGATION with an ACTIVE quarantine hold and a SUBMITTED rabies report linked to that hold."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R7", reporter_phone: "555-0007", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc G", badge_number: "B7", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
            - call: "POST /dispatch/quarantine-holds"
              payload: { case_id: "${ca}", hold_type: "HOME_QUARANTINE", start_at: "2026-03-01T00:00:00Z" }
              as: Supervisor
              captures: { qh: $.data.id }
            - call: "POST /dispatch/rabies-reports"
              payload: { case_id: "${ca}", quarantine_hold_id: "${qh}", victim_name: "Lee V", exposure_date: "2026-03-01T00:00:00Z" }
              as: Supervisor
              captures: { rr: $.data.id }
          trigger:
            - call: "POST /dispatch/cases/${ca}/resolve"
              payload: { resolution: "UNFOUNDED" }
              as: Supervisor
          assert:
            - "Case.${ca}.status == UNFOUNDED"
            - "QuarantineHold.${qh}.status == VOIDED"
            - "RabiesReport.${rr}.status == CLEARED"
            - "Case.${ca}.risk_score == 0.00"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: referential_beats_temporal_on_dispatch_create
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_COMPLAINT_NOT_DISPATCHABLE]
        distinguishing_aspect: "business_referential (complaint not NEW, priority 6) vs business_temporal (officer schedule conflict, priority 8): both hold, and the referential error wins."
        test_recipe:
          setup:
            - "Officer O is on duty (clock 2026-03-01). O has an EN_ROUTE dispatch on complaint2 with window 09:00-10:00."
            - "Complaint1 was dispatched to O (14:00-15:00), accepted, and cleared, so complaint1 is now RESOLVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "C1", reporter_phone: "555-2001", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx1: $.data.id }
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "C2", reporter_phone: "555-2002", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx2: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc O", badge_number: "B8", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx2}", officer_id: "${off}", scheduled_start_at: "2026-03-01T09:00:00Z", scheduled_end_at: "2026-03-01T10:00:00Z" }
              as: Dispatcher
              captures: { d2: $.data.id }
            - call: "POST /dispatch/dispatches/${d2}/accept"
              payload: {}
              as: FieldOfficer
              as_user_id: "${off}"
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx1}", officer_id: "${off}", scheduled_start_at: "2026-03-01T14:00:00Z", scheduled_end_at: "2026-03-01T15:00:00Z" }
              as: Dispatcher
              captures: { d1: $.data.id }
            - call: "POST /dispatch/dispatches/${d1}/accept"
              payload: {}
              as: FieldOfficer
              as_user_id: "${off}"
            - call: "POST /dispatch/dispatches/${d1}/clear"
              payload: { field_outcome: "RESOLVED_ON_SCENE" }
              as: FieldOfficer
              as_user_id: "${off}"
          trigger:
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx1}", officer_id: "${off}", scheduled_start_at: "2026-03-01T09:30:00Z", scheduled_end_at: "2026-03-01T09:45:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COMPLAINT_NOT_DISPATCHABLE"
            - "Complaint.${cx1}.status == RESOLVED"

      - name: safety_beats_fiscal_on_case_close
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_ACTIVE_QUARANTINE_HOLD]
        distinguishing_aspect: "business_safety (ACTIVE quarantine hold, priority 7) vs business_fiscal (ISSUED citation, priority 10): both block close, and the safety error wins."
        test_recipe:
          setup:
            - "A bite case is SUBSTANTIATED with an ACTIVE quarantine hold AND an ISSUED citation."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R9", reporter_phone: "555-0009", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc H", badge_number: "B9", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
            - call: "POST /dispatch/citations"
              payload: { case_id: "${ca}", violation_code: "LEASH", issued_to_name: "Owner K", issued_to_ref: "OWNER-1" }
              as: Supervisor
              captures: { cit: $.data.id }
            - call: "POST /dispatch/quarantine-holds"
              payload: { case_id: "${ca}", hold_type: "HOME_QUARANTINE", start_at: "2026-03-01T00:00:00Z" }
              as: Supervisor
              captures: { qh: $.data.id }
            - call: "POST /dispatch/cases/${ca}/resolve"
              payload: { resolution: "SUBSTANTIATED" }
              as: Supervisor
          trigger:
            - call: "POST /dispatch/cases/${ca}/close"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ACTIVE_QUARANTINE_HOLD"
            - "Case.${ca}.status == SUBSTANTIATED"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: priority_threshold_60_inclusive
        grounds:
          - calculations.complaint_priority_score
          - entities.Complaint.fields.priority
        distinguishing_aspect: "Numeric threshold on the complaint-create endpoint: a score of exactly 60.00 maps to P1 (>= is inclusive), not P2 — a distinct metric from the datetime boundary in the other instance."
        test_recipe:
          setup:
            - "Empty DB; no prior same-zone complaints so repeat_bonus = 0."
          setup_api_calls: []
          trigger:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "T60", reporter_phone: "555-6060", zone: "SOUTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { c60: $.data.id, sev: $.data.severity_score }
          assert:
            - "${sev} == 60.00"
            - "Complaint.${c60}.severity_score == 60.00"
            - "Complaint.${c60}.priority == P1"

      - name: quarantine_release_datetime_boundary_inclusive
        grounds:
          - calculations.quarantine_release_due
          - state_machines.QuarantineHold.ACTIVE_to_RELEASED
          - errors[ERR_QUARANTINE_NOT_ELAPSED]
        distinguishing_aspect: "Datetime threshold on the quarantine-release endpoint: clock exactly equal to release_due_at (2026-03-11T00:00:00Z) permits release (>= inclusive) — a different metric and endpoint than the numeric priority boundary."
        test_recipe:
          setup:
            - "A bite case is UNDER_INVESTIGATION with an ACTIVE hold started 2026-03-01 (required_days 10 -> release_due 2026-03-11T00:00:00Z)."
            - "The clock is set to exactly the release_due instant."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R10", reporter_phone: "555-0010", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc I", badge_number: "B10", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
            - call: "POST /dispatch/quarantine-holds"
              payload: { case_id: "${ca}", hold_type: "HOME_QUARANTINE", start_at: "2026-03-01T00:00:00Z" }
              as: Supervisor
              captures: { qh: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: Supervisor
          trigger:
            - call: "POST /dispatch/quarantine-holds/${qh}/release"
              payload: {}
              as: Supervisor
          assert:
            - "QuarantineHold.${qh}.release_due_at == 2026-03-11T00:00:00Z"
            - "QuarantineHold.${qh}.status == RELEASED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_blocked_by_officer_off_duty
        grounds:
          - validations[priority=9]
          - entities.Officer.fields.shift_start_at
          - errors[ERR_OFFICER_OFF_DUTY]
        distinguishing_aspect: "Dispatch->Officer dependency: a Dispatch cannot be created while the current clock is outside the Officer's shift window (ERR_OFFICER_OFF_DUTY)."
        test_recipe:
          setup:
            - "Clock is 2026-03-01. Officer O2's shift is 2026-03-05 08:00-17:00 (future, so O2 is off duty now)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R11", reporter_phone: "555-0011", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc J", badge_number: "B11", territory_zone: "NORTH", shift_start_at: "2026-03-05T08:00:00Z", shift_end_at: "2026-03-05T17:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
          trigger:
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx}", officer_id: "${off}", scheduled_start_at: "2026-03-05T09:00:00Z", scheduled_end_at: "2026-03-05T10:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_OFFICER_OFF_DUTY"
            - "Complaint.${cx}.status == NEW"

      - name: case_close_blocked_by_issued_citation
        grounds:
          - validations[priority=10]
          - state_machines.Case.SUBSTANTIATED_to_CLOSED
          - errors[ERR_OUTSTANDING_CITATIONS]
        distinguishing_aspect: "Case->Citation dependency (a different entity pair than Dispatch->Officer): a SUBSTANTIATED case with no holds/impounds still cannot close while a linked Citation is ISSUED."
        test_recipe:
          setup:
            - "A stray case is SUBSTANTIATED with one ISSUED citation and no quarantine holds or impounds."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R12", reporter_phone: "555-0012", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc K", badge_number: "B12", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "STRAY" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
            - call: "POST /dispatch/citations"
              payload: { case_id: "${ca}", violation_code: "UNLICENSED", issued_to_name: "Owner M", issued_to_ref: "OWNER-2" }
              as: Supervisor
              captures: { cit: $.data.id }
            - call: "POST /dispatch/cases/${ca}/resolve"
              payload: { resolution: "SUBSTANTIATED" }
              as: Supervisor
          trigger:
            - call: "POST /dispatch/cases/${ca}/close"
              payload: {}
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_OUTSTANDING_CITATIONS"
            - "Case.${ca}.status == SUBSTANTIATED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: officer_dispatch_buffer_conflict
        grounds:
          - validations[priority=8]
          - entities.Dispatch.fields.scheduled_start_at
          - errors[ERR_OFFICER_SCHEDULE_CONFLICT]
        distinguishing_aspect: "Officer interval semantics use a 30-minute BUFFER: a new window 10:15-11:00 conflicts with an active 09:00-10:00 dispatch because the 15-minute gap is inside the buffer (buffered adjacency)."
        test_recipe:
          setup:
            - "Officer O is on duty (clock 2026-03-01) and has a PENDING dispatch on complaint1 with window 09:00-10:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "C3", reporter_phone: "555-2003", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx1: $.data.id }
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "C4", reporter_phone: "555-2004", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx2: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc L", badge_number: "B13", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx1}", officer_id: "${off}", scheduled_start_at: "2026-03-01T09:00:00Z", scheduled_end_at: "2026-03-01T10:00:00Z" }
              as: Dispatcher
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /dispatch/dispatches"
              payload: { complaint_id: "${cx2}", officer_id: "${off}", scheduled_start_at: "2026-03-01T10:15:00Z", scheduled_end_at: "2026-03-01T11:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_OFFICER_SCHEDULE_CONFLICT"

      - name: kennel_impound_touching_windows_allowed
        grounds:
          - validations[priority=8]
          - entities.Impound.fields.hold_until
          - errors[ERR_KENNEL_OCCUPIED]
        distinguishing_aspect: "Kennel interval semantics are closed intervals with NO buffer: a second impound starting exactly at the first's hold_until (2026-03-04) shares only the endpoint and is ACCEPTED, unlike the officer's buffered rule on a different resource entity."
        test_recipe:
          setup:
            - "A bite case is UNDER_INVESTIGATION; impound1 occupies kennel K for 2026-03-01..2026-03-04 (HELD)."
            - "The current Case.version after impound1 is read back for the OCC field of impound2."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R13", reporter_phone: "555-0013", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc M", badge_number: "B14", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/kennels"
              payload: { code: "K-4", facility_zone: "NORTH" }
              as: Supervisor
              captures: { ken: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
              captures: { cav: $.data.version }
            - call: "POST /dispatch/impounds"
              payload: { case_id: "${ca}", kennel_id: "${ken}", impounded_at: "2026-03-01T00:00:00Z", hold_until: "2026-03-04T00:00:00Z", expected_case_version: "${cav}" }
              as: Supervisor
              captures: { imp1: $.data.id }
            - call: "GET /dispatch/cases/${ca}"
              payload: {}
              as: Supervisor
              captures: { cav2: $.data.version }
          trigger:
            - call: "POST /dispatch/impounds"
              payload: { case_id: "${ca}", kennel_id: "${ken}", impounded_at: "2026-03-04T00:00:00Z", hold_until: "2026-03-07T00:00:00Z", expected_case_version: "${cav2}" }
              as: Supervisor
              captures: { imp2: $.data.id }
          assert:
            - "Impound.${imp2}.status == HELD"
            - "Kennel.${ken}.occupied_slots == 2"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: kennel_occupied_slots_conserved
        grounds:
          - entities.Kennel.fields.occupied_slots
          - state_machines.Impound.HELD_to_REDEEMED
          - calculations.impound_boarding_fee
        distinguishing_aspect: "Conserved quantity = Kennel.occupied_slots (integer slot count): impound create (+1) paired with release (-1) leaves occupied_slots == count of HELD impounds == 0."
        test_recipe:
          setup:
            - "A bite case is UNDER_INVESTIGATION; one animal is impounded into kennel K (occupied_slots becomes 1)."
            - "The clock is advanced to 2026-03-05 before release."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R14", reporter_phone: "555-0014", zone: "NORTH", animal_type: "DOG", complaint_type: "BITE" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc N", badge_number: "B15", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/kennels"
              payload: { code: "K-5", facility_zone: "NORTH" }
              as: Supervisor
              captures: { ken: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "BITE" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
              captures: { cav: $.data.version }
            - call: "POST /dispatch/impounds"
              payload: { case_id: "${ca}", kennel_id: "${ken}", impounded_at: "2026-03-01T00:00:00Z", hold_until: "2026-03-05T00:00:00Z", expected_case_version: "${cav}" }
              as: Supervisor
              captures: { imp: $.data.id }
            - call: "GET /dispatch/kennels/${ken}"
              payload: {}
              as: Supervisor
              captures: { occ1: $.data.occupied_slots }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: Supervisor
          trigger:
            - call: "POST /dispatch/impounds/${imp}/release"
              payload: { disposition: "REDEEMED" }
              as: Supervisor
          assert:
            - "${occ1} == 1"
            - "Kennel.${ken}.occupied_slots == 0"
            - "Impound.${imp}.status == REDEEMED"

      - name: case_outstanding_fines_conserved
        grounds:
          - entities.Case.fields.outstanding_fines_total
          - state_machines.Citation.ISSUED_to_PAID
          - calculations.citation_fine
        distinguishing_aspect: "Conserved quantity = Case.outstanding_fines_total (monetary sum, a different type than the kennel slot count): citation issue (+250.00) paired with pay (-250.00) leaves outstanding_fines_total == sum of ISSUED citation fines == 0.00."
        test_recipe:
          setup:
            - "A stray case is UNDER_INVESTIGATION; one DANGEROUS citation (fine 250.00) is ISSUED so outstanding_fines_total == 250.00."
          setup_api_calls:
            - call: "POST /dispatch/complaints"
              payload: { reporter_name: "R15", reporter_phone: "555-0015", zone: "NORTH", animal_type: "DOG", complaint_type: "STRAY" }
              as: Dispatcher
              captures: { cx: $.data.id }
            - call: "POST /dispatch/officers"
              payload: { name: "Ofc P", badge_number: "B16", territory_zone: "NORTH", shift_start_at: "2026-03-01T00:00:00Z", shift_end_at: "2026-03-02T00:00:00Z" }
              as: Supervisor
              captures: { off: $.data.id }
            - call: "POST /dispatch/cases"
              payload: { complaint_id: "${cx}", assigned_officer_id: "${off}", case_type: "STRAY" }
              as: Supervisor
              captures: { ca: $.data.id }
            - call: "POST /dispatch/cases/${ca}/investigate"
              payload: {}
              as: Supervisor
            - call: "POST /dispatch/citations"
              payload: { case_id: "${ca}", violation_code: "DANGEROUS", issued_to_name: "Owner Z", issued_to_ref: "OWNER-3" }
              as: Supervisor
              captures: { cit: $.data.id }
            - call: "GET /dispatch/cases/${ca}"
              payload: {}
              as: Supervisor
              captures: { out1: $.data.outstanding_fines_total }
          trigger:
            - call: "POST /dispatch/citations/${cit}/pay"
              payload: {}
              as: Dispatcher
          assert:
            - "${out1} == 250.00"
            - "Case.${ca}.outstanding_fines_total == 0.00"
            - "Citation.${cit}.status == PAID"
