            - "trigger call 1: data.status == \"OVERTURNED\" (a Dispute terminal state), data.resolved_by_user_id == \"fa-2\" — fa-1 adjudicated the lot, so segregation of duties forced a different analyst — and data.claimed_face_value_cents == 250 (the 5 rejected items at 50)"
            - "trigger call 2: data.status == \"REINSTATED\", data.reject_reason == null, data.accepted_qty == 5, data.sample_size is still 5 (unchanged by the reinstatement, so the rate is 5/5 == 1.0000 and not 5 over a re-drawn sample), data.projected_accepted_units == 41, data.gross_face_value_cents == 2050, data.handling_fee_cents == 287 == round_half_up(41 * 7 * 1.00)"
            - "trigger call 3: data.settled_gross_face_value_cents == 2100 == 2050 + 50 and data.settled_handling_fee_cents == 294 == 287 + 7, recomputed from both lots"
            - "trigger call 3: data.adjudicated_face_value_cents == 300 is unchanged by the overturn (6 items * 50) while data.rejected_item_face_value_cents falls to 0 and data.accepted_item_face_value_cents rises to 300 — the conservation identity still holds"
            - "trigger call 3: data.rejected_lot_count == 0 after the reinstatement"
            - "trigger call 4: total_count == 5 (the lot_id filter excludes lot Y) and every one of lot X's five items is status \"REINSTATED\" with reject_code null"

      - name: lot_valuation_variants_diverge_on_the_same_counted_coupons
        claim_type: variant_divergence
        grounds:
          - calculations.lot_gross_face_value.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / lot_valuation_full_count_vs_sampled_extrapolation
          rationale: "The named §1.8 instance runs both variants over identical coupon data at the 40/41 counted_qty split and asserts the full gross and fee delta on each side."

      - name: fraud_score_variant_is_selected_by_the_retailer_scoring_mode
        claim_type: variant_selection
        grounds:
          - calculations.retailer_fraud_score.variants
          - entities.Retailer.fields.fraud_scoring_mode
        excluded_because:
          difficulty_instance: dual_variant_calc / retailer_fraud_score_rolling_window_vs_lifetime_weighted
          rationale: "The named §1.8 instance pins which variant fires for each fraud_scoring_mode value and shows the rolling window excluding the out-of-window items the lifetime variant counts."

      - name: sample_size_threshold_at_forty_versus_fortyone_coupons
        claim_type: threshold
        grounds:
          - calculations.lot_sample_size
          - calculations.lot_sample_size.constants.SAMPLE_THRESHOLD_QTY
        excluded_because:
          difficulty_instance: boundary_precision_check / sample_threshold_forty_inclusive_vs_fortyone
          rationale: "The named §1.8 instance tests counted_qty 39, 40 and 41 in one fixture and asserts the inclusive FULL_COUNT boundary plus the ceil-division sample size on the other side."

      - name: watchlist_threshold_sits_exactly_on_the_weighted_seventy
        claim_type: weighted_scoring
        grounds:
          - calculations.retailer_fraud_score
          - calculations.retailer_fraud_score.constants.DUP_WEIGHT
          - calculations.retailer_fraud_score.constants.FRAUD_WATCHLIST_THRESHOLD
        excluded_because:
          difficulty_instance: boundary_precision_check / fraud_rate_rounds_before_weighting_at_watchlist_threshold
          rationale: "The named §1.8 instance builds a pool whose per-code rates must be rounded to 2dp BEFORE weighting to land on exactly 70.00, and asserts the WATCHLIST/ACTIVE flip that a weight-then-round order would miss."

      - name: statement_holdback_fills_the_band_before_the_risk_addon_and_cap
        claim_type: waterfall_allocation
        grounds:
          - calculations.statement_net_payable
          - entities.SettlementStatement.fields.holdback_pct
        excluded_because:
          difficulty_instance: combinatorial_formula / statement_holdback_band_then_riskaddon_then_cap
          rationale: "The named §1.8 instance walks the full band -> risk add-on -> cap chain on one statement and asserts the intermediate holdback_pct as well as the capped net, including the case where the add-on alone would overflow the cap."

      - name: handling_fee_rounds_per_lot_before_the_submission_sum
        claim_type: precision
        grounds:
          - calculations.lot_handling_fee
          - entities.Submission.fields.settled_handling_fee_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / per_lot_handling_fee_round_then_sum
          rationale: "The named §1.8 instance pins the round-then-sum order across three lots whose fractional cents would sum differently if the rounding happened once over the submission."

      - name: manufacturer_funding_ledger_running_total_after_a_reversal
        claim_type: aggregation
        grounds:
          - entities.Manufacturer.fields.funded_total_cents
          - state_machines.ManufacturerInvoice.transitions.FUNDED_to_REVERSED
        excluded_because:
          difficulty_instance: compensating_invariant / funding_reversal_restores_manufacturer_ledger_exactly
          rationale: "The named §1.8 instance asserts the ledger after the add and again after the reversal, proving the running total returns to its pre-funding value with no drift in funding_balance_cents."

  # =====================================================================
  # Table 4 — Validations
  # =====================================================================
  - section: validations
    instances:

      - name: offer_code_uniqueness_survives_withdrawal_and_prefix_uniqueness_is_global
        claim_type: violation_error
        grounds:
          - validations.priority_22.ERR_DUPLICATE_OFFER_CODE
          - validations.priority_22.ERR_DUPLICATE_GS1_PREFIX
        distinguishing_aspect: |
          The offer_code uniqueness scan includes WITHDRAWN offers, so retiring
          SOUP50 does not free the code for reuse under the same manufacturer,
          and the check is case-sensitive so soup50 is a different code that is
          accepted. The gs1_company_prefix check is global rather than scoped:
          a second manufacturer claiming 038000 is refused outright.
        test_recipe:
          setup:
            - "one manufacturer with prefix 038000 holding a WITHDRAWN offer SOUP50"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/withdraw"
              payload: { withdrawn_reason: "Promotion cancelled before launch." }
              as: Manufacturer
              as_user_id: "${mfr_id}"
          trigger:
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 75, handling_fee_cents: 8, expiration_date: "2026-12-31", redemption_instructions: "Save 75c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "soup50", face_value_cents: 75, handling_fee_cents: 8, expiration_date: "2026-12-31", redemption_instructions: "Save 75c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /manufacturers"
              payload: { legal_name: "Rival Brands", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1: 409 with error.code == \"ERR_DUPLICATE_OFFER_CODE\" — the withdrawn offer still occupies the code"
            - "trigger call 2: 201 — uniqueness is case-sensitive, so the lowercase code is a different offer_code (if the constraint's stated character class rejects lowercase, the expected result is 422 ERR_INVALID_REQUEST, never 409)"
            - "trigger call 3: 409 with error.code == \"ERR_DUPLICATE_GS1_PREFIX\" — the prefix is unique across all manufacturers, not per legal_name"

      - name: same_offer_code_under_a_second_manufacturer_passes_and_mints_its_own_barcode
        claim_type: satisfaction_pass
        grounds:
          - validations.priority_22.ERR_DUPLICATE_OFFER_CODE
          - calculations.offer_barcode_payload
        distinguishing_aspect: |
          The scope of the uniqueness rule is (manufacturer_id, offer_code), so
          the identical code under a different manufacturer is accepted and its
          barcode diverges only in the six prefix digits: 8110380000005001261231030
          versus 8110410000005001261231030. Satisfaction is asserted on the minted
          payload, not just on the 201.
        test_recipe:
          setup:
            - "two manufacturers with prefixes 038000 and 041000, each with an offer_code SOUP50 request"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_a: $.data.id }
            - call: "POST /manufacturers"
              payload: { legal_name: "Riverbend Mills", gs1_company_prefix: "041000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_b: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_a}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_a}"
              captures: { offer_a: $.data.id }
            - call: "POST /offers/${offer_a}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_a}"
          trigger:
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_b}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_b}"
              captures: { offer_b: $.data.id }
            - call: "POST /offers/${offer_b}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_b}"
            - call: "GET /offers/${offer_a}"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1: 201 with data.offer_code == \"SOUP50\" and data.manufacturer_id == \"${mfr_b}\" — no 409, the code is manufacturer-scoped"
            - "trigger call 2: 200 with data.status == \"REGISTERED\" and data.barcode_payload == \"8110410000005001261231030\""
            - "trigger call 3: manufacturer A's offer still carries data.barcode_payload == \"8110380000005001261231030\" — the two payloads differ only in the prefix digits"

      - name: auth_ladder_returns_401_then_403_before_existence_on_an_unknown_offer
        claim_type: priority_ordering
        grounds:
          - validations.priority_1.ERR_UNAUTHENTICATED
          - validations.priority_2.ERR_FORBIDDEN_ROLE
          - validations.priority_3.ERR_OFFER_NOT_FOUND
        distinguishing_aspect: |
          Three rules are violated by one request — no headers, wrong role, and a
          path id that does not exist — and the answer walks the ladder strictly:
          401 first, then 403 once headers are present, and only a correctly-roled
          caller gets to see the 404. An implementation that loads the entity
          before authorising leaks existence information at step 2.
        test_recipe:
          setup:
            - "an empty database; no offer with the probe id 00000000-0000-4000-8000-000000000000 exists"
          setup_api_calls: []
          trigger:
            - call: "POST /offers/00000000-0000-4000-8000-000000000000/activate"
              payload: {}
              as: NONE
              as_user_id: "NONE"
            - call: "POST /offers/00000000-0000-4000-8000-000000000000/activate"
              payload: {}
              as: Retailer
              as_user_id: "ret-unknown"
            - call: "POST /offers/00000000-0000-4000-8000-000000000000/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1 (X-User-ID and X-User-Role both omitted): 401 with error.code == \"ERR_UNAUTHENTICATED\""
            - "trigger call 2: 403 with error.code == \"ERR_FORBIDDEN_ROLE\" — Retailer is not in the activate roles list, and the unknown id is NOT reported"
            - "trigger call 3: 404 with error.code == \"ERR_OFFER_NOT_FOUND\" — only the authorised role reaches the existence check"

      - name: channel_capability_gates_intake_only_for_the_contracted_channels
        claim_type: conditional_validation
        grounds:
          - validations.priority_23.ERR_CHANNEL_NOT_SUPPORTED
          - entities.Retailer.fields.channel_capability
        distinguishing_aspect: |
          The rule is conditional on a per-retailer flag, so the same MAIL body
          is a 422 for the ELECTRONIC_ONLY retailer and a 201 for the BOTH
          retailer. Postmark windows are required on both channels, so the
          ELECTRONIC path still supplies them and the 422 can only come from the
          capability check.
        test_recipe:
          setup:
            - "retailer E contracted ELECTRONIC_ONLY and retailer D on the default BOTH"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { legal_name: "E-Clear Grocers", channel_capability: "ELECTRONIC_ONLY" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_e: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_d: $.data.id }
          trigger:
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_e}", channel: "MAIL", declared_count: 5, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_e}", channel: "ELECTRONIC", declared_count: 5, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_d}", channel: "MAIL", declared_count: 5, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "GET /retailers/${ret_d}"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1: 422 with error.code == \"ERR_CHANNEL_NOT_SUPPORTED\""
            - "trigger call 2: 201 with data.channel == \"ELECTRONIC\", data.intake_status == \"RECEIVED\", data.settlement_status == \"PENDING\""
            - "trigger call 3: 201 — the BOTH retailer accepts the very same MAIL body that failed for retailer E"
            - "trigger call 4 (a GET on the retailer): data.channel_capability == \"BOTH\" from the declared default, confirming the flag was never supplied"

      - name: lot_and_capture_aggregates_are_refused_whole_not_partially
        claim_type: aggregate_validation
        grounds:
          - validations.priority_26.ERR_LOT_COUNT_OVERFLOW
          - validations.priority_29.ERR_LOT_CAPTURE_COMPLETE
        distinguishing_aspect: |
          Each individual request is legal in isolation; only the running total
          breaks the rule. Two lots of 6 and 4 exhaust a verified_count of 10 so
          a third lot of 1 is refused, and a 3-element image batch against a lot
          that already holds 2 of its 4 images is refused as a whole (2 + 3 > 4),
          leaving captured_item_count at 2 rather than topping it up to 4 with
          the two slots that were free.
        test_recipe:
          setup:
            - "one submission verified at 10, with lots of 6 and 4 already sorted"
            - "the 4-coupon lot has 2 of its 4 images captured"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 10, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/verify-count"
              payload: { verified_count: 10 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 6 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_big: $.data.id }
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 4 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_small: $.data.id }
            - call: "POST /submission-lots/${lot_small}/items"
              payload: { items: [ { scanned_barcode: "8110380000005001261231030", image_uri: "s3://k/1.jpg", redeemed_at: "2026-07-05" }, { scanned_barcode: "8110380000005001261231030", image_uri: "s3://k/2.jpg", redeemed_at: "2026-07-05" } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submission-lots/${lot_small}/items"
              payload: { items: [ { scanned_barcode: "8110380000005001261231030", image_uri: "s3://k/3.jpg", redeemed_at: "2026-07-05" }, { scanned_barcode: "8110380000005001261231030", image_uri: "s3://k/4.jpg", redeemed_at: "2026-07-05" }, { scanned_barcode: "8110380000005001261231030", image_uri: "s3://k/5.jpg", redeemed_at: "2026-07-05" } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "GET /submission-lots/${lot_small}"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "GET /coupon-items?lot_id=${lot_small}&limit=10"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-1"
          assert:
            - "trigger call 1: 422 with error.code == \"ERR_LOT_COUNT_OVERFLOW\" — 6 + 4 + 1 > verified_count 10, even though a lot of 1 is otherwise perfectly legal"
            - "trigger call 2: 409 with error.code == \"ERR_LOT_CAPTURE_COMPLETE\" — captured_item_count 2 + 3 supplied > sample_size 4"
            - "trigger call 3: data.captured_item_count is still 2 and data.sample_size == 4 — the batch was refused as a whole, not truncated to the two slots that were free"
            - "trigger call 4: total_count == 2, so no CouponItem row from the refused batch survived"
            - "trigger call 5: data.sorted_lot_count == 2 and data.declared_face_value_cents == 500 — the refused lot never existed"

      - name: state_check_outranks_the_sample_readiness_check_on_finalize
        claim_type: cascading_validation
        grounds:
          - validations.priority_8.ERR_INVALID_STATE_TRANSITION
          - validations.priority_30.ERR_SAMPLE_INCOMPLETE
        distinguishing_aspect: |
          The same endpoint yields two different errors depending on which check
          can even be evaluated: while the lot is SORTED but under-imaged the
          answer is the priority-30 readiness error, and once the lot is
          VALIDATED the priority-8 state check answers first even though the
          sample is complete. The order matters because a naive implementation
          re-runs the readiness check on a finalized lot and returns 422
          ERR_SAMPLE_INCOMPLETE for a lot that is in fact fully imaged.
        test_recipe:
          setup:
            - "one submission verified at 3 with two lots: lot_partial counted 2 but only 1 of its 2 images captured, and lot_done counted 1 with its single image captured"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-1", transaction_date: "2026-07-05", qualifying_units: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 3, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/verify-count"
              payload: { verified_count: 3 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_partial: $.data.id }
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_done: $.data.id }
            - call: "POST /submission-lots/${lot_partial}/items"
              payload: { items: [ { scanned_barcode: "8110380000005001261231030", image_uri: "s3://c/1.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-1" } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submission-lots/${lot_done}/items"
              payload: { items: [ { scanned_barcode: "8110380000005001261231030", image_uri: "s3://c/2.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-1" } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
          trigger:
