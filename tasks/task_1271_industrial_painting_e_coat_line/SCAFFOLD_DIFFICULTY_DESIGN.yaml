# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Task 1271: Industrial Painting & E-Coat Line
# §1.8 Test Targeting Index — 9 Difficulty Rules × 2 instances each.
# All numeric asserts are literals computed from SCAFFOLD.yaml §1.3 formulas.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: purge_allocation_full_vs_prorata_diverge
        grounds:
          - calculations.purge_cost_and_allocation
          - entities.PaintLine.fields.allocation_policy
          - entities.Lot.fields.purge_alloc_cents
        distinguishing_aspect: |
          Cost-accounting dual variant on ColorChange/Lot: the identical purge cost
          (23250 cents for 25.0 L) is allocated 100% to one lot under FULL_TO_NEXT_LOT
          but split 5813/17437 across two lots under PRO_RATA_BY_PARTS — same input,
          different per-lot charges, on a different entity domain than the VOC variant.
        test_recipe:
          setup:
            - "Customer C1; spec SY color RAL1018 (film 18-30, area 12, voc 320); spec SG color RAL3000 (same numbers)"
            - "Line LF (current RAL9005, FULL_TO_NEXT_LOT); line LP (current RAL9005, PRO_RATA_BY_PARTS)"
            - "Permit 2026-05 cap 500.0 kg"
            - "Lot LF1 (SY, qty 100, QUEUED); lot LA (SG, qty 100, QUEUED, created at 00:00); lot LB (SG, qty 300, QUEUED, created at 01:00)"
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL1018", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec_y: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL3000", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec_g: $.data.id }
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L-FULL", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line_f: $.data.id }
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L-PRO", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "PRO_RATA_BY_PARTS" }
              as: PlantAdmin
              captures: { line_p: $.data.id }
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec_y}", part_quantity: 100 }
              as: LineScheduler
              captures: { lot_f1: $.data.id }
            - call: "POST /ecoat/lots/${lot_f1}/accept"
              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec_g}", part_quantity: 100 }
              as: LineScheduler
              captures: { lot_a: $.data.id }
            - call: "POST /ecoat/lots/${lot_a}/accept"
              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T01:00:00Z" }
              as: PlantAdmin
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec_g}", part_quantity: 300 }
              as: LineScheduler
              captures: { lot_b: $.data.id }
            - call: "POST /ecoat/lots/${lot_b}/accept"
              payload: {}
              as: LineScheduler
          trigger:
            - call: "POST /ecoat/color-changes"
              payload: { paint_line_id: "${line_f}", to_color_code: "RAL1018", purge_solvent_liters: 25.0, window_start_utc: "2026-05-06T08:00:00Z", window_end_utc: "2026-05-06T09:00:00Z" }
              as: LineScheduler
              captures: { cc_f_cost: $.data.purge_cost_cents }
            - call: "POST /ecoat/color-changes"
              payload: { paint_line_id: "${line_p}", to_color_code: "RAL3000", purge_solvent_liters: 25.0, window_start_utc: "2026-05-06T08:00:00Z", window_end_utc: "2026-05-06T09:00:00Z" }
              as: LineScheduler
              captures: { cc_p_cost: $.data.purge_cost_cents }
          assert:
            - "ColorChange on line LF purge_cost_cents == 23250 and on line LP == 23250 (identical input cost)"
            - "Lot.${lot_f1}.purge_alloc_cents == 23250 (FULL_TO_NEXT_LOT: earliest-created QUEUED lot of the new color absorbs 100%)"
            - "Lot.${lot_a}.purge_alloc_cents == 5813 (round_half_up(23250 × 100/400))"
            - "Lot.${lot_b}.purge_alloc_cents == 17437 (remainder: 23250 − 5813 — no rounding drift)"
            - "5813 + 17437 == 23250 while Lot.${lot_a} under FULL would have differed: variants diverge for identical inputs"

      - name: voc_metered_vs_theoretical_diverge
        grounds:
          - calculations.voc_emission_metered
          - calculations.voc_emission_theoretical
          - entities.EmissionEntry.fields.entry_variant
          - entities.RunSlot.fields.voc_projected_kg
        distinguishing_aspect: |
          Environmental-accounting dual variant on VocPermit/EmissionEntry: one physical
          run yields a THEORETICAL reservation of 0.277 kg (part area × film window) and a
          METERED posting of 0.304 kg (0.95 L × 320 g/L) — different kg for identical
          production, on a different entity domain than purge cost allocation.
        test_recipe:
          setup:
            - "Customer, spec (RAL9005, film 18-30, area 12, voc 320), line (speed 10.0, cap 60, FULL), stage 20-30 gpl IN_RANGE, oven, permit cap 500.0"
            - "Lot qty 100 QUEUED"
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec1: $.data.id }
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
            - call: "POST /ecoat/cure-ovens"
              payload: { name: "OV-1", max_loads: 2 }
              as: PlantAdmin
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
              captures: { perm1: $.data.id }
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}", part_quantity: 100 }
              as: LineScheduler
              captures: { lot1: $.data.id }
            - call: "POST /ecoat/lots/${lot1}/accept"
              payload: {}
              as: LineScheduler
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv: $.data.version }
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot1}", start_utc: "2026-05-05T08:00:00Z", end_utc: "2026-05-05T10:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv}" }
              as: LineScheduler
              captures: { slot1: $.data.id, slot1_proj: $.data.voc_projected_kg }
            - call: "POST /ecoat/run-slots/${slot1}/start"
              payload: {}
              as: LineScheduler
          trigger:
            - call: "POST /ecoat/run-slots/${slot1}/complete"
              payload: { paint_used_liters: 0.95 }
              as: LineScheduler
          assert:
            - "RunSlot.${slot1}.voc_projected_kg == 0.277 (THEORETICAL: 100 × 12 dm² × 24 µm avg / (0.35 × 0.95) × 320 g/L)"
            - "EmissionEntry for lot ${lot1} has entry_variant METERED and voc_kg == 0.304 (0.95 L × 320 / 1000)"
            - "0.304 != 0.277 — the two variants disagree for the same physical run"
            - "VocPermit.${perm1}.used_kg == 0.304 and reserved_kg == 0.0 after completion"

  # ---------------------------------------------------------------- Rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: film_build_tiered_density_speed_interaction
        grounds:
          - calculations.film_build_estimation
          - entities.RunSlot.fields.predicted_film_build_um
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — parts_per_hanger selects a
          tiered density factor (1.00 / 0.95 / 0.88), divides into FILM_TRANSFER_K / line
          speed, and the result must clear a two-sided inclusive spec window; crossing the
          20→21 parts-per-hanger tier boundary at constant speed drops prediction 22.0 → 20.9.
        test_recipe:
          setup:
            - "Customer, spec (film 18-30, voc 320, area 12), line (speed 10.0, hanger cap 60), stage IN_RANGE, permit cap 500.0"
            - "Lots LX and LY, qty 50 each, QUEUED"
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec1: $.data.id }
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}", part_quantity: 50 }
              as: LineScheduler
              captures: { lot_x: $.data.id }
            - call: "POST /ecoat/lots/${lot_x}/accept"
              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}", part_quantity: 50 }
              as: LineScheduler
              captures: { lot_y: $.data.id }
            - call: "POST /ecoat/lots/${lot_y}/accept"
              payload: {}
              as: LineScheduler
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv1: $.data.version }
          trigger:
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot_x}", start_utc: "2026-05-05T08:00:00Z", end_utc: "2026-05-05T09:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv1}" }
              as: LineScheduler
              captures: { slot_x: $.data.id, film_x: $.data.predicted_film_build_um }
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv2: $.data.version }
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot_y}", start_utc: "2026-05-05T09:00:00Z", end_utc: "2026-05-05T10:00:00Z", parts_per_hanger: 21, expected_paint_line_version: "${lv2}" }
              as: LineScheduler
              captures: { slot_y: $.data.id, film_y: $.data.predicted_film_build_um }
          assert:
            - "RunSlot.${slot_x}.predicted_film_build_um == 22.0 (220.0 / 10.0 × 1.00, tier-1 density)"
            - "RunSlot.${slot_y}.predicted_film_build_um == 20.9 (220.0 / 10.0 × 0.95, tier-2 density from part 21)"
            - "Both slots created (22.0 and 20.9 inside [18.0, 30.0]); the single-part density step changes the prediction at constant line speed"

      - name: rework_charge_per_part_rounding_pinned
        grounds:
          - calculations.rework_charge
          - entities.ReworkOrder.fields.repaint_charge_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — per-part repaint rounds to whole cents
          FIRST (round_half_up(12 × 85 × 1.33) = 1357) then multiplies by 95 repainted
          parts = 128915; the alternative multiply-then-round order gives 128877.
          A different combinatorial mode than film_build's tiered-threshold formula.
        test_recipe:
          setup:
            - "Customer, spec (film 18-30, area 12, adhesion_min 2), line, stage, oven, permit cap 500.0"
            - "Lot qty 100 run to QC_PENDING, adhesion test FAIL (measured 1) → QC_HOLD with ReworkOrder DRAFT (parts_to_rework 100)"
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec1: $.data.id }
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
            - call: "POST /ecoat/cure-ovens"
              payload: { name: "OV-1", max_loads: 2 }
              as: PlantAdmin
              captures: { oven1: $.data.id }
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
              captures: { perm1: $.data.id }
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}", part_quantity: 100 }
              as: LineScheduler
              captures: { lot1: $.data.id }
            - call: "POST /ecoat/lots/${lot1}/accept"
              payload: {}
              as: LineScheduler
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv: $.data.version }
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot1}", start_utc: "2026-05-05T08:00:00Z", end_utc: "2026-05-05T10:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv}" }
              as: LineScheduler
              captures: { slot1: $.data.id }
            - call: "POST /ecoat/run-slots/${slot1}/start"
              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/run-slots/${slot1}/complete"
              payload: { paint_used_liters: 0.95 }
              as: LineScheduler
            - call: "POST /ecoat/oven-cycles"
              payload: { lot_id: "${lot1}", oven_id: "${oven1}", entered_at: "2026-05-05T10:05:00Z", exited_at: "2026-05-05T10:45:00Z", min_metal_temp_c: 182.0, minutes_at_or_above_temp: 22 }
              as: QcInspector
              as_user_id: qc-1
            - call: "POST /ecoat/quality-tests"
              payload: { lot_id: "${lot1}", test_type: "ADHESION", measured_value: 1 }
              as: QcInspector
              as_user_id: qc-1
            - call: "GET /ecoat/lots/${lot1}/rework-orders"
              as: QualityManager
              captures: { ro1: "$.data[0].id" }
            - call: "POST /ecoat/rework-orders/${ro1}/approve"
              payload: {}
              as: QualityManager
          trigger:
            - call: "POST /ecoat/rework-orders/${ro1}/complete-strip"
              payload: { scrapped_quantity: 5 }
              as: QualityManager
          assert:
            - "ReworkOrder.${ro1}.strip_cost_cents == 55000 (25000 + 300 × 100)"
            - "ReworkOrder.${ro1}.repaint_charge_cents == 128915 (1357 per part × 95; NOT 128877 from multiply-then-round)"
            - "ReworkOrder.${ro1}.total_charge_cents == 183915"
            - "Lot.${lot1}.status == QUEUED and rework_count == 1 and scrapped_quantity == 5"
            - "VocPermit.${perm1}.used_kg == 43.054 (0.304 metered + 42.750 strip solvent for 95 parts)"

  # ---------------------------------------------------------------- Rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: lot_rework_cycle_returns_to_queued
        grounds:
          - state_machines.Lot.QC_HOLD_to_STRIPPING
          - state_machines.Lot.STRIPPING_to_QUEUED
          - state_machines.Lot.QC_PENDING_to_QC_HOLD
        distinguishing_aspect: |
          Cyclic machine on Lot: QUEUED → SCHEDULED → ON_LINE → CURING → QC_PENDING →
          QC_HOLD → STRIPPING → QUEUED completes a full rework loop back to a previously
          visited state (rework_count 1), with SCRAPPED/RELEASED as loop escapes —
          a non-linear shape on a different entity than PretreatmentStage.
        test_recipe:
          setup:
            - "Customer, spec (impact_min 40.0), line, stage, oven, permit cap 500.0"
            - "Lot qty 100 run to QC_PENDING"
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec1: $.data.id }
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
            - call: "POST /ecoat/cure-ovens"
              payload: { name: "OV-1", max_loads: 2 }
              as: PlantAdmin
              captures: { oven1: $.data.id }
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}", part_quantity: 100 }
              as: LineScheduler
              captures: { lot1: $.data.id }
            - call: "POST /ecoat/lots/${lot1}/accept"
              payload: {}
              as: LineScheduler
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv: $.data.version }
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot1}", start_utc: "2026-05-05T08:00:00Z", end_utc: "2026-05-05T10:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv}" }
              as: LineScheduler
              captures: { slot1: $.data.id }
            - call: "POST /ecoat/run-slots/${slot1}/start"
              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/run-slots/${slot1}/complete"
              payload: { paint_used_liters: 0.95 }
              as: LineScheduler
            - call: "POST /ecoat/oven-cycles"
              payload: { lot_id: "${lot1}", oven_id: "${oven1}", entered_at: "2026-05-05T10:05:00Z", exited_at: "2026-05-05T10:45:00Z", min_metal_temp_c: 182.0, minutes_at_or_above_temp: 22 }
              as: QcInspector
              as_user_id: qc-1
          trigger:
            - call: "POST /ecoat/quality-tests"
              payload: { lot_id: "${lot1}", test_type: "IMPACT", measured_value: 10.0 }
              as: QcInspector
              as_user_id: qc-1
            - call: "GET /ecoat/lots/${lot1}/rework-orders"
              as: QualityManager
              captures: { ro1: "$.data[0].id" }
            - call: "POST /ecoat/rework-orders/${ro1}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /ecoat/rework-orders/${ro1}/complete-strip"
              payload: { scrapped_quantity: 0 }
              as: QualityManager
          assert:
            - "After IMPACT FAIL: Lot.${lot1}.status == QC_HOLD and a DRAFT ReworkOrder exists (cascade)"
            - "After approve: Lot.${lot1}.status == STRIPPING"
            - "After complete-strip: Lot.${lot1}.status == QUEUED — the cycle closed back to a prior state"
            - "Lot.${lot1}.rework_count == 1 and scrapped_quantity == 0"
            - "ReworkOrder.${ro1}.repaint_charge_cents == 135700 (1357 × 100) and total_charge_cents == 190700"

      - name: pretreatment_stage_compliance_cycle
        grounds:
          - state_machines.PretreatmentStage.IN_RANGE_to_OUT_OF_RANGE
          - state_machines.PretreatmentStage.OUT_OF_RANGE_to_ADJUSTING
          - state_machines.PretreatmentStage.ADJUSTING_to_IN_RANGE
        distinguishing_aspect: |
          Cyclic machine on PretreatmentStage: IN_RANGE → OUT_OF_RANGE → ADJUSTING →
          IN_RANGE — a compliance loop on a different entity than Lot, with a forbidden
          direct edge (OUT_OF_RANGE never returns to IN_RANGE without an adjustment).
        test_recipe:
          setup:
            - "Line L1 with one stage (20.0-30.0 gpl), posture RUNNING"
          setup_api_calls:
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /ecoat/titration-readings"
              payload: { stage_id: "${st1}", measured_conc_gpl: 19.9 }
              as: ProcessChemist
              as_user_id: chem-1
              captures: { rd_low: $.data.in_range }
            - call: "POST /ecoat/pretreatment-stages/${st1}/adjustments"
              payload: { chemical_added_kg: 2.5 }
              as: ProcessChemist
              as_user_id: chem-1
            - call: "POST /ecoat/titration-readings"
              payload: { stage_id: "${st1}", measured_conc_gpl: 25.0 }
              as: ProcessChemist
              as_user_id: chem-1
              captures: { rd_ok: $.data.in_range }
          assert:
            - "First reading in_range == false; PretreatmentStage.${st1}.status == OUT_OF_RANGE"
            - "After adjustment: PretreatmentStage.${st1}.status == ADJUSTING (still not schedulable)"
            - "Second reading in_range == true; PretreatmentStage.${st1}.status == IN_RANGE — cycle closed"
            - "PaintLine.${line1}.posture == RUNNING again after the loop (was CHEM_HOLD between)"

  # ---------------------------------------------------------------- Rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: permit_closeout_adjustment_exceeds_cap_cascade
        grounds:
          - state_machines.VocPermit.ACTIVE_to_CLOSED
          - state_machines.VocPermit.ACTIVE_to_EXCEEDED
          - calculations.voc_closeout_reconciliation
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /voc-permits/{id}/close: close creates the
          CLOSEOUT_ADJUSTMENT EmissionEntry (+0.532 kg); that entry recomputes
          VocPermit.used_kg to 3.212; that recompute flips status ACTIVE → EXCEEDED.
          Different triggering transition than the titration cascade.
        test_recipe:
          setup:
            - "Customer, spec (film 18-30, area 12, voc 320), line, stage, oven"
            - "Permit cap 3.000 kg; lot qty 1000 run COMPLETED with 7.0 L metered (used 2.240)"
            - "Color change with 0.5 L purge posted (used 2.680); clock advanced past period_end"
          setup_api_calls:
            - call: "POST /ecoat/customers"
