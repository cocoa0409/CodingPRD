  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: campaign_patch_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[campaign-settings-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential settings edits: the second writer's stale expected_campaign_version is rejected with 412 ERR_STALE_VERSION; no state precondition can see this."
        test_recipe:
          setup: ["campaign DRAFT; client captured version 1 at creation"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
              payload: { name: "Fall Sale", school_name: "Lincoln", order_window_start: "2026-08-01T00:00:00Z", order_window_end: "2026-08-20T00:00:00Z", expected_delivery_date: "2026-09-05T00:00:00Z", default_profit_share_bps: 5000 }
              as: FundraiserAdmin
              captures: { camp: $.data.id, camp_v: $.data.version }
          trigger:
            - call: "PATCH /fundraiser/campaigns/${camp}"
              payload: { expected_campaign_version: "${camp_v}", name: "Fall Sale v2" }
              as: FundraiserAdmin
              captures: { camp_v2: $.data.version }
            - call: "PATCH /fundraiser/campaigns/${camp}"
              payload: { expected_campaign_version: "${camp_v}", school_name: "Washington" }
              as: FundraiserAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "camp_v2 == 2 after the first patch"
            - "err_id == ERR_STALE_VERSION and HTTP status == 412 (the stale write carried version 1)"
            - "Campaign.${camp}.school_name remains Lincoln (rejected patch applied nothing)"

