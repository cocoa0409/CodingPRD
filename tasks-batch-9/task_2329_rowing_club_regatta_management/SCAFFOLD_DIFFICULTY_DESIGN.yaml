              as: SafetyOfficer
              as_user_id: "${officer_id}"
            - call: "POST /boathouse/water-sessions/${s1_id}/launch"
              payload: {}
              as: SafetyOfficer
              as_user_id: "${officer_id}"
            - call: "POST /boathouse/water-sessions/${s1_id}/return"
              payload: {}
              as: SafetyOfficer
