# =============================================================================
# Gym Membership Management API — Scaffold Difficulty Design (§1.8)
# Test Targeting Index — cross-references §1.1–§1.7 against the nine
# Difficulty Rules defined in SKILL.md §0.5.
# =============================================================================

scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: payment_charge_first_attempt_vs_retry
        grounds:
          - calculations.subscription_charge_amount
          - calculations.subscription_charge_amount.variants[first_attempt_of_period]
          - calculations.subscription_charge_amount.variants[retry_attempt_after_failure]
          - state_machines.Subscription.PAST_DUE_to_ACTIVE
          - entities.PaymentAttempt.fields.amount_cents
        distinguishing_aspect: |
          Both variants operate on the Subscription/PaymentAttempt fiscal domain
          but produce different cent values for identical PaymentAttempt inputs:
          attempt #1 applies wallet_credit_cents at full balance, attempt #2 (a
          retry within the same period) MUST resubmit the amount_cents already
          computed on attempt #1 without re-applying wallet credit. Same Member,
          same Subscription, same base price, two cents results.
        test_recipe:
          setup:
            - "Create Member m1 (state_code=CA) with wallet_credit_cents=500"
            - "Create Subscription s1 for m1 with plan=PLUS, base_price_cents=4900, auto_renew=true"
            - "Advance clock to current_period_end so first auto-renew attempt fires"
          trigger:
            - "POST /members/m1/subscriptions/s1/payment-attempts {idempotency_key=k1, outcome=FAILED}"
            - "POST /members/m1/subscriptions/s1/payment-attempts {idempotency_key=k2, outcome=FAILED}"
          assert:
            - "First PaymentAttempt.amount_cents == 4400  # 4900 - min(500, 4900) wallet credit"
            - "Second PaymentAttempt.amount_cents == 4400  # retry resubmits the same amount; wallet credit NOT re-applied"
            - "Member.wallet_credit_cents == 0 after first attempt and remains 0 after the retry"

      - name: booking_refund_voluntary_vs_admin_cascade
        grounds:
          - calculations.booking_final_price_and_refund
          - calculations.booking_final_price_and_refund.variants[voluntary_member_cancel]
          - calculations.booking_final_price_and_refund.variants[admin_or_cascade_cancel]
          - state_machines.Booking.RESERVED_to_CANCELLED
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Both variants operate on the Booking lifecycle domain (separate from
          subscription fiscal domain above) but produce different refund cents
          for the same Booking inputs: voluntary cancel by the Member 1 hour
          before class on a CA YOGA booking (provisional_price=2000) yields a
          refund_credit of 0 (hours_to_start=1 < 2-hour threshold), while a
          cascade cancel triggered by ClassSession.cancel for the SAME booking
          uses the ADMIN schedule and yields a full 2000 refund.
        test_recipe:
          setup:
            - "Create Store st1 in CA, ClassSession cs1 (YOGA, capacity=10, starts_at=T+1h)"
            - "Create two Members m1 and m2 (state_code=CA, posture OPEN), each books cs1, both get RESERVED with provisional_price_cents=2000"
            - "Advance clock to T+0 so hours_to_start for both bookings is exactly 1.0"
          trigger:
            - "POST /members/m1/bookings/b1/cancel"
            - "POST /stores/st1/class-sessions/cs1/cancel"
          assert:
            - "m1's Booking.final_price_cents == 2000  # voluntary, hours_to_start=1<2 → refund_pct=0"
            - "m1's Member.wallet_credit_cents == 0   # no credit delta"
            - "m2's Booking.final_price_cents == 0    # admin cascade → 100% refund regardless of hours_to_start"
            - "m2's Member.wallet_credit_cents == 2000"

  # -------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pt_pricing_nonlinear_multi_input  # mode (a)
        grounds:
          - calculations.booking_provisional_price
          - entities.Trainer.fields.hourly_rate_cents
          - entities.Member.fields.tier
          - entities.ClassSession.fields.starts_at
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs (duration, trainer hourly rate, member
          tier discount, late-booking surcharge gate on hours_to_start) and a
          non-linear interaction: the surcharge percentage is applied AFTER the
          tier discount, so a different ordering (surcharge first, tier later)
          produces a different cent value. The formula pins ROUNDING_ORDER.
        test_recipe:
          setup:
            - "Create Trainer t1 with hourly_rate_cents=8000"
            - "Create Member m1 (tier=PLUS, posture OPEN)"
            - "Advance clock to T0; book a PT session starting at T0+90min, ends at T0+120min (30-minute session)"
          trigger:
            - "POST /members/m1/bookings {booking_kind=PERSONAL_TRAINING, trainer_id=t1, starts_at=T0+90min, ends_at=T0+120min}"
          assert:
            - "Booking.provisional_price_cents == 4500  # ceil(8000*30/60)=4000; tier=10% → 4000-400=3600; hours_to_start=1.5<2 → surcharge=round(3600*25/100)=900; total=3600+900=4500"

      - name: payment_charge_nested_rounding_order  # mode (b)
        grounds:
          - calculations.subscription_charge_amount
          - entities.Coupon.fields.kind
          - entities.Coupon.fields.value
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins
          the order: (1) compute PERCENT_OFF coupon discount with round_half_up
          on the per-line product gross*pct/100, (2) subtract the rounded
          discount from gross to get net_after_coupon, (3) THEN apply wallet
          credit, (4) THEN floor at 0. A reorder that applies wallet credit
          before subtracting the coupon discount produces a different
          amount_cents for the same inputs.
        test_recipe:
          setup:
            - "Create promotional Coupon c1 (kind=PERCENT_OFF, value=15, applicable_to=SUBSCRIPTION, max_redemptions=100)"
            - "Create Member m1 with wallet_credit_cents=300"
            - "Create Subscription s1 plan=ELITE with base_price_cents=9999, applied_coupon_id=c1"
            - "Trigger first-attempt charge"
          trigger:
            - "POST /members/m1/subscriptions/s1/payment-attempts {idempotency_key=k1, outcome=SUCCESS}"
          assert:
            - "PaymentAttempt.amount_cents == 8199  # pinned order: discount = rhu(9999*15/100)=1500; net_after_coupon=8499; apply wallet 300; amount=8199. A wrong order that applies wallet BEFORE the discount would yield rhu((9999-300)*15/100)=1455; 9699-1455=8244 ≠ 8199."
            - "Member.wallet_credit_cents == 0  # 300 fully consumed"

      - name: payment_charge_rounding_order_divergent  # mode (b) reinforcement
        grounds:
          - calculations.subscription_charge_amount
          - entities.Coupon.fields.value
          - entities.Subscription.fields.base_price_cents
        distinguishing_aspect: |
          Inputs chosen so the pinned-order result and the round-at-the-end
          result DIVERGE by exactly 1 cent, proving the scaffold's pinned
          rounding ORDER is observable on its own (not a coincidence on
          divisible inputs). Pinned order (round per discount step, then
          subtract): with base=1050 and PERCENT_OFF value=7:
              discount = round_half_up(1050 * 7 / 100) = round_half_up(73.5) = 74
              net = 1050 - 74 = 976
          Alternative "round at the very end" order:
              net = round_half_up(1050 * 93 / 100) = round_half_up(976.5) = 977
          A wrong implementation that re-orders rounding produces 977 instead
          of 976. The test pins 976 as the correct, observable answer.
        test_recipe:
          setup:
            - "Coupon c_div (PERCENT_OFF, value=7, applicable_to=SUBSCRIPTION, max_redemptions=100)"
            - "Member m1 wallet_credit_cents=0"
            - "Subscription s_div plan=BASIC base_price_cents=1050, applied_coupon_id=c_div"
          trigger:
            - "POST /members/m1/subscriptions/s_div/payment-attempts {idempotency_key=k_div, outcome=SUCCESS}"
          assert:
            - "PaymentAttempt.amount_cents == 976  # pinned: rhu(1050*7/100)=74, net 1050-74=976. The wrong end-rounding order would yield 977."

      - name: subscription_charge_circular_evaluation_order  # mode (c)
        grounds:
          - calculations.subscription_charge_amount
          - calculations.late_payment_penalty
          - entities.Member.fields.wallet_credit_cents
          - state_machines.Subscription.PAST_DUE_to_GRACE
        distinguishing_aspect: |
          Mode (c): apparent circular dependency. The next PaymentAttempt's
          amount_cents depends on wallet_credit_cents; wallet_credit_cents was
          just decremented by late_payment_penalty when the Subscription
          entered GRACE; the penalty itself depends on base_price_cents which
          is pinned at activation and immutable. The scaffold pins the
          evaluation order: (1) late_payment_penalty fires on PAST_DUE→GRACE,
          (2) wallet_credit_cents is updated, (3) the NEXT attempt reads the
          new wallet_credit_cents. Doing it in reverse would double-count or
          miss the penalty.
        test_recipe:
          setup:
            - "Member m1 state_code=CA, wallet_credit_cents=0"
            - "Subscription s1 plan=PLUS base_price_cents=4900, status=PAST_DUE, failed_payment_attempts=2"
          trigger:
            - "POST /members/m1/subscriptions/s1/payment-attempts {idempotency_key=k3, outcome=FAILED}  # attempt #3 = RETRY_LIMIT → GRACE"
          assert:
            - "Subscription.status == GRACE"
            - "Member.wallet_credit_cents == -245  # round_half_up(4900*5/100) for CA"
            - "Next PaymentAttempt computed for s1 would have amount_cents == 4900 - 0 + 245 (penalty added back) — verified by another trigger if needed"

  # -------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: member_parallel_billing_and_access_axes
        grounds:
          - state_machines.Member.billing_status
          - state_machines.Member.access_status
          - entities.Member.fields.account_posture
          - calculations.account_posture
        distinguishing_aspect: |
          Member has two parallel state dimensions on the same row that evolve
          independently — billing_status (CURRENT/PAST_DUE/GRACE/DELINQUENT/
          REINSTATED) and access_status (ACTIVE/SUSPENDED/FROZEN/CANCELLED).
          A single Member can be (billing_status=PAST_DUE, access_status=
          SUSPENDED) where each axis transitioned via independent triggers.
          The derived account_posture is the cross-product gate. This is the
          parallel-dimensions non-linear shape.
        test_recipe:
          setup:
            - "Create Member m1 (state=CA), Subscription s1 ACTIVE"
            - "Advance clock past current_period_end so first attempt of new period FAILS (billing_status → PAST_DUE)"
          trigger:
            - "POST /members/m1/suspend  # access_status → SUSPENDED, independent of billing axis"
          assert:
            - "Member.billing_status == PAST_DUE"
            - "Member.access_status == SUSPENDED"
            - "Member.account_posture == FROZEN  # access dimension wins over billing per formula"

      - name: booking_cyclic_waitlist_to_reserved
        grounds:
          - state_machines.Booking.WAITLISTED_to_RESERVED
          - state_machines.Booking.RESERVED_to_CANCELLED
          - calculations.waitlist_promotion
          - entities.ClassSession.fields.reserved_seat_count
        distinguishing_aspect: |
          Booking has branching with revert plus an effective cycle through
          waitlist promotion: a Booking enters WAITLISTED, then a sibling's
          cancellation promotes it to RESERVED; if it then cancels, it does
          NOT go back to WAITLISTED, but a different waitlisted Booking can
          step into RESERVED. The promotion path creates a fork-join shape:
          the cancel transition forks into (refund computation, capacity
          decrement, waitlist promotion side-effect set) all of which must run
          in pinned order. Different entity from Member's parallel axes above.
        test_recipe:
          setup:
            - "ClassSession cs1 (capacity=1, YOGA). Create Member m1 books cs1 → RESERVED. Create Member m2 books cs1 → WAITLISTED (position=1). Create Member m3 books cs1 → WAITLISTED (position=2)."
          trigger:
            - "POST /members/m1/bookings/b1/cancel"
          assert:
            - "Booking(m2).status == RESERVED  # promoted, smallest created_at among WAITLISTED with posture OPEN"
            - "Booking(m2).waitlist_position == null"
            - "Booking(m3).status == WAITLISTED  # still waiting"
            - "Booking(m3).waitlist_position == 1  # repositioned"
            - "ClassSession.reserved_seat_count == 1"

  # -------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: payment_failure_to_delinquent_to_suspension_to_booking_cancel  # depth ≥ 3
        grounds:
          - state_machines.Subscription.GRACE_to_DELINQUENT
          - state_machines.Member.billing_status.GRACE_to_DELINQUENT
          - state_machines.Member.access_status.ACTIVE_to_FROZEN
          - state_machines.Booking.RESERVED_to_CANCELLED  # system cascade branch
          - calculations.account_posture
          - calculations.booking_final_price_and_refund.variants[admin_or_cascade_cancel]
        distinguishing_aspect: |
          Depth-3 cascade originating from a clock advance trigger: clock
          crossing grace_period_end (A) causes Subscription→DELINQUENT (B);
          that change causes Member.access_status→FROZEN (C, NOT a fan-out
          because it's specifically triggered by billing entering DELINQUENT,
          not by the original clock event); FROZEN posture causes each future
          RESERVED/CONFIRMED Booking of this Member→CANCELLED with ADMIN
          refund (D). Four distinct entities mutated, each link caused by the
          previous link — no parallel fan-out.
        test_recipe:
          setup:
            - "Member m1 (state=CA) with Subscription s1 in GRACE, grace_period_end=T0"
            - "Member m1 holds Booking b1 (RESERVED) for ClassSession cs1 starting at T0+48h, provisional_price_cents=2000"
            - "No SUCCESS PaymentAttempt has been recorded"
          trigger:
            - "POST /_clock/advance {to_timestamp=T0+1s}"
          assert:
            - "Subscription.status == DELINQUENT"
            - "Member.billing_status == DELINQUENT"
            - "Member.access_status == FROZEN"
            - "Member.account_posture == FROZEN"
            - "Booking.status == CANCELLED"
            - "Booking.final_price_cents == 0   # ADMIN schedule, 100% refund"
            - "Member.wallet_credit_cents == 2000"

      - name: no_show_to_strike_to_suspension  # depth = 2 (different trigger from above)
        grounds:
          - state_machines.Booking.CONFIRMED_to_NO_SHOW
          - calculations.no_show_strike_count
          - state_machines.Member.access_status.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-2 cascade originating from a sweep trigger (different from the
          clock-advance trigger above): sweep marks Booking CONFIRMED→NO_SHOW
          (A); the resulting strike_count crossing NO_SHOW_STRIKE_LIMIT causes
          Member.access_status ACTIVE→SUSPENDED (B). Trigger is /_sweep/run,
          not /_clock/advance, and the propagation pattern is event-window
          aggregation crossing a threshold (a different propagation pattern
          than the GRACE-clock-cross cascade above).
        test_recipe:
          setup:
            - "Member m1 with 2 prior NO_SHOW bookings within the last 30 days"
            - "Member m1 holds Booking b3 in CONFIRMED for ClassSession cs1 (YOGA, ends_at=T0)"
            - "Advance clock to T0+1h"
          trigger:
            - "POST /_sweep/run"
          assert:
            - "Booking(b3).status == NO_SHOW"
            - "Member.no_show_strike_count == 3"
            - "Member.access_status == SUSPENDED  # cascade fired because strike_count >= NO_SHOW_STRIKE_LIMIT"
            - "Member.account_posture == FROZEN"

  # -------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety  # state vs business_safety
        grounds:
          - validations[priority=4]   # ERR_INVALID_STATE
          - validations[priority=7]   # ERR_TIER_BELOW_MINIMUM
          - entities.ClassSession.fields.minimum_tier
        distinguishing_aspect: |
          Pair: state (priority 4) vs business_safety (priority 7). Dual-failure
          scenario: a BASIC member attempts to book an ELITE-only ClassSession
          AND the ClassSession is in CANCELLED state. Both checks would fail
          but ERR_INVALID_STATE (state, priority 4) wins over
          ERR_TIER_BELOW_MINIMUM (business_safety, priority 7).
        test_recipe:
          setup:
            - "Create Member m1 with tier=BASIC, posture OPEN"
            - "Create ClassSession cs1 with minimum_tier=ELITE, then cancel cs1 (status=CANCELLED)"
          trigger:
            - "POST /members/m1/bookings {booking_kind=GROUP_CLASS, class_session_id=cs1}"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE'  # state check wins over tier check"
            - "Response http_status == 409"

      - name: posture_beats_business_constraint  # state (posture) vs business_constraint
        grounds:
          - validations[priority=5]   # ERR_ACCOUNT_POSTURE_FROZEN
          - validations[priority=8]   # ERR_MEMBER_TIME_CONFLICT
          - entities.Member.fields.account_posture
        distinguishing_aspect: |
          Pair: state (account_posture, priority 5) vs business_constraint
          (member time conflict, priority 8). Different from pair above (no
          ERR_INVALID_STATE involved). Dual-failure: a FROZEN member attempts
          to book a slot that ALSO overlaps an existing booking. Posture check
          wins, returning ERR_ACCOUNT_POSTURE_FROZEN, NOT ERR_MEMBER_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Create Member m1 with Booking b_existing at T0+1h..T0+2h, then suspend m1 → posture FROZEN"
            - "Create ClassSession cs2 also at T0+1h..T0+2h (overlapping)"
          trigger:
            - "POST /members/m1/bookings {booking_kind=GROUP_CLASS, class_session_id=cs2}"
          assert:
            - "Response error_id == 'ERR_ACCOUNT_POSTURE_FROZEN'"
            - "Response http_status == 403"

      - name: business_constraint_beats_business_fiscal  # business_constraint vs business_fiscal
        grounds:
          - validations[priority=9]    # ERR_TRAINER_UNAVAILABLE
          - validations[priority=13]   # ERR_AMOUNT_MISMATCH
        distinguishing_aspect: |
          Pair: business_constraint (trainer overlap, priority 9) vs
          business_fiscal (priority 13). Different error-category pair from
          both above. Dual-failure: a PT booking is requested where the
          trainer has an overlapping session AND the client-supplied
          amount_cents is wrong. Earlier check ERR_TRAINER_UNAVAILABLE wins.
        test_recipe:
          setup:
            - "Trainer t1, Member m1 (posture OPEN, tier=PLUS), prior PT booking for t1 at T0..T0+30min"
            - "(This rule applies on POST /bookings, not on payment-attempts; the comparable fiscal check here is the inline coupon validity check ERR_COUPON_INVALID at priority 12; we substitute that as the fiscal-category check)"
            - "Tamper request to include an invalid applied_coupon_id (coupon revoked)"
          trigger:
            - "POST /members/m1/bookings {booking_kind=PERSONAL_TRAINING, trainer_id=t1, starts_at=T0+15min, ends_at=T0+45min, applied_coupon_id=c_revoked}"
          assert:
            - "Response error_id == 'ERR_TRAINER_UNAVAILABLE'  # priority 9 wins over priority 12 ERR_COUPON_INVALID"
            - "Response http_status == 409"

  # -------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: refund_pct_boundary_at_exactly_24h_in_CA
        grounds:
          - calculations.booking_final_price_and_refund
          - entities.Member.fields.state_code
        distinguishing_aspect: |
          Numeric-threshold boundary: hours_to_start >= 24.0 (inclusive). At
          exactly 24.000h the CA schedule yields refund_pct=100; at 23.999h
          it yields 50. Reached through POST /members/{id}/bookings/{id}/cancel.
          Distinct metric (refund_pct as a function of hours_to_start) and
          distinct endpoint from the empty-set boundary below.
        test_recipe:
          setup:
            - "Member m1 (CA), Booking b1 RESERVED on ClassSession cs1 starting at T0+24h, provisional_price_cents=2000"
            - "Advance clock so current_clock == T0 (hours_to_start = 24.000 exactly)"
          trigger:
            - "POST /members/m1/bookings/b1/cancel"
          assert:
            - "Booking.final_price_cents == 0      # refund_pct = 100"
            - "Member.wallet_credit_cents == 2000"

      - name: empty_waitlist_promotion_fallback
        grounds:
          - calculations.waitlist_promotion
          - state_machines.Booking.RESERVED_to_CANCELLED
          - entities.ClassSession.fields.reserved_seat_count
        distinguishing_aspect: |
          Empty-collection boundary on a different metric (waitlist size, not
          a numeric threshold) reached through a different endpoint (booking
          cancel triggers the sweep). When the WAITLISTED set is empty, the
          fallback is no-op; reserved_seat_count decrements; no promotion fires.
        test_recipe:
          setup:
            - "ClassSession cs1 capacity=2, two Members m1, m2 both RESERVED, no waitlisted members"
          trigger:
            - "POST /members/m1/bookings/b1/cancel"
          assert:
            - "ClassSession.reserved_seat_count == 1   # decremented from 2 to 1"
            - "No new Booking transitioned to RESERVED (empty waitlist fallback)"
            - "Booking(m2).status == RESERVED  # unchanged"

      - name: equipment_pool_zero_units_required_boundary
        grounds:
          - validations[priority=10]
          - entities.ClassSession.fields.equipment_units_required
          - entities.EquipmentPool.fields.total_units
        distinguishing_aspect: |
          Zero-quantity boundary on a third metric (equipment_units_required)
          reached through a third endpoint (POST /stores/{id}/class-sessions).
          When equipment_units_required == 0, even a fully-saturated pool MUST
          permit the session — the >0 strict comparison is the boundary.
        test_recipe:
          setup:
            - "EquipmentPool ep1 with total_units=2, already saturated by overlapping sessions consuming both units"
          trigger:
            - "POST /stores/st1/class-sessions {class_type=YOGA, trainer_id=t1, starts_at, ends_at, capacity=10, equipment_pool_id=ep1, equipment_units_required=0}"
          assert:
            - "Response code == 201"
            - "ClassSession created successfully (equipment_units_required=0 bypasses the capacity check)"

  # -------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: member_suspend_requires_subscription_active_or_reinstated
        grounds:
          - state_machines.Member.access_status.ACTIVE_to_SUSPENDED
          - entities.Subscription.fields.status
          - validations[priority=14]
        distinguishing_aspect: |
          Entity pair: Member → Subscription. Member's transition ACTIVE→
          SUSPENDED depends on Subscription.status being IN {ACTIVE, REINSTATED}.
          A PAST_DUE or DELINQUENT subscription blocks voluntary suspension.
        test_recipe:
          setup:
            - "Member m1 with Subscription s1 in PAST_DUE (one failed attempt this period)"
          trigger:
            - "POST /members/m1/suspend"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE'  # voluntary suspend disallowed when sub not ACTIVE/REINSTATED"
            - "Member.access_status == ACTIVE  # unchanged"

      - name: booking_confirm_requires_classsession_scheduled
        grounds:
          - state_machines.Booking.RESERVED_to_CONFIRMED
          - state_machines.ClassSession.SCHEDULED_to_LOCKED
          - entities.ClassSession.fields.status
        distinguishing_aspect: |
          Different entity pair: Booking → ClassSession. Booking RESERVED→
          CONFIRMED requires ClassSession.status == SCHEDULED and current_clock
          < starts_at - CONFIRM_CUTOFF_MINUTES; once ClassSession becomes
          LOCKED (clock past cutoff), confirm is rejected — a distinct cross-
          entity dependency from the Member→Subscription one above.
        test_recipe:
          setup:
            - "ClassSession cs1 starts_at=T0+30min, CONFIRM_CUTOFF_MINUTES=15"
            - "Member m1 RESERVED on cs1"
            - "Advance clock to T0+20min  # past cutoff; cs1 transitions to LOCKED"
          trigger:
            - "POST /members/m1/bookings/b1/confirm"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE'  # ClassSession is LOCKED, confirm window closed"
            - "Booking.status != CONFIRMED"

  # -------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: member_self_overlap_half_open_no_buffer
        grounds:
          - validations[priority=8]
          - entities.Booking.fields.starts_at
          - entities.Booking.fields.ends_at
        distinguishing_aspect: |
          Resource: Member's own schedule. Interval semantics: HALF-OPEN
          [starts_at, ends_at), NO buffer. Back-to-back bookings where
          existing.ends_at == new.starts_at are ALLOWED (adjacency is not
          overlap). This is geometrically distinct from the trainer rule below.
        test_recipe:
          setup:
            - "Member m1 with existing Booking b_a at T0..T0+60min"
            - "Posture OPEN"
          trigger:
            - "POST /members/m1/bookings {booking_kind=GROUP_CLASS, class_session_id=cs_adjacent, starts_at=T0+60min, ends_at=T0+120min}"
          assert:
            - "Response code == 201  # adjacency T0+60min == T0+60min is allowed"
            - "Booking.status IN {RESERVED, WAITLISTED}"

      - name: trainer_envelope_with_buffer_closed
        grounds:
          - validations[priority=9]
          - entities.Trainer.fields.id
          - entities.Booking.fields.trainer_id
        distinguishing_aspect: |
          Different resource (Trainer, not Member). Different interval
          semantics: CLOSED envelope [start-15min, end+15min] with a 15-minute
          buffer on each side. Adjacency within the envelope IS a conflict.
          A new PT booking starting at exactly existing.ends_at is REJECTED
          here — the opposite outcome to the half-open Member rule above.
        test_recipe:
          setup:
            - "Trainer t1 with existing PT Booking at T0..T0+30min"
            - "Member m1 posture OPEN, tier PLUS"
          trigger:
            - "POST /members/m1/bookings {booking_kind=PERSONAL_TRAINING, trainer_id=t1, starts_at=T0+30min, ends_at=T0+60min}"
          assert:
            - "Response error_id == 'ERR_TRAINER_UNAVAILABLE'  # adjacency falls inside [T0-15min, T0+45min] envelope"
            - "Response http_status == 409"

      - name: equipment_aggregate_capacity_overlap
        grounds:
          - validations[priority=10]
          - entities.EquipmentPool.fields.total_units
          - entities.ClassSession.fields.equipment_units_required
        distinguishing_aspect: |
          Third resource (EquipmentPool). Distinct interval semantics:
          AGGREGATE CAPACITY over overlapping windows — not a pairwise
          overlap rule but a sum-of-units-required across all SCHEDULED/LOCKED
          ClassSessions whose [starts_at, ends_at) overlaps the candidate
          window. Three sessions of 1 unit each can coexist on a 3-unit pool;
          adding a 4th 1-unit session in the same window is rejected.
        test_recipe:
          setup:
            - "EquipmentPool ep1 total_units=2"
            - "Two ClassSessions already SCHEDULED on ep1, each equipment_units_required=1, both at T0..T0+60min"
          trigger:
            - "POST /stores/st1/class-sessions {class_type=SPIN, trainer_id=t1, starts_at=T0+30min, ends_at=T0+90min, capacity=10, equipment_pool_id=ep1, equipment_units_required=1}"
          assert:
            - "Response error_id == 'ERR_EQUIPMENT_UNAVAILABLE'  # 1+1+1 = 3 > total_units=2 during [T0+30min, T0+60min) overlap"
            - "Response http_status == 409"

  # -------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: booking_reserve_then_cascade_cancel_preserves_pending_balance
        grounds:
          - state_machines.Booking.RESERVED_to_CANCELLED
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED
          - calculations.booking_final_price_and_refund.variants[admin_or_cascade_cancel]
          - entities.Member.fields.wallet_credit_cents
          - entities.Booking.fields.provisional_price_cents
          - entities.Booking.fields.final_price_cents
        distinguishing_aspect: |
          Conserved quantity (monetary, FIRST kind): Q1 = Member.wallet_credit_cents
          + Booking.final_price_cents (when terminal) + Booking.provisional_price_cents
          (when non-terminal), summed over a Member's lifecycle on a single
          Booking. Pinned formula:
              Q1 == wallet_credit_cents_at_start + provisional_price_cents_at_reserve
          Forward action: create RESERVED Booking (provisional_price_cents=P
          enters Q1 as P; wallet untouched). Compensating action: admin
          cascade-cancel via ClassSession.cancel (provisional drops out;
          final_price_cents=0 enters; wallet_credit_cents += P). Net delta
          on Q1 = (-P) + (+0) + (+P) = 0. The conserved quantity stays at
          (starting wallet) + P throughout.
        test_recipe:
          setup:
            - "Member m1 wallet_credit_cents=500 (starting balance)"
            - "Create Store st1 (CA), ClassSession cs1 (YOGA, capacity=10, starts_at=T+48h)"
            - "Member m1 books cs1 → Booking b1 status=RESERVED, provisional_price_cents=2000"
            - "Snapshot Q1_after_reserve = 500 + 2000 = 2500 (wallet + provisional)"
          trigger:
            - "POST /stores/st1/class-sessions/cs1/cancel"
          assert:
            - "Booking(b1).status == 'CANCELLED'"
            - "Booking(b1).final_price_cents == 0  # admin cascade, 100% refund"
            - "Member.wallet_credit_cents == 2500  # 500 + 2000 refunded"
            - "Q1_after_cancel = wallet_credit_cents + Booking.final_price_cents = 2500 + 0 = 2500 == Q1_after_reserve  # invariant preserved"

      - name: payment_idempotent_replay_preserves_count_and_amount
        grounds:
          - concurrency_rules[idempotency_key]
          - entities.PaymentAttempt.fields.idempotency_key
          - entities.Subscription.fields.failed_payment_attempts
        distinguishing_aspect: |
          Different conserved quantity (not a monetary balance): Q2 = count(PaymentAttempt for Subscription s1) + sum(amount_cents for those PaymentAttempts).
          Forward action: POST a payment-attempt with idempotency_key=k.
          Compensating action: POST the same payload again (idempotent replay).
          Invariant: Q2_after_replay == Q2_after_first_post (count unchanged,
          sum unchanged, no second gateway charge). The conserved quantity is
          a COUNT-AMOUNT compound, fundamentally different from the wallet+paid
          ledger of instance #1.
        test_recipe:
          setup:
            - "Member m1, Subscription s1 ACTIVE base_price_cents=4900, wallet_credit_cents=0"
            - "POST first /members/m1/subscriptions/s1/payment-attempts {idempotency_key=k1, outcome=SUCCESS} → record Q2_after_first = 1*1 + 4900 = 4901 (using count+sum compound)"
          trigger:
            - "POST identical /members/m1/subscriptions/s1/payment-attempts {idempotency_key=k1, outcome=SUCCESS}"
          assert:
            - "Response code == 200  # replay, original PaymentAttempt returned"
            - "Response error_id == 'ERR_IDEMPOTENT_REPLAY' OR response.data identifies the prior attempt (per concurrency rule)"
            - "count(PaymentAttempt for s1) == 1  # NOT 2"
            - "sum(PaymentAttempt.amount_cents for s1) == 4900  # NOT 9800"
            - "Q2_after_replay == Q2_after_first  # invariant preserved"
