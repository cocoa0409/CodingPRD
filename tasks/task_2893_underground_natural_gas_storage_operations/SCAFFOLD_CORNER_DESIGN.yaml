              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { e11: $.data.error_id }
            - call: "GET /wells"
              payload: { storage_field_id: "${f1}", limit: 100 }
