            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_a}", prescription_id: "${rx_a}", frame_id: "${frame_id}", material_option_id: "${m167_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { ord_a: $.data.id }
            - call: "POST /optical/orders/${ord_a}/confirm"
