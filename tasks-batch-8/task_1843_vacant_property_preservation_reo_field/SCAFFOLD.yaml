    roles: [VendorAdmin]
    code: 200
    input: []
    output: RecurringServicePlan
    side_effects: ["Open RECURRING_AUTO orders CANCELLED with generated_this_season compensation"]

  - method: POST
    path: "/preservation/recurring-plans/{planId}/resume"
    description: "Resume a SUSPENDED plan; requires in-season and non-OCCUPIED property"
    roles: [VendorAdmin]
    code: 200
    input: []
    output: RecurringServicePlan
    side_effects: []

  - method: POST
    path: "/preservation/recurring-plans/{planId}/end"
    description: "End a plan (terminal)"
    roles: [VendorAdmin]
    code: 200
    input: []
