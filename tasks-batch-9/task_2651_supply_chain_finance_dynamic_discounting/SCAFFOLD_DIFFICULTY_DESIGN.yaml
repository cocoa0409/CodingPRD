              captures: { final_status: "$.data.status", final_apr: "$.data.accepted_apr_bps" }
          assert:
            - "${st1} == COUNTERED with counter_apr_bps 800 while counter_round is still 0 (the counter edge does not advance the loop counter)"
            - "${round1} == 1, ${round2} == 2, ${round3} == 3 and after each rename status == NAMED with counter_apr_bps null"
            - "after each rename offered_apr_bps is the new rate (810, then 910, then 1010)"
            - "${exhausted_error} == ERR_COUNTER_ROUNDS_EXHAUSTED with HTTP 409; the offer is unchanged: status NAMED, counter_round 3, offered_apr_bps 1010"
            - "${final_status} == ACCEPTED and ${final_apr} == 1010 (a rounds-exhausted offer is still acceptable)"
            - "DiscountOffer.${offer_id}.version == ${offer_v0} + 7 (six loop edges plus the accept; the rejected counter did not bump it)"
            - "Invoice.${invoice_id}.status == AWARDED"

