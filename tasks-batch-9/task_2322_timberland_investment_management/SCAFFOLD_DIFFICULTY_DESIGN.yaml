  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: property_acquisition_and_appraisal_dimensions_advance_independently
        grounds:
          - state_machines.Property.PROSPECT_to_UNDER_UNDERWRITING
          - state_machines.Property.UNDER_UNDERWRITING_to_APPROVED_FOR_BID
          - state_machines.Property.NONE_to_SUBMITTED
          - state_machines.Property.SUBMITTED_to_SIGNED
          - state_machines.Property.SIGNED_to_STALE
          - entities.Property.fields.status
          - entities.Property.fields.appraisal_status
        distinguishing_aspect: |
          Property carries four independent state dimensions: driving appraisal_status
          NONE -> SUBMITTED -> SIGNED -> STALE leaves status pinned at APPROVED_FOR_BID
          and does NOT reset certification_posture (CERTIFIED) or harvest_plan_status
          (ALIGNED), so the entity's observable state is a tuple of four coordinates
          rather than a single linear chain.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Canonical fund and 'Piney Creek Tract' property (SOUTH, total_acres 1200.00, haul 62, SFI) with a 120.00-acre LOBLOLLY_PINE stand cruise-closed at 4647.12 tons."
            - "Appraisal submitted by appraiser-1 under MARKET at 3250.00/acre and signed by appraiser-2 (appraised_value_usd 3900000.00)."
            - "One YIELD_TABLE underwriting case authored by analyst-1, submitted, and APPROVED by ic-1, so status is APPROVED_FOR_BID and appraisal_status is SIGNED."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
