              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Reverse Basket", category: "CUSTOM", base_price_cents: 2000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
