scenario: |
  Gym membership management system: membership cards (per-visit/monthly/annual) with card-type configuration,
  validity period, visit-count tracking, family-member-shared cards, card-issuance and activation workflow,
  and card-status (active/frozen/expired/refunded) management; personal training session reservation with
  trainer profile and specialty, available-slot configuration, single-session and package booking,
  cancellation rules, no-show penalty, and session-completion confirmation; group class scheduling with
  class-type configuration, scheduling rules (recurring/one-off), capacity limits, member booking and
  waitlist, instructor substitution handling, and class-cancellation notification; stored-value and
  deduction with stored-value account recharge, recharge-bonus rules, deduction by service type, refund
  rules, and balance-expiration handling; freeze and transfer with freeze application (illness/business-trip),
  freeze period limits, freeze-period validity extension, transfer eligibility check, transfer-fee
  calculation, and transfer record archiving; renewal reminder with expiration-approaching reminder rules,
  multi-channel notification, renewal-discount rules, automatic renewal authorization, and lapse handling;
  trainer commission with session-based commission rate, package-sales commission, performance-tier-based
  bonus, refund-induced commission reversal, and periodic payout; event-driven synchronization with
  payment, IM, and access-control systems; audit logging for card adjustments and commission records.

domain_name: "gym-membership"
api_prefix: "/cards"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - compensating_invariant

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Member's full name.
        constraints: "Length 1..120"
      - name: phone
        type: string
        source: input
        description: Phone number, used for IM and SMS notifications.
        constraints: "Unique; E.164 digits only"
      - name: email
        type: string
        source: input
        description: Email address (also used for renewal reminder channel email).
        constraints: "Unique"
      - name: family_group_id
        type: string
        source: input
        description: Optional family group identifier. Members sharing the same family_group_id can use family-shared cards.
        default: null
      - name: notification_channels
        type: array
        source: input
        description: Subset of {SMS, EMAIL, IM, PUSH}; reminder fan-out (§1.3 reminder_dispatch) reads this.
        default: ["SMS", "EMAIL"]
      - name: auto_renew_authorized
        type: boolean
        source: input
        description: Whether automatic renewal is authorized. Required true for system-driven renewal on expiry.
        default: false
      - name: wallet_balance_cents
        type: integer
        source: computed
        description: Stored-value balance in cents. Derived from sum of WalletTransaction.amount_cents (see §1.3 wallet_balance_projection).
        default: 0
      - name: bonus_balance_cents
        type: integer
        source: computed
        description: Bonus (gift) balance in cents, separately tracked from principal balance.
        default: 0
      - name: bonus_expires_at
        type: datetime
        source: computed
        description: ISO 8601 UTC. Earliest expiry over all unexpired bonus credits. Null when bonus_balance_cents == 0.
        default: null

  - name: CardType
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Card type code (immutable business key).
        constraints: "Unique; length 2..32; uppercase snake"
      - name: category
        type: enum
        source: input
        description: Card category.
        constraints: "One of {PER_VISIT, MONTHLY, ANNUAL}"
      - name: price_cents
        type: integer
        source: input
        description: Sale price in cents.
        constraints: ">= 0"
      - name: validity_days
        type: integer
        source: input
        description: Number of days the card is valid from activation_date (inclusive). Ignored when category == PER_VISIT and visit_quota > 0 (per-visit cards expire when visits exhausted OR validity_days elapses, whichever first).
        constraints: "Integer 1..3650"
      - name: visit_quota
        type: integer
        source: input
        description: Total entries permitted. 0 means unlimited (typical for MONTHLY/ANNUAL).
        constraints: ">= 0"
      - name: family_shareable
        type: boolean
        source: input
        description: When true, any Member sharing the holder's family_group_id may consume visits/services.
        default: false
      - name: max_freeze_days
        type: integer
        source: input
        description: Cumulative freeze cap across the card's lifetime (sum of all freeze episodes).
        constraints: ">= 0"
      - name: transfer_fee_pct_bp
        type: integer
        source: input
        description: Transfer fee percentage in basis points (1/100 of a percent). Applied to remaining_value_cents; see §1.3 transfer_fee.
        constraints: "0..10000"
      - name: renewal_discount_pct_bp
        type: integer
        source: input
        description: Renewal discount in basis points off price_cents when renewing before expiry; see §1.3 renewal_quote.
        default: 0
        constraints: "0..10000"
      - name: refund_eligibility_days
        type: integer
        source: input
        description: A card may be refunded only if remaining_validity_days >= refund_eligibility_days at refund time.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Configuration lifecycle status.
        default: ACTIVE
        constraints: "One of {ACTIVE, RETIRED}"

  - name: Card
    parent: null
    common_fields: true
    fields:
      - name: card_type_id
        type: string
        source: input
        description: FK to CardType.id pinned at issuance (subsequent CardType edits do NOT mutate already-issued cards).
      - name: holder_member_id
        type: string
        source: input
        description: FK to Member.id (the holder; this id appears in audit and is the only identity wallet-deducting from this card's billing path).
      - name: issuance_price_cents
        type: integer
        source: system
        description: Price paid at issuance, copied from CardType.price_cents at the issuance moment.
      - name: activation_date
        type: datetime
        source: system
        description: ISO 8601 UTC. Set on POST /cards/{id}/activate. Null while PENDING.
        default: null
      - name: original_expiry_date
        type: datetime
        source: system
        description: activation_date + validity_days at activation time (UTC, end of day). Null while PENDING.
        default: null
      - name: effective_expiry_date
        type: datetime
        source: computed
        description: original_expiry_date + accumulated_freeze_extension_days (§1.3 effective_expiry). Null while PENDING.
        default: null
      - name: visits_consumed
        type: integer
        source: computed
        description: Count of access-control entries debited against this card. Increments on POST /access-events.
        default: 0
      - name: visits_remaining
        type: integer
        source: computed
        description: max(CardType.visit_quota - visits_consumed, 0). When CardType.visit_quota == 0 this field is null (unlimited).
        default: null
      - name: cumulative_freeze_days
        type: integer
        source: computed
        description: Sum of FreezeEpisode.actual_days for episodes with status SETTLED on this card.
        default: 0
      - name: status
        type: enum
        source: system
        description: Card lifecycle status.
        default: PENDING
        constraints: "One of {PENDING, ACTIVE, FROZEN, EXPIRED, REFUNDED, TRANSFERRED}"
      - name: parent_card_id
        type: string
        source: system
        description: FK to a prior Card.id when this card was created as a renewal or transfer destination. Null for original issuance.
        default: null

  - name: Trainer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Trainer's full name.
      - name: specialties
        type: array
        source: input
        description: Array of specialty codes (e.g., STRENGTH, YOGA, REHAB). PT bookings (§1.5 PT booking) must intersect requested specialty.
        constraints: "Non-empty"
      - name: session_commission_pct_bp
        type: integer
        source: input
        description: Per-session commission rate in basis points (applied to session_price_cents).
        constraints: "0..10000"
      - name: package_commission_pct_bp
        type: integer
        source: input
        description: Package-sales commission rate in basis points (applied to package gross value at package activation).
        constraints: "0..10000"
      - name: tier
        type: enum
        source: computed
        description: Performance tier recomputed at each payout cutoff (§1.3 trainer_tier).
        default: BRONZE
        constraints: "One of {BRONZE, SILVER, GOLD}"
      - name: status
        type: enum
        source: system
        description: Active/inactive flag — inactive trainers cannot be booked.
        default: ACTIVE
        constraints: "One of {ACTIVE, INACTIVE}"

  - name: TrainerSlot
    parent: Trainer
    common_fields: true
    fields:
      - name: trainer_id
        type: string
        source: input
        description: FK to Trainer.id.
      - name: starts_at
        type: datetime
        source: input
        description: ISO 8601 UTC slot start (half-open interval [starts_at, ends_at)).
      - name: ends_at
        type: datetime
        source: input
        description: ISO 8601 UTC slot end (exclusive).
      - name: specialty_code
        type: string
        source: input
        description: Specialty offered in this slot; must be a member of Trainer.specialties.
      - name: status
        type: enum
        source: system
        description: Slot status.
        default: OPEN
        constraints: "One of {OPEN, RESERVED, COMPLETED, CANCELED, NO_SHOW}"

  - name: PTBooking
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK to Member.id.
      - name: trainer_id
        type: string
        source: input
        description: FK to Trainer.id (denormalized for query).
      - name: slot_id
        type: string
        source: input
        description: FK to TrainerSlot.id. Exactly one PTBooking ties each non-CANCELED slot.
      - name: package_id
        type: string
        source: input
        description: FK to PTPackage.id when booking is package-debited; null when single-session billed.
        default: null
      - name: billing_mode
        type: enum
        source: input
        description: Whether single-session (wallet-debited) or package-debited.
        constraints: "One of {SINGLE, PACKAGE}"
      - name: session_price_cents
        type: integer
        source: system
        description: Price at booking time. For SINGLE, copied from Trainer.session_price_default (input field above); for PACKAGE, computed as package gross / package sessions and pinned per §1.3 package_unit_price.
      - name: status
        type: enum
        source: system
        description: Booking status.
        default: CONFIRMED
        constraints: "One of {CONFIRMED, COMPLETED, CANCELED, NO_SHOW}"
      - name: scheduled_starts_at
        type: datetime
        source: system
        description: Mirrors slot.starts_at at booking time for fast cancellation-window calculation.

  - name: PTPackage
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK to Member.id (purchaser).
      - name: trainer_id
        type: string
        source: input
        description: FK to Trainer.id (the trainer the package is sold against; commission accrues to this trainer).
      - name: total_sessions
        type: integer
        source: input
        description: Number of PT sessions included.
        constraints: ">= 1"
      - name: gross_price_cents
        type: integer
        source: input
        description: Package gross price in cents (charged once at activation).
        constraints: ">= 0"
      - name: sessions_consumed
        type: integer
        source: computed
        description: Count of PTBooking rows in COMPLETED state whose package_id == this package's id.
        default: 0
      - name: sessions_refunded
        type: integer
        source: computed
        description: Count of unused sessions refunded on package refund.
        default: 0
      - name: status
        type: enum
        source: system
        description: Package lifecycle status.
        default: ACTIVE
        constraints: "One of {ACTIVE, EXHAUSTED, REFUNDED}"

  - name: GroupClass
    parent: null
    common_fields: true
    fields:
      - name: class_code
        type: string
        source: input
        description: Group class type identifier (e.g., HIIT_45).
      - name: instructor_trainer_id
        type: string
        source: input
        description: FK to Trainer.id (primary instructor).
      - name: substitute_trainer_id
        type: string
        source: system
        description: FK to Trainer.id when a substitution has been recorded; null otherwise.
        default: null
      - name: starts_at
        type: datetime
        source: input
        description: ISO 8601 UTC start (half-open interval [starts_at, ends_at)).
      - name: ends_at
        type: datetime
        source: input
        description: ISO 8601 UTC end.
      - name: capacity
        type: integer
        source: input
        description: Max confirmed bookings (waitlist beyond this).
        constraints: ">= 1"
      - name: recurrence_series_id
        type: string
        source: input
        description: Optional id grouping recurring sessions. Null for one-off classes.
        default: null
      - name: deduction_cents
        type: integer
        source: input
        description: Per-attendance wallet deduction in cents (0 for cards that cover group class).
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Class lifecycle status.
        default: SCHEDULED
        constraints: "One of {SCHEDULED, CANCELED, COMPLETED}"
      - name: confirmed_count
        type: integer
        source: computed
        description: Count of GroupBooking rows with status CONFIRMED for this class.
        default: 0
      - name: waitlist_count
        type: integer
        source: computed
        description: Count of GroupBooking rows with status WAITLISTED for this class.
        default: 0

  - name: GroupBooking
    parent: null
    common_fields: true
    fields:
      - name: class_id
        type: string
        source: input
        description: FK to GroupClass.id.
      - name: member_id
        type: string
        source: input
        description: FK to Member.id.
      - name: card_id
        type: string
        source: input
        description: FK to Card.id used (so visit_consumed increments on this card); null when wallet-paid.
        default: null
      - name: status
        type: enum
        source: system
        description: Booking status.
        default: CONFIRMED
        constraints: "One of {CONFIRMED, WAITLISTED, CANCELED, ATTENDED, NO_SHOW}"
      - name: waitlist_position
        type: integer
        source: system
        description: 1-based position within waitlist; null when status != WAITLISTED.
        default: null
      - name: waitlisted_at
        type: datetime
        source: system
        description: Timestamp the booking entered waitlist (used for FIFO promotion). Null when status != WAITLISTED.
        default: null

  - name: WalletTransaction
    parent: Member
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: FK to Member.id.
      - name: kind
        type: enum
        source: input
        description: Transaction kind.
        constraints: "One of {RECHARGE, BONUS_GRANT, DEBIT, REFUND, BONUS_EXPIRE, ADJUSTMENT}"
      - name: amount_cents
        type: integer
        source: input
        description: Signed amount in cents. Credits positive (RECHARGE, BONUS_GRANT, REFUND), debits negative (DEBIT, BONUS_EXPIRE).
      - name: bucket
        type: enum
        source: input
        description: Which sub-balance this transaction affects.
        constraints: "One of {PRINCIPAL, BONUS}"
      - name: service_type
        type: enum
        source: input
        description: When kind == DEBIT, the service type debited. Null otherwise.
        default: null
        constraints: "One of {PT_SESSION, GROUP_CLASS, CARD_ISSUANCE, TRANSFER_FEE} or null"
      - name: ref_entity
        type: string
        source: input
        description: Polymorphic reference (e.g., 'PTBooking:<id>', 'GroupBooking:<id>', 'Card:<id>'). Pin-required.
      - name: expires_at
        type: datetime
        source: input
        description: For BONUS_GRANT rows only — when the bonus credit lapses (FIFO consumption per §1.3 wallet_debit).
        default: null
      - name: created_at
        type: datetime
        source: system
        description: Append-only timestamp (also serves as id ordering for FIFO).

  - name: FreezeEpisode
    parent: Card
    common_fields: true
    fields:
      - name: card_id
        type: string
        source: input
        description: FK to Card.id.
      - name: reason
        type: enum
        source: input
        description: Freeze reason.
        constraints: "One of {ILLNESS, BUSINESS_TRIP}"
      - name: requested_days
        type: integer
        source: input
        description: Days the member requests to freeze.
        constraints: ">= 1"
      - name: actual_days
        type: integer
        source: computed
        description: Days actually frozen — equals requested_days if approved without truncation, less when remaining freeze budget caps it (§1.3 freeze_grant).
        default: 0
      - name: starts_at
        type: datetime
        source: system
        description: ISO 8601 UTC; equals the API request time on approval.
        default: null
      - name: ends_at
        type: datetime
        source: system
        description: ISO 8601 UTC; starts_at + actual_days (end of day).
        default: null
      - name: status
        type: enum
        source: system
        description: Episode lifecycle.
        default: REQUESTED
        constraints: "One of {REQUESTED, APPROVED, SETTLED, REJECTED, CANCELED}"

  - name: TransferRecord
    parent: Card
    common_fields: false
    fields:
      - name: source_card_id
        type: string
        source: input
        description: FK to Card.id (the card being transferred).
      - name: destination_card_id
        type: string
        source: system
        description: FK to the newly created Card.id (transfer destination).
      - name: from_member_id
        type: string
        source: system
        description: FK to Member.id (previous holder).
      - name: to_member_id
        type: string
        source: input
        description: FK to Member.id (new holder).
      - name: remaining_value_cents
        type: integer
        source: system
        description: Computed at transfer per §1.3 remaining_value.
      - name: transfer_fee_cents
        type: integer
        source: system
        description: Computed per §1.3 transfer_fee.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC; append-only.

  - name: CommissionRecord
    parent: Trainer
    common_fields: false
    fields:
      - name: trainer_id
        type: string
        source: input
        description: FK to Trainer.id.
      - name: kind
        type: enum
        source: input
        description: Commission kind.
        constraints: "One of {SESSION, PACKAGE_SALE, TIER_BONUS, REVERSAL}"
      - name: amount_cents
        type: integer
        source: system
        description: Signed amount in cents. Reversals are negative.
      - name: ref_entity
        type: string
        source: input
        description: Polymorphic ref ('PTBooking:<id>', 'PTPackage:<id>', 'PayoutCycle:<id>').
      - name: payout_cycle_id
        type: string
        source: system
        description: FK to PayoutCycle.id; null until included in a closed payout cycle.
        default: null
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC; append-only.

  - name: PayoutCycle
    parent: null
    common_fields: false
    fields:
      - name: cycle_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of cycle (inclusive).
      - name: cycle_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of cycle (exclusive).
      - name: closed_at
        type: datetime
        source: system
        description: Set when POST /payouts/{id}/close fires; null while OPEN.
        default: null
      - name: status
        type: enum
        source: system
        description: Cycle status.
        default: OPEN
        constraints: "One of {OPEN, CLOSED}"
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC; append-only.

  - name: RenewalReminder
    parent: Card
    common_fields: false
    fields:
      - name: card_id
        type: string
        source: input
        description: FK to Card.id.
      - name: tier
        type: enum
        source: input
        description: Reminder tier (T30 = 30 days out, T7 = 7 days out, T0 = day-of/post-expiry).
        constraints: "One of {T30, T7, T0}"
      - name: channels_dispatched
        type: array
        source: system
        description: Channels actually fanned out (intersection of Member.notification_channels with the tier's allowed set per §1.3 reminder_dispatch).
      - name: status
        type: enum
        source: system
        description: Reminder status.
        constraints: "One of {SENT, AUTO_RENEW_TRIGGERED, LAPSED}"
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC; append-only.

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: string
        source: system
        description: Role of the caller from X-User-Role.
      - name: actor_id
        type: string
        source: system
        description: X-User-ID of the caller.
      - name: action
        type: enum
        source: system
        description: Audited action code.
        constraints: "One of {CARD_ADJUST, COMMISSION_ADJUST, CARD_REFUND, FREEZE_OVERRIDE, COMMISSION_REVERSAL}"
      - name: target_entity
        type: string
        source: system
        description: Polymorphic ref ('Card:<id>', 'CommissionRecord:<id>', etc.).
      - name: payload
        type: object
        source: system
        description: Free-form structured diff (before/after fields).
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC; append-only.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Card
    initial_state: PENDING
    terminal_states: [REFUNDED, TRANSFERRED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /cards/{id}/activate"
        actor: StaffOps | PlatformAdmin
        preconditions:
          - "Card.status == PENDING"
          - "CardType.status == ACTIVE (the referenced type has not been retired)"
          - "Member.status not in any blocked set (Member entity has no block status; existence only)"
        side_effects:
          - "Card.activation_date := now()"
          - "Card.original_expiry_date := now() + CardType.validity_days (end of day, UTC)"
          - "Card.effective_expiry_date := original_expiry_date (no freeze yet)"
          - "Emit access-control sync event ACCESS_GRANT (Card.id, holder_member_id, effective_expiry_date)"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /cards/{id}/freeze (via FreezeEpisode APPROVED transition)"
        actor: Member | StaffOps
        preconditions:
          - "Card.status == ACTIVE"
          - "CardType.max_freeze_days - Card.cumulative_freeze_days > 0"
          - "Card has no CONFIRMED PT booking within the freeze window (cross-entity guard, see §1.4 priority 24)"
        side_effects:
          - "Create FreezeEpisode with status APPROVED, actual_days set per §1.3 freeze_grant"
          - "Card.cumulative_freeze_days += FreezeEpisode.actual_days"
          - "Emit access-control sync event ACCESS_REVOKE (Card.id, until ends_at)"
      - from: FROZEN
        to: ACTIVE
        trigger: "System: clock reaches FreezeEpisode.ends_at (POST /_clock/advance crosses ends_at) OR POST /cards/{id}/unfreeze"
        actor: system | Member
        preconditions:
          - "Card.status == FROZEN"
        side_effects:
          - "FreezeEpisode.status := SETTLED"
          - "Card.effective_expiry_date := original_expiry_date + Card.cumulative_freeze_days (recompute per §1.3 effective_expiry)"
          - "Emit access-control sync event ACCESS_GRANT (Card.id, new effective_expiry_date)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "System: clock reaches Card.effective_expiry_date (POST /_clock/advance) OR Card.visit_quota exhausted"
        actor: system
        preconditions:
          - "Card.status == ACTIVE"
          - "now() >= Card.effective_expiry_date OR (CardType.visit_quota > 0 AND Card.visits_remaining == 0)"
        side_effects:
          - "Emit access-control sync event ACCESS_REVOKE (Card.id, permanent)"
          - "If Member.auto_renew_authorized AND a RenewalReminder.tier == T0 has been dispatched: create child Card (PENDING) with parent_card_id := this card; debit Member.wallet for renewal price per §1.3 renewal_quote; activate child card immediately (PENDING→ACTIVE cascade)"
          - "Else: dispatch RenewalReminder(tier=T0) status LAPSED"
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /cards/{id}/refund"
        actor: StaffOps | PlatformAdmin
        preconditions:
          - "Card.status == ACTIVE"
          - "(effective_expiry_date - now()) in days >= CardType.refund_eligibility_days"
          - "Card has no SETTLED FreezeEpisode (cards that were ever frozen are not refundable — different entity-pair from PT block, see §1.4 priority 19)"
        side_effects:
          - "Credit Member.wallet_balance_cents with remaining_value_cents (§1.3 remaining_value), bucket=PRINCIPAL, kind=REFUND, ref_entity=Card:<id>"
          - "Reverse any unconsumed package commissions tied to this card's holder (no-op if none; see §1.3 commission_reversal)"
          - "Emit access-control sync event ACCESS_REVOKE (Card.id, permanent)"
          - "Write AuditLogEntry action=CARD_REFUND"
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /cards/{id}/transfer"
        actor: StaffOps | PlatformAdmin
        preconditions:
          - "Card.status == ACTIVE"
          - "Card.visits_consumed == 0 (transfer only allowed for un-entered cards)"
          - "Destination Member exists AND (Card.holder is in same family_group OR CardType.family_shareable == true OR Card-issuance was within 7 days)"
          - "No active FreezeEpisode and no SETTLED FreezeEpisode on this card"
        side_effects:
          - "Compute remaining_value_cents and transfer_fee_cents per §1.3 transfer_fee"
          - "Debit Member.wallet for transfer_fee_cents (DEBIT bucket=PRINCIPAL, service_type=TRANSFER_FEE, ref_entity=Card:<id>)"
          - "Create new Card (status=ACTIVE) for to_member_id with parent_card_id := this card; activation_date inherited; original_expiry_date inherited"
          - "Append TransferRecord"
          - "Emit access-control sync events: ACCESS_REVOKE on old Card.id, ACCESS_GRANT on new Card.id"

  - entity: PTBooking
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, CANCELED, NO_SHOW]
    transitions:
      - from: CONFIRMED
        to: CANCELED
        trigger: "POST /pt-bookings/{id}/cancel"
        actor: Member | StaffOps
        preconditions:
          - "PTBooking.status == CONFIRMED"
          - "now() < scheduled_starts_at (cannot cancel after start)"
        side_effects:
          - "TrainerSlot.status := OPEN (slot returned to inventory)"
          - "If billing_mode == SINGLE AND (scheduled_starts_at - now()) >= 24 hours: refund session_price_cents to wallet (bucket=PRINCIPAL, kind=REFUND)"
          - "If billing_mode == SINGLE AND (scheduled_starts_at - now()) <  24 hours: NO refund (late-cancel penalty)"
          - "If billing_mode == PACKAGE: increment PTPackage.sessions_consumed back-out is NOT performed (package retains the consumed count? NO — package consumption only happens at COMPLETED, so cancellation of a CONFIRMED package booking simply frees the slot without affecting package totals)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /_clock/advance (clock crosses scheduled_starts_at + 15 minutes without a COMPLETED transition) OR POST /pt-bookings/{id}/no-show"
        actor: system | StaffOps
        preconditions:
          - "PTBooking.status == CONFIRMED"
          - "now() >= scheduled_starts_at + 15 minutes"
        side_effects:
          - "TrainerSlot.status := NO_SHOW"
          - "Debit Member.wallet for no-show penalty (NO_SHOW_PENALTY_CENTS constant), bucket=PRINCIPAL, kind=DEBIT, service_type=PT_SESSION"
          - "If billing_mode == PACKAGE: PTPackage.sessions_consumed += 1 (session is forfeited)"
          - "No commission accrues (only COMPLETED accrues)"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /pt-bookings/{id}/complete"
        actor: Trainer | StaffOps
        preconditions:
          - "PTBooking.status == CONFIRMED"
          - "now() >= scheduled_starts_at"
        side_effects:
          - "TrainerSlot.status := COMPLETED"
          - "If billing_mode == PACKAGE: PTPackage.sessions_consumed += 1; if PTPackage.sessions_consumed == total_sessions then PTPackage.status := EXHAUSTED"
          - "Append CommissionRecord(kind=SESSION, amount_cents per §1.3 session_commission)"

  - entity: GroupBooking
    initial_state: CONFIRMED
    terminal_states: [CANCELED, ATTENDED, NO_SHOW]
    transitions:
      - from: CONFIRMED
        to: CANCELED
        trigger: "POST /group-bookings/{id}/cancel"
        actor: Member | StaffOps
        preconditions:
          - "GroupBooking.status == CONFIRMED"
          - "now() < class.starts_at - 2 hours (else use NO_SHOW path)"
        side_effects:
          - "GroupClass.confirmed_count -= 1"
          - "Promote head of waitlist: oldest WAITLISTED booking (waitlist_position==1) transitions WAITLISTED→CONFIRMED; assign waitlist_position null; emit IM notification PROMOTED"
          - "Decrement remaining waitlist_positions by 1"
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "System: promotion side effect of another GroupBooking CONFIRMED→CANCELED OR capacity increase via PATCH /group-classes/{id} (raised capacity)"
        actor: system
        preconditions:
          - "GroupBooking.status == WAITLISTED"
          - "GroupClass.confirmed_count < GroupClass.capacity"
          - "GroupBooking has the lowest waitlist_position among WAITLISTED rows on this class"
        side_effects:
          - "Debit member wallet for GroupClass.deduction_cents if > 0 (bucket=PRINCIPAL, kind=DEBIT, service_type=GROUP_CLASS) OR debit Card visit if card_id non-null"
          - "Emit IM notification PROMOTED"
      - from: WAITLISTED
        to: CANCELED
        trigger: "POST /group-bookings/{id}/cancel (when status WAITLISTED)"
        actor: Member
        preconditions: ["GroupBooking.status == WAITLISTED"]
        side_effects:
          - "Decrement waitlist_positions of later WAITLISTED rows by 1"
      - from: CONFIRMED
        to: ATTENDED
        trigger: "POST /group-bookings/{id}/check-in"
        actor: StaffOps
        preconditions: ["GroupBooking.status == CONFIRMED", "now() >= class.starts_at"]
        side_effects: ["Card.visits_consumed += 1 when card_id != null"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "System: clock crosses class.ends_at AND status still CONFIRMED"
        actor: system
        preconditions: ["GroupBooking.status == CONFIRMED", "now() >= class.ends_at"]
        side_effects: []

  - entity: GroupClass
    initial_state: SCHEDULED
    terminal_states: [CANCELED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: CANCELED
        trigger: "POST /group-classes/{id}/cancel"
        actor: StaffOps | PlatformAdmin
        preconditions: ["GroupClass.status == SCHEDULED", "now() < ends_at"]
        side_effects:
          - "For each CONFIRMED GroupBooking on this class: refund GroupClass.deduction_cents to wallet (kind=REFUND, bucket=PRINCIPAL) OR refund Card visit"
          - "For each WAITLISTED GroupBooking on this class: status := CANCELED"
          - "Emit IM notification CLASS_CANCELED to each affected member"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "System: clock crosses ends_at AND status == SCHEDULED"
        actor: system
        preconditions: ["GroupClass.status == SCHEDULED", "now() >= ends_at"]
        side_effects: []

  - entity: FreezeEpisode
    initial_state: REQUESTED
    terminal_states: [SETTLED, REJECTED, CANCELED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /cards/{id}/freeze (immediate-approval path; this scaffold auto-approves on submit)"
        actor: Member | StaffOps
        preconditions:
          - "Card.status == ACTIVE"
          - "CardType.max_freeze_days - Card.cumulative_freeze_days > 0"
        side_effects:
          - "Compute actual_days per §1.3 freeze_grant (min(requested_days, remaining_freeze_budget))"
          - "starts_at := now(); ends_at := now() + actual_days"
          - "Cascade: Card.status := FROZEN; Card.cumulative_freeze_days += actual_days"
      - from: APPROVED
        to: SETTLED
        trigger: "System: clock crosses ends_at (POST /_clock/advance)"
        actor: system
        preconditions: ["FreezeEpisode.status == APPROVED", "now() >= ends_at"]
        side_effects:
          - "Cascade: Card.status := ACTIVE; Card.effective_expiry_date recomputed per §1.3 effective_expiry"
      - from: REQUESTED
        to: REJECTED
        trigger: "Auto-reject path inside POST /cards/{id}/freeze when budget exhausted"
        actor: system
        preconditions: ["CardType.max_freeze_days - Card.cumulative_freeze_days == 0"]
        side_effects: []
      - from: APPROVED
        to: CANCELED
        trigger: "POST /freeze-episodes/{id}/cancel (early end-freeze)"
        actor: Member | StaffOps
        preconditions: ["FreezeEpisode.status == APPROVED", "now() < ends_at"]
        side_effects:
          - "actual_days := ceil((now() - starts_at) in days); ends_at := now()"
          - "Cascade: Card.status := ACTIVE; recompute Card.cumulative_freeze_days; recompute Card.effective_expiry_date"

  - entity: PTPackage
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, REFUNDED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "Side effect of PTBooking CONFIRMED→COMPLETED when sessions_consumed == total_sessions"
        actor: system
        preconditions: ["PTPackage.status == ACTIVE", "PTPackage.sessions_consumed == PTPackage.total_sessions"]
        side_effects: []
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /pt-packages/{id}/refund"
        actor: StaffOps | PlatformAdmin
        preconditions: ["PTPackage.status == ACTIVE", "PTPackage.sessions_consumed < PTPackage.total_sessions"]
        side_effects:
          - "Refund (total_sessions - sessions_consumed) * unit_price (per §1.3 package_unit_price) to wallet bucket=PRINCIPAL"
          - "Reverse package-sale commission proportionally per §1.3 commission_reversal — write CommissionRecord(kind=REVERSAL, negative amount)"
          - "Cancel each CONFIRMED PTBooking with package_id == this — slot returns to OPEN"
          - "Write AuditLogEntry action=COMMISSION_REVERSAL"

  - entity: PayoutCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /payouts/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "PayoutCycle.status == OPEN"
          - "now() >= cycle_end"
        side_effects:
          - "For each trainer: aggregate CommissionRecord rows (kind ∈ {SESSION, PACKAGE_SALE, REVERSAL}) with created_at in [cycle_start, cycle_end) AND payout_cycle_id IS NULL"
          - "Recompute Trainer.tier per §1.3 trainer_tier; append CommissionRecord(kind=TIER_BONUS, amount per §1.3 tier_bonus, payout_cycle_id := this cycle)"
          - "Stamp CommissionRecord.payout_cycle_id := this cycle on all aggregated rows"
          - "closed_at := now()"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two members race to claim the last slot in a TrainerSlot (the slot has status OPEN; both POST /pt-bookings simultaneously)"
    guarantee: "Exactly one booking succeeds; the slot transitions OPEN→RESERVED atomically with the winning booking row."
    error_id: ERR_SLOT_ALREADY_RESERVED
    http_status: 409
    serialization: "First-writer-wins on TrainerSlot.status"

  - scenario: "Two members race to grab the last confirmed seat (GroupClass.confirmed_count == capacity - 1; two POST /group-bookings)"
    guarantee: "Exactly one becomes CONFIRMED; the loser is WAITLISTED (not rejected) with waitlist_position == 1."
    error_id: ERR_CAPACITY_REACHED
    http_status: 409
    serialization: "First-writer-wins on confirmed_count increment; loser falls to waitlist path"

  - scenario: "Member submits two refund requests for the same Card simultaneously (POST /cards/{id}/refund × 2)"
    guarantee: "Exactly one transitions Card ACTIVE→REFUNDED; the other rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Card.status"

  - scenario: "Two PATCH /cards/{id} (e.g., notification settings) with the same prior version concurrently"
    guarantee: "OCC version check rejects the stale writer."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Version-based OCC on Card.version"

  - scenario: "Wallet debit (PT cancel within 24h penalty waiver disputed) vs concurrent recharge — both target Member.wallet_balance"
    guarantee: "Both append ordered WalletTransaction rows; reads project a deterministic balance from the append order."
    error_id: ERR_WALLET_LEDGER_CONFLICT
    http_status: 409
    serialization: "Append-only ledger; reads always project from MAX(created_at)"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: wallet_balance_projection
    trigger: "Read on GET /members/{id} and at every wallet-debit precondition check"
    algorithm: chronological
    formula: |
      principal_balance_cents =
        SUM(WalletTransaction.amount_cents
            WHERE member_id == m AND bucket == PRINCIPAL)
      bonus_balance_cents =
        SUM(WalletTransaction.amount_cents
            WHERE member_id == m AND bucket == BONUS
            AND (kind != BONUS_GRANT OR created_at_of_grant >= now() - <grant-specific TTL implied by BONUS_GRANT.expires_at>)
            AND NOT (kind == BONUS_EXPIRE has already consumed the corresponding grant))
      wallet_balance_cents = principal_balance_cents + bonus_balance_cents
    input_set: "All WalletTransaction rows for member; debit consumes BONUS bucket first (FIFO by created_at on outstanding BONUS_GRANT)."
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: projected_after_pending
        when: "Quoting upcoming charges in GET /members/{id}/wallet/quote"
        difference: "Includes hypothetical DEBIT for the requested service; does NOT mutate."

  - name: wallet_debit
    trigger: "Side effect of POST /pt-bookings, POST /group-bookings, POST /cards (issuance), POST /cards/{id}/transfer"
    algorithm: chronological
    formula: |
      need = amount_to_debit
      # FIFO over still-outstanding BONUS_GRANT rows (older expires_at first; tie-break older created_at first)
      for grant in outstanding_bonus_grants_ordered:
          take = min(grant.outstanding_cents, need)
          append DEBIT(bucket=BONUS, amount=-take, ref_entity=grant.id)
          need -= take
          if need == 0: break
      if need > 0:
          if principal_balance_cents < need: raise ERR_INSUFFICIENT_BALANCE
          append DEBIT(bucket=PRINCIPAL, amount=-need, ref_entity=<calling entity>)
    input_set: "All outstanding bonus grants for member, sorted by (expires_at ASC, created_at ASC); principal balance."
    constants: {}
    precision: "integer cents"
    variants:
      - name: refund_credit
        when: "On cancellation refund and class-cancel refund"
        difference: "Always credits PRINCIPAL bucket regardless of which bucket originally paid (one-way: bonus is never refunded back to bonus)."

  - name: recharge_bonus_grant
    trigger: "POST /members/{id}/wallet/recharge"
    algorithm: tiered_pricing
    formula: |
      bonus_pct_bp =
        if amount_cents >= 100000: 2000     # 20%
        elif amount_cents >= 50000: 1000    # 10%
        elif amount_cents >= 20000:  500    # 5%
        else: 0
      bonus_cents = (amount_cents * bonus_pct_bp) // 10000     # truncate-to-zero
      bonus_expires_at = now() + 365 days (UTC end of day)
      append RECHARGE(bucket=PRINCIPAL, +amount_cents)
      if bonus_cents > 0: append BONUS_GRANT(bucket=BONUS, +bonus_cents, expires_at=bonus_expires_at)
    input_set: "amount_cents from request body."
    constants:
      TIER1_THRESHOLD_CENTS: 20000
      TIER2_THRESHOLD_CENTS: 50000
      TIER3_THRESHOLD_CENTS: 100000
      BONUS_TTL_DAYS: 365
    precision: "integer cents; truncate toward zero on basis-point multiplication"
    variants: []

  - name: effective_expiry
    trigger: "Read; recomputed on every Card mutation (freeze settle, freeze cancel)"
    algorithm: aggregation
    formula: |
      effective_expiry_date = original_expiry_date + SUM(FreezeEpisode.actual_days
                                WHERE card_id == c AND status IN {SETTLED, APPROVED, CANCELED})
      # APPROVED contributes its current actual_days (the in-progress freeze).
      # CANCELED contributes its actual_days at cancellation time (early end shortens but never negative).
    input_set: "FreezeEpisode rows for card; status filter pins which rows contribute."
    constants: {}
    precision: "datetime; truncate to end-of-day UTC (23:59:59.999Z)"
    variants: []

  - name: freeze_grant
    trigger: "POST /cards/{id}/freeze (during REQUESTED→APPROVED transition)"
    algorithm: threshold
    formula: |
      remaining_budget = CardType.max_freeze_days - Card.cumulative_freeze_days
      if remaining_budget == 0: raise ERR_FREEZE_BUDGET_EXHAUSTED  (REJECTED)
      actual_days = min(requested_days, remaining_budget)
    input_set: "CardType.max_freeze_days, Card.cumulative_freeze_days, requested_days from body."
    constants: {}
    precision: "integer days"
    variants: []

  - name: remaining_value
    trigger: "POST /cards/{id}/refund and POST /cards/{id}/transfer"
    algorithm: forward_looking
    formula: |
      # FORWARD_LOOKING: prorate by remaining time/visits at the moment of action
      if CardType.category == PER_VISIT:
          # value per visit basis
          unit_value = Card.issuance_price_cents / CardType.visit_quota
          remaining_value_cents = round_half_up(unit_value * Card.visits_remaining)
      else:  # MONTHLY or ANNUAL
          remaining_days = max(0, (effective_expiry_date - now()) in days)
          remaining_value_cents = round_half_up(
              Card.issuance_price_cents * remaining_days / CardType.validity_days)
    input_set: "Card.issuance_price_cents, Card.visits_remaining OR Card.effective_expiry_date, CardType.validity_days."
    constants: {}
    precision: "integer cents; round_half_up at the FINAL step (sum-then-round, NOT round-per-day)"
    variants:
      - name: chronological_remaining
        when: "Used by GET /cards/{id}/refund-preview when CardType.category in {MONTHLY, ANNUAL}"
        difference: |
          CHRONOLOGICAL: walk day-by-day from today to effective_expiry_date,
          accumulating Card.issuance_price_cents / CardType.validity_days per day,
          rounding each per-day value to nearest cent (round_half_up) then summing.
          For non-evenly-divisible prices this yields a DIFFERENT result than forward_looking
          (round-per-day vs sum-then-round). The refund-preview endpoint MAY surface this variant
          so members see worst-case rounding; the actual refund uses forward_looking.

  - name: transfer_fee
    trigger: "POST /cards/{id}/transfer"
    algorithm: tiered_pricing
    formula: |
      # Step 1: compute remaining_value_cents per remaining_value (forward_looking variant)
      # Step 2: apply CardType.transfer_fee_pct_bp
      transfer_fee_cents = round_half_up(remaining_value_cents * CardType.transfer_fee_pct_bp / 10000)
      # Step 3: floor at MIN_TRANSFER_FEE_CENTS
      transfer_fee_cents = max(transfer_fee_cents, MIN_TRANSFER_FEE_CENTS)
    input_set: "remaining_value_cents (already computed), CardType.transfer_fee_pct_bp."
    constants:
      MIN_TRANSFER_FEE_CENTS: 2000
    precision: "integer cents; round_half_up at step 2 before applying the MIN floor"
    variants: []

  - name: renewal_quote
    trigger: "GET /cards/{id}/renewal-quote AND auto-renewal cascade in Card EXPIRED transition"
    algorithm: tiered_pricing
    formula: |
      days_to_expiry = (effective_expiry_date - now()) in days
      if days_to_expiry > 30:
          discount_bp = 0     # too early — no discount
      elif days_to_expiry >= 7:
          discount_bp = CardType.renewal_discount_pct_bp
      elif days_to_expiry >= 0:
          discount_bp = CardType.renewal_discount_pct_bp + 500     # +5% inside last 7 days
      else:
          discount_bp = 0     # already lapsed — no discount on auto-renew
      base = CardType.price_cents
      renewal_price_cents = round_half_up(base * (10000 - discount_bp) / 10000)
    input_set: "Card.effective_expiry_date, CardType.price_cents, CardType.renewal_discount_pct_bp."
    constants:
      EARLY_RENEWAL_WINDOW_DAYS: 30
      URGENT_RENEWAL_WINDOW_DAYS: 7
      URGENT_BONUS_DISCOUNT_BP: 500
    precision: "integer cents; round_half_up at FINAL step"
    variants: []

  - name: session_commission
    trigger: "PTBooking CONFIRMED→COMPLETED side effect"
    algorithm: aggregation
    formula: |
      base_rate_bp = Trainer.session_commission_pct_bp
      # Tier modifier applied immediately (NOT just at payout-close)
      tier_modifier_bp =
          0   if Trainer.tier == BRONZE
        500   if Trainer.tier == SILVER       # +5%
       1000   if Trainer.tier == GOLD         # +10%
      effective_bp = base_rate_bp + tier_modifier_bp
      amount_cents = round_half_up(session_price_cents * effective_bp / 10000)
    input_set: "PTBooking.session_price_cents, Trainer.session_commission_pct_bp, Trainer.tier."
    constants:
      SILVER_BONUS_BP: 500
      GOLD_BONUS_BP: 1000
    precision: "integer cents; round_half_up"
    variants: []

  - name: package_unit_price
    trigger: "Read-time and used inside session_commission for PACKAGE billing_mode"
    algorithm: aggregation
    formula: |
      # PINNED EVALUATION ORDER: divide gross by total_sessions FIRST, round to nearest cent,
      # then any remainder is absorbed into the FINAL session.
      base_unit = floor(PTPackage.gross_price_cents / PTPackage.total_sessions)
      remainder = PTPackage.gross_price_cents - base_unit * PTPackage.total_sessions
      session_price_cents =
          base_unit + remainder    if this is the package's total_sessions-th completed session
          base_unit                otherwise
    input_set: "PTPackage.gross_price_cents, PTPackage.total_sessions, PTPackage.sessions_consumed."
    constants: {}
    precision: "integer cents; remainder-on-last-session policy"
    variants: []

  - name: package_sale_commission
    trigger: "POST /pt-packages (package activation; computed once, written as CommissionRecord(kind=PACKAGE_SALE))"
    algorithm: aggregation
    formula: |
      amount_cents = round_half_up(PTPackage.gross_price_cents * Trainer.package_commission_pct_bp / 10000)
    input_set: "PTPackage.gross_price_cents, Trainer.package_commission_pct_bp."
    constants: {}
    precision: "integer cents; round_half_up"
    variants: []

  - name: commission_reversal
    trigger: "POST /pt-packages/{id}/refund AND POST /cards/{id}/refund (when refunded card had package commission tied to it)"
    algorithm: aggregation
    formula: |
      # PACKAGE refund:
      sessions_unconsumed = PTPackage.total_sessions - PTPackage.sessions_consumed
      original_pkg_commission = SUM(CommissionRecord.amount_cents
                                    WHERE kind == PACKAGE_SALE AND ref_entity == 'PTPackage:<id>')
      reversal_amount_cents = - round_half_up(
          original_pkg_commission * sessions_unconsumed / PTPackage.total_sessions)
      append CommissionRecord(kind=REVERSAL, amount_cents=reversal_amount_cents,
                              ref_entity='PTPackage:<id>')
      # Invariant: original_pkg_commission + reversal_amount_cents
      #           equals the commission attributable to consumed sessions only.
    input_set: "Original PACKAGE_SALE CommissionRecord for the package; sessions_consumed at refund time."
    constants: {}
    precision: "integer cents; round_half_up"
    variants: []

  - name: trainer_tier
    trigger: "POST /payouts/{id}/close (recompute at cycle close)"
    algorithm: threshold
    formula: |
      cycle_session_count = COUNT(PTBooking WHERE status==COMPLETED
                                  AND trainer_id == t
                                  AND scheduled_starts_at in [cycle_start, cycle_end))
      if cycle_session_count >= 80: new_tier = GOLD
      elif cycle_session_count >= 40: new_tier = SILVER
      else: new_tier = BRONZE
      Trainer.tier := new_tier
    input_set: "PTBooking rows for trainer within cycle window, COMPLETED only."
    constants:
      GOLD_THRESHOLD: 80
      SILVER_THRESHOLD: 40
    precision: "integer count"
    variants: []

  - name: tier_bonus
    trigger: "POST /payouts/{id}/close (after trainer_tier recomputed)"
    algorithm: tiered_pricing
    formula: |
      cycle_session_commission_total = SUM(CommissionRecord.amount_cents
          WHERE trainer_id == t AND kind == SESSION
          AND created_at in [cycle_start, cycle_end))
      tier_bonus_pct_bp =
            0   if new_tier == BRONZE
         1000   if new_tier == SILVER          # 10% of session commission
         2000   if new_tier == GOLD            # 20% of session commission
      bonus_amount_cents = round_half_up(cycle_session_commission_total * tier_bonus_pct_bp / 10000)
      append CommissionRecord(kind=TIER_BONUS, amount_cents=bonus_amount_cents,
                              payout_cycle_id=<cycle>, ref_entity='PayoutCycle:<id>')
    input_set: "All SESSION-kind CommissionRecord rows for trainer in cycle window."
    constants:
      SILVER_BONUS_BP: 1000
      GOLD_BONUS_BP: 2000
    precision: "integer cents; round_half_up"
    variants: []

  - name: reminder_dispatch
    trigger: "System: POST /_sweep/run scans cards approaching expiry; explicit POST /cards/{id}/send-reminder"
    algorithm: threshold
    formula: |
      days_to_expiry = (effective_expiry_date - now()) in days
      if days_to_expiry == 30: tier = T30; channels_set = {SMS, EMAIL} ∩ Member.notification_channels
      elif days_to_expiry == 7: tier = T7;  channels_set = {SMS, EMAIL, IM} ∩ Member.notification_channels
      elif days_to_expiry <= 0:
          tier = T0
          channels_set = {SMS, EMAIL, IM, PUSH} ∩ Member.notification_channels
          if Member.auto_renew_authorized: mark RenewalReminder.status = AUTO_RENEW_TRIGGERED
          else if days_to_expiry < 0:      mark RenewalReminder.status = LAPSED
          else:                            mark RenewalReminder.status = SENT
      else: no reminder dispatched
    input_set: "All ACTIVE Card rows; Member.notification_channels; Member.auto_renew_authorized."
    constants:
      T30_DAYS: 30
      T7_DAYS: 7
    precision: "integer days"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all except /_clock/advance, /_sweep/run, /_events/emit (operator-tooling endpoints accept system role)"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles in §1.7"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path parameter id resolves to an existing entity (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-param endpoints"

  - priority: 5
    category: existence
    check: "Body foreign keys (card_type_id, member_id, trainer_id, slot_id, class_id, card_id, package_id) resolve to existing entities"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PATCH with FK body fields"

  - priority: 6
    category: business_referential
    check: "Acting Member matches resource ownership: Member role calling /cards/{id}/* must have card.holder_member_id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all Member-actor endpoints on Card, PTBooking, GroupBooking, FreezeEpisode"

  - priority: 7
    category: state
    check: "Target Card.status matches the transition's required from-state (e.g., refund requires ACTIVE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "card lifecycle transitions"

  - priority: 8
    category: state
    check: "Target PTBooking/GroupBooking status matches transition's from-state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "booking transitions"

  - priority: 9
    category: state
    check: "CardType.status == ACTIVE when issuing a new card"
    error_id: ERR_CARD_TYPE_RETIRED
    http_status: 409
    applies_to: "POST /cards"

  - priority: 10
    category: business_safety
    check: "Trainer.status == ACTIVE when booking a PT session or selling a package"
    error_id: ERR_TRAINER_INACTIVE
    http_status: 409
    applies_to: "POST /pt-bookings, POST /pt-packages"

  - priority: 11
    category: business_referential
    check: "TrainerSlot.trainer_id matches the trainer specialty requested AND TrainerSlot.specialty_code is in Trainer.specialties"
    error_id: ERR_SPECIALTY_MISMATCH
    http_status: 422
    applies_to: "POST /pt-bookings"

  - priority: 12
    category: business_constraint
    check: "TrainerSlot.status == OPEN at booking time (else slot already taken)"
    error_id: ERR_SLOT_ALREADY_RESERVED
    http_status: 409
    applies_to: "POST /pt-bookings"

  - priority: 13
    category: business_temporal
    check: "On POST /trainer-slots: new slot interval [starts_at, ends_at) does not overlap any existing slot of the same trainer where status IN {OPEN, RESERVED}. Adjacent slots that share an endpoint (a.ends_at == b.starts_at) are ALLOWED (half-open interval semantics)."
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /trainer-slots"

  - priority: 14
    category: business_temporal
    check: "On POST /group-classes: new class interval [starts_at, ends_at) does not overlap any existing class of the same instructor_trainer_id where status == SCHEDULED. UNLIKE trainer slots, group classes require a 30-minute buffer between any two classes for the same instructor (b.starts_at - a.ends_at >= 30 minutes), so adjacent-with-equal-endpoints are REJECTED here."
    error_id: ERR_CLASS_OVERLAP
    http_status: 409
    applies_to: "POST /group-classes"

  - priority: 15
    category: business_constraint
    check: "GroupClass.confirmed_count < capacity OR member is allowed to enter waitlist"
    error_id: ERR_CAPACITY_REACHED
    http_status: 409
    applies_to: "POST /group-bookings (only when caller explicitly forbids waitlist via accept_waitlist=false in body)"

  - priority: 16
    category: business_constraint
    check: "PT booking cancellation is within an allowed window (now() < scheduled_starts_at)"
    error_id: ERR_CANCEL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /pt-bookings/{id}/cancel"

  - priority: 17
    category: business_constraint
    check: "Group-class cancellation is at least 2 hours before starts_at"
    error_id: ERR_CANCEL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /group-bookings/{id}/cancel (when status==CONFIRMED)"

  - priority: 18
    category: business_safety
    check: "CardType.refund_eligibility_days: remaining_validity_days >= eligibility threshold"
    error_id: ERR_REFUND_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /cards/{id}/refund"

  - priority: 19
    category: business_referential
    check: "Card has no SETTLED FreezeEpisode (cards ever-frozen are non-refundable). Distinct from priority 18 which is a fiscal-window check."
    error_id: ERR_REFUND_FROZEN_CARD_BLOCKED
    http_status: 422
    applies_to: "POST /cards/{id}/refund"

  - priority: 20
    category: business_constraint
    check: "Card is transferable: visits_consumed == 0 AND no SETTLED FreezeEpisode"
    error_id: ERR_TRANSFER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /cards/{id}/transfer"

  - priority: 21
    category: business_constraint
    check: "Transfer destination Member.family_group_id == source Member.family_group_id OR CardType.family_shareable == true OR Card was issued within 7 days"
    error_id: ERR_TRANSFER_INELIGIBLE_RECIPIENT
    http_status: 422
    applies_to: "POST /cards/{id}/transfer"

  - priority: 22
    category: business_fiscal
    check: "CardType.max_freeze_days - Card.cumulative_freeze_days > 0 at freeze request"
    error_id: ERR_FREEZE_BUDGET_EXHAUSTED
    http_status: 422
    applies_to: "POST /cards/{id}/freeze"

  - priority: 23
    category: business_temporal
    check: "No active FreezeEpisode currently APPROVED on the card (only one concurrent freeze allowed)"
    error_id: ERR_FREEZE_IN_PROGRESS
    http_status: 409
    applies_to: "POST /cards/{id}/freeze"

  - priority: 24
    category: business_referential
    check: "Card has no CONFIRMED PT booking whose scheduled_starts_at falls within the proposed freeze window. Distinct from priority 23 (which is a same-entity state check) — this involves a different entity (PTBooking) and a different error category."
    error_id: ERR_FREEZE_CONFLICTS_WITH_BOOKING
    http_status: 409
    applies_to: "POST /cards/{id}/freeze"

  - priority: 25
    category: business_fiscal
    check: "Wallet balance covers the requested debit (principal + bonus combined, after bonus FIFO applied)"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /pt-bookings (SINGLE mode), POST /group-bookings (paid class), POST /cards (issuance), POST /cards/{id}/transfer (fee)"

  - priority: 26
    category: business_fiscal
    check: "Card.visits_remaining > 0 when card_id supplied as payment for group-class entry"
    error_id: ERR_CARD_VISITS_EXHAUSTED
    http_status: 422
    applies_to: "POST /group-bookings (with card_id), POST /access-events"

  - priority: 27
    category: business_referential
    check: "Family-shared card use: Card.holder_member_id and acting Member.id share family_group_id when Member != holder"
    error_id: ERR_FAMILY_SHARE_NOT_AUTHORIZED
    http_status: 403
    applies_to: "POST /access-events, POST /group-bookings (with shared card_id)"

  - priority: 28
    category: business_temporal
    check: "Recharge amount > 0 cents AND amount <= MAX_RECHARGE_CENTS"
    error_id: ERR_RECHARGE_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /members/{id}/wallet/recharge"

  - priority: 29
    category: business_constraint
    check: "PayoutCycle close requires now() >= cycle_end (cannot close before window closes)"
    error_id: ERR_PAYOUT_CYCLE_OPEN
    http_status: 409
    applies_to: "POST /payouts/{id}/close"

  - priority: 30
    category: business_constraint
    check: "Optimistic concurrency: provided version equals current entity version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints accepting version"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Card types ----
  - method: POST
    path: "/card-types"
    description: "Create a card type configuration."
    roles: [PlatformAdmin]
    code: 201
    input: [code, category, price_cents, validity_days, visit_quota, family_shareable, max_freeze_days, transfer_fee_pct_bp, renewal_discount_pct_bp, refund_eligibility_days]
    output: CardType
    side_effects: []

  - method: GET
    path: "/card-types"
    description: "List card types."
    roles: [PlatformAdmin, StaffOps, Member, Trainer]
    code: 200
    input: ["limit?", "offset?", "category?", "status?"]
    output: "CardType[]"
    side_effects: []

  - method: PATCH
    path: "/card-types/{id}"
    description: "Retire a card type (status RETIRED) or edit pricing for FUTURE issuance only."
    roles: [PlatformAdmin]
    code: 200
    input: ["version", "status?", "price_cents?", "renewal_discount_pct_bp?"]
    output: CardType
    side_effects: []

  # ---- Members ----
  - method: POST
    path: "/members"
    description: "Register a member."
    roles: [PlatformAdmin, StaffOps]
    code: 201
    input: ["full_name", "phone", "email", "family_group_id?", "notification_channels?", "auto_renew_authorized?"]
    output: Member
    side_effects: []

  - method: GET
    path: "/members/{id}"
    description: "Get member with computed wallet balances."
    roles: [PlatformAdmin, StaffOps, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: PATCH
    path: "/members/{id}"
    description: "Update notification channels or auto-renew authorization."
    roles: [PlatformAdmin, StaffOps, Member]
    code: 200
    input: ["version", "notification_channels?", "auto_renew_authorized?", "family_group_id?"]
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{id}/wallet/recharge"
    description: "Recharge stored value with tiered bonus."
    roles: [Member, StaffOps, PlatformAdmin]
    code: 201
    input: [amount_cents]
    output: "WalletTransaction[]"
    side_effects: ["recharge_bonus_grant calc", "emit payment-sync event RECHARGED"]

  - method: GET
    path: "/members/{id}/wallet/quote"
    description: "Forward-looking quote of what a hypothetical debit would consume (bonus-first)."
    roles: [Member, StaffOps]
    code: 200
    input: ["amount_cents", "service_type?"]
    output: "object"
    side_effects: []

  - method: GET
    path: "/members/{id}/wallet/transactions"
    description: "List wallet ledger entries."
    roles: [Member, StaffOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "kind?", "bucket?"]
    output: "WalletTransaction[]"
    side_effects: []

  # ---- Cards ----
  - method: POST
    path: "/cards"
    description: "Issue a card (status PENDING)."
    roles: [PlatformAdmin, StaffOps]
    code: 201
    input: [card_type_id, holder_member_id]
    output: Card
    side_effects: ["debit wallet for CardType.price_cents (DEBIT, service_type=CARD_ISSUANCE)"]

  - method: GET
    path: "/cards/{id}"
    description: "Get card with computed effective_expiry_date, visits_remaining."
    roles: [PlatformAdmin, StaffOps, Member]
    code: 200
    input: []
    output: Card
    side_effects: []

  - method: GET
    path: "/cards"
    description: "List cards (filterable)."
    roles: [PlatformAdmin, StaffOps, Member]
    code: 200
    input: ["limit?", "offset?", "holder_member_id?", "status?"]
    output: "Card[]"
    side_effects: []

  - method: POST
    path: "/cards/{id}/activate"
    description: "Activate a PENDING card."
    roles: [PlatformAdmin, StaffOps]
    code: 200
    input: []
    output: Card
    side_effects: ["Card PENDING→ACTIVE; emit ACCESS_GRANT"]

  - method: POST
    path: "/cards/{id}/freeze"
    description: "Request and auto-approve a freeze episode."
    roles: [PlatformAdmin, StaffOps, Member]
    code: 201
    input: [reason, requested_days]
    output: FreezeEpisode
    side_effects: ["FreezeEpisode REQUESTED→APPROVED", "Card ACTIVE→FROZEN", "emit ACCESS_REVOKE"]

  - method: POST
    path: "/cards/{id}/unfreeze"
    description: "End an in-progress freeze early."
    roles: [PlatformAdmin, StaffOps, Member]
    code: 200
    input: [freeze_episode_id]
    output: FreezeEpisode
    side_effects: ["FreezeEpisode APPROVED→CANCELED", "Card FROZEN→ACTIVE", "recompute effective_expiry_date"]

  - method: POST
    path: "/cards/{id}/refund"
    description: "Refund a card; cascades commission reversal."
    roles: [PlatformAdmin, StaffOps]
    code: 200
    input: []
    output: Card
    side_effects: ["Card ACTIVE→REFUNDED", "wallet credit (REFUND)", "commission_reversal", "AuditLogEntry CARD_REFUND"]

  - method: GET
    path: "/cards/{id}/refund-preview"
    description: "Show both forward_looking and chronological_remaining variants of remaining value."
    roles: [PlatformAdmin, StaffOps, Member]
    code: 200
    input: []
    output: "object"
    side_effects: []

  - method: POST
    path: "/cards/{id}/transfer"
    description: "Transfer card to a different member; debits transfer fee."
    roles: [PlatformAdmin, StaffOps]
    code: 200
    input: [to_member_id]
    output: TransferRecord
    side_effects: ["Card ACTIVE→TRANSFERRED on source", "new Card created for destination", "wallet debit (transfer_fee)", "ACCESS sync"]

  - method: GET
    path: "/cards/{id}/renewal-quote"
    description: "Quote renewal price with applicable discount tier."
    roles: [PlatformAdmin, StaffOps, Member]
    code: 200
    input: []
    output: "object"
    side_effects: []

  - method: POST
    path: "/cards/{id}/send-reminder"
    description: "Manually dispatch renewal reminder."
    roles: [PlatformAdmin, StaffOps]
    code: 201
    input: [tier]
    output: RenewalReminder
    side_effects: ["reminder_dispatch calc; emit IM/SMS/EMAIL/PUSH per channel set"]

  # ---- Trainers & slots ----
  - method: POST
    path: "/trainers"
    description: "Create a trainer profile."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, specialties, session_commission_pct_bp, package_commission_pct_bp]
    output: Trainer
    side_effects: []

  - method: GET
    path: "/trainers/{id}"
    description: "Get a trainer."
    roles: [PlatformAdmin, StaffOps, Member, Trainer]
    code: 200
    input: []
    output: Trainer
    side_effects: []

  - method: PATCH
    path: "/trainers/{id}"
    description: "Update specialties, status, or commission rates."
    roles: [PlatformAdmin]
    code: 200
    input: ["version", "specialties?", "status?", "session_commission_pct_bp?", "package_commission_pct_bp?"]
    output: Trainer
    side_effects: []

  - method: POST
    path: "/trainer-slots"
    description: "Publish a trainer slot."
    roles: [PlatformAdmin, StaffOps, Trainer]
    code: 201
    input: [trainer_id, starts_at, ends_at, specialty_code]
    output: TrainerSlot
    side_effects: []

  - method: GET
    path: "/trainer-slots"
    description: "List slots (filterable by trainer, specialty, time window)."
    roles: [PlatformAdmin, StaffOps, Member, Trainer]
    code: 200
    input: ["limit?", "offset?", "trainer_id?", "specialty_code?", "status?", "starts_after?", "starts_before?"]
    output: "TrainerSlot[]"
    side_effects: []

  # ---- PT bookings & packages ----
  - method: POST
    path: "/pt-bookings"
    description: "Book a single PT session or a package session."
    roles: [Member, StaffOps, PlatformAdmin]
    code: 201
    input: ["member_id", "slot_id", "billing_mode", "package_id?"]
    output: PTBooking
    side_effects: ["TrainerSlot OPEN→RESERVED", "wallet debit (SINGLE) or package decrement validation (PACKAGE)"]

  - method: POST
    path: "/pt-bookings/{id}/cancel"
    description: "Cancel a CONFIRMED booking."
    roles: [Member, StaffOps, PlatformAdmin]
    code: 200
    input: []
    output: PTBooking
    side_effects: ["Slot returned", "Refund per 24h policy"]

  - method: POST
    path: "/pt-bookings/{id}/complete"
    description: "Mark a booking COMPLETED; accrues commission."
    roles: [Trainer, StaffOps, PlatformAdmin]
    code: 200
    input: []
    output: PTBooking
    side_effects: ["session_commission accrual", "package consumption if package mode"]

  - method: POST
    path: "/pt-bookings/{id}/no-show"
    description: "Mark booking NO_SHOW manually before clock catches it."
    roles: [StaffOps, PlatformAdmin]
    code: 200
    input: []
    output: PTBooking
    side_effects: ["no-show penalty debit"]

  - method: POST
    path: "/pt-packages"
    description: "Sell a package; commission accrues."
    roles: [Member, StaffOps, PlatformAdmin]
    code: 201
    input: [member_id, trainer_id, total_sessions, gross_price_cents]
    output: PTPackage
    side_effects: ["wallet debit gross_price_cents", "package_sale_commission CommissionRecord"]

  - method: POST
    path: "/pt-packages/{id}/refund"
    description: "Refund unused package balance; reverses package commission proportionally."
    roles: [StaffOps, PlatformAdmin]
    code: 200
    input: []
    output: PTPackage
    side_effects: ["PTPackage ACTIVE→REFUNDED", "wallet refund", "commission_reversal", "AuditLogEntry COMMISSION_REVERSAL"]

  # ---- Group classes & bookings ----
  - method: POST
    path: "/group-classes"
    description: "Schedule a group class (one-off or recurring instance)."
    roles: [PlatformAdmin, StaffOps]
    code: 201
    input: ["class_code", "instructor_trainer_id", "starts_at", "ends_at", "capacity", "recurrence_series_id?", "deduction_cents?"]
    output: GroupClass
    side_effects: []

  - method: PATCH
    path: "/group-classes/{id}"
    description: "Adjust capacity OR record instructor substitution."
    roles: [PlatformAdmin, StaffOps]
    code: 200
    input: ["version", "capacity?", "substitute_trainer_id?"]
    output: GroupClass
    side_effects: ["If capacity raised: promote waitlist heads"]

  - method: POST
    path: "/group-classes/{id}/cancel"
    description: "Cancel a class; refunds all attendees and notifies IM."
    roles: [PlatformAdmin, StaffOps]
    code: 200
    input: []
    output: GroupClass
    side_effects: ["For each booking: refund wallet/visit; emit IM CLASS_CANCELED"]

  - method: POST
    path: "/group-bookings"
    description: "Book a group class (auto-waitlist if at capacity unless accept_waitlist=false)."
    roles: [Member, StaffOps, PlatformAdmin]
    code: 201
    input: ["class_id", "member_id", "card_id?", "accept_waitlist?"]
    output: GroupBooking
    side_effects: ["wallet debit OR Card visit reservation"]

  - method: POST
    path: "/group-bookings/{id}/cancel"
    description: "Cancel a group booking; promote waitlist head."
    roles: [Member, StaffOps, PlatformAdmin]
    code: 200
    input: []
    output: GroupBooking
    side_effects: ["promote waitlist", "refund or no-refund per window"]

  - method: POST
    path: "/group-bookings/{id}/check-in"
    description: "Check in at class start; transitions CONFIRMED→ATTENDED."
    roles: [StaffOps, PlatformAdmin]
    code: 200
    input: []
    output: GroupBooking
    side_effects: ["Card visit consumed"]

  # ---- Access control events ----
  - method: POST
    path: "/access-events"
    description: "Record a turnstile entry: debits a visit on the supplied card."
    roles: [StaffOps, PlatformAdmin]
    code: 201
    input: [card_id, member_id]
    output: "object"
    side_effects: ["Card.visits_consumed += 1", "Card EXPIRED transition if visits exhausted"]

  # ---- Payouts ----
  - method: POST
    path: "/payouts"
    description: "Open a payout cycle."
    roles: [PlatformAdmin]
    code: 201
    input: [cycle_start, cycle_end]
    output: PayoutCycle
    side_effects: []

  - method: POST
    path: "/payouts/{id}/close"
    description: "Close payout cycle: recompute trainer tier; append TIER_BONUS rows."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayoutCycle
    side_effects: ["trainer_tier recompute", "tier_bonus appended", "CommissionRecord.payout_cycle_id stamped"]

  - method: GET
    path: "/trainers/{id}/commissions"
    description: "List trainer commission records."
    roles: [PlatformAdmin, Trainer]
    code: 200
    input: ["limit?", "offset?", "payout_cycle_id?", "kind?"]
    output: "CommissionRecord[]"
    side_effects: []

  # ---- Operator/test endpoints ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the system clock to a given ISO 8601 UTC instant (test-driven). Triggers all time-gated transitions whose threshold the new clock crosses."
    roles: [system]
    code: 200
    input: [to]
    output: "object"
    side_effects: ["Card freeze settle, Card expiry, GroupClass complete, GroupBooking no-show, PTBooking no-show, reminder dispatch sweep (if scheduled)"]

  - method: POST
    path: "/_sweep/run"
    description: "Run the renewal-reminder sweep manually (test-driven)."
    roles: [system]
    code: 200
    input: []
    output: "object"
    side_effects: ["reminder_dispatch over all ACTIVE Cards"]

  - method: POST
    path: "/_events/emit"
    description: "Inject an external event (payment confirmation, IM ACK, access-control confirm) into the system."
    roles: [system]
    code: 200
    input: [event_type, payload]
    output: "object"
    side_effects: ["External-system sync ack"]

  - method: GET
    path: "/audit-log"
    description: "List audit log entries."
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "action?", "actor_id?"]
    output: "AuditLogEntry[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or unknown X-User-Role/X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted, or acting member doesn't own the target resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-param id or body FK doesn't resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in required from-state for the requested transition"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "PATCH version != current entity version"
  - id: ERR_CARD_TYPE_RETIRED
    http: 409
    condition: "Card type referenced for issuance is RETIRED"
  - id: ERR_TRAINER_INACTIVE
    http: 409
    condition: "Trainer.status == INACTIVE when booking or selling a package"
  - id: ERR_SPECIALTY_MISMATCH
    http: 422
    condition: "Requested slot specialty not in Trainer.specialties or doesn't match slot.specialty_code"
  - id: ERR_SLOT_ALREADY_RESERVED
    http: 409
    condition: "TrainerSlot.status != OPEN at booking time (race-loser or replay)"
  - id: ERR_SLOT_OVERLAP
    http: 409
    condition: "New TrainerSlot interval overlaps an existing OPEN/RESERVED slot of the same trainer (half-open intervals; touching endpoints allowed)"
  - id: ERR_CLASS_OVERLAP
    http: 409
    condition: "New GroupClass interval is within 30 min of another SCHEDULED class for the same instructor"
  - id: ERR_CAPACITY_REACHED
    http: 409
    condition: "GroupClass at capacity and caller forbids waitlist (accept_waitlist=false)"
  - id: ERR_CANCEL_WINDOW_EXPIRED
    http: 409
    condition: "Attempted to cancel after the allowed window (PT: start time; Group: 2h before start)"
  - id: ERR_REFUND_NOT_ELIGIBLE
    http: 422
    condition: "Remaining validity days below CardType.refund_eligibility_days"
  - id: ERR_REFUND_FROZEN_CARD_BLOCKED
    http: 422
    condition: "Card has at least one SETTLED FreezeEpisode (non-refundable after freeze)"
  - id: ERR_TRANSFER_NOT_ELIGIBLE
    http: 422
    condition: "visits_consumed > 0 OR card has SETTLED FreezeEpisode"
  - id: ERR_TRANSFER_INELIGIBLE_RECIPIENT
    http: 422
    condition: "Destination Member doesn't satisfy family/family_shareable/7-day-grace rule"
  - id: ERR_FREEZE_BUDGET_EXHAUSTED
    http: 422
    condition: "CardType.max_freeze_days - cumulative_freeze_days == 0"
  - id: ERR_FREEZE_IN_PROGRESS
    http: 409
    condition: "Card already has an APPROVED FreezeEpisode in progress"
  - id: ERR_FREEZE_CONFLICTS_WITH_BOOKING
    http: 409
    condition: "Card has CONFIRMED PT booking inside proposed freeze window"
  - id: ERR_INSUFFICIENT_BALANCE
    http: 422
    condition: "Wallet (principal + bonus) cannot cover the requested debit"
  - id: ERR_CARD_VISITS_EXHAUSTED
    http: 422
    condition: "Card.visits_remaining == 0 when card supplied as payment"
  - id: ERR_FAMILY_SHARE_NOT_AUTHORIZED
    http: 403
    condition: "Member acting on a shared card without same family_group_id"
  - id: ERR_RECHARGE_AMOUNT_INVALID
    http: 422
    condition: "amount_cents <= 0 or amount_cents > MAX_RECHARGE_CENTS (1_000_000)"
  - id: ERR_PAYOUT_CYCLE_OPEN
    http: 409
    condition: "Close attempted while now() < cycle_end"
  - id: ERR_WALLET_LEDGER_CONFLICT
    http: 409
    condition: "Concurrent wallet operation produced an inconsistent append order (rare; retried)"
  - id: ERR_VALIDATION
    http: 422
    condition: "Request body field-level validation failure (type, range, enum)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Highest-privilege operator with override authority on cards, commissions, trainers, payouts, and audits."
    identity: opaque
    exclusive_operations:
      - "POST /card-types (create)"
      - "PATCH /card-types/{id}"
      - "POST /trainers (create)"
      - "PATCH /trainers/{id}"
      - "POST /payouts"
      - "POST /payouts/{id}/close"
      - "GET /audit-log"
    shared_operations:
      - "Card lifecycle ops (issue/activate/refund/transfer)"
      - "Freeze ops"
      - "Group class create/cancel"
      - "All GET endpoints"

  - name: StaffOps
    description: "Front-desk operator. Can act on behalf of members for card lifecycle, bookings, and class admin; cannot create card types or trainers, cannot close payouts."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /members"
      - "POST /cards"
      - "POST /cards/{id}/activate, /freeze, /unfreeze, /refund, /transfer"
      - "POST /trainer-slots (on behalf of trainer)"
      - "POST /pt-bookings (on behalf of member), /cancel, /complete, /no-show"
      - "POST /pt-packages, /pt-packages/{id}/refund"
      - "POST /group-classes, /cancel, /check-in, PATCH /group-classes/{id}"
      - "POST /group-bookings, /cancel"
      - "POST /access-events"
      - "POST /members/{id}/wallet/recharge"
      - "POST /cards/{id}/send-reminder"

  - name: Member
    description: "End user. Can act only on resources whose holder_member_id == self (or family_group_id linkage)."
    identity: entity_backed:Member
    exclusive_operations: []
    shared_operations:
      - "GET /members/{id}, GET /cards/{id} (own), GET /cards (filtered to self)"
      - "POST /pt-bookings (self), /cancel (own)"
      - "POST /group-bookings (self), /cancel (own)"
      - "POST /cards/{id}/freeze, /unfreeze (own card)"
      - "POST /members/{id}/wallet/recharge (self)"
      - "GET /members/{id}/wallet/transactions (self)"
      - "PATCH /members/{id} (self; notification/auto-renew/family_group_id)"

  - name: Trainer
    description: "Trainer. Can publish own slots and complete sessions, plus read own commissions."
    identity: entity_backed:Trainer
    exclusive_operations:
      - "GET /trainers/{id}/commissions (self only)"
    shared_operations:
      - "POST /trainer-slots (own)"
      - "POST /pt-bookings/{id}/complete (own bookings)"
      - "GET /trainers/{id} (self)"
      - "GET /trainer-slots (filtered to self)"

  - name: system
    description: "Internal/test-driven role used for clock advance, sweep run, and external-event injection. Never accepts user requests in production; gated to operator-tooling endpoints."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /_sweep/run"
      - "POST /_events/emit"
    shared_operations: []
