            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2022-09-20T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "CONVEYANCE_ACCEPTED" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Perimeter wall footing movement", repair_cost_estimate_cents: 700000, diminution_value_cents: 400000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "REJECT" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "REINVESTIGATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "REJECT" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "REINVESTIGATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "REJECT" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "REINVESTIGATE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
              payload: { action: "REJECT" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/defect-claims/${claim_id}/actions"
