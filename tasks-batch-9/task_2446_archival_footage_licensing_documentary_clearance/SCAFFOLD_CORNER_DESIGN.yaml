        distinguishing_aspect: "The DEPICTION_SURCHARGE of 0.008 is added to the row's risk weight only when the asset's depiction_status is OBTAINED AND a SIGNED release with approval_rights != NONE exists — so a LICENSED row rates at 0.018 rather than 0.010, moving the premium from 60000 to 92000 on identical coverage."
        test_recipe:
          setup:
            - "A production in CLEARANCE with one 45-second asset that names depiction_subject_key 'walsh-eileen' and is CLEARED by an EXECUTED ALL_MEDIA_WINDOW licence."
            - "One SIGNED SubjectRelease with approval_rights ROUGH_CUT attached to that asset, so depiction_status is OBTAINED and posture is OPEN."
            - "A chart pinned AFTER the release was signed (signing advances Asset.version), and an E&O application on it with coverage 4000000 / retention 100000."
