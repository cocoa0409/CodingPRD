              captures: { offer_a_id: $.data.id }
          trigger:
            - call: "POST /marketplace/offers/${offer_a_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { placement_a_id: $.data.id }
          assert:
            - "Placement ${placement_a_id} created PENDING_START with annualized_salary_cents == 17680000"
            - "Requisition.${req1_id}.openings_filled == 1 and status == FILLED (link 2)"
            - "Application ${app_b_id}.status == WITHDRAWN (link 3, caused by FILLED, not by the accept directly)"
            - "Interview ${iv_b_id}.status == CANCELLED (cascade of the application withdrawal)"
            - "Nurse.${nurse_id}.status == HIRED and Nurse.${nurse_b_id}.status == ACTIVE (unaffected)"

      - name: screening_fail_rescind_cascade_two_hops
        grounds:
          - state_machines.Screening.credential_status_PENDING_to_FAILED
          - state_machines.Offer.ISSUED_to_RESCINDED
          - state_machines.Application.OFFER_EXTENDED_to_WITHDRAWN
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (a screening axis failure,
          not an offer acceptance): failing the credential axis on a
          screening whose application has an ISSUED offer flips
          overall_status to BLOCKED (link 1), and that derivation itself
          rescinds the offer and withdraws the application (link 2) — the
          employer never touched the offer.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. Application OFFER_EXTENDED with an ISSUED offer; Screening exists with credential_status PENDING and background_status CLEARED (overall IN_PROGRESS)."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - *req_icu
            - *app_icu
            - *review_nora
            - *iv_nora
            - *clock_iv_done
            - *iv_complete
            - *scr_open
            - *scr_bg
            - *offer_issue
          trigger:
            - call: "POST /marketplace/screenings/${scr_id}/fail-credentials"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Screening.${scr_id}.credential_status == FAILED and overall_status == BLOCKED (link 1)"
            - "Offer.${offer_id}.status == RESCINDED (link 2, fired by the screening failure)"
            - "Application.${app_id}.status == WITHDRAWN"
            - "no Placement row exists for application ${app_id} (GET /marketplace/placements?application_id=${app_id} returns 0 rows)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_closed_requisition_accept
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors.ERR_INVALID_STATE
          - errors.ERR_NO_OPENINGS
        distinguishing_aspect: |
          Pair (state vs business_fiscal): an offer-accept request where the
          OFFER is already terminal (DECLINED earlier) AND the requisition is
          out of openings must surface ERR_INVALID_STATE (priority 4), not
          ERR_NO_OPENINGS (priority 10) — the state precondition is evaluated
          before the quota check.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. Application OFFER_EXTENDED with ISSUED offer; nurse declines the offer (offer DECLINED, application DECLINED). Independently, the requisition's single opening is then filled by another nurse's acceptance, so openings_filled == openings_total."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - *nurse_icu
            - *lic_nora
            - *submit_nora
            - *verify_nora
            - *req_icu
            - *app_icu
            - *review_nora
            - *iv_nora
            - *clock_iv_done
            - *iv_complete
            - *scr_open
            - *scr_cred
            - *scr_bg
            - *doc_sign
            - *doc_ok
            - *offer_issue
            - call: "POST /marketplace/offers/${offer_id}/decline"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /marketplace/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { err_accept: $.data.error_id }
          assert:
            - "err_accept == ERR_INVALID_STATE (priority 4 state check fires before any fiscal/quota check)"
            - "no Placement is created for application ${app_id}"

      - name: temporal_beats_referential_on_late_interview
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_DEADLINE_PASSED
          - errors.ERR_CREDENTIALS_INCOMPLETE
        distinguishing_aspect: |
          Pair (business_temporal vs business_referential): an interview
          request made after the application's response_deadline_at on an
          application whose nurse's license has in the meantime EXPIRED must
          surface ERR_DEADLINE_PASSED (priority 5), not
          ERR_CREDENTIALS_INCOMPLETE (priority 7) — deadline checks precede
          credential gates even though both hold.
        test_recipe:
          setup:
            - "Application created 2026-09-01T00:00:00Z (deadline 2026-09-04T00:00:00Z), moved to UNDER_REVIEW. Nurse's license expires 2026-09-03, so after the clock advances to 2026-09-05 the license is EXPIRED (license_verified false) AND the response deadline has passed."
          setup_api_calls:
            - *clock0
            - *emp_pp
            - call: "POST /marketplace/nurses"
              payload: { full_name: "Liz Short", email: "liz@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 6, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-liz"
              captures: { nurse_l_id: $.data.id, nurse_l_v: $.data.version }
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${nurse_l_id}", license_number: "RN-CA-900", license_state: "CA", expiry_date: "2026-09-03" }
              as: Candidate
              as_user_id: "${nurse_l_id}"
              captures: { lic_l_id: $.data.id }
            - call: "POST /marketplace/nurses/${nurse_l_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_l_id}"
            - call: "POST /marketplace/license-verifications/${lic_l_id}/verify"
              payload: {}
              as: PlatformAdmin
            - *req_icu
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req_id}", nurse_id: "${nurse_l_id}", proposed_hourly_rate_cents: 8500, proposed_shift: "DAY", expected_nurse_version: "${nurse_l_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { app_l_id: $.data.id }
            - call: "POST /marketplace/applications/${app_l_id}/review"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_l_id}"
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/applications/${app_l_id}/interviews"
              payload: { starts_at: "2026-09-06T10:00:00Z", ends_at: "2026-09-06T11:00:00Z" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_iv: $.data.error_id }
          assert:
            - "err_iv == ERR_DEADLINE_PASSED (priority 5 temporal check beats priority 7 referential check)"
            - "Application.${app_l_id}.status == EXPIRED (clock advance past the deadline fired the expiry transition)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: response_deadline_exact_equality_expires
        grounds:
          - calculations.response_deadline_rule
          - state_machines.Application.SUBMITTED_to_EXPIRED
        distinguishing_aspect: |
          Numeric-threshold boundary on the deadline metric: at clock ==
          response_deadline_at exactly (2026-09-04T00:00:00Z), the >=
