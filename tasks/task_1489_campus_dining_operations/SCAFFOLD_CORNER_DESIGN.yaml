            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r1}", variant: "BASE", expected_meal_period_version: "${pv}" }, as: KitchenLead, captures: { f: $.data.id } }
            - { call: "POST /production-forecasts/${f}/lock", payload: {}, as: KitchenLead }
            - { call: "POST /meal-periods/${p}/lock-forecast", payload: {}, as: HallManager }
            - { call: "GET /meal-periods/${p}", payload: {}, as: KitchenLead, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /meal-periods/${p}/forecasts", payload: { recipe_id: "${r2}", variant: "BASE", expected_meal_period_version: "${pv2}" }, as: KitchenLead, captures: { err: $.data.error_id } }
          assert:
