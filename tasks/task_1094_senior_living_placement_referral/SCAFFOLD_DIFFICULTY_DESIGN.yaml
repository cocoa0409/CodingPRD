      - name: move_in_confirmation_depth4_chain_to_sibling_tour_cancellation
        grounds:
          - state_machines.Placement.PENDING_MOVE_IN_to_MOVED_IN
          - state_machines.Inquiry.TOURING_to_PLACED
          - state_machines.Match.SHORTLISTED_to_WITHDRAWN
          - state_machines.Tour.SCHEDULED_to_CANCELLED
          - state_machines.CaseloadAssignment.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          DEPTH-4 chain rooted at POST /placements/{id}/confirm-move-in: L1 Placement -> MOVED_IN
          causes L2 Inquiry -> PLACED, which causes L3 sibling Match M2 -> WITHDRAWN and the
          CaseloadAssignment -> RELEASED, which in turn causes L4 the SCHEDULED Tour T2 on M2 ->
          CANCELLED with cancel_reason_code MATCH_WITHDRAWN. Each hop is caused by the previous
          hop, not directly by the confirm-move-in call.
