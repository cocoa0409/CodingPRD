          Mode (c) — interdependent quantities requiring a pinned resolution order: the commission is a
          percentage OF THE GROSS while the gross is the net PLUS the commission, so the gross must be
          obtained by dividing by (1 - 0.125) and the commission taken as the residual; the surplus
