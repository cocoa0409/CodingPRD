          assert:
            - "BEGIN_DISTRIBUTION by the recorder returns ${err} == ERR_SEGREGATION_OF_DUTIES (403) — SoD (p3) outranks the open-milestone referential failure (p23)"
            - "Estate.${e_id}.status remains PROBATE_OPEN (${st})"

  - rule_id: boundary_precision_check
    instances:
      - name: payout_rate_boundaries_500_and_5000
        grounds:
          - validations[priority=13]
          - entities.GiftAgreement.fields.payout_rate_bps
        distinguishing_aspect: |
          Metric payout_rate_bps on POST /giving/gift-agreements: the [500, 5000]
          range is inclusive — 499 and 5001 are rejected while exactly 500 and
          exactly 5000 are accepted.
        test_recipe:
          setup:
            - "Donor D; ACTIVE 5% rate table open-ended from 2026-01-01"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Boundary Rate", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 499, lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { err_low: $.data.error_id } }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ok_low: $.data.id } }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 5000, lives: 1, annuitant_1_age: 95, funding_month: "2026-08" }, as: GiftOfficer, captures: { ok_high: $.data.id } }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 5001, lives: 1, annuitant_1_age: 95, funding_month: "2026-08" }, as: GiftOfficer, captures: { err_high: $.data.error_id } }
          assert:
            - "499 rejected: ${err_low} == ERR_PAYOUT_RATE_OUT_OF_RANGE (422)"
            - "500 accepted: agreement ${ok_low} created in DRAFT"
            - "5000 accepted: agreement ${ok_high} created in DRAFT"
            - "5001 rejected: ${err_high} == ERR_PAYOUT_RATE_OUT_OF_RANGE (422)"

      - name: coverage_ratio_exactly_10000_solvent
        grounds:
          - calculations.reserve_coverage_posture
          - entities.ReserveFund.fields.booked_coverage_bps
        distinguishing_aspect: |
          Metric booked_coverage_bps on POST /giving/reserve-fund/adjustments:
          balance exactly equal to the booked target floors to exactly 10000 bps
          (SOLVENT, inclusive boundary); withdrawing one cent drops the floored
          ratio to 9999 (RESERVE_DEFICIENT) — a one-cent boundary.
        test_recipe:
          setup:
            - "Donor D; 5% ACTIVE table; CGA (gift 10000000, 600bps, QUARTERLY, age 80) EXECUTED->FUNDED with reserve balance exactly 7570148 == booked target"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Boundary Coverage", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CGA", gift_amount_cents: 10000000, payout_rate_bps: 600, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { cga_id: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${cga_id}", slot: "PRIMARY_1", beneficiary_name: "Self", document_received: true }, as: GiftOfficer, captures: { bd1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { rf_v: $.data.version } }
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "CONTRIBUTION", amount_cents: 7570148, expected_reserve_fund_version: "${rf_v}" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements/${cga_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${cga_id}", asset_kind: "CASH", pledged_value_cents: 10000000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
          trigger:
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { cov0: $.data.booked_coverage_bps, post0: $.data.posture, v0: $.data.version } }
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "WITHDRAWAL", amount_cents: 1, expected_reserve_fund_version: "${v0}" }, as: ComplianceOfficer, captures: { cov1: $.data.booked_coverage_bps, post1: $.data.posture, v1: $.data.version } }
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "CONTRIBUTION", amount_cents: 1, expected_reserve_fund_version: "${v1}" }, as: ComplianceOfficer, captures: { cov2: $.data.booked_coverage_bps, post2: $.data.posture } }
          assert:
            - "At exact equality: booked_coverage_bps == 10000 (${cov0}) and posture == SOLVENT (${post0})"
            - "One cent below: booked_coverage_bps == 9999 (${cov1}) and posture == RESERVE_DEFICIENT (${post1})"
            - "Restored: booked_coverage_bps == 10000 (${cov2}) and posture == SOLVENT (${post2})"

      - name: fund_activation_exact_minimum_endows
        grounds:
          - state_machines.Fund.PROPOSED_to_ENDOWED
          - state_machines.Estate.PROBATE_OPEN_to_DISTRIBUTION_PENDING
          - entities.Fund.fields.minimum_endowment_cents
        distinguishing_aspect: |
          Metric Fund.balance_cents via POST /giving/estates/{id}/transition
          BEGIN_DISTRIBUTION: a residual credit of exactly the fund's minimum
          (2500000) flips PROPOSED -> ENDOWED (inclusive >=); the same credit one
          cent short would leave it PROPOSED. Distinct metric and endpoint from
          the payout-rate and coverage boundaries.
        test_recipe:
          setup:
            - "Donor D; 5% ACTIVE table; BEQUEST agreement (gift 5000000) EXECUTED with fund_id pointing at a PROPOSED Fund (default minimum 2500000)"
            - "Donor death -> agreement MATURED, Estate auto-created (recorder em-1)"
            - "Estate CASH asset 2500000 RECEIVED then LIQUIDATED (gross 2500000, costs 0); probate open"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Boundary Fund", date_of_birth: "1935-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "BEQUEST", gift_amount_cents: 5000000, funding_month: "2026-08" }, as: GiftOfficer, captures: { beq_id: $.data.id, beq_v: $.data.version } }
            - { call: "POST /giving/funds", payload: { name: "Exact Minimum Fund", restriction_type: "SCHOLARSHIP", gift_agreement_id: "${beq_id}" }, as: FinanceSteward, captures: { fund_id: $.data.id } }
            - { call: "POST /giving/gift-agreements/${beq_id}/amend", payload: { expected_gift_agreement_version: "${beq_v}", fund_id: "${fund_id}" }, as: GiftAdministrator }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${beq_id}", slot: "PRIMARY_1", beneficiary_name: "University", document_received: true }, as: GiftOfficer, captures: { bd1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${beq_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/donors/${d_id}/record-death", payload: { deceased_on: "2026-09-01T00:00:00Z" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "GET /giving/estates", payload: { gift_agreement_id: "${beq_id}" }, as: EstateManager, captures: { e_id: "$.data[0].id" } }
            - { call: "POST /giving/gift-assets", payload: { estate_id: "${e_id}", asset_kind: "CASH", pledged_value_cents: 2500000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "LIQUIDATE", gross_proceeds_cents: 2500000, liquidation_costs_cents: 0 }, as: EstateManager }
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "OPEN_PROBATE" }, as: EstateManager, as_user_id: "em-1" }
          trigger:
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "BEGIN_DISTRIBUTION", administration_costs_cents: 0, specific_bequests_cents: 0 }, as: EstateManager, as_user_id: "em-2", captures: { est_status: $.data.status, resid: $.data.residual_to_university_cents } }
            - { call: "GET /giving/funds/${fund_id}", payload: {}, as: FinanceSteward, captures: { f_bal: $.data.balance_cents, f_status: $.data.status } }
            - { call: "POST /giving/funds/${fund_id}/transition", payload: { action: "ACTIVATE" }, as: FinanceSteward, captures: { f_active: $.data.status } }
          assert:
            - "Estate.${e_id}.status == DISTRIBUTION_PENDING (${est_status}); residual_to_university_cents == 2500000 (${resid})"
            - "Fund.${fund_id}.balance_cents == 2500000 (${f_bal}) — exactly the default minimum"
            - "Fund.${fund_id}.status == ENDOWED (${f_status}) — inclusive >= boundary endows"
            - "ACTIVATE from ENDOWED succeeds: ${f_active} == ACTIVE"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: payment_pay_gated_by_agreement_suspension
        grounds:
          - state_machines.AnnuityPayment.DUE_to_PAID
          - state_machines.AnnuityPayment.DUE_to_DEFERRED
          - state_machines.GiftAgreement.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair AnnuityPayment->GiftAgreement: while the parent agreement is
          SUSPENDED, PAY on its DUE payment is rejected ERR_AGREEMENT_SUSPENDED
          yet DEFER on a sibling DUE payment still succeeds — the dependency is
          operation-specific, and RESUME restores PAY.
        test_recipe:
          setup:
            - "CRAT (gift 10000000, 500bps, QUARTERLY, age 80, funding_month 2026-08) ACTIVE, 80 payments @125000; clock advanced to 2027-02-01 so payments 1 and 2 are DUE"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Cross Gate", date_of_birth: "1946-06-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag_id: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag_id}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${ag_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag_id}", asset_kind: "CASH", pledged_value_cents: 10000000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements/${ag_id}/generate-payment-schedule", payload: {}, as: GiftAdministrator }
            - { call: "POST /giving/_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${ag_id}", status: "DUE" }, as: GiftAdministrator, captures: { p1: "$.data[0].id", p2: "$.data[1].id" } }
          trigger:
            - { call: "POST /giving/gift-agreements/${ag_id}/transition", payload: { action: "SUSPEND" }, as: ComplianceOfficer }
            - { call: "POST /giving/annuity-payments/${p1}/transition", payload: { action: "PAY" }, as: GiftAdministrator, captures: { err: $.data.error_id } }
            - { call: "POST /giving/annuity-payments/${p2}/transition", payload: { action: "DEFER", defer_until: "2027-03-01T00:00:00Z" }, as: GiftAdministrator, captures: { p2_status: $.data.status } }
            - { call: "POST /giving/gift-agreements/${ag_id}/transition", payload: { action: "RESUME" }, as: ComplianceOfficer }
            - { call: "POST /giving/annuity-payments/${p1}/transition", payload: { action: "PAY" }, as: GiftAdministrator, captures: { p1_status: $.data.status } }
          assert:
            - "PAY under SUSPENDED: ${err} == ERR_AGREEMENT_SUSPENDED (409)"
            - "DEFER under SUSPENDED still succeeds: ${p2_status} == DEFERRED — the cross-entity gate is PAY-specific"
            - "After RESUME, PAY succeeds: ${p1_status} == PAID"

      - name: estate_distribution_blocked_by_open_milestones
        grounds:
          - state_machines.Estate.PROBATE_OPEN_to_DISTRIBUTION_PENDING
          - validations[priority=22]
        distinguishing_aspect: |
          Pair Estate->ProbateMilestone: BEGIN_DISTRIBUTION is rejected while any
          linked milestone is not CLOSED (ERR_MILESTONES_OPEN); closing the
          milestone unblocks the identical request.
        test_recipe:
          setup:
            - "Deceased donor; Estate PROBATE_OPEN (recorder em-1); milestone PETITION PENDING due 2027-01-01 (not overdue at the default clock)"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Milestone Gate", date_of_birth: "1935-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/donors/${d_id}/record-death", payload: { deceased_on: "2026-08-03T00:00:00Z" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "POST /giving/estates", payload: { donor_id: "${d_id}", notified_on: "2026-08-04T00:00:00Z" }, as: EstateManager, as_user_id: "em-1", captures: { e_id: $.data.id } }
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "OPEN_PROBATE" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "POST /giving/probate-milestones", payload: { estate_id: "${e_id}", kind: "PETITION", due_date: "2027-01-01T00:00:00Z" }, as: EstateManager, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "BEGIN_DISTRIBUTION", administration_costs_cents: 0, specific_bequests_cents: 0 }, as: EstateManager, as_user_id: "em-2", captures: { err: $.data.error_id } }
            - { call: "POST /giving/probate-milestones/${m_id}/transition", payload: { action: "FILE" }, as: EstateManager }
            - { call: "POST /giving/probate-milestones/${m_id}/transition", payload: { action: "CLOSE" }, as: EstateManager }
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "BEGIN_DISTRIBUTION", administration_costs_cents: 0, specific_bequests_cents: 0 }, as: EstateManager, as_user_id: "em-2", captures: { st: $.data.status } }
          assert:
            - "With milestone PENDING: ${err} == ERR_MILESTONES_OPEN (409)"
            - "After FILE+CLOSE: identical BEGIN_DISTRIBUTION succeeds, estate status == DISTRIBUTION_PENDING (${st})"

      - name: agreement_execution_requires_active_rate_table
        grounds:
          - state_machines.GiftAgreement.DRAFT_to_EXECUTED
          - validations[priority=18]
        distinguishing_aspect: |
          Pair GiftAgreement->RateTable: executing an agreement whose pinned rate
          table was RETIRED after booking fails ERR_RATE_TABLE_NOT_ACTIVE even
          though every other gate passes (deduction 3768895 clears both safety
          tests).
        test_recipe:
          setup:
            - "Donor D; table T (500bps, 2026-01-01..2026-12-01) ACTIVE; illustration (CRAT age 80, 500bps, gift 10000000, funding_month 2026-08) booked to DRAFT agreement pinning T; T RETIRED; PRIMARY_1 designation VERIFIED"
          setup_api_calls:
