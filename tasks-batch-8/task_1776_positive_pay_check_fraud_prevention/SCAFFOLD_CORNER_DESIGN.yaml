            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/ach-rules", payload: { account_id: "${acct}", rule_type: "FILTER", originator_company_id: "ORG1", sec_code: "CCD", max_amount_cents: 5000, effective_start_date: "2026-08-01" }, as: CustomerAdmin, as_user_id: "${adm}", captures: { rule: $.data.id, rv1: $.data.version } }
          trigger:
            - { call: "PATCH /treasury/ach-rules/${rule}", payload: { expected_ach_rule_version: "${rv1}", max_amount_cents: 7000 }, as: CustomerAdmin, as_user_id: "${adm}", captures: { rv2: $.data.version } }
            - { call: "PATCH /treasury/ach-rules/${rule}", payload: { expected_ach_rule_version: "${rv1}", max_amount_cents: 9000 }, as: CustomerAdmin, as_user_id: "${adm}", captures: { err: $.data.error_id } }
          assert:
            - "rv2 == 2"
            - "Stale second patch: err == ERR_STALE_VERSION (412)"

      - name: occ_change_tier_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enrollment-tier-change-stale]"]
        distinguishing_aspect: "Tier migration shares the enrollment's OCC stream: a version minted before an intervening config patch is stale for change-tier."
        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment; version advanced once by a config patch after activation"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "OccTCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
