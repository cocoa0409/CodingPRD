              as: IntakeOfficer
              captures: { chg_b: $.data.id }
            - call: "POST /eeoc/charges/${chg_b}/mediation-cases"
              as: IntakeOfficer
              captures: { med_b: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_b}/respond"
              payload: { response: "DECLINED" }
              as: ChargingParty
              as_user_id: "${cp_21}"
            - call: "GET /eeoc/charges/${chg_b}"
              as: Director
              captures: { inv_b: $.data.investigation_case_id }
            - call: "POST /eeoc/investigation-cases/${inv_a}/assign"
              payload: { investigator_user_id: "inv-101" }
              as: Director
            - call: "POST /eeoc/investigation-cases/${inv_b}/assign"
