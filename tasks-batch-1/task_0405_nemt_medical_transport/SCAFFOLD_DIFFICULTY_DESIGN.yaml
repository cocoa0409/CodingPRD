  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trip_parallel_axes_lifecycle_and_billing
        grounds:
          - state_machines.TripRequest.UNBILLED_to_CLAIMED
          - state_machines.TripRequest.CLAIMED_to_ENCOUNTERED
          - entities.TripRequest.fields.trip_status
          - entities.TripRequest.fields.billing_status
        distinguishing_aspect: |
          TripRequest carries two independent state axes: trip_status reaches a
          terminal COMPLETED while billing_status independently advances
          UNBILLED->CLAIMED->ENCOUNTERED. The billing axis moves while trip_status
          stays COMPLETED, demonstrating parallel dimensions on one entity.
        test_recipe:
          setup:
            - "A COMPLETED AMBULATORY one-way trip (trip_status COMPLETED, billing_status UNBILLED)."
            - "Claim then encounter capture advance the billing axis only."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "AMBULATORY", base_fare_cents: 1500, loaded_rate_cents_per_mile: 120, dwell_free_minutes: 15, dwell_cents_per_minute: 40 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-PA-1", full_name: "Pat A", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerPA", covered_counties: ["C1"], max_modality: "AMBULATORY", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Pa D", vehicle_modality: "AMBULATORY", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "GET /trips/${trip_id}/legs"
              payload: {}
              as: Coordinator
              captures: { ob_leg_id: "$.data[0].id" }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
            - call: "POST /legs/${ob_leg_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/pickup"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/dropoff"
              payload: { odometer_loaded_miles: 8.0 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /claims"
              payload: { trip_id: "${trip_id}" }
              as: Broker
          trigger:
            - call: "POST /encounters"
              payload: { trip_id: "${trip_id}" }
              as: Auditor
          assert:
