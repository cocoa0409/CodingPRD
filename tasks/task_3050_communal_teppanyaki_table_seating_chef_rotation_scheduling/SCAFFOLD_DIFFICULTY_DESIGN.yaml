          assert:
            - "Reservation.${res_h}.status cannot reach NO_SHOW from SEATED — the mark is refused at priority 4 with 409 ERR_INVALID_STATE"
            - "from HELD the same mark is legal once the clock is past scheduled_time + NO_SHOW_GRACE_MINUTES, so the chain is exercised on a directly-held booking rather than a seated one"
