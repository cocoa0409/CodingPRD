        distinguishing_aspect: "A manual hold gates exactly two endpoints: authorization and buyback issuance. Quoting stays open, so a held customer accumulates QUOTED rows that become authorizable the instant the hold is released - and the release is permitted here only because no STRUCTURING_SUSPICION report is outstanding."
