              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Lock Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-c22" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/providers/${prov_id}/settle-cap"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-09T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CAP_YEAR_SETTLED"

