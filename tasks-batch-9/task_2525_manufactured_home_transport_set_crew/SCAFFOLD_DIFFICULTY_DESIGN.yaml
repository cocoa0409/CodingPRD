              as: NetworkAdmin
              captures: { order2_id: $.data.id, order2_v: $.data.version }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Gilbert Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order3_id: $.data.id, order3_v: $.data.version }
            - call: "POST /installations/set-jobs"
