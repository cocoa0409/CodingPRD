    - entities.Property.fields.verified_sale_value_cents
    distinguishing_aspect: 'The conserved quantity is the market''s total attributed record count: running an index over scalar-quantity comparables then removing the attribution must return the aggregate to its pre-run value exactly.'
    test_recipe:
