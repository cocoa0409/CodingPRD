# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3436_frozen_potato_processing_foodservice_specification_supply
# Breadth probe over §1.1-§1.7 claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.
# Corners already exercised by §1.8 appear as excluded_because stubs.
# Logical clock default 2026-09-01T00:00:00Z; every recipe sets it explicitly.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: grower_create_returns_201_with_system_fields_and_version_1
        claim_type: Creation
        grounds:
          - entities.Grower
          - endpoints.POST_/potato-ops/growers
        distinguishing_aspect: "A grower created with grower_code, legal_name and region returns 201 with the fields stored verbatim, version 1, and server-minted id/created_at/updated_at — nothing else is client-controllable."
        test_recipe:
          setup: ["Empty database; logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_grower
              call: "POST /potato-ops/growers"
              payload: { grower_code: "GR-100", legal_name: "Columbia Basin Farms LLC", region: "COLUMBIA_BASIN" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Grower.${grower_id}.grower_code == \"GR-100\" and region == COLUMBIA_BASIN"
            - "Grower.${grower_id}.version == 1"
            - "the response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: crop_contracts_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/potato-ops/crop-contracts
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three DRAFT contracts on one grower (different varieties, so windows may coincide), limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower GR-100 with three DRAFT contracts (RUSSET_BURBANK, RANGER_RUSSET, UMATILLA_RUSSET — identical windows allowed across varieties)."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}", variety: "RUSSET_BURBANK", contracted_acres: 100, expected_yield_cwt_per_acre: 400, base_price_per_cwt_cents: 2500, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-10-15T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}", variety: "RANGER_RUSSET", contracted_acres: 80, expected_yield_cwt_per_acre: 380, base_price_per_cwt_cents: 2400, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-10-15T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}", variety: "UMATILLA_RUSSET", contracted_acres: 60, expected_yield_cwt_per_acre: 360, base_price_per_cwt_cents: 2300, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-10-15T00:00:00Z" }
              as: GrowerRelationsManager
          trigger:
            - call: "GET /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}", limit: 2, offset: 0 }
              as: AccountManager
          assert:
            - "the response status is 200 and response_type is array"
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET with limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET with no pagination params returns 3 rows (defaults limit 10, offset 0)"
            - "GET with variety == RANGER_RUSSET returns exactly 1 row"

      - name: growers_get_with_unknown_id_returns_grower_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/potato-ops/growers/{id}
          - errors.ERR_GROWER_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but unallocated UUID produces the entity-specific 404 ERR_GROWER_NOT_FOUND, not a generic 400."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; no grower exists."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /potato-ops/growers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccountManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_GROWER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: lot_create_missing_gross_weight_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.PotatoLot.fields.gross_weight_cwt
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "gross_weight_cwt is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the shape check — before any state, safety, or capacity rule runs."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower, facility, ACTIVE contract."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - &k_facility
              call: "POST /potato-ops/storage-facilities"
              payload: { facility_code: "CELL-1", capacity_cwt: 50000, target_temp_f: 38.0, target_co2_pct: 3.0 }
              as: PlatformAdmin
              captures: { facility_id: $.data.id }
            - &k_contract
              call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}", variety: "RUSSET_BURBANK", contracted_acres: 100, expected_yield_cwt_per_acre: 400, base_price_per_cwt_cents: 2500, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-10-15T00:00:00Z" }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - &k_activate
              call: "POST /potato-ops/crop-contracts/${contract_id}/activate"
              payload: {}
              as: GrowerRelationsManager
          trigger:
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /potato-ops/potato-lots?contract_id=${contract_id} returns 0 rows"

      - name: spec_create_omitting_sensory_panel_required_defaults_true
        claim_type: Defaults
        grounds:
          - entities.CutSpecification.fields.sensory_panel_required
        distinguishing_aspect: "sensory_panel_required declares default true; omitting it stores true rather than null, so a later validate with panel_score 6.9 is rejected."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; chain CH-ALPHA."]
          setup_api_calls:
            - *k_clock
            - &k_chain_a
              call: "POST /potato-ops/customer-chains"
              payload: { chain_code: "CH-ALPHA", legal_name: "Alpha Burger Co", priority_tier: "TIER_1_STRATEGIC" }
              as: AccountManager
              captures: { chain_a_id: $.data.id }
          trigger:
            - &k_spec_a
              call: "POST /potato-ops/cut-specifications"
              payload: { customer_id: "${chain_a_id}", spec_code: "SP-A-1", cut_family: "STRAIGHT", cut_size_mm: 9.5, coating_type: "CLEAR", target_color_units: 2.5, max_cook_time_sec: 195 }
              as: ChainCustomer
              as_user_id: "${chain_a_id}"
              captures: { spec_a_id: $.data.id, panel_req: $.data.sensory_panel_required }
            - call: "POST /potato-ops/cut-specifications/${spec_a_id}/validate"
              payload: { panel_score: 6.9 }
              as: QualityAssuranceLead
              captures: { error_id: $.data.error_id }
          assert:
            - "the create response status is 201 and sensory_panel_required == true (default applied)"
            - "CutSpecification.${spec_a_id}.status == SUBMITTED"
            - "validate with 6.9 fails 422 ERR_PANEL_SCORE_BELOW_STANDARD because the defaulted flag still demands >= 7.0"

      - name: contract_create_computes_contracted_volume_from_acres_times_yield
        claim_type: Computed Fields
        grounds:
          - entities.CropContract.fields.contracted_volume_cwt
          - calculations.contracted_volume_cwt
        distinguishing_aspect: "contracted_volume_cwt is computed server-side: 100 acres x 400 cwt/acre stores 40000.0, and 45.5 x 380.4 stores 17308.2 (round_half_up to 1 decimal) — client input for this field is not even in the endpoint's input list."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower GR-100."]
          setup_api_calls:
            - *k_clock
            - *k_grower
          trigger:
            - *k_contract
            - call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}", variety: "RANGER_RUSSET", contracted_acres: 45.5, expected_yield_cwt_per_acre: 380.4, base_price_per_cwt_cents: 2400, delivery_window_start: "2026-10-15T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z" }
              as: GrowerRelationsManager
              captures: { contract2_id: $.data.id, vol2: $.data.contracted_volume_cwt }
          assert:
            - "CropContract.${contract_id}.contracted_volume_cwt == 40000.0"
            - "CropContract.${contract2_id}.contracted_volume_cwt == 17308.2 (round_half_up(45.5 x 380.4, 1))"
            - "both contracts are created in status DRAFT with version 1"

      - name: byproduct_batch_is_immutable_without_version_or_updated_at
        claim_type: Immutability
        grounds:
          - entities.ByproductBatch
        distinguishing_aspect: "ByproductBatch declares common_fields false: rows carry id and created_at but no version and no updated_at, and no PUT/PATCH/DELETE endpoint exists for the resource."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower, facility, ACTIVE contract with one lot IN_STORAGE."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - *k_contract
            - *k_activate
            - &k_lot_a
              call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /potato-ops/potato-lots/${lot_id}/dispose"
              payload: { disposition: "STARCH_RECOVERY" }
              as: QualityAssuranceLead
          trigger:
            - call: "GET /potato-ops/byproduct-batches"
              payload: { source_lot_id: "${lot_id}" }
              as: QualityAssuranceLead
              captures: { batch_id: "$.data[0].id", batch_rev: "$.data[0].total_revenue_cents" }
          assert:
            - "exactly 1 batch row exists for the lot"
            - "the row carries id and created_at but no version and no updated_at keys"
            - "the row shows stream WHOLE_LOT, routing STARCH_RECOVERY, weight_cwt 1000.0, total_revenue_cents == 1400000 (1000.0 x 1400)"

      - name: lot_create_with_both_or_neither_source_id_returns_source_mode_invalid
        claim_type: Type Constraints
        grounds:
          - entities.PotatoLot.fields.contract_id
          - entities.PotatoLot.fields.shortage_event_id
          - errors.ERR_LOT_SOURCE_MODE_INVALID
        distinguishing_aspect: "The source mode is exactly-one-of: carrying both contract_id and shortage_event_id, or neither, fails 400 ERR_LOT_SOURCE_MODE_INVALID before any state check runs."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower, facility, ACTIVE contract; one OPEN shortage event."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - *k_contract
            - *k_activate
            - &k_event
              call: "POST /potato-ops/shortage-events"
              payload: { scope_variety: "RUSSET_BURBANK", declared_deficit_cwt: 5000, available_week_cases: 1000, response_mode: "PRO_RATA" }
              as: GrowerRelationsManager
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", shortage_event_id: "${event_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { err_both: $.data.error_id }
            - call: "POST /potato-ops/potato-lots"
              payload: { facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: GrowerRelationsManager
              captures: { err_neither: $.data.error_id }
          assert:
            - "both-ids request: 400 and error_id == ERR_LOT_SOURCE_MODE_INVALID"
            - "neither-id request: 400 and error_id == ERR_LOT_SOURCE_MODE_INVALID"
            - "GET /potato-ops/potato-lots?facility_id=${facility_id} returns 0 rows"

      - name: contract_create_with_unknown_grower_returns_grower_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.CropContract.fields.grower_id
          - validations[priority=5]
          - errors.ERR_GROWER_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology puts the grower FK in the request body; an unallocated grower_id is a 404 ERR_GROWER_NOT_FOUND at existence priority, and no contract row is persisted."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "00000000-0000-4000-8000-000000000000", variety: "RUSSET_BURBANK", contracted_acres: 100, expected_yield_cwt_per_acre: 400, base_price_per_cwt_cents: 2500, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-10-15T00:00:00Z" }
              as: GrowerRelationsManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_GROWER_NOT_FOUND"
            - "GET /potato-ops/crop-contracts returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: run_advance_from_qa_hold_returns_invalid_stage
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ProductionRun
          - errors.ERR_RUN_INVALID_STAGE
        distinguishing_aspect: "advance is defined only for SCHEDULED/CUTTING/BLANCHING/COATING/FREEZING/REWORK; at QA_HOLD the only exits are qa-release/rework/reject, so advance fails 409 ERR_RUN_INVALID_STAGE and the run stays QA_HOLD."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; full fixture: run R1 advanced five times into QA_HOLD (620 cases computed)."
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - *k_contract
            - *k_activate
            - *k_lot_a
            - &k_line
              call: "POST /potato-ops/processing-lines"
              payload: { line_code: "LINE-1", supported_cut_families: ["STRAIGHT", "CRINKLE"], rated_throughput_cases_per_hour: 5000 }
              as: PlatformAdmin
              captures: { line_id: $.data.id }
            - *k_chain_a
            - *k_spec_a
            - &k_validate_a
              call: "POST /potato-ops/cut-specifications/${spec_a_id}/validate"
              payload: { panel_score: 8.0 }
              as: QualityAssuranceLead
            - &k_agr_10k
              call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a_id}", weekly_contracted_cases: 10000, price_per_case_cents: 299, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_a_id: $.data.id }
            - &k_agr_act
              call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - &k_run1
              call: "POST /potato-ops/production-runs"
              payload: { line_id: "${line_id}", spec_id: "${spec_a_id}", agreement_id: "${agr_a_id}", input_lot_ids: ["${lot_id}"], scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: ProductionPlanner
              captures: { run1_id: $.data.id }
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_RUN_INVALID_STAGE"
            - "ProductionRun.${run1_id}.status remains QA_HOLD with actual_cases == 620"

      - name: shipment_deliver_after_rejection_returns_not_in_transit
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Shipment
          - errors.ERR_SHIPMENT_NOT_IN_TRANSIT
        distinguishing_aspect: "REJECTED_ON_ARRIVAL is terminal: a later deliver call on the same shipment fails 409 ERR_SHIPMENT_NOT_IN_TRANSIT and no invoice is ever computed for it."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; full fixture with run R1 RELEASED (620 cases); shipment S1 of 100 cases REJECTED_ON_ARRIVAL."
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - *k_contract
            - *k_activate
            - *k_lot_a
            - *k_line
            - *k_chain_a
            - *k_spec_a
            - *k_validate_a
            - *k_agr_10k
            - *k_agr_act
            - *k_run1
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - &k_run1_release
              call: "POST /potato-ops/production-runs/${run1_id}/qa-release"
              payload: { measured_color_units: 2.5 }
              as: QualityAssuranceLead
            - &k_ship_100
              call: "POST /potato-ops/shipments"
              payload: { agreement_id: "${agr_a_id}", carrier_name: "FrostLine Logistics", trailer_setpoint_f: -5.0, route_type: "DIRECT_CHAIN", lines: [{ run_id: "${run1_id}", cases: 100 }] }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
            - call: "POST /potato-ops/shipments/${ship_id}/reject-on-arrival"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /potato-ops/shipments/${ship_id}/deliver"
              payload: { max_transit_temp_f: -2.0, minutes_above_setpoint: 0 }
              as: LogisticsCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SHIPMENT_NOT_IN_TRANSIT"
            - "Shipment.${ship_id}.status remains REJECTED_ON_ARRIVAL and invoice_cents remains null"

      - name: contract_activate_twice_returns_contract_not_draft
        claim_type: Idempotency
        grounds:
          - state_machines.CropContract.DRAFT_to_ACTIVE
          - errors.ERR_CONTRACT_NOT_DRAFT
        distinguishing_aspect: "Repeating the activate trigger against the now-ACTIVE contract is not a silent no-op: the second call fails 409 ERR_CONTRACT_NOT_DRAFT and the version stays 2."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower; contract activated once."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_contract
            - *k_activate
          trigger:
            - call: "POST /potato-ops/crop-contracts/${contract_id}/activate"
              payload: {}
              as: GrowerRelationsManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CONTRACT_NOT_DRAFT"
            - "GET /potato-ops/crop-contracts?grower_id=${grower_id} shows the contract ACTIVE with version == 2"

      - name: reading_can_drive_posture_normal_straight_to_quarantined
        claim_type: Valid Transition
        grounds:
          - state_machines.StorageFacility.NORMAL_to_QUARANTINED
          - calculations.facility_posture
        distinguishing_aspect: "The posture machine is not staged: a single reading at disease_incidence_pct 7.0 (>= 6.0) moves NORMAL directly to QUARANTINED without passing through WATCH."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; facility CELL-1 in posture NORMAL."]
          setup_api_calls:
            - *k_clock
            - *k_facility
          trigger:
            - call: "POST /potato-ops/storage-facilities/${facility_id}/readings"
              payload: { recorded_at: "2026-09-02T00:00:00Z", temperature_f: 41.0, humidity_pct: 94.0, co2_pct: 4.0, sprout_index: 1.0, disease_incidence_pct: 7.0 }
              as: StorageOperator
              captures: { posture: $.data.posture }
          assert:
            - "StorageFacility.${facility_id}.posture == QUARANTINED after one reading (no intermediate WATCH)"
            - "recent_readings has exactly 1 entry with disease_incidence_pct 7.0"
            - "a follow-up reading at disease 2.0 and sprout 1.0 returns posture to NORMAL (latest reading rules)"

      - name: contract_auto_fulfills_at_exactly_98_percent_of_volume
        claim_type: Valid Transition
        grounds:
          - state_machines.CropContract.ACTIVE_to_FULFILLED
          - calculations.contract_final_settlement
        distinguishing_aspect: "The auto-transition is inclusive at 98%: a 1-acre x 400 cwt contract (400.0 cwt) receiving a 392.0-cwt lot reaches exactly 98.0% and flips to FULFILLED with settlement computed immediately (zero storage days, so final equals provisional: 1058400 cents)."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; grower; facility; ACTIVE contract of 1 acre x 400 cwt/acre = 400.0 cwt volume."]
          setup_api_calls:
            - *k_clock
            - *k_grower
            - *k_facility
            - call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}", variety: "RUSSET_BURBANK", contracted_acres: 1, expected_yield_cwt_per_acre: 400, base_price_per_cwt_cents: 2500, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-10-15T00:00:00Z" }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - *k_activate
          trigger:
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 402.0, tare_weight_cwt: 10.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { lot_id: $.data.id }
            - call: "GET /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}" }
              as: GrowerRelationsManager
              captures: { c_status: "$.data[0].status", c_settle: "$.data[0].settlement_amount_cents" }
          assert:
            - "delivered_volume_cwt == 392.0 == exactly 98.0% of 400.0"
            - "CropContract.${contract_id}.status == FULFILLED (auto-transition fired on the lot creation)"
            - "CropContract.${contract_id}.settlement_amount_cents == 1058400 (392.0 x 2500 x 1.08; zero storage days so final == provisional)"
            - "PotatoLot.${lot_id}.final_payment_cents == 1058400"

      - name: agreement_completes_via_clock_sweep_at_term_end_inclusive
        claim_type: Valid Transition
        grounds:
          - state_machines.SupplyAgreement.ACTIVE_to_COMPLETED
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The clock sweep is inclusive at term_end: with the clock moved to exactly 2026-10-01T00:00:00Z the ACTIVE agreement completes, releases its 60000-case reservation (proven when a 100000-case agreement of another chain activates right after), and COMPLETED agreements no longer participate in shortage allocation."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; chain A with ACTIVE agreement 60000/wk, term ending 2026-10-01T00:00:00Z; chain B with a VALIDATED spec and a DRAFT 100000/wk agreement."]
          setup_api_calls:
            - *k_clock
            - *k_chain_a
            - *k_spec_a
            - *k_validate_a
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a_id}", weekly_contracted_cases: 60000, price_per_case_cents: 299, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_a_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /potato-ops/customer-chains"
              payload: { chain_code: "CH-BETA", legal_name: "Beta Diner Group", priority_tier: "TIER_2_PREFERRED" }
              as: AccountManager
              captures: { chain_b_id: $.data.id }
            - call: "POST /potato-ops/cut-specifications"
              payload: { customer_id: "${chain_b_id}", spec_code: "SP-B-1", cut_family: "CRINKLE", cut_size_mm: 10.0, coating_type: "SEASONED", target_color_units: 2.0, max_cook_time_sec: 210 }
              as: ChainCustomer
              as_user_id: "${chain_b_id}"
              captures: { spec_b_id: $.data.id }
            - call: "POST /potato-ops/cut-specifications/${spec_b_id}/validate"
              payload: { panel_score: 7.5 }
              as: QualityAssuranceLead
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_b_id}", spec_id: "${spec_b_id}", weekly_contracted_cases: 100000, price_per_case_cents: 310, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_b_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /potato-ops/supply-agreements/${agr_a_id}"
              payload: {}
              as: AccountManager
              captures: { a_status: $.data.status }
            - call: "POST /potato-ops/supply-agreements/${agr_b_id}/activate"
              payload: {}
              as: AccountManager
              captures: { b_status: $.data.status }
          assert:
            - "SupplyAgreement.${agr_a_id}.status == COMPLETED after the clock reaches term_end exactly"
            - "its 60000-case reservation was released: the 100000-case agreement B activates (status ACTIVE)"
            - "GET /potato-ops/supply-agreements?status=COMPLETED returns exactly 1 row"

      - name: spec_revision_before_first_lock_returns_to_validated_not_locked
        claim_type: Valid Transition
        grounds:
          - state_machines.CutSpecification.REVISION_REQUESTED_to_VALIDATED
          - entities.CutSpecification.fields.ever_locked
        distinguishing_aspect: "The revision cycle branches on ever_locked: a spec that was never locked goes REVISION_REQUESTED -> VALIDATED (not LOCKED) on re-validation, so a new agreement can still be its first locker."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z; chain A; spec VALIDATED (v2), never referenced by an agreement."]
          setup_api_calls:
            - *k_clock
            - *k_chain_a
            - *k_spec_a
            - *k_validate_a
          trigger:
            - call: "POST /potato-ops/cut-specifications/${spec_a_id}/request-revision"
              payload: {}
              as: ChainCustomer
              as_user_id: "${chain_a_id}"
              captures: { st_mid: $.data.status }
            - call: "POST /potato-ops/cut-specifications/${spec_a_id}/validate"
              payload: { panel_score: 8.5 }
              as: QualityAssuranceLead
              captures: { st_end: $.data.status, ever: $.data.ever_locked }
          assert:
            - "request-revision from VALIDATED -> REVISION_REQUESTED (no agreements exist to flag)"
            - "re-validate -> VALIDATED, not LOCKED, because ever_locked == false"
            - "CutSpecification.${spec_a_id}.panel_score == 8.5"

  # ===========================================================================
  - section: calculations
    instances:
      - name: run_actual_cases_uses_the_cut_family_yield_constant
        claim_type: Constants Applied
        grounds:
          - calculations.run_actual_cases
        distinguishing_aspect: "The yield table is per cut family: 1000.0 cwt of input yields 620 cases as STRAIGHT (0.62) but 580 as CRINKLE (0.58) — the constant, not a generic factor, decides."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower/facility/ACTIVE contract with two grade-A lots; chain with a LOCKED CRINKLE spec and ACTIVE agreement; run on 1000.0 cwt."
