            - "e4 == ERR_PUBLIC_COMMENT_NOT_FOUND; e5 == ERR_PUBLIC_FILE_NOT_FOUND; e6 == ERR_APPLICATION_NOT_FOUND (all http 404)"

  # ------------------------------------------------------------------- rbac
  - section: rbac
    instances:
      - name: get_reads_shared_across_all_roles
        claim_type: satisfaction_to_pass
        grounds: ["roles"]
        distinguishing_aspect: "GET endpoints are shared operations: the same area is readable by CRAOfficer, ComplianceAnalyst, QualificationReviewer, BankExaminer, BankExecutive, and PlatformAdmin."
        test_recipe:
          setup: ["AssessmentArea exists"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-R1", name: "Shared Read Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
          trigger:
            - call: "GET /cra/assessment-areas/${aa_id}"
              as: ComplianceAnalyst
            - call: "GET /cra/assessment-areas/${aa_id}"
              as: QualificationReviewer
            - call: "GET /cra/assessment-areas/${aa_id}"
              as: BankExaminer
            - call: "GET /cra/assessment-areas/${aa_id}"
              as: BankExecutive
            - call: "GET /cra/assessment-areas/${aa_id}"
              as: PlatformAdmin
          assert:
            - "all five GETs return http 200 with the same AssessmentArea payload"

      - name: sod_enforced_even_for_reviewer_role_holders
        claim_type: role_model
        grounds: ["roles", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: review_decision_conflict_sod_beats_budget
          rationale: "Same-user review rejection asserted in the named §1.8 instance."

  # --------------------------------------- cross-cutting complexity layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_supersede_rejected_with_stale_area_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[demographic-profile-create-stale-area]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "First profile create bumps the area version 1 -> 2 and supersedes nothing; a second create for the same (area, data_year) carrying the stale expected version 1 is rejected ERR_STALE_VERSION 412; carrying the fresh version 2 succeeds and supersedes the first profile."
        test_recipe:
          setup: ["AssessmentArea DRAFT at version 1"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-CC1", name: "OCC Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id, aa_v1: $.data.version }
            - call: "POST /cra/assessment-areas/${aa_id}/demographic-profiles"
              payload: { expected_assessment_area_version: "${aa_v1}", data_year: 2020, total_tracts: 10, low_income_tracts: 2, moderate_income_tracts: 2, total_population: 10000, lmi_population: 4500, median_family_income: 60000 }
              as: CRAOfficer
              captures: { prof1: $.data.id }
            - call: "GET /cra/assessment-areas/${aa_id}"
              as: CRAOfficer
              captures: { aa_v2: $.data.version }
          trigger:
            - call: "POST /cra/assessment-areas/${aa_id}/demographic-profiles"
              payload: { expected_assessment_area_version: "${aa_v2} - 1", data_year: 2020, total_tracts: 11, low_income_tracts: 3, moderate_income_tracts: 2, total_population: 11000, lmi_population: 5000, median_family_income: 61000 }
              as: CRAOfficer
              captures: { err: $.data.error_id }
            - call: "POST /cra/assessment-areas/${aa_id}/demographic-profiles"
              payload: { expected_assessment_area_version: "${aa_v2}", data_year: 2020, total_tracts: 11, low_income_tracts: 3, moderate_income_tracts: 2, total_population: 11000, lmi_population: 5000, median_family_income: 61000 }
              as: CRAOfficer
              captures: { prof2: $.data.id }
          assert:
            - "Stale create: error_id == ERR_STALE_VERSION with http 412"
            - "Fresh create: http 201; DemographicProfile.${prof1}.status == SUPERSEDED and ${prof2}.status == CURRENT"
            - "GET /cra/assessment-areas/${aa_id}/demographic-profiles lists exactly one SUPERSEDED and one CURRENT profile for data_year 2020"

      - name: occ_patch_rejected_with_stale_area_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assessment-area-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH carries expected_assessment_area_version; a successful PATCH bumps 1 -> 2, and a second PATCH replaying the stale version is rejected ERR_STALE_VERSION 412 with no mutation."
        test_recipe:
          setup: ["AssessmentArea DRAFT at version 1"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-CC2", name: "Patch Area", msa_code: "12060", state_code: "GA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id, aa_v1: $.data.version }
            - call: "PATCH /cra/assessment-areas/${aa_id}"
              payload: { expected_assessment_area_version: "${aa_v1}", name: "Patch Area Renamed" }
              as: CRAOfficer
              captures: { aa_v2: $.data.version }
          trigger:
            - call: "PATCH /cra/assessment-areas/${aa_id}"
              payload: { expected_assessment_area_version: "${aa_v2} - 1", name: "Stale Rename" }
              as: CRAOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION with http 412"
            - "GET /cra/assessment-areas/${aa_id}: name == 'Patch Area Renamed' and version == ${aa_v2}"

      - name: confirmed_loan_count_reconciles_across_corrections
        claim_type: derived_field_reconciliation
        grounds: ["entities.AssessmentArea.fields.confirmed_loan_count", "state_machines.LoanRecord"]
        distinguishing_aspect: "The derived counter tracks the correction loop exactly: 0 -> confirm 1 -> return-to-draft 0 -> confirm 1 -> mark-reported stays 1 (REPORTED still counts)."
        test_recipe:
          setup: ["AssessmentArea ACTIVE; one DRAFT loan"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-CC3", name: "Counter Area", msa_code: "19100", state_code: "TX", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_BUSINESS", loan_amount_cents: 100000, borrower_gross_annual_revenue_cents: 1000000, action_date: "2025-01-10", census_tract: "T1", tract_income_level: "LOW" }
              as: ComplianceAnalyst
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /cra/loan-records/${l_id}/confirm"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/loan-records/${l_id}/return-to-draft"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/loan-records/${l_id}/confirm"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/loan-records/${l_id}/mark-reported"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "After first confirm: GET /cra/assessment-areas/${aa_id}.confirmed_loan_count == 1"
            - "After return-to-draft: confirmed_loan_count == 0"
            - "After second confirm: confirmed_loan_count == 1"
            - "After mark-reported: confirmed_loan_count == 1 (status REPORTED still included)"

      - name: logical_clock_default_and_set
        claim_type: scheduled_actions
        grounds: ["endpoints"]
        distinguishing_aspect: "Before any set call the clock reads exactly 2026-08-01T00:00:00Z (a retire stamps that date); after set_current_utc to 2026-12-15 a subsequent retire stamps 2026-12-15."
        test_recipe:
          setup: ["two ACTIVE areas; clock untouched at first"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-CC4A", name: "Clock Area A", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 100000 }
              as: CRAOfficer
              captures: { a1: $.data.id }
            - call: "POST /cra/assessment-areas/${a1}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-CC4B", name: "Clock Area B", msa_code: "12060", state_code: "GA", census_tracts: ["T2"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 100000 }
              as: CRAOfficer
              captures: { a2: $.data.id }
            - call: "POST /cra/assessment-areas/${a2}/activate"
              payload: {}
              as: CRAOfficer
          trigger:
            - call: "POST /cra/assessment-areas/${a1}/retire"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cra/assessment-areas/${a2}/retire"
              payload: {}
              as: CRAOfficer
          assert:
            - "AssessmentArea.${a1}.effective_end_date == 2026-08-01 (startup default, no wall-clock fallback)"
            - "AssessmentArea.${a2}.effective_end_date == 2026-12-15 (set clock honored)"

  # ------------------------------------------------------- consistency model
  - section: consistency_model
    instances:
      - name: mutations_immediately_visible
        claim_type: immediate_consistency
        grounds: ["complexity_profile"]
        distinguishing_aspect: "Immediate consistency: the activate response itself carries status ACTIVE and version 2, and a following GET returns identical values — no lag."
        test_recipe:
          setup: ["AssessmentArea DRAFT"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-CM1", name: "Immediate Area", msa_code: "16980", state_code: "IL", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 100000 }
              as: CRAOfficer
