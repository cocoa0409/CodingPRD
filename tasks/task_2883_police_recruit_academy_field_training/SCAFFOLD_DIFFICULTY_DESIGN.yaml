              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { cs2_id: $.data.id }
            - call: "POST /course-sessions"
              payload: { academy_class_id: "${class_id}", lesson_plan_id: "${lp_id}", instructor_id: "${instr_id}", room_code: "R1", starts_at: "2026-08-12T09:00:00Z", ends_at: "2026-08-12T11:00:00Z", min_enrollment: 1 }
