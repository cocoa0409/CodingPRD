scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Contract billing vs
  #           Brand/Episode clearance)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_settlement_divergence
        grounds:
          - calculations.contract_billing_value
          - state_machines.IntegrationContract.UNDER_VERIFICATION_to_MAKEGOOD_REQUIRED
        distinguishing_aspect: |
          Same contract, same terms: the provisional variant (script-estimated
          seconds, no verbal penalties) yields 985000 cents at creation, while
          the final variant (measured seconds + verbal-miss penalty) settles at
          1000000 cents after the makegood is waived — the two variants of the
          Contract billing metric provably diverge.
        test_recipe:
          setup:
            - "Brand FizzCo (BEVERAGE) with OPEN brief budget 1000000 cents"
            - "STANDARD series with episode 1 (runtime 1200, airs 2026-06-01T20:00:00Z), opportunity [0,40) est 25s, GRANTED clearance"
            - "Proposal fee 1000000, guaranteed 30s + 2 mentions, 2 cross-promos, rate 2000; fully approved; episode LOCKED; contract created and ACTIVE"
            - "Disclosure FILED pre-air; clock advanced past air date; episode AIRED; disclosure ACKNOWLEDGED"
            - "Airing report filed: segments [20], verbal mentions 1"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 2, cross_promo_owed_count: 2, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id, provisional: $.data.provisional_value_cents } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "POST /contracts/${ct_id}/disclosures", payload: { disclosure_text: "Paid placement by FizzCo" }, as: IntegrationManager, captures: { d_id: $.data.id } }
            - { call: "POST /disclosures/${d_id}/file", as: IntegrationManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /episodes/${ep_id}/mark-aired", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /disclosures/${d_id}/acknowledge", as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/airing-reports", payload: { contract_id: "${ct_id}", measured_segments_seconds: [20], measured_verbal_mentions: 1 }, as: VerificationAnalyst, as_user_id: "ver-1", captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /airing-reports/${r_id}/verify", as: VerificationAnalyst, as_user_id: "ver-2" }
            - { call: "GET /contracts/${ct_id}/makegood-credits", as: IntegrationManager, captures: { mg_id: "$.data[0].id" } }
            - { call: "POST /makegood-credits/${mg_id}/waive", as: IntegrationManager }
            - { call: "GET /contracts/${ct_id}", as: IntegrationManager, captures: { final_val: $.data.final_settlement_cents, ct_status: $.data.status } }
          assert:
            - "captured provisional == 985000"
            - "MakeGoodCredit.${mg_id}.amount_cents == 35000"
            - "after verify and before waive: contract outstanding_balance_cents == 965000 (assert via GET /contracts/${ct_id}/ledger if needed)"
            - "captured final_val == 1000000"
            - "captured ct_status == SETTLED"
            - "985000 != 1000000 (provisional and final variants diverge for identical contract terms)"
      - name: clearance_policy_strict_vs_standard_day7
        grounds:
          - calculations.clearance_conflict_score
          - entities.Series.fields.clearance_policy
          - validations[priority=9]
        distinguishing_aspect: |
          Identical data (same-category GRANTED clearance 7 days apart): the
          strict variant counts |delta| <= 7 (score 40 >= threshold 40, GRANT
          rejected with ERR_AIRDATE_PROXIMITY_CONFLICT) while the standard
          variant requires |delta| < 7 (score 0 < 60, GRANT succeeds) — a
          clearance-domain dual variant, a different entity domain from
          contract billing.
        test_recipe:
          setup:
            - "Brand Snackly (FOOD, ACTIVE)"
            - "STANDARD series S with episode S1 airing 2026-06-01T20:00:00Z, clearance GRANTED"
            - "STRICT series T with episode T1 airing 2026-06-08T20:00:00Z (7 days later), clearance REQUESTED"
            - "STANDARD series S with episode S2 airing 2026-06-08T20:00:00Z (7 days later), clearance REQUESTED"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "Snackly", category: "FOOD" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /series", payload: { name: "Standard Show", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series", payload: { name: "Strict Show", network_name: "NBN", clearance_policy: "STRICT" }, as: AgencyAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_s1: $.data.id, ep_s1_v: $.data.version } }
            - { call: "POST /series/${t_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-08T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_t1: $.data.id, ep_t1_v: $.data.version } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 2, runtime_seconds: 1200, air_date: "2026-06-08T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_s2: $.data.id, ep_s2_v: $.data.version } }
            - { call: "POST /episodes/${ep_s1}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_s1_v}" }, as: IntegrationManager, captures: { cl_s1: $.data.id } }
            - { call: "POST /clearances/${cl_s1}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /episodes/${ep_t1}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_t1_v}" }, as: IntegrationManager, captures: { cl_t1: $.data.id } }
            - { call: "POST /episodes/${ep_s2}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_s2_v}" }, as: IntegrationManager, captures: { cl_s2: $.data.id } }
          trigger:
            - { call: "POST /clearances/${cl_t1}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1", captures: { strict_err: $.data.error_id } }
            - { call: "POST /clearances/${cl_s2}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1", captures: { std_status: $.data.status, std_score: $.data.risk_score } }
          assert:
            - "captured strict_err == ERR_AIRDATE_PROXIMITY_CONFLICT (STRICT: |7| <= 7 -> score 40 >= 40 denies)"
            - "captured std_status == GRANTED (STANDARD: |7| < 7 false -> score 0 < 60 grants)"
            - "captured std_score == 0"
            - "CompetitiveClearance.${cl_t1}.status == REQUESTED (unchanged after failed GRANT)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (mode (a) multi-input branching vs
  #           mode (b) nested rounding order)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: makegood_severity_surcharge_branching
        grounds:
          - calculations.makegood_compensation
          - state_machines.IntegrationContract.UNDER_VERIFICATION_to_MAKEGOOD_REQUIRED
        distinguishing_aspect: |
          Mode (a) formula with 3+ inputs (shortfall_seconds, verbal_misses,
          base_fee_cents) and a conditional severity branch: shortfall ratio
          20/30 >= 0.5 engages the 1.2 surcharge, so raw 60000 becomes 72000
          before the min(base_fee) cap — a branch that never fires at ratio < 0.5.
        test_recipe:
          setup:
            - "Full approved chain: brand BEVERAGE, brief budget 1000000, STANDARD series, episode (runtime 1200, airs 2026-06-01), opportunity [0,40) est 25s, GRANTED clearance"
            - "Contract: fee 1000000, guaranteed 30s + 2 mentions, 0 cross-promos, rate 2000; ACTIVE; disclosure ACKNOWLEDGED; episode AIRED (clock 2026-06-02)"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 2, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "POST /contracts/${ct_id}/disclosures", payload: { disclosure_text: "Paid placement by FizzCo" }, as: IntegrationManager, captures: { d_id: $.data.id } }
            - { call: "POST /disclosures/${d_id}/file", as: IntegrationManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /episodes/${ep_id}/mark-aired", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /disclosures/${d_id}/acknowledge", as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/airing-reports", payload: { contract_id: "${ct_id}", measured_segments_seconds: [10], measured_verbal_mentions: 2 }, as: VerificationAnalyst, as_user_id: "ver-1", captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /airing-reports/${r_id}/verify", as: VerificationAnalyst, as_user_id: "ver-2" }
            - { call: "GET /contracts/${ct_id}/makegood-credits", as: IntegrationManager, captures: { mg_amt: "$.data[0].amount_cents", mg_reason: "$.data[0].reason" } }
          assert:
            - "captured mg_amt == 72000 (raw 20*2000*1.5 = 60000, ratio 0.6667 >= 0.5 -> *1.2 = 72000, min(1000000, 72000))"
            - "captured mg_reason == EXPOSURE_SHORTFALL (verbal_misses == 0)"
            - "IntegrationContract.${ct_id}.status == MAKEGOOD_REQUIRED"
            - "IntegrationContract.${ct_id}.outstanding_balance_cents == 928000"
      - name: per_segment_rounding_before_sum
        grounds:
          - calculations.measured_exposure_valuation
          - entities.AiringReport.fields.measured_value_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: segments [3, 3] at 7.5 cents/second give
          round_half_up(22.5) + round_half_up(22.5) = 23 + 23 = 46 cents under
          the pinned round-per-segment-then-sum order; the alternative
          sum-then-round order would give round(45.0) = 45 — the orders differ.
        test_recipe:
          setup:
            - "Approved ACTIVE contract chain (fee 60000, guaranteed 4s, 0 mentions, 0 promos, rate 2000; opportunity [0,10) est 4s; GRANTED clearance; episode LOCKED then AIRED at clock 2026-06-02)"
            - "No disclosure needed until verify; this instance stops at report filing"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "TechCo", category: "TECH" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Gadget", objective: "launch", budget_cents: 500000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Tech Talk", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Desk", start_timecode_seconds: 0, end_timecode_seconds: 10, estimated_exposure_seconds: 4 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 60000, guaranteed_seconds: 4, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /episodes/${ep_id}/mark-aired", as: ProductionRep, as_user_id: "prod-1" }
          trigger:
            - { call: "POST /episodes/${ep_id}/airing-reports", payload: { contract_id: "${ct_id}", measured_segments_seconds: [3, 3], measured_verbal_mentions: 0 }, as: VerificationAnalyst, as_user_id: "ver-1", captures: { rep_seconds: $.data.measured_seconds, rep_value: $.data.measured_value_cents } }
          assert:
            - "captured rep_seconds == 6"
            - "captured rep_value == 46 (23 + 23), NOT 45 (sum-then-round)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (cyclic proposal negotiation vs cyclic
  #           airing-report dispute loop, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_revision_cycle_returns_to_production_review
        grounds:
          - state_machines.IntegrationProposal.REVISION_REQUESTED_to_PRODUCTION_REVIEW
          - state_machines.IntegrationProposal.PRODUCTION_REVIEW_to_REVISION_REQUESTED
          - concurrency_rules[proposal-revision-stale-version]
        distinguishing_aspect: |
          IntegrationProposal cycles PRODUCTION_REVIEW -> REVISION_REQUESTED ->
          PRODUCTION_REVIEW: after the loop the entity is back in
          PRODUCTION_REVIEW with terms_revision incremented 1 -> 2 — a cycle on
          the proposal, not a linear pipeline.
        test_recipe:
          setup:
            - "Brand BEVERAGE, OPEN brief budget 1000000, STANDARD series, episode SCRIPT_REVIEW, opportunity [0,40) est 25s"
            - "Proposal fee 1000000, guaranteed 30s, 2 mentions, 0 promos, rate 2000, submitted to PRODUCTION_REVIEW"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 2, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "REQUEST_REVISION", note: "fee too high" }, as: ProductionRep, as_user_id: "prod-2", captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /proposals/${p_id}/revisions", payload: { proposed_fee_cents: 900000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 2, cross_promo_owed_count: 0, rate_cents_per_second: 2000, expected_proposal_version: "${p_v}" }, as: IntegrationManager, captures: { p_status: $.data.status, p_rev: $.data.terms_revision, p_v2: $.data.version } }
          assert:
            - "captured p_status == PRODUCTION_REVIEW (cycle back to the review state)"
            - "captured p_rev == 2"
            - "captured p_v2 == ${p_v} + 1"
            - "IntegrationProposal.${p_id}.proposed_fee_cents == 900000"
      - name: airing_report_dispute_remeasure_cycle
        grounds:
          - state_machines.AiringReport.VERIFIED_to_DISPUTED
          - state_machines.AiringReport.DISPUTED_to_RE_MEASURED
          - state_machines.IntegrationContract.SETTLED_to_UNDER_VERIFICATION
        distinguishing_aspect: |
          AiringReport cycles VERIFIED -> DISPUTED -> RE_MEASURED -> VERIFIED
          (and drags the contract SETTLED -> UNDER_VERIFICATION -> SETTLED with
          settlement reversal) — a cycle on the report entity, a different
          entity from the proposal negotiation loop.
        test_recipe:
          setup:
            - "Full chain: brand, OPEN brief budget 1000000, STANDARD series, episode (air 2026-06-01), opportunity [0,40) est 30s, GRANTED clearance"
            - "Contract fee 1000000, guaranteed 30s + 2 mentions, 0 promos, rate 2000; ACTIVE; disclosure ACKNOWLEDGED; episode AIRED (clock 2026-06-02)"
            - "Report filed segments [15, 15], mentions 2; verified by a different analyst -> contract SETTLED"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 30 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
