  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: entry_release_blocked_by_pga_review_state
        grounds:
          - state_machines.CustomsEntry.FILED_to_RELEASED
          - state_machines.PGAReview.PENDING_to_HOLD
          - validations[priority=8]
          - errors[ERR_PGA_NOT_CLEARED]
        distinguishing_aspect: |
          Entity pair CustomsEntry -> PGAReview: the entry's FILED->RELEASED transition is valid only
          when every PGAReview on it is MAY_PROCEED. With a PGAReview in HOLD, RELEASE is rejected
          ERR_PGA_NOT_CLEARED (409) even though the entry itself is in a releasable FILED state.
        test_recipe:
          setup:
            - "A FILED entry whose only PGAReview(FDA) has been set to HOLD."
            - "Officer (distinct from filer) attempts RELEASE."
