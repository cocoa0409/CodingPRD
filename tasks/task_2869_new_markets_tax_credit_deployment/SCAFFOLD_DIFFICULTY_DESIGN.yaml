# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2869 — New Markets Tax Credit Deployment
#
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every numeric assert below was computed by executing the matching
# §1.3 formula in Python against the pinned setup literals.
# All dates use the 365-day-year convention declared in global_conventions.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: substantially_all_direct_vs_aggregate_diverge_on_late_deployed_qlici
        grounds:
          - calculations.substantially_all_percentage
          - entities.QEI.fields.substantially_all_pct_direct
          - entities.QEI.fields.substantially_all_pct_aggregate
          - entities.AllocationAward.fields.substantially_all_method
          - state_machines.QEI.compliance_status.COMPLIANT_to_AT_RISK
        distinguishing_aspect: |
          Variant subject is the QEI's capital-deployment ratio: identical QLICI data yields
          measured_pct_direct 89.47 (a PASS) and measured_pct_aggregate 64.04 (a FAIL) because
          the direct variant nets permitted fees out of its denominator and ignores elapsed
          time, while the aggregate variant weights principal by days over a gross denominator.
        test_recipe:
          setup:
            - "One CERTIFIED CDE holding one ACTIVE 50,000,000,00 cent award whose substantially_all_method is AGGREGATE_BALANCE."
            - "One FUNDED investment fund with 65,000,000 cents equity and 35,000,000 cents leverage."
            - "One QEI of 100,000,000 cents issued 2026-09-01 (reserve 500 bps, fees 5,000,000, net deployable 95,000,000)."
            - "One QLICI of 85,000,000 cents deployed late in compliance year 1, on 2026-11-30 — 275 of the window's 365 days."
            - "Logical clock parked at the year-1 window end, 2027-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Delta Community Capital CDE", certification_number: "CDE-2869-001", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS", "LA"], min_severe_distress_share_pct: 60.00, substantially_all_method: "AGGREGATE_BALANCE" }
              as: CertifyingAgency
              captures: { award_id: $.data.id }
            - call: "POST /nmtc/allocation-awards/${award_id}/allocation-agreement"
              payload: { signatory_name: "A. Rivers" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { award_v_signed: $.data.version }
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { qalicb_id: $.data.id }
            - call: "POST /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 72.00, services_lic_pct: 65.00, tangible_property_lic_pct: 88.00, collectibles_pct: 0.00, nonqualified_financial_property_pct: 1.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
            - call: "POST /nmtc/community-benefits-agreements"
              payload: { qalicb_id: "${qalicb_id}", allocation_award_id: "${award_id}", target_fte_count: 25, wage_floor_cents_per_hour: 1800, local_hire_pct_target: 40.00, measurement_basis: "HEADCOUNT" }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/investment-funds"
              payload: { legal_name: "NMTC Fund I LLC", equity_contribution_cents: 65000000, leverage_lender_name: "Delta Bank", leverage_loan_principal_cents: 35000000, leverage_loan_rate_bps: 450 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
              captures: { fund_id: $.data.id }
            - call: "POST /nmtc/investment-funds/${fund_id}/closing"
              payload: { equity_received_cents: 65000000, leverage_received_cents: 35000000 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_v_signed}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qei_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/qlicis"
              payload: { qei_id: "${qei_id}", qalicb_id: "${qalicb_id}", loan_class: "A", principal_cents: 85000000 }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qlici_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/qeis/${qei_id}/annual-tests"
              payload: { compliance_year: 1 }
              as: ComplianceReviewer
              as_user_id: "reviewer-annual"
              captures: { test_id: $.data.id }
          assert:
            - "AnnualComplianceTest.${test_id}.window_start_at == \"2026-09-01T00:00:00.000Z\""
            - "AnnualComplianceTest.${test_id}.window_end_at == \"2027-09-01T00:00:00.000Z\""
            - "AnnualComplianceTest.${test_id}.window_days == 365"
            - "AnnualComplianceTest.${test_id}.measured_pct_direct == 89.47"
            - "AnnualComplianceTest.${test_id}.measured_pct_aggregate == 64.04"
            - "AnnualComplianceTest.${test_id}.governing_method == AGGREGATE_BALANCE"
            - "AnnualComplianceTest.${test_id}.governing_pct == 64.04"
            - "AnnualComplianceTest.${test_id}.result == FAIL"
            - "AnnualComplianceTest.${test_id}.recapture_triggered == false"
            - "QEI.${qei_id}.compliance_status == AT_RISK"
            - "QEI.${qei_id}.cure_deadline_at == \"2028-02-28T00:00:00.000Z\""
            - "QEI.${qei_id}.compliance_years_completed == 1"
            - "AllocationAward.${award_id}.at_risk_qei_count == 1"
            - "AllocationAward.${award_id}.compliance_posture == UNRESTRICTED"
            - "The two variants disagree on the verdict: measured_pct_direct 89.47 >= 85.00 while measured_pct_aggregate 64.04 < 85.00, and the award's declared method is what makes the test FAIL."

      - name: job_quality_headcount_vs_payroll_hours_diverge_on_same_reports
        grounds:
          - calculations.job_quality_compliance
          - entities.CommunityBenefitsAgreement.fields.measurement_basis
          - entities.JobReport.fields.wage_floor_met
          - state_machines.CommunityBenefitsAgreement.ACTIVE_to_BREACHED
          - state_machines.CommunityBenefitsAgreement.ACTIVE_to_CURE_REQUIRED
        distinguishing_aspect: |
          Variant subject is a DIFFERENT entity domain from the QEI capital ratio — community
          workforce performance on a CommunityBenefitsAgreement. Two agreements fed byte-identical
          job reports land on opposite verdicts: HEADCOUNT scores 72.00 (SHORTFALL -> BREACHED)
          because it counts 18 bodies, while PAYROLL_HOURS scores 86.52 (CURE_REQUIRED) because
          45,000 qualifying hours convert to 21.63 FTE at 2080 hours per year.
        test_recipe:
          setup:
            - "One ACTIVE award and one SEVERE census tract in MS."
            - "Two QALICBs in that tract, each with its own agreement under the same award: agreement A uses HEADCOUNT, agreement B uses PAYROLL_HOURS. Both target 25 FTE, a 1800 cent/hour wage floor and a 40.00 pct local-hire target."
            - "Each agreement carries the same two job reports: a wage-compliant one (20 head, 18 qualifying, 46000 hours, 45000 qualifying hours, 12 local hires, 1950 cents/hour) and a wage-failing one (10 head, 6 qualifying, 20800 hours, 12480 qualifying hours, 5 local hires, 1750 cents/hour)."
            - "Logical clock at 2027-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Delta Community Capital CDE", certification_number: "CDE-2869-002", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS", "LA"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
              captures: { award_id: $.data.id }
            - call: "POST /nmtc/allocation-awards/${award_id}/allocation-agreement"
              payload: { signatory_name: "A. Rivers" }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-a"
              captures: { qalicb_a_id: $.data.id }
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Fabrication LLC", state_code: "MS", naics_code: "332312" }
              as: QALICBSponsor
              as_user_id: "sponsor-b"
              captures: { qalicb_b_id: $.data.id }
            - call: "POST /nmtc/community-benefits-agreements"
              payload: { qalicb_id: "${qalicb_a_id}", allocation_award_id: "${award_id}", target_fte_count: 25, wage_floor_cents_per_hour: 1800, local_hire_pct_target: 40.00, measurement_basis: "HEADCOUNT" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { cba_a_id: $.data.id }
            - call: "POST /nmtc/community-benefits-agreements"
              payload: { qalicb_id: "${qalicb_b_id}", allocation_award_id: "${award_id}", target_fte_count: 25, wage_floor_cents_per_hour: 1800, local_hire_pct_target: 40.00, measurement_basis: "PAYROLL_HOURS" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { cba_b_id: $.data.id }
            - call: "POST /nmtc/community-benefits-agreements/${cba_a_id}/job-reports"
              payload: { period_start_at: "2026-09-01T00:00:00Z", period_end_at: "2027-02-28T00:00:00Z", headcount: 20, qualifying_headcount: 18, total_hours: 46000, qualifying_hours: 45000, local_hires: 12, avg_hourly_wage_cents: 1950 }
              as: QALICBSponsor
              as_user_id: "sponsor-a"
            - call: "POST /nmtc/community-benefits-agreements/${cba_a_id}/job-reports"
              payload: { period_start_at: "2027-03-01T00:00:00Z", period_end_at: "2027-08-31T00:00:00Z", headcount: 10, qualifying_headcount: 6, total_hours: 20800, qualifying_hours: 12480, local_hires: 5, avg_hourly_wage_cents: 1750 }
              as: QALICBSponsor
              as_user_id: "sponsor-a"
            - call: "POST /nmtc/community-benefits-agreements/${cba_b_id}/job-reports"
              payload: { period_start_at: "2026-09-01T00:00:00Z", period_end_at: "2027-02-28T00:00:00Z", headcount: 20, qualifying_headcount: 18, total_hours: 46000, qualifying_hours: 45000, local_hires: 12, avg_hourly_wage_cents: 1950 }
              as: QALICBSponsor
              as_user_id: "sponsor-b"
            - call: "POST /nmtc/community-benefits-agreements/${cba_b_id}/job-reports"
              payload: { period_start_at: "2027-03-01T00:00:00Z", period_end_at: "2027-08-31T00:00:00Z", headcount: 10, qualifying_headcount: 6, total_hours: 20800, qualifying_hours: 12480, local_hires: 5, avg_hourly_wage_cents: 1750 }
              as: QALICBSponsor
              as_user_id: "sponsor-b"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/community-benefits-agreements/${cba_a_id}/annual-certifications"
              payload: { certification_year: 1, window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2027-09-01T00:00:00Z" }
              as: ComplianceReviewer
              as_user_id: "reviewer-cba"
            - call: "POST /nmtc/community-benefits-agreements/${cba_b_id}/annual-certifications"
              payload: { certification_year: 1, window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2027-09-01T00:00:00Z" }
              as: ComplianceReviewer
              as_user_id: "reviewer-cba"
          assert:
            - "The HEADCOUNT certification response has achieved_fte == 18, compliance_pct == 72.00, local_hire_pct == 56.67, classification == \"SHORTFALL\", resulting_status == \"BREACHED\", report_count == 2, excluded_wage_failing_report_count == 1"
            - "The PAYROLL_HOURS certification response has achieved_fte == 21.63, compliance_pct == 86.52, local_hire_pct == 56.67, classification == \"CURE_REQUIRED\", resulting_status == \"CURE_REQUIRED\", report_count == 2, excluded_wage_failing_report_count == 1"
            - "CommunityBenefitsAgreement.${cba_a_id}.status == BREACHED"
            - "CommunityBenefitsAgreement.${cba_a_id}.latest_compliance_pct == 72.00"
            - "CommunityBenefitsAgreement.${cba_b_id}.status == CURE_REQUIRED"
            - "CommunityBenefitsAgreement.${cba_b_id}.consecutive_cure_required_count == 1"
            - "CommunityBenefitsAgreement.${cba_b_id}.latest_compliance_pct == 86.52"
            - "Both agreements report local_hire_pct == 56.67 (17 local hires over 30 total headcount), proving the wage-failing report is excluded from the job-quality numerator but NOT from the local-hire ratio"
            - "AllocationAward.${award_id}.cba_breach_count == 1"
            - "AllocationAward.${award_id}.compliance_posture == RESTRICTED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_allocation_rounds_per_qlici_then_pushes_signed_residual_to_earliest_largest
        grounds:
          - calculations.cde_asset_management_fee_allocation
          - entities.QLICI.fields.allocated_fee_cents
          - entities.AnnualComplianceTest.fields.fee_allocation_total_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order is observable. The 500,000 cent annual fee
          spread over principals 31,666,667 / 31,666,667 / 31,666,666 rounds to 166,667 three
          times (sum 500,001), so the pinned order "round each share, then sum, then push the
          signed residual of -1 onto the greatest-outstanding row with created_at ASC tie-break"
          yields [166,666, 166,667, 166,667]; a sum-then-round implementation yields
          [166,667, 166,667, 166,666] and a proportional-residual implementation yields neither.
        test_recipe:
          setup:
            - "One ACTIVE award with substantially_all_method DIRECT_TRACING."
            - "One QEI of 100,000,000 cents issued 2026-09-01 with net deployable 95,000,000."
            - "Three QLICIs to the same CERTIFIED QALICB, deployed on three distinct days so created_at ordering is unambiguous: 31,666,667 on 2026-09-02, 31,666,667 on 2026-09-03, 31,666,666 on 2026-09-04. Together they consume the whole 95,000,000."
            - "Logical clock at 2027-09-01 for the year-1 annual test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Delta Community Capital CDE", certification_number: "CDE-2869-003", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS", "LA"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
              captures: { award_id: $.data.id }
            - call: "POST /nmtc/allocation-awards/${award_id}/allocation-agreement"
              payload: { signatory_name: "A. Rivers" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { award_v_signed: $.data.version }
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { qalicb_id: $.data.id }
            - call: "POST /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 72.00, services_lic_pct: 65.00, tangible_property_lic_pct: 88.00, collectibles_pct: 0.00, nonqualified_financial_property_pct: 1.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
            - call: "POST /nmtc/community-benefits-agreements"
              payload: { qalicb_id: "${qalicb_id}", allocation_award_id: "${award_id}", target_fte_count: 25, wage_floor_cents_per_hour: 1800, local_hire_pct_target: 40.00, measurement_basis: "HEADCOUNT" }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/investment-funds"
              payload: { legal_name: "NMTC Fund I LLC", equity_contribution_cents: 65000000, leverage_lender_name: "Delta Bank", leverage_loan_principal_cents: 35000000, leverage_loan_rate_bps: 450 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
              captures: { fund_id: $.data.id }
            - call: "POST /nmtc/investment-funds/${fund_id}/closing"
              payload: { equity_received_cents: 65000000, leverage_received_cents: 35000000 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_v_signed}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qei_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/qlicis"
              payload: { qei_id: "${qei_id}", qalicb_id: "${qalicb_id}", loan_class: "A", principal_cents: 31666667 }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qlici_1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/qlicis"
              payload: { qei_id: "${qei_id}", qalicb_id: "${qalicb_id}", loan_class: "A", principal_cents: 31666667 }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qlici_2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/qlicis"
              payload: { qei_id: "${qei_id}", qalicb_id: "${qalicb_id}", loan_class: "B", principal_cents: 31666666 }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qlici_3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/qeis/${qei_id}/annual-tests"
              payload: { compliance_year: 1 }
              as: ComplianceReviewer
              as_user_id: "reviewer-annual"
              captures: { test_id: $.data.id }
          assert:
            - "AnnualComplianceTest.${test_id}.fee_allocation_total_cents == 500000"
            - "QLICI.${qlici_1_id}.allocated_fee_cents == 166666"
            - "QLICI.${qlici_2_id}.allocated_fee_cents == 166667"
            - "QLICI.${qlici_3_id}.allocated_fee_cents == 166667"
            - "The three allocated_fee_cents values sum to exactly 500000"
            - "QEI.${qei_id}.accrued_unpaid_fee_cents == 0"
            - "QEI.${qei_id}.uninvested_cash_cents == 0"
            - "QEI.${qei_id}.deployment_status == FULLY_DEPLOYED"
            - "AnnualComplianceTest.${test_id}.measured_pct_direct == 100.00"
            - "AnnualComplianceTest.${test_id}.result == PASS"

      - name: qei_reserve_tier_selected_from_gross_amount_before_fee_subtraction
        grounds:
          - calculations.qei_reserve_and_net_deployable
          - entities.QEI.fields.reserve_bps
          - entities.QEI.fields.permitted_fees_cents
          - entities.QEI.fields.net_deployable_cents
          - entities.QEI.fields.deployment_deadline_at
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order, on a different
          axis from the fee-rounding instance. At exactly 500,000,000 cents the tier boundary is
          straddled: the GROSS amount sits in the 400 bps band (fees 20,000,000, net 480,000,000),
          whereas deriving the tier from any post-fee figure drops back into the 500 bps band and
          produces 25,000,000 / 475,000,000. The scaffold pins gross-first, so 400 bps is correct.
        test_recipe:
          setup:
            - "One ACTIVE award with 5,000,000,000 cents of authority."
            - "One FUNDED fund with 325,000,000 cents equity and 175,000,000 cents leverage, i.e. 500,000,000 cents of capital available."
            - "Logical clock at 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
