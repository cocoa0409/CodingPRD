              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_d11_id: "$.data.id" }
          assert:
            - "first call: HTTP 200 with aoi_status \"ISSUED\" — the AUM ledger write bumps the version (bump 1)"
            - "second call: HTTP 200 with determination \"MEETING\"; Allotment.health_determination becomes \"MEETING\" (bump 2)"
            - "third call: HTTP 201 with order_status \"ACTIVE\" and reduction_pct \"0.3000\" (a DROUGHT_REDUCTION order requires reduction_pct); its cascade drops Allotment.effective_capacity_aums to floor(1000 x 0.70) == 700 and re-authorizes the ISSUED AOI to floor(100 x 0.70) == 70, which is bump 3"
            - "fifth call: ${c_a71_ver3} == ${c_a71_ver0} + 3 — three separate endpoints each bumped exactly +1"
            - "fourth call: HTTP 412 with data.error_id == \"ERR_STALE_ALLOTMENT_VERSION\" — the token was invalidated by writes the client never issued"
            - "sixth call: HTTP 200 with order_status \"LIFTED\"; Allotment.effective_capacity_aums returns to 1000 and the AOI's authorized_aums returns to 100"
            - "seventh call: ${c_a71_ver4} == ${c_a71_ver3} + 1 — lifting the closure bumps the version too, so even a RESTORING write invalidates a token"
            - "eighth call: HTTP 201 with data.id == ${c_d11_id}"
            - "GET /permit-decisions?allotment_id=${c_a71_id} returns total_count 1 — only the last create survived"

      - name: corner_cancellation_decision_cascades_permit_aoi_bill_and_ledger
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PermitDecision.FINAL_to_EFFECTIVE
          - state_machines.GrazingPermit.ISSUED_to_CANCELLED
          - state_machines.AnnualOperatingInstruction.ISSUED_to_VOIDED
          - calculations.aum_allocation_ledger
          - calculations.aum_conservation_invariant
          - calculations.permittee_outstanding_balance
          - endpoints.POST /permit-decisions/{decisionId}/make-effective
        distinguishing_aspect: "A four-hop chain that no other instance walks, because its trigger is decision_type CANCELLATION rather than a stocking adjustment or a closure: making the decision effective cancels the named permit, WHICH voids that permit's DRAFT and ISSUED AOIs, WHICH voids each voided AOI's outstanding bills and returns its billable AUMs to the allotment ledger and its pasture's scheduled_aums, WHICH drops the permittee's outstanding balance to zero. Each hop is caused by the previous one — the make-effective call itself names only the permit — and the whole chain is visible in reads taken immediately afterwards."
