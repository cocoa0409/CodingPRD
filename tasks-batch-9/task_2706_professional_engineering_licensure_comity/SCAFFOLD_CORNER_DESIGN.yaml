      - name: err_clock_rewind_forbidden_but_idempotent_reset_allowed
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CLOCK_REWIND_FORBIDDEN
          - validations[priority=43]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The guard is strict-precedes, not not-equal: rewinding to 2026-08-15 after the clock reached 2026-09-01 returns 409 ERR_CLOCK_REWIND_FORBIDDEN, while re-setting the clock to the identical 2026-09-01 succeeds with all sweep counters 0."
        test_recipe:
          setup:
            - "empty database; the logical clock has been advanced from its 2026-08-01T00:00:00Z default to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "SEC-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "SEC-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "SEC-1"
          assert:
            - "trigger[0] http_status == 409"
            - "trigger[0] response.data.error_id == \"ERR_CLOCK_REWIND_FORBIDDEN\""
            - "trigger[1] http_status == 200"
            - "trigger[1] response.data.current_utc == \"2026-09-01T00:00:00.000Z\""
            - "trigger[1] response.data.expired_license_count == 0"
            - "trigger[1] response.data.expired_authorization_count == 0"

