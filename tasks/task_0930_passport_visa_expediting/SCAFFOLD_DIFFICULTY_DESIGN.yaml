              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Form Dep", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_id: $.data.id }
            - call: "GET /expediting/applicants/${ap_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_v1: $.data.version }
          trigger:
