              as: UtilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CONDITION_ALREADY_DISCHARGED (409); C2 remains ISSUED"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: get_unknown_ids_return_typed_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - errors[ERR_CANDIDATE_NOT_FOUND]
          - errors[ERR_COMMITMENT_NOT_FOUND]
        distinguishing_aspect: "Each top-level resource family returns its own typed 404: ERR_RESOURCE_NOT_FOUND, ERR_CANDIDATE_NOT_FOUND, ERR_COMMITMENT_NOT_FOUND — never a generic 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /resources/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: UtilityPlanner
              captures: { e1: $.data.error_id }
            - call: "GET /candidates/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: UtilityPlanner
              captures: { e2: $.data.error_id }
            - call: "GET /procurement-commitments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: UtilityPlanner
              captures: { e3: $.data.error_id }
          assert:
            - "e1 == ERR_RESOURCE_NOT_FOUND, e2 == ERR_CANDIDATE_NOT_FOUND, e3 == ERR_COMMITMENT_NOT_FOUND (all 404)"

      - name: occ_stale_portfolio_version_on_snapshot
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[snapshot-stale-portfolio-version]
        distinguishing_aspect: "OCC per §1.2.1: a snapshot call carrying expected_portfolio_version one behind the current version (a position add bumped it) fails ERR_STALE_PORTFOLIO_VERSION 412; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["Plan P DRAFT; portfolio PF; BASE forecast 2030; a position add advanced PF version from 1 to 2."]
          setup_api_calls:
            - call: "POST /plans"
