  output: PowerContract[]
  side_effects: []
- method: GET
  path: /smelter-ops/smelters/{id}/hedge-positions
  description: List hedge positions of a smelter.
  roles:
  - PlatformAdmin
  - EnergyManager
  - TradingAnalyst
  - SmelterManager
  - Controller
  - VPOperations
  - EHSManager
  code: 200
