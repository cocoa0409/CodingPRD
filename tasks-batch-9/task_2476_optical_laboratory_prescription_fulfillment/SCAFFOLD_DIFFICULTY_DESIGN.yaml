  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: prescription_verification_blocked_by_a_suspended_prescriber_record
        grounds:
          - validations[priority=160]
          - errors.ERR_PRESCRIBER_NOT_ACTIVE
          - state_machines.PrescriptionRecord.UNVERIFIED_to_VERIFIED
          - entities.Prescriber.fields.status
        distinguishing_aspect: |
          Entity pair PrescriptionRecord x Prescriber: the prescription is itself perfectly valid and
          UNVERIFIED, and the claimed NPI and licence state match exactly, yet verification is
          refused purely because of the Prescriber row's SUSPENDED standing; reinstating the
          prescriber makes the identical call succeed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Prescriber with NPI 1234567893, licence state CA and max_rx_validity_months 12, initially ACTIVE."
            - "A patient with no insurance plan (billing is irrelevant here)."
            - "A prescription issued 2026-03-01 claiming NPI 1234567893 and CA, left UNVERIFIED."
            - "The prescriber has then been set to SUSPENDED; because the prescription is UNVERIFIED, the standing cascade does not touch it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Iris Vance", license_state: "CA", max_rx_validity_months: 12 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { presc_id: $.data.id, presc_state_initial: $.data.status }
            - call: "POST /patients"
              payload: { full_name: "Owen Pike", date_of_birth: "1981-11-09" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { pat_id: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${presc_id}", prescriber_npi_claimed: "1234567893", prescriber_license_state_claimed: "CA", sphere_od: -3.00, cylinder_od: -1.25, axis_od: 90, sphere_os: -2.75, cylinder_os: -1.00, axis_os: 85, add_power: 2.00, prism_od: 0.50, prism_os: 0.00, pd_distance_mm: 61.0, issued_on: "2026-03-01" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { rx_id: $.data.id, rx_state_initial: $.data.verification_status }
            - call: "PATCH /prescribers/${presc_id}/status"
              payload: { status: "SUSPENDED" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { presc_state_suspended: $.data.status }
          trigger:
            - call: "POST /prescriptions/${rx_id}/verify"
              payload: { verification_note: "NPI and license match the prescriber record" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { err_blocked: $.data.error_id, msg_blocked: $.data.message }
            - call: "PATCH /prescribers/${presc_id}/status"
              payload: { status: "ACTIVE" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { presc_state_restored: $.data.status }
            - call: "POST /prescriptions/${rx_id}/verify"
              payload: { verification_note: "NPI and license match the prescriber record" }
              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { rx_state_after: $.data.verification_status, rx_verified_at: $.data.verified_at }
          assert:
            - "${presc_state_initial} == ACTIVE and ${presc_state_suspended} == SUSPENDED"
            - "${rx_state_initial} == UNVERIFIED"
            - "${err_blocked} == ERR_PRESCRIBER_NOT_ACTIVE with HTTP 422"
            - "PrescriptionRecord.${rx_id}.verification_status was still UNVERIFIED after the rejection and verified_at was still null"
            - "${presc_state_restored} == ACTIVE"
            - "${rx_state_after} == VERIFIED"
            - "${rx_verified_at} == 2026-08-01T00:00:00.000Z"
            - "Prescriber.${presc_id}.verified_rx_count == 1"

      - name: remake_case_close_blocked_until_the_replacement_order_reaches_lab_complete
        grounds:
          - validations[priority=700]
          - errors.ERR_REMAKE_NOT_DELIVERABLE
          - state_machines.RemakeCase.ADJUDICATED_to_CLOSED
          - state_machines.RxOrder.fulfillment_status.REMAKE_PENDING_to_IN_LAB
        distinguishing_aspect: |
          A different entity pair, RemakeCase x RxOrder: the case is fully adjudicated and internally
          ready to close, but closing is refused while the order it belongs to sits in REMAKE_PENDING,
          and the identical close call succeeds the moment the replacement job is released and the
          order reaches LAB_COMPLETE.
