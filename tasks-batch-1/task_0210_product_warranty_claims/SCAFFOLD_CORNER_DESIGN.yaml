              payload: { registration_id: "${reg_id}", defect_category: "MANUFACTURING", reported_date: "2025-01-15T00:00:00Z" }
              as: Owner
              as_user_id: "${o_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/issue-rma"
              payload: {}
              as: ClaimsProcessor
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE", resolution_type: "REFUND" }
              as: WarrantyAdmin
              captures: { assessed: $.data.assessed_value_cents, status: $.data.status }
          assert:
            - "response.data.assessed_value_cents == 37500"
            - "response.data.status == ADJUDICATED"
            - "Registration.${reg_id}.remaining_coverage_cents == 2500"
