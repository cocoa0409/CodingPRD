        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[report-header-stale-edit]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: PUT with the version observed at read succeeds and bumps version; replaying the same expected version is then rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Report DRAFT at version 1"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-CC1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PUT /daily-reports/${rep}", payload: { expected_report_version: "${v1}", general_notes: "first edit" }, as: Superintendent, captures: { v2: $.data.version } }
            - { call: "PUT /daily-reports/${rep}", payload: { expected_report_version: "${v1}", general_notes: "stale edit" }, as: Superintendent, captures: { err: $.data.error_id } }
          assert:
            - "first edit succeeds; version becomes ${v1} + 1"
            - "replay with old expected version -> ERR_STALE_VERSION (412)"

