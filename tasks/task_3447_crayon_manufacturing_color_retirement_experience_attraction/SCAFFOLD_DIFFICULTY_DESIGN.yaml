          - state_machines.Color.IN_VOTE_to_ACTIVE
        distinguishing_aspect: "Cyclic machine on Color: a FAILED introduction tally returns the color IN_VOTE -> PROPOSED (not terminal), and a second campaign completes the loop PROPOSED -> IN_VOTE -> ACTIVE — the same state is visited twice with different outcomes."
