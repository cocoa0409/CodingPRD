  - section: calculations
    instances:

      - name: filing_deadline_is_five_business_days_after_determination
        claim_type: correct_result
        grounds:
          - calculations.filing_deadline
          - entities.RecallCampaign.fields.filing_deadline_utc
        distinguishing_aspect: |
          A determination on Monday 2026-08-03 counts Tue/Wed/Thu/Fri (4) and then Monday 2026-08-10
          as the fifth business day, skipping the weekend, so the deadline is 2026-08-10T23:59:59Z --
          not 2026-08-08 (calendar days) and not 2026-08-11.
        test_recipe:
          setup:
            - "A DRAFT campaign 26V-300 exists; clock at 2026-08-03T09:00:00Z (a Monday)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-300", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
          assert:
            - "HTTP status is 200"
            - "response.data.filing_deadline_utc == \"2026-08-10T23:59:59Z\""
            - "response.data.days_late == 0 and response.data.late_filing_flag == false and response.data.filed_at is null"

      - name: filing_deadline_skips_the_declared_federal_holiday
        claim_type: constants_applied
        grounds:
          - calculations.filing_deadline
          - calculations.filing_deadline.constants.FEDERAL_HOLIDAYS
        distinguishing_aspect: |
          From Tuesday 2026-09-01 the five business days are Sep 2, 3, 4, then Monday 2026-09-07 is
          skipped because it is in FEDERAL_HOLIDAYS, so counting resumes Sep 8 and Sep 9 -- deadline
          2026-09-09T23:59:59Z, one day later than a weekend-only calendar would give.
        test_recipe:
          setup:
            - "A DRAFT campaign 26V-301 exists; clock advanced to 2026-09-01T09:00:00Z (a Tuesday)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-301", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-09-01T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
          assert:
            - "HTTP status is 200"
            - "response.data.filing_deadline_utc == \"2026-09-09T23:59:59Z\""
            - "response.data.days_late == 0 and response.data.late_filing_flag == false"

      - name: filing_exactly_at_the_deadline_instant_is_timely_but_one_day_later_is_late
        claim_type: threshold
        grounds:
          - calculations.filing_deadline
          - entities.RecallCampaign.fields.days_late
          - entities.RecallCampaign.fields.late_filing_flag
          - entities.RegulatoryFiling.fields.days_late
        distinguishing_aspect: |
          The lateness comparison is STRICT >: campaign A filed at exactly 2026-08-10T23:59:59Z is
          timely with days_late 0, while campaign B filed at 2026-08-12T00:00:00Z is 86401 seconds
          past the same deadline and, because days_late is the CEILING of fractional days, records 2
          -- not 1.
        test_recipe:
          setup:
            - "Two campaigns 26V-302 and 26V-303 both recorded a defect determination at 2026-08-03T09:00:00Z, so both carry filing_deadline_utc 2026-08-10T23:59:59Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-302", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_a_id: $.data.id }
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-303", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture in the second lot" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_b_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_a_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_b_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T23:59:59Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /recall-campaigns/${camp_a_id}/filings"
              payload: { filing_type: "DEFECT_NOTICE", narrative: "Part 573 defect information report for 26V-302" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /recall-campaigns/${camp_b_id}/filings"
              payload: { filing_type: "DEFECT_NOTICE", narrative: "Part 573 defect information report for 26V-303" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          assert:
            - "the first trigger call returned HTTP 201 with response.data.filed_at == \"2026-08-10T23:59:59Z\" and response.data.days_late == 0"
            - "GET /recall-campaigns/${camp_a_id} shows late_filing_flag == false, days_late == 0 and campaign_status == \"FILED\""
            - "the third trigger call returned HTTP 201 with response.data.filed_at == \"2026-08-12T00:00:00Z\" and response.data.days_late == 2"
            - "GET /recall-campaigns/${camp_b_id} shows late_filing_flag == true and days_late == 2"

      - name: population_rerun_matches_nothing_new_and_leaves_counters_unchanged
        claim_type: input_set_filtering
        grounds:
          - calculations.affected_population_match
          - endpoints[POST /recall-campaigns/{id}/population-runs]
          - entities.VehiclePopulationRule.fields.matched_vehicle_count
        distinguishing_aspect: |
          The matcher only considers build records that do not already have an AffectedVehicle row for
          the campaign, so a second run over an unchanged fleet reports matched_count 0 -- it must not
          re-report the same vehicle nor create a duplicate row (affected_vehicle_count stays 1).
        test_recipe:
          setup:
            - "Campaign 26V-304 is DEFECT_DETERMINED with an INCLUDE rule for PLT1/MDLA/2024, [2024-01-01, 2024-07-01) and parts 1000..1999."
            - "One matching NE build record exists and one population run has already been executed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-304", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "POST /recall-campaigns/${camp_id}/population-rules"
              payload: { inclusion_mode: "INCLUDE", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_start_date: "2024-01-01", production_end_date: "2024-07-01", part_number_low: 1000, part_number_high: 1999 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/population-runs"
              payload: {}
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
          trigger:
            - call: "POST /recall-campaigns/${camp_id}/population-runs"
              payload: {}
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
          assert:
            - "HTTP status is 200"
            - "response.data.matched_count == 0 and response.data.excluded_count == 0 and response.data.removed_count == 0"
            - "response.data.affected_vehicle_count == 1 and response.data.recall_population_count == 1"
            - "GET /affected-vehicles with campaign_id == ${camp_id} returns total_count == 1"
            - "GET /recall-campaigns/${camp_id}/population-rules shows matched_vehicle_count == 1 for the INCLUDE rule"

      - name: exclude_rule_carves_a_matched_build_back_out_of_the_population
        claim_type: constraint_propagation
        grounds:
          - calculations.affected_population_match
          - entities.VehiclePopulationRule.fields.inclusion_mode
          - validations[priority=30]
        distinguishing_aspect: |
          The INCLUDE rule matches both build records, then the narrower EXCLUDE rule (production
          window [2024-03-01, 2024-04-01), part 1500..1500) subtracts only the March car; the May car
          keeps the same part number and survives, so the run reports matched_count 1 and
          excluded_count 1 from a two-vehicle fleet.
        test_recipe:
