# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_1217_concert_tour_routing_advance
# §1.8 Test Targeting Index — 2 instances per rule × 9 rules = 18 instances
# =============================================================================

scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: projected_pnl_pre_vs_post_on_sale
        grounds:
          - calculations.projected_show_pnl
          - entities.Show.fields.projected_gross_cents
          - entities.Tour.fields.projected_gross_cents
        distinguishing_aspect: |
          Show-level projection flips between PRE_ON_SALE (capacity*price*0.65)
          and POST_ON_SALE (tickets_sold actuals + 0.35 decay on unsold) variants
          at the on_sale_at clock crossing; same show + same tickets_sold produce
          different projected_gross_cents before vs after the flip.
        test_recipe:
          setup:
            - "Tour T1 in ROUTING with Market M1 and Venue V1 (capacity 1000, available 2026-08-01)"
            - "Show S1 on 2026-08-01 with on_sale_at 2026-07-01T00:00:00Z, avg_ticket_price_cents=10000, tickets_sold=400"
            - "Logical clock starts 2026-06-15 (before on_sale); S1 confirmed"
            - "One committed BudgetLine of estimated_cents=200000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T1", artist_name: "A", window_start_date: "2026-07-15", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "NYC", metro_name: "New York", country_code: "US", radius_miles: 60, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "MsgHall", capacity: 1000, base_rent_cents: 500000, curfew_local_time: "23:00", available_dates: ["2026-08-01"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-01", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 10000 }
              as: TourManager
              captures: { show_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds"
              payload: { promoter_name: "P1", guarantee_cents: 500000, versus_pct: 80 }
              as: Promoter
              captures: { hold_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds/${hold_id}/accept"
              payload: {}
              as: Promoter
            - call: "POST /tours/${tour_id}/shows/${show_id}/budget-lines"
              payload: { category: "CREW", description: "crew", estimated_cents: 200000 }
              as: TourManager
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tour_ver: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${show_id}/confirm"
              payload: { expected_tour_version: "${tour_ver}" }
              as: TourManager
            - call: "PATCH /tours/${tour_id}/shows/${show_id}/tickets"
              payload: { tickets_sold: 400 }
              as: Promoter
          trigger:
            - call: "GET /tours/${tour_id}/shows/${show_id}"
              payload: {}
              as: TourManager
              captures: { pre_gross: $.data.projected_gross_cents, pre_cost: $.data.projected_cost_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_id}"
              payload: {}
              as: TourManager
              captures: { post_gross: $.data.projected_gross_cents, post_cost: $.data.projected_cost_cents }
          assert:
            - "pre_gross == 6500000 (1000 * 10000 * 0.65)"
            - "pre_cost == 200000 + 1000*350 = 550000"
            - "post_gross == 400*10000 + 600*10000*0.35 = 4000000 + 2100000 = 6100000"
            - "post_cost == 200000 + 400*350 = 340000"
            - "pre_gross != post_gross (6500000 vs 6100000) — variants diverge on identical show inputs"

      - name: settlement_share_guarantee_vs_versus
        grounds:
          - calculations.settlement_artist_share
          - entities.Settlement.fields.artist_share_cents
        distinguishing_aspect: |
          Settlement artist_share_cents picks guarantee_only when round(net*P) < G
          and versus_kicks_in when round(net*P) >= G; same entity, same inputs,
          different outputs depending on which arm of the max() wins — exercised
          against the Settlement domain (not the Show projection domain of the
          sibling instance).
        test_recipe:
          setup:
            - "Show S_A with hold guarantee=1000000, versus_pct=70; net computed as 1000000 (versus = 700000 < guarantee)"
            - "Show S_B with hold guarantee=1000000, versus_pct=70; net computed as 2000000 (versus = 1400000 >= guarantee)"
            - "Both shows PERFORMED, settlements DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T2", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "LA", metro_name: "Los Angeles", country_code: "US", radius_miles: 60, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "LAForum", capacity: 500, base_rent_cents: 100000, curfew_local_time: "23:00", available_dates: ["2026-07-10", "2026-07-11"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            # Show A — guarantee wins
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-07-10", on_sale_at: "2026-06-15T00:00:00Z", avg_ticket_price_cents: 5000 }
              as: TourManager
              captures: { show_a: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_a}/holds"
              payload: { promoter_name: "P", guarantee_cents: 1000000, versus_pct: 70 }
              as: Promoter
              captures: { hold_a: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_a}/holds/${hold_a}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv1: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${show_a}/confirm"
              payload: { expected_tour_version: "${tv1}" }
              as: TourManager
            - call: "POST /tours/${tour_id}/shows/${show_a}/advance-packet/sections/tech_rider/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_a}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr1: $.data.packet_revision }
            - call: "POST /tours/${tour_id}/shows/${show_a}/advance-packet/sections/tech_rider/approve"
              payload: { expected_packet_revision: "${pr1}" }
              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_a}/advance-packet/sections/hospitality/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_a}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr2: $.data.packet_revision }
            - call: "POST /tours/${tour_id}/shows/${show_a}/advance-packet/sections/hospitality/approve"
              payload: { expected_packet_revision: "${pr2}" }
              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_a}/advance-packet/sections/immigration/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_a}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr3: $.data.packet_revision }
            - call: "POST /tours/${tour_id}/shows/${show_a}/advance-packet/sections/immigration/approve"
              payload: { expected_packet_revision: "${pr3}" }
              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_a}/advance"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:01Z" }
              as: TourManager
            - call: "POST /tours/${tour_id}/shows/${show_a}/mark-performed"
              payload: {}
              as: TourManager
          trigger:
            # Net for A: gross 1200000, taxes 50000, fees 30000, expenses 120000 → net=1000000, versus=700000<1000000
            - call: "POST /tours/${tour_id}/shows/${show_a}/settlement/submit"
              payload: { box_office_gross_cents: 1200000, taxes_cents: 50000, facility_fees_cents: 30000, promoter_expenses_cents: 120000 }
              as: Promoter
              captures: { share_a: $.data.artist_share_cents }
          assert:
            - "share_a == 1000000 (guarantee_only arm: max(1000000, round(1000000*0.7)) = max(1000000, 700000))"

  # -------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: artist_share_mode_a_multi_input_max
        grounds:
          - calculations.settlement_artist_share
        distinguishing_aspect: |
          Mode (a): >=3 inputs (box_office_gross, taxes, facility_fees,
          promoter_expenses, guarantee, versus_pct) with non-linear interaction
          — the max(guarantee, versus*net) picks a different arm depending on
          the joint value of all six inputs.
        test_recipe:
          setup:
            - "Show with hold guarantee=800000, versus_pct=60"
            - "Gross=3000000, taxes=200000, fees=100000, expenses=200000 → net=2500000"
            - "versus arm: round(2500000 * 0.60) = 1500000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "TC", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "CHI", metro_name: "Chicago", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "UC", capacity: 800, base_rent_cents: 100000, curfew_local_time: "23:00", available_dates: ["2026-07-20"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-07-20", on_sale_at: "2026-06-15T00:00:00Z", avg_ticket_price_cents: 5000 }
              as: TourManager
              captures: { show_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds"
              payload: { promoter_name: "P", guarantee_cents: 800000, versus_pct: 60 }
              as: Promoter
              captures: { hold_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds/${hold_id}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${show_id}/confirm"
              payload: { expected_tour_version: "${tv}" }
              as: TourManager
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/tech_rider/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_id}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr: $.data.packet_revision }
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/tech_rider/approve"
              payload: { expected_packet_revision: "${pr}" }
              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/hospitality/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_id}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr2: $.data.packet_revision }
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/hospitality/approve"
              payload: { expected_packet_revision: "${pr2}" }
              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/immigration/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_id}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr3: $.data.packet_revision }
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/immigration/approve"
              payload: { expected_packet_revision: "${pr3}" }
              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-21T00:00:01Z" }
              as: TourManager
            - call: "POST /tours/${tour_id}/shows/${show_id}/mark-performed"
              payload: {}
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/shows/${show_id}/settlement/submit"
              payload: { box_office_gross_cents: 3000000, taxes_cents: 200000, facility_fees_cents: 100000, promoter_expenses_cents: 200000 }
              as: Promoter
              captures: { share: $.data.artist_share_cents, flag: $.data.variance_flag }
          assert:
            - "share == 1500000 (versus arm: round(2500000 * 0.60) = 1500000 > guarantee 800000)"

      - name: marketing_cpa_mode_b_per_line_vs_blended
        grounds:
          - calculations.marketing_cpa
          - entities.MarketingSpend.fields.cpa_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-line CPA is
          round(spend/sales) per row; blended CPA uses raw sums and rounds once.
          The two produce different cents on the same data. Scaffold pins
          per-line-first ordering explicitly.
        test_recipe:
          setup:
            - "Show with two MarketingSpend rows:"
            - "Line 1: spend=1000, sales=3 → per_line cpa = round(1000/3) = 333"
            - "Line 2: spend=1000, sales=3 → per_line cpa = round(1000/3) = 333"
            - "Blended CPA = round(2000/6) = 333 (matches here but for sales=7+7=14 would diverge)"
            - "Use sales=7 per line to expose the divergence: per-line=round(1000/7)=143, blended=round(2000/14)=143 — same; pick spend=1001, sales=3 → per-line=334, sum=2002/6=334 — same"
            - "Pick spend=500, sales=3 (per-line=167) and spend=500, sales=4 (per-line=125). Blended = round(1000/7) = 143. Average of per-lines = (167+125)/2 = 146. Blended != naive avg."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "TM", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "SEA", metro_name: "Seattle", country_code: "US", radius_miles: 40, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "Paramount", capacity: 500, base_rent_cents: 50000, curfew_local_time: "23:00", available_dates: ["2026-08-05"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-05", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 8000 }
              as: TourManager
              captures: { show_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/shows/${show_id}/marketing-spends"
              payload: { channel: "RADIO", spend_cents: 500, flight_start_date: "2026-06-15", flight_end_date: "2026-07-15", attributed_ticket_sales: 3 }
              as: TourManager
              captures: { l1: $.data.cpa_cents }
            - call: "POST /tours/${tour_id}/shows/${show_id}/marketing-spends"
              payload: { channel: "SOCIAL", spend_cents: 500, flight_start_date: "2026-06-15", flight_end_date: "2026-07-15", attributed_ticket_sales: 4 }
              as: TourManager
              captures: { l2: $.data.cpa_cents }
          assert:
            - "l1 == 167 (round(500/3) = 166.67 → 167 round_half_up)"
            - "l2 == 125 (round(500/4) = 125 exact)"
            - "blended = round(1000/7) = round(142.857) = 143; naive avg of per-lines = (167+125)/2 = 146; ordering matters"

  # -------------------------------------------------------------------------
  # Rule 3 — Non-linear state machine shape on different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: promoter_hold_cyclic_counter_loop
        grounds:
          - state_machines.PromoterHold.PENDING_to_COUNTERED
          - state_machines.PromoterHold.COUNTERED_to_PENDING
        distinguishing_aspect: |
          PromoterHold cycles PENDING→COUNTERED→PENDING→COUNTERED→... up to
          MAX_COUNTER_ROUNDS times before reaching a terminal state. Shape is
          a true cycle (A→B→A), not a linear pipeline.
        test_recipe:
          setup:
            - "Show S with PromoterHold H in PENDING"
            - "counter_count == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "TCyc", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "BOS", metro_name: "Boston", country_code: "US", radius_miles: 40, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "Garden", capacity: 900, base_rent_cents: 100000, curfew_local_time: "23:00", available_dates: ["2026-08-10"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-10", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 7000 }
              as: TourManager
              captures: { show_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds"
              payload: { promoter_name: "P", guarantee_cents: 900000, versus_pct: 75 }
              as: Promoter
              captures: { hold_id: $.data.id }
            - call: "GET /tours/${tour_id}/shows/${show_id}"
              payload: {}
              as: Promoter
              captures: { sv: $.data.version }
          trigger:
            # Round 1: PENDING → COUNTERED
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds/${hold_id}/counter"
              payload: { guarantee_cents: 950000, versus_pct: 78, expected_show_version: "${sv}" }
              as: Promoter
              captures: { c1: $.data.counter_count }
            # Round 1 return: COUNTERED → PENDING
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds/${hold_id}/respond-counter"
              payload: { accept_counter: false }
              as: TourManager
              captures: { s2: $.data.status }
            # Round 2: PENDING → COUNTERED
            - call: "GET /tours/${tour_id}/shows/${show_id}"
              payload: {}
              as: Promoter
              captures: { sv2: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds/${hold_id}/counter"
              payload: { guarantee_cents: 975000, versus_pct: 80, expected_show_version: "${sv2}" }
              as: Promoter
              captures: { c2: $.data.counter_count }
            # Round 2 return: COUNTERED → PENDING
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds/${hold_id}/respond-counter"
              payload: { accept_counter: true }
              as: TourManager
              captures: { s3: $.data.status }
          assert:
            - "c1 == 1 and s2 == PENDING (looped back)"
            - "c2 == 2 and s3 == PENDING (looped back again)"
            - "After accept_counter=true, hold terms updated to guarantee=975000, versus=80"

      - name: show_parallel_status_and_posture
        grounds:
          - state_machines.Show
          - entities.Show.fields.status
          - entities.Show.fields.posture
        distinguishing_aspect: |
          Show carries two independent state dimensions on the same row:
          status (HOLD_REQUESTED→HOLD_PLACED→CONFIRMED→ADVANCED→PERFORMED→SETTLED)
          and posture (OPEN | GATED, derived from tour posture and packet state).
          The dimensions evolve independently — opening a ComplianceHold flips
          posture to GATED without changing status.
        test_recipe:
          setup:
            - "Tour with Show in HOLD_PLACED, posture=OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "TPar", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "ATL", metro_name: "Atlanta", country_code: "US", radius_miles: 40, exclusivity_window_days: 30, territory_rank: 1 }
