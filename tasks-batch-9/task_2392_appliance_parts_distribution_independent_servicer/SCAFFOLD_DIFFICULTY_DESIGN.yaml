            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p1_id}", on_hand_units: 10, reorder_point: 2 }
              as: PlatformAdmin
              captures: { inv_a_p1_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 2, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_id: $.data.id }
            - call: "POST /part-orders/${order_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "PATCH /branches/${branch_a_id}"
              payload: { branch_status: "COUNT_FREEZE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /part-orders/${order_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "PATCH /branches/${branch_a_id}"
              payload: { branch_status: "OPEN" }
              as: PlatformAdmin
            - call: "POST /part-orders/${order_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
          assert:
            - "trigger step 1 returns HTTP 409 with data.error_id == ERR_BRANCH_NOT_OPEN"
            - "after trigger step 1: PartOrder.${order_id}.fulfillment_status == DRAFT, OrderLine.${line_id}.line_status == RESOLVED, InventoryRecord.${inv_a_p1_id}.reserved_units == 0"
            - "trigger step 3 returns 200 and PartOrder.${order_id}.fulfillment_status == ALLOCATED"
            - "InventoryRecord.${inv_a_p1_id}.reserved_units == 2 and InventoryRecord.${inv_a_p1_id}.available_units == 8"
            - "PartOrder.${order_id}.subtotal_cents == 20798 and PartOrder.${order_id}.freight_cents == 0"
            - "ServicerAccount.${acct_s_id}.account_status == ACTIVE throughout"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: price_file_windows_are_half_open_so_adjacency_passes_and_enclosure_fails
        grounds:
          - calculations.price_window_reconciliation
          - validations[priority=36]
          - state_machines.PriceFile.DRAFT_to_PUBLISHED
          - errors[ERR_PRICE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_at, effective_until) over the shared resource
          Part P1's pricing timeline. A file starting exactly where the previous one ends is legal
          (zero gap, no shared instant), while a third file enclosed inside the first window
          collides and is refused with ERR_PRICE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Part P1 W10-PUMP, WHIRLPOOL, MECHANICAL, list 12999 — the only part any of the three price files touches."
            - "PriceFile F1 with file_version 2026-08-A, window [2026-08-01, 2026-09-01), one line setting P1 to 13000, published while the clock reads 2026-08-01."
            - "The clock is advanced to 2026-09-01 and PriceFile F2 with file_version 2026-09-A, window [2026-09-01, open-ended), one line setting P1 to 13500, is published — exact adjacency to F1, which keeps its explicit effective_until and stays PUBLISHED."
            - "PriceFile F3 with file_version 2026-08-B, window [2026-08-15, 2026-08-20), one line setting P1 to 14000, is prepared as DRAFT and sits entirely inside F1's window."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /price-files"
              payload: { file_version: "2026-08-A", effective_at: "2026-08-01T00:00:00Z", effective_until: "2026-09-01T00:00:00Z" }
              as: PricingAdmin
              captures: { pf_f1_id: $.data.id }
            - call: "POST /price-files/${pf_f1_id}/lines"
              payload: { part_id: "${part_p1_id}", new_list_price_cents: 13000 }
              as: PricingAdmin
            - call: "POST /price-files/${pf_f1_id}/publish"
              payload: {}
              as: PricingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-files"
              payload: { file_version: "2026-09-A", effective_at: "2026-09-01T00:00:00Z" }
              as: PricingAdmin
              captures: { pf_f2_id: $.data.id }
            - call: "POST /price-files/${pf_f2_id}/lines"
              payload: { part_id: "${part_p1_id}", new_list_price_cents: 13500 }
              as: PricingAdmin
            - call: "POST /price-files"
              payload: { file_version: "2026-08-B", effective_at: "2026-08-15T00:00:00Z", effective_until: "2026-08-20T00:00:00Z" }
              as: PricingAdmin
              captures: { pf_f3_id: $.data.id }
            - call: "POST /price-files/${pf_f3_id}/lines"
              payload: { part_id: "${part_p1_id}", new_list_price_cents: 14000 }
              as: PricingAdmin
          trigger:
            - call: "POST /price-files/${pf_f2_id}/publish"
              payload: {}
              as: PricingAdmin
            - call: "POST /price-files/${pf_f3_id}/publish"
              payload: {}
              as: PricingAdmin
          assert:
            - "trigger step 1 returns 200: adjacency at the shared instant 2026-09-01 is not a collision"
            - "PriceFile.${pf_f2_id}.price_file_status == PUBLISHED and effective_until == null"
            - "PriceFile.${pf_f1_id}.price_file_status == PUBLISHED and effective_until == 2026-09-01T00:00:00Z (its explicit end was not auto-closed)"
            - "after trigger step 1: Part.${part_p1_id}.list_price_cents == 13500"
            - "trigger step 2 returns HTTP 409 with data.error_id == ERR_PRICE_WINDOW_OVERLAP"
            - "PriceFile.${pf_f3_id}.price_file_status == DRAFT and published_at == null"
            - "after trigger step 2: Part.${part_p1_id}.list_price_cents == 13500 (the refused publish wrote nothing)"

      - name: certification_windows_are_closed_so_a_touching_endpoint_collides
        grounds:
          - calculations.cert_coverage_overlap
          - validations[priority=37]
          - entities.TechnicianCertification.fields.is_effective
          - errors[ERR_CERT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          The opposite interval semantics on a different resource entity: certification coverage is
          CLOSED [training_completed_at, expires_at] on the (account, technician, oem) triple, so a
          new certification starting on the incumbent's exact expires_at shares that instant and is
          refused, while starting one day later is accepted — the mirror image of the half-open
          price-window adjacency rule.
        test_recipe:
          setup:
            - "ServicerAccount on tier GOLD, NET_30, credit_limit_cents 10000000, authorized for WHIRLPOOL."
            - "Certification C1 for the triple (this account, Dana Ruiz, WHIRLPOOL) at cert_level ADVANCED covering the closed interval 2026-01-01 through 2026-06-01; cert_status is ACTIVE because only a tier-review sweep expires certifications."
            - "The clock stays at its 2026-08-01T00:00:00Z default, so C1's window has passed but its cert_status is still ACTIVE and therefore still collidable."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ruiz Appliance Service", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_r_id: $.data.id }
            - call: "POST /technician-certifications"
              payload: { servicer_account_id: "${acct_r_id}", technician_name: "Dana Ruiz", oem_code: "WHIRLPOOL", cert_level: "ADVANCED", training_completed_at: "2026-01-01T00:00:00Z", expires_at: "2026-06-01T00:00:00Z" }
              as: WarrantyAdmin
              captures: { cert_c1_id: $.data.id }
          trigger:
            - call: "POST /technician-certifications"
              payload: { servicer_account_id: "${acct_r_id}", technician_name: "Dana Ruiz", oem_code: "WHIRLPOOL", cert_level: "ADVANCED", training_completed_at: "2026-06-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /technician-certifications"
              payload: { servicer_account_id: "${acct_r_id}", technician_name: "Dana Ruiz", oem_code: "WHIRLPOOL", cert_level: "ADVANCED", training_completed_at: "2026-06-02T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: WarrantyAdmin
              captures: { cert_c3_id: $.data.id }
          assert:
            - "trigger step 1 returns HTTP 409 with data.error_id == ERR_CERT_WINDOW_OVERLAP (the shared instant 2026-06-01 is inside both closed intervals)"
            - "trigger step 2 returns 201 with TechnicianCertification.${cert_c3_id}.cert_status == ACTIVE"
            - "TechnicianCertification.${cert_c3_id}.is_effective == true (2026-06-02 <= 2026-08-01 <= 2027-01-01)"
            - "TechnicianCertification.${cert_c1_id}.cert_status == ACTIVE and is_effective == false"
            - "GET /technician-certifications?servicer_account_id=${acct_r_id}&technician_name=Dana Ruiz returns exactly 2 rows"
            - "GET /servicer-accounts/${acct_r_id}/credit-summary reports effective_cert_count == 1"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: core_deposit_liability_returns_to_zero_after_a_full_core_return
        grounds:
          - calculations.core_liability_balance
          - state_machines.ReturnAuthorization.RECEIVED_to_CREDITED
          - entities.ServicerAccount.fields.core_liability_cents
          - entities.ReturnAuthorization.fields.core_deposit_refund_cents
        distinguishing_aspect: |
          Conserved quantity #1 is core-deposit MONEY: 2 x 8500 == 17000 of deposit charged at
          shipment is released in full by the CORE_RETURN receipt, so core_liability_cents goes
          17000 -> 0 while the goods-side credit stays at 0 (a core return refunds a deposit, it
          does not credit the part price) and the open invoice of 593000 is untouched.
        test_recipe:
          setup:
            - "PricingTier GOLD; Branch STL; Part P2 W10-COMP, WHIRLPOOL, SEALED_SYSTEM, list 320000, weight 12000 g, core_required true, core_deposit_cents 8500."
            - "ServicerAccount on GOLD, NET_30, credit_limit_cents 10000000, core_liability_limit_cents 5000000, authorized for WHIRLPOOL, holding an effective WHIRLPOOL SEALED_SYSTEM certification."
            - "InventoryRecord (STL, P2) with on_hand_units 5."
            - "A WILL_CALL order for 2 units of P2 is credit-approved, allocated and fulfilled on 2026-08-01: unit 288000, extended 576000, core_deposit_total 17000, invoiced_total 593000, core_liability_cents 17000, on_hand_units down to 3."
            - "A CORE_RETURN authorization for both cores is requested on the same day (inside CORE_RETURN_WINDOW_DAYS) and approved, so gross_return_cents is 0 and no restocking fee applies."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-COMP", oem_code: "WHIRLPOOL", description: "Sealed system compressor", category: "SEALED_SYSTEM", list_price_cents: 320000, weight_grams: 12000, core_required: true, core_deposit_cents: 8500 }
              as: PricingAdmin
              captures: { part_p2_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Core Exchange Service", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_k_id: $.data.id }
            - call: "POST /technician-certifications"
              payload: { servicer_account_id: "${acct_k_id}", technician_name: "Sam Ortiz", oem_code: "WHIRLPOOL", cert_level: "SEALED_SYSTEM", training_completed_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p2_id}", on_hand_units: 5, reorder_point: 1 }
              as: PlatformAdmin
              captures: { inv_a_p2_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_k_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}" }
              as: Servicer
              as_user_id: "${acct_k_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p2_id}", quantity: 2, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_k_id}"
              captures: { line_id: $.data.id }
            - call: "POST /part-orders/${order_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "POST /part-orders/${order_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /part-orders/${order_id}/fulfill"
              payload: { tracking_ref: "WILLCALL-CORE" }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
            - call: "POST /return-authorizations"
              payload: { servicer_account_id: "${acct_k_id}", order_line_id: "${line_id}", quantity: 2, reason_code: "CORE_RETURN", return_branch_id: "${branch_a_id}" }
              as: Servicer
              as_user_id: "${acct_k_id}"
