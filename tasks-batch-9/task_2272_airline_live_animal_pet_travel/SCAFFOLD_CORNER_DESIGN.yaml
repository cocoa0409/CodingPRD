          - entities.AnimalRecord.fields.animal_kind
          - errors.ERR_BEHAVIOR_ATTESTATION_MISSING
        distinguishing_aspect: "A different precondition on the SAME transition, and one that only exists for SERVICE_ANIMAL records: the container is COMPLIANT so priority 26 passes, but behavior_attestation_on_file is false, giving 422 ERR_BEHAVIOR_ATTESTATION_MISSING - a PET record with identical measurements is marked travel-ready without an attestation."
