          assert:
            - "at 2026-08-17 (16 days > 15): status == CREDIT_HOLD (past-due sweep)"
            - "after full payment: balance == 0, order PAID, status == ACTIVE (no past-due invoices remain)"

  - section: consistency_model
    instances:
      - name: submit_response_reflects_reservation_immediately
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints[POST /pvf/orders/{id}/submit]"
        distinguishing_aspect: "Immediate consistency: the submit RESPONSE itself carries fulfillment_status OPEN and the recomputed totals — no re-read needed to observe the mutation."
        test_recipe:
          setup: ["GOLD account; P1 stock 3; order P1 x2 in DRAFT"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 3 }, as: WarehouseLead }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 2 }, as: CounterRep }
          trigger:
            - call: "POST /pvf/orders/${ord}/submit"
              payload: {}
              as: CounterRep
              captures: { fst: $.data.fulfillment_status, tot: $.data.total_cents, cubes: $.data.cubes_total }
          assert:
            - "response body: fulfillment_status == OPEN, total_cents == 20500 (18000 + 2500), cubes_total == 20 (2 allocated x 10)"

  - section: endpoints
    instances:
      - name: path_not_found_family_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_BRANCH_NOT_FOUND]"
          - "errors[ERR_QUOTE_NOT_FOUND]"
          - "errors[ERR_ORDER_LINE_NOT_FOUND]"
          - "errors[ERR_KIT_NOT_FOUND]"
          - "errors[ERR_SLOT_NOT_FOUND]"
          - "errors[ERR_RETURN_NOT_FOUND]"
          - "errors[ERR_PROGRAM_NOT_FOUND]"
          - "errors[ERR_SHEET_NOT_FOUND]"
        distinguishing_aspect: "Every resource family 404s on an unknown id with its own domain error id (order/account/product variants are covered by their own corner instances)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /pvf/branches/00000000-0000-0000-0000-000000000000", payload: {}, as: BranchManager, captures: { e1: $.data.error_id } }
            - { call: "GET /pvf/quotes/00000000-0000-0000-0000-000000000000", payload: {}, as: InsideSales, captures: { e2: $.data.error_id } }
            - { call: "GET /pvf/kits/00000000-0000-0000-0000-000000000000", payload: {}, as: WarehouseLead, captures: { e3: $.data.error_id } }
            - { call: "GET /pvf/delivery-slots/00000000-0000-0000-0000-000000000000", payload: {}, as: CounterRep, captures: { e4: $.data.error_id } }
            - { call: "GET /pvf/returns/00000000-0000-0000-0000-000000000000", payload: {}, as: CounterRep, captures: { e5: $.data.error_id } }
            - { call: "GET /pvf/manufacturer-programs/00000000-0000-0000-0000-000000000000", payload: {}, as: BranchManager, captures: { e6: $.data.error_id } }
            - { call: "GET /pvf/selection-sheets/00000000-0000-0000-0000-000000000000", payload: {}, as: InsideSales, captures: { e7: $.data.error_id } }
            - { call: "POST /pvf/order-lines/00000000-0000-0000-0000-000000000000/propose-substitute", payload: { substitute_product_id: "00000000-0000-0000-0000-000000000000" }, as: InsideSales, captures: { e8: $.data.error_id } }
          assert:
            - "ERR_BRANCH_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_KIT_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_RETURN_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_SHEET_NOT_FOUND — each with http 404"
            - "propose-substitute on unknown line: ERR_ORDER_LINE_NOT_FOUND 404 (path existence precedes body existence)"

      - name: product_duplicate_sku_rejected
        claim_type: type_constraints
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_SKU_EXISTS]"
        distinguishing_aspect: "Product.sku uniqueness: second create with the same sku -> ERR_SKU_EXISTS 409."
        test_recipe:
          setup: ["product P1 exists"]
          setup_api_calls:
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager }
          trigger:
            - call: "POST /pvf/products"
              payload: { sku: "P1", description: "Duplicate", category: "VALVE", list_price_cents: 100, cost_cents: 50, manufacturer_name: "Acme", cubes_per_unit: 1 }
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SKU_EXISTS with http 409"

      - name: slot_cancel_booked_rejected_empty_succeeds
        claim_type: conditional_action
        grounds:
          - "state_machines.DeliverySlot.OPEN_to_CANCELLED"
        distinguishing_aspect: "Conditional action: cancel works only with zero active bookings — empty slot cancels to CANCELLED; a slot holding a booking is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["slot1 (empty) and slot2 (holds order A's booking); order A submitted, version captured"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/branches/${b}/inventory", payload: { product_id: "${p1}", initial_on_hand: 5 }, as: WarehouseLead }
            - { call: "POST /pvf/branches/${b}/delivery-slots", payload: { truck_label: "T1", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", capacity_cubes: 100 }, as: BranchManager, captures: { s1: $.data.id } }
            - { call: "POST /pvf/branches/${b}/delivery-slots", payload: { truck_label: "T2", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", capacity_cubes: 100 }, as: BranchManager, captures: { s2: $.data.id } }
            - { call: "POST /pvf/orders", payload: { account_id: "${acct}", branch_id: "${b}" }, as: CounterRep, captures: { ord: $.data.id } }
            - { call: "POST /pvf/orders/${ord}/lines", payload: { product_id: "${p1}", qty: 1 }, as: CounterRep }
            - { call: "POST /pvf/orders/${ord}/submit", payload: {}, as: CounterRep, captures: { ov: $.data.version } }
            - { call: "POST /pvf/orders/${ord}/delivery-booking", payload: { slot_id: "${s2}", expected_order_version: "${ov}" }, as: CounterRep }
          trigger:
            - { call: "POST /pvf/delivery-slots/${s1}/cancel", payload: {}, as: BranchManager, captures: { st1: $.data.status } }
            - call: "POST /pvf/delivery-slots/${s2}/cancel"
              payload: {}
              as: BranchManager
              captures: { err: $.data.error_id }
          assert:
            - "empty slot: status == CANCELLED (200)"
            - "booked slot: error_id == ERR_INVALID_STATE with http 409; slot stays OPEN"
