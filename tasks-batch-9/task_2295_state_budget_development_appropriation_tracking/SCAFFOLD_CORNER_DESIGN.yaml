scaffold_corner_design:
  # ===========================================================================
  # Section 1 — Entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:
      - name: agency_creation_returns_201_with_every_declared_field
        claim_type: Creation
        grounds:
          - endpoints[POST /fiscal/agencies]
          - entities.Agency.fields.agency_code
          - entities.Agency.fields.federal_compliance_flag
        distinguishing_aspect: |
          Baseline create claim for the root entity: all three input fields are echoed back,
          the system-defaulted federal_compliance_flag is CLEAR, and the common fields
          (id, version, created_at, updated_at) are present on a 201.
        test_recipe:
          setup:
            - "Exactly one unrelated Agency DOE exists; no Agency with agency_code DOT exists"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOE", name: "Department of Education", agency_type: "EXECUTIVE" }
              as: SystemAdmin
          trigger:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
          assert:
            - "the POST returns HTTP 201 with response_type == \"object\""
            - "Agency.${ag_id}.agency_code == \"DOT\", name == \"Department of Transportation\", agency_type == EXECUTIVE"
            - "Agency.${ag_id}.federal_compliance_flag == CLEAR"
            - "Agency.${ag_id}.version == 1 and id, created_at, updated_at are all non-null"
            - "the response meta block carries api_request_id and api_request_timestamp"

      - name: budget_cycle_retrieval_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints[GET /fiscal/budget-cycles/{id}]
          - entities.BudgetCycle.fields.phase
          - entities.BudgetCycle.fields.required_reserve_cents
        distinguishing_aspect: |
          A read-after-write claim on BudgetCycle: GET returns exactly the persisted values
          including the zero-initialised derived counters, and does not recompute or bump
          version.
        test_recipe:
          setup:
            - "One BudgetCycle for fiscal_year 2027 starting 2026-07-01 with reserve_balance_cents 500000000 and constitutional_reserve_pct 0.05"
          setup_api_calls:
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "GET /fiscal/budget-cycles/${cyc_id}"
              payload: {}
              as: BudgetDirector
          assert:
            - "the GET returns HTTP 200 with response_type == \"object\""
            - "BudgetCycle.${cyc_id}.fiscal_year == 2027, phase == DEVELOPMENT, constitutional_reserve_pct == 0.05, reserve_balance_cents == 500000000"
            - "BudgetCycle.${cyc_id}.adopted_general_fund_revenue_cents == 0, required_reserve_cents == 0, total_recommended_cents == 0, balance_certified == false"
            - "BudgetCycle.${cyc_id}.total_released_cents == 0, total_expended_cents == 0, emergency_granted_cents == 0, cash_posture == NORMAL"
            - "BudgetCycle.${cyc_id}.version == 1, unchanged by the GET"

      - name: decision_package_listing_paginates_with_the_default_limit_of_ten
        claim_type: Listing
        grounds:
          - endpoints[GET /fiscal/decision-packages]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Pagination envelope claim on a 12-row collection: the default page carries exactly
          10 rows with total_count 12 and has_more true, and offset 10 carries the remaining
          2 rows with has_more false.
        test_recipe:
          setup:
            - "Agency DOT and BudgetCycle 2027 in phase DEVELOPMENT"
            - "One DRAFT AgencyRequest with base_budget_cents 1000000000"
            - "Twelve TECHNICAL DecisionPackages on that request at priority_rank 1..12 with amount_cents 1000000..12000000"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 1, amount_cents: 1000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 2, amount_cents: 2000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 3, amount_cents: 3000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 4, amount_cents: 4000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 5, amount_cents: 5000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 6, amount_cents: 6000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 7, amount_cents: 7000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 8, amount_cents: 8000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 9, amount_cents: 9000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 10, amount_cents: 10000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 11, amount_cents: 11000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 12, amount_cents: 12000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
          trigger:
            - call: "GET /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}" }
              as: BudgetAnalyst
            - call: "GET /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", limit: 10, offset: 10 }
              as: BudgetAnalyst
          assert:
            - "the first GET returns HTTP 200 with response_type == \"array\" and exactly 10 rows"
            - "the first GET reports limit == 10, offset == 0, total_count == 12, has_more == true"
            - "the second GET returns exactly 2 rows with limit == 10, offset == 10, total_count == 12, has_more == false"
            - "every returned row has agency_request_id == \"${req_id}\" and status == PROPOSED"

      - name: path_id_lookups_with_unknown_ids_return_the_resource_specific_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_AGENCY_NOT_FOUND]
          - errors[ERR_BUDGET_CYCLE_NOT_FOUND]
          - errors[ERR_AGENCY_REQUEST_NOT_FOUND]
          - errors[ERR_DECISION_PACKAGE_NOT_FOUND]
          - errors[ERR_APPROPRIATION_NOT_FOUND]
          - errors[ERR_ALLOTMENT_NOT_FOUND]
          - errors[ERR_FEDERAL_GRANT_NOT_FOUND]
          - errors[ERR_MATCH_COMMITMENT_NOT_FOUND]
        distinguishing_aspect: |
          Priority-3 path-existence check on the GET surface: each single-row GET maps an
          unknown UUID to its OWN resource-specific 404 error_id rather than to a shared
          generic not-found code.
        test_recipe:
          setup:
            - "Only one unrelated Agency DOT exists; no BudgetCycle, AgencyRequest, DecisionPackage, Appropriation, Allotment, FederalGrant or MatchCommitment has ever been created"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
          trigger:
            - call: "GET /fiscal/agencies/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: SystemAdmin
            - call: "GET /fiscal/budget-cycles/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: BudgetDirector
            - call: "GET /fiscal/agency-requests/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: BudgetAnalyst
            - call: "GET /fiscal/decision-packages/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: BudgetAnalyst
            - call: "GET /fiscal/appropriations/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "GET /fiscal/allotments/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: StateController
            - call: "GET /fiscal/federal-grants/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: BudgetAnalyst
            - call: "GET /fiscal/match-commitments/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: BudgetAnalyst
          assert:
            - "every one of the eight GETs returns HTTP 404 with response_type == \"error\""
            - "GET /fiscal/agencies/... returns error_id == ERR_AGENCY_NOT_FOUND"
            - "GET /fiscal/budget-cycles/... returns error_id == ERR_BUDGET_CYCLE_NOT_FOUND"
            - "GET /fiscal/agency-requests/... returns error_id == ERR_AGENCY_REQUEST_NOT_FOUND"
            - "GET /fiscal/decision-packages/... returns error_id == ERR_DECISION_PACKAGE_NOT_FOUND"
            - "GET /fiscal/appropriations/... returns error_id == ERR_APPROPRIATION_NOT_FOUND"
            - "GET /fiscal/allotments/... returns error_id == ERR_ALLOTMENT_NOT_FOUND"
            - "GET /fiscal/federal-grants/... returns error_id == ERR_FEDERAL_GRANT_NOT_FOUND"
            - "GET /fiscal/match-commitments/... returns error_id == ERR_MATCH_COMMITMENT_NOT_FOUND"

      - name: action_endpoints_with_unknown_path_ids_return_not_found_before_any_state_check
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_REVENUE_FORECAST_NOT_FOUND]
          - errors[ERR_RECOMMENDATION_NOT_FOUND]
          - errors[ERR_TRANSFER_NOT_FOUND]
          - errors[ERR_EXPENDITURE_NOT_FOUND]
        distinguishing_aspect: |
          Complements the GET-surface not-found claim by covering the four entities that
          have no single-row GET: their 404 is only reachable through an action endpoint,
          and priority 3 must fire before the priority-11 state check that would otherwise
          have nothing to inspect.
        test_recipe:
          setup:
            - "Only one unrelated Agency DOT exists; no RevenueForecast, ExecutiveRecommendation, BudgetTransfer or Expenditure has ever been created"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
          trigger:
            - call: "POST /fiscal/revenue-forecasts/00000000-0000-4000-8000-000000000011/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/executive-recommendations/00000000-0000-4000-8000-000000000012/approve"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-transfers/00000000-0000-4000-8000-000000000013/approve"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/expenditures/00000000-0000-4000-8000-000000000014/void"
              payload: { reason: "wrong appropriation" }
              as: StateController
          assert:
            - "all four calls return HTTP 404 with response_type == \"error\""
            - "the adopt call returns error_id == ERR_REVENUE_FORECAST_NOT_FOUND"
            - "the recommendation approve call returns error_id == ERR_RECOMMENDATION_NOT_FOUND"
            - "the transfer approve call returns error_id == ERR_TRANSFER_NOT_FOUND"
            - "the expenditure void call returns error_id == ERR_EXPENDITURE_NOT_FOUND"
            - "no ERR_INVALID_STATE is returned by any of the four calls, proving priority 3 precedes priority 11"

      - name: budget_cycle_create_without_fiscal_year_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /fiscal/budget-cycles]
        distinguishing_aspect: |
          Required-field claim on the one non-optional numeric input of the cycle create
          endpoint: omitting fiscal_year (which has no default) is a priority-6 body-shape
          failure, distinct from the priority-7 sign check that would reject a present but
          illegal value.
        test_recipe:
          setup:
            - "Only one unrelated Agency DOT exists; no BudgetCycle has been created yet"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
          trigger:
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
          assert:
            - "the POST returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "no BudgetCycle row is created: GET /fiscal/budget-cycles/{any id} still has nothing to return"

      - name: allotment_create_omitting_allow_partial_defaults_it_to_false
        claim_type: Defaults
        grounds:
          - entities.Allotment.fields.allow_partial
          - endpoints[POST /fiscal/allotments]
          - validations[priority=39]
        distinguishing_aspect: |
          Default-value claim with an observable consequence rather than a bare field echo:
          omitting allow_partial persists false, so a prepare whose ceiling of 440000000
          falls short of the requested 500000000 is rejected with ERR_ALLOTMENT_EXCEEDS_CEILING
          instead of being silently trimmed.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 driven to phase EXECUTION with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 enacted 2000000000, so the quarter-1 cap is 440000000"
            - "Logical clock at the default 2026-08-01T00:00:00Z (quarter 1)"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
          trigger:
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_id}", quarter: 1, requested_cents: 500000000 }
              as: BudgetAnalyst
              captures: { allot_id: $.data.id }
            - call: "POST /fiscal/allotments/${allot_id}/prepare"
              payload: {}
              as: BudgetAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the POST returns HTTP 201 with Allotment.${allot_id}.allow_partial == false, applied as the declared default"
            - "Allotment.${allot_id}.status == DRAFT, computed_release_cents == 0, binding_constraint == null on creation"
            - "the prepare returns HTTP 422 with error_id == ERR_ALLOTMENT_EXCEEDS_CEILING because the ceiling of 440000000 is below the requested 500000000"
            - "Allotment.${allot_id}.status is still DRAFT and computed_release_cents is still 0"

      - name: agency_request_total_request_cents_is_computed_and_client_input_ignored
        claim_type: Computed Fields
        grounds:
          - calculations.agency_request_total
          - entities.AgencyRequest.fields.total_request_cents
          - endpoints[POST /fiscal/agency-requests]
        distinguishing_aspect: |
          Computed-field claim: total_request_cents is never accepted from the client — a
          supplied value is discarded and the field tracks base_budget_cents plus additive
          minus subtractive packages, moving from 1000000000 to 1300000000 to 1100000000 as
          packages are added.
        test_recipe:
          setup:
            - "Agency DOT and BudgetCycle 2027 in phase DEVELOPMENT"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 1, amount_cents: 300000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "REDUCTION", priority_rank: 2, amount_cents: 200000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
          assert:
            - "AgencyRequest.${req_id}.total_request_cents == 1000000000 immediately after create, equal to base_budget_cents with no packages"
            - "after the submit recomputation: AgencyRequest.${req_id}.total_request_cents == 1100000000, from 1000000000 + 300000000 - 200000000"
            - "AgencyRequest.${req_id}.base_budget_cents is still 1000000000, untouched by the recomputation"
            - "AgencyRequest.${req_id}.status == SUBMITTED and revision_count == 0"

      - name: agency_system_fields_are_server_generated_and_client_values_are_ignored_input
        claim_type: System Fields
        grounds:
          - entities.Agency.fields.federal_compliance_flag
          - endpoints[POST /fiscal/agencies]
          - response_envelope.success
        distinguishing_aspect: |
          System-field claim: id, version, created_at, updated_at and the system-sourced
          federal_compliance_flag are all minted by the server, so a create that supplies
          them is not honoured — the persisted flag is CLEAR and version is 1 regardless of
          what the body claimed.
        test_recipe:
          setup:
            - "One Agency DOE exists; no Agency with agency_code DOT exists"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOE", name: "Department of Education", agency_type: "EXECUTIVE" }
              as: SystemAdmin
          trigger:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE", federal_compliance_flag: "DEFICIENT", version: 99, id: "00000000-0000-4000-8000-0000000000ff" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
          assert:
            - "the POST returns HTTP 201 (unknown/system fields are ignored, not rejected) OR HTTP 400 with error_id == ERR_INVALID_REQUEST if the implementation rejects unknown body fields — the scaffold pins the former"
            - "Agency.${ag_id}.id != \"00000000-0000-4000-8000-0000000000ff\""
            - "Agency.${ag_id}.federal_compliance_flag == CLEAR, not DEFICIENT"
            - "Agency.${ag_id}.version == 1, not 99"
            - "Agency.${ag_id}.created_at and updated_at are server timestamps equal to the logical clock 2026-08-01T00:00:00Z"

      - name: agency_create_with_an_unknown_agency_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=6]
          - entities.Agency.fields.agency_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Enum-membership claim: agency_type is constrained to
          EXECUTIVE|JUDICIAL|LEGISLATIVE|HIGHER_ED, and a value outside that set is a
          priority-6 body-shape rejection at 400 — not a 422 domain error and not silently
          coerced.
        test_recipe:
          setup:
            - "One Agency DOE exists; no Agency with agency_code DOT exists"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOE", name: "Department of Education", agency_type: "EXECUTIVE" }
              as: SystemAdmin
          trigger:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "QUASI_PUBLIC" }
              as: SystemAdmin
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "HIGHER_ED" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
          assert:
            - "the first POST returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "the second POST returns HTTP 201 with Agency.${ag_id}.agency_type == HIGHER_ED, proving the legal member of the same enum is accepted"

      - name: committee_action_is_immutable_with_no_version_field_and_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.CommitteeAction.common_fields
          - endpoints[GET /fiscal/appropriations/{id}/committee-actions]
          - calculations.committee_running_balance
        distinguishing_aspect: |
          Immutability claim for a common_fields:false entity: CommitteeAction exposes no
          version field and §1.5 declares no update or delete route for it, so history is
          corrected only by appending a further action — yet its derived
          running_balance_cents IS rewritten by the replay when a lower sequence_number
          arrives later.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 advanced to phase LEGISLATIVE with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 introduced 2000000000 with one DECREASE action of 500000000 at sequence_number 2"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/committee-actions"
              payload: { appropriation_id: "${appr_id}", chamber: "HOUSE", committee_name: "House Appropriations", action_type: "DECREASE", amount_cents: 500000000, sequence_number: 2 }
              as: LegislativeFiscalOfficer
              captures: { act2_id: $.data.id }
          trigger:
            - call: "GET /fiscal/appropriations/${appr_id}/committee-actions"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/committee-actions"
              payload: { appropriation_id: "${appr_id}", chamber: "SENATE", committee_name: "Senate Finance", action_type: "SET", amount_cents: 1000000000, sequence_number: 1 }
              as: LegislativeFiscalOfficer
              captures: { act1_id: $.data.id }
            - call: "GET /fiscal/appropriations/${appr_id}/committee-actions"
              payload: {}
              as: LegislativeFiscalOfficer
          assert:
            - "CommitteeAction rows carry no version field, and §1.5 declares no PATCH/PUT/DELETE route for /fiscal/committee-actions"
            - "before the insert: CommitteeAction.${act2_id}.running_balance_cents == 1500000000 and Appropriation.${appr_id}.committee_balance_cents == 1500000000"
            - "after inserting sequence_number 1: CommitteeAction.${act1_id}.running_balance_cents == 1000000000"
            - "after inserting sequence_number 1: CommitteeAction.${act2_id}.running_balance_cents == 500000000, rewritten by the full replay even though the row itself is immutable"
            - "Appropriation.${appr_id}.committee_balance_cents == 500000000 and introduced_amount_cents is still 2000000000"

      - name: body_fk_references_are_validated_in_declaration_order_and_return_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_BUDGET_CYCLE_NOT_FOUND]
          - errors[ERR_AGENCY_NOT_FOUND]
          - errors[ERR_AGENCY_REQUEST_NOT_FOUND]
          - entities.DecisionPackage.fields.agency_request_id
        distinguishing_aspect: |
          Priority-4 body-FK check with a pinned evaluation order: POST /fiscal/agency-requests
          declares budget_cycle_id before agency_id, so when BOTH are unknown the response is
          ERR_BUDGET_CYCLE_NOT_FOUND and never ERR_AGENCY_NOT_FOUND; a child create with an
          unknown parent returns the parent's own 404.
        test_recipe:
          setup:
            - "Agency DOT and BudgetCycle 2027 both exist, so each FK can be independently made valid or invalid"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "00000000-0000-4000-8000-000000000021", agency_id: "00000000-0000-4000-8000-000000000022", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "00000000-0000-4000-8000-000000000022"
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "00000000-0000-4000-8000-000000000022", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "00000000-0000-4000-8000-000000000022"
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "00000000-0000-4000-8000-000000000023", package_type: "TECHNICAL", priority_rank: 1, amount_cents: 1000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
          assert:
            - "the first POST returns HTTP 404 with error_id == ERR_BUDGET_CYCLE_NOT_FOUND, the first FK in the endpoint's declared input order"
            - "the second POST returns HTTP 404 with error_id == ERR_AGENCY_NOT_FOUND once the cycle FK resolves"
            - "the decision-package POST returns HTTP 404 with error_id == ERR_AGENCY_REQUEST_NOT_FOUND"
            - "no AgencyRequest and no DecisionPackage row is persisted by any of the three calls"

      - name: appropriation_program_code_uniqueness_is_scoped_to_cycle_and_agency
        claim_type: Parent Relationships
        grounds:
          - validations[priority=29]
          - errors[ERR_DUPLICATE_CODE]
          - entities.Appropriation.fields.program_code
        distinguishing_aspect: |
          Flat-topology cross-reference integrity claim: program_code is unique only within
          the (budget_cycle_id, agency_id) pair, so the same code P100 is rejected with
          ERR_DUPLICATE_CODE for the same agency in the same cycle yet accepted for a second
          agency in that very same cycle.
        test_recipe:
          setup:
            - "Agencies DOH and DOE; BudgetCycle 2027 advanced to phase LEGISLATIVE with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 already exists for DOH in that cycle"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag1_id: $.data.id }
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOE", name: "Department of Education", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag2_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag1_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 1000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr1_id: $.data.id }
          trigger:
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag1_id}", fund_type: "DEDICATED", program_code: "P100", introduced_amount_cents: 400000000 }
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag2_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 400000000 }
              as: LegislativeFiscalOfficer
              captures: { appr2_id: $.data.id }
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Duplicate Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
          assert:
            - "the first POST returns HTTP 409 with error_id == ERR_DUPLICATE_CODE even though fund_type differs, because fund_type is not part of the uniqueness key"
            - "the second POST returns HTTP 201 with Appropriation.${appr2_id}.program_code == \"P100\" and agency_id == \"${ag2_id}\""
            - "the duplicate agency POST returns HTTP 409 with error_id == ERR_DUPLICATE_CODE, showing the same error covers global agency_code uniqueness"
            - "Appropriation.${appr1_id}.authority_status == PENDING and committee_balance_cents == 1000000000, untouched by the rejected create"

  # ===========================================================================
  # Section 2 — State Machines (§1.2)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: agency_request_submit_moves_draft_to_submitted
        claim_type: Valid Transition
        grounds:
          - state_machines.AgencyRequest.DRAFT_to_SUBMITTED
          - entities.AgencyRequest.fields.status
          - endpoints[POST /fiscal/agency-requests/{id}/submit]
        distinguishing_aspect: |
          Happy-path transition claim: with every precondition satisfied (status DRAFT, cycle
          in DEVELOPMENT, X-User-ID equal to agency_id, no EXPANSION package outstanding) the
          submit returns 200 and the row is SUBMITTED with revision_count still 0.
        test_recipe:
          setup:
            - "Agency DOT and BudgetCycle 2027 in phase DEVELOPMENT"
            - "One DRAFT AgencyRequest with base_budget_cents 1000000000 and one TECHNICAL package of 300000000 (no EXPANSION package, so no PerformanceMeasure is required)"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 1, amount_cents: 300000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
          assert:
            - "the submit returns HTTP 200"
            - "AgencyRequest.${req_id}.status == SUBMITTED"
            - "AgencyRequest.${req_id}.revision_count == 0 and last_return_reason == null"
            - "AgencyRequest.${req_id}.total_request_cents == 1300000000, recomputed by the submit side effect"
            - "AgencyRequest.${req_id}.version == 2, bumped exactly once by the transition"

      - name: agency_request_submit_with_an_unmeasured_expansion_package_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AgencyRequest.DRAFT_to_SUBMITTED
          - validations[priority=20]
          - errors[ERR_PERFORMANCE_MEASURE_REQUIRED]
        distinguishing_aspect: |
          Isolates the fourth precondition of DRAFT->SUBMITTED: status, phase and scope are
          all satisfied, and only the missing PerformanceMeasure on the EXPANSION package
          fails, so the response is ERR_PERFORMANCE_MEASURE_REQUIRED and the row stays DRAFT.
          Adding the measure makes the identical call succeed.
        test_recipe:
          setup:
            - "Agency DOT and BudgetCycle 2027 in phase DEVELOPMENT"
            - "One DRAFT AgencyRequest with base_budget_cents 1000000000 carrying one EXPANSION package of 400000000 and no PerformanceMeasure"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "EXPANSION", priority_rank: 1, amount_cents: 400000000, fte_delta: 5 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/performance-measures"
              payload: { decision_package_id: "${pkg_id}", measure_code: "LANE_MILES", unit: "COUNT", baseline_value: 100, target_value: 140 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
          assert:
            - "the first submit returns HTTP 422 with error_id == ERR_PERFORMANCE_MEASURE_REQUIRED"
            - "AgencyRequest.${req_id}.status is still DRAFT and total_request_cents is still 1000000000 after the rejected submit"
            - "the second submit returns HTTP 200 with AgencyRequest.${req_id}.status == SUBMITTED"
            - "AgencyRequest.${req_id}.total_request_cents == 1400000000 after the successful submit"

      - name: forecast_adopt_side_effects_write_cycle_revenue_and_required_reserve
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RevenueForecast.DRAFT_to_ADOPTED
          - calculations.cycle_balance_certification
          - entities.BudgetCycle.fields.adopted_general_fund_revenue_cents
          - entities.BudgetCycle.fields.required_reserve_cents
        distinguishing_aspect: |
          Every declared side effect of the adopt transition is observed on the parent cycle
          in the same request: adopted_general_fund_revenue_cents 0 -> 7000000000,
          required_reserve_cents 0 -> 350000000 (round_half_up of 0.05 * 7000000000), and the
          cycle version bump that later invalidates a stale OCC token.
        test_recipe:
          setup:
            - "BudgetCycle 2027 in phase DEVELOPMENT with constitutional_reserve_pct 0.05"
            - "One DRAFT GENERAL RevenueForecast of 7000000000 cents and one DRAFT DEDICATED RevenueForecast of 900000000 cents"
          setup_api_calls:
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v0: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 7000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v0}" }
              as: BudgetAnalyst
              captures: { fc_gen_id: $.data.id }
            - call: "GET /fiscal/budget-cycles/${cyc_id}"
              payload: {}
              as: BudgetAnalyst
              captures: { cyc_v1: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "TOLL_RECEIPTS", fund_type: "DEDICATED", forecast_round: "CONSENSUS_SPRING", amount_cents: 900000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v1}" }
              as: BudgetAnalyst
              captures: { fc_ded_id: $.data.id }
          trigger:
            - call: "POST /fiscal/revenue-forecasts/${fc_gen_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/revenue-forecasts/${fc_ded_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "GET /fiscal/budget-cycles/${cyc_id}/revenue-forecasts"
              payload: { status: "ADOPTED" }
              as: BudgetDirector
          assert:
            - "RevenueForecast.${fc_gen_id}.status == ADOPTED and RevenueForecast.${fc_ded_id}.status == ADOPTED"
            - "BudgetCycle.${cyc_id}.adopted_general_fund_revenue_cents == 7000000000 — the DEDICATED forecast is excluded from the GENERAL-fund total"
            - "BudgetCycle.${cyc_id}.required_reserve_cents == 350000000, round_half_up(0.05 * 7000000000)"
            - "BudgetCycle.${cyc_id}.balance_certified == false — adoption alone never certifies"
            - "the filtered list returns exactly 2 rows with total_count == 2"

      - name: agency_request_accept_from_draft_is_rejected_as_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.AgencyRequest.UNDER_REVIEW_to_ACCEPTED
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Invalid-transition claim on the trigger that is NOT declared from DRAFT: accept is
          only declared from UNDER_REVIEW, so calling it on a DRAFT row returns
          ERR_INVALID_STATE at 409 with no version bump and no total recomputation, even
          though the acting role and cycle phase are both legal.
        test_recipe:
          setup:
            - "Agency DOT and BudgetCycle 2027 in phase DEVELOPMENT"
            - "One AgencyRequest still in DRAFT with base_budget_cents 1000000000"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /fiscal/agency-requests/${req_id}/accept"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/return-for-revision"
              payload: { reason: "insufficient detail" }
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/begin-review"
              payload: {}
              as: BudgetAnalyst
          assert:
            - "the accept returns HTTP 409 with error_id == ERR_INVALID_STATE"
            - "the return-for-revision returns HTTP 409 with error_id == ERR_INVALID_STATE"
            - "the begin-review returns HTTP 409 with error_id == ERR_INVALID_STATE because begin-review is declared only from SUBMITTED"
            - "AgencyRequest.${req_id}.status is still DRAFT, revision_count == 0, last_return_reason == null, version == 1"

      - name: newly_created_budget_cycle_starts_in_development_phase
        claim_type: Initial State
        grounds:
          - state_machines.BudgetCycle.initial_state
          - entities.BudgetCycle.fields.phase
          - entities.BudgetCycle.fields.cash_posture
        distinguishing_aspect: |
          Initial-state claim covering both the phase dimension and the derived counters: a
          fresh cycle is in DEVELOPMENT with cash_posture NORMAL, and an attempt to jump
          straight past EXECUTIVE_PREP to LEGISLATIVE is refused, proving DEVELOPMENT is the
          true entry point and not merely a default label.
        test_recipe:
          setup:
            - "One BudgetCycle for fiscal_year 2027 with no forecast, request or appropriation attached"
          setup_api_calls:
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "GET /fiscal/budget-cycles/${cyc_id}"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
          assert:
            - "BudgetCycle.${cyc_id}.phase == DEVELOPMENT immediately after creation"
            - "BudgetCycle.${cyc_id}.cash_posture == NORMAL and cash_utilization_pct == 0"
            - "BudgetCycle.${cyc_id}.balance_certified == false and emergency_granted_cents == 0"
            - "the advance-phase to LEGISLATIVE returns HTTP 409 with error_id == ERR_CYCLE_PHASE_INVALID"
            - "BudgetCycle.${cyc_id}.phase is still DEVELOPMENT after the rejected advance"

      - name: closed_budget_cycle_refuses_every_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.BudgetCycle.EXECUTION_to_CLOSED
          - validations[priority=23]
          - errors[ERR_CYCLE_NOT_ENDED]
          - calculations.reversion_carryforward_split
          - state_machines.Appropriation.AUTHORITY_ENACTED_to_AUTHORITY_CLOSED
        distinguishing_aspect: |
          Terminal-state claim that also pins the temporal guard on entering it: close at the
          default clock is refused with ERR_CYCLE_NOT_ENDED, close at exactly
          2027-07-01T00:00:00Z (fiscal_year_start_date + 12 months, the inclusive boundary)
          succeeds, and every subsequent advance-phase against the CLOSED cycle is refused.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 starting 2026-07-01 driven to phase EXECUTION with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 enacted 2000000000 with nothing released and nothing expended"
            - "Logical clock at the default 2026-08-01T00:00:00Z, eleven months short of the close boundary"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
