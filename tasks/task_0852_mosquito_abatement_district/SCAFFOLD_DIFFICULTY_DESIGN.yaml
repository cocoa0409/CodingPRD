  - rule_id: compensating_invariant
    instances:
      - name: pesticide_millilitre_partition_unchanged_by_commit_then_release
        grounds:
          - calculations.pesticide_inventory_partition
          - state_machines.TreatmentRoute.PLANNED_to_COMMITTED
          - state_machines.TreatmentRoute.COMMITTED_to_RELEASED
          - entities.PesticideProduct.fields.received_total_ml
        distinguishing_aspect: |
          Conserved quantity #1 is MATERIAL VOLUME in millilitres: the identity
          on_hand_ml + committed_ml + applied_ml == received_total_ml must read
          100000.00 both before COMMIT (100000.00 + 0.00 + 0.00) and after the
          compensating RELEASE, with the intermediate state showing 99900.00 + 100.00
          + 0.00 — no drift of even 0.01 ml, and Applicator.assigned_route_count and
          TreatmentPlan.estimated_total_ml also return to their pre-COMMIT values.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 with a CONFIRMED assessment of index 0.00."
            - "One BTI / LARVICIDE product at 100.0 ml/acre with received_total_ml 100000.00, on_hand 100000.00, committed 0.00, applied 0.00."
            - "An APPROVED LARVICIDE plan with one PLANNED route of 1.00 acre."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
