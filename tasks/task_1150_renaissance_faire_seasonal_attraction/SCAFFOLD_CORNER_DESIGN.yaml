          rationale: "These error ids are asserted as the failure paths of §1.8 instances group_min_size_exact_threshold, refund_money_invariant_retained_plus_refunded, raincheck_redeem_by_inclusive_date, weather_cancellation_cascade_shift_hours_posture, faire_day_sales_gated_by_season_posture, booth_confirm_gated_by_food_permit, rehearsal_stage_buffered_overlap, booth_site_unbuffered_adjacency."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: performer_cannot_offer_contract
        claim_type: role_denied
        grounds: ["roles[Performer]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "offer is CastDirector-exclusive; a Performer caller is rejected with ERR_UNAUTHORIZED_ROLE (403)."
        test_recipe:
          setup: ["Season PLANNING; contract DRAFT owned by the calling performer"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "RBAC Revel A", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /performers", payload: { stage_name: "Quinn", act_type: "ROVING", base_day_rate_cents: 8000 }, as: CastDirector, captures: { p_id: $.data.id } }
            - { call: "POST /cast-contracts", payload: { season_id: "${s_id}", performer_id: "${p_id}", offered_day_rate_cents: 8000, guaranteed_days: 1, weather_pay_pct: 0.5, required_rehearsal_hours: 0 }, as: CastDirector, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /cast-contracts/${c_id}/offer", payload: {}, as: Performer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403); contract remains DRAFT"

      - name: vendor_cannot_decide_own_application
        claim_type: role_denied
        grounds: ["roles[VendorCoordinator]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "decide is VendorCoordinator-exclusive; the applicant Vendor is rejected with ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Season PLANNING; vendor with application in JURY_REVIEW"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "RBAC Revel B", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /vendors", payload: { business_name: "Rope Makers", category: "ARTISAN" }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 64, requested_location_tier: "MEADOW" }, as: Vendor, as_user_id: "${v_id}", captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /vendor-applications/${a_id}/decide", payload: { craft_score: 10, authenticity_score: 10, safety_score: 10, outcome: "JURIED_IN" }, as: Vendor, as_user_id: "${v_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403); application remains JURY_REVIEW"

      - name: guest_cannot_refund_order
        claim_type: role_denied
        grounds: ["roles[GateAgent]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "refund is GateAgent-exclusive; the buyer Guest is rejected with ERR_UNAUTHORIZED_ROLE even on their own order."
        test_recipe:
          setup: ["Season BUILD; day OPEN_FOR_SALES; order PAID"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "RBAC Revel C", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 1, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-rbac@x.com", captures: { o1: $.data.id } }
            - { call: "POST /ticket-orders/${o1}/pay", payload: {}, as: Guest, as_user_id: "g-rbac@x.com" }
          trigger:
            - { call: "POST /ticket-orders/${o1}/refund", payload: { refund_cents: 500 }, as: Guest, as_user_id: "g-rbac@x.com", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403); refunded_cents remains 0"

      - name: performer_cannot_accept_others_contract
        claim_type: role_denied
        grounds: ["roles[Performer]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Entity-backed ownership: a Performer whose X-User-ID differs from contract.performer_id is rejected with ERR_NOT_RESOURCE_OWNER (403) even though the role is endpoint-allowed."
        test_recipe:
          setup: ["Season PLANNING; contract OFFERED belonging to performer A; performer B exists"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "RBAC Revel D", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /performers", payload: { stage_name: "Rosa", act_type: "MUSIC", base_day_rate_cents: 8000 }, as: CastDirector, captures: { pa: $.data.id } }
            - { call: "POST /performers", payload: { stage_name: "Stefan", act_type: "COMBAT", base_day_rate_cents: 8500 }, as: CastDirector, captures: { pb: $.data.id } }
            - { call: "POST /cast-contracts", payload: { season_id: "${s_id}", performer_id: "${pa}", offered_day_rate_cents: 8000, guaranteed_days: 1, weather_pay_pct: 0.5, required_rehearsal_hours: 0 }, as: CastDirector, captures: { c_id: $.data.id } }
            - { call: "POST /cast-contracts/${c_id}/offer", payload: {}, as: CastDirector }
          trigger:
            - { call: "POST /cast-contracts/${c_id}/accept", payload: {}, as: Performer, as_user_id: "${pb}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_RESOURCE_OWNER (403); contract remains OFFERED"

      - name: volunteer_shift_cancel_ownership
        claim_type: role_denied
        grounds: ["roles[Volunteer]", "roles[VolunteerCoordinator]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Volunteer cancel is a shared operation with an ownership clause: a different volunteer is denied (ERR_NOT_RESOURCE_OWNER) while the owner and the VolunteerCoordinator both succeed."
        test_recipe:
          setup: ["Season PLANNING; day SCHEDULED; two shifts: sh1 by vol-m, sh2 by vol-n"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "RBAC Revel E", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "GATE", start_time: "2026-06-06T08:00:00Z", end_time: "2026-06-06T12:00:00Z" }, as: Volunteer, as_user_id: "vol-m", captures: { sh1: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "INFO", start_time: "2026-06-06T12:00:00Z", end_time: "2026-06-06T16:00:00Z" }, as: Volunteer, as_user_id: "vol-n", captures: { sh2: $.data.id } }
          trigger:
            - { call: "POST /volunteer-shifts/${sh1}/cancel", payload: {}, as: Volunteer, as_user_id: "vol-n", captures: { err: $.data.error_id } }
            - { call: "POST /volunteer-shifts/${sh1}/cancel", payload: {}, as: Volunteer, as_user_id: "vol-m", captures: { sh1_st: $.data.status } }
            - { call: "POST /volunteer-shifts/${sh2}/cancel", payload: {}, as: VolunteerCoordinator, captures: { sh2_st: $.data.status } }
          assert:
            - "Cancel by non-owner volunteer: ERR_NOT_RESOURCE_OWNER (403)"
            - "Cancel by owner: CANCELLED; cancel by VolunteerCoordinator (shared): CANCELLED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_season_config_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[season-config-stale-edit]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /seasons/{id} carries expected_season_version: a correct version succeeds and bumps version (1 -> 2); replaying the stale version is rejected with ERR_STALE_VERSION (412) even though the season is still PLANNING and the edit would otherwise be valid."
        test_recipe:
          setup: ["Season PLANNING at version 1"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "OCC Revel A", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id, s_v: $.data.version }
          trigger:
            - { call: "PATCH /seasons/${s_id}", payload: { expected_season_version: "${s_v}", daily_capacity: 600 }, as: FaireOperator, captures: { cap2: $.data.daily_capacity, v2: $.data.version } }
            - { call: "PATCH /seasons/${s_id}", payload: { expected_season_version: "${s_v}", group_min_size: 12 }, as: FaireOperator, captures: { err: $.data.error_id } }
            - { call: "GET /seasons/${s_id}", payload: {}, as: Any, captures: { gms: $.data.group_min_size } }
          assert:
            - "First patch: daily_capacity == 600, version == 2"
            - "Replayed stale version: ERR_STALE_VERSION (412); group_min_size remains 10"

      - name: occ_order_reprice_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-reprice-stale-edit]", "errors[ERR_STALE_VERSION]", calculations.ticket_order_total]
        distinguishing_aspect: "PATCH /ticket-orders/{id} on an UNPAID order carries expected_order_version: a correct version reprices (qty 4 -> 12600) and bumps version; the stale replay is rejected with ERR_STALE_VERSION and does not reprice."
        test_recipe:
          setup: ["Season BUILD; day 06-06 OPEN_FOR_SALES; DAY order qty3 unit 3000 UNPAID at version 1 (total 9450)"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "OCC Revel B", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 3, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-occ@x.com", captures: { o1: $.data.id, o_v: $.data.version } }
          trigger:
            - { call: "PATCH /ticket-orders/${o1}", payload: { expected_order_version: "${o_v}", quantity: 4 }, as: Guest, as_user_id: "g-occ@x.com", captures: { tot2: $.data.total_cents, v2: $.data.version } }
            - { call: "PATCH /ticket-orders/${o1}", payload: { expected_order_version: "${o_v}", quantity: 5 }, as: Guest, as_user_id: "g-occ@x.com", captures: { err: $.data.error_id } }
            - { call: "GET /ticket-orders/${o1}", payload: {}, as: Any, captures: { qty: $.data.quantity, tot: $.data.total_cents } }
          assert:
            - "First patch: quantity 4 repriced to total_cents == 12600 (4*3000 + 4*150), version == 2"
            - "Stale replay: ERR_STALE_VERSION (412); order remains quantity 4, total_cents 12600"

      - name: layer_cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: weather_cancellation_cascade_shift_hours_posture
          rationale: "N-level cascade ordering is asserted end-to-end by the §1.8 cascade instances."

      - name: layer_dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: booth_fee_provisional_vs_final_settlement
          rationale: "Both variants and their divergence are asserted by the §1.8 dual-variant instances."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_mutation
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "All changes are visible in the same request's response and in the immediately following GET — the patch response already carries the recomputed total, and the read-back agrees."
        test_recipe:
          setup: ["Season BUILD; day 06-06 OPEN_FOR_SALES; DAY order qty3 UNPAID"]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "Immediate Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 3, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-imm@x.com", captures: { o1: $.data.id, o_v: $.data.version } }
          trigger:
            - { call: "PATCH /ticket-orders/${o1}", payload: { expected_order_version: "${o_v}", quantity: 5 }, as: Guest, as_user_id: "g-imm@x.com", captures: { tot_patch: $.data.total_cents } }
            - { call: "GET /ticket-orders/${o1}", payload: {}, as: Any, captures: { tot_get: $.data.total_cents, qty_get: $.data.quantity } }
          assert:
            - "PATCH response total_cents == 15750 (5*3000 + 5*150) — recomputed in the same request"
            - "Immediate GET agrees: quantity == 5, total_cents == 15750"
