  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_half_open_adjacency_allowed
        grounds:
          - validations[priority=29]
          - entities.Inspection.fields.scheduled_start_utc
        distinguishing_aspect: |
          Resource inspector under HALF-OPEN [start, end) semantics: an inspection starting exactly
          when the inspector's prior one ends (10:00 == 10:00) is accepted, while a strictly
          overlapping one (09:30-10:30) is rejected with ERR_INSPECTOR_SCHEDULE_CONFLICT.
        test_recipe:
          setup:
            - "OPERATING store; inspector insp-Z has one SCHEDULED inspection 2026-09-03T09:00-10:00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-16" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
