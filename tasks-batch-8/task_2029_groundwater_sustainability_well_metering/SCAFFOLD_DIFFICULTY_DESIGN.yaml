            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-2", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_2: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-3", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_3: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-4", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_4: $.data.id }
            - call: "POST /wells/${mw_1}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_2}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_3}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_4}/activate"
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_1}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 130.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_2}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 50.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_3}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 55.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_4}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 60.0, collector_name: "Field Tech" }
              as: WaterMaster
