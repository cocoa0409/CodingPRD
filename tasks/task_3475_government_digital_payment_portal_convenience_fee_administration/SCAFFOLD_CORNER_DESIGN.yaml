# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3475_government_digital_payment_portal_convenience_fee_administration
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Anchors (&c_*) are local to this file and re-bind per instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: agency_create_returns_declared_fields_and_envelope
        claim_type: Creation
        grounds:
          - entities.Agency
          - endpoints.POST_/portal/agencies
          - response_envelope
        distinguishing_aspect: "A minimal agency create returns 201 with every declared field echoed or defaulted: status ONBOARDING, activated_at null, version 1, system id/created_at/updated_at, and the fixed success envelope with meta.api_request_id and api_request_timestamp."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z (no set call needed); empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_agency
              call: "POST /portal/agencies"
              payload: { legal_name: "Department of Public Safety", agency_type: "STATE", default_fee_model: "CONVENIENCE_FEE" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
          assert:
            - "the response status is 201, response_type == object, and meta carries api_request_id and api_request_timestamp"
            - "Agency.${ag_id}.legal_name == \"Department of Public Safety\", agency_type == STATE, default_fee_model == CONVENIENCE_FEE"
            - "Agency.${ag_id}.status == ONBOARDING and activated_at is null"
            - "Agency.${ag_id}.version == 1 and id / created_at / updated_at are non-null"

      - name: service_get_round_trips_all_fields
        claim_type: Retrieval
        grounds:
          - entities.ServiceCatalogItem
          - endpoints.GET_/portal/services/{id}
        distinguishing_aspect: "Every stored service field round-trips through GET exactly as posted, and the activation mutation has bumped version from 1 to 2."
        test_recipe:
          setup:
            - "The base CF agency chain with the service activated."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - &c_account
              call: "POST /portal/settlement-accounts"
              payload: { agency_id: "${ag_id}", routing_number: "021000021", account_number_last4: "4321", effective_from: "2026-01-01T00:00:00Z", expected_agency_version: "${ag_v}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - &c_verify
              call: "POST /portal/settlement-accounts/${acct_id}/verify"
              payload: { outcome: "SUCCESS" }
              as: TreasuryOfficer
            - &c_attest
              call: "POST /portal/attestations"
              payload: { agency_id: "${ag_id}", attestation_type: "PCI_DSS_AOC", issued_at: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - &c_agency_on
              call: "POST /portal/agencies/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &c_service
              call: "POST /portal/services"
              payload: { agency_id: "${ag_id}", service_code: "DL-RENEW", name: "Driver License Renewal", fee_model: "CONVENIENCE_FEE", allowed_methods: ["CARD", "ECHECK", "WALLET"], min_amount_cents: 100, max_amount_cents: 1000000, gl_code: "4110" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { svc_id: $.data.id, svc_v: $.data.version }
            - &c_authz
              call: "POST /portal/statutory-authorizations"
              payload: { service_id: "${svc_id}", statute_citation: "62 O.S. 34.9", disclosure_text_version: "D1", fee_cap_cents: 5000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { authz_id: $.data.id }
            - &c_authz_ok
              call: "POST /portal/statutory-authorizations/${authz_id}/approve"
              payload: {}
              as: PlatformAdmin
            - &c_service_on
              call: "POST /portal/services/${svc_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { svc_v2: $.data.version }
          trigger:
            - call: "GET /portal/services/${svc_id}"
              payload: {}
              as: ComplianceAuditor
          assert:
            - "ServiceCatalogItem.${svc_id}: service_code == \"DL-RENEW\", name == \"Driver License Renewal\", fee_model == CONVENIENCE_FEE, allowed_methods == [CARD, ECHECK, WALLET], min_amount_cents == 100, max_amount_cents == 1000000, gl_code == \"4110\""
            - "ServiceCatalogItem.${svc_id}.status == ACTIVE and version == 2 (create 1, activation bumped to 2)"

      - name: transactions_list_paginates_with_limit_offset
        claim_type: Listing
        grounds:
          - endpoints.GET_/portal/payment-transactions
          - response_envelope
        distinguishing_aspect: "limit=1 returns exactly one row with total_count 2 and has_more true; offset=1 returns the second row with has_more false — envelope pagination fields all present."
        test_recipe:
          setup:
            - "CF agency base chain; the payer has two AUTHORIZED transactions."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - &c_payer
              call: "POST /portal/payers"
              payload: { full_name: "Pat Parker", email: "pat@example.com", billing_zip: "73102" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - &c_card
              call: "POST /portal/payers/${payer_id}/instruments"
              payload: { method: "CARD", card_brand: "VISA", card_cost_bucket: "CONSUMER_DEBIT", last4: "4242" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { inst_card: $.data.id }
            - &c_quote100k
              call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 100000, method: "CARD" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote_id: $.data.id }
            - &c_txn
              call: "POST /portal/payment-transactions"
              payload: { quote_id: "${quote_id}", instrument_id: "${inst_card}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { txn_id: $.data.id }
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 20000, method: "CARD" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote_id2: $.data.id }
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${quote_id2}", instrument_id: "${inst_card}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { txn_id2: $.data.id }
          trigger:
            - call: "GET /portal/payment-transactions"
              payload: { payer_id: "${payer_id}", limit: 1, offset: 0 }
              as: PlatformAdmin
            - call: "GET /portal/payment-transactions"
              payload: { payer_id: "${payer_id}", limit: 1, offset: 1 }
              as: PlatformAdmin
          assert:
            - "first page: exactly 1 row (${txn_id}, created_at ASC), total_count == 2, has_more == true, limit == 1, offset == 0"
            - "second page: exactly 1 row (${txn_id2}), has_more == false, offset == 1"

      - name: agency_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/portal/agencies/{id}
          - errors.ERR_AGENCY_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A well-formed but unknown agency UUID returns 404 ERR_AGENCY_NOT_FOUND with the error envelope, never a null 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /portal/agencies/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and err_id == ERR_AGENCY_NOT_FOUND"
            - "response_type == error and data.message is non-empty"

      - name: service_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ServiceCatalogItem.fields.gl_code
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "gl_code is source: input with no default; omitting it yields 400 ERR_INVALID_REQUEST and nothing is persisted."
        test_recipe:
          setup:
            - "CF agency created (ONBOARDING is enough — service create has no agency-state gate)."
          setup_api_calls:
            - *c_clock
            - *c_agency
          trigger:
            - call: "POST /portal/services"
              payload: { agency_id: "${ag_id}", service_code: "DL-RENEW", name: "Driver License Renewal", allowed_methods: ["CARD"], min_amount_cents: 100, max_amount_cents: 1000000 }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and err_id == ERR_INVALID_REQUEST"
            - "GET /portal/agencies/${ag_id}/services returns 0 rows"

      - name: service_fee_model_defaults_to_agency_default
        claim_type: Defaults
        grounds:
          - entities.ServiceCatalogItem.fields.fee_model
          - entities.Agency.fields.default_fee_model
        distinguishing_aspect: "fee_model omitted at create inherits the agency's default_fee_model (ABSORBED) instead of failing or nulling."
        test_recipe:
          setup:
            - "An ABSORBED-default agency exists."
          setup_api_calls:
            - *c_clock
            - &d_agency
              call: "POST /portal/agencies"
              payload: { legal_name: "County Treasurer", agency_type: "LOCAL", default_fee_model: "ABSORBED" }
              as: PlatformAdmin
              captures: { ag2_id: $.data.id, ag2_v: $.data.version }
          trigger:
            - call: "POST /portal/services"
              payload: { agency_id: "${ag2_id}", service_code: "PROP-TAX", name: "Property Tax Payment", allowed_methods: ["ECHECK"], min_amount_cents: 1, max_amount_cents: 100000000, gl_code: "5200" }
              as: AgencyAdmin
              as_user_id: "aa-county"
              captures: { svc2_id: $.data.id }
          assert:
            - "the response status is 201 and ServiceCatalogItem.${svc2_id}.fee_model == ABSORBED (inherited, not client-supplied)"
            - "ServiceCatalogItem.${svc2_id}.status == DRAFT"

      - name: attestation_status_computed_against_clock
        claim_type: Computed Fields
        grounds:
          - entities.ComplianceAttestation.fields.status
        distinguishing_aspect: "status is derived on read from the logical clock: CURRENT strictly before expires_at, EXPIRED at exactly expires_at — the same row flips without any write."
        test_recipe:
          setup:
            - "Agency with a PCI_DSS_AOC attestation expiring 2026-10-01T00:00:00Z; clock starts 2026-09-01."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - call: "POST /portal/attestations"
              payload: { agency_id: "${ag_id}", attestation_type: "PCI_DSS_AOC", issued_at: "2026-08-01T00:00:00Z", expires_at: "2026-10-01T00:00:00Z" }
              as: ComplianceAuditor
          trigger:
            - call: "GET /portal/agencies/${ag_id}/attestations"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T23:59:59Z" }
              as: PlatformAdmin
            - call: "GET /portal/agencies/${ag_id}/attestations"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portal/agencies/${ag_id}/attestations"
              payload: {}
              as: ComplianceAuditor
          assert:
            - "at 2026-09-01 and at 2026-09-30T23:59:59Z the single attestation reads status == CURRENT"
            - "at exactly 2026-10-01T00:00:00Z it reads status == EXPIRED (clock >= expires_at)"
            - "no write occurred between reads — the flip is purely clock-derived"

      - name: instrument_create_with_status_field_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.PaymentInstrument.fields.status
          - entities.PaymentInstrument.fields.token_ref
          - endpoints.POST_/portal/payers/{id}/instruments
        distinguishing_aspect: "status and token_ref are source: system; a client smuggling status=DEACTIVATED, token_ref=\"hack\" and version=99 gets an ACTIVE card instrument with a server-minted token and version 1."
        test_recipe:
          setup:
            - "One registered payer."
          setup_api_calls:
            - *c_clock
            - *c_payer
          trigger:
            - call: "POST /portal/payers/${payer_id}/instruments"
              payload: { method: "CARD", card_brand: "VISA", card_cost_bucket: "CONSUMER_CREDIT", last4: "4242", status: "DEACTIVATED", token_ref: "hack", version: 99 }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { inst_id: $.data.id }
          assert:
            - "the response status is 201; PaymentInstrument.${inst_id}.status == ACTIVE (CARD instruments skip verification)"
            - "token_ref is server-minted and != \"hack\"; version == 1"
            - "PaymentInstrument.${inst_id}.last4 == \"4242\" and no full PAN field exists anywhere in the response"

      - name: instrument_create_with_out_of_enum_method_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.PaymentInstrument.fields.method
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "method is a closed enum {CARD, ECHECK, WALLET}; BITCOIN is rejected 400 at priority 1-2 request validation rather than coerced."
        test_recipe:
          setup:
            - "One registered payer."
          setup_api_calls:
            - *c_clock
            - *c_payer
          trigger:
            - call: "POST /portal/payers/${payer_id}/instruments"
              payload: { method: "BITCOIN", last4: "0000" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and err_id == ERR_INVALID_REQUEST"
            - "GET /portal/payers/${payer_id}/instruments returns 0 rows"

      - name: feequote_carries_no_version_field_immutable
        claim_type: Immutability
        grounds:
          - entities.FeeQuote
        distinguishing_aspect: "FeeQuote is common_fields: false — the response carries id and created_at but no version or updated_at, and no PUT/PATCH endpoint exists for quotes."
        test_recipe:
          setup:
            - "CF agency base chain; one OPEN quote."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_quote100k
          trigger:
            - call: "GET /portal/fee-quotes/${quote_id}"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
          assert:
            - "the quote response has id and created_at but no version and no updated_at members"
            - "status == OPEN and expires_at == created_at + 30 minutes"

      - name: service_create_with_unknown_agency_returns_agency_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ServiceCatalogItem.fields.agency_id
          - errors.ERR_AGENCY_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology puts agency_id in the request body; an unknown body FK is a 404 ERR_AGENCY_NOT_FOUND, not a 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /portal/services"
              payload: { agency_id: "00000000-0000-4000-8000-000000000001", service_code: "X", name: "Ghost", fee_model: "ABSORBED", allowed_methods: ["CARD"], min_amount_cents: 1, max_amount_cents: 100, gl_code: "9" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and err_id == ERR_AGENCY_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: transaction_created_directly_in_authorized
        claim_type: Initial State
        grounds:
          - state_machines.PaymentTransaction
          - endpoints.POST_/portal/payment-transactions
        distinguishing_aspect: "Authorize is atomic with creation: a new PaymentTransaction starts in AUTHORIZED (no INITIATED limbo), representment_count 0, refunded_cents 0, charged_back_cents 0, current_batch_id null."
        test_recipe:
          setup:
            - "CF agency base chain; one OPEN CARD quote."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_quote100k
          trigger:
            - *c_txn
          assert:
            - "PaymentTransaction.${txn_id}.funds_status == AUTHORIZED immediately in the create response"
            - "representment_count == 0, refunded_cents == 0, charged_back_cents == 0, remaining_refundable_cents == 100000, current_batch_id is null"
            - "denormalized agency_id == ${ag_id}, service_id == ${svc_id}, payer_id == ${payer_id}, method == CARD, fee_model == CONVENIENCE_FEE"
            - "FeeQuote.${quote_id}.status == CONSUMED"

      - name: capture_stamps_clock_and_value_date
        claim_type: Valid Transition
        grounds:
          - state_machines.PaymentTransaction.AUTHORIZED_to_CAPTURED
          - calculations.value_date
        distinguishing_aspect: "Capture from AUTHORIZED succeeds and stamps captured_at from the logical clock; value_date = capture date + 1 day for CARD (and + 2 days for ECHECK), per METHOD_LAG_DAYS."
        test_recipe:
          setup:
            - "CF agency base chain; a CARD transaction and a verified-ECHECK transaction, both AUTHORIZED; clock 2026-09-10."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - &c_echeck
              call: "POST /portal/payers/${payer_id}/instruments"
              payload: { method: "ECHECK", last4: "9876" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { inst_ech: $.data.id }
            - &c_echeck_ok
              call: "POST /portal/instruments/${inst_ech}/verify-ach"
              payload: { outcome: "SUCCESS" }
              as: Payer
              as_user_id: "${payer_id}"
            - &c_clk10
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - *c_quote100k
            - *c_txn
            - &c_quote_ech50k
              call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 50000, method: "ECHECK" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote_ech: $.data.id }
            - &c_txn_ech
              call: "POST /portal/payment-transactions"
              payload: { quote_id: "${quote_ech}", instrument_id: "${inst_ech}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { txn_ech: $.data.id }
          trigger:
            - &c_capture
              call: "POST /portal/payment-transactions/${txn_id}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
            - call: "POST /portal/payment-transactions/${txn_ech}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
          assert:
            - "PaymentTransaction.${txn_id}: funds_status == CAPTURED, captured_at == 2026-09-10T00:00:00Z, value_date == \"2026-09-11\" (CARD lag 1)"
            - "PaymentTransaction.${txn_ech}: funds_status == CAPTURED, value_date == \"2026-09-12\" (ECHECK lag 2)"
            - "both responses bump version to 2 and refresh updated_at"

      - name: void_after_capture_rejected_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PaymentTransaction.AUTHORIZED_to_VOIDED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "VOID is only defined from AUTHORIZED; a CAPTURED transaction rejects void with 409 ERR_INVALID_STATE and stays CAPTURED."
        test_recipe:
          setup:
            - "CF agency base chain; one CAPTURED CARD transaction."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_quote100k
            - *c_txn
            - *c_capture
          trigger:
            - call: "POST /portal/payment-transactions/${txn_id}/void"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE"
            - "PaymentTransaction.${txn_id}.funds_status remains CAPTURED"

      - name: voided_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PaymentTransaction
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "From terminal VOIDED every trigger — capture, void again, ach-return, re-present — is rejected ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup:
            - "CF agency base chain; one AUTHORIZED ECHECK transaction, then voided."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_echeck
            - *c_echeck_ok
            - *c_quote_ech50k
            - *c_txn_ech
            - call: "POST /portal/payment-transactions/${txn_ech}/void"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
          trigger:
            - call: "POST /portal/payment-transactions/${txn_ech}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_cap: $.data.error_id }
            - call: "POST /portal/payment-transactions/${txn_ech}/ach-return"
              payload: {}
              as: PlatformAdmin
              captures: { err_ret: $.data.error_id }
            - call: "POST /portal/payment-transactions/${txn_ech}/re-present"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_rep: $.data.error_id }
          assert:
            - "all three triggers return 409 with err_cap == err_ret == err_rep == ERR_INVALID_STATE"
            - "PaymentTransaction.${txn_ech}.funds_status is still VOIDED, representment_count 0, no batch was auto-created"

      - name: second_capture_rejected_not_idempotent
        claim_type: Idempotency
        grounds:
          - state_machines.PaymentTransaction.AUTHORIZED_to_CAPTURED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Repeating the same transition trigger is an error, not a no-op: the second capture returns 409 and captured_at/value_date are unchanged from the first."
        test_recipe:
          setup:
            - "CF agency base chain; one CAPTURED CARD transaction captured at clock 2026-09-10."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_clk10
            - *c_quote100k
            - *c_txn
            - *c_capture
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portal/payment-transactions/${txn_id}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE"
            - "PaymentTransaction.${txn_id}.captured_at is still 2026-09-10T00:00:00Z and value_date still \"2026-09-11\" (the later clock did not leak in)"

      - name: batch_empty_close_finalizes_zeroes
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SettlementBatch.OPEN_to_CLOSED
          - calculations.settlement_batch_totals
        distinguishing_aspect: "Closing a batch with zero eligible members is legal: member_count 0, gross 0, deposit_cents 0, and deposit_due_date falls back to business_date."
        test_recipe:
          setup:
            - "CF agency base chain; no transactions at all."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
          trigger:
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-05" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /portal/settlement-batches/${batch_id}/close"
              payload: {}
              as: PlatformAdmin
          assert:
            - "SettlementBatch.${batch_id}.status == CLOSED with member_count == 0"
            - "gross_amount_cents == 0, fees_withheld_cents == 0, deposit_cents == 0"
            - "deposit_due_date == \"2026-09-05\" (business_date fallback for the empty set)"

      - name: chargeback_outcome_on_opened_before_deadline_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ChargebackCase.OPENED_to_LOST
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "An OPENED case whose evidence deadline has NOT passed cannot be outcome-recorded at all — 409 ERR_INVALID_STATE; only the deadline makes OPENED -> LOST available."
        test_recipe:
          setup:
            - "CF agency base chain; CAPTURED CARD transaction; chargeback opened at clock 2026-09-10 (evidence due 2026-09-20)."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_clk10
            - *c_quote100k
            - *c_txn
            - *c_capture
            - &c_chargeback
              call: "POST /portal/chargebacks"
              payload: { transaction_id: "${txn_id}", reason_code: "FRAUD" }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /portal/chargebacks/${case_id}/record-outcome"
              payload: { outcome: "LOST" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE (deadline 2026-09-20 has not passed at clock 2026-09-10)"
            - "ChargebackCase.${case_id}.status remains OPENED and charged_back_cents on the transaction is still 0"

      - name: chargeback_past_deadline_record_outcome_forces_lost
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ChargebackCase.OPENED_to_LOST
          - entities.ChargebackCase.fields.evidence_due_at
        distinguishing_aspect: "Once the clock passes evidence_due_at, record-outcome LOST on a still-OPENED case force-decides it: the network debit books immediately into an auto-created OPEN batch."
        test_recipe:
          setup:
            - "CF agency base chain; CAPTURED CARD 100000 transaction; chargeback opened 2026-09-10; clock advanced to 2026-09-21 (past the 2026-09-20 deadline)."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_clk10
            - *c_quote100k
            - *c_txn
            - *c_capture
            - *c_chargeback
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portal/chargebacks/${case_id}/record-outcome"
              payload: { outcome: "LOST" }
              as: PlatformAdmin
          assert:
            - "ChargebackCase.${case_id}.status == LOST with network_debit_cents == 100000"
            - "PaymentTransaction.${txn_id}.charged_back_cents == 100000 and remaining_refundable_cents == 0"
            - "an OPEN batch with business_date 2026-09-21 was auto-created carrying chargeback_debits_cents == 100000"

      - name: exception_second_resolve_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ReconciliationException.OPEN_to_RESOLVED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "RESOLVED is terminal for an exception: a second resolve call is rejected ERR_INVALID_STATE and the batch stays RECONCILED."
        test_recipe:
          setup:
            - "CF agency base chain; CARD 100000 transaction captured 2026-09-10; batch 2026-09-11 closed, submitted, confirmed 99000 at clock 2026-09-12; reconciled to EXCEPTION with a single AMOUNT_MISMATCH; that exception already resolved."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_clk10
            - *c_quote100k
            - *c_txn
            - *c_capture
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-11" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /portal/settlement-batches/${batch_id}/close"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/settlement-batches/${batch_id}/submit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portal/settlement-batches/${batch_id}/confirm-deposit"
              payload: { actual_deposit_cents: 99000 }
              as: TreasuryOfficer
            - call: "POST /portal/settlement-batches/${batch_id}/reconcile"
              payload: {}
              as: PlatformAdmin
            - call: "GET /portal/settlement-batches/${batch_id}/exceptions"
              payload: {}
              as: PlatformAdmin
              captures: { ex1: "$.data[0].id" }
            - call: "POST /portal/reconciliation-exceptions/${ex1}/resolve"
              payload: { resolution_note: "bank fee acknowledged" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portal/reconciliation-exceptions/${ex1}/resolve"
              payload: { resolution_note: "second resolve attempt" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the first resolve produced exactly one AMOUNT_MISMATCH exception (confirmed at due+1 day grace boundary, so no DEPOSIT_LATE) and bubbled the batch to RECONCILED"
            - "the second resolve returns 409 and err_id == ERR_INVALID_STATE"
            - "SettlementBatch.${batch_id}.status remains RECONCILED"

      - name: batch_submit_before_close_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SettlementBatch.CLOSED_to_SUBMITTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "submit is defined only from CLOSED; calling it on an OPEN batch returns 409 and the batch stays OPEN with no submitted_at."
        test_recipe:
          setup:
            - "CF agency base chain; one OPEN batch."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-05" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /portal/settlement-batches/${batch_id}/submit"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE"
            - "SettlementBatch.${batch_id}.status == OPEN and submitted_at is null"

      - name: refund_deny_moves_no_money
        claim_type: Valid Transition
        grounds:
          - state_machines.Refund.REQUESTED_to_DENIED
          - entities.PaymentTransaction.fields.refunded_cents
        distinguishing_aspect: "DENY is a real terminal branch of the Refund machine: the refund closes DENIED with the decider recorded, and neither the transaction's refunded_cents nor any batch debit moves."
        test_recipe:
          setup:
            - "CF agency base chain; CAPTURED CARD 100000 transaction; OPEN batch; refund 25000 REQUESTED by aa-lead."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_quote100k
            - *c_txn
            - *c_capture
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-02" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /portal/refunds"
              payload: { transaction_id: "${txn_id}", amount_cents: 25000, reason: "discretionary" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /portal/refunds/${ref_id}/decide"
              payload: { decision: "DENY" }
              as: AgencyAdmin
              as_user_id: "aa-peer"
          assert:
            - 'Refund.${ref_id}.status == DENIED and decided_by_user_id == "aa-peer"'
            - "PaymentTransaction.${txn_id}.refunded_cents == 0 and remaining_refundable_cents == 100000"
            - "SettlementBatch.${batch_id}.refund_debits_cents == 0 (no debit on denial)"
            - "a second decide on the DENIED refund returns 409 ERR_INVALID_STATE (terminal)"

      - name: chargeback_contested_lost_books_debit
        claim_type: Valid Transition
        grounds:
          - state_machines.ChargebackCase.CONTESTED_to_LOST
          - entities.ChargebackCase.fields.network_debit_cents
        distinguishing_aspect: "The normal network-loss path CONTESTED -> LOST books the same debit as acceptance: network_debit equals amount minus refunds, posted into an auto-created OPEN batch."
        test_recipe:
          setup:
            - "CF agency base chain; CAPTURED CARD 100000 transaction; chargeback OPENED and CONTESTED within the evidence window."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_quote100k
            - *c_txn
            - *c_capture
            - *c_chargeback
            - call: "POST /portal/chargebacks/${case_id}/contest"
              payload: { evidence_note: "compelling evidence packet" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
          trigger:
            - call: "POST /portal/chargebacks/${case_id}/record-outcome"
              payload: { outcome: "LOST" }
              as: PlatformAdmin
          assert:
            - "ChargebackCase.${case_id}.status == LOST and network_debit_cents == 100000"
            - "PaymentTransaction.${txn_id}.charged_back_cents == 100000 and remaining_refundable_cents == 0"
            - "exactly one auto-created OPEN batch carries chargeback_debits_cents == 100000"

      - name: agency_resume_does_not_restore_services
        claim_type: Cascade down
        grounds:
          - state_machines.Agency.SUSPENDED_to_ACTIVE
        excluded_because:
          difficulty_instance: transitive_cascade / agency_suspend_deactivates_services_voids_quotes
          rationale: "The asymmetric resume (services stay DEACTIVATED after agency reactivation) is pinned by the final assert of the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: echeck_quote_flat_fee_exact
        claim_type: Correct Result
        grounds:
          - calculations.convenience_fee
          - entities.FeeQuote.fields.quoted_fee_cents
        distinguishing_aspect: "ECHECK is a flat 150-cent fee with no gross-up: quote 50000 -> quoted_fee 150, payer_total 50150, and the FINAL variant at authorize equals the QUOTED variant (non-card methods never diverge)."
        test_recipe:
          setup:
            - "CF agency base chain; payer with verified ECHECK instrument."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_echeck
            - *c_echeck_ok
          trigger:
            - *c_quote_ech50k
            - *c_txn_ech
          assert:
            - "FeeQuote.${quote_ech}.quoted_fee_cents == 150 and payer_total_cents == 50150"
            - "PaymentTransaction.${txn_ech}.charged_fee_cents == 150 and final_fee_cents == 150 (QUOTED == FINAL for ECHECK)"
            - "PaymentTransaction.${txn_ech}.payer_total_cents == 50150"

      - name: batch_membership_value_date_inclusive_boundary
        claim_type: Input Set Filtering
        grounds:
          - calculations.settlement_batch_totals
          - calculations.value_date
        distinguishing_aspect: "Batch membership filters on value_date <= business_date: an ECHECK captured 2026-09-10 (value 09-12) is EXCLUDED from the 09-11 batch that sweeps a same-day CARD capture (value 09-11), and INCLUDED when business_date equals its value_date exactly."
        test_recipe:
          setup:
            - "CF agency base chain; CARD 100000 and ECHECK 50000 both captured at clock 2026-09-10."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_echeck
            - *c_echeck_ok
            - *c_clk10
            - *c_quote100k
            - *c_txn
            - *c_capture
            - *c_quote_ech50k
            - *c_txn_ech
            - call: "POST /portal/payment-transactions/${txn_ech}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
          trigger:
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-11" }
              as: PlatformAdmin
              captures: { batch_a: $.data.id }
            - call: "POST /portal/settlement-batches/${batch_a}/close"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-12" }
              as: PlatformAdmin
              captures: { batch_b: $.data.id }
            - call: "POST /portal/settlement-batches/${batch_b}/close"
              payload: {}
              as: PlatformAdmin
          assert:
            - "batch 2026-09-11: member_count == 1, gross_amount_cents == 100000, fees_withheld_cents == 2281, deposit_due_date == \"2026-09-11\" — the ECHECK (value 09-12) is excluded"
            - "PaymentTransaction.${txn_ech}.funds_status is still CAPTURED after the first close"
            - "batch 2026-09-12: member_count == 1, gross_amount_cents == 50000 — value_date == business_date is INCLUSIVE"
            - "PaymentTransaction.${txn_ech}.current_batch_id == ${batch_b} and funds_status == SETTLED"

      - name: reconcile_grace_boundary_not_late
        claim_type: Precision
        grounds:
          - calculations.reconciliation_match
        distinguishing_aspect: "DEPOSIT_LATE fires only when confirmed date > deposit_due_date + 1 grace day; confirming exactly on due+1 with an exact amount reconciles clean — CONFIRMED -> RECONCILED with zero exceptions."
        test_recipe:
          setup:
            - "CF agency base chain; CARD 100000 captured 2026-09-10; batch 2026-09-11 closed and submitted; clock 2026-09-12 (exactly due + 1)."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_clk10
            - *c_quote100k
            - *c_txn
            - *c_capture
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-11" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /portal/settlement-batches/${batch_id}/close"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/settlement-batches/${batch_id}/submit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portal/settlement-batches/${batch_id}/confirm-deposit"
              payload: { actual_deposit_cents: 100000 }
              as: TreasuryOfficer
          trigger:
            - call: "POST /portal/settlement-batches/${batch_id}/reconcile"
              payload: {}
              as: PlatformAdmin
          assert:
            - "SettlementBatch.${batch_id}.status == RECONCILED directly from CONFIRMED (never EXCEPTION)"
            - "GET /portal/settlement-batches/${batch_id}/exceptions returns 0 rows — on the grace boundary no DEPOSIT_LATE is raised"

      - name: absorbed_straddle_exact_split_arithmetic
        claim_type: Correct Result
        grounds:
          - calculations.agency_absorbed_monthly_invoice
        distinguishing_aspect: "A 2000-cent transaction straddling the 500000 band boundary splits 1000 cents at 250bp + 1000 cents at 190bp = 44, plus the first-cent band's 20 per-transaction: line fee 64, month invoice 12559; the flat retroactive reading gives 9549."
        test_recipe:
          setup:
            - "Absorbed agency with all three 2026-09 bands; ECHECK transactions 499000 (captured 09-10) then 2000 (captured 09-11)."
          setup_api_calls:
            - *c_clock
