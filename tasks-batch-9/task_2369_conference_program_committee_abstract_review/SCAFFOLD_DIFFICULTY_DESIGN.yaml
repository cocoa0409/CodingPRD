      - name: session_packing_admits_exactly_ninety_minutes_and_rejects_ninety_one
        grounds:
          - calculations.session_packing
          - entities.Session.fields.committed_minutes
          - entities.Session.fields.slot_count
          - state_machines.SessionSlot.(create)_to_SCHEDULED
          - endpoints.POST./sessions/{sessionId}/slots
        distinguishing_aspect: |
          A THIRD metric on a THIRD endpoint. The session window is exactly 90
          minutes and already holds one 40-minute slot. Adding 36 minutes needs
          10 + (40 + 36) + 5 = 91 > 90 and must be rejected with
          ERR_SESSION_DURATION_EXCEEDED, while adding 35 needs
          10 + (40 + 35) + 5 = 90 <= 90 and must be accepted at the exact
          boundary. The buffer is counted once and the changeover only between
          slots, so committed_minutes lands on 80, not 85 or 90.
