  - rule_id: boundary_precision_check
    instances:
      - name: survey_threshold_exact_boundary
        grounds: [calculations.designation_thresholds, entities.SurveyWave.fields.threshold_met, "validations[priority=11]"]
        distinguishing_aspect: "Threshold boundary on response_count: min_responses == 1, exactly 1 COUNTED response -> threshold_met true and qualify succeeds; zero responses -> threshold_met false and qualify rejected. Metric: response count (integer)."
        test_recipe:
          setup: ["member ACTIVE with subscription; wave field window [2026-09-01, 2026-09-05], min_responses 1; one response submitted at clock 2026-09-03; clock advanced to 2026-09-06; wave closed"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "b1@x.com", full_name: "B One" }
              as: Member
