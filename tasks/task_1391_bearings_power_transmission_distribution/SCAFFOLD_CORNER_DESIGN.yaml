            - "err == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: rbac_customer_plant_cannot_invoice_consumption
        claim_type: rbac_denial
        grounds:
          - "roles"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Entity-backed customer role can report and dispute but never invoice — billing is BranchManager-exclusive."
        test_recipe:
          setup: ["agreement with one REPORTED consumption"]
          setup_api_calls:
