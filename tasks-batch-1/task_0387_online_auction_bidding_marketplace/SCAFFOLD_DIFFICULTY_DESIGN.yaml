            - "Account.${s_id}.standing == SUSPENDED"
            - "Listing.${lst2_id}.status == DRAFT"

      - name: ship_requires_order_payment_paid   # Order fulfillment dim -> Order payment dim (cross-dimension/state)
        grounds:
          - state_machines.Order.READY_TO_SHIP_to_SHIPPED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
