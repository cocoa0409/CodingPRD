      - name: period_close_twice_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RandomTestingPeriod, "errors[ERR_PERIOD_NOT_OPEN]"]
        distinguishing_aspect: "CLOSED_* is terminal: a compliant-path close (2025 period closed at the 2026-08-01 default clock, deficient verdict) cannot be closed again — second close returns ERR_PERIOD_NOT_OPEN."
        test_recipe:
