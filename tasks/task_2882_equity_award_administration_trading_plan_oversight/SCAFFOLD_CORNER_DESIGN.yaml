              captures: { err: $.data.error_id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "PERFORMANCE", scheduled_vest_date: "2027-03-01", target_shares: 1000, performance_cycle_id: "${pc_id}" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
          assert:
            - "first call: HTTP 404 with data.error_id == ERR_CYCLE_NOT_FOUND"
            - "second call: HTTP 201 with VestingTranche.performance_cycle_id == ${pc_id}"
