            # Count totals
            - call: "GET /players"
              payload: { current_team_id: "${ta_id}", limit: 100 }
              as: Commissioner
              as_user_id: "commish_17"
            - call: "GET /players"
              payload: { current_team_id: "${tb_id}", limit: 100 }
              as: Commissioner
              as_user_id: "commish_17"
            - call: "GET /players"
              payload: { status: "ACTIVE", limit: 100 }
              as: Commissioner
              as_user_id: "commish_17"
          assert:
            - "After the chain (waiver win with drop pa1 + release fa), team A's roster is {pa2, pa3, pa4} (3 players); team B's roster is {pb1, pb2, pb3, pb4} (4 players); free-agent pool is {pa1, fa} (2 players)."
            - "GET /players?current_team_id=${ta_id} returns a list of length 3."
            - "GET /players?current_team_id=${tb_id} returns a list of length 4."
            - "Total players in league = 3 (team A) + 4 (team B) + 2 (free agents) = 9 = 8 drafted + 1 originally-FA = conserved player headcount invariant."
