          assert:
            - "link 1 - ConservationEasement.${eas_id}.recording_status == RECORDED and recording_reference == EAS-APN-A01-1 and recorded_at == 2026-08-10T00:00:00Z"
            - "link 2 - ConservationEasement.${eas_id}.restricted_acres == 100.00 and permitted_residual_units == 2 and units_issued_total == 22"
            - "link 2 - SendingParcel.${parcel_a}.severed_units == 22, remaining_units == 0, restricted_acres == 100.00, easement_status == RECORDED, parcel_status == FULLY_SEVERED"
