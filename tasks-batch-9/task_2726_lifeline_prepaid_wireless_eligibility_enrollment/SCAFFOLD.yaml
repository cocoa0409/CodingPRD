scenario: |
  Generate task harder than expert level!

  2726. Lifeline Prepaid Wireless Eligibility & Enrollment (SafeLink Wireless): program eligibility by income or qualifying benefit with national verifier check, one-benefit-per-household certification and duplicate address resolution, annual recertification with de-enrollment on non-response, non-usage rule and 15-day cure period, device issuance and single-device-per-subscriber control, service transfer between providers and porting freeze rules, subsidy reimbursement claim filing and audit sampling, subscriber complaint and de-enrollment appeal

domain_name: lifeline-prepaid-wireless-eligibility
api_prefix: "/lifeline"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: expert_plus
  difficulty_note: |
    Above the Expert band on coupling density, not on surface volume. Ten entities carry
    four orthogonal state dimensions on Enrollment, three cyclic machines on three other
    entities, two dual-variant calculations on unrelated subject matter (money vs.
    eligibility), and three conserved-quantity invariants that a forward action plus its
    compensating action must leave untouched. Every calculation reads fields that other
    calculations write, so an implementation that gets the evaluation order wrong produces
    self-consistent but wrong numbers.
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  entity_topology_note: |
    No URL nesting beyond two levels. Enrollment is a four-way junction over Subscriber,
    Provider, EligibilityCheck and HouseholdAddress; AuditSample is a junction over
    ReimbursementClaim and Enrollment; ServiceTransfer is a junction over Enrollment and
    two Provider rows (source and target). HouseholdAddress rows reference each other
    implicitly through the shared `address_hash` cohort, and SubscriberCase closes the
    graph by pointing back at an Enrollment whose de-enrollment it contests.

  state_machine_shape: parallel
  state_machine_shape_note: |
    Enrollment carries four independent state fields (`benefit_status`, `usage_status`,
    `recert_status`, `device_status`) that advance on unrelated triggers, plus a
    DE_ENROLLED -> ACTIVE reinstatement edge. EligibilityCheck, HouseholdAddress,
    Device and SubscriberCase are each cyclic. ReimbursementClaim is a branching
    fork-join with divergent side-effect sets on the AUDIT_PASSED vs AUDIT_FAILED arms.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - polymorphic
    - cross_aggregate
  relationship_patterns_note: |
    polymorphic: SubscriberCase.case_type discriminates SERVICE_COMPLAINT from
    DE_ENROLLMENT_APPEAL; the two variants accept disjoint `decision` values and fire
    disjoint side effects. cross_aggregate: adjudicating an AuditSample (claim aggregate)
    mutates an Enrollment (enrollment aggregate) and a Provider ledger.

  role_model: segregation_of_duties
  role_model_note: |
    Two enforced separations, both keyed on `X-User-ID`: the ComplianceAuditor who drew a
    claim's audit sample may not adjudicate it, and the operator recorded in
    `Enrollment.de_enrolled_by_ref` may not decide the de-enrollment appeal for that
    enrollment.

  consistency_model: immediate

entities:
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the eligible telecommunications carrier
        constraints: 1-120 characters
      - name: spin_id
        type: string
        source: input
        description: Service Provider Identification Number; unique across all Provider rows
        constraints: exactly 9 digits; uniqueness violation -> ERR_INVALID_REQUEST
      - name: study_area_code
        type: string
        source: input
        description: FCC study area code the carrier draws support from
        constraints: exactly 6 digits
      - name: licensed_state_codes
        type: array
        source: input
        description: two-letter state codes the carrier is licensed to enroll subscribers in
        constraints: non-empty array of distinct 2-letter uppercase codes
      - name: status
        type: enum
        source: input
        description: operating status of the carrier; set at creation, never mutated afterwards
        default: ACTIVE
        constraints: ACTIVE | SUSPENDED
      - name: enrollment_cap
        type: integer
        source: input
        description: maximum number of Enrollment rows with benefit_status == ACTIVE this carrier may hold
        default: 1000
        constraints: ">= 1"
      - name: active_enrollment_count
        type: integer
        source: computed
        description: "count of Enrollment where provider_id == this.id AND benefit_status == ACTIVE"
        default: 0
      - name: devices_total_count
        type: integer
        source: computed
        description: "count of Device where provider_id == this.id (no status filter)"
        default: 0
      - name: devices_in_stock_count
        type: integer
        source: computed
        description: "count of Device where provider_id == this.id AND status == IN_STOCK"
        default: 0
      - name: devices_issued_count
        type: integer
        source: computed
        description: "count of Device where provider_id == this.id AND status == ISSUED"
        default: 0
      - name: devices_reclaim_pending_count
        type: integer
        source: computed
        description: "count of Device where provider_id == this.id AND status == RECLAIM_PENDING"
        default: 0
      - name: devices_retired_count
        type: integer
        source: computed
        description: "count of Device where provider_id == this.id AND status IN {RETIRED, LOST}"
        default: 0
      - name: open_claim_count
        type: integer
        source: computed
        description: "count of ReimbursementClaim where provider_id == this.id AND status IN {DRAFT, FILED, UNDER_AUDIT, HELD}"
        default: 0
      - name: claim_gross_cents
        type: integer
        source: computed
        description: "sum of ReimbursementClaim.final_amount_cents where provider_id == this.id AND status IN {FILED, UNDER_AUDIT, AUDIT_PASSED, AUDIT_FAILED, HELD}; DRAFT and SUPERSEDED claims are excluded"
        default: 0
      - name: recouped_cents
        type: integer
        source: computed
        description: "sum of ReimbursementClaim.recoupment_amount_cents where provider_id == this.id AND status == AUDIT_FAILED"
        default: 0
      - name: net_reimbursed_cents
        type: integer
        source: computed
        description: "claim_gross_cents - recouped_cents; the conserved quantity of calculations.provider_ledger_reconciliation"
        default: 0
      - name: audit_hold_flag
        type: boolean
        source: computed
        description: "true when count of ReimbursementClaim where provider_id == this.id AND status == AUDIT_FAILED is >= 1, else false"
        default: false

  - name: HouseholdAddress
    parent: null
    common_fields: true
    fields:
      - name: address_line1
        type: string
        source: input
        description: street line as submitted by the enrolling agent
        constraints: 1-160 characters
      - name: unit_designator
        type: string
        source: input
        description: apartment or unit designator, null when the dwelling has none
        default: null
        constraints: 0-16 characters or null
      - name: city
        type: string
        source: input
        description: city as submitted
        constraints: 1-80 characters
      - name: state_code
        type: string
        source: input
        description: two-letter uppercase state code
        constraints: exactly 2 uppercase letters
      - name: postal_code
        type: string
        source: input
        description: 5-digit or 9-digit postal code as submitted
        constraints: 5 or 9 digits
      - name: address_hash
        type: string
        source: computed
        description: "normalized duplicate-detection key; see calculations.address_normalization_hash. Two HouseholdAddress rows with equal address_hash form one duplicate cohort"
      - name: status
        type: enum
        source: system
        description: duplicate-resolution posture of this dwelling
        default: UNVERIFIED
        constraints: UNVERIFIED | DUPLICATE_FLAGGED | RESOLVED_MULTI_HOUSEHOLD | RESOLVED_SINGLE_HOUSEHOLD
      - name: declared_household_count
        type: integer
        source: system
        description: "number of independent economic households the resolver declared for this dwelling; written only by POST /lifeline/addresses/{id}/duplicate-resolution with resolution == MULTI_HOUSEHOLD"
        default: null
        constraints: null or >= 2
      - name: independent_household_worksheet_ref
        type: string
        source: system
        description: "reference to the independent-economic-household worksheet on file; written only by duplicate-resolution with resolution == MULTI_HOUSEHOLD, cleared to null by resolution == SINGLE_HOUSEHOLD"
        default: null
      - name: max_permitted_benefit_slots
        type: integer
        source: computed
        description: "declared_household_count when status == RESOLVED_MULTI_HOUSEHOLD, otherwise 1"
        default: 1
      - name: occupied_benefit_slots
        type: integer
        source: computed
        description: "count of Enrollment where certified_address_id == this.id AND benefit_status == ACTIVE. Recomputed on every Enrollment benefit_status write"
        default: 0
      - name: cohort_address_count
        type: integer
        source: computed
        description: "count of HouseholdAddress rows (including this one) whose address_hash equals this.address_hash"
        default: 1

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - name: address_id
        type: string
        source: input
        description: "FK -> HouseholdAddress.id; the dwelling the applicant resides in"
      - name: full_name
        type: string
        source: input
        description: applicant legal name
        constraints: 1-120 characters
      - name: date_of_birth
        type: string
        source: input
        description: applicant date of birth
        constraints: "YYYY-MM-DD"
      - name: last4_ssn
        type: string
        source: input
        description: last four digits of the applicant social security number
        constraints: exactly 4 digits
      - name: household_size
        type: integer
        source: input
        description: number of people in the applicant economic household
        constraints: ">= 1 and <= 12"
      - name: annual_income_cents
        type: integer
        source: input
        description: self-reported gross annual household income in cents; the input of the strict_annualized income variant
        constraints: ">= 0"
      - name: last_3mo_income_cents
        type: integer
        source: input
        description: gross household income over the trailing three months in cents; the input of the three_month_averaged income variant
        constraints: ">= 0"
      - name: qualifying_benefit
        type: enum
        source: input
        description: federal assistance program the applicant claims participation in
        default: NONE
        constraints: NONE | SNAP | MEDICAID | SSI | FPHA | VETERANS_PENSION | TRIBAL_TANF | BIA_GENERAL_ASSISTANCE
      - name: tribal_lands_flag
        type: boolean
        source: input
        description: applicant resides on qualifying Tribal lands; raises the income multiplier and unlocks the tribal support enhancement
        default: false
      - name: identity_key
        type: string
        source: computed
        description: "duplicate-identity key: UPPER(strip non-alphanumerics from full_name) + '|' + date_of_birth + '|' + last4_ssn"
      - name: status
        type: enum
        source: system
        description: applicant lifecycle position
        default: PROSPECT
        constraints: PROSPECT | ELIGIBILITY_PENDING | VERIFIED_ELIGIBLE | DUPLICATE_HOLD | ENROLLED | DE_ENROLLED | BARRED
      - name: eligibility_basis
        type: enum
        source: computed
        description: "basis the most recent EligibilityCheck with status == ELIGIBLE_CONFIRMED was granted on: TRIBAL_BENEFIT when that check's claimed_basis == BENEFIT and tribal_lands_flag is true, BENEFIT when claimed_basis == BENEFIT and tribal_lands_flag is false, INCOME when claimed_basis == INCOME, NONE when no such check exists"
        default: NONE
        constraints: NONE | INCOME | BENEFIT | TRIBAL_BENEFIT
      - name: income_threshold_cents
        type: integer
        source: computed
        description: "output of calculations.fpg_income_threshold for this subscriber household_size and tribal_lands_flag; recomputed whenever household_size or tribal_lands_flag is written"
      - name: de_enrollment_count
        type: integer
        source: computed
        description: "count of Enrollment where subscriber_id == this.id AND benefit_status == DE_ENROLLED AND de_enrollment_reason IN {NON_USAGE, RECERT_NON_RESPONSE, INELIGIBLE_ON_RECERT, AUDIT_INELIGIBLE}"
        default: 0

  - name: EligibilityCheck
    parent: Subscriber
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; the applicant this check screens"
      - name: claimed_basis
        type: enum
        source: input
        description: which qualification route the applicant claims
        constraints: INCOME | BENEFIT
      - name: proof_document_ref
        type: string
        source: input
        description: reference to the uploaded proof document, null when none supplied at creation
        default: null
      - name: income_variant
        type: enum
        source: computed
        description: "which variant of calculations.eligibility_income_evaluation produced evaluated_income_cents; always STRICT_ANNUALIZED for checks created through POST /lifeline/subscribers/{id}/eligibility-checks, and NOT_APPLICABLE when claimed_basis == BENEFIT"
        constraints: STRICT_ANNUALIZED | NOT_APPLICABLE
      - name: evaluated_income_cents
        type: integer
        source: computed
        description: "income figure the screen compared against income_threshold_cents; null when claimed_basis == BENEFIT"
        default: null
      - name: income_threshold_cents
        type: integer
        source: computed
        description: "snapshot of calculations.fpg_income_threshold at creation time; null when claimed_basis == BENEFIT"
        default: null
      - name: status
        type: enum
        source: system
        description: national-verifier disposition of this check
        default: PENDING_VERIFIER
        constraints: PENDING_VERIFIER | DOCUMENTATION_REQUIRED | ELIGIBLE_CONFIRMED | INELIGIBLE
      - name: verifier_outcome
        type: enum
        source: system
        description: raw outcome the National Verifier returned, null before any verifier response
        default: null
        constraints: "null | MATCH | NO_MATCH | DOCUMENTATION_REQUIRED"
      - name: verifier_reason_code
        type: string
        source: system
        description: free-form reason code accompanying a NO_MATCH or DOCUMENTATION_REQUIRED outcome
        default: null
      - name: matched_benefit
        type: enum
        source: system
        description: benefit program the National Verifier matched, null unless verifier_outcome == MATCH and claimed_basis == BENEFIT
        default: null
        constraints: "null | SNAP | MEDICAID | SSI | FPHA | VETERANS_PENSION | TRIBAL_TANF | BIA_GENERAL_ASSISTANCE"
      - name: confirmed_at
        type: datetime
        source: system
        description: logical-clock instant at which status became ELIGIBLE_CONFIRMED, null otherwise
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "confirmed_at + ELIGIBILITY_VALID_DAYS days, null while confirmed_at is null; see calculations.eligibility_certification_validity"
        default: null
      - name: resubmission_count
        type: integer
        source: computed
        description: "count of successful POST /lifeline/eligibility-checks/{id}/resubmit-documentation calls against this check"
        default: 0
        constraints: "<= MAX_DOCUMENTATION_RESUBMISSIONS (2)"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; the enrolled applicant"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the carrier currently serving the benefit. Rewritten by a completed ServiceTransfer"
      - name: eligibility_check_id
        type: string
        source: input
        description: "FK -> EligibilityCheck.id; the ELIGIBLE_CONFIRMED check this enrollment rests on"
      - name: certified_address_id
        type: string
        source: input
        description: "FK -> HouseholdAddress.id; snapshot of the subscriber address at enrollment. Must equal Subscriber.address_id at creation and is never rewritten afterwards"
      - name: service_type
        type: enum
        source: input
        description: supported service the benefit is applied to
        constraints: VOICE | BROADBAND | BUNDLED
      - name: one_per_household_attested
        type: boolean
        source: input
        description: subscriber signed the one-benefit-per-household certification form
        constraints: must be true
      - name: benefit_status
        type: enum
        source: system
        description: "state dimension 1 of 4 - whether the federal benefit is being drawn. Independent of usage_status, recert_status and device_status"
        default: ACTIVE
        constraints: ACTIVE | DE_ENROLLED
      - name: usage_status
        type: enum
        source: system
        description: "state dimension 2 of 4 - non-usage rule posture"
        default: PENDING_FIRST_USE
        constraints: PENDING_FIRST_USE | USING | NON_USAGE_FLAGGED | CURE_EXPIRED
      - name: recert_status
        type: enum
        source: system
        description: "state dimension 3 of 4 - annual recertification posture"
        default: NOT_DUE
        constraints: NOT_DUE | NOTICED | NON_RESPONSIVE | RESPONDED_INELIGIBLE
      - name: device_status
        type: enum
        source: system
        description: "state dimension 4 of 4 - handset custody posture"
        default: AWAITING_DEVICE
        constraints: AWAITING_DEVICE | DEVICE_ISSUED | RECLAIM_PENDING
      - name: benefit_start_date
        type: datetime
        source: system
        description: logical-clock instant at which benefit_status first became ACTIVE; preserved verbatim across a completed ServiceTransfer and across an appeal reinstatement
      - name: benefit_end_date
        type: datetime
        source: system
        description: logical-clock instant at which benefit_status became DE_ENROLLED; reset to null on appeal reinstatement
        default: null
      - name: last_usage_at
        type: datetime
        source: system
        description: most recent qualifying usage instant; null until first usage, and cleared to null when a completed ServiceTransfer opens a fresh non-usage window
        default: null
      - name: non_usage_flagged_at
        type: datetime
        source: system
        description: logical-clock instant at which the compliance sweep set usage_status to NON_USAGE_FLAGGED; cleared to null on cure
        default: null
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: "output of calculations.non_usage_cure_window; null whenever non_usage_flagged_at is null"
        default: null
      - name: recert_due_date
        type: datetime
        source: computed
        description: "output of calculations.recertification_window; benefit_start_date + RECERT_CYCLE_DAYS on creation, reset to clock + RECERT_CYCLE_DAYS on a successful recertification"
      - name: recert_notice_sent_at
        type: datetime
        source: system
        description: logical-clock instant at which the compliance sweep set recert_status to NOTICED
        default: null
      - name: recert_response_deadline_at
        type: datetime
        source: computed
        description: "output of calculations.recertification_window; null whenever recert_notice_sent_at is null"
        default: null
      - name: recert_last_responded_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent successful recertification response
        default: null
      - name: recert_evaluated_income_cents
        type: integer
        source: computed
        description: "income figure the most recent recertification compared against recert_income_threshold_cents, produced by the three_month_averaged variant of calculations.eligibility_income_evaluation"
        default: null
      - name: recert_income_threshold_cents
        type: integer
        source: computed
        description: "snapshot of calculations.fpg_income_threshold taken during the most recent recertification, using the attested household_size and tribal_lands_flag"
        default: null
      - name: de_enrollment_reason
        type: enum
        source: system
        description: why benefit_status became DE_ENROLLED; reset to null on appeal reinstatement
        default: null
        constraints: "null | NON_USAGE | RECERT_NON_RESPONSE | INELIGIBLE_ON_RECERT | DUPLICATE_HOUSEHOLD | SUBSCRIBER_REQUEST | AUDIT_INELIGIBLE"
      - name: de_enrolled_at
        type: datetime
        source: system
        description: logical-clock instant of the de-enrollment; reset to null on appeal reinstatement
        default: null
      - name: de_enrolled_by_ref
        type: string
        source: system
        description: "X-User-ID of the actor that caused the de-enrollment (the sweep operator, the adjudicating auditor, the resolving administrator, or the de-enrolling agent). Compared against the deciding operator by the segregation-of-duties check at validations[priority=34]"
        default: null
      - name: port_freeze_until
        type: datetime
        source: computed
        description: "benefit_start_date + BENEFIT_PORT_FREEZE_DAYS days; a ServiceTransfer request at or before this instant is rejected"
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: "de_enrolled_at + APPEAL_WINDOW_DAYS days at 23:59:59.999Z, null while de_enrolled_at is null"
        default: null
      - name: transfer_count
        type: integer
        source: computed
        description: "count of ServiceTransfer where enrollment_id == this.id AND status == ACCEPTED_COMPLETED"
        default: 0
      - name: device_issuance_count
        type: integer
        source: computed
        description: "count of Device rows whose issued_enrollment_id equals this.id (retained after reclaim, retirement or loss, so this counter never decreases)"
        default: 0
      - name: last_device_issued_at
        type: datetime
        source: system
        description: issued_at of the most recently issued Device for this enrollment; anchors the device freeze interval
        default: null
      - name: audit_risk_score
        type: integer
        source: computed
        description: "output of calculations.enrollment_audit_risk_score; the primary ranking key of the audit-sample selector"
        default: 0
      - name: reinstatement_count
        type: integer
        source: computed
        description: "count of SubscriberCase rows where enrollment_id == this.id AND case_type == DE_ENROLLMENT_APPEAL AND status == GRANTED"
        default: 0

  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the carrier that owns this handset"
      - name: imei
        type: string
        source: input
        description: handset IMEI; unique across all Device rows
        constraints: exactly 15 digits; uniqueness violation -> ERR_INVALID_REQUEST
      - name: model_tier
        type: enum
        source: input
        description: handset class; the primary ranking key of the device selector
        constraints: BASIC | STANDARD | SMART
      - name: unit_cost_cents
        type: integer
        source: input
        description: carrier acquisition cost of the handset in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: custody state of the handset
        default: IN_STOCK
        constraints: IN_STOCK | ISSUED | RECLAIM_PENDING | RETIRED | LOST
      - name: issued_enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; the enrollment this handset was most recently issued to. Retained after reclaim so device_issuance_count stays monotone; null only while the handset has never been issued"
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent issuance
        default: null
      - name: returned_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent return
        default: null
      - name: return_condition
        type: enum
        source: system
        description: condition recorded at the most recent return; drives whether the handset re-enters stock or is retired, and whether the device freeze is waived
        default: null
        constraints: "null | GOOD | DAMAGED | LOST"

  - name: ServiceTransfer
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the benefit being ported"
      - name: target_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the carrier the benefit is porting to"
      - name: source_provider_id
        type: string
        source: system
        description: "FK -> Provider.id; snapshot of Enrollment.provider_id at request time"
      - name: subscriber_consent_ref
        type: string
        source: input
        description: reference to the recorded subscriber consent for the port
        constraints: 1-64 characters
      - name: status
        type: enum
        source: system
        description: port request disposition
        default: REQUESTED
        constraints: REQUESTED | ACCEPTED_COMPLETED | REJECTED | SUPERSEDED
      - name: rejection_reason
        type: enum
        source: system
        description: reason the target carrier rejected the port
        default: null
        constraints: "null | CONSENT_INVALID | TARGET_CAPACITY | OTHER"
      - name: requested_at
        type: datetime
        source: system
        description: logical-clock instant the port was requested
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant the port reached ACCEPTED_COMPLETED or REJECTED
        default: null
      - name: port_freeze_until_snapshot
        type: datetime
        source: system
        description: snapshot of Enrollment.port_freeze_until at request time, retained for audit

  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the carrier claiming subsidy"
      - name: service_month
        type: string
        source: input
        description: month of service the claim covers
        constraints: "YYYY-MM"
      - name: status
        type: enum
        source: system
        description: claim lifecycle position
        default: DRAFT
        constraints: DRAFT | FILED | UNDER_AUDIT | AUDIT_PASSED | AUDIT_FAILED | HELD | SUPERSEDED
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: "output of the provisional_snapshot variant of calculations.claim_support_amount, frozen at DRAFT creation"
      - name: final_amount_cents
        type: integer
        source: computed
        description: "output of the final_filed variant of calculations.claim_support_amount, frozen at the DRAFT -> FILED transition; null while status == DRAFT"
        default: null
      - name: variance_cents
        type: integer
        source: computed
        description: "final_amount_cents - provisional_amount_cents; null while status == DRAFT"
        default: null
      - name: covered_enrollment_count
        type: integer
        source: computed
        description: "cardinality of the input set of whichever variant last ran: the provisional_snapshot set while status == DRAFT, the final_filed set from FILED onward"
        default: 0
      - name: certifying_officer_ref
        type: string
        source: system
        description: officer reference supplied at filing
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of the DRAFT -> FILED transition
        default: null
      - name: audit_sample_count
        type: integer
        source: computed
        description: "count of AuditSample where claim_id == this.id"
        default: 0
      - name: failed_sample_count
        type: integer
        source: computed
        description: "count of AuditSample where claim_id == this.id AND status == ADJUDICATED_FAIL"
        default: 0
      - name: sample_drawn_by_ref
        type: string
        source: system
        description: "X-User-ID of the ComplianceAuditor that drew this claim audit sample; compared against the adjudicating auditor by the segregation-of-duties check at validations[priority=34]"
        default: null
      - name: recoupment_amount_cents
        type: integer
        source: computed
        description: "output of calculations.audit_recoupment_amount; 0 on the AUDIT_PASSED arm, null while the claim has not left UNDER_AUDIT"
        default: null
      - name: penalty_cents
        type: integer
        source: computed
        description: "the penalty component of calculations.audit_recoupment_amount, reported separately"
        default: null
      - name: net_payable_cents
        type: integer
        source: computed
        description: "final_amount_cents - recoupment_amount_cents; may be negative, meaning the carrier owes the fund"
        default: null

  - name: AuditSample
    parent: ReimbursementClaim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: system
        description: "FK -> ReimbursementClaim.id; the claim under audit"
      - name: enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; the sampled enrollment"
      - name: selection_rank
        type: integer
        source: system
        description: 1-based position this enrollment occupied in the selector ranking at draw time
      - name: risk_score_at_draw
        type: integer
        source: system
        description: snapshot of Enrollment.audit_risk_score at draw time
      - name: claimed_line_cents
        type: integer
        source: system
        description: snapshot of the per-enrollment line amount this enrollment contributed to the claim final_filed computation
      - name: drawn_by_ref
        type: string
        source: system
        description: X-User-ID of the ComplianceAuditor that drew the sample
      - name: status
        type: enum
        source: system
        description: adjudication state of this sampled line
        default: DRAWN
        constraints: DRAWN | ADJUDICATED_PASS | ADJUDICATED_FAIL
      - name: finding
        type: enum
        source: system
        description: auditor finding recorded at adjudication
        default: null
        constraints: "null | COMPLIANT | INELIGIBLE_SUBSCRIBER | DUPLICATE_HOUSEHOLD | NON_USAGE_UNCURED | MISSING_CERTIFICATION"
      - name: finding_note
        type: string
        source: system
        description: free-form auditor note
        default: null
      - name: adjudicated_by_ref
        type: string
        source: system
        description: X-User-ID of the adjudicating ComplianceAuditor
        default: null
      - name: disallowed_support_cents
        type: integer
        source: computed
        description: "claimed_line_cents when finding is set and finding != COMPLIANT, 0 when finding == COMPLIANT, null while status == DRAWN"
        default: null

  - name: SubscriberCase
    parent: null
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; the complaining or appealing subscriber"
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment the case concerns"
      - name: case_type
        type: enum
        source: input
        description: discriminator selecting which decision values and side effects apply
        constraints: SERVICE_COMPLAINT | DE_ENROLLMENT_APPEAL
      - name: narrative
        type: string
        source: input
        description: subscriber statement of the complaint or appeal
        constraints: 1-2000 characters
      - name: status
        type: enum
        source: system
        description: case lifecycle position
        default: SUBMITTED
        constraints: SUBMITTED | UNDER_REVIEW | REMANDED | GRANTED | DENIED | RESOLVED
      - name: reviewer_ref
        type: string
        source: system
        description: X-User-ID of the ProgramAdministrator currently assigned to review
        default: null
      - name: review_round
        type: integer
        source: computed
        description: "count of successful POST /lifeline/subscriber-cases/{id}/assign-review calls against this case; capped by MAX_REVIEW_ROUNDS (3)"
        default: 0
      - name: decision
        type: enum
        source: system
        description: decision recorded at the most recent decide call
        default: null
        constraints: "null | GRANT_REINSTATE | DENY | RESOLVE_WITH_CREDIT | REMAND"
      - name: decision_rationale
        type: string
        source: system
        description: free-form decision rationale
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent decide call
        default: null
      - name: decided_by_ref
        type: string
        source: system
        description: X-User-ID of the deciding ProgramAdministrator
        default: null
      - name: reinstated_enrollment_flag
        type: boolean
        source: computed
        description: "true when this case reached status == GRANTED and its enrollment benefit_status was rewritten from DE_ENROLLED to ACTIVE by that decision"
        default: false

state_machines:
  - entity: Subscriber
    state_field: status
    shape: cyclic
    initial_state: PROSPECT
    terminal_states: [BARRED]
    transitions:
      - from: PROSPECT
        to: DUPLICATE_HOLD
        trigger: "POST /lifeline/subscribers (evaluated inside the creating request)"
        actor: ProviderAgent
        preconditions:
          - "the HouseholdAddress named by address_id has status == DUPLICATE_FLAGGED at the instant of creation"
        side_effects:
          - "HouseholdAddress.updated_at refreshed on the referenced address (occupied_benefit_slots and cohort_address_count recomputed, values unchanged)"
        note: "the row is born in DUPLICATE_HOLD rather than PROSPECT; no separate request performs this edge"
      - from: PROSPECT
        to: ELIGIBILITY_PENDING
        trigger: "POST /lifeline/subscribers/{id}/eligibility-checks"
        actor: ProviderAgent
        preconditions:
          - "status == PROSPECT (a DUPLICATE_HOLD subscriber may create a check but its status is left at DUPLICATE_HOLD)"
        side_effects:
          - "a new EligibilityCheck row is created in PENDING_VERIFIER"
      - from: DE_ENROLLED
        to: PROSPECT
        trigger: "POST /lifeline/subscribers/{id}/eligibility-checks"
        actor: ProviderAgent
        preconditions:
          - "status == DE_ENROLLED"
          - "de_enrollment_count < SUBSCRIBER_BAR_THRESHOLD (2)"
        side_effects:
          - "a new EligibilityCheck row is created in PENDING_VERIFIER"
        note: "re-application path; closes the PROSPECT -> ENROLLED -> DE_ENROLLED -> PROSPECT cycle. The SAME request then applies the PROSPECT -> ELIGIBILITY_PENDING edge, so a re-applying subscriber is observably ELIGIBILITY_PENDING when the create returns, never left at PROSPECT."
      - from: ELIGIBILITY_PENDING
        to: VERIFIED_ELIGIBLE
        trigger: "POST /lifeline/eligibility-checks/{id}/verifier-result with verifier_outcome == MATCH"
        actor: NationalVerifier
        preconditions:
          - "the check status == PENDING_VERIFIER"
          - "subscriber.status == ELIGIBILITY_PENDING"
        side_effects:
          - "EligibilityCheck.status -> ELIGIBLE_CONFIRMED, confirmed_at = clock now, expires_at recomputed"
          - "Subscriber.eligibility_basis recomputed"
      - from: ELIGIBILITY_PENDING
        to: PROSPECT
        trigger: "POST /lifeline/eligibility-checks/{id}/verifier-result with verifier_outcome == NO_MATCH"
        actor: NationalVerifier
        preconditions:
          - "the check status == PENDING_VERIFIER"
        side_effects:
          - "EligibilityCheck.status -> INELIGIBLE, verifier_reason_code stored"
        note: "reverts the applicant so a fresh check can be created; ELIGIBILITY_PENDING -> PROSPECT -> ELIGIBILITY_PENDING is the screening retry cycle"
      - from: DUPLICATE_HOLD
        to: VERIFIED_ELIGIBLE
        trigger: "system cascade: HouseholdAddress.status leaves DUPLICATE_FLAGGED (either resolution arm, or the sweep-driven RESOLVED_SINGLE_HOUSEHOLD edge)"
        actor: system
        preconditions:
          - "subscriber has at least one EligibilityCheck with status == ELIGIBLE_CONFIRMED and clock now <= that check expires_at"
        side_effects:
          - "Subscriber.updated_at refreshed and version incremented by 1"
        note: "when several confirmed checks exist the unexpired-check test is an existence test, so no ranking is required"
      - from: DUPLICATE_HOLD
        to: PROSPECT
        trigger: "system cascade: HouseholdAddress.status leaves DUPLICATE_FLAGGED"
        actor: system
        preconditions:
          - "subscriber has NO EligibilityCheck with status == ELIGIBLE_CONFIRMED and clock now <= that check expires_at"
        side_effects:
          - "Subscriber.updated_at refreshed and version incremented by 1"
      - from: VERIFIED_ELIGIBLE
        to: ENROLLED
        trigger: "POST /lifeline/enrollments"
        actor: ProviderAgent
        preconditions:
          - "status == VERIFIED_ELIGIBLE"
        side_effects:
          - "an Enrollment row is created with benefit_status = ACTIVE"
      - from: ENROLLED
        to: DE_ENROLLED
        trigger: "system: any Enrollment benefit_status ACTIVE -> DE_ENROLLED edge for this subscriber"
        actor: system
        preconditions:
          - "de_enrollment_count after the write is < SUBSCRIBER_BAR_THRESHOLD (2)"
        side_effects:
          - "de_enrollment_count recomputed"
      - from: ENROLLED
        to: BARRED
        trigger: "system: any Enrollment benefit_status ACTIVE -> DE_ENROLLED edge for this subscriber"
        actor: system
        preconditions:
          - "de_enrollment_count after the write is >= SUBSCRIBER_BAR_THRESHOLD (2)"
        side_effects:
          - "de_enrollment_count recomputed"
        note: "BARRED is terminal: POST /lifeline/subscribers/{id}/eligibility-checks is rejected with ERR_SUBSCRIBER_BARRED"
      - from: DE_ENROLLED
        to: ENROLLED
        trigger: "POST /lifeline/subscriber-cases/{id}/decide with decision == GRANT_REINSTATE"
        actor: ProgramAdministrator
        preconditions:
          - "the case case_type == DE_ENROLLMENT_APPEAL and its enrollment benefit_status == DE_ENROLLED"
        side_effects:
          - "Enrollment.benefit_status -> ACTIVE (see the Enrollment.benefit_status machine for the full reinstatement cascade)"

  - entity: HouseholdAddress
    state_field: status
    shape: cyclic
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: DUPLICATE_FLAGGED
        trigger: "POST /lifeline/addresses (a sibling row with an equal address_hash is created, or this row is itself the newcomer into an existing cohort)"
        actor: ProviderAgent
        preconditions:
          - "cohort_address_count after the create is >= 2, i.e. at least two HouseholdAddress rows share this address_hash"
        side_effects:
          - "every HouseholdAddress row in the cohort whose status IN {UNVERIFIED, RESOLVED_MULTI_HOUSEHOLD, RESOLVED_SINGLE_HOUSEHOLD} gets status -> DUPLICATE_FLAGGED, cohort_address_count recomputed, updated_at refreshed, version incremented by 1"
          - "max_permitted_benefit_slots recomputed to 1 on every row that left RESOLVED_MULTI_HOUSEHOLD"
      - from: RESOLVED_MULTI_HOUSEHOLD
        to: DUPLICATE_FLAGGED
        trigger: "POST /lifeline/addresses (a further sibling row with an equal address_hash is created)"
        actor: ProviderAgent
        preconditions:
          - "cohort_address_count after the create is >= 2"
        side_effects:
          - "declared_household_count and independent_household_worksheet_ref are left intact for audit but max_permitted_benefit_slots recomputes to 1"
        note: "re-entry edge: a resolved dwelling can be pulled back into a duplicate cohort"
      - from: RESOLVED_SINGLE_HOUSEHOLD
        to: DUPLICATE_FLAGGED
        trigger: "POST /lifeline/addresses (a further sibling row with an equal address_hash is created)"
        actor: ProviderAgent
        preconditions:
          - "cohort_address_count after the create is >= 2"
        side_effects:
          - "cohort_address_count recomputed, version incremented by 1"
      - from: DUPLICATE_FLAGGED
        to: RESOLVED_MULTI_HOUSEHOLD
        trigger: "POST /lifeline/addresses/{id}/duplicate-resolution with resolution == MULTI_HOUSEHOLD"
        actor: ProgramAdministrator
        preconditions:
          - "status == DUPLICATE_FLAGGED"
          - "expected_address_version equals this row current version"
          - "declared_household_count >= 2 and independent_household_worksheet_ref is supplied"
        side_effects:
          - "declared_household_count and independent_household_worksheet_ref written from the request"
          - "max_permitted_benefit_slots recomputed to declared_household_count"
          - "every Subscriber with address_id == this.id and status == DUPLICATE_HOLD is released per the Subscriber machine (VERIFIED_ELIGIBLE or PROSPECT)"
          - "version incremented by 1"
      - from: DUPLICATE_FLAGGED
        to: RESOLVED_SINGLE_HOUSEHOLD
        trigger: "POST /lifeline/addresses/{id}/duplicate-resolution with resolution == SINGLE_HOUSEHOLD"
        actor: ProgramAdministrator
        preconditions:
          - "status == DUPLICATE_FLAGGED"
          - "expected_address_version equals this row current version"
        side_effects:
          - "declared_household_count -> null, independent_household_worksheet_ref -> null, max_permitted_benefit_slots recomputed to 1"
          - "CASCADE LINK 1: the Enrollment rows with certified_address_id == this.id AND benefit_status == ACTIVE are ordered by benefit_start_date ASC then created_at ASC; the first row is retained and every subsequent row gets benefit_status ACTIVE -> DE_ENROLLED with de_enrollment_reason = DUPLICATE_HOUSEHOLD, de_enrolled_at = clock now, de_enrolled_by_ref = X-User-ID"
          - "CASCADE LINK 2 (caused by link 1): each de-enrolled Enrollment with device_status == DEVICE_ISSUED gets device_status -> RECLAIM_PENDING and its currently ISSUED Device gets status -> RECLAIM_PENDING"
          - "CASCADE LINK 3 (caused by link 2): the owning Provider devices_issued_count and devices_reclaim_pending_count are recomputed and Provider.version incremented by 1"
          - "occupied_benefit_slots recomputed"
          - "every Subscriber with address_id == this.id and status == DUPLICATE_HOLD is released per the Subscriber machine"
          - "version incremented by 1"
      - from: DUPLICATE_FLAGGED
        to: RESOLVED_SINGLE_HOUSEHOLD
        trigger: "system cascade: an Enrollment benefit_status ACTIVE -> DE_ENROLLED write drops this row occupied_benefit_slots to 0"
        actor: system
        preconditions:
          - "status == DUPLICATE_FLAGGED"
          - "occupied_benefit_slots after the recompute == 0"
        side_effects:
          - "max_permitted_benefit_slots recomputed to 1, declared_household_count -> null, independent_household_worksheet_ref -> null"
          - "every Subscriber with address_id == this.id and status == DUPLICATE_HOLD is released per the Subscriber machine"
          - "version incremented by 1"
        note: "auto-resolution edge: an emptied dwelling can no longer be a duplicate, so the flag clears itself"

  - entity: EligibilityCheck
    state_field: status
    shape: cyclic
    initial_state: PENDING_VERIFIER
    terminal_states: [ELIGIBLE_CONFIRMED, INELIGIBLE]
    transitions:
      - from: PENDING_VERIFIER
        to: ELIGIBLE_CONFIRMED
        trigger: "POST /lifeline/eligibility-checks/{id}/verifier-result with verifier_outcome == MATCH"
        actor: NationalVerifier
        preconditions:
          - "status == PENDING_VERIFIER"
          - "when claimed_basis == BENEFIT the request must supply matched_benefit"
        side_effects:
          - "confirmed_at = clock now, expires_at = confirmed_at + ELIGIBILITY_VALID_DAYS days"
          - "Subscriber.status ELIGIBILITY_PENDING -> VERIFIED_ELIGIBLE (DUPLICATE_HOLD is left untouched)"
          - "Subscriber.eligibility_basis recomputed"
      - from: PENDING_VERIFIER
        to: INELIGIBLE
        trigger: "POST /lifeline/eligibility-checks/{id}/verifier-result with verifier_outcome == NO_MATCH"
        actor: NationalVerifier
        preconditions:
          - "status == PENDING_VERIFIER"
        side_effects:
          - "verifier_reason_code stored"
          - "Subscriber.status ELIGIBILITY_PENDING -> PROSPECT"
      - from: PENDING_VERIFIER
        to: DOCUMENTATION_REQUIRED
        trigger: "POST /lifeline/eligibility-checks/{id}/verifier-result with verifier_outcome == DOCUMENTATION_REQUIRED"
        actor: NationalVerifier
        preconditions:
          - "status == PENDING_VERIFIER"
        side_effects:
          - "verifier_reason_code stored; Subscriber.status is left at ELIGIBILITY_PENDING"
      - from: DOCUMENTATION_REQUIRED
        to: PENDING_VERIFIER
        trigger: "POST /lifeline/eligibility-checks/{id}/resubmit-documentation"
        actor: ProviderAgent
        preconditions:
          - "status == DOCUMENTATION_REQUIRED"
          - "resubmission_count < MAX_DOCUMENTATION_RESUBMISSIONS (2)"
        side_effects:
          - "proof_document_ref overwritten from the request, resubmission_count incremented by 1, verifier_outcome -> null, verifier_reason_code -> null"
        note: "cycle: PENDING_VERIFIER -> DOCUMENTATION_REQUIRED -> PENDING_VERIFIER, bounded by MAX_DOCUMENTATION_RESUBMISSIONS"

  - entity: Enrollment
    state_field: benefit_status
    shape: cyclic
    dimension: "1 of 4 independent state dimensions on the Enrollment row"
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DE_ENROLLED
        trigger: "POST /lifeline/enrollments/{id}/de-enroll"
        actor: ProviderAgent
        preconditions:
          - "benefit_status == ACTIVE"
          - "de_enrollment_reason in the request IN {SUBSCRIBER_REQUEST, DUPLICATE_HOUSEHOLD}"
        side_effects:
          - "benefit_end_date = clock now, de_enrolled_at = clock now, de_enrolled_by_ref = X-User-ID, de_enrollment_reason from the request"
          - "appeal_deadline_at recomputed"
          - "certified address occupied_benefit_slots recomputed; if it reaches 0 while that address status == DUPLICATE_FLAGGED the address auto-resolves to RESOLVED_SINGLE_HOUSEHOLD"
          - "Provider.active_enrollment_count recomputed"
          - "Subscriber.status ENROLLED -> DE_ENROLLED or BARRED per the Subscriber machine"
          - "if device_status == DEVICE_ISSUED then device_status -> RECLAIM_PENDING and the ISSUED Device -> RECLAIM_PENDING, then Provider device counters recomputed and Provider.version incremented by 1"
          - "audit_risk_score recomputed"
      - from: ACTIVE
        to: DE_ENROLLED
        trigger: "POST /lifeline/providers/{id}/compliance-sweep, non-usage cure expiry arm"
        actor: ProgramAdministrator
        preconditions:
          - "benefit_status == ACTIVE"
          - "usage_status == NON_USAGE_FLAGGED"
          - "clock now > cure_deadline_at"
        side_effects:
          - "usage_status -> CURE_EXPIRED first, and because usage_status became CURE_EXPIRED benefit_status -> DE_ENROLLED with de_enrollment_reason = NON_USAGE"
          - "benefit_end_date = clock now, de_enrolled_at = clock now, de_enrolled_by_ref = X-User-ID of the sweep operator, appeal_deadline_at recomputed"
          - "the same address / provider / subscriber / device cascade as the manual de-enroll edge"
      - from: ACTIVE
        to: DE_ENROLLED
        trigger: "POST /lifeline/providers/{id}/compliance-sweep, recertification non-response arm"
        actor: ProgramAdministrator
        preconditions:
          - "benefit_status == ACTIVE"
          - "recert_status == NOTICED"
          - "clock now > recert_response_deadline_at"
        side_effects:
          - "CASCADE LINK 1: recert_status -> NON_RESPONSIVE"
          - "CASCADE LINK 2 (caused by link 1): because recert_status became NON_RESPONSIVE, benefit_status -> DE_ENROLLED with de_enrollment_reason = RECERT_NON_RESPONSE, benefit_end_date = clock now, de_enrolled_at = clock now, de_enrolled_by_ref = X-User-ID"
          - "CASCADE LINK 3 (caused by link 2): because benefit_status became DE_ENROLLED, the certified HouseholdAddress occupied_benefit_slots is recomputed; when it reaches 0 while that address status == DUPLICATE_FLAGGED the address status -> RESOLVED_SINGLE_HOUSEHOLD and its version increments by 1"
          - "CASCADE LINK 4 (caused by link 3): because the address left DUPLICATE_FLAGGED, every Subscriber with address_id == that address AND status == DUPLICATE_HOLD is released to VERIFIED_ELIGIBLE (unexpired ELIGIBLE_CONFIRMED check exists) or PROSPECT (none), each with version incremented by 1"
          - "Provider.active_enrollment_count recomputed; Subscriber.status ENROLLED -> DE_ENROLLED or BARRED; device reclaim cascade as on the manual edge"
      - from: ACTIVE
        to: DE_ENROLLED
        trigger: "POST /lifeline/enrollments/{id}/recertify, ineligible arm"
        actor: Subscriber
        preconditions:
          - "benefit_status == ACTIVE"
          - "recert_status == NOTICED and clock now <= recert_response_deadline_at"
          - "recert_evaluated_income_cents > recert_income_threshold_cents (three_month_averaged variant) AND attested_qualifying_benefit == NONE"
        side_effects:
          - "recert_status -> RESPONDED_INELIGIBLE first, and because recert_status became RESPONDED_INELIGIBLE benefit_status -> DE_ENROLLED with de_enrollment_reason = INELIGIBLE_ON_RECERT"
          - "the same address / provider / subscriber / device cascade as the manual de-enroll edge"
      - from: ACTIVE
        to: DE_ENROLLED
        trigger: "POST /lifeline/addresses/{id}/duplicate-resolution with resolution == SINGLE_HOUSEHOLD, excess-occupant arm"
        actor: ProgramAdministrator
        preconditions:
          - "benefit_status == ACTIVE"
          - "this enrollment is not the earliest ACTIVE occupant of the address under the ordering benefit_start_date ASC then created_at ASC"
        side_effects:
          - "de_enrollment_reason = DUPLICATE_HOUSEHOLD, benefit_end_date = clock now, de_enrolled_by_ref = X-User-ID"
          - "device reclaim cascade, provider counters, subscriber status per the manual edge"
      - from: ACTIVE
        to: DE_ENROLLED
        trigger: "POST /lifeline/audit-samples/{id}/adjudicate with finding IN {INELIGIBLE_SUBSCRIBER, DUPLICATE_HOUSEHOLD, MISSING_CERTIFICATION}"
        actor: ComplianceAuditor
        preconditions:
          - "benefit_status == ACTIVE"
        side_effects:
          - "de_enrollment_reason = AUDIT_INELIGIBLE, benefit_end_date = clock now, de_enrolled_at = clock now, de_enrolled_by_ref = X-User-ID of the adjudicating auditor"
          - "appeal_deadline_at recomputed; the de_enrolled_by_ref written here is exactly the identity the segregation-of-duties check blocks from deciding the resulting appeal"
          - "device reclaim cascade, provider counters, subscriber status per the manual edge"
        note: "finding == NON_USAGE_UNCURED records an ADJUDICATED_FAIL but leaves benefit_status untouched"
      - from: DE_ENROLLED
        to: ACTIVE
        trigger: "POST /lifeline/subscriber-cases/{id}/decide with decision == GRANT_REINSTATE"
        actor: ProgramAdministrator
        preconditions:
          - "benefit_status == DE_ENROLLED"
          - "the case case_type == DE_ENROLLMENT_APPEAL and case status == UNDER_REVIEW"
          - "X-User-ID != this enrollment de_enrolled_by_ref"
        side_effects:
          - "benefit_end_date -> null, de_enrollment_reason -> null, de_enrolled_at -> null, de_enrolled_by_ref -> null, appeal_deadline_at -> null; benefit_start_date is preserved verbatim so port_freeze_until and recert_due_date do not move"
          - "usage_status -> PENDING_FIRST_USE and last_usage_at -> null, non_usage_flagged_at -> null (a fresh non-usage window opens)"
          - "recert_status -> NOT_DUE and recert_notice_sent_at -> null, recert_response_deadline_at -> null"
          - "reinstatement_count recomputed; certified address occupied_benefit_slots recomputed; Provider.active_enrollment_count recomputed; Subscriber.status DE_ENROLLED -> ENROLLED"
          - "when de_enrollment_reason was AUDIT_INELIGIBLE: the compensating audit reversal fires - see the AuditSample and ReimbursementClaim machines"
        note: "reinstatement is the compensating action of calculations.provider_ledger_reconciliation and of calculations.household_benefit_occupancy"

  - entity: Enrollment
    state_field: usage_status
    shape: cyclic
    dimension: "2 of 4 independent state dimensions on the Enrollment row"
    initial_state: PENDING_FIRST_USE
    terminal_states: []
    transitions:
      - from: PENDING_FIRST_USE
        to: USING
        trigger: "POST /lifeline/enrollments/{id}/usage"
        actor: ProviderAgent
        preconditions:
          - "benefit_status == ACTIVE"
        side_effects:
          - "last_usage_at = usage_at from the request when supplied, else clock now"
          - "audit_risk_score recomputed"
      - from: USING
        to: USING
        trigger: "POST /lifeline/enrollments/{id}/usage"
        actor: ProviderAgent
        preconditions:
          - "benefit_status == ACTIVE"
        side_effects:
          - "last_usage_at advanced; version incremented by 1"
        note: "self-edge: repeated usage refreshes the non-usage anchor without changing usage_status"
      - from: PENDING_FIRST_USE
        to: NON_USAGE_FLAGGED
        trigger: "POST /lifeline/providers/{id}/compliance-sweep, non-usage detection arm"
        actor: ProgramAdministrator
        preconditions:
          - "benefit_status == ACTIVE"
          - "floor((clock now - benefit_start_date) / 1 day) >= NON_USAGE_WINDOW_DAYS (30), because last_usage_at is null and the anchor falls back to benefit_start_date"
        side_effects:
          - "non_usage_flagged_at = clock now, cure_deadline_at recomputed per calculations.non_usage_cure_window"
          - "audit_risk_score recomputed (the NON_USAGE_FLAGGED term adds 30)"
      - from: USING
        to: NON_USAGE_FLAGGED
        trigger: "POST /lifeline/providers/{id}/compliance-sweep, non-usage detection arm"
        actor: ProgramAdministrator
        preconditions:
          - "benefit_status == ACTIVE"
          - "floor((clock now - last_usage_at) / 1 day) >= NON_USAGE_WINDOW_DAYS (30)"
        side_effects:
          - "non_usage_flagged_at = clock now, cure_deadline_at recomputed"
          - "audit_risk_score recomputed"
      - from: NON_USAGE_FLAGGED
        to: USING
        trigger: "POST /lifeline/enrollments/{id}/usage"
        actor: ProviderAgent
        preconditions:
          - "benefit_status == ACTIVE"
          - "clock now <= cure_deadline_at (inclusive; the instant equal to cure_deadline_at still cures)"
        side_effects:
          - "last_usage_at = clock now, non_usage_flagged_at -> null, cure_deadline_at -> null"
          - "audit_risk_score recomputed (the NON_USAGE_FLAGGED term drops back to 0)"
        note: "cure edge; closes the USING -> NON_USAGE_FLAGGED -> USING cycle"
      - from: NON_USAGE_FLAGGED
        to: CURE_EXPIRED
        trigger: "POST /lifeline/providers/{id}/compliance-sweep, cure expiry arm"
        actor: ProgramAdministrator
        preconditions:
          - "benefit_status == ACTIVE"
          - "clock now > cure_deadline_at"
        side_effects:
          - "because usage_status became CURE_EXPIRED, benefit_status -> DE_ENROLLED with de_enrollment_reason = NON_USAGE (see the benefit_status machine)"
      - from: USING
        to: PENDING_FIRST_USE
        trigger: "POST /lifeline/service-transfers/{id}/accept"
        actor: ProviderAgent
        preconditions:
          - "the transfer status == REQUESTED and its enrollment benefit_status == ACTIVE"
        side_effects:
          - "last_usage_at -> null, non_usage_flagged_at -> null, cure_deadline_at -> null; a fresh NON_USAGE_WINDOW_DAYS window opens anchored on benefit_start_date"
        note: "reset edge; the port does not carry usage history across carriers"

  - entity: Enrollment
    state_field: recert_status
    shape: cyclic
    dimension: "3 of 4 independent state dimensions on the Enrollment row"
    initial_state: NOT_DUE
    terminal_states: [RESPONDED_INELIGIBLE]
    transitions:
      - from: NOT_DUE
        to: NOTICED
        trigger: "POST /lifeline/providers/{id}/compliance-sweep, recertification notice arm"
        actor: ProgramAdministrator
        preconditions:
          - "benefit_status == ACTIVE"
          - "clock now >= recert_due_date - RECERT_NOTICE_LEAD_DAYS (60) days"
        side_effects:
          - "recert_notice_sent_at = clock now, recert_response_deadline_at = date(clock now) + RECERT_RESPONSE_DAYS (60) days at 23:59:59.999Z"
      - from: NOTICED
        to: NOT_DUE
        trigger: "POST /lifeline/enrollments/{id}/recertify, eligible arm"
        actor: Subscriber
        preconditions:
          - "benefit_status == ACTIVE"
          - "recert_status == NOTICED and clock now <= recert_response_deadline_at"
          - "the attested figures satisfy the three_month_averaged variant of calculations.eligibility_income_evaluation OR attested_qualifying_benefit != NONE"
        side_effects:
          - "Subscriber.household_size, annual_income_cents, last_3mo_income_cents and qualifying_benefit overwritten from the attestation; Subscriber.income_threshold_cents recomputed"
          - "recert_evaluated_income_cents and recert_income_threshold_cents written"
          - "recert_last_responded_at = clock now, recert_notice_sent_at -> null, recert_response_deadline_at -> null"
          - "recert_due_date = date(clock now) + RECERT_CYCLE_DAYS (365) days"
        note: "closes the NOT_DUE -> NOTICED -> NOT_DUE annual cycle"
      - from: NOTICED
        to: RESPONDED_INELIGIBLE
        trigger: "POST /lifeline/enrollments/{id}/recertify, ineligible arm"
        actor: Subscriber
        preconditions:
          - "benefit_status == ACTIVE"
          - "recert_status == NOTICED and clock now <= recert_response_deadline_at"
          - "recert_evaluated_income_cents > recert_income_threshold_cents AND attested_qualifying_benefit == NONE"
        side_effects:
          - "Subscriber fields and recert_* snapshots written exactly as on the eligible arm"
          - "because recert_status became RESPONDED_INELIGIBLE, benefit_status -> DE_ENROLLED with de_enrollment_reason = INELIGIBLE_ON_RECERT"
      - from: NOTICED
        to: NON_RESPONSIVE
        trigger: "POST /lifeline/providers/{id}/compliance-sweep, recertification non-response arm"
        actor: ProgramAdministrator
        preconditions:
          - "benefit_status == ACTIVE"
          - "clock now > recert_response_deadline_at"
        side_effects:
          - "because recert_status became NON_RESPONSIVE, benefit_status -> DE_ENROLLED with de_enrollment_reason = RECERT_NON_RESPONSE (cascade link 2 of the four-link recertification cascade)"

  - entity: Enrollment
    state_field: device_status
    shape: cyclic
    dimension: "4 of 4 independent state dimensions on the Enrollment row"
    initial_state: AWAITING_DEVICE
    terminal_states: []
    transitions:
      - from: AWAITING_DEVICE
        to: DEVICE_ISSUED
        trigger: "POST /lifeline/enrollments/{id}/device-issuance"
        actor: ProviderAgent
        preconditions:
          - "benefit_status == ACTIVE"
          - "device_status == AWAITING_DEVICE"
          - "the device freeze interval of calculations.device_issuance_freeze_window does not contain clock now, or is waived"
          - "the selected Device status == IN_STOCK and its provider_id == enrollment.provider_id"
        side_effects:
          - "the selected Device status -> ISSUED, issued_enrollment_id = this enrollment id, issued_at = clock now"
          - "last_device_issued_at = clock now, device_issuance_count recomputed, audit_risk_score recomputed"
          - "Provider devices_in_stock_count and devices_issued_count recomputed, Provider.version incremented by 1"
      - from: DEVICE_ISSUED
        to: AWAITING_DEVICE
        trigger: "POST /lifeline/devices/{id}/return"
        actor: ProviderAgent
        preconditions:
          - "the device status == ISSUED and device.issued_enrollment_id == this enrollment id"
        side_effects:
          - "Device status -> IN_STOCK (return_condition GOOD), RETIRED (DAMAGED) or LOST (LOST); returned_at = clock now"
          - "Provider device counters recomputed and Provider.version incremented by 1; devices_total_count is unchanged"
        note: "compensating action of the issuance edge; closes the AWAITING_DEVICE -> DEVICE_ISSUED -> AWAITING_DEVICE cycle"
      - from: DEVICE_ISSUED
        to: RECLAIM_PENDING
        trigger: "system cascade: this enrollment benefit_status ACTIVE -> DE_ENROLLED, or POST /lifeline/service-transfers/{id}/accept"
        actor: system
        preconditions:
          - "device_status == DEVICE_ISSUED"
        side_effects:
          - "the ISSUED Device status -> RECLAIM_PENDING; issued_enrollment_id retained so device_issuance_count stays monotone"
          - "Provider devices_issued_count and devices_reclaim_pending_count recomputed, Provider.version incremented by 1"
      - from: RECLAIM_PENDING
        to: AWAITING_DEVICE
        trigger: "POST /lifeline/devices/{id}/return"
        actor: ProviderAgent
        preconditions:
          - "the device status == RECLAIM_PENDING and device.issued_enrollment_id == this enrollment id"
        side_effects:
          - "Device status -> IN_STOCK / RETIRED / LOST per return_condition; Provider device counters recomputed, Provider.version incremented by 1"

  - entity: Device
    state_field: status
    shape: cyclic
    initial_state: IN_STOCK
    terminal_states: [RETIRED, LOST]
    transitions:
      - from: IN_STOCK
        to: ISSUED
        trigger: "POST /lifeline/enrollments/{id}/device-issuance"
        actor: ProviderAgent
        preconditions:
          - "status == IN_STOCK"
          - "provider_id == enrollment.provider_id"
        side_effects:
          - "issued_enrollment_id, issued_at written; returned_at -> null, return_condition -> null"
          - "Provider devices_in_stock_count decremented and devices_issued_count incremented by recompute; devices_total_count unchanged"
      - from: ISSUED
        to: IN_STOCK
        trigger: "POST /lifeline/devices/{id}/return with return_condition == GOOD"
        actor: ProviderAgent
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "returned_at = clock now, return_condition = GOOD; Enrollment.device_status -> AWAITING_DEVICE"
          - "Provider devices_issued_count and devices_in_stock_count recomputed back to their pre-issuance values"
        note: "conservation edge of calculations.device_inventory_conservation"
      - from: ISSUED
        to: RETIRED
        trigger: "POST /lifeline/devices/{id}/return with return_condition == DAMAGED"
        actor: ProviderAgent
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "Provider devices_retired_count incremented by recompute; devices_total_count unchanged"
          - "the device freeze of calculations.device_issuance_freeze_window becomes waived for the enrollment"
      - from: ISSUED
        to: LOST
        trigger: "POST /lifeline/devices/{id}/return with return_condition == LOST"
        actor: ProviderAgent
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "Provider devices_retired_count incremented by recompute; the device freeze becomes waived"
      - from: ISSUED
        to: RECLAIM_PENDING
        trigger: "system cascade: the issued enrollment benefit_status -> DE_ENROLLED, or its ServiceTransfer completes"
        actor: system
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "Enrollment.device_status -> RECLAIM_PENDING; Provider device counters recomputed"
      - from: RECLAIM_PENDING
        to: IN_STOCK
        trigger: "POST /lifeline/devices/{id}/return with return_condition == GOOD"
        actor: ProviderAgent
        preconditions:
          - "status == RECLAIM_PENDING"
        side_effects:
          - "Enrollment.device_status -> AWAITING_DEVICE; Provider device counters recomputed"
        note: "closes the IN_STOCK -> ISSUED -> RECLAIM_PENDING -> IN_STOCK cycle"
      - from: RECLAIM_PENDING
        to: RETIRED
        trigger: "POST /lifeline/devices/{id}/return with return_condition == DAMAGED"
        actor: ProviderAgent
        preconditions:
          - "status == RECLAIM_PENDING"
        side_effects:
          - "Provider devices_retired_count incremented by recompute"
      - from: RECLAIM_PENDING
        to: LOST
        trigger: "POST /lifeline/devices/{id}/return with return_condition == LOST"
        actor: ProviderAgent
        preconditions:
          - "status == RECLAIM_PENDING"
        side_effects:
          - "Provider devices_retired_count incremented by recompute"

  - entity: ServiceTransfer
    state_field: status
    shape: branching
    initial_state: REQUESTED
    terminal_states: [ACCEPTED_COMPLETED, REJECTED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED_COMPLETED
        trigger: "POST /lifeline/service-transfers/{id}/accept"
        actor: ProviderAgent
        preconditions:
          - "status == REQUESTED"
          - "X-User-ID == target_provider_id"
          - "the enrollment benefit_status == ACTIVE"
          - "target Provider status == ACTIVE and active_enrollment_count + 1 <= enrollment_cap"
        side_effects:
          - "completed_at = clock now"
          - "CASCADE LINK 1: Enrollment.provider_id -> target_provider_id, transfer_count recomputed, audit_risk_score recomputed (the transfer term adds 15); benefit_start_date, port_freeze_until and recert_due_date are preserved verbatim"
          - "CASCADE LINK 2 (caused by link 1): because provider_id changed, the Device with issued_enrollment_id == enrollment.id and status == ISSUED (owned by the source carrier) gets status -> RECLAIM_PENDING; source Provider devices_issued_count and devices_reclaim_pending_count recomputed and its version incremented by 1"
          - "CASCADE LINK 3 (caused by link 2): because the handset entered RECLAIM_PENDING, Enrollment.device_status -> RECLAIM_PENDING and usage_status -> PENDING_FIRST_USE with last_usage_at -> null, opening a fresh NON_USAGE_WINDOW_DAYS window"
          - "source and target Provider active_enrollment_count recomputed"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /lifeline/service-transfers/{id}/reject"
        actor: ProviderAgent
        preconditions:
          - "status == REQUESTED"
          - "X-User-ID == target_provider_id"
        side_effects:
          - "rejection_reason from the request, completed_at = clock now; the Enrollment is untouched"
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "POST /lifeline/service-transfers (a newer request is created for the same enrollment_id)"
        actor: ProviderAgent
        preconditions:
          - "status == REQUESTED"
          - "the newer request carries expected_enrollment_version equal to the enrollment current version"
        side_effects:
          - "completed_at = clock now; Enrollment.version incremented by 1 by the creating request"
        note: "the legitimate supersede that makes concurrency_rules.transfer-request-stale-enrollment a true race rather than a state precondition"

  - entity: ReimbursementClaim
    state_field: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /lifeline/reimbursement-claims/{id}/file"
        actor: ProviderAgent
        preconditions:
          - "status == DRAFT"
          - "the service_month is closed: date(clock now) > last calendar day of service_month"
          - "Provider status == ACTIVE and audit_hold_flag == false"
        side_effects:
          - "final_amount_cents computed by the final_filed variant of calculations.claim_support_amount, variance_cents and covered_enrollment_count rewritten, certifying_officer_ref and filed_at written"
          - "Provider claim_gross_cents, net_reimbursed_cents and open_claim_count recomputed, Provider.version incremented by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /lifeline/reimbursement-claims (a newer DRAFT is created for the same provider_id and service_month)"
        actor: ProviderAgent
        preconditions:
          - "status == DRAFT"
          - "the newer request carries expected_provider_version equal to the provider current version"
        side_effects:
          - "Provider open_claim_count recomputed and Provider.version incremented by 1 by the creating request"
      - from: FILED
        to: UNDER_AUDIT
        trigger: "POST /lifeline/reimbursement-claims/{id}/audit-draw"
        actor: ComplianceAuditor
        preconditions:
          - "status == FILED"
          - "sample_size between 1 and MAX_SAMPLE_SIZE (50)"
          - "the candidate pool of calculations.audit_sample_selection is non-empty"
        side_effects:
          - "one AuditSample row per selected enrollment in DRAWN, each with selection_rank, risk_score_at_draw, claimed_line_cents and drawn_by_ref"
          - "audit_sample_count recomputed, sample_drawn_by_ref = X-User-ID"
      - from: FILED
        to: HELD
        trigger: "system cascade: the owning Provider audit_hold_flag becomes true"
        actor: system
        preconditions:
          - "status == FILED"
        side_effects:
          - "no monetary recompute; claim_gross_cents still counts this claim"
        note: "cascade link 3 of the audit-failure cascade"
      - from: HELD
        to: FILED
        trigger: "system cascade: the owning Provider audit_hold_flag becomes false"
        actor: system
        preconditions:
          - "status == HELD"
        side_effects:
          - "the claim becomes auditable again"
        note: "closes the FILED -> HELD -> FILED cycle"
      - from: UNDER_AUDIT
        to: AUDIT_FAILED
        trigger: "POST /lifeline/audit-samples/{id}/adjudicate with finding != COMPLIANT (fail-fast arm)"
        actor: ComplianceAuditor
        preconditions:
          - "status == UNDER_AUDIT"
          - "failed_sample_count after this adjudication is >= 1"
        side_effects:
          - "recoupment_amount_cents, penalty_cents and net_payable_cents computed by calculations.audit_recoupment_amount"
          - "CASCADE LINK 2 (caused by this status write): Provider recouped_cents and net_reimbursed_cents recomputed, audit_hold_flag -> true, Provider.version incremented by 1"
          - "CASCADE LINK 3 (caused by link 2): because audit_hold_flag became true, every other ReimbursementClaim of that Provider with status == FILED gets status -> HELD"
      - from: UNDER_AUDIT
        to: AUDIT_PASSED
        trigger: "POST /lifeline/audit-samples/{id}/adjudicate with finding == COMPLIANT (join arm)"
        actor: ComplianceAuditor
        preconditions:
          - "status == UNDER_AUDIT"
          - "every AuditSample with claim_id == this.id has status != DRAWN after this adjudication"
          - "failed_sample_count == 0"
        side_effects:
          - "recoupment_amount_cents = 0, penalty_cents = 0, net_payable_cents = final_amount_cents"
          - "Provider net_reimbursed_cents and open_claim_count recomputed, Provider.version incremented by 1; audit_hold_flag is untouched"
        note: "divergent side-effect set from the AUDIT_FAILED arm: no hold, no recoupment, no HELD cascade"
      - from: AUDIT_FAILED
        to: AUDIT_PASSED
        trigger: "POST /lifeline/subscriber-cases/{id}/decide with decision == GRANT_REINSTATE on an enrollment whose de_enrollment_reason == AUDIT_INELIGIBLE"
        actor: ProgramAdministrator
        preconditions:
          - "status == AUDIT_FAILED"
          - "failed_sample_count after the sample reversal == 0"
        side_effects:
          - "recoupment_amount_cents -> 0, penalty_cents -> 0, net_payable_cents -> final_amount_cents"
          - "Provider recouped_cents and net_reimbursed_cents recomputed back to their pre-adjudication values, audit_hold_flag -> false, Provider.version incremented by 1"
          - "because audit_hold_flag became false, every ReimbursementClaim of that Provider with status == HELD gets status -> FILED"
        note: "the compensating action pinned by calculations.provider_ledger_reconciliation"

  - entity: AuditSample
    state_field: status
    shape: cyclic
    initial_state: DRAWN
    terminal_states: []
    transitions:
      - from: DRAWN
        to: ADJUDICATED_PASS
        trigger: "POST /lifeline/audit-samples/{id}/adjudicate with finding == COMPLIANT"
        actor: ComplianceAuditor
        preconditions:
          - "status == DRAWN"
          - "X-User-ID != the owning claim sample_drawn_by_ref"
          - "the owning claim status == UNDER_AUDIT"
        side_effects:
          - "finding = COMPLIANT, disallowed_support_cents = 0, adjudicated_by_ref = X-User-ID"
          - "the claim advances to AUDIT_PASSED once no DRAWN samples remain and failed_sample_count == 0"
      - from: DRAWN
        to: ADJUDICATED_FAIL
        trigger: "POST /lifeline/audit-samples/{id}/adjudicate with finding != COMPLIANT"
        actor: ComplianceAuditor
        preconditions:
          - "status == DRAWN"
          - "X-User-ID != the owning claim sample_drawn_by_ref"
          - "the owning claim status == UNDER_AUDIT"
        side_effects:
          - "CASCADE LINK 1: finding stored, disallowed_support_cents = claimed_line_cents, adjudicated_by_ref = X-User-ID, the claim failed_sample_count recomputed and, because it became >= 1, the claim status -> AUDIT_FAILED with recoupment_amount_cents / penalty_cents / net_payable_cents computed"
          - "when finding IN {INELIGIBLE_SUBSCRIBER, DUPLICATE_HOUSEHOLD, MISSING_CERTIFICATION} the sampled Enrollment benefit_status ACTIVE -> DE_ENROLLED with de_enrollment_reason = AUDIT_INELIGIBLE"
      - from: ADJUDICATED_FAIL
        to: ADJUDICATED_PASS
        trigger: "POST /lifeline/subscriber-cases/{id}/decide with decision == GRANT_REINSTATE"
        actor: ProgramAdministrator
        preconditions:
          - "status == ADJUDICATED_FAIL"
          - "enrollment_id == the reinstated enrollment id and the owning claim status == AUDIT_FAILED"
          - "when several such samples exist, the one with the greatest created_at is reversed"
        side_effects:
          - "finding -> COMPLIANT, disallowed_support_cents -> 0; the owning claim failed_sample_count recomputed"
        note: "compensating edge; closes the DRAWN -> ADJUDICATED_FAIL -> ADJUDICATED_PASS cycle"

  - entity: SubscriberCase
    state_field: status
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED, RESOLVED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /lifeline/subscriber-cases/{id}/assign-review"
        actor: ProgramAdministrator
        preconditions:
          - "status IN {SUBMITTED, REMANDED}"
          - "review_round < MAX_REVIEW_ROUNDS (3)"
        side_effects:
          - "reviewer_ref written from the request, review_round incremented by 1"
      - from: REMANDED
        to: UNDER_REVIEW
        trigger: "POST /lifeline/subscriber-cases/{id}/assign-review"
        actor: ProgramAdministrator
        preconditions:
          - "status == REMANDED"
          - "review_round < MAX_REVIEW_ROUNDS (3)"
        side_effects:
          - "reviewer_ref rewritten, review_round incremented by 1"
        note: "closes the UNDER_REVIEW -> REMANDED -> UNDER_REVIEW negotiation cycle, bounded at MAX_REVIEW_ROUNDS"
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /lifeline/subscriber-cases/{id}/decide with decision == REMAND"
        actor: ProgramAdministrator
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "decision = REMAND, decision_rationale, decided_at and decided_by_ref written; the Enrollment is untouched"
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /lifeline/subscriber-cases/{id}/decide with decision == GRANT_REINSTATE"
        actor: ProgramAdministrator
        preconditions:
          - "status == UNDER_REVIEW"
          - "case_type == DE_ENROLLMENT_APPEAL"
          - "the enrollment benefit_status == DE_ENROLLED"
          - "X-User-ID != the enrollment de_enrolled_by_ref"
        side_effects:
          - "reinstated_enrollment_flag -> true; the full reinstatement cascade fires on the Enrollment, and when de_enrollment_reason was AUDIT_INELIGIBLE the audit reversal fires on the AuditSample, the ReimbursementClaim and the Provider ledger"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /lifeline/subscriber-cases/{id}/decide with decision == DENY"
        actor: ProgramAdministrator
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != the enrollment de_enrolled_by_ref when case_type == DE_ENROLLMENT_APPEAL"
        side_effects:
          - "decision fields written; the Enrollment is untouched"
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /lifeline/subscriber-cases/{id}/decide with decision == RESOLVE_WITH_CREDIT"
        actor: ProgramAdministrator
        preconditions:
          - "status == UNDER_REVIEW"
          - "case_type == SERVICE_COMPLAINT"
        side_effects:
          - "decision fields written; the Enrollment is untouched"
        note: "the polymorphic split: RESOLVE_WITH_CREDIT is only legal for SERVICE_COMPLAINT, GRANT_REINSTATE only for DE_ENROLLMENT_APPEAL"

concurrency_rules:
  - rule_id: transfer-request-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /lifeline/service-transfers"
    occ_field: "expected_enrollment_version"
    description: |
      Creating a ServiceTransfer against an Enrollment whose version has advanced since
      the client last observed it is rejected. A newly created request legitimately
      supersedes any prior REQUESTED transfer on the same enrollment, so a writer whose
      view of the enrollment is stale would otherwise cancel a port it never saw.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
  - rule_id: claim-draft-stale-provider
    parent_entity: Provider
    write_endpoint: "POST /lifeline/reimbursement-claims"
    occ_field: "expected_provider_version"
    description: |
      Creating a DRAFT ReimbursementClaim against a Provider whose version has advanced
      since the client last observed it is rejected. A new DRAFT for the same provider and
      service_month legitimately supersedes the prior DRAFT, so a stale writer would
      otherwise discard a draft priced from ledger figures it never read.
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412
  - rule_id: address-resolution-stale-address
    parent_entity: HouseholdAddress
    write_endpoint: "POST /lifeline/addresses/{id}/duplicate-resolution"
    occ_field: "expected_address_version"
    description: |
      Resolving a duplicate-flagged HouseholdAddress whose version has advanced since the
      client last observed it is rejected. A resolved dwelling may legitimately be
      re-flagged and re-resolved with a different declared_household_count, so a stale
      resolver would otherwise decide against occupancy figures it never read.
    error_id: ERR_STALE_ADDRESS_VERSION
    http_status: 412

calculations:
  - name: address_normalization_hash
    output_field: "HouseholdAddress.address_hash"
    algorithm_type: projection
    trigger: "POST /lifeline/addresses"
    input_set: "the address_line1, unit_designator, city, state_code and postal_code supplied in the request"
    formula: |
      postal5 = first 5 characters of postal_code
      For each of address_line1, unit_designator (empty string when null), city, state_code, postal5:
        1. uppercase every ASCII letter
        2. delete every character that is not A-Z or 0-9
      address_hash = the five normalized parts joined with a single "|" separator, in the
      order line1 | unit | city | state | postal5.
    constants: {}
    precision: "exact string; no truncation, no hashing function - the joined canonical form IS the stored value"
    notes: |
      Two HouseholdAddress rows are duplicates exactly when their address_hash values are
      byte-equal. cohort_address_count on every row is count(HouseholdAddress WHERE
      address_hash == this.address_hash), this row included, so a lone address has
      cohort_address_count == 1.
      Worked example: address_line1 "1200  N. Main St.", unit_designator "Apt 4-B",
      city "El Paso", state_code "tx", postal_code "79901-2214" normalizes to
      "1200NMAINST|APT4B|ELPASO|TX|79901".
      Worked example (collision): address_line1 "1200 n main st", unit_designator "apt. 4b",
      city "EL PASO", state_code "TX", postal_code "79901" normalizes to the identical
      "1200NMAINST|APT4B|ELPASO|TX|79901", so the second create flags the cohort.
      Worked example (non-collision): unit_designator "Apt 4-C" gives
      "1200NMAINST|APT4C|ELPASO|TX|79901", a different cohort.

  - name: fpg_income_threshold
    output_field: "Subscriber.income_threshold_cents, EligibilityCheck.income_threshold_cents, Enrollment.recert_income_threshold_cents"
    algorithm_type: threshold
    trigger: "POST /lifeline/subscribers, POST /lifeline/subscribers/{id}/eligibility-checks, POST /lifeline/enrollments/{id}/recertify"
    input_set: "the subscriber household_size and tribal_lands_flag in force at the moment of the write"
    formula: |
      fpg_cents          = FPG_BASE_ANNUAL_CENTS + FPG_PER_ADDITIONAL_CENTS * (household_size - 1)
      multiplier         = INCOME_MULTIPLIER_TRIBAL   when tribal_lands_flag == true
                           INCOME_MULTIPLIER_STANDARD when tribal_lands_flag == false
      raw_cents          = round_half_up(fpg_cents * multiplier)
      income_threshold_cents = max(min(raw_cents, PROGRAM_INCOME_CEILING_CENTS), MINIMUM_THRESHOLD_CENTS)
    constants:
      FPG_BASE_ANNUAL_CENTS: 1560000
      FPG_PER_ADDITIONAL_CENTS: 552000
      INCOME_MULTIPLIER_STANDARD: 1.35
      INCOME_MULTIPLIER_TRIBAL: 1.50
      PROGRAM_INCOME_CEILING_CENTS: 6000000
      MINIMUM_THRESHOLD_CENTS: 2106000
    precision: "integer cents; round_half_up applied once, to raw_cents, before the clamps"
    notes: |
      Three inputs feed the result (household_size, tribal_lands_flag and the constant
      table) and the outer expression is a nested min inside a max, so both clamps are
      reachable independently. The clamp order matters: the ceiling is applied first, then
      the floor, and MINIMUM_THRESHOLD_CENTS is exactly the household_size == 1
      non-tribal figure so the floor never raises a standard household.
      Pre-computed literals (household_size, tribal_lands_flag) -> income_threshold_cents:
        (1, false) -> 2106000     fpg 1560000 * 1.35 = 2106000, floor binds at equality
        (2, false) -> 2851200     fpg 2112000 * 1.35 = 2851200
        (3, false) -> 3596400     fpg 2664000 * 1.35 = 3596400
        (4, false) -> 4341600     fpg 3216000 * 1.35 = 4341600
        (4, true)  -> 4824000     fpg 3216000 * 1.50 = 4824000
        (1, true)  -> 2340000     fpg 1560000 * 1.50 = 2340000
        (8, true)  -> 6000000     fpg 5424000 * 1.50 = 8136000, ceiling binds
        (9, false) -> 6000000     fpg 5976000 * 1.35 = 8067600, ceiling binds
      Note that (8, true) and (9, false) collapse to the same stored value even though
      their raw_cents differ by 68400.

  - name: eligibility_income_evaluation
    output_field: "EligibilityCheck.evaluated_income_cents, EligibilityCheck.income_variant, Enrollment.recert_evaluated_income_cents"
    algorithm_type: threshold
    trigger: "POST /lifeline/subscribers/{id}/eligibility-checks (strict_annualized), POST /lifeline/enrollments/{id}/recertify (three_month_averaged)"
    input_set: "the subscriber annual_income_cents and last_3mo_income_cents in force at the moment of the write, plus the fpg_income_threshold result"
    variants:
      - variant: strict_annualized
        applies_when: "initial screening at POST /lifeline/subscribers/{id}/eligibility-checks"
        formula: |
          evaluated_income_cents = annual_income_cents            (used verbatim, no derivation)
          income_variant         = STRICT_ANNUALIZED
          income_qualifies       = evaluated_income_cents <= income_threshold_cents
        stored_in: "EligibilityCheck.evaluated_income_cents with EligibilityCheck.income_variant = STRICT_ANNUALIZED"
      - variant: three_month_averaged
        applies_when: "annual recertification at POST /lifeline/enrollments/{id}/recertify"
        formula: |
          evaluated_income_cents = round_half_up(last_3mo_income_cents * 4)
          income_qualifies       = evaluated_income_cents <= income_threshold_cents
        stored_in: "Enrollment.recert_evaluated_income_cents; the EligibilityCheck row created for screening keeps income_variant = NOT_APPLICABLE for benefit-based checks"
    constants:
      MONTHS_PER_YEAR_FACTOR: 4
    precision: "integer cents; round_half_up on the annualization product only"
    notes: |
      The same subscriber row can qualify under one variant and fail under the other,
      because a household with a large one-off receipt early in the year annualizes
      differently from its trailing quarter.
      Divergence literals (household_size 4, tribal_lands_flag false, threshold 4341600):
        annual_income_cents   = 4400000, last_3mo_income_cents = 1050000
        strict_annualized     -> evaluated 4400000 > 4341600 -> does NOT qualify
        three_month_averaged  -> evaluated 1050000 * 4 = 4200000 <= 4341600 -> qualifies
        delta between the two evaluated figures = 200000 cents
      Reverse divergence literals (household_size 4, tribal_lands_flag false):
        annual_income_cents   = 4200000, last_3mo_income_cents = 1200000
        strict_annualized     -> evaluated 4200000 <= 4341600 -> qualifies
        three_month_averaged  -> evaluated 4800000 > 4341600 -> does NOT qualify
      Rounding literal: last_3mo_income_cents = 1085401 -> 1085401 * 4 = 4341604, which is
      4 cents above the (4, false) threshold, so the write fails by 4 cents.
      When attested_qualifying_benefit != NONE at recertification the income arm is not
      consulted at all; a benefit attestation short-circuits both variants.

  - name: eligibility_certification_validity
    output_field: "EligibilityCheck.expires_at"
    algorithm_type: threshold
    trigger: "POST /lifeline/eligibility-checks/{id}/verifier-result with verifier_outcome == MATCH"
    input_set: "the confirmed_at instant written by the verifier result"
    formula: |
      confirmed_at = clock now
      expires_at   = confirmed_at + ELIGIBILITY_VALID_DAYS days, same time-of-day, UTC
      A check is USABLE for enrollment while status == ELIGIBLE_CONFIRMED AND clock now <= expires_at.
      resubmission_count may not exceed MAX_DOCUMENTATION_RESUBMISSIONS.
    constants:
      ELIGIBILITY_VALID_DAYS: 90
      MAX_DOCUMENTATION_RESUBMISSIONS: 2
    precision: "millisecond-resolution UTC instants; the boundary is inclusive on expires_at"
    notes: |
      Interval convention: CLOSED at the upper end. An enrollment attempted at the instant
      exactly equal to expires_at succeeds; one millisecond later fails with
      ERR_ELIGIBILITY_CHECK_EXPIRED.
      Pre-computed literals from the default clock:
        confirmed_at 2026-08-01T00:00:00Z -> expires_at 2026-10-30T00:00:00Z
        enrollment attempt at 2026-10-30T00:00:00Z     -> accepted (boundary inclusive)
        enrollment attempt at 2026-10-30T00:00:00.001Z -> ERR_ELIGIBILITY_CHECK_EXPIRED
        confirmed_at 2026-08-01T13:45:30.500Z -> expires_at 2026-10-30T13:45:30.500Z
      The third resubmission attempt (resubmission_count already 2) is rejected with
      ERR_RESUBMISSION_LIMIT_EXCEEDED, so the DOCUMENTATION_REQUIRED cycle is bounded.

  - name: claim_support_amount
    output_field: "ReimbursementClaim.provisional_amount_cents, ReimbursementClaim.final_amount_cents, ReimbursementClaim.variance_cents, ReimbursementClaim.covered_enrollment_count"
    algorithm_type: aggregation
    trigger: "POST /lifeline/reimbursement-claims (provisional_snapshot), POST /lifeline/reimbursement-claims/{id}/file (final_filed)"
    input_set: "Enrollment rows with provider_id == the claim provider_id, selected per variant below"
    formula: |
      Per-enrollment monthly rate:
        monthly_rate_cents = BASE_SUPPORT_CENTS_PER_MONTH
                           + TRIBAL_ENHANCEMENT_CENTS_PER_MONTH when the subscriber tribal_lands_flag == true
                           + BROADBAND_UPLIFT_CENTS_PER_MONTH   when service_type IN {BROADBAND, BUNDLED}
      Per-enrollment support days (variant-specific, see below), then:
        line_cents = round_half_up(monthly_rate_cents * support_days / days_in_service_month)
      ROUNDING ORDER IS PINNED: each line_cents is rounded to an integer FIRST, and the
      integer lines are THEN summed. Summing the exact rational products and rounding the
      total once is INCORRECT and will differ from the required answer.
        amount_cents            = sum(line_cents over the selected enrollments)
        covered_enrollment_count = count(selected enrollments)
      A selected enrollment with support_days < MIN_SUPPORT_DAYS contributes no line at all
      and is not counted in covered_enrollment_count.
      variance_cents = final_amount_cents - provisional_amount_cents, written at file time.
    constants:
      BASE_SUPPORT_CENTS_PER_MONTH: 925
      TRIBAL_ENHANCEMENT_CENTS_PER_MONTH: 2500
      BROADBAND_UPLIFT_CENTS_PER_MONTH: 275
      MIN_SUPPORT_DAYS: 1
    precision: "integer cents; round_half_up per line, never on the sum"
    variants:
      - variant: provisional_snapshot
        applies_when: "the DRAFT is created by POST /lifeline/reimbursement-claims, possibly before the service month has closed"
        formula: |
          Selected set: Enrollment rows with provider_id == claim.provider_id AND
            benefit_status == ACTIVE at the instant of the create AND
            benefit_start_date <= min(date(clock now), last day of service_month).
          support_days = (the earlier of date(clock now) and the last day of service_month)
                       - (the later of benefit_start_date and the first day of service_month)
                       + 1, counting whole calendar days inclusive at both ends.
        stored_in: "ReimbursementClaim.provisional_amount_cents"
      - variant: final_filed
        applies_when: "the claim is filed by POST /lifeline/reimbursement-claims/{id}/file, which requires the service month to be closed"
        formula: |
          Selected set: Enrollment rows with provider_id == claim.provider_id that had at
            least one day of ACTIVE benefit inside the service month, INCLUDING rows that
            were de-enrolled mid-month (benefit_end_date inside the month) and rows whose
            provider_id arrived by an ACCEPTED_COMPLETED ServiceTransfer during the month.
          support_days = (the earlier of date(benefit_end_date) - 1 day, when benefit_end_date
                          falls inside the month, and the last day of the service month)
                       - (the later of benefit_start_date and the first day of the service month)
                       + 1, counting whole calendar days inclusive at both ends.
          A still-ACTIVE enrollment therefore earns the full remaining month.
        stored_in: "ReimbursementClaim.final_amount_cents, with variance_cents = final - provisional"
    notes: |
      Rate literals: non-tribal VOICE 925; non-tribal BROADBAND 1200; tribal VOICE 3425;
      tribal BROADBAND 3700; tribal BUNDLED 3700.
      ROUNDING-ORDER LITERAL (service_month "2026-06", days_in_service_month 30):
        two identical non-tribal VOICE enrollments, support_days 16 each
        per-line: round_half_up(925 * 16 / 30) = round_half_up(493.333...) = 493
        correct amount_cents = 493 + 493 = 986
        the forbidden sum-then-round path gives round_half_up(986.666...) = 987
      DUAL-VARIANT LITERAL (service_month "2026-06", days_in_service_month 30):
        E1 non-tribal VOICE, benefit_start_date 2026-01-10, still ACTIVE
        E2 tribal BROADBAND, benefit_start_date 2026-06-21, still ACTIVE
        DRAFT created at clock 2026-06-16T00:00:00Z:
          E1 support_days = 2026-06-01..2026-06-16 = 16 -> round_half_up(925*16/30) = 493
          E2 not yet started, excluded
          provisional_amount_cents = 493, covered_enrollment_count = 1
        FILED at clock 2026-07-02T00:00:00Z:
          E1 support_days = 30 -> round_half_up(925*30/30) = 925
          E2 support_days = 2026-06-21..2026-06-30 = 10 -> round_half_up(3700*10/30)
             = round_half_up(1233.333...) = 1233
          final_amount_cents = 925 + 1233 = 2158, covered_enrollment_count = 2
          variance_cents = 2158 - 493 = 1665
      MID-MONTH DE-ENROLLMENT LITERAL: a non-tribal VOICE enrollment with
      benefit_start_date 2026-06-01 and benefit_end_date 2026-06-11T09:00:00Z earns
      support_days = 2026-06-01..2026-06-10 = 10 -> round_half_up(925*10/30) = 308,
      and it is included by final_filed even though it is not ACTIVE at file time.

  - name: audit_recoupment_amount
    output_field: "ReimbursementClaim.recoupment_amount_cents, ReimbursementClaim.penalty_cents, ReimbursementClaim.net_payable_cents"
    algorithm_type: tiered_pricing
    trigger: "POST /lifeline/audit-samples/{id}/adjudicate when the owning claim reaches AUDIT_FAILED or AUDIT_PASSED"
    input_set: "the owning claim final_amount_cents, audit_sample_count and failed_sample_count"
    formula: |
      EVALUATION ORDER IS PINNED. The penalty tier is selected from the EXTRAPOLATED
      figure, which is itself derived from final_amount_cents, so the two look mutually
      dependent; they are not, and reading the tier off final_amount_cents is INCORRECT.
        step 1  sample_error_rate      = failed_sample_count / audit_sample_count, kept as an
                                        EXACT rational - never rounded, never stored
        step 2  extrapolated_error_cents = round_half_up(final_amount_cents * sample_error_rate)
        step 3  penalty_rate           = PENALTY_RATE_LOW    when extrapolated_error_cents <  PENALTY_TIER_1_CENTS
                                         PENALTY_RATE_MID    when PENALTY_TIER_1_CENTS <= extrapolated_error_cents < PENALTY_TIER_2_CENTS
                                         PENALTY_RATE_HIGH   when extrapolated_error_cents >= PENALTY_TIER_2_CENTS
        step 4  penalty_cents          = round_half_up(extrapolated_error_cents * penalty_rate)
        step 5  recoupment_amount_cents = extrapolated_error_cents + penalty_cents
        step 6  net_payable_cents      = final_amount_cents - recoupment_amount_cents
      When failed_sample_count == 0: recoupment_amount_cents = 0, penalty_cents = 0 and
      net_payable_cents = final_amount_cents.
      Provider ledger writes always use the GROSS final_amount_cents for claim_gross_cents
      and recoupment_amount_cents for recouped_cents; net_payable_cents is a display figure
      and is NEVER added to any provider counter.
    constants:
      PENALTY_TIER_1_CENTS: 500
      PENALTY_TIER_2_CENTS: 1500
      PENALTY_RATE_LOW: 0.05
      PENALTY_RATE_MID: 0.10
      PENALTY_RATE_HIGH: 0.20
    precision: "integer cents; round_half_up at step 2 and again at step 4, nowhere else"
    notes: |
      The tier cut-offs sit in the low hundreds of cents deliberately: a single month of
      Lifeline support is worth 925 to 3700 cents per subscriber, so a realistic claim
      straddles the tiers and the pinned evaluation order is OBSERVABLE rather than
      academic.
      ORDER-SENSITIVE LITERAL: final_amount_cents 2158, audit_sample_count 2, failed_sample_count 1
        rate 1/2; extrapolated = round_half_up(1079.0) = 1079
        correct tier read from extrapolated 1079: 500 <= 1079 < 1500 -> PENALTY_RATE_MID 0.10
          penalty = round_half_up(107.9) = 108; recoupment = 1187; net_payable = 971
        the forbidden tier-from-final_amount_cents path would read 2158 >= 1500 -> 0.20
          and produce penalty 216, recoupment 1295, net_payable 863
      LOW-TIER LITERAL: final_amount_cents 986, audit_sample_count 2, failed_sample_count 1
        rate 1/2; extrapolated = 493; 493 < 500 so PENALTY_RATE_LOW 0.05
        penalty = round_half_up(24.65) = 25; recoupment = 518; net_payable = 468
      HALF-UP LITERAL: final_amount_cents 1850, audit_sample_count 2, failed_sample_count 1
        rate 1/2; extrapolated = 925; 500 <= 925 < 1500 so 0.10
        penalty = round_half_up(92.5) = 93 (banker's rounding would give 92); recoupment = 1018;
        net_payable = 832
      EXACT-RATE LITERAL: final_amount_cents 2158, audit_sample_count 3, failed_sample_count 2
        rate 2/3 kept exact; extrapolated = round_half_up(1438.666...) = 1439
        1439 < 1500 so 0.10; penalty = round_half_up(143.9) = 144
        recoupment = 1583; net_payable = 575
        rounding the rate to 0.67 first would give extrapolated 1446 and a different answer.
      TIER-BOUNDARY LITERALS: extrapolated 499 -> 0.05; extrapolated 500 -> 0.10;
        extrapolated 1499 -> 0.10; extrapolated 1500 -> 0.20.

  - name: enrollment_audit_risk_score
    output_field: "Enrollment.audit_risk_score"
    algorithm_type: weighted_scoring
    trigger: "recomputed on every write that touches Enrollment usage_status, recert_status, device_issuance_count, transfer_count or the certified address status"
    input_set: "the enrollment own dimension fields plus the status of the HouseholdAddress named by certified_address_id"
    formula: |
      w_dup     = RISK_WEIGHT_DUPLICATE_ADDRESS when the certified HouseholdAddress status == DUPLICATE_FLAGGED, else 0
      w_usage   = RISK_WEIGHT_NON_USAGE         when usage_status IN {NON_USAGE_FLAGGED, CURE_EXPIRED}, else 0
      w_recert  = RISK_WEIGHT_RECERT_LAPSE      when recert_status IN {NON_RESPONSIVE, RESPONDED_INELIGIBLE}, else 0
      w_device  = RISK_WEIGHT_PER_DEVICE * min(device_issuance_count, RISK_DEVICE_COUNT_CAP)
      w_port    = RISK_WEIGHT_TRANSFERRED       when transfer_count >= 1, else 0
      audit_risk_score = min(RISK_SCORE_CEILING, w_dup + w_usage + w_recert + w_device + w_port)
    constants:
      RISK_WEIGHT_DUPLICATE_ADDRESS: 40
      RISK_WEIGHT_NON_USAGE: 30
      RISK_WEIGHT_RECERT_LAPSE: 20
      RISK_WEIGHT_PER_DEVICE: 10
      RISK_DEVICE_COUNT_CAP: 2
      RISK_WEIGHT_TRANSFERRED: 15
      RISK_SCORE_CEILING: 100
    precision: "integer; no rounding - every weight is an integer and the cap is applied last"
    notes: |
      The unclamped maximum is 40 + 30 + 20 + 20 + 15 = 125, so RISK_SCORE_CEILING is
      genuinely reachable and the clamp is observable.
      Pre-computed literals:
        fresh enrollment, clean address, no device      -> 0
        one device issued                              -> 10
        two devices issued                             -> 20
        three devices issued                           -> 20 (RISK_DEVICE_COUNT_CAP binds)
        NON_USAGE_FLAGGED + one device                 -> 40
        DUPLICATE_FLAGGED address + NON_USAGE_FLAGGED + two devices -> 90
        the same plus transfer_count 1                 -> min(100, 105) = 100
        DUPLICATE_FLAGGED + NON_USAGE_FLAGGED + NON_RESPONSIVE + two devices + one transfer
                                                       -> min(100, 125) = 100
      The score is the primary ranking key of audit_sample_selection, so the ceiling
      produces deliberate ties that the secondary keys must break.

  - name: audit_sample_selection
    output_field: "AuditSample rows, AuditSample.selection_rank, AuditSample.risk_score_at_draw, ReimbursementClaim.audit_sample_count"
    algorithm_type: chronological
    trigger: "POST /lifeline/reimbursement-claims/{id}/audit-draw"
    input_set: "exactly the enrollments the final_filed variant of claim_support_amount selected for this claim, i.e. the covered_enrollment_count rows that contributed a line"
    formula: |
      1. candidate_pool = the final_filed selected set of the claim. When it is empty the
         request is rejected with ERR_EMPTY_SAMPLE_POOL and no AuditSample row is created.
      2. sample_size from the request must satisfy 1 <= sample_size <= MAX_SAMPLE_SIZE,
         else ERR_INVALID_SAMPLE_SIZE.
      3. effective_size = min(sample_size, count(candidate_pool)) - an over-large request is
         clamped, never rejected.
      4. Rank the candidates by, in order:
           audit_risk_score DESC
           benefit_start_date ASC
           created_at ASC
         created_at ASC is the final tie-break and is the ONLY common field consulted; row
         id never participates in the ordering.
      5. Take the first effective_size candidates; selection_rank is 1-based in that order.
      6. Each AuditSample records risk_score_at_draw = the enrollment audit_risk_score at
         draw time and claimed_line_cents = that enrollment line_cents inside
         final_amount_cents, so later recomputation of the score cannot rewrite history.
    constants:
      MAX_SAMPLE_SIZE: 50
      MIN_SAMPLE_SIZE: 1
    precision: "not applicable; integer ranks"
    notes: |
      Ranking literal: candidates A(score 100, start 2026-03-01), B(score 100, start
      2026-01-15), C(score 40, start 2025-11-02), D(score 100, start 2026-01-15, created
      after B). Order is B, D, A, C: the three score-100 rows sort by benefit_start_date
      ASC, and B versus D is settled by created_at ASC.
      sample_size 2 over that pool -> ranks 1=B, 2=D. sample_size 9 -> clamped to 4 rows.
      sample_size 0 -> ERR_INVALID_SAMPLE_SIZE. sample_size 51 -> ERR_INVALID_SAMPLE_SIZE.
      The sum of claimed_line_cents across ALL candidates equals final_amount_cents; the
      sum across the drawn subset does not, and audit_recoupment_amount deliberately
      extrapolates from the rate rather than from the drawn cents.

  - name: non_usage_cure_window
    output_field: "Enrollment.non_usage_flagged_at, Enrollment.cure_deadline_at, Enrollment.usage_status"
    algorithm_type: threshold
    trigger: "POST /lifeline/providers/{id}/compliance-sweep; cured by POST /lifeline/enrollments/{id}/usage"
    input_set: "ACTIVE enrollments of the swept provider"
    formula: |
      last_activity_at = last_usage_at when it is non-null, else benefit_start_date
      idle_days        = floor((clock now - last_activity_at) / 1 day)   -- whole days only
      FLAG when usage_status IN {PENDING_FIRST_USE, USING} AND idle_days >= NON_USAGE_WINDOW_DAYS:
        non_usage_flagged_at = clock now
        cure_deadline_at     = date(non_usage_flagged_at) + CURE_PERIOD_DAYS days
                               at 23:59:59.999Z
      CURE while usage_status == NON_USAGE_FLAGGED AND clock now <= cure_deadline_at.
      EXPIRE while usage_status == NON_USAGE_FLAGGED AND clock now > cure_deadline_at.
    constants:
      NON_USAGE_WINDOW_DAYS: 30
      CURE_PERIOD_DAYS: 15
    precision: "whole days by floor for detection; millisecond instants for the cure deadline"
    notes: |
      Interval convention: the cure window is CLOSED at the upper end - a usage event at
      the instant exactly equal to cure_deadline_at still cures, and expiry needs a strict
      greater-than.
      Pre-computed literals from the default clock 2026-08-01T00:00:00Z:
        benefit_start_date 2026-08-01T00:00:00Z, last_usage_at null
        sweep at 2026-08-30T23:59:59Z -> idle_days = floor(29.99..) = 29 -> NOT flagged
        sweep at 2026-08-31T00:00:00Z -> idle_days = 30 -> FLAGGED
        cure_deadline_at = 2026-09-15T23:59:59.999Z
        usage at 2026-09-15T23:59:59.999Z -> cures, usage_status -> USING
        sweep at 2026-09-15T23:59:59.999Z -> NOT expired (equality does not expire)
        sweep at 2026-09-16T00:00:00Z     -> CURE_EXPIRED and benefit_status -> DE_ENROLLED
      Curing resets the anchor: after the cure at 2026-09-15T23:59:59.999Z the next flag
      cannot occur before 2026-10-15T23:59:59.999Z.
      A usage event carrying an explicit usage_at earlier than last_activity_at is still
      accepted but last_activity_at only ever advances, never rewinds.

  - name: recertification_window
    output_field: "Enrollment.recert_due_date, Enrollment.recert_notice_sent_at, Enrollment.recert_response_deadline_at, Enrollment.recert_status"
    algorithm_type: threshold
    trigger: "POST /lifeline/enrollments (initial due date), POST /lifeline/providers/{id}/compliance-sweep (notice and non-response), POST /lifeline/enrollments/{id}/recertify (response)"
    input_set: "ACTIVE enrollments of the swept provider"
    formula: |
      At enrollment:      recert_due_date = date(benefit_start_date) + RECERT_CYCLE_DAYS days
      NOTICE  when recert_status == NOT_DUE AND
                   clock now >= recert_due_date - RECERT_NOTICE_LEAD_DAYS days:
        recert_notice_sent_at        = clock now
        recert_response_deadline_at  = date(clock now) + RECERT_RESPONSE_DAYS days at 23:59:59.999Z
      RESPONSE accepted while recert_status == NOTICED AND clock now <= recert_response_deadline_at.
      NON_RESPONSE when recert_status == NOTICED AND clock now > recert_response_deadline_at.
      On an eligible response: recert_due_date = date(clock now) + RECERT_CYCLE_DAYS days,
      i.e. the cycle re-anchors on the RESPONSE date, not on the previous due date, so a
      late-but-in-window response shifts every future cycle.
    constants:
      RECERT_CYCLE_DAYS: 365
      RECERT_NOTICE_LEAD_DAYS: 60
      RECERT_RESPONSE_DAYS: 60
    precision: "whole calendar days; millisecond instants for the response deadline"
    notes: |
      Interval convention: the response window is CLOSED at the upper end; the notice
      window opening test is >= (also closed at its lower end).
      Pre-computed literals from the default clock 2026-08-01T00:00:00Z:
        benefit_start_date 2026-08-01 -> recert_due_date 2027-08-01
        notice window opens at 2027-06-02T00:00:00Z (2027-08-01 minus 60 days)
        sweep at 2027-06-01T23:59:59Z -> no notice, recert_status stays NOT_DUE
        sweep at 2027-06-02T00:00:00Z -> NOTICED,
          recert_response_deadline_at = 2027-08-01T23:59:59.999Z
        recertify at 2027-08-01T23:59:59.999Z -> accepted, and on the eligible arm
          recert_due_date = 2028-07-31 (2027-08-01 plus 365 days, 2028 being a leap year)
        sweep at 2027-08-02T00:00:00Z -> NON_RESPONSIVE and benefit_status -> DE_ENROLLED
      A reinstated enrollment keeps benefit_start_date, so its recert_due_date is NOT
      pushed out by the reinstatement even though recert_status returns to NOT_DUE.

  - name: household_benefit_occupancy
    output_field: "HouseholdAddress.occupied_benefit_slots, HouseholdAddress.max_permitted_benefit_slots"
    algorithm_type: interval_merge
    trigger: "POST /lifeline/enrollments, and every benefit_status write"
    input_set: "Enrollment rows with certified_address_id == the address id"
    formula: |
      Each enrollment occupies the HALF-OPEN interval
          [benefit_start_date, benefit_end_date)
      where a null benefit_end_date means the interval is unbounded above.
      occupied_benefit_slots = count(Enrollment WHERE certified_address_id == this.id
                                     AND benefit_status == ACTIVE)
      max_permitted_benefit_slots = declared_household_count when status == RESOLVED_MULTI_HOUSEHOLD
                                    and declared_household_count is non-null, else 1
      A new enrollment is REJECTED with ERR_ONE_PER_HOUSEHOLD_VIOLATION when the count of
      existing intervals that OVERLAP the candidate interval, plus one, exceeds
      max_permitted_benefit_slots. Two intervals overlap when
          new_start < existing_end (or existing_end is null) AND existing_start < new_end
                                                                (or new_end is null).
    constants:
      DEFAULT_MAX_BENEFIT_SLOTS: 1
    precision: "millisecond instants; the interval is half-open, closed at the start and open at the end"
    notes: |
      Interval convention: HALF-OPEN, so ADJACENCY IS ALLOWED. This is deliberately the
      opposite convention from device_issuance_freeze_window.
      The overlap test ranges over EVERY Enrollment row at the address, not only the ACTIVE
      ones: a de-enrolled benefit still occupies its closed-off interval
      [benefit_start_date, benefit_end_date), so a household cannot backdate a second
      benefit into a period it already consumed. occupied_benefit_slots, by contrast,
      counts only ACTIVE rows - the two figures answer different questions and will differ
      whenever a benefit has ended.
      Pre-computed literals:
        prior enrollment [2026-05-01T00:00:00Z, 2026-09-01T00:00:00Z), max slots 1
        new benefit_start_date 2026-09-01T00:00:00Z          -> ACCEPTED (touching, not overlapping)
        new benefit_start_date 2026-08-31T23:59:59.999Z      -> ERR_ONE_PER_HOUSEHOLD_VIOLATION
        an ACTIVE prior enrollment (benefit_end_date null) and any new start
                                                            -> ERR_ONE_PER_HOUSEHOLD_VIOLATION
        after resolution MULTI_HOUSEHOLD with declared_household_count 3, two further
        overlapping enrollments are ACCEPTED (occupancy 3) and the fourth is rejected
      occupied_benefit_slots reaching 0 on a DUPLICATE_FLAGGED address triggers the
      auto-resolution edge to RESOLVED_SINGLE_HOUSEHOLD.

  - name: benefit_port_freeze_window
    output_field: "Enrollment.port_freeze_until, ServiceTransfer.port_freeze_until_snapshot"
    algorithm_type: interval_merge
    trigger: "POST /lifeline/enrollments (sets the field), POST /lifeline/service-transfers (tests it)"
    input_set: "the enrollment benefit_start_date"
    formula: |
      port_freeze_until = date(benefit_start_date) + BENEFIT_PORT_FREEZE_DAYS days
                          at 00:00:00.000Z
      A ServiceTransfer request is REJECTED with ERR_PORT_FREEZE_ACTIVE while
          clock now < port_freeze_until
      i.e. the frozen interval is HALF-OPEN [benefit_start_date, port_freeze_until) and a
      request at exactly port_freeze_until is accepted.
      port_freeze_until is preserved verbatim across an ACCEPTED_COMPLETED transfer and
      across a reinstatement, because benefit_start_date never moves; the accepting carrier
      therefore inherits the ORIGINAL freeze anchor and cannot restart it.
    constants:
      BENEFIT_PORT_FREEZE_DAYS: 60
    precision: "millisecond instants; half-open at the upper end"
    notes: |
      Pre-computed literals from the default clock:
        benefit_start_date 2026-08-01T00:00:00Z -> port_freeze_until 2026-09-30T00:00:00Z
        transfer request at 2026-09-29T23:59:59.999Z -> ERR_PORT_FREEZE_ACTIVE
        transfer request at 2026-09-30T00:00:00Z     -> ACCEPTED into REQUESTED
      ServiceTransfer.port_freeze_until_snapshot records the value that was tested, so an
      audit can show which anchor the port cleared.

  - name: device_issuance_freeze_window
    output_field: "Enrollment.last_device_issued_at, Enrollment.device_issuance_count"
    algorithm_type: interval_merge
    trigger: "POST /lifeline/enrollments/{id}/device-issuance"
    input_set: "the enrollment last_device_issued_at plus the status and return_condition of the Device previously issued to it"
    formula: |
      When last_device_issued_at is null there is no freeze.
      Otherwise the frozen interval is CLOSED AT BOTH ENDS:
          [ last_device_issued_at,
            last_device_issued_at + (DEVICE_FREEZE_DAYS + DEVICE_REISSUE_BUFFER_DAYS) days ]
      A request whose clock now falls anywhere inside that interval, INCLUDING the exact
      upper boundary instant, is REJECTED with ERR_DEVICE_FREEZE_ACTIVE.
      WAIVER: the freeze does not apply when the most recently issued Device of this
      enrollment has status == RECLAIM_PENDING, or has status IN {RETIRED, LOST} with
      return_condition IN {DAMAGED, LOST}. A device returned in GOOD condition does NOT
      waive the freeze.
      Independently of the freeze, a request is REJECTED with
      ERR_SINGLE_DEVICE_PER_SUBSCRIBER when any Device already has
      issued_enrollment_id pointing at an enrollment of the same subscriber_id and
      status IN {ISSUED, RECLAIM_PENDING}. The outstanding handset must be returned
      before a replacement can be issued, so the RECLAIM_PENDING waiver above lifts
      the FREEZE but never this safety rule: the two interact, and only a physical
      return clears both.
    constants:
      DEVICE_FREEZE_DAYS: 365
      DEVICE_REISSUE_BUFFER_DAYS: 30
    precision: "millisecond instants; CLOSED at both ends"
    notes: |
      Interval convention: CLOSED at both ends, deliberately the opposite of
      household_benefit_occupancy and benefit_port_freeze_window. The boundary instant is
      INSIDE the freeze and is rejected.
      Pre-computed literals:
        last_device_issued_at 2026-06-05T00:00:00Z
        freeze upper boundary = 2027-07-05T00:00:00Z (365 + 30 = 395 days)
        issuance at 2027-07-04T23:59:59.999Z -> ERR_DEVICE_FREEZE_ACTIVE
        issuance at 2027-07-05T00:00:00Z     -> ERR_DEVICE_FREEZE_ACTIVE (boundary inclusive)
        issuance at 2027-07-05T00:00:00.001Z -> ACCEPTED
        issuance at 2026-06-06T00:00:00Z with the prior device in RECLAIM_PENDING
                                             -> ACCEPTED (waiver)
        issuance at 2026-06-06T00:00:00Z with the prior device RETIRED / DAMAGED
                                             -> ACCEPTED (waiver)
        issuance at 2026-06-06T00:00:00Z with the prior device IN_STOCK / GOOD
                                             -> ERR_DEVICE_FREEZE_ACTIVE (no waiver)

  - name: device_selection_policy
    output_field: "the Device chosen by POST /lifeline/enrollments/{id}/device-issuance when device_id is omitted"
    algorithm_type: chronological
    trigger: "POST /lifeline/enrollments/{id}/device-issuance with device_id absent"
    input_set: "Device rows with provider_id == enrollment.provider_id AND status == IN_STOCK"
    formula: |
      1. candidate_pool as above. Empty pool -> ERR_NO_DEVICE_IN_STOCK.
      2. Rank by, in order:
           model_tier ASC over the fixed ladder [BASIC, STANDARD, SMART]
           unit_cost_cents ASC
           created_at ASC
         created_at ASC is the final tie-break; row id never participates.
      3. Issue rank 1.
      When device_id IS supplied the named device must exist, belong to the enrollment
      provider and be IN_STOCK; otherwise ERR_DEVICE_NOT_FOUND or ERR_NO_DEVICE_IN_STOCK.
    constants:
      MODEL_TIER_LADDER: "BASIC < STANDARD < SMART"
    precision: "not applicable"
    notes: |
      Ranking literal: pool = D1(SMART, 4500), D2(BASIC, 3900), D3(BASIC, 2100),
      D4(BASIC, 2100 created after D3), D5(STANDARD, 1200).
      Order is D3, D4, D2, D5, D1: the cheap tier wins before cost is consulted, so the
      1200-cent STANDARD handset loses to a 3900-cent BASIC one, and D3 beats D4 only on
      created_at ASC. Issuance therefore picks D3.

  - name: compliance_sweep_processing_order
    output_field: "the four id arrays in the POST /lifeline/providers/{id}/compliance-sweep response"
    algorithm_type: chronological
    trigger: "POST /lifeline/providers/{id}/compliance-sweep"
    input_set: "Enrollment rows with provider_id == the path provider AND benefit_status == ACTIVE at the moment the step is evaluated"
    formula: |
      Enrollments are visited in the order benefit_start_date ASC, then created_at ASC.
      For each enrollment the four steps run in this FIXED order and each step re-reads the
      state the previous step just wrote:
        step 1  non-usage detection   -> usage_status  -> NON_USAGE_FLAGGED
        step 2  cure expiry           -> usage_status  -> CURE_EXPIRED, benefit_status -> DE_ENROLLED
        step 3  recertification notice-> recert_status -> NOTICED
        step 4  recertification non-response -> recert_status -> NON_RESPONSIVE,
                                                benefit_status -> DE_ENROLLED
      Because step 1 sets cure_deadline_at to a future instant, a freshly flagged
      enrollment can NEVER be expired by step 2 in the same sweep. Because step 2 may
      de-enroll the row, steps 3 and 4 skip it: an enrollment de-enrolled for NON_USAGE in
      this sweep never appears in recert_noticed_enrollment_ids.
      Each of the four response arrays lists the affected enrollment ids in visit order.
      evaluated_enrollment_count counts the rows that were ACTIVE when the sweep began.
    constants: {}
    precision: "not applicable"
    notes: |
      The sweep is idempotent in the sense that a second sweep at the same clock instant
      adds nothing to any array. Advancing the clock and re-sweeping is what moves rows on.
      Ordering literal: enrollments X(benefit_start_date 2026-02-01) and
      Y(benefit_start_date 2026-01-01) both due for notice -> recert_noticed_enrollment_ids
      is [Y, X], never sorted by id.

  - name: device_inventory_conservation
    output_field: "Provider.devices_total_count, devices_in_stock_count, devices_issued_count, devices_reclaim_pending_count, devices_retired_count"
    algorithm_type: aggregation
    trigger: "POST /lifeline/providers/{id}/devices, POST /lifeline/enrollments/{id}/device-issuance, POST /lifeline/devices/{id}/return, and every device reclaim cascade"
    input_set: "Device rows with provider_id == the provider id"
    formula: |
      devices_total_count             = count(Device WHERE provider_id == this.id)
      devices_in_stock_count          = count(... AND status == IN_STOCK)
      devices_issued_count            = count(... AND status == ISSUED)
      devices_reclaim_pending_count   = count(... AND status == RECLAIM_PENDING)
      devices_retired_count           = count(... AND status IN {RETIRED, LOST})
      INVARIANT, which must hold after EVERY write:
        devices_total_count == devices_in_stock_count + devices_issued_count
                             + devices_reclaim_pending_count + devices_retired_count
    constants: {}
    precision: "integers"
    notes: |
      The invariant is preserved by construction because the five counters partition the
      same row set, but the compensating pair issue-then-return-GOOD must restore the
      counters to their exact pre-issuance values:
        start 3 devices: in_stock 3, issued 0, reclaim_pending 0, retired 0, total 3
        after one issuance:            2 / 1 / 0 / 0 / 3
        after de-enrollment reclaim:   2 / 0 / 1 / 0 / 3
        after return GOOD:             3 / 0 / 0 / 0 / 3   (identical to the start state)
        after return DAMAGED instead:  2 / 0 / 0 / 1 / 3   (total still 3, in_stock does NOT recover)
      devices_total_count is monotone non-decreasing; nothing ever removes a Device row.

  - name: provider_ledger_reconciliation
    output_field: "Provider.claim_gross_cents, Provider.recouped_cents, Provider.net_reimbursed_cents, Provider.open_claim_count, Provider.audit_hold_flag"
    algorithm_type: aggregation
    trigger: "POST /lifeline/reimbursement-claims/{id}/file, POST /lifeline/audit-samples/{id}/adjudicate, POST /lifeline/subscriber-cases/{id}/decide"
    input_set: "ReimbursementClaim rows with provider_id == the provider id"
    formula: |
      claim_gross_cents    = sum(final_amount_cents) over claims with
                             status IN {FILED, HELD, UNDER_AUDIT, AUDIT_PASSED, AUDIT_FAILED}
      recouped_cents       = sum(recoupment_amount_cents) over claims with status == AUDIT_FAILED
      open_claim_count     = count(claims with status IN {DRAFT, FILED, HELD, UNDER_AUDIT})
      audit_hold_flag      = true exactly when at least one claim of this provider has
                             status == AUDIT_FAILED
      INVARIANT, which must hold after EVERY write:
        net_reimbursed_cents == claim_gross_cents - recouped_cents
      Note that claim_gross_cents uses the GROSS final_amount_cents. net_payable_cents is
      never summed into any provider counter; doing so would double-count the recoupment.
    constants: {}
    precision: "integer cents"
    notes: |
      COMPENSATION LITERAL - the appeal reversal must restore the ledger exactly.
      Two claims are filed for the same carrier, each with final_amount_cents 1850:
        after both filings:
          claim_gross 3700, recouped 0, net_reimbursed 3700, audit_hold_flag false
        after an ADJUDICATED_FAIL on the second claim (audit_sample_count 2,
        failed_sample_count 1) drives it to AUDIT_FAILED with recoupment_amount_cents 1018:
          claim_gross 3700, recouped 1018, net_reimbursed 2682, audit_hold_flag true
          and the first claim, still FILED, is now HELD
        after POST /lifeline/subscriber-cases/{id}/decide with GRANT_REINSTATE flips the
        failed sample to ADJUDICATED_PASS and the claim back to AUDIT_PASSED:
          claim_gross 3700, recouped 0, net_reimbursed 3700, audit_hold_flag false
          and the HELD claim is back to FILED
        The post-compensation triple is byte-identical to the pre-adjudication triple: no
        drift, and the invariant holds at all three points.

validations:
  - priority: 10
    category: auth
    applies_to: "every endpoint under /lifeline"
    condition: "X-User-ID or X-User-Role header is absent or empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    notes: "checked before the request body is parsed, so a malformed body with no headers still returns 401"
  - priority: 15
    category: auth
    applies_to: "every endpoint under /lifeline"
    condition: "X-User-Role is not one of the five declared roles, or the role is not permitted on this endpoint"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    notes: "an unknown role string is treated as a permitted-role failure, not as a schema failure"
  - priority: 18
    category: schema
    applies_to: "every endpoint that accepts a body"
    condition: "a required input field is missing, is of the wrong JSON type, violates a declared numeric range, or carries a value outside a declared enum"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    notes: "computed and system fields supplied in the body are silently ignored, never rejected"
  - priority: 22
    category: existence
    applies_to: "every endpoint with a path id segment"
    condition: "no row of the addressed entity has that id"
    error_id: "the entity-specific NOT_FOUND code (ERR_PROVIDER_NOT_FOUND, ERR_ADDRESS_NOT_FOUND, ERR_SUBSCRIBER_NOT_FOUND, ERR_ELIGIBILITY_CHECK_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_DEVICE_NOT_FOUND, ERR_SERVICE_TRANSFER_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_AUDIT_SAMPLE_NOT_FOUND, ERR_CASE_NOT_FOUND)"
    http_status: 404
    notes: "path existence is resolved outer-to-inner: for POST /lifeline/subscribers/{id}/eligibility-checks the subscriber is checked before the body"
  - priority: 26
    category: existence
    applies_to: "every endpoint whose body carries a foreign key"
    condition: "a body foreign key names a row that does not exist"
    error_id: "the entity-specific NOT_FOUND code of the referenced entity"
    http_status: 404
    notes: "body foreign keys are resolved in declaration order: for POST /lifeline/enrollments that is subscriber_id, then provider_id, then eligibility_check_id, then certified_address_id"
  - priority: 30
    category: ownership
    applies_to: "POST /lifeline/enrollments, POST /lifeline/providers/{id}/devices, POST /lifeline/enrollments/{id}/device-issuance, POST /lifeline/devices/{id}/return, POST /lifeline/reimbursement-claims, POST /lifeline/reimbursement-claims/{id}/file, POST /lifeline/service-transfers, POST /lifeline/enrollments/{id}/usage, POST /lifeline/enrollments/{id}/de-enroll"
    condition: "X-User-Role == ProviderAgent and X-User-ID is not the provider_id that owns the addressed row (for POST /lifeline/service-transfers, is not the source_provider_id derived from the enrollment)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    notes: "peer isolation: one carrier can never write another carrier's enrollments, devices or claims. The Subscriber role is likewise confined to its own subscriber_id on POST /lifeline/enrollments/{id}/recertify and POST /lifeline/subscriber-cases."
  - priority: 34
    category: segregation_of_duties
    applies_to: "POST /lifeline/audit-samples/{id}/adjudicate, POST /lifeline/subscriber-cases/{id}/decide"
    condition: "on adjudicate: X-User-ID equals the owning claim sample_drawn_by_ref. On decide: X-User-ID equals the appealed enrollment de_enrolled_by_ref, or equals the case reviewer_ref when the case has been remanded at least once"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    notes: "the auditor who drew the sample may not adjudicate it, and the operator whose write de-enrolled a subscriber may not decide that subscriber's appeal. Ranks above OCC so an offending identity is told about the conflict even with a stale version."
  - priority: 38
    category: concurrency
    applies_to: "POST /lifeline/service-transfers, POST /lifeline/reimbursement-claims, POST /lifeline/addresses/{id}/duplicate-resolution"
    condition: "the supplied expected_enrollment_version / expected_provider_version / expected_address_version does not equal the current version of the named parent row"
    error_id: "ERR_STALE_ENROLLMENT_VERSION, ERR_STALE_PROVIDER_VERSION, ERR_STALE_ADDRESS_VERSION respectively"
    http_status: 412
    notes: "see §1.2.1; the OCC check runs after authorization and existence but before every state and business check, so a stale writer never learns business facts about a row it cannot write"
  - priority: 42
    category: state
    applies_to: "POST /lifeline/eligibility-checks/{id}/verifier-result"
    condition: "the check status != PENDING_VERIFIER"
    error_id: ERR_ELIGIBILITY_CHECK_NOT_PENDING
    http_status: 409
    notes: "second verifier result on the same check"
  - priority: 43
    category: state
    applies_to: "POST /lifeline/eligibility-checks/{id}/resubmit-documentation"
    condition: "the check status != DOCUMENTATION_REQUIRED"
    error_id: ERR_DOCUMENTATION_NOT_REQUESTED
    http_status: 409
  - priority: 44
    category: state
    applies_to: "POST /lifeline/enrollments"
    condition: "the eligibility check named by eligibility_check_id has status != ELIGIBLE_CONFIRMED"
    error_id: ERR_ELIGIBILITY_CHECK_NOT_CONFIRMED
    http_status: 409
  - priority: 45
    category: state
    applies_to: "POST /lifeline/enrollments"
    condition: "the eligibility check has status == ELIGIBLE_CONFIRMED but clock now > its expires_at"
    error_id: ERR_ELIGIBILITY_CHECK_EXPIRED
    http_status: 409
    notes: "PRIORITY PAIR A, lower member. Ranks above every business check on POST /lifeline/enrollments, so a request that is BOTH stale-certified and placed with an unlicensed carrier reports the expiry, not the licensing failure."
  - priority: 46
    category: state
    applies_to: "POST /lifeline/enrollments"
    condition: "the subscriber status != VERIFIED_ELIGIBLE"
    error_id: ERR_SUBSCRIBER_NOT_ELIGIBLE
    http_status: 409
    notes: "covers PROSPECT, ELIGIBILITY_PENDING, DUPLICATE_HOLD, ENROLLED and DE_ENROLLED applicants"
  - priority: 47
    category: state
    applies_to: "POST /lifeline/enrollments/{id}/usage, POST /lifeline/enrollments/{id}/recertify, POST /lifeline/enrollments/{id}/device-issuance, POST /lifeline/service-transfers"
    condition: "the enrollment benefit_status != ACTIVE"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
  - priority: 48
    category: state
    applies_to: "POST /lifeline/enrollments/{id}/de-enroll"
    condition: "the enrollment benefit_status == DE_ENROLLED"
    error_id: ERR_ENROLLMENT_ALREADY_DE_ENROLLED
    http_status: 409
    notes: "the idempotency probe: a second de-enroll of the same enrollment fails rather than re-writing benefit_end_date"
  - priority: 49
    category: state
    applies_to: "POST /lifeline/enrollments/{id}/recertify"
    condition: "the enrollment recert_status != NOTICED"
    error_id: ERR_RECERT_NOT_NOTICED
    http_status: 409
    notes: "a subscriber cannot recertify before the sweep has issued the notice"
  - priority: 50
    category: state
    applies_to: "POST /lifeline/reimbursement-claims/{id}/file"
    condition: "the claim status != DRAFT"
    error_id: ERR_CLAIM_NOT_DRAFT
    http_status: 409
  - priority: 51
    category: state
    applies_to: "POST /lifeline/reimbursement-claims/{id}/audit-draw"
    condition: "the claim status != FILED"
    error_id: ERR_CLAIM_NOT_FILED
    http_status: 409
    notes: "also the code returned for a HELD claim, so a provider under audit hold cannot have a second draw opened"
  - priority: 52
    category: state
    applies_to: "POST /lifeline/audit-samples/{id}/adjudicate"
    condition: "the sample status != DRAWN"
    error_id: ERR_SAMPLE_ALREADY_ADJUDICATED
    http_status: 409
  - priority: 53
    category: state
    applies_to: "POST /lifeline/service-transfers/{id}/accept, POST /lifeline/service-transfers/{id}/reject"
    condition: "the transfer status != REQUESTED"
    error_id: ERR_TRANSFER_NOT_REQUESTED
    http_status: 409
    notes: "the code a superseded transfer returns when its original requester tries to accept it"
  - priority: 54
    category: state
    applies_to: "POST /lifeline/subscriber-cases/{id}/decide"
    condition: "the case status != UNDER_REVIEW"
    error_id: ERR_CASE_NOT_UNDER_REVIEW
    http_status: 409
  - priority: 55
    category: state
    applies_to: "POST /lifeline/subscriber-cases/{id}/assign-review"
    condition: "the case status not IN {SUBMITTED, REMANDED}"
    error_id: ERR_CASE_NOT_ASSIGNABLE
    http_status: 409
  - priority: 56
    category: state
    applies_to: "POST /lifeline/enrollments/{id}/device-issuance"
    condition: "the enrollment device_status != AWAITING_DEVICE, or the explicitly named device_id has status != IN_STOCK"
    error_id: ERR_DEVICE_ALREADY_ISSUED
    http_status: 409
  - priority: 57
    category: state
    applies_to: "POST /lifeline/devices/{id}/return"
    condition: "the device status not IN {ISSUED, RECLAIM_PENDING}"
    error_id: ERR_DEVICE_NOT_ISSUED
    http_status: 409
    notes: "returning an IN_STOCK, RETIRED or LOST handset fails here"
  - priority: 58
    category: state
    applies_to: "POST /lifeline/addresses/{id}/duplicate-resolution"
    condition: "the address status != DUPLICATE_FLAGGED"
    error_id: ERR_ADDRESS_NOT_FLAGGED
    http_status: 409
  - priority: 59
    category: state
    applies_to: "POST /lifeline/enrollments, POST /lifeline/providers/{id}/devices, POST /lifeline/reimbursement-claims, POST /lifeline/service-transfers/{id}/accept"
    condition: "the acting or targeted Provider status != ACTIVE"
    error_id: ERR_PROVIDER_NOT_ACTIVE
    http_status: 409
    notes: "on accept the TARGET provider is the one tested, because a suspended carrier cannot absorb a port"
  - priority: 60
    category: business_referential
    applies_to: "POST /lifeline/subscribers"
    condition: "another Subscriber already has the same identity_key"
    error_id: ERR_DUPLICATE_SUBSCRIBER_IDENTITY
    http_status: 409
    notes: "identity_key is the normalized full_name + date_of_birth + last4_ssn triple"
  - priority: 61
    category: business_constraint
    applies_to: "POST /lifeline/subscribers/{id}/eligibility-checks"
    condition: "the subscriber status == BARRED"
    error_id: ERR_SUBSCRIBER_BARRED
    http_status: 409
    notes: "terminal-state lockdown for a subscriber that has reached SUBSCRIBER_BAR_THRESHOLD de-enrollments"
  - priority: 62
    category: business_safety
    applies_to: "POST /lifeline/enrollments"
    condition: "per calculations.household_benefit_occupancy, the candidate half-open benefit interval overlaps enough existing intervals at certified_address_id that occupancy would exceed max_permitted_benefit_slots"
    error_id: ERR_ONE_PER_HOUSEHOLD_VIOLATION
    http_status: 409
    notes: "PRIORITY PAIR B, lower member. The one-benefit-per-household rule is the program's central safety constraint and therefore outranks every fiscal check."
  - priority: 64
    category: business_referential
    applies_to: "POST /lifeline/enrollments"
    condition: "the HouseholdAddress named by certified_address_id has status == DUPLICATE_FLAGGED"
    error_id: ERR_ADDRESS_DUPLICATE_UNRESOLVED
    http_status: 409
    notes: "an unresolved duplicate cohort must be adjudicated by a ProgramAdministrator before any of its dwellings can take a new enrollment"
  - priority: 66
    category: business_constraint
    applies_to: "POST /lifeline/enrollments"
    condition: "one_per_household_attested in the request is false or absent"
    error_id: ERR_HOUSEHOLD_CERTIFICATION_MISSING
    http_status: 422
    notes: "the subscriber's own certification, distinct from the system-side occupancy test at priority 62"
  - priority: 68
    category: business_constraint
    applies_to: "POST /lifeline/enrollments"
    condition: "the state_code of the HouseholdAddress named by certified_address_id is not in the Provider licensed_state_codes list"
    error_id: ERR_PROVIDER_NOT_LICENSED_IN_STATE
    http_status: 409
    notes: "PRIORITY PAIR A, higher member (paired with priority 45 ERR_ELIGIBILITY_CHECK_EXPIRED) and PRIORITY PAIR C partner category. A request that trips both 45 and 68 must return ERR_ELIGIBILITY_CHECK_EXPIRED."
  - priority: 70
    category: business_constraint
    applies_to: "POST /lifeline/subscribers/{id}/eligibility-checks"
    condition: "claimed_basis == INCOME and, under the strict_annualized variant, evaluated_income_cents > income_threshold_cents"
    error_id: ERR_SUBSCRIBER_INCOME_ABOVE_THRESHOLD
    http_status: 409
  - priority: 71
    category: business_constraint
    applies_to: "POST /lifeline/subscribers/{id}/eligibility-checks"
    condition: "claimed_basis == BENEFIT and the subscriber qualifying_benefit == NONE, or claimed_basis == BENEFIT with a tribal-only qualifying_benefit (TRIBAL_TANF or BIA_GENERAL_ASSISTANCE) while the subscriber tribal_lands_flag == false"
    error_id: ERR_NO_QUALIFYING_BASIS
    http_status: 409
  - priority: 72
    category: business_constraint
    applies_to: "POST /lifeline/eligibility-checks/{id}/resubmit-documentation"
    condition: "resubmission_count >= MAX_DOCUMENTATION_RESUBMISSIONS (2)"
    error_id: ERR_RESUBMISSION_LIMIT_EXCEEDED
    http_status: 409
    notes: "bounds the DOCUMENTATION_REQUIRED cycle"
  - priority: 74
    category: business_temporal
    applies_to: "POST /lifeline/service-transfers"
    condition: "clock now < the enrollment port_freeze_until (half-open window per calculations.benefit_port_freeze_window)"
    error_id: ERR_PORT_FREEZE_ACTIVE
    http_status: 409
  - priority: 75
    category: business_constraint
    applies_to: "POST /lifeline/service-transfers"
    condition: "target_provider_id equals the enrollment current provider_id"
    error_id: ERR_TRANSFER_SAME_PROVIDER
    http_status: 422
  - priority: 76
    category: business_temporal
    applies_to: "POST /lifeline/enrollments/{id}/device-issuance"
    condition: "clock now falls inside the closed freeze interval of calculations.device_issuance_freeze_window and no waiver applies"
    error_id: ERR_DEVICE_FREEZE_ACTIVE
    http_status: 409
    notes: "PRIORITY PAIR C, lower member. A request that is both inside the handset freeze AND facing an empty stock pool must report ERR_DEVICE_FREEZE_ACTIVE: the temporal bar is a policy fact about the subscriber, and reporting an inventory problem instead would invite the carrier to restock and retry pointlessly."
  - priority: 78
    category: business_safety
    applies_to: "POST /lifeline/enrollments/{id}/device-issuance"
    condition: "some Device with status IN {ISSUED, RECLAIM_PENDING} already has issued_enrollment_id pointing at an enrollment of the same subscriber_id"
    error_id: ERR_SINGLE_DEVICE_PER_SUBSCRIBER
    http_status: 409
    notes: "spans enrollments, so it catches a subscriber holding a live or unreturned handset from a prior benefit period, including one at another carrier. RECLAIM_PENDING counts as outstanding: it waives the freeze of priority 76 but still trips this rule, so a re-enrolled subscriber must physically return the old handset first"
  - priority: 80
    category: business_constraint
    applies_to: "POST /lifeline/enrollments/{id}/device-issuance"
    condition: "device_id was omitted and no Device of the enrollment provider has status == IN_STOCK"
    error_id: ERR_NO_DEVICE_IN_STOCK
    http_status: 409
    notes: "PRIORITY PAIR C, higher member (paired with priority 76 ERR_DEVICE_FREEZE_ACTIVE)"
  - priority: 82
    category: business_temporal
    applies_to: "POST /lifeline/enrollments/{id}/usage"
    condition: "usage_status == NON_USAGE_FLAGGED and clock now > cure_deadline_at"
    error_id: ERR_CURE_PERIOD_EXPIRED
    http_status: 409
    notes: "a usage event arriving after the cure deadline but before the next sweep cannot retroactively cure"
  - priority: 84
    category: business_temporal
    applies_to: "POST /lifeline/enrollments/{id}/recertify"
    condition: "clock now > recert_response_deadline_at"
    error_id: ERR_RECERT_WINDOW_CLOSED
    http_status: 409
  - priority: 86
    category: business_temporal
    applies_to: "POST /lifeline/reimbursement-claims/{id}/file"
    condition: "date(clock now) is on or before the last calendar day of the claim service_month"
    error_id: ERR_SERVICE_MONTH_NOT_CLOSED
    http_status: 409
    notes: "forces the provisional-to-final variant switch to happen after the month has closed"
  - priority: 88
    category: business_fiscal
    applies_to: "POST /lifeline/reimbursement-claims, POST /lifeline/reimbursement-claims/{id}/file"
    condition: "the Provider audit_hold_flag == true"
    error_id: ERR_PROVIDER_AUDIT_HOLD
    http_status: 409
    notes: "no new money may be drafted or certified while any claim of the provider sits in AUDIT_FAILED; clearing the hold by a granted appeal re-opens filing"
  - priority: 90
    category: business_fiscal
    applies_to: "POST /lifeline/reimbursement-claims"
    condition: "another ReimbursementClaim of this provider_id has the same service_month and status not IN {DRAFT, SUPERSEDED}"
    error_id: ERR_CLAIM_DUPLICATE_SERVICE_MONTH
    http_status: 409
    notes: "a DRAFT does not block: it is superseded instead, which is precisely what makes concurrency_rules.claim-draft-stale-provider a real race"
  - priority: 92
    category: business_constraint
    applies_to: "POST /lifeline/reimbursement-claims/{id}/audit-draw"
    condition: "sample_size < MIN_SAMPLE_SIZE (1) or sample_size > MAX_SAMPLE_SIZE (50)"
    error_id: ERR_INVALID_SAMPLE_SIZE
    http_status: 422
  - priority: 94
    category: business_constraint
    applies_to: "POST /lifeline/reimbursement-claims/{id}/audit-draw"
    condition: "the candidate pool of calculations.audit_sample_selection is empty"
    error_id: ERR_EMPTY_SAMPLE_POOL
    http_status: 409
  - priority: 96
    category: business_temporal
    applies_to: "POST /lifeline/subscriber-cases"
    condition: "case_type == DE_ENROLLMENT_APPEAL and clock now > the enrollment appeal_deadline_at"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 409
    notes: "appeal_deadline_at is date(de_enrolled_at) + APPEAL_WINDOW_DAYS (30) days at 23:59:59.999Z; the boundary instant is still inside the window"
  - priority: 98
    category: business_constraint
    applies_to: "POST /lifeline/subscriber-cases, POST /lifeline/subscriber-cases/{id}/decide"
    condition: "on create: case_type == DE_ENROLLMENT_APPEAL and the enrollment benefit_status != DE_ENROLLED, or case_type == SERVICE_COMPLAINT and the enrollment benefit_status != ACTIVE. On decide: decision == GRANT_REINSTATE with case_type != DE_ENROLLMENT_APPEAL, or decision == RESOLVE_WITH_CREDIT with case_type != SERVICE_COMPLAINT"
    error_id: ERR_APPEAL_NOT_APPLICABLE
    http_status: 409
    notes: "the polymorphic guard: the two case_type values admit disjoint decision sets"
  - priority: 99
    category: business_constraint
    applies_to: "POST /lifeline/subscriber-cases/{id}/assign-review"
    condition: "review_round >= MAX_REVIEW_ROUNDS (3)"
    error_id: ERR_REVIEW_ROUND_LIMIT
    http_status: 409
    notes: "bounds the UNDER_REVIEW / REMANDED cycle"
  - priority: 100
    category: business_fiscal
    applies_to: "POST /lifeline/enrollments, POST /lifeline/service-transfers/{id}/accept"
    condition: "the Provider active_enrollment_count + 1 > the Provider enrollment_cap"
    error_id: ERR_PROVIDER_ENROLLMENT_CAP_EXCEEDED
    http_status: 409
    notes: "PRIORITY PAIR B, higher member (paired with priority 62 ERR_ONE_PER_HOUSEHOLD_VIOLATION). Aggregate check: each individual enrollment is valid, only the collective breaches the cap. A request that trips both 62 and 100 must return ERR_ONE_PER_HOUSEHOLD_VIOLATION."

endpoints:
  - method: POST
    path: /lifeline/providers
    purpose: "Register an eligible telecommunications carrier"
    roles: [ProgramAdministrator]
    input: [name, spin_id, study_area_code, licensed_state_codes, enrollment_cap, "status?"]
    output: Provider
    side_effects:
      - "all derived counters initialise to 0 and audit_hold_flag to false"
      - "status defaults to ACTIVE when omitted"
  - method: GET
    path: /lifeline/providers/{id}
    purpose: "Read one carrier including its live ledger and device counters"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: []
    output: Provider
    side_effects: []
  - method: POST
    path: /lifeline/addresses
    purpose: "Register a service address and evaluate the duplicate-address cohort"
    roles: [ProviderAgent, ProgramAdministrator]
    input: [address_line1, "unit_designator?", city, state_code, postal_code]
    output: HouseholdAddress
    side_effects:
      - "address_hash computed by calculations.address_normalization_hash"
      - "cohort_address_count recomputed on this row and on every pre-existing row sharing the hash"
      - "when the cohort now holds two or more rows, every row in it whose status IN {UNVERIFIED, RESOLVED_MULTI_HOUSEHOLD, RESOLVED_SINGLE_HOUSEHOLD} moves to DUPLICATE_FLAGGED, has max_permitted_benefit_slots reset to 1, and has version incremented by 1; the newly created row is itself created directly in DUPLICATE_FLAGGED"
      - "occupied_benefit_slots initialises to 0 and max_permitted_benefit_slots to 1"
  - method: GET
    path: /lifeline/addresses/{id}
    purpose: "Read one service address with its cohort and occupancy figures"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: []
    output: HouseholdAddress
    side_effects: []
  - method: POST
    path: /lifeline/addresses/{id}/duplicate-resolution
    purpose: "Adjudicate a duplicate-address cohort as one household or as independent households"
    roles: [ProgramAdministrator]
    input: [resolution, expected_address_version, "declared_household_count?", "independent_household_worksheet_ref?", "resolution_note?"]
    output: HouseholdAddress
    side_effects:
      - "OCC on expected_address_version per §1.2.1 address-resolution-stale-address"
      - "resolution == MULTI_HOUSEHOLD requires declared_household_count >= 2 and independent_household_worksheet_ref, and sets max_permitted_benefit_slots = declared_household_count"
      - "resolution == SINGLE_HOUSEHOLD sets max_permitted_benefit_slots = 1, then de-enrolls every ACTIVE enrollment at this address except the earliest under benefit_start_date ASC, created_at ASC, with de_enrollment_reason = DUPLICATE_HOUSEHOLD"
      - "each de-enrolled enrollment with device_status == DEVICE_ISSUED moves to RECLAIM_PENDING and its ISSUED Device to RECLAIM_PENDING, then the owning Provider device counters and active_enrollment_count are recomputed and its version incremented by 1"
      - "every Subscriber at this address in DUPLICATE_HOLD is released to VERIFIED_ELIGIBLE or PROSPECT"
      - "occupied_benefit_slots recomputed; version incremented by 1"
  - method: POST
    path: /lifeline/subscribers
    purpose: "Create a benefit applicant bound to a service address"
    roles: [ProviderAgent, ProgramAdministrator]
    input: [full_name, date_of_birth, last4_ssn, address_id, household_size, annual_income_cents, "last_3mo_income_cents?", "qualifying_benefit?", "tribal_lands_flag?"]
    output: Subscriber
    side_effects:
      - "identity_key computed from the normalized full_name, date_of_birth and last4_ssn"
      - "income_threshold_cents computed by calculations.fpg_income_threshold"
      - "status is DUPLICATE_HOLD when the named address is already DUPLICATE_FLAGGED, otherwise PROSPECT"
      - "eligibility_basis initialises to NONE and de_enrollment_count to 0"
  - method: GET
    path: /lifeline/subscribers/{id}
    purpose: "Read one applicant or subscriber"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: []
    output: Subscriber
    side_effects: []
  - method: GET
    path: /lifeline/subscribers
    purpose: "List subscribers, filterable by address for duplicate-cohort review"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: ["address_id?", "status?", "eligibility_basis?", "identity_key?", "limit?", "offset?"]
    output: Subscriber[]
    side_effects: []
  - method: POST
    path: /lifeline/subscribers/{id}/eligibility-checks
    purpose: "Open a National Verifier eligibility check for an applicant"
    roles: [ProviderAgent, ProgramAdministrator]
    input: [claimed_basis, "proof_document_ref?"]
    output: EligibilityCheck
    side_effects:
      - "income_threshold_cents snapshotted from calculations.fpg_income_threshold"
      - "for claimed_basis == INCOME, income_variant = STRICT_ANNUALIZED and evaluated_income_cents = the subscriber annual_income_cents; for benefit bases income_variant = NOT_APPLICABLE"
      - "Subscriber.status PROSPECT -> ELIGIBILITY_PENDING, or DE_ENROLLED -> ELIGIBILITY_PENDING on re-application; a DUPLICATE_HOLD subscriber keeps its status"
      - "status initialises to PENDING_VERIFIER, resubmission_count to 0, verifier_outcome to null"
  - method: GET
    path: /lifeline/subscribers/{id}/eligibility-checks
    purpose: "List every eligibility check ever opened for one applicant"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: ["status?", "claimed_basis?", "limit?", "offset?"]
    output: EligibilityCheck[]
    side_effects: []
  - method: GET
    path: /lifeline/eligibility-checks/{id}
    purpose: "Read one eligibility check with its verifier outcome and validity window"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: []
    output: EligibilityCheck
    side_effects: []
  - method: POST
    path: /lifeline/eligibility-checks/{id}/verifier-result
    purpose: "Post the National Verifier determination onto a pending check"
    roles: [NationalVerifier]
    input: [verifier_outcome, "verifier_reason_code?", "matched_benefit?"]
    output: EligibilityCheck
    side_effects:
      - "MATCH sets status ELIGIBLE_CONFIRMED, confirmed_at = clock now and expires_at per calculations.eligibility_certification_validity, and moves the Subscriber to VERIFIED_ELIGIBLE with eligibility_basis recomputed"
      - "NO_MATCH sets status INELIGIBLE and returns the Subscriber to PROSPECT"
      - "DOCUMENTATION_REQUIRED sets status DOCUMENTATION_REQUIRED and leaves the Subscriber in ELIGIBILITY_PENDING"
  - method: POST
    path: /lifeline/eligibility-checks/{id}/resubmit-documentation
    purpose: "Resubmit proof documents on a check the verifier bounced"
    roles: [ProviderAgent]
    input: [proof_document_ref]
    output: EligibilityCheck
    side_effects:
      - "status DOCUMENTATION_REQUIRED -> PENDING_VERIFIER, resubmission_count incremented by 1"
      - "verifier_outcome and verifier_reason_code cleared to null"
      - "rejected with ERR_RESUBMISSION_LIMIT_EXCEEDED once resubmission_count has reached 2"
  - method: POST
    path: /lifeline/enrollments
    purpose: "Enroll a verified applicant with a carrier at a certified address"
    roles: [ProviderAgent]
    input: [subscriber_id, provider_id, eligibility_check_id, certified_address_id, service_type, one_per_household_attested, "benefit_start_date?"]
    output: Enrollment
    side_effects:
      - "benefit_start_date defaults to clock now; port_freeze_until and recert_due_date derived from it"
      - "the four state dimensions initialise to ACTIVE / PENDING_FIRST_USE / NOT_DUE / AWAITING_DEVICE"
      - "audit_risk_score computed; transfer_count, device_issuance_count and reinstatement_count initialise to 0"
      - "Subscriber.status VERIFIED_ELIGIBLE -> ENROLLED"
      - "the certified HouseholdAddress occupied_benefit_slots recomputed and version incremented by 1"
      - "Provider.active_enrollment_count recomputed and version incremented by 1"
  - method: GET
    path: /lifeline/enrollments/{id}
    purpose: "Read one enrollment with all four state dimensions"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: /lifeline/enrollments
    purpose: "List enrollments, filterable by subscriber, carrier, certifying check, address or any state dimension"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: ["subscriber_id?", "provider_id?", "eligibility_check_id?", "certified_address_id?", "benefit_status?", "usage_status?", "recert_status?", "device_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: /lifeline/enrollments/{id}/usage
    purpose: "Record subscriber activity, curing a non-usage flag when inside the cure period"
    roles: [ProviderAgent, ProgramAdministrator]
    input: ["usage_at?", "usage_kind?"]
    output: Enrollment
    side_effects:
      - "last_usage_at advanced to usage_at or clock now; it never rewinds"
      - "usage_status PENDING_FIRST_USE -> USING, or NON_USAGE_FLAGGED -> USING with non_usage_flagged_at and cure_deadline_at cleared when clock now <= cure_deadline_at"
      - "audit_risk_score recomputed"
  - method: POST
    path: /lifeline/enrollments/{id}/recertify
    purpose: "Answer the annual recertification notice with a fresh income or benefit attestation"
    roles: [Subscriber]
    input: [household_size, annual_income_cents, last_3mo_income_cents, attested_qualifying_benefit, "attestation_ref?"]
    output: Enrollment
    side_effects:
      - "the Subscriber household figures are overwritten and income_threshold_cents recomputed"
      - "recert_evaluated_income_cents uses the three_month_averaged variant of calculations.eligibility_income_evaluation; recert_income_threshold_cents snapshotted"
      - "eligible arm: recert_status -> NOT_DUE, recert_due_date re-anchored on the response date, notice fields cleared"
      - "ineligible arm: recert_status -> RESPONDED_INELIGIBLE and benefit_status -> DE_ENROLLED with de_enrollment_reason = INELIGIBLE_ON_RECERT, plus the full de-enrollment cascade"
  - method: POST
    path: /lifeline/enrollments/{id}/de-enroll
    purpose: "De-enroll a subscriber at request or for a known duplicate household"
    roles: [ProviderAgent, ProgramAdministrator]
    input: [de_enrollment_reason, "note?"]
    output: Enrollment
    side_effects:
      - "benefit_status -> DE_ENROLLED, benefit_end_date and de_enrolled_at = clock now, de_enrolled_by_ref = X-User-ID, appeal_deadline_at = date(de_enrolled_at) + 30 days at 23:59:59.999Z"
      - "the certified HouseholdAddress occupied_benefit_slots recomputed, and when it reaches 0 on a DUPLICATE_FLAGGED address the address auto-resolves to RESOLVED_SINGLE_HOUSEHOLD and releases every DUPLICATE_HOLD subscriber at it"
      - "Provider.active_enrollment_count recomputed and version incremented by 1"
      - "Subscriber.de_enrollment_count recomputed and status -> DE_ENROLLED or BARRED"
      - "device_status DEVICE_ISSUED -> RECLAIM_PENDING with the ISSUED Device -> RECLAIM_PENDING and Provider device counters recomputed"
  - method: POST
    path: /lifeline/providers/{id}/devices
    purpose: "Add a handset to a carrier's issuable inventory"
    roles: [ProviderAgent, ProgramAdministrator]
    input: [imei, model_tier, unit_cost_cents]
    output: Device
    side_effects:
      - "status initialises to IN_STOCK; issued_enrollment_id, issued_at, returned_at and return_condition are null"
      - "Provider.devices_total_count and devices_in_stock_count recomputed and version incremented by 1"
  - method: GET
    path: /lifeline/devices/{id}
    purpose: "Read one handset"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: []
    output: Device
    side_effects: []
  - method: GET
    path: /lifeline/devices
    purpose: "List handsets, filterable by carrier, issuing enrollment or status"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: ["provider_id?", "issued_enrollment_id?", "status?", "model_tier?", "limit?", "offset?"]
    output: Device[]
    side_effects: []
  - method: POST
    path: /lifeline/enrollments/{id}/device-issuance
    purpose: "Issue a handset to an active enrollment, honouring the reissue freeze and the one-device rule"
    roles: [ProviderAgent]
    input: ["device_id?"]
    output: Device
    side_effects:
      - "when device_id is omitted the handset is chosen by calculations.device_selection_policy"
      - "Device status IN_STOCK -> ISSUED with issued_enrollment_id and issued_at = clock now"
      - "Enrollment device_status AWAITING_DEVICE -> DEVICE_ISSUED, last_device_issued_at = clock now, device_issuance_count incremented by 1, audit_risk_score recomputed"
      - "Provider devices_in_stock_count and devices_issued_count recomputed and version incremented by 1"
  - method: POST
    path: /lifeline/devices/{id}/return
    purpose: "Take a handset back from a subscriber and route it by condition"
    roles: [ProviderAgent, ProgramAdministrator]
    input: [return_condition]
    output: Device
    side_effects:
      - "returned_at = clock now, return_condition stored"
      - "GOOD -> IN_STOCK, DAMAGED -> RETIRED, LOST -> LOST"
      - "the issuing Enrollment device_status -> AWAITING_DEVICE"
      - "Provider device counters recomputed and version incremented by 1; devices_total_count never changes"
      - "a DAMAGED or LOST return waives the reissue freeze of calculations.device_issuance_freeze_window; a GOOD return does not"
  - method: POST
    path: /lifeline/service-transfers
    purpose: "Open a port of an active benefit from the current carrier to a gaining carrier"
    roles: [ProviderAgent]
    input: [enrollment_id, target_provider_id, subscriber_consent_ref, expected_enrollment_version]
    output: ServiceTransfer
    side_effects:
      - "OCC on expected_enrollment_version per §1.2.1 transfer-request-stale-enrollment"
      - "source_provider_id is copied from the enrollment current provider_id; requested_at = clock now; port_freeze_until_snapshot records the freeze that was tested"
      - "every other ServiceTransfer for this enrollment_id in REQUESTED moves to SUPERSEDED"
      - "Enrollment.version incremented by 1"
  - method: GET
    path: /lifeline/service-transfers/{id}
    purpose: "Read one port request"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: []
    output: ServiceTransfer
    side_effects: []
  - method: GET
    path: /lifeline/service-transfers
    purpose: "List port requests, filterable by enrollment or by either carrier side"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: ["enrollment_id?", "source_provider_id?", "target_provider_id?", "status?", "limit?", "offset?"]
    output: ServiceTransfer[]
    side_effects: []
  - method: POST
    path: /lifeline/service-transfers/{id}/accept
    purpose: "Gaining carrier accepts the port and takes over the benefit"
    roles: [ProviderAgent]
    input: ["acceptance_note?"]
    output: ServiceTransfer
    side_effects:
      - "status -> ACCEPTED_COMPLETED, completed_at = clock now"
      - "Enrollment.provider_id rewritten to target_provider_id, transfer_count incremented by 1, audit_risk_score recomputed; benefit_start_date, port_freeze_until and recert_due_date are preserved verbatim"
      - "the source carrier's ISSUED Device for this enrollment -> RECLAIM_PENDING and Enrollment.device_status -> RECLAIM_PENDING"
      - "Enrollment.usage_status -> PENDING_FIRST_USE with last_usage_at, non_usage_flagged_at and cure_deadline_at cleared"
      - "source and target Provider active_enrollment_count and device counters recomputed, both versions incremented by 1"
  - method: POST
    path: /lifeline/service-transfers/{id}/reject
    purpose: "Gaining carrier declines the port"
    roles: [ProviderAgent]
    input: [rejection_reason, "rejection_note?"]
    output: ServiceTransfer
    side_effects:
      - "status -> REJECTED, rejection_reason stored, completed_at = clock now"
      - "the Enrollment is left completely untouched"
  - method: POST
    path: /lifeline/reimbursement-claims
    purpose: "Open a monthly subsidy reimbursement draft priced provisionally"
    roles: [ProviderAgent]
    input: [provider_id, service_month, expected_provider_version]
    output: ReimbursementClaim
    side_effects:
      - "OCC on expected_provider_version per §1.2.1 claim-draft-stale-provider"
      - "provisional_amount_cents and covered_enrollment_count computed by the provisional_snapshot variant of calculations.claim_support_amount"
      - "final_amount_cents, variance_cents, recoupment_amount_cents, penalty_cents, net_payable_cents, audit_sample_count and failed_sample_count initialise to 0"
      - "any other DRAFT of the same provider_id and service_month moves to SUPERSEDED"
      - "Provider.open_claim_count recomputed and version incremented by 1"
  - method: GET
    path: /lifeline/reimbursement-claims/{id}
    purpose: "Read one claim with its provisional, final and recoupment figures"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: []
    output: ReimbursementClaim
    side_effects: []
  - method: GET
    path: /lifeline/reimbursement-claims
    purpose: "List claims, filterable by carrier, service month or status"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: ["provider_id?", "service_month?", "status?", "limit?", "offset?"]
    output: ReimbursementClaim[]
    side_effects: []
  - method: POST
    path: /lifeline/reimbursement-claims/{id}/file
    purpose: "Certify and file a claim for a closed service month at its final amount"
    roles: [ProviderAgent]
    input: [certifying_officer_ref]
    output: ReimbursementClaim
    side_effects:
      - "final_amount_cents and covered_enrollment_count recomputed by the final_filed variant of calculations.claim_support_amount, which includes mid-month de-enrollments the provisional snapshot omitted"
      - "variance_cents = final_amount_cents - provisional_amount_cents"
      - "status DRAFT -> FILED, filed_at = clock now, certifying_officer_ref stored"
      - "Provider claim_gross_cents, net_reimbursed_cents and open_claim_count recomputed per calculations.provider_ledger_reconciliation and version incremented by 1"
  - method: POST
    path: /lifeline/reimbursement-claims/{id}/audit-draw
    purpose: "Draw a risk-ranked audit sample from the enrollments a filed claim paid for"
    roles: [ComplianceAuditor]
    input: [sample_size]
    output: AuditSample[]
    side_effects:
      - "one AuditSample per selected enrollment, ranked and populated by calculations.audit_sample_selection"
      - "status FILED -> UNDER_AUDIT, audit_sample_count recomputed, sample_drawn_by_ref = X-User-ID"
      - "sample_drawn_by_ref is the identity the segregation-of-duties check later bars from adjudicating"
  - method: GET
    path: /lifeline/audit-samples/{id}
    purpose: "Read one drawn audit sample with its finding"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: []
    output: AuditSample
    side_effects: []
  - method: GET
    path: /lifeline/audit-samples
    purpose: "List audit samples, filterable by claim, enrollment or finding"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: ["claim_id?", "enrollment_id?", "status?", "finding?", "limit?", "offset?"]
    output: AuditSample[]
    side_effects: []
  - method: POST
    path: /lifeline/audit-samples/{id}/adjudicate
    purpose: "Record the audit finding on one sampled enrollment and settle the claim"
    roles: [ComplianceAuditor]
    input: [finding, "finding_note?"]
    output: AuditSample
    side_effects:
      - "finding stored, adjudicated_by_ref = X-User-ID, disallowed_support_cents = 0 for COMPLIANT else claimed_line_cents"
      - "COMPLIANT with no DRAWN samples left and failed_sample_count == 0 drives the claim to AUDIT_PASSED with recoupment 0 and net_payable_cents = final_amount_cents"
      - "any non-COMPLIANT finding drives the claim straight to AUDIT_FAILED with recoupment_amount_cents, penalty_cents and net_payable_cents from calculations.audit_recoupment_amount"
      - "the AUDIT_FAILED write then sets Provider.recouped_cents, net_reimbursed_cents and audit_hold_flag = true, and every other FILED claim of that Provider moves to HELD"
      - "findings IN {INELIGIBLE_SUBSCRIBER, DUPLICATE_HOUSEHOLD, MISSING_CERTIFICATION} additionally de-enroll the sampled Enrollment with de_enrollment_reason = AUDIT_INELIGIBLE"
  - method: POST
    path: /lifeline/subscriber-cases
    purpose: "File a service complaint or a de-enrollment appeal"
    roles: [Subscriber, ProviderAgent, ProgramAdministrator]
    input: [subscriber_id, enrollment_id, case_type, narrative]
    output: SubscriberCase
    side_effects:
      - "status initialises to SUBMITTED, review_round to 0, decision to null, reinstated_enrollment_flag to false"
      - "DE_ENROLLMENT_APPEAL requires the enrollment benefit_status == DE_ENROLLED and clock now <= appeal_deadline_at"
      - "SERVICE_COMPLAINT requires the enrollment benefit_status == ACTIVE"
  - method: GET
    path: /lifeline/subscriber-cases/{id}
    purpose: "Read one complaint or appeal with its review history"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: []
    output: SubscriberCase
    side_effects: []
  - method: GET
    path: /lifeline/subscriber-cases
    purpose: "List complaints and appeals, filterable by subscriber, enrollment, type or status"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: ["subscriber_id?", "enrollment_id?", "case_type?", "status?", "limit?", "offset?"]
    output: SubscriberCase[]
    side_effects: []
  - method: POST
    path: /lifeline/subscriber-cases/{id}/assign-review
    purpose: "Assign or reassign a reviewer, opening a review round"
    roles: [ProgramAdministrator]
    input: [reviewer_ref]
    output: SubscriberCase
    side_effects:
      - "status SUBMITTED or REMANDED -> UNDER_REVIEW, reviewer_ref stored, review_round incremented by 1"
      - "rejected with ERR_REVIEW_ROUND_LIMIT once review_round has reached 3"
  - method: POST
    path: /lifeline/subscriber-cases/{id}/decide
    purpose: "Decide a complaint or appeal, reinstating the benefit when the appeal is granted"
    roles: [ProgramAdministrator]
    input: [decision, decision_rationale]
    output: SubscriberCase
    side_effects:
      - "decision, decision_rationale, decided_at = clock now and decided_by_ref = X-User-ID stored"
      - "REMAND returns the case to REMANDED and touches nothing else"
      - "GRANT_REINSTATE (DE_ENROLLMENT_APPEAL only) sets status GRANTED and reinstated_enrollment_flag = true, then reinstates the Enrollment: benefit_status -> ACTIVE, benefit_end_date and the de_enrollment_* fields cleared, usage_status -> PENDING_FIRST_USE, recert_status -> NOT_DUE, reinstatement_count incremented by 1, and the address, provider and subscriber counters recomputed"
      - "when the reinstated enrollment was de-enrolled for AUDIT_INELIGIBLE the audit reversal also fires: the newest ADJUDICATED_FAIL sample for that enrollment -> ADJUDICATED_PASS with finding COMPLIANT, its claim AUDIT_FAILED -> AUDIT_PASSED with recoupment and penalty back to 0, Provider recouped_cents and net_reimbursed_cents restored and audit_hold_flag -> false, and every HELD claim of that Provider back to FILED"
      - "DENY sets status DENIED; RESOLVE_WITH_CREDIT (SERVICE_COMPLAINT only) sets status RESOLVED; neither touches the Enrollment"
      - "blocked with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals the enrollment de_enrolled_by_ref"
  - method: POST
    path: /lifeline/providers/{id}/compliance-sweep
    purpose: "Run the non-usage and recertification sweep over one carrier's active enrollments"
    roles: [ProgramAdministrator]
    input: []
    output: "{ swept_at: datetime, evaluated_enrollment_count: integer, non_usage_flagged_enrollment_ids: string[], cure_expired_de_enrolled_enrollment_ids: string[], recert_noticed_enrollment_ids: string[], recert_non_response_de_enrolled_enrollment_ids: string[] }"
    side_effects:
      - "the four steps of calculations.compliance_sweep_processing_order run in order over the carrier's ACTIVE enrollments, visited by benefit_start_date ASC then created_at ASC"
      - "step 1 flags non-usage and sets cure_deadline_at; step 2 expires an already-flagged cure and de-enrolls for NON_USAGE"
      - "step 3 issues recertification notices; step 4 de-enrolls for RECERT_NON_RESPONSE past the response deadline"
      - "each de-enrollment fires the full four-link cascade through the address, its DUPLICATE_HOLD subscribers, the provider counters and any issued handset"
      - "a freshly flagged enrollment can never be cure-expired by the same sweep, and a row de-enrolled at step 2 is skipped by steps 3 and 4"
  - method: POST
    path: /lifeline/_clock/set_current_utc
    purpose: "Test-only: move the server's logical clock so temporal windows can be crossed deterministically"
    roles: [ProgramAdministrator, ProviderAgent, NationalVerifier, ComplianceAuditor, Subscriber]
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "the logical clock every other endpoint reads as `clock now` is set to to_iso8601"
      - "the clock starts at the fixed default 2026-08-01T00:00:00Z on server startup and moves only through this endpoint; it never advances on its own"
      - "no business row is written and no sweep is triggered; setting the clock backwards is permitted"

errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Missing or empty X-User-ID / X-User-Role header"
    triggered_by: "any endpoint called without both identity headers"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Role not permitted for this operation or resource"
    triggered_by: "an unlisted role on an endpoint, or a ProviderAgent reaching into another carrier's rows, or a Subscriber acting on another subscriber's enrollment"
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    message: "Request body failed schema validation"
    triggered_by: "a missing required field, a wrong JSON type, an out-of-range number or an unknown enum value"
  - error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    message: "Provider not found"
    triggered_by: "an unknown provider id in the path or in provider_id / target_provider_id"
  - error_id: ERR_ADDRESS_NOT_FOUND
    http_status: 404
    message: "Household address not found"
    triggered_by: "an unknown address id in the path or in address_id / certified_address_id"
  - error_id: ERR_SUBSCRIBER_NOT_FOUND
    http_status: 404
    message: "Subscriber not found"
    triggered_by: "an unknown subscriber id in the path or in subscriber_id"
  - error_id: ERR_ELIGIBILITY_CHECK_NOT_FOUND
    http_status: 404
    message: "Eligibility check not found"
    triggered_by: "an unknown check id in the path or in eligibility_check_id"
  - error_id: ERR_ENROLLMENT_NOT_FOUND
    http_status: 404
    message: "Enrollment not found"
    triggered_by: "an unknown enrollment id in the path or in enrollment_id"
  - error_id: ERR_DEVICE_NOT_FOUND
    http_status: 404
    message: "Device not found"
    triggered_by: "an unknown device id in the path or in device_id"
  - error_id: ERR_SERVICE_TRANSFER_NOT_FOUND
    http_status: 404
    message: "Service transfer not found"
    triggered_by: "an unknown transfer id in the path"
  - error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    message: "Reimbursement claim not found"
    triggered_by: "an unknown claim id in the path or in claim_id"
  - error_id: ERR_AUDIT_SAMPLE_NOT_FOUND
    http_status: 404
    message: "Audit sample not found"
    triggered_by: "an unknown sample id in the path"
  - error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    message: "Subscriber case not found"
    triggered_by: "an unknown case id in the path"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The acting identity is barred from this step because it performed the conflicting step"
    triggered_by: "the drawer of an audit sample adjudicating it, or the operator who de-enrolled a subscriber deciding that subscriber's appeal"
  - error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
    message: "expected_enrollment_version does not match the current Enrollment version"
    triggered_by: "POST /lifeline/service-transfers with a stale enrollment version"
  - error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412
    message: "expected_provider_version does not match the current Provider version"
    triggered_by: "POST /lifeline/reimbursement-claims with a stale provider version"
  - error_id: ERR_STALE_ADDRESS_VERSION
    http_status: 412
    message: "expected_address_version does not match the current HouseholdAddress version"
    triggered_by: "POST /lifeline/addresses/{id}/duplicate-resolution with a stale address version"
  - error_id: ERR_ELIGIBILITY_CHECK_NOT_PENDING
    http_status: 409
    message: "Eligibility check is not awaiting a verifier result"
    triggered_by: "a second verifier-result on the same check"
  - error_id: ERR_DOCUMENTATION_NOT_REQUESTED
    http_status: 409
    message: "Eligibility check is not in DOCUMENTATION_REQUIRED"
    triggered_by: "resubmit-documentation on a check the verifier never bounced"
  - error_id: ERR_ELIGIBILITY_CHECK_NOT_CONFIRMED
    http_status: 409
    message: "Eligibility check has not been confirmed eligible"
    triggered_by: "POST /lifeline/enrollments citing a PENDING_VERIFIER, DOCUMENTATION_REQUIRED or INELIGIBLE check"
  - error_id: ERR_ELIGIBILITY_CHECK_EXPIRED
    http_status: 409
    message: "Eligibility certification has expired"
    triggered_by: "POST /lifeline/enrollments more than 90 days after confirmed_at"
  - error_id: ERR_SUBSCRIBER_NOT_ELIGIBLE
    http_status: 409
    message: "Subscriber is not in VERIFIED_ELIGIBLE"
    triggered_by: "POST /lifeline/enrollments for a PROSPECT, ELIGIBILITY_PENDING, DUPLICATE_HOLD, ENROLLED or DE_ENROLLED subscriber"
  - error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    message: "Enrollment benefit is not ACTIVE"
    triggered_by: "usage, recertify, device-issuance or a transfer request against a de-enrolled benefit"
  - error_id: ERR_ENROLLMENT_ALREADY_DE_ENROLLED
    http_status: 409
    message: "Enrollment has already been de-enrolled"
    triggered_by: "a second de-enroll of the same enrollment"
  - error_id: ERR_RECERT_NOT_NOTICED
    http_status: 409
    message: "No recertification notice is outstanding"
    triggered_by: "recertify while recert_status is NOT_DUE, NON_RESPONSIVE or RESPONDED_INELIGIBLE"
  - error_id: ERR_CLAIM_NOT_DRAFT
    http_status: 409
    message: "Claim is not in DRAFT"
    triggered_by: "filing a claim twice, or filing a SUPERSEDED draft"
  - error_id: ERR_CLAIM_NOT_FILED
    http_status: 409
    message: "Claim is not in FILED"
    triggered_by: "audit-draw on a DRAFT, HELD, UNDER_AUDIT, AUDIT_PASSED or AUDIT_FAILED claim"
  - error_id: ERR_SAMPLE_ALREADY_ADJUDICATED
    http_status: 409
    message: "Audit sample has already been adjudicated"
    triggered_by: "a second adjudicate on the same sample"
  - error_id: ERR_TRANSFER_NOT_REQUESTED
    http_status: 409
    message: "Service transfer is no longer open"
    triggered_by: "accepting or rejecting a transfer that is ACCEPTED_COMPLETED, REJECTED or SUPERSEDED"
  - error_id: ERR_CASE_NOT_UNDER_REVIEW
    http_status: 409
    message: "Case is not under review"
    triggered_by: "decide on a SUBMITTED, REMANDED, GRANTED, DENIED or RESOLVED case"
  - error_id: ERR_CASE_NOT_ASSIGNABLE
    http_status: 409
    message: "Case is not awaiting reviewer assignment"
    triggered_by: "assign-review on an UNDER_REVIEW or decided case"
  - error_id: ERR_DEVICE_ALREADY_ISSUED
    http_status: 409
    message: "The enrollment already holds a handset, or the named handset is not in stock"
    triggered_by: "device-issuance while device_status is DEVICE_ISSUED or RECLAIM_PENDING, or naming a device that is not IN_STOCK"
  - error_id: ERR_DEVICE_NOT_ISSUED
    http_status: 409
    message: "Device is not out with a subscriber"
    triggered_by: "returning an IN_STOCK, RETIRED or LOST handset"
  - error_id: ERR_ADDRESS_NOT_FLAGGED
    http_status: 409
    message: "Address is not flagged as a duplicate"
    triggered_by: "duplicate-resolution on an UNVERIFIED or already-resolved address"
  - error_id: ERR_PROVIDER_NOT_ACTIVE
    http_status: 409
    message: "Provider is not ACTIVE"
    triggered_by: "enrolling, stocking devices, drafting a claim, or accepting a port as a SUSPENDED carrier"
  - error_id: ERR_DUPLICATE_SUBSCRIBER_IDENTITY
    http_status: 409
    message: "A subscriber with this identity already exists"
    triggered_by: "POST /lifeline/subscribers repeating a full_name, date_of_birth and last4_ssn triple"
  - error_id: ERR_SUBSCRIBER_BARRED
    http_status: 409
    message: "Subscriber is barred from further eligibility screening"
    triggered_by: "opening an eligibility check for a subscriber that has reached 2 de-enrollments"
  - error_id: ERR_ONE_PER_HOUSEHOLD_VIOLATION
    http_status: 409
    message: "The household already holds the permitted number of concurrent Lifeline benefits"
    triggered_by: "POST /lifeline/enrollments whose benefit interval overlaps existing intervals beyond max_permitted_benefit_slots"
  - error_id: ERR_ADDRESS_DUPLICATE_UNRESOLVED
    http_status: 409
    message: "The service address sits in an unresolved duplicate cohort"
    triggered_by: "POST /lifeline/enrollments at a DUPLICATE_FLAGGED address"
  - error_id: ERR_HOUSEHOLD_CERTIFICATION_MISSING
    http_status: 422
    message: "one_per_household_attested must be true"
    triggered_by: "POST /lifeline/enrollments without the subscriber's household certification"
  - error_id: ERR_PROVIDER_NOT_LICENSED_IN_STATE
    http_status: 409
    message: "Provider is not licensed in the service address state"
    triggered_by: "POST /lifeline/enrollments where the address state_code is absent from licensed_state_codes"
  - error_id: ERR_SUBSCRIBER_INCOME_ABOVE_THRESHOLD
    http_status: 409
    message: "Annualized household income exceeds the program threshold"
    triggered_by: "an INCOME eligibility check whose strict_annualized figure is above income_threshold_cents"
  - error_id: ERR_NO_QUALIFYING_BASIS
    http_status: 409
    message: "The claimed qualifying basis is not supported by the subscriber record"
    triggered_by: "a BENEFIT check for a subscriber whose qualifying_benefit is NONE, or a BENEFIT check citing a tribal-only program for a non-tribal household"
  - error_id: ERR_RESUBMISSION_LIMIT_EXCEEDED
    http_status: 409
    message: "Documentation resubmission limit reached"
    triggered_by: "a third resubmit-documentation on the same check"
  - error_id: ERR_PORT_FREEZE_ACTIVE
    http_status: 409
    message: "The benefit is inside its porting freeze window"
    triggered_by: "POST /lifeline/service-transfers before benefit_start_date + 60 days"
  - error_id: ERR_TRANSFER_SAME_PROVIDER
    http_status: 422
    message: "target_provider_id equals the current carrier"
    triggered_by: "a port request that would not change carriers"
  - error_id: ERR_DEVICE_FREEZE_ACTIVE
    http_status: 409
    message: "The subscriber is inside the handset reissue freeze"
    triggered_by: "device-issuance inside the closed 395-day freeze with no damage, loss or reclaim waiver"
  - error_id: ERR_SINGLE_DEVICE_PER_SUBSCRIBER
    http_status: 409
    message: "The subscriber already holds an outstanding handset"
    triggered_by: "device-issuance while any ISSUED or RECLAIM_PENDING device points at any enrollment of the same subscriber"
  - error_id: ERR_NO_DEVICE_IN_STOCK
    http_status: 409
    message: "The carrier has no handset in stock"
    triggered_by: "device-issuance with device_id omitted and an empty IN_STOCK pool, or naming a device the carrier does not hold in stock"
  - error_id: ERR_CURE_PERIOD_EXPIRED
    http_status: 409
    message: "The 15-day non-usage cure period has closed"
    triggered_by: "usage after cure_deadline_at but before the next sweep de-enrolls the benefit"
  - error_id: ERR_RECERT_WINDOW_CLOSED
    http_status: 409
    message: "The recertification response window has closed"
    triggered_by: "recertify after recert_response_deadline_at"
  - error_id: ERR_SERVICE_MONTH_NOT_CLOSED
    http_status: 409
    message: "The service month has not closed yet"
    triggered_by: "filing a claim on or before the last calendar day of its service_month"
  - error_id: ERR_PROVIDER_AUDIT_HOLD
    http_status: 409
    message: "The carrier is under audit hold"
    triggered_by: "drafting or filing a claim while any claim of that carrier sits in AUDIT_FAILED"
  - error_id: ERR_CLAIM_DUPLICATE_SERVICE_MONTH
    http_status: 409
    message: "A non-draft claim already exists for this carrier and service month"
    triggered_by: "a second draft for a service_month that is already FILED, HELD, UNDER_AUDIT, AUDIT_PASSED or AUDIT_FAILED"
  - error_id: ERR_INVALID_SAMPLE_SIZE
    http_status: 422
    message: "sample_size must be between 1 and 50"
    triggered_by: "audit-draw with sample_size 0 or above 50"
  - error_id: ERR_EMPTY_SAMPLE_POOL
    http_status: 409
    message: "The claim covered no enrollments to sample"
    triggered_by: "audit-draw on a claim whose final_filed input set was empty"
  - error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 409
    message: "The 30-day de-enrollment appeal window has closed"
    triggered_by: "filing a DE_ENROLLMENT_APPEAL after appeal_deadline_at"
  - error_id: ERR_APPEAL_NOT_APPLICABLE
    http_status: 409
    message: "The case type does not admit this operation or decision"
    triggered_by: "appealing an ACTIVE benefit, complaining about a de-enrolled one, GRANT_REINSTATE on a SERVICE_COMPLAINT, or RESOLVE_WITH_CREDIT on a DE_ENROLLMENT_APPEAL"
  - error_id: ERR_REVIEW_ROUND_LIMIT
    http_status: 409
    message: "The case has exhausted its review rounds"
    triggered_by: "a fourth assign-review on the same case"
  - error_id: ERR_PROVIDER_ENROLLMENT_CAP_EXCEEDED
    http_status: 409
    message: "The carrier is at its enrollment cap"
    triggered_by: "POST /lifeline/enrollments or accepting a port when active_enrollment_count is already at enrollment_cap"

roles:
  - role: ProgramAdministrator
    identity: opaque
    description: "USAC / program office operator. Registers carriers, adjudicates duplicate-address cohorts, runs the compliance sweep, and assigns and decides subscriber cases."
    exclusive_operations:
      - "POST /lifeline/providers"
      - "POST /lifeline/addresses/{id}/duplicate-resolution"
      - "POST /lifeline/providers/{id}/compliance-sweep"
      - "POST /lifeline/subscriber-cases/{id}/assign-review"
      - "POST /lifeline/subscriber-cases/{id}/decide"
    shared_operations:
      - "POST /lifeline/addresses"
      - "POST /lifeline/subscribers"
      - "POST /lifeline/subscribers/{id}/eligibility-checks"
      - "POST /lifeline/enrollments/{id}/usage"
      - "POST /lifeline/enrollments/{id}/de-enroll"
      - "POST /lifeline/providers/{id}/devices"
      - "POST /lifeline/devices/{id}/return"
      - "POST /lifeline/subscriber-cases"
      - "POST /lifeline/_clock/set_current_utc"
      - "every GET under /lifeline"
    notes: "not entity-backed, so ownership scoping does not apply; the segregation-of-duties rule still bars it from deciding an appeal against a de-enrollment its own X-User-ID performed"
  - role: ProviderAgent
    identity: "entity_backed:Provider"
    description: "Carrier operations staff. X-User-ID is the Provider id, and every write is scoped to rows that carrier owns."
    exclusive_operations:
      - "POST /lifeline/enrollments"
      - "POST /lifeline/enrollments/{id}/device-issuance"
      - "POST /lifeline/eligibility-checks/{id}/resubmit-documentation"
      - "POST /lifeline/service-transfers"
      - "POST /lifeline/service-transfers/{id}/accept"
      - "POST /lifeline/service-transfers/{id}/reject"
      - "POST /lifeline/reimbursement-claims"
      - "POST /lifeline/reimbursement-claims/{id}/file"
    shared_operations:
      - "POST /lifeline/addresses"
      - "POST /lifeline/subscribers"
      - "POST /lifeline/subscribers/{id}/eligibility-checks"
      - "POST /lifeline/enrollments/{id}/usage"
      - "POST /lifeline/enrollments/{id}/de-enroll"
      - "POST /lifeline/providers/{id}/devices"
      - "POST /lifeline/devices/{id}/return"
      - "POST /lifeline/subscriber-cases"
      - "POST /lifeline/_clock/set_current_utc"
      - "every GET under /lifeline"
    notes: "peer isolation: carrier A gets ERR_UNAUTHORIZED (403) on carrier B's enrollments, devices and claims even though the operation itself is permitted to the role. On POST /lifeline/service-transfers/{id}/accept and /reject the acting id must be the target_provider_id; on POST /lifeline/service-transfers it must be the source carrier."
  - role: NationalVerifier
    identity: opaque
    description: "The National Verifier interface. Its only write is the eligibility determination."
    exclusive_operations:
      - "POST /lifeline/eligibility-checks/{id}/verifier-result"
    shared_operations:
      - "every GET under /lifeline"
      - "POST /lifeline/_clock/set_current_utc"
    notes: "cannot open the check it determines, so screening always needs two identities"
  - role: ComplianceAuditor
    identity: opaque
    description: "Audit staff. Draws samples from filed claims and adjudicates findings."
    exclusive_operations:
      - "POST /lifeline/reimbursement-claims/{id}/audit-draw"
      - "POST /lifeline/audit-samples/{id}/adjudicate"
    shared_operations:
      - "every GET under /lifeline"
      - "POST /lifeline/_clock/set_current_utc"
    notes: "segregation of duties inside the role: the X-User-ID that drew a sample cannot adjudicate it, so two distinct auditor identities are always required to settle a claim"
  - role: Subscriber
    identity: "entity_backed:Subscriber"
    description: "The benefit holder. X-User-ID is the Subscriber id. Answers the recertification notice and may file complaints and appeals."
    exclusive_operations:
      - "POST /lifeline/enrollments/{id}/recertify"
    shared_operations:
      - "POST /lifeline/subscriber-cases"
      - "every GET under /lifeline"
      - "POST /lifeline/_clock/set_current_utc"
    notes: "peer isolation: a subscriber gets ERR_UNAUTHORIZED (403) recertifying or filing a case against another subscriber's enrollment. Only the subscriber can recertify, so the annual cycle cannot be closed by carrier staff."
