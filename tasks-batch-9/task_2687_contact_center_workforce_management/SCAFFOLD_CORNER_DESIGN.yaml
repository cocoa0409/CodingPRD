          assert:
            - "scoring == \"SCORING\""
            - "the trigger answers 422 with err == \"ERR_PREFERENCE_FLOOR_NOT_MET\""
            - "the run WOULD have placed both bidders (A1 -> T-1 at index 0, A2 -> T-2 at index 1), so first_choice 1 / count 2 = 0.5000 < 0.75"
            - "r_status == \"SCORING\", r_rate is null and r_awarded == 0"
            - "b1_status == \"SUBMITTED\" and b2_status == \"SUBMITTED\""
            - "t1_awarded == 0 and GET /schedule-shifts filtered to planning_cycle_id ${cyc_id} returns total_count 0"

      - name: routing_outflow_above_staffing_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=185]
          - state_machines.IntradayAction.OFFERED_to_ACCEPTED_system
          - errors.ERR_ROUTING_OUTFLOW_EXCEEDS_STAFFING
        distinguishing_aspect: |
          A ROUTING_ADJUSTMENT is auto-accepted inside its own creation request, so its outflow
          feasibility must be checked at CREATE time, not at response time. Shifting a single agent
          out of an interval whose effective_scheduled_agents is 0 answers
          ERR_ROUTING_OUTFLOW_EXCEEDS_STAFFING (422) and no IntradayAction row is created at all,
          leaving routing_inflow_agents 0 on the target interval. An implementation that creates
          the row in OFFERED and validates on response leaves a phantom action behind.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; OPEN cycle W37-ROUTE with FG-A (VOICE_EN) and FG-P (CHAT_EN)."
            - "Both 2026-09-07 grids generated; no ScheduleShift published anywhere, so every interval has effective_scheduled_agents 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: IntradayController
            - call: "POST /planning-cycles"
              payload: { name: "W37-ROUTE", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13", interval_minutes: 30, requirement_basis: "MAX_OF_BOTH", ot_budget_cents: 1000000, intraday_alert_short_threshold: 99 }
              as: CapacityPlanner
              captures: { cyc_id: "$.data.id" }
            - call: "POST /forecast-groups"
