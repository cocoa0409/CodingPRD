              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err1: $.data.error_id }
            - call: "POST /_ops/daily-license-sweep"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { err2: $.data.error_id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-70001", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err3: $.data.error_id }
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Admin attempting a business approval." }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err4: $.data.error_id }
            - call: "POST /compensation-plans"
              payload: { plan_name: "Analyst Plan", base_basis_points: 90, min_fee_cents: 0, max_fee_cents: 4000000 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { err5: $.data.error_id }
            - call: "GET /license-registrations"
              payload: { originator_id: "${orig_id}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { lic_total: $.total_count }
            - call: "GET /compensation-plans"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_total: $.total_count, plan_st: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { c1: $.data.current_utc }
            - call: "POST /_ops/daily-license-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { swept: $.data.swept_at, exp: $.data.expired_license_ids }
          assert:
            - "${c0} == 2026-08-01T00:00:00Z"
            - "HTTP status is 403 on the officer's clock call, ${err1} == ERR_ROLE_NOT_PERMITTED"
            - "HTTP status is 403 on the analyst's sweep, ${err2} == ERR_ROLE_NOT_PERMITTED"
            - "HTTP status is 403 on the admin's licence creation, ${err3} == ERR_ROLE_NOT_PERMITTED"
            - "HTTP status is 403 on the admin's plan approval and ${err4} == ERR_ROLE_NOT_PERMITTED,
               NOT 422 ERR_PLAN_WEIGHTS_NOT_100 - the role gate is evaluated first"
            - "HTTP status is 403 on the analyst drafting a plan, ${err5} == ERR_ROLE_NOT_PERMITTED"
            - "${lic_total} == 0 and ${plan_total} == 1 with ${plan_st} == DRAFT"
            - "HTTP status is 200 for PlatformAdmin, ${c1} == 2026-08-02T00:00:00Z (the rejected
               officer call never moved the clock off 2026-08-01)"
            - "${swept} == 2026-08-02T00:00:00Z and ${exp} == []"

  # ------------------------------------------------------------------------------
  # 8. Cross-cutting complexity layers (guide Table: Cross-Cutting Complexity Layers)
  # ------------------------------------------------------------------------------
  # complexity_profile.complexity_layers declares five layers: optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation, rate_threshold_triggers and
  # ops_run_checkpoint. The guide table has no row for ops_run_checkpoint, so no claim
  # is minted from it here; the sweep's checkpoint semantics (idempotent re-run at the
  # same instant, empty arrays, no double application) are asserted by the endpoints
  # instance daily_license_sweep_reports_empty_arrays_and_does_not_double_apply.
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_originator_version_on_plan_assignment_returns_412_and_fresh_read_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers
          - concurrency_rules.plan-assignment-stale-originator
          - errors[ERR_STALE_ORIGINATOR_VERSION]
        distinguishing_aspect: |
          The full OCC triple for the second concurrency rule, driven by REAL version drift rather
          than an invented number: the client reads the originator at version V, two employment
          PATCHes then move it to V+2, and replaying the assignment with V is 412
          ERR_STALE_ORIGINATOR_VERSION. Re-reading and replaying the identical body with V+2
          succeeds, and version increments on every write - each PATCH by one, and the accepted
          assignment by one more, so the final version is V+3.
        test_recipe:
          setup:
            - "Originator 2200001 and one ACTIVE 105 bps CompensationPlan (one permissible
               variable at weight 100, approved by officer-1). No licence is needed: the
               assignment is a compensation-side write."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id, v_create: $.data.version }
            - call: "POST /compensation-plans"
              payload: { plan_name: "Retail Base 2026", base_basis_points: 105, min_fee_cents: 0, max_fee_cents: 5000000, volume_tier_enabled: false, concession_absorption_enabled: false }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "LOAN_VOLUME_UNITS", weight_pct: 100, justification_text: "Closed unit volume is a permissible compensation variable and is not a term of the transaction." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Reg Z review complete." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v_read: $.data.version }
          trigger:
            - call: "PATCH /originators/${orig_id}"
              payload: { employment_status: "SUSPENDED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { v_p1: $.data.version, es1: $.data.employment_status }
            - call: "PATCH /originators/${orig_id}"
              payload: { employment_status: "EMPLOYED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { v_p2: $.data.version, es2: $.data.employment_status }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${plan_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_originator_version: "${v_read}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v_mid: $.data.version, mid_plan: $.data.compensation_plan_id }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${plan_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_originator_version: "${v_mid}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v_ok: $.data.version, ok_plan: $.data.compensation_plan_id }
            - call: "GET /compensation-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { p_st: $.data.status, p_assigned: $.data.assigned_originator_id }
          assert:
            - "${v_read} == ${v_create} (the read did not bump the version)"
            - "${es1} == SUSPENDED and ${v_p1} == ${v_create} + 1"
            - "${es2} == EMPLOYED and ${v_p2} == ${v_create} + 2"
            - "HTTP status is 412 on the assignment carrying the pre-PATCH version"
            - "${err} == ERR_STALE_ORIGINATOR_VERSION"
            - "${v_mid} == ${v_create} + 2 and ${mid_plan} == null (the 412 wrote nothing, not
               even a version bump)"
            - "HTTP status is 200 on the replay with ${v_mid}"
            - "${ok_plan} == ${plan_id} and ${v_ok} == ${v_create} + 3"
            - "${p_st} == ACTIVE and ${p_assigned} == ${orig_id}"

      - name: occ_on_sponsorship_create_uses_the_license_version
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers
          - concurrency_rules.sponsorship-create-stale-license
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_license_version_outranks_sponsorship_period_overlap
          rationale: "The named §1.8 instance is the OCC test for the first concurrency rule: it sends expected_license_registration_version one behind current on POST /license-registrations/{id}/sponsorship-transfers, gets 412, and then succeeds with the current version."

      - name: cascading_side_effects_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.LicenseRegistration.ACTIVE_to_EXPIRED
        excluded_because:
          difficulty_instance: transitive_cascade / license_expiry_sweep_five_hop_authority_lapse_cascade
          rationale: "The named §1.8 instance walks all five hops of the licence-lapse chain end to end and pins the hop ordering; the payoff chain is covered by transitive_cascade / early_payoff_five_hop_clawback_and_monitoring_cascade."

      - name: dual_variant_results_and_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.originator_compensation_accrual.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / comp_accrual_provisional_locked_vs_final_funded_divergence
          rationale: "The named §1.8 instance computes both the PROVISIONAL and FINAL variants on the same loan and asserts the delta on the switch; the CE attribution variants are covered by dual_variant_calc / ce_attribution_variant_flips_ce_satisfied."

      - name: cumulative_threshold_tested_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.originator_exposure_score
        excluded_because:
          difficulty_instance: boundary_precision_check / exposure_score_exactly_sixty_flips_monitoring_elevated
          rationale: "The named §1.8 instance pins the exposure threshold at exactly 60 (ELEVATED) versus 59 (STANDARD), including the single final rounding of the assembled weighted sum."

  # ------------------------------------------------------------------------------
  # 9. Consistency model (guide Table: Consistency Model)
  # ------------------------------------------------------------------------------
  # complexity_profile.consistency_model = immediate: all changes are visible in the same
  # request's response, so no re-read is ever required to observe a write's effects.
  - section: consistency_model
    instances:
      - name: close_response_already_carries_the_accrued_status_and_the_ledger_line
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.LoanApplication.LOCKED_to_FUNDED
          - calculations.originator_compensation_accrual
        distinguishing_aspect: |
          consistency_model = immediate means the close RESPONSE itself must already show
          compensation_status ACCRUED and the derived money, not merely a subsequent GET. The
          response body is compared field-for-field with a follow-up read and the two must agree
          exactly, and the CompensationRecord created by the close is already listable in the very
          next request with no settling delay.
        test_recipe:
          setup:
            - "Originator 2200001 with an ACTIVE sponsored CA licence and an ACTIVE 105 bps plan
               assigned, plus one CA loan LOCKED at 5000000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
