scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: maintenance_due_dual_variant
        grounds:
          - calculations.maintenance_next_due
          - calculations.asset_condition_score
          - entities.Asset.fields.next_due_date
        distinguishing_aspect: |
          Two sanctioned variants of the same due-date rule on the Asset domain produce different dates for
          identical data: interval_baseline ignores condition (2027-01-15) while condition_adjusted halves the
          12-month interval because score 45.67 < escalation threshold 60 (2026-07-15).
        test_recipe:
          setup:
            - "POWER_TRANSFORMER policy: interval 12mo, escalation 60, critical 40, oil warn/critical 20/35, ir_min 1000, weights 0.4/0.35/0.25"
            - "Asset with last_maintenance_completed_at 2026-01-15; one ACCEPTED FAIL insulation test (400 Mohm @40C) and one ACCEPTED MARGINAL oil test (25 ppm)"
            - "logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub Alpha", code: "SUB-A", region: "North" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", criticality: "HIGH", nameplate_mva: 20, voltage_kv: 115, install_date: "2020-05-01T00:00:00Z", last_maintenance_completed_at: "2026-01-15T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech One", employee_code: "EMP-1" }
              as: OperationsManager
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/certifications"
              payload: { cert_type: "NETA_LEVEL_2", issued_at: "2025-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /test-events"
              payload: { asset_id: "${asset_id}", test_type: "INSULATION_RESISTANCE", value_primary: 400, ambient_temp_c: 40, measured_at: "2026-07-01T10:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { te1_id: $.data.id }
            - call: "POST /test-events/${te1_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /test-events/${te1_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
            - call: "POST /test-events"
              payload: { asset_id: "${asset_id}", test_type: "OIL_MOISTURE", value_primary: 25, measured_at: "2026-07-02T10:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { te2_id: $.data.id }
            - call: "POST /test-events/${te2_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /test-events/${te2_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /assets/${asset_id}/forecast"
              payload: {}
              as: OperationsManager
              captures: { f_score: $.data.condition_score, f_base: $.data.next_due_interval_baseline, f_adj: $.data.next_due_condition_adjusted }
          assert:
            - "forecast.condition_score == 45.67  (base (0.4*30 + 0.35*70)/0.75 = 48.67 minus C2 penalty 2 minus C3 penalty 1)"
            - "forecast.next_due_interval_baseline == '2027-01-15'  (2026-01-15 + 12 months)"
            - "forecast.next_due_condition_adjusted == '2026-07-15'  (score 45.67 < 60 halves the interval to 6 months)"
            - "forecast.next_due_interval_baseline != forecast.next_due_condition_adjusted (variants diverge on identical data)"
      - name: containment_dual_variant
        grounds:
          - calculations.containment_requirement
          - entities.EnvironmentalInspection.fields.compliance
        distinguishing_aspect: |
          A different entity domain than maintenance_due_dual_variant (EnvironmentalInspection vs Asset): identical
          measurements yield required 1100.00 gal / DEFICIENT under SPCC_SIMPLE but 1040.00 gal / COMPLIANT under
          SPCC_WITH_FREEBOARD.
        test_recipe:
          setup:
            - "One substation; two inspections with identical measurements (largest vessel 1000 gal, capacity 1050 gal, freeboard 40 gal) but different method"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub Beta", code: "SUB-B", region: "South" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /substations/${sub_id}/environmental-inspections"
              payload: { inspection_date: "2026-07-15T00:00:00Z", largest_vessel_gal: 1000, containment_capacity_gal: 1050, rainfall_freeboard_gal: 40, method: "SPCC_SIMPLE" }
              as: ComplianceOfficer
              captures: { insp1_id: $.data.id }
            - call: "POST /substations/${sub_id}/environmental-inspections"
              payload: { inspection_date: "2026-07-15T00:00:00Z", largest_vessel_gal: 1000, containment_capacity_gal: 1050, rainfall_freeboard_gal: 40, method: "SPCC_WITH_FREEBOARD" }
              as: ComplianceOfficer
              captures: { insp2_id: $.data.id }
          trigger:
            - call: "POST /environmental-inspections/${insp1_id}/complete"
              payload: {}
              as: ComplianceOfficer
              captures: { req1: $.data.required_capacity_gal, comp1: $.data.compliance, due1: $.data.next_inspection_due }
            - call: "POST /environmental-inspections/${insp2_id}/complete"
              payload: {}
              as: ComplianceOfficer
              captures: { req2: $.data.required_capacity_gal, comp2: $.data.compliance, due2: $.data.next_inspection_due }
          assert:
            - "inspection1.required_capacity_gal == 1100.00 (1.10 * 1000) and compliance == DEFICIENT (1050 < 1100)"
            - "inspection2.required_capacity_gal == 1040.00 (1.00 * 1000 + 40) and compliance == COMPLIANT (1050 >= 1040)"
            - "inspection1.next_inspection_due == '2027-01-15' (DEFICIENT -> +6 months) while inspection2.next_inspection_due == '2027-07-15' (COMPLIANT -> +12 months)"

  - rule_id: combinatorial_formula
    instances:
      - name: spare_selector_scoring_mode_a
        grounds:
          - calculations.spare_selection_score
          - entities.SpareReservation.fields.spare_unit_id
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula (nested min on MVA adequacy, max-clamped impedance proximity,
          conditional location bonus) ranks three eligible units 118.75 / 135.00 / 135.00 and the tie is broken by
          created_at ASC, so the earlier-created of the two 135.00 units wins.
        test_recipe:
          setup:
            - "Three AVAILABLE SPARE_TRANSFORMER units at voltage class 115: U1 (25 MVA, impedance 7.0, Yard-B), U2 (20 MVA, 6.0, Yard-A), U3 (40 MVA, 6.0, Yard-A); U2 created before U3"
          setup_api_calls:
            - call: "POST /spare-units"
              payload: { unit_type: "SPARE_TRANSFORMER", rating_mva: 25, voltage_class_kv: 115, impedance_pct: 7.0, home_location: "Yard-B" }
              as: OperationsManager
              captures: { unit1_id: $.data.id }
            - call: "POST /spare-units"
              payload: { unit_type: "SPARE_TRANSFORMER", rating_mva: 20, voltage_class_kv: 115, impedance_pct: 6.0, home_location: "Yard-A" }
              as: OperationsManager
              captures: { unit2_id: $.data.id }
            - call: "POST /spare-units"
              payload: { unit_type: "SPARE_TRANSFORMER", rating_mva: 40, voltage_class_kv: 115, impedance_pct: 6.0, home_location: "Yard-A" }
              as: OperationsManager
              captures: { unit3_id: $.data.id }
          trigger:
            - call: "POST /spare-reservations"
              payload: { unit_type: "SPARE_TRANSFORMER", required_mva: 20, required_voltage_kv: 115, preferred_impedance_pct: 6.0, site_location: "Yard-A", start_ts: "2026-09-10T10:00:00Z", end_ts: "2026-09-10T14:00:00Z" }
              as: OutageCoordinator
              captures: { res_unit: $.data.spare_unit_id, res_id: $.data.id }
          assert:
            - "reservation.spare_unit_id == ${unit2_id} (scores: U1 = 100*min(1,1.25) + 25*max(0,1-1/4) + 0 = 118.75; U2 = 100*1 + 25*1 + 10 = 135.00; U3 = 100*1 + 25*1 + 10 = 135.00; tie U2 vs U3 broken by created_at ASC -> U2)"
            - "reservation.spare_unit_id != ${unit3_id} despite equal score (tie-break, not adequacy, decides)"
            - "SpareUnit.${unit2_id}.status == RESERVED after selection"
      - name: workorder_cost_rounding_mode_b
        grounds:
          - calculations.work_order_cost_rollup
          - entities.WorkOrder.fields.total_cost
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned per-line-then-sum — lines 333.325->333.33, 88.885->88.89, 59.97
          give subtotal 482.19 and total 506.30; the forbidden sum-then-round order would give subtotal 482.18 and
          total 506.29.
        test_recipe:
          setup:
            - "POWER_TRANSFORMER asset; OPEN C2 defect; work order (estimated 4h) scheduled into an APPROVED 8h window; clock advanced into the window; switching begun; work started by the assignee"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub C", code: "SUB-C", region: "East" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", criticality: "MEDIUM", nameplate_mva: 20, voltage_kv: 115, install_date: "2019-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech Two", employee_code: "EMP-2" }
              as: OperationsManager
              captures: { tech_id: $.data.id }
            - call: "POST /defects"
              payload: { asset_id: "${asset_id}", title: "Bushing crack", description: "Visible crack on HV bushing", severity: "C2" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { defect_id: $.data.id }
            - call: "POST /work-orders"
              payload: { defect_id: "${defect_id}", assigned_technician_id: "${tech_id}", title: "Replace bushing", estimated_hours: 4 }
              as: OperationsManager
              captures: { wo_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-08-10T08:00:00Z", end_ts: "2026-08-10T16:00:00Z", purpose: "Bushing replacement" }
              as: OutageCoordinator
              as_user_id: "coord-1"
              captures: { ow_id: $.data.id }
            - call: "POST /outage-windows/${ow_id}/switching-steps"
              payload: { sequence_no: 1, description: "Open HV disconnect" }
              as: OutageCoordinator
            - call: "POST /outage-windows/${ow_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-mgr-1"
              captures: { ow_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { outage_window_id: "${ow_id}", expected_outage_window_version: "${ow_v}" }
              as: OutageCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: OperationsManager
            - call: "POST /outage-windows/${ow_id}/begin-switching"
              payload: {}
              as: SwitchingSupervisor
              as_user_id: "sup-1"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { labor_lines: [ { hours: 2.5, rate_per_hour: 133.33 }, { hours: 1.0, rate_per_hour: 88.885 } ], parts_lines: [ { quantity: 3, unit_price: 19.99 } ] }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_sub: $.data.cost_subtotal, wo_fee: $.data.mobilization_fee, wo_total: $.data.total_cost }
          assert:
            - "work_order.cost_subtotal == 482.19 (round per line: 333.33 + 88.89 + 59.97)"
            - "work_order.mobilization_fee == 24.11 (subtotal 482.19 < 500 -> 5% -> 24.1095 -> 24.11)"
            - "work_order.total_cost == 506.30 (NOT 506.29, which the sum-then-round order would produce)"
      - name: workorder_fee_tier_evaluation_order_mode_c
        grounds:
          - calculations.work_order_cost_rollup
        distinguishing_aspect: |
          Mode (c): the fee tier is keyed on the SUBTOTAL with pinned evaluation order subtotal -> tier -> fee ->
          total; at a subtotal of exactly 500.00 the >= threshold selects the 4% tier giving fee 20.00 / total
          520.00, whereas keying the tier on the grand total (the circular reading) is ill-defined and the 5%
          reading would give 525.00.
        test_recipe:
          setup:
            - "Same asset/defect/work-order/window chain as workorder_cost_rounding_mode_b, work started"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub C2", code: "SUB-C2", region: "East" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", criticality: "MEDIUM", nameplate_mva: 20, voltage_kv: 115, install_date: "2019-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech Three", employee_code: "EMP-3" }
              as: OperationsManager
              captures: { tech_id: $.data.id }
            - call: "POST /defects"
              payload: { asset_id: "${asset_id}", title: "Oil leak", description: "Weeping gasket", severity: "C2" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { defect_id: $.data.id }
            - call: "POST /work-orders"
              payload: { defect_id: "${defect_id}", assigned_technician_id: "${tech_id}", title: "Replace gasket", estimated_hours: 4 }
              as: OperationsManager
              captures: { wo_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-08-11T08:00:00Z", end_ts: "2026-08-11T16:00:00Z", purpose: "Gasket replacement" }
              as: OutageCoordinator
              as_user_id: "coord-1"
              captures: { ow_id: $.data.id }
            - call: "POST /outage-windows/${ow_id}/switching-steps"
              payload: { sequence_no: 1, description: "Open HV disconnect" }
              as: OutageCoordinator
            - call: "POST /outage-windows/${ow_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-mgr-1"
              captures: { ow_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { outage_window_id: "${ow_id}", expected_outage_window_version: "${ow_v}" }
              as: OutageCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: OperationsManager
            - call: "POST /outage-windows/${ow_id}/begin-switching"
              payload: {}
              as: SwitchingSupervisor
              as_user_id: "sup-1"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { labor_lines: [ { hours: 10.0, rate_per_hour: 44.00 } ], parts_lines: [ { quantity: 2, unit_price: 30.00 } ] }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_sub: $.data.cost_subtotal, wo_fee: $.data.mobilization_fee, wo_total: $.data.total_cost }
          assert:
            - "work_order.cost_subtotal == 500.00 exactly"
            - "work_order.mobilization_fee == 20.00 (tier keyed on subtotal: 500.00 >= 500.00 -> 4%)"
            - "work_order.total_cost == 520.00 (NOT 525.00, the 5% reading)"

  - rule_id: non_linear_state_machine
    instances:
      - name: relay_setting_revision_cycle
        grounds:
          - state_machines.RelaySetting.REJECTED_to_SUBMITTED
          - state_machines.RelaySetting.VERIFIED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on RelaySetting: SUBMITTED -> REJECTED -> SUBMITTED revision loop is legal, and the
          resubmitted setting can proceed to VERIFIED and ACTIVE — a linear pipeline would deadlock at REJECTED.
        test_recipe:
          setup:
            - "RELAY-class asset with RELAY policy; author TechA (no L4), verifier TechB with ACTIVE NETA_LEVEL_4"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub R", code: "SUB-R", region: "West" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "RELAY", interval_months: 6, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 100, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.3, w_oil: 0.1, w_relay: 0.6 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "RELAY", criticality: "HIGH", voltage_kv: 115, install_date: "2021-03-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Author A", employee_code: "EMP-A" }
              as: OperationsManager
              captures: { tech_a: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Verifier B", employee_code: "EMP-B" }
              as: OperationsManager
              captures: { tech_b: $.data.id }
            - call: "POST /technicians/${tech_b}/certifications"
              payload: { cert_type: "NETA_LEVEL_4", issued_at: "2025-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /relay-settings"
              payload: { asset_id: "${asset_id}", setting_group: "G1", pickup_a: 80, time_dial: 2.5, curve: "IEC_SI" }
              as: Technician
              as_user_id: "${tech_a}"
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /relay-settings/${rs_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_a}"
              captures: { st_submitted: $.data.status }
            - call: "POST /relay-settings/${rs_id}/reject"
              payload: { rejection_note: "Curve mismatch with coordination study" }
              as: Technician
              as_user_id: "${tech_b}"
              captures: { st_rejected: $.data.status }
            - call: "POST /relay-settings/${rs_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_a}"
              captures: { st_resubmitted: $.data.status }
            - call: "POST /relay-settings/${rs_id}/verify"
              payload: {}
              as: Technician
              as_user_id: "${tech_b}"
              captures: { st_verified: $.data.status }
            - call: "GET /assets/${asset_id}"
              payload: {}
              as: OperationsManager
              captures: { asset_v: $.data.version }
            - call: "POST /relay-settings/${rs_id}/activate"
              payload: { expected_asset_version: "${asset_v}" }
              as: Technician
              as_user_id: "${tech_b}"
              captures: { st_active: $.data.status }
          assert:
            - "status after first submit == SUBMITTED, after reject == REJECTED, after resubmit == SUBMITTED (cycle completed)"
            - "status after verify == VERIFIED and after activate == ACTIVE"
            - "RelaySetting.${rs_id}.verified_by_technician_id == ${tech_b}"
      - name: defect_deferral_cycle
        grounds:
          - state_machines.Defect.OPEN_to_DEFERRED
          - state_machines.Defect.DEFERRED_to_OPEN
        distinguishing_aspect: |
          Cyclic machine on a different entity (Defect, not RelaySetting): OPEN -> DEFERRED -> OPEN via clock-driven
          auto-reopen, then a second deferral is legal (count 1 -> 2), and the loop terminates only at the cap of 2.
        test_recipe:
          setup:
            - "Asset with manual C3 defect; clock starts at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub D", code: "SUB-D", region: "North" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "CIRCUIT_BREAKER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 500, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.5, w_oil: 0.2, w_relay: 0.3 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "CIRCUIT_BREAKER", criticality: "LOW", voltage_kv: 34.5, install_date: "2018-06-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech D", employee_code: "EMP-D" }
              as: OperationsManager
              captures: { tech_id: $.data.id }
            - call: "POST /defects"
              payload: { asset_id: "${asset_id}", title: "Minor paint peeling", description: "Cosmetic", severity: "C3" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { defect_id: $.data.id, d_count0: $.data.deferral_count }
          trigger:
            - call: "POST /defects/${defect_id}/defer"
              payload: { deferred_until: "2026-09-01T00:00:00Z" }
              as: OperationsManager
              captures: { st_def1: $.data.status, d_count1: $.data.deferral_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: OperationsManager
            - call: "GET /defects/${defect_id}"
              payload: {}
              as: OperationsManager
              captures: { st_reopen: $.data.status, d_until: $.data.deferred_until }
            - call: "POST /defects/${defect_id}/defer"
              payload: { deferred_until: "2026-10-01T00:00:00Z" }
              as: OperationsManager
              captures: { st_def2: $.data.status, d_count2: $.data.deferral_count }
          assert:
            - "after first defer: status == DEFERRED and deferral_count == 1"
            - "after clock advance past deferred_until: status == OPEN and deferred_until == null (auto-reopen)"
            - "second defer succeeds: status == DEFERRED and deferral_count == 2 (cap reached but not exceeded)"

  - rule_id: transitive_cascade
    instances:
      - name: test_accept_cascade_depth3
        grounds:
          - state_machines.TestEvent.SUBMITTED_to_ACCEPTED
          - calculations.asset_condition_score
          - entities.OutageWindow.fields.needs_revalidation
        distinguishing_aspect: |
          Depth-3 chain from trigger review-ACCEPT: TestEvent acceptance auto-creates a Defect (hop 1), defect
          creation re-runs asset_condition_score with the new penalty (hop 2), and the score dropping below the
          escalation threshold flips needs_revalidation on the asset's REQUESTED outage window and recomputes
          next_due_date (hop 3).
        test_recipe:
          setup:
            - "POWER_TRANSFORMER asset, last maintenance 2026-01-15; a future REQUESTED outage window; one FAIL insulation test (400 Mohm @40C) submitted"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub E", code: "SUB-E", region: "South" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", criticality: "HIGH", nameplate_mva: 20, voltage_kv: 115, install_date: "2020-05-01T00:00:00Z", last_maintenance_completed_at: "2026-01-15T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-09-05T08:00:00Z", end_ts: "2026-09-05T16:00:00Z", purpose: "Planned maintenance" }
              as: OutageCoordinator
              as_user_id: "coord-1"
              captures: { ow_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech E", employee_code: "EMP-E" }
              as: OperationsManager
              captures: { tech_id: $.data.id }
            - call: "POST /technicians/${tech_id}/certifications"
              payload: { cert_type: "NETA_LEVEL_2", issued_at: "2025-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /test-events"
              payload: { asset_id: "${asset_id}", test_type: "INSULATION_RESISTANCE", value_primary: 400, ambient_temp_c: 40, measured_at: "2026-07-20T10:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { te_id: $.data.id }
            - call: "POST /test-events/${te_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /test-events/${te_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
            - call: "GET /defects"
              payload: {}
              as: OperationsManager
            - call: "GET /assets/${asset_id}"
              payload: {}
              as: OperationsManager
              captures: { a_score: $.data.condition_score, a_due: $.data.next_due_date }
            - call: "GET /outage-windows/${ow_id}"
              payload: {}
              as: OperationsManager
              captures: { ow_reval: $.data.needs_revalidation }
          assert:
            - "exactly one Defect exists with asset_id == ${asset_id}, test_event_id == ${te_id}, severity == C2, status == OPEN (hop 1)"
            - "Asset.condition_score == 28.00 (base 0.4*30/0.4 = 30.00 minus C2 penalty 2) (hop 2)"
            - "Asset.next_due_date == '2026-04-15' (score 28.00 < critical 40 quarters the 12-month interval to 3 months)"
            - "OutageWindow.${ow_id}.needs_revalidation == true (hop 3; flag derived from the recomputed score)"
      - name: workorder_verify_cascade_depth2
        grounds:
          - state_machines.WorkOrder.COMPLETED_to_VERIFIED
          - state_machines.Defect.RESOLVED_to_VERIFIED
          - entities.Asset.fields.last_maintenance_completed_at
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (work-order verify, not test review): verify moves the linked
          Defect RESOLVED -> VERIFIED (hop 1), and that defect transition refreshes
          Asset.last_maintenance_completed_at to the clock and recomputes next_due_date (hop 2).
        test_recipe:
          setup:
            - "Work order completed during an in-window switching outage; clock at 2026-08-12T10:00:00Z"
          setup_api_calls:
            - call: "POST /substations"
