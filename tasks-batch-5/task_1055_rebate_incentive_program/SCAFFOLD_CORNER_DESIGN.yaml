scaffold_corner_design:

  - section: entities
    instances:
      - name: create_program_returns_201_with_computed_budget_position
        claim_type: creation
        grounds:
          - "entities.Program"
          - "endpoints[POST /api/programs]"
        distinguishing_aspect: "A newly created Program is DRAFT with committed_cents 0, reserve_cents 0, available_cents equal to budget_total_cents and utilization_pct 0.0."
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-07-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "Seed Program", budget_total_cents: 500000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /api/programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
          assert:
            - "HTTP status == 200"
            - "Program.${prog_id}.status == DRAFT"
            - "Program.${prog_id}.budget_total_cents == 500000"
            - "Program.${prog_id}.committed_cents == 0"
            - "Program.${prog_id}.reserve_cents == 0"
            - "Program.${prog_id}.available_cents == 500000"
            - "Program.${prog_id}.utilization_pct == 0.0"
            - "Program.${prog_id}.version == 1"

      - name: get_program_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_PROGRAM_NOT_FOUND]"
          - "validations[priority=10]"
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /api/programs/{id} returns ERR_PROGRAM_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "One unrelated program exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "Anchor Program", budget_total_cents: 500000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /api/programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_PROGRAM_NOT_FOUND"

      - name: create_program_missing_required_field_is_rejected
        claim_type: required_fields
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting budget_total_cents on POST /api/programs returns ERR_VALIDATION with HTTP 400 and creates no row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /api/programs"
              payload: { name: "Incomplete Program", fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_VALIDATION"
            - "GET /api/programs returns total_count == 0"

      - name: offer_dealer_tier_enabled_defaults_to_true_when_omitted
        claim_type: defaults
        grounds:
          - "entities.Offer.fields.dealer_tier_enabled"
          - "endpoints[POST /api/offers]"
        distinguishing_aspect: "Creating an Offer without dealer_tier_enabled stores true, and the offer is minted in DRAFT with active_claim_count 0 and closed_at null."
        test_recipe:
          setup:
            - "An ACTIVE program."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "Default Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Default Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Offer.${offer_id}.dealer_tier_enabled == true"
            - "Offer.${offer_id}.status == DRAFT"
            - "Offer.${offer_id}.active_claim_count == 0"
            - "Offer.${offer_id}.closed_at == null"

      - name: receipt_units_and_gross_amount_are_computed_from_lines
        claim_type: computed_fields
        grounds:
          - "entities.Receipt.fields.units"
          - "entities.Receipt.fields.gross_amount_cents"
          - "entities.Receipt.fields.line_count"
        distinguishing_aspect: "A two-line receipt (3 x 1000 and 2 x 2500) reports line_count 2, units 5 and gross_amount_cents 8000, and is created unvalidated."
        test_recipe:
          setup:
            - "ACTIVE program with a PUBLISHED DEALER offer and a DRAFT claim."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "Computed Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Computed Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Computed Dealer", email: "cp@cp.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_id}" }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /api/claims/${claim_id}/receipts"
              payload: { serial_number: "SN-CMP-1", purchase_date: "2026-06-20T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 3, unit_price_cents: 1000 }, { sku: "TOOLS-B", quantity: 2, unit_price_cents: 2500 } ] }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { r_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Receipt.${r_id}.line_count == 2"
            - "Receipt.${r_id}.units == 5"
            - "Receipt.${r_id}.gross_amount_cents == 8000"
            - "Receipt.${r_id}.validated == false"
            - "Receipt.${r_id}.validated_at == null"

      - name: claimant_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - "entities.Claimant.fields.status"
          - "entities.Claimant.fields.fraud_score"
        distinguishing_aspect: "POST /api/claimants always mints status ACTIVE, fraud_score 0, all three counters 0 and version 1, none of which are client inputs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /api/claimants"
              payload: { type: "CONSUMER", legal_name: "System Fields Consumer", email: "sf@sf.example", mailing_state: "NY" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Claimant.${clmt_id}.status == ACTIVE"
            - "Claimant.${clmt_id}.fraud_score == 0"
            - "Claimant.${clmt_id}.denied_claim_count == 0"
            - "Claimant.${clmt_id}.open_claim_count == 0"
            - "Claimant.${clmt_id}.duplicate_attempt_count == 0"
            - "Claimant.${clmt_id}.version == 1"

      - name: create_claimant_with_invalid_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Claimant.fields.type"
          - "validations[priority=12]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "A Claimant type outside {DEALER, CONSUMER} returns ERR_VALIDATION with HTTP 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /api/claimants"
              payload: { type: "DISTRIBUTOR", legal_name: "Bad Type", email: "bt@bt.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_offer_with_end_not_after_start_is_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Offer.fields.effective_end_date"
          - "validations[priority=12]"
        distinguishing_aspect: "effective_end_date equal to effective_start_date returns ERR_VALIDATION with HTTP 400, so a zero-length offer window can never exist."
        test_recipe:
          setup:
            - "An ACTIVE program."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "Window Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Inverted Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-09-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_offer_against_unknown_program_is_not_found
        claim_type: parent_relationships
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_PROGRAM_NOT_FOUND]"
          - "entities.Offer.fields.program_id"
        distinguishing_aspect: "A body-level FK that does not resolve returns ERR_PROGRAM_NOT_FOUND (404), not ERR_VALIDATION (400)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /api/offers"
              payload: { program_id: "00000000-0000-4000-8000-000000000001", name: "Orphan Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_PROGRAM_NOT_FOUND"

      - name: list_programs_paginates_with_limit_and_offset
        claim_type: listing
        grounds:
          - "endpoints[GET /api/programs]"
        distinguishing_aspect: "With three programs, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true; limit 2 offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Three DRAFT programs."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "Page A", budget_total_cents: 100000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { p_a: $.data.id }
            - call: "POST /api/programs"
              payload: { name: "Page B", budget_total_cents: 100000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { p_b: $.data.id }
            - call: "POST /api/programs"
              payload: { name: "Page C", budget_total_cents: 100000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { p_c: $.data.id }
          trigger:
            - call: "GET /api/programs"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "GET /api/programs"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
          assert:
            - "the first response reports total_count == 3, limit == 2, offset == 0, has_more == true and carries exactly 2 data elements"
            - "the second response reports total_count == 3, offset == 2, has_more == false and carries exactly 1 data element"

      - name: fk_reverse_lookups_list_children_by_parent_id
        claim_type: retrieval
        grounds:
          - "endpoints[GET /api/offers]"
          - "endpoints[GET /api/claims]"
          - "entities.Offer.fields.program_id"
          - "entities.Claim.fields.claimant_id"
        distinguishing_aspect: "GET /api/offers filtered by program_id returns exactly the 2 offers of that program and GET /api/claims filtered by claimant_id returns exactly the 1 claim of that claimant."
        test_recipe:
          setup:
            - "One ACTIVE program with two offers on different sku_scope values and one claimant with a single DRAFT claim."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "Reverse Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Reverse Tools", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_a: $.data.id }
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Reverse Paint", channel: "DEALER", sku_scope: "PAINT", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_b: $.data.id }
            - call: "POST /api/offers/${offer_a}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Reverse Dealer", email: "rv@rv.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_a}", claimant_id: "${clmt_id}" }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "GET /api/offers"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "GET /api/claims"
              payload: { claimant_id: "${clmt_id}" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
          assert:
            - "the offers response reports total_count == 2 and contains both ${offer_a} and ${offer_b}"
            - "the claims response reports total_count == 1 and its single element id == ${claim_id}"

  - section: state_machines
    instances:
      - name: publish_offer_while_program_is_draft_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Offer.DRAFT_to_PUBLISHED"
          - "errors[ERR_PROGRAM_NOT_ACTIVE]"
        distinguishing_aspect: "Publishing an offer whose Program is still DRAFT returns ERR_PROGRAM_NOT_ACTIVE (409) and leaves the offer in DRAFT."
        test_recipe:
          setup:
            - "A DRAFT program with one DRAFT offer."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "Unactivated Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Early Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_PROGRAM_NOT_ACTIVE"
            - "Offer.${offer_id}.status == DRAFT"

      - name: create_claim_against_draft_offer_is_rejected
        claim_type: invalid_transition
        grounds:
          - "errors[ERR_OFFER_NOT_PUBLISHED]"
          - "endpoints[POST /api/claims]"
        distinguishing_aspect: "Opening a claim on an offer still in DRAFT returns ERR_OFFER_NOT_PUBLISHED (409) and creates no Claim row."
        test_recipe:
          setup:
            - "An ACTIVE program with one DRAFT offer and one ACTIVE dealer claimant."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "Unpublished Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Still Draft Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Eager Dealer", email: "eg@eg.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
          trigger:
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_id}" }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_OFFER_NOT_PUBLISHED"
            - "GET /api/claims?claimant_id=${clmt_id} reports total_count == 0"

      - name: second_withdraw_on_terminal_claim_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Claim.SUBMITTED_to_WITHDRAWN"
          - "errors[ERR_CLAIM_ALREADY_TERMINAL]"
        distinguishing_aspect: "WITHDRAWN is terminal on the adjudication axis: a second withdraw returns ERR_CLAIM_ALREADY_TERMINAL (409) and both slot counters stay at 0."
        test_recipe:
          setup:
            - "An ACTIVE program, a PUBLISHED DEALER offer and a claim already WITHDRAWN after being submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/programs"
              payload: { name: "Withdraw Program", budget_total_cents: 100000000, fiscal_year: 2026, escheat_jurisdiction: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/offers"
              payload: { program_id: "${prog_id}", name: "Withdraw Offer", channel: "DEALER", sku_scope: "TOOLS", effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-09-01T00:00:00Z", max_rebate_cents_per_claim: 500000 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "POST /api/claimants"
              payload: { type: "DEALER", legal_name: "Withdraw Dealer", email: "wd@wd.example", mailing_state: "CA" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { clmt_id: $.data.id }
            - call: "POST /api/claims"
              payload: { offer_id: "${offer_id}", claimant_id: "${clmt_id}" }
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/receipts"
              payload: { serial_number: "SN-WD-1", purchase_date: "2026-06-20T00:00:00Z", retailer_name: "Bay Supply", lines: [ { sku: "TOOLS-A", quantity: 2, unit_price_cents: 1000 } ] }
              as: Dealer
              as_user_id: "${clmt_id}"
            - call: "POST /api/claims/${claim_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_id}"
            - call: "POST /api/claims/${claim_id}/withdraw"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_id}"
          trigger:
            - call: "POST /api/claims/${claim_id}/withdraw"
              payload: {}
              as: Dealer
              as_user_id: "${clmt_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_CLAIM_ALREADY_TERMINAL"
            - "Claim.${claim_id}.adjudication_status == WITHDRAWN"
            - "Claimant.${clmt_id}.open_claim_count == 0"
            - "Offer.${offer_id}.active_claim_count == 0"

      - name: approve_from_submitted_without_review_is_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Claim.UNDER_REVIEW_to_APPROVED"
          - "errors[ERR_CLAIM_NOT_REVIEWABLE]"
