# =============================================================================
# SCAFFOLD_CORNER_DESIGN (SKILL.md 1.9) - breadth probe over 1.1-1.7
# Task 2815 - Chemical Exposure Warning Compliance
#
# Walk of references/claim-extraction-guide.md against this scaffold's own
# surface. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub naming the covering 1.8 instance and no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 - entities  (entity_topology: graph)
  # ===========================================================================
  - section: entities
    instances:

      - name: entity_listed_chemical_create_returns_computed_and_system_fields
        claim_type: creation
        grounds:
          - endpoints[POST /listed-chemicals]
          - entities.ListedChemical.fields.harm_class
          - entities.ListedChemical.fields.status
          - entities.ListedChemical.fields.revision_count
        distinguishing_aspect: |
          A create must mint the four common fields and derive harm_class from endpoint_type in the
          same response: REPRODUCTIVE_FEMALE maps to harm_class REPRODUCTIVE (not to its own name),
          status starts PROPOSED rather than LISTED, and warning_required_from stays null until a
          listing_effective_date exists.
        test_recipe:
          setup:
            - "Empty database; the logical clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
          assert:
            - "HTTP 201 with response_type object and data.id a UUID with no type prefix"
            - "ListedChemical.${chem_bpa}.harm_class == REPRODUCTIVE (derived, not REPRODUCTIVE_FEMALE)"
            - "ListedChemical.${chem_bpa}.status == PROPOSED, revision_count == 0, listing_effective_date is null, warning_required_from is null"
            - "ListedChemical.${chem_bpa}.version == 1 and created_at == updated_at"

      - name: entity_products_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /products]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The list envelope must report total_count over the whole matching set (3) rather than the
          page size, and has_more must flip from true to false as offset advances past the last row.
        test_recipe:
          setup:
            - "Three products exist: SKU-P1, SKU-P2, SKU-P3, all in lifecycle_state DEVELOPMENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-P1", product_name: "Cleaner A", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-P2", product_name: "Cleaner B", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-P3", product_name: "Cleaner C", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
          trigger:
            - call: "GET /products"
              payload: { limit: 2, offset: 0 }
              as: RegistryAdmin
            - call: "GET /products"
              payload: { limit: 2, offset: 2 }
              as: RegistryAdmin
          assert:
            - "first page: HTTP 200, response_type array, 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "second page: 1 row, total_count == 3, offset == 2, has_more == false"

      - name: entity_get_material_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=20]
          - errors[ERR_NOT_FOUND]
          - endpoints[GET /materials/{material_id}]
        distinguishing_aspect: |
          A well-formed UUID that matches no stored Material must be a 404 ERR_NOT_FOUND, not an
          empty 200 body.
        test_recipe:
          setup:
            - "No Material rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "GET /materials/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "HTTP 404 with error_id ERR_NOT_FOUND and response_type error"

      - name: entity_product_create_missing_required_annual_units
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /products]
        distinguishing_aspect: |
          annual_units has source input and no default, so omitting it is a 400 ERR_INVALID_REQUEST
          rather than a silent 0 that would later make the product look cure-eligible.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-MISSING", product_name: "No Units", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0 }
              as: RegistryAdmin
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "no Product row is created: GET /products returns total_count == 0"

      - name: entity_supplier_defaults_applied_when_warranty_fields_omitted
        claim_type: defaults
        grounds:
          - endpoints[POST /suppliers]
          - entities.Supplier.fields.warranty_status
          - entities.Supplier.fields.pass_through_warning_obligation
          - entities.Supplier.fields.indemnity_cap_cents
        distinguishing_aspect: |
          Omitting every optional warranty field must yield warranty_status NONE with
          pass_through_warning_obligation false and indemnity_cap_cents 0 - the defaults that make
          a fresh supplier contribute no warranty defense at all.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /suppliers"
              payload: { legal_name: "Bare Minimum Chemicals", contact_email: "hello@bare.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
          assert:
            - "HTTP 201 and Supplier.${sup_1}.warranty_status == NONE"
            - "Supplier.${sup_1}.pass_through_warning_obligation == false, indemnity_cap_cents == 0"
            - "Supplier.${sup_1}.warranty_scope is null, warranty_effective_from is null, warranty_effective_to is null"

      - name: entity_material_bom_depth_computed_from_parent_chain
        claim_type: computed_fields
        grounds:
          - entities.Material.fields.bom_depth
          - entities.Material.fields.parent_material_id
          - endpoints[POST /materials]
        distinguishing_aspect: |
          bom_depth is computed per row as parent.bom_depth + 1, so a three-level chain must read
          0, 1, 2 - a flat implementation that stores 0 everywhere, or one that counts children
          instead of ancestors, fails.
        test_recipe:
          setup:
            - "One supplier exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
          trigger:
            - call: "POST /materials"
              payload: { material_code: "RM-TOP", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_top: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-MID", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}", parent_material_id: "${mat_top}", parent_mass_fraction: 0.5 }
              as: ComplianceAnalyst
              captures: { mat_mid: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-LEAF", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}", parent_material_id: "${mat_mid}", parent_mass_fraction: 0.25 }
              as: ComplianceAnalyst
              captures: { mat_leaf: $.data.id }
          assert:
            - "Material.${mat_top}.bom_depth == 0 and parent_material_id is null"
            - "Material.${mat_mid}.bom_depth == 1 and parent_mass_fraction == 0.5"
            - "Material.${mat_leaf}.bom_depth == 2 and parent_mass_fraction == 0.25"
            - "GET /materials?parent_material_id=${mat_top} returns exactly 1 row, Material.${mat_mid}"

      - name: entity_material_chemical_negative_concentration_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_VALUE_OUT_OF_RANGE]
          - entities.MaterialChemical.fields.declared_concentration_ppm
        distinguishing_aspect: |
          declared_concentration_ppm is constrained >= 0, so -1.0 is a 422 ERR_VALUE_OUT_OF_RANGE
          and must not be clamped to zero; zero itself stays legal.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED and material RM-100 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
          trigger:
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: -1.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 0.0 }
              as: ComplianceAnalyst
              captures: { link_1: $.data.id }
          assert:
            - "first trigger call: HTTP 422 with error_id ERR_VALUE_OUT_OF_RANGE and no MaterialChemical row created"
            - "second trigger call: HTTP 201 and MaterialChemical.${link_1}.declared_concentration_ppm == 0.0 with measurement_basis SUPPLIER_DECLARED and status DECLARED"

      - name: entity_patch_discontinued_product_rejected_as_immutable
        claim_type: immutability
        grounds:
          - validations[priority=42]
          - errors[ERR_ENTITY_IMMUTABLE]
          - state_machines.Product.DEVELOPMENT_to_DISCONTINUED
        distinguishing_aspect: |
          DISCONTINUED is a terminal lifecycle state that freezes the row against PATCH, so the
          edit is refused with 409 ERR_ENTITY_IMMUTABLE rather than applied and the stored
          product_name is unchanged.
        test_recipe:
          setup:
            - "Product SKU-DISC exists and has been DISCONTINUED straight from DEVELOPMENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-DISC", product_name: "Retired Kit", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/transitions"
              payload: { action: "DISCONTINUE" }
              as: RegistryAdmin
          trigger:
            - call: "PATCH /products/${prod_1}"
              payload: { product_name: "Renamed Kit" }
              as: RegistryAdmin
          assert:
            - "HTTP 409 with error_id ERR_ENTITY_IMMUTABLE"
            - "Product.${prod_1}.product_name == Retired Kit and lifecycle_state == DISCONTINUED"

      - name: entity_component_create_with_unknown_material_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=21]
          - errors[ERR_NOT_FOUND]
          - endpoints[POST /products/{product_id}/components]
        distinguishing_aspect: |
          A body foreign key that resolves to nothing is a 404 on the FK, not a 201 with a dangling
          material_id - and the path product must still be the one reported as existing.
        test_recipe:
          setup:
            - "Product SKU-FK exists; no Material rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-FK", product_name: "Dangling Test", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
          trigger:
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
          assert:
            - "HTTP 404 with error_id ERR_NOT_FOUND"
            - "GET /product-components?product_id=${prod_1} returns total_count == 0"

      - name: entity_duplicate_material_chemical_pair_rejected
        claim_type: creation
        grounds:
          - validations[priority=22]
          - errors[ERR_DUPLICATE_RESOURCE]
          - entities.MaterialChemical.fields.chemical_id
        distinguishing_aspect: |
          The many-to-many junction is keyed on (material_id, chemical_id): the second link for the
          same pair is a 409 ERR_DUPLICATE_RESOURCE, which is what lets effective_concentration_ppm
          assume at most one link per pair.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED, material RM-100 exists and already carries a Bisphenol A link at 40.0 ppm."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
              captures: { link_1: $.data.id }
          trigger:
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 55.0 }
              as: ComplianceAnalyst
          assert:
            - "HTTP 409 with error_id ERR_DUPLICATE_RESOURCE"
            - "MaterialChemical.${link_1}.declared_concentration_ppm == 40.0 (unchanged)"
            - "GET /material-chemicals?material_id=${mat_1} returns total_count == 1"

      - name: entity_material_parent_cycle_rejected
        claim_type: creation
        grounds:
          - validations[priority=73]
          - errors[ERR_MATERIAL_CYCLE]
          - endpoints[PATCH /materials/{material_id}]
        distinguishing_aspect: |
          The self-referential graph must stay acyclic: re-parenting a top-level material under its
          own descendant is refused with 422 ERR_MATERIAL_CYCLE, which is what bounds the
          post-order recursion in effective_concentration_ppm.
        test_recipe:
          setup:
            - "RM-TOP has no parent; RM-MID has parent RM-TOP with mass fraction 0.5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-TOP", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_top: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-MID", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}", parent_material_id: "${mat_top}", parent_mass_fraction: 0.5 }
              as: ComplianceAnalyst
              captures: { mat_mid: $.data.id }
          trigger:
            - call: "PATCH /materials/${mat_top}"
              payload: { parent_material_id: "${mat_mid}", parent_mass_fraction: 0.5 }
              as: ComplianceAnalyst
            - call: "PATCH /materials/${mat_top}"
              payload: { parent_material_id: "${mat_top}", parent_mass_fraction: 0.5 }
              as: ComplianceAnalyst
          assert:
            - "first trigger call (parent set to its own descendant): HTTP 422 with error_id ERR_MATERIAL_CYCLE"
            - "second trigger call (self-parent): HTTP 422 with error_id ERR_MATERIAL_CYCLE"
            - "Material.${mat_top}.parent_material_id is still null and bom_depth == 0"
            - "Material.${mat_mid}.bom_depth == 1"

      - name: entity_product_compliance_posture_computed_on_every_mutation
        claim_type: computed_fields
        grounds:
          - entities.Product.fields.compliance_posture
          - calculations.total_listed_chemical_load_ug
        distinguishing_aspect: |
          compliance_posture and total_listed_chemical_load_ug are computed fields: a client-supplied value is ignored and both are re-derived on every mutation that can move them.
        excluded_because:
          difficulty_instance: transitive_cascade / disclosure_response_cascades_modeled_exposure_and_load
          rationale: "That 1.8 instance asserts compliance_posture and total_listed_chemical_load_ug being re-derived across a disclosure mutation, so the computed-field claim for both fields is already covered."

      - name: entity_product_parallel_lifecycle_and_posture_dimensions
        claim_type: computed_fields
        grounds:
          - entities.Product.fields.lifecycle_state
          - entities.Product.fields.compliance_posture
        distinguishing_aspect: |
          the two computed dimensions advance on independent triggers, so a lifecycle action never moves the posture and a posture recompute never moves the lifecycle.
        excluded_because:
          difficulty_instance: non_linear_state_machine / product_parallel_dimensions_evolve_independently
          rationale: "The independence of the lifecycle_state and compliance_posture dimensions is the whole subject of that 1.8 instance."

  # ===========================================================================
  # SECTION 2 - state_machines  (state_machine_shape: cyclic)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: sm_list_chemical_stamps_warning_required_from_grace_date
        claim_type: side_effect_execution
        grounds:
          - state_machines.ListedChemical.PROPOSED_to_LISTED
          - entities.ListedChemical.fields.warning_required_from
        distinguishing_aspect: |
          LIST must both move the status and stamp warning_required_from at
          listing_effective_date + 365 days - 2026-01-01 becomes exactly 2027-01-01T00:00:00Z, not
          the listing date itself and not the clock now.
        test_recipe:
          setup:
            - "A PROPOSED Bisphenol A listing exists; the logical clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
          trigger:
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
          assert:
            - "HTTP 200 and ListedChemical.${chem_bpa}.status == LISTED"
            - "ListedChemical.${chem_bpa}.listing_effective_date == 2026-01-01T00:00:00Z"
            - "ListedChemical.${chem_bpa}.warning_required_from == 2027-01-01T00:00:00Z"
            - "ListedChemical.${chem_bpa}.version == 2 and revision_count == 0"

      - name: sm_list_chemical_without_effective_date_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ListedChemical.PROPOSED_to_LISTED
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          listing_effective_date is conditionally required by the LIST action alone, so omitting it
          is a 400 ERR_INVALID_REQUEST and the chemical must stay PROPOSED rather than becoming
          LISTED with a null effective date.
        test_recipe:
          setup:
            - "A PROPOSED Bisphenol A listing exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
          trigger:
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST" }
              as: RegistryAdmin
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "ListedChemical.${chem_bpa}.status == PROPOSED, listing_effective_date is null, warning_required_from is null, version == 1"

      - name: sm_withdrawn_chemical_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ListedChemical.PROPOSED_to_WITHDRAWN
          - validations[priority=40]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          WITHDRAWN is the ListedChemical terminal state: neither LIST nor DELIST may be applied
          afterwards, so both are 409 ERR_INVALID_STATE_TRANSITION even though LIST is legal from
          the state the row was in one call earlier.
        test_recipe:
          setup:
            - "A Bisphenol A listing has been WITHDRAWN from PROPOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "WITHDRAW" }
              as: RegistryAdmin
          trigger:
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "DELIST" }
              as: RegistryAdmin
          assert:
            - "both trigger calls: HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "ListedChemical.${chem_bpa}.status == WITHDRAWN and version == 2 (neither refused call mutated the row)"

      - name: sm_second_discontinue_action_rejected_as_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Product.DEVELOPMENT_to_DISCONTINUED
          - validations[priority=40]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Transitions are not idempotent here: replaying DISCONTINUE on an already DISCONTINUED
          product is a 409 rather than a no-op 200, and the version must not advance on the refused
          call.
        test_recipe:
          setup:
            - "Product SKU-IDEM exists and has been DISCONTINUED once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-IDEM", product_name: "Once Only", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/transitions"
              payload: { action: "DISCONTINUE" }
              as: RegistryAdmin
          trigger:
            - call: "POST /products/${prod_1}/transitions"
              payload: { action: "DISCONTINUE" }
              as: RegistryAdmin
          assert:
            - "HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "Product.${prod_1}.lifecycle_state == DISCONTINUED and version == 2"

      - name: sm_material_disclosure_starts_not_requested
        claim_type: initial_state
        grounds:
          - state_machines.Material.NOT_REQUESTED_to_REQUESTED
          - entities.Material.fields.disclosure_status
        distinguishing_aspect: |
          A freshly created Material starts at disclosure_status NOT_REQUESTED with null
          data_request_sent_at, and REQUEST is the only legal first move - VERIFY from that state is
          refused.
        test_recipe:
          setup:
            - "One supplier exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
          trigger:
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
          assert:
            - "before both calls: Material.${mat_1}.disclosure_status == NOT_REQUESTED, data_request_sent_at is null, data_received_at is null, naturally_occurring_claim == false"
            - "first trigger call: HTTP 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "second trigger call: HTTP 200, disclosure_status == REQUESTED and data_request_sent_at == 2026-08-01T00:00:00Z"

      - name: sm_unknown_action_on_product_transitions_returns_unknown_action
        claim_type: invalid_transitions
        grounds:
          - validations[priority=11]
          - errors[ERR_UNKNOWN_ACTION]
          - endpoints[POST /products/{product_id}/transitions]
        distinguishing_aspect: |
          An action string that names no transition at all is a 400 ERR_UNKNOWN_ACTION, which must
          outrank the 409 ERR_INVALID_STATE_TRANSITION reserved for known-but-illegal actions.
        test_recipe:
          setup:
            - "Product SKU-UNK exists in lifecycle_state DEVELOPMENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-UNK", product_name: "Unknown Action", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
          trigger:
            - call: "POST /products/${prod_1}/transitions"
              payload: { action: "RELAUNCH" }
              as: RegistryAdmin
          assert:
            - "HTTP 400 with error_id ERR_UNKNOWN_ACTION"
            - "Product.${prod_1}.lifecycle_state == DEVELOPMENT and version == 1"

      - name: sm_disclosure_refusal_and_rerequest_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Material.REQUESTED_to_REFUSED
          - state_machines.Material.REFUSED_to_REQUESTED
          - entities.Material.fields.data_received_at
        distinguishing_aspect: |
          The disclosure dimension is cyclic: REQUESTED -> REFUSED -> REQUESTED -> INCOMPLETE ->
          REQUESTED must all be accepted, and data_received_at is stamped only by RECORD_RESPONSE
          (so it stays null across the REFUSED loop and is set on the INCOMPLETE response).
        test_recipe:
          setup:
            - "Material RM-100 exists with disclosure_status NOT_REQUESTED; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
          trigger:
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "MARK_REFUSED" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "INCOMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
          assert:
            - "the five trigger calls yield disclosure_status REQUESTED, REFUSED, REQUESTED, INCOMPLETE, REQUESTED in that order, each HTTP 200"
            - "Material.${mat_1}.data_received_at is null after the REFUSED loop and == 2026-08-01T00:00:00Z after the INCOMPLETE response"
            - "Material.${mat_1}.version == 6 after the fifth trigger call"

      - name: sm_material_chemical_dispute_returns_to_test_requested
        claim_type: valid_transition
        grounds:
          - state_machines.MaterialChemical.TEST_REPORTED_to_DISPUTED
          - state_machines.MaterialChemical.DISPUTED_to_TEST_REQUESTED
          - entities.MaterialChemical.fields.measurement_basis
        distinguishing_aspect: |
          The laboratory dimension loops DECLARED -> TEST_REQUESTED -> TEST_REPORTED -> DISPUTED ->
          TEST_REQUESTED, and measurement_basis flips to LAB_TESTED at REPORT_RESULT and stays
          LAB_TESTED through the dispute - a disputed result is contested, not erased.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED and material RM-100 carries a Bisphenol A link declared at 40.0 ppm."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
              captures: { link_1: $.data.id }
          trigger:
            - call: "POST /material-chemicals/${link_1}/transitions"
              payload: { action: "REQUEST_TEST" }
              as: ComplianceAnalyst
            - call: "POST /material-chemicals/${link_1}/transitions"
              payload: { action: "REPORT_RESULT", lab_name: "Harbor Analytical", lab_result_ppm: 36.0, lab_loq_ppm: 1.0 }
              as: ComplianceAnalyst
            - call: "POST /material-chemicals/${link_1}/transitions"
              payload: { action: "DISPUTE", dispute_note: "Sample chain of custody incomplete" }
              as: ToxicologyReviewer
            - call: "POST /material-chemicals/${link_1}/transitions"
              payload: { action: "REQUEST_TEST" }
              as: ComplianceAnalyst
          assert:
            - "the four trigger calls yield status TEST_REQUESTED, TEST_REPORTED, DISPUTED, TEST_REQUESTED in that order, each HTTP 200"
            - "after REPORT_RESULT: MaterialChemical.${link_1}.measurement_basis == LAB_TESTED, lab_result_ppm == 36.0, lab_loq_ppm == 1.0, lab_reported_at == 2026-08-01T00:00:00Z"
            - "after DISPUTE: dispute_note == Sample chain of custody incomplete and measurement_basis is still LAB_TESTED"
            - "declared_concentration_ppm remains 40.0 throughout"

      - name: sm_supplier_warranty_revoke_blocked_while_notice_in_window
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Supplier.ACTIVE_to_REVOKED
          - validations[priority=64]
          - errors[ERR_WARRANTY_IN_USE]
        distinguishing_aspect: |
          A warranty may not be revoked out from under a live enforcement matter: with a notice in
          UNDER_EVALUATION whose served_at falls inside the warranty window, REVOKE_WARRANTY is a
          409 ERR_WARRANTY_IN_USE, and the warranty is only revocable once that notice is DISMISSED.
        test_recipe:
          setup:
            - "Supplier Northgate has an ACTIVE warranty covering 2026-01-01 onward (warranty_effective_to null)."
            - "Product SKU-WW has one ACTIVE component of Northgate's material RM-100."
            - "A notice served 2026-07-01 sits in UNDER_EVALUATION, inside that warranty window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example", warranty_scope: "ALL_MATERIALS", pass_through_warning_obligation: true, indemnity_cap_cents: 5000000, warranty_effective_from: "2026-01-01T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /suppliers/${sup_1}/transitions"
              payload: { action: "EXECUTE_WARRANTY" }
              as: RegulatoryCounsel
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-WW", product_name: "Warranty Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Watch Alliance", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 800, earliest_violation_date: "2026-06-01T00:00:00Z", served_at: "2026-07-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { notice_1: $.data.id }
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          trigger:
            - call: "POST /suppliers/${sup_1}/transitions"
              payload: { action: "REVOKE_WARRANTY" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "DISMISS", evaluation_note: "No listed-chemical exposure alleged in fact" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /suppliers/${sup_1}/transitions"
              payload: { action: "REVOKE_WARRANTY" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          assert:
            - "first trigger call: HTTP 409 with error_id ERR_WARRANTY_IN_USE and Supplier.${sup_1}.warranty_status still ACTIVE"
            - "after DISMISS: NoticeOfViolation.${notice_1}.status == DISMISSED and Product.${prod_1}.open_notice_count == 0"
            - "third trigger call: HTTP 200, Supplier.${sup_1}.warranty_status == REVOKED and warranty_effective_to == 2026-08-01T00:00:00Z (stamped from the logical clock because it was null)"

      - name: sm_determination_return_for_revision_without_note_rejected
