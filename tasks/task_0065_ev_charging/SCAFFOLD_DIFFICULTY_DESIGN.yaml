scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_total_provisional_vs_final
        grounds:
          - calculations.session_settlement
          - state_machines.ChargingSession.SETTLING_to_SETTLED
          - endpoints[GET /sessions/{id}/estimate]
          - endpoints[POST /sessions/{id}/stop]
        distinguishing_aspect: |
          Operates on the ChargingSession entity: GET /sessions/{id}/estimate runs the provisional_estimate
          variant of session_settlement using ChargingCurvePoint samples up to now() and the still-evolving
          last sample; POST /sessions/{id}/stop runs the final variant against the frozen final ChargingCurvePoint
          stream. With identical curve points so far, the provisional total_cents reported by the estimate
          endpoint can equal the final total only when ended_at coincides with the latest sample — adding
          even one more curve point between estimate and stop produces a different final total_cents.
        test_recipe:
          setup:
            - "Create Operator op1 (PLATFORM)."
            - "Create Operator owner1 (STATION_OWNER)."
            - "Create Station S1 operator_id=op1 station_owner_id=owner1 revenue_share_bps=4000."
            - "Create Pile P1 on S1, rated_power_kw=60, connector_type=GBT_DC, firmware_version=1.0.0; shelve."
            - "Create PricingVersion pv1 operator=op1 effective_from=2026-05-13T00:00:00Z, effective_to=2026-12-31T00:00:00Z, peak=80, flat=50, valley=30, service_fee=20, tax_bps=1300, tier_discount={BASIC:0,SILVER:500,GOLD:1000,PLATINUM:1500}, peak_windows=[], valley_windows=[]."
            - "Create Member M1 home_operator_id=op1 tier=SILVER wallet_balance_cents=100000."
            - "Create ChargingSession with pile_id=P1 member_id=M1 auth_method=APP."
            - "POST /sessions/{id}/start."
            - "POST /sessions/{id}/curve-points sampled_at=t1 cumulative_energy_milli=10000 instant_power_kw=60 window_tag=FLAT."
          trigger:
            - "GET /sessions/{id}/estimate (capture estimate.total_cents)."
            - "POST /sessions/{id}/curve-points sampled_at=t2 cumulative_energy_milli=15000 instant_power_kw=60 window_tag=FLAT."
            - "POST /sessions/{id}/stop."
          assert:
            - "estimate.electricity_fee_cents == 500 and estimate.total_cents == 780."
            - "After stop: ChargingSession.electricity_fee_cents == 750."
            - "After stop: ChargingSession.total_cents == 1170 (electricity 750 + service 285 + tax 135) and != estimate.total_cents."

      - name: operator_settlement_accrual_vs_reversal
        grounds:
          - calculations.operator_settlement
          - state_machines.ChargingSession.SETTLING_to_SETTLED
          - state_machines.Payout.ISSUED_to_REVERSED
          - endpoints[POST /_events/emit]
          - errors[ERR_PAYOUT_PERIOD_DRIFT]
        distinguishing_aspect: |
          Operates on the SettlementLedgerEntry / Payout entity domain (distinct from rule 1 instance 1, which
          operates on ChargingSession). The forward_accrual variant writes four POSITIVE
          SettlementLedgerEntry rows (STATION_OWNER_SHARE, PLATFORM_SERVICE_FEE, optional ROAMING_PARTNER,
          TAX_AUTHORITY) on SETTLED; the refund_reversal variant recomputes from scratch using current
          Station.revenue_share_bps and writes the four rows with NEGATIVE amount_cents. Same session inputs
          plus a refund event therefore produce two ledger snapshots: a non-zero per-counterparty net
          immediately after SETTLED, and a zero per-counterparty net after refund.
        test_recipe:
          setup:
            - "Reuse the SETTLED session from instance session_total_provisional_vs_final (member same operator: non-roaming case)."
            - "Capture SettlementLedgerEntry rows: STATION_OWNER_SHARE=+262, PLATFORM_SERVICE_FEE=+35, TAX_AUTHORITY=+90, operator_residual implicit (not a separate ledger row)."
          trigger:
            - "POST /_events/emit {source_system: PAYMENT, event_type: payment.refunded, payload: {session_id: <session.id>}}."
          assert:
            - "After refund: GET /sessions/{id}/ledger-entries returns 6 rows (3 positive + 3 negative)."
            - "sum(amount_cents WHERE counterparty_kind=STATION_OWNER_SHARE) == 0."
            - "sum(amount_cents WHERE counterparty_kind=PLATFORM_SERVICE_FEE) == 0."
            - "sum(amount_cents WHERE counterparty_kind=TAX_AUTHORITY) == 0."
            - "AuditLog entry with event_kind=BILLING_ADJUSTMENT and entity_kind=ChargingSession exists."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_window_rounding_before_sum
        grounds:
          - calculations.session_settlement
          - entities.ChargingSession.fields.peak_kwh_milli
          - entities.ChargingSession.fields.flat_kwh_milli
          - entities.ChargingSession.fields.valley_kwh_milli
        distinguishing_aspect: |
          MODE (b) — nested rounding where order matters. Section §1.3 calculations.session_settlement
          formula pins: round per window first (peak, flat, valley each rounded to integer cents
          independently) THEN sum, NOT sum then round. A test that uses mixed-window energy where
          peak_milli*peak_rate/1000 produces a .5 cents component while flat and valley produce
          non-fractional components must observe per-window-then-sum semantics (one half-up rounding event
          per non-zero window), distinguishable from sum-then-round (one half-up rounding event total).
        test_recipe:
          setup:
            - "Reuse Operator/Station/Pile from rule 1 setup."
            - "Configure PricingVersion peak=37, flat=50, valley=23 (cents/kWh)."
            - "Member M1 BASIC tier (zero discount) to isolate electricity calculation."
            - "Create and start session."
            - "Append curve points: peak_milli=5005, flat_milli=3000, valley_milli=2005 (mixed-window mid-cent fractions)."
          trigger:
            - "POST /sessions/{id}/stop."
          assert:
            - "peak component = round_half_up(5005*37/1000) = round_half_up(185.185) = 185 cents."
            - "flat component = round_half_up(3000*50/1000) = 150 cents."
            - "valley component = round_half_up(2005*23/1000) = round_half_up(46.115) = 46 cents."
            - "ChargingSession.electricity_fee_cents == 381 (per-window sum)."
            - "Counter-check: sum-then-round would yield round_half_up((5005*37 + 3000*50 + 2005*23)/1000) = round_half_up(381.300) = 381 in this case but ChargingSession.electricity_fee_cents MUST equal 381 by per-window rounding semantics — the implementation choice is fixed."

      - name: operator_settlement_evaluation_order_pinned
        grounds:
          - calculations.operator_settlement
          - entities.Station.fields.revenue_share_bps
          - entities.Operator.fields.role_kind
          - validations[priority=18]
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency whose evaluation order is explicitly pinned. The
          formula computes roaming first (function of net_cents), then platform fee (function of
          after_roaming_cents), then station owner share (function of after_platform_cents), then operator
          residual (after_platform_cents - station_owner_cents). Reversing the order (e.g., computing
          station_owner before platform) would yield different integer-rounded amounts because the bases
          differ by integer cents. Section §1.3 pins the sequence; the test verifies the specific intermediate
          totals.
        test_recipe:
          setup:
            - "Operator opA (PLATFORM) and opB (PLATFORM, distinct from opA — roaming partner)."
            - "Operator owner1 (STATION_OWNER)."
            - "Station S1 operator_id=opA station_owner_id=owner1 revenue_share_bps=4000."
            - "Member M1 home_operator_id=opB (cross-operator → roaming applies)."
            - "Run a session that produces electricity_fee_cents=500 and service_fee_cents=190 (use the rule 1 setup numbers)."
          trigger:
            - "POST /sessions/{id}/stop."
          assert:
            - "SettlementLedgerEntry ROAMING_PARTNER amount_cents == +104 (round_half_up(690*1500/10000))."
            - "SettlementLedgerEntry PLATFORM_SERVICE_FEE amount_cents == +29 (round_half_up(586*500/10000))."
            - "SettlementLedgerEntry STATION_OWNER_SHARE amount_cents == +223 (round_half_up(557*4000/10000))."
            - "SettlementLedgerEntry TAX_AUTHORITY amount_cents == +90."
            - "Operator residual implicit total: 104 + 29 + 223 + (557-223=334) + 90 == 780 == ChargingSession.total_cents."

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: pile_parallel_lifecycle_and_operational
        grounds:
          - state_machines.Pile
          - entities.Pile.fields.lifecycle_state
          - entities.Pile.fields.operational_state
        distinguishing_aspect: |
          PARALLEL state dimensions on a single entity. Pile.lifecycle_state evolves on the
          OFF_SHELF→ON_SHELF→DECOMMISSIONED axis (operator/owner control), while Pile.operational_state
          evolves on the IDLE↔IN_USE↔FAULT↔OFFLINE axis (system/event control). They are not collapsible
          into one enum — shelving sets operational_state to IDLE on the orthogonal axis; an OFF_SHELF pile
          has operational_state=null while an ON_SHELF pile carries an independent operational status.
        test_recipe:
          setup:
            - "Create Operator/Station/Pile P1; do NOT shelve yet."
          trigger:
            - "GET /piles/{P1} (state A: lifecycle=OFF_SHELF, operational=null)."
            - "POST /piles/{P1}/shelve."
            - "GET /piles/{P1} (state B: lifecycle=ON_SHELF, operational=IDLE)."
            - "POST /_events/emit {source_system:GRID, event_type:grid.pile_offline, payload:{pile_id:P1}}."
            - "GET /piles/{P1} (state C: lifecycle=ON_SHELF, operational=OFFLINE)."
            - "POST /_events/emit {source_system:GRID, event_type:grid.pile_online, payload:{pile_id:P1}}."
            - "POST /piles/{P1}/off-shelve."
            - "GET /piles/{P1} (state D: lifecycle=OFF_SHELF, operational=null)."
          assert:
            - "State A: lifecycle_state==OFF_SHELF AND operational_state is null."
            - "State B: lifecycle_state==ON_SHELF AND operational_state==IDLE."
            - "State C: lifecycle_state==ON_SHELF AND operational_state==OFFLINE (parallel axes evolve independently)."
            - "State D: lifecycle_state==OFF_SHELF AND operational_state is null (orthogonal axis collapses on off-shelve)."

      - name: repair_ticket_reject_loop_cycle
        grounds:
          - state_machines.RepairTicket
          - state_machines.RepairTicket.AWAITING_ACCEPTANCE_to_IN_REPAIR
          - state_machines.RepairTicket.IN_REPAIR_to_AWAITING_ACCEPTANCE
          - endpoints[POST /repair-tickets/{id}/reject]
          - endpoints[POST /repair-tickets/{id}/complete]
        distinguishing_aspect: |
          CYCLIC edge AWAITING_ACCEPTANCE → IN_REPAIR via /reject, paired with the forward IN_REPAIR →
          AWAITING_ACCEPTANCE via /complete, on a DIFFERENT entity (RepairTicket) than the parallel-axes
          Pile machine above. A linear progression OPEN→DISPATCHED→IN_REPAIR→AWAITING_ACCEPTANCE→CLOSED
          would never re-enter IN_REPAIR; the reject endpoint forces the cycle and lets multiple
          IN_REPAIR↔AWAITING_ACCEPTANCE laps occur before CLOSED.
        test_recipe:
          setup:
            - "Create fault and dispatch/begin/complete repair ticket so it is AWAITING_ACCEPTANCE."
          trigger:
            - "POST /repair-tickets/{id}/reject (as StationOwner)."
            - "GET /repair-tickets/{id} (state should be IN_REPAIR again)."
            - "POST /repair-tickets/{id}/complete (re-complete)."
            - "POST /repair-tickets/{id}/reject (second cycle)."
            - "POST /repair-tickets/{id}/complete (third complete)."
            - "POST /repair-tickets/{id}/accept."
          assert:
            - "After first reject: RepairTicket.status == IN_REPAIR (cycle traversed)."
            - "After second reject: RepairTicket.status == IN_REPAIR (cycle traversed again — entity reaches same state via cyclic edge)."
            - "After final accept: RepairTicket.status == CLOSED AND parent FaultReport.status == RESOLVED."

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fault_isolation_cascade_depth_4
        grounds:
          - state_machines.FaultReport.OPEN_to_ISOLATED
          - state_machines.Pile (transition operational IN {IDLE,IN_USE} to FAULT)
          - state_machines.Reservation.HELD_to_CANCELLED
          - state_machines.ChargingSession.CHARGING_to_ABORTED
        distinguishing_aspect: |
          DEPTH-4 chain triggered by /fault-reports/{id}/isolate: A=FaultReport flips OPEN→ISOLATED;
          A causes B=Pile.operational_state→FAULT; B causes C=Reservation HELD→CANCELLED on that pile
          (and separately D=ChargingSession CHARGING→ABORTED). Each hop is *caused by the previous hop*,
          not by the original isolate call directly — the reservation cancellation watches Pile.operational_state,
          not the FaultReport. Different originating trigger than instance 2 (session_settle_cascade_depth_3).
        test_recipe:
          setup:
            - "Operator, Station, Pile P1 shelved. Member M1 with wallet >= 1000 cents."
            - "Member M1 creates Reservation R1 on P1."
            - "Member M2 also has a session on P1 already in CHARGING state (separate pile? no, only one IN_USE per pile — use a SECOND scenario where M1 holds R1 and M1 started a session via R1)."
            - "Adjusted: create Reservation R1 (HELD) on P1 for M1; do NOT start session."
            - "Concurrently, an in-progress session would block; for depth=4 we use a second pile P2 at the same station with its own session in CHARGING. The fault report targets P1."
            - "Refined: this instance focuses on a SINGLE pile cascade; the in-flight ABORTED edge is exercised by a second variant. Setup: P1 has Reservation R1 (HELD) for M1, and operational_state==IDLE."
            - "Create FaultReport F1 on P1 severity=MAJOR (status=OPEN)."
          trigger:
            - "POST /fault-reports/{F1}/isolate."
          assert:
            - "Hop 1 (A→B): FaultReport.status == ISOLATED."
            - "Hop 2 (B→C): Pile.operational_state == FAULT (caused by FaultReport ISOLATED side_effect)."
            - "Hop 3 (C→D): Reservation R1.status == CANCELLED (caused by Pile FAULT cascade, NOT directly by isolate)."
            - "Hop 4 invariant (D): Member.no_show_strikes UNCHANGED (compensating: CANCELLED is not EXPIRED) — confirms the cascade preserves the Reservation→Member quantity."

      - name: session_settle_cascade_depth_3
        grounds:
          - state_machines.ChargingSession.SETTLING_to_SETTLED
          - state_machines.Pile (transition operational IN_USE to IDLE)
          - state_machines.QueueEntry.WAITING_to_PROMOTED
          - calculations.queue_promotion_selection
        distinguishing_aspect: |
          DEPTH-3 chain triggered by /sessions/{id}/stop (different origin from fault_isolation_cascade_depth_4):
          A=ChargingSession SETTLING→SETTLED; A causes B=Pile.operational_state IN_USE→IDLE; B causes
          C=QueueEntry WAITING→PROMOTED at the station (caused by the pile becoming IDLE, not by the
          session stop). The QueueEntry promotion watches Pile.operational_state==IDLE, not session.status,
          establishing the each-link-causes-next chain.
        test_recipe:
          setup:
            - "Reuse session SETTLED scenario from rule 1 setup with two members M1, M2."
            - "While M1's session is CHARGING (pile IN_USE), M2 joins queue: POST /stations/{S1}/queue-entries."
            - "Verify M2 QueueEntry q1 has status=WAITING, position=1."
          trigger:
            - "POST /sessions/{M1_session}/stop."
          assert:
            - "Hop 1 (A): ChargingSession.status == SETTLED."
            - "Hop 2 (B): Pile.operational_state == IDLE (caused by session terminal side_effect)."
            - "Hop 3 (C): QueueEntry q1.status == PROMOTED (caused by Pile becoming IDLE, not directly by session stop)."

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pile_unavailable_beats_reservation_expired
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_PILE_UNAVAILABLE]
          - errors[ERR_RESERVATION_EXPIRED]
        distinguishing_aspect: |
          Pair (business_safety vs business_temporal). Construct a request where BOTH preconditions fail
          simultaneously: the Reservation hold has expired AND the Pile is in FAULT. Section §1.4 priority
          ordering pins business_safety (priority 7-8) ahead of business_temporal (priority 10), so the
          server MUST return ERR_PILE_UNAVAILABLE (http 409), not ERR_RESERVATION_EXPIRED (http 409).
        test_recipe:
          setup:
            - "Create Station S1, Pile P1 shelved IDLE, Member M1, PricingVersion."
            - "POST /reservations {pile_id: P1} as M1 → R1 (HELD)."
            - "POST /_clock/advance to push wall-clock past hold_expires_at (e.g., advance 20 minutes)."
            - "Create FaultReport F1 on P1 severity=CRITICAL (auto-isolates) → Pile.operational_state==FAULT."
            - "Note R1 was cancelled by the fault cascade. Construct fresh: instead start by setting Pile FAULT FIRST, then reset clock, then re-create reservation; advance clock past expiry — but reservation creation on FAULT pile is blocked by validation 7."
            - "Refined construction: create Reservation R1 on P1 while IDLE, advance clock past hold_expires_at WITHOUT running sweep, then fault the pile (Pile→FAULT cascades R1 to CANCELLED). To reach dual-fail state instead: do NOT cascade — set Pile to OFFLINE via grid event AFTER expiry but BEFORE sweep. Pile OFFLINE is also ERR_PILE_UNAVAILABLE; reservation R1 still HELD-but-temporally-expired."
            - "Final setup: R1 HELD, now >= hold_expires_at, Pile.operational_state==OFFLINE (via grid event)."
            - "Create ChargingSession via POST /sessions with reservation_id=R1."
          trigger:
            - "POST /sessions/{id}/start."
          assert:
            - "Response error_id == ERR_PILE_UNAVAILABLE (priority 8 wins over priority 10)."
            - "Response http status == 409."

      - name: queue_not_at_front_beats_insufficient_balance
        grounds:
          - validations[priority=11]
          - validations[priority=17]
          - errors[ERR_QUEUE_NOT_AT_FRONT]
          - errors[ERR_INSUFFICIENT_BALANCE]
        distinguishing_aspect: |
          Pair (business_referential vs business_fiscal). Different error-category pair than instance 1.
          Construct: an unreserved session start where the member is NOT at queue position 1 AND the member's
          wallet balance is below MIN_AUTH_HOLD_CENTS. Priority 11 (referential) precedes priority 17 (fiscal),
          so the response MUST be ERR_QUEUE_NOT_AT_FRONT (409), not ERR_INSUFFICIENT_BALANCE (402).
        test_recipe:
          setup:
            - "Station S1, Pile P1 shelved IDLE."
            - "Member M_first wallet_balance_cents=100000; Member M_late wallet_balance_cents=0."
            - "POST /stations/{S1}/queue-entries as M_first → position 1."
            - "POST /stations/{S1}/queue-entries as M_late → position 2."
            - "Create ChargingSession for M_late on P1 with reservation_id=null."
          trigger:
            - "POST /sessions/{id}/start as M_late."
          assert:
            - "Response error_id == ERR_QUEUE_NOT_AT_FRONT."
            - "Response http status == 409 (referential check wins over fiscal check despite both failing)."

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reservation_expiry_exact_instant_inclusive
        grounds:
          - state_machines.Reservation.HELD_to_EXPIRED
          - endpoints[POST /_sweep/run]
          - endpoints[POST /_clock/advance]
        distinguishing_aspect: |
          DATETIME metric, half-open boundary. The state machine precondition is now >= hold_expires_at
          (inclusive). At now == hold_expires_at exactly the sweep MUST expire the reservation; at
          now == hold_expires_at - 1ms it MUST NOT. Reached through /_sweep/run, a different endpoint
          than instance 2 (which uses /sessions).
        test_recipe:
          setup:
            - "Create Reservation R1 on P1 at clock T0; hold_expires_at == T0 + 15 minutes."
            - "POST /_clock/advance to T0 + 14m59s999ms (one ms before expiry)."
          trigger:
            - "POST /_sweep/run."
            - "GET /reservations/{R1} → must still be HELD."
            - "POST /_clock/advance to T0 + 15m00s000ms (exact instant)."
            - "POST /_sweep/run."
            - "GET /reservations/{R1}."
          assert:
            - "Before exact instant (T0+14m59s999ms): Reservation.status == HELD."
            - "At exact instant (T0+15m00s000ms): Reservation.status == EXPIRED (>= boundary is inclusive)."
            - "Member.no_show_strikes incremented from 0 to 1."
            - "Reservation.no_show_penalty_cents == 500 (BASE_PENALTY_CENTS * 2^0)."

      - name: empty_queue_allows_unreserved_start
        grounds:
          - validations[priority=11]
          - state_machines.QueueEntry
          - endpoints[POST /sessions/{id}/start]
          - errors[ERR_QUEUE_NOT_AT_FRONT]
        distinguishing_aspect: |
          EMPTY-COLLECTION boundary (different metric: count of WAITING QueueEntry vs the datetime
          boundary of instance 1; different endpoint: POST /sessions/{id}/start vs POST /_sweep/run).
          The validation reads: start succeeds when WAITING.count == 0 OR (WAITING.count >= 1 AND requester
          is at position 1). Test the zero-vs-one transition: with zero WAITING entries an unreserved start
          succeeds; with exactly one WAITING entry that belongs to a DIFFERENT member, an unreserved start
          by yet another member fails with ERR_QUEUE_NOT_AT_FRONT.
        test_recipe:
          setup:
            - "Station S1, Pile P1 shelved IDLE; PricingVersion configured; no WAITING queue."
            - "Member M_x wallet_balance_cents=100000."
          trigger:
            - "POST /sessions {pile_id:P1, member_id:M_x, auth_method:APP, reservation_id:null}."
            - "POST /sessions/{id}/start as M_x. (Expect success: count==0 boundary)."
            - "Reset Pile P1 to IDLE (after stop)."
            - "Member M_first joins queue at S1 (1 WAITING entry exists, position=1)."
            - "Member M_other (different from M_first) wallet_balance_cents=100000."
            - "POST /sessions {pile_id:P1, member_id:M_other, auth_method:APP, reservation_id:null}."
            - "POST /sessions/{id}/start as M_other. (Expect failure: count==1, requester not at position 1)."
          assert:
            - "First start (empty queue, count==0): http 200, ChargingSession.status == CHARGING."
            - "Second start (count==1, member_id not at position 1): http 409, error_id == ERR_QUEUE_NOT_AT_FRONT."

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_start_requires_pile_idle
        grounds:
          - state_machines.ChargingSession.PENDING_AUTH_to_CHARGING
          - entities.Pile.fields.operational_state
          - validations[priority=8]
          - errors[ERR_PILE_UNAVAILABLE]
        distinguishing_aspect: |
          Entity pair (ChargingSession, Pile). ChargingSession's PENDING_AUTH→CHARGING transition is
          guarded by Pile.operational_state == IDLE. With session correctly in PENDING_AUTH (no internal
          state defect) but Pile in IN_USE/FAULT/OFFLINE, the transition MUST fail.
        test_recipe:
          setup:
            - "Station, Pile P1 shelved IDLE; Member M1 wallet_balance=100000; PricingVersion configured."
            - "Create ChargingSession C1 in PENDING_AUTH on P1 for M1."
            - "Inject Pile P1 into OFFLINE via /_events/emit grid.pile_offline (Pile.operational_state==OFFLINE)."
          trigger:
            - "POST /sessions/{C1}/start."
          assert:
            - "Response error_id == ERR_PILE_UNAVAILABLE, http 409."
            - "ChargingSession.status remains PENDING_AUTH (no state change on the session itself)."

      - name: repair_close_requires_fault_isolated
        grounds:
          - state_machines.RepairTicket.AWAITING_ACCEPTANCE_to_CLOSED
          - state_machines.FaultReport
          - entities.FaultReport.fields.status
          - validations[priority=6]
        distinguishing_aspect: |
          Different entity pair (RepairTicket, FaultReport). The RepairTicket AWAITING_ACCEPTANCE→CLOSED
          transition cascades parent FaultReport to RESOLVED, which presumes FaultReport.status == ISOLATED.
          If — through any pathological sequence — FaultReport were already RESOLVED (e.g., raced cleanup),
          the accept must reject with ERR_INVALID_STATE (priority 6, category state). Different entity pair
          from instance 1 (Session/Pile vs RepairTicket/FaultReport).
        test_recipe:
          setup:
            - "Create fault F1 (severity=CRITICAL auto-isolates → status=ISOLATED). Create RepairTicket T1, dispatch, begin, complete (T1.status=AWAITING_ACCEPTANCE)."
            - "Create a SECOND RepairTicket T2 against F1 still in DISPATCHED (parallel ticket pathology)."
            - "Accept T1 (FaultReport flips to RESOLVED, Pile→IDLE)."
            - "Now attempt to drive T2 to closure: dispatch is already past; technician runs begin → complete → accept."
            - "Refined: skip parallel; instead exercise the validation: directly emit a clock advance then accept T1 a SECOND time."
          trigger:
            - "POST /repair-tickets/{T1}/accept (second call after T1 already CLOSED)."
          assert:
            - "Second accept call: error_id == ERR_INVALID_STATE, http 409."
            - "FaultReport.status remains RESOLVED (cross-entity invariant: RepairTicket cannot re-close once parent already RESOLVED)."

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pricing_version_window_overlap_per_operator
        grounds:
          - entities.PricingVersion.fields.effective_from
          - entities.PricingVersion.fields.effective_to
          - validations[priority=13]
          - errors[ERR_PRICING_WINDOW_OVERLAP]
          - concurrency_rules[scenario=pricing_window]
        distinguishing_aspect: |
          Resource = Operator (pricing-versions are partitioned by operator_id). Interval semantics:
          half-open [effective_from, effective_to) across multi-day ISO 8601 datetimes. Aggregate capacity =
          1 (at most one PricingVersion may cover any given instant per operator). Adjacency-touching is
          allowed (effective_to of A == effective_from of B).
        test_recipe:
          setup:
            - "Operator op1 created."
            - "PricingVersion pv1 effective_from=2026-05-01T00:00:00Z effective_to=2026-06-01T00:00:00Z created."
          trigger:
            - "POST /pricing-versions with operator=op1 effective_from=2026-05-15T00:00:00Z effective_to=2026-07-01T00:00:00Z (clear overlap)."
            - "POST /pricing-versions with operator=op1 effective_from=2026-06-01T00:00:00Z effective_to=2026-07-01T00:00:00Z (adjacency touch — should SUCCEED)."
            - "POST /pricing-versions with operator=op1 effective_from=2026-05-31T23:59:59Z effective_to=2026-07-01T00:00:00Z (overlap by 1 second)."
          assert:
            - "Overlapping request 1 → 409 error_id ERR_PRICING_WINDOW_OVERLAP."
            - "Adjacency-touch request 2 → 201, two non-overlapping PricingVersion rows in DB."
            - "Single-second overlap request 3 → 409 ERR_PRICING_WINDOW_OVERLAP (half-open boundary precise)."

      - name: pile_held_reservation_single_capacity
        grounds:
          - entities.Reservation.fields.pile_id
          - entities.Reservation.fields.status
          - concurrency_rules[scenario=Two members reserve]
          - errors[ERR_PILE_ALREADY_RESERVED]
        distinguishing_aspect: |
          Different resource entity (Pile, not Operator) and different interval semantics. Here the
          "interval" is "the duration the reservation is HELD"; the aggregate capacity is 1 HELD reservation
          per pile, but unlike PricingVersion the conflict surface is not a precomputed datetime range — it
          is the live status enum. A second reservation create on the same pile must be rejected as long as
          ANY Reservation with status==HELD exists for that pile, regardless of timing.
        test_recipe:
          setup:
            - "Station, Pile P1 shelved IDLE; Members M1 and M2 both with valid wallet balance and zero strikes."
            - "POST /reservations {pile_id:P1} as M1 → R1 HELD."
          trigger:
            - "POST /reservations {pile_id:P1} as M2 (while R1 still HELD)."
            - "POST /reservations/{R1}/cancel as M1 (R1 now CANCELLED)."
            - "POST /reservations {pile_id:P1} as M2 (retry)."
          assert:
            - "First M2 create: 409 ERR_PILE_ALREADY_RESERVED."
            - "After M1 cancels: M2 retry succeeds, 201, R2.status == HELD."
            - "Invariant: count(Reservation WHERE pile_id=P1 AND status=HELD) <= 1 at every observation."

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_zero_sum_per_counterparty
        grounds:
          - calculations.operator_settlement
          - state_machines.ChargingSession.SETTLING_to_SETTLED
          - state_machines.Payout.ISSUED_to_REVERSED
          - endpoints[POST /_events/emit]
        distinguishing_aspect: |
          Conserved quantity: per-(session_id, counterparty_kind) sum of SettlementLedgerEntry.amount_cents
          MUST equal 0 cents after the refund event applies the refund_reversal variant. The forward action
          is SESSION_SETTLE writing positive rows; the compensating action is REFUND_REVERSAL writing
          negative rows of the same magnitude. The invariant pins per-counterparty zero, NOT just an
          aggregate zero — a bug that writes equal-and-opposite TOTALS while mis-bucketing counterparty would
          satisfy aggregate zero but break the per-counterparty invariant.
        test_recipe:
          setup:
            - "Reuse the SETTLED session from rule 1 instance 1 (non-roaming case)."
            - "Capture pre-refund ledger: STATION_OWNER_SHARE=+262, PLATFORM_SERVICE_FEE=+35, TAX_AUTHORITY=+90."
          trigger:
            - "POST /_events/emit {source_system:PAYMENT, event_type:payment.refunded, payload:{session_id:S1.id}}."
          assert:
            - "sum(SettlementLedgerEntry.amount_cents WHERE session_id=S1 AND counterparty_kind=STATION_OWNER_SHARE) == 0."
            - "sum(SettlementLedgerEntry.amount_cents WHERE session_id=S1 AND counterparty_kind=PLATFORM_SERVICE_FEE) == 0."
            - "sum(SettlementLedgerEntry.amount_cents WHERE session_id=S1 AND counterparty_kind=TAX_AUTHORITY) == 0."
            - "Per-counterparty invariant: each counterparty_kind nets to exactly 0 cents."

      - name: wallet_balance_round_trip_after_refund
        grounds:
          - entities.Member.fields.wallet_balance_cents
          - state_machines.ChargingSession.SETTLING_to_SETTLED
          - endpoints[POST /_events/emit]
        distinguishing_aspect: |
          DIFFERENT conserved quantity (Member.wallet_balance_cents — a per-member cash quantity, not a
          per-counterparty ledger quantity). Forward action: session SETTLED debits wallet by total_cents.
          Compensating action: refund event credits wallet by total_cents. The invariant pins
          Member.wallet_balance_cents AFTER the round trip == Member.wallet_balance_cents BEFORE the session
          ever started. Drift in this quantity (e.g., refunding gross but having debited net) is the bug class.
        test_recipe:
          setup:
            - "Member M1 wallet_balance_cents = 100000 (record pre value)."
            - "Run full session lifecycle from rule 1 instance 1 → ChargingSession.total_cents == 780, wallet decrements to 99220."
          trigger:
            - "POST /_events/emit {source_system:PAYMENT, event_type:payment.refunded, payload:{session_id:S1.id}}."
            - "GET /members/{M1}."
          assert:
            - "Post-settle Member.wallet_balance_cents == 99220 (debited by 780)."
            - "Post-refund Member.wallet_balance_cents == 100000 (credited back by 780 → wallet round-trip invariant)."
            - "Conserved quantity is wallet, not ledger (different type from instance 1)."
