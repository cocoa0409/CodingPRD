              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_ADDRESS_IN_USE"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_conserves_credit_balance
        grounds:
          - state_machines.Invoice.OPEN_to_VOID
          - calculations.invoice_gross
          - calculations.account_balance
