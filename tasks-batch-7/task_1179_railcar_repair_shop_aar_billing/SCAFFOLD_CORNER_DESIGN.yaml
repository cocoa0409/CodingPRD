scaffold_corner_design:
- section: entities
  instances:
  - name: shop_create_applies_config_defaults
    claim_type: defaults
    grounds:
    - entities.Shop.fields.stall_daily_hours
    - entities.Shop.fields.dwell_free_hours
    - entities.Shop.fields.warranty_days
    - entities.Shop.fields.counter_window_days
    distinguishing_aspect: Omitting optional config fields applies the pinned defaults and computes posture OPEN.
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /shops
        payload:
          name: Defaults Shop
          stalls: 3
          dwell_rate_cents_per_hour: 750
        as: ShopAdmin
        captures:
          s: $.data.id
      trigger:
      - call: GET /shops/${s}
        as: Any
      assert:
      - Shop.${s}.stall_daily_hours == 8, dwell_free_hours == 48, warranty_days == 90, counter_window_days == 30
      - Shop.${s}.current_posture == OPEN
      - Shop.${s}.version == 1
  - name: railcar_create_missing_required_car_number
    claim_type: required_fields
    grounds:
    - entities.Railcar.fields.car_number
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: A railcar create missing the required car_number is rejected with ERR_INVALID_REQUEST (400) before any state work.
    test_recipe:
      setup:
      - shop, owner, and handling line exist
      setup_api_calls:
      - call: POST /shops
        payload:
          name: Shop
          stalls: 2
          dwell_rate_cents_per_hour: 500
        as: ShopAdmin
        captures:
          s: $.data.id
      - call: POST /car-owners
        payload:
          shop_id: ${s}
          name: Owner A
          scac_code: OWNA
        as: ShopAdmin
        captures:
          o: $.data.id
      - call: POST /handling-lines
        payload:
          shop_id: ${s}
          name: Line A
          mark: LNA
        as: ShopAdmin
        captures:
          l: $.data.id
      trigger:
      - call: POST /railcars
        payload:
          shop_id: ${s}
          reporting_mark: OWNA
          owner_id: ${o}
          handling_line_id: ${l}
          built_date: '2020-01-15'
        as: YardClerk
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST and http status 400
  - name: work_order_create_invalid_enum_routing
    claim_type: type_constraints
    grounds:
    - entities.WorkOrder.fields.routing
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: routing 'AIR' is not a declared enum member and fails request validation.
    test_recipe:
      setup:
      - shop/owner/line/car exist; completed inspection exists
      setup_api_calls:
      - call: POST /shops
        payload:
          name: Shop
          stalls: 2
          dwell_rate_cents_per_hour: 500
        as: ShopAdmin
        captures:
          s: $.data.id
      - call: POST /car-owners
        payload:
          shop_id: ${s}
          name: Owner A
          scac_code: OWNA
        as: ShopAdmin
        captures:
          o: $.data.id
      - call: POST /handling-lines
        payload:
          shop_id: ${s}
          name: Line A
          mark: LNA
        as: ShopAdmin
        captures:
          l: $.data.id
      - call: POST /railcars
        payload:
          shop_id: ${s}
          reporting_mark: OWNA
          car_number: '2001'
          owner_id: ${o}
          handling_line_id: ${l}
          built_date: '2020-01-15'
        as: YardClerk
        captures:
          car: $.data.id
          car_v: $.data.version
      - call: POST /railcars/${car}/inspections
        payload: {}
        as: CarInspector
        captures:
          insp: $.data.id
      - call: POST /inspections/${insp}/complete
        payload: {}
        as: CarInspector
      trigger:
      - call: POST /work-orders
        payload:
          railcar_id: ${car}
          inspection_id: ${insp}
          routing: AIR
          expected_railcar_version: ${car_v}
        as: RepairForeman
        as_user_id: foreman-1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (invalid enum literal for routing)
  - name: railcar_create_system_status_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Railcar.fields.status
    distinguishing_aspect: 'Client-supplied status: DEPARTED is ignored; the system initial state ARRIVED wins.'
    test_recipe:
      setup:
      - shop/owner/line exist
      setup_api_calls:
      - call: POST /shops
        payload:
          name: Shop
          stalls: 2
          dwell_rate_cents_per_hour: 500
        as: ShopAdmin
        captures:
          s: $.data.id
      - call: POST /car-owners
        payload:
          shop_id: ${s}
          name: Owner A
          scac_code: OWNA
        as: ShopAdmin
        captures:
          o: $.data.id
      - call: POST /handling-lines
        payload:
          shop_id: ${s}
          name: Line A
          mark: LNA
        as: ShopAdmin
        captures:
          l: $.data.id
      trigger:
      - call: POST /railcars
        payload:
          shop_id: ${s}
          reporting_mark: OWNA
          car_number: '2002'
          owner_id: ${o}
          handling_line_id: ${l}
          built_date: '2020-01-15'
          status: DEPARTED
        as: YardClerk
        captures:
          car: $.data.id
      assert:
      - Railcar.${car}.status == ARRIVED (system-managed initial state; client input ignored)
      - Railcar.${car}.arrived_at == 2026-05-01T00:00:00Z (logical clock default when unset)
  - name: railcar_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - validations[priority=5]
    distinguishing_aspect: GET with a well-formed but unknown railcar id returns ERR_NOT_FOUND (404).
    test_recipe:
      setup:
      - one shop exists
      setup_api_calls:
      - call: POST /shops
        payload:
          name: Shop
          stalls: 2
          dwell_rate_cents_per_hour: 500
        as: ShopAdmin
        captures:
          s: $.data.id
      trigger:
      - call: GET /railcars/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: Any
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND and http status 404
  - name: railcar_list_pagination_defaults
    claim_type: listing
    grounds:
    - response_envelope
    distinguishing_aspect: 'List endpoints honor the fixed envelope: default limit 10, offset 0, plus total_count and has_more.'
    test_recipe:
      setup:
      - shop with two registered railcars
      setup_api_calls:
      - call: POST /shops
        payload:
          name: Shop
          stalls: 2
          dwell_rate_cents_per_hour: 500
        as: ShopAdmin
        captures:
          s: $.data.id
      - call: POST /car-owners
        payload:
          shop_id: ${s}
          name: Owner A
          scac_code: OWNA
        as: ShopAdmin
        captures:
          o: $.data.id
      - call: POST /handling-lines
        payload:
          shop_id: ${s}
          name: Line A
          mark: LNA
        as: ShopAdmin
        captures:
          l: $.data.id
      - call: POST /railcars
        payload:
          shop_id: ${s}
          reporting_mark: OWNA
          car_number: '3001'
          owner_id: ${o}
          handling_line_id: ${l}
          built_date: '2020-01-15'
        as: YardClerk
      - call: POST /railcars
        payload:
          shop_id: ${s}
          reporting_mark: OWNA
          car_number: '3002'
          owner_id: ${o}
          handling_line_id: ${l}
          built_date: '2020-02-20'
        as: YardClerk
      trigger:
      - call: GET /railcars
        as: Any
      assert:
      - 'response envelope: response_type == ''array'', total_count == 2, has_more == false, limit == 10, offset == 0'
- section: state_machines
  instances:
  - name: inspection_reopen_locked_by_pending_work_order
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Inspection.COMPLETED_to_REOPENED
    - errors[ERR_INSPECTION_LOCKED]
    distinguishing_aspect: Reopen is rejected while a PENDING_AUTHORIZATION work order references the inspection.
    test_recipe:
      setup:
      - completed inspection; work order created, one line, submitted (PENDING_AUTHORIZATION)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T08:00:00Z'
        as: ShopAdmin
      - call: POST /shops
        payload:
          name: Shop
          stalls: 2
          dwell_rate_cents_per_hour: 500
        as: ShopAdmin
        captures:
          s: $.data.id
      - call: POST /car-owners
        payload:
          shop_id: ${s}
          name: Owner A
          scac_code: OWNA
        as: ShopAdmin
        captures:
          o: $.data.id
      - call: POST /handling-lines
        payload:
          shop_id: ${s}
          name: Line A
          mark: LNA
        as: ShopAdmin
        captures:
          l: $.data.id
      - call: POST /price-master-entries
        payload:
          shop_id: ${s}
          job_code: J-AIR-HOSE
          description: Air hose replacement
          labor_rate_cents_per_hour: 9000
          mobile_labor_rate_cents_per_hour: 11000
          standard_labor_hours: 1.5
          mobile_trip_surcharge_cents: 25000
          mobile_eligible: true
          effective_from: '2026-01-01'
          effective_to: '2026-12-31'
        as: ShopAdmin
      - call: POST /railcars
        payload:
          shop_id: ${s}
          reporting_mark: OWNA
          car_number: '4001'
          owner_id: ${o}
          handling_line_id: ${l}
          built_date: '2020-01-15'
        as: YardClerk
        captures:
          car: $.data.id
          car_v: $.data.version
      - call: POST /railcars/${car}/inspections
        payload: {}
        as: CarInspector
        captures:
          insp: $.data.id
      - call: POST /inspections/${insp}/defects
        payload:
          aar_defect_code: AAR-1204
          defect_group: AIR_HOSE
          cause_code: WEAR
          severity: MAJOR
          location: A-end
        as: CarInspector
        captures:
          d1: $.data.id
      - call: POST /inspections/${insp}/complete
        payload: {}
        as: CarInspector
      - call: POST /work-orders
        payload:
          railcar_id: ${car}
          inspection_id: ${insp}
          routing: SHOP
          expected_railcar_version: ${car_v}
        as: RepairForeman
        as_user_id: foreman-1
        captures:
          wo: $.data.id
      - call: POST /work-orders/${wo}/lines
        payload:
          defect_finding_id: ${d1}
          job_code: J-AIR-HOSE
        as: RepairForeman
        as_user_id: foreman-1
      - call: POST /work-orders/${wo}/submit
        payload: {}
        as: RepairForeman
        as_user_id: foreman-1
      trigger:
      - call: POST /inspections/${insp}/reopen
        payload: {}
        as: RepairForeman
        as_user_id: foreman-1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INSPECTION_LOCKED
      - Inspection.${insp}.status remains COMPLETED
  - name: qa_review_by_creator_returns_segregation_error
    claim_type: precondition_enforcement
    grounds:
    - validations[priority=4]
    - errors[ERR_SEGREGATION_OF_DUTIES]
    distinguishing_aspect: The quality inspector whose X-User-ID equals the work order's created_by_user_id is rejected even though the role is correct.
    test_recipe:
      setup:
      - hose work order authorized, started, completed (in QA_REVIEW); creator was foreman 'foreman-1'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T08:00:00Z'
        as: ShopAdmin
      - call: POST /shops
        payload:
          name: Shop
          stalls: 2
          dwell_rate_cents_per_hour: 500
        as: ShopAdmin
        captures:
          s: $.data.id
      - call: POST /car-owners
        payload:
          shop_id: ${s}
          name: Owner A
          scac_code: OWNA
        as: ShopAdmin
        captures:
          o: $.data.id
      - call: POST /handling-lines
        payload:
          shop_id: ${s}
          name: Line A
          mark: LNA
        as: ShopAdmin
        captures:
          l: $.data.id
      - call: POST /price-master-entries
        payload:
          shop_id: ${s}
          job_code: J-AIR-HOSE
          description: Air hose replacement
          labor_rate_cents_per_hour: 9000
          mobile_labor_rate_cents_per_hour: 11000
          standard_labor_hours: 1.5
          mobile_trip_surcharge_cents: 25000
          mobile_eligible: true
          effective_from: '2026-01-01'
          effective_to: '2026-12-31'
        as: ShopAdmin
      - call: POST /railcars
        payload:
          shop_id: ${s}
          reporting_mark: OWNA
          car_number: '4002'
          owner_id: ${o}
          handling_line_id: ${l}
          built_date: '2020-01-15'
        as: YardClerk
        captures:
          car: $.data.id
          car_v: $.data.version
      - call: POST /railcars/${car}/inspections
        payload: {}
        as: CarInspector
        captures:
          insp: $.data.id
      - call: POST /inspections/${insp}/defects
        payload:
          aar_defect_code: AAR-1204
          defect_group: AIR_HOSE
          cause_code: WEAR
          severity: MAJOR
          location: A-end
        as: CarInspector
        captures:
          d1: $.data.id
      - call: POST /inspections/${insp}/complete
        payload: {}
        as: CarInspector
      - call: POST /work-orders
        payload:
          railcar_id: ${car}
          inspection_id: ${insp}
          routing: SHOP
          expected_railcar_version: ${car_v}
        as: RepairForeman
        as_user_id: foreman-1
        captures:
          wo: $.data.id
      - call: POST /work-orders/${wo}/lines
        payload:
          defect_finding_id: ${d1}
          job_code: J-AIR-HOSE
        as: RepairForeman
        as_user_id: foreman-1
        captures:
          rl: $.data.id
      - call: POST /shop-slots
        payload:
          shop_id: ${s}
          stall_id: S1
          starts_at: '2026-05-02T08:00:00Z'
          ends_at: '2026-05-02T16:00:00Z'
        as: ShopAdmin
        captures:
          slot: $.data.id
      - call: POST /work-orders/${wo}/submit
        payload: {}
        as: RepairForeman
        as_user_id: foreman-1
        captures:
          wo_v: $.data.version
      - call: POST /work-orders/${wo}/authorize
        payload:
          expected_work_order_version: ${wo_v}
        as: CarOwnerRep
        as_user_id: ${o}
      - call: POST /work-orders/${wo}/assign-slot
        payload:
          slot_id: ${slot}
        as: RepairForeman
        as_user_id: foreman-1
      - call: POST /work-orders/${wo}/start
        payload: {}
        as: RepairForeman
        as_user_id: foreman-1
      - call: POST /work-orders/${wo}/complete
        payload:
          line_actuals:
          - repair_line_id: ${rl}
            actual_labor_hours: 1.5
            parts_used: []
        as: RepairForeman
        as_user_id: foreman-1
      trigger:
      - call: POST /work-orders/${wo}/qa-review
        payload:
          result: PASS
        as: QualityInspector
        as_user_id: foreman-1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_SEGREGATION_OF_DUTIES (reviewer id equals created_by_user_id)
      - WorkOrder.${wo}.exec_status remains QA_REVIEW
  - name: depart_from_departed_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.Railcar.READY_FOR_DEPARTURE_to_DEPARTED
    - state_machines.Railcar.ARRIVED_to_DEPARTED
    - errors[ERR_INVALID_STATE_TRANSITION]
    distinguishing_aspect: 'DEPARTED is terminal: a second depart is rejected and dwell_charge_cents is not recomputed.'
    test_recipe:
      setup:
      - railcar arrived 2026-05-01T08:00:00Z, already departed at 2026-05-02T08:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T08:00:00Z'
        as: ShopAdmin
      - call: POST /shops
        payload:
          name: Shop
          stalls: 2
          dwell_rate_cents_per_hour: 500
        as: ShopAdmin
        captures:
          s: $.data.id
      - call: POST /car-owners
        payload:
          shop_id: ${s}
          name: Owner A
          scac_code: OWNA
        as: ShopAdmin
        captures:
          o: $.data.id
      - call: POST /handling-lines
        payload:
          shop_id: ${s}
          name: Line A
          mark: LNA
        as: ShopAdmin
        captures:
          l: $.data.id
      - call: POST /railcars
        payload:
          shop_id: ${s}
          reporting_mark: OWNA
          car_number: '4003'
          owner_id: ${o}
          handling_line_id: ${l}
          built_date: '2020-01-15'
        as: YardClerk
        captures:
          car: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-02T08:00:00Z'
        as: ShopAdmin
      - call: POST /railcars/${car}/depart
        payload: {}
        as: YardClerk
      trigger:
      - call: POST /railcars/${car}/depart
        payload: {}
        as: YardClerk
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE_TRANSITION
      - Railcar.${car}.dwell_charge_cents == 0 (first depart at 24h, under the free window, and not recomputed)
  - name: wheelset_mount_reclaim_cycle_and_condemn_boundaries
    claim_type: valid_transition
    grounds:
    - state_machines.Wheelset.REMOVED_to_IN_STOCK
    - state_machines.Wheelset.REMOVED_to_CONDEMNED
    - state_machines.Wheelset.IN_STOCK_to_MOUNTED
    - calculations.wheelset_condemnation
    - errors[ERR_CAR_NOT_IN_SHOP]
    distinguishing_aspect: Covers the reclaim cycle IN_STOCK -> MOUNTED -> REMOVED -> IN_STOCK plus both condemnation boundaries (flange 28.0 exact is condemned via <=, tread 9.5 exact via >=) and the IN_SHOP
      guard.
    test_recipe:
