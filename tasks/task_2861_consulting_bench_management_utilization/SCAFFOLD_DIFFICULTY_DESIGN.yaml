  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_capacity_on_assignment_confirm
        grounds:
          - validations[priority=9]
          - validations[priority=32]
          - state_machines.Assignment.PROPOSED_to_CANCELLED
          - errors[ERR_ASSIGNMENT_STATE_INVALID]
          - errors[ERR_ALLOCATION_CAPACITY_EXCEEDED]
          - endpoints[POST /assignments/{id}/confirm]
        distinguishing_aspect: |
          Category pair STATE (priority 9) versus BUSINESS_CONSTRAINT (priority 32): the
          cancelled assignment would also blow the 100.00 allocation ceiling, and the response
          must be ERR_ASSIGNMENT_STATE_INVALID, proving the state band is evaluated before the
          capacity band.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group, one CLOUD_ARCH skill, one consultant (cost 120.00, ACTIVE proficiency 4)."
            - "One QUALIFIED, INTERNAL demand for 2.00 FTE, standard 250.00 / requested 240.00, so two 100% assignments may coexist as rows."
            - "Assignment A1 CONFIRMED at 100.00% over [2026-08-03, 2026-08-29) — the consultant is fully allocated."
            - "Assignment A2 created at 100.00% over the identical interval and then CANCELLED while still PROPOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "${sk_id}", proficiency_level: 4 }
              as: ResourceManager
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 2.00, win_probability_pct: 60, start_date: "2026-08-03", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "POST /demand-opportunities/${d1_id}/staffing-mode"
              payload: { staffing_mode: "INTERNAL" }
              as: ResourceManager
            - call: "GET /consultants/${c1_id}"
              payload: {}
              as: ResourceManager
              captures: { c1_v1: $.data.version }
            - call: "POST /assignments"
              payload: { consultant_id: "${c1_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 100.00, start_date: "2026-08-03", end_date: "2026-08-29", category: "BILLABLE", expected_consultant_version: "${c1_v1}" }
              as: ResourceManager
              captures: { a1_id: $.data.id }
            - call: "POST /assignments/${a1_id}/confirm"
              payload: {}
              as: ResourceManager
            - call: "GET /consultants/${c1_id}"
              payload: {}
              as: ResourceManager
              captures: { c1_v2: $.data.version }
            - call: "POST /assignments"
              payload: { consultant_id: "${c1_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 100.00, start_date: "2026-08-03", end_date: "2026-08-29", category: "BILLABLE", expected_consultant_version: "${c1_v2}" }
              as: ResourceManager
              captures: { a2_id: $.data.id }
