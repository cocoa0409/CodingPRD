              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/committee-meetings/${meet_x6_id}/minutes-approve"
              payload: { minutes_doc_ref: "MIN-2026-Q0-005" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/fee-levelization-runs/${run_x6_id}/approve"
              payload: { approving_motion_id: "${motion_lev_id}" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/investment-policy-statements/${ips_e_id}/adopt"
              payload: { approving_motion_id: "${motion_ips_e_id}" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
          assert:
            - "trigger call 1 returned 422 ERR_POOL_FUND_INELIGIBLE because Fund.${fund_lc_a_id}.credit_accrual_status == CLOSED_OUT after the execute retired it; no FeeLevelizationRun row was created and no allocation arithmetic was attempted"
            - "trigger call 2 returned 201 with status DRAFT and the PER_CAPITA figures from calculations.levelized_fee_allocation: PASS 1 accruals are 640000 for LCGRB (800000000 * 8 / 10000) and 200000 for BNDIX (400000000 * 5 / 10000), sum 840000, so eligible_pool_cents == min(250000, 840000) == 250000"
            - "on that same run per_account_cents == 208 (floor(250000 / 1200)), allocated_total_cents == 249600 (208 * 1200), and the two allocation_lines are 190171 (floor(249600 * 640000 / 840000)) and 59428 (floor(249600 * 200000 / 840000))"
            - "remainder_cents == 401: 400 of unallocated pool plus the 1-cent line shortfall (249600 - 190171 - 59428)"
            - "trigger call 9 returned 409 ERR_RECUSAL_REQUIRED — priority 52 — because CommitteeMember.${mem_hr_id}.independence_flag is false and the motion's subject_type is FEE_LEVELIZATION; no affiliated_provider_role comparison is involved and the rejected vote left Motion.${motion_lev_id}.votes with exactly two entries"
            - "trigger call 10 returned 200 with the RECUSE entry appended and recusal_basis stored; the counters are for 2, against 0, abstain 0, recuse 1"
            - "trigger call 11 closed the motion CARRIED: under VOTES_CAST the denominator is for + against + abstain == 2, support_pct == 100.0000 >= 60.00 — the recusal shrinks the denominator instead of counting as opposition"
            - "trigger call 19 returned 409 ERR_CREDIT_POOL_INSUFFICIENT — priority 82 — because credit_pool_cents 250000 exceeds Plan.revenue_credit_balance_cents 0; the run stays DRAFT with its allocation figures unfrozen and approving_motion_id null, while Motion.${motion_lev_id} stays CARRIED"
            - "trigger call 20 returned 400 on IPS-2026-E, whose remediation_trigger_score_max (40.00) equals its watch_trigger_score_max (40.00): the draft was accepted at create because create requires only remediation <= watch, and adopt requires the strict remediation < watch. InvestmentPolicyStatement.${ips_e_id}.status is still DRAFT and InvestmentPolicyStatement.${ips_a_id} is still the plan's only ADOPTED IPS"
            - "SPEC CONFLICT recorded, not asserted: §1.2's adopt precondition names ERR_INVALID_REQUEST (400) for that equal-thresholds case while §1.6 assigns 'remediation_trigger_score_max exceeds watch_trigger_score_max' to ERR_IPS_WEIGHTS_INVALID (also 400). The §1.2 wording is asserted above."
            - "STRUCTURAL NOTE recorded, not asserted: ERR_IPS_WEIGHTS_INVALID appears unreachable on both of its arms. POST /governance/investment-policy-statements rejects a weights set that does not sum to exactly 1.00 with ERR_INVALID_REQUEST, and rejects remediation > watch the same way; there is no PATCH or PUT on an InvestmentPolicyStatement (§1.5's only PATCH is on funds), so no stored IPS can ever hold the weights or the threshold ordering that adopt's two checks are written to catch."
            - "STRUCTURAL NOTE recorded, not asserted: ERR_ALLOCATION_NOT_BALANCED appears unreachable. It is raised only at post, post is declared only from APPROVED, and approve requires credit_pool_cents <= revenue_credit_balance_cents. revenue_credit_accrued_cents is a computed field that no §1.5 endpoint ever increases, so the balance is permanently 0 and the only approvable run is a zero-pool run, where eligible_pool_cents, allocated_total_cents and remainder_cents are all 0 and PASS 3's invariant holds trivially."
            - "SPEC CONFLICT recorded, not asserted: for any non-zero pool the run computed above already violates PASS 3's own invariant — allocated_total_cents + remainder_cents == 249600 + 401 == 250001 != eligible_pool_cents 250000 — because PASS 2's PER_CAPITA branch adds the line shortfall to remainder_cents on top of the unallocated pool. Either the shortfall belongs inside allocated_total_cents or the invariant needs the shortfall term."
            - "STRUCTURAL NOTE recorded, not asserted: ERR_NO_PARTICIPANT_ACCOUNTS is unreachable on this endpoint. Plan.participant_account_count is an input with constraint >= 1, no endpoint can lower it, and priority 90's other two arms answer with ERR_NO_PLAN_ASSETS (provider benchmark) and ERR_NO_ELIGIBLE_VOTERS (motion tally) instead."

      - name: an_engagement_cannot_be_terminated_mid_mapping_and_a_plan_can_never_be_left_without_a_recordkeeper
        claim_type: Violation → Error
        grounds:
          - errors.ERR_RECORDKEEPER_REQUIRED
          - errors.ERR_ENGAGEMENT_HAS_PENDING_MAPPING
          - validations.priority_89
        distinguishing_aspect: "Two structural minimums that are checked against DIFFERENT scopes on the same endpoint: the pending-mapping guard is plan-wide (a single NOTICE_ISSUED proposal freezes termination of every engagement on the plan, including the advisor who has nothing to do with the mapping), while the recordkeeper guard is role-scoped and counts PENDING as well as ACTIVE siblings. Terminating the sole recordkeeper mid-mapping violates both, and because ERR_RECORDKEEPER_REQUIRED has no §1.4 priority row at all it is §1.2's declaration order — recordkeeper check first, pending-mapping second — that decides, not the priority ladder that would otherwise put the priority-89 open-work guard first."
