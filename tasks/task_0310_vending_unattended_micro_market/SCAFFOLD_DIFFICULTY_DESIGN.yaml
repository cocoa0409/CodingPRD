  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_driver_window_half_open_overlap_rejected
        grounds:
          - validations[priority=9]
          - entities.RouteStop.fields.window_start_min
          - entities.RouteStop.fields.window_end_min
          - errors[ERR_DRIVER_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on RouteStop windows for one driver/service_date: a stop
          [500,560) overlaps an existing [480,540) (they share [500,540)) and is rejected, while a
          touching stop [540,600) would be allowed. Interval arithmetic = point-overlap on minutes.
        test_recipe:
          setup:
            - "One ACTIVE driver, one DRAFT route on 2026-06-09 with an existing stop window [480,540) on machine-A."
            - "A second machine-B to host the conflicting stop."
          setup_api_calls:
            - call: "POST /operations/host-sites"
              payload: { name: "Win Host", contact_email: "w@x.com" }
              as: FieldOps
              captures: { host_id: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${host_id}", asset_tag: "M-14", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { machA_id: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${host_id}", asset_tag: "M-15", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { machB_id: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Wendy", employee_code: "EMP14" }
              as: FieldOps
              captures: { drv_id: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${drv_id}", service_date: "2026-06-09T00:00:00Z" }
              as: FieldOps
              captures: { route_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${machA_id}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stopA_id: $.data.id }
          trigger:
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${machB_id}", window_start_min: 500, window_end_min: 560 }
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DRIVER_WINDOW_OVERLAP"

      - name: rto_statement_period_overlap_rejected
        grounds:
          - validations[priority=10]
          - entities.CommissionStatement.fields.period_start
          - entities.CommissionStatement.fields.period_end
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics and different resource entity: CommissionStatement periods for
          one host use half-open date intervals where an existing period_end EQUAL to the new
          period_start is ALLOWED (touching), but a true date-span overlap [2026-06-15,2026-07-15)
          against existing [2026-06-01,2026-07-01) is rejected.
        test_recipe:
          setup:
            - "One ACTIVE host with an existing OPEN statement covering [2026-06-01, 2026-07-01)."
          setup_api_calls:
            - call: "POST /operations/host-sites"
              payload: { name: "Per Host", contact_email: "per@x.com" }
              as: FieldOps
              captures: { host_id: $.data.id }
            - call: "POST /operations/commission-statements"
              payload: { host_site_id: "${host_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FinanceClerk
              captures: { stmt1_id: $.data.id }
          trigger:
            - call: "POST /operations/commission-statements"
              payload: { host_site_id: "${host_id}", period_start: "2026-06-15T00:00:00Z", period_end: "2026-07-15T00:00:00Z" }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_STATEMENT_PERIOD_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_sale_void_conserves_unit_inventory
        grounds:
          - state_machines.Sale.SETTLED_to_VOID
          - entities.InventoryLot.fields.remaining_units
          - entities.PlanogramSlot.fields.on_hand
        distinguishing_aspect: |
          Conserved quantity = total physical units (sum of remaining_units across the slot's lots).
          A sale draws 5 units (on_hand 12->7) and its void restores exactly 5 (on_hand 7->12), so
          the invariant sum(remaining_units) is unchanged before-sale vs after-void: 12 == 12.
        test_recipe:
          setup:
            - "Machine slot stocked with one lot of 12 units (price 100c, non-perishable); record then void a qty-5 cashless sale."
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Inv Host", contact_email: "inv@x.com" }
              as: FieldOps
              captures: { host_id: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "INV", name: "Inv Item", category: "SNACK", unit_cost_cents: 40, shelf_life_days: 0 }
              as: FieldOps
              captures: { prod_id: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${host_id}", asset_tag: "M-16", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mach_id: $.data.id, mach_v0: $.data.version }
            - call: "POST /operations/machines/${mach_id}/slots"
              payload: { product_id: "${prod_id}", slot_code: "N1", capacity: 20, par_level: 20, price_cents: 100 }
              as: FieldOps
              captures: { slot_id: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Ina", employee_code: "EMP16" }
              as: FieldOps
              captures: { drv_id: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${drv_id}", service_date: "2026-06-11T00:00:00Z" }
              as: FieldOps
              captures: { route_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${mach_id}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stop_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stop_id}", counted_lines: [ { slot_id: "${slot_id}", physical_count: 0, refill_units: 12 } ], expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /operations/restock-visits/${visit_id}/reconcile"
              payload: { expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
            - call: "POST /operations/sales"
              payload: { machine_id: "${mach_id}", slot_id: "${slot_id}", quantity: 5, payment_method: "CASHLESS" }
              as: FieldOps
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /operations/sales/${sale_id}/void"
              payload: {}
              as: FieldOps
          assert:
            - "after the qty-5 sale PlanogramSlot.${slot_id}.on_hand == 7"
            - "after void PlanogramSlot.${slot_id}.on_hand == 12 (conserved: equals pre-sale total)"
            - "the consumed lot status is AVAILABLE again with remaining_units == 12"

      - name: ci_cash_sale_void_conserves_vault_cash
        grounds:
          - state_machines.Sale.SETTLED_to_VOID
          - entities.Machine.fields.cash_on_hand_cents
          - entities.Sale.fields.gross_cents
        distinguishing_aspect: |
          Different conserved quantity = Machine.cash_on_hand_cents. A CASH sale raises the vault by
          gross_cents (0->600) and its void lowers it by exactly gross_cents (600->0), leaving the
          cash ledger at its pre-sale value: 0 == 0.
        test_recipe:
          setup:
            - "Machine cash_on_hand 0; slot price 200c stocked 10 units; record then void a qty-3 CASH sale (gross 600)."
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: FieldOps
