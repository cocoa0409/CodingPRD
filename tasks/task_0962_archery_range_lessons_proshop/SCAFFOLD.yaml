scenario: "962. Archery Range, Lessons & Pro-Shop: lane/bay & session, membership & punch-card, equipment rental & fitting, lesson & coach scheduling, target-league/tournament & scoring, safety waiver & minor consent, pro-shop & repair, walk-in vs reserve"
domain_name: archery-range-lessons-proshop
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique login email; unique across all Members" }
      - { name: full_name, type: string, source: input, description: "Legal full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; drives is_minor via logical clock" }
      - { name: tier, type: enum, source: input, description: "Membership tier", default: BASIC, constraints: "one of BASIC, PLUS, ELITE" }
      - { name: guardian_id, type: string, source: input, description: "FK -> Member.id; required at registration when the new member is a minor at the current logical clock; guardian must be an adult Member (is_minor == false)", default: null }
      - { name: is_minor, type: boolean, source: computed, description: "true iff current logical-clock date < date_of_birth + 18 years; a member whose 18th birthday is exactly today is an adult" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: ACTIVE, constraints: "one of ACTIVE, SUSPENDED" }
      - { name: safety_strikes, type: integer, source: system, description: "Count of recorded safety strikes; reaching exactly 3 auto-suspends", default: 0 }
      - { name: wallet_balance_cents, type: integer, source: computed, description: "Prepaid balance in cents; mutated by charges, refunds, admin adjustments", default: 0 }
  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member the waiver covers" }
      - { name: signed_by_member_id, type: string, source: system, description: "FK -> Member.id; X-User-ID of the signer — self for adults, guardian Member for minors" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp at signing" }
      - { name: valid_until, type: string, source: computed, description: "ISO date = signed date + 365 days; waiver is valid through this date inclusive" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: ACTIVE, constraints: "one of ACTIVE, EXPIRED, REVOKED" }
  - name: Lane
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Lane label, unique" }
      - { name: lane_type, type: enum, source: input, description: "Range type", constraints: "one of INDOOR, OUTDOOR" }
      - { name: max_archers, type: integer, source: input, description: "Maximum simultaneous participants per session on this lane; >= 1" }
  - name: RangeSession
    parent: null
    common_fields: true
    fields:
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id; booked lane" }
      - { name: created_by_member_id, type: string, source: system, description: "FK -> Member.id; creator (X-User-ID for Member role, or created_for_member_id when a RangeOfficer books on behalf)" }
      - { name: booking_type, type: enum, source: input, description: "Walk-in vs reserved", constraints: "one of WALK_IN, RESERVATION" }
      - { name: start_at, type: datetime, source: input, description: "Session start (UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Session end (UTC); end_at > start_at; lane occupancy is the half-open interval [start_at, end_at)" }
      - { name: booked_minutes, type: integer, source: computed, description: "(end_at - start_at) in whole minutes" }
      - { name: session_status, type: enum, source: system, description: "Lifecycle dimension 1", default: BOOKED, constraints: "one of BOOKED, CHECKED_IN, CLOSED, CANCELLED, NO_SHOW" }
      - { name: payment_status, type: enum, source: system, description: "Lifecycle dimension 2 (parallel to session_status), derived from participant payments", default: UNPAID, constraints: "one of UNPAID, PAID, REFUNDED" }
      - { name: quoted_charge_cents, type: integer, source: computed, description: "Sum of participants' quoted_fee_cents (forward-looking variant)", default: 0 }
      - { name: final_charge_cents, type: integer, source: computed, description: "Sum of participants' final_fee_cents after close (chronological variant); null until CLOSED", default: null }
      - { name: cancellation_refund_cents, type: integer, source: computed, description: "Total refunded on cancel; null until CANCELLED", default: null }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical-clock timestamp of check-in", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of close", default: null }
  - name: SessionParticipant
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> RangeSession.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the archer; unique per session" }
      - { name: payment_method, type: enum, source: input, description: "How the lane fee is paid", constraints: "one of WALLET, PUNCH_CARD" }
      - { name: punch_card_id, type: string, source: input, description: "FK -> PunchCard.id; required iff payment_method == PUNCH_CARD; must belong to the session creator (creators may pay for guests)", default: null }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Quoted per-participant lane fee at add time (forward-looking variant)", default: 0 }
      - { name: final_fee_cents, type: integer, source: computed, description: "Reconciled fee at session close; null until CLOSED", default: null }
      - { name: status, type: enum, source: system, description: "Participant lifecycle", default: ACTIVE, constraints: "one of ACTIVE, REFUNDED, FORFEITED" }
  - name: PunchCard
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owner (path member)" }
      - { name: punches_total, type: integer, source: input, description: "Pack size purchased", constraints: "one of 5, 10" }
      - { name: punches_used, type: integer, source: system, description: "Punches consumed minus punches restored by cancellation", default: 0 }
      - { name: punches_remaining, type: integer, source: computed, description: "punches_total - punches_used" }
      - { name: price_paid_cents, type: integer, source: computed, description: "punches_total * 1000 * (1 - tier discount of owner at purchase time), round_half_up" }
      - { name: status, type: enum, source: system, description: "ACTIVE until the punch that makes punches_used == punches_total lands, then EXHAUSTED", default: ACTIVE, constraints: "one of ACTIVE, EXHAUSTED" }
  - name: RentalItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Item name" }
      - { name: item_type, type: enum, source: input, description: "Equipment class", constraints: "one of BOW, ARROW_SET, ARMGUARD, RELEASE" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Rental rate per billable day; >= 0" }
      - { name: status, type: enum, source: system, description: "Availability", default: AVAILABLE, constraints: "one of AVAILABLE, RENTED" }
  - name: RentalAgreement
    parent: null
    common_fields: true
    fields:
      - { name: rental_item_id, type: string, source: input, description: "FK -> RentalItem.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; renter" }
      - { name: session_id, type: string, source: input, description: "FK -> RangeSession.id; optional linked session — cascade target on session cancel", default: null }
      - { name: draw_length_in, type: number, source: input, description: "Fitting: draw length in inches, 14.0..32.0 in 0.5 steps" }
      - { name: draw_weight_lb, type: integer, source: input, description: "Fitting: draw weight in pounds, 10..70" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical-clock timestamp of agreement creation" }
      - { name: due_date, type: string, source: input, description: "ISO date the item is due back" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock timestamp of return", default: null }
      - { name: returned_condition, type: enum, source: input, description: "Condition assessed at return", constraints: "one of GOOD, DAMAGED", default: null }
      - { name: damage_fee_cents, type: integer, source: input, description: "Damage fee assessed at return; must be 0 when condition GOOD, > 0 when DAMAGED", default: 0 }
      - { name: status, type: enum, source: system, description: "Lifecycle", default: OPEN, constraints: "one of OPEN, RETURNED, SETTLED, VOIDED" }
      - { name: settlement_total_cents, type: integer, source: computed, description: "rental charge + late fee + damage fee computed at settle; null until SETTLED", default: null }
  - name: Coach
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Coach name" }
      - { name: disciplines, type: array, source: input, description: "Non-empty array of discipline enums the coach is certified for", constraints: "items one of RECURVE, COMPOUND, TRADITIONAL" }
      - { name: status, type: enum, source: system, description: "ACTIVE coaches may confirm lessons; INACTIVE may not", default: ACTIVE, constraints: "one of ACTIVE, INACTIVE" }
  - name: Lesson
    parent: null
    common_fields: true
    fields:
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; requesting student (X-User-ID)" }
      - { name: discipline, type: enum, source: input, description: "Lesson discipline; must be in coach.disciplines", constraints: "one of RECURVE, COMPOUND, TRADITIONAL" }
      - { name: proposed_start_at, type: datetime, source: input, description: "Currently proposed start (UTC); overwritten by each counter" }
      - { name: duration_minutes, type: integer, source: input, description: "Lesson length", default: 60, constraints: "30..120" }
      - { name: fee_cents, type: integer, source: computed, description: "6000 * ceil(duration_minutes/60) * (1 - member tier discount), round_half_up; debited from member wallet when the lesson enters CONFIRMED" }
      - { name: status, type: enum, source: system, description: "Lifecycle with REQUESTED<->COUNTERED negotiation cycle", default: REQUESTED, constraints: "one of REQUESTED, COUNTERED, CONFIRMED, COMPLETED, CANCELLED" }
  - name: League
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "League name" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Fee per entry, debited from entrant wallet at entry; >= 0" }
      - { name: max_entries, type: integer, source: input, description: "Entry cap; >= 1" }
      - { name: status, type: enum, source: system, description: "Lifecycle", default: OPEN, constraints: "one of OPEN, CLOSED, COMPLETED, CANCELLED" }
      - { name: gross_entry_fees_cents, type: integer, source: computed, description: "Sum of fee_paid_cents over entries with status CONFIRMED", default: 0 }
      - { name: range_share_cents, type: integer, source: computed, description: "round_half_up(gross_entry_fees_cents * 0.15) — computed FROM GROSS, never from prize_pool (pinned evaluation order)", default: 0 }
      - { name: prize_pool_cents, type: integer, source: computed, description: "gross_entry_fees_cents - range_share_cents", default: 0 }
  - name: LeagueEntry
    parent: null
    common_fields: true
    fields:
      - { name: league_id, type: string, source: system, description: "FK -> League.id (path)" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; entrant (X-User-ID); unique per league" }
      - { name: fee_paid_cents, type: integer, source: computed, description: "League.entry_fee_cents captured at entry time" }
      - { name: status, type: enum, source: system, description: "Lifecycle", default: CONFIRMED, constraints: "one of CONFIRMED, CANCELLED" }
      - { name: refund_status, type: enum, source: system, description: "REFUNDED once the league-cancel cascade credits the wallet", default: NONE, constraints: "one of NONE, REFUNDED" }
  - name: ScoreCard
    parent: null
    common_fields: true
    fields:
      - { name: league_entry_id, type: string, source: system, description: "FK -> LeagueEntry.id (path)" }
      - { name: ends, type: array, source: input, description: "Exactly 10 ends; each end is an array of exactly 3 arrow scores, each integer 0..10" }
      - { name: x_hits, type: integer, source: input, description: "Count of inner-ten arrows, 0..30; scratch tie-break" }
      - { name: total_points, type: integer, source: computed, description: "Sum of all arrow scores (input total_points is ignored if sent)" }
      - { name: status, type: enum, source: system, description: "Lifecycle with VERIFIED->DISPUTED->SUBMITTED correction cycle", default: SUBMITTED, constraints: "one of SUBMITTED, VERIFIED, DISPUTED, LOCKED" }
  - name: ShopProduct
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: sku, type: string, source: input, description: "Unique SKU" }
      - { name: unit_price_cents, type: integer, source: input, description: "Unit price; >= 0" }
      - { name: stock_quantity, type: integer, source: system, description: "On-hand minus sold minus repair-reserved; >= 0 enforced", default: 0 }
      - { name: initial_stock, type: integer, source: input, description: "Starting stock; sets stock_quantity at creation" }
  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; optional member purchase (tier discounts do NOT apply to pro-shop sales)", default: null }
      - { name: items, type: array, source: input, description: "Non-empty array of line items; each { product_id (references ShopProduct.id), qty (integer >= 1), line_discount_pct (number 0..0.9, default 0) }" }
      - { name: line_gross_cents, type: array, source: computed, description: "Per-line round_half_up(qty * unit_price_cents * (1 - line_discount_pct)), in input order" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_gross_cents (per-line rounding THEN sum — pinned order)" }
      - { name: volume_discount_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * 0.10) iff subtotal_cents >= 10000, else 0" }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up((subtotal_cents - volume_discount_cents) * 0.0825)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - volume_discount_cents + tax_cents" }
  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; equipment owner" }
      - { name: item_description, type: string, source: input, description: "Free-text description of the equipment and fault" }
      - { name: status, type: enum, source: system, description: "Lifecycle with approve/decline branch at QUOTED", default: INTAKE, constraints: "one of INTAKE, QUOTED, IN_REPAIR, DECLINED, READY, PICKED_UP" }
      - { name: parts_reserved, type: array, source: input, description: "Quoted parts; each { product_id (references ShopProduct.id), qty (integer >= 1) }; stock is reserved while status is QUOTED or IN_REPAIR", default: [] }
      - { name: labor_minutes, type: integer, source: input, description: "Quoted labor minutes; > 0", default: null }
      - { name: promised_hours, type: integer, source: input, description: "Hours until promised completion from quote time; < 48 triggers rush fee", default: null }
      - { name: parts_total_cents, type: integer, source: computed, description: "Sum of qty * ShopProduct.unit_price_cents at quote time", default: null }
      - { name: labor_total_cents, type: integer, source: computed, description: "ceil(labor_minutes/30) * 1500, tier-discounted, plus 25% rush fee when promised_hours < 48", default: null }
      - { name: quote_total_cents, type: integer, source: computed, description: "parts_total_cents + labor_total_cents", default: null }

state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{id}/safety-strikes when the strike makes safety_strikes == 3"
        actor: system
        preconditions: ["member.status == ACTIVE", "safety_strikes == 2 before this strike"]
        side_effects:
          - "safety_strikes increments to 3, status flips to SUSPENDED"
          - "cascade hop 1: every RangeSession with created_by_member_id == this member, session_status == BOOKED, and start_at > current logical clock transitions to CANCELLED (system cancel — always full refund)"
          - "cascade hop 2: each such cancellation itself voids that session's RentalAgreements with status == OPEN (transition to VOIDED)"
          - "cascade hop 3: each VOIDED agreement releases its RentalItem back to AVAILABLE"
          - "each system-cancelled session refunds participants in full (wallet credit and/or punch restore) and sets payment_status REFUNDED when any refund occurred"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{id}/reinstate"
        actor: RangeOfficer
        preconditions: ["member.status == SUSPENDED"]
        side_effects: ["safety_strikes resets to 0"]
  - entity: Waiver
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep executed inside POST /_clock/set_current_utc when current date > valid_until (valid through valid_until inclusive)"
        actor: system
        preconditions: ["status == ACTIVE", "current logical-clock date > valid_until"]
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /waivers/{id}/revoke"
        actor: Admin
        preconditions: ["status == ACTIVE"]
        side_effects: []
      - from: EXPIRED
        to: REVOKED
        trigger: "POST /waivers/{id}/revoke"
        actor: Admin
        preconditions: ["status == EXPIRED"]
        side_effects: []
  - entity: RangeSession
    initial_state: BOOKED
    terminal_states: [CLOSED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /range-sessions/{id}/check-in"
        actor: RangeOfficer
        preconditions:
          - "session_status == BOOKED"
          - "current logical clock >= start_at and <= start_at + 15 minutes"
          - "at least one SessionParticipant with status == ACTIVE"
          - "every SessionParticipant with status == ACTIVE belongs to a Member with status == ACTIVE who holds a Waiver with status == ACTIVE (cross-entity gate)"
        side_effects: ["checked_in_at = current logical clock"]
      - from: CHECKED_IN
        to: CLOSED
        trigger: "POST /range-sessions/{id}/close"
        actor: RangeOfficer
        preconditions: ["session_status == CHECKED_IN", "current logical clock > checked_in_at"]
        side_effects:
          - "closed_at = current logical clock"
          - "recompute each ACTIVE participant's final_fee_cents via session_participant_fee FINAL variant (chronological, metered)"
          - "set final_charge_cents = sum of final_fee_cents"
          - "reconcile wallets: credit/debit (final_fee_cents - quoted_fee_cents) per WALLET participant; payment_status stays/becomes PAID"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /range-sessions/{id}/cancel (voluntary) or Member-suspension cascade (system)"
        actor: Member | RangeOfficer | system
        preconditions: ["session_status == BOOKED"]
        side_effects:
          - "voluntary: refund per cancellation_refund (100% when notice >= 24h, 50% when 4h <= notice < 24h, 0% below 4h); system: always 100%"
          - "punch-paid participants: punch restored to the card (punches_used decremented, EXHAUSTED card reactivates to ACTIVE) iff notice >= 4h or system cancel; otherwise punch FORFEITED"
          - "cancellation_refund_cents set; payment_status = REFUNDED when refund > 0"
          - "cascade: this session's RentalAgreements with status == OPEN transition to VOIDED, and each VOIDED agreement releases its RentalItem to AVAILABLE"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system sweep inside POST /_clock/set_current_utc when current clock > start_at + 15 minutes and session never checked in"
        actor: system
        preconditions: ["session_status == BOOKED", "current logical clock > start_at + 15 minutes"]
        side_effects:
          - "all quoted fees forfeited: WALLET participants keep the debit (status FORFEITED), punch-paid participants lose the punch (status FORFEITED, no restore)"
          - "cascade: OPEN RentalAgreements linked to this session transition to VOIDED; each VOIDED agreement releases its RentalItem to AVAILABLE"
    note: "payment_status (UNPAID/PAID/REFUNDED) is a parallel dimension: BOOKED with all participants paid -> PAID; CANCELLED/NO_SHOW with refunds -> REFUNDED; evolves independently of session_status."
  - entity: SessionParticipant
    initial_state: ACTIVE
    terminal_states: [REFUNDED, FORFEITED]
    transitions:
      - from: ACTIVE
        to: REFUNDED
        trigger: "parent RangeSession cancellation with refund > 0 or punch restore"
        actor: system
        preconditions: ["parent session transitioned BOOKED -> CANCELLED"]
        side_effects: ["wallet credit or punch restore per cancellation_refund rules"]
      - from: ACTIVE
        to: FORFEITED
        trigger: "parent RangeSession NO_SHOW sweep, or voluntary cancel with notice < 4h"
        actor: system
        preconditions: ["parent session transitioned out of BOOKED without full refund eligibility"]
        side_effects: []
  - entity: PunchCard
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "participant add consuming the punch that makes punches_used == punches_total (boundary: exactly equal, not greater)"
        actor: system
        preconditions: ["punches_used == punches_total after the consume"]
        side_effects: []
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "cancellation punch-restore decrementing punches_used below punches_total"
        actor: system
        preconditions: ["a restored punch brings punches_used < punches_total"]
        side_effects: []
  - entity: RentalItem
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RENTED
        trigger: "POST /rental-agreements creation against this item"
        actor: system
        preconditions: ["status == AVAILABLE"]
        side_effects: []
      - from: RENTED
        to: AVAILABLE
        trigger: "POST /rental-agreements/{id}/return, or VOIDED cascade from session cancel / no-show / member suspension"
        actor: RangeOfficer | system
        preconditions: ["status == RENTED"]
        side_effects: []
  - entity: RentalAgreement
    initial_state: OPEN
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: OPEN
        to: RETURNED
        trigger: "POST /rental-agreements/{id}/return"
        actor: RangeOfficer
        preconditions: ["status == OPEN"]
        side_effects: ["returned_at = current logical clock", "linked RentalItem transitions RENTED -> AVAILABLE"]
      - from: RETURNED
        to: SETTLED
        trigger: "POST /rental-agreements/{id}/settle"
        actor: RangeOfficer
        preconditions: ["status == RETURNED", "member.wallet_balance_cents >= settlement_total_cents"]
        side_effects: ["compute settlement_total_cents via rental_settlement", "debit member wallet by settlement_total_cents"]
      - from: OPEN
        to: VOIDED
        trigger: "cascade: linked RangeSession CANCELLED or NO_SHOW, or renter Member suspension"
        actor: system
        preconditions: ["status == OPEN", "linked session left BOOKED or renter suspended"]
        side_effects: ["linked RentalItem transitions RENTED -> AVAILABLE", "no charges"]
  - entity: Coach
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /coaches/{id}/deactivate"
        actor: Admin
        preconditions: ["status == ACTIVE"]
        side_effects: []
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /coaches/{id}/activate"
        actor: Admin
        preconditions: ["status == INACTIVE"]
        side_effects: []
  - entity: Lesson
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /lessons/{id}/confirm"
        actor: Coach
        preconditions:
          - "status == REQUESTED"
          - "acting coach is the lesson's coach (X-User-ID == lesson.coach_id)"
          - "coach.status == ACTIVE (cross-entity gate)"
          - "no confirmed-lesson overlap for this coach under the buffered-interval rule (gap >= 15 minutes on both sides)"
          - "member.wallet_balance_cents >= fee_cents"
        side_effects: ["debit member wallet by fee_cents"]
      - from: REQUESTED
        to: COUNTERED
        trigger: "POST /lessons/{id}/counter by the coach with a new proposed_start_at"
        actor: Coach
        preconditions: ["status == REQUESTED", "acting coach is the lesson's coach", "coach.status == ACTIVE"]
        side_effects: ["proposed_start_at overwritten with the countered time"]
      - from: COUNTERED
        to: REQUESTED
        trigger: "POST /lessons/{id}/counter by the member with a new proposed_start_at (negotiation cycle)"
        actor: Member
        preconditions: ["status == COUNTERED", "acting member is the lesson's member"]
        side_effects: ["proposed_start_at overwritten with the member's re-proposal"]
      - from: COUNTERED
        to: CONFIRMED
        trigger: "POST /lessons/{id}/accept by the member"
        actor: Member
        preconditions:
          - "status == COUNTERED"
          - "acting member is the lesson's member"
          - "coach.status == ACTIVE"
          - "no confirmed-lesson overlap under the buffered-interval rule"
          - "member.wallet_balance_cents >= fee_cents"
        side_effects: ["debit member wallet by fee_cents"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /lessons/{id}/complete"
        actor: Coach
        preconditions: ["status == CONFIRMED", "current logical clock >= proposed_start_at"]
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /lessons/{id}/cancel"
        actor: Member | Coach
        preconditions: ["status == REQUESTED"]
        side_effects: []
      - from: COUNTERED
        to: CANCELLED
        trigger: "POST /lessons/{id}/cancel"
        actor: Member | Coach
        preconditions: ["status == COUNTERED"]
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /lessons/{id}/cancel"
        actor: Member | Coach
        preconditions: ["status == CONFIRMED"]
        side_effects: ["refund fee_cents in full to member wallet iff current logical clock < proposed_start_at; zero refund otherwise"]
  - entity: League
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /leagues/{id}/close"
        actor: LeagueDirector
        preconditions: ["status == OPEN", "at least one LeagueEntry with status == CONFIRMED"]
        side_effects: ["scoring phase begins: scorecards may now be submitted"]
      - from: CLOSED
        to: COMPLETED
        trigger: "system auto-transition when every submitted ScoreCard of every CONFIRMED entry is LOCKED and each CONFIRMED entry has at least one ScoreCard"
        actor: system
        preconditions: ["status == CLOSED", "all scorecards LOCKED, no CONFIRMED entry without a scorecard"]
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /leagues/{id}/cancel"
        actor: LeagueDirector
        preconditions: ["status == OPEN"]
        side_effects:
          - "cascade hop 1: every LeagueEntry of this league with status == CONFIRMED transitions to CANCELLED"
          - "cascade hop 2: each cancelled entry credits fee_paid_cents to its Member's wallet and sets refund_status = REFUNDED"
          - "recompute gross_entry_fees_cents / range_share_cents / prize_pool_cents (all become 0 once no CONFIRMED entries remain)"
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /leagues/{id}/cancel"
        actor: LeagueDirector
        preconditions: ["status == CLOSED", "no ScoreCard of any entry is LOCKED"]
        side_effects: ["same two-hop refund cascade as OPEN -> CANCELLED"]
  - entity: LeagueEntry
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "cascade from POST /leagues/{id}/cancel"
        actor: system
        preconditions: ["status == CONFIRMED"]
        side_effects: ["credit member wallet by fee_paid_cents", "refund_status = REFUNDED"]
  - entity: ScoreCard
    initial_state: SUBMITTED
    terminal_states: [LOCKED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /scorecards/{id}/verify"
        actor: LeagueDirector
        preconditions: ["status == SUBMITTED", "parent LeagueEntry status == CONFIRMED (cross-entity gate)"]
        side_effects: []
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /scorecards/{id}/dispute"
        actor: LeagueDirector
        preconditions: ["status == VERIFIED"]
        side_effects: []
      - from: DISPUTED
        to: SUBMITTED
        trigger: "PUT /scorecards/{id} correction (OCC-guarded)"
        actor: Member
        preconditions: ["status == DISPUTED", "acting member owns the parent LeagueEntry", "expected_scorecard_version matches current version"]
        side_effects: ["total_points recomputed from new ends", "version increments"]
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "PUT /scorecards/{id} edit before verification (OCC-guarded self-transition)"
        actor: Member
        preconditions: ["status == SUBMITTED", "acting member owns the parent LeagueEntry", "expected_scorecard_version matches current version"]
        side_effects: ["total_points recomputed", "version increments"]
      - from: VERIFIED
        to: LOCKED
        trigger: "POST /scorecards/{id}/lock"
        actor: LeagueDirector
        preconditions: ["status == VERIFIED"]
        side_effects: ["may trigger League CLOSED -> COMPLETED auto-transition"]

concurrency_rules:
  - rule_id: scorecard-correction-stale-version
    parent_entity: ScoreCard
    write_endpoint: "PUT /scorecards/{id}"
    occ_field: "expected_scorecard_version"
    description: |
      A ScoreCard correction/edit whose expected_scorecard_version does not match
      the card's current version is rejected. This captures the case where another
      writer has just edited the card (which legitimately supersedes the prior
      content under the correction-cycle rules) and the current writer's view of
      the card is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: repair-quote-stale-version
    parent_entity: RepairOrder
    write_endpoint: "POST /repair-orders/{id}/quote"
    occ_field: "expected_repair_order_version"
    description: |
      Posting a quote against a RepairOrder whose version has advanced since the
      client last observed it is rejected, because the newer quote legitimately
      supersedes the older one and the stale writer must re-read before quoting.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: session_participant_fee
    trigger: "QUOTED variant: on POST /range-sessions and on POST /range-sessions/{id}/participants. FINAL variant: on POST /range-sessions/{id}/close."
    algorithm: tiered_pricing
    formula: |
      constants: BLOCK_MINUTES=30, BASE_RATE=1200 cents/block, PEAK_MULTIPLIER=1.25
        (peak iff start_at UTC hour in [17,20] inclusive), TIER_DISCOUNT BASIC=0.00,
        PLUS=0.10, ELITE=0.20, WALK_IN_SURCHARGE=300, MIN_CHARGE=1200.
      QUOTED (forward-looking):
        blocks = ceil(booked_minutes / 30)
        base = 1200 * blocks
        peaked = round_half_up(base * 1.25) if peak else base
        discounted = round_half_up(peaked * (1 - tier_discount_of_PARTICIPANT_member))
        fee = max(discounted, 1200)
        if booking_type == WALK_IN: fee = fee + 300   # surcharge added AFTER floor
      FINAL (chronological, metered):
        actual_minutes = ceil((closed_at - checked_in_at) seconds / 60)
        blocks = ceil(actual_minutes / 30)
        base = 1200 * blocks
        peaked = round_half_up(base * 1.25) if peak else base   # peak keyed on session start_at
        discounted = round_half_up(peaked * (1 - tier_discount))
        fee = max(discounted, 1200)   # no walk-in surcharge in FINAL
      Punch-paid participants: quoted and final fee recorded for reporting, but no wallet movement.
    input_set: "The session's booking_type, start_at, booked_minutes; participant member's tier. FINAL uses checked_in_at/closed_at. Sessions in CANCELLED/NO_SHOW keep QUOTED only."
    constants:
      BLOCK_MINUTES: 30
      BASE_RATE_CENTS: 1200
      PEAK_MULTIPLIER: 1.25
      PEAK_HOURS_UTC: [17, 18, 19, 20]
      TIER_DISCOUNT: { BASIC: 0.00, PLUS: 0.10, ELITE: 0.20 }
      WALK_IN_SURCHARGE_CENTS: 300
      MIN_CHARGE_CENTS: 1200
    precision: "integer cents, round_half_up at each marked step"
    variants:
      - name: QUOTED
        when: "booking time / participant add"
        difference: "metered on booked_minutes; applies walk-in surcharge after the min-charge floor"
      - name: FINAL
        when: "session close"
        difference: "metered on actual checked-in minutes; never applies walk-in surcharge; floor still applies"
  - name: sale_total
    trigger: "POST /sales"
    algorithm: tiered_pricing
    formula: |
      (1) per line: line_gross = round_half_up(qty * unit_price_cents * (1 - line_discount_pct))
      (2) subtotal = sum(line_gross)            # per-line rounding THEN sum — pinned
      (3) volume_discount = round_half_up(subtotal * 0.10) iff subtotal >= 10000 else 0
      (4) taxable_base = subtotal - volume_discount
      (5) tax = round_half_up(taxable_base * 0.0825)
      (6) total = taxable_base + tax
      Stock: decrement ShopProduct.stock_quantity by qty per line; any line with
      insufficient stock rejects the whole sale (no partial sale).
    input_set: "Sale.items in input order; ShopProduct.unit_price_cents at sale time"
    constants:
      VOLUME_THRESHOLD_CENTS: 10000
      VOLUME_DISCOUNT_PCT: 0.10
      TAX_RATE: 0.0825
    precision: "integer cents, round_half_up; nested rounding order pinned as steps (1)->(2)->(3)->(5)"
  - name: league_prize_pool
    trigger: "recomputed on every LeagueEntry creation and on league-cancel cascade"
    algorithm: aggregation
    formula: |
      Evaluation order is pinned to break the apparent circularity
      (share looks like it could be a percentage of the pool, and pool = gross - share):
      (1) gross = sum(fee_paid_cents) over entries with status == CONFIRMED
      (2) range_share = round_half_up(gross * 0.15)      # FROM GROSS, never from pool
      (3) prize_pool = gross - range_share
    input_set: "LeagueEntry rows of this league with status == CONFIRMED only (CANCELLED excluded)"
    constants:
      RANGE_SHARE_PCT: 0.15
    precision: "integer cents, round_half_up"
  - name: league_standings
    trigger: "GET /leagues/{id}/standings"
    algorithm: weighted_scoring
    formula: |
      Only ScoreCards with status == LOCKED of entries with status == CONFIRMED count.
      handicap_index(entry) = round_half_up(1.2 * max(0, 300 - avg_locked_points))
        where avg_locked_points = round_half_up(mean of the entry's LOCKED total_points).
      SCRATCH variant: rank by sum(total_points) DESC; tie -> x_hits sum DESC;
        tie -> earliest first-LOCKED-card created_at ASC.
      HANDICAP variant: adjusted = sum(total_points) + handicap_index;
        rank by adjusted DESC; tie -> sum(total_points) DESC; tie -> x_hits DESC;
        tie -> earliest first-LOCKED-card created_at ASC.
    input_set: "ScoreCards status == LOCKED whose LeagueEntry status == CONFIRMED"
    constants:
      PAR: 300
      HANDICAP_FACTOR: 1.2
    precision: "integer points, round_half_up for avg and handicap"
    variants:
      - name: SCRATCH
        when: "variant=SCRATCH (default)"
        difference: "raw total_points ranking, no handicap"
      - name: HANDICAP
        when: "variant=HANDICAP"
        difference: "adds handicap_index; can reorder standings vs SCRATCH for identical scorecards"
  - name: cancellation_refund
    trigger: "POST /range-sessions/{id}/cancel (voluntary)"
    algorithm: threshold
    formula: |
      notice = start_at - current logical clock
      notice >= 24h  -> refund 100% of quoted fees (wallet credit / punch restore)
      4h <= notice < 24h -> refund 50% (round_half_up per participant); punch restored
      notice < 4h -> refund 0; punch FORFEITED
      System cancels (suspension cascade) always refund 100% and restore punches.
      Boundary: exactly 24h is full; exactly 4h is 50%.
    input_set: "SessionParticipants of the session with status == ACTIVE"
    constants:
      FULL_REFUND_HOURS: 24
      PARTIAL_REFUND_HOURS: 4
    precision: "integer cents, round_half_up per participant"
  - name: rental_settlement
    trigger: "POST /rental-agreements/{id}/settle"
    algorithm: aggregation
    formula: |
      billable_days = max(1, (return date - checkout date) in whole UTC calendar days)
      rental_charge = billable_days * RentalItem.daily_rate_cents
      late_days = max(0, (return date - due_date) in whole UTC calendar days)  # started-day granularity at day resolution
      late_fee = late_days * 500
      settlement_total = rental_charge + late_fee + damage_fee_cents
    input_set: "The agreement's checked_out_at/returned_at (dates), due_date, damage_fee_cents, item daily_rate_cents"
    constants:
      LATE_FEE_CENTS_PER_DAY: 500
    precision: "integer cents"
  - name: repair_quote_total
    trigger: "POST /repair-orders/{id}/quote"
    algorithm: tiered_pricing
    formula: |
      parts_total = sum(qty * ShopProduct.unit_price_cents) over parts_reserved (prices at quote time)
      labor_blocks = ceil(labor_minutes / 30)
      labor = labor_blocks * 1500
      labor_discounted = round_half_up(labor * (1 - tier_discount_of_owner_member))
      rush_fee = round_half_up(labor_discounted * 0.25) iff promised_hours < 48 else 0
      labor_total = labor_discounted + rush_fee
      quote_total = parts_total + labor_total
      Side effect: decrement ShopProduct.stock_quantity by reserved qty (held until decline or pickup).
    input_set: "parts_reserved, labor_minutes, promised_hours, owner member tier; ShopProduct prices/stock at quote time"
    constants:
      LABOR_BLOCK_MINUTES: 30
      LABOR_BLOCK_CENTS: 1500
      RUSH_THRESHOLD_HOURS: 48
      RUSH_PCT: 0.25
    precision: "integer cents, round_half_up at each marked step"
  - name: lesson_fee
    trigger: "POST /lessons (fee_cents computed at request time from member tier)"
    algorithm: tiered_pricing
    formula: |
      fee_cents = round_half_up(6000 * ceil(duration_minutes / 60) * (1 - tier_discount_of_member))
    input_set: "lesson duration_minutes, member tier at request time"
    constants:
      LESSON_HOUR_CENTS: 6000
    precision: "integer cents, round_half_up"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted on endpoint per §1.5; entity-backed ownership (Member/Coach may only act on own resources: member X-User-ID equals the target member id / resource owner / lesson member; coach X-User-ID equals lesson.coach_id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path ids resolve left-to-right (member, lane, session, participant, punch card, rental item/agreement, coach, lesson, league, entry, scorecard, product, sale, repair order, waiver)"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids (use the specific ERR_*_NOT_FOUND per leftmost unresolvable segment)"
  - priority: 4
    category: business_constraint
    check: "request shape: required fields present, enum values valid, ranges respected (max_archers >= 1, draw_length 14.0..32.0 in 0.5 steps, punches_total in {5,10}, ends exactly 10x3 with arrows 0..10, end_at > start_at)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 5
    category: state
    check: "state-machine precondition of the target transition (session BOOKED for cancel/check-in/participant-add, CHECKED_IN for close; lesson in the required from-state; scorecard editable; league OPEN for entries; repair order in QUOTED for approve/decline, etc.); member.status == ACTIVE for purchases and bookings"
    error_id: ERR_SESSION_NOT_BOOKED
    http_status: 409
    applies_to: "action endpoints (use the specific state error: ERR_SESSION_NOT_BOOKED, ERR_SESSION_ALREADY_CLOSED, ERR_LESSON_NOT_ACTIONABLE, ERR_SCORECARD_NOT_EDITABLE, ERR_SCORECARD_LOCKED, ERR_REPAIR_INVALID_STATE, ERR_RENTAL_INVALID_STATE, ERR_WAIVER_NOT_REVOKABLE, ERR_LEAGUE_NOT_OPEN, ERR_MEMBER_NOT_SUSPENDED, ERR_MEMBER_SUSPENDED, ERR_COACH_INACTIVE)"
  - priority: 6
    category: business_safety
    check: "waiver & consent: actor/target member holds a Waiver with status == ACTIVE (ERR_WAIVER_MISSING if none ever signed, ERR_WAIVER_EXPIRED if latest is EXPIRED/REVOKED); minors may not sign own waiver (ERR_MINOR_GUARDIAN_REQUIRED) and guardian signer must be an adult (ERR_GUARDIAN_NOT_ADULT)"
    error_id: ERR_WAIVER_MISSING
    http_status: 422
    applies_to: "POST /members/{id}/waivers, POST /range-sessions, POST /range-sessions/{id}/participants, POST /range-sessions/{id}/check-in, POST /rental-agreements, POST /lessons, POST /leagues/{id}/entries"
  - priority: 7
    category: business_constraint
    check: "resource constraints: lane half-open overlap (ERR_LANE_OVERLAP), lane capacity max_archers (ERR_LANE_CAPACITY_EXCEEDED), coach buffered-interval overlap (ERR_COACH_OVERLAP), lesson discipline in coach.disciplines (ERR_DISCIPLINE_MISMATCH), league entry uniqueness per member (ERR_DUPLICATE_LEAGUE_ENTRY), league max_entries (ERR_LEAGUE_FULL)"
    error_id: ERR_LANE_OVERLAP
    http_status: 409
    applies_to: "booking, participant-add, lesson confirm/accept, league entry endpoints"
  - priority: 8
    category: business_temporal
    check: "booking windows: RESERVATION start_at >= now + 120 minutes; WALK_IN start_at on the same UTC date as now and end_at > now; check-in window [start_at, start_at+15min]; cancel/complete clock rules"
    error_id: ERR_BOOKING_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /range-sessions, POST /range-sessions/{id}/check-in"
  - priority: 9
    category: business_referential
    check: "resource availability: rental item AVAILABLE (ERR_RENTAL_ITEM_UNAVAILABLE), shop stock sufficient for sale lines or quote parts (ERR_INSUFFICIENT_STOCK), punch card exists, belongs to session creator, is ACTIVE with punches_remaining >= 1 (ERR_PUNCH_CARD_EXHAUSTED)"
    error_id: ERR_RENTAL_ITEM_UNAVAILABLE
    http_status: 422
    applies_to: "POST /rental-agreements, POST /sales, POST /repair-orders/{id}/quote, POST /range-sessions/{id}/participants"
  - priority: 10
    category: business_fiscal
    check: "funds: wallet_balance_cents covers the charge (participant quoted fee, punch-card price, lesson fee at confirm/accept, league entry fee, settlement total, repair pickup total)"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "all wallet-debiting endpoints"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-05-01T00:00:00Z (never wall-clock). Runs the epoch sweep: BOOKED sessions past start_at+15min -> NO_SHOW (forfeits), ACTIVE waivers past valid_until -> EXPIRED."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, no_show_sessions: integer, expired_waivers: integer }"
    side_effects: ["no-show sweep with fee forfeit and rental-void cascade", "waiver expiry sweep"]
  - method: POST
    path: "/members"
    description: "Register a member. Minor (per logical clock) requires guardian_id of an existing adult Member."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, date_of_birth, "tier?", "guardian_id?"]
    output: Member
    side_effects: ["computes is_minor", "status ACTIVE, wallet 0, strikes 0"]
  - method: GET
    path: "/members"
    description: "List members with filters"
    roles: [Member, RangeOfficer, Admin]
    code: 200
    input: ["status?", "guardian_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/members/{id}"
    description: "Read a member"
    roles: [Member, RangeOfficer, Admin]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/members/{id}/safety-strikes"
    description: "Record a safety strike; the strike reaching exactly 3 auto-suspends and fires the suspension cascade"
    roles: [RangeOfficer]
    code: 201
    input: ["reason?"]
    output: Member
    side_effects: ["safety_strikes += 1", "at 3: SUSPEND + cascade (sessions cancel -> rentals void -> items available, full refunds)"]
  - method: POST
    path: "/members/{id}/reinstate"
    description: "Reinstate a suspended member; resets strikes to 0"
    roles: [RangeOfficer]
    code: 200
    input: []
    output: Member
    side_effects: ["SUSPENDED -> ACTIVE", "safety_strikes = 0"]
  - method: POST
    path: "/members/{id}/wallet/adjustments"
    description: "Admin signed wallet adjustment (positive top-up, negative debit)"
    roles: [Admin]
    code: 201
    input: [amount_cents, "reason?"]
    output: Member
    side_effects: ["wallet_balance_cents += amount_cents"]
  - method: POST
    path: "/members/{id}/waivers"
    description: "Sign a waiver. Adults sign for themselves (X-User-ID == path id); a minor's waiver must be signed by their guardian Member (X-User-ID == member.guardian_id, guardian must be adult)."
    roles: [Member]
    code: 201
    input: []
    output: Waiver
    side_effects: ["signed_at = logical clock", "valid_until = signed date + 365 days", "status ACTIVE"]
  - method: GET
    path: "/members/{id}/waivers"
    description: "List a member's waivers"
    roles: [Member, RangeOfficer, Admin]
    code: 200
    input: ["limit?", "offset?"]
    output: Waiver[]
    side_effects: []
  - method: POST
    path: "/waivers/{id}/revoke"
    description: "Revoke a waiver"
    roles: [Admin]
    code: 200
    input: []
    output: Waiver
    side_effects: ["ACTIVE|EXPIRED -> REVOKED"]
  - method: POST
    path: "/lanes"
    description: "Create a lane"
    roles: [Admin]
    code: 201
    input: [name, lane_type, max_archers]
    output: Lane
    side_effects: []
  - method: GET
    path: "/lanes"
    description: "List lanes"
    roles: [Anonymous, Member, Coach, RangeOfficer, ShopClerk, LeagueDirector, Admin]
    code: 200
    input: ["limit?", "offset?"]
    output: Lane[]
    side_effects: []
  - method: GET
    path: "/lanes/{id}"
    description: "Read a lane"
    roles: [Anonymous, Member, Coach, RangeOfficer, ShopClerk, LeagueDirector, Admin]
    code: 200
    input: []
    output: Lane
    side_effects: []
  - method: GET
    path: "/lanes/{id}/sessions"
    description: "List sessions booked on a lane"
    roles: [Member, RangeOfficer, Admin]
    code: 200
    input: ["limit?", "offset?"]
    output: RangeSession[]
    side_effects: []
  - method: POST
    path: "/range-sessions"
    description: "Book a lane session (WALK_IN or RESERVATION). Creator must hold an ACTIVE waiver. Lane occupancy is the half-open interval [start_at, end_at): back-to-back bookings allowed, any strict overlap rejected."
    roles: [Member, RangeOfficer]
    code: 201
    input: [lane_id, booking_type, start_at, end_at, "created_for_member_id?"]
    output: RangeSession
    side_effects: ["session BOOKED / UNPAID", "quoted_charge_cents starts 0"]
  - method: GET
    path: "/range-sessions"
    description: "List sessions with filters"
    roles: [Member, RangeOfficer, Admin]
    code: 200
    input: ["lane_id?", "created_by_member_id?", "session_status?", "limit?", "offset?"]
    output: RangeSession[]
    side_effects: []
  - method: GET
    path: "/range-sessions/{id}"
    description: "Read a session"
    roles: [Member, RangeOfficer, Admin]
    code: 200
    input: []
    output: RangeSession
    side_effects: []
  - method: POST
    path: "/range-sessions/{id}/participants"
    description: "Add a participant to a BOOKED session; computes quoted_fee_cents (QUOTED variant) and debits wallet or consumes one punch"
    roles: [Member, RangeOfficer]
    code: 201
    input: [member_id, payment_method, "punch_card_id?"]
    output: SessionParticipant
    side_effects: ["WALLET: debit quoted_fee_cents", "PUNCH_CARD: punches_used += 1 (may flip card to EXHAUSTED)", "session quoted_charge_cents += quoted_fee_cents", "payment_status -> PAID"]
  - method: GET
    path: "/session-participants"
    description: "List participants with filters"
    roles: [Member, RangeOfficer, Admin]
    code: 200
    input: ["session_id?", "member_id?", "punch_card_id?", "limit?", "offset?"]
    output: SessionParticipant[]
    side_effects: []
  - method: GET
    path: "/session-participants/{id}"
    description: "Read a participant"
    roles: [Member, RangeOfficer, Admin]
    code: 200
    input: []
    output: SessionParticipant
    side_effects: []
  - method: POST
    path: "/range-sessions/{id}/check-in"
