  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_not_veteran_triggered
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_NOT_VETERAN]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / discharge_application_requires_borrower_veteran_status
