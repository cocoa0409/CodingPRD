            - "settlement_after == \"LC_ACCEPTED\": the DISCREPANT branch compensates exactly the one step the lodging took, and order_v_after == order_v + 2 (one bump for the lodging, one for the revert)"
            - "fulfillment_after == \"SHIPPED\" — the compensation is scoped to the settlement dimension and never rewinds the shipment dimension"
            - "first_finding_source == \"DOCUMENT\" and first_finding_round == 1: findings are stamped with the presentation_round they were raised in"
            - "link_status_after == \"ACTIVE\" with link_round == 1 — the tender is under repair, so no link is invalidated by the revert"
            - "lc_status_after == \"ACCEPTED\" and drawn_after == 0.00: neither the credit nor the drawing ledger participates in this compensation"
      - name: corner_write_off_closes_the_dishonour_saga_and_releases_every_charged_ledger
        claim_type: saga_compensation
        grounds:
          - consistency_model.saga
          - endpoints.POST /export-orders/{export_order_id}/write-off
          - calculations.insured_exposure_ledger
          - state_machines.DocumentPresentation.transitions.COMPLIED_to_REFUSED
        distinguishing_aspect: "The failure branch of the settlement saga runs the other way: a clean examination charges nothing extra, the dishonour parks the order in DISHONORED with the exposure still charged, and only the write-off compensates — releasing insured exposure, recomputing the policy and the buyer aggregate, and auto-advancing the shipment dimension to CLOSED. The credit is never drawn, so drawn_amount_usd must stay 0.00 while the receivable is written down."
        test_recipe:
          setup:
            - "policy 40000.00 limit, insured_pct 85.00, deductible 1000.00, effective 2026-07-01..2026-12-31"
            - "credit acceptance charges the insured exposure that the write-off must later release"
            - "the tender is examined clean, so the refusal is a payment failure rather than a document failure"
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Lagos Power Systems Ltd", country_code: "NG", credit_rating: "CCC", sanctions_tier: "NONE", restricted_party_flag: false }
              captures: { buyer_id: "$.data.id" }
