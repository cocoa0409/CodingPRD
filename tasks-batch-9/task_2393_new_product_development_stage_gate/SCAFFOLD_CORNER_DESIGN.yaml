            - "the label-approvals and sell-in-presentations refusals are 403 rather than 404, since priority 2 precedes the body reference check at priority 5"

      - name: rbac_missing_identity_headers_are_rejected_before_role_and_existence
        claim_type: guard_precedence
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 1]
        distinguishing_aspect: |
          A missing X-Role or X-User-ID header answers 401 ERR_UNAUTHENTICATED even when the rest of
          the request would have failed anyway, so an unauthenticated read of an unknown project id
          is 401 and never 404, and an unauthenticated malformed body is 401 and never 400.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z, one IDEA project."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Header Probe", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 300000.00 }
              as: InnovationLead
              as_user_id: "lead-hp"
              captures: { hp_p_id: $.data.id }
          trigger:
            - call: "GET /innovation-projects"
              as: none
            - call: "GET /innovation-projects/${hp_p_id}"
              as: none
            - call: "GET /innovation-projects/00000000-0000-0000-0000-0000000000ff"
              as: none
            - call: "POST /innovation-projects"
              payload: { name: "No User Header", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 300000.00 }
              as: InnovationLead
              as_user_id: none
            - call: "POST /innovation-projects"
              payload: { brand: "GrainWell", category: "SNACK" }
              as: none
            - call: "POST /innovation-projects/${hp_p_id}/screen"
              payload: { screening_notes: "No headers at all." }
              as: none
          assert:
            - "the first two reads answer 401 ERR_UNAUTHENTICATED because X-Role was omitted, even though the resources exist and every role may read them"
            - "the read of the unknown id answers 401 ERR_UNAUTHENTICATED, not 404, since priority 1 precedes priority 3"
            - "the create with X-Role present but X-User-ID omitted answers 401 ERR_UNAUTHENTICATED"
            - "the create with no headers and a body missing five required fields answers 401 ERR_UNAUTHENTICATED, not 400, since priority 1 precedes priority 4"
            - "the screen with no headers answers 401 and InnovationProject.${hp_p_id}.dev_status is still IDEA"
            - "GET /innovation-projects with valid headers still returns total_count == 1"

      - name: rbac_every_role_may_read_the_whole_project_graph
        claim_type: rbac_matrix
        grounds:
          - rbac[PortfolioAdmin]
          - rbac[InnovationLead]
          - rbac[GateChair]
          - rbac[FunctionalReviewer]
          - rbac[RegulatoryApprover]
          - rbac[RnDLead]
          - rbac[SalesAccountManager]
        distinguishing_aspect: |
          Reads are open to all seven roles while writes are not, so the same GET answers 200 for
          each role in turn including the two narrow approver roles, and each answer carries the
          identical payload rather than a role filtered view.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z, one screened project with a computed business case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Read Sweep", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 300000.00 }
