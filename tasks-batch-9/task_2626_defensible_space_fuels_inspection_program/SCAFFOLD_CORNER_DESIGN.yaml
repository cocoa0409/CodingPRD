      - name: payment_waterfall_fills_buckets_in_pinned_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.abatement_cost_recovery
          - entities.CostRecoveryPayment.fields.allocation
          - endpoints."POST /fire-district/abatement-orders/{order_id}/payments"
        distinguishing_aspect: |
          The waterfall is walked in the pinned order [ADMIN_OVERHEAD, MOBILIZATION, DISPOSAL, LABOR]
          with the subsidy shortfall landing entirely in the LAST bucket: recoverable_alloc is
          {21176, 32000, 29900, 69385} — LABOR is short 38115 of its 107500 cap — and a partial payment
          of 60000 fills ADMIN_OVERHEAD and MOBILIZATION in full, spills 6824 into DISPOSAL and leaves
          LABOR at 0, so a proportional or reverse-order split is distinguishable.
        test_recipe:
          setup:
            - "Full abatement path: an OVERDUE MAJOR notice on a HIGH parcel, abatement authorized for 200000, awarded to a contractor at 8600/h with a 32000 mobilization fee, 12.5 crew hours booked, work reported as 12.5 hours and 3.25 tons, verified by a second inspector at clock 2026-10-06T00:00:00Z."
