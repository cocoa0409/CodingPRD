        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_TOURNAMENT_STATUS]
          - errors[ERR_PRIZE_POOL_UNDERFUNDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: one generate-bracket call that
          violates both the tournament from-state (REGISTRATION_OPEN, priority 6) and
          the funding gate (funded 0 < target 500000, priority 10) MUST return the
          state error ERR_INVALID_TOURNAMENT_STATUS, not the fiscal one.
        test_recipe:
          setup:
            - "Tournament in REGISTRATION_OPEN with funded_pool_cents == 0 and prize_pool_target_cents == 500000"
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Priority Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 500000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector, captures: { tv: $.data.version } }
          trigger:
            - { call: "POST /api/tournaments/${t}/generate-bracket", payload: { expected_tournament_version: "${tv}" }, as: TournamentDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_TOURNAMENT_STATUS (priority 6 state beats priority 10 fiscal)"
            - "Tournament.${t}.status == REGISTRATION_OPEN (unchanged) and bracket_version == 0"

