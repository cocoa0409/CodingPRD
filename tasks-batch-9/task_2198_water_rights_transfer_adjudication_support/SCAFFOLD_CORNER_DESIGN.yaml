            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-06-01T00:00:00Z"}, as: BasinAdjudicator}
            - {call: "POST /decree-dockets/${dkt}/advance-phase", payload: {target_phase: EXAMINATION}, as: BasinAdjudicator}
            - {call: "POST /adjudication-claims/${clm}/examine", payload: {examiner_recommended_af: 90.00, examination_note: "recommend 90 AF"}, as: BasinAdjudicator}
            - {call: "POST /decree-dockets/${dkt}/advance-phase", payload: {target_phase: OBJECTION_PERIOD}, as: BasinAdjudicator}
            - {call: "POST /adjudication-claims/${clm}/decree", payload: {decree_note: "decree entered"}, as: BasinAdjudicator}
