  instances:
  - name: standard_crud_catalog_create_read_and_filtered_list_round_trip
    claim_type: standard_crud
    grounds: ['endpoints[POST /comics/catalogs]', 'endpoints[GET /comics/catalogs/{id}]', 'endpoints[GET
        /comics/catalogs]', entities.Catalog]
    distinguishing_aspect: 'The Catalog resource supports exactly create / read / list: the created row
      reads back field for field, appears under both the status and solicitation_month filters, and §1.5
      declares no PUT, PATCH or DELETE for it (this API is append-plus-transition only).'
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', empty database]
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
