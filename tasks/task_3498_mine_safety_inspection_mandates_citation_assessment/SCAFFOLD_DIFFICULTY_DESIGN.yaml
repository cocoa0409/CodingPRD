  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: citation_dual_axes_contest_and_abatement_independent
        grounds:
          - state_machines.Citation
          - entities.Citation.fields.abatement_status
          - entities.Citation.fields.contest_status
        distinguishing_aspect: |
          Non-linear shape = two independent state axes on ONE entity: the
          citation's abatement axis advances OPEN -> ABATED -> VERIFIED while
          its contest axis sits at CONTESTED, and the contest axis then ends at
          VACATED without disturbing abatement. A linear state machine cannot
          express the interleaving; each axis transition must leave the other
          axis untouched.
        test_recipe:
          setup:
            - "Citation (15 points, repeat) issued 2026-02-10T09:00:00Z; contested 2026-02-11; abated 2026-02-12; verified by a second inspector 2026-02-13; docketed 2026-02-14."
