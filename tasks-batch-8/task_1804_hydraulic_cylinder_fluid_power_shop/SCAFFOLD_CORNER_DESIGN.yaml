            - call: "GET /fluid-power/shops/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "returns ERR_UNAUTHENTICATED (401), not ERR_NOT_FOUND — auth precedes existence"

