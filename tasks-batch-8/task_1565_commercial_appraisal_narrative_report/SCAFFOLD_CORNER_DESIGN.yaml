        claim_type: cascading_side_effects
        grounds: [state_machines.Engagement.IN_PROGRESS_to_LITIGATION_HOLD, state_machines.Report.SIGNED_to_DELIVERED]
        excluded_because:
          difficulty_instance: litigation_hold_depth3_cascade
          rationale: "Layer coverage via the two transitive-cascade difficulty instances."

      - name: rate_threshold_layer
        claim_type: rate_threshold_triggers
