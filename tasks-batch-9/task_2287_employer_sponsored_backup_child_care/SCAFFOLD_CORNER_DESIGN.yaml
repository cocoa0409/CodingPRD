      - name: corner_money_precision_rounds_per_line
        claim_type: Precision
        grounds:
          - calculations.employer_invoice_totals.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_rounds_each_line_then_sums_never_5143
          rationale: "That instance pins the round-each-line-then-sum order against the sum-then-round alternative and names the wrong literal it must never produce."

      - name: corner_waterfall_fills_covered_days_before_overage
        claim_type: waterfall_allocation
        grounds:
          - calculations.entitlement_split
        excluded_because:
          difficulty_instance: combinatorial_formula / overage_tier_snapshot_excludes_the_reservations_own_accrual
          rationale: "That instance drives the 6-step entitlement waterfall across the annual limit and both overage tiers, including the pinned tier snapshot that excludes the reservation's own accrual."

      - name: corner_tiered_overage_rate_scales_with_multiplier
        claim_type: tiered_pricing
        grounds:
          - calculations.reservation_charge_money
        excluded_because:
          difficulty_instance: combinatorial_formula / overage_tier_snapshot_excludes_the_reservations_own_accrual
          rationale: "The same instance asserts the tier multiplier that reservation_charge_money multiplies into overage_unit, so the tier boundary is already covered end to end."

      - name: corner_quality_decay_applies_per_age_tier
        claim_type: decay_function
        grounds:
          - calculations.provider_quality_score
        excluded_because:
          difficulty_instance: dual_variant_calc / provider_rolling_quality_88_80_vs_lifetime_54_00
          rationale: "That instance ages three substantiated incidents into three different decay tiers and asserts the ROLLING and LIFETIME variants diverge to 88.80 vs 54.00."

      - name: corner_match_rank_weights_sum_to_one
        claim_type: weighted_scoring
        grounds:
          - calculations.match_rank_score
        excluded_because:
          difficulty_instance: combinatorial_formula / rank_score_probation_factor_demotes_highest_quality_provider_to_last
          rationale: "That instance computes every weighted component for three providers and shows the probation factor reordering the ranking, which subsumes the weight-sum claim."

      - name: corner_day_charge_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.reservation_day_charge.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / in_home_day_charge_provisional_one_day_vs_final_two_days
          rationale: "That instance runs the PROVISIONAL and FINAL variants over the same reservation and asserts the 1-day vs 2-day divergence plus the ledger delta."

      - name: corner_variant_switch_reconciles_ledger
        claim_type: Reconciliation
        grounds:
          - calculations.conserved_quantity_invariants
        excluded_because:
          difficulty_instance: compensating_invariant / entitlement_days_reconcile_to_ledger_after_release_and_cancel
          rationale: "That instance reconciles the RESERVE/COMMIT/RELEASE ledger against Employee.entitlement_days_* at three observation points, which is the provisional-to-final reconciliation claim."

      - name: corner_invoice_aggregation_running_total
        claim_type: aggregation
        grounds:
          - calculations.employer_invoice_totals
        excluded_because:
          difficulty_instance: compensating_invariant / employer_money_ledger_survives_invoice_issue_and_void
          rationale: "That instance aggregates lines into subtotal/admin_fee/total, then reverses the aggregate on void and rebuilds the identical total on re-invoice with no drift."

