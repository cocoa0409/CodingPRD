        grounds:
          - validations[priority=34]
          - validations[priority=40]
          - state_machines.DisciplinaryAction.ISSUED_to_COMPLETED
          - state_machines.Driver.SUSPENDED_PENDING_ACTION_to_ACTIVE
          - entities.DisciplinaryAction.fields.retraining_status
