  - name: derived_production_order_unit_price_after_endorsement_approval
    claim_type: derived_field_reconciliation
    grounds:
    - calculations.order_price_quote
    - entities.ProductionOrder.fields.unit_price_cents
    - state_machines.SubstitutionEndorsement.PENDING_to_APPROVED
    - POST /api/v1/substitution-endorsements/{id}/approve
    distinguishing_aspect: 'ProductionOrder.unit_price_cents is re-derived from the endorsement set on
      every change: 98000 at creation, still 98000 while the substitute sits PENDING, and 108000 once
      it is APPROVED — the 10000-cent step being the substitute''s line delta plus the 8000-cent capped
      change fee.'
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-DF3-1 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-DF3)
        with WHEELSET WS-DF3-A at qty_per_car 1 and CASTING CS-DF3-1 at qty_per_car 1; substitute WHEELSET
        WS-DF3-B carries unit_cost_cents 3000 against WS-DF3-A's 1000.
      - The order is created with order_date equal to the clock date, so the forecast variant's 120-day
        WHEELSET/CASTING lapse does not fire and the DRAFT quote equals the committed base.
      - The endorsement is raised by X-User-ID user-df3-maker and approved by user-df3-checker, keeping
        the second-person rule of the approve transition satisfied.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-DF3-1
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-DF3
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-DF3-A
          component_class: WHEELSET
          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_a: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-DF3-B
          component_class: WHEELSET
          unit_cost_cents: 3000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_b: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CS-DF3-1
          component_class: CASTING
          unit_cost_cents: 2000
          lead_time_days: 6
        as: SupplyChainCoordinator
        captures:
          cs_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${ws_a}
          qty_per_car: 1
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${cs_id}
          qty_per_car: 1
        as: ProductionPlanner
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 1
          planned_shop_days: 1
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-09-20'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
          price_at_create: $.data.unit_price_cents
          po_v: $.data.version
      trigger:
      - call: POST /api/v1/substitution-endorsements
        payload:
          production_order_id: ${po_id}
          original_component_id: ${ws_a}
          substitute_component_id: ${ws_b}
          substitute_qty_per_car: 1
          decides_material: false
          expected_production_order_version: ${po_v}
        as: ProductionPlanner
        as_user_id: user-df3-maker
        captures:
          se_id: $.data.id
          se_status: $.data.status
      - call: GET /api/v1/production-orders/${po_id}
        payload: {}
        as: ProductionPlanner
        captures:
          price_while_pending: $.data.unit_price_cents
      - call: POST /api/v1/substitution-endorsements/${se_id}/approve
        payload: {}
        as: LeaseAdministrator
        as_user_id: user-df3-checker
        captures:
          se_status_approved: $.data.status
      - call: GET /api/v1/production-orders/${po_id}
        payload: {}
        as: ProductionPlanner
        captures:
          price_after_approval: $.data.unit_price_cents
      assert:
      - At creation the committed quote is the literal data.unit_price_cents == ${price_at_create} ==
        98000 == 26000 + 27000 + 45000 with no change fee
      - 'The endorsement opens PENDING: data.status == ${se_status} == "PENDING"'
      - 'A PENDING endorsement is outside the input set, so the derived price has not moved: data.unit_price_cents
        == ${price_while_pending} == 98000'
      - Approval returns data.status == ${se_status_approved} == "APPROVED" and re-derives the price to
        data.unit_price_cents == ${price_after_approval} == 108000
      - The 108000 literal composes as ceil((1 * 3000 + 25000) / 100) * 100 == 28000 for the substituted
        line, plus the unchanged 27000 casting line, plus 1 * 45000 labor, plus the capped change fee
        min(15000, floor(100000 * 8 / 100)) == 8000
      - The step is exactly ${price_after_approval} - ${price_at_create} == 10000 cents, of which 2000
        is the substitute's line delta and 8000 the fee at its 8 percent cap rather than the 15000-cent
        raw fee
- section: consistency_model
  instances:
  - name: consistency_immediate_retrofit_start_response_carries_recomputed_program_cost
    claim_type: immediate
    grounds:
    - POST /api/v1/retrofit-programs/{id}/start
    - calculations.retrofit_program_cost_allocation
    - entities.RetrofitProgram.fields.program_cost_cents
    - entities.LeaseFleetCar.fields.retrofit_required
    distinguishing_aspect: The start request's own response body already carries the recomputed program_cost_cents
      1865000 alongside status IN_PROGRESS — the derived field is not left stale at its pre-write 0 for
      a later read — and the enrolled car's retrofit_required is true on the very next read with no clock
      movement.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z and never moved during the instance.
      - Car type CT-IM-1 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-IM)
        carries one COATING bill-of-material row CO-IM-1 covered by a CONFIRMED purchase order; RETAINED
        order of 1 car is reserved, released, changed over on LINE-IM-L1 for [2026-09-02, 2026-09-03)
        and completed on 2026-09-04.
      - Mandate MAND-IM-1 (10 shop days per car, kit KIT-IM-1 at unit_cost_cents 5000, deadline 2026-12-31)
        covers CT-IM-1 and has one SCHEDULED work order on SL-IM-1 for [2026-09-10, 2026-09-20) consuming
        3 kit units, so the car is UNDER_REPAIR while the program is still PLANNED.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
