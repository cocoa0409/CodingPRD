          trigger:
            - { call: "POST /licensure/experience-reports/${r1_id}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}", captures: { err: $.data.error_id } }
            - { call: "PATCH /licensure/supervisors/${sup_id}", payload: { expected_supervisor_version: "${sup_v2}", license_status: "ACTIVE" }, as: NcarbAdministrator }
