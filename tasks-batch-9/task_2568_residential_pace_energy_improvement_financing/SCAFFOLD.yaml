    output: Contractor
    side_effects: []
  - method: GET
    path: "/pace/contractors"
    description: "List contractors filterable by enrollment status and county served"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: ["enrollment_status?", "county_code?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []
  - method: POST
    path: "/pace/contractors/{id}/enroll"
    description: "Approve a contractor for program participation"
    roles: [ProgramAdmin]
