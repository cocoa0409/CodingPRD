              as: CredentialAnalyst
          assert:
            - "The first trigger call returns 200 with data.readiness_score == 90 and data.readiness_status == \"READY\" - a score exactly at READINESS_READY_MIN clears the gate."
            - "The second trigger call returns 200 with data.readiness_score == 85 and data.readiness_status == \"NOT_READY\", the nearest reachable score below the cut."
            - "The 5-point gap is the whole boundary: round_half_up(18 * 25 / 30) = 15 coursework points versus round_half_up(12 * 25 / 30) = 10, while both candidates score 40 for the exam and 35 for the clearance."
