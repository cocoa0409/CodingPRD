            - "trigger response 409 with error_id == \"ERR_INVALID_STATE_TRANSITION\" - no domain-specific code is declared for this precondition on this endpoint"
            - "GET /research-billing/studies/${study_id} still shows lifecycle_status == \"COVERAGE_APPROVED\" and budget_status == \"EXECUTED\""
