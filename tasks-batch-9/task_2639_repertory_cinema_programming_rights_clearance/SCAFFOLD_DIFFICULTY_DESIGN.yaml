          booking (1) marks it WITHDRAWN, (2) cancels every SCHEDULED showtime under it, (3) splits
          the order population by status - RESERVED holds become VOID with no money movement while
          PAID orders become REFUNDED and credit the member - and (4) recomputes the clearance
