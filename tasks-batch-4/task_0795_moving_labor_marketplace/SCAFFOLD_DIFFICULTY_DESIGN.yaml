  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assign_not_approved_beats_helper_unavailable
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_HELPER_NOT_APPROVED]
          - errors[ERR_HELPER_UNAVAILABLE]
        distinguishing_aspect: "A single POST /assignments violates both business_safety (helper SUSPENDED, priority 5) and business_temporal (overlaps the helper's CHECKED_IN assignment, priority 7); the priority-5 safety error ERR_HELPER_NOT_APPROVED is returned."
        test_recipe:
          setup:
            - "Helper HP APPROVED, assigned to job JA1 (window 2026-03-10T09:00-11:00) and CHECKED_IN, then SUSPENDED (CHECKED_IN assignment survives suspension)."
            - "Job JA2 BOOKED with overlapping window 2026-03-10T09:30-11:30."
