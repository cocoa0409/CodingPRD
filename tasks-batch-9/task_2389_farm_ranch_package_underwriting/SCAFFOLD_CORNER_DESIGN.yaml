              payload: { policy_id: "00000000-0000-4000-8000-0000000000a1", inspector_id: "${insp_id}", inspection_type: "INITIAL", scheduled_for: "2026-08-16T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { e_link_pol: $.data.error_id }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "00000000-0000-4000-8000-0000000000a2", inspection_type: "INITIAL", scheduled_for: "2026-08-16T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
