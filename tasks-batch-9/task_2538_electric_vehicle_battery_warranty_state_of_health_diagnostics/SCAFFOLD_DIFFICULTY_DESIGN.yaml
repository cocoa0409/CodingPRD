              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "POST /battery-warranty/thermal-events/${event_id}/containment-step"
              payload: { step_index: 1, step_note: "HV isolated" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "POST /battery-warranty/pack-shipments"
              payload: { pack_id: "${pack_id}", origin_service_center_id: "${center_id}", certifying_technician_id: "${tech_a_id}", shipment_contents: "FULL_PACK", packaging_spec: "SP376_STRONG_OUTER", state_of_charge_pct: 25.00, transport_mode: "GROUND", destination: "REMAN_CENTER" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "POST /battery-warranty/thermal-events/${event_id}/containment-step"
              payload: { step_index: 2, step_note: "pack quarantined" }
              as: ServiceTechnician
