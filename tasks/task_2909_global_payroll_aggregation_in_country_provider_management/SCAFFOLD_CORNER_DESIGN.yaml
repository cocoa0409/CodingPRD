              as: ProviderUser
              as_user_id: "${prov_p1}"
          assert:
            - "HTTP 412 with error_id ERR_STALE_CYCLE_VERSION"
            - "c1_v0 == 1 and c1_v1 == 2, so the lock incremented the version"
            - "GET /payroll/gross-to-net-runs?cycle_id=${c1} returns total_count 0 and PayrollCycle.${c1}.version is still 2"
            - "the identical body with expected_cycle_version ${c1_v1} returns 201 and PayrollCycle.${c1}.version becomes 3"
            - "replaying the ${c1_v1} body a second time then fails with ERR_STALE_CYCLE_VERSION"

      - name: stale_expected_engagement_version_on_transition_plan_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.transition-plan-stale-engagement
          - errors.ERR_STALE_ENGAGEMENT_VERSION
        distinguishing_aspect: "The second OCC guard uses a different parent and a different error: the engagement version read at creation is stale once the residency decision lands, so the transition plan is refused with ERR_STALE_ENGAGEMENT_VERSION (412) and none of the four transition_* fields is written."
        test_recipe:
          setup:
            - "CountryProfile DE, incumbent Provider P1 and incoming Provider P2, both covering the EU region"
            - "Engagement created (version 1 captured as eng_v0) then approved for residency, which bumps the version to 2 (captured as eng_v1)"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
