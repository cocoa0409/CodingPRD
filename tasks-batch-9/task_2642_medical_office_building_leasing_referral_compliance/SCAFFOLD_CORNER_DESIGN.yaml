            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "GET /leases"
              payload: { building_id: "${x3_b_id}" }
              as: LeasingAgent
            - call: "GET /ti-projects/${x3_p_id}"
              payload: {}
              as: LeasingAgent
          assert:
            - "All five trigger calls return 422 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "The 30.001 and -30.00 rents are refused for precision and sign, not for being outside the FMV band — no ERR_RENT_* code appears"
            - "The 2030-12-31..2027-01-01 term is refused for ordering before term_months is ever computed, so no ERR_MIN_TERM_NOT_MET appears"
            - "The 1.50 override is refused before ERR_TI_ALLOWANCE_EXCEEDED could apply, and TenantImprovementProject.${x3_p_id}.line_item_count is still 0 with allowance_remaining == 100000.00"
            - "Setting the clock backwards from 2026-08-01T00:00:00Z to 2026-07-01T00:00:00Z is refused, so the epoch is monotonic"
            - "GET /leases?building_id=${x3_b_id} returns meta.total_count == 1 — only the setup lease exists"

