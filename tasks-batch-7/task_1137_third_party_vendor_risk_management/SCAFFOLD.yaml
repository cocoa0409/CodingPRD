  - method: GET
    path: "/tprm/incidents/{id}/remediation-plans"
    description: "List plans on an incident."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor, BusinessUnitOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RemediationPlan[]
    side_effects: []

  - method: GET
    path: "/tprm/remediation-plans/{id}"
    description: "Fetch a plan."
    roles: [VendorRelationshipManager, RiskOfficer, ComplianceDirector, InternalAuditor, BusinessUnitOwner]
    code: 200
    input: []
    output: RemediationPlan
    side_effects: []

  - method: POST
    path: "/tprm/remediation-plans/{id}/submit"
