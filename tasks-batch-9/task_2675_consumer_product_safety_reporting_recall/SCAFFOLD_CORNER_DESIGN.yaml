        distinguishing_aspect: |
          The cap is on a MONOTONIC counter that both parties share, so it is only
          reachable by alternating six legal offers through the cyclic
          ASSESSMENT_OPEN -> OFFER_MADE -> COUNTERED loop; the seventh offer is
          state-legal (the case sits in COUNTERED, from which an AGENCY offer is a
          declared transition) and must be refused purely on the round count. Each
          offer also carries the OCC token of the version it read, so a naive
          implementation that re-reads the version internally is caught too.
        test_recipe:
          setup:
            - "fixture chain F1 to a CivilPenaltyCase with violation_count 4 and assessed_penalty_cents 5500000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
