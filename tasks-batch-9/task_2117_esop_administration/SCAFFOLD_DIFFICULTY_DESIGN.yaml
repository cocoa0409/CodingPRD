      - name: zero_component_loan_payment_releases_no_shares
        grounds:
          - calculations.loan_share_release
          - entities.LoanPayment.fields.released_shares
          - endpoints.POST /loan-payments
        distinguishing_aspect: |
          A zero-quantity boundary on a third endpoint and a third metric: a loan payment
          whose principal_cents and interest_cents are both 0 produces a numerator of 0, so
          released_shares is exactly 0 and every suspense counter is left untouched - the
          calculation must not divide by zero or release the whole balance.
        test_recipe:
          setup:
            - "One OPEN plan carrying one PRINCIPAL_ONLY loan with 600000 pledged shares, principal balance 4000000000 cents and remaining interest 1600000000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
