  - rule_id: compensating_invariant
    instances:
      - name: void_writes_a_reversal_row_that_returns_the_ledger_sum_to_zero_without_deleting_history
        grounds:
          - state_machines.InstructionSession.DELIVERED_to_VOIDED
          - calculations.attendance_code_assignment
          - entities.AttendanceLedgerEntry.common_fields_false
          - entities.HomeboundCase.fields.reported_apportionment_minutes
        distinguishing_aspect: |
          The ledger is append-only and immutable, so undoing a delivery must be done by writing an
          opposite HB_REVERSAL row rather than by mutating or deleting the HB_PRESENT row. The invariant
