          Two identical disclaimer-free creatives under the same advertiser and the same
          reviewer diverge on one rule flag: the SUP_HEALTH creative is approved while the
          ALC_SPIRITS creative is refused at priority 56, so the rule must be conditional on
          the matched rule rather than applied to every approval.
