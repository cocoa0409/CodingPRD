              as: GovernanceStaff
              captures: { replay_error_id: $.data.error_id }
          assert:
            - "The first void returns HTTP 200 with SlateNominee.${nom_id}.status == \"VOIDED\" and voided_at == \"2026-08-01T00:00:00Z\""
