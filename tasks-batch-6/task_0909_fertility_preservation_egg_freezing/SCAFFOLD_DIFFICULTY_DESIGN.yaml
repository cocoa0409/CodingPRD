            - { call: "POST /storage-tanks", payload: { name: "T8", capacity_slots: 10 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P 15", date_of_birth: "1994-03-01T00:00:00Z", email: "p15@x.com" }, as: Coordinator, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc_id}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles/${cyc_id}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:00:00Z", retrieval_end: "2026-05-10T09:00:00Z", oocytes_retrieved: 4, mature_oocyte_count: 1, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}" }
            - { call: "GET /cryo-specimens", payload: {}, as: Embryologist, captures: { s0: "$.data[0].id" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "CONSENT", expected_patient_version: "${p_v}" }, as: Patient, as_user_id: "${p_id}" }
            - { call: "POST /thaw-transfer-authorizations", payload: { patient_id: "${p_id}", specimen_ids: ["${s0}"], transfer_type: "THAW_TO_TRANSFER" }, as: Physician, as_user_id: "${phys1}", captures: { auth1: "$.data.id" } }
          trigger:
            - { call: "POST /thaw-transfer-authorizations/${auth1}/authorize", payload: {}, as: Physician, as_user_id: "${phys2}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_DISPOSITION_NOT_ACTIVE"
            - "response.status == 422"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_appointment_buffered_overlap
        grounds:
          - "validations[priority=13]"
          - entities.MonitoringAppointment.fields.provider_id
          - entities.Provider.fields.provider_role
        distinguishing_aspect: "Resource=Provider with buffered semantics: a new 09:40-10:00 appointment is rejected against an existing 09:00-09:30 one on the same provider because the 10-minute gap < PROVIDER_BUFFER_MINUTES(15), even though the intervals do not literally overlap."
        test_recipe:
          setup:
            - "Cycle in MONITORING with an existing 09:00-09:30 appointment on provider phys1."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr M", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P 16", date_of_birth: "1993-01-01T00:00:00Z", email: "p16@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 31, amh_level: 3.0, antral_follicle_count: 16 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
          trigger:
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:40:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: Coordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_PROVIDER_UNAVAILABLE"
            - "response.status == 409"

      - name: room_retrieval_adjacent_allowed
        grounds:
          - "validations[priority=14]"
          - entities.StimulationCycle.fields.retrieval_room_id
          - entities.ProcedureRoom.fields.room_kind
        distinguishing_aspect: "Resource=ProcedureRoom with half-open [start,end) NO-buffer semantics: a second retrieval 09:00-10:00 on the same room is ACCEPTED back-to-back with an existing 08:00-09:00 (touching endpoints only) — opposite geometric treatment to the buffered provider rule."
        test_recipe:
          setup:
            - "Two eligible cycles for one patient; cycle1 retrieved 08:00-09:00 in room1; cycle2 triggered, retrieving 09:00-10:00 in the same room1."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr N", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /procedure-rooms", payload: { name: "OR9", room_kind: "RETRIEVAL_OR" }, as: PlatformAdmin, captures: { room1: "$.data.id" } }
            - { call: "POST /storage-tanks", payload: { name: "T9", capacity_slots: 10 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P 17", date_of_birth: "1994-03-01T00:00:00Z", email: "p17@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /consultations/${c1}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c1}" }, as: Coordinator, captures: { cyc1: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc1}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc1}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc1}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc1}", provider_id: "${phys1}", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc1}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles/${cyc1}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:00:00Z", retrieval_end: "2026-05-10T09:00:00Z", oocytes_retrieved: 6, mature_oocyte_count: 2, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { c2: "$.data.id" } }
            - { call: "POST /consultations/${c2}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c2}" }, as: Coordinator, captures: { cyc2: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc2}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc2}", provider_id: "${phys1}", scheduled_start: "2026-05-03T09:00:00Z", scheduled_end: "2026-05-03T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc2}", provider_id: "${phys1}", scheduled_start: "2026-05-03T10:00:00Z", scheduled_end: "2026-05-03T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc2}", provider_id: "${phys1}", scheduled_start: "2026-05-03T11:00:00Z", scheduled_end: "2026-05-03T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc2}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
          trigger:
            - { call: "POST /stimulation-cycles/${cyc2}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T09:00:00Z", retrieval_end: "2026-05-10T10:00:00Z", oocytes_retrieved: 5, mature_oocyte_count: 2, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}", captures: { st: "$.data.status" } }
          assert:
            - "StimulationCycle.${cyc2}.status == COMPLETED"
            - "StimulationCycle.${cyc2}.retrieval_room_id == ${room1}"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: tank_slot_conservation_store_thaw
        grounds:
          - state_machines.CryoSpecimen.RESERVED_to_THAWED
          - calculations.tank_slot_count
          - entities.StorageTank.fields.used_slots
        distinguishing_aspect: "Conserved quantity = physical tank slots: after storing 2 then thawing 1, StorageTank.used_slots (=1) equals the count of that tank's CryoSpecimen in {STORED,RESERVED} (=1); no slot drift."
        test_recipe:
          setup:
            - "Patient with 2 STORED specimens (used_slots 2) in a capacity-5 tank; consent+disposition ACTIVE; authorization AUTHORIZED reserving specimen 0 only."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr O1", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /providers", payload: { full_name: "Dr O2", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys2: "$.data.id" } }
            - { call: "POST /providers", payload: { full_name: "Emb O", provider_role: "EMBRYOLOGIST" }, as: PlatformAdmin, captures: { emb1: "$.data.id" } }
            - { call: "POST /procedure-rooms", payload: { name: "OR10", room_kind: "RETRIEVAL_OR" }, as: PlatformAdmin, captures: { room1: "$.data.id" } }
            - { call: "POST /storage-tanks", payload: { name: "T10", capacity_slots: 5 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P 18", date_of_birth: "1994-03-01T00:00:00Z", email: "p18@x.com" }, as: Coordinator, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc_id}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles/${cyc_id}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:00:00Z", retrieval_end: "2026-05-10T09:00:00Z", oocytes_retrieved: 6, mature_oocyte_count: 2, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}" }
            - { call: "GET /cryo-specimens", payload: {}, as: Embryologist, captures: { s0: "$.data[0].id", s1: "$.data[1].id" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "CONSENT", expected_patient_version: "${p_v}" }, as: Patient, as_user_id: "${p_id}" }
            - { call: "GET /patients/${p_id}", payload: {}, as: Coordinator, captures: { p_v2: "$.data.version" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "DISPOSITION", disposition_action: "THAW_TO_SELF", expected_patient_version: "${p_v2}" }, as: Patient, as_user_id: "${p_id}" }
            - { call: "POST /thaw-transfer-authorizations", payload: { patient_id: "${p_id}", specimen_ids: ["${s0}"], transfer_type: "THAW_TO_TRANSFER" }, as: Physician, as_user_id: "${phys1}", captures: { auth1: "$.data.id" } }
            - { call: "POST /thaw-transfer-authorizations/${auth1}/authorize", payload: {}, as: Physician, as_user_id: "${phys2}" }
          trigger:
            - { call: "POST /thaw-transfer-authorizations/${auth1}/execute", payload: {}, as: Embryologist, as_user_id: "${emb1}" }
          assert:
            - "CryoSpecimen.${s0}.status == THAWED"
            - "CryoSpecimen.${s1}.status == STORED"
            - "StorageTank.${tank1}.used_slots == 1"

      - name: benefit_cap_conservation_finalize_void
        grounds:
          - state_machines.Invoice.DRAFT_to_FINALIZED
          - state_machines.Invoice.FINALIZED_to_VOID
          - calculations.benefit_cap_ledger
          - entities.BenefitCoverage.fields.consumed_cents
          - entities.BenefitCoverage.fields.remaining_cents
        distinguishing_aspect: "Conserved quantity = benefit cap cents: finalize consumes 20000 (consumed 20000 / remaining 80000) and void restores it (consumed 0 / remaining 100000); consumed_cents + remaining_cents == annual_cap_cents(100000) at every step — different quantity type than tank slots."
        test_recipe:
          setup:
            - "Patient with BenefitCoverage cap 100000, covered_pct 0.5, covers CYCLE; a CYCLE invoice subtotal 40000 finalized (consumes 20000), then voided."
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P 19", date_of_birth: "1990-01-01T00:00:00Z", email: "p19@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /benefit-coverages", payload: { patient_id: "${p_id}", employer_name: "Gamma", annual_cap_cents: 100000, covered_pct: 0.5, covered_service_types: ["CYCLE"] }, as: BillingAdmin, captures: { ben_id: "$.data.id" } }
            - { call: "POST /invoices", payload: { patient_id: "${p_id}", service_type: "CYCLE", line_items: [ { description: "cycle", amount_cents: 40000 } ] }, as: BillingAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /invoices/${inv_id}/finalize", payload: {}, as: BillingAdmin }
          trigger:
            - { call: "POST /invoices/${inv_id}/void", payload: {}, as: BillingAdmin, captures: { st: "$.data.status" } }
          assert:
            - "BenefitCoverage.${ben_id}.consumed_cents == 0"
            - "BenefitCoverage.${ben_id}.remaining_cents == 100000"
            - "BenefitCoverage.${ben_id}.status == ACTIVE"
