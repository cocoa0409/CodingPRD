      - name: room_minutes_restored_after_schedule_then_cancel
        grounds:
          - calculations.room_booked_minutes_total
          - state_machines.DefenseEvent.DRAFT_to_CANCELLED
          - state_machines.Thesis.DEFENSE_SCHEDULED_to_COMMITTEE_APPROVED
          - entities.DefenseRoom.fields.booked_minutes_total
        distinguishing_aspect: |
          The conserved quantity is booked minutes on a physical room rather than a counted role
          load: booking candidate B for 16:30-18:30 raises DefenseRoom.booked_minutes_total from 120
          to 240, and cancelling that same event must return it to exactly 120 while candidate A's
          ANNOUNCED occupation and candidate B's APPROVED committee both survive untouched.
        test_recipe:
          setup:
            - "Term 2026FA is OPEN; DefenseRoom R101 has turnover_buffer_minutes 30 and one ANNOUNCED defense for candidate A on 2026-09-25T14:00:00Z-16:00:00Z, so booked_minutes_total is 120."
            - "Candidate B's THESIS of 101 pages has an APPROVED committee and workflow_state COMMITTEE_APPROVED with no DefenseEvent."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
