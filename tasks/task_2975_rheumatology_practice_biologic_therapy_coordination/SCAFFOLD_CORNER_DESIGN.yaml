        grounds:
          - state_machines.TherapyEpisode.transitions[ACTIVE->HELD].trigger[system_lab]
          - state_machines.AssistanceEnrollment.transitions[EXHAUSTED->ACTIVE]
        excluded_because:
          difficulty_instance: lab_grade_hold_cascade_releases_units_and_reactivates_enrollment
          rationale: "The §1.8 transitive-cascade instance already exercises the full depth-4 chain from a grade-3 ALT panel through the episode hold and the appointment cancellation to the unit release and the EXHAUSTED -> ACTIVE enrollment recovery, with every counter pinned."

      - name: administration_and_reversal_form_a_compensating_pair
        claim_type: compensation
        grounds:
          - state_machines.InfusionAppointment.transitions[ADMINISTERED->SCHEDULED]
        excluded_because:
          difficulty_instance: authorization_unit_conservation_across_administration_and_reversal
          rationale: "The §1.8 compensating-invariant instance pins units_reserved / units_consumed / units_remaining before, during and after the reversal and shows approved_units is conserved at every step, which subsumes a plain valid-transition check on the reversal edge."

  - section: calculations
