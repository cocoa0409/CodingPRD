            - "AlarmSite.${site_id}.outstanding_balance_cents == 85000 >= delinquent_balance_block_cents 50000 and renewal_block_active == true"
            - "AlarmPermit.${permit1_id}.status is RENEWAL_BLOCKED with renewal_count 0 and no PERMIT_RENEWAL_FEE invoice raised"
            - "the quoted version is current, so the 412 row is satisfied and only the fiscal row rejects the call"

      - name: approve_registration_at_a_delinquent_site_returns_payment_required
        claim_type: Violation -> Error
        grounds:
