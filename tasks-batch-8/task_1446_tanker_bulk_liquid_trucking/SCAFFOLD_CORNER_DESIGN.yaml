  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_patch
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a successful PATCH is fully visible in the very next GET (ordered_gallons 1500, version incremented)."
        test_recipe:
          setup: ["DRAFT shipment; version captured"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 100, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id, ship_v: $.data.version } }
          trigger:
            - { call: "PATCH /bulk-liquid/shipments/${ship}", payload: { ordered_gallons: 1500, expected_shipment_version: "${ship_v}" }, as: Dispatcher }
            - { call: "GET /bulk-liquid/shipments/${ship}", as: Dispatcher, captures: { og: $.data.ordered_gallons, vv: $.data.version } }
          assert:
            - "GET immediately after PATCH: ordered_gallons == 1500 and version == (${ship_v} + 1)"
