  # ===========================================================================
  - section: errors
    instances:
      - name: each_uniqueness_rule_returns_its_own_conflict_error
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_JURISDICTION_CODE
          - errors.ERR_DUPLICATE_CATEGORY_CODE
          - errors.ERR_DUPLICATE_NEXUS_COMPONENT
          - errors.ERR_DUPLICATE_SCHEDULE_ITEM
          - validations[priority=34]
          - validations[priority=35]
          - validations[priority=36]
          - validations[priority=37]
        distinguishing_aspect: |
          The four uniqueness rules live at four different scopes - jurisdiction_code globally,
          category code per program, component per (study, category) and schedule line per
          (component, land use) - and each must surface its OWN 409 error id rather than a
          generic conflict. The duplicate component uses a non-overlapping horizon
          (2031..2035) so that ERR_HORIZON_OVERLAP cannot be mistaken for the cause, and the
          study is DRAFT so rule 40 (which only inspects the EFFECTIVE study) is inert.
