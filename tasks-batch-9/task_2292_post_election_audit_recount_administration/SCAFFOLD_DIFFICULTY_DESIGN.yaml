  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_invalid_recount_state_precedes_deposit_insufficient
        grounds:
          - validations[priority=14]
          - validations[priority=48]
          - errors[ERR_INVALID_RECOUNT_STATE]
          - errors[ERR_DEPOSIT_INSUFFICIENT]
          - state_machines.Recount.REQUESTED_to_DEPOSIT_HELD
        distinguishing_aspect: |
          Pair: category state (priority 14) against category business_fiscal (priority 48). A second funding call
          on an already-funded recount violates both the state rule and the exact-amount rule, and the response is
          ERR_INVALID_RECOUNT_STATE 409, never ERR_DEPOSIT_INSUFFICIENT 402.
        test_recipe:
          setup:
            - "Election ST-02 with one canvassed contest C2 (CHEN 1575 / DAVIS 1425 of 3000 ballots) over batches C2-B01 1000, C2-B02 995, C2-B03 1005."
            - "rep-davis filed a PARTIAL_BATCHES recount over all three batches: ballots_in_scope 3000, required_deposit_cents 50000 + 40 * 3000 = 170000."
            - "The deposit was posted in full, so status is DEPOSIT_HELD and deposit_status is HELD; no transition DEPOSIT_HELD -> DEPOSIT_HELD exists."
            - "The follow-up call under-pays with 999 cents, so both the state rule and the exact-amount rule are violated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-02", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e2_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e2_id}", contest_label: "C2", office_name: "State Treasurer", contest_type: "CANDIDATE", candidate_names: ["CHEN", "DAVIS"], ballots_cast: 3000, cvr_available: false }
              as: ElectionsDirector
              captures: { c2_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e2_id}", contest_id: "${c2_id}", batches: [{ batch_label: "C2-B01", storage_location_code: "VAULT-2", ballot_count: 1000, machine_votes: { CHEN: 525, DAVIS: 475 }, current_seal_number: "S2-01" }, { batch_label: "C2-B02", storage_location_code: "VAULT-2", ballot_count: 995, machine_votes: { CHEN: 522, DAVIS: 473 }, current_seal_number: "S2-02" }, { batch_label: "C2-B03", storage_location_code: "VAULT-2", ballot_count: 1005, machine_votes: { CHEN: 528, DAVIS: 477 }, current_seal_number: "S2-03" }] }
              as: CustodyOfficer
              captures: { c2_bulk: "$.data.created_count" }
            - call: "POST /contests/${c2_id}/canvass-results"
              payload: { reported_votes: { CHEN: 1575, DAVIS: 1425 } }
              as: ElectionsDirector
              captures: { c2_v: "$.data.version" }
            - call: "GET /ballot-batches"
              payload: { contest_id: "${c2_id}", limit: 100 }
              as: CustodyOfficer
              captures: { cb1_id: "$.data[0].id", cb2_id: "$.data[1].id", cb3_id: "$.data[2].id" }
            - call: "POST /recounts"
              payload: { contest_id: "${c2_id}", expected_contest_version: "${c2_v}", trigger_type: "CANDIDATE_REQUESTED", scope: "PARTIAL_BATCHES", scope_batch_ids: ["${cb1_id}", "${cb2_id}", "${cb3_id}"], requested_by_candidate_name: "DAVIS" }
              as: CandidateRepresentative
              as_user_id: "rep-davis"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recounts/${rc_id}/deposit"
              payload: { amount_cents: 170000 }
              as: CandidateRepresentative
              as_user_id: "rep-davis"
          trigger:
            - call: "POST /recounts/${rc_id}/deposit"
              payload: { amount_cents: 999 }
              as: CandidateRepresentative
              as_user_id: "rep-davis"
              captures: { err_pair: "$.data.error_id" }
          assert:
            - "${err_pair} == ERR_INVALID_RECOUNT_STATE"
            - "${err_pair} != ERR_DEPOSIT_INSUFFICIENT"
            - "the response status is 409, not 402"
            - "Recount.${rc_id}.status == DEPOSIT_HELD and Recount.${rc_id}.deposit_status == HELD"
            - "Recount.${rc_id}.deposit_paid_cents == 170000 and Recount.${rc_id}.required_deposit_cents == 170000"
            - "Recount.${rc_id}.refunded_cents == 0 and Recount.${rc_id}.forfeited_cents == 0 and Recount.${rc_id}.admin_retained_cents == 0"
      - name: priority_stale_ballot_batch_version_precedes_batch_quarantined
