        distinguishing_aspect: "Peer roles do not overlap on the listing surface: the associate agent that owns the tour actions cannot publish a listing and gets 403 ERR_FORBIDDEN while the listing agent succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region with a high ratio target, one lead agent, one associate agent, one assigned SELL client with a DRAFT listing owned by the lead agent."
          setup_api_calls:
