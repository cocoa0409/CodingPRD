      - name: manifest_submission_of_an_all_void_lot_returns_manifest_empty
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_MANIFEST_EMPTY]
          - validations[priority 15 -> ERR_MANIFEST_EMPTY]
        excluded_because:
          difficulty_instance: boundary_precision_check / manifest_submission_blocked_at_empty_active_line_boundary
          rationale: >
            That difficulty instance already drives the ACTIVE-line count down to exactly zero by
            voiding the last surviving line and submits at the boundary, asserting
            ERR_MANIFEST_EMPTY plus the unchanged DRAFT lot state. A separate breadth instance
            would repeat the same single call with no new discrimination.

      - name: publishing_while_the_seller_is_on_probation_returns_seller_not_active
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_SELLER_NOT_ACTIVE]
          - validations[priority 11 -> ERR_SELLER_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / listing_publication_blocked_by_seller_probation_on_another_lot
          rationale: >
            The cross-entity instance already establishes PROBATION on the seller through an
            approved claim on a different lot and then fails the publication with
            ERR_SELLER_NOT_ACTIVE, distinguishing it from the lot-level and listing-level gates.
            Re-triggering the same error from a directly probated seller adds no coverage.

      - name: scheduling_pickup_on_a_partially_paid_order_returns_order_not_paid
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_ORDER_NOT_PAID]
          - validations[priority 11 -> ERR_ORDER_NOT_PAID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pickup_appointment_blocked_by_partially_paid_order
          rationale: >
            That instance already schedules against a PARTIALLY_PAID order, asserts
            ERR_ORDER_NOT_PAID, then completes the payment and shows the identical request
            succeeding - which subsumes the plain triggerability claim.

      - name: paying_an_abandoned_order_returns_payment_window_closed
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_PAYMENT_WINDOW_CLOSED]
          - validations[priority 10 -> ERR_PAYMENT_WINDOW_CLOSED]
        excluded_because:
          difficulty_instance: transitive_cascade / pickup_deadline_sweep_cascades_through_lot_relist_to_commission_tier
          rationale: >
            The cascade instance drives the order to logistics_status ABANDONED through the
            pickup-deadline sweep and then asserts ERR_PAYMENT_WINDOW_CLOSED on the payment
            attempt against that abandoned order, which is the only way this error is reachable,
            so the triggerability claim is already covered inside a richer chain.

      - name: booking_past_the_carrier_daily_capacity_returns_capacity_full
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_CARRIER_DAY_CAPACITY_FULL]
          - validations[priority 14 -> ERR_CARRIER_DAY_CAPACITY_FULL]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / carrier_daily_capacity_counts_per_utc_date_not_per_interval
          rationale: >
            That instance fills the carrier's daily quota with non-overlapping windows, asserts
            ERR_CARRIER_DAY_CAPACITY_FULL for the next booking on the same UTC date, and then
            books the next date successfully - a strict superset of the triggerability claim.

      - name: a_fifth_negotiation_round_returns_the_round_limit_error
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_NEGOTIATION_ROUND_LIMIT]
          - validations[priority 15 -> ERR_NEGOTIATION_ROUND_LIMIT]
          - calculations.negotiation_round_control
        excluded_because:
          difficulty_instance: non_linear_state_machine / negotiation_cycles_four_alternating_turns_then_hits_round_cap
          rationale: >
            The cyclic-state instance walks all four alternating rounds and then asserts
            ERR_NEGOTIATION_ROUND_LIMIT on the fifth counter-offer while checking round_number
            froze at MAX_NEGOTIATION_ROUNDS. A standalone instance cannot reach the cap without
            replaying that same loop.

  # ===========================================================================
  # Guide section 7 - RBAC (role_model: segregation_of_duties)
  # ===========================================================================
  - section: rbac
    instances:

      - name: roles_cannot_invoke_another_roles_exclusive_operations
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.SellerOps.exclusive_operations
          - roles.Buyer.exclusive_operations
          - roles.MarketplaceOps.exclusive_operations
          - roles.TrustSafety.exclusive_operations
          - validations[priority 2 -> ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: >
          Five cross-role attempts, one per role, all rejected with the same priority-2
          ERR_ROLE_NOT_PERMITTED even though each request body is otherwise well formed and each
          target row exists - so the refusal is the role gate, not a shape or existence problem.
          Crucially the gate fires before priority 3 existence: TrustSafety closing an unknown
          listing still gets 403, not 404.
        test_recipe:
          setup:
            - "One seller, one warehouse, one qualified buyer and one DRAFT lot with a submitted manifest exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts"
              payload: { legal_name: "Gulf Resale Co", tax_id: "B-2001", state_code: "TX", contact_email: "buy@gulf.example", resale_certificate_number: "TX-RC-77", resale_certificate_expires_on: "2027-01-31", requested_credit_limit_cents: 10000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ba: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts/${ba}/qualification-decisions"
              payload: { decision: "QUALIFY", business_verified: true, approved_credit_limit_cents: 10000000 }
              as: TrustSafety
              as_user_id: "ts-1"
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Role gate lot", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-RG", unit_count: 200, unit_retail_cents: 10000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
          trigger:
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Buyer built lot", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: Buyer
              as_user_id: "${ba}"
              captures: { err_buyer_lot: "$.data.error_id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-reviews"
              payload: { decision: "APPROVE", review_note: "self review attempt" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { err_seller_review: "$.data.error_id" }
            - call: "POST /liquidation/listings/00000000-0000-0000-0000-000000000000/closures"
              payload: {}
              as: TrustSafety
              as_user_id: "ts-1"
              captures: { err_ts_close: "$.data.error_id" }
            - call: "POST /liquidation/buyer-accounts"
              payload: { legal_name: "Ops Provisioned Buyer", tax_id: "B-9999", state_code: "TX", contact_email: "ops@buy.example", resale_certificate_number: "TX-RC-99", resale_certificate_expires_on: "2027-01-31", requested_credit_limit_cents: 100000 }
              as: MarketplaceOps
