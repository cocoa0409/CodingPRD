          setup:
            - "P1 with LIN-SHEET-Q (par 6) and LIN-TOWEL-B (par 8) so the PROVISIONAL linen estimate is 14 units and net_cents 12554."
            - "Cleaner C has an OFFERED assignment on T1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
