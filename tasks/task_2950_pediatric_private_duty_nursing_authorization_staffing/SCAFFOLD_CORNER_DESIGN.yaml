              as_user_id: "${payer_id}"
            - call: "GET /pdn/shift-assignments/${asg_id}"
              payload: {}
              as: Scheduler
              as_user_id: "sch-001"
          assert:
            - "the hold response body itself reports status == \"ON_HOLD\", hold_reason == \"FAMILY_REQUEST\", unfilled_shift_count == 0 and fill_rate == 1.0000"
            - "the follow-up case read is identical on those four fields: nothing settled after the write"
            - "the authorization read shows hours_committed_this_week == 0.00 and hours_remaining_this_week == 40.00 with no intervening call"
            - "the assignment read shows status == \"CANCELLED\" with cancel_reason == \"CASE_HOLD\""
            - "GET /pdn/shifts?case_id=${case_id} shows both ${shift_a_id} and ${shift_b_id} with staffing_status \"CANCELLED\""
