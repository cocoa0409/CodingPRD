    side_effects: []

  - method: GET
    path: "/api/promo-rules/{promo_rule_id}"
    description: "Get promo rule"
    roles: [PlatformAdmin, VenueManager, Server]
    code: 200
    input: []
    output: PromoRule
    side_effects: []

  - method: GET
    path: "/api/promo-rules"
    description: "List promo rules with filters"
    roles: [PlatformAdmin, VenueManager, Server]
    code: 200
    input: ["day_of_week?", "wing_kind?"]
    output: PromoRule[]
    side_effects: []

  # --- Trivia ---
  - method: POST
    path: "/api/venues/{venue_id}/trivia-sessions"
    description: "Create a trivia session"
    roles: [Host]
    code: 201
    input: [title]
    output: TriviaSession
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/api/trivia-sessions/{session_id}"
    description: "Get trivia session"
    roles: [PlatformAdmin, VenueManager, Host]
    code: 200
    input: []
    output: TriviaSession
    side_effects: []

  - method: GET
    path: "/api/venues/{id}/trivia-sessions"
    description: "List trivia sessions for a venue"
    roles: [PlatformAdmin, VenueManager, Host]
    code: 200
    input: ["status?"]
    output: TriviaSession[]
    side_effects: []

  - method: POST
    path: "/api/trivia-sessions/{session_id}/entries"
