              payload: { plan_code: "DD-TO2", plan_year_start_month: 1, annual_maximum_cents: 150000, deductible_cents: 0, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /dental/plans/${plan_id}/limitation-rules"
              payload: { cdt_code: "D0120", rule_kind: "FREQUENCY", window_months: 6, max_occurrences: 2, age_years_min: 0, age_years_max: 0 }
              as: PlanAdmin
            - call: "POST /dental/providers"
              payload: { npi: "1234567803", legal_name: "Smile Dental 14", tier: "PPO", license_state: "CA", contracted_on: "2024-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2025-01-01T00:00:00Z", entries: [{ cdt_code: "D0120", allowed_cents: 5000, category: "PREVENTIVE", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-TO2", full_name: "Owen Prime", date_of_birth: "1980-01-01T00:00:00Z", effective_date: "2025-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-01-15T00:00:00Z", received_date: "2026-01-16T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_1: $.data.id }
            - call: "POST /dental/claims/${claim_1}/pay"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-07-15T00:00:00Z", received_date: "2026-07-16T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_2: $.data.id }
            - call: "POST /dental/claims/${claim_2}/pay"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-07-15T00:00:00Z", received_date: "2026-07-16T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_3: $.data.id }
            - call: "GET /dental/claims/${claim_3}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { c3_denial: "$.data[0].denial_code", c3_status: "$.data[0].status" }
          assert:
            - "claim 2 on 2026-07-15 was PAYABLE: the window [2026-01-15, 2026-07-15] includes the 2026-01-15 claim at its left edge (inclusive), so prior count was 1 and 1+1 <= 2"
            - "claim 3 on 2026-07-15 has prior count 2 (both priors inside the closed window) -> line denied with denial_code == FREQUENCY and claim status == DENIED"
            - "GET /dental/subscribers/${sub_id}/accumulators shows annual_max_used_cents == 10000 (only the two paid cleanings count)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: adjudicate_then_void_restores_annual_max_used
        grounds:
          - calculations.annual_max_accumulator
          - state_machines.Claim.ADJUDICATED_to_VOID
          - entities.BenefitAccumulator.fields.annual_max_used_cents
        distinguishing_aspect: |
          Conserved quantity = BenefitAccumulator.annual_max_used_cents.
          INVARIANT: for any claim that is adjudicated and later voided,
          annual_max_used_cents after the void equals its value before the
          claim. Adjudication moves it 0 -> 4000; void returns it to 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan: max 150000, deductible 0, major 50, no waiting, ABP off; PPO provider; schedule D2740 8000 ACTIVE; subscriber effective 2026-01-01."
