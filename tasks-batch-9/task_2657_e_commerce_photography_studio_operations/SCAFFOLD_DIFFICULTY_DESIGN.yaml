          - state_machines.ShootSession.BOOKED_to_LOCKED
          - state_machines.Sample.RECEIVED_to_IN_STUDIO
          - endpoints[POST /studio/shoot-sessions/{session_id}/lock]
        distinguishing_aspect: |
          Entity pair Sample -> ShootSession. The session's own fields are complete and unchanged
          across both attempts; only the custody_state of a Sample two hops away (via the item's
          Style) moves from RECEIVED to IN_STUDIO, and that alone converts a 409 into a LOCKED
          session.
        test_recipe:
          setup:
            - "Style TOP1001 whose MATCHED sample SMP-1001 is only RECEIVED - it has not reached the rack, so the style is still NOT_STARTED."
            - "One required ON_MODEL/FRONT item is created and assigned to a BOOKED 09:00-13:00 MODEL session."
