            - call: "GET /certifications/00000000-0000-4000-8000-000000000009"
              as: PerformanceDirector
              captures: { err_cert: $.data.error_id }
            - call: "GET /membership-packages/00000000-0000-4000-8000-00000000000a"
              as: PerformanceDirector
              captures: { err_package: $.data.error_id }
            - call: "GET /team-contracts/00000000-0000-4000-8000-00000000000b"
              as: PerformanceDirector
              captures: { err_contract: $.data.error_id }
            - call: "GET /rts-plans/00000000-0000-4000-8000-00000000000c"
              as: PerformanceDirector
