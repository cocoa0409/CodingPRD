              captures: { window_error: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-30T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/risk-pools/${pool_v6}/state"
              payload: { to_state: "SETTLED" }
              as: IpaAdmin
              captures: { pool_v6_status: "$.data.status" }
            - call: "GET /ipa/pool-distributions"
              payload: { pool_id: "${pool_v6}", status: "PAID", limit: 10, offset: 0 }
