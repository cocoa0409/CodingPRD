              as: Dispatcher
              as_user_id: "disp-001"
              captures: { ev_cam: $.data.id }
            - call: "POST /evidence-items/${ev_cam}/preserve"
              payload: { preserved_copy_uri: "s3://evidence/2923por/cam-4101.mp4", evidence_hash: "0f0f1a1a2b2b3c3c4d4d5e5e6f6f7a7a" }
              as: Dispatcher
