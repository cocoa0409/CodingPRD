          trigger:
            - { call: "GET /uro/projects/${p1}", payload: {}, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { rep_read_status: "$.data.status" } }
            - { call: "GET /uro/projects/${p1}", payload: {}, as: ExternalAuditor, captures: { auditor_read_status: "$.data.status" } }
            - { call: "GET /uro/projects/${p1}/clearance-summary", payload: {}, as: ConstructionEngineer, captures: { eng_posture: "$.data.clearance_posture", eng_open: "$.data.open_conflict_count" } }
            - { call: "GET /uro/investigations", payload: { project_id: "${p1}" }, as: RightOfWayAdjudicator, captures: { adj_first_inv: "$.data[0].id" } }
