        excluded_because:
          difficulty_instance: resource_temporal_overlap / site_seat_capacity_is_aggregate_half_open_and_ignores_remote_sittings
          rationale: "That §1.8 instance covers adjacency at gap 0, the aggregate capacity rejection and the exclusion of REMOTE sittings."
