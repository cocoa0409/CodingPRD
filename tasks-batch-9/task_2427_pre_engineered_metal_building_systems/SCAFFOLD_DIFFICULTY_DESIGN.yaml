        grounds:
          - calculations.production_line_window_conflict
          - validations[priority=14, error_id=ERR_LINE_WINDOW_CONFLICT]
          - entities.ProductionLine.fields.changeover_buffer_minutes
          - entities.ProductionLot.fields.window_start
          - entities.ProductionLot.fields.window_end
        distinguishing_aspect: |
          Resource: a ProductionLine. Interval semantics: HALF-OPEN [window_start, window_end) with a
          colour-dependent 120 minute changeover buffer applied on both sides. A lot that starts exactly at
