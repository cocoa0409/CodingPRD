# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across claim-extraction-guide sections. Names are unique across
# this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_item_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Item, endpoints]
        distinguishing_aspect: "POST /library/items with all required fields returns 201 and echoes category=TOOL, replacement_value_cents=12000, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /library/items"
              payload: { name: "Drill", category: "TOOL", replacement_value_cents: 12000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
          assert:
            - "response.code == 201"
            - "Item.${item_id}.category == TOOL"
            - "Item.${item_id}.replacement_value_cents == 12000"
            - "Item.${item_id}.version == 1"
            - "Item.${item_id}.available_copies_count == 0"

      - name: member_default_max_active_loans_applied
        claim_type: Defaults
        grounds: [entities.Member.fields.max_active_loans]
        distinguishing_aspect: "Omitting max_active_loans on POST /library/members applies the default 5."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /library/members"
              payload: { name: "Def", email: "def@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.max_active_loans == 5"
            - "Member.${m_id}.status == ACTIVE"
            - "Member.${m_id}.outstanding_balance_cents == 0"

      - name: create_member_missing_email_returns_validation
        claim_type: Required Fields
        grounds: [entities.Member.fields.email, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /library/members without email is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /library/members"
              payload: { name: "NoEmail", tier: "BASIC" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: get_member_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /library/members/{id} for an unknown UUID returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /library/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: item_computed_available_after_two_copies
        claim_type: Computed Fields
        grounds: [entities.Item.fields.available_copies_count, calculations.item_availability]
        distinguishing_aspect: "After adding two GOOD copies, item.available_copies_count==2 and serviceable_copies_count==2."
        test_recipe:
          setup: ["An item exists."]
          setup_api_calls:
            - call: "POST /library/items"
              payload: { name: "Axe", category: "OUTDOOR", replacement_value_cents: 4000, loan_period_days: 3, daily_late_fee_cents: 200 }
              as: Coordinator
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "AX-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "AX-2", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
          assert:
            - "Item.${item_id}.available_copies_count == 2"
            - "Item.${item_id}.serviceable_copies_count == 2"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: return_already_returned_loan_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Loan.OVERDUE_to_RETURNED, "errors[ERR_LOAN_NOT_ACTIVE]"]
        distinguishing_aspect: "Returning a loan already in RETURNED is rejected with ERR_LOAN_NOT_ACTIVE (409); no second fee is created."
        test_recipe:
          setup: ["A returned loan exists."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Ret", email: "ret@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Vise", category: "TOOL", replacement_value_cents: 5000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "V-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
            - call: "POST /library/loans/${loan_id}/return"
              payload: { return_condition: "GOOD" }
              as: Coordinator
          trigger:
            - call: "POST /library/loans/${loan_id}/return"
              payload: { return_condition: "GOOD" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_LOAN_NOT_ACTIVE"

      - name: cancel_already_cancelled_reservation_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Reservation.PENDING_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a reservation already CANCELLED is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A cancelled reservation exists."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Can", email: "can@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Cooler", category: "OUTDOOR", replacement_value_cents: 3000, loan_period_days: 3, daily_late_fee_cents: 200 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "CO-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/reservations"
              payload: { member_id: "${m_id}", item_id: "${item_id}", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-03T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
            - call: "POST /library/reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /library/reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: new_loan_starts_active_initial_state
        claim_type: Initial State
        grounds: [state_machines.Loan, entities.Loan.fields.status]
        distinguishing_aspect: "A freshly created loan starts in status ACTIVE with renewals_used=0."
        test_recipe:
          setup: ["A member, item, and copy exist; clock 2026-03-01."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Ini", email: "ini@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Clamp", category: "TOOL", replacement_value_cents: 2000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "CL-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
          trigger:
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
          assert:
            - "Loan.${loan_id}.status == ACTIVE"
            - "Loan.${loan_id}.renewals_used == 0"
            - "Loan.${loan_id}.due_date == 2026-03-08T00:00:00Z"

      - name: accept_already_accepted_donation_rejected
        claim_type: Idempotency
        grounds: [state_machines.Donation.OFFERED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a donation already ACCEPTED is rejected ERR_INVALID_STATE (409); only one copy was minted."
        test_recipe:
          setup: ["An accepted donation exists."]
          setup_api_calls:
            - call: "POST /library/items"
              payload: { name: "Grinder", category: "TOOL", replacement_value_cents: 7000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/donations"
              payload: { donor_name: "Anon", item_id: "${item_id}", proposed_condition: "GOOD" }
              as: Coordinator
              captures: { don_id: $.data.id }
            - call: "POST /library/donations/${don_id}/accept"
              payload: { asset_tag: "GR-1" }
              as: Coordinator
          trigger:
            - call: "POST /library/donations/${don_id}/accept"
              payload: { asset_tag: "GR-2" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: reservation_expiry_via_ops_run
        claim_type: Side Effect Execution
        grounds: [state_machines.Reservation.PENDING_to_EXPIRED, state_machines.ItemCopy.RESERVED_to_AVAILABLE]
        distinguishing_aspect: "An ops-run past window_end expires a PENDING reservation and releases its copy RESERVED->AVAILABLE."
        test_recipe:
          setup: ["A PENDING reservation for [2026-03-05,2026-03-07) exists; clock 2026-03-01."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Exp", email: "exp@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Spade", category: "OUTDOOR", replacement_value_cents: 2500, loan_period_days: 3, daily_late_fee_cents: 200 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "SP-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/reservations"
              payload: { member_id: "${m_id}", item_id: "${item_id}", window_start: "2026-03-05T00:00:00Z", window_end: "2026-03-07T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-08T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /library/_ops/run"
              payload: {}
              as: Coordinator
          assert:
            - "Reservation.${res_id}.status == EXPIRED"
            - "ItemCopy.${copy_id}.availability_status == AVAILABLE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: waitlist_promotion_head_selected_by_created_at
        claim_type: Correct Result
        grounds: [calculations.waitlist_promotion]
        excluded_because:
          difficulty_instance: transitive_cascade / maintenance_return_promotes_waitlist_head
          rationale: "Queue-head promotion by created_at ASC is exercised by the named §1.8 cascade instance."

      - name: usage_report_counts_active_and_overdue
        claim_type: Correct Result
        grounds: [calculations.usage_report, endpoints]
        distinguishing_aspect: "With one ACTIVE loan and one item, GET /library/reports/usage returns active_loans=1, overdue_loans=0."
        test_recipe:
          setup: ["One ACTIVE loan exists; clock 2026-03-01."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Rep", email: "rep@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Level", category: "TOOL", replacement_value_cents: 3000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "LV-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
          trigger:
            - call: "GET /library/reports/usage"
              payload: {}
              as: Coordinator
          assert:
            - "response.data.active_loans == 1"
            - "response.data.overdue_loans == 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: reserve_start_after_end_returns_invalid_window
        claim_type: Violation → Error
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "POST /library/reservations with window_start >= window_end returns ERR_INVALID_WINDOW (400)."
        test_recipe:
          setup: ["An ACTIVE member and an item with a copy exist."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Win", email: "win@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Rake", category: "OUTDOOR", replacement_value_cents: 1500, loan_period_days: 3, daily_late_fee_cents: 200 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "RK-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /library/reservations"
              payload: { member_id: "${m_id}", item_id: "${item_id}", window_start: "2026-04-05T00:00:00Z", window_end: "2026-04-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_WINDOW"

      - name: join_waitlist_when_copy_available_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_COPY_AVAILABLE_NO_HOLD]"]
        distinguishing_aspect: "Joining a waitlist while the item has an AVAILABLE serviceable copy returns ERR_COPY_AVAILABLE_NO_HOLD (409)."
        test_recipe:
          setup: ["An ACTIVE member; item with one AVAILABLE copy."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Wl", email: "wl@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Torch", category: "TOOL", replacement_value_cents: 2000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "TR-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /library/holds"
              payload: { member_id: "${m_id}", item_id: "${item_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_COPY_AVAILABLE_NO_HOLD"

      - name: duplicate_hold_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_HOLD]"]
        distinguishing_aspect: "A member already holding a PENDING hold on an item cannot join again — ERR_DUPLICATE_HOLD (409)."
        test_recipe:
          setup: ["Item with its only copy ON_LOAN; member has one PENDING hold on the item."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Du1", email: "du1@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m1: $.data.id }
            - call: "POST /library/members"
              payload: { name: "Du2", email: "du2@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m2: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Auger2", category: "OUTDOOR", replacement_value_cents: 8000, loan_period_days: 3, daily_late_fee_cents: 200 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "AG-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m1}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
            - call: "POST /library/holds"
              payload: { member_id: "${m2}", item_id: "${item_id}" }
              as: Member
              as_user_id: "${m2}"
              captures: { hold_id: $.data.id }
          trigger:
            - call: "POST /library/holds"
              payload: { member_id: "${m2}", item_id: "${item_id}" }
              as: Member
              as_user_id: "${m2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_HOLD"

      - name: renew_with_active_waitlist_rejected
        claim_type: Cross-entity validation
        grounds: [state_machines.Loan.ACTIVE_to_ACTIVE, "errors[ERR_RENEWAL_BLOCKED_WAITLIST]"]
        distinguishing_aspect: "Renewing a loan whose item has a PENDING hold is rejected ERR_RENEWAL_BLOCKED_WAITLIST (409)."
        test_recipe:
          setup: ["Item with one copy ON_LOAN to member1; member2 has a PENDING hold on the item; clock 2026-03-01."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Rn1", email: "rn1@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m1: $.data.id }
            - call: "POST /library/members"
              payload: { name: "Rn2", email: "rn2@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m2: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Nailer", category: "TOOL", replacement_value_cents: 9000, loan_period_days: 7, daily_late_fee_cents: 100, max_renewals: 2 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "N-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m1}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
            - call: "POST /library/holds"
              payload: { member_id: "${m2}", item_id: "${item_id}" }
              as: Member
              as_user_id: "${m2}"
          trigger:
            - call: "POST /library/loans/${loan_id}/renew"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RENEWAL_BLOCKED_WAITLIST"

      - name: priority_state_beats_balance_on_checkout_excluded
        claim_type: Priority Ordering
        grounds: ["validations[priority=6]", "validations[priority=14]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / checkout_member_suspended_beats_balance_limit
          rationale: "The state-vs-fiscal priority ordering on checkout is asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_copies_of_item_reverse_reachability
        claim_type: Cross-reference link
        grounds: [entities.ItemCopy.fields.item_id, endpoints]
        distinguishing_aspect: "GET /library/items/{id}/copies returns the ItemCopy[] whose item_id equals the parent id."
        test_recipe:
          setup: ["An item with one copy exists."]
          setup_api_calls:
            - call: "POST /library/items"
              payload: { name: "Planer", category: "TOOL", replacement_value_cents: 6000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "PL-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
          trigger:
            - call: "GET /library/items/${item_id}/copies"
              payload: { limit: 10, offset: 0 }
              as: Coordinator
          assert:
            - "response.response_type == array"
            - "response.data[0].id == ${copy_id}"
            - "response.meta has total_count and has_more"

      - name: list_loans_by_member_filter
        claim_type: Cross-reference link
        grounds: [entities.Loan.fields.member_id, endpoints]
        distinguishing_aspect: "GET /library/loans?member_id={id} returns only that member's loans (FK reverse for Loan.member_id)."
        test_recipe:
          setup: ["A member with one ACTIVE loan exists; clock 2026-03-01."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Lm", email: "lm@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Bit", category: "TOOL", replacement_value_cents: 1200, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "BT-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
          trigger:
            - call: "GET /library/loans"
              payload: { member_id: "${m_id}" }
              as: Coordinator
          assert:
            - "response.response_type == array"
            - "response.data[0].id == ${loan_id}"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: member_cannot_create_item_unauthorized
        claim_type: RBAC denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Member calling POST /library/items (Coordinator-exclusive) is rejected ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["An ACTIVE member exists."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Mc", email: "mc@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /library/items"
              payload: { name: "Sneaky", category: "TOOL", replacement_value_cents: 100, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: member_cannot_cancel_others_reservation
        claim_type: RBAC denial
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_NOT_OWNER]"]
        distinguishing_aspect: "A Member cancelling another member's reservation is rejected ERR_FORBIDDEN_NOT_OWNER (403)."
        test_recipe:
          setup: ["member1 owns a PENDING reservation; member2 is a different ACTIVE member."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Ow1", email: "ow1@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m1: $.data.id }
            - call: "POST /library/members"
              payload: { name: "Ow2", email: "ow2@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m2: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Waders", category: "OUTDOOR", replacement_value_cents: 5000, loan_period_days: 3, daily_late_fee_cents: 200 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "WD-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/reservations"
              payload: { member_id: "${m1}", item_id: "${item_id}", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-03T00:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /library/reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN_NOT_OWNER"

      - name: volunteer_entity_backed_checkout_succeeds
        claim_type: peer_roles
        grounds: [roles, entities.Volunteer, endpoints]
        distinguishing_aspect: "A Volunteer (X-User-ID = a Volunteer.id) may perform POST /library/loans checkout and it succeeds (201)."
        test_recipe:
          setup: ["A volunteer, member, item, and copy exist; clock 2026-03-01."]
          setup_api_calls:
            - call: "POST /library/volunteers"
              payload: { name: "Val", role_level: "VOLUNTEER" }
              as: Coordinator
              captures: { vol_id: $.data.id }
            - call: "POST /library/members"
              payload: { name: "Vm", email: "vm@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Broom", category: "KITCHEN", replacement_value_cents: 1000, loan_period_days: 14, daily_late_fee_cents: 50 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "BR-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
          trigger:
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { loan_id: $.data.id }
          assert:
            - "response.code == 201"
            - "Loan.${loan_id}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: checkout_stale_item_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[checkout-stale-item]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a successful checkout bumps Item.version, a second checkout still carrying the pre-bump expected_item_version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An item with two copies; clock 2026-03-01; client has read the item version before any checkout."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Occ", email: "occ@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Jigsaw", category: "TOOL", replacement_value_cents: 8000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "JS-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copyA: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "JS-2", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copyB: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copyA}", expected_item_version: "${iv}" }
              as: Coordinator
          trigger:
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copyB}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: derived_available_count_after_checkout
        claim_type: derived_field_reconciliation
        grounds: [entities.Item.fields.available_copies_count, entities.Item.fields.on_loan_count]
        distinguishing_aspect: "After checking out the only copy, item.available_copies_count==0 and on_loan_count==1."
        test_recipe:
          setup: ["An item with one copy; clock 2026-03-01."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Dr", email: "dr@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Chisel", category: "TOOL", replacement_value_cents: 1800, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "CH-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
          trigger:
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
          assert:
            - "Item.${item_id}.available_copies_count == 0"
            - "Item.${item_id}.on_loan_count == 1"

      - name: rate_threshold_late_fee_first_billable_day
        claim_type: rate_threshold_triggers
        grounds: [calculations.late_fee]
        distinguishing_aspect: "At days_overdue==GRACE_DAYS+1 (3), the first billable day yields exactly one day of late fee = 100 cents on return."
        test_recipe:
          setup: ["A loan due 2026-03-08 for a TOOL item (daily 100); clock advanced to 2026-03-11 (3 days overdue) with ops-run applied."]
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Rt", email: "rt@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Drill3", category: "TOOL", replacement_value_cents: 12000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "D3-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/_ops/run"
              payload: {}
              as: Coordinator
            - call: "GET /library/fees"
              payload: { loan_id: "${loan_id}" }
              as: Coordinator
              captures: { fee_id: "$.data[0].id" }
          trigger:
            - call: "POST /library/loans/${loan_id}/return"
              payload: { return_condition: "GOOD" }
              as: Coordinator
          assert:
            - "Fee.${fee_id}.amount_cents == 100"
            - "Fee.${fee_id}.status == PENDING"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_on_create_member
        claim_type: immediate
        grounds: [entities.Member]
        distinguishing_aspect: "POST /library/members returns the created member in the same response with status ACTIVE (immediate consistency)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /library/members"
              payload: { name: "Imm", email: "imm@x.com", tier: "PLUS" }
              as: Coordinator
              captures: { m_id: $.data.id }
          assert:
            - "response.code == 201"
            - "Member.${m_id}.status == ACTIVE"
            - "Member.${m_id}.tier == PLUS"
