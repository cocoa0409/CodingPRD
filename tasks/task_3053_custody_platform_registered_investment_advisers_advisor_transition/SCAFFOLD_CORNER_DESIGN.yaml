      - name: model_weights_must_total_exactly_ten_thousand_bps
        claim_type: Violation to Error
        grounds:
          - validations[priority=29]
          - errors[ERR_MODEL_WEIGHTS_INVALID]
        distinguishing_aspect: "Weights summing to 9999 and to 10001 are both rejected with ERR_MODEL_WEIGHTS_INVALID, while exactly 10000 is accepted — the check is exact equality, not a tolerance band."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement and granted MODEL_MANAGEMENT, one draft model."
          setup_api_calls:
            - *z_clock
            - *z_firm
