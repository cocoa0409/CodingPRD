  - rule_id: transitive_cascade
    instances:
      - name: freeze_cascade_freezes_records_declines_requests_and_invalidates_attestations
        grounds:
          - state_machines.Employer.REQUESTED_to_ACTIVE
          - state_machines.EmploymentRecord.CURRENT_to_FROZEN
          - state_machines.VerificationRequest.PERMITTED_to_DECLINED
          - state_machines.VerificationAttestation.attestation_state
        distinguishing_aspect: |
          A four-hop causal chain rooted in the Employer freeze transition: the
          employer's freeze freezes its records, the newly frozen records cause the
          open request to be declined, and that decline is what invalidates the
          attestation, so the last hop cannot fire without the one before it.
        test_recipe:
          setup:
            - "worker with a MONTHLY employer, one VERIFIED span, a captured authorization and one request at PERMITTED"
