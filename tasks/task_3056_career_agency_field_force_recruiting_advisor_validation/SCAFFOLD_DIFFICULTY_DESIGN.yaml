          setup:
            - "Logical clock at 2026-09-30T00:00:00Z. MD -> DD -> REP. REP unlocked from licensing demotion, holds an active licence, registration and approved appointment, has a 100000-requirement window and a 204000-cent credit, and is still VALIDATING so the DD and MD currently accrue 0 override."
