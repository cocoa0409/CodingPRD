              as: CorpsDirector
              captures: { cancel_err: "$.data.error_id" }
          assert:
            - "${confirm_err} == ERR_INVALID_STOP_STATE with HTTP 409"
            - "${complete_err} == ERR_INVALID_STOP_STATE with HTTP 409"
            - "${cancel_err} == ERR_INVALID_STOP_STATE with HTTP 409"
            - "TourStop.${stop_id}.status is still CANCELLED, cancel_reason is still venue lost, and version is unchanged from the value after the first cancel"

