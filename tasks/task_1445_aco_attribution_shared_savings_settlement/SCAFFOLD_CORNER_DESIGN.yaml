      - name: truncation_cap_boundary_summary
        claim_type: correct_result
        grounds: ["calculations.expenditure_aggregation_with_truncation"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / truncation_at_exact_cap_vs_one_cent_over"
