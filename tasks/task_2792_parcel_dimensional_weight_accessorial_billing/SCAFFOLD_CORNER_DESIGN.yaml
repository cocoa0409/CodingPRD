          assert:
            - "Both inductions returned 201 — the missing row is a pricing-time failure, not an intake-time one, and Shipment.${heavy}.billable_weight_lbs == 58"
            - "${light_total} == 2660 — the light parcel is priceable by the single 1-20 lb row"
            - "The heavy preview returns HTTP 422 with ${err_preview} == ERR_RATE_ROW_MISSING"
            - "The sweep returns HTTP 422 with ${err_sweep} == ERR_RATE_ROW_MISSING even though one of the two candidates was priceable — the whole invoice is rejected"
            - "GET /invoices returns total_count == 0 and no InvoiceLine exists: GET /invoice-lines returns total_count == 0"
            - "Both shipments are still billing_status UNBILLED and ShipperAccount.${sh}.unbilled_shipment_count == 2 — the failed sweep rolled back completely"

      - name: settled_invoice_state_check_outranks_the_credit_ceiling_check
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: settled_invoice_state_check_outranks_the_credit_ceiling_check
          rationale: |
            The §1.8 priority_pair_validation_conflict instance already builds one request
            that violates both ERR_INVOICE_NOT_ADJUSTABLE (priority 27) and
            ERR_CREDIT_EXCEEDS_INVOICE_NET (priority 55) and asserts the lower priority wins,
            then relaxes the state violation to show the ceiling error surfacing. Repeating
            that pair here would add nothing.

      - name: dispute_window_closure_outranks_the_duplicate_dispute_rule
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: dispute_window_closure_outranks_the_duplicate_dispute_rule
          rationale: |
            The §1.8 priority_pair_validation_conflict instance already drives a single POST
            /disputes that is simultaneously a duplicate (priority 39) and past
            dispute_deadline_utc (priority 37) and pins the response to
            ERR_DISPUTE_WINDOW_CLOSED, with the complementary in-window call returning
            ERR_DUPLICATE_DISPUTE.

      - name: guarantee_lateness_uses_strict_inequality_at_the_commitment_instant
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: guarantee_lateness_uses_strict_inequality_at_the_commitment_instant
          rationale: |
            The §1.8 boundary_precision_check instance already delivers one parcel exactly at
            guarantee_deadline_utc (rejected with ERR_SHIPMENT_NOT_LATE) and its twin one
            second later (accepted with late_by_seconds 1), which is the strict-inequality
            temporal boundary in full. This section's own temporal instance covers the
            separate CLAIM_WINDOW_DAYS edge instead.

  # =====================================================================
  # SECTION 5 — ENDPOINTS (§1.5)
  # =====================================================================
  - section: endpoints
    instances:
      - name: shipment_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /shipments]
          - endpoints[GET /shipments/{id}]
          - endpoints[GET /shipments]
        distinguishing_aspect: |
          The create/read/list triple for the central entity: three identical parcels are
          inducted, one is delivered, and the list endpoint separates them by movement_status
          while pagination reports total_count 3 across two pages.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
            - "Three parcels 1Z-E-1001, 1Z-E-1002 and 1Z-E-1003 are each 12 x 10 x 8 in at 6.0 lb, zone 2."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-E-1001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p1: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-E-1002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p2: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-E-1003", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p3: $.data.id }
            - call: "POST /shipments/${p1}/deliver"
              payload: {}
              as: CarrierOps
            - call: "GET /shipments/${p1}"
              payload: {}
              as: BillingOps
              captures: { got: $.data.id, tn: $.data.tracking_number, bw: $.data.billable_weight_lbs, mv: $.data.movement_status }
            - call: "GET /shipments"
              payload: { shipper_id: "${sh}", movement_status: "DELIVERED" }
              as: BillingOps
