  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: audit_fail_depth4_cascade
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_SUSPENDED
          - state_machines.PodVariety.ACTIVE_to_SUPPLY_BLOCKED
          - state_machines.ProductionRun.RESERVED_to_CANCELLED
          - endpoints."POST /license-agreements/{id}/quality-audits"
        distinguishing_aspect: |
          Depth-4 chain from the audit-create trigger: QualityAudit FAIL -> LicenseAgreement
          SUSPENDED -> brand's PodVariety ACTIVE -> SUPPLY_BLOCKED -> that variety's RESERVED
          ProductionRun -> CANCELLED -> the FillingLine window capacity is bookable again —
          each link caused by the previous one, and IN_PROGRESS runs are conditionally spared.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Licensed brand L with ACTIVE agreement and ACTIVE variety V_L; owned brand P with ACTIVE variety V_P. One line (cap 100000/day, changeover 0). V_L has a RESERVED run 2026-09-10..2026-09-11 planned 50000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Cascade Coffee", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { tc1_bl: $.data.id }
            - call: "POST /brands"
              payload: { name: "Platform Select", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { tc1_bp: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${tc1_bl}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { tc1_ag: $.data.id }
            - call: "POST /license-agreements/${tc1_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
            - call: "POST /pod-varieties"
              payload: { brand_id: "${tc1_bl}", name: "Cascade Dark", roast_level: "DARK", flavor_family: "UNFLAVORED", wholesale_price_cents: 115, margin_cents: 32 }
              as: BrandManager
              as_user_id: "${tc1_bl}"
              captures: { tc1_vl: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${tc1_bp}", name: "Select Medium", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 105, margin_cents: 28 }
