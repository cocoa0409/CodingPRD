              payload: { test_date: "2026-10-10", start_time: "12:30", end_time: "14:00", room_label: "R1", total_seats: 10, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "13:00", end_time: "15:00", room_label: "R1", total_seats: 10, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s2: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:30", end_time: "11:00", room_label: "R2", total_seats: 10, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s3: $.data.id }
          assert:
            - "12:30 start in R1: error_id == ERR_SESSION_OVERLAP (gap 30 < 60 minutes)"
            - "13:00 start in R1: created (gap exactly 60 satisfies the >= 60 buffer)"
            - "08:30 start in R2: created (buffer is per-room; R2 has no prior session) — TestSession.${s3} exists"

      - name: proctor_strict_overlap_adjacency_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_PROCTOR_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: strict-overlap rule on the staff resource with
          adjacency allowed — a proctor may take back-to-back sessions
          (12:00 touching 12:00 is NOT an overlap) but may not take strictly
          overlapping ones. Different semantics (no buffer, half-open
          intervals) and a different resource entity (Staff, not the room)
          than the session-buffer instance.
        test_recipe:
          setup:
            - "AUTHORIZED center with three sessions on 2026-10-10 in three rooms: S1 08:00-12:00 R1, S2 12:00-14:00 R2, S3 13:00-15:00 R3; one proctor P"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center PO", facility_seat_capacity: 60, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr PO", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Proc PO", staff_role: "PROCTOR", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 10, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s1: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "12:00", end_time: "14:00", room_label: "R2", total_seats: 10, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s2: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "13:00", end_time: "15:00", room_label: "R3", total_seats: 10, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /ets/sessions/${s1}/proctors"
              payload: { staff_id: "${pro_id}" }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/sessions/${s2}/proctors"
              payload: { staff_id: "${pro_id}" }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/sessions/${s3}/proctors"
              payload: { staff_id: "${pro_id}" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "assign P to S1: succeeds"
            - "assign P to S2 (12:00 start touches S1's 12:00 end): succeeds — adjacency is not overlap"
            - "assign P to S3 (13:00-15:00 strictly overlaps S2 12:00-14:00): error_id == ERR_PROCTOR_OVERLAP"
            - "TestSession.${s2}.proctor_staff_ids contains ${pro_id} and TestSession.${s3}.proctor_staff_ids does not"

  - rule_id: compensating_invariant
    instances:
      - name: seat_count_conservation_register_cancel
        grounds:
          - calculations.seat_pool_capacity
          - calculations.waitlist_promotion_selection
          - state_machines.Registration
        distinguishing_aspect: |
          Conserved quantity: per-session registration accounting. Register and
          cancel are compensating actions: with a waitlisted registrant, a
          cancellation plus its triggered promotion leaves confirmed_count
          unchanged; overall confirmed + waitlisted + cancelled always equals
          the total registrations ever created for the session.
        test_recipe:
          setup:
            - "AUTHORIZED center, PUBLISHED session total_seats 3 reserved 0; examinees E1..E4 registered in order (E1-E3 CONFIRMED, E4 WAITLISTED)"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center SC", facility_seat_capacity: 10, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr SC", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 3, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex S1", date_of_birth: "2000-01-15", id_document_type: "PASSPORT", id_document_number: "PS01", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_1: $.data.id }
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex S2", date_of_birth: "2000-02-15", id_document_type: "PASSPORT", id_document_number: "PS02", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_2: $.data.id }
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex S3", date_of_birth: "2000-03-15", id_document_type: "PASSPORT", id_document_number: "PS03", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_3: $.data.id }
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex S4", date_of_birth: "2000-04-15", id_document_type: "PASSPORT", id_document_number: "PS04", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_4: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v1: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_1}", expected_session_version: "${s_v1}" }
              as: Examinee
              as_user_id: "${ex_1}"
              captures: { r_1: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v2: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_2}", expected_session_version: "${s_v2}" }
              as: Examinee
              as_user_id: "${ex_2}"
              captures: { r_2: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v3: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_3}", expected_session_version: "${s_v3}" }
              as: Examinee
              as_user_id: "${ex_3}"
              captures: { r_3: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v4: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_4}", expected_session_version: "${s_v4}" }
              as: Examinee
              as_user_id: "${ex_4}"
              captures: { r_4: $.data.id }
          trigger:
            - call: "POST /ets/registrations/${r_2}/cancel"
              as: ProgramAdmin
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
            - call: "POST /ets/registrations/${r_4}/cancel"
              as: ProgramAdmin
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
          assert:
            - "after cancelling ${r_2}: Registration.${r_4}.booking_status == CONFIRMED (earliest-created WAITLISTED promoted) and TestSession.${s_id}.confirmed_count == 3 (cancel + promotion conserve the confirmed count)"
            - "after cancelling ${r_4}: TestSession.${s_id}.confirmed_count == 2 and waitlist_count == 0"
            - "invariant: confirmed(2) + waitlisted(0) + cancelled(2) == 4 == total registrations ever created for ${s_id}"
            - "Registration.${r_4}.waitlist_position == null after each promotion/cancel"

      - name: released_report_count_conservation_send_recall
        grounds:
          - state_machines.ScoreReport
          - entities.ScoreRecord.fields.released_report_count
        distinguishing_aspect: |
          Conserved quantity: ScoreRecord.released_report_count (a different
          quantity than seat counts). Send and recall are compensating: two
          sends raise the count to 2, and the cancellation-triggered recall of
          both reports returns it to exactly 0 — its pre-send value — with
          count == live RELEASED reports at every step.
        test_recipe:
          setup:
            - "administered session with one clean RELEASED score (raws [10,10,10], prior 30, no similarity), two reports sent to MIT2026 and YALE2026, then a substantiated CONTENT_EXPOSURE irregularity adjudicated CANCELLED"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center RC", facility_seat_capacity: 20, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr RC", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Proc RC", staff_role: "PROCTOR", certification_level: "BASIC" }
              as: ProgramAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 5, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/sessions/${s_id}/proctors"
              payload: { staff_id: "${pro_id}" }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex RC", date_of_birth: "2001-07-07", id_document_type: "PASSPORT", id_document_number: "PRC1", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_a: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_a}", expected_session_version: "${s_v}" }
              as: Examinee
              as_user_id: "${ex_a}"
              captures: { r_a: $.data.id }
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T07:45:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/lock"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/registrations/${r_a}/check-in"
              payload: { id_document_number: "PRC1", id_document_expiry: "2027-06-01", biometric_sample: "bio-rc" }
              as: Proctor
              as_user_id: "${pro_id}"
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/administer"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/registrations/${r_a}/score-entry"
              payload: { section_raws: [10, 10, 10], prior_best_scaled_score: 30, matched_responses_count: 0, total_scored_items: 40, same_form: true, adjacent_seated: false }
              as: ScoreAnalyst
              captures: { sc_a: $.data.id }
            - call: "POST /ets/score-analysis/run"
              payload: { session_id: "${s_id}" }
              as: ScoreAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ets/score-records/${sc_a}/reports"
              payload: { institution_code: "MIT2026" }
              as: ScoreAnalyst
              captures: { rep_1: $.data.id }
            - call: "POST /ets/score-records/${sc_a}/reports"
              payload: { institution_code: "YALE2026" }
              as: ScoreAnalyst
              captures: { rep_2: $.data.id }
            - call: "POST /ets/sessions/${s_id}/irregularity-reports"
              payload: { registration_id: "${r_a}", category: "CONTENT_EXPOSURE", severity: "HIGH", narrative: "Leak confirmed" }
              as: Proctor
              as_user_id: "${pro_id}"
              captures: { irr_a: $.data.id }
            - call: "POST /ets/irregularity-reports/${irr_a}/resolve"
              payload: { resolution: "SUBSTANTIATED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /ets/registrations/${r_a}/review-cases"
              as: ProgramAdmin
              captures: { case_a: "$.data[0].id" }
            - call: "POST /ets/score-review-cases/${case_a}/notify"
              as: ScoreAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /ets/registrations/${r_a}/review-cases"
              as: ProgramAdmin
              captures: { case_v: "$.data[0].version" }
          trigger:
            - call: "POST /ets/score-review-cases/${case_a}/adjudicate"
              payload: { outcome: "CANCELLED", rationale: "Exposure proven", expected_case_version: "${case_v}" }
              as: ProgramAdmin
              as_user_id: "admin-2"
            - call: "GET /ets/score-records/${sc_a}"
              as: ScoreAnalyst
            - call: "GET /ets/score-records/${sc_a}/reports"
              as: ScoreAnalyst
          assert:
            - "after the two sends: ScoreRecord.${sc_a}.released_report_count == 2"
            - "after adjudication CANCELLED: ScoreRecord.${sc_a}.released_report_count == 0 (back to the pre-send value)"
            - "ScoreReport.${rep_1}.status == RECALLED and ScoreReport.${rep_2}.status == RECALLED"
            - "invariant at every step: released_report_count == count of this record's ScoreReports with status RELEASED"
