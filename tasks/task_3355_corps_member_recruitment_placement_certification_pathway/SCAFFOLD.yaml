scenario: "Corps Member Recruitment, Placement & Certification Pathway (Teach For America): applicant recruitment on campuses with selection based on leadership and achievement criteria rather than education coursework, regional placement matching corps members to partner districts and schools with subject and grade needs, pre-service summer training institute with practice teaching and certification coursework, alternative certification pathway coordination with state requirements varying by region, school district partnership agreements with placement fees and hiring commitments, two-year commitment tracking with support coaching, evaluation and early exit handling, certification progress monitoring against state deadlines that affect employment eligibility, alumni pipeline and continued teaching retention measurement"
domain_name: "corps-recruitment-placement-certification"
api_prefix: "/corps"
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: string
        source: input
        description: "Short operator-facing region code, e.g. `GULF-COAST`; unique across all Regions."
        constraints: "unique; immutable after create"
      - name: name
        type: string
        source: input
        description: "Human-readable region name."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code the region operates in; drives which CertificationPathway rows are legal for the region."
        constraints: "exactly 2 uppercase letters"
      - name: term_start_date
        type: datetime
        source: input
        description: "First day of the school term for this region's cohort; the anchor from which every certification deadline is measured."
      - name: base_placement_fee_cents
        type: integer
        source: input
        description: "Region-level default placement fee in cents, used when a PartnerDistrict does not override it."
      - name: max_corps_members
        type: integer
        source: input
        description: "Regional quota: the maximum number of CorpsMembers in ACTIVE service the region may carry at one time."
        constraints: ">= 1"
  - name: PartnerDistrict
    parent: null
    common_fields: true
    fields:
      - name: region_id
        type: string
        source: input
        description: "FK -> Region.id; the region that owns this district partnership agreement."
      - name: name
        type: string
        source: input
        description: "School district legal name."
      - name: agreement_status
        type: enum
        source: computed
        description: "Lifecycle of the partnership agreement; starts DRAFT at create."
        constraints: "one of DRAFT, ACTIVE, SUSPENDED, EXPIRED"
      - name: hiring_commitment_slots
        type: integer
        source: input
        description: "Number of corps members the district contractually commits to hire this term."
        constraints: ">= 0"
      - name: placement_fee_per_member_cents
        type: integer
        source: input
        description: "Fee the district pays per corps member actually placed into one of its schools."
        constraints: ">= 0"
      - name: unfilled_slot_penalty_cents
        type: integer
        source: input
        description: "Penalty the district pays for each committed slot left unfilled at term start."
        constraints: ">= 0"
      - name: fee_budget_cents
        type: integer
        source: input
        description: "Ceiling on total fees and penalties the district may be invoiced for this term."
        constraints: ">= 0"
      - name: committed_placement_count
        type: integer
        source: computed
        description: "Derived count of Placements whose school belongs to this district and whose status is CONFIRMED or ACTIVE."
        default: 0
      - name: invoice_amount_cents
        type: integer
        source: computed
        description: "Derived invoice total; see calculation `district_invoice_amount_cents`."
        default: 0
  - name: PartnerSchool
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: "FK -> PartnerDistrict.id; the partner district that operates this school."
      - name: name
        type: string
        source: input
        description: "School name as it appears on the partnership agreement."
      - name: grade_band
        type: enum
        source: input
        description: "Grade band served by the school; a Placement may only target a school whose band equals the placement's grade_band."
        constraints: "one of ELEMENTARY, MIDDLE, HIGH"
      - name: subject_needs
        type: array
        source: input
        description: "Subject areas the school has an open need for this term; a Placement subject_area must appear in this list."
        constraints: "subset of MATH, SCIENCE, ENGLISH, HISTORY, SPED, BILINGUAL; at least one element"
      - name: classroom_capacity
        type: integer
        source: input
        description: "Number of corps members the school can host in an overlapping term window."
        constraints: ">= 1"
      - name: occupied_classrooms
        type: integer
        source: computed
        description: "Derived count of Placements at this school whose status is CONFIRMED or ACTIVE and whose term window is open at the current logical clock."
        default: 0
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Applicant legal name."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across all Applicants."
        constraints: "unique; immutable after create"
      - name: campus_name
        type: string
        source: input
        description: "Recruitment campus the applicant was sourced from."
      - name: campus_tier
        type: enum
        source: input
        description: "Recruitment priority tier of the campus; PRIORITY campuses earn a selection-score bonus."
        constraints: "one of PRIORITY, STANDARD, DEVELOPING"
      - name: graduation_year
        type: integer
        source: input
        description: "Expected or actual graduation year."
        constraints: ">= 2000"
      - name: leadership_score
        type: number
        source: input
        description: "Recruiter-assessed leadership score on a 0-100 scale; a selection eligibility gate reads this value."
        constraints: "0 <= leadership_score <= 100"
      - name: achievement_score
        type: number
        source: input
        description: "Recruiter-assessed achievement score on a 0-100 scale."
        constraints: "0 <= achievement_score <= 100"
      - name: gpa
        type: number
        source: input
        description: "Self-reported undergraduate GPA on a 0.0-4.0 scale; the provisional selection score reads this field."
        constraints: "0.0 <= gpa <= 4.0"
  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the applicant who submitted this application."
      - name: preferred_region_id
        type: string
        source: input
        description: "FK -> Region.id; the region the applicant asked to be placed in."
      - name: subject_area
        type: enum
        source: input
        description: "Subject the applicant is applying to teach; several selection-score branches and school-need checks read it."
        constraints: "one of MATH, SCIENCE, ENGLISH, HISTORY, SPED, BILINGUAL"
      - name: grade_preference
        type: enum
        source: input
        description: "Grade band the applicant prefers; a Placement may only target a school whose grade_band equals this value."
        constraints: "one of ELEMENTARY, MIDDLE, HIGH"
      - name: status
        type: enum
        source: computed
        description: "Selection pipeline state; starts SUBMITTED at create."
        constraints: "one of SUBMITTED, UNDER_REVIEW, RETURNED_FOR_REVISION, SELECTED, REJECTED, OFFER_EXTENDED, ACCEPTED, DECLINED"
      - name: verified_gpa
        type: number
        source: input
        description: "Transcript-verified GPA supplied by the reviewer; the final selection score reads this field instead of the self-reported gpa."
        constraints: "0.0 <= verified_gpa <= 4.0"
      - name: revision_count
        type: integer
        source: computed
        description: "Derived count of times the application has been returned for revision; increments on every UNDER_REVIEW -> RETURNED_FOR_REVISION transition."
        default: 0
      - name: selection_score
        type: number
        source: computed
        description: "Derived provisional selection score; see calculation `selection_score`."
        default: 0.0
      - name: final_selection_score
        type: number
        source: computed
        description: "Derived final selection score computed from verified_gpa; see calculation `selection_score`."
        default: 0.0
      - name: decision_reason
        type: string
        source: input
        description: "Free-text rationale captured when a reviewer records a decision."
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: "Opaque operator id of the SelectionManager who last ran review; the segregation-of-duties check compares it to decided_by_user_id."
      - name: decided_by_user_id
        type: string
        source: computed
        description: "Opaque operator id of the SelectionManager who recorded the decision."
      - name: offer_expires_at
        type: datetime
        source: computed
        description: "Timestamp after which an outstanding offer may no longer be accepted."
      - name: created_corps_member_id
        type: string
        source: computed
        description: "Id of the CorpsMember synthesized when the offer was accepted; null until then."
      - name: returned_at
        type: datetime
        source: computed
        description: "Timestamp of the most recent return-for-revision, used for the resubmission window."
  - name: CertificationPathway
    parent: null
    common_fields: true
    fields:
      - name: region_id
        type: string
        source: input
        description: "FK -> Region.id; the region whose state requirements this pathway encodes."
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code of the certifying authority; must equal the owning Region's state_code."
        constraints: "exactly 2 uppercase letters"
      - name: certification_track
        type: enum
        source: input
        description: "Alternative-certification track the pathway belongs to."
        constraints: "one of STANDARD, ALTERNATIVE_EMERGENCY, PROVISIONAL"
      - name: required_coursework_hours
        type: integer
        source: input
        description: "Certification coursework hours the state requires before the term-start deadline."
        constraints: ">= 1"
      - name: required_practice_hours
        type: integer
        source: input
        description: "Supervised practice-teaching hours the state requires before the term-start deadline."
        constraints: ">= 1"
      - name: deadline_days_before_term
        type: integer
        source: input
        description: "Number of days before the owning Region's term_start_date by which every milestone must be VERIFIED."
        constraints: ">= 0"
      - name: coursework_fee_cents
        type: integer
        source: input
        description: "Fee charged for the pathway's certification coursework, prorated by coursework progress."
        constraints: ">= 0"
  - name: CorpsMember
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the accepted application that produced this corps member."
      - name: cohort_year
        type: integer
        source: input
        description: "Corps cohort year, e.g. 2026."
        constraints: ">= 2000"
      - name: institute_status
        type: enum
        source: computed
        description: "Pre-service summer training institute dimension; starts ENROLLED at synthesis."
        constraints: "one of ENROLLED, IN_TRAINING, COMPLETED"
      - name: service_status
        type: enum
        source: computed
        description: "Two-year commitment dimension; starts ACTIVE at synthesis and evolves independently of institute_status."
        constraints: "one of ACTIVE, ON_LEAVE, EXITED"
      - name: practice_teaching_hours
        type: integer
        source: computed
        description: "Accumulated supervised practice-teaching hours recorded during the institute."
        default: 0
      - name: coursework_hours_completed
        type: integer
        source: computed
        description: "Accumulated certification coursework hours recorded during the institute."
        default: 0
      - name: certification_hours_verified
        type: integer
        source: computed
        description: "Derived sum of required_hours over this member's VERIFIED and COMPLETED certification milestones; see calculation `certification_hours_verified`."
        default: 0
      - name: readiness_score
        type: number
        source: computed
        description: "Derived placement-readiness score computed from the member's own certification state; see calculation `readiness_score`."
        default: 0.0
      - name: institute_stipend_cents
        type: integer
        source: computed
        description: "Derived pre-service stipend; see calculation `institute_stipend_cents`."
        default: 0
      - name: service_started_at
        type: datetime
        source: computed
        description: "Timestamp of the most recent return to ACTIVE service; anchors the two-year commitment window."
      - name: leave_started_at
        type: datetime
        source: computed
        description: "Timestamp of the most recent transition into ON_LEAVE; null while service_status is ACTIVE."
      - name: exit_reason
        type: string
        source: input
        description: "Reason captured when the member exits the corps before completing the two-year commitment."
  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: corps_member_id
        type: string
        source: input
        description: "FK -> CorpsMember.id; the corps member being placed."
      - name: school_id
        type: string
        source: input
        description: "FK -> PartnerSchool.id; the partner school hosting the placement."
      - name: subject_area
        type: enum
        source: input
        description: "Subject the corps member teaches at this placement; must appear in the target school's subject_needs."
        constraints: "one of MATH, SCIENCE, ENGLISH, HISTORY, SPED, BILINGUAL"
      - name: grade_band
        type: enum
        source: input
        description: "Grade band taught at this placement; must equal both the school's grade_band and the application's grade_preference."
        constraints: "one of ELEMENTARY, MIDDLE, HIGH"
      - name: status
        type: enum
        source: computed
        description: "Placement lifecycle; starts MATCHED at create."
        constraints: "one of MATCHED, CONFIRMED, ACTIVE, EXITED_EARLY, COMPLETED"
      - name: term_start_date
        type: datetime
        source: input
        description: "First day of the placement's term window; the closed interval [term_start_date, term_end_date] is the school-capacity occupation."
      - name: term_end_date
        type: datetime
        source: input
        description: "Last day of the placement's term window, inclusive."
      - name: confirmed_at
        type: datetime
        source: computed
        description: "Timestamp of the MATCHED -> CONFIRMED transition."
      - name: activated_at
        type: datetime
        source: computed
        description: "Timestamp of the CONFIRMED -> ACTIVE transition."
      - name: early_exit_reason
        type: string
        source: input
        description: "Reason captured when the placement ends before term_end_date."
      - name: employment_eligible
        type: boolean
        source: computed
        description: "Derived flag: true only while the placement is CONFIRMED or ACTIVE, the corps member is in ACTIVE service with a COMPLETED institute, no milestone of that member is OVERDUE, and certification_hours_verified meets the pathway's combined practice plus coursework requirement; see calculation `employment_eligibility`."
        default: false
      - name: placement_fee_cents
        type: integer
        source: computed
        description: "Derived fee this placement bills to the owning district; see calculation `placement_fee_cents`."
        default: 0
  - name: CertificationMilestone
    parent: null
    common_fields: true
    fields:
      - name: corps_member_id
        type: string
        source: input
        description: "FK -> CorpsMember.id; the corps member whose certification progress this milestone tracks."
      - name: pathway_id
        type: string
        source: input
        description: "FK -> CertificationPathway.id; the state pathway this milestone belongs to."
      - name: milestone_type
        type: enum
        source: input
        description: "Category of certification requirement."
        constraints: "one of COURSEWORK, PRACTICUM, EXAM, ORIENTATION"
      - name: required_hours
        type: integer
        source: input
        description: "Hours this milestone contributes to the member's verified certification hours once verified."
        constraints: ">= 0"
      - name: due_date
        type: datetime
        source: input
        description: "State deadline for this milestone, derived at create from the region term start minus the pathway's deadline_days_before_term unless supplied."
      - name: progress_status
        type: enum
        source: computed
        description: "First parallel dimension of the milestone; advances PENDING -> IN_PROGRESS -> COMPLETED independently of verification_status."
        constraints: "one of PENDING, IN_PROGRESS, COMPLETED"
      - name: verification_status
        type: enum
        source: computed
        description: "Second parallel dimension of the milestone; advances UNVERIFIED -> VERIFIED or UNVERIFIED -> REJECTED independently of progress_status."
        constraints: "one of UNVERIFIED, VERIFIED, REJECTED"
      - name: completed_at
        type: datetime
        source: computed
        description: "Timestamp of the PENDING|IN_PROGRESS -> COMPLETED transition."
      - name: completed_by_user_id
        type: string
        source: computed
        description: "Opaque operator id of the CertificationOfficer who marked the milestone COMPLETED; the segregation-of-duties check compares it to verified_by_user_id."
      - name: verified_by_user_id
        type: string
        source: computed
        description: "Opaque operator id of the CertificationOfficer who verified the milestone."
      - name: deadline_status
        type: enum
        source: computed
        description: "Derived deadline pressure band; see calculation `certification_deadline_status`."
        constraints: "one of OVERDUE, AT_RISK, ON_TRACK, SATISFIED"
      - name: days_remaining
        type: integer
        source: computed
        description: "Derived whole days between the logical clock's current date and due_date; see calculation `certification_deadline_status`."
        default: 0
  - name: SupportRecord
    parent: null
    common_fields: true
    fields:
      - name: corps_member_id
        type: string
        source: input
        description: "FK -> CorpsMember.id; the corps member this support interaction belongs to."
      - name: record_type
        type: enum
        source: input
        description: "Polymorphic discriminator: COACHING records are support-coaching sessions, EVALUATION records are formal performance evaluations."
        constraints: "one of COACHING, EVALUATION"
      - name: coach_user_id
        type: string
        source: input
        description: "Opaque operator id of the Coach or evaluator who ran the session; COACHING records for the same coach_user_id may not overlap in time."
      - name: session_start
        type: datetime
        source: input
        description: "Start of the session; the coaching occupation is the half-open interval [session_start, session_end)."
      - name: session_end
        type: datetime
        source: input
        description: "End of the session, exclusive."
      - name: effectiveness_score
        type: integer
        source: input
        description: "Evaluator rating on a 1-5 scale; EVALUATION records with a score below 3 flag the member for early-exit review."
        constraints: "1 <= effectiveness_score <= 5"
      - name: notes
        type: string
        source: input
        description: "Free-text coaching or evaluation notes."
state_machines:
  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [REJECTED, ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /corps/applications/{id}/review"
        actor: SelectionManager
        preconditions:
          - "Application.status == SUBMITTED"
          - "Applicant.leadership_score >= 40.0 for the owning applicant; otherwise the review is refused and the application stays SUBMITTED."
        side_effects:
          - "Sets Application.status = UNDER_REVIEW and Application.reviewed_by_user_id = X-User-ID."
          - "Recomputes Application.selection_score using the provisional variant of calculation `selection_score` (reads Applicant.gpa)."
          - "Refreshes Application.updated_at and increments Application.version by 1."
        note: "Entry point of the selection pipeline; the leadership floor is the Rule-6 boundary metric for this endpoint."
      - from: UNDER_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /corps/applications/{id}/return"
        actor: SelectionManager
        preconditions:
          - "Application.status == UNDER_REVIEW"
          - "Application.revision_count < 3"
        side_effects:
          - "Sets Application.status = RETURNED_FOR_REVISION, Application.revision_count += 1 and Application.returned_at = current logical clock."
          - "Refreshes Application.updated_at and increments Application.version by 1."
      - from: RETURNED_FOR_REVISION
        to: UNDER_REVIEW
        trigger: "POST /corps/applications/{id}/resubmit"
        actor: Applicant
        preconditions:
          - "Application.status == RETURNED_FOR_REVISION"
          - "X-User-ID equals Application.applicant_id (the acting Applicant owns this application)."
          - "The resubmission window is still open: current logical clock <= Application.returned_at + 30 days."
        side_effects:
          - "Sets Application.status = UNDER_REVIEW and clears Application.returned_at to null."
          - "Refreshes Application.updated_at and increments Application.version by 1."
        note: "Closing edge of the revision cycle RETURNED_FOR_REVISION -> UNDER_REVIEW -> RETURNED_FOR_REVISION."
      - from: UNDER_REVIEW
        to: SELECTED
        trigger: "POST /corps/applications/{id}/decision with decision=SELECT"
        actor: SelectionManager
        preconditions:
          - "Application.status == UNDER_REVIEW"
          - "X-User-ID != Application.reviewed_by_user_id (segregation of duties)."
          - "The final selection score is at or above the SELECT band: final_selection_score >= 85.00."
        side_effects:
          - "Sets Application.status = SELECTED and Application.decided_by_user_id = X-User-ID."
          - "Recomputes Application.final_selection_score using the final variant of calculation `selection_score` (reads Application.verified_gpa)."
          - "Refreshes Application.updated_at and increments Application.version by 1."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /corps/applications/{id}/decision with decision=REJECT"
        actor: SelectionManager
        preconditions:
          - "Application.status == UNDER_REVIEW"
          - "X-User-ID != Application.reviewed_by_user_id (segregation of duties)."
        side_effects:
          - "Sets Application.status = REJECTED and Application.decided_by_user_id = X-User-ID."
          - "Refreshes Application.updated_at and increments Application.version by 1."
      - from: SELECTED
        to: OFFER_EXTENDED
        trigger: "POST /corps/applications/{id}/offer"
        actor: SelectionManager
        preconditions:
          - "Application.status == SELECTED"
          - "PartnerDistrict.agreement_status == ACTIVE for at least one district in Application.preferred_region_id."
        side_effects:
          - "Sets Application.status = OFFER_EXTENDED and Application.offer_expires_at = current logical clock + 14 days."
          - "Refreshes Application.updated_at and increments Application.version by 1."
      - from: DECLINED
        to: OFFER_EXTENDED
        trigger: "POST /corps/applications/{id}/offer"
        actor: SelectionManager
        preconditions:
          - "Application.status == DECLINED"
          - "PartnerDistrict.agreement_status == ACTIVE for at least one district in Application.preferred_region_id."
        side_effects:
          - "Sets Application.status = OFFER_EXTENDED and Application.offer_expires_at = current logical clock + 14 days."
          - "Refreshes Application.updated_at and increments Application.version by 1."
        note: "Re-offer edge; DECLINED is therefore not terminal."
      - from: OFFER_EXTENDED
        to: ACCEPTED
        trigger: "POST /corps/applications/{id}/offer/respond with accept=true"
        actor: Applicant
        preconditions:
          - "Application.status == OFFER_EXTENDED"
          - "X-User-ID equals Application.applicant_id."
          - "current logical clock <= Application.offer_expires_at."
          - "The owning Region is not over quota: count(CorpsMember whose Application.preferred_region_id == this region and service_status IN {ACTIVE, ON_LEAVE}) < Region.max_corps_members."
        side_effects:
          - "Cascade hop 1: sets Application.status = ACCEPTED and creates a CorpsMember with application_id = this Application.id, cohort_year = year(Region.term_start_date), service_status = ACTIVE, institute_status = ENROLLED, practice_teaching_hours = 0, coursework_hours_completed = 0, certification_hours_verified = 0, readiness_score = 0.0, institute_stipend_cents = 0; writes the new id onto Application.created_corps_member_id."
          - "Cascade hop 2: the CorpsMember creation synthesizes one CertificationMilestone per (pathway, milestone_type) pair for every CertificationPathway whose region_id equals Application.preferred_region_id, with required_hours taken from the pathway's required_practice_hours for PRACTICUM, required_coursework_hours for COURSEWORK and ORIENTATION, and 0 for EXAM, and due_date = Region.term_start_date minus pathway.deadline_days_before_term days. The four milestones are synthesized in the fixed order COURSEWORK, PRACTICUM, ORIENTATION, EXAM, and that order is the order the milestone list endpoints return."
          - "Cascade hop 3: each synthesized CertificationMilestone creation recomputes CorpsMember.certification_hours_verified and CorpsMember.readiness_score and advances CorpsMember.version once per milestone."
          - "Refreshes Application.updated_at and increments Application.version by 1."
      - from: OFFER_EXTENDED
        to: DECLINED
        trigger: "POST /corps/applications/{id}/offer/respond with accept=false"
        actor: Applicant
        preconditions:
          - "Application.status == OFFER_EXTENDED"
          - "X-User-ID equals Application.applicant_id."
        side_effects:
          - "Sets Application.status = DECLINED and clears Application.offer_expires_at to null."
          - "Refreshes Application.updated_at and increments Application.version by 1."
  - entity: CorpsMember
    initial_state: ACTIVE
    terminal_states: [EXITED]
    transitions:
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "POST /corps/corps-members/{id}/leave"
        actor: PlacementCoordinator
        preconditions:
          - "CorpsMember.service_status == ACTIVE"
        side_effects:
          - "Sets CorpsMember.service_status = ON_LEAVE and CorpsMember.leave_started_at = current logical clock."
          - "Recomputes Placement.employment_eligible = false for every Placement of this member whose status is CONFIRMED or ACTIVE."
          - "Refreshes CorpsMember.updated_at and increments CorpsMember.version by 1."
      - from: ON_LEAVE
        to: ACTIVE
        trigger: "POST /corps/corps-members/{id}/return-from-leave"
        actor: PlacementCoordinator
        preconditions:
          - "CorpsMember.service_status == ON_LEAVE"
        side_effects:
          - "Sets CorpsMember.service_status = ACTIVE, clears leave_started_at to null and sets service_started_at = current logical clock."
          - "Recomputes Placement.employment_eligible for every Placement of this member whose status is CONFIRMED or ACTIVE."
          - "Refreshes CorpsMember.updated_at and increments CorpsMember.version by 1."
        note: "Closing edge of the leave cycle ACTIVE -> ON_LEAVE -> ACTIVE."
      - from: ACTIVE
        to: EXITED
        trigger: "POST /corps/corps-members/{id}/exit"
        actor: PlacementCoordinator
        preconditions:
          - "CorpsMember.service_status == ACTIVE"
        side_effects:
          - "Sets CorpsMember.service_status = EXITED and CorpsMember.exit_reason from the request."
          - "Refreshes CorpsMember.updated_at and increments CorpsMember.version by 1."
      - from: ENROLLED
        to: IN_TRAINING
        trigger: "POST /corps/corps-members/{id}/institute/practice-hours"
        actor: InstituteDirector
        preconditions:
          - "CorpsMember.institute_status == ENROLLED"
        side_effects:
          - "Sets CorpsMember.institute_status = IN_TRAINING and adds the request's practice_hours_delta to CorpsMember.practice_teaching_hours."
          - "Recomputes CorpsMember.institute_stipend_cents (calculation `institute_stipend_cents`) and CorpsMember.readiness_score."
          - "Refreshes CorpsMember.updated_at and increments CorpsMember.version by 1."
      - from: IN_TRAINING
        to: IN_TRAINING
        trigger: "POST /corps/corps-members/{id}/institute/practice-hours"
        actor: InstituteDirector
        preconditions:
          - "CorpsMember.institute_status == IN_TRAINING"
          - "CorpsMember.practice_teaching_hours + practice_hours_delta <= 480"
        side_effects:
          - "Adds practice_hours_delta to CorpsMember.practice_teaching_hours."
          - "Recomputes CorpsMember.institute_stipend_cents and CorpsMember.readiness_score."
          - "Refreshes CorpsMember.updated_at and increments CorpsMember.version by 1."
      - from: IN_TRAINING
        to: COMPLETED
        trigger: "POST /corps/corps-members/{id}/institute/complete"
        actor: InstituteDirector
        preconditions:
          - "CorpsMember.institute_status == IN_TRAINING"
          - "CorpsMember.practice_teaching_hours >= 120"
        side_effects:
          - "Sets CorpsMember.institute_status = COMPLETED."
          - "Recomputes CorpsMember.readiness_score and finalizes CorpsMember.institute_stipend_cents."
          - "Refreshes CorpsMember.updated_at and increments CorpsMember.version by 1."
    note: "This machine carries two parallel state dimensions on one row: institute_status (ENROLLED -> IN_TRAINING -> COMPLETED, with IN_TRAINING -> IN_TRAINING self-loop) and service_status (ACTIVE <-> ON_LEAVE, plus ACTIVE -> EXITED). The two dimensions advance independently; a member may be ON_LEAVE while IN_TRAINING."
  - entity: CertificationMilestone
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /corps/certification-milestones/{id}/start"
        actor: CertificationOfficer
        preconditions:
          - "CertificationMilestone.progress_status == PENDING"
          - "CertificationMilestone.verification_status == UNVERIFIED"
          - "CorpsMember.service_status IN {ACTIVE, ON_LEAVE} for the owning corps member."
        side_effects:
          - "Sets CertificationMilestone.progress_status = IN_PROGRESS."
          - "Refreshes CertificationMilestone.updated_at and increments CertificationMilestone.version by 1."
      - from: PENDING
        to: COMPLETED
        trigger: "POST /corps/certification-milestones/{id}/complete"
        actor: CertificationOfficer
        preconditions:
          - "CertificationMilestone.progress_status == PENDING"
          - "CertificationMilestone.required_hours == 0"
          - "CorpsMember.institute_status IN {IN_TRAINING, COMPLETED} for the owning corps member."
        side_effects:
          - "Sets CertificationMilestone.progress_status = COMPLETED, completed_at = current logical clock and completed_by_user_id = X-User-ID."
          - "Recomputes CorpsMember.readiness_score (calculation `readiness_score`) and CorpsMember.coursework_hours_completed (calculation `coursework_hours_completed`)."
          - "Refreshes CertificationMilestone.updated_at and increments CertificationMilestone.version by 1."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /corps/certification-milestones/{id}/complete"
        actor: CertificationOfficer
        preconditions:
          - "CertificationMilestone.progress_status == IN_PROGRESS"
          - "CorpsMember.institute_status IN {IN_TRAINING, COMPLETED} for the owning corps member."
        side_effects:
          - "Sets CertificationMilestone.progress_status = COMPLETED, completed_at = current logical clock and completed_by_user_id = X-User-ID."
          - "Recomputes CorpsMember.readiness_score (calculation `readiness_score`) and CorpsMember.coursework_hours_completed (calculation `coursework_hours_completed`)."
          - "Refreshes CertificationMilestone.updated_at and increments CertificationMilestone.version by 1."
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /corps/certification-milestones/{id}/verify with outcome=VERIFY"
        actor: CertificationOfficer
        preconditions:
          - "CertificationMilestone.verification_status == UNVERIFIED"
          - "CertificationMilestone.progress_status == COMPLETED"
          - "X-User-ID != CertificationMilestone.completed_by_user_id (segregation of duties)."
        side_effects:
          - "Sets CertificationMilestone.verification_status = VERIFIED and verified_by_user_id = X-User-ID."
          - "Cascade hop 1: recomputes CorpsMember.certification_hours_verified (calculation `certification_hours_verified`) and CorpsMember.readiness_score (calculation `readiness_score`)."
          - "Cascade hop 2: the hop-1 recompute triggers a recompute of Placement.employment_eligible (calculation `employment_eligibility`) for every Placement of the same corps member whose status IN {CONFIRMED, ACTIVE}."
          - "Refreshes CertificationMilestone.updated_at and increments CertificationMilestone.version by 1."
      - from: UNVERIFIED
        to: REJECTED
        trigger: "POST /corps/certification-milestones/{id}/verify with outcome=REJECT"
        actor: CertificationOfficer
        preconditions:
          - "CertificationMilestone.verification_status == UNVERIFIED"
          - "CertificationMilestone.progress_status == COMPLETED"
          - "X-User-ID != CertificationMilestone.completed_by_user_id (segregation of duties)."
        side_effects:
          - "Sets CertificationMilestone.verification_status = REJECTED and verified_by_user_id = X-User-ID."
          - "Recomputes CorpsMember.certification_hours_verified (a REJECTED milestone contributes 0 hours) and CorpsMember.readiness_score."
          - "Refreshes CertificationMilestone.updated_at and increments CertificationMilestone.version by 1."
    note: "Two parallel dimensions on one row: progress_status (PENDING -> IN_PROGRESS -> COMPLETED, plus the PENDING -> COMPLETED shortcut for zero-hour milestones) and verification_status (UNVERIFIED -> VERIFIED | REJECTED). A milestone may sit at progress_status=COMPLETED with verification_status=UNVERIFIED indefinitely; the two dimensions never gate each other except through the explicit preconditions listed above."
  - entity: Placement
    initial_state: MATCHED
    terminal_states: [COMPLETED]
    transitions:
      - from: MATCHED
        to: CONFIRMED
        trigger: "POST /corps/placements/{id}/confirm"
        actor: PlacementCoordinator
        preconditions:
          - "Placement.status == MATCHED"
          - "PartnerDistrict.agreement_status == ACTIVE for the district owning Placement.school_id."
          - "CorpsMember.service_status == ACTIVE for the owning corps member."
          - "Placement.subject_area appears in the target PartnerSchool.subject_needs."
          - "Placement.grade_band equals the target PartnerSchool.grade_band and the owning Application.grade_preference."
        side_effects:
          - "Sets Placement.status = CONFIRMED and Placement.confirmed_at = current logical clock."
          - "Cascade hop 1: increments PartnerDistrict.committed_placement_count by 1 for the district owning Placement.school_id."
          - "Cascade hop 2: the hop-1 increment triggers a recompute of PartnerDistrict.invoice_amount_cents (calculation `district_invoice_amount_cents`) and of Placement.placement_fee_cents (calculation `placement_fee_cents`)."
          - "Recomputes Placement.employment_eligible (calculation `employment_eligibility`)."
          - "Refreshes Placement.updated_at and increments Placement.version by 1."
      - from: CONFIRMED
        to: ACTIVE
        trigger: "POST /corps/placements/{id}/activate"
        actor: PlacementCoordinator
        preconditions:
          - "Placement.status == CONFIRMED"
          - "CorpsMember.institute_status == COMPLETED for the owning corps member."
          - "CorpsMember.readiness_score >= 60.0."
        side_effects:
          - "Sets Placement.status = ACTIVE and Placement.activated_at = current logical clock."
          - "Recomputes Placement.employment_eligible (calculation `employment_eligibility`)."
          - "Recomputes PartnerDistrict.invoice_amount_cents (calculation `district_invoice_amount_cents`)."
          - "Refreshes Placement.updated_at and increments Placement.version by 1."
      - from: ACTIVE
        to: COMPLETED
        trigger: "system event: the logical clock reaches Placement.term_end_date"
        actor: system
        preconditions:
          - "Placement.status == ACTIVE"
          - "current logical clock >= Placement.term_end_date"
        side_effects:
          - "Sets Placement.status = COMPLETED and Placement.employment_eligible = false."
          - "Decrements PartnerDistrict.committed_placement_count by 1 and recomputes PartnerDistrict.invoice_amount_cents."
          - "Decrements PartnerSchool.occupied_classrooms by 1."
          - "Refreshes Placement.updated_at and increments Placement.version by 1."
      - from: ACTIVE
        to: EXITED_EARLY
        trigger: "POST /corps/placements/{id}/early-exit"
        actor: PlacementCoordinator
        preconditions:
          - "Placement.status == ACTIVE"
        side_effects:
          - "Sets Placement.status = EXITED_EARLY, Placement.early_exit_reason from the request, and Placement.employment_eligible = false."
          - "Cascade hop 1: decrements PartnerDistrict.committed_placement_count by 1 for the district owning Placement.school_id, and decrements PartnerSchool.occupied_classrooms by 1."
          - "Cascade hop 2: the hop-1 decrement triggers a recompute of PartnerDistrict.invoice_amount_cents (calculation `district_invoice_amount_cents`)."
          - "Cascade hop 3: the hop-2 invoice recompute triggers a re-evaluation of the district's fee ceiling; if invoice_amount_cents exceeds PartnerDistrict.fee_budget_cents the district is flagged by setting PartnerDistrict.agreement_status = SUSPENDED."
          - "Refreshes Placement.updated_at and increments Placement.version by 1."
      - from: EXITED_EARLY
        to: ACTIVE
        trigger: "POST /corps/placements/{id}/reinstate"
        actor: PlacementCoordinator
        preconditions:
          - "Placement.status == EXITED_EARLY"
          - "PartnerDistrict.agreement_status == ACTIVE for the district owning Placement.school_id."
          - "CorpsMember.service_status == ACTIVE for the owning corps member."
        side_effects:
          - "Sets Placement.status = ACTIVE, clears Placement.early_exit_reason to null and sets Placement.employment_eligible from calculation `employment_eligibility`."
          - "Cascade hop 1: increments PartnerDistrict.committed_placement_count by 1 and increments PartnerSchool.occupied_classrooms by 1."
          - "Cascade hop 2: the hop-1 increment triggers a recompute of PartnerDistrict.invoice_amount_cents (calculation `district_invoice_amount_cents`)."
          - "Refreshes Placement.updated_at and increments Placement.version by 1."
        note: "Compensating action for POST /corps/placements/{id}/early-exit; see the `early_exit_reinstate_conserves_committed_count` invariant."
  - entity: PartnerDistrict
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /corps/partner-districts/{id}/status with to_status=ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "PartnerDistrict.agreement_status == DRAFT"
          - "At least one PartnerSchool exists with district_id == this PartnerDistrict.id."
        side_effects:
          - "Sets PartnerDistrict.agreement_status = ACTIVE."
          - "Refreshes PartnerDistrict.updated_at and increments PartnerDistrict.version by 1."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /corps/partner-districts/{id}/status with to_status=ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "PartnerDistrict.agreement_status == SUSPENDED"
          - "PartnerDistrict.invoice_amount_cents <= PartnerDistrict.fee_budget_cents."
        side_effects:
          - "Sets PartnerDistrict.agreement_status = ACTIVE."
          - "Refreshes PartnerDistrict.updated_at and increments PartnerDistrict.version by 1."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /corps/partner-districts/{id}/status with to_status=SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "PartnerDistrict.agreement_status == ACTIVE"
        side_effects:
          - "Sets PartnerDistrict.agreement_status = SUSPENDED."
          - "Sets Placement.status = CONFIRMED -> unchanged for existing placements, but every subsequent MATCHED -> CONFIRMED transition in this district is refused while the district is SUSPENDED."
          - "Refreshes PartnerDistrict.updated_at and increments PartnerDistrict.version by 1."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: the logical clock reaches the owning Region.term_start_date"
        actor: system
        preconditions:
          - "PartnerDistrict.agreement_status == ACTIVE"
          - "current logical clock >= Region.term_start_date for the owning region."
        side_effects:
          - "Sets PartnerDistrict.agreement_status = EXPIRED."
          - "Refreshes PartnerDistrict.updated_at and increments PartnerDistrict.version by 1."
concurrency_rules:
  - rule_id: placement-create-stale-member
    parent_entity: CorpsMember
    write_endpoint: "POST /corps/placements"
    occ_field: "expected_corps_member_version"
    description: |
      Creating a Placement against a CorpsMember whose version has advanced
      since the client last observed it is rejected. The product legitimately
      allows a corps member to carry a second placement record (a re-placement
      after an early exit or a subject change), so a strictly later create
      would itself be accepted; the write is refused only because the caller's
      observed CorpsMember.version is stale.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
  - rule_id: school-create-stale-district
    parent_entity: PartnerDistrict
    write_endpoint: "POST /corps/partner-schools"
    occ_field: "expected_district_version"
    description: |
      Creating a PartnerSchool under a PartnerDistrict whose version has
      advanced since the client last observed it is rejected. A district may
      legitimately hold many schools, so a strictly later create would itself
      be accepted; the write is refused only because the caller's observed
      PartnerDistrict.version is stale.
    error_id: ERR_STALE_DISTRICT_VERSION
    http_status: 412

calculations:
  - name: selection_score
    trigger: "Recomputed on POST /corps/applications (provisional), on POST /corps/applications/{id}/review (provisional, refreshed), and on POST /corps/applications/{id}/decision (final)."
    algorithm: combinatorial_formula
    formula: |
      # Mode (a): >=3 inputs with non-linear interaction (nested min, conditional branches).
      gpa_used        = Application.verified_gpa if variant == "final" else Applicant.gpa
      gpa_normalized  = min(gpa_used, 4.0) / 4.0 * 100
      base            = Applicant.leadership_score * LEADERSHIP_WEIGHT
                      + Applicant.achievement_score * ACHIEVEMENT_WEIGHT
                      + gpa_normalized * GPA_WEIGHT
      if Applicant.campus_tier == "PRIORITY":                      base = min(100.0, base + CAMPUS_TIER_BONUS)
      if Application.subject_area IN {MATH, SCIENCE, SPED}:        base = min(100.0, base + HIGH_NEED_SUBJECT_BONUS)
      score = round_half_up(base, 2)
      band  = "STRONG" if score >= STRONG_BAND_MIN else ("QUALIFIED" if score >= QUALIFIED_BAND_MIN else "DEVELOPING")
    input_set: "Exactly one Application plus its owning Applicant. The provisional variant reads Applicant.gpa; the final variant reads Application.verified_gpa. No other entity enters the formula."
    constants:
      LEADERSHIP_WEIGHT: 0.45
      ACHIEVEMENT_WEIGHT: 0.40
      GPA_WEIGHT: 0.15
      CAMPUS_TIER_BONUS: 5.0
      HIGH_NEED_SUBJECT_BONUS: 7.0
      STRONG_BAND_MIN: 85.00
      QUALIFIED_BAND_MIN: 70.00
    precision: "2 decimal places, round_half_up; applied once, after every bonus has been added"
    variants:
      - name: provisional
        when: "Written to Application.selection_score at POST /corps/applications and refreshed at POST /corps/applications/{id}/review."
        difference: "Reads the self-reported Applicant.gpa. Identical weights, bonuses, banding and rounding otherwise."
      - name: final
        when: "Written to Application.final_selection_score at POST /corps/applications/{id}/decision."
        difference: "Reads Application.verified_gpa (the transcript-verified value) in place of Applicant.gpa. For the same Application the two variants diverge whenever verified_gpa != Applicant.gpa, and the SELECT gate reads only the final variant."
  - name: district_invoice_amount_cents
    trigger: "Recomputed on POST /corps/placements/{id}/confirm, POST /corps/placements/{id}/activate, POST /corps/placements/{id}/early-exit, POST /corps/placements/{id}/reinstate, and on the system ACTIVE -> COMPLETED placement transition."
    algorithm: threshold
    formula: |
      filled   = count(Placement p where p.school_id belongs to a PartnerSchool whose district_id == this PartnerDistrict.id
                       and p.status IN {CONFIRMED, ACTIVE})
      unfilled = max(0, PartnerDistrict.hiring_commitment_slots - filled)
      gross    = filled * PartnerDistrict.placement_fee_per_member_cents
      penalty  = unfilled * PartnerDistrict.unfilled_slot_penalty_cents
      invoice_amount_cents = gross + penalty        # variant "actual"
    input_set: "The PartnerDistrict itself plus every Placement whose school resolves to that district and whose status IN {CONFIRMED, ACTIVE}. Placements in MATCHED, EXITED_EARLY or COMPLETED are excluded from `filled`."
    constants:
      NOTHING: 0
    precision: "integer cents, no rounding step"
    variants:
      - name: actual
        when: "Stored in PartnerDistrict.invoice_amount_cents on every recompute trigger listed above."
        difference: "Counts only Placements that actually reached CONFIRMED or ACTIVE, and adds an unfilled-slot penalty for the remainder of the hiring commitment."
      - name: forward_looking
        when: "Used by GET /corps/partner-districts/{id} when the caller passes projection=FORWARD_LOOKING."
        difference: "Assumes every committed slot fills: invoice_amount_cents = hiring_commitment_slots * placement_fee_per_member_cents, with no penalty term. For any district with at least one unfilled slot the two variants return different integers."
  - name: institute_stipend_cents
    trigger: "Recomputed on POST /corps/corps-members/{id}/institute/practice-hours and finalized on POST /corps/corps-members/{id}/institute/complete."
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding. The evaluation order is PINNED as
      # "round each week's amount to 2 decimals, then sum" -- NOT "sum then round".
      weekly_amount = round_half_up(ANNUAL_STIPEND_DOLLARS / WEEKS_PER_YEAR, 2)      # 6510.00 / 52 -> 125.19
      whole_weeks   = CorpsMember.practice_teaching_hours // HOURS_PER_WEEK
      remainder     = CorpsMember.practice_teaching_hours %  HOURS_PER_WEEK
      partial_amount= round_half_up(weekly_amount * remainder / HOURS_PER_WEEK, 2)
      stipend_dollars = whole_weeks * weekly_amount + partial_amount
      institute_stipend_cents = int(round_half_up(stipend_dollars * 100, 0))
    input_set: "Only CorpsMember.practice_teaching_hours. Institute hours below HOURS_PER_WEEK yield whole_weeks == 0 and pay only the prorated partial_amount."
    constants:
      ANNUAL_STIPEND_DOLLARS: 6510.00
      WEEKS_PER_YEAR: 52
      HOURS_PER_WEEK: 40
    precision: "Dollars rounded to 2 decimal places with round_half_up per week and per partial week BEFORE summing; the summed dollars are then converted to integer cents with round_half_up at 0 decimals."
    variants: []
  - name: readiness_score
    trigger: "Recomputed on every CorpsMember mutation that changes institute hours, service status or verified certification hours, and on every CertificationMilestone transition whose side effects list this calculation."
    algorithm: constraint_propagation
    formula: |
      # Mode (c): circular-looking dependency with a PINNED evaluation order.
      # support_credit is keyed on the tier of `subtotal`, and `subtotal` is the
      # value BEFORE the credit is added -- the credit is never re-keyed on the
      # final readiness_score.
      certified_hours      = sum(m.required_hours for m in CertificationMilestone
                                 where m.corps_member_id == this member
                                   and m.progress_status == COMPLETED
                                   and m.verification_status == VERIFIED)
      total_required_hours = sum(m.required_hours for m in CertificationMilestone
                                 where m.corps_member_id == this member)
      certified_ratio      = 1.0 if total_required_hours == 0 else min(1.0, certified_hours / total_required_hours)
      practice_ratio       = min(1.0, CorpsMember.practice_teaching_hours   / pathway.required_practice_hours)
      coursework_ratio     = min(1.0, CorpsMember.coursework_hours_completed / pathway.required_coursework_hours)
      subtotal             = round_half_up(100.0 * (0.5 * certified_ratio + 0.3 * practice_ratio + 0.2 * coursework_ratio), 2)
      tier                 = "STRONG" if subtotal >= 80.00 else ("QUALIFIED" if subtotal >= 50.00 else "DEVELOPING")
      support_credit       = {"STRONG": 3.0, "QUALIFIED": 1.5, "DEVELOPING": 0.0}[tier]
      readiness_score      = min(100.0, round_half_up(subtotal + support_credit, 2))
    input_set: "The CorpsMember, every CertificationMilestone whose corps_member_id equals that member, and exactly one CertificationPathway. Pathway selection is pinned: use the pathway whose region_id equals the region of the member's Placement with status IN {CONFIRMED, ACTIVE}; when the member has no such placement, use the pathway of the member's Application.preferred_region_id whose created_at is earliest, breaking a created_at tie by the lower pathway id string only after the created_at comparison has been made."
    constants:
      CERTIFIED_WEIGHT: 0.5
      PRACTICE_WEIGHT: 0.3
      COURSEWORK_WEIGHT: 0.2
      STRONG_TIER_MIN: 80.00
      QUALIFIED_TIER_MIN: 50.00
      STRONG_SUPPORT_CREDIT: 3.0
      QUALIFIED_SUPPORT_CREDIT: 1.5
      DEVELOPING_SUPPORT_CREDIT: 0.0
      READINESS_CEILING: 100.0
    precision: "2 decimal places, round_half_up; `subtotal` is rounded before the tier lookup, and the final sum is rounded again"
    variants: []
  - name: certification_hours_verified
    trigger: "Recomputed on every CertificationMilestone transition into or out of progress_status=COMPLETED or verification_status=VERIFIED, and once per synthesized milestone during the Application ACCEPTED cascade."
    algorithm: aggregation
    formula: |
      certification_hours_verified = sum(m.required_hours
                                         for m in CertificationMilestone
                                         where m.corps_member_id == this CorpsMember
                                           and m.progress_status == COMPLETED
                                           and m.verification_status == VERIFIED)
    input_set: "Every CertificationMilestone whose corps_member_id equals this member. A milestone contributes its required_hours only when BOTH progress_status == COMPLETED and verification_status == VERIFIED hold; a COMPLETED-but-UNVERIFIED milestone contributes 0, and a REJECTED milestone contributes 0."
    constants:
      EXCLUDED_CONTRIBUTION: 0
    precision: "integer hours, no rounding step"
    variants: []
  - name: certification_deadline_status
    trigger: "Recomputed on every read of a CertificationMilestone and on every CertificationMilestone mutation."
    algorithm: threshold
    formula: |
      today          = UTC date component of the logical clock's current time
      days_remaining = (UTC date component of CertificationMilestone.due_date) - today, in whole days
      if progress_status == COMPLETED and verification_status == VERIFIED: band = "SATISFIED"
      elif days_remaining < 0:    band = "OVERDUE"
      elif days_remaining <= 14:  band = "AT_RISK"
      else:                       band = "ON_TRACK"
    input_set: "One CertificationMilestone plus the logical clock. The SATISFIED band short-circuits every day-count comparison, so a milestone verified after its due date reports SATISFIED rather than OVERDUE."
    constants:
      AT_RISK_WINDOW_DAYS: 14
    precision: "integer whole days; both dates are truncated to their UTC date component before subtraction, so the time-of-day never affects days_remaining"
    variants: []
  - name: employment_eligibility
    trigger: "Recomputed on Placement status changes, on CorpsMember service_status and institute_status changes, and on CertificationMilestone verification transitions."
    algorithm: threshold
    formula: |
      overdue_count = count(m for m in CertificationMilestone
                            where m.corps_member_id == placement.corps_member_id
                              and m.deadline_status == "OVERDUE")
      verified_requirement = pathway.required_practice_hours + pathway.required_coursework_hours
      employment_eligible = (Placement.status IN {CONFIRMED, ACTIVE})
                            and (CorpsMember.service_status == ACTIVE)
                            and (CorpsMember.institute_status == COMPLETED)
                            and (overdue_count == 0)
                            and (CorpsMember.certification_hours_verified >= verified_requirement)
    input_set: "The Placement, its owning CorpsMember, every CertificationMilestone of that member, and the member's CertificationPathway. A single OVERDUE milestone anywhere in the member's milestone set forces employment_eligible to false, and the verified-hour floor is the sum of the pathway's practice and coursework requirements."
    constants:
      REQUIRED_OVERDUE_COUNT: 0
    precision: "boolean; no rounding"
    variants: []
  - name: placement_fee_cents
    trigger: "Recomputed on POST /corps/placements/{id}/confirm and on POST /corps/placements/{id}/activate."
    algorithm: tiered_pricing
    formula: |
      base = PartnerDistrict.placement_fee_per_member_cents
      if base <= 0: base = Region.base_placement_fee_cents
      if Placement.subject_area IN {MATH, SCIENCE, SPED}: base = round_half_up(base * HIGH_NEED_UPLIFT, 0)
      placement_fee_cents = int(base)
    input_set: "One Placement, the PartnerDistrict owning its school_id, and that district's Region. The uplift applies on top of the district override when one exists, and on top of the regional default otherwise."
    constants:
      HIGH_NEED_UPLIFT: 1.15
    precision: "integer cents, round_half_up at 0 decimals; the uplift is applied once to the already-resolved base"
    variants: []
  - name: coursework_hours_completed
    trigger: "Recomputed on every CertificationMilestone transition into progress_status=COMPLETED."
    algorithm: aggregation
    formula: |
      coursework_hours_completed = sum(m.required_hours
                                       for m in CertificationMilestone
                                       where m.corps_member_id == this CorpsMember
                                         and m.milestone_type IN {COURSEWORK, ORIENTATION}
                                         and m.progress_status == COMPLETED)
    input_set: "Every CertificationMilestone whose corps_member_id equals this member and whose milestone_type is COURSEWORK or ORIENTATION. PRACTICUM and EXAM milestones are excluded, so completing a practicum never moves this field; verification_status is deliberately NOT filtered, because the institute records hours when the work is done rather than when it is verified."
    constants:
      COUNTED_TYPES: ["COURSEWORK", "ORIENTATION"]
    precision: "integer hours, no rounding step"
    variants: []
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present; X-User-Role names a role declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /corps/_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "The acting role is listed in the endpoint's §1.5 roles array."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: business_constraint
    check: "Every field required by the endpoint's input schema is present, every enum value is a declared member, every numeric field satisfies its declared range (for example 1 <= effectiveness_score <= 5, 0.0 <= gpa <= 4.0), and every field whose §1.1 constraints declare it unique is not already held by another row (Region.region_code and Applicant.email)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 4
    category: existence
    check: "The Region named by the request path or body exists."
    error_id: ERR_REGION_NOT_FOUND
    http_status: 404
    applies_to: "POST /corps/partner-districts, POST /corps/certification-pathways"
  - priority: 5
    category: existence
    check: "The PartnerDistrict named by the request path or body exists."
    error_id: ERR_DISTRICT_NOT_FOUND
    http_status: 404
    applies_to: "POST /corps/partner-schools, POST /corps/partner-districts/{id}/status, GET /corps/partner-districts/{id}/partner-schools"
  - priority: 6
    category: existence
    check: "The PartnerSchool named by the request path or body exists."
    error_id: ERR_SCHOOL_NOT_FOUND
    http_status: 404
    applies_to: "POST /corps/placements, GET /corps/partner-schools/{id}, GET /corps/partner-schools/{id}/placements"
  - priority: 7
    category: existence
    check: "The Applicant named by the request body exists."
    error_id: ERR_APPLICANT_NOT_FOUND
    http_status: 404
    applies_to: "POST /corps/applications"
  - priority: 8
    category: existence
    check: "The Application named by the request path exists."
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /corps/applications/{id}, POST /corps/applications/{id}/review, POST /corps/applications/{id}/return, POST /corps/applications/{id}/resubmit, POST /corps/applications/{id}/decision, POST /corps/applications/{id}/offer, POST /corps/applications/{id}/offer/respond"
  - priority: 9
    category: existence
    check: "The CertificationPathway named by the request body exists."
    error_id: ERR_PATHWAY_NOT_FOUND
    http_status: 404
    applies_to: "POST /corps/certification-milestones, GET /corps/certification-pathways/{id}, GET /corps/certification-pathways/{id}/certification-milestones"
  - priority: 10
    category: existence
    check: "The CorpsMember named by the request path or body exists."
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "GET /corps/corps-members/{id}, POST /corps/corps-members/{id}/leave, POST /corps/corps-members/{id}/return-from-leave, POST /corps/corps-members/{id}/exit, POST /corps/corps-members/{id}/institute/practice-hours, POST /corps/corps-members/{id}/institute/complete, POST /corps/placements, POST /corps/certification-milestones, POST /corps/support-records, GET /corps/corps-members/{id}/placements, GET /corps/corps-members/{id}/certification-milestones, GET /corps/corps-members/{id}/support-records"
  - priority: 11
    category: existence
    check: "The Placement named by the request path exists."
    error_id: ERR_PLACEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /corps/placements/{id}/confirm, POST /corps/placements/{id}/activate, POST /corps/placements/{id}/early-exit, POST /corps/placements/{id}/reinstate"
  - priority: 12
    category: existence
    check: "The CertificationMilestone named by the request path exists."
    error_id: ERR_MILESTONE_NOT_FOUND
    http_status: 404
    applies_to: "GET /corps/certification-milestones/{id}, POST /corps/certification-milestones/{id}/start, POST /corps/certification-milestones/{id}/complete, POST /corps/certification-milestones/{id}/verify"
  - priority: 13
    category: state
    check: "OCC gate on CorpsMember: the request body's expected_corps_member_version equals the stored CorpsMember.version. Evaluated only on POST /corps/placements."
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: "POST /corps/placements"
  - priority: 14
    category: state
    check: "OCC gate on PartnerDistrict: the request body's expected_district_version equals the stored PartnerDistrict.version. Evaluated only on POST /corps/partner-schools."
    error_id: ERR_STALE_DISTRICT_VERSION
    http_status: 412
    applies_to: "POST /corps/partner-schools"
  - priority: 15
    category: state
    check: "The target resource is in a state that permits the requested transition (for example Application.status == SUBMITTED for review, CorpsMember.institute_status == IN_TRAINING for institute completion, PartnerDistrict.agreement_status == SUSPENDED for reactivation)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every transition endpoint declared in §1.2"
  - priority: 16
    category: state
    check: "The target resource is not in a terminal state for the requested transition. Application.REJECTED and Application.ACCEPTED are terminal, as are CorpsMember.EXITED, Placement.COMPLETED and PartnerDistrict.EXPIRED."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /corps/applications/{id}/review, POST /corps/applications/{id}/return, POST /corps/applications/{id}/resubmit, POST /corps/applications/{id}/decision, POST /corps/applications/{id}/offer, POST /corps/corps-members/{id}/leave, POST /corps/corps-members/{id}/exit, POST /corps/placements/{id}/confirm, POST /corps/placements/{id}/activate, POST /corps/partner-districts/{id}/status"
  - priority: 17
    category: state
    check: "The offer is still open: current logical clock <= Application.offer_expires_at."
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /corps/applications/{id}/offer/respond"
  - priority: 18
    category: state
    check: "PartnerDistrict.agreement_status == ACTIVE for the district owning the placement's school."
    error_id: ERR_DISTRICT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /corps/placements/{id}/confirm, POST /corps/placements/{id}/reinstate, POST /corps/applications/{id}/offer"
  - priority: 19
    category: state
    check: "CorpsMember.service_status == ACTIVE for the owning corps member."
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /corps/placements, POST /corps/placements/{id}/confirm, POST /corps/placements/{id}/reinstate"
  - priority: 20
    category: state
    check: "CorpsMember.institute_status == COMPLETED for the owning corps member."
    error_id: ERR_INSTITUTE_INCOMPLETE
    http_status: 409
    applies_to: "POST /corps/placements/{id}/activate"
  - priority: 21
    category: business_safety
    check: "Segregation of duties: the operator recording a decision did not also run the review, and the operator verifying a milestone did not also complete it. X-User-ID must differ from Application.reviewed_by_user_id and from CertificationMilestone.completed_by_user_id respectively."
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /corps/applications/{id}/decision, POST /corps/certification-milestones/{id}/verify"
  - priority: 22
    category: business_constraint
    check: "An Applicant may hold at most one Application whose status is not REJECTED or DECLINED."
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /corps/applications"
  - priority: 23
    category: business_constraint
    check: "School capacity: the number of Placements at the target PartnerSchool whose status IN {CONFIRMED, ACTIVE} and whose closed term interval [term_start_date, term_end_date] overlaps the new placement's closed interval is strictly less than PartnerSchool.classroom_capacity. Intervals that share exactly one endpoint overlap, because both ends are inclusive."
    error_id: ERR_SCHOOL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /corps/placements/{id}/confirm, POST /corps/placements/{id}/reinstate"
  - priority: 24
    category: business_constraint
    check: "Coach schedule conflict: no existing SupportRecord with record_type == COACHING and the same coach_user_id has a half-open interval [session_start, session_end) that intersects the new record's half-open interval. A record whose session_start equals another's session_end does not intersect it."
    error_id: ERR_COACH_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /corps/support-records"
  - priority: 25
    category: business_temporal
    check: "The milestone is not past its state deadline: current logical clock date <= CertificationMilestone.due_date date."
    error_id: ERR_MILESTONE_PAST_DUE
    http_status: 422
    applies_to: "POST /corps/certification-milestones/{id}/complete"
  - priority: 26
    category: business_referential
    check: "The CertificationPathway named on the milestone belongs to the same region as the corps member's application: pathway.region_id == Region.id where Region.id == Application.preferred_region_id of the member's owning application."
    error_id: ERR_PATHWAY_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /corps/certification-milestones"
  - priority: 27
    category: business_fiscal
    check: "District fee ceiling: the district's recomputed invoice_amount_cents after this placement would become CONFIRMED or ACTIVE must not exceed PartnerDistrict.fee_budget_cents."
    error_id: ERR_DISTRICT_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /corps/placements"
  - priority: 28
    category: business_constraint
    check: "The final selection score clears the SELECT band: Application.final_selection_score >= 85.00 when decision=SELECT."
    error_id: ERR_SCORE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /corps/applications/{id}/decision"
  - priority: 29
    category: business_constraint
    check: "Institute practice hours stay within the program ceiling: CorpsMember.practice_teaching_hours + practice_hours_delta <= 480."
    error_id: ERR_PRACTICE_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /corps/corps-members/{id}/institute/practice-hours"
endpoints:
  - method: POST
    path: "/corps/regions"
    description: "Create a region, fixing the state code and the term start date every certification deadline is measured from."
    roles: [PlatformAdmin]
    code: 201
    input: [region_code, name, state_code, term_start_date, base_placement_fee_cents, max_corps_members]
    output: Region
    side_effects: ["Initializes Region.version to 1."]
  - method: POST
    path: "/corps/partner-districts"
    description: "Create a district partnership agreement in DRAFT state."
    roles: [PlatformAdmin]
    code: 201
    input: [region_id, name, hiring_commitment_slots, placement_fee_per_member_cents, unfilled_slot_penalty_cents, fee_budget_cents]
    output: PartnerDistrict
    side_effects: ["Sets agreement_status = DRAFT, committed_placement_count = 0, invoice_amount_cents = 0."]
  - method: GET
    path: "/corps/partner-districts"
    description: "List partner districts, optionally filtered to one region."
    roles: [PlatformAdmin, PlacementCoordinator]
    code: 200
    input: ["region_id?", "limit?", "offset?"]
    output: PartnerDistrict[]
    side_effects: []
  - method: GET
    path: "/corps/partner-districts/{id}"
    description: "Read one district agreement. The optional projection query parameter selects the district_invoice_amount_cents variant: ACTUAL (default) or FORWARD_LOOKING."
    roles: [PlatformAdmin, PlacementCoordinator]
    code: 200
    input: ["projection?"]
    output: PartnerDistrict
    side_effects: []
  - method: POST
    path: "/corps/partner-districts/{id}/status"
    description: "Move a district agreement between DRAFT, ACTIVE and SUSPENDED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_status]
    output: PartnerDistrict
    side_effects: ["Applies the PartnerDistrict state machine transition selected by to_status.", "Increments PartnerDistrict.version by 1."]
  - method: GET
    path: "/corps/partner-districts/{id}/partner-schools"
    description: "List the schools belonging to one partner district."
    roles: [PlatformAdmin, PlacementCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: PartnerSchool[]
    side_effects: []
  - method: POST
    path: "/corps/partner-schools"
    description: "Create a partner school under a district, declaring its grade band, subject needs and classroom capacity."
    roles: [PlatformAdmin]
    code: 201
    input: [district_id, name, grade_band, subject_needs, classroom_capacity, expected_district_version]
    output: PartnerSchool
    side_effects: ["Sets occupied_classrooms = 0.", "Increments PartnerDistrict.version by 1."]
  - method: GET
    path: "/corps/partner-schools/{id}"
    description: "Read one partner school."
    roles: [PlatformAdmin, PlacementCoordinator]
    code: 200
    input: []
    output: PartnerSchool
    side_effects: []
  - method: GET
    path: "/corps/partner-schools/{id}/placements"
    description: "List the placements hosted by one partner school."
    roles: [PlatformAdmin, PlacementCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Placement[]
    side_effects: []
  - method: POST
    path: "/corps/applicants"
    description: "Record a recruited applicant with the campus, leadership and achievement data selection reads."
