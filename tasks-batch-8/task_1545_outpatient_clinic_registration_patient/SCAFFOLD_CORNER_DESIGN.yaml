              payload: { policy_id: "${pol2}", allowed_amount_cents: 10000 }
              as: FinancialCounselor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CROSS_PATIENT_REFERENCE"

      - name: invalid_date_range_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: "Policy with effective_end before effective_start returns ERR_INVALID_DATE_RANGE / 400."
        test_recipe:
          setup: ["patient exists"]
          setup_api_calls:
