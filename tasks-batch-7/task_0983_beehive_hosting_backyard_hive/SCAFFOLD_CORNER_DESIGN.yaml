            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv2: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv1}", inspected_at: "2026-05-10T00:00:00Z", mites_counted: 8, bees_sampled: 300, disease_flag: false, brood_score: 8, queen_seen: true, stores_kg: 10.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i1: $.data.id } }
