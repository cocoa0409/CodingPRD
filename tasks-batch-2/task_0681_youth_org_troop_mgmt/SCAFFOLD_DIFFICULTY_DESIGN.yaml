          assert:
            - "Event.${event_id}.status == CANCELLED"
            - "EventRegistration.${reg_id}.status == CANCELLED"
            - "Event.${event_id}.confirmed_count == 0"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_state_beats_segregation_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Advancement.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          On POST /advancements/{id}/approve a RETURNED (not SUBMITTED) advancement
          approved by its own submitter violates both state (priority 5,
          ERR_INVALID_STATE) and segregation (priority 7, ERR_SEGREGATION_OF_DUTIES);
          the lower-priority-number state check wins. Category pair: state vs
          business_safety.
        test_recipe:
          setup:
            - "A REGISTERED youth with a RANK advancement currently in RETURNED state, submitted earlier by leader-bob."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "P5 Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-901", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "P5 Youth", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { youth_id: $.data.id }
            - call: "POST /members/${youth_id}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", member_id: "${youth_id}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /members/${youth_id}/advancements"
              payload: { kind: "RANK", target: "TENDERFOOT", requirements_total: 1 }
              as: TroopLeader
              captures: { adv_id: $.data.id }
            - call: "POST /advancements/${adv_id}/sign-requirement"
              payload: {}
              as: TroopLeader
            - call: "POST /advancements/${adv_id}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "leader-bob"
            - call: "POST /advancements/${adv_id}/return"
              payload: {}
              as: CouncilRegistrar
          trigger:
            - call: "POST /advancements/${adv_id}/approve"
              payload: {}
              as: CouncilRegistrar
              as_user_id: "leader-bob"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"   # priority 5 beats priority 7 segregation conflict

      - name: confirm_forms_incomplete_beats_double_booked
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - state_machines.EventRegistration.HOLD_to_CONFIRMED
        distinguishing_aspect: |
          On POST /event-registrations/{id}/confirm an unsigned registration whose
          member is also already CONFIRMED on an overlapping event violates both forms
          (priority 10, ERR_FORMS_INCOMPLETE) and temporal double-book (priority 12,
          ERR_MEMBER_DOUBLE_BOOKED); forms wins. Category pair: business_constraint vs
          business_temporal.
        test_recipe:
          setup:
            - "A REGISTERED youth CONFIRMED on event A (2026-07-01..07-03)."
            - "A second OVERLAPPING event B (2026-07-02..07-04, requires_health_form false) with a HOLD registration whose permission is still UNSIGNED."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "P10 Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-1001", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Db Youth", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { youth_id: $.data.id }
            - call: "POST /members/${youth_id}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", member_id: "${youth_id}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /troops/${troop_id}/events"
              payload: { title: "Event A", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-03T17:00:00Z", capacity: 5, requires_health_form: false }
              as: TroopLeader
              captures: { ev_a: $.data.id }
            - call: "POST /events/${ev_a}/registrations"
              payload: { member_id: "${youth_id}" }
              as: TroopLeader
              captures: { reg_a: $.data.id }
            - call: "POST /event-registrations/${reg_a}/sign-permission"
              payload: {}
              as: TroopLeader
            - call: "POST /event-registrations/${reg_a}/confirm"
              payload: {}
              as: TroopLeader
            - call: "POST /troops/${troop_id}/events"
              payload: { title: "Event B", starts_at: "2026-07-02T09:00:00Z", ends_at: "2026-07-04T17:00:00Z", capacity: 5, requires_health_form: false }
              as: TroopLeader
              captures: { ev_b: $.data.id }
            - call: "POST /events/${ev_b}/registrations"
              payload: { member_id: "${youth_id}" }
