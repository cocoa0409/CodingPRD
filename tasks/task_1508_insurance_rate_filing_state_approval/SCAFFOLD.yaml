    roles: [ProductActuary, FilingAnalyst, ComplianceOfficer, StateRegulator, ImplementationLead, PlatformAdmin]
    code: 200
    input: ["product_id?", "profile_id?", "indication_id?", "state_code?", "status?", "limit?", "offset?"]
    output: "RateFiling[]"
    side_effects: []

  - method: POST
    path: "/filings/{filingId}/mark-ready"
    description: "Move filing DRAFT -> READY after component completeness check"
    roles: [FilingAnalyst]
    code: 200
    input: []
    output: RateFiling
    side_effects: ["status -> READY (ERR_COMPONENT_INCOMPLETE if required FINAL components missing)"]

  - method: POST
    path: "/filings/{filingId}/submit"
    description: "Submit filing to the state regulator"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RateFiling
    side_effects:
      - "status READY -> SUBMITTED; submitted_at, filing_number, deemer_date set"
      - "ComplianceCalendarEntry(DEEMER_DATE) created when applicable; ComplianceCalendarEntry(EFFECTIVE_DATE) created"

  - method: POST
    path: "/filings/{filingId}/withdraw"
    description: "Withdraw a non-terminal filing"
    roles: [FilingAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: RateFiling
    side_effects: ["status -> WITHDRAWN; components/deviations/objections/calendar cascades per state machine"]

  - method: POST
    path: "/filings/{filingId}/approve"
    description: "Regulator approves a submitted filing"
    roles: [StateRegulator]
    code: 200
    input: []
    output: RateFiling
    side_effects: ["status -> APPROVED; approved_at set; actual_effective_date resolved; DEEMER_DATE entry MET"]

  - method: POST
    path: "/filings/{filingId}/disapprove"
    description: "Regulator disapproves a filing (pre- or post-effective)"
    roles: [StateRegulator]
    code: 200
    input: []
    output: RateFiling
    side_effects: ["status -> DISAPPROVED; post-effective: full wave-reversal rescission cascade per state machine"]

  - method: POST
    path: "/filings/{filingId}/mark-effective"
    description: "Move an approved filing into effect; supersedes the incumbent ratebook filing"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RateFiling
    side_effects: ["status -> EFFECTIVE; incumbent EFFECTIVE filing -> SUPERSEDED; EFFECTIVE_DATE entry MET"]

  # --- FilingComponent ---
  - method: POST
    path: "/filings/{filingId}/components"
    description: "Add a component to a DRAFT filing"
    roles: [FilingAnalyst]
    code: 201
    input: [component_type, name, content_ref]
    output: FilingComponent
    side_effects: ["status=DRAFT; parent filing must be DRAFT (ERR_INVALID_STATE)"]

  - method: GET
    path: "/components/{componentId}"
    description: "Get a FilingComponent"
    roles: [ProductActuary, FilingAnalyst, ComplianceOfficer, StateRegulator, ImplementationLead, PlatformAdmin]
    code: 200
