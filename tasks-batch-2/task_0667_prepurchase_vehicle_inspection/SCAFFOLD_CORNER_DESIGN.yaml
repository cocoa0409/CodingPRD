# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0667 — Pre-Purchase Vehicle Inspection & VIN History
# Breadth probe across claim-extraction-guide sections. excluded_because stubs
# reference §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Account.fields.account_type
          - entities.Account.fields.status
          - endpoints
        distinguishing_aspect: "POST /accounts with required fields returns 201; status defaults ACTIVE, outstanding_balance_cents 0, net_terms_days 0, rush_discount_pct 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Solo Buyer", email: "solo@x.test" }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "response http status == 201"
            - "Account.${acct_id}.status == ACTIVE"
            - "Account.${acct_id}.outstanding_balance_cents == 0"
            - "Account.${acct_id}.net_terms_days == 0"
            - "Account.${acct_id}.rush_discount_pct == 0"

      - name: get_inspection_order_not_found
        claim_type: Not Found
        grounds: [entities.InspectionOrder, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /inspection-orders/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /inspection-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OpsAdmin
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response http status == 404"

      - name: create_order_missing_required_field
        claim_type: Required Fields
        grounds: [entities.InspectionOrder.fields.fee_schedule_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /inspection-orders omitting fee_schedule_id returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["An account and vehicle exist; fee_schedule_id is omitted from the order body."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer R", email: "br@x.test" }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGBH41JXMN109186", year: 2020, make: "Honda", model: "Civic" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response http status == 422"

      - name: order_default_rush_tier_none_and_payment_unpaid
        claim_type: Defaults
        grounds:
          - entities.InspectionOrder.fields.rush_tier
          - entities.InspectionOrder.fields.payment_status
          - entities.InspectionOrder.fields.workflow_status
        distinguishing_aspect: "Omitting rush_tier defaults NONE; new order has workflow_status DRAFT and payment_status UNPAID."
        test_recipe:
          setup: ["An account, vehicle and STANDARD fee schedule exist."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer D", email: "bd@x.test" }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "2HGES16575H511111", year: 2005, make: "Honda", model: "Civic" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "InspectionOrder.${ord_id}.rush_tier == NONE"
            - "InspectionOrder.${ord_id}.workflow_status == DRAFT"
            - "InspectionOrder.${ord_id}.payment_status == UNPAID"
            - "InspectionOrder.${ord_id}.version == 1"

      - name: order_estimated_fee_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.InspectionOrder.fields.estimated_fee_cents
          - calculations.fee_estimated
        distinguishing_aspect: "estimated_fee_cents is server-computed (STANDARD base 15000, no vin, no dispatch yet, NONE rush -> 15000) even if a bogus estimated_fee_cents is supplied in the body."
        test_recipe:
          setup: ["STANDARD fee schedule, account, vehicle exist."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer C", email: "bc@x.test" }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "JF1GD70568L811111", year: 2008, make: "Subaru", model: "Impreza" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "InspectionOrder.${ord_id}.estimated_fee_cents == 15000"

      - name: invalid_account_type_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Account.fields.account_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /accounts with account_type=GOVERNMENT (not in enum) returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_type: "GOVERNMENT", legal_name: "Bad", email: "bad@x.test" }
              as: OpsAdmin
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response http status == 422"

      - name: report_points_failed_exceeds_total_rejected
        claim_type: Type Constraints
        grounds: [entities.InspectionReport.fields.points_failed, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /inspection-reports with points_failed > points_total (e.g., 12 > 10) returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Order dispatched with an ACCEPTED assignment (DISPATCHED)."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer PF", email: "bpf@x.test" }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1C4RJFAG7FC611111", year: 2015, make: "Jeep", model: "GrandCherokee" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "PF Field", base_lat: 34.0, base_lng: -118.0, certified_tiers: ["STANDARD"], max_daily_jobs: 3 }
              as: OpsAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id, ord_v1: $.data.version }
            - call: "POST /dispatch-assignments"
              payload: { order_id: "${ord_id}", inspector_id: "${insp_id}", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T11:00:00Z", dispatch_miles: 10, expected_order_version: "${ord_v1}" }
              as: OpsAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /dispatch-assignments/${asg_id}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspection-reports"
              payload: { order_id: "${ord_id}", assignment_id: "${asg_id}", odometer_reading: 30000, points_total: 10, points_failed: 12, road_test_done: true }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response http status == 422"

      - name: vehicle_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Vehicle]
        distinguishing_aspect: "Vehicle has common_fields:false — response carries id and created_at but NO version or updated_at field, and there is no Vehicle update/PUT endpoint."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "5FNYF18568B011111", year: 2008, make: "Honda", model: "Pilot" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
          assert:
            - "response http status == 201"
            - "Vehicle.${veh_id} response has no 'version' field"
            - "Vehicle.${veh_id} response has 'created_at'"

      - name: list_orders_for_account_filtered_list_fk
        claim_type: Listing
        grounds: [entities.InspectionOrder.fields.account_id, endpoints]
        distinguishing_aspect: "GET /accounts/{id}/orders returns the account's orders as an array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One account with two created DRAFT orders."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer L", email: "bl@x.test" }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1G1JC5444R7211111", year: 1994, make: "Chevy", model: "Cavalier" }
              as: OpsAdmin
              captures: { veh1: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1G1JC5444R7222222", year: 1994, make: "Chevy", model: "Cavalier" }
              as: OpsAdmin
              captures: { veh2: $.data.id }
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh1}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh2}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /accounts/${acct_id}/orders"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
          assert:
            - "response.meta.total_count == 2"
            - "response.data is an array of length 2"
            - "response.has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_order_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.InspectionOrder.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second cancel on an already-CANCELLED order returns ERR_INVALID_STATE 409; no side effects fire."
        test_recipe:
          setup: ["A DRAFT order is cancelled once (CANCELLED)."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer CC", email: "bcc@x.test" }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "JN1AZ4EH7AM511111", year: 2010, make: "Nissan", model: "370Z" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /inspection-orders/${ord_id}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /inspection-orders/${ord_id}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response http status == 409"

      - name: accept_already_declined_assignment_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.DispatchAssignment.OFFERED_to_DECLINED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting an assignment already in DECLINED returns ERR_INVALID_STATE 409 (accept only from OFFERED)."
        test_recipe:
          setup: ["Order with an OFFERED assignment that the inspector has DECLINED."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer DA", email: "bda@x.test" }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "WAUZZZ8K9AA511111", year: 2010, make: "Audi", model: "A4" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "DA Field", base_lat: 34.0, base_lng: -118.0, certified_tiers: ["STANDARD"], max_daily_jobs: 3 }
              as: OpsAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id, ord_v1: $.data.version }
            - call: "POST /dispatch-assignments"
              payload: { order_id: "${ord_id}", inspector_id: "${insp_id}", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T11:00:00Z", dispatch_miles: 10, expected_order_version: "${ord_v1}" }
              as: OpsAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /dispatch-assignments/${asg_id}/decline"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /dispatch-assignments/${asg_id}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response http status == 409"

      - name: resolved_dispute_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Dispute.UNDER_REVIEW_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Starting review on a RESOLVED dispute returns ERR_INVALID_STATE 409 (RESOLVED is terminal)."
        test_recipe:
          setup: ["A dispute resolved (WRONG_VEHICLE full refund) on a delivered order."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer RD", email: "brd@x.test" }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "SAJWA1C7XBL511111", year: 2011, make: "Jaguar", model: "XF" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "RD Field", base_lat: 34.0, base_lng: -118.0, certified_tiers: ["STANDARD"], max_daily_jobs: 3 }
              as: OpsAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id, ord_v1: $.data.version }
            - call: "POST /dispatch-assignments"
              payload: { order_id: "${ord_id}", inspector_id: "${insp_id}", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T11:00:00Z", dispatch_miles: 10, expected_order_version: "${ord_v1}" }
              as: OpsAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /dispatch-assignments/${asg_id}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-reports"
              payload: { order_id: "${ord_id}", assignment_id: "${asg_id}", odometer_reading: 50000, points_total: 100, points_failed: 5, road_test_done: true }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /inspection-reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-orders/${ord_id}/pay"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /inspection-orders/${ord_id}/deliver"
              payload: {}
              as: OpsAdmin
            - call: "POST /disputes"
              payload: { order_id: "${ord_id}", report_id: "${rep_id}", reason: "WRONG_VEHICLE", claimed_cents: 15000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /disputes/${dsp_id}/start-review"
              payload: {}
              as: OpsAdmin
            - call: "POST /disputes/${dsp_id}/resolve"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /disputes/${dsp_id}/start-review"
              payload: {}
              as: OpsAdmin
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response http status == 409"

      - name: wrong_vehicle_full_refund_resolution_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED
          - calculations.dispute_refund
          - entities.InspectionOrder.fields.refunded_cents
        distinguishing_aspect: "Resolving a WRONG_VEHICLE dispute (claimed 15000) on a 15000 PAID order approves full 15000, sets refunded_cents 15000 and payment_status REFUNDED."
        test_recipe:
          setup: ["Delivered STANDARD order (fee_total 15000, PAID); WRONG_VEHICLE dispute claiming 15000 is UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { tier_code: "STANDARD", base_fee_cents: 15000, vin_history_fee_cents: 3000, per_mile_dispatch_cents: 100 }
              as: OpsAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", legal_name: "Buyer WV", email: "bwv@x.test" }
              as: OpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "WP1AA2A20DLA51111", year: 2013, make: "Porsche", model: "Cayenne" }
              as: OpsAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "WV Field", base_lat: 34.0, base_lng: -118.0, certified_tiers: ["STANDARD"], max_daily_jobs: 3 }
              as: OpsAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_id}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id, ord_v1: $.data.version }
            - call: "POST /dispatch-assignments"
              payload: { order_id: "${ord_id}", inspector_id: "${insp_id}", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T11:00:00Z", dispatch_miles: 0, expected_order_version: "${ord_v1}" }
              as: OpsAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /dispatch-assignments/${asg_id}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-reports"
              payload: { order_id: "${ord_id}", assignment_id: "${asg_id}", odometer_reading: 50000, points_total: 100, points_failed: 5, road_test_done: true }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /inspection-reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-orders/${ord_id}/pay"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /inspection-orders/${ord_id}/deliver"
              payload: {}
              as: OpsAdmin
            - call: "POST /disputes"
              payload: { order_id: "${ord_id}", report_id: "${rep_id}", reason: "WRONG_VEHICLE", claimed_cents: 15000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /disputes/${dsp_id}/start-review"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /disputes/${dsp_id}/resolve"
              payload: {}
