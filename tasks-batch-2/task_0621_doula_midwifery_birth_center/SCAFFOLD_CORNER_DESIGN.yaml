            - "response error_id == ERR_UNAUTHENTICATED"

      - name: shared_get_allowed_for_billing_clerk
        claim_type: peer_roles
        grounds: [roles, endpoints]
        distinguishing_aspect: "GET endpoints are shared; BillingClerk can GET a client created by IntakeCoordinator."
        test_recipe:
          setup: ["One client registered."]
          setup_api_calls:
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
