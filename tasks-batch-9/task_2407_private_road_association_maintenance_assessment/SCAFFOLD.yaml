  # ---------------- AssessmentRoll ----------------
  - method: POST
    path: "/assessment-rolls"
    description: "Open a draft annual assessment roll for a fiscal year"
    roles: [AssessmentClerk]
    code: 201
    input: [association_id, fiscal_year, fy_start_date, fy_end_date, budget_requirement_cents, method_variant]
    output: AssessmentRoll
    side_effects: ["status = DRAFT; no charges exist yet"]
  - method: GET
    path: "/assessment-rolls/{roll_id}"
    description: "Read one roll including total_levied_cents and unallocated_residual_cents"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner, MemberOwner]
    code: 200
    input: []
    output: AssessmentRoll
    side_effects: []
  - method: GET
    path: "/assessment-rolls"
    description: "List rolls, ordered by fiscal_year ASC then created_at ASC"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner, MemberOwner]
    code: 200
    input: ["association_id?", "fiscal_year?", "status?", "limit?", "offset?"]
    output: AssessmentRoll[]
    side_effects: []
  - method: GET
    path: "/assessment-rolls/{roll_id}/method-comparison"
    description: "Read-only what-if: run calculations.annual_assessment_allocation under BOTH method variants against the roll's current assessable parcel set and report the divergence without mutating anything"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer]
    code: 200
    input: []
    output: "{ roll_id: string, method_variant: string, frontage_weighted_total_cents: integer, trip_generation_weighted_total_cents: integer, frontage_weighted_unallocated_residual_cents: integer, trip_generation_weighted_unallocated_residual_cents: integer, divergent_parcel_count: integer, max_absolute_divergence_cents: integer }"
    side_effects: []
  - method: POST
    path: "/assessment-rolls/{roll_id}/certify"
    description: "Certify the roll: spread the budget across assessable parcels and create PENDING charges"
    roles: [AssessmentClerk]
    code: 200
    input: []
    output: AssessmentRoll
    side_effects:
      - "runs calculations.annual_assessment_allocation and creates one PENDING AssessmentCharge per assessable parcel"
      - "sets total_share_units, total_levied_cents, unallocated_residual_cents, certified_at"
      - "increments AssessmentRoll.version by 1"
  - method: POST
    path: "/assessment-rolls/{roll_id}/recall"
    description: "Recall a certified roll to DRAFT, voiding its charges so parcel data can be corrected"
    roles: [AssessmentClerk]
    code: 200
    input: [recall_reason]
    output: AssessmentRoll
    side_effects:
      - "every PENDING ANNUAL charge of the roll -> VOIDED"
      - "total_levied_cents, total_share_units and unallocated_residual_cents reset to 0; certified_at -> null; recall_count += 1"
      - "no reserve movement: the contribution is credited only at levy"
  - method: POST
    path: "/assessment-rolls/{roll_id}/levy"
    description: "Levy the certified roll: charges become collectible and the reserve contribution is credited. Performed by the BoardTreasurer, never the certifying AssessmentClerk."
    roles: [BoardTreasurer]
    code: 200
    input: []
    output: AssessmentRoll
    side_effects:
      - "every PENDING ANNUAL charge -> OPEN with due_date = date(levied_at) + 45 days"
      - "reserve_contribution_cents = round_half_up(budget_requirement_cents * 0.15) credited to Association.reserve_balance_cents"
      - "Association.reserve_funding_ratio and reserve_posture recomputed; every DRAFT proposal's required_threshold_bps recomputed"

  # ---------------- AssessmentCharge ----------------
  - method: GET
    path: "/assessment-charges/{charge_id}"
    description: "Read one charge including balance and collection status"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, MemberOwner]
    code: 200
    input: []
    output: AssessmentCharge
    side_effects: []
  - method: GET
    path: "/assessment-charges"
    description: "List charges, ordered by created_at ASC; filter by roll, proposal, parcel, member, type or status"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, MemberOwner]
    code: 200
    input: ["roll_id?", "proposal_id?", "parcel_id?", "member_id?", "charge_type?", "status?", "limit?", "offset?"]
    output: AssessmentCharge[]
    side_effects: []
  - method: POST
    path: "/assessment-charges/{charge_id}/payments"
    description: "Apply a payment to a collectible charge; a payment that clears the balance releases every lien on it"
    roles: [MemberOwner, AssessmentClerk]
    code: 200
    input: [amount_cents]
    output: AssessmentCharge
    side_effects:
      - "paid_cents += amount_cents; balance_cents recomputed; status -> PAID only at balance 0"
      - "on reaching PAID, every EFFECTIVE DelinquencyAction on the charge -> RELEASED with lien_amount_cents -> 0"
      - "because those actions closed, member.standing_status, access_status and encumbered_principal_cents are recomputed"
  - method: GET
    path: "/assessment-charges/{charge_id}/delinquency-actions"
    description: "List every remedy pursued against a charge, ordered by created_at ASC"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, MemberOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DelinquencyAction[]
    side_effects: []
  - method: GET
    path: "/delinquency-actions"
    description: "List remedies across charges, filterable by charge, member, action type and status, ordered by created_at ASC"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, MemberOwner]
    code: 200
    input: ["charge_id?", "member_id?", "action_type?", "status?", "limit?", "offset?"]
    output: DelinquencyAction[]
    side_effects: []
  - method: POST
    path: "/assessment-charges/{charge_id}/delinquency-actions"
    description: "Initiate a delinquency remedy on a past-due charge"
    roles: [BoardTreasurer]
    code: 201
    input: [action_type, "restriction_start_date?", "restriction_end_date?"]
    output: DelinquencyAction
    side_effects:
      - "status = INITIATED; initiated_by_user_id = X-User-ID; member_id copied from the charge"
      - "restriction_days computed for ACCESS_RESTRICTION as (end - start) whole days on a half-open interval"
      - "charge.status OPEN -> DELINQUENT with delinquent_since stamped on the first action"
      - "member.standing_status recomputed to DELINQUENT"

  # ---------------- SpecialAssessmentProposal / Ballot ----------------
  - method: POST
    path: "/special-assessment-proposals"
    description: "Draft a special assessment proposal for capital work on a segment"
    roles: [BoardTreasurer]
    code: 201
    input: [road_segment_id, project_type, title, estimated_cost_cents, cost_allocation_method, "voting_basis?"]
    output: SpecialAssessmentProposal
    side_effects: ["status = DRAFT", "required_threshold_bps computed by calculations.vote_threshold_resolution", "voting_basis defaults to Association.default_voting_basis"]
  - method: GET
    path: "/special-assessment-proposals/{proposal_id}"
    description: "Read one proposal including live tally totals and quorum_met"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner, MemberOwner]
    code: 200
    input: []
    output: SpecialAssessmentProposal
    side_effects: []
  - method: GET
    path: "/special-assessment-proposals"
    description: "List proposals, ordered by created_at ASC"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner, MemberOwner]
    code: 200
    input: ["road_segment_id?", "status?", "project_type?", "limit?", "offset?"]
    output: SpecialAssessmentProposal[]
    side_effects: []
  - method: GET
    path: "/ballots/{ballot_id}"
    description: "Read one ballot including its frozen weight_snapshot and status"
    roles: [AssociationSecretary, BoardTreasurer, MemberOwner]
    code: 200
    input: []
    output: Ballot
    side_effects: []
  - method: GET
    path: "/special-assessment-proposals/{proposal_id}/ballots"
    description: "List every ballot on a proposal, ordered by created_at ASC"
    roles: [AssociationSecretary, BoardTreasurer, MemberOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Ballot[]
    side_effects: []
  - method: GET
    path: "/ballots"
    description: "List ballots across proposals, filterable by proposal, voting member and status, ordered by created_at ASC"
    roles: [AssociationSecretary, BoardTreasurer, MemberOwner]
    code: 200
    input: ["proposal_id?", "member_id?", "status?", "limit?", "offset?"]
    output: Ballot[]
    side_effects: []
  - method: POST
    path: "/special-assessment-proposals/{proposal_id}/open-balloting"
    description: "Open the balloting round and snapshot the eligible voting weight"
    roles: [BoardTreasurer]
    code: 200
    input: [balloting_closes_at]
    output: SpecialAssessmentProposal
    side_effects:
      - "status -> BALLOTING; balloting_opened_at stamped; eligible_weight_total snapshotted via calculations.member_voting_weight"
      - "required_threshold_bps recomputed from the current reserve_posture and frozen for this round"
      - "counted/yes/no/abstain totals reset to 0; quorum_met -> false"
  - method: POST
    path: "/special-assessment-proposals/{proposal_id}/tally"
    description: "Close the round and branch to ADOPTED, REJECTED or back to DRAFT per calculations.vote_threshold_resolution"
    roles: [BoardTreasurer]
    code: 200
    input: []
    output: SpecialAssessmentProposal
    side_effects:
      - "ADOPTED: approved_amount_cents frozen and SPECIAL charges created by calculations.special_assessment_allocation"
      - "REJECTED: no charges; CAST ballots retained as the record"
      - "DRAFT (quorum failure with failed_tally_count < 2): failed_tally_count += 1, CAST ballots -> VOIDED, tally totals reset, balloting window cleared"
  - method: POST
    path: "/ballots"
    description: "Cast or recast a ballot; a later ballot by the same member supersedes the earlier one"
    roles: [MemberOwner]
    code: 201
    input: [proposal_id, member_id, choice, expected_proposal_version]
    output: Ballot
    side_effects:
      - "weight_snapshot frozen by calculations.member_voting_weight under the proposal's voting_basis"
      - "any prior CAST ballot by the same member on the same proposal -> SUPERSEDED"
      - "proposal.counted_weight_total, the matching choice total and quorum_met recomputed; increments SpecialAssessmentProposal.version by 1"
  - method: POST
    path: "/ballots/{ballot_id}/revoke"
    description: "Revoke a cast ballot before the round closes"
    roles: [MemberOwner]
    code: 200
    input: [expected_proposal_version]
    output: Ballot
    side_effects:
      - "ballot.status -> REVOKED"
      - "proposal.counted_weight_total and the matching choice total fall by weight_snapshot; quorum_met recomputed; increments SpecialAssessmentProposal.version by 1"

  # ---------------- MaintenanceProject / ContractorBid ----------------
  - method: POST
    path: "/maintenance-projects"
    description: "Open a maintenance project and its bid solicitation for a work window on a segment"
    roles: [RoadCommissioner]
    code: 201
    input: [road_segment_id, category, window_start_date, window_end_date, "proposal_id?"]
    output: MaintenanceProject
    side_effects: ["status = BID_SOLICITATION; created_by_user_id = X-User-ID", "window checked against the segment's other non-terminal windows and the paving cure buffer"]
  - method: GET
    path: "/maintenance-projects/{project_id}"
    description: "Read one project including awarded amount and reserve draw"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner, MemberOwner, Contractor]
    code: 200
    input: []
    output: MaintenanceProject
    side_effects: []
  - method: GET
    path: "/maintenance-projects"
    description: "List projects, ordered by created_at ASC; filter by segment, funding proposal, awarded bid or status"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner, MemberOwner, Contractor]
    code: 200
    input: ["road_segment_id?", "proposal_id?", "awarded_bid_id?", "status?", "category?", "limit?", "offset?"]
    output: MaintenanceProject[]
    side_effects: []
  - method: GET
    path: "/contractor-bids/{bid_id}"
    description: "Read one bid including its responsiveness flags and status"
    roles: [AssociationSecretary, BoardTreasurer, RoadCommissioner, Contractor]
    code: 200
    input: []
    output: ContractorBid
    side_effects: []
  - method: GET
    path: "/maintenance-projects/{project_id}/contractor-bids"
    description: "List every bid on a project, ordered by created_at ASC"
    roles: [AssociationSecretary, BoardTreasurer, RoadCommissioner, Contractor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ContractorBid[]
    side_effects: []
  - method: GET
    path: "/contractor-bids"
    description: "List bids across projects, filterable by project and status, ordered by created_at ASC"
    roles: [AssociationSecretary, BoardTreasurer, RoadCommissioner, Contractor]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: ContractorBid[]
    side_effects: []
  - method: POST
    path: "/maintenance-projects/{project_id}/contractor-bids"
    description: "Submit a bid under optimistic concurrency on the project's version; a later bid by the same contractor supersedes the earlier one"
    roles: [Contractor]
    code: 201
    input: [contractor_name, amount_cents, bond_on_file, expected_project_version]
    output: ContractorBid
    side_effects:
      - "status = SUBMITTED; contractor_user_id = X-User-ID; submitted_at stamped"
      - "any prior SUBMITTED bid by the same contractor_user_id on this project -> SUPERSEDED"
      - "increments MaintenanceProject.version by 1"
  - method: POST
    path: "/maintenance-projects/{project_id}/award"
    description: "Award the lowest responsive bid and hold the reserve draw. The awarding RoadCommissioner user id must differ from the project's creator."
    roles: [RoadCommissioner]
    code: 200
    input: [bid_id]
    output: MaintenanceProject
    side_effects:
      - "the awarded bid -> AWARDED; every other SUBMITTED bid -> REJECTED"
      - "awarded_bid_id, awarded_amount_cents, awarded_by_user_id set; reserve_draw_cents from calculations.project_reserve_draw"
      - "Association.reserve_balance_cents -= reserve_draw_cents; funding ratio and posture recomputed; DRAFT proposals' thresholds recomputed"
  - method: POST
    path: "/maintenance-projects/{project_id}/complete"
    description: "Record completion and the invoiced cost; a completed PAVING project resets the segment to PAVED and UNKNOWN grade pending re-inspection"
    roles: [RoadCommissioner]
    code: 200
    input: [completed_at, actual_cost_cents]
    output: MaintenanceProject
    side_effects: ["status -> COMPLETE, completed_at and actual_cost_cents recorded; the reserve draw stays spent", "PAVING only: segment.surface_type -> PAVED and emergency_access_grade -> UNKNOWN"]
  - method: POST
    path: "/maintenance-projects/{project_id}/cancel"
    description: "Cancel a solicitation or an award, returning any reserve draw"
    roles: [RoadCommissioner]
    code: 200
    input: [cancellation_reason]
    output: MaintenanceProject
    side_effects:
      - "every SUBMITTED or AWARDED bid -> REJECTED"
      - "Association.reserve_balance_cents += reserve_draw_cents, then reserve_draw_cents -> 0; funding ratio, posture and DRAFT proposal thresholds recomputed"
  - method: POST
    path: "/contractor-bids/{bid_id}/withdraw"
    description: "Withdraw an own bid; withdrawing an awarded bid returns the project to bid solicitation and releases the reserve draw"
    roles: [Contractor]
    code: 200
    input: [withdrawal_reason]
    output: ContractorBid
    side_effects:
      - "bid.status -> WITHDRAWN"
      - "if the bid was AWARDED: project.status -> BID_SOLICITATION, awarded_bid_id -> null, awarded_amount_cents -> 0, awarded_by_user_id -> null"
      - "and the reserve draw is returned to Association.reserve_balance_cents, after which funding ratio, posture and DRAFT proposal thresholds are recomputed"

  # ---------------- DelinquencyAction ----------------
  - method: GET
    path: "/delinquency-actions/{action_id}"
    description: "Read one delinquency remedy including its frozen lien and payoff figures"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, MemberOwner]
    code: 200
    input: []
    output: DelinquencyAction
    side_effects: []
  - method: POST
    path: "/delinquency-actions/{action_id}/effectuate"
    description: "Effectuate an initiated remedy: file the lien or impose the access restriction. The effectuating BoardTreasurer user id must differ from the initiator's."
    roles: [BoardTreasurer]
    code: 200
    input: []
    output: DelinquencyAction
    side_effects:
      - "status -> EFFECTIVE with effective_at and effectuated_by_user_id stamped; lien_amount_cents and payoff_amount_cents computed for LIEN_FILING and ACCESS_RESTRICTION"
      - "charge.status DELINQUENT -> LIEN_ENCUMBERED (LIEN_FILING and ACCESS_RESTRICTION only)"
      - "member.standing_status -> LIEN_FILED and encumbered_principal_cents += lien_amount_cents; access_status -> RESTRICTED or WARNED per action_type"
      - "every CAST ballot of that member on a BALLOTING proposal -> VOIDED and each affected proposal's tally totals, quorum_met and version are updated"
  - method: POST
    path: "/delinquency-actions/{action_id}/release"
    description: "Release an effective remedy, or void one that was never effectuated"
    roles: [BoardTreasurer]
    code: 200
    input: [release_reason]
    output: DelinquencyAction
    side_effects:
      - "from EFFECTIVE: status -> RELEASED, lien_amount_cents -> 0, charge LIEN_ENCUMBERED -> DELINQUENT (balance > 0) or PAID (balance 0)"
      - "from INITIATED: status -> VOIDED with no charge or lien effect"
      - "member.standing_status, access_status and encumbered_principal_cents recomputed; restricted_days_used is never decremented"

