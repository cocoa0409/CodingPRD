              as: ContractorUser
              as_user_id: "${cpf_id}"
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cpf_id}" }
              as: ContractorUser
              as_user_id: "${cpf_id}"
              captures: { op3_id: $.data.id }
            - call: "POST /api/v1/orders/${op3_id}/lines"
              payload: { equipment_model_id: "${mpf_id}", quantity: 1 }
