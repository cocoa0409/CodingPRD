# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Municipal Parking-Enforcement & Citation Issuance — Expert
# 9 rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: vehicle_outstanding_vs_projected_balance
        grounds:
          - calculations.vehicle_balance
          - entities.Vehicle.fields.outstanding_balance_cents
          - entities.Vehicle.fields.projected_balance_cents
        distinguishing_aspect: |
          On a Vehicle with one ISSUED citation (fine 15000) and one PENDING payment of 5000, the
          settled-basis outstanding_balance_cells stays 15000 while the forward-looking
          projected_balance_cents is 10000 — same citation, two algorithms, different results on the
          Vehicle domain.
        test_recipe:
          setup:
            - "Officer O; RESIDENTIAL beat (zone surcharge 0); ViolationCode HYDRANT base_fine_cents=15000, booting-eligible."
            - "Vehicle V registered; Officer O has an OPEN shift on the beat."
            - "One HYDRANT citation issued on V (first offense n=0 => fine 15000); one PENDING card payment of 5000 recorded against it (not settled)."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-DV1", full_name: "O One" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RES1", name: "Residential 1", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "HYDRANT", description: "Blocking a fire hydrant", base_fine_cents: 15000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "DV1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "HANDHELD", evidence_photo_url: "https://ev/1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
          trigger:
            - { call: "POST /payments", payload: { citation_id: "${cit_id}", amount_cents: 5000, method: "CARD" }, as: Motorist, captures: { pay_id: "$.data.id" } }
          assert:
            - "Vehicle.${vehicle_id}.outstanding_balance_cents == 15000"
            - "Vehicle.${vehicle_id}.projected_balance_cents == 10000"
            - "Payment.${pay_id}.status == PENDING"

      - name: shift_productivity_gross_vs_net
        grounds:
          - calculations.shift_productivity
          - entities.Shift.fields.gross_citation_count
          - entities.Shift.fields.net_citation_count
          - state_machines.Shift.OPEN_to_CLOSED
        distinguishing_aspect: |
          A shift that issued 3 citations then had 1 voided closes with gross_citation_count=3 but
          net_citation_count=2 (citations_per_hour computed on net) — the same close computes two
          divergent productivity figures on the Shift domain, distinct from the Vehicle-ledger dual
          variant above.
        test_recipe:
          setup:
            - "Officer O with an OPEN shift 08:00-10:00 (2 hours) on a RESIDENTIAL beat; ViolationCode STREET_CLEAN base 6000."
            - "Vehicle V; 3 STREET_CLEAN citations issued on this shift against V; then 1 of them voided by a Supervisor."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-DV2", full_name: "O Two" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RES2", name: "Residential 2", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "STREET_CLEAN", description: "Street cleaning violation", base_fine_cents: 6000, is_booting_eligible: false }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "DV2PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/a.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit1_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/b.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit2_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/c.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit3_id: "$.data.id" } }
            - { call: "POST /citations/${cit1_id}/void", payload: {}, as: Supervisor }
          trigger:
            - { call: "POST /shifts/${shift_id}/close", payload: {}, as: EnforcementOfficer, as_user_id: "${officer_id}" }
          assert:
            - "Shift.${shift_id}.gross_citation_count == 3"
            - "Shift.${shift_id}.net_citation_count == 2"
            - "Shift.${shift_id}.citations_per_hour == 1.00"
            - "Shift.${shift_id}.status == CLOSED"

  - rule_id: combinatorial_formula
    instances:
      - name: citation_fine_tiered_zone_clamp
        grounds:
          - calculations.citation_fine_amount
          - entities.Citation.fields.fine_amount_cents
          - entities.Beat.fields.patrol_zone
        distinguishing_aspect: |
          Mode (a): fine = clamp(round_half_up(base*tier_multiplier) + zone_surcharge, MIN, MAX) has
          >=3 inputs (base 5000, repeat tier from offense index, DOWNTOWN surcharge 2000) with nested
          min/max; the 2nd EXP_METER on the same vehicle (n=1 => 1.5x) yields round(5000*1.5)=7500 +2000
          = 9500, distinct from the 1st (7000).
        test_recipe:
          setup:
            - "Officer O with OPEN shift on a DOWNTOWN beat (surcharge 2000); ViolationCode EXP_METER base 5000."
            - "Vehicle V; one EXP_METER citation already issued on V (n=0 => fine 7000)."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-CF1", full_name: "O CF1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "DTN1", name: "Downtown 1", patrol_zone: "DOWNTOWN" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "CF1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/m1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit1_id: "$.data.id" } }
          trigger:
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/m2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit2_id: "$.data.id" } }
          assert:
            - "Citation.${cit1_id}.fine_amount_cents == 7000"
            - "Citation.${cit2_id}.fine_amount_cents == 9500"

      - name: boot_release_total_rounding_order
        grounds:
          - calculations.boot_release_total
          - entities.BootTowOrder.fields.release_total_cents
          - state_machines.BootTowOrder.ORDERED_to_RELEASED
        distinguishing_aspect: |
          Mode (b): pinned order = sum citation amounts (62500), apply ADMIN_FEE_PCT and round ONCE
          (round_half_up(62500*0.085)=round(5312.5)=5313), THEN add the flat BOOT_FEE (7500) => 75313.
          Charging admin on subtotal-plus-fee, or rounding per citation, gives a different total.
        test_recipe:
          setup:
            - "Officer O with OPEN shift on RESIDENTIAL beat; ViolationCode HYDRANT base 15000 booting-eligible."
            - "Vehicle V; 3 HYDRANT citations issued (fines 15000, 22500, 25000 => subtotal 62500) driving V to BOOT_ELIGIBLE, which auto-created an ORDERED BootTowOrder(BOOT)."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-CF2", full_name: "O CF2" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RES3", name: "Residential 3", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "HYDRANT", description: "Blocking a fire hydrant", base_fine_cents: 15000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "CF2PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/h1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}" }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/h2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}" }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/h3.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}" }
            - { call: "GET /boot-tow-orders", payload: { vehicle_id: "${vehicle_id}" }, as: Supervisor, captures: { boot_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /boot-tow-orders/${boot_id}/release", payload: {}, as: Supervisor }
          assert:
            - "BootTowOrder.${boot_id}.release_total_cents == 75313"
            - "BootTowOrder.${boot_id}.status == RELEASED"

  - rule_id: non_linear_state_machine
    instances:
      - name: hearing_adjourn_reschedule_cycle
        grounds:
          - state_machines.Hearing.SCHEDULED_to_SCHEDULED
          - entities.Hearing.fields.adjournment_count
        distinguishing_aspect: |
          Hearing carries a SCHEDULED->SCHEDULED self-cycle: POST /adjourn keeps status SCHEDULED,
          replaces the times, and increments adjournment_count to 1 — a cyclic (non-linear) machine
          on the Hearing entity.
        test_recipe:
          setup:
            - "A SUBMITTED contest exists on an ISSUED citation; a hearing room exists; a hearing is SCHEDULED for 2026-03-05T09:00-10:00."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-NL1", full_name: "O NL1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RES4", name: "Residential 4", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "NL1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/n1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
            - { call: "POST /contests", payload: { citation_id: "${cit_id}", grounds: "Meter was broken" }, as: Motorist, captures: { contest_id: "$.data.id" } }
            - { call: "POST /hearing-rooms", payload: { room_code: "HR1", name: "Room 1" }, as: Admin, captures: { room_id: "$.data.id" } }
            - { call: "POST /hearings", payload: { contest_id: "${contest_id}", room_id: "${room_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z" }, as: HearingOfficer, captures: { hearing_id: "$.data.id" } }
          trigger:
            - { call: "POST /hearings/${hearing_id}/adjourn", payload: { scheduled_start: "2026-03-06T09:00:00Z", scheduled_end: "2026-03-06T10:00:00Z" }, as: HearingOfficer }
          assert:
            - "Hearing.${hearing_id}.status == SCHEDULED"
            - "Hearing.${hearing_id}.adjournment_count == 1"
            - "Hearing.${hearing_id}.scheduled_start == 2026-03-06T09:00:00Z"

      - name: citation_contest_fork_uphold_dismiss
        grounds:
          - state_machines.Citation.CONTESTED_to_DISMISSED
          - state_machines.Citation.CONTESTED_to_UPHELD
          - state_machines.Contest.HEARING_SCHEDULED_to_CLOSED_DISMISSED
        distinguishing_aspect: |
          The Citation CONTESTED fork branches to {UPHELD, DISMISSED} with divergent side effects:
          DISMISSED zeroes amount_due and is terminal (removed from the vehicle unpaid set), whereas
          UPHELD returns the citation to the payable unpaid set — a branching machine on the Citation
          entity, distinct from Hearing's cycle.
        test_recipe:
          setup:
            - "An ISSUED citation (fine 15000) is CONTESTED via a SUBMITTED contest; a hearing is SCHEDULED for it."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-NL2", full_name: "O NL2" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RES5", name: "Residential 5", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "HYDRANT", description: "Blocking a fire hydrant", base_fine_cents: 15000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "NL2PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/n2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
            - { call: "POST /contests", payload: { citation_id: "${cit_id}", grounds: "Not my car" }, as: Motorist, captures: { contest_id: "$.data.id" } }
            - { call: "POST /hearing-rooms", payload: { room_code: "HR2", name: "Room 2" }, as: Admin, captures: { room_id: "$.data.id" } }
            - { call: "POST /hearings", payload: { contest_id: "${contest_id}", room_id: "${room_id}", scheduled_start: "2026-03-05T11:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }, as: HearingOfficer, captures: { hearing_id: "$.data.id" } }
          trigger:
            - { call: "POST /hearings/${hearing_id}/decide", payload: { decision: "DISMISSED" }, as: HearingOfficer }
          assert:
            - "Citation.${cit_id}.status == DISMISSED"
            - "Citation.${cit_id}.amount_due_cents == 0"
            - "Contest.${contest_id}.status == CLOSED_DISMISSED"
            - "Vehicle.${vehicle_id}.unpaid_citation_count == 0"

  - rule_id: transitive_cascade
    instances:
      - name: citation_issue_to_boot_to_reghold
        grounds:
          - state_machines.Citation.ISSUED_to_CONTESTED
          - calculations.vehicle_scofflaw_status
          - entities.BootTowOrder.fields.origin
          - entities.RegistrationHold.fields.status
        distinguishing_aspect: |
          Depth-3 chain from a single citation issue: issue -> Vehicle recompute crosses
          BOOT_BALANCE_THRESHOLD (>=50000) so scofflaw_status becomes BOOT_ELIGIBLE -> that escalation
          auto-creates an ORDERED BootTowOrder(BOOT, origin=AUTO) -> the order's creation places a
          RegistrationHold(PLACED). Each link is caused by the previous.
        test_recipe:
          setup:
            - "Officer O with OPEN shift on RESIDENTIAL beat; ViolationCode HYDRANT base 15000 booting-eligible; Vehicle V."
            - "Two HYDRANT citations already issued on V (15000 + 22500 = 37500, below all thresholds => scofflaw NONE, no boot)."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-TC1", full_name: "O TC1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RES6", name: "Residential 6", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "HYDRANT", description: "Blocking a fire hydrant", base_fine_cents: 15000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "TC1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/t1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}" }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/t2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}" }
          trigger:
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/t3.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit3_id: "$.data.id" } }
          assert:
            - "Vehicle.${vehicle_id}.outstanding_balance_cents == 62500"
            - "Vehicle.${vehicle_id}.scofflaw_status == BOOT_ELIGIBLE"
            - "GET /boot-tow-orders?vehicle_id=${vehicle_id} returns exactly 1 order with status=ORDERED, origin=AUTO, order_type=BOOT"
            - "GET /registration-holds?vehicle_id=${vehicle_id} returns exactly 1 hold with status=PLACED"
            - "Vehicle.${vehicle_id}.has_active_registration_hold == true"

      - name: payment_settle_to_paid_to_clear
        grounds:
          - state_machines.Payment.PENDING_to_SETTLED
          - state_machines.Citation.ISSUED_to_PAID
          - state_machines.BootTowOrder.ORDERED_to_CANCELLED
          - state_machines.RegistrationHold.PLACED_to_CLEARED
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (payment settle, not citation issue): settle -> the
          citation reaches amount_due 0 and becomes PAID -> Vehicle recompute drops below
          BOOT_BALANCE_THRESHOLD so scofflaw_status becomes NONE -> the ORDERED BootTowOrder is
          CANCELLED and its RegistrationHold is CLEARED.
        test_recipe:
          setup:
            - "Vehicle V at BOOT_ELIGIBLE via 3 HYDRANT citations (15000, 22500, 25000 => 62500) with an auto ORDERED boot and a PLACED registration hold."
            - "A PENDING card payment of 25000 recorded against the 25000 citation (cit3)."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-TC2", full_name: "O TC2" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RES7", name: "Residential 7", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "HYDRANT", description: "Blocking a fire hydrant", base_fine_cents: 15000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "TC2PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/s1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}" }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/s2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}" }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/s3.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit3_id: "$.data.id" } }
            - { call: "GET /boot-tow-orders", payload: { vehicle_id: "${vehicle_id}" }, as: Supervisor, captures: { boot_id: "$.data[0].id" } }
            - { call: "POST /payments", payload: { citation_id: "${cit3_id}", amount_cents: 25000, method: "CARD" }, as: Motorist, captures: { pay_id: "$.data.id" } }
          trigger:
            - { call: "POST /payments/${pay_id}/settle", payload: {}, as: Motorist }
          assert:
            - "Citation.${cit3_id}.status == PAID"
            - "Vehicle.${vehicle_id}.outstanding_balance_cents == 37500"
            - "Vehicle.${vehicle_id}.scofflaw_status == NONE"
            - "BootTowOrder.${boot_id}.status == CANCELLED"
            - "GET /registration-holds?vehicle_id=${vehicle_id} returns exactly 1 hold with status=CLEARED"
            - "Vehicle.${vehicle_id}.has_active_registration_hold == false"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: payment_void_state_beats_amount_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_CITATION_NOT_PAYABLE]
          - errors[ERR_PAYMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          On POST /payments a VOID citation (state, priority 6, ERR_CITATION_NOT_PAYABLE) and an amount
          far above amount_due (business_fiscal, priority 9, ERR_PAYMENT_AMOUNT_MISMATCH) both fail; the
          state error wins. Pair = {state, business_fiscal}.
        test_recipe:
          setup:
            - "A citation issued (fine 15000) then VOIDed by a Supervisor (amount_due 0)."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-PP1", full_name: "O PP1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RES8", name: "Residential 8", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "HYDRANT", description: "Blocking a fire hydrant", base_fine_cents: 15000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "PP1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/p1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
            - { call: "POST /citations/${cit_id}/void", payload: {}, as: Supervisor }
          trigger:
            - { call: "POST /payments", payload: { citation_id: "${cit_id}", amount_cents: 999999, method: "CARD" }, as: Motorist, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response error_id == ERR_CITATION_NOT_PAYABLE"

      - name: citation_issue_existence_beats_retired_constraint
        grounds:
          - validations[priority=3]
          - validations[priority=8]
          - errors[ERR_VEHICLE_NOT_FOUND]
          - errors[ERR_VIOLATION_CODE_RETIRED]
        distinguishing_aspect: |
          On POST /citations a non-existent vehicle_id (existence, priority 3, ERR_VEHICLE_NOT_FOUND)
          and a RETIRED violation code (business_safety, priority 8, ERR_VIOLATION_CODE_RETIRED) both
          fail; existence wins with 404. Pair = {existence, business_safety}, distinct from the
          {state, business_fiscal} pair above.
        test_recipe:
          setup:
            - "Officer O with an OPEN shift; a ViolationCode created then RETIRED; no vehicle created for the bogus id used below."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-PP2", full_name: "O PP2" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RES9", name: "Residential 9", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "OLD_CODE", description: "Deprecated code", base_fine_cents: 5000, is_booting_eligible: false }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /violation-codes/${vc_id}/retire", payload: {}, as: Admin }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /citations", payload: { vehicle_id: "00000000-0000-0000-0000-000000000000", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "HANDHELD", evidence_photo_url: "https://ev/x.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 404"
            - "response error_id == ERR_VEHICLE_NOT_FOUND"

  - rule_id: boundary_precision_check
    instances:
      - name: scofflaw_unpaid_count_threshold
        grounds:
          - calculations.vehicle_scofflaw_status
          - entities.Vehicle.fields.unpaid_citation_count
          - entities.Vehicle.fields.scofflaw_status
        distinguishing_aspect: |
          SCOFFLAW triggers at unpaid_citation_count >= 3 (inclusive). With small STREET_CLEAN fines
          keeping the balance below 50000, the 2nd citation leaves scofflaw_status NONE (count 2) and
          the 3rd flips it to SCOFFLAW (count 3) via POST /citations — an integer-count boundary.
        test_recipe:
          setup:
            - "Officer O with OPEN shift on RESIDENTIAL beat; ViolationCode STREET_CLEAN base 6000; Vehicle V."
            - "Two STREET_CLEAN citations already issued on V (6000 + 9000 = 15000; count 2 => scofflaw NONE)."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-BP1", full_name: "O BP1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RESA", name: "Residential A", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "STREET_CLEAN", description: "Street cleaning", base_fine_cents: 6000, is_booting_eligible: false }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "BP1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/b1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}" }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/b2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}" }
          trigger:
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/b3.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit3_id: "$.data.id" } }
          assert:
            - "Vehicle.${vehicle_id}.unpaid_citation_count == 3"
            - "Vehicle.${vehicle_id}.outstanding_balance_cents == 27000"
            - "Vehicle.${vehicle_id}.scofflaw_status == SCOFFLAW"
            - "GET /boot-tow-orders?vehicle_id=${vehicle_id} returns exactly 0 orders"

      - name: shift_close_zero_citations_productivity
        grounds:
          - calculations.shift_productivity
          - entities.Shift.fields.citations_per_hour
          - state_machines.Shift.OPEN_to_CLOSED
        distinguishing_aspect: |
          Closing a shift with an EMPTY citation set (zero-count boundary on a different metric and a
          different endpoint, POST /shifts/{id}/close) yields gross=0, net=0, and citations_per_hour
          pinned to 0.00 (no divide-by-zero), not an error.
        test_recipe:
          setup:
            - "Officer O with an OPEN shift 08:00-10:00; no citations issued on it."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-BP2", full_name: "O BP2" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RESB", name: "Residential B", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /shifts/${shift_id}/close", payload: {}, as: EnforcementOfficer, as_user_id: "${officer_id}" }
          assert:
            - "Shift.${shift_id}.gross_citation_count == 0"
            - "Shift.${shift_id}.net_citation_count == 0"
            - "Shift.${shift_id}.citations_per_hour == 0.00"
            - "Shift.${shift_id}.status == CLOSED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: citation_issue_requires_open_shift
        grounds:
          - state_machines.Citation.ISSUED_to_CONTESTED
          - entities.Shift.fields.status
          - errors[ERR_SHIFT_NOT_OPEN]
        distinguishing_aspect: |
          A Citation can only be issued when its Shift.status == OPEN; issuing on a CLOSED shift is
          rejected with ERR_SHIFT_NOT_OPEN. Cross-entity pair = (Citation, Shift).
        test_recipe:
          setup:
            - "Officer O with a shift that was OPENED then CLOSED; a vehicle and an ACTIVE violation code exist."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-CE1", full_name: "O CE1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RESC", name: "Residential C", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "CE1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /shifts/${shift_id}/close", payload: {}, as: EnforcementOfficer, as_user_id: "${officer_id}" }
          trigger:
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "HANDHELD", evidence_photo_url: "https://ev/ce1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response error_id == ERR_SHIFT_NOT_OPEN"

      - name: boot_order_requires_boot_eligible_vehicle
        grounds:
          - state_machines.BootTowOrder.ORDERED_to_APPLIED
          - entities.Vehicle.fields.scofflaw_status
          - errors[ERR_VEHICLE_NOT_BOOT_ELIGIBLE]
        distinguishing_aspect: |
          A manual BootTowOrder can only be created when Vehicle.scofflaw_status is BOOT_ELIGIBLE or
          TOW_ELIGIBLE; ordering against a NONE vehicle is rejected with ERR_VEHICLE_NOT_BOOT_ELIGIBLE.
          Cross-entity pair = (BootTowOrder, Vehicle), distinct from (Citation, Shift).
        test_recipe:
          setup:
            - "A freshly registered Vehicle V with no citations (scofflaw_status == NONE)."
          setup_api_calls:
            - { call: "POST /vehicles", payload: { plate: "CE2PLT", state: "CA" }, as: Supervisor, captures: { vehicle_id: "$.data.id" } }
          trigger:
            - { call: "POST /boot-tow-orders", payload: { vehicle_id: "${vehicle_id}", order_type: "BOOT" }, as: Supervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 422"
            - "response error_id == ERR_VEHICLE_NOT_BOOT_ELIGIBLE"

  - rule_id: resource_temporal_overlap
    instances:
      - name: officer_shift_overlap_halfopen
        grounds:
          - entities.Shift.fields.scheduled_start
          - entities.Shift.fields.scheduled_end
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Shift intervals on an Officer are half-open [start, end): a new shift 10:00-14:00 overlapping
          an existing OPEN shift 08:00-12:00 is rejected with ERR_SHIFT_OVERLAP, while bare adjacency
          (end == next start, no buffer) would be allowed. Resource = Officer.
        test_recipe:
          setup:
            - "Officer O with one OPEN shift 2026-03-02T08:00-12:00 on a beat."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-TO1", full_name: "O TO1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RESD", name: "Residential D", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift1_id: "$.data.id" } }
          trigger:
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T14:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response error_id == ERR_SHIFT_OVERLAP"

      - name: hearing_room_overlap_buffered
        grounds:
          - entities.Hearing.fields.scheduled_start
          - entities.Hearing.fields.scheduled_end
          - errors[ERR_ROOM_UNAVAILABLE]
        distinguishing_aspect: |
          HearingRoom intervals carry a 15-minute buffer: a new hearing starting only 10 minutes after
          an existing hearing ends (09:00-10:00 then 10:10-11:00) is rejected with ERR_ROOM_UNAVAILABLE
          because the gap < ROOM_BUFFER_MIN — a buffered interval semantics distinct from the shift's
          bare half-open adjacency. Resource = HearingRoom.
        test_recipe:
          setup:
            - "Two ISSUED citations on one vehicle, each CONTESTED (two SUBMITTED contests); a hearing room; hearing #1 SCHEDULED for contest #1 at 2026-03-05T09:00-10:00 in that room."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-TO2", full_name: "O TO2" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RESE", name: "Residential E", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "TO2PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/r1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit1_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/r2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit2_id: "$.data.id" } }
            - { call: "POST /contests", payload: { citation_id: "${cit1_id}", grounds: "Reason 1" }, as: Motorist, captures: { contest1_id: "$.data.id" } }
            - { call: "POST /contests", payload: { citation_id: "${cit2_id}", grounds: "Reason 2" }, as: Motorist, captures: { contest2_id: "$.data.id" } }
            - { call: "POST /hearing-rooms", payload: { room_code: "HR9", name: "Room 9" }, as: Admin, captures: { room_id: "$.data.id" } }
            - { call: "POST /hearings", payload: { contest_id: "${contest1_id}", room_id: "${room_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z" }, as: HearingOfficer, captures: { hearing1_id: "$.data.id" } }
          trigger:
            - { call: "POST /hearings", payload: { contest_id: "${contest2_id}", room_id: "${room_id}", scheduled_start: "2026-03-05T10:10:00Z", scheduled_end: "2026-03-05T11:00:00Z" }, as: HearingOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response error_id == ERR_ROOM_UNAVAILABLE"

  - rule_id: compensating_invariant
    instances:
      - name: payment_refund_conserves_outstanding_balance
        grounds:
          - state_machines.Payment.SETTLED_to_REFUNDED
          - state_machines.Citation.PAID_to_ISSUED
          - entities.Vehicle.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = money (Vehicle.outstanding_balance_cents). Forward settle drops it from
          15000 to 0 and marks the citation PAID; the compensating refund reverts the citation to ISSUED
          and restores outstanding_balance_cents to exactly 15000 — no drift.
        test_recipe:
          setup:
            - "Vehicle V with one ISSUED HYDRANT citation (fine 15000, outstanding 15000); a card payment of 15000 recorded and SETTLED, making the citation PAID and outstanding 0."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-CI1", full_name: "O CI1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RESF", name: "Residential F", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "HYDRANT", description: "Blocking a fire hydrant", base_fine_cents: 15000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "CI1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/ci1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
            - { call: "POST /payments", payload: { citation_id: "${cit_id}", amount_cents: 15000, method: "CARD" }, as: Motorist, captures: { pay_id: "$.data.id" } }
            - { call: "POST /payments/${pay_id}/settle", payload: {}, as: Motorist }
          trigger:
            - { call: "POST /payments/${pay_id}/refund", payload: {}, as: Supervisor }
          assert:
            - "Payment.${pay_id}.status == REFUNDED"
            - "Citation.${cit_id}.status == ISSUED"
            - "Vehicle.${vehicle_id}.outstanding_balance_cents == 15000"

      - name: citation_void_conserves_unpaid_count
        grounds:
          - state_machines.Citation.ISSUED_to_VOID
          - entities.Vehicle.fields.unpaid_citation_count
        distinguishing_aspect: |
          Conserved quantity = citation count (Vehicle.unpaid_citation_count), distinct from money.
          Forward issue takes it 0 -> 1; the compensating void takes it 1 -> 0, returning the count to
          its pre-issue value with no drift.
        test_recipe:
          setup:
            - "Vehicle V with exactly one ISSUED citation (unpaid_citation_count == 1)."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-CI2", full_name: "O CI2" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "RESG", name: "Residential G", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "CI2PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/ci2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
          trigger:
            - { call: "POST /citations/${cit_id}/void", payload: {}, as: Supervisor }
          assert:
            - "Citation.${cit_id}.status == VOID"
            - "Vehicle.${vehicle_id}.unpaid_citation_count == 0"
            - "Vehicle.${vehicle_id}.outstanding_balance_cents == 0"
