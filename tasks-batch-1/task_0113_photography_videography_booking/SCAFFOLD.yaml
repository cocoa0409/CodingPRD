scenario: "Photography & Videography Booking: session type/package tier, deposit/retainer + balance, contract/model release, shoot scheduling/weather reschedule, gallery delivery/proofing, print/album add-on order, usage/licensing rights, second-shooter assignment"
domain_name: photography-videography-booking
api_prefix: /studio

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  # Booking is a hub; Payment / Contract / ShootSchedule / Gallery hang off it
  # via FK, while SecondShooterAssignment is a cross-aggregate association
  # linking a Photographer to a ShootSchedule window.

  state_machine_shape: branching
  # Booking branches (CONFIRMED -> {SHOT, CANCELLED}); Gallery has a cyclic
  # proofing revision loop (PROOFING -> REVISION_REQUESTED -> PROOFING);
  # Booking carries parallel payment_status x workflow_status dimensions.

  relationship_patterns:
    - one_to_many        # Booking has many Payment, AddOnOrder, LicenseGrant
    - cross_aggregate    # SecondShooterAssignment references Photographer + ShootSchedule
    - polymorphic        # AddOnOrder.line_kind references PRINT vs ALBUM pricing path

  role_model: peer_roles
  # Client owns Booking/Payment/Proofing; Photographer owns ShootSchedule/Gallery;
  # StudioAdmin operates packages, second-shooter assignment, licensing,
  # and the weather/clock test surface.

  consistency_model: immediate

# =====================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =====================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: contact email; unique across Clients
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: client display name
      - name: phone
        type: string
        source: input
        description: contact phone
      - name: status
        type: enum
        source: system
        description: lifecycle flag
        default: ACTIVE
        constraints: "one of {ACTIVE, ARCHIVED}"

  - name: Photographer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: contact email; unique across Photographers
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: photographer display name
      - name: skills
        type: array
        source: input
        description: list of capability tags (e.g. ["PHOTO","VIDEO","DRONE"]); subset of {PHOTO, VIDEO, DRONE, EDITING}
        constraints: "non-empty; each member one of {PHOTO, VIDEO, DRONE, EDITING}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: second-shooter hourly rate in integer cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: availability flag
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: SessionPackage
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: package display name
      - name: session_type
        type: enum
        source: input
        description: shoot category
        constraints: "one of {PORTRAIT, WEDDING, EVENT, COMMERCIAL, PRODUCT}"
      - name: tier
        type: enum
        source: input
        description: package tier; drives deposit rate and included edited image count
        constraints: "one of {BASIC, STANDARD, PREMIUM}"
      - name: base_fee_cents
        type: integer
        source: input
        description: package base fee in integer cents (before add-ons / surcharges)
        constraints: "> 0"
      - name: included_shoot_hours
        type: number
        source: input
        description: shoot hours included in base_fee; overage billed per hour
        constraints: "> 0"
      - name: overage_hourly_rate_cents
        type: integer
        source: input
        description: per-hour charge for shoot hours beyond included_shoot_hours
        constraints: ">= 0"
      - name: included_edited_images
        type: integer
        source: input
        description: count of edited images included in gallery delivery
        constraints: ">= 0"
      - name: deposit_pct
        type: number
        source: input
        description: fraction of total_fee due as the booking deposit/retainer (e.g. 0.30)
        constraints: "0 < deposit_pct <= 1"
      - name: requires_model_release
        type: boolean
        source: input
        description: whether a signed model release is mandatory before the shoot
        default: false
      - name: active
        type: boolean
        source: input
        description: whether the package may be booked
        default: true

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the booking owner"
      - name: package_id
        type: string
        source: input
        description: "FK -> SessionPackage.id; package booked (must be active at booking time)"
      - name: lead_photographer_id
        type: string
        source: input
        description: "FK -> Photographer.id; the assigned lead photographer"
      - name: requested_shoot_hours
        type: number
        source: input
        description: total shoot hours requested; overage beyond package included_shoot_hours is surcharged
        constraints: "> 0"
      - name: workflow_status
        type: enum
        source: system
        description: primary lifecycle dimension
        default: DRAFT
        constraints: "one of {DRAFT, CONFIRMED, SHOT, DELIVERED, CLOSED, CANCELLED}"
      - name: payment_status
        type: enum
        source: system
        description: independent payment dimension; evolves on deposit then balance payment
        default: UNPAID
        constraints: "one of {UNPAID, DEPOSIT_PAID, PAID_IN_FULL, REFUND_PENDING}"
      - name: total_fee_cents
        type: integer
        source: computed
        description: computed booking total (see calc booking_total_fee); recomputed on confirm and on add-on order side effects
      - name: deposit_due_cents
        type: integer
        source: computed
        description: deposit/retainer amount due (see calc deposit_due); pinned at CONFIRMED
      - name: amount_paid_cents
        type: integer
        source: computed
        description: sum of Payment.amount_cents for SETTLED CAPTURE payments minus SETTLED REFUND payments on this booking
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: total_fee_cents - amount_paid_cents (floored at 0); see calc balance_due
        default: 0
      - name: cancellation_fee_cents
        type: integer
        source: computed
        description: fee retained on cancellation (see calc cancellation_fee); 0 until CANCELLED
        default: 0

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this payment applies to"
      - name: kind
        type: enum
        source: input
        description: payment direction/purpose
        constraints: "one of {DEPOSIT, BALANCE, REFUND}"
      - name: amount_cents
        type: integer
        source: input
        description: payment amount in integer cents (always positive; REFUND reduces amount_paid)
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: settlement state
        default: PENDING
        constraints: "one of {PENDING, SETTLED, FAILED}"

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; one Contract per Booking"
        constraints: "unique per booking"
      - name: includes_model_release
        type: boolean
        source: input
        description: whether this contract bundles a model release clause
        default: false
      - name: status
        type: enum
        source: system
        description: signing state
        default: DRAFT
        constraints: "one of {DRAFT, SENT, SIGNED, VOID}"
      - name: signed_at
        type: datetime
        source: system
        description: timestamp the client signed; null until SIGNED

  - name: ShootSchedule
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; one active ShootSchedule per Booking"
      - name: start_utc
        type: datetime
        source: input
        description: shoot window start (ISO 8601 UTC); half-open interval [start, end)
      - name: end_utc
        type: datetime
        source: input
        description: shoot window end (ISO 8601 UTC); end > start
      - name: status
        type: enum
        source: system
        description: schedule state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, RESCHEDULED, COMPLETED, CANCELLED}"
      - name: reschedule_reason
        type: enum
        source: system
        description: reason set when a reschedule occurs; null otherwise
        constraints: "one of {WEATHER, CLIENT_REQUEST, PHOTOGRAPHER_REQUEST}"
      - name: reschedule_count
        type: integer
        source: system
        description: number of times this schedule has been moved
        default: 0

  - name: SecondShooterAssignment
    parent: null
    common_fields: true
    fields:
      - name: shoot_schedule_id
        type: string
        source: input
        description: "FK -> ShootSchedule.id; the shoot window staffed"
      - name: photographer_id
        type: string
        source: input
        description: "FK -> Photographer.id; the second shooter being assigned"
      - name: billable_hours
        type: number
        source: computed
        description: hours of the ShootSchedule window the second shooter is billed for (window duration, ceil to whole hours)
      - name: assignment_fee_cents
        type: integer
        source: computed
        description: billable_hours * photographer.hourly_rate_cents (see calc second_shooter_fee)
      - name: status
        type: enum
        source: system
        description: assignment state
        default: ASSIGNED
        constraints: "one of {ASSIGNED, RELEASED}"

  - name: Gallery
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; one Gallery per Booking"
        constraints: "unique per booking"
      - name: delivered_image_count
        type: integer
        source: input
        description: number of edited images uploaded for proofing
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: proofing/delivery state (cyclic proofing loop)
        default: PENDING_UPLOAD
        constraints: "one of {PENDING_UPLOAD, PROOFING, REVISION_REQUESTED, FINALIZED}"
      - name: revision_round
        type: integer
        source: system
        description: count of revision cycles completed
        default: 0

  - name: ProofSelection
    parent: null
    common_fields: false
    fields:
      - name: gallery_id
        type: string
        source: input
        description: "FK -> Gallery.id; the gallery being proofed"
      - name: selected_image_count
        type: integer
        source: input
        description: number of images the client selects for final edit in this round
        constraints: ">= 1"
      - name: round_index
        type: integer
        source: system
        description: the gallery revision_round this selection was made under

  - name: AddOnOrder
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this add-on attaches to"
      - name: line_kind
        type: enum
        source: input
        description: add-on product class; drives the pricing path
        constraints: "one of {PRINT, ALBUM}"
      - name: quantity
        type: integer
        source: input
        description: number of units (prints) or album page tiers ordered
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: per-unit list price in integer cents
        constraints: "> 0"
      - name: line_total_cents
        type: integer
        source: computed
        description: computed line total with PRINT volume discount vs ALBUM flat (see calc addon_line_total)
      - name: status
        type: enum
        source: system
        description: order state
        default: ORDERED
        constraints: "one of {ORDERED, CANCELLED}"

  - name: LicenseGrant
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking whose images are licensed"
      - name: usage_scope
        type: enum
        source: input
        description: licensing rights scope
        constraints: "one of {PERSONAL, COMMERCIAL, EDITORIAL, EXCLUSIVE}"
      - name: territory
        type: enum
        source: input
        description: licensed territory
        constraints: "one of {LOCAL, NATIONAL, WORLDWIDE}"
      - name: term_months
        type: integer
        source: input
        description: license duration in months; 0 means perpetual
        constraints: ">= 0"
      - name: fee_cents
        type: integer
        source: computed
        description: computed licensing fee (see calc license_fee)
      - name: status
        type: enum
        source: system
        description: grant state
        default: ACTIVE
        constraints: "one of {ACTIVE, REVOKED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Booking
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    note: |
      Booking carries TWO independent dimensions: workflow_status (this machine)
      and payment_status (the second machine below). They evolve independently —
      a Booking can be SHOT while still DEPOSIT_PAID.
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /studio/bookings/{id}/confirm"
        actor: Client
        preconditions:
          - "booking.workflow_status == DRAFT"
          - "the Booking's Contract exists and Contract.status == SIGNED"
          - "if SessionPackage.requires_model_release then the Booking's Contract.includes_model_release == true"
          - "a ShootSchedule exists for the booking with status == SCHEDULED"
        side_effects:
          - "recompute Booking.total_fee_cents via calc booking_total_fee"
          - "set Booking.deposit_due_cents via calc deposit_due (pinned at confirm)"
          - "recompute Booking.balance_due_cents via calc balance_due"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: SHOT
        trigger: "POST /studio/shoot-schedules/{id}/complete"
        actor: Photographer
        preconditions:
          - "booking.workflow_status == CONFIRMED"
          - "booking.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}"
          - "the ShootSchedule.status == SCHEDULED or RESCHEDULED"
          - "current_utc >= ShootSchedule.end_utc"
        side_effects:
          - "set ShootSchedule.status = COMPLETED"
          - "set Booking.workflow_status = SHOT"
          - "increments Booking.version by 1"
        note: "Completing the shoot schedule bubbles the Booking to SHOT."
      - from: SHOT
        to: DELIVERED
        trigger: "POST /studio/galleries/{id}/finalize"
        actor: Photographer
        preconditions:
          - "booking.workflow_status == SHOT"
          - "the Gallery.status == PROOFING"
          - "Gallery.delivered_image_count >= SessionPackage.included_edited_images"
        side_effects:
          - "set Gallery.status = FINALIZED"
          - "set Booking.workflow_status = DELIVERED"
          - "increments Booking.version by 1"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /studio/bookings/{id}/close"
        actor: StudioAdmin
        preconditions:
          - "booking.workflow_status == DELIVERED"
          - "booking.payment_status == PAID_IN_FULL"
        side_effects:
          - "increments Booking.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /studio/bookings/{id}/cancel"
        actor: Client
        preconditions:
          - "booking.workflow_status == DRAFT"
        side_effects:
          - "set Booking.cancellation_fee_cents = 0"
          - "VOID the Booking's Contract if it exists (Contract.status -> VOID)"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /studio/bookings/{id}/cancel"
        actor: Client
        preconditions:
          - "booking.workflow_status == CONFIRMED"
        side_effects:
          - "set Booking.cancellation_fee_cents via calc cancellation_fee"
          - "CASCADE: set the Booking's SCHEDULED/RESCHEDULED ShootSchedule.status = CANCELLED"
          - "CASCADE: that ShootSchedule cancellation RELEASES each ASSIGNED SecondShooterAssignment on it (status -> RELEASED), and each release zeroes that assignment's effect on Booking.total_fee_cents"
          - "after the assignment releases, recompute Booking.total_fee_cents via calc booking_total_fee and Booking.balance_due_cents via calc balance_due"
          - "set Booking.payment_status = REFUND_PENDING if Booking.amount_paid_cents > Booking.cancellation_fee_cents, else leave unchanged"
          - "increments Booking.version by 1"
        note: |
          Depth-3 cascade: cancel(Booking) -> ShootSchedule.CANCELLED ->
          SecondShooterAssignment.RELEASED -> Booking.total_fee_cents recompute.

  - entity: Booking
    initial_state: UNPAID
    terminal_states: []
    note: "Payment dimension of Booking — parallel to workflow_status above."
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /studio/payments/{id}/settle (kind=DEPOSIT)"
        actor: StudioAdmin
        preconditions:
          - "booking.payment_status == UNPAID"
          - "Payment.kind == DEPOSIT and Payment.status == PENDING"
          - "Payment.amount_cents == Booking.deposit_due_cents"
        side_effects:
          - "set Payment.status = SETTLED"
          - "recompute Booking.amount_paid_cents and Booking.balance_due_cents via calc balance_due"
          - "set Booking.payment_status = DEPOSIT_PAID"
          - "increments Booking.version by 1"
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /studio/payments/{id}/settle (kind=BALANCE)"
        actor: StudioAdmin
        preconditions:
          - "booking.payment_status == DEPOSIT_PAID"
          - "Payment.kind == BALANCE and Payment.status == PENDING"
          - "Payment.amount_cents == Booking.balance_due_cents"
        side_effects:
          - "set Payment.status = SETTLED"
          - "recompute Booking.amount_paid_cents and Booking.balance_due_cents via calc balance_due"
          - "set Booking.payment_status = PAID_IN_FULL"
          - "increments Booking.version by 1"
      - from: REFUND_PENDING
        to: UNPAID
        trigger: "POST /studio/payments/{id}/settle (kind=REFUND)"
        actor: StudioAdmin
        preconditions:
          - "booking.payment_status == REFUND_PENDING"
          - "Payment.kind == REFUND and Payment.status == PENDING"
          - "Payment.amount_cents == (Booking.amount_paid_cents - Booking.cancellation_fee_cents)"
        side_effects:
          - "set Payment.status = SETTLED"
          - "recompute Booking.amount_paid_cents via calc balance_due (REFUND subtracts from amount_paid)"
          - "set Booking.payment_status = UNPAID"
          - "increments Booking.version by 1"
        note: "Compensating refund: forward CAPTUREs + this REFUND leave net retained == cancellation_fee_cents."

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /studio/contracts/{id}/send"
        actor: StudioAdmin
        preconditions:
          - "contract.status == DRAFT"
        side_effects:
          - "increments Contract.version by 1"
      - from: SENT
        to: SIGNED
        trigger: "POST /studio/contracts/{id}/sign"
        actor: Client
        preconditions:
          - "contract.status == SENT"
          - "the acting Client owns the Contract's Booking"
        side_effects:
          - "set Contract.signed_at = current_utc"
          - "increments Contract.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "system: booking cancel cascade"
        actor: system
        preconditions:
          - "contract.status IN {DRAFT, SENT}"
        side_effects:
          - "increments Contract.version by 1"
      - from: SENT
        to: VOID
        trigger: "system: booking cancel cascade"
        actor: system
        preconditions:
          - "contract.status IN {DRAFT, SENT}"
        side_effects:
          - "increments Contract.version by 1"

  - entity: ShootSchedule
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: |
      Weather/other reschedule is a self-loop SCHEDULED->RESCHEDULED that bumps
      reschedule_count and moves the window. Reschedule is capped at MAX_RESCHEDULES.
    transitions:
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /studio/shoot-schedules/{id}/reschedule"
        actor: StudioAdmin
        preconditions:
          - "shoot_schedule.status IN {SCHEDULED, RESCHEDULED}"
          - "the Booking.workflow_status == CONFIRMED"
          - "reschedule_count < MAX_RESCHEDULES (constant 3)"
          - "new window [new_start_utc, new_end_utc) does not overlap any ASSIGNED SecondShooterAssignment's photographer on another ShootSchedule (see calc/validation second_shooter_overlap)"
        side_effects:
          - "set ShootSchedule.start_utc/end_utc to the new window"
          - "set ShootSchedule.reschedule_reason to the supplied reason"
          - "increment ShootSchedule.reschedule_count by 1"
          - "increments ShootSchedule.version by 1"
        note: "RESCHEDULED is also a valid `from` for this same transition (cyclic self-loop)."
      - from: RESCHEDULED
        to: RESCHEDULED
        trigger: "POST /studio/shoot-schedules/{id}/reschedule"
        actor: StudioAdmin
        preconditions:
          - "shoot_schedule.status == RESCHEDULED"
          - "the Booking.workflow_status == CONFIRMED"
          - "reschedule_count < MAX_RESCHEDULES (constant 3)"
          - "new window does not overlap the photographer's other ASSIGNED assignments"
        side_effects:
          - "set ShootSchedule.start_utc/end_utc to the new window"
          - "set ShootSchedule.reschedule_reason to the supplied reason"
          - "increment ShootSchedule.reschedule_count by 1"
          - "increments ShootSchedule.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /studio/shoot-schedules/{id}/complete"
        actor: Photographer
        preconditions:
          - "shoot_schedule.status IN {SCHEDULED, RESCHEDULED}"
          - "current_utc >= ShootSchedule.end_utc"
          - "the Booking.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}"
        side_effects:
          - "set Booking.workflow_status = SHOT (see Booking machine)"
          - "increments ShootSchedule.version by 1"
      - from: RESCHEDULED
        to: COMPLETED
        trigger: "POST /studio/shoot-schedules/{id}/complete"
        actor: Photographer
        preconditions:
          - "shoot_schedule.status == RESCHEDULED"
          - "current_utc >= ShootSchedule.end_utc"
          - "the Booking.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}"
        side_effects:
          - "set Booking.workflow_status = SHOT"
          - "increments ShootSchedule.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: booking cancel cascade"
        actor: system
        preconditions:
          - "shoot_schedule.status IN {SCHEDULED, RESCHEDULED}"
        side_effects:
          - "CASCADE: RELEASE each ASSIGNED SecondShooterAssignment on this schedule"
          - "increments ShootSchedule.version by 1"

  - entity: Gallery
    initial_state: PENDING_UPLOAD
    terminal_states: [FINALIZED]
    note: |
      Cyclic proofing loop: PROOFING -> REVISION_REQUESTED -> PROOFING. Each
      REVISION_REQUESTED->PROOFING return bumps revision_round, capped at
      MAX_REVISION_ROUNDS.
    transitions:
      - from: PENDING_UPLOAD
        to: PROOFING
        trigger: "POST /studio/galleries/{id}/upload"
        actor: Photographer
        preconditions:
          - "gallery.status == PENDING_UPLOAD"
          - "the Booking.workflow_status == SHOT"
          - "delivered_image_count >= 1"
        side_effects:
          - "set Gallery.delivered_image_count to the uploaded count"
          - "increments Gallery.version by 1"
      - from: PROOFING
        to: REVISION_REQUESTED
        trigger: "POST /studio/galleries/{id}/request-revision"
        actor: Client
        preconditions:
          - "gallery.status == PROOFING"
          - "the acting Client owns the Gallery's Booking"
          - "gallery.revision_round < MAX_REVISION_ROUNDS (constant 2)"
        side_effects:
          - "increments Gallery.version by 1"
        note: "Revision request opens a loop; the return upload re-enters PROOFING."
      - from: REVISION_REQUESTED
        to: PROOFING
        trigger: "POST /studio/galleries/{id}/upload"
        actor: Photographer
        preconditions:
          - "gallery.status == REVISION_REQUESTED"
          - "delivered_image_count >= 1"
        side_effects:
          - "set Gallery.delivered_image_count to the new uploaded count"
          - "increment Gallery.revision_round by 1"
          - "increments Gallery.version by 1"
        note: "Cyclic return — revision_round bumps each loop."
      - from: PROOFING
        to: FINALIZED
        trigger: "POST /studio/galleries/{id}/finalize"
        actor: Photographer
        preconditions:
          - "gallery.status == PROOFING"
          - "delivered_image_count >= SessionPackage.included_edited_images"
        side_effects:
          - "set Booking.workflow_status = DELIVERED (see Booking machine)"
          - "increments Gallery.version by 1"

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: addon-order-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /studio/bookings/{id}/add-on-orders"
    occ_field: "expected_booking_version"
    description: |
      Placing an AddOnOrder against a Booking whose version has advanced since
      the client last observed it is rejected with a stale-version error. An
      AddOnOrder legitimately supersedes the prior total (each accepted order
      bumps Booking.total_fee_cents and Booking.version); a writer whose view
      of the booking predates an already-applied order is operating on a stale
      total and must re-read before ordering.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

  - rule_id: second-shooter-assign-stale-schedule
    parent_entity: ShootSchedule
    write_endpoint: "POST /studio/shoot-schedules/{id}/second-shooter-assignments"
    occ_field: "expected_shoot_schedule_version"
    description: |
      Assigning a second shooter to a ShootSchedule whose version has advanced
      (e.g. the window was just rescheduled, which bumps the schedule version)
      is rejected. The assignment's billable window is derived from the
      schedule's current start/end; a stale view would bill against a window
      that no longer exists, so the write is refused until the client re-reads.
    error_id: ERR_STALE_SCHEDULE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: booking_total_fee
    trigger: "on Booking confirm; recomputed after each AddOnOrder create/cancel and after SecondShooterAssignment create/release"
    algorithm: aggregation
    formula: |
      package = SessionPackage(booking.package_id)
      overage_hours = max(0, booking.requested_shoot_hours - package.included_shoot_hours)
      # round overage UP to whole hours before charging
      overage_charge = ceil(overage_hours) * package.overage_hourly_rate_cents
      base = package.base_fee_cents + overage_charge
      addon_sum = sum(AddOnOrder.line_total_cents
                      for a in booking.add_on_orders if a.status == ORDERED)
      shooter_sum = sum(SecondShooterAssignment.assignment_fee_cents
                        for s in assignments on the booking's ShootSchedule
                        if s.status == ASSIGNED)
      total_fee_cents = base + addon_sum + shooter_sum
    input_set: "ORDERED AddOnOrders + ASSIGNED SecondShooterAssignments on the booking's active ShootSchedule; CANCELLED/RELEASED excluded"
    constants: {}
    precision: "integer cents; ceil(overage_hours) rounds shoot-hour overage UP to whole hours"

  - name: deposit_due
    trigger: "on Booking confirm (pinned; not recomputed afterward)"
    algorithm: threshold
    formula: |
      raw = total_fee_cents * package.deposit_pct
      # round half up to whole cents
      deposit_due_cents = round_half_up(raw)
      # floor: deposit is at least MIN_DEPOSIT_CENTS unless total is below it
      deposit_due_cents = min(total_fee_cents, max(deposit_due_cents, MIN_DEPOSIT_CENTS))
    input_set: "Booking.total_fee_cents at confirm time and the package deposit_pct"
    constants:
      MIN_DEPOSIT_CENTS: 5000
    precision: "round_half_up to integer cents; nested min/max clamp"
    variants:
      - name: standard_deposit
        when: "total_fee_cents * deposit_pct >= MIN_DEPOSIT_CENTS"
        difference: "deposit = round_half_up(total * deposit_pct)"
      - name: floored_deposit
        when: "total_fee_cents * deposit_pct < MIN_DEPOSIT_CENTS and total_fee_cents >= MIN_DEPOSIT_CENTS"
        difference: "deposit clamps up to MIN_DEPOSIT_CENTS"

  - name: balance_due
    trigger: "on Booking confirm and on every Payment settle (DEPOSIT/BALANCE/REFUND)"
    algorithm: aggregation
    formula: |
      captured = sum(p.amount_cents for p in booking.payments
                     if p.status == SETTLED and p.kind in {DEPOSIT, BALANCE})
      refunded = sum(p.amount_cents for p in booking.payments
                     if p.status == SETTLED and p.kind == REFUND)
      amount_paid_cents = captured - refunded
      balance_due_cents = max(0, total_fee_cents - amount_paid_cents)
    input_set: "SETTLED Payments on the booking; PENDING/FAILED excluded"
    constants: {}
    precision: "integer cents; balance floored at 0"

  - name: cancellation_fee
    trigger: "on Booking cancel from CONFIRMED"
    algorithm: threshold
    formula: |
      # Forward-looking lead-time tier: how many whole days from current_utc to shoot start.
      lead_days = floor((ShootSchedule.start_utc - current_utc) / 86400 seconds)
      if lead_days >= 14:
        pct = 0.25
      elif lead_days >= 7:
        pct = 0.50
      else:
        pct = 1.00
      cancellation_fee_cents = round_half_up(Booking.deposit_due_cents * pct)
    input_set: "Booking.deposit_due_cents (pinned at confirm) and the active ShootSchedule.start_utc vs current_utc"
    constants:
      TIER_EARLY_DAYS: 14
      TIER_MID_DAYS: 7
    precision: "round_half_up to integer cents; lead_days floored to whole days"
    variants:
      - name: forward_looking_lead_time
        when: "cancellation evaluated against current_utc -> shoot start gap"
        difference: "uses the live current_utc clock at cancel time, so the same booking yields different fees depending on when cancel fires"

  - name: addon_line_total
    trigger: "on AddOnOrder create (pinned on the line)"
    algorithm: tiered_pricing
    formula: |
      if line_kind == PRINT:
        # Volume discount tiers on quantity (marginal per-tier rate)
        # tier 1: units 1..10   -> unit_price_cents * 1.00
        # tier 2: units 11..50  -> unit_price_cents * 0.90
        # tier 3: units 51+     -> unit_price_cents * 0.80
        # Round each tier's subtotal to whole cents, THEN sum the tiers.
        t1 = min(quantity, 10)
        t2 = max(0, min(quantity, 50) - 10)
        t3 = max(0, quantity - 50)
        sub1 = round_half_up(t1 * unit_price_cents * 1.00)
        sub2 = round_half_up(t2 * unit_price_cents * 0.90)
        sub3 = round_half_up(t3 * unit_price_cents * 0.80)
        line_total_cents = sub1 + sub2 + sub3
      else:  # ALBUM
        # Flat: quantity (page-tiers) * unit_price, no volume discount,
        # plus a fixed binding surcharge.
        line_total_cents = quantity * unit_price_cents + ALBUM_BINDING_SURCHARGE_CENTS
    input_set: "the single AddOnOrder's line_kind, quantity, unit_price_cents"
    constants:
      PRINT_TIER2_RATE: 0.90
      PRINT_TIER3_RATE: 0.80
      ALBUM_BINDING_SURCHARGE_CENTS: 3500
    precision: "PRINT: round_half_up PER TIER then sum (order pinned); ALBUM: exact integer arithmetic"
    variants:
      - name: print_volume_discount
        when: "line_kind == PRINT"
        difference: "marginal tiered discount, rounded per-tier-then-summed"
      - name: album_flat_plus_surcharge
        when: "line_kind == ALBUM"
        difference: "flat per-unit plus fixed binding surcharge, no discount"

  - name: second_shooter_fee
    trigger: "on SecondShooterAssignment create (pinned on the assignment)"
    algorithm: aggregation
    formula: |
      duration_seconds = ShootSchedule.end_utc - ShootSchedule.start_utc
      billable_hours = ceil(duration_seconds / 3600)   # round UP to whole hours
      assignment_fee_cents = billable_hours * Photographer.hourly_rate_cents
    input_set: "the assignment's ShootSchedule window duration and the second shooter's hourly_rate_cents"
    constants: {}
    precision: "integer cents; billable_hours = ceil(duration / 3600)"

  - name: license_fee
    trigger: "on LicenseGrant create (pinned on the grant)"
    algorithm: weighted_scoring
    formula: |
      scope_mult  = { PERSONAL: 1.0, COMMERCIAL: 2.5, EDITORIAL: 1.8, EXCLUSIVE: 4.0 }[usage_scope]
      terr_mult   = { LOCAL: 1.0, NATIONAL: 1.5, WORLDWIDE: 2.2 }[territory]
      # term factor: perpetual (term_months == 0) costs as a 60-month term.
      effective_months = 60 if term_months == 0 else term_months
      term_factor = 1.0 + (effective_months / 12.0) * 0.10
      raw = LICENSE_BASE_CENTS * scope_mult * terr_mult * term_factor
      # Evaluation order pinned: multiply all three factors against base,
      # THEN round once at the end (round_half_up).
      fee_cents = round_half_up(raw)
    input_set: "the single LicenseGrant's usage_scope, territory, term_months"
    constants:
      LICENSE_BASE_CENTS: 20000
    precision: "round_half_up ONCE at the end after all factors multiplied (order pinned)"
    variants:
      - name: term_based_license
        when: "term_months > 0"
        difference: "term_factor scales linearly with months"
      - name: perpetual_license
        when: "term_months == 0"
        difference: "treated as a 60-month term for fee purposes"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except Client/Photographer self-registration POSTs"

  - priority: 2
    category: auth
    check: "the acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path-referenced resource exists (validated left-to-right in the path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: auth
    check: "for entity_backed roles acting on owned resources, X-User-ID equals the resource's owner FK (Client owns Booking via client_id; Photographer owns ShootSchedule/Gallery via the Booking.lead_photographer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Client/Photographer mutations on owned resources"

  - priority: 5
    category: business_referential
    check: "FK bodies reference existing parents (Booking.package_id, Booking.client_id, Booking.lead_photographer_id, Payment.booking_id, etc.)"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "all create endpoints with FK body fields"

  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is legal (workflow_status / payment_status / Contract / Gallery / ShootSchedule)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes"
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
    applies_to: "POST /studio/bookings/{id}/add-on-orders"

  - priority: 7
    category: business_constraint
    check: "OCC: expected_shoot_schedule_version matches the schedule's current version on second-shooter assignment"
    error_id: ERR_STALE_SCHEDULE_VERSION
    http_status: 412
    applies_to: "POST /studio/shoot-schedules/{id}/second-shooter-assignments"

  - priority: 8
    category: business_safety
    check: "model release gate: if SessionPackage.requires_model_release, the Booking's Contract.includes_model_release must be true before confirm"
    error_id: ERR_MODEL_RELEASE_REQUIRED
    http_status: 422
    applies_to: "POST /studio/bookings/{id}/confirm"

  - priority: 9
    category: business_constraint
    check: "contract must be SIGNED before a Booking can be confirmed"
    error_id: ERR_CONTRACT_NOT_SIGNED
    http_status: 422
    applies_to: "POST /studio/bookings/{id}/confirm"

  - priority: 10
    category: business_temporal
    check: "for each second shooter ASSIGNED to THIS ShootSchedule, the reschedule's new window must not overlap that same photographer's other ASSIGNED SecondShooterAssignment on a different ShootSchedule (half-open [start,end) interval intersection; no travel buffer). When the rescheduled schedule has no assignments, this check is vacuously satisfied."
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /studio/shoot-schedules/{id}/reschedule"

  - priority: 11
    category: business_temporal
    check: "a second-shooter assignment is rejected if the photographer is already ASSIGNED to an overlapping ShootSchedule window, where windows are treated as half-open [start,end) PLUS a TRAVEL_BUFFER_MINUTES gap (constant 60) on each side (so two windows whose nearest edges are < 60 minutes apart also conflict)"
    error_id: ERR_SHOOTER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /studio/shoot-schedules/{id}/second-shooter-assignments"

  - priority: 11
    category: business_temporal
    check: "creating a ShootSchedule is rejected if its [start_utc, end_utc) half-open window strictly overlaps any other non-terminal (SCHEDULED/RESCHEDULED) ShootSchedule of the SAME lead photographer; adjacency (end == next start) is allowed (no buffer), unlike the second-shooter buffer rule"
    error_id: ERR_LEAD_PHOTOGRAPHER_BUSY
    http_status: 409
    applies_to: "POST /studio/shoot-schedules"

  - priority: 12
    category: business_constraint
    check: "reschedule_count must be < MAX_RESCHEDULES (3) to reschedule"
    error_id: ERR_RESCHEDULE_LIMIT
    http_status: 409
    applies_to: "POST /studio/shoot-schedules/{id}/reschedule"

  - priority: 13
    category: business_constraint
    check: "revision_round must be < MAX_REVISION_ROUNDS (2) to request another revision"
    error_id: ERR_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /studio/galleries/{id}/request-revision"

  - priority: 14
    category: business_constraint
    check: "gallery finalize requires delivered_image_count >= SessionPackage.included_edited_images"
    error_id: ERR_INSUFFICIENT_IMAGES
    http_status: 422
    applies_to: "POST /studio/galleries/{id}/finalize"

  - priority: 15
    category: business_fiscal
    check: "a Payment settle requires Payment.amount_cents to equal the expected amount for its kind (DEPOSIT==deposit_due_cents, BALANCE==balance_due_cents, REFUND==amount_paid_cents-cancellation_fee_cents)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /studio/payments/{id}/settle"

  - priority: 16
    category: business_constraint
    check: "shoot-schedule complete requires current_utc >= ShootSchedule.end_utc"
    error_id: ERR_SHOOT_NOT_ENDED
    http_status: 409
    applies_to: "POST /studio/shoot-schedules/{id}/complete"

  - priority: 17
    category: business_constraint
    check: "enum/range/required-field validation on request bodies (e.g. amount_cents > 0, end_utc > start_utc, quantity >= 1, deposit_pct in (0,1])"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints"

  - priority: 18
    category: business_constraint
    check: "uniqueness: at most one non-VOID Contract per Booking; at most one Gallery per Booking; Client/Photographer email unique"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /studio/contracts, POST /studio/galleries, registration endpoints"

  - priority: 19
    category: business_constraint
    check: "booking a SessionPackage requires package.active == true"
    error_id: ERR_PACKAGE_INACTIVE
    http_status: 422
    applies_to: "POST /studio/bookings"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Clients ----
  - method: POST
    path: "/studio/clients"
    description: "Register a client"
    roles: [Anonymous, StudioAdmin]
    code: 201
    input: [email, full_name, phone]
    output: Client
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/studio/clients/{id}"
    description: "Fetch a client"
    roles: [Client, StudioAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- Photographers ----
  - method: POST
    path: "/studio/photographers"
    description: "Register a photographer"
    roles: [Anonymous, StudioAdmin]
    code: 201
    input: [email, full_name, skills, hourly_rate_cents]
    output: Photographer
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/studio/photographers/{id}"
    description: "Fetch a photographer"
    roles: [Photographer, StudioAdmin]
    code: 200
    input: []
    output: Photographer
    side_effects: []

  # ---- Session Packages ----
  - method: POST
    path: "/studio/session-packages"
    description: "Create a session package (configuration)"
    roles: [StudioAdmin]
    code: 201
    input: [name, session_type, tier, base_fee_cents, included_shoot_hours, overage_hourly_rate_cents, included_edited_images, deposit_pct, "requires_model_release?", "active?"]
    output: SessionPackage
    side_effects: []
  - method: GET
    path: "/studio/session-packages/{id}"
    description: "Fetch a session package"
    roles: [Client, StudioAdmin]
    code: 200
    input: []
    output: SessionPackage
    side_effects: []
  - method: GET
    path: "/studio/session-packages"
    description: "List session packages"
    roles: [Client, StudioAdmin]
    code: 200
    input: ["session_type?", "tier?", "active?", "limit?", "offset?"]
    output: SessionPackage[]
    side_effects: []

  # ---- Bookings ----
  - method: POST
    path: "/studio/bookings"
    description: "Create a draft booking"
    roles: [Client, StudioAdmin]
    code: 201
    input: [client_id, package_id, lead_photographer_id, requested_shoot_hours]
    output: Booking
    side_effects: ["workflow_status=DRAFT", "payment_status=UNPAID", "validates package.active"]
  - method: GET
    path: "/studio/bookings/{id}"
    description: "Fetch a booking with computed fields"
    roles: [Client, Photographer, StudioAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/studio/bookings"
    description: "List bookings; filter by client_id / lead_photographer_id / package_id"
    roles: [Client, Photographer, StudioAdmin]
    code: 200
    input: ["client_id?", "lead_photographer_id?", "package_id?", "workflow_status?", "payment_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: POST
    path: "/studio/bookings/{id}/confirm"
    description: "Confirm a draft booking (computes total/deposit/balance)"
    roles: [Client, StudioAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: ["DRAFT->CONFIRMED", "calc booking_total_fee", "calc deposit_due", "calc balance_due", "increments Booking.version by 1"]
  - method: POST
    path: "/studio/bookings/{id}/cancel"
    description: "Cancel a booking (DRAFT or CONFIRMED)"
    roles: [Client, StudioAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: ["->CANCELLED", "calc cancellation_fee (from CONFIRMED)", "CASCADE ShootSchedule->CANCELLED", "CASCADE SecondShooterAssignment->RELEASED", "recompute total_fee/balance_due", "VOID contract (from DRAFT)", "set payment_status=REFUND_PENDING if overpaid", "increments Booking.version by 1"]
  - method: POST
    path: "/studio/bookings/{id}/close"
    description: "Close a delivered, paid-in-full booking"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: ["DELIVERED->CLOSED", "increments Booking.version by 1"]

  # ---- Payments ----
  - method: POST
    path: "/studio/payments"
    description: "Create a PENDING payment (deposit/balance/refund) against a booking"
    roles: [StudioAdmin]
    code: 201
    input: [booking_id, kind, amount_cents]
    output: Payment
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/studio/payments/{id}"
    description: "Fetch a payment"
    roles: [Client, StudioAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/studio/payments"
    description: "List payments; filter by booking_id"
    roles: [Client, StudioAdmin]
    code: 200
    input: ["booking_id?", "kind?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/studio/payments/{id}/settle"
    description: "Settle a pending payment; advances Booking.payment_status"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: ["PENDING->SETTLED", "calc balance_due", "advance payment_status", "increments Booking.version by 1"]

  # ---- Contracts ----
  - method: POST
    path: "/studio/contracts"
    description: "Create a draft contract for a booking"
    roles: [StudioAdmin]
    code: 201
    input: [booking_id, "includes_model_release?"]
    output: Contract
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/studio/contracts/{id}"
    description: "Fetch a contract"
    roles: [Client, StudioAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/studio/contracts"
    description: "List contracts; filter by booking_id"
    roles: [Client, StudioAdmin]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/studio/contracts/{id}/send"
    description: "Send a draft contract to the client"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["DRAFT->SENT", "increments Contract.version by 1"]
  - method: POST
    path: "/studio/contracts/{id}/sign"
    description: "Client signs a sent contract"
    roles: [Client]
    code: 200
    input: []
    output: Contract
    side_effects: ["SENT->SIGNED", "set signed_at", "increments Contract.version by 1"]

  # ---- Shoot Schedules ----
  - method: POST
    path: "/studio/shoot-schedules"
    description: "Schedule a shoot window for a booking"
    roles: [StudioAdmin, Photographer]
    code: 201
    input: [booking_id, start_utc, end_utc]
    output: ShootSchedule
    side_effects: ["status=SCHEDULED", "reschedule_count=0"]
  - method: GET
    path: "/studio/shoot-schedules/{id}"
    description: "Fetch a shoot schedule"
    roles: [Client, Photographer, StudioAdmin]
    code: 200
    input: []
    output: ShootSchedule
    side_effects: []
  - method: GET
    path: "/studio/shoot-schedules"
    description: "List shoot schedules; filter by booking_id"
    roles: [Client, Photographer, StudioAdmin]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: ShootSchedule[]
    side_effects: []
  - method: POST
    path: "/studio/shoot-schedules/{id}/reschedule"
    description: "Move a shoot window (weather or other reason)"
    roles: [StudioAdmin]
    code: 200
    input: [new_start_utc, new_end_utc, reason]
    output: ShootSchedule
    side_effects: ["->RESCHEDULED", "increment reschedule_count", "checks shooter overlap", "increments ShootSchedule.version by 1"]
  - method: POST
    path: "/studio/shoot-schedules/{id}/complete"
    description: "Mark the shoot complete; bubbles Booking to SHOT"
    roles: [Photographer]
    code: 200
    input: []
    output: ShootSchedule
    side_effects: ["->COMPLETED", "Booking.workflow_status=SHOT", "increments ShootSchedule.version by 1"]

  # ---- Second Shooter Assignments (reverse-reachability for both FKs) ----
  - method: POST
    path: "/studio/shoot-schedules/{id}/second-shooter-assignments"
    description: "Assign a second shooter to a shoot window (OCC on schedule version)"
    roles: [StudioAdmin]
    code: 201
    input: [photographer_id, expected_shoot_schedule_version]
    output: SecondShooterAssignment
    side_effects: ["status=ASSIGNED", "calc second_shooter_fee", "recompute Booking.total_fee/balance_due", "checks shooter double-booking", "increments ShootSchedule.version by 1"]
  - method: GET
    path: "/studio/shoot-schedules/{id}/second-shooter-assignments"
    description: "List second-shooter assignments on a shoot window (reverse-reachability for SecondShooterAssignment.shoot_schedule_id)"
    roles: [Client, Photographer, StudioAdmin]
    code: 200
    input: []
    output: SecondShooterAssignment[]
    side_effects: []
  - method: GET
    path: "/studio/second-shooter-assignments/{id}"
    description: "Fetch a single second-shooter assignment"
    roles: [Photographer, StudioAdmin]
    code: 200
    input: []
    output: SecondShooterAssignment
    side_effects: []
  - method: GET
    path: "/studio/second-shooter-assignments"
    description: "List second-shooter assignments; filter by photographer_id (reverse-reachability for SecondShooterAssignment.photographer_id)"
    roles: [Photographer, StudioAdmin]
    code: 200
    input: ["photographer_id?", "shoot_schedule_id?", "status?", "limit?", "offset?"]
    output: SecondShooterAssignment[]
    side_effects: []
  - method: POST
    path: "/studio/second-shooter-assignments/{id}/release"
    description: "Release a second-shooter assignment"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: SecondShooterAssignment
    side_effects: ["ASSIGNED->RELEASED", "recompute Booking.total_fee/balance_due"]

  # ---- Galleries ----
  - method: POST
    path: "/studio/galleries"
    description: "Create a gallery for a booking"
    roles: [Photographer, StudioAdmin]
    code: 201
    input: [booking_id]
    output: Gallery
    side_effects: ["status=PENDING_UPLOAD", "revision_round=0"]
  - method: GET
    path: "/studio/galleries/{id}"
    description: "Fetch a gallery"
    roles: [Client, Photographer, StudioAdmin]
    code: 200
    input: []
    output: Gallery
    side_effects: []
  - method: GET
    path: "/studio/galleries"
    description: "List galleries; filter by booking_id"
    roles: [Client, Photographer, StudioAdmin]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: Gallery[]
    side_effects: []
  - method: POST
    path: "/studio/galleries/{id}/upload"
    description: "Upload edited images (PENDING_UPLOAD or REVISION_REQUESTED -> PROOFING)"
    roles: [Photographer]
    code: 200
    input: [delivered_image_count]
    output: Gallery
    side_effects: ["->PROOFING", "set delivered_image_count", "increment revision_round on revision return", "increments Gallery.version by 1"]
  - method: POST
    path: "/studio/galleries/{id}/request-revision"
    description: "Client requests a proofing revision (PROOFING -> REVISION_REQUESTED)"
    roles: [Client]
    code: 200
    input: []
    output: Gallery
    side_effects: ["PROOFING->REVISION_REQUESTED", "checks revision limit", "increments Gallery.version by 1"]
  - method: POST
    path: "/studio/galleries/{id}/finalize"
    description: "Finalize the gallery; bubbles Booking to DELIVERED"
    roles: [Photographer]
    code: 200
    input: []
    output: Gallery
    side_effects: ["PROOFING->FINALIZED", "Booking.workflow_status=DELIVERED", "checks image sufficiency", "increments Gallery.version by 1"]

  # ---- Proof Selections (reverse-reachability for ProofSelection.gallery_id) ----
  - method: POST
    path: "/studio/galleries/{id}/proof-selections"
    description: "Client records a proofing selection in the current round"
    roles: [Client]
    code: 201
    input: [selected_image_count]
    output: ProofSelection
    side_effects: ["round_index=gallery.revision_round"]
  - method: GET
    path: "/studio/galleries/{id}/proof-selections"
    description: "List proof selections for a gallery (reverse-reachability for ProofSelection.gallery_id)"
    roles: [Client, Photographer, StudioAdmin]
    code: 200
    input: []
    output: ProofSelection[]
    side_effects: []

  # ---- Add-On Orders (reverse-reachability for AddOnOrder.booking_id) ----
  - method: POST
    path: "/studio/bookings/{id}/add-on-orders"
    description: "Order a print/album add-on (OCC on booking version)"
    roles: [Client, StudioAdmin]
    code: 201
    input: [line_kind, quantity, unit_price_cents, expected_booking_version]
    output: AddOnOrder
    side_effects: ["status=ORDERED", "calc addon_line_total", "recompute Booking.total_fee/balance_due", "increments Booking.version by 1"]
  - method: GET
    path: "/studio/bookings/{id}/add-on-orders"
    description: "List add-on orders for a booking (reverse-reachability for AddOnOrder.booking_id)"
    roles: [Client, StudioAdmin]
    code: 200
    input: []
    output: AddOnOrder[]
    side_effects: []
  - method: POST
    path: "/studio/add-on-orders/{id}/cancel"
    description: "Cancel an add-on order; recomputes booking total"
    roles: [Client, StudioAdmin]
    code: 200
    input: [expected_booking_version]
    output: AddOnOrder
    side_effects: ["ORDERED->CANCELLED", "recompute Booking.total_fee/balance_due", "increments Booking.version by 1"]

  # ---- License Grants (reverse-reachability for LicenseGrant.booking_id) ----
  - method: POST
    path: "/studio/bookings/{id}/license-grants"
    description: "Grant a usage/licensing right for a booking's images"
    roles: [StudioAdmin]
    code: 201
    input: [usage_scope, territory, term_months]
    output: LicenseGrant
    side_effects: ["status=ACTIVE", "calc license_fee"]
  - method: GET
    path: "/studio/bookings/{id}/license-grants"
    description: "List license grants for a booking (reverse-reachability for LicenseGrant.booking_id)"
    roles: [Client, StudioAdmin]
    code: 200
    input: []
    output: LicenseGrant[]
    side_effects: []
  - method: POST
    path: "/studio/license-grants/{id}/revoke"
    description: "Revoke a license grant"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: LicenseGrant
    side_effects: ["ACTIVE->REVOKED"]

  # ---- Test-driving clock endpoint ----
  - method: POST
    path: "/studio/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving; advances logical time for shoot completion / cancellation lead-time)"
    roles: [StudioAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["sets server logical clock used by complete / cancellation_fee"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/malformed X-User-Role or X-User-ID on a protected endpoint"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for this endpoint per §1.7"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor is not the owner of the targeted resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path-referenced resource does not exist"
  - id: ERR_INVALID_REFERENCE
    http: 422
    condition: "a body FK references a non-existent parent entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not legal from the resource's current state"
  - id: ERR_STALE_BOOKING_VERSION
    http: 412
    condition: "expected_booking_version does not match Booking.version on a guarded write"
  - id: ERR_STALE_SCHEDULE_VERSION
    http: 412
    condition: "expected_shoot_schedule_version does not match ShootSchedule.version on assignment"
  - id: ERR_MODEL_RELEASE_REQUIRED
    http: 422
    condition: "package requires model release but contract.includes_model_release is false at confirm"
  - id: ERR_CONTRACT_NOT_SIGNED
    http: 422
    condition: "confirm attempted before the booking's contract is SIGNED"
  - id: ERR_SCHEDULE_CONFLICT
    http: 409
    condition: "reschedule window overlaps the photographer's other ASSIGNED assignment window"
  - id: ERR_SHOOTER_DOUBLE_BOOKED
    http: 409
    condition: "second shooter already assigned to an overlapping window (incl. travel buffer)"
  - id: ERR_LEAD_PHOTOGRAPHER_BUSY
    http: 409
    condition: "new ShootSchedule window overlaps another non-terminal schedule of the same lead photographer"
  - id: ERR_RESCHEDULE_LIMIT
    http: 409
    condition: "reschedule_count already at MAX_RESCHEDULES (3)"
  - id: ERR_REVISION_LIMIT
    http: 409
    condition: "revision_round already at MAX_REVISION_ROUNDS (2)"
  - id: ERR_INSUFFICIENT_IMAGES
    http: 422
    condition: "gallery finalize attempted with delivered_image_count < package.included_edited_images"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "settle payment amount_cents != expected amount for its kind"
  - id: ERR_SHOOT_NOT_ENDED
    http: 409
    condition: "shoot complete attempted before current_utc >= end_utc"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "required field missing, enum out of range, or numeric constraint violated"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "duplicate Contract/Gallery per booking, or duplicate email"
  - id: ERR_PACKAGE_INACTIVE
    http: 422
    condition: "booking references a SessionPackage with active == false"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may self-register a Client or Photographer only"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /studio/clients"
      - "POST /studio/photographers"

  - name: Client
    description: "Booking owner; creates/confirms/cancels own bookings, signs contracts, proofs galleries, orders add-ons"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /studio/bookings/{id}/confirm"
      - "POST /studio/contracts/{id}/sign"
      - "POST /studio/galleries/{id}/request-revision"
      - "POST /studio/galleries/{id}/proof-selections"
    shared_operations:
      - "POST /studio/bookings"
      - "POST /studio/bookings/{id}/cancel"
      - "POST /studio/bookings/{id}/add-on-orders"
      - "POST /studio/add-on-orders/{id}/cancel"
      - "GET /studio/* (own bookings, payments, contracts, galleries, schedules)"

  - name: Photographer
    description: "Assigned shooter; manages shoot schedules and gallery delivery for owned bookings"
    identity: "entity_backed:Photographer"
    exclusive_operations:
      - "POST /studio/shoot-schedules/{id}/complete"
      - "POST /studio/galleries/{id}/upload"
      - "POST /studio/galleries/{id}/finalize"
    shared_operations:
      - "POST /studio/shoot-schedules"
      - "POST /studio/galleries"
      - "GET /studio/* (owned bookings/schedules/galleries)"

  - name: StudioAdmin
    description: "Operator; manages packages, payments, contracts lifecycle, second-shooter assignment, licensing, reschedules, clock"
    identity: opaque
    exclusive_operations:
      - "POST /studio/session-packages"
      - "POST /studio/payments"
      - "POST /studio/payments/{id}/settle"
      - "POST /studio/contracts"
      - "POST /studio/contracts/{id}/send"
      - "POST /studio/shoot-schedules/{id}/reschedule"
      - "POST /studio/shoot-schedules/{id}/second-shooter-assignments"
      - "POST /studio/second-shooter-assignments/{id}/release"
      - "POST /studio/bookings/{id}/close"
      - "POST /studio/bookings/{id}/license-grants"
      - "POST /studio/license-grants/{id}/revoke"
      - "POST /studio/_clock/set_current_utc"
    shared_operations:
      - "POST /studio/clients"
      - "POST /studio/photographers"
      - "POST /studio/bookings"
      - "POST /studio/bookings/{id}/cancel"
      - "POST /studio/bookings/{id}/add-on-orders"
      - "POST /studio/add-on-orders/{id}/cancel"
      - "POST /studio/shoot-schedules"
      - "POST /studio/galleries"
      - "GET /studio/* (all resources)"
