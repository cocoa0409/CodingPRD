      - name: layer_occ_reclassification_create_with_a_stale_merchant_version_is_rejected_with_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.reclass-create-stale-merchant
          - validations[priority=11]
          - errors[ERR_STALE_VERSION]
          - entities.Merchant.fields.version
        distinguishing_aspect: "The merchant's version advanced through a completely different actor's write (a CategoryAnalyst verification), so an AcquirerOps client holding the pre-verification version is refused even though the merchant is now in the MORE permissive VERIFIED state — the guard is version identity, not state."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one COMPLIANT US/USD acquirer."
            - "MccDefinition 5411 (GROCERY) and 5812 (RESTAURANT) plus the STANDARD program."
