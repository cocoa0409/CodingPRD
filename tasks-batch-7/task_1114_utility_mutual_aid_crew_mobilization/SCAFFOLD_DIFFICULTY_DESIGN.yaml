  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: lodging_half_open_adjacency_allowed
        grounds:
          - calculations.lodging_overlap_check
          - entities.LodgingAssignment.fields.check_out_date
          - errors[ERR_LODGING_OVERLAP]
        distinguishing_aspect: |
          Resource LodgingAssignment with HALF-OPEN semantics [check_in, check_out):
          a new stay starting 2026-05-06 exactly when the existing one checks out
          (adjacent, gap = 0) is ACCEPTED, while a stay starting 2026-05-05
          (one-day intersection) is rejected — adjacency is not a conflict here.
        test_recipe:
          setup: ["Event ACTIVE; ACCEPTED request with one committed crew; block with total_rooms 5; existing assignment [2026-05-03, 2026-05-06) for the crew"]
          setup_api_calls:
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { sch_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${sch_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${req_id}", crew_type: "LINE", home_base: "Depot 7", roster: [{ member_ref: "M1", member_role: "foreman" }], equipment_units: [] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { crew_id: "$.data.id" } }
            - { call: "POST /mutual-aid/lodging-blocks", payload: { event_id: "${ev_id}", hotel_name: "Storm Inn", block_code: "BLK-5", total_rooms: 5, nightly_rate_cents: 15000 }, as: HostCoordinator, as_user_id: "${host_id}", captures: { blk_id: "$.data.id" } }
            - { call: "POST /mutual-aid/lodging-assignments", payload: { block_id: "${blk_id}", crew_id: "${crew_id}", room_count: 1, check_in_date: "2026-05-03", check_out_date: "2026-05-06" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { asg1_id: "$.data.id" } }
          trigger:
            - { call: "POST /mutual-aid/lodging-assignments", payload: { block_id: "${blk_id}", crew_id: "${crew_id}", room_count: 1, check_in_date: "2026-05-06", check_out_date: "2026-05-09" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { asg2_id: "$.data.id" } }
            - { call: "POST /mutual-aid/lodging-assignments", payload: { block_id: "${blk_id}", crew_id: "${crew_id}", room_count: 1, check_in_date: "2026-05-05", check_out_date: "2026-05-08" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Adjacent stay [2026-05-06, 2026-05-09) succeeds: LodgingAssignment.${asg2_id} created with status RESERVED"
            - "Intersecting stay [2026-05-05, 2026-05-08): error_id == ERR_LODGING_OVERLAP"

      - name: schedule_closed_interval_boundary_conflict
        grounds:
          - state_machines.BillingRateSchedule.DRAFT_to_PUBLISHED
          - entities.BillingRateSchedule.fields.effective_end_date
          - errors[ERR_SCHEDULE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource BillingRateSchedule coverage with CLOSED-INTERVAL semantics
          (different resource AND different semantics from the half-open lodging
          rule): an existing window ending 2026-05-31 CONFLICTS with a new window
          starting 2026-05-31 because both ends are inclusive; starting 2026-06-01
          is accepted. Adjacency IS a conflict here — the exact opposite treatment
          of lodging_half_open_adjacency_allowed.
        test_recipe:
          setup: ["Event ACTIVE; S1 PUBLISHED for (event, RSP) with inclusive window [2026-05-01, 2026-05-31]"]
          setup_api_calls:
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${s1_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-31", effective_end_date: "2026-06-30", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12500 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { s2_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-06-01", effective_end_date: "2026-06-30", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12500 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { s3_id: "$.data.id" } }
          trigger:
            - { call: "POST /mutual-aid/billing-rate-schedules/${s2_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${s3_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { s3_status: "$.data.status" } }
          assert:
            - "S2 [2026-05-31, 2026-06-30] publish: error_id == ERR_SCHEDULE_WINDOW_OVERLAP (shared inclusive date 2026-05-31)"
            - "S3 [2026-06-01, 2026-06-30] publish succeeds: status == PUBLISHED (capture s3_status)"
            - "S2 remains DRAFT after the rejected publish"

  # ==========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: crew_create_withdraw_conserves_committed_count
        grounds:
          - calculations.crew_count_derivation
          - state_machines.Crew.COMMITTED_to_WITHDRAWN
          - entities.AssistanceRequest.fields.committed_crew_count
        distinguishing_aspect: |
          Conserved quantity: headcount (committed_crew_count). Forward action
          crew-create raises it 0 -> 1; the compensating withdraw returns it to
          exactly 0 — the request is left byte-identical in this quantity.
        test_recipe:
          setup: ["Event ACTIVE; request ACCEPTED; no crews yet (committed_crew_count == 0)"]
          setup_api_calls:
            - { call: "POST /mutual-aid/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /mutual-aid/billing-rate-schedules", payload: { event_id: "${ev_id}", effective_start_date: "2026-05-01", effective_end_date: "2026-05-31", rate_lines: [{ crew_type: "LINE", hourly_rate_cents: 12000 }], storm_premium_bps: 1000, per_diem_rate_cents: 8950, per_diem_method: "STANDARD", mobilization_fee_tiers: [{ min_subtotal_cents: 0, fee_bps: 800 }] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { sch_id: "$.data.id" } }
            - { call: "POST /mutual-aid/billing-rate-schedules/${sch_id}/publish", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "POST /mutual-aid/assistance-requests", payload: { event_id: "${ev_id}", responding_utility_id: "${rsp_id}", requested_crews: [{ crew_type: "LINE", count: 2 }], required_minimum_crews: 1, earliest_start_date: "2026-05-03", latest_end_date: "2026-05-15" }, as: HostCoordinator, as_user_id: "${host_id}", captures: { req_id: "$.data.id" } }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/submit", payload: {}, as: HostCoordinator, as_user_id: "${host_id}" }
            - { call: "POST /mutual-aid/assistance-requests/${req_id}/accept", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "GET /mutual-aid/assistance-requests/${req_id}", payload: {}, as: ProgramAdmin, captures: { pre_count: "$.data.committed_crew_count" } }
          trigger:
            - { call: "POST /mutual-aid/crews", payload: { request_id: "${req_id}", crew_type: "LINE", home_base: "Depot 7", roster: [{ member_ref: "M1", member_role: "foreman" }], equipment_units: [] }, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { crew_id: "$.data.id" } }
            - { call: "GET /mutual-aid/assistance-requests/${req_id}", payload: {}, as: ProgramAdmin, captures: { mid_count: "$.data.committed_crew_count" } }
            - { call: "POST /mutual-aid/crews/${crew_id}/withdraw", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}" }
            - { call: "GET /mutual-aid/assistance-requests/${req_id}", payload: {}, as: ProgramAdmin, captures: { post_count: "$.data.committed_crew_count" } }
          assert:
            - "Before: committed_crew_count == 0 (capture pre_count)"
            - "After create: committed_crew_count == 1 (capture mid_count)"
            - "After withdraw: committed_crew_count == 0 == pre_count (capture post_count) — no drift"
            - "Crew.${crew_id}.mobility_status == WITHDRAWN"

      - name: invoice_submit_void_conserves_event_invoiced_total
        grounds:
          - state_machines.Invoice.SUBMITTED_to_VOID
          - entities.MutualAidEvent.fields.total_invoiced_cents
