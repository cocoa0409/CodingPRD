            - { call: "GET /enrollments/${enr}", as: Registrar, captures: { ver: $.data.verified_seat_minutes, cred: $.data.creditable_seat_minutes, frac: $.data.completion_fraction_bps, acad: $.data.academic_status } }
          assert:
            - "Enrollment.${enr}.verified_seat_minutes == 500    # raw variant, uncapped"
            - "Enrollment.${enr}.creditable_seat_minutes == 480  # daily-cap variant: min(500, 480)"
            - "Enrollment.${enr}.completion_fraction_bps == 1600 # round_half_up(480*10000/3000)"
            - "Enrollment.${enr}.academic_status == IN_PROGRESS  # 480 < 3000, not yet SEAT_TIME_MET"

  # ---------------------------------------------------------------- rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: refund_scheduled_tier_reason_branching
        grounds:
          - calculations.refund_scheduled_cents
          - entities.RefundRequest.fields.scheduled_refund_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: tiered percentage selected by
          completion fraction (1000 bps), conditional branch on withdrawal_reason
          (VOLUNTARY applies ADMIN_FEE_CENTS, ADMINISTRATIVE waives it, SCHOOL_CANCELLED
          short-circuits to 100%), and max(0, ...) floor: same fraction yields
          41350 / 46350 / 51500 purely from the reason branch.
        test_recipe:
          setup:
            - "LICENSED school; course required 3000 min, tuition 50000; PUBLISHED offering capacity 3; students A/B/C each PAID 51500 with 300 VERIFIED minutes on 2026-09-03 (f == 1000 bps each)"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 3, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu A", email: "sa@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sa: $.data.id } }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu B", email: "sb@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sb: $.data.id } }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu C", email: "sc@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sc: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sa}" }, as: Registrar, captures: { ea: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sb}" }, as: Registrar, captures: { eb: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sc}" }, as: Registrar, captures: { ec: $.data.id } }
            - { call: "POST /enrollments/${ea}/pay", payload: { amount_cents: 51500 }, as: Registrar }
            - { call: "POST /enrollments/${eb}/pay", payload: { amount_cents: 51500 }, as: Registrar }
            - { call: "POST /enrollments/${ec}/pay", payload: { amount_cents: 51500 }, as: Registrar }
            - { call: "POST /enrollments/${ea}/attendance-records", payload: { session_date: "2026-09-03", minutes: 300 }, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /enrollments/${eb}/attendance-records", payload: { session_date: "2026-09-03", minutes: 300 }, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /enrollments/${ec}/attendance-records", payload: { session_date: "2026-09-03", minutes: 300 }, as: Instructor, as_user_id: "${ins}" }
          trigger:
            - { call: "POST /enrollments/${ea}/withdraw", payload: { reason: "VOLUNTARY", effective_date: "2026-09-04" }, as: Registrar }
            - { call: "POST /enrollments/${eb}/withdraw", payload: { reason: "ADMINISTRATIVE", effective_date: "2026-09-04" }, as: Registrar }
            - { call: "POST /offerings/${off}/cancel", as: SchoolDirector }
            - { call: "GET /refund-requests?enrollment_id=${ea}", as: Registrar, captures: { rra: "$.data[0].id" } }
            - { call: "GET /refund-requests?enrollment_id=${eb}", as: Registrar, captures: { rrb: "$.data[0].id" } }
            - { call: "GET /refund-requests?enrollment_id=${ec}", as: Registrar, captures: { rrc: "$.data[0].id" } }
          assert:
            - "RefundRequest.${rra}.scheduled_refund_cents == 41350  # VOLUNTARY: 90% tier minus 5000 fee"
            - "RefundRequest.${rrb}.scheduled_refund_cents == 46350  # ADMINISTRATIVE: 90% tier, fee waived"
            - "RefundRequest.${rrc}.scheduled_refund_cents == 51500  # SCHOOL_CANCELLED: 100% branch"
            - "RefundRequest.${rrc}.granted_refund_cents == 51500 and RefundRequest.${rrc}.reason == SCHOOL_CANCELLED"
            - "Enrollment.${ec}.academic_status == WITHDRAWN  # cancel cascade reached only the still-active enrollment"

      - name: refund_statutory_nested_rounding_order
        grounds:
          - calculations.refund_statutory_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: round_half_up(paid/total_days) BEFORE
          multiplying by elapsed_days. paid 51499 over 3 days with elapsed 2 gives
          daily 17166 -> earned 34332 -> statutory 16167; the round-at-end alternative
          yields 16166. One cent of divergence isolates the rounding order.
        test_recipe:
          setup:
            - "LICENSED school; course tuition 49999 (charge_total 51499), required 3000; PUBLISHED offering 2026-09-01..2026-09-03 (total_days 3); enrollment PAID 51499, zero attendance (f == 0)"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-RO", title: "Rounding Course", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 49999, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-03", capacity: 1, delivery_mode: "DISTANCE" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu One", email: "s1@x.com", license_goal_state: "TX" }, as: Registrar, captures: { st: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${st}" }, as: Registrar, captures: { enr: $.data.id, tot: $.data.charge_total_cents } }
            - { call: "POST /enrollments/${enr}/pay", payload: { amount_cents: 51499 }, as: Registrar }
          trigger:
            - { call: "POST /enrollments/${enr}/withdraw", payload: { reason: "VOLUNTARY", effective_date: "2026-09-02" }, as: Registrar }
            - { call: "GET /refund-requests?enrollment_id=${enr}", as: Registrar, captures: { rr: "$.data[0].id" } }
          assert:
            - "Enrollment.${enr}.charge_total_cents == 51499   # 49999 + 1500 low-tier fee"
            - "RefundRequest.${rr}.statutory_refund_cents == 16167  # 51499 - round_half_up(51499/3)*2 - 1000; round-at-end gives 16166"
            - "RefundRequest.${rr}.scheduled_refund_cents == 41349  # round_half_up(51499*0.9)=46349 minus 5000"
            - "RefundRequest.${rr}.granted_refund_cents == 41349    # scheduled wins here"

      - name: order_total_evaluation_order
        grounds:
          - calculations.order_total_cents
          - entities.Enrollment.fields.charge_total_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order: the
          registration-fee tier is keyed on DISCOUNTED tuition (computed before the fee is
          added), not on the final total the fee feeds into. Scholarship cap floor(tuition/2)
          applies before tier selection: 30000 scholarship on 50000 tuition caps to 25000.
        test_recipe:
          setup:
            - "LICENSED school; course A tuition 50000 with PUBLISHED offering A; course B tuition 150000 with PUBLISHED offering B; two students"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crsA: $.data.id } }
            - { call: "POST /courses/${crsA}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { capA: $.data.id } }
            - { call: "POST /approvals/${capA}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crsA}/activate", as: SchoolDirector }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "BROKER", title: "Broker Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 150000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crsB: $.data.id } }
            - { call: "POST /courses/${crsB}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { capB: $.data.id } }
            - { call: "POST /approvals/${capB}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crsB}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crsA}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { offA: $.data.id } }
            - { call: "POST /offerings/${offA}/publish", as: SchoolDirector }
            - { call: "POST /offerings", payload: { course_id: "${crsB}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-10-01", end_date: "2026-10-05", capacity: 2, delivery_mode: "DISTANCE" }, as: SchoolDirector, captures: { offB: $.data.id } }
            - { call: "POST /offerings/${offB}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu A", email: "sa@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sa: $.data.id } }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu B", email: "sb@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sb: $.data.id } }
          trigger:
            - { call: "POST /enrollments", payload: { offering_id: "${offA}", student_id: "${sa}", scholarship_cents: 30000 }, as: Registrar, captures: { ea: $.data.id, totA: $.data.charge_total_cents } }
            - { call: "POST /enrollments", payload: { offering_id: "${offB}", student_id: "${sb}" }, as: Registrar, captures: { eb: $.data.id, totB: $.data.charge_total_cents } }
          assert:
            - "Enrollment.${ea}.charge_total_cents == 26500   # 50000 - min(30000, floor(50000/2)=25000) = 25000; 25000 < 100000 -> fee 1500"
            - "Enrollment.${eb}.charge_total_cents == 152500  # discounted 150000 >= 100000 -> fee tier 2500, keyed on discounted tuition NOT on total"

  # ---------------------------------------------------------------- rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: course_approval_renewal_cycle
        grounds:
          - state_machines.CourseApproval.APPROVED_to_EXPIRING
          - state_machines.CourseApproval.EXPIRING_to_RENEWAL_PENDING
          - state_machines.CourseApproval.RENEWAL_PENDING_to_APPROVED
          - entities.CourseApproval.fields.application_round
        distinguishing_aspect: |
          Cyclic machine on CourseApproval: PENDING -> APPROVED -> EXPIRING ->
          RENEWAL_PENDING -> APPROVED closes a renewal loop (state returns to a previously
          visited state with application_round 1 -> 2 and refreshed validity window) —
          non-linear shape on a different entity than the Enrollment parallel dimensions
          and the CreditReport correction cycle.
        test_recipe:
          setup:
            - "LICENSED school; course with CourseApproval APPROVED valid_until 2026-09-30; clock advanced into the 30-day renewal window (2026-09-01)"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2026-09-30" }, as: StateCommission }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /_admin/run-regulatory-sweep", as: ComplianceOfficer }
            - { call: "GET /courses/${crs}/approvals", as: ComplianceOfficer, captures: { st1: "$.data[0].status" } }
          trigger:
            - { call: "POST /approvals/${cap}/renew", as: ComplianceOfficer }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-10-01", valid_until: "2027-09-30" }, as: StateCommission, captures: { st2: $.data.status, rnd: $.data.application_round, vu: $.data.valid_until } }
          assert:
            - "setup sweep left CourseApproval.${cap}.status == EXPIRING   # today 2026-09-01 within 30 days of 2026-09-30"
            - "CourseApproval.${cap}.status == APPROVED                    # full cycle closed"
            - "CourseApproval.${cap}.application_round == 2               # renewal approval increments the round"
            - "CourseApproval.${cap}.valid_until == 2027-09-30            # refreshed validity window"

      - name: enrollment_parallel_dimensions_with_regression
        grounds:
          - state_machines.Enrollment.ENROLLED_to_IN_PROGRESS
          - state_machines.Enrollment.IN_PROGRESS_to_SEAT_TIME_MET
          - state_machines.Enrollment.SEAT_TIME_MET_to_IN_PROGRESS
          - entities.Enrollment.fields.payment_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: academic_status (ENROLLED -> IN_PROGRESS
          -> SEAT_TIME_MET) and payment_status (PENDING -> PAID) evolve independently, and the
          academic dimension regresses (SEAT_TIME_MET -> IN_PROGRESS on attendance void) while
          payment_status stays PAID — a cyclic + parallel shape on Enrollment, distinct from
          the CourseApproval renewal loop.
        test_recipe:
          setup:
            - "LICENSED school; course required_seat_minutes 120, tuition 50000; PUBLISHED offering 2026-09-01..2026-09-10; one enrollment"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-120", title: "Short Course", course_type: "PRE_LICENSING", required_seat_minutes: 120, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu One", email: "s1@x.com", license_goal_state: "TX" }, as: Registrar, captures: { st: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${st}" }, as: Registrar, captures: { enr: $.data.id, ac0: $.data.academic_status, py0: $.data.payment_status } }
            - { call: "POST /enrollments/${enr}/attendance-records", payload: { session_date: "2026-09-03", minutes: 60 }, as: Instructor, as_user_id: "${ins}", captures: { ar1: $.data.id } }
            - { call: "POST /enrollments/${enr}/pay", payload: { amount_cents: 51500 }, as: Registrar, captures: { ac1: $.data.academic_status, py1: $.data.payment_status } }
          trigger:
            - { call: "POST /enrollments/${enr}/attendance-records", payload: { session_date: "2026-09-04", minutes: 60 }, as: Instructor, as_user_id: "${ins}", captures: { ar2: $.data.id } }
            - { call: "GET /enrollments/${enr}", as: Registrar, captures: { ac2: $.data.academic_status, py2: $.data.payment_status, cred2: $.data.creditable_seat_minutes } }
            - { call: "POST /attendance-records/${ar2}/void", as: Instructor, as_user_id: "${ins}" }
            - { call: "GET /enrollments/${enr}", as: Registrar, captures: { ac3: $.data.academic_status, py3: $.data.payment_status, cred3: $.data.creditable_seat_minutes } }
          assert:
            - "at creation: academic_status == ENROLLED and payment_status == PENDING"
            - "after pay while IN_PROGRESS: academic_status == IN_PROGRESS and payment_status == PAID   # dimensions independent"
            - "after second 60-min record: creditable_seat_minutes == 120 and academic_status == SEAT_TIME_MET and payment_status == PAID"
            - "after void: creditable_seat_minutes == 60 and academic_status == IN_PROGRESS (regressed) and payment_status == PAID (untouched)"

      - name: credit_report_correction_cycle
        grounds:
          - state_machines.CreditReport.DRAFT_to_SUBMITTED
          - state_machines.CreditReport.SUBMITTED_to_REJECTED
          - state_machines.CreditReport.REJECTED_to_DRAFT
          - entities.CreditReport.fields.submission_count
        distinguishing_aspect: |
          Cyclic correction loop on CreditReport (DRAFT -> SUBMITTED -> REJECTED -> DRAFT ->
          SUBMITTED -> ACKNOWLEDGED) with submission_count monotonically increasing to 2 while
          status revisits DRAFT — a third distinct entity carrying a non-linear machine.
        test_recipe:
          setup:
            - "LICENSED school; CE course (ce_credit_hours 7.5, required 60 min); one enrollment EXAM_PASSED; certificate issued on 2026-09-11 (clock set before issuance); base report for 2026-09-01..2026-09-30 created at clock 2026-09-11"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "CE-75", title: "CE Elective", course_type: "CONTINUING_ED", required_seat_minutes: 60, tuition_cents: 10000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 7.5 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
