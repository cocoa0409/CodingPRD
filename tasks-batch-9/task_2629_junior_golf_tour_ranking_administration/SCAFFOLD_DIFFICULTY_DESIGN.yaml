  - rule_id: transitive_cascade
    instances:

      - name: conduct_suspension_cascade_depth_five
        grounds:
          - state_machines.Member.VERIFIED_to_SUSPENDED
          - state_machines.Entry.ACCEPTED_to_FORFEITED
          - state_machines.Entry.WAITLISTED_to_ACCEPTED
          - state_machines.ExemptionGrant.CONSUMED_to_REVOKED
          - calculations.conduct_sanction_tier
          - calculations.season_assistance_ledger
          - calculations.tournament_slot_census
          - endpoints.POST_conduct_cases_caseId_decide
        distinguishing_aspect: |
          A FIVE-HOP chain from a single write. HOP 1 ConductCase -> SANCTIONED with sanction_tier
          MEMBER_SUSPENSION. HOP 2 Member VERIFIED -> SUSPENDED with conduct_points 6. HOP 3 the
          member's ACCEPTED Entry -> FORFEITED / FORFEITED_FEE and its CONSUMED ExemptionGrant ->
          REVOKED. HOP 4 the freed slot is backfilled from the waitlist, so the runner-up becomes
          ACCEPTED and the third entry's waitlist_position renumbers 2 -> 1. HOP 5 the forfeited
          25000-cent award moves from Season.assistance_committed_cents to assistance_disbursed_cents,
          leaving assistance_available_cents untouched at 475000. An implementation that stops at
          hop 2 or 3 leaves the waitlist frozen or the money stuck in "committed" forever.
        test_recipe:
          setup:
            - "One season with a 500000-cent pool; m1, m2 and m3 all VERIFIED U17."
            - "m1 holds an APPROVED AidApplication at covered_pct 1.00 (household_income_cents 3000000 over 2 dependents) and a DEFENDING_CHAMPION ExemptionGrant into t1, granted while t1 was still ENTRY_OPEN."
            - "t1 is a REGIONAL tournament with field_size_limit 1 and entry_fee_cents 25000, so only one of the three entries can be seated."
            - "The three entries are filed one hour apart inside the normal window (no late surcharge); m1's exemption puts it in the top priority band, so m1 is ACCEPTED, m2 takes waitlist_position 1 and m3 waitlist_position 2."
            - "m1's entry settles to aid_award_cents 25000, net_fee_due_cents 0, fee_status AID_COVERED; the season now reads available 475000 / committed 25000 / disbursed 0."
