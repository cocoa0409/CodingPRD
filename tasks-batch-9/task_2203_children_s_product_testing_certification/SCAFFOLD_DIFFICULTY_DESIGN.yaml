          - state_machines.Product.CERTIFIED_to_SUSPENDED
          - state_machines.ChildrensProductCertificate.ISSUED_to_WITHDRAWN
          - state_machines.ProductionBatch.RELEASED_to_STOP_DISTRIBUTION
