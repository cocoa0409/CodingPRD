            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${s_bedside}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-24T08:00:00Z", shift_end_utc: "2026-08-24T18:00:00Z" }
