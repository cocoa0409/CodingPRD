              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-r7b@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_1: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_2: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_3: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "L", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_4: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_1}", requested_reason_code: "FIT_TOO_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_1: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_2}", requested_reason_code: "CHANGE_OF_MIND" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_2: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_3}", requested_reason_code: "CHANGE_OF_MIND" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_3: $.data.id }
            - call: "GET /fit-program/customer-profiles/${customer_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { pre_abuse: $.data.abuse_status, pre_rate: $.data.return_rate_bp }
            - call: "POST /fit-program/return-cases/${case_1}/classify"
              payload: { reason_code: "FIT_TOO_SMALL" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
