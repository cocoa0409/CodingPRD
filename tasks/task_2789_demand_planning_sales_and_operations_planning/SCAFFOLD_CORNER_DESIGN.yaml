scaffold_corner_design:
  # =========================================================================
  # §1.9 breadth probe for task 2789 (Demand Planning & S&OP).
  #
  # Walked row-by-row against references/claim-extraction-guide.md over this
  # scaffold's own §1.1-§1.7. Section names and claim_type values come from the
  # guide's nine tables and nothing else. Corners already asserted by a §1.8
  # instance appear as `excluded_because:` stubs naming that instance.
  #
  # Shared prose fixture referenced by many recipes below ("the base fixture"):
  #   ProductFamily FAM-BASE  units_per_hour 100, max_monthly_hours 800
  #   Item SKU-BASE           unit_price_cents 1000, unit_cost_cents 400,
  #                           on_hand_units 0, material_supply_cap_units 100000,
  #                           avg_monthly_demand_units 1000, MATURE, and the
  #                           policy defaults 95.0 / 0.20 / 30 which make
  #                           safety_stock_units 330 and reorder_point_units 1330
  #   Customer CUST-BASE      GROCERY, priority_rank 3, credit_hold false
  #   PlanningCycle           horizon 2026-09..2026-09, NET_INVENTORY_FIRST
  #   Logical clock           left at its 2026-08-01T00:00:00Z default
  # =========================================================================

  - section: entities
    instances:
      - name: create_product_family_returns_201_with_initialized_accuracy_fields
        claim_type: Creation
        grounds:
          - endpoints[POST /sop/product-families]
          - entities.ProductFamily.fields.rolling_wmape_pct
          - entities.ProductFamily.fields.accuracy_grade
        distinguishing_aspect: |
          A family created before any AccuracyRecord exists must come back with the
          UNSCORED sentinel set, not with zeros: rolling_wmape_pct / rolling_bias_pct are
          null (not 0), bias_flag is NONE and accuracy_grade is UNGRADED (not "A"). Zero
          error and no data are different states and calc_accuracy_rollup distinguishes them.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
          assert:
            - "Status is 201 and the envelope has meta.api_request_id, meta.api_request_timestamp and response_type \"object\""
            - "ProductFamily.${fam_id}.family_code == \"FAM-BASE\", units_per_hour == 100, max_monthly_hours == 800, accountable_planner_user_id == \"planner-1\""
            - "rolling_wmape_pct is null and rolling_bias_pct is null (NOT 0)"
            - "bias_flag == \"NONE\", accuracy_grade == \"UNGRADED\", scored_record_count == 0"
            - "id, created_at, updated_at are present and version == 1"

      - name: get_planning_cycle_returns_stored_money_and_posture_fields
        claim_type: Retrieval
        grounds:
          - endpoints[GET /sop/planning-cycles/{cycle_id}]
          - calculations.calc_cycle_financials
          - calculations.calc_cycle_posture
        distinguishing_aspect: |
          A freshly opened cycle is already reconciled once: gross_gap_cents equals the whole
          financial_commitment_cents because plan_value_cents is 0, residual_gap_cents equals
          gross_gap_cents because nothing is selected, and posture is therefore AT_RISK from
          creation rather than GREEN. The read must return those computed values verbatim.
        test_recipe:
          setup:
            - "One PlanningCycle opened with financial_commitment_cents 2_000_000 and no children."
          setup_api_calls:
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-READ", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 2000000, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "GET /sop/planning-cycles/${cycle_id}"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
          assert:
            - "Status is 200 and data.id == ${cycle_id}"
            - "status == \"DEMAND_REVIEW\", reopen_count == 0, published_at is null"
            - "plan_value_cents == 0, gross_gap_cents == 2000000, selected_closure_cents == 0, residual_gap_cents == 2000000"
            - "constrained_plan_count == 0 and posture == \"AT_RISK\" (residual_gap_cents > 0 alone is enough)"
            - "version == 1 — a pure read never increments version"

      - name: list_items_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /sop/items]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three items exist but limit=2 is requested, so the page must carry exactly two rows
          with total_count 3 and has_more true, and the offset=2 page must carry the single
          remaining row with has_more false. total_count counts the whole filtered set, not
          the page.
        test_recipe:
          setup:
            - "One ProductFamily and three Items in it."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-P1", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
            - call: "POST /sop/items"
              payload: { sku: "SKU-P2", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
            - call: "POST /sop/items"
              payload: { sku: "SKU-P3", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
          trigger:
            - call: "GET /sop/items?family_id=${fam_id}&limit=2&offset=0"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "GET /sop/items?family_id=${fam_id}&limit=2&offset=2"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
          assert:
            - "First call: status 200, response_type \"array\", exactly 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second call: exactly 1 row, total_count == 3, offset == 2, has_more == false"
            - "The three rows across both pages are disjoint and together cover SKU-P1, SKU-P2 and SKU-P3"

      - name: get_supply_plan_with_unknown_uuid_returns_supply_plan_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /sop/supply-plans/{supply_plan_id}]
          - errors.ERR_SUPPLY_PLAN_NOT_FOUND
          - validations[priority=40]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID in the path must produce 404
          ERR_SUPPLY_PLAN_NOT_FOUND, not 200 with a null body and not 400. Priority 40
          resolves path ids for reads exactly as it does for writes.
        test_recipe:
          setup:
            - "Empty database — no SupplyPlan of any kind exists."
          setup_api_calls: []
          trigger:
            - call: "GET /sop/supply-plans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { err: $.data.error_id }
          assert:
            - "Status is 404 and response_type == \"error\""
            - "${err} == \"ERR_SUPPLY_PLAN_NOT_FOUND\" and data.message is a non-empty string"

      - name: create_item_missing_family_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /sop/items]
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          family_id is `source: input` with no default, so omitting it is a priority-30 shape
          failure (400 ERR_INVALID_REQUEST) and must NOT be reported as the priority-50
          existence failure ERR_FAMILY_NOT_FOUND — a missing key and an unresolvable key are
          different rungs of the ladder.
        test_recipe:
          setup:
            - "One ProductFamily exists so that the only defect in the request is the missing key."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
          trigger:
            - call: "POST /sop/items"
              payload: { sku: "SKU-NOFAM", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000 }
              as: SopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Status is 400 and ${err} == \"ERR_INVALID_REQUEST\" (NOT 404 ERR_FAMILY_NOT_FOUND)"
            - "GET /sop/items returns total_count == 0 — nothing was persisted"

      - name: create_item_omitting_policy_fields_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Item.fields.service_level_target_pct
          - entities.Item.fields.demand_cv
          - entities.Item.fields.lead_time_days
          - entities.Item.fields.npi_ramp_pct
          - entities.Item.fields.lifecycle_state
          - calculations.calc_inventory_policy
        distinguishing_aspect: |
          Every optional Item field has a non-null declared default AND the defaults feed
          calc_inventory_policy in the same request, so the response must show
          95.0 / 0.20 / 30 producing safety_stock_units 330 and reorder_point_units 1330 —
          not 0 / 0 as would happen if the defaults were applied after the calculation.
          lifecycle_state also defaults to MATURE on create, overriding the entity's
          PRELAUNCH initial_state.
        test_recipe:
          setup:
            - "One ProductFamily."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /sop/items"
              payload: { sku: "SKU-DEFAULTS", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000 }
              as: SopAdmin
              captures: { item_id: $.data.id }
          assert:
            - "Status is 201; Item.${item_id}.npi_ramp_pct == 100, service_level_target_pct == 95.0, demand_cv == 0.30, lead_time_days == 30"
            - "lifecycle_state == \"MATURE\" (the create-time default, not PRELAUNCH)"
            - "successor_item_id is null and runout_end_month is null"
            - "safety_stock_units == 495 == ceil(1.65 * 0.30 * 1000 * sqrt(30/30)) and reorder_point_units == 1495 == ceil(1000 * 30 / 30) + 495"
            - "495 and NOT 496: 1.65 * 0.30 * 1000 is EXACTLY 495, so the ceiling is a no-op; an IEEE-754 double multiply yields 495.00000000000006 and ceils to 496, which is the wrong answer"

      - name: create_demand_forecast_ignores_client_supplied_computed_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.DemandForecast.fields.baseline_units
          - entities.DemandForecast.fields.method
          - entities.DemandForecast.fields.consensus_units
          - calculations.calc_statistical_baseline
        distinguishing_aspect: |
          baseline_units, method and consensus_units are `source: computed`. A request that
          also sends baseline_units 99999, method "CROSTON_FLAT" and consensus_units 1 must
          have all three silently ignored (priority 30 ignores unknown/non-input keys) and
          overwritten by calc_statistical_baseline's own 1000 / HOLT_WINTERS / 1000.
        test_recipe:
          setup:
            - "The base fixture: family, MATURE item with demand_cv 0.20, customer, and a cycle over 2026-09..2026-09."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-IGN", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0, baseline_units: 99999, method: "CROSTON_FLAT", consensus_units: 1, status: "CONSENSUS_LOCKED" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id }
          assert:
            - "Status is 201 — the extra keys are ignored, not rejected"
            - "DemandForecast.${fc_id}.method == \"HOLT_WINTERS\" (demand_cv 0.20 < 0.75 and the item is not PRELAUNCH), NOT the supplied \"CROSTON_FLAT\""
            - "baseline_units == 1000 and consensus_units == 1000, NOT 99999 and NOT 1"
            - "status == \"BASELINE\" — the supplied status is ignored and the entity's initial_state wins"
            - "endorsed_adjustment_count == 0"

      - name: create_customer_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Customer.fields.credit_hold
          - endpoints[POST /sop/customers]
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-stamped. A create that supplies
          all four must have them all replaced: id is a fresh server value different from the
          supplied one, version is 1 regardless of the supplied 77, and created_at comes from
          the logical clock (2026-08-01T00:00:00Z), not from the client's 1999 string.
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-SYS", name: "System Fields Grocery", channel: "GROCERY", priority_rank: 3, id: "11111111-1111-1111-1111-111111111111", version: 77, created_at: "1999-01-01T00:00:00Z", updated_at: "1999-01-01T00:00:00Z" }
              as: SopAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "Status is 201 and ${cust_id} != \"11111111-1111-1111-1111-111111111111\""
            - "version == 1, NOT 77"
            - "created_at == \"2026-08-01T00:00:00Z\" (the logical clock), NOT \"1999-01-01T00:00:00Z\""
            - "credit_hold == false — the declared default was applied because the key was absent"
            - "GET /sop/customers/11111111-1111-1111-1111-111111111111 returns 404 ERR_CUSTOMER_NOT_FOUND"

      - name: create_customer_with_unknown_channel_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Customer.fields.channel
          - entities.Customer.fields.priority_rank
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Two independent priority-30 sub-checks on the same endpoint: an enum value outside
          {GROCERY, CLUB, DISCOUNT, ECOMMERCE} and a numeric value below the declared
          priority_rank >= 1 floor. Both must yield 400 ERR_INVALID_REQUEST, and rank 1
          (exactly the floor) must be accepted.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BAD-CH", name: "Wholesale", channel: "WHOLESALE", priority_rank: 3 }
              as: SopAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BAD-RANK", name: "Zero Rank", channel: "GROCERY", priority_rank: 0 }
              as: SopAdmin
              captures: { err_rank: $.data.error_id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-RANK-1", name: "Rank One", channel: "GROCERY", priority_rank: 1 }
              as: SopAdmin
              captures: { ok_id: $.data.id }
          assert:
            - "First call: 400 with ${err_enum} == \"ERR_INVALID_REQUEST\""
            - "Second call: 400 with ${err_rank} == \"ERR_INVALID_REQUEST\""
            - "Third call: 201 — priority_rank == 1 is exactly the declared floor and is accepted; Customer.${ok_id}.priority_rank == 1"
            - "GET /sop/customers returns total_count == 1 — neither rejected request persisted a row"

      - name: accuracy_record_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.AccuracyRecord
          - endpoints[GET /sop/accuracy-records/{record_id}]
        distinguishing_aspect: |
          AccuracyRecord is the scaffold's only `common_fields: false` entity: it carries id
          and created_at but deliberately no updated_at and no version, and §1.5 exposes no
          mutating endpoint for it at all. Posting a second actual for the same
          (cycle, item, customer) triple is a 409, not an update — the row can never be
          rewritten, only rejected.
        test_recipe:
          setup:
            - "The base fixture driven all the way to PUBLISHED with a single CONSENSUS_LOCKED forecast of 1000 units for 2026-09 and financial_commitment_cents 0, then one AccuracyRecord posted with actual_units 900."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-IMMUT", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", actual_units: 900 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "GET /sop/accuracy-records/${rec_id}"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", actual_units: 1000 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "The read returns 200 with id and created_at present and NO `version` key and NO `updated_at` key in data"
            - "forecast_units_snapshot == 1000, actual_units == 900, signed_error_units == 100, abs_error_units == 100, ape_pct == 11.11 == round_half_up(100/900*100, 2)"
            - "accountable_planner_user_id == \"planner-1\", copied from the family and not from the caller"
            - "The second post returns 409 with ${err} == \"ERR_DUPLICATE_ACCURACY_RECORD\""
            - "Re-reading ${rec_id} still shows actual_units == 900 — the rejected write changed nothing"

      - name: create_item_with_unknown_family_id_returns_family_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=50]
          - errors.ERR_FAMILY_NOT_FOUND
          - entities.Item.fields.family_id
        distinguishing_aspect: |
          The topology is flat, so Item's parent is expressed as a body FK rather than a URL
          segment. Priority 50 must therefore resolve family_id from the BODY and answer 404
          ERR_FAMILY_NOT_FOUND — not 400 (the key is present and well-typed) and not 201 with
          a dangling pointer.
        test_recipe:
          setup:
            - "One ProductFamily exists, but the request cites a different, unknown id."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
          trigger:
            - call: "POST /sop/items"
              payload: { sku: "SKU-ORPHAN", family_id: "00000000-0000-0000-0000-0000000000aa", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000 }
              as: SopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Status is 404 and ${err} == \"ERR_FAMILY_NOT_FOUND\""
            - "GET /sop/items returns total_count == 0"

      - name: create_demand_forecast_with_unknown_customer_id_returns_customer_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=50]
          - errors.ERR_CUSTOMER_NOT_FOUND
          - entities.DemandForecast.fields.customer_id
        distinguishing_aspect: |
          A DemandForecast is an (item x customer) junction carrying THREE body FKs, and
          priority 50 must check all of them. With cycle_id and item_id both valid and only
          customer_id unknown, the answer must name the customer specifically
          (ERR_CUSTOMER_NOT_FOUND), not a generic 404 or the first FK in the body.
        test_recipe:
          setup:
            - "The base fixture's family, MATURE item and cycle exist; no Customer has been created at all."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-FK", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "00000000-0000-0000-0000-0000000000bb", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "Status is 404 and ${err} == \"ERR_CUSTOMER_NOT_FOUND\" (not ERR_CYCLE_NOT_FOUND and not ERR_ITEM_NOT_FOUND — those two FKs resolve)"
            - "GET /sop/demand-forecasts?cycle_id=${cycle_id} returns total_count == 0"

  - section: state_machines
    instances:
      - name: planning_cycle_created_in_demand_review_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.PlanningCycle.initial_state
          - entities.PlanningCycle.fields.status
        distinguishing_aspect: |
          A newly opened cycle must sit in DEMAND_REVIEW with reopen_count 0 and published_at
          null, and a supplied status must not be honoured — the initial_state is not a
          client-settable field, so an attempt to open a cycle already in EXECUTIVE_REVIEW
          still lands in DEMAND_REVIEW.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-INIT", horizon_start_month: "2026-09", horizon_end_month: "2026-11", financial_commitment_cents: 0, supply_review_policy: "GROSS_CAPACITY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
          assert:
            - "Status is 201 and PlanningCycle.${cycle_id}.status == \"DEMAND_REVIEW\""
            - "reopen_count == 0, published_at is null, version == 1"
            - "supply_review_policy == \"GROSS_CAPACITY_FIRST\" — the policy IS client-settable, unlike status"
            - "GET /sop/planning-cycles?status=DEMAND_REVIEW returns total_count == 1"

      - name: cycle_demand_to_supply_review_locks_forecasts_and_commits_endorsements
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PlanningCycle.DEMAND_REVIEW_to_SUPPLY_REVIEW
          - state_machines.DemandForecast.UNDER_CONSENSUS_to_CONSENSUS_LOCKED
          - state_machines.DemandForecast.BASELINE_to_CONSENSUS_LOCKED
          - state_machines.ConsensusAdjustment.ENDORSED_to_COMMITTED
        distinguishing_aspect: |
          One transition fans out over two different forecast source states and one adjustment
          state: the UNDER_CONSENSUS line and the untouched BASELINE line must BOTH reach
          CONSENSUS_LOCKED, the ENDORSED adjustment must reach COMMITTED, and consensus_units
          must NOT move when ENDORSED becomes COMMITTED (both statuses contribute, so the sum
          is invariant across the commit) — the classic double-count trap.
        test_recipe:
          setup:
            - "The base fixture plus a second Customer. Cycle over 2026-09..2026-09 with financial_commitment_cents 0."
            - "Forecast A for CUST-BASE (level 1000, baseline 1000) carries one ENDORSED SALES_INTELLIGENCE adjustment of +100, so it is UNDER_CONSENSUS with consensus_units 1100."
            - "Forecast B for CUST-TWO (level 400, baseline 400) carries no adjustments and is still BASELINE."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-TWO", name: "Second Club", channel: "CLUB", priority_rank: 4 }
              as: SopAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-LOCK", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${c1_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_a_id: $.data.id, fc_a_v1: $.data.version }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${c2_id}", month: "2026-09", level_units: 400, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_b_id: $.data.id }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_a_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "incremental door count", expected_demand_forecast_version: "${fc_a_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "ENDORSE" }
              as: DemandReviewLead
              as_user_id: "lead-1"
          trigger:
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
          assert:
            - "Status is 200 and PlanningCycle.${cycle_id}.status == \"SUPPLY_REVIEW\""
            - "DemandForecast.${fc_a_id}.status == \"CONSENSUS_LOCKED\" (it came from UNDER_CONSENSUS)"
            - "DemandForecast.${fc_b_id}.status == \"CONSENSUS_LOCKED\" (it came straight from BASELINE with no adjustments)"
            - "ConsensusAdjustment.${adj_id}.status == \"COMMITTED\" and applied_delta_units == 100 (unchanged by the commit)"
            - "DemandForecast.${fc_a_id}.consensus_units == 1100 and endorsed_adjustment_count == 1 — COMMITTED still contributes exactly once, so the value did NOT move to 1200"
            - "DemandForecast.${fc_b_id}.consensus_units == 400 == its baseline_units"
            - "PlanningCycle.${cycle_id}.plan_value_cents == 0 (no SupplyPlan yet), residual_gap_cents == 0 and posture == \"GREEN\""

      - name: cycle_advance_with_open_adjustment_rejected_with_open_adjustments
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PlanningCycle.DEMAND_REVIEW_to_SUPPLY_REVIEW
          - errors.ERR_OPEN_ADJUSTMENTS
          - validations[priority=130]
        distinguishing_aspect: |
          The demand review cannot close over an unreviewed proposal. A single PROPOSED
          adjustment anywhere in the cycle blocks the advance with 422 ERR_OPEN_ADJUSTMENTS,
          and the rejection must be atomic — the forecast must still be UNDER_CONSENSUS
          afterwards, not half-locked. Once the adjustment is REJECTED (a terminal, non-open
          status) the identical advance succeeds.
        test_recipe:
          setup:
            - "The base fixture with a cycle over 2026-09..2026-09 (commitment 0), one forecast of baseline 1000 and one PROPOSED SALES_INTELLIGENCE adjustment of +100 on it."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-OPEN", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v1: $.data.version }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "awaiting review", expected_demand_forecast_version: "${fc_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id }
          trigger:
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
              captures: { err: $.data.error_id }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "REJECT", review_note: "not substantiated" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
          assert:
            - "First advance returns 422 with ${err} == \"ERR_OPEN_ADJUSTMENTS\""
            - "After the rejected advance PlanningCycle.${cycle_id}.status is still \"DEMAND_REVIEW\" and DemandForecast.${fc_id}.status is still \"UNDER_CONSENSUS\" — nothing was half-applied"
            - "ConsensusAdjustment.${adj_id}.status == \"REJECTED\" and DemandForecast.${fc_id}.consensus_units == 1000 (a REJECTED adjustment never contributes)"
            - "Second advance returns 200: status == \"SUPPLY_REVIEW\" and DemandForecast.${fc_id}.status == \"CONSENSUS_LOCKED\" — REJECTED is not an open status"

      - name: cycle_publish_with_positive_residual_gap_rejected_with_unclosed_gap
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PlanningCycle.EXECUTIVE_REVIEW_to_PUBLISHED
          - errors.ERR_UNCLOSED_GAP
          - validations[priority=170]
        distinguishing_aspect: |
          A cycle with a commitment but no supply plan and no selected scenario reaches
          EXECUTIVE_REVIEW perfectly legally — the gap check lives only on the PUBLISHED edge.
          residual_gap_cents 5_000_000 > 0 therefore rejects the publish with 422
          ERR_UNCLOSED_GAP while leaving status EXECUTIVE_REVIEW and published_at null.
        test_recipe:
          setup:
            - "A cycle with financial_commitment_cents 5_000_000, no forecasts, no supply plans and no scenarios, walked to EXECUTIVE_REVIEW."
          setup_api_calls:
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-GAP", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 5000000, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
          trigger:
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { err: $.data.error_id }
          assert:
            - "Status is 422 and ${err} == \"ERR_UNCLOSED_GAP\""
            - "PlanningCycle.${cycle_id}.status is still \"EXECUTIVE_REVIEW\", published_at is still null and posture is still \"AT_RISK\" (not FROZEN)"
            - "plan_value_cents == 0, gross_gap_cents == 5000000, selected_closure_cents == 0, residual_gap_cents == 5000000"

      - name: cycle_cannot_skip_demand_review_straight_to_executive_review
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PlanningCycle.transitions
          - errors.ERR_CYCLE_TRANSITION_INVALID
          - validations[priority=120]
        distinguishing_aspect: |
          DEMAND_REVIEW declares exactly one outgoing edge (SUPPLY_REVIEW). Every other
          target_status from DEMAND_REVIEW — including EXECUTIVE_REVIEW, PUBLISHED and a
          self-loop back to DEMAND_REVIEW — must be rejected with 409
          ERR_CYCLE_TRANSITION_INVALID at priority 120, not silently accepted and not reported
          as a phase error.
        test_recipe:
          setup:
            - "One freshly opened cycle in DEMAND_REVIEW with commitment 0."
          setup_api_calls:
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-SKIP", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
              captures: { err_exec: $.data.error_id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { err_pub: $.data.error_id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "DEMAND_REVIEW", reopen_reason: "self loop attempt" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { err_self: $.data.error_id }
          assert:
            - "All three calls return 409 and ${err_exec} == ${err_pub} == ${err_self} == \"ERR_CYCLE_TRANSITION_INVALID\""
            - "PlanningCycle.${cycle_id}.status is still \"DEMAND_REVIEW\", reopen_count == 0 and version == 1 — three rejected transitions bumped nothing"

      - name: published_cycle_rejects_every_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PlanningCycle.terminal_states
          - errors.ERR_CYCLE_TRANSITION_INVALID
          - calculations.calc_cycle_posture
        distinguishing_aspect: |
          PUBLISHED is terminal AND sets posture FROZEN, so it locks down along two separate
          axes: further cycle transitions die at priority 120 with
          ERR_CYCLE_TRANSITION_INVALID (priority 100 does not apply to the transitions
          endpoint), while child writes die at priority 100 with ERR_CYCLE_FROZEN. Both must
          be observable from the same published cycle.
        test_recipe:
          setup:
            - "The base fixture with a cycle over 2026-09..2026-09 (commitment 0) and no children, walked all the way to PUBLISHED."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-TERM", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { pub_v: $.data.version }
          trigger:
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "DEMAND_REVIEW", reopen_reason: "post-publication rework" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { err_reopen: $.data.error_id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
              captures: { err_back: $.data.error_id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 500, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_child: $.data.error_id }
          assert:
            - "PlanningCycle.${cycle_id}.status == \"PUBLISHED\", posture == \"FROZEN\" and published_at == \"2026-08-01T00:00:00Z\" (the untouched logical clock)"
            - "The reopen attempt returns 409 with ${err_reopen} == \"ERR_CYCLE_TRANSITION_INVALID\" — PUBLISHED has no outgoing edge, so even the reopen edge that exists from EXECUTIVE_REVIEW is gone"
            - "The backward attempt returns 409 with ${err_back} == \"ERR_CYCLE_TRANSITION_INVALID\""
            - "The child write returns 409 with ${err_child} == \"ERR_CYCLE_FROZEN\" — a different error for a different endpoint class"
            - "PlanningCycle.${cycle_id}.version == ${pub_v} — no rejected call incremented it"

      - name: second_ration_of_the_same_supply_plan_rejected
          # Idempotency: the guide's "same trigger twice -> error on second attempt" row.
        claim_type: Idempotency
        grounds:
          - state_machines.SupplyPlan.PLANNED_to_RATIONED
          - errors.ERR_SUPPLY_PLAN_NOT_RATIONABLE
          - calculations.calc_rationing_waterfall
          - calculations.inv_allocation_units_conserved
        distinguishing_aspect: |
          Rationing is NOT idempotent-by-replay: the second call must be refused with 409
          ERR_SUPPLY_PLAN_NOT_RATIONABLE rather than silently re-running the waterfall, which
          would either duplicate the Allocation rows or double-spend unallocated_units. The
          conserved identity must read identically before and after the refused call.
        test_recipe:
          setup:
            - "The base fixture, one Customer of priority_rank 3, a 9-hour CapacityBlock inside the 2026-09 horizon (900 units), a CONSENSUS_LOCKED forecast of 1000 units, and a SupplyPlan already RATIONED in SUPPLY_REVIEW."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 9 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-IDEM", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id }
            - call: "POST /sop/demand-forecasts/${fc_id}/transitions"
              payload: { target_status: "CONSENSUS_LOCKED" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
            - call: "POST /sop/supply-plans/${plan_id}/ration"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_v: $.data.version }
          trigger:
            - call: "POST /sop/supply-plans/${plan_id}/ration"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { err: $.data.error_id }
          assert:
            - "The first ration produced SupplyPlan.${plan_id}.status == \"RATIONED\", constrained_units == 900, unallocated_units == 0 and exactly ONE Allocation of 900 units with fill_rate_pct == 90.00 and allocation_pass == \"PRO_RATA\""
            - "The second call returns 409 with ${err} == \"ERR_SUPPLY_PLAN_NOT_RATIONABLE\""
            - "GET /sop/allocations?supply_plan_id=${plan_id} still returns total_count == 1 — no duplicate row was created"
            - "SupplyPlan.${plan_id}.unallocated_units == 0 and version == ${plan_v} — 900 + 0 == constrained_units 900 is unchanged"

      - name: item_prelaunch_to_cancelled_npi_truncates_forecasts_and_voids_new_item_plans
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Item.PRELAUNCH_to_CANCELLED_NPI
          - state_machines.DemandForecast.UNDER_CONSENSUS_to_RUNOUT_TRUNCATED
          - state_machines.ConsensusAdjustment.ENDORSED_to_VOIDED
          - state_machines.Promotion.DRAFT_to_CANCELLED_RUNOUT
        distinguishing_aspect: |
          Cancelling an NPI truncates EVERY month unconditionally — there is no
          runout_end_month boundary to compare against, unlike MATURE_to_RUNOUT. All three
          fan-out targets must move in the same request: the ENDORSED NEW_ITEM_PLAN adjustment
          to VOIDED with applied_delta_units 0, the forecast to RUNOUT_TRUNCATED with
          consensus_units 0 (baseline_units preserved), and the DRAFT promotion to
          CANCELLED_RUNOUT.
        test_recipe:
          setup:
            - "A PRELAUNCH item (npi_ramp_pct 100) in the base family, one customer, and a cycle over 2026-09..2026-09 with commitment 0."
            - "One forecast for 2026-09 (level 1000, ANALOG_PROFILE baseline 1000) carrying one ENDORSED NEW_ITEM_PLAN adjustment of +100, so consensus_units is 1100."
            - "One DRAFT Promotion on the same item for 2026-10..2026-10 (it cannot be approved while the item is PRELAUNCH)."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-NPI", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, npi_ramp_pct: 100, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "PRELAUNCH" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-NPI", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v1: $.data.version }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-10", end_month: "2026-10", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_id: $.data.id }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "NEW_ITEM_PLAN", delta_units: 100, rationale: "launch pipeline fill", expected_demand_forecast_version: "${fc_v1}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "ENDORSE" }
              as: DemandReviewLead
              as_user_id: "lead-1"
          trigger:
            - call: "POST /sop/items/${item_id}/lifecycle-transitions"
              payload: { target_state: "CANCELLED_NPI" }
              as: SopAdmin
          assert:
            - "Before the trigger: DemandForecast.${fc_id}.method == \"ANALOG_PROFILE\", baseline_units == 1000, consensus_units == 1100, endorsed_adjustment_count == 1"
            - "Status is 200 and Item.${item_id}.lifecycle_state == \"CANCELLED_NPI\""
            - "ConsensusAdjustment.${adj_id}.status == \"VOIDED\" and applied_delta_units == 0"
            - "DemandForecast.${fc_id}.status == \"RUNOUT_TRUNCATED\", consensus_units == 0, endorsed_adjustment_count == 0, and baseline_units is STILL 1000"
            - "Promotion.${promo_id}.status == \"CANCELLED_RUNOUT\" even though its 2026-10 window is outside the cycle horizon — NPI cancellation ignores months entirely"
            - "PlanningCycle.${cycle_id}.plan_value_cents == 0 and posture == \"GREEN\""

      - name: item_prelaunch_to_ramp_touches_no_other_entity
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Item.PRELAUNCH_to_RAMP
          - state_machines.Item.PRELAUNCH_to_CANCELLED_NPI
        distinguishing_aspect: |
          The other branch of the same PRELAUNCH fork has a deliberately EMPTY cross-entity
          side-effect set. From byte-identical prior state, RAMP must leave the forecast
          UNDER_CONSENSUS with consensus_units 1000, the adjustment PROPOSED with
          applied_delta_units 100 and the promotion DRAFT — and must not increment
          DemandForecast.version. Only Item.version moves.
        test_recipe:
          setup:
            - "Exactly the fixture of item_prelaunch_to_cancelled_npi_truncates_forecasts_and_voids_new_item_plans, except the NEW_ITEM_PLAN adjustment is left PROPOSED (never reviewed), so the forecast is UNDER_CONSENSUS with consensus_units still 1000."
