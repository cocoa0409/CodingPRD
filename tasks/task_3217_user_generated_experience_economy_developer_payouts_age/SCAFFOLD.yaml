  - method: POST
    path: "/ugc/_engagement/settle_monthly"
    description: "Test-driving endpoint: run the monthly engagement settlement across all experiences"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { settled_count: "integer", total_robux_credited: "integer" }
    side_effects: ["For each PUBLISHED experience: creator.earned_robux_lifetime += engagement_payout_pending_robux; pending reset to 0"]

  # --- Reverse-reachability list endpoints (filtered-list form per §1.5) ---
  - method: GET
    path: "/ugc/experience-age-ratings/{id}"
