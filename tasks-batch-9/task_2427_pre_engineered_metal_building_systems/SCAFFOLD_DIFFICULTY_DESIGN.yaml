            - "Line PL-1 (PLATE_CUT_WELD) carries one SCHEDULED PRIMARY_FRAME_FAB lot for o1."
            - "One PLANNED shipment load carries the PRIMARY_FRAME mark C-1."
          setup_api_calls:
