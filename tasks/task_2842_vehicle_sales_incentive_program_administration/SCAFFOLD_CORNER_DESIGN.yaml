            - call: "POST /incentives/claims"
              payload: { delivery_id: "${d_a4}", program_id: "${prog_id}", claimed_amount_cents: 10000, expected_program_version: "${pv3}" }
              as: Dealer
              as_user_id: "${dealer_a}"
              captures: { claim_a2: $.data.id }
            - call: "POST /incentives/claims/${claim_a2}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { err_unfinalized: $.data.error_id }
            - call: "GET /incentives/claims/${claim_a2}"
              payload: {}
              as: ClaimsAuditor
