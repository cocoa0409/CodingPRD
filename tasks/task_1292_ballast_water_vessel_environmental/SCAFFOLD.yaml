  - method: POST
    path: "/vessels/{vessel_id}/deficiencies/{deficiency_id}/claim-rectified"
    description: "Master claims rectification complete"
    roles: [VesselMaster]
    code: 200
    input: [expected_deficiency_version]
    output: PortStateControlDeficiency
    side_effects: ["rectification_status RECTIFYING -> RECTIFIED", "rectified_at set", "increments deficiency.version"]

  - method: POST
    path: "/vessels/{vessel_id}/deficiencies/{deficiency_id}/verify"
    description: "PSC verifies rectification"
    roles: [PSCOfficer]
    code: 200
    input: []
    output: PortStateControlDeficiency
    side_effects: ["rectification_status RECTIFIED -> VERIFIED", "verified_at set", "vessel.compliance_posture recomputed"]

  - method: POST
    path: "/vessels/{vessel_id}/deficiencies/{deficiency_id}/reject-verification"
    description: "PSC rejects rectification claim"
    roles: [PSCOfficer]
    code: 200
    input: []
    output: PortStateControlDeficiency
    side_effects: ["rectification_status RECTIFIED -> REOPENED", "rectification_deadline extended +7 days", "vessel.compliance_posture recomputed"]

  # --- Record Books ---
  - method: POST
