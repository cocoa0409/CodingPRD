            - "EligibilityCheck.${chk1_id}.status == ELIGIBLE_CONFIRMED"
            - "Provider.${prov_a_id}.active_enrollment_count == 0"
            - "HouseholdAddress.${addr1_id}.occupied_benefit_slots == 0"
            - "Subscriber.${sub1_id}.status == VERIFIED_ELIGIBLE"

