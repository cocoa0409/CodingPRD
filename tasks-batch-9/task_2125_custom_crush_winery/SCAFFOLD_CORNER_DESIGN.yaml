  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: corner_version_increments_on_every_mutation_across_entities
        claim_type: optimistic_concurrency
        grounds: ["entities.Client", "entities.Contract", "entities.Vessel", "concurrency_rules[allocation-reserve-stale-vessel]"]
        distinguishing_aspect: "version starts at 1 on creation and increments by exactly 1 per mutation, including cascaded ones: after SUBMIT and ACTIVATE the contract reads 3, and reserving an allocation carries it to 4 while the vessel moves 1 -> 2."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id, cv1: $.data.version }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cv2: $.data.version }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cv3: $.data.version }
            - call: "POST /vessels"
              payload: { vessel_code: "T-101", vessel_type: "TANK", capacity_gallons: 4000, facility_zone: "ZONE_A" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { v1: $.data.id, vv1: $.data.version }
            - call: "POST /vessel-allocations"
              payload: { contract_id: "${ct1}", vessel_id: "${v1}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-11-01T00:00:00Z", allocated_gallons: 2000, expected_vessel_version: "${vv1}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { al1: $.data.id, av1: $.data.version }
            - call: "GET /vessels/${v1}"
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { vv2: $.data.version }
            - call: "GET /contracts/${ct1}"
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cv4: $.data.version }
          assert:
            - "${cv1} == 1, ${cv2} == 2, ${cv3} == 3"
            - "${vv1} == 1 and ${vv2} == 2 (the reserve advanced the vessel)"
            - "${av1} == 1 for the brand-new allocation"
            - "${cv4} == 4 (the reserve's counter recompute advanced the contract)"
            - "Client.${cl1}.version == 1 (untouched by any of these calls)"

