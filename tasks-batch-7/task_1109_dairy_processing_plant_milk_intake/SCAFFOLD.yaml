  # Grade A permits
  - method: POST
    path: /dairy/grade-a-permits
    description: "Register a Grade A permit"
    roles: [StateInspector]
    code: 201
    input: [permit_number, issued_at, expires_at]
    output: GradeAPermit
    side_effects: []

  - method: GET
    path: /dairy/grade-a-permits/{id}
    description: "Fetch a permit"
    roles: [StateInspector, PlantController, QualityAssuranceManager]
    code: 200
    input: []
    output: GradeAPermit
    side_effects: []

  - method: POST
    path: /dairy/grade-a-permits/{id}/record-inspection
    description: "Record a state inspection result"
    roles: [StateInspector]
    code: 200
    input: [inspection_score, violations_found]
    output: GradeAPermit
    side_effects: ["inspection_score, violation_count_12mo updated; possibly ACTIVE → UNDER_REVIEW"]

  - method: POST
    path: /dairy/grade-a-permits/{id}/suspend
    description: "Suspend a permit (≥3 violations)"
    roles: [StateInspector]
    code: 200
    input: []
    output: GradeAPermit
    side_effects: ["status UNDER_REVIEW → SUSPENDED; SCHEDULED runs CANCELLED"]

  - method: POST
    path: /dairy/grade-a-permits/{id}/reinstate
    description: "Reinstate a permit"
    roles: [StateInspector]
    code: 200
    input: []
    output: GradeAPermit
    side_effects: ["status UNDER_REVIEW → REINSTATED"]

  - method: POST
    path: /dairy/grade-a-permits/{id}/revoke
    description: "Revoke a permit (≥5 violations)"
    roles: [StateInspector]
    code: 200
    input: []
    output: GradeAPermit
    side_effects: ["status UNDER_REVIEW → REVOKED; receipts diverted"]

  # Marketing order pools
  - method: POST
    path: /dairy/marketing-order-pools
    description: "Create a monthly pool"
    roles: [PlantController]
    code: 201
    input: [pool_month, announced_class_i_price_cents, butterfat_price_cents_per_lb, protein_price_cents_per_lb, other_solids_price_cents_per_lb]
    output: MarketingOrderPool
    side_effects: []

  - method: GET
    path: /dairy/marketing-order-pools/{id}
    description: "Fetch a pool"
    roles: [PlantController, StateInspector]
    code: 200
    input: []
    output: MarketingOrderPool
    side_effects: []

  - method: POST
    path: /dairy/marketing-order-pools/{id}/announce
    description: "Announce a pool (DRAFT → ANNOUNCED); computes PPD"
    roles: [PlantController]
    code: 200
    input: []
    output: MarketingOrderPool
    side_effects: ["producer_price_differential_cents computed"]

  - method: POST
    path: /dairy/marketing-order-pools/{id}/finalize
    description: "Finalize a pool (ANNOUNCED → FINALIZED)"
    roles: [PlantController]
    code: 200
    input: [expected_pool_version]
    output: MarketingOrderPool
    side_effects:
      - "status ANNOUNCED → FINALIZED"
      - "increments MarketingOrderPool.version by 1"
      - "For each ProducerSettlement of the month: pricing_variant PROVISIONAL → FINAL; recomputed"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH,               http: 401, condition: "X-User-Role or X-User-ID header absent or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE,          http: 403, condition: "Role lacks permission for the endpoint per §1.7" }
  - { id: ERR_NOT_FOUND,                  http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE,              http: 409, condition: "Target resource not in the required state for this transition" }
  - { id: ERR_STALE_PRODUCER_VERSION,     http: 412, condition: "expected_producer_version does not match Producer.version" }
  - { id: ERR_STALE_POOL_VERSION,         http: 412, condition: "expected_pool_version does not match MarketingOrderPool.version" }
  - { id: ERR_ANTIBIOTIC_POSITIVE,        http: 422, condition: "TankerReceipt.antibiotic_result == POSITIVE on release" }
  - { id: ERR_SCC_EXCEEDED,               http: 422, condition: "scc_cells_per_ml >= 750000 on release" }
  - { id: ERR_TEMPERATURE_EXCEEDED,       http: 422, condition: "temperature_f > 45 on release" }
  - { id: ERR_HAULER_LICENSE_EXPIRED,     http: 422, condition: "Hauler.license_expires_at <= arrived_at on release" }
  - { id: ERR_PRODUCER_SUSPENDED,         http: 422, condition: "Producer.status != ACTIVE on release" }
  - { id: ERR_PERMIT_NOT_ACTIVE,          http: 422, condition: "GradeAPermit.status != ACTIVE or expired when operation requires ACTIVE" }
  - { id: ERR_PASTEURIZER_OVERLAP,        http: 409, condition: "Another RUNNING run on the same pasteurizer overlaps [start, end)" }
  - { id: ERR_CIP_STALE,                  http: 422, condition: "Most recent VALIDATED CipCycle is older than 24 hours" }
  - { id: ERR_CIP_VALIDATION_FAILED,      http: 422, condition: "caustic_conductivity_ms < 80.0 OR rinse_ph outside [6.5, 8.0]" }
  - { id: ERR_CIP_CAUSTIC_LOW,            http: 422, condition: "caustic_conductivity_ms < 80.0 specifically" }
  - { id: ERR_CIP_PH_OUT_OF_RANGE,        http: 422, condition: "rinse_ph outside [6.5, 8.0] specifically" }
  - { id: ERR_SOD_VIOLATION,              http: 403, condition: "Same X-User-ID attempted step A and step B of a segregation-of-duties pair" }
  - { id: ERR_SHELF_LIFE_EXCEEDED,        http: 422, condition: "shelf_life_days exceeds MAX_SHELF_LIFE for the product_code" }
  - { id: ERR_INSUFFICIENT_CODE_LIFE,     http: 422, condition: "code_date - transit_days - current_clock < min_days_of_code_required" }
  - { id: ERR_LAB_TESTS_PENDING,          http: 422, condition: "Required lab tests (ANTIBIOTIC, SCC) not all COMPLETED on release attempt" }
  - { id: ERR_RECEIPT_NOT_IN_QUARANTINE,  http: 422, condition: "Lab test complete attempted on a receipt no longer in QUARANTINE" }
  - { id: ERR_NO_REJECTION_CRITERION,     http: 422, condition: "Reject attempted with no rejection criterion met" }
  - { id: ERR_BATCH_ALREADY_CODED,        http: 422, condition: "Divert attempted after a consuming batch has been CODED" }
  - { id: ERR_BATCHES_UNFINISHED,         http: 422, condition: "Complete run attempted with batches not in CODED or SCRAPPED" }
  - { id: ERR_BATCH_IN_PRODUCTION,        http: 422, condition: "Cancel run attempted with a batch IN_PRODUCTION" }
  - { id: ERR_RUN_NOT_RUNNING,            http: 422, condition: "Begin batch attempted on a non-RUNNING run" }
  - { id: ERR_POOL_NOT_FINALIZED,         http: 422, condition: "Settlement approve attempted with pool not in FINALIZED" }
  - { id: ERR_SETTLEMENTS_ALREADY_APPROVED, http: 422, condition: "Pool finalize attempted with settlements already APPROVED" }
  - { id: ERR_PRICES_INCOMPLETE,          http: 422, condition: "Pool announce attempted with non-positive component prices" }
  - { id: ERR_ANNOUNCEMENT_TOO_EARLY,     http: 422, condition: "Pool announce attempted before the 23rd of the following month" }
  - { id: ERR_NEGATIVE_SETTLEMENT,        http: 422, condition: "Mark-paid attempted with net_payment_cents < 0" }
  - { id: ERR_INSPECTION_PASSED,          http: 422, condition: "Record-inspection moved permit to UNDER_REVIEW despite passing score" }
  - { id: ERR_INSUFFICIENT_VIOLATIONS,    http: 422, condition: "Suspend attempted with violation_count_12mo < 3" }
  - { id: ERR_VIOLATIONS_OUTSTANDING,     http: 422, condition: "Reinstate attempted with violation_count_12mo >= 3" }
  - { id: ERR_VIOLATIONS_BELOW_REVOCATION, http: 422, condition: "Revoke attempted with violation_count_12mo < 5" }
  - { id: ERR_INVALID_INPUT,              http: 400, condition: "Field type, range, or enum constraint violated" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantController
    description: "Plant financial & administrative officer; manages producers, haulers, routes, pools, settlements"
    identity: opaque
    exclusive_operations:
      - "POST /dairy/producers"
      - "POST /dairy/haulers"
      - "POST /dairy/distribution-routes"
      - "POST /dairy/marketing-order-pools"
      - "POST /dairy/marketing-order-pools/{id}/announce"
      - "POST /dairy/marketing-order-pools/{id}/finalize"
      - "POST /dairy/producers/{producerId}/settlements"
      - "POST /dairy/producers/{producerId}/settlements/{id}/approve"
      - "POST /dairy/producers/{producerId}/settlements/{id}/mark-paid"
      - "POST /dairy/producers/{producerId}/settlements/{id}/cancel"
      - "POST /dairy/_clock/set_current_utc"
    shared_operations:
      - "GET /dairy/producers"
      - "GET /dairy/producers/{id}"
      - "GET /dairy/haulers/{id}"
      - "GET /dairy/tanker-receipts"
      - "GET /dairy/pasteurizer-runs"
      - "GET /dairy/marketing-order-pools/{id}"

  - name: QualityAssuranceManager
    description: "Owns raw-milk intake disposition, CIP validation, lab oversight"
    identity: opaque
    exclusive_operations:
      - "POST /dairy/tanker-receipts"
      - "POST /dairy/tanker-receipts/{id}/release"
      - "POST /dairy/tanker-receipts/{id}/reject"
      - "POST /dairy/tanker-receipts/{id}/divert"
      - "POST /dairy/pasteurizer-runs/{runId}/cip-cycles/{id}/validate"
      - "POST /dairy/pasteurizer-runs/{runId}/cip-cycles/{id}/fail"
    shared_operations:
      - "GET /dairy/tanker-receipts"
      - "GET /dairy/tanker-receipts/{id}"
      - "GET /dairy/tanker-receipts/{id}/lab-tests"
      - "GET /dairy/producers"
      - "GET /dairy/haulers/{id}"
      - "GET /dairy/pasteurizer-runs"
      - "GET /dairy/pasteurizer-runs/{id}"

  - name: LabTechnician
    description: "Records and completes lab tests and component assays"
    identity: opaque
    exclusive_operations:
      - "POST /dairy/tanker-receipts/{id}/lab-tests"
      - "POST /dairy/tanker-receipts/{id}/lab-tests/{testId}/complete"
      - "POST /dairy/tanker-receipts/{id}/component-assays"
    shared_operations:
      - "GET /dairy/tanker-receipts/{id}"
      - "GET /dairy/tanker-receipts/{id}/lab-tests"
      - "GET /dairy/tanker-receipts/{id}/component-assays"

  - name: PasteurizerOperator
    description: "Schedules and runs pasteurizer batches and CIP cycles"
    identity: opaque
    exclusive_operations:
      - "POST /dairy/pasteurizer-runs"
      - "POST /dairy/pasteurizer-runs/{id}/start"
      - "POST /dairy/pasteurizer-runs/{id}/complete"
      - "POST /dairy/pasteurizer-runs/{id}/abort"
      - "POST /dairy/pasteurizer-runs/{id}/cancel"
      - "POST /dairy/pasteurizer-runs/{runId}/cip-cycles"
      - "POST /dairy/pasteurizer-runs/{runId}/batches"
      - "POST /dairy/pasteurizer-runs/{runId}/batches/{id}/begin"
      - "POST /dairy/pasteurizer-runs/{runId}/batches/{id}/code"
      - "POST /dairy/pasteurizer-runs/{runId}/batches/{id}/scrap"
    shared_operations:
      - "GET /dairy/pasteurizer-runs"
      - "GET /dairy/pasteurizer-runs/{id}"
      - "GET /dairy/pasteurizer-runs/{runId}/cip-cycles"
      - "GET /dairy/pasteurizer-runs/{runId}/batches"
      - "GET /dairy/distribution-routes/{id}"

  - name: StateInspector
    description: "State regulatory inspector; manages Grade A permits and reviews records"
    identity: opaque
    exclusive_operations:
      - "POST /dairy/grade-a-permits"
      - "POST /dairy/grade-a-permits/{id}/record-inspection"
      - "POST /dairy/grade-a-permits/{id}/suspend"
      - "POST /dairy/grade-a-permits/{id}/reinstate"
      - "POST /dairy/grade-a-permits/{id}/revoke"
    shared_operations:
      - "GET /dairy/producers"
      - "GET /dairy/tanker-receipts"
      - "GET /dairy/tanker-receipts/{id}"
      - "GET /dairy/producers/{producerId}/settlements"
      - "GET /dairy/producers/{producerId}/settlements/{id}"
      - "GET /dairy/grade-a-permits/{id}"
      - "GET /dairy/marketing-order-pools/{id}"
