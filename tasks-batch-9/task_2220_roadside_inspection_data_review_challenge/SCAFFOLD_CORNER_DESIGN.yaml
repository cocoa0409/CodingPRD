              captures: { cap_after_verify: $.data.status }
          trigger:
            - call: "POST /corrective-action-plans/${cap1_id}/decision"
              payload: { decision: "ACCEPT", note: "Deciding my own determination." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_bob"
              captures: { e1: $.data.error_id }
            - call: "POST /corrective-action-plans/${cap1_id}/decision"
              payload: { decision: "ACCEPT", note: "Plan accepted after independent review." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { decision: $.data.decision, cap_status: $.data.status }
          assert:
            - "before trigger[0]: CorrectiveActionPlan.${cap1_id}.status == PENDING_DECISION"
            - "before trigger[0]: CorrectiveActionPlan.${cap1_id}.completion_pct == 100.0"
            - "before trigger[0]: Carrier.${c1_id}.fitness_determined_by_user_id == auditor_bob"
            - "trigger[0] -> 403 ERR_SEGREGATION_OF_DUTIES"
            - "after trigger[0]: CorrectiveActionPlan.${cap1_id}.status == PENDING_DECISION"
            - "after trigger[0]: CorrectiveActionPlan.${cap1_id}.decision == null"
            - "after trigger[0]: Carrier.${c1_id}.safety_fitness_status == CONDITIONAL"
            - "trigger[1] -> 200; CorrectiveActionPlan.${cap1_id}.status == ACCEPTED"
            - "after trigger[1]: CorrectiveActionPlan.${cap1_id}.decision == ACCEPT"
            - "after trigger[1]: CorrectiveActionPlan.${cap1_id}.decided_by_user_id == auditor_alice"
            - "after trigger[1]: CorrectiveActionPlan.${cap1_id}.decided_at == 2026-08-01T00:00:00Z"
            - "after trigger[1]: Carrier.${c1_id}.safety_fitness_status == SATISFACTORY"
            - "after trigger[1]: Carrier.${c1_id}.version == ${c1_version} + 1"

