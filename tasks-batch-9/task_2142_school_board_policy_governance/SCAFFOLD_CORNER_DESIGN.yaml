scaffold_corner_design:

  # =======================================================================
  - section: entities
    instances:

      - name: create_policy_returns_201_with_server_minted_identity_and_initial_posture
        claim_type: Creation
        grounds:
          - entities.Policy.fields.code
          - entities.Policy.fields.status
          - entities.Policy.fields.compliance_state
          - endpoints[POST /governance/policies]
        distinguishing_aspect: "A REQUIRED_BY_LAW policy created with all five input fields returns 201 with a bare UUID id (no type prefix), version 1, status UNADOPTED, adopted_version_no null, version_count 0 and compliance_state ACTION_REQUIRED, because an unadopted policy that statute requires is by definition not compliant."
        test_recipe:
          setup:
            - "Empty database; the logical clock rests at the 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /governance/policies"
              payload: { code: "BP-4119", title: "Employee Conflict of Interest", category: "PERSONNEL", legal_requirement_level: "REQUIRED_BY_LAW", manual_section: "4000.19" }
              as: PolicyAnalyst
              captures: { pol: $.data.id, pol_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "response data.id matches the bare UUID form 8-4-4-4-12 with no prefix"
            - "Policy.${pol}.version == 1"
            - "Policy.${pol}.status == UNADOPTED"
            - "Policy.${pol}.adopted_version_no == null"
            - "Policy.${pol}.version_count == 0"
            - "Policy.${pol}.compliance_state == ACTION_REQUIRED"
            - "response meta.api_request_id and meta.api_request_timestamp are present and response_type == object"

      - name: create_local_discretion_policy_starts_compliant
        claim_type: Computed Fields
        grounds:
          - calculations.policy_compliance_state
          - entities.Policy.fields.legal_requirement_level
          - entities.Policy.fields.compliance_state
        distinguishing_aspect: "The unadopted-and-required branch of the compliance ladder fires only for REQUIRED_BY_LAW: an identical brand-new policy carrying LOCAL_DISCRETION has no mandates, no waivers and a null last_review_date, so it lands on COMPLIANT while the REQUIRED_BY_LAW sibling lands on ACTION_REQUIRED."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /governance/policies"
              payload: { code: "BP-9010", title: "Board Retreat Guidelines", category: "GOVERNANCE", legal_requirement_level: "LOCAL_DISCRETION", manual_section: "9000.10" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Policy.${pol}.compliance_state == COMPLIANT"
            - "Policy.${pol}.open_mandate_count == 0"
            - "Policy.${pol}.overdue_mandate_count == 0"
            - "Policy.${pol}.active_waiver_count == 0"
            - "Policy.${pol}.last_review_date == null"

      - name: get_policy_by_id_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints[GET /governance/policies/{id}]
          - entities.Policy.fields.manual_section
        distinguishing_aspect: "The single-resource read echoes every stored field of the policy created moments earlier, including manual_section and the derived counters, inside the standard object envelope."
        test_recipe:
          setup:
            - "One policy BP-6155 exists."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-6155", title: "Homework and Grading", category: "INSTRUCTION", legal_requirement_level: "RECOMMENDED", manual_section: "6000.55" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
          trigger:
            - call: "GET /governance/policies/${pol}"
              payload: {}
              as: Public
              captures: { code_back: $.data.code }
          assert:
            - "HTTP status == 200"
            - "Policy.${pol}.code == BP-6155"
            - "Policy.${pol}.title == Homework and Grading"
            - "Policy.${pol}.manual_section == 6000.55"
            - "response response_type == object"

      - name: list_policies_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /governance/policies]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three policies stored, limit 2 and offset 0 returns exactly two rows with total_count 3 and has_more true; offset 2 returns one row with has_more false."
        test_recipe:
          setup:
            - "Three policies exist: BP-1000, BP-2000 and BP-3000."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-1000", title: "Policy One", category: "GOVERNANCE", legal_requirement_level: "LOCAL_DISCRETION", manual_section: "1000.10" }
              as: PolicyAnalyst
            - call: "POST /governance/policies"
              payload: { code: "BP-2000", title: "Policy Two", category: "INSTRUCTION", legal_requirement_level: "RECOMMENDED", manual_section: "2000.10" }
              as: PolicyAnalyst
            - call: "POST /governance/policies"
              payload: { code: "BP-3000", title: "Policy Three", category: "STUDENTS", legal_requirement_level: "RECOMMENDED", manual_section: "3000.10" }
              as: PolicyAnalyst
          trigger:
            - call: "GET /governance/policies"
              payload: { limit: 2, offset: 0 }
              as: Public
            - call: "GET /governance/policies"
              payload: { limit: 2, offset: 2 }
              as: Public
          assert:
            - "first trigger call returns exactly 2 items with total_count == 3 and has_more == true"
            - "second trigger call returns exactly 1 item with total_count == 3 and has_more == false"
            - "both responses carry response_type == array"

      - name: get_policy_with_unknown_uuid_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_POLICY_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid UUID that names no stored policy yields ERR_POLICY_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /governance/policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Public
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_POLICY_NOT_FOUND"
            - "response response_type == error"

      - name: create_policy_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting legal_requirement_level, an input field with no declared default, is rejected with ERR_INVALID_REQUEST and HTTP 400 before any uniqueness or business rule is consulted."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /governance/policies"
              payload: { code: "BP-4119", title: "Employee Conflict of Interest", category: "PERSONNEL", manual_section: "4000.19" }
              as: PolicyAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /governance/policies returns total_count == 0"

      - name: create_policy_with_unknown_category_returns_invalid_enum
        claim_type: Type Constraints
        grounds:
          - validations[priority=10]
          - entities.Policy.fields.category
        distinguishing_aspect: "A category value outside {GOVERNANCE, INSTRUCTION, PERSONNEL, STUDENTS, BUSINESS} is rejected with ERR_INVALID_REQUEST and HTTP 400; the enum is closed."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /governance/policies"
              payload: { code: "BP-4119", title: "Employee Conflict of Interest", category: "FACILITIES", legal_requirement_level: "RECOMMENDED", manual_section: "4000.19" }
              as: PolicyAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: create_board_member_with_term_end_before_start_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=10]
          - entities.BoardMember.fields.term_end_date
        distinguishing_aspect: "term_end_date must be strictly after term_start_date; an inverted pair is a shape violation caught at priority 10 with HTTP 400, not a business rule."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2030-01-01T00:00:00Z", term_end_date: "2026-01-01T00:00:00Z", employer_name: "Reyes Dental" }
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: create_meeting_without_public_comment_rule_applies_first_come_capped_default
        claim_type: Defaults
        grounds:
          - entities.Meeting.fields.public_comment_rule
          - entities.Meeting.fields.public_comment_minutes_budget
          - endpoints[POST /governance/meetings]
        distinguishing_aspect: "Omitting public_comment_rule stores FIRST_COME_CAPPED, and a REGULAR meeting's budget is fixed at 30 minutes with remaining initialised to the same 30 before anyone signs up."
        test_recipe:
          setup:
            - "Empty database; clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /governance/meetings"
              payload: { title: "September Regular Meeting", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-10T18:00:00Z" }
              as: BoardClerk
              captures: { m: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Meeting.${m}.public_comment_rule == FIRST_COME_CAPPED"
            - "Meeting.${m}.public_comment_minutes_budget == 30"
            - "Meeting.${m}.public_comment_minutes_remaining == 30"
            - "Meeting.${m}.status == DRAFT"
            - "Meeting.${m}.minutes_status == NOT_DRAFTED"
            - "Meeting.${m}.public_comment_allocation_variant == null"
            - "Meeting.${m}.committee_id == null"

      - name: committee_meeting_without_committee_id_returns_invalid_request
        claim_type: Parent Relationships
        grounds:
          - validations[priority=10]
          - entities.Meeting.fields.scope
          - entities.Meeting.fields.committee_id
        distinguishing_aspect: "committee_id is required exactly when scope == COMMITTEE; a COMMITTEE-scoped meeting with no committee_id is a shape violation returning ERR_INVALID_REQUEST at HTTP 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /governance/meetings"
              payload: { title: "Policy Committee Meeting", scope: "COMMITTEE", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-10T18:00:00Z" }
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: create_policy_version_under_unknown_policy_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_POLICY_NOT_FOUND]
        distinguishing_aspect: "The path policy id is validated at priority 5, before the optimistic-concurrency check at priority 25, so an unknown parent yields ERR_POLICY_NOT_FOUND (404) rather than ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "One real policy exists so a version number can be captured, but the trigger targets a different, non-existent id."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-6155", title: "Homework and Grading", category: "INSTRUCTION", legal_requirement_level: "RECOMMENDED", manual_section: "6000.55" }
              as: PolicyAnalyst
              captures: { pol: $.data.id, pol_v: $.data.version }
          trigger:
            - call: "POST /governance/policies/00000000-0000-4000-8000-000000000000/versions"
              payload: { body_text: "Orphan draft.", summary_of_change: "Orphan", expected_policy_version: "${pol_v}" }
              as: PolicyAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_POLICY_NOT_FOUND"
            - "response data.error_id != ERR_STALE_VERSION"

      - name: conflict_disclosure_list_filtered_by_policy_finds_children_of_that_policy
        claim_type: Creation
        grounds:
          - endpoints[GET /governance/conflict-disclosures]
          - entities.ConflictDisclosure.fields.policy_id
          - entities.ConflictDisclosure.fields.board_member_id
        distinguishing_aspect: "The graph topology's junction row is reachable from either parent: filtering conflict-disclosures by policy_id returns only the disclosure filed against that policy, and filtering by board_member_id returns only that trustee's disclosures."
        test_recipe:
          setup:
            - "Two SEATED trustees and two policies."
            - "bm2 filed a VENDOR disclosure against policy A only."
          setup_api_calls:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 2, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { bm2: $.data.id }
            - call: "POST /governance/policies"
              payload: { code: "BP-3312", title: "Purchasing", category: "BUSINESS", legal_requirement_level: "RECOMMENDED", manual_section: "3000.12" }
              as: PolicyAnalyst
              captures: { pa: $.data.id }
            - call: "POST /governance/policies"
              payload: { code: "BP-6155", title: "Homework and Grading", category: "INSTRUCTION", legal_requirement_level: "RECOMMENDED", manual_section: "6000.55" }
              as: PolicyAnalyst
              captures: { pb: $.data.id }
            - call: "POST /governance/conflict-disclosures"
              payload: { board_member_id: "${bm2}", policy_id: "${pa}", nature: "VENDOR", narrative: "Owns a stake in a district vendor." }
              as: BoardMember
              as_user_id: "${bm2}"
              captures: { cd: $.data.id }
          trigger:
            - call: "GET /governance/conflict-disclosures"
              payload: { policy_id: "${pa}" }
              as: Public
            - call: "GET /governance/conflict-disclosures"
              payload: { policy_id: "${pb}" }
              as: Public
            - call: "GET /governance/conflict-disclosures"
              payload: { board_member_id: "${bm1}" }
              as: Public
          assert:
            - "first trigger call returns total_count == 1 and the single row id == ${cd}"
            - "second trigger call returns total_count == 0"
            - "third trigger call returns total_count == 0"
            - "ConflictDisclosure.${cd}.status == RECUSAL_REQUIRED"

      - name: committee_seat_counters_are_server_derived
        claim_type: Computed Fields
        grounds:
          - entities.Committee.fields.filled_seat_count
          - entities.Committee.fields.vacant_seat_count
        excluded_because:
          difficulty_instance: compensating_invariant / committee_seat_capacity_conserved_across_assignment_and_removal
          rationale: "That instance already asserts filled_seat_count, vacant_seat_count, voting_seat_count and the derived status at three observation points."

  # =======================================================================
  - section: state_machines
    instances:

      - name: new_policy_version_starts_in_draft_with_reading_count_zero
        claim_type: Initial State
        grounds:
          - state_machines.PolicyVersion
          - entities.PolicyVersion.fields.version_no
          - entities.PolicyVersion.fields.policy_version_after
        distinguishing_aspect: "A freshly drafted version is DRAFT with version_no 1, reading_count 0, first_reading_meeting_id null, adopted_at null and effective_date null, and it echoes back policy_version_after == 2 because creating it bumped the parent policy from version 1 to 2."
        test_recipe:
          setup:
            - "One policy BP-6155 at version 1."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-6155", title: "Homework and Grading", category: "INSTRUCTION", legal_requirement_level: "RECOMMENDED", manual_section: "6000.55" }
              as: PolicyAnalyst
              captures: { pol: $.data.id, pol_v: $.data.version }
          trigger:
            - call: "POST /governance/policies/${pol}/versions"
              payload: { body_text: "Draft one.", summary_of_change: "Initial draft", expected_policy_version: "${pol_v}" }
              as: PolicyAnalyst
              captures: { pv1: $.data.id, after: $.data.policy_version_after }
          assert:
            - "HTTP status == 201"
            - "PolicyVersion.${pv1}.status == DRAFT"
            - "PolicyVersion.${pv1}.version_no == 1"
            - "PolicyVersion.${pv1}.reading_count == 0"
            - "PolicyVersion.${pv1}.first_reading_meeting_id == null"
            - "PolicyVersion.${pv1}.adopted_at == null"
            - "PolicyVersion.${pv1}.effective_date == null"
            - "PolicyVersion.${pv1}.policy_version_after == 2"
            - "Policy.${pol}.version_count == 1"

      - name: adjourn_meeting_that_is_still_noticed_returns_invalid_meeting_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Meeting.OPEN_to_ADJOURNED
          - errors[ERR_INVALID_MEETING_STATE]
          - validations[priority=40]
        distinguishing_aspect: "ADJOURNED is declared only from OPEN. Calling adjourn on a NOTICED meeting is rejected with ERR_INVALID_MEETING_STATE and HTTP 409, and the meeting stays NOTICED with adjourned_at null."
        test_recipe:
          setup:
            - "Meeting M is REGULAR, FULL_BOARD, scheduled 2026-09-10T18:00:00Z, and has been NOTICED but never opened."
          setup_api_calls:
            - call: "POST /governance/meetings"
              payload: { title: "September Regular Meeting", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-10T18:00:00Z" }
              as: BoardClerk
              captures: { m: $.data.id }
            - call: "POST /governance/meetings/${m}/notice"
              payload: {}
              as: BoardClerk
          trigger:
            - call: "POST /governance/meetings/${m}/adjourn"
              payload: {}
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_INVALID_MEETING_STATE"
            - "Meeting.${m}.status == NOTICED"
            - "Meeting.${m}.adjourned_at == null"

      - name: posting_notice_twice_returns_invalid_meeting_state
        claim_type: Idempotency
        grounds:
          - state_machines.Meeting.DRAFT_to_NOTICED
          - errors[ERR_INVALID_MEETING_STATE]
        distinguishing_aspect: "The second notice call observes status NOTICED, which is not the declared from-state DRAFT, so it fails with 409 and notice_posted_at keeps the value the first call stamped."
        test_recipe:
          setup:
            - "Meeting M is REGULAR, scheduled 2026-09-10T18:00:00Z, and has already been NOTICED at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /governance/meetings"
              payload: { title: "September Regular Meeting", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-10T18:00:00Z" }
              as: BoardClerk
              captures: { m: $.data.id }
            - call: "POST /governance/meetings/${m}/notice"
              payload: {}
              as: BoardClerk
              captures: { first_notice_at: $.data.notice_posted_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: BoardClerk
          trigger:
            - call: "POST /governance/meetings/${m}/notice"
              payload: {}
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_INVALID_MEETING_STATE"
            - "Meeting.${m}.notice_posted_at == 2026-08-01T00:00:00Z"
            - "Meeting.${m}.agenda_locked_at == 2026-08-01T00:00:00Z"

      - name: notice_posts_every_proposed_agenda_item
        claim_type: Side Effect Execution
        grounds:
          - state_machines.AgendaItem.PROPOSED_to_POSTED
          - state_machines.Meeting.DRAFT_to_NOTICED
          - entities.AgendaItem.fields.sequence_no
        distinguishing_aspect: "One notice call flips every PROPOSED item on that meeting to POSTED in a single cascade, and sequence_no keeps the 1, 2 assigned at creation time rather than being renumbered."
        test_recipe:
          setup:
            - "Meeting M (REGULAR, 2026-09-10T18:00:00Z) is DRAFT with two CONSENT items created in order."
          setup_api_calls:
            - call: "POST /governance/meetings"
              payload: { title: "September Regular Meeting", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-10T18:00:00Z" }
              as: BoardClerk
              captures: { m: $.data.id, m_v: $.data.version }
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${m}", item_type: "CONSENT", title: "Approve warrants", expected_meeting_version: "${m_v}" }
              as: BoardClerk
              captures: { ai1: $.data.id, m_v2: $.data.meeting_version_after }
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${m}", item_type: "CONSENT", title: "Approve field trips", expected_meeting_version: "${m_v2}" }
              as: BoardClerk
              captures: { ai2: $.data.id }
          trigger:
            - call: "POST /governance/meetings/${m}/notice"
              payload: {}
              as: BoardClerk
          assert:
            - "AgendaItem.${ai1}.status == POSTED"
            - "AgendaItem.${ai2}.status == POSTED"
            - "AgendaItem.${ai1}.sequence_no == 1"
            - "AgendaItem.${ai2}.sequence_no == 2"
            - "AgendaItem.${ai1}.requires_public_comment == false"
            - "Meeting.${m}.status == NOTICED"

      - name: board_member_resignation_cascades_to_seats_and_disclosures
        claim_type: Cascade down
        grounds:
          - state_machines.BoardMember.SEATED_to_RESIGNED
          - state_machines.CommitteeAssignment.ACTIVE_to_REMOVED
          - state_machines.ConflictDisclosure.RECUSAL_REQUIRED_to_CLEARED
          - entities.Committee.fields.status
        distinguishing_aspect: "Resigning bm2 fires a four-hop chain in one call: the trustee becomes RESIGNED, their committee seat becomes REMOVED, the committee's voting_seat_count drops below quorum_size so it flips ACTIVE to INQUORATE, and their RECUSAL_REQUIRED disclosure becomes CLEARED with open_recusal_count back to 0."
        test_recipe:
          setup:
            - "Three SEATED trustees; bm1 holds office PRESIDENT."
            - "Committee C1 (seat_capacity 3, quorum_size 2) with bm2 as CHAIR and bm3 as MEMBER, so C1 is ACTIVE with voting_seat_count 2."
            - "bm2 has a FINANCIAL disclosure on policy BP-3312, so it is RECUSAL_REQUIRED."
          setup_api_calls:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 2, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { bm2: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Cara Lin", seat_number: 3, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Lin Architects" }
              as: BoardClerk
              captures: { bm3: $.data.id }
            - call: "POST /governance/committees"
              payload: { name: "Policy Committee", charter_type: "POLICY", seat_capacity: 3, quorum_size: 2 }
              as: BoardClerk
              captures: { c1: $.data.id }
            - call: "POST /governance/committee-assignments"
