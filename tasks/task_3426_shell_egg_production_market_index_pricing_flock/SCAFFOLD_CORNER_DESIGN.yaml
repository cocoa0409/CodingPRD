              captures: { cx_id: $.data.id }
            - call: "POST /api/feed-contracts"
              payload: { complex_id: "${cx_id}", commodity: "CORN", total_tons: 100, basis_cents_per_ton: 2000, spot_reference_cents_per_ton: 17000, delivery_start: "2026-09-01T00:00:00Z", delivery_end: "2026-09-30T00:00:00Z" }
