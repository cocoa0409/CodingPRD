              as_user_id: "eng-1"
              captures: { e_plan: $.data.error_id }
            - call: "GET /signal-ops/requesters/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { e_req: $.data.error_id }
            - call: "POST /signal-ops/complaints/11111111-1111-4111-8111-111111111111/triage"
