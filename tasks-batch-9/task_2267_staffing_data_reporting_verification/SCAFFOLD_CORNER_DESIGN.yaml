            - "QuarterlySubmission.${sub}.status is still VALIDATED and hprd_reported == 1.6000"
            - "GET /submissions/${sub}/findings with status OPEN returns the same 29 CENSUS_INCOMPLETE warnings the first validate raised for 2026-04-02 through 2026-04-30, with no duplicates"

      - name: void_hour_entry_twice_second_call_rejected
        claim_type: idempotency
