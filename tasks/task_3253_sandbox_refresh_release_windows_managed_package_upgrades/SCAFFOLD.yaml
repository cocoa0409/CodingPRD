# =============================================================================
# SCAFFOLD.yaml — task_3253_sandbox_refresh_release_windows_managed_package_upgrades
# Sandbox Refresh, Release Windows & Managed Package Upgrades (Salesforce-like org
# platform administration).
#   §1.0 response envelope | §1.1 entities | §1.2 state machines (+§1.2.1
#   concurrency) | §1.3 calculations | §1.4 validations | §1.5 endpoints |
#   §1.6 errors | §1.7 RBAC
# =============================================================================

scenario: |
  Sandbox Refresh, Release Windows & Managed Package Upgrades (Salesforce):
  organization environments across production, full-copy, partial and developer
  sandboxes with refresh intervals and data masking, seasonal platform releases
  applied on a fixed window schedule with preview instances and opt-in features,
  customer configuration and code testing against a preview release before
  production upgrade, managed package installation, version upgrade and
  dependency conflicts across an organization, governor limits and asynchronous
  processing constraints shaping application design, permission model layering
  across profiles, permission sets and sharing rules with access audits, data
  storage and file storage limits with archival strategies, deployment pipeline
  from sandbox to production with change sets and metadata validation

domain_name: org-platform-admin
api_prefix: /platform

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - version_pinning_on_approval
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert
  entity_count: 11
  state_machine_count: 7
  calculation_count: 9
  validation_count: 14
  endpoint_count: 36
  error_code_count: 24
  role_count: 5

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:
  - name: Environment
    parent: null
    description: |
      An organization environment. PRODUCTION is the single live org; the other
      three types are sandboxes that are refreshed from the production org on a
      fixed interval and may be nested under a parent sandbox (sandbox clone of a
      sandbox). Roll-up storage accounting, release-schedule posture and refresh
      aperture all live on this entity.
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Environment display name; unique across the organization."
        constraints: "non-empty; uniqueness scope = all Environment rows (ERR_DUPLICATE_ENVIRONMENT_NAME is folded into ERR_INVALID_REQUEST uniqueness check)"
      - name: type
        type: enum
        source: input
        description: "PRODUCTION | FULL_COPY | PARTIAL | DEVELOPER. Immutable after creation."
        constraints: "PRODUCTION | FULL_COPY | PARTIAL | DEVELOPER"
      - name: parent_environment_id
        type: string
        source: input
        description: "FK -> Environment.id; the environment this sandbox was cloned from. Null for a top-level PRODUCTION environment."
        default: null
      - name: refresh_interval_days
        type: integer
        source: input
        description: "Days between sandbox refreshes."
        default: 30
        constraints: "1 <= value <= 365"
      - name: last_refresh_at
        type: datetime
        source: system
        description: "Timestamp of the last COMPLETED refresh job on this environment; null until the first refresh completes."
        default: null
      - name: next_refresh_at
        type: datetime
        source: computed
        description: "Computed by calculation refresh_window_next_at (§1.3)."
      - name: masked_field_count
        type: integer
        source: input
        description: "Number of fields covered by the active data-masking rule set."
        default: 0
        constraints: ">= 0"
      - name: storage_cap_bytes
        type: integer
        source: input
        description: "Data + file storage allocation for this environment."
        default: 5242880000
        constraints: "> 0"
      - name: storage_used_bytes
        type: integer
        source: computed
        description: "Sum of StorageLedger.bytes over LIVE ledgers of this environment (§1.3 storage_breach_evaluation)."
      - name: storage_archived_bytes
        type: integer
        source: computed
        description: "Sum of StorageLedger.bytes over ARCHIVED ledgers of this environment."
      - name: storage_total_bytes
        type: integer
        source: computed
        description: "Conserved quantity: storage_used_bytes + storage_archived_bytes. Never changes when a ledger is archived or restored."
      - name: storage_breach
        type: boolean
        source: computed
        description: "True when storage_used_bytes >= storage_cap_bytes (inclusive boundary)."
      - name: storage_headroom_bytes
        type: integer
        source: computed
        description: "storage_total_bytes - storage_cap_bytes. Signed: a negative value means the environment is within its storage contract."
      - name: last_archive_batch_id
        type: string
        source: system
        description: "Identifier of the most recent archive batch applied to this environment; null before the first archive."
        default: null
      - name: permission_layer_total
        type: integer
        source: computed
        description: "Rolled-up count of distinct permission layers held by the operators in scope, recomputed by the permission_layer_diagnostics rule."
        default: 0
      - name: level
        type: integer
        source: system
        description: "Depth in the sandbox clone chain, 1-based. Null for a PRODUCTION environment."
        default: null
      - name: release_status
        type: enum
        source: system
        description: "CONFIG | SCHEDULED | RELEASED (§1.2 state machine)."
      - name: scheduled_release_version
        type: string
        source: input
        description: "Seasonal release version this environment is scheduled onto (e.g. \"SU26\"); null while release_status == CONFIG."
        default: null
      - name: applied_release_version
        type: string
        source: system
        description: "Release version actually applied; set when release_status becomes RELEASED."
        default: null
      - name: release_schedule_mode
        type: enum
        source: input
        description: "MANUAL_FIXED | FLAG_ONLY. Superseded by a later config change on the same environment."
        default: MANUAL_FIXED
        constraints: "MANUAL_FIXED | FLAG_ONLY"
      - name: aperture_limit
        type: integer
        source: input
        description: "Rolling refresh aperture configured on the environment."
        default: 2
        constraints: "0 <= value <= 10"
      - name: aperture_used
        type: integer
        source: computed
        description: "Count of RefreshJob rows of this environment with status COMPLETED. Recomputed by the aperture_consumption_evaluation rule."
        default: 0
      - name: aperture_consumed
        type: boolean
        source: computed
        description: "True when the most recent refresh admission was accepted by the aperture gate; the level-1 environment is exempt, so it is always accepted."
        default: true
      - name: release_window_index
        type: integer
        source: computed
        description: "Ordinal position of this environment inside the seasonal release train, recomputed by the release_window_index rule."
        default: 1
      - name: refresh_generation
        type: integer
        source: system
        description: "Monotonic counter bumped once per fully completed refresh cascade."
        default: 0
      - name: installed_version_ids
        type: array
        source: system
        description: "Array of PackageVersion ids currently installed in this environment."
        default: []
      - name: version
        type: integer
        source: system
        description: "Optimistic concurrency version; starts at 1 and increments on every mutation of this environment."

  - name: RefreshJob
    parent: Environment
    description: |
      A single sandbox refresh attempt. Emits the refresh-window reset, the
      aperture consumption and the storage re-evaluation cascades.
    common_fields: true
    fields:
      - name: environment_id
        type: string
        source: input
        description: "FK -> Environment.id; the environment being refreshed."
      - name: partition
        type: enum
        source: input
        description: "FULL | ACCOUNT_PARTIAL. FULL copies all data; ACCOUNT_PARTIAL copies only the requesting account partition."
        constraints: "FULL | ACCOUNT_PARTIAL"
      - name: status
        type: enum
        source: system
        description: "PENDING | MASKING | COMPLETING | COMPLETED | FAILED (§1.2 state machine)."
      - name: masked_field_count
        type: integer
        source: input
        description: "Masking coverage declared for this refresh run."
        default: 0
        constraints: ">= 0"
      - name: consumed_aperture
        type: boolean
        source: system
        description: "Set true only when the job reaches COMPLETED; false on PENDING/MASKING/COMPLETING/FAILED."
        default: false
      - name: supersedes_job_id
        type: string
        source: system
        description: "System pointer to the RefreshJob row this run supersedes; null for the first run. Diagnostic only — never used for ordering or tie-breaks."
        default: null
      - name: version
        type: integer
        source: system
        description: "Optimistic concurrency version; starts at 1."
  - name: PackageVersion
    parent: null
    description: |
      A published version of a managed package, in the vendor's namespace. Forms
      a self-referential upgrade chain (supersedes_version_id). Carries the
      dependency declaration that the installation resolver reads.
    common_fields: true
    fields:
      - name: namespace
        type: string
        source: input
        description: "Managed package namespace; pairs with major_version as the package-version identity used by NEEDS_UPGRADE arithmetic."
        constraints: "non-empty"
      - name: major_version
        type: integer
        source: input
        description: "Major version number."
        constraints: ">= 1"
      - name: name
        type: string
        source: input
        description: "Human label for this version."
      - name: deprecated
        type: boolean
        source: system
        description: "Set true when the publish-batch cascade promotes the next version, or when a version is manually deprecated."
        default: false
      - name: supersedes_version_id
        type: string
        source: input
        description: "FK -> PackageVersion.id; the version this one upgrades from within the same namespace. Null for a first release."
        default: null
      - name: requires_namespace
        type: string
        source: input
        description: "Namespace of the managed package this version depends on; null when there is no dependency."
        default: null
      - name: requires_min_version_id
        type: string
        source: input
        description: "FK -> PackageVersion.id; the minimum version of requires_namespace this version requires."
        default: null
      - name: unlimited_remaining_bytes_dec
        type: string
        source: input
        description: "Remaining-bytes figure read from the managed package metadata blob for a first release; the byte[] for it is allocated once per publish where supersedes_version_id is null."
        default: null
      - name: install_count
        type: integer
        source: computed
        description: "Number of InstalledPackage rows whose package_version_id is this version and whose status is not UNINSTALLED."
      - name: version
        type: integer
        source: system
        description: "Optimistic concurrency version; starts at 1."

  - name: InstalledPackage
    parent: Environment
    description: |
      The installation record that ties a managed package version to one
      environment. Its stale marker makes a component-less upgrade a
      non-no-op, and its installation order is what the OCC race arbitrates.
    common_fields: true
    fields:
      - name: environment_id
        type: string
        source: input
        description: "FK -> Environment.id; the environment the package is installed in."
      - name: package_version_id
        type: string
        source: input
        description: "FK -> PackageVersion.id; the currently installed version."
      - name: namespace
        type: string
        source: system
        description: "Denormalized from the installed PackageVersion.namespace; unique per environment."
      - name: status
        type: enum
        source: system
        description: "INSTALLED | UPGRADED | NEEDS_UPGRADE | UNINSTALLED (§1.2 state machine)."
      - name: stale
        type: boolean
        source: system
        description: "True when a newer non-deprecated version exists in the same namespace; recomputed by the upgrade-candidate calculation."
        default: false
      - name: installed_at
        type: datetime
        source: system
        description: "Timestamp the install or upgrade completed."
      - name: refreshed_at
        type: datetime
        source: system
        description: "Timestamp a refresh job last invalidated this installation; null if never invalidated."
        default: null
      - name: pending_refresh_job_id
        type: string
        source: system
        description: "System pointer to the RefreshJob whose completion invalidated this installation; null after the installation is refreshed. Diagnostic only."
        default: null
      - name: version
        type: integer
        source: system
        description: "Optimistic concurrency version; starts at 1."

  - name: PermissionAssignment
    parent: Environment
    description: |
      One layer of the permission model: a principal (a profile or a permission
      set) granted to an acting user in one environment. sharing_rule_scope is
      the derived field that reconciles from the environment's package state.
    common_fields: true
    fields:
      - name: environment_id
        type: string
        source: input
        description: "FK -> Environment.id; the environment this grant applies in."
      - name: principal_type
        type: enum
        source: input
        description: "PROFILE | PERMISSION_SET."
        constraints: "PROFILE | PERMISSION_SET"
      - name: principal_name
        type: string
        source: input
        description: "Profile name or permission-set name; unique per (environment, user) across the whole requested principal_name array."
      - name: user_id
        type: string
        source: input
        description: "Acting operator identifier the grant attaches to (the X-User-ID value an opaque admin role presents)."
      - name: object_prefix
        type: string
        source: input
        description: "Managed-package object prefix the grant scopes to (e.g. \"acme\"); empty string for org-native objects."
        default: ""
      - name: sharing_rule_scope
        type: enum
        source: computed
        description: "PRIVATE | NAMESPACE_READ | ORG_WIDE. Recomputed from the owning environment's installed package state whenever that state changes."
        default: PRIVATE
        constraints: "PRIVATE | NAMESPACE_READ | ORG_WIDE"
      - name: revoked
        type: boolean
        source: system
        description: "Audit marker; set true only after an audit closes with a REVOKE finding."
        default: false
      - name: version
        type: integer
        source: system
        description: "Optimistic concurrency version; starts at 1."

  - name: MetadataChangeSet
    parent: Environment
    description: |
      A deployment candidate. Its component list is validated against the target
      environment's release status and against the change set's own dependency
      graph, and its digest versions pin at approval time.
    common_fields: true
    fields:
      - name: source_environment_id
        type: string
        source: input
        description: "FK -> Environment.id; the environment the metadata is promoted from."
      - name: target_environment_id
        type: string
        source: input
        description: "FK -> Environment.id; the environment the metadata will be deployed into."
      - name: component_dependencies
        type: array
        source: input
        description: "Array of {component: string, requires: [string], min_version: integer} edges. The requires entries must all appear in the component list."
        default: []
      - name: component_list
        type: array
        source: input
        description: "Array of {component: string, version_tag: integer}. Each version_tag pinned into component_digests at approval."
        default: []
      - name: status
        type: enum
        source: system
        description: "DRAFT | VALIDATED | APPROVED | STALE | DEPLOYED | FAILED (§1.2 state machine)."
      - name: component_digests
        type: object
        source: system
        description: "Map of component name to the version_tag pinned when the change set reached APPROVED; empty until approval."
        default: {}
      - name: validated_at
        type: datetime
        source: system
        description: "Timestamp of the successful POST /platform/change-sets/{id}/validate; null until validated."
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: "Timestamp the change set reached APPROVED; null until approved."
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PlatformAdmin who approved this change set; used by the segregation-of-duties check."
        default: null
      - name: version
        type: integer
        source: system
        description: "Optimistic concurrency version; starts at 1."

  - name: DeploymentJob
    parent: Environment
    description: |
      A single attempt to apply an approved change set to its target
      environment. Names the idempotency key that makes a repeated identical
      request a replay of the earlier job.
    common_fields: true
    fields:
      - name: change_set_id
        type: string
        source: input
        description: "FK -> MetadataChangeSet.id; the change set being deployed."
      - name: idempotency_key
        type: string
        source: input
        description: "Client-supplied replay key; unique per change_set_id."
      - name: status
        type: enum
        source: system
        description: "QUEUED | EXECUTING | SUCCEEDED | FAILED (§1.2 state machine)."
      - name: applied_component_count
        type: integer
        source: system
        description: "Count of change-set components applied; equals the change set's component_list length only on SUCCEEDED."
        default: 0
      - name: validated_digest_match
        type: boolean
        source: system
        description: "True when the change set's pinned component_digests still equal its current component_list version_tags at deploy time."
        default: false
      - name: version
        type: integer
        source: system
        description: "Optimistic concurrency version; starts at 1."

  - name: GovernorLimitRequest
    parent: Environment
    description: |
      A declared asynchronous-processing request (batch job, queueable callout,
      or scheduled job). Carries the acyclic callout graph that validation walks.
    common_fields: true
    fields:
      - name: environment_id
        type: string
        source: input
        description: "FK -> Environment.id; the environment the request is scoped to."
      - name: request_kind
        type: enum
        source: input
        description: "BATCH | QUEUEABLE | SCHEDULED."
        constraints: "BATCH | QUEUEABLE | SCHEDULED"
      - name: scope_count
        type: integer
        source: input
        description: "Number of records the asynchronous scope processes."
        constraints: ">= 0"
      - name: callout_graph
        type: array
        source: input
        description: "Array of {node: string, calls: [node: string]} edges. Cells are consumed at callout_graph depth 6, rejections at depth >= 7."
        default: []
      - name: max_concurrent_jobs
        type: integer
        source: input
        description: "Per-environment ceiling on concurrently executing asynchronous jobs, read by validation governor_async_capacity."
        default: 5
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED (§1.2 state machine)."
      - name: projected_governor_units
        type: integer
        source: computed
        description: "Governor cost projection computed by governor_cost_projection (§1.3)."
      - name: governor_headroom_units
        type: integer
        source: computed
        description: "ORG_GOVERNOR_CEILING_UNITS minus projected_governor_units."
      - name: version
        type: integer
        source: system
        description: "Optimistic concurrency version; starts at 1."

  - name: StorageLedger
    parent: Environment
    description: |
      One storage ledger row, DATA or FILE kind, in a LIVE or ARCHIVED state.
      Archival and restoration are the compensating pair whose invariant is
      Environment.storage_total_bytes.
    common_fields: true
    fields:
      - name: environment_id
        type: string
        source: input
        description: "FK -> Environment.id; the environment whose storage budget the ledger draws on, reachable through GET /platform/environments/{id}/storage-ledgers."
      - name: kind
        type: enum
        source: input
        description: "DATA | FILE. Only FILE ledgers are in scope for archive_batch_size_cap."
        constraints: "DATA | FILE"
      - name: bytes
        type: integer
        source: input
        description: "Size consumed by this ledger row."
        constraints: "> 0"
      - name: rank_index
        type: integer
        source: input
        description: "Client-assigned 1-based ordinal, unique per environment, used to address an archive window. The archive window is the inclusive range [from_rank, to_rank] over rank_index."
        constraints: ">= 1; unique per (environment_id)"
      - name: status
        type: enum
        source: system
        description: "LIVE | ARCHIVED (§1.2 state machine)."
      - name: archived_at
        type: datetime
        source: system
        description: "Timestamp the ledger row was archived; null while LIVE."
        default: null
      - name: archivable
        type: boolean
        source: system
        description: "True when the owning environment's applied_release_version >= STORAGE_ARCHIVE_MIN_RELEASE."
        default: false
      - name: archive_batch_id
        type: string
        source: system
        description: "Groups the ledgers moved by a single archive job; null while LIVE."
      - name: benchmark_outcome
        type: string
        source: computed
        description: "Non-functional benchmark column byte[]; every read returns one byte per archived StorageLedger row of this environment, so the response size grows with the archive batch size rather than staying constant."
        default: null
      - name: version
        type: integer
        source: system
        description: "Optimistic concurrency version; starts at 1."

  - name: AccessAudit
    parent: Environment
    description: |
      A layered-access audit run over one environment. Its findings are graded
      and its overreach_count resolves the PermissionAssignment overreach
      calculation.
    common_fields: true
    fields:
      - name: environment_id
        type: string
        source: input
        description: "FK -> Environment.id; the environment audited."
      - name: reviewed_assignment_ids
        type: array
        source: input
        description: "Array of PermissionAssignment ids in scope for this audit."
        default: []
      - name: status
        type: enum
        source: system
        description: "OPEN | CLOSED (§1.2 state machine)."
      - name: grade
        type: enum
        source: system
        description: "PASS | ATTENTION | BLOCKED, derived from overreach_count at close."
      - name: overreach_count
        type: integer
        source: computed
        description: "Count of in-scope assignments judged to overreach (§1.3 permission_overreach_resolution)."
      - name: finding
        type: enum
        source: input
        description: "REVOKE | RETAIN; required when closing an audit, null while OPEN."
        default: null
        constraints: "REVOKE | RETAIN"
      - name: findings
        type: array
        source: system
        description: "Array of {assignment_id, user_id, overreach: boolean}, one entry per reviewed assignment, populated at close."
        default: []
      - name: closed_at
        type: datetime
        source: system
        description: "Timestamp the audit closed; null while OPEN."
        default: null
      - name: version
        type: integer
        source: system
        description: "Optimistic concurrency version; starts at 1."
# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:
  - entity: Environment
    field: release_status
    initial_state: CONFIG
    terminal_states: []
    shape: cyclic
    note: |
      Cyclic: CONFIG -> SCHEDULED -> RELEASED -> SCHEDULED -> RELEASED -> CONFIG.
      The RELEASED -> CONFIG edge is the release-window reopen (revision loop), so
      the same environment can be re-scheduled onto a later seasonal release.
    transitions:
      - from: CONFIG
        to: SCHEDULED
        trigger: "POST /platform/environments/{id}/schedule-release"
        actor: ReleaseManager
        preconditions:
          - "target_release_version != environment.applied_release_version"
          - "environment.storage_breach == false"
          - "environment.aperture_used < environment.aperture_limit when environment.level >= 2; the level-1 environment is exempt (free aperture)"
        side_effects:
          - "environment.scheduled_release_version = target_release_version"
          - "release_window_index recomputed for the new scheduled_release_version"
          - "increments Environment.version by 1"
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /platform/environments/{id}/apply-release"
        actor: ReleaseManager
        preconditions:
          - "environment.release_status == SCHEDULED"
          - "environment.scheduled_release_version is not null"
          - "no MetadataChangeSet whose target_environment_id == environment.id is in status VALIDATED"
        side_effects:
          - "environment.applied_release_version = environment.scheduled_release_version"
          - "environment.release_status-independent counter: increments Environment.refresh_generation by 1"
          - "HOP 1: every InstalledPackage of this environment with status != UNINSTALLED gets refreshed_at = clock now and re-enters NEEDS_UPGRADE only where upgrade_candidate_evaluation finds a newer non-deprecated candidate, so its stale marker may end false"
          - "HOP 2 (caused by HOP 1's InstalledPackage write): permission_overreach_resolution re-derives PermissionAssignment.sharing_rule_scope to ORG_WIDE for every non-revoked grant in this environment"
          - "HOP 2 (caused by HOP 1's InstalledPackage write): storage_breach_evaluation re-derives StorageLedger.archivable = true for every FILE ledger of this environment"
          - "increments Environment.version by 1"
      - from: SCHEDULED
        to: CONFIG
        trigger: "POST /platform/environments/{id}/open-release-window"
        actor: ReleaseManager
        preconditions:
          - "environment.aperture_used >= 1"
        side_effects:
          - "environment.scheduled_release_version = null"
          - "increments Environment.version by 1"
      - from: RELEASED
        to: CONFIG
        trigger: "POST /platform/environments/{id}/open-release-window"
        actor: ReleaseManager
        preconditions:
          - "environment.aperture_used >= 1"
        side_effects:
          - "environment.scheduled_release_version = null"
          - "increments Environment.version by 1"
      - from: RELEASED
        to: SCHEDULED
        trigger: "POST /platform/environments/{id}/schedule-release"
        actor: ReleaseManager
        preconditions:
          - "target_release_version != environment.applied_release_version"
          - "environment.storage_breach == false"
          - "environment.aperture_used < environment.aperture_limit when environment.level >= 2; the level-1 environment is exempt"
        side_effects:
          - "environment.scheduled_release_version = target_release_version"
          - "increments Environment.version by 1"

  - entity: RefreshJob
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, FAILED]
    shape: branching
    note: |
      Branching fork-join on one entity: PENDING -> MASKING -> COMPLETING -> COMPLETED
      is the happy branch; the MASKING -> FAILED branch terminates without consuming
      aperture. COMPLETING is the join point that emits the refresh cascade.
    transitions:
      - from: PENDING
        to: MASKING
        trigger: "POST /platform/refresh-jobs/{id}/complete-masking"
        actor: EnvironmentAdmin
        preconditions:
          - "refresh_job.status == PENDING"
          - "refresh_job.masked_field_count >= 1"
          - "when the parent environment.type == FULL_COPY: refresh_job.masked_field_count >= 20"
        side_effects:
          - "no aperture consumed (consumed_aperture remains false)"
      - from: MASKING
        to: COMPLETING
        trigger: "POST /platform/refresh-jobs/{id}/complete-refresh"
        actor: EnvironmentAdmin
        preconditions:
          - "refresh_job.status == MASKING"
        side_effects: []
      - from: COMPLETING
        to: COMPLETED
        trigger: "POST /platform/refresh-jobs/{id}/complete-refresh"
        actor: EnvironmentAdmin
        preconditions:
          - "refresh_job.status == COMPLETING"
        side_effects:
          - "increments Environment.version by 1"
          - "HOP 1: environment.last_refresh_at = clock now; environment.refresh_generation += 1; environment.aperture_used recomputed as the count of COMPLETED RefreshJob rows for this environment; refresh_job.consumed_aperture = true"
          - "HOP 1 (same transition, Environment.storage_headroom_bytes): storage_breach_evaluation re-derives environment.storage_used_bytes, environment.storage_total_bytes, environment.storage_headroom_bytes and environment.storage_breach"
          - "HOP 2 (caused by HOP 1's Environment.refresh_generation write): the refresh_invalidates_installations rule recomputes InstalledPackage.refreshed_at = clock now, pending_refresh_job_id = refresh_job.id and stale = true for every non-UNINSTALLED InstalledPackage of this environment"
          - "HOP 2 (caused by HOP 1's Environment write): refresh_window_next_at recomputes environment.next_refresh_at = clock now + environment.refresh_interval_days"
          - "HOP 3 (caused by HOP 2's InstalledPackage write): upgrade_candidate_evaluation re-derives environment.installed_version_ids and re-evaluates package_conflict_resolution for the environment"
      - from: MASKING
        to: FAILED
        trigger: "POST /platform/refresh-jobs/{id}/fail"
        actor: EnvironmentAdmin
        preconditions: []
        side_effects:
          - "refresh_job.consumed_aperture remains false; environment.aperture_used unchanged"

  - entity: InstalledPackage
    field: status
    initial_state: INSTALLED
    terminal_states: [UNINSTALLED]
    shape: cyclic
    note: |
      Cyclic across a refresh/upgrade boundary: INSTALLED -> NEEDS_UPGRADE (raised by
      a refresh or by a released platform version) -> UPGRADED -> NEEDS_UPGRADE again
      when the next refresh or release lands.
    transitions:
      - from: null
        to: INSTALLED
        trigger: "POST /platform/environments/{id}/package-installations"
        actor: ReleaseManager
        preconditions:
          - "the PackageVersion referenced by package_version_id has deprecated == false"
          - "no other InstalledPackage of this environment already carries the same namespace with status != UNINSTALLED"
          - "when the PackageVersion declares requires_namespace: an InstalledPackage of this environment for that namespace exists whose installed PackageVersion.major_version >= requires_min_version's PackageVersion.major_version"
        side_effects:
          - "InstalledPackage.namespace = the installed PackageVersion.namespace"
          - "increments Environment.version by 1"
          - "HOP 1: PackageVersion.install_count recomputed for the newly installed version"
          - "HOP 2 (caused by HOP 1's PackageVersion.install_count write): upgrade_candidate_evaluation re-derives every InstalledPackage.stale of this environment whose namespace shares a PackageVersion chain with the installed version"
          - "HOP 3 (caused by HOP 2's InstalledPackage.stale write): permission_overreach_resolution re-derives PermissionAssignment.sharing_rule_scope to NAMESPACE_READ for every non-revoked grant of this environment whose object_prefix equals the installed namespace"
      - from: INSTALLED
        to: NEEDS_UPGRADE
        trigger: "system (POST /platform/environments/{id}/apply-release; or POST /platform/refresh-jobs/{id}/complete-refresh)"
        actor: system
        preconditions: []
        side_effects:
          - "installed_package.refreshed_at = clock now"
          - "upgrade_candidate_evaluation recomputes installed_package.stale from the environment's installed_version_ids"
      - from: UPGRADED
        to: NEEDS_UPGRADE
        trigger: "system (POST /platform/environments/{id}/apply-release; or POST /platform/refresh-jobs/{id}/complete-refresh)"
        actor: system
        preconditions: []
        side_effects:
          - "installed_package.refreshed_at = clock now"
          - "upgrade_candidate_evaluation recomputes installed_package.stale"
      - from: NEEDS_UPGRADE
        to: UPGRADED
        trigger: "POST /platform/installed-packages/{id}/upgrade"
        actor: ReleaseManager
        preconditions:
          - "the target PackageVersion has deprecated == false"
          - "the target PackageVersion namespace equals installed_package.namespace"
          - "when the target PackageVersion declares requires_namespace: the environment's InstalledPackage for that namespace satisfies target.requires_min_version's PackageVersion.major_version"
        side_effects:
          - "installed_package.package_version_id = target_package_version_id"
          - "installed_package.stale = false; installed_package.refreshed_at = clock now"
          - "increments Environment.version by 1"
          - "HOP 1: PackageVersion.install_count recomputed for the promoted version"
          - "HOP 2 (caused by HOP 1's PackageVersion.install_count write): when the promoted version carries no predecessor-deprecation, the publish-batch deprecation cascade sets deprecated = true on the version listed in installed_package's previous package_version_id"
          - "HOP 3 (caused by HOP 2's PackageVersion.deprecated write): version_dependency_closure re-evaluates every InstalledPackage whose installed version requires the freshly deprecated namespace; affected installations re-enter NEEDS_UPGRADE"
      - from: NEEDS_UPGRADE
        to: UNINSTALLED
        trigger: "POST /platform/installed-packages/{id}/uninstall"
        actor: ReleaseManager
        preconditions:
          - "no other non-UNINSTALLED InstalledPackage of the same environment requires this namespace"
        side_effects:
          - "increments Environment.version by 1"
          - "HOP 1: PackageVersion.install_count recomputed for the removed version"
          - "HOP 2 (caused by HOP 1's PackageVersion.install_count write): upgrade_candidate_evaluation re-derives installed_package.stale for the remaining installations of that namespace"
      - from: INSTALLED
        to: UNINSTALLED
        trigger: "POST /platform/installed-packages/{id}/uninstall"
        actor: ReleaseManager
        preconditions:
          - "no other non-UNINSTALLED InstalledPackage of the same environment requires this namespace"
        side_effects:
          - "increments Environment.version by 1"
          - "HOP 1: PackageVersion.install_count recomputed for the removed version"
          - "HOP 2 (caused by HOP 1's PackageVersion.install_count write): upgrade_candidate_evaluation re-derives installed_package.stale for the remaining installations of that namespace"

  - entity: MetadataChangeSet
    field: status
    initial_state: DRAFT
    terminal_states: [DEPLOYED, FAILED]
    shape: cyclic
    note: |
      Cyclic through approval: DRAFT -> VALIDATED -> APPROVED -> VALIDATED (reopened
      for re-validation after a component edit) -> APPROVED -> DEPLOYED.
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /platform/change-sets/{id}/validate"
        actor: ReleaseManager
        preconditions:
          - "every `requires` target named in component_dependencies also appears as a component in component_list"
          - "component_dependencies is acyclic"
          - "target environment release_status != RELEASED"
        side_effects:
          - "change_set.validated_at = clock now"
      - from: APPROVED
        to: VALIDATED
        trigger: "POST /platform/change-sets/{id}/reopen"
        actor: ReleaseManager
        preconditions:
          - "change_set.status == APPROVED"
        side_effects:
          - "change_set.component_digests = {}; change_set.approved_at = null; change_set.approved_by_user_id = null"
          - "change_set.validated_at = clock now"
      - from: VALIDATED
        to: APPROVED
        trigger: "POST /platform/change-sets/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "change_set.status == VALIDATED"
          - "the approving PlatformAdmin's X-User-ID differs from the X-User-ID recorded on the source environment's most recent MetadataChangeSet approval"
        side_effects:
          - "change_set.component_digests = {component: version_tag for each entry of change_set.component_list}"
          - "change_set.approved_at = clock now; change_set.approved_by_user_id = the approving PlatformAdmin's X-User-ID"
          - "increments Environment.version by 1 on the target environment (MetadataChangeSet lives under the target environment)"
      - from: VALIDATED
        to: DRAFT
        trigger: "system (a re-validation of a VALIDATED change set fails)"
        actor: system
        preconditions: []
        side_effects:
          - "change_set.validated_at = null"
      - from: APPROVED
        to: STALE
        trigger: "system (a component's version_tag in component_list changed after approval)"
        actor: system
        preconditions: []
        side_effects:
          - "change_set.component_digests no longer equals the current component_list version_tags"
      - from: APPROVED
        to: DEPLOYED
        trigger: "system (the change set's DeploymentJob reaches SUCCEEDED)"
        actor: system
        preconditions:
          - "a DeploymentJob referencing this change set has reached status SUCCEEDED"
        side_effects:
          - "change_set remains the pinned reference for the deployment; component_digests unchanged"
      - from: VALIDATED
        to: FAILED
        trigger: "system (validation failure recorded on the change set)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeploymentJob
    field: status
    initial_state: QUEUED
    terminal_states: [SUCCEEDED, FAILED]
    shape: linear
    transitions:
      - from: null
        to: QUEUED
        trigger: "POST /platform/change-sets/{id}/deploy"
        actor: ReleaseManager
        preconditions:
          - "the change set's status == APPROVED"
          - "change_set.component_digests == {component: version_tag for each entry of change_set.component_list}"
        side_effects:
          - "deployment_job.target_environment_id = change_set.target_environment_id"
          - "when a DeploymentJob already exists for this change_set_id with the same idempotency_key, the existing job is returned unchanged and no new row is created"
      - from: QUEUED
        to: EXECUTING
        trigger: "system (dispatch of a queued deployment job)"
        actor: system
        preconditions:
          - "deployment_job.status == QUEUED"
        side_effects: []
      - from: EXECUTING
        to: SUCCEEDED
        trigger: "POST /platform/deployment-jobs/{id}/complete"
        actor: EnvironmentAdmin
        preconditions:
          - "change_set.component_digests == {component: version_tag for each entry of change_set.component_list}"
        side_effects:
          - "deployment_job.applied_component_count = len(change_set.component_list)"
          - "deployment_job.validated_digest_match = true"
          - "HOP 1: the referencing MetadataChangeSet transitions APPROVED -> DEPLOYED and its MetadataChangeSet.version increments by 1"
          - "HOP 2 (caused by HOP 1's MetadataChangeSet write): MetadataChangeSet.approved_at is retained as the version-pinned approval instant and the change set's component_digests remain the pinned reference"
      - from: EXECUTING
        to: FAILED
        trigger: "POST /platform/deployment-jobs/{id}/fail"
        actor: EnvironmentAdmin
        preconditions:
          - "deployment_job.status == EXECUTING"
        side_effects:
          - "deployment_job.applied_component_count remains 0"

  - entity: StorageLedger
    field: status
    initial_state: LIVE
    terminal_states: []
    shape: cyclic
    note: |
      Cyclic compensating pair: LIVE -> ARCHIVED (archive) -> LIVE (restore) ->
      ARCHIVED again. Environment.storage_total_bytes is conserved across the loop.
    transitions:
      - from: LIVE
        to: ARCHIVED
        trigger: "POST /platform/environments/{id}/storage/archive"
        actor: StorageArchivist
        preconditions:
          - "environment.applied_release_version is not null and its release ordinal is >= STORAGE_ARCHIVE_MIN_RELEASE"
          - "every ledger in the closed rank window has archivable == true"
          - "the closed rank window contains at most 3 FILE ledgers"
        side_effects:
          - "each archived storage_ledger.status = ARCHIVED; archived_at = clock now; archive_batch_id = the batch identifier"
          - "increments Environment.version by 1"
          - "HOP 1: storage_breach_evaluation re-derives environment.storage_used_bytes = sum of LIVE StorageLedger.bytes and environment.storage_archived_bytes = sum of ARCHIVED StorageLedger.bytes"
          - "HOP 2 (caused by HOP 1's Environment.storage_used_bytes write): environment.storage_breach, environment.storage_total_bytes and environment.storage_headroom_bytes re-derived"
          - "HOP 2 (caused by HOP 1's Environment write): refresh_window_next_at re-derives environment.next_refresh_at (unchanged when refresh_interval_days is unchanged)"
      - from: ARCHIVED
        to: LIVE
        trigger: "POST /platform/storage-ledgers/{id}/restore"
        actor: StorageArchivist
        preconditions:
          - "storage_ledger.status == ARCHIVED"
          - "environment.storage_breach == false"
        side_effects:
          - "storage_ledger.status = LIVE; archived_at = null; archive_batch_id = null"
          - "increments Environment.version by 1"
          - "HOP 1: storage_breach_evaluation re-derives environment.storage_used_bytes and environment.storage_archived_bytes"
          - "HOP 2 (caused by HOP 1's Environment.storage_used_bytes write): environment.storage_headroom_bytes and environment.storage_total_bytes re-derived"

  - entity: AccessAudit
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /platform/access-audits"
        actor: SecurityAuditor
        preconditions:
          - "every id in reviewed_assignment_ids resolves to a PermissionAssignment whose environment_id == this audit's environment_id"
        side_effects:
          - "audit.overreach_count recomputed by permission_overreach_resolution; audit.grade recomputed"
      - from: OPEN
        to: CLOSED
        trigger: "POST /platform/access-audits/{id}/close"
        actor: SecurityAuditor
        preconditions:
          - "audit.status == OPEN"
          - "audit.finding is REVOKE or RETAIN"
        side_effects:
          - "audit.findings populated with one {assignment_id, user_id, overreach} entry per reviewed assignment"
          - "audit.grade derived from audit.overreach_count"
          - "audit.closed_at = clock now"
          - "when audit.finding == REVOKE: every in-scope PermissionAssignment with overreach == true is set to revoked = true"

  - entity: GovernorLimitRequest
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    shape: cyclic
    note: |
      Cyclic: DRAFT -> SUBMITTED -> REJECTED -> DRAFT (revise and resubmit) ->
      SUBMITTED -> ACCEPTED.
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /platform/governor-limit-requests"
        actor: AppDeveloper
        preconditions: []
        side_effects:
          - "governor_cost_projection recomputes governor_request.projected_governor_units and governor_request.governor_headroom_units"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /platform/governor-limit-requests/{id}/submit"
        actor: AppDeveloper
        preconditions:
          - "governor_request.status == DRAFT"
          - "governor_request.callout_graph is acyclic"
          - "governor_request.callout_graph has depth <= 6"
          - "the count of GovernorLimitRequest rows of this environment in status SUBMITTED is < governor_request.max_concurrent_jobs"
        side_effects:
          - "governor_cost_projection recomputes governor_request.projected_governor_units"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /platform/governor-limit-requests/{id}/reopen"
        actor: AppDeveloper
        preconditions:
          - "governor_request.status == REJECTED"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /platform/governor-limit-requests/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "governor_request.status == SUBMITTED"
          - "governor_request.projected_governor_units + the sum of projected_governor_units over the environment's ACCEPTED requests <= ORG_GOVERNOR_CEILING_UNITS"
        side_effects:
          - "governor_request.governor_headroom_units = ORG_GOVERNOR_CEILING_UNITS - (governor_request.projected_governor_units + the sum of projected_governor_units over the environment's other ACCEPTED requests)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /platform/governor-limit-requests/{id}/reject"
        actor: PlatformAdmin
        preconditions:
          - "governor_request.status == SUBMITTED"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races resolved by OCC on Environment.version)
# =============================================================================

concurrency_rules:
  - rule_id: env-serialize-package-installations
    parent_entity: Environment
    write_endpoint: "POST /platform/environments/{id}/package-installations"
    occ_field: "expected_environment_version"
    description: |
      Installing a managed package into an environment whose version has advanced
      since the client last observed it is rejected. The second installation is
      itself legitimate product behavior — a second namespace may be installed
      into the same environment — so the rejection is decided entirely by the
      stale expected_environment_version the client supplied, not by the
      environment's decidable state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: env-serialize-change-set-creation
    parent_entity: Environment
    write_endpoint: "POST /platform/change-sets"
    occ_field: "expected_environment_version"
    description: |
      Opening a change set against a target environment whose version has
      advanced since the client last observed it is rejected. The new change set
      would legitimately supersede the earlier one under the deployment pipeline
      semantics, so nothing in the environment's decidable state forbids it; the
      stale expected_environment_version is the sole reason for rejection.
    error_id: ERR_STALE_VERSION
    http_status: 412
# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:
  - name: refresh_window_next_at
    description: "Projects when the next sandbox refresh may start."
    trigger: "POST /platform/refresh-jobs/{id}/complete-refresh (COMPLETING -> COMPLETED); POST /platform/environments/{id}/storage/archive; POST /platform/storage-ledgers/{id}/restore"
    algorithm: scheduled_deferred
    formula: |
      anchor = environment.last_refresh_at if environment.last_refresh_at is not null
               else clock.now
      base   = anchor + environment.refresh_interval_days
      curve  = 2 * (environment.refresh_generation mod 3)
      environment.next_refresh_at = base + curve
    input_set: "One Environment row. last_refresh_at is null for an environment that has never completed a refresh, so the projection anchors on the current logical clock instead of a null field."
    constants:
      REFRESH_CURVE_STEP_DAYS: 2
      REFRESH_CURVE_MODULUS: 3
    precision: "whole days; datetimes serialized ISO 8601 UTC"
    variants:
      - name: refresh_window_next_at_unrounded
        when: "The environment has a fixed release_schedule_mode == MANUAL_FIXED, so the generation curve is not applied."
        difference: "Drops `curve` entirely: next_refresh_at = base. For interval 7 and refresh_generation 2 the base result is 2026-09-15T00:00:00Z while the scheduled_deferred variant yields 2026-09-19T00:00:00Z."

  - name: release_window_index
    description: "Ordinal position of an environment inside the seasonal release train."
    trigger: "POST /platform/environments/{id}/schedule-release; POST /platform/environments/{id}/apply-release; POST /platform/environments/{id}/open-release-window"
    algorithm: threshold
    formula: |
      applied_ordinal   = RELEASE_ORDINALS[environment.applied_release_version]   # null when applied_release_version is null
      scheduled_ordinal = RELEASE_ORDINALS[environment.scheduled_release_version]
      if environment.release_status == RELEASED:
          index = max(0, applied_ordinal - LAUNCH_PROTECT_GENERATIONS)
      elif environment.release_status == SCHEDULED:
          index = scheduled_ordinal
      else:
          index = 1
    input_set: "One Environment row. The RELEASED branch reads applied_release_version; the SCHEDULED branch reads scheduled_release_version; the CONFIG branch reads neither."
    constants:
      LAUNCH_PROTECT_GENERATIONS: 2
      RELEASE_ORDINALS: { WI25: 1, SP26: 2, SU26: 3, WI26: 4 }
    precision: "integer"
    variants:
      - name: release_window_index_applied
        when: "Used by the release-posture GET projection once applied_release_version is stamped."
        difference: "Always evaluates the max(0, applied_ordinal - 2) branch. For an environment whose applied_release_version is SU26 (ordinal 3) and whose scheduled_release_version is WI26 (ordinal 4), this variant yields 1."
      - name: release_window_index_scheduled
        when: "Used by the scheduling preview, so a client can see the window it is scheduling into before the release is applied."
        difference: "Always evaluates RELEASE_ORDINALS[scheduled_release_version]. For the same environment this variant yields 4, so the two variants disagree by 3 for identical inputs."

  - name: aperture_consumption_evaluation
    description: "Decides whether a refresh may complete given the environment's rolling reset aperture."
    trigger: "POST /platform/refresh-jobs/{id}/complete-refresh (COMPLETING -> COMPLETED)"
    algorithm: threshold
    formula: |
      before = count of RefreshJob rows where environment_id == environment.id and status == COMPLETED
      after  = before + 1
      gate_applies = (environment.level >= 2)
      admitted     = (not gate_applies) or (after <= environment.aperture_limit)
      environment.aperture_used = after   # only when admitted; a refused completion leaves aperture_used unchanged
    input_set: "RefreshJob rows of one environment in status COMPLETED (a completed count, so a FAILED job is excluded), plus environment.level and environment.aperture_limit."
    constants:
      REFRESH_APERTURE_BASE_LEVEL: 2
    precision: "integer; the comparison is inclusive (after <= aperture_limit)"
    variants:
      - name: aperture_consumed_completion_exclusive
        when: "Not applied by the pinned formula; declared to make the boundary polarity explicit."
        difference: "Uses `after < environment.aperture_limit`. For an environment at level 2 with aperture_limit 2, the pinned inclusive form admits the second completion (after == 2 <= 2, aperture_used 2) while this exclusive form rejects it. The inclusive form is the pinned one."

  - name: governor_cost_projection
    description: "Projects the governor units a declared asynchronous-processing request will consume."
    trigger: "POST /platform/environments/{id}/governor-limit-requests; POST /platform/governor-limit-requests/{id}/submit; POST /platform/governor-limit-requests/{id}/approve"
    algorithm: aggregation
    formula: |
      depth = max over nodes of the longest requires-path length in callout_graph, 0 when callout_graph is empty
      cells = count of nodes in callout_graph reachable from a root node (callout depth >= 1)
      units = governor_request.scope_count * BATCH_SCOPE_COST_UNITS
              + cells * CALLOUT_CELL_COST_UNITS
      governor_request.projected_governor_units = units
      governor_request.governor_headroom_units  = ORG_GOVERNOR_CEILING_UNITS - units
    input_set: "One GovernorLimitRequest row plus its callout_graph edges. Nodes with callout depth 0 are excluded from the synchronous-callout multiplier but still counted in scope_count."
    constants:
      BATCH_SCOPE_COST_UNITS: 2
      CALLOUT_CELL_COST_UNITS: 250
      CALLOUT_DEPTH_CELL_LIMIT: 6
      ORG_GOVERNOR_CEILING_UNITS: 100000
    precision: "integer units"
    variants:
      - name: governor_cost_projection_batch_only
        when: "The environment runs in batch-only asynchronous mode, where synchronous callout cells are not charged."
        difference: "Sets CALLOUT_CELL_COST_UNITS to 0, so units = scope_count * 2. For scope_count 5 with two callout nodes this variant yields 10 where the base yields 510."

  - name: upgrade_candidate_evaluation
    description: "Derives the install set and the stale marker for an environment's managed packages."
    trigger: "POST /platform/environments/{id}/package-installations; POST /platform/installed-packages/{id}/upgrade; POST /platform/refresh-jobs/{id}/complete-refresh; POST /platform/environments/{id}/apply-release"
    algorithm: aggregation
    formula: |
      for each non-UNINSTALLED InstalledPackage row p of environment e with namespace ns:
          candidates = [v for v in PackageVersion
                          if v.deprecated == false
                          and v.supersedes_version_id is not null
                          and chain_root(v.supersedes_version_id) is a PackageVersion in namespace ns]
          if candidates == []:
              p.stale = false                      # empty-candidate fallback; never an error
          else:
              candidate = max(candidates, key=(major_version, created_at ASC))
              p.stale   = candidate.major_version > installed(p).major_version
      e.installed_version_ids = [p.package_version_id for p in e's non-UNINSTALLED InstalledPackage rows]
    input_set: "Only PackageVersion rows with deprecated == false AND supersedes_version_id != null are eligible, so a first release is never a candidate; only InstalledPackage rows whose status is not UNINSTALLED are compared. major_version is strictly increasing inside a single namespace chain, so the created_at ASC tie-break is exercised only when two versions of the same namespace share a major_version."
    constants:
      UPGRADE_COMPARISON_KEY: major_version
    precision: "integer major_version comparison; tie-break created_at ASC"
    variants:
      - name: upgrade_candidate_evaluation_latest_only
        when: "Used when an environment opts into latest-only pinning for a namespace."
        difference: "Reads the maximum eligible candidate across the whole namespace chain instead of the per-installed-row candidate, so a NEEDS_UPGRADE installation with two newer eligible versions reports the newest one."

  - name: package_conflict_resolution
    description: "Picks the managed package version an environment should converge on and reports the losers."
    trigger: "POST /platform/environments/{id}/package-installations; POST /platform/installed-packages/{id}/upgrade; POST /platform/environments/{id}/apply-release"
    algorithm: waterfall_allocation
    formula: |
      entries = [v for v in PackageVersion if v.deprecated == false
                 and an InstalledPackage of environment e references v or a successor of v]
      for each entry v:
          depth(v) = length of the requires chain starting at v
                     (v.requires_namespace -> the InstalledPackage of that namespace
                      -> its requires_namespace -> ...), 0 when requires_namespace is null
      rank(v) = (depth(v), v.major_version)
      winner = entry with the strict maximum rank; ties on the whole rank
               broken by created_at DESC
      losers = entries that are not winner and are not reachable from winner
               through requires_namespace links
    input_set: "Non-deprecated PackageVersion rows of the environment, excluding any version whose InstalledPackage row is UNINSTALLED. depth() is a cycle-free walk because requires_min_version_id must always point at a version whose major_version is strictly lower than its dependent."
    constants:
      CONFLICT_RANK_KEY: [requires_chain_depth, major_version]
      CONFLICT_TIE_BREAK: created_at DESC
    precision: "integer rank tuple"
    variants:
      - name: package_conflict_resolution_install_order
        when: "Used on the audited replay path, where the winner is the earliest install instead of the deepest chain."
        difference: "Ranks by InstalledPackage.installed_at ASC (a recorded timestamp) instead of the (requires_chain_depth, major_version) tuple. For an environment holding acme-core 2 and acme-ui 3 with acme-ui requiring acme-core, the base yields acme-ui 3 while this variant yields the version installed first."

  - name: permission_overreach_resolution
    description: "Resolves the granted layers for one user and grades whether the layered access overreaches."
    trigger: "POST /platform/environments/{id}/permissions; POST /platform/environments/{id}/package-installations (via the InstalledPackage cascade); POST /platform/environments/{id}/apply-release; POST /platform/access-audits"
    algorithm: weighted_scoring
    formula: |
      grants = non-revoked PermissionAssignment rows of environment e with user_id == u
      layers = set()
      if any(g.principal_type == PROFILE for g in grants):            layers.add("PROFILE")
      if any(g.principal_type == PERMISSION_SET for g in grants):     layers.add("PERMISSION_SET")
      installed_ns = {p.namespace for p in e's non-UNINSTALLED InstalledPackage rows}
      if any(g.object_prefix in installed_ns and g.object_prefix != "" for g in grants):
                                                                      layers.add("SHARING")
      layer_sum = len(layers)
      overreach = layer_sum > ADMIN_STANDARD_ACCESS_LAYER_BUDGET      # 3 layers required
      relevant_layer_sum = len(layers)
      block = relevant_layer_sum >= ACCESS_LAYER_BLOCK_DENOMINATOR and u is an acting admin
                                                          # 3 for admins, 2 for standard users
      audit.overreach_count = count of in-scope users with overreach == true
      audit.grade = BLOCKED if audit.overreach_count >= AUDIT_GRADE_BLOCKED_MIN
                    else ATTENTION if audit.overreach_count >= 1
                    else PASS
    input_set: "Only non-revoked PermissionAssignment rows count. SHARING requires object_prefix to equal the namespace of a non-UNINSTALLED InstalledPackage of the same environment; an environment with no installed packages can never produce the SHARING layer."
    constants:
      ADMIN_STANDARD_ACCESS_LAYER_BUDGET: 2
      ACCESS_LAYER_BLOCK_DENOMINATOR_ADMIN: 3
      ACCESS_LAYER_BLOCK_DENOMINATOR_STANDARD: 2
      AUDIT_GRADE_BLOCKED_MIN: 3
    precision: "integer counts and layer sums"
    variants:
      - name: permission_overreach_resolution_admin_budget
        when: "Applied to the acting user of a PlatformAdmin whose grants are all tightened to ADMIN_TIGHTENED."
        difference: "Lowers ADMIN_STANDARD_ACCESS_LAYER_BUDGET to 1, so a user holding PROFILE plus PERMISSION_SET is already judged to overreach where the base formula returns overreach == false (layer_sum 2 is not > 2)."

  - name: storage_breach_evaluation
    description: "Re-derives an environment's storage roll-ups and its breach flag."
    trigger: "POST /platform/environments/{id}/storage-ledgers; POST /platform/environments/{id}/storage/archive; POST /platform/storage-ledgers/{id}/restore; POST /platform/refresh-jobs/{id}/complete-refresh"
    algorithm: aggregation
    formula: |
      environment.storage_used_bytes     = sum(l.bytes for l in e's StorageLedger rows if l.status == LIVE)
      environment.storage_archived_bytes = sum(l.bytes for l in e's StorageLedger rows if l.status == ARCHIVED)
      environment.storage_total_bytes    = storage_used_bytes + storage_archived_bytes   # conserved
      environment.storage_headroom_bytes = storage_total_bytes - environment.storage_cap_bytes
      environment.storage_breach         = storage_used_bytes >= environment.storage_cap_bytes
      archivable_batch_size = count of StorageLedger rows in the closed window with kind == FILE
    input_set: "All StorageLedger rows of the environment, partitioned by status. ARCHIVED rows are excluded from storage_used_bytes but included in storage_total_bytes, which is why the conserved quantity is invariant under archival."
    constants:
      STORAGE_BREACH_COMPARISON: ">="
      ARCHIVE_BATCH_FILE_CAP: 3
    precision: "integer bytes"
    variants:
      - name: storage_breach_evaluation_consumed
        when: "Used by the archival planner to preview the effect of archiving a candidate window."
        difference: "Computes storage_used_bytes as sum of LIVE rows minus the candidate window's bytes, so the preview can show headroom recovering before the archive is committed."

  - name: permission_layer_diagnostics
    description: "Projects the layered-access total for an environment across an asynchronous-processing backlog."
    trigger: "POST /platform/environments/{id}/permissions; POST /_clock/set_current_utc; POST /platform/access-audits"
    algorithm: forward_looking
    formula: |
      layers(g) = number of distinct principal layers where g is a non-revoked grant of user g.user_id
                  in the environment (PROFILE, PERMISSION_SET, SHARING)
      backlog_open = the environment has a SNAPSHOT_START asynchronous-processing request
                     opened from the analytics snapshot
      base = sum over in-scope users of layers(g)
      if backlog_open and clock.now >= SNAPSHOT_DISPATCH_AT:
          environment.permission_layer_total = base + ASYNC_BACKLOG_LAYERS
      elif backlog_open:
          environment.permission_layer_total = base
      else:
          environment.permission_layer_total = base
    input_set: "The environment's non-revoked PermissionAssignment rows plus the SNAPSHOT_START request's own dispatch position. A SNAPSHOT_START request opened from the emergency rollback snapshot has dispatch position at SNAPSHOT_DISPATCH_AT."
    constants:
      ASYNC_BACKLOG_LAYERS: 2
      SNAPSHOT_DISPATCH_AT: "2026-10-05T00:00:00Z"
    precision: "integer"
    variants:
      - name: permission_layer_diagnostics_before
        when: "Read while the logical clock is before SNAPSHOT_DISPATCH_AT, so the dispatch has not been reached."
        difference: "Returns the un-backlogged total. With two in-scope users each holding one layer the result is 2."
      - name: permission_layer_diagnostics_dispatched
        when: "Read once the logical clock has been advanced to or past SNAPSHOT_DISPATCH_AT."
        difference: "Returns base + 2. With the same two users the result is 4, so reading the same environment on the two sides of the dispatch instant yields different totals."
# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present; X-User-Role names a role declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role is listed in the endpoint's roles."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "The addressed resource exists; path templates are resolved left to right, so a missing environment is reported before a missing child of that environment."
    error_id: ERR_ENVIRONMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /environments/... endpoints"
  - priority: 4
    category: existence
    check: "The referenced Sandbox, RefreshJob, PackageVersion, InstalledPackage, MetadataChangeSet, DeploymentJob, GovernorLimitRequest, StorageLedger, AccessAudit or PermissionAssignment row exists."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints addressing a resource by id other than an environment"
  - priority: 5
    category: existence
    check: "The referenced PermissionAssignment user_id resolves to an operator identifier, and every id in AccessAudit.reviewed_assignment_ids belongs to the audited environment."
    error_id: ERR_ACCESS_TRACE_INCOMPLETE
    http_status: 404
    applies_to: "POST /platform/access-audits"
  - priority: 6
    category: state
    check: "environment.release_status permits the requested release action (SCHEDULED required for apply-release, CONFIG or RELEASED required for schedule-release, CONFIG or SCHEDULED or RELEASED with aperture_used >= 1 required for open-release-window)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /platform/environments/{id}/schedule-release; POST /platform/environments/{id}/apply-release; POST /platform/environments/{id}/open-release-window"
  - priority: 7
    category: state
    check: "The resource's status field is one of the states from which the requested action is declared in §1.2 (e.g. refresh_job.status == COMPLETING for complete-refresh, change_set.status == VALIDATED for approve, governor_request.status == SUBMITTED for approve)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /platform/refresh-jobs/{id}/complete-masking; POST /platform/refresh-jobs/{id}/complete-refresh; POST /platform/refresh-jobs/{id}/fail; POST /platform/installed-packages/{id}/upgrade; POST /platform/installed-packages/{id}/uninstall; POST /platform/change-sets/{id}/validate; POST /platform/change-sets/{id}/approve; POST /platform/change-sets/{id}/reopen; POST /platform/deployment-jobs/{id}/complete; POST /platform/deployment-jobs/{id}/fail; POST /platform/access-audits/{id}/close; POST /platform/governor-limit-requests/{id}/submit; POST /platform/governor-limit-requests/{id}/approve; POST /platform/governor-limit-requests/{id}/reject; POST /platform/governor-limit-requests/{id}/reopen; POST /platform/environments/{id}/storage/archive; POST /platform/storage-ledgers/{id}/restore"
  - priority: 8
    category: business_referential
    check: "Every `requires` target named in change_set.component_dependencies appears as a component in change_set.component_list."
    error_id: ERR_MISSING_COMPONENT_DEPENDENCY
    http_status: 422
    applies_to: "POST /platform/change-sets/{id}/validate; POST /platform/change-sets/{id}/deploy"
  - priority: 9
    category: business_referential
    check: "The installed PackageVersion declares requires_namespace and the environment has no non-UNINSTALLED InstalledPackage for that namespace satisfying requires_min_version's major_version."
    error_id: ERR_PACKAGE_DEPENDENCY_UNMET
    http_status: 422
    applies_to: "POST /platform/environments/{id}/package-installations; POST /platform/installed-packages/{id}/upgrade"
  - priority: 10
    category: business_constraint
    check: "change_set.component_dependencies is acyclic, and governor_request.callout_graph is acyclic."
    error_id: ERR_CYCLE_DETECTED
    http_status: 409
    applies_to: "POST /platform/change-sets/{id}/validate; POST /platform/governor-limit-requests/{id}/submit"
  - priority: 11
    category: business_constraint
    check: "The environment already carries an InstalledPackage with the same namespace in a status other than UNINSTALLED."
    error_id: ERR_PACKAGE_ALREADY_INSTALLED
    http_status: 409
    applies_to: "POST /platform/environments/{id}/package-installations"
  - priority: 12
    category: business_constraint
    check: "The target PackageVersion or the version being installed has deprecated == true."
    error_id: ERR_VERSION_DEPRECATED
    http_status: 409
    applies_to: "POST /platform/environments/{id}/package-installations; POST /platform/installed-packages/{id}/upgrade"
  - priority: 13
    category: business_temporal
    check: "The closed archive window [from_rank, to_rank] contains at most 3 StorageLedger rows of kind FILE, and every ledger in it has archivable == true."
    error_id: ERR_ARCHIVE_BATCH_EXCEEDED
    http_status: 422
    applies_to: "POST /platform/environments/{id}/storage/archive"
  - priority: 14
    category: business_temporal
    check: "The environment's applied_release_version is set and its release ordinal is at or past STORAGE_ARCHIVE_MIN_RELEASE."
    error_id: ERR_ARCHIVE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /platform/environments/{id}/storage/archive"
  - priority: 15
    category: business_safety
    check: "The change set's source environment differs from its target environment."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /platform/change-sets"
  - priority: 16
    category: business_safety
    check: "The approving PlatformAdmin's X-User-ID differs from the X-User-ID recorded on the source environment's most recent MetadataChangeSet approval."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /platform/change-sets/{id}/approve"
  - priority: 17
    category: business_safety
    check: "The change set reached APPROVED, its source and target environments differ, and its component_digests still equal the current component_list version_tags."
    error_id: ERR_APPROVAL_STALE
    http_status: 409
    applies_to: "POST /platform/change-sets/{id}/deploy"
  - priority: 18
    category: business_constraint
    check: "The declared masked_field_count is at least 20 when the refresh job's environment type is FULL_COPY."
    error_id: ERR_MASKING_INSUFFICIENT
    http_status: 422
    applies_to: "POST /platform/refresh-jobs/{id}/complete-masking"
  - priority: 19
    category: business_constraint
    check: "The refresh job's environment has a parent_environment_id, and that parent environment's applied_release_version differs from the refreshing environment's applied_release_version, so the completion would cross a release boundary."
    error_id: ERR_RELEASE_MISMATCH
    http_status: 409
    applies_to: "POST /platform/refresh-jobs/{id}/complete-refresh"
  - priority: 20
    category: business_constraint
    check: "change_set.component_list is non-empty."
    error_id: ERR_EMPTY_COMPONENT_LIST
    http_status: 422
    applies_to: "POST /platform/change-sets/{id}/validate; POST /platform/change-sets/{id}/deploy"
  - priority: 21
    category: business_fiscal
    check: "environment.storage_breach == false before the operation commits more storage or releases storage reservation."
    error_id: ERR_STORAGE_BREACH
    http_status: 402
    applies_to: "POST /platform/refresh-jobs/{id}/complete-refresh; POST /platform/environments/{id}/storage/archive; POST /platform/storage-ledgers/{id}/restore"
  - priority: 22
    category: business_fiscal
    check: "environment.aperture_used < environment.aperture_limit when environment.level >= 2."
    error_id: ERR_REFRESH_APERTURE_EXCEEDED
    http_status: 402
    applies_to: "POST /platform/environments/{id}/schedule-release; POST /platform/refresh-jobs/{id}/complete-refresh"
  - priority: 23
    category: business_fiscal
    check: "governor_request.projected_governor_units plus the sum of projected_governor_units over the environment's other ACCEPTED requests does not exceed ORG_GOVERNOR_CEILING_UNITS."
    error_id: ERR_GOVERNOR_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /platform/governor-limit-requests/{id}/approve"
  - priority: 24
    category: business_constraint
    check: "The environment's count of GovernorLimitRequest rows in status SUBMITTED is below governor_request.max_concurrent_jobs."
    error_id: ERR_GOVERNOR_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /platform/governor-limit-requests/{id}/submit"
  - priority: 25
    category: business_constraint
    check: "POST /platform/environments/{id}/schedule-release names a target_release_version that differs from the environment's already-applied release version."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /platform/environments/{id}/schedule-release"
# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Every id in a path template is a server-minted UUID captured from an earlier
# response. GET endpoints return the pagination envelope declared in §1.0.

endpoints:
  # --- Environment -----------------------------------------------------------
  - method: POST
    path: "/platform/environments"
    description: "Provision a new environment. PRODUCTION environments are the only ones that may be top-level; a sandbox names its parent_environment_id and is assigned level = parent.level + 1."
    roles: [PlatformAdmin]
    code: 201
    input: [name, type, "parent_environment_id?", "refresh_interval_days?", "masked_field_count?", "storage_cap_bytes?", "release_schedule_mode?", "aperture_limit?"]
    output: Environment
    side_effects:
      - "Environment.level computed as 1 for type PRODUCTION, otherwise parent.level + 1"
      - "release_window_index recomputed as 1 while release_status == CONFIG"
      - "Environment.version initialised to 1"

  - method: GET
    path: "/platform/environments/{id}"
    description: "Read one environment including its release posture, storage roll-ups and permission_layer_total."
    roles: &read_roles [PlatformAdmin, ReleaseManager, EnvironmentAdmin, StorageArchivist, SecurityAuditor, AppDeveloper]
    code: 200
    input: []
    output: Environment
    side_effects: []

  - method: GET
    path: "/platform/environments/{id}/sandboxes"
    description: "List the sandboxes cloned from this environment, i.e. the environments whose parent_environment_id is {id}. Always returns an array; a leaf environment returns an empty array."
    roles: *read_roles
    code: 200
    input: []
    output: Environment[]
    side_effects: []

  - method: GET
    path: "/platform/environments/{id}/refresh-jobs"
    description: "List the refresh jobs of this environment, newest first by created_at DESC."
    roles: *read_roles
    code: 200
    input: []
    output: RefreshJob[]
    side_effects: []

  - method: GET
    path: "/platform/environments/{id}/package-installations"
    description: "List the managed package installations of this environment."
    roles: *read_roles
    code: 200
    input: []
    output: InstalledPackage[]
    side_effects: []

  - method: GET
    path: "/platform/environments/{id}/change-sets"
    description: "List the change sets whose target_environment_id is {id}."
    roles: *read_roles
    code: 200
    input: []
    output: MetadataChangeSet[]
    side_effects: []

  - method: GET
    path: "/platform/environments/{id}/governor-limit-requests"
    description: "List the asynchronous-processing requests declared against this environment."
    roles: *read_roles
    code: 200
    input: []
    output: GovernorLimitRequest[]
    side_effects: []

  - method: GET
    path: "/platform/environments/{id}/storage-ledgers"
    description: "List the storage ledgers of this environment; optional status filter selects LIVE or ARCHIVED rows."
    roles: *read_roles
    code: 200
    input: ["status?"]
    output: StorageLedger[]
    side_effects: []

  - method: GET
    path: "/platform/environments/{id}/permissions"
    description: "List the permission assignments of this environment; optional user_id filter narrows to one operator."
    roles: *read_roles
    code: 200
    input: ["user_id?"]
    output: PermissionAssignment[]
    side_effects: []

  - method: GET
    path: "/platform/environments/{id}/access-audits"
    description: "List the access audits run against this environment."
    roles: *read_roles
    code: 200
    input: []
    output: AccessAudit[]
    side_effects: []

  - method: POST
    path: "/platform/environments/{id}/schedule-release"
    description: "Schedule the environment onto a seasonal release version. Valid from CONFIG or RELEASED, which is what makes the release schedule cyclic."
    roles: [ReleaseManager]
    code: 200
    input: [target_release_version]
    output: Environment
    side_effects:
      - "Environment.release_status -> SCHEDULED"
      - "Environment.scheduled_release_version = target_release_version"
      - "release_window_index recomputed for the new scheduled_release_version"
      - "increments Environment.version by 1"

  - method: POST
    path: "/platform/environments/{id}/apply-release"
    description: "Apply the scheduled seasonal release to the environment. Emits the release cascade that invalidates package installations, re-derives sharing scopes and re-derives archival eligibility."
    roles: [ReleaseManager]
    code: 200
    input: []
    output: Environment
    side_effects:
      - "Environment.release_status -> RELEASED"
      - "Environment.applied_release_version = Environment.scheduled_release_version"
      - "increments Environment.refresh_generation by 1"
      - "HOP 1: every non-UNINSTALLED InstalledPackage of this environment gets refreshed_at = clock now; those with a newer non-deprecated candidate re-enter NEEDS_UPGRADE"
      - "HOP 2 (from the InstalledPackage write): every PermissionAssignment of this environment whose object_prefix equals an installed namespace has sharing_rule_scope re-derived to ORG_WIDE"
      - "HOP 2 (from the InstalledPackage write): storage_breach_evaluation re-derives StorageLedger.archivable"
      - "increments Environment.version by 1"

  - method: POST
    path: "/platform/environments/{id}/open-release-window"
    description: "Reopen the seasonal release window for an environment that has already put at least one refresh through its aperture, returning it to CONFIG so it can be scheduled onto a later release."
    roles: [ReleaseManager]
    code: 200
    input: []
    output: Environment
    side_effects:
      - "Environment.release_status -> CONFIG"
      - "Environment.scheduled_release_version = null"
      - "increments Environment.version by 1"

  - method: POST
    path: "/platform/environments/{id}/package-installations"
    description: "Install a managed package version into the environment. Carries the environment-version precondition for the installation race."
    roles: [ReleaseManager]
    code: 201
    input: [package_version_id, expected_environment_version]
    output: InstalledPackage
    side_effects:
      - "InstalledPackage row created in status INSTALLED; InstalledPackage.namespace denormalized from the installed PackageVersion"
      - "increments Environment.version by 1"
      - "HOP 1: PackageVersion.install_count recomputed"
      - "HOP 2 (from the PackageVersion.install_count write): upgrade_candidate_evaluation re-derives InstalledPackage.stale"
      - "HOP 3 (from the InstalledPackage.stale write): permission_overreach_resolution re-derives PermissionAssignment.sharing_rule_scope"

  - method: POST
    path: "/platform/environments/{id}/permissions"
    description: "Grant a permission layer (profile or permission set) to an operator in the environment. The grant's sharing_rule_scope is derived, never client-supplied."
    roles: [SecurityAuditor, PlatformAdmin]
    code: 201
    input: [principal_type, principal_name, user_id, "object_prefix?"]
    output: PermissionAssignment
    side_effects:
      - "permission_overreach_resolution recomputes PermissionAssignment.sharing_rule_scope for every non-revoked grant of the environment"
      - "increments Environment.version by 1"

  - method: POST
    path: "/platform/environments/{id}/storage-ledgers"
    description: "Register a storage ledger row against the environment's storage budget. Rejected once the environment is in storage breach."
    roles: [StorageArchivist]
    code: 201
    input: [kind, bytes, rank_index]
    output: StorageLedger
    side_effects:
      - "storage_breach_evaluation re-derives Environment.storage_used_bytes, storage_total_bytes, storage_headroom_bytes and storage_breach"
      - "increments Environment.version by 1"

  - method: POST
    path: "/platform/environments/{id}/storage/archive"
    description: "Archive the closed ledger window [from_rank, to_rank]. The window is inclusive at both ends and is capped at 3 FILE ledgers."
    roles: [StorageArchivist]
    code: 200
    input: [from_rank, to_rank]
    output: Environment
    side_effects:
      - "each ledger in the window -> ARCHIVED, archived_at = clock now, archive_batch_id = batch id"
      - "storage_breach_evaluation re-derives Environment.storage_used_bytes and storage_archived_bytes; Environment.storage_total_bytes unchanged"
      - "Environment.storage_headroom_bytes and storage_breach re-derived"
      - "Environment.last_archive_batch_id = the archive batch identifier"
      - "increments Environment.version by 1"

  - method: POST
    path: "/platform/environments/{id}/governor-limit-requests"
    description: "Declare an asynchronous-processing request against the environment."
    roles: [AppDeveloper]
    code: 201
    input: [request_kind, scope_count, "callout_graph?", "max_concurrent_jobs?"]
    output: GovernorLimitRequest
    side_effects:
      - "governor_cost_projection recomputes GovernorLimitRequest.projected_governor_units and governor_headroom_units"
      - "increments Environment.version by 1"

  # --- RefreshJob ------------------------------------------------------------
  - method: POST
    path: "/platform/refresh-jobs"
    description: "Open a sandbox refresh job in status PENDING."
    roles: [EnvironmentAdmin]
    code: 201
    input: [environment_id, partition, "masked_field_count?"]
    output: RefreshJob
    side_effects:
      - "RefreshJob.consumed_aperture initialised to false; consumed_aperture is set true only when the job reaches COMPLETED"

  - method: POST
    path: "/platform/refresh-jobs/{id}/complete-masking"
    description: "Record completed data masking. The FULL_COPY partition type additionally requires a masked_field_count of at least 20."
    roles: [EnvironmentAdmin]
    code: 200
    input: []
    output: RefreshJob
    side_effects:
      - "RefreshJob.status -> MASKING; no aperture is consumed"

  - method: POST
    path: "/platform/refresh-jobs/{id}/complete-refresh"
    description: "Complete the refresh. Emits the three-hop cascade that resets the refresh window, invalidates package installations and re-evaluates the package conflict set."
    roles: [EnvironmentAdmin]
    code: 200
    input: []
    output: RefreshJob
    side_effects:
      - "RefreshJob.status -> COMPLETED; RefreshJob.consumed_aperture = true"
      - "HOP 1: Environment.last_refresh_at = clock now; refresh_generation += 1; aperture_used recomputed as the count of COMPLETED RefreshJob rows"
      - "HOP 1: storage_breach_evaluation re-derives Environment.storage_used_bytes, storage_total_bytes, storage_headroom_bytes and storage_breach"
      - "HOP 2 (from the Environment.refresh_generation write): refresh_invalidates_installations recomputes InstalledPackage.refreshed_at, pending_refresh_job_id and stale"
      - "HOP 2 (from the Environment write): refresh_window_next_at recomputes Environment.next_refresh_at"
      - "HOP 3 (from the InstalledPackage write): upgrade_candidate_evaluation re-derives Environment.installed_version_ids and package_conflict_resolution is re-evaluated"
      - "increments Environment.version by 1"

  - method: POST
    path: "/platform/refresh-jobs/{id}/fail"
    description: "Mark the refresh job failed without consuming aperture."
    roles: [EnvironmentAdmin]
    code: 200
    input: []
    output: RefreshJob
    side_effects:
      - "RefreshJob.status -> FAILED; consumed_aperture stays false; Environment.aperture_used unchanged"

  # --- PackageVersion --------------------------------------------------------
  - method: POST
    path: "/platform/package-versions"
    description: "Publish a managed package version. The supersedes_version_id link extends the namespace's upgrade chain; requires_namespace/requires_min_version_id declare a cross-package dependency."
    roles: [PlatformAdmin]
    code: 201
    input: [namespace, major_version, name, "supersedes_version_id?", "requires_namespace?", "requires_min_version_id?"]
    output: PackageVersion
    side_effects:
      - "PackageVersion.deprecated initialised to false; PackageVersion.install_count recomputed"
      - "the version named by supersedes_version_id is set deprecated = true (or, when that field is null, unlimited_remaining_bytes_dec loaded from the unmasked managed-package metadata blob so publish-time byte[1000000] allocation is exercised)"
      - "HOP 1: every InstalledPackage of every environment whose namespace is this namespace gets refreshed_at = clock now"

  - method: GET
    path: "/platform/package-versions/{id}"
    description: "Read one managed package version."
    roles: *read_roles
    code: 200
    input: []
    output: PackageVersion
    side_effects: []

  - method: GET
    path: "/platform/package-versions/{id}/installations"
    description: "List the managed package installations, across every environment, that reference this package version. Always returns an array; a version nobody has installed returns an empty array."
    roles: *read_roles
    code: 200
    input: []
    output: InstalledPackage[]
    side_effects: []

  - method: GET
    path: "/platform/package-versions/{id}/successors"
    description: "List the package versions that extend this version, covering both the supersedes chain and the dependency floor."
    roles: *read_roles
    code: 200
    input: []
    output: PackageVersion[]
    side_effects: []

  # --- InstalledPackage ------------------------------------------------------
  - method: POST
    path: "/platform/installed-packages/{id}/upgrade"
    description: "Promote an installation to a later version inside the same namespace, provided the target is not deprecated and its declared dependency floor is satisfied."
    roles: [ReleaseManager]
    code: 200
    input: [target_package_version_id]
    output: InstalledPackage
    side_effects:
      - "InstalledPackage.status -> UPGRADED; InstalledPackage.package_version_id = target_package_version_id; stale = false; refreshed_at = clock now"
      - "increments Environment.version by 1"
      - "HOP 1: PackageVersion.install_count recomputed for the promoted version"
      - "HOP 2 (from the PackageVersion.install_count write): the deprecated version in the chain is set deprecated = true"
      - "HOP 3 (from the PackageVersion.deprecated write): upgrade_candidate_evaluation re-evaluates every installation that requires the deprecated namespace"

  - method: POST
    path: "/platform/installed-packages/{id}/uninstall"
    description: "Remove an installation from the environment. Refused while another installation in the same environment still requires the namespace."
    roles: [ReleaseManager]
    code: 200
    input: []
    output: InstalledPackage
    side_effects:
      - "InstalledPackage.status -> UNINSTALLED"
      - "increments Environment.version by 1"
      - "HOP 1: PackageVersion.install_count recomputed for the removed version"
      - "HOP 2 (from the PackageVersion.install_count write): upgrade_candidate_evaluation re-derives the remaining installations of that namespace"

  # --- MetadataChangeSet -----------------------------------------------------
  - method: POST
    path: "/platform/change-sets"
    description: "Open a deployment candidate from a source environment onto a target environment. Carries the target-environment-version precondition for the change-set race."
    roles: [ReleaseManager]
    code: 201
    input: [source_environment_id, target_environment_id, "component_list?", "component_dependencies?", expected_environment_version]
    output: MetadataChangeSet
    side_effects:
      - "MetadataChangeSet row created in status DRAFT; component_digests empty"
      - "increments Environment.version by 1 on the target environment"

  - method: GET
    path: "/platform/change-sets/{id}"
    description: "Read one change set including its pinned component_digests."
    roles: *read_roles
    code: 200
    input: []
    output: MetadataChangeSet
    side_effects: []

  - method: PATCH
    path: "/platform/change-sets/{id}"
    description: "Edit a change set's component list or dependency graph. Editing an APPROVED change set invalidates its pinned digests and moves it to STALE."
    roles: [ReleaseManager]
    code: 200
    input: ["component_list?", "component_dependencies?"]
    output: MetadataChangeSet
    side_effects:
      - "MetadataChangeSet.component_list or component_dependencies replaced"
      - "when MetadataChangeSet.status == APPROVED: MetadataChangeSet.status -> STALE and component_digests no longer equal the component_list version_tags"

  - method: POST
    path: "/platform/change-sets/{id}/validate"
    description: "Validate the component dependency graph against the component list and against the target environment's release posture. Valid from DRAFT or STALE; an APPROVED change set must be reopened before it can be re-validated."
    roles: [ReleaseManager]
    code: 200
    input: []
    output: MetadataChangeSet
    side_effects:
      - "MetadataChangeSet.status -> VALIDATED; validated_at = clock now"

  - method: POST
    path: "/platform/change-sets/{id}/approve"
    description: "Approve a validated change set and pin every component's version_tag into component_digests. The approving operator must differ from the source environment's last approver."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MetadataChangeSet
    side_effects:
      - "MetadataChangeSet.status -> APPROVED; component_digests = {component: version_tag for each component_list entry}"
      - "approved_at = clock now; approved_by_user_id = the approving operator's X-User-ID"
      - "increments Environment.version by 1 on the target environment"

  - method: POST
    path: "/platform/change-sets/{id}/reopen"
    description: "Reopen an approved change set for re-validation, clearing its pinned component digests so a revised component list must be approved again."
    roles: [ReleaseManager]
    code: 200
    input: []
    output: MetadataChangeSet
    side_effects:
      - "MetadataChangeSet.status -> VALIDATED"
      - "MetadataChangeSet.component_digests = {}; approved_at = null; approved_by_user_id = null"
      - "MetadataChangeSet.validated_at = clock now"

  - method: POST
    path: "/platform/change-sets/{id}/deploy"
    description: "Open a deployment job for an approved change set. Repeating the call with the same idempotency_key replays the earlier job instead of opening a new one."
    roles: [ReleaseManager]
    code: 201
    input: [idempotency_key]
    output: DeploymentJob
    side_effects:
      - "DeploymentJob row created in status QUEUED, or the existing job with the same (change_set_id, idempotency_key) returned unchanged"
      - "the deployment job inherits the change set's pinned component_digests"

  - method: GET
    path: "/platform/change-sets/{id}/deployments"
    description: "List the deployment jobs opened for this change set, oldest first by created_at ASC."
    roles: *read_roles
    code: 200
    input: []
    output: DeploymentJob[]
    side_effects: []

  # --- DeploymentJob ---------------------------------------------------------
  - method: POST
    path: "/platform/deployment-jobs/{id}/complete"
    description: "Mark a deployment job succeeded. Refused when the change set's pinned digests no longer match its component version_tags."
    roles: [EnvironmentAdmin]
    code: 200
    input: []
    output: DeploymentJob
    side_effects:
      - "DeploymentJob.status -> SUCCEEDED; applied_component_count = len(change_set.component_list); validated_digest_match = true"
      - "HOP 1: the referencing MetadataChangeSet -> DEPLOYED"
      - "HOP 2 (from the MetadataChangeSet write): component_digests retained as the pinned reference for the deployment"
      - "increments MetadataChangeSet.version by 1"

  - method: POST
    path: "/platform/deployment-jobs/{id}/fail"
    description: "Mark a deployment job failed; no components are counted as applied."
    roles: [EnvironmentAdmin]
    code: 200
    input: []
    output: DeploymentJob
    side_effects:
      - "DeploymentJob.status -> FAILED; applied_component_count stays 0"

  # --- GovernorLimitRequest --------------------------------------------------
  - method: POST
    path: "/platform/governor-limit-requests/{id}/submit"
    description: "Submit a declared asynchronous-processing request for governor review. Requires an acyclic callout graph of depth at most 6."
    roles: [AppDeveloper]
    code: 200
    input: []
    output: GovernorLimitRequest
    side_effects:
      - "GovernorLimitRequest.status -> SUBMITTED"
      - "governor_cost_projection recomputes projected_governor_units"

  - method: POST
    path: "/platform/governor-limit-requests/{id}/approve"
    description: "Accept a submitted asynchronous-processing request against the organization governor ceiling."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: GovernorLimitRequest
    side_effects:
      - "GovernorLimitRequest.status -> ACCEPTED"
      - "GovernorLimitRequest.governor_headroom_units recomputed against ORG_GOVERNOR_CEILING_UNITS"

  # --- StorageLedger ---------------------------------------------------------
  - method: POST
    path: "/platform/storage-ledgers/{id}/restore"
    description: "Restore an archived ledger row to LIVE, releasing its bytes back into the environment's contract but not changing the conserved storage total. Returns the environment roll-up so the caller sees the conserved total immediately."
    roles: [StorageArchivist]
    code: 200
    input: []
    output: Environment
    side_effects:
      - "StorageLedger.status -> LIVE; archived_at = null; archive_batch_id = null"
      - "storage_breach_evaluation re-derives Environment.storage_used_bytes and storage_archived_bytes"
      - "Environment.storage_total_bytes unchanged; storage_headroom_bytes re-derived"
      - "increments Environment.version by 1"

  # --- AccessAudit -----------------------------------------------------------
  - method: POST
    path: "/platform/access-audits"
    description: "Open a layered-access audit over an environment and a set of permission assignments. Every reviewed assignment must belong to the audited environment."
    roles: [SecurityAuditor]
    code: 201
    input: [environment_id, "reviewed_assignment_ids?"]
    output: AccessAudit
    side_effects:
      - "AccessAudit.status initialised to OPEN"
      - "permission_overreach_resolution recomputes AccessAudit.overreach_count and AccessAudit.grade"

  - method: POST
    path: "/platform/access-audits/{id}/close"
    description: "Close an audit with a REVOKE or RETAIN finding. A REVOKE finding revokes every in-scope assignment judged to overreach."
    roles: [SecurityAuditor]
    code: 200
    input: [finding]
    output: AccessAudit
    side_effects:
      - "AccessAudit.status -> CLOSED; closed_at = clock now"
      - "AccessAudit.findings populated with one {assignment_id, user_id, overreach} entry per reviewed assignment"
      - "AccessAudit.grade derived from overreach_count"
      - "when finding == REVOKE: every in-scope PermissionAssignment with overreach == true is set revoked = true"

  # --- Test-driving ----------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call the clock reads the fixed default 2026-09-01T00:00:00Z and never falls back to wall-clock time, so every release-window, refresh-interval and dispatch boundary is deterministic."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "refresh_window_next_at recomputes Environment.next_refresh_at for every environment"
      - "permission_layer_diagnostics recomputes Environment.permission_layer_total"
      - "scheduled/deferred release-window comparisons re-evaluated against the new clock"
# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is missing, or X-User-Role does not name a role declared in §1.7."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_ENVIRONMENT_NOT_FOUND
    http: 404
    condition: "The environment addressed by the path template does not exist."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "The referenced refresh job, package version, installation, change set, deployment job, governor request, storage ledger, access audit or permission assignment does not exist."
  - id: ERR_ACCESS_TRACE_INCOMPLETE
    http: 404
    condition: "An AccessAudit reviewed_assignment_ids entry does not belong to the audited environment, or a PermissionAssignment references an operator id that no grant in that environment uses."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is absent, an enum value is outside its declared set, an integer field is out of its declared range, or Environment.name duplicates an existing environment name."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The addressed resource's status does not permit the requested transition, or the environment's release_status does not permit the requested release action."
  - id: ERR_VERSION_DEPRECATED
    http: 409
    condition: "The managed package version being installed or upgraded to carries deprecated == true."
  - id: ERR_PACKAGE_ALREADY_INSTALLED
    http: 409
    condition: "The environment already carries a non-UNINSTALLED installation for the same managed package namespace."
  - id: ERR_PACKAGE_DEPENDENCY_UNMET
    http: 422
    condition: "The installed or target managed package version declares requires_namespace and no non-UNINSTALLED installation of that namespace satisfies requires_min_version's major_version."
  - id: ERR_MISSING_COMPONENT_DEPENDENCY
    http: 422
    condition: "A component named in change_set.component_dependencies.requires is absent from change_set.component_list."
  - id: ERR_CYCLE_DETECTED
    http: 409
    condition: "change_set.component_dependencies or governor_request.callout_graph contains a cycle."
  - id: ERR_EMPTY_COMPONENT_LIST
    http: 422
    condition: "change_set.component_list is empty when validation or deployment is attempted."
  - id: ERR_RELEASE_MISMATCH
    http: 409
    condition: "A refresh job is completed against an environment whose parent environment sits on a different applied_release_version, so the refresh would cross a release boundary."
  - id: ERR_MASKING_INSUFFICIENT
    http: 422
    condition: "A FULL_COPY refresh job is completed with masked_field_count below 20."
  - id: ERR_ARCHIVE_BATCH_EXCEEDED
    http: 422
    condition: "The closed archive window contains more than 3 StorageLedger rows of kind FILE, or contains a ledger whose archivable marker is false."
  - id: ERR_ARCHIVE_WINDOW_CLOSED
    http: 422
    condition: "Archival is attempted before the environment's applied release reaches STORAGE_ARCHIVE_MIN_RELEASE, so the archival window is not open."
  - id: ERR_REFRESH_APERTURE_EXCEEDED
    http: 402
    condition: "A level-2-or-deeper environment already holds aperture_used >= aperture_limit, so no further refresh may be admitted into the aperture."
  - id: ERR_STORAGE_BREACH
    http: 402
    condition: "The environment's next allocation move or storage release is rejected because storage_used_bytes >= storage_cap_bytes."
  - id: ERR_GOVERNOR_LIMIT_EXCEEDED
    http: 402
    condition: "The projected governor units push the environment's accepted total past ORG_GOVERNOR_CEILING_UNITS, or the environment's concurrent SUBMITTED request count already reaches max_concurrent_jobs."
  - id: ERR_APPROVAL_STALE
    http: 409
    condition: "The change set's pinned component_digests no longer equal its component_list version_tags, or the approving operator reappears as the source environment's last approver."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The same operator identifier is used for both the source-environment role and the approving role of a deployment."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_environment_version does not match the target environment's current version."
  - id: ERR_BUSINESS_RULE_VIOLATION
    http: 409
    condition: "Elapsed logical days since the environment's last completed refresh are below refresh_interval_days + 1, so the sandbox refresh interval has not yet elapsed."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================

roles:
  - name: PlatformAdmin
    description: "Organization platform owner: provisions environments, publishes managed package versions, approves change sets and accepts governor-limit requests."
    identity: opaque
    exclusive_operations:
      - "POST /platform/environments"
      - "POST /platform/package-versions"
      - "POST /platform/change-sets/{id}/approve"
      - "POST /platform/governor-limit-requests/{id}/approve"
      - "POST /platform/governor-limit-requests/{id}/reject"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /platform/environments/{id}/permissions"
      - "All GET /platform/platform/* reads"

  - name: ReleaseManager
    description: "Runs the seasonal release train and the deployment pipeline: schedules and applies releases, installs and upgrades managed packages, authors and deploys change sets."
    identity: opaque
    exclusive_operations:
      - "POST /platform/environments/{id}/schedule-release"
      - "POST /platform/environments/{id}/apply-release"
      - "POST /platform/environments/{id}/package-installations"
      - "POST /platform/installed-packages/{id}/upgrade"
      - "POST /platform/installed-packages/{id}/uninstall"
      - "POST /platform/change-sets"
      - "PATCH /platform/change-sets/{id}"
      - "POST /platform/change-sets/{id}/validate"
      - "POST /platform/change-sets/{id}/reopen"
      - "POST /platform/change-sets/{id}/deploy"
    shared_operations:
      - "All GET /platform/platform/* reads"

  - name: EnvironmentAdmin
    description: "Owns sandbox lifecycle mechanics: opens, masks, completes and fails refresh jobs, and completes or fails deployment jobs."
    identity: opaque
    exclusive_operations:
      - "POST /platform/refresh-jobs"
      - "POST /platform/refresh-jobs/{id}/complete-masking"
      - "POST /platform/refresh-jobs/{id}/complete-refresh"
      - "POST /platform/refresh-jobs/{id}/fail"
      - "POST /platform/deployment-jobs/{id}/complete"
      - "POST /platform/deployment-jobs/{id}/fail"
    shared_operations:
      - "All GET /platform/platform/* reads"

  - name: StorageArchivist
    description: "Manages the data and file storage budget: registers ledger rows, archives a closed ledger window and restores an archived ledger."
    identity: opaque
    exclusive_operations:
      - "POST /platform/environments/{id}/storage-ledgers"
      - "POST /platform/environments/{id}/storage/archive"
      - "POST /platform/storage-ledgers/{id}/restore"
    shared_operations:
      - "All GET /platform/platform/* reads"

  - name: SecurityAuditor
    description: "Audits the layered permission model: grants permission layers, opens layered-access audits and closes them with a REVOKE or RETAIN finding."
    identity: opaque
    exclusive_operations:
      - "POST /platform/access-audits"
      - "POST /platform/access-audits/{id}/close"
    shared_operations:
      - "POST /platform/environments/{id}/permissions"
      - "All GET /platform/platform/* reads"

  - name: AppDeveloper
    description: "Declares asynchronous-processing requests (batch jobs, queueable callouts and scheduled jobs) and submits them for governor review."
    identity: opaque
    exclusive_operations:
      - "POST /platform/environments/{id}/governor-limit-requests"
      - "POST /platform/governor-limit-requests/{id}/submit"
      - "POST /platform/governor-limit-requests/{id}/reopen"
    shared_operations:
      - "All GET /platform/platform/* reads"
