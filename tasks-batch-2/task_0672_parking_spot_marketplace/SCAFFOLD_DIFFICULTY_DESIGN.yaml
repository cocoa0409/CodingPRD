  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_create_blocked_when_driver_suspended_booking_to_driver
        grounds:
          - validations[priority=41]
          - entities.Driver.fields.standing_tier
          - errors[ERR_DRIVER_SUSPENDED]
          - state_machines.ViolationRecord.OPEN_to_CONFIRMED
        distinguishing_aspect: >-
          Booking->Driver dependency: creating a Booking is rejected when the acting
          Driver.standing_tier == SUSPENDED. D13 is suspended by a confirmed NO_SHOW violation
          (assessed 12 >= 10), then a fresh well-funded booking attempt fails with ERR_DRIVER_SUSPENDED.
        test_recipe:
          setup:
            - "Driver D13 funded 10000; an OPEN NO_SHOW ViolationRecord on a prior booking is confirmed, driving D13 to SUSPENDED."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h13@x.com", display_name: "H13", payout_account_ref: "pa_13" }
              as: Anonymous
              captures: { h13: $.data.id }
            - call: "POST /drivers"
