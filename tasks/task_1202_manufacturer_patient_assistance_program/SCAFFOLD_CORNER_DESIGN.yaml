- section: complexity_layers
  instances:
  - name: occ_program_config_stale_update_returns_412
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[program-config-update-occ]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: PUT with the version observed at creation (1) succeeds once (version -> 2); a second PUT still carrying version 1 is rejected ERR_STALE_VERSION.
    test_recipe:
      setup:
      - program created; its version captured from the create response
      setup_api_calls:
      - call: POST /pap/programs
        payload:
          name: PAP-LYMX
          product_name: Lymxtra 100mg
          unit_cost_per_unit: '100.0000'
          max_units_per_enrollment: 100
          max_units_per_shipment: 30
          max_annual_benefit_cents: 900000
          enrollment_duration_days: 90
          screening_validity_days: 90
          appeal_window_days: 30
          renewal_window_days: 30
          lot_expiry_buffer_days: 30
          allow_patient_direct_shipment: true
        as: ProgramAdministrator
        captures:
          prog_id: $.data.id
          prog_v: $.data.version
      trigger:
      - call: PUT /pap/programs/${prog_id}
        payload:
          expected_program_version: ${prog_v}
          max_units_per_shipment: 25
        as: ProgramAdministrator
        captures:
          v2: $.data.version
          new_max: $.data.max_units_per_shipment
      - call: PUT /pap/programs/${prog_id}
        payload:
          expected_program_version: ${prog_v}
          max_units_per_shipment: 20
        as: ProgramAdministrator
        captures:
          err: $.data.error_id
      assert:
      - 'first update succeeds: version == 2 and max_units_per_shipment == 25'
      - 'second update with the stale version: error_id == ERR_STALE_VERSION, http 412; max_units_per_shipment remains 25'
