  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (three different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pp_state_vs_safety_on_rehearsal_create
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair state vs business_safety: a rehearsal create that violates BOTH the posture gate (production
          STOPPED, priority 5) and the certification rule (no valid FIGHT cert, priority 7) must return
          ERR_PRODUCTION_STOPPED — the state error wins.
        test_recipe:
          setup:
            - "Production was ACTIVE, sequence DESIGN_LOCKED, performer REGISTERED with no certifications"
            - "Production then STOPPED"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Prio A Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
