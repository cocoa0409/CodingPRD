# =============================================================================
# §1.9 Scaffold Corner Design — Juried Exhibition & Art Competition Administration
# Breadth probe: every testable claim §1.1–§1.7 declares that §1.8 does not
# already cover. Section values and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; `excluded_because:` stubs cite §1.8
# instances by name.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  # SECTION: entities
  # =========================================================================
  - section: entities
    instances:
      - name: exhibition_creation_returns_declared_config_and_zeroed_ledger
        claim_type: creation
        grounds:
          - endpoints[POST /exhibitions]
          - entities.Exhibition
          - response_envelope
        distinguishing_aspect: "A freshly created Exhibition echoes every input field, starts on both state axes at DRAFT / NOT_STARTED, and every computed money and count field is 0 — not null."
        test_recipe:
          setup: ["Empty database; logical clock left at its 2026-08-01T00:00:00Z startup default."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
          trigger:
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
          assert:
            - "HTTP 201 and the envelope is { success: true, data: {...}, error_id: null, message: null }"
            - "Exhibition.status == DRAFT and Exhibition.settlement_status == NOT_STARTED"
            - "Exhibition.version == 1 and id, created_at, updated_at are all present and non-null"
            - "Exhibition.title == Regional Juried Biennial, season_year == 2026, acceptance_capacity == 3, waitlist_capacity == 1, commission_pct == 0.35, sales_tax_pct == 0.0875"
            - "shortlisted_count == 0, accepted_count == 0, waitlisted_count == 0"
            - "insured_value_total_cents == 0 and insurance_premium_cents == 0 (variant NO_COVERAGE_IN_FORCE, NOT the 25000 floor)"
            - "award_committed_cents == 0, jury_cost_committed_cents == 0, sales_gross_cents == 0, commission_total_cents == 0, sales_tax_total_cents == 0, artist_payable_total_cents == 0, payouts_released_cents == 0, council_retention_cents == 0"

      - name: exhibition_retrieval_returns_stored_configuration
        claim_type: retrieval
        grounds:
          - endpoints[GET /exhibitions/{id}]
          - entities.Exhibition
        distinguishing_aspect: "GET /exhibitions/{id} returns the same row the create call returned, including the three jury weights that must sum to 1.00, with no field dropped or renamed."
        test_recipe:
          setup: ["One DRAFT Exhibition created by the CallManager."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id, ex_created: $.data.created_at } }
          trigger:
            - { call: "GET /exhibitions/${ex_id}", payload: {}, as: Registrar }
          assert:
            - "HTTP 200 and data.id == ${ex_id}"
            - "score_weight_technique == 0.4, score_weight_originality == 0.35, score_weight_relevance == 0.25 (sum exactly 1.00)"
            - "allowed_media_categories == [PAINTING, PHOTOGRAPHY, SCULPTURE] and eligible_state_codes == [CA, OR]"
            - "created_at == ${ex_created} and version == 1 (a read does not bump version)"
            - "the Registrar role may read the exhibition even though it may not create one"

      - name: exhibitions_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /exhibitions]
          - response_envelope
        distinguishing_aspect: "GET /exhibitions with limit=2 reports total_count 3 and has_more true, and the offset=2 page reports has_more false — pagination metadata describes the whole filtered set, not the page."
        test_recipe:
          setup: ["Three Exhibitions created in a pinned order (season_year 2024, 2025, 2026), all DRAFT."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Biennial 2024", season_year: 2024, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING"], eligible_state_codes: ["CA"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000 }, as: CallManager, captures: { ex_a: $.data.id } }
            - { call: "POST /exhibitions", payload: { title: "Biennial 2025", season_year: 2025, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING"], eligible_state_codes: ["CA"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000 }, as: CallManager, captures: { ex_b: $.data.id } }
            - { call: "POST /exhibitions", payload: { title: "Biennial 2026", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING"], eligible_state_codes: ["CA"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000 }, as: CallManager, captures: { ex_c: $.data.id } }
          trigger:
            - { call: "GET /exhibitions?limit=2&offset=0", payload: {}, as: CallManager }
            - { call: "GET /exhibitions?limit=2&offset=2", payload: {}, as: CallManager }
            - { call: "GET /exhibitions?season_year=2025", payload: {}, as: CallManager }
          assert:
            - "page 1: total_count == 3, has_more == true, len(data) == 2, data[0].id == ${ex_a} (created_at ASC)"
            - "page 2: total_count == 3, has_more == false, len(data) == 1, data[0].id == ${ex_c}"
            - "the season_year=2025 filter returns total_count == 1, has_more == false, data[0].id == ${ex_b}"

      - name: exhibition_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /exhibitions/{id}]
          - validations[priority=3]
          - errors[ERR_EXHIBITION_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unpersisted UUID resolves to ERR_EXHIBITION_NOT_FOUND (404) with the entity-scoped code, not a bare 404 or ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
          trigger:
            - { call: "GET /exhibitions/00000000-0000-0000-0000-0000000000ff", payload: {}, as: CallManager, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 with error_id == ERR_EXHIBITION_NOT_FOUND"
            - "the envelope carries success == false and data == null"

      - name: artist_creation_without_email_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /artists]
          - entities.Artist.fields.email
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "email has source input and no default, so omitting it is a body-schema violation caught at priority 6 with ERR_INVALID_REQUEST (400) — before any uniqueness or business rule runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
          trigger:
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", residency_state_code: "CA" }, as: CallManager, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "no Artist row is persisted: GET /artists/{any} cannot be reached and the create returned no id"

      - name: optional_input_fields_omitted_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Exhibition.fields.claim_deadline_days
          - entities.Exhibition.fields.member_discount_pct
          - entities.Artist.fields.member_status
          - entities.Artwork.fields.for_sale
          - entities.WallSegment.fields.lighting_class
        distinguishing_aspect: "Omitting every optional input across four entities yields exactly the declared defaults (30 / 2 / 0.175 / 5 / 1, NON_MEMBER, false, CHECK, STANDARD) rather than null."
        test_recipe:
          setup: ["Empty database; the exhibition POST omits claim_deadline_days, works_included_in_base, member_discount_pct, max_works_per_entry and max_entries_per_artist; the artist POST omits member_status, tax_form_on_file and payout_method; the wall POST omits lighting_class."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
          trigger:
            - { call: "POST /exhibitions", payload: { title: "Defaults Probe", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING"], eligible_state_codes: ["CA"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /artists", payload: { legal_name: "Bo Nakamura", email: "bo@example.org", residency_state_code: "CA" }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /wall-segments", payload: { exhibition_id: "${ex_id}", label: "W1", length_cm: 600, max_weight_kg: 60 }, as: Registrar, captures: { w1_id: $.data.id } }
          assert:
            - "Exhibition.claim_deadline_days == 30, works_included_in_base == 2, member_discount_pct == 0.175, max_works_per_entry == 5, max_entries_per_artist == 1"
            - "Artist.member_status == NON_MEMBER, tax_form_on_file == false, payout_method == CHECK, payout_hold == false"
            - "WallSegment.lighting_class == STANDARD, occupied_cm == 0.0, available_cm == 600.0, loaded_weight_kg == 0.0"

      - name: artwork_longest_edge_and_blind_label_computed_on_attach
        claim_type: computed_fields
        grounds:
          - entities.Artwork.fields.longest_edge_cm
          - entities.Artwork.fields.blind_label
          - entities.Artwork.fields.primary_image_count
          - endpoints[POST /entries/{id}/artworks]
        distinguishing_aspect: "longest_edge_cm is max over all three dimensions (so a deep sculpture is driven by depth_cm, not width or height) and blind_label is <season_year>-<4-digit ordinal by created_at ASC>, so the second attached work is 2026-0002."
        test_recipe:
          setup: ["Exhibition OPEN_FOR_ENTRIES with season_year 2026; one MEMBER artist from CA holding a DRAFT entry."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA", member_status: "MEMBER", tax_form_on_file: true, payout_method: "ACH" }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, as_user_id: "${a1_id}", captures: { e1_id: $.data.id } }
          trigger:
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Flat Panel", medium_category: "PAINTING", width_cm: 90, height_cm: 60, depth_cm: 4, weight_kg: 6, year_created: 2026, declared_value_cents: 400000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_a_id: $.data.id } }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Deep Plinth", medium_category: "SCULPTURE", width_cm: 40, height_cm: 55, depth_cm: 130, weight_kg: 30, year_created: 2026, declared_value_cents: 600000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_b_id: $.data.id } }
            - { call: "POST /artworks/${aw_a_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "e801" }, as: Artist, as_user_id: "${a1_id}" }
          assert:
            - "Artwork.${aw_a_id}.longest_edge_cm == 90.0 and blind_label == 2026-0001"
            - "Artwork.${aw_b_id}.longest_edge_cm == 130.0 — driven by depth_cm, above OVERSIZE_LONG_EDGE_CM 120.0"
            - "Artwork.${aw_b_id}.blind_label == 2026-0002 (ordinal by created_at ASC, zero-padded to 4 digits)"
            - "Artwork.${aw_a_id}.primary_image_count == 1 and Artwork.${aw_b_id}.primary_image_count == 0"
            - "Entry.${e1_id}.works_count == 2 and Entry.${e1_id}.status == DRAFT"

      - name: artwork_status_and_placement_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Artwork.fields.status
          - entities.Artwork.fields.placement_status
          - endpoints[POST /entries/{id}/artworks]
        distinguishing_aspect: "status and placement_status are source system, so a client that posts status ACCEPTED and placement_status INSTALLED still gets DRAFT / UNPLACED — the server never honours a client-supplied lifecycle field."
        test_recipe:
          setup: ["Exhibition OPEN_FOR_ENTRIES; one MEMBER artist from CA holding a DRAFT entry."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA", member_status: "MEMBER", tax_form_on_file: true, payout_method: "ACH" }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, as_user_id: "${a1_id}", captures: { e1_id: $.data.id } }
          trigger:
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Forged Status", medium_category: "PAINTING", width_cm: 90, height_cm: 60, depth_cm: 4, weight_kg: 6, year_created: 2026, declared_value_cents: 400000, status: "ACCEPTED", placement_status: "INSTALLED", sold_price_cents: 999999, certified_mean_score: 10.0 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_id: $.data.id } }
          assert:
            - "the create still succeeds (unknown/system keys are ignored, not rejected) and Artwork.${aw_id}.status == DRAFT"
            - "Artwork.${aw_id}.placement_status == UNPLACED, sold_price_cents == null, certified_mean_score == null"
            - "Artwork.${aw_id}.version == 1 and wall_segment_id == null"

      - name: artwork_invalid_medium_category_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Artwork.fields.medium_category
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A medium_category outside the six-member enum is a schema violation (ERR_INVALID_REQUEST, 400) at priority 6, which outranks the exhibition's allowed_media_categories check (ERR_MEDIA_CATEGORY_NOT_ALLOWED, priority 29)."
        test_recipe:
          setup: ["Exhibition OPEN_FOR_ENTRIES whose allowed_media_categories is [PAINTING, PHOTOGRAPHY, SCULPTURE]; one CA artist holding a DRAFT entry."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
