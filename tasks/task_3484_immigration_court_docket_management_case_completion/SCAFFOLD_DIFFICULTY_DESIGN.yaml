            - "error_id != ERR_APPEAL_WINDOW_EXPIRED even though the clock is strictly past the deadline — the priority-5 state check fires before the priority-8 temporal check"

      - name: no_show_safety_error_beats_constraint_error
        grounds:
          - validations[priority=7]
