  # ---------------------------------------------------------------------
  # Rule 4 — transitive_cascade (two different triggers)
  # ---------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: drought_finalize_critical_cascade
        grounds:
          - state_machines.DroughtAssessment.DRAFT_to_FINALIZED
          - state_machines.Ranch.NORMAL_to_CRITICAL
          - state_machines.HerdGroup.ACTIVE_to_DESTOCKING
          - calculations.destock_required_reduction
        distinguishing_aspect: |
          Depth-4 cascade from a single finalize trigger: finalize mutates Ranch (posture CRITICAL, v+1);
          the posture mutation creates a DestockOrder (link 2); the order's creation flips every ACTIVE
          HerdGroup to DESTOCKING (link 3); subsequent reductions referencing the order mutate the order's
          received_reduction_head (link 4), and verify-compliance closes the loop (COMPLIANT) restoring
          groups to ACTIVE. Each link is caused by the previous link, not by the original request.
        test_recipe:
          setup:
            - "Ranch R (grace 30); pastures P1 base 300, P2 base 200 (DEEDED); groups G1 40 GROWING @800, G2 60 MATURE_COW @1100, G3 20 REPLACEMENT_HEIFER @700 — demand 105.8/mo"
            - "Assessment A: P1 @40, P2 @50 -> pct 44.0 -> CRITICAL, deficit 55.8"
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "Cascade Ranch", hq_state: "NV" }, as: RanchManager, captures: { ranch_id: $.data.id, ranch_v: $.data.version } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "North", acreage: 1500, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 300 }, as: RangeManager, captures: { p1: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "South", acreage: 1000, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 200 }, as: RangeManager, captures: { p2: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Stockers", animal_class: "GROWING", head_count: 40, avg_weight_lbs: 800 }, as: HerdManager, captures: { g1: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Cows", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1100 }, as: HerdManager, captures: { g2: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "Heifers", animal_class: "REPLACEMENT_HEIFER", head_count: 20, avg_weight_lbs: 700 }, as: HerdManager, captures: { g3: $.data.id } }
            - { call: "POST /api/drought-assessments", payload: { ranch_id: "${ranch_id}", assessment_date: "2026-08-01", pasture_measurements: [ { pasture_id: "${p1}", production_pct_of_normal: 40 }, { pasture_id: "${p2}", production_pct_of_normal: 50 } ] }, as: RangeManager, captures: { asm_id: $.data.id } }
          trigger:
            - { call: "POST /api/drought-assessments/${asm_id}/finalize", payload: { expected_ranch_version: "${ranch_v}" }, as: RangeManager }
            - { call: "GET /api/destock-orders?ranch_id=${ranch_id}", payload: {}, as: RangeManager, captures: { order_id: "$.data[0].id" } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "Spare", acreage: 400, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100 }, as: RangeManager, captures: { p3: $.data.id } }
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${p3}", herd_group_id: "${g3}", ranch_id: "${ranch_id}", start_date: "2026-08-05", planned_end_date: "2026-09-04" }, as: RangeManager, captures: { blocked_err: $.data.error_id } }
            - { call: "POST /api/herd-groups/${g1}/reductions", payload: { head_count: 40, reason: "LIQUIDATION", destock_order_id: "${order_id}" }, as: HerdManager }
            - { call: "POST /api/herd-groups/${g2}/reductions", payload: { head_count: 26, reason: "CULL", destock_order_id: "${order_id}" }, as: HerdManager }
            - { call: "POST /api/destock-orders/${order_id}/verify-compliance", payload: {}, as: RangeManager }
          assert:
            - "Link 1: Ranch.${ranch_id}.drought_posture == CRITICAL, version == ${ranch_v} + 1"
            - "Link 2: DestockOrder.${order_id} created with order_status == OPEN, required_reduction_head == 66, deadline_date == 2026-08-31"
            - "Link 3: HerdGroup G1, G2, G3 all have group_status == DESTOCKING immediately after finalize"
            - "Blocking gate: ${blocked_err} == ERR_DESTOCK_ORDER_BLOCKING (new grazing commitment rejected while order OPEN)"
            - "Link 4: after reductions the order received_reduction_head == 66 (40 LIQUIDATION + 26 CULL); G1.head_count == 0 with group_status == LIQUIDATED; G2.head_count == 34"
            - "Close-out: verify-compliance -> order COMPLIANT; G2 and G3 return to group_status == ACTIVE"

