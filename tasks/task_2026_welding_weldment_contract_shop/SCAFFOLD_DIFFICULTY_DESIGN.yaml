              as: Welder
              as_user_id: "${welder_id}"
            - call: "POST /weld-shop/shops/${shop_id}/joints/${joint_b_id}/weld-passes"
              payload: { welder_id: "${welder_id}", qualification_id: "${qual_id}", consumable_lot_id: "${lot_id}", consumable_used_kg: 1, is_repair: false }
              as: Welder
