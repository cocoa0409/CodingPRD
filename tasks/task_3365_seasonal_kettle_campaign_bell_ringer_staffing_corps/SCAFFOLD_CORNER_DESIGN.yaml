      - name: household_size_above_twelve_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - entities.AssistanceApplication.fields.household_size
          - errors[ERR_HOUSEHOLD_SIZE_INVALID]
        distinguishing_aspect: |
          A household_size of 15 is rejected with ERR_HOUSEHOLD_SIZE_INVALID at 422 even though the
          program is OPEN and the clock sits inside the intake window, isolating the range check
          from the state and temporal checks.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z with one OPEN TOY program"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 4 }
              as: PlatformAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /api/campaigns"
              payload: { name: "2026 Christmas Kettle Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000 }
              as: PlatformAdmin
              captures: { campaign_id: "$.data.id" }
            - call: "POST /api/assistance-programs"
              payload: { campaign_id: "${campaign_id}", name: "Christmas Toy Distribution", program_type: "TOY", intake_opens_on: "2026-10-01T00:00:00Z", intake_closes_on: "2026-12-15T23:59:59Z", household_cap: 50, per_household_limit_cents: 25000 }
              as: AssistanceCaseworker
              captures: { program_id: "$.data.id" }
            - call: "POST /api/assistance-programs/${program_id}/open"
              payload: {}
              as: AssistanceCaseworker
          trigger:
            - call: "POST /api/assistance-applications"
              payload: { program_id: "${program_id}", applicant_name: "Oversized Household", household_size: 15, annual_income_cents: 1000000, distribution_site_unit_id: "${unit_id}" }
              as: AssistanceCaseworker
              captures: { err_household: "$.data.error_id" }
          assert:
            - "response error_id == ERR_HOUSEHOLD_SIZE_INVALID with http status 422"
            - "no AssistanceApplication row exists for applicant Oversized Household"

