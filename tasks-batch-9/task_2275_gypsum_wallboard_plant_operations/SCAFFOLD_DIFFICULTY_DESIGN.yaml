      - name: emergency_outage_approval_cascades_line_run_plant
        grounds:
          - state_machines.MaintenanceOutage.PROPOSED_to_APPROVED
          - state_machines.BoardLine.AVAILABLE_to_MAINTENANCE_SCHEDULED
          - state_machines.ProductionRun.SCHEDULED_to_CANCELLED
          - calculations.outage_seasonality_gate
          - calculations.plant_production_posture
        distinguishing_aspect: |
          A different four-hop chain rooted in maintenance rather than quality: approving the
          EMERGENCY outage moves BoardLine AVAILABLE -> MAINTENANCE_SCHEDULED (hop 1), which cancels
          the overlapping SCHEDULED run (hop 2), which releases its 202.500 t reservation from
          Plant.stucco_committed_tons (hop 3), which re-derives production_posture RESTRICTED -> OPEN
